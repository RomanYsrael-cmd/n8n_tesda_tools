  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency\nrequired in GAS METAL ARC WELDING (GMAW) NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n: RECEIVE AND RESPOND TO WORKPLACE\n COMMUNICATION\nUNIT CODE\n\n : 500311101\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\n\n required to receive, respond and act on verbal and\n\n written communication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine spoken\nmessages\n1.1.\nRequired information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2.\nInstructions/information are properly recorded\n1.3.\nInstructions are acted upon immediately in\naccordance with information received\n1.4.\nClarification is sought from workplace supervisor\non all occasions when any instruction/information\nis not clear\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in\nsequence\n2.3 Feedback is given to workplace supervisor based\non the instructions/information received\n\n--- PDF PAGE 5 ---\n11/03/04\nWeldncii11-3\n\n4\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n2. Organizational guidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 6 ---\n11/03/04\nWeldncii11-3\n\n5\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated knowledge of organizational procedures\nfor handling verbal and written communications\n1.2. Received and acted on verbal messages and\ninstructions\n1.3. Demonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nknowledge and\nattitudes\n2.1. Knowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2. Ethical work practices in handling communications\n2.3. Communication process\n3. Underpinning\nskills\n3.1. Conciseness in receiving and clarifying\nmessages/information/communication\n3.2. Accuracy in recording messages/information\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Pens\n4.2. Note pads\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written Evaluation\n5.4. Third Party Report\n\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 7 ---\n11/03/04\nWeldncii11-3\n\n6\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit cover the skills, knowledge and attitudes\nrequired to develop workplace relationship and\ncontribute in workplace activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good relationship\n1.2 Assistance is sought from workgroup when\ndifficulties arise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and\ntasks are made according to organizational\nrequirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 8 ---\n11/03/04\nWeldncii11-3\n\n7\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and\nclients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n4. Providing\nsupport to team\nmembers\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 9 ---\n11/03/04\nWeldncii11-3\n\n8\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals\nare met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own\npersonal work competencies to enhance team goals\nand outcomes\n2. Underpinning\nknowledge\n2.1.\nThe relevant legislation that affects operations,\nespecially with regards to safety\n2.2.\nReasons why cooperation and good relationships are\nimportant\n2.3.\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4.\nUnderstanding how to elicit and interpret feedback\n2.5.\nKnowledge of workgroup member’s responsibilities\nand duties\n2.6.\nImportance of demonstrating respect and empathy in\ndealings with colleagues\n2.7.\nUnderstanding of how to identify and prioritize\npersonal development opportunities and options\n3. Underpinning skills\n3.1.\nAbility to read and understand the organization’s\npolicies and work procedures\n3.2.\nWrite simple instructions for particular routine tasks\n3.3.\nInterpret information gained from correspondence\n3.4.\nCommunication skills to request advice, receive\nfeedback and work with a team\n3.5.\nPlanning skills to organized work priorities and\narrangement\n3.6.\nTechnology skills including the ability to select and\nuse technology appropriate to a task\n3.7.\nAbility to relate to people from a range of social,\ncultural and ethnic backgrounds.\n\n--- PDF PAGE 10 ---\n11/03/04\nWeldncii11-3\n\n9\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1.\nDirect observations of work activities of the\nindividual member in relation to the work activities of\nthe group\n5.2.\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3.\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies\n6. Context for\nassessment\n6.1.\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\n11/03/04\nWeldncii11-3\n\n10\nUNIT OF COMPETENCY: : DEMONSTRATE WORK VALUES\nUNIT CODE\n : 500311103\n\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills, and attitude in\n demonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\n of work\n\n1.1 One’s unique sense of purpose for working and the\nwhy’s of work are identified, reflected on and clearly\ndefined for one’s development as a person and as a\nmember of society.\n1.2 Personal mission is in harmony with company’s values\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent company\nethical standards, policies and guidelines.\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational policy\nand guidelines\n2.3 Personal behavior and relationships with co-workers\nand/or clients are conducted in accordance with ethical\nstandards, policy and guidelines.\n2.4 Company resources are used in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3.2 Work incidents/situations are reported and/or\nresolved in accordance with company\nprotocol/guidelines.\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and\ncompany’s core values.\n4.2 Instructions to co-workers are provided based on\nethical, lawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers\nusing appropriate behavior and language.\n\n--- PDF PAGE 12 ---\n11/03/04\nWeldncii11-3\n\n11\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work values/ethics/ concepts\nMay include but are not limited to:\n1.1 Commitment/ Dedication\n1.2 Sense of urgency\n1.3 Sense of purpose\n1.4 Love for work\n1.5 High motivation\n1.6 Orderliness\n1.7 Reliability\n1.8 Competence\n1.9 Dependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n\n--- PDF PAGE 13 ---\n11/03/04\nWeldncii11-3\n\n12\nVARIABLE\nRANGE\n\n4. Company resources\n\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n\n5. Instructions\n\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 14 ---\n11/03/04\nWeldncii11-3\n\n13\n EVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3 Demonstrated work practices satisfactorily and consistently\nin compliance with industry work ethical standards,\norganizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships with co-\n workers and/or clients consistent with ethical standards,\n policy and guidelines\n1.5 Used company resources in accordance with company\n ethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational policy\n and guidelines on the prevention and reporting of unethical\n conduct/behavior\n2. Underpinning\nknowledge\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender sensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n3. Underpinning\nskills\n3.1 Interpersonal skills\n3.2 Communication skills\n3.3 Self awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Third Party Reports\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\n11/03/04\nWeldncii11-3\n\n14\n UNIT OF COMPETENCY : PRACTICE HOUSEKEEPING PROCEDURES\n\n UNIT CODE : 500311104\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n required to apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\n unnecessary items\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and disposed\nof in accordance with company or office\nprocedures\n2. Arrange items\n2.1 Items are arranged in accordance with\ncompany/office housekeeping procedures\n2.2 Work area is arranged according to job\nrequirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible\nidentification marks based on procedure\n2.5 Safety equipment and evacuation passages are\nkept clear and accessible based on instructions\n3. Maintain work area, tools\n and equipment\n3.1 Cleanliness and orderliness of work area is\nmaintained in accordance with company/office\nprocedures\n3.2 Tools and equipment are cleaned in accordance\nwith manufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and\nequipment in accordance with manufacturer’s\ninstruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized work\nprocess and procedures\n4.1 Materials for common use are maintained in\ndesignated area based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\ncomplied with\n5.3 Work is performed in accordance with\noccupational health and safety (OHS)\nrequirements\n\n--- PDF PAGE 16 ---\n11/03/04\nWeldncii11-3\n\n15\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\n related to work activity\n1.4 Waste materials\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n3. Decorum\n\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 17 ---\n11/03/04\nWeldncii11-3\n\n16\n EVIDENCE GUIDE\n1. Critical aspects of\n competency\n\nAssessment requires evidence that the candidate:\n1.1 Practiced the basic procedures of 5S\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OHS principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning\n skills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary for\nthe activity\n6. Methods of\n assessment\nCompetency must be assessed through:\n5.1 Third party report\n5.2 Interview\n5.3 Demonstration with questioning\n6. Context for\n assessment\n6.1 Competency may be assessed in the work place or in a\n simulated work place setting\n\n--- PDF PAGE 18 ---\n11/03/04\nWeldncii11-3\n\n17\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : APPLY SAFETY PRACTICES\n\nUNIT CODE\n\n: MEE721201\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to apply\n safety practices in the workplace.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify hazardous area\n1.1\n\n1.2\nHazards are identified correctly in accordance\nwith OHS principles.\nSafety signs and symbols are identified and\nadhered to.\n2.\nUse protective clothing\nand devices\n2.1\n\nAppropriate protective clothing and devices\ncorrectly selected and used in accordance with\nOHS requirements or industry/company policy\n3.\nPerform safe handling of\ntools, equipment and\nmaterials\n3.1\n\n3.2\nSafety procedures for pre-use check and\noperation of tools and equipment followed in\naccordance with industry/ company policies.\nTools, equipment and materials handled safely in\naccordance with OHS requirements and industry/\ncompany policies.\n4.\nPerform first aid\n4.1\nFirst aid treatment of injuries are carried out\naccording to recommended procedures\n5.\nUse fire extinguisher\n5.1\nFire extinguisher selected and operated correctly\naccording to the type of fire.\n\n--- PDF PAGE 19 ---\n11/03/04\nWeldncii11-3\n\n18\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hazards\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving parts\n2. Protective clothing and\n devices\n Protective clothing and devices may include but is not\n limited to:\n2.1 safety glasses/goggles\n2.2 safety shoes\n2.3 overalls\n2.4 cap\n2.5 gloves\n3. Injuries\nInjuries may include:\n3.1 burns/scalds\n3.2 fractures\n3.3 cuts and abrasions\n3.4 poisoning\n3.5 foreign bodies in the eye\n3.6 concussion\n3.7 shock\n4. Type of fires\nFires involving or caused by:\n4.1 common combustibles (wood, cloth, paper, rubber\nand plastic)\n4.2 flammable liquids (gasoline, oil, solvents, paints, etc.)\n4.3 energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4.4 combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 20 ---\n11/03/04\nWeldncii11-3\n\n19\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 identified hazardous area\n1.2 used protective clothing and devices\n1.3 handled tools, equipment and materials properly\n1.4 performed first aid\n1.5 used fire extinguisher\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety signs, symbols and alarms\n2.2 Safety precautionary measures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.6 Engineering materials\n2.7 Fire extinguishers\n3.\nUnderpinning\nskills\n3.1 Operating machine tools\n3.2 Handling tools and materials\n3.3 Communicating with superiors and co-workers\n3.4 Interpreting instructions\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\n• Competency may be assessed in the workplace or in\n simulated workplace environment.\n\n--- PDF PAGE 21 ---\n11/03/04\nWeldncii11-3\n\n20\nUNIT OF COMPETENCY : INTERPRET DRAWINGS AND SKETCHES\n\nUNIT CODE\n\n: MEE721202\n\nUNIT DESCRIPTOR\n : This unit covers the competencies required to read and\n interpret drawings and sketches.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify standard\nalphabet of lines\n1.1\n1.2\nAlphabet of lines are identified\nUses of the alphabet of lines are explained\n2.\nIdentify orthographic/\nisometric views\n2.1\n2.2\nOrthographic and isometric drawing are identified\nOrthographic and isometric views are explained\n3.\nInterpret standard\ndrawing symbols,\ndimensional tolerances\nand notations\n3.1\n\n3.2\n\nDrawing symbols are interpreted according to\ndrawing standards\nDimensional tolerances, notations are interpreted\naccording to specifications\n\n--- PDF PAGE 22 ---\n11/03/04\nWeldncii11-3\n\n21\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawing\nDrawing technique include\n1.1 Perspective\n1.2 Exploded view\n1.3 Hidden view technique\n\nProjections\n1.4 First angle projections\n1.5 Third angle projections\n2. Tolerance\n2.1 General tolerance\n2.2 Angular tolerance\n2.3 Geometric tolerance\n\n--- PDF PAGE 23 ---\n11/03/04\nWeldncii11-3\n\n22\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate interpreted\ntechnical drawings and sketches.\n2.\nUnderpinning\nknowledge\n2.1 Alphabet of lines\n2.2 Projections\n2.3 Drawing symbols\n2.4 Dimensioning techniques\n2.5 Tolerances\n3.\nUnderpinning\nskills\n3.1 Communication skills (reading and comprehension)\n3.2 Computation skills\n\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Working drawing or plans or sketches\n4.2 Measuring tools\n4.3 Drawings, sketches or blueprint\n4.4 Specimen parts/components\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 direct observation\n5.2 written or oral short answer questions\n5.3 demonstration\n5.4 project/work sample\n5.5 portfolio\n6.\nContext for\nassessment\n• Competency may be assessed in the workplace or in\n simulated workplace environment.\n\n--- PDF PAGE 24 ---\n11/03/04\nWeldncii11-3\n\n23\nUNIT OF COMPETENCY : PERFORM INDUSTRY CALCULATIONS\n\nUNIT CODE\n\n: MEE721203\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to perform\n basic calculations using the four fundamental\n operation.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform four\nfundamental operations.\n1.1\n\nSimple calculations involving whole numbers,\nmixed numbers, fraction and decimal are\nperformed using four fundamental operations.\n2.\nPerform conversion of\nunits\n2.1\n\n2.2\n\nUnits are converted to the required figure using\nthe given formulae\nEnglish measurements are converted to metric\nmeasurements according to procedure.\n3.\nPerform calculations on\nalgebraic expressions\n3.1\n\n3.2\n\n3.3\n\n3.4\nSimple calculations are performed on algebraic\nexpressions using four fundamental operations.\nSimple transposition of formulae are carried out to\nisolate the variable required, involving the four\nfundamental operations.\nWhere appropriate, formulae are constructed to\nenable problems to be solved.\nEquations involving on unknown solved correctly.\n4.\nCompute percentage\nand ratio\n4.1\nPercentages are computed using appropriate\nformula.\nRatio and proportion are computed using\nappropriate formula.\n\n--- PDF PAGE 25 ---\n11/03/04\nWeldncii11-3\n\n24\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Four fundamental\n operations\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n2. Units\n2.1 Fractions\n2.2 Mixed numbers\n2.3 decimal\n\n--- PDF PAGE 26 ---\n11/03/04\nWeldncii11-3\n\n25\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1 using four fundamental operations\n1.2 involving fractions and mixed numbers\n1.3 involving fractions and decimals\n1.4 on algebraic expressions\n1.5 involving ratio and proportion\n2.\nUnderpinning\nknowledge and\nattitude\n\n2.1 English and metric system of measurements\n2.2 Four fundamental operations\n2.3 Method of transposing formulae\n2.4 Equation formulation\n3.\nUnderpinning\nskills\n3.1 Performing calculations using pen and paper or with the use\nof calculator\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools and facilities appropriate to processes or activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 27 ---\n11/03/04\nWeldncii11-3\n\n26\nUNIT OF COMPETENCY : CONTRIBUTE TO QUALITY SYSTEM\n\nUNIT CODE\n\n: MEE721204\n\nUNIT DESCRIPTOR\n\n: This unit involves competence required to inspect work\n against specification and standards and apply quality\n standards to work.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nInspect work done\n1.1\n\n1.2\n\n1.3\nAppropriate inspections are conducted to ensure\ncompany quality systems and procedures are\nmaintained/ followed.\nJob specifications/work order and quality\nstandards are identified.\nFaults/Defects are identified and rectified\naccording to company procedures.\n2.\nApply quality standards\nto work\n2.1\n\n2.2\n\n2.3\n\n2.4\nInspections are conducted throughout the\nmanufacturing processes to ensure quality\nstandards are maintained.\nAppropriate quality standards are applied\nthroughout the production/fabrication process.\nAll activities are coordinated throughout the\nworkplace to ensure efficient quality work\noutcomes.\nRecords of work quality are maintained according\nto the company requirements.\n3\nProtect company\nproperty and customer\ninterests\n3.1\n\n3.2\nPossible damage to company property is\navoided by adherence to company quality\nprocedures.\nQuality of work is reviewed to ensure customer\nrequirements and company standards are met.\n\n--- PDF PAGE 28 ---\n11/03/04\nWeldncii11-3\n\n27\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Quality system and\n procedures\nQuality system and procedures may be contained in:\n1.1 work instructions\n1.2 safe work procedures\n1.3 product specifications\n1.4 equipment maintenance schedules\n1.5 technical procedures adopted or specifically\nprepared standards\n1.6 company/industry rules\n\n2. Company property\nCompany properties includes :\n2.1 production and/or fabrication equipment\n2.2 hand and power tools\n2.3 OH&S paraphernalia\n2.4 facilities\n\n--- PDF PAGE 29 ---\n11/03/04\nWeldncii11-3\n\n28\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 inspected work done against specification\n1.2 applied quality standards to work\n1.3 protected company property and customer interests\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Communication/feedback methods-written and verbal\n2.2 Company systems, processes and work quality\n requirements\n2.3 Work inspection techniques\n2.4 Quality assurance principles\n2.5 Safety precautionary measures\n2.6 Handling materials, tools and equipment\n3.\nUnderpinning\nskills\n3.1 Problem solving skills\n3.2 Communicating with superiors and co-workers\n3.3 Interpreting job specification and work order\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\n activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 30 ---\n11/03/04\nWeldncii11-3\n\n29\nUNIT OF COMPETENCY : USE HAND TOOLS\n\nUNIT CODE\n\n: MEE721205\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to use hand\n tools.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect hand tools\n1.1\n\n1.2\n\nHand tools selected are appropriate to the\nrequirements of the task.\nUnsafe or defective tools are identified and\nmarked for repair according to procedure.\n2.\nUse hand tools\n2.1\n\n2.2\n\nHand tools are used to produce the desired\noutcomes to job specifications.\nTask performed in accordance with company or\nindustry safety procedure.\n3.\nMaintain hand tools\n3.1\n\n3.2\n\nRoutine maintenance of hand tools is\nundertaken according to standard operating\nprocedures, principles and techniques.\nHand tools are stored in designated location in\naccordance with manufacturer’s\ninstruction/standard operating procedure.\n\n--- PDF PAGE 31 ---\n11/03/04\nWeldncii11-3\n\n30\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hand tools\nHand tools includes but not limited to:\n1.1 Hacksaws\n1.2 Hammers (ball peen, chipping)\n1.3 Punches\n1.4 Screwdrivers\n1.5 Wrenches\n1.6 Scrapers\n1.7 Chisels\n1.8 Gouges\n1.9 Files\n1.10 Clamps\n2. Task\nTasks may include:\n2.1 Adjusting\n2.2 Dismantling\n2.3 Assembling\n2.4 Finishing of item or components\n3. Routine maintenance\nRoutine maintenance may include:\n3.1 Cleaning\n3.2 Lubricating\n3.3 Tightening\n3.4 Simple tool repair\n3.5 Hand sharpening\n\n--- PDF PAGE 32 ---\n11/03/04\nWeldncii11-3\n\n31\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used hand tools appropriate to the job\n1.2 Performed routine maintenance and storage of hand tools\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Types and uses of hand tools\n2.2 Hand tool defects\n2.3 Procedure, principles and techniques in maintenance of\n hand tools\n3.\nUnderpinning\nskills\n3.1 Handling tools and materials\n3.2 Communicating with superiors and co-workers\n3.3 Interpreting instructions\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to the process\n or activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 33 ---\n11/03/04\nWeldncii11-3\n\n32\nUNIT TITLE\n: PREPARE WELD MATERIALS\n\nUNIT CODE\n: MEE721206\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n preparing welding materials.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the range of Variables\n1. Set up cutting\nequipment\n1.1 Cutting equipment should be operational and should\n conform to acceptable OH&S standards\n1.2 Set up cutting equipment is appropriate for operation\nintended\n2. Cut and prepare edge\nof materials\n2.1 Materials are cut based on specified\n dimension/specifications.\n2.2 Task is performed in accordance with company or\nindustry requirements and safety procedure.\n\n3. Clean surfaces and\nedges\n3.1 Surfaces are cleaned to required specifications.\n3.2 Task is performed in accordance with company or\nindustry requirements and safety procedure\n4. Prepare welding\nconsumables\n4.1 Consumables are prepared in accordance with\n required specifications\n4.2 Welding consumables are prepared in accordance with\nmanufacturer’s instructions\n5. Prepare welding\nsafety and protective\nequipment\n5.1 PPE should conform to acceptable OH&S\n requirement and standards\n\n--- PDF PAGE 34 ---\n11/03/04\nWeldncii11-3\n\n33\n\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Materials and\nconsumables\n\n1.1 Mild steel (carbon steel)\n1.2 Alloy steel (level III & IV)\n1.3 Cutting gases\n1.4 Gouging electrodes\n1.5 Grinding/cutting discs\n1.6 Run on/run off, backing plates/ring\n1.7 Cutting accessories\n2. Cut\nCut material using\n2.1 Oxy-acetylene gas cutting equipment (manual and /or\n automatic)\n2.2 Plasma cutting equipment\n2.3 Shearing machine\n2.4 Disc cutter\n3. Specification\nSpecifications based on\n3.1 Welding codes\n3.2 Reference Industry standards\n3.3 Client specification\n4. Cleaned\nSurfaces and edges are cleaned by\n4.1 Grinding or sanding\n4.2 Filing\n4.3 Chemical washing (Degreaser)\n5. Safety procedures\n5.1 Wearing of required PPE\n5.2 Securing oxy-acetylene tanks before, during and after\nuse\n5.3 Checking oxy-acetylene hose for gas leaks\n5.4 Switch off equipment after use\n5.5 Checking electrical equipment and devices\n\n--- PDF PAGE 35 ---\n11/03/04\nWeldncii11-3\n\n34\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Perform edge preparation in accordance with\n WPS and safety procedures\n1.2 Use edge preparation equipment and tools in\n accordance with the requirements or\n manufacturer’s instructions\n2. Underpinning knowledge\n2.1 Interpretation of plans and drawings\n2.2 Selection of appropriate method of edge\n preparation\n2.3 Selection of appropriate cutting equipment,\n accessories and supplies\n2.4 Operation of cutting equipment such as\n mechanical, gas and plasma\n2.5 Operation of grinding equipment\n2.6 Safety procedures for cutting and grinding\n3. Underpinning skills\n3.1 Measuring and communication skills\n3.2 Set up of cutting equipment such as mechanical,\n gas and plasma\n3.3 Cutting techniques\n3.4 Grinding techniques\n3.5 Observance of safety procedures\n4. Resource implications\nThe following resources must be provided:\n4.1 Relevant documentation such as WPS and\n working drawing\n4.2 Supplies and materials\n4.3 Cutting equipment and facilities\n4.4 Grinding equipment and facilities\n4.5 Measuring tools\n4.6 PPE\n4.7 Stand-by fire fighting equipment\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n5.3 Inspection of prepared edges\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 36 ---\n11/03/04\nWeldncii11-3\n\n35\nUNIT TITLE\n:\nSET UP WELDING EQUIPMENT\n\nUNIT CODE\n:\nMEE721207\n\nDESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes in\npreparing equipment for welding.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.1 Set up welding\nmachine\n\n1.1 Requirements for welding is determined from job\nrequirements, welding procedures and specifications\nand/or technical drawings.\n1.2 Welding machine is set up in accordance with job\nrequirements, welding procedures and specifications,\ntechnical drawings and manufacturer’s instructions.\n1.3 Welding machine should be connected to an\n independent power supply and wired up or set to the\npolarity indicated in the welding procedures\n/specifications or as recommended by the\nmanufacturer.\n1.4 Current, voltage, and wire feed settings is fine-tuned or\nadjusted consistent with job requirements to produce\nacceptable weld.\n1.5 Task is completed without causing damage to the tools,\nequipment and materials and injury to self and others.\n2. Set up welding\naccessories\n2.1 Welding machine accessories and consumables are\nidentified from job requirements, welding procedures\nand specifications.\n2.2 Welding machine accessories and consumables are set\nup in accordance with job requirements, welding\nprocedures and specifications and/or manufacturer’s\ninstructions.\n2.3 Spools firmly locked to holder, rollers adjusted to\ncorrect tension.\n2.4 Purging hoses, damps, flow meter, regulators, torches\nand guns are properly installed where needed.\n2.5 Gas tanks properly secured where needed.\n\n3. Set up welding\npositioners, jigs and\nfixtures\n3.1 Braces, stiffeners, rails and other jigs are provided and\nin conformity with job requirements.\n3.2 Work items/materials are protected from strong winds,\ndrafts and rainfall\n4. Set up pre-heating\ntools/equipment as\nrequired\n4.1 Pre-heating equipment appropriate to the job\nrequirement and specifications\n4.2 Equipment operated in conformance with the\nmanufacturer’s instructions.\n\n--- PDF PAGE 37 ---\n11/03/04\nWeldncii11-3\n\n36\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Welding machine\n\nTypes, kind and uses of GMAW welding machines\n1.1 Direct current (DC)\n1.2 Constant voltage\n2. Polarity\nApplication and uses\n2.1 Direct current – electrode positive (reverse polarity)\n2.2 Direct current – electrode negative (straight polarity)\n2.3 Alternating current\n3. Accessories\n3.1 welding guns\n3.2 regulators and flow meters\n3.3 gas hoses and adaptors\n3.4 gas cylinders and gas heaters\n3.5 filters, gas nozzle and insulators\n3.6 wire feeders and wire cutter\n3.7 contact tips\n3.8 cable liners and gas diffusers\n4. Gases\n4.1 Pure inert gas (argon, etc.)\n4.2 Mixed gases\n4.3 Pure CO2\n\n--- PDF PAGE 38 ---\n11/03/04\nWeldncii11-3\n\n37\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Set up and install welding machine,\n accessories,\nwelding positioners, jigs and fixtures and pre-\n heating equipment within allotted time and in\n accordance with OH&S rules and accessible\n and convenient location.\n1.2 Applied housekeeping and 5S practices\n2. Underpinning knowledge\n2.1 Types and uses of welding equipment and\naccessories\n2.2 Power requirement and capacity of welding\n machine and its accessories\n2.3 Operating capacity of welding machine and\n accessories\n2.4 Basic electricity\n2.5 Shop safety, housekeeping and 5S procedures\n3. Underpinning skills\n3.1 Setting and operating welding machine and\n accessories\n3.2 Communication skills\n3.3 Recognizing operational abnormalities and\n faults in welding machine and accessories\n3.4 Fine tuning of welding machine and accessories\n for optimum operation\n3.5 Minor repairs/maintenance of welding machine\n and accessories\n3.6 Use of PPE\n4. Resource implications\nThe following resources must be provided:\n4.1 Appropriately ventilated work area/shop with\nwelding facilities, machines and accessories\n4.2 PPE\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 39 ---\n11/03/04\nWeldncii11-3\n\n38\nUNIT TITLE\n: FIT UP WELD MATERIALS\n\nUNIT CODE\n: MEE721208\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in fitting\n up welding materials.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform tack welding\n\n1.1 Tack welding is performed in accordance with the\nrequirements of WPS and client’s specifications.\n1.2 Tack welding is performed visually and dimensionally\nacceptable.\n1.3 Backing plate, stiffener, running plate installed as\nrequired.\n1.4 Joints are free from rust, paints, grease and other\n foreign materials prior to fit up or tacking.\n2. Check gap and\n alignment\n2.1 Root gap is performed in accordance with the\nrequirements of WPS.\n2.2 Alignment within the range of acceptability of code and\nstandard.\n2.3 Fitted materials visually free from stresses\n3. Set up welding\n positioner\n3.1 Weld specimen positioned and secured according to the\nrequirements.\n\n--- PDF PAGE 40 ---\n11/03/04\nWeldncii11-3\n\n39\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Tack welding\n\nKinds of tacking\n1.1 Bridge tacking\n1.2 Permanent tacking\n1.3 Temporary tacking\n2. Visually and\n dimensionally\n acceptable\n2.1 Acceptable tack welds\n2.2 Fully fused to the base metal\n2.3 Free from defects and discontinuities\n2.4 Evenly distributed\n3. Root gap\n3.1 WPS requirements\n3.2 Client requirements\n4. Backing materials\n4.1 Stiffeners\n4.2 Backing plate\n4.3 Strong back\n5. Alignment\n5.1 Codes and specifications\n5.2 Client requirements\n\n--- PDF PAGE 41 ---\n11/03/04\nWeldncii11-3\n\n40\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 performed tack welding\n1.2 checked gap and alignment\n1.3 set up welding positioners\n2. Underpinning knowledge\n2.1 Fit up tolerances\n2.2 Mensuration\n2.3 WPS\n2.4 Welding materials and consumables\n2.5 Drawing and plan interpretation\n2.6 Welding codes (symbols)\n2.7 Identification of weld defects\n2.8 Fit up\n3. Underpinning skills\n3.1 Applying weld techniques\n3.2 Handling welding materials and consumables\n3.3 Rectifying weld defects\n3.4 Measuring skills\n3.5 Communication skills\n3.6 Pre-heating technique\n3.7 Observance of safety procedures\n4. Resource implications\nThe following resources must be provided:\n4.1 Drawing and plans\n4.2 Appropriately ventilated work area/shop with\nwelding facilities, machines and accessories\n4.3 PPE\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 42 ---\n11/03/04\nWeldncii11-3\n\n41\nUNIT TITLE\n: REPAIR WELDS\n\nUNIT CODE\n: MEE721209\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n repairing welds.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Mark/locate weld\ndefects\n1.1 Identified weld defects marked/located according to\n recommended practice\n1.2 Weld defects are located and marked according to\n procedures\n3. Prepare tools and\n equipment\n2.1 Tools and equipment are prepared based on job\nrequirements and provision of wind barriers.\n2.2 Task is performed in accordance with company or\nindustry requirements and safety procedure\n\n3. Remove defects\n3.1 Weld defects are removed/excavated in accordance with\n approved industry procedures or client requirements.\n3.2 Removal of non-defective welds is minimized and\n cleaned.\n3.3 Visual and dye-penetrant test is performed to verify the\nextent of removal of defects, where applicable\n3.4 Welding instructor is informed to verify the extent of\ndefect removal.\n3.5 Task is performed in accordance with company or\nindustry requirement and safety procedure\n\n4. Perform re-welding\n4.1 Re-welding is performed in accordance with approved\n repair procedure.\n4.2 Task is performed in accordance with company or\n industry requirement and safety procedure\n4.3 Re-welding is performed with no new weld\n defects or damages occurred\n4.4 Weld visually checked after re-welding for acceptability\n\n--- PDF PAGE 43 ---\n11/03/04\nWeldncii11-3\n\n42\n\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Weld defects\n1.1 Porosity\n1.2 Root undercut\n1.3 Concavity/convexity\n1.4 Degree of reinforcement\n1.5 Burn Through\n1.6 Crater cracks\n1.7 Cracks\n1.8 Lack of Fusion (tie-in)\n1.9 Pinholes/Blowholes\n1.10 Under Fill\n1.11 Excess/incomplete penetration\n1.12 Overlap\n1.13 Misalignment\n1.14 Distortion\n2. Tools and equipment\n2.1 Welding machine and accessories\n2.2 Gouging outfit and accessories\n2.3 Portable grinder\n2.4 Chipping hammer\n2.5 Files\n2.6 Extension cord and lightings\n2.7 Barriers\n2.8 Dye-penetrant kit\n3. Removed/excavated\nDefects removed by\n3.1 Grinding\n3.2 Arc/air Gouging\n3.3 Cutting (mechanical, gas)\n3.4 Plasma gouging\n\n--- PDF PAGE 44 ---\n11/03/04\nWeldncii11-3\n\n43\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\nrepaired weld defects within the approved weld\nrepair procedures\n2. Underpinning knowledge\n2.1 Interpretation of weld repair procedures and\n WPS\n2.2 Causes and identification of weld defects\n2.3 Materials and consumables\n2.4 Welding Equipment and Tools\n2.5 Welding Codes (symbols)\n2.6 Repair techniques\n2.7 Selection and use of PPE\n3. Underpinning skills\n3.1 Operating weld defect removal tools and\n equipment\n3.2 Applying correct weld techniques\n3.3 Measuring skills\n3.4 Communication skills\n3.5 Rectifying weld defects\n3.6 Handling welding tools and equipment\n3.7 Handling materials and consumables\n3.8 Identifying weld defects\n4. Resource implications\nThe following resources must be provided:\n4.1 Weld defect removal and repair facilities and\n equipment\n4.2 Supplies and materials\n4.3 PPE\n4.4 Relevant documentation such as WPS and\n approved repair procedure\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation and interview\n5.2 Performance record\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 45 ---\n11/03/04\nWeldncii11-3\n\n44\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nWeld carbon steel plates using GMAW\n\nUNIT CODE\n\n:\nMEE721104\n\nDESCRIPTOR\n\n:\nThis unit covers the skills, knowledge and attitudes\nrequired in welding carbon steel plates using\nGMAW process.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform root pass\n1.1 Root pass is performed in accordance with WPS and/or\n client specifications.\n1.2 Task is performed in accordance with company or\n industry requirement and safety procedure.\n1.3 Weld is visually checked for defects and repaired, as\n required\n1.4 Weld is visually acceptable in accordance with applicable\ncodes and standards\n2. Clean root pass\n2.1 Root pass is cleaned and free from defects and\ndiscontinuities\n2.2 Task is performed in accordance with approved WPS\n3. Weld subsequent/\nfilling passes\n\n3.1 Subsequent/ filling passes is performed in accordance\n with approved WPS\n3.2 Weld is visually checked for defects and repaired, as\n required\n3.3 Weld is visually acceptable in accordance with applicable\ncodes and standards\n4. Perform capping\n4.1 Capping is performed in accordance with WPS and/or\n client specifications\n4.2 Weld is visually checked for defects and repaired, as\n required\n4.3 Weld is visually acceptable in accordance with applicable\ncodes and standards\n\n--- PDF PAGE 46 ---\n11/03/04\nWeldncii11-3\n\n45\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. WPS\nWPS Requirements\n1.1 Welding positions\n1.1.1 1F – 4F\n1.1.2 1G – 3G\n1.2 Wall thickness\n 1.2.1 1.6 mm and above\n1.3 Type of material\n 1.3.1 Carbon or mild steel\n1.4 Type and size of electrode wire\n1.5 Travel speed\n1.6 Current setting (polarity, amperage, voltage)\n1.7 Backing material\n1.8 Welding accessories\n1.8.1 Gen-set\n1.8.2 Rectifier transformer Type\n1.8.2 Wire feeder\n1.9 Mode of metal transfer\n1.9.1 globular\n1.9.2 spray\n1.9.3 pulsating\n1.9.4 short-circuiting\n1.10 Joint preparation\n2. Defects\n2.1 Porosity\n2.2 Undercut\n2.3 Arc Strike\n2.4 Spatters\n2.5 Concavity/convexity\n2.6 Degree of reinforcement\n2.7 Burn Through\n2.8 Crater cracks\n2.9 Cracks\n2.10 Lack of Fusion (tie-in)\n2.11 Pinholes/Blowholes\n2.12 Under Fill\n2.13 Overlap\n2.14 Misalignment\n2.15 Distortion\n\n--- PDF PAGE 47 ---\n11/03/04\nWeldncii11-3\n\n46\nEVIDENCE GUIDE\n1\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate\nwelded carbon steel plates using GMAW process in\n2G and 3G positions to acceptable standard\nfollowing the approved WPS.\n\n2\nUnderpinning knowledge\n2.1 Drawing/Plan/WPS interpretation\n2.2 Materials and consumables\n 2.2.1 Electrode wire\n 2.2.2 Shielding gases (mixed gases)\n2.3 Welding Equipment and Tools\n 2.3.1 GMAW mode of metal transfer\n 2.3.2 GMAW welding accessories\n2.4 Basic Mathematics (MDAS)\n2.5 Welding Codes (symbols)\n2.6 Interpretation of weld defects and GMAW\nequipment malfunctions\n2.7 Modes of metal transfer\n3\nUnderpinning skills\n3.1 Measuring skills\n3.2 Communication skills\n3.3 Rectifying weld defects\n3.4 Applying welding techniques for GMAW\n3.5 Handling welding tools and equipment\n3.6 Handling materials and consumables\n4\nResource implications\nThe following resources must be provided:\n4.1 GMAW facilities and equipment\n4.2 Supplies and materials\n4.3 Fumes extractor\n4.4 PPE\n4.5 Relevant documentation such as WPS and\nworking drawing\n4.6 Stand-by fire fighting equipment\n5\nMethod of assessment\nCompetency must be assessed through:\n5.1 Observation and interview\n5.2 Demonstration and interview\n5.3 Written test\n5.4 Portfolio (work records, certificates, awards,\nendorsements, etc…)\n6\nContext of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 48 ---\n11/03/04\nWeldncii11-3\n\n47"
