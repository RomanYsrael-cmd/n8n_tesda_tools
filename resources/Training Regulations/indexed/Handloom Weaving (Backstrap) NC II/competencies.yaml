        "source_text": "--- PDF PAGE 84 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            80 \n \nUNIT OF COMPETENCY \n: \nPERFORM BACKSTRAP WEAVING \n \n \n \nUNIT CODE \n: \nCRE731311 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to perform basic backstrap weaving. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Conduct \npreparatory \nactivities for \nbackstrap weaving \n1.1  Workplace is \nprepared according \nto workplace \nprocedures. \n1.2  Safety measures is \napplied based on \nOSHS. \n1.3  Warping process is \ndone following \nbackstrap loom \nweaving \nprocedures. \n1.4  Loom dressing is \ndone following \nbackstrap loom \nweaving \nprocedures. \n1.5  Documentation is \ndone according to \nindustry practice. \n1.1  Systems of \nmeasurements \n1.2  Unit conversion \n1.3  Standard \noperating \nprocedures for \npre-backstrap \nloom weaving \n1.4  OSHS principles \nand \nresponsibilities \n1.1  Exhibiting \neffective \ncommunication \nskills for \ndocumentation of \nprocesses \n1.2  Following \nworkplace \ninstructions \n1.3  Applying proper \nmaterial usage \n2.  Weave textile \n2.1  Backstrap loom \ncomponents are \nset up following \nestablished industry \npractices. \n2.2  Foot stopper is \nset-up according to \nindustry practices. \n2.3  Backstrap support \nare placed following \nindustry practices. \n2.4  Woven textile is \nproduced according \nto backstrap \nprocedures. \n2.5  On the loom \ninspection is \nperformed following \nstandard \nprocedures. \n2.6  Rectification of \nweaving is applied \nfollowing industry \n2.1  Standard \noperating \nprocedures for \nbackstrap loom \nweaving \n2.2  Quality criteria for \nhandwoven \ntextiles is \nimplemented \n2.3  On-loom weaving \ncorrective \ntechniques \n2.4  OSHS principles \nand \nresponsibilities \nare followed while \nweaving \n2.1  Performing basic \nweaving \noperations on a \nbackstrap loom \n2.2  Maintaining \nOSHS all \nthroughout the \nweaving process \n2.3  Maintaining own \nwork-quality\n\n--- PDF PAGE 85 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            81 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nprocedures. \n3.  Complete \nbackstrap weaving \n3.1  Finishing of fabric is \napplied based on \nestablished \ntechniques. \n3.2  Joining of seams \nare performed \nfollowing work \nrequirements. \n3.3  Off the loom \ninspection is \nperformed following \nstandard \nprocedures. \n3.4  Woven textile is \nsegregated \naccording to \nclassification. \n3.1  Standard \noperating \nprocedures for \nfinishing \nhandwoven \ntextiles \n3.2  Finishing \ntechniques of \nwoven fabric \n3.1  Performing \nquality \nassessment \npractices \n3.2  Housekeeping \n3.3  Time \nManagement\n\n--- PDF PAGE 86 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            82 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Documentation \nDocumentation may include: \n1.1   Warp ends \n1.2   Material used for weft \n1.3   Type of weave used \n1.4   Weaver \n1.5   Handling of materials \n1.6   Origin of materials \n2.  Backstrap loom \ncomponents \nBackstrap loom components may include: \n2.1   Straps \n2.2   Heddle \n2.3   Beater \n2.4   Shuttle \n3.  Foot stopper \nFoot stopper may include: \n3.1   Block of wood/hardwood \n3.2   Bamboo \n4.  Established techniques \nEstablished techniques may include: \n4.1   Fringing \n4.2   Blanket stitching \n4.3   Join seams by using sewing machine \n4.4   Conduct finishing touches of garments and \nbackstrap loom products by using sewing machine \n4.5   Wash fabric \n4.6   Air-dry fabric \n4.7   Beat fabric  \n4.8   Polish and wax textile \n5.  Classification \nClassification may include: \n5.1   Class A \n5.2   Class B \n5.3   Class C\n\n--- PDF PAGE 87 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            83 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Conducted preparatory activities for backstrap weaving. \n1.1.1   Prepared workplace. \n1.1.2   Applied safety measures. \n1.1.3   Performed warping process. \n1.1.4   Performed loom dressing. \n1.1.5   Conducted documentation. \n \n1.2   Weaved textile. \n1.2.1   Set-up backstrap loom components. \n1.2.2   Set-up foot stopper. \n1.2.3   Placed backstrap support. \n1.2.4   Produced woven textile. \n1.2.5   Performed on the loom inspection. \n1.2.6   Applied rectification of weaving. \n \n1.3   Completed backstrap weaving. \n1.3.1   Applied finishing of fabric. \n1.3.2   Performed joining of seams. \n1.3.3   Performed off the loom inspection. \n1.3.4   Segregated woven textile. \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1   Workplace location or simulated workplace \n2.2   Materials, Supplies, Tools and Equipment relevant to \nthe unit of competency \n2.2.1   A range of yarns and threads \n2.2.2   A range of quality weaving tools and equipment \n2.3   Plans, drawings and specifications relevant to the \nactivities \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Interview/questions \n3.2   Practical demonstration \n3.3   Demonstration with questioning \n3.4   Written Test/Examination \n3.5   Direct Observation \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions\n",
