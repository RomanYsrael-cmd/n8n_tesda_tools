IKSP \n2.5  Community \ncultural \nauthorities \n2.6  Procedural \nchecklist \n2.7  Specifications \nfrom customers \n2.8  Attitude: \n2.8.1 Time \nconscious-\nness \n2.8.2 Attention to \n2.1  Monitoring \npersonal \nperformance \n2.2  Obtaining advice \nand guidance \n2.3  Following \nguidance of \ncultural \nauthorities \n2.4  Applying \nprocedural \nchecklist \n2.5  Obtaining \nspecifications\n\n--- PDF PAGE 51 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            47 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ndetails \n2.8.3 Resource-\nfulness \n3.  Improve own work \n3.1  Actual work output \nis assessed in \nrelation to work \nplan and \nschedules. \n3.2  Work expenses are \ncomputed against \nbudget. \n3.3  Feedback is \nobtained from \ncustomer based on \njob requirements. \n3.4  Improvement is \ndone according to \nfeedback. \n3.1  Quality control \n3.2  Work plan and \nschedules \n3.3  Computation of \nwork expenses \n3.4  Customer \nfeedback \n3.5  Arithmetic \noperation \n3.6  IKSP \n3.7  Attitude \n3.7.1 Time \nconscious-\nness \n3.7.2 Attention to \ndetails \n3.7.3 Resource-\nfulness \n3.7.4 Patience \n3.7.5 Honesty \n3.1  Assessing actual \nwork output \n3.2  Computation \nskills \n3.3  Obtaining \ncustomer \nfeedback \n3.4  Applying \nimprovements\n\n--- PDF PAGE 52 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            48 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Tasks \nMay include: \n1.1   Acquire tools, materials and equipment \n1.2   Set-up equipment \n1.3   Select basic designs \n1.4   Prepare prototype \n1.5   Identify production target \n1.6   Identify timelines \n1.7   Conduct mass production \n1.8   Package products \n1.9   Conduct quality control \n1.10 Perform marketing \n1.11 Prepare inventory \n2.