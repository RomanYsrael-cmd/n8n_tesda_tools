ructure \n4.  Checking of attributes of \nconducive working areas \nMay include: \n4.1   Ocular inspection \n4.2   Consultation with authorities \n5.  Resources \nMay include: \n5.1   Time \n5.2   Manpower \n5.3   Budgetary requirements \n5.4   Sources of raw materials \n6.  Authorities \nMay include: \n6.1   Cultural elders \n6.2   Cultural masters \n6.3   Cultural leaders \n6.4   LGUs\n\n--- PDF PAGE 58 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            54 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Comply with safety and health regulations \n1.1.1   Applied community procedures on safety and \nhealth \n1.1.2   Adapted and applied policies and procedures \n1.1.3   Addressed emergencies \n1.1.4   Set-up and secured work areas  \n1.2   Maintain work area \n1.2.1   Checked attributes of conducive working areas \n1.2.2   Identified and reported repairs \n1.2.3   Stored and disposed waste \n1.2.4   Applied safety practices  \n1.3   Check and maintain tools, equipment and resources \n1.3.1   Stored tools, equipment and materials  \n1.3.2   Checked tools, and equipment for maintenance \n1.3.3   Monitored and maintained resources  \n1.3.4   Referred tools and equipment for repair \n1.3.5   Applied safety practices \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1   Actual and simulated workplace \n2.2   Materials, tools, and equipment needed to perform the \nrequired task \n2.3   References and manuals \n2.4   PPEs \n2.5   First aid kit \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration/ observation with oral questioning \n3.2   Written exam \n3.3   Oral questioning \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions\n",
