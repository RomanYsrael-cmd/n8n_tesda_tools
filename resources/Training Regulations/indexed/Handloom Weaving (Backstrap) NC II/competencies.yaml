read \n5.2.2.4   dye \n5.2.2.5   mud clay \n5.2.2.6   bronze \n5.2.2.7   cloth \n5.2.2.8   beads \n5.2.2.9   rattan \n5.2.2.10 bamboo \n5.2.2.11 wicker (nito) \n5.2.2.12 pandan leaves \n5.2.2.13 swamp grass \n5.2.2.14 tikog \n5.2.2.15 animal skin \n5.2.2.16 first aid kit \n5.2.2.17 PPEs \n5.2.3   Equipment \n5.2.3.1   upright/standing loom \n5.2.3.2   backstrap loom \n5.2.3.3   sewing machine \n5.2.3.4   earthen pot \n5.2.3.5   splitter \n5.2.3.6   stripper\n\n--- PDF PAGE 67 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            63 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Identified individual improvement areas. \n1.1.1   Listed and selected improvement areas. \n1.1.2   Verified sourced information from cultural \nauthorities. \n \n1.2   Immersed to culture and arts. \n1.2.1   Selected and participated cultural immersion \napproaches. \n1.2.2   Discussed insights and experiences on arts and \nculture with community cultural authorities. \n \n1.3   Enhanced artistic skills. \n1.3.1   Applied best community practices. \n1.3.2   Applied safety practices. \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1   Actual and simulated workplace \n2.2   Materials, tools, and equipment needed to perform the \nrequired task \n2.3   References and manuals \n2.4   PPEs \n2.5   First aid kit \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration/ observation with oral questioning \n3.2   Written exam \n3.3   Portfolio with interview \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions.\n",
