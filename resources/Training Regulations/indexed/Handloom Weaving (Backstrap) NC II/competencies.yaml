        "source_title": "ENHANCE CREATIVE AND ARTISTIC SKILLS AND CULTURAL AWARENESS",
        "source_text": "--- PDF PAGE 45 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            41 \n \nUNIT OF COMPETENCY \n: \nENHANCE CREATIVE AND ARTISTIC SKILLS  \nAND CULTURAL AWARENESS \n \n \n \nUNIT CODE \n: \nCRE731202 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes  \nrequired \nto \nplan \nfor \nthe \nactivities, \nconduct \ncapacitation activity, conduct cultural awareness \nactivity and perform benchmarking.  It also includes \ncompetency required to exhibit professional practice \nthat describes development of creative, artistic and \nconceptual skills required to work as a practicing \nartist.  It also deals with communicating effectively \nand working strategically to achieve planned \noutcomes as an artist. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Plan for the \nactivities \n1.1  Information on \ncultural skills and \npractices is \naccessed and used. \n1.2  Areas for \nimprovement are \nidentified based on \ngathered \ninformation. \n1.3  Action plan is \nprepared based on \nconsultation. \n1.4  Consultation is \nmade with cultural \nauthorities. \n1.5  Artistic skills group \nare formed. \n1.1  Intervention \nprocedures \n1.2  Cultural skills and \npractices \n1.3  Action plan \n1.4  Consultation \nprocedures \n1.4.1 IKSP \n1.4.2 FPIC \n1.5  Cultural \nauthorities \n1.6  Artistic skills \ngroup  \n1.7  Cultural mapping \nand profiling \n1.8  Attitude  \n1.8.1 Patience \n1.8.2 Organized \n1.8.3 Time \nconscious \n1.8.4 Resource-\nfulness \n1.8.5 Focused \n1.1  Accessing and \nusing information \non cultural skills \n1.2  Identifying areas \nof improvement \n1.3  Preparing action \nplan \n1.4  Conducting \nconsultation \n1.5  Conducting \ncultural mapping \nand profiling \n2.  Conduct \ncapacitation \nactivity \n2.1  Training and \nspecialization is \nselected with \nreference to \nimprovement area. \n2.2  Capacitation \nstrategies are \napplied based on \nindustry \nprocedures. \n2.1  Types and \nprocedures of \ncapacitation \nstrategies \n2.2  Types of training \nand specialization \n2.3  Administrative \nrequirements \n2.4  Preparation \nprocedures \n2.1  Selecting training \nand \nspecialization \n2.2  Applying \ncapacitation \nstrategies \n2.3  Preparing and \nsubmitting \nadministrative \nrequirements\n\n--- PDF PAGE 46 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            42 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3  Administrative \nrequirements are \nprepared and \nsubmitted. \n2.4  Learner is \nmonitored and \nevaluated \naccording to \ncapacitation \nstrategies. \n2.5  Community \nimmersion \nprocedures \n2.6  Basic arithmetic \noperations \n2.7  Determination of \nareas for \nimprovement \n2.8  Monitoring and \nevaluation \nprocedures of \nlearner \n2.9  Attitude \n2.9.1 Organized \n2.9.2 Honesty \n2.9.3 Patience \n2.9.4 Resource-\nfulness \n2.9.5 Industrious-\nness \n2.9.6 Politeness \n2.4  Preparing \nbudgetary \nrequirements \n2.5  Communication \nskills \n2.6  Determining \nimprovement \narea \n2.7  Monitoring and \nevaluating \nlearner \n3.  Conduct cultural \nawareness activity \n3.1  Cultural events \nare identified \naccording to \nestablished industry \nprocedures. \n3.2  Cultural events are \nparticipated \naccording to \nindustry practices. \n3.3  Coordination \nactivities are \nperformed following \nindustry \nprocedures. \n3.4  Promotional \nmaterials are \nprepared according \nto established \npractices. \n3.5  Cultural promotion \nis carried out based \non established \nindustry \nprocedures. \n3.1  Acculturation  \n3.2  Types of cultural \nevents \n3.3  Coordination \nprocedures \n3.4  Responding to \ninvitation \n3.5  Types of \npromotional \nmaterials \n3.6  Cultural \npromotion \nprocedures \n3.7  Cultural sensitivity \n3.8  Attitude \n3.8.1 Awareness \non details \n3.8.2 Organized \n3.8.3 Resource-\nfulness \n3.8.4 Patience \n3.8.5 Politeness \n3.8.6 Industrious-\nness \n \n3.1  Identifying \ncultural events \n3.2  Participating \ncultural events \n3.3  Performing \ncoordination \nprocedures \n3.4  Preparing \npromotional \nmaterials \n3.5  Carrying out \ncultural \npromotion \n3.6  Communication \nskills \n4.  Perform \nbenchmarking \n4.1  Community is \nidentified and \nselected based on \nindustry \nprocedures. \n4.1  Cultural skilled-\nshared \nknowledge \n4.2  Cultural \nauthorities \n4.1  Identifying and \nselecting \ncommunity \n4.2  Facilitating \ncultural\n\n--- PDF PAGE 47 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            43 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.2  Cultural exchange \nis facilitated \naccording to \nindustry procedure. \n4.3  Community \npractices are \nidentified and \nselected following \nindustry \nprocedures. \n4.4  Cultural \nauthorities are \nconsulted for \ncultural skilled – \nshared knowledge \nbased on \nestablished \nprotocol. \n4.5  Best practice is \napplied based on \napproval of cultural \nauthorities. \n4.6  Adjustments are \napplied based on \nconsultation with \nthe cultural \nauthorities. \n4.7  Documentation is \nperformed based \non the result of \nconsultation. \n4.3  Cultural sensitivity \n4.4  Different \ncommunity \npractices \n4.5  Facilitation \nprocedures \n4.6  Types of cultural \ncommunity \n4.7  Consultation and \napproval \nprocedures \n4.8  Best cultural \npractices \n4.9  Documentation \nprocedure \n4.10 Attitude \n4.10.1 Awareness \non details \n4.10.2 Organized \n4.10.3 Resource-\nfulness \n4.10.4 Patience \n4.10.5 Politeness \n4.10.6 \nIndustrious-\nness \n4.10.7 Respect-\nfulness \nexchange \n4.3  Identifying \ncommunity \npractices \n4.4  Consulting \ncultural \nauthorities \n4.5  Applying best \npractices \n4.6  Communication \nskills \n4.7  Documentation \nskills\n\n--- PDF PAGE 48 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            44 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Cultural authorities \nMay include: \n1.1   Cultural masters/ bearers \n1.2   Traditional leaders \n1.3   Traditional elders \n1.4   Cultural Elders \n1.5   Cultural Master \n1.6   Cultural Bearers \n2.  Capacitation strategies \nMay include: \n2.1   Training \n2.1.1   Mentoring \n2.1.2   School-based \n2.2   Community immersion \n3.  Cultural events \nCultural events may include: \n3.1   Exhibits \n3.2   Forum \n3.3   Festival \n3.4   Cultural exchange \n3.5   Trade fair \n4.  Promotional materials \nMay include: \n4.1   Fliers \n4.2   Hand-outs \n4.3   Media promotions \n4.4   Pamphlets \n4.5   Social media \n4.6   Signages \n4.7   Product labeling and packaging \n4.8   Brochure\n\n--- PDF PAGE 49 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            45 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Identified areas for improvement \n1.2   Prepared action plan \n1.3   Conduct capacitation activity \n1.3.1   Selected training and specialization  \n1.3.2   Applied capacitation strategies \n1.3.3   Prepared and submitted administrative \nrequirements \n1.3.4 Monitored and evaluated learner  \n1.4   Conduct cultural awareness activity \n1.4.1   Identified cultural events   \n1.4.2   Participated cultural events   \n1.4.3   Performed coordination activities   \n1.4.4   Prepared promotional materials   \n1.4.5   Carried out cultural promotion   \n1.5 Perform benchmarking \n1.5.1   Identified and selected community \n1.5.2   Facilitated cultural exchange \n1.5.3   Identified and selected community practices \n1.5.4   Consulted cultural authorities \n1.5.5   Applied best practice \n1.5.6   Applied adjustments \n1.5.7   Performed documentation \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1   Actual and simulated workplace \n2.2   Materials, tools, and equipment needed to perform the \nrequired task \n2.3   References and manuals \n2.4   PPEs \n2.5   First aid kit \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration/ observation with oral questioning \n3.2   Written exam \n3.3   Portfolio with interview \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions.\n",
