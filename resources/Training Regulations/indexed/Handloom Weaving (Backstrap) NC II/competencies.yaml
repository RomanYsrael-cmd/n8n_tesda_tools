machine \n3.5   Electric grinder \n3.6   Electric blower \n3.7   Hand drill \n4.  Work requirements \nMay include: \n4.1   Weaving \n4.2   Embroidery \n4.3   Beadworks \n4.4   Pottery \n4.5   Brass casting \n4.6   Wood carving \n4.7   Paper products making\n\n--- PDF PAGE 73 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            69 \nVARIABLE \nRANGE \n4.8   Shell craft making \n5.  Addressing malfunctioned \nfaulty equipment \nMay include: \n5.1   Reporting \n5.2   Replacement \n6.  Addressing faulty tools \nMay include: \n6.1   Reporting \n6.2   Fixing \n6.3   Replacement \n7.  Maintenance of tools and \nequipment \nMay include: \n7.1   Cleaning \n7.2   Lubricating \n7.3   Tightening \n7.4   Simple tool repairs \n7.5   Adjustment using correct procedures \n7.6   Sharpening\n\n--- PDF PAGE 74 ---\nTR – Handloom Weaving (Backstrap) NC II                Revision 00                Promulgated (12/12/2023)            70 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared tools, materials and equipment. \n1.1.1   Checked serviceability of tools and equipment. \n1.1.2   Checked availability and conformance of \nmaterials. \n1.1.3   Applied safety practices. \n \n1.2   Operated equipment. \n1.2.1   Set up equipment. \n1.2.2   Conducted operation of equipment. \n1.2.3   Addressed malfunctions and faulty equipment. \n \n1.3   Utilized tools and materials. \n1.3.1   Determined work requirement. \n1.3.2   Used tools and materials. \n1.3.3   Addressed malfunctions, and faulty tools. \n \n1.4   Maintained and stored tools, materials and equipment. \n1.4.1   Determined work requirement. \n1.4.2   Handled and maintained tools and equipment. \n1.4.3   Stored tools, materials and equipment. \n1.4.4   Conducted inventory of tools, equipment, and \nmaterials. \n1.4.5   Undertaken routine maintenance of tools and \nequipment. \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1   Actual and simulated workplace \n2.2   Materials, tools, and equipment needed to perform the \nrequired task \n2.3   References and manuals \n2.4   PPEs \n2.5   First aid kit \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration/ observation with oral questioning \n3.2   Written exam \n3.3   Story-telling \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions.\n",
