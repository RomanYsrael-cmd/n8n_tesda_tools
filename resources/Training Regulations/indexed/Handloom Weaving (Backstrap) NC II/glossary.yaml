{
  "present": true,
  "entries": [
    {
      "term": "APRON",
      "definition": "Is a canvas attached to the warp ends to start weaving."
    },
    {
      "term": "APRONING",
      "definition": "Is a process of typing the warp ends to the apron cloth that is attached to the cloth beam which start weaving process."
    },
    {
      "term": "BACK BEAM /",
      "definition": "SAMBAYUNAN Located above the warp beam. The warp beam passes over this firm support to maintain its tension. A corresponding surface called the breast beam, can be found at the upper front of the loom."
    },
    {
      "term": "BEAMING",
      "definition": "Is to wind the warp onto the warp beam. The layers of warp are usually separated with heavy paper or warping sticks."
    },
    {
      "term": "BEATER",
      "definition": "A frame attached to the loom near the cloth beam to hold the reed to beat the weft.It consists of a frame where the reed is inserted. The frame's top is removable tp allow the easy installation of different sizes of the reed. When the appropriate reed is in place, the beater is used to press the weft perpendicularly against the warp and as weaving progress against the warp and as weaving progresses against the woven cloth. Beaters may either swing from a bar laid crosswise over the loom or from the side beam at the part of the loom."
    },
    {
      "term": "BEATING / JERK",
      "definition": "Means filling the thread to give firmness on the fabric."
    },
    {
      "term": "BOBBIN / TALINYAS",
      "definition": "Is a fabricated thread / yarn holder made of straw or bamboo where strands of fiber are winded to form the weft."
    },
    {
      "term": "CLASSIFICATION",
      "definition": "The quality control standard of the community practicing backstrap loom weaving."
    },
    {
      "term": "CLOTH BEAM /",
      "definition": "LIKISAN Holds the web or the woven fabric that can be found in the lower front of the loom. It is a beam directly below the breast beam. The newly woven cloth is wound and stored here."
    },
    {
      "term": "COUNTERBALANCE",
      "definition": "LOOM Are quiet and have a faster and softer treadling (requiring less weight) than jack-type looms."
    },
    {
      "term": "CROSS STICK /",
      "definition": "SALIDSIRAN Is a guide stick inserted to cross on the warp"
    },
    {
      "term": "FLOATING WEFT OR",
      "definition": "INLAID / PILI Is a type of weaving that creates design in the cloth."
    },
    {
      "term": "HARNESS",
      "definition": "Is a string or tie used to attach the upper heddle bar to the head roller and lower heddle bar to the treadle. TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 126"
    },
    {
      "term": "HEDDLES",
      "definition": "Is a cord with an eye. It carries the ends of the cord to the harness. Fabricated thru the use of strings, flat metal or iron. They have end loops where the harnesses and heddle bars are inserted in the central eye where the warp is threaded according to the draft or design plan. Heddles lift the individual warp thread during the weaving process so that the desired pattern may merge."
    },
    {
      "term": "HEAD ROLLER /",
      "definition": "LIGID-LIGID Refers to the round bar placed crosswise at the top of the loom and to the parallel bar below it. These roller support the ropes which keep the hanging in place."
    },
    {
      "term": "HEDDLE BARS",
      "definition": "These are narrow horizontal bars lie below the roller and are much shorter so they can be raised or lowered by pressing the loom's treadles to create a shed or opening on the warp. Heddle bars come in pairs. The upper bars are tied to the rollers which the lower bars are attached to the foot treadles with the heddles suspended between the bars. The set of harness per loom can range from two to as much as 24. Two-harness looms are so called because they have only two set of harnesses. In some looms, pairs of heddle frames, instead of bars are used to contain the heddles."
    },
    {
      "term": "IN-LAID STICKS /",
      "definition": "BALILA It is a flat wood measured 2.5\" in x 0.25\" in thickness. The length depends on the width of the cloth. It aids the weaver in creating designs on the woven cloth."
    },
    {
      "term": "JACK-TYPE LOOM",
      "definition": "As pressure is applied to the treadle (foot pedal), the harnesses rise as they are connected by jacks. This is why they are sometimes called \"rising shed\" looms. It is preferred by more experienced weavers as they only have to tie up the part of the warp that goes up, so it can cut your prep time in half when warping the loom."
    },
    {
      "term": "LEASE STICKS",
      "definition": "Are sticks that come with a loom. They usually match the loom width. Lease sticks can be used during the warping process to hold the cross."
    },
    {
      "term": "MINOR REPAIR",
      "definition": "The replacement of defective loom"
    },
    {
      "term": "PICK-UP STICK",
      "definition": "A fabricated stick used to separate lift design heddles in- laid patterns called 'pili'."
    },
    {
      "term": "RADDLE",
      "definition": "Also called as a 'thread-spreader'; it is a wooden frame with legs whose upper edge is lined with metal loops made of ordinary nails."
    },
    {
      "term": "RATCHET WHEEL",
      "definition": "Wheels, made of wood or metal, the edge has equidistant teeth to lock the loom's rotating beams-such as the warp beam (at the back) or the cloth beam (in front) -in place. These device are kept stationary by TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 127 catches fastened to the loom."
    },
    {
      "term": "REED / SUYOD",
      "definition": "It is tool made of very fine vertical equidistant metal strips enclosed with in a metal frame. Keep the warp threads neatly parallel & evenly spaced. During the weaving process, the reed beats the weft into place. Reeds are available in different sizes. The sizes are determined by the number of dents per inch. Although the finished web or cloth cannot exceed the width of the reed, the fineness or coarseness of a fabric is partly affected by the size of the reed used and how it is threaded."
    },
    {
      "term": "SET-UP",
      "definition": "Process of something ready to be used"
    },
    {
      "term": "SHED STICKS",
      "definition": "Wider sticks, which are thin, flat and rounded at the ends and slanting at the edges. It may be made in various lengths and widths to suit the weaver' s requirement. These sticks are used to increase the width of the shed or to create variations on fabrics woven on plain-weaving looms or the 2-harness loom."
    },
    {
      "term": "SHUTTLE / SIKUAN",
      "definition": "Is a boat-like piece of wood which carries the bobbin with knotted fiber and is being thrown back and forth to form the desired cloth."
    },
    {
      "term": "SLEY",
      "definition": "Passing the warp through heddle thread and reed."
    },
    {
      "term": "SPINDLE",
      "definition": "A steel or coconut midrib stick (kugong) to secure the boat shuttle. Several bobbins are prepared so that weaving may be done continuously."
    },
    {
      "term": "SPOOL / SKEIN",
      "definition": "HOLDER Used to substitute a thread spreader when one is dealing with lesser quantities of thread. It is wooden block with vertical pegs projecting from surface. Each cone or skein of thread to be used is placed around a peg. Each cone or skein of thread to be used is placed around a peg. An extra peg, longer than the others, is placed at one end of the block and a screw eye is embedded in it."
    },
    {
      "term": "STICK / AGSAM",
      "definition": "Is a stick derived from the vine plants locally called agsam which is used at the warp to provide guide to the weaver in aligning the warp in its proper position"
    },
    {
      "term": "THREADING HOOK /",
      "definition": "REED HOOK Looks like a flattened bamboo or steel similar to broader version of the crochet hook. It is available in different forms and sizes. It is used to draw the warp threads through the reed."
    },
    {
      "term": "TREADLE / SIKNAN",
      "definition": "Is a fabricated bamboo tied up to the harness so that the treadle will move up and down to intertwine with the warp floor loom are operated by foot treadles or pedals attached to the harnesses this action creates a shed TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 128 through which the weft is drawn. Being foot controlled the weaver hands can throw and catch\" the weft-filled unhindered. The number of treadles on a loom will depend on the number of sent ie-,a 2 harness loo will have 2 treadles."
    },
    {
      "term": "WARPING WHEEL",
      "definition": "Is a warping equipment used in weaving."
    },
    {
      "term": "WARP-OUT",
      "definition": "Excess warp"
    },
    {
      "term": "WARP BEAM",
      "definition": "It is the beam or bar at the lower back of the loom where the unwoven warp threads are stored. It is periodically rotated so that the warp may advance during the weaving process. A corresponding beam, called the cloth , can be found at the lower front of the loom, which , in turn , holds the web or woven fabric."
    },
    {
      "term": "WARPING PROCESS Taking off the warp threads from warping frame.",
      "definition": "TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 129 TRAINING REGULATIONS (TR) DOCUMENT REVISION HISTORY Qualification Title: Handloom Weaving (Backstrap) NC II Qualification Code: CREHWB223 Revision No. Document Types* Qualification Title TESDA Board Resolution No./ Date Deployment Circular (TESDA Circular/ Implementing Guidelines) 00 Document Created Handloom Weaving (Backstrap) NC II TBR No. 2023-12/ Dec. 12, 2023 Legend: *Description Types - Document Created - Document Amended TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 130"
    }
  ],
  "source_text": "1) APRON\nIs a canvas attached to the warp ends to start weaving.\n\n2) APRONING\nIs a process of typing the warp ends to the apron cloth\nthat is attached to the cloth beam which start weaving\nprocess.\n\n3) BACK BEAM /\nSAMBAYUNAN\nLocated above the warp beam. The warp beam passes\nover this firm support to maintain its tension. A\ncorresponding surface called the breast beam, can be\nfound at the upper front of the loom.\n\n4) BEAMING\nIs to wind the warp onto the warp beam. The layers of\nwarp are usually separated with heavy paper or warping\nsticks.\n\n5) BEATER\nA frame attached to the loom near the cloth beam to hold\nthe reed to beat the weft.It consists of a frame where the\nreed is inserted. The frame's top is removable tp allow\nthe easy installation of different sizes of the reed. When\nthe appropriate reed is in place, the beater is used to\npress the weft perpendicularly against the warp and as\nweaving progress against the warp and as weaving\nprogresses against the woven cloth. Beaters may either\nswing from a bar laid crosswise over the loom or from the\nside beam at the part of the loom.\n\n6) BEATING / JERK\nMeans filling the thread to give firmness on the fabric.\n\n7) BOBBIN / TALINYAS\nIs a fabricated thread / yarn holder made of straw or\nbamboo where strands of fiber are winded to form the\nweft.\n\n8) CLASSIFICATION\nThe quality control standard of the community practicing\nbackstrap loom weaving.\n\n9) CLOTH BEAM /\nLIKISAN\nHolds the web or the woven fabric that can be found in\nthe lower front of the loom. It is a beam directly below the\nbreast beam. The newly woven cloth is wound and\nstored here.\n\n10) COUNTERBALANCE\nLOOM\nAre quiet and have a faster and softer treadling (requiring\nless weight) than jack-type looms.\n\n11) CROSS STICK /\nSALIDSIRAN\nIs a guide stick inserted to cross on the warp\n12) FLOATING WEFT OR\nINLAID / PILI\nIs a type of weaving that creates design in the cloth.\n13) HARNESS\nIs a string or tie used to attach the upper heddle bar to\nthe head roller and lower heddle bar to the treadle.\n\n--- PDF PAGE 130 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 126\n\n14) HEDDLES\nIs a cord with an eye. It carries the ends of the cord to\nthe harness. Fabricated thru the use of strings, flat metal\nor iron. They have end loops where the harnesses and\nheddle bars are inserted in the central eye where the\nwarp is threaded according to the draft or design plan.\nHeddles lift the individual warp thread during the weaving\nprocess so that the desired pattern may merge.\n\n15) HEAD ROLLER /\nLIGID-LIGID\nRefers to the round bar placed crosswise at the top of\nthe loom and to the parallel bar below it. These roller\nsupport the ropes which keep the hanging in place.\n\n16) HEDDLE BARS\nThese are narrow horizontal bars lie below the roller and\nare much shorter so they can be raised or lowered by\npressing the loom's treadles to create a shed or opening\non the warp. Heddle bars come in pairs. The upper bars\nare tied to the rollers which the lower bars are attached\nto the foot treadles with the heddles suspended between\nthe bars. The set of harness per loom can range from\ntwo to as much as 24. Two-harness looms are so called\nbecause they have only two set of harnesses. In some\nlooms, pairs of heddle frames, instead of bars are used\nto contain the heddles.\n\n17) IN-LAID STICKS /\nBALILA\nIt is a flat wood measured 2.5\" in x 0.25\" in thickness.\nThe length depends on the width of the cloth. It aids the\nweaver in creating designs on the woven cloth.\n\n18) JACK-TYPE LOOM\nAs pressure is applied to the treadle (foot pedal), the\nharnesses rise as they are connected by jacks. This is\nwhy they are sometimes called \"rising shed\" looms. It is\npreferred by more experienced weavers as they only\nhave to tie up the part of the warp that goes up, so it can\ncut your prep time in half when warping the loom.\n\n19) LEASE STICKS\nAre sticks that come with a loom. They usually match the\nloom width. Lease sticks can be used during the warping\nprocess to hold the cross.\n\n20) MINOR REPAIR\nThe replacement of defective loom\n21) PICK-UP STICK\nA fabricated stick used to separate lift design heddles in-\nlaid patterns called 'pili'.\n\n22) RADDLE\nAlso called as a 'thread-spreader'; it is a wooden frame\nwith legs whose upper edge is lined with metal loops\nmade of ordinary nails.\n\n23) RATCHET WHEEL\nWheels, made of wood or metal, the edge has\nequidistant teeth to lock the loom's rotating beams-such\nas the warp beam (at the back) or the cloth beam (in\nfront) -in place. These device are kept stationary by\n\n--- PDF PAGE 131 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 127\ncatches fastened to the loom.\n\n24) REED / SUYOD\nIt is tool made of very fine vertical equidistant metal strips\nenclosed with in a metal frame. Keep the warp threads\nneatly parallel & evenly spaced. During the weaving\nprocess, the reed beats the weft into place. Reeds are\navailable in different sizes. The sizes are determined by\nthe number of dents per inch. Although the finished web\nor cloth cannot exceed the width of the reed, the fineness\nor coarseness of a fabric is partly affected by the size of\nthe reed used and how it is threaded.\n\n25) SET-UP\nProcess of something ready to be used\n\n26) SHED STICKS\nWider sticks, which are thin, flat and rounded at the ends\nand slanting at the edges. It may be made in various\nlengths and widths to suit the weaver' s requirement.\nThese sticks are used to increase the width of the shed\nor to create variations on fabrics woven on plain-weaving\nlooms or the 2-harness loom.\n\n27) SHUTTLE / SIKUAN\nIs a boat-like piece of wood which carries the bobbin with\nknotted fiber and is being thrown back and forth to form\nthe desired cloth.\n\n28) SLEY\nPassing the warp through heddle thread and reed.\n\n29) SPINDLE\nA steel or coconut midrib stick (kugong) to secure the\nboat shuttle. Several bobbins are prepared so that\nweaving may be done continuously.\n\n30) SPOOL / SKEIN\nHOLDER\nUsed to substitute a thread spreader when one is dealing\nwith lesser quantities of thread. It is wooden block with\nvertical pegs projecting from surface. Each cone or skein\nof thread to be used is placed around a peg. Each cone\nor skein of thread to be used is placed around a peg. An\nextra peg, longer than the others, is placed at one end of\nthe block and a screw eye is embedded in it.\n\n31) STICK / AGSAM\nIs a stick derived from the vine plants locally called\nagsam which is used at the warp to provide guide to the\nweaver in aligning the warp in its proper position\n\n32) THREADING HOOK /\nREED HOOK\nLooks like a flattened bamboo or steel similar to broader\nversion of the crochet hook. It is available in different\nforms and sizes. It is used to draw the warp threads\nthrough the reed.\n\n33) TREADLE / SIKNAN\nIs a fabricated bamboo tied up to the harness so that the\ntreadle will move up and down to intertwine with the warp\nfloor loom are operated by foot treadles or pedals\nattached to the harnesses this action creates a shed\n\n--- PDF PAGE 132 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 128\nthrough which the weft is drawn. Being foot controlled the\nweaver hands can throw and catch\" the weft-filled\nunhindered. The number of treadles on a loom will\ndepend on the number of sent ie-,a 2 harness loo will\nhave 2 treadles.\n\n34) WARPING WHEEL\nIs a warping equipment used in weaving.\n\n35) WARP-OUT\nExcess warp\n\n36) WARP BEAM\nIt is the beam or bar at the lower back of the loom where\nthe unwoven warp threads are stored. It is periodically\nrotated so that the warp may advance during the\nweaving process. A corresponding beam, called the cloth\n, can be found at the lower front of the loom, which , in\nturn , holds the web or woven fabric.\n\n37) WARPING PROCESS Taking off the warp threads from warping frame.\n\n--- PDF PAGE 133 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 129\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHandloom Weaving (Backstrap) NC II\nQualification Code:\nCREHWB223\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nHandloom Weaving\n(Backstrap) NC II\nTBR No. 2023-12/\nDec. 12, 2023\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 134 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 130",
