  "source_text": "SECTION 1 HANDLOOM WEAVING (BACKSTRAP) NC II QUALIFICATION\n\nThe HANDLOOM WEAVING (BACKSTRAP) NC II Qualification consists of\ncompetencies that a person must achieve to be able to conduct preparatory activities prior to\nweaving on a loom; perform basic backstrap operations; recognize and check product quality;\ncomplete the whole weaving process including finishing and final quality assessment and to be\nable to market & promote the finished woven product.\n\nThis Qualification is packaged from the competency map of the Creative Sector as\nshown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCode\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in a team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the workplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCode\nCOMMON COMPETENCIES\nCRE731201\nEnhance industry knowledge and skills\nCRE731202\nEnhance creative and artistic skills and cultural awareness\nCRE731205\nManage own performance\nCRE731206\nMaintain a safe, clean and efficient work environment\nCRE731207\nProvide and maintain effective customer service\nCRE731208\nDevelop artistic skills and cultural awareness of one-self\nCRE731209\nWork with tools, materials, and equipment\nCRE731210\nPerform mensuration and calculation\n\nCode\nCORE COMPETENCIES\nCRE731310\nConduct backstrap pre-weaving activities\nCRE731311\nPerform backstrap weaving\nCRE731312\nConduct post- weaving activities\n\n--- PDF PAGE 6 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 2\n\nA person who has achieved this Qualification is competent to be:\n\n❑ Backstrap warper\n❑ Backstrap Weaver\n❑ Backstrap production controller\n❑ Backstrap support weaver\n❑ Post-production officer\n❑ Packaging specialist\n❑ Finisher\n❑ Quality control officer\n\n--- PDF PAGE 7 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 3"
}
