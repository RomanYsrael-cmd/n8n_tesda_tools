RAINER’S QUALIFICATIONS FOR CREATIVE SECTOR\n\nTrainers who will deliver the training on HANDLOOM WEAVING (BACKSTRAP) NC II\nshould have the following:\n\n• Must be Cultural Masters endorsed by NCCA.\n\nOR\n\n• Must have been trained and certified by TESDA recognized Cultural Master to gain\nNC in a particular qualification;\n• Must be a holder of NTTC I (NC + TM I) in Handloom Weaving (Backstrap) NCII; and\n• Include years of industry experiences*\n\nOR\n\n• Must be a holder of NTTC I (NC + TM I) in Handloom Weaving (Backstrap) NCII; and\n• Must have at least 2-year job/industry experience for the last 5 years\n\n*Note: Based on iWER guidelines\n\n--- PDF PAGE 123 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 119\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the achievements of\nthe requirements of the qualification to enable the trainer make judgement whether the trainee\nis competent or not competent.\n\n--- PDF PAGE 124 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 120"
