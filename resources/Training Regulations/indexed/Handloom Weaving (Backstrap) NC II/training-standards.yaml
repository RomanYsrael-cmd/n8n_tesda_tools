t\nrestoration\nactivities\n• Discuss and explain the following:\no Cleaning and storage of tools and\nequipment\no 5S of Good Housekeeping\no Storage of materials\no Waste management\no Environmental regulations\no Workplace restoration\no OSHS\n• Conduct restoration activities.\n• PowerPoint\npresentation\n• Lecture Discussion\n• Demonstration\n• Video presentation\n• Illustration and\npictures\n• Written\nExamination\n• Demonstration\n• Oral Questioning\n2 hrs\n\n--- PDF PAGE 115 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 111\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards).\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies.\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards.\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies.\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1. School/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n\n--- PDF PAGE 116 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 112\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2. Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship – is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3. Community-Based – short term program conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers which\nare intended to address the specific needs of a community. Such programs can\nbe conducted in informal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP).\n\n--- PDF PAGE 117 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 113\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this program must possess the following\nrequirements:\n\n• Able to read and write;\n• Able to communicate, verbal or non-verbal; and\n• Basic arithmetic skills\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering the TVET program.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nHANDLOOM WEAVING (BACKSTRAP) NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nHandloom Weaving (Backstrap) NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their availability in\nthe local market.\n\nSchool equipment, tools and materials\n1-unit Digital light projection\n1-unit System uni