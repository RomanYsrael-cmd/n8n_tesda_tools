  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider when\ndesigning training programs for HANDLOOM WEAVING (BACKSTRAP) NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany the curricula.\n\nCourse Title:\nHANDLOOM WEAVING\n(BACKSTRAP)\nLevel NC II\n\nNominal Training Duration:\n37 Hours (Basic Competencies)\n\n301 Hours (Common Competencies)\n\n91 Hours (Core Competencies)\n\n429 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\nconducting backstrap pre-weaving activities, performing backstrap weaving, and conducting\npost- weaving activities.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 93 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 89\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n1.2 Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and procedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 94 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 90\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.3 Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people of\nsocial range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work related documents\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no\nObjectives and goals of team\n•\nLocate needed information from the\ndifferent sources of information\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n--- PDF PAGE 95 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 91\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play: Communication protocols\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n3. Solve/address\ngeneral\nworkplace\nproblems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Analyze routine/procedural problems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.2 Look for\nsolutions to\nroutine\nproblems\n• Review of the current industry hardwa