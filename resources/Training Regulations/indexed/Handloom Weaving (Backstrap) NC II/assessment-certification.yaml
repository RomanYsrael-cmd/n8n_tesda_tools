    {
      "number": "1",
      "text": "APRON Is a canvas attached to the warp ends to start weaving."
    },
    {
      "number": "2",
      "text": "APRONING Is a process of typing the warp ends to the apron cloth that is attached to the cloth beam which start weaving process."
    },
    {
      "number": "3",
      "text": "BACK BEAM / Located above the warp beam. The warp beam passes over this firm support to maintain its tension. A corresponding surface called the breast beam, can be found at the upper front of the loom."
    },
    {
      "number": "4",
      "text": "BEAMING Is to wind the warp onto the warp beam. The layers of warp are usually separated with heavy paper or warping sticks."
    },
    {
      "number": "5",
      "text": "BEATER A frame attached to the loom near the cloth beam to hold the reed to beat the weft.It consists of a frame where the reed is inserted. The frame's top is removable tp allow the easy installation of different sizes of the reed. When the appropriate reed is in place, the beater is used to press the weft perpendicularly against the warp and as weaving progress against the warp and as weaving progresses against the woven cloth. Beaters may either swing from a bar laid crosswise over the loom or from the side beam at the part of the loom."
    },
    {
      "number": "6",
      "text": "BEATING / JERK Means filling the thread to give firmness on the fabric."
    },
    {
      "number": "7",
      "text": "BOBBIN / TALINYAS Is a fabricated thread / yarn holder made of straw or bamboo where strands of fiber are winded to form the weft."
    },
    {
      "number": "8",
      "text": "CLASSIFICATION The quality control standard of the community practicing backstrap loom weaving."
    },
    {
      "number": "9",
      "text": "CLOTH BEAM / Holds the web or the woven fabric that can be found in the lower front of the loom. It is a beam directly below the breast beam. The newly woven cloth is wound and stored here."
    },
    {
      "number": "10",
      "text": "COUNTERBALANCE Are quiet and have a faster and softer treadling (requiring less weight) than jack-type looms."
    },
    {
      "number": "11",
      "text": "CROSS STICK / Is a guide stick inserted to cross on the warp"
    },
    {
      "number": "12",
      "text": "FLOATING WEFT OR Is a type of weaving that creates design in the cloth."
    },
    {
      "number": "13",
      "text": "HARNESS Is a string or tie used to attach the upper heddle bar to the head roller and lower heddle bar to the treadle. --- PDF PAGE 130 --- TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 126"
    },
    {
      "number": "14",
      "text": "HEDDLES Is a cord with an eye. It carries the ends of the cord to the harness. Fabricated thru the use of strings, flat metal or iron. They have end loops where the harnesses and heddle bars are inserted in the central eye where the warp is threaded according to the draft or design plan. Heddles lift the individual warp thread during the weaving process so that the desired pattern may merge."
    },
    {
      "number": "15",
      "text": "HEAD ROLLER / Refers to the round bar placed crosswise at the top of the loom and to the parallel bar below it. These roller support the ropes which keep the hanging in place."
    },
    {
      "number": "16",
      "text": "HEDDLE BARS These are narrow horizontal bars lie below the roller and are much shorter so they can be raised or lowered by pressing the loom's treadles to create a shed or opening on the warp. Heddle bars come in pairs. The upper bars are tied to the rollers which the lower bars are attached to the foot treadles with the heddles suspended between the bars. The set of harness per loom can range from two to as much as 24. Two-harness looms are so called because they have only two set of harnesses. In some looms, pairs of heddle frames, instead of bars are used to contain the heddles."
    },
    {
      "number": "17",
      "text": "IN-LAID STICKS / It is a flat wood measured 2.5\" in x 0.25\" in thickness. The length depends on the width of the cloth. It aids the weaver in creating designs on the woven cloth."
    },
    {
      "number": "18",
      "text": "JACK-TYPE LOOM As pressure is applied to the treadle (foot pedal), the harnesses rise as they are connected by jacks. This is why they are sometimes called \"rising shed\" looms. It is preferred by more experienced weavers as they only have to tie up the part of the warp that goes up, so it can cut your prep time in half when warping the loom."
    },
    {
      "number": "19",
      "text": "LEASE STICKS Are sticks that come with a loom. They usually match the loom width. Lease sticks can be used during the warping process to hold the cross."
    },
    {
      "number": "20",
      "text": "MINOR REPAIR The replacement of defective loom"
    },
    {
      "number": "21",
      "text": "PICK-UP STICK A fabricated stick used to separate lift design heddles in- laid patterns called 'pili'."
    },
    {
      "number": "22",
      "text": "RADDLE Also called as a 'thread-spreader'; it is a wooden frame with legs whose upper edge is lined with metal loops made of ordinary nails."
    },
    {
      "number": "23",
      "text": "RATCHET WHEEL Wheels, made of wood or metal, the edge has equidistant teeth to lock the loom's rotating beams-such as the warp beam (at the back) or the cloth beam (in front) -in place. These device are kept stationary by --- PDF PAGE 131 --- TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 127 catches fastened to the loom."
    },
    {
      "number": "24",
      "text": "REED / SUYOD It is tool made of very fine vertical equidistant metal strips enclosed with in a metal frame. Keep the warp threads neatly parallel & evenly spaced. During the weaving process, the reed beats the weft into place. Reeds are available in different sizes. The sizes are determined by the number of dents per inch. Although the finished web or cloth cannot exceed the width of the reed, the fineness or coarseness of a fabric is partly affected by the size of the reed used and how it is threaded."
    },
    {
      "number": "25",
      "text": "SET-UP Process of something ready to be used"
    },
    {
      "number": "26",
      "text": "SHED STICKS Wider sticks, which are thin, flat and rounded at the ends and slanting at the edges. It may be made in various lengths and widths to suit the weaver' s requirement. These sticks are used to increase the width of the shed or to create variations on fabrics woven on plain-weaving looms or the 2-harness loom."
    },
    {
      "number": "27",
      "text": "SHUTTLE / SIKUAN Is a boat-like piece of wood which carries the bobbin with knotted fiber and is being thrown back and forth to form the desired cloth."
    },
    {
      "number": "28",
      "text": "SLEY Passing the warp through heddle thread and reed."
    },
    {
      "number": "29",
      "text": "SPINDLE A steel or coconut midrib stick (kugong) to secure the boat shuttle. Several bobbins are prepared so that weaving may be done continuously."
    },
    {
      "number": "30",
      "text": "SPOOL / SKEIN Used to substitute a thread spreader when one is dealing with lesser quantities of thread. It is wooden block with vertical pegs projecting from surface. Each cone or skein of thread to be used is placed around a peg. Each cone or skein of thread to be used is placed around a peg. An extra peg, longer than the others, is placed at one end of the block and a screw eye is embedded in it."
    },
    {
      "number": "31",
      "text": "STICK / AGSAM Is a stick derived from the vine plants locally called agsam which is used at the warp to provide guide to the weaver in aligning the warp in its proper position"
    },
    {
      "number": "32",
      "text": "THREADING HOOK / Looks like a flattened bamboo or steel similar to broader version of the crochet hook. It is available in different forms and sizes. It is used to draw the warp threads through the reed."
    },
    {
      "number": "33",
      "text": "TREADLE / SIKNAN Is a fabricated bamboo tied up to the harness so that the treadle will move up and down to intertwine with the warp floor loom are operated by foot treadles or pedals attached to the harnesses this action creates a shed --- PDF PAGE 132 --- TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 128 through which the weft is drawn. Being foot controlled the weaver hands can throw and catch\" the weft-filled unhindered. The number of treadles on a loom will depend on the number of sent ie-,a 2 harness loo will have 2 treadles."
    },
    {
      "number": "34",
      "text": "WARPING WHEEL Is a warping equipment used in weaving."
    },
    {
      "number": "35",
      "text": "WARP-OUT Excess warp"
    },
    {
      "number": "36",
      "text": "WARP BEAM It is the beam or bar at the lower back of the loom where the unwoven warp threads are stored. It is periodically rotated so that the warp may advance during the weaving process. A corresponding beam, called the cloth , can be found at the lower front of the loom, which , in turn , holds the web or woven fabric."
    },
    {
      "number": "37",
      "text": "WARPING PROCESS Taking off the warp threads from warping frame. --- PDF PAGE 133 --- TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 129 TRAINING REGULATIONS (TR) Qualification Title: Handloom Weaving (Backstrap) NC II Qualification Code: CREHWB223 Revision No. Document Types* Qualification Title TESDA Board Resolution No./ Date Deployment Circular (TESDA Circular/ Implementing Guidelines) 00 Document Created Handloom Weaving (Backstrap) NC II TBR No. 2023-12/ Dec. 12, 2023 Legend: *Description Types - Document Created - Document Amended --- PDF PAGE 134 --- TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 130 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies and labor groups who donated their time and expertise to the development and validation of this Training Regulations (TRs). This undertaking was also made possible through the support of National Commission for Culture and the Arts under a collaborative project between NCCA and TESDA entitled Support for TESDA Program Creative Industry Qualification Standards and Development of Culturally Sensitive Modules for TESDA. (COMMON COMPETENCIES) MS. MARGARITA BALANSI- GAYAC Technical Expert Battal na Ga’dang Inc. MS. RENEFE TREMEDAL Technical Expert Dumendingan Arts Guild, Inc MS. LEONISA A. IMPIL Technical Expert Cabagtasan, Tribal Council (CTC) MR. REDEN S. ULO Technical Expert SLT – T’BOLI Coordinator MS. MERLY C. DELFIN Technical Expert Municipality of Calinog (CORE COMPETENCIES) MS. ANNA INDIA DELA CRUZ – LEGAZPI Technical Expert Heritage Arts and Crafts MR. ARTHUR D. GULILI Technical Expert Kalyak Blaan Care Group Purok 4 amgu-o Landan, Polomolok, South Cotabato MS. JOSEFA L. GARLITOS Technical Expert MS. BERNADETH T. OFONG Klowil Kem Libun Organization Inc MS. ALICE A. PANARES Technical Expert DepEd /