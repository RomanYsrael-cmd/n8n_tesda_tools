      "text": "1 To attain the Full National Qualification of HANDLOOM WEAVING (BACKSTRAP) NC II, the candidate must demonstrate competence in all units of competency listed below. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. Code 400311210 Participate in workplace communication 400311211 Work in a team environment 400311212 Solve/address general workplace problems 400311213 Develop career and life decisions 400311214 Contribute to workplace innovation 400311215 Present relevant information 400311216 Practice occupational safety and health policies and procedures 400311217 Exercise efficient and effective sustainable practices in the workplace 400311218 Practice entrepreneurial skills in the workplace Code CRE731201 Enhance industry knowledge and skills CRE731202 Enhance creative and artistic skills and cultural awareness CRE731205 Manage own performance CRE731206 Maintain a safe, clean and efficient work environment CRE731207 Provide and maintain effective customer service CRE731208 Develop artistic skills and cultural awareness of one-self CRE731209 Work with tools, materials, and equipment CRE731210 Perform mensuration and calculation Code CRE731310 Conduct backstrap pre-weaving activities CRE731311 Perform backstrap weaving CRE731312 Conduct post- weaving activities"
    },
    {
      "number": "4.1",
      "text": "2 The qualification of Handloom Weaving (Backstrap) NC II may be acquired through the accumulation of Certificates of Competency (COCs) in the following units of competencies: COC 1 – Conduct backstrap pre-weaving activities COC 2 – Perform backstrap weaving --- PDF PAGE 125 --- TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 121 COC 3 – Conduct post-weaving activities Certificates of Competency (COCs) shall be issued to candidate who have been assessed as competent in any of the above COCs (COC 1, COC 2, COC 3). Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Handloom Weaving (Upright) NC II."
