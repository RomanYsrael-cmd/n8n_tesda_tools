Backstrap) NC II Revision 00 Promulgated (12/12/2023) 133\nMR. ARTHUR D. GULILI\nKalyak Blaan Care Group\nPurok 4 amgu-o Landan, Polomolok, South\nCotabato\n\nMS. ERMELYN A. TARIGA\nSan Jose Multipurpose Cooperative\nSan Jose, Sarrat, Ilocos Norte\nMS. ROSARIO U. MANIACUP\nBalikatang Pamayanan ng Inaon Multipurpose\nCooperative\nSampaguita St., Inaon, Pulilan, Bulacan\nMS. CHRISTINE T. UBAGAN\nAbai Weavers Multipurpose Cooperative\n(AWMC)\nDiamond GK Village Kibanghot,Laguna, Misamis\nOriental\n\nMS. ROSANNA G. MOSO\nKalyak Blaan Care Group\nPurok 4 Amgu-o Landon, Polomolok, South\nCotabato\n\nThe Members of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualification and Standards Office\n\n--- PDF PAGE 138 ---\nTraining Regulation are available in both printed and electronic copies\nfor more information, please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTele Fax No.: 818-7728\nor visit our website: www.tesda.gov.ph"
