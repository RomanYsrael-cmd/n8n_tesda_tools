  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the\nFull National Qualification of HANDLOOM WEAVING\n(BACKSTRAP) NC II, the candidate must demonstrate competence in all units\nof competency listed below. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\nCode\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in a team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCode\nCOMMON COMPETENCIES\nCRE731201\nEnhance industry knowledge and skills\nCRE731202\nEnhance creative and artistic skills and cultural awareness\nCRE731205\nManage own performance\nCRE731206\nMaintain a safe, clean and efficient work environment\nCRE731207\nProvide and maintain effective customer service\nCRE731208\nDevelop artistic skills and cultural awareness of one-self\nCRE731209\nWork with tools, materials, and equipment\nCRE731210\nPerform mensuration and calculation\n\nCode\nCORE COMPETENCIES\nCRE731310\nConduct backstrap pre-weaving activities\nCRE731311\nPerform backstrap weaving\nCRE731312\nConduct post- weaving activities\n\n4.1.2 The qualification of Handloom Weaving (Backstrap) NC II may be acquired\nthrough the accumulation of Certificates of Competency (COCs) in the following\nunits of competencies:\n\nCOC 1 – Conduct backstrap pre-weaving activities\nCOC 2 – Perform backstrap weaving\n\n--- PDF PAGE 125 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 121\nCOC 3 – Conduct post-weaving activities\n\nCertificates of Competency (COCs) shall be issued to candidate who have been\nassessed as competent in any of the above COCs (COC 1, COC 2, COC 3).\nUpon accumulation and submission of all the COCs acquired, an individual shall\nbe issued the corresponding National Certificate for the Handloom Weaving\n(Upright) NC II.\n\n4.1.3 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to apply for assessment and certification:\n\na. Graduates of WTR-, NTR-registered programs or formal/non-formal/informal\nincluding enterprise-based trainings related to HANDLOOM WEAVING\n(BACKSTRAP) NC II; or\n\nb. Experienced workers (wage employed or self-employed) who gained\ncompetencies related to all the core competencies of Handloom Weaving\n(Backstrap) NC II, for at least 6 months within the last 2 years.\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who gained competencies\nthrough education, informal training, previous work and/or life experiences with\nat least 2 years of continuous work experience in backstrap weaving (within the\nlast 3 years), may apply for recognition in this Qualification through Portfolio\nAssessment. The candidates should provide proof of his/her finished backstrap\nweaving products done, video of doing actual backstrap weaving, certification\nissued by Indigenous People’s Mandatory Representative of NCCA-SLT (School\nof Living Tradition) and other basic documents that will be required.\n\nRequirements and implementation procedure of Portfolio Assessment must be\nconsistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System, and with TESDA Circular No. 118, series of 2019 on\n“Addendum to the Implementing Guidelines on the Implementation Portfolio\nAssessment Leading to Recognition of Prior Learning (RPL) within the TESDA\nAssessment and Certification System.”\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is\navailable, where gaps exist, including readiness for assessment.\n\n--- PDF PAGE 126 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 122\n\nThis document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo\na quality assured procedure for accreditation before they are authorized by\nTESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 127 ---\nTR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 123\n\n"
