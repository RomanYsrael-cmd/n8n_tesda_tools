      "number": "400311218",
      "text": "Practice entrepreneurial skills in the workplace Code COMMON COMPETENCIES CRE731201 Enhance industry knowledge and skills CRE731202 Enhance creative and artistic skills and cultural awareness CRE731205 Manage own performance CRE731206 Maintain a safe, clean and efficient work environment CRE731207 Provide and maintain effective customer service CRE731208 Develop artistic skills and cultural awareness of one-self CRE731209 Work with tools, materials, and equipment CRE731210 Perform mensuration and calculation Code CORE COMPETENCIES CRE731310 Conduct backstrap pre-weaving activities CRE731311 Perform backstrap weaving CRE731312 Conduct post- weaving activities 4.1.2 The qualification of Handloom Weaving (Backstrap) NC II may be acquired through the accumulation of Certificates of Competency (COCs) in the following units of competencies: COC 1 – Conduct backstrap pre-weaving activities COC 2 – Perform backstrap weaving COC 3 – Conduct post-weaving activities Certificates of Competency (COCs) shall be issued to candidate who have been assessed as competent in any of the above COCs (COC 1, COC 2, COC 3). Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Handloom Weaving (Upright) NC II. 4.1.3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4 Any of the following are qualified to apply for assessment and certification: a. Graduates of WTR-, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to HANDLOOM WEAVING (BACKSTRAP) NC II; or b. Experienced workers (wage employed or self-employed) who gained competencies related to all the core competencies of Handloom Weaving (Backstrap) NC II, for at least 6 months within the last 2 years. 4.1.5 Recognition of Prior Learning (RPL). Candidates who gained competencies through education, informal training, previous work and/or life experiences with at least 2 years of continuous work experience in backstrap weaving (within the last 3 years), may apply for recognition in this Qualification through Portfolio Assessment. The candidates should provide proof of his/her finished backstrap weaving products done, video of doing actual backstrap weaving, certification issued by Indigenous People’s Mandatory Representative of NCCA-SLT (School of Living Tradition) and other basic documents that will be required. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System, and with TESDA Circular No. 118, series of 2019 on “Addendum to the Implementing Guidelines on the Implementation Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System.” 4.1.6 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
