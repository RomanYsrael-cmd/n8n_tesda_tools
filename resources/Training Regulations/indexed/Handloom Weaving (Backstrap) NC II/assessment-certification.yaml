 in the workplace Apply environmental work standards Exercise efficient and effective sustainable practices in the workplace Evaluate environmental work practices Lead towards improvement of environmental work programs, policies and procedures Manage implementation of environmental programs in the workplace Adopt entrepreneurial mindset in the workplace Practice entrepreneurial skills in the workplace Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs) Sustain entrepreneurial skills Develop and sustain a high- performing enterprise --- PDF PAGE 128 --- TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 124 Enhance industry knowledge and skills Provide and maintain effective customer service Enhance creative and artistic skills and cultural awareness Develop artistic skills and cultural awareness of one-self Manage own performance Work with tools, materials, and equipment Maintain a safe, clean and efficient work environment Perform mensuration and calculation Conduct backstrap pre- weaving activities Perform backstrap weaving Conduct post- weaving activities --- PDF PAGE 129 --- TR – Handloom Weaving (Backstrap) NC II Revision 00 Promulgated (12/12/2023) 125"
