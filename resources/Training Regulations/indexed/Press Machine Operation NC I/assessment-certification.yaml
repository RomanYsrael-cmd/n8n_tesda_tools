ation Utilize specialist communication skills Utilize specialist communication skills Work in team environment Develop team and individual Develop team and individual Apply problem-solving techniques in the workplace Apply problem-solving techniques in the workplace Demonstrate work values Practice occupational health and safety procedures Practice occupational health and safety procedures Develop and practice negotiation skills Use relevant technologies Use relevant technologies Collect, analyze and organize information Collect, analyze and organize information Plan and organize work Practice career professionalism Practice career professionalism Use mathematical concepts and techniques Promote environmental protection Promote environmental protection Practice housekeeping procedures --- PDF PAGE 52 --- TR press operation 11-19-07 50 Definition of Terms 1. Press A machine by which pressure is applied to a workpiece to cut, pierce, bend or shape it 2. Die A tool used to impart shapes to or to form impressions on sheet metal 3. Blanking A press operation wherein metal sheets are cut into shapes by striking with a punch 4. Bending A press operation that involves forming a metal part into a curved or angular shape, or the stretching or flanging of it along a curved path 5. Drawing A press operation that forces plastic deformation of metal in a die to form recessed parts or cuplike shapes 6. Drawing die A die that forms sheet metal into cuplike, wrinkle-free shapes 7. Feed stock The raw material furnished to a press machine to form or shape the metal 8. Trimming Removing excess materials from drawn or blanked part 9. Punching A piece removed from a sheet metal or other material by a punch press 10. Ram A plunger, weight or other guided structure for exerting pressure by impact --- PDF PAGE 53 --- TR press operation 11-19-07 51 The Technical Education and Skills Development Authority (TESDA) wishes to extend Thanks and appreciation to the many representatives of business