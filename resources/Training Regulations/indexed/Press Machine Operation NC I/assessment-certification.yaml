  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Press Machine Operation NC I, the\ncandidate must demonstrate competence in all the units of competency listed in\nSection 1. Successful candidates shall be awarded a National Certificate signed\nby the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2 Experienced workers (wage employed or self employed)\n\n4.4 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQS)\".\n\n--- PDF PAGE 51 ---\nTR press operation\n11-19-07\n49\nPerform mechanical\npress operation)\nPerform mechanical\npress pre-production\nactivities)\nCORE\nCOMPETENCIES\nCOMPETENCY MAP\nPRESS MACHINE OPERATION NC I\nCOMMON\nCOMPETENCIES\nApply safety\npractices\nPerform routine\nhousekeeping\nMeasure workpiece\n(Basic)\nInterpret working\ndrawings and\nsketches\nSelect and cut\nworkshop materials\nPerform shop\ncomputations (Basic)\nPerform preventive\nand corrective\nmaintenance\nPerform shop\ncomputations\n(Advanced)\nPerform shop\ncomputations\n(Intermediate)\nMeasure workpiece\nusing gages and\ncomparators\nMeasure workpiece\nusing angular\nmeasuring\ninstruments\nReceive and respond\nto workplace\ncommunication\nLead in workplace\ncommunication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\nParticipate in\nworkplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team and\nindividual\nAp