  "source_text": "COMPETENCY MAP - TOURISM SECTOR\n(Hotel and Restaurant)\n FRONT OFFICE SERVICES NC III\n\n--- PDF PAGE 143 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 139\n\nReceive and\nresolve\ncustomer\ncomplaints\nWork\ncooperatively\nin a general\nadministration\nenvironment\nMaintain\nquality\ncustomer/\nguest service\n\nRoster staff\nControl and\nOrder stock*\nPrepare and\ndeliver\ntraining\nsessions\nPlan, conduct\nand evaluate\nstaff\nperformance\nassessment\n\nMaintain\nhospitality\nindustry\nknowledge\nPerform child\nprotection\nduties relevant\nto the tourism\nindustry\nDevelop and\nsupervise\noperational\napproaches\nManage\nquality\ncustomer\nservice\nManage\nfinances within\na budget\nPlan and\nimplement a\nseries of\ntraining\nevents\nUse the\nassessment\nsystem for\ntraining\noutcome\n\nDevelop and\nupdate tourism\nindustry\nknowledge\nDevelop\nprotective\nenvironments\nfor children in\ntourism\ndestinations\nEstablish and\nmaintain a\nbusiness\nrelationship\nGather and\npresent\nproduct\ninformation\nMaintain\nquality\ncustomer/gues\nt service\nManage and\nresolve\nconflict\nsituations\nManage\nfinancial\nperformance\nwithin a budget\nMonitor and\nevaluate the\neffectiveness\nof training\noutcome\nEvaluate the\neffectiveness\nof\nassessment\nsystem\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 144 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 140\n\nReceive and process\nreservations\nOperate computerized\nreservations system\nProvide accommodation\nreception services\nConduct night audit\nProvide club\nreception\nservices\nProvide concierge and\nbell services\nProvide cashiering services\nMonitor routine workplace\noperations\nCoach and mentor others in\nJob skills\nMaintain financial\nstandards and\nrecords\nProvide for the safety\nof VIPs\nPlan and establish systems\nand procedures\nLead and manage people\nManage and resolve conflict\nsituations\nManage guests’\nfinancial records\n\nCORE COMPETENCIES\n\n--- PDF PAGE 145 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 141\n\nGLOSSARY OF TERMS\n\nConcierge\n -\na front office section taking charge of guest inquiries,\nrequests and complaints.\n\nComputer Literate\n- Is defined as the knowledge and ability to utilize computers\nand related technology efficiently, with a range of skills\ncovering\nlevels\nfrom\nelementary\nuse\nto\ncomputer\nprogramming and advanced problem solving.\n\nFront Office Agent\n -\na front office staff in-charge of accepting hotel reservations;\nregistering and checking–out guest; handling guest inquiries,\nrequest and complaints and F.O. Cashiering.\n\nReservation\n -\nthe process of requesting for room accommodation in\nadvance in a hotel or other commercial establishment.\n\nElectronic Key Card\n -\na computer generated electronic card used as guest room\nkey.\n\nBack-Of-The-House\n -\nnon-guest contact departments such as Accounting/Finance\n\nProperty Standards - based according to the hotel, hotel school, training\n institution or similar/related commercial establishment.\n\n--- PDF PAGE 146 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 142\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title: Front Office Services NC III\nQualification Code: TRSFOS319\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces\nVersion\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution\nNo./ Date)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nFront Office Services\nNC III\nNot Applicable\n2019-70/\nDec 17, 2019\n\n Legend: *Description Types\n- Document Created\n\n--- PDF PAGE 147 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 143",
