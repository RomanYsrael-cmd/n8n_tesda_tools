  "source_section_text": "SECTION 1\nFRONT OFFICE SERVICES NC III QUALIFICATION\n\nThe FRONT OFFICE SERVICES NC III Qualification consists of competencies that a\nperson must achieve to perform a range of skilled guest service tasks using discretion and\njudgment such as in the monitoring of workplace operations, coaching and mentoring job skills,\nmaintaining financial records and providing safety of VIP’s.\n\nThis Qualification is packaged from the competency map of the Tourism Sector (Hotel\nand Restaurant) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n\n400311322\nApply critical thinking and problem-solving techniques in\nthe workplace\nWork in a diverse environment\n400311323\n\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in\nthe organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium\nenterprises (MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\nTRS141201\nReceive and resolve customer complaints\nTRS141202\nWork cooperatively in a general administration environment\nTRS141203\nMaintain quality customer/guest service\nTRS141204\nRoster staff\nTRS141205\nControl and order stock\nTRS141206\nPrepare and deliver training sessions\nTRS141207 Plan, conduct and evaluate staff performance assessment\n\nCODE NO.\nCORE COMPETENCIES\nTRS122301\nMonitor routine workplace operations\nTRS122302\nCoach and mentor others in job skills\nTRS122303\nMonitor and control financial standards and guest records\nTRS122304\nProvide requirements for the security of guests\n\nA person who has achieved this Qualification is competent to be a:\n\n● Front Office Team Leader\n● Front Office Supervisor\n\n--- PDF PAGE 6 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 2"
