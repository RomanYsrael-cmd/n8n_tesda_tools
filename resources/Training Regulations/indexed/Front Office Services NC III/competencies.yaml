ANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.  Follow up \ncoaching \n \n \n \n \n \n \n3.1 Progress is monitored \nwith new skills in the \nworkplace and provide \nsupportive assistance as \nrequired \n3.2 Progress as required is \nreported to the \nappropriate person  \n3.3 Performance problems \nor difficulties with the \ncoaching are identified, \nrectified and referred to \nthe appropriate person \nfor follow-up \n \n3.1 Understanding \nprocedures and \ntechniques \n3.1 Observation \n3.2 Coaching \n3.3 Follow-through \nmentorship \n3.4 Results Orientation \n3.5 Quality Orientation \n3.6 Motivating others \n3.7 Emotional \nIntelligence/Interpers\nonal Savvy \n3.8 Building Trust and \nPersonal \nAccountability \n3.9 Promoting Self \nDevelopment\n\n--- PDF PAGE 95 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              91 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Coaching \nMay include: \n1.1   Explanation \n1.2   Demonstration \n1.3   Review  \n1.4   Trainee explanation \n1.5   Trainee demonstration \n1.6   Feedback \n \n2.  Factors \nMay include: \n2.1   Requesting coaching from colleague  \n2.2   Own observation and workplace experience  \n2.3   Direction from other colleagues. \n \n3.  Skill deficiencies (that could \nbe addressed by coaching) \nMay include: \n3.1 Customer service skills \n3.2 Technical or practical skills such as operating  \n      equipment, making something or completing  \n      documentation \n3.3 Selling or promoting products and services. \n \n4.  Suitable time and place \nMay include: \n4.1 On-the-job during work hours \n4.2 Before or after work \n4.3 In a simulated location away from the actual  \n       workplace \n5.  Purpose of coaching \nMay include: \n5.1   Skills development \n5.2   Address performance problems \n5.3   Request of supervisor or other person. \n6. Speci