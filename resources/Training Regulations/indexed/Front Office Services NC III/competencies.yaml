        "source_text": "--- PDF PAGE 9 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              5 \n \n UNIT OF COMPETENCY \n \n: \nLEAD SMALL TEAMS  \n \n UNIT CODE   \n \n \n:      \n400311320 \n \nUNIT DESCRIPTOR             \n:      \nThis unit covers the knowledge, skills and  \n \n \n \n \nattitudes to lead small teams including setting,  \n \n \n \n \nmaintaining and monitoring team and individual  \n \n \n \n \nperformance  standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Provide team \nleadership \n1.1   Work \nrequirements are \nidentified and \npresented to team \nmembers based on \ncompany policies \nand procedures \n1.2   Reasons for \ninstructions and \nrequirements are \ncommunicated to \nteam members \nbased on company \npolicies and \nprocedures \n1.3  Team members’ \nand leaders’ \nconcerns are \nrecognized, \ndiscussed and \ndealt with based on \ncompany practices \n1.1  Facilitation of \nTeam work \n1.2  Company policies \nand procedures \nrelating to work \nperformance \n1.3  Performance \nstandards and \nexpectations \n1.4  Monitoring \nindividual’s and \nteam’s \nperformance vis a \nvis client’s and \ngroup’s \nexpectations \n1.1  Communication \nskills required for \nleading teams \n1.2  Group facilitation \nskills \n1.3  Negotiating skills \n1.4  Setting \nperformance \nexpectation \n2. Assign \nresponsibilities \n2.1. Responsibilities are \nallocated having \nregard to the skills, \nknowledge and \naptitude required to \nundertake the \nassigned  task \nbased on company \npolicies. \n2.2. Duties are \nallocated having \nregard to individual \npreference, \ndomestic and \npersonal \nconsiderations, \nwhenever possible \n \n \n2.1  Work plan and \nprocedures \n2.2  Work \nrequirements and \ntargets \n2.2  Individual and \ngroup \nexpectations and \nassignments \n2.3  Ways to improve \ngroup leadership \nand membership \n2.1  Communication \nskills \n2.2  Management skills \n2.3  Negotiating skills \n2.4  Evaluation skills \n2.5  Identifying team \nmember’s \nstrengths and \nrooms for \nimprovement\n\n--- PDF PAGE 10 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              6 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Set \nperformance \nexpectations for \nteam members \n3.1  Performance \nexpectations are \nestablished based \non client needs  \n3.2  Performance \nexpectations are \nbased on individual \nteam members \nknowledge, skills \nand aptitude  \n3.3  Performance \nexpectations are \ndiscussed and \ndisseminated to \nindividual team \nmembers \n3.1  One’s roles and \nresponsibilities in \nthe team \n3.2  Feedback giving \nand receiving \n3.3  Performance \nexpectation \n \n \n3.1  Communication \nskills \n3.2  Accurate empathy \n3.3  Congruence \n3.4  Unconditional \npositive regard \n3.5  Handling of \nFeedback \n \n4.  Supervise team \nperformance \n4.1 Performance is \nmonitored based on \ndefined \nperformance criteria \nand/or assignment \ninstruction \n 4.2  Team members \nare provided with \nfeedback, positive \nsupport and advice \non strategies to \novercome any \ndeficiencies based \non company \npractices \n4.3  Performance \nissues which \ncannot be rectified \nor addressed within \nthe team are \nreferred to \nappropriate \npersonnel \naccording to \nemployer policy \n4.4  Team members are \nkept informed of \nany changes in the \npriority allocated to \nassignments or \ntasks which might \nimpact on \nclient/customer \nneeds and \nsatisfaction \n4.1  Performance \nCoaching  \n4.2  Performance \nmanagement \n4.3  Performance \nIssues \n \n \n4.1  Communication \nskills required for \nleading teams \n4.2  Coaching skill\n\n--- PDF PAGE 11 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              7 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.5  Team operations \nare monitored to \nensure that \nemployer/client \nneeds and \nrequirements are \nmet \n4.6   Follow-up \ncommunication is \nprovided on all \nissues affecting \nthe team \n 4.7  All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany \nprocedures\n\n--- PDF PAGE 12 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              8 \n \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Work requirements \nMay include: \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s \nconcerns \nMay include: \n2.1. Roster/shift details \n3. Monitor performance \nMay include: \n3.1. Formal process \n3.2. Informal process \n4. Feedback \nMay include: \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \nMay include: \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service\n\n--- PDF PAGE 13 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              9 \n \n    EVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to \nnext level of management or appropriate specialist \nand to negotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5. Set and communicated performance expectations for \na range of tasks and duties within the team and \nprovided feedback to team members \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2. Materials relevant to the proposed activity or task \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning  \n3.3. Portfolio \n4. Context for Assessment \n4.1   Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
