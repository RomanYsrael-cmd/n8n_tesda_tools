rocesses and \nsystems. \n2.5 Critical inquiry is \napplied and used \nto facilitate \ndiscourse on \nadjustments in the \nsimple work \nprocedures, \nprocesses and \nsystems. \n2.1 Seven habits of \nhighly effective \npeople. \n2.2 Character \nstrengths that \nfoster innovation \nand learning \n(Christopher \nPeterson and \nMartin Seligman, \n2004) \n2.3 Five minds of the \nfuture concepts \n(Gardner, 2007). \n2.4 Adaptation \nconcepts in \nneuroscience \n(Merzenich, 2013). \n2.5 Transtheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n2.1 Assessing readiness \nfor change on \nsimple work \nprocedures, \nprocesses and \nsystems. \n2.2 Generating insights \non how to improve \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n2.3 Facilitating action \nplans on how to \napply innovative \nprocedures in the \norganization.\n\n--- PDF PAGE 26 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              22 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Evaluate the \neffectiveness of \nthe proposed \naction plans \n3.1 Work structure is \nanalyzed to \nidentify the impact \nof the new work \nprocedures  \n3.2 Co-workers/key \npersonnel is \nconsulted to know \nwho will be \ninvolved with or \naffected by the \nwork procedure \n3.3 Work instruction \noperational plan of \nthe new work \nprocedure is \ndeveloped and \nevaluated. \n3.4 Feedback and \nsuggestion are \nrecorded. \n3.5 Operational plan \nis updated. \n3.6 Results and \nimpact on the \ndeveloped work \ninstructions are \nreviewed \n3.7 Results of the new \nwork procedure \nare evaluated \n3.8 Adjustments are \nrecommended \nbased on results \ngathered \n3.1 Five minds of the \nfuture concepts \n(Gardner, 2007). \n3.2 Adaptation concepts \nin neuroscience \n(Merze