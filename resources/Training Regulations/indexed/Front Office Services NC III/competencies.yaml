        "source_title": "ROSTER STAFF",
        "source_text": "--- PDF PAGE 62 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              58 \n \nUNIT OF COMPETENCY     :    ROSTER STAFF \n \nUNIT CODE \n          :     TRS141204 \n \n    UNIT DESCRIPTOR    \n:  \nThis unit covers the knowledge, skills, behavior and  \n \n \nmotivations required to develop staff rosters. This role  \n \n \nmay be carried out by operational supervisors and  \n \n \nmanagers. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and italicized \nterms are elaborated in \nthe  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Develop and \nimplement staff \nrosters \n1.1 Rosters are \ndeveloped in \naccordance with \ncompany \nagreements and \nwage budgets. \n1.2 Operational efficiency \nand customer service \nlevels are maximized \nwhile wage costs are \nminimized in roster \ndevelopment. \n1.3 Duties are combined \nwhere appropriate to \nensure effective use \nof staff. \n1.4 The available skills \nbase is utilized \nappropriately to roster \nthe most effective mix \nof staff and to meet \ndifferent operational \nrequirements. \n1.5 Rosters are \npresented in required \nformats to ensure \nclarity of information \nin accordance with \ncompany standards. \n1.6 Rosters are \ncommunicated to \nappropriate \ncolleagues within \ndesignated timelines. \n1.1 Effective \ncommunication \n1.2 Role of rosters and \ntheir importance in \ncontrolling staff \ncosts \n1.3 Factors to be \nconsidered when \ndeveloping rosters \n1.4 Formats for the \npresentation of staff \nrosters and details \nto be included \n1.5 Area of operation \nfor which roster is \nbeing developed \n1.6 Company \nstandards \n1.7 Customer Service \n \n \n \n1.1 Communications \nskills \n1.2 Developing rosters  \n1.3 Organizing \ninformation \n1.4 Preparing staff \nrosters\n\n--- PDF PAGE 63 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              59 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and italicized \nterms are elaborated in \nthe  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Maintain staff  \n    records \n2.1 Time sheets and \nother documentation \nare completed \naccurately and within \ndesignated timelines \n2.2 Staff records are \nupdated accurately \nand maintained or \nstored in accordance \nwith establishment \nprocedures \n2.1 Effective \ncommunication \n2.2 Area of operation \nfor which roster is \nbeing developed \n2.3 Records \nmanagement \n \n \n2.1 Communications \nskills \n2.2 Updating and \nmaintaining records \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Rosters \nMay include: \n1.1 An individual department \n1.2 A whole establishment \n1.3 A specific project \n2.Company agreements \nMay include: \n2.1 Number of hours worked in a given shift \n2.2 Overall number of hours allocated to different staff \nmembers \n2.3 Breaks between shifts \n2.4 Nature of duties allocated \n2.5 Use of permanent or casual staff\n\n--- PDF PAGE 64 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              60 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge and understanding of the \nfactors and issues which impact upon staff rostering \n1.2 Demonstrated familiarity with typical formats and the \nkey information to be included \n1.3 Demonstrated the ability to prepare staff rosters which \nmeet wage budgets and which provide a level of \nstaffing sufficient to ensure the delivery of high quality \ncustomer service. \n2. Resource   Implications \nThe following resources should be provided: \n2.1 Project or work activities which allow the candidate to \nprepare rosters for a workplace and to evaluate their \ncost efficiency and operational effectiveness against \nnominated standards \n2.2 Preparation of more than one roster to meet the staffing \nrequirements of more than one operational situation \n3. Methods of  Assessment \nCompetency in this unit may be assessed through: \n3.1 Evaluation of the staffing costs and observing service \nlevels at an event for which the candidate has prepared \nrosters \n3.2 Oral or written questions to assess knowledge of \nspecific factors which affect the design of rosters \n3.3 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate \n4. Context  for Assessment \n4.1  Competency may be assessed in actual workplace or  \nat the designated TESDA Accredited Assessment \nCenter.\n",
        "required_knowledge": [
          "1.1 Effective communication",
          "1.2 Role of rosters and their importance in controlling staff costs",
          "1.3 Factors to be considered when developing rosters",
          "1.4 Formats for the presentation of staff rosters and details to be included",
          "1.5 Area of operation for which roster is being developed",
