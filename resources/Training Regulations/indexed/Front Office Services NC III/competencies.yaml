        "source_text": "--- PDF PAGE 70 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              66 \n \nUNIT OF COMPETENCY \n:    PREPARE AND DELIVER TRAINING SESSIONS \n \nUNIT CODE \n        :    TRS141206 \n \nUNIT DESCRIPTOR           :    This unit deals with skills and knowledge required to prepare \nand deliver in-house training sessions in a range of settings \nwithin the hospitality industry workplace context. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms \nare elaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Determine \ntraining \nrequirements \n \n1.1 Current competencies of \nlearners are identified  \n1.2 Required competencies \nfor learners are identified  \n1.3 The training gap for \nlearners are described \n1.4 The identified training gap \nwith relevant personnel \nare confirmed  \n1.5 Support available for \ntraining provision are \ndetermined \n1.6 Recommendations for \ntraining are presented \n1.1 Active listening \ntechniques \n1.2 Record keeping \n1.3 Assessment process \n1.4 Enterprise’s policies \nand procedures \n1.5 Appropriate \nperformance \nassessment \n \n \n1.1 Questioning and \ncommunication skills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry information \nsources \n1.5 Identifying relevant \ninformation \n1.6 Compilation and \nclassification of \ninformation and data \n1.7 Networking skills \n2. Prepare   \n    training plan \n \n2.1 Session outlines for \napproved training are \ndeveloped \n2.2 Training content are \ndeveloped \n2.3 Training resources and \nmaterials are developed \n2.4 Individual training \nsessions are developed \n2.5 Training requirements \nare organized \n2.1 Active listening \ntechniques \n2.2 Record keeping \n2.3 Assessment process \n2.4 Enterprise’s policies \nand procedures \n2.5 Appropriate \nperformance \nassessment \n \n \n2.1 Questioning and \ncommunication skills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Ability to research \nindustry information \nsources \n2.5 Identifying relevant \ninformation \n2.6 Compilation and \nclassification of \ninformation and data \n2.7 Networking skills \n3. Deliver \ntraining \nsessions \n \n3.1 Attendance of learners at \nthe training session is \nconfirmed \n3.2 The training venue for the \ntraining session is prepared.  \n3.3 Training topic to learners \nis introduced. \n3.4 The training and \nassessment activities \ninvolved in the training \nsession is explained. \n3.5 Training session is \npresented.  \n \n3.6 Opportunities for learners \nto practice skills are \nprovided \n3.1 Active listening  \ntechniques \n3.2 Record keeping \n3.3 Assessment   \nprocess \n3.4 Enterprise’s policies \nand procedures \n3.5 Appropriate \nperformance \nassessment \n \n \n3.1 Questioning and \ncommunication skills \n3.2 Research skills \n3.3 Analytical skills \n3.4 Ability to research \nindustry information \nsources \n3.5 Identifying relevant \ninformation \n3.6 Compilation and \nclassification of \ninformation and data \n3.7 Networking skills\n\n--- PDF PAGE 71 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              67 \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms \nare elaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.7 Feedback to learners is \nprovided \n3.8 On-going safety of learners \nduring training delivery and \npractice is ensured\n\n--- PDF PAGE 72 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              68 \n \n  RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Current competencies of \nlearners  \nMay include: \n1.1 Observing workers’ practices \n1.2 Undertaking peer reviews \n1.3 Administering self-evaluation and analysis forms to \nworkers \n1.4 Reviewing data contained in workplace staff \nperformance systems/databases \n1.5 Reviewing application forms and resumes \n1.6 Seeking input from managers, supervisors and co-\nworkers \n1.7 Obtaining feedback from customers \n1.8 Checking currency of qualifications, certificates and \nlicenses \n1.9 Identifying individual learner preferences for training \ndelivery \n1.10 Assessing the level of literacy and numeracy amongst \nthe target group \n2.  Required competencies  \nMay include: \n2.1 Reviewing relevant training programs \n2.2 Verifying plans for the business \n2.3 Reviewing relevant policies and procedures \n2.4 Reviewing existing job analysis sheets and similar \n2.5 Describing performance standards \n2.6 Specifying product and service criteria \n2.7 Describing the workplace context, including the \nconditions under which tasks are to be completed \n3.  Training gap  \nMay include: \n3.1 Specifying the difference between organizational \nexpectations of staff/learner performance and the \nactual level of workplace performance for each \nworker/learner \n3.2 Confirming identified training gaps with individual \nstaff/learners \n4.  Relevant personnel  \n \nMay include: \n4.1 Supervisors, managers and owners \n4.2 Industry peak bodies \n4.3 Subject specialists \n4.4 Head office \n4.5 Union representatives \n4.6 Human resources department \n4.7 Staff/learners \n4.8 Trainers and assessors \n4.9 External consultants\n\n--- PDF PAGE 73 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              69 \n \nVARIABLE \nRANGE \n5.  Support available for \ntraining provision  \n \nMay include: \n5.1 Time \n5.2 Physical resources \n5.3 Human resources \n5.4 Financial resources \n5.5 Training venues \n5.6 Training resources and materials \n5.7 Management support for the initiative \n5.8 Established internal career paths based on internal \ntraining delivery \n6.  Recommendations \nMay include: \n6.1 Providin