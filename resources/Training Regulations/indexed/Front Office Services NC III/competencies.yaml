        "source_text": "--- PDF PAGE 57 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              53 \n \nUNIT OF COMPETENCY \n:   \nMAINTAIN QUALITY CUSTOMER/GUEST  \nSERVICE \n                                                    \nUNIT CODE  \n \n : \nTRS141203 \n \nUNIT DESCRIPTOR            \n :       This unit deals with the skills and knowledge required  \nto maintain a quality customer/guest service within  \nthe hotel and travel industries.   \n \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify customer/ \n    guest \nrequirements \n \n1.1 Options to improve \nservice levels are \nidentified \n1.2 Needs of customers \nand/or guests are \nresearched and \nassessed \n1.3 Deficiencies in \nservice delivery are \nidentified by \nconducting data \nanalysis  \n1.1 Principles of \neffective \ncommunication skills \n1.2 Business \nenvironment in \nwhich the hotel and \ntravel industry \noperates, including \nmajor current \ncustomer relations \nand management \nissues as \nappropriate to the \nindustry sector \n1.3 Principles of \ncustomer service  \n1.4 Organization's \nbusiness structure, \nproducts and \nservices and \norganization's policy \nand procedures for \ncustomer service, \nincluding handling \ncustomer complaints \n1.5 Product and service \nstandards and best \npractice models \n1.6 Common problems \nrelating to customer \nservice \n1.7 Consultation \nmethods, techniques \nand protocols \n1.8 Research and or \nevidence and \nfeedback gathering \ntechniques. \n1.1 Questioning and \ncommunication skills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry information \nsources \n1.5 Identifying relevant \ninformation \n1.6 Compilation and \nclassification of \ninformation and data \n1.7 Networking skills \n \n \n2.  Ensure delivery \nof quality \nproducts/ \n      services \n2.1 Colleagues to meet \nand exceed customer \nservice standards by \nproviding appropriate \n2.1 Principles of \neffective \ncommunication skills \n2.1 Questioning and \ncommunication skills \n2.2 Research skills \n2.3 Analytical skills\n\n--- PDF PAGE 58 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              54 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \nprofessional \ndevelopment are \nassisted \n2.2 Products/services are \nensured to meet \ncustomers’ needs and \nreflect enterprise \nstandards \n2.3 Consistently ensure \nproducts/services \nmeet customer needs \nand reflect enterprise \nstandards \n \n2.2 Business \nenvironment in \nwhich the hotel and \ntravel industry \noperates, including \nmajor current \ncustomer relations \nand management \nissues as \nappropriate to the \nindustry sector \n2.3 Principles of \ncustomer service  \n2.4 Organization's \nbusiness structure, \nproducts and \nservices and \norganization's policy \nand procedures for \ncustomer service, \nincluding handling \ncustomer complaints \n2.5 Product and service \nstandards and best \npractice models \n2.6 Common problems \nrelating to customer \nservice \n2.7 Consultation \nmethods, techniques \nand protocols \n2.8 Research and or \nevidence and \nfeedback gathering \ntechniques \n \n2.4 Ability to research \nindustry information \nsources \n2.5 Identifying relevant \ninformation \n2.6 Compilation and \nclassification of \ninformation and data \n2.7 Networking skills\n\n--- PDF PAGE 59 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              55 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.  Evaluate \ncustomer service \n \n3.1 Systems, records and \nreporting procedures \nin order to identify and \nreport on any changes \nin customer \nsatisfaction are \ncompared \n3.2 Customer service \nevaluation outcomes \nare evaluated and \nreported to designated \ngroups or individuals \n3.3 An agreement on \nappropriate courses of \naction to overcome \nproblems is obtained \nupon consultation with \ndesignated \nindividuals/groups \n \n \n3.1 Principles of \neffective \ncommunication \nskills \n3.2 Business \nenvironment in \nwhich the hotel and \ntravel industry \noperates, including \nmajor current \ncustomer relations \nand management \nissues as \nappropriate to the \nindustry sector \n3.3 Principles of \ncustomer service  \n3.4 Organization's \nbusiness structure, \nproducts and \nservices and \norganization's \npolicy and \nprocedures for \ncustomer service, \nincluding handling \ncustomer \ncomplaints \n3.5 Product and service \nstandards and best \npractice models \n3.6 Common problems \nrelating to customer \nservice \n3.7 Consultation \nmethods, \ntechniques and \nprotocols \n3.8 Research and or \nevidence and \nfeedback gathering \ntechniques \n \n3.1 Questioning and \ncommunication skills \n3.2 Research skills \n3.3 Analytical skills \n3.4 Ability to research \nindustry information \nsources \n3.5 Identifying relevant \ninformation \n3.6 Compilation and \nclassification of \ninformation and data \n3.7 Networking skills.\n\n--- PDF PAGE 60 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              56 \n \n  RANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Service levels \n \nMay include: \n1.1 Service quality \n1.2 Customer satisfaction \n1.3 Staff attitude \n1.4 Appearance of venue, staff, etc. \n1.5 Atmosphere of venue \n1.6 Responsiveness of staff to customer requests \n1.7 Delivery times \n1.8 Prices or costs \n1.9 Product or service availability \n1.10 Courtesy and politeness \n2. Appropriate professional \ndevelopment  \nMay include: \n2.1 Mentoring \n2.2 Coaching \n2.3 Training \n2.4 Peer support \n3. Evaluate and report on \ncustomer service  \nMay include: \n3.1 Service quality evaluations \n3.2 Customer satisfaction evaluations \n3.3 Industry benchmarking \n4. Designated groups or \nindividuals  \nMay include: \n4.1 Managers \n4.2 Supervisors \n4.3 Marketing personnel\n\n--- PDF PAGE 61 ---\nFRONT OFFICE SERVICES NC III                Revision 00                             Promulgated  (12/17/2019)              57 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to identify the needs and priorities of \nthe organization delivering services to customers/guests \n1.2 Demonstrated ability to distinguish between customer \nrequirements and customer satisfaction \n1.3 Demonstrated ability to provide constructive advice on \ncustomer/guest service practices \n1.4 Demonstrated ability to respond to and report on \ncustomer feedback \n1.5 Demonstrated ability to design strategies to improve \ndelivery of products and services \n1.6 Consistency of performance across a range of situations \nthat demonstrates knowledge, understanding and skill in \nimplementing the principles and practices of maintaining \nquality customer/guest services \n2.  Resource Implications \nThe following resources should be provided: \n2.1  Training and assessment to include access to a real or \nsimulated workplace and relevant documentation, such \nas strategic plans, information on the internal and \nexternal operating environment and customer \nsatisfaction data; and access to workplace standards, \nprocedures, policies, guidelines, tools and equipment. \n3.  Method of \nAssessment \nCompetency in this unit may be assessed through: \n \n3.1 Case studies \n3.2 Observation of practical candidate performance \n3.3 Oral and written questions \n3.4 Portfolio evidence \n3.5 Problem solving \n3.6 Role plays \n3.7 Third party reports completed by a supervisor \n3.8 Project and assignment work \n4.  Context of \nAssessment \n4.1  Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
