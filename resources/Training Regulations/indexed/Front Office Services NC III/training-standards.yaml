melines\n•\nExplain procedures in updating,\nmaintaining and storing staff\nrecords\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n5. Control And Order Stock\n5.1 Maintain stock\n levels and\nrecords\n• Explain how to monitor and\nmaintain stock levels and\nperformance\n• Identify the steps in monitoring\nstock security and adjusting\nsystems\n• Explain how to maintain records of\nstock storage and movement\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n6\nhours\n\n5.2 Process stock\norders\n• Explain how to process orders for\nstock in accordance with company\nprocedures\n• Identify steps in maintaining and\nrecording stock levels\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n5.3 Minimize stock\nlosses\n• Identify reasons for stock loss and\ndamage\n• Explain how to identify stock losses\n• Discussion\n• Demonstration\n• Lecture\n• Observation\n• Demonstration\n• Written\nexamination\n4\nhours\n\n--- PDF PAGE 129 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 125\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Identify the recommended related\nprocedures and solutions to loss\nsituations to prevent future\navoidable losses\n• Group\ndiscussion\n• Simulation\n\n• Interview\n\n5.4 Follow-up orders\n• Explain how to monitor delivery\nprocess and ensure continuity of\nsupply\n• Identify routine supply problems\n• Explain how to distribute stock to\nagreed locations.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n5.5 Organize and\nadminister stocks\n• Explain how to organize stocks\n• Identify the stocktaking\nresponsibilities\n• Demonstrate how to produce\naccurate stock reports\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n6. Prepare And Deliver Training\nSessions\n6.1 Determine\ntraining\nrequirements\n\n• Identify required competencies for\nlearners\n• Describe the training gap for\nlearners\n• Explain the identified training gaps\nand recommendation for training\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n6.2 Prepare training\nplan\n\n• Explain how to develop session\noutlines, training content, training\nresources and materials and\nindividual training session\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n6.3 Deliver training\nsessions\n\n•\nExplain the training and\nassessment activities involved in\nthe training session\n•\nIdentify steps in preparing training\nvenue for the training session\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n--- PDF PAGE 130 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 126\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Identify safety of learners during\ntraining delivery and practice\n\n7. Plan, conduct and evaluate staff\nperformance assessment\n\n7.1 Plan a staff\nperformance\nassessment\n•\nIdentify context for staff\nperformance assessment\n•\nDetermine the initial focus of the\nstaff performance assessment for\neach staff member\n•\nPrepare Documents to record\nidentified staff performance\nassessment statistics and\nperformance data\n•\nDesign action plan to guide the\nconduct of staff performance\nassessment\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n7. 2 Conduct a staff\nperformance\nassessment\n•\nIdentify steps in gathering\nworkplace-based evidence of staff\nperformance\n•\nExplain how to interpret employee\nperformance data\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n7.3 Evaluate a staff\nperformance\nassessment\n•\nPrepare staff performance\nassessment interview\n•\nIdentify steps in reviewing\nindividual staff performance\n•\nExplain how to prepare staff\nperformance assessment targets\nfor next period\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n--- PDF PAGE 131 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 127\n CORE COMPETENCIES\n(220 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Monitor\nroutine\nworkplace\noperations\n1.1 Monitor and\nimprove\nworkplace\noperations\n•\nMonitor efficiency and service levels on an ongoing\nbasis through close contact with day to day operations\n•\nIdentify quality problems and issues and make\nappropriate adjustments accordingly with relevant\napprovals\n•\nAdjust procedures and systems in consultation with\ncolleagues\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n6 hours\n\n1.2 Plan and\norganize\nworkflow\n\n•\nSchedule work in a manner that enhances efficiency\nand customer service quality\n•\nDelegate work to appropriate people in accordance\nwith principles of delegation\n•\nAssess progress against agreed objectives and\ntimelines\n•\nAssist colleagues in prioritization of workload through\nsupportive feedback and coaching\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n12 hours\n\n1.3 Maintain\nworkplace\nrecords\n\n•\nComplete workplace records accurately and submit\nwithin required timeframes\n•\nDelegate and monitor completion of records prior to\nsubmission\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n6 hours\n\n1.4 Solve\nproblems\nand make\ndecisions\n\n•\nIdentify workplace problems promptly and analyze\nfrom an operational and customer service perspective\n•\nInitiate corrective action to resolve the immediate\nproblem where appropriate\n•\nMonitor the effectiveness of solutions in the workplace\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n12 hours\n\n--- PDF PAGE 132 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 128\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Coach and\nmentor\nothers in\nJob skills\n2.1 Prepare for\non job\ncoaching\n•\nIdentify the need for coaching based on a range of\nfactors\n•\nIdentify skill deficiencies that could be addressed by\ncoaching needs through discussion with the colleague\nto be coached\n•\nOrganize with colleague a suitable time and place to\nconduct coaching in accordance with enterprise\npolicy, where appropriate\n•\n\n•\nLecture-\nDiscussion\n•\nReporting\n•\nSimulation\npractices\n•\nCase Analysis\n\n•\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n•\n\n36 hours\n\n2.2 Coach\ncolleagues\non the job\n\n•\nExplain to the colleague the overall purpose of\ncoaching\n•\nExplain and demonstrate the specific skills to be\ncoached\n•\nCommunicate clearly any underpinning knowledge\nrequired\n•\nCheck the colleague's understanding\n•\nProvide the colleague the opportunity to practice the\nskill and ask questions\n•\nProvide feedback in a constructive and supportive\nmanner\n•\nLecture-\nDiscussion\n•\nReporting\n•\nSimulation\npractice\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n\n40 hours\n\n2.3 Follow up\ncoaching\n\n•\nMonitor progress with new skills in the workplace and\nprovide supportive assistance as required\n•\nIdentify performance problems or difficulties with the\ncoaching and rectify them or refer them to the\nappropriate person for follow-up\n\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n12 hours\n3. Maintain\nFinancial\nStandards\nand\nRecords\n3.1 Monitor\nfinancial\nprocedures\n\n•\nCheck transactions in accordance with enterprise\nprocedures\n•\nBalance transactions accurately\n•\nCheck balances prepared by others in accordance\nwith enterprise procedures\n•\nImplement and control financial systems in\naccordance with enterprise procedures\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n12 hours\n\n--- PDF PAGE 133 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 129\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nMonitor financial systems and provide input on\npossible improvements to appropriate personnel\n•\nIdentify and resolve discrepancies or errors according\nto level of responsibility and in consultation with\ndesignated persons\n\n3.2 Complete\nfinancial\nreports\n\n•\nComplete routine financial/statistical reports accurately\nwithin designated timelines\n•\nForward financial/statistical reports promptly to the\nappropriate person/department\n\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n12 hours\n4. Provide for\nthe Safety\nof VIP’s\n\n4.1 Prepare for\nvisits by\nVIPs\n\n•\nIdentify the nature of the visit by the VIP\n•\nLiaise with relevant\npeople regarding the\nvisit\n•\nIdentify factors\nimpacting on VIP\nsafety while at the\npremises\n•\nCreate safety plans\nfor the VIP visit\n•\nIdentify resources\nrequired to support\nsafety plans\n•\nAcquire necessary\nsurveillance and\ncommunication\nequipment\n•\nSelect staff to provide for VIP safety\n•\nProvide information\nto staff in relation to\nVIP safety and plans\n•\nEstablish media\n•\nLecture-\nDiscussion\n•\nReporting\n•\nSimulation\npractices\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n\n24 hours\n\n--- PDF PAGE 134 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 130\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\nliaison facilities and\nprocedures\n•\nConduct drills to trial safety plans\n\n4.2 Implement\nplans for\nVIP safety\n\n•\nApply pre-arrival preparations\n•\nConduct final pre-arrival checks\n•\nMeet and escort VIPs\n•\nMaintain the safety of VIPs during stay\n•\nFacilitate departure of VIPs\n•\nLecture-\nDiscussion\n•\nReporting\n•\nSimulation\npractices\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n24 hours\n\n4.3 Conduct\nevaluation\nof plans\nfollowing\ndeparture of\nVIP\n\n•\nDe-brief staff who were involved with project\n•\nAnalyze responses to breaches of safety that\noccurred\n•\nPrepare draft safety plans for future VIP visits on the\nbasis of feedback received and analysis undertaken\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n24 hours\n\n--- PDF PAGE 135 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 131\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n--- PDF PAGE 136 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 132\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community.\nSuch programs can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 137 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 133\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• Must have completed the 10-year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent holder\n• Must possess good communications skills\n• Must be computer literate\n• Can perform basic mathematical computation\n• Must be competent in Front Office Services NC II qualification gained through\ntraining or experience or certification\n\n--- PDF PAGE 138 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 134\n3.4\nLIST OF TOOLS AND EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a minimum of 25\n\ntrainees for Front Office Services NC III are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n4 sets\nMicrosoft Office i.e. Excel, Word, PPT, Etc.\n\nEQUIPMENT\nQTY\nDESCRIPTION\n4 units\nComputer with Property Management System and\nprinter\n\nMATERIALS\nQTY\nDESCRIPTION\n5 sets\nSample Manpower roster/schedule\n1 pc\nWhite board\n5 pcs\nEmpty envelopes\n5 pcs\nLuggage Tag\n1 pc\nEasel Stand\n50 pcs\nEasel sheets\n.1 box\nWhiteboard markers\n5 sets\nSample Inventory Stocks Monitoring Form\n5 sets\nSample Staff Assessment Forms\n5 sets\nSample Financial Reports (FO)\n5 sets\nSample Safety Plans\n\n--- PDF PAGE 139 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 135\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nLecture\n8 x 7 m.\n56 sq. m.\n56 sq. m.\nLearning Resource Center\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n21 sq. m.\nTotal workshop area:\n92 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR FRONT OFFICE SERVICES NC III\n\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Front Office\nServices NC III\n• Must have at least two years industry experience in any Front Office related works\nas supervisor\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 140 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 136"
