ing\n1 Hour\n\n8.3 Evaluate\neffectiveness of\nenvironmental\npractices\n• Identifying effective environmental\npractices relevant to the\nindustry/occupation\n-\nImplementation of energy efficiency\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 124 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 120\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Case Study\n\n• Interviews /\nQuestioning\n• Third Party\nReports\n9. Facilitate\nEntrepreneurial\nSkills For Micro-\nSmall-Medium\nEnterprises\n(MSMEs)\n9.1 Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n• Discussions on business models and\nstrategies\n• Discussion on Types and categories of\nbusinesses and business internal control\n• Discussion on Relevant National and local\nlegislations affecting businesses\n• Prepare promotional materials\n• Practice basic bookkeeping\n\n• Lecture/\nDiscussion\n• Case Study\n• Demonstration\n• Written Test\n• Portfolio\n• Work Related\nProject\n2 Hours\n\n9.2 Establish and\nmaintain client-\nbase/market\n• Role play on customer and employee\nrelations\n• Discussion on Basic product promotion\nstrategies\n• Preparation of Basic Feasibility study\n• Case studies on Basic Business ethics\n• Prepare basic advertising materials\n• Role Play\n• Lecture\nDiscussion\n• Case study\n• Case problem\n• Written Test\n2 Hours\n\n9.3 Apply budgeting\nand financial\nmanagement\nskills\n• Discussion on:\n- Basic cost-benefit analysis\n- Basic financial management\n- Basic financial accounting\n- Business internal controls\n\n• Role Play\n• Lecture\nDiscussion\n• Group work\n• Written Test\n• Case problem\n1 Hour\n\n--- PDF PAGE 125 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 121\nCOMMON COMPETENCIES\n(96 Hours)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Receive and resolve customer\ncomplaints\n1.1 Identify and\nanalyse the\ncomplaint\n•\nExplain how to received verbal\ncomplaint using active listening\nand empathy techniques\n•\nIdentify through appropriate\ncommunication techniques the\nexact nature of the customer\ncomplaint\n•\nIdentify steps in maintain register or\ncomplaint file/s in accordance with\nthe requirements of the enterprise\ninformation system\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nhours\n1.2 Respond to\ncomplaints\n•\nExplain how to process complaints\nin accordance with organizational\nstandards, policies and procedures\n•\nExplain how to obtain and review\ndocumentation in relation to\ncomplaints\n•\nIdentify steps in updating register of\ncomplaints/disputes\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nhours\n\n1.3 Determine and\nagree upon\nappropriate\naction to resolve\ncomplaint\n•\nIdentify procedures and guidelines\non how to resolve the complaint\n•\nDemonstrate a commitment to the\ncustomer to resolve the complaint\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nhours\n\n1.4 Refer complaints\n•\nIdentify complaints that require\nreferral to other personnel or\nexternal bodies\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n--- PDF PAGE 126 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 122\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nExplain how to forward all\nnecessary documentation including\ninvestigation\n•\nreports to appropriate personnel\n• Simulation\n• Oral\nQuestioning\n2. Work cooperatively In a general\nadministration environment\n2.1 Develop\neffective team\nrelationships\n•\nExplain how to develop and\nmaintain relationships with team\nmembers and promote benefits of\ncooperative work consistent with\norganizational goals and objectives\n•\nIdentify communication techniques\nto relay information in a clear and\nconcise manner\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n2.2 Participate in\nteam\nassignments\n• Identify individual responsibilities\nwithin the workgroup in accordance\nwith organisational requirements\n• How to recognize and\naccommodate cultural differences\nwithin the team\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n2.3 Contribute to\nteam\ndevelopment\n\n• Identify the internal and external\ncustomer needs and expectations\n• Explain how to seek formal\nfeedback and informal feedback on\nindividual and team performance\nregularly from colleagues and\nsupervisors\n• Identify the non-discriminatory\nattitudes and language when\ninteracting with customers, staff and\nmanagement\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n--- PDF PAGE 127 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 123\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Maintain quality customer/guest\nservice\n\n3.1 Identify\ncustomer/ guest\nrequirements\n• Identify options to improve service\n• Explain how to assess needs of\ncustomers/or guests\n• Identify and conduct data analysis\non deficiencies in service delivery\n• Discussion\n• Demonstration\n• Lecture\