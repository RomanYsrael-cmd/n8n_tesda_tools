  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for FRONT OFFICE SERVICES NC III\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: FRONT OFFICE SERVICES NC Level: III\n\nNominal Training Duration: 40 Hours (Basic)\n\n 96 Hours (Common)\n\n 220 Hours (Core)\n\n 356 HOURS\n\n 64 Hours Supervised Industry Learning (SIL)\n\nCourse Description:\n\n This course is designed to enhance the knowledge, skills and attitudes in\naccordance with industry standards. This covers competencies that a person must\nachieve in performing task such as monitoring of workplace operations, coaching and\nmentoring job skills, maintaining financial records and providing safety of VIP’s. These\ncompetencies are required to individuals who will work as Front Office Team Leaders,\nSupervisors and a pre-requisite for Front Office Services NC IV.\n\nTo complete the course, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 114 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 110\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication methods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for written\nand electronic communication methods\n• Follow organization requirements for the use\nof written and electronic communication\nmethods\n• Perform exercises on understanding and\nconveying intended meaning scenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan setting\n• Read\no Effective verbal communication methods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Read\n• Effective verbal communication methods\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 Hours\n2. Lead small\nteams\n2.1 Provide team\nleadership\n\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational leadership\n• Role play on situational leadership\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Individual\nWork\n• Role Play\n• Written Test\n\n1 Hour\n\n--- PDF PAGE 115 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 111\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies of\ncurrent staff\n\n• Individual Work\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n\n2.3 Set\nperformance\nexpectations\nfor team\nmembers\n• Role play to communicate performance\nexpectations with staff\n• Discussion on performance issues\n\n• Lecture/\nDiscussion\n• Role Play\n• Role Play\n• Written Test\n\n1 Hour\n\n2.4 Supervise\nteam\nperformance\n• Discussion on performance monitoring\n• Role play on providing feedback on\nperformance\n• Role play on performance coaching\n• Discussion on keeping the team informed of\nteam performance\n• Case study on Team performance\nmonitoring and feedback\n• Lecture/\nDiscussion\n• Role Play\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n3. Apply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n3.1 Examine\nspecific\nworkplace\nstrategies\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 116 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 112\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n\n3.2 Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 117 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 113\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n\n3.3 Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace challenges\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 118 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 114\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Implement\naction\nplans and\ncommunicate\nresults\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace challenges\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n4. Work in a\ndiverse\nenvironment\n\n4.1 Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n• Show understanding of cultural diversity in\nthe workplace\n• Recognize norms of behavior for interacting\nand dialogue with specific groups (e. g.,\nMuslims and other non-Christians, non-\nCatholics, tribes/ethnic groups, foreigners)\n• Demonstrate different methods of verbal and\nnon-verbal communication in a multicultural\nsetting\n• Apply cross-cultural communication skills\n(i.e. different business customs, beliefs,\ncommunication strategies)\n• Show affective skills – establishing rapport\nand empathy, understanding, etc.\n• Demonstrate openness and flexibility in\ncommunication\n• Recognize diverse groups in the workplace\nand community as defined by divergent\nculture, religion, traditions and practices\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n\n--- PDF PAGE 119 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 115\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.2 Work effectively\nin an\nenvironment\nthat\nacknowledges\nand values\ncultural diversity\n• Explain the value of diversity in the economy\nand society in terms of Workforce\ndevelopment\n• Discuss the importance of inclusiveness in a\ndiverse environment\n• Discuss the importance of shared vision and\nunderstanding of and commitment to team,\ndepartmental, and organizational goals and\nobjectives\n• Identify and exhibit strategies for customer\nservice excellence\n• Demonstrate cross-cultural communication\nskills and active listening\n• Recognize diverse groups in the workplace\nand community as defined by divergent\nculture, religion, traditions and practices\n• Demonstrate collaboration skills\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n\n4.3 Identify\ncommon issues\nin a\nmulticultural\nand diverse\nenvironment\n• Explain the value, and leverage of cultural\ndiversity\n• Discuss the inclusivity and conflict resolution\n• Describe the workplace harassment\n• Explain the change management and cite\nways to overcome resistance to change\n• Demonstrate advanced strategies for\ncustomer service excellence\n• Address diversity-related conflicts in the\nworkplace\n• Eliminate discriminatory behavior towards\ncustomers and co-workers\n• Utilize change management policies in the\nworkplace\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n\n--- PDF PAGE 120 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 116\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\nthe organization\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\ninnovative\npractices\n\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Set up action plans on how to apply\ninnovative procedures in the organization\n• Set up action plans on how to apply\ninnovative procedures in the organization\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\n1 Hour\n\n--- PDF PAGE 121 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 117\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\nstrengths and\nvirtues applied\n\n5.3 Evaluate the\neffectiveness\nof the\nproposed\naction plans\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on continuous\nimprovement\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n6. Use information\nsystematically\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\n- Application in collating information\n- Procedures for inputting, maintaining and\narchiving information\n- Guidance to people who need to find and\nuse information\n• Organizing information into a suitable form\nfor reference and use\n• Classify stored information for identification\nand retrieval\n• Operate the technical information system by\nusing agreed procedures\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 Hours\n\n--- PDF PAGE 122 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 118\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.2 Apply\ninformation\ntechnology (IT)\n• Lecture and discussion on:\n- Attributes and limitations of available\nsoftware tool\n- Procedures and work instructions for the\nuse of IT\n- Operational requirements for IT systems\n- Sources and flow paths of data\n- Security systems and measures that can\nbe used\n- Methods of entering and processing\ninformation\n• Use procedures and work instructions for the\nuse of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Edit, format\nand check\ninformation\n• Lecture and discussion on:\n- Basic file-handling techniques\n- Techniques in checking documents\n- Techniques in editing and formatting\n- Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying different\ntechniques\n• Proof read information applying different\ntechniques\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth\npractices\n\n• Discuss the OSH standards, principles and\nlegislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 Hours\n\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n•\nLecture\n•\nWritten Exam\n•\nDemonstration\n1 Hour\n\n--- PDF PAGE 123 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 119\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nGroup\nDiscussion\n\n•\nObservation\n•\nInterviews /\n•\nQuestioning\n\n7.3 Evaluate\neffectiveness\nof\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data (Historical or\nSimulated)\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 Hours\n8. Evaluate\nEnvironmental\nWork Practices\n8.1 Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n• Discussion Environmental Issues regarding\n- Water Quality\n- National and Local Government Issues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation practices\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.2 Establish\ntargets to\nevaluate\nenvironmental\npractices\n• Discussion on\n-\nlower production costs and energy\nconsumption\n-\nEnvironmentally Sound Processes\n-\nResource Efficient\n-\nRecycling and Waste Management\n• Simple case study regarding energy\nefficiency\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n\n8.3 Evaluate\neffectiveness of\nenvironmental\npractices\n• Identifying effective environmental\npractices relevant to the\nindustry/occupation\n-\nImplementation of energy efficiency\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 124 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 120\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Case Study\n\n• Interviews /\nQuestioning\n• Third Party\nReports\n9. Facilitate\nEntrepreneurial\nSkills For Micro-\nSmall-Medium\nEnterprises\n(MSMEs)\n9.1 Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n• Discussions on business models and\nstrategies\n• Discussion on Types and categories of\nbusinesses and business internal control\n• Discussion on Relevant National and local\nlegislations affecting businesses\n• Prepare promotional materials\n• Practice basic bookkeeping\n\n• Lecture/\nDiscussion\n• Case Study\n• Demonstration\n• Written Test\n• Portfolio\n• Work Related\nProject\n2 Hours\n\n9.2 Establish and\nmaintain client-\nbase/market\n• Role play on customer and employee\nrelations\n• Discussion on Basic product promotion\nstrategies\n• Preparation of Basic Feasibility study\n• Case studies on Basic Business ethics\n• Prepare basic advertising materials\n• Role Play\n• Lecture\nDiscussion\n• Case study\n• Case problem\n• Written Test\n2 Hours\n\n9.3 Apply budgeting\nand financial\nmanagement\nskills\n• Discussion on:\n- Basic cost-benefit analysis\n- Basic financial management\n- Basic financial accounting\n- Business internal controls\n\n• Role Play\n• Lecture\nDiscussion\n• Group work\n• Written Test\n• Case problem\n1 Hour\n\n--- PDF PAGE 125 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 121\nCOMMON COMPETENCIES\n(96 Hours)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Receive and resolve customer\ncomplaints\n1.1 Identify and\nanalyse the\ncomplaint\n•\nExplain how to received verbal\ncomplaint using active listening\nand empathy techniques\n•\nIdentify through appropriate\ncommunication techniques the\nexact nature of the customer\ncomplaint\n•\nIdentify steps in maintain register or\ncomplaint file/s in accordance with\nthe requirements of the enterprise\ninformation system\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nhours\n1.2 Respond to\ncomplaints\n•\nExplain how to process complaints\nin accordance with organizational\nstandards, policies and procedures\n•\nExplain how to obtain and review\ndocumentation in relation to\ncomplaints\n•\nIdentify steps in updating register of\ncomplaints/disputes\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nhours\n\n1.3 Determine and\nagree upon\nappropriate\naction to resolve\ncomplaint\n•\nIdentify procedures and guidelines\non how to resolve the complaint\n•\nDemonstrate a commitment to the\ncustomer to resolve the complaint\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nhours\n\n1.4 Refer complaints\n•\nIdentify complaints that require\nreferral to other personnel or\nexternal bodies\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n--- PDF PAGE 126 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 122\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nExplain how to forward all\nnecessary documentation including\ninvestigation\n•\nreports to appropriate personnel\n• Simulation\n• Oral\nQuestioning\n2. Work cooperatively In a general\nadministration environment\n2.1 Develop\neffective team\nrelationships\n•\nExplain how to develop and\nmaintain relationships with team\nmembers and promote benefits of\ncooperative work consistent with\norganizational goals and objectives\n•\nIdentify communication techniques\nto relay information in a clear and\nconcise manner\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n2.2 Participate in\nteam\nassignments\n• Identify individual responsibilities\nwithin the workgroup in accordance\nwith organisational requirements\n• How to recognize and\naccommodate cultural differences\nwithin the team\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n2.3 Contribute to\nteam\ndevelopment\n\n• Identify the internal and external\ncustomer needs and expectations\n• Explain how to seek formal\nfeedback and informal feedback on\nindividual and team performance\nregularly from colleagues and\nsupervisors\n• Identify the non-discriminatory\nattitudes and language when\ninteracting with customers, staff and\nmanagement\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n--- PDF PAGE 127 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 123\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Maintain quality customer/guest\nservice\n\n3.1 Identify\ncustomer/ guest\nrequirements\n• Identify options to improve service\n• Explain how to assess needs of\ncustomers/or guests\n• Identify and conduct data analysis\non deficiencies in service delivery\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n3.2 Ensure delivery\nof quality\nproducts/services\n•\nExplain how to ensure\nproducts/services meet customers’\nneeds and reflect enterprise\nstandards and improve on service\nlevels\n•\nExplain how to ensure team\nperformance consistently meets\nenterprise standards\n•\nExplain to colleagues how to meet\nand exceed customer service\nstandards by providing appropriate\nprofessional development\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n3.2 Evaluate\ncustomer service\n\n•\nExplain how to review\ncustomer/guest satisfaction with\nservice delivery using appropriate\nmethods that produce verifiable\ndata\n•\nIdentify steps on how to evaluate\ncustomer service evaluation\noutcomes\n•\nObtain agreements on appropriate\naction to overcome problems\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n--- PDF PAGE 128 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 124\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n4. Roster Staff\n\n4.1 Develop and\nimplement staff\nrosters\n• Explain how to developed rosters in\naccordance with company\nagreements and wage budgets\n• Identify the role of rosters and their\nimportance in controlling staff costs\n• Explain how to present roster in\nrequired formats to ensure clarity of\ninformation in accordance with\ncompany standards\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n6\nhours\n\n4.2 Maintain staff\nrecords\n•\nExplain how to complete time\nsheets and other documentation\nwithin designated timelines\n•\nExplain procedures in updating,\nmaintaining and storing staff\nrecords\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n5. Control And Order Stock\n5.1 Maintain stock\n levels and\nrecords\n• Explain how to monitor and\nmaintain stock levels and\nperformance\n• Identify the steps in monitoring\nstock security and adjusting\nsystems\n• Explain how to maintain records of\nstock storage and movement\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n6\nhours\n\n5.2 Process stock\norders\n• Explain how to process orders for\nstock in accordance with company\nprocedures\n• Identify steps in maintaining and\nrecording stock levels\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n5.3 Minimize stock\nlosses\n• Identify reasons for stock loss and\ndamage\n• Explain how to identify stock losses\n• Discussion\n• Demonstration\n• Lecture\n• Observation\n• Demonstration\n• Written\nexamination\n4\nhours\n\n--- PDF PAGE 129 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 125\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Identify the recommended related\nprocedures and solutions to loss\nsituations to prevent future\navoidable losses\n• Group\ndiscussion\n• Simulation\n\n• Interview\n\n5.4 Follow-up orders\n• Explain how to monitor delivery\nprocess and ensure continuity of\nsupply\n• Identify routine supply problems\n• Explain how to distribute stock to\nagreed locations.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n5.5 Organize and\nadminister stocks\n• Explain how to organize stocks\n• Identify the stocktaking\nresponsibilities\n• Demonstrate how to produce\naccurate stock reports\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n6. Prepare And Deliver Training\nSessions\n6.1 Determine\ntraining\nrequirements\n\n• Identify required competencies for\nlearners\n• Describe the training gap for\nlearners\n• Explain the identified training gaps\nand recommendation for training\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n6.2 Prepare training\nplan\n\n• Explain how to develop session\noutlines, training content, training\nresources and materials and\nindividual training session\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nhours\n\n6.3 Deliver training\nsessions\n\n•\nExplain the training and\nassessment activities involved in\nthe training session\n•\nIdentify steps in preparing training\nvenue for the training session\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n--- PDF PAGE 130 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 126\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Identify safety of learners during\ntraining delivery and practice\n\n7. Plan, conduct and evaluate staff\nperformance assessment\n\n7.1 Plan a staff\nperformance\nassessment\n•\nIdentify context for staff\nperformance assessment\n•\nDetermine the initial focus of the\nstaff performance assessment for\neach staff member\n•\nPrepare Documents to record\nidentified staff performance\nassessment statistics and\nperformance data\n•\nDesign action plan to guide the\nconduct of staff performance\nassessment\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n7. 2 Conduct a staff\nperformance\nassessment\n•\nIdentify steps in gathering\nworkplace-based evidence of staff\nperformance\n•\nExplain how to interpret employee\nperformance data\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n7.3 Evaluate a staff\nperformance\nassessment\n•\nPrepare staff performance\nassessment interview\n•\nIdentify steps in reviewing\nindividual staff performance\n•\nExplain how to prepare staff\nperformance assessment targets\nfor next period\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nhours\n\n--- PDF PAGE 131 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 127\n CORE COMPETENCIES\n(220 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Monitor\nroutine\nworkplace\noperations\n1.1 Monitor and\nimprove\nworkplace\noperations\n•\nMonitor efficiency and service levels on an ongoing\nbasis through close contact with day to day operations\n•\nIdentify quality problems and issues and make\nappropriate adjustments accordingly with relevant\napprovals\n•\nAdjust procedures and systems in consultation with\ncolleagues\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n6 hours\n\n1.2 Plan and\norganize\nworkflow\n\n•\nSchedule work in a manner that enhances efficiency\nand customer service quality\n•\nDelegate work to appropriate people in accordance\nwith principles of delegation\n•\nAssess progress against agreed objectives and\ntimelines\n•\nAssist colleagues in prioritization of workload through\nsupportive feedback and coaching\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n12 hours\n\n1.3 Maintain\nworkplace\nrecords\n\n•\nComplete workplace records accurately and submit\nwithin required timeframes\n•\nDelegate and monitor completion of records prior to\nsubmission\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n6 hours\n\n1.4 Solve\nproblems\nand make\ndecisions\n\n•\nIdentify workplace problems promptly and analyze\nfrom an operational and customer service perspective\n•\nInitiate corrective action to resolve the immediate\nproblem where appropriate\n•\nMonitor the effectiveness of solutions in the workplace\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n12 hours\n\n--- PDF PAGE 132 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 128\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Coach and\nmentor\nothers in\nJob skills\n2.1 Prepare for\non job\ncoaching\n•\nIdentify the need for coaching based on a range of\nfactors\n•\nIdentify skill deficiencies that could be addressed by\ncoaching needs through discussion with the colleague\nto be coached\n•\nOrganize with colleague a suitable time and place to\nconduct coaching in accordance with enterprise\npolicy, where appropriate\n•\n\n•\nLecture-\nDiscussion\n•\nReporting\n•\nSimulation\npractices\n•\nCase Analysis\n\n•\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n•\n\n36 hours\n\n2.2 Coach\ncolleagues\non the job\n\n•\nExplain to the colleague the overall purpose of\ncoaching\n•\nExplain and demonstrate the specific skills to be\ncoached\n•\nCommunicate clearly any underpinning knowledge\nrequired\n•\nCheck the colleague's understanding\n•\nProvide the colleague the opportunity to practice the\nskill and ask questions\n•\nProvide feedback in a constructive and supportive\nmanner\n•\nLecture-\nDiscussion\n•\nReporting\n•\nSimulation\npractice\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n\n40 hours\n\n2.3 Follow up\ncoaching\n\n•\nMonitor progress with new skills in the workplace and\nprovide supportive assistance as required\n•\nIdentify performance problems or difficulties with the\ncoaching and rectify them or refer them to the\nappropriate person for follow-up\n\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n12 hours\n3. Maintain\nFinancial\nStandards\nand\nRecords\n3.1 Monitor\nfinancial\nprocedures\n\n•\nCheck transactions in accordance with enterprise\nprocedures\n•\nBalance transactions accurately\n•\nCheck balances prepared by others in accordance\nwith enterprise procedures\n•\nImplement and control financial systems in\naccordance with enterprise procedures\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n12 hours\n\n--- PDF PAGE 133 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 129\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nMonitor financial systems and provide input on\npossible improvements to appropriate personnel\n•\nIdentify and resolve discrepancies or errors according\nto level of responsibility and in consultation with\ndesignated persons\n\n3.2 Complete\nfinancial\nreports\n\n•\nComplete routine financial/statistical reports accurately\nwithin designated timelines\n•\nForward financial/statistical reports promptly to the\nappropriate person/department\n\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n12 hours\n4. Provide for\nthe Safety\nof VIP’s\n\n4.1 Prepare for\nvisits by\nVIPs\n\n•\nIdentify the nature of the visit by the VIP\n•\nLiaise with relevant\npeople regarding the\nvisit\n•\nIdentify factors\nimpacting on VIP\nsafety while at the\npremises\n•\nCreate safety plans\nfor the VIP visit\n•\nIdentify resources\nrequired to support\nsafety plans\n•\nAcquire necessary\nsurveillance and\ncommunication\nequipment\n•\nSelect staff to provide for VIP safety\n•\nProvide information\nto staff in relation to\nVIP safety and plans\n•\nEstablish media\n•\nLecture-\nDiscussion\n•\nReporting\n•\nSimulation\npractices\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n\n24 hours\n\n--- PDF PAGE 134 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 130\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\nliaison facilities and\nprocedures\n•\nConduct drills to trial safety plans\n\n4.2 Implement\nplans for\nVIP safety\n\n•\nApply pre-arrival preparations\n•\nConduct final pre-arrival checks\n•\nMeet and escort VIPs\n•\nMaintain the safety of VIPs during stay\n•\nFacilitate departure of VIPs\n•\nLecture-\nDiscussion\n•\nReporting\n•\nSimulation\npractices\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nSimulation\n•\nCase\nAnalysis\n24 hours\n\n4.3 Conduct\nevaluation\nof plans\nfollowing\ndeparture of\nVIP\n\n•\nDe-brief staff who were involved with project\n•\nAnalyze responses to breaches of safety that\noccurred\n•\nPrepare draft safety plans for future VIP visits on the\nbasis of feedback received and analysis undertaken\n•\nLecture-\nDiscussion\n•\nReporting\n•\nCase Analysis\n\n•\nWritten\nExamination\n•\nOral\nQuestioning\n•\nCase\nAnalysis\n\n24 hours\n\n--- PDF PAGE 135 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 131\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n--- PDF PAGE 136 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 132\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community.\nSuch programs can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 137 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 133\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• Must have completed the 10-year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent holder\n• Must possess good communications skills\n• Must be computer literate\n• Can perform basic mathematical computation\n• Must be competent in Front Office Services NC II qualification gained through\ntraining or experience or certification\n\n--- PDF PAGE 138 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 134\n3.4\nLIST OF TOOLS AND EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a minimum of 25\n\ntrainees for Front Office Services NC III are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n4 sets\nMicrosoft Office i.e. Excel, Word, PPT, Etc.\n\nEQUIPMENT\nQTY\nDESCRIPTION\n4 units\nComputer with Property Management System and\nprinter\n\nMATERIALS\nQTY\nDESCRIPTION\n5 sets\nSample Manpower roster/schedule\n1 pc\nWhite board\n5 pcs\nEmpty envelopes\n5 pcs\nLuggage Tag\n1 pc\nEasel Stand\n50 pcs\nEasel sheets\n.1 box\nWhiteboard markers\n5 sets\nSample Inventory Stocks Monitoring Form\n5 sets\nSample Staff Assessment Forms\n5 sets\nSample Financial Reports (FO)\n5 sets\nSample Safety Plans\n\n--- PDF PAGE 139 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 135\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nLecture\n8 x 7 m.\n56 sq. m.\n56 sq. m.\nLearning Resource Center\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n21 sq. m.\nTotal workshop area:\n92 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR FRONT OFFICE SERVICES NC III\n\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Front Office\nServices NC III\n• Must have at least two years industry experience in any Front Office related works\nas supervisor\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 140 ---\nFRONT OFFICE SERVICES NC III Revision 00 Promulgated (12/17/2019) 136"
