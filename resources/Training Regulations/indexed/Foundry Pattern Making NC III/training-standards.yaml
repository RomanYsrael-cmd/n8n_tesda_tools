    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Foundry-Patternmaking\n NC Level: NC III\n\nNominal Training Duration:\n20 Hours\n(Basic Competencies)\n\n20 Hours\n(Common Competencies)\n72 Hours\n(Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in the\nfield of foundry-pattern making in accordance with industry standards. It covers core\ncompetencies such as; manufacture and develop corebox for shell core sand and develop\nand manufacture gear, conveyor screw and propeller patterns. It also include competency to\ndevelop gravity die casting mold used to produce component parts for automotive, track, and\nallied industries.\n\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\n\nIt also includes common competencies such as: Read, Interpret and Apply Engineering\nDrawings; Perform Mensuration and Calculation Read; Interpret and Apply Specifications and\nManuals and; Perform Shop Maintenance.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and\ncommunicate issues\narising in the workplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n49\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in\nnegotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance test\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain/enhance\nrelevant technology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2 Interpret drawings\n1.3 Apply information in the\ndrawings &\nspecifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1 Select measuring\ninstrument and carry out\nmeasurement and\ncalculations.\n• Lecture/\nDemonstration\n• Simulation\n•Exercises\n• Written test\n• Oral questioning\n• Direct\nobservation\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n50\n2.3 Maintain measuring\ninstruments\n\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed\nmanuals and interpret\ndata and specification\n3.2 Apply information\naccessed in manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance Learning\n\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1 Manufacture\nand develop\ncorebox for\nshell core sand\n1.1 Determine job\nrequirements\n1.2 Lay out core box’\n1.3 Manufacture core box\nand components\n1.4 Core machine\ncomponent\n1.5 Develop core box\n1.6Record data\n• Lecture\n• Dual Training\n• Discussion\n\n• Observation\nwith\nquestioning\n• Portfolio\n• Third party\nreport\n2. Develop and\nManufacture\nGear,\nConveyor,\nScrew and\nPropeller\nPattern\n2.1 Determine job\nrequirements\n2.2 Lay out pattern gear,\nconveyor screw and\npropeller pattern\n2.3 Manufacture gear,\nconveyor screw and\npropeller pattern\n• Lecture/\nDemonstration\n• Dual Training\n• Distance learning\n\n• Written\nexamination\n• Direct\nObservation\n• Project method\n• Interview\n3. Develop Gravity\nDie Casting\nMold\n3.1 Identify job requirement\n3.2 Prepare mold\nconstruction plan\n3.3 Fabricate mold\n3.4 Conduct trial casting\n3.5 Inspect mold\n• Lecture\n• Dualized training\n• Discussion\n\n• Observation\nand\nquestioning\n• Portfolio\n• Third party\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n51"
