    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Foundry Pattern Making NC III.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Foundry-Patternmaking\n NC Level: NC III\n\nNominal Training Duration:\n20 Hours\n(Basic Competencies)\n\n20 Hours\n(Common Competencies)\n72 Hours\n(Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in the\nfield of foundry-pattern making in accordance with industry standards. It covers core\ncompetencies such as; manufacture and develop corebox for shell core sand and develop\nand manufacture gear, conveyor screw and propeller patterns. It also include competency to\ndevelop gravity die casting mold used to produce component parts for automotive, track, and\nallied industries.\n\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\n\nIt also includes common competencies such as: Read, Interpret and Apply Engineering\nDrawings; Perform Mensuration and Calculation Read; Interpret and Apply Specifications and\nManuals and; Perform Shop Maintenance.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and\ncommunicate issues\narising in the workplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n49\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in\nnegotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance test\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain/enhance\nrelevant technology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2 Interpret drawings\n1.3 Apply information in the\ndrawings &\nspecifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1 Select measuring\ninstrument and carry out\nmeasurement and\ncalculations.\n• Lecture/\nDemonstration\n• Simulation\n•Exercises\n• Written test\n• Oral questioning\n• Direct\nobservation\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n50\n2.3 Maintain measuring\ninstruments\n\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed\nmanuals and interpret\ndata and specification\n3.2 Apply information\naccessed in manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance Learning\n\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1 Manufacture\nand develop\ncorebox for\nshell core sand\n1.1 Determine job\nrequirements\n1.2 Lay out core box’\n1.3 Manufacture core box\nand components\n1.4 Core machine\ncomponent\n1.5 Develop core box\n1.6Record data\n• Lecture\n• Dual Training\n• Discussion\n\n• Observation\nwith\nquestioning\n• Portfolio\n• Third party\nreport\n2. Develop and\nManufacture\nGear,\nConveyor,\nScrew and\nPropeller\nPattern\n2.1 Determine job\nrequirements\n2.2 Lay out pattern gear,\nconveyor screw and\npropeller pattern\n2.3 Manufacture gear,\nconveyor screw and\npropeller pattern\n• Lecture/\nDemonstration\n• Dual Training\n• Distance learning\n\n• Written\nexamination\n• Direct\nObservation\n• Project method\n• Interview\n3. Develop Gravity\nDie Casting\nMold\n3.1 Identify job requirement\n3.2 Prepare mold\nconstruction plan\n3.3 Fabricate mold\n3.4 Conduct trial casting\n3.5 Inspect mold\n• Lecture\n• Dualized training\n• Discussion\n\n• Observation\nand\nquestioning\n• Portfolio\n• Third party\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n51\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the\ncurriculum modules;\n Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n52\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• With experience in basic machining\n• Ability to communicate both orally and in written; and\n• Physically and mentally fit\n• Must possess the Foundry-Patternmaking National Certificate (NC) II\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n FOUNDRY PATTERNMAKING NC III\n\nRecommended list of tools, equipment and materials for the training of 12 trainees for\nFoundry Patternmaking NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\nBox wrench\n1 unit\nWood lathe\n12 pcs\nPlywood (1/2 thk)\n2 sets\nOpen end\nwrench\n1 unit\nBand saw\n12 pcs\nPlywood (1/4 thk)\n2 sets\nSocket wrench\n1 unit\nCircular saw\n24 pcs\nLumber 1”x4”x12”\n2 pcs\nAdjustable\nwrench\n1 unit\nPlaner\n24 pcs\nLumber 2”x4”x12”\n2 sets\nScrewdriver (+)\n1 unit\nDisc grinder\n24 pcs\nLumber 2”x6”x12”\n2 sets\nScrewdriver (-)\n1 unit\nWood router\n24 pcs\nLumber 2”x2”x12”\n2 pcs\nPlier (side\ncutting)\n1 unit\nPortalble drill\n(12mm)\n12 pcs\nLaminate 4”x8”x1/8”\n2 pcs\nPlier (long\nnose)\n1 unit\nBench drill\n12 pcs\nCard board 4”x8”x1/8”\n2 pcs\nMechanical\nplier\n1 unit\nPedestal tool\ngrinder\n12 pcs\nMarker pen (red)\n2 pcs\nBallpein\nhammer\n2 set\nWork bench\n12 pcs\nMarker pen (black)\n4 pcs\nWood mallet\n4 sets\nClamp\n3 cans\nLay-out blue\n4 pcs\nClaw hammer\n4 sets\nWood clamp\n6 ft\nSteelwire 6mm dia\n1 set\nFeeler gauge\n4 set\nC-clamp\n300mm\n24 pcs\nBall pen\n2 pcs\nHammer\n(plastic faced)\n2 units\nStorage\ncabinet\n4\ngallons\nRugby adhesive\n1 set\nNumber punch\n2 units\nOpen shelf\ncabinet\n4\ngallons\nWood putty (2-system)\n1 set\nAlphabet punch\n1 pc\nAnvil\n4\ngallons\nWood filler (fula tite)\n1 set\nStraight drill\n\n24\nsheets\nSand paper #120\n8 sets\nTap / die (M-8\n24\nSand paper #160\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n53\nup to M-20)\nsheets\n2 sets\nTap / die\nhandle\n\n24\nsheets\nSand paper #60\n2 pcs\nHack saw\n4meters\nDisc sander (wood)\n2 pcs\nStraight edge\n(1000 mm long)\n\nEngineering drawing\n2 pcs\nTri-square\n(300mm long)\n\nMachine numeral\n1 pc\nAdjustable\nprotractor\n\nCatalogues\n2 pcs\nSteel rule (3\nmeters)\n\nBrochure\n2 pcs\nCross cut saw\nPaint brush\n2 pcs\nRasp file\n(heefround)\n\n1 liter\nPaint (Blue, Orange, Red,\nBlack)\n2 pcs\nRasp file\n(rectangle)\n\n2 pcs\nRasp file\n(round)\n\n2 pcs\nFile (coarse)\nheefround\n\n2 pcs\nFile (fine)\nheefround\n\n2 pcs\nFile (coarse)\nrectangle\n\n2 pcs\nFile (fine)\nrectangle\n\n2 pcs\nFile (coarse)\nround\n\n2 pcs\nFile (fine) round\n2 pcs\nFile (coarse)\nsquare\n\n2 pcs\nFile (fine)\nsquare\n\n2 pcs\nFile (coarse)\nTriangle\n\n2 pcs\nFile (fine)\nTriangle\n\n2 sets\nVernier caliper\n(300)