 specified by industry and/or internal standards. During the tap, final chemistry adjustments are made. 20. Molding Is the process of making the mold cavity with a necessary allowances such as shrinkage, machining, taper, and surface finish. Usually it is done with green sand as the molding medium. 21. Mold Cavity The mold cavity is the shaped hole into which the molten metal is poured and solidified to produce the desired casting. 22. Parting Line Parting Line or Parting Surface is the interface that separates the cope and drag halves of a mold, flask, or pattern. The same part can also be found in some core making processes. 23. Pattern The pattern is the approximate copy of the final casting. The molding material (sand for sand molds) is then packed around the pattern and the pattern is removed to produce the mold cavity. TR FOUNDRY PATTERNMAKING NC III Promulgated 24. Pattern Shrinkage"
