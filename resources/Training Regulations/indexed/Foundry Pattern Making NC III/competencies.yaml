  "source_section_text": "Section 1. Successful candidates shall\nbe awarded a National Certificate signed by the TESDA Director General.\n\n4.2 The qualification of Foundry Patternmaking NC III may be attained through demonstration\nof competence through a single comprehensive project-type assessment covering all\nrequired units of competency of the qualification.\n\n4.4.1\nFabricate/Develop Corebox for Shell Cores, Gear or Conveyor Screw or\nPropeller Patterns and Gravity Die Casting Mold\n• Manufacture and Develop Corebox for Shell Core Sand\n• Develop and Manufacture Gear, Conveyor Screw and Propeller Patterns\n• Develop Gravity Die Casting Mold\n\n4.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Holder of Foundry Patternmaking NC II or equivalent qualification; or\n\n4.4.2 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.3 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS)\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n56\n\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB-SECTOR\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\n-\nLegend:\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nRead & Interpret\nEngineering Drawings\nPerform Mensuration\nand Calculation\nRead, Interpret and\nApply Specifications\nand Manuals\nPerform Shop\nMaintenance\nDevelop and\nmanufacture wood\npattern\nDevelop and\nmanufacture polymer\npattern\nDevelop and\nmanufacture assembled\nplated pattern\nDevelop and\nmanufacture production\npattern\nPerform general\nwoodworking machine\noperations\nUse and maintain\nmeasuring instrument\nPrepare & mix sand for\nmetal molding\nProduce molds by hand\nProduce cores by hand\nOperate molding\nmachine\nOperate core-making\nmachine\nPour molten metal to\nmolds\nUse and maintain\nmeasuring instrument\nOperate melting\nfurnaces (non-electric)\nOperate cupola melting\nfurnace\nOperate electric\ninduction melting\nfurnace\nFettle & trim metal\ncastings/forgings\nPerform refractory\ninstallation & repair\nUse & maintain\nmeasuring instrument\nANNEX A\n\nManufacture and\ndevelop corebox for\nShell Core Box\nDevelop and Manufacture\nGear, Conveyor Screw and\nPropeller Pattens\nFoundry Patternmaking NC III\nDevelop Gravity Die\nCasting Mold\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n57\nDEFINITION OF TERMS (FOUNDRY)\n\n1. Alloy\nAn alloy is a homogeneous blend of two or more elements\nat least one of which is a metal, and where the resulting\nmaterial as metallic properties.\n2. Carbon Dioxide\nProcess\n\nCarbon Dioxide Process consist of mixing a clean dry\nsilica sand with a silicate binder, compacting the mixture to\nshape and hardening it by passing carbon dioxide gas.\n3. Casting\nCasting is the term used to describe both the process and\nthe product when molten metal is poured and solidified in a\nmold.\n4. Chemical Analysis\n\nAnalytical chemistry is the science that seeks ever\nimproved means of measuring the chemical composition of\nnatural and artificial materials.\n5. Cope\nIn a two-part mold, the cope is the name given to the top\nhalf of the pattern, flask, mold, or core.\n\n6. Core\nThe core is a sand shape that is inserted into the mold to\nproduce the internal features of a casting, such as, holes or\npassages for water-cooling.\n7. Core Box\nA core box is the mold or die used to produce casting\ncores.\n8. Core Print\nThe core print is the region added to the pattern, core, or\nmold that is used to locate and support the core within the\nmold.\n9. Draft\nDraft is the taper on a pattern or casting that permits it to be\nwithdrawn from the mold.\n10. Drag\n\nThe drag is the bottom part of the two-part mold.\n\n11. Dross\nDross is a mass of solid impurities floating on a molten\nmetal bath. It appears usually on the melting of low melting\npoint metals or alloys such as aluminum, copper,\nmagnesium or each alloys.\n12. Fettle / Finishing\nThe process of cleaning the casting, removal of excess\nmetal, grinding and inspection operation which may be\nrequired for some casting process.\n\n--- PDF PAGE 61 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n58\n13. Flask\nThe flask is the box that contains the molding aggregate.\n14. Foundry\nA Foundry is a factory which produces metal castings from\neither ferrous or non-ferrous alloys.\n15. Furnace\nFurnaces are refractory lined vessels that contain the\nmaterial to be melted and provide the energy to melt it.\n16. Gate\n\nGate is controlled entrances to the mold cavity.\n17. Gating System\nGating system is the network of channels used to deliver\nthe molten metal to the mold cavity.\n18. Green Sand\nThe term Green Sand refers to that molded sand mixture\nwhich is allowed to remain moist and is used in casting\nferrous and non-ferrous metals.\n\n19. Melting\nThe process includes melting the charge, refining the melt,\nadjusting the melt chemistry and tapping into a transport\nvessel. Refining is done to remove deleterious gasses and\nelements from the molten metal. Material is added during\nthe melting process to bring the final chemistry within a\nspecific range specified by industry and/or internal\nstandards. During the tap, final chemistry adjustments are\nmade.\n20. Molding\nIs the process of making the mold cavity with a necessary\nallowances such as shrinkage, machining, taper, and\nsurface finish. Usually it is done with green sand as the\nmolding medium.\n21. Mold Cavity\n\nThe mold cavity is the shaped hole into which the molten\nmetal is poured and solidified to produce the desired\ncasting.\n22. Parting Line\nParting Line or Parting Surface is the interface that\nseparates the cope and drag halves of a mold, flask, or\npattern. The same part can also be found in some core\nmaking processes.\n\n23. Pattern\nThe pattern is the approximate copy of the final casting.\nThe molding material (sand for sand molds) is then packed\naround the pattern and the pattern is removed to produce\nthe mold cavity.\n\n--- PDF PAGE 62 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n59\n\n24. Pattern Shrinkage\nAllowance\nDimensions added to the pattern to compensate for the solid\nshrinkage or contraction occurs in the solidified casting as it\ncools to room / ambient temperature.\n\n25. Pouring Cup\nA Pouring Cup or Pouring Basin is the portion of the gating\nsystem that initially receives the molten metal from the\npouring vessel and controls its delivery to rest of the mold.\n26. Refractories\nRefers to materials that are used to make crucibles, linings\nfor furnaces, kilns, ovens and incinerators. A practical\nrequirement is the ability of the material to withstand\ntemperatures above 1100oC without softening.\n27. Riser\n\nA riser is an extra void created in the mold that will also fill\nwith molten metal. It provides a reservoir of molten metal\nthat flow into the mold cavity to compensate for any\nshrinkage during solidification.\n28. Runners\nRunners are the horizontal part of the gating system that is\nconnected to the gate.\n29. Slag\nAre by-product of melting metals. They are composed of\nmetal oxides and sulfides. The assist in melt temperature\ncontrol and minimize oxidation of the liquid metal before\ncasting.\n30. Sprue\nFrom the pouring cup, the molten metal travels down the\nsprue the vertical part of the gating system that connects\nwith the runners.\n31. Vents\nVents are additional channels providing an escape for the\ngasses that are generated within the mold.\n\n32. Wedge Chill Test\nIndicates the chilling tendencies of cast iron melt which is\nrelated to melting conditions, chemical composition and\ncasting section thickness.\n\n--- PDF PAGE 63 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n60\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nFOUNDRY PATTERNMAKING\nAntonio A. Gimenez\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nCesar R. Leal\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nElmo N. Serbito\nPAFI (Samahan ng mga\nManggagawang Supercast)\n\nCarina J. Bondad\n(Administrative Staff)\nThe PARTICIPANTS in the National Validation of this Training Regulation\n• (Supercast Foundry &\nMachinery Corp.\nSFMC)\n\n• Philippine Aluminum Wheels\nInc. (PAWI)\n\n• Toyota Auto Parts Phils. Inc.\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
