        "source_text": "--- PDF PAGE 21 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n19\nUNIT OF COMPETENCY:   USE RELEVANT TECHNOLOGIES \n \nUNIT CODE                     :   500311114 \n \nUNIT DESCRIPTOR        :  This unit of competency covers the knowledge, skills, and attitude \nrequired in selecting, sourcing and applying appropriate and \naffordable technologies in the workplace.                          \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Study/select appropriate \ntechnology \n \n1.1 Usage of different technologies is determined based \non job requirements \n1.2 Appropriate technology is selected as per work  \n       specification \n2.  Apply relevant technology \n \n2.1 Relevant technology is effectively used in carrying out \nfunction \n2.2 Applicable software and hardware are used as per task \nrequirement \n2.3 Management concepts are observed and practiced \nas per established industry practices \n3.  Maintain/enhance of  \nrelevant technology \n3.1 Maintenance of technology is applied in accordance \nwith the industry standard operating procedure, \nmanufacturer’s operating guidelines and \noccupational health and safety procedure to ensure \nits operative ability \n3.2 Updating of technology is maintained through \ncontinuing education or training in accordance with job \nrequirement  \n3.3 Technology failure/ defect is immediately reported to \nthe concern/responsible person or section for \nappropriate action\n\n--- PDF PAGE 22 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n20\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technology \nMay include but are not limited to: \n1.1 Office technology \n1.2 Industrial technology \n1.3 System technology \n1.4 Information technology \n1.5 Training technology \n2. Management concepts \nMay include but not limited to: \n2.1  Real Time Management \n2.2  KAIZEN or continuous improvement \n2.3  5s \n2.4  Total Quality Management \n2.5 Other management/productivity tools \n3. Industry standard \noperating procedure \n3.1 Written guidelines relative to the usage of office \ntechnology/equipment \n3.2 Verbal advise/instruction from the co-worker \n4. Manufacturer’s \noperating guidelines/ \ninstructions  \n4.1 Written instruction/manuals of specific technology/ \nequipment \n4.2 General instruction manual \n4.3 Verbal advise from manufacturer relative to the operation \nof equipment \n5. Occupational health and \nsafety procedure \n5.1 Relevant statutes on OHS \n5.2 Company guidelines in using  \n      technology/equipment \n6. Appropriate action \n6.1 Implementing preventive maintenance schedule  \n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 23 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n21\n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Studied and selected appropriate technology consistent with \nwork requirements   \n1.2  Applied relevant technology \n1.3  Maintained and enhanced operative ability of relevant \ntechnology \n2.  Underpinning \nknowledge and \nattitude \n2.1  Awareness on technology and its function \n2.2  Repair and maintenance procedure \n2.3  Operating instructions \n2.4  Applicable software \n2.5  Communication techniques \n2.6  Health and safety procedure \n2.7  Company policy in relation to relevant technology  \n2.8  Different management concepts \n2.9  Technology adaptability \n3.  Underpinning \nskills \n3.1  Relevant technology application/implementation \n3.2  Basic communication skills \n3.3  Software applications skills \n3.4  Basic troubleshooting skills  \n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 Relevant technology \n4.2 Interview and demonstration questionnaires \n4.3  Assessment packages \n5.  Method of \nassessment \nCompetency must be assessed through: \n5.1  Interview \n5.2  Actual demonstration \n5.3  Authenticated portfolio (related certificates of training/seminar) \n6.  Context of \nassessment \n6.1 Competency may be assessed in actual workplace or simulated \nenvironment\n",
