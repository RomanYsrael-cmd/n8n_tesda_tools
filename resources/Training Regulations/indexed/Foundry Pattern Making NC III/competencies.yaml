Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n33\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n34\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nMANUFACTURE AND DEVELOP COREBOX FOR SHELL\nCORE SAND\n\nUNIT CODE\n\n:\nALT742306\n\nUNIT DESCRIPTOR\n:\nThis unit covers manufacturing and developing metal\ncorebox for shell core sand. The corebox can be adapted to\nhorizontal or vertical stripping set-up.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirement\n\n1.1 Drawings, instructions, specifications are interpreted and\nunderstood.\n1.2 Appropriate shell machine model is selected according to core\ndrawing and corebox construction drawing\n1.3 Corebox and component material is selected according to\ncore drawing and corebox construction drawing.\n1.4 Corebox and component for casting are requested in\naccordance with standard operating procedure\n1.5 Corebox component part for fabrication and purchase is\nrequested in accordance with standard operating procedure.\n\n2. Lay-out corebox.\n\n2.1 Corebox is laid-out showing cavity features according to\ncorebox construction drawing\n2.2 Method of construction / machining is discussed with\nmachine shop or tool and die section.\n\n3. Manufacture\ncorebox and\ncomponent.\n\n3.1 Corebox and component is marked out and machining job\ninitiated to meet specification.\n3.2 Machining is checked periodically for compliance to\nrequirement.\n3.3 Corebox cavities are machined using acceptable machine\nshop / tool and die fabrication technique and procedures.\n3.4 Cavities are finished, utilizing appropriate hand or hand held\npower tools.\n3.5 Corebox and component are assembled according to\nspecification and acceptable corebox locating technique and\nprocedure.\n3.6 Components are revised to adapt corebox including electrical,\npneumatic and hydraulic controls.\n\n4. Develop corebox\n\n4.1 Corebox mounted to core machine bolster according to\nstandard operating procedure.\n4.2 Operational dry-run of coremachine / corebox is undertaken to\nensure compatibility.\n4.3 Trial coremaking by heating up the corebox, loading of sand,\nactivating water cooling system is undertaken and machine\nparameters are adjusting based on machine setup procedure\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n35\nand corebox requirements.\n4.4 Core is inspected / evaluated for conformance to core quality\nrequirements.\n4.5 Adjustment on machine / corebox component and parameters\ninitiated until the satisfactory core is produced according to\ncore quality requirement.\n\n5. Record data.\n\n5.1 Test data is recorded (start to end) to include machine\nparameters corebox adjustment, shell sand used and other\nrelevant information.\n5.2 Task is completed in accordance with Occupational Health &\nSafety (OH & S) requirements\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n36\n RANGE OF VARIABLE\nVARIABLE\nRANGE\n\n1. Machine\n1.1\nVertical strip setup.\n1.2\nHorizontal strip setup.\n\n2. Material\n2.1 Gray cast iron for core cavities, brackets, stripping plates,\nburner plates, blow-plates.\n2.2 Tool steel for stripping pins, guide pins and bushings, blow-\ntubes, dowels.\n\n3. Cavity features\n3.1 Taper\n3.2 Core print\n3.3 Center/outline of cavities\n3.4 Ejector holes\n3.5 Contraction factor\n3.6 Center of rotation and\n3.7 Desired width, length and thickness\n\n4. Method of\nconstruction\n4.1 Segmented\n4.2 Loose\n4.3 One-halve of fixed and movable die\n4.4 Doweled and bolted.\n\n5. Fabrication\ntechnique\n\n5.1 EDM\n5.2 Heat-treatment of parts\n5.3 End milling\n5.4 Face milling\n5.5 Drill/tap\n5.6 Die grinding\n5.7 Hand polishing\n5.8 Fitting\n5.9 Marking off\n5.10 Template checking.\n\n6. Machine\nparameter\n6.1 Air blow pressure\n6.2 Blow time\n6.3 Corebox temperature (fixed/movable)\n6.4 Cure time\n6.5 Roll over device vibration timer\n6.6 Clamping pressure\n6.7 Ejection mark.\n\n7. Core quality\nrequirements\n\n7.1 Color\n7.2 Thickness of shell\n7.3 Weight of core\n7.4 Friable parts\n7.5 Completeness\n7.6 Core ejection marks\n7.7Stickers.\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n37\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate\n1.1 Determined job requirements.\n1.2 Laid out corebox.\n1.3 Manufactured corebox and component.\n1.4 Developed corebox\n1.5Recorded data.\n\n2 Underpinning\nknowledge and\nattitudes\n2.1 Formulae / mathematical techniques required for manufacturing\nand development of production corebox\n2.2 Contraction, taper, clearances, machining allowances, etc\n2.3 Tolerance and construction values typically used in the\nmanufacture and development of production corebox\n2.4 Characteristics of metals and alloys and their application in the\nmanufacture / development of production corebox\n2.5 Production molding, coremaking and casting technique.\n2.6 Tooling required for castings\n2.7 Appropriate technique, tools and equipments to measure,\nmarked out and produce corebox\n2.8 Method of corebox construction including machining provision\nand clamping arrangement\n2.9 Shell core machine nomenclature and operational sequence.\n2.10 Corebox checking technique\n2.11 Assembly technique of corebox to shell machine\n2.12 Hazard and control measures associated with development /\nmanufacturing and production of corebox\n2.13 Use of personal protective equipments\n2.14 Safe work practice and procedures\n2.15 Observant/Attentive to details\n2.16 Patience\n2.17 Honesty\n2.18 Courtesy\n\n3 Underpinning\nskills\n\n3.1 Determining job requirements from written instruction, standard\noperating procedures, sketches, shop / product drawings, and\nother applicable reference document.\n3.2 Planning and sequencing operation.\n3.3 Deciding corebox construction method.\n3.4 Checking and clarifying task related information.\n3.5 Selecting appropriate materials to suite the corebox fabrication\nand coremaking process.\n3.6 Joining and fixing component part.\n3.7 Operate shell machine and setup parameters.\n3.8 Inspecting and analyzing core defects and initiate\ncountermeasure.\n3.9 Checking core boxes and component parts.\n3.10 Checking machine operational capability.\n3.11 Assemble corebox to core machine.\n3.12 Accomplish test report and entering familiar information into\npro-forma and standard workplace form.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n38\n3.13 Conduct necessary layout making, measurement to corebox /\ncomponent parts.\n3.14 Coordinating with other section.\n3.15 Communication with other section.\n\n4 Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area.\n4.2 Manuals / catalogues relative to this unit.\n4.3 Job order, requisitions\n4.4 Materials, tools, equipment and facilities relevant to the unit.\n\n5 Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\nenvironment.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n39\nUNIT OF COMPETENCY :\nDEVELOP AND MANUFACTURE GEAR, CONVEYOR\nSCREW AND PROPELLER PATTERNS\n\nUNIT CODE\n\n:\nALT742307\n\nUNIT DESCRIPTOR\n:\nThis unit covers laying-out and manufacture gear, conveyor\nscrew and propeller pattern. Gear patterns may be\nsegmented or any other method used to minimize timber\nshrinkage or warpage and to achieve the required strength.\nConveyor or propeller screw may be built up using\npredetermined thickness-timber either over a mandrel or a\nlayout. Patterns may be set-up or a joint board or plated for\nease of molding.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirements\n\n1.1 Drawings, instructions and specifications are interpreted and\nunderstood.\n1.2 Material is selected in accordance with the drawings,\ninstructions and/or specifications.\n1.3 Molding, cast techniques and foundry processes are identified\nin determining the type of pattern required.\n\n2. Lay out pattern gear,\nconveyor screw and\npropeller pattern\n\n2.1 Pattern parameters are calculated in accordance with the\ndrawings, instructions and/or specifications.\n2.2 Pattern is laid out showing pattern characteristics in\naccordance with the drawings, instructions and/or\nspecifications.\n2.3 Jigs and fixtures are developed and fabricated to aid the\nmanufacture of the pattern form as required.\n\n3. Manufacture gear,\nconveyor screw and\npropeller pattern\n\n3.1 Materials are marked out and construction is developed to\nmeet specifications.\n3.2 Pattern or pattern component parts are produced to size and\nshape and checked for compliance with specifications using\nacceptable wood pattern making techniques, procedures and\nutilizing appropriate hand and hand held power.\n3.3 Pattern component parts are joined or fixed as required,\naccording to specifications, using acceptable pattern making\ntechniques and procedures.\n3.4 Pattern is marked, color coded and / or tagged in compliance\nwith specifications or standard operating procedures.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n40\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Material\n\n1.1 Hardwood\n1.2 Softwood\n1.3 Epoxy resins\n1.4Composites.\n\n2. Pattern\nparameters\n\n2.1 Pitch circles\n2.2 Pressure angles\n2.3 Tooth form\n2.4 Left- and right-hand flight helix\n2.5 Pitch axial dimensions\n2.6 Angles, tapers, clearances\n2.7 Contraction allowances appropriate to developing various types\nof gear, conveyor and propeller forms.\n\n3. Calculated\n\nCalculated values to determine:\n3.1 Contraction rates\n3.2 Pitch\n3.3 Proportions\n3.4Profiles as well as general engineering calculations.\n\n4. Pattern\ncharacteristics\n\n4.1 Tapers\n4.2 Machining allowances\n4.3 Core prints and\n4.4Method of construction\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n41\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\n\nAssessment requires evidence that the candidate\n1.1 Determined job requirements\n1.2 Laid-out pattern gear, conveyor screw and propeller pattern\n1.3 Manufactured gear, conveyor screw and propeller pattern\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Timber, epoxy resin and composite product knowledge including\nfeatures, characteristics and applications.\n2.2 Molding and casting techniques for cast gears, conveyor screws\nand marine propellers.\n2.3 Tooling required for casting / molding.\n2.4 Methoding techniques.\n2.5 The use and application of jigs and fixtures.\n2.6 Methods of construction.\n2.7 Techniques, tools and equipment to measure, mark out and\nproduce gear, conveyor screw and propeller patterns.\n2.8 Mathematical calculations and formulae required to manufacture\npatterns / core boxes – contraction, taper, pitch, profiles,\nclearances, machining allowances.\n2.9 Identification coding and numbering.\n2.10 Pattern checking techniques.\n2.11 Moldability i.e. surface finish, face taper, convex or concave\nperspectives, undercuts etc.\n2.12 Use and application of personal protective equipments.\n2.13 Safe work practices and procedures.\n2.14 Hazards and control measures associated with developing\nand manufacturing gear, conveyor screw and propeller\npatterns\n2.15 Safe work practice and procedures\n2.16 Observant/Attentive to details\n2.17 Patience\n2.18 Honesty\n2.19\nCourtesy\n\n3. Underpinning\n skills\n\n3.1 Determining job requirements from written instructions, standard\noperating procedures, sketches, drawings and other applicable\nreference documents.\n3.2 Planning and sequencing operations.\n3.3 Checking and clarifying task related information.\n3.4 Selecting appropriate materials to suit the molding/casting\ntechniques and foundry process.\n3.5 Laying out the pattern / core boxes and mold.\n3.6 Operating woodworking equipment\n3.7 Constructing patterns / core boxes and mold.\n3.8 Joining and fixing component parts.\n3.9 Checking patterns and molds.\n3.10 Calculating contraction rates / pitch / proportions / profiles.\n3.11\nCalculating mold cooling H2O volume\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n42\n3.12 Calculating gating / risering system\n3.13 Preparation of mold coating\n3.14 Application of mold coating\n3.15 Pre-heating of mold\n3.16\nUndertaking relevant engineering calculations\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Manuals/catalogues relative to Patternmaking\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Incoming material receiving effort.\n4.5Quality handbook procedure for melting.\n\n5.Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6.Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n43\nUNIT OF COMPETENCY :\nDEVELOP GRAVITY DIE CASTING MOLD\n\nUNIT CODE\n\n:\nALT742308\n\nUNIT DESCRIPTOR\n:\nThis unit covers developing a gravity die casting mold\n(permanent / semi-permanent) used to produce\ncomponent parts for automotive, track, and allied industries.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify job\nrequirement\n\n1.1 Product drawings, instruction and specifications are\ninterpreted and fully understand.\n1.2 Appropriate mold materials are selected as per method of\nmolding and specifications.\n1.3 Mold fabrication technique, molding of components, casting\ntechnique and foundry process are identified to determine the\ntype of mold required.\n\n2. Prepare mold\nconstruction plan\n\n2.1 Planning of mold, fabrication of components, casting\ntechnique is applied as required.\n2.2 Molding process is selected as per mold plan and standard\noperating procedures.\n2.3 Casting parameters is laid-out as per standard operating\nprocedures.\n2.4 Pouring system, riser size, mold cooling system is\ncalculated as per standard operating procedures.\n\n3. Fabricate mold\n\n3.1 Mold materials are identified and secured/ procured\naccording to standard operating procedures.\n3.2 Mold and component parts are produced to size and shape\nand checked for compliance with specifications using\nacceptable machining techniques, procedures and utilizing\nappropriate hand and hand-help power tools.\n3.3 Mold component parts are joined or fixed as required\naccording to specification and acceptable mold making\ntechniques and procedures.\n3.4 Mold cooling system checked for compliance with\nspecification.\n3.5 Clay molding of casting is produced from the mold to check\nconfiguration and surface finish of the mold as per standard\noperating procedures.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n44\n\n4. Conduct trial\ncasting\n\n4.1 Samples for aesthetic inspection are produced and\ndimensional inspection is performed as per specification\nrequirement.\n4.2 Mold is prepared for application of appropriate mold coating\nas per standard operating procedures.\n4.3 Mold is mounted and secured to casting machine as per\nstandard operating procedures.\n4.4 Mold / machine is prepared for pouring of molten metal as per\nstandard operating procedures.\n4.5 Task completed using personal protective equipment in\naccordance with safe work practices and procedures.\n\n5. Inspect mold\n\n5.1 Mold is inspected for related defects as per standard\noperating procedures.\n5.2 Dimensions are checked and mold is rectified, if needed, as\nper standard operating procedures.\n5.3 Section thickness is measured and checked for compliance\nwith specification.\n5.4 Conformance report is submitted as per company/shop\nrequirement and standard operating procedures.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n45\n RANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Mold material\n\n1.1 Gray cast iron for the halves or quadrants.\n1.2 Tool steel for bottom mold.\n1.3 Gray cast iron for center mold.\n\n2. Type of mold\n\nTypes of mold includes, but not limited to\n2.1 Center pouring mold\n2.2 Side pouring mold\n2.3 Semi-permanent mold with sand core.\n2.4 With loose piece.\n\n3. Planning of mold\n\nThe following should be considered in planning\n3.1 Quantity of casting to be produced.\n3.2 Type of metal to be cast\n3.3 Casting cycle time.\n3.4 Complexity of the casting.\n3.5 Casting machine loading\n\n4. Mold cooling\nsystem\n\n4.1 Water cooling\n4.2 Air cooling\n\n5. Mold coating\n\n5.1 Preheating of mold (110° – 150°C)\n5.2 Coating application/ technique (spraying)\n5.3 Coating type\n5.3.1 Insulating type\n5.3.2 Lubricating type\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n46\nEVIDENCE GUIDE\n\n1. Critical aspect of\n Competency\n\nAssessment requires evidence that the candidate\n1.1 Identified job requirement.\n1.2 Prepared mold construction plan.\n1.3 Fabricated mold.\n1.4 Conducted trial casting.\n1.5 Inspection mold.\n\n2. Underpinning\nKnowledge and\nattitudes\n\n2.1 Casting process of non-ferrous alloys\n2.2 Metal, resin, and composite product knowledge including\ncharacteristics and application\n2.3 Molding and casting techniques for ferrous metal\n2.4 Machining and tool / die making process\n2.5 Principles of permanent mold coating and application\n2.6 Patterns and tooling required to fabricate metal mold\n2.7 Method and technique of permanent mold fabrication\n2.8 Use of jig / fixture\n2.9 Bench work for metal mold\n2.10 Mold checking technique\n2.11 Casting inspection technique\n2.12 Casting defect, cause and countermeasure\n2.13 Use and application of personal protective equipments\n2.14 Safe work practice and procedures\n2.15 Hazards and control measures associated with developing\nand manufacturing permanent mold\n2.19 Safe work practice and procedures\n2.20 Observant/Attentive to details\n2.21 Patience\n2.22 Honesty\n2.16 Courtesy\n\n3. Underpinning\n skills\n\n3.1 Determining job requirements from written instructions,\nstandard operating procedures, sketches, drawings and other\napplicable reference documents\n3.2 Planning and sequencing operations\n3.3 Checking and clarifying task related information\n3.4 Selecting appropriate materials to suit the molding/casting\ntechniques and foundry process\n3.5 Laying out the pattern / core boxes and mold\n3.6 Constructing patterns / core boxes and mold\n3.7 Joining and fixing component parts\n3.8 Checking patterns and molds\n3.9 Calculating contraction rates / pitch / proportions / profiles\n3.10 Calculating mold cooling water (H2O) volume\n3.11 Calculating gating / risering system\n3.12 Preparation of mold coating\n3.13 Application of mold coating\n3.14 Pre-heating of mold\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n47\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Manuals/catalogues relative to mold making\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Incoming material receiving effort.\n4.5 Quality handbook procedure for melting.\n\n5.Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6.Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n48"
