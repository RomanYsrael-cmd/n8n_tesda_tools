        "source_text": "ALT742306\n\nUNIT DESCRIPTOR\n:\nThis unit covers manufacturing and developing metal\ncorebox for shell core sand. The corebox can be adapted to\nhorizontal or vertical stripping set-up.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirement\n\n1.1 Drawings, instructions, specifications are interpreted and\nunderstood.\n1.2 Appropriate shell machine model is selected according to core\ndrawing and corebox construction drawing\n1.3 Corebox and component material is selected according to\ncore drawing and corebox construction drawing.\n1.4 Corebox and component for casting are requested in\naccordance with standard operating procedure\n1.5 Corebox component part for fabrication and purchase is\nrequested in accordance with standard operating procedure.\n\n2. Lay-out corebox.\n\n2.1 Corebox is laid-out showing cavity features according to\ncorebox construction drawing\n2.2 Method of construction / machining is discussed with\nmachine shop or tool and die section.\n\n3. Manufacture\ncorebox and\ncomponent.\n\n3.1 Corebox and component is marked out and machining job\ninitiated to meet specification.\n3.2 Machining is checked periodically for compliance to\nrequirement.\n3.3 Corebox cavities are machined using acceptable machine\nshop / tool and die fabrication technique and procedures.\n3.4 Cavities are finished, utilizing appropriate hand or hand held\npower tools.\n3.5 Corebox and component are assembled according to\nspecification and acceptable corebox locating technique and\nprocedure.\n3.6 Components are revised to adapt corebox including electrical,\npneumatic and hydraulic controls.\n\n4. Develop corebox\n\n4.1 Corebox mounted to core machine bolster according to\nstandard operating procedure.\n4.2 Operational dry-run of coremachine / corebox is undertaken to\nensure compatibility.\n4.3 Trial coremaking by heating up the corebox, loading of sand,\nactivating water cooling system is undertaken and machine\nparameters are adjusting based on machine setup procedure\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n35\nand corebox requirements.\n4.4 Core is inspected / evaluated for conformance to core quality\nrequirements.\n4.5 Adjustment on machine / corebox component and parameters\ninitiated until the satisfactory core is produced according to\ncore quality requirement.\n\n5. Record data.\n\n5.1 Test data is recorded (start to end) to include machine\nparameters corebox adjustment, shell sand used and other\nrelevant information.\n5.2 Task is completed in accordance with Occupational Health &\nSafety (OH & S) requirements\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n36\n RANGE OF VARIABLE\nVARIABLE\nRANGE\n\n1. Machine\n1.1\nVertical strip setup.\n1.2\nHorizontal strip setup.\n\n2. Material\n2.1 Gray cast iron for core cavities, brackets, stripping plates,\nburner plates, blow-plates.\n2.2 Tool steel for stripping pins, guide pins and bushings, blow-\ntubes, dowels.\n\n3. Cavity features\n3.1 Taper\n3.2 Core print\n3.3 Center/outline of cavities\n3.4 Ejector holes\n3.5 Contraction factor\n3.6 Center of rotation and\n3.7 Desired width, length and thickness\n\n4. Method of\nconstruction\n4.1 Segmented\n4.2 Loose\n4.3 One-halve of fixed and movable die\n4.4 Doweled and bolted.\n\n5. Fabrication\ntechnique\n\n5.1 EDM\n5.2 Heat-treatment of parts\n5.3 End milling\n5.4 Face milling\n5.5 Drill/tap\n5.6 Die grinding\n5.7 Hand polishing\n5.8 Fitting\n5.9 Marking off\n5.10 Template checking.\n\n6. Machine\nparameter\n6.1 Air blow pressure\n6.2 Blow time\n6.3 Corebox temperature (fixed/movable)\n6.4 Cure time\n6.5 Roll over device vibration timer\n6.6 Clamping pressure\n6.7 Ejection mark.\n\n7. Core quality\nrequirements\n\n7.1 Color\n7.2 Thickness of shell\n7.3 Weight of core\n7.4 Friable parts\n7.5 Completeness\n7.6 Core ejection marks\n7.7Stickers.\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n37\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate\n1.1 Determined job requirements.\n1.2 Laid out corebox.\n1.3 Manufactured corebox and component.\n1.4 Developed corebox\n1.5Recorded data.\n\n2 Underpinning\nknowledge and\nattitudes\n2.1 Formulae / mathematical techniques required for manufacturing\nand development of production corebox\n2.2 Contraction, taper, clearances, machining allowances, etc\n2.3 Tolerance and construction values typically used in the\nmanufacture and development of production corebox\n2.4 Characteristics of metals and alloys and their application in the\nmanufacture / development of production corebox\n2.5 Production molding, coremaking and casting technique.\n2.6 Tooling required for castings\n2.7 Appropriate technique, tools and equipments to measure,\nmarked out and produce corebox\n2.8 Method of corebox construction including machining provision\nand clamping arrangement\n2.9 Shell core machine nomenclature and operational sequence.\n2.10 Corebox checking technique\n2.11 Assembly technique of corebox to shell machine\n2.12 Hazard and control measures associated with development /\nmanufacturing and production of corebox\n2.13 Use of personal protective equipments\n2.14 Safe work practice and procedures\n2.15 Observant/Attentive to details\n2.16 Patience\n2.17 Honesty\n2.18 Courtesy\n\n3 Underpinning\nskills\n\n3.1 Determining job requirements from written instruction, standard\noperating procedures, sketches, shop / product drawings, and\nother applicable reference document.\n3.2 Planning and sequencing operation.\n3.3 Deciding corebox construction method.\n3.4 Checking and clarifying task related information.\n3.5 Selecting appropriate materials to suite the corebox fabrication\nand coremaking process.\n3.6 Joining and fixing component part.\n3.7 Operate shell machine and setup parameters.\n3.8 Inspecting and analyzing core defects and initiate\ncountermeasure.\n3.9 Checking core boxes and component parts.\n3.10 Checking machine operational capability.\n3.11 Assemble corebox to core machine.\n3.12 Accomplish test report and entering familiar information into\npro-forma and standard workplace form.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n38\n3.13 Conduct necessary layout making, measurement to corebox /\ncomponent parts.\n3.14 Coordinating with other section.\n3.15 Communication with other section.\n\n4 Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area.\n4.2 Manuals / catalogues relative to this unit.\n4.3 Job order, requisitions\n4.4 Materials, tools, equipment and facilities relevant to the unit.\n\n5 Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\nenvironment.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n39\nUNIT OF COMPETENCY :\nDEVELOP AND MANUFACTURE GEAR, CONVEYOR\nSCREW AND PROPELLER PATTERNS\n\nUNIT CODE\n\n:"
