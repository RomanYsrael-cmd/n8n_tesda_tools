        "source_text": "ALT742307\n\nUNIT DESCRIPTOR\n:\nThis unit covers laying-out and manufacture gear, conveyor\nscrew and propeller pattern. Gear patterns may be\nsegmented or any other method used to minimize timber\nshrinkage or warpage and to achieve the required strength.\nConveyor or propeller screw may be built up using\npredetermined thickness-timber either over a mandrel or a\nlayout. Patterns may be set-up or a joint board or plated for\nease of molding.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirements\n\n1.1 Drawings, instructions and specifications are interpreted and\nunderstood.\n1.2 Material is selected in accordance with the drawings,\ninstructions and/or specifications.\n1.3 Molding, cast techniques and foundry processes are identified\nin determining the type of pattern required.\n\n2. Lay out pattern gear,\nconveyor screw and\npropeller pattern\n\n2.1 Pattern parameters are calculated in accordance with the\ndrawings, instructions and/or specifications.\n2.2 Pattern is laid out showing pattern characteristics in\naccordance with the drawings, instructions and/or\nspecifications.\n2.3 Jigs and fixtures are developed and fabricated to aid the\nmanufacture of the pattern form as required.\n\n3. Manufacture gear,\nconveyor screw and\npropeller pattern\n\n3.1 Materials are marked out and construction is developed to\nmeet specifications.\n3.2 Pattern or pattern component parts are produced to size and\nshape and checked for compliance with specifications using\nacceptable wood pattern making techniques, procedures and\nutilizing appropriate hand and hand held power.\n3.3 Pattern component parts are joined or fixed as required,\naccording to specifications, using acceptable pattern making\ntechniques and procedures.\n3.4 Pattern is marked, color coded and / or tagged in compliance\nwith specifications or standard operating procedures.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n40\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Material\n\n1.1 Hardwood\n1.2 Softwood\n1.3 Epoxy resins\n1.4Composites.\n\n2. Pattern\nparameters\n\n2.1 Pitch circles\n2.2 Pressure angles\n2.3 Tooth form\n2.4 Left- and right-hand flight helix\n2.5 Pitch axial dimensions\n2.6 Angles, tapers, clearances\n2.7 Contraction allowances appropriate to developing various types\nof gear, conveyor and propeller forms.\n\n3. Calculated\n\nCalculated values to determine:\n3.1 Contraction rates\n3.2 Pitch\n3.3 Proportions\n3.4Profiles as well as general engineering calculations.\n\n4. Pattern\ncharacteristics\n\n4.1 Tapers\n4.2 Machining allowances\n4.3 Core prints and\n4.4Method of construction\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n41\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\n\nAssessment requires evidence that the candidate\n1.1 Determined job requirements\n1.2 Laid-out pattern gear, conveyor screw and propeller pattern\n1.3 Manufactured gear, conveyor screw and propeller pattern\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Timber, epoxy resin and composite product knowledge including\nfeatures, characteristics and applications.\n2.2 Molding and casting techniques for cast gears, conveyor screws\nand marine propellers.\n2.3 Tooling required for casting / molding.\n2.4 Methoding techniques.\n2.5 The use and application of jigs and fixtures.\n2.6 Methods of construction.\n2.7 Techniques, tools and equipment to measure, mark out and\nproduce gear, conveyor screw and propeller patterns.\n2.8 Mathematical calculations and formulae required to manufacture\npatterns / core boxes – contraction, taper, pitch, profiles,\nclearances, machining allowances.\n2.9 Identification coding and numbering.\n2.10 Pattern checking techniques.\n2.11 Moldability i.e. surface finish, face taper, convex or concave\nperspectives, undercuts etc.\n2.12 Use and application of personal protective equipments.\n2.13 Safe work practices and procedures.\n2.14 Hazards and control measures associated with developing\nand manufacturing gear, conveyor screw and propeller\npatterns\n2.15 Safe work practice and procedures\n2.16 Observant/Attentive to details\n2.17 Patience\n2.18 Honesty\n2.19\nCourtesy\n\n3. Underpinning\n skills\n\n3.1 Determining job requirements from written instructions, standard\noperating procedures, sketches, drawings and other applicable\nreference documents.\n3.2 Planning and sequencing operations.\n3.3 Checking and clarifying task related information.\n3.4 Selecting appropriate materials to suit the molding/casting\ntechniques and foundry process.\n3.5 Laying out the pattern / core boxes and mold.\n3.6 Operating woodworking equipment\n3.7 Constructing patterns / core boxes and mold.\n3.8 Joining and fixing component parts.\n3.9 Checking patterns and molds.\n3.10 Calculating contraction rates / pitch / proportions / profiles.\n3.11\nCalculating mold cooling H2O volume\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n42\n3.12 Calculating gating / risering system\n3.13 Preparation of mold coating\n3.14 Application of mold coating\n3.15 Pre-heating of mold\n3.16\nUndertaking relevant engineering calculations\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Manuals/catalogues relative to Patternmaking\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Incoming material receiving effort.\n4.5Quality handbook procedure for melting.\n\n5.Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n