          "source_text": "1. Critical aspect of\n competency\n\nAssessment requires evidence that the candidate\n1.1 Determined job requirements\n1.2 Laid-out pattern gear, conveyor screw and propeller pattern\n1.3 Manufactured gear, conveyor screw and propeller pattern\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Timber, epoxy resin and composite product knowledge including\nfeatures, characteristics and applications.\n2.2 Molding and casting techniques for cast gears, conveyor screws\nand marine propellers.\n2.3 Tooling required for casting / molding.\n2.4 Methoding techniques.\n2.5 The use and application of jigs and fixtures.\n2.6 Methods of construction.\n2.7 Techniques, tools and equipment to measure, mark out and\nproduce gear, conveyor screw and propeller patterns.\n2.8 Mathematical calculations and formulae required to manufacture\npatterns / core boxes – contraction, taper, pitch, profiles,\nclearances, machining allowances.\n2.9 Identification coding and numbering.\n2.10 Pattern checking techniques.\n2.11 Moldability i.e. surface finish, face taper, convex or concave\nperspectives, undercuts etc.\n2.12 Use and application of personal protective equipments.\n2.13 Safe work practices and procedures.\n2.14 Hazards and control measures associated with developing\nand manufacturing gear, conveyor screw and propeller\npatterns\n2.15 Safe work practice and procedures\n2.16 Observant/Attentive to details\n2.17 Patience\n2.18 Honesty\n2.19\nCourtesy\n\n3. Underpinning\n skills\n\n3.1 Determining job requirements from written instructions, standard\noperating procedures, sketches, drawings and other applicable\nreference documents.\n3.2 Planning and sequencing operations.\n3.3 Checking and clarifying task related information.\n3.4 Selecting appropriate materials to suit the molding/casting\ntechniques and foundry process.\n3.5 Laying out the pattern / core boxes and mold.\n3.6 Operating woodworking equipment\n3.7 Constructing patterns / core boxes and mold.\n3.8 Joining and fixing component parts.\n3.9 Checking patterns and molds.\n3.10 Calculating contraction rates / pitch / proportions / profiles.\n3.11\nCalculating mold cooling H2O volume\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n42\n3.12 Calculating gating / risering system\n3.13 Preparation of mold coating\n3.14 Application of mold coating\n3.15 Pre-heating of mold\n3.16\nUndertaking relevant engineering calculations\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Manuals/catalogues relative to Patternmaking\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Incoming material receiving effort.\n4.5Quality handbook procedure for melting.\n\n5.Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6.Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC III Promulgated\n\n43\nUNIT OF COMPETENCY :\nDEVELOP GRAVITY DIE CASTING MOLD\n\nUNIT CODE\n\n:"
