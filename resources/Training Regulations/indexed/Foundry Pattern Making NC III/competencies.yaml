          "source_text": "1. Identify job \nrequirement \n \n \n1.1 Product drawings, instruction and specifications are \ninterpreted and fully understand. \n1.2 Appropriate mold materials are selected as per method of \nmolding and specifications. \n1.3 Mold fabrication technique, molding of components, casting \ntechnique and foundry process are identified to determine the \ntype of mold required. \n \n2. Prepare mold \nconstruction plan \n \n \n2.1 Planning of mold, fabrication of components, casting \ntechnique is applied as required. \n2.2 Molding process is selected as per mold plan and standard \noperating procedures. \n2.3 Casting parameters is laid-out as per standard operating \nprocedures. \n2.4 Pouring system, riser size, mold cooling system is \ncalculated as per standard operating procedures. \n \n3. Fabricate mold  \n \n \n3.1 Mold materials are identified and secured/ procured \naccording to standard operating procedures. \n3.2 Mold and component parts are produced to size and shape \nand checked for compliance with specifications using \nacceptable machining techniques, procedures and utilizing \nappropriate hand and hand-help power tools. \n3.3 Mold component parts are joined or fixed as required \naccording to specification and acceptable mold making \ntechniques and procedures. \n3.4 Mold cooling system checked for compliance with \nspecification. \n3.5 Clay molding of casting is produced from the mold to check \nconfiguration and surface finish of the mold as per standard \noperating procedures.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n44\n \n \n4. Conduct trial \ncasting \n \n \n4.1 Samples for aesthetic inspection are produced and \ndimensional inspection is performed as per specification \nrequirement. \n4.2 Mold is prepared for application of appropriate mold coating \nas per standard operating procedures. \n4.3  Mold is mounted and secured to casting machine as per \nstandard operating procedures. \n4.4 Mold / machine is prepared for pouring of molten metal as per \nstandard operating procedures. \n4.5 Task completed using personal protective equipment in \naccordance with safe work practices and procedures. \n \n5. Inspect mold \n \n \n5.1 Mold is inspected for related defects as per standard \noperating procedures. \n5.2 Dimensions are checked and mold is rectified, if needed, as \nper standard operating procedures. \n5.3 Section thickness is measured and checked for compliance \nwith specification. \n5.4 Conformance report is submitted as per company/shop \nrequirement and standard operating procedures.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n45\n RANGE OF VARIABLE \n \nVARIABLE \nRANGE \n \n1. Mold material \n \n1.1 Gray cast iron for the halves or quadrants. \n1.2 Tool steel for bottom mold. \n1.3 Gray cast iron for center mold.\n \n2. Type of mold \n \nTypes of mold includes, but not limited to \n2.1 Center pouring mold \n2.2 Side pouring mold \n2.3 Semi-permanent mold with sand core. \n2.4 With loose piece.\n \n3. Planning of mold  \n \nThe following should be considered in planning \n3.1 Quantity of casting to be produced. \n3.2 Type of metal to be cast \n3.3 Casting cycle time. \n3.4 Complexity of the casting. \n3.5 Casting machine loading\n \n4. Mold cooling \nsystem\n \n4.1 Water cooling \n4.2 Air cooling\n \n5. Mold coating \n \n5.1 Preheating of mold (110° – 150°C) \n5.2 Coating application/ technique (spraying) \n5.3 Coating type \n5.3.1 Insulating type \n5.3.2 Lubricating type\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n46"
