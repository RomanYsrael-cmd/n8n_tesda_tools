        "evidence_guide": {
          "source_text": "1. Critical aspect of   \n     Competency \n \nAssessment requires evidence that the candidate  \n1.1 Identified job requirement. \n1.2 Prepared mold construction plan. \n1.3 Fabricated mold.  \n1.4 Conducted trial casting. \n1.5 Inspection mold. \n \n2. Underpinning \nKnowledge and \nattitudes \n \n2.1 Casting process of non-ferrous alloys \n2.2 Metal, resin, and composite product knowledge including \ncharacteristics and application \n2.3 Molding and casting techniques for ferrous metal \n2.4 Machining and tool / die making process \n2.5 Principles of permanent mold coating and application \n2.6 Patterns and tooling required to fabricate metal mold \n2.7 Method and  technique of permanent mold fabrication \n2.8 Use of jig / fixture \n2.9 Bench work for metal mold \n2.10 Mold checking technique \n2.11 Casting inspection technique \n2.12 Casting defect, cause and countermeasure \n2.13 Use and application of personal protective equipments \n2.14 Safe work practice and procedures \n2.15 Hazards and control measures associated with developing \nand manufacturing permanent mold \n2.19 Safe work practice and procedures \n2.20 Observant/Attentive to details \n2.21 Patience \n2.22 Honesty \n2.16 Courtesy\n  \n3. Underpinning  \n    skills \n \n3.1 Determining job requirements from written instructions, \nstandard operating procedures, sketches, drawings and other \napplicable reference documents \n3.2 Planning and sequencing operations  \n3.3 Checking and clarifying task related information \n3.4 Selecting appropriate materials to suit the molding/casting \ntechniques and foundry process \n3.5 Laying out the pattern / core boxes and mold \n3.6 Constructing patterns / core boxes and mold \n3.7 Joining and fixing component parts \n3.8 Checking patterns and molds \n3.9 Calculating contraction rates / pitch / proportions / profiles \n3.10 Calculating mold cooling water (H2O) volume \n3.11 Calculating gating / risering system \n3.12 Preparation of mold coating \n3.13 Application of mold coating \n3.14 Pre-heating of mold\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n47\n \n4. Resource \nimplications \n \n \n \nThe following resources MUST be provided:  \n4.1  Manuals/catalogues relative to mold making \n4.2  Job order, requisitions slip for materials \n4.3  Materials, tools and equipment relevant to the activity  \n4.4 Incoming material receiving effort. \n4.5 Quality handbook procedure for melting.  \n \n5.Method of \nassessment \n    \n     \n \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3 Third Party Report \n \n6.Context of \nassessment  \n \n \n \n6.1 Assessment must be undertaken in accordance with      the \nendorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n       simulated environment.",
