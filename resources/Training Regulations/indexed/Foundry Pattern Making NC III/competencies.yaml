        "source_title": "DEVELOP GRAVITY DIE CASTING MOLD",
        "source_text": "--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n43\nUNIT OF COMPETENCY : \nDEVELOP GRAVITY DIE CASTING MOLD \n            \nUNIT CODE  \n \n:  \nALT742308 \n \nUNIT DESCRIPTOR \n: \nThis unit covers developing a gravity die casting mold  \n(permanent / semi-permanent) used to produce \ncomponent parts for automotive, track, and allied industries. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Identify job \nrequirement \n \n \n1.1 Product drawings, instruction and specifications are \ninterpreted and fully understand. \n1.2 Appropriate mold materials are selected as per method of \nmolding and specifications. \n1.3 Mold fabrication technique, molding of components, casting \ntechnique and foundry process are identified to determine the \ntype of mold required. \n \n2. Prepare mold \nconstruction plan \n \n \n2.1 Planning of mold, fabrication of components, casting \ntechnique is applied as required. \n2.2 Molding process is selected as per mold plan and standard \noperating procedures. \n2.3 Casting parameters is laid-out as per standard operating \nprocedures. \n2.4 Pouring system, riser size, mold cooling system is \ncalculated as per standard operating procedures. \n \n3. Fabricate mold  \n \n \n3.1 Mold materials are identified and secured/ procured \naccording to standard operating procedures. \n3.2 Mold and component parts are produced to size and shape \nand checked for compliance with specifications using \nacceptable machining techniques, procedures and utilizing \nappropriate hand and hand-help power tools. \n3.3 Mold component parts are joined or fixed as required \naccording to specification and acceptable mold making \ntechniques and procedures. \n3.4 Mold cooling system checked for compliance with \nspecification. \n3.5 Clay molding of casting is produced from the mold to check \nconfiguration and surface finish of the mold as per standard \noperating procedures.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n44\n \n \n4. Conduct trial \ncasting \n \n \n4.1 Samples for aesthetic inspection are produced and \ndimensional inspection is performed as per specification \nrequirement. \n4.2 Mold is prepared for application of appropriate mold coating \nas per standard operating procedures. \n4.3  Mold is mounted and secured to casting machine as per \nstandard operating procedures. \n4.4 Mold / machine is prepared for pouring of molten metal as per \nstandard operating procedures. \n4.5 Task completed using personal protective equipment in \naccordance with safe work practices and procedures. \n \n5. Inspect mold \n \n \n5.1 Mold is inspected for related defects as per standard \noperating procedures. \n5.2 Dimensions are checked and mold is rectified, if needed, as \nper standard operating procedures. \n5.3 Section thickness is measured and checked for compliance \nwith specification. \n5.4 Conformance report is submitted as per company/shop \nrequirement and standard operating procedures.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n45\n RANGE OF VARIABLE \n \nVARIABLE \nRANGE \n \n1. Mold material \n \n1.1 Gray cast iron for the halves or quadrants. \n1.2 Tool steel for bottom mold. \n1.3 Gray cast iron for center mold.\n \n2. Type of mold \n \nTypes of mold includes, but not limited to \n2.1 Center pouring mold \n2.2 Side pouring mold \n2.3 Semi-permanent mold with sand core. \n2.4 With loose piece.\n \n3. Planning of mold  \n \nThe following should be considered in planning \n3.1 Quantity of casting to be produced. \n3.2 Type of metal to be cast \n3.3 Casting cycle time. \n3.4 Complexity of the casting. \n3.5 Casting machine loading\n \n4. Mold cooling \nsystem\n \n4.1 Water cooling \n4.2 Air cooling\n \n5. Mold coating \n \n5.1 Preheating of mold (110° – 150°C) \n5.2 Coating application/ technique (spraying) \n5.3 Coating type \n5.3.1 Insulating type \n5.3.2 Lubricating type\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n46\nEVIDENCE GUIDE \n \n1. Critical aspect of   \n     Competency \n \nAssessment requires evidence that the candidate  \n1.1 Identified job requirement. \n1.2 Prepared mold construction plan. \n1.3 Fabricated mold.  \n1.4 Conducted trial casting. \n1.5 Inspection mold. \n \n2. Underpinning \nKnowledge and \nattitudes \n \n2.1 Casting process of non-ferrous alloys \n2.2 Metal, resin, and composite product knowledge including \ncharacteristics and application \n2.3 Molding and casting techniques for ferrous metal \n2.4 Machining and tool / die making process \n2.5 Principles of permanent mold coating and application \n2.6 Patterns and tooling required to fabricate metal mold \n2.7 Method and  technique of permanent mold fabrication \n2.8 Use of jig / fixture \n2.9 Bench work for metal mold \n2.10 Mold checking technique \n2.11 Casting inspection technique \n2.12 Casting defect, cause and countermeasure \n2.13 Use and application of personal protective equipments \n2.14 Safe work practice and procedures \n2.15 Hazards and control measures associated with developing \nand manufacturing permanent mold \n2.19 Safe work practice and procedures \n2.20 Observant/Attentive to details \n2.21 Patience \n2.22 Honesty \n2.16 Courtesy\n  \n3. Underpinning  \n    skills \n \n3.1 Determining job requirements from written instructions, \nstandard operating procedures, sketches, drawings and other \napplicable reference documents \n3.2 Planning and sequencing operations  \n3.3 Checking and clarifying task related information \n3.4 Selecting appropriate materials to suit the molding/casting \ntechniques and foundry process \n3.5 Laying out the pattern / core boxes and mold \n3.6 Constructing patterns / core boxes and mold \n3.7 Joining and fixing component parts \n3.8 Checking patterns and molds \n3.9 Calculating contraction rates / pitch / proportions / profiles \n3.10 Calculating mold cooling water (H2O) volume \n3.11 Calculating gating / risering system \n3.12 Preparation of mold coating \n3.13 Application of mold coating \n3.14 Pre-heating of mold\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n47\n \n4. Resource \nimplications \n \n \n \nThe following resources MUST be provided:  \n4.1  Manuals/catalogues relative to mold making \n4.2  Job order, requisitions slip for materials \n4.3  Materials, tools and equipment relevant to the activity  \n4.4 Incoming material receiving effort. \n4.5 Quality handbook procedure for melting.  \n \n5.Method of \nassessment \n    \n     \n \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3 Third Party Report \n \n6.Context of \nassessment  \n \n \n \n6.1 Assessment must be undertaken in accordance with      the \nendorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n       simulated environment.\n",
