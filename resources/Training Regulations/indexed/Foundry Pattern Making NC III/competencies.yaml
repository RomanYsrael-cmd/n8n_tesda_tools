        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n2\n \n \n \n \nSECTION 2  COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in FOUNDRY PATTERNMAKING NC III.  \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :   LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n     :   500311109 \n \n    UNIT DESCRIPTOR        :  This unit covers the knowledge, skills, and attitudes required to \nlead in the dissemination and discussion of ideas, information, \nand issues in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Communicate \ninformation about \nworkplace processes \n1.1 \nAppropriate communication method is selected  \n1.2 Multiple operations involving several topics areas are \ncommunicated accordingly \n1.3 Questions are used to gain extra information \n1.4 Correct sources of information are identified \n1.5 Information is selected and organized correctly \n1.6 Verbal and written reporting is undertaken when \nrequired \n1.7 Communication skills are maintained in all situations \n2. Lead workplace \ndiscussions \n2.1 Response to workplace issues are sought  \n2.2 Response to workplace issues are provided \nimmediately \n2.3 Constructive contributions are made to workplace \ndiscussions on such issues as production, quality and \nsafety \n2.4 Goals/objectives and action plan  undertaken in the \nworkplace are communicated \n3. Identify and \ncommunicate issues \narising in the workplace \n3.1 Issues and problems are identified as they arise \n3.2 Information regarding problems and issues are \norganized coherently to ensure clear and effective \ncommunication \n3.3 Dialogue is initiated with appropriate personnel \n3.4 Communication problems and issues are raised as \nthey arise\n\n--- PDF PAGE 5 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n3\n\n--- PDF PAGE 6 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n4\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1 Non-verbal gestures \n1.2 Verbal \n1.3 Face to face \n1.4 Two-way radio \n1.5 Speaking to groups \n1.6 Using telephone \n1.7 Written \n1.8 Internet\n\n--- PDF PAGE 7 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC III                                                                                                                Promulgated   \n           \n5\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDealt with a range of communication/information at one \ntime \n1.2 \nMade constructive contributions in workplace issues \n1.3 \nSought workplace issues effectively \n1.4 \nResponded to workplace issues promptly \n1.5 \nPresented information clearly and effectively written form \n1.6 \nUsed appropriate sources of information \n1.7 \nAsked appropriate  questions \n1.8 \nProvided accurate information  \n2. Underpinning \nknowledge and \nattitude \n2.1 \nOrganization requirements for written and electronic \ncommunication methods \n2.2 \nEffective verbal communication methods \n3. Underpinning \nskills \n3.1 \nOrganize information \n3.2 \nUnderstand and convey intended meaning \n3.3 \nParticipate in variety of workplace discussions \n3.4 \nComply with organization  requirements for the use of \nwritten and electronic communication methods \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nVariety of Information \n4.2 \nCommunication tools \n4.3 \nSimulated workplace \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nCompetency in this unit must be assessed through \n5.2 \nDirect Observation \n5.3 \nInterview \n6. Context  of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in \nsimulated workplace environment\n",
