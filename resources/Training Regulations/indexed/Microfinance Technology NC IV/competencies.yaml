        "source_title": "SUPERVISE MFI LOAN OFFICERS",
        "source_text": "--- PDF PAGE 46 ---\nTR –Microfinance Technology NC IV  \n40\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nSUPERVISE MFI LOAN OFFICERS \nUNIT CODE \n  \n:   \nHCS341301 \nUNIT DESCRIPTOR  \n: \nThis unit of competency covers the knowledge, skill and \nattitudes required in the supervision of loan officers in \ntheir implementation of microfinance programs, policies \nand \nprocedures. \nThis \nfurther \nmeasures \nthe \nperformance of the team leader/supervisor in carrying \nout their tasks as supervisor. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Oversee field \noperations \nand other \nservices \n \n1.1 Formation of groups/center and center meeting is checked, \nmonitored and provided with feedback to optimize provision of \nservices and benefits based on the standard operating \nprocedures \n1.2 Coaching/Assistance is provided to loan officers in the conduct of \narea mapping/scanning to ensure quality of target area and \nclient’s selection based on the standard operating procedures; \nand promoting products and services \n1.3 Monthly and weekly targets/schedules are prepared/provided to \nloan officers in accordance with MFI annual and area targets \n1.4 On-the-spot/surprise checks/audits of loan officers’ accounts are \nmade in accordance with MFI internal control policy \n1.5 Conflicts between loan officer and clients are settled and handled \nin accordance with MFI conflict resolution strategies \n1.6 Tasks of immediate superior/subordinates are carried out  \n      during their absence in accordance with MFI standard  \n      operating procedures \n1.6 Good interpersonal relationships are established and maintained \nwith loan officers and clients based on company core values\n2. Check loan \nofficer’s \nprocessing of \nclients’ loans \n2.1 Clients’ loan application documents are validated against \nMIS/source of information \n2.2 Recommendations of loan officers are referred to the appropriate \ncommittee or level of authority for final decision based on loan \napproval matrix \n2.3 Loan applications are recommended for appropriate action in \naccordance with MFI policies and procedures\n3. Oversee \nregular and \nspecial events \nfor loan officer \nand clients \n \n3.1 Regular and special events are organized and facilitated in \naccordance with MFI schedule of activities \n3.2 Event plan and personnel assignments and responsibilities are \nidentified and assigned based on event objectives   \n3.3 Information on event is disseminated to clients in coordination \nwith loan officers and staff concerned \n3.4 Conduct of event/activity is overseen in coordination with loan \nofficers, clients and partners\n\n--- PDF PAGE 47 ---\nTR –Microfinance Technology NC IV  \n41\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n3.5 Activity is evaluated/assessed and documented and reported to \nimmediate superior  in accordance with MFI standard operating \nprocedures\n4. Deal with \ndelinquent \naccounts \n4.1 Delinquent accounts are monitored, validated/analyzed and \nreasons of delinquency are confirmed based on MFI policies and \nprocedures \n4.2 Delinquent payment options are presented to the delinquent \nclients and restorative actions are implemented based on MFI \npolicies and guidelines \n4.3 Plan of action is formulated and implemented in compliance with \nMFI policies and guidelines \n4.4 When necessary, delinquent account is referred to legal officer \nfor appropriate action based on MFI policies and procedures\n\n--- PDF PAGE 48 ---\nTR –Microfinance Technology NC IV  \n42\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Groups/center \n1.1 Validation/verification of group compositions and their \nqualifications \n1.2 Conduct of unannounced field visits\n2. Area mapping/ \nscanning \nMay include: \n2.1 Coordination with the concerned local government units and \noffices \n2.2 Review of barangay profiles, surveys and reports \n2.3 Approval/recommendations for expansion by loan officers\n3. Products and \nservices \nMay include: \n3.1 Financial Services (such as Loan Programs) \n3.2 Non-financial services (such as technical skills training, \nlivelihood programs, health and education, environmental \nadvocacies)\n4. Targets \nMay include: \n4.1 Review of previous schedules \n4.2 Gathering and checking of plan of activities submitted by \nloan officers \n4.3 Posting of weekly activity schedules \n4.4 Monitoring of the scheduled activities \n5. Regular and \nspecial events  \n5.1 Introduction of new products and services \n5.2 Christmas programs \n5.3 Anniversary \n5.4 General assembly \n5.5 Awarding and recognition\n6. Delinquent \naccounts \n6.1 Missed payments to organization \n6.2 Remedied payments (abono) \n6.3 Non-compliance with pledge/agreements/internal policy on \npayments\n7. Delinquent \npayment options \n7.1 Deferred payment \n7.2 Debt Restructuring \n7.3 Refinancing \n7.4 Group accountability payment\n8. Restorative actions \n8.1 Home visitation \n8.2 Meetings \n8.3 Special program \n8.4 Counseling  and motivation\n\n--- PDF PAGE 49 ---\nTR –Microfinance Technology NC IV  \n43\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to oversee field operations and other \nservices  \n1.2 Assisted loan officers in conducting area mapping/scanning \n1.3 Validated clients’ loan application documents against \nMIS/source of information \n1.4 Evaluated recommendations of Loan Officer’s in processing \nclient’s loan for referral to the appropriate committee or level of \nauthority  \n1.5 Demonstrated ability to oversee regular and special events for \nloan officers and clients \n1.6 Checked and validated/analyzed delinquent accounts \n1.7 Dealt with delinquent accounts \n1.8 Demonstrated good interpersonal relationships with loan \nofficers and clients based on company core values \n2. Underpinning \nknowledge and \nattitude \n2.1   MFI Mission, Vision and Core values  \n2.2   MFI strategic directions and operational plans  \n2.3   MFI’s standard operating procedures and policies relating to: \na. area selection \nb. group/center formation \nc. loan application processing \nd. group/center meetings \ne. conflict management  \n2.4 \nMicrofinance products and services \n2.5 \nClients’ loans application processing \n2.6 \nMFI record keeping procedures \n2.7 \nMFI internal control procedures \n2.8 \nCommunication process and practices \n2.9 \nBusiness correspondence  \n2.10 Supervisory theory and principles \n2.11 Supervisory functions \n2.12 Teambuilding principles and practices \n2.13 Event program plan details \n2.14 Event evaluation and documentation procedures \n2.15 Memo and report writing  \n2.16 Counseling principles and practices \n2.17 Delinquency management \n2.18 Internal control procedures\n\n--- PDF PAGE 50 ---\nTR –Microfinance Technology NC IV  \n44\n2.19 Work values and ethics: \na. Patience \nb. Friendly, firm and fair \nc. Transparent \nd. Attention to details \ne. Team player \nf. Resourcefulness \n3. Underpinning \nskills \n3.1 Supervisory skills \n3.2 Communication skills \n3.3 Interpersonal relationships \n3.4 Community organizing \n3.5 Motivational skills \n3.6 Accounting skills \n3.7 Analytical skills \n3.8 Conflict resolution \n3.9 Counseling/guiding skills \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace area (simulated or actual) \n4.2 Access to all tools, equipment, materials and documentation \nrequired \n4.3 Relevant workplace procedures, codes, standards, manuals \nand reference materials \n4.4 MFI policies and procedures \n4.5 MFI Operation manual \n4.6 Evaluation forms \n4.7 Case problem \n4.8 Loan documents \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Interview \n5.2 Written report \n5.3 Portfolio \n6. Context for \nassessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace setting\n",
