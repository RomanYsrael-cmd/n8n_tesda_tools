recommendations\n\n2.1 Loan Officer is provided with counseling and coaching to\nimprove performance in accordance with MFI policies and\nprocedure\n2.2 Performance Evaluation results and recommendations are\nforwarded to BM for approval\n3. Motivate loan\nofficers\n\n3.1 Facilitated the provision of material resources necessary in\nenhancing performance of loan officers in field works in\naccordance with MFI procedures and guidelines\n3.2 Positive-stroking strategies are identified and implemented\nto motivate Loan Officers in accordance with MFI practices,\nprocedures and guidelines\n3.3 Awards and incentives are recommended for deserving Loan\nOfficers who performed within or above performance\nstandards in accordance with MFI policies and procedures\n\n--- PDF PAGE 61 ---\nTR –Microfinance Technology NC IV\n55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Quality of work\n1.1\nAccuracy of data\n1.2\nNeatness\n1.3\nCompleteness\n1.4\nConsistency of entries\n1.5\nOn time submission of report\n1.6\nOn time processing of client’s documents\n2. Resources\nMay include-\n2.1\nMeals, transportation and communication allowances\n2.2\nAccommodation allowances\n2.3\nVehicles\n2.4\nFuel allocation\n2.5\nCalculator\n2.6\nOffice supplies\n2.7\nPersonal protective equipment (e.g. umbrella, raincoat, jacket,\nhelmet, rubber boots)\n2.8\nCell phone with plan\n3. Positive-stroking\nstrategies\nMay include -\n3.1\nBody language or gestures\n3.2\nWords of encouragement or praises\n3.3\nWritten commendation\n3.4\nTreats\n3.5\nFellowships\n3.6\nTeam building\n3.7\nSports festival\n4. Awards and\nincentives\n4.1\nRegularization of position\n4.2\nPromotion\n4.3\nSalary/allowance increases\n4.4\nAwards/Citation\n4.5\nTrainings (local or overseas)\n4.6\nProfit-sharing\n4.7\nScholarships\n4.8\nBonuses\n\n--- PDF PAGE 62 ---\nTR –Microfinance Technology NC IV\n56\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability t