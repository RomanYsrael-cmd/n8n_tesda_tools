terview/Third Party Reports \n5.3 Portfolio (citations/awards from GOs and NGOs, certificate \nof  training – local and abroad) \n  5.4  Simulations and role-plays \n5. Context for \nAssessment \n6.1  Competency may be assessed in actual workplace or  \n at the designated TESDA center.",
