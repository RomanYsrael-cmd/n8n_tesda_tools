        "source_text": "HCS341304\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills\nand\nattitude\nrequired\nin\nevaluating\nthe\nwork\nperformance of loan officers in the microfinance\nworkplace setting. This unit measures the role of the\nteam leader/supervisor to appraise the performance of\nloan officers and recommend appropriate support.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Appraise the\nPerformance of\nloan officers\n\n1.1 Loan officers are oriented on the work targets and other basis\nof the performance evaluation\n1.2 Loan officers are oriented on how to accomplish Performance\nEvaluation Form based on MFI performance evaluation\nguidelines\n1.3 Files, books, records of clients, and practices of loan officers\nare random checked for quality of work based on MFI\nprocedures and guidelines\n1.4 Summary of loan officer’s on the job performance evaluation\nresults is used as basis for the recommendation in accordance\nwith MFI performance evaluation policies and procedures\n2. Act on evaluation\nrecommendations\n\n2.1 Loan Officer is provided with counseling and coaching to\nimprove performance in accordance with MFI policies and\nprocedure\n2.2 Performance Evaluation results and recommendations are\nforwarded to BM for approval\n3. Motivate loan\nofficers\n\n3.1 Facilitated the provision of material resources necessary in\nenhancing performance of loan officers in field works in\naccordance with MFI procedures and guidelines\n3.2 Positive-stroking strategies are identified and implemented\nto motivate Loan Officers in accordance with MFI practices,\nprocedures and guidelines\n3.3 Awards and incentives are recommended for deserving Loan\nOfficers who performed within or above performance\nstandards in accordance with MFI policies and procedures\n\n--- PDF PAGE 61 ---\nTR –Microfinance Technology NC IV\n55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Quality of work\n1.1\nAccuracy of data\n1.2\nNeatness\n1.3\nCompleteness\n1.4\nConsistency of entries\n1.5\nOn time submission of report\n1.6\nOn time processing of client’s documents\n2. Resources\nMay include-\n2.1\nMeals, transportation and communication allowances\n2.2\nAccommodation allowances\n2.3\nVehicles\n2.4\nFuel allocation\n2.5\nCalculator\n2.6\nOffice supplies\n2.7\nPersonal protective equipment (e.g. umbrella, raincoat, jacket,\nhelmet, rubber boots)\n2.8\nCell phone with plan\n3. Positive-stroking\nstrategies\nMay include -\n3.1\nBody language or gestures\n3.2\nWords of encouragement or praises\n3.3\nWritten commendation\n3.4\nTreats\n3.5\nFellowships\n3.6\nTeam building\n3.7\nSports festival\n4. Awards and\nincentives\n4.1\nRegularization of position\n4.2\nPromotion\n4.3\nSalary/allowance increases\n4.4\nAwards/Citation\n4.5\nTrainings (local or overseas)\n4.6\nProfit-sharing\n4.7\nScholarships\n4.8\nBonuses\n\n--- PDF PAGE 62 ---\nTR –Microfinance Technology NC IV\n56\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to set and discussed performance targets\nbased on workplan\n1.2 Provided material resources necessary in carrying out field\nworks\n1.3 Demonstrated ability to evaluate performance target vs. actual\noutputs\n1.4 Discussed performance evaluation result\n1.5 Demonstrated ability to provide counseling and coaching to\nimprove /motivate performance\n1.6 Demonstrated ability to appraise performance of loan officers\n1.7 Prepared and submitted recommendation for awards and\nincentives\n1.8 Recommended training and staff development opportunities\n1.9 Acted on evaluation recommendation\n1.10 Demonstrated ability to motivate and improve the performance\nof loan officers\n2. Underpinning\nknowledge and\nattitude\n2.1 Microfinance standard operating procedures and policies\n2.2 Mission, Vision and Core values of MFI\n2.3 Strategic directions and operational plans\n2.4 Record keeping and internal control procedures\n2.5 Personnel evaluation\n2.6 Anger and conflict management\n2.7 Career development plan\n2.8 Communication process\n2.9 Motivational principles and techniques\n2.10 Principles and techniques of motivation\n2.11 Mathematics (e.g. four fundamental operations, percentages,\nratios)\n2.12 Principles and Practices in Basic Bookkeeping\n2.13 Features of quality work\n2.14 Work violations and deviations\n2.15 Staff performance evaluation methods\n2.16 Personnel performance evaluation procedures\n2.17 Memo and report writing\n2.18 Labor Code (provisions on wages, tenure of employment)\n2.19 Performance evaluation forms and results (quantitative and\nqualitative)\n\n--- PDF PAGE 63 ---\nTR –Microfinance Technology NC IV\n57\n2.20 Books, files and records of loans and collection\n2.21 Principles and practices of motivation as applied to\nemployment\n2.22 Awards and incentives\n2.23 Positive stroking strategies\n2.24 Material resources for field works\n2.25 Cooperative\\Team player\n2.26 Open-mindedness\n2.27 Friendly, Firm and Fair\n2.28 Courteous\n2.29 Knowledge of the Labor Code\n3. Underpinning skills\n3.1 Communication skills both oral and written\n3.2 Team building skills\n3.3 Quality assessment skills\n3.4 Counseling skills\n3.5 Coaching skills\n3.6 Mentoring Skills\n3.7 Analytical skills\n3.8 Mathematical skills\n3.9 Interviewing skills\n3.10 Facilitation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area (simulated or actual)\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Relevant workplace procedures, codes, standards, manuals\nand reference materials\n4.1 Performance evaluation forms and result\n4.2 Books, files, records of loans and collection\n4.3 Case problem\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Interview\n5.2 Written report\n5.3 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated 