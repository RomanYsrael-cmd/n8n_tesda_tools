        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Received, assessed and responded to client needs\n1.2 Applied organizational quality procedures and\nprocesses in providing quality service\n2. Underpinning\nknowledge and\nattitude\n2.1 Understanding client’s nature, motivation,\nexpectations and needs\n2.2 Knowledge of how to determine client needs and\nexpectations related to the product/services and\nprograms\n2.3 Knowledge of appropriate marketing and promotional\nstrategies\n2.4 Knowledge of designing, administering and\nprocessing clients’ satisfaction survey\n2.5 Knowledge of confidentiality and company standards\nfor obtaining, using and protecting information\nobtained from clients\n2.6 Knowledge of company standards on how to interact\nwith clients\n2.7 Knowledge of organization’s vision, mission and\nvalues\n2.8 Commitment/dedication, love of work, competence,\ncourteous, honesty, sincerity, sensitivity to others,\nsense of responsibility, caring attitude/compassion,\nand charity\n3. Underpinning skills\n3.1 Effective oral communication skills\n3.2 Listening skills\n3.3 Motivational skills\n3.4 Interpersonal skills\n3.5 Presentation skills\n3.6 Skill in demonstrating cost/benefits/value to clients\nbased on client’s expectations and needs\n3.7 Skill in generating several alternative solutions that\nwill meet customer’s needs\n3.8 Data gathering skills\n3.9 Computer literacy\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Meeting venue/s\n4.2 Equipment and furnishings appropriate to a\nmicrofinance set-up\n\n--- PDF PAGE 35 ---\nTR –Microfinance Technology NC IV\n29\n4.3 Complete information on products, services and\nprograms\n4.4 Products, services and programs brochures\n4.5 Organization’s standard forms for clients\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Oral questioning\n5.2 Written test\n5.3 Practical demonstration\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 36 ---\nTR –Microfinance Technology NC IV\n30\nUNIT OF COMPETENCY : COMPLY WITH QUALITY AND ETHICAL STANDARDS\nUNIT CODE\n:"
        },
        "source_text": "HCS421201\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skill and attitudes required to\nprovide effective and efficient services to the clients of the\nmicrofinance industry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Update knowledge\nof products and\nservices\n1.1 Products and/or services to be marketed are\nidentified, familiarized with and fully understood\n1.2 Information on programs is accessed\n1.3 Knowledge on products, services and programs\nare updated\n1.4 Additional information on products, services and\nprograms are prepared\n2. Assess needs of\nnew and existing\nclients\n2.1 Active listening is used to gather information from\nclients\n2.2 Provided clients with courteous and professional\ntreatment throughout the interaction using\ninteractive communication\n2.3 Inquiries, concerns and comments are responded\nto promptly and accurately in accordance with\norganization’s policies\n2.4 Recorded all the gathered information given by the\nclients\n2.5 Identified related or applicable needs of clients\nbased on the products/services and program being\noffered\n2.6 Orientation on products/services, program and\npolicies are conducted\n3. Conduct client\nsatisfaction survey\n3.1 Client satisfaction survey is administered\n3.2 Survey results are collated and analyzed\n3.3 Positive and negative results are defined\n3.4 Negative feedbacks are well addressed\nimmediately through appropriate communication\nstrategies\n\n--- PDF PAGE 33 ---\nTR –Microfinance Technology NC IV\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Product, services\nand programs\nIncludes the following but are not limited to:\n1.1 Financial services\n1.2\nNon-financial services\n2.\nClients\n2.1\nEntrepreneurial poor\n3. Interactive\ncommunication\n3.1 Information is gathered in a courteous and\nprofessional manner\n3.2 Probing skills\n3.3 Skills in effective questioning\n3.4 Consistent service quality for all types of\ncustomers\n3.5 Avoiding controversial issues like politics and\nreligion\n4. Needs\n4.1 Designing clients satisfaction survey instruments\n4.2 Procedure in administering clients satisfaction\nsurvey\n4.3 Processing clients satisfaction survey data\n4.4 Product/service knowledge\n4.5\nKnowledge of programs\n5. Communication\nstrategies\n5.1 One-on-one interaction\n5.2 Group meetings\n\n--- PDF PAGE 34 ---\nTR –Microfinance Technology NC IV\n28\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Received, assessed and responded to client needs\n1.2 Applied organizational quality procedures and\nprocesses in providing quality service\n2. Underpinning\nknowledge and\nattitude\n2.1 Understanding client’s nature, motivation,\nexpectations and needs\n2.2 Knowledge of how to determine client needs and\nexpectations related to the product/services and\nprograms\n2.3 Knowledge of appropriate marketing and promotional\nstrategies\n2.4 Knowledge of designing, administering and\nprocessing clients’ satisfaction survey\n2.5 Knowledge of confidentiality and company standards\nfor obtaining, using and protecting information\nobtained from clients\n2.6 Knowledge of company standards on how to interact\nwith clients\n2.7 Knowledge of organization’s vision, mission and\nvalues\n2.8 Commitment/dedication, love of work, competence,\ncourteous, honesty, sincerity, sensitivity to others,\nsense of responsibility, caring attitude/compassion,\nand charity\n3. Underpinning skills\n3.1 Effective oral communication skills\n3.2 Listening skills\n3.3 Motivational skills\n3.4 Interpersonal skills\n3.5 Presentation skills\n3.6 Skill in demonstrating cost/benefits/value to clients\nbased on client’s expectations and needs\n3.7 Skill in generating several alternative solutions that\nwill meet customer’s needs\n3.8 Data gathering skills\n3.9 Computer literacy\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Meeting venue/s\n4.2 Equipment and furnishings appropriate to a\nmicrofinance set-up\n\n--- PDF PAGE 35 ---\nTR –Microfinance Technology NC IV\n29\n4.3 Complete information on products, services and\nprograms\n4.4 Products, services and programs brochures\n4.5 Organization’s standard forms for clients\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Oral questioning\n5.2 Written test\n5.3 Practical demonstration\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 36 ---\nTR –Microfinance Technology NC IV\n30\nUNIT OF COMPETENCY : COMPLY WITH QUALITY AND ETHICAL STANDARDS\nUNIT CODE\n:"
