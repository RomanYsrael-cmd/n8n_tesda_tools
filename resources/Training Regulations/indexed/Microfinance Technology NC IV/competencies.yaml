        "source_title": "COLLECT, ANALYZE AND ORGANIZE INFORMATION",
        "source_text": "--- PDF PAGE 20 ---\nTR –Microfinance Technology NC IV  \n14\nUNIT OF COMPETENCY   :    COLLECT, ANALYZE AND ORGANIZE   \nINFORMATION \nUNIT CODE                        :    500311118 \nUNIT DESCRIPTOR           :   This unit covers the outcomes required to process, \nanalyze, interpret and organize workplace information \nand other relevant data. \n. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Study information \nrequirements  \n1.1 Needs  are identified  using  established \nresearch procedures  \n1.2 Relevant forms and recording systems are used \nto gather the information. \n1.3 Respondents are selected to implement survey / \nresearch based on established procedures. \n2. Process data   \n2.1 Data are collected and collated based on the \nprescribed method. \n2.2 Relevant data are used as references in \naccordance with the objectives of the program. \n2.3 Information is compiled according to the \nrequired form.  \n3. Analyze, interpret and \norganize information \ngathered  \n3.1 Data are analyzed using relevant   \nmethodologies \n3.2 Where applicable, statistical analysis/methods\nare employed  according to the objectives of the \nprogram \n3.3 Graphs and other visual presentations are \nprepared to facilitate analysis / interpretation of \ninformation \n4. Present findings/ \nrecommendations   \n4.1 Findings/recommendations summarized and \npresented/packaged in user-friendly manner \n4.2 Relevant inputs gathered to finalize report  \n4.3 Draft report prepared based on standard format.\n4.4 Technical reports are submitted and \ndisseminated to concerned offices.\n\n--- PDF PAGE 21 ---\nTR –Microfinance Technology NC IV  \n15\nRANGE OF VARIABLES \n \nVARIABLE \nR A N G E \n1. Research procedures \nMay include but are not limited to: \n1.1 TNA \n1.2 Front-end analysis \n1.3 Surveys \n1.4 Interviews \n1.5 Functional analysis \n1.6 DACUM research \n2. Forms  \nMay include but are not limited to: \n2.1 Survey forms/Questionnaires \n2.2 Personal information/Profile \n2.3 Accident report form \n2.4 Requisition slip \n2.5 Job orders \n2.6 Purchase request form \n2.7 Incident report form \n3. Data \n3.1 Raw Data \n4. Information \n4.1 Processed and packaged data \n5. Methodologies \n5.1 Qualitative methods \n5.2 Quantitative methods \n6. Statistical \nanalysis/methods \n6.1 Averages (Mean, Median, Mode) \n6.2 Percentage \n6.3 Ranks \n6.4 Frequency Distribution \n6.5 Statistical test\n\n--- PDF PAGE 22 ---\nTR –Microfinance Technology NC IV  \n16\nEVIDENCE GUIDE \n \n1.  Critical Aspects of  \nCompetency  \n Assessment requires evidence that the candidate \n 1.1 Determined information requirements based on \norganizational goals and objectives.  \n 1.2  Used relevant forms and recording systems to gather data \n 1.3  Processed data based on the objectives of the program \n 1.4  Utilized relevant research methods based on the objective \nof the program \n 1.5  Analyzed and organized information gathered \n 1.6  Submitted/Disseminated technical reports to concerned \noffices \n 2.  Underpinning \nKnowledge  \n2.1 Data processing, Information analysis and interpretation \n2.2 Research methods  \n2.2.1 Qualitative \n2.2.2 Quantitative \n2.2.3 Statistical \n2.3 Report writing \n2.4 Use of relevant software \n2.4.1 Spreadsheets \n2.4.2 Presentation graphics \n2.4.3 Work processor \n2.4.4 Statistical package \n 3. Underpinning Skills 3.1  Communicating effectively \n 3.2  Performing research and analysis \n 3.3  Reading/interpreting data and information \n 3.4  Problem solving  \n 4. Resource \nImplications \n The following resources MUST be provided: \n4.1 Workplace or assessment location \n4.2 Access to office equipment and facilities relevant to the \nunit \n4.3 Case studies/scenarios \n 5. Methods of \nAssessment \n \n Competency may be assessed through: \n 5.1 Written/ Oral Examination \n 5.2 Interviews \n 5.3 Portfolio \n 6.  Context for \nAssessment \n 6.1  Competency may be assessed in actual workplace or \nTESDA Accredited Assessment Center\n",
