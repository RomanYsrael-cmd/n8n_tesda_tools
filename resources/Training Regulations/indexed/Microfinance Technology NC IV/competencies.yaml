        "source_title": "APPLY PROBLEM SOLVING TECHNIQUES IN THE WORKPLACE",
        "source_text": "--- PDF PAGE 16 ---\nTR –Microfinance Technology NC IV  \n10\nUNIT OF COMPETENCY : \nAPPLY PROBLEM SOLVING TECHNIQUES IN THE \nWORKPLACE \nUNIT CODE \n: \n500311117 \nUNIT DESCRIPTOR \n: \nThis competency covers the knowledge, skills and \nattitudes required to apply the process of problem \nsolving and other problems beyond those associated \ndirectly with the process unit.  It includes the \napplication of structured processes and  improvement \ntools.  This competency is typically performed by an \nexperienced technician, team leader or supervisor. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Analyze the problem \n1.1. Issues/concerns are evaluated based on data \ngathered \n1.2. Possible causes of problem are identified within the \narea of responsibility as based on experience and \nthe use of problem solving tools/analytical \ntechniques \n1.3. Possible cause statements are developed based on \nfindings \n2. Identify possible \nsolutions \n2.1 All possible options are considered for resolution of \nthe problem in accordance with occupational \nhealth and safety (OHS) and operating procedures\n2.2 Strengths and weaknesses of possible options are \nconsidered \n2.3 Corrective action is determined to resolve the \nproblem and its possible future causes \n3. Recommend solution \nto higher management \n3.1 Report/communication or documentation are \nprepared \n3.2 Recommendations are presented to appropriate \npersonnel \n3.3 Recommendations are followed-up, if required \n4. Implement solution \n4.1 Measurable objectives are identified \n4.2 Resource needs are identified \n4.3 Timelines are identified in accordance with plan \n5. Evaluate/Monitor \nresults and outcome \n5.1 Processes and improvements are identified based \non evaluative assessment of problem \n5.2 Recommendations are prepared and submitted to \nsuperiors.\n\n--- PDF PAGE 17 ---\nTR –Microfinance Technology NC IV  \n11\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Area of responsibility \nVariables may include but are limited to:  \n1.1. Work environment \n1.2. Problem solution processes  \n1.3. Preventative maintenance and diagnostic \npolicy  \n1.4. Roles and technical responsibilities  \n2. Occupational Health and \nSafety \n2.1. As per company, statutory and vendor \nrequirements. Ergonomic and environmental \nfactors must be considered during the \ndemonstration of this competency. \n3. Communication  \nVariables may include but are not limited to: \n3.1. Written communication can involve both \nhand written and printed material, internal \nmemos, electronic mail, briefing notes and \nbulletin boards. \n4. Documentation \n4.1. Audit trails \n4.2. Naming standards  \n4.3. Version control\n\n--- PDF PAGE 18 ---\nTR –Microfinance Technology NC IV  \n12\nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. \nAnalyzed the problem \n1.2. \nIdentified possible solutions \n1.3. \nImplemented solutions \n1.4. \nRecommended solutions to higher management \n1.5. \nOutcome evaluated/monitored \nEvidence of satisfactory performance in this unit can be \nobtained by observation of performance and questioning to \nindicate knowledge and understanding of the elements of \nthe competency and performance criteria.  \n2. Underpinning \nKnowledge \n2.1. Broad understanding of systems, organizational \nsystems and functions \n2.2. Broad knowledge of help desk and maintenance \npractices \n2.3. Current industry accepted hardware and software \nproducts with broad and detailed knowledge of its \ngeneral features and capabilities  \n2.4. Broad knowledge of the operating system \n2.5. Broad knowledge of the client business domain \n2.6. Broad knowledge based incorporating current industry \npractices related to escalation procedures \n2.7. Broad knowledge based of diagnostic tools \n2.8. General principles of OHS \n2.9. Divisional/unit responsibilities \n3. Underpinning \nSkills \n3.1. Decision making within a limited range of options. \n3.2. Communication is clear, precise and varies according \nto the type of audience \n3.3. Teamwork in reference to personal responsibility \n3.4. Time management as applied to self-management \n3.5. Analytical skills in relation to routine malfunctions \n3.6. General customer service skills displayed \n3.7. Questioning and active listening is employed to clarify \ngeneral information \n3.8. Applying OHS practices\n\n--- PDF PAGE 19 ---\nTR –Microfinance Technology NC IV  \n13\n4. Resource \nImplications \n4.1. Assessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a range \nof situations. A bank of scenarios/case studies/what ifs \nwill be required as well as bank of questions which will \nbe used to probe the reasoning behind the observable \nactions. \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. Through direct observation of application to tasks and \nquestions related to underpinning knowledge \nUnder general guidance, checking various stages of \noperation and at the completion of the activity against \nperformance criteria and specifications \n6. Context for \nAssessment \n6.1. Competency may be assessed in the work place or in \na simulated work place setting \n6.2. Assessment shall be carried out through TESDA’s \nAccredited Assessment Centers/Venues while tasks \nare undertaken either individually or as part of a team \nunder limited supervision\n",
