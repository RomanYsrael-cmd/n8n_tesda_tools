e, Reuse & Recycle\n 2.11 Sanitary Code\n2.12 Environmental Code of practice\n2. Underpinning Skills\n3.1 Communicating effectively\n3.2 Performing research and analysis\n3.3 Reading/interpreting data and information\n3.4 Solving environmental protection related problems\n3.5 Applying good housekeeping/5S practices\n3.6 Observing 3Rs in the workplace\n3. Resource\nImplications\n The following resources MUST be provided:\n4.1 Workplace/Assessment location\n4.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n4.3 Case studies/scenarios relating to environmental\nprotection\n\n--- PDF PAGE 31 ---\nTR –Microfinance Technology NC IV\n25\n4. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Written/ Oral Examination\n5.2 Interview/Third Party Reports\n5.3 Portfolio (citations/awards from GOs and NGOs, certificate\nof training – local and abroad)\n 5.4 Simulations and role-plays\n5. Context for\nAssessment\n6.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 32 ---\nTR –Microfinance Technology NC IV\n26\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: PROVIDE QUALITY CUSTOMER SERVICE\nUNIT CODE\n : HCS421201\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skill and attitudes required to\nprovide effective and efficient services to the clients of the\nmicrofinance industry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Update knowledge\nof products and\nservices\n1.1 Products and/or services to be marketed are\nidentified, familiarized with and fully understood\n1.2 Information on programs is accessed\n1.3 Knowledge on products, services and programs\nare updated\n1.4 Additional information on products, services and\nprograms are prepared\n2. Assess needs of\nnew and existing\nclients\n2.1 Active listening is used to gather information from\nclients\n2.2 Provided clients with courteous and professional\ntreatment throughout the interaction using\ninteractive communication\n2.3 Inquiries, concerns and comments are responded\nto promptly and accurately in accordance with\norganization’s policies\n2.4 Recorded all the gathered information given by the\nclients\n2.5 Identified related or applicable needs of clients\nbased on the products/services and program being\noffered\n2.6 Orientation on products/services, program and\npolicies are conducted\n3. Conduct client\nsatisfaction survey\n3.1 Client satisfaction survey is administered\n3.2 Survey results are collated and analyzed\n3.3 Positive and negative results are defined\n3.4 Negative feedbacks are well addressed\nimmediately through appropriate communication\nstrategies\n\n--- PDF PAGE 33 ---\nTR –Microfinance Technology NC IV\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Product, services\nand programs\nIncludes the following but are not limited to:\n1.1 Financial services\n1.2\nNon-financial services\n2.\nClients\n2.1\nEntrepreneurial poor\n3. Interactive\ncommunication\n3.1 Information is gathered in a courteous and\nprofessional manner\n3.2 Probing skills\n3.3 Skills in effective questioning\n3.4 Consistent service quality for all types of\ncustomers\n3.5 Avoiding controversial issues like politics and\nreligion\n4. Needs\n4.1 Designing clients satisfaction survey instruments\n4.2 Procedure in administering clients satisfaction\nsurvey\n4.3 Processing clients satisfaction survey data\n4.4 Product/service knowledge\n4.5\nKnowledge of programs\n5. Communication\nstrategies\n5.1 One-on-one interaction\n5.2 Group meetings\n\n--- PDF PAGE 34 ---\nTR –Microfinance Technology NC IV\n28\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Received, assessed and responded to client needs\n1.2 Applied organizational quality procedures and\nprocesses in providing quality service\n2. Underpinning\nknowledge and\nattitude\n2.1 Understanding client’s nature, motivation,\nexpectations and needs\n2.2 Knowledge of how to determine client needs and\nexpectations related to the product/services and\nprograms\n2.3 Knowledge of appropriate marketing and promotional\nstrategies\n2.4 Knowledge of designing, administering and\nprocessing clients’ satisfaction survey\n2.5 Knowledge of confidentiality and company standards\nfor obtaining, using and protecting information\nobtained from clients\n2.6 Knowledge of company standards on how to interact\nwith clients\n2.7 Knowledge of organization’s vision, mission and\nvalues\n2.8 Commitment/dedication, love of work, competence,\ncourteous, honesty, sincerity, sensitivity to others,\nsense of responsibility, caring attitude/compassion,\nand charity\n3. Underpinning skills\n3.1 Effective oral communication skills\n3.2 Listening skills\n3.3 Motivational skills\n3.4 Interpersonal skills\n3.5 Presentation skills\n3.6 Skill in demonstrating cost/benefits/value to clients\nbased on client’s expectations and needs\n3.7 Skill in generating several alternative solutions that\nwill meet customer’s needs\n3.8 Data gathering skills\n3.9 Computer literacy\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Meeting venue/s\n4.2 Equipment and furnishings appropriate to a\nmicrofinance set-up\n\n--- PDF PAGE 35 ---\nTR –Microfinance Technology NC IV\n29\n4.3 Complete information on products, services and\nprograms\n4.4 Products, services and programs brochures\n4.5 Organization’s standard forms for clients\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Oral questioning\n5.2 Written test\n5.3 Practical demonstration\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or\nin a simulated workplace environment\n\n--- PDF PAGE 36 ---\nTR –Microfinance Technology NC IV\n30\nUNIT OF COMPETENCY : COMPLY WITH QUALITY AND ETHICAL STANDARDS\nUNIT CODE\n: HCS315202\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes needed to\napply quality and ethical standards in the workplace. The\nunit also includes the application of relevant safety\nprocedures and regulations, organization procedures, client\nand industry requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess\nquality of\nreceived\nmaterials\n1.1 Work instruction is obtained and carried out in accordance with\nstandard operating procedures\n1.2 Received materials are checked against workplace standards and\nspecifications\n1.3 Defective materials are identified, reported and isolated\n1.4 Defective materials are repaired/replaced in accordance with\nworkplace procedures\n1.5 Defects and any identified causes are recorded and/or reported to\nthe concerned personnel in accordance with workplace procedures\n2. Assess own\nwork/output\n2.1 Documentation relative to quality within the company is identified\nand used\n2.2 Completed work is checked against workplace standards\n2.3 Defects are identified and corrected in accordance with the\ncompany quality standards\n3. Submit\noneself to\nthird party\nassessment\n3.1 Information on the quality and other indicators of performance are\nrecorded in accordance with workplace procedures\n3.2 In cases of deviations from specific quality standards, causes are\ndocumented and reported in accordance with the workplace’s\nstandards operating procedures\n3.3 In cases of objections/disagreements, reasons are expressed thru\nwritten documentation\n3.4 Settlements are sought in accordance with company policies\n4. Engage in\nquality\nimprovement\n4.1 Process improvement procedures are participated in relative to\nworkplace assignment\n4.2 Work is carried out in accordance with process improvement\nprocedures\n4.3 Services are delivered in accordance with ethical standards\n4.4 Quality service is monitored to ensure client satisfaction\n4.5 Client’s needs are assessed through conduct of researches, focus\ngroup discussions, and satisfaction surveys/interviews\n4.6 Trainings, orientations, and exposures are rendered to ensure their\nunderstanding/ familiarization on products, services and programs\n\n--- PDF PAGE 37 ---\nTR –Microfinance Technology NC IV\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMaterials may include but are not limited to:\n1.1 Manuals, brochures, flyers, flipcharts, signages\nand tarpaulin\n1.2 Work orders\n1.3 Standard forms\n1.4 Recorded voice files/audio video presentations\n1.5 PowerPoint presentation materials\n1.6 Documentations\n1.7 Software\n1.8 Hardware\n1.9 Office supplies\n1.10 Office equipment\n1.11 Holy Scriptures\n2. Defects\nDefects may include but are not limited to:\n2.1 Deviation from the requirements of the client\n2.2 Deviation from the requirements and standard\noperating procedures of the organization/institution\n2.3 Manuals containing incorrect/outdated information\n2.4 Software/hardware defects\n2.5 Poor employee interpersonal relationships/conflicts\namong employees\n2.6 Loose implementation of organizational policies\nand procedures\n2.7 Poor/inappropriate training designs\n2.8 Non-compliance of selection and recruitment\nprocedures of employees\n2.9 Work fatigue and lost of interest to work being\nexperience by the employee/s\n2.10 Lack of clear understanding about one’s role and\nresponsibilities\n2.11 Non-compliance of selection and recruitment\nprocedures of clients\n2.12 Undesirable work behavior of employees\n2.13 Breakdown of/barriers to communication\n2.14 Outdated work plans and schedules\n3. Documentation\nIncludes the following but are not limited to:\n\n--- PDF PAGE 38 ---\nTR –Microfinance Technology NC IV\n32\nVARIABLE\nRANGE\n3.1 Standard Operating Procedures\n3.2 Quality checklist\n3.3 Monitoring feedback sheet\n3.4 Forms such as Loan Applications, CCI/BI, Cash\nFlows, Loan Utilization Checks, Client\nExits/Withdrawals, Work/Job Order, Client\nFeedback Notice, Material Requisition Form,\nPerformance Appraisal Report, Training Evaluation\nForms\n3.5 Reports such as Financial Statements, Operational\nAssessments/Highlights and Plans, Cash Position\nReports\n3.6 Minutes of meetings (Board, Branch,\nDepartment/Units/Groups)\n3.7 Special orders, memorandums, notices,\nannouncements\n3.8 Employee movements (promotion, demotion,\ndischarge, termination, suspension)\n3.9 Linkages such as Loan Verification, SSS and\nPhilhealth dues.\n3.10 Organizational Profile (Vision, Mission, Goals and\nObjectives)\n3.11 Electronic documentations e.g. Website\n3.12 Files/Employees’ Profile\n4. Quality standards\nQuality standards may be related but are not limited to\nthe following:\n4.1 Materials\n4.2 Software\n4.3 Office supplies\n4.4 Office facilities\n4.5 Office equipment\n4.6 Office standard forms\n4.7 Work processes\n4.8 Customer service\n4.9 Products and services\n4.10 Work outputs\n4.11 Communication process\n4.12 Ethical and professional ethics\n4.13 Training program design and delivery\n4.14 Value added services/product innovations\n\n--- PDF PAGE 39 ---\nTR –Microfinance Technology NC IV\n33\nVARIABLE\nRANGE\n4.15 Organization’s policies and procedures manual\n5. Client\nIncludes the following but are not limited to:\n5.1 External clients (customer, partners, members,\nsubscribers, end users, investors/funders, service\nproviders, agencies)\n5.2 Internal clients (within the organization/co-\nemployees, immediate superiors, board of\ntrustees)\n\n--- PDF PAGE 40 ---\nTR –Microfinance Technology NC IV\n34\nEVIDENCE GUIDE\n\n1.\nCritical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed work in accordance with the organization’s standard\noperating procedures and specifications\n1.2 Identified and reported defects in accordance with standard\noperating procedures\n1.3 Carried out work in accordance with the process improvement\nprocedures\n2.\nUnderpinning\nknowledge\nand attitude\n2.1 Knowledge of organization’s vision, mission and values\n2.2 Knowledge of product, services and programs\n2.3 Operational standards and procedures\n2.4 Quality checking procedures\n2.5 Workplace procedures\n2.6 Occupational health and safety procedures\n2.7 Characteristics of hardware, software and materials used in\nrendering quality service\n2.8 Defect/irregularities identification and reporting\n2.9 Quality improvement processes\n2.10 Quality consciousness\n2.11 Values orientation\n2.12 Market-driven/client-focused\n3. Underpinning\nskills\n3.1 Comprehension skills\n3.2 Communication skills\n3.3 Critical thinking, problem solving and decision-making skills\n3.4 Technical skills\n3.5 Interpersonal skills\n3.6 Community organizing skills\n3.7 Analytical skills\n3.8 Quantitative skills\n3.9 Qualitative skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Product manuals and brochures\n4.2 Marketing and promotional materials\n4.3 Orientation and presentation materials\n4.4 Office standard forms and documentation\n4.5 Operational handbook/manuals\n4.6 Work plans and schedules\n\n--- PDF PAGE 41 ---\nTR –Microfinance Technology NC IV\n35\n4.7 Hardware\n4.8 Software\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written examination\n5.2 Interviews\n5.3 Audit report\n5.4 Monthly reports\n5.5 Practical demonstration\n5.6 Performance evaluation\n6. Context for\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 42 ---\nTR –Microfinance Technology NC IV\n36\n UNIT OF COMPETENCY :\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n\n : HCS311201\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and\nattitudes needed to perform computer operations\nwhich include encoding, accessing, decoding,\ntransferring and storing data and information\nusing the appropriate hardware and software.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\nassigned task\n1.1 Tasks are determined according to required output\n1.2 Appropriate hardware and software are selected\n1.3 OHS standards are complied with appropriate\nguidelines and procedures are identified\n1.4\nRequired data security guidelines are determined\n2. Encode data\n2.1 Accuracy of data/information is validated\n2.2 Data are encoded using appropriate application\n2.3 Information is saved in storage devices according to\nrequirements\n2.4\nWork is performed within OHS guidelines\n3. Access information\n\n3.1 Appropriate application is selected based on job\nrequirements\n3.2 Proper use of navigation keys and icons is observed\n3.3 Proper use of computer and other peripherals is\nobserved\n4. Produce data\n4.1 Processed data using appropriate applications by\nauthorized personnel\n4.2 Data are printed according to standard operating\nprocedures\n4.3 Data are analyzed\n4.4 Files and data are transferred according to standard\noperating procedures\n4.5\nFiles and data are securely stored\n5. Use the internet to\naccess information\n5.1 Required information is identified\n5.2 Appropriate browser and search engine are used in\naccordance with the organization’s standards and\nprocedures\n5.3\nRelevant links are utilized to access information\n6. Maintain computer\nequipment and\nsystems\n6.1 Procedures for system security such as virus check,\ndata back-up, and system defragmentation are\nimplemented\n6.2 Appropriate basic equipment maintenance\nprocedures and Management Information System\nrequirements are implemented\n\n--- PDF PAGE 43 ---\nTR –Microfinance Technology NC IV\n37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware\nHardware includes the following but are not limited to:\n1.1 Computer set-up\n1.2 Network systems\n1.3 Communication equipment\n1.4 Printer and scanner\n1.5 Built-in cameras\n1.6 Multimedia projector\n2. Software\nSoftware includes the following but are not limited to :\n2.1 Microsoft Office applications\n2.2 Database applications\n2.3 Web browser\n2.4 Client specific software\n3. Storage devices\nStorage devices include the following but are not limited\nto :\n3.1 Diskettes\n3.2 Zip disks\n3.3 Local and remote hard disk drives\n3.4 Optical drives (CDs)\n3.5 USB flash drives\n4. OHS guidelines\n4.1 Types of equipment used\n4.2 Ergonomic furniture\n4.3 Radiation barrier for monitors\n4.4 Sitting posture\n4.5 Lifting posture\n5. Basic equipment\nmaintenance\n6.1 Conducting file management\n6.2 Updating of applications\n6.3 Storing back up files\n6.4 Maintaining equipment cleanliness\n6.5 Security system/password\n6. Management\nInformation System\n7.1 Authorized IT security officer\n7.2 Updating of programs/systems\n\n--- PDF PAGE 44 ---\nTR –Microfinance Technology NC IV\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate has:\n1.1 Used appropriate hardware\n1.2 Used appropriate software applications\n1.3 Processed required data\n1.4 Maintained security measures, e.g., passwords\n1.5 Practiced troubleshooting procedures\n1.6 Applied basic computer maintenance activities\n2. Underpinning\nknowledge and\nattitude\n2.1 Basic fundamentals for computer use\n2.2 Basic knowledge of computer system\n2.3 Basics of computer operating system\n2.4 Categories of storage devices and memories\n2.5 Types and uses of software applications\n2.6 Intellectual property rights\n2.7 Virus information, detection and elimination\n2.8 OHS principles and practices\n2.9 Concern for details in accordance with\norganization’s guidelines\n2.10 Patience in handling challenging/difficult tasks\n2.11 Quality consciousness\n2.13 Safety consciousness\n3. Underpinning skills\n3.1 Computer keyboarding skills\n3.2 Internet browsing/networking skills\n3.3 Skill in English grammar\n3.4 Basic computer software and hardware\nmaintenance/troubleshooting skills\n3.5 Analytical skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Computer hardware and peripherals\n4.2 Appropriate software applications\n4.3 Computer printer/scanner ink\n4.4 Stationeries\n4.5 CDs, DVDs and USBs\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Direct observation\n5.2 Oral questioning\n\n--- PDF PAGE 45 ---\nTR –Microfinance Technology NC IV\n39\n5.3 Written test\n5.4 Practical demonstration\n5.5 Work outputs\n6. Context for\nassessment\n6.1 The Assessment may be conducted in the\nworkplace or in a simulated workplace environment\n\n--- PDF PAGE 46 ---\nTR –Microfinance Technology NC IV\n40\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nSUPERVISE MFI LOAN OFFICERS\nUNIT CODE\n\n:\nHCS341301\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skill and\nattitudes required in the supervision of loan officers in\ntheir implementation of microfinance programs, policies\nand\nprocedures.\nThis\nfurther\nmeasures\nthe\nperformance of the team leader/supervisor in carrying\nout their tasks as supervisor.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Oversee field\noperations\nand other\nservices\n\n1.1 Formation of groups/center and center meeting is checked,\nmonitored and provided with feedback to optimize provision of\nservices and benefits based on the standard operating\nprocedures\n1.2 Coaching/Assistance is provided to loan officers in the conduct of\narea mapping/scanning to ensure quality of target area and\nclient’s selection based on the standard operating procedures;\nand promoting products and services\n1.3 Monthly and weekly targets/schedules are prepared/provided to\nloan officers in accordance with MFI annual and area targets\n1.4 On-the-spot/surprise checks/audits of loan officers’ accounts are\nmade in accordance with MFI internal control policy\n1.5 Conflicts between loan officer and clients are settled and handled\nin accordance with MFI conflict resolution strategies\n1.6 Tasks of immediate superior/subordinates are carried out\n during their absence in accordance with MFI standard\n operating procedures\n1.6 Good interpersonal relationships are established and maintained\nwith loan officers and clients based on company core values\n2. Check loan\nofficer’s\nprocessing of\nclients’ loans\n2.1 Clients’ loan application documents are validated against\nMIS/source of information\n2.2 Recommendations of loan officers are referred to the appropriate\ncommittee or level of authority for final decision based on loan\napproval matrix\n2.3 Loan applications are recommended for appropriate action in\naccordance with MFI policies and procedures\n3. Oversee\nregular and\nspecial events\nfor loan officer\nand clients\n\n3.1 Regular and special events are organized and facilitated in\naccordance with MFI schedule of activities\n3.2 Event plan and personnel assignments and responsibilities are\nidentified and assigned based on event objectives\n3.3 Information on event is disseminated to clients in coordination\nwith loan officers and staff concerned\n3.4 Conduct of event/activity is overseen in coordination with loan\nofficers, clients and partners\n\n--- PDF PAGE 47 ---\nTR –Microfinance Technology NC IV\n41\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3.5 Activity is evaluated/assessed and documented and reported to\nimmediate superior in accordance with MFI standard operating\nprocedures\n4. Deal with\ndelinquent\naccounts\n4.1 Delinquent accounts are monitored, validated/analyzed and\nreasons of delinquency are confirmed based on MFI policies and\nprocedures\n4.2 Delinquent payment options are presented to the delinquent\nclients and restorative actions are implemented based on MFI\npolicies and guidelines\n4.3 Plan of action is formulated and implemented in compliance with\nMFI policies and guidelines\n4.4 When necessary, delinquent account is referred to legal officer\nfor appropriate action based on MFI policies and procedures\n\n--- PDF PAGE 48 ---\nTR –Microfinance Technology NC IV\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Groups/center\n1.1 Validation/verification of group compositions and their\nqualifications\n1.2 Conduct of unannounced field visits\n2. Area mapping/\nscanning\nMay include:\n2.1 Coordination with the concerned local government units and\noffices\n2.2 Review of barangay profiles, surveys and reports\n2.3 Approval/recommendations for expansion by loan officers\n3. Products and\nservices\nMay include:\n3.1 Financial Services (such as Loan Programs)\n3.2 Non-financial services (such as technical skills training,\nlivelihood programs, health and education, environmental\nadvocacies)\n4. Targets\nMay include:\n4.1 Review of previous schedules\n4.2 Gathering and checking of plan of activities submitted by\nloan officers\n4.3 Posting of weekly activity schedules\n4.4 Monitoring of the scheduled activities\n5. Regular and\nspecial events\n5.1 Introduction of new products and services\n5.2 Christmas programs\n5.3 Anniversary\n5.4 General assembly\n5.5 Awarding and recognition\n6. Delinquent\naccounts\n6.1 Missed payments to organization\n6.2 Remedied payments (abono)\n6.3 Non-compliance with pledge/agreements/internal policy on\npayments\n7. Delinquent\npayment options\n7.1 Deferred payment\n7.2 Debt Restructuring\n7.3 Refinancing\n7.4 Group accountability payment\n8. Restorative actions\n8.1 Home visitation\n8.2 Meetings\n8.3 Special program\n8.4 Counseling and motivation\n\n--- PDF PAGE 49 ---\nTR –Microfinance Technology NC IV\n43\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to oversee field operations and other\nservices\n1.2 Assisted loan officers in conducting area mapping/scanning\n1.3 Validated clients’ loan application documents against\nMIS/source of information\n1.4 Evaluated recommendations of Loan Officer’s in processing\nclient’s loan for referral to the appropriate committee or level of\nauthority\n1.5 Demonstrated ability to oversee regular and special events for\nloan officers and clients\n1.6 Checked and validated/analyzed delinquent accounts\n1.7 Dealt with delinquent accounts\n1.8 Demonstrated good interpersonal relationships with loan\nofficers and clients based on company core values\n2. Underpinning\nknowledge and\nattitude\n2.1 MFI Mission, Vision and Core values\n2.2 MFI strategic directions and operational plans\n2.3 MFI’s standard operating procedures and policies relating to:\na. area selection\nb. group/center formation\nc. loan application processing\nd. group/center meetings\ne. conflict management\n2.4\nMicrofinance products and services\n2.5\nClients’ loans application processing\n2.6\nMFI record keeping procedures\n2.7\nMFI internal control procedures\n2.8\nCommunication process and practices\n2.9\nBusiness correspondence\n2.10 Supervisory theory and principles\n2.11 Supervisory functions\n2.12 Teambuilding principles and practices\n2.13 Event program plan details\n2.14 Event evaluation and documentation procedures\n2.15 Memo and report writing\n2.16 Counseling principles and practices\n2.17 Delinquency management\n2.18 Internal control procedures\n\n--- PDF PAGE 50 ---\nTR –Microfinance Technology NC IV\n44\n2.19 Work values and ethics:\na. Patience\nb. Friendly, firm and fair\nc. Transparent\nd. Attention to details\ne. Team player\nf. Resourcefulness\n3. Underpinning\nskills\n3.1 Supervisory skills\n3.2 Communication skills\n3.3 Interpersonal relationships\n3.4 Community organizing\n3.5 Motivational skills\n3.6 Accounting skills\n3.7 Analytical skills\n3.8 Conflict resolution\n3.9 Counseling/guiding skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area (simulated or actual)\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Relevant workplace procedures, codes, standards, manuals\nand reference materials\n4.4 MFI policies and procedures\n4.5 MFI Operation manual\n4.6 Evaluation forms\n4.7 Case problem\n4.8 Loan documents\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Interview\n5.2 Written report\n5.3 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 51 ---\nTR –Microfinance Technology NC IV\n45\nUNIT OF COMPETENCY : OVERSEE IMPLEMENTATION OF MICROFINANCE\nPRODUCTS AND SERVICES\nUNIT CODE\n:\nHCS341302\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills\nand attitudes required in overseeing loan officers and\nmonitoring\ntheir\nimplementation\nof\nmicrofinance\nproducts and services to clients based on policies and\nprocedures.\nThis\nmeasures\nthe\nteam\nleader/supervisor’s role in loan applications and\nmonitoring of the implementation of products and\nservices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Check and\nreview/validate\nloan\napplications\n1.1 Completeness of loan documents/requirements is checked\nbased on MFI loan applications checklist and procedures\n1.2 Reviewed loan applications are verified/validated against\nMIS/records\n2. Facilitate\nappraisal of\nloan\napplications\n\n2.1 Evaluated loan recommendation result is referred to appropriate\ncommittee or level of authority for final decision\n2.2 Loan applications of clients are recommended for\napproval/disapproval in accordance with MFI standard operating\nprocedures and guidelines\n2.3 Documents are processed in accordance with MFI standard\noperating procedures\n3. Monitor loan\nutilization\n\n3.1 On-the-spot client visits are conducted according to MFI policies\nand standard operating procedures\n3.2 Accomplished Loan Utilization Check (LUC) forms and\nattachments are randomly checked against the project proposal\n4. Monitor\nimplementation\nof other\nproducts and\nservices\n4.1 Client insurance, mandatory savings and withdrawals are\nmonitored and verified simultaneously with loan payment based\non loan payment matrix\n4.2 Corrective actions are made in cases of non-compliance or\ndeviation of loan officer/s from target in accordance with the MFI\npolicies and standard operating procedures\n4.3 Work plan is formulated to motivate clients to increase savings\nin accordance with the MFI overall work plan\n4.4 Business development assistance is provided and promoted\nto clients based on client’s needs and market situation\n5. Communicate\nmanagement’s\nplans and\ndecisions\n4.1 Management plans and decisions are discussed with concerned\npersonnel in accordance with MFI policies and procedures\n4.2 Communication process is effectively carried out using\nappropriate media/channels\n\n--- PDF PAGE 52 ---\nTR –Microfinance Technology NC IV\n46\nRANGE OF VARIABLES\nVARIABLE\nSCOPE\n1. Loan\ndocuments/\nrequirements\n1.1 Loan application form\n1.2 CI Results\n1.3 Business proposal or business plan, etc.\n2. Appropriate\ncommittee or\nlevel of authority\n2.1 For individual accountability\n2.2 For group lending arrangements\n2.3 For higher loan brackets\n3. Corrective\nactions\n3.1 Counseling\n3.2 Verbal/Written Reprimand\n3.3 Retraining of loan officer\n3.4 Change of assignment\n3.5 Resignation/Termination\n4. Business\ndevelopment\nassistance\n4.1 Conduct of training programs\n4.2 Networking with agencies/other institutions\n4.3 Business and entrepreneurial advisory services\n4.4 Recommendation for product development and packaging\n\n--- PDF PAGE 53 ---\nTR –Microfinance Technology NC IV\n47\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Checked completeness of loan applications\n1.2 Verified/validated loan applications\n1.3 Checked loan utilization\n1.4 Led the team in the implementation of microfinance products\nand services\n1.5 Monitored and verified implementation of products and\nservices and utilization of resources\n1.6 Reviewed, analyzed and consolidated periodic reports from\nloan officers\n1.7 Reviewed and evaluated implementation of Microfinance\nproducts and services\n1.8 Communicated management’s plans and decisions\n1.9 Ensured adherence of loan officers on company policies and\nprocedures\n2. Underpinning\nknowledge and\nattitudes\n2.1 Microfinance products and services\n2.2 Microfinance policies and standard operating procedures\n2.3 Structure of MFI\n2.4 Mission, Vision and Core values of MFI\n2.5 Strategic directions and operational plans\n2.6 Recordkeeping and internal control procedures\n2.7 Loan application process\n2.8 Loan application form and attachments\n2.9 Loan application verification procedures\n2.10 Cash flow analysis\n2.11 Types of corrective actions for cases of loan officer’s non-\ncompliance\n2.12 Communication process and media\n2.13 Timely and reliable dissemination of information\n2.14 Career development plan\n2.15 Loan utilization policies and practices\n2.16 Customer service\n2.17 Work values and ethics:\na. Patience in dealing with subordinates and clients\nb. Friendly, firm and fair\nc. Transparent\nd. Attention to details\ne. Team player\n\n--- PDF PAGE 54 ---\nTR –Microfinance Technology NC IV\n48\nf. Resourcefulness\ng. Discipline in implementing plans/programs\n3. Underpinning skills\n3.1 Supervisory skills\n3.2 Communication skills\n3.3 Interpersonal relationships\n3.4 Community organizing\n3.5 Motivational skills\n3.6 Accounting skills\n3.7 Analytical skills\n3.8 Conflict resolution\n3.9 Networking skills\n3.10 Skills in customer service\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area (simulated or actual)\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Relevant workplace procedures, codes, standards, manuals\nand reference materials\n4.4 MFI policies, procedures and guidelines\n4.5 MFI Operation manual\n4.6 Evaluation forms\n4.7 Case problem\n4.8 Loan documents\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Interview\n5.2 Written report\n5.3 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 55 ---\nTR –Microfinance Technology NC IV\n49\nUNIT OF COMPETENCY\n: MONITOR PROGRESS OF WORKPLAN\nIMPLEMENTATION\nUNIT CODE\n\n: HCS341303\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills\nand attitude required to monitor the progress of work\nplan implementation in the microfinance workplace\nsetting. This measure the team leader/supervisor’s role\nin monitoring the loan officer’s implementation of the\nworkplan based on targets and outputs.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Check budget\nallocation for loan\nreleases\n1.1 Cash position is checked/monitored based on bank statement\naccounting report and monthly target releases\n1.2 Fund transfer is requested from head office in case of\ninsufficiency of funds in accordance to MFI policies and\nprocedures\n1.3 Loan documents are reviewed/verified for budget allocation\nin accordance with MFI policies and procedures\n1.4 On-time loan release is ensured based on standard schedule\nset by the MFI\n2. Monitor\nsubordinates’\nadherence to work\nplan\n2.1 Increased awareness of subordinates’ performance target is\nensured or maintained based on set target\n2.2 Subordinates’ output is reviewed/compared with the set target\nusing appropriate monitoring tools\n2.3 Problems and difficulties are analyzed using appropriate\nanalytical methods\n2.4 Targets vs. outputs are discussed during team meetings using\neffective communication skills\n2.5 Corrective actions in the workplan are agreed and implemented\nin accordance with MFI policies and procedures\n3. Submit\nrecommendations\nfor work plan\nimprovement\n3.1 Consultation is made with loan officers, clients and\nstakeholders to gather data for plan modification requiring\nhigher level management decision based on MFI policies and\nprocedures\n3.2 Recommendation are formulated and submitted to immediate\nsuperior based on MFI policies and procedures\n3.3 Options are identified based on the validated data\n\n--- PDF PAGE 56 ---\nTR –Microfinance Technology NC IV\n50\nRANGE OF VARIABLES\n\nVARIABLE\nSCOPE\n1. Insufficiency of\nfunds\nMay include-\n1.1 Deviation from cash flow projection\n1.2 Adjustments made on targets and work plan\n1.3 Low collection of loan dues and savings\n1.4 Disaster and emergency situation\n2. Loan documents\nMay include-\n2.1 Loan disbursement master roll\n2.2 Loan application\n2.3 Weekly projection\n2.4 Weekly cash position report\n2.5 Photocopy of passbook\n3. Monitoring tools\n3.1 Shadowing\n3.2 Field visit\n3.3 Feedback gathering from clients (e.g. Mystery shopping,\ninterview, focused group discussion, survey forms)\n3.4 Performance appraisal\n3.5 Review of documents submitted by loan officer (e.g.\ncollection reports, aging report\n4. Analytical methods\n4.1 SWOT (Strength, Weakness, Opportunity, Threat)\n4.2 Force field analysis (Driving forces, Restraining forces)\n4.3 Fish bone\n4.4 5 Whys\n4.5 5 Ms of management (Man, Money, Machines, Methods,\nMaterials)\n4.6 7S (Strategy, Structure, Systems, Shared values, Skills , Style\nand Staff)\n4.7 Process mapping\n4.8 Gap analysis\n5. Targets\nMay include:\n5.1 Loan Portfolio (e.g., loan disbursement)\n5.2 Outreach\n5.3 Repayment Rate\n6. Recommendation\n6.1 Counseling\n6.2 Coaching/Mentoring\n\n--- PDF PAGE 57 ---\nTR –Microfinance Technology NC IV\n51\nVARIABLE\nSCOPE\n6.3 Retooling/retraining\n6.4 Change of assignments\n6.5 Adjustments in targets\n6.6 Resignation/Termination\n6.7 Policy, product, area and process review\n6.8 Review of marketing strategy\n6.9 Modification of target clients and loan portfolio\n\n--- PDF PAGE 58 ---\nTR –Microfinance Technology NC IV\n52\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Checked budget allocation for loan releases\n1.2 Monitored subordinates adherence 