        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Set objectives\n1.2. Planned and scheduled work activities\n1.3. Implemented work plans\n1.4. Monitored work activities\n1.5. Reviewed and evaluated work plans and activities\n2. Underpinning\nKnowledge\n2.1. Organization’s strategic plan, policies rules and\nregulations, laws and objectives for work unit activities\nand priorities\n2.2. Organizations policies, strategic plans, guidelines\nrelated to the role of the work unit\n2.3. Team work and consultation strategies\n3. Underpinning\nSkills\n3.1. Planning\n3.2. Leading\n3.3. Organizing\n3.4. Coordinating\n3.5. Communication Skills\n3.6. Inter-and intra-person/motivation skills\n3.7. Presentation skills\n4. Resource\nImplications\nThe following resources MUST be provided\n4.1. Tools, equipment and facilities appropriate to the\nproposed activities\n4.2. Materials relevant to the proposed activities\n4.3. Work plan schedules\n4.4. Drawings, sketches or blueprint\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observation/questioning\n5.2. Practical exercises on Planning and Scheduling Work\nActivities\n5.3. Third\nParty\nReport\n(collection\nof\ncompetency\nevidence)\n6. Context for\nAssessment\n6.1. Competency may be assessed in the workplace or in\nsimulated work\n\n--- PDF PAGE 28 ---\nTR –Microfinance Technology NC IV\n22\nUNIT OF COMPETENCY : PROMOTE ENVIRONMENTAL PROTECTION\nUNIT CODE :"
        },
        "source_text": "500311119\nUNIT DESCRIPTOR\n :\nThis unit covers the outcomes required in planning\nand organizing work. It may be applied to a small\nindependent operation or to a section of a large\norganization.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSet objectives\n1.1 Objectives are consistent with and linked to work\nactivities in accordance with organizational aims\n1.2 Objectives are stated as measurable targets with\nclear time frames\n1.3 Support and commitment of team members are\nreflected in the objectives\n1.4 Realistic and attainable objectives are identified\n2.\nPlan and schedule\nwork activities\n2.1 Tasks/work activities to be completed are\nidentified and prioritized as directed\n2.2 Tasks/work activities are broken down into steps\nin accordance with set time frames achievable\ncomponents in accordance with set time frames\n2.3 Resources are allocated as per requirements of\nthe activity\n2.4 Schedule of work activities is coordinated with\npersonnel concerned\n3.\nImplement work plans\n3.1 Work methods and practices are identified in\nconsultation with personnel concerned\n3.2 Work plans are implemented in accordance with\nset time frames, resources and standards\n4.\nMonitor work activities 4.1 Work activities are monitored and compared with\nset objectives\n4.2 Work performance is monitored\n4.3 Deviations from work activities are reported and\nrecommendations are coordinated with\nappropriate personnel and in accordance with set\nstandards\n4.4 Reporting requirements are complied with in\naccordance with recommended format\n4.5 Observe timeliness of report\n4.6 Files are established and maintained in\naccordance with standard operating procedures\n5.\nReview and evaluate\nwork plans and\nactivities\n5.1\nWork plans, strategies and implementation are\nreviewed based on accurate, relevant and\n\n--- PDF PAGE 24 ---\nTR –Microfinance Technology NC IV\n18\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\ncurrent information\n5.2\nReview is based on comprehensive consultation\nwith appropriate personnel on outcomes of work\nplans and reliable feedback\n5.3\nResults of review are provided to concerned\nparties and formed as the basis for\nadjustments/simplifications to be made to\npolicies, processes and activities\n5.4\nPerformance appraisal is conducted in\naccordance with organization rules and\nregulations\n5.5\nPerformance appraisal report is prepared and\ndocumented regularly as per organization\nrequirements.\n5.6\nRecommendations are prepared and presented\nto appropriate personnel/authorities\n5.7\nFeedback mechanisms are implemented in line\nwith organization policies\n\n--- PDF PAGE 25 ---\nTR –Microfinance Technology NC IV\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Objectives\n1.1. Specific\n1.2. General\n2. Resources\n2.1. Personnel\n2.2. Equipment and technology\n2.3. Services\n2.4. Supplies and materials\n2.5. Sources for accessing specialist advice\n2.6. Budget\n3. Schedule of work activities\n3.1. Daily\n3.2. Work-based\n3.3. Contractual\n3.4. Regular\n3.5. Confidential\n3.6. Disclosure\n3.7. Non-disclosure\n4. Work methods and\npractices\n4.1. Work methods and practices may include but\nnot limited to:\n4.2. Legislated regulations and codes of practice\n4.3. Industry regulations and codes of practice\n4.4. Occupational health and safety practices\n5. Work plans\n5.1. Daily work plans\n5.2. Project plans\n5.3. Program plans\n5.4. Organization strategic and restructuring plans\n5.5. Resource plans\n5.6. Skills development plans\n5.7. Management strategies and objectives\n6. Standards\n6.1. Performance targets\n6.2. Performance management and appraisal\nsystems\n6.3. National competency standards\n6.4. Employment contracts\n6.5. Client contracts\n6.6. Discipline procedures\n6.7. Workplace assessment guidelines\n\n--- PDF PAGE 26 ---\nTR –Microfinance Technology NC IV\n20\nVARIABLE\nRANGE\n6.8. Internal quality assurance\n6.9. Internal and external accountability and\nauditing requirements\n6.10. Training Regulation Standards\n6.11. Safety Standards\n7. Appropriate\npersonnel/authorities\n7.1. Appropriate personnel include:\n7.2. Management\n7.3. Line Staff\n8. Feedback mechanisms\n8.1. Feedback mechanisms include:\n8.2. Verbal feedback\n8.3. Informal feedback\n8.4. Formal feedback\n8.5. Questionnaire\n8.6. Survey\n8.7. Group discussion\n\n--- PDF PAGE 27 ---\nTR –Microfinance Technology NC IV\n21\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Set objectives\n1.2. Planned and scheduled work activities\n1.3. Implemented work plans\n1.4. Monitored work activities\n1.5. Reviewed and evaluated work plans and activities\n2. Underpinning\nKnowledge\n2.1. Organization’s strategic plan, policies rules and\nregulations, laws and objectives for work unit activities\nand priorities\n2.2. Organizations policies, strategic plans, guidelines\nrelated to the role of the work unit\n2.3. Team work and consultation strategies\n3. Underpinning\nSkills\n3.1. Planning\n3.2. Leading\n3.3. Organizing\n3.4. Coordinating\n3.5. Communication Skills\n3.6. Inter-and intra-person/motivation skills\n3.7. Presentation skills\n4. Resource\nImplications\nThe following resources MUST be provided\n4.1. Tools, equipment and facilities appropriate to the\nproposed activities\n4.2. Materials relevant to the proposed activities\n4.3. Work plan schedules\n4.4. Drawings, sketches or blueprint\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observation/questioning\n5.2. Practical exercises on Planning and Scheduling Work\nActivities\n5.3. Third\nParty\nReport\n(collection\nof\ncompetency\nevidence)\n6. Context for\nAssessment\n6.1. Competency may be assessed in the workplace or in\nsimulated work\n\n--- PDF PAGE 28 ---\nTR –Microfinance Technology NC IV\n22\nUNIT OF COMPETENCY : PROMOTE ENVIRONMENTAL PROTECTION\nUNIT CODE :"
      },
