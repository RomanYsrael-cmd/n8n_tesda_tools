an officers and staff concerned \n3.4 Conduct of event/activity is overseen in coordination with loan \nofficers, clients and partners\n\n--- PDF PAGE 47 ---\nTR –Microfinance Technology NC IV  \n41\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n3.5 Activity is evaluated/assessed and documented and reported to \nimmediate superior  in accordance with MFI standard operating \nprocedures\n4. Deal with \ndelinquent \naccounts \n4.1 Delinquent accounts are monitored, validated/analyzed and \nreasons of delinquency are confirmed based on MFI policies and \nprocedures \n4.2 Delinquent payment options are presented to the delinquent \nclients and restorative actions are implemented based on MFI \npolicies and guidelines \n4.3 Plan of action is formulated and implemented in compliance with \nMFI policies and guidelines \n4.4 When necessary, delinquent account is referred to legal officer \nfor appropriate action based on MFI policies and procedures\n\n--- PDF PAGE 48 ---\nTR –Microfinance Technology NC IV  \n42\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Groups/center \n1.1 Validation/verification of group compositions and their \nqualifications \n1.2 Conduct of unannounced field visits\n2. Area mapping/ \nscanning \nMay include: \n2.1 Coordination with the concerned local government units and \noffices \n2.2 Review of barangay profiles, surveys and reports \n2.3 Approval/recommendations for expansion by loan officers\n3. Products and \nservices \nMay include: \n3.1 Financial Services (such as Loan Programs) \n3.2 Non-financial services (such as technical skills training, \nlivelihood programs, health and education, environmental \nadvocacies)\n4. Targets \nMay include: \n4.1 Review of previous schedules \n4.2 Gathering and checking of plan of activities submitted by \nloan officers \n4.3 Posting of weekly activity schedules \n4.4 Monitoring of the scheduled activities \n5. Regular and \nspecial events  \n5.1 Introduction of 