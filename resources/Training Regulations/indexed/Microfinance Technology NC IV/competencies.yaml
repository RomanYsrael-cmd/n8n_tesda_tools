 protective equipment (e.g. umbrella, raincoat, jacket, \nhelmet, rubber boots) \n2.8 \nCell phone with plan \n3. Positive-stroking \nstrategies \nMay include - \n3.1 \nBody language or gestures \n3.2 \nWords of encouragement or praises \n3.3 \nWritten commendation \n3.4 \nTreats  \n3.5 \nFellowships \n3.6 \nTeam building \n3.7 \nSports festival \n4. Awards and \nincentives \n4.1 \nRegularization of position \n4.2 \nPromotion \n4.3 \nSalary/allowance increases \n4.4 \nAwards/Citation \n4.5 \nTrainings (local or overseas) \n4.6 \nProfit-sharing \n4.7 \nScholarships \n4.8 \nBonuses\n\n--- PDF PAGE 62 ---\nTR –Microfinance Technology NC IV  \n56"
