mmend solution\nto higher management\n3.1 Report/communication or documentation are\nprepared\n3.2 Recommendations are presented to appropriate\npersonnel\n3.3 Recommendations are followed-up, if required\n4. Implement solution\n4.1 Measurable objectives are identified\n4.2 Resource needs are identified\n4.3 Timelines are identified in accordance with plan\n5. Evaluate/Monitor\nresults and outcome\n5.1 Processes and improvements are identified based\non evaluative assessment of problem\n5.2 Recommendations are prepared and submitted to\nsuperiors.\n\n--- PDF PAGE 17 ---\nTR –Microfinance Technology NC IV\n11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Area of responsibility\nVariables may include but are limited to:\n1.1. Work environment\n1.2. Problem solution processes\n1.3. Preventative maintenance and diagnostic\npolicy\n1.4. Roles and technical responsibilities\n2. Occupational Health and\nSafety\n2.1. As per company, statutory and vendor\nrequirements. Ergonomic and environmental\nfactors must be considered during the\ndemonstration of this competency.\n3. Communication\nVariables may include but are not limited to:\n3.1. Written communication can involve both\nhand written and printed material, internal\nmemos, electronic mail, briefing notes and\nbulletin boards.\n4. Documentation\n4.1. Audit trails\n4.2. Naming standards\n4.3. Version control\n\n--- PDF PAGE 18 ---\nTR –Microfinance Technology NC IV\n12\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nAnalyzed the problem\n1.2.\nIdentified possible solutions\n1.3.\nImplemented solutions\n1.4.\nRecommended solutions to higher management\n1.5.\nOutcome evaluated/monitored\nEvidence of satisfactory performance in this unit can be\nobtained by observation of performance and questioning to\nindicate knowledge and understanding of the elements of\nthe competency and performance criteria.\n2. Underpinning\nKnowledge\n2.1. Broad understanding of systems, 