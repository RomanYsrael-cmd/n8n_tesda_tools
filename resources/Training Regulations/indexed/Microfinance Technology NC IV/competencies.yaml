        "source_title": "OVERSEE IMPLEMENTATION OF MICROFINANCE PRODUCTS AND SERVICES",
        "source_text": "--- PDF PAGE 51 ---\nTR –Microfinance Technology NC IV  \n45\nUNIT OF COMPETENCY        : OVERSEE IMPLEMENTATION OF MICROFINANCE \nPRODUCTS AND SERVICES  \nUNIT CODE \n: \nHCS341302 \nUNIT DESCRIPTOR   \n:  This unit of competency covers the knowledge, skills \nand attitudes required in overseeing loan officers and \nmonitoring \ntheir \nimplementation \nof \nmicrofinance \nproducts and services to clients based on policies and \nprocedures. \nThis \nmeasures \nthe \nteam \nleader/supervisor’s role in loan applications and \nmonitoring of the implementation of products and \nservices.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Check and \nreview/validate \nloan \napplications \n1.1 Completeness of loan documents/requirements is checked \nbased on MFI loan applications checklist and procedures \n1.2 Reviewed loan applications are verified/validated against \nMIS/records \n2. Facilitate \nappraisal of \nloan \napplications \n \n2.1 Evaluated loan recommendation result is referred to appropriate \ncommittee or level of authority for final decision \n2.2 Loan applications of clients are recommended for \napproval/disapproval in accordance with MFI standard operating \nprocedures and guidelines \n2.3 Documents are processed in accordance with MFI standard \noperating procedures \n3. Monitor loan \nutilization \n \n3.1 On-the-spot client visits are conducted according to MFI policies  \nand standard operating procedures   \n3.2 Accomplished Loan Utilization Check (LUC) forms and \nattachments are randomly checked against the project proposal \n4. Monitor \nimplementation \nof other \nproducts and \nservices \n4.1 Client insurance, mandatory savings and withdrawals are \nmonitored and verified simultaneously with loan payment based \non loan payment matrix \n4.2 Corrective actions are made in cases of non-compliance or \ndeviation of loan officer/s from target in accordance with the MFI \npolicies and standard operating procedures \n4.3 Work plan is formulated to motivate clients to increase savings \nin accordance with the MFI overall work plan  \n4.4 Business development assistance is provided and promoted \nto clients based on client’s needs and market situation \n5. Communicate \nmanagement’s \nplans and \ndecisions \n4.1 Management plans and decisions are discussed with concerned \npersonnel in accordance with MFI policies and procedures \n4.2 Communication process is effectively carried out using \nappropriate media/channels\n\n--- PDF PAGE 52 ---\nTR –Microfinance Technology NC IV  \n46\nRANGE OF VARIABLES \nVARIABLE\nSCOPE\n1. Loan \ndocuments/ \nrequirements \n1.1   Loan application form \n1.2   CI Results \n1.3 Business proposal or business plan, etc. \n2. Appropriate \ncommittee or \nlevel of authority \n2.1 For individual accountability \n2.2 For group lending arrangements \n2.3 For higher loan brackets \n3. Corrective \nactions \n3.1 Counseling  \n3.2 Verbal/Written Reprimand \n3.3 Retraining of loan officer \n3.4 Change of assignment   \n3.5 Resignation/Termination \n4. Business \ndevelopment \nassistance \n4.1 Conduct of training programs \n4.2 Networking with agencies/other institutions \n4.3 Business and entrepreneurial advisory services  \n4.4 Recommendation for product development and packaging\n\n--- PDF PAGE 53 ---\nTR –Microfinance Technology NC IV  \n47\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Checked completeness of loan applications \n1.2 Verified/validated loan applications \n1.3 Checked loan utilization \n1.4 Led the team in the implementation of microfinance products \nand services \n1.5 Monitored and verified implementation of products and \nservices and utilization of resources \n1.6 Reviewed, analyzed and consolidated periodic reports from \nloan officers \n1.7 Reviewed and evaluated implementation of Microfinance \nproducts and services \n1.8 Communicated management’s plans and decisions \n1.9 Ensured adherence of loan officers on company policies and \nprocedures \n2. Underpinning \nknowledge and \nattitudes \n2.1 Microfinance products and services  \n2.2 Microfinance policies and standard operating procedures  \n2.3 Structure of MFI \n2.4 Mission, Vision and Core values of MFI \n2.5 Strategic directions and operational plans \n2.6 Recordkeeping and internal control procedures \n2.7  Loan application process \n2.8  Loan application form and attachments \n2.9  Loan application verification procedures \n2.10 Cash flow analysis \n2.11 Types of corrective actions for cases of loan officer’s non-\ncompliance \n2.12 Communication process and media \n2.13 Timely and reliable dissemination of information \n2.14 Career development plan \n2.15  Loan utilization policies and practices \n2.16  Customer service  \n2.17 Work values and ethics: \na. Patience in dealing with subordinates and clients \nb. Friendly, firm and fair \nc. Transparent \nd. Attention to details \ne. Team player\n\n--- PDF PAGE 54 ---\nTR –Microfinance Technology NC IV  \n48\nf. Resourcefulness \ng. Discipline in implementing plans/programs \n3. Underpinning skills\n3.1 Supervisory skills \n3.2 Communication skills \n3.3 Interpersonal relationships \n3.4 Community organizing \n3.5 Motivational skills \n3.6 Accounting skills \n3.7 Analytical skills \n3.8 Conflict resolution \n3.9 Networking skills \n3.10 Skills in customer service \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace area (simulated or actual) \n4.2 Access to all tools, equipment, materials and documentation \nrequired \n4.3 Relevant workplace procedures, codes, standards, manuals \nand reference materials \n4.4 MFI policies, procedures and guidelines  \n4.5 MFI Operation manual \n4.6 Evaluation forms \n4.7 Case problem \n4.8 Loan documents \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Interview \n5.2 Written report \n5.3 Portfolio \n6. Context for \nassessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace setting\n",
