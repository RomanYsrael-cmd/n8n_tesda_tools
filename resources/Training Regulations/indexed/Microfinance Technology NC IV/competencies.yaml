        "source_text": "HCS341303\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills\nand attitude required to monitor the progress of work\nplan implementation in the microfinance workplace\nsetting. This measure the team leader/supervisor’s role\nin monitoring the loan officer’s implementation of the\nworkplan based on targets and outputs.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Check budget\nallocation for loan\nreleases\n1.1 Cash position is checked/monitored based on bank statement\naccounting report and monthly target releases\n1.2 Fund transfer is requested from head office in case of\ninsufficiency of funds in accordance to MFI policies and\nprocedures\n1.3 Loan documents are reviewed/verified for budget allocation\nin accordance with MFI policies and procedures\n1.4 On-time loan release is ensured based on standard schedule\nset by the MFI\n2. Monitor\nsubordinates’\nadherence to work\nplan\n2.1 Increased awareness of subordinates’ performance target is\nensured or maintained based on set target\n2.2 Subordinates’ output is reviewed/compared with the set target\nusing appropriate monitoring tools\n2.3 Problems and difficulties are analyzed using appropriate\nanalytical methods\n2.4 Targets vs. outputs are discussed during team meetings using\neffective communication skills\n2.5 Corrective actions in the workplan are agreed and implemented\nin accordance with MFI policies and procedures\n3. Submit\nrecommendations\nfor work plan\nimprovement\n3.1 Consultation is made with loan officers, clients and\nstakeholders to gather data for plan modification requiring\nhigher level management decision based on MFI policies and\nprocedures\n3.2 Recommendation are formulated and submitted to immediate\nsuperior based on MFI policies and procedures\n3.3 Options are identified based on the validated data\n\n--- PDF PAGE 56 ---\nTR –Microfinance Technology NC IV\n50\nRANGE OF VARIABLES\n\nVARIABLE\nSCOPE\n1. Insufficiency of\nfunds\nMay include-\n1.1 Deviation from cash flow projection\n1.2 Adjustments made on targets and work plan\n1.3 Low collection of loan dues and savings\n1.4 Disaster and emergency situation\n2. Loan documents\nMay include-\n2.1 Loan disbursement master roll\n2.2 Loan application\n2.3 Weekly projection\n2.4 Weekly cash position report\n2.5 Photocopy of passbook\n3. Monitoring tools\n3.1 Shadowing\n3.2 Field visit\n3.3 Feedback gathering from clients (e.g. Mystery shopping,\ninterview, focused group discussion, survey forms)\n3.4 Performance appraisal\n3.5 Review of documents submitted by loan officer (e.g.\ncollection reports, aging report\n4. Analytical methods\n4.1 SWOT (Strength, Weakness, Opportunity, Threat)\n4.2 Force field analysis (Driving forces, Restraining forces)\n4.3 Fish bone\n4.4 5 Whys\n4.5 5 Ms of management (Man, Money, Machines, Methods,\nMaterials)\n4.6 7S (Strategy, Structure, Systems, Shared values, Skills , Style\nand Staff)\n4.7 Process mapping\n4.8 Gap analysis\n5. Targets\nMay include:\n5.1 Loan Portfolio (e.g., loan disbursement)\n5.2 Outreach\n5.3 Repayment Rate\n6. Recommendation\n6.1 Counseling\n6.2 Coaching/Mentoring\n\n--- PDF PAGE 57 ---\nTR –Microfinance Technology NC IV\n51\nVARIABLE\nSCOPE\n6.3 Retooling/retraining\n6.4 Change of assignments\n6.5 Adjustments in targets\n6.6 Resignation/Termination\n6.7 Policy, product, area and process review\n6.8 Review of marketing strategy\n6.9 Modification of target clients and loan portfolio\n\n--- PDF PAGE 58 ---\nTR –Microfinance Technology NC IV\n52\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Checked budget allocation for loan releases\n1.2 Monitored subordinates adherence to workplan\n1.3 Demonstrated ability to prepare workplan\n1.4 Reviewed and analyzed workplan\n1.5 Reviewed performance targets vs. actual output\n1.6 Analyzed problems and difficulties encountered in the\nimplementation of workplan\n1.7 Formulated and submitted recommendations for workplan\nimprovement to management\n1.8 Implemented corrective actions\n1.9 Evaluated implementation of workplan\n1.10 Corrected and updated entries of unit/branch records, files or\nbooks in accordance with policies, procedures and guidelines\n2. Underpinning\nknowledge and\nattitude\n2.1 Microfinance products and services\n2.2 Microfinance standard operating procedures and policies\n2.3 Structure of MFI\n2.4 Mission, Vision and Core values of MFI\n2.5 Strategic directions and operational plans\n2.6 Recordkeeping and internal control procedures\n2.7 Work plan and budget preparation\n2.8 Work plan improvement and modification\n2.9 Financial reports interpretation\n2.10 Cash flow management\n2.11 Payment monitoring procedures\n2.12 Career development plan\n2.13 Features and applications of monitoring tools\n2.14 Analytical methods for problem solving\n2.15 Oral communications for effective team meetings\n2.16 Information dissemination strategies\n2.17 Incentive scheme to meet set target\n2.18 Data validation procedures\n2.19 Management decision making process\n2.20 Specific recommendations\n2.21 Memo and report writing\n2.22 Work values and ethics:\na. Timely and reliable dissemination of information\n\n--- PDF PAGE 59 ---\nTR –Microfinance Technology NC IV\n53\nb. Time management\nc. Knowledge on work plan preparation\nd. Knowledge on monitoring and analytical tools\ne. Patience in dealing with subordinates and clients\nf. Discipline in implementing plans/programs\ng. Team player\nh. Resourcefulness\ni. Attention to details\n3. Underpinning skills\n3.1 Interpreting financial reports\n3.2 Problem solving and decision making skills\n3.3 Supervisory skills\n3.4 Communication skills (oral and written)\n3.5 Counseling skills\n3.6 Coaching/mentoring skills\n3.7 Interpersonal skills\n3.8 Networking skills\n3.9 Facilitating skills\n3.10 Analytical skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area (simulated or actual)\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Relevant workplace procedures, codes, standards, manuals\nand reference materials\n4.4 Accomplishments reports/status\n4.5 Monitoring results\n4.6 Analytical tools\n4.7 Case problem\n4.8 Loan documents\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Interview\n5.2 Written report\n5.3 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 60 ---\nTR –Microfinance Technology NC IV\n54\nUNIT OF COMPETENCY\n:\nEVALUATE AND SUPPORT STAFF PERFORMANCE\nUNIT CODE\n:"
