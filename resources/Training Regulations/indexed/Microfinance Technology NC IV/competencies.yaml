  "source_section_text": "Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2 Individual\naspiring\nto\nbe\nawarded\nthe\nqualification\nof\nMICROFINANCE\nTECHNOLOGY NC IV must demonstrate competency in all the following core units\nof the Qualification through a single project-type assessment. Candidates may apply\nfor assessment in any accredited assessment center.\n\n•\nSupervise MFI Loan Officers\n•\nOversee Implementation of Microfinance Products and Services\n•\nMonitor Progress of Workplan Implementation\n•\nEvaluate and Support Staff performance\nSuccessful candidates shall be awarded National Certificate Level IV in\nMICROFINANCE TECHNOLOGY.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs\n\n4.5.2 Experienced workers (wage-employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\"\n\n--- PDF PAGE 75 ---\nTR –Microfinance Technology NC IV\n69\nCOMPETENCY MAP\n\nMICROFINANCE TECHNOLOGY NC IV\n\nCORE COMPETENCIES\nSupervise MFI Loan\nOfficers\n\nOversee Implemt’n. of\nMicrofinance Products and\nServices\n\nMonitor Progress of Workplan\nImplementation\n\nEvaluate and Support Staff\nPerformance\n\nProvide Trng. &Dev’t.\nOpportunities for Loan\nOfficers & Clients\nPerform Office\nAdministration Works\n\nUpdate financial records\n\nPerform goal setting and\nplanning\n\nPerform monitoring and\nevaluation\n\nProvide/facilitate remittance\nservices\n\nMaintain records\n\nPerform HR-related activities\n(hiring, training, benefits and\nwelfare)\n\nDevelop center/clients\nentrepreneurial skills\n\nEstablish linkages or network\nwith different sectors\n\nCOMMON COMPETENCIES\n\nProvide quality customer\nservices\n\nComply with quality and\nethical standards\n\nPerform computer operation\n\nObserve occupational health and\nsafety practices\n\nBASIC COMPETENCIES\nUtilize Specialized\nCommunication\nSkills\nDevelop Teams and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, Analyze and\nOrganize Information\n\nPlan and Organize\nWork\n\nPromote Environmental\nProtection\n\n--- PDF PAGE 76 ---\nMicrofinance Technology NC IV\n\n70\nDEFINITION OF TERMS:\n1. Microfinance\n\nThe provision of the broad range of financial services such as –\nloans, savings and other non-financial services such as micro-\ninsurance and capacity building programs for the poor and low-\nincome households to assist their micro-enterprises so as to enable\nthem to raise their income levels and improve their living standard.\n2. Team Leader/\nSupervisor\nTeam leader/supervisor is a senior staff of a microfinance institution\nwho leads and guides loan officers of the branch. He or she ensures\nproper implementation of the MFI programs, oversees and\nevaluates performance of his/her subordinates. Duties performed\nusually\ninclude:\nsupervise\nMFI\nLoan\nOfficers;\noversee\nimplementation of microfinance products and services; monitor\nprogress of workplan implementation; and evaluate and support\nstaff performance.\n3. Clients\nBorrower or individual who availed loans which includes active,\nresting and savers.\n4. Loan/credit\nMajor service of the microfinance institution being rendered to\ninterested entrepreneurial poor.\n5. Savings\nRefers to Capital Build-Up (CBU), Savings Build-Up (SBU) which is\neither compulsory or voluntary (money set aside by the client for\nemergency and additional capital purposes which is kept in the MFI)\n6. Passbook\nClient’s document that shows their financial transactions with the\nMFI\n7. Registers\nBooks where all financial transactions and other information about\nthe client are recorded\n8. Center/Group/\nCluster\nRefers to an assembly of clients where the microfinance products\nand services are provided\n9. Center/Group/\n10. Cluster/\nMeeting\nRefers to an activity conducted regularly/periodically such as\ncollection of dues, dissemination of information and some topic.\n11. Potential Area Refers to a location where the formation of center/group/cluster is\npossible.\n12. Past Due\nuncollected payments\n13. Sit-down\nrefers to a strategy of collecting past dues from a delinquent client\nby literally sitting down in the client’s premises(e.g., house or\nbusiness location) and waiting for the payment\n14. Dual Training\nSystem (DTS)\nThe \"Dual Training System\" or Republic Act (R.A.) No. 7686 of 1994\nrefers to an instructional delivery system of technical and vocational\neducation and training that combines in-company/plant training and\nin-school training based on a training plan collaboratively designed\nand implemented by an accredited dual system educational\ninstitution/training center and accredited dual system agricultural,\nindustrial and business establishments with prior notice and advice\nto the local government unit concerned. Under this system, said\n\n--- PDF PAGE 77 ---\nMicrofinance Technology NC IV\n\n71\nestablishments\nand\nthe\neducational\ninstitution\nshare\nthe\nresponsibility of providing the trainee with the best possible job\nqualifications, the former essentially through practical training and\nthe latter by securing an adequate level of specific, general and\noccupation-related theoretical instruction. The word \"dual\" refers to\nthe two parties providing instruction: the concept \"system\" means\nthat the two instructing parties do not operate independently of one\nanother, but rather coordinate their efforts.\nAbbreviations:\n15.CCI\nCharacter and Credit Investigation\n16. BI\nBackground Investigation\n17.MFI\nMicrofinance Institution\n\n--- PDF PAGE 78 ---\nMicrofinance Technology NC IV\n\n72\n ACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of microfinance councils,\nmicrofinance institutions, cooperatives, rural banks, educational institutions and non-\ngovernment organizations who shared their time and expertise to the development and\nvalidation of these Training Regulations.\n\nMicrofinance Councils\n\nCouncil\nName\nDesignation\nMicrofinance Council of\nPhilippines Inc. (MCPI)\nMr. Ed Garcia\nExecutive Director\nMindanao Microfinance\nCouncil\nMr. Jeffrey Ordoñez\nExecutive Director\nMs. Abegail Apalit\nProgram Officer\nMs. Ma. Rosario Carbonell\nProgram Assistant\nMs. Pebble Carbonell\nBicol Microfinance Council\nInc. (BMCI)\nMs. Emily Mammah\nOffice Coordinator\nMs. Noemi Bonaobra\nExecutive Director\n\nMicrofinance Institutions\n\nInstitutions\nName\nDesignation\nAlay Buhay (AB)\nMs. Delfina Ondevilla\nMs. Virginia Calimag\nMicrofinance Manager\nMr. Crisanto Sabino\nExecutive Director\nAhon sa Hirap Inc (ASHI)\nMr. Ronnie Galicia\nBranch Manager\nMs. Victoria Claverol\nPersonnel Officer\nMr. Joemar Aligato\nBranch Manager\nMs. Ariane Longgakit\nBranch Manager\nMs. Faida Abing\nBranch Manager\nMs. Ma.Regina Pacifico\nSam-HRD\nMs. Argie Caguil\nBranch Manager\nAlalay sa Kaunlaran\nIncorporated (ASKI)\nMr. Gregorio Macapagal\nBranch Manager\nMr. Rolando Victoria\nExecutive Director\nMs. Alicia Caliwag\nCorporate Secretary\nMs. Divina Gracia Santos\nHRD Director\nMs. Jane Manucdoc\nOperations Director\nMs. May Garlitos\nTraining Specialist\nMs. Aurora Mangalili\nAdvisory Board\nMr. Marcelino Diamat\nProject Officer\nMs. Joe Marie Bote\nHR Supervisor\nMr. Melvin Villaluz\nProject Officer\nMs. Irma Santos\nBranch Manager\nMr. Jeffrey dela Cruz\nBranch Manager\nMs. Ma. Veronica Navales\nBranch Head\nASA Philippines\nFound