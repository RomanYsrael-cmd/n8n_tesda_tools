  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of MICROFINANCE TECHNOLOGY NC IV, the\ncandidate must demonstrate competence through assessment covering all the units\nof competency listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2 Individual\naspiring\nto\nbe\nawarded\nthe\nqualification\nof\nMICROFINANCE\nTECHNOLOGY NC IV must demonstrate competency in all the following core units\nof the Qualification through a single project-type assessment. Candidates may apply\nfor assessment in any accredited assessment center.\n\n•\nSupervise MFI Loan Officers\n•\nOversee Implementation of Microfinance Products and Services\n•\nMonitor Progress of Workplan Implementation\n•\nEvaluate and Support Staff performance\nSuccessful candidates shall be awarded National Certificate Level IV in\nMICROFINANCE TECHNOLOGY.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs\n\n4.5.2 Experienced workers (wage-employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\"\n\n--- PDF PAGE 75 ---\nTR –Microfinance Technology NC IV\n69\n"
