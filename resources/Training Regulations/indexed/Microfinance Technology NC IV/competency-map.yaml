  "source_text": "COMPETENCY MAP\n\nMICROFINANCE TECHNOLOGY NC IV\n\nCORE COMPETENCIES\nSupervise MFI Loan\nOfficers\n\nOversee Implemt’n. of\nMicrofinance Products and\nServices\n\nMonitor Progress of Workplan\nImplementation\n\nEvaluate and Support Staff\nPerformance\n\nProvide Trng. &Dev’t.\nOpportunities for Loan\nOfficers & Clients\nPerform Office\nAdministration Works\n\nUpdate financial records\n\nPerform goal setting and\nplanning\n\nPerform monitoring and\nevaluation\n\nProvide/facilitate remittance\nservices\n\nMaintain records\n\nPerform HR-related activities\n(hiring, training, benefits and\nwelfare)\n\nDevelop center/clients\nentrepreneurial skills\n\nEstablish linkages or network\nwith different sectors\n\nCOMMON COMPETENCIES\n\nProvide quality customer\nservices\n\nComply with quality and\nethical standards\n\nPerform computer operation\n\nObserve occupational health and\nsafety practices\n\nBASIC COMPETENCIES\nUtilize Specialized\nCommunication\nSkills\nDevelop Teams and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, Analyze and\nOrganize Information\n\nPlan and Organize\nWork\n\nPromote Environmental\nProtection\n\n--- PDF PAGE 76 ---\nMicrofinance Technology NC IV\n\n70",
