  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for MICROFINANCE TECHNOLOGY NC IV.\n\n3.1\nCURRICULUM DESIGN\n\nNominal Duration\n: Basic\n -\n36 Hours\n\n: Common\n -\n74 Hours\n\n: Core\n -\n247 Hours\n\n: On-the-Job/Practical Training -\n528 Hours\n\nQualification Level\n: NC IV\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of microfinance technology in accordance with industry standards. It\ncovers competencies such as supervising MFI loan officers, overseeing implementation of\nproducts and services, monitoring progress of workplan implementation, and evaluating\nand supporting staff performance.\n\nThe course utilizes the competency-based approach to TVET which recognizes\nvarious types of delivery modes, both on and off-the-job to provide trainees extensive\ntime to develop their competencies as Team Leader/Supervisor. The on-the-job/practical\ntraining using the DTS approach is highly recommended to supplement the in school\nactivities with a minimum of 3 months or 528 hours of training to give trainees more time\nto apply their learning from school in a real work situation under close supervision of MFI\ntrainer/s in a MFI partner organization.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 65 ---\nTR –Microfinance Technology NC IV\n59\nBASIC COMPETENCIES\n(36 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunication\nskills\n1.1 Meet common and specific\ncommunication needs of\nclients and colleagues\n1.2 Contribute to the\ndevelopment of\ncommunication strategies\n1.3 Represent the\norganization\n1.4 Facilitate group discussion\n1.5 Conduct interview\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Develop teams\nand individuals\n2.1 Provide team leadership\n2.2 Foster individual and\norganizational growth\n2.3 Monitor and evaluate\nworkplace learning\n2.4 Develop team commitment\nand cooperation\n2.5 Facilitate accomplishment\nof organizational goals\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Apply problem\nsolving\ntechniques in\nthe workplace\n3.1 Analyze the problem\n3.2 Identify possible solutions\n3.3 Recommend solution to\nhigher management\n3.4 Implement solution\n3.5 Evaluate/Monitor results\nand outcome\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Collect, analyze\nand organize\ninformation\n5.1 Study information\nrequirements\n5.2 Process data\n5.3 Analyze, interpret and\norganize information\ngathered\n5.4 Present findings/\nRecommendations\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and\norganize work\n5.1 Set objectives\n5.2 Plan and schedule work\nactivities\n5.3 Implement work plans\n5.4 Monitor work activities\n5.5 Review and evaluate work\nplans and activities\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 66 ---\nTR –Microfinance Technology NC IV\n60\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Promote\nenvironmental\nprotection\n\n6.1 Study guidelines for\nenvironmental concerns\n6.2 Implement specific\nenvironmental programs\n6.3 Monitor activities on\nenvironmental protection\n/programs\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(74 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide\nQuality\nCustomer\nService\n\n1.1 Update knowledge of\nproducts and services\n1.2 Assess needs of new and\nexisting clients\n1.3 Conduct client satisfaction\nsurvey\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n2. Comply with\nQuality and\nEthical\nstandards\n2.1 Assess quality of received\nmaterials\n2.2 Assess own work/output\n2.3 Submit oneself to third\nparty assessment\n2.4 Engage in quality\nimprovement\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n3. Perform\nComputer\nOperations\n3.1 Plan and prepare for\nassigned task\n3.2 Encode data\n3.3 Access information\n3.4 Produce data\n3.5 Use the internet to access\ninformation\n3.6 Maintain computer\nequipment and systems\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n\n--- PDF PAGE 67 ---\nTR –Microfinance Technology NC IV\n61\nCORE COMPETENCIES\n(247 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Supervise MFI\nLoan Officers\n1.1 Oversee field operations\nand other services\n1.2 Check Loan Officer’s\nprocessing of clients’\nloans\n1.3 Oversee regular and\nspecial events for Loan\nOfficers and clients\n1.4 Deal with delinquent\naccounts\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Work\nintegrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n2. Oversee\nImplementation\nof Microfinance\nProducts and\nServices\n2.1 Check and review/ validate\nloan applications\n2.2 Facilitate appraisal of loan\napplications\n2.3 Monitor loan utilization\n2.4 Monitor implementation of\nother products and services\n2.5 Communicate\nmanagement’s plans and\ndecisions\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Work\nintegrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n3. Monitor\nProgress of\nWorkplan\nImplementation\n3.1 Check budget allocation for\nloan releases\n3.2 Monitor subordinates’\nadherence to work plan\n3.3 Submit recommendations\nfor work plan improvement\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion\n&Reason\n\n--- PDF PAGE 68 ---\nTR –Microfinance Technology NC IV\n62\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Work\nintegrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Checklist\n• Logbook\n4. Evaluate and\nSupport Staff\nPerformance\n4.1 Appraise the performance of\nLoan Officers\n4.2 Act on evaluation\nrecommendations\n4.3 Motivate Loan Officers\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Work\nintegrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n\n--- PDF PAGE 69 ---\nTR –Microfinance Technology NC IV\n63\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is supplemented by individualized and self-paced\napproach;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n•\nThe dual training system mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-plant\ntraining or workplace components. Details can be referred to the Dual\nTraining System Law (R.A.6786) Implementing Rules and Regulations;\n•\nModular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ninstructor/trainer facilitates the training delivery;\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners;\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations; and\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors/trainers are not in the\nsame place. Distance learning may employ correspondence study, or\naudio, video or computer technologies;\n\n--- PDF PAGE 70 ---\nTR –Microfinance Technology NC IV\n64\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n•\n can communicate both in oral and in written;\n•\nmust be physically and mentally fit;\n•\nwith good moral character;\n•\nMicrofinance Technology NC ll holder or at least two years experience as\nLoan Officer\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the students/trainees by the educational institution or training center\ndelivering the TVET program.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nMICROFINANCE TECHNOLOGY NC IV\n\nRecommended list of tools, equipment and materials for the training of 30 trainees\nfor Microfinance Technology – NC IV\n\nQUANTITY\nEQUIPMENT and FURNITURES\n30 pcs\nCalculator\n30 sets\nComputer sets w/ MS office application software\n2 units\nComputer Printer, desk jet/laser jet\n2 units\nInternet connection devices\n30 pcs\nMonitor radiation barrier/filter\n1 unit\nLaptop computer\n2 units\nWireless G Router, up to 54Mbps\n2 units\nMultimedia projector\n1 unit\nMechanical/Laser pointer\n2 units\nFax machine\n2 sets\nTelephones with 2 external lines\n2 units\nWhite board/Chalk board, 4ft x 8ft, wall-mounted\n1 unit\nWhite board/Chalk board, 4ft x 4ft, portable w/ wheels\n2 pcs\nStapler and staple remover,, big\n2 pcs\nMasking/scotch tape dispenser\n2 pcs\nScissors\n2 pcs\nCutter, big\n2 units\nFiling cabinet and shelves, 4-layer type\n1 unit\nCD/DVD player\n2 units\nProjec