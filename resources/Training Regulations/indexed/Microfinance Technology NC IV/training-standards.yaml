    "source_text": "3.1\nCURRICULUM DESIGN\n\nNominal Duration\n: Basic\n -\n36 Hours\n\n: Common\n -\n74 Hours\n\n: Core\n -\n247 Hours\n\n: On-the-Job/Practical Training -\n528 Hours\n\nQualification Level\n: NC IV\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of microfinance technology in accordance with industry standards. It\ncovers competencies such as supervising MFI loan officers, overseeing implementation of\nproducts and services, monitoring progress of workplan implementation, and evaluating\nand supporting staff performance.\n\nThe course utilizes the competency-based approach to TVET which recognizes\nvarious types of delivery modes, both on and off-the-job to provide trainees extensive\ntime to develop their competencies as Team Leader/Supervisor. The on-the-job/practical\ntraining using the DTS approach is highly recommended to supplement the in school\nactivities with a minimum of 3 months or 528 hours of training to give trainees more time\nto apply their learning from school in a real work situation under close supervision of MFI\ntrainer/s in a MFI partner organization.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 65 ---\nTR –Microfinance Technology NC IV\n59\nBASIC COMPETENCIES\n(36 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunication\nskills\n1.1 Meet common and specific\ncommunication needs of\nclients and colleagues\n1.2 Contribute to the\ndevelopment of\ncommunication strategies\n1.3 Represent the\norganization\n1.4 Facilitate group discussion\n1.5 Conduct interview\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Develop teams\nand individuals\n2.1 Provide team leadership\n2.2 Foster individual and\norganizational growth\n2.3 Monitor and evaluate\nworkplace learning\n2.4 Develop team commitment\nand cooperation\n2.5 Facilitate accomplishment\nof organizational goals\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Apply problem\nsolving\ntechniques in\nthe workplace\n3.1 Analyze the problem\n3.2 Identify possible solutions\n3.3 Recommend solution to\nhigher management\n3.4 Implement solution\n3.5 Evaluate/Monitor results\nand outcome\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Collect, analyze\nand organize\ninformation\n5.1 Study information\nrequirements\n5.2 Process data\n5.3 Analyze, interpret and\norganize information\ngathered\n5.4 Present findings/\nRecommendations\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and\norganize work\n5.1 Set objectives\n5.2 Plan and schedule work\nactivities\n5.3 Implement work plans\n5.4 Monitor work activities\n5.5 Review and evaluate work\nplans and activities\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 66 ---\nTR –Microfinance Technology NC IV\n60\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Promote\nenvironmental\nprotection\n\n6.1 Study guidelines for\nenvironmental concerns\n6.2 Implement specific\nenvironmental programs\n6.3 Monitor activities on\nenvironmental protection\n/programs\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(74 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Provide\nQuality\nCustomer\nService\n\n1.1 Update knowledge of\nproducts and services\n1.2 Assess needs of new and\nexisting clients\n1.3 Conduct client satisfaction\nsurvey\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n2. Comply with\nQuality and\nEthical\nstandards\n2.1 Assess quality of received\nmaterials\n2.2 Assess own work/output\n2.3 Submit oneself to third\nparty assessment\n2.4 Engage in quality\nimprovement\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n3. Perform\nComputer\nOperations\n3.1 Plan and prepare for\nassigned task\n3.2 Encode data\n3.3 Access information\n3.4 Produce data\n3.5 Use the internet to access\ninformation\n3.6 Maintain computer\nequipment and systems\n•\nSelf-pace\nmodular\n•\nLecture\n•\nDiscussion\n•\nCase studies\n•\nDemonstration\n•\nSimulation\n•\nRole play\n•\nPracticum\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n\n--- PDF PAGE 67 ---\nTR –Microfinance Technology NC IV\n61\nCORE COMPETENCIES\n(247 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Supervise MFI\nLoan Officers\n1.1 Oversee field operations\nand other services\n1.2 Check Loan Officer’s\nprocessing of clients’\nloans\n1.3 Oversee regular and\nspecial events for Loan\nOfficers and clients\n1.4 Deal with delinquent\naccounts\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Work\nintegrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n2. Oversee\nImplementation\nof Microfinance\nProducts and\nServices\n2.1 Check and review/ validate\nloan applications\n2.2 Facilitate appraisal of loan\napplications\n2.3 Monitor loan utilization\n2.4 Monitor implementation of\nother products and services\n2.5 Communicate\nmanagement’s plans and\ndecisions\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Work\nintegrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n3. Monitor\nProgress of\nWorkplan\nImplementation\n3.1 Check budget allocation for\nloan releases\n3.2 Monitor subordinates’\nadherence to work plan\n3.3 Submit recommendations\nfor work plan improvement\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion\n&Reason\n\n--- PDF PAGE 68 ---\nTR –Microfinance Technology NC IV\n62\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Work\nintegrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Checklist\n• Logbook\n4. Evaluate and\nSupport Staff\nPerformance\n4.1 Appraise the performance of\nLoan Officers\n4.2 Act on evaluation\nrecommendations\n4.3 Motivate Loan Officers\n• Self-pace\nmodular\n• Lecture\n• Demonstration\n• Discussion with\nclass\ninteractions\n• Simulation\n• Case\nstudy/case\nanalysis\n• Practicum/Work\nintegrated\nlearning\n• Brainstorming\nby group/group\ndynamics\n• Role playing\n• Buzz sessions\n• Written\nExamination\n• Demonstration\nof Practical\nSkills\n• Assertion &\nReason\n• Checklist\n• Logbook\n\n--- PDF PAGE 69 ---\nTR –Microfinance Technology NC IV\n63"
