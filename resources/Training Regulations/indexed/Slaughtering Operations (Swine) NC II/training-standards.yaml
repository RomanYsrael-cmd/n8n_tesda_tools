dards\n• Lecture -\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Demonstration\n• Oral\nQuestioning\n\n4.3 Clean and\nsanitize tools,\nequipment\nand facilities\n•\nIdentify and describe different types of\ncleaning and sanitizing chemicals and\nagents\n• Lecture -\nDiscussion\n\n• Written\nExamination\n• Oral\nQuestioning\n\n•\nPerform cleaning and sanitation of tools,\nequipment and facilities in accordance with\nregulatory, workplace and OSHS\nrequirements\n• Lecture -\nDiscussion\n• Demonstration\n• Hands-on\n\n• Written\nExamination\n• Observation/\n• Demonstration\n• Oral\nQuestioning\n\n--- PDF PAGE 90 ---\nTR-Slaughtering Operations (Swine) NC II (Amended) Promulgated March 2016 86\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• Must have completed 10 - years basic education\n• Can communicate both orally and in writing\n\n--- PDF PAGE 91 ---\nTR-Slaughtering Operations (Swine) NC II (Amended) Promulgated March 2016 87\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials or access to these tools\nequipment or materials for the training of 15 trainees for Slaughtering Operations (Swine) NC II\nare as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n15 pcs. Working knife\n(8”-10” long, 2” width)\n1 unit\nRestraining box/pen\n(1.5 m long, 24” width)\n2\npcs.\nPlastic pail\n2 pcs.\nSticking knife\n(8” long, 1.5” width)\n1 unit\nStunner (Electric or\ncartridge powered)\n\n1 roll Abaca / Plastic\ntwine\n15 pcs. Scabbard (either\ndouble or single\ndepending on the\nlength of the knife) and\nbelt, plastic\n1 unit\nHoist (1-1.5 ton)\n1 box\n(50\npcs.)\nStunning cartridge\n\n15 pcs.\nSharpening steel\n(round bar with magnet,\n12”-14” long)\n1 unit\nBlood trough\n (1 meter long, 20” in\nheight, with hole\ndiameter of 1.5-2”\ndepend on workplace\nrequirements)\n\n15 pcs. Sharpening stone\n(combination of coarse\nand fine side 12” long,\n25” width)\n1 unit\nOverhead rails\n(8-10 feet in height)\n\n15 pcs. Bell scrapers\n15\npcs.\nGambrel/Spreader\n(hanger in form, 24”\nlong)\n\n1 unit\nBreastbone saw\n(pneumatic, circular\nsaw blade, 5” in\ndiameter)\n\n1 unit\nSplitting axe/saw\n(pneumatic, circular\nsaw blade, 16” in dia.,\nmotor - I HP)\n\n1 pc.\nViscera truck\n(pushcart in form\n4 feet x 3 feet depend\non workplace\nrequirements\n\n2 pcs.\nInspection table\n(24” width, 1-2 meter\nlong)\n\n1 set\nPressurized water\nspray (0.5-1 HP motor)\n\n--- PDF PAGE 92 ---\nTR-Slaughtering Operations (Swine) NC II (Amended) Promulgated March 2016 88\n\nQTY.\nEQUIPMENT\n\n4\nunits\nSterilizer/handwash\n(box stainless with\nheater, temp. 70-100\ndegrees Celcius)\nQTY.\nPERSONNEL\nPROTECTIVE\nEQUIPMENT\n\n1 unit\nCondemnation\nreceptacle (stainless /\nplastic drum)\n15\nunits\nHard hat\n\n1 unit\nWeighing scale\n(digital, ranging from\n500 kgs. capacity)\n15\npairs\nRubber gloves\n\n6\nunits\nHand Dips\n(Pail, 1 foot in height)\n5\nunits\nEar plugs/muffs\n\n1 unit\nDehairing machine or\ndehairing table\n(depending on\nworkplace\nrequirements)\n15\nunits\nApron (water-proof)\n\n1 unit\nScalding tank\n(depending on workplace\nrequirements\nMinimum of 3 heads and\nmaximum of 6 heads)\n5\nunits\nGoggles\n\n1 unit\nWorking table or\nplatform\n(2 meters long;\n1.5 meters width\ndepending on the size of\nthe swine)\n15\npairs\nRubber boots\n\n6\nunits\nTool dips / basin\n(sanitizers or sterilizers)\n15\nsets\nUniform\n(long pants and shirt\nor cover-all)\n\n1 unit\nSingeing equipment\n(flame or torch)\n\n15\npcs.\nMeat hook and trolley\n(roller - 5 “ diameter\nhook - 18 “)\n\nLIVESTOCK\n\n75\nSwine\n\nNOTE:- Facilities, tools and equipment are taken from the Accreditation Requirement of Slaughterhouses by\nNational Meat Inspection Service\no Training Center may enter into a Memorandum of Agreement (MOA) with an NMIS accredited\nslaughterhouse (AA accredited)\n\n--- PDF PAGE 93 ---\nTR-Slaughtering Operations (Swine) NC II (Amended) Promulgated March 2016 89\n\n3.5\nTRAINING FACILITIES\n\nRequired training facilities for training institution that will offer Slaughtering\nOperations (Swine) NC II based on a class intake of 15 students/trainees.\n\nSPACE REQUIREMENT\nAREA IN\nSQ. METERS\nTOTAL AREA IN\nSQ. METERS\nStudent/Trainee Lecture room\n30\n30\nSlaughter house\n43\n43\nHolding Pen\n30\n30\nLoading Bay\n6\n6\nRestroom/Wash/\n6\n6\nLocker/Changing Room\n6\n6\nWaste (water) management facilities\n\nTOTAL AREA\n121\n121\n\n3.6\nTRAINER’S QUALIFICATIONS\n\n•\nMust be a holder of National TVET Trainer’s Certificate Level I either in:\n Slaughtering Operations (Large Animals) NC II\n Slaughtering Operations (Swine) NC II\n•\nMust have at least 2 years relevant industry experience and teaching experience\n•\nMust have attended relevant training and seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\nThe result of the institutional assessments may be considered as an evidence for\nnational assessment.\n\n--- PDF PAGE 94 ---\nTR-Slaughtering Operations (Swine) NC II (Amended) Promulgated March 2016 90"
