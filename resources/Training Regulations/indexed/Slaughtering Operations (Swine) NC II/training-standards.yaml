y. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• Must have completed 10 - years basic education\n• Can communicate both orally and in writing\n\n--- PDF PAGE 91 ---\nTR-Slaughtering Operations (Swine) NC II (Amended) Promulgated March 2016 87\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials or access to these tools\nequipment or materials for the training of 15 trainees for Slaughtering Operations (Swine) NC II\nare as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n15 pcs. Working knife\n(8”-10” long, 2” width)\n1 unit\nRestraining box/pen\n(1.5 m long, 24” width)\n2\npcs.\nPlastic pail\n2 pcs.\nSticking knife\n(8” long, 1.5” width)\n1 unit\nStunner (Electric or\ncartridge powered)\n\n1 roll Abaca / Plastic\ntwine\n15 pcs. Scabbard (either\ndouble or single\ndepending on the\nlength of the knife) and\nbelt, plastic\n1 unit\nHoist (1-1.5 ton)\n1 box\n(50\npcs.)\nStunning cartridge\n\n15 pcs.\nSharpening steel\n(round bar with magnet,\n12”-14” long)\n1 unit\nBlood trough\n (1 meter long, 20” in\nheight, with hole\ndiameter of 1.5-2”\ndepend on workplace\nrequirements)\n\n15 pcs. Sharpening stone\n(combination of coarse\nand fine side 12” long,\n25” width)\n1 unit\nOverhead rails\n(8-10 feet in height)\n\n15 pcs. Bell scrapers\n15\npcs.\nGambrel/Spreader\n(hanger in form, 24”\nlong)\n\n1 unit\nBreastbone saw\n(pneumatic, circular\nsaw blade, 5” in\ndiameter)\n\n1 unit\nSplitting axe/saw\n(pneumatic, circular\nsaw blade, 16” in dia.,\nmotor - I HP)