  "source_text": ":\n\nFor the purpose of this competency standard, the following words are defined:\n\n1.\nAbattoir or slaughterhouse – premises that are approved and registered by the\ncontrolling authority in which food animals are slaughtered and dressed for human\nconsumption.\n\n2.\nCarcass – the body of a slaughtered animal (without internal organs) consisting of\nmeat, fats, bones and connective tissues.\n\nCarcass – the body of any slaughtered animal after bleeding and dressing (Source:\nMeat Inspection Code R.A. No. 9296, as amended by R.A. No. 10536)\n\n3.\nContamination – means direct or indirect transmission of any biological or chemical\nagent, foreign matter or substances or not intentionally added to food that may\ncompromise food safety or suitability. (Source: Meat Inspection Code R.A. No. 9296,\nas amended by R.A. No. 10536)\n\n4.\nDisease or Defect – a pathological change or other abnormality of tissues or organ.\n\n5.\nFit for Human Consumption – meat that has passed and appropriately marked by\nan inspector as safe and wholesome and in which no changes due to disease,\ndecomposition or contamination has subsequently been found.\n\n6.\nFresh Meat – meat that has not yet been treated in any way other than by modified\natmosphere packaging or vacuum packaging to ensure its preservation except that\nif it has been subjected only to refrigeration, it continues to be considered as fresh.\n\n7.\nFood Animal – all domestic animals slaughtered for human consumption such as\nbut not limited to cattle, carabaos, buffaloes, horses, sheep, goats, hogs, deer,\nrabbits, ostrich and poultry. (Source: Meat Inspection Code R.A. No. 9296, as\namended by R.A. No. 10536)\n\n8.\nGambrel – hanging device inserted between the tendon and hind feet of pigs/swine.\n\n9.\nGood Manufacturing Practice (GMP) – means the conformance with codes of\npractice, industry standards, regulations and laws concerning production,\nprocessing, handling, labeling and sale of foods decreed by industry, local, national\nand international bodies with the intention of protecting the public from illness,\nproduct adulteration and fraud. (Source: Meat Inspection Code R.A. No. 9296, as\namended by R.A. No. 10536)\n\n10. Hot meat – refers to carcass or parts of carcass of food animal which was\nslaughtered in an unregistered establishment and has not undergone the required\ninspection.\nHot meat – the carcass or parts of carcass or food animals which were\nslaughtered from unregistered/unaccredited meat establishments and have not\nundergone the required inspection. It also includes undocumented, illegally\nshipped, and unregistered carcass, parts of carcass and meat products coming\n\n--- PDF PAGE 99 ---\nTR-Slaughtering Operations (Swine) NC II Promulgated March 2016 95\n\nfrom other countries and those that are classified as hot meat by the National Meat\nInspection Service (NMIS). (Source: Meat Inspection Code R.A. No. 9296, as\namended by R.A. No. 10536)\n\n11. Inspected and Passed – a condition wherein the carcasses or parts of carcasses\nso marked have been inspected and found to be safe, wholesome and fit for human\nconsumption.\n\n12. Inspected and Condemned – a condition wherein the carcasses or parts of\ncarcasses so marked have been inspected and found to be unsafe, unwholesome\nand unfit for human consumption.\n\n13. Inspection – an act by an official inspector to ensure compliance with rules and\nregulations including but not limited to humane handling of slaughter animals, ante\nand post mortem inspection, quality assurance program, hygiene and sanitation\nprogram, good manufacturing program, sanitation standard operating procedures,\nhazard analysis critical control point program, residue control program on any meat\nand meat product, meat establishment facilities, transport vehicles and conveyance.\n\n14. Label – a display of written, printed or graphic matter upon the immediate container\n(not including package liners) of any article.\n\n15. Meat – refers to fresh, chilled or frozen edible carcass including offal derived from\nfood animals. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No.\n10536)\n\n16. Meat hygiene – all conditions and measures necessary to ensure the safety and\nsuitability of meat at all stages of the food chain.\n\n17. Meat Product – any food product which is exclusively or predominantly composed\nof meat.\n\nMeat Product – any product capable of use as human food which is made wholly\nor in part from any meat or other portion of the carcass of any food animals,\nexcepting products which contain meat or other portions of such carcasses only in\na relatively small proportion or historically have not been considered by consumers\nas products of the meat industry and which are exempted from definitions as a meat\nproduct by the Secretary under such conditions as he may prescribed to assure that\nthe meat or other portions of such carcasses contained in such products are not\nadulterated and that such products are not represented as meat products. (Source:\nMeat Inspection Code R.A. No. 9296, as amended by R.A. No. 10536)\n\n18. National Meat Inspection Service (NMIS) – the sole national controlling /\ncompetent authority attached to the Department of Agriculture charged by the\ngovernment with the control of meat hygiene and meat inspection.\n\n19. Pluck – refers to the internal organs ( heart, liver, lungs, trachea and esophagus)\ntaken out from the chest cavity.\n\n--- PDF PAGE 100 ---\nTR-Slaughtering Operations (Swine) NC II Promulgated March 2016 96\n\n20. Post Abattoir Control – shall mean control measures conducted on meat and meat\nproducts during transport up to the time of retail sale for the enforcement of\nregulations governing meat and meat product inspection.\n\n21. Processed - includes all methods of manufacture and preservation but does not\ninclude prepackaged fresh, chilled or frozen meat.\n\n22. Quality Assurance (QA) System – the organization structure, procedures,\nprocesses and resources needed to implement quality assurance.\n\n23. Rendering – means the process of converting condemned carcasses or parts of the\ncarcasses, meat or meat products into inedible by products by heating.\n\n24. Restraint - means the application to an animal of any procedure designed to restrict\nits movements. (Source: OIE Terrestrial Animal Health Code)\n\n25. Safe and wholesome – refers to meat and meat products that has been passed as\nfit for human consumption using the criteria that it a) will not cause food borne\ninfection or intoxication when properly handed and prepared with respect to the\nintended use, b) does not contain residue in excess of set limits, c) is free of obvious\ncontamination, d) is free of defects that are generally as objectionable to consumers,\ne) has been produced under adequate hygiene control, and f) has not been treated\nwith illegal substances as specified in this Act and in other related national\nlegislation. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No.\n10536)\n\n26. Singeing – removal of any remaining hairs, shrinks and sets the skin, decreases\nthe number of adhering micro-organisms and leaves an attractive clean appearance.\nIt may be done with a hand-held gas torch or automated systems.\n\n27. Stunning - means any mechanical, electrical, chemical or other procedure which\ncauses immediate loss of consciousness; when used before slaughter,\nthe loss of consciousness lasts until death from the slaughter process in the\nabsence of slaughter, the procedure would allow the animal to recover\nconsciousness. (Source: OIE Terrestrial Animal Health Code)\n\n28. Swine - refers to hog/pig or any of various stout- bodied short- legged omnivorous\nmammal (family Suidae) with thick bristly skin and a mobile snout.\n\n29. Traceability – the ability to track meat and meat products back to their source or to\nidentify the source of products so as to minimize liability and prevent the occurrence\nof food safety problems.\n\n30. Unfit for human consumption – in relation to meat and meat products, means\ninspected and found not meeting the criteria of safety and wholesomeness\n\n--- PDF PAGE 101 ---\nTR-Slaughtering Operations (Swine) NC II Promulgated March 2016 97\n",
