      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. TR-Slaughtering Operations (Swine) NC II (Amended) Promulgated March 2016 91 This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. 4.2.3.1 Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate (NTTC) level I in Slaughtering Operations (Swine) NC II • Have at least three (3) years work experience in Slaughtering Operations (Swine and/or Large Animals) • Must have knowledge in anatomy of food animals • Have assisted in the actual conduct of assessment to at least two (2) candidates. .. For Industry-Assessor • Holder of National Certificate in Slaughtering Operatios (Swine) NC II • Holder of Certificate of Competency (COC) in Conduct Competency Assessment under the Trainers Methodology Level I (TM I) • Have at least three (3) years’ work experience in Slaughtering Operations (Swine and/or Large Animals) • Must have knowledge in anatomy of food animals • Have assisted in the actual conduct of assessment to at least two (2) candidates. TR-Slaughtering Operations (Swine) NC II (Amended) Promulgated March 2016 92 BASIC COMPETENCIES COMMON COMPETENCIES"
