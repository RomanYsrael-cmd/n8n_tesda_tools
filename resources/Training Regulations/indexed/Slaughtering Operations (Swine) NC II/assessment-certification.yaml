      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of SLAUGHTERING OPERATIONS (SWINE) NC II, the candidate must demonstrate competence covering all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.3 Recognition of Prior Learning (RPL)/Recognition of Current Competencies (RCC). Candidates who have gained competencies through education, informal training, and work or life experiences may apply for recognition in a particular qualification through competency assessment. . 4.1.4 The following are qualified to apply for assessment: 4.1.4.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non-formal/informal including enterprise-based training programs related to Slaughtering Operations (Swine). 4.1.4.2 Industry workers in the Slaughtering Operations (Swine). 4.1.4.3 Holder of valid Slaughtering Operations NC II shall have to undergo the performance assessment either in Slaughtering Operations (Swine) NC II or Slaughtering Operations (Large Animals) NC II. 4.1.5 A candidate who fails the assessment for two (2) consecutive times shall be advised to go through a refresher course before taking another assessment."
