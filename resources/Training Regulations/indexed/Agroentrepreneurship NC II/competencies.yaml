        "source_text": "500311108 \nUNIT DESCRIPTOR \n : This unit covers the outcomes required to comply with \nregulatory and organizational requirements for \noccupational health and safety. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nhazards and \nrisks \n1.1 Safety regulations \nand workplace safety \nand hazard control \npractices and \nprocedures are \nclarified and \nexplained based on \norganization \nprocedures \n1.2 Hazards/risks in the \nworkplace and their \ncorresponding \nindicators are \nidentified to minimize \nor eliminate risk to \nco-workers, \nworkplace and \nenvironment in \naccordance with \norganization \nprocedures \n1.3 Contingency \nmeasures during \nworkplace accidents, \nfire and other \nemergencies are \nrecognized and \nestablished in \naccordance with \norganization \nprocedures \n• Company workplace \nsafety regulations \n• Industry hazard \ncontrol practices and \nprocedures \n• Internationally \nrecognized OSH \nprocedures and \npractices and \nregulations \n• PPE types and uses \n• Personal hygiene \npractices \n• Hazards/risks \nidentification and \ncontrol \n• Threshold Limit \nValue -TLV \n• OSH indicators \n• Organization safety \nand health protocol \n• Safety \nconsciousness \n• Health \nconsciousness \n• Clarifying and \nexplaining safety \nregulations and \nworkplace safety \nand hazard control \n• Identifying \nhazards/risks in the \nworkplace and their \ncorresponding \nindicators \n• Recognizing \ncontingency \nmeasures during \nworkplace \naccidents, fire and \nother emergencies \n• Practice of personal \nhygiene \n• Interpersonal skills \n• Communication \nskills\n\n--- PDF PAGE 17 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n16 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Evaluate \nhazards and \nrisks \n2.1 Terms of maximum \ntolerable limits which \nwhen exceeded will \nresult in harm or \ndamage are identified \nbased on threshold \nlimit values (TLV) \n2.2 Effects of the \nhazards are \ndetermined \n2.3 OSH issues and/or \nconcerns and \nidentified safety \nhazards are reported \nto designated \npersonnel in \naccordance with \nworkplace \nrequirements and \nrelevant workplace \nOSH legislation \n• Methods of \nidentifying terms of \nmaximum tolerable \nlimits \n• Hazard effects \n• Reporting methods \non OSH \nissues/concerns \n• OSH procedures \nand practices and \nregulations \n• PPE types and uses \n• Hazards/risks \nidentification and \ncontrol \n• Threshold Limit \nValue -TLV \n• OSH indicators \n• Organization safety \nand health protocol \n• Safety \nconsciousness \n• Health \nconsciousness \n• Identifying terms of \nmaximum tolerable \nlimits \n• Determining effects \nof hazards and \nrisks \n• Reporting OSH \nissues and/or \nconcerns \n• Identifying safety \nhazards \n• Hazards/risks \nidentification and \ncontrol skills \n• Interpersonal skills \n• Communication \nskills \n3. Control \nhazards and \nrisks \n3.1 Occupational Safety \nand Health (OSH) \nprocedures for \ncontrolling \nhazards/risks in \nworkplace are \nconsistently followed \n3.2 Procedures for \ndealing with \nworkplace accidents, \nfire and emergencies \nare followed in \naccordance with \norganization OSH \npolicies \n3.3 Personal protective \nequipment (PPE) is \ncorrectly used in \naccordance with \norganization OSH \nprocedures and \npractices \n• Ways of following \nOccupational Safety \nand Health (OSH) \nprocedures for \ncontrolling \nhazards/risks in \nworkplace \n• Ways of following \nprocedures for \ndealing with \nworkplace accidents, \nfire and emergencies\n• Types and use of \npersonal protective \nequipment (PPE) \n• OSH procedures \nand practices and \nregulations \n• Methods and \ntechniques in \nproviding \nappropriate \nassistance in the \n• Following \noccupational health \nand safety (OSH) \nprocedures for \ncontrolling \nhazards/risks in \nworkplace \n• Following \nprocedures for \ndealing with \nworkplace \naccidents, fire and \nemergencies \n• Using correctly \npersonal protective \nequipment (PPE) \n• Providing \nassistance in the \nevent of a \nworkplace \nemergency in \naccordance with \nestablished\n\n--- PDF PAGE 18 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n17 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.4 Appropriate \nassistance is \nprovided in the event \nof a workplace \nemergency in \naccordance with \nestablished \norganization protocol\nevent of a workplace \nemergency \n• Hazards/risks \nidentification and \ncontrol \norganization \nprotocol \n4. Maintain \nOSH \nawareness \n4.1 Emergency-related \ndrills and trainings \nare participated in as \nper established \norganization \nguidelines and \nprocedures \n4.2 OSH personal \nrecords are \ncompleted and \nupdated in \naccordance with \nworkplace \nrequirements \n \n• Participation \nprocedures in \nemergency-related \ndrills and trainings \n• Ways of completing \nand updating OSH \npersonal records \n• OSH procedures \nand practices and \nregulations \n• OSH indicators \n• Participating in \nemergency-related \ndrills and trainings \n• Completing and \nupdating OSH \npersonal records\n\n--- PDF PAGE 19 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n18 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Safety regulations \nMay include but are not limited to: \n1.1 Clean Air Act \n1.2 Building code \n1.3 National Electrical and Fire Safety Codes \n1.4 Waste management statutes and rules \n1.5 Philippine Occupational Safety and Health Standards \n1.6 DOLE regulations on safety legal requirements \n1.7 ECC regulations\n2. Hazards/Risks \nMay include but are not limited to: \n2.1 Physical hazards – impact, illumination, pressure, \nnoise, vibration, temperature, radiation \n2.2 Biological hazards - bacteria, viruses, plants, parasites, \nmites, molds, fungi, insects \n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, \ngasses, vapors \n2.4 Ergonomics \n• Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n• Physiological factors – monotony, personal \nrelationship, work out cycle\n3. Contingency measures \nMay include but are not limited to: \n3.1 Evacuation \n3.2 Isolation \n3.3 Decontamination \n3.4 (Calling designed) emergency personnel\n4. PPE \nMay include but are not limited to: \n4.1 Mask \n4.2 Gloves \n4.3 Goggles \n4.4 Hair Net/cap/bonnet \n4.5 Face mask/shield \n4.6 Ear muffs \n4.7 Apron/Gown/coverall/jump suit \n4.8 Anti-static suits\n5. Emergency-related drills \nand training \n5.1 Fire drill \n5.2 Earthquake drill \n5.3 Basic life support/CPR \n5.4 First aid \n5.5 Spillage control \n5.6 Decontamination of chemical and toxic \n5.7 Disaster preparedness/management\n6. OSH personal records \n6.1 Medical/Health records \n6.2 Incident reports \n6.3 Accident reports \n6.4 OSH-related training completed\n\n--- PDF PAGE 20 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n19 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Explained clearly established workplace safety and \nhazard control practices and procedures \n1.2 Identified hazards/risks in the workplace and its \ncorresponding indicators in accordance with company \nprocedures \n1.3 Recognized contingency measures during workplace \naccidents, fire and other emergencies \n1.4 Identified terms of maximum tolerable limits based on \nthreshold limit value- TLV. \n1.5 Followed Occupational Health and Safety (OSH) \nprocedures for controlling hazards/risks in workplace \n1.6 Used Personal Protective Equipment (PPE) in \naccordance with company OSH procedures and \npractices \n1.7 Completed and updated OSH personal records in \naccordance with workplace requirements \n2. Resource Implications \nThe following resources should be provided: \n2.1 Workplace or assessment location \n2.2 OSH personal records \n2.3 PPE \n2.4 Health records\n3. Methods of Assessment \nCompetency may be assessed through: \n3.1 Portfolio Assessment \n3.2 Interview \n3.3 Case Study/Situation\n4. Context for Assessment \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 21 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n20 \n \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nAPPLY SAFETY MEASURES IN FARM OPERATIONS \n \nUNIT CODE \n:"
