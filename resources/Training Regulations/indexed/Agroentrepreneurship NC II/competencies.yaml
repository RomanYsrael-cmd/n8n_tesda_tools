  "source_section_text": "SECTION 2 \n \nCOMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core \nunits of competency required in AGROENTREPRENEURSHIP NC II. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n: \n500311105 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and relevant \ninformation is accessed \nfrom appropriate \nsources \n1.2 Effective questioning, \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate medium is \nused to transfer \ninformation and ideas \n1.4 Appropriate non- \nverbal communication \nis used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and followed \n1.6 Defined workplace \nprocedures for the \nlocation and storage of \ninformation are used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n• Procedure of \ngathering workplace \ninformation \n• Techniques in \ngathering \ninformation \n• Effective methods of \nconveying \ninformation \n• Written \ncommunication \nmethods \n• Techniques in \nconveying \ncommunication \n• Different modes of \ncommunication \n• Organizational \npolicies \n• Communication \nprocedures and \nsystems \n• Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n• Gathering of \nworkplace \ninformation skills \n• Sourcing of \ninformation skills \n• Sorting of \ninformation skills \n• Obtaining \nworkplace \ninformation skills \n• Conveying \nworkplace \ninformation skills \n• Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 5 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n4 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2 Own opinions are \nclearly expressed and \nthose of others are \nlistened to without \ninterruption \n2.3 Meeting inputs are \nconsistent with the \nmeeting purpose and \nestablished protocols \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Questions about simple \nroutine workplace \nprocedures and matters \nconcerning working \nconditions of \nemployment are asked \nand responded to \n2.6 Meetings outcomes are \ninterpreted and \nimplemented\n• Effective \ncommunication \n• Different modes of \ncommunication \n• Written \ncommunication \n• Organizational \npolicies \n• Communication \nprocedures and \nsystems \n• Decorum in \nparticipating \nworkplace meetings \nand discussions \n• Participating skills \nin workplace \nmeetings and \ndiscussions \n• Following simple \nspoken language \n• Completing work \nrelated \ndocuments \n• Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n• Relating to people \nof social range in \nthe workplace \n• Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements \n3. Complete \nrelevant work \nrelated \ndocuments \n3.1 Range of forms relating \nto conditions of \nemployment are \ncompleted accurately \nand legibly \n3.2 Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3 Basic mathematical \nprocesses are used for \nroutine calculations \n3.4 Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon\n3.5 Reporting requirements \nto supervisor are \ncompleted according to \norganizational \nguidelines \n• Methods of \nmaking/completing \nwork related \ndocuments \n• Company standards \nand procedures in \nmaking work related \ndocuments \n• Effective \ncommunication \n• Different modes of \ncommunication \n• Written \ncommunication \n• Organizational \npolicies \n• Communication \nprocedures and \nsystems \n• Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n• Documenting \nskills \n• Report writing \nskills \n• Making/developin\ng work related \ndocuments \n• Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n• Completing work \nrelated \ndocuments \n• Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n• Ability to relate to \npeople of social \nrange in the \nworkplace\n\n--- PDF PAGE 6 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n5 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1 Team members \n1.2 Suppliers \n1.3 Trade personnel \n1.4 Local government \n1.5 Industry bodies\n2. Medium \n2.1 Memorandum \n2.2 Circular \n2.3 Notice \n2.4 Information discussion \n2.5 Follow-up or verbal instructions \n2.6 Face to face communication\n3. Storage \n3.1 Manual filing system \n3.2 Computer-based filing system\n4. Forms \n4.1 Personnel forms, telephone message forms, safety \nreports\n5. Workplace interactions \n5.1 Face to face \n5.2 Telephone \n5.3 Electronic and two way radio \n5.4 Written including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs and \ndiagrams\n6. Protocols \n6.1 Observing meeting \n6.2 Compliance with meeting decisions \n6.3 Obeying meeting instructions\n\n--- PDF PAGE 7 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n6 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared written communication following standard \nformat of the organization \n1.2 Accessed information using communication equipment \n1.3 Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4 Conveyed information effectively adopting the formal \nor informal communication\n2. Resource Implications \nThe following resources should be provided: \n2.1 Fax machine \n2.2 Telephone \n2.3 Writing materials \n2.4 Internet\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Direct Observation \n3.2 Oral interview and written test\n4. Context for Assessment \nCompetency may be assessed individually in the actual \nworkplace or through accredited institution\n\n--- PDF PAGE 8 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n7 \n \nUNIT OF COMPETENCY : \nWORK IN TEAM ENVIRONMENT \nUNIT CODE \n: \n500311106 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Describe \nteam role and \nscope \n1.1 The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation \n1.2 Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources \n• Organization \nvision/mission \nstatements \n• Company policies \nand employee code \nof conduct \n• Communication \nprocess \n• Team structure \n• Team roles \n• Group planning and \ndecision making \n• Communicating \nskills appropriately \nand consistent with \nthe culture of the \nworkplace \n• Adopting skills to \nteam role and \nscope of \nresponsibilities \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1 Individual role and \nresponsibilities within \nthe team environment \nare identified \n2.2 Roles and \nresponsibility of other \nteam members are \nidentified and \nrecognized \n2.3 Reporting \nrelationships within \nteam and external to \nteam are identified \n• Organization \nvision/mission \nstatements \n• Organization policies \nand employee code \nof conduct \n• Communication \nprocess \n• Team structure \n• Team roles \n• Group planning and \ndecision making \n• Methods and \ntechniques of role \nand responsibility \nidentification with a \nteam \n• Communicating \nskills appropriately \nand consistent with \nthe culture of the \nworkplace \n• Role and \nresponsibility \nidentification skills \n3. Work as a \nteam member \n3.1 Effective and \nappropriate forms of \ncommunications are \nused and interactions \nundertaken with team \nmembers who \ncontribute to known \nteam activities and \nobjectives \n• Approaches of \ninteracting with team \nmembers \n• Types of \ncommunications \nused in effective \ninteraction with team \nmembers \n• Methods of working \nas a team \n• Team working skills \n• Communicating \nskills appropriately \nand consistent with \nthe culture of the \nworkplace \n• Skills in observing \nprotocols when \nmaking reports\n\n--- PDF PAGE 9 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n8 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.2 Effective and \nappropriate \ncontributions are \nmade to complement \nteam activities and \nobjectives, based on \nindividual skills and \ncompetencies and \nworkplace context \n3.3 SOP/Protocols in \nreporting are \nobserved \n3.4 Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of \nteam’s role and \nobjectives and \nindividual \ncompetencies of the \nmembers\n• Techniques in \nworking as a team \n• Using standard \nprocedures when \nmaking reports \n• Developing \nteamwork plans \nbased on team’s \nrole and objectives\n\n--- PDF PAGE 10 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n9 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Role and objective of team \n1.1 Work activities in a team environment with enterprise or \nspecific sector \n1.2 Limited discretion, initiative and judgment maybe \ndemonstrated on the job, either individually or in a team \nenvironment\n2. Sources of information \n2.1 Standard operating and/or other workplace procedures \n2.2 Job procedures \n2.3 Machine/equipment manufacturer’s specifications and \ninstructions \n2.4 Organizational or external personnel \n2.5 Client/supplier instructions \n2.6 Quality standards \n2.7 OSH and environmental standards\n3. Workplace context \n3.1 Work procedures and practices \n3.2 Conditions of work environments \n3.3 Legislation and industrial agreements \n3.4 Standard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5 Safety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 11 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n10 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Operated in a team to complete workplace activity \n1.2 Worked effectively with others \n1.3 Conveyed information in written or oral form \n1.4 Selected and used appropriate workplace language \n1.5 Followed designated work plan for the job \n1.6 Reported outcomes \n2. Resource Implications \nThe following resources should be provided: \n2.1 Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Observation of the individual member in relation to \nthe work activities of the group \n3.2 Observation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3 Case studies and scenarios as a basis for discussion \nof issues and strategies in teamwork\n4. Context for Assessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while task are being \nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n11 \n \nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE \n: 500311107 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes in \npromoting career growth and advancement. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Integrate \npersonal \nobjectives \nwith \norganization\nal goals \n1.1 Personal growth and \nwork plans are \npursued towards \nimproving the \nqualifications set for \nthe profession \n1.2 Intra- and \ninterpersonal \nrelationships are \nmaintained in the \ncourse of managing \noneself based on \nperformance \nevaluation \n1.3 Commitment to the \norganization and its \ngoal is demonstrated \nin the performance of \nduties \n \n• Work values and \nethics (e.g., Code of \nConduct; Code of \nEthics; Rights, Roles \nand Responsibilities \nof Farmers) \n• Organizational \npolicies \n• Organizational \noperations, \nprocedures and \nstandards \n• Organizational \nmission/vision \nstatements \n• Ways of integrating \npersonal objectives \nwith organizational \ngoals \n \n• Integrating skills of \npersonal objectives \nwith organizational \ngoals \n• Pursuing personal \ngrowth and work \nplans \n• Demonstrating \ncommitment to the \norganization and its \ngoals \n• Intra and \nInterpersonal skills \n \n2. Set and meet \nwork \npriorities \n2.1 Competing demands \nare prioritized to \nachieve personal, \nteam and \norganizational goals \nand objectives. \n2.2 Resources are \nutilized efficiently and \neffectively to manage \nwork priorities and \ncommitments \n2.3 Practices along \neconomic use and \nmaintenance of \nequipment and \nfacilities are followed \nas per established \npr