ey \n3.1 Client satisfaction \nsurvey is \nadministered \n3.2 Survey results are \ncollated and analyzed\n3.3 Positive and negative \nresults are defined \n3.4 Negative feedbacks \nare well addressed \nimmediately through \nappropriate \ncommunication \nstrategies \n• Terms and \ndefinitions \n• Client satisfaction \nsurvey \nmethodologies: \n Interviewing \n Observation \n Focus Group \nDiscussion \n Structured Field \nSurvey \n• Survey Process: \n Purpose of survey\n Designing survey \ninstruments\n\n--- PDF PAGE 29 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n28 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n Designing \ninterview and \nFGD guides \n Administering \nsurvey \ninstruments \n Interviewing \ntarget \nrespondents \n Conducting FGD \n Data processing, \nanalysis and \npresentation \n Recommendation\ns \n• How feedback from \nsurvey results are \naddress \n• Work values and \nethics: \n Quality \nconsciousness \n Proactive \n Patience \n Sincerity \n Integrity \n Commitment \n Courteous \nProfessional\n\n--- PDF PAGE 30 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n29 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Product/services and \nprograms \nIncludes the following but are not limited to: \n1.1 Financial services \n1.2 Non-financial services\n2. Clients\n2.1 Entrepreneurial poor\n3. Needs \n3.1 Designing clients satisfaction survey instruments \n3.2 Procedure in administering clients satisfaction survey \n3.3 Processing clients satisfaction survey data \n3.4 Product/service knowledge \n3.5 Knowledge of programs\n4. Interactive communication \n4.1 Information is gathered in a courteous and professional \nmanner \n4.2 Probing skills \n4.3 Skills in effective questioning \n4.4 Consistent service quality for all types of customers \n4.5 Avoiding controversial issues like politics an