        "source_text": "--- PDF PAGE 4 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n3 \n \nSECTION 2  \n \nCOMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core \nunits of competency required in AGROENTREPRENEURSHIP NC II. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n: \n500311105 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and  relevant \ninformation is accessed \nfrom appropriate \nsources  \n1.2 Effective questioning, \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate medium is \nused to transfer \ninformation and ideas \n1.4 Appropriate non- \nverbal communication \nis used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and followed \n1.6 Defined workplace \nprocedures for the \nlocation and storage of \ninformation are used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n Procedure of \ngathering workplace \ninformation \n Techniques in \ngathering \ninformation \n Effective methods of \nconveying \ninformation \n Written \ncommunication \nmethods \n Techniques in \nconveying \ncommunication \n Different modes of \ncommunication  \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n Gathering of \nworkplace \ninformation skills \n Sourcing of \ninformation skills \n Sorting of \ninformation skills \n Obtaining \nworkplace \ninformation skills \n Conveying \nworkplace \ninformation skills \n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 5 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n4 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2 Own opinions are \nclearly expressed and \nthose of others are \nlistened to without \ninterruption \n2.3 Meeting inputs are \nconsistent with the \nmeeting purpose and \nestablished protocols \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner  \n2.5 Questions about simple \nroutine workplace \nprocedures and matters \nconcerning working \nconditions of \nemployment are asked \nand responded to \n2.6 Meetings outcomes are \ninterpreted and \nimplemented\n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Decorum in \nparticipating \nworkplace meetings \nand discussions \n Participating skills \nin workplace \nmeetings and \ndiscussions \n Following simple \nspoken language \n Completing work \nrelated \ndocuments \n Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n Relating to people \nof social range in \nthe workplace \n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements \n3. Complete \nrelevant work \nrelated \ndocuments \n3.1 Range of forms relating \nto conditions of \nemployment are \ncompleted accurately \nand legibly \n3.2 Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3 Basic mathematical \nprocesses are used for \nroutine calculations \n3.4 Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon\n3.5 Reporting requirements \nto supervisor are \ncompleted according to \norganizational \nguidelines \n Methods of \nmaking/completing \nwork related \ndocuments \n Company standards \nand procedures in \nmaking work related \ndocuments \n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n Documenting \nskills  \n Report writing \nskills \n Making/developin\ng work related \ndocuments \n Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n Completing work \nrelated \ndocuments \n Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n Ability to relate to \npeople of social \nrange in the \nworkplace\n\n--- PDF PAGE 6 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n5 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Appropriate sources \n1.1  Team members \n1.2  Suppliers \n1.3  Trade personnel \n1.4  Local government \n1.5  Industry bodies\n2.  Medium \n2.1  Memorandum \n2.2  Circular \n2.3  Notice \n2.4  Information discussion \n2.5  Follow-up or verbal  instructions \n2.6  Face to face communication\n3.  Storage \n3.1  Manual filing system \n3.2  Computer-based filing system\n4.  Forms \n4.1  Personnel forms, telephone message forms, safety \nreports\n5.  Workplace interactions \n5.1  Face to face \n5.2  Telephone \n5.3  Electronic and two way radio \n5.4  Written including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs and \ndiagrams\n6.  Protocols \n6.1  Observing meeting \n6.2  Compliance with meeting decisions \n6.3  Obeying meeting instructions\n\n--- PDF PAGE 7 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n6 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared written communication following standard \nformat  of the organization \n1.2 Accessed information using communication equipment \n1.3 Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4 Conveyed information effectively adopting the formal \nor informal communication\n2.  Resource Implications \nThe following resources should be provided: \n2.1 Fax machine \n2.2 Telephone \n2.3 Writing materials \n2.4 Internet\n3.  Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Direct Observation \n3.2 Oral interview and written test\n4.  Context for Assessment \nCompetency may be assessed individually in the actual \nworkplace or through accredited institution\n",
