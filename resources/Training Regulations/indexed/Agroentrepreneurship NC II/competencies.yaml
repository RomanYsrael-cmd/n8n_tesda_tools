        "source_text": "--- PDF PAGE 12 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n11 \n \nUNIT OF COMPETENCY   : PRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE \n: 500311107 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes in \npromoting career growth and advancement. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Integrate \npersonal \nobjectives \nwith \norganization\nal goals \n1.1 Personal growth and \nwork plans are \npursued towards \nimproving the \nqualifications set for \nthe profession \n1.2 Intra- and \ninterpersonal \nrelationships are \nmaintained in the \ncourse of managing \noneself based on \nperformance \nevaluation \n1.3 Commitment to the \norganization and its \ngoal is demonstrated \nin the performance of \nduties  \n \n Work values and \nethics (e.g., Code of \nConduct; Code of \nEthics; Rights, Roles \nand Responsibilities \nof Farmers) \n Organizational \npolicies \n Organizational \noperations, \nprocedures and \nstandards  \n Organizational \nmission/vision \nstatements \n Ways of integrating \npersonal objectives \nwith organizational \ngoals \n \n  Integrating skills of \npersonal objectives \nwith organizational \ngoals \n Pursuing personal \ngrowth and work \nplans \n Demonstrating \ncommitment to the \norganization and its \ngoals \n Intra and \nInterpersonal skills \n \n2. Set and meet \nwork \npriorities \n2.1 Competing demands \nare prioritized to \nachieve personal, \nteam and \norganizational goals \nand objectives. \n2.2 Resources are \nutilized efficiently and \neffectively to manage \nwork priorities and \ncommitments \n2.3 Practices along \neconomic use and \nmaintenance of \nequipment and \nfacilities are followed \nas per established \nprocedures \n Organizational \npolicies \n procedures and \nstandards  \n Organization and \ndepartmental goals \nand priorities  \n Managing priorities \nand commitments \n Economic use and \nmaintenance of \nequipment and \nfacilities \n Ways and means of \npracticing economic \nuse and \nmaintenance of \nequipment and \nfacilities \n \n Setting skills of work \npriorities \n Meeting with work \npriorities \n Intra and \nInterpersonal skills \n Communication \nskills\n\n--- PDF PAGE 13 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n12 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. \nMaintain \nprofessiona\nl growth \nand \ndevelopme\nnt \n3.1 Trainings and \ncareer opportunities \nare identified and \navailed of based on \njob requirements \n3.2 Recognitions are \nsought/received and \ndemonstrated as \nproof of career \nadvancement \n3.3 Licenses and/or \ncertifications \nrelevant to job and \ncareer are obtained \nand renewed \n \n Ways of identifying \ntrainings and career \nopportunities \n Techniques of \nseeking and \nreceiving \nrecognitions \n Procedures of \nobtaining licenses \nand/or certifications \nrelevant to the job \n \n \n Identifying trainings \nand career \nopportunities \n Seeking recognitions \nare  sought/received \nand demonstrated \nas proof of career \nadvancement \n Obtaining and \nrenewing Licenses \nand/or certifications \nrelevant to job and \ncareer\n\n--- PDF PAGE 14 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n13 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1 Performance Appraisal \n1.2 Psychological Profile \n1.3 Aptitude Tests\n2.  Resources \n2.1 Human \n2.2 Financial \n2.3 Technology \n2.3.1 Hardware \n2.3.2 Software\n3.  Trainings and career \nopportunities \n3.1 Participation in training programs \n3.1.1 Technical \n3.1.2 Supervisory \n3.1.3 Managerial \n3.1.4 Continuing Education \n3.2 Serving as Resource Persons in conferences and \nworkshops\n4.  Recognitions \n4.1 Recommendations \n4.2 Citations \n4.3 Certificate of Appreciations \n4.4 Commendations \n4.5 Awards \n4.6 Tangible and Intangible Rewards\n5.  Licenses and/or \ncertifications \n5.1 National Certificates \n5.2 Certificate of Competency \n5.3 Support Level Licenses \n5.4 Professional Licenses\n\n--- PDF PAGE 15 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n14 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Attained job targets within key result areas (KRAs) \n1.2 Maintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 Completed trainings and career opportunities which \nare based on the requirements of the industries \n1.4 Acquired and maintained licenses and/or certifications \naccording to the requirement of the qualification\n2.  Resource Implications \nThe following resources should be provided: \n2.1 Workplace or assessment location \n2.2 Case studies/scenarios\n3.  Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Portfolio Assessment \n3.2 Interview \n3.3 Simulation/Role-plays \n3.4 Observation \n3.5 Third Party Reports \n3.6 Exams and Tests\n4.  Context for Assessment \n4.1   Competency may be assessed in the work place or in \na simulated work place setting\n",
