        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Reviewed farm production plan \n1.2 Monitored farm production performance \n1.3 Gathered information and feedback \n1.4 Practiced record keeping \n1.5 Prepared farm production plan \n1.6 Computed farm production cost \n1.7 Computed cost and return \n1.8 Computed target volume of harvest \n1.9 Improved farm production plan \n1.10 Applied corrective measure\n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts \n2.10 Manila paper \n2.11 Cartolina \n2.12 Bond paper \n2.13 Stapler \n2.14 Staple wire \n2.15 Puncher \n2.16 Masking tape \n2.17 Notebook \n2.18 Record book \n2.19 White/Black board \n2.20 Crayons \n2.21 Reference Materials \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Demonstration \n3.3 Oral examination\n4. Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n\n--- PDF PAGE 48 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n47 \n \nUNIT OF COMPETENCY \n: \nHANDLE FINANCES \nUNIT CODE \n:"
        },
        "source_text": "AFF243302 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge, skills and attitudes \nrequired to review, prepare and improve farm \nproduction plan. It also includes competencies in \nmonitoring activities, record keeping and information \ngathering. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Review farm \nproduction \nplan \n1.1Farm production \nperformance are \nmonitored according \nto industry standard. \n1.2 Information and \nfeedback are \ngathered following \nindustry practices. \n1.3 Record keeping is \npracticed following \nworkplace \nprocedures. \n1.4 Farm records are \nused according to \nindustry procedures. \n1.5 Improvements are \nselected based on \nthe result of the \nreview. \n• Basic self/farm \nassessment guide \n• Importance of \ngathering feedback \n• Types of records \n• Importance of \nrecord keeping \n• Use of records \n• Diversification of \nfarm products \n• Type of \ndiversification \n \nAttitudes: \n• honesty \n• acceptance \n• humility \n• Open-minded \n• Monitoring farm \nproduction \nperformance \n• Gathering \ninformation and \nfeedback from \nbuyers, other \nfarmers, old records \nand other authorities \n• Practicing record \nkeeping \n• Utilizing farm \nrecords \n• Selecting \nimprovements on \nproduction, post \nproduction and other \nrelated farm \nactivities \n2. Prepare farm \nproduction \nplan \n2.1 Farm production \nrequirements are \nidentified based on \nmarket demand. \n2.2 Farm Production \nactivities and cost \nare determined based \non accepted farming \npractices. \n2.3 Volume of harvest is \ncomputed according \nto actual production \ncapacity. \n2.4 Alternative farm \nproducts are \nselected based on \nmarket demand. \n• Components of \nfarm production \nplan \n• Target volume for \nsucceeding \ncropping season \n• Selection of other \nappropriate farm \nproduct \n• Identify different \nproduction risk \n• Production module \nconcept \n• Production risks \n• Contingency plan \n \nAttitude: \n• Identifying farm \nproduction \nrequirement \n• Determining farm \nproduction activities \nand cost \n• Estimating volume of \nharvest in a given \nseason \n• Selecting alternative \nfarm products \n• Identifying farm \nproduction risk \n• Computing farm \nproduction cost \n• Networking\n\n--- PDF PAGE 44 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n43 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.5 Contingency plan is \nformulated based on \nfarm production \nrisks. \n2.6 Suppliers and \nproviders are \nselected based on \npreference/criteria.\n• Resourceful \n• Creative \n• Proactive \n• Information seeking \n• Patient \n• Observant \n• Selecting Suppliers \nand Providers \n• Analyzing simple \ncriteria \n• Making Simple \ndecision \n3. Improve farm \nproduction \nplan \n3.1 Farm production \nactivities and costing \nare adjusted based \non the result of \nreview. \n3.2 Selected \nimprovements are \napplied based on the \nresult of review. \n3.3 Projected volume \ntarget is adjusted \nbased on the result of \nreview. \n3.4 Corrective measures \nare applied based on \nthe result of review. \n• \nResult of review \n• \nAdjustment of farm \nproduction \nactivities and \ncosting \n• \nApplication of \nselected \nimprovements \n• \nAdjustment of \nprojected volume \ntarget \n• \nApplication of \ncorrective \nmeasures in line \nwith improvement \nAttitude: \n• Proactive \n• Information seeking \n• Patient \n• Observant \n• Adjusting farm \nproduction activities \n• Applying farm \nproduction plan \nimprovements \n• Adjusting projected \nvolume target \n• Applying corrective \nmeasures\n\n--- PDF PAGE 45 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n44 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nInformation may include but not limited to: \n1.1 Farm production and income from farm records \n1.2 good farm practices as benchmark from other farmers \n1.3 feedback from buyers \n1.4 Information from other authorities (government & non-\ngovernment) \n2. Records \nRecords includes but not limited to: \n2.1. business records \n2.2. farm production records \n3. Improvements \nImprovements may include but not limited to: \n3.1. best farm practices \n3.2. product diversification \n3.3. value adding \n4. Farm production \nrequirements \nFarm production requirements include: \n4.1. inputs \n4.2. labor \n4.3. farm machineries \n5. Farm production \nactivities \nFarm production activities may include but not limited to: \n5.1. Land preparation \n5.2. Planting \n5.3. Maintenance \n5.4. Harvesting \n5.5. Post-harvesting \n6. Farm Products \nFarm products may include but not limited to: \n6.1. Livestock \n6.2. Poultry \n6.3. Crops \n6.4. Fisheries \n6.5. Aquatic Resources \n7. Production risk \nProduction risk may include but not limited to: \n7.1. Quality risk \n7.2. Yield risk \n7.3. Contract risk \n7.4. Product liability risk \n7.5. Relationship risk\n\n--- PDF PAGE 46 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n45 \n \n8. Criteria \nCriteria may include but not limited to: \n8.1. Terms of payment \n8.2. Cost \n8.3. Quality\n\n--- PDF PAGE 47 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n46 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Reviewed farm production plan \n1.2 Monitored farm production performance \n1.3 Gathered information and feedback \n1.4 Practiced record keeping \n1.5 Prepared farm production plan \n1.6 Computed farm production cost \n1.7 Computed cost and return \n1.8 Computed target volume of harvest \n1.9 Improved farm production plan \n1.10 Applied corrective measure\n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts \n2.10 Manila paper \n2.11 Cartolina \n2.12 Bond paper \n2.13 Stapler \n2.14 Staple wire \n2.15 Puncher \n2.16 Masking tape \n2.17 Notebook \n2.18 Record book \n2.19 White/Black board \n2.20 Crayons \n2.21 Reference Materials \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Demonstration \n3.3 Oral examination\n4. Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n\n--- PDF PAGE 48 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n47 \n \nUNIT OF COMPETENCY \n: \nHANDLE FINANCES \nUNIT CODE \n:"
      },
