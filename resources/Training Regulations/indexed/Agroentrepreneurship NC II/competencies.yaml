intenance of \nequipment and \nfacilities \n \n• Setting skills of work \npriorities \n• Meeting with work \npriorities \n• Intra and \nInterpersonal skills \n• Communication \nskills\n\n--- PDF PAGE 13 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n12 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. \nMaintain \nprofessiona\nl growth \nand \ndevelopme\nnt \n3.1 Trainings and \ncareer opportunities \nare identified and \navailed of based on \njob requirements \n3.2 Recognitions are \nsought/received and \ndemonstrated as \nproof of career \nadvancement \n3.3 Licenses and/or \ncertifications \nrelevant to job and \ncareer are obtained \nand renewed \n \n• Ways of identifying \ntrainings and career \nopportunities \n• Techniques of \nseeking and \nreceiving \nrecognitions \n• Procedures of \nobtaining licenses \nand/or certifications \nrelevant to the job \n \n \n• Identifying trainings \nand career \nopportunities \n• Seeking recognitions \nare sought/received \nand demonstrated \nas proof of career \nadvancement \n• Obtaining and \nrenewing Licenses \nand/or certifications \nrelevant to job and \ncareer\n\n--- PDF PAGE 14 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n13 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Evaluation \n1.1 Performance Appraisal \n1.2 Psychological Profile \n1.3 Aptitude Tests\n2. Resources \n2.1 Human \n2.2 Financial \n2.3 Technology \n2.3.1 Hardware \n2.3.2 Software\n3. Trainings and career \nopportunities \n3.1 Participation in training programs \n3.1.1 Technical \n3.1.2 Supervisory \n3.1.3 Managerial \n3.1.4 Continuing Education \n3.2 Serving as Resource Persons in conferences and \nworkshops\n4. Recognitions \n4.1 Recommendations \n4.2 Citations \n4.3 Certificate of Appreciations \n4.4 Commendations \n4.5 Awards \n4.6 Tangible and Intangible Rewards\n5. Licenses and/or \ncertifications \n5.1 National Certificates \n5.2 Certificate of Competency \n5.3 Support Level Licenses \n5.4 Professional Licenses\n\n--- PDF PAGE 15 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n14 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Attained job targets within key result areas (KRAs) \n1.2 Maintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 Completed trainings and career opportunities which \nare based on the requirements of the industries \n1.4 Acquired and maintained licenses and/or certifications \naccording to the requirement of the qualification\n2. Resource Implications \nThe following resources should be provided: \n2.1 Workplace or assessment location \n2.2 Case studies/scenarios\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Portfolio Assessment \n3.2 Interview \n3.3 Simulation/Role-plays \n3.4 Observation \n3.5 Third Party Reports \n3.6 Exams and Tests\n4. Context for Assessment \n4.1 Competency may be assessed in the work place or in \na simulated work place setting\n\n--- PDF PAGE 16 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n15 \n \nUNIT OF COMPETENCY : \nPRACTICE OCCUPATIONAL HEALTH AND \nSAFETY PROCEDURES \nUNIT CODE \n :"
