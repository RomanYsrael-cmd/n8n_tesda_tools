8 \nNon-compliance of selection and recruitment \nprocedures of employees \n2.9 \nWork fatigue and lost of interest to work being \nexperience by the employee/s \n2.10 Lack of clear understanding about one’s role and \nresponsibilities \n2.11 Non-compliance of selection and recruitment \nprocedures of clients \n2.12 Undesirable work behavior of employees \n2.13 Breakdown of/barriers to communication \n2.14 Outdated work plans and schedules\n3. Documentation \nIncludes the following but are not limited to: \n3.1 \nStandard Operating Procedures \n3.2 \nQuality checklist \n3.3 \nMonitoring feedback sheet \n3.4 \nForms such as Loan Applications, CCI/BI, Cash Flows, \nLoan Utilization Checks, Client Exits/Withdrawals, \nWork/Job Order, Client Feedback Notice, Material \nRequisition Form, Performance Appraisal Report, \nTraining Evaluation Forms\n\n--- PDF PAGE 37 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n36 \n \n3.5 \nReports such as Financial Statements, Operational \nAssessments/Highlights and Plans, Cash Position \nReports \n3.6 \nMinutes of meetings (Board, Branch, \nDepartment/Units/Groups) \n3.7 \nSpecial orders, memorandums, notices, \nannouncements \n3.8 \nEmployee movements (promotion, demotion, \ndischarge, termination, suspension) \n3.9 \nLinkages such as Loan Verification, SSS and \nPhilhealth dues. \n3.10 Organizational Profile (Vision, Mission, Goals and \nObjectives) \n3.11 Electronic documentations e.g. Website \n3.12 Files/Employees’ Profile\n4.Quality standards \nQuality standards may be related but are not limited to the \nfollowing: \n4.1 \nMaterials \n4.2 \nSoftware \n4.3 \nOffice supplies \n4.4 \nOffice facilities \n4.5 \nOffice equipment \n4.6 \nOffice standard forms \n4.7 \nWork processes \n4.8 \nCustomer service \n4.9 \nProducts and services \n4.10 Work outputs \n4.11 Communication process \n4.12 Ethical and professional ethics \n4.13 Training program design and delivery \n4.14 Value added services/product innovations \n4.15 Organization’s policies and procedures manual\n5.Client \nIncludes the following but are not limited to: \n5.1 \nExternal clients (customers, partners, members, \nsubscribers, end users, investors/funders, service \nproviders, agencies) \n5.2 \nInternal clients (within the organization/co-employees, \nimmediate superiors, board of trustees)\n\n--- PDF PAGE 38 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n37 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Performed work in accordance with the organization’s \nstandard operating procedures and specifications \n1.2 Identified and reported defects in accordance with \nstandard operating procedures \n1.3 Carried out work in accordance with the process \nimprovement procedures\n2. Resource \nimplications \nThe following resources MUST be provided: \n2.1 Product manuals and brochures \n2.2 Marketing and promotional materials \n2.3 Orientation and presentation materials \n2.4 Office standard forms and documentation \n2.5 Operational handbook/manuals \n2.6 Work plans and schedules \n2.7 Hardware \n2.8 Software\n3. Method of \nassessment \nCompetency may be assessed through: \n3.1 Written examination \n3.2 Interviews \n3.3 Audit report \n3.4 Monthly reports \n3.5 Practical demonstration \n3.6 Performance evaluation\n4. Context for \nassessment\n4.1 Assessment may be conducted in the workplace or in a \nsimulated workplace environment\n\n--- PDF PAGE 39 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n38 \n \nCORE COMPETENCY \n \nUNIT OF COMPETENCY \n: \nASSESS MARKET OPPORTUNITIES \n \nUNIT CODE \n: \nAFF243301 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes \nrequired of farmer owner/agro entrepreneurs to \nconduct market visits, determine value adding \nactivities and prepare market plan.\n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED SKILL \n1. Conduct \nmarket visits \n1.1Buyers are identified in \nthe local market \nfollowing industry \npractice \n1.2 Buyers are interviewed \naccording to industry \npractice \n1.3 Buyers are selected \nbased on result of the \ninterview \n• Marketing and \nmarket chain \n• Kinds of buyers \n• Market mapping \n• Procedures in \nconducting \ninformal interview \n• Basis for choosing \nbuyers \n \nAttitudes: \n• Resourceful \n• Open-minded \n• Enthusiastic \n• Patience \n• Drawing a market \nmap \n• Identifying buyers \n• Conducting buyer \ninterview \n• Selecting buyers \n2. Determine \nvalue adding \nactivities \n2.1 Flow of produce from \nfarm to the selected \nbuyer is determined \nbased on the \nestablished industry \npractices. \n2.2 Value adding activities \nare identified based on \nrequirements of \nselected buyer \nrequirements \n2.3 Comparative prices \nand costs of value \nadding activities are \ncomputed based on \nindustry practice \n2.4 Value adding activities \nare selected based on \nbuyers’ requirement \n• Supply and \ndemand \n• Product flow and \nvalue addition \n• Marketing \narrangements \n• Computation of \nsales, cost and \nprofit \n• Selection of value \nadding activities \n \nAttitude: \n• Business minded \n• Openness \n• Practical \n• Decisive \n• Enthusiastic \n• Determining value \nadding activities in \nthe product flow \n• Computation skills \n• Communication \nskills \n• Selecting value \nadding activities to \nperform\n\n--- PDF PAGE 40 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n39 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED SKILL \n3. Prepare \nmarket plan \n3.1 Marketing objective is \nprepared according to \nthe result of market \nresearch \n3.2 Steps in the delivery of \nthe product to selected \nbuyers are established \nbased on objective set \n3.3 Targeted sales, costs \nand marketing profit is \nestimated based on \nobjective set \n3.4 Contingency plan is \nformulated based on \nmarket risks \n3.5 Details of marketing \nplan is compiled \naccording to industry \nprocedure \n• Marketing \nobjective \n• Procedures in \nmaking a \nmarketing \nobjective \n• Steps in product \ndelivery \n• Computation and \nestimation of \nsales, cost and \nprofit \n• Procedure in \ncompiling details \nof marketing plan \n• Contingency plan \n• Market risks \n \nAttitude: \n• Business minded \n• Diligent for \ndetailed work \n• Realistic \n• Motivated \n• Decisive \n• Making marketing \nobjective \n• Establishing steps in \nthe delivery of the \nproduct to buyers \n• Computation skills \n• Estimating targeted \nsales, cost and profit \n• Compiling details of \nmarketing plan \n• Identifying market \nrisks \n• Formulating \ncontingency plan\n\n--- PDF PAGE 41 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n40 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Buyers \nBuyers include traditional buyers such as but not \nlimited to: \n1.1 Traders \n1.2 traders agents \n1.3 institutional buyers \n- consolidators \n- processors \n1.4 wholesaler \n1.5 retailer \n1.6 local/ public market \n1.7 consumers\n2. Value adding \nValue adding includes but is not limited to: \n2.1. cleaning \n2.2. sorting \n2.3. packaging \n2.4. processing \n2.5. transporting \n2.6. product consolidation\n\n--- PDF PAGE 42 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n41 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Conducted market visits \n1.2 Determined value adding activities \n1.3 Prepared market plan\n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts \n2.10 Manila paper \n2.11 Cartolina \n2.12 Bond paper \n2.13 Stapler \n2.14 Staple wire \n2.15 Puncher \n2.16 Masking tape \n2.17 Notebook \n2.18 Record book \n2.19 White/Black board \n2.20 Crayons \n2.21 Reference Materials \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Oral questioning \n3.3 Demonstration\n4. Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n\n--- PDF PAGE 43 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n42 \n \nUNIT OF COMPETENCY \n: \nESTABLISH FARM PRODUCTION PLAN \nUNIT CODE \n: \nAFF243302 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge, skills and attitudes \nrequired to review, prepare and improve farm \nproduction plan. It also includes competencies in \nmonitoring activities, record keeping and information \ngathering. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Review farm \nproduction \nplan \n1.1Farm production \nperformance are \nmonitored according \nto industry standard. \n1.2 Information and \nfeedback are \ngathered following \nindustry practices. \n1.3 Record keeping is \npracticed following \nworkplace \nprocedures. \n1.4 Farm records are \nused according to \nindustry procedures. \n1.5 Improvements are \nselected based on \nthe result of the \nreview. \n• Basic self/farm \nassessment guide \n• Importance of \ngathering feedback \n• Types of records \n• Importance of \nrecord keeping \n• Use of records \n• Diversification of \nfarm products \n• Type of \ndiversification \n \nAttitudes: \n• honesty \n• acceptance \n• humility \n• Open-minded \n• Monitoring farm \nproduction \nperformance \n• Gathering \ninformation and \nfeedback from \nbuyers, other \nfarmers, old records \nand other authorities \n• Practicing record \nkeeping \n• Utilizing farm \nrecords \n• Selecting \nimprovements on \nproduction, post \nproduction and other \nrelated farm \nactivities \n2. Prepare farm \nproduction \nplan \n2.1 Farm production \nrequirements are \nidentified based on \nmarket demand. \n2.2 Farm Production \nactivities and cost \nare determined based \non accepted farming \npractices. \n2.3 Volume of harvest is \ncomputed according \nto actual production \ncapacity. \n2.4 Alternative farm \nproducts are \nselected based on \nmarket demand. \n• Components of \nfarm production \nplan \n• Target volume for \nsucceeding \ncropping season \n• Selection of other \nappropriate farm \nproduct \n• Identify different \nproduction risk \n• Production module \nconcept \n• Production risks \n• Contingency plan \n \nAttitude: \n• Identifying farm \nproduction \nrequirement \n• Determining farm \nproduction activities \nand cost \n• Estimating volume of \nharvest in a given \nseason \n• Selecting alternative \nfarm products \n• Identifying farm \nproduction risk \n• Computing farm \nproduction cost \n• Networking\n\n--- PDF PAGE 44 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n43 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.5 Contingency plan is \nformulated based on \nfarm production \nrisks. \n2.6 Suppliers and \nproviders are \nselected based on \npreference/criteria.\n• Resourceful \n• Creative \n• Proactive \n• Information seeking \n• Patient \n• Observant \n• Selecting Suppliers \nand Providers \n• Analyzing simple \ncriteria \n• Making Simple \ndecision \n3. Improve farm \nproduction \nplan \n3.1 Farm production \nactivities and costing \nare adjusted based \non the result of \nreview. \n3.2 Selected \nimprovements are \napplied based on the \nresult of review. \n3.3 Projected volume \ntarget is adjusted \nbased on the result of \nreview. \n3.4 Corrective measures \nare applied based on \nthe result of review. \n• \nResult of review \n• \nAdjustment of farm \nproduction \nactivities and \ncosting \n• \nApplication of \nselected \nimprovements \n• \nAdjustment of \nprojected volume \ntarget \n• \nApplication of \ncorrective \nmeasures in line \nwith improvement \nAttitude: \n• Proactive \n• Information seeking \n• Patient \n• Observant \n• Adjusting farm \nproduction activities \n• Applying farm \nproduction plan \nimprovements \n• Adjusting projected \nvolume target \n• Applying corrective \nmeasures\n\n--- PDF PAGE 45 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n44 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nInformation may include but not limited to: \n1.1 Farm production and income from farm records \n1.2 good farm practices as benchmark from other farmers \n1.3 feedback from buyers \n1.4 Information from other authorities (government & non-\ngovernment) \n2. Records \nRecords includes but not limited to: \n2.1. business records \n2.2. farm production records \n3. Improvements \nImprovements may include but not limited to: \n3.1. best farm practices \n3.2. product diversification \n3.3. value adding \n4. Farm production \nrequirements \nFarm production requirements include: \n4.1. inputs \n4.2. labor \n4.3. farm machineries \n5. Farm production \nactivities \nFarm production activities may include but not limited to: \n5.1. Land preparation \n5.2. Planting \n5.3. Maintenance \n5.4. Harvesting \n5.5. Post-harvesting \n6. Farm Products \nFarm products may include but not limited to: \n6.1. Livestock \n6.2. Poultry \n6.3. Crops \n6.4. Fisheries \n6.5. Aquatic Resources \n7. Production risk \nProduction risk may include but not limited to: \n7.1. Quality risk \n7.2. Yield risk \n7.3. Contract risk \n7.4. Product liability risk \n7.5. Relationship risk\n\n--- PDF PAGE 46 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n45 \n \n8. Criteria \nCriteria may include but not limited to: \n8.1. Terms of payment \n8.2. Cost \n8.3. Quality\n\n--- PDF PAGE 47 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n46 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Reviewed farm production plan \n1.2 Monitored farm production performance \n1.3 Gathered information and feedback \n1.4 Practiced record keeping \n1.5 Prepared farm production plan \n1.6 Computed farm production cost \n1.7 Computed cost and return \n1.8 Computed target volume of harvest \n1.9 Improved farm production plan \n1.10 Applied corrective measure\n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts \n2.10 Manila paper \n2.11 Cartolina \n2.12 Bond paper \n2.13 Stapler \n2.14 Staple wire \n2.15 Puncher \n2.16 Masking tape \n2.17 Notebook \n2.18 Record book \n2.19 White/Black board \n2.20 Crayons \n2.21 Reference Materials \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Demonstration \n3.3 Oral examination\n4. Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n\n--- PDF PAGE 48 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n47 \n \nUNIT OF COMPETENCY \n: \nHANDLE FINANCES \nUNIT CODE \n: \nAFF243303 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes \nrequired for the individual farmer to prepare budget \nplan, apply budget plan and invest farm income. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Prepare \nbudget plan \n1.1Farm Cost are \ncomputed based on \nfarm activities \n1.2 Financial Service \nProviders are \nidentified based on \nrequirement \n1.3 Sources of Financial \nServices are selected \nbased on requirement \n1.4 Details of budget plan \nare compiled \n• Budget Plan \n• Computation of \nfarm budget \n• Different Financial \nService Providers \n• Criteria in selecting \nFinancial Service \nProviders \n• Simple Analysis \n• Compilation of \ndetails of budget \nplan \n \nAttitude: \n• Patient \n• Hardworking \n• Detail Oriented \n• Cost-efficient \n• Resourceful \n• Computing farm cost \n• Identifying Financial \nService Providers \n• Selecting Financial \nService Providers \n• Compiling details of \nbudget plan \n2. Apply budget \nplan \n2.1 Membership \nrequirements in an \norganization is \ncomplied based on \nstandard procedures \n2.2 Loan application \ndocuments and \nrequirements are \nsubmitted based on \nindustry procedures \n2.3 Financing is availed \nbased on farm plan \nschedule \n2.3 Financial obligations \nare settled based on \nbudget allocation \n• Membership \nrequirements in an \norganization \n• Loan process and \npayment \n• Payment of \nfinancial obligation \n• Financing terms \nand conditions \n \nAttitude: \n• Hardworking \n• Disciplined \n• Diligent \n• Accuracy \n• Diplomatic \n• Appreciative \n• Business minded \n• Detail Oriented \n• Complying with \nmembership \nrequirements \n• Filling-up of required \nforms \n• Submitting of basic \nloan requirement \n• Communication \nskills \n• Settling loan \namortization and \nother financial \nobligations\n\n--- PDF PAGE 49 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n48 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3. Invest farm \nincome \n3.1 Saving is practiced \nfollowing budget plan \n3.2 Assets are acquired \n3.3 Farm expansion and \ndiversification is \nfunded following \nbudget plan \n• Computation of net \nincome, dividend, \npatronage refund, \nand interest on \nsavings \n• Investment options \n \nAttitude: \n• Calculated risk \ntaker \n• Disciplined \n• Cost-efficient \n• Business minded \n• Saving money \nregularly \n• Acquiring additional \nassets \n• Investing in farm \nexpansion and \ndiversification \n• Maximizing use of \nresources\n\n--- PDF PAGE 50 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n49 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Farm activities \nFarm activities may include but not limited to: \n1.1. Land preparation \n1.2. Fertilizer Application \n1.3. Planting \n1.4. Weeding \n1.5. Pest management \n1.6. Harvesting \n1.7. Post-harvest \n2. Financial service providers \nFinancial service providers may include but not limited to: \n2.1. Retailers \n2.1.1 Rural Financial Institutions (i.e. rural banks, \ncooperatives, NGOs) \n2.2. Business development service providers \n2.2.2 trucking service \n- warehousing service\n3. Loan application \ndocuments and \nrequirements \nLoan application documents and requirements may include \nbut not limited to: \n3.1. Farm Production Plan \n3.2. Supply plan \n3.3. Barangay clearance or certification \n3.4. Proof of billing\n4. Savings \nSavings may include: \n4.1. Compulsory (CBU) \n4.2. Voluntary (deposits) \n5. Assets \nAssets may include: \n5.1. Farm land \n5.2. Farm machineries \n5.3. Farm inputs or implements\n\n--- PDF PAGE 51 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n50 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared budget plan specifically the \nallocation of funds to farm activities \n1.2 Applied budget plan in terms of sourcing of \nfinancial support and settlement of financial \nobligations \n1.3 Invested farm income either through savings, \nasset acquisition, or farm business expansion \nand diversification\n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts \n2.10 Manila paper \n2.11 Cartolina \n2.12 Bond paper \n2.13 Stapler \n2.14 Staple wire \n2.15 Puncher \n2.16 Masking tape \n2.17 Notebook \n2.18 Record book \n2.19 White/Black board \n2.20 Crayons \n2.21 Reference Materials \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Demonstration \n3.3 Oral Questioning \n3.3 Interview\n4. Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n\n--- PDF PAGE 52 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n51 \n \nUNIT OF COMPETENCY \n: \nMARKET PRODUCE \nUNIT CODE \n: \nAFF243304 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes \nrequired of farm owner/agro-entrepreneur to monitor \nprevailing price of produce, apply marketing strategies \nand trade produce.\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Monitor \nprevailing \nprice of \nproduce \n1.1 Major buyers and \ntrading centers of the \nproduce is \ndetermined according \nto industry practice \n1.2 Information on price \nis gathered following \nindustry standard \nprocedure \n1.3 Price information is \nrecorded following \nindustry standard \nprocedure \n• Types of buyers \nand trading centers \n• Criteria in \ndetermining major \nbuyers \n• Supply and demand \nin relation to price \nmovements \n• Sources of price \ninformation \n• Methods to monitor \nprices \n• Procedures in \nrecording price \ninformation\n• Determining major \nbuyers and trading \ncenters \n• Gathering price \ninformation \n• Recording price \ninformation \n• Coordinating skills \n• Monitoring skills \n• Communication \nskills \n2. Apply \nmarketing \nstrategies \n2.1 Collected \ninformation is used \nin strategizing to \noptimise sales and \nprofit according to \nstandard marketing \nprocedure \n2.2 Value adding \nactivities are applied \nto increase sales and \nprofit based on \nmarket plan \n2.3 Services of Business \ndevelopment \nservice (BDS) \nproviders are \nidentified based on \nindustry practices \n2.4 Consolidation of \nproduce and group \nmarketing is done \nfollowing industry \npractices. \n• Types of collected \ninformation \n• Market strategizing \n• Computation on \nsales, cost and \nprofit \n• Value addition \n• Kinds of Business \nservice providers \n• Advantages and \nbenefits in group \nmarketing \n• Types of \ncollaboration \nthrough coops, \nassociations, \ninformal clusters \n \nAttitude: \n• Business minded \n• Team work \n• Work oriented \n• Using collected \ninformation in market \nstrategizing \n• Applying value \nadding activities \n• Identifying services \nof business \ndevelopment service \n(BDS) providers \n• Conducting \nconsolidation \nactivities \n• Coordinating skills \n• Computation skills \n• Record keeping\n\n--- PDF PAGE 53 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n52 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n• Cooperative \n• Committed \n• Open minded \n3. Sell produce \n3.1 Negotiation with \nbuyers and business \ndevelopment \nservice providers are \nperformed according \nto industry practice \n3.2 Sales terms and \nconditions are \nestablished and \nagreed following \nmarketing practices \n3.3 Produce for selling is \nprepared according to \nmarket requirements \n3.4 Produce are \ndelivered to buyers \nbased on agreement \n3.5 Marketing operation \nis assessed based on \nmarketing practices \n3.6 Details of marketing \ntransaction are \nrecorded and kept as \nreference following \nindustry practice\n• Market negotiation \n• Marketing \narrangements \n• Preparation of \nproduce \n• Product delivery \nprocess with quality \nhandling and \ntraceability \n• Computation of \nsales, cost and \nprofit \n• Record keeping of \ndetails of marketing \ntransaction \n \nAttitude: \n• Business minded \n• Team work \n• Work oriented \n• Disciplined \n• Cooperative \n• Committed \n• Negotiation skills \n• Computation skills \n• Establishing sales \nterms and conditions \n• Preparing produce \n• Handling of product \n• Consolidating and \nselling of products \n• Recording of Details \nof marketing \ntransaction\n\n--- PDF PAGE 54 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n53 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Buyers \nBuyers may include but not limited to: \n1.1 \nProcessor or Manufacturer \n1.2 \nSupermarket \n1.3 \nLocal traders \n1.4 \nTrading centers \n1.5 \nPublic market \n1.6 \nWholesaler \n1.7\nRetailer\n2. Price \nPrice includes: \n2.1. \nFarmgate \n2.2. \nPrice at the trading centers \n2.3.\nLocal market\n3. Collected \ninformation \nCollected information may include but not limited to: \n3.1. \nBuyers \n3.2. \nValue adding activities \n3.3. \nPrice \n3.4. \nVolume \n3.5. \nQuality \n3.6. \nTerms of payment \n3.7. \nMode of delivery \n3.8.\nTime \n4. Value adding \nactivities \nValue adding activities may include but not limited to: \n4.1. \nProcessing \n4.2. \nPackaging \n4.3. \nSorting \n4.4. \nCleaning, \n4.5. \nPeeling, \n4.6. \nStandard on size, length, and weight \n5. Business \ndevelopment \nservice (BDS) \nBusiness development service (BDS) may include but not limited to: \n5.1. \nTrucking \n5.2. \nWarehousing \n5.3. \nTraining \n5.4. \nPre &post-harvest facilities \n5.5. \nCold storage provider \n5.6. \nPackaging provider \n6. Details of \nmarketing \ntransaction \nDetails of marketing transaction may include but not limited to: \n6.1. \nProductdeliveries \n6.2. \nSales \n6.3. \nCosts \n6.4.\nProfit\n\n--- PDF PAGE 55 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n54 \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Monitored prevailing price of produce \n1.2 Applied marketing strategies \n1.3 Sold produce \n1.4 Negotiated with buyers and business development \nservices (BDS) providers\n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts Manila paper \n2.10 Cartolina \n2.11 Bond paper \n2.12 Stapler \n2.13 Staple wire \n2.14 Puncher \n2.15 Masking tape \n2.16 Notebook \n2.17 Record book \n2.18 White/Black board \n2.19 Crayons \n2.20 Reference Materials \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Oral questioning \n3.3 Demonstration\n4. Context of \nAssessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center in \na simulated workplace setting.\n\n--- PDF PAGE 56 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n55"
