        "source_text": "--- PDF PAGE 8 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n7 \n \nUNIT OF COMPETENCY : \nWORK IN TEAM ENVIRONMENT \nUNIT CODE \n: \n500311106 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Describe \nteam role and \nscope \n1.1 The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation \n1.2 Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources \n Organization \nvision/mission \nstatements \n Company policies \nand employee code \nof conduct  \n Communication \nprocess \n Team structure \n Team roles \n Group planning and \ndecision making \n Communicating \nskills appropriately \nand consistent with \nthe culture of the \nworkplace \n Adopting skills to \nteam role and \nscope of \nresponsibilities \n2.  Identify own \nrole and \nresponsibility \nwithin team \n2.1 Individual role and \nresponsibilities within \nthe team environment \nare identified \n2.2 Roles and \nresponsibility of other \nteam members are \nidentified and \nrecognized \n2.3 Reporting \nrelationships within \nteam and external to \nteam are identified \n Organization \nvision/mission \nstatements \n Organization policies \nand employee code \nof conduct  \n Communication \nprocess \n Team structure \n Team roles \n Group planning and \ndecision making \n Methods and \ntechniques of role \nand responsibility \nidentification with a \nteam \n Communicating \nskills appropriately \nand consistent with \nthe culture of the \nworkplace \n Role and \nresponsibility \nidentification skills \n3.  Work as a \nteam member \n3.1 Effective and \nappropriate forms of \ncommunications are \nused and interactions \nundertaken with team \nmembers who \ncontribute to known \nteam activities and \nobjectives \n Approaches of \ninteracting with team \nmembers \n Types of \ncommunications \nused in effective \ninteraction with team \nmembers \n Methods of working \nas a team \n Team working skills \n Communicating \nskills appropriately \nand consistent with \nthe culture of the \nworkplace \n Skills in observing \nprotocols when \nmaking reports\n\n--- PDF PAGE 9 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n8 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.2 Effective and \nappropriate \ncontributions are \nmade to complement \nteam activities and \nobjectives, based on \nindividual skills and \ncompetencies and \nworkplace context \n3.3 SOP/Protocols in \nreporting are \nobserved  \n3.4 Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of  \nteam’s role and \nobjectives and \nindividual \ncompetencies of the \nmembers\n Techniques in \nworking as a team \n Using standard \nprocedures when \nmaking reports \n Developing \nteamwork plans \nbased on team’s \nrole and objectives\n\n--- PDF PAGE 10 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n9 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Role and objective of team  \n1.1 Work activities in a team environment with enterprise or \nspecific sector \n1.2 Limited discretion, initiative and judgment maybe \ndemonstrated on the job, either individually or in a team \nenvironment\n2.  Sources of information \n2.1 Standard operating and/or other workplace procedures \n2.2 Job procedures \n2.3 Machine/equipment manufacturer’s specifications and \ninstructions \n2.4 Organizational or external personnel \n2.5 Client/supplier instructions \n2.6 Quality standards \n2.7 OSH and environmental standards\n3.  Workplace context \n3.1 Work procedures and practices \n3.2 Conditions of work environments \n3.3 Legislation and industrial agreements \n3.4 Standard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5 Safety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 11 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n10 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Operated in a team to complete workplace activity \n1.2 Worked effectively with others \n1.3 Conveyed information in written or oral form \n1.4 Selected and used appropriate workplace language \n1.5 Followed designated work plan for the job \n1.6 Reported outcomes \n2. Resource Implications \nThe following resources should be provided: \n2.1 Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Observation   of the individual member in relation to \nthe work activities of the group \n3.2 Observation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3 Case studies and scenarios as a basis for discussion \nof issues and strategies in teamwork\n4. Context for Assessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while task are being \nundertaken whether individually or in group\n",
