        "source_text": "AFF321203 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to perform basic workplace calculations. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Perform \nestimation \n1.1 Job requirements are \nidentified from written \nor oral \ncommunications \n1.2 Quantities of \nmaterials and \nresources required to \ncomplete a work task \nare estimated \n1.3 The time needed to \ncomplete a work \nactivity is estimated \n1.4 Accurate estimate for \nwork completion are \nmade \n1.5 Estimate of materials \nand resources are \nreported to \nappropriate person \n• Job \nrequirements/labor \nneeds \n• Calculation of \nquantities of \nmaterials and \nresources required \n• Calculation of time \nfor job completion \n• Preparation of \nestimate report \n• Basic mathematical \noperations \n• Percentage and \nratios \n• Unit Conversion \n• Identifying job \nrequirements/labor \n• Estimating quantities \nof materials and \nresources required \n• Estimating time for \njob completion \n• Performing basic \ncalculation \n• Compute percentage \n• Convert English to \nmetric systems of \nmeasurement \n• Preparing estimate \nreport \n2. Perform basic \nworkplace \ncalculation \n2.1 System and units of \nmeasurement to be \nfollowed are \nascertained \n2.2 Calculation needed to \ncomplete work tasks \nare performed using \nthe four basic \nmathematical \noperation \n2.3 Calculate whole \nfraction, percentage \nand mixed when are \nused to complete the \ninstructions \n2.4 Number computed is \nchecked following \nwork requirements \n• Four basic \nmathematical \noperation \n• System and units of \nmeasurement \n• Fraction, \npercentage and \nratio \n• Material takeoff \n• Materials costing \n• Compute bill of \nmaterials \n• Compute project \ncost\n\n--- PDF PAGE 26 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n25 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Four basic mathematical \noperation \n1.1 Addition \n1.2 Subtraction \n1.3 Multiplication \n1.4 Division\n2. System of measurement \n2.1 English \n2.2 Metric\n3. Units of measurement \n3.1 Area \n3.2 Volume \n3.3 Weight \n3.4 Length\n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed estimation \n1.2 Performed basic workplace calculation \n1.3 Applied corrective measures as maybe necessary\n2. Method of Assessment \nCompetency in this unit must be assessed through: \n2.1 Practical demonstration \n2.2 Written examination\n3. Resource Implications \n3.1 Relevant tools and equipment for basic calculation \n3.2 Recommended data\n4. Context of Assessment \n4.1 Assessment may occur in the workplace or in a \nsimulated workplace or as part of a team under limited \nsupervision\n\n--- PDF PAGE 27 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n26 \n \nUNIT OF COMPETENCY \n: \nPROVIDE QUALITY CUSTOMER SERVICE \nUNIT CODE \n:"
