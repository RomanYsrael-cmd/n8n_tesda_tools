        "source_text": "--- PDF PAGE 52 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n51 \n \nUNIT OF COMPETENCY \n: \nMARKET PRODUCE  \nUNIT CODE \n: \nAFF243304 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes  \nrequired of farm owner/agro-entrepreneur to monitor \nprevailing price of produce, apply marketing strategies \nand trade produce.\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1.  Monitor \nprevailing  \nprice of \nproduce \n1.1  Major buyers and \ntrading centers of the \nproduce is \ndetermined according \nto industry practice \n1.2  Information on price \nis gathered following \nindustry standard \nprocedure \n1.3  Price information is \nrecorded following \nindustry standard \nprocedure \n Types of buyers \nand trading centers \n Criteria in \ndetermining major \nbuyers \n Supply and demand \nin relation to price \nmovements \n Sources of price \ninformation \n Methods to monitor \nprices \n Procedures in \nrecording price \ninformation\n Determining major \nbuyers and trading \ncenters \n Gathering price \ninformation \n Recording price \ninformation \n Coordinating skills \n Monitoring skills \n Communication \nskills \n2.  Apply \nmarketing \nstrategies \n2.1  Collected \ninformation is used \nin strategizing to \noptimise sales and \nprofit according to \nstandard marketing \nprocedure \n2.2  Value adding \nactivities are applied \nto increase sales and \nprofit based on \nmarket plan \n2.3  Services of Business \ndevelopment \nservice (BDS) \nproviders are \nidentified based on \nindustry practices \n2.4  Consolidation of \nproduce and group \nmarketing is done \nfollowing industry \npractices. \n Types of collected \ninformation \n Market strategizing  \n Computation on \nsales, cost and \nprofit \n Value addition \n Kinds of Business \nservice providers \n Advantages and \nbenefits in group \nmarketing \n Types of \ncollaboration \nthrough coops, \nassociations, \ninformal clusters \n \nAttitude: \n Business minded \n Team work \n Work oriented \n Using collected \ninformation in market \nstrategizing \n Applying value \nadding activities \n Identifying services \nof business \ndevelopment service \n(BDS) providers \n Conducting \nconsolidation \nactivities \n Coordinating skills \n Computation skills \n Record keeping\n\n--- PDF PAGE 53 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n52 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n Cooperative \n Committed \n Open minded \n3.  Sell produce \n3.1  Negotiation with \nbuyers and business \ndevelopment \nservice providers are \nperformed according \nto industry practice \n3.2  Sales terms and \nconditions are \nestablished and \nagreed following \nmarketing practices \n3.3  Produce for selling is \nprepared according to \nmarket requirements \n3.4  Produce are \ndelivered to buyers \nbased on agreement \n3.5  Marketing operation \nis assessed based on \nmarketing practices \n3.6  Details of marketing \ntransaction are \nrecorded and kept as \nreference following \nindustry practice\n Market negotiation \n Marketing \narrangements \n Preparation of \nproduce  \n Product delivery \nprocess with quality \nhandling and \ntraceability \n Computation of  \nsales, cost and \nprofit \n Record keeping of \ndetails of marketing \ntransaction \n \nAttitude: \n Business minded \n Team work \n Work oriented \n Disciplined \n Cooperative \n Committed \n Negotiation skills \n Computation skills \n Establishing sales \nterms and conditions \n Preparing produce \n Handling of product  \n Consolidating and \nselling of products  \n Recording of Details \nof marketing \ntransaction\n\n--- PDF PAGE 54 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n53 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Buyers \nBuyers may include but not limited to: \n1.1 \nProcessor or Manufacturer \n1.2 \nSupermarket \n1.3 \nLocal traders \n1.4 \nTrading centers \n1.5 \nPublic market \n1.6 \nWholesaler \n1.7\nRetailer\n2. Price \nPrice includes: \n2.1. \nFarmgate \n2.2. \nPrice at the trading centers \n2.3.\nLocal market\n3. Collected \ninformation \nCollected information may include but not limited to: \n3.1. \nBuyers \n3.2. \nValue adding activities \n3.3. \nPrice \n3.4. \nVolume \n3.5. \nQuality \n3.6. \nTerms of payment \n3.7. \nMode of delivery \n3.8.\nTime \n4. Value adding \nactivities \nValue adding activities may include but not limited to: \n4.1. \nProcessing \n4.2. \nPackaging \n4.3. \nSorting \n4.4. \nCleaning, \n4.5. \nPeeling, \n4.6. \nStandard on size, length, and weight \n5. Business \ndevelopment \nservice (BDS) \nBusiness development service (BDS) may include but not limited to: \n5.1. \nTrucking \n5.2. \nWarehousing \n5.3. \nTraining \n5.4. \nPre &post-harvest facilities \n5.5. \nCold storage provider \n5.6. \nPackaging provider \n6. Details of \nmarketing \ntransaction \nDetails of marketing transaction may include but not limited to: \n6.1. \nProductdeliveries \n6.2. \nSales \n6.3. \nCosts \n6.4.\nProfit\n\n--- PDF PAGE 55 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n54 \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Monitored prevailing  price of produce \n1.2 Applied marketing strategies \n1.3 Sold produce \n1.4 Negotiated with buyers and business development \nservices (BDS) providers\n2.  Resource \nImplications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts Manila paper \n2.10 Cartolina \n2.11 Bond paper \n2.12 Stapler \n2.13 Staple wire \n2.14 Puncher \n2.15 Masking tape \n2.16 Notebook \n2.17 Record book \n2.18 White/Black board \n2.19 Crayons \n2.20 Reference Materials \n3.  Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Oral questioning \n3.3 Demonstration\n4.  Context of \nAssessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center in \na simulated workplace setting.\n",
