        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared budget plan specifically the \nallocation of funds to farm activities \n1.2 Applied budget plan in terms of sourcing of \nfinancial support and settlement of financial \nobligations \n1.3 Invested farm income either through savings, \nasset acquisition, or farm business expansion \nand diversification\n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts \n2.10 Manila paper \n2.11 Cartolina \n2.12 Bond paper \n2.13 Stapler \n2.14 Staple wire \n2.15 Puncher \n2.16 Masking tape \n2.17 Notebook \n2.18 Record book \n2.19 White/Black board \n2.20 Crayons \n2.21 Reference Materials \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Demonstration \n3.3 Oral Questioning \n3.3 Interview\n4. Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n\n--- PDF PAGE 52 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n51 \n \nUNIT OF COMPETENCY \n: \nMARKET PRODUCE \nUNIT CODE \n:"
        },
        "source_text": "AFF243303 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes \nrequired for the individual farmer to prepare budget \nplan, apply budget plan and invest farm income. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Prepare \nbudget plan \n1.1Farm Cost are \ncomputed based on \nfarm activities \n1.2 Financial Service \nProviders are \nidentified based on \nrequirement \n1.3 Sources of Financial \nServices are selected \nbased on requirement \n1.4 Details of budget plan \nare compiled \n• Budget Plan \n• Computation of \nfarm budget \n• Different Financial \nService Providers \n• Criteria in selecting \nFinancial Service \nProviders \n• Simple Analysis \n• Compilation of \ndetails of budget \nplan \n \nAttitude: \n• Patient \n• Hardworking \n• Detail Oriented \n• Cost-efficient \n• Resourceful \n• Computing farm cost \n• Identifying Financial \nService Providers \n• Selecting Financial \nService Providers \n• Compiling details of \nbudget plan \n2. Apply budget \nplan \n2.1 Membership \nrequirements in an \norganization is \ncomplied based on \nstandard procedures \n2.2 Loan application \ndocuments and \nrequirements are \nsubmitted based on \nindustry procedures \n2.3 Financing is availed \nbased on farm plan \nschedule \n2.3 Financial obligations \nare settled based on \nbudget allocation \n• Membership \nrequirements in an \norganization \n• Loan process and \npayment \n• Payment of \nfinancial obligation \n• Financing terms \nand conditions \n \nAttitude: \n• Hardworking \n• Disciplined \n• Diligent \n• Accuracy \n• Diplomatic \n• Appreciative \n• Business minded \n• Detail Oriented \n• Complying with \nmembership \nrequirements \n• Filling-up of required \nforms \n• Submitting of basic \nloan requirement \n• Communication \nskills \n• Settling loan \namortization and \nother financial \nobligations\n\n--- PDF PAGE 49 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n48 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3. Invest farm \nincome \n3.1 Saving is practiced \nfollowing budget plan \n3.2 Assets are acquired \n3.3 Farm expansion and \ndiversification is \nfunded following \nbudget plan \n• Computation of net \nincome, dividend, \npatronage refund, \nand interest on \nsavings \n• Investment options \n \nAttitude: \n• Calculated risk \ntaker \n• Disciplined \n• Cost-efficient \n• Business minded \n• Saving money \nregularly \n• Acquiring additional \nassets \n• Investing in farm \nexpansion and \ndiversification \n• Maximizing use of \nresources\n\n--- PDF PAGE 50 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n49 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Farm activities \nFarm activities may include but not limited to: \n1.1. Land preparation \n1.2. Fertilizer Application \n1.3. Planting \n1.4. Weeding \n1.5. Pest management \n1.6. Harvesting \n1.7. Post-harvest \n2. Financial service providers \nFinancial service providers may include but not limited to: \n2.1. Retailers \n2.1.1 Rural Financial Institutions (i.e. rural banks, \ncooperatives, NGOs) \n2.2. Business development service providers \n2.2.2 trucking service \n- warehousing service\n3. Loan application \ndocuments and \nrequirements \nLoan application documents and requirements may include \nbut not limited to: \n3.1. Farm Production Plan \n3.2. Supply plan \n3.3. Barangay clearance or certification \n3.4. Proof of billing\n4. Savings \nSavings may include: \n4.1. Compulsory (CBU) \n4.2. Voluntary (deposits) \n5. Assets \nAssets may include: \n5.1. Farm land \n5.2. Farm machineries \n5.3. Farm inputs or implements\n\n--- PDF PAGE 51 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n50 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared budget plan specifically the \nallocation of funds to farm activities \n1.2 Applied budget plan in terms of sourcing of \nfinancial support and settlement of financial \nobligations \n1.3 Invested farm income either through savings, \nasset acquisition, or farm business expansion \nand diversification\n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts \n2.10 Manila paper \n2.11 Cartolina \n2.12 Bond paper \n2.13 Stapler \n2.14 Staple wire \n2.15 Puncher \n2.16 Masking tape \n2.17 Notebook \n2.18 Record book \n2.19 White/Black board \n2.20 Crayons \n2.21 Reference Materials \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Demonstration \n3.3 Oral Questioning \n3.3 Interview\n4. Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n\n--- PDF PAGE 52 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n51 \n \nUNIT OF COMPETENCY \n: \nMARKET PRODUCE \nUNIT CODE \n:"
      },
