        "source_title": "ASSESS MARKET OPPORTUNITIES",
        "source_text": "--- PDF PAGE 39 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n38 \n \nCORE COMPETENCY \n \nUNIT OF COMPETENCY \n: \nASSESS MARKET OPPORTUNITIES \n \nUNIT CODE \n: \nAFF243301 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes  \nrequired of farmer owner/agro entrepreneurs to \nconduct market visits, determine value adding \nactivities and prepare market plan.\n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED SKILL \n1.  Conduct \nmarket visits \n1.1Buyers are identified in \nthe local market \nfollowing industry \npractice \n1.2  Buyers are interviewed \naccording to industry \npractice \n1.3  Buyers are selected \nbased on result of the \ninterview \n Marketing and \nmarket chain \n Kinds of buyers  \n Market mapping \n Procedures in \nconducting \ninformal interview  \n Basis for choosing \nbuyers \n \nAttitudes: \n Resourceful \n Open-minded \n Enthusiastic \n Patience \n Drawing a market \nmap \n Identifying buyers \n Conducting buyer \ninterview \n Selecting buyers \n2.  Determine \nvalue adding \nactivities \n2.1  Flow of produce from \nfarm to the selected \nbuyer is determined \nbased on the \nestablished industry \npractices. \n2.2  Value adding activities \nare identified based on \nrequirements of \nselected buyer \nrequirements  \n2.3  Comparative prices \nand costs of value \nadding activities are \ncomputed based on \nindustry practice \n2.4  Value adding activities \nare selected based on \nbuyers’ requirement \n Supply and \ndemand \n Product flow and \nvalue addition \n Marketing \narrangements \n Computation of \nsales, cost and \nprofit \n Selection of value \nadding activities \n \nAttitude: \n Business minded \n Openness \n Practical \n Decisive \n Enthusiastic \n Determining value \nadding activities in \nthe product flow \n Computation skills \n Communication \nskills \n Selecting value \nadding activities to \nperform\n\n--- PDF PAGE 40 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n39 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED SKILL \n3.  Prepare \nmarket plan \n3.1  Marketing objective is \nprepared according to \nthe result of market \nresearch \n3.2  Steps in the delivery of \nthe product to selected \nbuyers are established \nbased on objective set \n3.3  Targeted sales, costs \nand marketing profit is \nestimated based on \nobjective set \n3.4  Contingency plan is \nformulated based on \nmarket risks \n3.5  Details of marketing \nplan is compiled \naccording to industry \nprocedure \n Marketing \nobjective  \n Procedures in \nmaking a \nmarketing \nobjective \n Steps in product \ndelivery \n Computation and \nestimation of \nsales, cost and \nprofit \n Procedure in \ncompiling details \nof marketing plan \n Contingency plan \n Market risks \n \nAttitude: \n Business minded \n Diligent for \ndetailed work \n Realistic \n Motivated \n Decisive \n Making marketing \nobjective  \n Establishing steps in \nthe delivery of the \nproduct to buyers  \n Computation skills \n Estimating targeted \nsales, cost and profit \n Compiling details of \nmarketing plan \n Identifying market \nrisks \n Formulating \ncontingency plan\n\n--- PDF PAGE 41 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n40 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Buyers \nBuyers include traditional buyers such as but not \nlimited to: \n1.1 Traders \n1.2 traders agents \n1.3 institutional buyers \n- consolidators \n- processors \n1.4 wholesaler \n1.5 retailer \n1.6 local/ public market \n1.7 consumers\n2.  Value adding \nValue adding includes but is not limited to: \n2.1. cleaning \n2.2. sorting \n2.3. packaging \n2.4. processing \n2.5. transporting \n2.6. product consolidation\n\n--- PDF PAGE 42 ---\nTR-Agroentrepreneurship NC II                                Promulgated February 3, 2017  \n41 \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Conducted market visits \n1.2 Determined value adding activities \n1.3 Prepared market plan\n2.  Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Calculator \n2.3 Phone Camera \n2.4 Portable Speaker with microphone \n2.5 Scissor \n2.6 Pens (permanent & white board)/Chalk \n2.7 Pencils \n2.8 Ballpens \n2.9 Flip charts  \n2.10 Manila paper \n2.11 Cartolina \n2.12 Bond paper \n2.13 Stapler \n2.14 Staple wire \n2.15 Puncher \n2.16 Masking tape \n2.17 Notebook \n2.18 Record book \n2.19 White/Black board \n2.20 Crayons \n2.21 Reference Materials \n3.  Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Oral questioning \n3.3 Demonstration\n4.  Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n",
