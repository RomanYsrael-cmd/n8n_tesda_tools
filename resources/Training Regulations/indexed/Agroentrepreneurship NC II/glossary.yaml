  "source_text": "1.\nAgroenterprise\nRefers to the business of organized farmers that actively work\nwith market actors, having relationships with buyers of their\nproducts and business service providers that support the\nmovement of their products in the market chain at a profit.\n2.\nBudget Plan\nDocument which covers the farm activities with corresponding\ncost and a plan where to source and allocate the funds.\n3.\nBusiness\nDevelopment\nService\nProviders\nsupport the market chain to function but they do not directly\nhandle the product. This includes micro-credit providers,\ntransportation providers, market information service, trainings,\ntransportation services, warehouse and cold storage facilities\nproviders, pre-postharvest facilities providers and input\nsuppliers.\n4.\nBuyer/\ntraditional local\nbuyer\nA person who makes a purchase;\n\nHave no formal arrangements with farmers before buying their\nproduct;\n\nTake part in spot trading – prices change daily or hourly based\non supply and demand;\n\nAre accessible to farmers in rural areas.\n\na party which acquires, or agrees to acquire, ownership (in case\nof goods),or benefit or usage (in\ncase\nof services),in\nexchange for money or other consideration under a contract of\nsale. This includes but not limited to processor or manufacturer,\nsupermarket, local traders, trading centers, public market,\nwholesaler, retailer.\n5.\nClassroom\nTraining\nThis type of training is facilitated by an instructor either on-line\nor in a classroom setting. Instructor-led training allows for\nlearners and instructors or facilitators to interact and discuss\nthe training material, either individually or in a group setting.\n6.\nCollected\ninformation\nis the process of gathering of data on targeted variables in an\nestablished systematic fashion, which then enables one to\nanswer relevant questions and evaluate outcomes\n\nIt is a systematic approach to gathering data from a variety of\nsources to get a complete and accurate picture of an area of\ninterest.\n7.\nConsolidators\nA frim which groups together orders from different companies\ninto one shipment\n\n--- PDF PAGE 96 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 94\n8.\nContingency\nPlan\nA contingency plan is a plan devised for an outcome other than\nin the usual (expected) plan. It is often used for risk management\nwhen an exceptional risk that, though unlikely, would have\ncatastrophic consequences.\n\nDesigned to take a possible future event or circumstance into\naccount.\n9.\nContract risk\nis the risk of contract default by the producer or the contractor.\n10. Corrective\nmeasures\nare the actions taken to prevent the recurrence of an event that\ncaused the problem initially.\n11. Criteria\na principle or standard by which something may be judged or\ndecided.\n12. Diversification\nprimarily involves a substitution of one crop or other agricultural\nproduct for another, or an increase in the number of enterprises,\nor activities, carried out by a particular farm.\n13. Farm\ndiversification/\nexpansion\nA business decision for farmer to engage in more agricultural\nproducts in addition to the existing.\n\nA business decision for farmer to increase production capacity\nwith implications to funding requirements in terms of farm inputs\nand land area\n\n14. Farm gate\nprice\nthe price for the sale of farm produce direct from the producer.\n15. Farm Plan\nSchedule\nDetailed period or time frame of farm production activities\nspecifying the need for financing\n16. Farm\nProduction\nactivities\n\nare specific farm tasks to be undertaken in producing from\ncomponents or raw materials.\n17. Farm\nproduction\nplan\nEncompasses all the details surrounding how your farm\noperation will produce products for market.\n18. Farm\nproduction\nrequirements\n\nThese are requirements used during crop production such as\ninputs, labor, farm machineries and equipment.\n19. Farm records\nare books used to record all farm events, happenings and\noperation on the farm.\n\n--- PDF PAGE 97 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 95\n20. Feedback\ninformation about reactions to a product, a person's\nperformance of a task, etc., used as a basis for improvement.\n21. Field activities/\nfield work\npractical work/activities conducted by a student/trainee in the\nnatural environment, rather than in a room.\n22. Financial\nObligation\nrefers to an obligation to pay money to another party that may\narise from borrowing funds or as a result of a legal compromise.\n\n23. Financial\nService\nProviders\ninstitutions or individuals that extend financial assistance either\nin form of loans or grants intended for a specific purpose.\n24. Industry\nPractice\nA method, procedure, process, or rule employed or followed by\na organization, group, niche in the pursuit of its objectives. It is\na practice may also refer to these collectively.\n25. Industry\nstandard\nGenerally accepted requirements followed by the members of\nan industry.\n26. Institutional\nbuyers\nRefers to a company or organization that purchases very large\nquantities of food.\n\nHave formal arrangements with farmers before buying their\nproduct. They negotiate on pricing-agreed before purchase.\n\nAre accessible to farmers that can pre-plan as part of formal\narrangements, and sometimes supplier accreditation as well.\n27. Local Market\nLocal market includes customers located within the region the\nproduct or service is produced or made available.\n28. Market\nis the place where people, and institutions buy and sell for their\nagents. A market can be organized as a physical market place\nwhere products are exchanged.\n29. Marketing\nis “the performance of business activities that direct the flow of\ngoods and services from producers to consumers or users”.\nmarketing - as “the development and efficient distribution of\ngoods and services for chosen consumer segments”;\n\nis the series of activities involved in finding out what customers\nwant and moving those products profitably from the point of\nproduction to the point of consumption (is the series of activities\ninvolved in finding out what customers want and moving those\nproducts profitably from the point of production to the point of\nconsumption\n\n--- PDF PAGE 98 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 96\n30. Marketing\nstrategy\nAn organization's strategy that combines all of its marketing\ngoals into one comprehensive plan. A good marketing strategy\nshould be drawn from market research and focus on the right\nproduct mix in order to achieve the maximum profit potential and\nsustain the business. The marketing strategy is the foundation\nof a marketing plan\n31. Market\nMapping\nA study of various market conditions that is plotted on a map to\nidentify trends and corresponding variables between the\nconsumers and products.\n32. Market Risks\nMarket risk is the risk of losses in positions arising from\nmovements in market prices and calamities\n33. Marketing\nTransaction\nis a business strategy that focuses on single, \"point of sale\"\ntransactions. The emphasis is on maximizing the efficiency and\nvolume of individual sales rather than developing a relationship\nwith the buyer.\n\nA strategy used in business targeting customers in making \"one\noff\" or point of sale transactions.\n\nTransactional marketing has the purpose of maximizing a\nbusiness's sales efficiency by boosting the volume of individual\nsales instead of developing an ongoing relationship with the\nconsumer.\n34. Marketing\narrangement\nA contract or agreement whether written or verbal between\nproducers and buyers\n35. Marketing\nobjective\nAre goals set by a business when promoting its products or\nservices to potential consumers that should be achieved within\na given time frame\n36. Marketing\nOperation\nbuilds accountability, alignment, and agility. The marketing\noperations (MO) function has emerged due to the need for a\nmore transparent, efficient, and accountable view of marketing.\n37. Marketing plan\nA marketing plan sets out how you are going to put your\nmarketing strategy into practice;\n\nProduct specific or market specific or company-wide plan that\ndescribes activities involved in achieving specific marketing\nobjectives\n38. Mode of\ndelivery\nby which a shipment is moved from point 'A' to point 'B', such as\nby air, rail, road, or sea.\n\n--- PDF PAGE 99 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 97\n39. Monitoring\nprice\nis the act of observing and checking the progress or quality of\n(something) over a period of time; and what happens to market\nprices in order to obtain useful knowledge and insights that may\nhelp decision makers, families or society at large in\nunderstanding\n40. Negotiation\nBargaining (give and take) process between two or more parties\n(each with its own aims, needs, and viewpoints) seeking to\ndiscover a common ground and reach an agreement to settle a\nmatter of mutual concern or resolve a conflict.\n41. Practicum\na specialized field of study, that is designed to give students/\ntrainees supervised practical application of a previously or\nconcurrently studied theory.\n42. Preference\na greater liking for one alternative over another or others.\n43. Price\nA value that will purchase a finite quantity, weight, or other\nmeasure of a good or service.\n\nIt is the cost or value of a good or service expressed in monetary\nterms, the price you can pay: tuition for receiving an education,\ninterest for receiving a loan, rent for living in a house or using a\npiece of equipment, salaries or wages for employing workers.\n44. Processors\nA person or entity that converts raw materials or semi-finished\ngoods for another company\n45. Produce\nis a generalized term for a group of farm-produced crops and\ngoods, including fruits and vegetables – meats, grains, oats, etc.\nare also sometimes considered produce.\n\n46. Product\nliability risk\nis the risk that a producer may be liable for any problems\nassociated with the grain they have sold.\n47. Production\nmodule\nis a guide to create standardized units of production.\n\n48. Production\nrisks\nany production related activity or event that is uncertain is a\nproduction risk\n49. Projected\nvolume\nassumed quantity of produce to forecast sales. Factors\nconsidered are land area size, variety of seeds/ breed of\nlivestock and production risk calculated for a particular cropping\nseason.\n50. Quality risk\nis the risk of an unexpected quality level in the grain that affects\nthe grain’s value through discounts or reduced premiums.\n\n--- PDF PAGE 100 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 98\nQuality risk also includes the risk of the grain being rejected by\nthe buyer due to low quality or contamination.\n51. Relationship\nrisk\nis the risk of adversely affecting relationships with buyers,\nsuppliers, or other resource providers that are critical to the\nsuccess of the farm operation.\n52. Retailer\nA businessman or person that sells goods to the consumer\n53. Sales terms\nand conditions\nGeneral and special arrangements, provisions, requirements,\nrules, specifications, and standards that form an integral part of\nan agreement or contract.\n\nAn agreement of sale constitutes the terms and conditions of\nsale of a property by the seller to the buyer. These terms and\nconditions include the amount at which it is to be sold and the\nfuture date of full payment.\n54. Traders\nIn farming community, a person who comes in the barangay who\nbuys products produce of the farmers.\n55. Traders Agents\nMiddleman between the traders and farmers who sells his\nproduce.\n56. Value adding\nactivities\nAre any activities that add value to the customer and meet the\nthree criteria for a Value Adding Activity. The three criteria for a\nValue Adding Activity are: The step transforms the item towards\ncompletion;\n\nAre activities that increase the value of a product along the\nmarket chain.\n\nIt includes but not limited to processing, packaging, sorting,\ncleaning, peeling, standard on size, length of produce, weight.\n57. Wholesaler\nA person or firm that buys large quantity of goods from various\nproducers or vendors, warehouse them, and resells to retailers.\n58. Yield risk\nis simply the risk of lower than expected production.\n\n--- PDF PAGE 101 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 99",
