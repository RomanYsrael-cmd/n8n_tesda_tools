    {
      "number": "4.1",
      "text": "1 To attain the National Qualification of AGROENTREPRENEURSHIP NC II, the candidate must demonstrate competence through a project-type assessment covering in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. Participate in workplace communication Work in team environment Practice career professionalism Practice occupational health and safety procedures Apply Safety Measures in Farm Operations Perform Estimation and Basic Calculation Provide Quality Customer Service Comply with Quality and Ethical Standards Assess Market Opportunities Establish Farm Production Plan Handle Finances Market Produce"
    },
    {
      "number": "4.1",
      "text": "2 The Qualification of AGROENTREPRENEURSHIP NCII may also be acquired through the accumulation of Certificates of Competency (COC’s) in the following units of competency. COC 1. CONDUCT MARKETING ACTIVITIES • Assess Market Opportunities • Market Produce COC 2. PREPARE FARM PLAN AND BUDGET • Establish Farm Production Plan • Handle Finances --- PDF PAGE 92 --- TR-Agroentrepreneurship NC II Promulgated February 3, 2017 90"
