  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of AGROENTREPRENEURSHIP NC\nII, the candidate must demonstrate competence through a project-type\nassessment covering in all units listed in Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\nBASIC COMPETENCIES\nParticipate in workplace communication\nWork in team environment\nPractice career professionalism\nPractice occupational health and safety procedures\nCOMMON COMPETENCIES\nApply Safety Measures in Farm Operations\nPerform Estimation and Basic Calculation\nProvide Quality Customer Service\nComply with Quality and Ethical Standards\nCORE COMPETENCIES\nAssess Market Opportunities\nEstablish Farm Production Plan\nHandle Finances\nMarket Produce\n\n4.1.2 The Qualification of AGROENTREPRENEURSHIP NCII may also be\nacquired through the accumulation of Certificates of Competency (COC’s)\nin the following units of competency.\n\nCOC 1. CONDUCT MARKETING ACTIVITIES\n• Assess Market Opportunities\n• Market Produce\n\nCOC 2. PREPARE FARM PLAN AND BUDGET\n• Establish Farm Production Plan\n• Handle Finances\n\n--- PDF PAGE 92 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017\n90\n\n4.1.3 Upon accumulation and submission of all COCs acquired, an individual\nshall be issued the corresponding National Certificate\n\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s\nof competency.\n\n4.1.5 The following are qualified to apply for assessment and certification:\n\na. Graduating students/ trainees of WTR-registered programs or\ngraduates of NTR programs related to agro-entrepreneurship or\ngraduate of enterprise-based training programs or\nb. At least two (2) years work experience in implementing Agroenterprise\ndevelopment or any related field (wage employed or self-employed)\n\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency.\n\n4.1.7 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as by industry.\n\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\n\n--- PDF PAGE 93 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017\n91\n\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 94 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 92\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nSupermarket of Competencies\nAGRICULTURE, FORESTRY AND FISHERY SECTOR\n\nAssess Market\nOpportunities\n\nEstablish Farm\nProduction Plan\nHandle\nFinances\n\nMarket\nProduce\nCORE\nCOM PETENCIES\nCOMMON\nCOMPETENCIES\nApply Safety\nMeasures in\nFarm\nOperations\nPerform\nEstimation and\nBasic\nCalculation\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASICCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational\nhealth and safety\nprocedures\nProvide Quality\nCustomer\nService\nComply with\nQuality and\nEthical\nStandards\n\n--- PDF PAGE 95 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 93\n"
