  "source_text": "Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\nBASIC COMPETENCIES\nParticipate in workplace communication\nWork in team environment\nPractice career professionalism\nPractice occupational health and safety procedures\nCOMMON COMPETENCIES\nApply Safety Measures in Farm Operations\nPerform Estimation and Basic Calculation\nProvide Quality Customer Service\nComply with Quality and Ethical Standards\nCORE COMPETENCIES\nAssess Market Opportunities\nEstablish Farm Production Plan\nHandle Finances\nMarket Produce\n\n4.1.2 The Qualification of AGROENTREPRENEURSHIP NCII may also be\nacquired through the accumulation of Certificates of Competency (COC’s)\nin the following units of competency.\n\nCOC 1. CONDUCT MARKETING ACTIVITIES\n• Assess Market Opportunities\n• Market Produce\n\nCOC 2. PREPARE FARM PLAN AND BUDGET\n• Establish Farm Production Plan\n• Handle Finances\n\n--- PDF PAGE 92 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017\n90\n\n4.1.3 Upon accumulation and submission of all COCs acquired, an individual\nshall be issued the corresponding National Certificate\n\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s\nof competency.\n\n4.1.5 The following are qualified to apply for assessment and certification:\n\na. Graduating students/ trainees of WTR-registered programs or\ngraduates of NTR programs related to agro-entrepreneurship or\ngraduate of enterprise-based training programs or\nb. At least two (2) years work experience in implementing Agroenterprise\ndevelopment or any related field (wage employed or self-employed)\n\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency.\n\n4.1.7 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as by industry.\n\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\n\n--- PDF PAGE 93 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017\n91\n\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 94 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 92\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nSupermarket of Competencies\nAGRICULTURE, FORESTRY AND FISHERY SECTOR\n\nAssess Market\nOpportunities\n\nEstablish Farm\nProduction Plan\nHandle\nFinances\n\nMarket\nProduce\nCORE\nCOM PETENCIES\nCOMMON\nCOMPETENCIES\nApply Safety\nMeasures in\nFarm\nOperations\nPerform\nEstimation and\nBasic\nCalculation\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASICCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational\nhealth and safety\nprocedures\nProvide Quality\nCustomer\nService\nComply with\nQuality and\nEthical\nStandards\n\n--- PDF PAGE 95 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 93\nDEFINITION OF TERMS\n\n1.\nAgroenterprise\nRefers to the business of organized farmers that actively work\nwith market actors, having relationships with buyers of their\nproducts and business service providers that support the\nmovement of their products in the market chain at a profit.\n2.\nBudget Plan\nDocument which covers the farm activities with corresponding\ncost and a plan where to source and allocate the funds.\n3.\nBusiness\nDevelopment\nService\nProviders\nsupport the market chain to function but they do not directly\nhandle the product. This includes micro-credit providers,\ntransportation providers, market information service, trainings,\ntransportation services, warehouse and cold storage facilities\nproviders, pre-postharvest facilities providers and input\nsuppliers.\n4.\nBuyer/\ntraditional local\nbuyer\nA person who makes a purchase;\n\nHave no formal arrangements with farmers before buying their\nproduct;\n\nTake part in spot trading – prices change daily or hourly based\non supply and demand;\n\nAre accessible to farmers in rural areas.\n\na party which acquires, or agrees to acquire, ownership (in case\nof goods),or benefit or usage (in\ncase\nof services),in\nexchange for money or other consideration under a contract of\nsale. This includes but not limited to processor or manufacturer,\nsupermarket, local traders, trading centers, public market,\nwholesaler, retailer.\n5.\nClassroom\nTraining\nThis type of training is facilitated by an instructor either on-line\nor in a classroom setting. Instructor-led training allows for\nlearners and instructors or facilitators to interact and discuss\nthe training material, either individually or in a group setting.\n6.\nCollected\ninformation\nis the process of gathering of data on targeted variables in an\nestablished systematic fashion, which then enables one to\nanswer relevant questions and evaluate outcomes\n\nIt is a systematic approach to gathering data from a variety of\nsources to get a complete and accurate picture of an area of\ninterest.\n7.\nConsolidators\nA frim which groups together orders from different companies\ninto one shipment\n\n--- PDF PAGE 96 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 94\n8.\nContingency\nPlan\nA contingency plan is a plan devised for an outcome other than\nin the usual (expected) plan. It is often used for risk management\nwhen an exceptional risk that, though unlikely, would have\ncatastrophic consequences.\n\nDesigned to take a possible future event or circumstance into\naccount.\n9.\nContract risk\nis the risk of contract default by the producer or the contractor.\n10. Corrective\nmeasures\nare the actions taken to prevent the recurrence of an event that\ncaused the problem initially.\n11. Criteria\na principle or standard by which something may be judged or\ndecided.\n12. Diversification\nprimarily involves a substitution of one crop or other agricultural\nproduct for another, or an increase in the number of enterprises,\nor activities, carried out by a particular farm.\n13. Farm\ndiversification/\nexpansion\nA business decision for farmer to engage in more agricultural\nproducts in addition to the existing.\n\nA business decision for farmer to increase production capacity\nwith implications to funding requirements in terms of farm inputs\nand land area\n\n14. Farm gate\nprice\nthe price for the sale of farm produce direct from the producer.\n15. Farm Plan\nSchedule\nDetailed period or time frame of farm production activities\nspecifying the need for financing\n16. Farm\nProduction\nactivities\n\nare specific farm tasks to be undertaken in producing from\ncomponents or raw materials.\n17. Farm\nproduction\nplan\nEncompasses all the details surrounding how your farm\noperation will produce products for market.\n18. Farm\nproduction\nrequirements\n\nThese are requirements used during crop production such as\ninputs, labor, farm machineries and equipment.\n19. Farm records\nare books used to record all farm events, happenings and\noperation on the farm.\n\n--- PDF PAGE 97 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 95\n20. Feedback\ninformation about reactions to a product, a person's\nperformance of a task, etc., used as a basis for improvement.\n21. Field activities/\nfield work\npractical work/activities conducted by a student/trainee in the\nnatural environment, rather than in a room.\n22. Financial\nObligation\nrefers to an obligation to pay money to another party that may\narise from borrowing funds or as a result of a legal compromise.\n\n23. Financial\nService\nProviders\ninstitutions or individuals that extend financial assistance either\nin form of loans or grants intended for a specific purpose.\n24. Industry\nPractice\nA method, procedure, process, or rule employed or followed by\na organization, group, niche in the pursuit of its objectives. It is\na practice may also refer to these collectively.\n25. Industry\nstandard\nGenerally accepted requirements followed by the members of\nan industry.\n26. Institutional\nbuyers\nRefers to a company or organization that purchases very large\nquantities of food.\n\nHave formal arrangements with farmers before buying their\nproduct. They negotiate on pricing-agreed before purchase.\n\nAre accessible to farmers that can pre-plan as part of formal\narrangements, and sometimes supplier accreditation as well.\n27. Local Market\nLocal market includes customers located within the region the\nproduct or service is produced or made available.\n28. Market\nis the place where people, and institutions buy and sell for their\nagents. A market can be organized as a physical market place\nwhere products are exchanged.\n29. Marketing\nis “the performance of business activities that direct the flow of\ngoods and services from producers to consumers or users”.\nmarketing - as “the development and efficient distribution of\ngoods and services for chosen consumer segments”;\n\nis the series of activities involved in finding out what customers\nwant and moving those products profitably from the point of\nproduction to the point of consumption (is the series of activities\ninvolved in finding out what customers want and moving those\nproducts profitably from the point of production to the point of\nconsumption\n\n--- PDF PAGE 98 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 96\n30. Marketing\nstrategy\nAn organization's strategy that combines all of its marketing\ngoals into one comprehensive plan. A good marketing strategy\nshould be drawn from market research and focus on the right\nproduct mix in order to achieve the maximum profit potential and\nsustain the business. The marketing strategy is the foundation\nof a marketing plan\n31. Market\nMapping\nA study of various market conditions that is plotted on a map to\nidentify trends and corresponding variables between the\nconsumers and products.\n32. Market Risks\nMarket risk is the risk of losses in positions arising from\nmovements in market prices and calamities\n33. Marketing\nTransaction\nis a business strategy that focuses on single, \"point of sale\"\ntransactions. The emphasis is on maximizing the efficiency and\nvolume of individual sales rather than developing a relationship\nwith the buyer.\n\nA strategy used in business targeting customers in making \"one\noff\" or point of sale transactions.\n\nTransactional marketing has the purpose of maximizing a\nbusiness's sales efficiency by boosting the volume of individual\nsales instead of developing an ongoing relationship with the\nconsumer.\n34. Marketing\narrangement\nA contract or agreement whether written or verbal between\nproducers and buyers\n35. Marketing\nobjective\nAre goals set by a business when promoting its products or\nservices to potential consumers that should be achieved within\na given time frame\n36. Marketing\nOperation\nbuilds accountability, alignment, and agility. The marketing\noperations (MO) function has emerged due to the need for a\nmore transparent, efficient, and accountable view of marketing.\n37. Marketing plan\nA marketing plan sets out how you are going to put your\nmarketing strategy into practice;\n\nProduct specific or market specific or company-wide plan that\ndescribes activities involved in achieving specific marketing\nobjectives\n38. Mode of\ndelivery\nby which a shipment is moved from point 'A' to point 'B', such as\nby air, rail, road, or sea.\n\n--- PDF PAGE 99 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 97\n39. Monitoring\nprice\nis the act of observing and checking the progress or quality of\n(something) over a period of time; and what happens to market\nprices in order to obtain useful knowledge and insights that may\nhelp decision makers, families or society at large in\nunderstanding\n40. Negotiation\nBargaining (give and take) process between two or more parties\n(each with its own aims, needs, and viewpoints) seeking to\ndiscover a common ground and reach an agreement to settle a\nmatter of mutual concern or resolve a conflict.\n41. Practicum\na specialized field of study, that is designed to give students/\ntrainees supervised practical application of a previously or\nconcurrently studied theory.\n42. Preference\na greater liking for one alternative over another or others.\n43. Price\nA value that will purchase a finite quantity, weight, or other\nmeasure of a good or service.\n\nIt is the cost or value of a good or service expressed in monetary\nterms, the price you can pay: tuition for receiving an education,\ninterest for receiving a loan, rent for living in a house or using a\npiece of equipment, salaries or wages for employing workers.\n44. Processors\nA person or entity that converts raw materials or semi-finished\ngoods for another company\n45. Produce\nis a generalized term for a group of farm-produced crops and\ngoods, including fruits and vegetables – meats, grains, oats, etc.\nare also sometimes considered produce.\n\n46. Product\nliability risk\nis the risk that a producer may be liable for any problems\nassociated with the grain they have sold.\n47. Production\nmodule\nis a guide to create standardized units of production.\n\n48. Production\nrisks\nany production related activity or event that is uncertain is a\nproduction risk\n49. Projected\nvolume\nassumed quantity of produce to forecast sales. Factors\nconsidered are land area size, variety of seeds/ breed of\nlivestock and production risk calculated for a particular cropping\nseason.\n50. Quality risk\nis the risk of an unexpected quality level in the grain that affects\nthe grain’s value through discounts or reduced premiums.\n\n--- PDF PAGE 100 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 98\nQuality risk also includes the risk of the grain being rejected by\nthe buyer due to low quality or contamination.\n51. Relationship\nrisk\nis the risk of adversely affecting relationships with buyers,\nsuppliers, or other resource providers that are critical to the\nsuccess of the farm operation.\n52. Retailer\nA businessman or person that sells goods to the consumer\n53. Sales terms\nand conditions\nGeneral and special arrangements, provisions, requirements,\nrules, specifications, and standards that form an integral part of\nan agreement or contract.\n\nAn agreement of sale constitutes the terms and conditions of\nsale of a property by the seller to the buyer. These terms and\nconditions include the amount at which it is to be sold and the\nfuture date of full payment.\n54. Traders\nIn farming community, a person who comes in the barangay who\nbuys products produce of the farmers.\n55. Traders Agents\nMiddleman between the traders and farmers who sells his\nproduce.\n56. Value adding\nactivities\nAre any activities that add value to the customer and meet the\nthree criteria for a Value Adding Activity. The three criteria for a\nValue Adding Activity are: The step transforms the item towards\ncompletion;\n\nAre activities that increase the value of a product along the\nmarket chain.\n\nIt includes but not limited to processing, packaging, sorting,\ncleaning, peeling, standard on size, length of produce, weight.\n57. Wholesaler\nA person or firm that buys large quantity of goods from various\nproducers or vendors, warehouse them, and resells to retailers.\n58. Yield risk\nis simply the risk of lower than expected production.\n\n--- PDF PAGE 101 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 99\nACKNOWLEDGEMENTS\n\n\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of these Training Regulations.\n\nThis undertaking was also made possible through the collaborative project\nbetween TESDA and Department of Agrarian Reform (DAR).\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\n\nARNOLD G. AGBADA\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Road, Diliman, Quezon City\nFERNANDO G. LLABORE\nTechnical Expert\nSta. Josefa Agusan del Sur United\nFarmers Assn (SJASUFA)\nPoblacion. Sta. Josefa, Agusan del Sur\nANDREA L. AQUINO\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nMabiniExtention, Cabanatuan City, Nueva\nEcija\nDENIZA J. LONGINO\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Rd. Diliman, Q.C.\nCHONA L. BAHIAN\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nM. Suniel-YakalSts., Carmen, Cagayan de\nOro City\nBEATRIZ A. PABROS\nTechnical Expert\nUmingan Farmers Agrarian Reform\nCoop (UFARCO)\nBrgy. Luna Este, Umingan, Pangasinan\nMA. ELENA C. CABAÑES\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Road, Diliman, Quezon City\nCARMELA O. PAGULONG\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Road, Diliman, Quezon City\nONESIMO L. CUYCO\nTechnical Expert\nNational Livelihood Development\nCorporation (NLDC)\n845 Arnaiz Ave., Makati City\nRICARDO P. PERALTA JR.\nTechnical Expert\nUmingan Farmers Agrarian Reform\nCoop (UFARCO)\nBrgy. Luna Este, Umingan, Pangasinan\nREGENTE D. DIONEDA\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Road, Diliman, Quezon City\n\n\n\nNORBERTO S. QUITE\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Road, Diliman, Quezon City\n\n--- PDF PAGE 102 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 100\nRONNEL VICTOR J. DELA CRUZ\nTechnical Expert\nCatholic Relief Services (CRS)\n4F, Philamlife Bldg., Rizal St., Davao City\nAGNES U. ROJAS\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Road, Diliman, Quezon City\nJOEY V. ESTEBAN\nTechnical Expert\nLocal Government Unit-Llanera\nVictoria, Llanera, Nueva Ecija\nJOAN ANNA C. UY\nTechnical Expert\nCatholic Relief Services (CRS)\nMain Office, Intramuros, Manila\nRONILO E. GINES\nTechnical Expert\nCaridad Sur Farmer MPC/ Irrigators\nAssociation\nCaridad Sur, Llanera, Nueva Ecija\nDAVEN D. UY\nTechnical Expert\nFoundation for Rural and Industrial\nEquipment for National Development\n(FRIEND Foundation, Inc.)\nPBC Building, Lapinigan, BS, San\nFrancisco, Agusan del Sur\nWENCELITO F. GOMEZ\nTechnical Expert\nKalasag Farmer Producers Cooperative\n(KFPC)\nZ-1B San Agustin, San Jose City, Nueva\nEcija\nMA. CYNTHIA A. ZACATE\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Road, Diliman, Quezon City\nSUSANA E. LEONES\nTechnical Expert\nDepartment of Agrarian Reform (DAR)\nElliptical Road, Diliman, Quezon City\n\n\n• THE VALIDATORS:\n\nMAURO R. ALCIBAR\nLinabu, Agrarian Multi-purpose\nCooperative (LAMPCO)\nLinabu, Balingasag, Misamis Oriental\nLEIMIWEL Q. QUIAOIT\nPamayanangUmuunladnaLakas Ani\n(Punla-MPC)\nBrgy. Bosque, Llanera, Nueva Ecija\nJESSIE L. CALLANO\nHinatuan, Tagbina United Farmers Assn.\n(HUFA)\nTagbina, Surigao del Sur\nARBY A. VENTURA\nVegetable Growers\nCaridad Sur, Llanera, Nueva Ecija\nLOVELYN B. CATALAN\nCatholic Relief Services\nGuimba, Nueva Ecija\n\n--- PDF PAGE 103 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 101\nThe Members of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n\n TESDA – QSO Technical Facilitators\nCompetency Standards Development Division\nMS. BERNADETTE N. SERVAZ- AUDIJE\nMS. CHERRY L. TORALDE\nMS. MELCHRIS A. ATIS\nCompetency Programs and Standards Development Division\n\nMS. MERCEDES E. JAVIER\nMS.FORTUNATA L. BACO"
