get plan\n• Audio/ Video \nPresentation \n• Hands-on \n• Lecture \n• Discussion \n• Exercises \n• Demonstration \n• Oral Question \n• Written Exam \nTotal = 24 \nhours \n \nC: 8 hrs \nF: 16hrs \n \n3.2 Apply budget plan \n• Enumerate and discuss \ntypes of Organization \n• Lecture \n• Discussion \n• Oral Exam \n• Written exam \n• Demonstration\n\n--- PDF PAGE 81 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n79 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Discuss membership \nprocedures \n• Discuss procedure on \nsecuring loan \n• Enumerate loan \ndocuments and \nrequirement \n• Discuss financing terms \nand conditions of \ndifferent financial service \nproviders \n• Comply membership \nrequirements in an \norganization \n• Submit loan \nrequirements \n• List down financial \nobligations and their \nschedules \n• Settle loan amortization \nand other financial \nobligations\n• Audio/Video \nPresentation \n• Exercises \n• Role play \n• Hands-on \n3.3 Invest farm income \n• Discuss the concept of \nnet income, dividend, \npatronage refund, and \ninterest on savings \n• Enumerate possible \nareas of investments\n• Lecture \n• Discussion \n• Audio/Video \nPresentation \n• Exercises \n• Oral Exam \n• Written Exam \n• Demonstration\n\n--- PDF PAGE 82 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n80 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Explain the procedures \nin saving, asset \nacquisition and farm \nbusiness expansion or \ndiversification\n4. Market Produce \n \n4.1 Monitor prevailing price \nof produce \n• Discuss different types \nof buyers and trading \ncenters \n• Explain monitoring and \nits value in market \nnegotiation with buyers \n• Explain the sources of \nprice information \n• Discuss the methods in \ngathering price \ninformation \n• Explain record keeping \nof price information \n• Determine major buyers \nand trading centers of \nthe produce \n• Gather information on \nprice \n• Record price information \n• Lecture \n• Discussion \n• Exercises \n• Hands-on \n• Field visit \n• Written exam \n• Oral questioning \n• Demonstration \nTotal = 48 \nhrs \n \nC: 16hrs \nF: 32hrs \n4.2 Apply marketing \nstrategies \n• Enumerate different \ntypes of information \n• Discuss the importance \nof marketing strategies \n• Lecture \n• Discussion \n• Exercises \n• Field visit \n•Presentation\n• Written exam \n• Oral questioning \n• Demonstration\n\n--- PDF PAGE 83 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n81 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\nto attain the marketing \nobjective \n• Discuss the application \nof value adding activities \n• Explain the role and \nfunction of business \nservice providers for \nsustained marketing \n• Discuss product \nconsolidation and group \nmarketing \n• Present examples of \nfarmer collaboration in \nmarketing the products \n• Use collected \ninformation in market \nstrategizing \n• Apply value adding \nactivities \n• Identify services of \nbusiness development \nservice (BDS) providers \n• Demonstrate (Explain) \nconsolidation of produce \nand group marketing\n• Role play \n4.3 Sell produce \n• Explain market \nnegotiation \n• Discuss the kinds of \nmarketing arrangements \n• Lecture \n• Discussion \n• Exercises \n•Field visit\n• Written exam \n• Oral questioning \n• Demonstrate\n\n--- PDF PAGE 84 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n82 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Discuss preparation of \nproduce for selling \n• Explain product quality, \nhandling and traceability \nin selling the produce \n• Explain recordkeeping of \ndetails of marketing \ntransaction \n• Negotiate with buyers \nand business \ndevelopment service \nproviders \n• Establish sales terms \nand conditions \n• Prepare produce for \nselling \n• Deliver produce to \nbuyers \n• Sell the consolidated \nproducts \n• Record and keep details \nof marketing transaction\n• Role playing \n• Presentation \n• Audio/Video \nPresentation\n\n--- PDF PAGE 85 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n83",
