      "source_text": "Course Title: AGROENTREPRENEURSHIP NC Level NC II \n \nNominal Training Duration: \n20hrs–Basic Competencies \n \n \n \n \n 75hrs– Common Competencies \n \n \n 144hrs– Core Competencies \n \n \n ----------- \n \n \n 239hrs – Total \nCourse Description: \n \nThis course is designed to enhance the knowledge, desirable attitudes and \nskills of marketing and production coordinator. It includes competencies in assessing \nmarket opportunities, establishing farm production plan, handling finances and \nmarketing produce.\n\n--- PDF PAGE 57 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n55 \n \nBASIC COMPETENCIES \n20 Hours \n \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Participate in \nworkplace \ncommunication \n1.1 Obtain and convey \nworkplace information \n• Describe Organizational \npolicies\n• Group \ndiscussion \n• Oral evaluation \n4 Hours \n \n• Read: \no Effective \ncommunication\n• Lecture \n• Written \nexamination \n \n \n \no Written \ncommunication\n \n \n \no Communication \nprocedures and \nsystems\n \n \n \n• Identify: \no Different modes of \ncommunication \n \n \n \no Medium of \ncommunication\n \n \n \no Flow of \ncommunication\n \n \n \no Available technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n \n \n \n• Prepare different Types \nof question\n• Demonstration \n• Observation \n \n \n \n• Gather different sources \nof information\n\n--- PDF PAGE 58 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n56 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n \n \n• Apply storage system in \nestablishing workplace \n \ninformation\n \n• Demonstrate Telephone \ncourtesy\n \n1.2 Complete relevant \nwork related \ndocuments \n• Describe Communication \nprocedures and systems \n• Group \ndiscussion \n• Oral