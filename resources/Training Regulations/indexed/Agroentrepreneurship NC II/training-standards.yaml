emonstration \nof practical skills \n• Assertion & \nreason \n• Case \nstudy/records \n• Interviews\n\n--- PDF PAGE 75 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n73 \n \n \nCORE COMPETENCIES \n144 Hours \n \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Assess market \nopportunities \n \n \n \n1.1 Conduct market visits \n \n \n• Explain the basic \nconcept of marketing, \nmarket chain and flow of \nproducts, and kinds of \nbuyers \n• Draw the market map \nfrom farmer to \nbuyers/consumers \nshowing the product flow\n• Explain methods of data \ngathering \n• Discuss the interview \nquestions and tips in \nconducting the interview \n• Explain the basis for \nchoosing buyers to \nengage based on \ninterview results \n• Identify buyers \n• Interview buyers \n•Choose buyers\n• Lecture \n• Discussion \n• Visual \npresentation \n• Audio/Video \npresentation \n• Exercises \n• Field visit (bring \nsample \nproducts) \n• Role play \n• Written \nexamination \n• Oral questioning \n• Demonstration \nTotal: 40 \nhours\nC: 12 hrs \nF: 28 hrs \n1.2 Determine value adding \nactivities \n \n• Explain marketing \nconcepts to include \nsupply and demand, \nproduct flow, and value \naddition\n• Lecture \n• Discussion \n• Visual \npresentation \n• Written \nexamination \n• Oral questioning \n• Demonstration\n\n--- PDF PAGE 76 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n74 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Discuss various \nmarketing arrangements \nwith buyers that involve \nvalue adding activities \n• Explain marketing \nprojections of sales, \ncosts and profit \n• Explain the process of \ndeciding on value adding \nactivities to perform \nbased on marketing \nprojections of cost and \nprofit \n• determine flow of \nproduce from farm to \nselected buyer \n• identify value adding \nactivities \n• compute comparative \nprices and costs of value \nadding activities \n• select value adding \nactivities\n• Exercises \n• Field visit \n1.3 Prepare market plan \n \n \n• Explain the importance \nof having a marketing \nobjective \n• Discuss how to make a \nmarketing objective\n• Lecture \n• Discussion \n• Hands-on \n• Exercises \n• Written exam \n• Oral questioning \n• Demonstration\n\n--- PDF PAGE 77 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n75 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Determine/ Identify the \nsteps necessary to \nsuccessfully deliver the \nproduct from the farm to \nthe selected buyers \n• Discuss the process in \ncomputing the financial \ntargets of marketing \nprofit \n• Prepare marketing \nobjective \n• Establish steps in the \ndelivery of the product to \nselected buyers \n• Estimate targeted sales, \ncosts and marketing \nprofit \n• Compile details of \nmarketing plan \n• Discuss market risks \n• Explain contingency plan\n• Formulate contingency \nplan\n2. Establish farm \nproduction plan \n \n \n2.1 Review farm production \nplan \n \n \n• Explain the Basic farm \nassessment guide \n• Discuss the basic data \ngathering procedures \n• Explain the importance \nof gathering feedback \n• Lecture \n• Discussion \n• Audio/Video \nPresentation \n• Exercises \n•Field visit\n• Oral \nQuestioning \n• Demonstration \n• Written Exam \nTotal = 32 \nhours \nC: 8 hrs \nF: 24 hrs\n\n--- PDF PAGE 78 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n76 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Enumerate and explain \ntypes of record \n• Importance of record \nkeeping \n• Practice record keeping \n• Monitor Farm Production \nPerformance \n• Gather information and \nfeedback \n• Utilize Farm records \n• Enumerate types of farm \nrecords \n• Enumerate type of \nDiversification \n• Discuss the advantages \nof farm product \ndiversification\n• Interview \n2.2 Prepare farm \nproduction plan \n \n \n• Discuss the different \nfarm production \nrequirements \n• Discuss farm production \nactivities and how to \ncompute cost. \n• Discuss computation of \nCost and Return and its \nimportance \n• Discuss cropping \nseason/ duration per \nfarm product\n• Discussion \n• Audio/ Video \nPresentation \n• Lecture \n• Demonstration \n• Field visit \n• Hands-on \n• Oral Exam \n• Demonstration\n\n--- PDF PAGE 79 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n77 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Discuss Target setting \n• Discuss farm product \noptions appropriate to \ndifferent areas \n• Discuss different \nproduction risk and \npreventive measures/ \nsolutions \n• Determine reference of \nsuppliers and providers \n• Identify Farm production \nrequirements \n• Discuss Production \nmodule concept \n• Determine Farm \nProduction activities and \ncost \n• Compute volume of \nharvest \n• Formulated contingency \nplan \n• Prepare criteria of \nsuppliers and providers \n• Select suppliers and \nproviders\n2.3 Improve farm \nproduction plan \n \n \n• Explain adjustment \nprocedures on: \n- farm production \nactivities and costing \n• Discussion \n• Audio/Video \nPresentation \n•Lecture\n• Oral Exam \n• Demonstration\n\n--- PDF PAGE 80 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n78 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n- product diversification \n- projected volume \ntarget \n- applying corrective \nmeasures \n• Adjust Farm production \nactivities and costing \n• Adjust projected volume \n• Adjust corrective \nmeasures in the plan \n• Select improvements \n• Adjust improvements in \nthe plan\n3. Handle finances \n \n \n3.1 Prepare budget plan \n• Explain budget plan \n• Enumerate and discuss \ntypes of financial \nservices \n• Discuss criteria in \nselecting financial \nservice providers \n• Compute farm costs \n• Identify and select \nfinancial service \nproviders \n• Compile details of \nbudget plan\n• Audio/ Video \nPresentation \n• Hands-on \n• Lecture \n• Discussion \n• Exercises \n• Demonstration \n• Oral Question \n• Written Exam \nTotal = 24 \nhours \n \nC: 8 hrs \nF: 16hrs \n \n3.2 Apply budget plan \n• Enumerate and discuss \ntypes of Organization \n• Lecture \n• Discussion \n• Oral Exam \n• Written exam \n• Demonstration\n\n--- PDF PAGE 81 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n79 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Discuss membership \nprocedures \n• Discuss procedure on \nsecuring loan \n• Enumerate loan \ndocuments and \nrequirement \n• Discuss financing terms \nand conditions of \ndifferent financial service \nproviders \n• Comply membership \nrequirements in an \norganization \n• Submit loan \nrequirements \n• List down financial \nobligations and their \nschedules \n• Settle loan amortization \nand other financial \nobligations\n• Audio/Video \nPresentation \n• Exercises \n• Role play \n• Hands-on \n3.3 Invest farm income \n• Discuss the concept of \nnet income, dividend, \npatronage refund, and \ninterest on savings \n• Enumerate possible \nareas of investments\n• Lecture \n• Discussion \n• Audio/Video \nPresentation \n• Exercises \n• Oral Exam \n• Written Exam \n• Demonstration\n\n--- PDF PAGE 82 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n80 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Explain the procedures \nin saving, asset \nacquisition and farm \nbusiness expansion or \ndiversification\n4. Market Produce \n \n4.1 Monitor prevailing price \nof produce \n• Discuss different types \nof buyers and trading \ncenters \n• Explain monitoring and \nits value in market \nnegotiation with buyers \n• Explain the sources of \nprice information \n• Discuss the methods in \ngathering price \ninformation \n• Explain record keeping \nof price information \n• Determine major buyers \nand trading centers of \nthe produce \n• Gather information on \nprice \n• Record price information \n• Lecture \n• Discussion \n• Exercises \n• Hands-on \n• Field visit \n• Written exam \n• Oral questioning \n• Demonstration \nTotal = 48 \nhrs \n \nC: 16hrs \nF: 32hrs \n4.2 Apply marketing \nstrategies \n• Enumerate different \ntypes of information \n• Discuss the importance \nof marketing strategies \n• Lecture \n• Discussion \n• Exercises \n• Field visit \n•Presentation\n• Written exam \n• Oral questioning \n• Demonstration\n\n--- PDF PAGE 83 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n81 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\nto attain the marketing \nobjective \n• Discuss the application \nof value adding activities \n• Explain the role and \nfunction of business \nservice providers for \nsustained marketing \n• Discuss product \nconsolidation and group \nmarketing \n• Present examples of \nfarmer collaboration in \nmarketing the products \n• Use collected \ninformation in market \nstrategizing \n• Apply value adding \nactivities \n• Identify services of \nbusiness development \nservice (BDS) providers \n• Demonstrate (Explain) \nconsolidation of produce \nand group marketing\n• Role play \n4.3 Sell produce \n• Explain market \nnegotiation \n• Discuss the kinds of \nmarketing arrangements \n• Lecture \n• Discussion \n• Exercises \n•Field visit\n• Written exam \n• Oral questioning \n• Demonstrate\n\n--- PDF PAGE 84 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n82 \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Discuss preparation of \nproduce for selling \n• Explain product quality, \nhandling and traceability \nin selling the produce \n• Explain recordkeeping of \ndetails of marketing \ntransaction \n• Negotiate with buyers \nand business \ndevelopment service \nproviders \n• Establish sales terms \nand conditions \n• Prepare produce for \nselling \n• Deliver produce to \nbuyers \n• Sell the consolidated \nproducts \n• Record and keep details \nof marketing transaction\n• Role playing \n• Presentation \n• Audio/Video \nPresentation\n\n--- PDF PAGE 85 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n83 \n \n3.2 \nTRAINING DELIVERY \n \n1. The delivery of training shall adhere to the design of the curriculum. \nDelivery shall be guided by the principles of competency-based TVET. \n \na. Course design is based on competency standards set by the industry or \nrecognized industry sector; (Learning system is driven by competencies \nwritten to industry standards) \nb. Training delivery is learner-centered and should accommodate \nindividualized and self-paced learning strategies; \nc. Training can be done on an actual workplace setting, simulation of a \nworkplace and/or through adoption of modern technology. \nd. Assessment is based in the collection of evidence of the performance of \nwork to the industry required standards; \ne. Assessment of competency takes the trainee’s knowledge and attitude \ninto account but requires evidence of actual performance of the \ncompetency as the primary source of evidence. \nf. Training program allows for recognition of prior learning (RPL) or current \ncompetencies; \ng. Training completion is based on satisfactory performance of all specified \ncompetencies. \n \n2. The competency-based TVET system recognizes various types of \ndelivery modes, both on-and off-the-job as long as the learning is \ndriven by the competency standards specified by the industry. The \nfollowing training modalities and their variations/components may be \nadopted singly or in combination with other modalities when \ndesigning and delivering training programs: \n \n2.1 School/Institution- Based: \n \n• Dual Training System (DTS) / Dualized Training Program (DTP) \nwhich contain both in-school and in-industry training or fieldwork \ncomponents. \n \n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an \napproach in training designed to enhance the knowledge and skills \nof the trainee through actual experience in the workplace to acquire \nspecific competencies as prescribed in the training regulations. It is \nimperative that the deployment of trainees in the workplace is \nadhered to training programs agreed by the institution and enterprise \nand status and progress of trainees are closely monitored by the \ntraining institutions to prevent opportunity for work exploitation. \n \n• Project-based instruction is an authentic instructional model or \nstrategy in which students plan, implement and evaluate projects that \nhave real world applications.\n\n--- PDF PAGE 86 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n84 \n \n2.2 Enterprise-Based: \n \nEnterprise-based training may also be taken to mean a school or training \ncenter with one or more partner enterprise or an enterprise or group of \nenterprises setting up a common training facility or partnering with a \nschool or training center. \n \n• Enterprise-based Training - where training is implemented within \nthe organization/institution in accordance with the requirements of \nthe specific organization/institution. \n \nCommunity-Based –refers to a short program conducted or coordinated by \nNGOs, LGUs, training centers and other TVET providers which are intended \nto address the specific needs of a community. Such programs are usually \nconducted in informal settings such as barangay hall, basketball courts and \nother available venues in a community. \n \nPeer teaching/mentoring is a training modality wherein fast learners are \ngiven the opportunity to assist the slow learners.\n\n--- PDF PAGE 87 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n85 \n \n3.3 \nTRAINEE ENTRY REQUIREMENTS \n \nTrainees or students wishing to gain entry into this course should possess \nthe following requirements: \n \n• Able to read and write; \n• Able to communicate, both orally and in writing; and \n• Basic mathematical skills \n \n3.4 \nLIST OF TOOLS, EQUIPMENT AND MATERIALS \n \nAGROENTREPRENEURSHIP NC II \n \nRecommended list of tools, equipment and materials for the training of 25 \ntrainees for Agroentrepreneurship NC II \n \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQTY.\nQTY\nQTY.\nASSESS MARKET OPPORTUNITIES \n1 pair \nScissor \n1 set \nPortable speaker \nwith microphone\n10pcs \nMarking pen \n(permanent)\n1 pc \nStapler \n1 unit \ncamera phone \n10pcs \nMarking pen (white \nboard)/ chalk\n1 \nPuncher \n1 unit \nWhite / Black Board\n25 pcs \nBallpen \n \n \n \n \n25 pcs \nPencil \n5 \nCalculators \n \n \n25 pcs \nNotebook \n \n \n \n \n5 pcs \nMasking tape (1 \ninch)\n \n \n \n \n1 roll \nFlipchart \n \n \n \n \n100 pcs\nManila paper \n \n \n \n \n25 pcs \nCartolina \n \n \n \n \n1 pc \nRecord book \n \n \n \n \n2 \nreams\nBond paper \n \n \n \n \n1 box \nStaple wire \n \n \n \n \n5 pcs \nReference \nmaterials (manual, \nguide book)\n \n \n \n \n5 boxes\nCrayons (8 \npcs/box)\nESTABLISH FARM PRODUCTION PLAN \n1 pair \nScissor \n \n \n10 pcs \nMarking pen \n(permanent)\n1 pc \nStapler \n \n \n10pcs \nMarking pen (white \nboard)/ chalk\n1 \nPuncher \n \n \n25 pcs \nBallpen\n\n--- PDF PAGE 88 ---\nTR-Agroentrepreneurship NC II Promulgated February 3, 2017 \n86 \n \n \n \n \n \n25 pcs \nPencil \n5 \nCalculators \n1 set \nPortable speaker \nand microphone\n25 pcs \nNotebook \n \n \n1 unit \ncamera phone \n5 pcs \nMasking tape (1 \ninch)\n \n \n1 unit \nWhite / Black Boa