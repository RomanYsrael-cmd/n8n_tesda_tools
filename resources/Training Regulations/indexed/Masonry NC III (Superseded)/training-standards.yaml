    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for Masonry NC Level III.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: MASONRY NC: Level III\n\nNominal Training Hours: 20 hours (Basic)\n 24 hours (Common)\n 320 hours (Core)\n\nCourse Description:\n\n This course is designed to enhance the knowledge, desirable attitudes and\nskills of mason in accordance with industry standards. It covers core competencies\nsuch as preparation of masonry materials, performance of basic masonry works,\nlaying of bricks / blocks for structure, installation of pre-cast balusters and\nhandrails, application of special cement finishes to concrete and masonry surfaces\nand repair of defective concrete and masonry surfaces. It also includes\ncompetencies in workplace communication, teamwork, safety, use of hand tools,\nand house keeping\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\n communication\n1.1 Communicate information\n about workplace\n processes\n\n1.2 Lead workplace\n discussions\n\n1.3 Identify and communicate\n issues arising in the\n workplace\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n\n--- PDF PAGE 78 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 76\n\n2. Lead small team\n2.1 Provide team leadership\n\n2.2 Assign responsibilities\n\n2.3 Set performance\n expectations for team\n members\n\n2.4 Supervised team\nperformance\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n3. Solve\n workplace\n problems\n related to work\n activities\n3.1 Identify the problem\n\n3.2 Determine fundamental\n cause problem\n\n3.3 Determine correct /\n preventive action\n\n3.4 Provide recommendation\n to manager\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n4. Develop and\npractice\nnegotiation skills\n4.1 Identify relevant\n information in planning\n negotiations\n\n4.2 Participate in\nnegotiations\n\n4.2 Document areas for\nagreement\n\nDirect\nobservation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\n tools and techniques to\n solve problem\n\n5.2 Apply mathematical\n procedures / solution\n\n5.3 Analyze results\n\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\n technology\n\n6.2 Apply relevant\ntechnology\n\n6.3 Maintenance / enhance\n relevant technology\n\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical\nperformance test\n\n--- PDF PAGE 79 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 77\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n\n1.2 Requisition Materials\n\n1.3 Receive and inspect\nmaterials\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical\nExercise\n\nDemonstration\nDirect\nobservation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten / Oral Test\n\nDemonstration\n\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/ manuals\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect observation\n\nOral questioning\n\nWritten test or\nexamination\n\nThird party report\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n3. Perform\nmensuration and\ncalculation\n3.1 Select measuring\ninstruments\n\n3.2 Carry out measurements\nand calculations\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect observation\n\nOral questioning\n\nWritten test or\nexamination\n\nThird party report\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 80 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 78\n\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\nand equipment\n\n4.2 Perform basic preventive\nmaintenance\n\n4.3 Sharpen edge and tooth\ncutting tools\n\n4.4 Store tools and\nequipment\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation of\napplication of\ntasks\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Read / Interpret blueprints\n and plans\n\n5.2 Perform freehand\n sketching\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 81 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 79\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare masonry\n materials\n1.1 Select materials, tools\n and equipment needed\n in hauling and mixing\n\n1.2 Haul materials\n\n1.3 Mix mortar / concrete\n materials.\n\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n2. Perform basic\n masonry works\n2.1 Assist in re-bar\nfabrication and\ninstallation\n\n2.2 Erect and dismantle\nscaffolding (1.8m and\nbelow)\n\n2.3 Assist in fabrication,\ninstallation and\nstripping of formworks\n\n2.4 Perform excavation\nand backfilling /\ncompaction\n\n2.5 Assist in concrete\nworks\n\n2.6 Perform housekeeping\n\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 82 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 80\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Lay brick / block\n for structure\n3.1 Prepare for laying\nbricks/block for\nstructure\n\n3.2 Lay-out/established\nbrick/block structure\nlocation\n\n3.3 Perform laying\nbrick/block for structure\n\n3.4 Complete laying of\nbrick/block for structure\n\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n4. Plaster concrete/\nmasonry surface\n4.1 Prepare\nconcrete/masonry\nsurfaces for plastering\n\n4.2 Prepare for plastering\nconcrete /masonry\nsurfaces\n\n4.3 Perform plastering\nwork\n\n4.4 Complete plastering\n\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n5. Install pre-cast\nbaluster and\nhandrails\n5.1 Prepare for installing\n balusters and rails\n\n5.2 Perform pre-cast\n balusters and handrails\n installation\n\n5.3 Complete installation of\n pre-cast balusters and\n handrails\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 83 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 81\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Apply special\ncement finishes to\nconcrete and\nmasonry surfaces\n\n 6.1 Prepare for applying\n special cement finishes\n to concrete and\n masonry surfaces\n\n6.2 Perform surface\n preparation for special\n cement finishes to\n concrete and masonry\n surfaces\n\n6.3 Perform application of\n special cement finishes\n to concrete and\n masonry surfaces\n\n6.4 Complete application of\n special cement finishes\n to concrete and\n masonry surfaces\n\nGroup discussion\n& demonstration\n\nModular / self\npaced\n\nProject based\ninstruction\n\nOJT / DTS\n\nObservation\n\nDemonstration\n\nOral / Written\nexam\n\nInterview\n\nPortfolio\n\nRPL\n\n7. Repair defective\nConcrete and\n masonry\n surfaces\n7.1 Identify and rectify\n defective plastered\n surfaces\n\n7.2 Perform repairing\n defective concrete\n surfaces\n\n7.3 Complete repair of\n defective concrete and\n masonry surfaces\n\nDemonstration of\npractical skills\n\nDualized training\n\nModular\nresearch\n\nProject based\nInstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 84 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 82\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n--- PDF PAGE 85 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 83\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n•\ncan communicate both oral and written\n•\nphysically and mentally fit\n•\nWith good moral character\n•\ncan perform basic Mathematical computation\n\n--- PDF PAGE 86 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 84\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR MASONRY NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Masonry NC III.\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 pcs.\nBucket\n1 unit\nOne bagger mixer\n625\npcs.\nConcrete Hallow\nblocks\n1 pc\nMixing board\n25 sets PPE\n4450\npcs.\nBricks\n12 pcs\nShovel/spade\n1 set\nAutomatic level\n(optional)\n20\nbags\nCement\n25 pcs\nSteel trowel\n1 unit\nWelding machine\n6 m3\nSand/Fine\naggregates\n25 pcs\nWooden float\n2 units\nDisk grinder\n50\npcs.\nReinforcing bars (10\nmm dia)\n25 pcs\nSteel tape\n2 pcs.\nHammer drill\n\nWater\n6 pcs\nMason hammer\n2 pcs.\nElectric drill\n20 kls.\nGI wire\n6 pcs\nPlumb bob\n1 unit\nConcrete vibrator\n10 kls.\nCommon wire Nails\n(assorted sizes)\n1 set\nScaffolding\n1 unit\nSlump cone\n100\npcs.\nLumber(2” x 2” x\n10’)\n6 pcs\nMarking gauge\n1 unit\nConcrete cylinder\nmould\n5 kls.\nConcrete nails\n6 pcs\nHand saw\n1 unit\nBeam mould\n25\npcs.\nPencil\n2 pcs\nBar cutter\n1 unit\nPallet track\n5 kls.\nNylon string\n2 pcs\nBar bender\n1 unit\nWater sprayer\n6 m3\nGravel/Coarse\naggregates\n4 pcs\nSteel square\n1 unit\nAir compressor\n5 m\nSand Screen\n100mm\n25 pcs\nCold chisel\n1 unit\nHollow block\nmachine\n2 gals. Concrete neutralizer\n12 pcs\nHacksaw\n1 unit\nCompactor\n9 pcs\nPlywood ½” X 4’ X\n8’\n6 pcs\nLevel hose\n\n12\npcs.\nHandrails 3”x4”x8”\n25 pcs\nStraight edge\n\n1 set\nSteel scaffolding\n6 pcs\nSpirit level\n\n1 set\nGrinding wheel\n25 pcs\nClaw hammer\n\n6 pcs. Diamond concrete\ncutter\n25 pcs\nChalk line\n\n25 pcs\nSteel float\n\n4 pcs\nMeasuring box\n\n2 dozen Hack saw blade\n\n--- PDF PAGE 87 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 85\n5 kls\nWelding rod\n\n12 pcs\nTri-square\n\n25 pcs\nSteel brush\n\n4 pcs\nWheel borrow\n\n25 pcs\n4” Paint Brush\n\n25 pcs\n2” Paint Brush\n\n12 pcs\nClaw bar\n\n4 pcs\nSledge hammer\n\n20\nmeters\nRope 1“ dia.\n\n4 pcs\nPulley\n\n1 set\nDrill bits\n\nNOTE: Estimate of materials was based on an individual project of a 1m X 2m wall with 8” X 8” X 1m\nconcrete post hence, the kind and quantity of materials will vary accordingly on the type of projects designed.\n\n--- PDF PAGE 88 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 86\n\n3.5 TRAINING FACILITIES\n\nBased on a class size of 25 students/trainees\n\nTEACHING/LEARNING AREAS\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN SQ.\nMETERS\n Open plain ground\n\n625\n Lecture Room (job site/school)\nincluding wash area\n\n62.5\nTotal Workshop Area\n\n687.50\n\n3.6 TRAINER’S QUALIFICATION CONSTRUCTION SECTOR\n\nMASONRY – NC III\n\nMust have undergone training on Training Methodology II(TM II)\nMust be a holder of National Certificate Level III\nGood moral character\nMust be physically and mentally fit\n*Must have at least 5 years industry experience and/or teaching\nexperience\n\n*Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 89 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 87"
