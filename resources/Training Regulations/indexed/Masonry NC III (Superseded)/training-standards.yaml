    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: MASONRY NC: Level III\n\nNominal Training Hours: 20 hours (Basic)\n 24 hours (Common)\n 320 hours (Core)\n\nCourse Description:\n\n This course is designed to enhance the knowledge, desirable attitudes and\nskills of mason in accordance with industry standards. It covers core competencies\nsuch as preparation of masonry materials, performance of basic masonry works,\nlaying of bricks / blocks for structure, installation of pre-cast balusters and\nhandrails, application of special cement finishes to concrete and masonry surfaces\nand repair of defective concrete and masonry surfaces. It also includes\ncompetencies in workplace communication, teamwork, safety, use of hand tools,\nand house keeping\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\n communication\n1.1 Communicate information\n about workplace\n processes\n\n1.2 Lead workplace\n discussions\n\n1.3 Identify and communicate\n issues arising in the\n workplace\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n\n--- PDF PAGE 78 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 76\n\n2. Lead small team\n2.1 Provide team leadership\n\n2.2 Assign responsibilities\n\n2.3 Set performance\n expectations for team\n members\n\n2.4 Supervised team\nperformance\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n3. Solve\n workplace\n problems\n related to work\n activities\n3.1 Identify the problem\n\n3.2 Determine fundamental\n cause problem\n\n3.3 Determine correct /\n preventive action\n\n3.4 Provide recommendation\n to manager\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n4. Develop and\npractice\nnegotiation skills\n4.1 Identify relevant\n information in planning\n negotiations\n\n4.2 Participate in\nnegotiations\n\n4.2 Document areas for\nagreement\n\nDirect\nobservation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\n tools and techniques to\n solve problem\n\n5.2 Apply mathematical\n procedures / solution\n\n5.3 Analyze results\n\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\n technology\n\n6.2 Apply relevant\ntechnology\n\n6.3 Maintenance / enhance\n relevant technology\n\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical\nperformance test\n\n--- PDF PAGE 79 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 77\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n\n1.2 Requisition Materials\n\n1.3 Receive and inspect\nmaterials\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical\nExercise\n\nDemonstration\nDirect\nobservation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten / Oral Test\n\nDemonstration\n\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/ manuals\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect observation\n\nOral questioning\n\nWritten test or\nexamination\n\nThird party report\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n3. Perform\nmensuration and\ncalculation\n3.1 Select measuring\ninstruments\n\n3.2 Carry out measurements\nand calculations\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect observation\n\nOral questioning\n\nWritten test or\nexamination\n\nThird party report\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 80 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 78\n\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\nand equipment\n\n4.2 Perform basic preventive\nmaintenance\n\n4.3 Sharpen edge and tooth\ncutting tools\n\n4.4 Store tools and\nequipment\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation of\napplication of\ntasks\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Read / Interpret blueprints\n and plans\n\n5.2 Perform freehand\n sketching\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 81 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 79\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare masonry\n materials\n1.1 Select materials, tools\n and equipment needed\n in hauling and mixing\n\n1.2 Haul materials\n\n1.3 Mix mortar / concrete\n materials.\n\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n2. Perform basic\n masonry works\n2.1 Assist in re-bar\nfabrication and\ninstallation\n\n2.2 Erect and dismantle\nscaffolding (1.8m and\nbelow)\n\n2.3 Assist in fabrication,\ninstallation and\nstripping of formworks\n\n2.4 Perform excavation\nand backfilling /\ncompaction\n\n2.5 Assist in concrete\nworks\n\n2.6 Perform housekeeping\n\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 82 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 80\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Lay brick / block\n for structure\n3.1 Prepare for laying\nbricks/block for\nstructure\n\n3.2 Lay-out/established\nbrick/block structure\nlocation\n\n3.3 Perform laying\nbrick/block for structure\n\n3.4 Complete laying of\nbrick/block for structure\n\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n4. Plaster concrete/\nmasonry surface\n4.1 Prepare\nconcrete/masonry\nsurfaces for plastering\n\n4.2 Prepare for plastering\nconcrete /masonry\nsurfaces\n\n4.3 Perform plastering\nwork\n\n4.4 Complete plastering\n\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n5. Install pre-cast\nbaluster and\nhandrails\n5.1 Prepare for installing\n balusters and rails\n\n5.2 Perform pre-cast\n balusters and handrails\n installation\n\n5.3 Complete installation of\n pre-cast balusters and\n handrails\nLecture\n\nDemonstration\n\nOn-the-Job\n\nDual training\n\nProject-based\ninstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 83 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 81\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Apply special\ncement finishes to\nconcrete and\nmasonry surfaces\n\n 6.1 Prepare for applying\n special cement finishes\n to concrete and\n masonry surfaces\n\n6.2 Perform surface\n preparation for special\n cement finishes to\n concrete and masonry\n surfaces\n\n6.3 Perform application of\n special cement finishes\n to concrete and\n masonry surfaces\n\n6.4 Complete application of\n special cement finishes\n to concrete and\n masonry surfaces\n\nGroup discussion\n& demonstration\n\nModular / self\npaced\n\nProject based\ninstruction\n\nOJT / DTS\n\nObservation\n\nDemonstration\n\nOral / Written\nexam\n\nInterview\n\nPortfolio\n\nRPL\n\n7. Repair defective\nConcrete and\n masonry\n surfaces\n7.1 Identify and rectify\n defective plastered\n surfaces\n\n7.2 Perform repairing\n defective concrete\n surfaces\n\n7.3 Complete repair of\n defective concrete and\n masonry surfaces\n\nDemonstration of\npractical skills\n\nDualized training\n\nModular\nresearch\n\nProject based\nInstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 84 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 82"
