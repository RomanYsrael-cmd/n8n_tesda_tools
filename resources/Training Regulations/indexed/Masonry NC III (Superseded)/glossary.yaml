  "source_text": "1. Baluster\nRefers to a post, which supports a handrail and encloses the\nopen sections of a stairway.\n\n2. Competency\nIs the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace.\n\n3. Cement\nIs a dry powder from silica, alumina, lime, iron oxide and\nmagnesia which hardens when mix with water.\n\n4. Certification\nRefers to the process of verifying and validating competencies of\na person through assessment.\n\n5. Dowel\nA headless, cylindrical pin which, is sunk into corresponding\nholes.\n6. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person who\nworks in a particular area of work is able to perform.\n\n7. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills, resource implications, context of assessment and\nassessment method.\n\n8. Form works\nRefer to the temporary wooden casing used to contain concrete\nduring its placing and hardening.\n9. General Masonry Refers to the preparation and placement of concrete for\nstructures; finishing masonry surfaces by plastering, chipping,\ngrinding, jointing, sand blasting, terrazzo and other related\nprocesses; installation, laying, fitting and setting of masonry\nproducts, such as bricks, stones, marble tiles, mosaic panels\nand similar or associated materials.\n\n10. Grout\nRefers to a fluid mixture of cement and water, or a mixture of\ncement, sand and water.\n\n11. Handrail\nRefers to a narrow rail to be grasped by a person for support.\n\n12. Level\nRefers to the category following the level of difficulty and\ncomplexity of skills and knowledge required to do the job.\n\n13. Lintel\nRefers to the horizontal member over an opening such as door\nor window, usually carrying the load.\n\n--- PDF PAGE 92 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 90\n\n14. Mortar\nRefers to a mixture of cement lime and sand used for laying\nbricks or masonry.\n\n15. Philippine\n TVET\n Qualification\nFramework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter\nfor the integration of learning and assessment in the middle skills\ndevelopment.\n\n16. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person\nhas achieved competencies relevant to a trade or industry.\n\n17. Range of\nVariable\nIt describes the circumstances or context in which the work is to\nbe performed.\n\n18. Reinforcing bar Refers to the steel rods that are embedded in building materials\nsuch as concrete for reinforcement.\n\n19. Scaffold\nRefers to a temporary or movable platform supported on the\nground or suspended, used for working at considerable heights\nabove the ground.\n\n20. Terrazo\nRefers to a mosaic surface made by embedding marble or\ngranite chips in mortar, allowing the mortar to harden, and the\ngrinding and polishing the surface.\n\n21. Unit of\n Competency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n\n--- PDF PAGE 93 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 91",
