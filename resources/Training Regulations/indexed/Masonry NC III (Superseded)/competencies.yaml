        "evidence_guide": {
          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified correctly defective concrete / masonry surfaces for\nrepair.\n1.2 Leveled uniformly concrete / masonry surfaces consistent with\n existing finishes.\n1.3 Complied with OHSA application at worksite.\n1.4 Selected and used appropriate processes, tools and equipment to\n carry out tasks.\n1.5 Identified, minimized and eliminated safety hazards\n1.6 Erected scaffolds / mounted ladder in accordance with OHSA\n regulations (if necessary).\n1.7 Communicated accurately with others, where applicable, to\n ensure safe and effective work operations.\n1.8 Repaired of concrete and masonry surfaces according to\n job requirements.\n1.9 Economized the use of materials.\n\n2. Underpinning\nKnowledge\n\n2.1 Safe work practices and first aid regulations\n 2.1.1 Prevention of accidents\n 2.1.2 Appropriate actions to take when accidents occur\n 2.1.3 First aid treatments and regulations\n 2.1.4 Safe handling of materials, tools and equipment\n 2.1.5 Housekeeping for safety\n 2.1.6 Safety signs and symbols\n 2.1.7 Rules on the safe use of scaffolds and ladders\n2.2 Trade Mathematics and Mensuration\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of Mathematics\n2.3 Materials\n 2.4.1 Types / Uses of special cement / Mortar finishes\n 2.4.2 Scaffoldings / Ladder and construction materials\n2.5 Methods and processes\n 2.5.1 Prepare and mix process of special concrete /\n masonry surfaces\n 2.5.2 Repair procedures\n2.6 Masonry tools and equipment\n 2.6.1 Types and uses of trowels\n 2.6.2 Chipping tools\n 2.6.3 Measuring tools\n 2.6.4 Proper use of hand tools\n\n--- PDF PAGE 76 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 74\n3. Underpinning\nSkills\n\n3.1 Working safely\n3.2 Interpreting work instructions\n3.3 Identifying defective concrete and masonry surfaces\n3.3 Repairing defective concrete and masonry surfaces\n3.5 Proper handling of tools and equipment\n3.6 Installing / dismantling of scaffolding and / or mounting ladder\n3.7 Using PPE properly\n3.8 Performing good housekeeping\n3.9 Demonstrating good working relation with co-workers\n3.10 Communicating effectively\n\n4. Resource\nImplications\nThings necessary in order to conduct method of assessment:\n4.1 Workplace location / simulated workplace setting\n4.2 Tools and equipment appropriate to construction processes\n4.3 Scaffolding / platforms / ladder required for activity\n4.4 Special cement finishes and materials relevant to the proposed\n activity\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct Observation\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n5.5 Demonstration\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 77 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 75"
        },
        "source_text": "CON712307\n\nUNIT DESCRIPTOR : This unit describes the outcomes required to perform\ndefective concrete surfaces. It deals with the skills\nrequired for identifying and rectifying defective concrete\nand masonry surface from completing repair work.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify defective concrete and\nmasonry surface\n 1.1 Defective concrete / masonry surface is\n identified and reported to the immediate\n supervisor.\n1.2 Prepare and select materials, tools and\n equipment for repair work in line with job\n requirements\n1.3 Select PPE in line with job requirements\n1.4 Work site is cleaned in line with safety regulations\n\n2. Repair defective concrete /\nmasonry surfaces\n2.1 Use PPE in line with job requirements.\n2.2 Chip-off, and clean all defective concrete /\n masonry surfaces in accordance to rectification\n procedure.\n2.3 Level concrete and masonry surfaces to be\n repaired / finishes according to job requirements.\n2.4 Prepare and mix concrete and masonry materials\n in line with job requirements.\n2.5 Grout all defective concrete and masonry surfaces\n before repairing.\n2.6 Retouch defective concrete / masonry corners /\n surfaces following established / recommended\n procedures.\n2.7 Perform good housekeeping.\n\n3. Check repaired concrete and\nmasonry surfaces\n3.1 Make final checks to ensure that work\n conforms with instructions and job requirements\n3.2 Inform immediate superior upon completion of\n work.\n3.3 Tools, equipment and any surplus resources\n and materials are checked and monitored in\n accordance with established procedures.\n3.4 Performs good housekeeping.\n\n--- PDF PAGE 73 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 71\n\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Materials\n\nMay include but not limited to:\n1.1 Special cement finishes\n1.1.1 Colored cement\n1.1.2 Shell\n1.1.3 Pebbles\n1.1.4 Granolithic terrazzo\n1.1.5 Adobe stone\n1.1.6 Refractory materials\n1.2 Portland cement\n1.3 Water\n1.4 Sand (Screened)\n1.5 Additives\n\n2. Tools and equipment\n\nMay include but not limited to:\n2.1 Mixing board\n2.2 Pointed trowel\n2.3 Foam / Sponge\n2.4 Edger / Grinder\n2.5 Scaffolding / ladder\n2.6 Hammer\n2.7 Wooden float\n2.8 Shovel\n2.9 Steel float\n2.10 Pail\n2.11 Cold chisel\n2.12 Brush\n2.13 Sandblasting equipment\n2.14 Axe\n2.15 Nylon string\n2.16 Leveling hose / spirit level\n2.17 Plumb bob\n\n3. PPE\n\n3.1 Safety Gloves\n3.2 Dust Mask\n3.3 Safety belt / body harness\n3.4 Safety shoes\n3.5 Safety Helmet\n3.6 Proper working clothes\n3.7 Safety glasses / goggles\n3.8 Lifeline\n\n--- PDF PAGE 74 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 72\n\n4. Final checks\n4.1 Plumbness\n4.2 Levelness\n4.3 Squareness\n4.4 Concrete quality\n4.5 Smoothness, if necessary\n4.6 Color consistency / uniformity\n\n--- PDF PAGE 75 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 73\nEVIDENCE GUIDE\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified correctly defective concrete / masonry surfaces for\nrepair.\n1.2 Leveled uniformly concrete / masonry surfaces consistent with\n existing finishes.\n1.3 Complied with OHSA application at worksite.\n1.4 Selected and used appropriate processes, tools and equipment to\n carry out tasks.\n1.5 Identified, minimized and eliminated safety hazards\n1.6 Erected scaffolds / mounted ladder in accordance with OHSA\n regulations (if necessary).\n1.7 Communicated accurately with others, where applicable, to\n ensure safe and effective work operations.\n1.8 Repaired of concrete and masonry surfaces according to\n job requirements.\n1.9 Economized the use of materials.\n\n2. Underpinning\nKnowledge\n\n2.1 Safe work practices and first aid regulations\n 2.1.1 Prevention of accidents\n 2.1.2 Appropriate actions to take when accidents occur\n 2.1.3 First aid treatments and regulations\n 2.1.4 Safe handling of materials, tools and equipment\n 2.1.5 Housekeeping for safety\n 2.1.6 Safety signs and symbols\n 2.1.7 Rules on the safe use of scaffolds and ladders\n2.2 Trade Mathematics and Mensuration\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of Mathematics\n2.3 Materials\n 2.4.1 Types / Uses of special cement / Mortar finishes\n 2.4.2 Scaffoldings / Ladder and construction materials\n2.5 Methods and processes\n 2.5.1 Prepare and mix process of special concrete /\n masonry surfaces\n 2.5.2 Repair procedures\n2.6 Masonry tools and equipment\n 2.6.1 Types and uses of trowels\n 2.6.2 Chipping tools\n 2.6.3 Measuring tools\n 2.6.4 Proper use of hand tools\n\n--- PDF PAGE 76 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 74\n3. Underpinning\nSkills\n\n3.1 Working safely\n3.2 Interpreting work instructions\n3.3 Identifying defective concrete and masonry surfaces\n3.3 Repairing defective concrete and masonry surfaces\n3.5 Proper handling of tools and equipment\n3.6 Installing / dismantling of scaffolding and / or mounting ladder\n3.7 Using PPE properly\n3.8 Performing good housekeeping\n3.9 Demonstrating good working relation with co-workers\n3.10 Communicating effectively\n\n4. Resource\nImplications\nThings necessary in order to conduct method of assessment:\n4.1 Workplace location / simulated workplace setting\n4.2 Tools and equipment appropriate to construction processes\n4.3 Scaffolding / platforms / ladder required for activity\n4.4 Special cement finishes and materials relevant to the proposed\n activity\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct Observation\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n5.5 Demonstration\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 77 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 75"
