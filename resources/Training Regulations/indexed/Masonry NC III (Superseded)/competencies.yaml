te and CW nails \n1.5 Water \n \n2.  Tools and equipment  \nMay include but are not limited to : \n2.1 Mason's hammer      \n2.2 Scaffolding \n2.3 Steel tape / push-pull rule \n2.4 Plumb bob \n2.5 Leveling tools ( leveling hose, spirit level) \n2.6 Pail \n2.7 Mortar box \n2.8 Pointed trowel \n2.9 Wooden float \n2.10 Steel float \n2.11 Shovel \n2.12 Foam / paper \n2.13 Straight edge / screed (bara) \n2.14 Mason’s brush \n2.15 Claw hammer \n \n3.  PPE \n \n \n \n \n3.1 Safety shoes \n3.2 Safety belt / body harness \n3.3 Safety helmet \n3.4 Proper working clothes \n4. Final checks  \n4.1 Plumbness \n4.2 Levelness \n4.3 Squareness \n4.4 Evenness or flatness of surface\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              58"
