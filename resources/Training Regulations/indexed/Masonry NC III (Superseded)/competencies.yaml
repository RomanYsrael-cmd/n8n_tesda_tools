        "source_title": "APPLY SPECIAL CEMENT FINISHES TO CONCRETE AND MASONRY SURFACES",
        "source_text": "--- PDF PAGE 66 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              64\nUNIT OF COMPETENCY       : APPLY SPECIAL CEMENT FINISHES TO CONCRETE \nAND MASONRY SURFACES  \nUNIT CODE                            : CON712306 \n \nUNIT DESCRIPTOR               : This describes the outcomes required to apply special \ncement finishes to concrete and masonry surfaces. It \ndeals with the skills required to perform surface \npreparation and application of special cement finishes.  \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \n Range of Variables \n1.  Select tools, equipment and \nstage mixed grout of special \ncement finishes for concrete \nand masonry surfaces  \n \n1.1 Plans and details are interpreted as per job   \n       requirements. \n1.2  Materials, tools and equipment are prepared  \n       and selected consistent with job requirements.  \n1.3  Grout is proportioned and mixed in accordance   \n       with job requirements.  \n1.4  Materials are properly staged / stockpiled at     \n       designated workplace and freed from any foreign  \n       matters.  \n \n2.  Prepare concrete and \nmasonry surfaces for special \ncement finishes  \n \n2.1 Select and use PPE according to job \nrequirements.  \n2.2  Identify surface area for special cement finishes  \n       to concrete and masonry surfaces in accordance \n       with plans and details.  \n2.3 Perform preparation of concrete and masonry  \n       surfaces according to job requirement.  \n \n3.  Apply special cement finishes \nto concrete and masonry \nsurfaces \n \n \n3.1 Special cement / mortar finishes are applied in  \n       line with job requirements and manufacturer’s  \n       specifications. \n3.2  Apply special cement / mortar finishes activities  \n       in line with job requirements. \n3.3 Cure special cement / surface finishes within the  \n       required period. \n 3.4 Work site is cleaned and in safe state in line with  \n       OHSA regulations.\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              65\n \n4.  Check completed special \ncement finishes to concrete \nand masonry surfaces  \n4.1  Final checks are made to ensure that work       \n       conforms with instructions and job  \n       requirements \n4.2  Prepare and submit report to immediate superior \n       following company rules and regulations.        \n4.3  Tools, equipment and any surplus resources  \n       and materials are checked and monitored in  \n       accordance with established procedures \n4.4  Work area is maintained as to its cleanliness and    \nSafety.\n\n--- PDF PAGE 68 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              66\n RANGE OF VARIABLES  \nVARIABLES \n \nRANGE \n1.  Materials \nIncluding but not limited to: \n1.1  Concrete nails \n1.2  Specified mortar \n1.3  Cement \n1.4  Water \n1.5  Sand (screened) \n1.6  Grout \n \n2.  Tools and equipment \nIncluding but not limited to: \n2.1 Pointed trowel \n2.2 Steel float \n2.3 Wooden float \n2.4 Finishing trowel \n2.5 Leveling tools (level hose, spirit level) \n2.6 Nylon string \n2.7 Mason’s brush \n2.8 Aluminum straight edge \n2.9 Scaffoldings \n2.10 Measuring tools \n2.11 Texturing tools \n2.12 Mixing board \n2.13 Sponge / Foam \n2.14 Grinder \n2.15 Mason’s hammer \n2.16 Mortar box \n \n3. Surfaces  \nIncluding but not limited to: \n3.1 Concrete floor \n3.2 Masonry wall \n3.3 Concrete wall \n3.4 Column  \n3.5 Beam  \n \nSpecial cement / mortar  \n    finishes  \nIncluding but not limited to: \n4.1 Colored cement finish  \n4.2 Wash out finish  \n4.3 Granolithic terrazzo finish  \n4.4 Anay cement finish \n4.5 Stucco cement finish  \n4.6 Synthetic adobe finish \n4.7 Refractory materials\n\n--- PDF PAGE 69 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              67\n \n \nVARIABLE \n \nRANGE \n5. PPE \n5.1 Safety Gloves \n5.2 Dust Mask \n5.3 Safety belt / body harness \n5.4 Safety shoes \n5.5 Safety Helmet \n5.6 Proper working clothes \n5.7 Safety Glass / Goggles \n5.8 Lifeline \n \n6. Final checks \n6.1 Plumbness \n6.2 Levelness \n6.3 Squareness \n6.4 Concrete quality\n\n--- PDF PAGE 70 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              68\nEVIDENCE GUIDE \n1.  Critical \naspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Correctly interpreted and identified plans and details \n1.2  Performed surface preparation for special cement finishes to       \n       concrete and masonry surfaces in accordance with job  \n       requirement  \n1.3  Performed application of special cement finishes to concrete and    \n       masonry surfaces are consistent  with established procedures  \n1.4  Demonstrated compliance with safety regulations applicable to  \n       work site operations \n1.5  Demonstrated ability to produce quality special cement finishes to    \n       concrete and masonry surfaces \n1.6  Identified, minimized and eliminated safety hazards \n1.7  Communicated interactively with others when applicable to ensure  \n       safe and effective work operations \n1.8  Completed application of special cement finishes to concrete and  \n       masonry surfaces  according to job requirements \n \n2.  Underpinning \nknowledge  \n \n \n \n \n \n \n \n \n \n \n2.1 Safe work practices and first aid regulations \n              2.1.1 Prevention of accidents \n              2.1.2 Appropriate actions to take when accidents occur \n              2.1.3 First aid treatments and regulations \n              2.1.4 Safe handling of materials, tools and equipment \n              2.1.5 Housekeeping for safety \n              2.1.6 Safety signs and symbols \n              2.1.7 Rules on the safe use of scaffolds and ladders \n2.2 Trade Mathematics and Mensuration \n              2.2.1 Linear measurements \n              2.2.2 Fundamental operations of Mathematics \n2.3 Blueprint and specifications reading \n              2.3.1 Interpret blueprints / plans & drawings \n2.4 Materials \n              2.4.1 Types / Uses of cement / Mortar finishes \n              2.4.2 Platforms / Scaffoldings construction elements and  \n                       materials \n              2.4.3 Uses of grout \n2.5  Trade Theory \n              2.5.1 Application process & proportion \n2.6  Masonry tools and equipment \n              2.6.1 Types and uses of trowels \n              2.6.2 Types and uses of jointers \n              2.6.3 Chipping tools \n              2.6.4 Measuring tools \n              2.6.5 Proper use of hand tools\n\n--- PDF PAGE 71 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              69\n3.  Underpinning \nSkills \n \n \n3.1  Working safely \n3.2  Reading  and interpreting drawings \n3.3  Preparing / organizing special cement finishes  \n3.4  Performing surface preparation for concrete and masonry  \n       surfaces \n3.5  Applying special cement finishes to concrete and masonry  \n       surfaces \n3.6  Proper handling of  tools and equipment \n3.7  Installing / dismantling of scaffolding \n3.8  Using PPE properly \n3.9  Performing good housekeeping \n3.10  Demonstrating good working relation with co-workers \n3.11  Communicating effectively \n \n4.  Resource \nImplications \nThings necessary in order to conduct method of assessment: \n4.1  Workplace location/ simulated workplace setting \n4.2  Tools and equipment appropriate to construction processes \n4.3  Scaffolding/ platforms required for activity \n4.4  Special cement finishes and  materials  relevant to the proposed   \n       activity \n4.5  Drawings / plans and specifications relevant to the task \n \n5.  Methods of  \nAssessment \nCompetency in this unit must be assessed through: \n5.1  Direct observation  \n5.2  Interview \n5.3  Portfolio \n5.4  Third Party Report \n5.5  Demonstration  \n \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a simulated \nworkplace setting\n",
