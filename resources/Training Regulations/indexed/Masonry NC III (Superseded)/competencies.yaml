        "source_title": "PERFORM BASIC MASONRY WORK",
        "source_text": "--- PDF PAGE 47 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              45\nUNIT OF COMPETENCY       : \nPERFORM BASIC MASONRY WORK \nUNIT CODE                            : \nCON712302 \n \nUNIT DESCRIPTOR               : \nThis unit deals with the outcomes required to perform \nbasic masonry work under supervision by a higher-\nlevel mason. It covers the skills required to perform \nbasic re-bar fabrication such as cutting and bending, \nerecting and dismantling scaffolds, (1.8 meters and \nbelow) perform form fabrication, and stripping; \nexcavating, backfilling and compacting.  \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \n Range of Variables \n1.  Perform basic re-bar \nfabrication  \n \n1.1 Appropriate PPE is selected and used \naccording to job requirements.  \n1.2 Steel bars are identified, measured, cut and \nbent as required.  \n1.3 Cut and bent steel bars are segregated \naccording to steel type and size.  \n1.4 Basic fabrication of steel bars into wall footing, \nstiffener columns and lintel beams is performed \nfollowing the re-bar cutting and bending \nschedule.  \n \n2. Erect and dismantle \nscaffolding (limited height) \n \n2.1 Components of scaffolding are checked and \nverified based on job requirements.  \n2.2 Scaffolding is erected in accordance with safety \npractices.  \n2.3 Scaffolding is dismantled in accordance with \nsafety practices. \n2.4 Components are inventoried and returned to \nstockpile area based on company rules and \nprocedures. \n \n3.  Fabricate and strip form works  3.1 Form works materials are identified, \nmeasured, cut and fabricated as required.  \n3.2 Cut materials are segregated according to size.  \n3.3 Basic fabrication of materials into forms for \nstiffener columns and lintel beams is performed \nfollowing work instructions.  \n3.4  Form works are stripped following established \nprocedures.\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              46\n \n4. Perform excavation and back \nfilling / compaction \n4.1 Excavation work is performed based on job        \n      specifications.  \n4.2 Excavated portion is filled with gravel base  \n      coarse. \n4.3 Back filling and compaction are performed after  \n      concreting of wall footing.  \n \n5. Perform concreting work  \n5.1 Concreting of wall footing, columns and lintel  \n      beam based on line and grade is performed. \n5.2 Consolidation of concrete by vibration is  \n      performed (use of vibrator, optional). \n \n6. Perform housekeeping \n6.1 Materials such as excess re-bars, scaffolding  \n      and form panels are recovered and  \n      stockpiled according to company rules and  \n      procedures.  \n6.2 Protect flooring by covering it during concrete \nhollow blocks / bricks laying and plastering.  \n6.3 Protect flooring by using mixing board during \nmanual mixing.   \n6.4 Workplace is cleaned and cleared of any \n      obstructions and hazards before, during and  \n      after work. \n6.5 Tools, equipment and other materials are  \n      cleaned after use.\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              47\nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1. Steel type and size \n1.1 Bar diameter (10, 12, 16 mm) \n1.2 Grade of re-bar (40) \n1.3 Type of bend \n \n2. Components of scaffolding \nMay include but are not limited to: \n2.1Steel \n        2.1.1 A/H frame \n        2.1.2 Cross brace \n        2.1.3 Joint pin \n        2.1.4 Base jack \n        2.1.5 Walking board \n        2.1.6 Toe board \n        2.1.7 Railing \n        2.1.8 Tubular) pipe \n        2.1.9 Arm lock \n2.2 Wood \n        2.2.1 2 x 4 rough lumber \n        2.2.2 2 x 2 rough lumber \n        2.2.3 Wood planks \n        2.2.4 Nails \n \n3. Safety practices \n3.1 Standard PPE \n3.2 Check the condition of the scaffold components \n3.3 Provision of appropriate safety signs  \n3.4 Sufficient lighting for the workplace \n3.5 Good housekeeping \n \n4. Form work materials \n4.1 Plywood  \n4.2 Rough lumber \n4.3 Nails \n4.4 Form oil  \n4.5 Tie rod / form tie \n \n5. Job specifications  \nMay include but are not limited to: \n5.1 Established lay-out \n5.2 Soil condition \n5.3 Required depth and width\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              48\nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to produce the required quantity and quality  \nof fabricated re-bars \n1.2 Demonstrated ability to produce the required quantity and quality \nof fabricated form panels through correct cutting of form work \nmaterials \n1.3 Demonstrated ability to erect and dismantle the required scaffold \nbased on standard safety practices \n1.4 Demonstrated ability to excavate, backfill and compact according \nto the required width and depth \n1.5 Demonstrated ability to mix concrete, mortar and grout  that \nconforms with the quality requirement \n1.6 Demonstrated knowledge on the importance of proper \nhousekeeping by cleaning and clearing the workplace from any \nobstructions and safety hazards  \n \n2.  Underpinning \nKnowledge  \n2.1 Basic linear measurement and simple arithmetic  \n2.2 Follow instructions properly \n2.3 Prevention of accidents \n2.4 Safe handling of materials, tools and equipment \n2.5 Housekeeping for safety \n2.6 Safety signs and symbols \n2.7 Rules on safe erection, use and dismantling of scaffolds (1.8 m  \n      and below) \n2.8 Types of masonry anchors, ties and reinforcements \n2.9 Form works and platforms \n2.10 Scaffoldings construction elements and materials \n2.11 Fabrication of form works and re-bars \n2.12 Concrete, mortar and grout mix  \n2.13 Excavation, back filling and compaction \n \n3.  Underpinning \nSkills \n3.1 Working safely \n3.2 Organizing materials to be used  \n3.3 Installing and dismantling scaffolds \n3.4 Proper handling and  use of  tools and equipment \n3.5 Communicating effectively \n3.6 Using basic arithmetic \n3.7 Using PPE \n3.8 Basic concreting\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              49\n4.  Resource \nImplications \nThings necessary in order to conduct method of assessment: \n4.1  Workplace location \n4.2  Tools, and equipment appropriate to scaffold, re-bars and  \nform works  \n4.3  Materials relevant to scaffold, re-bars and form works \n \n5.  Methods of   \nAssessment \nCompetency in this unit must be assessed through: \n5.1 Direct Observation on actual workplace \n5.2 Questions related to underpinning knowledge  \n5.3 Third party report \n5.4 Demonstration on simulated situation \n5.5 Interview \n \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a simulated \nworkplace setting\n",
