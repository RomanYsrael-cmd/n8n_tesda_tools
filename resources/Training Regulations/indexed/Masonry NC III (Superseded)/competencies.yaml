g plant over \nan extended period of time, or a suitable method of  \ngathering evidence of operating ability over a range of  \nsituations. A bank of scenarios / case studies / what ifs will  \nbe required as well as bank of questions which will be  \nused to probe the reason behind the observable action.  \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Case studies on solving problems in the workplace \n5.2 Observation \nThe unit will be assessed in a holistic manner as is \npractical and may be integrated with the assessment of \nother relevant units of competency. Assessment will occur \nover a range of situations, which will include disruptions to \nnormal, smooth operation. \n \n5.3 Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include \nwalk through of the relevant competency components.  \n \n6.  Context of \nAssessment \n6.1 In all workplace, it may be appropriate to assess this  \n      unit concurrently with relevant teamwork or operation \nunits.",
