repared\n and as per company SOP\n1.3 Inspected issued materials and tools as per quantity and job\n specifications\n1.4 Tools provided with appropriate safety devices\n\n2. Underpinning\nknowledge\n\n2.1 Types and uses of construction materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n\n3. Underpinning\nskills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following instructions\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant to the\nactivities\n5. Methods of\nassessment\n\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n\n6. Context of\nassessment\n\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace\n6.1 Competency assessment must be undertaken in accordance\n with the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 26\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND\nMANUALS OF INSTRUCTIONS\nUNIT CODE :\nCON311201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, interpreting, applying services to specifications\nand manuals and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and accessed\nas per job requirements\n1.2 Version and date of manual are checked to\nensure that correct specification and procedures\nare identified\n\n2. Interpret manuals\n2.1 Relevant sections, chapters of specifications/\nmanuals are located in relation to the work to be\nconducted\n2.2 Information and procedure in the manual are\ninterpreted in accordance with industry practices\n\n3. Apply information in manual\n3.1 Manual is interpreted according to job\nrequirements\n3.2 Work steps are correctly identified in accordance\nwith manufacturer's specification\n3.3 Manual data are applied according to the given\ntask\n3.4 All correct sequencing and adjustments are\ninterpreted in accordance with information\ncontained on the manual or specifications\n\n4. Store manuals\n4.1 Manual or specification is stored appropriately to\nprevent damage, ready access and updating of\ninformation when required in accordance with\ncompany requirements\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 27\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Procedures, Specifications\nand Manuals of Instructions\n\nKinds of Manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 28\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n\n2. Underpinning\nknowledge\n\n2.1 Types of manuals used in construction sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning\nskills\n3.1 Reading and comprehension skills required to identify and\ninterpret construction manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to construction\n sector\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n\n6. Context of\nassessment\n6.1 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\nsimulated environment\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 29\nUNIT OF COMPETENCY:\nINTERPRET TECHNICAL DRAWINGS AND PLANS\nUNIT CODE :\n\nCON311202\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nanalyzing and interpreting symbols, data and work plan\nbased on the required performance standards.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Analyze signs, symbols and\ndata\n\n1.1 Technical plans are obtained according to job\n requirements\n1.2 Signs, symbols and data are identified according\n to job specifications\n1.3 Signs symbols and data are determined\n according to classification or as appropriate in\n drawing\n\n2. Interpret technical drawings\nand plans\n2.1 Necessary tools, materials and equipment are\n identified according to the plan\n2.2 Supplies and materials are listed according to\n specifications\n2.3 Components, assemblies or objects are\n recognized as required\n2.4 Dimensions are identified as appropriate to the\n plan\n2.5 Specification details are matched with\n existing/available resources and in line with job\n requirements\n2.6 Work plan is drawn following the specifications\n\n3. Apply freehand sketching\n3.1 Where applicable, correct freehand sketching is\n produced in accordance with the job requirements\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 30\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Technical Plans\nIncluding but not limited to:\n1.1 Electrical plans\n1.2 Structural plans\n1.3 Architectural plans\n1.4 Plumbing plans\n1.5 Welding Procedures Specifications (WPS)\n\n2. Work plan\n\n2.1 Job requirements\n2.2 Installation instructions\n2.3 Components instruction\n3. Classification\n\nIncluding but not limited to:\n3.1 Electrical\n3.2 Mechanical\n3.3 Plumbing\n\n4. Drawing\n4.1 Drawing symbols\n4.2 Alphabet of lines\n4.3 Orthographic views\n4.4 Front view\n4.5 Right side view/left side view\n4.6 Top view\n4.7 Pictorial\n4.8 Schematic diagram\n4.9 Electrical drawings\n4.10 Structural drawings\n4.11 Plumbing drawings\n4.12 Water\n4.13 Sewerage/Drainage\n4.14 Ventilation\n4.15 Welding symbols\n\n5. Tools and materials\nIncluding but not limited to:\n5.1 Compass\n5.2 Divider\n5.3 Rulers\n5.4 Triangles\n5.5 Drawing tables\n5.6 Computer\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 31\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data according to\n work plan, job requirements and classifications\n1.2 Identified tools and equipment in accordance with job\n requirements\n1.3 Listed supplies and materials according to blueprint\n specifications\n1.4 Drawn work plan following specifications\n1.5 Demonstrated ability to determine job specifications based on\n working / technical drawing\n\n2. Underpinning\nKnowledge\n\n2.1 TRADE MATHEMATICS\n 2.1.1 Linear measurement\n 2.1.2 Dimension\n 2.1.3 Unit conversion\n2.2 BLUEPRINT READING AND PLAN\n SPECIFICATION\n 2.2.1 Electrical, mechanical plan, symbols and abbreviations\n 2.2.2 Drawing standard symbols\n2.3 TRADE THEORY\n 2.3.1 Basic technical drawing\n 2.3.2 Types technical plans\n 2.3.3 Various types of drawings\n 2.3.4 Notes and specifications\n\n3. Underpinning\nSkills\n3.1 Interpreting drawing/orthographic drawing\n3.2 Interpreting technical plans\n3.3 Matching specification details with existing resources\n3.4 Following instructions\n3.5 Handling of drawing instruments\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Drawings and specification relevant to task\n4.3 Materials and instrument relevant to proposed activity\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 32\n\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct Observation\n5.2 Questions/Interview\n5.3 Written test related to underpinning knowledge\n\n6. Context of\nAssessment\n6.1 Competency assessment may occur in the workplace or in any\n appropriate simulated environment\n6.2 Assessment shall be observed while task are being undertaken\n whether individually or in group\n6.3 Competency assessment must be undertaken in accordance\n with the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 33\n\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :\nCON311203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\n Range of Variable\n1. Select measuring instruments\n\n1.1 Object or component to be measured is\nidentified, classified and interpreted according to\nthe appropriate regular geometric shape\n1.2 Measuring tools are selected/identified as per\nobject to be measured or job requirements\n1.3 Correct specifications are obtained from relevant\nsources\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.1 Alternative measuring tools are used without\nsacrificing cost and quality of work\n\n2. Carry out measurements and\ncalculations\n\n2.1 Accurate measurements are obtained\naccording to job requirements\n2.2 Alternative measuring tools are used\n without sacrificing cost and quality of work\n2.3 Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x) and\ndivision (/) including but not limited to:\ntrigonometric functions, algebraic computations\n2.4 Calculations involving fractions, percentages\nand mixed numbers are used to complete\nworkplace tasks\n2.5 Numerical computation is self-checked and\ncorrected for accuracy\n2.6 Instruments are read to the limit of accuracy of\nthe tool\n2.7 Systems of measurement identified and\nconverted according to job requirements/ISO\n2.8 Workpieces are measured according to job\nrequirements\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 34\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Geometric shape\n\n Including but is not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n\n2. Measuring instruments\nIncluding but not limited to:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega-ohmeter\n2.16 Kilowatt hour meter\n2.17 Gauges\n2.18 Thermometers\n\n3. Measurements and\ncalculations\n\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Resistance\n3.7 Amperage\n3.8 Frequency\n3.9 Impedance\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 35\n\nVARIABLE\nRANGE\n\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.16 Inside diameter\n3.17 Circumference\n3.18 Length\n3.19 Thickness\n3.20 Outside diameter\n3.21 Taper\n3.22 Out of roundness\n3.23 Oil clearance\n3.24 End play/Thrust clearance\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 36\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in\naccordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n\n2. Underpinning\nknowledge\n\nTRADE MATHEMATICS / MENSURATION\n2.1 Four fundamental operation\n2.2 Linear measurement\n2.3 Dimensions\n2.4 Unit conversion\n2.5 Ratio and proportion\n2.6 Trigonometric functions\n2.8 Algebraic equations\n\n3. Underpinning\nskills\n3.1 Performing calculation by addition, subtraction, multiplication\nand division; trigonometric functions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of plane\nand geometric figures\n3.4 Proper handling of measuring instruments\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to underpinning knowledge\n\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the TESDA assessment guidelines\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 37\n\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\nUNIT CODE :\nCON311204\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance and\nstoring of tools and equipment based on the required\nperformance standards.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Check condition of tools and\nequipment\n\n1.1 Materials, tools and equipment are identified\naccording to classification and job requirements\n1.2 Non-functional tools and equipment are\nsegregated\nand\nlabeled\naccording\nto\nclassification\n1.3 Safety of tools and equipment are observed in\naccordance with manufacturer's instructions\n1.4 Condition of PPE are checked in accordance\n with manufacturer's instructions\n\n2. Perform basic preventive\nmaintenance\n2.1 Appropriate lubricants are identified according to\n types of equipment\n2.2 Tools and equipment are lubricated according to\npreventive\nmaintenance\nschedule\nor\nmanufacturer's specifications\n2.3 Measuring instruments are checked and\n calibrated in accordance with manufacturer’s\n instructions\n2.3 Tools are cleaned and lubricated according to\n standard procedures\n2.5 Defective instruments, equipment and\n accessories are inspected and replaced\n according to manufacturer’s specifications\n2.6 Tools are inspected, repaired and replaced after\nuse\n2.7 Work place is cleaned and kept in safe state in\n line with OHSA regulations\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 38\n\n3. Store tools and equipment\n\n3.1 Inventory of tools, instruments and equipment\nare conducted and recorded as per company\npractices\n3.2 Tools and equipment are stored safely in\n appropriate locations in accordance with\n manufacturer's specifications or company\n procedures\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 39\n\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw, rip saw\nBoring tools - auger, brace, grinlet, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n\n4. Forms\n4.1 Maintenance schedule forms\n4.2 Requisition slip\n4.3 Inventory Form\n4.4 Inspection Form\n4.5 Procedures\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 40\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OHSA regulations\n1.8 Stored tools and equipment safely in appropriate locations and\nin accordance with company practices\n\n2. Underpinning\nknowledge\n\n2.1 SAFETY PRACTICES\n 2.1.1 Use of PPE\n2.1.2 Handling of tools and equipment\n2.1.3 Good housekeeping\n2.2 MATERIALS, TOOLS AND EQUIPMENT\n2.2.1 Types and uses of lubricants\n2.2.2 Types and uses of cleaning materials\n2.2.3 Types and uses of measuring instruments and\nequipment\n2.3 PREVENTIVE MAINTENANCE\n2.3.1 Methods and techniques\n2.3.2 Procedures\n\n3. Underpinning\nskills\n3.1 Preparing maintenance materials, tools and equipment\n3.2 Proper handling of tools and equipment\n3.3 Performing preventive maintenance\n3.4 Following instructions\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Maintenance schedule\n4.1 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Written test/questioning relevant to Underpinning knowledge\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 41\n\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 42\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : PREPARE MASONRY MATERIALS\nUNIT CODE : CON712301\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npreparing mixtures used for masonry laying and\nsurface plastering under supervision by a higher-level\nmason.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\n Range of Variables\n1. Select materials to be hauled\n\n1.1 Appropriate personal protective equipment\n(PPE) is selected and used according to job\nrequirements.\n1.2 Work instruction is secured from immediate\nsuperior.\n1.3 Quantity of materials to be hauled is\ndetermined according to the instruction of\nimmediate superior.\n1.3 Correct quantity and type of materials to be\nused are secured.\n\n2. Haul materials\n\n2.1 Availability and serviceability of appropriate\n hauling equipment are checked as specified\n by the immediate superior.\n2.2 Materials are hauled based on specified work\n schedule.\n2.3 Required materials are stockpiled based on\n instructions.\n\n3. Mix mortar / concrete\n3.1 Mixing tools and equipment to be used are\n checked according to job requirements.\n3.2 Concrete or mortar mix and quantity is\n determined according to the instructions.\n3.3 Concrete or mortar is mixed according to the\n instructions.\n3.4 Mixed concrete or mortar is supplied to the\n appropriate personnel based on the job\n requirements.\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 43\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Personal Protective Equipment\n1.1 Helmet\n1.2 Safety shoes\n1.3 Proper uniform\n1.4 Gloves\n1.5 Dust mask\n\n2. Materials\nMay include but not limited to:\n2.1 Concrete hollow blocks\n2.2 Bricks\n2.3 Cement\n2.4 Sand\n2.5 Water\n2.6 Reinforcing bars / G.I. wire\n2.7 Concrete / CW nails\n2.8 Lumber\n2.9 Baluster\n2.10 Lime\n2.11 Fly ash\n\n3. Hauling equipment\n\nMay include but are not limited to:\n2.1 Skid loader\n2.2 Dumper\n2.3 Material hoist\n2.4 Pallet\n2.5 Wheel borrow\n2.6 Buggy\n\n4. Mixing tools and equipment\n3.1 One bagger mixer\n3.2 Two-bagger mixer\n3.3 Mixing board\n3.4 Shovel\n3.5 Pails\n3.6 Screen wire (2-3 mm mesh)\n3.7 Mixing box\n3.8 Mortar bucket\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 44\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify correct quantity and type of\nmaterials and tools / equipment used in hauling.\n1.2 Demonstrated ability to proper hauling and timely delivery of\ncorrect quantity and type of materials.\n1.3 Demonstrated ability to identify correct quantity and type of\nmaterials and tools / equipment used in mixing.\n1.4 Demonstrated ability to select and use PPE.\n\n2. Underpinning\nKnowledge\n2.1 Knowledge of basic linear measurement and simple arithmetic\n2.2 Interpret work instructions\n2.3 Prevention of accidents\n2.4 Safe handling of materials, tools and equipment\n2.5 Housekeeping for safety\n2.6 Safety signs and symbols\n2.7 Types of concrete blocks, bricks, cement and aggregates\n2.8 Uses and types of mortar\n2.9 Types of masonry anchors, ties and reinforcements\n\n3. Underpinning\nSkills\n3.1 Working safely\n3.2 Organizing materials to be used\n3.3 Mixing mortar\n3.4 Proper handling and use of tools and equipment\n3.5 Communicating effectively\n3.6 Using basic arithmetic\n\n4. Resource\nImplications\nThings necessary in order to conduct method of assessment:\n4.1 Workplace location\n4.2 Tools, and equipment appropriate to masonry jobs\n4.3 Materials relevant to the masonry works\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct Observation on actual workplace\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Demonstration on simulated situation\n5.5 Oral interview\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 45\nUNIT OF COMPETENCY :\nPERFORM BASIC MASONRY WORK\nUNIT CODE :\nCON712302\n\nUNIT DESCRIPTOR :\nThis unit deals with the outcomes required to perform\nbasic masonry work under supervision by a higher-\nlevel mason. It covers the skills required to perform\nbasic re-bar fabrication such as cutting and bending,\nerecting and dismantling scaffolds, (1.8 meters and\nbelow) perform form fabrication, and stripping;\nexcavating, backfilling and compacting.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\n Range of Variables\n1. Perform basic re-bar\nfabrication\n\n1.1 Appropriate PPE is selected and used\naccording to job requirements.\n1.2 Steel bars are identified, measured, cut and\nbent as required.\n1.3 Cut and bent steel bars are segregated\naccording to steel type and size.\n1.4 Basic fabrication of steel bars into wall footing,\nstiffener columns and lintel beams is performed\nfollowing the re-bar cutting and bending\nschedule.\n\n2. Erect and dismantle\nscaffolding (limited height)\n\n2.1 Components of scaffolding are checked and\nverified based on job requirements.\n2.2 Scaffolding is erected in accordance with safety\npractices.\n2.3 Scaffolding is dismantled in accordance with\nsafety practices.\n2.4 Components are inventoried and returned to\nstockpile area based on company rules and\nprocedures.\n\n3. Fabricate and strip form works 3.1 Form works materials are identified,\nmeasured, cut and fabricated as required.\n3.2 Cut materials are segregated according to size.\n3.3 Basic fabrication of materials into forms for\nstiffener columns and lintel beams is performed\nfollowing work instructions.\n3.4 Form works are stripped following established\nprocedures.\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 46\n\n4. Perform excavation and back\nfilling / compaction\n4.1 Excavation work is performed based on job\n specifications.\n4.2 Excavated portion is filled with gravel base\n coarse.\n4.3 Back filling and compaction are performed after\n concreting of wall footing.\n\n5. Perform concreting work\n5.1 Concreting of wall footing, columns and lintel\n beam based on line and grade is performed.\n5.2 Consolidation of concrete by vibration is\n performed (use of vibrator, optional).\n\n6. Perform housekeeping\n6.1 Materials such as excess re-bars, scaffolding\n and form panels are recovered and\n stockpiled according to company rules and\n procedures.\n6.2 Protect flooring by covering it during concrete\nhollow blocks / bricks laying and plastering.\n6.3 Protect flooring by using mixing board during\nmanual mixing.\n6.4 Workplace is cleaned and cleared of any\n obstructions and hazards before, during and\n after work.\n6.5 Tools, equipment and other materials are\n cleaned after use.\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 47\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Steel type and size\n1.1 Bar diameter (10, 12, 16 mm)\n1.2 Grade of re-bar (40)\n1.3 Type of bend\n\n2. Components of scaffolding\nMay include but are not limited to:\n2.1Steel\n 2.1.1 A/H frame\n 2.1.2 Cross brace\n 2.1.3 Joint pin\n 2.1.4 Base jack\n 2.1.5 Walking board\n 2.1.6 Toe board\n 2.1.7 Railing\n 2.1.8 Tubular) pipe\n 2.1.9 Arm lock\n2.2 Wood\n 2.2.1 2 x 4 rough lumber\n 2.2.2 2 x 2 rough lumber\n 2.2.3 Wood planks\n 2.2.4 Nails\n\n3. Safety practices\n3.1 Standard PPE\n3.2 Check the condition of the scaffold components\n3.3 Provision of appropriate safety signs\n3.4 Sufficient lighting for the workplace\n3.5 Good housekeeping\n\n4. Form work materials\n4.1 Plywood\n4.2 Rough lumber\n4.3 Nails\n4.4 Form oil\n4.5 Tie rod / form tie\n\n5. Job specifications\nMay include but are not limited to:\n5.1 Established lay-out\n5.2 Soil condition\n5.3 Required depth and width\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 48\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce the required quantity and quality\nof fabricated re-bars\n1.2 Demonstrated ability to produce the required quantity and quality\nof fabricated form panels through correct cutting of form work\nmaterials\n1.3 Demonstrated ability to erect and dismantle the required scaffold\nbased on standard safety practices\n1.4 Demonstrated ability to excavate, backfill and compact according\nto the required width and depth\n1.5 Demonstrated ability to mix concrete, mortar and grout that\nconforms with the quality requirement\n1.6 Demonstrated knowledge on the importance of proper\nhousekeeping by cleaning and clearing the workplace from any\nobstructions and safety hazards\n\n2. Underpinning\nKnowledge\n2.1 Basic linear measurement and simple arithmetic\n2.2 Follow instructions properly\n2.3 Prevention of accidents\n2.4 Safe handling of materials, tools and equipment\n2.5 Housekeeping for safety\n2.6 Safety signs and symbols\n2.7 Rules on safe erection, use and dismantling of scaffolds (1.8 m\n and below)\n2.8 Types of masonry anchors, ties and reinforcements\n2.9 Form works and platforms\n2.10 Scaffoldings construction elements and materials\n2.11 Fabrication of form works and re-bars\n2.12 Concrete, mortar and grout mix\n2.13 Excavation, back filling and compaction\n\n3. Underpinning\nSkills\n3.1 Working safely\n3.2 Organizing materials to be used\n3.3 Installing and dismantling scaffolds\n3.4 Proper handling and use of tools and equipment\n3.5 Communicating effectively\n3.6 Using basic arithmetic\n3.7 Using PPE\n3.8 Basic concreting\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 49\n4. Resource\nImplications\nThings necessary in order to conduct method of assessment:\n4.1 Workplace location\n4.2 Tools, and equipment appropriate to scaffold, re-bars and\nform works\n4.3 Materials relevant to scaffold, re-bars and form works\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct Observation on actual workplace\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Demonstration on simulated situation\n5.5 Interview\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 50\nUNIT OF COMPETENCY : LAY BRICKS / BLOCKS FOR STRUCTURE\nUNIT CODE : CON712303\n\nUNIT DESCRIPTOR : This unit covers the outcomes required to lay bricks /\nblocks for structure. It includes the skills in establishing\nbrick / block structure location; performing brick / block\nlaying and curing.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\n Range of Variables\n1. Layout / establish block or\nbrick structure location\n1.1 Plans are read and interpreted as per job\nrequirements.\n1.2 Appropriate PPE is selected and used in line with\n job requirements.\n1.3 Materials, tools and equipment are selected and\n prepared consistent with the job requirements.\n1.4 Reference building lines are correctly identified /\n located as per job requirements.\n1.5 Location of brick / block structure based on\n reference building lines is established using\n batterboard at + 3mm tolerance for proper\n alignment, squareness and dimension.\n1.6 Horizontal / vertical guide for brick / block is\n installed according to job specifications.\n1.7 Lay-out of block / brick structure is correctly\n marked as per job requirements.\n\n2. Perform laying brick / block for\nstructure\n2.1 Bricks and concrete block laid on the line at\n minimum allowance of 1/16 inch (2 mm)\n2.2 Reinforcing bar / dowel is installed according to\n required job specifications.\n2.3 Mortars are spread on the base / edge of brick /\n block mortar according to job specifications.\n2.4 Bricks / blocks are positioned / laid according to\n design / specifications / locations.\n2.5 Constant checking of plumbness is done during\n brick/block laying\n2.6 Form works are installed in accordance with\n building plan, if necessary\n2.7 Cast-in place concrete structures are constructed\n according to design and job specifications.\n2.8 Work site is cleaned and kept in safe state in line\n with OHSA regulations.\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 51\n\n3. Complete work / curing\n3.1 Final checks are made to ensure that work\n conforms with instructions, curing and other\n requirements.\n3.2 Completed work is reported to the Foreman for\nfinal checking.\n3.3 Tools, equipment and any surplus resources and\nmaterials are checked and monitored in\naccordance with established procedures.\n3.4 Work area is maintained as to its cleanliness\n and safety.\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 52\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Materials\n1.1 String or nylon cord\n1.2 Concrete / CW nails\n1.3 Lumber\n1.4 Water\n1.5 Mortar\n\n2. Tools and equipment\n2.1 Pail\n2.2 Mortar box\n2.3 Pointed trowel\n2.4 Wooden float\n2.5 Nylon string\n2.6 Steel tape / pull-push rule\n2.7 Mason hammer (piketa)\n2.8 Plumb bob\n2.9 Scaffoldings\n2.10 Pencil\n2.11 Hand saw\n2.12 Manual bender\n2.13 Tie wire\n2.14 Steel square\n2.15 Hacksaw\n2.16 Level hose\n2.17 Spirit level\n2.18 Mortar bucket\n2.19 One bagger mixer\n2.20 Chalk line\n\n3. Brick / block structures\nMay include but not limited to:\n3.1 Stiffener columns\n3.2 Lintel beams\n3.3 Wall footing\n3.4 Walls (exterior, interior and parapet, etc.)\n3.5 Fireplace\n3.6 Chimneys\n3.7 Septic vaults\n\n4. PPE\n4.1 Safety shoes\n4.2 Safety gloves\n4.3 Safety helmet\n4.4 Body harness / safety belt as required\n4.5 Proper clothes (long sleeves and long pants)\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 53\n\n5. Final checks\n5.1 Plumbness\n5.2 Levelness\n5.3 Squareness\n5.4 Flatness / evenness of surface\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 54\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Correctly interpreted and identified plans and details\n1.2 Prepared and selected materials, tools and equipment\n consistent with specifications and job requirements\n1.3 Located brick / block structure based on reference building\n lines for proper alignment, squareness and dimension\n1.4 Performed / laid-out brick / block for structure in accordance\n with the required plumbness, levelness and squareness.\n1.5 Demonstrated compliance with safety regulations applicable to\n work site operations\n1.6 Identified, minimized and eliminated safety hazards\n1.7 Erected scaffold as per job requirement (max. height 1.8 m)\n1.8 Unexpected situations are responded accordingly.\n\n2. Underpinning\nKnowledge\n2.1 safe work practices and first aid regulations\n 2.1.1 Prevention of accidents\n 2.1.2 First aid treatments and regulations\n 2.1.3 Safe handling of materials, tools and equipment\n 2.1.4 Housekeeping for safety\n 2.1.5 Safety signs and symbols\n 2.1.6 Rules on the safe use of scaffolds and ladders\n2.2 Trade Mathematics and Mensuration\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of Mathematics (4 basic\n operations)\n 2.2.3 System of measurement / Metric system of\n measurement\n2.3 Blueprint and specifications reading\n 2.3.1 Interpret blueprints\n 2.3.2 Composition, properties, uses and size of clay and\n masonry\n 2.3.3 Materials\n 2.3.4 Basic structural bonds and joints\n 2.3.5 Classification of concrete masonry units\n 2.3.6 Properties of concrete block\n 2.3.7 Material uses and specifications\n2.4 Materials\n 2.4.1 Types and uses of mortar\n 2.4.2 Masonry ties and reinforcements\n 2.4.3 Types of masonry anchors, ties and reinforcements\n 2.4.4 Wood products\n 2.4.5 Form works and platforms\n 2.4.6 Scaffoldings construction elements and materials\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 55\n\n2.5 Trade theory\n 2.5.1 Basic carpentry\n2.6 Masonry tools and equipment\n 2.6.1 Types and uses of trowels\n 2.6.2 Chipping tools\n 2.6.3 Measuring and testing tools\n 2.6.4 Use of power cutter\n 2.6.5 Masonry saw\n 2.6.6 Proper use of hand tools\n2.7 Masonry process\n 2.7.1 Knowledge of masonry processes\n 2.7.2 Good housekeeping\n 2.7.3 Economic use of material\n\n3. Underpinning\nSkills\n3.1 Following work practices and first aid regulations\n3.2 Applying trade Math and mensuration\n3.3 Interpreting blueprint and specifications\n3.4 Using materials, tools and equipment\n3.5 Applying trade theory\n3.6 Performing laying of brick / block processes\n\n4. Resource\nImplications\nThings necessary in order to conduct method of assessment:\n4.1 Workplace location\n4.2 Tools, plant and equipment appropriate to construction\n processes\n4.3 Scaffolding and form works required for activity\n4.4 Drawings and specifications relevant to the task\n4.5 Basic PPE\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct Observation\n5.2 Questions related to underpinning knowledge\n5.3 Interview\n5.4 Portfolio\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 56\n\nUNIT OF COMPETENCY : PLASTER CONCRETE / MASONRY SURFACE\nUNIT CODE : CON712304\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nplastering concrete / masonry surface. It includes skills\nrequired for preparing concrete / masonry surfaces for\nplastering; and performing plastering work.\n\n ELEMENTS\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare concrete / masonry\nsurfaces for plastering\n\n1.1 Appropriate PPE is selected and used\n according to job requirements.\n1.2 Plans and details are interpreted as per job\n requirements\n1.3 Materials, tools and equipment are selected\n and prepared in line with job requirements\n1.4 Materials are properly staged / stockpiled at\n designated workplace and must be free from\n any foreign matters.\n1.5 Wall surface preparation is performed\n according to establish plastering procedure\n\n2. Perform plastering work\n2.1 Limits of plastering are determined to establish\n required thickness, plumbness, squareness,\n levelness and alignment of structure\n2.2 Plastering wall is performed according to job\n requirements\n2.3 Distribution of mortar/coating is applied on the\n wall surface evenly\n2.4 Work site is cleaned and kept in safe state in\n accordance with OHSA regulations\n\n3. Complete plastering work and\n curing\n3.1 Final Checks are made to ensure that work\n conforms with instructions, curing and other job\n requirements.\n3.2 Inform immediate superior upon completion of\n work.\n3.3 Tools, equipment and any surplus resources\n and materials are checked and monitored in\n accordance with established procedures.\n3.4 Work area is maintained of its cleanliness and\n safety.\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 57\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Materials\nMay include but are not limited to :\n1.1 Mortar\n1.2 Plastering guide\n1.3 String or nylon cord\n1.4 Concrete and CW nails\n1.5 Water\n\n2. Tools and equipment\nMay include but are not limited to :\n2.1 Mason's hammer\n2.2 Scaffolding\n2.3 Steel tape / push-pull rule\n2.4 Plumb bob\n2.5 Leveling tools ( leveling hose, spirit level)\n2.6 Pail\n2.7 Mortar box\n2.8 Pointed trowel\n2.9 Wooden float\n2.10 Steel float\n2.11 Shovel\n2.12 Foam / paper\n2.13 Straight edge / screed (bara)\n2.14 Mason’s brush\n2.15 Claw hammer\n\n3. PPE\n\n3.1 Safety shoes\n3.2 Safety belt / body harness\n3.3 Safety helmet\n3.4 Proper working clothes\n4. Final checks\n4.1 Plumbness\n4.2 Levelness\n4.3 Squareness\n4.4 Evenness or flatness of surface\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 58\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Correctly interpreted and identified plans and details\n1.2 Performed concrete / masonry surface preparation in\n accordance with established plastering procedure\n1.3 Performed plastering works consistent with established\n plastering procedure\n1.4 Demonstrated compliance with safety regulations applicable to\n work site operations\n1.5 Demonstrated ability to produce quality of plastering works\n1.6 Demonstrated ability to erect and dismantle scaffolds\n1.7 Identified, minimized and eliminated safety hazards\n1.8 Communicated interactively with others when applicable to\n ensure safe and effective work operations\n1.9 Completed plastering concrete / masonry surface according to\n job specifications\n\n2. Underpinning\n Knowledge\n2.1 Safe work practices and first aid regulations\n 2.1.1 Prevention of accidents\n 2.1.2 Knows to do when accidents occur\n 2.1.3 First aid treatments and regulations\n 2.1.4 Safe handling of materials, tools and equipment\n 2.1.5 Housekeeping for safety\n 2.1.6 Safety signs and symbols\n 2.1.7 Rules on the safe use of scaffolds and ladders\n2.2 Trade Mathematics and Mensuration\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of Mathematics\n 2.2.3 System of measurement / Metric system of\n measurement\n2.3 Blueprint and specifications reading\n 2.3.1 Interpret Blueprints / Plans and Drawings\n 2.3.2 Composition, properties / types , uses and sizes of\n plastering\n2.4 Materials\n 2.4.1 Types / uses of Mortar\n 2.4.2 Scaffoldings construction elements and materials\n2.5 Trade theory\n 2.5.1 Plastering proportion & procedures\n2.6 Masonry tools and equipment\n 2.6.1 Types and Uses of Trowels\n 2.6.2 Measuring and Testing Tools\n 2.6.7 Types and uses of bri