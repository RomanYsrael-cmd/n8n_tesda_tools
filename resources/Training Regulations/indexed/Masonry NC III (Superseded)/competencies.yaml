        "source_title": "LAY BRICKS / BLOCKS FOR STRUCTURE",
        "source_text": "--- PDF PAGE 52 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              50\nUNIT OF COMPETENCY       : LAY BRICKS / BLOCKS FOR STRUCTURE \nUNIT CODE                            : CON712303 \n \nUNIT DESCRIPTOR               : This unit covers the outcomes required to lay bricks / \nblocks for structure. It includes the skills in establishing \nbrick / block structure location; performing brick / block \nlaying and curing. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \n Range of Variables \n1. Layout / establish block or \nbrick structure location \n1.1 Plans are read and interpreted as per job \nrequirements. \n1.2 Appropriate PPE is selected and used in line with  \n      job requirements. \n1.3 Materials, tools and equipment are selected and  \n      prepared consistent with the job requirements. \n1.4 Reference building lines are correctly identified /  \n      located as per job requirements. \n1.5 Location of brick / block structure based on  \n      reference building lines is established using  \n      batterboard at + 3mm tolerance for proper  \n      alignment, squareness and dimension. \n1.6 Horizontal / vertical guide for brick / block is  \n      installed according to job specifications. \n1.7 Lay-out of block / brick structure is correctly  \n        marked as per job requirements.  \n \n2.  Perform laying brick / block for \nstructure   \n2.1 Bricks and concrete block laid on the line at  \n        minimum allowance of 1/16 inch (2 mm) \n2.2 Reinforcing bar / dowel is installed according to  \n      required job specifications. \n2.3 Mortars are spread on the base / edge of brick / \n      block mortar according to job specifications. \n2.4 Bricks / blocks are positioned / laid according to \n design / specifications / locations. \n2.5 Constant checking of plumbness is done during  \n      brick/block laying \n2.6 Form works are installed in accordance with  \n      building plan, if necessary \n2.7 Cast-in place concrete structures are constructed  \n      according to design and job specifications. \n2.8 Work site is cleaned and kept in safe state in line  \n      with OHSA regulations.\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              51\n \n3.  Complete work / curing \n3.1 Final checks are made to ensure that work       \n      conforms with instructions, curing and other \n      requirements. \n3.2 Completed work is reported to the Foreman for \nfinal checking.  \n3.3 Tools, equipment and any surplus resources and \nmaterials are checked and monitored in  \naccordance with established procedures. \n3.4 Work area is maintained as to its cleanliness  \n       and safety.\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              52\nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1.  Materials \n1.1 String or nylon cord \n1.2 Concrete / CW nails \n1.3 Lumber \n1.4 Water \n1.5 Mortar \n \n2.  Tools and equipment \n2.1 Pail \n2.2 Mortar box \n2.3 Pointed  trowel \n2.4 Wooden float \n2.5 Nylon string \n2.6 Steel tape / pull-push rule \n2.7 Mason hammer (piketa) \n2.8 Plumb bob \n2.9 Scaffoldings \n2.10 Pencil \n2.11 Hand saw \n2.12 Manual bender  \n2.13 Tie wire \n2.14 Steel square \n2.15 Hacksaw \n2.16 Level hose \n2.17 Spirit level \n2.18 Mortar bucket \n2.19 One bagger mixer \n2.20 Chalk line \n \n3.  Brick / block structures \nMay include but not limited to: \n3.1 Stiffener columns \n3.2 Lintel beams \n3.3 Wall footing \n3.4 Walls (exterior, interior and parapet, etc.) \n3.5 Fireplace \n3.6 Chimneys \n3.7 Septic vaults \n \n4.  PPE \n4.1 Safety shoes \n4.2 Safety gloves \n4.3 Safety helmet \n4.4 Body harness / safety belt as required \n4.5 Proper clothes (long sleeves and long pants)\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              53\n \n5. Final checks \n5.1 Plumbness \n5.2 Levelness \n5.3 Squareness \n5.4 Flatness / evenness of surface\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              54\nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \n \n \n \n \n \n \n \n \n \n \n \n \nAssessment requires evidence that the candidate: \n1.1 Correctly interpreted and identified plans and details \n1.2 Prepared and selected materials, tools and equipment  \n      consistent with specifications and job requirements \n1.3 Located brick / block structure based on reference building  \n      lines for proper alignment, squareness and dimension \n1.4 Performed / laid-out brick / block for structure in accordance  \n       with the required plumbness, levelness and squareness. \n1.5 Demonstrated compliance with safety regulations applicable to   \n       work site operations \n1.6 Identified, minimized and eliminated safety hazards \n1.7 Erected scaffold as per job requirement (max. height 1.8 m) \n1.8 Unexpected situations are responded accordingly. \n \n2.  Underpinning \nKnowledge  \n2.1  safe work practices and first aid regulations \n           2.1.1 Prevention of accidents \n           2.1.2 First aid treatments and regulations \n           2.1.3 Safe handling of materials, tools and equipment \n           2.1.4 Housekeeping for safety \n           2.1.5 Safety signs and symbols \n           2.1.6 Rules on the safe use of scaffolds and ladders \n2.2  Trade Mathematics and Mensuration \n           2.2.1 Linear measurements \n           2.2.2 Fundamental operations of Mathematics (4 basic  \n                    operations) \n           2.2.3 System of measurement / Metric system of  \n                    measurement \n2.3  Blueprint and specifications reading \n           2.3.1 Interpret blueprints \n           2.3.2 Composition, properties, uses and size of clay and  \n                    masonry  \n           2.3.3 Materials \n           2.3.4 Basic structural bonds and joints \n           2.3.5 Classification of concrete masonry units \n           2.3.6 Properties of concrete block \n           2.3.7 Material uses and specifications \n2.4  Materials \n           2.4.1 Types and uses of mortar \n           2.4.2 Masonry ties and reinforcements \n           2.4.3 Types of masonry anchors, ties and reinforcements \n           2.4.4 Wood products \n           2.4.5 Form works and platforms \n           2.4.6 Scaffoldings construction elements and materials\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              55\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n2.5  Trade theory \n          2.5.1 Basic carpentry \n2.6  Masonry tools and equipment \n          2.6.1 Types and uses of trowels \n          2.6.2 Chipping tools \n          2.6.3 Measuring and testing tools \n          2.6.4 Use of power cutter \n          2.6.5 Masonry saw \n          2.6.6 Proper use of hand tools \n2.7  Masonry process \n          2.7.1 Knowledge of masonry processes \n          2.7.2 Good housekeeping \n          2.7.3 Economic use of material \n \n3.  Underpinning \nSkills \n3.1 Following work practices and first aid regulations  \n3.2 Applying trade Math and mensuration \n3.3 Interpreting blueprint and specifications \n3.4 Using materials, tools and equipment \n3.5 Applying trade theory \n3.6 Performing laying of brick / block processes  \n \n4.  Resource \nImplications \nThings necessary in order to conduct method of assessment: \n4.1  Workplace location \n4.2  Tools, plant and equipment appropriate to construction  \n processes \n4.3  Scaffolding and form works required for activity \n4.4  Drawings and specifications relevant to the task \n4.5  Basic PPE \n \n5.  Methods of   \nAssessment \nCompetency in this unit must be assessed through: \n5.1 Direct Observation  \n5.2 Questions related to underpinning knowledge  \n5.3 Interview \n5.4 Portfolio \n \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a  \n      simulated workplace setting\n",
