        "source_text": "--- PDF PAGE 44 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              42\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY       : PREPARE MASONRY MATERIALS  \nUNIT CODE                            : CON712301 \n \nUNIT DESCRIPTOR               : This unit covers the knowledge, skills and attitudes in \npreparing mixtures used for masonry laying and  \nsurface plastering under supervision by a higher-level \nmason.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \n Range of Variables \n1.  Select materials to be hauled \n \n1.1 Appropriate personal protective equipment \n(PPE) is selected and used according to job \nrequirements. \n1.2 Work instruction is secured from immediate \nsuperior. \n1.3 Quantity of materials to be hauled is \ndetermined according to the instruction of \nimmediate superior.  \n1.3 Correct quantity and type of materials to be \nused are secured.  \n \n2.  Haul materials  \n \n2.1 Availability and serviceability of appropriate  \n      hauling equipment are checked as specified  \n      by the immediate superior.  \n2.2 Materials are hauled based on specified work  \n       schedule.  \n2.3 Required materials are stockpiled based on   \n       instructions. \n \n3.  Mix mortar / concrete \n3.1 Mixing tools and equipment to be used are  \n       checked according to job requirements. \n3.2 Concrete or mortar mix and quantity is  \n       determined according to the instructions. \n3.3 Concrete or mortar is mixed according to the  \n       instructions.  \n3.4 Mixed concrete or mortar is supplied to the  \n       appropriate personnel based on the job  \n       requirements.\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              43\nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1.  Personal Protective Equipment \n1.1 Helmet \n1.2 Safety shoes \n1.3 Proper uniform \n1.4 Gloves \n1.5 Dust mask  \n \n2.  Materials \nMay include but not limited to: \n2.1 Concrete hollow blocks \n2.2 Bricks \n2.3 Cement \n2.4 Sand \n2.5 Water \n2.6 Reinforcing bars / G.I. wire \n2.7 Concrete / CW nails \n2.8 Lumber \n2.9 Baluster \n2.10 Lime \n2.11 Fly ash \n \n3.  Hauling equipment  \n \n \n \n \nMay include but are not limited to: \n2.1 Skid loader  \n2.2 Dumper \n2.3 Material hoist \n2.4 Pallet \n2.5 Wheel borrow \n2.6 Buggy \n \n4.  Mixing tools and equipment \n3.1 One bagger mixer \n3.2 Two-bagger mixer \n3.3 Mixing board  \n3.4 Shovel \n3.5 Pails \n3.6 Screen wire (2-3 mm mesh) \n3.7 Mixing box \n3.8 Mortar bucket\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              44\nEVIDENCE GUIDE \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to identify correct quantity and type of \nmaterials and tools / equipment used in hauling.  \n1.2 Demonstrated ability to proper hauling and timely delivery of \ncorrect quantity and type of materials. \n1.3 Demonstrated ability to identify correct quantity and type of \nmaterials and tools / equipment used in mixing. \n1.4 Demonstrated ability to select and use PPE. \n \n2.  Underpinning \nKnowledge  \n2.1 Knowledge of basic linear measurement and simple arithmetic  \n2.2 Interpret work instructions  \n2.3 Prevention of accidents \n2.4 Safe handling of materials, tools and equipment \n2.5 Housekeeping for safety \n2.6 Safety signs and symbols \n2.7 Types of concrete blocks, bricks, cement and aggregates \n2.8 Uses and types of mortar \n2.9 Types of masonry anchors, ties and reinforcements \n \n3.  Underpinning \nSkills \n3.1 Working safely \n3.2 Organizing materials to be used  \n3.3 Mixing mortar \n3.4 Proper  handling and  use of  tools and equipment \n3.5 Communicating effectively \n3.6 Using basic arithmetic \n \n4.  Resource \nImplications \nThings necessary in order to conduct method of assessment: \n4.1  Workplace location \n4.2  Tools, and equipment appropriate to masonry jobs  \n4.3  Materials relevant to the masonry works \n \n5.  Methods of   \nAssessment \nCompetency in this unit must be assessed through: \n5.1 Direct Observation on actual workplace \n5.2 Questions related to underpinning knowledge  \n5.3 Third party report \n5.4 Demonstration on simulated situation \n5.5 Oral interview \n \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a   \n      simulated workplace setting\n",
