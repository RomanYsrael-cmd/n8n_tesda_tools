        "source_title": "INSTALL PRE-CAST BALUSTER AND HANDRAILS",
        "source_text": "--- PDF PAGE 62 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              60\nUNIT OF COMPETENCY       : INSTALL PRE-CAST BALUSTER AND HANDRAILS \nUNIT CODE                            : CON712305 \n \nUNIT DESCRIPTOR               : This unit describes the outcomes required to install pre-\ncast baluster and handrail. It covers the skills required to \nprepare and install pre-cast baluster and handrail and for \npreparing work completion report. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variables \n1.  Layout / establish pre-cast \nbaluster and handrail location  \n \n \n \n \n1.1  Appropriate PPE is selected used according to job  \nrequirements \n1.2  Plans and details are interpreted as per job \nrequirements \n1.3 Materials, tools and equipment are prepared \nand  selected consistent  with job requirements  \n1.4  Pre-cast baluster and handrail  is marked in \naccordance with job requirements \n \n2.  Perform pre-cast baluster and \nhandrail installation \n \n \n \n2.1  Pre-cast baluster and handrail  are laid-out, \naligned and secured according to job \nrequirements  \n2.2  Mortar is applied to pre-cast baluster and handrail   \n       according to job requirements \n2.3  Worksite is cleaned and kept in safe state in line \nwith OHSA regulations \n \n3.  Complete of pre-cast baluster  \n     and hand rail work and curing \n3.1 Final Checks are made to ensure that work       \n      conforms with instructions, curing and other and  \n      job requirements \n3.2 Inform immediate superior upon completion of     \n      work        \n3.3 Tools, equipment and any surplus resources  \n      and materials are checked and monitored in  \n      accordance with established procedures \n3.4 Work area is maintained of  its cleanliness and   \n      safety\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              61\n \n \nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1.  Materials \n \n \nMay include but are not limited to: \n1.1  G.I. wire \n1.2  Reinforcing bars  \n1.3  Form work materials  \n1.4  Water \n1.5  Strings or nylon cord \n1.6  Concrete and CW nails \n1.7  Lumber \n \n2.  Tools and equipment  \nMay include but are not limited to: \n2.1 Push pull rule \n2.2 Steel square \n2.3 Leveling tools ( levelling hose , spirit level) \n2.4 Plumb bob \n2.5 Mason’s Hammer \n2.6 Pencil  \n2.7 Pointed trowel \n2.8 Shovel \n2.9 Mortar box  \n2.10 Hacksaw / bar cutter \n2.11 Finishing Trowel \n2.12 Steel float \n2.13 Chalk line \n3.  PPE \nMay include but are not limited to: \n3.1 Safety shoes \n3.2 Safety Gloves \n3.3 Safety belt / body harness \n3.4 Safety Helmet \n3.5 Proper working clothes \n \n4. Final checks \n4.1  Plumbness \n4.2  Levelness \n4.3  Squareness \n4.4  Alignment of balusters\n\n--- PDF PAGE 64 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              62\nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate:    \n1.1  Interpreted plans and details \n1.2  Prepared and selected materials consistent with the job  \n       requirements \n1.3  Laid out and established location of pre-cast baluster and    \n       handrails in accordance with job requirements   \n1.4  Installed pre-cast baluster and handrails consistent with the job  \n       requirements \n1.5  Demonstrated compliance with safety regulations applicable to  \n work site operations \n1.6  Demonstrated ability to produce quality installation works \n1.7  Erected scaffoldings (if needed)  in accordance with OHSA \n regulation  \n \n2.  Underpinning \nKnowledge  \n2.1  Safe work practices and first aid regulations \n            2.1.1 Prevention of accidents \n            2.1.2 Appropriate actions to take when accidents occur \n            2.1.3 First aid treatments and regulations \n            2.1.4 Safe handling of materials, tools and equipment \n            2.1.5 Housekeeping for safety \n            2.1.6 Safety signs and symbols \n            2.1.7 Rules on the safe use of scaffolds and ladders \n2.2  Trade Mathematics and Mensuration \n            2.2.1 Linear measurements \n            2.2.2 Fundamental operations of Mathematics \n2.3  Blueprint and specifications reading \n            2.3.1 Interpret blueprints/Plans & Drawings \n2.4  Materials \n            2.4.1 Types / Uses of pre-cast balusters and handrails  \n            2.4.3 Form works and platforms \n            2.4.4 Scaffoldings construction elements and materials \n2.5  Trade theory \n            2.5.1 Basic carpentry \n            2.5.1 Basic re-bar works \n2.6  Masonry tools and equipment \n            2.6.1 Types and Uses of trowels \n            2.6.4 Measuring  Tools \n            2.6.5 Proper use of hand tools \n2.7  Masonry process \n            2.7.1 Methods of installation of  pre-cast  baluster and  \n                     Handrail \n            2.7.2 Curing processes\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              63\n3.  Underpinning \nSkills \n3.1  Following safe work practices and first aid regulations \n3.2  Applying trade Math and mensuration  \n3.3  Interpreting blueprint and specifications \n3.4  Using materials, tools and equipment   \n3.5  Applying trade theory  \n3.6  Following installation of pre-cast balusters and handrails  \n  procedures  \n \n4.  Resource \nImplications \nThings necessary in order to conduct method of assessment: \n4.1  Workplace location / simulated workplace setting \n4.2  Tools and equipment appropriate to construction processes \n4.3  Scaffolding / form works / re-bars required for activity \n4.4  Masonry materials  relevant to the proposed activity \n4.5  Drawings/plans  and specifications relevant to the task \n \n5.  Methods of  \nAssessment \nCompetency in this unit  must be assessed through: \n5.1  Direct Observation  \n5.2  Interview \n5.3  Portfolio \n5.4 Third Party Report \n5.5  Demonstration  \n \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a simulated \nworkplace setting\n",
