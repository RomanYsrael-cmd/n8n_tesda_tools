        "source_title": "PLASTER CONCRETE / MASONRY SURFACE",
        "source_text": "--- PDF PAGE 58 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              56\n \nUNIT OF COMPETENCY       : PLASTER CONCRETE / MASONRY   SURFACE \nUNIT CODE                            : CON712304 \n \nUNIT DESCRIPTOR               : This unit covers the knowledge, skills and attitudes in \nplastering concrete / masonry surface. It includes skills \nrequired for preparing concrete / masonry surfaces for \nplastering; and performing plastering work.   \n \n               ELEMENTS \n    PERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variables \n1.  Prepare concrete / masonry \nsurfaces for plastering  \n \n1.1 Appropriate PPE is selected and used  \n      according to job requirements. \n1.2  Plans and details are interpreted as per job   \n       requirements \n1.3  Materials, tools and equipment are selected  \n       and prepared  in line with job requirements \n1.4  Materials are properly staged / stockpiled at     \n       designated workplace and must be  free from  \n       any foreign matters. \n1.5  Wall surface preparation is performed  \n       according to establish plastering procedure \n \n2.  Perform plastering work \n2.1  Limits of plastering are determined to establish  \n       required thickness, plumbness, squareness,  \n       levelness and  alignment of structure \n2.2  Plastering wall is performed according to job  \n       requirements \n2.3  Distribution of mortar/coating is applied on the  \n       wall surface evenly  \n2.4  Work site is cleaned and kept in safe state in       \n       accordance  with OHSA regulations \n  \n3.  Complete plastering work and  \n     curing \n3.1  Final Checks are made to ensure that work  \n       conforms with instructions, curing and other job   \n       requirements. \n3.2 Inform immediate superior upon completion of  \n       work.        \n3.3 Tools, equipment and any surplus resources  \n       and materials are checked and monitored in  \n       accordance with established procedures. \n3.4  Work area is maintained of its cleanliness and  \n       safety.\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              57\nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1.  Materials \nMay include but are not limited to : \n1.1 Mortar \n1.2 Plastering guide \n1.3 String or nylon cord \n1.4 Concrete and CW nails \n1.5 Water \n \n2.  Tools and equipment  \nMay include but are not limited to : \n2.1 Mason's hammer      \n2.2 Scaffolding \n2.3 Steel tape / push-pull rule \n2.4 Plumb bob \n2.5 Leveling tools ( leveling hose, spirit level) \n2.6 Pail \n2.7 Mortar box \n2.8 Pointed trowel \n2.9 Wooden float \n2.10 Steel float \n2.11 Shovel \n2.12 Foam / paper \n2.13 Straight edge / screed (bara) \n2.14 Mason’s brush \n2.15 Claw hammer \n \n3.  PPE \n \n \n \n \n3.1 Safety shoes \n3.2 Safety belt / body harness \n3.3 Safety helmet \n3.4 Proper working clothes \n4. Final checks  \n4.1 Plumbness \n4.2 Levelness \n4.3 Squareness \n4.4 Evenness or flatness of surface\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              58\nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \n \n \n \n \n \nAssessment requires evidence that the candidate: \n1.1 Correctly interpreted and identified plans and details \n1.2 Performed concrete / masonry  surface preparation in   \n       accordance with established plastering procedure  \n1.3 Performed plastering works consistent  with established  \n       plastering procedure  \n1.4 Demonstrated compliance with safety regulations applicable to   \n       work site operations \n1.5  Demonstrated ability to produce quality of plastering  works \n1.6  Demonstrated ability to erect and dismantle scaffolds \n1.7  Identified, minimized and eliminated safety hazards \n1.8  Communicated interactively with others when  applicable to  \n       ensure safe  and effective work operations \n1.9  Completed plastering concrete / masonry surface according to     \n       job specifications \n \n2.  Underpinning \n      Knowledge \n2.1 Safe work practices and first aid regulations \n            2.1.1 Prevention of accidents \n            2.1.2 Knows to do when accidents occur \n            2.1.3 First aid treatments and  regulations \n            2.1.4 Safe handling of materials,  tools and equipment \n            2.1.5 Housekeeping for safety \n            2.1.6 Safety signs and symbols \n            2.1.7 Rules on the safe use of scaffolds and ladders \n2.2 Trade Mathematics and Mensuration \n            2.2.1 Linear measurements \n            2.2.2 Fundamental operations of Mathematics \n            2.2.3 System of measurement / Metric system of  \n                     measurement \n2.3  Blueprint and specifications reading \n            2.3.1 Interpret Blueprints / Plans and Drawings \n            2.3.2 Composition, properties / types , uses and sizes of   \n                     plastering  \n2.4   Materials \n            2.4.1 Types / uses of Mortar \n            2.4.2 Scaffoldings construction elements and materials \n2.5  Trade theory \n            2.5.1 Plastering proportion & procedures \n2.6  Masonry tools and equipment \n             2.6.1 Types and Uses of Trowels \n             2.6.2 Measuring and Testing Tools \n             2.6.7 Types and uses of brick hammers     \n2.7  Masonry process \n             2.7.1 Methods of plastering works \n             2.7.2 Economic use of material\n\n--- PDF PAGE 61 ---\n_____________________________________________________________________________________________ \nTR MASONRY NC III                                                                                                                                                              59\n3.  Underpinning \nSkills \n \n3.1  Following safe work practices and first aid regulations \n3.2  Applying trade math and mensuration \n3.3  Interpreting blueprint and specifications \n3.4  Using materials, tools and equipment  \n3.5  Applying trade theory  \n3.6  Performing plastering processes  \n \n4.  Resource \nImplications \nThings necessary in order to conduct method of assessment: \n4.1  Workplace location/ simulated workplace setting \n4.2  Tools and equipment appropriate to construction processes \n4.3  Scaffolding/ form works / re-bars required for activity \n4.4  Masonry materials  relevant to the proposed activity \n4.5  Drawings/plans  and specifications relevant to the task \n \n5.  Methods of   \nAssessment \nCompetency in this unit  must be assessed through: \n5.1  Direct Observation  \n5.2  Interview \n5.3  Portfolio \n5.4 Third Party Report \n5.5  Demonstration  \n \n6.  Context for \nAssessment \n \n6.1  Competency may be assessed in the workplace or in a \nsimulated workplace setting\n",
