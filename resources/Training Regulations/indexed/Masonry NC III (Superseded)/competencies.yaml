          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify correct quantity and type of\nmaterials and tools / equipment used in hauling.\n1.2 Demonstrated ability to proper hauling and timely delivery of\ncorrect quantity and type of materials.\n1.3 Demonstrated ability to identify correct quantity and type of\nmaterials and tools / equipment used in mixing.\n1.4 Demonstrated ability to select and use PPE.\n\n2. Underpinning\nKnowledge\n2.1 Knowledge of basic linear measurement and simple arithmetic\n2.2 Interpret work instructions\n2.3 Prevention of accidents\n2.4 Safe handling of materials, tools and equipment\n2.5 Housekeeping for safety\n2.6 Safety signs and symbols\n2.7 Types of concrete blocks, bricks, cement and aggregates\n2.8 Uses and types of mortar\n2.9 Types of masonry anchors, ties and reinforcements\n\n3. Underpinning\nSkills\n3.1 Working safely\n3.2 Organizing materials to be used\n3.3 Mixing mortar\n3.4 Proper handling and use of tools and equipment\n3.5 Communicating effectively\n3.6 Using basic arithmetic\n\n4. Resource\nImplications\nThings necessary in order to conduct method of assessment:\n4.1 Workplace location\n4.2 Tools, and equipment appropriate to masonry jobs\n4.3 Materials relevant to the masonry works\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct Observation on actual workplace\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Demonstration on simulated situation\n5.5 Oral interview\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 45\nUNIT OF COMPETENCY :\nPERFORM BASIC MASONRY WORK\nUNIT CODE :"
