          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Correctly interpreted and identified plans and details\n1.2 Prepared and selected materials, tools and equipment\n consistent with specifications and job requirements\n1.3 Located brick / block structure based on reference building\n lines for proper alignment, squareness and dimension\n1.4 Performed / laid-out brick / block for structure in accordance\n with the required plumbness, levelness and squareness.\n1.5 Demonstrated compliance with safety regulations applicable to\n work site operations\n1.6 Identified, minimized and eliminated safety hazards\n1.7 Erected scaffold as per job requirement (max. height 1.8 m)\n1.8 Unexpected situations are responded accordingly.\n\n2. Underpinning\nKnowledge\n2.1 safe work practices and first aid regulations\n 2.1.1 Prevention of accidents\n 2.1.2 First aid treatments and regulations\n 2.1.3 Safe handling of materials, tools and equipment\n 2.1.4 Housekeeping for safety\n 2.1.5 Safety signs and symbols\n 2.1.6 Rules on the safe use of scaffolds and ladders\n2.2 Trade Mathematics and Mensuration\n 2.2.1 Linear measurements\n 2.2.2 Fundamental operations of Mathematics (4 basic\n operations)\n 2.2.3 System of measurement / Metric system of\n measurement\n2.3 Blueprint and specifications reading\n 2.3.1 Interpret blueprints\n 2.3.2 Composition, properties, uses and size of clay and\n masonry\n 2.3.3 Materials\n 2.3.4 Basic structural bonds and joints\n 2.3.5 Classification of concrete masonry units\n 2.3.6 Properties of concrete block\n 2.3.7 Material uses and specifications\n2.4 Materials\n 2.4.1 Types and uses of mortar\n 2.4.2 Masonry ties and reinforcements\n 2.4.3 Types of masonry anchors, ties and reinforcements\n 2.4.4 Wood products\n 2.4.5 Form works and platforms\n 2.4.6 Scaffoldings construction elements and materials\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 55\n\n2.5 Trade theory\n 2.5.1 Basic carpentry\n2.6 Masonry tools and equipment\n 2.6.1 Types and uses of trowels\n 2.6.2 Chipping tools\n 2.6.3 Measuring and testing tools\n 2.6.4 Use of power cutter\n 2.6.5 Masonry saw\n 2.6.6 Proper use of hand tools\n2.7 Masonry process\n 2.7.1 Knowledge of masonry processes\n 2.7.2 Good housekeeping\n 2.7.3 Economic use of material\n\n3. Underpinning\nSkills\n3.1 Following work practices and first aid regulations\n3.2 Applying trade Math and mensuration\n3.3 Interpreting blueprint and specifications\n3.4 Using materials, tools and equipment\n3.5 Applying trade theory\n3.6 Performing laying of brick / block processes\n\n4. Resource\nImplications\nThings necessary in order to conduct method of assessment:\n4.1 Workplace location\n4.2 Tools, plant and equipment appropriate to construction\n processes\n4.3 Scaffolding and form works required for activity\n4.4 Drawings and specifications relevant to the task\n4.5 Basic PPE\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct Observation\n5.2 Questions related to underpinning knowledge\n5.3 Interview\n5.4 Portfolio\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________________\nTR MASONRY NC III 56\n\nUNIT OF COMPETENCY : PLASTER CONCRETE / MASONRY SURFACE\nUNIT CODE :"
