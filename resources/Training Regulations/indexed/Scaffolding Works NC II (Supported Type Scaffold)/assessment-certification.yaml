  "source_text": "SECTION 4\n ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough informal training, previous work or life experiences may apply for\nrecognition in a particular qualification through competency assessment:\n\n4.1.4 Existing National Certificate in Scaffold Erection NC II will be renewed and\nconverted to the amended Training Regulations for Scaffolding Works NC II\n(Supported Type Scaffold).\n\n4.1.5 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations: It includes the following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n\n--- PDF PAGE 94 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 90\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is\navailable, where gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are authorized\nby TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 95 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 91\n ANNEX A\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand procedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nCOMPETENCY MAP - CONSTRUCTION SECTOR\n(Civil Works)\n SCAFFOLDING WORKS NC II (SUPPORTED TYPE SCAFFOLD)\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 96 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 92\n\nUtilize\nspecialize\nspecialized\ncommunicati\non skill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneu\nrial skills\nManage and\nsustain\neffective\ncommunicati\non strategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop\nand sustain\na high-\nperforming\nenterprise\n\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual\nof\ninstructions\n\nInterpret\ntechnical\ndrawings and\nplans\n\nPerform\nmensurations\nand\ncalculations\n\nMaintain\ntools and\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 97 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 93\n\nPrepare masonry\nmaterials\n\nPerform masonry tools and\nequipment\n\nPerform basic masonry\nworks\n\nLay concrete hollow block\nfor structure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-finish\nfloor concreting\nRectify non-conforming\nconcrete and masonry\nsurfaces\nLay tiles on plain and\ncurved surfaces for walls,\nfloors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and\nremove wooden formworks\n\nInstall wooden door jamb,\nwindow frame and panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall and/or\ncladding frames and\nboards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type\nscaffold\n\nHandle, segregate\nand stack\nscaffolding\ncomponents\n\nCORE COMPETENCIES\n\n--- PDF PAGE 98 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 94\n\nGLOSSARY OF TERMS\n\n1. FOOTING\n\nRefers to the widened base or substructure forming the\nfoundation for a wall or a column\n\n2. SCAFFOLD\n\nA temporary provided structure which provides access to, or\nfrom which persons work, for which is used to support materials,\nplant or equipment. Scaffold is frequently adapted for shoring\nand concrete works.\n\n3. PERSONAL\nPROTECTIVE\nEQUIPMENT\n(PPE)\n\n4. LIFTING\nDEVICES\n\n5. FALL\nPROTECTION\nDEVICES\n\n6. COMPUTER\nLITERATE\n\n7. 5S\n\n8. 3R\n\nReduce\n\nReuse\n\n Recycling\nIt is commonly referred to as PPE, is equipment worn to\nminimize exposure to hazards that cause serious workplace\ninjuries and illnesses. It can include items such as safety\nhelmets, gloves, eye protection, high-visibility clothing, safety\nfootwear and safety harnesses.\n\nIt is any work equipment for lifting and lowering loads, and\nincludes any accessories used in doing so (such as attachments\nto support, fix or anchor the equipment).\n\nIt is planned equipment used to protect a worker from death or\npotential injury in the event they would lose their balance while\nperforming a task at height.\n\nThis term is usually used to describe the most basic knowledge\nand skills needed to operate software products such as an\noperating system, a software application, or an automated Web\ndesign tool.\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain\n\nThe principle of reducing waste, reusing and recycling resources\nand products\n\nThe waste management concept of reducing what is produced\nand what is consumed\n\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\n\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 99 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 95\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nScaffolding Works NC II (Supported Type Scaffold)\nQualification Code:\nCONSCA218\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution\nNo./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created Scaffold Erection NC II\n2007-21 /\n07/27/07\nN/A\n01\nDocument\nAmended\nScaffolding Works NC II\n(Supported Type Scaffold)\n2018-34 /\n10/29/18\nNo. 006 series of\n2019\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 100 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 96\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nMR. HONORIO M. PADUA\nHP Heavy Eqpt. Insp. & Gen.\nServices\n\nMR. WILLIAM ENCILA\nEEI Corporation\nMR. JOJI C. VALENCIANO\nDTI-CMDF\n\nMR. ROMEO SEVILLO, JR.\nRMD Kwikform\nMR. DON R. ORIDO\nPSCSP\n\nMR. PORFIRIO ROMULO S. RIVA\nPSCSP\n\nPHILIPPINE CONSTRUCTORS ASSOCIATION, INC. (PCA)\n\n--- PDF PAGE 101 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 97\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n• First Balfour Inc.\n Parañaque City\n\n• Megawide Construction Inc.\n Quezon City\n\n• R.D. Policarpio & Co., Inc.\n Mabalacat, Pampanga\n\n• Will Decena and Associates, Inc.(WDA, Inc.)\nQuezon City\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Howard Mark N. Plete\n- Evangeline A. Cosep"
