  "source_text": "SECTION 1 SCAFFOLDING WORKS NC II (SUPPORTED TYPE SCAFFOLD)\n\nThe SCAFFOLDING WORKS NC II (Supported Type Scaffold) qualification consist of\ncompetencies that individuals must achieve to enable them to erect, check and correct and\ndismantle, all support type scaffold regardless of height and handle scaffold components, tools\nand equipment.\n\nThis qualification is packaged from the competency map of Construction Sector as shown\nin Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and\nprocedures\nExercise efficient and effective sustainable practices in\nthe workplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCON931201\nCON311201\nCON311202\nCON311203\nCON311204\n\nCODE NO.\nCON711323\nCON711324\n\nCOMMON COMPETENCIES\nPrepare construction materials and tools\nObserve procedures, specifications and manuals of instruction\nInterpret technical drawings and plans\nPerform mensurations and calculations\nMaintain tools and equipment\n\nCORE COMPETENCIES\nErect and dismantle supported type scaffold\nHandle, segregate and stack scaffolding components\n\nA person who has achieved this Qualification is competent to be a:\n Scaffolder\n\n--- PDF PAGE 6 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 2"
