emonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 84 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 80\nCORE COMPETENCIES\n (120 HOURS)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Erect and dismantle\n supported type\n scaffold\n1.1 Plan and prepare for\noperation\n• Enumerate the different site\nrules and regulations in\nerecting scaffold\n• Discuss the importance of\nwork instruction and\nassociated activities\n• Describe scaffold\ncomponents, tools and\nequipment are identified,\nchecked and segregated\n• Understand scaffold type\nand its capacity\n• Identifying and reporting\nobstructions and hazards in\nthe job site\n• Prepare scaffold sketches\n• Understanding the factors\naffecting productivity\n• Practicing 3R and 5S\n\n• Lecture /\ndiscussion\n• Demonstration\n\n• Observation\nof practical\nskills\n• Written test\n• Oral\nquestioning\n8 Hours\n\n--- PDF PAGE 85 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 81\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.2 Install scaffold\n• Demonstrate installation\n of barricades and\n signage’s\n• Understand the\n importance of site and\n foundation preparation\n• Demonstrate erection\n procedures\n• Demonstrate proper\n installation of fall\n protection devices and\n use of PPEs\n• Measuring work productivity\n• Finding ways of improving\nproductivity\n• Practicing 3R and 5S\n\n56 Hours\n\n1.3 Check and correct erected\nscaffold\n• Demonstrate checking\nusing tools and instruments\n• Measuring work productivity\n• Finding ways of improving\nproductivity\n• Practicing 3R and 5S\n\n6 Hours\n\n--- PDF PAGE 86 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 