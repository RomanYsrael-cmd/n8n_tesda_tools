 1.50 mtrs. L\n\n220\npcs.\nDouble Coupler or Fixed\nCoupler\n60 pcs. Swivel Clamps 2\" dia. x 500 lbs.\nCap.\n\n--- PDF PAGE 91 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 87\n3.5 TRAINING FACILITIES\n\nThe training facility is based on the size of class of 25 students / trainees.\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nContextual Learning\nLaboratory / Lecture Room\n5 x 8\n40\n40\nLearning Resource\nCenter\n4 x 5\n20\n20\nTool Room/Storage\n2 x 5\n10\n10\nWash room\n2 x 5\n10\n10\nCirculation area\n10 x 6\n60\n60\nTraining ground\n10 x 20\n200\n200\nTOTAL AREA\n\n340\n\nMATERIALS\nTabular type scaffolds\nDouble Couple or Fixed Coupler – 220pcs.\n\n--- PDF PAGE 92 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 88\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in Scaffolding\nWorks NC II (Supported Type Scaffold)\n• Must have completed the 40-Hour Construction Occupational Safety and Health\n(COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted by OSHC\nand DOLE accredited Safety Training Organizations\n• Must be computer-literate\n• Must be physically fit\n• Must have at least two (2) years industry experience in Scaffolding works and one\n(1) year teaching experience in Scaffolding works\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each unit\nof Competency.\n\n--- PDF PAGE 93 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 89"
