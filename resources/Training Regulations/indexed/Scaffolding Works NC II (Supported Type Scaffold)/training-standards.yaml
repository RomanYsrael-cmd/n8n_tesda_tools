 Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 84 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 80\nCORE COMPETENCIES\n (120 HOURS)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Erect and dismantle\n supported type\n scaffold\n1.1 Plan and prepare for\noperation\n• Enumerate the different site\nrules and regulations in\nerecting scaffold\n• Discuss the importance of\nwork instruction and\nassociated activities\n• Describe scaffold\ncomponents, tools and\nequipment are identified,\nchecked and segregated\n• Understand scaffold type\nand its capacity\n• Identifying and reporting\nobstructions and hazards in\nthe job site\n• Prepare scaffold sketches\n• Understanding the factors\naffecting productivity\n• Practicing 3R and 5S\n\n• Lecture /\ndiscussion\n• Demonstration\n\n• Observation\nof practical\nskills\n• Written test\n• Oral\nquestioning\n8 Hours\n\n--- PDF PAGE 85 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 81\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.2 Install scaffold\n• Demonstrate installation\n of barricades and\n signage’s\n• Understand the\n importance of site and\n foundation preparation\n• Demonstrate erection\n procedures\n• Demonstrate proper\n installation of fall\n protection devices and\n use of PPEs\n• Measuring work productivity\n• Finding ways of improving\nproductivity\n• Practicing 3R and 5S\n\n56 Hours\n\n1.3 Check and correct erected\nscaffold\n• Demonstrate checking\nusing tools and instruments\n• Measuring work productivity\n• Finding ways of improving\nproductivity\n• Practicing 3R and 5S\n\n6 Hours\n\n--- PDF PAGE 86 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 82\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.4 Dismantle scaffold\n• Demonstrate installation\n of barricades and\n signage’s\n• Demonstrate the use of fall\nprotection devices and\nPPEs\n• Demonstrate dismantling\nprocedure and stack piling\n• Measuring work productivity\n• Finding ways of improving\nproductivity\n• Practicing 3R and 5S\n\n24 Hours\n2. Handle, segregate\nand stack scaffold\ncomponents\n2.1 Plan and prepare for\noperation\n• Discuss the importance of\nwork instruction and\nassociated activities\n• Describe how scaffold\ncomponents, tools and\nequipment are identified,\nchecked and segregated.\n• Understanding the factors\naffecting productivity\n• Practicing 3R and 5S\n• Lecture /\ndiscussion\n• Demonstration\n\n• Observation\nof practical\nskills\n• Written test\n• Oral\n questioning\n8 Hour\n\n2.2 Demobilize scaffold\nequipment\n• Demonstrate manual\nhandling, segregating and\nstocking of scaffold\ncomponents, tools and\nequipment\n• Measuring work productivity\n• Finding ways of improving\nproductivity\n• Practicing 3R and 5S\n16 Hours\n\n2.3 Perform housekeeping\n• Demonstrate housekeeping\n2 Hours\n\n--- PDF PAGE 87 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 83\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution-Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 88 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 84\n\n•\nThe classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted\nby non-government organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such as\nbarangay hall, basketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• Can communicate both orally and in writing\n• Physically fit\n• Can perform basic mathematical computation and mensuration\n\n--- PDF PAGE 89 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 85\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\n\ntrainees for Scaffolding Works NC II (Supported Type Scaffold) are as follows:\n\nA. (Full Qualification)\n\n TOOLS\n\nQTY.\nITEM\n25 pcs.\nClaw Hammer\n25 pcs.\nCombination wrench/ Spanner / Ratchet (17mm-21mm)\n25 pcs.\nPull push rule (5m)\n25 pcs.\nMagnetic Level bar (24 inches) /\n5 pcs.\nPlumb bob\n5 pcs.\nSteel square (12 inches)