      "source_text": "Reduce"
    },
    {
      "source_text": "Reuse"
    },
    {
      "source_text": "Recycling It is commonly referred to as PPE, is equipment worn to minimize exposure to hazards that cause serious workplace injuries and illnesses. It can include items such as safety helmets, gloves, eye protection, high-visibility clothing, safety footwear and safety harnesses."
    },
    {
      "source_text": "It is any work equipment for lifting and lowering loads, and includes any accessories used in doing so (such as attachments to support, fix or anchor the equipment)."
    },
    {
      "source_text": "It is planned equipment used to protect a worker from death or potential injury in the event they would lose their balance while performing a task at height."
    },
    {
      "source_text": "This term is usually used to describe the most basic knowledge and skills needed to operate software products such as an operating system, a software application, or an automated Web design tool."
    },
    {
      "source_text": "The five in a 5S workplace organizational and housekeeping methodology refers to five steps – sort, set in order, shine, standardize and sustain"
    },
    {
      "source_text": "The principle of reducing waste, reusing and recycling resources and products"
    },
    {
      "source_text": "The waste management concept of reducing what is produced and what is consumed"
    },
    {
      "source_text": "The waste management concept of reusing items, or re- purposing them for a use different than what they are intended for"
    },
    {
      "source_text": "The waste management concept of transforming again into a raw material that can be shaped into a new item"
