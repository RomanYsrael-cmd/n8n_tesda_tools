    },
    {
      "source_text": "1. FOOTING"
    },
    {
      "source_text": "Refers to the widened base or substructure forming the foundation for a wall or a column"
    },
    {
      "source_text": "2. SCAFFOLD"
    },
    {
      "source_text": "A temporary provided structure which provides access to, or from which persons work, for which is used to support materials, plant or equipment. Scaffold is frequently adapted for shoring and concrete works."
    },
    {
      "source_text": "3. PERSONAL PROTECTIVE EQUIPMENT (PPE)"
