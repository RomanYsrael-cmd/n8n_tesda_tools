    {
      "source_text": "CODE NO. CON931201 CON311201 CON311202 CON311203 CON311204"
    },
    {
      "source_text": "CODE NO. CON711323 CON711324"
    },
    {
      "source_text": "COMMON COMPETENCIES Prepare construction materials and tools Observe procedures, specifications and manuals of instruction Interpret technical drawings and plans Perform mensurations and calculations Maintain tools and equipment"
    },
    {
      "source_text": "CORE COMPETENCIES Erect and dismantle supported type scaffold Handle, segregate and stack scaffolding components"
