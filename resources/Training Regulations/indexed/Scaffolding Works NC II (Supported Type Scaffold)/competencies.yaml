        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned and prepared erection of scaffold\n1.2 Installed scaffold\n1.3 Checked and corrected scaffold\n1.4 Dismantled scaffold and cleaned up\n1.5 Observed safety measures applicable to worksite\noperation\n1.6 Communicated effectively with others to ensure\neffective work operation\n1.7 Observed and complied with the productivity\nrequirements\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the\nrequired tasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 67 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 63\n\nUNIT OF COMPETENCY\n:\nHANDLE, SEGREGATE AND STACK SCAFFOLD\nCOMPONENTS\n\nUNIT CODE\n\n:"
        },
        "source_text": "CON711323\n\n UNIT DESCRIPTOR\n\n:\nThis unit describes the knowledge, skills and attitudes\n\n for scaffold erection and dismantling, particularly\n\nplanning, preparing and operating This is in order to\nprovide work platforms, edge protection and access\nways in accordance with industry practice.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and prepare for\noperation\n\n1.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n1.1 Purpose of scaffolding\nis determined with\nassociated activities\n1.2 Site rules and\nregulations in erecting\nscaffold is observed\nand followed according\nto safety and health\npractices\n1.3 Work instruction and\ndrawing are reviewed,\nconfirmed and clarified\nwith the supervisor.\n1.4 Tools and Equipment\nare checked and\nsegregated in\naccordance to industry\npractice\n1.5 Scaffold components\nare identified in\naccordance to industry\npractice\n1.6 Types of supported\nscaffold and its capacity\nare understood for the\nnecessary job\nrequirement\n1.1 DO 128-13\nfamiliarity\n1.2 Green Building\nConcept relative\nto Construction\n(3R, 5S)\n1.3 Basic English\nand Filipino\nlanguage (written\nand verbal)\n1.4 Types and uses\nof\ncommunication\nmedia\n1.5 Interpreting\nsketches and\nplans\n1.6 Site rules and\nregulations\n1.7 Physical\nassessment of\nSite condition\n1.8 Site access\n1.9 Emergency route\n1.10 Safety officers\n1.11 Safety office\n1.12 Emergency\nprocedures\n1.13 Basic Scaffold\ndesign\n1.14 Steel types and\ngrades\n\n1.1 Using\ncommunication\nmedium\n1.2 Applying trade\nMathematics and\nfactor of safety\n1.3 Checking and\nsegregating\nscaffold\ncomponents\n1.4 Preparing\nsketches\n1.5 Assessing of site\ncondition\n1.6 Using PPE\n1.7 Implementing 5S\n\n--- PDF PAGE 59 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 55\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n1.7 Obstructions and\nhazards in the job site\nare checked, identified\nreported\n1.8 Proposed sketches of\nmodified scaffold are\ndrawn in accordance to\nsite condition/project\nrequirements\n1.9 Communication and\ncoordination with\nother workers is\nestablished and\nmaintained in\naccordance to job\nrequirement\n1.10 Safety practices are\napplied according to\nOSHS and other\napplicable references\n1.11 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n1.12 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n1.15 Trade\nMathematics\nBasic planar\nmeasurement\n(English, metric)\n1.16 Basic weight\nmeasurement\n(English, metric)\n1.17 Types and uses\nof scaffold and\ncomponents\n1.18 Visual check of\ntools, equipment\nand scaffold\ncomponents\n1.19 Lifting equipment\nand accessories\n1.20 Erection\nmethodology of\nsupported type\nscaffold\n1.21 Different\nmanufactured\nscaffold\n\n--- PDF PAGE 60 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 56\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Install scaffold\n2.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n2.1 Scaffolding plan/\ndrawing is observed in\ncompliance with work\ninstruction.\n2.2 Site and foundation are\nprepared in accordance\nwith OSHS\nrequirements, codes of\npractice and engineer's\ninstructions\n2.3 Plans are laid-out as\nper design or\nmanufacturer’s\nspecification\n2.4 Footings are prepared\nin accordance with\nOSHS requirements,\ncodes of practice,\nmanufacturer\nspecifications and\nengineer's instructions\n2.5 Scaffold 