d\nand kept in safe state\nin line with\nOccupational Safety\nand Health (OSHS)\n\n2.1 Use of PPE\n2.2 Handling of tools\nand equipment\n2.3 Good\nhousekeeping\n2.4 Types and uses\nof lubricants\n2.5 Types and uses\nof cleaning\nmaterials\n2.6 Methods and\ntechniques\n2.7 Procedures\n\n2.1 Handling of tools\nand equipment\n2.2 Performing\npreventive\nmaintenance\n\n--- PDF PAGE 55 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 51\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3 Store tools and\nequipment\n\n3.1 Inventory of tools,\ninstruments and\nequipment are\nconducted and\nrecorded as per\ncompany practices\n3.2 Tools and equipment\nare stored safely in\nappropriate locations in\naccordance with\nmanufacturer's\nspecifications or\ncompany procedures\n\n3.1 Use of PPE\n3.2 Handling of tools\nand equipment\n3.3 Storing\nprocedures and\ntechniques\n3.4 Storage\nconditions/\nlocations\n\n3.1 Storing tools and\nequipment\n3.2 Handling of tools\nand equipment\n\n--- PDF PAGE 56 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw\nBoring tools - brace, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n3. Personal Protective\nEquipment (PPE)\nMay include:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Reflectorized Vest\n\n--- PDF PAGE 57 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 53\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n3.1 Selected and used appropriate p