          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned and prepared for operation\n1.2 Demobilized scaffold equipment\n1.3 Performed house keeping\n1.4 Observed safety measures applicable to worksite\n Operation\n1.5 Communicated effectively with others to ensure\n effective work operation\n1.6 Observed and complied with the productivity\nrequirements\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the\n required tasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 71 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 67"
