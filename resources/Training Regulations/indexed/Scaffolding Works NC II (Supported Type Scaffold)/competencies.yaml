        "source_text": "CON311201\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying, interpreting, applying services to\nspecifications and manuals and storing manuals.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify and access\nspecification/\nmanuals\n\n1.1 Appropriate manuals are\nidentified and accessed\nas per job requirements\n1.2 Version and date of\nmanual are checked to\nensure that correct\nspecification and\nprocedures are\nidentified\n1.1 Types of\nmanuals used in\nheavy\nequipment\noperation\n1.2 Identification of\nsymbols used in\nthe manuals\n\n1.1 Identifying\nmanuals and\nspecifications\n1.2 Accessing\ninformation and\ndata\n\n2. Interpret manuals\n2.1 Relevant sections,\nchapters of\nspecifications/ manuals\nare located in relation to\nthe work to be\nconducted\n2.2 Information and\nprocedure in the manual\nare interpreted in\naccordance with\nindustry practices\n\n2.1 Types of\nmanuals used in\nheavy\nequipment\noperation\n2.2 Types of\nsymbols used in\nmanuals\n2.3 System of\nmeasurements\n2.4 Unit conversion\n2.1 Interpreting\nsymbols and\nspecifications\n2.2 Accessing\ninformation and\ndata\n2.3 Applying\nconversion of units\nof measurements\n\n--- PDF PAGE 44 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 40\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Apply information in\nmanual\n3.1 Manual is interpreted\naccording to job\nrequirements\n3.2 Work steps are\ncorrectly identified in\naccordance with\nmanufacturer's\nspecification\n3.3 Manual data are\napplied according to\nthe given task\n3.4 All correct sequencing\nand adjustments are\ninterpreted in\naccordance with\ninformation contained\non the manual or\nspecifications\n3.1 Types of\nmanuals used in\nheavy\nequipment\noperation\n3.2 Types and\napplication of\nsymbols in\nmanuals\n3.3 Unit conversion\n3.1 Applying\ninformation from\nmanuals\n\n4. Store manuals\n4.1 Manual or specification\nis stored appropriately\nto prevent damage,\nready access and\nupdating of information\nwhen required in\naccordance with\ncompany requirements\n\n4.1 Types of\nmanuals used in\nheavy equipment\noperation\n4.2 Manual storing\nand maintaining\nprocedures\n\n4.1 Storing and\nmaintaining\nmanuals\n\n--- PDF PAGE 45 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 41\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\n\nMay include:\n1.1 Manufacturer's Specification Manual\n1.2 Maintenance Procedure Manual\n1.3 Periodic Maintenance Manual\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 All manuals/catalogues relative to construction sector\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 46 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 42\nUNIT OF COMPETENCY\n:\nINTERPRET TECHNICAL DRAWINGS AND PLANS\n\nUNIT CODE\n\n:"
