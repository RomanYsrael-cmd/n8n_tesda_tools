        "source_text": "CON711324\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to prepare for demobilization handling and\nstacking of scaffold components.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and prepare\nfor operation\n1.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n1.2 Work instruction is\nreviewed, confirmed\nand clarified with\nappropriate\nPersonnel\n1.3 Occupational Safety\nand Health Standards\n(OSHS) requirements\nconsistent to handle,\nsegregate and stack\nscaffold components,\ntools and equipment are\nverified.\n1.4 Tools and equipment\nare identified and\nselected in line with\nindustry practice.\n1.5 Scaffolding\ncomponents, tools and\nequipment are checked\nfor serviceability.\n1.6 Safety practices are\napplied according to\nOSHS and other\napplicable references\n1.7 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n1.1 DO 128-13,\nseries 2013\nAmending Rule\n1414 on\nScaffolding of the\nOSHS)\n1.2 Green Building\nConcept relative\nto Construction\n(3R, 5S)\n1.3 Basic English and\nFilipino language\n(written and\nverbal)\n1.4 Types and uses\nof communication\nmedia\n1.5 Company rules\nand regulations\n1.6 Occupational\nSafety and Health\nStandards\n(OSHS)\nspecifications\n1.7 Basic weight\nmeasurement\n(English, metric)\n1.8 Scaffold\ncomponents,\ntools and\nequipment’s\n1.1 Using\ncommunication\nmedium\n1.2 Applying trade\nMathematics and\nfactor of safety\n1.3 Checking and\nsegregating\nscaffold\ncomponents\n1.4 Implementing 5S\n\n--- PDF PAGE 68 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 64\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n1.8 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n2. Demobilize scaffold\nequipment\n2.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n2.2 Scaffolding\ncomponents are moved\nto specified location\nfollowing OSHS and\nother applicable\nreferences\n2.3 Segregating and\nstacking procedure is\nperformed for scaffold\ncomponents based on\nindustry practice\n2.4 Scaffold components,\ntools and equipment are\nprotected against\nphysical, chemical,\nenvironmental damages\n2.5 Scaffold components,\ntools and equipment\nare cleaned, checked,\nmaintained, stored in a\nmanner clear of access\nways, ease of\nidentification, retrieval\nand distribution\n2.6 Occupational Safety\nand Health Standards\n(OSHS) requirements\nconsistent to handle and\nuse scaffolding tools\nand equipment are\nverified and complied\nwith\n2.7 Safety practices are\napplied according to\nOSHS and other\napplicable references\n2.1 DO 128-13,\nseries 2013\nAmending Rule\n1414 on\nScaffolding of the\nOSHS)\n2.2 Green Building\nConcept relative\nto Construction\n(3R, 5S)\n2.3 Types and uses\nof communication\nmedium\n2.4 Company rules\nand regulations\n2.5 Occupational\nSafety and Health\nStandards\n(OSHS)\n2.6 Basic weight\nmeasurement\n2.7 scaffold tools and\nequipment\n2.8 Types of binding\nequipment\n2.9 Techniques in\nstacking and\nstocking\n2.10\nFactors\naffecting\nproductivity\n2.11\nProductivity\nwork\nmeasurements\n2.12\nWays of\nimproving\nproductivity\n\n2.1 Following OSHS\nand other relevant\nregulatory\nrequirements for\nhandling scaffold\ncomponent, tools\nand equipment\n2.2 Using\ncommunication\nmedium\n2.3 Following industry\npractice for\nhandling\nscaffolding\n2.4 Applying trade\nMathematics\n2.5 Use and\nmaintenance of\ntools\n2.6 Using PPE\n2.7 Implementing 3R\nand 5S\n\n--- PDF PAGE 69 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 65\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n2.8 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n2.9 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n3. Perform\nhousekeeping\n3.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards.\n3.2 Excess/un-used\nmaterials are recovered\nand stockpiled\naccording to company\nrules and procedures\n3.3 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 & 42)\n3.4 Tools and other\nmaterials are\ncleaned after use.\n3.5 Required output is\ncompleted as specified\nby the immediate\nsupervisor based on\nwork schedule.\n\n3.1 DO 128-13,\nseries 2013\nAmending Rule\n1414 on\nScaffolding of the\nOSHS)\n3.2 Green Building\nConcept relative\nto Construction\n(3R, 5S\n3.3 Safe handling\nand standard\nspecification of\nmaterials and\ntools\n3.4 Safety signs and\nsymbols\n3.5 Adherence to\nwork\nrequirements\n\n3.1 Following\noccupational\nhealth and\nsafety/environmen\ntal management\nplans\n3.2 Working safely\n3.3 Organizing\nmaterials to be\nstored\n3.4 Handling and use\nof materials and\ntools\n3.5 Communicating\neffectively\n3.6 Using PPE\n3.7 Implementing 3R\nand 5S\n\n--- PDF PAGE 70 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 66\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate personnel\nMay include:\n1.1 Supervisor\n1.2 Qualified Person\n1.3 Safety officer\n\n2. Segregating and stacking\nprocedure\nMay include:\n2.1 Welded Frame type\n2.2 Tube and coupler/fittings type\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned and prepared for operation\n1.2 Demobilized scaffold equipment\n1.3 Performed house keeping\n1.4 Observed safety measures applicable to worksite\n Operation\n1.5 Communicated effectively with others to ensure\n effective work operation\n1.6 Observed and complied with the productivity\nrequirements\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the\n required tasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 71 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 67"
