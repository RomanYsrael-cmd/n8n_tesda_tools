        "source_text": "CON311203\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select measuring\ninstruments\n\n1.1 Object or component to\nbe measured is\nidentified, classified\nand interpreted\naccording to the\nappropriate regular\ngeometric shape\n1.2 Measuring tools are\nselected/identified as\nper object to be\nmeasured or job\nrequirements\n1.3 Correct specifications\nare obtained from\nrelevant sources\n1.4 Measuring\ninstruments are\nselected according to\njob requirements\n1.5 Alternative measuring\ntools are used without\nsacrificing cost and\nquality of work\n\n1.1 Types of\nmeasuring tools\nand its uses\n\n1.1 Selecting\nmeasuring\ninstruments\n\n--- PDF PAGE 50 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 46\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Carry out\nmeasurements and\ncalculations\n\n2.1 Measurements are\nobtained according to\njob requirements\n2.2 Alternative measuring\ntools are used without\nsacrificing cost and\nquality of work\n2.3 Calculations needed to\ncomplete work tasks are\nperformed using the\nfour basic process of\naddition (+), subtraction\n(-), multiplication (x) and\ndivision (/)\n2.4 Calculations involving\nfractions, percentages\nand mixed numbers are\nused to complete\nworkplace tasks\n2.5 Numerical computation\nis self-checked and\ncorrected for accuracy\n2.6 Instruments are read to\nthe limit of accuracy of\nthe tool\n2.7 Systems of\nmeasurement identified\nand converted\naccording to job\nrequirements/ISO\n2.8 Work pieces are\nmeasured according to\njob requirements\n\n2.1 Measurements\n2.1.1 Linear\nmeasurement\n2.1.2 Geometrical\nmeasurement\n2.2 Trade\nMathematics\n2.2.1 Unit\nconversion\n2.2.2 Ratio and\nproportion\n2.3 Area\n\n2.1 Interpreting\nformulas for\nvolume, areas,\nperimeters of\nplane and\ngeometric figures\n2.2 Handling of\nmeasuring\ninstruments\n\n--- PDF PAGE 51 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Geometric shape\n\n May include:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring\n instruments\nMay include:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Thickness gauge\n2.4 Torque gauge\n2.5 Small hole gauge\n2.6 Try-square\n2.7 Protractor\n2.8 Steel ruler\n2.9 Voltmeter\n2.10 Ammeter\n2.11 Gauges\n2.12 Thermometers\n3. Measurements\nand calculations\nMay include:\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Amperage\n3.7 Inside diameter\n3.8 Length\n3.9 Thickness\n3.10 Outside diameter\n3.11 Density\n\n--- PDF PAGE 52 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 48\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in\naccordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Problems to solve\n2.3 Measuring instrument appropriate to carry out tasks\n2.4 Instructional materials relevant to the propose activity\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 53 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/