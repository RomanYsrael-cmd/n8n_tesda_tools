  "source_text": "1. FOOTING\n\nRefers to the widened base or substructure forming the\nfoundation for a wall or a column\n\n2. SCAFFOLD\n\nA temporary provided structure which provides access to, or\nfrom which persons work, for which is used to support materials,\nplant or equipment. Scaffold is frequently adapted for shoring\nand concrete works.\n\n3. PERSONAL\nPROTECTIVE\nEQUIPMENT\n(PPE)\n\n4. LIFTING\nDEVICES\n\n5. FALL\nPROTECTION\nDEVICES\n\n6. COMPUTER\nLITERATE\n\n7. 5S\n\n8. 3R\n\nReduce\n\nReuse\n\n Recycling\nIt is commonly referred to as PPE, is equipment worn to\nminimize exposure to hazards that cause serious workplace\ninjuries and illnesses. It can include items such as safety\nhelmets, gloves, eye protection, high-visibility clothing, safety\nfootwear and safety harnesses.\n\nIt is any work equipment for lifting and lowering loads, and\nincludes any accessories used in doing so (such as attachments\nto support, fix or anchor the equipment).\n\nIt is planned equipment used to protect a worker from death or\npotential injury in the event they would lose their balance while\nperforming a task at height.\n\nThis term is usually used to describe the most basic knowledge\nand skills needed to operate software products such as an\noperating system, a software application, or an automated Web\ndesign tool.\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain\n\nThe principle of reducing waste, reusing and recycling resources\nand products\n\nThe waste management concept of reducing what is produced\nand what is consumed\n\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\n\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 99 ---\nSCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018)