      "term": "3R",
      "definition": "Reduce Reuse Recycling It is commonly referred to as PPE, is equipment worn to minimize exposure to hazards that cause serious workplace injuries and illnesses. It can include items such as safety helmets, gloves, eye protection, high-visibility clothing, safety footwear and safety harnesses. It is any work equipment for lifting and lowering loads, and includes any accessories used in doing so (such as attachments to support, fix or anchor the equipment). It is planned equipment used to protect a worker from death or potential injury in the event they would lose their balance while performing a task at height. This term is usually used to describe the most basic knowledge and skills needed to operate software products such as an operating system, a software application, or an automated Web design tool. The five in a 5S workplace organizational and housekeeping methodology refers to five steps – sort, set in order, shine, standardize and sustain The principle of reducing waste, reusing and recycling resources and products The waste management concept of reducing what is produced and what is consumed The waste management concept of reusing items, or re- purposing them for a use different than what they are intended for The waste management concept of transforming again into a raw material that can be shaped into a new item SCAFFOLDING WORKS NC II (Supported Type Scaffold) Revision 01 Promulgated (10/29/2018) 95 TRAINING REGULATIONS (TR) DOCUMENT REVISION HISTORY Qualification Title: Scaffolding Works NC II (Supported Type Scaffold) Qualification Code: CONSCA218 Revision No. Document Types* Qualification Title TESDA Board Resolution No./ Date Deployment (TESDA Circular/ Implementing Guidelines) 00 Document Created Scaffold Erection NC II 2007-21 / 07/27/07 N/A 01 Document Amended Scaffolding Works NC II (Supported Type Scaffold) 2018-34 / 10/29/18 No. 006 series of 2019 Legend: *Description Types - Document Created - Document Amended SCAFFOLDING WO