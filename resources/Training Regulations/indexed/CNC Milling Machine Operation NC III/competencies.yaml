        "source_text": "MEE722210\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to measure\nworkpieces using fixed and adjustable gages.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use fixed and\nadjustable gages\n1.1\n\n1.2\n\n1.3\nAppropriate gages are selected and used to\nundertake the required comparison or\nmeasurement using standard operating\nprocedures.\nConsistent and accurate measurements obtained\nconforms to drawing specification\nMeasuring technique used is correct and\nappropriate to the device used.\n2.\nPerform surface texture\nmeasurements\n2.1\n\n2.2\nSurface textures are measured according worksite\nprocedures.\nMeasurements taken are within the level of\naccuracy required.\n3.\nClean and store\nmeasuring tools\n3.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard\noperating procedures.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Gages\nFixed and adjustable gages include:\n1.1 Gage blocks\n1.2 Telescoping gages\n1.3 Center gages\n1.4 Thread gages\n1.5 Dial bore gages\n1.6 Height gages\n1.7 Radius gages\n1.8 Go-no-go gages\n1.9\nDepth gages\n2. Measurements\nMeasurements undertaken may include:\n2.1 Linear dimensions\n2.2 Diameters\n2.3 Depths\n2.4 Fits\n2.5 Tapers\n2.6 Threads\n2.7 Radius\n2.8 Squareness\n2.9 Surface texture\netc\n\n--- PDF PAGE 41 ---\nTR – CNC Milling Machine Operation NC III\n39\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used fixed and adjustable gages\n1.2 Performed surface texture measurements\n1.3 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge\n2.1 Types and application of fixed and adjustable gages\n2.2 Gage limits and accuracy\n2.3 Techniques for measuring components\n2.4 Care and storage procedure of measuring tools\n3.\nUnderpinning\nskills\n3.1 Safe handling of measuring tools and materials\n3.2 Verifying measurements with drawing specifications\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n4.3 Drawing\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 42 ---\nTR – CNC Milling Machine Operation NC III\n40\nUNIT OF COMPETENCY\nPERFORM PREVENTIVE AND CORRECTIVE\nMAINTENANCE\n\nUNIT CODE:"
