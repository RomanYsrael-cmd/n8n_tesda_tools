        "source_text": "MEE821310\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to write complex\n programs for CNC milling machine with 3 or more\n axes.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\n\nDrawings are interpreted to produce component to\nspecifications.\nSequence of operation is determined to produce\ncomponent according to specification.\nCutting tools are selected according to the\nrequirements of the operation.\nCutting speed and feed rate calculated based on\nworkpiece and cutting tool material.\nProcess / job / adjustment sheets are filled up with\nrelevant machine, tool and raw material data.\n2\nWrite advanced CNC\nmilling machine program\n2.1\n\n2.2\n\nCoordinates calculated for complex tool path or\nadvanced machining functions based on part or\nproduct to be produced.\nProgram written in standard CNC milling\noperations, code format in accordance with\nstandard operating procedures.\n3\nEdit advanced CNC\nmilling machine\nprograms\n3.1\n\n3.2\n\n3.3\nProgram is simulated and edited according to\nstandard operating procedures.\nProgram is saved to the machine according to\nstandard operating procedures.\nProgram is downloaded to the machine according\nto standard operating procedures.(Optional)\n\n--- PDF PAGE 48 ---\nTR – CNC Milling Machine Operation NC III\n46\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawings\nReading and interpretation:\n1.1 Dimensions and symbols\n1.2 Tolerances\n2. Cutting Tools\nCutting tools used in milling operations include:\n2.1 Drills\n2.2 Reamers\n2.3 Slitter\n2.4 End mills\n2.5 Shell mills\n2.6 Side and face cutters\n2.7 Formed cutter\n2.8 T-slot cutter\n2.9 Ball end mill\n2.10 Engraving\n2.11 Dovetail\n2.12 Tap\n2.13 NC start drill\n2.14 Center drill\n3. Workpiece\nWorkpiece materials used in milling operations:\n3.1 Ferrous metals\n3.2 Non-ferrous metals\n3.3 Non – metallic materials\n4. Milling Operations\nComplex CNC milling operations:\n4.1 drilling\n4.2 boring\n4.3 milling slot and keyways\n4.4 milling serrations\n4.5 milling vees\n4.6 milling circular and rectangular pockets\n4.7 milling circular slots\n4.8 milling contour\n4.9 Tapping\n4.10 Reaming\n4.11 Engraving\n4.12 Chamfering\n4.13 4th - axis operation\n\n--- PDF PAGE 49 ---\nTR – CNC Milling Machine Operation NC III\n47\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 determined job requirements\n1.2 wrote advanced CNC milling machine program\n1.3 edited advanced CNC milling machine programs\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Drawing interpretation\n2.1.1 Standard drawing scales, symbols and abbreviations\n2.1.2 Orthographic and isometric drawings\n2.1.3 Assembly and detailed drawings\n2.1.4 Interpreting tolerances\n2.1.5 Geometrical Tolerances (form and position)\n2.1.6 Surface condition (surface finish/texture)\n2.1.7 limits and fits\n\n2.2 Shop mathematics\n2.2.1 Four fundamental operation\n2.2.2 Fractions and decimals\n2.2.3 Percentages and ratios\n2.2.4 Conversion of units (English to metric)\n2.2.5 Pythagorean theorem\n2.2.6 Basic trigonometric function\n\n2.3 Materials and related science\n2.3.1 Classification and mechanical properties of\nengineering materials\n\n2.4 Milling machine operations\n2.4.1 Calculation of cutting speed, rpm, feed rate\n2.4.2 Classification/selection of cutting tools and tool\ngeometry\n2.4.3 Milling operation processes\n\n2.5 4th axis operation\n3.\nUnderpinning\nskills\n3.1 Selection of cutting tools\n3.2 Computation of feed, cutting speed and machine rpm\n3.3 Application of G – codes and M – codes\n3.4 Application of 4th –axis\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Drawings, sketches or blueprint/materials\n4.2 Computers and simulation software’s\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 direct observation with questioning\n5.2 written exam\n5.3 demonstration (actual programming)\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 50 ---\nTR – CNC Milling Machine Operation NC III\n48\nUNIT OF COMPETENCY :\nSet-up multiple-axis CNC milling machine,\nworkpiece and cutting tools\n\nUNIT CODE\n\n:"
