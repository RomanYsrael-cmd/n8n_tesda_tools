        "evidence_guide": {
          "source_text": "1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 Performed machine and cutting tools set-up\n1.2 Downloaded/ inputed programs\n1.3 Performed workpiece set-up\n1.4 Performed program dry run\n1.5 Performed trial cut on workpiece\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Measurements\n2.2.1 Linear measuring tools (vernier, micrometer)\n2.2.2 Angular measuring tools (Vernier bevel protractor)\n2.2.3 Geometrical tolerances measuring tools\n(dial test indicator, radius gauge, vernier height\ngauge, 2 pt. bore gauge, 3 pt. bore gauge)\n2.2.4 Surface finish measuring instrument\n\n2.3 4th axis operation\n3.\nUnderpinning\nskills\n3.1 Identification of cutting tools\n3.2 Use of measuring instruments\n3.3 Determining workpiece specifications\n3.4 Scratch method for tool set-up\n3.5 Use of tool setter\n3.5 Application of 4th axis operation\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 direct observation\n5.2 demonstration\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 53 ---\nTR – CNC Milling Machine Operation NC III\n51\nUNIT OF COMPETENCY :\nPerform Advanced CNC Milling Machine\n Operations\n\nUNIT CODE\n\n:",
