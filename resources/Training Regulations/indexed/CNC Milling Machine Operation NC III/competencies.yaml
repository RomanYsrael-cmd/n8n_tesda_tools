        "source_text": "MEE722211\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nperforming preventive and corrective maintenance such\nas inspection and repair of hand tools, cleaning and\nlubrication of machine parts and changing drive pulley\nand belts.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform inspection of\nmachine\n\n1.1\n\n1.2\nMachine inspected according to worksite\nprocedures.\nStatus/Report recorded on proforma or reported\norally according to worksite procedure.\n2.\nPerform cleaning and\nlubricating of machine\n\n2.1\n\n2.2\nMachines lubricated as per manufacturer’s\nrecommendation using appropriate tools and\nmaterials\nFluids and lubricants replaced and/or topped up\naccording to prescribed schedule.\n3.\nPerform minor machine\nrepair and adjustments\n\n3.1\n\n3.2\nMinor machine repairs performed according to\nmanufacturer’s instruction or worksite procedures.\nMachine moving parts adjusted to manufacturer’s\nspecifications.\n4.\nMaintain hand tools\n4.1\n4.2\nTool cutting ground to recommended specifications\nHand tools lubricated and stored according to\nprescribed procedure\n\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1 V-belt\n1.2 Bearing\n1.3 Gears\n1.4 Clutch\n1.5 Drive pulley\n2. Machines\nMachine include but not limited to:\n2.1 Lathe machine\n2.2 Milling machine\n2.3 Grinding machine\n2. Tools and materials\nTools and materials used include:\n3.1 Lubricants\n3.2 Oil can\n3.3 Grease gun\n3.4 Oil\n3.5 Coolant or compound\n\n--- PDF PAGE 43 ---\nTR – CNC Milling Machine Operation NC III\n41\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that that the candidate:\n1.1 Performed inspection of machine\n1.2 Performed cleaning and lubricating of machine\n1.3 Performed minor machine repairs and\nadjustments\n2. Underpinning knowledge\n2.1 Proper cleaning and oiling\n2.2 Kinds of oil\n2.3 Parts and function of machine tools\n2.4 Cutting oil, coolant or compound\n2.5 Pulleys and belts\n2.6 Location of main switches of the machine\n2.7 Handling and storage of tools\n2.8 Checklist of safe working conditions\n2.9 Procedures in cleaning and disposal of waste\nmaterials\n3. Underpinning skills\n3.1 Inspecting and repairing hand tools\n3.2 Inspecting and changing drive pulleys and belts\n3.3 Replacing and adjusting machine parts\n3.4 Distinguishing old and new coolant\n3.5 Distinguishing odor of polluted coolant\n3.6 Selecting coolant, cutting oil or compounds\n3.7 Changing coolant\n3.8 Inspecting work area for safe working\nenvironment\n3.9 Cleaning work area\n3.10 Disposing metal scraps, chips and waste\n materials.\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to\n processes or activity\n4.2 Materials relevant to the proposed activity\n5. Method of Assessment\nCompetency may be assessed through:\n5.1 direct observation of activities\n5.2 oral or written questioning\n6. Context for Assessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 44 ---\nTR – CNC Milling Machine Operation NC III\n42\nUNIT OF COMPETENCY: PREPARE COST ESTIMATES\n\nUNIT CODE\n :\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to calculate costs\nfor a particular job order/request in a machine-shop or\nmetal-working environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine customer\nrequirements\n1.1. Plans/ drawings are interpreted to produce component\nto specifications.\n1.2. Cost-effective sequence of operations to produce\ncomponent to specifications is determined in\naccordance with worksite policies.\n1.3. Where available, sample part or product is inspected\nfor parameters relevant to cost determination.\n1.4. Materials are determined according to the job\nrequirements.\n1.5. Additional details of job are obtained through\ndiscussion with customer or from information supplied.\n1.6. Where applicable, client is advised on the feasibility\nand cost-effectiveness of the production job based on\nthe constraints/capabilities of the machine and current\nmarket prices.\n2. Estimate cost\ncomponents\n2.1 Cost components are calculated based on job\nrequirements and worksite procedures.\n2.2 Where necessary data on current costs are verified with\nthe current market price.\n2.3 Appropriate personnel are consulted with regard to\nadditional data for costing.\n3. Cost the job\n3.1. Costing is set at optimal and affordable levels based on\ncustomer requirements and worksite procedures.\n3.2. Where necessary, initial/rough cost estimate is\nprovided to client following worksite procedures.\n3.3. Total production costs are determined and finalized\nin accordance with worksite procedures.\n\n4. Verify and document\ncosts\n4.1. Cost quotations are finalized and cleared with\npersonnel concerned.\n4.2. Costing details are documented and filed for future re-\nuse or reference based on worksite procedures.\n\n--- PDF PAGE 45 ---\nTR – CNC Milling Machine Operation NC III\n43\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Cost components\nMay include :\n1.1 Labor cost\n1.2 Hourly machine cost\n1.3 Overhead / energy cost\n1.4 Capital\n1.5 Depreciation costs\n1.6 Prototyping costs\n1.7 Storage/carrying costs\n1.8 Contingency costs\n1.9 Mark-up\n1.10 Freight/shipping charges\n1.11 Taxes\n2. Total production cost\nMay include\n2.1 Supplies and materials\n Raw materials\n 2.1.1 Ferrous materials\n 2.1.2 Non – ferrous materials\n 2.1.3 Non-metallic materials\n 2.1.4 Tooling requirements\n\n High speed tools\n Carbide inserts\n Ceramics\n Diamond cutters\n2.2 Labor cost\n2.3 Equipment rentals and depreciation\n3. Worksite policies and\nprocedures\nMay include\n3.1 Mark-up procedures\n3.2 Machine-shop production schedules\n3.3 Cost-quotation approval procedures\n3.4 Cost-accounting policies\n3.5 Cost-center policies\n3.6 Quality and documentation procedures\n3.7 Tooling/Re-tooling procedures\n3.8 Optimization of production/operations\n\n--- PDF PAGE 46 ---\nTR – CNC Milling Machine Operation NC III\n44\nEVIDENCE GUIDE\n1. Critical aspects of evidence\nAssessment requires evidence that the candidate\n1.1 Determined job requirements\n1.2 Determined material requirements\n1.3 Estimated and documented costs\n2. Underpinning knowledge and\nattitude\n2.1 Blueprint reading\n 2.2.1 Standard drawing scales, symbols and\nabbreviations\n 2.2.2 Assembly and details of drawing\n 2.2.3 Dimensions\n\n2. 2 Materials and related science\n 2.2.1 Classification and mechanical properties of\nengineering materials\n\n2.3 Quality procedures\n2.4 Quality control and assurance principles\n2.5 Cost-estimation procedures\n2.6 Production optimization\n2.7 Work values: cost-consciousness, quality-\nconsciousness, client/service focus\n3. Underpinning skills\n3.1 Determining optimum sequence of operations\n3.2 Selecting materials\n3.3 Operating power hacksaw\n3.4 Writing CNC programs\n3.5 Operating CNC machines\n3.6 Operating grinding machine (optional)\n4. Resource implications\nThe following resources should be provided\n4.1 Tools, equipment and facilities appropriate to the\njob/activity\n4.2 Materials relevant to the proposal activity\n4.3 Drawings/plans or sample parts\n5. Method Assessment\n\nThe following assessment activity are suggested\n5.1 Direct observation with oral questioning\n5.2 Written questioning\n5.3 Demonstration with oral questioning\n6. Context for assessment\nCompetency may be assessed in the workplace or in\nsimulated work environment.\n\n--- PDF PAGE 47 ---\nTR – CNC Milling Machine Operation NC III\n45\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nWrite Advanced CNC Milling Machine Program\n\nUNIT CODE\n\n:"
