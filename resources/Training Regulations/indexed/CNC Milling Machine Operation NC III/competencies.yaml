  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\n This section gives the details of the contents of the core units of competency\nrequired in CNC MILLING MACHINE OPERATION NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas\nare communicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality\nand safety\n2.4. Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\nTR – CNC Milling Machine Operation NC III\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information\nat one time\n1.2.\nMade constructive contributions in workplace\nissues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively\nwritten form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge\n2.1.\nOrganization\nrequirements\nfor\nwritten\nand\nelectronic communication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning Skills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the\nuse of written and electronic communication\nmethods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1.\nDirect Observation\n5.2.\nInterview\n6. Context for\nAssessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 6 ---\nTR – CNC Milling Machine Operation NC III\n4\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining team\nand individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1.\nWork requirements are identified and presented\nto team members\n1.2.\nReasons for instructions and requirements are\ncommunicated to team members\n1.3.\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1.\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude\nrequired to properly undertake the assigned task\nand according to company policy\n2.2.\nDuties are allocated having regard to individual\npreference, domestic and personal\nconsiderations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1.\nPerformance expectations are established based\non client needs and according to assignment\nrequirements\n3.2.\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3.\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1.\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2.\nTeam members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3.\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer\npolicy\n4.4.\nTeam members are kept informed of any changes\nin the priority allocated to assignments or tasks\nwhich might impact on client/customer needs and\nsatisfaction\n4.5.\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6.\nFollow-up communication is provided on all issues\naffecting the team\n4.7.\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 7 ---\nTR – CNC Milling Machine Operation NC III\n5\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 8 ---\nTR – CNC Milling Machine Operation NC III\n6\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Underpinning\nKnowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6.\nTeam member’s duties and responsibilities\n3. Underpinning\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4.\nNegotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 9 ---\nTR – CNC Milling Machine Operation NC III\n7\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto collect information in order to negotiate to a desired\noutcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating non verbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques\nis identified and included in the plan\nInformation is checked to ensure it is correct and\nup-to- date\n2. Participate in\n negotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 10 ---\nTR – CNC Milling Machine Operation NC III\n8\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content\nand process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally\nfor resolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 11 ---\nTR – CNC Milling Machine Operation NC III\n9\nEVIDENCE GUIDE\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nSkills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\n process\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\nCompetency to be assessed in real work environment or in a\nsimulated workplace setting.\n\n--- PDF PAGE 12 ---\nTR – CNC Milling Machine Operation NC III\n10\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem\nare defined through observation, investigation\nand analytical techniques\n1.3.\nProblems are clearly stated and specified\n2. Determine fundamental\ncauses of the problem\n2.1.\nPossible causes are identified based on\nexperience and the use of problem solving\ntools / analytical techniques.\n2.2.\nPossible cause statements are developed\nbased on findings\n2.3.\nFundamental causes are identified per results\nof investigation conducted\n3. Determine corrective\naction\n3.1.\nAll possible options are considered for\nresolution of the problem\n3.2.\nStrengths and weaknesses of possible options\nare considered\n3.3.\nCorrective actions are determined to resolve\nthe problem and possible future causes\n3.4.\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to\nappropriate personnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 13 ---\nTR – CNC Milling Machine Operation NC III\n11\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 14 ---\nTR – CNC Milling Machine Operation NC III\n12\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1. Relevant equipment and operational\n processes\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\n requirement\n2.2.4. Principles of decision making strategies and\n techniques\n2.2.5. Enterprise information systems and data\n collation\n2.2.6. Industry codes and standards\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 15 ---\nTR – CNC Milling Machine Operation NC III\n13\n\n4. Resource\nImplications\nAssessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs will\nbe required as well as bank of questions which will be used\nto probe the reason behind the observable action.\n\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n\n6. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 16 ---\nTR – CNC Milling Machine Operation NC III\n14\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts and\ntechniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\n condition\n1.2 Mathematical techniques are selected based\n on the given problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\n the problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 17 ---\nTR – CNC Milling Machine Operation NC III\n15\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques\n(e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\nidentified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nKnowledge\n2.1 Fundamental operation (addition, subtraction,\ndivision, multiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning Skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context for\nAssessment\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 18 ---\nTR – CNC Milling Machine Operation NC III\n16\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in\naccordance with the industry standard operating\nprocedure, manufacturer’s operating\nguidelines and occupational health and safety\nprocedure to ensure its operative ability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3 Technology failure/ defect is immediately reported\nto the concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 19 ---\nTR – CNC Milling Machine Operation NC III\n17\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 20 ---\nTR – CNC Milling Machine Operation NC III\n18\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nSkills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context for\nAssessment\nCompetency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 21 ---\nTR – CNC Milling Machine Operation NC III\n19\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY SAFETY PRACTICES\n\nUNIT CODE: MEE722201\n\nUNIT DESCRIPTOR: This unit covers the competencies required to apply safety\npractices in the workplace.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify hazards\n1.1\n\n1.2\nHazards are identified correctly in accordance\nwith OHS principles.\nSafety signs and symbols are identified and\nadhered to.\n2.\nUse protective clothing\nand devices\n2.1\n\nAppropriate protective clothing and devices\ncorrectly selected and used in accordance with\nOHS requirements or industry/company policy\n3.\nPerform safe handling of\ntools, equipment and\nmaterials\n3.1\n\n3.2\nSafety procedures for pre-use check and\noperation of tools and equipment followed in\naccordance with industry/ company policies.\nTools, equipment and materials handled safely in\naccordance with OHS requirements and industry/\ncompany policies.\n4.\nPerform first aid\n4.1\nFirst aid treatment of injuries are carried out\naccording to recommended procedures\n5.\nUse fire extinguisher\n5.1\nFire extinguisher selected and operated correctly\naccording to the type of fire.\n\n--- PDF PAGE 22 ---\nTR – CNC Milling Machine Operation NC III\n20\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hazards\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving parts\n1.6 Uncollected chips or other wastes\netc.\n2. Protective clothing\nand devices\n Protective clothing and devices may include but is not\nlimited to:\n2.1 safety glasses/goggles\n2.2 safety shoes\n2.3 overalls\n2.4 cap\n3. Injuries\nInjuries may include:\n3.1 burns/scalds\n3.2 fractures\n3.3 cuts and abrasions\n3.4 poisoning\n3.5 foreign bodies in the eye\n3.6 concussion\n3.7 shock\n4. Type of fires\nFires involving or caused by:\n4.1 common combustibles (wood, cloth, paper, rubber and\nplastic)\n4.2 flammable liquids (gasoline, oil, solvents, paints, etc.)\n4.3 energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4.4 combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 23 ---\nTR – CNC Milling Machine Operation NC III\n21\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 identified hazardous area\n1.2 used protective clothing and devices\n1.3 handled tools, equipment and materials properly\n1.4 performed first aid\n1.5 used fire extinguisher\n2. Underpinning\nknowledge and\nattitude\n2.1 Shop safety signs, symbols and alarms\n2.2 Safety precautionary measures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.6 Engineering materials\n2.7 Fire extinguishers\n3. Underpinning\nskills\n3.1 Operating machine tools\n3.2 Handling tools and materials\n3.3 Communicating with superiors and co-workers\n3.4 Interpreting instructions\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1 Tools, equipment and facilities appropriate to processes\nor activity\n4.2 Materials relevant to the proposed activity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6. Context for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 24 ---\nTR – CNC Milling Machine Operation NC III\n22\nUNIT OF COMPETENCY:\nINTERPRET WORKING DRAWINGS AND SKETCHES\n\nUNIT CODE:\nMEE722202\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to read and\ninterpret drawings and sketches.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nInterpret technical\ndrawing\n1.1\n\n1.2\n1.3\n1.4\n1.5\n\n1.6\nComponents, assemblies or objects recognized as\nrequired.\nDimensions identified as appropriate.\nInstructions identified and followed as required.\nMaterial requirements identified as required.\nSymbols recognized as appropriate in the\ndrawing.\nTolerance, limits and fits identified in the drawing.\n2.\nPrepare freehand sketch\nof parts\n2.1\n2.2\n2.3\n\n2.4\n\n2.5\nSketch drawn correctly and appropriately.\nSketch depicted objects or part appropriately.\nDimensions indicated in sketch are clear and\ncorrect.\nInstructions included in sketch are clear and\ncorrect.\nBase line or datum points indicated as required.\n3.\nInterpret details from\nfreehand sketch\n3.1\n\n3.2\n3.3\n3.4\n3.5\nComponents, assemblies or objects recognized as\nrequired.\nDimensions identified as appropriate.\nInstructions identified and followed as required.\nMaterial requirements identified as required.\nSymbols recognized as appropriate in the drawing.\n\n--- PDF PAGE 25 ---\nTR – CNC Milling Machine Operation NC III\n23\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawing\n1.1 Drawing technique include\n1.1.1\nPerspective\n1.1.2\nExploded view\n1.1.3\nHidden view technique\n1.2 Projections\n1.2.1\nFirst angle projections\n1.2.2\nThird angle projections\n2. Tolerance\n2.1 General tolerance\n2.2 Angular tolerance\n2.3 Geometric tolerance\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Prepared sketches\n1.3 Interpreted sketches.\n2.\nUnderpinning\nknowledge\n2.1 Alphabet of lines\n2.2 Projections\n2.3 Drawing symbols\n2.4 Dimensioning techniques\n2.5 Tolerance, limits and fits\n2.6 Engineering materials\n2.7 Drawing tools and supplies\n3.\nUnderpinning skills\n3.1 Handling tools and drawing instruments\n3.2 Using measuring instruments\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Drafting room/facilities and drafting instruments and\n supplies appropriate to the activity\n4.2 Measuring tools\n4.3 Drawings, sketches or blueprint\n4.4 Specimen parts/components\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 written or oral short answer questions\n5.3 demonstration\n5.4 project/work sample\n5.5 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 26 ---\nTR – CNC Milling Machine Operation NC III\n24\nUNIT OF COMPETENCY:\nSELECT/ CUT WORKSHOP MATERIALS\n\nUNIT CODE:\nMEE722203\n\nUNIT DESCRIPTOR:\nThis unit covers the skills and knowledge required to select\nand cut workshop materials\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine requirement\n1.1 Plans/ drawings are interpreted to produce\ncomponent to specification\n1.2 Sequence of operation is determined to produce\ncomponent to specification\n2. Select and measure\nmaterials\n2.1 Materials are selected according to the\nrequirement of the operation\n2.2 Materials are measured to required level of accuracy\nusing measuring tools\n2.3 Measuring tools are used according to manufacturers\nspecification\n3. Cut materials\n3.1 Materials are cut according to plans/drawing\ninstruction\n3.2 Cutting tools/equipment are used based on\nmanufacturers specification, appropriate techniques\nor the safety procedure\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Plan/drawings\n1.1 Dimensions\n1.2 Tolerance\n2. Materials\n2.1 Ferrous\n2.2 Non-ferrous\n3. Measuring tools\n3.1 Steel rule\n3.2 Pull-push rule\n4. Cutting tools/equipment\n4.1 Hacksaw\n4.2 Power hacksaw\n5. Safety procedure\nSafety involves the handling of:\n5.1 Equipment\n5.2 Tools\n5.3 Materials\n\n--- PDF PAGE 27 ---\nTR – CNC Milling Machine Operation NC III\n25\nEVIDENCE GUIDE\n1. Critical Aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Interpreted plans/drawings\n1.2 Selected natural according to the requirement\n1.3 Performed cutting operation\n1.4 Cutting tools/equipment used safely\n2. Underpinning knowledge\n and attitude\n\n2.1 Shop safety practices\n 2.1.1 Safe working habits\n2.1.2 Safe handling of tools, equipment and\n materials\n\n2.2 Blueprint reading\n 2.2.1 Standard drawing scales, symbols and\nabbreviations\n2.2.2 Assembly and details of drawing\n2.2.3 Dimensions\n\n2.3 Measurement\n 2.3.1 Linear measuring tools\n\n2.4 Materials and related science\n 2.4.1 Classification and mechanical properties of\nengineering materials\n3. Underpinning skills\n3.1 Selecting materials\n3.2 Using measuring tools\n3.3 Operating power hacksaw\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate\n processes of an activity\n4.2 Materials relevant to the proposal activity\n4.3 Drawings/plans\n5. Method Assessment\n\nCompetency may be assessed through:\n5.1 Direct observation\n5.2 Oral short answer question\n5.3 Practical exercises\n6. Context for assessment\nCompetency may be assessed in the workplace or in\nsimulated work environment\n\n--- PDF PAGE 28 ---\nTR – CNC Milling Machine Operation NC III\n26\nUNIT OF COMPETENCY:\nPERFORM SHOP COMPUTATIONS (BASIC)\n\nUNIT CODE:\nMEE722204\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to perform\nbasic calculations using the four fundamental operation.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform four\nfundamental operations.\n1.1\n\n1.2\n\nSimple calculations performed using four\nfundamental operations.\nSimple calculations performed involving fractions\nand mixed numbers using four fundamental\noperations\n2.\nPerform basic\ncalculations involving\nfractions and decimals\n2.1\n\n2.2\n\nSimple calculations are performed involving\nfractions and decimals using the four fundamental\noperations.\nDecimal are converted into fraction (and vice\nversa) accurately,\n3.\nPerform basic\ncalculations involving\npercentages.\n3.1\nSimple calculations are performed to obtain\npercentages from information expressed in either\nfractional or decimal format\n4.\nPerform basic\ncalculation involving\nration and proportion\n4.1\nSimple calculations are performed involving ratios\nand proportion using whole numbers, fractions and\ndecimal fractions.\n5.\nPerform calculations on\nalgebraic expressions\n5.1\n\n5.2\nSimple calculations are performed on algebraic\nexpressions using the four fundamental\noperations.\nSimple transposition of formulae is carried out to\nisolate the variable required, involving the four\nfundamental operations.\n\n--- PDF PAGE 29 ---\nTR – CNC Milling Machine Operation NC III\n27\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Four fundamental\noperations\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n2. Algebraic expressions\nCalculation using formula for determining:\n2.1 tap drill size\n2.2 feed\n2.3 speed\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\nCompetency\nAssessment requires evidence that the candidate\nperformed calculations:\n1.1 using four fundamental operations\n1.2 involving fractions and mixed numbers\n1.3 involving fractions and decimals\n1.4 involving percentages\n1.5 involving ratio and proportion\n1.6 on algebraic expressions\n1.7 of simple formulae\n2.\nUnderpinning\nknowledge and\nattitude\nEnglish and metric system of measurements\n3.\nUnderpinning skills\nPerforming calculations using pen and paper or on a\ncalculator\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to\nprocesses or activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 30 ---\nTR – CNC Milling Machine Operation NC III\n28\nUNIT OF COMPETENCY:\nMEASURE WORKPIECE (BASIC)\n\nUNIT CODE:\nMEE722205\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to measure\nworkpieces using measuring instruments such as steel\nrules, vernier calipers , micrometers, etc….\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\n\nSelect and use\nmeasuring tools\n\n1.1\n\n1.2\n\n1.3\n\nMeasuring tools are selected and used\naccording to the level of accuracy required.\nMeasurements taken are accurate to the finest\ngraduation of the selected measuring\ninstrument.\nMeasuring technique used is correct and\nappropriate to the device used.\n\n2.\n\nClean and store\nmeasuring tools\n\n2.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard\noperating procedures.\n\n--- PDF PAGE 31 ---\nTR – CNC Milling Machine Operation NC III\n29\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring tools\nMeasuring tools include\n1.1 Steel tape\n1.2 Steel rule\n1.3 Straight edge\n1.4 Combination square\n1.5 Steel square\n1.6 Divider or trammel\n1.7 Caliper\n1.8 Protractor\n1.9 Vernier caliper\n1.10 Micrometer\n2. Measurements\n2.1 length\n2.2 diameter\n2.3 depth\n2.4 flatness\n2.5 straightness\n2.6 squareness\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used measuring instruments\n1.2 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge\n2.1 Types, purposes and accuracy of measuring instruments\n2.2 Capability of measuring instruments\n2.3 Part dimensions and tolerances\n2.4 Techniques for measuring dimensions\n2.5 Care and storage procedure of measuring tools\n3.\nUnderpinning skills\n3.1 Safe handling of measuring tools and materials\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 32 ---\nTR – CNC Milling Machine Operation NC III\n30\nUNIT OF COMPETENCY:\nPERFORM ROUTINE HOUSEKEEPING\n\nUNIT CODE:\nMEE722206\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to maintain\nan organized and clean work area.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nOrganize work area\n1.1\n\n1.2\n\n1.3\nWork area maintained in a safe, uncluttered and\norganized manner according to workshop policy.\nAll tasks carried out safely, effectively and efficiently\nwith minimum inconvenience according to workshop\npolicy.\nWorkshop policies and procedures for tidying work\nareas and placing items in designated areas\napplied.\n2.\nClean work area\n2.1\n\n2.2\n\n2.3\n\n2.4\n\n2.5\n\n2.6\nShop policies and procedures applied for cleaning\nwork area.\nWastes promptly removed and disposed of\naccording to shop policies and environmental\nrequirements.\nSpills, wastes and other potential hazards reported\nto appropriate personnel and removed according to\nshop policies and environmental requirements.\nSignage promptly displayed in regard to unsafe\nareas.\nConsumable materials maintained and stored\ncorrectly after use.\nTools and equipment (including guards) cleaned\nand used in accordance with manufacturer’s\ninstructions.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Workshop policy\nShop policy and procedure in regard to:\n1.1 Housekeeping practices\n1.2 Maintenance and storage of cleaning equipment\n1.3\nUse and storage of cleaning chemicals\n2. Work area\nWork area may include:\n2.1 Work benches\n2.2 Walkways and aisles\n2.3 Fixtures and other working surfaces\n3. Tools and\n Equipment\nEquipment and tools may include:\n3.1 Drill Press\n3.2 Pedestal Grinder\n3.3 Surface plate\n3.4 Layout and marking tools\n3.5 Cutting tools (hacksaw, chisel, files)\n3.6 Inspection and measuring tools (templates, vernier\ncaliper, micrometer, straight edge, gages, etc…)\n\n--- PDF PAGE 33 ---\nTR – CNC Milling Machine Operation NC III\n31\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate organized and\ncleaned work area according shop policies and environmental\nrequirements.\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.2 Machine shop equipment\n2.3 Shop policies regulations\n2.4 5-S\n2.5 Shop cleaning equipment\n3.\nUnderpinning\nskills\n3.1 Using and storing of cleaning equipment\n3.2 Using and storing chemicals, hazardous substances and\nflammable liquids\n3.3 Literacy and numeracy skills in reading and understanding\nlabels and instructions for the handling and use of chemicals\nand hazardous substances\n3.4 Communication skills\n3.5 Organizing skills\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\nactivity\n4.2 Materials and documentation relevant to the proposed\nactivity\n4.3 Shop policy and/or procedures manual on housekeeping,\ncleaning and occupational health and safety\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration or role play\n5.3 written or oral short answer questions\n5.4 identify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 34 ---\nTR – CNC Milling Machine Operation NC III\n32\nUNIT OF COMPETENCY:\nPERFORM SHOP COMPUTATIONS (INTERMEDIATE)\n\nUNIT CODE:\nMEE722207\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to perform\ncalculation involving triangles and tapers.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform calculations\ninvolving triangles\n1.1\n\n1.2\n\nProblems involving right triangles are performed\nusing the trigonometric functions.\nProblems involving non-right triangles are\nperformed using sine and cosine rules.\n2.\nCalculate taper\n2.1\n\nTaper of work calculated correctly using\nappropriate formula.\n\n--- PDF PAGE 35 ---\nTR – CNC Milling Machine Operation NC III\n33\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. trigonometric functions\n1.1 Sine\n1.2 Cosine\n1.3 Tangent\n1.4 Cotangent\n1.5 Secant\n1.6 Cosecant\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate\nperformed calculations:\n1.1 Involving right triangles\n1.2 Involving non-right triangles\n1.3 involving tapers\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 English and metric system of measurements\n2.2 Geometrical shapes\n3.\nUnderpinning skills\n3.1 Performing calculations using pen and paper or on a\ncalculator\n\n4.\nResource implications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to\n processes or activity\n4.2 Materials relevant to the proposed activity\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 36 ---\nTR – CNC Milling Machine Operation NC III\n34\nUNIT OF COMPETENCY:\nMEASURE WORKPIECE USING ANGULAR\nMEASURING INSTRUMENTS\n\nUNIT CODE:\nMEE722208\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to measure\nworkpieces using angular measuring instruments.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use angular\nmeasuring tools\n1.1\n\n1.2\n\n1.3\