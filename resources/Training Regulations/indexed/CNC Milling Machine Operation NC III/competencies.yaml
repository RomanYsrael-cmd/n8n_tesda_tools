        "source_text": "MEE821312\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to operate\n CNC milling machine with 3 or more axes. It\n details the requirements for performing\n complex CNC milling operations such as\n drilling, boring, reaming, milling blocks,\n shoulder, parallel and angled faces, milling\n slots, keys, serrations, and milling castings and\n circular slots and externa/internal radius.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nMill workpiece\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\n\nWorkpiece is mounted or set in accordance with\nstandard operating procedures.\nComplex CNC milling operations are performed\nto produce component as programmed.\nCorrective measures/adjustments are performed\nif necessary.\nSafety procedures are observed during machining\noperation.using personal protective devices.\nPersonal protective devices are used in\naccordance with occupational health and safety\n(OHS) requirements.\n2.\nCheck, and measure\nworkpiece\n2.1\n\n2.2\n\nWorkpiece is checked and measured in\nconformance to specification using appropriate\nmethods, measuring tools and equipment.\nDefective workpieces are marked, recorded and\nreported for proper action.\n\n--- PDF PAGE 54 ---\nTR – CNC Milling Machine Operation NC III\n52\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Complex CNC Milling\nOperations\nComplex CNC milling operations\n1.1 drilling\n1.2 boring\n1.3 milling slot and keyways\n1.4 milling serrations\n1.5 milling vees\n1.6 milling circular and rectangular pockets\n1.7 milling circular slots\n1.8 milling contour\n1.9 Tapping\n1.10 Reaming\n1.11 Engraving\n1.12 Chamfering\n1.13 4th axis operation\n2. Corrective measures/\n adjustments\n2.1 Replacement of cutting tools\n2.2 Adjustment of tool offset\n2.3 Adjustment of cutting speed and feed rate\n3. Measuring Tools\n3.1 Vernier caliper (Digital/ read out)\n3.2 Micrometer (Digital/ read out)\n3.3 Gages (thread, drill, surface comparator / roughness\n tester, radius, screw pitch, taper)\n\n--- PDF PAGE 55 ---\nTR – CNC Milling Machine Operation NC III\n53\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 milled workpiece\n1.2 checked and measured workpiece\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Drawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic and isometric drawings\n2.2.3 1st and 3rd angle projections\n2.2.4 Assembly and detail drawings\n2.2.5 Interpreting tolerances, limits and fits\n2.2.6 Surface finish\n\n2.3 Shop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Trigonometric functions\n2.3.6 Pythagorean theorem\n\n2.4 Measurements\n2.4.1 Linear measuring tools (vernier, micrometer)\n2.4.2 Precision angular measuring tools\n (Vernier bevel protractor)\n2.4.3 Geometrical tolerances measuring tools\n(dial test indicator, radius gauge, vernier height\ngauge, 2 pt. bore gauge, 3 pt. bore gauge)\n2.4.4 Dial indicator\n\n2.5 Materials and related science\n2.5.1 Classification and mechanical properties of\nengineering materials\n\n2.6 CNC Milling operations:\n2.6.1 Milling types and specifications\n2.6.2 Milling machine parts and functions\n2.6.3 Milling cutters and holders\n2.6.4 Setting rpm, feed rate\n2.6.5 Workholding devices\n 2.6.6 Milling machine accessories, fixtures and\nattachments\n 2.6.7 4th axis operation\n\n--- PDF PAGE 56 ---\nTR – CNC Milling Machine Operation NC III\n54\n\n3.\nUnderpinning\nskills\n3.1 Selection of cutting tools\n3.2 Use of measuring instruments\n3.3 Determining workpiece specifications\n3.4 Computation of feed machine rpm\n3.5 Application of G – codes and M – codes\n3.6 Application of 4th axis operation\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\n activities\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation with questioning\n5.2 Written exam\n5.3 Demonstration\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 57 ---\nTR – CNC Milling Machine Operation NC III\n55"
      }
