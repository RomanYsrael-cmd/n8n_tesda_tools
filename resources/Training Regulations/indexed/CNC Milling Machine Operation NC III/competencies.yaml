NCY:\nPERFORM SHOP COMPUTATIONS (ADVANCED)\n\nUNIT CODE:\nMEE722209\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to perform\ncalculation involving gear ratio, indexing problems and\ngearing problems.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nCalculate gear ratio\n1.1\nGear ratio calculated using appropriate formula\n2.\nSolve indexing problems\n2.1\n\nIndexing problems involving number of turns,\nspaces and circle plate are solved using\nappropriate formula\n3.\nSolve gearing problems\n3.1\nGearing problems are solved using appropriate\nformula\n4.\nUse geometrical\nprinciples in the solution\nof problems\n4.1\nSolution to problems is obtained by applying\ngeometrical properties of angles, triangles and\ncircles in the calculation.\n\n--- PDF PAGE 39 ---\nTR – CNC Milling Machine Operation NC III\n37\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. gear ratio\n1.1 addendum\n1.2 clearance\n1.3 dedendum\n1.4 diametral pitch\n1.5 module\n1.6 outside diameter\n1.7 pitch diameter\n1.8 root diameter\n1.9 number of teeth\n etc.\n2. indexing\n2.1 direct indexing\n2.2 simple indexing\n2.3 compound indexing\n2.4 differential indexing\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate\nperformed calculations:\n1.1 involving gear ratio\n1.2 involving indexing problems\n1.3 involving gearing problems\n1.4 involving geometrical properties of angles, triangles\nand circles\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 English and metric system of measurements\n2.2 Geometrical shapes\n2.3 Gear types\n3.\nUnderpinning skills\n3.1 Performing calculations using pen and paper or on a\ncalculator\n3.2 Reading and interpreting working drawings\n4.\nResource implications\nThe following resources MUST be provided:\n4.1\nTools, equipment and facilities appropriate to\nprocesses or activity\n4.2\nMaterials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 40 ---\nTR – CNC Milling Machine Operation NC III\n38\nUNIT OF COMPETENCY:\nMEASURE WORKPIECE USING GAGES AND\nSURFACE TEXTURE COMPARATOR\n\nUNIT CODE:\nMEE722210\n\nUNIT DESCRIPTOR:\nThis unit covers the competencies required to measure\nworkpieces using fixed and adjustable gages.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use fixed and\nadjustable gages\n1.1\n\n1.2\n\n1.3\nAppropriate gages are selected and used to\nundertake the required comparison or\nmeasurement using standard operating\nprocedures.\nConsistent and accurate measurements obtained\nconforms to drawing specification\nMeasuring technique used is correct and\nappropriate to the device used.\n2.\nPerform surface texture\nmeasurements\n2.1\n\n2.2\nSurface textures are measured according worksite\nprocedures.\nMeasurements taken are within the level of\naccuracy required.\n3.\nClean and store\nmeasuring tools\n3.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard\noperating procedures.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Gages\nFixed and adjustable gages include:\n1.1 Gage blocks\n1.2 Telescoping gages\n1.3 Center gages\n1.4 Thread gages\n1.5 Dial bore gages\n1.6 Height gages\n1.7 Radius gages\n1.8 Go-no-go gages\n1.9\nDepth gages\n2. Measurements\nMeasurements undertaken may include:\n2.1 Linear dimensions\n2.2 Diameters\n2.3 Depths\n2.4 Fits\n2.5 Tapers\n2.6 Threads\n2.7 Radius\n2.8 Squareness\n2.9 Surface texture\netc\n\n--- PDF PAGE 41 ---\nTR – CNC Milling Machine Operation NC III\n39\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used fixed and adjustable gages\n1.2 Performed surface texture measurements\n1.3 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge\n2.1 Types and application of fixed and adjustable gages\n2.2 Gage limits and accuracy\n2.3 Techniques for measuring components\n2.4 Care and storage procedure of measuring tools\n3.\nUnderpinning\nskills\n3.1 Safe handling of measuring tools and materials\n3.2 Verifying measurements with drawing specifications\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n4.3 Drawing\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 42 ---\nTR – CNC Milling Machine Operation NC III\n40\nUNIT OF COMPETENCY\nPERFORM PREVENTIVE AND CORRECTIVE\nMAINTENANCE\n\nUNIT CODE:\nMEE722211\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nperforming preventive and corrective maintenance such\nas inspection and repair of hand tools, cleaning and\nlubrication of machine parts and changing drive pulley\nand belts.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform inspection of\nmachine\n\n1.1\n\n1.2\nMachine inspected according to worksite\nprocedures.\nStatus/Report recorded on proforma or reported\norally according to worksite procedure.\n2.\nPerform cleaning and\nlubricating of machine\n\n2.1\n\n2.2\nMachines lubricated as per manufacturer’s\nrecommendation using appropriate tools and\nmaterials\nFluids and lubricants replaced and/or topped up\naccording to prescribed schedule.\n3.\nPerform minor machine\nrepair and adjustments\n\n3.1\n\n3.2\nMinor machine repairs performed according to\nmanufacturer’s instruction or worksite procedures.\nMachine moving parts adjusted to manufacturer’s\nspecifications.\n4.\nMaintain hand tools\n4.1\n4.2\nTool cutting ground to recommended specifications\nHand tools lubricated and stored according to\nprescribed procedure\n\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1 V-belt\n1.2 Bearing\n1.3 Gears\n1.4 Clutch\n1.5 Drive pulley\n2. Machines\nMachine include but not limited to:\n2.1 Lathe machine\n2.2 Milling machine\n2.3 Grinding machine\n2. Tools and materials\nTools and materials used include:\n3.1 Lubricants\n3.2 Oil can\n3.3 Grease gun\n3.4 Oil\n3.5 Coolant or compound\n\n--- PDF PAGE 43 ---\nTR – CNC Milling Machine Operation NC III\n41\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that that the candidate:\n1.1 Performed inspection of machine\n1.2 Performed cleaning and lubricating of machine\n1.3 Performed minor machine repairs and\nadjustments\n2. Underpinning knowledge\n2.1 Proper cleaning and oiling\n2.2 Kinds of oil\n2.3 Parts and function of machine tools\n2.4 Cutting oil, coolant or compound\n2.5 Pulleys and belts\n2.6 Location of main switches of the machine\n2.7 Handling and storage of tools\n2.8 Checklist of safe working conditions\n2.9 Procedures in cleaning and disposal of waste\nmaterials\n3. Underpinning skills\n3.1 Inspecting and repairing hand tools\n3.2 Inspecting and changing drive pulleys and belts\n3.3 Replacing and adjusting machine parts\n3.4 Distinguishing old and new coolant\n3.5 Distinguishing odor of polluted coolant\n3.6 Selecting coolant, cutting oil or compounds\n3.7 Changing coolant\n3.8 Inspecting work area for safe working\nenvironment\n3.9 Cleaning work area\n3.10 Disposing metal scraps, chips and waste\n materials.\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to\n processes or activity\n4.2 Materials relevant to the proposed activity\n5. Method of Assessment\nCompetency may be assessed through:\n5.1 direct observation of activities\n5.2 oral or written questioning\n6. Context for Assessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 44 ---\nTR – CNC Milling Machine Operation NC III\n42\nUNIT OF COMPETENCY: PREPARE COST ESTIMATES\n\nUNIT CODE\n :\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to calculate costs\nfor a particular job order/request in a machine-shop or\nmetal-working environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine customer\nrequirements\n1.1. Plans/ drawings are interpreted to produce component\nto specifications.\n1.2. Cost-effective sequence of operations to produce\ncomponent to specifications is determined in\naccordance with worksite policies.\n1.3. Where available, sample part or product is inspected\nfor parameters relevant to cost determination.\n1.4. Materials are determined according to the job\nrequirements.\n1.5. Additional details of job are obtained through\ndiscussion with customer or from information supplied.\n1.6. Where applicable, client is advised on the feasibility\nand cost-effectiveness of the production job based on\nthe constraints/capabilities of the machine and current\nmarket prices.\n2. Estimate cost\ncomponents\n2.1 Cost components are calculated based on job\nrequirements and worksite procedures.\n2.2 Where necessary data on current costs are verified with\nthe current market price.\n2.3 Appropriate personnel are consulted with regard to\nadditional data for costing.\n3. Cost the job\n3.1. Costing is set at optimal and affordable levels based on\ncustomer requirements and worksite procedures.\n3.2. Where necessary, initial/rough cost estimate is\nprovided to client following worksite procedures.\n3.3. Total production costs are determined and finalized\nin accordance with worksite procedures.\n\n4. Verify and document\ncosts\n4.1. Cost quotations are finalized and cleared with\npersonnel concerned.\n4.2. Costing details are documented and filed for future re-\nuse or reference based on worksite procedures.\n\n--- PDF PAGE 45 ---\nTR – CNC Milling Machine Operation NC III\n43\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Cost components\nMay include :\n1.1 Labor cost\n1.2 Hourly machine cost\n1.3 Overhead / energy cost\n1.4 Capital\n1.5 Depreciation costs\n1.6 Prototyping costs\n1.7 Storage/carrying costs\n1.8 Contingency costs\n1.9 Mark-up\n1.10 Freight/shipping charges\n1.11 Taxes\n2. Total production cost\nMay include\n2.1 Supplies and materials\n Raw materials\n 2.1.1 Ferrous materials\n 2.1.2 Non – ferrous materials\n 2.1.3 Non-metallic materials\n 2.1.4 Tooling requirements\n\n High speed tools\n Carbide inserts\n Ceramics\n Diamond cutters\n2.2 Labor cost\n2.3 Equipment rentals and depreciation\n3. Worksite policies and\nprocedures\nMay include\n3.1 Mark-up procedures\n3.2 Machine-shop production schedules\n3.3 Cost-quotation approval procedures\n3.4 Cost-accounting policies\n3.5 Cost-center policies\n3.6 Quality and documentation procedures\n3.7 Tooling/Re-tooling procedures\n3.8 Optimization of production/operations\n\n--- PDF PAGE 46 ---\nTR – CNC Milling Machine Operation NC III\n44\nEVIDENCE GUIDE\n1. Critical aspects of evidence\nAssessment requires evidence that the candidate\n1.1 Determined job requirements\n1.2 Determined material requirements\n1.3 Estimated and documented costs\n2. Underpinning knowledge and\nattitude\n2.1 Blueprint reading\n 2.2.1 Standard drawing scales, symbols and\nabbreviations\n 2.2.2 Assembly and details of drawing\n 2.2.3 Dimensions\n\n2. 2 Materials and related science\n 2.2.1 Classification and mechanical properties of\nengineering materials\n\n2.3 Quality procedures\n2.4 Quality control and assurance principles\n2.5 Cost-estimation procedures\n2.6 Production optimization\n2.7 Work values: cost-consciousness, quality-\nconsciousness, client/service focus\n3. Underpinning skills\n3.1 Determining optimum sequence of operations\n3.2 Selecting materials\n3.3 Operating power hacksaw\n3.4 Writing CNC programs\n3.5 Operating CNC machines\n3.6 Operating grinding machine (optional)\n4. Resource implications\nThe following resources should be provided\n4.1 Tools, equipment and facilities appropriate to the\njob/activity\n4.2 Materials relevant to the proposal activity\n4.3 Drawings/plans or sample parts\n5. Method Assessment\n\nThe following assessment activity are suggested\n5.1 Direct observation with oral questioning\n5.2 Written questioning\n5.3 Demonstration with oral questioning\n6. Context for assessment\nCompetency may be assessed in the workplace or in\nsimulated work environment.\n\n--- PDF PAGE 47 ---\nTR – CNC Milling Machine Operation NC III\n45\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nWrite Advanced CNC Milling Machine Program\n\nUNIT CODE\n\n: MEE821310\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to write complex\n programs for CNC milling machine with 3 or more\n axes.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\n\nDrawings are interpreted to produce component to\nspecifications.\nSequence of operation is determined to produce\ncomponent according to specification.\nCutting tools are selected according to the\nrequirements of the operation.\nCutting speed and feed rate calculated based on\nworkpiece and cutting tool material.\nProcess / job / adjustment sheets are filled up with\nrelevant machine, tool and raw material data.\n2\nWrite advanced CNC\nmilling machine program\n2.1\n\n2.2\n\nCoordinates calculated for complex tool path or\nadvanced machining functions based on part or\nproduct to be produced.\nProgram written in standard CNC milling\noperations, code format in accordance with\nstandard operating procedures.\n3\nEdit advanced CNC\nmilling machine\nprograms\n3.1\n\n3.2\n\n3.3\nProgram is simulated and edited according to\nstandard operating procedures.\nProgram is saved to the machine according to\nstandard operating procedures.\nProgram is downloaded to the machine according\nto standard operating procedures.(Optional)\n\n--- PDF PAGE 48 ---\nTR – CNC Milling Machine Operation NC III\n46\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawings\nReading and interpretation:\n1.1 Dimensions and symbols\n1.2 Tolerances\n2. Cutting Tools\nCutting tools used in milling operations include:\n2.1 Drills\n2.2 Reamers\n2.3 Slitter\n2.4 End mills\n2.5 Shell mills\n2.6 Side and face cutters\n2.7 Formed cutter\n2.8 T-slot cutter\n2.9 Ball end mill\n2.10 Engraving\n2.11 Dovetail\n2.12 Tap\n2.13 NC start drill\n2.14 Center drill\n3. Workpiece\nWorkpiece materials used in milling operations:\n3.1 Ferrous metals\n3.2 Non-ferrous metals\n3.3 Non – metallic materials\n4. Milling Operations\nComplex CNC milling operations:\n4.1 drilling\n4.2 boring\n4.3 milling slot and keyways\n4.4 milling serrations\n4.5 milling vees\n4.6 milling circular and rectangular pockets\n4.7 milling circular slots\n4.8 milling contour\n4.9 Tapping\n4.10 Reaming\n4.11 Engraving\n4.12 Chamfering\n4.13 4th - axis operation\n\n--- PDF PAGE 49 ---\nTR – CNC Milling Machine Operation NC III\n47\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 determined job requirements\n1.2 wrote advanced CNC milling machine program\n1.3 edited advanced CNC milling machine programs\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Drawing interpretation\n2.1.1 Standard drawing scales, symbols and abbreviations\n2.1.2 Orthographic and isometric drawings\n2.1.3 Assembly and detailed drawings\n2.1.4 Interpreting tolerances\n2.1.5 Geometrical Tolerances (form and position)\n2.1.6 Surface condition (surface finish/texture)\n2.1.7 limits and fits\n\n2.2 Shop mathematics\n2.2.1 Four fundamental operation\n2.2.2 Fractions and decimals\n2.2.3 Percentages and ratios\n2.2.4 Conversion of units (English to metric)\n2.2.5 Pythagorean theorem\n2.2.6 Basic trigonometric function\n\n2.3 Materials and related science\n2.3.1 Classification and mechanical properties of\nengineering materials\n\n2.4 Milling machine operations\n2.4.1 Calculation of cutting speed, rpm, feed rate\n2.4.2 Classification/selection of cutting tools and tool\ngeometry\n2.4.3 Milling operation processes\n\n2.5 4th axis operation\n3.\nUnderpinning\nskills\n3.1 Selection of cutting tools\n3.2 Computation of feed, cutting speed and machine rpm\n3.3 Application of G – codes and M – codes\n3.4 Application of 4th –axis\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Drawings, sketches or blueprint/materials\n4.2 Computers and simulation software’s\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 direct observation with questioning\n5.2 written exam\n5.3 demonstration (actual programming)\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 50 ---\nTR – CNC Milling Machine Operation NC III\n48\nUNIT OF COMPETENCY :\nSet-up multiple-axis CNC milling machine,\nworkpiece and cutting tools\n\nUNIT CODE\n\n:\nMEE821311\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to\n set-up CNC milling machine with 3 or more axes and\n cutting tools, download program, set-up workpiece,\n dry-run program and perform trial cut on workpiece.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nSet up machine and\ncutting tools\n1.1\n\n1.2\n\n1.3\n1.4\n\n1.5\n\n1.6\nOil and coolant is checked according to\nmanufacturer’s specification.\nAir and hydraulic pressure is checked according to\nmanufacturer’s specification.\nMachine zero point is set to the required position\nCutting Tools are set according to required\nsequence of operations.\nClamping devices are tightened according to\nstandard operating procedures.\nTool set-up is performed according to standard\noperating procedures.\n2\nDownload/ inputed\nprogram\n2.1\n\n2.2\n\n2.3\nProgram is downloaded/ inputed to the machine\nusing appropriate devices.\nProgram is simulated to determine the correctness\nof the tool path and other work parameters.\nWorkpiece zero point is set to the required\nposition.\n3.\nSet-up workpiece\n3.1\n\n3.2\n\nWorkpiece is mounted on clamping device to\nrequired level of accuracy using tools and\ninstruments / equipment in accordance with\nworksite procedures.\nSet-up is performed in accordance with safety\nprocedures and using personal protective devices.\n4\nDry-run program\n4.1\n\n4.2\nDry run is performed in accordance with the\ndesired tool path movement.\nWhere necessary, program is edited according to\nrequired tool path movement.\n5\nPerform trial cut on\nworkpiece\n5.1\n5.2\n\n5.3\nMachined workpiece as programmed.\nChecked and measured workpiece dimensions\nusing appropriate measuring instruments.\nWhere required, program is edited and tool\nparameters are corrected/adjusted.\n\n--- PDF PAGE 51 ---\nTR – CNC Milling Machine Operation NC III\n49\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Cutting Tools\nCutting tools used in CNC milling operations include:\n1.1 Drills\n1.2 Reamers\n1.3 Slitter\n1.4 End mills\n1.5 Shell mills\n1.6 Side and face cutters\n1.7 Formed cutter\n1.8 T-slot cutter\n1.9 Ball end mill\n1.10 Engraving\n1.11 Dovetail\n1.12 Tap\n1.13 NC start drill\n1.14 Center drill\n2. Tool set-up\n2.1 Scratch method\n2.2 Tool-setting device method\n3. Workpiece\nWorkpiece materials used in turning operations:\n3.1 Ferrous metals\n3.2 Non-ferrous metals\n3.3 Non – metallic materials\n4. Work holding and\nclamping device\n4.1 Workholding devices\n4.1.1clamps\n4.1.2 vises\n4.1.3 angle plates\n4.1.4 parallel bars\n4.1.5 vee-blocks\n5. Instruments\n5.1 Tool pre - setting device (optional)\n5.2 Dial indicator\n5.3 Dial test indicator\n5.4 Gauges (go-no go, pitch, plug, radius, etc.)\n5.5 Coordinate measuring machine (CMM) (optional)\n5.6 Bevel protractor\n5.7 Profile projector\n5.8 Surface-texture tester\n5.9 Surface-finish comparator\n5.10 Edge finder\n5.11 Steel rule\n5.12 Bore gage\n\n--- PDF PAGE 52 ---\nTR – CNC Milling Machine Operation NC III\n50\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 Performed machine and cutting tools set-up\n1.2 Downloaded/ inputed programs\n1.3 Performed workpiece set-up\n1.4 Performed program dry run\n1.5 Performed trial cut on workpiece\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Measurements\n2.2.1 Linear measuring tools (vernier, micrometer)\n2.2.2 Angular measuring tools (Vernier bevel protractor)\n2.2.3 Geometrical tolerances measuring tools\n(dial test indicator, radius gauge, vernier height\ngauge, 2 pt. bore gauge, 3 pt. bore gauge)\n2.2.4 Surface finish measuring instrument\n\n2.3 4th axis operation\n3.\nUnderpinning\nskills\n3.1 Identification of cutting tools\n3.2 Use of measuring instruments\n3.3 Determining workpiece specifications\n3.4 Scratch method for tool set-up\n3.5 Use of tool setter\n3.5 Application of 4th axis operation\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 direct observation\n5.2 demonstration\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 53 ---\nTR – CNC Milling Machine Operation NC III\n51\nUNIT OF COMPETENCY :\nPerform Advanced CNC Milling Machine\n Operations\n\nUNIT CODE\n\n:\nMEE821312\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to operate\n CNC milling machine with 3 or more axes. It\n details the requirements for performing\n complex CNC milling operations such as\n drilling, boring, reaming, milling blocks,\n shoulder, parallel and angled faces, milling\n slots, keys, serrations, and milling castings and\n circular slots and externa/internal radius.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nMill workpiece\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\n\nWorkpiece is mounted or set in accordance with\nstandard operating procedures.\nComplex CNC milling operations are performed\nto produce component as programmed.\nCorrective measures/adjustments are performed\nif necessary.\nSafety procedures are observed during machining\noperation.using personal protective devices.\nPersonal protective devices are used in\naccordance with occupational health and safety\n(OHS) requirements.\n2.\nCheck, and measure\nworkpiece\n2.1\n\n2.2\n\nWorkpiece is checked and measured in\nconformance to specification using appropriate\nmethods, measuring tools and equipment.\nDefective workpieces are marked, recorded and\nreported for proper action.\n\n--- PDF PAGE 54 ---\nTR – CNC Milling Machine Operation NC III\n52\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Complex CNC Milling\nOperations\nComplex CNC milling operations\n1.1 drilling\n1.2 boring\n1.3 milling slot and keyways\n1.4 milling serrations\n1.5 milling vees\n1.6 milling circular and rectangular pockets\n1.7 milling circular slots\n1.8 milling contour\n1.9 Tapping\n1.10 Reaming\n1.11 Engraving\n1.12 Chamfering\n1.13 4th axis operation\n2. Corrective measures/\n adjustments\n2.1 Replacement of cutting tools\n2.2 Adjustment of tool offset\n2.3 Adjustment of cutting speed and feed rate\n3. Measuring Tools\n3.1 Vernier caliper (Digital/ read out)\n3.2 Micrometer (Digital/ read out)\n3.3 Gages (thread, drill, surface comparator / roughness\n tester, radius, screw pitch, taper)\n\n--- PDF PAGE 55 ---\nTR – CNC Milling Machine Operation NC III\n53\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 milled workpiece\n1.2 checked and measured workpiece\n\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Drawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic and isometric drawings\n2.2.3 1st and 3rd angle projections\n2.2.4 Assembly and detail drawings\n2.2.5 Interpreting tolerances, limits and fits\n2.2.6 Surface finish\n\n2.3 Shop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Trigonometric functions\n2.3.6 Pythagorean theorem\n\n2.4 Measurements\n2.4.1 Linear measuring tools (vernier, micrometer)\n2.4.2 Precision angular measuring tools\n (Vernier bevel protractor)\n2.4.3 Geometrical tolerances measuring tools\n(dial test indicator, radius gauge, vernier height\ngauge, 2 pt. bore gauge, 3 pt. bore gauge)\n2.4.4 Dial indicator\n\n2.5 Materials and related science\n2.5.1 Classification and mechanical properties of\nengineering materials\n\n2.6 CNC Milling operations:\n2.6.1 Milling types and specifications\n2.6.2 Milling machine parts and functions\n2.6.3 Milling cutters and holders\n2.6.4 Setting rpm, feed rate\n2.6.5 Workholding devices\n 2.6.6 Milling machine accessories, fixtures and\nattachments\n 2.6.7 4th axis operation\n\n--- PDF PAGE 56 ---\nTR – CNC Milling Machine Operation NC III\n54\n\n3.\nUnderpinning\nskills\n3.1 Selection of cutting tools\n3.2 Use of measuring instruments\n3.3 Determining workpiece specifications\n3.4 Computation of feed machine rpm\n3.5 Application of G – codes and M – codes\n3.6 Application of 4th axis operation\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\n activities\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation with questioning\n5.2 Written exam\n5.3 Demonstration\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 57 ---\nTR – CNC Milling Machine Operation NC III\n55"
