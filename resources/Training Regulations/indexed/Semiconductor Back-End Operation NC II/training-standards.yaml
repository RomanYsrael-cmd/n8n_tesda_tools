  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Semiconductor Back-end Operations NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: Semiconductor Back-end Operations\n\nNC Level: NC II\n\nNominal Training Duration:\n 16 hrs – Basic Competencies\n\n 16 hrs – Common Competencies\n\n 48 hrs – Core Competencies\n ----------\n\n 80 hrs - Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\nSemiconductor Back-end Operator, in accordance with industry standards. It covers the basic\n& common competencies in addition to the core competencies such as preparing workplace,\nanalyzing, carrying-out and monitoring backend machine/equipment operations and checking\nquality compliance for semiconductor back-end operations.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTO