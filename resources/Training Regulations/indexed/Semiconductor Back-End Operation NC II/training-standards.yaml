uctor back-end machine\n• Set/Check required semiconductor back-end\nmachine parameters\n• Discuss and demonstrate procedures in set up of\nsemiconductor back-end machine parameters and\nperipherals\n•\nStudy types and functions of semiconductor back-\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n\n• Written\nexam\n•\nPractical\nexam\n• Oral\nquestioning\n\n2 hrs\n\n--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 51\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\nend machine and peripherals\n• Learn and apply safety measures in machine\noperations\n• Learn and determine applicable out-of-control\naction plan(OCAP)\n• Use appropriate tools\n• Use appropriate equipment\n• Perform inspection, cleaning, storage, operator\npreventive maintenance\n\n1.3 Accomplish\nsemiconductor\nback-end\nchecklist\n• Study the types of production line documents/\nchecklists\n• Identify and accomplish required documents/\nchecklists\n• implement work turnover procedure\n\n•\nLecture\n•\nDiscussion\n\n• Practical\nexam\n•\nOral\nquestioning\n\n2 hrs\n\n1.4 Perform daily\nmaintenance\nactivity\n• Identify and check semiconductor FOL machine\nbasic physical condition\n• Perform daily PM activity based on checklist\n• Identify applicable out-of-control action plan(OCAP)\n• Apply 5S principles/ housekeeping procedures\n\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n\n• Practical\nexam\n•\nInterview\n\n2 hrs\n\n2. Analyze, carry-\nout and\nmonitor back-\nend operations\nfor\nsemiconductor\nproduction line\n\n24 hrs\n2.1 Initialize/\nOperate\nsemiconductors\nproduction line\nback-end\nmachine/\nequipment\n•\nLearn and apply safety requirements in the operation\nmanual\n•\nInterp