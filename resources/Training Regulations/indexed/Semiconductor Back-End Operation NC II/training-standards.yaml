ne operation\n\n•\nLecture\n•\nDiscussion\n•\nHands-on\n\n• Written exam\n•\nOral\nquestioning\n\n4 hrs\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 54\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n3.2 Perform visual\ninspection\n• Use appropriate instruments/tools\n• Learn and identify types of semiconductor production\nline back-end product defects\n• Apply finished products judgment criteria on\nsemiconductor production line back-end processes\n• Perform procedures on identification and\nsegregation of non-conforming products in\nsemiconductor production line back-end operation\n•\nApply 5S principles/housekeeping procedures\n• Identify conforming and non- conforming products\n• Perform visual inspection\n•\nLecture\n•\nDiscussion\n•\nHands-on\n\n•\nWritten\nexam\n•\nPractical\nexam\n•\nOral\nquestioning\n10 hrs\n\n3.3 Complete\nsemiconductor\nback-end lot\ntraceability\n• Perform lot traceability transaction\no Lot accounting steps\n• Accomplish production forms and documents\n• Identify and segregate conforming and non-\nconforming products\n• Learn and apply process controls on lots transaction\n\n•\nLecture\n•\nDiscussion\n•\nHands-on\n•\nDemonstration\n•\nViewing\nmultimedia\n\n•\nWritten\nexam\n•\nPractical\nexam\n•\nObservation\nin workplacd\n2 hrs\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 55",
