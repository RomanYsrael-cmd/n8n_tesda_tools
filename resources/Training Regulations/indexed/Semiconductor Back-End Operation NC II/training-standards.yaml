 of team\n• Lecture\n• Written\nexamination\n\n• Identify different sources of information\n\n2.2 Describe work as\na team\n• Describe team goals and objectives\n• Group\ndiscussion\n• Oral evaluation\n\n• Perform exercises in setting team goals and\nexpectations scenario\n• Role play\n• Oral evaluation\n• Observation\n\n• Identify:\no individual role and responsibility\n\n• Lecture\n• Written\nexamination\n\n• Practice Interacting effectively with others\n• Group\ndiscussion\n• Oral evaluation\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 43\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Read:\n• Lecture\n• Written\nexamination\n\no Fundamental rights at work including\ngender sensitivity\n\no Understanding individual competencies\nrelative to teamwork\n\no Types of individuals\n\no Role of leaders\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational\ngoals\n• Describe performance evaluation\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n• Read:\n• Lecture\n• Written\nexamination\n\no Work values and ethics (Code of\nConduct, Code of Ethics, etc.)\n\no Understanding personal objectives\n\no Understanding organizational goals\n\n• Demonstrate Intra and Interpersonal skills at\nwork\n\n• Demonstration\n• Observation\n\n• Demonstrate personal commitment in work\n\n3.2 Set and meet\nwork priorities\n• Describe company policies, operations,\nprocedures and standards\n• Group\ndiscussion\n• Oral evaluation\n\n• Read:\n• Lecture\n• Written\nexamination\n\no Time Management\n\no Basic strategic planning concepts\n\no Resource utilization and management\n\n• Apply managing goals and time\n• Demonstration\n• Observation\n\n--