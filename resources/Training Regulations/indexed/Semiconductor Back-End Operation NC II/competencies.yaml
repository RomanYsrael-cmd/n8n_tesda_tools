        "source_text": "ELC311204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and values\nneeded to apply quality standards in the workplace. The unit also\nincludes the application of relevant safety procedures and\nregulations, organization procedures and customer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Assess quality\nof received\nmaterials or\ncomponents\n1.1. Work instructions are\nobtained and work is carried\nout in accordance with\nstandard operating\nprocedures\n1.2. Received materials or\ncomponent parts are\nchecked against workplace\nstandards and\nspecifications\n1.3. Faulty material or\ncomponents related to work\nare identified and isolated\n1.4. Faults and any identified\ncauses are recorded and/or\nreported to the supervisor\nconcerned in accordance\nwith workplace procedures\n1.5. Faulty materials or\ncomponents are replaced in\naccordance with workplace\nprocedures\n• Relevant production\nprocesses, materials\nand products\n• Characteristics of\nmaterials, software\nand hardware used\nin production\nprocesses\n• Quality checking\nprocedures\n• Quality Workplace\nprocedures\n• Identification of\nfaulty materials\nrelated to work\n\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Critical thinking\n• Interpreting work\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company\nis identified and used\n2.2. Completed work is checked\nagainst workplace\nstandards relevant to the\ntask undertaken\n2.3. Faulty pieces are identified\nand isolated\n2.4. Information on the quality\nand other indicators of\nproduction performance is\nrecorded in accordance with\nworkplace procedures\n2.5. In cases of deviations from\nspecified quality\nstandards, causes are\ndocumented and reported\nin accordance with the\nworkplace’ standards\noperating procedures\n• Safety and\nenvironmental\naspects of\nproduction\nprocesses\n• Fault identification\nand reporting\n• Workplace\nprocedure in\ndocumenting\ncompleted work\n• Workplace Quality\nIndicators\n• Carry out work in\naccordance with\nOHS policies and\nprocedures\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 21\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Engage in\nquality\nimprovement\n3.1 Process improvement\nprocedures are participated\nin relation to workplace\nassignment\n3.2 Work is carried out in\naccordance with process\nimprovement procedures\n3.3 Performance of operation or\nquality of product or service\nto ensure customer\nsatisfaction is monitored\n\n• Quality\nimprovement\nprocesses\n• Company\ncustomers defined\n• Solution providing\nand decision-\nmaking\n• company process\nimprovement\nprocedure\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 22\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. wires\n1.1.2. cables, soldering lead\n1.1.3. electrical tape\n1.2. Components may include but not limited to:\n1.2.1.\nICs\n1.2.2.\nDiodes\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Quality standards\nQuality standards may relate but not limited to the\nfollowing:\n4.1 materials\n4.2 component parts\n4.3 final product\n4.4 production processes\n5. Customer\n5.1 Co-worker\n5.2 Supplier\n5.3 Client\n5.4 Organization receiving the product or service\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 23\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Method of assessment\nThe assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1\nObservation\n2.2\nQuestioning\n2.3\nPractical demonstration\n3. Resource implication\n\nMaterials and component parts and equipment to be\nused in a real or simulated electronic production\nsituation\n4. Context of Assessment\n\nAssessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 24\nUNIT TITLE :\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:"
