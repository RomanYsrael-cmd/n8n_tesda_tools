        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes,\nevents or tasks being undertaken to ensure a\nsafe and efficient working environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate\nlocation\n\n2. Method of assessment\nCompetency in this unit must be assessed through:\n2.1. Observation\n2.2. Oral questioning\n3. Resource Implication\nTools may include the following but not limited to:\n3.1 screw drivers\n3.2 pliers\n3.3 punches\n3.4 wrenches, files\n4. Context of Assessment\n\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 20\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
        },
        "source_text": "ELC311205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on the safe\nuse, handling and maintenance of tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntasks to be\nundertaken\n1.1. Tasks to be undertaken\nare properly identified\n1.2. Appropriate hand tools\nare identified and\nselected according to\nthe task requirements\n• Planning and\npreparing task/activity\n• Electronics hand tools\nand their uses\n• Function, operation\nand common faults in\nelectronics hand tools\n\n• Preparing\nrequired tasks\n• Communication\nskills\n• Using hand tools\nproperly\n2. Prepare hand\ntools\n2.1. Appropriate hand tools\nare checked for proper\noperation and safety\n2.2. Unsafe or faulty tools\nare identified and\nmarked for repair\naccording to standard\ncompany procedure\n• Checking and safety\nrequirements in\nhandling tools\n• Standard procedures\nin checking,\nidentification and\nmarking of safe or\nunsafe/ faulty tools\n\n• Identifying and\nchecking hand\ntools\n• Marking of safe or\nunsafe/ faulty\nhand tools\n3. Use appropriate\nhand tools and\ntest equipment\n3.1 Tools are used\naccording to tasks\nundertaken\n3.2 All safety procedures in\nusing tools are\nobserved at all times\nand appropriate\npersonal protective\nequipment (PPE) are\nused\n3.3 Malfunctions,\nunplanned or unusual\nevents are reported to\nthe supervisor\n• Safety requirements in\nusing electronics hand\ntools and test\nequipment\n• Electronics hand tools\nfor adjusting,\ndismantling,\nassembling, finishing,\nand cutting.\n• Processes,\nOperations, Systems\no Proper usage and\ncare of hand tools\no Types and uses of\ntest equipment\n• Common faults in the\nuse of hand tools\n\n• Reading skills\nrequired to\ninterpret work\ninstruction and\nnumerical skills\n• Using PPE\nproperly\n• Problem solving in\nemergency\nsituation\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 18\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n4. Maintain hand\ntools\n4.1 Tools are not dropped to\navoid damage\n4.2 Routine maintenance of\ntools undertaken\naccording to standard\noperational procedures,\nprinciples and techniques\n4.3 Tools are stored safely in\nappropriate locations in\naccordance with\nmanufacturer’s\nspecifications or standard\noperating procedures\n• Safety requirements in\nmaintenance of hand\ntools\n• Processes,\nOperations, Systems\no Maintenance of\ntools\no Storage of hand\ntools\n\n• Checking and\ncleaning hand\ntools\n• Storing hand\ntools properly\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\nHand tools for adjusting, dismantling, assembling,\nfinishing, and cutting. Tool set includes the following but\nnot limited to:\n1.1\nscrew drivers,\n1.2\npliers,\n1.3\npunches,\n1.4\nwrenches,\n1.5\nfiles\n2. Personal Protective\nEquipment (PPE)\n2.1.\nGloves\n2.2.\nProtective eyewear\n2.3.\nApron/overall\n3. Maintenance\n3.1.\nCleaning\n3.2.\nLubricating\n3.3.\nTightening\n3.4.\nSimple tool repairs\n3.5.\nHand sharpening\n3.6.\nAdjustment using correct procedures\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes,\nevents or tasks being undertaken to ensure a\nsafe and efficient working environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate\nlocation\n\n2. Method of assessment\nCompetency in this unit must be assessed through:\n2.1. Observation\n2.2. Oral questioning\n3. Resource Implication\nTools may include the following but not limited to:\n3.1 screw drivers\n3.2 pliers\n3.3 punches\n3.4 wrenches, files\n4. Context of Assessment\n\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 20\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
