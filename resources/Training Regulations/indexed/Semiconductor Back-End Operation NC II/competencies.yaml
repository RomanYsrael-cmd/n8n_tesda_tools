 values\nneeded to perform computer operations which include inputting,\naccessing, producing and transferring data using the appropriate\nhardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntask to be\nundertaken\n1.1. Requirements of task are\ndetermined in accordance\nwith the required output.\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned\nand required outcome.\n1.3. Task is planned to ensure that\nOH & S guidelines and\nprocedures are followed.\n1.4. Client-specific guidelines and\nprocedures are followed.\n1.5. Required data security\nguidelines are applied in\naccordance with existing\nprocedures.\n• Main types of\ncomputers and\nbasic features of\ndifferent operating\nsystems\n• Main parts of a\ncomputer\n• Information on\nhardware and\nsoftware\n• Data security\nguidelines\n• Reading and\ncomprehension\nskills required to\ninterpret work\ninstruction and to\ninterpret basic user\nmanuals.\n• Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n• Interpreting user\nmanuals and\nsecurity guidelines\n\n2. Input data into\ncomputer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating\nprocedures\n2.3. Inputted data are stored in\nstorage media according to\nrequirements\n2.4. Work is performed within\nergonomic guidelines\n• Basic ergonomics\nof keyboard and\ncomputer user\n• Storage devices\nand basic\ncategories of\nmemory\n• Relevant types of\nsoftware\n\n• Technology skills to\nuse equipment\nsafely including\nkeyboard skills.\n• Entering data\n3. Access\ninformation\nusing\ncomputer\n3.1. Correct program/ application\nis selected based on job\nrequirements\n3.2. Program/application\ncontaining the information\nrequired is accessed\naccording to company\nprocedures\n• General security,\nprivacy legislation\nand copyright\n• Productivity\nApplication\n• Business\nApplication\n• Accessing\ninformation\n•\n• Searching and\nbrowsing files and\ndata\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 25\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.3. Desktop icons are correctly\nselected, opened and closed\nfor navigation purposes\n3.4. Keyboard techniques are\ncarried out in line with OH & S\nrequirements for safe use of\nkeyboards\n4. Produce/\noutput data\nusing\ncomputer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as required\nusing computer\nhardware/peripheral devices\nin accordance with standard\noperating procedures\n4.3. Files, data are transferred\nbetween compatible systems\nusing computer software,\nhardware/ peripheral devices\nin accordance with standard\noperating procedures\n• Computer\napplication in\nprinting, scanning\nand sending\nfacsimile\n• Types and function\nof computer\nperipheral devices\n• Computer data\nprocessing\n• Printing of data\n• Transferring files\nand data\n5. Maintain\ncomputer\nequipment\nand systems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of consumables\nare implemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with standard\noperating procedures\n5.3. Basic file maintenance\nprocedures are implemented\nin line with the standard\noperating procedures\n• Computer\nequipment/system\nbasic maintenance\nprocedures\n• Viruses\n• OH & S principles\nand responsibilities\n• Calculating\ncomputer capacity\n• System Software\n• Basic file\nmaintenance\nprocedures\n• Removing computer\nviruses from\ninfected machines\n• Making backup files\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 26\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7. Mouse\n1.8.\nVoice/Data logger\n2. Software\nSoftware includes the following but not limited to:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n2.5.\nClient Specific Software\n3. OH & S guidelines\n3.1. OHS guidelines\n3.2. Enterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1. diskettes\n4.2. CDs\n4.3. zip disks\n4.4. hard disk drives, local and remote\n4.5. Optical drives\n4.6.\nCloud sctorage\n5. Ergonomic guidelines\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5.\nVisual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1. directories/folders\n6.2. files\n6.3. network devices\n6.4. recycle bin\n6.5.\nprogram icons\n7. Maintenance\n7.1. Creating and managing more space in the hard\ndisk and other peripherals\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 27\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly\nand according to the task requirement\n1.2. Identified and explain the functions of both\nhardware and software used, their general features\nand capabilities\n1.3. Produced accurate and complete data in\naccordance with the requirements\n1.4. Used appropriate devices and procedures to\ntransfer files/data accurately\n1.5. Used basic functions of a www-browser to locate\ninformation\n1.6. Maintained computer system in line with the\nstandard operating procedures\n2. Method of assessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n2.1\nObservation with oral questioning\n2.2\nPractical demonstration\n3. Resource implication\n3.1. Computer hardware with peripherals\n3.2. Appropriate software\n4. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 28\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: SET UP BACK-END OPERATIONS WORKPLACE FOR\nSEMICONDUCTOR PRODUCTION LINE\n\nUNIT CODE : ELC313307\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude needed in setting-\nup the backend operations workplace for semiconductor production\nline. This includes gathering of production tools and materials,\nsetting-up backend machine parameters and peripherals (including\nchangeover), accomplishing production line checklist and performing\ndaily maintenance activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Gather tools\nand materials\nfor\nsemiconductor\nback-end\nprocess\n1.1. Process requirements\nare determined according\nto production\nspecifications\n1.2. Appropriate tools and\nmaterials are selected\nand completed according\nto process requirements\nand required time\n1.3. Quantity and quality of\nmaterials are checked in\naccordance to\nproduction\nspecifications\n1.4. Completeness and\naccurateness of\ndocuments are checked\nin accordance to\nproduction specifications\n\n• Awareness of\nsemiconductor production\nline systems and processes\n• Familiarity with\nsemiconductor production\nline back-end materials\n• Understanding bill of\nmaterials, traveler, check list\nand other applicable\nsemiconductor production\nline back-end documents/\nspecifications.\n• Awareness of safe handling\nof tools and materials i.e 5S,\nMaterial Safety Data Sheet\n(MSDS), Personal\nProtective Equipment\n(PPE), Electro Static\nDischarge (ESD),\nEnvironmental Health\nSystems (EHS),\nOccupational Health and\nSafety (OHS). Cleanroom\nrequirements and\ncontamination control\n• Understanding of IPC\nstandards\n• Awareness of international\nquality standards\no Quality Management\nSystem\no Environmental\nManagement System\n• Awareness of visual criteria\n• Familiarity with\nsemiconductor production\nline back-end tools\n• Time consciousness on set\nup time\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Detecting\nabnormality or\nnon-\nconformance\n• Writing skills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 29\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n2. Set up\nsemiconductor\nback-end\nmachine\nparameters\nand\nperipherals\n\n2.1 Walk-around check or\nvisual inspection of back-\nend machine is done\nprior to production\noperation\n2.2 Semiconductor back-end\nmachine parameters\nare set correctly\naccording to production\nspecifications\n2.3 Semiconductor back-end\nmachine parameters and\nperipherals are checked\naccording to production\nspecifications\n2.4 Any non-conformance to\nspecifications are\nreported to appropriate\npersonnel\n• Semiconductor production\nline back-end machine set\nup parameters\n• Awareness of safety\noperation of back-end\nmachines\n• Reading of different gauges\n• Awareness of set up criteria\n• Awareness of applicable\nOut of Control Action Plan\n(OCAP)\n\n• Skills in basic\nmachine\noperation and\nset-up\n• Detecting\nabnormality or\nnon-\nconformance\n• Communication\nSkills, written\nand oral\n3. Accomplish\nsemiconductor\nback-end\nchecklist\n\n3.1 All check items are\nperformed according to\nspecifications\n3.2 Production line checklist\nare correctly filled-out\naccording to\nspecifications\n3.3 Production line checklist\nis completed based on\nrequired time\n3.4 Work turnover procedure\nis performed for next\nwork shift\n• Completeness and accuracy\nof information on production\nline checklist\n• Work values and ethics\no Attentiveness\no Time consciousness\no Cost-consciousness\no Quality-consciousness\n\n• Filling out\nappropriate\ninformation on\nchecklist/ lot\ntravelers\n\n4. Perform daily\nmaintenance\nactivity\n\n4.1 Semiconductor machine\nbasic physical\ncondition are checked\naccording to\nspecifications\n4.2 If necessary, daily\nmaintenance activity is\nperformed based on\nrequired time\n4.3 Any non-conformance to\nspecifications are\nreported to appropriate\npersonnel\n4.4 Housekeeping\nprocedures are observed\nin accordance with 5S\ndiscipline and\nestablished procedures\n• Workplace organization\n(layout/arrangement of\nworkplace)\n• Understanding the\napplicable daily PM\nchecklist\n• Semiconductor back-end\nmachine basic physical\nconditions\n• Time consciousness\n• Awareness of applicable out\nof control action plan\n(OCAP)\n• 5S principles\n• Checking of\nmachine basic\nphysical\nconditions\n• Detecting\nabnormality or\nnon-\nconformance\n• Writing skills\n• Skills in\nhousekeeping\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Production\nspecifications\nMay include production specifications from:\n1.1\nMachine specifications\n1.2\nSet-up checklist\n1.3\nWork Instructions (WI)\n1.4\nProduction procedures\n1.5\nOut of Control Plan (OCAP) procedures\n1.6\nControl Plan procedures\n1.7\nStatistical Process Control (SPC) procedures\n1.8\nWork Manuals\n1.9\nProduction Process and Flow Diagrams\n2. Tools\nTools may include:\n2.1\nTweezers\n2.2\nVacuum Pen\n2.3\nMetric Allen Keys\n2.4\n12 Digit Calculator\n2.5\nTorque driver\n3. Process\nSemiconductor production line back-end processes\nmay include but not be limited to:\n3.1\nMolding\n3.2\nSingulation\n3.3\nMarking\n3.4\nSolder Plating\n3.5\nTesting\n3.6\nPackaging\n3.7\nFinal visual inspection\n4. Required time\nRequired time may include:\n4.1\nProduction cycle time\n4.2\nProcess cycle time\n4.3\nMachine operation cycle time\n5. Machine parameters\nMachine parameters may include:\n5.1\nMachine type\n5.2\nMachine model\n5.3\nMachine settings\n5.4\nMaterial/ Product type\n5.5\nMaterial/ Product model\n6. Appropriate personnel\nAppropriate personnel may include:\n6.1\nImmediate supervisor\n6.2\nMaintenance personnel\n6.3\nEngineer\n6.4\nQuality Control personnel\n7. Machine basic\nphysical\n conditions\nMachine basic physical condition check may include:\n7.1\nComplete screws\n7.2\nFan is working\n7.3\nNo oil leakage\n7.4\nNo broken wire\n7.5\nPresence of foreign material\n7.6\nAny physical defect\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 31\n EVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nGathered production tools and materials for semiconductor\nback-end operations according to approved production\nspecifications\n1.2\nChecked and set up semiconductor back-end machine\nparameters and auxiliaries for production startup and usage\n1.3\nAccomplished semiconductor back-end production quality\nchecklist according to quality manuals and procedures\n1.4\nChecked machine basic physical condition in accordance to\nproduction line standards and performed daily maintenance\nactivities based on required time\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nAppropriate Semiconductor back-end machine and\nequipment\n2.2\nTools (as indicated in the Range Of Variables)\n2.3\nMaterials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nPersonal Computer\n2.9\nPrinter\n2.10 Reporting forms\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect Observation with oral questioning\n3.3\nExams and Tests\n\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 32\nUNIT OF COMPETENCY: ANALYZE, CARRY-OUT AND MONITOR BACK-END\nOPERATIONS FOR SEMICONDUCTOR PRODUCTION LINE\n\nUNIT CODE : ELC313308\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude needed in\nperforming any process, either automated or manual, in back-end\noperations for semiconductor production line. This includes\ninitializing/operating semiconductor back-end machine/\nequipment, running sample units, loading production units.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Initialize/\nOperate\nsemiconductor\nback-end\nmachine/\nequipment\n\n1.1 Safety requirements are\ncomplied with using the\noperation manual\n1.2 Appropriate PPE and ESD\napparels are used in the\nperformance of the job\n1.3 Appropriate tools and\nmaterials are used\naccording to process\nrequirements\n1.4 Semiconductor back-end\nmachine settings are\nchecked according to\nproduct specifications\n1.5 Semiconductor\nproduction line back-end\nmachine is initialized/\noperated in accordance to\noperation manual\n1.6 Semiconductors back-end\nequipment troubles/\nproblems are immediately\nrecorded and reported to\nthe appropriate personnel\n• Awareness on safe\nworking conditions\n• Awareness on\nsemiconductors back-end\nmachine safety features\nand guidelines\n• Awareness on the\nfollowing; 5S, Material\nSafety Data Sheet (MSDS),\nPersonal Protective\nEquipment (PPE), Electro\nStatic Discharge (ESD),\nEnvironmental Health\nSystems (EHS),\nOccupational Health and\nSafety (OHS)\n• Awareness on international\nquality standards\no Quality Management\nSystem\no Environmental\nManagement System\n• Understanding\nsemiconductors production\nline back-end product and\nprocess specification\n• Operation of\nsemiconductors production\nline back-end machines\n• Basic machines/\nequipment\ntrouble/breakdowns\n• Interpreting of different\ngauges readings\n• Visual/mechanical criteria\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Writing skills\n• Machine\nOperation skills\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 33\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n2. Run\nsemiconductors\nback-end\nsample units\n\n2.1 Semiconductors back-end\nsample output is checked\nin accordance to product\ncriteria\n2.2 Semiconductors back-end\nsample unit is loaded to\nthe equipment in\naccordance to product\norientation and\nspecifications\n2.3 If applicable, manual\nsemiconductor back-end\nprocess is performed in\naccordance with work\ninstructions and company\nprocedures\n2.4 Out of control action plan\n(OCAP) is followed in case\nof any non-conformance or\ndeviation to the process\n2.5 Semiconductors back-end\nproduction forms are\naccomplished based on\nproduction procedures\n\n• Product visual/ mechanical\ncriteria\n• Types of sample units\n• Product orientation\n• Understanding of OCAP on\nrunning sample units\n• Completeness and\naccuracy of information on\nsemiconductors production\nline form for sample units\n\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Writing skills\n• Machine\nOperation skills\n3. Load\nsemiconductors\nback-end\nproduction units\n\n3.1 Production output is\nchecked in accordance to\nproduct criteria\n3.2 Production units are loaded\nto the equipment in\naccordance to product\norientation and\nspecifications\n3.3 If applicable, manual\nsemiconductor back-end\nprocess is performed in\naccordance with work\ninstructions and company\nprocedures\n3.4 Out of control action plan\n(OCAP) is followed in case\nof any non-conformance or\ndeviation to the process\n3.5 Semiconductors back-end\nproduction forms are\naccomplished based on\nproduction procedures\n\n• Product visual/ mechanical\ncriteria\n• Semiconductors back-end\noperation process controls\n• Understanding of OCAP on\nsemiconductors production\nline back-end operations\n• Completeness and\naccuracy of information on\nsemiconductors production\nline form for production\nunits\n• Work values and ethics\no Attentiveness\no Time consciousness\no Cost-consciousness\no Quality-consciousness\n\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Writing skills\n• Machine\nOperation skills\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 34\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nPersonal protective equipment may include:\n1.1 Safety shoes\n1.2 Gloves\n1.3Safety goggles\n2. ESD apparels\nESD apparels may include:\n2.1 Shoes\n2.2 Smock and Head cap\n2.3 ESD Jacket\n2.4 Bunny suit\n2.5 Face mask\n2.6Wrist/Foot ground strap\n3. Tools and materials\nAppropriate tools and materials may include:\n3.1 Tools\n3.1.1 Tweezers\n3.1.2 Vacuum Pen\n3.1.3 Allen Keys\n3.1.4 Calculator\n3.1.5 Torque driver\n3.2 Materials\n3.1.1 Appropriate production components\n3.1.2 ESD apparels\n4. Process\nSemiconductor production line back-end processes may\ninclude but not be limited to:\n4.1\nMolding\n4.2\nSingulation\n4.3\nMarking\n4.4\nSolder Plating\n4.5\nTesting\n4.6\nPackaging\n4.7\nFinal Visual Inspection\n5. Semiconductor back-\nend machines\nSemiconductor back-end machines may include:\n5.1 Molding Machines\n5.2 DTFS machines\n5.3 Marking Machines\n5.4 Solder Plating Machines\n5.5 Testing Machines\n5.5.1 Temp cycling\n5.5.2 Baking (Oven)\n5.5.3 Burn In Chamber\n5.5.4 Liquid and Air Calibration\n5.5.5 Mark Scan\n5.5.6 Test systems\n5.5.7 Test Handlers\n5.6 Packaging Machines\n5.6.1 Tape and Reel\n5.6.2 Vacuum sealer\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 35\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nOperated back-end machine/ equipment for semiconductors\nproduction line according to production requirements\n1.2\nRun semiconductors back-end sample units in accordance to\nproduct orientation and specifications\n1.3\nLoaded semiconductors back-end production units in\naccordance to product orientation and specifications\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Appropriate Semiconductor back-end machine and equipment\n2.2 Tools (as indicated in the Range Of Variables)\n2.3 Appropriate production units and materials\n2.4 Work Instructions Assessment rating sheet\n2.5 Sample production checklist\n2.6 Applicable forms for specific equipment or machines\n2.7 Procedure and quality manuals\n2.8 Personal Computer\n2.9 Printer\n2.10 Reporting forms\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect Observation with oral questioning\n3.3\nExams and Tests\n\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n6. Product criteria\nProduct criteria may include:\n6.1 Electrical criteria\n6.2 Visual criteria\n6.3 Mechanical criteria\n7. Sample Unit\nSample units may include:\n7.1 Good Unit\n7.2 Reject Unit\n7.3 Dummy Unit\n7.4 Standard Unit\n8. Production forms\nProduction forms may include:\n8.1 Lot summary\n8.2 SPC checklist\n8.3 Monitoring checklist\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 36\nUNIT OF COMPETENCY: CHECK QUALITY COMPLIANCE OF BACK-END\nOPERATIONS FOR SEMICONDUCTOR PRODUCTION LINE\n\nUNIT CODE : ELC313309\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude needed in\nchecking quality compliance of back-end operations for\nsemiconductor production line. This includes monitoring back-end\nmachine/equipment operation, completing lot traceability and\nperforming visual machine inspection in semiconductor production\nline.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Monitor\nsemiconductor\nbackend\noperation\n1.1 Output and yield are\nchecked in accordance\nwith production\nrequirements\n1.2 Out of control action plan\n(OCAP) is followed in case\nof any non-conformance or\ndeviation to the process\n1.3 Semiconductor production\nforms are accomplished in\naccordance with process\nrequirements\n• Yield requirement\n• Machine capacity\n• Understanding of OCAP\non machine/ equipment\noperation\n• Basic Statistical Process\nControl (SPC)\n• Completeness and\naccuracy of information\non semiconductor\nproduction line form for\nunusual machine\noperation\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Writing skills\n• Monitoring skills\n2. Perform visual\ninspection\n2.1 Finished products are\nchecked/ inspected using\nappropriate\ninstruments/tools\n2.2 Physical defects are\nidentified based on product\nspecifications\n2.3 Conforming and non-\nconforming products are\nidentified and segregated\nin accordance with\nproduction procedures\n2.4 Housekeeping procedures\nare observed in\naccordance with 5S\ndiscipline and established\nprocedures\n• Finished products\njudgment criteria on\nsemiconductor\nproduction line back-end\nprocesses\n• Uses of appropriate\ninstruments/tools\n• Procedures on\nidentification and\nsegregation of non-\nconforming products in\nsemiconductor\nproduction line back-end\noperations\n• 5S principles\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Writing skills\n• Monitoring skills\n3. Complete\nsemiconductor\nback-end lot\ntraceability\n3.1 Lot traceability are\ntransacted in accordance\nwith production procedures\n3.2 Conforming and non-\nconforming products are\nidentified and segregated\nin accordance with\nproduction procedures\n3.3 Disposition of lots is\ndetermined in accordance\nwith product criteria\n• Lot traceability processes\n• Types of semiconductor\nproduction line backend\nproduct defects\n• Process controls on lots\ntraceability\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Writing skills\n• Monitoring skills\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Production forms\nProduction forms may include:\n1.1 Lot summary\n1.2 SPC checklist\n1.3 Monitoring checklist\n2. Transacted lot\ntraceability\nTransaction may include:\n2.1 Manual\n2.2 Automated\n3. Disposition of lots\nDisposition of lots may include:\n3.1 Pass\n3.2 Failed\n3.3 Hold\n3.4 Scrap\n3.5 Re-screen/ Re-work/Re-test\n4. Appropriate\ninstruments/tools\nAppropriate instruments/tools may include:\n4.1 Stereoscopic microscope\n4.2 magnifying lens\n4.3 profile projector/ comparator\n5. Physical defects\nPhysical defects may include:\n5.1 lead defects\n5.2 marking defects\n5.3 mold defects\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 38\n\n EVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nMonitored semiconductor back-end machine/ equipment\noperation based on product requirements\n1.2\nPerformed visual inspection in accordance to semiconductor\nproduction line standards\n1.3\nCompleted semiconductor back-end lot traceability in\naccordance with production procedures\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nAppropriate Semiconductor back-end machine and equipment\n2.2\nTools (as indicated in the Range Of Variables)\n2.3\nAppropriate production units and materials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nPersonal Computer\n2.9\nPrinter\n2.10 Reporting forms\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect Observation with oral questioning\n3.3\nExams and Tests\n\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 43 ---\n------------------------------------------------