  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units of\ncompetency required for Semiconductor Back-end Operations NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311105\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1. Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2. Effective questioning,\nactive listening and\nspeaking skills are used to\ngather and convey\ninformation\n1.3. Appropriate medium is\nused to transfer\ninformation and ideas\n1.4. Appropriate non- verbal\ncommunication is used\n1.5. Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6. Defined workplace\nprocedures for the location\nand storage of\ninformation are used\n1.7. Personal interaction is\ncarried out clearly and\nconcisely\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational policies\n• Sources of information\n• Types of question\n• Medium of\ncommunication\n• Flow of\ncommunication\n• Storage system\n• Telephone courtesy\n\n• Follow simple\nspoken language\n• Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Gather and\nprovide\ninformation in\nresponse to\nworkplace\nrequirements\n• Listening skills\n• Questioning skills\n• Workplace\nlanguage skills\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 3\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are clearly\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of employment\nare asked and responded\nto according to\norganizational guidelines\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of\ncommunication\n• Workplace\ninteractions\n• Nonverbal\ncommunication\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Interpersonal\ncommunication\nskill\n• Observing\nmeeting protocols\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating to\nconditions of employment\nare completed accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements to\nsupervisor are completed\naccording to\norganizational guidelines\n• Technology relevant\nto the enterprise and\nthe individual’s work\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n\n• Apply basic\nmathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n• Data recording\n• Report writing\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 5\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format\nof the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n2. Resource\nImplications\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Internet\n3. Methods of\nAssessment\n3.1. Direct Observation\n3.2. Oral interview and written test\n4. Context for\nAssessment\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 6\nUNIT OF COMPETENCY:\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n : 500311106\n\nUNIT DESCRIPTOR\n :\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Describe team\nrole and scope\n1.1. The role and objective of the\nteam is identified from available\nsources of information\n1.2. Team parameters, reporting\nrelationships and responsibilities\nare identified from team\ndiscussions and appropriate\nexternal sources\n\n• Team roles\n• Definition of Team\n• Difference between\nteam and\n• group\n• Different sources of\ninformation\n• Objectives and goals\nof team\n• Describing the\nteam role and\nscope\n\n1. Identify own\nrole and\nresponsibility\nwithin team\n2.1 Individual role and responsibilities\nwithin the team environment are\nidentified\n2.2 Roles and responsibility of other\nteam members are identified and\nrecognized\n2.3 Reporting relationships within\nteam and external to team are\nidentified\n• Team structure\n• Roles and\nresponsibility of team\nmembers\n• Teams in work\nenvironment\n• Fundamental rights\nat work including\ngender sensitivity\n• Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n• Identifying\nindividual role and\nresponsibility\n• Identifying external\nrelationship\n2. Work as a\nteam member\n3.1 Effective and appropriate forms of\ncommunications used and\ninteractions undertaken with team\nmembers who contribute to\nknown team activities and\nobjectives\n3.2 Effective and appropriate\ncontributions made to\ncomplement team activities and\nobjectives, based on individual\nskills and competencies and\nworkplace context\n3.3 Observed protocols in reporting\nusing standard operating\nprocedures\n3.4 Contribute to the development of\nteam work plans based on an\nunderstanding of team’s role and\nobjectives and individual\ncompetencies of the members\n• Communication\nprocess\n• Group planning and\ndecision making\n• Team goals and\nobjectives\n• Understanding\nindividual\ncompetencies relative\nto teamwork\n• Types of individuals\n• Role of leaders\n• Interacting\neffectively with\nothers\n• Setting team goals\nand expectations\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with enterprise\nor specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 8\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\n Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nObservation of the individual member in relation to the\nwork activities of the group\n3.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 9\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Integrate\npersonal\nobjectives with\norganizational\ngoals\n1.1. Personal growth and work\nplans are pursued towards\nimproving the\nqualifications set for the\nprofession\n1.2. Intra- and interpersonal\nrelationships are\nmaintained in the course of\nmanaging oneself based\non performance\nevaluation\n1.3. Commitment to the\norganization and its goal is\ndemonstrated in the\nperformance of duties\n• Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n• Understanding\npersonal objectives\n• Understanding\norganizational goals\n• Difference between\nintra and\ninterpersonal\nrelationship\n• Performance\nevaluation\n• Demonstrate Intra\nand Interpersonal\nskills at work\n• Demonstrate\npersonal\ncommitment in\nwork\n2. Set and meet\nwork priorities\n2.1 Competing demands are\nprioritized to achieve\npersonal, team and\norganizational goals and\nobjectives.\n2.2 Resources are utilized\nefficiently and effectively to\nmanage work priorities and\ncommitments\n2.3 Practices along economic\nuse and maintenance of\nequipment and facilities\nare followed as per\nestablished procedures\n• Company policies\n• Company operations,\nprocedures and\nstandards\n• Time management\n• Basic strategic\nplanning concepts\n• Resource utilization\nand management\n\n• Managing goals\nand time\n• Practice\neconomic use of\nresources and\nfacilities\n• Setting work\npriorities\n• Practice time\nmanagement\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and career\nopportunities are identified\nand availed of based on\njob requirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as proof of\ncareer advancement\n3.3 Licenses and/or\ncertifications relevant to\njob and career are\nobtained and renewed\n• Career development\nopportunities\n• Company recognition\nand incentives\n• Information on\nrelevant licenses and\nor certifications\n• Determining\npersonal career\ndevelopment\nneeds\n• Identifying career\nopportunities\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 10\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Maintain\nprofessional\ngrowth and\ndevelopment\n4.1 Trainings and career\nopportunities are identified\nand availed of based on job\nrequirements\n4.2 Recognitions are\nsought/received and\ndemonstrated as proof of\ncareer advancement\n4.3 Licenses and/or\ncertifications relevant to\njob and career are obtained\nand renewed\n\n• Career development\nopportunities\n• Company recognition\nand incentives\n• Information on\nrelevant licenses and\nor certifications\n• Determining\npersonal career\ndevelopment\nneeds\n• Identifying career\nopportunities\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 11\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 12\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 13\n\nUNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\n\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with\nregulatory and organizational requirements for occupational\nhealth and safety.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nhazards and\nrisks\n1.1 Safety regulations and\nworkplace safety and hazard\ncontrol practices and\nprocedures are clarified and\nexplained based on\norganization procedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding indicators are\nidentified to minimize or\neliminate risk to co-workers,\nworkplace and environment\nin accordance with\norganization procedures\n1.3 Contingency measures\nduring workplace accidents,\nfire and other emergencies\nare recognized and\nestablished in accordance\nwith organization procedures\n• OHS procedures and\npractices and\nregulations\n• Hazards/risks\nidentification and\ncontrol\n• OHS indicators\n• Organizational\ncontingency practices\n\n• Hazards/risks\nidentification and\ncontrol skills\n• Practice of\nsafety and health\nprocedures and\npersonal hygiene\n\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of maximum tolerable\nlimits which when exceeded\nwill result in harm or damage\nare identified based on\nthreshold limit values (TLV)\n2.2 Effects of the hazards are\ndetermined\n2.3 OHS issues and/or concerns\nand identified safety\nhazards are reported to\ndesignated personnel in\naccordance with workplace\nrequirements and relevant\nworkplace OHS legislation\n• Threshold Limit Value\n-TLV\n• Effects of safety\nhazards\n\n• Communication\nskills\n• Reporting safety\nhazards\n3. Control\nhazards and\nrisks\n3.1 Occupational Health and\nSafety (OHS) procedures\nfor controlling hazards/risks\nin workplace are\nconsistently followed\n3.2 Procedures for dealing with\nworkplace accidents, fire\n• Personal hygiene\npractices\n• Organization safety\nand health protocol\n• Company emergency\nprocedure practices\n• Practice of\npersonal hygiene\n• Respond to\nemergency\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 14\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nand emergencies are\nfollowed in accordance with\norganization OHS policies\n3.3 Personal protective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OHS\nprocedures and practices\n3.4 Appropriate assistance is\nprovided in the event of a\nworkplace emergency in\naccordance with established\norganization protocol\n\n4.\nMaintain\nOHS\nawareness\n4.1 Emergency-related drills\nand trainings are\nparticipated in as per\nestablished organization\nguidelines and procedures\n4.2 OHS personal records are\ncompleted and updated in\naccordance with workplace\nrequirements\n• Workplace OHS\npersonal records\n• Information on\nemergency-related\ndrills\n• Practice\nemergency-\nrelated drill skills\nin the workplace\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nSafety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2.\nHazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3.\nContingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4.\nPPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n5.\nEmergency-related\ndrills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6.\nOHS personal\nrecords\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 16\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 17\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\n\nUNIT CODE\n:\nELC311205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on the safe\nuse, handling and maintenance of tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntasks to be\nundertaken\n1.1. Tasks to be undertaken\nare properly identified\n1.2. Appropriate hand tools\nare identified and\nselected according to\nthe task requirements\n• Planning and\npreparing task/activity\n• Electronics hand tools\nand their uses\n• Function, operation\nand common faults in\nelectronics hand tools\n\n• Preparing\nrequired tasks\n• Communication\nskills\n• Using hand tools\nproperly\n2. Prepare hand\ntools\n2.1. Appropriate hand tools\nare checked for proper\noperation and safety\n2.2. Unsafe or faulty tools\nare identified and\nmarked for repair\naccording to standard\ncompany procedure\n• Checking and safety\nrequirements in\nhandling tools\n• Standard procedures\nin checking,\nidentification and\nmarking of safe or\nunsafe/ faulty tools\n\n• Identifying and\nchecking hand\ntools\n• Marking of safe or\nunsafe/ faulty\nhand tools\n3. Use appropriate\nhand tools and\ntest equipment\n3.1 Tools are used\naccording to tasks\nundertaken\n3.2 All safety procedures in\nusing tools are\nobserved at all times\nand appropriate\npersonal protective\nequipment (PPE) are\nused\n3.3 Malfunctions,\nunplanned or unusual\nevents are reported to\nthe supervisor\n• Safety requirements in\nusing electronics hand\ntools and test\nequipment\n• Electronics hand tools\nfor adjusting,\ndismantling,\nassembling, finishing,\nand cutting.\n• Processes,\nOperations, Systems\no Proper usage and\ncare of hand tools\no Types and uses of\ntest equipment\n• Common faults in the\nuse of hand tools\n\n• Reading skills\nrequired to\ninterpret work\ninstruction and\nnumerical skills\n• Using PPE\nproperly\n• Problem solving in\nemergency\nsituation\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 18\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n4. Maintain hand\ntools\n4.1 Tools are not dropped to\navoid damage\n4.2 Routine maintenance of\ntools undertaken\naccording to standard\noperational procedures,\nprinciples and techniques\n4.3 Tools are stored safely in\nappropriate locations in\naccordance with\nmanufacturer’s\nspecifications or standard\noperating procedures\n• Safety requirements in\nmaintenance of hand\ntools\n• Processes,\nOperations, Systems\no Maintenance of\ntools\no Storage of hand\ntools\n\n• Checking and\ncleaning hand\ntools\n• Storing hand\ntools properly\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\nHand tools for adjusting, dismantling, assembling,\nfinishing, and cutting. Tool set includes the following but\nnot limited to:\n1.1\nscrew drivers,\n1.2\npliers,\n1.3\npunches,\n1.4\nwrenches,\n1.5\nfiles\n2. Personal Protective\nEquipment (PPE)\n2.1.\nGloves\n2.2.\nProtective eyewear\n2.3.\nApron/overall\n3. Maintenance\n3.1.\nCleaning\n3.2.\nLubricating\n3.3.\nTightening\n3.4.\nSimple tool repairs\n3.5.\nHand sharpening\n3.6.\nAdjustment using correct procedures\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes,\nevents or tasks being undertaken to ensure a\nsafe and efficient working environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate\nlocation\n\n2. Method of assessment\nCompetency in this unit must be assessed through:\n2.1. Observation\n2.2. Oral questioning\n3. Resource Implication\nTools may include the following but not limited to:\n3.1 screw drivers\n3.2 pliers\n3.3 punches\n3.4 wrenches, files\n4. Context of Assessment\n\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 20\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nELC311204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and values\nneeded to apply quality standards in the workplace. The unit also\nincludes the application of relevant safety procedures and\nregulations, organization procedures and customer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Assess quality\nof received\nmaterials or\ncomponents\n1.1. Work instructions are\nobtained and work is carried\nout in accordance with\nstandard operating\nprocedures\n1.2. Received materials or\ncomponent parts are\nchecked against workplace\nstandards and\nspecifications\n1.3. Faulty material or\ncomponents related to work\nare identified and isolated\n1.4. Faults and any identified\ncauses are recorded and/or\nreported to the supervisor\nconcerned in accordance\nwith workplace procedures\n1.5. Faulty materials or\ncomponents are replaced in\naccordance with workplace\nprocedures\n• Relevant production\nprocesses, materials\nand products\n• Characteristics of\nmaterials, software\nand hardware used\nin production\nprocesses\n• Quality checking\nprocedures\n• Quality Workplace\nprocedures\n• Identification of\nfaulty materials\nrelated to work\n\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Critical thinking\n• Interpreting work\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company\nis identified and used\n2.2. Completed work is checked\nagainst workplace\nstandards relevant to the\ntask undertaken\n2.3. Faulty pieces are identified\nand isolated\n2.4. Information on the quality\nand other indicators of\nproduction performance is\nrecorded in accordance with\nworkplace procedures\n2.5. In cases of deviations from\nspecified quality\nstandards, causes are\ndocumented and reported\nin accordance with the\nworkplace’ standards\noperating procedures\n• Safety and\nenvironmental\naspects of\nproduction\nprocesses\n• Fault identification\nand reporting\n• Workplace\nprocedure in\ndocumenting\ncompleted work\n• Workplace Quality\nIndicators\n• Carry out work in\naccordance with\nOHS policies and\nprocedures\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 21\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Engage in\nquality\nimprovement\n3.1 Process improvement\nprocedures are participated\nin relation to workplace\nassignment\n3.2 Work is carried out in\naccordance with process\nimprovement procedures\n3.3 Performance of operation or\nquality of product or service\nto ensure customer\nsatisfaction is monitored\n\n• Quality\nimprovement\nprocesses\n• Company\ncustomers defined\n• Solution providing\nand decision-\nmaking\n• company process\nimprovement\nprocedure\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – SEMICONDUCTOR BACK-END OPERATIONS NC II (New) Promulgated Dec. 16, 2015 22\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. wires\n1.1.2. cables, soldering lead\n1.1.3. electrical tape\n1.2. Components may include but not limited to:\n1.2.1.\nICs\n1.2.2.\nDiodes\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\