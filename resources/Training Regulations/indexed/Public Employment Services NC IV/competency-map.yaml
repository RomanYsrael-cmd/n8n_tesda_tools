  "source_text": "SECTION 1 PUBLIC EMPLOYMENT SERVICES NC IV QUALIFICATION\n\nThe PUBLIC EMPLOYMENT SERVICES NC IV Qualification consists of competencies that a\nperson must achieve to promote full employment facilitation and equality of employment\nopportunities for all.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311401\nUtilize specialized communication skill\n500311402\nDevelop and lead teams\n500311403\nPerform higher-order thinking processes and apply techniques in the\n\n workplace\n500311404\nContribute to the practice of social justice in the workplace\n500311405\nManage innovative work instructions\n500311406\nManage and evaluate usage of information\n500311407\nLead in improvement of occupational safety and health (OSH)\nprograms, policies and procedures\n500311408\nLead towards improvement of environmental work programs,\npolicies and procedures\n500311409\nSustain entrepreneurial skills\n\nUNIT CODE\nCOMMON COMPETENCIES\nELC311203\nPerform computer operations\nSOC323201\nMaintain an effective relationship with clients/customers\nSOC323202\nManage own performance\nSOC323203\nApply quality standards\n\nUNIT CODE\nCORE COMPETENCIES\nSOC341301 Establish and strengthen linkages with other organizations\nSOC341302 Supervise PESO planning activities\nSOC341303 Supervise PESO programs, activities and projects\nSOC341304 Provide continuous improvement on operations and\nsolutions to PESO concerns\nSOC341305 Supervise PES office\n\nA person who has achieved this Qualification is competent to be:\n\n PESO MANAGER\n\n--- PDF PAGE 6 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 2"
