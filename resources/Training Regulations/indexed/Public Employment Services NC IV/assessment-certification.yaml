      "number": "4.2",
      "text": "1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior `"
    },
    {
      "number": "4.2",
      "text": "2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "number": "4.2",
      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. For Trainer-Assessor • Holder of National TVET Trainer Certificate Level I (NTTC) in Public Employment Services NC IV • Must have at least 3 years supervisory level work experience in the Public Employment Services • With teaching/training experience in delivering educational and training programs related to Public Employment Services for at least 2 years • Have assisted in the actual conduct of assessment to at least two (2) candidates. For Industry Assessor • Holder of National Certificate in Public Employment Services • Holder of Certificate of Competency (COC) in Conduct Competency Assessment under the Trainers Methodology Level I (TM I) • Must have at least 3 years supervisory level work experience in the Public Employment Services • Have assisted in the actual conduct of assessment to at least two (2) candidates. --- PDF PAGE 126 --- PUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 122 Receive and respond to workplace communication Work with others Solve/address routine problems Enhance self- management skills Support innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace Participate in workplace communication Work in team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace Lead workplace communication Lead small teams Apply critical thinking and problem solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro- small-medium enterprises (MSMEs) COMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES --- PDF PAGE 127 --- PUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 123 Perform computer operations Maintain an effective relationship with clients/customers Manage own performance Apply quality standards Establish and strengthen linkage with other organizations Supervise PESO planning activities Supervise PESO programs, activities and projects Provide continuous improvement on operations and solutions to PESO concerns Supervise PES office --- PDF PAGE 128 --- PUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 124 Glossary of Terms Action Plan A document that lists what steps must be taken in order to achieve a specific goal. The purpose of an action plan is to clarify what resources are required to reach the goal, formulate a timeline for when specific tasks need to be completed and determine what resources are required. Annual Investment Program (AIP) The annual slice of the Local Development Investment Program (LDIP) which constitute the total resource requirements for all PPAs. Annual Labor and Employment Plan The LGUs' annual key employment planning tool which outlines the intended outcomes and the strategic management of programs/ services to collectively achieve the end-goals of PESOs. Citizen’s Charter Government agencies’ respective service standards that detail the following pursuant to Republic Act No. 9485:(a) the procedure to obtain a particular service; (b) The person/s responsible for each step; (c) The maximum time to conclude the process; (d) The document/s to be presented by the customer, if necessary; (e) The amount of fees, if necessary; and (f) The procedure for filing complaints. Client Jobseekers, employers, investors, schools, students, returning OFWs, researchers, planners, policy makers. marginalized groups of workers who seek the services of PESO and other persons or organizations engaged in Employment Promotion Program. Coaching and Mentoring This refers to the provision of instruction, direction, or prompt to improve work performance. Commitment The state or quality of being dedicated to a cause, activity, etc. Communications The process of sending and receiving messages through verbal or nonverbal means, including speech, or oral communication; writing and graphical representations (such as infographics, maps, and charts); and signs, signals, and behavior. Coordination The act of arranging, putting things in order, or making things run smoothly together. Data validation A process that ensures the delivery of clean and clear data to the programs, applications and services using it. Data verification A process in which different types of data are checked for accuracy and inconsistencies after data migration is done. --- PDF PAGE 129 --- PUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 125 Delegation The assignment of any responsibility or authority to another person (normally from a manager to a subordinate) to carry out specific activities. Employment The series of activities intended to prepare job-Facilitation seekers for productive employment which includes but not limited to enhanced career assessment and guidance, life skills training, technical skills training, job matching and internship. Evaluation A totally systematic determination of a subject's merit, worth and significance, using criteria governed by a set of standards. Human Resource Development (HRD) Plan The documentation of an organization's intended learning and development interventions that will build the capabilities and competencies toward enhancing individual and organizational performance. Labor Market Information (LMI) Any information concerning the size, composition, functions, problems or opportunities of the labor market or any part thereof, including but not limited to employment-related intentions or aspirations of labor market clients. Leadership and Management Leadership is a quality of influencing people, so that the objectives are attained willingly and enthusiastically while Management is a discipline of managing things in the best possible manner. It is the art or skill of getting the work done through and with others. Linkages Relationships and interactions between tasks, functions, departments, and organizations, that promote flow of information, ideas, and integration in achievement of shared objectives. Local Executives The elected officers of the local government units (LGUs) as provided for under Book III of Republic Act No. 7160 also known as the Local Government Code of 1991 in which has direct supervision over the PESO. Monitoring Regular observation and recording of activities taking place in a project or programme. It is a process of routinely gathering information on all aspects of the project. Networking with Stakeholders Networking with stakeholders is a process that fosters the exchange of information and ideas among partners or groups that share or agreed with a common interest. It may be for social or business purposes. Office Management The technique of planning, organizing, coordinating and controlling office activities with a view to achieve business objectives and is concerned with efficient and effective performance of the office work. --- PDF PAGE 130 --- PUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 126 Organizational Development Organization development is the study of successful organizational change and performance. OD emerged from human relations studies in the 1930s, during which psychologists realized that organizational structures and processes influence worker behavior and motivation. Office / Individual Performance Commitment and Review (OPCR / IPCR) This refers to the set of targets and performance indicators to which an office or an employee is assessed and evaluated Partnership Agreement A contract between the PESO and its stakeholders (e.g. employers, schools/institutions, etc.) which sets out the terms and conditions of the partnership, including the duties and responsibilities of each partner. Person Specification A description of the qualifications, skills, experience, knowledge and other attributes (selection criteria) which a candidate must possess to perform the job duties. Planning Process of thinking about the activities required to achieve a desired goal. Policies and Guidelines Set of principles, rules, and guidelines formulated or adopted by an organization to reach its long-term goals and typically published in a booklet or other form that is widely accessible. Policy Directory The collection of an employment related course or principle of action adopted or proposed by a government, party, business, or individual. Process Cycle Time (PCT) This refers to the corresponding amount of time a given transaction is consumed. Project Development The process and the facility of employment-related planning, organizing coordinating, and controlling the resources to accomplish specific goals Proposal (Project Proposal) A document that provides all the information required for project stakeholders to decide to initiate a project Public Employment Service Office or A non-fee charging multi-employment service facilite or entity established, recognized or accredited pursuant to these Republic Act No. 8759 s. 2000 or the Public Employment Service Office Act of 1999, its amendatory act, Republic Act No. 10691 s. 2015, and their implementing rules and regulations (IRRs). --- PDF PAGE 131 --- PUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 127 Quality Standards (QS) This refers to a detail of requirements, specifications, guidelines, and characteristics to be able to meet the quality of a product, service, or process according to its purpose Relationship Management Supervision and maintenance of relationships between a company and its external partners, especially its clients. Resource A stock or supply of money, materials, staff, and other assets that can be drawn on by a person or organization in order to function effectively. Staffing The continuous process of finding, selecting evaluating and developing a working relationship with current or future employees. Stakeholders A person, group or organization that has interest or concern in an organization. Strategic Performance and Management System (SPMS) This refers to the mechanism that links employee performance with organizational performance to enhance the performance orientation of the compensation system Target setting The process of identifying something that you want to accomplish and establishing measurable goals and timeframes. Timeline The Date or period when the sequence or stages of PESO activities and events are completed (e.g. monthly, quarterly, annually). Work process Consists in a collection of interrelated (in time and/or space) activities, performed by a number of actors to accomplish a particular goal. --- PDF PAGE 132 --- PUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 128 TRAINING REGULATIONS (TR) Qualification Title: Public Employment Services NC IV Qualification Code: SOCPES419 Revision No. Document Description Types* Replaces Version (TESDA Board Resolution No./ Date) New Version (TESDA Board Resolution No./ Date) Deployment (TESDA Circular/ Implementing Guidelines) 00 Document Created Public Employment Services NC IV Not Applicable 2019-75/ Dec 17, 2019 Not Applicable Legend: *Description Types - Document Created - Document Amended --- PDF PAGE 133 --- PUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 129 The Technical Education and Skills Development Authority (TESDA) and the Department of Labor and