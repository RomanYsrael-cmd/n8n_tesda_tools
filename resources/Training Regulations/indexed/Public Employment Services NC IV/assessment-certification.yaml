  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a\npromulgated Training Regulations.\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant\nunit/s of competency.\n\n4.1.3 Recognition of Prior Learning (RPL). - Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency\nassessment.\n\n4.1.4 The following are qualified to apply for assessment and certification:\n4.1.4.1 Graduates of formal, non-formal and informal institutions on PES\nrelated training program\n4.1.4.2 Industry workers (employed, self-employed or owners/proprietors)\n Government workers engaged in training and employment\nfacilitation\n4.1.5 Conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the\npurpose\n\n--- PDF PAGE 125 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 121\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) in\nPublic Employment Services NC IV\n• Must have at least 3 years supervisory level work experience in\nthe Public Employment Services\n• With teaching/training experience in delivering educational and\ntraining programs related to Public Employment Services for at\nleast 2 years\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\nFor Industry Assessor\n• Holder of National Certificate in Public Employment Services\n• Holder of Certificate of Competency (COC) in Conduct\nCompetency Assessment under the Trainers Methodology Level\nI (TM I)\n• Must have at least 3 years supervisory level work experience in\nthe Public Employment Services\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\n--- PDF PAGE 126 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 122\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\ninnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nteam\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem\nsolving\ntechniques in\nthe workplace\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\nCOMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES\nSECTOR\n PUBLIC EMPLOYMENT SERVICES NC IV\nBASIC COMPETENCIES\n\n--- PDF PAGE 127 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 123\n\nPerform computer operations\nMaintain an effective\nrelationship with\nclients/customers\nManage own performance\nApply quality standards\n\nEstablish and strengthen\nlinkage with other\norganizations\nSupervise PESO planning\nactivities\nSupervise PESO\nprograms, activities and\nprojects\nProvide continuous\nimprovement on\noperations and solutions\nto PESO concerns\n\nSupervise PES office\nCOMMON COMPETENCIES\nCORE COMPETENCIES\n\n--- PDF PAGE 128 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 124\nGlossary of Terms\n\nAction Plan\nA document that lists what steps must be taken in order to\nachieve a specific goal. The purpose of an action plan is to\nclarify what resources are required to reach the goal, formulate\na timeline for when specific tasks need to be completed and\ndetermine what resources are required.\n\nAnnual\nInvestment\nProgram (AIP)\nThe annual slice of the Local Development Investment\nProgram (LDIP) which constitute the total resource\nrequirements for all PPAs.\n\nAnnual Labor\nand Employment\nPlan\n\nThe LGUs' annual key employment planning tool which\noutlines\nthe\nintended\noutcomes\nand\nthe\nstrategic\nmanagement of programs/ services to collectively achieve the\nend-goals of PESOs.\n\nCitizen’s\n\nCharter\n\nGovernment agencies’ respective service standards that detail\nthe following pursuant to Republic Act No. 9485:(a) the\nprocedure to obtain a particular service; (b) The person/s\nresponsible for each step; (c) The maximum time to conclude\nthe process; (d) The document/s to be presented by the\ncustomer, if necessary; (e) The amount of fees, if necessary;\nand (f) The procedure for filing complaints.\n\nClient\nJobseekers, employers, investors, schools, students,\nreturning OFWs, researchers, planners, policy makers.\nmarginalized groups of workers who seek the services of\nPESO and other persons or organizations engaged in\nEmployment Promotion Program.\n\nCoaching and\nMentoring\n\nThis refers to the provision of instruction, direction, or prompt\nto improve work performance.\n\nCommitment\n\nThe state or quality of being dedicated to a cause, activity,\netc.\nCommunications The process of sending and receiving messages through\nverbal or nonverbal means, including speech, or oral\ncommunication; writing and graphical representations (such\nas infographics, maps, and charts); and signs, signals, and\nbehavior.\n\nCoordination\nThe act of arranging, putting things in order, or making things\nrun smoothly together.\n\nData validation\nA process that ensures the delivery of clean and clear data to\nthe programs, applications and services using it.\n\nData verification\nA process in which different types of data are checked for\naccuracy and inconsistencies after data migration is done.\n\n--- PDF PAGE 129 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 125\nDelegation\nThe assignment of any responsibility or authority to another\nperson (normally from a manager to a subordinate) to carry\nout specific activities.\n\nEmployment\n\nThe series of activities intended to prepare job-Facilitation\nseekers for productive employment which includes but not\nlimited to enhanced career assessment and guidance, life\nskills training, technical skills training, job matching and\ninternship.\n\nEvaluation\nA totally systematic determination of a subject's merit, worth\nand significance, using criteria governed by a set of standards.\n\nHuman\nResource\nDevelopment\n(HRD) Plan\nThe documentation of an organization's intended learning and\ndevelopment interventions that will build the capabilities and\ncompetencies toward enhancing individual and organizational\nperformance.\n\nLabor Market\nInformation\n(LMI)\nAny information concerning the size, composition, functions,\nproblems or opportunities of the labor market or any part\nthereof, including but not limited to employment-related\nintentions or aspirations of labor market clients.\n\nLeadership and\nManagement\nLeadership is a quality of influencing people, so that the\nobjectives\nare\nattained\nwillingly\nand\nenthusiastically\nwhile Management is a discipline of managing things in the\nbest possible manner. It is the art or skill of getting the work\ndone through and with others.\n\nLinkages\nRelationships and interactions between tasks, functions,\ndepartments, and organizations, that promote flow of\ninformation, ideas, and integration in achievement of shared\nobjectives.\n\nLocal\nExecutives\nThe elected officers of the local government units (LGUs) as\nprovided for under Book III of Republic Act No. 7160 also\nknown as the Local Government Code of 1991 in which has\ndirect supervision over the PESO.\n\nMonitoring\nRegular observation and recording of activities taking place in\na project or programme. It is a process of routinely gathering\ninformation on all aspects of the project.\n\nNetworking with\nStakeholders\nNetworking with stakeholders is a process that fosters the\nexchange of information and ideas among partners or groups\nthat share or agreed with a common interest. It may be for\nsocial or business purposes.\n\nOffice\nManagement\nThe technique of planning, organizing, coordinating and\ncontrolling office activities with a view to achieve business\nobjectives and is concerned with efficient and effective\nperformance of the office work.\n\n--- PDF PAGE 130 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 126\nOrganizational\nDevelopment\nOrganization development is the study of successful\norganizational change and performance. OD emerged from\nhuman relations studies in the 1930s, during which\npsychologists realized that organizational structures and\nprocesses influence worker behavior and motivation.\n\nOffice /\nIndividual\nPerformance\nCommitment\nand Review\n(OPCR / IPCR)\n\nThis refers to the set of targets and performance indicators to\nwhich an office or an employee is assessed and evaluated\n\nPartnership\nAgreement\nA contract between the PESO and its stakeholders\n (e.g.\nemployers, schools/institutions, etc.) which sets out the terms\nand conditions of the partnership, including the duties and\nresponsibilities of each partner.\n\nPerson\nSpecification\nA description of the qualifications, skills, experience,\nknowledge and other attributes (selection criteria) which a\ncandidate must possess to perform the job duties.\n\nPlanning\nProcess of thinking about the activities required to achieve a\ndesired goal.\n\nPolicies and\nGuidelines\n\nSet of principles, rules, and guidelines formulated or adopted\nby an organization to reach its long-term goals and typically\npublished in a booklet or other form that is widely accessible.\n\nPolicy Directory\nThe collection of an employment related course or principle of\naction adopted or proposed by a government, party, business,\nor individual.\n\nProcess Cycle\nTime (PCT)\n\nThis refers to the corresponding amount of time a given\ntransaction is consumed.\n\nProject\nDevelopment\n\nThe process and the facility of employment-related planning,\norganizing coordinating, and controlling the resources to\naccomplish specific goals\nProposal\n(Project\nProposal)\n\nA document that provides all the information required for\nproject stakeholders to decide to initiate a project\n\nPublic\nEmployment\nService Office or\nPESO\nA non-fee charging multi-employment service facilite or entity\nestablished, recognized or accredited pursuant to these\nRepublic Act No. 8759 s. 2000 or the Public Employment\nService Office Act of 1999, its amendatory act, Republic Act\nNo. 10691 s. 2015, and their implementing rules and\nregulations (IRRs).\n\n--- PDF PAGE 131 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 127\nQuality\nStandards (QS)\n\nThis refers to a detail of requirements, specifications,\nguidelines, and characteristics to be able to meet the quality\nof a product, service, or process according to its purpose\n\nRelationship\nManagement\nSupervision and maintenance of relationships between a\ncompany and its external partners, especially its clients.\n\nResource\n\nA stock or supply of money, materials, staff, and other assets\nthat can be drawn on by a person or organization in order to\nfunction effectively.\n\nStaffing\n\nThe continuous process of finding, selecting evaluating and\ndeveloping a working relationship with current or future\nemployees.\n\nStakeholders\nA person, group or organization that has interest or concern in\nan organization.\n\nStrategic\nPerformance\nand\nManagement\nSystem (SPMS)\n\nThis refers to the mechanism that links employee performance\nwith organizational performance to enhance the performance\norientation of the compensation system\n\nTarget setting\nThe process of identifying something that you want to\naccomplish\nand\nestablishing\nmeasurable\ngoals\nand\ntimeframes.\n\nTimeline\n\nThe Date or period when the sequence or stages of PESO\nactivities and events are completed (e.g. monthly, quarterly,\nannually).\n\nWork process\nConsists in a collection of interrelated (in time and/or space)\nactivities, performed by a number of actors to accomplish a\nparticular goal.\n\n--- PDF PAGE 132 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 128\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nPublic Employment Services NC IV\nQualification Code:\nSOCPES419\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nPublic Employment\nServices NC IV\nNot Applicable\n2019-75/\nDec 17, 2019\nNot Applicable\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 133 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 129\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) and the\nDepartment of Labor and Employment through the JobStart Philippines Program wishes to\nextend thanks and appreciation to the many representatives of local government units and\nother government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nTechnical Working Group Experts\n1. Director Dominique Rubia-Tutay\n2. ARD Estrella U. Pahalla