  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a\npromulgated Training Regulations.\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant\nunit/s of competency.\n\n4.1.3 Recognition of Prior Learning (RPL). - Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency\nassessment.\n\n4.1.4 The following are qualified to apply for assessment and certification:\n4.1.4.1 Graduates of formal, non-formal and informal institutions on PES\nrelated training program\n4.1.4.2 Industry workers (employed, self-employed or owners/proprietors)\n Government workers engaged in training and employment\nfacilitation\n4.1.5 Conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the\npurpose\n\n--- PDF PAGE 125 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 121\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) in\nPublic Employment Services NC IV\n• Must have at least 3 years supervisory level work experience in\nthe Public Employment Services\n• With teaching/training experience in delivering educational and\ntraining programs related to Public Employment Services for at\nleast 2 years\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\nFor Industry Assessor\n• Holder of National Certificate in Public Employment Services\n• Holder of Certificate of Competency (COC) in Conduct\nCompetency Assessment under the Trainers Methodology Level\nI (TM I)\n• Must have at least 3 years supervisory level work experience in\nthe Public Employment Services\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) 