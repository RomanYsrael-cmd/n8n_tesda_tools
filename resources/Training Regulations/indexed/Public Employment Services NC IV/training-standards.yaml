      "source_text": "3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based\nTVET.\n\na.\nCourse design is based on competency standards set by the\nindustry or recognized industry sector; (Learning system is\ndriven by competencies written to industry standards)\n\nb.\nTraining\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized\nand\nself-paced\nlearning\nstrategies;\n\nc.\nTraining can be done on an actual workplace setting,\nsimulation of a workplace and/or through adoption of modern\ntechnology.\n\nd.\nAssessment is based in the collection of evidence of the\nperformance of work to the industry required standards;\n\ne.\nAssessment of competency takes the trainee’s knowledge\nand attitude into account but requires evidence of actual\nperformance of the competency as the primary source of\nevidence.\n\nf.\nTraining program allows for recognition of prior learning (RPL)\nor current competencies;\n\ng.\nTraining completion is based on satisfactory performance of\nall specified competencies.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on- and off-the-job as long as the learning is\ndriven by the competency standards specified by the industry. The\nfollowing training modalities and their variations/components may be\nadopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 School/Institution-Based\n\n•\nDual Training System (DTS) / Dualized Training Program\n(DTP) which contain both in-school and in-industry\ntraining or fieldwork components.\n\n•\nSupervised Industry Training (SIT) or on-the-job training\n(OJT) is an approach in training designed to enhance the\nknowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It\nis imperative that the deployment of trainees in the\nworkplace is adhered to training programs and agreed by\nthe institution and enterprise and status and progress of\n\n--- PDF PAGE 120 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 116\ntrainees are closely monitored by the training institutions\nto prevent opportunity for work exploitation.\n\n•\nProject-based instruction is an authentic instructional\nmodel or strategy in which students plan, implement and\nevaluate projects that have real world applications.\n\n2.2 Enterprised-Based:\n\nEnterprised-based training may also be taken to mean a\nschool or training center with one or more partner\nenterprise or an enterprise or group of enterprises setting\nup a common training facility or partnering with a school\nor training center.\n\n•\nEnterprised-based training – where training is\nimplemented within the company in accordance with the\nrequirements of the specific company.\n\n•\nFormal Apprenticeship – Training within employment\ninvolving a contract between an apprentice and an\nenterprise on an approved apprenticeable occupation.\n\n•\nInformal Apprenticeship – is based on training (and\nworking) agreement between an apprentice and an\nexperienced PESO Manager wherein the agreement\nmay be written or oral. The experienced PESO Manager\ncommits to training the apprentice in all the skills relevant\nto his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the\nbusiness. Training is integrated into the production\nprocess and apprentices learn by working alongside the\nexperienced PESO Manager.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP)."
    },
