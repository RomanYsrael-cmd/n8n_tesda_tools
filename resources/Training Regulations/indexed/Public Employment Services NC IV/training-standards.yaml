\n• Presentation\n2 Hours\n7. Lead in\nimprovement of\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n7.1 Assess\nOccupational\nSafety and\nHealth (OSH)\npractices and\nprograms\n• Case Study in evaluating\ncurrent OSH programs\neffectiveness\n• Practice auditing the\nworkplace\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n2 hours\n\n--- PDF PAGE 91 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 87\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n7.2 Recommend\nOSH program\n improvement\n initiatives\n• Writing and Presenting\nAction Plans to improve\nOSH compliance in the\nworkplace and/or increase\neffectiveness of OSH\nPrograms\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n•\nPortfolio\n3 hours\n\n7.3 Implement\nrecommended\nimprovements\non Occupational\nSafety and\nHealth (OSH)\nPrograms,\nProcedures and\nPolicies\n• Role play in increasing the\nOSH awareness\n• Measuring the impact of the\nnew OHS program or\ninitiative\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n• Group Project\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n2\nhours\n8. Lead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\n8.1 Assess\nenvironmental\nwork practices\nand programs\n• Discussion of Green\nstructural change and\nretraining needs\n-\nWhat is green structural\nchange and where is it\nhappening\n-\nWorkforce restructuring\nand adjustment\n-\nEmployment effects of\nEnvironment\n-\nSectors most affected\nby green restructuring\n-\nRetraining and skills\nupgrading\n-\nEffective and equitable\nrestructuring: Good\npractices and programs\nby public and private\nsector actors\