y competencies written to industry standards)\n\nb.\nTraining\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized\nand\nself-paced\nlearning\nstrategies;\n\nc.\nTraining can be done on an actual workplace setting,\nsimulation of a workplace and/or through adoption of modern\ntechnology.\n\nd.\nAssessment is based in the collection of evidence of the\nperformance of work to the industry required standards;\n\ne.\nAssessment of competency takes the trainee’s knowledge\nand attitude into account but requires evidence of actual\nperformance of the competency as the primary source of\nevidence.\n\nf.\nTraining program allows for recognition of prior learning (RPL)\nor current competencies;\n\ng.\nTraining completion is based on satisfactory performance of\nall specified competencies.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on- and off-the-job as long as the learning is\ndriven by the competency standards specified by the industry. The\nfollowing training modalities and their variations/components may be\nadopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 School/Institution-Based\n\n•\nDual Training System (DTS) / Dualized Training Program\n(DTP) which contain both in-school and in-industry\ntraining or fieldwork components.\n\n•\nSupervised Industry Training (SIT) or on-the-job training\n(OJT) is an approach in training designed to enhance the\nknowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It\nis imperative that the deployment of trainees in the\nworkplace is adhered to training programs and agreed by\nthe institution and enterprise and status and progress of\n\n--- PDF PAGE 120 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 116\ntrainees are closely monitored by the training institutions\nto prevent opportunity for work exploitation.\n\n•\nProject-based instruction is an authentic instructional\nmodel or strategy in which students plan, implement and\nevaluate projects that have real world applications.\n\n2.2 Enterprised-Based:\n\nEnterprised-based training may also be taken to mean a\nschool or training center with one or more partner\nenterprise or an enterprise or group of enterprises setting\nup a common training facility or partnering with a school\nor training center.\n\n•\nEnterprised-based training – where training is\nimplemented within the company in accordance with the\nrequirements of the specific company.\n\n•\nFormal Apprenticeship – Training within employment\ninvolving a contract between an apprentice and an\nenterprise on an approved apprenticeable occupation.\n\n•\nInformal Apprenticeship – is based on training (and\nworking) agreement between an apprentice and an\nexperienced PESO Manager wherein the agreement\nmay be written or oral. The experienced PESO Manager\ncommits to training the apprentice in all the skills relevant\nto his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the\nbusiness. Training is integrated into the production\nprocess and apprentices learn by working alongside the\nexperienced PESO Manager.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wants to enroll in this course should\npossess the following requirements:\n\n• Must have completed at least 2 years of college education and/or\nwith 2 years of work-related experience\n• Must possess good communication skills\n\n--- PDF PAGE 121 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 117\n3.4 TOOLS, MATERIALS AND EQUIPMENT:\nPUBLIC EMPLOYMENT SERVICES NC IV\n\nRecommended list of instruments, equipment and materials for the training of 25\ntrainees for PUBLIC EMPLOYMENT SERVICES NC IV are as follows:\n\nTools\n\nQTY. UNIT\nSPECIFICATION/DESCRIPTION\n25\nsets\nImplementing Rules and Regulations (RA 10691)\n6\nsets\nPESO Manual\n6\nsets\nAnnual Labor and Employment Plan\n2\nsets\nMicrosoft Office\n6\nsets\nHuman Resource Development Plan\n6\nsets\nProject Procurement and Management Plan\n(PPMP)\n6\nsets\nLGU Requirements\n6\nsets\nRegistration forms\n6\nsets\nDocumentary requirements\n6\nsets\nRelated legal documents\n6\nsets\nJob vacancy advertisement\n6\nsets\nEmployment related forms\n25\nsets\nImplementing Rules and Regulations (RA 10691)\n5\npcs.\nScissors\n5\npcs.\nStapler\n5\npcs.\nStopwatch\n5\npcs.\nClipboard\n5\npcs.\nCalculator\n\nMaterials\n\nQTY. UNIT\nSPECIFICATION/DESCRIPTION\n1\nset\nTelephone Directory\n3\nreams\nBond Paper\n3\nboxes\nPaper clips\n2\nboxes\nStaple wires\n1\nream\nNSRP Forms\n25\npcs\nCartolina\n3\npcs\nPermanent Marker\n3\npcs\nWhiteboard Marker\n25\npcs\nBallpens\n25\npcs\nManila Paper\n1\npack\nMetacards\n25\npcs.\nFolder\n25\npcs.\nEnvelopes\n1\npc.\nCalendar\n\n--- PDF PAGE 122 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 118\nEquipment\n\nQTY. UNIT\nSPECIFICATION/DESCRIPTION\n1\nunit\nConference Table\n10\nunits\nOffice Chair\n3\nunits\nExecutive Chair\n3\nunits\nManager’s Desk\n3\nunits\nOffice Table\n5\nunits\nComputer with internet connection\n1\nunit\nFiling Cabinet\n1\nunit\nAirconditioner\n1\nunit\nLCD projector with widescreen\n1\nunit\nPrinter with scanner\n1\nunit\nPhotocopying machine\n2\nunits\nMobile phone\n1\nunit\nTelephone\n1\nunit\nFax machine\n1\nunit\nDigital camera\n1\nunit\nVideo camera\n1\nunit\nMicrophone\n1\nunit\nSound system\n1\nunit\nMegaphone\n5\nsets\nFirst aid kit\n2\nunits\nHeavy duty Stapler\n1\nunit\n3 x 6 whiteboard\n1\nunit\n42 inches Smart Television\n\n--- PDF PAGE 123 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 119\n3.5 TRAINING FACILITIES\nPublic Employment Services NC IV\n\nThe Public Employment Services Learning Facility must be of concrete\nstructure. Based on class size of 25 students / trainees the space requirements for\nthe teaching / learning and curriculum areas are as follows.\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN\nS.\nMETERS\nTOTAL AREA IN SQ.\nMETERS\nStudent/Trainee Performance\nSpace (S/TPS)\n6X 6\n36\n36\nLearning Resource Center (LRC)\n3 X 5\n15\n15\nCirculation Area\n\n21\n21\nSeparate Restrooms for Male and\nFemale Trainees/Students\n2 X 5\n10\n10\nTotal Workshop Area\n\n82 sq. m.\n\n3.5 TRAINER’S QUALIFICATION\n\n➢ Must be a holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nPublic Employment Services NC IV\n➢ Must be a college graduate of any course\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 124 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 120"
