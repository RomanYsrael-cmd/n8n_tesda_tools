  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education\nand training (TVET) providers with information and other important\nrequirements to consider when designing training programs for PUBLIC\nEMPLOYMENT SERVICES NC IV.\n\nThey include information on curriculum design; training delivery;\ntrainee entry requirements; tools and equipment; training facilities; and\ntrainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of\ncompetency-based curricula to enable training providers develop their\nown curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and\ncore units of competency specifically in the areas of mathematics,\nscience/technology, communication/language and other academic\nsubjects shall be contextualized. To this end, TVET providers shall\ndevelop a Contextual Learning Matrix (CLM) to include MLC- 2006,\ngreen technology, issues on health and drugs and cater person with\ndisabilities (PWD’s).\n\nCourse Title: PUBLIC EMPLOYMENT SERVICES\nNC Level:\n NC IV\n\nNominal Training Duration:\n47 Hours Basic Competencies\n37 Hours Common Competencies\n 785 Hours Core Competencies\n 224 Hours SIL\nTotal:\n 1093 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge,\npractical skills and attitude, applicable in establishing and strengthening\nlinkages with other organizations, supervising PESO planning activities,\nsupervising PESO programs, activities and projects, providing continuous\nimprovement on operations and solutions to PESO concerns, and supervising\nPES office. This include classroom learning activities and practical work in\nactual work site or simulation area.\nUpon completion of the course, the learners are expected to\ndemonstrate the above-mentioned competencies to be employed. To obtain\nthis, all units prescribed for this qualification must be achieve.\n\n--- PDF PAGE 79 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 75\nBASIC COMPETENCIES\n(47 Hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n\n•\nRead\n➢ Communication process\n➢ Dynamics of groups and\ndifferent styles of group\nleadership\n•\nIdentify different\napproaches to meet the\nneeds of clients and\ncolleagues\n• Lecture\n•\nWritten\nexamination\n1 hour\n1.2. Contribute to\nthe\ndevelopment of\ncommunication\nstrategies\n•\nApply communication skills\nto fulfill job roles as\nspecified by the\norganization\n•\nApply communication\ntechniques in\ncommunicating with clients\nand colleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role boundaries setting\n➢ Negotiation\n➢ Establishing empathy\n•\nDescribe strategies for\ninternal and external\ndissemination of\ninformation\n• Demonstration\n• Group\ndiscussion\n• Observation\n• Oral evaluation\n1 hour\n\n--- PDF PAGE 80 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 76\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.3. Deliver a\ntechnical\npresentation\n• Enhance the presentation\nusing appropriate media\n• Deliver a clear and sequential\npresentation within given time\n• Demonstration\n• Observation\n1 hour\n\n1.4 Represent the\norganization\n\n• Describe criteria for a good\npresentation\n• Prepare presentation\nmaterial for internal or\nexternal forums to promote\nthe organization\n• Demonstration\n• Observation\n1 hour\n1.5 Facilitate group\ndiscussion\n• Gather relevant information\n• Apply values in facilitating\ndifferences in views\n• Demonstration\n• Observation\n1 hour\n1.6 Conduct\ninterview\n• Describe communication\nstrategies employed in\ninterview situations\n• Conduct interview\n• Apply organizations\nprocedure in maintaining\nrecords of interviews\n• Use questioning, listening\nand nonverbal\ncommunication techniques\nto client groups\n• Group\ndiscussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 hour\n\n--- PDF PAGE 81 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 77\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2. Develop and\nlead teams\n2.1 Foster\nindividual\ngrowth\n\n• Discussion on Team\nLeadership and expectation\nfrom team leaders\n• Case study on learning and\ndevelopment needs of team\nmembers\n• Discussion on organizational\nrequirements from team\nmembers\n• Role play on coaching and\nmentoring\n• Discussion on preparation of\nteam members development\nplan\n• Role Play on providing\nfeedback on performance\n• Observation\nLecture/\nDiscussion\n• Case Study\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 hours\n2.2 Foster individual\nand team growth\n• Discussion on learning and\ndevelopment program goal\nsetting\n• Preparation of learning and\ndevelopment program goals\n• Discussion on learning\ndelivery methods\n• Role play on the different\nlearning delivery methods\n• Discussion on workplace\nlearning opportunities\n• Role play on coaching and\nmentoring\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n--- PDF PAGE 82 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 78\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Monitor and\nevaluate\nworkplace\nlearning\n• Discussion on the different\nlevels of learning evaluation\n• Discussion on the different\nmethods used to evaluate\nlearning\n• Develop reporting system for\nmonitoring of performance\nattributed to learning\nprograms\n• Gathering of information to\nevaluate individual\nperformance attributed to\nlearning programs\n• Case study on modification\nof learning plan based on\nperformance\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n2.4 Develop team\ncommitment\nand cooperation\n• Discussion on team\ncommitment and cooperation\nand its impact to attainment\nof goals\n• Play games on team\ncommitment and cooperation\n• Discussion on team\ndynamics and its relation to\nteam performance\n• Play games on team\ndynamics and performance\n• Development of career plans\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n--- PDF PAGE 83 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 79\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.5 Facilitate\naccomplishment\nof team goals\n• Perform team building\nactivities towards improving\ncommunication among team\nmembers, goal setting and\nimproving performance\n• Case studies involving\ncollaborative activities to\nimprove attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 hour\n3. Perform higher-\norder thinking\nprocesses and\napply techniques\nin the workplace\n3.1 Evaluate\neffectiveness\nand efficiency of\nthe workplace\nsystems,\nprocesses and\nprocedures\n• Examine current systems,\nstandards, procedures and\nprotocols in the workplace\n• Discuss different methods\nof critical and appreciative\ninquiry and their relevance\nto different situations\n• Form habit of asking\nquestions and taking\nresponsibility for answers\n• Appreciate importance of\nwhy questions for\nindividuals, businesses and\ncommunities\n• Use range of analytical\ntechniques\n• Examine different strategies\nand techniques in\ncommunicating results,\napplying critical thinking\npathway, assessing\neffectiveness and efficiency\nof systems, processes and\nprocedures\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 84 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 80\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit\nof critical inquiry\nand curiosity in\nthe workplace\n• Discuss different methods of\ncritical and appreciative\ninquiry and their relevance\nto different situations\n• Form habit of asking\nquestions and taking\nresponsibility for answers\n• Appreciate importance of\nwhy questions for\nindividuals, businesses and\ncommunities\n• Use range of analytical\ntechniques, growth mindset\nand positive communication\nstrategies\n• Examine different strategies\nand techniques in\ncommunicating results,\napplying critical thinking\npathway, assessing\neffectiveness and efficiency\nof systems, processes and\nprocedures\n• Discuss insights on\nworkplace effectiveness and\nefficiency\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n--- PDF PAGE 85 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 81\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.3 Develop\npractical action\nplans for\nimproving\nworkplace\nconditions\n• Use range of analytical\ntechniques, growth mindset\nand positive communication\nstrategies in developing\naction plans for efficiency\nand effectiveness\n• Examine different strategies\nand techniques in\ncommunicating results,\napplying critical thinking\npathway, assessing\neffectiveness and efficiency\nof systems, processes and\nprocedures\n• Discuss concepts creative\nnegotiation skills, change\nmanagement and\nimprovement strategies\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n• Project-based\nlearning\n2 hours\n\n--- PDF PAGE 86 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 82\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to the\npractice of social\njustice in the\nworkplace\n\n4.1 Update self on\nlocal, national\nand global\ntrends/ issues in\nthe workplace\n• Explain the local, national\nand global systems and\nstructures\n• Discuss issues affecting\ninteraction and\nconnectedness of\ncommunities at local,\nnational and global levels\n• Explain underlying\nassumptions and power\ndynamics (politics,\nunderstanding political\nsystem, social structures,\nlabor laws, labor relations,\nhuman right)\n• Monitor trends and issues\nrelevant to human rights,\ngender equality, culture of\npeace, global citizenship,\nand cultural diversity using\ndifferent media platforms\n• Analyze trends and issues\nrelevant to human rights,\ngender equality, culture of\npeace, global citizenship,\nand cultural diversity\n• Engage in discourse about\nthe local, national and global\nissues\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n\n4.2 Relate local and\nglobal trends to\nworkplace\ncontext\n• Discuss the different levels of\nhuman identity according to\nAmber Mayer (2015)\n• Explain different\ncommunities people belong\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\n1 hour\n\n--- PDF PAGE 87 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 83\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\nto and how these are\nconnected\n• Recognize cultural\ndifferences and respect for\ncultural diversity\n• Recognize differences and\ncommonalities among\npeople\n• Demonstrate attitudes of\nempathy, solidarity and\nrespect for diversity\n• Connect local issues to\nglobal trends, and vice\nversa.\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n\n4.3 Engage and take\nactions on\nworkplace\nissues and\nconcerns\n• Identify the actions that can\nbe taken individually and\ncollectively\n• Describe ethically\nresponsible behaviour\n• Explain the importance and\nbenefits of civic\nengagement\n• Employ appropriate actions\nto address workplace issues\ninvolving national and global\ntrends\n• Show concern and\nwillingness to take part in\nthe development efforts to\ndiscuss workplace issues\nand concerns\n• Apply the attitude of\n“thinking globally and acting\nlocally” in the workplace\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n\n--- PDF PAGE 88 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 84\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n5. Manage\ninnovative work\ninstructions\n5.1 Review and\nanalyze\nexisting\nworkplace\npractices\n• Show mastery of basic\nmanagement concepts\naccording to Gallup, nine\ndimensions of innovative\npractices and climate; and\ndifferent types of innovation\n• Contextualize innovation to\ndifferent variables in the\norganization\n• Review current\norganizational practices\nwhere innovation is\ncontextualized\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n\n5.2 Examine\nopportunities for\ncontinuous\nimprovement\nand innovation\nof practices in\nthe workplace\n\n• Show mastery of the\ndeterminants of innovative\nbehaviors and principles of\ninnovation\n• Review current\norganizational practices\nwhere innovation is\ncontextualized\n• Evaluate innovative\npractices in the organization\n• Assess innovative behaviors\nfor promoting innovation and\nlearning in the workplace\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n1 hour\n\n--- PDF PAGE 89 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 85\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.3 Implement\ninnovative ways\nin the conduct of\nusual workplace\npractices\n\n• Show mastery of the\ndeterminants of innovative\nbehaviors, principles of\ninnovation; and dimensions\nof innovation climate and\nstrategies and techniques\nfor implementing innovation\nin the workplace\n• Evaluate impact of\ninnovative practices in the\norganization\n• Demonstrate skills in\nmanaging changes in the\nworkplace\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\n