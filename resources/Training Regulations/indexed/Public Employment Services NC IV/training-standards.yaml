    "source_text": "3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of\ncompetency-based curricula to enable training providers develop their\nown curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and\ncore units of competency specifically in the areas of mathematics,\nscience/technology, communication/language and other academic\nsubjects shall be contextualized. To this end, TVET providers shall\ndevelop a Contextual Learning Matrix (CLM) to include MLC- 2006,\ngreen technology, issues on health and drugs and cater person with\ndisabilities (PWD’s).\n\nCourse Title: PUBLIC EMPLOYMENT SERVICES\nNC Level:\n NC IV\n\nNominal Training Duration:\n47 Hours Basic Competencies\n37 Hours Common Competencies\n 785 Hours Core Competencies\n 224 Hours SIL\nTotal:\n 1093 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge,\npractical skills and attitude, applicable in establishing and strengthening\nlinkages with other organizations, supervising PESO planning activities,\nsupervising PESO programs, activities and projects, providing continuous\nimprovement on operations and solutions to PESO concerns, and supervising\nPES office. This include classroom learning activities and practical work in\nactual work site or simulation area.\nUpon completion of the course, the learners are expected to\ndemonstrate the above-mentioned competencies to be employed. To obtain\nthis, all units prescribed for this qualification must be achieve.\n\n--- PDF PAGE 79 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 75\nBASIC COMPETENCIES\n(47 Hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n\n•\nRead\n➢ Communication process\n➢ Dynamics of groups and\ndifferent styles of group\nleadership\n•\nIdentify different\napproaches to meet the\nneeds of clients and\ncolleagues\n• Lecture\n•\nWritten\nexamination\n1 hour\n1.2. Contribute to\nthe\ndevelopment of\ncommunication\nstrategies\n•\nApply communication skills\nto fulfill job roles as\nspecified by the\norganization\n•\nApply communication\ntechniques in\ncommunicating with clients\nand colleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role boundaries setting\n➢ Negotiation\n➢ Establishing empathy\n•\nDescribe strategies for\ninternal and external\ndissemination of\ninformation\n• Demonstration\n• Group\ndiscussion\n• Observation\n• Oral evaluation\n1 hour\n\n--- PDF PAGE 80 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 76\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.3. Deliver a\ntechnical\npresentation\n• Enhance the presentation\nusing appropriate media\n• Deliver a clear and sequential\npresentation within given time\n• Demonstration\n• Observation\n1 hour\n\n1.4 Represent the\norganization\n\n• Describe criteria for a good\npresentation\n• Prepare presentation\nmaterial for internal or\nexternal forums to promote\nthe organization\n• Demonstration\n• Observation\n1 hour\n1.5 Facilitate group\ndiscussion\n• Gather relevant information\n• Apply values in facilitating\ndifferences in views\n• Demonstration\n• Observation\n1 hour\n1.6 Conduct\ninterview\n• Describe communication\nstrategies employed in\ninterview situations\n• Conduct interview\n• Apply organizations\nprocedure in maintaining\nrecords of interviews\n• Use questioning, listening\nand nonverbal\ncommunication techniques\nto client groups\n• Group\ndiscussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 hour\n\n--- PDF PAGE 81 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 77\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2. Develop and\nlead teams\n2.1 Foster\nindividual\ngrowth\n\n• Discussion on Team\nLeadership and expectation\nfrom team leaders\n• Case study on learning and\ndevelopment needs of team\nmembers\n• Discussion on organizational\nrequirements from team\nmembers\n• Role play on coaching and\nmentoring\n• Discussion on preparation of\nteam members development\nplan\n• Role Play on providing\nfeedback on performance\n• Observation\nLecture/\nDiscussion\n• Case Study\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 hours\n2.2 Foster individual\nand team growth\n• Discussion on learning and\ndevelopment program goal\nsetting\n• Preparation of learning and\ndevelopment program goals\n• Discussion on learning\ndelivery methods\n• Role play on the different\nlearning delivery methods\n• Discussion on workplace\nlearning opportunities\n• Role play on coaching and\nmentoring\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n--- PDF PAGE 82 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 78\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Monitor and\nevaluate\nworkplace\nlearning\n• Discussion on the different\nlevels of learning evaluation\n• Discussion on the different\nmethods used to evaluate\nlearning\n• Develop reporting system for\nmonitoring of performance\nattributed to learning\nprograms\n• Gathering of information to\nevaluate individual\nperformance attributed to\nlearning programs\n• Case study on modification\nof learning plan based on\nperformance\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n2.4 Develop team\ncommitment\nand cooperation\n• Discussion on team\ncommitment and cooperation\nand its impact to attainment\nof goals\n• Play games on team\ncommitment and cooperation\n• Discussion on team\ndynamics and its relation to\nteam performance\n• Play games on team\ndynamics and performance\n• Development of career plans\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n--- PDF PAGE 83 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 79\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.5 Facilitate\naccomplishment\nof team goals\n• Perform team building\nactivities towards improving\ncommunication among team\nmembers, goal setting and\nimproving performance\n• Case studies involving\ncollaborative activities to\nimprove attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 hour\n3. Perform higher-\norder thinking\nprocesses and\napply techniques\nin the workplace\n3.1 Evaluate\neffectiveness\nand efficiency of\nthe workplace\nsystems,\nprocesses and\nprocedures\n• Examine current systems,\nstandards, procedures and\nprotocols in the workplace\n• Discuss different methods\nof critical and appreciative\ninquiry and their relevance\nto different situations\n• Form habit of asking\nquestions and taking\nresponsibility for answers\n• Appreciate importance of\nwhy questions for\nindividuals, businesses and\ncommunities\n• Use range of analytical\ntechniques\n• Examine different strategies\nand techniques in\ncommunicating results,\napplying critical thinking\npathway, assessing\neffectiveness and efficiency\nof systems, processes and\nprocedures\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 84 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 80\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit\nof critical inquiry\nand curiosity in\nthe workplace\n• Discuss different methods of\ncritical and appreciative\ninquiry and their relevance\nto different situations\n• Form habit of asking\nquestions and taking\nresponsibility for answers\n• Appreciate importance of\nwhy questions for\nindividuals, businesses and\ncommunities\n• Use range of analytical\ntechniques, growth mindset\nand positive communication\nstrategies\n• Examine different strategies\nand techniques in\ncommunicating results,\napplying critical thinking\npathway, assessing\neffectiveness and efficiency\nof systems, processes and\nprocedures\n• Discuss insights on\nworkplace effectiveness and\nefficiency\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n--- PDF PAGE 85 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 81\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.3 Develop\npractical action\nplans for\nimproving\nworkplace\nconditions\n• Use range of analytical\ntechniques, growth mindset\nand positive communication\nstrategies in developing\naction plans for efficiency\nand effectiveness\n• Examine different strategies\nand techniques in\ncommunicating results,\napplying critical thinking\npathway, assessing\neffectiveness and efficiency\nof systems, processes and\nprocedures\n• Discuss concepts creative\nnegotiation skills, change\nmanagement and\nimprovement strategies\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n• Project-based\nlearning\n2 hours\n\n--- PDF PAGE 86 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 82\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to the\npractice of social\njustice in the\nworkpl