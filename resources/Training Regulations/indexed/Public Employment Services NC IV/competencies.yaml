) PROGRAMS, POLICIES AND PROCEDURES\n\nUNIT CODE\n:\n500311407\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\n\nassess Occupational Safety and Health (OSH) practices and\n\nprograms, recommend OSH program improvement initiatives, and\n\nimplement recommended improvements on Occupational Safety\n\nand Health (OSH) Programs, Procedures and Policies\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1.\nAssess\nOccupational\nSafety and\nHealth (OSH)\npractices and\nprograms\n1.1 OSH practices and\nprograms are\nreviewed based on\nworkplace policies\nand procedures\n1.2 Appropriate personnel\nor OSH reference\nguides are consulted\nfor proper guidance\nbased on workplace\npolicies and\nprocedures\n1.3 Current practices and\nprograms are\nevaluated based on\nacceptable level of\nOSH work standards\n1.1. OSH practices\nand programs\nworkplace\npolicies and\nprocedures\n1.2. OSH reference\nguides\n1.3. OSH work\nstandards\n1.1. Critical thinking\nskills\n1.2. Evaluating skills\n2. Recommend OSH\nprogram\nimprovement\ninitiatives\n2.1 OSH work\nimprovement\ninitiatives are\nidentified that are\nrelevant with the\nworkplace scenario\n2.2 OSH program\nimprovement plans\nare organized based\non workplace policies\nand procedures\n2.3 OSH program\nimprovement plans\nare presented based\non workplace policies\nand procedures\n\n2.1. OSH Programs\n2.2. OSH work\nimprovement\ninitiatives\n2.1. Presentation Skills\n2.2. Communication\nskills\n2.3. Collaborating skills\n2.4. Critical thinking\nskills\n2.5. Observation skills\n\n--- PDF PAGE 34 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 30\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Implement\nrecommended\nimprovements on\nOccupational\nSafety and Health\n(OSH) Programs,\nProcedures and\n