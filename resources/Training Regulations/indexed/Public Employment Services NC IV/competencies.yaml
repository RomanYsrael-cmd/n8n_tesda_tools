        "source_text": "SOC323202\n UNIT DESCRIPTOR\n\n :\nThis unit covers the knowledge, skills and attitudes\n\nin effectively managing own workload and quality\n\nof work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan for\ncompletion of\nown workload\n\n1.1 Tasks accurately\nidentified.\n1.2 Priority allocated to each\ntask.\n1.3 Time lines allocated to\neach task or series of\ntasks.\n1.4 Tasks deadlines known\nand complied with\nwhenever possible.\n1.5 Work schedules are\nknown and completed\nwith agreed time frames.\n1.6 Work plans developed\naccording to assignment\nrequirements and\nemployer policy.\n1.7 Uncompleted work or\ntasks detailed and\nresponsibility for\ncompletion passed to\nincoming shift or other\nappropriate persons.\n1.1 Site and\nassignment\nrequirements\n1.2 Employer policy on\nperformance\nmanagement\n1.3 Indicators of\nappropriate\nperformance for\neach area of\nresponsibility\n1.4 Steps for\nimproving or\nmaintaining\nperformance\n1.5 Work schedules\n1.6 Work plans\n\n1.1 Capacity to plan\nand prioritize\nworkloads and\nrequirements\n1.2 Time and task\nmanagement\n1.3 Self-evaluation and\nmonitoring skills\n\n2. Maintain\nquality of\nperformance\n2.1 Personal performance\ncontinually monitored\nagainst agreed\nperformance standards.\n2.2 Advice and guidance\nsought when necessary\nto achieve or maintain\nagreed standards.\n2.3 Guidance from\nmanagement applied to\nachieve or maintain\nagreed standards.\n2.4 Standard of work clarified\nand agreed according to\nemployer policy and\nprocedures.\n2.1 Site and\nassignment\nrequirements\n2.2 Employer policy on\nperformance\nmanagement\n2.3 Indicators of\nappropriate\nperformance for\neach area of\nresponsibility\n2.4 Steps for improving\nor maintaining\nperformance\n2.5 Work schedules\n2.6 Work plans\n2.7 Performance\nstandards\n2.1 Capacity to plan\nand prioritize\nworkloads and\nrequirements\n2.2 Time and task\nmanagement\n2.3 Self-evaluation and\nmonitoring skills\n\n3. Build\ncredibility with\ncustomers/\nclients\n3.1\nClient expectations for\nreliability, punctuality\nand appearance\nadhered to.\n\n3.1 Site and\nassignment\nrequirements\n3.2 Employer policy on\nperformance\nmanagement\n3.1 Capacity to plan\nand prioritize\nworkloads and\nrequirements\n3.2 Time and task\nmanagement\n\n--- PDF PAGE 55 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 51\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2\nPossible causes of\nclient/customer\ndissatisfaction\nidentified, dealt with\nrecorded according to\nemployer policy.\n3.3\nClient fully informed of\nall relevant security\nmatters in a timely\nmanner.\n\n3.3 Indicators of\nappropriate\nperformance for\neach area of\nresponsibility\n3.4 Steps for improving\nor maintaining\nperformance\n3.5 Work schedules\n3.6 Work plans\n3.7 Performance\nstandards\n\n3.3 Self-evaluation and\nmonitoring skills\n\n RANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Tasks\n\n1.1\nMay be identified through:\n1.1.1 Assignment Instructions\n1.1.2 Verbal Instructions by Senior Staff/household\nmembers\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self-Assessment\n1.2\nMay be:\n1.2.1\nDaily tasks\n1.2.2\nWeekly tasks\n1.2.3\nRegularly or irregularly occurring tasks\n\n2. Performance Standards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 56 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 52\nEVIDENCE GUIDE\n1. Critical Aspects of competency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through\nobservation and discussion of site and\nemployer requirements\n1.3\nDemonstrated capacity to complete task\nwithin specified time frame\n1.4\nMaintained quality of own performance\n\n2. Resource Implications\nThe following resources should be provided:\n2.1\nAssessment Centers/Venues\n2.2\nAccredited Assessors\n2.3\nModes of Assessment\n2.4\nEvaluation Reports\n2.5\nAccess to relevant venue, equipment and\nmaterials\n2.6\nAssignment Instructions\n2.7\nLogbooks\n2.8\nOperational manuals and\nmakers’/customers’ instructions\nAssessment Instruments, including personal\nplanner and assessment record book\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Demonstration\n3.3 Observation\nQuestioning\n4. Context of Assessment\nCompetency may be assessed in the workplace or\nin a simulated work setting.\n\n--- PDF PAGE 57 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 53\nUNIT OF COMPETENCY\n: APPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
