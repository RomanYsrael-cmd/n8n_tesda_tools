        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated effective communication skills with clients\naccessing service and work colleagues\n1.2 Adopted relevant communication techniques and\nstrategies to meet client particular needs and difficulties\n2. Resource\nImplications\n2.1 Access to appropriate workplace where assessment can\ntake place\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Case Study\n3.2 Interview\n3.3 Portfolio\n3.4 Written Test\n3.5 Role Play\n4. Context for\nAssessment\n4.1 This unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 12 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 8\nUNIT OF COMPETENCY :\nDEVELOP AND LEAD TEAMS\n\nUNIT CODE\n:"
        },
        "source_text": "500311401\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to use\nspecialized communication skills to meet specific needs of internal and\ninternal clients, conduct interviews, facilitate discussion with groups,\nand contribute to the development of communication strategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common and\nspecific communication\nneeds of clients and\ncolleagues\n1.1 Specific\ncommunication\nneeds of clients\nand colleagues\nare identified\nand met\n1.2 Different\napproaches are\nused to meet\ncommunication\nneeds of clients\nand colleagues\n1.3 Conflict is\naddressed\npromptly in a\nmanner which\ndoes not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n1.3 Communication\nskills relevant to\nclient groups\n1.4 Flexibility in\ncommunication\n\n1.1 Full range of\ncommunication\ntechniques\nincluding:\n1.1.1 Effective\ncommunication\nprocess\n1.1.2 Active listening\n1.1.3 Giving/ receiving\nfeedback\n1.1.4 Interpretation of\ninformation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.1.8 Conduct seminars\n1.1.9 Public speaking\n1.2 Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n--- PDF PAGE 7 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for internal\nand external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work