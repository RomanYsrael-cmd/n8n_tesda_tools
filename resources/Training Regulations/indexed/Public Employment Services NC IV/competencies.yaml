        "source_text": "SOC341306\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, and attitude, required to\nsupervise PES office, and defines the standard required to\nsupervise office resources and personnel.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Sustain\neffective office\nadministration\n\n1.1. Annual budget is\nevaluated in\naccordance with\nbudget preparation\nguidelines.\n1.2. Annual Procurement\nPlan is evaluated in\naccordance with\nexisting guidelines.\n1.3. Procurement,\nUtilization, and\nInventory are\nsupervised in\naccordance with\nexisting guidelines.\n1.4. Effective and efficient\nmanagement/utilization\nof resources is\nmaximized in\naccordance with\nexisting guidelines.\n1.1 Annual\nProcurement Plan\n1.2 Procurement Law\n1.3 Budget\nPreparation\nGuidelines\n1.4 Inventory\nProcedures\n1.5 Austerity\nMeasures\n1.6 Sort, Systematize,\nSweep,\nStandardize,\nSafety, Self\nDiscipline, and\nSustain (7s)\n\n1.1 Analytical skills\n1.2 Planning skills\n1.3 Delegation skills\n1.4 Organizing skills\n1.5 Bookkeeping\nskills\n1.6 Management\nskills\n\n2. Review task\ndescriptions and\npersonnel\nqualifications\n2.1 Tasks are validated\nalong with the range of\nconditions under which\nperformance may need\nto occur.\n2.2 Most appropriate\nemployment\narrangements are\ndetermined based on\nemployer and employee\nneeds, and\nresponsibilities and\nrights.\n2.3 Person qualifications\nare determined with\ndue regard to\nlegislation, codes and\nnational standards.\n2.1 PESO Programs\nand services\n2.2 Human Resource\nManagement\n2.3 Task Specific\nDescription\n2.4 Workforce\nQualification\n2.5 Citizen’s Charter\n2.6 Civil Service’s\nRules and\nRegulations\n2.7 Strategic\nPerformance\nManagement\nSystem (SPMS)\n2.8 OSH Legislation\n2.9 Qualification\nStandards\n2.1 Assessment\nskills\n2.2 Decision making\nskills\n2.3 Delegation skills\n2.4 Organization\nskills\n2.5 Oral and Written\nskills\n2.6 Benchmarking\nskills\n\n--- PDF PAGE 74 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 70\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Support\nworkforce\ntraining\nprograms\n3.1 Strategies to identify skill\nand knowledge gaps are\ndesigned and\nimplemented with\nworkers, and strategies\nto address these gaps\nare implemented in\naccordance with\nprogram mandates.\n3.2 Workforce Development\nPlan is implemented in\naccordance with existing\npolicies and guidelines\n3.3 Feedbacking and action\nplans are implemented\nin accordance with\nexisting policies and\nguidelines.\n\n3.1 Strategies to\nidentify skill and\nknowledge gaps\n3.2 Available and\nappropriate\ntraining program\n3.3 Workforce\nDevelopment\nPlan\n3.1 Evaluation and\nAssessment\nSkills\n3.2 Mentoring and\nCoaching\n3.3 Feedbacking\nSkills\n4. Implement OSH\npriorities and\nprocedures\n4.1. Safety and health\npolicies are enforced\nwithin the Office.\n4.2. Safe work practices\nare identified for all\naspects of the\noperation of the Office\n4.3. Risks and hazards are\nidentified and\nassessed for OSH.\n4.4. New staff are oriented\ninto the workplace\nOSH system.\n4.1 Safety and Health\nPolicies\n4.2 Safe work\npractices\n4.3 Workplace OSH\nSystem\n4.4 First Aid\n4.5 Property Labeled\nProperties\n4.6 Fire Drill\n4.7 Earthquake Drill\n4.8 Disaster\nPreparedness\n4.9 OSH Practices,\nincluding hazard\nidentification and\ncontrol measures\n\n4.1 Coordination\nSkills\n4.2 Communication\nSkills\n4.3 Supervisory skills\n4.4 Feedbacking\nskills\n4.5 Monitoring skills\n4.6 Training and\nfacilitation skills\n\n--- PDF PAGE 75 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 71\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Existing Guidelines\nMay include:\n1.1\nPESO Manual of Operations\n1.2\nAnnual Procurement Plan\n1.3\nCommission on Audit\n1.4\nProgram, Activities and Projects\n\n2. Tasks\nMay include:\n2.1 Manual and mental activities\n2.2 Task and element durations\n2.3 Task frequency\n2.4 Task allocation\n2.5 Task complexity\n2.6 Environmental conditions\n2.7 Necessary clothing and equipment\n5. Strategies for\nCommunicating\nMay include:\n4.1 First Impressions\n4.2 Non-Verbal Communication\n4.3 Show Respect\n4.4 Listening Skills\n4.5 Active listening\n4.6 Stay focused when you listen\n4.7 Other Languages and Cultures\n4.8Communicating in a Noisy Environment\n4.9 Making Oral Reports\n4.10 Using the Telephone\n4.11\nGiving Directions and Feedback\n\n6. Strategic Performance\nManagement System\nMay include:\n6.1 Define and communicate goals and objectives\n6.2 Utilize performance management system\n6.3 Offer frequent performance feedback\n6.4 Use peer reviews\n6.5 Coaching and Mentoring\n6.6 Preemptive management and recognition\n6.7 Set regular meetings to discuss outcomes and results\n7. Processes and\nprocedures for the\nadministration of staff\nMay include:\n7.1 Financial Planning\n7.2 Record Keeping\n7.3 Billing\n7.4 Personnel Management\n7.5 Physical Distribution\n7.6 Logistics\n8. Administrative Process\nand Procedures\nMay include:\n8.1 Planning\n8.2 Organization\n8.3 Execution\n8.4 Control\n8.5 Correspondence\n9. Safety and Health\nPolicies\nMay include:\n9.1 OSH policies and guidelines\n9.2 Senior management's commitment to the establishment of a\nhealthy and safe workplace and to the integration of health\nand safety into all workplace activities.\n\n--- PDF PAGE 76 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 72\nVARIABLE\nRANGE\n9.3 The commitment to comply with applicable OSH legal\nrequirements and other requirements – or better, the\nintention to treat applicable health and safety legislation as a\nminimum standard rather than maximum.\n9.4 Responsibility of appropriate personnel in maintaining a\nhealthy and safe workplace and to protect the well-being of\nall persons in the workplace.\n9.5 Accountability of all levels of management for carrying out\nhealth and safety responsibilities.\n9.6 Importance of consultation and co-operation between\nmanagement and employees for effective implementation of\npolicy and any related programs.\n9.7 Commitment to continual improvement by conducting regular\nreviews of the policy,\n9.8 Commitment to monitor the policy’s effectiveness by having\na method for setting and reviewing OSH objectives and\ntargets.\n9.9 That the policy will be documented, posted, and\ncommunicated internally as well as externally, as\nappropriate, and\n9.10 Commitment to provide adequate funds and details of how\nmoney will be available.\n\n10. Safe Work Practices\nMay include:\n10.1 Name or description of the work task\n10.2 Date the SWP was created and date it was last reviewed or\n revised\n10.3 Hazards that may cause harm to a worker\n10.4 Common signs and symptoms of a musculoskeletal injury\n if the Hazards of the job task could lead to this type of\n injury\n10.5 Equipment / devices, personal protective equipment (PPE),\n or other safety considerations necessary to perform the\n task safely\n10.6 Required training and / or relevant documentation needed\n to perform the task safely\n10.7 Steps to perform the task safely including safe body\n positions and / or movements as appropriate\n10.8 Indication that workers are to be trained on the SWP and\n employers must ensure that workers follow them\n\n--- PDF PAGE 77 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 73\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMaximized effective and efficient management/utilization of\nresources is maximized in accordance with existing\nguidelines.\n1.2\nDesigned and implemented strategies to identify skill and\nknowledge gaps with workers, and strategies to address\nthese gaps in accordance with program mandates\n1.3\nOriented new staff into the workplace OSH system\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace appropriate for the unit of competency\n2.2 Office supplies and materials appropriate for the unit of\n competency\n2.3 Office equipment and fixture appropriate for the unit of\n competency\n2.4 Internet connectivity\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1\nWritten examination\n3.2\nDemonstration with oral questioning\n\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 78 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 74"
