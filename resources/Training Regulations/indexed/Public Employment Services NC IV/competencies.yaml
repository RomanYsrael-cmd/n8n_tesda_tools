        "source_text": "SOC341302\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and attitude required\nto supervise stakeholders’ registries and conduct of\nstakeholders’ consultation needed in the development of\nthe employment plan.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold & Italicized terms\nare elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.Supervise\nregistries of local\nstakeholders\n\n1.1 Performance and\nstatus of compliance\nof potential\nstakeholders are\nreviewed in\naccordance with\napplicable program\npolicies and\nguidelines\n1.2 Registries of\nexisting and\nadditional\nstakeholders are\nreviewed in\naccordance with\napplicable program\npolicies and\nguidelines\n1.3 Registries of\nstakeholders are\nensured that are\nupdated and\nfinalized in\naccordance with\napplicable program\npolicies and\nguidelines.\n1.1 Applicable\nprogram\npolicies and\nguidelines\n1.2 Labor market\ninformation\n1.3 Written and\nverbal\ncommunication\n1.4 Data gathering\n1.5 Data analysis\n1.6 Stakeholders\n1.1 Communication skills\n1.2 Interpersonal skills\n1.3 Supervisory skills\n1.4 Decision making skills\n1.5 Assessment and\nevaluation skills\n\n2.Supervise\nstakeholders’\nplanning\nconsultation\n\n2.1 Planning\nconsultation on\nPESO programs are\nconducted in\naccordance with the\nmandated\nguidelines.\n2.2 Effective relationship\nwith stakeholders is\nsustained in\naccordance with\nmandated guidelines\n\n2.1 Customer\nservice\n2.2 Written and\nverbal\ncommunication\n2.3 PESO\nprograms\n2.4 Consultation\n2.5 Mandated\nguidelines\n2.6 Stakeholders\nmanagement\n2.1 Leadership and\nmanagement skills\n2.2 Conflict management\nskills\n2.3 Supervisory skills\n2.4 Communication skills\n2.5 Interpersonal skills\n2.6 Networking skills\n2.7 Negotiation skills\n\n--- PDF PAGE 64 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 60\nELEMENT\nPERFORMANCE\nCRITERIA\nBold & Italicized terms\nare elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.3 Documentation and\nmaintenance of\nconsultations with\nstakeholders are\nensured in\naccordance with the\nmandated guidelines\n3. Formulate local\nemployment\ndevelopment\nplan\n\n3.1 PESO programs’\ntimelines are\nidentified in\naccordance with\nlocal employment\ndevelopment plan.\n3.2 Budget is determined\nin accordance with\nidentified activities.\n3.3 Personnel are\nassigned according\nto tasks and\nresponsibilities.\n3.4 Local employment\ndevelopment plans\nare formulated and\nsubmitted the same\nfor approval in\naccordance with\npolicies and\nguidelines\n3.5 Effective\ncommunication with\nlocal\nexecutives/officials is\nmaintained to\nappraise and provide\nrecommendations for\npolicy directions in\naccordance with\napproved guidelines.\n3.1 Project\nmanagement\n3.2 Employment\nplan\n3.3 Action plan\nmaking\n3.4 Proposal\nmaking\n3.5 Data gathering\n3.6 Data analysis\n3.7 Monitoring and\nevaluation\n3.8 Applicable\nprogram\npolicies and\nguidelines\n3.1 Planning skills\n3.2 Communication skills\n3.3 Writing skills\n3.4 Data gathering skills\n3.5 Leadership and\nmanagement\n\n--- PDF PAGE 65 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 61\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Registries\nMay include:\n1.1 PESO Employment Information System\n1.2 Philjobnet\n1.3 List of registered businesses\n1.4 Employers directory\n2. Stakeholders\nMay include:\n2.1 Employer groups\n2.2 Industry groups\n2.3 Government agencies\n2.4 Civil Society Organizations\n2.5 People’s organizations\n2.6 Academe\n3. PESO Programs\nMay include:\n3.1 Referral and placement of jobseekers\n3.2 Provision of Labor Market Information\n3.3 Special Program for the Employment of Students\n3.4 Government Internship Program\n3.5 DOLE Integrated Livelihood and Emergency\nEmployment Program\n3.6 Job Fairs\n3.7 Special/Local Recruitment Activity\n3.8 Career Guidance and Employment Coaching\n4. Local Employment\nDevelopment Plan\nMay include:\n4.1 Employment Development Plan\n4.2 Labor Market Information\n4.3 Programs, Activities and Projects\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Reviewed performance and status of compliance of\npotential stakeholders in accordance with applicable\nprogram policies and guidelines\n1.2 Conducted planning consultation on PESO programs\nin accordance with the mandated guidelines.\n1.3 Formulated and submitted local employment\ndevelopment plans for approval in accordance with\npolicies and guidelines\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Supplies and materials relevant the task to be\nperformed\n3. Methods of Assessment\nCompetency on this unit must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written examination\n\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 66 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 62\nUNIT OF COMPETENCY\n :\nSUPERVISE PESO PROGRAMS, ACTIVITIES, AND\n\nPROJECTS\nUNIT CODE\n\n:"
