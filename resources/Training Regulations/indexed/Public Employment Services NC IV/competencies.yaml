        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Conducted stakeholder’s consultation in accordance with\nexisting program mandates and policies.\n1.2 Ensured and facilitated the signing of agreements with partner\ninstitutions\n\n2 Resource\nImplications\nThe following resources must be provided:\n2.1 Workplace\n2.2 Supplies, materials relevant to the proposed activity or task to be\nperformed\n2.3 Equipment and office fixture\n\n3 Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written examination\n\n4 Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 63 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 59\nUNIT OF COMPETENCY\n:\nSUPERVISE PESO PLANNING ACTIVITIES\nUNIT CODE\n\n:"
        },
        "source_text": "SOC341301\n\nUNIT DESCRIPTOR\n\n: This unit covers the knowledge, skills and attitudes required to\nreview updated stakeholders’ profiles, conduct meeting, and\nforge partnership agreement with stakeholders.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Set Stakeholders\nConsultation\n1.1 Staff meeting is conducted\nfor the delegation of tasks in\naccordance with defined\nduties and responsibilities.\n1.2 Assigned tasks are\nmonitored in accordance with\nthe established monitoring\nprocedures.\n1.3 The tasks delegated to staff\nare ensured and executed in\naccordance with defined\nduties and responsibilities.\n1.4 Stakeholders profiling are\noverseen in accordance with\nthe prescribed forms.\n1.5 Stakeholder’s consultation is\nconducted in accordance\nwith existing program\nmandates and policies.\n1.1 Planning\n1.2 Monitoring\n1.3 Delegation\n1.4 Evaluation\n1.5 Prescribed\nforms\n1.6 Data\nverification\nand validation\n1.7 Computer\nliteracy\n1.8 Management\nStrategy\n\n1.1 Communication\nskills\n1.2 Coordination\nskills\n1.3 Networking\nskills\n1.4 Collaborative\ninfluence\n2. Identify possible\ninterventions to\nrespective\nstakeholders\n2.1 PESO programs are\nintroduced to stakeholders\nbased on mandates.\n2.2 Stakeholders’ profiles are\nreviewed in accordance with\nthe program mandates.\n2.3 Classification of stakeholders\nare supervised according to\nsectors and industries.\n2.4 PESO programs are\nidentified specific for\nstakeholders’ needs.\n2.1 PESO\nEmployment\nFacilitation\nPrograms\n2.2 Industry\nClassifications\n2.3 Oral and written\nCommunication\n2.4 Data gathering\nand analysis\n2.5 Computer\nliteracy\n2.1 Communication\nskills\n2.2 Computer skills\n2.3 Organizational\nSkills\n2.4 Planning Skills\n2.5 Networking\nSkills\n\n3. Supervise\npartnership\nagreements\n3.1 Documents needed are\nvalidated in accordance with\nLGU’s requirement.\n3.2 Partnership details are\nensured and covered based\non signed agreements.\n3.3 Schedule of agreement\nsigning is monitored in\naccordance with agreed\nschedule.\n3.4 Signing of agreements is\nensured and facilitated in\n3.1 Partnership\nagreement\ndetails\n3.2 LGU\nRequirements\n3.3 Documents\n3.4 Monitoring and\nDocumentation\n3.5 Planning\n3.1 Planning &\ndevelopment\n3.2 Coordination\nskills\n3.3 Building\npartnerships\n3.4 Strategic\nmanagement\n\n--- PDF PAGE 61 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 57\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\nMay include:\n1.1\n Prepare invitation letters\n1.2\n Distribute invitation letters\n1.3\n Confirm participants\n1.4\n Prepare logistics\n\n2. Stakeholders\nMay include:\n2.1\n Employers Group\n2.2\n Industry Group\n2.3\n Government agencies\n2.4\n Civil Society Organizations\n2.5\n People’s organizations\n2.6\n Academe\n3. Prescribed Forms\nMay include:\n3.1\n Registration forms\n3.2\n Documentary requirements\n3.3\n Related legal documents\n3.4\n Job vacancy advertisement\n3.5\n Employment related forms\n4. PESO Programs\nMay include:\n4.1\nReferral & Placements of Jobseekers\n4.2\nProvision of Labor Market Information\n4.3\nSpecial Program for the Employment of Students\n4.4\nGovernment Internship Program\n4.5\nDOLE Integrated Livelihood & Emergency Employment\nProgram\n4.6\nJob Fairs\n4.7\nSpecial/Local Recruitment Activity\n4.8\nCareer Guidance and Employment Coaching\naccordance with agreed\nschedule.\n3.5 Outcomes of the activity are\nmonitored in accordance with\nagreed targets.\n4. Strengthen\nlinkages with\npartners\n4.1 Attendance to meetings with\npartners is ensured in\naccordance with agreed\nschedules.\n4.2 Constant communication is\nestablished with partners\nusing different modes of\ncommunication.\n4.3 Updates on programs are\ndiscussed and monitored in\naccordance with signed\nagreements.\n4.4 Commitment of both parties is\nensured in accordance with\nthe signed agreements.\n4.1 Updates on\nprograms\n4.2 Monitoring and\nDocumentation\n4.3 Planning\n4.4 Partnership\nagreement\ndetails\n\n4.1 Planning &\ndevelopment\n4.2 Coordination\nskills\n4.3 Building\npartnerships\n4.4 Communication\nskills\n4.5 Strategic\nmanagement\n\n--- PDF PAGE 62 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 58\n5. Documents Needed\nMay include:\n5.1\nMemorandum of Understanding\n5.2\nMemorandum of Agreement\n5.3\nNon-Disclosure Agreement\n6. Partnership Details\nMay include:\n6.1\nDuration\n6.2\nTitle of program\n6.3\nBudget\n6.4\nTerms\n7. LGU’s\nRequirement\nMay include:\n7.1\nBusiness Permits\n7.2\nSEC Registration\n7.3\nLetter of Intent\n7.4\nBoard Resolution to enter into agreement\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Conducted stakeholder’s consultation in accordance with\nexisting program mandates and policies.\n1.2 Ensured and facilitated the signing of agreements with partner\ninstitutions\n\n2 Resource\nImplications\nThe following resources must be provided:\n2.1 Workplace\n2.2 Supplies, materials relevant to the proposed activity or task to be\nperformed\n2.3 Equipment and office fixture\n\n3 Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written examination\n\n4 Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 63 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 59\nUNIT OF COMPETENCY\n:\nSUPERVISE PESO PLANNING ACTIVITIES\nUNIT CODE\n\n:"
      }
