        "source_text": "500311407\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\n\nassess Occupational Safety and Health (OSH) practices and\n\nprograms, recommend OSH program improvement initiatives, and\n\nimplement recommended improvements on Occupational Safety\n\nand Health (OSH) Programs, Procedures and Policies\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1.\nAssess\nOccupational\nSafety and\nHealth (OSH)\npractices and\nprograms\n1.1 OSH practices and\nprograms are\nreviewed based on\nworkplace policies\nand procedures\n1.2 Appropriate personnel\nor OSH reference\nguides are consulted\nfor proper guidance\nbased on workplace\npolicies and\nprocedures\n1.3 Current practices and\nprograms are\nevaluated based on\nacceptable level of\nOSH work standards\n1.1. OSH practices\nand programs\nworkplace\npolicies and\nprocedures\n1.2. OSH reference\nguides\n1.3. OSH work\nstandards\n1.1. Critical thinking\nskills\n1.2. Evaluating skills\n2. Recommend OSH\nprogram\nimprovement\ninitiatives\n2.1 OSH work\nimprovement\ninitiatives are\nidentified that are\nrelevant with the\nworkplace scenario\n2.2 OSH program\nimprovement plans\nare organized based\non workplace policies\nand procedures\n2.3 OSH program\nimprovement plans\nare presented based\non workplace policies\nand procedures\n\n2.1. OSH Programs\n2.2. OSH work\nimprovement\ninitiatives\n2.1. Presentation Skills\n2.2. Communication\nskills\n2.3. Collaborating skills\n2.4. Critical thinking\nskills\n2.5. Observation skills\n\n--- PDF PAGE 34 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 30\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Implement\nrecommended\nimprovements on\nOccupational\nSafety and Health\n(OSH) Programs,\nProcedures and\nPolicies\n3.1 Approved\nimprovements on\nOSH work\nimprovement\ninitiatives are\ncommunicated\nbased on workplace\npolicies and\nprocedures\n3.2 Concern personnel\nare guided in\naccordance with\nworkplace policies\nand procedures\n3.3 Implementation of\nthe approved OSH\ninitiatives are\nmonitored in\naccordance with\nworkplace policies\nand procedures\n3.4 Implementation of\napproved OSH\ninitiatives are\nevaluated based on\nworkplace policies\nand procedures\n3.1. Coaching\nConcepts\n3.2. OSH work\nimprovement\ninitiatives\n3.3. Supervisory\nConcepts\n3.1. Monitoring Skills\n3.2. Evaluation Skills\n3.3. Auditing Skills\n3.4. Coaching Skills\n3.5. Supervisory Skills\n\n--- PDF PAGE 35 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 31\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. OSH Practices and\nPrograms\nMay include but not limited to:\n1.1\nPlanning, implementation and maintenance of\nmanufacturing plants\n1.2\nWork-physiological, psychological, ergonomic and\nhygienic practices and programs\n1.3\nFirst aid within the workplace\n1.4\nSafety inspection practices\n2. OSH Reference\nGuides\nMay include but not limited to:\n2.1\nOccupational Safety and Health Standards Book\n2.2\nOSHA Safety Bulletins and Magazines\n2.3\nEquipment Safety Operating Instructions\n2.4\nEstablished National Safety Management Books\n2.5\nCredible OSH Web-sites\n2.6\nSafety Solution Guide Books and Handbooks\n3. OSH Work\nImprovement\nInitiatives\nMay include but not limited to:\n3.1\nEliminate the hazard altogether (i.e., get rid of the dangerous\nmachine)\n3.2\nIsolate the hazard from anyone who could be harmed (i.e.,\nkeep the machine in a closed room and operate it remotely;\nbarricade an unsafe area off)\n3.3\nSubstitute the hazard with a safer alternative\n(i.e., replace the machine with a safer one)\n3.4\nUse administrative controls to reduce the risk\n(i.e., train workers how to use equipment safely; train\nworkers about the risks of harassment; issue signage)\n3.5\nUse engineering controls to reduce the risk (i.e., attach guards\nto the machine to protect users)\n3.6\nUse personal protective equipment (i.e., wear gloves and\ngoggles when using the machine)\n\n--- PDF PAGE 36 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 32\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consult appropriate personnel or OSH reference\nguides for proper guidance based on workplace\npolicies and procedures\n1.2. Evaluate current practices and programs based on\nacceptable level of OSH work standards\n1.3. Identify OSH work improvement initiatives that are\nrelevant with the workplace scenario\n1.4. Present OSH program improvement plans based on\nworkplace policies and procedures\n1.5. Communicate approved improvements on OSH work\nprogram initiatives based on workplace policies and\nprocedures\n1.6. Monitor implementation of the approved OSH\ninitiatives in accordance with workplace policies and\nprocedures\n1.7. Evaluate implementation of approved OSH initiatives\nbased on workplace policies and procedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n3.4 Observation/Demonstration and oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 37 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 33\nUNIT OF COMPETENCY\n:\nLEAD TOWARDS IMPROVEMENT OF ENVIRONMENTAL\nWORK PROGRAMS, POLICIES AND PROCEDURES\n\nUNIT CODE\n:"
      },
