        "source_text": "SOC341303\nUNIT DESCRIPTOR\n\n:\nThis unit of competency deals with the knowledge, skills,\n\nand attitudes to supervise PESO programs, activities, and\n\nprojects that include human and financial resources with\n\ntimeliness, efficiency, and effectivity through program\n\nmonitoring and evaluation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Supervise the\ndevelopment and\napproval of work\nand financial\nplan\n\n1.1. Conduct of sessions is\nsupervised in\naccordance with\nexisting procedures.\n1.2. Detailed work and\nfinancial plans are\nreviewed in accordance\nwith applicable policies\nand guidelines\n1.3. Work and financial plan\nis presented and\ndiscussed to authorized\npersonnel for approval\n1.1 Work and\nfinancial plans\n1.2 Planning\n1.3 Budgeting\n1.4 Program\nmanagement\n1.5 Applicable\npolicies and\nguidelines\n1.1 Attention to\ndetails\n1.2 Presentation\nskills\n1.3 Leadership and\nmanagement\n1.4 Team\nmanagement\n1.5 Active listening\nskills\n1.6 Coordination\nskills\n1.7 Decision\nmaking skills\n1.8 Analytical skills\n2. Assign program\nfocal persons\nwith designated\nroles and\nresponsibilities\n2.1 Program focal persons\nare designated to\nprograms, activities and\nprojects\n2.2 Designated focal\npersons are oriented on\ntheir roles and\nresponsibilities in\naccordance with the\napproved work and\nfinancial plans\n2.3 Individual targets and\ncommitments of\nprogram focal persons\nare set in accordance\nwith the approved work\nand financial plans\n2.1 Organizing\n2.2 Staffing\n2.3 Target and\ncommitment\nsetting\n2.4 PESO Programs\n2.5 Resource\nmanagement\n2.1 Leadership and\nmanagement\n2.2 Team\nmanagement\n2.3 Active listening\nskills\n2.4 Decision\nmaking skills\n2.5 Negotiation\nSkills\n2.6 Conflict\nmanagement\nskills\n\n3. Supervise the\nimplementation\nof programs,\nactivities and\nprojects\n3.1 Program\nimplementation updates\nare reviewed in\naccordance with targets\nand timelines\n3.2 Implementation of\nprograms, activities\nand projects is ensured\nin accordance with\ntargets set and timelines\n3.1 Program policies\nand guidelines\n3.2 Resource\nmanagement\n3.3 Program\nmanagement\n3.4 Information,\neducation, and\ncommunication\n3.1 Leadership and\nmanagement\n3.2 Team\nmanagement\n3.3 Networking\nskills\n3.4 Decision\nmaking skills\n\n--- PDF PAGE 67 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 63\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Resources are\nsupervised in\naccordance with targets\nset and timelines\n3.5 Reporting and\ndissemination\nskills\n3.6 Communication\nskills\n3.7 Negotiation\nSkills\n4. Oversee the\nmonitoring and\nevaluation of\nprograms,\nactivities and\nprojects\n4.1 Accomplishments are\nassessed and evaluated\nin accordance with\ntargets set and timelines\n4.2 Issues and concerns\nare addressed and\nresolved in accordance\nwith program guidelines\n4.3 Improvement on work\nprocess are formulated\nand implemented in\naccordance with\nprogram guidelines\n4.1 Applicable\npolicies and\nguidelines\n4.2 Monitoring and\nevaluation\n4.3 Program\nmanagement\n4.4 Resource\nmanagement\n4.1 Leadership and\nmanagement\n4.2 Team\nmanagement\n4.3 Decision\nmaking skills\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nWork and Financial Plans\nMay include:\n1.1 Employment Development Plan\n1.2 Programs, activities and projects (PAPs) profile\n1.3 Annual Investment Plan (AIP)\n1.4 Project Procurement Management Plan (PPMP)\n2.\nTimelines\nMay include:\n2.1 Daily\n2.2 Weekly\n2.3 Monthly\n2.4 Quarterly\n2.5 Semestral\n2.6 Annually\n3.\nPrograms, Activities and\nProjects\nMay include:\n3.1 Labor market information\n3.2 Job and livelihood fairs\n3.3 Referral and placement\n3.4 Career guidance and advocacy\n3.5 Youth employment programs\n\n--- PDF PAGE 68 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 64\n4.\nResources\nMay include:\n4.1 Budget\n4.2 Logistics\n4.3 Supplies and materials\n4.4 Equipment\n4.5 Procedural manuals\n4.6 Manpower\n4.7 Capital outlay\n\nEVIDENCE GUIDE\n1.\nCritical Aspects of\nCompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Reviewed detailed work and financial plans in\naccordance with applicable policies and\nguidelines\n1.2 Ensured implementation of programs, activities\nand projects in accordance with targets set\nand timelines\n1.3 Assessed and evaluated accomplishments in\naccordance with targets set and timelines\n2.\nResource Implications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Office Supplies and Materials\n2.3 Office Equipment and Fixture\n2.4 Internet Connectivity\n3.\nMethods of Assessment\nCompetency in this unit must be assessed\nthrough:\n3.1 Written Examination\n3.2 Demonstration with oral questioning\n4.\nContext of Assessment\n4.1 Competency maybe assessed in actual\nworkplace or at the designated TESDA\naccredited Assessment Center.\n\n--- PDF PAGE 69 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 65\n\nUNIT OF COMPETENCY\n:\nPROVIDE CONTINUOUS IMPROVEMENT ON\n\nOPERATIONS AND SOLUTIONS TO PESO\n\nCONCERNS\n\nUNIT CODE\n\n:"
