red\n\n3.1 Quality\nimprovement\nprocesses\n3.2 Company\ncustomers\ndefined\n3.1 Solution\nproviding and\ndecision-making\n3.2 Practice\ncompany\nprocess\nimprovement\nprocedure\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Documentation\nMay include\n1.1. Organization work procedures\n1.2. Manufacturer’s instruction manual\n1.3. Customer requirements\n1.4. Forms\n2. Quality Standards\nMay include:\n2.1. Quality standards may relate but not limited to the\nfollowing:\n2.1.1.\nMaterials\n2.1.2.\nComponent parts\n2.1.3.\nFinal product\n2.1.4.\nTimely Delivery\n3. Customer\nMay include:\n3.1. Co-worker\n3.2. Suppliers\n3.3. Client\n\n--- PDF PAGE 59 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 55\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Carried out work in accordance with the company’s\nstandard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with standard\noperating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Resource Implications\n\nThe following resources should be provided:\n2.1. Materials and component parts and equipment to be\nused in a real or simulated electronic production situation\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Questioning\n3.3. Practical demonstration\n4. Context of Assessment\n\nAssessment may be conducted in the workplace or in a\nsimulated work environment.\n\n--- PDF PAGE 60 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 56\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nESTABLISH AND STRENGTHEN LINKAGES WITH\nOTHER ORGANIZATIONS\n\nUNIT CODE\n\n:\nSOC341301\n\nUNIT DESCRIPTOR\n\n: This unit covers the knowledge, skills and attitudes required to\nreview updated stakeholders’ profiles, conduct meeting, and\nforge partnership agreement with stakeholders.\n\nELEMENT\nPERFORMANC