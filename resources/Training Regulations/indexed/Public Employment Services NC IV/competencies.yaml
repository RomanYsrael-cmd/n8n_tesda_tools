ded to group \nto facilitate \noutcomes \n5.5 Evaluation of group \ncommunication \nstrategies is \nundertaken to \npromote \nparticipation of all \nparties specific \ncommunication \nneeds of individuals \nare identified and \naddressed \n5.1  Communication \nprocess \n5.2 Dynamics of \ngroups and \ndifferent styles \nof group \nleadership \n5.3 Openness and \nflexibility in \ncommunication \n5.4 Communication \nskills relevant to \nclient groups \n \n5.1  Full range of \ncommunication \ntechniques including: \n5.1.1 Effective communication \nprocess \n5.1.2 Active listening \n5.1.3 Giving/receiving  \nfeedback \n5.1.4 Interpretation of \ninformation \n5.1.5 Role boundaries setting \n5.1.6 Negotiation \n5.1.7 Establishing empathy \n5.1.8 Openness and flexibility \nin communication \n5.2   Communication skills \nrequired to fulfill job roles \nas specified by the \norganization \n \n6. Conduct \ninterview \n6.1  A range of \nappropriate \ncommunication \nstrategies are \nemployed in \ninterview situations \n6.2  Records of \ninterviews are made \nand maintained in \naccordance with \norganizational \nprocedures \n6.3  Effective questioning, \nlistening and \nnonverbal \ncommunication \ntechniques are used \nto ensure that \nrequired message is \ncommunicated \n6.1  Communication \nprocess \n6.2  Dynamics of \ngroups and \ndifferent styles \nof group \nleadership \n6.3 Effective \nquestioning \ntechniques \n6.3  Communication \nskills relevant to \nclient groups \n \n6.1  Full range of \ncommunication \ntechniques including: \n6.1.1 Effective communication \nprocess \n6.1.2 Active listening \n6.1.3 Giving/ receiving \nfeedback \n6.1.4 Interpretation of \ninformation \n6.1.5 Role boundaries setting \n6.1.6 Negotiation \n6.1.7 Establishing empathy \n6.2 Effective clarifying and \nprobing techniques \n(questioning skills) \n6.3   Communication skills \nrequired to fulfill job roles \nas specified by the \norganization\n\n--- PDF PAGE 10 ---\nPUBLIC EMPLOYMENT SERVICES NC IV                 Promulgated (12/17/2019)                6 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Strategies  \n \nMay include: \n1.1 \nRecognizing own limitations \n1.2 \nReferral to specialists \n1.3 \nUtilizing techniques and aids \n1.4 \nProviding written drafts \n1.5 \nVerbal and non verbal communication \n2. Effective group \ninteraction \nMay include: \n2.1 \nIdentifying and evaluating what is occurring \nwithin an interaction in a non judgmental way \n2.2 \nUsing active listening \n2.3 \nMaking decision about appropriate words, \nbehavior \n2.4 \nPutting together response which is culturally \nappropriate \n2.5 \nExpressing an individual perspective \n2.6 \nExpressing own philosophy, ideology and \nbackground and exploring impact with \nrelevance to  communication \n2.7 \nOpenness and flexibility in communication \n3. Types of Interview \nMay include: \n3.1 \nRelated to staff issues \n3.2 \nRoutine \n3.3 \nConfidential  \n3.4 \nEvidential \n3.5 \nNon disclosure \n3.6 \nDisclosure \n4. Interview situations \nMay include: \n4.1 \nEstablish rapport \n4.2 \nElicit facts and information \n4.3 \nFacilitate resolution of issues \n4.4 \nDevelop action plans \n4.5 \nDiffuse potentially difficult situation\n\n--- PDF PAGE 11 ---\nPUBLIC EMPLOYMENT SERVICES NC IV                 Promulgated (12/17/2019)                7"
