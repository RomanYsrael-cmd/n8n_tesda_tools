rded in\naccordance with\nworkplace procedures\n\n2.1 Safety and\nenvironmental\naspects of\nproduction\nprocesses\n2.2 Fault identification\nand reporting\n2.3 Workplace\nprocedure in\ndocumenting\ncompleted work\n2.4 Workplace Quality\nIndicators\n2.1 Carry out work in\naccordance with\nOHS policies and\nprocedures\n\n--- PDF PAGE 58 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 54\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.4 Deviations from specified\nquality standards,\ncauses are documented\nand reported in\naccordance with the\nworkplace standards\noperating procedures\n3. Engage in\nquality\nimprovement\n3.1 Process improvement\nprocedures are\nparticipated in relation to\nworkplace assignment\n3.2 Work is carried out in\naccordance with process\nimprovement procedures\n3.3 Performance of operation\nor service to ensure\ncustomer satisfaction is\nmonitored\n\n3.1 Quality\nimprovement\nprocesses\n3.2 Company\ncustomers\ndefined\n3.1 Solution\nproviding and\ndecision-making\n3.2 Practice\ncompany\nprocess\nimprovement\nprocedure\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Documentation\nMay include\n1.1. Organization work procedures\n1.2. Manufacturer’s instruction manual\n1.3. Customer requirements\n1.4. Forms\n2. Quality Standards\nMay include:\n2.1. Quality standards may relate but not limited to the\nfollowing:\n2.1.1.\nMaterials\n2.1.2.\nComponent parts\n2.1.3.\nFinal product\n2.1.4.\nTimely Delivery\n3. Customer\nMay include:\n3.1. Co-worker\n3.2. Suppliers\n3.3. Client\n\n--- PDF PAGE 59 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 55\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Carried out work in accordance with the company’s\nstandard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with standar