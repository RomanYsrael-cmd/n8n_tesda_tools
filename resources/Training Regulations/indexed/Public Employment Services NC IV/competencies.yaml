        "source_text": "500311408\n\nUNIT DESCRIPTOR\n\n:\n\nThis unit covers the knowledge, skills and attitudes required in\nassessing environmental work practices and standards,\nrecommending environmental work improvement initiatives and\nimplementing recommended environmental improvements\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess\nenvironmental\nwork practices\nand programs\n1.1. Environmental\npractices and\nprograms are\nreviewed based on\nworkplace policies\n1.2 Appropriate personnel\nor environmental\nreference guides are\nconsulted for proper\nguidance based on\nworkplace policies*\n1.3 Current practices and\nprograms are\nevaluated based on\nacceptable level of\nenvironmental work\nstandards*\n1.1 Environmental\nPractices\n1.2 Environmental\nReference\nGuides\n1.3 Corrective\nAction and\nFollow-up\n1.4 Relevant\nenvironmental\nexperts\n1.5 Re-Training\nNeeds\n1.6 Energy and\nHealthy Habits\n1.1 Critical thinking\n1.2 Problem solving\n1.3 Observation Skills\n1.4 Training Delivery\nSkills\n\n2. Recommend\nenvironmental\nprogram\nimprovements\ninitiatives\n2.1 Environment practices\nopportunities are\nIdentified that are\nrelevant with the\nworkplace scenario\n2.2 Environmental program\nimprovement plans are\norganized based on\nworkplace policies and\nprocedures*\nEnvironmental program\nimprovement plans\nare presented based\non workplace policies\nand procedures*\n\n2.1 Environmental\nPractices and\nStandards\n2.2 2.2. Mitigation\nRequirements\n2.1. Presentation Skills\n2.2 Critical thinking\n2.3. Problem Solving\n2.4 Observation Skills\n2.5 Training Delivery\nSkills\n2.6 Cost-Benefit\nAnalysis\n\n3. Implement\nrecommended\nimprovements\non\nenvironmental\nprograms,\npolicies and\nprocedures\n3.1. Approved\nimprovements on\nenvironmental work\nprogram initiatives\nare promoted based\non workplace policies\nand procedures\n3.1. Environmental\nWork Initiatives\n3.2. Communication\nStrategies\n3.3. Environmental\ninspection and\nMonitoring\nTechniques\n3.1. Inspection Skills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n\n--- PDF PAGE 38 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 34\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Implementation of the\napproved\nenvironmental\ninitiatives are\nmonitored in\naccordance with\nworkplace policies and\nprocedures\n2.3 3.3. Implementation of\napproved\nenvironmental\ninitiatives are\nevaluated based on\nworkplace policies and\nprocedures\n3.4. Notification\nRequirements\n\n--- PDF PAGE 39 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 35\nRANGE OF VARIABLES\nVARIABLE\nR A N G E\n1. Environmental Practices\nand Programs\nMay include:\n3.1\nUtilization of Energy, Water, Fuel\n3.2\nSegregation Practices\n3.3\nWaste Disposal and Reuse\n3.4\nSaving Resources\n3.5\nWaste Collection\n3.6\nUsage of Hazardous Materials\n3.7\nChemical Application\n3.8\nEquipment Operation\n3.9\nDewatering and Discharging\n3.10 Surface Disturbance\n3.11 Periodic Inspection\n3.12 Resource Storage and Handling\n2. Environmental Reference\nGuides\nMay include:\n2.1\nAir Emission and Ambient Air Quality Guidelines\n2.2\nEnergy Conservation Guidelines\n2.3\nWastewater and Ambient Water Quality Guidelines\n2.4\nWater Conservation Guidelines\n2.5\nHazardous Materials Management\n2.6\nWaste Management\n2.7\nNoise\n2.8\nContaminated Land\n2.9\nCultural Conservation Guides\n3. Environmental Work\nProgram Initiatives\nMay include:\n3.1 Low Energy Lighting\n3.2 Water Reduction initiatives\n3.3 Holding Employee Awareness event\n3.4 Recycling Waste Materials\n3.5 Unplugging power converters overnight\n3.6 Tree-Planting\n3.7\nWild-life conservation\n\n--- PDF PAGE 40 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 36\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consulted appropriate personnel or environmental\nreference guides for proper guidance based on\nworkplace policies*\n1.2. Evaluated current practices and standards based\nacceptable level of environmental work standards\n1.3. Organized environmental standard improvement plans\nbased on workplace policies and procedures\n1.4. Presented environmental standard improvement plans\nbased on workplace policies and procedures*\n1.5. Promoted approved environmental work initiatives\nbased on workplace policies and procedures\n1.6. Evaluated the implementation of approved\nenvironmental improvements based on workplace\npolicies and procedures\n2. Resource Implications The following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n2.3 Case studies/scenarios relating to environmental\n protection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs,\ncertificate of training – local and abroad)\n 3.4 Simulations and role-plays\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA center.\n\n--- PDF PAGE 41 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 37\nUNIT OF COMPETENCY :\nSUSTAIN ENTREPRENEURIAL SKILLS\n\n UNIT CODE\n:"
