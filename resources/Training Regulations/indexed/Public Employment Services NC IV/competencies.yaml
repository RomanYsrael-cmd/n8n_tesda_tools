cts and\nservices are\nencouraged\n2.1 Public\nrelations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market\nand feasibility\nstudies\n2.4 Basic\nbusiness\nethics\n2.1 Building customer\nrelations\n2.2 Individual marketing\nskills\n2.3 Using basic\nadvertising (posters/\ntarpaulins, flyers,\nsocial media, etc.)\n3 Expand\nmarkets and\nclientele\n3.1 Enterprise is built\nup and sustained\nthrough judicious\ncontrol of cash\nflows.\n3.2 Profitability of\nenterprise is ensured\nthough appropriate\ninternal controls.\n3.3 Unnecessary or\nlower-priority\nexpenses and\npurchases are\navoided.\n3.4 New markets and\nclients are identified\nbased on current\nmarket trends\n\n3.1 Basic cost-\nbenefit\nanalysis\n3.2 Basic financial\nmanagement\n3.3 Basic\nfinancial\naccounting\n3.4 Business\ninternal\ncontrols\n\n3.1 Setting business\npriorities and strategies\n3.2 Interpreting basic\nfinancial statements\n3.3 Preparing business\nplans\n\n--- PDF PAGE 43 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 39\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Entrepreneurial skills\nMay include:\n1.1 Financial management skills\n1.2 People management skills\n1.3 Operations management skills\n1.4 Business acumen\n\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n3.4 Managing property, plant and equipment\n4. Continuous\nimprovement\nMay include:\n4.1 Quality management systems (PDCA, ISO 9001,TQM, Six-\nSigma, etc.)\n4.2 Client feedback systems\n4.3 Quality assurance/Quality control systems\n\n--- PDF PAGE 44 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 40\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated enhancement of one’s\nentrepreneurial skills through performance of\nbusiness, supervisor evaluation, worker and\nclient testimony\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Interview guide for entrepreneurs, enterprise\nworkers and third parties\n2.2 Materials and location relevant to the proposed\nactivity and tasks\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough :\n4.1 Written report\n4.2 Written examination\n4.3 Demonstration/observation with oral\nquestioning\n4.4 Portfolio assessment with interview\n4.5 Third-party report\n\n4. Context of Assessment\n4.1 Competency may be assessed in workplace or\nin a simulated workplace setting\n4.2 Assessment shall be observed while tasks are\nbeing undertaken whether individually or in-\ngroup\n\n--- PDF PAGE 45 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 41\nCOMMON COMPETENCIES\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n:"
