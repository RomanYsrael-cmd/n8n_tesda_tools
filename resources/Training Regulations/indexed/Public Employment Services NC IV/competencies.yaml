il Society Organizations \n2.5 People’s organizations  \n2.6 Academe  \n3. PESO Programs \nMay include: \n3.1 Referral and placement of jobseekers \n3.2 Provision of Labor Market Information \n3.3 Special Program for the Employment of Students \n3.4 Government Internship Program \n3.5 DOLE Integrated Livelihood and Emergency \nEmployment Program \n3.6 Job Fairs \n3.7 Special/Local Recruitment Activity \n3.8 Career Guidance and Employment Coaching \n4. Local Employment \nDevelopment Plan \nMay include: \n4.1 Employment Development Plan  \n4.2 Labor Market Information \n4.3 Programs, Activities and Projects  \n \n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Reviewed performance and status of compliance of \npotential stakeholders in accordance with applicable \nprogram policies and guidelines \n1.2  Conducted planning consultation on PESO programs  \nin accordance with the mandated guidelines. \n1.3 Formulated and submitted local employment \ndevelopment plans for approval in accordance with \npolicies and guidelines \n2. Resource Implications \nThe following resources should be provided: \n2.1 Workplace \n2.2  Supplies and materials relevant the task to be \nperformed \n3. Methods of Assessment \nCompetency on this unit must be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Written examination \n \n4. Context of Assessment  \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
