        "source_text": "ELC311203\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills, (and) attitudes and values\n\nneeded to perform computer operations which include inputting,\n\naccessing, producing and transferring data using the appropriate\nhardware and software\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntask to be\nundertaken\n1.1. Requirements of task are\ndetermined according to job\nspecifications\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned\nand required outcome\n1.3. Task is planned to ensure\nOH&S guidelines and\nprocedures are followed\n1.4. Client -specific guidelines\nand procedures are\nfollowed.\n1.5. Required data security\nguidelines are applied in\naccordance with existing\nprocedures.\n1.1. Main types of\ncomputers and\nbasic features\nof different\noperating\nsystems\n1.2. Main parts of\na computer\n1.3. Information\non hardware\nand software\n1.4. Data\nsecurity\nguidelines\n1.1. Reading and\ncomprehensio\nn skills\nrequired to\ninterpret work\ninstruction and\nto interpret\nbasic user\nmanuals.\n1.2. Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow\ninstructions and\nreceive\nfeedback.\n1.3. Interpreting\nuser manuals\nand security\nguidelines\n2. Input data\ninto computer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating\nprocedures\n2.3. Inputted data are stored in\nstorage media according\nto requirements\n2.4. Work is performed within\nergonomic guidelines\n2.1. Basic\nergonomics of\nkeyboard and\ncomputer user\n2.2. Storage\ndevices and\nbasic\ncategories of\nmemory\n2.3. Relevant types\nof software\n2.1. Technology\nskills to use\nequipment\nsafely including\nkeyboard skills.\n2.2. Entering data\n\n--- PDF PAGE 46 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 42\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Access\ninformation\nusing computer\n3.1. Correct program/application\nis selected based on job\nrequirements\n3.2. Program/application\ncontaining the information\nrequired is accessed\naccording to company\nprocedures\n3.3. Desktop icons are\ncorrectly selected, opened\nand closed for navigation\npurposes\n3.4. Keyboard techniques are\ncarried out in line with OH&S\nrequirements for safe use of\nkeyboards\n3.1. General security,\nprivacy\nlegislation and\ncopyright\n3.2. Productivity\nApplication\n3.3. Business\nApplication\n3.1. Accessing\ninformation\n3.2. Searching and\nbrowsing files\nand data\n4. Produce/\noutput data\nusing computer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as\nrequired using computer\nhardware/peripheral\ndevices in accordance with\nstandard operating\nprocedures\n4.3. Files, data are transferred\nbetween compatible\nsystems using computer\nsoftware, hardware/\nperipheral devices in\naccordance with standard\noperating procedures\n4.1 Computer\napplication in\nprinting, scanning\nand sending\nfacsimile\n4.2 Types and function\nof computer\nperipheral devices\n4.1 Computer\ndata\nprocessing\n4.2 Printing of data\n4.3 Transferring files\nand data\n5. Maintain\ncomputer\nequipment and\nsystems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of\nconsumables are\nimplemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with\nstandard operating\nprocedures\n5.3. Basic file maintenance\nprocedures are\nimplemented in line with the\nstandard operating\nprocedures\n5.1 Computer\nEquipment/\nSystem basic\nmaintenance\nprocedures\n5.2 Viruses\n5.3 OH&S principles\nand\nresponsibilities\n5.4 Calculating\ncomputer\ncapacity\n5.5 System Software\n\n5.6 Basic file\n5.7 maintenance\nprocedures\n5.1 Removing\ncomputer viruses\nfrom infected\nmachines\n5.2 Making backup\nfiles\n\n--- PDF PAGE 47 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nPeripheral Devices\n1.1.\n1.2.\n1.3.\n1.4.\n1.5.\nPersonal computers Networked\nsystems Communication equipment\nPrinters\nScanners\nKeyboard Mouse\n2. Software\nMay include:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n3. OSH Guidelines\n3.1.\n3.2.\nOHS guidelines Enterprise\nprocedures\n4. Storage Media\nMay include:\n4.1. diskettes\n4.2. CD and DVDs\n4.3. zip disks\n4.4. hard disk drives, local and remote\n5. Ergonomic Guidelines\n5.1.\n5.2.\n5.3.\n5.4.\n5.5.\nTypes of equipment used\nAppropriate furniture Seating posture\nLifting posture\nVisual display unit screen brightness\n6. Desktop Icons\nIcons may include the following:\n6.1. directories/folders\n6.2. files\n6.3. network devices\n6.4. recycle bin\n7. Maintenance\n7.1. Creating more space in the hard disk\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 48 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 44\n EVIDENCE GUIDE\n1. Critical Aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly and\naccording to the task requirement\n1.2. Identified and explain the functions of both hardware and\nsoftware used, their general features and capabilities\n1.3. Produced accurate and complete data in accordance with the\nrequirements\n1.4. Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5. Maintained computer system\n2. Met