        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nEvaluated the effectiveness and efficiency of workplace \nsystems, processes and procedures. \n1.2 \nModelled the conscious process of critical inquiry to get \nnew insights that s/he can get in formulating action plans \non continuous improvement in the workplace and real-\nlife \n1.3 \nPracticed the habit of critical inquiry and curiosity in the \nworkplace \n1.4 \nShown a thorough knowledge and understanding of how \ncritical thinking impacts on individual lives, the broader \ncommunity and work situations. \n1.5 \nDeveloped practical action plans for improving workplace \nconditions. \n2. Resource \nImplications \n2.1. \nInteractions with specific challenges and situations to \ndemonstrate the application of critical thinking (this would \nusually involve interactions with others). \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Direct questioning combined with review of portfolios of \nevidence and third-party workplace reports of on-the-job \nperformance by the candidate  \n3.2 Evaluation of a candidate blog exploring different ideas \nand questions  \n3.3 Review of candidate response to scenarios that allow the \ncandidate to apply critical thinking techniques to a life or \nwork situation, and to demonstrate ability to portray \ncuriosity and exploration of new concepts \n3.4 Evaluation of candidate response to the challenge of \nadopting different perspectives on a situation, and ability \nto both develop and respond to questions from those \nperspectives \n3.5 Observation of the candidate participating in a group \nproblem-solving session \n3.6 Oral or written questioning to assess knowledge of typical \nblockers to the critical thinking process. \n3.7 Life Narrative Inquiry to reflect life stories that reflect how \ncritical thinking and problem solving is applied in the lives.  \n4. Context for \nAssessment \n4.1. In all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.",
