        "source_text": "SOC323201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nbuilding and maintaining effective relationship with clients.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Maintain a\nprofessional\nimage\n\n1.1 Uniform and personal\ngrooming maintained\n1.2 Personal presence\nmaintained according\nto employer\nstandards\n1.3 Visible work area kept\ntidy and uncluttered\n1.4 Equipment stored\naccording to\nassignment\nrequirements\n1.1 Different modes of\ncommunication\n1.2 Organizational\npolicies\n1.3 Communication\nprocedures and\nsystems\n1.4 Code of Ethics\n1.5 Legal requirements to\npractice and operate\n1.6 Uniform and personal\ngrooming\nrequirements of the\nemployer\n1.7 Occupational health\nand safety\n1.8 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n1.1 Interpersonal\ncommunication\nskills required in\nclient contact\nassignments\n1.2 Customer service\nskills required to\nmeet\nclient/customer\nneeds\n1.3 Deliver correct\ninformation to the\nclient/patient in a\nprofessional\nmanner\n1.4 Treat\npatients/clients\nwith respect\n2. Meet client\nrequirements\n2.1 Client requirements\nidentified and\nunderstood by referral\nto the assignment\ninstructions\n2.2 Client requirements\nmet according to the\nassignment\ninstructions\n2.3 Changes to client’s\nneeds and\nrequirements\nmonitored and\nappropriate action\ntaken\n2.4 All communication\nwith the client or\ncustomer is clear and\ncomplies with\nassignment\nrequirements\n2.1 Different modes of\ncommunication\n2.2 Organizational\npolicies\n2.3 Communication\nprocedures and\nsystems\n2.4 Customer service\n2.5 Telephone\nconversation\ntechniques\n2.6 Problem solving and\nnegotiation\n2.7 Code of Ethics\n\n2.1 Attention to detail\nwhen completing\nclient/employer\ndocumentation\n2.2 Interpersonal\ncommunication\nskills required in\nclient contact\nassignments\n2.3 Client/Customer\nservice skills\nrequired to meet\nclient/customer\nneeds\n2.4 Maintain records\n\n--- PDF PAGE 50 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 46\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Build\ncredibility\nwith clients\n3.1 Client expectations\nfor reliability,\npunctuality and\nappearance adhered\nto\n3.2 Possible causes of\nclient dissatisfaction\nidentified, dealt with\nand recorded\naccording to\nemployer policy\n3.3 Client fully informed\nof all relevant\nsecurity matters in a\ntimely manner and\naccording to agreed\nreporting procedures\n3.1 Different modes of\ncommunication\n3.2 Organizational\npolicies\n3.3 Communication\nprocedures and\nsystems\n3.4 Customer service\nprinciples\n3.5 Code of Ethics\n\n3.1 Demonstrate\ngenuine concern\nfor the welfare of\nthe\nclients/customers\n3.2 Interpersonal\ncommunication\nskills required in\nclient/ patient\ncontact\nassignments\n3.3 Client/Customer\nservice skills\nrequired to meet\nclient/ customer\nneeds\n\n4. Establish\nprofessional\nrelationship\nwith the\nclient\n4.1 Establish relationship\nwithin appropriate\nprofessional\nboundaries\n4.2 Build trust and respect\nthrough use of\neffective\ncommunication\ntechniques\n4.3 Identify and respond\nto client special needs\n4.4 Communicate in ways\nthat take account of\ncultural considerations\n4.5 Exercise discretion\nand confidentiality\n\n4.1 Types of client\nrelationship\nmanagement\n4.2 Main components of\nclient relationship\n4.3 Relative intelligence\n4.4 Effect on customer\nsatisfaction\n4.5 Benefits of customer\nrelationship\nmanagement\n4.6 Improving client\nrelationship\nmanagement\n4.7 Occupational health\nand safety\n6.11 Establishing\nprofessional\nrelationship with\nclient/customer\n6.12 Demonstrate\ngenuine concern\nfor the welfare of\nthe\nclients/customers\n6.13 Interpersonal\ncommunication\nskills required in\nclient/ patient\ncontact\nassignments\n6.14 Client/Customer\nservice skills\nrequired to meet\nclient/ customer\nneeds\n5. Manage\nclient\ninteractions\n5.1 Use a collaborative\nand person-centered\napproach when\nworking with clients\n5.2 Use motivational\ninterviewing as a basis\nfor client interactions\n5.3 Seek client\ninformation\nrespectfully and\nsensitively, using\npurposeful, systematic\nand diplomatic\nquestions\n5.1 Types of client\nrelationship\nmanagement\n5.2 Main components of\nclient relationship\n5.3 Relative intelligence\n5.4 Effect on customer\nsatisfaction\n5.5 Benefits of customer\nrelationship\nmanagement\n5.6 Improving client\nrelationship\nmanagement\n\n5.1 Managing client\ninteractions\n5.2 Establishing\nprofessional\nrelationship with\nclient/customer\n5.3 Demonstrate\ngenuine concern\nfor the welfare of\nthe\nclients/customers\n\n--- PDF PAGE 51 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 47\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5.4 Support the client to\nidentify and articulate\nkey information that\nsupports the provision\nof service\n5.5 Encourage clients to\nvoice queries or\nconcerns and address\nthese appropriately\n5.6 Respond to difficult or\nchallenging behavior\nusing established\ntechniques\n5.7 Maintain professional\nintegrity and\nboundaries at all times\n5.8 Work within scope of\nrole and identify and\nrespond to situations\nwhere interactions\nsuggest the need for\nclient referral\n5.7 Managing client\ninteractions\n5.8 Motivational\nInterviewing\n5.9 Occupational health\nand safety\n\n5.4 Interpersonal\ncommunication\nskills required in\nclient/ patient\ncontact\nassignments\n5.5 Client/Customer\nservice skills\nrequired to meet\nclient/ customer\nneeds\n\n6. Provide\neffective\nresponses to\nclient\nenquiries\n6.1 Select the most\nappropriate mode of\ncommunication for the\ninformation being\nprovided\n6.2 Use language and\nterminology that the\nclient will understand\n6.3 Present information\nclearly and with\nsufficient detail to\nmeet client needs\n6.4 Confirm with client\nthat the information\nhas been understood\nand address any\nunresolved issues\n6.1 Modes of\ncommunication\n6.2 Client language and\nterminology\n6.3 Types of client\nrelationship\nmanagement\n6.4 Main components of\nclient relationship\n6.5 Relative intelligence\n6.6 Effect on customer\nsatisfaction\n6.7 Benefits of customer\nrelationship\nmanagement\n6.8 Improving client\nrelationship\nmanagement\n6.9 Managing client\ninteractions\n6.10 Motivational\nInterviewing\n6.11 Occupational health\nand safety\n\n6.1 Providing effective\nresponses to\nclient enquiries\n6.2 Managing client\ninteractions\n6.3 Establishing\nprofessional\nrelationship with\nclient/customer\n6.4 Demonstrate\ngenuine concern\nfor the welfare of\nthe\nclients/customers\n6.5 Interpersonal\ncommunication\nskills required in\nclient/ patient\ncontact\nassignments\n6.6 Client/Customer\nservice skills\nrequired to meet\nclient/ customer\nneeds\n\n--- PDF PAGE 52 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 48\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanor\n1.5\nGrooming\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n2.2\nEfficiency\n2.3\nClient turn-around time\n3. Client Requirements\nMay include:\n3.1\nAssignment instructions (e.g. right products)\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n4. Assignment Instructions\nMay include:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n5. Client’s Needs and Requirements\nMay include:\n5.1\nReview of the client brief and/or assignment\ninstructions\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\nClarification of client needs and instructions\n7. Clients\nMay include:\nAll members of the public\n\n--- PDF PAGE 53 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 49\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained a professional image.\n1.2 Interpreted client requirements from information contained in the\nclient brief and/or assignment instructions.\n1.3 Dealt successfully with a variety of client interactions.\n1.4 Monitored and acted on varying client or customer needs.\n1.5 Met client requirements.\n1.6 Built credibility with customers/clients.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Assessment centers/venues\n2.2 Accredited assessors\n2.3 Evaluation reports\n2.4 Access to a relevant venue, equipment and materials\n2.5 Assignment instructions\n2.6 Logbooks\n2.7 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n2.8 Assessment Instruments, including personal planner and\nassessment record book\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Written Test/Examination\n3.2 Demonstration with questioning\n3.3 Observation\n4. Context of Assessment\nCompetency may be assessed in the actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 54 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 50\nUNIT OF COMPETENCY\n\n:\nMANAGE OWN PERFORMANCE\n UNIT CODE\n\n:"
