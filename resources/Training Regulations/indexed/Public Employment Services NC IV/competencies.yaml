  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required in\nPUBLIC EMPLOYMENT SERVICES NC IV.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\nUNIT CODE\n:\n500311401\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to use\nspecialized communication skills to meet specific needs of internal and\ninternal clients, conduct interviews, facilitate discussion with groups,\nand contribute to the development of communication strategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common and\nspecific communication\nneeds of clients and\ncolleagues\n1.1 Specific\ncommunication\nneeds of clients\nand colleagues\nare identified\nand met\n1.2 Different\napproaches are\nused to meet\ncommunication\nneeds of clients\nand colleagues\n1.3 Conflict is\naddressed\npromptly in a\nmanner which\ndoes not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n1.3 Communication\nskills relevant to\nclient groups\n1.4 Flexibility in\ncommunication\n\n1.1 Full range of\ncommunication\ntechniques\nincluding:\n1.1.1 Effective\ncommunication\nprocess\n1.1.2 Active listening\n1.1.3 Giving/ receiving\nfeedback\n1.1.4 Interpretation of\ninformation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.1.8 Conduct seminars\n1.1.9 Public speaking\n1.2 Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n--- PDF PAGE 7 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for internal\nand external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work related network\nand relationship are\nmaintained\n2.5 Negotiation and\nconflict resolution\nstrategies are used\nwhere required\n2.5 Communication with\nclients and colleagues\nis performed\nappropriate to\nindividual needs and\norganizational\nobjectives\n2.1 Communication\nprocess\n2.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n2.3 Openness and\nflexibility in\ncommunication\n2.4 Communication\nskills relevant to\nclient groups\n\n2.1 Full range of\ncommunication\ntechniques\nincluding:\n2.1.1 Effective\ncommunication\nprocess\n2.1.2 Active listening\n2.1.3 Giving/ receiving\nFeedback\n2.1.4 Interpretation of\ninformation\n2.1.5 Role boundaries\nsetting\n2.1.6 Negotiation\n2.1.7 Establishing\nempathy\n2.1.8 Openness and\nflexibility in\ncommunication\n2.2 Communication\n skills required to\n fulfill job roles as\n specified by the\n organization\n3. Deliver a technical\npresentation\n3.1 Presentation is\ndelivered clearly,\nsequential and\ndelivered within\nallotted time\n3.3 Utilize appropriate\nmedia to enhance\npresentation\n3.4 Differences in\nviews/opinions are\nrespected\n3.5 Questions during fora\nare responded in a\nmanner consistent\nwith organizational\nstandard\n3.1 Communication\nprocess\n3.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n3.3 Openness and\nflexibility in\ncommunication\n3.4 Communication\nskills relevant to\nclient groups\n\n3.1 Full range of\ncommunication\ntechniques\nincluding:\n3.1.1 Effective\ncommunication\nprocess\n3.1.2 Active listening\n3.1.3 Giving/receiving\nfeedback\n3.1.4 Interpretation of\ninformation\n3.1.5 Role boundaries\nsetting\n3.1.6 Negotiation\n3.1.7 Establishing\nempathy\n3.1.8 Openness and\nflexibility in\ncommunication\n\n--- PDF PAGE 8 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3.19 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n4. Represent the\norganization\n4.1 When participating\nin internal or\nexternal forums,\npresentation is\nrelevant,\nappropriately\nresearched and\npresented in a\nmanner to promote\nthe organization\n4.2 Presentation is clear\nand sequential and\ndelivered within a\npredetermined time\n4.3 Utilize appropriate\nmedia to enhance\npresentation\n4.4 Differences in views\nare respected\n4.5 Written\ncommunication is\nconsistent with\norganizational\nstandards\n4.6 Inquiries are\nresponded in a\nmanner consistent\nwith organizational\nstandard\n4.7 Consolidate ideas\nand suggestions\n4.8 Generalize and\nsummarize all ideas\nand suggestions\n\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n4.3 Openness and\nflexibility in\ncommunication\n4.4 Communication\n skills relevant to\n client groups\n\n4.1 Full range of\ncommunication\ntechniques\nincluding:\n4.1.1 Effective\ncommunication\nprocess\n4.1.2 Active listening\n4.1.3 Giving/ receiving\nfeedback\n4.1.4 Interpretation of\ninformation\n4.1.5 Role boundaries\nsetting\n4.1.6 Negotiation\n4.1.7 Establishing\nempathy\n4.1.8 Openness and\nflexibility in\ncommunication\n4.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 9 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 5\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Facilitate group\ndiscussion\n5.1 Mechanisms which\nenhance effective\ngroup interaction is\ndefined and\nimplemented\n5.2 Strategies which\nencourage all group\nmembers to\nparticipate are used\nroutinely\n5.3 Objectives and\nagenda for meetings\nand discussions are\nroutinely set and\nfollowed\n5.4 Relevant information\nis provided to group\nto facilitate\noutcomes\n5.5 Evaluation of group\ncommunication\nstrategies is\nundertaken to\npromote\nparticipation of all\nparties specific\ncommunication\nneeds of individuals\nare identified and\naddressed\n5.1 Communication\nprocess\n5.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n5.3 Openness and\nflexibility in\ncommunication\n5.4 Communication\nskills relevant to\nclient groups\n\n5.1 Full range of\ncommunication\ntechniques including:\n5.1.1 Effective communication\nprocess\n5.1.2 Active listening\n5.1.3 Giving/receiving\nfeedback\n5.1.4 Interpretation of\ninformation\n5.1.5 Role boundaries setting\n5.1.6 Negotiation\n5.1.7 Establishing empathy\n5.1.8 Openness and flexibility\nin communication\n5.2 Communication skills\nrequired to fulfill job roles\nas specified by the\norganization\n\n6. Conduct\ninterview\n6.1 A range of\nappropriate\ncommunication\nstrategies are\nemployed in\ninterview situations\n6.2 Records of\ninterviews are made\nand maintained in\naccordance with\norganizational\nprocedures\n6.3 Effective questioning,\nlistening and\nnonverbal\ncommunication\ntechniques are used\nto ensure that\nrequired message is\ncommunicated\n6.1 Communication\nprocess\n6.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n6.3 Effective\nquestioning\ntechniques\n6.3 Communication\nskills relevant to\nclient groups\n\n6.1 Full range of\ncommunication\ntechniques including:\n6.1.1 Effective communication\nprocess\n6.1.2 Active listening\n6.1.3 Giving/ receiving\nfeedback\n6.1.4 Interpretation of\ninformation\n6.1.5 Role boundaries setting\n6.1.6 Negotiation\n6.1.7 Establishing empathy\n6.2 Effective clarifying and\nprobing techniques\n(questioning skills)\n6.3 Communication skills\nrequired to fulfill job roles\nas specified by the\norganization\n\n--- PDF PAGE 10 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\n\nMay include:\n1.1\nRecognizing own limitations\n1.2\nReferral to specialists\n1.3\nUtilizing techniques and aids\n1.4\nProviding written drafts\n1.5\nVerbal and non verbal communication\n2. Effective group\ninteraction\nMay include:\n2.1\nIdentifying and evaluating what is occurring\nwithin an interaction in a non judgmental way\n2.2\nUsing active listening\n2.3\nMaking decision about appropriate words,\nbehavior\n2.4\nPutting together response which is culturally\nappropriate\n2.5\nExpressing an individual perspective\n2.6\nExpressing own philosophy, ideology and\nbackground and exploring impact with\nrelevance to communication\n2.7\nOpenness and flexibility in communication\n3. Types of Interview\nMay include:\n3.1\nRelated to staff issues\n3.2\nRoutine\n3.3\nConfidential\n3.4\nEvidential\n3.5\nNon disclosure\n3.6\nDisclosure\n4. Interview situations\nMay include:\n4.1\nEstablish rapport\n4.2\nElicit facts and information\n4.3\nFacilitate resolution of issues\n4.4\nDevelop action plans\n4.5\nDiffuse potentially difficult situation\n\n--- PDF PAGE 11 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated effective communication skills with clients\naccessing service and work colleagues\n1.2 Adopted relevant communication techniques and\nstrategies to meet client particular needs and difficulties\n2. Resource\nImplications\n2.1 Access to appropriate workplace where assessment can\ntake place\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Case Study\n3.2 Interview\n3.3 Portfolio\n3.4 Written Test\n3.5 Role Play\n4. Context for\nAssessment\n4.1 This unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 12 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 8\nUNIT OF COMPETENCY :\nDEVELOP AND LEAD TEAMS\n\nUNIT CODE\n:\n500311402\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ndetermine individual and team development needs and facilitate the\ndevelopment of the workgroup.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Foster individual\ngrowth\n1.1 Learning and\ndevelopment needs\nof team members are\nsystematically\nidentified in line with\norganizational\nrequirements\n1.2 Development plan to\nmeet individual needs\nis collaboratively\ndeveloped and\nimplemented\n1.3 Individuals are\nencouraged to self -\nevaluate performance\nand identify areas for\nimprovement\n1.4 Feedback on\nperformance of team\nmembers is collected\nfrom relevant sources\nand compared with\nestablished team\nlearning process\n1.1 Effective\nworkplace\ncommunication,\ncoaching and\nmentoring\nprinciples\n1.2 Feedback\nprinciples and\nprocedures\n1.3 Working\ninterdependently:\nstrategies and\ntechniques\n1.4 Leadership\nConcepts:\n• Types of\nDecisions\nTeams Make\n• Team\nResponsibilities\n• Problems That\nAffect Teams\n• Building Strong\nTeam\nCommunication\n• Expressing\nYourself on a\nTeam\n• Team Problem\nSolving\n\n1.1 Ability to read and\nunderstand a\nvariety of texts,\nprepare general\ninformation and\ndocuments\naccording to target\naudience; spell\nwith accuracy; use\ngrammar and\npunctuation\neffective\nrelationships and\nconflict\nmanagement\n1.2 Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n1.3 Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n1.4 Ability to relate to\npeople from a\nrange of social,\ncultural, physical\nand mental\nbackgrounds\n1.5 Planning skills to\norganize required\nresources and\nequipment to meet\nlearning needs\n\n--- PDF PAGE 13 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 9\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1.6 Reporting skills to\norganize\ninformation;\nassess information\nfor relevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n1.7 Facilitation skills to\nconduct small\ngroup training\nsessions\n2. Foster individual\nand team\ngrowth\n2.1. Learning and\ndevelopment program\ngoals and objectives\nare identified to match\nthe specific knowledge\nand skills requirements\nof competency\nstandards\n2.2. Learning delivery\nmethods are\nappropriate to the\nlearning goals, the\nlearning style of\nparticipants and\navailability of\nequipment and\nresources\n2.3. Workplace learning\nopportunities and\ncoaching/ mentoring\nassistance are\nprovided to facilitate\nindividual and team\nachievement of\ncompetencies\n Resources and\ntimelines required for\nlearning activities are\nidentified and\napproved in\naccordance with\norganizational\nrequirements\n2.1 Advanced\ncoaching and\nmentoring\ntechniques\n2.2 Performance\nevaluation\nconcepts\n2.3 Training and\ndevelopment\ntechniques\n\n2.1 Instructional\nplanning and\ndelivery skills\n2.2 Monitoring and\nevaluation skills\n2.3 Mentoring and\n coaching skills\n\n--- PDF PAGE 14 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 10\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from\nindividuals or teams is\nused to identify and\nimplement\nimprovements in future\nlearning arrangements\n3.2 Outcomes and\nperformance of\nindividuals/teams are\nassessed and\nrecorded to determine\nthe effectiveness of\ndevelopment programs\nand the extent of\nadditional support\n3.3 Modifications to\nlearning plans are\nnegotiated to improve\nthe efficiency and\neffectiveness of\nlearning\n3.3 3.4 Records and\nreports of competency\nare maintained within\norganizational\nrequirement\n3.1 Types and levels\nof learning\nevaluation\n3.2 Learning styles\nand strategies\n3.3 Training and\ndevelopment\napproaches\n\n3.1 Instructional\nplanning and\ndelivery skills\n3.2 Monitoring and\nevaluation skills\n3.3 Mentoring and\ncoaching skills\n4. Develop team\ncommitment\nand cooperation\n4.1 Open communication\nprocesses to obtain\nand share information\nis used by team\n4.2 Decisions are reached\nby the team in\naccordance with its\nagreed roles and\nresponsibilities\n4.3 Mutual concern and\ncamaraderie are\ndeveloped in the team\n4.4 Career planning for\neach member are\nmonitored\n4.1 Career\ndevelopment for\ngroup members\n4.2 Principles of team\ncommitment and\ncooperation\n4.3 Team dynamics\nand performance\n4.1 Instructional\nplanning and\ndelivery skills\n4.2 Monitoring and\nevaluation skills\n4.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 15 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 11\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Facilitate\naccomplishment\nof team goals\n5.1 Team members\nactively participated in\nteam activities and\ncommunication\nprocesses\n5.2 Teams members\ndeveloped individual\nand joint responsibility\nfor their actions\n5.3 Collaborative efforts\nare sustained to attain\norganizational goals\n5.1 Group\nDevelopment\nProcess and\nPrinciples as\napplied in the\nworkplace\n5.2 Principles of\norganizational\ndevelopment\n5.3 Collaboration\nprinciples and\nprocedures\n5.1\nInstructional\nplanning and\ndelivery skills\n5.2\nMonitoring and\nevaluation skills\n5.3\nMentoring and\ncoaching skills\n4.4 Organizational\nleadership\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Learning and\n development needs\n\nMay include:\n1.1 Coaching, mentoring and/or supervision\n1.2 Formal/informal learning program\n1.3 Internal/external training provision\n1.4 Work experience/exchange/opportunities\n1.5 Personal study\n1.6 Career planning/development\n1.7 Performance appraisals\n1.8 Workplace skills assessment\n1.9 Recognition of prior learning\n1.10 Job design and enrichment\n2. Organizational\n requirements\nMay include:\n2.1 Quality assurance and/or procedures manuals\n2.2 Goals, objectives, plans, systems and\nprocesses\n2.3 Legal and organizational policy/guidelines and\n requirements\n2.4 Safety policies, procedures and programs\n2.5 Confidentiality and security requirements\n2.6 Business and performance plans\n2.7 Ethical standards\n2.8 Quality and continuous improvement\nprocesses and standards\n3. Feedback on\n performance\nMay include:\n3.1 Formal/informal performance appraisals\n3.2 Obtaining feedback from supervisors and\nColleagues\n3.3\nObtaining feedback from clients\n3.4\nPersonal and reflective behavior strategies\n3.5\nRoutine and organizational methods for\nmonitoring service delivery\n\n--- PDF PAGE 16 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 12\n4. Learning delivery\n methods\nMay include:\n4.1 On the job coaching or mentoring\n4.2 Problem solving\n4.3 Presentation/demonstration\n4.4 Formal course participation\n4.5 Work experience\n4.6 Involvement in professional networks\n4.7 Conference and seminar attendance\n4.8 Induction\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for\nothers\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the\nteam\n1.4. Negotiated learning plans to improve the effectiveness of\nlearning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation of work activities of the individual member in\nrelation to the work activities of the group\n3.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 17 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 13\n UNIT OF COMPETENCY :\nPERFORM HIGHER-ORDER THINKING PROCESSES AND\nAPPLY TECHNIQUES IN THE WORKPLACE\n UNIT CODE\n: 500311403\n UNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required\nto use fundamental critical thinking skills in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Evaluate\neffectiveness\nand efficiency\nof the\nworkplace\nsystems,\nprocesses and\nprocedures.\n1.1 Effectiveness and\nefficiency of\nworkplace standards\nand procedures are\nexamined.\n1.2. Usage of inquiry and\ndialogue to\ncommunicate\nevaluation measures\nand results are\nimplemented.\n1.3 Evaluation reports are\nprepared and\ncommunicated to team\nmembers.\n\n1.1 Systems,\nstandards,\nprocedures and\nprotocols in the\nworkplace.\n1.2 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations\n1.3 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n1.4 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n1.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n1.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n1.3 Using critical\nthinking pathway to\nformulate and ask\nrelevant questions\nand come up with\nappropriate\nanswers.\n1.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n1.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n\n--- PDF PAGE 18 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 14\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster the\nhabit of critical\ninquiry and\ncuriosity in the\nworkplace.\n2.1 Issues and situations\nare reflected on and\nwondered about.\n2.2 Issues and problems\nin the workplace\nparticularly in the\npolicies, procedures\nand protocols are\ndiscussed and\nevaluated between\nand among teams.\n2.3 Evaluation of\nefficiency and\neffectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated and\nagreed upon between\nand among teams.\n2.4 Growth mindset and\npositive relationship\nand communication is\napplied in the context\nof curiosity and\ncritical inquiry in the\nworkplace.\n2.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n2.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n2.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n2.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n2.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n2.3 Using critical\nthinking pathway to\nformulate and ask\nrelevant questions\nand come up with\nappropriate\nanswers.\n2.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n2.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n2.6 Communicating\ninsights on\nworkplace\neffectiveness and\nefficiency.\n\n--- PDF PAGE 19 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 15\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Develop\npractical\naction plans\nfor improving\nworkplace\nconditions.\n3.1 Evaluation of efficiency\nand effectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated to\nstakeholders.\n3.2 Practical action plans\nin improving workplace\nconditions are\nformulated, presented\nand negotiated with\nstakeholders.\n3.3 Proposed changes and\ndirections are inquired,\nprocessed and\nnegotiated between\nand among teams, and\nstakeholders as well of\nthe organization.\n3.4 Commitment to\ncontinuous\nimprovement and\nchange is highlighted.\n3.5 Passion and dedication\nfor changing and\nadapting to the\ndemands of the 21st\ncentury workplace are\nconsidered.\n3.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n3.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n3.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n3.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n3.5 Creative\nnegotiation skills.\n3.6 Change\nmanagement and\ncontinuous\nimprovement\nconcepts.\n3.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n3.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n3.3 Using critical thinking\npathway to formulate\nand ask relevant\nquestions and come\nup with appropriate\nanswers.\n3.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n3.5 Assessing and\nmeasuring the extent\nof effectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n3.6 Communicating\npractical insights on\nimproving workplace\nconditions.\n\n--- PDF PAGE 20 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 16\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Effectiveness and\nefficiency\nMay include;\n1.1 Developing a more efficient way of doing\nsomething\n1.2 Developing a new idea\n1.3 Developing and improving products and\nservices\n1.4 Enhancing skills and career opportunities\n1.5 Enhancing the physical environment\n1.6 Financial benefit\n1.7 Greater personal satisfaction\n1.8 Improving interpersonal relationships\n1.9 Evaluating overall workplace conditions\n2. Curiosity and critical\ninquiry\nMay include:\n2.1\nAccuracy\n2.2\nBreadth\n2.3\nClarity\n2.4\nDepth\n2.5\nEmotion\n2.6\nFairness\n2.7\nLogic\n2.8\nMeaning\n2.9\nPlanning\n2.10\nAttention\n2.11\nPrecision\n2.12\nRelevance\n2.13\nSignificance\n2.14\nSocial engagement\n2.15\nSociety\n2.16\nStyle\n2.17\nGrowth mindset\n2.18\nPositive communication\n2.19\nPositive negotiation\n2.20\nWorkplace conditions\n2.21\nAppreciative inquiry methods\n\n--- PDF PAGE 21 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 17\nVARIABLE\nRANGE\n3. Practical action plans\nMay include:\n3.1\nInsights on continuous improvement\n3.2\nCreative strategies and techniques for\nbecoming better at work and real life\n3.3\nCareer plans\n3.4\nChallenging workplace policies, procedures\nand protocols\n3.5\nSpecifying plans for change and adapting to\nthe demands of the contemporary workforce\n3.6\nChallenges in negotiating with stakeholders\nand teams\n3.7\nChange management, innovation and\nknowledge creation\n3.8\nContractual agreements\n3.9\nExtreme time pressure or non-negotiable\ndeadlines\n3.10 Financial limitations\n3.11 Procedures determined by laws or other\nregulations\n3.12 Safety issues\n3.13 When others are totally closed to new ideas\n3.14 Acknowledging shared responsibility\n3.15 Adopting a positive 'can do' attitude\n3.16 Following up on practical details\n3.17 Pro-actively seeking information\n3.18 Suggesting a new approach\n3.19 Talking to others about possible answers\n3.20 Constraints of the broader context and\nenvironment\n3.21 Overall goal - what needs to be achieved\n3.22 Personal hopes and expectations\n\n--- PDF PAGE 22 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 18\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated the effectiveness and efficiency of workplace\nsystems, processes and procedures.\n1.2\nModelled the conscious process of critical inquiry to get\nnew insights that s/he can get in formulating action plans\non continuous improvement in the workplace and real-\nlife\n1.3\nPracticed the habit of critical inquiry and curiosity in the\nworkplace\n1.4\nShown a thorough knowledge and understanding of how\ncritical thinking impacts on individual lives, the broader\ncommunity and work situations.\n1.5\nDeveloped practical action plans for improving workplace\nconditions.\n2. Resource\nImplications\n2.1.\nInteractions with specific challenges and situations to\ndemonstrate the application of critical thinking (this would\nusually involve interactions with others).\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct questioning combined with review of portfolios of\nevidence and third-party workplace reports of on-the-job\nperformance by the candidate\n3.2 Evaluation of a candidate blog exploring different ideas\nand questions\n3.3 Review of candidate response to scenarios that allow the\ncandidate to apply critical thinking techniques to a life or\nwork situation, and to demonstrate ability to portray\ncuriosity and exploration of new concepts\n3.4 Evaluation of candidate response to the challenge of\nadopting different perspectives on a situation, and ability\nto both develop and respond to questions from those\nperspectives\n3.5 Observation of the candidate participating in a group\nproblem-solving session\n3.6 Oral or written questioning to assess knowledge of typical\nblockers to the critical thinking process.\n3.7 Life Narrative Inquiry to reflect life stories that reflect how\ncritical thinking and problem solving is applied in the lives.\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 23 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 19\nUNIT OF COMPETENCY : CONTRIBUTE TO THE PRACTICE OF SOCIAL JUSTICE\n\n IN THE WORKPLACE\nUNIT CODE\n: 500311404\nUNIT DESCRIPTOR\n: This unit covers ways and means to assume active roles in\nresolving local and global challenges and to become proactive\ncontributors to a more peaceful and sustainable world.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Update self\non local,\nnational and\nglobal\ntrends/\nissues in the\nworkplace\n1.1 Media are regularly\nscanned/ monitored\nfor trends and issues\nrelevant to human\nrights, gender equality,\npromotion of culture of\npeace and non-\nviolence, global\ncitizenship and\nappreciation of cultural\ndiversity.\n1.2 Knowledge and\nunderstanding of local,\nnational and global\nissues and their\ninterconnectedness and\ninterdependency are\nacquired.\n1.3 Notable issues and\ntrends are critically\nexamined and\ndiscussed with peers,\ncolleagues, or family\nmembers.\n1.1 Local, national\nand global\nsystems and\nstructures\n1.2 Issues affecting\ninteraction and\nconnectedness\nof communities\nat local, national\nand global levels\n1.3 Underlying\nassumptions\nand power\ndynamics\n(politics,\nunderstanding\npolitical system,\nsocial\nstructures, labor\nlaws, labor\nrelations, human\nright)\n\n1.1 Monitoring trends\nand issues\nrelevant to human\nrights, gender\nequality, culture of\npeace, global\ncitizenship, and\ncultural diversity\nusing different\nmedia platforms\n1.2 Analyzing trends\nand issues\nrelevant to human\nrights, gender\nequality, culture of\npeace, global\ncitizenship, and\ncultural diversity\n1.3 Engaging in\ndiscourse about\nthe local, national\nand global issues\n\n--- PDF PAGE 24 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 20\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Relate local\nand global\ntrends to\nworkplace\ncontext\n2.1 Local events are\nreflected on for\nimplications in one’s\nown situation and in the\nexternal global\nenvironment.\n2.2 Sense of belonging to a\ncommon humanity,\nsharing values and\nresponsibilities are\ndeveloped.\n2.3 Attitudes of empathy,\nsolidarity and respect\nfor differences and\ndiversity are\nstrengthened.\n2.1 Different levels of\nhuman identity\naccording to\nAmber Mayer\n(2015)\n2.2 Different\ncommunities\npeople belong to\nand how these\nare connected\n2.3 Difference and\nrespect for\ncultural diversity\n2.1 Recognizing\ndifferences and\ncommonalities\namong people\n2.2 Strengthening\nattitudes of\nempathy, solidarity\nand respect for\ndiversity\n2.3 Connecting local\nissues to global\ntrends, and vice\nversa.\n3. Engage and\ntake actions\non workplace\nissues and\nconcerns\n3.1 Effective and\nresponsible actions at\nlocal, national and\nglobal levels are\nidentified.\n3.2 Motivation and\nwillingness to take\nnecessary actions are\ndeveloped.\n3.3 Attitude of “thinking\nglobally and acting\nlocally” is practiced.\n3.1 Actions that can\nbe taken\nindividually and\ncollectively\n3.2 Ethically\nresponsible\nbehaviour\n3.3 Importance and\nbenefits of civic\nengagement\n3.4 Strategies and\ntechniques of\n“thinking globally\nand acting\nlocally\n3.1 Employing\nappropriate actions\nto address\nworkplace issues\ninvolving national\nand global trends\n3.2 Showing concern\nand willingness to\ntake part in the\ndevelopment\nefforts to discuss\nworkplace issues\nand concerns\n3.3 Applying the\nattitude of “thinking\nglobally and acting\nlocally” in the\nworkplace\n\n--- PDF PAGE 25 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 21\n RANGE OF VARIABLES\n\n EVIDENCE GUIDE\n\nVARIABLE\nRANGE\n1. Media\nMay include but not limited to:\n1.1\nPrint media\n1.2\nBroadcast media\n1.3\nInternet and social media\n2. Scanning/Monitoring\nMay include but not limited to:\n2.1\nSourcing from key informants\n2.2\nConversation with clients\n2.3\nMan-on-the-street conversation\n2.4\nScanning print and broadcast media\n3. Local, national and global issues\n\nMay include but not limited to:\n3.1\nPoverty\n3.2\nUnemployment\n3.3\nGlobal warming\n3.4\nSafety, security, and well-being\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability and attitude to keep oneself updated of\nrelevant issues/trends\n1.2 Demonstrated ability to think and act based on one’s\nprinciples and values\n1.3 Demonstrated a holistic/global outlook on internal and\nexternal events in the workplace\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Case studies\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning\n3.2\nCase problems involving global and local issues\n3.3\nThird-party report\n4. Context for\nAssessment\n4.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 26 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 22\nUNIT OF COMPETENCY :\nMANAGE INNOVATIVE WORK INSTRUCTIONS\nUNIT CODE\n :\n500311405\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\n\nsustain and develop a workplace environment in which\nimprovement, innovation and learning are promoted and\nreinforced.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Review and\nanalyze existing\nworkplace\npractices\n1.1 Current instructions\nand strategies to\nperform tasks in the\nworkplace are\nreviewed\n1.2 Climate for\ninnovation at the\norganizational level\nis defined\n1.3 Innovation drivers in\nthe workplace are\nidentified\n1.1. Four drivers of\ninnovation\naccording to\nGallup\nManagement\nJournal (2007)\n1.2. Contextual\nvariables related\nto innovative\npractices in the\norganization\n1.3. The nine\ndimensions of\ninnovation\nclimate (Isaksen\n& Isaksen, 2018)\n1.4. Types of\nInnovation\nidentified by\nGopalakrishnan\nand Damanpour\n(1997)\n1.1 Investigating the\norganizational\nneeds in the\ninnovation process\n1.2 Defining current\norganizational\ninnovative\npractices\n1.3 Linking innovation\nto contextual\nvariables in the\norganization\n2. Examine\nopportunities for\ncontinuous\nimprovement\nand innovation\nof practices in\nthe workplace\n2.1. Effectiveness of\ninnovative practices\nin the workplace is\ndetermined\n2.2. Innovative\nbehaviors of leaders\nor managers in the\norganization are\nassessed\n2.3. Driving principles of\ninnovation are\ndiscussed\n2.1 Determinants of\ninnovative\nbehavior by Scott\nand Bruce (1992)\n2.2 Four principles of\ninnovation\naccording to\nGallup\nManagement\nJournal (2007)\n\n2.1 Evaluating\norganizational\ninnovative\npractices\n2.2 Gauging innovative\nbehaviors of the\nleaders and\nmanagers in the\norganization\n2.3 Deliberating\nopportunities and\nchallenges in\nimplementing\ninnovation\n\n--- PDF PAGE 27 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 23\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Implement\ninnovative ways\nin the conduct\nof usual\nworkplace\npractices\n3.1. Innovative behaviors\nin the workplace are\nperformed\n3.2. Innovative climate in\nthe workplace is\nmaintained\n3.3. Adoption or\nmodification of new\nideas relevant to the\norganizational needs\nis achieved\n3.1 Determinants of\ninnovative\nbehavior by Scott\nand Bruce (1992)\n3.2 The nine\ndimensions of\ninnovation climate\n(Isaksen &\nIsaksen, 2018)\n3.3 Techniques in\nimplementing\ninnovative change\nin the workplace\n\n3.1 Developing risk\nmanagement\ntechniques and\ncontrol systems\n3.2 Evaluating impact\nof changes and\ndeveloping action\nplans\n3.3 Demonstrating\nstrategies and\ntechniques in\nmanaging changes\nin the workplace\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Innovation\nMay include:\n1.1 Products versus processes\n1.2 Radical versus incremental\n1.3. Technical versus administrative\n2. Innovative\nbehaviors\nMay include:\n2.1 Always generate creative ideas or new solutions\n2.2 Exploring and secure funds or resources required for\nimplementing new ideas\n2.3 Establishing adequate plans and schedules for implementing\nnew ideas\n2.4 Contributing suggestions or approaches for others’ creative\nideas\n\n--- PDF PAGE 28 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 24\n EVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nAnalyzed and evaluated systems and\nperformance in key areas of the organization and\nidentify opportunities for improvement, seeking\nadvice from experts as appropriate\n1.2\nPromoted the value of creativity, innovation and\nsustainability and recognize successes\n1.3\nSupported the testing and trialing of new ideas\nand undertake risk management and cost-benefit\nanalysis for options\n1.4\nPlanned for and implemented improvements\nusing organization’s processes for approvals,\nproject management and change management\n1.5\nFacilitated effective contributions to and\ncommunications about continuous improvement\nand innovation\n1.6\nCaptured insights, experiences and ideas for\nimprovements and incorporate them into the\norganization’s knowledge management systems\nand future planning.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Impact evaluation materials (guide and form)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Interview\n3.2 Written Evaluation\n3.3 Case analysis\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 29 ---\nPUBLIC EMPLOYMENT SERVICES NC IV Promulgated (12/17/2019) 25\nUNIT OF COMPETENCY\n:\nMANAGE AND EVALUATE USAGE OF INFORMATION\nUNIT CODE\n: 500311406\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills and attitudes\nrequired to support\n\nELEMENTS\n\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Review\ninformation\nneeds and\nsources\n1.1. The information needs\nof individuals/teams are\ndetermined and the\nsources are identified.\n1.2. Information held by the\norganisation is\nreviewed to determine\nsuitability and\naccessibility.\n1.3. Plans are prepared to\nobtain information that\nis not available or\naccessible within the\norganiza