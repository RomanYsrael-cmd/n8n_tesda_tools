to the integration of health \nand safety into all workplace activities.\n\n--- PDF PAGE 76 ---\nPUBLIC EMPLOYMENT SERVICES NC IV                 Promulgated (12/17/2019)                72 \nVARIABLE \nRANGE \n9.3   The commitment to comply with applicable OSH legal \nrequirements and other requirements – or better, the \nintention to treat applicable health and safety legislation as a \nminimum standard rather than maximum. \n9.4    Responsibility of appropriate personnel in maintaining a \nhealthy and safe workplace and to protect the well-being of \nall persons in the workplace. \n9.5    Accountability of all levels of management for carrying out \nhealth and safety responsibilities. \n9.6    Importance of consultation and co-operation between \nmanagement and employees for effective implementation of \npolicy and any related programs. \n9.7    Commitment to continual improvement by conducting regular \nreviews of the policy, \n9.8    Commitment to monitor the policy’s effectiveness by having \na method for setting and reviewing OSH objectives and \ntargets. \n9.9    That the policy will be documented, posted, and \ncommunicated internally as well as externally, as \nappropriate, and \n9.10    Commitment to provide adequate funds and details of how \nmoney will be available. \n \n10. Safe Work Practices \nMay include: \n10.1    Name or description of the work task \n10.2    Date the SWP was created and date it was last reviewed or  \n           revised \n10.3    Hazards that may cause harm to a worker \n10.4    Common signs and symptoms of a musculoskeletal injury   \n           if the Hazards of the job task could lead to this type of  \n           injury \n10.5    Equipment / devices, personal protective equipment (PPE),   \n     or   other safety considerations necessary to perform the  \n     task safely \n10.6    Required training and / or relevant documentation needed   \n           to perform the task safely \n10.7    Steps to perform the task safely including safe body   \n     positions and / or movements as appropriate \n10.8   Indication that workers are to be trained on the SWP and  \n    employers must ensure that workers follow them\n\n--- PDF PAGE 77 ---\nPUBLIC EMPLOYMENT SERVICES NC IV                 Promulgated (12/17/2019)                73 \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nMaximized effective and efficient management/utilization of \nresources is maximized in accordance with existing \nguidelines. \n1.2 \nDesigned and implemented strategies to identify skill and \nknowledge gaps with workers, and strategies to address \nthese gaps in accordance with program mandates \n1.3 \nOriented new staff into the workplace OSH system \n2. Resource \nImplications \nThe following resources should be provided: \n2.1       Workplace appropriate for the unit of competency \n2.2       Office supplies and materials appropriate for the unit of   \n             competency \n2.3       Office equipment and fixture appropriate for the unit of  \n      competency \n2.4       Internet connectivity \n3. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 \nWritten examination \n3.2 \nDemonstration with oral questioning \n \n4. Context of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
