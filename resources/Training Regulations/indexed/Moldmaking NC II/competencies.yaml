        "source_text": "ALT722308\n\nUNIT DESCRIPTOR :\nThis unit covers assembling and testing complex engineering\ncomponents and mechanical assemblies in a production,\nmanufacturing environment.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Read and\nunderstand\ndrawings, job\nsheets and\nspecifications\n1.1 Drawings, job instructions and specifications are interpreted\nand task requirements understood including settings in\naccordance with workplace procedures\n1.2 Components/sub-assemblies are checked against\nspecifications in the drawing, job sheet, assembly list or\nequivalent instructions.\n1.3 Tools, equipment and components/sub-assemblies are\nselected to meet job requirements\n1.4 Fitting requirements and sequential assembly planning are\ncarried out where applicable.\n2. Assemble\ncomponents\n2.1 Defective or faulty components/sub-assemblies are identified\nand processed according to standard operating procedure.\n2.2 Components/sub-assemblies is correctly prepared for\nassembly.\n2.3 Techniques and principles appropriate to the job\nrequirements are applied in assembly activity.\n2.4 Records/inputs are accurately maintained or processed.\n2.5 Components of mold are fitted to ensure correct positioning\nand conformance with specifications.\n2.6 Mold is tested to ensure that components interface/ interact\naccording to operational specifications.\n2.7 First-off sample products are evaluated and compared with\nstandard of acceptance\n3. Perform final\nadjustments\n3.1 Final adjustments are performed on assembly to ensure\nalignment with operational specifications.\n3.2 Faults are identified for rework or, where the fault is outside\nthe scope of the workstation, processed according to\nstandard operating procedure.\n3.3 The assembly is correctly marked/tagged according to\nstandard operating procedure.\n3.4 Components and/or mold assembly are handled and stored\naccording to standard operating procedures and in a manner\nleast likely to cause damage.\n3.5 Procedures are undertaken in response to emergency in\naccordance with workplace procedures\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sample product\nSample product made of:\n1.1 Polyethylene, poly vinyl chloride, polypropylene,\npolycarbonate, etc\n1.2 Additives to improve\n1.2.1 Impact resistance\n1.2.2 Anti-static property\n1.2.3 Colorant\n1.2.4 Ultra-violet property\n1.3 Product requirement\n1.3.1 Volume of content\n1.3.2 Section thickness\n1.3.3 Product weight\n1.3.4 Product color range\n1.3.5 Cap design\n1.3.6 With printing or decoration\n2. Standard of acceptance\n2.1 Weight of the product\n2.2 Alignment of mold halves (fixed / movable) parting line\n2.3 Uniform thickness of the product\n2.4 Volume of product content\n2.5 Bottom rocking\n2.6 Misaligned neck cap thread product\n3. Final adjustment\nAdjustments based on predetermined standards of quality\nand safety:\n3.1 Clearances\n3.2 Mesh\n3.3 Tension\n3.4 Level\n3.5\nAlignment etc.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n34\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted and understood drawings, job sheets and\nspecifications\n1.2 Checked components against specifications\n1.3 Assembled and tested assembly\n1.4 Evaluated first-off sample products and made final\nadjustments\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Fitting requirements\n2.2 Uses of relevant tools and equipment\n2.3 Sequence in which the tasks are to be performed\n2.4 Sources of the component / sub-assemblies\n2.5 Required action for tests and checks\n2.6 Required action for non-conformance\n2.7 Damage to components and/or assemblies through the\nuse of inappropriate handling and/or unsafe storage\nprocedures\n2.8 Relevant record keeping requirements\n2.9 Use and application of personal protective equipment\n2.10 Safe work practices and procedures\n2.11 Hazards and control measures associated with precision\nassembly.\n2.12 Fire hazards\n2.13 Torque requirements of sub-assembly and main assembly\n2.14 Type oil seal use\n2.15 Safe work practice\n2.16 Attention to details, Perseverance and Honesty\n3. Underpinning skills\n3.1 Planning skills\n3.2 Reading and interpreting drawings, routine information on\nwritten job instructions, specifications and standard\noperating procedures\n3.3 Preparing a sequential assembly plan\n3.4 Selecting and sourcing appropriate tools, components and\nsub-assemblies\n3.5 Following job instructions\n3.6 Identifying faulty components\n3.7 Entering routine and familiar information onto proformas\nand standard workplace forms\n3.8 Using hand tools and manual power tools\n3.9 Dimensional measurement skills\n3.10 Cleaning and lubricating parts/ sub-components\n3.11 Application of safe work practices\n3.12 Use of personal protective equipment\n3.13 Use of fire fighting equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Operating plant or equipment that allows for realistic\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n35\nsimulation.\n4.2 Tools, equipment and workplace relevant with the\nrequirements for the job.\n4.3 Supplies and consumable materials\n4.4 Relevant workplace procedures, product and\nmanufacturing specifications, codes, standards, manuals\nand reference materials\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written assessment\n5.3\nPortfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or a simulated workplace environment.\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n36"
