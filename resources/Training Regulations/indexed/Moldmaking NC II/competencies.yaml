  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in MOLDMAKING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from appropriate\nsources\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous manner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are asked\nand responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments\n3.3\nBasic mathematical processes are used for routine calculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed according\nto organizational guidelines\n\n--- PDF PAGE 5 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n4\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple written\nnotices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the workplace\n3.8\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\n5.1\nDirect Observation\n5.2\nOral interview and written test\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 7 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n5\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2 Team parameters, reporting relationships and\nresponsibilities are identified from team discussions and\nappropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1 Individual role and responsibilities within the team\nenvironment are identified\n2.2 Roles and responsibility of other team members are\nidentified and recognized\n2.3 Reporting relationships within team and external to team are\nidentified\n3. Work as a team\nmember\n3.1 Effective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute\nto known team activities and objectives\n3.2 Effective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3 Observed protocols in reporting using standard operating\nprocedures\n3.4 Contribute to the development of team work plans based on\nan understanding of team’s role and objectives and\nindividual competencies of the members.\n\n--- PDF PAGE 8 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n6\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n7\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge and\nattitude\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the culture of\nthe workplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2 Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the\nwork activities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3 Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Commitment to the organization and its goal is demonstrated\nin the performance of duties\n2.\nSet and meet work\npriorities\n2.1 Competing demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2 Resources are utilized efficiently and effectively to manage\nwork priorities and commitments\n2.3 Practices along economic use and maintenance of equipment\nand facilities are followed as per established procedures\n3.\nMaintain\nprofessional growth\nand development\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated as\nproof of career advancement\n3.3 Licenses and/or certifications relevant to job and career are\nobtained and renewed\n\n--- PDF PAGE 11 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n9\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n10\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the course\nof managing oneself based on performance evaluation\n1.3 Completed trainings and career opportunities which are based\non the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge &\nattitudes\n2.1 Work values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n11\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory and organizational requirements for occupational\nhealth and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards\nand risks\n1.1 Safety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures\n1.2 Hazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3 Contingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures\n2. Evaluate hazards\nand risks\n2.1 Terms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold limit\nvalues (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety hazards are\nreported to designated personnel in accordance with workplace\nrequirements and relevant workplace OHS legislation\n3. Control hazards\nand risks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently followed\n3.2 Procedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization OHS\npolicies\n3.3 Personal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4 Appropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are participated in as\nper established organization guidelines and procedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 14 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations May include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, gasses,\nvapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship, work\nout cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 15 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n13\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal\nrecords\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 16 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n14\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7 Completed and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge and\n Attitudes\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 17 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n15\n\nCOMMON COMPETENCIES\n\nAUTOMOTIVE MANUFACTURING\n\nUNIT TITLE: READ, INTERPRET AND APPLY ENGINEERING DRAWINGS.\n\nUNIT CODE: ALT742201\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying specification\nfrom engineering blue prints or drawings that provides the\nmeasurements of the product and pattern that is to be produced.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\ndrawings/\nspecification\n\n1.1 Appropriate engineering drawings are identified and accessed\nas per job requirements.\n1.2 Version and date of drawing is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret drawings\n\n2.1 Relevant dimensions and sections of the drawings/\nspecifications are located in relation to the work to be conducted\n2.2 Information in the manual are interpreted in accordance to\nindustry practices\n\n3. Apply information\nin the drawings &\nspecifications\n\n3.1 Engineering drawing is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with the\nspecifications in the drawings.\n3.3 Dimensional data and shape are applied according to the given\ntask\n\n4. Store drawings\n\n4.1 The drawings and specification are stored properly to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 18 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n16\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engineering drawings\nKinds of drawings:\n1.1 Casting drawing\n1.2 Machining drawing\n1.3 Project plan\n1.4 Technical drawing\n2. Data\nData includes but not limited to\n2.1 Material specifications\n2.2 Process specifications\n2.3 Special instructions\n2.4 Machining locating points\n2.5 Clamping points\n2.6 Amount of draft\n2.7 Surface finish\n\n--- PDF PAGE 19 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n17\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed drawings/specification\n1.2 Interpreted drawings\n1.3 Applied information in drawings\n1.4 Stored drawings\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of drawings used in automotive manufacturing industry\n2.2 Identification of symbols used in the drawings\n2.3 Identification of units of measurements\n2.4 Unit conversion\n2.5 Attention to details, Perseverance, Honesty\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and\ninterpret engineering drawings and specifications\n3.2Accessing information and data\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All drawings/engineering specifications relative to automotive\nmanufacturing\n4.2 Job order, requisitions\n4.3 Product sample\n\n5 Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 20 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n18\n\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit includes identifying, caring for, handling, using and\nmaintaining measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to job\nrequirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed using\nthe four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 21 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Straight Edge\n1.6 Thickness gauge\n\n1.7 Try square\n1.8 Protractor\n1.9 Height gauge\n1.10 Steel rule\n1.11 Shrink rule\n\n2. Calculation\n\nKinds of part mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2.10 Out of roundness\n2.11 Shrinkage allowance\n\n--- PDF PAGE 22 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n20\nEVIDENCE GUIDE\n\n1. Critical aspect\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric figures\n\n3. Underpinning\n skills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 23 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n21\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and periodic\nmaintenance manual.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3 Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 24 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n22\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n2.1 Manufacturer’s specification manual\n2.2 Repair manual\n2.3 Maintenance Procedure Manual\n2.4 Periodic Maintenance Manual\n\n--- PDF PAGE 25 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n23\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Underpinning\nskills\n\n3.1.Reading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2. Accessing information and data\n\n4 Resource\nImplications\n\nThe following resources must be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 26 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n24\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE\n:\nALT723205\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and checking\nof tools/ equipment and disposal of used supplies/materials are\nalso incorporated in this competency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools cleaning\nrequirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\nrespective shelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per workshop\nSOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 27 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health and Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 28 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n26\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n27\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nMACHINE PARTS\nUNIT CODE\n\n : ALT722307\nUNIT DESCRIPTOR\n\n :\nThis unit covers the competency required to use a range of\n\nequipment to machine parts\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nDetermine job\nrequirements\n1.1 Drawings, job sheets or equivalent instructions are\ninterpreted and understood\n1.2 Workpiece materials are identified and prepared based\non the specification listed.\n1.3 Tools and equipment are selected and prepared in\naccordance with the requirements of the job.\n1.4 Measuring equipment is calibrated to ensure accurate\nmeasurement within the tolerances specified.\n2\nPrepare machine for\noperation\n2.1 Workpiece is set in accordance with standard operating\nprocedures or manufacturer’s instruction\n2.2 Cutting tools are selected and set based on the job\nspecification\n2.3 Machine controls are preset or adjusted to job\nspecification.\n2.4 Minor maintenance is carried out in accordance with\ncompany policy.\n2.5 Measuring equipment is calibrated to ensure accurate\nmeasurement within the tolerances specified.\n2.6 Machine speed and feed controls are adjusted in\naccordance with the specifications to suit the type of\nmetal/alloy being machined\n2.7 Machine is set in accordance with company or\nmanufacturer procedures.\n3\nMachine Parts\n3.1 Parts are machined and finished to specification using the\nappropriate machining process.\n3.2 Parts are checked for tolerances specified in the standard\noperating procedures and to minimize waste.\n3.3 Identified faults and defects are rectified in accordance\nwith enterprise quality control standards to minimize\nwastage.\n3.4 Machined parts are washed, inspected and dried to\nensure they are cleaned and contain no waste in cavities\nor chambers.\n3.5 Production schedule is maintained and recorded in\naccordance with company procedures\n3.6 Safe working procedures are implemented in accordance\nwith company procedures\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Workpiece materials\n1.1\nPlain carbon steel\n1.2\nHeat / corrosion resistance steel\n1.3\nAluminum alloy\n1.4\nCopper alloy for electrode\n1.5\nGraphite for electrode\n\n2. Tools\n2.1\nReamers\n2.2\nTool holders\n2.3\nTaps and dies\n2.4\nMachinist files\n2.5\nHammers\n2.6\nLetter / number punch\n2.7\nSand papers\n2.8\nRotary table\n3. Measuring equipment\nMeasuring equipment include but not limited to:\n3.1\nMicrometers\n3.2\nVernier calipers\n3.3\nHeight gages\n3.4\nGages (feeler, snap, bore, ring, thread, air)\n3.5\nDial indicators\n3.6\nDial test indicators.\n3.7\nSurface plate\n3.8\nSquare block\n3.9\nCentering machine\n3.10 Surface comparator\n4. Machine\nMachine include but not limited to machine tools such as:\n4.1\nDrills\n4.2\nLathes\n4.3\nMilling machines\n4.4\nPrecision grinders\n4.5\nEDM\n4.6\nSlotting machine\n4.7\nTool grinders\n4.8\nPower tools\n4.9\nDie grinders\n4.10 Jig borer\n4.11\nCNC machines.\n5. Minor maintenance\n5.1\nMachine slide\n5.2\nLead screw\n5.3\nGear round\n5.4\nNecks / dents\n5.5\nGear backlash\n5.6\nLubrication\n5.7\nTopping-off of coolant\n\n--- PDF PAGE 31 ---\n_________________________________________________________________