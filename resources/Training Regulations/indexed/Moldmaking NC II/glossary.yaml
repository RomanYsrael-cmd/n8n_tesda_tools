      "definition": "8. Counter bore Drilling or boring a flat bottom hole often concentric with other holes 9. Boring A machining method using single point or multiple point tools to make holes other than drilling or enlarging a hole 10. Planing Producing flat surface on a metal by linear reciprocal motion of work and the table to which it is attached relative to a stationary cutting tool 11. Shaping Producing flat surface using simple point tool. The work piece is held in a vise or fixture 12. Carbide tools Cutting or forming tools usually made from Tungsten, titanium, niobium or a combination of them in a matrix of cobalt nickel or other metals 13. Clearance The gap or space between two mating parts. 14. Interference The difference in lateral dimension at room temperature between two mating components before assembly"
