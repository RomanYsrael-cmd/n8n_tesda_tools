  "source_text": "1. Machining\nmechanical method used to precisely shape a work-piece by\nremoving some of the work-piece material with tools having\nsharp and geometrically precise cutting edge\n2. Drilling\nMaking holes using rotary end cutting tool\n3. Milling\nRemoving metal using a milling cutter\n4. Turning\n\nRemoving material by facing a cutting tool against the\nsurface of a rotating work piece. The tool may or may not be\nmoved toward or along the axis of rotation while it cuts away\nmaterial.\n5. Tapping\ncutting internal thread with a tap\n6. Reaming\nEnlarging a hole to desired size. The tool used is called a\nreamer\n7. Spot Facing\nMachining a flat seat for a bolt head\n8. Counter bore\nDrilling or boring a flat bottom hole often concentric with\nother holes\n9. Boring\nA machining method using single point or multiple point tools\nto make holes other than drilling or enlarging a hole\n10. Planing\n\nProducing flat surface on a metal by linear reciprocal motion\nof work and the table to which it is attached relative to a\nstationary cutting tool\n11. Shaping\nProducing flat surface using simple point tool. The work\npiece is held in a vise or fixture\n12. Carbide tools\nCutting or forming tools usually made from Tungsten,\ntitanium, niobium or a combination of them in a matrix of\ncobalt nickel or other metals\n13. Clearance\nThe gap or space between two mating parts.\n14. Interference\nThe difference in lateral dimension at room temperature\nbetween two mating components before assembly\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n47",
