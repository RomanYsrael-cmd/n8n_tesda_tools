    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: MOLDMAKING\n\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n68 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual to be\nable to machine parts using a variety of machining equipment and tools on plain carbon steel,\nheat resistant steel and other metals and alloy using different machining processes; perform\nprecision assembly and testing complex engineering components and mechanical assemblies\nin a production, manufacturing environment. It also includes minor maintenance of equipment\nbeing used.\n\nThis course is also designed to enhance the basic and common knowledge, skills and\nattitudes of an individual in the field of foundry-pattern making.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant\nwork related\ndocuments.\n1.3 Participate in\nworkplace\n meeting and\ndiscussion.\n• Group discussion\n• Interaction\n• Lecture\n• Reportorial\n\n• Written test\n• Practical/\nperformance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n2.2 Describe work as a\nteam\n member.\n• Group discussion\n• Interaction\n• Lecture\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n• Case studies\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n37\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Group Discussion\n• Interaction\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Structured activity\n•Film viewing\n• Role play\n• Interview\n• Written\nexamination\n• Portfolio\nassessment\n4. Practice\noccupational\nhealth and\nsafety\n4.1Identify hazardous\nrisks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Interactive-lecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situation analysis\n• Self-paced\ninstruction\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read,\nInterpret and\nApply\nEngineering\nDrawings\n1.1 Identify and access\nengineering\ndrawings/\nspecification\n1.2 .Interpret drawings\n1.3 Apply information in\nthe drawings &\nspecifications\n1.4Store drawings\n• Lecture/\nDemonstration\n• Dual training\n• Practical exercises\n\n• Direct\nobservation\n• Written\nexamination\n• Oral\nexamination\n2. Perform\nMensuration\nand\nCalculation\n2.1 Select measuring\ninstrument and\n2.2 Carry out\nmeasurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Demonstration\n• Practical exercises\n\n• Written test\n• Oral questioning\n• Direct\nobservation\n3. Read,\nInterpret and\nApply\nSpecifications\nand Manual\n3.1 Identify/accessed\nmanuals and\ninterpret data and\nspecification\n3.2 Apply information\naccessed in manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance Learning\n\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n38\n\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools\nand work area\n4.2 Store/arrange tools\nand shop\nequipment\n4.3 Dispose\nwastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Simulation\n• Interactive lecture\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Machine\nParts\n1.1 Prepare machines\nfor operation\n\n1.2 Machine parts\n\n• Demonstration\n• Lecture\n• Discussion\n• Dual training\n\n• Observation\nand\nquestioning\n• Portfolio\n• Third party\n2. Perform\nPrecision\nAssembly\n2.1 Read and\nunderstand job\nsheets\n\n2.2 Assemble\nengineering\ncomponents\n\n2.3 Perform final\nadjustments\n•\nDemonstration\n•\nLecture\n•\nDistance learning\n•\nDual training\n\n• Observation\nand\nquestioning\n• Portfolio\n• Third party\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n39"
