    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for MOLDMAKING NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: MOLDMAKING\n\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n68 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual to be\nable to machine parts using a variety of machining equipment and tools on plain carbon steel,\nheat resistant steel and other metals and alloy using different machining processes; perform\nprecision assembly and testing complex engineering components and mechanical assemblies\nin a production, manufacturing environment. It also includes minor maintenance of equipment\nbeing used.\n\nThis course is also designed to enhance the basic and common knowledge, skills and\nattitudes of an individual in the field of foundry-pattern making.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant\nwork related\ndocuments.\n1.3 Participate in\nworkplace\n meeting and\ndiscussion.\n• Group discussion\n• Interaction\n• Lecture\n• Reportorial\n\n• Written test\n• Practical/\nperformance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n2.2 Describe work as a\nteam\n member.\n• Group discussion\n• Interaction\n• Lecture\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n• Case studies\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n37\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Group Discussion\n• Interaction\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Structured activity\n•Film viewing\n• Role play\n• Interview\n• Written\nexamination\n• Portfolio\nassessment\n4. Practice\noccupational\nhealth and\nsafety\n4.1Identify hazardous\nrisks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Interactive-lecture\n• Simulation\n• Symposium\n• Group dynamics\n• Film viewing\n• Situation analysis\n• Self-paced\ninstruction\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read,\nInterpret and\nApply\nEngineering\nDrawings\n1.1 Identify and access\nengineering\ndrawings/\nspecification\n1.2 .Interpret drawings\n1.3 Apply information in\nthe drawings &\nspecifications\n1.4Store drawings\n• Lecture/\nDemonstration\n• Dual training\n• Practical exercises\n\n• Direct\nobservation\n• Written\nexamination\n• Oral\nexamination\n2. Perform\nMensuration\nand\nCalculation\n2.1 Select measuring\ninstrument and\n2.2 Carry out\nmeasurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Demonstration\n• Practical exercises\n\n• Written test\n• Oral questioning\n• Direct\nobservation\n3. Read,\nInterpret and\nApply\nSpecifications\nand Manual\n3.1 Identify/accessed\nmanuals and\ninterpret data and\nspecification\n3.2 Apply information\naccessed in manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance Learning\n\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n38\n\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools\nand work area\n4.2 Store/arrange tools\nand shop\nequipment\n4.3 Dispose\nwastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Simulation\n• Interactive lecture\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Machine\nParts\n1.1 Prepare machines\nfor operation\n\n1.2 Machine parts\n\n• Demonstration\n• Lecture\n• Discussion\n• Dual training\n\n• Observation\nand\nquestioning\n• Portfolio\n• Third party\n2. Perform\nPrecision\nAssembly\n2.1 Read and\nunderstand job\nsheets\n\n2.2 Assemble\nengineering\ncomponents\n\n2.3 Perform final\nadjustments\n•\nDemonstration\n•\nLecture\n•\nDistance learning\n•\nDual training\n\n• Observation\nand\nquestioning\n• Portfolio\n• Third party\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n39\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the\ncurriculum modules;\n Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n40\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• With experience in basic machining\n• Ability to communicate both orally and in writing; and\n• Physically and mentally fit\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n MOLDMAKING NC II\n\nRecommended list of tools, equipment and materials for the training of 12 trainees for\nMOLDMAKING NC II\n\nMachine Parts\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 unit\nVernier caliper\n1 unit\nHorizontal\nlathe (4 jaw)\n\nCoolant\n2 units Bore gage\n1 unit\nHorizontal\nmilling\nmachine\n\nCoolant dispense (1 liter)\n3 units Go-no-go gage\n1 unit\nVertical milling\nmachine\n\nMachining stock\n2 units Plug gage (as\nrequired)\n1 unit\nCarbide tool\ngrinder\n8 pcs\nCRS – 50o x 150m\n1 unit\nDepth gage\n1 unit\nBand saw\n8 pcs\nCRS – 20o x 150m\n1 unit\nDial indicator\n1 unit\nSurface\ngrinder\n4 pcs\nMS – plate 4” wide x 6” x 2”\nthick\n1 unit\nThread gage\n1 unit\nDrill bench\n4 pcs\nMS – plate 6” wide x 6” x 2”\nthick\n2 unit\nReamer-4-flute\n1 unit\nRotary table\nFace mill 4-point\n1 unit\nDie grinders\n4 unit\nMechanical\nvise\n\nFace mill 6-point\n1 unit\nHammer\n(metal)\n1 unit\nRadial drill\n2 sets\nGrinding wheel dresser\n1 unit\nHammer\n(plastic)\n1 unit\nVertical lathe\n\nDrill holder or chuck –\nassorted\n2 set\nTap / dies\n1 unit\nSurface plate\n4 sets\nC-clamp\n1 set\nFeeler gage\n1 unit\nShaper\n4 sets\nMachinist clamp (step\nblock)\n1 set\nSnap gage\n1 unit\nWorking bench\nStep drill assorted size\n1 set\nLubricator\n2 sets\nChantering tool\n2 set\nSteel brush\n2 sets\nMachinist file\n2 set\nPaint brush\n10 pcs\nDe-burring tool (1/4” stem)\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n41\n1 set\nBall pen\n1 pad\nWriting paper\n1 set\nCalculator\n1 set\nAssorted drills\n(tapered shank)\n\n1 set\nAssorted drills\n(straight shank)\n\n1 set\nCarbide insert\nassorted\n\n6 pcs\nTool holder\n1 set\nHSS tools\nassorted\n\n1 set\nHolder assorted\n2 pairs\nFace shield\n1 set\nEnd mill cutters\nassorted\n\nPerform Precision Assembly\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2 pcs\nPlastic mallet\n2 set\nOver-head\ncrane (1 ton\ncapacity)\n10 Kgs\n2 bars\nDetergent soap\n2 pcs\nWooden /\nrubber mallet\n1 set\nWashing\nequipment\n5 gals\nThinner\n2 pcs\nBearing driver\n1 unit\nPaint mixer\n5 gals\nKerosene\n2 pcs\nBushing driver\n2 units\nHydraulic\npress (20Kg /\nmm2 up to\n50Kg / mm2)\n10 Kgs\nWiping rugs\n2 sets\nTorque wrench\n3 units\nTest bench\n5 li\nLubricating oil\n2 sets\nImpact wrench\n1 set\nIllustration\nboard for\nsequential\nassembly\n20 li\nGasoline\n4 pcs\nScrew driver\n1 set\nIllustration\nboard for parts\nnomenclature\n5\nsheets\nSand paper #240\n1 set\nFeeler gage\n2 set\nTote boxes\n5 shts\nSand paper #180\n2 set\nBox wrench\n10 set\nPallets\n5 shts\nSand paper #32\n2 sets\nOpen wrench\n2 set\nPush cart\n(500Kgs\ncapacity)\n1 li\nGrease\n\n3 units\nFire\nextinguisher\n(10Kgs)\n\n2 set\nBronze brush\n1 set\nFire hose with\ncabinet and\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n42\nwater source\n2 set\nAir gun\n1 set\nAir line with\nfilter, regulator\nand lubricator\n\n2 set\nLubricator\n50\nmeters\nAir line hose\n\n2 sets\nPaint spray gun\n2 unit\nSealant\ndispenser\n\n2 pcs\nFile fine\n2 pcs\nSpanner\n2 sets\nSpecial tools\n4 sets\nSafety gadgets\n4 sets\nHousekeeping\ntools\n\n5 sets\nTote boxes\n2 set\nWaste can\n2 sets\nLifter\n2 pcs\nScissor\n1 set\nLetter punch\n1 set\nNumber punch\n1 pc\nBall pein\nhammer\n\nPersonal\nprotective\nequipment\n\n1 pair\nRespirator\n1 pair\nRubber gloves\n1 pair\nSafety shoes\n1 pair\nEye goggles\n\n3.5 TRAINING FACILITIES\n MOLDMAKING NC II\n\nBased on a class size of 12 students/trainees\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n•\nBuilding (permanent)\n26.00 x 28.00\n728.00\n728.00\n• Trainee Working\nSpace\n3.50 x 3.50 per\nstudent / trainee\n12.25 per student\n147\n• Lecture room\n9.00 x 10.00\n90.00\n90.00\n• Learning resource\ncenter\n5.00 x 8.00\n40.00\n40.00\n• Facilities /\nEquipment /\nCirculation area**\n-\n-\n302.00\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n43\n\n3.6 TRAINER’S QUALIFICATIONS\n\nAUTOMOTIVE MANUFACTURING SUB SECTOR\n\nMOLDMAKING NC II\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of MOLDMAKING NC II\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n• Must be a civil-service eligible or holder of appropriate professional license issued by\nthe Professional Regulatory Commission (for government positions\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or equivalent”\nupon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n44"
