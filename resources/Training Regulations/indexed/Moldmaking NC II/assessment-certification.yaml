  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of MOLDMAKING NC II, the candidate must\ndemonstrate competence in all the units listed in Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of MOLDMAKING NC II must acquire\nCertificates of Competency (COC) in all the following core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment center.\n\n4.2.1 Machine Parts\n4.2.2 Perform Precision Assembly\n\n4.3 Upon accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the corresponding\nNational Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1\nGraduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2\nExperienced workers (wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n45\n\nMOLDMAKING NC II\nANNEX A\nLegend:\nCOMPETENCY MAP\nAUTOMOTIVE PARTS MANUFACTURING\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nRead & Interpret\nEngineering Drawings\nPerform Mensuration\nand Calculation\nRead, Interpret and\nApply Specifications\nand Manuals\nPerform Shop\nMaintenance\n-\nCORE COMPETENCIES\nDevelop and\nManufacture Wood\nPattern\nDevelop and\nManufacture Polymer\nPattern\nDevelop and\nManufacture Assembled\nPlated Pattern\nDevelop and\nManufacture Production\nPattern\nPerform General\nWoodworking Machine\nOperations\nUse and Maintain\nMeasuring Instrument\nPrepare & Mix Sand for\nMetal Molding\nProduce Molds by Hand\nProduce Cores by Hand\nOperate Molding\nMachine\nOperate Core-Making\nMachine\nPour Molten Metal to\nMolds\nOperate Melting\nFurnaces (non-electric)\nOperate Cupola Melting\nFurnace\nOperate Electric\nInduction Melting\nFurnace\nFettle & Trim Metal\nCastings/Forgings\nPerform Refractory\nInstallation & Repair\nMelt Aluminum-\nSilicon Alloys for\nSafety Tested\nCastings\nMelt Metals Using\nCoreless Induction\nFurnace\nMelt Automotive Gray\nIron Castings in Cupola\nPrepare Sand Mixture\nfor Heavy Casting\nPour Molten Metal\nto Heavy Castings\n\nManufacture and\ndevelop corebox for\nShell Core Box\nDevelop and\nManufacture Gear,\nConveyor Screw and\nDevelop Gravity Die\nCasting Mold\nUse Comparison and Basic\nMeasuring Devices\nMeasure Components\nUsing Coordinate\nMeasuring Machines\nUse Graphical Techniques\nand Perform Simple\nStatistical Computations\nConduct Product\nand/or Process\nCapability Studies\nMaintain/Supervise the\nApplication of Quality\nProcedures\nPerform Mechanical\nPress Forming\nOperation\nChange\nEquipment Dies\nPerform Press Machine\nSetting\nMachine Parts\nPerform Precision\nAssembly\nPerform Mechanical\nShearing Operation\nApply Quality\nSystems\nPerform Hand Forging\nPerform Hammer Forging\nPerform Basic Incidental\nHeat/Quenching,\nTempering and\nAnnealing\nHammer Forge\nComplex Shapes\nPerform Drop and Upset\nForging\nSelect Heat\nTreatment Process\nPerform Heat\nTreatment Process\nHand Forge Complex\nShapes\nPerform Hand Molding\nto Produce Heavy\nCasting\nProduce Injection\nMolded Products\nProduce Blow\nMolded Products\nPrepare and Start\nEquipment for\nProduction\nSelect and Control\nInspection Processes\nand Procedures\nPerform Precision\nMechanical\nMeasurement\nCalibrate Measuring\nEquipment\nPerform Inspection\nPerform Engineering\nMeasurement\nPerform Basic\nStatistical Quality\nControl\nUse Improvement\nProcesses in Team\nActivities\nOperate injection\nMolding Equipment\nPrepare Materials for\nFormulae\n\nAssemble Materials and\nEquipment for\nProduction\nOperate Blow Molding\nEquipment\nPrepare Molds for\nComposites Production\nMonitor Process\nOperations\nFinish Products and\nComponents\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n46\nDEFINITION OF TERMS\n\n1. Machining\nmechanical method used to precisely shape a work-piece by\nremoving some of the work-piece material with tools having\nsharp and geometrically precise cutting edge\n2. Drilling\nMaking holes using rotary end cutting tool\n3. Milling\nRemoving metal using a milling cutter\n4. Turning\n\nRemoving material by facing a cutting tool against the\nsurface of a rotating work piece. The tool may or may not be\nmoved toward or along the axis of rotation while it cuts away\nmaterial.\n5. Tapping\ncutting internal thread with a tap\n6. Reaming\nEnlarging a hole to desired size. The tool used is called a\nreamer\n7. Spot Facing\nMachining a flat seat for a bolt head\n8. Counter bore\nDrilling or boring a flat bottom hole often concentric with\nother holes\n9. Boring\nA machining method using single point or multiple point tools\nto make holes other than drilling or enlarging a hole\n10. Planing\n\nProducing flat surface on a metal by linear reciprocal motion\nof work and the table to which it is attached relative to a\nstationary cutting tool\n11. Shaping\nProducing flat surface using simple point tool. The work\npiece is held in a vise or fixture\n12. Carbide tools\nCutting or forming tools usually made from Tungsten,\ntitanium, niobium or a combination of them in a matrix of\ncobalt nickel or other metals\n13. Clearance\nThe gap or space between two mating parts.\n14. Interference\nThe difference in lateral dimension at room temperature\nbetween two mating components before assembly\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n47\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nMOLDMAKING\nAntonio A. Gimenez\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nCesar R. Leal\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nElmo N. Serbito\nPAFI (Samahan ng mga\nManggagawang Supercast)\n\nCarina J. Bondad\n(Administrative Staff)\nThe PARTICIPANTS in the National Validation of this Training Regulation\n• (Supercast Foundry &\nMachinery Corp.\nSFMC)\n\n• Philippine Aluminum Wheels\nInc. (PAWI)\n\n• Toyota Auto Parts Phils. Inc.\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
