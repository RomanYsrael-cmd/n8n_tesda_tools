  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of MOLDMAKING NC II, the candidate must\ndemonstrate competence in all the units listed in Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of MOLDMAKING NC II must acquire\nCertificates of Competency (COC) in all the following core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment center.\n\n4.2.1 Machine Parts\n4.2.2 Perform Precision Assembly\n\n4.3 Upon accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the corresponding\nNational Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1\nGraduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2\nExperienced workers (wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR MOLDMAKING NC II Promulgated\n\n45\n\nMOLDMAKING NC II\n"
