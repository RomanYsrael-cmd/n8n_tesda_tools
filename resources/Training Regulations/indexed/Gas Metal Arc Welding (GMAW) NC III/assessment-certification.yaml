  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of GMAW III, the candidate must\ndemonstrate competence in all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency, weld alloy steel\nplates and weld alloy steel pipes using GMAW.The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs.\n\n4.3.2 Experienced workers (wage employed or self employed)\n\n4.4\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQS)\".\n\n--- PDF PAGE 65 ---\nWeldncii11-3\n\n64\n\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE COMPETENCIES\n "
