ools \n2.2    Hand tool defects  \n2.3    Procedure, principles and techniques in maintenance of \n        hand tools   \n \n3. \nUnderpinning \nskills \n3.1 Handling tools and materials \n3.2 Communicating with superiors and co-workers \n3.3 Interpreting instructions \n4. \nResource \nimplications \nThe following resources must be provided \n4.1   Tools, equipment and facilities appropriate to the process \n        or activity \n4.2   Materials relevant to the proposed activity \n5. \nMethod of \nassessment \nCompetency must be assessed through: \n5.1   Demonstration \n5.2   Written or oral short answer questions \n5.3   Practical exercises \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
