n2.5   Files \n2.6   Extension cord and lightings \n2.7   Barriers \n2.8   Dye-penetrant kit \n3. Removed/excavated \nDefects removed by \n3.1  Grinding \n3.2  Arc/air Gouging \n3.3  Cutting (mechanical, gas) \n3.4  Plasma gouging\n\n--- PDF PAGE 49 ---\nWeldncii11-3 \n  \n48"
