        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\nWeldncii11-3 \n  \n3\nSECTION 2 COMPETENCY STANDARDS \n \n \n \nThis section gives the details of the contents of the core units of competency \nrequired in Gas Metal Arc Welding (GMAW) NC III.    \n \n \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :   LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n \n:   500311109 \n \n    UNIT DESCRIPTOR         :  This unit covers the knowledge, skills and attitudes \n \n required to lead in the dissemination and discussion of \n                                                   ideas, information and issues in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Communicate \ninformation about \nworkplace \nprocesses \n1.1. \nAppropriate communication method is selected  \n1.2. \nMultiple operations involving several topics areas are \n           communicated accordingly \n1.3. \nQuestions are used to gain extra information \n1.4. \nCorrect sources of information are identified \n1.5. \nInformation is selected and organized correctly \n1.6. \nVerbal and written reporting is undertaken when \n           required \n1.7.\nCommunication skills are maintained in all situations\n2. Lead workplace \ndiscussions \n2.1. \nResponse to workplace issues are sought  \n2.2. \nResponse to workplace issues are provided \nimmediately \n2.3. \nConstructive contributions are made to workplace \ndiscussions on such issues as production, quality and \nsafety \n2.4. \nGoals/objectives and action plan  undertaken in the \nworkplace are communicated\n3. Identify and \ncommunicate issues \narising in the \nworkplace \n3.1. \nIssues and problems are identified as they arise \n3.2. \nInformation regarding problems and issues are \norganized coherently to ensure clear and effective \ncommunication \n3.3. \nDialogue is initiated with appropriate personnel \n3.4. \nCommunication problems and issues are raised as \nthey arise\n\n--- PDF PAGE 5 ---\nWeldncii11-3 \n  \n4\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1. \nNon-verbal gestures \n1.2. \nVerbal \n1.3. \nFace to face \n1.4. \nTwo-way radio \n1.5. \nSpeaking to groups \n1.6. \nUsing telephone \n1.7. \nWritten \n1.8.\nInternet\n\n--- PDF PAGE 6 ---\nWeldncii11-3 \n  \n5\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nDealt with a range of communication/information at \none time \n1.2. \nMade constructive contributions in workplace issues \n1.3. \nSought workplace issues effectively \n1.4. \nResponded to workplace issues promptly \n1.5. \nPresented information clearly and effectively written \nform \n1.6. \nUsed appropriate sources of information \n1.7. \nAsked appropriate  questions \n1.8. \nProvided accurate information  \n2. Underpinning \nknowledge and \nattitudes \n2.1. \nOrganization requirements for written and electronic \ncommunication methods \n2.2. \nEffective verbal communication methods \n3. Underpinning skills \n3.1. \nOrganize information \n3.2. \nUnderstand and convey intended meaning \n3.3. \nParticipate in variety of workplace discussions \n3.4. \nComply with organization  requirements for the use \nof written and electronic communication methods \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. \nVariety of Information \n4.2. \nCommunication tools \n4.3. \nSimulated workplace \n5. Methods of \nassessment \nCompetency may be assessed through: \n5.1. \nCompetency in this unit must be assessed through \n5.2. \nDirect Observation \n5.3. \nInterview \n6. Context  for \nassessment \n6.1. \nCompetency may be assessed in the workplace or in \nsimulated workplace environment\n",
