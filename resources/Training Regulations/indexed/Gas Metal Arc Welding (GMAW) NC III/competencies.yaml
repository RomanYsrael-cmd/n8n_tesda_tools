        "source_title": "Weld alloy steel plates using GMAW",
        "source_text": "--- PDF PAGE 50 ---\nWeldncii11-3 \n  \n49\nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY  : \nWeld alloy steel plates using GMAW \n \nUNIT CODE \n \n: \nMEE721114 \n \nDESCRIPTOR \n \n: \nThis unit covers the skills, knowledge and attitudes \n Required in welding alloy steel plates in 1F-4F \n and 1G-3G positions using GMAW process. \n  \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform root pass  \n1.1 Root pass is performed in accordance with WPS and/or \nclient specifications. \n1.2 Task is performed in accordance with company or \nindustry requirement and safety procedure. \n1.3 Weld is visually checked for defects and repaired, as  \n      required \n1.4 Weld is visually acceptable in accordance with applicable \ncodes and standards  \n2. Clean root pass \n2.1 Root pass is cleaned and free from defects and   \n      discontinuities \n2.2 Task is performed in accordance with approved WPS \n3. Weld subsequent/ \nfilling passes \n \n3.1 Subsequent/ filling passes is performed in accordance \nwith approved WPS \n3.2 Weld is visually checked for defects and repaired, as  \n      required \n3.3 Weld is visually acceptable in accordance with applicable \ncodes and standards \n4. Perform capping \n4.1 Capping is performed in accordance with WPS and/or  \n      client specifications \n4.2 Weld is visually checked for defects and repaired, as  \n      required \n4.3 Weld is visually acceptable in accordance with applicable \ncodes and standards\n\n--- PDF PAGE 51 ---\nWeldncii11-3 \n  \n50\n \nRANGE OF VARIABLE \nVARIABLE \nRANGE \n1. WPS \nWPS Requirements \n1.1 Welding positions \n1.1.1 1F-4F \n1.1.2 1G-3G \n1.2   Material thickness  \n        1.2.1   1.6mm and above   \n1.3   Type of material \n        1.3.1   Alloy-steel plates \n1.4   Consumables \n1.4.1   filler wire (diameter) \n1.4.2   shielding gas (CO2  or other available mixed \n           gas) \n1.5   Travel speed \n1.6   Current setting (polarity, amperage, voltage) \n1.7   Shielding gas flow rate \n1.8  Welding accessories \n1.9  Types of metal transfer \n1.10 Joint preparation  \n2. Defects \n2.1     Porosity \n2.2     Undercut \n2.3     Arc Strike  \n2.4     Elongated intrusion \n2.5     Concavity/convexity   \n2.6     Degree of reinforcement \n2.7     Burn Through \n2.8     Crater cracks \n2.9     Cracks \n2.10   Lack of Fusion \n2.11   Pinholes/Blowholes \n2.12   Under Fill \n2.13   Overlap \n2.14   Misalignment \n2.15   Distortion\n\n--- PDF PAGE 52 ---\nWeldncii11-3 \n  \n51\n EVIDENCE GUIDE \n1 \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate \nwelded alloy steel plates using GMAW in 2G and \n3G positions to acceptable standards following \napproved WPS. \n2 \nUnderpinning knowledge \n2.1  Drawing/Plan/WPS interpretation \n2.2  Materials and consumables  \n2.2.1  Filler wire for alloy-steel materials \n2.2.2  Shielding gases \n2.3  Welding Equipment and Tools \n2.4  Basic Mathematics (MDAS) \n2.5  Welding Codes \n2.6  Interpretation of weld defects \n3 \nUnderpinning skills \n3.1  Measuring skills \n3.2  Communication skills \n3.3  Rectifying weld defects \n3.4  Applying welding techniques for GMAW \n3.5  Handling welding tools and equipment \n3.6  Handling materials  \n3.7  Philippine OH&S Rules and/or client’s safety  \nprocedure \n4 \nResource implications \nThe following resources must be provided: \n4.1  GMAW facilities and equipment \n4.2  Supplies and materials \n4.3  PPE \n4.4  Fumes extractor \n4.5  Relevant documentation such as WPS and  \nworking drawing \n4.6  Stand-by fire fighting equipment \n5 \nMethod of assessment \nCompetency must be assessed through: \n5.1  Performance test (demonstration) and oral  \n     questioning \n5.2  Portfolio \n6 Context of assessment \nCompetency to be assessed while a task is being \nundertaken in the workplace or in a simulated \nworkplace setting.\n",
