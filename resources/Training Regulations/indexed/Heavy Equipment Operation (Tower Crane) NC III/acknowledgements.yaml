    },
    {
      "source_text": "2.1 Operator’s Serviceable parts are identified and serviced according to manufacturer’s recommendations. 2.2 Standard parameters are checked according to manufacturer’s recommendations. 2.3 Fluids and lubricants are used based on manufacturer’s recommendations. 2.4 Basic hand tools, portable power tools and consumable materials are identified and used in accordance with job requirements. 2.5 Basic preventive maintenance servicing (PMS) is carried out in accordance with manufacturer’s recommendations and site regulations 2.6 Site conditions are considered during PMS 2.7 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards"
    },
    {
      "source_text": "2.1 Understanding Operator’s Maintenance Manual (OMM) 2.2 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 2.3 Site and weather conditions 2.4 Waste disposal procedures 2.5 Volume/ capacity 2.6 Clearance and distances 2.7 Types of fluids and lubricants 2.8 Procedures in basic preventive maintenance servicing 2.9 Types and uses of basic hand tools and portable powered tools 2.10 Factors affecting productivity 2.11 Productivity work measurements 2.12 Ways of improving productivity"
