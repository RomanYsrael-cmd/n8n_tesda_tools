    {
      "source_text": "76 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Potential hazards"
    },
    {
      "source_text": "May include: 1.1 Other equipment 1.2 Building/structure 1.3 Foggy/windy/stormy weather 1.5 Overhead “live” electrical wires 1.6 Workers"
    },
    {
      "source_text": "2. Unexpected situations May include: 2.1 Lost of power supply 2.2 Malfunction of control levers/electrical components 2.3 Structural failure of the jib 2.4 Failure of hoist brake 2.5 Derail of track 2.6 Broken wire rope 2.7 Hitting high tension wire 2.8 Sudden ground failure 2.9 Force majeure e.g., earthquake, fire, typhoon 2.10 Operator fatigue or sickness 2.11 Accidents/incidents"
    },
    {
      "source_text": "3. Load specification May include: 3.1 Bill of ladings 3.2 Packing and shipping list 3.3 Delivery receipt"
    },
    {
      "source_text": "4. Rigging gears May include: 4.1 Shackle 4.2 Web sling 4.3 Chain sling 4.4 Wire rope sling 4.5 Turn buckle 4.6 Eye bolt 4.7 Hoist hook 4.8 Tagline 4.9 Lever hoist 4.10 Chain block"
    },
    {
      "source_text": "5. Safe work procedures and practices May include: 5.1 Lifting Plan 5.2 Load chart 5.3 Condition of work area 5.4 Storage of lifting gears 5.5 Part of lines 5.6 Trial lift 5.7 Communication (hand signal, two-way radio) 5.8 Risk management control 5.9 Permit"
    },
