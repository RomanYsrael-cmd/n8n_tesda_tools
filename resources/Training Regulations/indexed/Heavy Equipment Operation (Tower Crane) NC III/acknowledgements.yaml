e\noperating procedures.\n1.4 Jib is secured and in\nplace during travel in\naccordance with\nmanufacturer’s manual.\n1.5 Horn is activated during\ntravel.\n1.6 Aid of a rigger is\nrequired on the entire\noperation in accordance\nwith standard operating\nprocedures.\n1.7 Unexpected situations\nare responded in\n line with company rules\nand regulations\n1.8 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards\n\n1.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Site and weather\nconditions\n1.3 Clearance and\ndistances\n1.4 Procedures in\noperating,\ntravelling of tower\ncrane\n1.5 Factors affecting\nproductivity\n1.6 Productivity work\nmeasurements\n1.7 Ways of\nimproving\nproductivity\n\n1.1 Following safety\nprocedures in\ntravelling the\ncrane\n1.2 Using PPE\n1.3 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 79 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n74\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Interpret load chart\nand /or load\nmoment indicator\nand construct lifting\nplan\n\n2.1 Weight of the load is\ndetermined according to\nload information\n2.2 Lifting capacity is\ndetermined according to\nworking radius, boom\nlength and boom angle\nby manufacturer’s\nspecifications\n2.3 Rigging gears are\ndetermined and\nconsidered as part of\nthe load based on\nmanufacturer’s\nspecifications\n2.4 lifting capacity in the\nload chart and /or load\nmoment indicator is\nfollowed according to\nmanufacturer’s\nspecifications\n2.5 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n2.6 Lifting plan is\nconstructed based on\njob description\n\n2.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 