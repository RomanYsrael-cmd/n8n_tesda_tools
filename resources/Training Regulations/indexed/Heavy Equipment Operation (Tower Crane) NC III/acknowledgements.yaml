      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Perform adjustment or replacement for noted defects"
    },
    {
      "source_text": "1.1 Minor defects are identified and repaired/replaced in accordance with manufacturer’s procedures. 1.2 Basic hand tools and portable power tools are selected based on job requirements. 1.3 Major defects are identified using checklist and referred to authorized personnel for action. 1.4 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards"
    },
    {
      "source_text": "1.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 1.2 Waste disposal procedures 1.3 Volume/capacity 1.4 Clearance and distances 1.5 Types of fluids and lubricants 1.6 Procedures in performing adjustments or replacements for noted defects. 1.7 Types and uses of basic hand tools and portable powered tools 1.8 Structure and function of Tower crane components 1.9 Factors affecting productivity 1.10 Productivity work measurements 1.11 Ways of improving productivity"
    },
    {
      "source_text": "1.1 Following manufacturer’s procedures in performing adjustments or replacements for minor defects 1.2 Application of different basic hand tools and portable powered tools 1.3 Identifying defects 1.4 Using PPE 1.5 Applying productive methods and techniques 1.6 Handling, segregation and disposal of hazardous waste"
    },
    {
      "source_text": "-- PDF PAGE 73 --- HEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)"
