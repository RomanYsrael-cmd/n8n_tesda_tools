uipment are\nlubricated\naccording to\npreventive\nmaintenance\nschedule or\nmanufacturer's\nspecifications\n2.3 Measuring\ninstruments are\nchecked and\ncalibrated in\naccordance with\nmanufacturer’s\ninstructions\n2.4 Tools are cleaned\nand lubricated\naccording to\nstandard\nprocedures\n2.5 Defective\ninstruments,\nequipment and\naccessories are\ninspected and\nreplaced according\nto manufacturer’s\nspecifications\n2.6 Tools are\ninspected, repaired\nand replaced after\nuse\n2.7 Work place is\ncleaned and kept\nin safe state in line\nwith Occupational\nSafety and Health\n(OSHS)\n\n2.1 Use of PPE\n2.2 Handling of tools\nand equipment\n2.3 Good\nhousekeeping\n2.4 Types and uses\nof lubricants\n2.5 Types and uses\nof cleaning\nmaterials\n2.6 Methods and\ntechniques\n2.7 Procedures\n\n2.1 Handling of tools\nand equipment\n2.2 Performing\npreventive\nmaintenance\n\n--- PDF PAGE 62 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n57\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Store tools and\nequipment\n\n3.1 Inventory of tools,\ninstruments and\nequipment are\nconducted and\nrecorded as per\ncompany\npractices\n3.2 Tools and\nequipment are\nstored safely in\nappropriate\nlocations in\naccordance with\nmanufacturer's\nspecifications or\ncompany\nprocedures\n\n3.1 Use of PPE\n3.2 Handling of tools\nand equipment\n3.3 Storing\nprocedures and\ntechniques\n3.4 Storage\nconditions/\nlocations\n\n3.1 Storing tools and\nequipment\n3.2 Handling of tools\nand equipment\n\n--- PDF PAGE 63 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw\nBoring tools - brace, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n3. Personal Protective\nEquipment (PPE)\nMay include:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Reflectorized Vest\n\n--- PDF PAGE 64 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n59\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OSHA regulations\n1.8 Stored tools and equipment safely in appropriate locations\nand in accordance with company practices\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Maintenance schedule\n2.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 65 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n60\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPERFORM PRE AND POST-OPERATION\nPROCEDURES FOR TOWER CRANE\n\nUNIT CODE\n\n:\nCON834310\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming visual and operation check before and after\nproductive operation of tower crane.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform visual check\nof tower crane\n\n1.1 Capacity of tower\ncrane is selected based\non job requirements.\n1.2 Operator-serviceable\n(OS) parts are checked\nin accordance with\nequipment checklist and\nmanufacturer’s\nprocedures.\n1.3 Inspection is performed\nwith equipment checklist\nwhile power is switched\noff.\n1.4 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n1.5 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (.g. PD 1152\nSection 6, 8 and 42)\n1.6 Required output is\ncompleted based on\naccomplished checklist\n\n1.1 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Procedures in\nconducting visual\nand walk-around\ncheck\n1.3 Computation of\nload versus\ncapacity of tower\ncrane\n1.4 Functions of parts\nand components\nof tower crane\n1.5 Factors affecting\nproductivity\n1.6 Productivity work\nmeasurements\n1.7 Ways of\nimproving\nproductivity\n\n1.1 Following visual\nand walk-around\nchecking\nprocedures\n1.2 Calculating load\nand capacity of\ntower crane\n1.3 Identifying parts\nand functions\n1.4 Accomplishing\nchecklist\n1.5 Using PPE\n1.6 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 66 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform visual check\nof tower crane\ncomponents\n2.1 Tower crane\ncomponents are\nchecked in accordance\nwith checklist and\nmanufacturer’s\nprocedures\n2.2 Abnormal conditions\nare noted in checklist\nand reported to\nauthorized person\n2.3 Personal Protectiv