    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Perform visual check of tower crane"
    },
    {
      "source_text": "1.1 Capacity of tower crane is selected based on job requirements. 1.2 Operator-serviceable (OS) parts are checked in accordance with equipment checklist and manufacturer’s procedures. 1.3 Inspection is performed with equipment checklist while power is switched off. 1.4 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 1.5 Work area is cleaned according to safety and environmental regulations (.g. PD 1152 Section 6, 8 and 42) 1.6 Required output is completed based on accomplished checklist"
    },
    {
      "source_text": "1.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 1.2 Procedures in conducting visual and walk-around check 1.3 Computation of load versus capacity of tower crane 1.4 Functions of parts and components of tower crane 1.5 Factors affecting productivity 1.6 Productivity work measurements 1.7 Ways of improving productivity"
    },
    {
      "source_text": "1.1 Following visual and walk-around checking procedures 1.2 Calculating load and capacity of tower crane 1.3 Identifying parts and functions 1.4 Accomplishing checklist 1.5 Using PPE 1.6 Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 66 --- HEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)"
