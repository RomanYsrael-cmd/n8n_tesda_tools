      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "For the purpose of this Competency Standard, the words"
    },
    {
      "source_text": "1. Attachment Refers to anything like fly jib used instead of the conventional lift block to perform different types of lifting jobs."
    },
    {
      "source_text": "2. Working radius Refers to the distance from a point on the curve to the axis of rotation."
    },
    {
      "source_text": "3. Reeving Refers to a rope system in which the rope travels around the drums and sheaves."
    },
    {
      "source_text": "4. Jib"
    },
    {
      "source_text": "Refers to the projecting arm of tower crane. 5. Tower crane Refers to a type of crane with a fixed vertical mast that is topped by a rotating boom and equipped with a winch for hoisting and lowering loads. The winch can be moved along the boom in any location within the diameter of the boom that can be reached."
    },
    {
      "source_text": "6. Standard Refers to a degree or level of requirement set by the manufacturer."
    },
    {
      "source_text": "7. Safety devices Refer to boom angle indicators, load moment indicators, anti-two blocking devices (where applicable), boom kick out lever, etc."
    },
    {
      "source_text": "8. Work area Refers to any place inside the swing circle of the crane. It must be barricaded off and only those directly involve in the lift shall be allowed to entry."
    },
    {
      "source_text": "9. Derated capacity of equipment"
    },
    {
      "source_text": "10. Load Moment Indicator (LMI)"
    },
    {
      "source_text": "11. Rigging gears"
    },
    {
      "source_text": "12. Hazards"
    },
    {
      "source_text": "13. Rigger"
    },
    {
      "source_text": "14. Computer Literate"
    },
    {
      "source_text": "Refers to the reduction of lifting capacity of equipment as certified by a third party."
    },
    {
      "source_text": "Refers to electronic device that indicates crane configuration such as boom angle, boom length, load weight and working radius."
    },
    {
      "source_text": "Refers to equipment such as wire rope, turnbuckles, clevis, jacks, shackles, slings used with cranes and other lifting equipment in material handling and structure relocation."
    },
    {
      "source_text": "Refer to situation that poses threat to life, health, property, or environment."
    },
    {
      "source_text": "Refers to signalman that directs the schedule of lifts for the crane, and is responsible for the safety of the loads."
    },
    {
      "source_text": "Is defined as the knowledge and ability to utilize computers and related technology efficiently, with a range of skills covering levels from elementary use to computer programming and advanced problem solving."
    },
