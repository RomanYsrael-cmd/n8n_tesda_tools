    {
      "source_text": "The HEAVY EQUIPMENT OPERATION (TOWER CRANE) NC III qualification consists of competencies that workers must achieve to enable them to perform tasks such as inspection, basic preventive maintenance, interpreting load chart, lifting and transferring of heavy loads in construction sites or other locations with the use of a tower crane."
    },
    {
      "source_text": "This qualification is packaged from the competency map of Construction - Heavy Equipment sub-sector as shown in Annex A."
    },
    {
