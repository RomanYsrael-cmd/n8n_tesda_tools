    {
      "source_text": "73 UNIT OF COMPETENCY : PERFORM PRODUCTIVE OPERATION FOR TOWER CRANE"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": CON834312"
    },
    {
      "source_text": "UNIT DESCRIPTOR"
    },
    {
      "source_text": ": This unit involves the knowledge, skills and attitudes in traveling, setting-up, interpreting load chart and lifting operation for tower crane."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Travel the tower crane"
    },
    {
      "source_text": "1.1 Rail conditions are considered before travelling the crane 1.2 Limit switches are installed in accordance with manufacturer’s manual 1.3 Work area is surveyed for potential hazards in accordance with safe operating procedures. 1.4 Jib is secured and in place during travel in accordance with manufacturer’s manual. 1.5 Horn is activated during travel. 1.6 Aid of a rigger is required on the entire operation in accordance with standard operating procedures. 1.7 Unexpected situations are responded in line with company rules and regulations 1.8 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards"
    },
    {
      "source_text": "1.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 1.2 Site and weather conditions 1.3 Clearance and distances 1.4 Procedures in operating, travelling of tower crane 1.5 Factors affecting productivity 1.6 Productivity work measurements 1.7 Ways of improving productivity"
    },
    {
      "source_text": "1.1 Following safety procedures in travelling the crane 1.2 Using PPE 1.3 Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 79 --- HEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "74"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Interpret load chart and /or load moment indicator and construct lifting plan"
    },
    {
      "source_text": "2.1 Weight of the load is determined according to load information 2.2 Lifting capacity is determined according to working radius, boom length and boom angle by manufacturer’s specifications 2.3 Rigging gears are determined and considered as part of the load based on manufacturer’s specifications 2.4 lifting capacity in the load chart and /or load moment indicator is followed according to manufacturer’s specifications 2.5 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 2.6 Lifting plan is constructed based on job description"
    },
    {
      "source_text": "2.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 2.2 Conversion of units 2.3 Crane capacity based on load chart and/ or load moment indicator 2.4 Procedures in interpreting load chart and/ or load moment indicator 2.5 Capacity and uses of rigging gears 2.6 Factors affecting productivity 2.7 Productivity work measurements 2.8 Ways of improving productivity 2.9 Procedures in constructing lifting plan"
    },
    {
      "source_text": "2.1 Interpreting load chart and/or load moment indicator 2.2 Identifying rigging gears 2.3 Using PPE 2.4 Applying productive methods and techniques 2.5 Constructing lifting plan"
    },
    {
      "source_text": "-- PDF PAGE 80 --- HEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "75"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 3. Perform lifting and transferring of load"
    },
    {
      "source_text": "3.1 Site and weather conditions are considered before lifting and transferring the load 3.2 Safe work procedures and practices are observed during lifting operation based on OSH standards and manufacturer’s manual 3.3 The tower crane components are positioned before lifting operation. 3.4 Optimum speed during hoisting or swing operation is controlled based on manufacturer’s manual 3.5 Communication with rigger is established and maintained during lifting and transferring of loads based on standard operating procedures 3.6 Unexpected situations are responded in line with company rules and regulations 3.7 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards"
    },
    {
      "source_text": "3.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 3.2 Standard hand signals 3.3 Two-way radio 3.4 Site and weather conditions 3.5 Conversion of units 3.6 Crane capacity based on load chart and/ or load moment indicator 3.7 Clearance and distances 3.8 Capacity and uses of rigging gears 3.9 Safety devices 3.10 Procedures in lifting and transferring of load 3.11 Factors affecting productivity 3.12 Productivity work measurements 3.13 Ways of improving productivity"
    },
    {
      "source_text": "3.1 Performing lifting and transferring of load 3.2 Interpreting and following standard hand signals and two-way radio 3.3 Using PPE 3.4 Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 81 --- HEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)"
