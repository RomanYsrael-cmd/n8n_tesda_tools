    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Perform visual check of tower crane components 2.1 Tower crane components are checked in accordance with checklist and manufacturer’s procedures 2.2 Abnormal conditions are noted in checklist and reported to authorized person 2.3 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 2.4 Required output is completed based on accomplished checklist"
    },
    {
      "source_text": "2.1 Procedures in visual check for tower crane components 2.2 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 2.3 Functions of tower crane components 2.4 Factors affecting productivity 2.5 Productivity work measurements 2.6 Ways of improving productivity 2.1 Accomplishing checklist 2.2 Following visual checking for tower crane components 2.3 Identifying parts and functions 2.4 Using PPE 2.5 Applying productive methods and techniques"
    },
    {
      "source_text": "3. Perform operation check"
    },
    {
      "source_text": "1.1 Operation check is performed while the power is switched-on in accordance with manufacturer’s recommendations. 1.2 Mechanical components are checked for normal functioning based on manufacturer's specifications. 1.3 Function check is performed with equipment checklist and while power supply is on. 1.4 Safety devices are checked for proper functions in accordance with safe operating procedures. 1.5 Personal Protective Equipment (PPE) is used in accordance Range of Variables 3.1 Start-up procedures 3.2 Procedures in walk-around check while the power supply is on 3.3 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 3.4 Warning signs and symbols 3.5 Functions of all components and safety devices 3.6 Factors affecting productivity 3.7 Productivity work measurements 3.8 Ways of improving productivity"
    },
    {
      "source_text": "3.1 Accomplishing checklist 3.2 Following walk- around checking procedures while the power supply is on 3.3 Testing of tower crane according to manufacturer’s specification 3.4 Using PPE 3.5 Applying productive methods and techniques"
