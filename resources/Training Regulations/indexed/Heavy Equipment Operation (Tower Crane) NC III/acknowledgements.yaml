    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES 400311319 Lead workplace communication 400311320 Lead small teams 400311321"
    },
    {
      "source_text": "400311322 Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment 400311323"
    },
    {
      "source_text": "400311324 400311325 400311326 400311327 Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs)"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES"
    },
    {
      "source_text": "Units of Competency CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311202 Interpret drawings and plans CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
