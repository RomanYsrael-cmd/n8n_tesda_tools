  "source_text": "For the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like fly jib used instead of the conventional lift block\nto perform different types of lifting jobs.\n\n2. Working radius\nRefers to the distance from a point on the curve to the axis of rotation.\n\n3. Reeving\nRefers to a rope system in which the rope travels around the drums\nand sheaves.\n\n4. Jib\n\nRefers to the projecting arm of tower crane.\n5. Tower crane\nRefers to a type of crane with a fixed vertical mast that is topped by a\nrotating boom and equipped with a winch for hoisting and lowering\nloads. The winch can be moved along the boom in any location within\nthe diameter of the boom that can be reached.\n\n6. Standard\nRefers to a degree or level of requirement set by the manufacturer.\n\n7. Safety devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n\n8. Work area\nRefers to any place inside the swing circle of the crane. It must be\nbarricaded off and only those directly involve in the lift shall be allowed\nto entry.\n\n9. Derated capacity\nof equipment\n\n10. Load Moment\n Indicator (LMI)\n\n11. Rigging gears\n\n12. Hazards\n\n13. Rigger\n\n14. Computer Literate\n\nRefers to the reduction of lifting capacity of equipment as certified by a\nthird party.\n\nRefers to electronic device that indicates crane configuration such as\nboom angle, boom length, load weight and working radius.\n\nRefers to equipment such as wire rope, turnbuckles, clevis, jacks,\nshackles, slings used with cranes and other lifting equipment in\nmaterial handling and structure relocation.\n\nRefer to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to signalman that directs the schedule of lifts for the crane, and\nis responsible for the safety of the loads.\n\nIs defined as the knowledge and ability to utilize computers and related\ntechnology efficiently, with a range of skills covering levels from elementary\nuse to computer programming and advanced problem solving.\n\n--- PDF PAGE 115 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n110",
