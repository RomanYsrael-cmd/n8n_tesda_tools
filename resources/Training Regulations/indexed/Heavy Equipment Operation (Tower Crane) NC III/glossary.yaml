      "definition": "1. Attachment Refers to anything like fly jib used instead of the conventional lift block to perform different types of lifting jobs. 2. Working radius Refers to the distance from a point on the curve to the axis of rotation. 3. Reeving Refers to a rope system in which the rope travels around the drums and sheaves. 4. Jib Refers to the projecting arm of tower crane. 5. Tower crane Refers to a type of crane with a fixed vertical mast that is topped by a rotating boom and equipped with a winch for hoisting and lowering loads. The winch can be moved along the boom in any location within the diameter of the boom that can be reached. 6. Standard Refers to a degree or level of requirement set by the manufacturer. 7. Safety devices Refer to boom angle indicators, load moment indicators, anti-two blocking devices (where applicable), boom kick out lever, etc. 8. Work area Refers to any place inside the swing circle of the crane. It must be barricaded off and only those directly involve in the lift shall be allowed to entry. 9. Derated capacity of equipment 10. Load Moment"
