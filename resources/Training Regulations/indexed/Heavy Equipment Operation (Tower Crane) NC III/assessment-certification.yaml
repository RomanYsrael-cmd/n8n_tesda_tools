  "source_text": "SECTION 4\nASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or employable\nunit(s) of competency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the relevant unit/s of competency.\n\n4.1.3 Assessment shall cover all the competencies of the qualification with the basic and\ncommon units integrated or assessed concurrently with the core units of\ncompetency.\n\n4.1.4 The following are qualified to apply for assessment and certification:\n• Graduates of formal, non-formal and informal institutions and enterprise-based\ntraining programs\n• Experienced Workers (wage employed or self-employed)\n\n4.1.5 For the renewal of valid or expired National Certificate (NC) in Heavy Equipment\nOperation (Tower Crane) NC II, the individual/holder will have to undergo\nassessment in the amended TR for Heavy Equipment Operation (Tower Crane) NC\nIII.\n\n4.1.6 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations. It includes the following:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n\n--- PDF PAGE 110 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n105\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool to\nhelp the candidate and the assessor determine what evidence is available, where\ngaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 111 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n106\nANNEX A\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nCOMPETENCY MAP - CONSTRUCTION Sector\n(HEAVY EQUIPMENT OPERATION)\n HEAVY EQUIPMENT OPERATION (TRUCK MOUNTED CRANE) NC III\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 112 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n107\n\nUtilize specialize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice\nof social\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate usage\nof information\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth\nProgram,\nPolicies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and\nadjust problem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementatio\nn of OSH\nprograms in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nPrepare\nconstruction\nmaterials and tools\n\nObserve\nprocedures,\nspecifications and\nmanual of\ninstructions\n\nInterpret technical\ndrawings and plans\nPerform\nmensurations and\ncalculations\n\nMaintain tools and\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 113 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n108\n\nPerform pre and post\noperation procedures\nfor truck mounted\ncrane\n\nPerform basic preventive\nmaintenance servicing\nfor truck mounted crane\n\nPerform productive\noperation for truck\nmounted crane\n\nPerform pre and post\noperation procedures for\nrough terrain crane\n\nPerform basic preventive\nmaintenance servicing\nfor rough terrain crane\n\nPerform productive\noperation for rough\nterrain crane\n\nPerform pre and post\noperation procedures for\ncrawler crane\n\nPerform basic preventive\nmaintenance servicing\nfor crawler crane\n\nPerform productive\noperation for crawler\ncrane\n\nPerform pre and post\noperation procedures for\nforklift\n\nPerform basic\npreventive\nmaintenance servicing\nfor forklift\n\nPerform productive\noperation for forklift\n\nPerform pre and post\noperation procedures for\ntower crane\n\nPerform basic preventive\nmaintenance servicing\nfor tower crane\nPerform productive\noperation for tower care\n\nPerform pre and post\noperation procedures\nfor overhead and\ngantry crane\nPerform basic preventive\nmaintenance servicing\noverhead and gantry\ncrane\n\nPerform productive\noperation for overhead\nand gantry crane\n\nPerform pre and post\noperation procedures for\nhydraulic excavator\n\nPerform basic preventive\nmaintenance servicing\nfor hydraulic excavator\nPerform productive\noperation for hydraulic\nexcavator\n\nPerform pre and post\noperation procedures for\non-highway dump truck\n(rigid)\nPerform basic preventive\nmaintenance servicing\nfor on-highway dump\ntruck (rigid)\nPerform productive\noperation for on-highway\ndump truck (rigid)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 114 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n109\n\nGLOSSARY OF TERMS\n\nFor the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like fly jib used instead of the conventional lift block\nto perform different types of lifting jobs.\n\n2. Working radius\nRefers to the distance from a point on the curve to the axis of rotation.\n\n3. Reeving\nRefers to a rope system in which the rope travels around the drums\nand sheaves.\n\n4. Jib\n\nRefers to the projecting arm of tower crane.\n5. Tower crane\nRefers to a type of crane with a fixed vertical mast that is topped by a\nrotating boom and equipped with a winch for hoisting and lowering\nloads. The winch can be moved along the boom in any location within\nthe diameter of the boom that can be reached.\n\n6. Standard\nRefers to a degree or level of requirement set by the manufacturer.\n\n7. Safety devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n\n8. Work area\nRefers to any place inside the swing circle of the crane. It must be\nbarricaded off and only those directly involve in the lift shall be allowed\nto entry.\n\n9. Derated capacity\nof equipment\n\n10. Load Moment\n Indicator (LMI)\n\n11. Rigging gears\n\n12. Hazards\n\n13. Rigger\n\n14. Computer Literate\n\nRefers to the reduction of lifting capacity of equipment as certified by a\nthird party.\n\nRefers to electronic device that indicates crane configuration such as\nboom angle, boom length, load weight and working radius.\n\nRefers to equipment such as wire rope, turnbuckles, clevis, jacks,\nshackles, slings used with cranes and other lifting equipment in\nmaterial handling and structure relocation.\n\nRefer to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to signalman that directs the schedule of lifts for the crane, and\nis responsible for the safety of the loads.\n\nIs defined as the knowledge and ability to utilize computers and related\ntechnology efficiently, with a range of skills covering levels from elementary\nuse to computer programming and advanced problem solving.\n\n--- PDF PAGE 115 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n110\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHeavy Equipment Operation (Tower Crane) NC III\nQualification Code:\nCONTCO319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHEO (Tower Crane)\nNC II\n2007-20 /\nN/A\n01\nDocument Amended\n\nHEO (Tower Crane)\nNC III\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 116 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n111\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nENGR. SEBASTIAN Q. ALAMPAYAN, JR.\nSafety & Training Manager-\nIndustry Expert\nFirst Balfour, Inc.\nParañaque City\nEDUARDO C. EMAS\nTrainer/ Assessor\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\nMARY LOU C. URLANDA\nTrainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\nENGR. CORNELIO D. PADUA\nDepartment Head - Industry Expert\nManila’s Finest Construction, Inc.\nParañaque City\nJESUS C. SALVACION\nLiftin