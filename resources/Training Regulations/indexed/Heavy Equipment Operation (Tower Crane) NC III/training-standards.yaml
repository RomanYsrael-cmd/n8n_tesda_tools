s and\nequipment\n\n• Maintaining tools and equipment\n• Handling of tools and equipment\n• Identifying tools and equipment\ndefects\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n5.2 Perform basic\npreventive\nmaintenance\n• Handling of tools and equipment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 100 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n95\nCORE COMPETENCIES\n(160 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform pre-\nand post-\noperation\n procedures for\n tower crane\n1.1 Perform visual check\n of tower crane\n\n• Select personal protective\nequipment\n• Select tower crane capacity\n• Identify and explain operator\nserviceable parts\n• Perform inspection while\npower is switched off\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 hours\n1.2 Perform visual check of\ntower crane components\n\n• Explain procedures in\nperforming visual check of\ntower crane components\n• Identify conditions of the tower\ncrane components\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n1.3 Perform operation check\n• Explain procedures in\noperation check while the\npower is switched-on\n• Enumerate and explain\nmechanical components\n• Perform function check while\npower is switched on\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexami