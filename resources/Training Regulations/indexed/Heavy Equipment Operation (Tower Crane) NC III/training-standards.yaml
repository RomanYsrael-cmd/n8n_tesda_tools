actical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n120 hours\n3.2 Interpret load chart and\n/or load moment\nindicator\n•\nExplain how to determine the\nweight of the load\n•\nInterpret load chart and load\nmoment indicator\n•\nExplain how to determine the\nlifting capacity of the crane\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n3.3 Perform lifting and\ntransferring of load\n\n•\nEnumerate site and weather\nconditions\n•\nExplain safe working\nprocedures and practices\n•\nExplain and demonstrate\nhand signals\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 103 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n98\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both\non-and off-the-job as long as the learning is driven by the competency standards\nspecified\nby\nthe\nindustry.\n\nThe\nfollowing\ntraining\nmodalities\nand\ntheir\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and the\nTESDA Guidelines on the DTP;\n\n--- PDF PAGE 104 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n99\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this mode shall be\nissued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction may be enhanced through use of\nlearner-centered methods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may\nbe written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated into\nthe production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program (MTP).\n\n--- PDF PAGE 105 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n100\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the following\nrequirements:\n\n• At least Junior High School Level Completer or an Alternative Learning System\n(ALS) Certificate of Completion with grade 10 equivalent holder\n• Can communicate both orally and in writing\n• Can perform basic mathematical computation\n• Physically fit\n\n--- PDF PAGE 106 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n101\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nHEAVY EQUIPMENT OPERATION (TOWER CRANE) NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set\nWrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit\nTower crane with\ncamera/monitor\n(optional)\ncertified by Third\nParty accredited by\nDOLE-OSHC\n(Memorandum of\nAgreement (MOA)/\nrental)\n5 kgs. Grease\n5 pcs.\nHammer ballpeen\n(3-4 lbs.)\n1 unit\n Portable electric air\ncompressor, 180\ncfm\n10\ncans\nPenetrating oil\n5 pcs.\nPliers ( mechanical\n