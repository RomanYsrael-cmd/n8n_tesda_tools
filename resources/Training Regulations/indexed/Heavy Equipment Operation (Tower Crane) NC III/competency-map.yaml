  "source_text": "COMPETENCY MAP - CONSTRUCTION Sector\n(HEAVY EQUIPMENT OPERATION)\n HEAVY EQUIPMENT OPERATION (TRUCK MOUNTED CRANE) NC III\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 112 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n107\n\nUtilize specialize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice\nof social\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate usage\nof information\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth\nProgram,\nPolicies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and\nadjust problem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementatio\nn of OSH\nprograms in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nPrepare\nconstruction\nmaterials and tools\n\nObserve\nprocedures,\nspecifications and\nmanual of\ninstructions\n\nInterpret technical\ndrawings and plans\nPerform\nmensurations and\ncalculations\n\nMaintain tools and\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 113 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n108\n\nPerform pre and post\noperation procedures\nfor truck mounted\ncrane\n\nPerform basic preventive\nmaintenance servicing\nfor truck mounted crane\n\nPerform productive\noperation for truck\nmounted crane\n\nPerform pre and post\noperation procedures for\nrough terrain crane\n\nPerform basic preventive\nmaintenance servicing\nfor rough terrain crane\n\nPerform productive\noperation for rough\nterrain crane\n\nPerform pre and post\noperation procedures for\ncrawler crane\n\nPerform basic preventive\nmaintenance servicing\nfor crawler crane\n\nPerform productive\noperation for crawler\ncrane\n\nPerform pre and post\noperation procedures for\nforklift\n\nPerform basic\npreventive\nmaintenance servicing\nfor forklift\n\nPerform productive\noperation for forklift\n\nPerform pre and post\noperation procedures for\ntower crane\n\nPerform basic preventive\nmaintenance servicing\nfor tower crane\nPerform productive\noperation for tower care\n\nPerform pre and post\noperation procedures\nfor overhead and\ngantry crane\nPerform basic preventive\nmaintenance servicing\noverhead and gantry\ncrane\n\nPerform productive\noperation for overhead\nand gantry crane\n\nPerform pre and post\noperation procedures for\nhydraulic excavator\n\nPerform basic preventive\nmaintenance servicing\nfor hydraulic excavator\nPerform productive\noperation for hydraulic\nexcavator\n\nPerform pre and post\noperation procedures for\non-highway dump truck\n(rigid)\nPerform basic preventive\nmaintenance servicing\nfor on-highway dump\ntruck (rigid)\nPerform productive\noperation for on-highway\ndump truck (rigid)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 114 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n109\n\nGLOSSARY OF TERMS\n\nFor the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like fly jib used instead of the conventional lift block\nto perform different types of lifting jobs.\n\n2. Working radius\nRefers to the distance from a point on the curve to the axis of rotation.\n\n3. Reeving\nRefers to a rope system in which the rope travels around the drums\nand sheaves.\n\n4. Jib\n\nRefers to the projecting arm of tower crane.\n5. Tower crane\nRefers to a type of crane with a fixed vertical mast that is topped by a\nrotating boom and equipped with a winch for hoisting and lowering\nloads. The winch can be moved along the boom in any location within\nthe diameter of the boom that can be reached.\n\n6. Standard\nRefers to a degree or level of requirement set by the manufacturer.\n\n7. Safety devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n\n8. Work area\nRefers to any place inside the swing circle of the crane. It must be\nbarricaded off and only those directly involve in the lift shall be allowed\nto entry.\n\n9. Derated capacity\nof equipment\n\n10. Load Moment\n Indicator (LMI)\n\n11. Rigging gears\n\n12. Hazards\n\n13. Rigger\n\n14. Computer Literate\n\nRefers to the reduction of lifting capacity of equipment as certified by a\nthird party.\n\nRefers to electronic device that indicates crane configuration such as\nboom angle, boom length, load weight and working radius.\n\nRefers to equipment such as wire rope, turnbuckles, clevis, jacks,\nshackles, slings used with cranes and other lifting equipment in\nmaterial handling and structure relocation.\n\nRefer to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to signalman that directs the schedule of lifts for the crane, and\nis responsible for the safety of the loads.\n\nIs defined as the knowledge and ability to utilize computers and related\ntechnology efficiently, with a range of skills covering levels from elementary\nuse to computer programming and advanced problem solving.\n\n--- PDF PAGE 115 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n110\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHeavy Equipment Operation (Tower Crane) NC III\nQualification Code:\nCONTCO319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHEO (Tower Crane)\nNC II\n2007-20 /\nN/A\n01\nDocument Amended\n\nHEO (Tower Crane)\nNC III\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 116 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n111\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nENGR. SEBASTIAN Q. ALAMPAYAN, JR.\nSafety & Training Manager-\nIndustry Expert\nFirst Balfour, Inc.\nParañaque City\nEDUARDO C. EMAS\nTrainer/ Assessor\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\nMARY LOU C. URLANDA\nTrainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\nENGR. CORNELIO D. PADUA\nDepartment Head - Industry Expert\nManila’s Finest Construction, Inc.\nParañaque City\nJESUS C. SALVACION\nLifting Superintendent\nRoyal Cargo Inc.\nBatangas City /\nRigging Gears Specialist\nAssessment Center Inc.\nChairman/ AC Manager\nROBENSON S. LIM\nManpower Head/ Trainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\n\n--- PDF PAGE 117 ---\nHEAVY EQUIPMENT OPERATION (Tower Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n112\n The PARTICIPANTS in the Validation of this Training Regulations\n\n• C.M. Pancho Const. Inc.\n Quezon City\n• EEI Corporation\n Calamba City\n\n• J. E. Manalo and Company, Inc.\n Makati City\n\n• Occupational Safety and Health\n Center (OSHC)\n Quezon City\n\n• Bureau of Working Condition - DOLE\n Intramuros, Manila\n\n• Monark Equipment\nQuezon City\n\n• Sta. Clara Int’l. Corp.\n Mandaluyong City\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA