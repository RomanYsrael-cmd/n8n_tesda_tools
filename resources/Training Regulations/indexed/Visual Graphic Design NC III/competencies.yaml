s are \nidentified based on \nexperience and the use \nof problem solving tools / \nanalytical techniques. \n2.2. Possible cause \nstatements are \ndeveloped based on \nfindings \n2.3. Fundamental causes are \nidentified per results of \ninvestigation conducted \n2.1. Competence includes a \nthorough knowledge and \nunderstanding of the process, \nnormal operating parameters, \nand product quality to \nrecognize nonstandard \nsituations  \n2.2. Competence to include the \nability to apply and explain, \nsufficient for the identification \nof fundamental cause, \ndetermining the corrective \naction and provision of \nrecommendations \n2.2.1.  Relevant equipment and \noperational processes  \n2.1. Using range of \nformal problem \nsolving \ntechniques  \n2.2. Identifying and \nclarifying the \nnature of the \nproblem\n\n--- PDF PAGE 28 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                           Amended February 27, 2018 \n \n24\nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED KNOWLEDGE \nREQUIRED \nSKILLS \n2.2.2. Enterprise goals, targets \nand measures \n2.2.3. Enterprise quality, OHS \nand environmental \nrequirement  \n2.2.4. Enterprise information \nsystems and data \ncollation \n2.2.5. Industry codes and \nstandards\n3. Determine \ncorrective \naction \n3.1. All possible options are \nconsidered for resolution \nof the problem \n3.2. Strengths and \nweaknesses of possible \noptions are considered  \n3.3. Corrective actions are \ndetermined to resolve the \nproblem and possible \nfuture causes \n3.4. Action plans are \ndeveloped identifying \nmeasurable objectives, \nresource needs and \ntimelines in accordance \nwith safety and operating \nprocedures \n3.1. Competence includes a \nthorough knowledge and \nunderstanding of the process, \nnormal operating parameters, \nand product quality to \nrecognize nons