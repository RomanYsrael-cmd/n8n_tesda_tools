        "source_text": "500311113\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in application of mathematical concepts and\ntechniques.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n1.1 Problem areas are\nidentified based on given\ncondition\n1.2 Mathematical\ntechniques are selected\nbased on the given\nproblem\n\n1.1 Fundamental\noperation\n(addition,\nsubtraction,\ndivision,\nmultiplication)\n1.2 Units of\nmeasurement and\nits conversion\n1.3 Fundamental of\nunits\n1.4 Standard formulas\n1.5 Basic measuring\ntools/devices\n1.6 Measurement\nsystem\n1.7 Basic measuring\ntools/devices\n1.8 Steps in solving\nproblem\n1.1 Identifying and\nselecting different\nmeasuring tools\n1.2 Applying different\nformulas in solving\nproblems\n1.3 Describing the\nunits of\nmeasurement and\nfundamental units\n1.4 Stating arithmetic\ncalculations\ninvolving the\nfollowing; addition,\nsubtraction,\ndivision,\nmultiplication\n1.5 Applying theory\ninto actual\napplication on\nshipboard catering\nprocesses\n\n2. Apply\nmathematical\nprocedure/\n solution\n1.1. Mathematical techniques\nare applied based on the\nproblem identified\n1.2. Mathematical\ncomputations are\nperformed to the level of\naccuracy required for the\nproblem\n1.3. Result of mathematical\ncomputation is\ndetermined and verified\nbased on job\nrequirements\n2.1 Problem-based\nquestions\n2.2 Estimation\n2.3 Use of\nmathematical tools\nand standard\nformulas\n2.4 Mathematical\ntechniques\n\n2.1 Solving\nmathematical\ncomputations\n2.2 Converting Metric\nto English\n2.3 Selecting and\nusing appropriate\nand efficient\ntechniques and\nstrategies to solve\nproblems\n3. Analyze results\n3.1 Result of application is\nreviewed based on\nexpected and required\nspecifications and\noutcome\n3.2 Appropriate action is\napplied in case of error\n3.1 Techniques in\nanalyzing the\nresults\n3.2 Process in\nreviewing the\nresults\n3.3 Precision and\naccuracy\n3.4 Four fundamental\n3.1 Analyzing the result\nbased on the\nspecified\nrequirements\n3.2 Interpreting and\ncommunicating the\nresults of the\nanalysis\n\n--- PDF PAGE 21 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n17\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\noperations\n3.5 Steps in solving\nproblem\n3.6 Standard formulas\n3.7 Conversion\nmeasurement\n\n--- PDF PAGE 22 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n18\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Mathematical\ntechniques\nMay include:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate\naction\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\nEVIDENCE GUIDE\n\n1. Critical\nAspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n1. Resource\nImplications\nThe following resources should be provided:\n2.1 Calculator\n2.2 Basic measuring tools\n2.3 Case Problems\n2. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Authenticated portfolio\n3.2 Written Test\n3.3 Interview/Oral Questioning\n3.4 Demonstration\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 23 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n19\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\n\n(Apply technology effectively)\nUNIT CODE\n:"
