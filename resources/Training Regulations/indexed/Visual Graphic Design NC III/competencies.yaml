strator \n8.5. Paint tools SAI  \n8.6. Gimp / Krita ( open source ) \n8.7.\nMS Paint\n9. Appropriate \npersonnel  \nMay include : \n9.1. Technical person \n9.2. IT person \n9.3. Department Head \n9.4. Administration Head  \n9.5. Supervisor \n9.6.\nProduction Manager\n10. Design Style  \nMay include : \n10.1. Minimalist \n10.2. Goth \n10.3. Classic \n10.4. modern \n10.5. Western \n10.6. Asian  etc.\n11. Font  \nMay include  the following : \n11.1. Arial \n11.2. Times Roman \n11.3. Comic sans \n11.4. Impact \n11.5. Century Gothic \n11.6. script \n11.7. Courier  \n11.8. Lithos \n11.9. Myriad etc.\n12. Color codes  \nMay include : \n12.1. HTML color codes \n12.2. Hex color code \n12.3. RGB color code \n12.4. CMYK code\n\n--- PDF PAGE 51 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n47\nVARIABLE \nRANGE \n12.5. Pantone colors\n13. Documentation  \nMay include the following : \n13.1. Design Brief \n13.2. Design measurements \n13.3. Design layout \n13.4. Color combination & codes\n14. Visual Design & \nCommunication \nElements  \nMay include the following: \n14.1. Colors  \n14.2. Composition  \n14.3. Proportion  \n14.4. Balance  \n14.5. Framing  \n14.6. Line  \n14.7. Texture  \n14.8. Shape  \n14.9. Form  \n14.10. Tone  \n14.11. Scale  \n14.12.  Movement or animation \n14.13. Fonts/typography: \n14.13.1. Typeface    \n14.13.2. Type style  \n14.13.3. Point / font size \n14.13.4. Tracking  \n14.13.5. Leading  \n14.13.6.\nKerning"
