        "source_text": "ICT216316\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\nincorporate the principles of visual design and communication\ninto the development of designs for USER INTERFACE.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Receive and\ninterpret the\nuser interface\ndesign brief\n\n1.1. The proposed user interface\ndesign details and overall\nwork scope is established and\nclarified from the relevant\npersonnel\n1.2. The specifications,\nparameters & constraints of\nthe user interface design are\nidentified from the design brief\n1.3. Information pertinent to the\ndesign brief are sourced and\nevaluated to create the\ncorrect design directives.\n1.4. Visual elements and tools\nare researched and compared\nbased on the design brief.\n1.5. Relationship between the\nvisual elements, hardware\nand software required is\nidentified based on the project\nrequirements\n1.6. Research media and findings\nare organized and updated as\nrequired\n1.7. Initial discussions of the\ndesign brief against the\nfindings are evaluated with\nrelevant personnel.\n1.1. Verbal\ncommunication\n1.2. Written\ncommunication\n1.3. Intellectual\nproperty\n1.4. Behavioral\nScience\n1.5. Human and Animal\nAnatomy\n1.6. Elements of design\n1.7. Principles of\ndesign\n1.8. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n1.9. Trends\n\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Listening skills\n1.4. Critical thinking\n1.5. Analytical skills\n\n2. Select tools,\ndelivery\nplatform and\nappropriate\nsoftware\n2.1 Visual elements and tools are\nidentified and presented to\nthe relevant personnel.\n2.2 Appropriate visual elements\nand tools are selected based\non the design brief\nrequirements\n2.3 Materials, hardware, and\nsoftware are gathered and\nsourced based project\nrequirements.\n2.4 Non-functioning and missing\nmaterials and equipment are\nreported to appropriate\npersonnel\n\n2.1 Verbal\ncommunication\n2.2 Written\ncommunication\n2.3 Intellectual\nproperty\n2.4 Behavioral\nScience\n2.5 Human and\nAnimal Anatomy\n2.6 Elements of\ndesign\n2.7 Principles of\ndesign\n\n2.1 Artistic and\ncreative skills\n2.2 Computer\napplication\nskills computer/\napplication\ntroubleshooting\nskills\n2.3 Critical thinking\n2.4 Analytical skills\n\n--- PDF PAGE 69 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n65\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.8 Computer\nknowledge\n2.9 Familiarity in\ndifferent graphic\napplications\n2.10 Geometry\n2.11 Algebra\n2.12 Practicing 3Rs –\nReduce, Re-use,\nRecycle/ recover\nand\nenvironmental\npolicies.\n2.13 Trends\n3. Generate and\ndevelop\ndesigns for\nuser interface\n3.1. Range of feasible design\nideas and creative solutions\nare generated in response to\nthe design brief.\n3.2. Design ideas are discussed\nand collaborated with relevant\npersonnel.\n3.3. Brand guidelines specified in\nthe design brief are applied to\nthe rough design outputs.\n3.4. Creative ideas and solutions\nare reflected and assessed\nbased on constraints to meet\nthe design brief.\n3.5. User interface design studies\nin the format required are\nprepared and submitted to\nclient and /or supervisor for\ncomments and revisions.\n\n3.1. Verbal\ncommunication\n3.2. Written\ncommunication\n3.3. Intellectual\nproperty\n3.4. Behavioral\nScience\n3.5. Human and\nAnimal Anatomy\n3.6. Elements of\ndesign\n3.7. Principles of\ndesign\n3.8. Computer\nknowledge\n3.9. Familiarity in\ndifferent graphic\napplications\n3.10. Geometry\n3.11. Algebra\n3.12. Practicing 3Rs –\nReduce, Re-use,\nRecycle/ recover\nand\nenvironmental\npolicies.\n3.13. Trends\n3.1. Artistic and\ncreative sk