        "source_text": "ICT216318\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\nincorporate the principles of visual design and communication into\nthe design and production of booth and product window displays.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Receive and\ninterpret the\nbooth &\nproduct\nwindow /\ndisplay\ndesign brief\n\n1.1. Instructions & specifications\nto develop the booth &\nproduct window /display\ndesign is read & analyzed\nbased on the design brief.\n1.2. Proposed booth & product\nwindow/display design is\nestablished and clarified\nfrom the relevant personnel\nto inform design decisions.\n1.3. Specifications, parameters or\nconstraints are identified\nbased on the design brief.\n1.4. Information are sourced and\nevaluated pertinent to design\nbrief.\n1.5. Required design ideas and\nsolutions are assessed for\nimplications on budget,\ntimeline, technical feasibility\nand suitability.\n1.6. All relevant questions\nessential to develop the\nspecific booth & product\nwindow / display design is\ndiscussed and liaised with\nrelevant personnel.\n1.1. Verbal\ncommunication\n1.2. Written\ncommunication\n1.3. Intellectual property\n1.4. Anthropometrics\n1.5. Ergonomics\n1.6. Principles of design\n1.7. Elements of design\n1.8. Drafting/Technical\ndrawing\n1.9. Crafting\n1.10. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n1.11. Trends\n\n1.1. Communication\nskills\n1.2. Computer\napplication skills\n1.3. Computer/\napplication\ntroubleshooting\nskills\n1.4. Critical thinking\n1.5. Analytical skills\n\n2. Develop\ndesign\nconcepts for\nspecific booth\nand product\nwindow /\ndisplay\n2.1. References to support the\ndesign process are identified\nappropriate to the design\nbrief.\n2.2. Design ideas are explored\nusing isometric and\northographic methods.\n2.3. Ideas for design concepts\nare generated through\nresearch and observation of\nstructures and window\ndisplays.\n2.4. Different design style options\nare explored and sketched\nbased on the design\nparameters.\n2.5. Brand guidelines specified\nin the design brief are\n2.1. Verbal\ncommunication\n2.2. Written\ncommunication\n2.3. Intellectual property\n2.4. Elements of design\n2.5. Principles of design\n2.6. Anthropometrics\n2.7. Ergonomics\n2.8. Form follows\nfunction\n2.9. Computer\nknowledge\n2.10. Familiarity in\ndifferent graphic\napplications\n2.11. Architecture and\nInterior Design\n2.1. Artistic and\ncreative skills\n2.1.1. Drawing\nand\nsketching\n2.1.2. 3D design\ntechniques\n2.2. Computer\napplication skills\n2.3. Computer/\napplication\ntroubleshooting\nskills\n2.4. Critical thinking\n2.5. Analytical skills\n2.6. Holistic skills\n\n--- PDF PAGE 80 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n76\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\napplied to the rough design\noutputs.\n2.6. Location or space\nguidelines of the product\nwindow / display is noted\nand measured to the design\nspecifications.\n2.7. Final rough designs in the\nformat required are prepared\nand submitted to relevant\npersonnel for comments and\nrevisions.\n\n2.12. Basic Carpentry\nand Electrical\nInstallation\n2.13. Trends\n2.14. Geometry\n2.15. Algebra\n2.16. Trigonometry\n\n3. Finalize\nselected\ndesign using\nprecise\nspecifications\nprovided\n\n3.1. Comments and feedback\nfrom client and/ or supervisor\nare collected & analyzed to\nrevise and edit the chosen\ndesign concept.\n3.2. Multi-view Orthographic\ndrawings of the selected\ndesign are provided for\narrangement & construction\nreference.\n3.3. Booth or product window/\ndisplay size and dimensions\nare accurately indicated on\nthe final design.\n3.4. Materials & specifications\nand construction items to be\nused on the final output are\nidentified and indicated over\nthe design parts.\n3.5. Brand guidelines should be\nclearly seen on the final\nbooth design, as required in\nthe design brief.\n3.6. A plan of the utilities\nlocation and installation\nshould be clearly indicated in\nthe final booth & product\nwindow/ display design, in\ncoordination with relevant\npersonnel.\n3.7. Final design with proper\ndocumentation of the design\ndetails are prepared and\nsubmitted to client and/or\nsupervisor for final approval.\n3.1. Verbal\ncommunication\n3.2. Written\ncommunication\n3.3. Intellectual\nproperty\n3.4. Elements of\ndesign\n3.5. Principles of\ndesign\n3.6. Anthropometrics\n3.7. Ergonomics\n3.8. Form follows\nfunction\n3.9. Computer\nknowledge\n3.10. Familiarity in\ndifferent graphic\napplications\n3.11. Architecture and\nInterior Design\n3.12. Basic Carpentry\nand Electrical\nInstallation\n3.13. Geometry\n3.14. Algebra\n3.15. Trigonometry\n\n3.1. Artistic and\ncreative skills\n3.2. Computer\napplication\nskills\n3.3. Computer\napplication\ntroubleshooting\nskills\n3.4. Critical thinking\n3.5. Analytical skills\n3.6. Holistic skills\n\n--- PDF PAGE 81 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n77\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Produce 3D\nModel\nimages/ view\nof the\napproved\nbooth or\nproduct/\nwindow\ndisplay\ndesign\n\n4.1. Approved final booth design\nis created into a precise\ncolored 3D model images\nbased on the multi-view\northographic drawings.\n4.2. Brand, logo, color of overall\n3D model images are fully\nseen and reflected based on\nthe approved final design &\nrequirements.\n4.3. Structure and functionality\nare indicated with\ncollaboration and refinement\nwith relevant personnel.\n4.4. Required materials needed\nfor the design are\nresearched and indicated\nbased on approved design\ndocumentation & structure\nplan.\n4.5. Any electrical, lighting and\nother important utilities are\nindicated, and/or consulted\nwith relevant personnel\n4.6. Final design, colored images\nof 3D model and\ndocumentation are\npresented for approval by\nrelevant personnel.\n\n4.1. Verbal\ncommunication\n4.2. Written\ncommunication\n4.3. Intellectual property\n4.4. Elements of design\n4.5. Principles of design\n4.6. Anthropometrics\n4.7. Ergonomics\n4.8. Form follows\nfunction\n4.9. Computer\nknowledge\n4.10. Familiarity in\ndifferent graphic\napplications\n4.11. Architecture and\nInterior Design\n4.12. Basic Carpentry\nand Electrical\nInstallation\n4.13. Geometry\n4.14. Algebra\n4.15. Trigonometry\n\n4.1. Artistic and\ncreative skills\n4.2. Computer\napplication skills\n4.3. Computer/\napplication\ntroubleshooting\nskills\n4.4. Critical thinking\n4.5. Analytical skills\n4.6. Holistic skills\n\n--- PDF PAGE 82 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n78\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Design brief\nMay include the following :\n1.1. Project Statement\n1.2. Project Objectives\n1.3. Variables\n1.4. Statistical Interpretation\n1.5. Conclusions and Recommendations\n1.6.\nBibliography / References\n2. Relevant personnel\nMay include the following:\n2.1. Creative/art director\n2.2. Technical director\n2.3. Head designer\n2.4. Carpenters\n2.5. Architect\n2.6. Department head\n2.7. Client\n2.8. Utility Head\n2.9.\nLocation / Venue Manager\n3. Brand guidelines\nMay include:\n3.1. Standards\n3.2. Signage\n3.3. Brand identifier\n3.4.\nLogo colors\n4. Location or space\nguidelines\nMay include:\n4.1. Space dimensions\n4.2. Obstacles\n4.3. Location of electrical outlet\n4.4. Design style\n4.5. Design constraints\n4.6. Material constraints\n4.7.\nUtilities constraints\n5. Multi-view Orthographic\ndrawings\nMay include :\n5.1. Top view\n5.2. Front view\n5.3. Back view\n5.4. Left side view\n5.5.\nRight side view\n6. Materials &\nspecifications\nMay include the following:\n6.1. Styrofoam\n6.2. Tarpaulin\n6.3. Electrical gadgets\n6.4. Neon lights\n6.5. Digital displays\n6.6. Metallic materials\n6.7. Wood materials\n6.8. Plastic materials\n6.9.\nGlass materials\n\n--- PDF PAGE 83 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n79\nVARIABLE\nRANGE\n6.10. Actual product being displayed\n6.11. Mannequins\n6.12. Papers/cardboards\n6.13. Textiles\n6.14. Organic materials\n6.15. Panel systems\n7. Utilities location &\ninstallation plan\n\nMay include the following:\n7.1. Outlet location\n7.2. Electrical set up plan\n7.3. Pipe location plan\n7.4. Air-conditioner / fan location\n7.5. Light location\n7.6. Sink location\n7.7. Faucet location\n7.8.\nGas location & set up\n8. 3D Model images\nMay include the following:\n8.1. 3D front view\n8.2. 3D side view\n8.3. 3D isometric view\n8.4. 3D aerial view\n8.5. 3D back view\n*** This is executed in either 2D drawing, vector drawing\nor 3D software images.\n\n--- PDF PAGE 84 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n80\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment must show that the candidate:\n1.1. Interpreted booth & product window/display design\nrequirements based on the design brief.\n1.2. Generated and developed designs of booth & product\nwindow/display based on the specifications of the brand\nguidelines and space guidelines indicated in the design brief\n1.3. Finalized the design of booth & product window/display\nusing accurate measurements and materials used.\n1.4. Created a precise colored 3D model images based on the\nmulti-view orthographic drawings for the selected booth &\nproduct window/display design using appropriate materials.\n2. Method of\nassessment\nThe assessor must assess the candidate through the ff:\n2.1. Demonstration with oral questioning\n2.2. Interview\n3. Resources\nrequired for\nassessment\nThe following must be provided:\n3.1. work area\n3.2. Industry standard hardware and software application\n3.3. Design brief\n4. Context of\nassessment\n4.1. Competency may be assessed on the job, off the job or a\ncombination of these. Off the job assessment must be\nundertaken in a closely simulated workplace environment.\n\n--- PDF PAGE 85 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n81"
