.1. Implementing preventive maintenance schedule\n6.2. Coordinating with manufacturer’s technician\n\n--- PDF PAGE 26 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n22\nEVIDENCE GUIDE\n\n1. Critical\naspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent with\nwork requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Interview\n3.2 Actual demonstration\n3.3 Authenticated portfolio (related certificates of training/seminar)\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 27 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n23\nUNIT OF COMPETENCY: APPLY CRITICAL THINKING AND PROBLEM SOLVING\nTECHNIQUES IN THE WORKPLACE\nUNIT CODE :"
