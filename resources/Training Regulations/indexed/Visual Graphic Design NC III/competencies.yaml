        "source_text": "--- PDF PAGE 52 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n48\nUNIT TITLE:   \n     DEVELOP DESIGNS FOR PRINT MEDIA  \nUNIT CODE:     \n     ICT216314 \nUNIT DESCRIPTOR:  This unit describes the skills and knowledge required to \nconceptualize and design for posters, tarpaulin, magazine, \nbrochures, invitation and other kinds of design intended for \nprinted material output or format for personal, industrial and \ncommercial use. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Interpret and \nanalyze the  \nprint media \ndesign brief  \n1.1. The  instructions & \nspecifications   to develop the  \ndesign for the specific print \nmedia requirement is \nanalyzed based on the design \nbrief \n1.2. The scope of work and \ndeadline schedules of the \nproposed  design is clarified in \ndetail  from the relevant \npersonnel \n1.3. Information needed via \nresearch and other resources \nto develop required designs \nfor print is identified. \n1.4. Approval stages of submitted \ndesign concepts is confirmed \nwith the client and/or a \nsupervisor. \n1.5. Print format of the approved \ndesign is identified with all its \nspecifications based on the \ndesign brief. \n1.6. All questions essential to \ndevelop the design for print is \ndiscussed and liaised with \nrelevant personnel.\n1.1. Verbal \ncommunication \n1.2. Written \ncommunication \n1.3. Intellectual property \n1.4. Behavioral Science \n1.5. Elements of design \n1.6. Principles of design \n1.7. Computer \nknowledge \n1.8. software knowledge \n1.9. Materials \nspecifications \n1.10. Practicing 3Rs –\nReduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n1.11. Trends \n1.12. Basic Math \n1.13. Economics \n(Pricing) \n \n \n1.1. Communication \nskills \n1.2. Interpersonal \nskills  \n1.3. Listening skills \n1.4. Critical Thinking \n1.5. Analytical and \ncomprehension \nskills \n1.6. Reporting skills \n1.7. Presentation \nskills \n1.8. Practicing \nOSHS, EHSM, \n3Rs \n \n2. Prepare  \nequipment &  \nmaterials for \nprint media \ndesign \n2.1. All necessary materials and \nequipment to be used are \nprepared according to the \nspecifications of the design \nbrief \n2.2. Appropriate software is \nselected and checked based \non the format specified for the \nfinal print media output. \n2.3. Monitor is calibrated to show \nthe correct color grading of \ndesigns \n2.4. Color scheme or print \npalettes are organized and \narranged to suit requirements \n2.1. Verbal \ncommunication \n2.2. Written \ncommunication \n2.3. Intellectual \nproperty \n2.4. Behavioral Science \n2.5. Elements of design \n2.6. Principles of design\n2.7. Computer \nknowledge \n2.8. software \nknowledge  \n2.9. Practicing 3Rs –\nReduce, Re-use, \n2.1. Artistic & \nCreative skills  \n2.2. Communication \nskills \n2.3. Computer \noperation skills \n2.4. Reporting skills \n2.5. Analytical and \ncomprehension \nskills \n2.6. Software usage \nskills \n2.7. Practicing \nOSHS, EHSM, \n3Rs\n\n--- PDF PAGE 53 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n49\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nof final design output. \n2.5. Page size, orientation, \nappropriate resolution are \nselected based on the design \nbrief specifications \n2.6. Non-functioning and missing \nmaterials and equipment are \nreported to appropriate \npersonnel \nRecycle/recover \nand environmental \npolicies. \n2.10. Trends \n2.11. Basic Math \n3. Develop \ndesigns for the  \nspecific print \nmedia output \n \n3.1. Ideas for design concepts of \nthe specified print output are \ngenerated through research \nand sketches experimentation.\n3.2. Appropriate Document / page \nset up is  applied based on \nthe design brief requirements \n3.3. Different print or graphic \ndesign style options are \nexplored and sketched basing \non the design parameters. \n3.4. Required text copy, words, \ntagline or message for print is \nprepared and analyzed for    \nappropriate layout placement. \n3.5. Font style, color and size are \ncarefully selected and placed \nin a proper layout to fit overall \ndesign output \n3.6. All Elements created are \norganized on different \ncomprehensive layout/ \ncompre to experiment on the \nbest arrangements for design \npresentation. \n3.7. Graphic images, product \nshots, photographs and other \nelements can be imported \nfrom other applications and \nadded to the comprehensive \nlayout. \n3.8. Color combinations are \nexperimented to compliment \nconcept designs  \n3.9. Final rough comprehensive \nlayout designs in the format \nrequired are prepared and \nsubmitted to client and /or \nsupervisor for comments and \nrevisions. \n3.1. Verbal \ncommunication \n3.2. Written \ncommunication \n3.3. Intellectual \nproperty \n3.4. Behavioral Science \n3.5. Human and Animal \nAnatomy \n3.6. Principles of design\n3.7. Elements of design \n3.8. Graphic design \nstyles \n3.9. Philosophy \n3.10. Computer \nknowledge \n3.11. Familiarity in \ndifferent graphic \napplications \n3.12. Printing \nKnowledge \n3.13. internet browsing/ \nresearch \n3.14. Practicing 3Rs –\nReduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n3.15. Trends \n3.16. Basic Math \n3.17. Geometry \n3.1. Artistic and \ncreative skills \n3.2. Communication \nskills \n3.3. Computer \noperation skills \n3.4. Reporting skills \n3.5. Analytical and \ncomprehension \nskills \n3.6. Software usage \nskills \n3.7. Holistic design \nskills \n3.8. Organizational \nskills \n3.9. Practicing \nOSHS, EHSM, \n3Rs\n\n--- PDF PAGE 54 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n50\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Finalize print \nmedia design \nlayout  \n \n4.1. Comments and feedback from \nclient and/ or supervisor are \nanalyzed to revise the \nelements of the proposed  \ncomprehensive layouts \n4.2. Combined elements in the \ncomprehensive layout/ \ncompre are imposed correctly \nto suit specified sheet size. \n4.3. Numerical sequence and lay \ndown of the product or mock-\nup is correctly identified to \nmeet binding and finishing \nrequirements. \n4.4. Bleed allowance is \nincorporated in margins and \nborders. \n4.5. Text copy is reviewed for \npossible errors and omissions \nand are discussed with client \nand/ or supervisor. \n4.6. Alignment of the basic \nelements are maintained \nbased on the overall balance \nof the layout and correct color \nblends and gradients. \n4.7. Hard copy / progressive proof \nis printed and rechecked for \nerrors, omissions to fit the \noverall balance of the layout. \n4.8. Necessary changes are made, \nreviewed and proof read as \nrequired while comprehensive \nlayout/ compre is still on \nscreen. \n4.9. The project and/or work is \nsaved according to \norganizational procedures. \n4.10. A digital proof or file format \nis created to present to client \nand/ or Supervisor for final \ncomments and approval. \n \n4.1. Verbal \ncommunication \n4.2. Written \ncommunication \n4.3. Intellectual \nproperty \n4.4. Principles of design\n4.5. Elements of design \n4.6. Philosophy \n4.7. Computer \nknowledge \n4.8. Familiarity in \ndifferent graphic \napplications \n4.9.  Printing \nKnowledge \n4.10. Internet browsing/ \nresearch \n4.11. Practicing 3Rs –\nReduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n4.12. Trends \n4.13. Basic Math \n4.14. Geometry \n \n \n \n4.1. Artistic and \ncreative skills \n4.2. Communication \nskills \n4.3. Computer \noperation skills \n4.4. Reporting skills \n4.5. Analytical and \ncomprehension \nskills \n4.6. Software usage \nskills \n4.7. Holistic design \nskills \n4.8. Organizational \nskills \n4.9. Practicing \nOSHS, EHSM, \n3Rs \n \n5. Prepare  final \nprint output & \ndocumentation \n \n5.1. Approved final layout design \nand /or project is prepared for \nprinting. \n5.2. Correct Color profile are \nselected carefully for standard \nprint output option \n5.3. File formats are chosen to \nbest represent artwork styles.\n5.1. Verbal \ncommunication \n5.2. Written \ncommunication \n5.3. Intellectual \nproperty \n5.4. Physics \n5.5. Elements of \n5.1. Artistic and \ncreative skills  \n5.2. Communication \nskills \n5.3. Computer \noperation skills \n5.4. Reporting skills \n5.5. Analytical and\n\n--- PDF PAGE 55 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n51\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5.4. Compression options are \nselected that keep the image \nquality high and the file size \nlow. \n5.5. Export options of file are set \nand saved to the best settings \nfor the final print output. \n5.6. The appropriate format for \nsaving the images/ artworks/ \nobjects and layout are used as \nrequired in the specifications \nof the design brief. \n5.7. The resolution for effects and \nany filters are set based on \nimage quality. \n5.8. Document / page set up is \nchecked to ensure correct \nlayout file has no non-\nprintable elements. \n5.9. Final high-resolution file is \nchecked for final approval of \nclient and/or supervisor before \nsending to print. \nDesign \n5.6. Principles of \ndesign \n5.7. Typography \n5.8. Computer \nknowledge \n5.9. Familiarity in \ndifferent graphic \napplications \n5.10. Printing \nKnowledge \n5.11. internet browsing/ \nresearch \n5.12. Practicing 3Rs –\nReduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n5.13. Trends \n5.14. Basic Math \n5.15. Algebra \n \ncomprehension \nskills \n5.6. Printing skills \n5.7. Software usage \nskills \n5.8. Holistic design \nskills \n5.9. Organizational \nskills \n5.10. Practicing \nOSHS, EHSM, \n3Rs \n6. Color separate \nartwork file for \nfinal printing \n \n6.1. The final and approved   print \nmedia artwork file is prepared \nfor final printing \n6.2. The correct format for the \ncolor separation is \ndetermined and checked \nbased on the final \nspecifications on the design \nbrief.  \n6.3. Command preferences are \ncorrectly set for print quality \nand process. \n6.4. The color separation \noptions are set according to \nprint requirements of the \ndesign brief. \n6.5. Correct Color profile is \nselected for the final output, \nbased on client \nspecifications. \n6.6. Screen frequency with value \n& color preferences is \nselected and saved which is \nappropriate for the print \nquality \n6.7. Spreads and choke traps are \ncreated to avoid \nmisregistration.\n6.1. Verbal \ncommunication \n6.2. Written \ncommunication \n6.3. Intellectual property \n6.4. Principles of design \n6.5. Elements of design \n6.6. Color Theory \n6.7. Typography \n6.8. Physics \n6.9. Computer \nknowledge \n6.10. Familiarity in \ndifferent graphic \napplications \n6.11. Printing Knowledge \n6.12. Internet reseach/ \nbrowsing \n6.13. Basic Math \n6.14. Geometry \n6.15. Practicing 3Rs –\nReduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n6.16. Trends \n \n6.1. Artistic and \ncreative skills \n6.2. Communication \nskills \n6.3. Computer \noperation skills \n6.4. Reporting skills \n6.5. Analytical and \ncomprehension \nskills \n6.6. Printing skills  \n6.7. Software usage \nskills \n6.8. Holistic design \nskills \n6.9. Organizational \nskills \n6.10. Practicing \nOSHS, EHSM, \n3Rs\n\n--- PDF PAGE 56 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n52\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6.8. Overprint of objects are \nchecked and defined to avoid \nink trap. \n6.9. A final proof is created, \nseparations checked and \ncompleted based on the \napproved final artwork\n\n--- PDF PAGE 57 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n53\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Print media  \nMay include the following : \n1.1. Print ads \n1.2. Poster \n1.3. Banners \n1.4. Billboards  \n1.5. Brochures  \n1.6. Invitation  \n1.7. Annual reports \n1.8. Flyers / pamphlets \n1.9. Menu  \n1.10. Book / book covers \n1.11. Comics  \n1.12. Magazines  \n1.13. Callcards  etc. \n2. design brief  \nMay include the following  : \n2.1. Project Statement \n2.2. Project Objectives \n2.3. Variables \n2.4. Statistical Interpretation \n2.5. Conclusions and Recommendations \n2.6. Bibliography / References\n3. Relevant \npersonnel  \nMay include : \n3.1. Art / creative director \n3.2. Supervisor \n3.3. Department Head \n3.4. Production Manager \n3.5. Client\n4. Resources  \nMay include : \n4.1. Books / magazines \n4.2. Internet   \n4.3. DVDs / Videos \n4.4. Photographs \n4.5. Graphic Images\n5. Approval stages  \nMay include the following stages : \n5.1. Draft sketches or design stage \n5.2. Comprehensive layout stage \n5.3. Final layout stage \n5.4. Color separation stage \n6. Print format  \nMay include the following format: \n6.1. psd  \n6.2. png \n6.3. tiff \n6.4. jpeg\n\n--- PDF PAGE 58 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n54\nVARIABLE \nRANGE \n7. Materials  \nMay include the following : \n7.1. Paper / sketchpad / tracing paper \n7.2. Lead & colored pencils \n7.3. Colored pens / sign pen \n7.4. Markers color palettes \n7.5. Paper grade palette \n7.6. USB / flash drive \n7.7. Watercolor / poster color \n7.8. Ruler  \n7.9. Scissors  \n7.10. Glue / tape \n7.11. Post it \n7.12. Design books / magazines \n8. Equipment  \nMay include the following : \n8.1. Drawing table \n8.2. Computer with peripherals  \n8.3. Chair internet  \n8.4. Removable hard drive \n8.5. Drawing tablet \n8.6. Mobile phone \n8.7. Camera  \n8.8. Laptop  \n9. Software  \nMay include the following  : \n9.1. Photoshop \n9.2. CorelDraw  \n9.3. InDesign \n9.4. Illustrator \n9.5. Acrobat  \n9.6. Sketch up \n10. Color scheme  \nMay include the following color scheme tools : \n10.1. Color wheel \n10.2. Adobe Kuler \n10.3. Color Munki \n10.4. Colorotate \n10.5. Color Calculator \n10.6. Copaso : Color Palette software \n10.7. Mudcube Color sphere \n11. Print palette \nMay include the following print palette color combinations : \n11.1. Cool Color scheme palette \n11.2. Warm color scheme palette \n11.3. Sweet color scheme palette \n11.4. Exotic color scheme palette\n\n--- PDF PAGE 59 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n55\nVARIABLE \nRANGE \n12. Appropriate \npersonnel  \nMay include : \n12.1. Production Manager \n12.2. IT/ software/ network person \n12.3. Art / Creative Director \n12.4. Supervisor \n12.5. Department Head \n12.6. Client \n13. Document / \npage set up \nMay include: \n13.1. Margins \n13.2. Page size \n13.3. Page orientation \n13.4. Number of pages \n13.5. Multiple columns \n13.6. Arrangement of pages \n13.7. Pictures/graphics size\n14. Graphic design \nstyle  \nMay include the following  : \n14.1. Art Nouveau \n14.2. Art Deco \n14.3. American Kitsch \n14.4. Contemporary \n14.5. Grunge \n14.6. psychedelic \n14.7. Victorian \n15. Elements  \nMay include: \n15.1. Graphics \n15.2. Frames \n15.3. Fonts & Texts \n15.4. Photographs \n15.5. Menus or dialogue boxes \n15.6. indexes \n15.7. Logos \n15.8. Information & details\n16. Comprehensive \nlayout / compre \nA draft layout/ design used to present to a client/ supervisor \nwhich contains either of the following elements : \n16.1. Sketches  \n16.2. Photographs  \n16.3. Graphic images \n16.4. Font / text / messages \n16.5. Logos  \n16.6. Clip art   \n17. Imposed  \nMay include the following: \n17.1. Plug-ins \n17.2. Stand alone applications or automated features of high-\nend page layout programs exist to impose pages\n\n--- PDF PAGE 60 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n56\nVARIABLE \nRANGE \n18. Organizational \nprocedures \n \nMay include the following: \n18.1. Organizational procedures for saving a document can \ninclude the preferred format, naming preferences and the \nlocation of file is saved to.\n19. File format \nMay include: \n19.1. PDF \n19.2. jpeg \n19.3. tiff\n20. Correct Color \nprofile \nMay include the following: \n20.1. CMYK color \n20.2. Spot colors \n20.3. Registration colors \n20.4. Pantone color\n21. Compression \noptions \nMay include : \n21.1. Lossless  \n21.2. Lossy\n22. Command \npreferences \nMay include: \n22.1. RGB \n22.2. CMYK \n22.3. Color management \n22.4. Proof options \n22.5. Document Information subjects\n23. Color separation \noptions \nMay include the following: \n23.1. Process color \n23.2. Spot color \n23.3. Halftone  \n23.4. Resolution  \n23.5. Bleed  \n23.6. printer marks\n24. Screen \nFrequency \nmay include the following: \n24.1. Common - Mesh counts between 195 and 355   \n24.2. Halftone – dot frequencies  are between 40 and 65 lpi.  \n24.3. Underbase – use a 195 mesh with a 45 to 50 lpi \nhalftone.  \n24.4. Black and Highlight – Use 305 to 355 Mesh with 50 to \n65 lpi.  \n24.5. Colors – Use 230 to 305 mesh with 50 to 55 lpi. \n25. Overprint \nTo prevent final print out to come off the printing press with \nmisregistration, the following steps can be used: \n25.1. Avoid Touching or Almost Touching Colors  \n25.2. Use Common Process Colors to Close Gaps  \n25.3. Overprint Black to Prevent Gaps  \n25.4. Use Chokes and Spreads to Fill the Gaps  \n25.5. Overprinting / Surprinting Avoids Need to Trap  \n25.6. Manual and Automatic Trapping\n\n--- PDF PAGE 61 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n57\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment must show that the candidate: \n1.1. Interpreted, prepared and developed the document or \npages incorporating elements and features that meets the \nclient's design brief  \n1.2. Demonstrated ability to apply the correct document set up, \ngraphic design style and typography in a comprehensive \nlayout in line with the specifications of the design brief. \n1.3. Created a specific print output following organized checking \nprocedures on page orientation, color, layers & separation \nof elements, resolution and format that is print ready \n2. Method of \nassessment \nThe assessor must assess the candidate through the ff: \n2.1. Demonstration with oral questioning \n2.2. Interview \n3. Resources \nrequired for \nassessment \nThe following must be provided: \n3.1. Appropriate supplies and materials  \n3.2.  Applicable equipment & software \n4. Context of \nassessment\n4.1. Assessment maybe conducted in the workplace  or in a \nsimulated environment\n",
