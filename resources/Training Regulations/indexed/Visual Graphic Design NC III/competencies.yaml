        "source_text": "--- PDF PAGE 46 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n42\nCORE COMPETENCIES \n \n \nUNIT TITLE:  \nDEVELOP DESIGNS FOR A LOGO  \nUNIT CODE:     ICT216313 \nUNIT DESCRIPTOR:  This unit covers the knowledge, skills and attitude required to \nincorporate the principles of visual design and communication into the \ndevelopment of designs for a logo for use in various industries. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n1. Receive and \ninterpret the \nlogo design \nbrief \n \n1.1. The instructions & \nspecifications   to develop \nthe logo is read & \nanalyzed based on the \ndesign brief \n1.2. The objective to produce \nthe desired outcome of \nlogo design are identified \nbased on the client and /or \nthe company directives. \n1.3. Information needed via \nresearch and other \nresources to develop logo \nconcepts is identified. \n1.4. Process and steps of \nsubmission of logo \ndesign for approval is \nconfirmed with the client \nand/or a supervisor. \n1.5. All relevant questions \nessential to develop the \nlogo design is discussed \nand liaised with relevant \npersonnel. \n1.1. Verbal \ncommunication \n1.2. Written \ncommunication \n1.3. Intellectual property \n1.4. Behavioral Science \n1.5. Elements of design \n1.6. Principles of design \n1.7. Computer knowledge \n1.8. software knowledge \n1.9. Practicing 3Rs –\nReduce, Re-use, \nRecycle/recover and \nenvironmental \npolicies. \n1.10. Trends \n1.11. Basic Math \n1.12. Economics (Pricing) \n1.1. Communication \nskills \n1.2. Interpersonal \nskills  \n1.3. Listening skills \n1.4. Critical Thinking \n1.5. Analytical and \ncomprehension \nSkills \n1.6. Reporting skills \n1.7. Presentation \nskills \n1.8. Practicing OSHS, \nEHSM, 3Rs \n2. Select \nmaterials  &  \nequipment to \ndevelop logo \ndesign \n2.1. All necessary materials \nand equipment to be used \nare selected and prepared \naccording to the task to be \nundertaken. \n2.2. Appropriate software is \nselected and checked \nbased on the final format \nspecified in the design \nbrief. \n2.3. Non-functioning and \nmissing materials and \nequipment are reported to \nappropriate personnel \n \n2.1. Verbal \ncommunication \n2.2. Written \ncommunication \n2.3. Intellectual property \n2.4. Behavioral Science \n2.5. Physics \n2.6. Computer knowledge \n2.7. software knowledge \n2.8. Practicing 3Rs –\nReduce, Re-use, \nRecycle/recover and \nenvironmental \npolicies. \n2.9. Trends \n2.10. Basic Math \n2.1. Effective \nCommunication \nskills \n2.2. Computer \noperation skills \n2.3. Reporting skills \n2.4. Analytical and \ncomprehension \nskills \n2.5. Software usage \nskills \n2.6. Practicing OSHS, \nEHSM, 3Rs\n\n--- PDF PAGE 47 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n43\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n3. Develop \nlogo design \nconcepts \n3.1. Ideas for design concept of \nthe logo are generated \nthrough research. \n3.2. Different sketches and \ndesign style \nexperimentation are \nexplored in accordance \nwith logo design \ninstructions  \n3.3. Initial design concepts \ndeveloped are toned down \nto align  with design brief \nparameters  \n3.4. Appropriate font is used or \ndesigned should this be a \npart of the logo design \nspecifications. \n3.5. Color combinations are \nexperimented to \ncompliment concept \ndesigns or to follow color \nspecifications of the design \nbrief \n3.6. Visual design and \ncommunication elements \nare incorporated to the \nconcepts in line with the \ndirection of the design \nbrief. \n3.7. Best design sketch options \nare selected based on \ndesign brief requirements.  \n3.8. Final rough designs in the \nformat required are \nprepared and submitted to \nclient and /or supervisor for \ncomments.\n3.1. Verbal \ncommunication \n3.2. Written \ncommunication \n3.3. Intellectual property \n3.4. Behavioral Science \n3.5. Human and Animal \nAnatomy \n3.6. Principles of design \n3.7. Elements of design \n3.8. Typography \n3.9. Physics \n3.10. Visual Design & \ncommunication \ntechniques \n3.11. Computer \nknowledge \n3.12. Familiarity in \ndifferent graphic \nsoftware \napplications \n3.13. internet browsing/ \nresearch \n3.14. Practicing 3Rs –\nReduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n3.15. Trends \n3.16. Geometry \n3.17. Basic Math \n3.18. Algebra \n \n \n3.1. Artistic and \ncreative skills \n3.2. Design and \ndrawing skills \n3.3. Visual \ncommunication \nskills \n3.4. Computer \napplication skills \n3.5. Computer/ \napplication \ntroubleshooting \nskills \n3.6. Critical thinking & \nanalytical skills \n3.7. Researching \nskills \n3.8. Communication \nskills \n3.9. Reporting skills \n3.10. Software usage \nskills \n3.11. Documentation & \norganizational  \nskills \n3.12. Practicing \nOSHS, EHSM, \n3RS \n4. Edit / Revise \nlogo design \n4.1. Comments received from \nclient and / or supervisor \nare analyzed to revise \ninitial logo concepts, \ndesigns and sketches. \n4.2. Adjustments are made to \nproduce  final \nspecifications as required \nby client and/ or supervisor \n4.3. Colors are enhanced & \ntechnically identified as per \nspecified design directives. \n4.4. Font selected or designed \nis  aligned and suggested \n4.1. Verbal \ncommunication \n4.2. Written \ncommunication \n4.3. Intellectual property \n4.4. Behavioral Science \n4.5. Human and Animal \nAnatomy \n4.6. Principles of design \n4.7. Elements of design \n4.8. Physics \n4.9. Computer \nknowledge \n4.10. Familiarity in \n4.1. Artistic and \ncreativ