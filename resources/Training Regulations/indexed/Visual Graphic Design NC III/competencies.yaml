l images  \n4.4. Illustrations  \n4.5. Videos\n\n--- PDF PAGE 72 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n68\nVARIABLE \nRANGE \n5. Tools  \nMay include design tools such as: \n5.1. Adobe Photoshop \n5.2. Adobe Illustrator \n5.3. Adobe Flash/Animate \n5.4. CorelDraw \n6. Appropriate \npersonnel \nMay include: \n6.1. IT personnel \n6.2. Department head \n6.3. Manager \n6.4.\nSupervisor \n7. Brand guidelines \nMay include: \n7.1. Style manual \n7.2. Style guide \n7.3. Brand identifier \n7.4.\nSet of standards\n8. constraints \nMay include: \n8.1. Budget   \n8.2. Timeline  \n8.3. Technical feasibility and  \n8.4.\nSuitability\n9. web-based locations \nMay include: \n9.1. Photo bucket \n9.2. PIXLR.com \n9.3. Cloudinary \n9.4. Google drive \n9.5.\nDropbox\n10. web safe colors \nMay include any of the 216 web safe color codes: \n(e.g 003300, 330099, CC0000)\n11. standard web fonts \nMay include the ff; \n11.1. Helvetica  \n11.2. Arial  \n11.3. Times New Roman  \n11.4. Courier  \n11.5. Verdana  \n11.6. Tahoma, etc.\n12. responsive design \nMay include adaptation of the design on the ff media: \n12.1. Mobile apps \n12.2. Web page \n12.3. Smart TV \n12.4. Smart watch\n\n--- PDF PAGE 73 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n69\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment must show that the candidate: \n1.1. Interpreted user interface requirements based on the \ndesign brief. \n1.2. Selected appropriate software, tools and delivery platform \nthat best suites the design for the user interface \n1.3. Generated and developed designs for user interface \nusing the appropriate brand guidelines within the \nconstraints of the design brief \n1.4. Finalized user interface design using accurate \ndimensions and media file size as required in the design \nbrief \n2. Method of \nassessment \nThe assessor must assess the candidate through the ff: \n2.1. Demonstration with oral questioning \n2.2. Interview \n3. Resources \nrequired for \nassessment \nThe following must be provided: \n3.1. Industry-standard hardware (e.g. PC, Mobile Phone or \nTablet) and software application  \n3.2. Design briefs \n4. Context of \nassessment \n4.1. Competency may be assessed on the job, off the job or a \ncombination of these. Off the job assessment must be \nundertaken in a closely simulated workplace environment.\n",
