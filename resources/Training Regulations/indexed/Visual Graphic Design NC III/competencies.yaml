        "source_text": "ICT216317\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\nincorporate the principles of visual design and communication\ninto the development of designs for product packaging.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Receive and\ninterpret the\nproduct\npackaging\ndesign brief\n\n1.1. Instructions & specifications to\ndevelop the product packaging\nare read & analyzed based on\nthe design brief\n1.2. Proposed packaging design is\nestablished and clarified from\nthe relevant personnel to\ninform design decisions.\n1.3. Specifications, parameters or\nconstraints are identified based\non the design brief.\n1.4. Information are sourced and\nevaluated pertinent to design\nbrief.\n1.5. Current and emerging\npackaging trends and ideas are\nconsidered pertinent to the\ndesign brief.\n1.6. Nature of the customer, the\nproduct, and how the product\nwill be displayed and be\ndistributed are examined\npertinent to the brief.\n1.7. Key sustainability issues are\nevaluated for incorporation into\ndesign.\n1.8. Ideas for technical, creative\nand budgetary implications are\nreflected appropriate to the\nrequirements.\n1.9. Regulatory requirements that\naffect packaging design are\nconsidered based on the\nrequirements of the design\nbrief.\n1.1. Verbal\ncommunication\n1.2. Written\ncommunication\n1.3. Intellectual property\n1.4. Elements of design\n1.5. Principles of design\n1.6. Form follows\nfunction\n1.7. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover and\nenvironmental\npolicies.\n1.8. Trends\n\n1.1. Computer\napplication\nskills\n1.2. Computer/\napplication\ntroubleshooting\nskills\n1.3. Critical thinking\n1.4. Analytical skills\n\n2. Develop\ndesign\nconcepts for\nspecific\nproduct\npackaging\n\n2.1. References to support the\ndesign process are identified\nappropriate to the design brief.\n2.2. Design ideas are explored\nusing isometric and\northographic methods.\n2.3. Design ideas of the package\nare generated based on form\nand function of the product.\n2.4. Packaging and color printing\n2.1. Verbal\ncommunication\n2.2. Written\ncommunication\n2.3. Intellectual property\n2.4. Elements of design\n2.5. Principles of design\n2.6. Spatial reasoning\n2.7. Behavioral Science\n2.8. Form follows\n2.1. Artistic and\ncreative skills\n2.2. Computer\napplication\nskills\n2.3. Computer/\napplication\ntroubleshooting\nskills\n2.4. Critical thinking\n\n--- PDF PAGE 75 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n71\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nmaterials to be used are\nproperly considered based\nOSHS and EHSM standard.\n2.5. Designs developed are\norganized and submitted in the\nformat required to the client\nand/or supervisor.\n\nfunction\n2.9. Computer\nknowledge\n2.10. Familiarity in\ndifferent graphic\napplications\n2.11. Printing\nKnowledge\n2.12. Product packaging\nmaterials\n2.13. Crafting\n2.14. Geometry\n2.15. Economics\n(Pricing)\n2.16. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n2.17. Trends\n2.5. Analytical skills\n\n3. Create\nspecific\nproduct\npackaging\nmockup\n\n3.1. Selected design from initial\nideas is developed based on\nproduction and design factors.\n3.2. Selected design is created into\na mockup using specified\nmeasurements and temporary\npackage materials based on\nthe product.\n3.3. Package design functionality is\ntested with collaboration and\nrefinement from relevant\npersonnel.\n3.4. Final mockup selected and\napproved by client and/or\nsupervisor is submitted for\napproval.\n\n3.1. Verbal\ncommunication\n3.2. Written\ncommunication\n3.3. Intellectual property\n3.4. Behavioral Science\n3.5. Spatial Reasoning\n3.6. Elements of design\n3.7. Principles of design\n3.8. Form follows\nfunction\n3.9. Basic\ndrafting/Technical\ndrawing\n3.10. Computer\nknowledge\n3.11. Familiarity in\ndifferent graphic\napplications\n3.12. Printing\nKnowledge\n3.13. Geometry\n3.14. Algebra\n3.15. Trigonometry\n3.16. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n3.17. Trends\n3.1. Artistic and\ncreative skills\n3.2. Computer\napplication\nskills\n3.3. Computer/\napplication\ntroubleshooting\nskills\n3.4. Critical thinking\n3.5. Analytical skills\n\n--- PDF PAGE 76 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n72\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Finalize\ndesign for\nspecific\nproduct\npackaging\n4.1. Modifications and amendments\nare applied to the final product\npackage design.\n4.2. Accurate measurements and\ndie line are developed to\nsupport product packaging\ndesign\n4.3. Final design, mockup, die line\ntemplate and documentation\nare presented for approval to\nrelevant personnel.\n\n4.1. Verbal\ncommunication\n4.2. Written\ncommunication\n4.3. Intellectual property\n4.4. Behavioral Science\n4.5. Spatial Reasoning\n4.6. Elements of design\n4.7. Principles of design\n4.8. Form follows\nfunction\n4.9. Computer\nknowledge\n4.10. Familiarity in\ndifferent graphic\napplications\n4.11. Printing Knowledge\n4.12. Geometry\n4.13. Algebra\n4.14. Trigonometry\n4.15. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n4.16. Trends\n4.1. Artistic and\ncreative skills\n4.2. Computer\napplication\nskills computer/\napplication\ntroubleshooting\nskills\n4.3. Critical thinking\n4.4. Analytical skills\n\n--- PDF PAGE 77 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n73\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Design brief\nMay include the following :\n1.1. Project Statement\n1.2. Project Objectives\n1.3. Variables\n1.4. Statistical Interpretation\n1.5. Conclusions and Recommendations\n1.6.\nBibliography / References\n2. Relevant\npersonnel\n\nMay include the following:\n2.1. creative/art director\n2.2. technical director\n2.3. designers\n2.4. developers/programmers\n2.5. copywriters/editors\n2.6. heads of department\n2.7. client\n2.8. buyers/customers\n2.9. printers\n2.10. other specialist creative and technical staff\n3. Temporary\npackage materials\nMay include:\n3.1. Paper\n3.2. Plastic\n3.3. Cardboard\n3.4. Cloth/Canvas\n4. Die line\nDie line may include:\n4.1. Cuts\n4.2. Folds\n4.3. Holes\n4.4. Final layout\n4.5. Measurements\nScore\n5. Documentation\nMay include:\n5.1. Orthographic drawings\n5.2. Dimensions\n5.3. Color specifications\n5.4. Final package materials\n5.5. Die line package template\n\n--- PDF PAGE 78 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n74\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment must show that the candidate:\n1.1. Interpreted product-packaging requirements based on the\ndesign brief.\n1.2. Generated and developed designs of packaging based on\nthe specifications of the product indicated in the design\nbrief\n1.3. Created mockup for the selected product package design\nusing appropriate temporary materials\n1.4. Finalized the design, mockup, die line template of the\nproduct package design.\n2. Method of\nassessment\nThe assessor must assess the candidate through the ff:\n2.1. Demonstration with oral questioning\n2.2. interview\n3. Resources\nrequired for\nassessment\nThe following must be provided:\n3.1. Work area\n3.2. Industry standard hardware and software application\n3.3. Design briefs\n3.4. Materials for 