al aspects \nof competency \nAssessment must show that the candidate: \n1.1. Interpreted product-packaging requirements based on the \ndesign brief. \n1.2. Generated and developed designs of packaging based on \nthe specifications of the product indicated in the design \nbrief \n1.3. Created mockup for the selected product package design \nusing appropriate temporary materials \n1.4. Finalized the design, mockup, die line template of the \nproduct package design.\n2. Method of \nassessment \nThe assessor must assess the candidate through the ff: \n2.1. Demonstration with oral questioning \n2.2. interview\n3. Resources \nrequired for \nassessment \nThe following must be provided: \n3.1. Work area \n3.2. Industry standard hardware and software application  \n3.3. Design briefs \n3.4. Materials for prototyping  \n4. Context of \nassessment \n4.1. Competency may be assessed on the job, off the job or a \ncombination of these. Off the job assessment must be \nundertaken in a closely simulated workplace environment.\n",
