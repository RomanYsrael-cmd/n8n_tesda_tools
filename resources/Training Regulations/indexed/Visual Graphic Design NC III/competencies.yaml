        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including new,\nunusual and improbable situations that may have happened.\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs\nwill be required as well as bank of questions which will be\nused to probe the reason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 20 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n16\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\nUNIT CODE\n:"
        },
        "source_text": "500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nproblem\n1.1. Variances are identified\nfrom normal operating\nparameters; and\nproduct quality\n1.2. Extent, cause and\nnature of the problem\nare defined through\nobservation,\ninvestigation and\nanalytical techniques\n1.3. Problems are clearly\nstated and specified\n\n1.1. Competence includes a\nthorough knowledge and\nunderstanding of the\nprocess, normal operating\nparameters, and product\nquality to recognize non-\nstandard situations\n1.2. Competence to include the\nability to apply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the corrective\naction and provision of\nrecommendations\n1.3. Relevant equipment and\noperational processes\n1.4. Enterprise goals, targets\nand measures\n1.5. Enterprise quality, OHS\nand environmental\nrequirement\n1.6. Enterprise information\nsystems and data collation\n1.7. Industry codes and\nstandards\n1.8. Normal operating\nparameters and product\nquality\n1.1 Using range of\nformal\nproblem\nsolving\ntechniques\n1.2 Identifying and\nclarifying the\nnature of the\nproblem\n1.3 Evaluating the\neffectiveness\nof a present\nprocess in the\nworkplace\n1.4 Applying\nanalytical\ntechniques\n\n2. Determine\nfundamental\ncauses of the\nproblem\n2.1 Possible causes are\nidentified based on\nexperience and the use\nof problem solving tools/\nanalytical techniques.\n2.2 Possible cause\nstatements are\ndeveloped based on\nfindings\n2.3 Fundamental causes\nare identified per results\nof investigation\nconducted\n\n2.1 Relevant equipment and\noperational processes\n2.2 Enterprise goals, targets\nand measures\n2.3 Enterprise quality, OHS\nand environmental\nrequirements\n2.4 Enterprise information\nsystems and data collation\n2.5 Industry codes and\nstandards\n2.1 Analysis of\nroot causes\n\n--- PDF PAGE 17 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Determine\ncorrective\naction\n3.1 All possible options are\nconsidered for\nresolution of the\nproblem\n3.2 Strengths and\nweaknesses of possible\noptions are considered\n3.3 Corrective actions are\ndetermined to resolve\nthe problem and\npossible future causes\n3.4 Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and\noperating procedures\n\n3.1 Understanding the\nprocedure in undertaking\ncorrective action\n3.2 Principles of decision\nmaking strategies and\ntechniques\n3.3 Enterprise information\nsystems and data collation\n3.4 Action planning\n3.1 Identifying and\nclarifying the\nnature of the\nproblem\n3.2 Devising the\nbest solution\n3.3 Evaluating the\nsolution\n3.4 Implementing\ndeveloped plan\nto rectify the\nproblem\n3.5 Implementing\ncorrective and\npreventive\nactions based\non root cause\nanalysis\n4. Provide\nrecommenda-\ntion/s to\nmanager\n4.1 Report on\nrecommendations are\nprepared according to\nprocedures.\n4.2 Recommendations are\npresented to appropriate\npersonnel.\n4.3 Recommendations are\nfollowed-up, if required\n4.1 Competence includes a\nthorough knowledge and\nunderstanding of the\nprocess, normal operating\nparameters, and product\nquality to recognize non-\nstandard situation\n4.2 How to make a report and\nrecommendation\n\n4.1 Using range of\nformal problem\nsolving\ntechniques\n4.2 Identifying and\nclarifying the\nnature of the\nproblem\n4.3 Devising the\nbest solution\n4.4 Evaluating the\nsolution\n4.5 Implementation\nof a developed\nplan to rectify\nthe problem\n4.6 Writing report\nand\nrecommenda-\ntions\n\n--- PDF PAGE 18 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n14\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical\ntechniques\n1.1. Brainstorming\n1.2. Intuitions/Logic\n1.3. Cause and effect diagrams\n1.4. Pareto analysis\n1.5. SWOT analysis\n1.6. Gant chart, Pert CPM and graphs\n1.7. Scattergrams\n2. Problem\n\n2.1. Non – routine process and quality problems\n2.2. Equipment selection, availability and failure\n2.3. Teamwork and work allocation problem\n2.4. Safety and emergency situations and incidents\n\n3. Action plans\n\n3.1. Priority requirements\n3.2. Measurable objectives\n3.3. Resource requirements\n3.4. Timelines\n3.5. Co-ordination and feedback requirements\n3.6. Safety requirements\n3.7. Risk assessment\n3.8. Environmental requirements\n\n--- PDF PAGE 19 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n15\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including new,\nunusual and improbable situations that may have happened.\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs\nwill be required as well as bank of questions which will be\nused to probe the reason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 20 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n16\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\nUNIT CODE\n:"
