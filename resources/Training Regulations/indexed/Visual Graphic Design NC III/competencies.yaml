ing skills\n3.10. Software usage\nskills\n3.11. Documentation &\norganizational\nskills\n3.12. Practicing\nOSHS, EHSM,\n3RS\n4. Edit / Revise\nlogo design\n4.1. Comments received from\nclient and / or supervisor\nare analyzed to revise\ninitial logo concepts,\ndesigns and sketches.\n4.2. Adjustments are made to\nproduce final\nspecifications as required\nby client and/ or supervisor\n4.3. Colors are enhanced &\ntechnically identified as per\nspecified design directives.\n4.4. Font selected or designed\nis aligned and suggested\n4.1. Verbal\ncommunication\n4.2. Written\ncommunication\n4.3. Intellectual property\n4.4. Behavioral Science\n4.5. Human and Animal\nAnatomy\n4.6. Principles of design\n4.7. Elements of design\n4.8. Physics\n4.9. Computer\nknowledge\n4.10. Familiarity in\n4.1. Artistic and\ncreative skills\n4.2. Design and\ndrawing skills\n4.3. Visual\ncommunication\nskills\n4.4. Computer\napplication skills\n4.5. Computer/\napplication\ntroubleshooting\nskills\n4.6. Critical thinking &\n\n--- PDF PAGE 48 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n44\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nin places to fit the overall\nlook of the logo design\n4.5. Revised draft logo design\nin the format required is\nprepared and submitted to\nclient and/or supervisor for\nfinal comments\n\ndifferent graphic\nsoftware\napplications\n4.11. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n4.12. Trends\n4.13. Geometry\n4.14. Basic Math\n4.15. Algebra\nanalytical skills\n4.7. Researching skills\n4.8. Communication\nskills\n4.9. Reporting skills\n4.10. Software usage\nskills\n4.11. Documentation\n& Organizational\nskills\n4.12. Practicing\nOSHS, EHSM,\n3Rs\n5. Finalize logo\ndesign\n5.1. Client and/ or supervisor\nfinal feedback are collected