  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in VISUAL GRAPHIC DESIGN NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311109\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1. Appropriate\ncommunication method\nis selected\n1.2. Multiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3. Questions are used to\ngain extra information\n1.4. Correct sources of\ninformation are identified\n1.5. Information is selected\nand organized correctly\n1.6. Verbal and written\nreporting is undertaken\nwhen required\n1.7. Communication skills are\nmaintained in all situations\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Methods of\nCommunication\n1.4. Types of\nQuestion\n1.5. Communication\nTools\n1.6. Questioning\nTechniques\n1.1. Organizing\ninformation\n1.2. Understanding and\nconveying\nintended meaning\n1.3. Participating in\nvariety of\nworkplace\ndiscussions\n1.4. Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n1.5. Reporting\noccupational\nhazards during\nsafety meeting\n2. Lead\nworkplace\ndiscussions\n2.1. Response to workplace\nissues are sought\n2.2. Response to workplace\nissues are provided\nimmediately\n2.3. Constructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4. Goals/objectives and\naction plan undertaken in\nthe workplace are\ncommunicated\n2.1. Leading as a\nmanagement\nfunction\n2.2. Barriers of\ncommunication\n2.3. Effective verbal\ncommunication\nmethods\n2.4. Method/technique\ns of discussion\n2.5. How to lead\ndiscussion\n2.6. How to solicit\nresponse\n2.7. Goal setting and\naction planning\n2.1. Communicating\neffectively\n2.2. Consulting the\ncrew on the\nprepared menu for\nthe month\n\n--- PDF PAGE 7 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n3.1 Types of issues\nand problems in\nthe workplace\n3.2 Written and\nelectronic\ncommunication\nmethods\n3.3 Communication\nbarriers affecting\nworkplace\ndiscussions\n3.1 Identifying cause\nof problems\n3.2 Identifying\nproblems and\nissues\n3.3 Organizing\ninformation on\nproblems and\nissues\n3.4 Relating problems\nand issues in the\nworkplace\n\n--- PDF PAGE 8 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8.\nInternet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Dealt with a range of communication/ information\nat one time\n1.2. Made constructive contributions in workplace\nissues\n1.3. Sought workplace issues effectively\n1.4. Responded to workplace issues promptly\n1.5. Presented information clearly and effectively\nwritten form\n1.6. Used appropriate sources of information\n1.7. Asked appropriate questions\n1.8. Provided accurate information\n2. Resource Implications\nThe following resources should be provided:\n2.1. Variety of Information\n2.2. Communication tools\n2.3. Simulated workplace\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Competency in this unit must be assessed\nthrough\n3.2 Direct Observation\n3.3 Interview\n4. Context for\nAssessment\n1.1. Competency may be assessed in the workplace\nor in simulated workplace environment\n\n--- PDF PAGE 9 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n5\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS (Guide and Lead Others/Be\nResponsible to Others)\nUNIT CODE\n\n:\n500311110\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining team\nand individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements are\nidentified and presented\nto team members\n1.2 Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3 Team members’ queries\nand concerns are\nrecognized, discussed\nand dealt with\n\n1.1. Company policies and\nprocedures\n1.2. How performance\nexpectations are set\n1.3. Methods of Monitoring\nPerformance\n1.4. Client expectations\n1.5. Team member’s duties\nand responsibilities\n1.6. Definition of Team\n1.7. Skills and techniques in\npromoting team building\n1.8. Up-to-date dissemination\nof instructions and\nrequirements to members\n1.9. Art of listening and\ntreating individual team\nmembers concern\n1.1. Communication\nskills required for\nleading teams\n1.2. Team building\nskills\n1.3. Negotiating skills\n1.4. Evaluation skills\n2. Assign\nresponsibilities\n2.1. Duties and\nresponsibilities are\nallocated having regard\nto the skills, knowledge\nand aptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2. Duties are allocated\nhaving regard to\nindividual preference,\ndomestic and personal\nconsiderations, whenever\npossible\n2.1. Concept of delegation\n2.2. How to delegate\n2.3. Understanding individual\ndifferences\n2.4. Methods of monitoring\nperformance\n2.5. Duties and responsibilities\nof each team member\n2.6. Knowledge in identifying\neach team member duties\nand responsibilities\n2.1. Delegating skills\n2.2. Identifying\nindividual skills,\nknowledge and\nattitude as basis\nfor allocating\nresponsibilities\n2.3. Identifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1 Performance\nexpectations are\nestablished based on\nclient needs and\naccording to assignment\nrequirements\n3.2 Performance\nexpectations are based\non individual team\nmember’s duties and\narea of responsibility\n3.1. Definition of performance\nindicators/ criteria\n3.2. Definition of team goals\nand expectations\n3.3. Methods of monitoring\nperformance\n3.4. Client expectations\n3.5. Team member’s duties\nand responsibilities\n3.6. Defining performance\nexpectations criteria\n3.1. Identifying\nperformance\nindicators\n3.2. Evaluating\nperformance\n3.3. Setting individual\nperformance\ntarget/\nexpectation\nindicators\n\n--- PDF PAGE 10 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team\nmembers\n4. Supervise team\nperformance\n4.1. Monitoring of\nperformance takes place\nagainst defined\nperformance criteria\nand/or assignment\ninstructions and\ncorrective action taken if\nrequired\n4.2. Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies\n4.3. Performance issues\nwhich cannot be rectified\nor addressed within the\nteam are referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4. Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs\nand satisfaction\n4.5. Team operations are\nmonitored to ensure that\nemployer/client needs\nand requirements are met\n4.6. Follow-up communication\nis provided on all issues\naffecting the team\n4.7. All relevant\ndocumentation is\ncompleted in accordance\nwith company procedures\n\n4.1. Understanding\nmonitoring of work\n4.2. How to undertake\ncorrective action\n4.3. Understanding feedback\nand procedure\n4.4. Feedback reporting\nprocedure\n4.5. Methods of monitoring\nperformance\n4.6. Team member’s duties\nand responsibilities\n4.7. Monitoring team\noperation to ensure client\nneeds and satisfaction\n4.1. Monitoring skills\n4.2. Setting priorities\n4.3. Evaluating\nperformance\n4.4. Informal/ formal\ncounseling skills\n\n--- PDF PAGE 11 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\n2.1 Roster/shift details\n3. Monitor performance\n3.1 Formal process\n3.2 Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1 Work output\n5.2 Work quality\n5.3 Team participation\n5.4 Compliance with workplace protocols\n5.5 Safety\n5.6 Customer service\n\n--- PDF PAGE 12 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n8\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n9\nUNIT OF COMPETENCY : DEVELOP AND PRACTICE NEGOTIATION SKILLS\nUNIT CODE\n:\n500311111\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nnegotiations\n1.1 Information on preparing\nfor negotiation is\nidentified and included in\nthe plan\n1.2 Information on creating\nnon-verbal\nenvironments for\npositive negotiating is\nidentified and included in\nthe plan\n1.3 Information on active\nlistening is identified\nand included in the plan\n1.4 Information on different\nquestioning techniques\nis identified and included\nin the plan\n1.5 Information is checked to\nensure it is correct and\nup-to- date\n1.1 Knowledge on Codes\nof practice and\nguidelines for the\norganization\n1.2 Knowledge of\norganizations policy\nand procedures for\nnegotiations\n1.3 Decision making and\nconflict resolution\nstrategies\nprocedures\n1.4 Concept of\nnegotiation\n\n1.1 Communication\nskills (verbal and\nlistening)\n1.2 Active listening\n1.3 Setting conflict\n1.4 Preparing conflict\nresolution\n1.5 Problem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n1.6 Interpersonal\nskills to develop\nrapport with other\nparties\n\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed\nupon by all parties\n2.2 Desired outcome of all\nparties are considered\n2.3 Appropriate language is\nused throughout the\nnegotiation\n2.4 A variety of questioning\ntechniques are used\n2.5 The issues and\nprocesses are\ndocumented and agreed\nupon by all parties\n2.6 Possible solutions are\ndiscussed and their\nviability assessed\n2.7 Areas for agreement are\nconfirmed and recorded\n2.8 Follow-up action is\nagreed upon by all\nparties\n2.1 Outcome of\nnegotiation\n2.2 Knowledge on\nLanguage\n2.3 Different Questioning\ntechniques\n2.4 Problem solving\nstrategies on how to\ndeal with unexpected\nquestions and\nattitudes during\nnegotiation\n2.5 Flexibility\n2.6 Empathy\n2.7 Decision making and\nconflict resolution\nstrategies\nprocedures\n2.8 Problem solving\nstrategies on how to\ndeal with unexpected\nquestions and\nattitudes during\nnegotiation\n\n2.1 Negotiating skill\n2.2 Communication\nskills (verbal and\nlistening)\n2.3 Observation skills\n2.4 Interpersonal\nskills to develop\nrapport with other\nparties\n2.5 Applying effective\nquestioning\ntechniques\n2.6 Setting conflict\n\n--- PDF PAGE 14 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n\n10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1. Background information on other parties to the negotiation\n1.2. Good understanding of topic to be negotiated\n1.3. Clear understanding of desired outcome/s\n1.4. Personal attributes\n1.4.1. self awareness\n1.4.2. self esteem\n1.4.3. objectivity\n1.4.4. empathy\n1.4.5. respect for others\n1.5. Interpersonal skills\n1.5.1. listening/reflecting\n1.5.2. non- verbal communication\n1.5.3. assertiveness\n1.5.4. behavior labeling\n1.5.5. testing understanding\n1.5.6. seeking information\n1.5.7. self-disclosing\n1.6. Analytic skills\n1.6.1. observing differences between content and process\n1.6.2. identifying bargaining information\n1.6.3. applying strategies to manage process\n1.6.4. applying steps in negotiating process\n1.6.5. strategies to manage conflict\n1.6.6. steps in negotiating process\n1.6.7. options within organization and externally for\nresolving conflict\n2. Non- verbal\nenvironments\n2.1. Friendly reception\n2.2. Warm and welcoming room\n2.3. Refreshments offered\n2.4. Lead in conversation before negotiation begins\n3. Active list