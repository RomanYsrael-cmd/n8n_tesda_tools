        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1. Interpreted, prepared and developed the document or\npages incorporating elements and features that meets the\nclient's design brief\n1.2. Demonstrated ability to apply the correct document set up,\ngraphic design style and typography in a comprehensive\nlayout in line with the specifications of the design brief.\n1.3. Created a specific print output following organized checking\nprocedures on page orientation, color, layers & separation\nof elements, resolution and format that is print ready\n2. Method of\nassessment\nThe assessor must assess the candidate through the ff:\n2.1. Demonstration with oral questioning\n2.2. Interview\n3. Resources\nrequired for\nassessment\nThe following must be provided:\n3.1. Appropriate supplies and materials\n3.2. Applicable equipment & software\n4. Context of\nassessment\n4.1. Assessment maybe conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 62 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n58\nUNIT TITLE:\n\n DEVELOP DESIGNS FOR USER EXPERIENCE\nUNIT CODE:"
        },
        "source_text": "ICT216314\nUNIT DESCRIPTOR: This unit describes the skills and knowledge required to\nconceptualize and design for posters, tarpaulin, magazine,\nbrochures, invitation and other kinds of design intended for\nprinted material output or format for personal, industrial and\ncommercial use.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret and\nanalyze the\nprint media\ndesign brief\n1.1. The instructions &\nspecifications to develop the\ndesign for the specific print\nmedia requirement is\nanalyzed based on the design\nbrief\n1.2. The scope of work and\ndeadline schedules of the\nproposed design is clarified in\ndetail from the relevant\npersonnel\n1.3. Information needed via\nresearch and other resources\nto develop required designs\nfor print is identified.\n1.4. Approval stages of submitted\ndesign concepts is confirmed\nwith the client and/or a\nsupervisor.\n1.5. Print format of the approved\ndesign is identified with all its\nspecifications based on the\ndesign brief.\n1.6. All questions essential to\ndevelop the design for print is\ndiscussed and liaised with\nrelevant personnel.\n1.1. Verbal\ncommunication\n1.2. Written\ncommunication\n1.3. Intellectual property\n1.4. Behavioral Science\n1.5. Elements of design\n1.6. Principles of design\n1.7. Computer\nknowledge\n1.8. software knowledge\n1.9. Materials\nspecifications\n1.10. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n1.11. Trends\n1.12. Basic Math\n1.13. Economics\n(Pricing)\n\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Listening skills\n1.4. Critical Thinking\n1.5. Analytical and\ncomprehension\nskills\n1.6. Reporting skills\n1.7. Presentation\nskills\n1.8. Practicing\nOSHS, EHSM,\n3Rs\n\n2. Prepare\nequipment &\nmaterials for\nprint media\ndesign\n2.1. All necessary materials and\nequipment to be used are\nprepared according to the\nspecifications of the design\nbrief\n2.2. Appropriate software is\nselected and checked based\non the format specified for the\nfinal print media output.\n2.3. Monitor is calibrated to show\nthe correct color grading of\ndesigns\n2.4. Color scheme or print\npalettes are organized and\narranged to suit requirements\n2.1. Verbal\ncommunication\n2.2. Written\ncommunication\n2.3. Intellectual\nproperty\n2.4. Behavioral Science\n2.5. Elements of design\n2.6. Principles of design\n2.7. Computer\nknowledge\n2.8. software\nknowledge\n2.9. Practicing 3Rs –\nReduce, Re-use,\n2.1. Artistic &\nCreative skills\n2.2. Communication\nskills\n2.3. Computer\noperation skills\n2.4. Reporting skills\n2.5. Analytical and\ncomprehension\nskills\n2.6. Software usage\nskills\n2.7. Practicing\nOSHS, EHSM,\n3Rs\n\n--- PDF PAGE 53 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n49\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nof final design output.\n2.5. Page size, orientation,\nappropriate resolution are\nselected based on the design\nbrief specifications\n2.6. Non-functioning and missing\nmaterials and equipment are\nreported to appropriate\npersonnel\nRecycle/recover\nand environmental\npolicies.\n2.10. Trends\n2.11. Basic Math\n3. Develop\ndesigns for the\nspecific print\nmedia output\n\n3.1. Ideas for design concepts of\nthe specified print output are\ngenerated through research\nand sketches experimentation.\n3.2. Appropriate Document / page\nset up is applied based on\nthe design brief requirements\n3.3. Different print or graphic\ndesign style options are\nexplored and sketched basing\non the design parameters.\n3.4. Required text copy, words,\ntagline or message for print is\nprepared and analyzed for\nappropriate layout placement.\n3.5. Font style, color and size are\ncarefully selected and placed\nin a proper layout to fit overall\ndesign output\n3.6. All Elements created are\norganized on different\ncomprehensive layout/\ncompre to experiment on the\nbest arrangements for design\npresentation.\n3.7. Graphic images, product\nshots, photographs and other\nelements can be imported\nfrom other applications and\nadded to the comprehensive\nlayout.\n3.8. Color combinations are\nexperimented to compliment\nconcept designs\n3.9. Final rough comprehensive\nlayout designs in the format\nrequired are prepared and\nsubmitted to client and /or\nsupervisor for comments and\nrevisions.\n3.1. Verbal\ncommunication\n3.2. Written\ncommunication\n3.3. Intellectual\nproperty\n3.4. Behavioral Science\n3.5. Human and Animal\nAnatomy\n3.6. Principles of design\n3.7. Elements of design\n3.8. Graphic design\nstyles\n3.9. Philosophy\n3.10. Computer\nknowledge\n3.11. Familiarity in\ndifferent graphic\napplications\n3.12. Printing\nKnowledge\n3.13. internet browsing/\nresearch\n3.14. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n3.15. Trends\n3.16. Basic Math\n3.17. Geometry\n3.1. Artistic and\ncreative skills\n3.2. Communication\nskills\n3.3. Computer\noperation skills\n3.4. Reporting skills\n3.5. Analytical and\ncomprehension\nskills\n3.6. Software usage\nskills\n3.7. Holistic design\nskills\n3.8. Organizational\nskills\n3.9. Practicing\nOSHS, EHSM,\n3Rs\n\n--- PDF PAGE 54 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n50\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Finalize print\nmedia design\nlayout\n\n4.1. Comments and feedback from\nclient and/ or supervisor are\nanalyzed to revise the\nelements of the proposed\ncomprehensive layouts\n4.2. Combined elements in the\ncomprehensive layout/\ncompre are imposed correctly\nto suit specified sheet size.\n4.3. Numerical sequence and lay\ndown of the product or mock-\nup is correctly identified to\nmeet binding and finishing\nrequirements.\n4.4. Bleed allowance is\nincorporated in margins and\nborders.\n4.5. Text copy is reviewed for\npossible errors and omissions\nand are discussed with client\nand/ or supervisor.\n4.6. Alignment of the basic\nelements are maintained\nbased on the overall balance\nof the layout and correct color\nblends and gradients.\n4.7. Hard copy / progressive proof\nis printed and rechecked for\nerrors, omissions to fit the\noverall balance of the layout.\n4.8. Necessary changes are made,\nreviewed and proof read as\nrequired while comprehensive\nlayout/ compre is still on\nscreen.\n4.9. The project and/or work is\nsaved according to\norganizational procedures.\n4.10. A digital proof or file format\nis created to present to client\nand/ or Supervisor for final\ncomments and approval.\n\n4.1. Verbal\ncommunication\n4.2. Written\ncommunication\n4.3. Intellectual\nproperty\n4.4. Principles of design\n4.5. Elements of design\n4.6. Philosophy\n4.7. Computer\nknowledge\n4.8. Familiarity in\ndifferent graphic\napplications\n4.9. Printing\nKnowledge\n4.10. Internet browsing/\nresearch\n4.11. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n4.12. Trends\n4.13. Basic Math\n4.14. Geometry\n\n4.1. Artistic and\ncreative skills\n4.2. Communication\nskills\n4.3. Computer\noperation skills\n4.4. Reporting skills\n4.5. Analytical and\ncomprehension\nskills\n4.6. Software usage\nskills\n4.7. Holistic design\nskills\n4.8. Organizational\nskills\n4.9. Practicing\nOSHS, EHSM,\n3Rs\n\n5. Prepare final\nprint output &\ndocumentation\n\n5.1. Approved final layout design\nand /or project is prepared for\nprinting.\n5.2. Correct Color profile are\nselected carefully for standard\nprint output option\n5.3. File formats are chosen to\nbest represent artwork styles.\n5.1. Verbal\ncommunication\n5.2. Written\ncommunication\n5.3. Intellectual\nproperty\n5.4. Physics\n5.5. Elements of\n5.1. Artistic and\ncreative skills\n5.2. Communication\nskills\n5.3. Computer\noperation skills\n5.4. Reporting skills\n5.5. Analytical and\n\n--- PDF PAGE 55 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n51\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5.4. Compression options are\nselected that keep the image\nquality high and the file size\nlow.\n5.5. Export options of file are set\nand saved to the best settings\nfor the final print output.\n5.6. The appropriate format for\nsaving the images/ artworks/\nobjects and layout are used as\nrequired in the specifications\nof the design brief.\n5.7. The resolution for effects and\nany filters are set based on\nimage quality.\n5.8. Document / page set up is\nchecked to ensure correct\nlayout file has no non-\nprintable elements.\n5.9. Final high-resolution file is\nchecked for final approval of\nclient and/or supervisor before\nsending to print.\nDesign\n5.6. Principles of\ndesign\n5.7. Typography\n5.8. Computer\nknowledge\n5.9. Familiarity in\ndifferent graphic\napplications\n5.10. Printing\nKnowledge\n5.11. internet browsing/\nresearch\n5.12. Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n5.13. Trends\n5.14. Basic Math\n5.15. Algebra\n\ncomprehension\nskills\n5.6. Printing skills\n5.7. Software usage\nskills\n5.8. Holistic design\nskills\n5.9. Organizational\nskills\n5.10. Practicing\nOSHS, EHSM,\n3Rs\n6. Color separate\nartwork file for\nfinal printing\n\n6.1. The final and approved print\nmedia artwork file is prepared\nfor final printing\n6.2. The correct format for the\ncolor separation is\ndetermined and checked\nbased on the final\nspecifications on the design\nbrief.\n6.3. Command preferences are\ncorrectly set for print