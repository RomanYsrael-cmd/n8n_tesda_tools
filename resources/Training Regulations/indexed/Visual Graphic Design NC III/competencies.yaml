          "source_text": "VARIABLE \nRANGE \n1. Print media  \nMay include the following : \n1.1. Print ads \n1.2. Poster \n1.3. Banners \n1.4. Billboards  \n1.5. Brochures  \n1.6. Invitation  \n1.7. Annual reports \n1.8. Flyers / pamphlets \n1.9. Menu  \n1.10. Book / book covers \n1.11. Comics  \n1.12. Magazines  \n1.13. Callcards  etc. \n2. design brief  \nMay include the following  : \n2.1. Project Statement \n2.2. Project Objectives \n2.3. Variables \n2.4. Statistical Interpretation \n2.5. Conclusions and Recommendations \n2.6. Bibliography / References\n3. Relevant \npersonnel  \nMay include : \n3.1. Art / creative director \n3.2. Supervisor \n3.3. Department Head \n3.4. Production Manager \n3.5. Client\n4. Resources  \nMay include : \n4.1. Books / magazines \n4.2. Internet   \n4.3. DVDs / Videos \n4.4. Photographs \n4.5. Graphic Images\n5. Approval stages  \nMay include the following stages : \n5.1. Draft sketches or design stage \n5.2. Comprehensive layout stage \n5.3. Final layout stage \n5.4. Color separation stage \n6. Print format  \nMay include the following format: \n6.1. psd  \n6.2. png \n6.3. tiff \n6.4. jpeg\n\n--- PDF PAGE 58 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n54\nVARIABLE \nRANGE \n7. Materials  \nMay include the following : \n7.1. Paper / sketchpad / tracing paper \n7.2. Lead & colored pencils \n7.3. Colored pens / sign pen \n7.4. Markers color palettes \n7.5. Paper grade palette \n7.6. USB / flash drive \n7.7. Watercolor / poster color \n7.8. Ruler  \n7.9. Scissors  \n7.10. Glue / tape \n7.11. Post it \n7.12. Design books / magazines \n8. Equipment  \nMay include the following : \n8.1. Drawing table \n8.2. Computer with peripherals  \n8.3. Chair internet  \n8.4. Removable hard drive \n8.5. Drawing tablet \n8.6. Mobile phone \n8.7. Camera  \n8.8. Laptop  \n9. Software  \nMay include the following  : \n9.1. Photoshop \n9.2. CorelDraw  \n9.3. InDesign \n9.4. Illustrator \n9.5. Acrobat  \n9.6. Sketch up \n10. Color scheme  \nMay include the following color scheme tools : \n10.1. Color wheel \n10.2. Adobe Kuler \n10.3. Color Munki \n10.4. Colorotate \n10.5. Color Calculator \n10.6. Copaso : Color Palette software \n10.7. Mudcube Color sphere \n11. Print palette \nMay include the following print palette color combinations : \n11.1. Cool Color scheme palette \n11.2. Warm color scheme palette \n11.3. Sweet color scheme palette \n11.4. Exotic color scheme palette\n\n--- PDF PAGE 59 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n55\nVARIABLE \nRANGE \n12. Appropriate \npersonnel  \nMay include : \n12.1. Production Manager \n12.2. IT/ software/ network person \n12.3. Art / Creative Director \n12.4. Supervisor \n12.5. Department Head \n12.6. Client \n13. Document / \npage set up \nMay include: \n13.1. Margins \n13.2. Page size \n13.3. Page orientation \n13.4. Number of pages \n13.5. Multiple columns \n13.6. Arrangement of pages \n13.7. Pictures/graphics size\n14. Graphic design \nstyle  \nMay include the following  : \n14.1. Art Nouveau \n14.2. Art Deco \n14.3. American Kitsch \n14.4. Contemporary \n14.5. Grunge \n14.6. psychedelic \n14.7. Victorian \n15. Elements  \nMay include: \n15.1. Graphics \n15.2. Frames \n15.3. Fonts & Texts \n15.4. Photographs \n15.5. Menus or dialogue boxes \n15.6. indexes \n15.7. Logos \n15.8. Information & details\n16. Comprehensive \nlayout / compre \nA draft layout/ design used to present to a client/ supervisor \nwhich contains either of the following elements : \n16.1. Sketches  \n16.2. Photographs  \n16.3. Graphic images \n16.4. Font / text / messages \n16.5. Logos  \n16.6. Clip art   \n17. Imposed  \nMay include the following: \n17.1. Plug-ins \n17.2. Stand alone applications or automated features of high-\nend page layout programs exist to impose pages\n\n--- PDF PAGE 60 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                             Amended February 27, 2018 \n56\nVARIABLE \nRANGE \n18. Organizational \nprocedures \n \nMay include the following: \n18.1. Organizational procedures for saving a document can \ninclude the preferred format, naming preferences and the \nlocation of file is saved to.\n19. File format \nMay include: \n19.1. PDF \n19.2. jpeg \n19.3. tiff\n20. Correct Color \nprofile \nMay include the following: \n20.1. CMYK color \n20.2. Spot colors \n20.3. Registration colors \n20.4. Pantone color\n21. Compression \noptions \nMay include : \n21.1. Lossless  \n21.2. Lossy\n22. Command \npreferences \nMay include: \n22.1. RGB \n22.2. CMYK \n22.3. Color management \n22.4. Proof options \n22.5. Document Information subjects\n23. Color separation \noptions \nMay include the following: \n23.1. Process color \n23.2. Spot color \n23.3. Halftone  \n23.4. Resolution  \n23.5. Bleed  \n23.6. printer marks\n24. Screen \nFrequency \nmay include the following: \n24.1. Common - Mesh counts between 195 and 355   \n24.2. Halftone – dot frequencies  are between 40 and 65 lpi.  \n24.3. Underbase – use a 195 mesh with a 45 to 50 lpi \nhalftone.  \n24.4. Black and Highlight – Use 305 to 355 Mesh with 50 to \n65 lpi.  \n24.5. Colors – Use 230 to 305 mesh with 50 to 55 lpi. \n25. Overprint \nTo prevent final print out to come off the printing press with \nmisregistration, the following steps can be used: \n25.1. Avoid Touching or Almost Touching Colors  \n25.2. Use Common Process Colors to Close Gaps  \n25.3. Overprint Black to Prevent Gaps  \n25.4. Use Chokes and Spreads to Fill the Gaps  \n25.5. Overprinting / Surprinting Avoids Need to Trap  \n25.6. Manual and Automatic Trapping\n\n--- PDF PAGE 61 ---\n__________________________________________________