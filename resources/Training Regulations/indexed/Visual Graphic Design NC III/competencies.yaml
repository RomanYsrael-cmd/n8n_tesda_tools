ls \nand standard \nformulas \n2.4 Mathematical \ntechniques \n \n2.1 Solving \nmathematical \ncomputations \n2.2 Converting Metric \nto English \n2.3 Selecting and \nusing appropriate \nand efficient \ntechniques and \nstrategies to solve \nproblems \n3.  Analyze results \n3.1  Result of application is \nreviewed based on \nexpected and required \nspecifications and \noutcome \n3.2  Appropriate action is \napplied in case of error\n3.1  Techniques in \nanalyzing the \nresults \n3.2  Process in \nreviewing the \nresults \n3.3  Precision and \naccuracy \n3.4  Four fundamental \n3.1 Analyzing the result \nbased on the \nspecified \nrequirements \n3.2 Interpreting and \ncommunicating the \nresults of the \nanalysis\n\n--- PDF PAGE 21 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                           Amended February 27, 2018 \n \n17\nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \noperations \n3.5  Steps in solving \nproblem \n3.6  Standard formulas \n3.7  Conversion \nmeasurement\n\n--- PDF PAGE 22 ---\n_________________________________________________________________________________ \nTR - Visual Graphic Design NC III    (Version 01)                           Amended February 27, 2018 \n \n18\n \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Mathematical \ntechniques \nMay include: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n2. Appropriate \naction \n2.1  Review in the use of mathematical techniques (e.g. \nrecalculation, re-modeling) \n2.2  Report error to immediate superior for proper action \n \n \n \nEVIDENCE GUIDE \n \n1. Critical \nAspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Identified, applied and reviewed the use of mathematical \nconcepts and tec