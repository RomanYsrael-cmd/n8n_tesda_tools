        "source_text": "ICT216315\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude required to\nincorporate the principles of visual design and communication into\nthe development of designs for user experience.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Receive and\ninterpret the\nuser\nexperience\ndesign brief\n\n1.1. Specifications of the design brief\nare correctly interpreted and\nliaised with client and/or\nSupervisor\n1.2. Proposed user experience\ndesigns are established and\nclarified from the relevant\npersonnel.\n1.3. Specifications, parameters or\nconstraints are identified based\non the design brief\n1.4. Information are sourced and\nevaluated pertinent to the design\nbrief\n1.5. User behavior, user goals, user\nmotivations and user needs are\nresearched and compared\nappropriate to the design brief.\n1.6. Relationship between the visual\nelements, hardware, and\nsoftware required is identified\nbased on the needs of the\ndesign brief\n1.7. Research media and findings\nare organized and updated as\nrequired\n1.8. Initial discussions are evaluated,\nbased on the findings against\nthe design brief.\n1.1. Verbal\ncommunication\n1.2. Written\ncommunication\n1.3. Intellectual\nproperty\n1.4. Behavioral\nScience\n1.5. Human and\nAnimal Anatomy\n1.6. Elements of\ndesign\n1.7. Principles of\ndesign\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Listening skills\n1.4. Critical thinking\n1.5. Analytical skills\n2. Select\nmedia/\nmaterials for\nuser\nexperience\ndesign\n2.1. Appropriate user behavior, user\ngoals, user motivations and user\nneeds are identified and\nselected based on the findings of\nthe research.\n2.2. Materials, hardware, and\nsoftware are gathered and\nsourced based on the\nrequirements\n2.3. Non-functioning equipment and\nmaterials should be reported to\nrelevant personnel.\n2.1. Verbal\ncommunication\n2.2. Written\