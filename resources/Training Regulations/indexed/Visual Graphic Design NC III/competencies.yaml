ls\n5.11. Practicing\nOSHS, EHSM,\n3Rs\n\n--- PDF PAGE 49 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n45\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. design brief\nMay include the following :\n1.1. Project Statement\n1.2. Project Objectives\n1.3. Variables\n1.4. Statistical Interpretation\n1.5. Conclusions and Recommendations\n1.6.\nBibliography / References\n2. Desired outcome\nMay include the following logo design outcome :\n2.1. Branding for a company\n2.2. Branding for a product\n2.3. Branding for a person/ Group\n2.4. Branding for an ad campaign\n2.5.\nBranding for a service\n3. Resources\nMay include :\n3.1. Books / magazines\n3.2. Internet\n3.3. DVDs / Videos\n3.4. Photographs\n3.5.\nImages\n4. Steps of\nsubmission\nMay include the following steps:\n4.1. Submit sketches in paper/ scanned format\n4.2. Submit sketches in digital format\n4.3. Submit sketches first, color suggestions after\n4.4. Submit in full color\n4.5. Submit with specific number of sketches & designs\n4.6.\nSubmit with certain deadlines indicated\n5. Relevant\npersonnel\nMay include the following:\n5.1. Creative/art director\n5.2. Client\n5.3. Head of department\n5.4.\nSupervisor\n6. Materials\nMay include :\n6.1. Paper / sketchpad / tracing paper\n6.2. Lead & colored pencils\n6.3. Colored pens / sign pen\n6.4. Markers\n6.5. USB / flash drive\n6.6. Watercolor / poster color\n6.7. Ruler\n6.8. Compass\n6.9. Scissors\n6.10. Glue / tape\n6.11. Paper clips\n6.12. Design books / magazines\n\n--- PDF PAGE 50 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n46\nVARIABLE\nRANGE\n7. Equipment\nMay include :\n7.1. Drawing table\n7.2. Computer with peripherals\n7.3. Removable hard drive\n7.4. Chair\n7.5. Internet\n7.6. Drawing tablet\n7.7. Mobile phone\n7.8. Camera\n7.9.\nLaptop\