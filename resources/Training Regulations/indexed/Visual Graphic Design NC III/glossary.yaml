      "term": "Color separation",
      "definition": "refers to color printing, is the reproduction of an image or text in color (as opposed to simpler black and white or monochrome printing). Color printing involves a series of steps, or transformations, in order to generate a quality color reproduction. The process of color separation starts by separating the original artwork into red, green, and blue components (for example by a digital scanner). The next step is to invert each of these separations. When a negative image of the red component is produced, the resulting image represents the cyan component of the image. Likewise, negatives are produced of the green and blue components to produce magenta and yellow separations, respectively. This is done because cyan, magenta, and yellow are subtractive primaries which each represent two of the three additive primaries (RGB) after one additive primary has been subtracted from white light."
