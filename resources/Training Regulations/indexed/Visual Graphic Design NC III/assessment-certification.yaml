    },
    {
      "number": "4.1",
      "text": "1 To attain the National Qualification of Visual Graphic Design NC III, the candidate must demonstrate competency in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III level signed by the TESDA Director General."
    },
