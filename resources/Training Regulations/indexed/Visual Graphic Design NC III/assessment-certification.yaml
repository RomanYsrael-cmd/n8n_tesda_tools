      "number": "4.1",
      "text": "2.1 Accumulation of Certificates of Competency (COCs) in all the following clustered units of competencies: COC 1 - Develop designs for logo and print media • Develop designs for a logo • Develop designs for a print media COC 2 – Develop designs for user experience and user interface • Develop designs for user experience • Develop designs for user interface COC 3 – Develop designs for product packaging COC 4 – Design booth and product window/display Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units."
