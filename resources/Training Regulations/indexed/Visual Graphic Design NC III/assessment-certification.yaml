 LAXAMANA ( Animator/ graphic artist ) MR. JEFFREY SARMIENTO ( Graphics designer ) • THE ANIMATION COUNCIL OF THE PHILIPPINES, INC. (ACPI) • THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS • THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT • Qualifications and Standards Office (QSO) Name Company/industry Email Address Imelda B. Taganas ibtaganas@tesda.gov.ph Julford C. Abasolo jcabasolo@tesda.gov.ph Samuel E. Calado Jr. secaladojr@tesda.gov.ph Venzel Y. Concoles vyconcoles@tesda.gov.ph"
