      "text": "4 Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. --- PDF PAGE 110 --- _________________________________________________________________________________ TR-ICT (Visual Graphic Design NC III) (Version 01) Amended February 27, 2018 106"
