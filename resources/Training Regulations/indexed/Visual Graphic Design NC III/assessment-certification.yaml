    {
      "number": "1",
      "text": "Additive Color - A color produced by light falling onto a surface, as compared to subtractive color. An additive color model involves light emitted directly from a source or illuminant of some sort. The additive reproduction process usually uses red, green and blue light to produce the other colors"
    },
    {
      "number": "2",
      "text": "Anti-alias - The blending of pixel colors on the perimeter of hard-edged shapes, like type, to smooth undesirable edges (jaggies)."
    },
    {
      "number": "3",
      "text": "Artwork - All original copy, including type, photos and illustrations, intended for printing. Also called art."
    },
    {
      "number": "4",
      "text": "Bitmap (or raster) image - is one of the two major graphic types (the other being vector ). Bitmap-based images are comprised of pixels in a grid. Each pixel or \"bit\" in the image contains information about the color to be displayed. Bitmap images have a fixed resolution and cannot be resized without losing image quality. Common bitmap- based formats are JPEG, GIF, TIFF, PNG, PICT, and BMP. Most bitmap images can be converted to other bitmap-based formats very easily. Bitmap images tend to have much large file sizes than vector graphics and they are often compressed to reduce their size. Although many graphics formats are bitmap-based, bitmap (BMP) is also a graphic format."
    },
    {
      "number": "5",
      "text": "CMYK - Acronym for cyan-magenta-yellow-black. A color model that describes each color in terms of the quantity of each secondary color (cyan, magenta, yellow), and \"key\" (black) it contains. The CMYK system is used for printing."
    },
    {
      "number": "6",
      "text": "Color Balance - Refers to amounts of process colors that simulate the colors of the original scene or photograph."
    },
    {
      "number": "7",
      "text": "Color Correct - Adjust the relationship among the process colors to achieve desirable colors."
    },
    {
      "number": "8",
      "text": "Color Gamut - Range of hues possible to reproduce using a specific device, such as a computer screen, or system, such as four-color process printing."
    },
    {
      "number": "9",
      "text": "Color Model - Way of categorizing and describing the infinite array of colors found in nature."
    },
    {
      "number": "10",
      "text": "Color separation - refers to color printing, is the reproduction of an image or text in color (as opposed to simpler black and white or monochrome printing). Color printing involves a series of steps, or transformations, in order to generate a quality color reproduction. The process of color separation starts by separating the original artwork into red, green, and blue components (for example by a digital scanner). The next step is to invert each of these separations. When a negative image of the red component is produced, the resulting image represents the cyan component of the image. Likewise, negatives are produced of the green and blue components to produce magenta and yellow separations, respectively. This is done because cyan, magenta, and yellow are subtractive primaries which each represent two of the three additive primaries (RGB) after one additive primary has been subtracted from white light."
    },
    {
      "number": "11",
      "text": "Composition - (1) In typography, the assembly of typographic elements, such as words and paragraphs, into pages ready for printing. (2) In graphic design, the arrangement of type, graphics and other elements on the page."
    },
    {
      "number": "12",
      "text": "Computer graphics is a sub-field of computer science and is concerned with digitally synthesizing and manipulating visual content. Although the term often refers to three- --- PDF PAGE 113 --- _________________________________________________________________________________ TR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018 109 dimensional computer graphics, it also encompasses two-dimensional graphics and image processing. Computer graphics is often differentiated from the field of visualization, although the two have many similarities."
    },
    {
      "number": "13",
      "text": "Critical Thinking - the objective analysis and evaluation of an issue in order to form a judgment."
    },
    {
      "number": "14",
      "text": "Die line - is the template for a package. It's a flattened outline of the cut lines and folds. You cannot create a product package design without one. If you took apart a cereal box and flattened it out, you'd be looking at the die line."
    },
    {
      "number": "15",
      "text": "Drawing - is a means of making an image, using any of a wide variety of tools and techniques. It generally involves making marks on a surface by applying pressure from a tool, or moving a tool across a surface. Common tools are graphite pencils, pen and ink, inked brushes, wax color pencils, crayons, charcoals, pastels, and markers. Digital tools which simulate the effects of these are also used. The main techniques used in drawing are: line drawing, hatching, crosshatching, random hatching, scribbling, stippling, and blending."
    },
    {
      "number": "16",
      "text": "Electronic media - are media that utilize electronics or electromechanical energy for the end user (audience) to access the content. This is in contrast to static media (mainly print media), which are most often created electronically, but don't require electronics to be accessed by the end user in the printed form."
    },
    {
      "number": "17",
      "text": "Filters - the color filters filter the light by wavelength range, such that the separate filtered intensities include information about the color of light."
    },
    {
      "number": "18",
      "text": "Flattening - A Photoshop CS process in which all visible layers are merged into the background, greatly reducing file size. Flattening an image discards all hidden layers and fills the remaining transparent areas with white."
    },
    {
      "number": "19",
      "text": "Graphic Arts - is a term applied historically to the art of printmaking and drawing. In contemporary usage it refers to the applied trade-skills of a graphic designer or print technician. The term can include the trades of lithography, serigraphy and bindery, among others. Graphic arts as a trade can be traced back to the first instances of the stamped image or word."
    },
    {
      "number": "20",
      "text": "Graphic Design - Arrangement of type and visual elements along with specifications for paper, ink colors and printing processes that, when combined, convey a visual message."
    },
    {
      "number": "21",
      "text": "Graphics - Visual elements that supplement type to make printed messages more clear or interesting."
    },
    {
      "number": "22",
      "text": "Grayscale - A sequence of shades ranging from black through white, used in computer graphics to add detail to images or to represent a color image on a monochrome output device."
    },
    {
      "number": "23",
      "text": "Handheld device - is a pocket-sized computing device, typically comprising a small visual display screen for user output and a miniature keyboard or touch screen for user input."
    },
    {
      "number": "24",
      "text": "Holistic Skills - All encompassing view based on the knowledge of the nature, functions, and properties of the components, their interactions, and their relationship to the whole. Read more: http://www.businessdictionary.com/definition/holistic.html"
    },
    {
      "number": "25",
      "text": "Hue - A specific color such as yellow or orange. --- PDF PAGE 114 --- _________________________________________________________________________________ TR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018 110"
    },
    {
      "number": "26",
      "text": "Images or picture - is an artifact, usually two-dimensional, that has a similar appearance to some subject—usually a physical object or a person. Images may be two-dimensional, such as a photograph, screen display, and as well as a three- dimensional, such as a statue. They may be captured by optical devices—such as cameras, mirrors, lenses, telescopes, microscopes, etc. and natural objects and phenomena, such as the human eye or water surfaces."
    },
    {
      "number": "27",
      "text": "Indexed Color - Indexed formats are formats which are mapped to a smaller color palette - 256-colours or less. All GIF images - whose bit depths can range from 1 to 8 - are, by definition, indexed images. In an indexed image, colors are stored in a palette, which is sometimes referred to as a color lookup table. The indexed image's palette contains all of the colors that are available for the image."
    },
    {
      "number": "28",
      "text": "Interaction design - is when we create engaging web interfaces with logical behaviors and actions."
    },
    {
      "number": "29",
      "text": "Layout - A sample of the original providing (showing) position of printed work (direction, instructions) needed and desired."
    },
    {
      "number": "30",
      "text": "Layered - In Photoshop, a layer is a section of information within a file. For example, a RGB file consists of at least four layers: the combined RGB layer, a Red layer, a Green layer, and a Blue."
    },
    {
      "number": "31",
      "text": "Leading - Amount of space between lines of type."
    },
    {
      "number": "32",
      "text": "Logo (Logotype) - A company, partnership or corporate creation (design) that denotes a unique entity. A possible combination of letters and art work to create a \"sole\" entity symbol of that specific unit."
    },
    {
      "number": "33",
      "text": "Lossless Compression - The process of compressing a file such that, after being compressed and decompressed, it matches its original format bit for bit."
    },
    {
      "number": "34",
      "text": "Multichannel - Color mode in which each multiple channel in Photoshop uses 256 levels of gray."
    },
    {
      "number": "35",
      "text": "Mockup - or mock-up, is a scale or full-size model of a design or device, used for teaching, demonstration, design evaluation, promotion, and other purposes."
    },
    {
      "number": "36",
      "text": "Objects – refers to the vector shapes, e.g rectangle, rounded shapes, ellipse and other irregular shapes."
    },
    {
      "number": "37",
      "text": "Page layout - is the part of graphic design that deals in the arrangement and style treatment of elements (content) on a page."
    },
    {
      "number": "38",
      "text": "Path - consists of the general outline of an object. Paths can be open or closed and can be made up of a combination of straight and curved segments. Open paths are straight or curved lines which can have varying thickness by stroking the path. Closed paths are shapes which can have a stroked outline and a filled interior. Paths can also be used to mask out or clip away portions of another image. These paths are referred to as clipping paths. Paths in graphics software are generally creating using a pen tool, Bézier curve tool, or less commonly, a spline or b-spline curve tool."
    },
    {
      "number": "39",
      "text": "Printmaking is the process of making artworks by printing, normally on paper."
    },
    {
      "number": "40",
      "text": "Process color - is a subtractive color model, used in color printing, also used to describe the printing process itself. Though it varies by print house, press operator, press manufacturer and press run, ink is typically applied in the order of the acronym."
    },
    {
      "number": "41",
      "text": "Prototype - is an early sample, model, or release of a product built to test a concept or process or to act as a thing to be replicated or learned from. --- PDF PAGE 115 --- _________________________________________________________________________________ TR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018 111"
    },
    {
      "number": "42",
      "text": "Proof - Test sheet made to reveal errors or flaws, predict results on press and record how a printing job is intended to appear when finished."
    },
    {
      "number": "43",
      "text": "Raster graphics – see Bitmap definition."
    },
    {
      "number": "44",
      "text": "Resolution - Sharpness of an image on film, paper, computer screen, disc, tape or other medium."
    },
    {
      "number": "45",
      "text": "Responsive Design - aims to build websites which provide an optimal viewing and interaction experience."
    },
    {
      "number": "46",
      "text": "RGB - Acronym for red-green-blue. The three colors of light which can be mixed to produce any other color. Colored images are often stored as a sequence of RGB triplets or as separate red, green, and blue overlays though this is not the only possible representation (see CMYK)."
    },
    {
      "number": "47",
      "text": "Scale - To enlarge or reduce a graphic display, such as a drawing or a photographic image, by adjusting its size proportionally."
    },
    {
      "number": "48",
      "text": "Sharpening - In Photoshop, a variation of a traditional compositing technique used to sharpen edges in an image. It is useful for images intended both for print and online."
    },
    {
      "number": "49",
      "text": "Software – computer programs and procedures concerned with the operation of an information system"
    },
    {
      "number": "50",
      "text": "Spot color – In offset printing, a spot color is any color generated by an ink (pure or mixed) that is printed using a single run. The widely-spread offset printing process is composed of four spot colors: Cyan, Magenta, Yellow and Key (black) commonly referred to as CMYK. More advanced processes involve the use of six spot colors (hexa-chromatic process), which add Orange and Green to the process (termed CMYKOG). The two additional spot colors are added to compensate for the inefficient reproduction of faint tints using CMYK colors only. However, offset technicians around the world use the term spot color to mean any color generated by a non-standard offset ink; such as metallic, fluorescent, spot varnish, or custom hand-mixed inks."
    },
    {
      "number": "51",
      "text": "Stroke – refers to outline of an object."
    },
    {
      "number": "52",
      "text": "Subtractive Color - Color produced by light reflected from a surface, as compared to additive color. Subtractive color includes hues in color photos and colors created by inks on paper."
    },
    {
      "number": "53",
      "text": "Tint - Screening or adding white to a solid color for results of lightening that specific color."
    },
    {
      "number": "54",
      "text": "Trapping is a method of adjusting areas where two distinct, adjacent colors meet so that press misregistration won't cause white spaces. Two kinds of trap process include : a) spread - a lighter object overlaps a darker background and seems to expand into the background and b) choke - a lighter background overlaps a darker object that falls within the background and seems to squeeze or reduce the object."
    },
    {
      "number": "55",
      "text": "UI (User Interface) Design – is the process of designing the look and feel of an application."
    },
    {
      "number": "56",
      "text": "UX (User Experience) Design - is the process of enhancing user satisfaction by improving the usability, accessibility, and pleasure provided in the interaction between the user and the product."
    },
    {
      "number": "57",
      "text": "Vector image - is one of the two major graphic types (the other being bitmap). Vector graphics are made up of many individual objects. Each of these objects can be defined by mathematical statements and has individual properties assigned to it such --- PDF PAGE 116 --- _________________________________________________________________________________ TR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018 112 as color, fill, and outline. Vector graphics are resolution independent because they can be output to the highest quality at any scale."
    },
    {
      "number": "58",
      "text": "Visual arts - are art forms that focus on the creation of works which are primarily visual in nature, such as painting, photography, printmaking, and filmmaking. Those that involve three-dimensional objects, such as sculpture and architecture, are called plastic arts."
    },
    {
      "number": "59",
      "text": "Wireflow - are a design-specification format that combines wireframe-style page layout designs with a simplified flowchart-like way of representing interactions"
    },
    {
      "number": "60",
