      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of Visual Graphic Design NC III, the candidate must demonstrate competency in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III level signed by the TESDA Director General. 4.1.2 The qualification of Visual Graphic Design NC III may be attained through: 4.1.2.1 Accumulation of Certificates of Competency (COCs) in all the following clustered units of competencies: COC 1 - Develop designs for logo and print media • Develop designs for a logo • Develop designs for a print media COC 2 – Develop designs for user experience and user interface • Develop designs for user experience • Develop designs for user interface COC 3 – Develop designs for product packaging COC 4 – Design booth and product window/display Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units. 4.1.2.2 Demonstration of competence through a single comprehensive project-type assessment covering all required units of competency of this qualification. 4.1.3 Upon accumulation and submission of all COCs acquired for all the relevant units of competency comprising this qualification, an individual shall be issued the corresponding National Certificate. 4.1.4 Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. TR-ICT (Visual Graphic Design NC III) (Version 01) Amended February 27, 2018"
