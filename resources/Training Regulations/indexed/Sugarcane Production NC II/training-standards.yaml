h cooperative\narrangements or MOA with other partner- companies/institutions.\n\n3.6 TRAINER’S QUALIFICATIONS FOR AGRICULTURE, FORESTRY AND FISHERY\nSECTOR -SUGARCANE PRODUCTION NC II\n\n• Must be a holder of NTTC Level I in Sugarcane Production NC II\n• Must have at least 2 years’ job/industry experience for the last five (5) years\n\n--- PDF PAGE 132 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n128\n3.7 INSTITUTIONAL ASSESSMENT\nInstitutional Assessment is undertaken by trainees in a structured learning program\nto determine their achievement of units of competencies. It is administered by the\ntrainer/assessor at end of each learning module.\n\nThe result of the institutional assessment may be considered as evidence for the\nassessment for national certification.\n\nAs a matter of policy, graduates of programs registered with TESDA under these\ntraining regulations are required to undergo mandatory national competency\nassessment upon completion of the program."
