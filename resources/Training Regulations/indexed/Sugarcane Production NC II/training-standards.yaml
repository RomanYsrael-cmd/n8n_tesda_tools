      "source_text": "3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\nSchool/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Implementing Rules and Regulations of the DTS Law\nand the TESDA Guidelines on the DTP;\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\n\n--- PDF PAGE 121 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n117\ncompetencies as prescribed in the training regulations. It is imperative that the\ndeployment of trainees in the workplace is adhered to training programs agreed\nby the institution and enterprise and status and progress of trainees are closely\nmonitored by the training institutions to prevent opportunity for work\nexploitation. Specific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\nThere would be no across-the-board SIT or OJT for all programs covered by\nthe TRs. Whether SIT/OJT along a particular qualification will be mandatory or\nnot shall be defined in the TR to be promulgated. A curriculum mix with\ndominant practicum component is preferred.\n\nThe SIT or OJT component may be considered optional for the trainees who\nhave had previous relevant work experience in the qualification for a period of\ntime considered as sufficient by the qualified trainer concerned as indicated in\nthe Training regulations.\n\n• Project-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\nEnterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\nCommunity-Based – Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program (MTP).\n\nPeer teaching/mentoring - is a training modality wherein fast learners are given the\nopportunity to assist the slow learners."
    },
