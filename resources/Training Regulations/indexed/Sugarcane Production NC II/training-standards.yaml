      "source_text": "3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude Technology, Science, Math, English/Communication, and Environmental\nAwareness and Safety. The curriculum design should also incorporate green\ntechnology, issues on health, drugs and gender and concerns relating to people\nwith disabilities (PWDs).\nCourse Title: SUGARCANE PRODUCTION NC Level NC II\nNominal Training Duration:\n\n 20 hrs\nBasic Competencies\n\n 72 hrs\nCommon Competencies\n\n511 hrs\nCore Competencies\n Total\n603 hrs\n\nCourse Description:\nThis course is designed to develop and enhance the knowledge, desirable\nattitudes and skills of a sugarcane planter to establish sugarcane nursery, plant\nsugarcane, care and maintain sugarcane and ratoon crops, and carry-out harvest and\npost-harvest operations. It covers skills sugarcane planting focusing on manual\noperations; while for mechanized operations, the farmer has to have competencies in\nsourcing out services from farm machinery service providers.\n To accomplish the above, all units prescribed for this qualification must be\nachieved.\n\n--- PDF PAGE 66 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n62\nBASIC COMPETENCIES\n20 HRS\n\nUnit of\nCompetency\nLearning\nOutcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Read:\no E