d\nrisks\n• Describe OHS procedures,\npractices and regulations\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hours\n\n•Read\n•\nLecture\n• Written\nexamination\n\no OHS indicators\n\no Organizational contingency\npractices\n\n• Practice hazards/risks\nidentification and control\n\n4.2 Evaluate\nhazard and\nrisks\n• Describe effects of safety\nhazards\n•\nGroup\ndiscussion\n• Oral evaluation\n\n--- PDF PAGE 72 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n68\nUnit of\nCompetency\nLearning\nOutcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n•Read\n•\nLecture\n• Written\nexamination\n\no Threshold Limit Value –\nTLV\n\n• Practice reporting safety\nhazards\n•\nRole play\n• Observation\n\n• Demonstrate evaluating\nhazards and risks using\ncommunication equipment\n•\nDemonstration\n• Observation\n\n4.3 Control\nhazards and\nrisks\n• Describe:\no Organization safety and\nhealth protocol\n•\nGroup\ndiscussion\n• Oral evaluation\n\no Company emergency\nprocedure practices\n\n•Practice personal hygiene\n•\nDemonstration\n•Observation\n\n• Practice drills on responding\nto emergency\n•\nDemonstration\n•\nSimulation\n• Observation\n\n4.4 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Identify emergency-related\ndrills information\n•\nLecture\n• Written\nexamination\n\n• Practice occupational safety\nand health standards on\npersonal records in the\nworkplace\n•\nRole play\n• Observation\n\n• Practice emergency related\ndrills in the workplace\n•\nDemonstration\n•\nSimulation\n• Observation\n\n--- PDF PAGE 73 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n69\n COMMON COMPETENCIES\n72 HRS\n\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\n\nMethodology\n\nAssessment\nMethod\nNominal Duration\n1.Apply safety\nmeasures in\nfarm\noperations\n1.1 Determine\nareas of\nconcern for\nsafety\nmeasures\n• Identify work tasks in\nfarm operations\n• Lecture\n• Discussion\n• Incomple