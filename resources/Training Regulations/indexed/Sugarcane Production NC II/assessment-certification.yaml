  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The Full National Qualification of SUGARCANE PRODUCTION NC II\nshall be acquired through the accumulation of Certificates of\nCompetency in the following clusters/units of competencies:\n\nCOC 1 Establish sugarcane nursery\n\nCOC 2 Plant, care and maintain sugarcane and ratoon crops\n• Plant Sugarcane\n• Care and Maintain Sugarcane and Ratoon Crops\n\nCOC 3 Carry-out harvest and post-harvest operations\n\n4.1.2 Upon accumulation and submission of all the above COCs acquired, an\nindividual shall be issued the corresponding National Certificate signed\nby the TESDA Director General. Certificates of Competency (COCs)\nshall be issued to candidates who have been assessed as competent\nin any of the above COCs (COC 1, COC 2, COC 3).\n\n--- PDF PAGE 133 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n129\n4.1.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the\ncore units.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, work or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment.\n\n4.1.5 The following are qualified to apply for assessment:\n\n4.1.5.1\nGraduating students/trainees of WTR-registered programs,\ngraduates of NTR programs or graduates of formal/non-\nformal/informal including enterprise-based trainings related\nto sugarcane production\n4.1.5.2\nIndustry workers in sugarcane production\n\n4.1.6 Re-assessment shall be focused only on the specific area/s where the\ncandidate has not satisfactorily achieved the required level of\ncompetence AND must be undertaken within two (2) years during the\nperiod of validity of the Training Regulations.\n\n4.1.7 A candidate who fails the assessment for two (2) consecutive times shall\nbe advised to go through a refresher course before taking another\nassessment.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n--- PDF PAGE 134 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n130\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n4.2.3.1\nQualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) in\nSugarcane Production NC II\n• Have at least two (2) years relevant industry experience for the\nlast five (5) years\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\nFor Industry-Assessor\n• Holder of National Certificate in Sugarcane Production NCII\n• Holder of Certificate of Competency (COC) in Conduct\nCompetency Assessment under the Trainers Methodology\nLevel I (TM I)\n• Have at least two (2) years relevant industry experience for the\nlast five (5) years\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\n--- PDF PAGE 135 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n131\n\nANNEX A\n\nReceive and\nRespond to\nWorkplace\nCommunication\nParticipate in\nWorkplace\nCommunication\nLead\nWorkplace\nCommunication\nUse relevant\ntechnologies\nDevelop Team\nand Individual\nWork with\nOthers\nWork in a\nTeam\nEnvironment\nLead Small\nTeam\nSolve\nproblems\nrelated to\nwork activities\nApply Problem\nSolving\nTechniques in\nthe Workplace\nPractice basic\nhousekeeping\nprocedures\nDemonstrate\nwork values\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nPlan and\nOrganize\nWork\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and\nsafety\nprocedures\n\nApply safety\nmeasures in\nfarm operations\nUse farm tools\nand equipment\nPerform\nestimation and\ncalculation\nApply basic\nfirst aid\nProcess farm\nwastes\n\nCOMMON COMPETENCY\nBASIC COMPETENCY\nCOMPETENCY MAP – AGRICULTURE, FORESTRY AND FISHERY SECTOR\nSUGARCANE PRODUCTION NC II\n\n--- PDF PAGE 136 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n132\n\nSupervise\nagronomic\ncrop\nmaintenance\nProduce fruit\nbearing crops\nUndertake\nagronomical\ncrop\nmaintenance\nactivities\nImplement\nvertebrate pest\ncontrol\nprogram\nImplement a\nplant\nestablishment\nprogram\nMaintain the\nworkplace\nPerform post\nharvest\noperations of\nmajor tropical\nfruits\nUndertake\nagronomic\ncrop\nharvesting\nactivities\nMonitor and\noperate water\ntreatment\nprocesses\nTransport,\nhandle and\nstore\nchemicals\nSupport\nagronomic\ncrop work\nPerform post\nharvest\noperation of\nmajor lowland\nand semi-\ntemperate\nvegetable\ncrops\nSave, prepare\nand store\nagricultural\nseed\nCollect\nsamples for a\nrural\nproduction of\nhorticulture\nmonitoring\nprogram\nSupervise\nagricultural\ncrop\nestablishment\nSupport\nhorticultural\ncrop work\nPrepare land\nfor agricultural\ncrop\nproduction\nUndertake field\nbudding and\ngrafting\nSave, prepare\nand store\nagricultural\nseed\nImplement and\nmonitor quality\nassurance\nprocedures\nSupport\nirrigation work\nPrepare and\napply\nchemicals\nCoordinate a\nhorticultural\ncrop\nmaintenance\nprogram\nUndertake\nagronomic crop\nmaintenance\nactivities\nSupport and\nreview\nbusiness\nstructures and\nrelationships\nSupport\nnursery work\nimplement a\nplant nutrition\nprogram\nEstablish\nhorticultural\ncrops\nCoordinate\nmachinery and\nequipment\nmaintenance\nand repair for\nagricultural\ncrops\nPromote plant\nhealth\nConduct pre-\nhorticultural\nfarm\noperations\nControl weeds\nUndertake a\npropagation\nprogram\nOperate\npertigation\nequipment\nImplement and\nmonitor a\nproperty\nimprovement\nplan\nProduce\nvegetables\nImplement a\npost-harvest\nprogram\nCoordinate\nhorticultural\ncrop\nharvesting\nOperate within\na budget\nframework\nSupervise\nmaintenance of\nmachinery and\nequipment\nPlan &\nimplement a\nchemical use\nprogram\nEstablish\nagronomic\ncrops\nSupervise\nhorticultural\ncrop harvesting\nComply with\nindustry quality\nassurance\nrequirements\nKeep records\nfor a farm\nbusiness\nApply basic\nfirst aid\nImplement\nvertebrate pest\ncontrol\nprogram\nControl weeds,\npests and /or\ndiseases in\ncrops\nSupervise\nagronomic crop\nharvesting\nAnalyze and\ninterpret\nproduction\ndata\nConduct\nVariety and\nSeed Selection\nPerform Land\npreparation\nCarry-out Crop\nEstablishment\nManage crop\nConduct of\nHarvest and\nPost-Harvest\nOperations\nEstablish\nsugarcane\nnursery\nPlant\nsugarcane\nCare and\nmaintain\nsugarcane and\nratoon crops\n\nCORE COMPETENCY\n\n--- PDF PAGE 137 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n133\nGLOSSARY OF TERMS\n\n1. Brix- percent solids in the cane juice which roughly estimates sweetness in the\nsugarcane as indicated by the refractometer.\n2. Bagasse- the woody fiber residue obtained from crushing cane.\n3. Cane maturity – a stage in sugarcane growth characterized by optimum tonnage\nand sucrose content.\n4. Crop calendar- contains the month/s of crop planting and harvesting.\n5. Crop estimate- the amount of sugarcane projected or expected to be harvested and\nto be milled from a specific area or district for a particular milling season. It is usually\nundertaken at the start of the crop year, every quarter and before milling.\n6. Crop year- as used in the Philippine sugarcane industry, officially starts during\nSeptember of each year and ends on August of the next year.\n7. Cutback canepoint – planting material derived from 5-6 month old canes with 2-3\nwell developed viable buds and usually taken from nurseries.\n8. Drainage- removal of excess surface and ground water from the land by artificial\nmeans to build up favourable conditions for plant growth.\n9. Fertilizer- any substance or materials that can supply one or more of the essential\nnutrients needed by the plants for normal growth.\n10. Fertilizer (Inorganic)- any chemical or synthetic materials applied to the soil to\nsupply essential elements that are readily soluble and available to plants.\n11. Fertilizer (Organic)- fertilizer originating from the remains of plants and animals and\nanimal wastes.\n12. Green manure- leguminous crops grown and plowed under while still green for the\npurpose of improving the physical condition and fertility of the soil.\n13. Harrow- an implement used primarily for pulverizing and smoothing the soi.\n14. Hectare- a land measurement unit equivalent to 10,000 square meters.\n15. Herbicide- any chemical substance used to control unwanted plants.\n16. Insecticides- any substance used to control insects.\n\n--- PDF PAGE 138 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n134\n17. Integrated Pest Management (IPM)- the appropriate utilization of several pest and\ndisease control measures as cultural, chemical and biological means resulting in\nproductive and sustainable crop production.\n18. Integrated Soil Fertility Management (ISFM)- the combined use of organic or\nnatural and inorganic or chemical fertilizer aimed at reaching maximum economic\nyield through a productive, sustainable, economical and environment-friendly and\nsocially acceptable production system,\n19. Intercropping/interplanting- type of planting where one crop is planted more or less\nsystematically in between rows of another crop. The interplanted crop, called minor\ncrop does not in any way disturb the normal distance of planting of the major crop.\n20. Irrigation- artificial application of water into the soil in order to provide sufficient\nmoisture at the level of the root zone to sustain the requirements of plant during their\ngrowth period.\n21. Juice extractor – pointed metallic pipe-like tool that is used to draw out juice from\nthe stalk for use in a refractometer.\n22. Lacsa- refers to 10,000 canepoints.\n23. LKg/Ha - sugar yield equivalent to 50 kilogram bag raw sugar per hectare\n24. LKg/TC – sugar yield equivalent to 50 kilogram bag raw sugar per ton of cane\n25. Manual harvesting – cutting of stalks close to the ground and top portion using cane\nknives before piling and loading in cane cars or trucks.\n26. Molasses- the thick, dark light brown syrup that is separated from raw sugar in sugar\nprocessing.\n27. Mechanical harvesting – mechanical cutting of millable stalks where the lower blade\nof the harvester passes at the base while the upper blade cuts the top and cut stalks\nare elevated by a roller, chopped into pieces and dropped into a trailer or truck going\nwith the harvester\n28. Micropropagated plantlets – sugarcane planting materials developed from shoot\ntips cultured in an artificial medium and established in a germ-free environment in the\nlaboratory and later hardened and transplanted in nurseries.\n29. Mudpress- a mixture of sugarcane fibers, sucrose, coagulated colloids including\ncanewash, albuminoids and phosphate of lime, plus sand and soil.\n30. Pests – any of the following which inflicts harm/damage on sugarcane plants:\ndiseases, insects, rats, nematodes and weeds.\n\n--- PDF PAGE 139 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n135\n31. Planting density- refers to the number of canepoints/micropropagated plantlets\nplanted per unit area.\n32. Ratoon- emerging sugarcane shoots from the base of a harvested plant.\n33. Ratooning – the practice of regrowing of canes from stubbles of previously harvested\nsugarcane plants.\n34. Refractometer- a device used in measuring the percent solids in the cane juice which\nroughly estimates sweetness in the sugarcane.\n35. Seed piece- vegetative part of the sugarcane plant used as planting materials.\n36. Setts- canepoints or cane planting materials.\n37. Soil pH- a measure of the degree of acidity or alkalinity of soil.\n38. Stubble shaving- when the exposed portion of the stubble or even a part of the\nunderground portion is cut or removed.\n39. Sugar Central or Mill- a factory manufacturing centrifugal sugar from sugarcane and\ndoes not include auxiliary factories such as refineries and distilleries.\n40. Sugar, Centrifugal- any sugar, whether “A”, “B”, “C”, or “D” manufactured in the\ncentrifugal machines of a sugar mill, usually brown in color, which gives a polarization\nof not less than 80 sugar degrees. It is also called brown or raw sugar.\n41. Sugarcane HYV (High Yielding Varitety)- varieties developed with characteristics\nand qualities, such as high in sucrose, resistance to pest and disease, time of\nripening, resistance to drought and water-logged areas, milling and clarification\nqualities, and adaptability to soil and climatic conditions.\n42. Sugarcane – a perennial tropical grass with tall short jointed stems from which sugar\nis extracted. Scientifically known as Saccharum officinarum L., belonging to the\nfamily Poaceae.\n43. Sugarcane nursery – an area that is used for the multiplication of sugarcane\nvarieties for the production of good quality cutbacks canepoints\n44. TC/Ha – cane yield in tons of millable canes per hectare.\n45. Tonne- unit of measurement equivalent to 1,000 kilograms.\n46. Topping – removal of the terminal portion of stalks of standing canes for use as\ncanepoints for planting\n47. Top point –planting material obtained from the top portion of millable stalks\n\n--- PDF PAGE 140 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n136\n48. Trashes – all materials consisting of leaves, tops, dead stalks, diseased stalks,\nroots, soil and other extraneous materials that are not part of the millable stalks\n49. Trash mulching- or “trash farming” is the piling of trash in alternate rows or applying\nthem as a blanket cover.\n50. Trichogramma – biocontrol agent that prevents the emergence of the larva or the\ndestructive stage of the borer, by parasitizing the eggs of the pest\n51. Variety programming- refers to the planting of different cane varieties with different\ncharacteristics to enable varieties to be harvested in the early and late milling periods.\n\n--- PDF PAGE 141 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n137\nACKNOWLEDGEMENTS\n\