      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 The Full National Qualification of SUGARCANE PRODUCTION NC II shall be acquired through the accumulation of Certificates of Competency in the following clusters/units of competencies: COC 1 Establish sugarcane nursery COC 2 Plant, care and maintain sugarcane and ratoon crops • Plant Sugarcane • Care and Maintain Sugarcane and Ratoon Crops COC 3 Carry-out harvest and post-harvest operations 4.1.2 Upon accumulation and submission of all the above COCs acquired, an individual shall be issued the corresponding National Certificate signed by the TESDA Director General. Certificates of Competency (COCs) shall be issued to candidates who have been assessed as competent in any of the above COCs (COC 1, COC 2, COC 3)."
