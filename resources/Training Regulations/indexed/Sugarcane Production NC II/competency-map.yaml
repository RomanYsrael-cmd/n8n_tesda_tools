  "source_text": "SECTION 1\nSUGARCANE PRODUCTION NC II QUALIFICATION\nThe Sugarcane Production NC II Qualification consists of competencies that a\nperson must have in order to establish sugarcane nursery, plant sugarcane, care and\nmaintain sugarcane and ratoon crops and carry-out harvest and post- harvest\noperations. The individual has competencies in handling manual farming and sourcing\nof mechanized farming services for sugarcane farm area of ten (10) hectares and\nbelow.\nIt also includes competencies of a person must have to be able to practice\noccupational safety procedures, 7S of Good Housekeeping and observing\nenvironmental rules and regulations in waste management in all farm activities.\nThis Qualification is packaged from the competency map of the Agriculture,\nForestry and Fishery Sector as shown in Annex A.\nThe Units of Competency comprising this Qualification include the following:\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\nUNIT CODE\nCOMMON COMPETENCIES\nAGR321201\nApply Safety Measures in Farm Operations\nAGR321202\nUse Farm Tools and Equipment\nAGR321203\nPerform Estimation and Basic Calculation\nUNIT CODE\nCORE COMPETENCIES\nAFF611310\nEstablish Sugarcane Nursery\nAFF611311\nPlant Sugarcane\nAFF611312\nCare for and Maintain Sugarcane and Ratoon Crops\nAFF 611313\nCarryout Harvest and Post-harvest Operation\n\n--- PDF PAGE 6 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n2\nA person who has achieved this Qualification is competent to be:\n\n Sugarcane Planter\n Sugarcane Farmer\n Sugarcane Farm Worker\n Sugarcane Propagator\n Harvester\n\n--- PDF PAGE 7 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n3"
