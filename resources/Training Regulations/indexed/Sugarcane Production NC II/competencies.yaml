-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n42 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE  \nREQUIRED SKILLS\ndue to delayed \ntransport \n Proper selection of \nquality planting \nmaterials \n Characteristics of \nquality planting \nmaterials. \n Guidelines for \nquality planting \nmaterials \n Planting materials \ntreatment \nprocedures and \ntechniques              \n Pests and diseases \nmanagement \n Sugarcane \nphysiology (effects \nof treatment to the \nplanting materials) \n Dosage of treatment\n Manufacturer's \nguide \n Disposal of \ntreatment materials    \nOSHS\n4. Prepare land \nfor planting \n4.1 Site improvement \nprogram is \nimplemented based on \nthe result of the \nassessment. \n4.2 Machinery and \nimplements are \nprepared for land \npreparation according \nto prescribed methods \n4.3 Debris are removed \nand disposed \naccording to waste \nmanagement \nstandards. \n4.4 Land preparation is \nconducted according \nto crop requirement. \n4.5 Lime is applied based \non crop requirement \n Soil fertility \n Soil erosion             \n Soil nutrition             \n Water holding \ncapacity                   \n Sugarcane \nagronomy (crop \nrequirements)   \n Estimate cost of site \nimprovement      \n Site improvement \nprogram \nassessment report \n OSHS practices    \n Uses and functions \nof machineries and \nfarm implements \n Specifications of \nmachineries and \n Implementing site \nimprovement \nprogram  \n Preparing site \nimprovement \nprogram report  \n Sourcing farm \nmachinery and \nimplements services \n Demonstrating \ndebris management \n Carrying out land \npreparation \noperations \n Preparing monitoring \nand satisfaction \nreport  \n Applying liming \nmaterials  \nWearing PPEs\n\n--- PDF PAGE 47 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n43 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE  \nREQUIRED SKILLS\nand prescribed \nprocedure during land \npreparation \n4.6 Drainage canals are \nconstructed and \nmaintained according \nto procedures and \nplan \n4.7 Safety procedures for \nfertilizer application is \nfollowed according to \nOSHS \nfarm implements for \nland preparations \n Number of \nequipment to be \nused                    \n Computation for \ncosting of different \nland preparation \noperations per \nhectare \n Operating manual      \n Job request and \norder   \n Safety precautions \n Procedures for \ndebris removal & \ndisposal                    \n Waste management   \n Effect of debris \n Solid waste \nmanagement act        \n 3Rs      \n Land preparation \nprocedures and \ntechniques         \n Monitoring \nprocedures     \n Sugarcane \nagronomy on land \npreparations \n Farm Plan    \n Job satisfaction \nreport   \n Safety precautions \naccording to OSHS \n Lime application \ntechnique \n Soil acidity \n Amount and costing \nof liming materials \nand application    \n Follow instructions \nand \nrecommendations of \nsoil analysis\n Handling \nconstruction and \nmaintenance of \ndrainage canal \n Applying fertilizer  \n Negotiations skills\n\n--- PDF PAGE 48 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n44 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE  \nREQUIRED SKILLS\n Drainage \nconstruction \ntechniques \n Types of drainage \nsystem \n Measurement and \ncost of construction \nDrainage plan \n5.  Conduct \nplanting \nactivities  \n5.1 Fertilizers applied \nbased on \nrecommended rate \nand prescribed \nprocedure. \n5.2 Cane points are \nplanted based on \nrecommended \nmethods \n5.3 Safety procedures \nare followed according \nto Occupational \nSafety and Health \nStandards (OSHS) \nand Good Agricultural \nPractices (GAP)  \n Fertilizer application \ntechnique \n Nutrient \nrequirements of \nsugarcane \n Rate of fertilizer \napplication \n(frequency and \nconcentration)         \n Cost of fertilizer and \nits application   \n Program of fertilizer \napplication \n Safety precautions \naccording to OSHS    \n Planting procedures \nand techniques \n Sugarcane \nagronomy (planting) \n Rate of planting & \nquantity of planting \nmaterials  \n Farm Plan        \n Procedures in \nmonitoring \nmechanized \nplanting and \nfertilization               \nUses and functions \nof farm machineries \nand implements \n Types of farm \nmachineries and   \nimplements \n Cost of mechanized \nplanting and \nfertilization \n Farm Plan          \nOperator's Manual     \n Applying fertilizer \n Demonstrating \nplanting of cane \npoints   \n Wearing PPEs \n Monitoring \nmechanized planting \nand fertilization \nactivities\n\n--- PDF PAGE 49 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n45 \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. \nSite inspection \nSite inspection includes: \n1.1 Site visitation \n1.2 Verifying size of the area \n1.3 Verify area suitability\n2. \nArea suitability \nArea suitability includes: \n2.1 Drainage \n2.2 Accessibility \n2.3 Topography \n2.4 Water source \n2.5 Distance from the sugar mill \n2.6 Labor supply \n2.7 Soil type \n2.8 Peace and order \n2.9 Soil productivity\n3. \nTools, materials \nequipment and \nmachinery \nTools, materials, equipment and machinery include but are \nnot limited to the following: \n3.1 Cane knife \n3.2 Bolo/Scythe \n3.3 Spade or shovel or soil auger \n3.4 Hoe \n3.5 Rake \n3.6 Plastic pail \n3.7 Soaking tank \n3.8 Mixing container \n3.9 Sacks \n3.10 Weighing scale \n3.