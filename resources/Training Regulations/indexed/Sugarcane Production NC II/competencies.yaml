        "source_title": "PLANT SUGARCANE CROP",
        "source_text": "--- PDF PAGE 43 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n39 \n \nUNIT OF COMPETENCY \n:\nPLANT SUGARCANE CROP  \nUNIT CODE \n:\nAFF 611311 \nUNIT DESCRIPTOR \n:\nThis unit covers the knowledge, skills and attitudes   required \nto conduct activities related to land preparation and planting \nof sugarcane. These include soil sampling, land preparation, \nliming, furrowing, preparation and handling of planting \nmaterials, field lay-out, basal fertilization, planting and \nreplanting and use of tools and equipment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE  \nREQUIRED SKILLS\n1. Select \nplanting site \n1.1 Site inspection is \nconducted based on \nestablished farm \npractices. \n1.2 Soil samples are \ngathered for \nlaboratory analysis in \naccordance with \nstandard procedures. \n1.3 Site is selected based \non result of area \nsuitability \n1.4 Selected site is \nsecured based on \nfarm requirements.  \n1.5 Limitation of the area \nis assessed based on \nstandards procedures \n Site inspection \nprocedure and \ntechniques.                \n Use of Global \nPositioning System \n(GPS) \n Agroclimatic \nrequirements of \nsugarcane \n Land area \nmeasurements \n Preparation of site \ninspection report \n OSHS practices \n Soil sampling \nprocedures and \ntechniques \n Importance of soil \nsampling \n Number of sampling \nsites and soil \nsamples   \n Instructional manual \nin soil sampling  \n Record keeping of \nsoil sample and \nhistorical data \n Selection of sites \nbased on area \nsuitability Drainage \no \nTopography \n Measuring site area \nusing staking \nmethods  \n Conducting site \ninspections  \n Preparing inspection \nreport    \n Calibrating and \nusing of GPS  \n Collecting soil \nsamples  \n Packing and labeling \nsoil samples \n Bringing soil \nsamples to the \nlaboratory \n Estimating cost of \nsecuring farm sites   \n Reporting the \nestimated cost  \n Securing selected \nsites  \n Assessing the \nlimitation of the area\n\n--- PDF PAGE 44 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n40 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE  \nREQUIRED SKILLS\no \nWater \nsource  \no \nSoil type     \no \nSoil productivity \no \nPeace and order  \nownership/land \ntenure               \nLimitation of the \narea  \no \nPeace and order  \naccessibility \ngrazing animals    \n Estimation of \ndistance from mill \nand water source  \n Accomplishing \nchecklist for area \nsuitability \n Procedures in \nsecuring selected \nsites    \n Cost estimate for \nsecuring farm sites \n Report on cost \nestimate for \nsecuring farm sites \nwarning signs \n2. Prepare tools, \nfarm \nimplements \nand \nequipment \n2.1 Tools, farm \nimplements and \nequipment for \nplanting operations \nare prepared \naccording to work \nrequirements. \n2.2 Basic pre-operative \nchecking of tools and \nfarm implements is \nperformed in \naccordance with \nmanufacturer’s \nmanual and GAP \nstandard. \n Uses and functions \nof tools, farm \nimplements, and \nequipment \n Types of tools, farm \nimplements and \nequipment   \n List of materials, \ntools, farm \nimplements and \nequipment   \n Inspection report \n Basic pre-operative \nchecking of tools, \nfarm implements \nand equipment           \n Selecting tools, farm \nimplements and \nequipment \n Practicing OSHS \n Checking tools, farm \nimplements and \nequipment and  \n Calibrating weighing \nscale  \n Preparing inspection \nreport    \n Segregating worn out \nand corroded tools \nand farm implements  \n Wearing PPE\n\n--- PDF PAGE 45 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                  