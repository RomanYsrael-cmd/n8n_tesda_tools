fe \nof materials \n \nProper disposal of \nexpired materials\n Using tools and \nmaterials in the \nworkplace \n Wearing of \noutfits \n Observing \nexpiration/shelf \nlife of materials\n\n--- PDF PAGE 25 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n21 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3 Effectivity/shelf \nlife/expiration of \nmaterials are strictly \nobserved \n2.4 Emergency \nprocedures are known \nand followed to ensure \na safework requirement \n2.5 Hazards in the \nworkplace are identified \nand reported in line with \nfarm guidelines \n \nEnvironmental rules \nand regulations \n \nEmergency \nprocedures \n \nHazards \nidentification and \nreporting \n \nCommunication \nskills \n \nOSHS \n \n Disposing of \nexpired \nmaterials \n Following \nemergency \nprocedures \n Identifying and \nreporting of \nhazards in \nworkplace \narea. \n3. \nSafekeep \n/dispose \ntools, \nmaterials and \noutfit \n3.1 Used tools and outfit \nare cleaned after use \nand stored in \ndesignated areas. \n3.2 Unused materials are \nproperly labeled and \nstored according to \nmanufacturer’s \nrecommendation and \nfarm requirements. \n3.3 Waste materials are \ndisposed according to \nmanufacturers, \ngovernment and farm \nrequirements.\n \nProcedures of \ncleaning used tools \nand outfits \n \nLabel and storage \nunused materials \n \nDisposal of wastes \nmaterials \n \nManufacturers’ \nrecommendation on \nkeeping materials   \n \nEnvironmental rules \nand regulations \n Cleaning used \ntools and outfit  \n Labeling and \nstoring unused \nmaterials \n Disposing \nwaste materials\n\n--- PDF PAGE 26 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n22 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE 