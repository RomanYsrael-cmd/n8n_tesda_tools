ng methods include: \n10.1. Open Field Methods - Single row/Double row \n10.2. Mechanized/Manual \n10.3. Position of planting\n11. Safety procedures \nSafety procedures includes: \n11.1. Wearing of PPE \n11.2. Handling of tools \n11.3. Following instructions of manual in equipment operation \n11.4. Awareness and control of various hazards of the \noperation\n\n--- PDF PAGE 51 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n47"
