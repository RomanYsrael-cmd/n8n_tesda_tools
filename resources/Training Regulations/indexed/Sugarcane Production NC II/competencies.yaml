icultural\nPractices (GAP).\n5.4 Trash is managed\naccording to GAP\n5.5 Trash is managed\naccording to GAP.\n5.6 Ratoon replanting is\ndone according to\nprescribed\npractices.\n\n• Proper stubble\nshaving\n• Trash utilization\nand\ndecomposition\n• Types of\nreplanting\nmaterials\n• Cost of stubble\nshaving\n• Cost of trash\nfarming\n• Cost of replanting\n• Clean Air Act\n• Solid Waste\nManagement Act \n• Information\ndissemination on\ntrash farming\n• Schedule of\nreplanting\n• Improper\nharvesting\npractices\n• No burning\n• Difficulty in\nreplanting due to\ndry soil condition\n• Estimating trash\nfarming cost\n• Recording trash\nfarming cost\n• Preparing the field for\ntrash farming \n• Demonstrating proper\nreplanting methods and\nprocedures\n• Estimating replanting\ncost \n• Recording replanting\ncost \n\n--- PDF PAGE 58 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n54\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cultivation\n\nCultivation includes:\n1.1 Manual\n1.2 Mechanical\n2. Cultural practices\nCultural practices include:\n2.1 Off barring\n2.2 Hilling up\n2.3 Ridge busting\n2.4 Spike tooth harrowing (pakalas)\n3. Pests\nPests include but not limited to:\n3.1 Weeds\n3.2 Insects\n3.3 Diseases\n3.4 Rodents\n3.5 Stray animals/Vertebrate pests\n3.6 Nematodes\n4. Pest control\nmeasures\nPest control measures include but not limited to:\n4.1. Physical\n4.2. Mechanical\n4.3. Biological\n4.4. Cultural\n4.5. Chemical (biopesticide, synthetic)\n4.6. IPM\n4.7. Sanitation\n5. Tools and\nmaterials\nTools and materials include:\n5.1 Knapsack/ power sprayers\n5.2 Fertilizer\n5.3 Measuring cup\n6. Fertilizers\nFertilizers include the following:\n6.1 Organic\n6.2 Inorganic\n7. Method of fertilizer\napplication\nMethods of fertilizer application include but are not limited\nto the following:\n7.1 Basal\n7.2 Sidedress\n7.3 Topdress\n7.4 Localized\n7.5 Band\n7.6 Foliar/Spray\n7.7 Broadcast\n7.8 Spot\n7.9 Drill (tama)\n8. Watering/irrigation\nWatering/irrigation include but not limited to:\n8.1. Drip\n8.2.Furrow\n\n--- PDF PAGE 59 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n55\nVARIABLE\nRANGE\n8.3. Sprinkler\n8.4. Fertigation (fertilizer application along with irrigation)\n9. Precautionary\nmeasures\nPrecautionary measures include:\n9.1. Wearing of PPE\n9.2. Handling of tools\n9.3. Following instructions of manual in equipment operation\n9.4.Awareness and control of various hazards of the operation\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Performed cultivation\n1.2. Applied pest control measures\n1.3. Applied fertilizer\n1.4. Carried-out irrigation and drainage activities\n1.5. Managed ratoon\n1.6.\nFollowed Occupational Health and Safety Standards\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Farm or sugarcane plantation area\n2.2. Storage shed\n2.3. Farm tools/ implements/ equipment/services\n2.4. Farm supplies\n2.5. PPE\n2.6. Layout plan\n2.7. Logbooks\n2.8. Irrigation system and parts\n2.9. References (fertilizer and pesticide manual/ catalogue,\nprotocols, field guides, etc.)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct Observation\n3.2. Demonstration\n3.3. Oral interview and/or written test\n3.4. Third party report\n4.Context of Assessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\nin a simulated workplace setting.\n\n--- PDF PAGE 60 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n56\n\nUNIT OF COMPETENCY\n:\nCARRY-OUT HARVEST AND POST-HARVEST\nOPERATIONS FOR PLANT AND RATOON CROPS\nUNIT CODE\n:"
