        "source_text": "--- PDF PAGE 52 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n48 \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.    Perform \nsoil \ncultivation \n1.1     Machinery \nservices are \nsourced out \nbased on work \nrequirement \n1.2     Tools and \nimplements are \nprepared \naccording to \nspecific cultivation \npractices \n1.3     Cultivation is \nconducted based \non recommended \ncultural \npractices \n1.4     Workplace safety \nmeasures are \napplied based on \nOSHS. \n Efficient land \npreparation \nmachineries and \nservice providers \n Appropriate \ncultivation tools \nand implements \n Cultivation \nprocedures \n Soil type and \ncondition  \n Frequency of \ncultivation \n Knowledge and \ninformation on land \npreparation \nmachineries \n Handling of \ncultivation tools & \nimplements \n Cultural practices \nfor cultivation of \nsugarcane \n Number of farm \nmachinery \navailable        \n Cost of services     \n Number of tools \nand implements \nneeded \n\nSize of the area    \n Demonstrating \nnegotiation with \nservice provider and \nsupplier \n Estimating the \nnumber of tools and \nimplements needed    \n Operating cultivation \ntools and implements       \n Measuring the size of \nthe area that will be \ncultivated       \n Estimating the cost of \ncultivation                         \nDemonstrating \ncultivation practices         \nUNIT OF COMPETENCY \n:\nCARE FOR AND MAINTAIN SUGARCANE PLANT AND \nRATOON CROPS  \n \nUNIT CODE \n:\nAFF 611312 \n \nUNIT DESCRIPTOR \n:\nThis unit covers the knowledge, skills and attitudes \nrequired to manage the growth and development of \nsugarcane in the plant crop. It also includes competencies \nto perform cultivation, apply pest control measure, apply \nfertilizer, carry out irrigation and drainage activities and \nmanage ratoon.\n\n--- PDF PAGE 53 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n49 \n Cost of cultivation \n List of land \npreparation \nmachineries \navailable and \nname of service \nprovider. \n Schedule of \ncultivation \n Safety signage \n Safety precautions \n\nOSHS\n2.    Apply pest \ncontrol \nmeasure   \n2.1.    Pests’ incidence \nis monitored based \non prescribed \nprocedure. \n2.2.    Tools and \nmaterials are \nprepared according \nto specific pest \ncontrol measures. \n2.3.    Pest control \nmeasures are \nfollowed based on \nGAP and Fertilizer \nPesticide Authority \n(FPA) guidelines \n2.4.    Safety measures \nare observed and \npracticed according \nto Occupational \nHealth and Safety \n(OHS) procedures. \n Pest identification \ntechniques\n Pest monitoring \ntechniques\n Uses and functions \nof tools and \nequipment   \n Preparations of \nmaterials, tools \nand equipment\n Pests \nmanagement \nstrategies \n Types of pests \nmanagement \nstrategies\n GAP\n OSHS procedures\n Signs and \nsymptoms of major \ndiseases and \ndamages due to \npests\n Types of pests\n Assessment of \npest \ninfestation/infection \nand incidence\n Determination of \nnumber of \ntools/equipment to \nbe used    \nCalibration of \nsprayer\n Assessment of \ninfestation and \ndegree of damage\n Computation of \nrates, dosages and \n Illustrating major pests     \nAssessing \ninfestation/infection/crop \ndamage due to pest\n Preparing the materials, \ntools and equipment for \npesticide application   \n Estimating the number \nof tool/equipment to be \nused \n Demonstrating the \ncalibration of sprayer\n Operating sprayers           \n Employing pesticide \napplication\n Preparing report on \ninfestation/disease \nincidence of selected \nfields \n Demonstrating storage, \nhandling, and disposal \nof pesticides and used \ncontainers\n Practicing personal \nhygiene and safety \nmeasures related to \npesticide application\n\n--- PDF PAGE 54 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n50 \namount of \npesticides\n Record/Report \npest monitoring\n Labels and \ndirections for use \nof chemicals\n Report on \ninfestation and \ndegree of damage, \ncontrol measures \nand results\n Mode of spread\n Follow prescribe \nmonitoring \nprocedures\n Safety precautions\n Hazards to human, \nenvironment and \nnon-target \norganisms due to \npesticides\n OSHS, FPA & \nGAP relating to \npest’s \nmanagement \nstrategies\n3.    Apply \nfertilizer \n3.1     Tools and \nmaterials are \nprepared according \nto prescribed \nuser’s manual \n3.2     Fertilizer rate is \ndetermined based \non the result of soil \nanalysis. \n3.3     Fertilizers are \nselected based on \ncosting and \navailability in the \nmarket \n3.4     Method of \nfertilizer \napplication is \nemployed based \non crop \nrequirements. \n3.5     Precautionary \nmeasures are \napplied to avoid \ncross \ncontamination \nbased on GAP. \n Fertilizer \nrecommendation \n Selection \nprocedures of \nfertilizers \n Uses of tools and \nequipment \n Fertilizer \napplication \nmethods \n GAP    \n Monitoring \nprocedures \n Nutrient analysis of \nfertilizer material       \nTypes and grades \nof fertilizers \n Types of tools and \nequipment used in \nfertilizer application\n Soil Science on \neffect of fertilizer \napplication   \n Sugarcane \nagronomy      \n Estimating fertilizer \napplication rate \n Selecting the cheapest \nfertilizer combination \nthat will satisfy the \nrecommended rate           \nRecording fertilizer \nexpenditures \n Demonstrating pre-\noperation procedure for \nFarm Animal-Drawn   \napplicator  \n Estimating the number \nof tools and equipment \nneeded for fertilizer \napplication \n Preparing tools and \nother equipment               \n Operating animal-drawn \nfertilizer applicator       \n Demonstrating manual \nfertilizer application \n Demonstrating \noperation of a fertigation \nsystem\n\n--- PDF PAGE 55 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n51 \n3.6     Safety procedures \nare followed \naccording to \nOccupational \nSafety and Health \nStandards \n \n (soil and plant \nnutrition) \n Rate of fertilizer \n Cost of fertilizers \n Number of tools \nand equipment \nrequired \n Cost of fertilizer \napplication \n Records of \nfertilizer costs \n Instruction on \nproper fertilizer \napplication \n OSHS, FPA & \nGAP relating to \nfertilizer application\n Relevant local laws \nand regulations \n Availability in the \nmarket \n Health hazards \ndue to chemical \nfertilizer    \n Environmental \neffect due to \nchemical fertilizer \n(contamination)\n \nEstimating the cost of \nfertilizer application \n \nRecording fertilizer \napplication cost  \n \nMonitoring fertilizer \napplication  \n \nDemonstrating proper \nwearing of PPE \n4.    Carry out \nirrigation \nand \ndrainage \nactivities \n4.1.  Soil moisture \ncontent is \ndetermined based \non soil field capacity \n4.2.  Watering/irrigation \nis performed \nfollowing the Good \nAgricultural \nPractices (GAP). \n4.3.  Watering/irrigation \nfacilities are \nmaintained based \non industry standard \n4.4.  Drainage canal is \nconstructed and \nmaintained based \non established \nprocedures. \n \n Soil sample \ncollection \ntechniques  \n Soil moisture \nindicators\n Irrigation \ntechniques and \nprocedures\n Procedures in \nmaintaining \nirrigation facilities\n Procedures in \nconstruction and \nmaintenance of \ndrainage canals  \n Monitoring \nprocedures\n Soil moisture \ncontent\n Weather data         \n Soil, water and \nplant relationship\n Demonstrating the \nmanual method of \ndetermining soil \nmoisture \n Using soil moisture \ntester   \n Illustrating a layout of \nan irrigation system         \n Layouting an irrigation \nsystem                             \n Demonstrating proper \noperation of an \nirrigation system             \n Estimating cost of \nirrigation                          \n Preparing schedules \nfor irrigation \n Demonstrating \nmaintenance of \nirrigation facilities            \n Estimating the cost of \nirrigation system, repair \nand maintenance            \nRecording the cost of\n\n--- PDF PAGE 56 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n52 \n Time and \nfrequency of \nirrigation             \n Types of irrigation\n Importance of \nmaintenance of \nIrrigation facilities\n Importance of \ndrainage         \n Types of drainage \nsystems\n Cost estimation of \nirrigation                 \n Frequency and \nduration of \nirrigation\n Cost of irrigation \nsystem repair and \nmaintenance\n Measurements of \nsize and depth of \ndrainage canals \nbased on amount \nof water to be \ndrained            \n Cost of drainage \nsystem, repair \nand maintenance\n Soil condition and \ncrop appearance \n Weather forecast \nreport\n Preparation of \nschedules for \nirrigation\n Disruption of \nwater source\n Scheduling and \nsharing of water \nsource\n GAP on \nwatering/irrigation \nof crop\nirrigation system, repair \nand maintenance \n     Handling construction \nand maintenance of \ndrainage canal   \n     Estimating the cost of \ndrainage system \nconstruction, repair and \nmaintenance                  \n     Recording the cost of \ndrainage system \nconstruction and \nmaintenance  \n     Preparing schedules \nfor drainage \n5.    Manage \nratoon \n5.1 Cane stubbles are \nshaved based on \nrecommended \nmethods  \n5.2 The harvested field \nis cleared of cane \ntrashes following \nfarm established \nprocedures \n Stubble shaving \nmethods\n Methods of trash \nfarming\n Procedures for   \nreplanting \n Replanting \ntechniques\n Demonstrating \nharvesting and stubble \nshaving methods             \n Estimating the cost of \ndifferent stubble \nshaving methods             \n Recording the cost of \ndifferent stubble \nshaving methods\n\n--- PDF PAGE 57 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n53 \n5.3 Cane trashes are \nincorporated with \nthe soil or used as \nmulch based on \nGood Agricultural \nPractices (GAP). \n5.4 Trash is managed \naccording to GAP \n5.5 Trash is managed \naccording to GAP. \n5.6 Ratoon replanting is \ndone according to \nprescribed \npractices. \n \n Proper stubble \nshaving\n Trash utilization \nand \ndecomposition\n Types of \nreplanting \nmaterials\n Cost of stubble \nshaving\n Cost of trash \nfarming\n Cost of replanting\n Clean Air Act\n Solid Waste \nManagement Act \n Information \ndissemination on \ntrash farming\n Schedule of \nreplanting\n Improper \nharvesting \npractices\n No burning\n Difficulty in \nreplanting due to \ndry soil condition\n Estimating trash \nfarming cost                    \n Recording trash \nfarming cost                    \n Preparing the field for \ntrash farming      \n Demonstrating proper \nreplanting methods and \nprocedures                      \n Estimating replanting \ncost                          \n Recording replanting \ncost                          \n\n--- PDF PAGE 58 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n54 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE  \n1. Cultivation \n \nCultivation includes: \n1.1 Manual \n1.2 Mechanical\n2. Cultural practices \nCultural practices include: \n2.1 Off barring \n2.2 Hilling up \n2.3 Ridge busting \n2.4 Spike tooth harrowing (pakalas)\n3. Pests \nPests include but not limited to: \n3.1 Weeds \n3.2 Insects \n3.3 Diseases  \n3.4 Rodents \n3.5 Stray animals/Vertebrate pests \n3.6 Nematodes\n4. Pest control \nmeasures \nPest control measures include but not limited to: \n4.1. Physical  \n4.2. Mechanical \n4.3. Biological \n4.4. Cultural \n4.5. Chemical (biopesticide, synthetic) \n4.6. IPM \n4.7. Sanitation\n5. Tools and \nmaterials \nTools and materials include: \n5.1 Knapsack/ power sprayers \n5.2 Fertilizer \n5.3 Measuring cup\n6. Fertilizers \nFertilizers include the following: \n6.1 Organic  \n6.2 Inorganic\n7. Method of fertilizer \napplication \nMethods of fertilizer application include but are not limited \nto the following: \n7.1 Basal \n7.2 Sidedress \n7.3 Topdress \n7.4 Localized \n7.5 Band \n7.6 Foliar/Spray \n7.7 Broadcast \n7.8 Spot \n7.9 Drill (tama)\n8. Watering/irrigation \nWatering/irrigation include but not limited to: \n8.1. Drip \n8.2.Furrow\n\n--- PDF PAGE 59 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n55 \nVARIABLE \nRANGE  \n8.3. Sprinkler \n8.4. Fertigation (fertilizer application along with irrigation) \n9. Precautionary \nmeasures \nPrecautionary measures include: \n9.1. Wearing of PPE \n9.2. Handling of tools \n9.3. Following instructions of manual in equipment operation \n9.4.Awareness and control of various hazards of the operation\n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Performed cultivation  \n1.2. Applied pest control measures   \n1.3. Applied fertilizer \n1.4. Carried-out irrigation and drainage activities \n1.5. Managed ratoon  \n1.6.\nFollowed Occupational Health and Safety Standards\n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Farm or sugarcane plantation area \n2.2. Storage shed \n2.3. Farm tools/ implements/ equipment/services \n2.4. Farm supplies \n2.5. PPE \n2.6. Layout plan \n2.7. Logbooks \n2.8. Irrigation system and parts \n2.9. References (fertilizer and pesticide manual/ catalogue, \nprotocols, field guides, etc.)\n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Direct Observation \n3.2. Demonstration \n3.3. Oral interview and/or written test \n3.4. Third party report\n4.Context of Assessment\n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center \nin a simulated workplace setting.\n",
