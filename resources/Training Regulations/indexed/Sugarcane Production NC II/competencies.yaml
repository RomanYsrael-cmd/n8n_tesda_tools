        "source_text": "AFF 611312\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to manage the growth and development of\nsugarcane in the plant crop. It also includes competencies\nto perform cultivation, apply pest control measure, apply\nfertilizer, carry out irrigation and drainage activities and\nmanage ratoon.\n\n--- PDF PAGE 53 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n49\n• Cost of cultivation\n• List of land\npreparation\nmachineries\navailable and\nname of service\nprovider.\n• Schedule of\ncultivation\n• Safety signage\n• Safety precautions\n•\nOSHS\n2. Apply pest\ncontrol\nmeasure\n2.1. Pests’ incidence\nis monitored based\non prescribed\nprocedure.\n2.2. Tools and\nmaterials are\nprepared according\nto specific pest\ncontrol measures.\n2.3. Pest control\nmeasures are\nfollowed based on\nGAP and Fertilizer\nPesticide Authority\n(FPA) guidelines\n2.4. Safety measures\nare observed and\npracticed according\nto Occupational\nHealth and Safety\n(OHS) procedures.\n• Pest identification\ntechniques\n• Pest monitoring\ntechniques\n• Uses and functions\nof tools and\nequipment \n• Preparations of\nmaterials, tools\nand equipment\n• Pests\nmanagement\nstrategies \n• Types of pests\nmanagement\nstrategies\n• GAP\n• OSHS procedures\n• Signs and\nsymptoms of major\ndiseases and\ndamages due to\npests\n• Types of pests\n• Assessment of\npest\ninfestation/infection\nand incidence\n• Determination of\nnumber of\ntools/equipment to\nbe used\nCalibration of\nsprayer\n• Assessment of\ninfestation and\ndegree of damage\n• Computation of\nrates, dosages and\n• Illustrating major pests\nAssessing\ninfestation/infection/crop\ndamage due to pest\n• Preparing the materials,\ntools and equipment for\npesticide application \n• Estimating the number\nof tool/equipment to be\nused \n• Demonstrating the\ncalibration of sprayer\n• Operating sprayers\n• Employing pesticide\napplication\n• Preparing report on\ninfestation/disease\nincidence of selected\nfields \n• Demonstrating storage,\nhandling, and disposal\nof pesticides and used\ncontainers\n• Practicing personal\nhygiene and safety\nmeasures related to\npesticide application\n\n--- PDF PAGE 54 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n50\namount of\npesticides\n• Record/Report\npest monitoring\n• Labels and\ndirections for use\nof chemicals\n• Report on\ninfestation and\ndegree of damage,\ncontrol measures\nand results\n• Mode of spread\n• Follow prescribe\nmonitoring\nprocedures\n• Safety precautions\n• Hazards to human,\nenvironment and\nnon-target\norganisms due to\npesticides\n• OSHS, FPA &\nGAP relating to\npest’s\nmanagement\nstrategies\n3. Apply\nfertilizer\n3.1 Tools and\nmaterials are\nprepared according\nto prescribed\nuser’s manual\n3.2 Fertilizer rate is\ndetermined based\non the result of soil\nanalysis.\n3.3 Fertilizers are\nselected based on\ncosting and\navailability in the\nmarket\n3.4 Method of\nfertilizer\napplication is\nemployed based\non crop\nrequirements.\n3.5 Precautionary\nmeasures are\napplied to avoid\ncross\ncontamination\nbased on GAP.\n• Fertilizer\nrecommendation\n• Selection\nprocedures of\nfertilizers\n• Uses of tools and\nequipment\n• Fertilizer\napplication\nmethods\n• GAP\n• Monitoring\nprocedures\n• Nutrient analysis of\nfertilizer material\nTypes and grades\nof fertilizers\n• Types of tools and\nequipment used in\nfertilizer application\n• Soil Science on\neffect of fertilizer\napplication\n• Sugarcane\nagronomy\n• Estimating fertilizer\napplication rate\n• Selecting the cheapest\nfertilizer combination\nthat will satisfy the\nrecommended rate\nRecording fertilizer\nexpenditures\n• Demonstrating pre-\noperation procedure for\nFarm Animal-Drawn\napplicator\n• Estimating the number\nof tools and equipment\nneeded for fertilizer\napplication\n• Preparing tools and\nother equipment\n• Operating animal-drawn\nfertilizer applicator\n• Demonstrating manual\nfertilizer application\n• Demonstrating\noperation of a fertigation\nsystem\n\n--- PDF PAGE 55 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n51\n3.6 Safety procedures\nare followed\naccording to\nOccupational\nSafety and Health\nStandards\n\n• (soil and plant\nnutrition)\n• Rate of fertilizer\n• Cost of fertilizers\n• Number of tools\nand equipment\nrequired\n• Cost of fertilizer\napplication\n• Records of\nfertilizer costs\n• Instruction on\nproper fertilizer\napplication\n• OSHS, FPA &\nGAP relating to\nfertilizer application\n• Relevant local laws\nand regulations\n• Availability in the\nmarket\n• Health hazards\ndue to chemical\nfertilizer\n• Environmental\neffect due to\nchemical fertilizer\n(contamination)\n•\nEstimating the cost of\nfertilizer application\n•\nRecording fertilizer\napplication cost\n•\nMonitoring fertilizer\napplication\n•\nDemonstrating proper\nwearing of PPE\n4. Carry out\nirrigation\nand\ndrainage\nactivities\n4.1. Soil moisture\ncontent is\ndetermined based\non soil field capacity\n4.2. Watering/irrigation\nis performed\nfollowing the Good\nAgricultural\nPractices (GAP).\n4.3. Watering/irrigation\nfacilities are\nmaintained based\non industry standard\n4.4. Drainage canal is\nconstructed and\nmaintained based\non established\nprocedures.\n\n• Soil sample\ncollection\ntechniques \n• Soil moisture\nindicators\n• Irrigation\ntechniques and\nprocedures\n• Procedures in\nmaintaining\nirrigation facilities\n• Procedures in\nconstruction and\nmaintenance of\ndrainage canals \n• Monitoring\nprocedures\n• Soil moisture\ncontent\n• Weather data\n• Soil, water and\nplant relationship\n• Demonstrating the\nmanual method of\ndetermining soil\nmoisture \n• Using soil moisture\ntester \n• Illustrating a layout of\nan irrigation system\n• Layouting an irrigation\nsystem\n• Demonstrating proper\noperation of an\nirrigation system\n• Estimating