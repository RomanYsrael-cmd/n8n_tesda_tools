        "source_title": "ESTABLISH SUGARCANE NURSERY",
        "source_text": "--- PDF PAGE 33 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n29 \n \n \nCORE COMPETENCY \nUNIT OF COMPETENCY : \nESTABLISH SUGARCANE NURSERY \nUNIT CODE \n: \nAFF611310 \nUNIT DESCRIPTOR    \n: \nThis unit covers the knowledge and skills    required to select \nsugarcane nursery site and perform nursery operations including \npreparation and handling of planting materials, land preparation, \nplanting and replanting, crop care, and cutback operation (stalk \ncutting). This includes both the formal and non-formal nursery \noperations.\n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n  REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Select nursery \nsite \n1.1 Site inspection is \nconducted based \non established \nfarm practices. \n1.2 Soil samples are \ngathered for \nlaboratory analysis \nin   accordance \nwith standard \nprocedures. \n1.3 Selected site is \nsecured based on \nnursery \nrequirements. \n \n Site selections \no Topography \no Site inspection \nprocedures \n Nursery site \nrequirements (land \narea, drainage and \nwater source) \n Land area \nmeasurement \n Preparation of site \ninspection report \n Soil sample collection \nprocedure \n Correct amount of soil \nsample \n Location of soil \nsamples \n Crops planted \n Soil moisture \n Proper labeling \n Handling soil sample \nfor analysis \n Soil nutrients \n Calculation of soil \nsamples collected \n Sample label \n OSHS practices \n Nursery site securing \nprocedures\n \nMeasuring area using \nstaking method \n \nConducting site \ninspection \n \nPreparing inspection \nreport \n \nIdentifying soil type \n \nCollecting soil samples \n \nPacking and labeling soil \nsamples \n \nTransporting soil \nsamples to the \nlaboratory \n \nPreparing securing \nmaterials \n \nPreparing bill of \nmaterials \n \nSecuring nursery site\n\n--- PDF PAGE 34 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n30 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n  REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Types of site securing \nmaterials (fences, \nsignage) \n Cost estimation for \nsecuring materials \n Measurement of \nsecuring materials \nand farm perimeters \nBill of materials\n2. Prepare \nnursery tools \nand farm \nimplements \n2.1 Tools, farm \nimplements and \nequipment are \nprepared according \nto work \nrequirements. \n2.2 Basic pre-operative \nchecking of tools \nand farm \nimplements is \nperformed in \naccordance with \nmanufacturer’s \nmanual and GAP \nstandard. \n2.3 Worn-out and \ncorroded are \nsegregated and \ntreated according to \nmaintenance plan \nand procedures. \n Types of farm tools, \nimplements and \nequipment \n Selection procedure \n Handling of tools, \nfarm implements and \nequipment \n Cost estimates for \ntools, farm \nimplements and \nequipment \n Canvass report and \nbill of materials \n OSHS practices \n Procedures for \npreoperative checking \n Calibration of \nequipment \n Checklist report \n OSHS practices  \n GAP \n Procedure for \ndetermining worn-out \nand corrosions in \ntools \n Segregation and \ntreatment of damaged \ngoods \n Handling of worn out \nand corroded tools \n Cost estimate for \ntreatment and \nmaintenance of worn \nout and corroded \ntools \n Inspection report and \nrecommendation \nMaintenance plan\n Selecting tools and \nimplements \n Checking and calibrating \ntools and equipment \n Preparing inspection \nreport and \nrecommendation \no Preparing checklist \nreport \n Wearing PPEs \n Segregating worn out \nand corroded tools \n Performing preventive \nmaintenance/minor \nrepairs/trouble shooting\n\n--- PDF PAGE 35 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n31 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n  REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Waste Management \nAct \n Risks and hazard in \nsegregation and \nhandling corroded \ntools  \nOSH Standards \n3. Secure \nplanting \nmaterials \n3.1 Planting \nmaterials are \nobtained from \nreliable sources \n3.2 Planting materials \nare handled \nfollowing \nprescribed \nprocedure. \n3.3 Planting materials \nare treated \nfollowing standard \nprotocol. \n3.4 Planting materials \nare determined \naccording to kinds, \nvarieties and \nadaptability in the \ndistrict. \n3.5 Quality planting \nmaterials are \nselected according \nto prescribed \ncharacteristics. \n Released \nrecommended \nvarieties \n Kinds of planting \nmaterials \n Sugarcane varieties  \n Morphological and \nagronomic \ncharacteristics \n Characteristics of \ngood planting \nmaterials \n Print materials of \nadaptable varieties \nand planting materials\n Protocol in obtaining \nplanting materials \n Estimation of quantity \nof planting materials \n Email or written \nrequest \n Filling-up Client \nSatisfaction \n Report form from \ngovernment offices \n Telephone \nconversation \n Procedures in \nhandling planting \nmaterials \n Care of planting \nmaterials \n Procedure for \nselection \n Characteristics of \nhigh quality planting \nmaterials \n OSHS practices \n GAP \n Sourcing information of \nadaptable varieties from \nresearch stations and \nprint materials \n Preparing simple letter \nof request \n Estimating quantity and \ncosting planting \nmaterials to be obtained\n Obtaining planting \nmaterials \n Filling-up client \nsatisfaction report \n Handling planting \nmaterials from receipt to \nnursery site \n Selecting good quality \nplanting materials \n Wearing PPEs \n Practicing GAP in \nselecting quality \nplanting materials \n Measuring and \npreparing treatment \nsolution \n Handling chemicals \n Treating planting \nmaterials\n\n--- PDF PAGE 36 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n32 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n  REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Procedure for \nchemical treatment \nand soaking in water \n Control of pests and \ndiseases \n Incubation of treated \nplanting materials \n Computation \nmeasuring dosages \n Cost estimate of \nchemicals \nBill of materials\n4. Set up \nnursery \n4.1. Lay-outing is \nconducted in \naccordance with \nplanting \nrequirements. \n4.2. Land preparation \nis performed in \naccordance with \nestablished farm \nprocedures. \n4.3. Planting materials \nare planted \naccording to \nrecommended \nplanting \nprocedures.  \n4.4. Mechanized farm \nservices are \nsourced according \nto work \nrequirement. \n4.5. Planting activities \nare conducted \nbased on farm \nplan. \n Procedure for lay-\nouting \n Design of lay-out \n Area measurement \n Nursery lay-out and \ninterpretation \n Procedure for proper \nland preparation and \nliming if required \n Soil type and \ncondition \n Cost estimates for \nland preparation, \nliming and organic \namendments \napplication \n Carbon monoxide \nemission \n GAP \n Procedure for planting \nand basal fertilization \n Methods of planting \n Varietal \ncharacteristics \n Fertilizer requirement \nbased on soil analysis\n Calculation of planting \ndensity \n Computation of basal \nfertilizer requirement \n Record planting \nactivities \n Fertilizer residues/ \ncontamination of \nwaterways\n Performing lay-outing \nactivities \n Measuring area \n Applying required \nmaterials (lime, organic \namendments) based on \nsoil analysis \n Preparing land \n Demonstrating proper \nplanting of cane point \nusing different \nrecommended planting \npractices \n Applying properly basal \nfertilizer \n Canvassing or survey \nmechanized service \nproviders and their costs \n Sourcing mechanized \nfarm services\n\n--- PDF PAGE 37 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n33 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n  REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Farm mechanization \n Cost estimates of \nmechanized farm \nservices \n Report of canvass  \n Carbon monoxide \nemission from burned \nfuel \n Clean Air Act \n5. Maintain \nnursery \n5.1 Replanting is \nperformed as \nrequired following \nestablished farm \npractices. \n5.2 Cultural \npractices/activitie\ns for nursery \nmaintenance the \ndistrict are carried \nout according to \nestablished farm \npractices.   \n5.3 Pests and \ndiseases are \nmonitored \naccording to GAP. \n5.4 Control measures \nare applied \naccording to GAP. \n5.5 Safety \nprecautionary \nmeasures are \npracticed \naccording to \nOSHS. \n Procedure for \nreplanting and \nirrigation \n Soil and weather \ncondition \n Estimation of percent \ngermination \n Estimation of \nreplanting cost \n Estimation of \nirrigation cost \n Hazard from use of \ncutting and digging \ntools  \n OSH Standards \n Procedure of cultural \npractices/activities \n Sugarcane agronomy \no Nutrition \no Pest Control \no Irrigation and \ndrainage  \n Cost Estimation \no Fertilizer \ncomputation \no Calculate \nduration and \nfrequency of \nirrigation \n Carbon monoxide \nemission \n Fertilizer \ncontamination \n Procedure on GAP \n Pests and diseases \nof sugarcane \n Percent infection/ \ninfestation  \n Performing replanting for \nmissing hills \n Performing irrigation \n Performing cultural \npractices for nursery \nmaintenance \n Estimating cost of \nnursery maintenance \n Conducting damage \nassessment and \nmonitoring \n Performing control \nmeasures \n Wearing PPEs \n Disposing wastes \n Estimating chemical \ndosages \n Practicing safety \nprecautionary measures \nrelating to nursery \nmaintenance\n\n--- PDF PAGE 38 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n34 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n  REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n Calculation of \ndamage \n Incidence report \n Control measures of \npests and diseases of \nsugarcane \n Computation and \nmeasuring dosages \n Cost estimate of \nchemicals and \nbiocontrol agents and \ntheir application \n Proper application of \nchemicals and \ndisposal of used \ncontainers \n Proper storage of \npesticides \n Procedures on safety \nprecautionary \nmeasures \n OSHS Practices on \nmaintenance of \nnursery \n6. Harvest \nplanting \nmaterials \n6.1 Tools are used in \naccordance to \nprescribed \nprocedures \n6.2 Age of canes at \ncutback is \ndetermined based \non farm plan. \n6.3 Stalks are cut \nfollowing \nestablished cutting \ntechniques. \n6.4 Planting materials \nare handled in \naccordance with \nthe prescribed \nprocedures \n6.5 Work safety \nmeasures are \nobserved following \nOSHS \n Preparation of \nharvesting tools \n Sugarcane agronomy \n Computation of \nvolume of planting \nmaterials to be \nproduced \n Production report \n Hazard from use of \ncutting tools and \nexposure to snake \nand insect bites \n Procedure on age \ndetermination for \ncutback \n Computation of \naverage number of \ncane points per stalk \n Procedure on cane \ncutting \n OSHS Standards on \nharvesting \n \nFilling up production \ndata form  \n \nPreparing harvesting \ntools \n \nChecking the \nappearance of the canes \nfor cut back visually \n \nEstimating the average \nnumber of cane per \nhectare \n \nPerforming the \nappropriate cutting \nmethod \n \nHandling of planting \nmaterials \n \nPracticing OSHS\n\n--- PDF PAGE 39 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n35 \nRANGE OF VARIABLES \n \n \nVARIABLE  \nRANGE \n1. Site inspection \nSite inspection includes: \n1.1 \nSite visitation \n1.2 \nVerifying size of the area \n1.3 \nVerifying presence of nursery farm requirements \n2. Nursery requirements \nNursery requirements include:  \n2.1 Water source \n2.2 Topography \n2.3 Drainage \n2.4 Soil type \n2.5 Accessibility (transport) \n2.6 Distance to the proposed or existing sugarcane \nplantation site \n2.7 Demand of planting materials \n3. Tools, farm implements and \nequipment \nTools, farm implements and equipment may include, \nbut not limited to: \n3.1. Tools: \n3.1.1 Digging tools \n3.1.2 Cane cutting tools \n3.1.3 Measuring tools \n3.1.4 Soil auger \n3.1.5 Cane knife \n3.1.6 Ruler \n3.2. Farm implements and equipment: \n3.2.1 Water pumps  \n3.2.2 Sub-soiler/Ripper \n3.2.3 Plow (Disc/Moldboard) \n3.2.4 Disc harrow \n3.2.5 Furrower \n3.2.6 Leveler/grader \n3.2.7 Mechanical planter \n3.2.8 Cultivators/Weeder/cut-away/inter-row \n3.2.9 Trash rake \n3.2.10 Irrigation system and parts \n3.2.11 Fertilizer/lime applicator \n3.2.12 Shredder/Mulcher \n3.2.13 Trailer \n3.2.14 Sprayer \n3.2.15 Standing manual rain gauge \n3.2.16 Tractors  \n3.2.17 Hauling trucks \n3.2.18 Bull carts \n3.2.19 Carabao\n\n--- PDF PAGE 40 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n36 \nVARIABLE  \nRANGE \n4.  Planting materials \nPlanting materials include:  \n4.1. Cane points (cutback/top points) \n4.2. Micro-propagated plantlets \n4.3. Replanting materials – chipped tillers, Pre-  \n        germinated single-eye cane point \n4.4. Whole stalk\n5. Reliable sources \nReliable sources include: \n5.1 Nurseries \n5.2 Mill District Development Council (MDDC) \nNurseries \n5.3 Micro-propagation facilities \n5.4 Progressive farms\n6. Treatment of planting \nmaterials \nTreatment includes the following: \n6.1. Physical \n6.2. Chemical\n7. Quality planting materials  \nCharacteristics of quality planting materials: \n7.1  Damage-free \n7.2 Viable-two to three eye cutting \n7.3 Pure \n7.4 Pest and disease-free  \n7.5 Diameter \n7.6 Length of internodes \n7.7 Age of canes\n8. Planting requirements \nPlanting requirements include the following: \n8.1. Furrow distance \n8.2. Density \n8.3. Planting pattern \n8.4. Depth of planting\n9. Land preparation \nLand preparation includes the following: \n9.1. Clearing \n9.2. Sub-soiling \n9.3. Plowing \n9.4. Harrowing \n9.5. Furrowing \n9.6. Levelling\n10. Planting procedures \nPlanting procedures includes: \n10.1. Dry season \n10.1.1 Soaking of cane points \n10.1.2 Incubation of cane points \n10.1.3 Parallel position \n10.2. Wet season \n10.2.1 Slanting position\n11. Cultural practices/activities \nfor nursery maintenance \nCultural practices / activities for nursery \nmaintenance include:  \n11.1. Weeding/cultivation \n11.1.1 Strip weeding \n11.1.2 Inter-row/general weeding\n\n--- PDF PAGE 41 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n37 \nVARIABLE  \nRANGE \n11.1.3 Blanket weeding \n11.1.4 Application of herbicides \n11.2. Construction of drainage canals \n11.3. Application of fertilize \n11.3.1 Organic or compost \n11.3.2 Inorganic/chemicals/synthetics \n11.4. Irrigation\n12. Handling of planting \nmaterials \n12.1. Presence of leaf sheath \n12.2. Cover planting materials to maintain  \n     moisture \n12.3. Immediate delivery of planting materials to  \n     plant site \n12.4. Bagging/tying of planting materials\n13. Safety measures \n13.1. Wearing of PPE \n13.2. Handling of tools \n13.3. Following instructions of manual in equipment \noperation \n13.4. Awareness and control of various hazards of the \noperation\n\n--- PDF PAGE 42 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n38 \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Selected nursery site \n1.2. Prepared nursery tools and farm implements  \n1.3. Secured planting materials \n1.4. Set-up nursery \n1.5. Maintained nursery \n1.6. Harvested planting materials \n1.7. Performed measurement/computation of area and \nnumber of canepoints for planting and for harvest\n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Shed \n2.2. Writing instruments \n2.3. Nursery tools/ implements/ equipment \n2.4. Nursery supplies \n2.5. Logbooks \n2.6. Irrigation system and parts \n2.7. References (NSIC catalogue, GAP, OSHS, HACCP \nmanuals, etc.) \n2.8. Tools and farm implements use in clearing and land \npreparation \n2.9. PPE \n2.10. Planting materials \n2.11. Fertilizers/other chemicals \n2.12.Polybags\n3 Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Direct Observation and questioning \n3.2 Demonstration \n3.3 Oral interview and written test \n3.4\nThird party report\n4 Context of \nAssessment \nCompetency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n",
