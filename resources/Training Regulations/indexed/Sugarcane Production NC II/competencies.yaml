        "source_text": "500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory and organizational requirements for\noccupational health and safety.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify hazards and\nrisks\n1.1 Safety regulations\nand workplace safety\nand hazard control\npractices and\nprocedures are\nclarified and\nexplained based on\norganization\nprocedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding\nindicators are\nidentified to minimize\nor eliminate risk to\nco-workers,\nworkplace and\nenvironment in\naccordance with\norganization\nprocedures\n1.3 Contingency\nmeasures during\nworkplace accidents,\nfire and other\nemergencies are\nrecognized and\nestablished in\naccordance with\norganization\nprocedures\n•\nOHS procedures\nand practices and\nregulations\n•\nPersonal hygiene\npractices\n•\nHazards/risks\nidentification and\ncontrol\n•\nOrganization\nsafety and health\nprotocol\n•\nSafety\nconsciousness\n•\nHealth\nconsciousness\n•\nPractice of\npersonal hygiene\n•\nHazards/risks\nidentification and\ncontrol skills\n•\nInterpersonal skills\n•\nCommunication\nskills\n\n--- PDF PAGE 20 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Evaluate hazards\nand risks\n2.1 Terms of maximum\ntolerable limits which\nwhen exceeded will\nresult in harm or\ndamage are\nidentified based on\nthreshold limit values\n(TLV)\n2.2 Effects of the\nhazards are\ndetermined\n2.3 OHS issues and/or\nconcerns and\nidentified safety\nhazards are reported\nto designated\npersonnel in\naccordance with\nworkplace\nrequirements and\nrelevant workplace\nOHS legislation\n•\nOHS procedures\nand practices and\nregulations\n•\nPersonal hygiene\npractices\n•\nHazards/risks\nidentification and\ncontrol\n•\nThreshold Limit\nValue -TLV\n•\nOHS indicators\n•\nOrganization\nsafety and health\nprotocol\n•\nSafety\nconsciousness\n•\nHealth\nconsciousness\n•\nPractice of\npersonal hygiene\n•\nHazards/risks\nidentification and\ncontrol skills\n•\nInterpersonal skills\n•\nCommunication\nskills\n3. Control hazards and\nrisks\n3.1 Occupational Health\nand Safety (OHS)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace are\nconsistently followed\n3.2 Procedures for\ndealing with\nworkplace accidents,\nfire and emergencies\nare followed in\naccordance with\norganization OHS\npolicies\n3.3 Personal protective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OHS\nprocedures and\npractices\n3.4 Appropriate\nassistance is\nprovided in the event\n•\nOHS procedures\nand practices and\nregulations\n•\nPPE types and\nuses\n•\nPersonal hygiene\npractices\n•\nHazards/risks\nidentification and\ncontrol\n•\nOHS indicators\n•\nOrganization\nsafety and health\nprotocol\n•\nSafety\nconsciousness\n•\nHealth\nconsciousness\n•\nPractice of\npersonal hygiene\n•\nHazards/risks\nidentification and\ncontrol skills\n•\nInterpersonal skills\n•\nCommunication\nskills\n\n--- PDF PAGE 21 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n17\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nof a workplace\nemergency in\naccordance with\nestablished\norganization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related\ndrills and trainings\nare participated in as\nper established\norganization\nguidelines and\nprocedures\n4.2 OHS personal\nrecords are\ncompleted and\nupdated in\naccordance with\nworkplace\nrequirements\n\n•\nOHS procedures\nand practices and\nregulations\n•\nPPE types and\nuses\n•\nPersonal hygiene\npractices\n•\nOHS indicators\n•\nOrganization\nsafety and health\nprotocol\n•\nSafety\nconsciousness\n•\nHealth\nconsciousness\n•\nPractice of\npersonal hygiene\n•\nInterpersonal skills\n•\nCommunication\nskills\n\n--- PDF PAGE 22 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2 Biological hazards - bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n5. Emergency-related\ndrills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n--- PDF PAGE 23 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n19\nVARIABLE\nRANGE\n6. OHS personal records 6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Resource\nImplications\n The following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\n Competency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 24 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n20\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY MEASURES IN FARM OPERATIONS\n\nUNIT CODE\n:"
