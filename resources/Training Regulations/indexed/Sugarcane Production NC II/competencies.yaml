        "source_title": "USE FARM TOOLS AND EQUIPMENT",
        "source_text": "--- PDF PAGE 28 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n24 \nUNIT OF COMPETENCY \n:    USE FARM TOOLS AND EQUIPMENT \n \nUNIT CODE                 \n:    AGR 321202 \n \nUNIT DESCRIPTOR         \n:   This unit covers the knowledge, skills and attitudes \nrequired to use farm tools and equipment. It includes \nselection, operation and preventive maintenance of farm \ntools and equipment. \n \nLEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Select and use \nfarm tools \n \n1.1 Appropriate farm \ntools are identified \naccording to \nrequirement/use \n1.2 Farm tools are \nchecked for faults \nand defective \ntools reported in \naccordance with \nfarm procedures \n1.3 Appropriate tools \nare safely used \naccording to job \nrequirements and \nmanufacturers \nconditions\n \nTypes and uses of \nfarm tools  \n \nCharacteristics of \nfunctional tools \n \nChecking tools for \ndefects/faults \n \nSegregation and \nreporting defective \ntools  \n \nUses of tools  \n \nIdentifying farm tools \nfor the work \n \nChecking the \nconditions of tools \n \nReporting defective \ntools \n \nUsing tools  \n2. \nSelect and \noperate farm \nequipment \n2.1 Identify \nappropriate farm \nequipment \n2.2 Instructional \nmanual of the \nfarm tools and \nequipment are \ncarefully read \nprior to operation \n2.3 Pre-operation \ncheck-up is \nconducted in line \nwith \nmanufacturers \nmanual \n2.4 Faults in farm \nequipment are \nidentified and \nreported in line \nwith farm \nprocedures\n \nTypes and \noperations of farm \nequipment  \n \nStandards operating \nprocedures of farm \nequipment \n \nInstructional manual \nof equipment \n \nPre-operation check-\nup \n \nEquipment \nSpecification \n \nProcedures in \ncalibrating and use \nof equipment  \n \nEquipment faults \nidentification and \nreporting \n \nOperation of \nequipment \n \nIdentifying \nappropriate farm \nequipment for the \nwork \n \nReading \ninstructional manual. \n \nConducting pre-\noperation check-up \n \n2.4Identifying \nfaults/defects of farm \nequipment \n \nReporting on \ndefective farm \nequipment \n \nOperating farm \nequipment \n \nFollowing safety \nprocedures.\n\n--- PDF PAGE 29 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n25 \nLEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.5 Farm equipment \nis used according \nto its function \n2.6 Safety procedures \nare followed. \n \nCodes and \nRegulations on \nenvironmental \nprotection  \n \nSafety and keeping \nof equipment every \nafter use \n\nSafety measures\n3. Perform \npreventive \nmaintenance \n3.1 Tools and \nequipment are \ncleaned \nimmediately after \nuse in line with \nfarm procedures \n3.2 Routine check-up \nand maintenance \nare performed \n3.3 Tools and \nequipment are \nstored in \ndesignated areas \nin line with farm \nprocedures\n \nCleaning procedures \nof tools and \nequipment \n \nMaintenance \nprocedures of farm \nequipment  \n \nStorage of tools and \nequipment \n \nDesignated storage \nareas \n \n \nCleaning tools and \nequipment \n \nPerforming routinely \ncheck-up of tools \nand equipment \n \nMaintaining farm \nequipment \n \nStoring tools and \nequipment\n\n--- PDF PAGE 30 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n26 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Farm equipment \n \n1.1 Engine \n1.2 Pumps \n1.3 Generators \n1.4 Sprayers\n2. Farm tools \n2.1 Sickle \n2.2 Cutters \n2.3 Weighing scales \n2.4 Hand tools \n2.5 Measuring tools \n2.6 Garden tools\n3. Pre-operation check-up \n3.1 Tires \n3.2 Brake fluid \n3.3 Fuel \n3.4 Water \n3.5 Oil \n3.6 Lubricants \n3.7 Battery\n \nEVIDENCE GUIDE \n \n \n1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Correctly identified appropriate farm tools and equipment \n1.2 Operated farm equipment according to manual \nspecification  \n1.3 Performed preventive maintenance \n2. \nResource \nImplications \n2.1 \nService/operational manual of farm tools and equipment \n2.2 \nTools and equipment \n2.3 \nFarm implements \n3. \nMethod of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1 Direct observation  \n3.2 Practical demonstration \n3.3 Third Party Report \n4. \nContext of \nAssessment \n4.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
