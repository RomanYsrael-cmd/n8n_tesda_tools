        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Selected nursery site\n1.2. Prepared nursery tools and farm implements\n1.3. Secured planting materials\n1.4. Set-up nursery\n1.5. Maintained nursery\n1.6. Harvested planting materials\n1.7. Performed measurement/computation of area and\nnumber of canepoints for planting and for harvest\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Shed\n2.2. Writing instruments\n2.3. Nursery tools/ implements/ equipment\n2.4. Nursery supplies\n2.5. Logbooks\n2.6. Irrigation system and parts\n2.7. References (NSIC catalogue, GAP, OSHS, HACCP\nmanuals, etc.)\n2.8. Tools and farm implements use in clearing and land\npreparation\n2.9. PPE\n2.10. Planting materials\n2.11. Fertilizers/other chemicals\n2.12.Polybags\n3 Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation and questioning\n3.2 Demonstration\n3.3 Oral interview and written test\n3.4\nThird party report\n4 Context of\nAssessment\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center in a\nsimulated workplace setting.\n\n--- PDF PAGE 43 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n39\n\nUNIT OF COMPETENCY\n:\nPLANT SUGARCANE CROP\nUNIT CODE\n:"
        },
        "source_text": "AFF611310\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to select\nsugarcane nursery site and perform nursery operations including\npreparation and handling of planting materials, land preparation,\nplanting and replanting, crop care, and cutback operation (stalk\ncutting). This includes both the formal and non-formal nursery\noperations.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n REQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Select nursery\nsite\n1.1 Site inspection is\nconducted based\non established\nfarm practices.\n1.2 Soil samples are\ngathered for\nlaboratory analysis\nin accordance\nwith standard\nprocedures.\n1.3 Selected site is\nsecured based on\nnursery\nrequirements.\n\n• Site selections\no Topography\no Site inspection\nprocedures\n• Nursery site\nrequirements (land\narea, drainage and\nwater source)\n• Land area\nmeasurement\n• Preparation of site\ninspection report\n• Soil sample collection\nprocedure\n• Correct amount of soil\nsample\n• Location of soil\nsamples\n• Crops planted\n• Soil moisture\n• Proper labeling\n• Handling soil sample\nfor analysis\n• Soil nutrients\n• Calculation of soil\nsamples collected\n• Sample label\n• OSHS practices\n• Nursery site securing\nprocedures\n•\nMeasuring area using\nstaking method\n•\nConducting site\ninspection\n•\nPreparing inspection\nreport\n•\nIdentifying soil type\n•\nCollecting soil samples\n•\nPacking and labeling soil\nsamples\n•\nTransporting soil\nsamples to the\nlaboratory\n•\nPreparing securing\nmaterials\n•\nPreparing bill of\nmaterials\n•\nSecuring nursery site\n\n--- PDF PAGE 34 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n30\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n REQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Types of site securing\nmaterials (fences,\nsignage)\n• Cost estimation for\nsecuring materials\n• Measurement of\nsecuring materials\nand farm perimeters\n•Bill of materials\n2. Prepare\nnursery tools\nand farm\nimplements\n2.1 Tools, farm\nimplements and\nequipment are\nprepared according\nto work\nrequirements.\n2.2 Basic pre-operative\nchecking of tools\nand farm\nimplements is\nperformed in\naccordance with\nmanufacturer’s\nmanual and GAP\nstandard.\n2.3 Worn-out and\ncorroded are\nsegregated and\ntreated according to\nmaintenance plan\nand procedures.\n• Types of farm tools,\nimplements and\nequipment\n• Selection procedure\n• Handling of tools,\nfarm implements and\nequipment\n• Cost estimates for\ntools, farm\nimplements and\nequipment\n• Canvass report and\nbill of materials\n• OSHS practices\n• Procedures for\npreoperative checking\n• Calibration of\nequipment\n• Checklist report\n• OSHS practices\n• GAP\n• Procedure for\ndetermining worn-out\nand corrosions in\ntools\n• Segregation and\ntreatment of damaged\ngoods\n• Handling of worn out\nand corroded tools\n• Cost estimate for\ntreatment and\nmaintenance of worn\nout and corroded\ntools\n• Inspection report and\nrecommendation\n•Maintenance plan\n• Selecting tools and\nimplements\n• Checking and calibrating\ntools and equipment\n• Preparing inspection\nreport and\nrecommendation\no Preparing checklist\nreport\n• Wearing PPEs\n• Segregating worn out\nand corroded tools\n• Performing preventive\nmaintenance/minor\nrepairs/trouble shooting\n\n--- PDF PAGE 35 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n31\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n REQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Waste Management\nAct\n• Risks and hazard in\nsegregation and\nhandling corroded\ntools\n•OSH Standards\n3. Secure\nplanting\nmaterials\n3.1 Planting\nmaterials are\nobtained from\nreliable sources\n3.2 Planting materials\nare handled\nfollowing\nprescribed\nprocedure.\n3.3 Planting materials\nare treated\nfollowing stan