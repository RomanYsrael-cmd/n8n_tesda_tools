        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Performed pre – harvest operations\n1.2 Performed harvesting activity\n1.3 Performed postharvest operation\n1.4 Employed proper cutting techniques\n2.\nResource\nImplications\nThe following resources should be provided:\n2.1 Tools and equipment appropriate for cane harvesting\nand postharvest handling of canes\n2.2 Writing instruments\n2.3 Logbooks\n2.4 References (catalogue, protocols, field guides, GAP,\nOHSS manuals)\n3. Method of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct observation and questioning\n3.2 Demonstration (simulated)\n3.3 Oral interview and written test\n3.4 Third party report\n4.\nContext of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center in\na simulated workplace setting.\n\n--- PDF PAGE 65 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n61"
        },
        "source_text": "AFF 611313\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform manual harvest operations and\npostharvest handling of canes. This unit also includes\nproper use of tools and equipment required to perform\nthe activities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform pre –\nharvest\noperations\n1.1\nCane samples\nare gathered\nand analyzed\nusing\nrefractometer.\n1.2\nCrop maturity is\nidentified\naccording to\nparameters\naffecting\nphysiological\ngrowth and\nphysical\nindicators.\n1.3\nRecords of crop\nagronomic\nhistory are\nverified and\nreferenced for\nmaturity.\n1.4\nHarvesting\ntools,\nmaterials, and\nmachines and\nequipment are\nprepared\naccording to\nwork\nrequirements\n1.5\nHarvesting\nmachinery\nservices are\nsourced out\n• Methods of determining\ncrop maturity\n• Procedures in gathering\nstalk samples\n• Procedure in using the\nbrix refractometer\n• Appropriate harvesting\ntools and equipment\n• Uses and functions of\nharvesting tools and\nequipment\n• Mechanical harvesting\n• Type and uses of\nharvesting machineries\n• Cane sampling\n• Physiologic and\nmorphological indicators\nof maturity\n• Sugarcane agronomy\n(cane maturity)\n• Laboratory analysis of\nsupplies\n• Maintenance of\nharvesting tools and\nequipment\n• Requirement for\nmechanized harvesting\n• Chronological age of\nsugarcane\n• Examining the\nmorphological\ncharacteristics of a\nmature sugarcane\nplan\n• Demonstrating\nproper juice\nextraction and\ndetermination of brix\nby using hand\nrefractometer\n• Demonstrating\nproper maintenance\nand repair of\nharvesting tools\n• Estimating cost of\nacquisition, rent,\nrepair and\nmaintenance of\ntools, materials and\nmachineries\n• Estimating quantity\nof harvest relating to\ncapacity of\nharvesting\nmachinery\n• Demonstrating\nnegotiation with\n\n--- PDF PAGE 61 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n57\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nfollowing farm\nplan.\n1.6\nCane cutters\nare sourced out\nfollowing farm\nplan.\n1.7\nRecords\nregarding crops\nto be harvested\nare checked\naccording to\nfarm\nprocedures\n• Brix readings from hand\nrefractometer\n• Costing of acquisition,\nrent, repair and\nmaintenance of tools,\nmaterials and\nequipment\n• Quantity of harvest\nrelating to capacity of\nharvesting equipment\n• Cost estimation of\nmechanized and\nmanual harvesting\n• Estimation of cane\ntonnage\n• Brix data recording\n• Specifications of\nharvesting equipment\nand tools\n• Canvass report\n• Production record\n• Mill reports\n• Farm record\n• Safety in using\nharvesting tools and\njuice extractor\n• OSH standards\nservice provider and\nsupplier\n• Preparing a canvass\nreport\n• Estimating\nharvesting capacity\n• Conducting crop\nestimation\n• Preparing a service\ncontract\n• Writing a cost\nestimation for\nmanual harvesting\nWriting a canvass\nreport\n• Negotiating with\ncane cutter service\nprovider\n• Preparing a\nsystematic farm\nrecord on harvest of\ncrop\nSecuring and\naccomplishing\nmill/trip ticket\n• Checking records on\nharvesting of crops\n2. Perform\nharvesting\nactivity\n2.1\nHarvesting\noperation is\nimplemented\nbased on\nrecommended\ncultural\npractices for\nsugarcane.\n2.2\nHarvesting is\nperformed while\nobserving GAP\nprinciples and\nOSHS.\n2.3\nHarvesting\ntechnique is\n• Monitoring procedures\n• Recommended\nharvesting practices\nbased on GAP and\nOSHS\n• Cutting technique\n• Cultural practices for\nharvesting operation\n• Harvesting tools\n• Sugarcane agronomy\n(harvesting)\n• Inventory of work\nperformance\n• Safety of harvesting\ntools\n• Monitoring harvesting\noperation\n• Demonstrating\nproper harvesting\noperations\n• Employing proper\ncutting technique\n• Practicing OSHS and\nGAP\n\n--- PDF PAGE 62 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n58\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nemployed\nfollowing\nstandard\nprocedures.\n\n• Exposure to snake and\ninsect bites\n• Burning canes\n• OSHS relating to\nharvesting\n• GAP relating to\nharvesting\n• Exposure to health and\nhazards\n3. Perform\npostharvest\noperation\n3.1 Canes are\nhandled\naccording to\nprescribed\npostharvest\npractices\n3.2 Delivery of canes\nis Monitoring the\nperformed\nfollowing industry\nstandards.\n3.3 Record keeping\nis done according\nto industry\nprocedures.\n• Prescribed post -harvest\nhandling practices\n• Monitoring procedures\nof delivery\n• Post-harvest practices\n• Sugarcane physiology\nrelating to post-harvest\n• Total daily cane delivery\n• Computation of farm\nproductivity\n• Record keeping\n• Report writing\n• Mill reports\n• Record of farm\nproductivity\n• Overloading of hauling\ntrucks (vertical and\nhorizontal clearance)\n• LTO regulations on\ncane transport - low\nlying electrical lines\n• Right of way\n• Milling schedules\n• 7S of good\nHousekeeping\n• OSHS & GAP relating to\npost harvesting\noperation\n• Demonstrating\nproper post-harvest\nhandling practices\n• Monitoring schedules\nof farm harvesting\nactivities based on\nnumber and duration\nof trips\n• Preparing a\nsystematic farm\nrecord on harvest of\ncrop\n• Computing farm\nproductivity based on\nmill reports\n• Securing and\naccomplishing\nmill/trip ticket\n• Demonstrating\nproper wearing of\nPPE\n\n--- PDF PAGE 63 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n59\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Physiological\ngrowth\n\nPhysiological growth includes the following:\n1.1 Uniform brix reading from the base, middle and top portions\nof sugarcane stalks\n1.2 Age of canes (date planted and expected date of harvest)\n2. Physical indicators\n\nPhysical indicators include the following:\n2.1. Uniform yellowing of leaves\n2.2. Shortening of top internodes\n2.3. Decreasing number of leaves (10 and less)\n2.4. Emergence of tassel (flowering)\n2.5. Shiny stalk\n3. Agronomic history\nAgronomic history includes the following:\n3.1 Nursery source\n3.2 Variety of plant\n3.3 Planting calendar\n3.3.1 Months after planting\n3.3.2 Age at flower induction\n3.3.3 Environmental condition before scheduled harvesting\n3.3.4 Date of last fertilization (fertilizer application)\n3.3.5 Date of last replanting\n4. Harvesting tools,\nmaterials, and\nmachines and\nequipment\nHarvesting tools, materials, and machines and equipment\nmay include the following:\n4.1 Tools\n4.1.1 Cane knives (espading, tabas)\n4.1.2 Sharpening stone\n4.1.3 Ladder\n4.2 Machines and equipment\n4.2.1 Mechanical harvester\n4.2.2 Trailers\n4.2.3 Hauling trucks\n4.2.4 Bull carts and carabao\n4.2.5 Cane loader\n4.3 Materials\n4.3.1 Binding materials\n4.3.2 Sling\n5. Records\nRecords include the following:\n5.1 Crop history\n5.2 Farm calendar\n5.3 Farm records\n5.4 Production reports (tons cane, bags sugar, subsidies,\nmolasses, planter share)\n5.5 Quedan\n5.6 Trucking allowance\n6. Cultural practices\nCultural practices include the following:\n6.1 No burning\n\n--- PDF PAGE 64 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n60\nVARIABLE\nRANGE\n6.2 Cutting close to the ground\n6.3 No trash (trash: part of cane with low and no sugar\ncontent)\n6.4 No pre-harvest topping\n7 Post-harvest\npractices\nPost-harvest practices include the following:\n7.1 Transporting harvested canes to the mill within 48 hours\n7.2 Delivery fresh and clean canes to the mill\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Performed pre – harvest operations\n1.2 Performed harvesting activity\n1.3 Performed postharvest operation\n1.4 Employed proper cutting techniques\n2.\nResource\nImplications\nThe following resources should be provided:\n2.1 Tools and equipment appropriate for cane harvesting\nand postharvest handling of canes\n2.2 Writing instruments\n2.3 Logbooks\n2.4 References (catalogue, protocols, field guides, GAP,\nOHSS manuals)\n3. Method of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct observation and questioning\n3.2 Demonstration (simulated)\n3.3 Oral interview and written test\n3.4 Third party report\n4.\nContext of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center in\na simulated workplace setting.\n\n--- PDF PAGE 65 ---\nTR – Sugarcane Production NC II (New) Promulgated December 16, 2015\n61"
