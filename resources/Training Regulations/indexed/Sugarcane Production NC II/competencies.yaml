          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in\ndesignated facilities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Farm location\n2.2 Tools, equipment and outfits appropriate in applying\nsafety measures\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Practical demonstration\n3.2Third Party Report\n4. Context of\nAssessment\n4.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 28 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n24\nUNIT OF COMPETENCY\n: USE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
        },
        "source_text": "AGR 321201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform safety measures effectively and\nefficiently. It includes identifying areas, tools, materials,\ntime and place in performing safety measures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nDetermine\nareas of\nconcern for\nsafety\nmeasures\n1.1\nWork tasks are\nidentified in line with\nfarm operations\n1.2\nPlace for safety\nmeasures are\ndetermined in line\nwith farm operations\n1.3\nTime for safety\nmeasures are\ndetermined in line\nwith farm operations\n1.4\nAppropriate tools,\nmaterials and\noutfits are prepared\nin line with job\nrequirements\n•\nDifferent work tasks\nin farm operations\n•\nPlace and time for\nimplementation of\nsafety measures\n•\nDifferent hazards in\nthe workplace\n•\nTypes of tools,\nmaterials and outfits\n•\nPreparation of tools,\nmaterials and outfits\n\n• Identifying work\ntasks in farm\noperations\n• Determining\nplace and time\nfor\nimplementation\nof safety\nmeasures\n• Reading labels,\nmanuals and\nother basic\nsafety\ninformation\n• Identifying\neffective/\nfunctional tools,\nmaterials and\noutfit\n• Preparing tools,\nmaterials and\noutfits\n• Discarding\ndefective tools,\nand materials\n2. Apply\nappropriate\nsafety\nmeasures\n2.1 Tools and materials are\nused according to\nspecifications and\nprocedures\n2.2 Outfits are worn\naccording to farm\nrequirements\n•\nUses and functions\nof tools\n•\nOutfits and how to\nwear it.\n•\nExpiration/shelf life\nof materials\n•\nProper disposal of\nexpired materials\n• Using tools and\nmaterials in the\nworkplace\n• Wearing of\noutfits\n• Observing\nexpiration/shelf\nlife of materials\n\n--- PDF PAGE 25 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n21\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3 Effectivity/shelf\nlife/expiration of\nmaterials are strictly\nobserved\n2.4 Emergency\nprocedures are known\nand followed to ensure\na safework requirement\n2.5 Hazards in the\nworkplace are identified\nand reported in line with\nfarm guidelines\n•\nEnvironmental rules\nand regulations\n•\nEmergency\nprocedures\n•\nHazards\nidentification and\nreporting\n•\nCommunication\nskills\n•\nOSHS\n\n• Disposing of\nexpired\nmaterials\n• Following\nemergency\nprocedures\n• Identifying and\nreporting of\nhazards in\nworkplace\narea.\n3.\nSafekeep\n/dispose\ntools,\nmaterials and\noutfit\n3.1 Used tools and outfit\nare cleaned after use\nand stored in\ndesignated areas.\n3.2 Unused materials are\nproperly labeled and\nstored according to\nmanufacturer’s\nrecommendation and\nfarm requirements.\n3.3 Waste materials are\ndisposed according to\nmanufacturers,\ngovernment and farm\nrequirements.\n•\nProcedures of\ncleaning used tools\nand outfits\n•\nLabel and storage\nunused materials\n•\nDisposal of wastes\nmaterials\n•\nManufacturers’\nrecommendation on\nkeeping materials\n•\nEnvironmental rules\nand regulations\n• Cleaning used\ntools and outfit\n• Labeling and\nstoring unused\nmaterials\n• Disposing\nwaste materials\n\n--- PDF PAGE 26 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the\nsubsectors:\n1.1 Crop Production\n1.2 Post-harvest\n1.3 Agri-marketing\n1.4\nFarm Equipment\n2. Place\n2.1 Stock room/storage areas/warehouse\n2.2\nField/farm/orchard\n3. Time\n3.1 Fertilizer and pesticides application\n3.2 Feed mixing and feeding\n3.3\nHarvesting and hauling\n4.\nTools, materials and\noutfits\n4.1 Tools\n4.1.1 Wrenches\n4.1.2 Screw driver\n4.1.3 Pliers\n4.2 Outfit\n4.2.1 Masks\n4.2.2 Gloves\n4.2.3 Boots\n4.2.4 Overall coats\n4.2.5 Hat\n4.2.6 Eye goggles\n5. Emergency procedures\n5.1 Location of first aid kit\n5.2 Evacuation\n5.3 Agencies contract\n5.4\nFarm emergency procedures\n6. Hazards\n6.1 Chemical\n6.2 Electrical\n6.3\nFalls\n\n--- PDF PAGE 27 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n23\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in\ndesignated facilities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Farm location\n2.2 Tools, equipment and outfits appropriate in applying\nsafety measures\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Practical demonstration\n3.2Third Party Report\n4. Context of\nAssessment\n4.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 28 ---\nTESDA-QSO-SOP-01-F08\nTR – Sugarcane Production NC II Promulgated December 16, 2015\n24\nUNIT OF COMPETENCY\n: USE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
