        "source_text": "--- PDF PAGE 7 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n3 \nSECTION 2 \nCOMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in SUGARCANE PRODUCTION NC II. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311105 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Obtain and convey\nworkplace \ninformation \n1.1 Specific and relevant \ninformation is accessed \nfrom appropriate sources  \n1.2 Effective questioning, \nactive listening and \nspeaking skills are used to \ngather and convey \ninformation \n1.3 Appropriate medium is \nused to transfer information \nand ideas \n1.4 Appropriate non- verbal \ncommunication is used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and colleagues \nare identified and followed \n1.6 Defined workplace \nprocedures for the location \nand storage of information \nare used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n Follow simple spoken \nlanguage \n Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n Participate in \nworkplace meetings \nand discussions \n Complete work \nrelated documents \n Estimate, calculate \nand record routine \nworkplace measures \n Ability to relate to \npeople of social range \nin the workplace \n Gather and provide \ninformation in \nresponse to \nworkplace \nrequirements\n\n--- PDF PAGE 8 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n4 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.  Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2 Own opinions are clearly \nexpressed and those of \nothers are listened to \nwithout interruption \n2.3 Meeting inputs are \nconsistent with the meeting \npurpose and established \nprotocols \n2.4 Workplace interactions \nare conducted in a \ncourteous manner  \n2.5 Questions about simple \nroutine workplace \nprocedures and matters \nconcerning working \nconditions of employment \nare asked and responded \nto \n2.6 Meetings outcomes are \ninterpreted and \nimplemented \n Effective \ncommunication \n Different modes \nof \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities  \n Follow simple \nspoken language \n Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n Participate in \nworkplace meetings \nand discussions \n Complete work \nrelated documents \n Estimate, calculate \nand record routine \nworkplace \nmeasures \n Ability to relate to \npeople of social \nrange in the \nworkplace \n Gather and provide \ninformation in \nresponse to \nworkplace \nrequirements \nComplete relevant \nwork related \ndocuments \n3.1 Range of forms relating to \nconditions of employment \nare completed accurately \nand legibly \n3.2 Workplace data is recorded \non standard workplace \nforms and documents \n3.3 Basic mathematical \nprocesses are used for \nroutine calculations \n3.4 Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon \n3.5 Reporting requirements to \nsupervisor are completed \naccording to organizational \nguidelines \n Effective \ncommunication \n Different modes \nof \ncommunication \n Written \ncommunication \n Organizational \npolicies \n \n Communication \nprocedures and \nsystems \n Technology \nrelevant to the \nenterprise and \nthe individual’s \nwork \nresponsibilities \n Complete work \nrelated documents \n Basic mathematical \nprocesses of \naddition, \nsubtraction, division \nand multiplication \n Gather and provide \ninformation in \nresponse to \nworkplace \nrequirements\n\n--- PDF PAGE 9 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n5 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5.\nIndustry bodies\n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal instructions \n2.6.\nFace to face communication\n3. Storage \n3.1. \nManual filing system \n3.2.\nComputer-based filing system\n4. Forms \n4.1. \nPersonnel forms \n4.2. \nTelephone message forms \n4.3.\nSafety reports\n5. Workplace \ninteractions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two-way radio \n5.4. \nWritten including electronic, memos, instruction and forms, \nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 10 ---\nTESDA-QSO-SOP-01-F08 \nTR – Sugarcane Production NC II                                        Promulgated  December 16, 2015 \n6 \nEVIDENCE GUIDE \n \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candida