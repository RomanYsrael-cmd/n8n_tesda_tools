          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image.\n1.2\nInterpreted client/customer requirements from\ninformation contained in the client brief and/or\nassignment instructions.\n1.3\nDealt successfully with a variety of client/customer\ninteractions.\n1.4\nMonitored and acted on changing client or customer\nneeds.\n1.5\nMet client/customer requirements.\n1.6\nBuilt credibility with customers/clients.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nUniform and personal grooming requirements of the\nemployer and the client\n2.2\nOccupational Health and safety requirement for the\nassignment\n2.3\nAssignment Instructions\n3. Underpinning\nskills\n3.1\nAttention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer\nneeds\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and Negotiation\n3.8\nMaintaining Records\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions\n(if relevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n\n--- PDF PAGE 31 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n27\n\n5. Method of\nassessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit.\n6.5\nContinuous assessment in the workplace, taking into\naccount the range of variables affecting performance.\n6.6\nSelf-assessment on the same terms as those described\nabove.\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment\nagainst performance criteria and an evaluation of\nunderpinning knowledge and skill required to achieve the\nrequired performance criteria.\n\n--- PDF PAGE 32 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n28\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:"
