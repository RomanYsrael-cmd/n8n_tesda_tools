mpetency\nAssessment requires evidence that the candidate:\n1.1 Use of measuring devices effectively\n1.2 Took and recorded accurate measurements\n1.3 Performed simple calculations according to\nspecifications\n1.4 Estimated quantities and costs according to requirement\n1.5 Communicate effectively to enable accurate calculations\nand measurements\n2. Underpinning\nknowledge and\nattitudes\n2.1 Drawings and specifications\n2.2 Materials relevant to the construction processes\n2.3 Basic operation in measurement and calculations\n2.4 Costing relative to the construction process\n3. Underpinning\nskills\n3.1 Read and interpret drawings\n3.2 Measure and calculate manually\n3.3 Record measurement\n3.4 Operate electronic calculating devices\n3.5 Communicate effectively\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment may take place\n4.2 Materials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation of work activities related to drafting\nand cutting of casual apparel pattern\n6. Context for\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 24 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n20\n\nUNIT OF COMPETENCY:\nSET UP AND OPERATE MACHINE/S\nUNIT CODE:\nGRM743204\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nsetting up and operating machines.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Set machines\n1.1 Product specifications are interpreted in relation to\nmachine setting requirements\n1.2 Type of sewing machine to be set up is identified in\naccordance with the job requirement\n1.3 Machine is set in accordance with product\nspecifications, machine manufacturer’s instructions\nand company procedures\n2. Conduct sample run\n2.1 Materials to be used for sampling are obtained\n2.2 Machine is operated in accordance with\nmanufacturer’s and company instructions to produce\na specified sample\n3. Test machine output\n3.1 Machine outputs are tested or organized in\naccordance with company procedures to ensure\nrequired standards of quality are met\n4. Re-adjust machine\nsetting to meet\nrequirements\n4.1 Test results are interpreted to determine adjustment\nrequirements\n4.2 Adjustment changes are assessed in accordance\nwith product and machine specifications\n4.3 Appropriate production personnel are informed of\nthe availability of the newly set up machine in\naccordance with workplace procedures\n5. Maintain records\n5.1 Records are maintained and reports prepared in\naccordance with the company procedures\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Type of Machines used\n1.1 Single needle lockstitch machine\n1.2 Double needle lockstitch machine\n1.3 Edging machine\n1.4 Button hole machine\n2. Machine output\n2.1 Product sample\n2.2 Service samples\n2.3 Machine operation\n\n--- PDF PAGE 25 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n21\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted product specifications in relation to machine\nsetting requirements\n1.2 Obtained materials to be used for sampling\n1.3 Operated machines\n1.4 Tested or organized sample to ensure quality standards\nare met\n1.5 Interpreted test results\n1.6 Assessed adjustment changes\n1.7 Maintained records and prepared reports\n2. Underpinning\nknowledge\n2.1 Setting up and adjustment requirements for the range of\nmachines and equipment used in the company\n2.2 Quality requirements\n2.3 Machine manufacturer’s specifications\n2.4 Safety and environmental aspects of relevant company\nactivities\n2.5 Workplace procedures and reporting processes\n2.6 Relevant OH&S legislation and codes of practice\n3. Underpinning\