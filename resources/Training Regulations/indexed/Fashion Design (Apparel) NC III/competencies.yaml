        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCommunicated effectively\n1.2\nCanvassed garments materials from different\nsuppliers\n1.3\nIdentified and selected best supplier\n1.4\nProcured materials\n1.5\nChecked procured materials for quality\n1.6\nEstimated the costs of garment materials based on\nthe agreed design\n1.7\nIdentified and calculated labor costs based on\ngarments and company standard\n1.8\nAssessed and completed all required information on\ncosting sheet\n1.9\nMaintained accurate records\n1.10 Identified and prepared optimum production plan\n1.11 Identified appropriate tools and materials\n1.12 Applied quality and OHS practices in work operations\n2. Underpinning\nknowledge and\nattitudes\n\nEfficiency and resourcefulness on canvassing\n2.1\nPatternmaking and design terminology\n2.2\nFashion trends\n2.3\nFabric Properties\n2.1\nQuality of Materials\n2.4\nGarment material alternatives\n2.5\nQuality standards and practices\n2.6\nSequence of operations\n2.7\nRecording and reporting practices\n2.8\nCompany standards for costing specification\n2.9\nBasic Math\n•\nFour Fundamental Operations\n•\nRatio and Proportion\n2.10 OHS practices including hazard identification and\ncontrol measures\n2.11 Workplace practices\n2.12\nEfficiency and resourcefulness on canvassing\n2.13\nBasic Etiquette\n2.14 Environmental protection measures\n• 5S Procedures\n• 3Rs – Reduce, Reuse, Recycle\n• Sustainable fashion practices\n - Use of eco-fashion clothing materials\n - Environment-friendly garments production\n - Waste management\n - Reduction of hazardous substances\n\n--- PDF PAGE 44 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n40\n\n3. Underpinning skills\n3.1\nCommunication skills\n3.2\nEstimating costs\n3.3\nInterpreting work specification\n3.4\nMaintaining records\n3.5\nSequencing of operation\n3.6\nCanvassing\n3.7\nChecking quality of materials\n4. Resource\nimplications\n The following resources should be provided:\n4.1\nMaterials and tools relevant to the proposed activity\nor task\n4.2\nAccess to relevant workplace or appropriately\nsimulated environment for assessment can take place.\n5. Method of\nassessment\n Competency in this unit must be assessed through:\n5.1\nWritten Report\n5.2\nPortfolio\n\n6. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 45 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n41\nUNIT OF COMPETENCY :\nSUPERVISE GARMENT PROTOTYPE\nPREPARATION AND MASS PRODUCTION\n\nUNIT CODE\n:"
