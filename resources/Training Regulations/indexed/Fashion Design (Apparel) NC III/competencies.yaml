        "source_title": "CALCULATE AND PROCURE GARMENT MATERIALS",
        "source_text": "--- PDF PAGE 41 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n37 \nUNIT OF COMPETENCY :    CALCULATE AND PROCURE GARMENT MATERIALS \n \nUNIT CODE \n: \nGRM743318 \n \nUNIT DESCRIPTOR \n: \nThe unit applies to materials and resources used to \nprocure textiles and include skills and knowledge \nrequired to locate and compare materials and \nresources needed for production it also covers the \ncalculation of production costs. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold &Italicized fonts are elaborated in the Range of Variables \n1. Source garment \nmaterials \n1.1 \nSuppliers are identified in accordance with the \nrequired material to be purchased \n1.2 \nCanvassing of materials is performed considering the \nprice, availability and  quality based on job \nrequirements  \n1.3 \nBest supplier is selected based on canvass results \nand client requirements\n2. Identify garment cost \ncomponents \n2.1 \nCosts of fabric, modiste supplies and trimmings for \nsample garments and production are estimated in \naccordance with the agreed design \n2.2 \nCosts are identified based on sample product.  \n2.3 \nDifferences in costs for single and bulk production \ngarments are determined\n3. Calculate production \ncosts \n3.1 \nLabor costs  in production are identified and \ncalculated based on the garment design \n3.2 \nDifferent methods of production in fashion industry \nare identified and compared for costs and benefits \n3.3 \nOptimum production plan and costs are selected \nbased on cost estimates and delivery dates \n3.4 \nComponents of costing sheets are recorded in \naccordance with the company’s format \n3.5 \nCosting sheet is completed for a commissioned \ngarment  \n4. Purchase garment \nmaterials \n4.1 \nOrder is placed and coordinated with selected \nsupplier based on agreed mode of payment and \ndelivery date \n4.2 \nQuantity and quality of garment materials are \nchecked based on delivery receipt \n4.3 \nOut-of-specification materials are reported and \nreturned to the supplier for replacement/refund \n4.4 \nWhere necessary, substitute materials/colors are \nselected and referred to client for approval \n4.5 \nGarment material inventories are maintained  in \naccordance with company  procedures\n\n--- PDF PAGE 42 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n38 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Quality\nMay include but are not limited to:\n1.1 \nShrinkage \n1.2 \nProperties of fabric \n1.3 \nColor \n1.4 \nDurability \n1.5 \nTexture \n1.6\nAppropriateness with the design\n2. Modiste supply \n \nMay include but are not limited to:\n2.1 \nButtons \n2.2 \nZipper \n2.3\nStiffener\n3. Trimmings\nMay include but are not limited to:\n3.1 \nLace \n3.2 \nRick-rack \n3.3\nsotash\n4. Costs\nMay include but are not limited to:\n4.1 \nPackaging \n4.2 \nDamage \n4.3 \nSample/prototype \n4.4\nOverheads\n5. Labor costs\nMay include but are not limited to:\n5.1 \nDesigners \n5.2 \nCutter \n5.3 \nSewer  \n5.4 \nFinisher \n5.5 \nPattern maker \n5.6 \nPresser \n5.7 \nQuality controllers \n5.8\nDelivery man\n6. Different methods of \nproduction  \n6.1\nCut, make and trim (CMT)/All around\n6.2 \nSubcontracting \n6.3\nOff shoring/outsourcing\n7. Components\n7.1\ndate\n7.2 \nstyle/design number \n7.3 \nsize \n7.4 \nfabrics/linings \n7.5 \nextras, e.g. pleating, embroidery \n7.6 \nlabor/CMT \n7.7 \nfreight/shipping \n7.8 \npackaging \n7.9 \noverheads \n7.10 labels \n7.11 trims \n7.12\nflat drawing/ sketch/picture\n8. Mode of payment\n8.1\nCash on delivery-COD\n8.2\n30 days post-dated check\n9. Out –of-specification \nmaterials \nMay include but are not limited to:\n9.1 \nWater damaged \n9.2 \nWith stain \n9.3 \nThread run \n9.4 \nOff-shade \n9.5\nMisaligned fiber/prints\n\n--- PDF PAGE 43 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n39 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nCommunicated effectively \n1.2 \nCanvassed garments materials from different \nsuppliers \n1.3 \nIdentified and selected best supplier \n1.4 \nProcured materials  \n1.5 \nChecked procured materials for quality \n1.6 \nEstimated the costs of garment materials based on \nthe agreed design \n1.7 \nIdentified and calculated labor costs based on \ngarments and company standard \n1.8 \nAssessed and completed all required information on \ncosting sheet \n1.9 \nMaintained accurate records \n1.10 Identified and prepared optimum production plan \n1.11 Identified appropriate tools and materials \n1.12 Applied quality and OHS practices in work operations \n2. Underpinning \nknowledge and \nattitudes  \n \nEfficiency and resourcefulness on canvassing \n2.1 \nPatternmaking and design terminology \n2.2 \nFashion trends \n2.3 \nFabric Properties \n2.1 \nQuality of Materials  \n2.4 \nGarment material alternatives \n2.5 \nQuality standards and practices \n2.6 \nSequence of operations \n2.7 \nRecording and reporting practices \n2.8 \nCompany standards for costing specification \n2.9 \nBasic Math \n \nFour Fundamental Operations \n \nRatio and Proportion \n2.10 OHS practices including hazard identification and \ncontrol measures \n2.11 Workplace practices \n2.12 \nEfficiency and resourcefulness on canvassing \n2.13 \nBasic Etiquette \n2.14   Environmental protection measures \n 5S Procedures \n 3Rs – Reduce, Reuse, Recycle \n Sustainable fashion practices \n      -  Use of eco-fashion clothing materials \n      -  Environment-friendly garments production \n      -  Waste management \n               -  Reduction of hazardous substances\n\n--- PDF PAGE 44 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n40 \n \n3. Underpinning skills \n3.1 \nCommunication skills \n3.2 \nEstimating costs \n3.3 \nInterpreting work specification \n3.4 \nMaintaining records \n3.5 \nSequencing of operation \n3.6 \nCanvassing  \n3.7 \nChecking quality of materials \n4. Resource \nimplications \n The following resources should be provided: \n4.1 \nMaterials and tools relevant to the proposed activity \nor task \n4.2 \nAccess to relevant workplace or appropriately \nsimulated environment for assessment can take place.\n5. Method of \nassessment \n Competency in this unit must be assessed through: \n5.1 \nWritten Report \n5.2 \nPortfolio \n \n6. Context  of \nassessment \nCompetency may be assessed individually in the actual \nworkplace or simulated environment or in any TESDA \naccredited assessment center\n",
