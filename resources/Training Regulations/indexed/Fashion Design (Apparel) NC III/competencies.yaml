aduation \n2.4 \nSummer \n2.5 \nFiesta \n2.6\nHoliday season\n3. Promotional activities \nMay include but are not limited to: \n3.1  Advertising \n3.2  Public Relations \n3.3  Development and distribution of Promotional and \nInformational Materials \n3.4  Sales Promotions/Special Offers \n3.5  Personal Selling \n3.6  Marketing event options \n      -  Launches \n      -  Exhibitions \n      -  Fashion shows \n4. Resources \nMay include but are not limited to: \n4.1  Personnel \n4.2  Budget \n4.3  Logistics\n5. Industry practices \nMay include but are not limited to: \n5.1  Formatting and structure \n5.2  Inclusion of pictures and style and design details \n5.3  Inclusion of marketing objectives \n5.3  Promotion of features and benefits \n5.4  Reporting \n6. Other relevant details May include but are not limited to: \n6.1  Packaging requirements \n6.2  Production timelines \n6.3  Designers’ reputation (e.g. style, characteristics) \n6.4  Distribution outlets\n\n--- PDF PAGE 58 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n54 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:\n1.1 \nIdentified and analyzed target market \n1.2 \nIdentified promotional strategies/activities and \nresources \n1.3 \nSought approval of promotional strategies to promote \nfashion products or services \n1.4 \nImplemented promotional strategies/activities \n1.5 \nMonitored progress of on-going promotional activities \n1.6 \nPlanned and prepared contingency measures when \nnecessary \n1.7 \nUndertaken corrective measures where applicable \n1.8 \nEvaluated results of promotional activities \n1.9 \nDocumented and communicated outcomes of \nevaluation on promotional activities \n1.10 Applied quality and OHS practices \n1.11\nCommunicated effectively \n2. Underpinning \nknowledge and \nattitudes  \n2.1\nEvents Planning\n2.2 \nSeasonal Events \n2.3 \nMarketing Principles and Management \n2.4 \nDifferent promotional strategies \