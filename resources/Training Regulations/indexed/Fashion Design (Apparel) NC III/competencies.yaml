          "source_text": "1. Analyze target \nmarket \n1.1 Target market  for a product or service is identified in \nconsultation with other relevant parties and in \naccordance with promotional plans \n1.2 Consumer attributes for the market or market segment \nare  identified  \n1.3 Consumer needs for the products or services are \nassessed based on trends and past performance \n1.4  Target market is confirmed based on products or \nservices and according to organizational policies\n2. Identify promotional \nstrategies/activities \nand resources \n2.1   Seasonal events of the year are analyzed and \nevaluated based on the sale of the previous fashion \nseason \n2.2   Promotional activities and resources are identified \nand assessed for each identified event  to ensure  \n         compatibility with industry practices \n2.3    Other relevant details that may affect  promotional \nactivities are identified   \n2.4    Action plans are developed to provide details of \nproducts and services being promoted  \n2.5   Calendar of events  are prepared based on approved \naction plan and fashion forecast of the season  \n2.6   Approval of promotional strategies is sought  from \nauthorized person and communicated to all concerned \npersonnel\n3. Implement \npromotional activities \n3.1 Stakeholders and other clients are oriented on their \nimplementation roles and responsibilities \n3.2 Relevant industry knowledge and experiences are \napplied to maximize the promotion of products and \nservices \n3.3 Time management and organizational skills are used to \nexploit all promotional opportunities \n3.4 The benefits of the product or services are highlighted \nto meet the needs of the customers and/or clients\n\n--- PDF PAGE 56 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n52 \n \nELEMENT \nPERFORMANCE CRITERIA \nBold &Italicized fonts are elaborated in the Range of Variables \n \n3.5 Promotional and sales techniques are applied to a \nrange of situations and customer /client requirements \nbased on accepted industry standards and enterprise \npolicy \n4. Monitor progress of \non-going promotion \n4.1  Client’s feedback  is analyzed to determine the impact \nof the promotional activity on products or services \n4.2  Effectiveness of promotional plans/activities is assessed \nto identify possible improvements in future activities \n4.3  Costs and time lines are analyzed to evaluate the \nbenefits accruing from the promotional activities \n4.4  Contingency measures are planned and prepared, \nwhen necessary \n4.5  Corrective measures are implemented, where \napplicable \n5. Evaluate results of \npromotion \n5.1  Evaluation processes and criteria are identified based \non fashion product or services being promoted  \n5.2  Promotional  activities are evaluated against criteria  \n5.3  Program strengths as well as areas for improvements \nare identified as basis for continual enhancement of the \npromotional programs \n5.4  Outcomes of the evaluation are documented and  \ncommunicated to relevant personnel to guide future \nactivities in the promotion of fashion products or \nservices\n\n--- PDF PAGE 57 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n53 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant parties \nMay include but not limited to: \n2.1 \nMerchandiser \n2.2 \nPublicist \n2.3 \nFashion show producer \n2.4\nSales Personnel\n2. Seasonal event \nMay include but not limited to: \n2.1 \nWedding \n2.2 \nValentines \n2.3 \nProm and Graduation \n2.4 \nSummer \n2.5 \nFiesta \n2.6\nHoliday season\n3. Promotional activities \nMay include but are not limited to: \n3.1  Advertising \n3.2  Public Relations \n3.3  Development and distribution of Promotional and \nInformational Materials \n3.4  Sales Promotions/Special Offers \n3.5  Personal Selling \n3.6  Marketing event options \n      -  Launches \n      -  Exhibitions \n      -  Fashion shows \n4. Resources \nMay include but are not limited to: \n4.1  Personnel \n4.2  Budget \n4.3  Logistics\n5. Industry practices \nMay include but are not limited to: \n5.1  Formatting and structure \n5.2  Inclusion of pictures and style and design details \n5.3  Inclusion of marketing objectives \n5.3  Promotion of features and benefits \n5.4  Reporting \n6. Other relevant details May include but are not limited to: \n6.1  Packaging requirements \n6.2  Production timelines \n6.3  Designers’ reputation (e.g. style, characteristics) \n6.4  Distribution outlets\n\n--- PDF PAGE 58 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n54"
