repared specification sheet is checked in\naccordance with standard format\n1.2\nPreparation and cutting of patterns and detailed\ndrawings are checked/confirmed in coordination with\nconcerned personnel\n1.3 Assembled garments are checked according to\nspecification sheet, OHS practices and accepted\ngarment assembly techniques\n1.4 Assembly issues are communicated to appropriate\nproduction personnel for necessary adjustments\n1.5\nFinished prototype is test-fitted and compared based\non specification sheet.\n1.6 Concerned personnel are given instructions to make\nthe necessary alterations in accordance with the\nrevised specification sheet\n1.7 Quality and impact of altered finished garment are\nchecked against original design concept and revised\nspecification sheet\n1.8 Approval of garment prototype is sought from the client\n\n2. Oversee mass\nproduction of\ngarment\n2.1\nRevised specification sheets are distributed to\nconcerned unit heads for reference\n2.2\nWork flow is planned systematically in accordance\nwith garment assembly techniques.\n2.3\nProduction personnel are identified based on job\nrequirements\n2.4\nWork instructions are explained to production\npersonnel\n2.5\nDistribution of materials to unit heads is ensured and\nsupervised\n\n--- PDF PAGE 46 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n42\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n3. Monitor progress of\n production\n3.1\nOngoing communication with team members is\nmaintained to ensure obligations, quality, timelines,\nbudget and technical constraints are met in\naccordance with office procedures.\n3.2\nQuality assurance practices are conducted to check\npattern, sizing, materials and construction comply with\ndesign specifications.\n3.3\nChanges in production procedures are communicated\nwith concerned personnel and documented.\n3.4\nProduction activities are monitored to ensure\ncompliance with OHS practices.\n4. Resolve production\n problems\n\n4.1\nMethods to solve process or work flow problems are\nidentified through meetings or discussions.\n4.2\nKnowledge of process improvement and efficient\nproduction techniques/systems are used to assist in\nsystematic identification and resolution of process or\nwork flow problems.\n4.3\nPreferred option to resolve problem is recommended\nand documented.\n4.4\nImplementation of recommended problem resolution\noption is facilitated.\n\n--- PDF PAGE 47 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Specification sheet\nMay include but not limited to:\n1.1\nTechnical drawing\n1.2\nSize/Body Measurements\n1.3\nColor and Fabric Swatch\n1.4\nProportion\n1.5\nCompletion date\n1.6\nQuantity\n1.7\nSewing specification\n1.7.1 Size of stitches\n1.7.2 Seams and finishes\n1.7.3 Stitch density\n1.8\nGarments parts/details\n1.8.1 Sleeves\n1.8.2 Pocket\n1.8.3 Collar\n1.8.4\nAccessories\n2. Garment assembly\ntechniques\nMay include but are not limited to:\n2.1\nStraight sewing using a range of hem types (double\nfold, rolled, blind, stitched hem)\n2.2\nSewing techniques where the positioning, feeding\nand handling of work pieces involves contouring,\nstopping or handling skills required to accommodate\nfabric variations\n2.3\nGathering, easing, tucking\n2.4\nGluing and bonding\n3. Assembly issues\nMay include but not limited to:\n3.1\nComplex or time-consuming assembly\n3.2\nQuality\n3.3\nDifficulty in following pattern or design concepts\n3.4\nProblems arising from material selection\n3.5\nIssues relating to sizing or fabric cuts\n4. Production personnel\nMay include but not limited to\n4.1\nPattern maker\n4.2\nCutter\n4.3\nSewer/Sample Maker\n4.4\nFinisher\n5. Types of alteration\n5.1 Minor\n5.2 Major\n\n--- PDF PAGE 48 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n44\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated finished prototype\n1.2\nUndertaken corrective measures to rectify assembly\nissues and alterations\n1.3\nChecked quality and impact of altered finished\ngarment prototype\n1.4\nDisseminated and explained technical drawings, work\ninstructions and workloads\n1.5\nMonitored progress of production\n1.6\nResolved production problems where applicable\n1.7\nCommunicated effectively with production personnel\n1.8\nApplied quality and OHS practices\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSewing Techniques\n2.2\nGarment Parts\n2.3\nMethods of Assembling Garment Pieces\n2.4\nSewing Tools and Materials\n2.5\nMachine and Hand Sewing Stitches\n2.6\nBasic Math\n• Four Fundamental operations\n• Ratio and Proportion\n2.7\nPressing Techniques\n2.8\nAlteration\n2.9 Patternmaking principles and procedures\n2.10 Planning tools and procedures\n2.11 Production control and efficiency processes\n2.12 Quality assurance processes\n2.13 Relevant OHS legislation, regulatory requirements\nand business etiquettes\n2.14 Documenting and reporting practices\n2.15 Environmental protection measures\n• 5S Procedures\n• 3Rs – Reduce, Reuse, Recycle\n• Sustainable fashion practices\n - Use of eco-fashion clothing materials\n - Environment-friendly garments production\n - Waste management\n - Reduction of hazardous substances\n\n--- PDF PAGE 49 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n45\n\n3. Underpinning skills\n3.1\nOperating Sewing Machines\n3.2\nAssembling Garment Parts\n3.3\nAlteration Techniques\n3.4\nProduction Planning\n3.5\nPressing Techniques\n3.6\nInterpreting and using data from a range of sources\n3.7\nDecision Making\n3.8\nProblem Solving\n3.9\nManagerial Skills\n3.10 Communication Skills\n3.11 Documentation Skills\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nMaterials and tools relevant to the proposed activity\nor task\n4.2\nAccess to relevant workplace or appropriately\nsimulated environment for assessment can take\nplace.\n5. Method of\nassessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Report\n5.2\nPortfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 50 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n46\nUNIT OF COMPETENCY :\nEVALUATE FINISHED PRODUCT\n\nUNIT CODE\n:\nGRM743320\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired to evaluate completed garment products\nagainst client and design requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Evaluate final product\n1.1\nInformation on development process is assembled\nand evaluated.\n1.2\nProduct is assessed as to specifications for quality\noutput\n1.3\nPertinent results are identified, in consultation with\nothers as necessary, and used to draft plans for\nfuture action.\n1.4\nProduction outcomes are discussed with project team\nto review strengths and weaknesses of process.\n1.5\nWhen necessary, inferior quality of finished garment\nis determined for alteration.\n2. Cost outcome\n2.1\nDevelopment costs are monitored based on actual\nproduction\n2.2\nActual costs are compared to budget estimates and\ninconsistencies identified and explained.\n2.3\nImpact of costing inconsistencies is considered for\neffect on product sale cost.\n3. Maintain records\n3.1\nProduction and monitoring records are maintained\nand reports prepared, as necessary.\n3.2\nPattern and design production processes and findings\nare documented.\n3.3\nRecords are updated periodically or as needed in\naccordance with company procedure\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Specification\nMay include but not limited to:\n1.1\nSymmetry\n1.2\nMeasurements\n1.3\nColor\n1.4\nTexture\n1.5\nStyle details (e.g., collar, pockets, sleeves, zipper,\nstitches, etc.)\n\n--- PDF PAGE 51 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n47\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated final product\n1.2\nMaintained records\n1.3 Applied quality control on finished product\n2. Underpinning\nknowledge and\nattitudes\n2.1\nPrinciples of design\n2.1.1 Color harmony\n2.1.2 Proportion and Symmetry\n2.1.3 Emphasis\n2.1.4 Balance\n2.2\nFashion trends\n2.3\nQuality practices\n2.4\nDocumentation\n2.5\nWorkplace practices\n2.6 Environmental protection measures\n• 5S Procedures\n• 3Rs – Reduce, Reuse, Recycle\n• Sustainable fashion practices\n - Use of eco-fashion clothing materials\n - Environment-friendly garments production\n - Waste management\n - Reduction of hazardous substances\n3. Underpinning skills\n3.1\nInterpreting designs\n3.2\nCommunication Skills\n3.3\nRecording\n3.4\nApplying quality practices\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nMaterials and tools relevant to the proposed activity\nor task\n4.2\nAccess to relevant workplace or appropriately\nsimulated environment for assessment can take\nplace.\n5. Method of\nassessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Report\n5.2\nPortfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 52 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n48\nUNIT OF COMPETENCY :\nSUPERVISE PACKAGING AND DISPATCHING OF\nFINISHED GARMENT\n\nUNIT CODE\n:\nGRM743321\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired in supervising packaging of garments to\nprepare them for dispatch/delivery\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Oversee preparation\nfor packaging of\nfinished garment\n1.1\nNecessary documents, packaging materials and\naccessories are selected in accordance with finished\ngarments and mode of delivery\n1.2\nConcerned personnel are instructed to arrange\nfinished garments in sequence and checked for\ncompleteness prior to packaging\n1.3\nWork problems are assessed and resolved based\non company standard procedures and product\nspecification\n2. Oversee packaging\nof finished garment\n2.1\nPackaging instructions are given to concerned\npersonnel\n2.2\nWork is assessed and problems are resolved for\ncompliance with quality standards and production\nspecifications\n2.3\nPacked garments are checked and corrective\nmeasures are undertaken to resolve problems\nencountered\n3. Oversee dispatching\nof packed garments\n3.1.\nDocumentation is checked for completeness and\naccuracy in compliance with company procedures\n3.2.\nPacked garments are directed for dispatch/delivery\n3.3.\nReceipt of delivered garments are verified with the\ndispatcher and the client as necessary\n\n--- PDF PAGE 53 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Documents\n1.1\nJob order\n1.2\nReceipt\n2. Packaging materials\n2.1\nHanger\n2.2\nPlastic/paper bag\n2.3\nBox\n2.4\nGarment bag\n3. Packaging\naccessories\nMay not include but not limited to:\n3.1\nName tag\n3.2\nTissue wrap\n3.3\nCard board\n3.4\nExtra buttons\n3.5\nWashing instructions/ fabric care\n4. Mode of delivery\n2.5\nBy Air\n2.6\nBy Sea\n2.7\nBy Land\n5. Work problems\nMay not include but not limited to:\n4.1\nOverlook details and accessories(e.g. unfinished\ngarment, creases)\n4.2\nOver production\n4.2.1 Defective\n4.2.2 Stains\n4.3\nSnag\n4.4\nImproper labeling of garments\n4.5\nPoor fit\n\n--- PDF PAGE 54 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n50\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified packaging requirements\n1.2\nInstructed concerned personnel on packaging\nfinished garments\n1.3\nChecked packed finished garments\n1.4\