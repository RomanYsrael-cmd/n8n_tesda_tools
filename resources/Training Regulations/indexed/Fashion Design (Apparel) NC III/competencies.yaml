        "source_text": "--- PDF PAGE 38 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n34 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nCREATE GARMENT DESIGNS \n  \nUNIT CODE \n: \nGRM743317 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude \nrequired in creating garment designs.   This includes \ninterviewing clients, sketching, and finalizing garment \ndesigns. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold &Italicized fonts are elaborated in the Range of Variables \n1. Determine client \nrequirements \n1.1 \nRapport with client is established in accordance \nwith shop procedures  \n1.2 \nClient requirements are identified based on clothing \nneeds  and specifications and is then \nverified/confirmed with client \n1.3 \n Suggestions/input are provided based on client’s \nspecifications\n2. Research fashion \ntrends and theme \nanalysis \n2.1. \nReference sources appropriate to illustration \nrequirements are gathered/accessed and studied in \naccordance with client’s requirements   \n2.2. \nPrinciples and elements of design are analyzed \nin accordance with agreed design \n2.3. \nEco- fashion practices/sustainable fashion are \napplied in accordance with the design concept \n2.4. \nDesign are sketched and evaluated based on \nclient’s figure details \n3. Produce designs  \n3.1 \nInitial designs  are prepared, presented and \nexplained based on gathered information   \n3.2 \nSample materials are presented for client’s \napproval  \n3.3 \nRevisions are noted and integrated in the design in \naccordance with client’s preference. \n3.4 \nFinal sketch are presented to client based on the \nnoted revisions made \n3.5 \nAffirmation of design is secured/confirmed with \nclient \n3.6 \nSketches and designs are filed in accordance to \ncompany procedure.\n\n--- PDF PAGE 39 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n35 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Client\n1.1 Walk-in\n1.2 Referral\n2. Needs and \nSpecification \n2.1 Purpose\n2.1.1 RTW \n2.1.2 Made to Order (MTO) \n2.2 Designs \n2.3 Color scheme \n2.4 Fashion trend \n2.5 Body measurements \n2.6 Budget\n3. Reference sources\nMay include but not be limited to-\n3.1 Photographs \n3.2 Magazines \n3.3 Fashion Books \n3.4 Catalogs \n3.5 Internet \n3.6 Movies \n3.7 Fashion Shows\n4. Principles  of design\n4.1\nBalance\n4.2 Harmony \n4.3 Rhythm \n4.4 Repetition \n4.5\nEmphasis\n5. Elements of design\n5.1 Line \n5.2 Shape \n5.3 Color \n5.4 Texture\n6. Figure details\nFull or partial body drawings including:\n6.1 \nHead \n6.2 \nNeck \n6.3 \nWaist \n6.4 \nBust \n6.5 \nHips \n6.6 \nLegs \n6.7 \nArms \n6.8 \nShoulder \n6.9 \nBody Built \n6.10 Skin Tone \n6.11 Height\n7. Initial designs\n7.1\nSketches\n7.2 \nDesign and studies \n7.3\nAvailable Prototype \n8.\nSample materials\n \n \nMay include but not limited to\n8.1 Swatches \n8.2 Color sample \n8.3 Accessories and Details (e.g. button, beads, lace, \netc.) \n9.\nRevisions\n9.1\nEnhancement\n9.2\nTone-down\n10. Affirmation\n10.1 Written agreement\n10.2 Verbal\n\n--- PDF PAGE 40 ---\nTR Fashion Design (Apparel) NC III (Garment Sector) \n36 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n Assessment requires evidence that the candidate: \n1.1 \nGathered information on clients requirements  \n1.2 \nProduced designs based on needs  and \nspecifications \n1.3 \nFinalized design \n1.4\nApplied quality and client artistic standards\n2. Underpinning \nknowledge and \nattitudes  \n2.1 \nFashion Trends \n2.2 \nTerminologies on Fashion Designing \n2.3 \nBody Structure \n2.4 \nPrinciples and elements of design \n2.5 \nTextile Properties \n2.6 \nFashion History \n2.7 \nBusiness Etiquette \n2.8 \nBasic Math \n Four Fundamental Operations \n Ratio and Proportion \n2.9      Environmental protection measures \n 5S Procedures \n 3Rs – Reduce, Reuse, Recycle \n Sustainable fashion practices \n      -  Use of eco-fashion clothing materials \n      -  Environment-friendly garments production \n      -  Waste management \n      -  Reduction of hazardous substances           \n3. Underpinning skills \n3.1 \nInterpersonal Skills \n3.2 \nInterpreting design \n3.3 \nCommunication Skills \n3.4 \nComputation Skills \n3.5 \nTaking Body Measurement \n3.6 \nSketching \n3.7\nData gathering and analysis\n4. Resource \nimplications \nThe following resources should be provided: \n4.1 \nMaterials and tools relevant to the proposed activity \nor task \n4.2 \nAccess to relevant workplace or appropriately \nsimulated environment for assessment can take \nplace.\n5. Method of \nassessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration with oral questioning \n5.2 \nPortfolio \n6. Context  of \nassessment \nCompetency may be assessed individually in the actual \nworkplace or simulated environment or in any TESDA \naccredited assessment center\n",
