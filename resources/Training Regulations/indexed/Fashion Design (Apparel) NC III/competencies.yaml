        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated finished prototype\n1.2\nUndertaken corrective measures to rectify assembly\nissues and alterations\n1.3\nChecked quality and impact of altered finished\ngarment prototype\n1.4\nDisseminated and explained technical drawings, work\ninstructions and workloads\n1.5\nMonitored progress of production\n1.6\nResolved production problems where applicable\n1.7\nCommunicated effectively with production personnel\n1.8\nApplied quality and OHS practices\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSewing Techniques\n2.2\nGarment Parts\n2.3\nMethods of Assembling Garment Pieces\n2.4\nSewing Tools and Materials\n2.5\nMachine and Hand Sewing Stitches\n2.6\nBasic Math\n• Four Fundamental operations\n• Ratio and Proportion\n2.7\nPressing Techniques\n2.8\nAlteration\n2.9 Patternmaking principles and procedures\n2.10 Planning tools and procedures\n2.11 Production control and efficiency processes\n2.12 Quality assurance processes\n2.13 Relevant OHS legislation, regulatory requirements\nand business etiquettes\n2.14 Documenting and reporting practices\n2.15 Environmental protection measures\n• 5S Procedures\n• 3Rs – Reduce, Reuse, Recycle\n• Sustainable fashion practices\n - Use of eco-fashion clothing materials\n - Environment-friendly garments production\n - Waste management\n - Reduction of hazardous substances\n\n--- PDF PAGE 49 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n45\n\n3. Underpinning skills\n3.1\nOperating Sewing Machines\n3.2\nAssembling Garment Parts\n3.3\nAlteration Techniques\n3.4\nProduction Planning\n3.5\nPressing Techniques\n3.6\nInterpreting and using data from a range of sources\n3.7\nDecision Making\n3.8\nProblem Solving\n3.9\nManagerial Skills\n3.10 Communication Skills\n3.11 Documentation Skills\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nMaterials and tools relevant to the proposed activity\nor task\n4.2\nAccess to relevant workplace or appropriately\nsimulated environment for assessment can take\nplace.\n5. Method of\nassessment\nCompetency in this unit must be assessed through:\n5.1\nWritten Report\n5.2\nPortfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 50 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n46\nUNIT OF COMPETENCY :\nEVALUATE FINISHED PRODUCT\n\nUNIT CODE\n:"
