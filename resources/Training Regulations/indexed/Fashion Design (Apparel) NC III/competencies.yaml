d performance criteria.\n\n--- PDF PAGE 35 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n31\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nHCS515204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nneeded to apply quality standards in the workplace.\nThe unit also includes the application of relevant\nsafety procedures and regulations,\nsalon/organizational procedures and other client\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Assess clients\nservice needs\n\n1.1\nWork instruction is obtained and work is carried out\nin accordance with standard operating procedures\n1.2\nClient’s needs are checked against workplace\nstandards and specifications\n1.3\nFaults on clients and any identified causes are\nrecorded and/or reported to the supervisor\nconcerned in accordance with workplace\nprocedures\n1.4\nClients profile and service extended to them are\ndocumented in accordance with workplace\nprocedures\n2. Assess own work\n2.1\nDocumentation relative to quality within the\ncompany is identified and used\n2.2\nCompleted work is checked against workplace\nstandards relevant to the task undertaken\n2.3\nErrors are identified and improved on\n2.4\nInformation on the quality and other indicators of\nindividual performance is recorded in accordance\nwith workplace procedures\n2.5\nIn cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ standard operating\nprocedures\n3. Engage in quality\nimprovement\n3.1\nProcess improvement procedures are participated\nin relative to workplace assignment\n3.2\nWork is carried out in accordance with process\nimprovement procedures\n3.3\nPerformance of operation or quality of product of\nservice to ensure other client satisfaction is\nmonitored\n\n--- PDF PAGE 36 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. External Clients\n\nMay include but not limited to:\n1.1\nTeenagers\n1.2\nAdult Men\n1.3\nWorking Adult\n1.4\nChild\n2. Faults\nMay include but not limited to:\n2.1\nClient not satisfied\n2.2\nDesired result is not within the desired result of\nclient\n2.3\nProcedures done but do not conform with any Salon\npolicies and procedures\n2.4\nDamaged caused to client\n3. Documentation\n3.1\nOrganization Work Procedures\n3.2\nManufacturer’s Instruction Manual\n3.3\nClient Requirements\n3.4\nForms\n4. Errors\nMay be related to the following:\n4.1\nDeviation from the requirements of the client\n4.2\nDeviation from the requirements of the\nsalon/organization\n5. Quality Standards\nMay be related but not limited to the following:\n5.1\nSupplies and Materials\n5.2\nFacilities\n5.3\nSalon Product\n5.4\nService Processes and Procedures\n5.5\nClient Service\n5.6\nEnvironmental Regulations\n6. Client\n6.1\nCo-worker\n6.2\nSupplier/Vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 37 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n33\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCarried out work in accordance with the company’s\nstandard operating procedures\n1.2\nPerformed task according to specifications\n1.3\nReported errors or deviations not in accordance with\nstandard operating procedures\n1.4\nCarried out work in accordance with the process\nimprovement\n2. Underpinning\nknowledge and\nattitudes\n2.1\nRelevant Production Processes, Materials and\nProducts\n2.2\nCharacteristics of Materials, Software and Hardware\nUsed in Production Processes\n2.3\nQuality Checking Procedures\n2.4\nClient Relations\n2.5\nWork Place Procedures\n2.6\nSafety and Environmental Aspects of Service\nProcesses\n2.7\nError Identification and Reporting\n2.8\nQuality Improvement Processes\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions,\nproduct manufacturer’s requirements\n3.2\nCommunication skills needed to interpret and apply\ndefined work procedures\n3.3\nCarry out work in accordance with OHS policies and\nprocedures\n3.4\nCritical thinking\n3.5\nSolution providing and decision making\n3.6\nInterpersonal skills or dealing with varied type of clients\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nMaterials\n4.2\nProduct\n4.3\nEquipment\n5. Method of\nassessment\nCompetency in this unit must be assessed through:\n5.1\nObservation with questioning\n5.2\nThird Party Report\n5.3\nPractical Demonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 38 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n34\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nCREATE GARMENT DESIGNS\n\nUNIT CODE\n:\nGRM743317\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired in creating garment designs. This includes\ninterviewing clients, sketching, and finalizing garment\ndesigns.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Determine client\nrequirements\n1.1\nRapport with client is established in accordance\nwith shop procedures\n1.2\nClient requirements are identified based on clothing\nneeds and specifications and is then\nverified/confirmed with client\n1.3\n Suggestions/input are provided based on client’s\nspecifications\n2. Research fashion\ntrends and theme\nanalysis\n2.1.\nReference sources appropriate to illustration\nrequirements are gathered/accessed and studied in\naccordance with client’s requirements\n2.2.\nPrinciples and elements of design are analyzed\nin accordance with agreed design\n2.3.\nEco- fashion practices/sustainable fashion are\napplied in accordance with the design concept\n2.4.\nDesign are sketched and evaluated based on\nclient’s figure details\n3. Produce designs\n3.1\nInitial designs are prepared, presented and\nexplained based on gathered information\n3.2\nSample materials are presented for client’s\napproval\n3.3\nRevisions are noted and integrated in the design in\naccordance with client’s preference.\n3.4\nFinal sketch are presented to client based on the\nnoted revisions made\n3.5\nAffirmation of design is secured/confirmed with\nclient\n3.6\nSketches and designs are filed in accordance to\ncompany procedure.\n\n--- PDF PAGE 39 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Client\n1.1 Walk-in\n1.2 Referral\n2. Needs and\nSpecification\n2.1 Purpose\n2.1.1 RTW\n2.1.2 Made to Order (MTO)\n2.2 Designs\n2.3 Color scheme\n2.4 Fashion trend\n2.5 Body measurements\n2.6 Budget\n3. Reference sources\nMay include but not be limited to-\n3.1 Photographs\n3.2 Magazines\n3.3 Fashion Books\n3.4 Catalogs\n3.5 Internet\n3.6 Movies\n3.7 Fashion Shows\n4. Principles of design\n4.1\nBalance\n4.2 Harmony\n4.3 Rhythm\n4.4 Repetition\n4.5\nEmphasis\n5. Elements of design\n5.1 Line\n5.2 Shape\n5.3 Color\n5.4 Texture\n6. Figure details\nFull or partial body drawings including:\n6.1\nHead\n6.2\nNeck\n6.3\nWaist\n6.4\nBust\n6.5\nHips\n6.6\nLegs\n6.7\nArms\n6.8\nShoulder\n6.9\nBody Built\n6.10 Skin Tone\n6.11 Height\n7. Initial designs\n7.1\nSketches\n7.2\nDesign and studies\n7.3\nAvailable Prototype\n8.\nSample materials\n\nMay include but not limited to\n8.1 Swatches\n8.2 Color sample\n8.3 Accessories and Details (e.g. button, beads, lace,\netc.)\n9.\nRevisions\n9.1\nEnhancement\n9.2\nTone-down\n10. Affirmation\n10.1 Written agreement\n10.2 Verbal\n\n--- PDF PAGE 40 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n36\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n Assessment requires evidence that the candidate:\n1.1\nGathered information on clients requirements\n1.2\nProduced designs based on needs and\nspecifications\n1.3\nFinalized design\n1.4\nApplied quality and client artistic standards\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFashion Trends\n2.2\nTerminologies on Fashion Designing\n2.3\nBody Structure\n2.4\nPrinciples and elements of design\n2.5\nTextile Properties\n2.6\nFashion History\n2.7\nBusiness Etiquette\n2.8\nBasic Math\n• Four Fundamental Operations\n• Ratio and Proportion\n2.9 Environmental protection measures\n• 5S Procedures\n• 3Rs – Reduce, Reuse, Recycle\n• Sustainable fashion practices\n - Use of eco-fashion clothing materials\n - Environment-friendly garments production\n - Waste management\n - Reduction of hazardous substances\n3. Underpinning skills\n3.1\nInterpersonal Skills\n3.2\nInterpreting design\n3.3\nCommunication Skills\n3.4\nComputation Skills\n3.5\nTaking Body Measurement\n3.6\nSketching\n3.7\nData gathering and analysis\n4. Resource\nimplications\nThe following resources should be provided:\n4.1\nMaterials and tools relevant to the proposed activity\nor task\n4.2\nAccess to relevant workplace or appropriately\nsimulated environment for assessment can take\nplace.\n5. Method of\nassessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration with oral questioning\n5.2\nPortfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 41 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n37\nUNIT OF COMPETENCY : CALCULATE AND PROCURE GARMENT MATERIALS\n\nUNIT CODE\n:\nGRM743318\n\nUNIT DESCRIPTOR\n:\nThe unit applies to materials and resources used to\nprocure textiles and include skills and knowledge\nrequired to locate and compare materials and\nresources needed for production it also covers the\ncalculation of production costs.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Source garment\nmaterials\n1.1\nSuppliers are identified in accordance with the\nrequired material to be purchased\n1.2\nCanvassing of materials is performed considering the\nprice, availability and quality based on job\nrequirements\n1.3\nBest supplier is selected based on canvass results\nand client requirements\n2. Identify garment cost\ncomponents\n2.1\nCosts of fabric, modiste supplies and trimmings for\nsample garments and production are estimated in\naccordance with the agreed design\n2.2\nCosts are identified based on sample product.\n2.3\nDifferences in costs for single and bulk production\ngarments are determined\n3. Calculate production\ncosts\n3.1\nLabor costs in production are identified and\ncalculated based on the garment design\n3.2\nDifferent methods of production in fashion industry\nare identified and compared for costs and benefits\n3.3\nOptimum production plan and costs are selected\nbased on cost estimates and delivery dates\n3.4\nComponents of costing sheets are recorded in\naccordance with the company’s format\n3.5\nCosting sheet is completed for a commissioned\ngarment\n4. Purchase garment\nmaterials\n4.1\nOrder is placed and coordinated with selected\nsupplier based on agreed mode of payment and\ndelivery date\n4.2\nQuantity and quality of garment materials are\nchecked based on delivery receipt\n4.3\nOut-of-specification materials are reported and\nreturned to the supplier for replacement/refund\n4.4\nWhere necessary, substitute materials/colors are\nselected and referred to client for approval\n4.5\nGarment material inventories are maintained in\naccordance with company procedures\n\n--- PDF PAGE 42 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n38\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Quality\nMay include but are not limited to:\n1.1\nShrinkage\n1.2\nProperties of fabric\n1.3\nColor\n1.4\nDurability\n1.5\nTexture\n1.6\nAppropriateness with the design\n2. Modiste supply\n\nMay include but are not limited to:\n2.1\nButtons\n2.2\nZipper\n2.3\nStiffener\n3. Trimmings\nMay include but are not limited to:\n3.1\nLace\n3.2\nRick-rack\n3.3\nsotash\n4. Costs\nMay include but are not limited to:\n4.1\nPackaging\n4.2\nDamage\n4.3\nSample/prototype\n4.4\nOverheads\n5. Labor costs\nMay include but are not limited to:\n5.1\nDesigners\n5.2\nCutter\n5.3\nSewer\n5.4\nFinisher\n5.5\nPattern maker\n5.6\nPresser\n5.7\nQuality controllers\n5.8\nDelivery man\n6. Different methods of\nproduction\n6.1\nCut, make and trim (CMT)/All around\n6.2\nSubcontracting\n6.3\nOff shoring/outsourcing\n7. Components\n7.1\ndate\n7.2\nstyle/design number\n7.3\nsize\n7.4\nfabrics/linings\n7.5\nextras, e.g. pleating, embroidery\n7.6\nlabor/CMT\n7.7\nfreight/shipping\n7.8\npackaging\n7.9\noverheads\n7.10 labels\n7.11 trims\n7.12\nflat drawing/ sketch/picture\n8. Mode of payment\n8.1\nCash on delivery-COD\n8.2\n30 days post-dated check\n9. Out –of-specification\nmaterials\nMay include but are not limited to:\n9.1\nWater damaged\n9.2\nWith stain\n9.3\nThread run\n9.4\nOff-shade\n9.5\nMisaligned fiber/prints\n\n--- PDF PAGE 43 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCommunicated effectively\n1.2\nCanvassed garments materials from different\nsuppliers\n1.3\nIdentified and selected best supplier\n1.4\nProcured materials\n1.5\nChecked procured materials for quality\n1.6\nEstimated the costs of garment materials based on\nthe agreed design\n1.7\nIdentified and calculated labor costs based on\ngarments and company standard\n1.8\nAssessed and completed all required information on\ncosting sheet\n1.9\nMaintained accurate records\n1.10 Identified and prepared optimum production plan\n1.11 Identified appropriate tools and materials\n1.12 Applied quality and OHS practices in work operations\n2. Underpinning\nknowledge and\nattitudes\n\nEfficiency and resourcefulness on canvassing\n2.1\nPatternmaking and design terminology\n2.2\nFashion trends\n2.3\nFabric Properties\n2.1\nQuality of Materials\n2.4\nGarment material alternatives\n2.5\n