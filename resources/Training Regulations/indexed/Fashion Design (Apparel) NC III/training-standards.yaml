    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Fashion Design (Apparel) NC III.\n\nThis includes information on curriculum design; training delivery; trainee\nentry requirements; tools and equipment; training facilities; and trainers’ qualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FASHION DESIGN (APPAREL) NC Level: NC III\nNominal Training Duration: 17 Hours (Basic)\n 20 Hours (Common)\n 360 Hours (Core)\n\n 397 Hours (Total)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Fashion\nDesigner in accordance with industry standards. It covers the basic, common and core\ncompetencies on creating garment design, calculating and procuring garment materials,\ncoordinating garment prototype preparation, supervising garment production, evaluating\nfinished product, packaging of finished garment and promoting fashion products and\nservices.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(17 Hours)\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes\n1.2 Lead workplace discussions\n1.3 Identify and communicate\nissues arising in the\nworkplace\nGroup\nDiscussion\nRole Play\nBrainstorming\nObservation\nInterviews\n2. Lead small\nteams\n2.1 Provide team leadership\n2.2 Assign responsibilities\namong members\n2.3 Set performance\nexpectation for team\nmembers\n2.4 Supervise team\nperformance\nLecture\nDemonstration\nSelf-paced\n(Modular)\nDemonstration\nCase Studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Plan negotiations\n3.2 Participate in negotiations\nDirect\nObservation\nSimulation/\nRole Playing\nCase Studies\nWritten Test\nPractical/\nPerformance Test\n\n--- PDF PAGE 60 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n56\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Identify the problem\n4.2 Determine fundamental\ncauses of the problem\n4.3 Determine correction action\n4.4 Provide recommendation/s\nto manager\nDirect\nObservation\nSimulation/\nRole Playing\nCase Studies\nWritten Test\nPractical/\nPerformance Test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/ solution\n5.3 Analyze results\nDirect\nObservation\nSimulation/\nRole Playing\nCase Studies\nWritten Test\nPractical/\nPerformance Test\n6. Use relevant\ntechnologies\n6.1 Study/select appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/ enhance relevant\ntechnology\nDirect\nObservation\nSimulation/\nRole Playing\nCase Studies\nWritten Test\nPractical/\nPerformance Test\n\nCOMMON COMPETENCY\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Carry out\nmeasurement\ns and\ncalculations\n\n1.1 Read and interpret\ndrawings\n1.2 Obtain measurements\n1.2 Perform simple calculations\n1.3 Estimate appropriate\nquantities\nGroup\nDiscussion\nPractical\nExercises\n\nObservation\nWritten Exam.\n2. Set up and\noperate\nmachines\n2.1 Set machines\n2.2 Conduct sample run\n2.3 Test machine output\n2.4 Re- adjust machine setting\nto meet requirements\n2.5 Maintain records and\nprepare report.\nGroup\nDiscussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n3. Perform basic\nmaintenance\n3.1 Operate machine and\nassess its performance\n3.2 Clean and lubricate machine\n3.3 Check machine operation\nGroup\nDiscussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n4.\nMaintain\neffective\nrelationship\nwith clients/\ncustomers\n4.1 Maintain a professional\nimage\n4.2 Meet client/customer\nrequirements\n4.3 Build credibility with\ncustomers/clients\nGroup\nDiscussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n\n--- PDF PAGE 61 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n57\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n5. Manage own\nperformance\n5.1 Plan for completion of own\nworkload\n5.2 Maintain quality of own\nperformance\n5.3 Build credibility with\ncustomers/clients\nGroup\nDiscussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n6. Apply quality\nstandards\n\n6.1 Assess own work base on\nworkplace standard\n6.2 Assess quality of component\nparts and take corrective\nactions\n6.3 Measure parts using\nappropriate instrument\n6.4 Record information in\naccordance to workplace\nprocedures\n6.5 Study causes of quality\ndeviations and recommend\npreventive action\nGroup\nDiscussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n\nCORE COMPETENCIES\n(360 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Create garment\ndesigns\n1.1 Determine client\n requirements\n1.2 Research fashion trends\nand theme analysis\n1.3 Produce designs\nLecture-\nDemonstration\nHands-on/\nSimulation\n\nInterview\nDirect\nObservation\nDemonstration\nWritten\nExamination\n2. Calculate and\nprocure\ngarment\nmaterials\n2.1 Source garment materials\n2.2 Identify garment cost\ncomponents\n2.3 Calculate production costs\n2.4 Purchase garment materials\nLecture-\nDemonstration\nHands-on/\nSimulation\n\nWritten\nexamination\nDemonstration/\nOral\nQuestioning\n\n3. Supervise\ngarment\nprototype\npreparation and\nmass\nproduction\n3.1 Oversee prototype\npreparation\n3.2 Oversee mass production of\ngarment\n3.3 Monitor progress of\nproduction\n3.4 Resolve production\nproblems\nLecture-\nDemonstration\nHands-on/\nSimulation\n\nWritten\nExamination\nDemonstration/\nOral\nQuestioning\n\n--- PDF PAGE 62 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n58\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n4. Evaluate\nfinished\nproduct\n4.1 Evaluate final product\n4.2 Cost outcome\n4.3 Maintain records\n\nLecture-\nDemonstration\nHands-on/\nSimulation\nWritten\nExamination\nDemonstration/\nOral\nQuestioning\n5. Supervise\npackaging and\ndispatching of\nfinished\ngarment\n5.1 Oversee preparation for\npackaging of finished\ngarment\n5.2 Oversee packaging of\nfinished garment\n5.3 Oversee dispatching of\npacked garments\nLecture-\nDemonstration\nHands-on/\nSimulation\n\nWritten\nExamination\nDemonstration/\nOral\nQuestioning\n\n6. Perform\npromotional\nactivities for\nfashion\nproducts and/or\nservices\n6.1 Analyze target market\n6.2 Identify promotional\nstrategies/activities and\nresources\n6.3 Implement promotional\nactivities\n6.4 Monitor progress of on-\ngoing promotion\n6.5 Evaluate results of\npromotion\nLecture-\nDemonstration\nHands-on/\nSimulation\n\nWritten\nexamination\nDemonstration/\nOral\nQuestioning\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n--- PDF PAGE 63 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n59\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• Attended training in Dressmaking NC II or Tailoring NC II, or with one\nyear work experience in Dressmaking or Tailoring\n• can communicate both oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n• computer literate\n\n--- PDF PAGE 64 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n60\n\n3.4 TOOLS AND EQUIPMENT AND MATERIALS\nFASHION DESIGN (APPAREL) – NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Fashion Design (Apparel) NC III\n\nTOOLS\nQty\nEQUIPMENT\nQty\nMATERIALS\nQty\n*Cutting Shear\n8-12 inches\n2pcs\nPlastic or wood\nor metal chairs\nwith back rest\n25units\n*HB No.2 Pencil\n5 pcs\nRound plastic Basin\n\nPlastic Pail\n5 Small\n1 Large\n\n5\nMedium\nMedium\nFiberglass Model\nBody Form\n1 pcs\n*Pencil Eraser\n5 pcs\n*Scissors (Paper)\n 6-8 inches\n2pcs\nDisplay Cabinet,\nglass-door, w/\nshelves, 6’X4’X1’\n1unit\n*Sketching/Illustratio\nn Paper, “Oslo”, A4\n(@100shts/trainee)\n1ream\nCamera -\n12 Megapixel\n1 unit\nPersonal\nComputer G41T-\nR3-1333/\n1066/800MHZ,\nConroe/Presler/\nWolfdale/Yorkfield\nSeries w/\ncomplete\naccessories\n\nPrinter – HP\nLaser Jet Pro,\nP1102 printer\nseries\n2 units\n\n1unit\n*Colored Pencils,\n12colors/set\n2 sets\nUSB Drive\n8GB\n2 units\nWhite Board\n8’X4’\n3 pcs\n*Water Color (12\ncolors/set)\n2 sets\nWhite Board Eraser\n3 units\nLecture Table\nL5’ x W2.5’ x\nH2.5’\n13 units\n*Paint Brush Set\n(fine,medium,wide)\n2 sets\nPaper Mache\nMedium size Dress\nform up to 2nd Hip\n5 units\nHigh-speed\nSewing (Single\nNeedle\nLockstitch)\n10 units\nFabric(textile) Paint,\n1L,ea. of primary\ncolors & white\n1 set\n*Tape Measure\n 60 inches\n2 pcs\nHigh Speed\nSewing\nMachines\nAttachment\n(Zipper, Edging)\n10 units\nWhite Board Marker,\n(3 colors)\n1 box\n\n--- PDF PAGE 65 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n61\n\nTOOLS\nQty\nEQUIPMENT\nQty\nMATERIALS\nQty\n* Metal Hip Curve\n2 pcs\n3 Thread\nOverlock\nMachine\n1unit\n*Illustration Board,\n1/8”\n10 pcs\n*Wood Meter Stick\n2pcs\nFlat Iron\n2unit\n\n* Metal French\n Curve\n2 pcs\nIroning Board\n2 unit\nAssorted Fabric\nSwatches, (natural-\nanimal, plant &\nsynthetic),1 yard ea.\n1 pc per\ntype\nPinking Shears\n1 pcs\nCutting Table, 4ft\nx 8ft x 3ft,\nFormica-\ntopped/smooth\nsurface finished\n3 units\n*Pattern Paper,\n2’X4’\n20 sheets\n*Transparent Ruler\n(with grid) – 24”\n2pcs\nStools (for\nlaboratory room)\n15 units\nTailor’s chalk (white,\nblue, orange,\nyellow)\n2 each\n*Sewing Box\n14 inchesX6X4\n2pcs\nButton Holer\nAttachment\n1 unit\nDressmaker’s\nTracing Paper,\n2 sets\n*Metal Tracing\nwheel with wood or\nplastic handle\n2pcs\nHanger Rack\n1\nThread (6-10\nAssorted colors)\n3cones/c\nolor\nPlastic Hanger\n25pcs\nSleeve\nBoard/Ham\n\n1unit\nButtons, assorted\nshapes & sizes\n1 sample\nset\nScrew driver Flat\n(medium)\n10 pcs\n\nZipper, assorted\ntypes (e.g. metal,\nnylon, jacket,\ninvisible or ordinary)\n& sizes\n1 sample\nset\n*Plastic Triangle\n16” 45oX90o\n2pcs\n\nRecord book\n1pc\nWater Hand spray\n2 pc\n\nDifferent Interlining\n( fusible and non-\nfusible)\n1 yard\neach\n*Metal Seam\nRipper with plastic\nhandle\n2pcs\n\nDifferent sizes Band\nRoll and garters\n1 yard\neach\n*Emery bag\n2pcs\n\nHook & Eye (big &\nsmall)\n1 sample\nset\n*Metal L-Square\n2pcs\n\nSewing Machine Oil\n1 gallon\n*Bobbin case\n10 pcs\n\n*Needle DBX1 #14\n1 pack\n\n--- PDF PAGE 66 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n62\n\nTOOLS\nQty\nEQUIPMENT\nQty\nMATERIALS\nQty\nBattery operated\nCalculator-6digit\n2units\n\n*Needle DCX1 #11\n1 pack\n *Bobbin spool\n10 pcs\n\n*Needle DPX1 #14\n1 pack\nHanger, assorted\ntypes & sizes (for\npackaging\ndemonstration)\n1\nsample\nset\n\n*Needle DPX5 #14\n\n1 pack\nMetal clothes rack\n2 pcs\n\n*Hand Needles\n\n1 pack\n\nFabric for Blouse\n(Woven)\n\n2 yards\n\nFabric for Skirt\n(Woven)\n\n2 yards\n\nFabric for Dress\n(Woven)\n\n3 yards\n\n*Pins with heads\nand without heads\n1 box\neach\n\nAssorted trimmings\n1 sample\nset\n\nMuslin\n(Cheese cloth)\n30 yards\n\nBoxes, assorted\ntypes & sizes\n1 sample\nset\n\n Tissue paper &\nboard inserts\n1 sample\nset\n\n Different adhesive\nTapes for Packaging\n1 roll\neach\n\n Garment bag,\nassorted types &\nsizes\n1 sample\nset\n\n Plastics, assorted\ntypes & sizes\n1 sample\nset\n\nAssorted Care label\n1 sample\nset each\n\n Paper bags,\nassorted types &\nsizes\n1 sample\nset\n\n Gun tags\n1 pc\nNOTE: *Should be provided by trainees\n\n--- PDF PAGE 67 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n63\n3.5 TRAINING FACILITIES\nFASHION DESIGN (APPAREL) NC - III\n\nBased on a class intake of 25 students/trainees, the space requirements and\ntheir corresponding sizes are as follows\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in\nSq. Meters\n\nBuilding (permanent)\n\n176.25 sq. m.\nStudent/Trainee\nWorking Space\n\n1.5 x 1.5 m.\n\n2.25 sq. m.\n\n56.25 sq. m\n\nLecture/Demo Room\n\n1.5 x 2 m.\n\n3 sq. m.\n\n78 sq. m.\nLearning Resource\nCenter\n\n3 x 5 m.\n\n15 sq. m.\n\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n1.5 x 2 m.\n\n3 sq. m.\n\n27 sq. m.\n\n3.6 TRAINERS’ QUALIFICATION\nFASHION DESIGN (APPAREL) - NC III\n\nTo qualify as trainer for Fashion Design (Apparel) NC III, the person must:\n\n•\nbe a holder of National TVET Trainer Certificate Level I (NTTCI))\n•\nbe a certified Fashion Design (Apparel) NC III or equivalent qualification\n•\nbe physically and mentally fit\n•\n* have at least 5 years relevant job/industry experience\n * Optional. Only when required by the hiring institution\n Reference: TESDA Board Resolution No. 2004 03\n\n3.7\nASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA under\nthese training regulations are required to undergo mandatory national competency\nassessment upon completion of the program.\n\n--- PDF PAGE 68 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n64"
