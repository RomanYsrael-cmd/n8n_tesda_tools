      "source_text": "FASHION DESIGN (APPAREL) - NC III\n\nTo qualify as trainer for Fashion Design (Apparel) NC III, the person must:\n\n•\nbe a holder of National TVET Trainer Certificate Level I (NTTCI))\n•\nbe a certified Fashion Design (Apparel) NC III or equivalent qualification\n•\nbe physically and mentally fit\n•\n* have at least 5 years relevant job/industry experience\n * Optional. Only when required by the hiring institution\n Reference: TESDA Board Resolution No. 2004 03\n\n3.7\nASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA under\nthese training regulations are required to undergo mandatory national competency\nassessment upon completion of the program.\n\n--- PDF PAGE 68 ---\nTR Fashion Design (Apparel) NC III (Garment Sector)\n64",
