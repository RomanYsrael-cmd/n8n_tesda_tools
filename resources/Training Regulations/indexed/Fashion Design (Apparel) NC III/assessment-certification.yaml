      "text": "5 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”. --- PDF PAGE 69 --- TR Fashion Design (Apparel) NC III (Garment Sector) 65 Perform basic maintenance Garment Sector FASHION DESIGN (APPAREL) NC III Apply quality standard Carry out measurements and calculation Set-up and operate machines Lead workplace communication Work with others Work in team environment Lead small teams Solve problems related to work activities Receive and respond to workplace communication Participate in workplace communication Apply problem solving techniques to workplace Plan and organize work Practice career professionalism Demonstrate work values Practice occupational health and safety procedures Develop and practice negotiation skills Use mathematical concepts and techniques Use relevant technologies Utilize specialized communication skills Develop team and individual Collect, analyze and organize information Promote environmental protection Practice basic housekeeping procedures Prepare and Cut Materials of Ladies’ Casual Apparel Sew Ladies’ Casual Apparel Draft and Cut Pattern of Ladies’ Casual Apparel Apply Finishing Touches on Ladies’ Casual Apparel Draft and Cut Pattern of Ladies High Fashion Apparel Draft and Cut Pattern of Casual Apparel Prepare and Cut Materials of Ladies’High Fashion Apparel Draft and Cut Pattern of Ladies’ Formal Apparel Prepare and Cut Materials of Ladies’ Formal Apparel Sew Ladies’ Formal Apparel Apply finishing touches on Ladies’ Formal Apparel Sew Ladies’ High Fashion Apparel Apply Finishing Touches on Ladies’ High Fashion Apparel Create Garment Designs Calculate and Procure Garment Materials Supervise Garment Prototype Preparation and Mass Production Evaluate Finished Product Supervise packaging and dispatching of Finished Product Perform promotional activities for fashion products and/or services --- PDF PAGE 70 --- TR Fashion Design (Apparel) NC III (Garment Sector) 66 Figure details refers to full or partial body drawings. Hands-on a form of experiential learning that offers students the total environment in which they are expected to learn the content. It involves directly observing and practicing the ins and outs of a particular industry in “real time”. Lecture/Demonstration a teaching procedure that consists of conveying content of the course to the student through discourse, including explanation and clarification of major ideas. It also involves the teacher performing various procedures that the students shall observe. Modiste supplies refers to materials used for pattern-making and sewing. Simulation a form of experiential learning in which the students participate in class activities that will require them to assume roles under a particular scenario. Simulation activities include, but not limited to, games, acting out (role-playing), and mock demonstrations. These activities are part of the hands-on methodology. Study Tour attaining specific learning goals through on-site experience. These learning goals are explicitly stated in the course syllabus. Sustainable Fashion also called eco fashion, is a part of the growing design philosophy and trend of sustainability, the goal of which is to create a system which can be supported indefinitely in terms of environmentalism and social responsibility. Trimmings refers to accessories and items such as lace, ric-rac, soutache and ribbons. Soutache a narrow flat ornamental decorative braid used in the trimming of drapery or clothing. Ric-rac is a flat narrow braid woven in zigzag form used as trimming in clothing. Mood board is a collation of images, texts & samples wherein the design inspiration is derived. Prototype is a preliminary model or an early sample to test a design. Swatch is a sample strip cut from a piece of material. Dress form is a tool to view the 3-dimensional parts of a garment being sewn. Ham/Sleeve board are tools used for pressing garment parts such as sleeves bust area, collars and dart areas. Specification Sheet refers to a data containing the final instruction regarding sizes, stitches, etc. --- PDF PAGE 71 --- The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. JOHNNY H. ABAD Fashion Designer /Chairman, Board of Directors Academic Director Fashion Designers’ Association of the School of Fashion and the Arts (SOFA) Philippines (FDAP) ISABELO S. DELA CRUZ, JR. FRANCISCO Z. CALAQUIAN Fashion Designer /Board of Director Fashion Designer /Owner Fashion Designers’ Association of the Francis Z. Calaquian Fashion Salon Philippines (FDAP) JULIUS JOSE F. ORNUM RICHARD M. PAPA Fashion Designers’ Association of the Fashion Designer /Vice-President for External Affairs Philippines (FDAP) Fashion Designers’ Association of the Philippines (FDAP) Owner, C4 Couture The Participants in the Validation of this Training Regulation JOEL L. BAUTISTA DANILO M. FRANCO Fashion Designer /Owner Fashion Designer /Owner Joel Bautista Fashion Salon Fashion by the Wedding Designers of the Danilo Franco Creations Philippines (FWDP) NORLANDO A. PINEDA Fashion Designer/Owner DENNIS C. MARTIN Alan Pineda Fashion Salon Fashion Designer /Owner Dennis Martin Couture Shop Fashion by the Wedding Designers of the Philippines (FWDP) • The Members of the TESDA Board • The MANAGEMENT and Staff of the TESDA Secretariat • Qualifications and Standards Office (QSO)"
