        "source_title": "RECEIVE AND RESPOND TO WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nAUDIO PRODUCTION SERVICES NC I             Revision 00                       Promulgated (12/17/2019)                     \n2 \nSECTION 2  \nCOMPETENCY STANDARDS \n \nThis section gives the details of the contents of the units of competency required in \nAUDIO PRODUCTION SERVICES NC I. These units of competency are categorized into \nbasic, common and core competencies. \n  \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nRECEIVE AND RESPOND TO WORKPLACE \nCOMMUNICATION  \n \nUNIT CODE \n: \n400311101 \n \n \nUNIT DESCRIPTOR \n:  This unit covers the knowledge, skills and attitudes required to \nreceive, respond and act on verbal and written communication. \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Follow routine   \n     spoken  \n     messages \n1.1  Required information is \ngathered by listening \nattentively and correctly \ninterpreting or \nunderstanding  \ninformation/ instructions \n1.2  Instructions/ information \nare recorded in \naccordance with \nworkplace requirements \n1.3  Instructions are acted \nupon immediately  in \naccordance with \ninformation received  \n1.4  Clarification is sought \nfrom workplace \nsupervisor on all \noccasions when any \ninstruction/ information \nis not clear  \n1.1 Organizational \npolicies/ guidelines \nin regard to \nprocessing \ninternal/external \ninformation \n1.2 Ethical work \npractices in \nhandling \ncommunications \n1.3 Overview of the \nCommunication \nprocess \n1.4 Effective note-\ntaking and \nquestioning \ntechniques \n1.1 Conciseness in \nreceiving and \nclarifying \nmessages/ \ninformation/ \ncommunication \n1.2  Accuracy in \nrecording \nmessages/ \ninformation \n1.3 Basic \ncommunication \nskills \n1.4 Active-listening \nSkills \n1.5 Note-taking skills \n1.6 Clarifying and \nprobing \nquestions \n(questioning \nskills) \n2. Perform \nworkplace \nduties \nfollowing \nwritten notices \n2.1 Written notices and \ninstructions are read \nand   interpreted \ncorrectly in accordance \nwith organizational \nguidelines \n2.2   Routine written \ninstructions are \nfollowed in sequence \n2.3 Feedback is given to \nworkplace supervisor \nbased on the \ninstructions/ \ninformation received  \n2.1   Organizational \nguidelines in \nregard to \nprocessing \ninternal/ external \ninformation \n2.2   Ethical work \npractices in \nhandling \ncommunications \n2.3   Overview of the \nCommunication \nprocess \n \n2.1  Conciseness in \nreceiving and \nclarifying \nmessages/ \ninformation/ \ncommunication \n2.2  Accuracy in \nrecording \nmessages/ \ninformation \n2.3  Clarifying and \nprobing \nquestions \n(Questioning\n\n--- PDF PAGE 7 ---\nAUDIO PRODUCTION SERVICES NC I             Revision 00                       Promulgated (12/17/2019)                     \n3 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.4   Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n \nSkills) \n2.4  Skills in reading \nand recording \nand labeling data  \n2.5  Skills in locating \ninformation \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Written notices and \ninstructions \nMay include: \n1.1. Written work instructions \n1.2. Internal memos/memorandum \n1.3. Business letters \n1.4. External communications \n1.5. Electronic mail \n1.6. Briefing notes \n1.7. General correspondence \n1.8. Marketing materials \n1.9. Guidelines/Circulars  \n2. Organizational \nguidelines \nMay include: \n2.1. Information documentation procedures \n2.2. Company guidelines and procedures \n2.3. Standard Operating Procedure (SOPs) \n2.4. Organization manuals \n2.5. Departmental Policies and Procedures Manual \n2.6. Service manual\n\n--- PDF PAGE 8 ---\nAUDIO PRODUCTION SERVICES NC I             Revision 00                       Promulgated (12/17/2019)                     \n4 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Demonstrated knowledge and understanding of \norganizational procedures in handling verbal and \nwritten communications \n1.2   Received and acted on verbal messages and \ninstructions correctly and efficiently \n1.3   Demonstrated ability in recording \ninstructions/information \n1.4  Utilized effective clarifying and probing techniques \nwhere necessary  \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Pens \n2.2   Note pads \n2.3  Computer (if applicable) \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1    Demonstration on communication skills  (e. g., role-   \nplaying) \n3.3    Oral questioning/Interview \n3.3    Written Test      \n4.  Context for \nAssessment \n4.1    Competency may be assessed individually in the \nactual workplace or in a simulated environment in \nTESDA-accredited institutions\n",
