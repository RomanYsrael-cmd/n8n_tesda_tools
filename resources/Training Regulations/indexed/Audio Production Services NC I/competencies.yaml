        "source_text": "CRE352101\n\nUNIT DESCRIPTOR : This unit covers the skills and knowledge to handle,\n set up and de-rig a range of audio equipment for different\n productions in the cultural and creative industries.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\naudio\nproduction\nrequirements\n1.1 Technical riders are\nidentified and discussed\nwith relevant personnel\naccording to production\nrequirements\n1.2 Locations are surveyed\nfor assessment\npurposes\n1.3 Equipment and\naccessories are\nobtained to ensure\nconsistency with the\nproduction requirements\nbefore commencement\nof production\n1.1 Company rules and\nregulations,\nstandards and\noperating\nprocedures\n1.2 Occupation Health\nand Safety and\nmaterial safety\ndatasheet\n1.3 Basic knowledge in\nthe Physics of\nSound\n1.4 Audio Fundamentals\nand Analysis\n1.5 Audio Production\nDesign Layouts/\nPlans\n1.6 Basic Mathematics\n1.7 Basic Electronics\n1.8 Basic Electrical\n1.9 Basic classification\nof Audio equipment\n (brand, model, and\ntechnical\nspecification data)\n1.10\nOSH Law\n1.11\nDOLE DO 198 s\n2018\n1.12\nOccupational\nhearing loss\n1.13\nWork\nenvironment\nmeasure\n1.14\nMedical\nsurveillance and\naudiometry\n\n1.1 Communicating\nideas and\ninformation with\nindustry\npersonnel\n1.2 Maintaining\nclean and\norderly\nworkplace/\nproduction\nenvironment\n1.3 Demonstrating\nmanual\ndexterity\n1.4 Working with\nothers and in\nteams\n1.5 Planning and\norganizing\nactivities\n1.6 Language,\nliteracy and\nnumeracy skills\nappropriate to\nthe job role and\nfunction e.g.\ndocumenting\npackaging\ninformation and\nrecording\nprocedures\n1.7 Observing OSH\nlaw\n1.8 Observing\nDOLE DO 198 s\n2018\n1.9 Work\nenvironment\nmeasure skills\n\n--- PDF PAGE 64 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n60\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nth