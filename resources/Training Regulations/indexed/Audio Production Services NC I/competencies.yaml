        "source_text": "400311106\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required\nto identify, gather, interpret and maintain information.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify and\ngather\nneeded\ninformation\n1.1. Required\ninformation is\nidentified based\non requirements.\n1.2. Sources to\nproduce required\ninformation are\nidentified and\naccessed\n1.3. Report information\nis collected,\norganized and\nrecorded\n1.4. Organize\ninformation is\ncollected in a way\nthat enables easy\naccess and\nretrieval by other\nstaff\n1.1. Policies, procedures\nand guidelines\nrelating to\ninformation handling\nin the public and\nprivate sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n1.2. Data collection and\nmanagement\nprocedures\n1.3. Cultural aspects of\ninformation and\nmeaning\n1.4. Sources of public\nsector work-related\ninformation\n1.5. Public/private sector\nstandards\n1.1. Handling policies,\nprocedures and\nguidelines relating\nto information\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n1.2. Collecting data and\nmanaging\nprocedures\n1.3. Practicing cultural\naspects of\ninformation and\nmeaning\n1.4. Using\npublic/private\nsector standards\n2. Search for\ninformation on\nthe internet or an\nintranet\n2.1. Engine is search\nto find and select\nappropriate\ninformation\n2.2. Suitable\ntechniques is use\nto make it easier to\nfind useful\ninformation and to\npass it on to others\n2.3. Records are use\nwhere useful\ninformation came\nfrom\n2.4. Results are used\nfor searches of\nuseful information\n2.5. Search engine is\nchosen\nappropriate for the\ninformation that is\nneeded\n2.1. Find and select\nappropriate\ninformation\n2.2. Techniques in\nfinding useful\ninformation\nRecords are use\nwhere useful\ninformation came\nfrom\n2.3. Search engines for\ninformation\n2.1. Finding and\nselecting search\nengine to find and\nselect appropriate\ninformation\n2.2. Using suitable\ntechniques to find\nuseful information\neasier\n2.3. Using records\n2.4. Carrying out\nSearches\n\n--- PDF PAGE 25 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n21\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2.6. Searches are carry\nout as per\nrequirements\n3. Examine\ninformation\n3.1. Information and its\nsources are\nevaluated for\nrelevance and\nvalidity to\nbusiness and/or\nclient\nrequirements.\n3.2. Information is\nexamined as\nrequired to identify\nkey issues.\n3.3. Detailed\nevaluation of\ninformation is\ncarried out as\nrequired using\nrelevant\ntechniques\nincluding\nmathematical\ncalculations.\n3.1. Data evaluation\nprocedures\n3.2. Cultural aspects of\ninformation and\nmeaning\n3.3. Sources of public\nsector work-related\ninformation\n3.4. Public sector\nstandards\n3.1. Evaluating data\n3.2. Practicing cultural\naspects of\ninformation and\nmeaning\n3.3. Using public\nsector standards\n\n4. Secure\ninformation\n4.1. Basic file-handling\ntechniques are\nused for the\nsoftware\n4.2. Techniques is\nused to handle,\norganize and\nsecure\ninformation\n4.1. Policies,\nprocedures and\nguidelines relating\nto information\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n4.2. Basic file-handling\ntechniques\n4.3. Techniques in\nhandling,\norganizing and\nsaving files\n4.4. Electronic and\nmanual filing\nsystems\n4.1. Handling policies,\nprocedures and\nguidelines relating\nto information\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n4.2. Using basic file-\nhandling\ntechniques is\nused for the\nsoftware\n4.3. Using different\ntechniques in\nhandling,\norganizing and\nsaving files\n4.4. Using electronic\nand manual filing\nsystems\n\n--- PDF PAGE 26 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n22\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Manage\ninformation\n5.1. Information and\nrecords are\nmaintained to\nensure data and\nsystem integrity\nusing a range of\nstandard and\ncomplex\ninformation\nsystems and\noperations.\n5.2. Routine data and\nrecords are\nreconciled as\nrequired.\n5.3. Inadequacies in\nsystem/s relating\nto information\nretrieval are\nidentified and\ncorrected or\nreported to\nrelevant staff as\nrequired.\n5.1. Policies, procedures\nand guidelines\nrelating to\ninformation handling\nin the public sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n5.2. Data collection and\nmanagement\nprocedures\n5.3. Organizational\ninformation handling\nand storage\nprocedures\n5.4. Cultural aspects of\ninformation and\nmeaning\n5.5. Sources of public\nsector work-related\ninformation\n5.6. Public sector\nstandards\n5.7. Databases and data\nstorage systems\n\n5.1. Handling policies,\nprocedures and\nguidelines relating\nto information\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n5.2. Collecting data\nand managing\nprocedures\n5.3. Handling\norganizational\ninformation and\nstorage\nprocedures\n5.4. Practicing cultural\naspects of\ninformation and\nmeaning\n5.5. Using public\nsector standards\n5.6. Managing\ndatabases and\ndata storage\nsystems\n\n--- PDF PAGE 27 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n23\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nMay include:\n1.1. Property\n1.2. Organizational\n1.3. Technical reference\n2. Search engine\nMay include:\n2.1.\nCrawler-based search engine\n2.1.1. Google\n2.1.2. AlltheWeb\n2.1.3. AltaVista\n2.2.\nHuman-powered direc