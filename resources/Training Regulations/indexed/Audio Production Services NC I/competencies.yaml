        "source_text": "CRE265202\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nexhibit professional practice covering the development of\nconceptual,\ncreative\nand\nartistic\ncapabilities\nand\nthe\nbroadening of cultural awareness.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Acquire and\ndevelop\ncreative\nthinking\n\n1.1 Concepts and ideas\nare identified and\nexplored to ensure the\ndevelopment of the\ncreative process\n1.2 Sources of creative\nthinking are explored\nand scanned from the\nenvironment\n1.3 Relevant printed\nreading materials and\nother media are used\nto stimulate creative\nideation\n1.4 Feedback, interaction,\ndiscussion and\nevaluation\nopportunities to\ncontinuously improve\ncreative thinking are\nused.\n\n1.1. Exposure to\ncreative thinking\ntheories, exercises\nand techniques\n1.2. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n1.3. Awareness of\ncopyright, moral\nrights and\nintellectual\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n1.1. Communication\nskills\n1.2. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n1.3. Convergent\nthinking\n1.4. Divergent thinking\n1.5. Collaboration and\nbrain storming\n1.6. Integrated thinking\n1.7. Critical thinking\n2. Develop\nartistic skills\n2.1. Strategies, methods\nand approaches are\nidentified and explored\nin developing the\nartistic work.\n2.2. Artistic work is\nreviewed, evaluated\nand finalized based on\napplicable and\naccepted standards of\nthe field\n2.3. Relevant printed\nreading materials and\nother media are used\nto stimulate artistic and\nprofessional\ndevelopment\n\n2.1. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n2.2. Elements of arts\n2.3. Principles of\ncomposition\n2.4. Physical\nproperties and\ncapabilities of\nmaterial, tools\nand equipment\nand their\napplication\n2.5. Awareness of\nsocio-cultural and\nintellectual\n2.1. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n2.2. Communication\nskills\n2.3. Basic artistic/\nvisual\n2.3.1. Drawing/\nIllustration\n2.3.2. Coloring\n2.3.3. Body\nmovements\n2.3.4. Words/text/\n2.3.5. Graphics\n2.3.6. Sound\n\n--- PDF PAGE 46 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n42\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2.4. Capabilities of\nmaterials, tools and\nequipment are explored\nto enable artistic\noutputs.\n2.5. Feedback, critique,\ndiscussion and\nevaluation mechanisms\nare continuously\napplied to improve\nartistic skills.\n2.6. Work experiences and\nideas are discussed to\nimprove own practice.\n2.7. Other artistic works are\nstudied to stimulate the\ndevelopment of\nconceptual and artistic\nskills.\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n2.6. Creative thinking\ntheories,\nexercises and\ntechniques\n\n3. Broaden\nexposure to\nculture and\narts\n3.1. Studies on arts and\nculture are generated\nbased on required\nlearning objectives.\n3.2. Cultural immersion\nopportunities that may\nbe helpful in developing\ncareer opportunities\nare experienced.\n3.3. Insights and\nexperiences on arts\nand culture are shared,\ndiscussed and reflected\nupon.\n3.1. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n3.2. Elements of arts\n3.3. Principles of\ncomposition\n3.4. Physical\nproperties and\ncapabilities of\nmaterial, tools\nand equipment\nand their\napplication\n3.5. Awareness of\nsocio-cultural and\nintellectual\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n3.6. Creative thinking\ntheories,\nexercises and\ntechniques\n\n3.1. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n3.2. Basic\nartistic/visual\ncommunication\nskills\n3.2.1. Drawing/\nillustration\n3.2.2. Coloring\n3.2.3. Body\nmovements\n3.2.4. Words/text/\ngraphics\n3.2.5. Sound\n\n--- PDF PAGE 47 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\n\nMay include:\n1.1\nWorking effectively with Assessor / Trainor\n1.2\nParticipating in professional development activities\n1.3\nParticipating in relevant groups or associations\n1.4\nExperimenting\n1.5\nCommunicating with peers\n\n2. Artistic Skills\nMay include:\n2.1\nPainting and drawing\n2.2\nPhotography/videography/cinematography\n2.3\nDance, body movements and body sculpture\n2.4\nArts and crafts\n2.5\nInformation technology, including relevant hardware and\nsoftware\n2.6\nCreative interpretation/drama\n2.7\nSound and music\n\n3. Studies on arts\nand culture\nMay include:\n3.1\nPhilippine arts and culture\n3.2\nAsian arts and culture\n3.3\nWestern arts and culture\n3.4\nPhilippine theater\n3.5\nFilm history\n3.6\nContemporary art and media\n3.7\nOther artistic and cultural fields\n\n4. Learning\nobjectives\nMay include:\n4.1\nStudy guide\n4.2\nDiscussion topic\n4.3\nProject brief\n4.4\nResearch topic/agenda\n\n5. Cultural\nimmersion\nopportunities\nMay include:\n5.1\nArts and cultural festivals\n5.2\nExhibitions/screening/staging\n5.3\nCommunity events\n5.4\nMembership of specialization-specific organization\n5.5\nCultural exchange programs\n5.6\nWorkshop/Studio visitations\n\n--- PDF PAGE 48 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n44\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nApplied strategies to develop creative skills in art\npractice\n1.2\nDeveloped artistic skills and ideas\n1.3\nGenerated studies on arts and culture\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Specialized materials, tools and equipment required for\neach area of specialization and used to develop technical\nand conceptual skills relevant to art making practice\n2.2 Information about relevant artist, their work, ideas and\ntechniques\n3. Method of\nassessment\n\nCompetency must be assessed through:\n3.1 Demonstration / Observation with oral questioning\n3.2 Portfolio with interview\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n45\nUNIT TITLE\n:\nOBSERVE PROCEDURES, SPECIFICATIONS AND MANUALS\nOF INSTRUCTIONS\n\nUNIT CODE\n:"
