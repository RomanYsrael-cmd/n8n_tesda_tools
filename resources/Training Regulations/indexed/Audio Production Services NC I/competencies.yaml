 trouble\nshooting\n5.8 Basic logistic\nmanagement\n5.9 OSH Law\n5.10 DOLE DO 198 s\n2018\n5.11 Occupational\nhearing loss\n5.12 Work environment\nmeasure\n5.13 Medical\nsurveillance and\naudiometry\n\n5.1 Communicating\nand interacting\nappropriately with\ncolleagues,\nhealth care\npractitioners,\nother clients and\npatients\n5.2 Communicating\nideas and\ninformation\n5.3 Maintaining\ncleanliness\n5.4 Demonstrating\nmanual dexterity\n5.5 Working with\nothers and in\nteams\n5.6 Planning and\norganizing\nactivities\nLanguage,\nliteracy and\nnumeracy skills\nappropriate to the\njob role and\nfunction e.g.\ndocumenting\npackaging\ninformation and\nrecording\nprocedures\n5.7 Observing OSH\nlaw\n5.8 Observing DOLE\nDO 198 s 2018\n5.9 Work\nenvironment\nmeasure skills\n\n--- PDF PAGE 68 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical Riders\n\nMay include:\n1.1 Audio requirements\n1.2 Video requirements\n1.3 Lighting requirements\n1.4 Staging requirements\n1.5 Other client requirements\n\n2. Production\nrequirements\nMay include:\n2.1 Stage layout\n2.2 Input patch list\n2.4 Technical rider\n2.5 Audio equipment inventory checklist.\n\n3. Audio equipment\nMay include:\n3.1 Microphones\n3.2 Mixing consoles\n3.3 Cables and connectors\n3.4 Loudspeakers\n3.5 Signal processors\n3.6 Digital audio workstations\n3.7 Audio accessories\n\n--- PDF PAGE 69 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n65\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined audio production requirements\n1.2 Prepared and delivered audio equipment\n1.3 Set-up audio equipment\n1.4 Disassembled audio equipment\n1.5 Secured audio equipment for transit\n1.6 Applied relevant OHS practices and legislation\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Audio equipment relevant to the unit of competency\n\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1\nDirect Observation/Demonstration with oral\nquestioning\n\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 70 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n66\nUNIT OF COMPETENCY:\nPERFORM TECHNICAL ASSISTANCE AND BASIC\nTROUBLESHOOTING\n\nUNIT CODE :"
