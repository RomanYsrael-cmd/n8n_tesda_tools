        "source_text": "CRE265207\nUNIT DESCRIPTOR :\nThis unit of competency deals with the knowledge, skills and\nattitudes in providing effective client service. It includes personal\npresentation, addressing client’s needs and strengthening\nclient’s relations.\nELEMENTS\nPERFORMANCE CRITERIA\nitalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Maintain a\nprofessional\nimage\n1.1. Personal presence is\nmaintained according to\nemployer standards or\nvenue requirements\n1.2. Interpersonal skills are\nused to ensure that\ncustomer needs are\naccurately identified\n1.3. Presentation skills are\nused to communicate the\nrelevant concepts, values\nand processes in the\ndelivery of expected outputs\n1.4. Equipment and other\nresources are stored\naccording to assignment\nrequirements.\n1.1 Interactive\ncommunication\nwith others\n1.2 Safe work\npractices\n1.3 Culturally sensitive\nbehavior\n1.4 Organizational\npolicies and\nprocedures\n1.5 Common and\naccepted practices\nin the industry\n1.6 Teamwork and\ncollaboration\n Time management\n1.1. Effective\ncommunication\nskills\n1.2. Non-verbal\ncommunication\n- body language\n1.3. Good time\nmanagement\n1.4. Ability to work\ncalmly and\nunobtrusively\neffectively\n1.5. Presentation\nskills\n1.6. Interpersonal\nskills/ social\ngraces with\nsincerity\n Attentive, patient\n and cordial\n\n--- PDF PAGE 59 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n55\n\nELEMENTS\nPERFORMANCE CRITERIA\nitalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Identify and\naddress client\nrequirements\n2.1 Client requirements are\nidentified and addressed\naccording to job\nassignments\n2.2 Changes in client’s needs\nand requirements are\nmonitored and addressed\nprofessionally.\n2.3 Feedback mechanisms\nare used to address client\nrequirements.\n2.1 Interactive\ncommunication\nwith others\n2.2 Safe work\npractices\