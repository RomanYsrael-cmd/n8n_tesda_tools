sonal\npresence\nMay include:\n1.1.\nStance\n1.2.\nPosture\n1.3.\nBody Language\n1.4.\nDemeanor\n1.5.\nGrooming\n1.6.\nDress code/attire\n2. Employer\nStandards\nMay include:\n2.1.\nOrganizational Policy and Procedures\n2.2.\nCommon and accepted practices in the industry\n3. Interpersonal\nskills\nMay include:\n3.1.\nInteractive communication\n3.2.\nPublic relation\n3.3.\nGood working attitude\n3.4.\nSincerity\n3.5.\nPleasant disposition\n3.6.\nEffective communication skills\n3.7.\nTeam player\n4. Presentation skills May include:\n4.1.\nVisible work area\n4.2.\nPortfolio\n4.3.\nProject proposal\n5. Client\nrequirements\nMay include:\n5.1.\nClient Needs Analysis\n5.2.\nScope to modify instructions/orders in light of changed\n5.3.\nSituations\n5.4.\nProject brief\n5.5.\nProject script\n5.6.\nTreatment and concept\n5.7.\nDiscussion with the client/customer\n5.8.\nTimeline\n6. Feedback\nmechanism\nMay include:\n6.1.\nCommunication devices\n6.1.1. Telephone\n6.1.2. Mobile phone\n6.1.3. Fax machine\n6.1.4. Online correspondence\n6.2.\nSocial media analytics\n6.3.\nContact reports\n6.4.\nFocus Group Discussion\n6.5.\nEvaluation and Critiques\n6.6.\nPunch List\n\n--- PDF PAGE 62 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n58\n EVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1. Maintained a professional image\n1.2. Identified and addressed client requirements\n1.3. Strengthened relations with clients\n2. Resource\nimplications\nThe following resources should be provided:\n2.1. Tools materials and equipment needed to perform the\n required tasks\n2.2. References and manuals\n2.3. Sample terms of reference\n\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration/observation with oral questioning\n\n4. Context for\nassessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PA