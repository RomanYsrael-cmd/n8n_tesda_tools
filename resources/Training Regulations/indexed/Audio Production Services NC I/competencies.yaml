istic works are\nstudied to stimulate the\ndevelopment of\nconceptual and artistic\nskills.\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n2.6. Creative thinking\ntheories,\nexercises and\ntechniques\n\n3. Broaden\nexposure to\nculture and\narts\n3.1. Studies on arts and\nculture are generated\nbased on required\nlearning objectives.\n3.2. Cultural immersion\nopportunities that may\nbe helpful in developing\ncareer opportunities\nare experienced.\n3.3. Insights and\nexperiences on arts\nand culture are shared,\ndiscussed and reflected\nupon.\n3.1. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n3.2. Elements of arts\n3.3. Principles of\ncomposition\n3.4. Physical\nproperties and\ncapabilities of\nmaterial, tools\nand equipment\nand their\napplication\n3.5. Awareness of\nsocio-cultural and\nintellectual\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n3.6. Creative thinking\ntheories,\nexercises and\ntechniques\n\n3.1. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n3.2. Basic\nartistic/visual\ncommunication\nskills\n3.2.1. Drawing/\nillustration\n3.2.2. Coloring\n3.2.3. Body\nmovements\n3.2.4. Words/text/\ngraphics\n3.2.5. Sound\n\n--- PDF PAGE 47 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\n\nMay include:\n1.1\nWorking effectively with Assessor / Trainor\n1.2\nParticipating in professional development activities\n1.3\nParticipating in relevant groups or associations\n1.4\nExperimenting\n1.5\nCommunicating with peers\n\n2. Artistic Skills\nMay include:\n2.1\nPainting and drawing\n2.2\nPhotography/videography/cinematography\n2.3\nDance, body movements and body sculpture\n2.4\nArts and crafts\n2.5\nInformation technology, including relevant hardware and\nsoftware\n2.6\nCreative interpretation/drama\n2.7\nSound and music\n\n3. Studies on arts\nand culture\nMay include:\n3.1\nPhil