        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified need for innovation in the area of work\n1.2\nRecognized innovative and creative ideas\n1.3\nPursed agreement for flexible and innovative ways of\nworking\n1.4\nSupported individuals and people to access flexible\nand innovative ways of working\n2. Resource\nImplications\nSpecific resources for assessment\n2.1.\nEvidence of competent performance should be\nobtained by observing an individual in an information\nmanagement role within the workplace or operational\nor simulated environment.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Test\n3.2. Interview\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment\nof other relevant units of competency. Assessment\nwill occur over a range of situations, which will include\ndisruptions to normal, smooth operation. Simulation\nmay be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be\nbased on the actual workplace and will include walk\nthrough of the relevant competency components.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 24 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n20\nUNIT OF COMPETENCY :\nACCESS AND MAINTAIN INFORMATION\n\nUNIT CODE\n:"
        },
        "source_text": "400311105\n\nUNIT DESCRIPTOR\n\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to identify, recognize and support innovation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify the need\nfor innovation in\none’s area of\nwork\n1.1 The value of\ninnovative\npractices in the\nworkplace is\nrecognized\n1.2 Creativity in\ninnovation in one’s\nscope of work is\napplied\n1.3 The need for\ninnovation in own\nscope of work is\nrecognized\n1.1 Clear-cut\ndefinition of\ninnovation\n1.2 Current practice\nin own scope of\nwork\n1.3 Workplace\nprocedures\n1.1 Contributing in\nbrainstorming\nsession\n1.2 Examining current\npractice in one’s\nscope of work\n1.3 Identifying issues\nand concerns of\none’s scope of\nwork\n2. Recognize\ninnovative and\ncreative ideas\n2.1 Opportunities within\nthe team are\nidentified to develop\ninnovation\n2.2 Creative ideas of\ncoworkers pertaining\nto work practices are\nanalyzed\n2.3 Environment\nconducive for\nlearning and\ninnovating is\nmaintained\n2.1 Support required\nto generate\ncreative ideas\n2.2 Difference\nbetween\ninnovation and\ncreativity\n2.3 Innovative\nclimate in one’s\nscope of work\n2.1 Identifying\nresources required\nfor creativity and\ninnovation\n2.2 Examining\npotential obstacles\nto and\nopportunities for\ncreativity and\ninnovation\n2.3 Communicating\ncreative ideas of\nco-workers\n3. Support\nindividuals’\naccess to\nflexible and\ninnovative ways\nof working\n3.1 Individuals and key\npeople are\nreinforced to identify\ninnovative ideas to\nachieve outcomes\n3.2 Sharing of best\npractices using\nflexible and\ninnovative ways of\nworking is\naccomplished\n3.3 Obstacles to\nprogress in\nimplementing flexible\nand innovative ways\nof working are\nrecognized\n3.1 The role of\nemployees/work\ners in the\nimprovement of\npractices in the\norganization\n3.2 Best practices\nusing flexible\nand innovative\nways of working\n3.3 Obstacles in\nimplementing\ninnovation in\none’s scope of\nwork\n3.1 Encouraging co-\nworkers to\ngenerate and\ndevelop ideas\n3.2 Evaluating\npotential\nobstacles to and\nopportunities for\ncreativity and\ninnovation\n3.3 Sharing of best\npractices related\nto innovation and\ncreativity\n\n--- PDF PAGE 23 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Innovative practices\nMay include:\n1.1\nSelf-directed support\n1.2\nCommunity based services\n1.3\nWorking within a collaborative arrangement\n1.4\nMaking scope of work more efficient\n2. Innovation\nMay include:\n2.1\nNew ideas\n2.2\nOriginal ideas\n2.3\nDifferent ideas\n2.4\nMethods or tools\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified need for innovation in the area of work\n1.2\nRecognized innovative and creative ideas\n1.3\nPursed agreement for flexible and innovative ways of\nworking\n1.4\nSupported individuals and people to access flexible\nand innovative ways of working\n2. Resource\nImplications\nSpecific resources for assessment\n2.1.\nEvidence of competent performance should be\nobtained by observing an individual in an information\nmanagement role within the workplace or operational\nor simulated environment.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Test\n3.2. Interview\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment\nof other relevant units of competency. Assessment\nwill occur over a range of situations, which will include\ndisruptions to normal, smooth operation. Simulation\nmay be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be\nbased on the actual workplace and will include walk\nthrough of the relevant competency components.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 24 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n20\nUNIT OF COMPETENCY :\nACCESS AND MAINTAIN INFORMATION\n\nUNIT CODE\n:"
