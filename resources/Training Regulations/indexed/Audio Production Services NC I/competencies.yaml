          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nDeveloped SMART personal and career goals\n1.2\nApplied goal setting principles\n1.3\nIdentified sensitively the positive and negative emotions\nin the workplace\n1.4\nResponded with appropriate emotions in the workplace\n1.5\nIdentified possible consequences of inappropriate\nemotional responses in a social and work-related\ncontext\n1.6\nApplied learning styles to positively influence\nschool/work performance\n1.7\nDeveloped reflective practice through realization of\nlimitations, likes/ dislikes; through showing of self-\nconfidence\n2. Resource\nImplications\nThe following resources for should be provided:\n2.1\n Access to workplace and resources\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning (ex.\nhow to recognize emotions)\n3.2\nCase problems involving workplace diversity issues\n3.3\nThird-party report\n4. Context for\nAssessment\n3.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n\n--- PDF PAGE 22 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n18\nUNIT OF COMPETENCY\n: SUPPORT INNOVATION\n\nUNIT CODE\n\n:"
