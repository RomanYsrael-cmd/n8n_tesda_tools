        "source_text": "400311103\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required\nto solve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the\nroot cause of routine problems.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nproblem\n1.1 Desired\noperating/output\nparameters and\nexpected quality of\nproducts/services are\nidentified.\n1.2 The nature of the\nproblem by observation\non routines are\ndefined.\n1.3 Problems are stated\nand specified clearly.\n1.1 Competence\nincludes mastery of\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n1.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of problems\nroutine problems\nand to determine\nthe corrective\nactions.\n1.3 Relevant\nequipment and\noperational\nprocesses\n1.4 Enterprise goals,\ntargets and\nmeasures\n1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n1.6 Enterprise\ninformation\nsystems and data\ncollation\n1.7 Industry codes and\nstandards\n1.1 Using range of\nformal problem-\nsolving techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n1.2 Identifying and\nclarifying the\nnature of the\nproblem.\n\n--- PDF PAGE 13 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n9\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Assess\nfundamental\ncauses of the\nproblem\n2.1 Problem-solving tool\nappropriate to the\nproblem and the\ncontext is selected\n2.2 Possible causes\nbased on experience\nand the use of\nproblem-solving\ntools/basic analytical\ntechniques are\nidentified\n2.3 Possible fundamental\ncauses of problems\nare