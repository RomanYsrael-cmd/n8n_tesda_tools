        "source_text": "CRE352102\nUNIT DESCRIPTOR :\nThis unit describes the skills to provide and deliver audio\ntechnical assistance and basic troubleshooting for different\nproductions in the cultural and creative industries.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide technical\nassistance to\nartists and\nproduction staff\n\n1.1 Technical issues\nobserved and/or\ncommunicated are\ndetermined\n1.2 Technical assistance\nrequested and\ncommunicated by the\nartists and production\nstaff are attended to\n1.3 Technical issues are\nsolved and assistance\nrequested are provided\n\n1.1 Company rules and\nregulations,\nstandards and\noperating\nprocedures\n1.2 Audio\nFundamentals and\nAnalysis\n1.3 Occupation Health\nand Safety and\nmaterial safety\ndatasheets\n1.4 Basic audio design\nproduction layouts\n1.5 Basic electronics\n1.6 Basic Electrical\n1.7 Basic classification\nof Audio equipment\n (brand, model, and\ntechnical\nspecification data)\n1.8 Basic knowledge\non varying signal\nchain\n1.9 OSH Law\n1.10 DOLE DO 198 s\n2018\n1.11 Occupational\nhearing loss\n1.12 Work\nenvironment\nmeasure\n1.13 Medical\nsurveillance and\naudiometry\n\n1.1 Communicating\nideas and\ninformation with\nindustry\npersonnel\n1.2 Maintaining\ncleanliness\n1.3 Demonstrating\nmanual dexterity\n1.4 Working with\nothers and in\nteams\n1.5 Planning and\norganizing\nactivities\n1.6 Language,\nliteracy and\nnumeracy skills\nappropriate to\nthe job role and\nfunction e.g.\ndocumenting\npackaging\ninformation and\nrecording\nprocedures\n1.7 Observing OSH\nlaw\n1.8 Observing\nDOLE DO 198 s\n2018\n1.9 Work\nenvironment\nmeasure skills\n\n--- PDF PAGE 71 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n67\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Determine and\nresolve technical\naudio\nproblems/issues\n2.1 Audio equipment\nare positioned and\nconnected\naccording to safety\nand production\nrequirements\n2.2 Audio equipment\nand connectivity are\nlabelled according\nto organizational\nrequirements\n2.3 Line and sound\nchecks are\nconducted\naccording to\nTechnical\nrequirement\n\n2.1 Company rules and\nregulations,\nstandards and\noperating procedures\n2.2 Audio Fundamentals\nand Analysis\n2.3 Occupation Health\nand Safety and\nmaterial safety\ndatasheets\n2.4 Basic audio design\nproduction layouts\n2.5 Basic electronics\n2.6 Basic Electrical\n2.7 Basic classification of\nAudio equipment\n(brand, model, and\ntechnical\nspecification data)\n2.8 Basic knowledge on\nvarying signal chain\n2.9 OSH Law\n2.10 DOLE DO 198 s\n2018\n2.11 Occupational\nhearing loss\n2.12 Work environment\nmeasure\n2.13 Medical\nsurveillance and\naudiometry\n\n2.1 Basic\ntroubleshooting\nskills\n2.2 Communicating\nideas and\ninformation with\nindustry personnel\n2.3 Maintaining\ncleanliness\n2.4 Demonstrating\nmanual dexterity\n2.5 Working with others\nand in teams\n2.6 Planning and\norganizing activities\n2.7 Language, literacy\nand numeracy skills\nappropriate to the\njob role and\nfunction e.g.\ndocumenting\npackaging\ninformation and\nrecording\nprocedures\n2.8 Observing OSH law\n2.9 Observing DOLE\nDO 198 s 2018\n2.10\nWork\nenvironment\nmeasure skills\n\n--- PDF PAGE 72 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n68\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Technical issues\nMay include:\n1.1 Signal continuity\n1.2 Audio signal issues\n1.3 Equipment malfunction\n1.4 Electrical issues\n\n2. Technical\nassistance\nMay include:\n2.1 Audio equipment set-up\n2.2 Connectivity/Interfacing\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Provided technical assistance to artists and production\nstaff\n1.2 Determined and resolved technical audio\nproblems/issues\n1.3 Applied relevant