.2 Peers/work colleagues\n4.3\nOther members of the organization\n\n--- PDF PAGE 17 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n13\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem.\n1.2.\nDetermined the fundamental causes of the\nproblem.\n1.3.\nDetermined the correct / preventive action.\n1.4.\nDeveloped action plans in managing routine\nproblems.\nThese aspects may be best assessed using project-\nbased learning mode of assessment and case\nformulation.\n2. Resource\nImplications\nAssessment will require access to a workplace over an\nextended period, or a suitable method of gathering\nevidence of operating ability over a range of situations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Case Formulation\n3.2. Life Narrative Inquiry (Interview)\n3.3. Standardized test\nThe unit will be assessed in a holistic manner as is\npractical\nand\nmay\nbe\nintegrated\nwith\nthe\nassessment of other relevant units of competency.\nAssessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth\noperation. Simulation may be required to allow for\ntimely assessment of parts of this unit of\ncompetency. Simulation should be based on the\nactual workplace and will include walk through of\nthe relevant competency components.\nThese assessment activities should include a range\nof problems, including new, unusual and improbable\nsituations that may have happened.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 18 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n14\nUNIT OF COMPETENCY : ENHANCE SELF-MANAGEMENT SKILLS\n\nUNIT CODE\n:\n400311104\n\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills, and attitudes in applying\nthe ability to regulate actions, make good decisions, and show\nappropriate behavior based on self-awareness.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Set personal\nand career\ngoals\n1.1 The difference\nbetween personal\nand career goals are\ndescribed\n1.2 Clear and concise\npersonal and career\ngoals are developed\n1.3 Characteristics of\nmotivational goals\naccording to Locke\n&Latham are\nidentified\n1.1 Definition of\npersonal goals and\ncareer goals\n1.2 SMART Model for\ngoal setting\n1.3 Five principle of goal\nsetting according to\nLocke & Latham\n(Clarity, Challenge,\nCommitment,\nFeedback, and\nTask complexity)\n1.1 Setting of personal\nand career goals\n1.2. Defining, creating,\nand mapping\npersonal and\ncareer goals\nusing SMART\nModel for goal\nsetting\n1.3 Applying goal\nsetting principles\nto personal and\ncareer goals\n2. Recognize\nemotions\n2.1 Influence that people,\nsituations and events\nhave on emotions\nare described\n2.2Importance of\nresponding with\nappropriate emotions\nare explained\n2.3 Influences on and\nconsequences of\nemotional responses\nin a social and\nwork-related\ncontexts are\nexamined\n2.1 Common positive\nand negative\nemotions\nmanifested in the\nworkplace\n2.2 Professional and\nnon-professional\nbehaviors in the\nworkplace\n2.3 Triggers and\nimplications of\npositive and\nnegative emotions\nin the workplace\n2.1 Identifying\nsensitively the\npositive and\nnegative\nemotions in the\nworkplace\n2.2. Responding with\nappropriate\nemotions in the\nworkplace\n2.3 Identifying\npossible\nconsequences of\ninappropriate\nemotional\nresponses in a\nsocial and work-\nrelated context\n\n--- PDF PAGE 19 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n15\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Describe\noneself as a\nlearner\n3.1 Factors and strategies\nthat assist learning\nare identified and\ndescribed\n3.2 Preferred learning\nstyles according to\nVAK Learning Style\nModel and Kolb’s\nTheory of Learning\nStyles are identified\n3.3 Range of learning\nstrategies\nappropriate to\nspecific tasks and\ndescribe work\npractices that assist\ntheir learning are\nidentified and chosen\n3.1 Kolb’s Theory of\nLearning Styles\n(Converger,\nDiverger,\nAssimilator,\nAccommodator)\n3.2 VAK Learning Style\nModel (Visual,\nAuditory,\nKinesthetic)\n3.3 Range of learning\nstrategies\nappropriate to\nspecific tasks and\ndescribe work\npractices that assist\ntheir learning\n\n3.1 Identifying factors\nand strategies that\nassist learning\n3.2 Applying learning\nstyles to positively\ninfluence\nschool/work\nperformance\n3.3 Using appropriate\nlearning strategies\nto improve study\nhabits and learning\n\n--- PDF PAGE 20 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal goals\nMay include:\n1.1\nGraduate from Tech-Voc training\n1.2\nBuy a car\n1.3\nTravel around the world\n2. Career goals\nMay include but not limited to:\n2.1\nGraduate from Tech-Voc training\n2.2\nGraduate from college\n2.3\nBuy a car\n2.4\nRetire at 50 years old\n3. Emotions\nPositive emotions may include:\n3.1\nJoy\n3.2\nGratitude\n3.3\nHope\n3.4\nSerenity\nNegative emotions may include:\n3.5\nAnger\n3.6\nFear\n3.7\nDisgust\n3.8\nSadness\n4. Social and work-\nrelated contexts\nMay include professional behavior such as:\n4.1 Committed to developing and improving their skills\n4.2 Professionals get the job done\n4.3 They keep their word and deliver what they promise.\n\nMay include non-professional behavior such as–\n4.4 They engage in office politics\n4.5 Bluffing and misrepresenting their skills\n4.6 Blaming a colleague\n5. Learning styles\nMay include:\n5.1 Visual\n5.2 Auditory\n5.3 Kinesthetic\n5.4 Converger\n5.5 Diverger\n5.6 Assimilator\n5.7 Accommodator\n6. Learning strategies\nMay include:\n6.1\nExplain and describe ideas with many details\n6.2\n Switch between ideas while studying\n6.3\nUse specific examples to understand abstract ideas\n\n--- PDF PAGE 21 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n17\n EVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nDeveloped SMART personal and career goals\n1.2\nApplied goal setting principles\n1.3\nIdentified sensitively the positive and negative emotions\nin the workplace\n1.4\nResponded with appropriate emotions in the workplace\n1.5\nIdentified possible consequences of inappropriate\nemotional responses in a social and work-related\ncontext\n1.6\nApplied learning styles to positively influence\nschool/work performance\n1.7\nDeveloped reflective practice through realization of\nlimitations, likes/ dislikes; through showing of self-\nconfidence\n2. Resource\nImplications\nThe following resources for should be provided:\n2.1\n Access to workplace and resources\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning (ex.\nhow to recognize emotions)\n3.2\nCase problems involving workplace diversity issues\n3.3\nThird-party report\n4. Context for\nAssessment\n3.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n\n--- PDF PAGE 22 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n18\nUNIT OF COMPETENCY\n: SUPPORT INNOVATION\n\nUNIT CODE\n\n: 400311105\n\nUNIT DESCRIPTOR\n\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to identify, recognize and support innovation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify the need\nfor innovation in\none’s area of\nwork\n1.1 The value of\ninnovative\npractices in the\nworkplace is\nrecognized\n1.2 Creativity in\ninnovation in one’s\nscope of work is\napplied\n1.3 The need for\ninnovation in own\nscope of work is\nrecognized\n1.1 Clear-cut\ndefinition of\ninnovation\n1.2 Current practice\nin own scope of\nwork\n1.3 Workplace\nprocedures\n1.1 Contributing in\nbrainstorming\nsession\n1.2 Examining current\npractice in one’s\nscope of work\n1.3 Identifying issues\nand concerns of\none’s scope of\nwork\n2. Recognize\ninnovative and\ncreative ideas\n2.1 Opportunities within\nthe team are\nidentified to develop\ninnovation\n2.2 Creative ideas of\ncoworkers pertaining\nto work practices are\nanalyzed\n2.3 Environment\nconducive for\nlearning and\ninnovating is\nmaintained\n2.1 Support required\nto generate\ncreative ideas\n2.2 Difference\nbetween\ninnovation and\ncreativity\n2.3 Innovative\nclimate in one’s\nscope of work\n2.1 Identifying\nresources required\nfor creativity and\ninnovation\n2.2 Examining\npotential obstacles\nto and\nopportunities for\ncreativity and\ninnovation\n2.3 Communicating\ncreative ideas of\nco-workers\n3. Support\nindividuals’\naccess to\nflexible and\ninnovative ways\nof working\n3.1 Individuals and key\npeople are\nreinforced to identify\ninnovative ideas to\nachieve outcomes\n3.2 Sharing of best\npractices using\nflexible and\ninnovative ways of\nworking is\naccomplished\n3.3 Obstacles to\nprogress in\nimplementing flexible\nand innovative ways\nof working are\nrecognized\n3.1 The role of\nemployees/work\ners in the\nimprovement of\npractices in the\norganization\n3.2 Best practices\nusing flexible\nand innovative\nways of working\n3.3 Obstacles in\nimplementing\ninnovation in\none’s scope of\nwork\n3.1 Encouraging co-\nworkers to\ngenerate and\ndevelop ideas\n3.2 Evaluating\npotential\nobstacles to and\nopportunities for\ncreativity and\ninnovation\n3.3 Sharing of best\npractices related\nto innovation and\ncreativity\n\n--- PDF PAGE 23 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n19\nRANGE OF VARIABLES\n\nVARIAB