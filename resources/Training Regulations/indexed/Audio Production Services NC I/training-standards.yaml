ies and\nprocedures\n\n• Lecture\n• Group\ndiscussion\n• Demonstration\n• Hands-on/\nWriteshop\n\n• Written test\n• Oral Questioning\n• Presentation\n• Evaluation of\nwritten output\n4 hours\n\n--- PDF PAGE 95 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n91\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n6.2 Assess work area\n• Lecture and discussion on:\no Work hazards policies and\nprocedures\no OSHS policies and\nprocedures\no Waste management\n• Conduct of assessment and\nmaintenance of work areas\nand walkways\n• Observance of proper work\ndisposal\n• Lecture\n• Group\ndiscussion\n• Demonstration\n• Hands-on/\nWriteshop\n\n• Written test\n• Oral Questioning\n• Presentation\n• Evaluation of\nwritten output\n2 hours\n6.3 Check and maintain\ntools, equipment and\nresources\n• Lecture and discussion on:\no Tools and equipment\nmaintenance procedures\no Tools, equipment and\nresources storage\nprocedures\n• Practice drills on tools,\nequipment and resources\nchecking and storage as per\nmaintenance requirements and\nsafety regulations\n• Lecture\n• Group\ndiscussion\n• Demonstration\n• Hands-on/\nWriteshop\n\n• Written test\n• Oral Questioning\n• Presentation\n• Evaluation of\nwritten output\n2 hours\n7. Provide and\nmaintain effective\nclient relations\n7.1 Maintain a professional\nimage\n\n• Lecture and discussion on:\no Interpersonal skills (as per\nRange of Variables)\no Safe work practices\no Personal hygiene\n• Practice/observance of good\nhousekeeping\n• Maintain a clean and hygienic\nenvironment\n• Lecture\n• Group\ndiscussion\n• Demonstration\n• Hands-on/\nWriteshop\n\n• Written test\n• Oral Questioning\n• Presentation\n• Evaluation of\nwritten output\n4 hours\n\n--- PDF PAGE 96 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n92\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n7.2 Identify and address\nclient requirements\n• Lecture and discussion on:\no Client requirements (as per\nRange of Variables\no Feedback mechanisms (as\nper Range of Variables)\n• Identification, monitoring and\naddressing of client/customer\nneeds and requirements\n• Practice exercise to respond\nto a variety of client/customer\ninteractions\n\n• Lecture\n• Group\ndiscussion\n• Demonstration\n• Hands-on/\nWriteshop\n\n• Written test\n• Oral Questioning\n• Presentation\n• Evaluation of\nwritten output\n4 hours\n7.3 Strengthen relations\nwith clients\n• Lecture and discussion on:\no Interactive communication\nwith others\no Possible causes of\nclient/customer\ndissatisfaction\no Time management\no Communication devices\n• Practice exercise on:\no Customer/client relations\no Human relation\no Public relation\n\n• Lecture\n• Group\ndiscussion\n• Demonstration\n• Hands-on/\nWriteshop\n\n• Written test\n• Oral Questioning\n• Presentation\n• Evaluation of\nwritten output\n4 hours\n\n--- PDF PAGE 97 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n93\n CORE COMPETENCIES\n(100 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Handle and install\nbasic audio\nequipment\n1.1 Determine audio\nproduction\nrequirements\n\n•\nIdentify different equipment and\naccessories used in particular\nproduction requirements\n•\nDiscuss different function and use\nof equipment and accessories\n\n• Lecture\n• Observation\n• Group\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral Evaluation\n• Demonstration\n\n20 hours\n\n1.2 Prepare and deliver\naudio equipment\n•\nPreparation of inventory checklist\n•\nHandling and delivery of\nequipment and accessories\n\n• Lecture\n• Observation\n• Group\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral Evaluation\n• Demonstration\n6 hours\n\n1.3 Set-up audio\nequipment\n•\nDiscuss safety procedures and\nbasic electrical requirements\n•\nSetting up equipment and\naccessories according to\nproduction requirements\n•\nDiscuss signal chain\n•\nDiscuss basic trouble shooting\n•\nDiscuss basic production\ncommunication skills\n\n• Lecture\n• Observation\n• Group\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral Evaluation\n• Demonstration\n46 hours\n\n1.4 Disassemble audio\nequipment\n•\nDiscuss safety procedures\n•\nAssess audio equipment\nfunctionality\n•\nDiscuss techniques in\ndisassembling equipment\n Prepare list of damaged\n equipment\n• Lecture\n• Observation\n• Group\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral Evaluation\n• Demonstration\n6 hours\n\n--- PDF PAGE 98 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n94\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.5 Secure audio\nequipment for transit\n\n•\nDiscuss packing and loading\ntechniques of equipment and\naccessories\n•\nIdentify different kind of\ntransportation\n•\nPreparation of checklist of\nequipment used\n•\nDiscuss egress procedures\n• Lecture\n• Observation\n• Group\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral Evaluation\n• Demonstration\n6 hours\n2. Perform technical\nassistance and\nbasic\ntroubleshooting\n\n2.1 Provide technical\nassistance to artists\nand production staff\n•\nDiscuss safety procedures\n•\nDiscuss how to identify issues\nduring production\n•\nDiscuss different solutions and\ntechniques how to handle issues\n•\nDiscuss basic production\ncommunication skills\n\n• Lecture\n• Observation\n• Group\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral Evaluation\n• Demonstration\n6 hours\n2.2 Determine and resolve\ntechnical audio\nproblems/issues\n•\nDiscuss how to prevent technical\nissues during production\n•\nDiscuss methods and application\nof trouble shooting during\nproduction\n\n• Lecture\n• Observation\n• Group\nDiscussion\n• Demonstration\