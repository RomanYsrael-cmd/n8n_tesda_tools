olios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 84 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n80\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Support individuals’\naccess to flexible\nand innovative\nways of working\n• Identify different roles of\nemployees/workers in the improvement\nof practices in the organization\n• Identify practices for flexible and\ninnovative ways of working\n• Share information with co-workers\n• Detect potential problems in\nimplementing flexible ways of working\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 Hour\n\n--- PDF PAGE 85 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n81\n\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Access and\nmaintain\ninformation\n\n6.1 Identify and gather\nneeded information\n\n• Lecture and discussion on:\n-\nPolicies, procedures and guidelines\nrelating to information handling in\nthe public and private sector,\nincluding confidentiality, privacy,\nsecurity, freedom of information\n-\nData collection and management\nprocedures\n-\nPublic/private sector standards\n• Identify sources to produce required\ninformation\n• Perform exercises on information\ngathering\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n3 Hours\n\n6.2 Search for\ninformation on the\ninternet or an\nintranet\n\n• Lecture and discussion on:\n-\nTechniques in finding useful\ninformation\n-\nSearch engines for information\n• Find and select appropriate information\n• Perform information searching on the\ninternet using different search engines\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Examine\ninformation\n• Lecture and discussion on:\n-\nData evaluation procedures\n-\nCultural aspects of information and\nmeaning\n-\nSources of public sector work-\nrelated information\n• Evaluation of searched information\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 86 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n82\n\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.4 Secure information\n• Lecture and discussion on:\n- Basic file-handling\ntechniques\n- Techniques in handling,\norganizing and saving\nfiles\n- Electronic and manual\nfiling systems\n• Performance of basic file-\nhandling techniques\n• Application of electronic and\nmanual filing systems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n6.5 Manage\ninformation\n• Lecture and discussion on:\n- Organizational\ninformation handling and\nstorage procedures\n- Databases and data\nstorage systems\n• Managing databases and\ndata storage systems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Follow\nOccupational\nSafety And\nHealth\nPolicies An