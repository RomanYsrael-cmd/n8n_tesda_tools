    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for AUDIO PRODUCTION SERVICES NC I.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to include green\ntechnology, issues on health and drugs and catering to persons with disabilities\n(PWD’s).\n\nCourse Title: AUDIO PRODUCTION SERVICES NC I\nNC Level: NC I\n\nNominal Training Duration: 47 Hours\nBasic Competencies\n\n88 Hours\nCommon Competencies\n 100 Hours\nCore Competencies\n\n 80 Hours - Supervised Industry Learning\n (SIL)\n\n Total - 315 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities that involves handling and\ninstalling\nbasic\naudio\nequipment\nand\nproviding\ntechnical\nassistance\nand\ntroubleshooting. This includes classroom learning activities and practical work in actual\nwork site or simulation area.\n\nTo complete the course, all units prescribed for this qualification must be\nachieved.\n\n--- PDF PAGE 74 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n70\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine spoken\nmessages\n• Exercise Conciseness in receiving\nand clarifying messages/\ninformation/ communication\n• Group discussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n\n1.2 Perform workplace\nduties following written\nnotices\n• Practice Accuracy in following\nwritten/ oral instruction/\ninformation\n• Practice written and oral\ncommunication skills\n• Case Study in handling written\ncommunication\n• Practice relaying/ disseminating\nmessages/ information\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n\n--- PDF PAGE 75 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n71\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work with\nothers\n2.1 Develop effective\nworkplace\nrelationships\n\n• Read job description and organizations\npolicies relevant to work role\n• Read personnel code of conduct and\ndiscipline\n• Role play on cooperation and good\nrelationship\n• Study table of organization and identify\nteam members\n• Role play on team work.\n• Role play on receiving feedback from\nsupervisor\n• Role play on providing feedback.\n• Listen to lecture on Valuing and\nexemplifying respect and empathy in\nthe workplace\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured activity\n• Written Test\n2 Hours\n\n2.2 Contribute to work\ngroup activities\n• Discussion on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity\n• Role play on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity.\n• Participate in a goal setting activity\n• Participate in planning and\nimplementation of a group activity.\n• Participate in evaluation of the\ngroup activity\n\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured activity\n• Written Test\n1 Hour\n\n--- PDF PAGE 76 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n72\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine\nproblems\n3.1 Identify the problem\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive\nprocessing of information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 77 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n73\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Assess fundamental\ncauses of problem\n\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive\nprocessing of information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 78 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n74\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Determine\ncorrective action\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive\nprocessing of information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 79 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n75\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Communicate\naction plans and\nrecommendations\nto routine problems\n•\nShow mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n•\nUse range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive\nprocessing of information)\n•\nIdentify and clarify the nature of the\nproblem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 80 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n76\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Enhance Self-\nManagement\nSkills\n\n4.1 Set personal and\ncareer goals\n•\nDefine and set personal goals and\ncareer goals\n•\nDescribe the SMART Model for goal\nsetting\n•\nCreate personal and career goals\nusing SMART Model for goal setting\n•\nExplain and apply the principles of\ngoal setting according to Locke &\nLatham\n• Discussion\n• Making of\npersonal and\ncareer goals by\nstudents\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n4.2 Recognize\nemotions\n•\nIdentify common positive and negative\nemotions manifested in the workplace\n•\nDistinguish professional and non-\nprofessional behaviors in the\nworkplace\n•\nRecognize triggers and implications of\npositive and negative emotions in the\nworkplace\n•\nRespond with appropriate emotions\nand identify possible consequences of\ninappropriate emotional responses in a\nsocial and work-related context\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 81 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n77\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.3 Describe oneself as\na learner\n3.1.1 Review Kolb’s Theory of Learning\nStyles\n3.1.2 Describe VAK Learning Style Model\n(Visual, Auditory, Kinesthetic)\n3.1.3 Cite learning strategies appropriate\nto specific tasks and describe work\npractices that assist learning\n3.1.4 Identify factors and strategies that\nassist learning\n3.1.5 Apply learning styles to positively\ninfluence school/work performance\n3.1.6 Use appropriate learning strategies\nto improve study habits and learning\n•\nDiscussion\n•\nInteractive\nLecture\n•\n Brainstorming\n•\nSimulation\n•\nDemonstration or\nsimulation with\noral questioning\n•\nCase problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 82 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n78\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Support\nInnovation\n5.1 Identify the need\nfor innovation in\none’s area of work\n• Show mastery of the clear-cut definition\nof innovation and its characteristics\n• Identify the need for innovation in one’s\nwork area\n• Identify work procedures needing\nchange\n• Contribute to brainstorming sessions\nwith co-workers on identifying tasks\nneeding change\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 83 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n79\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.2 Recognize\ninnovative and\ncreative ideas\n\n• Identify resources needed for change\nand potential obstacles as well\n• Show positive attitudes and behaviors\nin accepting and in needing change in\none’s work area\n• Delineate differences between\ncreativity and innovation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 84 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n80\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Support individuals’\naccess to flexible\nand innovative\nways of working\n• Identify different roles of\nemployees/workers in the improvement\nof practices in the organization\n• Identify practices for flexible and\ninnovative ways of working\n• Share information with co-workers\n• Detect potential problems in\nimplementing flexible ways of working\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 Hour\n\n--- PDF PAGE 85 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n81\n\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Access and\nmaintain\ninformation\n\n6.1 Identify and gather\nneeded information\n\n• Lecture and discussion on:\n-\nPolicies, procedures and guidelines\nrelating to information handling in\nthe public and private sector,\nincluding confidentiality, privacy,\nsecurity, freedom of information\n-\nData collection and management\nprocedures\n-\nPublic/private sector standards\n• Identify sources to produce required\ninformation\n• Perform exercises on information\ngathering\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n3 Hours\n\n6.2 Search for\ninformation on the\ninternet or an\nintranet\n\n• Lecture and discussion on:\n-\nTechniques in finding useful\ninformation\n-\nSearch engines for information\n• Find and select appropriate information\n• Perform information searching on the\ninternet using different search engines\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Examine\ninformation\n• Lecture and discussion on:\n-\nData evaluation procedures\n-\nCultural aspects of information and\nmeaning\n-\nSources of public sector work-\nrelated information\n• Evaluation of searched information\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 86 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n82\n\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.4 Secure information\n• Lecture and discussion on:\n- Basic file-handling\ntechniques\n- Techniques in handling,\norganizing and saving\nfiles\n- Electronic and manual\nfiling systems\n• Performance of basic file-\nhandling techniques\n• Application of electronic and\nmanual filing systems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n6.5 Manage\ninformation\n• Lecture and discussion on:\n- Organizational\ninformation handling and\nstorage procedures\n- Databases and data\nstorage systems\n• Managing databases and\ndata storage systems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Follow\nOccupational\nSafety And\nHealth\nPolicies And\nProcedures\n7.1 Identify relevant\noccupational safety\nand health policies\nand procedures\n•\nDiscussion of Risks\nand Hazards\n•\nRisk and Hazard\nIdentification\n\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2 Hours\n\n7.2 Perform relevant\noccupational safety\nand health\nprocedures\n•\nDemonstration of\nproper use of Personal\nProtective Equipment\nand Materials Handling\n•\nPractice Emergency\nPlan\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2 Hours\n\n--- PDF PAGE 87 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n83\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.3 Comply with\nrelevant\noccupational safety\nand health policies\nand standards\n•\nDiscussion on Personal\nHygiene and\nPreventive Control\nMeasures\n•\nPractice 5S and waste\nsegregation\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n4 Hours\n8. Apply\nEnvironmental\nWork\nStandards\n8.1 Identify\nenvironmental work\nhazards\n•\nDiscussions in\n-\nReduction in\ngreenhouse gas\nemissions,\n-\nIncrease the share of\nrenewables of gross\nfinal energy\nconsumption,\n-\nLong-term reduction of\nenergy consumption,\n-\nRelease of materials\ninto the environment\nshould, in the long run,\nnot exceed the\nadaptability of the eco-\nsystem,\n-\nDangers and\nunjustifiable risks to\nhuman health\n-\nEnergy and natural\nresource consumption\nand the provision of\ntransport services\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 88 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n84\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.2 Follow\nenvironmental work\nprocedures\n•\nDiscussions Protection\nagainst\n- Human Dangers\n- Overconsumption of\nResources\n- Destruction of\nEcosystems\n- Habitat Destructions\n- Extinction of Wildlife\n- Pollutions\n- Water Degradation\n•\nLecture\n•\nGroup\nDiscussion\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.3 Comply with\nenvironmental work\nrequirements\n•\nDiscussions\nEnvironmental\nRegulations and its\nrequirements relevant to\nthe industry and work\nactivities\n•\nDemonstration and\nPractice Environmental\nCompliance\n•\nLecture\n•\nGroup\nDiscussion\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n\n1 Hour\n9. Adopt\nEntrepreneurial\nMindset in the\nWorkplace\n9.1 Determine\nentrepreneurial\nmindset\n•\nDiscussion on\nEntrepreneurial Mindset\n•\nGames to develop\nentrepreneurial mind set\n•\nLecture\ndiscussion\n•\nGames\n•\nWritten Test\n•\nRole play\n2 Hours\n\n9.2 Identify\nentrepreneurial\npractices\n•\nCase study- quality\nassurance practices\n•\nDiscussion on cost\neffective measures\n•\nDiscussion on Workplace\nquality Policy\n•\nCase study\n•\nLecture\ndiscussion\n•\nWritten Test\n•\nCase Study\n1 Hour\n\n--- PDF PAGE 89 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n85\nCOMMON COMPETENCIES\n(88 hours)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Develop and update\nind