ominal\nDuration\n\n8.2 Follow\nenvironmental work\nprocedures\n•\nDiscussions Protection\nagainst\n- Human Dangers\n- Overconsumption of\nResources\n- Destruction of\nEcosystems\n- Habitat Destructions\n- Extinction of Wildlife\n- Pollutions\n- Water Degradation\n•\nLecture\n•\nGroup\nDiscussion\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.3 Comply with\nenvironmental work\nrequirements\n•\nDiscussions\nEnvironmental\nRegulations and its\nrequirements relevant to\nthe industry and work\nactivities\n•\nDemonstration and\nPractice Environmental\nCompliance\n•\nLecture\n•\nGroup\nDiscussion\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n\n1 Hour\n9. Adopt\nEntrepreneurial\nMindset in the\nWorkplace\n9.1 Determine\nentrepreneurial\nmindset\n•\nDiscussion on\nEntrepreneurial Mindset\n•\nGames to develop\nentrepreneurial mind set\n•\nLecture\ndiscussion\n•\nGames\n•\nWritten Test\n•\nRole play\n2 Hours\n\n9.2 Identify\nentrepreneurial\npractices\n•\nCase study- quality\nassurance practices\n•\nDiscussion on cost\neffective measures\n•\nDiscussion on Workplace\nquality Policy\n•\nCase study\n•\nLecture\ndiscussion\n•\nWritten Test\n•\nCase Study\n1 Hour\n\n--- PDF PAGE 89 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n85\nCOMMON COMPETENCIES\n(88 hours)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Develop and update\nindustry knowledge\n1.1 Seek and apply\ninformation on the\nindustry\n• Lecture and discussion on\nsources of information on the\nindustry\n• Lecture and discussion on\ninformation to assist effective\nwork performance\n• Lecture and discussion on the\noverview of quality assurance\nin the industry\n• Lecture and discussion on the\nassociated legislations that\naffects the industry\n• Access and update specific\nindustry information on the