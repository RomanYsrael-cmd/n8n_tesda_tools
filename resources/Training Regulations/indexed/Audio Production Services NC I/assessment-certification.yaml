      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s of competency of a qualification with a promulgated Training Regulations. 4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work and/or life experiences may apply for recognition in a particular qualification through competency assessment: 4.1.4 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry AUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019) 103"
