  "source_text": "COMPETENCY MAP\nCREATIVE SECTOR – AUDIO PRODUCTION SERVICES NC II\n\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with others\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\ninnovation\nAccess and\nmaintain information\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in a\nteam\nenvironment\nSolve/addres\ns general\nworkplace\nproblems\nDevelop career and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice\noccupational\nsafety and health\npolicies and\nprocedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneuria\nl skills in the\nworkplace\nLead\nworkplace\ncommunicati\non\nLead small teams\nApply critical\nthinking and\nproblem-solving\ntechniques in the\nworkplace\nWork in a\ndiverse\nenvironment\nPropose methods\nof applying\nlearning and\ninnovation in the\norganization\nUse information\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\nEvaluate\nenvironment\nal work\npractices\nFacilitate\nentrepreneurial skills\nfor micro-small-\nmedium enterprises\n(MSMEs)\nUtilize specialized\ncommunication skills\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply techniques\nin the workplace\nContribute to the\npractice of social\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational Safety\nand Health (OSH)\nprograms, policies\nand procedures\nLead towards\nimprovement of\nenvironment work\nprograms, policies\nand procedures\nSustain\nentrepreneurial\nskills\n\n--- PDF PAGE 109 ---\nAudio Production Services NC I Revision 00 Promulgated (12/17/2019)\n\n 105\n\nCOMMON COMPETENCIES\n\nDevelop and\nupdate industry\nknowledge\nDevelop creative\nthinking, artistic\nskills and\ncultural\nawareness\nObserve\nprocedures,\nspecifications and\nmanuals of\ninstructions\nOperate\nequipment\nManage\nown\nperformanc\ne\nMaintain clean,\nsafe and efficient\nwork environment\nProvide and\nmaintain\neffective\nclient\nrelations\n\nCORE COMPETENCIES\n\nHandle and\ninstall basic\naudio\nequipment\n\nPerform technical\nassistance and\nbasic\ntroubleshooting\n\n--- PDF PAGE 110 ---\nAudio Production Services NC I Revision 00 Promulgated (12/17/2019) 106\n\nGLOSSARY OF TERMS\n\n1. Audio production\nAudio production is the general term for producing,\nprocessing, and recording sound for all stages of\nproduction that happens during a live performance at a\ngiven space.\n\n2. Technical rider\nA document that gives the venue and/or soundman an\nunderstanding of what your technical requirements are and\nhow to set up the stage.\n\n3. Audio equipment\nRefers to devices that reproduce, record, or process sound.\n\n4. Physics of sound\nPrinciples in science underlying the physics of sound, with\na particular focus on two ideas.\nA sound wave is an air pressure disturbance that results\nfrom vibration, and the reception of such waves and their\nperception by the brain.\n\n5. Production\nrequirements\nA list of requirements needed to produce any creative or\ncultural events’\n\n6. Staging requirements Staging is the process of selecting, designing, adapting to,\nor modifying the performance space for a play or film. This\nincludes the use or absence of stagecraft elements as well\nas the structure of the stage and its components.\n\n7. Computer literate\nIs defined as the knowledge and ability to utilize computers\nand related technology efficiently, with a range of skills\ncovering levels from elementary use to computer\nprogramming and advanced problem solving.\n\n--- PDF PAGE 111 ---\nAudio Production Services NC I Revision 00 Promulgated (12/17/2019) 107\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title: AUDIO PRODUCTION SERVICES NC I\nQualification Code: CREAPS119\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution\nNo./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nAudio Production\nServices NC I\n2019-69/\nDec 17, 2019\nN/A\n Legend: *Description Types\n-\nDocument Created\n\n--- PDF PAGE 112 ---\nAudio Production Services NC I Revision 00 Promulgated (12/17/2019) 108\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS PANEL/TESDA EXPERTS PANEL\n\nMR. ERWIN G. BALANGUE\nTechnical Designer\nAudio-E AV Integrations\nMakati City\n\nMR. MARK G. LACCAY\nCEO\nClick Multimedia Resource Inc.\nQuezon City\n\nMR. ALEXANDER G. PARPAN\nLive Sound Engineer/Recording Engineer\n90db Audio Solutions/lx Events Pro\nLipa City, Batangas\n\nMR. PATRICK D. TIRANO\nRecord Producer\nWomb Works Audio Production\nMarikina City\n\nMR. ENRICO H. BICOL\nAudio Engineering Society\nUST - Manila\n\nMS. BLANCA I. BUCAO\nDe La Salle University\n\n--- PDF PAGE 113 ---\nAudio Production Services NC I Revision 00 Promulgated (12/17/2019) 109\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n1. Edgar David\nEMD Elect.\n\n2. Arnold Paez\nSound Balloon Ent.\n\n3. Ian Sekong\nSound Balloon Ent.\n\n4. Jason James Dampa\nBlack Plng. Prod.\n\n5. Keith Marvin A. Delgado\nLuce Auditorium, Siliman\n\n6. Andrew Salazar\nMSU-IIT\n\n7. Chealdo M. Tac-an\nMaster Pro S & L\n\n8. Joshua Paquingan\nMSU-IIT\n\n9. Allan Inoc\nFreelance\n\n10. Nendel Endrina\nNRS\n\n11. Hernenigildo M. Dico\nMSU-IIT\n\n12. Glenn Mark C. de Gracia\nMSU-IIT\n\nNational Commission for Culture and the Arts (NCCA)\n\nThe MEMBERS 