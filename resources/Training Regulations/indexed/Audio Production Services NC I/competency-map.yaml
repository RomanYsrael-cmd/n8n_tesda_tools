  "source_text": "SECTION 1 AUDIO PRODUCTION SERVICES NC I QUALIFICATION\n\nThe AUDIO PRODUCTION SERVICES NC I qualification consists of competencies that\na person must achieve to technically assist talents and production staff in handling, setting up\nand disassembling audio production equipment and providing competent troubleshooting to\nany multimedia and cultural events.\n\nThis Qualification is packaged from the competency map of Social, Community\nDevelopment and Other Services Sector\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311101\nReceive and respond to workplace communication\n400311102\nWork with others\n400311103\nSolve/address routine problems\n400311104\nEnhance self-management skills\n400311105\nSupport innovation\n400311106\nAccess and maintain information\n400311107\nFollow occupational safety and health policies and procedures\n400311108\nApply environmental work standards\n400311109\nAdopt entrepreneurial mindset in the workplace\nCODE NO.\nCOMMON COMPETENCIES\nCRE265201\nDevelop and update industry knowledge\nCRE265202\nDevelop creative thinking, artistic skills and cultural awareness\nCRE265203\nObserve procedures, specifications and manuals of instructions\nCRE265204\nOperate equipment\nCRE265205\nManage own performance\nCRE265206\nMaintain safe, clean and efficient work environment\nCRE265207\nProvide and maintain effective client relations\n\nCODE NO.\nCORE COMPETENCIES\nCRE352101\nHandle and install basic audio equipment\nCRE352102 Perform technical assistance and basic troubleshooting\n\nA person who has achieved this Qualification is competent to be:\n❑ Audio Stagehand\n❑ Live Sound Assistant\n❑ Studio Recording Assistant\n❑ Broadcast Technical Assistant\n❑ Boom operator\n❑ Dubbing Assistant\n\n--- PDF PAGE 6 ---\nAUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019)\n2"
