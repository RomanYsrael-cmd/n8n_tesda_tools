      "source_text": "VARIABLE RANGE 1. Occupational Safety and Health Risks and Hazards May include: 1.1 Physical hazards – impact, illumination, pressure, noise, vibration, extreme temperature, radiation 1.2 Biological hazards- bacteria, viruses, plants, parasites, mites, molds, fungi, insects 1.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, gasses, vapors 1.4 Ergonomics 1.5 Psychological factors – over exertion/ excessive force, awkward/static positions, fatigue, direct pressure, varying metabolic cycles 1.6 Physiological factors – monotony, personal relationship, work out cycle 1.7 Safety hazards (unsafe workplace condition) – confined space, excavations, falling objects, gas leaks, electrical, poor storage of materials and waste, spillage, waste and debris 1.8 Unsafe workers’ act (Smoking in off-limited areas, Substance and alcohol abuse at work) 2. OSH Work Standards May include: 2.1 OSHS Rule 1090 Hazardous Materials 2.2 OSHS Rule Gas & Electric Welding and Cutting Operations 2.3 OSHS Rule 1120 Hazardous Work Processes 2.4 OSHS Rule 1150 Materials Handling & Storage 2.5 OSHS Rule 1180 Internal Combustion Engine 2.6 OSHS Rule 1210 Electrical Safety 2.7 OSHS Rule 1420 Logging 2.8 OSHS Rule 1410 Construction Safety 2.9 OSHS Rule 1950 Pesticides & Fertilizers 3. OSH Requirements/ Regulations May include: 3.1 Clean Air Act 3.2 Building code 3.3 National Electrical and Fire Safety Codes 3.4 Waste management statutes and rules 3.5 Permit to Operate 3.6 Philippine Occupational Safety and Health Standards 3.7 Department Order No. 13 (Construction Safety and Health) 3.8 ECC regulations 3.9 Republic Act No. 11058 – An Strengthening Compliance with Occupational Safety and Health 4. Incident and Emergency Procedures May include: 4.1 Chemical spills 4.2 Equipment/vehicle accidents 4.3 Explosion 4.4 Fire Drill 4.5 Gas leak 4.6 Injury to personnel 4.7 Structural collapse 4.8 Earthquake drill"
    },
