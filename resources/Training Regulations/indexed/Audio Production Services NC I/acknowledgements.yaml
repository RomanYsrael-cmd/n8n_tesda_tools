      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. Audio production Audio production is the general term for producing, processing, and recording sound for all stages of production that happens during a live performance at a given space."
    },
    {
      "source_text": "2. Technical rider A document that gives the venue and/or soundman an understanding of what your technical requirements are and how to set up the stage."
    },
    {
      "source_text": "3. Audio equipment Refers to devices that reproduce, record, or process sound."
    },
    {
      "source_text": "4. Physics of sound Principles in science underlying the physics of sound, with a particular focus on two ideas. A sound wave is an air pressure disturbance that results from vibration, and the reception of such waves and their perception by the brain."
    },
    {
      "source_text": "5. Production requirements A list of requirements needed to produce any creative or cultural events’"
    },
    {
      "source_text": "6. Staging requirements Staging is the process of selecting, designing, adapting to, or modifying the performance space for a play or film. This includes the use or absence of stagecraft elements as well as the structure of the stage and its components."
    },
    {
      "source_text": "7. Computer literate Is defined as the knowledge and ability to utilize computers and related technology efficiently, with a range of skills covering levels from elementary use to computer programming and advanced problem solving."
    },
