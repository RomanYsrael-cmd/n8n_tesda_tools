    {
      "source_text": "UNIT DESCRIPTOR"
    },
    {
      "source_text": ": This unit of covers the knowledge, skills and attitudes required to identify, recognize and support innovation."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Identify the need for innovation in one’s area of work 1.1 The value of innovative practices in the workplace is recognized 1.2 Creativity in innovation in one’s scope of work is applied 1.3 The need for innovation in own scope of work is recognized 1.1 Clear-cut definition of innovation 1.2 Current practice in own scope of work 1.3 Workplace procedures 1.1 Contributing in brainstorming session 1.2 Examining current practice in one’s scope of work 1.3 Identifying issues and concerns of one’s scope of work 2. Recognize innovative and creative ideas 2.1 Opportunities within the team are identified to develop innovation 2.2 Creative ideas of coworkers pertaining to work practices are analyzed 2.3 Environment conducive for learning and innovating is maintained 2.1 Support required to generate creative ideas 2.2 Difference between innovation and creativity 2.3 Innovative climate in one’s scope of work 2.1 Identifying resources required for creativity and innovation 2.2 Examining potential obstacles to and opportunities for creativity and innovation 2.3 Communicating creative ideas of co-workers 3. Support individuals’ access to flexible and innovative ways of working 3.1 Individuals and key people are reinforced to identify innovative ideas to achieve outcomes 3.2 Sharing of best practices using flexible and innovative ways of working is accomplished 3.3 Obstacles to progress in implementing flexible and innovative ways of working are recognized 3.1 The role of employees/work ers in the improvement of practices in the organization 3.2 Best practices using flexible and innovative ways of working 3.3 Obstacles in implementing innovation in one’s scope of work 3.1 Encouraging co- workers to generate and develop ideas 3.2 Evaluating potential obstacles to and opportunities for creativity and innovation 3.3 Sharing of best practices related to innovation and creativity"
    },
    {
      "source_text": "-- PDF PAGE 23 --- AUDIO PRODUCTION SERVICES NC I Revision 00 Promulgated (12/17/2019) 19 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Innovative practices May include: 1.1 Self-directed support 1.2 Community based services 1.3 Working within a collaborative arrangement 1.4 Making scope of work more efficient 2. Innovation May include: 2.1 New ideas 2.2 Original ideas 2.3 Different ideas 2.4 Methods or tools"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Identified need for innovation in the area of work 1.2 Recognized innovative and creative ideas 1.3 Pursed agreement for flexible and innovative ways of working 1.4 Supported individuals and people to access flexible and innovative ways of working 2. Resource Implications Specific resources for assessment 2.1. Evidence of competent performance should be obtained by observing an individual in an information management role within the workplace or operational or simulated environment. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1. Written Test 3.2. Interview The unit will be assessed in a holistic manner as is practical and may be integrated with the assessment of other relevant units of competency. Assessment will occur over a range of situations, which will include disruptions to normal, smooth operation. Simulation may be required to allow for timely assessment of parts of this unit of competency. Simulation should be based on the actual workplace and will include walk through of the relevant competency components. 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or simulation environment in TESDA accredited institutions"
