    {
      "source_text": "REQUIRED SKILLS 1. Identify and gather needed information 1.1. Required information is identified based on requirements. 1.2. Sources to produce required information are identified and accessed 1.3. Report information is collected, organized and recorded 1.4. Organize information is collected in a way that enables easy access and retrieval by other staff 1.1. Policies, procedures and guidelines relating to information handling in the public and private sector, including confidentiality, privacy, security, freedom of information 1.2. Data collection and management procedures 1.3. Cultural aspects of information and meaning 1.4. Sources of public sector work-related information 1.5. Public/private sector standards 1.1. Handling policies, procedures and guidelines relating to information handling in the public sector, including confidentiality, privacy, security, freedom of information 1.2. Collecting data and managing procedures 1.3. Practicing cultural aspects of information and meaning 1.4. Using public/private sector standards 2. Search for information on the internet or an intranet 2.1. Engine is search to find and select appropriate information 2.2. Suitable techniques is use to make it easier to find useful information and to pass it on to others 2.3. Records are use where useful information came from 2.4. Results are used for searches of useful information 2.5. Search engine is chosen appropriate for the information that is needed 2.1. Find and select appropriate information 2.2. Techniques in finding useful information Records are use where useful information came from 2.3. Search engines for information 2.1. Finding and selecting search engine to find and select appropriate information 2.2. Using suitable techniques to find useful information easier 2.3. Using records 2.4. Carrying out Searches"
    },
