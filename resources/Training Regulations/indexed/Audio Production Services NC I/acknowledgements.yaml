      "source_text": "Receive and respond to workplace communication Work with others Solve/address routine problems Enhance self- management skills Support innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace Participate in workplace communication Work in a team environment Solve/addres s general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneuria l skills in the workplace Lead workplace communicati on Lead small teams Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environment al work practices Facilitate entrepreneurial skills for micro-small- medium enterprises (MSMEs) Utilize specialized communication skills Develop and lead teams Perform higher order thinking processes and apply techniques in the workplace Contribute to the practice of social justice in the workplace Manage innovative work instructions Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health (OSH) programs, policies and procedures Lead towards improvement of environment work programs, policies and procedures Sustain entrepreneurial skills"
