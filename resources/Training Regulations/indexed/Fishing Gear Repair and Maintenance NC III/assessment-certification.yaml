  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1. To attain the National Qualification of FISHING GEAR REPAIR AND\nMAINTENANCE NC III, the candidate must demonstrate competence\nin all the units listed in Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n 4.2. The qualification of FISHING GEAR REPAIR AND MAINTENANCE NC\nIII may be attained through accumulation of Certificates of Competency\n(COCs) in the following areas:\n\n4.2.1. Supervise unloading and loading of net\n\n4.2.2. Evaluate, administer and monitor net mending\n\n 4.2.2.1 Evaluate net mending\n\n 4.2.2.2 Administer and monitor net mending\nNote :\n\nThe possession of COC in the Unit of Competency - Assemble\nand Repair Damaged netting (AGR641303) is a prerequisite for\ntaking the assessment in Evaluate, Administer and Monitor Net\nMending\n\nSuccessful candidates shall be awarded Certificates of\nCompetency (COCs)\n\n4.3. Upon accumulation and submission of all COCs acquired for the\nrelevant units of competency comprising a qualification, an individual\nshall be issued the corresponding National Certificate.\n\n4.4. Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the\ncore units.\n\n 4.5 The following are qualified to apply for assessment and certification:\n\n 4.5.1 Graduates of formal, non-formal and informal including\nenterprise-based training programs.\n 4.5.2. Experienced workers (wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail\nin the Procedures manual on Assessment and Certification and\nGuidelines on the implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 51 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n49\nCOMPETENCY MAP FOR FISHERY SECTOR\n\nCORE UNITS OF COMPETENCY\n\nSupervise unloading and\nloading of net\n\nEvaluate net mending\n\nAdminister and monitor net\nmending\n\nManage team of net menders\n\nSupervise net repair and\nmaintenance\n\nEvaluate mended nets\n\nMaintain the temperature of\nseafood\n\nMaintain , prepare, deploy and\nretrieve purse seines to land\ncatch\n\nAssemble and repair damaged\nnetting\n\nMaintain, prepare, deploy\nand retrieve hand operated\nlines to land catch\nManage and control\nfishing operations\n\nImplement the food safety\nprogram and procedures\n\nShift a load using manually\noperated equipment\n\nClean work area\n\nRecord information about the\ncountry\n\nConstruct nets and\ncustomize design\n\nLoad and unload goods and\ncargo goods\n\nAdjust and position purse seines\n\nMaintain the temperature of\nseafood\n\nContribute to at sea\nprocessing of seafood\nLocate fishing grounds\nand stocks of fish\n\nAssemble and repair\ndamaged netting\n\nAssemble and load refrigerated\nproduct\n\nAdjust & position drop lines and\nlong lines\n\nMaintain, prepare, deploy\nand retrieve mesh nets or gill\nnets to land catch\n\nMonitor the\nimplementation of quality\nand food safety programs\n\nApply deckhand skills\naboard a fishing vessel\n\nImplement the food safety\nprogram and procedures\n\nMaintain, prepare, deploy and\nretrieve drop lines and long\nlines to land catch\n\nPerform routine\nhousekeeping duties on\nboard a vessel\n\nImplement quality systems\nand procedures\n\nApply basic first aid\n\nMaintain, prepare, deploy and\nretrieve pots and traps to land\ncatch\n\nPerform breath hold diving\noperations\n\nAdjust and position purse\nseines\n\nKeep records for a\nmunicipal fishing business\n\nAdjust and position pots and\ntraps\n\nWork with temperature controlled\nstock\n\nAdjust and position hand\noperated lines\n\nCook on board a vessel\n\n--- PDF PAGE 52 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n50\nOperate machinery in\nadverse conditions\n\nApply deckhand skills\naboard a fishing vessel\n\nAdjust and position beach\nseines, mesh nets or grill nets\n\nConduct field operations\n\nAnalyze and report on board\nobservation\n\nOperate refrigerated\nstorerooms\n\nCollect reliable scientific data\nand samples\n\nPerform diving operations using self\ncontained underwater breathing\napparatus\n\nTransport, handle and store\nchemicals\n\nEstablish and manage effective\nexternal relationships\n\nWholesale product\n\nImplement OHS policies and\nguidelines\n\nPerform breath hold diving\noperations\n\nScuba dive in open water to a\nmaximum dept of 18 meters\n\nManage and control fishing\noperations\nConduct food safety audits\n\nMaintain the temperature of\nseafood\n\nPerform compressions chamber\ndiving operations\n\nUndertake emergency procedures\nin diving operations using surface\nsupplied breathing apparatus\n\nOversee the implementation of a\nfood safety program in the\nworkplace\n\nFollow basic food safety\npractices\n\nOversee and undertake effluent\nand waste treatment and\ndisposal\n\nPerform diving operations using\nsurface supplied breathing apparatus\n\nWork effectively as a diver in the\nseafood industry\n\nEvaluate a batch of seafood\n\nDevelop food safety programs\n\nCollect routine fishery\nmanagement data\n\nApply and prepare chemicals\n\nEstablish and maintain the\nenterprise OHS programs\n\nMonitor the implementation of\nquality and food safety programs\nLocate fishing ground and\nstocks of fish\n\nImplement environmental\npolicies and procedures\n\nProvide support for diving operations\n\nManage environmental performance\n\nPrepare work instructions for\nnew tasks\n\nProvide practical and / or\ncommercial advice to seafood\nusers\n\nMonitor and record fishing\noperations\n\nWork with temperature controlled\nstock\n\nSupervise maintenance of\nmachinery and equipment\n\nExport product\n\nParticipate in a HACCP Team\n\n Undertake emergency\nprocedures in diving operations\nusing self contained underwater\nbreathing apparatus\n\n Apply and monitor food safety\nrequirements\n\nOperate a small vessel\n\n--- PDF PAGE 53 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n51\nCOMMON UNITS OF COMPETENCY\n\nApply safety measures in farm\noperations\n\nUse farm tools and equipment\n\nPerform estimation and calculation\n\nApply basic first aid\n\nBASIC UNITS OF COMPETENCY\n\nReceive and Respond to\nWorkplace Communication\n\nParticipate in Workplace\nCommunication\n\nLead Workplace\nCommunication\n\nUse relevant technologies\n\nDevelop Team and\nIndividual\n\nWork With Others\n\nWork in a Team Environment\n\nLead Small Team\n\nSolve problems related to\nwork activities\n\nApply Problem Solving\nTechniques in the\nWorkplace\n\nPractice basic\nhousekeeping procedures\n\nDemonstrate work values\n\nDevelop and practice\nnegotiation skills\n\nUse mathematical concepts\nand techniques\n\nPlan and Organize Work\n\n FISHING GEAR REPAIR AND MAINTENANCE NC III\n\n--- PDF PAGE 54 ---\nTR – Fishing Gear Repair and Maintenance NC III 52\nDEFINITION OF TERMS\n\nFor the purpose of this standard, the word\n\n• Commercial fishing – the taking of fishery species by passive or active\ngear for trade, business or profit beyond subsistence or sports fishing,\nto be further classified as:\n\nSmall scale commercial fishing – fishing with passive or active\ngear utilizing fishing vessels of 3.1 gross tons (GT) up to twenty\n(20) GT;\nMedium scale commercial fishing – fishing utilizing active gears\nand vessels of 20.1 GT up to one hundred fifty (150) GT;\nLarge scale commercial fishing – fishing utilizing active gears\nand vessels of more than one hundred fifty (150) GT.\n\n•\nDeck – a platform in a ship that is structural element and forming the floor for\nits compartment.\n\n•\nFish gear plan – a design that includes the structure and details of the\nmaterials of the fish net.\n\n• Fisherfolk – people who directly and physically engaged in taking and/or\nculturing and processing fishery and/or aquatic resources.\n\n• Fishing vessel – any boat, ship or other watercraft equipped to be used for\ntaking fishery species or aiding or assisting one or more vessels in the\nperformance of any activity relating to fishing, including, but not limited to,\npreservation, supply, storage, refrigeration, transportation and processing.\n\n• Fishing gear – any instrument or device and its accessories utilized in taking\nfish and other fishery species.\n\n•\nKnot – compact intersection of interlaced materials, as cord, ribbon or rope.\nA fastening made by tying together lengths of materials as rope in prescribed\nway.\n\n--- PDF PAGE 55 ---\nTR – Fishing Gear Repair and Maintenance NC III\n53\n•\nNetting – fishing gear component made of open meshed fabric.\n\n•\nNet mending – net that must be repaired.\n\n•\nPower block – a large hydraulic pulley used to bring the purse seine net\nabroad.\n\n•\nPurse seine net - A fishing net used to encircle surface-dwelling fish, landed\nusually aboard a boat rather than beached.\n\n•\nRing net - a modified lampara net with purse rings operated by two vessels.\n\n--- PDF PAGE 56 ---\nTR – Fishing Gear Repair and Maintenance NC III\n54\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n•\nTHE TECHNICAL ADVISORY PANEL (TAP)\n\nMR. RODOLFO P. ESTIGOY\nMR. ALEJANDRO T. ESCANO\nChief\nPresident\nBureau of Post Harvest Research and\nExtension\nPhilippine Chamber of Agriculture and\nFood Inc.\nCentral Luzon State University\nMFI Bldg. Ortigas Ave. Ext.\nScience City of Muñoz, Nueva Ecija\nPasig City\n\nMR. EDWIN ANDOT\nDR. ALMA M. DELA CRUZ\nPresident\nProfessor\nChamber of Agriculture, Fisheries and Food\nin Northern Mindanao\nCentral Luzon State University Muñoz,\nNueva Ecija\n2nd Floor, United Way Bldg.\nCapitol Cmpd., Cagayan de Oro City\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nMR. MARALINO RESPECIA, JR.\nMR. ROLLY LAMPARERO\nSan Andres Fishing Industry\nRD Fishing Industries, Inc\nBanisil, Tambler, Gen. Santos City\n1st Road Calumpang, Gen. Santos City\n\nMR. ROMEO LEGASPI, JR.\nMR. ERWIN SARNE\nAmadeo Fishing Corp.\nRD Fishing Industries, Inc\nMarang St. Calumpang, Gen. Santos City\n1st Road Calumpang, Gen. Santos City\nMR. ARTURO PAELMO, JR.\nMR. DANILO EBONALO\nRD Fishing Industries, Inc\nRD Fishing Industries, Inc\n1st Road Calumpang, Gen. Santos City\n1st Road Calumpang, Gen. Santos City\n\n The Participants in the national validation of this Training Regulation\n\n• Region XII\nRell & Renn Fishing Corp.\nRD Fishing Industry Inc.\nFOP Corporation\nR.A. Fishing\nTHEDCor"
