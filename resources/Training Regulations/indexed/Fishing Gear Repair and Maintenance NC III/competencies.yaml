        "source_text": "AGR321201\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to\nperform safety measures effectively and efficiently. It includes\nidentifying areas, tools, materials, time and place in\nperforming safety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine areas of\nconcern for safety\nmeasures\n1.1\nWork tasks are identified in line with safework\noperations\n1.2\nPlace for safety measures are determined in line\nwith safework operations\n1.3\nTime for safety measures are determined in line\nwith safework operations\n1.4\nAppropriate tools, materials and outfits are\nprepared in line with job requirements\n2.\nApply appropriate safety\nmeasures\n2.1\nTools and materials are used according to\nspecifications and procedures\n2.2\nOutfits are worn according to work requirements\n2.3\nEffectivity/shelf life/expiration of materials are\nstrictly observed\n2.4\nEmergency procedures are known and followed\nto ensure a safework efficiency\n2.5\nHazards in the workplace are identified and\nreported in line with industry guidelines\n3.\nSafekeep/dispose tools,\nmaterials and outfit\n3.1\nUsed tools and outfit are cleaned after use and\nstored in designated areas\n3.2\nUnused materials are properly labeled and\nstored according to manufacturers\nrecommendation and requirements\n3.3\nWaste materials are disposed according to\nmanufacturers, government and industry\nrequirements\n\n--- PDF PAGE 26 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 24\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nTools, materials and\noutfits\n1.1\nTools\n1.1.1 Netting needles\n1.1.2 Knives\n1.1.3 Scissors\n1.1.4 Measuring tools\n1.1.5 Stands\n1.1.6 Tensioning devices\n1.2 Materials\n1.2.1 Gill netting\n1.2.2 Purse seine netting\n1.2.3 Gear plan\n1.2.4 Twine\n1.3\nOutfit\n1.3.1 Masks\n1.3.2 Gloves\n1.3.3 Boots\n1.3.4 Overall coats\n1.3.5 Hat\n1.3.6\nEye goggles\n2.\nEfficiency\n2.1 Posture of worker\n2.2 Safety of working area\n2.3 Proximity of resources\n2.4 Worker comfort\n2.5\nSpeed of work\n3.\nWaste materials\n3.1 Broken needles\n3.2 Damaged netting\n4.\nHazards\n4.1 Broken tools\n4.2 Defective equipment / machinery\n4.3 Chemical\n4.4 Electrical\n4.5\nFalls\n\n--- PDF PAGE 27 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 25\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to\nindustry requirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Safekeep/cleaned tools, materials and outfit in\ndesignated facilities\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Implementation of regulatory controls and policies\nrelative to treatment of area and application of\nchemicals\n2.1.2 Proper disposal of waste materials\n2.2\nCodes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n2.3 Tools & Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health\nprotection\n2.4 Maintenance\n2.4.1\nRegular check-up and repair of tools, materials\nand outfit before and after use\n3. Underpinning\nSkills\n3.1 Ability to recognize effective tools, materials and outfit\n3.2 Ready skills required to read labels, manuals and other\nbasic safety information\n4. Method of\nAssessment\n\nCompetency may be assessed through:\n4.1 Practical demonstration\n4.2 Third Party Report\n5. Resource\nImplications\nThe following resources MUST be provided:\n5.1 Work location\n5.2 Tools, equipment and outfits appropriate in applying\nsafety measures\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 28 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 26\n\nUNIT OF COMPETENCY : USE TOOLS AND EQUIPMENT\n\nUNIT CODE :"
