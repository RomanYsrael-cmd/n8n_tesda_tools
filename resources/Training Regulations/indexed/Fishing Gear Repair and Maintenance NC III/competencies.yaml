        "source_text": "AGR641303\n\nUNIT DESCRIPTOR\nThis unit covers the skills, knowledge and attitudes\nrequired to evaluate net mending, including assessing\ndamaged nets and recommending netting materials for\nreplacement as well as translating gear plan.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1.\nTranslate gear plan\n\n1.1 Net damages are identified and indicated in the\ngear plan in accordance to supervisor’s\ninstructions.\n1.2 Instructions and abbreviations in gear plan are\ncorrectly interpreted in accordance to\nspecifications.\n2.\nAssess damaged\nnets\n2.1 Net characteristics and conditions are\nexamined and recorded in accordance to approved\nspecifications.\n2.2 Required documentation for net repair is\ncompleted in accordance to requirements\n3. Recommend list of\nrequired netting\nmaterials\n 3.1 Netting materials for replacement are identified\nwith prescribed specifications and supervisor’s\ninstructions.\n3.2 Materials are submitted for purchase according to\nspecifications\n\n--- PDF PAGE 38 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1\nNet damage\n1.1 Holes\n1.2 Rips\n1.3 Unaligned\n1.4 Worn out /weak net\n2\nNet characteristics\nand conditions\n2.1 Total length\n2.2 Contraction rate\n2.3 Net depth\n2.4 Chain arrangement\n2.5 Purse wire arrangement\n2.6 Bridle chain and purse ring arrangement\n2.7 Towing line arrangement\n3\nNetting materials\n3.1 Polyethylene\n3.2 Polyamide (nylon)\n3.3 Polyester\n3.4 Polypropylene rope\n3.5 Alloy chain\n3.6 Galvanize iron ring\n3.7 Plastic float\n4 Documentation\n4.1 Equipment manufacturer’s instructions\n4.2 Procedures and policies for repairing net\n5 Government and\ninternational\nrequirements\n5.1 Relevant Philippine legislation, regulations and\norders and international requirements related to\nevaluation of net mending\n\n--- PDF PAGE 39 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\