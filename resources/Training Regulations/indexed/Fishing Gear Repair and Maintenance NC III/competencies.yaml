        "source_title": "USE TOOLS AND EQUIPMENT",
        "source_text": "--- PDF PAGE 28 ---\nTR – Fishing Gear Repair and Maintenance NC III \n \n 26\n \n \nUNIT OF COMPETENCY :  USE  TOOLS AND EQUIPMENT \n \nUNIT CODE                      :  AGR321202 \n \nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to \nuse tools and equipment. It includes selection, operation and \npreventive maintenance of tools and equipment. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nSelect and use  tools \n \n1.1 \nTools are appropriately identified according to \nrequirement/use \n1.2 \nTools are checked for faults and defective tools \nreported in accordance with industry procedures \n1.3 \nAppropriate tools and equipment are safely used \naccording to job requirements and \nmanufacturers conditions\n2. \nSelect and operate  \nequipment \n2.1 \nEquipment to be used is identified as per work \nrequirements \n2.2 \nInstructional manual of the  tools and equipment \nare carefully read prior to operation \n2.3 \nPre-operation check-up is conducted in line \nwith manufacturers manual \n2.4 \nFaults in  equipment are identified and reported \nin line with industry procedures \n3. \nPerform preventive \nmaintenance \n3.1 \nTools and equipment are cleaned immediately \nafter use in line with industry procedures \n3.2 \nRoutine check-up and maintenance are \nperformed \n3.3 \nTools and equipment are stored in designated \nareas in line with industry procedures\n\n--- PDF PAGE 29 ---\nTR – Fishing Gear Repair and Maintenance NC III \n \n 27\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools \n1.1 \nNeedles \n1.2 \nCutters / Scissors \n1.3 \nWeighing scales \n1.4 \nHand tools \n1.5 \nMeasuring tools \n1.6\nTensioning Devices\n2.  Equipment \n \n2.1 \nEngine \n2.2 \nPumps \n2.3 \nGenerators \n2.4 \nPower  Block \n2.5\nUtility Crane\n3. Pre-operation check-up \n3.1 \nBrake fluid \n3.2 \nFuel \n3.3 \nWater \n3.4 \nOil \n3.5 \nLubricants \n3.6\nBattery\n\n--- PDF PAGE 30 ---\nTR – Fishing Gear Repair and Maintenance NC III \n \n 28\nEVIDENCE GUIDE \n \n1. Critical Aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Correctly identified appropriate tools and equipment \n1.2 Operated  equipment according to manual  specification  \n1.3\nPerformed preventive maintenance\n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Safety Practices  \n2.1.1 Ideal good work habits to demonstrate to workers \neasy and safety standards during operation of  \nequipment \n2.2 \nCodes and Regulations \n2.2.1 Environmental Compliance Certificate (ECG) \n2.2.2 Effective work supervision in the operations of \nequipment \n2.3 Tools & Equipment: Uses and Specification \n2.3.1 Knowledge in calibrating and use of equipment \n2.3.2 Safety keeping of equipments every after use \n2.4 Maintenance \n2.4.1 Regular upkeep of equipments \n2.4.2 Preventive maintenance skills \n2.5 Values \n2.5.1 Positive outlook towards work \n2.5.2\nPossesses pre-emptive/anticipatory skills\n3. \nUnderpinning \nSkills \n3.1 \nAbility to recognized defective farm equipment \n3.2 \nPerform proper management practices of safety \nmeasures\n4. \nMethod of \nAssessment \n \nCompetency may  be assessed through: \n4.1 \nDirect observation  \n4.2 \nPractical demonstration \n4.3\nThird Party Report\n5. \nResource \nImplications \nThe following resources MUST be provided: \n5.1 \nService/operational manual of  tools and equipment \n5.2 \nTools and equipment \n6. \nContext of \nAssessment \n6.1 \nAssessment may occur in the workplace or in a \nsimulated workplace or as part of a team under limited \nsupervision\n",
