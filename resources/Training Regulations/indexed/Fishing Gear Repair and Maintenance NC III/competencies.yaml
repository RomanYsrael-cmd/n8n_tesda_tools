        "source_title": "ADMINISTER AND MONITOR NET MENDING",
        "source_text": "--- PDF PAGE 40 ---\nTR – Fishing Gear Repair and Maintenance NC III \n \n 38\nUNIT OF COMPETENCY:    ADMINISTER AND MONITOR NET MENDING  \nUNIT CODE:                          AGR642332 \nPREQUISITE:                        AGR641303 \nUNIT DESCRIPTOR \nThis unit covers the skills, knowledge and attitudes \nrequired to administer and monitor net mending, \nincluding instructing net repairs and monitoring mending \nactivities.  \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of \nVariables \n1.     Set directions in \nrepairing damaged \nnets \n1.1  Appropriate action is initiated to fix the damaged \nnet in accordance to supervisor’s instructions \n1.2  Repairs are instructed and coordinated in \naccordance to standard procedures  \n1.3  Communication with net menders relating to net \nrepair is clear, concise and done at a proper time \nand place\n2.     Monitor mending \nactivities \n2.1  Coverage and rate of inspections on net mending \nactivities are complied  with  the standard \nprocedures \n2.2  Check of net mending is performed correctly \naccording to workplace procedures \n2.3  Actions are carried out to ensure net mending is in \naccordance to gear plan, supervisor’s instructions \nand OH&S requirements \n2.4  Communication with supervisor relating to net \ncharacteristics and condition is clear, brief and \ntimely \n2.5  Net damaged and actions taken are recorded \ncompletely and based on requirements\n\n--- PDF PAGE 41 ---\nTR – Fishing Gear Repair and Maintenance NC III \n \n 39\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1   Workplace procedures\n1.1  Supervisor/Manager instructions \n1.2  Standard operating procedures \n1.3  Company policies and procedures \n2   Documentation \n2.1   Equipment manufacturer’s instructions \n2.2   Procedures and policies for repairing net\n3.  Government and   \n      international  \n      requirements \n3.1  Relevant Philippine legislation, regulations and \norders and international requirements related to  \nadminister and monitor net mending\n\n--- PDF PAGE 42 ---\nTR – Fishing Gear Repair and Maintenance NC III \n \n 40\nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \n \nAssessment requires evidences that the candidate  \n1.1   Initiated and coordinated maintenance and repair \nof damaged nets \n1.2   Monitored mending activities in accordance to \nworkplace requirements \n1.3   Communicated effectively with others when \nadministering and monitoring net mending\n2. Underpinning \nKnowledge and \nAttitudes \n2.1 \nFactors affecting efficiency in net repair \n2.2    Basic understanding of net repair and     \n         maintenance as well as netting terms  \n2.3    Relevant OH& S requirements  \n2.4    Workplace procedures and policies relating to \nnet repair and maintenance as well as \nmonitoring net mending activities\n3. Underpinning Skills \n3.1   Undertaking repair operation including mending, \nshaping, strengthening, knotting, joining and \nlacing \n3.2   Communicating with net menders in setting \ndirectives and monitoring mending activities \n3.3.  Numeracy skills used for counting, measuring and \ncalculating twine specifications, meshes and ratios\n4. Resource Implication \nThe following resources MUST  be provided: \n4.5. \nGear plan, damaged nets  \n4.6. \nOperational work area for net repair   \n5 Methods of Assessment \nCompetency may be assessed through : \n5.1. Through direct observation / demonstration \n5.2.  Portfolio \n6. Context of Assessment \n6.1. Assessment is to be conducted at the workplace or \nsimulated work environment\n",
