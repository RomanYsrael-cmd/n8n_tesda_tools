iques to\nsolve problem\n5.2. Apply mathematical\nprocedures/solution\n5.3. Analyze results\n\nDirect\nobservation\n\nSimulation/\nrole playing\n\nCase studies\n\nWritten test\n\nPractical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1. Identify appropriate\ntechnology\n6.2. Apply relevant\ntechnology\n6.3. Maintain/enhance\nrelevant technology\n Direct observation\n Simulation/ role\nplaying\n Case Studies\n\nWritten test\n\nPractical/\nperformance test\n\n--- PDF PAGE 45 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 43\n\nCOMMON COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate\nsafety measures\n1.3. Safekeep/maintain/\ndispose\ntools,\nmaterials\nand\noutfit.\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use\nfarm tools\n2.2.Prepare and\noperate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practic\nes\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic\nworkplace\ncalculation\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical Exercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 46 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 44\n\nCORE COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Supervise\nunloading and\nloading of net\n1.1 Manage unloading\nand loading of net\n1.2 Secure and\nprotect net in\nhauling\n Discussion\n Demonstration\n Simulation /\