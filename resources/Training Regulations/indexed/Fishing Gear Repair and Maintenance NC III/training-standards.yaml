dies\n\nWritten test\n\nPractical/\nperformance\ntest\n4. Solve problems\nrelated to work\nactivities\n\n4.1. Explain the\nanalytical\ntechniques\n\n4.2. Identify the\nproblem\n\n4.3. Determine the\npossible cause/s of\nthe problem\n\nDirect\nobservation\n\nSimulation/Role\nplaying\n\nCase studies\n\nWritten test\n\nPractical/perfor\nmance test\n5. Use mathematical\nconcepts and\ntechniques\n5.1. Identify\nmathematical tools\nand techniques to\nsolve problem\n5.2. Apply mathematical\nprocedures/solution\n5.3. Analyze results\n\nDirect\nobservation\n\nSimulation/\nrole playing\n\nCase studies\n\nWritten test\n\nPractical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1. Identify appropriate\ntechnology\n6.2. Apply relevant\ntechnology\n6.3. Maintain/enhance\nrelevant technology\n Direct observation\n Simulation/ role\nplaying\n Case Studies\n\nWritten test\n\nPractical/\nperformance test\n\n--- PDF PAGE 45 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 43\n\nCOMMON COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate\nsafety measures\n1.3. Safekeep/maintain/\ndispose\ntools,\nmaterials\nand\noutfit.\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use\nfarm tools\n2.2.Prepare and\noperate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practic\nes\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic\nworkplace\ncalculation\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical Exercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 46 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 44\n\nCORE COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Supervise\nunloading and\nloading of net\n1.1 Manage unloading\nand loading of net\n1.2 Secure and\nprotect net in\nhauling\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercises\n Actual\nDemonstration\n Observation\n Questioning\n2. Evaluate net\nmending\n2.1 Assess damaged\nnets\n2.2 Recommend\nnetting materials\n\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercise\n Actual\nDemonstration\n Observation\n Questioning\n3. Administer and\nmonitor net\nmending\n3.1 Instruct net repairs\n3.2 Monitor mending\nactivities\n\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercise\n Actual\nDemonstration\n Observation\n Questioning\n\n--- PDF PAGE 47 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 45\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recogniz