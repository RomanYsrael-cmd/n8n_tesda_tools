    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FISHING GEAR REPAIR AND MAINTENANCE\nNC Level: NC III\nNominal Training Duration: 18 Hours (Basic)\n 14 Hours (Common)\n 120 Hours (Core)\n 152 Hours (Total)\n Course Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Net\nMender Team Leader in accordance with industry standards. It covers core\ncompetencies on supervising unload and load of net, assembling and repairing\ndamaged netting as well as evaluating, administering and monitoring net mending.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCY\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication.\n1.1. Communicate\ninformation about\nworkplace\nprocesses\n\n1.2. Lead workplace\ndiscussions\n\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n• Group\ndiscussion\n• Role play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 44 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 42\n2. Lead small teams.\n\n2.1. Provide team\nleadership\n\n2.2. Assign\nresponsibilities\namong members\n\n2.3. Set performance\nexpectation for\nteam members\n\n2.4. Supervise team\nperformance\n•\nLecture\n•\nDemonstration\n•\nSelf-paced\n(modular)\n•\nDemonstration\n•\nCase studies\n3. Develop and\npractice\nnegotiation skills\n\n3.1. Plan negotiations\n\n3.2. Participate in\nnegotiations\n\nDirect\nobservation\n\nSimulation/\n\nrole playing\n\nCase studies\n\nWritten test\n\nPractical/\nperformance\ntest\n4. Solve problems\nrelated to work\nactivities\n\n4.1. Explain the\nanalytical\ntechniques\n\n4.2. Identify the\nproblem\n\n4.3. Determine the\npossible cause/s of\nthe problem\n\nDirect\nobservation\n\nSimulation/Role\nplaying\n\nCase studies\n\nWritten test\n\nPractical/perfor\nmance test\n5. Use mathematical\nconcepts and\ntechniques\n5.1. Identify\nmathematical tools\nand techniques to\nsolve problem\n5.2. Apply mathematical\nprocedures/solution\n5.3. Analyze results\n\nDirect\nobservation\n\nSimulation/\nrole playing\n\nCase studies\n\nWritten test\n\nPractical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1. Identify appropriate\ntechnology\n6.2. Apply relevant\ntechnology\n6.3. Maintain/enhance\nrelevant technology\n Direct observation\n Simulation/ role\nplaying\n Case Studies\n\nWritten test\n\nPractical/\nperformance test\n\n--- PDF PAGE 45 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 43\n\nCOMMON COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate\nsafety measures\n1.3. Safekeep/maintain/\ndispose\ntools,\nmaterials\nand\noutfit.\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use\nfarm tools\n2.2.Prepare and\noperate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practic\nes\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic\nworkplace\ncalculation\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical Exercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 46 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 44\n\nCORE COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Supervise\nunloading and\nloading of net\n1.1 Manage unloading\nand loading of net\n1.2 Secure and\nprotect net in\nhauling\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercises\n Actual\nDemonstration\n Observation\n Questioning\n2. Evaluate net\nmending\n2.1 Assess damaged\nnets\n2.2 Recommend\nnetting materials\n\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercise\n Actual\nDemonstration\n Observation\n Questioning\n3. Administer and\nmonitor net\nmending\n3.1 Instruct net repairs\n3.2 Monitor mending\nactivities\n\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercise\n Actual\nDemonstration\n Observation\n Questioning\n\n--- PDF PAGE 47 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 45"
  },
