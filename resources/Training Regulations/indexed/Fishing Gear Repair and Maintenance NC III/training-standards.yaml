  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Fishing Gear Repair and\nMaintenance NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainers qualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FISHING GEAR REPAIR AND MAINTENANCE\nNC Level: NC III\nNominal Training Duration: 18 Hours (Basic)\n 14 Hours (Common)\n 120 Hours (Core)\n 152 Hours (Total)\n Course Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Net\nMender Team Leader in accordance with industry standards. It covers core\ncompetencies on supervising unload and load of net, assembling and repairing\ndamaged netting as well as evaluating, administering and monitoring net mending.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCY\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication.\n1.1. Communicate\ninformation about\nworkplace\nprocesses\n\n1.2. Lead workplace\ndiscussions\n\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n• Group\ndiscussion\n• Role play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 44 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 42\n2. Lead small teams.\n\n2.1. Provide team\nleadership\n\n2.2. Assign\nresponsibilities\namong members\n\n2.3. Set performance\nexpectation for\nteam members\n\n2.4. Supervise team\nperformance\n•\nLecture\n•\nDemonstration\n•\nSelf-paced\n(modular)\n•\nDemonstration\n•\nCase studies\n3. Develop and\npractice\nnegotiation skills\n\n3.1. Plan negotiations\n\n3.2. Participate in\nnegotiations\n\nDirect\nobservation\n\nSimulation/\n\nrole playing\n\nCase studies\n\nWritten test\n\nPractical/\nperformance\ntest\n4. Solve problems\nrelated to work\nactivities\n\n4.1. Explain the\nanalytical\ntechniques\n\n4.2. Identify the\nproblem\n\n4.3. Determine the\npossible cause/s of\nthe problem\n\nDirect\nobservation\n\nSimulation/Role\nplaying\n\nCase studies\n\nWritten test\n\nPractical/perfor\nmance test\n5. Use mathematical\nconcepts and\ntechniques\n5.1. Identify\nmathematical tools\nand techniques to\nsolve problem\n5.2. Apply mathematical\nprocedures/solution\n5.3. Analyze results\n\nDirect\nobservation\n\nSimulation/\nrole playing\n\nCase studies\n\nWritten test\n\nPractical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1. Identify appropriate\ntechnology\n6.2. Apply relevant\ntechnology\n6.3. Maintain/enhance\nrelevant technology\n Direct observation\n Simulation/ role\nplaying\n Case Studies\n\nWritten test\n\nPractical/\nperformance test\n\n--- PDF PAGE 45 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 43\n\nCOMMON COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate\nsafety measures\n1.3. Safekeep/maintain/\ndispose\ntools,\nmaterials\nand\noutfit.\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use\nfarm tools\n2.2.Prepare and\noperate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practic\nes\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic\nworkplace\ncalculation\n• Self-paced/modular\n• Lecture/Discussion\n• Interaction\n• Practical Exercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 46 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 44\n\nCORE COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Supervise\nunloading and\nloading of net\n1.1 Manage unloading\nand loading of net\n1.2 Secure and\nprotect net in\nhauling\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercises\n Actual\nDemonstration\n Observation\n Questioning\n2. Evaluate net\nmending\n2.1 Assess damaged\nnets\n2.2 Recommend\nnetting materials\n\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercise\n Actual\nDemonstration\n Observation\n Questioning\n3. Administer and\nmonitor net\nmending\n3.1 Instruct net repairs\n3.2 Monitor mending\nactivities\n\n Discussion\n Demonstration\n Simulation /\nRole Playing\n Practical\nExercise\n Actual\nDemonstration\n Observation\n Questioning\n\n--- PDF PAGE 47 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 45\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 48 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 46\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate either oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n• have attended training on Fish Capture or have had equivalent experience or\nhave been certified in the Unit of Competency – Assemble and repair\ndamaged netting.\n\n.\n3.4 TOOLS AND EQUIPMENT AND MATERIALS\nFISHING GEAR REPAIR AND MAINTENANCE NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Fishing Gear Repair and Maintenance NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n25\n• Knives\n25\n• Personal\nprotective gear\n• (hard hat, hand\ncover and safety\nfootwear)\n5\n• Gear plan\n25\n• Scissors\n1\n• Fishing vessel\n1\n• Purse seine net\n25\n• Netting needles\n1\n• Net hauler\n25\n• Twine\n\n5\n• Paper and pen\n\n25\n• Rope\n\n--- PDF PAGE 49 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 47\n3.5 TRAINING FACILITIES\nFISHING GEAR REPAIR AND MAINTENANCE NC III\n\nBased on a class intake of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building (permanent)\nStudent/Trainee\nWorking Space\n2.00 x 2.00 per\nstudent/trainee\n4.00 per\nstudent\n100.00\nLearning Resource\nCenter\n\n15.00\n15.00\nFacilities/Equipment/\nCirculation\n\n39.30\nStore Room\n4.00 x 4.00\n16.00\n16.00\n\nNote: Experimental area will change according to availability of land.\n\n3.6 TRAINERS’ QUALIFICATION\nFISHING GEAR REPAIR AND MAINTENANCE NC III\n\nTRAINER QUALIFICATION (TQ III)\n\n• Must be a holder of NC III\n• Must have undergone training on Training Methodology III (TM III)\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n\n * Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by the learner who enrolled in a\nstructured learning program to determine their achievement of competencies. It is\nadministered by the trainer/assessor at end of each learning module.\n\nThe result of the institutional assessment may be considered as an evidence\nfor national assessment.\n\n--- PDF PAGE 50 ---\nTR – Fishing Gear Repair and Maintenance NC III\n\n 48"
