  "source_text": "1.\nAgroenterprise\nindustry\nstakeholders\nAE Industry stakeholders are those who provided support\ninterventions\nto\nsmallholder\nfarmers\nto\nincrease\nproductivity\nand\nincome\nwhich\nincludes\n:Farmer\nOrganizations, Non-government Organizations (NGOs,\nNational Government Agencies, Financing Institutions,\nLocal Government Units (LGUs), Association of Chamber\nof Commerce, National Commission on Indigenous\nPeople, State, Universities and Colleges (SUCs)\n2.\nAgroenterprise\nobjective\naone sentence statement that summarizes the targets for\nsales to the selected buyers, supply from the clustered\nfarmers, and projected net marketing income\n3.\nAgroenterprise\nplan\na business plan for collective marketing that is comprised\nof four component plans, namely: market plan, supply\nplan, management plan and financial plan\n4.\nBreak even\nPrice\nis the amount of money for which a product or service must\nbe sold to cover the costs of manufacturing or providing it\n\n5.\nBreak even\nvolume\nis the volume of product for which a product or service must\nbe sold to cover the costs of manufacturing or providing it\n6.\nBusiness\nDevelopment\nServices (BDS)\nthe services that are necessary for the value chain to\nfunction. They include market information, market\nlinkages, research, extension and advisory services, credit\nand financial services, warehousing, input supply (seeds,\nfertilizers, etc), transport, certification and so on\n7.\nBuyers\ncomparative\nmatrix\na document which shows the comparison of different\nmarkets in terms of : volume demand; frequency of\ndelivery; mode of delivery, packaging; price ranges (lowest\nto highest); terms of payments ; seasonality of buying\n8.\nCapital build-\nup\nis the amount of money invested by a member to a\ncooperative for its business operations. It is cooperative\nterm for share\n9.\nCapacity\nBuilding\nin the context of farmer organizations, farmer groups and\ncooperatives is limited only to the planning, conduct,\ncoordinating or availment or access of trainings, seminars,\nworkshops where farmers can attend to to increase\nknowledge, skills and attitudes.\n\nprocess of developing and strengthening the skills,\ninstincts,\nabilities,\nprocesses\nand\nresources\nthat\n\n--- PDF PAGE 119 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 118\norganizations and communities need to survive, adapt, and\nthrive in the fast-changing world\"\n\nis a conceptual approach to development that focuses on\nunderstanding\nthe\nobstacles\nthat\ninhibit\npeople,\ngovernments,\ninternational\norganizations\nand\nnon-\ngovernmental\norganizations\nfrom\nrealizing\ntheir\ndevelopment goals while enhancing the abilities that will\nallow them to achieve measurable and sustainable results.\n10. Capacity\nbuilding\nprogram\nPlanned development of(orincrease in) knowledge, output\nrate, management skills,and other capabilities of an\norganization through, technology, and/or training.\n11. Classroom\nTraining\nThis type of training is facilitated by an instructor either on-\nline or in a classroom setting. Instructor-led training allows\nfor learners and instructors or facilitators to interact and\ndiscuss the training material, either individually or in a\ngroup setting.\n12. Cluster\ndelivery report\nis a form summarizing the volume of products delivered\nand the corresponding sales of the different clusters\n13. Clustering\nGrouping of 10-15 smallholder farmers producing the same\ncrops for collective marketing\n14. Coaching\nmethod of helping others to improve, develop, learn new\nskills, find personal success, achieve aims and to manage\nlife change and personal challenges\n15. Collective\nMarketing\nIs the act of organizing small holder farmers in combining\ntheir produce to have a bigger volume and satisfy the\nrequirement of a particular market/buyer.\n\nis where a number of growers work together to sell their\ncombined crops.\n16. Control\nmeasures\ninclude actions that can be taken to reduce the potential of\nexposure to the hazard, or to remove the hazard or to\nreduce the likelihood of the risk of the exposure to that\nhazard being realized\n17. Cost and\nreturn\na computation of possible fixed and variable costs and\npossible revenues derived from the sale of products and\ncommodities\n18. Field activities/\nfield work\npractical work/activities conducted by a student/trainee in\nthe natural environment, rather than in a room.\n19. Financial Plan\ncovers the costs from Marketing Cost and Return Table\n\n--- PDF PAGE 120 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 119\n20. Financial\nrequirements\ninvolves all the financial needs from starting up a project,\nits operating costs up to marketing\n21. Financial\nservices\nare the economic services provided by the finance\nindustry, which encompasses a broad range of\nbusinesses that manage money, including credit unions,\nbanks, credit-card companies, insurance companies,\naccountancy companies, consumer-finance companies,\nstock\nbrokerages,\ninvestment\nfunds\nand\nsome\ngovernment-sponsored enterprises\n22. Focus Group\nDiscussion\nis a form of qualitative research in which a group of people\nare asked about their perceptions, opinions, beliefs, and\nattitudes\ntowards\na\nproduct,\nservice,\nconcept,\nadvertisement, idea, or packaging. Questions are asked in\nan interactive group setting where participants are free to\ntalk with other group members.\n23. Food\nprocessing\nis the transformation of raw food ingredients to produce\nmarketable food products that can easily be prepared and\nserved to the customers\n24. Formal\nmarkets\na category of buyers characterized by their formal\narrangement with farmers before buying their product, and\nwith a negotiated price before a transaction is done. These\ncan refer to corporate and institutional markets\n25. High-yielding\nproduct\ncertain varieties of crops/products which are proven to\ngive better yield than the regular varieties\n26. Individual\ndelivery report\nis a form summarizing the volume of products delivered\nand the corresponding sales of its individual cluster\nmembers\n27. Long-term\nbusiness plan\nbusiness plan which covers five to six years activities &\nstrategies to obtain its business objectives\n28. Market chain\nstudy\nis a process to gather information on the market actors\n(both buyers and BDS providers), their marketing activities,\ncosts and margins, and constraints and opportunities\nrelated to the movement of the selected product from the\nfarmers up to the consumers\n29. Mentoring\nis a personal developmental relationship in which a more\nexperienced or more knowledgeable person helps to guide\na less experienced or less knowledgeable person. The\nperson in receipt of mentorship may be referred to as\nprotégé\n\n--- PDF PAGE 121 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 120\n30. Non-food\nprocessing\nis a value-adding activity as by-product of agricultural crops\nsuch as handicraft out of corn cobs; handicraft from\ncoconut shell; coco coir/coco nets from coconut husks\n31. Postharvest\nactivities\nactivities done to agricultural product after harvest to\nimprove quality and value\n32. Practicum\na specialized field of study, that is designed to give\nstudents/ trainees supervised practical application of a\npreviously or concurrently studied theory.\n33. Product supply a stock of a resource from which a person or place can be\nprovided with the necessary amount of produce\n34. Production\nactivities\nare specific tasks to be undertaken in producing from\ncomponents or raw materials\n35. Production\nmodule\nrefers to the standard unit of measure in production that is\nagreed upon by the cluster as their guide to undertake\nstandardized units of production across cluster members\n36. Production\nvolume\nmeans quantity of produce\n37. Profiling\nGathering of information about the farmers demographic\nprofile and farm business profile e.g land area cultivated,\ncrops planted, farm income, source of credit, current\nmarkets/buyers\n38. Quality control\na system of maintaining standards in manufactured\nproducts by testing a sample of the output against the\nspecification\n39. Quality product\nspecification required by the market to access better price\n40. Return of\nInvestments\n(ROI)\nis\na\nperformance\nmeasure\nused\nto\nevaluate\nthe efficiency of an investment or to compare the efficiency\nof a number of different investments. ROI measures the\namount\nof return on\nan\ninvestment\nrelative\nto\nthe investment’s cost. To calculate ROI, the benefit (or\nreturn) of an investment is divided by the cost of the\ninvestment, and the result is expressed as a percentage or\na ratio.\n\nFormula:\n\n--- PDF PAGE 122 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 121\n41. Safety and\nhealth\npractices\nare generally written methods outlining how to perform a\ntask with minimum risk to people, equipment, materials,\nenvironment, and processes\n42. Smallholder\nFarmers\nOn agriculture:\nSmallholder Farmers are farmers with farmlands 3\nhectares and below:\n\nOn aquaculture:\nSmall scale commercial fishing - fishing with passive or\nactive gear utilizing fishing vessels of 3.1 gross tons (GT)\nup to twenty (20) GT\n\nOn livestock:\nMost small farms usually keep 1 or 2 head of cattle mainly\nfor draught, Raising of buffalo is predominantly a backyard\nactivity with 99.8 percent of the total population in the\nhands of smallholders, mainly the rice farmers. Each farm\nraises 1-3 buffalo according to the area they cultivate.\n\nOn Processed Products and as Business Firms (based on\nassets)\nMicro - up to P3,000,000\nSmall - P3,000,001 - P15,000,000\n43. Specification\nrefers to the quality standard of the product that the market\nrequires from the supplier (the farmer producer)\n44. Supply plan\na detailed action point/activities in order to meet the future\ndemand in best possible manner. It’s a forward looking\nprocess that tries to meet supply with demand. It includes\nthe lists of members expected yield, product quantity\ncommitted to group marketing and schedule of supply.\n\nrefers to the Total quantity of the product that the cluster is\ncapable of producing and consolidating for their collective\nmarketing.\n45. Supports\nservices\nin the context of agrarian reform, are the various programs\nand interventions designed to help the farmers increase\ntheir productivity and income, such as postharvest\nfacilities, credit, livelihood support including capacity\ndevelopment activities\n46. Traditional\nmarket (local\nmarket &\nregional\nmarket)\nrefers to informal buyers who offers fluctuating prices and\nirregular demand\n\n--- PDF PAGE 123 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 122\n47. Tolerant to\npest and\ndiseases\n\ncertain varieties of crops that can withstand attacks of\nspecific types of pests and diseases\n48. Value adding\nactivities\ninnovation made to a product or service to increase its\nvalue as it flows along the market chain towards the\nconsumers. This can be implemented through product\ndevelopment, product diversification and new market\ndevelopment\n49. Workplace\nhazards\nany source of potential damage, harm or adverse health\neffects on something or someone under certain conditions\nat work\n\n--- PDF PAGE 124 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 123",
