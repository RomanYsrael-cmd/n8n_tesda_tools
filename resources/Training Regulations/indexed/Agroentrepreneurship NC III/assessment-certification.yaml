  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the Training\nRegulations for AGROENTREPRENEURSHIPNC III as follows:\n\nBASIC COMPETENCIES\nLead Workplace Communication\nLead small teams\nDevelop and Practice Negotiation Skills\nSolve Problems Related to Work Activities\nUse Mathematical Concepts and Techniques\nUse Relevant Technologies\nCOMMON COMPETENCIES\nApply Safety Measures in Farm Operations\nPerform Estimation and Basic Calculation\nProvide Quality Customer Service\nComply with Quality and Ethical Standards\nCORE COMPETENCIES\nEngage Agroenterprise (AE) Industry Stakeholders\nEnsure Product Supply\nImplement Financial Management\nMobilize Farmers Participation in Capacity Building\nActivities\nConduct Collective Marketing\n\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s\nof competency.\n\n--- PDF PAGE 116 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 115\n4.1.3 The following are qualified to apply for assessment and certification:\na. Graduating students/ trainees of WTR-registered programs or\ngraduates of NTR programs related to agro-entrepreneurship or\ngraduate of enterprise-based training programs or\nb. At least two (2) years work experience in implementing Agroenterprise\ndevelopment or any related field (wage employed or self-employed)\n\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency.\n\n4.1.5 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as by industry.\n\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 117 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 116\n\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nSupermarket of Competencies\nAGRICULTURE, FORESTRY AND FISHERY SECTOR\nEngage\nAgroenterprise\n(AE) Industry\nStakeholders\n\nEnsure Product\nSupply\nImplement\nFinancial\nManagement\nMobilize Farmers\nParticipation in\nCapacity\nBuilding\nActivities\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply Safety\nMeasures in Farm\nOperations\nLead small\nteams\nLead\nWorkplace\nCommunication\nBASIC\nCOMPETENCIES\nDevelop and\nPractice\nNegotiation\n\nSolve Problems\nRelated to Work\nActivities\nUse\nMathematical\nConcepts and\nTechniques\nUse Relevant\nTechnologies\nPerform Estimation\nand Basic\nCalculation\nConduct\nCollective\nMarketing\nProvide Quality\nCustomer Service\nComply with Quality\nand Ethical\nStandards\n\n--- PDF PAGE 118 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 117\n"
