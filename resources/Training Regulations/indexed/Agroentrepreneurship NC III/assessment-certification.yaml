      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all the units of competency that comprise the Training Regulations for AGROENTREPRENEURSHIPNC III as follows: BASIC COMPETENCIES Lead Workplace Communication Lead small teams Develop and Practice Negotiation Skills Solve Problems Related to Work Activities Use Mathematical Concepts and Techniques Use Relevant Technologies COMMON COMPETENCIES Apply Safety Measures in Farm Operations Perform Estimation and Basic Calculation Provide Quality Customer Service Comply with Quality and Ethical Standards CORE COMPETENCIES Engage Agroenterprise (AE) Industry Stakeholders Ensure Product Supply Implement Financial Management Mobilize Farmers Participation in Capacity Building Activities Conduct Collective Marketing 4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. TR-Agroentrepreneurship NC III Promulgated February 3, 2017 115 4.1.3 The following are qualified to apply for assessment and certification: a. Graduating students/ trainees of WTR-registered programs or graduates of NTR programs related to agro-entrepreneurship or graduate of enterprise-based training programs or b. At least two (2) years work experience in implementing Agroenterprise development or any related field (wage employed or self-employed) 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency. 4.1.5 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements as by industry."
