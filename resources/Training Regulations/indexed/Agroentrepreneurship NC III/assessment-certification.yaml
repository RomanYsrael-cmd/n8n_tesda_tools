    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. TR-Agroentrepreneurship NC III Promulgated February 3, 2017 116 Supermarket of Competencies AGRI-FISHERY Sector Supermarket of Competencies AGRICULTURE, FORESTRY AND FISHERY SECTOR Engage Agroenterprise (AE) Industry Stakeholders Ensure Product Supply Implement Financial Management Mobilize Farmers Participation in Capacity Building Activities CORE COMPETENCIES COMMON COMPETENCIES Apply Safety Measures in Farm Operations Lead small teams Lead Workplace Communication BASIC COMPETENCIES Develop and Practice Negotiation Solve Problems Related to Work Activities Use Mathematical Concepts and Techniques Use Relevant Technologies Perform Estimation and Basic Calculation Conduct Collective Marketing Provide Quality Customer Service Comply with Quality and Ethical Standards TR-Agroentrepreneurship NC III Promulgated February 3, 2017 117"
