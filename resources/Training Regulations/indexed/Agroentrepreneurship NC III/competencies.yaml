        "source_text": "AFF243305 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes \nrequired for an AE Implementer to collect and supply \ndata for site project selection, support organizing AE \nindustry stakeholders and sustain partnership. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Collect and \nsupply data \nfor project site \nselection \n1.1 Data are gathered \nbased on accepted \nindustry procedures \n1.2 Data are submitted to \nfacilitator according to \nindustry practices \n1.3 Validated data are \nfiled following \nstandard procedures \n• Sources of the \nrequired data \n• Data required for \nsite project \nselection \n• Different \ncommunication \nstrategies \n• Different data \nrelated to AE \nimplementation \n• Record Keeping \n \nAttitudes: \n• Resourceful \n• Committed \n• Hard Working \n• Flexible \n• Diligence \n• Patience \n• Systematic \n• Gathering/ Providing \nrelevant data \n• Communication \nskills \n• Utilizing \ncommunication \nstrategies \n• Keeping record \n2. Support \norganizing AE \nindustry \nstakeholders \n2.1 Agroenterprise \nIndustry \nstakeholders are \nlisted according to \nindustry procedures \n2.2 Relevant partners who \nwill provide support \nare recommended \nbased on the list of \nagroenterprise \nindustry stakeholders \n• Overview of the \nAgroenterprise \nClustering \nApproach \n• Roles and \nresponsibilities of \nagroenterprise \nindustry \nstakeholders \n• Stakeholders \nproviding support \n• Securing list of AE \nstakeholders \n• Identifying relevant \npartners \n• Communication, \nFacilitation and \nNegotiation Skills \n• Identifying and \nmobilizing farmers \nfor clustering \n• Organizing Skills\n\n--- PDF PAGE 44 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n43\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.3 Farmers are selected \nand mobilized for \nclustering based on \nestablished selection \ncriteria \n2.4 Clustered farmers are \nprofiled following \nindustry procedures. \n2.5 Formulation of AE \nimplementation \npolicies is facilitated \nbased on standard \noperating procedure \non AE \nimplementation \n• Procedures in \nproviding \nsupport/resource \ncomplementation \n• Key areas for \nresource \ncomplementation \n• Step 1 of AE \nClustering \nApproach (Cluster \nFormation) \n• Basic Community \nOrganizing \n• Registration of \nfarmers in the area \n• Profiling of \nClustered Farmers \n• Agreements related \nto AE \nimplementation \n• Procedures in \nformulating and \nrecording \nagreements/policies\n \nAttitudes: \n• Diplomacy \n• Respect \n• Resourceful \n• Patience \n• Committed \n• Optimistic \n• Sensitive \n• Open-Minded \n• Hard working \n• Flexible \n• Formulating \nagreements \n• Keeping record \n3. Sustain \npartnership \n3.1 AE policy \nimplementation is \nmonitored, recorded \nand reviewed \n3.2 Issues are identified \nand conveyed to \nconcerned partners \n3.3 Conflicts are resolved \nfollowing the agreed \n• Types of Issues \nand conflicts \n• Protocol in handling \nissues \n• Strategies in \nconveying issues to \nconcerned partners \n• Recording of issues \n• Conveying issues to \nconcerned partners \n• Reiterating policies \nto AE Practitioners \n• Communicating \nSkills \n• Recording and \nreviewing policies\n\n--- PDF PAGE 45 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n44\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nAE policies and \nprocedures \n3.4 Policies are reiterated \nto industry \nstakeholders \n• Different policies in \nimplementing \nAgroenterprise \n• Record keeping \n• Conflict Resolution \nprocesses \n• Issues and \nConflicts resolved \nand resolutions \nformulated \n \nAttitudes: \n• Open-minded \n• Optimistic \n• Diplomacy \n• Unbias \n• Sensitive \n• Respectful \n• Resourceful \n• Diligent \n• Committed \n• Efficient \n• Trusting \n• Flexible \n• Solving conflicts \n• Negotiation/ \nMediation skills \n• Recording of \nresolved conflicts \nand resolutions\n\n--- PDF PAGE 46 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n45\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Data \nData includes: \n1.1 List of smallholder farmers \n1.2 Crops planted \n1.3 Area cultivated \n1.4 Existing markets and marketing practices \n1.5 Credit service providers \n1.6 Peoples Organization/Farmers Organization \n1.7 National Government Agencies and Non-\nGovernment 1.8 Organizations, Academe providing \nsupport to farmers\n2. AE Industry stakeholders \nAE Industry stakeholders may include but not limited \nto: \n2.1 Farmer Organizations \n2.2Non-government Organizations (NGOs) \n2.3 National Government Agencies \n2.4 Financing Institutions \n2.5 Local Government Units (LGUs) \n2.6 Association of Chamber of Commerce \n2.7 National Commission on Indigenous People \n2.8 State, Universities and Colleges (SUCs)\n3. Issues \nIssues may include but not limited to: \n3.1 Non-compliance of members to commitments to \nproduction and collective marketing \n3.2 Non-payment of members to loans \n3.3 Non-attendance to meetings \n3.4 Interpersonal-related issues\n4. Policies \nPolicies may include but not limited to: \n4.1 Marketing \n4.2 Production \n4.3 Organizational \n4.4 Financial\n\n--- PDF PAGE 47 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n46\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Provided validated data on farmers and stakeholders \nfor site project selection. \n1.2 Identified and recommended relevant partners who will \nprovide support \n1.3 Identified farmers for clustering and profiling. \n1.4 Facilitated formulation of agreements/policies related to \nAgroenterprise. \n1.5 Identified issues and conveyed to concerned partners. \n1.6 Recorded policies/agreements related to AE \nimplementation. \n1.7 Recorded resolved conflicts and resolutions formulated. \n1.8 Facilitated the registration of farmer’s organization.\n2. Resource Implications \nThe following resources should be provided: \n2.1 Training hall/Simulated workplace \n2.2 Tools, materials, supplies and equipment to \ndemonstrate required tasks \n2.3 References and materials\n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Demonstration \n3.3 Oral questioning \n3.4 Interview\n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center \nin a simulated workplace setting.\n\n--- PDF PAGE 48 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n47\nUNIT OF COMPETENCY \n: \nENSURE PRODUCT SUPPLY \nUNIT CODE \n:"
