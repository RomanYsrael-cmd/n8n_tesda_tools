ain partnership. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Collect and \nsupply data \nfor project site \nselection \n1.1 Data are gathered \nbased on accepted \nindustry procedures \n1.2 Data are submitted to \nfacilitator according to \nindustry practices \n1.3 Validated data are \nfiled following \nstandard procedures \n• Sources of the \nrequired data \n• Data required for \nsite project \nselection \n• Different \ncommunication \nstrategies \n• Different data \nrelated to AE \nimplementation \n• Record Keeping \n \nAttitudes: \n• Resourceful \n• Committed \n• Hard Working \n• Flexible \n• Diligence \n• Patience \n• Systematic \n• Gathering/ Providing \nrelevant data \n• Communication \nskills \n• Utilizing \ncommunication \nstrategies \n• Keeping record \n2. Support \norganizing AE \nindustry \nstakeholders \n2.1 Agroenterprise \nIndustry \nstakeholders are \nlisted according to \nindustry procedures \n2.2 Relevant partners who \nwill provide support \nare recommended \nbased on the list of \nagroenterprise \nindustry stakeholders \n• Overview of the \nAgroenterprise \nClustering \nApproach \n• Roles and \nresponsibilities of \nagroenterprise \nindustry \nstakeholders \n• Stakeholders \nproviding support \n• Securing list of AE \nstakeholders \n• Identifying relevant \npartners \n• Communication, \nFacilitation and \nNegotiation Skills \n• Identifying and \nmobilizing farmers \nfor clustering \n• Organizing Skills\n\n--- PDF PAGE 44 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n43\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.3 Farmers are selected \nand mobilized for \nclustering based on \nestablished selection \ncriteria \n2.4 Clustered farmers are \nprofiled following \nindustry procedures. \n2.5 Formulation of A