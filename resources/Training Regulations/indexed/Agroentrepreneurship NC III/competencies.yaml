ments \n• Presenting the \nresults of the market \nchain study \n• Formulating an AE \nobjective according \nto industry \nprocedures \n• Facilitating \nconsensus building \n• Making agreements \nor arrangements \nwith buyers \n• Forecasting product \nsupply \n• Computation skills \n• Compiling an AE \nplan and the \nbusiness action \nschedules\n\n--- PDF PAGE 67 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n66\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n• Product supply \nforecast \n• Computation of \nsales, cost and \nincome, variance \nanalysis \n• Operations \nmanagement in the \nproduct flow \n• Product quality \nmanagement \n• Traceability \n• Record keeping \nand documentation \n• Assessment of \nmarketing \nperformance \n• Contingency \nplanning \n• Procedure for post-\ntest marketing \nassessment \n \nAttitude: \n• Business minded \n• Diligent for detailed \nwork \n• Realistic \n• Motivated \n• Committed \n• Accountable \n• Decisive \n• Team player \n• Work oriented \n• Disciplined \n• Vigilant \n• Self-directed \n• Cooperative \n• Hardworking \n• Candid \n• Responsive \n• Endurance \n• Openness \n• Continuous learning\n• Completing the test \nmarketing \npreparation \n• Documentation skills \n• Motivational skills \n• Managing product \nflow to the buyers \n• Managing product \nquality and setting a \nsystem for \ntraceability \n• Recording of product \ndeliveries, sales, \ncosts and income \nand payment to \nfarmers \n• Consolidating and \nselling products to \nbuyers \n• Critical thinking skills \n• Contingency \nplanning skills \n• Problem solving \nskills \n• Conducting post-test \nmarketing \nassessment\n\n--- PDF PAGE 68 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n67\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \