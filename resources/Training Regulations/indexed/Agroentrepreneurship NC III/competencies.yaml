neurship NCIII Promulgated February 3, 2017 \n \n8\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nreferenced to \nappropriate personnel \naccording to \nemployer policy \n4.4 Team members are \nkept informed of any \nchanges in the \npriority allocated to \nassignments or tasks \nwhich might impact \non client/customer \nneeds and \nsatisfaction \n4.5 Team operations are \nmonitored to ensure \nthat employer/client \nneeds and \nrequirements are met \n4.6 Follow-up \ncommunication is \nprovided on all issues \naffecting the team \n4.7 All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany procedures\nclient needs and \nsatisfaction\n\n--- PDF PAGE 10 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n9\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \n1.1 Client Profile \n1.2 Assignment instructions\n2. Team member’s concerns\n2.1 Roster/shift details\n3. Monitor performance \n3.1 Formal process \n3.2 Informal process\n4. Feedback \n4.1 Formal process \n4.2 Informal process\n5. Performance issues \n5.1 Work output \n5.2 Work quality \n5.3 Team participation \n5.4 Compliance with workplace protocols \n5.5 Safety \n5.6 Customer service\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2 Assessed and monitored team and individual \nperformance against set criteria \n1.3 Represented concerns of a team and individual to \nnext level of management or appropriate \nspecialist and to negotiate on their behalf \n1.4 Allocated duties and responsibilities, having \nregard to individual’s knowledge, skills and \naptitude and the needs of the tasks to be \nperformed \n1.5 Set and communicated performance expectations \nfor a range of tasks and duties within the team \nand provided feedback to team members\n2. Resource Implications \nThe following resources should be provided: \n2.1 Access to relevant workplace or appropriately \nsimulated environment where assessment can \ntake place \n2.2 Materials relevant to the proposed activity or task\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning \n3.3 Portfolio\n4. Context for Assessment \n4.1 Competency assessment may occur in workplace \nor any appropriately simulated environment \n4.2 Assessment shall be observed while task are \nbeing undertaken whether individually or in-group\n\n--- PDF PAGE 11 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n10\nUNIT OF COMPETENCY : DEVELOP AND PRACTICE NEGOTIATION SKILLS \n \n UNIT CODE :"
