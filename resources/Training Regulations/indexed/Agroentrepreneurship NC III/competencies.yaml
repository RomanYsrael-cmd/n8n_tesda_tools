dentifying \nmarket actors and \ndescribing the flow \nof activities in line \nwith market mapping \n• Selecting potential \nbuyers and BDS \nproviders \n• Selecting buyers and \nBDS providers to \nengage \n• Engaging buyers \nand BDS providers \n• Negotiation skills \n• Drawing a market \nmap \n• Activity planning \nskills \n• Team organizing \n• Skills in conducting \ninterview and \nobservation \n• Computation skills\n\n--- PDF PAGE 66 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n65\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nfacilitated based on \nthe result of market \nvisits \nsales, cost and \nincome) \n• Guidelines in \nchoosing buyers \nand BDS to engage \n• Market negotiation \nand forging \nagreements/ \narrangements \n \nAttitude: \n• Resourceful \n• Expansive \n• Open-minded \n• Involved \n• Enthusiastic \n• Making available \ntime \n• Diplomatic \n• Sensitive \n• Positive \n• Hardworking \n• Diligence \n• Patience \n• Business-minded \n• Openness \n• Practical \n• Decisive \n2. Undertake test \nmarketing \n2.1 Consolidation of \nproduce is \ncoordinated \naccording to agreed \nsupply plan \n2.2 Coordination with \nBDS is performed \nbased on AE plan \n2.3. Selling of \nconsolidated products \nto buyers is led \nbased on AE plan \n2.4. Test marketing \nassessments are \nguided according to \nindustry procedures \n \n• Procedures in the \npreparation for test \nmarketing \n• Agroenterprise \nobjective \n• Consensus building \nin organizational \ndecision making \n• Facilitation process \nto generate \nconsensus \n• Business planning \nand organizing \n• AE plan \n• Business action \nschedules \n• Market \narrangements \n• Presenting the \nresults of the market \nchain study \n• Formulating an AE \nobjective according \nto industry \nprocedures \n• Facilitating \nconsensus building \n• Making agreements \nor arrangements \nwith buyers \n• Forecasting product \nsupply \n• Computation skills \n• Compiling an AE \nplan and the \nbusiness action \nschedules\n\n--- PDF PAGE 67 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n66\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n• Product supply \nforecast \n• Computation of \nsales, cost and \nincome, variance \nanalysis \n• Operations \nmanagement in the \nproduct flow \n• Product quality \nmanagement \n• Traceability \n• Record keeping \nand documentation \n• Assessment of \nmarketing \nperformance \n• Contingency \nplanning \n• Procedure for post-\ntest marketing \nassessment \n \nAttitude: \n• Business minded \n• Diligent for detailed \nwork \n• Realistic \n• Motivated \n• Committed \n• Accountable \n• Decisive \n• Team player \n• Work oriented \n• Disciplined \n• Vigilant \n• Self-directed \n• Cooperative \n• Hardworking \n• Candid \n• Responsive \n• Endurance \n• Openness \n• Continuous learning\n• Completing the test \nmarketing \npreparation \n• Documentation skills \n• Motivational skills \n• Managing product \nflow to the buyers \n• Managing product \nquality and setting a \nsystem for \ntraceability \n• Recording of product \ndeliveries, sales, \ncosts and income \nand payment to \nfarmers \n• Consolidating and \nselling products to \nbuyers \n• Critical thinking skills \n• Contingency \nplanning skills \n• Problem solving \nskills \n• Conducting post-test \nmarketing \nassessment\n\n--- PDF PAGE 68 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n67\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3. Carry out \nsustained \nmarketing \n3.1 Adjustment in AE plan \nis facilitated \naccording to the \nresult of test \nmarketing \nassessment \n3.2 Product deliveries are \ncoordinated based on \nthe improved AE \nplan \n3.3 Installation of \nmanagement \nstructure with \nbusiness operating \nsystems and policies \nis led according to \nindustry practices \n3.4 Potential second \nliners are \nrecommended \naccording to \nestablished criteria \n• Evaluation and \nplanning for \nbusiness \nsustainability \n• Value chain \nupgrading \n• Business \nnetworking \n• Organizational \nconsensus \n• Computation of \nsale, cost and \nincome \n• Procedures to \nimprove the AE \nplan \n• Managing market \nrelationships \n• Business efficiency \n• Data gathering, \nconsolidation and \nanalysis \n• Price behavior and \nprice monitoring \n• Governance and \naccountability \n• Internal control \n• Business \nmanagement set-up \n(structure, systems \nand policies) \n• Monitoring and \nevaluation of \nbusiness \nperformance \n• Reporting the AE \nperformance \n \nAttitude: \n• Business minded \n• Expansive \n• Open-minded \n• Flexible \n• Committed \n• Hardworking \n• Passionate \n(motivated) \n• Facilitating a \nreflection session for \nbusiness evaluation \n• Communication \nskills \n• Business networking \nskills \n• Facilitating \norganizational \nconsensus \n• Computation skills \n• Improving the AE \nplan \n• Managing marketing \noperations with \nefficiency \n• Researching skills \n• Conducting price \nanalysis \n• Documenting \nregular marketing \nactivities \n• Delivering products \n• Constructing the \nmanagement \nstructure for AE \n• Documenting in \nwritten form the AE \nbusiness operating \nsystems and policies \n• Reporting to the \nfarmers the AE \nperformance \n• Installing the \nmanagement \nstructure, systems \nand policies\n\n--- PDF PAGE 69 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n68\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n• Accountable \n• Work oriented \n• Goodwill \n• Resourceful \n• Cooperative \n• Perseverance \n• Discipline \n• Responsibility \n• Transparency \n•Perseverance\n4. Scale up AE \noperations \n4.1 Farmers are guided to \nstudy additional \nmarket based on \nproduct supply \ncapacity & market \nrequirement \n4.2 Value adding activities \nare introduced based \non market \nrequirements \n4.3 Review of AE \nBusiness operation is \nundertaken together \nwith farmers \naccording to industry \nstandard practices \n4.4 Enhancement of \nagroenterprise plan is \ndirected according to \nincreasing members, \nproducts and markets \n• Potential products \nand by-products to \nbe developed \n• Various market \nrequirement \n• Data gathering \n• Types of products \nthat are high \nyielding varieties \nand tolerant to pest \nand diseases \n• Comparative cost \nand return of the \ndiversified products \n• Climate change \nresilient products \n• Conduct of market \nchain study \n• Data gathering and \nanalysis \n• Market negotiation \n• Procedure in \nidentifying markets \nto engage \n• Computation of \ncosts and income \n \nAttitudes: \n• ingenuity \n• commitment \n• resourcefulness \n• risk-taker \n•motivation\n• Conducting product \ndevelopment out of \nexisting one \n• Identifying new \nproducts and by-\nproducts to be \ndeveloped \n• Selecting additional \nproduct based \nmarket opportunities \n• Computation skills \n• Data gathering and \nconsolidation \n• Guiding farmers to \nstudy additional \nmarket \n• Market negotiation \nskill\n\n--- PDF PAGE 70 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n69\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Conduct of market visit \nConduct of market visit includes: \n1.1. interview guide \n1.2. type of information \n1.3. tips and guideposts in conducting interview \n2. Business development \nservice (BDS) \nBusiness development service (BDS) include: \n2.1. trucking \n2.2. cold storage \n2.3. warehousing \n2.4. crates \n3. Test marketing \nTest marketing includes: \n3.2. Consolidation of produce \n3.3. Coordination with business development service (BDS) \n3.4. Selling of consolidated products to buyers \n3.5. Schedule of delivery \n4. Value adding activities \nValue adding activities includes: \n4.1. development of new product \n4.2. consolidation \n4.3. post-harvesting \n4.4. packaging \n4.5. processing \n5. Additional markets \nAdditional markets may include: \n5.1. Formal market (corporate, institutional) \n5.2. Informal markets (no business documentation)\n\n--- PDF PAGE 71 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n70\nEVIDENCE GUIDE \n \n1. Critical Aspects of Competency \nAssessment requires evidence that the candidate: \n1.1. Conducted market chain study \n1.2. Undertaken test marketing \n1.3. Carried out sustained marketing \n1.4. Scaled up AE operations \n2. Resource Implications \nThe following resources should be provided: \n2.1. Simulated/actual workplace \n2.2. Tools, materials, supplies and equipment to be used \nto demonstrate the required tasks \n2.3. Reference and manuals \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1. Written exam \n3.2. Oral questioning \n3.3. Demonstration \n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter in a simulated workplace setting.\n\n--- PDF PAGE 72 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n71"
