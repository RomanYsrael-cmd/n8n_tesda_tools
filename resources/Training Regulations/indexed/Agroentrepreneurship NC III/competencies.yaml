.8 Facilitated the registration of farmer’s organization.\n2. Resource Implications \nThe following resources should be provided: \n2.1 Training hall/Simulated workplace \n2.2 Tools, materials, supplies and equipment to \ndemonstrate required tasks \n2.3 References and materials\n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Demonstration \n3.3 Oral questioning \n3.4 Interview\n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center \nin a simulated workplace setting.\n\n--- PDF PAGE 48 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n47\nUNIT OF COMPETENCY \n: \nENSURE PRODUCT SUPPLY \nUNIT CODE \n: \nAFF243306 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge, skills and attitudes \nrequired for AE implementer to lead in selection of \nproduct, establish production module, prepare supply \nplan, oversee and monitor the implementation of \nproduction \nactivities \nand \nimplement \nsafety \nand \nprecautionary measures\n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Lead in the \nselection of \nproduct \n1.1 Product data are \nextracted from the \nfarmers information \nprofile \n1.2 Prioritized products \nare presented based \non established \ncriteria \n1.3 Farmers are guided in \nthe selection of \nproduct for \nagroenterprise \nthrough consensus \n• Data collection and \nextraction of \nexisting products \nfrom farmers \ninformation profile \n• Criteria of \nscreening \n• Analytical tool \n(ANSOFF matrix) \n• Procedures of \npresentation and \nscreening of the \nlists of products \n• Data Analysis \n• Different concensus \nmethods \n• Process of getting \nconsensus \n• Concepts & \nMethods of \nFacilitation \n \nAttitude: \n• Patience \n• Diplomacy \n• Open minded \n• Fair \n• Non-judgmental \n• Collating and \nextracting existing \nproducts from the \nfarmers information \nprofile \n• Presenting and \nscreening of list \nproducts \n• Facilitating skills \n• Agreeing for the \nselected products \nthrough concensus \n \n2. Establish \nProduction \nModule \n2.1 Data from the bench \nmarking on \nproduction are \ngathered based on \nestablished \nguidelines \n• Guidelines for Data \nGathering \n• Different methods \nof Data Gathering \n• Sources of Data \n• Gathering of data on \nthe best production \npractices \n• Gathering data on \nthe best farming \npractices by\n\n--- PDF PAGE 49 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n48\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.2 Production module \nis developed \naccording to data \ngathered and best \npractices \n2.3 Production module \nis presented and \nconfirmed with \nmembers based on \nconsensus \n• Interview \nTechniques \n• Cost & Return \nComputation \n• Guide for \nDeveloping \nProduction Module \n• Data Collation & \nTabulation \nProcedure \n• Methods and \nprocedure of Data \nAnalysis \n• Agri-Production \npractices (cultural \nManagement) \n• Production Module \nGuide \n• Cost & Return \nComputation & \nAnalysis \n• Good Agricultural \nPractices (GAP) \n• Good \nManufacturing \nActivities (GMP) \n \n \nAttitude: \n• Information seeking \n• Open minded \n• Good \nConversationalist \n• Patience \n• Resourcefulness \n• Perseverance \n• Honesty \n• Social responsibility \n• Commitment \nInterviewing key \ninformants \n• Calculating cost and \nreturns of production \n• Collating & \nTabulating collected \ndata \n• Analyzing collated \nand tabulated data \non the best farming \npractices \n• Designing \nProduction Module \nbased industry \nstandards \n3. Prepare \nsupply plan \n3.1 Product supply is \nestimated based on \nfarmers committed \nProduction modu