 orders, memorandums, notices, announcements \n3.8 \nEmployee movements (promotion, demotion, discharge, \ntermination, suspension) \n3.9 \nLinkages such as Loan Verification, SSS and Philhealth \ndues. \n3.10 Organizational Profile (Vision, Mission, Goals and \nObjectives) \n3.11 Electronic documentations e.g. Website \n3.12 Files/Employees’ Profile\n4.Quality \nstandards \nQuality standards may be related but are not limited to the \nfollowing: \n4.1 \nMaterials \n4.2 \nSoftware \n4.3 \nOffice supplies \n4.4 \nOffice facilities \n4.5 \nOffice equipment \n4.6 \nOffice standard forms \n4.7 \nWork processes \n4.8 \nCustomer service \n4.9 \nProducts and services \n4.10 Work outputs \n4.11 Communication process \n4.12 Ethical and professional ethics \n4.13 Training program design and delivery \n4.14 Value added services/product innovations \n4.15 Organization’s policies and procedures manual\n5.Client \nIncludes the following but are not limited to: \n5.1 \nExternal clients (customers, partners, members, subscribers, \nend users, investors/funders, service providers, agencies) \n5.2 \nInternal clients (within the organization/co-employees, \nimmediate superiors, board of trustees)\n\n--- PDF PAGE 42 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n41\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Performed work in accordance with the organization’s \nstandard operating procedures and specifications \n1.2 Identified and reported defects in accordance with \nstandard operating procedures \n1.3 Carried out work in accordance with the process \nimprovement procedures\n2. Resource \nimplications \nThe following resources MUST be provided: \n2.1 Product manuals and brochures \n2.2 Marketing and promotional materials \n2.3 Orientation and presentation materials \n2.4 Office standard forms and documentation \n2.5 Operational handbook/manuals \n2.6 Work plans and schedules \n2.7 Hardware \n2.