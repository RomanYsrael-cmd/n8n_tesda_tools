        "source_title": "APPLY SAFETY MEASURES IN FARM OPERATIONS",
        "source_text": "--- PDF PAGE 25 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n24\nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nAPPLY SAFETY MEASURES IN FARM \nOPERATIONS \n \nUNIT CODE \n: \nAFF 321201 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to perform safety measures effectively and \nefficiently. It includes identifying areas, tools, \nmaterials, time and place in performing safety \nmeasures. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1.  Determine \nareas of \nconcern for \nsafety \nmeasures  \n1.1 Work tasks are \nidentified in line with \nfarm operations \n1.2 Place for safety \nmeasures are \ndetermined in line \nwith farm operations \n1.3 Time for safety \nmeasures are \ndetermined in line \nwith farm operations \n1.4 Appropriate tools, \nmaterials and \noutfits are prepared \nin line with job \nrequirements \n Different work tasks \nin farm operations \n Place and time for \nimplementation of \nsafety measures \n Different hazards in \nthe workplace \n Types of tools, \nmaterials and \noutfits  \n Preparation of \ntools, materials and \noutfits \n Identifying work \ntasks in farm \noperations \n Determining place \nand time for \nimplementation of \nsafety measures \n Reading labels, \nmanuals and other \nbasic safety \ninformation \n Identifying effective/ \nfunctional tools, \nmaterials and outfit \n Preparing tools, \nmaterials and outfits \n Discarding defective \ntools, and materials\n2.  Apply \nappropriate \nsafety \nmeasures \n2.1 Tools and materials \nare used according to \nspecifications and \nprocedures \n2.2 Outfits are worn \naccording to farm \nrequirements \n2.3 Effectivity/shelf \nlife/expiration of \nmaterials are strictly \nobserved \n2.4 Emergency \nprocedures are \nknown and followed \n Uses and functions \nof tools  \n Outfits and how to \nwear it. \n Expiration/shelf life \nof materials \n Proper disposal of \nexpired materials \n Environmental rules \nand regulations \n Disaster Risk and \nReduction \nManagement \n Emergency \nprocedures \n Using tools and \nmaterials in the \nworkplace \n Wearing of outfits \n Observing \nexpiration/shelf life \nof materials \n Disposing of expired \nmaterials \n Following \nemergency \nprocedures \n Identifying and \nreporting of hazards \nin workplace area\n\n--- PDF PAGE 26 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n25\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nto ensure a safework \nrequirement \n2.5 Hazards in the \nworkplace are \nidentified and \nreported in line with \nfarm guidelines \n Hazards \nidentification and \nreporting \n Climate Change \nAdaptation and \nMitigation \n Communication \nskills \n OSHS \n3.  Safekeep/ \ndispose tools, \nmaterials and \noutfit \n3.1 Used tools and outfit \nare cleaned after use \nand stored in \ndesignated areas \n3.2 Unused materials are \nproperly labeled and \nstored according to \nmanufacturer’s \nrecommendation and \nfarm requirements \n3.3 Waste materials are \ndisposed according to \nmanufacturers, \ngovernment and farm \nrequirements.\n Procedures of \ncleaning used tools \nand outfits \n Label and storage \nunused materials \n Disposal of wastes \nmaterials \n Manufacturers’ \nrecommendation on \nkeeping materials   \n Environmental rules \nand regulations \n Cleaning used tools \nand outfit   \n Labelling and storing \nunused materials  \n Disposing waste \nmaterials\n\n--- PDF PAGE 27 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n26\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Work tasks \nWork task may be selected from any of the subsectors: \n1.1 Crop Production \n1.2 Post-harvest \n1.3 Agri-marketing \n1.4 Farm Equipment\n2.  Place \n2.1 Stock room/storage areas/warehouse \n2.2 Field/farm/orchard\n3.  Time \n3.1 Fertilizer and pesticides application \n3.2 Feed mixing and feeding \n3.3 Harvesting and hauling\n4.  Tools, materials and outfits \n4.1 Tools \n4.1.1 Wrenches \n4.1.2 Screw driver \n4.1.3 Pliers \n4.2 Outfit \n4.2.1 Masks \n4.2.2 Gloves \n4.2.3 Boots \n4.2.4 Overall coats \n4.2.5 Hat \n4.2.6 Eye goggles\n5.  Emergency procedures \n5.1 Location of first aid kit \n5.2 Evacuation \n5.3 Agencies contract \n5.4 Farm emergency procedures\n6.  Hazards \n6.1 Chemical \n6.2 Electrical \n6.3 Falls\n\n--- PDF PAGE 28 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n27\nEVIDENCE GUIDE \n \n1.  Critical Aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined areas of concern for safety measures \n1.2 Applied appropriate safety measures according to \nindustry requirements \n1.3 Prepared tools, materials and outfit needed \n1.4 Performed proper disposal of used materials \n1.5 Cleaned and stored tools, materials and outfit in \ndesignated facilities \n2.  Method of \nAssessment \nCompetency in this unit must be assessed through: \n2.1 Practical demonstration \n2.2 Third Party Report\n3.  Resource \nImplications \n3.1 Farm location \n3.2 Tools, equipment and outfits appropriate in applying \nsafety measures\n4.  Context of \nAssessment\n4.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
