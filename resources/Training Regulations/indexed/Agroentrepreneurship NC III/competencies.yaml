        "source_text": "500311114 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, skills, \nand attitude required in selecting, sourcing and \napplying appropriate and affordable technologies in the \nworkplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Study/select \nappropriate \ntechnology \n1.1 Usage of different \ntechnologies is \ndetermined based on \njob requirements \n1.2 Appropriate \ntechnology is \nselected as per work \nspecification \n• Awareness on \ntechnology and its \nfunction \n• Communication \ntechniques \n• Health and safety \nprocedure \n• Company policy in \nrelation to relevant \ntechnology \n• Machineries/ \nequipment and their \napplication \n• Software programs \n• Identifying relevant \ntechnology on job \n2. Apply \nrelevant \ntechnology \n2.1 Relevant technology \nis effectively used in \ncarrying out function \n2.2 Applicable software \nand hardware are \nused as per task \nrequirement \n2.3 Management \nconcepts are \nobserved and \npracticed as per \nestablished industry \npractices \n• Knowledge on \noperating \ninstructions \n• Understanding \nsoftware and \nhardware system \n• Communication \ntechniques \n• Health and safety \nprocedure \n• Company policy in \nrelation to relevant \ntechnology \n• Different \nmanagement \nconcepts \n• Technology \nadaptability \n• Office technology \n• Industrial \ntechnology \n• System technology \n• Applying relevant \ntechnology \n• Communicating \nskills \n• Using software \napplications skills \n• Conducting risk \nassessment\n\n--- PDF PAGE 23 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n22\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n• Training technology \n• Different software/ \nhardware \n• 5S (Proper \nhousekeeping) \n3. Maintain/ \nenhance \nrelevant \ntechnology \n3.1 Maintenance of \ntechnology is applied \nin accordance with \nthe industry \nstandard operating \nprocedure, \nmanufacturer’s \noperating \nguidelines and \noccupational health \nand safety \nprocedureto ensure \nits operative ability \n3.2 Updating of \ntechnology is \nmaintained through \ncontinuing education \nor training in \naccordance with job \nrequirement \n3.3 Technology failure/ \ndefect is immediately \nreported to the \nconcern/responsible \nperson or section for \nappropriate action \n• Awareness on \ntechnology and its \nfunction \n• Repair and \nmaintenance \nprocedure \n• Health and safety \nprocedure \n• Company policy in \nrelation to relevant \ntechnology \n• 3.5 Upgrading of \ntechnology \n• 3.6 Organizational \nset-up/work flow \n• Performing basic \ntroubleshooting skills\n• Identifying failures or \ndefects \n• Communication \nskills \n• Applying corrective \nand preventive \nmaintenance\n\n--- PDF PAGE 24 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n23\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technology \nMay include: \n1.1 Office technology \n1.2 Industrial technology \n1.3 System technology \n1.4 Information technology \n1.5 Training technology\n2. Management concepts \nMay include: \n2.1 Real Time Management \n2.2 KAIZEN or continuous improvement \n2.3 Total Quality Management \n2.4 Other management/productivity tools\n3. Industry standard operating \nprocedure \n3.1 Written guidelines relative to the usage of office \ntechnology/equipment \n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating \nguidelines/ instructions \n4.1 Written instruction/manuals of specific technology/ \nequipment \n4.2 General instruction manual \n4.3 Verbal advise from manufacturer relative to the \noperation of equipment\n5. Occupational health and \nsafety procedure\n5.1 Relevant statutes on OHS \n5.2 Organization guidelines in using technology/equipment\n6. Appropriate action \n6.1 Implementing preventive maintenance schedule \n6.2 Coordinating with manufacturer’s technician \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Studied and selected appropriate technology consistent \nwith work requirements \n1.2 Applied relevant technology \n1.3 Maintained and enhanced operative ability of relevant \ntechnology\n2. Resource Implications \nThe following resources should be provided: \n2.1 Relevant technology \n2.2 Interview and demonstration questionnaires \n2.3 Assessment packages\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning\n4. Context for Assessment \nCompetency may be assessed in actual workplace or \nsimulated environment\n\n--- PDF PAGE 25 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n24\nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nAPPLY SAFETY MEASURES IN FARM \nOPERATIONS \n \nUNIT CODE \n:"
