  "source_section_text": "Section 1\nAGROENTREPRENEURSHIP NC III QUALIFICATION\n\nThe AGROENTREPRENEURSHIP NC III Qualification consists of competencies that\na person must achieve to engage agroenterprise (AE) industry stakeholders, ensure\nproduct supply, implement financial management, mobilize farmer’s participation in\ncapacity building activities and conduct collective marketing.\n\nThis Qualification is packaged from the competency map of the Agriculture, Forestry\nand Fishery Sector as shown in Annex A.\n\nThe units of competency comprising this qualification includes the following:\n\nCode\nBASIC COMPETENCIES\n500311109\nLead Workplace Communication\n500311110\nLead small teams\n500311111\nDevelop and Practice Negotiation Skills\n500311112\nSolve Problems Related to Work Activities\n500311113\nUse Mathematical Concepts and Techniques\n500311114\nUse Relevant Technologies\nCode\nCOMMON COMPETENCIES\nAFF321201\nApply Safety Measures in Farm Operations\nAFF321203\nPerform Estimation and Basic Calculation\nHCS421201\nProvide Quality Customer Service\nHCS315202\nComply with Quality and Ethical Standards\nCode\nCORE COMPETENCIES\nAFF243305\nEngage Agroenterprise (AE) Industry Stakeholders\nAFF243306\nEnsure Product Supply\nAFF243307\nImplement Financial Management\nAFF243308\nMobilize Farmers Participation in Capacity Building Activities\nAFF243309\nConduct Collective Marketing\nA person who has achieved this Qualification is competent to be:\n\n• Farmer Leader\n\n--- PDF PAGE 4 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n3"
