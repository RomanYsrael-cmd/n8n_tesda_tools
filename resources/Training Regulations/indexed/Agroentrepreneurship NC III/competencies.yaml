  "source_section_text": "SECTION 2 \n \nCOMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core \nunits of competency required in AGROENTREPRENEURSHIP NC III. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n \n: 500311109 \n \nUNIT DESCRIPTOR \n \n: This unit covers the knowledge, skills and attitudes \nrequired to lead in the dissemination and discussion of \nideas, information and issues in the workplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1 Appropriate \ncommunication \nmethod is selected \n1.2 Multiple operations \ninvolving several \ntopics areas are \ncommunicated \naccordingly \n1.3 Questions are used \nto gain extra \ninformation \n1.4 Correct sources of \ninformation are \nidentified \n1.5 Information is \nselected and \norganized correctly \n1.6 Verbal and written \nreporting is \nundertaken when \nrequired \n1.7 Communication skills \nare maintained in all \nsituations \n• Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n• Effective verbal \ncommunication \nmethods \n• Methods of \nCommunication \n• Types of Question \n• Communication \nTools \n• Questioning \nTechniques \n• Organizing \ninformation \n• Understanding and \nconveying intended \nmeaning \n• Participating in \nvariety of workplace \ndiscussions \n• Complying with \norganization \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n• Reporting \noccupational \nhazards during \nmeetings \n2. Lead \nworkplace \ndiscussions \n2.1 Response to \nworkplace issues are \nsought \n2.2 Response to \nworkplace issues are \nprovided immediately \n• Leadership as a \nmanagement \nfunction \n• Barriers of \ncommunication \n• Communicating \neffectively\n\n--- PDF PAGE 5 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n4\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3 Constructive \ncontributions are \nmade to workplace \ndiscussions on such \nissues as production, \nquality and safety \n• Effective verbal \ncommunication \nmethods \n• Method/techniques \nof discussion \n• How to lead \ndiscussion \n• How to solicit \nresponse \n3. Identify and \ncommunicate \nissues arising \nin the \nworkplace \n3.1. Issues and problems \nare identified as they \narise \n3.2. Information regarding \nproblems and issues \nare organized \ncoherently to ensure \nclear and effective \ncommunication \n3.3. Dialogue is initiated \nwith appropriate \npersonnel \n3.4. Communication \nproblems and issues \nare raised as they \narise \n• Types of issues and \nproblems in the \nworkplace \n• Written and \nelectronic \ncommunication \nmethods \n• Communication \nbarriers affecting \nworkplace \ndiscussions \n• Identifying problems \nand issues, as well \nas its cause \n• Organizing \ninformation on \nproblems and issues\n\n--- PDF PAGE 6 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n5\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Communication method \n1.1 Non-verbal gestures \n1.2 Verbal \n1.3 Face to face \n1.4 Two-way radio \n1.5 Speaking to groups \n1.6 Using telephone \n1.7 Written \n1.8 Internet\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at one \ntime \n1.2 Made constructive contributions in workplace issues \n1.3 Sought workplace issues effectively \n1.4 Responded to workplace issues promptly \n1.5 Presented information clearly and effectively written \nform \n1.6 Used appropriate sources of information \n1.7 Asked appropriate questions \n1.8 Provided accurate information \n2. Resource Implications \nThe following resources should be provided: \n2.1 Variety of Information \n2.2 Communication tools \n2.3 Simulated workplace\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning\n4. Context for Assessment \nCompetency may be assessed in the workplace or in \nsimulated workplace environment\n\n--- PDF PAGE 7 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n6\nUNIT OF COMPETENCY : LEAD SMALL TEAMS \n(Guide and lead others/Be responsible to others) \n \nUNIT CODE \n \n: \n500311110 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes to \nlead small teams including setting and maintaining \nteam and individual performance standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Provide team \nleadership \n1.1 Work requirements \nare identified and \npresented to team \nmembers \n1.2 Reasons for \ninstructions and \nrequirements are \ncommunicated to \nteam members \n1.3 Team members’ \nqueries and \nconcerns are \nrecognized, \ndiscussed and dealt \nwith \n \n• Organizational \npolicies and \nprocedures \no How \nperformance \nexpectations are \nset \no Methods of \nMonitoring \nPerformance \n• Client expectations \n• Definition of Team \n• Team member’s \nduties and \nresponsibilities \n• Skills and \ntechniques in \npromoting team \nbuilding \n• Up-to-date \ndissemination of \ninstructions and \nrequirements to \nmembers \n• Art of listening and \ntreating individual \nteam members \nconcern\n• Communication \nskills required for \nleading teams \n• Team building skills \n• Negotiating skills \n• Evaluation skills \n2. Assign \nresponsibilitie\ns \n2.1 Duties and \nresponsibilities are \nassigned in \nconsideration of \nskills, knowledge, and \naptitude required to \nproperly undertake \nthe task and \naccording to \ncompany policy \n• Concept of \ndelegation \n• Understanding \nindividual \ndifferences \n• Methods of \nmonitoring \nperformance \n• Duties and \nresponsibilities of \n• Delegating skills \n• Identifying individual \nskills, knowledge \nand attitude as basis \nfor allocating \nresponsibilities \n• Identifying each \nteam member duties \nand responsibilities\n\n--- PDF PAGE 8 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n7\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.2 Duties are delegated \naccording to \nindividual preference, \ndomestic and \npersonal \nconsiderations, \nwhenever possible \neach team \nmember(e.g. \nRights, roles and \nresponsibilities of \nfarmers) \n• Knowledge in \nidentifying each \nteam member \nduties and \nresponsibilities \n3. Set \nperformance \nexpectations \nfor team \nmembers \n3.1 Performance \nexpectations are \nestablished based on \nclient needs and \naccording to \nassignment \nrequirements \n3.2 Performance \nexpectations are \nbased on individual \nteam members duties \nand area of \nresponsibility \n2.3 Performance \nexpectations are \ndiscussed and \ndisseminated to \nindividual team \nmembers\n• Definition of \nperformance \nindicators/ criteria \n• Definition of team \ngoals and \nexpectations \n• Methods of \nmonitoring \nperformance \n• Client expectations \n• Team members \nduties and \nresponsibilities \n• Defining \nperformance \nexpectations criteria\n• Identifying \nperformance \nindicators \n• Evaluating \nperformance \n• Setting individual \nperformance target/ \nexpectation \nindicators \n4. Supervise \nteam \nperformance \n4.1 Monitoring of \nperformance takes \nplace against defined \nperformance criteria \nand/or assignment \ninstructions and \ncorrective action \ntaken if required \n4.2 Team members are \nprovided with \nfeedback, positive \nsupport and advice \non strategies to \novercome any \ndeficiencies \n4.3 Performance issues \nwhich cannot be \nrectified or addressed \nwithin the team are \n• Understanding, \nmonitoring of work \n• How to undertake \ncorrective and \npreventive action \n• Understanding \nfeedback and \nprocedure \n• Feedback reporting \nprocedure \n• Methods of \nmonitoring \nperformance \n• Team member’s \nduties and \nresponsibilities \n• Monitoring team \noperation to ensure \n• Monitoring skills \n• Setting priorities \n• Evaluating \nperformance \n• Informal/ formal \ncounseling skill\n\n--- PDF PAGE 9 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n8\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nreferenced to \nappropriate personnel \naccording to \nemployer policy \n4.4 Team members are \nkept informed of any \nchanges in the \npriority allocated to \nassignments or tasks \nwhich might impact \non client/customer \nneeds and \nsatisfaction \n4.5 Team operations are \nmonitored to ensure \nthat employer/client \nneeds and \nrequirements are met \n4.6 Follow-up \ncommunication is \nprovided on all issues \naffecting the team \n4.7 All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany procedures\nclient needs and \nsatisfaction\n\n--- PDF PAGE 10 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n9\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \n1.1 Client Profile \n1.2 Assignment instructions\n2. Team member’s concerns\n2.1 Roster/shift details\n3. Monitor performance \n3.1 Formal process \n3.2 Informal process\n4. Feedback \n4.1 Formal process \n4.2 Informal process\n5. Performance issues \n5.1 Work output \n5.2 Work quality \n5.3 Team participation \n5.4 Compliance with workplace protocols \n5.5 Safety \n5.6 Customer service\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2 Assessed and monitored team and individual \nperformance against set criteria \n1.3 Represented concerns of a team and individual to \nnext level of management or appropriate \nspecialist and to negotiate on their behalf \n1.4 Allocated duties and responsibilities, having \nregard to individual’s knowledge, skills and \naptitude and the needs of the tasks to be \nperformed \n1.5 Set and communicated performance expectations \nfor a range of tasks and duties within the team \nand provided feedback to team members\n2. Resource Implications \nThe following resources should be provided: \n2.1 Access to relevant workplace or appropriately \nsimulated environment where assessment can \ntake place \n2.2 Materials relevant to the proposed activity or task\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning \n3.3 Portfolio\n4. Context for Assessment \n4.1 Competency assessment may occur in workplace \nor any appropriately simulated environment \n4.2 Assessment shall be observed while task are \nbeing undertaken whether individually or in-group\n\n--- PDF PAGE 11 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n10\nUNIT OF COMPETENCY : DEVELOP AND PRACTICE NEGOTIATION SKILLS \n \n UNIT CODE : 500311111 \n \nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes \nrequired to collect information in order to negotiate to \na desired outcome and participate in the negotiation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan \nnegotiations \n1.1 Information on \npreparing for \nnegotiation is \nidentified and \nincluded \n1.2 Non verbal \nenvironments is \nidentified and \nincluded \n1.3 Information on active \nlistening is identified \nand included \n1.4 Information on \ndifferent questioning \ntechniques is \nidentified and \nincluded \n1.5 Information is \nchecked to ensure it \nis correct and up-to- \ndate\n• Knowledge on \nCodes of practice \nand guidelines for \nthe organization \n• Knowledge of \norganizations policy \nand procedures for \nnegotiations \n• Decision making \nand conflict \nresolution \nstrategies \nprocedures \n• Concept of \nnegotiation \n• Communication \nskills (verbal and \nlistening) \n• Active listening \n• Setting conflict \n• Preparing conflict \nresolution \n• Problem solving \nstrategies on how to \ndeal with \nunexpected \nquestions and \nattitudes during \nnegotiation \n• Interpersonal skills \nto develop rapport \nwith other parties \n2. Participate in \nnegotiations \n2.1 Criteria for successful \noutcome are agreed \nupon by all parties \n2.2 Desired outcome of \nall parties are \nconsidered \n2.3 Appropriate language \nis used throughout \nthe negotiation \n2.4 A variety of \nquestioning \ntechniques are used \n2.5 The issues and \nprocesses are \ndocumented and \nagreed upon by all \nparties \n• Outcome of \nnegotiation \n• Knowledge on \nLanguage \n• Different \nQuestioning \ntechniques \n• Problem solving \nstrategies on how \nto deal with \nunexpected \nquestions and \nattitudes during \nnegotiation \n• Flexibility \n• Empathy \n• Decision making \nand conflict \n• Negotiating skill \n• Communication \nskills (verbal and \nlistening) \n• Observation skills \n• Interpersonal skills \nto develop rapport \nwith other parties \n• Applying effective \nquestioning \ntechniques \n• Setting conflict\n\n--- PDF PAGE 12 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n11\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.6 Possible solutions are \ndiscussed and their \nviability assessed \n2.7 Areas for agreement \nare confirmed and \nrecorded \n2.8 Follow-up action is \nagreed upon by all \nparties 