0 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n59\nUNIT OF COMPETENCY \n: \nMOBILIZE FARMERS PARTICIPATION IN \nCAPACITY BUILDING ACTIVITIES \nUNIT CODE \n: \nAFF243308 \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes \nrequired of farmer cluster leader to assess capacity \nbuilding needs of farmers, implement capacity building \nprogram and mentor farmers. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Assess \nCapacity \nBuilding \nneeds of \nfarmers \n1.1 Feedback are \ngathered from \nFarmer Members \nbased on industry \nstandards \n1.2 Capacity building \ninterventions for \nfarmer members are \nprioritized with AE \nFacilitator based on \ngathered feedback \n1.3 Prioritized capacity \nbuilding interventions \nare discussed with \nfarmer members for \nagreement based on \nindustry standards \n1.4 Prioritized capacity \nbuilding interventions \nare endorsed to AE \nFacilitator based on \nthe agreement \n• Definition and kinds \nof capacity building \nneeds \n• Ways to assess \ncapacity building \nneeds of members \n• Definition and \nprocess of \nfeedback \n \nAttitudes: \n• Diplomatic \n• Diligent \n• Patient \n• Data gathering skills \n• Communication \nskills \n• Planning skills \n• Analyzing skills \n2. Facilitate \nparticipation \nof farmers in \ncapacity \nbuilding \nintervention \n2.1 Farmers are identified \nand endorsed for \ncapacity building \ntraining \n2.2 Request letter for \naccessing support for \nfarmers capacity \nbuilding intervention \nis prepared and \nsubmitted to \nappropriate \ninstitutions based \non agreement with \nfarmer members \n• The different types \nof capacity building \nsupport by \ninstitution \n• Basic letter writing \nfor support \naccessing \n• Procedures in \nconducting farmers \ntraining \n• Facilitation and the \nfacilitator \n \nAttitudes: \n• Resourceful \n• Letter writing skills \n• Communication \nskills \n• Monitoring/ \nCoordination skills \n• Negotiation Skills \n• Facilitation Skills\n\n--- PDF PAGE 61 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n60\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.3 Farmer participation to \ncapacity building \nintervention is \ncoordinated and \nmonitored \n• Diligent \n• Creative \n3. Coach and \nmentor \nfarmers \n3.1 Scope and scheme of \ncoaching and \nmentoring is \ndetermined based on \nthe needs of farmer \nmembers \n3.2 Coaching and \nmentoring activities \nwith farmer members \nare done based on \nAE planned activities \n3.3 Farmers’ learnings \nand insights on AE \nactivities are \ngathered using \nappropriate tools \nand techniques\n• Definition of \ncoaching and \nmentoring \n• Procedures to do \nfarmer to farmer \ncoaching \n \nAttitudes: \n• Patient \n• Diligent \n• Confidence \n• Polite \n• Humble \n• Open-minded \n• Coaching skills \n• Communication \nskills \n• Planning skills\n\n--- PDF PAGE 62 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n61\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Feedback \nFeedback includes: \n1.1. issues \n1.2. gaps \n1.3. problems \n1.4. suggestions and recommendations \n1.5. needs \n2. Gathering methods \nGathering methods include: \n2.1. actual visit \n2.2. survey \n2.3. interview \n2.4. Focused group discussion (FGD) \n2.5. one-on-one consultation \n2.6. meeting \n3. Capacities building \ninterventions \nCapacities building interventions may include but not \nlimited to: \n3.1. Technology Demonstration \n3.2. Marketing \n3.3. Organizational Behavior \n3.4. Community Involvement \n3.5. Volunteerism \n3.6. Financial Literacy \n3.7. Harvest Festivals \n3.8. OSH orientation \n4. Endorsement \nEndorsement includes: \n4.1. \nsimple written letter \n4.2. \nverbal endorsement \n5. Institutions \nInstitutions may include but not limited to: \n5.1. \nLocal Government Units \n5.2. \nSeed and Chemical Companies \n5.3. \nNational Government Agencies \n5.4. \nNon-government organizations \n5.5. \nFinancial Institutions \n6. Coordination \nCoordination may include but not limited to: \n6.1. \nissuance of training invite \n6.2. \nhouse to house visit \n6.3. \nannouncement during meeting \n6.4. \nbulletin board \n6.5. \nuse of mobile phone\n\n--- PDF PAGE 63 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n62\n7. Monitoring of capacity \nbuilding intervention \nMonitoring may include but not limited to: \n7.1. certificate of attendance/appearance \n7.2. attendance sheet \n7.3. pictures \n7.4. accompanying participant \n7.5. use of mobile phone \n7.6. re-echo \n8. Coaching \nCoaching activities may include but not limited to: \n8.1. One on one monitoring of crops for marketing \n8.2. Monthly or quarterly meetings \n9. Appropriate tools and \ntechniques \nAppropriate tools and techniques may include but not \nlimited to: \n9.1. letter writing \n9.2. story telling\n\n--- PDF PAGE 64 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n63\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Assessed the capacity building needs of farmers \n1.2. Facilitated participation of farmers in capacity \nbuilding intervention \n1.3. Coached and mentored farmers \n2. Resource Implications \nThe following resources should be provided: \n2.1. Simulated/ actual work area \n2.2. Tools, materials, supplies and equipment to be \nused to demonstrate required tasks \n2.3. Production Input samples \n2.4. Reference materials (manual, guide book) \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1. Written exam \n3.2. Oral questioning \n3.3. Demonstration \n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace \nor at the designa