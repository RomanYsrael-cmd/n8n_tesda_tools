        "source_title": "COMPLY WITH QUALITY AND ETHICAL STANDARDS",
        "source_text": "--- PDF PAGE 36 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n35\nUNIT OF COMPETENCY  \n: \nCOMPLY WITH QUALITY AND ETHICAL  \n \n \n \n \n \n \nSTANDARDS \n \nUNIT CODE  \n \n \n: \nHCS315202 \n \nUNIT DESCRIPTOR \n \n \n: \nThis unit covers the knowledge, skills and  \n \n \n \n \nattitudes needed to apply quality and  \n \n \nethical standards in the workplace. The unit \n \n \nalso includes the application of relevant  \n \n \nsafety procedures and regulations,  \n \n \norganization procedures, client and  \n \n \nindustry requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1.  Assess \nquality of \nreceived \nmaterials \n1.1 Work instruction is \nobtained and carried \nout in accordance \nwith standard \noperating procedures \n1.2 Received materials \nare checked against \nworkplace standards \nand specifications \n1.3 Defective materials \nare identified, \nreported and isolated \n1.4 Defective materials \nare repaired/replaced \nin accordance with \nworkplace \nprocedures \n1.5 Defects and any \nidentified causes are \nrecorded and/or \nreported to the \nconcerned personnel \nin accordance with \nworkplace \nprocedures \n Standard operating \nprocedures on \nreceiving materials \n Material \ndescriptions and \nspecifications \n Proper handling of \nreceived materials \n Procedures on \nassessing quality of \nreceived materials \n Material defects \nand their causes \n Dealing with \ndefective materials \n Reporting defective \nreceived materials \n Total Quality \nManagement/Impro\nvement \n Work values and \nethics: \n Quality \nconsciousness \n Honesty \n Integrity \n Concern for \ndetails \n Comprehension \nskills \n Communication \nskills \n Critical thinking, \nproblem solving and \ndecision-making \nskills \n Technical skills \n Interpersonal skills \n Community \norganizing skills \n Analytical skills \n Quantitative skills \n Qualitative skills \n2.  Assess own \nwork/output \n2.1 Documentation \nrelative to quality \nwithin the company is \nidentified and used \n Organization’s \nvision, mission, \ngoals and \nobjectives\n\n--- PDF PAGE 37 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n36\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.2 Completed work is \nchecked against \nworkplace standards \n2.3 Defects are identified \nand corrected in \naccordance with the \ncompany quality \nstandards \n Organization \nstandards on \nquality of \nwork/output \n Rights, roles and \nresponsibilities of \nfarmers \n Assessment \nmethods on quality \nof work/output \n Procedures on \nassessing quality of \nwork/output \n Procedures on \nidentification of \nwork \ndefects/deviations \n Common \nwork/output \ndefects/deviations \nfrom standards \n Ways of rectifying \nwork/output \ndefects/deviations \n Total Quality \nManagement/Impro\nvement \n Work values and \nethics: \n Honesty \n Integrity \n Commitment \n3.  Submit \noneself to \nthird party \nassessment  \n3.1 Information on the \nquality and other \nindicators of \nperformance are \nrecorded in \naccordance with \nworkplace \nprocedures \n3.2 In cases of deviations \nfrom specific quality \nstandards, causes \nare documented and \nreported in \naccordance with the \n Organization’s \nvision, mission, \ngoals and \nobjectives \n Performance \nevaluation system \nand procedure \n Performance key \nresult areas and \nindicators \n Procedures on third \nparty assessment \nof performance\n\n--- PDF PAGE 38 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n37\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nworkplace’s \nstandards operating \nprocedures \n3.3 In cases of \nobjections/ \ndisagreements, \nreasons are \nexpressed thru \nwritten \ndocumentation \n3.4 Settlements are \nsought in accordance \nwith company \npolicies \n Documentation of \nwork defects/ \ndeviations  \n Rectification of \nwork/output \ndefects/deviations \nand their causes \n Total Quality \nManagement/Impro\nvement  \n Measures to \nimprove work \nperformance \n Work values and \nethics: \n Humility \n Fairness \n Integrity \n Quality \nconsciousness \n4.  Engage in \nquality \nimprovement \n4.1 Process improvement \nprocedures are \nparticipated in \nrelative to workplace \nassignment \n4.2 Work is carried out in \naccordance with \nprocess improvement \nprocedures \n4.3 Services are \ndelivered in \naccordance with \nethical standards \n4.4 Quality service is \nmonitored to ensure \nclient satisfaction \n4.5 Client’s needs are \nassessed through \nconduct of \nresearches, focus \ngroup discussions, \nand satisfaction \nsurveys/interviews \n4.6 Trainings, \norientations, and \nexposures are \n Total Quality \nManagement/Impro\nvement \n Methods of quality \nimprovement \n Methods of \nmonitoring \ncustomer \nsatisfaction \n Procedures in \nimproving quality of \ncustomer service:  \n Assessment of \nclients’ needs \n Monitoring quality \nof service  \n Identification of \nneeded \nimprovement of \nquality \n Reporting of \nfindings and \nrecommendations \n e. Intervention to \nimprove quality \nservice to clients\n\n--- PDF PAGE 39 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n38\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nrendered to ensure \ntheir understanding/ \nfamiliarization on \nproducts, services \nand programs \n Professional and \nethical standards in \ndelivering services \nto clients \n Work values and \nethics: \n Quality \nconsciousness \n Integrity \nCommitment\n\n--- PDF PAGE 40 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n39\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Materials \nMaterials may include but are not limited to: \n1.1 \nManuals, brochures, flyers, flipcharts, signages  and \ntarpaulin \n1.2 \nWork orders \n1.3 \nStandard forms \n1.4 \nRecorded voice files/audio video presentations \n1.5 \nPowerPoint presentation materials \n1.6 \nDocumentations  \n1.7 \nSoftware \n1.8 \nHardware \n1.9 \nOffice supplies  \n1.10 Office equipment \n1.11 Holy Scriptures\n2. Defects/ \nIrregularities \nDefects may include but are not limited to: \n2.1 \nDeviation from the requirements of the client  \n2.2 \nDeviation from the requirements and standard operating \nprocedures of the organization/institution \n2.3 \nManuals containing incorrect/outdated information \n2.4 \nSoftware/hardware defects \n2.5 \nPoor employee interpersonal relationships/conflicts among \nemployees  \n2.6 \nLoose implementation of organizational policies and \nprocedures \n2.7 \nPoor/inappropriate training designs \n2.8 \nNon-compliance of selection and recruitment procedures of \nemployees \n2.9 \nWork fatigue and lost of interest to work being experience by \nthe employee/s \n2.10 Lack of clear understanding about one’s role and \nresponsibilities   \n2.11 Non-compliance of selection and recruitment procedures of \nclients \n2.12 Undesirable work behavior of employees \n2.13 Breakdown of/barriers to communication \n2.14 Outdated work plans and schedules\n3. Documentation Includes the following but are not limited to: \n3.1 \nStandard Operating Procedures  \n3.2 \nQuality checklist \n3.3 \nMonitoring feedback sheet \n3.4 \nForms such as Loan Applications, CCI/BI, Cash Flows, Loan \nUtilization Checks, Client Exits/Withdrawals, Work/Job \nOrder, Client Feedback Notice, Material Requisition Form, \nPerformance Appraisal Report, Training Evaluation Forms \n3.5 \nReports such as Financial Statements, Operational \nAssessments/Highlights and Plans, Cash Position Reports\n\n--- PDF PAGE 41 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n40\n3.6 \nMinutes of meetings (Board, Branch, \nDepartment/Units/Groups) \n3.7 \nSpecial orders, memorandums, notices, announcements \n3.8 \nEmployee movements (promotion, demotion, discharge, \ntermination, suspension) \n3.9 \nLinkages such as Loan Verification, SSS and Philhealth \ndues. \n3.10 Organizational Profile (Vision, Mission, Goals and \nObjectives) \n3.11 Electronic documentations e.g. Website \n3.12 Files/Employees’ Profile\n4.Quality \nstandards \nQuality standards may be related but are not limited to the \nfollowing: \n4.1 \nMaterials \n4.2 \nSoftware \n4.3 \nOffice supplies \n4.4 \nOffice facilities \n4.5 \nOffice equipment  \n4.6 \nOffice standard forms \n4.7 \nWork processes \n4.8 \nCustomer service \n4.9 \nProducts and services \n4.10 Work outputs \n4.11 Communication process \n4.12 Ethical and professional ethics \n4.13 Training program design and delivery \n4.14 Value added services/product innovations \n4.15 Organization’s policies and procedures manual\n5.Client \nIncludes the following but are not limited to: \n5.1 \nExternal clients (customers, partners, members, subscribers, \nend users, investors/funders, service providers, agencies) \n5.2 \nInternal clients (within the organization/co-employees, \nimmediate superiors, board of trustees)\n\n--- PDF PAGE 42 ---\nTR-Agroentrepreneurship NCIII                              Promulgated February 3, 2017 \n \n41\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Performed work in accordance with the organization’s \nstandard operating procedures and specifications \n1.2 Identified and reported defects in accordance with \nstandard operating procedures \n1.3 Carried out work in accordance with the process \nimprovement procedures\n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1 Product manuals and brochures \n2.2 Marketing and promotional materials \n2.3 Orientation and presentation materials \n2.4 Office standard forms and documentation \n2.5 Operational handbook/manuals \n2.6 Work plans and schedules \n2.7 Hardware \n2.8 Software\n3.Method of \nassessment \nCompetency may be assessed through: \n3.1 Written examination \n3.2 Interviews \n3.3 Audit report \n3.4 Monthly reports  \n3.5 Practical demonstration \n3.6 Performance evaluation\n4. Context for \nassessment\n4.1 Assessment may be conducted in the workplace or in a \nsimulated workplace environment\n",
