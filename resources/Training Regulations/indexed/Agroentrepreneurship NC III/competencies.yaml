on begins\n3. Active listening \n3.1 Attentive \n3.2 Don’t interrupt \n3.3 Good posture \n3.4 Maintain eye contact \n3.5 Reflective listening\n4. Questioning techniques \n4.1 Direct \n4.2 Indirect \n4.3 Open-ended\n\n--- PDF PAGE 14 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n13\nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated sufficient knowledge of the factors \ninfluencing negotiation to achieve agreed outcome \n1.2 Participated in negotiation with at least one person to \nachieve an agreed outcome\n2. Resource Implications \nThe following resources should be provided: \n2.1 Room with facilities necessary for the negotiation \nprocess \n2.2 Human resources (negotiators)\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning \n3.3 Portfolio\n4. Context for Assessment \nCompetency to be assessed in real work environment or in \na simulated workplace setting.\n\n--- PDF PAGE 15 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n14\nUNIT OF COMPETENCY : SOLVE PROBLEMS RELATED TO WORK \nACTIVITIES \n \nUNIT CODE \n:"
