        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Led in the selection of product \n1.2 Established production module \n1.3 Prepared supply plan \n1.4 Monitored the implementation of production \nactivities \n1.5 Implemented safety precautionary measures\n2. Resource Implications \nThe following resources should be provided: \n2.1 Training venue and demonstration area \n2.2 Tools, materials, supplies and equipment to be \nused to demonstrate the required tasks \n2.3 Production inputs samples \n2.4 Reference material and manuals\n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Actual demonstration \n3.3 Oral Questioning \n3.4 Interview\n4. Context of Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n\n--- PDF PAGE 55 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n54\nUNIT OF COMPETENCY \n: \nIMPLEMENT FINANCIAL MANAGEMENT \nUNIT CODE \n:"
        },
        "source_text": "AFF243306 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge, skills and attitudes \nrequired for AE implementer to lead in selection of \nproduct, establish production module, prepare supply \nplan, oversee and monitor the implementation of \nproduction \nactivities \nand \nimplement \nsafety \nand \nprecautionary measures\n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Lead in the \nselection of \nproduct \n1.1 Product data are \nextracted from the \nfarmers information \nprofile \n1.2 Prioritized products \nare presented based \non established \ncriteria \n1.3 Farmers are guided in \nthe selection of \nproduct for \nagroenterprise \nthrough consensus \n• Data collection and \nextraction of \nexisting products \nfrom farmers \ninformation profile \n• Criteria of \nscreening \n• Analytical tool \n(ANSOFF matrix) \n• Procedures of \npresentation and \nscreening of the \nlists of products \n• Data Analysis \n• Different concensus \nmethods \n• Process of getting \nconsensus \n• Concepts & \nMethods of \nFacilitation \n \nAttitude: \n• Patience \n• Diplomacy \n• Open minded \n• Fair \n• Non-judgmental \n• Collating and \nextracting existing \nproducts from the \nfarmers information \nprofile \n• Presenting and \nscreening of list \nproducts \n• Facilitating skills \n• Agreeing for the \nselected products \nthrough concensus \n \n2. Establish \nProduction \nModule \n2.1 Data from the bench \nmarking on \nproduction are \ngathered based on \nestablished \nguidelines \n• Guidelines for Data \nGathering \n• Different methods \nof Data Gathering \n• Sources of Data \n• Gathering of data on \nthe best production \npractices \n• Gathering data on \nthe best farming \npractices by\n\n--- PDF PAGE 49 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n48\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.2 Production module \nis developed \naccording to data \ngathered and best \npractices \n2.3 Production module \nis presented and \nconfirmed with \nmembers based on \nconsensus \n• Interview \nTechniques \n• Cost & Return \nComputation \n• Guide for \nDeveloping \nProduction Module \n• Data Collation & \nTabulation \nProcedure \n• Methods and \nprocedure of Data \nAnalysis \n• Agri-Production \npractices (cultural \nManagement) \n• Production Module \nGuide \n• Cost & Return \nComputation & \nAnalysis \n• Good Agricultural \nPractices (GAP) \n• Good \nManufacturing \nActivities (GMP) \n \n \nAttitude: \n• Information seeking \n• Open minded \n• Good \nConversationalist \n• Patience \n• Resourcefulness \n• Perseverance \n• Honesty \n• Social responsibility \n• Commitment \nInterviewing key \ninformants \n• Calculating cost and \nreturns of production \n• Collating & \nTabulating collected \ndata \n• Analyzing collated \nand tabulated data \non the best farming \npractices \n• Designing \nProduction Module \nbased industry \nstandards \n3. Prepare \nsupply plan \n3.1 Product supply is \nestimated based on \nfarmers committed \nProduction module \n3.2 Product supply is \nassessed based on \nthe product demand \n• Knowledge of \nProduction \nInformation Data \n• Product Market \nMatching \n• Methods of \nComputing product \nsupply volume \n• Projecting product \nsupply from farmers \n• Computing the \nvolume of product \nsupply committed \n• Assessing the \nquantity and quality\n\n--- PDF PAGE 50 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n49\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3.3 Supply plan is \nformulated based on \nfarmers’ commitment \nand product demand \n \n \n• Methods of Product \nSupply Assessment \n• Guide in the \nPreparing Product \nSupply Plan \n• Guidelines for \npreparing \nProduction Program \n• Information System \n• Production \nCalendar \n• Collective \nMarketing \nAgreement \n \nAttitude: \n• Credibility \n• Honesty \n• Good observation \nskills \nof product supply \nbased on famers’ \n• Formulating \nProduction Program \nbased on the \nprepared production \nmodule \n• Scheduling \n• Programming \n• Forecasting \n4. Monitor the \nimplementatio\nn of \nproduction \nactivities \n4.1 Production activities \nare directed \nconsistent with the \nproduction module \n4.2 Quality control \nactivities are \nperformed based on \nthe established \nmarket specifications \n4.3 Production volume \nis monitored based \non supply plan \n4.4 Supply plan is \nimproved and \nadjusted based on \nmonitoring results \n• Production Program \nImplementation \n• Procedure in the \nmonitoring of \nproduction activities \nimplementation \nthrough the AE \nClustering \nApproach \n• Documentation \nprocess \n• Product Quality \nIndustry \nStandards \n• Different Quality \nControl Measures \n• Systems of \nRecording \nproduction volume \n• Process of \nmonitoring \nproduction volume \n• Presentation of the \nconsolidated \nSupply plan to \nidentified and \n• Presenting the \nProduction Program \n• Overseeing and \nmonitoring the \nimplementation of \nproduction activities \n• Recording \nproduction activities \n• Implementing and \n• Identifying \nmanpower \n• Preparing materials/ \nequipment \n• Perform quality \ncontrol activities \n• Taking Inventory of \nquality control \nactivities \n• Establishing quality \ncontrol measures \n• Recording of the \nnumber of farmers, \nthe schedule of \nharvest and the \nprojected volume of \nproduction\n\n--- PDF PAGE 51 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n50\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \ncontingency \nmarkets \n• AE Plan \nAssessment \n• Handling hitches/ \nTroubleshooting \n \nAttitude: \n• hardworking \n• resourcefulness \n• Confidence \n• Quality conscious \n• integrity \n• Observant \n• Monitoring the \nvolume of production\n• Presenting the \nconsolidated supply \nvolume to farmers/ \nclusters \n• Confirming the \nsupply plan \ncommitted by \nfarmers/clusters \n5. Implement \nsafety \nprecautionary \nmeasures \n5.1Workplace hazards \nare identified \n5.2Tasks and \nworkplaces are \nassessed \n5.3 Appropriate control \nmeasures are \nestablished \n5.4 Safety and health \npractices are \nobserved \n• Occupational \nHealth and Safety \nStandards (basics \nof machine \nfunctions, \ncomponents of fire, \neffects of different \nhazards to health) \n• Awareness on: \n- 5S \n- 4Rs (re-use, \nreduce, recycle & \nrethink) \n- Child Labor \n- Gender \n- PWD \n- Labor Law \n• Occupational \nHealth and Safety \nStandards \n• Climate Risk \nManagement \nStrategy \n \nAttitude: \n• Commitment \n• Compliance to rules \nand regulations \n \nOthers: \n• Relationship / value \nof OSH and \nproductivity \n• Identifying hazards \n• Assessing tasks, \nworkplaces \n• Recommending \nappropriate control \nmeasures \n• Assessing & \ncontrolling workplace \nhazards are \nassessed according \nto applicable \noccupational safety \nand health standards \n(OSH Standards) \n• Establishing control \nmeasures \n• Observing the safety \nand health practices \nimplemented in farm \nproduction\n\n--- PDF PAGE 52 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n51\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nInformation includes but not limited to: \n1.1 Crops commonly grown in the locality \n1.2 Existing & Potential markets\n2. Criteria \nCriteria includes but not limited to: \n \n2.1 Ranking Products \n2.1.1 Farmers highest income \n2.1.2 Available market \n2.1.3 Commonly grown in the area \n2.2 Selection \n2.2.1 Market \n2.2.2 Internal and External Information system \n2.2.3 