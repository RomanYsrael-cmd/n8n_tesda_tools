        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at one \ntime \n1.2 Made constructive contributions in workplace issues \n1.3 Sought workplace issues effectively \n1.4 Responded to workplace issues promptly \n1.5 Presented information clearly and effectively written \nform \n1.6 Used appropriate sources of information \n1.7 Asked appropriate questions \n1.8 Provided accurate information \n2. Resource Implications \nThe following resources should be provided: \n2.1 Variety of Information \n2.2 Communication tools \n2.3 Simulated workplace\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning\n4. Context for Assessment \nCompetency may be assessed in the workplace or in \nsimulated workplace environment\n\n--- PDF PAGE 7 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n6\nUNIT OF COMPETENCY : LEAD SMALL TEAMS \n(Guide and lead others/Be responsible to others) \n \nUNIT CODE \n \n:"
        },
        "source_text": "500311109 \n \nUNIT DESCRIPTOR \n \n: This unit covers the knowledge, skills and attitudes \nrequired to lead in the dissemination and discussion of \nideas, information and issues in the workplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1 Appropriate \ncommunication \nmethod is selected \n1.2 Multiple operations \ninvolving several \ntopics areas are \ncommunicated \naccordingly \n1.3 Questions are used \nto gain extra \ninformation \n1.4 Correct sources of \ninformation are \nidentified \n1.5 Information is \nselected and \norganized correctly \n1.6 Verbal and written \nreporting is \nundertaken when \nrequired \n1.7 Communication skills \nare maintained in all \nsituations \n• Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n• Effective verbal \ncommunication \nmethods \n• Methods of \nCommunication \n• Types of Question \n• Communication \nTools \n• Questioning \nTechniques \n• Organizing \ninformation \n• Understanding and \nconveying intended \nmeaning \n• Participating in \nvariety of workplace \ndiscussions \n• Complying with \norganization \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n• Reporting \noccupational \nhazards during \nmeetings \n2. Lead \nworkplace \ndiscussions \n2.1 Response to \nworkplace issues are \nsought \n2.2 Response to \nworkplace issues are \nprovided immediately \n• Leadership as a \nmanagement \nfunction \n• Barriers of \ncommunication \n• Communicating \neffectively\n\n--- PDF PAGE 5 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n4\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3 Constructive \ncontributions are \nmade to workplace \ndiscussions on such \nissues as production, \nquality and safety \n• Effective verbal \ncommunication \nmethods \n• Method/techniques \nof discussion \n• How to lead \ndiscussion \n• How to solicit \nresponse \n3. Identify and \ncommunicate \nissues arising \nin the \nworkplace \n3.1. Issues and problems \nare identified as they \narise \n3.2. Information regarding \nproblems and issues \nare organized \ncoherently to ensure \nclear and effective \ncommunication \n3.3. Dialogue is initiated \nwith appropriate \npersonnel \n3.4. Communication \nproblems and issues \nare raised as they \narise \n• Types of issues and \nproblems in the \nworkplace \n• Written and \nelectronic \ncommunication \nmethods \n• Communication \nbarriers affecting \nworkplace \ndiscussions \n• Identifying problems \nand issues, as well \nas its cause \n• Organizing \ninformation on \nproblems and issues\n\n--- PDF PAGE 6 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n5\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Communication method \n1.1 Non-verbal gestures \n1.2 Verbal \n1.3 Face to face \n1.4 Two-way radio \n1.5 Speaking to groups \n1.6 Using telephone \n1.7 Written \n1.8 Internet\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at one \ntime \n1.2 Made constructive contributions in workplace issues \n1.3 Sought workplace issues effectively \n1.4 Responded to workplace issues promptly \n1.5 Presented information clearly and effectively written \nform \n1.6 Used appropriate sources of information \n1.7 Asked appropriate questions \n1.8 Provided accurate information \n2. Resource Implications \nThe following resources should be provided: \n2.1 Variety of Information \n2.2 Communication tools \n2.3 Simulated workplace\n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning\n4. Context for Assessment \nCompetency may be assessed in the workplace or in \nsimulated workplace environment\n\n--- PDF PAGE 7 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n6\nUNIT OF COMPETENCY : LEAD SMALL TEAMS \n(Guide and lead others/Be responsible to others) \n \nUNIT CODE \n \n:"
