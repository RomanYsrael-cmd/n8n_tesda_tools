        "source_text": "HCS315202 \n \nUNIT DESCRIPTOR \n \n \n: \nThis unit covers the knowledge, skills and \n \n \n \n \nattitudes needed to apply quality and \n \n \nethical standards in the workplace. The unit \n \n \nalso includes the application of relevant \n \n \nsafety procedures and regulations, \n \n \norganization procedures, client and \n \n \nindustry requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Assess \nquality of \nreceived \nmaterials \n1.1 Work instruction is \nobtained and carried \nout in accordance \nwith standard \noperating procedures \n1.2 Received materials \nare checked against \nworkplace standards \nand specifications \n1.3 Defective materials \nare identified, \nreported and isolated \n1.4 Defective materials \nare repaired/replaced \nin accordance with \nworkplace \nprocedures \n1.5 Defects and any \nidentified causes are \nrecorded and/or \nreported to the \nconcerned personnel \nin accordance with \nworkplace \nprocedures \n• Standard operating \nprocedures on \nreceiving materials \n• Material \ndescriptions and \nspecifications \n• Proper handling of \nreceived materials \n• Procedures on \nassessing quality of \nreceived materials \n• Material defects \nand their causes \n• Dealing with \ndefective materials \n• Reporting defective \nreceived materials \n• Total Quality \nManagement/Impro\nvement \n• Work values and \nethics: \n Quality \nconsciousness \n Honesty \n Integrity \n Concern for \ndetails \n• Comprehension \nskills \n• Communication \nskills \n• Critical thinking, \nproblem solving and \ndecision-making \nskills \n• Technical skills \n• Interpersonal skills \n• Community \norganizing skills \n• Analytical skills \n• Quantitative skills \n• Qualitative skills \n2. Assess own \nwork/output \n2.1 Documentation \nrelative to quality \nwithin the company is \nidentified and used \n• Organization’s \nvision, mission, \ngoals and \nobjectives\n\n--- PDF PAGE 37 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n36\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.2 Completed work is \nchecked against \nworkplace standards \n2.3 Defects are identified \nand corrected in \naccordance with the \ncompany quality \nstandards \n• Organization \nstandards on \nquality of \nwork/output \n• Rights, roles and \nresponsibilities of \nfarmers \n• Assessment \nmethods on quality \nof work/output \n• Procedures on \nassessing quality of \nwork/output \n• Procedures on \nidentification of \nwork \ndefects/deviations \n• Common \nwork/output \ndefects/deviations \nfrom standards \n• Ways of rectifying \nwork/output \ndefects/deviations \n• Total Quality \nManagement/Impro\nvement \n• Work values and \nethics: \n Honesty \n Integrity \n Commitment \n3. Submit \noneself to \nthird party \nassessment \n3.1 Information on the \nquality and other \nindicators of \nperformance are \nrecorded in \naccordance with \nworkplace \nprocedures \n3.2 In cases of deviations \nfrom specific quality \nstandards, causes \nare documented and \nreported in \naccordance with the \n• Organization’s \nvision, mission, \ngoals and \nobjectives \n• Performance \nevaluation system \nand procedure \n• Performance key \nresult areas and \nindicators \n• Procedures on third \nparty assessment \nof performance\n\n--- PDF PAGE 38 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n37\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nworkplace’s \nstandards operating \nprocedures \n3.3 In cases of \nobjections/ \ndisagreements, \nreasons are \nexpressed thru \nwritten \ndocumentation \n3.4 Settlements are \nsought in accordance \nwith company \npolicies \n• Documentation of \nwork defects/ \ndeviations \n• Rectification of \nwork/output \ndefects/deviations \nand their causes \n• Total Quality \nManagement/Impro\nvement \n• Measures to \nimprove work \nperformance \n• Work values and \nethics: \n Humility \n Fairness \n Integrity \n Quality \nconsciousness \n4. Engage in \nquality \nimprovement \n4.1 Process improvement \nprocedures are \nparticipated in \nrelative to workplace \nassignment \n4.2 Work is carried out in \naccordance with \nprocess improvement \nprocedures \n4.3 Services are \ndelivered in \naccordance with \nethical standards \n4.4 Quality service is \nmonitored to ensure \nclient satisfaction \n4.5 Client’s needs are \nassessed through \nconduct of \nresearches, focus \ngroup discussions, \nand satisfaction \nsurveys/interviews \n4.6 Trainings, \norientations, and \nexposures are \n• Total Quality \nManagement/Impro\nvement \n• Methods of quality \nimprovement \n• Methods of \nmonitoring \ncustomer \nsatisfaction \n• Procedures in \nimproving quality of \ncustomer service: \n Assessment of \nclients’ needs \n Monitoring quality \nof service \n Identification of \nneeded \nimprovement of \nquality \n Reporting of \nfindings and \nrecommendations \n e. Intervention to \nimprove quality \nservice to clients\n\n--- PDF PAGE 39 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n38\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nrendered to ensure \ntheir understanding/ \nfamiliarization on \nproducts, services \nand programs \n• Professional and \nethical standards in \ndelivering services \nto clients \n• Work values and \nethics: \n Quality \nconsciousness \n Integrity \nCommitment\n\n--- PDF PAGE 40 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n39\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \nMaterials may include but are not limited to: \n1.1 \nMa