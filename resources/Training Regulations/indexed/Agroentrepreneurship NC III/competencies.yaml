          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Facilitated financial plan development \n1.2. Computed cost and return, break-even price, \nvolume and ROI \n1.3. Facilitated loan application and payment of farmer-\nmembers \n1.4. Promoted saving practices \n1.5. Monitored and assessed implementation of financial \nplan \n1.6. Practiced Record Keeping \n2. Resource Implications \nThe following resources should be provided: \n2.1. Work area \n2.2. Tools, materials, supplies and equipment to be used \nto demonstrate required tasks. \n2.3. Production inputs (sample) \n2.4. Reference materials (manual, guide book) \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1. Written examination \n3.2. Oral questioning \n3.3. Demonstration\n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter in a simulated workplace setting.\n\n--- PDF PAGE 60 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n59\nUNIT OF COMPETENCY \n: \nMOBILIZE FARMERS PARTICIPATION IN \nCAPACITY BUILDING ACTIVITIES \nUNIT CODE \n:"
        },
        "source_text": "AFF243307 \n \nUNIT DESCRIPTOR \n: \nThe unit deals with the knowledge, skills and attitudes \nrequired to develop financial plan, facilitates loan \napplication and payment of farmer-members, practice \nsavings and implement record keeping. This unit \nfocuses on financial aspects of the agro-enterprise \nactivities, excluding the non-financial.\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Facilitate \nfinancial plan \ndevelopment \n1.1 Computation of \nfinancial \nrequirements are \nguided according to \nagro-enterprise \nactivities \n1.2 Selection of Sources \nof Financial \nservices is facilitated \nbased on financial \nrequirement \n1.3 Data for the financial \nanalysis are extracted \nfrom agroenterprise \nactivities \n1.4 Computation of break-\neven price and \nvolume are guided \nusing data extracted \nfrom production \nmodule \n1.5 Packaging of \nFinancial Plan is \nguided based on \nindustry standards \n• Production costs \n• Simple analysis \n• Simple decision \nmaking \n• Presentation of \nFinancial Plan \n \nAttitude: \n• Patient \n• Hardworking \n• Detail oriented \n• Calculated Risk \ntaker \n• Discipline \n• Open minded \n• Frugal \n• Systematic \n• Identifying the \nvarious production \ncost items \n• Computing financial \nrequirements \n• Identifying types of \nfinancial services \n• Selecting \nappropriate financial \nservices \n• Computing break-\neven price and \nvolume \n• Packaging of \nFinancial Plan \n• Sourcing and \nIntegrating financial \nrequirement \n• Providing \nappropriate data for \nfinancial analysis \n2. Facilitates \nloan \napplication \nand payment \n2.1 Farmers are guided to \nbecome member of \norganization based \non standard \nprocedures \n2.2 Submission of \ncomplete documents \nfor loan availment is \nfacilitated based on \nthe requirements of \nservice providers \n• Filling-up of \nrequired loan forms \n• Basic loan \nrequirement \n• Loan application \n• Monitoring of loan \n• Loan Payment \nschedule \n \nAttitude: \n• Accurate \n• Accomplishing \nrequired documents. \n• Providing documents \nfor loan approval \n• Complying required \ndocuments for loan \nrelease \n• Complying with the \nagreed loan \npayment schedule\n\n--- PDF PAGE 56 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n55\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.3 Loan payment is \nmonitored based on \napproved loan \nagreement \n• Diplomatic \n• Sense of urgency \n• Diligent \n• Hardworking \n• Open Minded \n• Detail oriented \n• Trustworthy \n• Reliable \n• Hardworking \n•Patient\n3. Promote \nsaving \npractice \n3.1 Saving schemes were \npromoted following \nindustry practices \n3.2 Savings mobilization \nand utilization is \nguided based on \ncluster and \norganization’s \npolicies \n3.3 Policy on savings and \nits utilization are \nreiterated based on \nagreed policies \n3.4 Policy amendment is \nrecommended based \non existing operation \n \n• Knowledge on \ninterest earning \n• Ability to compare \nearnings and \ndetermine where to \ndeposit \n• Basic knowledge on \ninvesting \n• Computation of \ndividend, patronage \nrefund, interest on \nsaving \n \nAttitude: \n• Patient \n• Open minded \n• Business minded \n• Opportunity Seeker \n• Detail oriented \n• Hardworking \n• Risk taker \n• Identifying \nappropriate financial \nproviders to deposit \nsavings and \nearnings \n• Maximizing the use \nof resources \nacquired \n• Promoting Voluntary \nsaving Mobilization \n• Guiding the \nutilization of Savings \nmobilization \n• Promoting savings \nmobilization \n• Reiterating policies \non savings \n• Recommending \npolicy change \n4. Monitor and \nassess \nimplementatio\nn of financial \nplan \n4.1 Practice record \nkeeping following \nindustry requirements \n4.2 Financial reports are \nprepared based on \nindustry practice \n4.3 Result of financial \nperformance \nassessment is used \nfor AE decision \nmaking \n4.4 Improvement is \nimplemented based \non recommendation \n• Organize and file \nreports \n• Provide data \n• Identify records for \nupdating \n \nAttitude: \n• Detail oriented \n• Diligent \n• Reliable \n• Hardworking \n• Prompt \n• Systematic \n•Efficient\n• Checking \ncompleteness of \nrecords \n• Checking the filing of \nfinancial records if \nsystematic \n• Monitoring regular \nupdating of records\n\n--- PDF PAGE 57 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n56\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Financial requirement \nFinancial Requirement may include: but not limited to: \n1.1. Production \n1.2. Marketing \n1.3. Working capital \n1.4. Post-harvest facilities \n2. Sources of financial \nservices \nSources of financial services may include but not limited \nto: \n2.1. Wholesalers \n2.1.1 government financing institutions (GFI’s) \n2.1.2 NGA’s \n2.2. Retailers \n2.2.1 Rural Financial Institutions (i.e. rural banks, \ncooperatives, NGO’s) \n2.3. Business development providers \n2.3.1 trucking service \n2.3.2 warehousing service \n2.3.3 input suppliers\n3. Data \nData may include but not limited to: \n3.1. Production costs \n3.2. Marketing costs \n3.3. Other costs \n3.4. Sales \n3.5. Price per unit \n3.6. Yield \n3.7. Expenses \n3.8. Income \n4. Financial Plan \nFinancial Plan package may include but not limited to: \n4.1. Supply Plan \n4.2. Volume \n4.3. Marketing Plan \n4.4. Working capital requirement \n4.5. Post-harvest facilities Plan \n4.6. Cash flow \n5. Loan application \ndocuments \nLoan application documents may include but not limited \nto: \n5.1. Production module \n5.2. Supply plan commitment \n5.3. Cluster Supply Plan \n5.4. Barangay clearance \n5.5. Cedula\n\n--- PDF PAGE 58 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n57\n5.6. Proof of billing \n6. Utilization \nUtilization may include but not limited to: \n6.1. Investment \n6.2. cluster operation \n6.3. operating expenses \n7. Recordkeeping \nRecordkeeping may include but not limited to: \n7.1. Individual financial records \n7.2. Individual financial documents \n8. Financial reports \nFinancial reports may include but not limited to: \n8.1. Sales and expenses report \n8.2. Inventory of farm inputs \n8.3. Inventory of stocks\n\n--- PDF PAGE 59 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n58\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Facilitated financial plan development \n1.2. Computed cost and return, break-even price, \nvolume and ROI \n1.3. Facilitated loan application and payment of farmer-\nmembers \n1.4. Promoted saving practices \n1.5. Monitored and assessed implementation of financial \nplan \n1.6. Practiced Record Keeping \n2. Resource Implications \nThe following resources should be provided: \n2.1. Work area \n2.2. Tools, materials, supplies and equipment to be used \nto demonstrate required tasks. \n2.3. Production inputs (sample) \n2.4. Reference materials (manual, guide book) \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1. Written examination \n3.2. Oral questioning \n3.3. Demonstration\n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter in a simulated workplace setting.\n\n--- PDF PAGE 60 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n59\nUNIT OF COMPETENCY \n: \nMOBILIZE FARMERS PARTICIPATION IN \nCAPACITY BUILDING ACTIVITIES \nUNIT CODE \n:"
