    "source_text": "SECTION 3. TRAINING STANDARDS \n \nThese guidelines are set to provide the Technical and Vocational Education \nand Training (TVET) providers with information and other important requirements to \nconsider when designing training programs for AGROENTREPRENEURSHIP NC III. \n \n3.1 CURRICULUM DESIGN \n \nCourse Title: AGROENTREPRENEURSHIP NC Level NC III \n \nNominal Training Duration: \n22 hrs–Basic Competencies \n \n \n \n \n 75 hrs– Common Competencies \n \n \n 348 hrs– Core Competencies \n \n \n ----------- \n \n \n 445 hrs – Total \nCourse Description: \n \nThis course is designed to enhance the knowledge, desirable attitudes and \nskills of Farmer Leader. It includes competencies in engaging agroenterprise industry \nstakeholders, ensuring product supply, implementing financial management, \nmobilizing farmers participation in capacity building activities and conducting collective \nmarketing.\n\n--- PDF PAGE 73 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n72\nBASIC COMPETENCIES \n22 Hours \n \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Lead workplace \ncommunication \n1.1 Communicate \ninformation about \nworkplace processes \n• Display communications \nskills using verbal, \nwritten, wireless, non-\nverbal (standard signs \nand symbols of the \nindustry) media\n• Lecture-\nDiscussion \n• Role play \n• Observation \n• Interview \nTotal: \n4 hrs \n• Read policies and \nprocedures in standard \noperating protocols\n• Lecture \n• Interview \n1.2 Lead workplace \ndiscussions \n \n• Demonstrate \ninterpersonal relations \nin discussing with \nsuperiors, colleagues, \nand/or subordinates\n• Lecture-\nDiscussion \n• Small group \nactivities \n• Observation \n• Demonstrate people \nmanagement skills \n• Lecture-\nDiscussion \n• Small group \nactivities \n• Observation \n• Facilitate discussion \namong colleagues \n• Lecture-\nDiscussion \n• Small group \nactivities \n•\n• Observation \n1.3 Identify and \ncommunicate issues \narising in the workplace \n• Apply safety procedures \nin handling equipment \nand machinery, waste, \n• Lecture-\nDiscussion \n•Demonstration\n• Oral/Written \nTest \n•Observation\n\n--- PDF PAGE 74 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n73\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\nenvironment, volatile \nfluids and gases.\n• Apply health and \nhygiene practices \n• Lecture-\nDiscussion \n• Demonstration \n• Oral/Written \nTest \n• Demonstration \nwith oral \nquestioning\n2. Lead small \nteams \n2.1Lead small teams \n• Learn concepts on \npeople management \n• Lecture-\nDiscussion \n• Small group \nactivities’ \n•Brainstorming\n• Observation \n4 hrs \n• Apply oral and written \ncommunication skills in \ndealing with other team \nmembers\n• Lecture-\nDiscussion \n• Demonstration \n• Demonstration \nwith oral \nquestioning \n2.2Provide team leadership \n• Conduct team building \nactivities as necessary \n• Lecture-\nDiscussion \n• Small group \nactivities\n• Observation \n2.3 Assign responsibilities \namong members \n• Delegate tasks to other \nmembers of the team \n• Small group \nactivities \n• Lecture-\nDiscussion\n• Observation \n• Relay instructional \nstrategies and \nmethodologies \n• Small group \nactivities \n• Lecture-\nDiscussion\n• Demonstration \nwith oral \nquestioning\n\n--- PDF PAGE 75 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n74\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n2.4Set performance \nexpectation for team \nmembers \n• Inform subordinates on \nperformance criteria \nthat will be observed \n• Small group \nactivities \n• Lecture-\nDiscussion\n• Demonstration \nwith oral \nquestioning \n2.5 Supervise team \nperformance \n• Establish facilitation \nski