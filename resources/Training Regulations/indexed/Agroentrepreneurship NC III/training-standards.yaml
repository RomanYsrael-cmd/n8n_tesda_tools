hip NC III Promulgated February 3, 2017 113 \n3.6 \nTRAINER’S QUALIFICATIONS FOR AGRICULTURE SECTOR \n \n \nTrainers who will deliver the training on AGROENTREPRENEURSHIP NC III \nshould have the following: \n \n• Must be a holder of NTTC Level 1 (NC + TM1) in Agroentrepreneurship \nNC III \n• Must have 2 years relevant experience in Agroentrepreneurship for the \nlast 5 years \n \n \n3.7 \nINSTITUTIONAL ASSESSMENT \n \nInstitutional assessment is undertaken by trainees to determine their \nachievement of units of competency . A certificate of achievement is issued for each \nunit of competency.\n\n--- PDF PAGE 115 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 114"
