  "source_section_text": "SECTION 3. TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for AGROENTREPRENEURSHIP NC III.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AGROENTREPRENEURSHIP NC Level NC III\n\nNominal Training Duration:\n22 hrs–Basic Competencies\n\n\n\n\n 75 hrs– Common Competencies\n\n\n 348 hrs– Core Competencies\n\n\n -----------\n\n\n 445 hrs – Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and\nskills of Farmer Leader. It includes competencies in engaging agroenterprise industry\nstakeholders, ensuring product supply, implementing financial management,\nmobilizing farmers participation in capacity building activities and conducting collective\nmarketing.\n\n--- PDF PAGE 73 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n72\nBASIC COMPETENCIES\n22 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace processes\n• Display communications\nskills using verbal,\nwritten, wireless, non-\nverbal (standard signs\nand symbols of the\nindustry) media\n• Lecture-\nDiscussion\n• Role play\n• Observation\n• Interview\nTotal:\n4 hrs\n• Read policies and\nprocedures in standard\noperating protocols\n• Lecture\n• Interview\n1.2 Lead workplace\ndiscussions\n\n• Demonstrate\ninterpersonal relations\nin discussing with\nsuperiors, colleagues,\nand/or subordinates\n• Lecture-\nDiscussion\n• Small group\nactivities\n• Observation\n• Demonstrate people\nmanagement skills\n• Lecture-\nDiscussion\n• Small group\nactivities\n• Observation\n• Facilitate discussion\namong colleagues\n• Lecture-\nDiscussion\n• Small group\nactivities\n•\n• Observation\n1.3 Identify and\ncommunicate issues\narising in the workplace\n• Apply safety procedures\nin handling equipment\nand machinery, waste,\n• Lecture-\nDiscussion\n•Demonstration\n• Oral/Written\nTest\n•Observation\n\n--- PDF PAGE 74 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n73\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nenvironment, volatile\nfluids and gases.\n• Apply health and\nhygiene practices\n• Lecture-\nDiscussion\n• Demonstration\n• Oral/Written\nTest\n• Demonstration\nwith oral\nquestioning\n2. Lead small\nteams\n2.1Lead small teams\n• Learn concepts on\npeople management\n• Lecture-\nDiscussion\n• Small group\nactivities’\n•Brainstorming\n• Observation\n4 hrs\n• Apply oral and written\ncommunication skills in\ndealing with other team\nmembers\n• Lecture-\nDiscussion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n2.2Provide team leadership\n• Conduct team building\nactivities as necessary\n• Lecture-\nDiscussion\n• Small group\nactivities\n• Observation\n2.3 Assign responsibilities\namong members\n• Delegate tasks to other\nmembers of the team\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Observation\n• Relay instructional\nstrategies and\nmethodologies\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 75 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n74\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.4Set performance\nexpectation for team\nmembers\n• Inform subordinates on\nperformance criteria\nthat will be observed\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Demonstration\nwith oral\nquestioning\n2.5 Supervise team\nperformance\n• Establish facilitation\nskills\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Observation\n• Apply presentation skills\nas necessary\n• Individual/Small\ngroup activities\n• Lecture-\nDiscussion\n• Demonstration\nwith oral\nquestioning\n• Translate ideas and\nconcepts into\nimplementable activities\nin pharmacy services\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Demonstration\nwith oral\nquestioning`\n3. Develop and\npractice\nnegotiation skills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n• Obtain necessary\ninformation regarding\nthe issue\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Observation\n4 hrs\n3.2 Participate in\nnegotiations\n• Apply different\nquestioning techniques\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Observation\n• Use appropriate\nlanguage during\nnegotiation\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 76 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n75\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Address and implement\nproblem solving\nstrategies on dealing\nwith unexpected\nquestions and attitudes\nduring negotiation\n• Small group\nactivities\n• Lecture-\nDiscussion\n• Demonstration\nwith oral\nquestioning\n3.3 Document areas for\nagreement\n• Document issues and\nprocesses\n• Lecture-\ndiscussion\n• Simulation/role\nplaying\n• Demonstration\nwith oral\nquestioning\n• Explore different\nsolutions that may be\nused\n• Direct\nobservation\n• Simulation/role\nplaying\n• Demonstration\nwith oral\nquestioning\n• Written documents are\nfiled and kept for future\nreference\n• Direct\nobservation\n• Simulation/role\nplaying\n• Demonstration\nwith oral\nquestioning\n• Follow-up on\nagreements based on\ndeadlines\n• Demonstration\nwith return\ndemonstration\n• Observation\n3.4 Identify relevant\ninformation in planning\nnegotiations\n• Search for relevant\ninformation on\ncompeting products and\nservices\n• Lecture-\ndiscussion\n• Simulation/role\nplaying\n• Demonstration\nwith oral\nquestioning\n•Written Exams\n3.5 Participate in\nnegotiation\n• Deal with\npatients/clients/ service\nproviders according to\nagreements discussed\n• Lecture-\ndiscussion\n• Simulation/role\nplaying\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 77 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n76\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Solve Problems\nRelated to Work\nActivities\n4.1Explain the analytical\ntechniques\n• Manage and control\nflow of resources\n• Lecture-\ndiscussion\n• Simulation/role\nplaying\n• Demonstration\nwith oral\nquestioning\n4 hrs\n• Identify cause and\npotential effects\n• Lecture-\ndiscussion\n• Brainstorming\n• Demonstration\nwith oral\nquestioning\n4.2 Determine the possible\ncause/s of the problem\n• Identify deviations from\nnormal operating\nprocedures to maintain\nproduct quality\n• Lecture-\ndiscussion\n• Case\nDiscussion\n• Demonstration\nwith oral\nquestioning\n•Written Output\n• Participate in root cause\nanalysis session and\nstate problems clearly\n• Lecture-\ndiscussion\n• Case\nDiscussion\n• Demonstration\nwith oral\nquestioning\n• Apply problem analysis\nand problem solving\ntechniques\n• Lecture-\ndiscussion\n• Small-group\nactivity\n• Demonstration\nwith oral\nquestioning\n4.3 Prepare action plans\n• Corrective actions are\ndetermined\n• Lecture-\ndiscussion\n• Demonstration\nwith oral\nquestioning\n• Establish action plans\nbased on available\noptions\n• Lecture-\ndiscussion\n• Demonstration\nwith oral\nquestioning\n5. Use\nmathematical\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n• Identify mathematical\ntechniques to be used\nin the task at hand\n• Lecture-\ndiscussion\n• Demonstration\nwith oral\nquestioning\n4 hrs\n\n--- PDF PAGE 78 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n77\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nconcepts and\ntechniques\n• Develop skills in four\nfundamental operations\n• Lecture\n•Exercises\n• Written Exercise\n• Use calculator or\ncomputer for calculating\ncash change\n• Demonstration\nwith return\ndemonstration\n• Small-group\nactivities\n• Demonstration\nwith oral\nquestioning\n5.2 Apply mathematical\nprocedures/solution\n• Use mathematical tools\nand standard formulas\n• Lecture-\ndiscussion\n• Individual/Group\nAssignments\n• Demonstration\nwith oral\nquestioning\n•Written Exam\n• Use conversion\nformulas\n• Lecture-\ndiscussion\n• Individual/Group\nAssignments\n• Demonstration\nwith oral\nquestioning\n•Written Exams\n• Ensure precisions and\naccuracy of results\n• Lecture-\ndiscussion\n• Demonstration\nwith oral\nquestioning\n•Written Exam\n5.3 Analyze results\n• Analyze and interpret\nthe results based on\nspecified requirements\n• Lecture-\ndiscussion\n• Demonstration\nwith oral\nquestioning\n• Communicate the\nresults of the analysis\n• Lecture-\ndiscussion\n• Demonstration\nwith oral\nquestioning\n• Appropriate action is\napplied in case of error\n• Lecture-\ndiscussion\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 79 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n78\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n• Follow protocols in the\nuse of basic equipment\nused in the pharmacy\n• Lecture-\ndiscussion\n• Individual/Group\nAssignments\n• Demonstration\nwith oral\nquestioning\n2 hrs\n• Use relevant technology\nto transmit data\n• Lecture-\ndiscussion\n• Individual/Group\nAssignments\n• Demonstration\nwith oral\nquestioning\n6.2 Apply relevant\ntechnology\n• Use software programs\nin computers,\nmachines/equipment\nbeing used\n• Lecture-\ndiscussion\n• Individual/Group\nAssignments\n• Demonstration\nwith oral\nquestioning\n6.3Maintain/enhance\nrelevant technology\n• Follow company policy\nin relation to relevant\ntechnology\n• Lecture-\ndiscussion\n• Individual/Group\nAssignments\n• Demonstration\nwith oral\nquestioning\n• Access protocols and\nreferences on the use of\ntechnology\n• Lecture-\ndiscussion\n• Individual/Group\nAssignments\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 80 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n79\nCOMMON COMPETENCIES\n75 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.Apply safety\nmeasures in\nfarm operations\n1.1 Determine areas of\nconcern for safety\nmeasures\n• Identify work tasks in\nfarm operations\n• Lecture\n• Discussion\n• Incomplete\nworksheet\n• Power point\npresentation\n• Video\npresentation\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n1 hr\n\n\n• Discuss safety\nmeasures in a\nworkplace during farm\noperations\n• Lecture\n• Discussion\n• Incomplete\nworksheet\n• Power point\npresentation\n• Video\npresentation\n•Role playing\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n1 hr\n\n• Explain farm operations\nsituations and period\nwhen to observe safety\n• Lecture\n• Discussion\n• Incomplete\nworksheet\n• Power point\npresentation\n• Video\npresentation\n• Role playing\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n1 hr\n\n--- PDF PAGE 81 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n80\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n• Identify appropriate\ntools, materials and\noutfits to be used\n• Lecture\n• Discussion\n• Incomplete\nworksheet\n• Power point\npresentation\n• Video\npresentation\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n2 hrs\n\n• Prepare tools, materials\nand outfits for the farm\noperation\n• Lecture\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n•Demonstration