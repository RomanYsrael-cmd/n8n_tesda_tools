Scale up AE operations \n• Discuss potential \nproducts/by-products to \nbe developed \n• Explain procedures in \nidentifying and selecting \nnew product and by-\nproduct using market \nrequirement \n• Gather market \ninformation \n• Prioritize products to be \ndeveloped \n• Discuss the process of \nselecting diversified \nproducts based on \nmarket and agro-\necological conditions \n• Enumerate the types of \nproducts that are high \nyielding varieties and \ntolerant to pest and \ndiseases \n• Conduct the \ncomparative cost and \nreturn of diversified \nproducts\n• Lecture \n• Field works \n• Discussion \n• Video \npresentation \n• Demonstration \n• Written exam \n• Oral \nQuestioning \n• Demonstration\n\n--- PDF PAGE 109 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017 \n \n108\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Discuss the climate \nchange resilient(smart) \nproducts \n• Explain the need to \nconduct market chain \nstudy \n• Discuss the procedures \nin identifying additional \nmarkets \n• Discuss gathering and \nanalysis of data from \nthe market chain study \n• Perform selection of \nmarket to be engaged \n• Compute costs and \nincome in engaging \nadditional market\n\n--- PDF PAGE 110 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 109 \n3.2 \nTRAINING DELIVERY \n \n1. The delivery of training shall adhere to the design of the curriculum. \nDelivery shall be guided by the principles of competency-based TVET. \n \na. Course design is based on competency standards set by the industry or \nrecognized industry sector; (Learning system is driven by competencies \nwritten to industry standards) \nb. Training delivery is learner-centered and should accommodate \nindividualized and self-paced learning strategies; \nc. Training can be done on an actual workplace setting, simulation of a \nworkplace and/or through adoption of modern technology. \nd. Assessment is based in the collection of evidence of the performance of \nwork to the industry required standards; \ne. Assessment of competency takes the trainee’s knowledge and attitude \ninto account but requires evidence of actual performance of the \ncompetency as the primary source of evidence. \nf. Training program allows for recognition of prior learning (RPL) or current \ncompetencies; \ng. Training completion is based on satisfactory performance of all specified \ncompetencies. \n \n2. The competency-based TVET system recognizes various types of \ndelivery modes, both on-and off-the-job as long as the learning is \ndriven by the competency standards specified by the industry. The \nfollowing training modalities and their variations/components may be \nadopted singly or in combination with other modalities when \ndesigning and delivering training programs: \n \n2.1 Institution- Based: \n \n• Dual Training System (DTS)/Dualized Training Program (DTP) which \ncontain both in-school and in-industry training or fieldwork \ncomponents. Details can be referred to the Implementing Rules and \nRegulations of the DTS Law and the TESDA Guidelines on the DTP; \n \n• The traditional classroom-based or in-center instruction may be \nenhanced through use of learner-centered methods as well as \nlaboratory or field-work components. \n \n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an \napproach in training designed to enhance the knowledge and skills \nof the trainee through actual experience in the workplace to acquire \nspecific competencies as prescribed in the training regulations. It is \nimperative that the deployment of trainees in the workplace is \nadhered to training programs agreed by the institution and enterprise \nand status and progress of trainees are closely monitored by the \ntraining institutions to prevent opportunity for work exploitation.\n\n--- PDF PAGE 111 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 110 \n• Project-based instruction is an authentic instructional model or \nstrategy in which students plan, implement and evaluate projects that \nhave real world applications. \n \n2.2 Enterprise-Based: \n \n \n• Enterprise-based Training– where training is implemented within \nthe organization/institution in accordance with the requirements of \nthe specific organization/institution. Enterprise-based training may \nalso be taken to mean a school or training center with one or more \npartner enterprise or an enterprise or group of enterprises setting up \na common training facility or partnering with a school or training \ncenter. \n \nCommunity-Based –refers to a short program conducted or coordinated \nby NGOs, LGUs, training centers and other TVET providers which are \nintended to address the specific needs of a community. Such programs \nare usually conducted in informal settings such as barangay hall, \nbasketball courts and other available venues in a community.\n\n--- PDF PAGE 112 ---\nTR-Agroentrepreneurship NC III Promulgated February 3, 2017 111 \n3.3 \nTRAINEE ENTRY REQUIREMENTS \n \nTrainees or students wishing to gain entry into this course should possess \nthe following requirements: \n \n• Can communicate both orally and in writing; \n• Can perform mensuration and calculation; and \n \nAnd any of the three: \no Holder of AE NC II, or Holder of NC on Crop Production, Animal \nProduction, Aquaculture, and Food Processing \no With two (2) year experience for the last five (5) years in any of the \nabove-mentioned areas (Agroentreprise, Crop Production, Animal \nProduction, Aquaculture, and Food Processing) \no Graduate of Agriculture-related courses in any of the above-mentioned \nareas \n(Agroentreprise, \nCrop \nProduction, \nAnimal \nProduction, \nAquaculture, and Food Processing) \n \n \n \n3.4 \nLIST OF TOOLS, EQUIPMENT AND MATERIALS \n \n \nAGROENTREPRENEURSHIP NC III \n \n \nRecommended list of tools, equipment and materials for the training of 25 \ntr