amination\n• Interview\n• Oral questioning\n• Demonstration\n1 hr\n\n\n\n\n• Explain procedures of\nwearing personal\nprotective equipment\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Written\nexamination\n• Interview\n• Oral questioning\n1 hr\n\n--- PDF PAGE 82 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n81\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n\n• Discuss topics on\neffectivity, shelf life and\nexpirations of materials\nto be used.\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Written\nexamination\n• Interview\n• Oral questioning\n1 hr\n\n\n• Identify the emergency\nprocedures\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n•\n• Written\nexamination\n• Interview\n• Oral questioning\n•\n2 hrs\n\n\n• Identify hazards in a\nfarm workplace\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Written\nexamination\n• Interview\n• Oral questioning\n2 hrs\n\n\n• Use tools and materials\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n2 hrs\n\n--- PDF PAGE 83 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n82\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Demonstration\n•Hands-on\n\n\n• Wear personal\nprotective equipment\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n•Demonstration\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n0.5 hr\n\n\n• Prepare report on\nhazards in the\nworkplace\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n1 hr\n\n\n• Report on hazards in\nthe workplace\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n•Role playing\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n0.5 hr\n\n1.3Safekeep/dispose of\ntools, materials and\noutfit\n• Explain cleaning and\nstoring procedures of\nthe used tools and outfit\n• Discussion\n• Power point\npresentation\n• Written\nexamination\n• Interview\n•Oral questioning\n1 hr\n\n--- PDF PAGE 84 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n83\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Video\npresentation\n• Incomplete\nworksheet\n• State labelling and\nstoring procedures for\nunused materials\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Written\nexamination\n• Interview\n• Oral questioning\n1 hr\n\n• Explain proper wastes\ndisposal\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Written\nexamination\n• Interview\n• Oral questioning\n1 hr\n\n• Clean and store used\ntools and outfit\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Demonstration\n•Hands-on\n• Written\nexamination\n• Interview\n• Oral questioning\n• Demonstration\n1 hr\n• Label and store unused\nmaterials\n• Discussion\n• Written\nexamination\n1 hr\n\n--- PDF PAGE 85 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n84\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Demonstration\n•Hands-on\n• Interview\n• Oral questioning\n• Demonstration\n• Dispose waste\nmaterials\n• Discussion\n• Power point\npresentation\n• Video\npresentation\n• Incomplete\nworksheet\n• Demonstration\n•Hands-on\n• Written\ne