ompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Explain the process to\nconduct post-test\nmarketing assessment\n• Conduct post-test\nmarketing assessment\n5.3 Carry out sustained\nmarketing\n• Explain the importance\nof evaluation to guide\nplanning for business\nsustainability\n• Discuss the process of\nAE evaluation through\nreflection\n• Explain value chain\nupgrading and business\nnetworking for\nsustained marketing\n• Discuss consensus\nbuilding for renewed\ncommitment in\ncontinued marketing\n• Explain the process to\nadjust and improve the\nAE plan for sustained\nmarketing\n• Compute for the sales,\ncost and income\n• Improve the AE plan\n• Lecture\n• Discussion\n• Audio-Visual\npresentation\n• Role play\n• Exercise\n• Hands-on\n• On the job\ncoaching\n• Written exam\n• Oral questioning\n• Demonstration\n\n--- PDF PAGE 107 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n106\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Explain strategies in\nmanaging good market\nrelations\n• Discuss management\nfor operational\nefficiency\n• Discuss price\nmonitoring and how to\nset up a price\nmonitoring system\n• Review recordkeeping\nand documentation of\nthe marketing\ntransactions\n• Deliver products based\non the improved AE\nplan\n• Discuss governance\nand accountability\n• Discuss the importance\nof internal control\n• Explain management\nstructure and standard\nbusiness operating\nsystems and policies\n• Discuss the importance\nof recording and\nreporting procedures in\nthe agroenterprise\n\n--- PDF PAGE 108 ---\nTR-Agroentrepreneurship NCIII Promulgated February 3, 2017\n\n107\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Install management\nstructure, systems and\npolicies\n5.4 Scale up AE operations\n• Discuss potential\nproducts/by-products to