om/Storage\n4 x 5\n20\nWash room/Toilet\n4 x 5\n\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n668\n\n--- PDF PAGE 114 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n110\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in Pipefitting\nNC II\n• Must have completed the 40-Hour Construction Occupational Safety and Health\n(COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted by OSHC\nand DOLE accredited Safety Training Organizations\n• Computer-literate\n• Must have at least two (2) years industry experience in Civil works and\none (1) year teaching experience in Pipefitting\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of Competency.\n\n--- PDF PAGE 115 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n111"
