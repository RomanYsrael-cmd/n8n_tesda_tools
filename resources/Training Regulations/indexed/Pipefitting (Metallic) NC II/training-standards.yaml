      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language and other\nacademic subjects shall be contextualized. To this end, TVET providers shall develop a\nContextual Learning Matrix (CLM) to accompany their curricula.\n\nCourse Title: PIPEFITTING (METALLIC) NC II\n\nNominal Training Duration: 37 Hours Basic Competencies\n24 Hours Common Competencies\n 160 Hours Core Competencies\n Total 221 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and attitude,\napplicable in performing work activities involve in preparing pipefitting materials, tools and\nequipment for spool pipe connection, installing above ground, overhead and underground piping\nsystem. This includes classroom learning activities and practical work in actual work site or\nsimulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this qualification\nmust be achieved.\n\n--- PDF PAGE 88 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n84\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to\nthe enterp