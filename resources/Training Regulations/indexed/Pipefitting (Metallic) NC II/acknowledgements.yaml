      "source_text": "This course is designed to provide the learner with knowledge, practical skills and attitude, applicable in performing work activities involve in preparing pipefitting materials, tools and equipment for spool pipe connection, installing above ground, overhead and underground piping system. This includes classroom learning activities and practical work in actual work site or simulation area."
    },
