      "source_text": "-- PDF PAGE 120 --- GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. Bevel The surface of the prepared metal edge, which is not at right angle, where welding is to take place"
    },
    {
      "source_text": "2. Groove"
    },
    {
      "source_text": "A narrow channel or depression cut into by a tool 3. Flanged pipe"
    },
    {
      "source_text": "Is a pipe with flanges at the ends; can be bolted end-to-end to another pipe"
    },
    {
      "source_text": "4. Pipe"
    },
    {
      "source_text": "Is a tube made of metal (or other materials) used to convey water, gas, oil or other fluid substances"
    },
    {
      "source_text": "5. Pipe Joint A connection between two pipes"
    },
    {
      "source_text": "6. Pipelaying Refers to the placing of pipe into position as with buried pipelines for oil, water or chemicals"
    },
    {
      "source_text": "7. Productivity measurement"
    },
    {
      "source_text": "It is the measurement of the efficiency of production. Measurements could either be labor productivity or multifactor productivity."
    },
    {
      "source_text": "8. Fit-up"
    },
    {
      "source_text": "A prepared joint connection which is inspected prior to joining in accordance with the requirements of a joining procedure and a standard."
    },
    {
      "source_text": "9. Pipe wrap around"
    },
    {
      "source_text": "Template for marking and measurement in a pipe"
    },
    {
      "source_text": "10. Isometric drawing"
    },
    {
      "source_text": "11. Computer literate"
    },
    {
      "source_text": "12. 5S"
    },
    {
      "source_text": "It is a drawing showing the detailed route (coordinates and elevation) of the piping connections and the instruments that goes with it as described in the piping and instrumentation design (PID)"
    },
    {
      "source_text": "This term is usually used to describe the most basic knowledge and skills needed to operate software products such as an operating system, a software application, or an automated Web design tool."
    },
    {
      "source_text": "The five in a 5S workplace organizational and housekeeping methodology refers to five steps – sort, set in order, shine, standardize and sustain"
    },
