      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Identify the efficiency and effectiveness of resource utilization"
    },
    {
      "source_text": "1.1 Required resource utilization in the workplace is measured using appropriate techniques 1.2 Data are recorded in accordance with workplace protocol 1.3 Recorded data are compared to determine the efficiency and effectiveness of resource utilization according to established environmental work procedures"
    },
    {
      "source_text": "1.1. Importance of Environmental Literacy 1.2. Environmental Work Procedures 1.3. Waste Minimization 1.4. Efficient Energy Consumptions 1.1 Recording Skills 1.2 Writing Skills 1.3 Innovation Skills"
    },
    {
      "source_text": "2. Determine causes of inefficiency and/or ineffectiveness of resource utilization 2.1 Potential causes of inefficiency and/or ineffectiveness are listed 2.2 Causes of inefficiency and/or ineffectiveness are identified through deductive reasoning 2.3 Identified causes of inefficiency and/or ineffectiveness are validated thru established environmental procedures"
    },
    {
      "source_text": "2.1 Causes of environmental inefficiencies and ineffectiveness"
    },
    {
      "source_text": "2.1 Deductive Reasoning Skills 2.2 Critical thinking 2.3 Problem Solving 2.4 Observation Skills"
    },
    {
      "source_text": "-- PDF PAGE 34 --- PIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018) 30 ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 3. Convey inefficient and ineffective environmental practices"
    },
    {
      "source_text": "3.1 Efficiency and effectiveness of resource utilization are reported to appropriate personnel 3.2 Concerns related resource utilization are discussed with appropriate personnel 3.3 Feedback on information/ concerns raised are clarified with appropriate personnel 3.1 Appropriate Personnel to address the environmental hazards 3.2 Environmental corrective actions 3.1 Written and Oral Communication Skills 3.2 Critical thinking 3.3 Problem Solving 3.4 Observation Skills 3.5 Practice Environmental Awareness"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Environmental Work Procedures May include: 1.1 Utilization of Energy, Water, Fuel Procedures 1.2 Waster Segregation Procedures 1.3 Waste Disposal and Reuse Procedures 1.4 Waste Collection Procedures 1.5 Usage of Hazardous Materials Procedures 1.6 Chemical Application Procedures 1.7 Labeling Procedures 2. Appropriate Personnel May include: 2.1 Manager 2.2 Safety Officer 2.3 EHS Offices 2.4 Supervisors 2.5 Team Leaders 2.6 Administrators 2.7 Stakeholders 2.8 Government Official 2.9 Key Personnel 2.10 Specialists 2.11 Himself"
    },
    {
      "source_text": "-- PDF PAGE 35 --- PIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018) 31 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1. Measured required resource utilization in the workplace using appropriate techniques 1.2. Recorded data in accordance with workplace protocol 1.3. Identified causes of inefficiency and/or ineffectiveness through deductive reasoning 1.4. Validate the identified causes of inefficiency and/or ineffectiveness thru established environmental procedures 1.5. Report efficiency and effectives of resource utilization to appropriate personnel 1.6. Clarify feedback on information/concerns raised with appropriate personnel 2. Resource Implications The following resources should be provided: 2.1 Workplace 2.2 Tools, materials and equipment relevant to the tasks 2.3 PPE 2.4 Manuals and references 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Demonstration 3.2 Oral questioning 3.3 Written examination 4. Context for Assessment 4.1 Competency assessment may occur in workplace or any appropriately simulated environment 4.2 Assessment shall be observed while task are being undertaken whether individually or in-group"
    },
