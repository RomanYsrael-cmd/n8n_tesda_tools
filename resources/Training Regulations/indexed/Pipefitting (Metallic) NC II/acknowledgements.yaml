    {
      "source_text": "UNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND HEALTH POLICIES AND PROCEDURES"
    },
    {
      "source_text": "UNIT CODE : 400311216"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to identify OSH compliance requirements, prepare OSH requirements for compliance, perform tasks in accordance with relevant OSH policies and procedures"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Identify OSH compliance requirements 1.1 Relevant OSH requirements, regulations, policies and procedures are identified in accordance with workplace policies and procedures 1.2 OSH activity non- conformities are conveyed to appropriate personnel 1.3 OSH preventive and control requirements are identified in accordance with OSH work policies and procedures"
    },
    {
      "source_text": "1.1. OSH preventive and control requirements 1.2. Hierarchy of Controls 1.3. Hazard Prevention and Control 1.4. General OSH principles 1.5. Work standards and procedures 1.6. Safe handling procedures of tools, equipment and materials 1.7. Standard emergency plan and procedures in the workplace 1.1. Communication skills 1.2. Interpersonal skills 1.3. Critical thinking skills 1.4. Observation skills"
    },
    {
      "source_text": "-- PDF PAGE 30 --- PIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018) 26"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Prepare OSH requirements for compliance"
    },
    {
      "source_text": "2.1 OSH work activity material, tools and equipment requirements are identified in accordance with workplace policies and procedures 2.2. Required OSH materials, tools and equipment are acquired in accordance with workplace policies and procedures 2.3. Required OSH materials, tools and equipment are arranged/ placed in accordance with OSH work standards 2.1. Resources necessary to execute hierarchy of controls 2.2. General OSH principles 2.3. Work standards and procedures 2.4. Safe handling procedures of tools, equipment and materials 2.5. Different OSH control measures"
    },
    {
      "source_text": "2.1. Communication skills 2.2. Estimation skills 2.3. Interpersonal skills 2.4. Critical thinking skills 2.5. Observation skills 2.6. Material, tool and equipment identification skills"
    },
    {
      "source_text": "3. Perform tasks in accordance with relevant OSH policies and procedures"
    },
    {
      "source_text": "3.1 Relevant OSH work procedures are identified in accordance with workplace policies and procedures 3.2 Work Activities are executed in accordance with OSH work standards 3.3 Non-compliance work activities are reported to appropriate personnel 3.1. OSH work standards 3.2. Industry related work activities 3.3. General OSH principles 3.4. OSH Violations Non-compliance work activities"
    },
    {
      "source_text": "3.1 Communication skills 3.3 Interpersonal skills 3.4 Troubleshooting skills 3.5 Critical thinking skills 3.6 Observation skills"
    },
    {
      "source_text": "-- PDF PAGE 31 --- PIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018) 27"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. OSH Requirements, Regulations, Policies and Procedures May include: 1.1 Clean Air Act 1.2 Building code 1.3 National Electrical and Fire Safety Codes 1.4 Waste management statutes and rules 1.5 Permit to Operate 1.6 Philippine Occupational Safety and Health Standards 1.7 Department Order No. 13 (Construction Safety and Health) 1.8 ECC regulations 2. Appropriate Personnel May include: 2.1 Manager 2.2 Safety Officer 2.3 EHS Offices 2.4 Supervisors 2.5 Team Leaders 2.6 Administrators 2.7 Stakeholders 2.8 Government Official 2.9 Key Personnel 2.10 Specialists 2.11 Himself 3. OSH Preventive and Control Requirements May include: 3.1 Resources needed for removing hazard effectively 3.2 Resources needed for substitution or replacement 3.3 Resources needed to establishing engineering controls 3.4 Resources needed for enforcing administrative controls 3.5 Personal Protective equipment 4. Non OSH-Compliance Work Activities May include non-compliance or observance of the following safety measures: 4.1 Violations that may lead to serious physical harm or death 4.2 Fall Protection 4.3 Hazard Communication 4.4 Respiratory Protection 4.5 Power Industrial Trucks 4.6 Lockout/Tag-out 4.7 Working at heights (use of ladder, scaffolding) 4.8 Electrical Wiring Methods 4.9 Machine Guarding 4.10 Electrical General Requirements 4.11 Asbestos work requirements 4.12 Excavations work requirements"
    },
    {
      "source_text": "-- PDF PAGE 32 --- PIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018) 28 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1. Convey OSH work non-conformities to appropriate personnel 1.2. Identify OSH preventive and control requirements in accordance with OSH work policies and procedures 1.3. Identify OSH work activity material, tools and equipment requirements in accordance with workplace policies and procedures 1.4. Arrange/Place required OSH materials, tools and equipment in accordance with OSH work standards 1.5. Execute work activities in accordance with OSH work standards 1.6. Report OSH activity non-compliance work activities to appropriate personnel 2. Resource Implications The following resources should be provided: 2.1 Facilities, materials tools and equipment necessary for the activity 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Observation/Demonstration with oral questioning 3.2 Third party report 4. Context for Assessment 4.1 Competency may be assessed in the work place or in a simulated work place setting"
    },
