  "source_text": "ACKNOWLEDGEMENTS 120-121\n\n--- PDF PAGE 5 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n1\n\nTRAINING REGULATIONS FOR\n\nPIPEFITTING (METALLIC) NC II\n\nSECTION 1 PIPEFITTING (METALLIC)\n\nThe PIPEFITTING (METALLIC) NC II qualification consists of competencies that\nworkers must achieve to enable them to perform tasks applied to rigid piping such as\nstructural pipes, main pipes and services pipes as applied to water, oil and gas lines.\n\nThis qualification is packaged from the competency map of Construction Sector as\nshown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and\nprocedures\nExercise efficient and effective sustainable practices in\nthe workplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON712301\nPrepare pipefitting materials, tools and equipment for spool pipe\nconnection\nCON712302\nCON712303\nInstall above ground piping system\nInstall overhead piping system\nCON712304\nInstall underground piping system\n\nA person who has achieved this Qualification is competent to be a –\n\n Pipefitter\n\n--- PDF PAGE 6 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n2\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in\nPIPEFITTING (METALLIC) NC II. These units of competency are categorized into basic,\ncommon and core competencies.\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311210\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and\nrelevant\ninformation is\naccessed from\nappropriate\nsources\n1.2 Effective\nquestioning,\nactive listening\nand speaking\nskills are used to\ngather and convey\ninformation\n1.3 Appropriate\nmedium is used\nto transfer\ninformation and\nideas\n1.4 Appropriate non-\nverbal\ncommunication is\nused\n1.5 Appropriate lines\nof communication\nwith supervisors\nand colleagues\nare identified and\nfollowed\n1.6 Defined workplace\n procedures for the\nlocation and\nstorage of\ninformation are\nused\n\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/ Interacting\nwith people of\nvarious levels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n19 Interpersonal skills\nin the workplace\n2.0 Active-listening skills\n\n--- PDF PAGE 7 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n 1.7 Personal\ninteraction is\ncarried out clearly\nand concisely\n\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices\nand instructions\nare read and\ninterpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are\nfollowed based on\nestablished\nprocedures\n2.3 Feedback is given\nto workplace\nsupervisor based\ninstructions/\ninformation\nreceived\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters\nconcerning\nconditions of\nemployment are\nsought and asked\nfrom appropriate\n sources\n2.6 Meetings\noutcomes are\ninterpreted and\nimplemented\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace meetings\nand discussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Basic\nquestioning/querying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n\n--- PDF PAGE 8 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Complete\nrelevant\nwork\nrelated\ndocuments\n3.1 Range of forms\nrelating to\nconditions of\nemployment are\ncompleted\naccurately and\nlegibly\n3.2 Workplace data is\nrecorded on\nstandard\nworkplace forms\nand documents\n3.3 Errors in recording\ninformation on\nforms/ documents\nare identified and\nacted upon\n3.4 Reporting\nrequirements to\nsupervisor are\ncompleted\naccording to\norganizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n\n3.1 Completing work-\nrelated documents\n3.2 Applying operations\nof addition,\nsubtraction, division\nand multiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 9 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n5\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Appropriate\nsources\nMay include:\n1.1.\nTeam members\n1.2.\nSupervisor/Department Head\n1.3.\nSuppliers\n1.4.\nTrade personnel\n1.5.\nLocal government\n1.6.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation dissemination\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace-to-face communication\n2.7.\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace\ninteractions\nMay include:\n4.1.\nFace-to-face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic means, memos,\ninstruction and forms\n4.5.\nNon-verbal including gestures, signals, signs\nand diagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message\nforms, safety reports\n\n--- PDF PAGE 10 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using workplace communication\nequipment/systems\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Notebook\n2.4. Writing materials\n2.5. Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Interview\n3.3. Written test\n3.4. Third-party report\n\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the\nactual workplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n7\n\n UNIT OF COMPETENCY: WORK IN A TEAM ENVIRONMENT\n\n UNIT CODE : 400311211\n\n UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to\n\nidentify one’s roles and responsibilities as a member of a\n\nteam.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified from\nteam discussions\nand appropriate\nexternal sources\n1.1 Group structure\n1.2 Group development\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles\nand responsibilities\nwithin the team\nenvironment are\nidentified\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified based on\nteam discussions\nand appropriate\nexternal sources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n--- PDF PAGE 12 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n8\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Work as a\nteam\nmember\n3.1 Effective and\nappropriate\nforms of\ncommunications\nare used and\ninteractions\nundertaken with\nteam members\nbased on\ncompany\npractices.\n3.2 Effective and\nappropriate\ncontributions\nmade to\ncomplement\nteam activities\nand objectives,\nbased on\nworkplace\ncontext\n3.3 Protocols in\nreporting are\nobserved based\non standard\ncompany\npractices.\n3.4 Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding of\nteam’s role and\nobjectives\n\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning\nand\n decision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace\ncontext\n\n3.1 Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as\na group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\nMay include:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 14 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n10\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nRole play involving the participation of individual\nmember to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.4 Socio-drama and socio-metric methods\n3.5 Sensitivity techniques\n3.6 Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n11\n\nUNIT OF COMPETENCY :\nSOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS\n\nUNIT CODE : 400311212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\napply problem-solving techniques to determine the origin of\nproblems and plan for their resolution. It also includes\naddressing procedural problems through documentation, and\nreferral.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems\nor procedural\nproblem areas\nare identified\n1.2 Problems to be\ninvestigated are\ndefined and\ndetermined\n1.3 Current conditions\nof the problem are\nidentified and\ndocumented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk practices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying\ncurrent industry\nhardware and\nsoftware products\nand services\n1.2 Identifying\ncurrent industry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n\n--- PDF PAGE 16 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential\nsolutions to\nproblem are\nidentified\n2.2 Recommendatio\nns about\npossible\nsolutions are\ndeveloped,\ndocumented,\nranked and\npresented to\nappropriate\nperson for\ndecision\n2.1 Current industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating\nsystems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating system\n2.4 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation\nof solutions are\nplanned\n3.2 Evaluation of\nimplemented\nsolutions are\nplanned\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to\nappropriate\nperson for\nconfirmation\n\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat recommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 17 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and\nincidents\n1.5\n Work-related problems outside of own work\narea\n\n2. Appropriate person\nMay include:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of 