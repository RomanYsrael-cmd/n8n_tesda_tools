  "source_text": "1. Bevel\nThe surface of the prepared metal edge, which is not at right\nangle, where welding is to take place\n\n2. Groove\n\nA narrow channel or depression cut into by a tool\n3. Flanged pipe\n\nIs a pipe with flanges at the ends; can be bolted end-to-end to\nanother pipe\n\n4. Pipe\n\nIs a tube made of metal (or other materials) used to convey\nwater, gas, oil or other fluid substances\n\n5. Pipe Joint\nA connection between two pipes\n\n6. Pipelaying\nRefers to the placing of pipe into position as with buried\npipelines for oil, water or chemicals\n\n7. Productivity\nmeasurement\n\nIt is the measurement of the efficiency of production.\nMeasurements could either be labor productivity or multifactor\nproductivity.\n\n8. Fit-up\n\nA prepared joint connection which is inspected prior to joining in\naccordance with the requirements of a joining procedure and a\nstandard.\n\n9. Pipe wrap\naround\n\nTemplate for marking and measurement in a pipe\n\n10. Isometric\ndrawing\n\n11. Computer literate\n\n12. 5S\n\nIt is a drawing showing the detailed route (coordinates and\nelevation) of the piping connections and the instruments that\ngoes with it as described in the piping and instrumentation\ndesign (PID)\n\nThis term is usually used to describe the most basic knowledge\nand skills needed to operate software products such as an\noperating system, a software application, or an automated Web\ndesign tool.\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain\n\n--- PDF PAGE 121 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n118\n\n13. 3R\n\nReduce\n\nReuse\n\nRecycling\n\nThe principle of reducing waste, reusing and recycling resources\nand products\n\nThe waste management concept of reducing what is produced\nand what is consumed\n\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\n\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 122 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n119",
