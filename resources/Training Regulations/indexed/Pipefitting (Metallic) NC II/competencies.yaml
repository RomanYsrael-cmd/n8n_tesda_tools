      Promulgated  (10/29/2018)                         \n81 \nVARIABLE \nRANGE \n4. Quality/ \nOccupational \nhealth, safety and \nenvironmental \nplans  \n \nMay include: \nQuality plan: \n4.1 Inspection and Test Plans \n4.2 Method Statements \nOccupational health and safety plan:  \n4.3 PPE \n4.4 Compressed gas safety procedures \n4.5 General sling information \n4.6 Precautions in installation of ladders \n4.7 Working at heights \n4.8  Working in confined space  \n4.9  Portable equipment and tools procedures \n4.10  Welding and gas cutting procedures \nEnvironmental plan: \n4.11 Noise and vibration controls \n4.12 Air pollution controls \n4.13 Water pollution controls \n4.14 Waste management controls  \n \n5. Installation and fit-\nup procedures \n \nMay include: \n5.1 Lifting and installation of materials and equipment \n5.2 Trimming and cutting \n5.3 Pipefitting alignment \n5.4 Tack welding \n5.5 Fabrication of temporary supports \n5.6 Jigs \n5.7 Stoppers \n5.8 Pipe clamps \n5.9 Brazing \n \n6. Unused and excess \nmaterials \n \nMay include: \n6.1   Pipes \n6.2   Electrodes/Filler wires \n6.3   Grinding disc \n6.4   Oxy-acetylene gas\n\n--- PDF PAGE 86 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n82 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Planned and prepared for work \n1.2 Lay-out and groove pipes  \n1.3 Installed pipe supports for below ground piping system \n1.4 Installed and fit-up below ground piping system \n1.5 Performed housekeeping \n1.6 Observed safety measures  \n1.7 Communicated with others to ensure effective work operation \n1.8 Observed and complied with the productivity requirements \n1.9 Complied with attitudinal work requirements \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the required \ntasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit \n2.6 Safety signage’s/barricades \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/observation with Oral Questioning \n \n4. Context for \nassessment \n \n4.1   Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
