        "source_title": "PREPARE PIPEFITTING MATERIALS, TOOLS AND EQUIPMENT FOR SPOOL PIPE CONNECTION",
        "source_text": "--- PDF PAGE 54 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n50 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :  \nPREPARE PIPEFITTING MATERIALS, TOOLS AND  \nEQUIPMENT FOR SPOOL PIPE CONNECTION \n \nUNIT CODE   \n \n: \nCON712301 \n \nUNIT DESCRIPTOR            :  \n \nThis unit covers the knowledge, skill and attitudes  \nrequired to productively prepare pipefitting materials, tools \nand equipment for spool pipe connection. \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Plan and prepare \nfor work \n \n \n \n \n \n \n1.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n1.2 Approved construction \ndrawings are secured \nand requirements are \nreviewed according to \njob specifications and \nwork schedule \nrequirements  \n1.3 Materials, tools and \nequipment are \nsecured according to \nbill of quantities in the \napproved construction \ndrawings.  \n1.4 Quality/Occupational \nhealth, safety and \nenvironmental plans \nare complied \n1.5 Materials, tools and \nequipment are \nprepared in \naccordance to work \nrequirements \n1.6 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n1.7 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n1.1 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n1.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n1.3 Quality specification \nrequirements \n1.4 Equipment and \ntools specification \n1.5 DENR standards \nand regulatory \nrequirements \n1.6 Isometric symbols, \ndrawings, sketches  \n1.7 Trade Mathematics \n(related and applied \nTrigonometry) \n1.8 Material description \n1.9 Piping/ cutting \nprocedure for \njointing \n1.10 Piping material \nclassification, \nspecifications and \nuses \n1.11 Work scheduling \ntools \n1.12 Adherence to work \nrequirements \n2.1 Communication \nskills \n2.2 Interpreting \nisometric symbols, \ndrawings, sketches  \n2.3 Interpreting work \nschedule \n2.4 Identification of \nmaterials tools and \nequipment  \n2.5 Applying Trade \nMathematics \n2.6 Following quality/ \noccupational health \nand \nsafety/environment\nal management \nplans \n2.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 55 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n51 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Prepare and lay-\nout pipes  \n \n \n \n \n2.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n2.2 Quality/Occupational \nhealth, safety and \nenvironmental plans \nare complied.  \n2.3 Materials, tools and \nequipment are \nrequested and \nwithdrawn following \ncompany standard \noperating procedures \n2.4 Marked and \nmeasured pipes are \nchecked according to \napproved construction \ndrawings \n2.5 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n2.6 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n \n \n2.1  DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n2.2 Green Building \nConcept relative to \nConstruction  \n(5S) \n2.3 Occupational health \nand safety standards \nand regulatory \nrequirements for \nlayout of pipes \n2.4 Quality specification \nrequirements \n2.5 Equipment and tools \nspecification \n2.6 DENR standards \nand regulatory \nrequirements \n2.7 Isometric drawings, \nsketches  \n2.8 Trade Mathematics \n(related and applied \nTrigonometry) \n2.9 Material description \n2.10 Layouting \nprocedures for \ncutting  \n2.11 Piping material \nclassification, \nspecifications and \nuses \n2.12 Factors affecting \nproductivity \n2.13 Productivity work \nmeasurements \n2.14 Ways of improving \nproductivity \n2.15 Adherence to work \nrequirements \n \n2.1 Communication \nskills \n2.2 Interpreting \nisometric symbols, \ndrawings, sketches \nand material \ndescription \n2.3 Applying Trade \nMathematics \n2.4 Following \nquality/occupational \nhealth and \nsafety/environment\nal management \nplans \n2.5 Applying productive \nmethods and \ntechniques in lay-\nouting pipes for \ncutting \n2.6 Implementing 3R \nand 5S\n\n--- PDF PAGE 56 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n52 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Joint pipes and \nfittings \n3.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n3.2 Quality/ Occupational \nhealth, safety and \nenvironmental plans \nare complied.  \n3.3 Cutting procedure is \nperformed following \njob specifications \n3.4 Dimensional checking \nis performed \naccording to work \nspecification \n3.5 Pipe orientation and \nalignment are \nperformed following \nwork specification \n3.6 Joint dimensional \nrequirements are \nperformed following \nwelding procedures \nspecification \n3.7 Threaded pipe and \nfittings are tightened \nfollowing tightening \nspecifications \n3.8 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n3.9 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n \n3.1 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n3.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n3.3 Occupational health \nand safety \nstandards and \nregulatory \nrequirements for \njoining pipes \n3.4 Quality specification \nrequirements \n3.5 Equipment and tools \nspecification \n3.6 DENR standards \nand regulatory \nrequirements \n3.7 Isometric symbols, \ndrawings, sketches  \n3.8 Trade Mathematics \n(related and applied \nTrigonometry) \n3.9 Material description \n3.10 Jointing \nprocedures  \n3.11 Piping, fitting and \njoining materials \nclassification, \nspecifications and \nuses \n3.12 Factors affecting \nproductivity \n3.13 Productivity work \nmeasurements \n3.14 Ways of improving \nproductivity \n3.15 Adherence to work \nrequirements \n \n3.1 Interpreting \nisometric symbols, \ndrawings, sketches \nand material \ndescription \n3.2 Applying Trade \nMathematics \n3.3 Following quality/ \noccupational health \nand safety/ \nenvironmental  \nmanagement plans \n3.4 Implementing 3R \nand 5S \n3.5 Using piping, fitting \nand joining \nmaterials  \n3.6 Applying productive \nmethods and \ntechniques in \njointing\n\n--- PDF PAGE 57 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n53 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n4.   Perform  \n      housekeeping \n4.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards. \n4.2 Excess/un-used \nmaterials are \nrecovered and \nstockpiled according \nto company rules and \nprocedures \n4.3 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n4.4 Tools and other \nmaterials are       \ncleaned after use \n4.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n4.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n4.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n4.3 Safe handling and \nstandard \nspecification of \nmaterials, tools and \nequipment \n4.4  Safety signs and \nsymbols \n4.5 Adherence to work \nrequirements \n \n4.1 Working safely \n4.2 Organizing \nmaterials to be \nstored \n4.3 Handling and use of \nmaterials, tools and \nequipment \n4.4  Communicating \neffectively \n4.5 Using PPE \n4.6 Implementing 3R \nand 5S\n\n--- PDF PAGE 58 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n54 \n     RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal protective \nequipment (PPE) \nInclude: \n1.1   Safety gloves \n1.2 Safety goggles, glass and face shield \n1.3 Safety helmet \n1.4 Full body harness  \n1.5 Safety clothes \n1.6 Safety shoes \n1.7 Dust masks \n1.8 Ear plug \n \n2. Materials, tools and \nequipment \n \nMay include: \nMaterials: \n2.1 Metallic \n2.1.1 Pipes \n2.1.2 Fittings \n2.1.3 Bolts and nuts \n2.1.4 Valves \n2.1.5 Flange \n2.1.6 Gasket \n2.2 Non-metallic \n2.2.1 Gasket \n2.2.2 Inserts \nTools and Equipment: \n2.1 Cutting set \n2.1.1 Oxy-acetylene cutter \n2.1.2 Beveling machine \n2.1.3 Cutting disk \n2.2 Grinder angle \n2.3 Steel square \n2.4 Level bar / Spirit level \n2.5 Center punch \n2.6 Ballpeen hammer \n2.7 Contour marker \n2.8 Soft stone \n2.9 Steel measuring tape \n2.10 Files \n2.11  Power brush \n2.12  Steel brush \n2.13  Adjustable wrench \n2.14  Grinder key \n2.15  Tip cleaner \n2.16  Spark lighter \n2.17 Plumb bob \n2.18 Chain block \n2.19 Lever block \n2.20 Pipe clamp \n2.21 Wrap around  \n2.22 LPG cutting outfit (optional)\n\n--- PDF PAGE 59 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n55 \n \nVARIABLE \nRANGE \n3. Quality \nMay include: \n2.1 Welding gauge \n2.2 Gap Gauge \n2.3 Hi-lo welding gauge \n4. Quality/ Occupational \nhealth, safety and \nenvironmental plans  \n \nMay include: \nQuality plan: \n4.1. Inspection and Test Plans \n4.2. Method Statements \n \nOccupational health and safety plan:  \n4.3. PPE \n4.4. Compressed gas safety procedures \n4.5. General sling information \n4.6. Precautions in installation of ladders \n4.7. Working at heights \n4.8. Working in confined space  \n4.9. Portable equipment and tools procedures \n4.10. Welding and gas cutting procedures \n \nEnvironmental plan: \n4.11. Noise and vibration controls \n4.12. Air pollution controls \n4.13. Water pollution controls \n4.14. Waste management controls  \n \n5. Cutting procedure \nMay include: \n5.1  Beveling machine \n5.2  Oxy-acetylene gas cutting \n \n5.3  Grinding \n5.4  Machining \n5.5 Threading machine \n5.6  Plasma cutting \n5.7  LPG Cutting \n \n6. Joint dimensional \nrequirements \nMay include: \n6.1 Welding gap, groove as per WPS (Welding Procedure   \n      Specifications) \n6.2 Leveling, squareness and straightness \n6.3 Internal and external alignment \n \n7. Excess and unused \nmaterials \n \nMay include: \n7.1 Pipes \n7.2 Electrodes/Filler wires \n7.3 Grinding disc \n7.5 Oxy-acetylene gas\n\n--- PDF PAGE 60 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n56 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Planned and prepared for work \n1.2 Prepared and lay-out pipes according to approved construction \ndrawings \n1.3 Jointed pipes and fittings following welding procedures \nspecification \n1.4 Performed housekeeping \n1.5 Observed and complied with safety and environmental \nregulations \n1.6 Communicated with others to ensure effective work operation \n1.7 Observed and complied with the productivity requirements \n1.8 Complied with attitudinal work requirements \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the \nrequired tasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit \n2.6 Safety signage’s/barricades \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/observation with Oral Questioning \n \n4. Context for \nassessment \n4.1  Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
