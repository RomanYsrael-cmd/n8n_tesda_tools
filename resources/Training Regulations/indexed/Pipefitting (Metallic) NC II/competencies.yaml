 notices \n1.3  Participating in \nworkplace meetings \nand discussions \n1.4  Preparing work- \nrelated documents \n1.5  Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6  Relating/ Interacting \nwith people of \nvarious levels in the \nworkplace \n1.7  Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements \n1.8 Basic business \nwriting skills \n19  Interpersonal skills \nin the workplace \n2.0 Active-listening skills\n\n--- PDF PAGE 7 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n3 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n  \nREQUIRED \nSKILLS \n \n      1.7  Personal \ninteraction is \ncarried out clearly \nand concisely \n \n \n \n2.  Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices \nand instructions \nare read and   \ninterpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction are \nfollowed based on \nestablished \nprocedures \n2.3 Feedback is given \nto workplace \nsupervisor based \ninstructions/ \ninformation \nreceived \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters \nconcerning \nconditions of \nemployment are \nsought and asked \nfrom appropriate  \n      sources  \n2.6  Meetings \noutcomes are \ninterpreted and \nimplemented \n2.1 Effective verbal \nand non-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nWorkplace \npolicies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace \netiquette \n \n  \n2.1  Following simple \nspoken instructions  \n2.2  Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n2.3  Participating in \nworkplace meetings \nand discussions \n2.4  Completing work- \nrelated documents \n2.5  Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n2.6  Relating/ \nResponding to \npeople of various \nlevels in the \nworkplace \n2.7  Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n2.8 Basic \nquestioning/querying \n2.9 Skills in reading for \ninformation  \n2.10 Skills in locating\n\n--- PDF PAGE 8 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n4 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n  \nREQUIRED \nSKILLS \n3.   Complete \nrelevant \nwork \nrelated \ndocuments \n3.1  Range of forms \nrelating to \nconditions of \nemployment are \ncompleted \naccurately and \nlegibly \n3.2  Workplace data is \nrecorded on \nstandard \nworkplace forms \nand documents \n3.3  Errors in recording \ninformation on \nforms/ documents \nare identified and \nacted upon \n3.4  Reporting \nrequirements to \nsupervisor are \ncompleted \naccording to \norganizational \nguidelines \n3.1 Effective verbal \nand non-verbal \ncommunication \n3.2 Different modes of \ncommunication  \n3.3 Workplace forms \nand documents \n3.4 Organizational/ \nWorkplace \npolicies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n \n \n3.1  Completing work- \nrelated documents \n3.2  Applying operations \nof addition, \nsubtraction, division \nand multiplication \n3.3  Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n3.4 Effective record \nkeeping skills\n\n-