  "source_section_text": "SECTION 1 PIPEFITTING (METALLIC)\n\nThe PIPEFITTING (METALLIC) NC II qualification consists of competencies that\nworkers must achieve to enable them to perform tasks applied to rigid piping such as\nstructural pipes, main pipes and services pipes as applied to water, oil and gas lines.\n\nThis qualification is packaged from the competency map of Construction Sector as\nshown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and\nprocedures\nExercise efficient and effective sustainable practices in\nthe workplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON712301\nPrepare pipefitting materials, tools and equipment for spool pipe\nconnection\nCON712302\nCON712303\nInstall above ground piping system\nInstall overhead piping system\nCON712304\nInstall underground piping system\n\nA person who has achieved this Qualification is competent to be a –\n\n Pipefitter\n\n--- PDF PAGE 6 ---\nPIPEFITTING (METALLIC) NC II Revision 01 Promulgated (10/29/2018)\n2"
}
