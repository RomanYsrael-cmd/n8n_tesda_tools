        "source_text": "--- PDF PAGE 49 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n45 \n \n \nUNIT OF COMPETENCY \n:  \n MAINTAIN TOOLS AND EQUIPMENT  \n \nUNIT CODE  \n \n \n: \nCON311204 \n \nUNIT DESCRIPTOR \n \n:  \nThis unit covers the knowledge, skills and attitudes  \non checking condition, performing preventive  \nmaintenance and storing of construction painting  \ntools and equipment.  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms \nare elaborated in \nthe \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Check condition of \ntools and \nequipment \n \n1.1 Materials, tools \nand equipment \nare identified \naccording to \nclassification and \njob requirements \n1.2 Non-functional \ntools and \nequipment are \nsegregated and \nlabeled \naccording to \nclassification \n1.3 Safety of tools \nand equipment \nare observed in \naccordance with \nmanufacturer’s \ninstructions \n1.4 Condition of \nPersonal \nProtective \nEquipment \n(PPE) are \nchecked in \naccordance with \nmanufacturer’s \ninstructions \n \n1.1 Use of PPE \n1.2 Handling of tools \nand equipment \n1.3 Good \nhousekeeping \n1.4 Types and uses \nof lubricants \n1.5 Types and uses \nof cleaning \nmaterials \n \n1.1 Maintaining tools \nand equipment \n1.2 Handling of tools \nand equipment \n1.3 Identifying tools \nand equipment \ndefects\n\n--- PDF PAGE 50 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n46 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms \nare elaborated in \nthe Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Perform basic \npreventive \nmaintenance \n2.1 Appropriate \nlubricants are \nidentified \naccording to \ntypes of \nequipment \n2.2 Tools and \nequipment are \nlubricated \naccording to   \npreventive \nmaintenance \nschedule or \nmanufacturer's \nspecifications \n2.3 Measuring \ninstruments are \nchecked and \ncalibrated in \naccordance with \nmanufacturer’s \ninstructions \n2.4 Tools are \ncleaned and \nlubricated \naccording to \nstandard \nprocedures \n2.5 Defective \ninstruments,   \nequipment and \naccessories are \ninspected and \nreplaced \naccording to \nmanufacturer’s \nspecifications \n2.6 Tools are \ninspected, \nrepaired and \nreplaced after \nuse \n2.7 Work place is \ncleaned and \nkept in safe \nstate in line with \nOccupational \nSafety and \nHealth (OSHS)  \n2.1 Use of PPE \n2.2 Handling of tools \nand equipment \n2.3 Good \nhousekeeping \n2.4 Types and uses \nof lubricants \n2.5 Types and uses \nof cleaning \nmaterials \n2.6 Basic preventive \nmaintenance \nmethods, \ntechniques and \nprocedures \n \n2.1 Handling of tools \nand equipment \n2.2 Performing \npreventive \nmaintenance\n\n--- PDF PAGE 51 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n47 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms \nare elaborated in \nthe \nRange of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Store tools and \nequipment \n \n3.1 Inventory of \ntools, \ninstruments and \nequipment are \nconducted and \nrecorded as per \ncompany \npractices \n3.2 Tools and \nequipment are \nstored safely in \nappropriate \nlocations in \naccordance with \nmanufacturer's \nspecifications or \ncompany \nprocedures \n \n3.1 Use of PPE \n3.2 Handling of tools \nand equipment \n3.3 Storing \nprocedures and \ntechniques \n3.4 Storage \nconditions/ \nlocations \n \n3.1 Storing tools and \nequipment \n3.2 Handling of tools \nand equipment\n\n--- PDF PAGE 52 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n48 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \nMay include: \n1.1 Lubricants \n1.2 Cleaning materials \n1.3 Rust remover \n1.4 Rugs \n1.5 Spare parts \n2. Tools and equipment \n \nMay include: \n2.1 Tools \nCutting tools - hacksaw, crosscut saw \nBoring tools - brace, hand drill \nHolding tools - vise grip, C-clamp, bench vise \nThreading tools - die and stock, taps \n2.2 Measuring instruments/equipment \n3. Personal Protective \nEquipment (PPE) \nMay include: \n3.1 Goggles \n3.2 Gloves \n3.3 Safety shoes \n3.4 Hard hat \n3.5 Reflectorized Vest\n\n--- PDF PAGE 53 ---\nPIPEFITTING (METALLIC)  NC II  Revision 01                          Promulgated  (10/29/2018)                         \n49 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires that the candidate: \n1.1 Selected and used appropriate processes, tools and   \nequipment to carry out task \n1.2 Identified functional and non-functional tools and \nequipment  \n1.3 Checked, lubricated and calibrated tools, equipment and  \ninstruments according to manufacturer’s specifications \n1.4 Replaced defective tools, equipment and their \naccessories  \n1.5 Observed and applied safe handling of tools and \nequipment and safety work practices \n1.6 Prepared and submitted inventory report,  where \napplicable \n1.7 Maintained workplace in accordance with OSHA \nregulations \n1.8 Stored tools and equipment safely in appropriate locations \nand in accordance with company practices \n2. Resource  \nimplications \nThe following resources should be provided: \n2.1 Workplace \n2.2  Maintenance schedule \n2.3 Maintenance materials, tools and equipment relevant to \nthe proposed activity/task \n3. Methods of \nassessment \nCompetency in this unit may be assessed through: \n3.1  Direct observation/Demonstration with Oral Questioning \n3.2  Written Examination   \n4. Context of \nassessment \n4.1  Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
