enses and/or\ncertifications relevant to job\nand career are obtained and\nrenewed\n3.1 Career development\nopportunities\n3.2 Company recognition\nand incentives\n3.3 Information on\nrelevant licenses\nand or certifications\n3.1 Determining\npersonal\ncareer\ndevelopment\nneeds\n3.2 Identifying\ncareer\nopportunities\n\n--- PDF PAGE 13 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 14 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 10\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 11\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE :"
