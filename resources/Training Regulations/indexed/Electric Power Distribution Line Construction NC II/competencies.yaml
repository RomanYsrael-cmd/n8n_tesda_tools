        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Demonstrates ability to interpret job requirements\n1.2. Demonstrates ability to install single-phase line equipment and\ndevices\n1.3. Demonstrates ability to connect single-phase line equipment and\ndevices to distribution line\n2. Resource\nimplications\nThe following resources should be available:\n2.1. PPE, tools, equipment and devices (see range of variables)\n2.2. Site or work area\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1. Direct observation with oral questioning\n3.2. Demonstration of skills with oral questioning\n3.3. Written test\n\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be undertaken either individually or part of team\nunder limited supervision\n\n--- PDF PAGE 61 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 57\nUNIT OF COMPETENCY :\nINSTALL SINGLE-PHASE CONSUMER SERVICE\nCONNECTION FACILITY\nUNIT CODE\n:"
        },
        "source_text": "UTL741314\nDESCRIPTOR\n:\nThis unit covers the outcomes required for installing\nsingle-phase distribution line equipment and devices. The\nscope of this unit covers performing installation of\ndistribution line equipment and devices as well as\ntapping/connecting\nline equipment\nand\ndevices\nto\ndistribution line. This involves working with a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\nwork\n\n1.1. Work instructions are\nsecured and interpreted\naccording to job\nrequirements\n1.2. Relevant occupational\nsafety and health\nrequirements are\nidentified following job\nspecifications\n1.3. Relevant distribution line\ntools, equipment,\nmaterials and devices\nare identified, requested\nand acquired in\naccordance with\nconstruction\nspecifications\n1.4. Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n1.1. Oral and written\ncommunication\n1.2. Basic Mathematics\n(MDAS)\n1.3. Units conversion\n1.4. Climbing techniques\n1.5. Usage of PPE’s\n1.6. Appropriate tools and\nequipment for\ninstallation of line\ndevices\n1.7. Interpret staking sheets\nand job order\n1.8. OSH procedures and\nsafety requirements\n1.9. Line hardware and\nconductors\n1.1. Interpretation\nskills\n1.2. Reading skills\n1.3. Preparation\nskills\n1.4. Planning skills\n1.5. Communication\nskills\n1.6. Analytical skills\n1.7. Materials\nhandling skills\n\n2. Install single-\nphase line\nequipment\nand devices\n2.1. Lifting devices are\ninstalled securely to the\ntop of the pole.\n2.2. Boring is performed in\naccordance with the\nconstruction specification\n2.3. Line equipment and\ndevices are installed in\naccordance with\nconstruction\nspecifications and\nstandards\n2.4. Housekeeping is\nperformed in line with\nestablished procedure\n2.1. Oral and written\ncommunication\n2.2. Hand signal\ncommunication\n2.3. Radio communication\n2.4. Basic Mathematics\n(MDAS)\n2.5. Unit conversion\n2.6. Equipment nameplate\nratings\n2.7. Conductor jumper\ntypes and sizes\n2.8. Compression tool and\nbolt cutter\n2.9. Size and types of fuses\n2.10. Usage of PPE’s\n2.11. Appropriate tools and\nequipment for pole\nclimbing\n2.12. Interpret staking\nsheets and job order\n2.13. OSH procedures and\nsafety requirements\n2.1. Interpretation\nskills\n2.2. Reading skills\n2.3. Communication\nskills\n2.4. Analytical skills\n2.5. Skills in usage of\ntransformer gin,\nhand line, and\ntag line\n2.6. Knot tying skills\n2.7. Climbing Skills\n2.8. Basic Hand\nsignal\n2.9. Materials\nhandling skills\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 54\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n2.14. Line hardware\n2.15. Construction\nspecifications\n\n3. Tap/Connect\nline\nequipment\nand devices to\ndistribution\nline\n3.1. Connectors and jumpers\nare installed between line\nconductors for safety,\nconductivity and reliability\npurposes.\n3.2. Line tapping and\nconnection is performed\nin accordance with the\nconstruction specification\n3.3. Grounding for equipment\nis installed in accordance\nwith line construction\nspecifications.\n3.1. Oral and written\ncommunication\n3.2. Hand signal\ncommunication\n3.3. Radio communication\n3.4. Basic Mathematics\n(MDAS)\n3.5. Unit conversion\n3.6. Conductor jumper\ntypes and sizes\n3.7. Conductor splicing\ntechniques\n3.8. Compression tool and\nbolt cutter\n3.9. Usage of PPE’s\n3.10. Appropriate tools and\nequipment for pole\nclimbing\n3.11. Interpret staking\nsheets and job order\n3.12. OSH procedures and\nsafety requirements\n3.13. Line hardware\n3.14. Construction\nspecifications\n3.15. Slack requirements\n\n3.1. Interpretation\nskills\n3.2. Reading skills\n3.3. Communication\nskills\n3.4. Analytical skills\n3.5. Skills in usage\nof Hand line\n3.6. Climbing Skills\n3.7. Basic Hand\nsignal\n3.8. Material\nhandling skills\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work instruction\nMay include but are not limited to:\n1.1\njob order form\n1.2\nwork order form\n\n2. Occupational\nhealth and safety\nrequirements\nMay include but not limited to:\n2.1\nPersonal protective equipment (PPE)\n2.1.1. Hard hat/Safety hat\n2.1.2. Goggles/Eye protector\n2.1.3. Working gloves\n2.1.4. Line worker boots\n2.1.5. Working clothes\n2.1.6. Rain suits\n2.1.7. Rubber boots\n\n2.2\nPole climbing equipment\n2.2.1. Safety strap/cord\n2.2.2. Body belt\n2.2.3. Pair of climbers\n\n3. Distribution line\ntools, materials,\nequipment and\ndevices\nMay include but not limited to:\n3.1\nTools\n3.1.1. Rope/Hand line/Bull line\n3.1.2. Adjustable wrench or line worker wrench\n3.1.3. Pliers\n3.1.4. Ball-peen hammer\n3.1.5. Measuring rule / steel tape\n3.1.6. Screw driver\n3.1.7. Auger bit\n3.1.8. Wire skinning knife\n3.1.9. Compression tool\n3.2\nMaterials/Hardware\n3.2.1. conductors\n3.2.2. insulators and pins\n3.2.3. ground rod\n3.2.4. ground lead\n3.2.5. connectors\n3.2.6. ground clip\n3.2.7. bolts and accessories\n3.2.8. wire staple\n3.2.9. wedge clamps\n3.2.10. hot line clamps\n3.3\nEquipment and devices\n3.3.1. Transformer gin\n3.3.2. Cut-out\n3.3.3. Distribution transformer\n3.3.4. Pulley or block and tackle\n3.3.5. Ladder\n3.3.6. Boom truck or derrick truck\n3.3.7. Pole climbing equipment\n\n4. Lifting devices\nMay include:\n\n--- PDF PAGE 60 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 56\nVARIABLE\nRANGE\n4.1\nTransformer gin\n4.2\nPulley or block and tackle\n4.3\nHandline / Rope / Bull line\n\n5. construction\nspecifications\n5.1\nspecifications for 13.2 / 7.62 KV line construction\n5.2\nspecifications for 34.5 / 20 KV line construction\n5.3\nspecifications for other distribution utilities\n\n6. line equipment\nand devices\nMay include:\n6.1\ndistribution transformer\n6.2\ncut-out and lightning arrester\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Demonstrates ability to interpret job requirements\n1.2. Demonstrates ability to install single-phase line equipment and\ndevices\n1.3. Demonstrates ability to connect single-phase line equipment and\ndevices to distribution line\n2. Resource\nimplications\nThe following resources should be available:\n2.1. PPE, tools, equipment and devices (see range of variables)\n2.2. Site or work area\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1. Direct observation with oral questioning\n3.2. Demonstration of skills with oral questioning\n3.3. Written test\n\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be undertaken either individually or part of team\nunder limited supervision\n\n--- PDF PAGE 61 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 57\nUNIT OF COMPETENCY :\nINSTALL SINGLE-PHASE CONSUMER SERVICE\nCONNECTION FACILITY\nUNIT CODE\n:"
