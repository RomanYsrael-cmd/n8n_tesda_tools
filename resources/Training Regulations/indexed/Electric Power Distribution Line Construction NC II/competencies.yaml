        "source_text": "UTL741315\nDESCRIPTOR\n:\nThis unit covers the outcomes required for installing\nsingle-phase consumer service connection facility. The\nscope of this unit covers installing service drop and single-\nphase KWH meter. This involves working with a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\nwork\n\n1.1. Work instruction is\nsecured and interpreted\naccording to job\nrequirements\n1.2. Relevant occupational\nhealth and safety\nrequirements are\nidentified following job\nspecifications\n1.3. Necessary tools,\nhardware, equipment\nand devices needed for\nthe work are identified,\nrequested and acquired in\naccordance with\nconstruction specifications\n1.4. Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n1.1. Oral and written\ncommunication\n1.2. Basic Mathematics\n(MDAS)\n1.3. Unit conversion\n1.4. Basic geography\n1.5. Types of KWH meter\n1.6. Climbing techniques\n1.7. Usage of PPE’s\n1.8. Appropriate tools and\nequipment for pole\nclimbing and\ninstallation of line\ndevices\n1.9. Interpret staking sheets\nand job order\n1.10. OSH procedures and\nsafety requirements\n1.11. Line hardware and\nconductors\n1.1. Interpretation\nskills\n1.2. Reading skills\n1.3. Preparation\nskills\n1.4. Planning skills\n1.5. Communication\nskills\n1.6. Analytical skills\n1.7. Mapping skills\n\n2. Install Service\nDrop\n2.1. Relevant occupational\nhealth and safety\nrequirements are\ncomplied following job\nspecifications\n2.2. Service drop\naccessories are installed\naccording construction\nstandards and\nrequirements\n2.3. Service drop cables are\ninstalled according\nconstruction standards\nand requirements\n2.4. Service drop clearance is\nconformed with latest\nPhilippine Electrical Code\n(PEC).\n2.1. Oral and written\ncommunication\n2.2. Hand signal\ncommunication\n2.3. Radio communication\n2.4. Basic Mathematics\n(MDAS)\n2.5. Unit conversion\n2.6. Service drop types and\nsizes\n2.7. Compression tool and\nbolt cutter\n2.8. Usage of PPE’s\n2.9. Appropriate tools and\nequipment for pole\nclimbing\n2.10. OSH procedures and\nsafety requirements\n2.11. Line hardware\n2.12. Construction\nspecifications\n2.13. Sagging requirements\n2.14. Vertical clearance\nrequirements\n2.15. PEC requirements\n2.1. Interpretation\nskills\n2.2. Reading skills\n2.3. Communication\nskills\n2.4. Analytical skills\n2.5. Climbing Skills\n2.6. Material\nhandling skills\n\n3. Install KWH\n3.1. Relevant occupational\n3.1. Oral and written\n3.1. Interpretation\n\n--- PDF PAGE 62 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 58\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\nmeter\nhealth and safety\nrequirements are\ncomplied following job\nspecifications\n3.2. Meter base is installed\naccording to construction\nstandards and\nrequirements\n3.3. KWH meter is installed\naccording to construction\nstandards and\nrequirements\n3.4. Customer is advised for\ncompletion of work and\nverify availability of\nelectric power\n3.5. Housekeeping procedure\nis performed in line with\nestablished procedure\n\ncommunication\n3.2. Basic Mathematics\n(MDAS)\n3.3. Unit conversion\n3.4. Basic Electricity\n3.5. Types of KWH meter\n3.6. Conductor jumper\ntypes and sizes\n3.7. Conductor splicing\ntechniques\n3.8. Compression tool\n3.9. Usage of PPE’s\n3.10. Appropriate tools and\nequipment for pole\nclimbing\n3.11. Interpret staking\nsheets and job order\n3.12. OSH procedures and\nsafety requirements\n3.13. Line hardware\n3.14. Construction\nspecifications\nskills\n3.2. Reading skills\n3.3. Communication\nskills\n3.4. Analytical skills\n3.5. Climbing Skills\n3.6. Material\nhandling skills\n\n--- PDF PAGE 63 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 59\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational\nhealth and safety\nrequirements\nMay include but not limited to:\n1.1\nPersonal protective equipment (PPE)\n1.1.1. Hard hat/Safety hat\n1.1.2. Goggles/Eye protector\n1.1.3. Work gloves\n1.1.4. Line worker boots\n1.1.5. Working clothes\n1.1.6. Rubber boots\n1.1.7. Rain suits\n1.2\nPole climbing equipment\n1.2.1. Safety strap/cord\n1.2.2. Body belt\n1.2.3. pair of climbers\n2. Tools, hardware,\nequipment and\ndevices\nMay include but not limited to:\n2.1\nTools\n2.1.1. Rope/Hand line\n2.1.2. Adjustable wrench or line worker wrench\n2.1.3. Pliers\n2.1.4. Ball peen hammer\n2.1.5. Measuring rule (wood)\n2.1.6. Screw driver\n2.1.7. Auger bit\n2.1.8. Electric tape\n2.1.9. Wire skinning knife\n2.1.10. Compression/crimping tool\n2.2\nEquipment and devices\n2.2.1. Ladder\n2.2.2. Pole climbing equipment\n2.2.3. KWH meter\n2.2.4. Multi-tester (amps-volt)\n2.3\nHardware\n2.3.1 Service drop cables\n2.3.2 Service connection accessories\n3. Service drop\naccessories\nMay include:\n3.1\nOval eye bolt/nut\n3.2\nService swinging clevis\n3.3\nSpool insulator\n3.4\nService grip / Dead-end loop clamp\n3.5\nService drop wire\n3.6\nService wire grip\n3.7\nStrain/Screw insulators\n3.8\nCompression connector/ Clamps\n4. Service drop\ncable\nMay include:\n4.1\nTriplex aluminum/copper cable\n4.2\nDuplex aluminum/copper cable\n5. KWH meter\nMay include:\n5.1\nSingle phase socket type\n5.2\nSingle phase bottom-connected\n\n--- PDF PAGE 64 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------