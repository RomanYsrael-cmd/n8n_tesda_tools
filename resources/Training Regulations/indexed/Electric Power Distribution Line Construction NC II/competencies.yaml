        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to interpret job requirements\n1.2 Demonstrates ability to dress/frame Pole\n1.3 Demonstrates ability to install pole anchor and guy\n1.4 Demonstrates ability to string and tension conductor\n1.5 Demonstrates ability to apply conductor armoring and tying\n1.6 Demonstrate ability to install appropriate grounding assembly\n\n2. Resource\nimplications\nThe following resources should be available:\n2.1 Tools, equipment, hardware and PPE (see range of variables)\n2.2 Site or work area\n2.3 Boom truck (if necessary)\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation with oral questioning\n3.2 Demonstration of skills with oral questioning\n3.3 Written test\n\n4. Context of\nassessment\n4.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be undertaken either individually or part of team\nunder limited supervision\n\n--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 53\nUNIT OF COMPETENCY :\nINSTALL SINGLE-PHASE DISTRIBUTION LINE\nEQUIPMENT AND DEVICES\nUNIT CODE\n:"
        },
        "source_text": "UTL741313\nDESCRIPTOR\n:\nThis unit covers the outcomes required for climbing pole\nand installing pole top, anchor, guy, conductor (primary/\nsecondary), grounding assemblies. The scope of this unit\ncovers climbing techniques, dressing/framing of pole,\ninstalling\npole\nanchor\nand\nguy,\nconductor\npay-\nout/stringing,\ntensioning,\narmoring\nand\ntying\nof\nconductors. This involves working with a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n\n1.1 Work instruction is\nsecured and interpreted\naccording to job\nrequirements\n1.2 Relevant occupational\nsafety and health\nrequirements are\nidentified following job\nspecifications\n1.3 Relevant distribution line\ntools, equipment and\nhardware are identified,\nrequested and acquired\nin accordance with\nconstruction\nspecifications\n1.4 Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n1.1 Oral and written\ncommunication\n1.2 Basic Mathematics\n(MDAS)\n1.3 Units conversion\n1.4 Climbing techniques\n1.5 Usage of PPE’s\n1.6 Appropriate tools and\nequipment for pole\nclimbing\n1.7 Interpret staking sheets\nand job order\n1.8 OSH procedures and\nsafety requirements\n1.9 Line hardware and\nconductors\n1.1. Interpretation\nskills\n1.2. Reading skills\n1.3. Preparation\nskills\n1.4. Planning skills\n1.5. Communication\nskills\n1.6. Analytical skills\n\n2. Climb and\ndress/frame\npole\n\n2.1. Pole climbing technique\nis demonstrated in line\nwith occupational health\nand safety standards.\n2.2. Installation of pole top\nassembly is performed\nin accordance with\nconstruction\nspecifications\n2.3. Boring is performed in\naccordance with the\nconstruction\nspecifications\n2.4. Housekeeping\nprocedures are\nperformed in line with\nestablished procedure\n2.1. Oral and written\ncommunication\n2.2. Hand signal\ncommunication\n2.3. Radio communication\n2.4