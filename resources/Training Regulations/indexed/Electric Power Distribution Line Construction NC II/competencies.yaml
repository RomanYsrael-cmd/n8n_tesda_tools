 competencies of the\nmembers\n3.1 Communication\nprocess\n3.2 Group planning\nand decision\nmaking\n3.3 Team goals and\nobjectives\n3.4 Understanding\nindividual\ncompetencies\nrelative to\nteamwork\n3.5 Types of\nindividuals\n3.6 Role of leaders\n3.1 Interacting\neffectively\nwith others\n3.2 Setting team\ngoals and\nexpectations\n\n--- PDF PAGE 10 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 6\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with enterprise\nor specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 7\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\