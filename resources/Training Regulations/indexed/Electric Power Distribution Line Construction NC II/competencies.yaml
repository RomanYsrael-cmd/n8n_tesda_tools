        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates knowledge of different pole erection\nmethods\n1.2 Demonstrates ability to identify and follow occupational\nsafety and health standards for line workers\n1.3 Demonstrates ability to identify and use of distribution line\ntools, equipment and hardware\n1.4 Demonstrates ability to perform pole loading, pole hauling,\npole spotting, pole hole digging, pole grounding and pole\nsetting/erection\n1.5 Demonstrate ability to perform right of way clearing\n1.6 Demonstrates ability to communicate and work in a team\nenvironment\n\n2. Resource\nimplications\nThe following resources should be available:\n2.1 Tools, equipment, hardware and PPE (see range of variables)\n2.2 Site or work area\n2.3 Poles\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation with oral questioning\n3.2 Demonstration of skills with oral questioning\n3.3 Written test\n3.4 Third party report (Instructor/Trainor’s report)\n\n4. Context of\nassessment\n4.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 47\nUNIT OF COMPETENCY :\nCLIMB POLE AND INSTALL POLE ASSEMBLY AND\nCONDUCTORS\nUNIT CODE\n:"
        },
        "source_text": "UTL741312\nDESCRIPTOR\n: This unit covers the knowledge, skills and attitude required\nto erect distribution line poles. This unit includes\ncompetencies for installing new distribution line pole as\nwell as transporting pole from stockyard to jobsite,\nperforming pole spotting, hole digging, grounding and pole\nsetting/erection and right of way clearing. This involves\nworking with a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n1.1. Work instructions are\nsecured and interpreted\naccording to job\nrequirements\n1.2. Relevant occupational\nhealth and safety\nrequirements are\nidentified following job\nspecifications\n1.3. Relevant distribution line\ntools, equipment and\nhardware/materials are\nidentified, requested and\nacquired in accordance\nwith construction\nspecifications\n1.4. Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n1.1. Oral and written\ncommunication\n1.2. Basic Mathematics\n(MDAS)\n1.3. Units conversion\n1.4. Soil composition\n1.5. Manual erection\nprocedures\n1.6. Boom truck erection\nprocedures\n1.7. Usage of PPE’s\n1.8. Appropriate tools for\npole erection\n1.9. Interpret staking\nsheets and job order\n1.10. OSH procedures\n1.11. Line clearances\n1.12. Right of Way\nclearances\n1.13. DENR and LGU\nordinances on\nvegetation clearing\n1.1. Interpretation\nskills\n1.2. Reading skills\n1.3. Preparation\nskills\n1.4. Planning skills\n1.5. Communication\nskills\n1.6. Analytical skills\n\n2. Perform pole\nloading,\nhauling and\nspotting\n2.1. Appropriate distribution line\ntools and equipment are\nused in line with job\nrequirements\n2.2. Personal protective\nequipment (PPE) are used\nfollowing job requirements\n2.3. Loading and unloading\nprocedure for poles is\nperformed following safety\nrequirements\n2.4. Poles hauling and pole\nspotting (unloading) is\nperformed based on\nstaking sheet.\n2.1. Oral and written\ncommunication\n2.2. Basic hand signal\n2.3. Radio\n2.4. Basic Mathematics\n(MDAS)\n2.5. Units conversion\n2.6. Usage of PPE’s\n2.7. Appropriate tools and\nequipment for pole\nloading, hauling and\nspotting\n2.8. Interpret staking\nsheets and job order\n2.9. OSH procedures\n2.1. Interpretation\nskills\n2.2. Reading skills\n2.3. Communication\nskills\n2.4. Analytical skills\n2.5. Lifting skills\n2.6. Knot tying skills\n\n3. Perform pole\nhole digging,\ngrounding\n3.1 Occupational safety and\nhealth (OSH) standards\nare complied during\n3.1 Oral and written\ncommunication\n3.2 Hand signal\n3.1. Interpretation\nskills\n3.2. Reading skills\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 43\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nand setting/\nerection\nerection/set-up of\ndistribution poles.\n3.2 Distribution line tools,\nequipment and hardware\nare used in line with\nconstruction\nspecifications\n3.3 Personal protective\nequipment (PPE) are used\nfollowing job requirements\n3.4 Pole hole digging is\nperformed following\nestablished depth\nrequirements\n3.5 Pole grounding is installed\nin accordance with\nconstruction specifications\nand staking sheets.\n3.6 Pole setting/erection\nprocedure is performed in\nline with job requirements\n3.7 Where necessary, guy\nwires are installed for\ncorner, angle and dead-\nend poles.\n3.8 Good housekeeping is\nperformed following\nestablished procedure.\ncommunication\n3.3 Radio communication\n3.4 Basic Mathematics\n(MDAS)\n3.5 Units conversion\n3.6 Soil composition\n3.7 Manual erection\nprocedures\n3.8 Boom truck erection\nprocedures\n3.9 Usage of PPE’s\n3.10 Appropriate tools for\npole hole digging,\ngrounding and\nsetting/ erection\n3.11 Interpret staking\nsheets and job order\n3.12 OSH procedures\n3.3. Communication\nskills\n3.4. Analytical skills\n3.5. Digging skills\n\n4. Clear right of\nway\n4.1 Distribution line poles and\nguy are inspected based\nconstruction specifications\n4.2 Vegetation and other\nobstructions are identified\nbased on job\nrequirements\n4.3 Vegetation and other\nobstructions are cleared\nbased on construction\nspecifications and safety\nrequirements\n\n4.1. Oral and written\ncommunication\n4.2. Hand signal\ncommunication\n4.3. Radio communication\n4.4. Basic MDAS\n4.5. Units conversion\n4.6. Soil composition\n4.7. Plants and trees\nclassifications\n4.8. Usage of PPE’s\n4.9. Appropriate tools and\nequipment for right of\nway clearing\n4.10. Interpret staking\nsheets and job order\n4.11. OSH procedures\n4.12. Line clearances\n4.13. Right of Way\nclearances\n4.14. DENR and LGU\nordinances on\nvegetation clearing\n4.1. Interpretation\nskills\n4.2. Reading skills\n4.3. Communication\nskills\n4.4. Analytical skills\n4.5. Proper usage of\nChainsaw\n4.6. Proper usage of\n“bolo”\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work instructions\nMay include but are not limited to:\n1.1 Job order\n1.2 Staking sheets\n2. Occupational health\nand safety\nrequirements\nMay include but are not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1 Hard hat/safety hat\n2.1.2 Goggles/eye protector\n2.1.3 Work gloves\n2.1.4 Line worker boots\n2.1.5 Working clothes\n2.1.6 Rain suits\n2.1.7 Rubber boots\n2.2 Pole climbing equipment\n2.2.1. Safety strap/cord\n2.2.2. Body belt\n2.2.3. Pair of climbers\n3. Distribution line tools,\nequipment and\nhardware/ materials\nMay include but are not limited to:\n3.1 Tools\n3.1.1. Ropes/Bull line/Sling\n3.1.2. Cant hook\n3.1.3. Digging bar/ Tamping bar\n3.1.4. Pole pike\n3.1.5. Pole jenny\n3.1.6. Straight shovel (long and short)\n3.1.7. Pole hole digger\n3.1.8. Spoon shovel\n3.1.9. Butting board\n3.1.10. Ball-peen hammer\n3.1.11. Ruler (wood, folding)\n3.1.12. Pliers\n3.1.13. Auger bit\n3.1.14. Working sign boards\n3.1.15. Bolt cutter\n3.2 Equipment\n3.2.1. Trailer\n3.2.2. Line truck\n3.2.3. Boom truck or derrick truck/Auger truck\n3.2.4. Wench\n3.2.5. Binder\n3.2.6. Ratchet\n3.3 Hardware/materials\n3.3.1. Ground wire\n3.3.2. Ground wire staple\n3.3.3. Butt plate/Ground rods\n3.3.4. Pole\n3.3.4.1. Wood pole (creosoted & tanalized)\n3.3.4.2. Steel pole\n3.3.4.3. Concrete pole\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 45\nVARIABLE\nRANGE\n4. safety requirements\nMay include but are not limited to:\n4.1 Length and class of the pole is established.\n4.2 Poles are securely fastened.\n4.3 Warning devices are installed.\n4.4 Appropriate PPEs are used.\n4.5 Manpower and equipment requirements are identified\n\n5. construction\nspecifications\n5.1 specifications for 13.2 / 7.62 KV line construction\n5.2 specifications for 34.5 / 20 KV line construction\n5.3 specifications for other distribution utilities\n\n6. Pole setting/ erection\nprocedure\n6.1 Determine depth of hole\n6.2 Determine pole facing\n\n7. Job requirements\n7.1 staking sheets\n7.2 construction specifications\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 46\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates knowledge of different pole erection\nmethods\n1.2 Demonstrates ability to identify and follow occupational\nsafety and health standards for line workers\n1.3 Demonstrates ability to identify and use of distribution line\ntools, equipment and hardware\n1.4 Demonstrates ability to perform pole loading, pole hauling,\npole spotting, pole hole digging, pole grounding and pole\nsetting/erection\n1.5 Demonstrate ability to perform right of way clearing\n1.6 Demonstrates ability to communicate and work in a team\nenvironment\n\n2. Resource\nimplications\nThe following resources should be available:\n2.1 Tools, equipment, hardware and PPE (see range of variables)\n2.2 Site or work area\n2.3 Poles\n\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation with oral questioning\n3.2 Demonstration of skills with oral questioning\n3.3 Written test\n3.4 Third party report (Instructor/Trainor’s report)\n\n4. Context of\nassessment\n4.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 47\nUNIT OF COMPETENCY :\nCLIMB POLE AND INSTALL POLE ASSEMBLY AND\nCONDUCTORS\nUNIT CODE\n:"
