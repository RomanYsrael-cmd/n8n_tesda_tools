        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value (TLV).\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n\n4. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 16\nUNIT TITLE\n : ADDRESS GENERAL WORKPLACE PROBLEMS\nUNIT CODE\n:"
        },
        "source_text": "500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with\nregulatory and organizational requirements for occupational\nhealth and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nhazards and\nrisks\n1.1. Safety regulations and\nworkplace safety and hazard\ncontrol practices and\nprocedures are clarified and\nexplained based on\norganization procedures\n1.2. Hazards/risks in the\nworkplace and their\ncorresponding indicators are\nidentified to minimize or\neliminate risk to co-workers,\nworkplace and environment\nin accordance with\norganization procedures\n1.3. Contingency measures\nduring workplace accidents,\nfire and other emergencies\nare recognized and\nestablished in accordance\nwith organization procedures\n1.1 OHS procedures\nand practices and\nregulations\n1.2 Hazards/risks\nidentification and\ncontrol\n1.3 OHS indicators\n1.4 Organizational\ncontingency\npractices\n\n1.1 Hazards/risks\nidentification and\ncontrol skills\n1.2 Practice of\nsafety and\nhealth\nprocedures and\npersonal\nhygiene\n\n2. Evaluate\nhazards and\nrisks\n2.1. Terms of maximum tolerable\nlimits which when exceeded\nwill result in harm or damage\nare identified based on\nthreshold limit values (TLV)\n2.2. Effects of the hazards are\ndetermined\n2.3. OHS issues and/or\nconcerns and identified\nsafety hazards are reported\nto designated personnel in\naccordance with workplace\nrequirements and relevant\nworkplace OHS legislation\n2.1 Threshold Limit\nValue (TLV)\n2.2 Effects of safety\nhazards\n\n2.1 Communication\nskills\n2.2 Reporting safety\nhazards\n3. Control\nhazards and\nrisks\n3.1. Occupational Health and\nSafety (OHS) procedures for\ncontrolling hazards/risks in\nworkplace are consistently\nfollowed\n3.2. Procedures for dealing with\nworkplace accidents, fire and\nemergencies are followed in\naccordance with organization\nOHS policies\n\n3.1 Personal hygiene\npractices\n3.2 Organization\nsafety and health\nprotocol\n3.3 Company\nemergency\nprocedure\npractices\n3.1 Practice of\npersonal\nhygiene\n3.2 Respond to\nemergency\n\n--- PDF PAGE 16 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 12\n3.3. Personal protective\nequipment (PPE) is\ncorrectly used in accordance\nwith organization OHS\nprocedures and practices\n3.4. Appropriate assistance is\nprovided in the event of a\nworkplace emergency in\naccordance with established\norganization protocol\n4. Maintain\nOHS\nawareness\n4.1. Emergency-related drills\nand trainings are\nparticipated in as per\nestablished organization\nguidelines and procedures\n4.2. OHS personal records are\ncompleted and updated in\naccordance with workplace\nrequirements\n\n4.1 Workplace OHS\npersonal records\n4.2 Information on\nemergency-\nrelated drills\n4.1 Practice\nemergency-\nrelated drill\nskills in the\nworkplace\n\n--- PDF PAGE 17 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4 Electrical hazards – electrically energized equipment\nand conductors\n2.5 Ergonomics\n2.5.1 Psychological factors – over exertion/\nexcessive force, awkward/static positions,\nfatigue, direct pressure, varying metabolic\ncycles\n2.5.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 18 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 14\n\nVARIABLE\nRANGE\n\n5. Emergency-related drills\nand training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 19 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 15\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value (TLV).\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n\n4. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 16\nUNIT TITLE\n : ADDRESS GENERAL WORKPLACE PROBLEMS\nUNIT CODE\n:"
