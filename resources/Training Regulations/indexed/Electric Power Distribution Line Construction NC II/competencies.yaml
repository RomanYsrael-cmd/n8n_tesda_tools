        "source_text": "UTL311207\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to perform computer operations which include\ninputting, accessing, producing and transferring data using the\nappropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntask to be\nundertaken\n1.1. Requirements of task are\ndetermined\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned and\nrequired outcome\n1.3. Task is planned to ensure\nOH&S guidelines and\nprocedures are followed\n1.1. Main types of\ncomputers and\nbasic features of\ndifferent\noperating\nsystems\n1.2. Main parts of a\ncomputer\n1.3. Information on\nhardware and\nsoftware\n1.4. Data security\nguidelines\n1.1. Reading and\ncomprehension\nskills required to\ninterpret work\ninstruction and\nto interpret\nbasic user\nmanuals.\n1.2. Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow\ninstructions and\nreceive\nfeedback.\n1.3. Interpreting user\nmanuals and\nsecurity\nguidelines\n2. Input data\ninto\ncomputer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating procedures\n2.3. Inputted data are stored in\nstorage media according to\nrequirements\n2.4. Work is performed within\nergonomic guidelines\n2.1. Basic\nergonomics of\nkeyboard and\ncomputer user\n2.2. Storage devices\nand basic\ncategories of\nmemory\n2.3. Relevant types\nof software\n2.1. Technology\nskills to use\nequipment\nsafely including\nkeyboard skills.\n2.2. Entering data\n3. Access\ninformation\nusing\ncomputer\n3.1. Correct program/application is\nselected based on job\nrequirements\n3.2. Program/application containing\nthe information required is\naccessed according to\ncompany procedures\n3.3. Desktop icons are correctly\nselected, opened and closed\nfor navigation purposes\n3.1. General security,\nprivacy\nlegislation and\ncopyright\n3.2. Productivity\nApplication\n3.3. Business\nApplication\n3.1. Accessing\ninformation\n3.2. Searching and\nbrowsing files\nand data\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 39\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n3.4. Keyboard techniques are\ncarried out in line with OH&S\nrequirements for safe use of\nkeyboards\n4. Produce/\noutput data\nusing\ncomputer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as required\nusing computer\nhardware/peripheral devices in\naccordance with standard\noperating procedures\n4.3. Files, data are transferred\nbetween compatible systems\nusing computer software,\nhardware/ peripheral devices\nin accordance with standard\noperating procedures\n4.1. Computer\napplication in\nprinting,\nscanning and\nsending facsimile\n4.2. Types and\nfunction of\ncomputer\nperipheral\ndevices\n4.1. Computer data\nprocessing\n4.2. Printing of data\n4.3. Transferring\nfiles and data\n5. Maintain\ncomputer\nequipment\nand systems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of consumables\nare implemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with standard\noperating procedures\n5.3. Basic file maintenance\nprocedures are implemented in\nline with the standard\noperating procedures\n5.1. Computer\nequipment/\nsystem basic\nmaintenance\nprocedures\n5.2. Viruses\n5.3. OH & S\nprinciples and\nresponsibilities\n5.4. Calculating\ncomputer\ncapacity\n5.5. System Software\n5.6. Basic file\nmaintenance\nprocedures\n5.1. Removing\ncomputer\nviruses from\ninfected\nmachines\n5.2. Making backup\nfiles\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\nMay include:\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7. Mouse\n\n2. Software\nSoftware includes the following but not limited to:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n\n3. OH & S guidelines\n3.1. OHS guidelines\n3.2. Enterprise procedures\n\n4. Storage media\nStorage media include the following but not limited to:\n4.1. diskettes\n4.2. CDs\n4.3. zip disks\n4.4. hard disk drives, local and remote\n\n5. Ergonomic guidelines\nMay include:\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5. Visual display unit screen brightness\n\n6. Desktop icons\nIcons include the following but not limited to:\n6.1. directories/folders\n6.2. files\n6.3. network devices\n6.4. recycle bin\n\n7. Maintenance\nMay include:\n7.1. Creating more space in the hard disk\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 41\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly and\naccording to the task requirement\n1.2. Identified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3. Produced accurate and complete data in accordance\nwith the requirements\n1.4. Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5. Maintained computer system\n2. Resource implication\nThe following resources should be provided:\n2.1. Computer hardware with peripherals\n2.2. Appropriate software\n\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Questioning\n3.3. Practical demonstration\n4. Context of Assessment 4.1. Assessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 42\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : ERECT ELECTRIC DISTRIBUTION POLE\nUNIT CODE\n:"
