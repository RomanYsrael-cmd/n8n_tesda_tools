Safety and\nenvironmental\naspects of\nproduction\nprocesses\n2.2. Fault\nidentification\nand reporting\n2.3. Workplace\nprocedure in\ndocumenting\ncompleted\nwork\n2.4. Workplace\nQuality\nIndicators\n2.1. Carry out\nwork in\naccordance\nwith OHS\npolicies and\nprocedures\n\n--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 24\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Engage in\nquality\nimprovement\n3.1. Process improvement\nprocedures are participated in\nrelation to workplace\nassignment\n3.2. Work is carried out in\naccordance with process\nimprovement procedures\n3.3. Performance of operation or\nquality of product or service to\nensure customer satisfaction\nis monitored\n\n3.1. Quality\nimprovement\nprocesses\n3.2. Company\ncustomers\ndefined\n3.1. Solution\nproviding and\ndecision-\nmaking\n3.2. Practice\ncompany\nprocess\nimprovement\nprocedure\n\n--- PDF PAGE 29 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. Wires\n1.1.2. Cables\n1.1.3. Electrical tape, etc.\n1.2. Components may include but not limited to:\n1.2.1. Cross-arms and braces\n1.2.2. Conductors and accessories\n1.2.3. Insulators, etc.\n\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n\n4. Quality standards\n4.1. Quality standards may relate but not limited to the\nfollowing:\n4.1.1. Materials\n4.1.2. Component parts\n4.1.3. Final product\n\n5. Customer\n5.1. Co-worker\n5.2. Suppliers\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 26\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n\n2. Resource implication\n\nThe following resources should be provided:\n2.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Questioning\n3.3. Practical demonstration\n\n4. Context of Assessment\n\n4.1. Assessment may be conducted in the workplace\nor in a simulated work environment.\n\n--- PDF PAGE 31 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 27\nUNIT TITLE\n:\nCOMPLY WITH ENVIRONMENTAL PROTECTION\nPROCEDURES\nUNIT CODE\n:"
