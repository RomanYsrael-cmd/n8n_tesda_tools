        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Identified and monitored environmental hazards in\nthe workplace\n1.2 Implemented effective procedures for dealing with\nhazardous events\n1.3 Monitored workplace adherence to environmental\npractices\n1.4 Communicated effectively with the team members\n2. Resource implications\nThe following resources should be provided:\n2.1 Environmental protection regulations and guidelines\n2.2 OHS regulations and hazard prevention policies and\nprocedures\n2.3 workplace environmental protection policies,\nprocedures and instructions\n2.4 equipment/vehicle manufacturer’s operating and\nservicing instructions\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Oral or written questioning\n3.3 Questions/interview\nAssessment of underpinning knowledge and practical\nskills may be combined\n4. Context of assessment\n4.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n4.2 Assessment may be conducted in the workplace or a\nsimulated environment\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 32\n\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND\nMANUALS OF INSTRUCTIONS\nUNIT CODE :"
        },
        "source_text": "UTL311206\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nimplement and monitor environmental protection policies and\nprocedures including accessing relevant information\nconcerning environmental protection regulations and\nprocedures, and implementing and monitoring procedures\nconcerning environmental hazards, related control procedures,\nenvironmental training arrangements, and required records and\ndocumentation\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Access\ninformation\nconcerning\nenvironmental\nprotection\nregulations and\nprocedures\n\n1.1. Relevant provisions of\nenvironmental legislation\nand codes of practice are\naccurately followed\n1.2. Information on workplace\nenvironmental policies,\nprocedures and\nprograms is stored in a\nreadily accessible\nlocation and manner\n1.3. Information is accurately\nand clearly explained to\nthe work team and\nupdated according to\nchange in workplace\npolicy\n1.4. Information about the\noutcomes of\nenvironmental risk\nidentification and control\nprocedures is provided to\nthe appropriate\npersonnel\n1.1. Relevant\nenvironmental\nprotection\nregulations &\ncodes of practice\n1.2. Environmental\nrisks associated\nwith workplace\noperations and\nrelated\nprecautions to\ncontrol the risk\n1.3. Environmental\nprotection\nstandards\nrequired in the\nworkplace\n1.1. Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n1.2. Communication\nskills\n1.3. Accessing\ninformation and\ndata\n1.4. Ability to recognize\npotential\nenvironmental\nrisks and ways of\nminimizing them\n2. Implement and\nmonitor\nprocedures\nconcerning\nenvironmental\nhazards\n2.1 Existing and potential\nenvironmental hazards\nin the workplace are\nidentified and reported\n2.2 Identified hazards are\nassessed in relation to\nrelevant environmental\nprotection policies\n2.3 Workplace procedures\nfor dealing with\nhazardous events are\nimplemented wherever\nnecessary to ensure that\nprompt control action is\ntaken\n2.4 Personal protective\nequipment (PPE) are\n2.1 Relevant\nenvironmental\nprotection\nregulations &\ncodes of\npractice\n2.2 Workplace\nprocedures and\nguidelines for\nimplementing\nand monitoring\nprocedures\nconcerning\nenvironmental\nhazards\n2.3 Workplace\nenvironmental\n2.1 Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n2.2 Communication\nskills\n2.3 Problem solving\nskills\n2.4 Ability to:\n2.5 recognize\npotential\nenvironmental\nhazards and ways\nof minimizing them\n2.6 counsel, advise\nand inform others\n\n--- PDF PAGE 32 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 28\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nobtained and used in\naccordance with job\nrequirements\n2.5 Hazardous events are\ninvestigated to identify\ncauses, and control\nmeasures are\nimplemented to prevent\nrecurrence and minimize\nrisks of such events\nhazards and\nrelated hazard\ncontrol\nmeasures\n2.4 Equipment and\nresources\nrequired when\nimplementing\nand monitoring\nenvironmental\nprotection\nprocedures\n2.5 Organizational\nstructure and\nsite layout\non environmental\nprotection matters\n2.7 identify and\ncorrectly use\nequipment and\nvehicles in\naccordance with\nenvironmental\nprotection\nregulations and\nguidelines\n3. Implement and\nmonitor\nenvironmental\ncontrol\nprocedures\n3.1 Existing environmental\nprotection measures are\nimplemented, monitored\nand reviewed\n3.2 Work procedures to\nprotect environment are\nimplemented and\nadherence to them by\nthe work group is\nmonitored\n3.3 Required improvements\nto existing control\nmeasures are identified,\nincluding required\nresources for\nimplementation, and\nreported to appropriate\npersonnel\n3.1 Relevant\nenvironmental\nprotection\nregulations &\ncodes of practice\n3.2 Workplace\nprocedures and\nguidelines for\nimplementing\nand monitoring\nenvironmental\ncontrol\nprocedures\n3.3 Equipment and\nresources\nrequired when\nimplementing\nand monitoring\nenvironmental\ncontrol\nprocedures\n3.4 Organizational\nstructure and\nsite layout\n3.1 Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n3.2 Communication\nskills\n3.3 Accessing\ninformation and\ndata\n3.4 Problem solving\nskills\n3.5 Ability to counsel,\nadvise and inform\nothers on\nenvironmental\ncontrol procedures\n3.6 Ability to identify\nand correctly use\nequipment and\nvehicles in\naccordance with\nenvironmental\ncontrol\nprocedures,\nregulations and\nguidelines\n\n--- PDF PAGE 33 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Environment\n\nEnvironment may include:\n1.1\nIndoor\n1.2\nOutdoor\n1.3\nMarine\n1.4\nAtmospheric\n\n2 Information\nInformation/documents may include:\n2.1 Workplace procedures and practices related to\nenvironmental protection, including all financial,\noperating and customer service policies and\nprocedures\n2.2 OHS and environmental protection regulations\n2.3 Workplace housekeeping procedures and policies\n2.4 Code of practice for environmental protection\n2.5 Material safety data sheets\n2.6 Policies and procedures for entry and work in confined\nspaces\n2.7 Manufacturer’s instructions concerning the use and\nservicing of equipment\n2.8 Emergency procedures\n2.9 Regulations and policies concerning noise, waste\ndisposal/reprocessing, handling of dangerous\ngoods/hazardous substances and other\nenvironmental protection issues\n2.10 Standards and certification requirements\n2.11 Quality assurance procedures\n\n3 Appropriate personnel\nAppropriate personnel may include:\n3.1 Workplace personnel including supervisors and\nmanagement\n3.2 Site visitors\n3.3 Contractors\n3.4 Official representatives\n\n4 Environmental hazards\nEnvironmental hazards may include:\n4.1 Oils and lubricants\n4.2 Exhaust fumes\n4.3 Gas\n4.4 Smoke\n4.5 Chemicals and detergents\n4.6 Rubbish\n4.7 Noise\n4.8 Wastes\n\n--- PDF PAGE 34 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 30\nVARIABLE\nRANGE\n5 Workplace procedures for\ndealing with hazardous\nevents\nProcedures may include:\n5.1 Inspection and housekeeping\n5.2 Maintenance including plant and equipment\n5.3 Purchasing\n5.4 Evacuation\n5.5 Hazardous substance containment\n5.6 Operational instruction\n5.7 Environmental information including incident and\nmanagement practices\n5.8 Specific hazardous materials policies and procedures\n5.9 Risk assessment and control\n5.10 First aid\n\n6 Personal protective\nequipment (PPE)\nPPE may include:\n6.1 Gloves\n6.2 Safety headwear and footwear\n6.3 Safety glasses\n6.4 Two-way radios\n6.5 High visibility clothing\n\n--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 31\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Identified and monitored environmental hazards in\nthe workplace\n1.2 Implemented effective procedures for dealing with\nhazardous events\n1.3