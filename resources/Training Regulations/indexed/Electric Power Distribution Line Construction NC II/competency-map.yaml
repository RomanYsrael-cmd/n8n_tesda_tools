  "source_text": "Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2 The Qualification of Electric Power Distribution Line Construction NC II can\nbe attained by demonstration of competence through project-type\nassessment covering all the units required.\n\n4.1.3 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduate of formal or non-formal training in distribution line\ninstallation/construction and maintenance or related course;\n\n4.1.4.2 Worker with at least 1-year relevant experience in distribution line\ninstallation/construction and maintenance, within the last 5 years.\n\nThe candidate must provide evidence that he/she is physically fit through a\nmedical certificate issued within the last six (6) months prior to assessment.\n\n4.1.5 The existing NCs in Electric Power Distribution Line Construction NC II\nshall be in effect until the said NCs have expired. The NCs in this\nqualification maybe renewed under this amended/updated TR if the NC\nholders present evidence that they are currently or have been employed in\nelectric power distribution line works for at least two (2) years within the last\nfive (5) years.\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Competency Assessment\nand Certification System (PTCACS)\".\n\n--- PDF PAGE 88 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 84\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 89 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 85\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n--- PDF PAGE 90 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 86\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an\nindividual’s skills, knowledge and attitudes gained from life and work experiences\noutside registered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for\nwork\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 91 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 87\nSPECIFIC\n\n1. Anchor - A device that supports and holds in place conductors when they are\nterminated at a pole or structure. The anchor is buried and attached to the pole by\nway of guy wire to counteract the mechanical forces of these conductors.\n\n2. Armor - An outer metal layer applied to a cable for mechanical protection. Armor is\ncomprised of factory formed wire, designed to be applied to a range of conductor sizes.\n\n3. Armor Rod - An outer metal layer applied to a cable for mechanical protection. Armor\nRods are comprised of factory formed wire, designed to be applied to a range of\nconductor sizes.\n\n4. Baker Board - A platform used to work above the ground on a wood pole.\n\n5. Block and tackle - an apparatus of pulley blocks and ropes or cables used for\nhauling and hoisting heavy objects.\n\n6. Cable - A term generally applied to the larger sizes of bare or weatherproofed\n(covered) and insulated conductors. It is also applied to describe a number of\ninsulated conductors twisted or grouped together.\n\n7. Cable Pulling Lubricant - A chemical compound used to reduce pulling tension by\nlubricating a cable when pulled into a duct or conduit.\n\n8. Climbers - Hooks for climbing poles that are attached to a line worker's boots.\n\n9. Cum-a-long - A wire grip for holding a conductor or strand under tension.\n\n10. Conductor - 1) a wire or combination of wires suitable for carrying an electrical\ncurrent. Conductors may be insulated or bare. 2) any material that allows electrons to\nflow through it.\n\n11. Connector - A conductive coupling device used to connect conductors together.\n\n12. Cross-arm - A wooden/steel support attached to a pole that holds wire and\ninsulators.\n\n13. Cut-out - A transformer fuse so named because when the fuse is removed the circuit\nopens.\n\n14. Digger-derrick - A type electric utility line truck that digs holes and sets poles.\n\n15. Distribution System - A term used to describe that part of an electric power system\nthat distributes the electricity to consumers from a bulk power location such as a\nsubstation. It includes distribution line, line equipment and power substation.\n\n16. Distribution Transformer - A line equipment that reduces voltage from the supply\nlines for direct connection to operate consumer devices.\n\n17. Distribution Voltage - A nominal operating voltage below 69 kV.\n\n--- PDF PAGE 92 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 88\n\n18. Double Arming Bolt - A special long bolt used to assemble two cross arms, one on\neach side of the pole.\n\n19. Electrical Hazard - A dangerous condition such that contact or equipment failure can\nresult in electric shock, arc flash burn, thermal burn, or blast.\n\n20. Electric meter or energy meter is a device that measures the amount of electrical\nenergy consumed by a residence, business, or an electrically-powered device.\nElectric meters are typically calibrated in billing units, the most common one being the\nkilowatt hour.\n\n21. Electrical Safety - Recognizing hazards associated with the use of electrical energy\nand taking precautions so that hazards do not cause injury or death.\n\n22. Electrically Safe Work Condition - A state in which the conductor or circuit part to\nbe worked on or near has been disconnected from energized parts, locked/tagged in\naccordance with established standards, tested to ensure the absence of voltage, and\ngrounded if determined necessary.\n\n23. Grip All Stick - See Shotgun Stick.\n\n24. Groundman - a person working at ground level in support of a line worker working\nabove.\n\n25. Guy - a rope, cord, or wire used to steady, guide, or secure something.\n\n26. Guy-wire or guy-rope is a tensioned cable designed to add stability to structures\n(frequently ship masts, radio masts, wind turbines, utility poles, and tents). One end\nof the cable is attached to the structure, and the other is anchored to the ground at a\ndistance from the structure's base. This allows the tension of each guy-wire to offset\nthe others.\n\n27. Hotstick - An insulated stick usually made of fiberglass that is used to work\nenergized overhead conductors and operate electrical equipment that is overhead,\nunderground and pad mounted.\n\n28. Insulator - a device that is used to electrically isolate a conductor or electrical device\nfrom ground or a different electrical potential. Insulators are broadly classified as\neither pin-type, which support the conductor above the structure, or suspension type,\nwhere the conductor hangs below the structure. Insulators are usually made of wet-\nprocess porcelain or toughened glass, with increasing use of glass-reinforced\npolymer insulators.\n\n29. Jumper - An electrical connection between two points.\n\n30. Kilowatt - 1000 watts of real power. Expressed at kW.\n\n31. Kilowatt Hour - The use of one thousand watts for one hour.\n\n32. Line - refers to the conductor in an overhead or underground distribution or\ndistribution line.\n\n--- PDF PAGE 93 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 89\n33. Line worker - a person whose duties include climbing wood poles or steel structures\nto perform work on electric power distribution line construction.\n\n34. Personal Protective Equipment (PPE) - The term shall include, but is not limited to,\ndevices designed to be worn by workers for eye, face, head, respiratory, hand, arm,\nbody, leg, foot, and fall protection.\n\n35. Pole pike - a device with a sharp metal point in one end that is used to hold utility\npoles upright while they are being erected.\n\n36. Right-of-way - A strip of land owned by another party on which a utility places poles,\nwires, substations, and other facilities.\n\n37. Service Drop - an electrical line running from a utility pole to a customer's building or\nother premises. It is the point where electric utilities provide power to their customers.\n\n38. Service Entrance Cable - The conductors that connect the service conductors (drop\nor lateral) to the service equipment of the building.\n\n39. Shotgun Stick - A specialized hot stick that allows the capture of certain types of\nclamps and devices in its hook. It is also called a \"Grip All\" stick.\n\n40. Stringing - The act of installing overhead electrical wire or conductor.\n\n41. Tag Line - A rope used to control the position of equipment being lifted. This is not to\nbe confused with the rope used to actually lift the equipment.\n\n42. Tension - The force in pounds of kilograms on a conductor installed overhead. Too\nmuch tension on an overhead line can contribute to mechanical failure.\n\n--- PDF PAGE 94 ---\nANNEX A\nUTILITIES SECTOR COMPETENCY MAP\n\nELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II\n\nBASIC COMPETENCIES\n\nReceive and Respond to\nWorkplace Communication\nWork with Others\nDemonstrate work values\nPractice basic\nhousekeeping procedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Working\nTeams\nDevelop and Practice\nNegotiating Skills With\nTeam Members\nGuide Effective Solutions\nto Problems Arising from\nWork Activities\nCheck and Develop the\nUse of Mathematical\nConcepts & Techniques\nUse Relevant Technologies\nApplicable to Assigned\nWork\nLead in Utilizing Specialized\nCommunication Skills\nAssist in Developing\nTeam and Individuals\nApply Problem Solving\nTechniques in the\nWorkplace\nCollect, analyze and\norganize information\nPlan and Organize Work\nfor Several Working\nTeams\nPromote Environmental\nProtection\n\nCOMMON COMPETENCIES\n\nApply quality standards\nComply with environmental protection\nprocedures\nObserve procedures,\nspecifications and manual of\ninstruction\nOperate and maintain tools and\nequipment\nOperate a personal computer\n\nCORE COMPETENCIES\n\nTender Diesel Engine\nOperate Diesel Power\nplant\nMaintain and Repair\nDiesel Engine Systems\nand Alternator\nService Alternator/\nGenerator\nDiagnose and Repair Diesel\nEngine\nDiagnose and Repair Electrical\nSystem\nOverhaul Diesel Engine\nPerform transmission\nline pole erection\nPerform overhead\ntransmission line work\nPerform cold-line\nmaintenance work\nPerform live-line\nmaintenance work\nPerform ground line\nmaintenance work\nPlan transmission line\nmaintenance job\nInstall emergency\nrestoration structure\n(ERS)\nInspect/Assess\ntransmission line\ncomponents’ conditions\nImplement transmission\nline maintenance works\nInspect transmission line,\npoles, towers and\nappurtenances\nErect distribution line poles\nClimb pole and install pole\nassembly/conductors\nInstall distribution line\nequipment and devices\n\nInstall consumer service\nconnection facility\nConduct initial root\ncause analysis\nPerform ground\ntransmission line works\nPerform overhead\nmaintenance works\nInstall/construct new\ntransmission line structures\nPerform overhead\ntransmission line works\nInstall emergency restoration\nstructure (ERS)\nPerform earth ground\nresistance testing\n\nPlan assigned\nmaintenance work\nSupervise transmission\nline maintenance work\n\nErect electric\ndistribution pole\nInstall single-phase\ndistribution line\nequipment and devices\nClimb pole and install pole\ntop assembly and\nconductors\nInstall single-phase\nconsumer service\nconnection facility\nReplace electric\ndistribution pole, pole top\nassembly and conductors\nInstall/Replace three-\nphase distribution line\nequipment and devices\nInstall/Replace three-\nphase consumer service\nconnection facility\nConduct vegetation\nclearing along distribution\nsystem\nPerform onsite assessment\nand testing of installed\nelectric distribution line\nequipment and devices\nTroubleshoot faults and\nimplement solution on\nelectric power distribution\nsystem\nSupervise operation and\nmaintenance on electric power\ndistribution system\n\n--- PDF PAGE 95 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 91\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Electric Power Distribution Line Construction NC II\nQualification Code: UTLEPD218\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nElectric Power Distribution\nLine Construction NC II\n\nNot Applicable\nTB No. 2010-15/\nNovember 25, 2010\nNot Applicable\n01\nDocument Amended –\nElectric Power Distribution\nLine Construction NC II\n\nTB No. 2010-15/\nNovember 25, 2010\nTB No. 2018-13/\nJune 27, 2018\nTESDA Circular\nNo. __ s. 2018\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE