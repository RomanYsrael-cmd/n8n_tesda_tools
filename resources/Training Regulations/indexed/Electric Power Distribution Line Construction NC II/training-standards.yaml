rements for the various teaching/learning areas are\nas follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS (M)\nAREA IN\nSQ. M\nQTY\nTOTAL AREA\nIN SQ. M\nLecture Area\n6 x 8\n48\n1\n48\n\nTraining Area (Field-based)\n\n20 X 40\n800\n1\n800\nLearning Resource Area\n\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n\n3 x 5\n15\n1\n15\nTotal\n\n903\nFacilities / Equipment / Circulation*\n\n271\n Total Area\n\n1,174\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.5\nTRAINERS QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer Certificate (NTTC) level I in\nElectric Power Distribution Line Construction NCII\n• Must have at least three (3) years supervisory experience in distribution line\nworks within the last 10 years, e.g. Line Supervisor/Lead Lineworker\n• Must have completed the Basic Occupational Safety and Health (BOSH)\nCourse and/or related Electrical Safety Training conducted by OSHC and\nDOLE accredited Safety Training Organizations\n• Must be physically fit\n\n3.6\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for\n\neach unit of competency.\n\nThe result of the institutional assessment may be considered as evidence\nfor the assessment for national certification.\n\n--- PDF PAGE 87 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 83"
