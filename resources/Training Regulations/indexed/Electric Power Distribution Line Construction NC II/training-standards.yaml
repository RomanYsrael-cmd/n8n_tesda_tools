    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Electric Power Distribution Line Construction NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II\n\nNominal Training Duration:\n 40 hrs – Basic Competencies\n\n 60 hrs – Common Competencies\n 236 hrs – Core Competencies\n\n---------------\n 336 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills and attitudes of\na distribution construction line worker in accordance with industry standards. It covers the\nbasic and common competencies in addition to the core competencies such as to erect\ndistribution pole, install single –phase distribution line equipment and devices, Climb pole\nand install pole assembly/conductors, as well as to install single-phase consumer service\nconnection facility. Line construction involves work on non-energized lines, particularly\nconstruction/ extension of new electric power distribution lines.\n\nThe nominal duration of 336 hours covers the required units at Electric Power\nDistribution Line Construction NC II. TVET providers can however, offer a longer,\nladderized course covering the NC II basic, common and core units.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 66 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 62\nBASIC COMPETENCIES\n(40 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n1.1.1. Describe Organizational policies\n1.1.2. Read:\n1.1.2.1. Effective communication\n1.1.2.2. Written communication\n1.1.2.3. Communication procedures and\nsystems\n1.1.3. Identify:\n1.1.3.1. Different modes of communication\n1.1.3.2. Medium of communication\n1.1.3.3. Flow of communication\n1.1.3.4. Available technology relevant to\nthe enterprise and the individual’s\nwork responsibilities\n1.1.4. Prepare different Types of question\n1.1.5. Gather different sources of information\n1.1.6. Apply storage system in establishing\nworkplace information\n1.1.7. Demonstrate Telephone courtesy\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.2. Complete relevant\nwork related\ndocuments\n1.2.1. Describe Communication procedures and\nsystems\n1.2.2. Read:\n1.2.2.1. Meeting protocols\n1.2.2.2. Nature of workplace meetings\n1.2.2.3. Workplace interactions\n1.2.2.4. Barriers of communication\n1.2.3. Read instructions on work related forms/\ndocuments\n1.2.4. Practice:\n1.2.4.1. Estimate, calculate and record\nroutine workplace measures\n1.2.5. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role play\n\n• Oral evaluation\n• Written\nexamination\n• Observation\n\n2 hours\n\n--- PDF PAGE 67 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 63\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.2.6. Demonstrate office activities in:\n1.2.6.1. workplace meetings and\ndiscussions scenario\n1.2.7. Perform workplace duties scenario\nfollowing simple written notices\n1.2.8. Follow simple spoken language\n1.2.9. Identify the different Non-verbal\ncommunication\n1.2.10. Demonstrate ability to relate to people of\nsocial range in the workplace\n1.2.11. Gather and provide information in\nresponse to workplace requirements\n1.2.12. Complete work related documents\n\n1.3. Participate in\nworkplace meeting\nand discussion\n1.3.1. Identify:\n1.3.1.1. types of workplace documents\nand forms\n1.3.1.2. kinds of workplace report\n1.3.1.3. Available technology relevant to\nthe enterprise and the individual’s\nwork responsibilities\n1.3.2. Read and follow instructions in applying\nbasic mathematical concepts\n1.3.3. Follow simple spoken language\n1.3.4. Demonstrate ability to relate to people of\nsocial range in the workplace\n1.3.5. Gather and provide information in\nresponse to workplace requirements\n• Lecture\n• Demonstration\n• Written\nexamination\n• Observation\n2 hours\n2. Work in a team\nenvironment\n2.1. Describe and\nidentify team role\nand responsibility in\na team.\n2.1.1. Describe the team role and scope\n2.1.2. Read and Definition of Team\n2.1.3. Difference between team and group\n2.1.4. Objectives and goals of team\n2.1.5. Identify different sources of information\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written\nexamination\n2 hours\n2.2.