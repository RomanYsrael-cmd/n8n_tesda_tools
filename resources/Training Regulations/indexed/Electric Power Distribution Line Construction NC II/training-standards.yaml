    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II\n\nNominal Training Duration:\n 40 hrs – Basic Competencies\n\n 60 hrs – Common Competencies\n 236 hrs – Core Competencies\n\n---------------\n 336 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills and attitudes of\na distribution construction line worker in accordance with industry standards. It covers the\nbasic and common competencies in addition to the core competencies such as to erect\ndistribution pole, install single –phase distribution line equipment and devices, Climb pole\nand install pole assembly/conductors, as well as to install single-phase consumer service\nconnection facility. Line construction involves work on non-energized lines, particularly\nconstruction/ extension of new electric power distribution lines.\n\nThe nominal duration of 336 hours covers the required units at Electric Power\nDistribution Line Construction NC II. TVET providers can however, offer a longer,\nladderized course covering the NC II basic, common and core units.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 66 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revisi