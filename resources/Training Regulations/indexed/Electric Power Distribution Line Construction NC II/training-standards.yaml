on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified\nby\nthe\nindustry.\n\nThe\nfollowing\ntraining\nmodalities\nand\ntheir\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Implementing Rules and Regulations of the DTS Law\nand the TESDA Guidelines on the DTP;\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Enterprise-based Training- where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 84 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 80\n3.2\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the\nfollowing requirements:\n\n•\nMust have completed at least 10 yrs. basic education or an alternative\nlearning systems (ALS) certificate of achievement with grade 10\nequivalent holder\n•\nAble to communicate both oral and/or written\n•\nMust be physically and mentally fit to undergo training e.g. no fear of\nworking in height\n\nThis list does not include specific institutional requirements, such as height and\nage requirements, educational attainment, appropriate work experience and others that\nmay be required from the trainees by the school or training center delivering the TVET\nprogram.\n\n3.3\nLIST OF TOOLS, EQUIPMENT AND MATERIALS (Institution-based)\n\nMinimum list of tools, equipment and materials required for a group of 25 trainees\nfor ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II:\n\nTOOLS\nEQUIPMENT\nQTY\nUNIT\nITEM\nQTY UNIT\nITEM\n4\nunits\nOrdinary shovel\n8\nsets\nPole climbing equipment\n4\nunits\nSpoon shovel, 7 ft\n4\nunits\nHole digger 6’ or 8’\n4\nunits\nStraight shovel, 7 ft.\n2\nunits\nTelescopic ladder\n4\nunits\nDigging/tamping bar, 8’, forge steel\n4\nsets.\nKWH meter, 1 10 (30)A, bottom\nconnection\n8\nunits\nPole pike, assorted size\n4\nunits\nDX transformer, 10 KVA\n4\nsets\nPole Jenny (salagunting), 14 ft.\n1\nunit\nBoom truck (with auger & man lift),\nif needed\n4\nsets\nPole Jenny (salagunting), 18 ft.\n1\nunit\nLine truck (only during actual line\nconstruction, if needed)\n4\nunits\nButting board (1”x6”x7” wood or\nsteel)\n1\nunit\nBlock and tackle, single, 5”, 3/8”\nMSL 227 kg.\n1\nunit\nCant hook\n1\nunit\nDouble block, 5”, 3/8”, MSL 338 kg.\n4\nunits\nBolt cutter, 24” or 36”\n1\nunit\nStringing roller & block, brass steel\n4\nunits\neach\nAuger bit, ¾”, 5/8” and 11/16”\n\nPersonal P