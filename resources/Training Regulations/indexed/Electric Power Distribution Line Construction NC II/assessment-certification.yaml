      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 The National Qualification of ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II shall be obtained when a candidate demonstrate competence in all units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The Qualification of Electric Power Distribution Line Construction NC II can be attained by demonstration of competence through project-type assessment covering all the units required. 4.1.3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4 Any of the following are qualified to apply for assessment and certification: 4.1.4.1 Graduate of formal or non-formal training in distribution line installation/construction and maintenance or related course; 4.1.4.2 Worker with at least 1-year relevant experience in distribution line installation/construction and maintenance, within the last 5 years. The candidate must provide evidence that he/she is physically fit through a medical certificate issued within the last six (6) months prior to assessment. 4.1.5 The existing NCs in Electric Power Distribution Line Construction NC II shall be in effect until the said NCs have expired. The NCs in this qualification maybe renewed under this amended/updated TR if the NC holders present evidence that they are currently or have been employed in electric power distribution line works for at least two (2) years within the last five (5) years. 4.1.6 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\". Electric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 84"
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. Electric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 85"
    }
  ],
  "source_text": "SECTION 4: ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n Competency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\n NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The National Qualification of ELECTRIC POWER DISTRIBUTION LINE\nCONSTRUCTION NC II shall be obtained when a candidate demonstrate\ncompetence in all units of competency listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2 The Qualification of Electric Power Distribution Line Construction NC II can\nbe attained by demonstration of competence through project-type\nassessment covering all the units required.\n\n4.1.3 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduate of formal or non-formal training in distribution line\ninstallation/construction and maintenance or related course;\n\n4.1.4.2 Worker with at least 1-year relevant experience in distribution line\ninstallation/construction and maintenance, within the last 5 years.\n\nThe candidate must provide evidence that he/she is physically fit through a\nmedical certificate issued within the last six (6) months prior to assessment.\n\n4.1.5 The existing NCs in Electric Power Distribution Line Construction NC II\nshall be in effect until the said NCs have expired. The NCs in this\nqualification maybe renewed under this amended/updated TR if the NC\nholders present evidence that they are currently or have been employed in\nelectric power distribution line works for at least two (2) years within the last\nfive (5) years.\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Competency Assessment\nand Certification System (PTCACS)\".\n\n--- PDF PAGE 88 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 84\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 89 ---\n------------------------------------------------------------------------------------------------------------ ------------------------------------------------------------------------\nElectric Power Distribution Line Construction NC II Revision 01 Promulgated 06/27/2018 85\n"
