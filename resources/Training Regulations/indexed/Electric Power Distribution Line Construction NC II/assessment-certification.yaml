      "number": "4.1",
      "text": "1 The National Qualification of ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II shall be obtained when a candidate demonstrate competence in all units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2 The Qualification of Electric Power Distribution Line Construction NC II can be attained by demonstration of competence through project-type assessment covering all the units required."
    },
    {
      "number": "4.1",
      "text": "3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "number": "4.1",
      "text": "4 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "4.1 Graduate of formal or non-formal training in distribution line installation/construction and maintenance or related course;"
    },
    {
      "number": "4.1",
      "text": "4.2 Worker with at least 1-year relevant experience in distribution line installation/construction and maintenance, within the last 5 years. The candidate must provide evidence that he/she is physically fit through a medical certificate issued within the last six (6) months prior to assessment."
    },
    {
      "number": "4.1",
