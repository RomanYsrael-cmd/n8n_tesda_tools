  "source_section_text": "Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2 Individual:\naspiring\nto\nbe\nawarded\nthe\nqualification\nof\nAutomotive\nBody\nPainting/Finishing NC III must acquire Certificates of Competency in all the following core\nunits of the Qualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1.1 Apply Solid Color Paints\n Prepare Undamaged Surface for Painting\n Apply and Remove Masking\n Spray Solid Color Paints\n Perform Polishing\n\n4.2.1.2 Apply Metallic Color Paints\n Assess Auto Paint Jobs\n Prepare Damaged Surface for Painting\n Apply and Remove Masking\n Perform Solid/Metallic Color Mixing\n Spray Metallic Color Paint\n Perform Polishing\n\n4.2.1.3 Repair Solid Color Paints\n Assess Auto Paint Jobs\n Prepare Damaged Surface for Painting\n Apply and Removed Masking\n Perform Solid/Metallic Color Mixing\n Repair Solid Color Paint\n Perform Polishing\n\n4.2.1.4 Perform Repair on Metallic Color Paints\n Repair Two-Stage Metallic Color Paints\n\n4.2.1.5 Apply Pearl or Mica Color Paints\n Perform Pearl Color Matching\n Spray Pearl or Mica Color Paints\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of competency\ncomprising a qualification, an individual shall be issued the corresponding National\nCertificate.\n\n--- PDF PAGE 65 ---\nTR-Automotive Body Painting/Finishing NC III\n- 61 -\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures\nManual on Assessment and Certification” and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTOQCS)”.\n\n--- PDF PAGE 66 ---\nTR-Automotive Body Painting/Finishing NC III\n- 62 -\n\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nService electronic\ndrive management\nsystem\n\nPerforms gas\nengine tune up\nPerform diesel\nengine tune up\nService\nautomotive\nbattery\nService ignition\nsystem\nTest & repair\nwiring/lighting\nsystem\nPerform under-\nchassis preventive\nmaintenance\nService starting\nsystem\nService charging\nsystem\nService engine\nmechanical\nsystem\nService clutch\nsystem\nService differential\n& front/rear axle\nService steering\nsystem\nService brake\nsystem\nService\nsuspension\nsystem\nTest & repair\nelectrical security\nsystem/components\nService electronic\nengine\nmanagement system\nService\nautomatic\ntransmission\nOverhaul engines\n& associated\ncomponents\nPerform maintenance\nservice check up\n& repair to AC\nInstall auto\nAC system\nService AC\ncompressor &\nassociated component\nOverhaul manual\ntransmission\nService electronics\nbody management\nsystem\nService diesel engine\nmanagement system\n& component\nService diesel fuel\ninjection system\ncomponents\nService emission\ncontrol system\nPrepare vehicle\nbody for repair\nRepair body\npanel\nReplace damaged\npanel/parts with pre-\nfabricated panel\nDisassemble engine\nsub-assemblies/\ncylinder head &\ncheck components\nDisassemble engine\nblock & sub-assemblies,\ncheck tolerances &\ncomponents\nSet, operate &\nmonitor specialized\nmachine\nUse and maintain\nmeasuring\ninstruments\nCarry out pre-\nrepair operation on\nengine components\nInspect engine\ncomponents &\ndetermined preferred\naction\nCarry out\nmachining\noperations\nAssemble engine sub-\nassemblies/ cylinder\nheads and check\ncomponents\nAssemble engine\nblock & sub-assemblies,\ncheck tolerances\n& components\nInterpret technical\nmanual specification\nof engine components\nAssess auto\npaint jobs\nPrepare\nundamaged\nsurface for painting\nPrepare damaged\nsurface for\n painting\nApply and remove\nmasking\nPerform Polishing\nPerform solid/\nmetallic color\nmixing\nSpray metallic\ncolor paint\nSpray solid\ncolor paints\nRepair solid\ncolor paints\nRepair two-stage\nmetallic color paint\nC\nO\nM\nM\nO\nN\nPerform\nmensuration and\ncalculation\nMove and\nposition vehicle\nApply appropriate\nsealant/adhesive\nUse and apply\nlubricant/ coolant\nRead, interpret and\napply specification\nand manuals\nInterpret/draw\ntechnical drawing\nPrepare job\nestimate/ costing\nPerform shop\nmaintenance\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\nand individual\nSolve\nproblems related\nto work activities\nWork with Other\nLead small team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nB\nA\nS\nI\nC\nAutomotive Body Painting/Finishing NC III\nLegend:\nPerform pearl\ncolor matching\nSpray three-stage\npearl or mica\ncolor paint\nC\nO\nR\nE\nC\nO\nM\nP\nE\nT\nE\nN\nC\nI\nE\nS\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nPromote\nenvironmental\nprotection\nCollect, analyze and\norganize information\n\n--- PDF PAGE 67 ---\nTR-Automotive Body Painting/Finishing NC III\n- 63 -\nDEFINITION OF TERMS\n\n1. Basecoat\nThe foundation paint layer of the basecoat / clearcoat automotive\nfinish. Specifically the layer of densely pigmented paint (color)\napplied over the primer coat.\n2. D.A. Polisher/\nSander\nDual Action rotates with a double elliptical movement\n3. Degreasing\n\nThe removal from the substrate of contaminants which would\notherwise give rise to surface defects and performance failures.\ne.g. poor adhesion\n4. Drying\nThe process of change of a coating from the liquid to the solid\nstate by evaporation of solvent, chemical reaction of the binding\nmedium, or a combination of these processes. When drying takes\nplace during exposure to air at normal temperatures, it is called\n'air-drying'; if it can be accelerated by the application of a\nmoderate degree of heat it is called 'Force-drying' (or Low-bake),\nas distinct from High-bake.\nAlternate Term(s): Binder, Air-drying, Force-drying, Stoving, Low-\nbake, High-bake\n5. Fish Eye\nComplications which occur during repainting when paint is\nrepelled from a spot due to the presence of grease, oil or silicone\non the paint surface\n6. Flash-off Time\nDwell time for solvent to evaporate from the paint surface\n7. Masking\nTemporary covering of areas not to be painted\n8. Metallic Paint\nA type of automotive finish which contains metallic flakes that\nproduce a glittery appearance\nA term used for finishes incorporating fine metallic particles,\nusually aluminum, in the paint.\n9. Mica\n\nA naturally occurring mineral, based on silica, which after\ntreatment, is used as an effect pigment in coatings. Their special\nproperty is that light falling on a mica particle, depending on the\nangle of illumination, reflects the light with a change in colour.\nBecause of this they are sometimes referred to as pearls.\nAlternate Term(s): Pearl\n10. Mottling\nPaint color appears streaked, with light and dark areas. Cause,\nheavier film thickness in some areas that in others. Excessive\nwetting of some areas when painted. Uneven disbursement of the\nmetallic in the paint.\n11. Orange Peel\n\nThe nubby rough appearance of paint; looks much like the texture\nof an orange skin, surface lacks clarity or reflected image. Caused\nby paint applied too dry, resulting in poor flow-out.\n12. Overspray\nSubstance such as paint mist that settles out of the air onto\nautomobile surface appearing as tiny specks.\n13. Paint Film Thickness\n\nMeasure of the amount of paint on the vehicle. Also known as film\nbuilds, and is measured in millimeters or thousandths of an inch.\n14. Polishing\nTerm is often used to describe the action of using a machine to\nbuffer wheel a vehicle.\n\n--- PDF PAGE 68 ---\nTR-Automotive Body Painting/Finishing NC III\n- 64 -\n\n15. Primers\nMaterial applied to the surface to seal, fill scratches and improve\nadhesion of paint.\n16. Putty\nA plastic material with a high mineral filler content – used for filling\ndeep holes or wide gaps.\n17. Sanding\nAn abrasive process used to level a coated surface prior to the\napplication of a further coat.\nAlternate Term(s): Flatting\n18. Sealer/Sealant\nA protective product applied by hand or machine to an automotive\npaint, which coats, seals and protects the surface. Normally\ncontains silicones to maximize durability.\n19. Skinning\n\nThe formation of a thin tough film on the surface of a liquid paints\nfilm. Usually due to reaction with the air or to rapid solvent loss.\n20. Solid Color\n\nA coating, which contains colored pigments only, i.e., does not\ncontain pigments such as aluminum and micas.\n21. Spray Gun\n\nA typical painter will use a high-pressure spray gun to apply\ncoatings. High-pressure guns are powered by compressed air.\nThe purpose of the gun is to turn the liquid paint into a mist\n(atomize) and propel the paint toward the surface to be painted.\nWhen the wet mist contacts the surface, some of it sticks and\nsome of it bounces off of the surface. Under ideal conditions, only\nabout 30% of the paint sprayed stick or is transferred to the\nsurface using a high pressure spray gun. This is termed transfer\nefficiency; high-pressure spray guns have a maximum transfer\nefficiency of 30%. This means that if a gallon of paint can coat 300\nsquare feet, it will only coat 90 square feet if applied with a high-\npressure spray gun.\n22. Tack cloth\n\nCotton fabric, such as cheesecloth, lightly impregnated with a\nresin, used to remove dust from a surface after rubbing down and\nprior to further painting. Tack rags should be stored in an airtight\ncontainer to conserve their tackiness.\n23. Thinner\n\nA blend of volatile organic solvents added to the paint to reduce it\nto the correct viscosity for application\n24. Three-Stage Color\n\nA topcoat colour, which consists of 3, parts, a basecoat, a midcoat\nand a clear.\nAlternate Term(s): Tri-coat\n25. VIN (Vehicle\n Identification\n Number)\n\nAcronym for Vehicle Identification Number. This is a unique\nnumber that identifies your vehicle. Although its primary purpose is\nto identify your vehicle, it often contains important information\nconcerning the equipment and options that were installed on your\nvehicle at the factory. This information allows the Repair Center to\norder the correct parts for your vehicle. Any professional estimate\nor Repair Order will have this number on it\n26. Wet Sanding\nA procedure of simultaneously sanding and rinsing an automotive\nfinish to remove imperfections. Regarded as complicated and\nshould only be attempted by professionals.\n\n--- PDF PAGE 69 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthis Training Regulation.\n\nTHE TESDA ADVISORY PANEL (TAP)\nMR. ALLEN RAYMUND A. RUFO\nTAP Chairman – Automotive Sector\nTOYOTA Motors Philippines, Corp.\nParañaque city\nAutomotive Industry Board Foundation, Inc\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig city\nMS. MA. CLARISSA V. FUNESTO\nTAP Alternate Chairperson – Automotive Sector\nHONDA Phils. Inc.\nParañaque city\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig city\nMR. SIXTO D. CAYPUNO\nTAP Member – Academe\nSamson Technical College\nCubao, Quezon City\nMR. BENITO S. FELIX\nTAP Member – Academe\nTechnological University of the Philippines\nTagig.MM.\nMR. ANGEL Y. DIMALANTA\nTAP Member – Labor\nTOYOTA Motors Philippines Corporation\nSupervisory Union\nAutomotive Industry Workers Alliance\nKm.15 So. Superhighway Parañaque city MM.\nMR. ALLAN V. MERCADO\nMember – Labor\nAutomotive Service Association\nTESDA Region VII Compound\nMandaue city\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nAUTOMOTIVE BODY PAINT PAINTING/FINISHING\nRAYMOND CECILIO A. CABAUATAN\nBENIGNO L. AQUINO\nNESTOR PARAYNO\nAPOLINAR R. RAMPOLA\nGILBERT BLANES\nToyota Motors Phils, Corporation\nBrgy. Pulong, Sta. Rosa, Laguna and KM15 So. Superhighway, Parañaque MM.\nRICHARD O. ALMUDIN\nNISSAN Core Automotive Resources\nPasong Tamo Makati city\nENRIQUE M. SARMIENTO\nMantrade Devt. Corp.\nPasong Tamo Extension, Makati\nRUDOLFO B. VELASCO\nRBV Auto Management and Consultancy\nNew Manjila, Quezon city\nThe PARTICIPANTS in the National Validation of this Training Regulation\nMUSSOLINI C. BARILLO\nASAI, Cebu city\n\nMABINI P. CALINAWAN\nFilipinas Shell\nBajada, Davao city\nDIEGO L. DRECE\nLlarenas Motor Works\nDiit, Tacloban city\nLORIMER V. GARCIA\nThe Wheels, Auto Repair Shop\nCebu city\nALFREDO V. PANUELA JR.\nTESDA Davao\nEMMANUEL M. GARCIA\nTESDA RTC Tacloban city\n\nREYNALDO B. BALLETEROS\nTESDA PTC-Kabangkalan\nBacolod\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\n•\nSDCO\n•\nOFTVET\n•\nTESDA Regional/Provincial Offices\n (Regions VI, VII, VIII, and XI)\n\n--- PDF PAGE 70 ---\nList of Published Training Regulations\n\nAnimal Production NC III\n Aquaculture NC III\n Automotive Body Painting/Finishing NC III\n Automotive Body Repairing NC III\n Automotive Engine Rebuilding NC III\n Automotive Servicing NC III\n Driving NC III\n Footwear Making NC III\n He