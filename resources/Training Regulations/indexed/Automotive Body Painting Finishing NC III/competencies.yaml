        "source_text": "ALT311204\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the knowledge, skills and attitude in\nestimating/costing automotive repair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify nature/scope\nof work\n1.1\nEffective communication skills are applied to determine the\nnature and scope of work to be undertaken\n1.2\nExtent of service to be rendered in determined and\ndocumented in line with standard operating procedures (SOP)\n2. Prepare and present\nestimate\n2.1\nType and quantity of supplies, materials and labor required to\nperform work are identified in line with job requirements\n2.2\nCost of supplies, materials are obtained from suppliers\n2.3\nTotal cost of required services is calculated in line with SOP\n2.4\nEstimate is presented to customer in line with SOP.\n\n--- PDF PAGE 43 ---\nTR-Automotive Body Painting/Finishing NC III\n- 39 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Communication\nCommunication includes:\n1.1\nListening to customer\n1.2\nSpeaking with suppliers, customers and co-workers\n1.3\nQuestioning\n2. Suppliers\nSuppliers includes:\n2.2\nDistributors\n2.3\nManagers\n2.4\nProprietors\n3. Cost\nCosts include:\n3.1\nMaterials\n3.2\nLabor\n3.3\nOverhead\n\n--- PDF PAGE 44 ---\nTR-Automotive Body Painting/Finishing NC III\n- 40 -\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n Assessment requires evidence that the candidate\n1.1\nIdentified nature/scope of work\n1.2\nPrepared and presented estimate\n2. Underpinning\nknowledge\n\n2.1 Consumer mathematics\n2.2 Replaceable/Fabricated Materials or Spare parts in a vehicle\n2.3\nAutomotive Repair Procedures and Techniques\n2.4\nJob estimates\n3. Underpinning\nskills\n3.1 Computing using the Four Mathematical Operations\n3.2\nEstimating repair works and activities\n4. Resource\n implication\nThe following resources MUST be provided:\n4.1 Appropriate tools such as calculator, paper, pen, and other\nmeasuring instruments relevant to activity\n5. Method of\n assessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Presentation of Finished drawing\n6. Context of\nassessment\n6.1 Must be assessed in a room or in any simulated places\n6.2\nAssessment must be given according to industry standard\n\n--- PDF PAGE 45 ---\nTR-Automotive Body Painting/Finishing NC III\n- 41 -\nUNIT OF COMPETENCY : INTERPRET/DRAW TECHNICAL DRAWING\n\nUNIT CODE\n:"
