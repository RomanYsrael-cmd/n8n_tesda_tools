        "source_title": "SPRAY PEARL OR MICA COLOR PAINT",
        "source_text": "--- PDF PAGE 53 ---\nTR-Automotive Body Painting/Finishing NC III \n- 49 - \n \nUNIT OF COMPETENCY: SPRAY PEARL OR MICA COLOR PAINT \n \nUNIT CODE: ALT714312 \n \nUNIT DESCRIPTOR: This unit covers the competency in spraying pearl or mica color paints for \nautomotive body panels painting. This also includes ability to perform \nthree-stage paint application. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Clean and degrease \npanel/vehicle body for \nrepainting \n1.1 Work area is properly cleaned as per recommended \npaint manufacturer standard. \n1.1  Panel/Vehicle to be painted is positioned as per     \n painting requirements \n1.2  Cleaning of panel/vehicle is performed using    \n       pressurized air with air dryer to remove sanded  \n       particles  \n1.3  Degreasing of panel/vehicle is performed as per  \nstandard operating procedure \n1.4 Tack cloth is used to wipe off remaining particles\n2 Prepare paint mixture and \nspray gun \n  \n2.1 Spray gun is set-up to the required condition \n2.2 Paint mixture is strained using medium paint strainer \nwhile transferring mixture to spray gun without \nspillage \n2.3  Paint mixture is transferred to spray gun at least \n70% of paint cap capacity and without spillage. \n2.4 Spray pattern is checked by spray testing on \nseparate test panel \n2.5 Pattern, discharge, volume, air pressure of spray gun \nis adjusted as necessary. \n3.Apply Ground coat \n3.1 Ground coat  is applied using spray gun following and  \nobserving the factors in paint application: \n3.2 Appropriate personal protective devices are used \nduring painting \n3.3 Flash-off  time is observed as per paint \nmanufacturer’s specification  \n3.4 Drying time is observed as per manufacturer’s \nspecification.\n4. Apply pearl or mica coat \n \n4.1 Pearl or mica coat  is applied using spray gun \nfollowing and  observing the factors in paint \napplication: \n4.2 Appropriate personal protective devices are used \nduring painting \n4.3 Flash-off  time is observed as per paint \nmanufacturer’s specification  \n4.4 Drying/Baking time is observed as per \nmanufacturer’s specification.\n\n--- PDF PAGE 54 ---\nTR-Automotive Body Painting/Finishing NC III \n- 50 - \n5. Apply  clear coat \n5.1 Tack cloth is used to wipe off remaining particles \n5.2 Clear coat is applied using spray gun following and  \nobserving the factors in paint application: \n5.3 Appropriate personal protective devices are used during \npainting \n5.4 Flash-off  time is observed as per paint manufacturer’s \nspecification  \n5.5 Drying time is observed as per manufacturer’s \nspecification. \n5.6 All works are performed following workshop/company \nstandard operating procedures and occupational \nhealth and safety (OHS) practices\n6. Clean the spray gun \n \n6.1 Paint cup is cleaned with thinner before and after use \n6.2 Paint passage is cleaned with back-flush technique \n6.3 Nozzle cap is removed and fluid tip is cleaned \n6.4 Thinner is ensured clear after repetitive back-flush \ncleaning method\n\n--- PDF PAGE 55 ---\nTR-Automotive Body Painting/Finishing NC III \n- 51 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Paint mixture \nPaint mixture include but not limited to: \n1.1 Paint \n1.2 Thinner \n1.3Hardener \n1.4Additives\n2.Protective clothing \nand equipment \nPersonal protective clothing and safety devices may include: \n2.1 Gloves –cotton and solvent resistant, Safety shoes or boots, Dust \nmask, gas mask or respirator, particle mask  \n2.2 Shop uniform \n2.3 Apron \n2.4 Painting suit for actual painting application\n3. Factors in paint  \napplication \nFactors in paint application/handling techniques \n3.1Distance, normally 100-200 mm \n3.2Angle – Spray gun perpendicular to the panel 90 degrees \n3.3Speed – normally 800-1000 mm/sec. \n3.4Spray pattern overlap   \n4.Workshop/ company \nstandard operating \nprocedures \nWorkshop or company standard operating procedures include but not \nlimited to: \n4.1Job order \n4.2Materials, tools and equipment requisition slip \n4.1Use of personal protective equipment and devices\n\n--- PDF PAGE 56 ---\nTR-Automotive Body Painting/Finishing NC III \n- 52 - \nEVIDENCE GUIDE \n \n1.Critical aspects of  \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Cleaned work area \n1.2 Cleaned and degreased panel/vehicle body for repainting \n1.3 Prepared paint mixture and spray gun \n1.4 Applied ground coat \n1.5 Applied pearl or mica coat \n1.6 Applied clear coat.\n2.Underpinning \nknowledge and \nattitude \n2.1 Necessary cleaning and degreasing agents \n2.2 Relevant technical information \n2.3 Workplace safety procedures \n2.4 Vehicle safety requirements \n2.5 Equipment safety requirements \n2.6 Personal safety requirements \n2.7 Health Awareness on Effects of Paint Particles and Fumes \n2.8 Principle of Color Wheels \n2.9 Types of Different Paint materials \n2.10 Kinds of Paint Defects \n2.11 Types of Paints Used for 3 Stage Coating \n2.12 Workshop Maintenance and Housekeeping \n2.13 Proper Disposal of Waste Materials\n3.Underpinning \nskills \n3.1 Accessing, interpreting and applying technical information \n3.2 Use and setting up of relevant tools and equipment \n3.3 Handling and Using of Spray Gun \n3.4 Cleaning and Degreasing the Panel/Vehicle body \n3.5 Applying 3 Stage Coating \n3.6 Wearing of Personal Protective Clothing and Devices \n3.7 Handling and transferring Paint materials \n3.8 Computation skills \n3.9 Communication skills in dealing with customers, superiors and  \npeers.\n4 Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n5 Method of \nassessment \nCompetency may be assessed through: \n5.1 Demonstration with Questioning \n5.2 Observation with questioning \n5.3 Portfolio  \n5.4 Written examination\n6 Context of \nassessment \n6.1 Competency elements must be assessed on the job or  \n      simulated environment. \n6.2   The assessment of practical skills must take place after    \n       a period of supervised practice and repetitive  \n       experience. \n6.3 The required outcome must be able to be achieved  \n     without direct supervision\n",
