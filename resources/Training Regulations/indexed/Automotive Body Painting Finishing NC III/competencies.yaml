ore/arrange tools\nand shop equipment\n\n2.1\nTools/equipment are checked and stored in their respective\nshelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per workshop SOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and repair\nrecommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 40 ---\nTR-Automotive Body Painting/Finishing NC III\n- 36 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health &Safety\n4. Company standard\noperating procedure\nWearing of personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 41 ---\nTR-Automotive Body Painting/Finishing NC III\n- 37 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 42 ---\nTR-Automotive Body Painting/Finishing NC III\n- 38 -\nUNIT OF COMPETENCY :\nPREPARE JOB ESTIMATE/COSTING\n\nUNIT CODE\n: ALT311204\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the knowledge, skills and attitude in\nestimating/costing automotive repair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify nature/scope\nof work\n1.1\nEffective communication skills are applied to determine the\nnature and scope of work to be undertaken\n1.2\nExtent of service to be rendered in determined and\ndocumented in line with standard operating procedures (SOP)\n2. Prepare and present\nestimate\n2.1\nType and quantity of supplies, materials and labor required to\nperform work are identified in line with job requirements\n2.2\nCost of supplies, materials are obtained from suppliers\n2.3\nTotal cost of required services is calculated in line with SOP\n2.4\nEstimate is presented to customer in line with SOP.\n\n--- PDF PAGE 43 ---\nTR-Automotive Body Painting/Finishing NC III\n- 39 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Communication\nCommunication includes:\n1.1\nListening to customer\n1.2\nSpeaking with suppliers, customers and co-workers\n1.3\nQuestioning\n2. Suppliers\nSuppliers includes:\n2.2\nDistributors\n2.3\nManagers\n2.4\nProprietors\n3. Cost\nCosts include:\n3.1\nMaterials\n3.2\nLabor\n3.3\nOverhead\n\n--- PDF PAGE 44 ---\nTR-Automotive Body Painting/Finishing NC III\n- 40 -\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n Assessment requires evidence that the candidate\n1.1\nIdentified nature/scope of work\n1.2\nPrepared and presented estimate\n2. Underpinning\nknowledge\n\n2.1 Consumer mathematics\n2.2 Replaceable/Fabricated Materials or Spare parts in a vehicle\n2.3\nAutomotive Repair Procedures and Techniques\n2.4\nJob estimates\n3. Underpinning\nskills\n3.1 Computing using the Four Mathematical Operations\n3.2\nEstimating repair works and activities\n4. Resource\n implication\nThe following resources MUST be provided:\n4.1 Appropriate tools such as calculator, paper, pen, and other\nmeasuring instruments relevant to activity\n5. Method of\n assessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Presentation of Finished drawing\n6. Context of\nassessment\n6.1 Must be assessed in a room or in any simulated places\n6.2\nAssessment must be given according to industry standard\n\n--- PDF PAGE 45 ---\nTR-Automotive Body Painting/Finishing NC III\n- 41 -\nUNIT OF COMPETENCY : INTERPRET/DRAW TECHNICAL DRAWING\n\nUNIT CODE\n: ALT723206\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competencies required to draw/interpret\nbasic trade drawing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret technical\ndrawing\n1.1\nComponents, assemblies or objects recognized as required\n1.2\nDimensions identified as appropriate to the field of employment\n1.3\nInstructions identified and followed as required\n1.4\nMaterial and other consumable requirements identified as\nrequired\n1.5\nSymbols recognized as appropriate in drawing\n2. Select correct\ntechnical drawing\n\n2.1\nDrawing checked and validated against job requirements or\nequipment\n2.2\nDrawing version checked and validated according to the\nManual\n3. Apply freehand\nsketching\n3.1\nCorrect freehand sketching is produced using the necessary\ntools and materials\n\n--- PDF PAGE 46 ---\nTR-Automotive Body Painting/Finishing NC III\n- 42 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\n1.1\nDrawing symbols\n1.2\nAlphabet of lines\n1.3\nOrthographic views\n1.3.1\nFront view\n1.3.2\nRight side view/left side view\n1.3.3\nTop view\n1.3.4\nPictorial\n1.4\nSchematic diagram\n2. Manual\n2.1 technical drawing manual\n2.2\nmanufacturers schematic diagram\n3. Consumables\n3.1 drawing plate\n3.2 pencil and eraser\n3.3\nscotch tape\n4. Tools and\n materials\n4.1 compass\n4.2 divider\n4.3 rulers\n4.4 triangles\n4.5 drawing tables\n4.6\ncomputer\n\n--- PDF PAGE 47 ---\nTR-Automotive Body Painting/Finishing NC III\n- 43 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted technical drawing\n1.2\nSelected correct technical drawing\n1.3\nApplied freehand sketching\n2. Underpinning\nknowledge\n2.1 Drawing standard symbols\n2.2 Safe handling of tools and consumables\n2.3\nIdentification of types of drawing\n3. Underpinning skills\n3.1 Draw/interpret orthographic drawing\n3.2\nHandling of drawing instruments\n5. Resource\n implication\nThe following resources MUST be provided:\n4.1 Drawing room\n4.2 Appropriate tools\n4.3\nMaterials relevant to activity\n6. Method of\n assessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written/Oral examination\n5.3\nPresentation of Finished drawing\n6. Context of\nassessment\n6.1 Must be assessed in a drawing room or in any simulated\nplaces\n6.2\nAssessment must be given according to industry standard\n\n--- PDF PAGE 48 ---\nTR-Automotive Body Painting/Finishing NC III\n- 44 -\nCORE COMPETENCIES\n\nThis section gives the details of the contents of the core units of competency required in\nAUTOMOTIVE BODY PAINTING/FINISHING NC III.\n\nUNIT OF COMPETENCY: PERFORM PEARL COLOR MATCHING\n\nUNIT CODE: ALT714311\n\nUNIT DESCRIPTOR: This unit covers the competency in performing pearl color matching for\nautomotive body panel painting. This also covers the competency in\nperforming three-stage color application.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine special\ncolor formula\n1.1\nCorrect information of car/vehicle is checked from V.I.N\n(vehicle ID numbers).\n1.2\nVehicle special color code is matched with paint manufacturer\ncolor code.\n2. Compute volume of\npaint needed\n2.1\nAmount of special paint per panel required is consulted from\npaint manufacturer specification\n2.2\nComputation performed accurately and as per paint\nmanufacturer specifications\n3. Mix paint\n3.1\n3-stage colors selected as per paint manufacturer’s formula\n3.2\n Weighing scale is calibrated\n3.3\nGround coat or Base Color, Pearl-base, Mica, and clear coat\nare weighed accurately as per procedure and according to\nformula\n3.4\nSpecial colors are mixed as per procedure\n3.5\nPaint container edges are thoroughly scraped and paint is\nmixed properly and without spillage.\n\n--- PDF PAGE 49 ---\nTR-Automotive Body Painting/Finishing NC III\n- 45 -\n\n4. Apply paint to test\npanel\n\n4.1\nSpray gun is assured clean and without contamination and set\nto the required condition.\na.\nSpecial color is applied using spray gun following and\nobserving the factors in paint application\nb.\nSample paint mixture is prepared according to company\nprocedure and mixed with thinner as per paint\nmanufacturer specifications.\nc.\n Sample paint mixture is transferred to the spray gun\nwithout spillage.\nd.\n Paint sample mixture is applied on test panel using spray\ngun according to paint manufacturer specification\ne.\nDrying time/Flash-off time is observed as per manufacturer\nspecifications\nf.\nSpecial colors are applied as per procedure for 3-stage\nsolid color mixing/matching.\ng.\nPainting sequence is applied following manufacturer\nspecifications.\n\n--- PDF PAGE 50 ---\nTR-Automotive Body Painting/Finishing NC III\n- 46 -\n\n5. Check Spray Out\nResult\n5.1\nTest Panel is put adjacent to original panel for color comparison\nusing direct sunlight or color matching light at varying light\nintensity.\na.\nMissing color is determined and mixed to sample paint as\nper procedure within company standard time.\n6. Adjust and prepare\nfinal color mixture\n6.1\nRe-computation for missing color is performed accurately.\n6.2\nColor mixing is performed as per procedure\n6.3\nFinal test panel application is performed as per procedure\n6.4\n Final approval is obtained as per company standard operating\nprocedures\n6.5\nAll works are performed as per company standard operating\nprocedure/occupational health and safety practices using the\nrequired personal protective equipment\n7. Clean the spray\ngun\n\n7.1\nPaint cup is cleaned with thinner before and after use\n7.2\nPaint passage is cleaned with back-flush technique\n7.3\nNozzle cap is removed and fluid tip is cleaned\n7.4\nThinner is ensured clear after repetitive back-flush cleaning\nmethod\n\n--- PDF PAGE 51 ---\nTR-Automotive Body Painting/Finishing NC III\n- 47 -\nRANGE OF VARIABLES\n\nVARIABLES\nRANGES\n1. Car/Vehicle\ninformation\nCar/Vehicle information from V.I. N. include but not limited to the\nfollowing:\n1.1\nPlate number\n1.2\nModel and maker of vehicle\n1.3\nEngine Number\n1.4\nName of Owner\n1.5\nVehicle body color\n1.6\nVehicle trim color\n2. Factors in Paint\nApplication\nFactors in paint application includes:\n1.1\nPressure – 2-3 kg.\n2.2\nDistance – 100-200mm\n2.3\nPattern – fully open\n2.4\nDischarge amount – normally 3 full turns of discharge\nadjustment screw\n3. Special Color\nVehicle special color characteristic include:\n3.1\nColor variation at different angle\n3.2\nColor applied using 3-stage process\n3.3\nMay contain metallic pigments\n4. Computation\nDifferent computation includes solving for:\n4.1\nVolume\n4.2\nArea\n4.3\nBy weight\n4.4\nBy percentage\n4.5\nBy cumulative\n5. Equipment, Tools,\nSupplies and\nmaterials\nEquipment used includes:\n5.1 Spray gun\nTools include:\n5.2\nPaint stirrer\n5.3\nTest panel\nSupplies and Materials\n5.4\nPaint materials\n5.5\nRags\n6. Personal\nProtective\nEquipment\nPersonal protective clothing and safety devices may include:\n6.1\nGloves -cotton and solvent resistant\n6.2\nSafety shoes or boots\n6.3\nDust mask, gas mask or respirator, particle mask\n6.4\nShop uniform\n6.5\nApron\n6.6\nPainting suit used during actual painting spraying\n7.Required light source\nRequired light source include:\nFor Solid color:\n7.1\nColor matching light\n7.2\nDirect sunlight – usually at 8-10am and at 3-5 pm normal\nweather condition\n7.3\nIndoor light –2 meters from window sunlight\nFor Metallic color:\n7.4\nSunlight at 10am –3pm\n7.5\nColor matching light at 800-1,000 lux\n8.\nPainting sequence Painting sequence include the application of the following:\n8.1\nGround paint or base coat\n8.2\nPearl or mica base\n8.3\nClear coat\n\n--- PDF PAGE 52 ---\nTR-Automotive Body Painting/Finishing NC III\n- 48 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined special color formula.\n1.2\nComputed volume of paint needed\n1.3\nMixed paint\n1.4\nApplied paint to test panel\n1.5\nChecked spray out results\n1.6\nAdjusted and prepared final color mixture\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nSurface preparation procedures for primers/sealers (including\nminor dents/surface blemish repair)\n2.3\nRelevant technical information\n2.4\nWorkplace safety procedures\n2.5\nVehicle safety requirements\n2.6\nEquipment safety requirements\n2.7\nPersonal safety requirements\n2.8\n Mathematical Computation of volume, area, ratio and\nproportion, percentages and decimals\n2.9\nTypes of Paint Materials\n2.10\nPrinciple of Color Wheels\n2.11\nPrinciple of Applying Paint Coats\n2.12\nDifferent Paint Properties and Defects\n2.13\nProcedure in three Stage Paint Application\n2.14\nPatience, Honesty, Sense of Quality in Work, Dedication to\nWork, Thoroughness, Trainable to New procedures.\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUsing relevant tools and equipment\n3.3\nUsing and Handling Spray Gun\n3.4\nMixing and Transferring Paint\n3.5\nColor comparison and matching\n3.6\nComputation skills\n3.7\nCommunication skills in dealing with customer, superiors and\npeers\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration and Questioning\n5.2\nObservation in the workplace with questioning\n5.3\nPortfolio\n5.4\nWritten examination\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 53 ---\nTR-Automotive Body Painting/Finishing NC III\n- 49 -\n\nUNIT OF COMPETENCY: SPRAY PEARL OR MICA COLOR PAINT\n\nUNIT CODE: ALT714312\n\nUNIT DESCRIPTOR: This unit covers the competency in spraying pearl or mica color paints for\nautomotive body panels painting. This also includes ability to perform\nthree-stage paint application.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Clean and degrease\npanel/vehicle body for\nrepainting\n1.1 Work area is properly cleaned as per recommended\npaint manufacturer standard.\n1.1 Panel/Vehicle to be painted is positioned as per\n painting requirements\n1.2 Cleaning of panel/vehicle is performed using\n pressurized air with air dryer to remove sanded\n particles\n1.3 Degreasing of panel/vehicle is performed as per\nstandard operating procedure\n1.4 Tack cloth is used to wipe off remaining particles\n2 Prepare paint mixture and\nspray gun\n\n2.1 Spray gun is set-up to the required condition\n2.2 Paint mixture is strained using medium paint strainer\nwhile transferring mixture to spray gun without\nspillage\n2.3 Paint mixture is transferred to spray gun at least\n70% of paint cap capacity and without spillage.\n2.4 Spray pattern is checked by spray testing on\nseparate test panel\n2.5 Pattern, discharge, volume, air pressure of spray gun\nis adjusted as necessary.\n3.Apply Ground coat\n3.1 Ground coat is applied using spray gun following and\nobserving the factors in paint application:\n3.2 Appropriate personal protective devices are used\nduring painting\n3.3 Flash-off time is observed as per paint\nmanufacturer’s specification\n3.4 Drying time is observed as per manufacturer’s\nspecification.\n4. Apply pearl or mica coat\n\n4.1 Pearl or mica coat is applied using spray gun\nfollowing and observing the factors in paint\napplication:\n4.2 Appropriate personal protective devices are used\nduring painting\n4.3 Flash-off time is observed as per paint\nmanufacturer’s specification\n4.4 Drying/Baking time is observed as per\nmanufacturer’s specification.\n\n--- PDF PAGE 54 ---\nTR-Automotive Body Painting/Finishing NC III\n- 50 -\n5. Apply clear coat\n5.1 Tack cloth is used to wipe off remaining particles\n5.2 Clear coat is applied using spray gun following and\nobserving the factors in paint application:\n5.3 Appropriate personal protective devices are used during\npainting\n5.4 Flash-off time is observed as per paint manufacturer’s\nspecification\n5.5 Drying time is observed as per manufacturer’s\nspecification.\n5.6 All works are performed following workshop/company\nstandard operating procedures and occupational\nhealth and safety (OHS) practices\n6. Clean the spray gun\n\n6.1 Paint cup is cleaned with thinner before and after use\n6.2 Paint passage is cleaned with back-flush technique\n6.3 Nozzle cap is removed and fluid tip is cleaned\n6.4 Thinner is ensured clear after repetitive back-flush\ncleaning method\n\n--- PDF PAGE 55 ---\nTR-Automotive Body Painting/Finishing NC III\n- 51 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Paint mixture\nPaint mixture include but not limited to:\n1.1 Paint\n1.2 Thinner\n1.3Hardener\n1.4Additives\n2.Protective clothing\nand equipment\nPersonal protective clothing and safety devices may include:\n2.1 Gloves –cotton and solvent resistant, Safety shoes or boots, Dust\nmask, gas mask or respirator, particle mask\n2.2 Shop uniform\n2.3 Apron\n2.4 Painting suit for actual painting application\n3. Factors in paint\napplication\nFactors in paint application/handling techniques\n3.1Distance, normally 100-200 mm\n3.2Angle – Spray gun perpendicular to the panel 90 degrees\n3.3Speed – normally 800-1000 mm/sec.\n3.4Spray pattern overlap\n4.Workshop/ company\nstandard operating\nprocedures\nWorkshop or company standard operating procedures include but not\nlimited to:\n4.1Job order\n4.2Materials, tools and equipment requisition slip\n4.1Use of personal protective equipment and devices\n\n--- PDF PAGE 56 ---\nTR-Automotive Body Painting/Finishing NC III\n- 52 -\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned work area\n1.2 Cleaned and degreased panel/vehicle body for repainting\n1.3 Prepared paint mixture and spray gun\n1.4 Applied ground coat\n1.5 Applied pearl or mica coat\n1.6 Applied clear coat.\n2.Underpinning\nknowledge and\nattitude\n2.1 Necessary cleaning and degreasing agents\n2.2 Relevant technical information\n2.3 Workplace safety procedures\n2.4 Vehicle safety requirements\n2.5 Equipment safety requirements\n2.6 Personal safety requirements\n2.7 Health Awareness on Effects of Paint Particles and Fumes\n2.8 Principle of Color Wheels\n2.9 Types of Different Paint materials\n2.10 Kinds of Paint Defects\n2.11 Types of Paints Used for 3 Stage Coating\n2.12 Workshop Maintenance and Housekeeping\n2.13 Proper Disposal of Waste Materials\n3.Underpinning\nskills\n3.1 Accessing, interpreting and applying technical information\n3.2 Use and setting up of relevant tools and equipment\n3.3 Handling and Using of Spray Gun\n3.4 Cleaning and Degreasing the Panel/Vehicle body\n3.5 Applying 3 Stage Coating\n3.6 Wearing of Personal Protective Clothing and Devices\n3.7 Handling and transferring Paint materials\n3.8 Computation skills\n3.9 Communication skills in dealing with customers, superiors and\npeers.\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5 Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Questioning\n5.2 Observation with questioning\n5.3 Portfolio\n5.4 Written examination\n6 Context of\nassessment\n6.1 Competency elements must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after\n a period of supervised practice and repetitive\n experience.\n6.3 The required outcome must be able to be achieved\n without direct supervision\n\n--- PDF PAGE 57 ---\nTR-Automotive Body Painting/Finishing NC III\n- 53 -"
