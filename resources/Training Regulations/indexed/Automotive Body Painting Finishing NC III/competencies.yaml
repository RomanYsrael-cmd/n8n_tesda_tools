        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined special color formula.\n1.2\nComputed volume of paint needed\n1.3\nMixed paint\n1.4\nApplied paint to test panel\n1.5\nChecked spray out results\n1.6\nAdjusted and prepared final color mixture\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nSurface preparation procedures for primers/sealers (including\nminor dents/surface blemish repair)\n2.3\nRelevant technical information\n2.4\nWorkplace safety procedures\n2.5\nVehicle safety requirements\n2.6\nEquipment safety requirements\n2.7\nPersonal safety requirements\n2.8\n Mathematical Computation of volume, area, ratio and\nproportion, percentages and decimals\n2.9\nTypes of Paint Materials\n2.10\nPrinciple of Color Wheels\n2.11\nPrinciple of Applying Paint Coats\n2.12\nDifferent Paint Properties and Defects\n2.13\nProcedure in three Stage Paint Application\n2.14\nPatience, Honesty, Sense of Quality in Work, Dedication to\nWork, Thoroughness, Trainable to New procedures.\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUsing relevant tools and equipment\n3.3\nUsing and Handling Spray Gun\n3.4\nMixing and Transferring Paint\n3.5\nColor comparison and matching\n3.6\nComputation skills\n3.7\nCommunication skills in dealing with customer, superiors and\npeers\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration and Questioning\n5.2\nObservation in the workplace with questioning\n5.3\nPortfolio\n5.4\nWritten examination\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 53 ---\nTR-Automotive Body Painting/Finishing NC III\n- 49 -\n\nUNIT OF COMPETENCY: SPRAY PEARL OR MICA COLOR PAINT\n\nUNIT CODE:"
        },
        "source_text": "ALT714311\n\nUNIT DESCRIPTOR: This unit covers the competency in performing pearl color matching for\nautomotive body panel painting. This also covers the competency in\nperforming three-stage color application.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine special\ncolor formula\n1.1\nCorrect information of car/vehicle is checked from V.I.N\n(vehicle ID numbers).\n1.2\nVehicle special color code is matched with paint manufacturer\ncolor code.\n2. Compute volume of\npaint needed\n2.1\nAmount of special paint per panel required is consulted from\npaint manufacturer specification\n2.2\nComputation performed accurately and as per paint\nmanufacturer specifications\n3. Mix paint\n3.1\n3-stage colors selected as per paint manufacturer’s formula\n3.2\n Weighing scale is calibrated\n3.3\nGround coat or Base Color, Pearl-base, Mica, and clear coat\nare weighed accurately as per procedure and according to\nformula\n3.4\nSpecial colors are mixed as per procedure\n3.5\nPaint container edges are thoroughly scraped and paint is\nmixed properly and without spillage.\n\n--- PDF PAGE 49 ---\nTR-Automotive Body Painting/Finishing NC III\n- 45 -\n\n4. Apply paint to test\npanel\n\n4.1\nSpray gun is assured clean and without contamination and set\nto the required condition.\na.\nSpecial color is applied using spray gun following and\nobserving the factors in paint application\nb.\nSample paint mixture is prepared according to company\nprocedure and mixed with thinner as per paint\nmanufacturer specifications.\nc.\n Sample paint mixture is transferred to the spray gun\nwithout spillage.\nd.\n Paint sample mixture is applied on test panel using spray\ngun according to paint manufacturer specification\ne.\nDrying time/Flash-off time is observed as per manufacturer\nspecifications\nf.\nSpecial colors are applied as per procedure for 3-stage\nsolid color mixing/matching.\ng.\nPainting sequence is applied following manufacturer\nspecifications.\n\n--- PDF PAGE 50 ---\nTR-Automotive Body Painting/Finishing NC III\n- 46 -\n\n5. Check Spray Out\nResult\n5.1\nTest Panel is put adjacent to original panel for color comparison\nusing direct sunlight or color matching light at varying light\nintensity.\na.\nMissing color is determined and mixed to sample paint as\nper procedure within company standard time.\n6. Adjust and prepare\nfinal color mixture\n6.1\nRe-computation for missing color is performed accurately.\n6.2\nColor mixing is performed as per procedure\n6.3\nFinal test panel application is performed as per procedure\n6.4\n Final approval is obtained as per company standard operating\nprocedures\n6.5\nAll works are performed as per company standard operating\nprocedure/occupational health and safety practices using the\nrequired personal protective equipment\n7. Clean the spray\ngun\n\n7.1\nPaint cup is cleaned with thinner before and after use\n7.2\nPaint passage is cleaned with back-flush technique\n7.3\nNozzle cap is removed and fluid tip is cleaned\n7.4\nThinner is ensured clear after repetitive back-flush cleaning\nmethod\n\n--- PDF PAGE 51 ---\nTR-Automotive Body Painting/Finishing NC III\n- 47 -\nRANGE OF VARIABLES\n\nVARIABLES\nRANGES\n1. Car/Vehicle\ninformation\nCar/Vehicle information from V.I. N. include but not limited to the\nfollowing:\n1.1\nPlate number\n1.2\nModel and maker of vehicle\n1.3\nEngine Number\n1.4\nName of Owner\n1.5\nVehicle body color\n1.6\nVehicle trim color\n2. Factors in Paint\nApplication\nFactors in paint application includes:\n1.1\nPressure – 2-3 kg.\n2.2\nDistance – 100-200mm\n2.3\nPattern – fully open\n2.4\nDischarge amount – normally 3 full turns of discharge\nadjustment screw\n3. Special Color\nVehicle special color characteristic include:\n3.1\nColor variation at different angle\n3.2\nColor applied using 3-stage process\n3.3\nMay contain metallic pigments\n4. Computation\nDifferent computation includes solving for:\n4.1\nVolume\n4.2\nArea\n4.3\nBy weight\n4.4\nBy percentage\n4.5\nBy cumulative\n5. Equipment, Tools,\nSupplies and\nmaterials\nEquipment used includes:\n5.1 Spray gun\nTools include:\n5.2\nPaint stirrer\n5.3\nTest panel\nSupplies and Materials\n5.4\nPaint materials\n5.5\nRags\n6. Personal\nProtective\nEquipment\nPersonal protective clothing and safety devices may include:\n6.1\nGloves -cotton and solvent resistant\n6.2\nSafety shoes or boots\n6.3\nDust mask, gas mask or respirator, particle mask\n6.4\nShop uniform\n6.5\nApron\n6.6\nPainting suit used during actual painting spraying\n7.Required light source\nRequired light source include:\nFor Solid color:\n7.1\nColor matching light\n7.2\nDirect sunlight – usually at 8-10am and at 3-5 pm normal\nweather condition\n7.3\nIndoor light –2 meters from window sunlight\nFor Metallic color:\n7.4\nSunlight at 10am –3pm\n7.5\nColor matching light at 800-1,000 lux\n8.\nPainting sequence Painting sequence include the application of the following:\n8.1\nGround paint or base coat\n8.2\nPearl or mica base\n8.3\nClear coat\n\n--- PDF PAGE 52 ---\nTR-Automotive Body Painting/Finishing NC III\n- 48 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined special color formula.\n1.2\nComputed volume of paint needed\n1.3\nMixed paint\n1.4\nApplied paint to test panel\n1.5\nChecked spray out results\n1.6\nAdjusted and prepared final color mixture\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nSurface preparation procedures for primers/sealers (including\nminor dents/surface blemish repair)\n2.3\nRelevant technical information\n2.4\nWorkplace safety procedures\n2.5\nVehicle safety requirements\n2.6\nEquipment safety requirements\n2.7\nPersonal safety requirements\n2.8\n Mathematical Computation of volume, area, ratio and\nproportion, percentages and decimals\n2.9\nTypes of Paint Materials\n2.10\nPrinciple of Color Wheels\n2.11\nPrinciple of Applying Paint Coats\n2.12\nDifferent Paint Properties and Defects\n2.13\nProcedure in three Stage Paint Application\n2.14\nPatience, Honesty, Sense of Quality in Work, Dedication to\nWork, Thoroughness, Trainable to New procedures.\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUsing relevant tools and equipment\n3.3\nUsing and Handling Spray Gun\n3.4\nMixing and Transferring Paint\n3.5\nColor comparison and matching\n3.6\nComputation skills\n3.7\nCommunication skills in dealing with customer, superiors and\npeers\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration and Questioning\n5.2\nObservation in the workplace with questioning\n5.3\nPortfolio\n5.4\nWritten examination\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 53 ---\nTR-Automotive Body Painting/Finishing NC III\n- 49 -\n\nUNIT OF COMPETENCY: SPRAY PEARL OR MICA COLOR PAINT\n\nUNIT CODE:"
      }
