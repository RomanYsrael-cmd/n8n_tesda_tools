ng oil: \n3.1  Kilometers traveled used \n3.2  No. of Hours used \n3.3 \nMonthly\n4.  Tool and  \n      equipment \nTools used includes: \n4.1 \nHand tools \n4.2 \nOiler \n4.3 \nOil Dispenser \n4.4\nGrease gun\n5. Personal protective \nequipment (PPE) \n \nPPE include: \n5.1 \nApron \n5.2 \nGloves \n5.3 \nGoggles \n5.4\nSafety shoes\n\n--- PDF PAGE 38 ---\nTR-Automotive Body Painting/Finishing NC III \n- 34 -"
