    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for Automotive Body Painting/Finishing NCII.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE BODY PAINTING/ FINISHING\nNC Level NC III\n\nNominal Training Duration: 183 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in\nthe field of automotive body paint refinishing in accordance with industry standards. It covers\nspecialized competencies such as: Repair two-stage metallic color paints, Perform pearl color\nmatching, Spray pearl or mica color paint.\n\nBASIC COMPETENCIES\n(20 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information about\nworkplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate issues\narising in the workplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation for\nteam members.\n\n2.4\nSupervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for agreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible cause/s\nof the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 58 ---\nTR-Automotive Body Painting/Finishing NC III\n- 54 -\n6. Use relevant\ntechnologies\n6.1 Identify appropriate technology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(43 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nappropriate\nsealant/\nadhesive\n1.1 Identify appropriate sealant/\nadhesive\n1.2 Prepare surface for sealant /\nadhesive application\n1.3 Store unused and dispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n2. Move and\nposition vehicle\n2.1 Prepare vehicle for driving\n2.2 Move and position vehicle\n2.3 Check the vehicle\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n3. Perform\nmensuration\nand calculation\n3.4 Select measuring instrument\nand carry out measurement and\ncalculations\n3.5 Maintain measuring instruments\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n4. Read, interpret\nand apply\nspecifications\nand manual\n4.1 Identify/access manuals and\ninterpret data and specification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n5. Use and apply\nlubricants/\ncoolants\n5.1 Identify type of lubricants/\ncoolants\n5.2 Use and apply lubricants\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n6. Perform shop\nmaintenance\n6.1 Inspect/clean tools and work area\n• Lecture/\nDemonstration\n• Written test\n\n--- PDF PAGE 59 ---\nTR-Automotive Body Painting/Finishing NC III\n- 55 -\n\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose waste/used lubricants\n6.4 Report damaged tools/equipment\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Oral\nquestioning\n• Direct\nobservation\n•Interview\n7. Interpret/Draw\ntechnical\ndrawing\n7.1 Interpret technical drawing\n7.2 Select correct technical drawing\n7.3 Apply freehand sketching\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n8. Prepare job\nestimates\n8.1 Identify nature/scope of work\n8.2 Prepare and present estimates\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n\nCORE COMPETENCIES\n(120 Hours)\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pearl\ncolor matching\n1.1 Determine special color formula\n1.2 Compute volume of paint needed\n1.3 Mix Paint\n1.4 Apply paint to test panel\n1.5 Check Spray Out Result\n1.6 Adjust and prepare final color\nmixture\n1.7 Clean the spray gun\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Interview\n2. Spray pearl or\nmica color paint\n2.1 Clean and degrease panel/vehicle\nbody for repainting\n2.2 Prepare paint mixture and spray\ngun\n• Discussion\n• Demonstration\n• Practical\napplication\n• Demonstration\nof practical\nskills\n• Interview\n3. Perform\npolishing\n3.6 Assess painted surface\n3.7 Prepare surface for polishing\n3.8 Polish painted surface\n3.9 Clean the polish surface\n3.10 Install body accessories\n• Discussion\n• Demonstration\n• Practical\napplication\n• Demonstration\nof practical\nskills\n• Interview\n\n--- PDF PAGE 60 ---\nTR-Automotive Body Painting/Finishing NC III\n- 56 -\n\n2.4 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum\nmodules;\n•\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when designing\ntraining programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Practical application System (DTS) Implementing Rules and\nRegulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n\n--- PDF PAGE 61 ---\nTR-Automotive Body Painting/Finishing NC III\n- 57 -\n2.5 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n•\ncan communicate both oral and written;\n•\nwith good moral character; and\n•\ncan perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nAUTOMOTIVE BODY PAINTING/FINISHING – NC III\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nAutomotive Body Painting/ Finishing – NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n25 pairs\n•Putty knife\n1 unit\n• Sander (single\naction) w/ vacuum\npump\n75 pcs.\n•Sandpaper #120\n4 pcs.\n• Scraper\n75 pcs.\n• Sandpaper #180\n2 pcs.\n• Spatula\n1 unit\n• Sander (dual\naction) or orbital\nsander\n25 ltrs.\n• Paint remover\n2 sets\n• Screw driver\nassorted type\n6pcs.\n10 ltrs.\n• Degreaser\n2 sets\n• Wrench\n Socket 24 pcs.\nper set 6mm-\n24mm\n1 unit\n• Air compressor\n100 ltrs. • Thinner\n2 sets\n• Wrench\nCombination 24\npcs. per set\n6mm-32mm.\n2 unit\n• Spray gun\n(complete\naccessories)\nSuction type\n10 ltrs.\n•Surfacer\n10 ltrs.\n• Sealant\n1 pc.\n• Impact wrench\n1 unit\n• Pressurized car\nwash machine\n25 rolls\n• Masking\nmaterials\n2 pcs.\n\n• Mechanic’s\nhammer\n1 unit\n• Paint Mixing\nMachine\n10 ltrs.\n• Wash primer\n25 pcs.\n2 sets\n• Goggle\n• Box wrench\n 32pcs. per set\n6mm-32mm\n1 unit\n• Electronic\nWeighing\nMachine\n10 ltrs.\n10 ltrs.\n• Epoxy primer\n• Special paint\n25 pairs\n• Gloves\n25 pcs.\n• Rubber sanding\nblock\n10 ltrs.\n• Urethane primer\n25 pcs.\n•Dust mask\n1 set\n•Paint sanding file\n10 ltrs.\n•Acrylic primer\n2 pcs.\n• Gas mask\n2 units • Spray gun gravity\ntype\n1 liter\n• Penetrating oil\n25 pairs\n• Safety shoes\n2 units • Touch-up spray\ngun\n100 pcs\n• Painting cloth\n\n--- PDF PAGE 62 ---\nTR-Automotive Body Painting/Finishing NC III\n- 58 -\n\nTOOLS\nEQUIPMENT\nMATERIALS\n25 pcs.\n• Painting uniform\n2 unit\n• Compressed air\nregulator with\ncomplete\naccessories.\n5 sets\n• Spray gun\ncleaning kit\n2 sets\n• S.S.T.\n10 pcs.\n• Wire buffing\n5 pcs.\n• Vice grip\n10 ltrs.\n• Degreasing\nchemical\n2 sets\n• Spray gun\ncleaning kit\n1 unit\n• Painting booth\nwith infra-red bul\n100 pcs\n• Tack cloth\n2 sets\n• Loose panel\nsupport\n2 pcs\n• Paint wire buffer\nattachment\n100 pcs.\n• Paint Strainer\n10 pcs.\n• Hose couplings\nand fittings\n2 unit\n• Vacuum paint\nstrainer\n25 pcs.\n• Shading\nmaterials\n25 pcs.\n• Rubberized\nBuffing pad\n\n25 pcs.\n• Manufacturer\nmaterials\n2 sets\n• Painting\nbrushes 7pcs\nper set one of\neach kind\n\n25 pcs.\n• Respirator\n25 pcs.\n• Particle mask\n2 units\n• Compressed air\ngun nozzle\n\n25 pcs.\n• Apron\n\n3.5 TRAINING FACILITIES\nAUTOMOTIVE BODY PAINTING/FINISHING – NC III\n\nThe workshop must be made of reinforced concrete or steel structure. The size must\nbe suited on the requirements of the competencies. The facility should accommodate a\nminimum of 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop Component Areas\n• Laboratory/Workshop\nArea\n-\n-\n100.00\n•\nLecture Room\n5.00 x 5.00\n25.00\n25.00\n• Tool, Supply & Storage\nRoom\n3.00 X 3.00\n9.00\n9.00\n• Learning Resource\nCenter\n2.00 x 5.00\n10.00\n10.00\n•\nWash Room and Toilet\n2.00 X 5.00\n10.00\n10.00\nTotal (Workshop Component)\n154.00\n•\nCirculation Area (30% of Workshop Component Space)\n40.00\nGrand Total (Building Space)\n194.00\nNote: The entries in the size in meters column are recommendations only. The grand total\n(building space) is the minimum space requirement for registration.\n\n--- PDF PAGE 63 ---\nTR-Automotive Body Painting/Finishing NC III\n- 59 -\n3.6 TRAINERS’ QUALIFICATION\nAUTOMOTIVE/LAND TRANSPORT SECTOR\n\nAUTOMOTIVE BODY PAINTING/FINISHING – NC III\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Automotive Body Painting/ Finishing NC IV or equivalent\nqualification\n• Must have undergone training on Training Methodology II (TM II) or equivalent in\ntraining/experience\n• Must be computer literate\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate professional\nlicense issued by the Professional Regulatory Commission)\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\n Institutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 64 ---\nTR-Automotive Body Painting/Finishing NC III\n- 60 -"
