      "text": "Spray Gun A typical painter will use a high-pressure spray gun to apply coatings. High-pressure guns are powered by compressed air. The purpose of the gun is to turn the liquid paint into a mist (atomize) and propel the paint toward the surface to be painted. When the wet mist contacts the surface, some of it sticks and some of it bounces off of the surface. Under ideal conditions, only about 30% of the paint sprayed stick or is transferred to the surface using a high pressure spray gun. This is termed transfer efficiency; high-pressure spray guns have a maximum transfer efficiency of 30%. This means that if a gallon of paint can coat 300 square feet, it will only coat 90 square feet if applied with a high- pressure spray gun."
