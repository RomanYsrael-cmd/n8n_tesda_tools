onstration\n• Observation\n• Interviews/\n• Questioning\n• Written Exams\n\n--- PDF PAGE 47 ---\nTR- Ophthalmic Lens Services NC II\n45\nCORE COMPETENCIES\n(208 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Analyze and\ninterpret\nophthalmic lens\nprescription\n1.1 Analyze ophthalmic lens\nprescription\n1.2 Interpret prescription details\n\n• Lecture\n• Demonstration\n• Laboratory\n• Written/\n• Practical\nexamination\n\n2. Edge and\nmount\nophthalmic\nappliances\n2.1 Prepare lens/frame for\nedging and mounting\n2.2 Operate lens edging\nmachine\n2.3 Perform edging and\nmounting of lenses\n2.4 Perform frame modifications\n2.5 Conduct final checking\nprocedures\n• Lecture\n• Observation\n• Demonstration\n• Laboratory\n\n• Written/\n• Practical\nexamination\n\n3. Apply UV coat/\ntint to\nophthalmic\nlenses\n3.1 Prepare ophthalmic lens for\nUV coat/tint\n3.2 Identify type of UV coat/tint\n3.3 Apply UV coat/ tint to lenses\n3.4 Check UV coat/ tint finish\n• Lecture\n• Observation\n• Demonstration\n• Laboratory\n\n• Written/\n• Practical\nexamination\n\n--- PDF PAGE 48 ---\nTR- Ophthalmic Lens Services NC II\n\n46\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\n curriculum modules;\n• Assessment is based in the collection of evidence of the performance of work to\n the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both on\nand off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and\nRegulations.\n\n• Modular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer just facilitates the training\ndelivery.\n\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n• Supervised industry training or on-the-job training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, audio, video or computer technologies.\n\n• Project-based instruction is an authentic instructional model strategy in which students\nplan, implement and evaluate projects that have real world applications.\n\n--- PDF PAGE 49 ---\nTR- Ophthalmic Lens Services NC II\n\n47\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should\npossess the following requirements:\n\n•\nMust be high school graduate or its equivalent\n•\nMUST be able to communicate effectively both orally and in written form\n•\nMUST be physically, emotionally, psychologically and mentally fit\n•\nMUST be able to perform basic mathematical computation\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a minimum of 25\ntrainees for Ophthalmic Lens Services NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\n\nQTY\n\nQTY\n\nQTY\n\n25 sets\n(1:1)\nPrecision screw drivers\n5\nunits\n(1:5)\nManual edger\n25\nsets\n(1:5)\nSet of lenses(single\nvision, bifocal,\nprogressive,\npolycarbonate)\n5 sets\n(1:5)\nOphthalmic pliers\n1 unit\n(1:25)\nAutomatic edger\n(*with tracer)\n1 per\ncolor\n(1:25)\nTinting powder(vial)\n/liquid (200ml)\n5 sets\n(1:5)\nNeedle files\n1 unit\n(1:25)\nLens blocker\n25\nsets\n(1:1)\nSet of frames (full,\nsemi-rimless, rimless):\nmetal and plastic\n5 pcs.\nDiamond cutter\n5\nunits\n(1:5)\nLens meter\n(manual or\ncomputerized)\n1vial/\nbtl.\n(1:25)\nUV powder(vial)/liquid\n(200ml)\n25 sets\n(1:1)\nPrecision nut drivers\n2\nunits\nGrooving\nmachine\n1 btl.\n(1:25)\nNeutralizer\n25 sets\n(1:1)\nPPE (lab. Gowns, face\nmask, safety goggles,\ngloves)\n1 unit\n(1:25)\nTinting/UV unit\nwith complete\naccessories\n1 roll\n(1:25)\nRefitting nylon cord\n5 pcs.\n(1:5)\nLens measure/clock\n2\nunits\n(1:12)\nHand polishing\nmachine\n\nFrame spare parts\n(temples, temple tips,\nbridge, nose pads,\nscrews)\n5 pcs.\n(1:5)\nPrecision dial caliper\n2\nunits\n(1:12)\nPrecision drill\npress\n25\npcs.\n(1:1)\nLens pattern\n25 pcs.\n(1:1)\n\nCentration charts\n1 unit\n(1:25)\nCuring oven\n25\npcs.\n(1:1)\nEdging pad\n\n--- PDF PAGE 50 ---\nTR- Ophthalmic Lens Services NC II\n\n48\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n5 pcs.\n(1:5)\nFrame heater\n1 unit\n(1:25)\nUV meter\n\n25 pcs.\n(1:1)\nPD ruler\n\nFIXTURES\n\nTraining Materials:\nWork table\nCATALOG\n1\nFrame Catalog\n1\nLens Catalog\n1\nMagazines\nTextbooks\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\nTotal Area in\nSq. Meters\n\nStudent/Trainee Working Space\n\