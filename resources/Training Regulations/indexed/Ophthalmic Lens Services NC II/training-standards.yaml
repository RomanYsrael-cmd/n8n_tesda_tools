    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Ophthalmic Lens Services\n\nNC Level: NC II\n\nNominal Training Duration:\n18-hours (Basic)\n28-hours (Common)\n208 -hours (Core)\n\nCourse Description:\n\n This course is designed to enhance the knowledge, skills and attitudes of OPHTHALMIC\nLENS SERVICES NC II in analyzing and interpreting ophthalmic lens prescription, edging and\nmounting ophthalmic appliances and applying UV coat/ tint to ophthalmic lenses in accordance\nwith industry standards.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Written\nexamination\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role Playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interview/\nquestioning\n\n--- PDF PAGE 46 ---\nTR- Ophthalmic Lens Services NC II\n44\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks.\n4.2 Evaluate hazards and risks.\n4.3 Control hazards and risks.\n4.4 Maintain occupational health\nand safety awareness.\n• Group\ndiscussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\nCOMMON COMPETENCIES\n(28 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply quality\nstandards\n1.1 Assess own work\n1.2 Assess clients service needs\n1.3 Engage in quality improvement\n• Lecture\n• Case Study\n• Discussion/\nInteraction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n2. Manage own\nperformance\n2.1 Plan completion of own\nworkload\n2.2 Maintain quality of own\nperformance\n2.3 Establish credibility with\ncustomers/clients\n(Practitioners)\n• Lecture\n• Case Study\n• Discussion/\nInteraction\n• Demonstration\n• Observation\n• Written\n /Practical\n Exams\n3. Maintain a safe,\nclean and\nefficient work\nenvironment\n3.1 Comply with health regulations\n3.2 Prepare and maintain work area\n3.3 Check and maintain tools and\nequipment\n3.4 Provide a safe and effective\nworking environment\n• Lecture\n• Case Study\n• Discussion/\nInteraction\n• Demonstration\n• Observation\n• Written\n /Practical\n Exams\n4. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n (Practitioners)\n4.1 Maintain a professional image\n4.2 Build credibility with\ncustomers/clients(Practitioners)\n4.3 Meet customers/clients\n(Practitioners) requirements\n• Group\n Discussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n• Written Exams\n5. Operate a\npersonal\ncomputer\n5.1 Start and shut down the\ncomputer\n5.2 Arrange and customize desktop\ndisplay/ Windows settings\n5.3 Work with files and folders (or\ndirectories)\n5.4 Work with user application\nprograms\n5.5 Print information\n5.6 Shut down computer\n• Group\n Discussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n• Written Exams\n\n--- PDF PAGE 47 ---\nTR- Ophthalmic Lens Services NC II\n45\nCORE COMPETENCIES\n(208 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Analyze and\ninterpret\nophthalmic lens\nprescription\n1.1 Analyze ophthalmic lens\nprescription\n1.2 Interpret prescription details\n\n• Lecture\n• Demonstration\n• Laboratory\n• Written/\n• Practical\nexamination\n\n2. Edge and\nmount\nophthalmic\nappliances\n2.1 Prepare lens/frame for\nedging and mounting\n2.2 Operate lens edging\nmachine\n2.3 Perform edging and\nmounting of lenses\n2.4 Perform frame modifications\n2.5 Conduct final checking\nprocedures\n• Lecture\n• Observation\n• Demonstration\n• Laboratory\n\n• Written/\n• Practical\nexamination\n\n3. Apply UV coat/\ntint to\nophthalmic\nlenses\n3.1 Prepare ophthalmic lens for\nUV coat/tint\n3.2 Identify type of UV coat/tint\n3.3 Apply UV coat/ tint to lenses\n3.4 Check UV coat/ tint finish\n• Lecture\n• Observation\n• Demonstration\n• Laboratory\n\n• Written/\n• Practical\nexamination\n\n--- PDF PAGE 48 ---\nTR- Ophthalmic Lens Services NC II\n\n46"
