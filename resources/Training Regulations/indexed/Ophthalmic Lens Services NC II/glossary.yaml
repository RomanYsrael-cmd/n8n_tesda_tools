  "source_text": "1.\nLENS - is used to denote a portion of a transparent substance bounded by two smooth\npolished surfaces, both of which may be curved, or only one is curved and the other being\nplane.\n2.\nDIOPTER - is the unit of measurement of the refractive power of the lens.\n3.\nOPHTHALMIC LENSES - are lenses used for correcting ametropia.\n4.\nLENS BLOCK – tool used to hold lens surface\n5.\nNEUTRALIZATION – process of finding the power of unknown lens.\n6.\nPRESCRIPTION – is the designation of an optical system that is intended to relieve certain\ndifficulties of the patient that are related to vision.\n7.\nBENCHWORK – entails the second phase towards the completion of an ophthalmic\nprescription. It is the operation done, after the lens has been finished from the grinding\nlaboratory, in order to insert or mount the lens to a spectacle frame or mounting with utmost\nprecision to satisfy the requirements for a given prescription.\n8.\nDATUM LINE – is a reference line particularly the horizontal line through the geometric\ncenter of a lens shape.\n9.\nCENTERING – is the process of marking and determining the optical center, the axis of the\ncylinder, and base-apex line of a prism. All centering marks are done on the front surface of\nthe lens.\n10.\nGLAZING – is the process of inserting or mounting lenses in spectacle frame.\n11.\nDRILLING - is the process of boring holes through the surface of the lens for retention\npurposes by the use of drilling machine and drilling fluids.\n12.\nMOUNTING – entails the placement of an ophthalmic lens in a rimless frame.\n13.\nPRISM – is a transparent wedge of refracting materials with triangular ends and three\nfaces, two of which meet in line called apex and rest upon a third face called base.\n14.\nFRAME – is a type in which the lenses are encircled by eyewire.\n15.\nBRIDGE – that part of a frame that arches over the nose and connects the two eyewires..\n16.\nFRONT – is the entire pair of glasses except the temples.\n\n--- PDF PAGE 56 ---\nTR- Ophthalmic Lens Services NC II\n\n3\n5\n17.\nPADS – are plastic nosepieces on the arms to support and distribute the weight of glasses\non the nose.\n18.\nTEMPLES – are sidepieces that hinged into the endpiece and fit over the ears.\n19.\nFITTING – is the process of selecting lenses and frames or mountings, taking essential\nmeasurements, determining the size and position relationship, all of which ultimately be\ncombined into an efficient, attractive, comfortable ophthalmic correction.\n20.\nABSORPTION – the process in which radiant energy is converted into other forms, usually\nheat by passage through or reflection from a medium.\n21.\nFILTRATION – the process in which wave lengths of light is transmitted or equally absorb\nthrough a medium/filter.\n\n--- PDF PAGE 57 ---\n54",
