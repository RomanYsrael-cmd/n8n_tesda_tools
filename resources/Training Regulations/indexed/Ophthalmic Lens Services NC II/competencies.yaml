        "source_title": "EDGE AND MOUNT OPHTHALMIC APPLIANCES",
        "source_text": "--- PDF PAGE 36 ---\nTR- Ophthalmic Lens Services NC II \n34\nUNIT OF COMPETENCY : \nEDGE AND MOUNT OPHTHALMIC APPLIANCES  \n \nUNIT CODE \n: \nHSC222302 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency describes the skills and knowledge \nrequired to edge and fit ophthalmic lenses. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Operate equipment \n \n1.1  \nRelevant lens edging and fitting equipment is operated in \naccordance with manufacturer’s required operating procedures \n1.2 \nEquipment and attachments are maintained in accordance with \nmanufacturer's requirements and safety control procedures \n1.3 \nEquipment and attachments are stored in accordance with \nmanufacturer's requirements and safety control procedures\n2.  Perform skills in \nedging and \nmounting \n \n2.1      Lens parameters are verified in accordance with the \nprescription requirements \n2.2      Lens are edged and mounted in accordance with standard \noperating procedures \n2.3      Mounted lenses are verified in accordance with prescription \nrequirements   \n2.4      Atypical appliances are mounted in accordance with \nprescription requirements\n3.  Utilize computer \ntechnology \n3.1    Appropriate technology and software applications  are \nselected to achieve the requirements of the task \n3.2    Workspace, furniture and equipment are adjusted to suit the \nergonomic requirements of the user \n3.3    Technology is used according to organization requirements \nand in a way which promotes a safe work environment  \n3.4    Ophthalmic equipment are used in accordance with the \nmanufacturer's recommendations/instructions \n3.5    Routine maintenance is carried out or arranged in order to \nensure that equipment is maintained in accordance with \nmanufacturer's instructions and organization requirements \n3.6    Equipment faults  are identified and appropriate action is taken \nin accordance with manufacturer's instructions or by reporting \nfault to designated person\n4.  Perform frame \nmodifications \n4.1    Frames are inspected for faults prior to glazing in accordance \nwith SOP \n4.2    Frames are adjusted in accordance with relevant standards \n4.3    Frames are repaired in accordance with relevant standards\n\n--- PDF PAGE 37 ---\nTR- Ophthalmic Lens Services NC II \n35\n5.  Conduct final \nchecking \nprocedures \n \n5.1  \nOphthalmic appliance is confirmed against the prescription prior \nto delivery  \n5.2  \nCorrect type and form of lens used is checked in line with client \nrequirements   \n5.3 \nLens treatments are checked for quality in accordance with \nprescription requirements \n5.4 \nFrame used is checked in line with prescription requirements \n5.5 \nStandard frame alignment is carried out and confirmed in \naccordance with specified standards  \n5.6 \nCompletion of job is confirmed in line with prescription \nrequirements\n\n--- PDF PAGE 38 ---\nTR- Ophthalmic Lens Services NC II \n36\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Equipment \n1.1 \nThe following pieces of equipment and instruments \n- \nmanual edging machine  \n- \nautomated edging machine and accessories \n- \nfoci-meters (lens meters) \n- \nmarking/ centration devices \n- \ncalibration and measuring tools \n-\nframe alignment tools \n2.  Lens parameters \n2.1       spherical power \n2.2       cylindrical power \n2.3       axis \n2.4       addition power \n2.5       pupillary distance \n2.6       pupil height/segment height \n2.7       prism\n3. Lens \n3.1 \nMineral (Glass) material \n3.2 \nOrganic (Plastic) material \n3.3      Polycarbonate material\n4. Frame material  \n4.1 \nMetal \n4.2\nPlastic \n5.  Relevant standards \n5.1     International Standards Organization (ISO) \n6. Repairing and \nmodifying spectacle \nframes \n6.1 \nUndertaking frame part replacements \n- \ntemples \n- \ntemple tips \n- \nbridge \n- \nnose pads \n- \nscrews \n6.2      Refitting nylon \n6.3      Re-pinning and riveting joints/ hinges \n6.4      Sink joints/ hinges \n6.5      Alignment\n\n--- PDF PAGE 39 ---\nTR- Ophthalmic Lens Services NC II \n37\n7. Atypical \n7.1      Occupationally specific appliances including diving masks, \n           swimming goggles \n7.2      Low visual aids \n7.3      Wrap frames \n8. Technology \nMay include: \n8.1     Computer technology, such as laptops and desktops \n8.2     Digital cameras \n8.3     Memory devices \n8.4     Modems \n8.5     Scanners \n8.6     Printers \n8.7     Industry specific equipment \n9. Software \napplications  \nMay include: \n9.1     Email, internet \n9.2     Word processing, spreadsheet, database or presentation \npackages \n9.3     Industry specific software \n10. Routine \nmaintenance  \nMay include: \n10.1   Regular checking of equipment \n10.2   Replacing consumables \n10.3   'In-house' cleaning and servicing of equipment according to  \nmanufacturer's guidelines \n10.4   Periodic servicing by qualified or manufacturer approved  \ntechnician\n11. Equipment faults or \nproblems   \nMay be identified or anticipated by: \n11.1   Routine checking of equipment \n11.2   Preparation of a maintenance program \n11.3   Encouraging feedback from work colleagues\n\n--- PDF PAGE 40 ---\nTR- Ophthalmic Lens Services NC II \n38\nEVIDENCE GUIDE \n \n1.    Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  \noperated optical equipment   \n1.2      performed skills in edging and mounting \n1.3      utilized computer technology \n1.4      performed frame adjustments \n1.5    conducted final verification procedures\n2.    Underpinning \nknowledge  \n2.1  \nRelevant optical industry standard \n2.2  \nFrame measurement systems including boxing and datum \n2.3  \nProperties of lens  \n2.4  \nScope of metal and plastic frame materials including heating, \nmanipulation, adjusting, handling and repair \n2.5      Manual/automated edging machine including: \n- \nmachine design \n- \nblocking/ chucking systems \n- \nedging wheel designs and characteristics \n- \nmachine operation \n \n2.6     Glazing techniques \n2.7     Impact resistant safety lenses including: \n- \nuses \n- \nimpact resistance \n- \nprinciples and processing of thermal and chemical \ntoughening \n- \nproblems and special lens requirements \n- \nadvantages and disadvantages \n- \noptical industry standards for both general purpose and \nindustrial use \n- \nimpact testing requirements, conditions and procedures \n- \nevaluation of materials including glass, CR39, higher index \nplastics, polycarbonate and laminates \n- \n \n2.8  \nFilter and tinted lens processes including: \n- \noptical industry standard \n- \nplastic lens tinting including dyes and tint types, equipment, \npreparation, problems and solutions \n- \ntransmission testing including equipment and \ninstrumentation, equipment limitations and optical industry \nstandard \n2.9      Standard nylon rims including the equipment needed \n2.10    Drilled rimless frames including mounts and rimless types and \n           equipment needed\n\n--- PDF PAGE 41 ---\nTR- Ophthalmic Lens Services NC II \n39\n3.    Underpinning skills\n3.1 \nPerforming frame tracing and lens pattern preparation \n3.2 \nHand edge using both hand beveling techniques and safety \nchamfering \n3.3 \nHandling glass and plastic lens material \n3.4 \nHandling metal and plastic frame material \n3.5 \nUsing appropriate techniques to inset lens and fit frames \n3.6 \nCalculating minimum size uncut (MSU): \n- \nMSU using centration chart and by calculation to allow for \n      PD and decentration for prism \n3.7    Transposing a prescription \n- \ncorrecting neutralization \n- \ndetermining powers \n- \ndetermining axes \n- \ndetermining prism \n- \ndetermining centration \n- \ndetermining additions \n3.8     Operating manual/automated edging machine    \n3.9     Using lens samples and to match samples \n3.10 Fitting standard semi-rimless frames  \n3.11 Applying grooving techniques \n3.12 Repairing and service semi-rimless frames \n3.13 Applying drilling techniques \n3.14 Mounting lens \n3.15 Performing frame adjustment \n3.16 Performing frame servicing \n3.17 Performing special hand edging techniques including: \n- \nnasal cut and nasal add (anti-nasal) \n- \nchange-overs  \n3.18 Using problem solving techniques reducing unwanted vertical \n           and/or horizontal prism \n3.19 Rectifying off-axis lenses \n4.    Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nreal or simulated work area \n4.2      appropriate optical appliance and /or equipment  \n4.3      materials relevant to the activity  \n4.4      prescription \n5.    Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nWritten examination \n5.2 \nDemonstration with questioning  \n5.3      Observation with questioning \n6.    Context for \nassessment \n6.1 \nCompetency may be assessed on the job or simulated \nenvironment. \n6.2 \nThe assessment of practical skills must take place after a period \nof supervised practice and repetitive experience.\n",
