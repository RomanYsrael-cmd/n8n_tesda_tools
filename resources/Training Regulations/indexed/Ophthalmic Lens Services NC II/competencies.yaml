  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required in\nOPHTHALMIC LENS SERVICES NC II. These units of competency are categorized into basic,\ncommon and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n: 500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources.\n1.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information.\n1.3\nAppropriate medium is used to transfer information and ideas.\n1.4\nAppropriate non- verbal communication is used.\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed.\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used.\n1.7\nPersonal interaction is carried out clearly and concisely.\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time.\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption.\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols..\n2.4\nWorkplace interactions are conducted in a courteous\nmanner.\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to.\n2.6\nMeetings outcomes are interpreted and implemented.\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly.\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments.\n3.3\nBasic mathematical processes are used for routine\ncalculations.\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon.\n3.5\nReporting requirements to supervisor are completed according\nto organizational guidelines.\n\n--- PDF PAGE 5 ---\nTR- Ophthalmic Lens Services NC II\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR- Ophthalmic Lens Services NC II\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard format of\nthe organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple written\nnotices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace measures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the workplace\n3.8\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview and written test\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 7 ---\nTR- Ophthalmic Lens Services NC II\n5\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\nUNIT CODE\n: 500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information.\n1.2\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources.\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified.\n2.2\nRoles and responsibility of other team members are identified\nand recognized.\n2.3\nReporting relationships within team and external to team are\nidentified.\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives.\n3.2\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context.\n3.3\nObserved protocols in reporting using standard operating\nprocedures.\n3.4\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 8 ---\nTR- Ophthalmic Lens Services NC II\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 9 ---\nTR- Ophthalmic Lens Services NC II\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the work\nactivities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR- Ophthalmic Lens Services NC II\n8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession.\n1.2\nIntra- and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance\nevaluation.\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties.\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments.\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures.\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements.\n3.2\nRecognitions are sought/received and demonstrated as\nproof of career advancement.\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed.\n\n--- PDF PAGE 11 ---\nTR- Ophthalmic Lens Services NC II\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 12 ---\nTR- Ophthalmic Lens Services NC II\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the course\nof managing oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge and\nattitudes\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 13 ---\nTR- Ophthalmic Lens Services NC II\n11\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures.\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures.\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures.\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold\nlimit values (TLV).\n2.2\nEffects of the hazards are determined.\n2.3\n OHS issues and/or concerns and identified safety hazards\nare reported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation.\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed.\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies.\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices.\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol.\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures.\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements.\n\n--- PDF PAGE 14 ---\nTR- Ophthalmic Lens Services NC II\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling designated emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 15 ---\nTR- Ophthalmic Lens Services NC II\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge and\n attitudes\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning\n skills\n3.1\n Practice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n5. Method of\n assessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n6. Context of\n assessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\nTR- Ophthalmic Lens Services NC II\n14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nHCS515204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to apply\nquality standards in the workplace. The unit also includes the\napplication of relevant safety procedures and regulations,\nsalon/organizational procedures and other client requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess clients\nservice needs\n\n1.1 Work instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2 Clients needs are checked against workplace standards and\nspecifications.\n1.3 Faults on clients and any identified causes are recorded\nand/or reported to the supervisor concerned in accordance\nwith workplace procedures.\n1.4 Clients profile and service extended to them are documented\nin accordance with workplace procedures.\n2. Assess own work\n2.1\nDocumentation relative to quality within the company is\nidentified and used.\n2.2\nCompleted work is checked against workplace standards\nrelevant to the task undertaken.\n2.3\nErrors are identified and improved on.\n2.4\nInformation on the quality and other indicators of individual\nperformance is recorded in accordance with workplace\nprocedures.\n2.5\nIn cases of deviations from specific quality standards,\ncauses are documented and reported in accordance with the\nworkplace’ standard operating procedures.\n3. Engage in quality\nimprovement\n3.1 Process improvement procedures are participated in relative to\nworkplace assignment.\n3.2 Work is carried out in accordance with process improvement\nprocedures.\n3.3 Performance of operation or quality of product of service to\nensure other client satisfaction is monitored.\n\n--- PDF PAGE 17 ---\nTR- Ophthalmic Lens Services NC II\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clients\n\nLimited to:\n1.1 Eye practitioners\n1.2 Optical shops/clinics\n1.3 Optical laboratory\n2. Faults\nMay include but not limited to:\n2.1 Result is within the accepted standards\n2.2 Procedures done but do not conform with any relevant standards\n2.3 Damaged caused to client\n3. Documentation\n3.1 Organization work procedures\n3.2 Manufacturer’s instruction manual\n3.3 Client requirements\n3.4 Forms\n4. Errors\nMay be related to the following:\n4.1 Deviation from the requirements of the client\n4.2 Deviation from the requirements of the salon/organization\n5. Quality Standards\nMay be related but not limited to the following:\n5.1 Supplies and materials\n5.2 Facilities\n5.3 Salon Product\n5.4 Service Processes and Procedures\n5.5 Client Service\n5.6 Environmental Regulations\n6. Client\n6.1 Co-worker\n6.2 Supplier/vendor\n6.3 Client\n6.4 Organization receiving the product or service\n\n--- PDF PAGE 18 ---\nTR- Ophthalmic Lens Services NC II\n16\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Carried out work in accordance with the company’s standard\noperating procedures.\n1.2 Performed task according to specifications.\n1.3 Reported errors or deviations not in accordance with standard\noperating procedures.\n1.4 Carried out work in accordance with the process improvement.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Relevant production processes, materials and products\n2.2 Characteristics of materials, software and hardware used in\nproduction processes\n2.3 Quality checking procedures\n2.4 Client relations\n2.5 Work place procedures\n2.6 Safety and environmental aspects of service processes\n2.7 Error identification and reporting\n2.8 Quality improvement processes\n3. Underpinning skills\n3.1 Reading skills required to interpret work instructions, product\nmanufacturer’s requirements\n3.2 Communication skills needed to interpret and apply defined work\nprocedures\n3.3 Carry out work in accordance with OHS policies and procedures\n3.4 Critical thinking\n3.5 Solution providing and decision making\n3.6 Interpersonal skills or dealing with varied type of clients\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Materials\n4.2 Product\n4.3 Equipment\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation with oral questioning\n5.2 Third Party Report\n5.3 Practical Demonstration\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 19 ---\nTR- Ophthalmic Lens Services NC II\n17\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:\nHCS516202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\neffectively managing own workload and quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever possible.\n1.5\nWork schedules are known and completed within agreed time\nframes.\n1.6\nWork plans developed according to assignment requirements\nand employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility for\ncompletion passed to incoming shift or other appropriate\npersons.\n2. Maintain quality of\nown performance\n2.1 Personal performance continually monitored against agreed\nperformance standards.\n2.2\nAdvice and guidance sought when necessary to achieve or\nmaintain agreed standards.\n2.3\nGuidance from management applied to achieve or maintain\nagreed standards.\n2.4\nStandard of work clarified and agreed according to employer\npolicy and procedures.\n3. Build credibility with\ncustomers/clients\n3.1 Client expectations for reliability, punctuality and appearance\nadhered to.\n3.2 Possible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.3 Client fully informed of all relevant security matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 20 ---\nTR- Ophthalmic Lens Services NC II\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal Instructions by senior officer\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nstandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 21 ---\nTR- Ophthalmic Lens Services NC II\n19\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Planned for completion of own workload.\n1.2 Assessed verbal or written work plan through observation and\n discussion of site and employer requirements.\n1.3 Demonstrated capacity to complete task within specified time\n frame.\n1.4 Maintained quality of own performance.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Site and assignment requirements\n2.2 Employer policy on performance management\n2.3 Indicators of appropriate performance for each area of\n responsibility\n2.4 Steps for improving or maintaining performance\n3. Underpinning skills\n3.1 Capacity to plan and prioritize security work loads and\n requirements\n3.2 Time and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions\n (if relevant)\n4.9 Assessment Instruments, including personal planner and\n assessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3 Observation with questioning\n6. Context of\nassessment\n6.1 Company\n6.2 On-Site\n6.3 Assessment activities are carried out through TESDA accredited\n assessment centers/venues by using closely simulated\n workplace environment.\n6.4 Continuous assessment in an institutional setting that stimulates\n the conditions of performance describe in the elements,\n performance criteria and range of variables statement that make\n up this unit.\n6.5 Continuous assessment in the workplace, taking into account\n the range of variables affecting performance.\n6.6 Self-assessment on the same terms as those described above.\n6.7 Simulated assessment or critical incident assessment, provided\n that the critical incident involves assessment against\n performance criteria and an evaluation of underpinning\n knowledge and skill required to achieve the required\n performance criteria.\n\n--- PDF PAGE 22 ---\nTR- Ophthalmic Lens Services NC II\n20\nUNIT OF COMPETENCY :\nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK\nENVIRONMENT\nUNIT CODE\n:\nHCS515205\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\nmaintain client relations. The unit incorporates the work safety\nguidelines. It encompasses competencies necessary to maintain a\nsafe workplace for staff, clients and others. It also involves the\napplication of health regulations, including personal hygiene\npracticed by staff members, provision of a caring client environment\nand the efficient operation of the salon.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Comply with health\nregulations\n\n1.1\nSalon policies and procedures for personal hygiene applied.\n1.2\nProcedures and practices implemented in a variety of salon\nsituations in accordance with state and local government\nhealth regulations.\n2. Assess own work\n2.1\nReception, work areas and walkways maintained in a safe,\nuncluttered and organized manner according to salon policy.\n2.2\nAll routines carried out safely, effectively with minimum\ninconvenience to clients and staff.\n2.3\nWaste is stored and disposed of according to OHSC\nrequirements.\n2.4\nSpills, food, waste, hair or potential hazards promptly\nremoved from floors according to salon policy.\n2.5\nSpills, food, waste, hair or other potential hazards promptly\nremoved from floors according to salon policy.\n2.6\nLinen is stored, cleaned and disinfected in line with OHS\nrequirements and salon procedures.\n2.7\nRefreshments are provided to all clients.\n3. Check and maintain\ntools and equipment\n3.1 Tools and equipment are stored safely and in position to\ncomply with salon requirements and local health regulations.\n3.2 Tools and equipment are prepared for specific services as\nrequired.\n3.3 Tools and equipment are checked for maintenance\nrequirements.\n3.4\n Tools and equipment are referred for repair as required.\n4. Check and maintain\nstocks\n\n4.1\nStock rotation procedures are carried out routinely and\naccurately according to salon procedures.\n4.2\nStock levels are accurately recorded according to salon\nprocedures.\n4.3\nUnder or over supplied stock items are notified immediately to\nthe salon supervisor.\n4.4\nIncorrectly ordered or delivered stock is referred to the salon\nsupervisor for return to supplier.\n4.5\nSafe lifting and carrying techniques maintained in line with\nsalon occupational health and safety policy and government\nlegislation.\n5. Provide a relaxed\nand caring\nenvironment\n5.1 Clients are made to feel comfortable according to salon policy.\n5.2 Clients’ needs are reported to.\n5.3 Clients are consulted on specific desired service.\n\n--- PDF PAGE 23 ---\nTR- Ophthalmic Lens Services NC II\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Relevant salon\npolicies and\nprocedures\n\nMay include but not limited to:\n1.1 Hazard Policies and Procedures\n1.2 Emergency, Fire and Accident Procedures\n1.3 Personal Safety Procedures\n1.4 Procedures for the use of Personal protective Clothing and\nEquipment\n1.5 Hazard Identification\n1.6 Job Procedures\n2. Occupational health\nand safety\nprocedures\nMay include but not limited to:\n2.1 Client\n2.2 Staff\n2.3 Equipment/Tools\n2.4 Premises\n2.5 Stock\n3. Unsafe situations\nMay include but not limited to:\n3.1 Damaged Packaging Material or Containers\n3.2 Broken or Damaged Equipment\n3.3 Inflammable Materials and Fire Hazards\n3.4 Lifting Practices\n3.5 Spillages\n3.6 Waste including hair especially on floors\n3.7 Trolleys\n4. Linkage\nMay be related to the following:\n4.1 Institutional\n4.2 Organizational Linkage\n4.3 Social Services\n4.4 International Market\n\n--- PDF PAGE 24 ---\nTR- Ophthalmic Lens Services NC II\n22\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Generated information on different client requirements and\nneeds.\n1.2 Selected and used strategies to accurately analyzed the client\nrequirements.\n1.3 Assessed current product and services as against client\ndemand.\n1.4 Identified avenues to establish relevant linkage..\n1.5 Selected promotional activities relevant to enhance\ncompetitiveness of salon.\n1.6 Assisted clients on specific desired services.\n1.7 Checked and prepared tools for the specific salon activities.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Media Options\n2.2 Data Gathering\n2.3 Salon Policies\n2.4 International Market\n2.5 Skills Competition Rules and Procedures\n2.6 New Trends in Products and Services\n2.7 Ethical Limitations\n3. Underpinning skills\n3.1 Communication skills to identify lines of communication, request\nadvice, follow instructions and receive feedback.\n3.2 Technology Skills\n3.3 Interpersonal Skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Client\n4.2 Relevant Information\n4.3 Appropriate Products\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Practical Demonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\n simulated environment\n\n--- PDF PAGE 25 ---\nTR- Ophthalmic Lens Services NC II\n23\nUNIT OF COMPETENCY :\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH\nCLIENTS/CUSTOMERS\nUNIT CODE\n:\nHCS516201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nbuilding and maintaining an effective relationship with clients,\ncustomers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Maintain a\nprofessional image\n\n1.1 Uniform and personal grooming maintained to assignment\nrequirements.\n1.2 Personal presence maintained according to employer\nstandards.\n1.3 Visible work area kept tidy and uncluttered.\n1.4 Equipment stored according to assignment requirements.\n2. Meet client/customer\nrequirements\n2.1 Client requirements identified and understood by referral to\nthe assignment instructions.\n2.2 Client requirements met according to the assignment\ninstructions.\n2.3 Changes to client’s needs and requirements monitored and\nappropriate action taken.\n2.4 All communication with the client or customer is clear and\ncomplies with assignment requirements.\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2 Possible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.3 Client fully informed of all relevant security matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 26 ---\nTR- Ophthalmic Lens Services NC II\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1 Stance\n1.2 Posture\n1.3 Body Language\n1.4 Demeanor\n1.5 Grooming\n2. Employer Standards\nMay include:\n2.1 Standing Orders\n3. Client Requirements\nMay include:\n3.1 Assignment Instructions\n3.2 Post Orders\n3.3 Scope to modify instructions/orders in light of changed situations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1 Writing\n4.2 Verbally\n4.3 Electronically\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment instructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1 Implementing required changes\n6.2 Referral to appropriate employer personnel\n6.3 Clarification of client needs and instructions\n7. Customers\nMay include:\n7.1 All members of the public\n\n--- PDF PAGE 27 ---\nTR- Ophthalmic Lens Services NC II\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained a professional image.\n1.2 Interpreted client/customer requirements from information\n contained in the client brief and/or assignment instructions.\n1.3 Dealt successfully with a variety of client/customer interactions.\n1.4 Monitored and acted on changing client or customer needs.\n1.5 Met client/customer requirements.\n1.6 Built credibility with customers/clients.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Uniform and personal grooming requirements of the employer\n and the client\n2.2 Occupational Health and safety requirement for the assignment\n2.3 Assignment Instructions\n3. Underpinning skills\n3.1 Attention to detail when completing client/employer\n documentation\n3.2 Interpersonal and communication skills required in client contact\n assignments\n3.3 Customer service skills required to meet client/customer needs\n3.4 Punctuality\n3.5 Customer Service\n3.6 Telephone Technique\n3.7 Problem Solving and Negotiation\n3.8 Maintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions\n (if relevant)\n4.9 Assessment Instruments, including personal planner and\n assessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test\n5.2 Demonstration with questioning\n5.3 Observation with questioning\n\n--- PDF PAGE 28 ---\nTR- Ophthalmic Lens Services NC II\n26\n6. Context for\nassessment\n6.1 Company\n6.2 On-Site\n6.3 Assessment activities are carried out through TESDA accredited\n assessment centers/venues by using closely simulated\n workplace environment.\n6.4 Continuous assessment in an institutional setting that stimulates\n the conditions of performance describe in the elements,\n performance criteria and range of variables statement that make\n up this unit.\n6.5 Continuous assessment in the workplace, taking into account\n the range of variables affecting performance.\n6.6 Self-assessment on the same terms as those described above.\n6.7 Simulated assessment or critical incident assessment, provided\n that the critical incident involves assessment against\n performance criteria and an evaluation of underpinning\n knowledge and skill required to achieve the required\n performance criteria.\n\n--- PDF PAGE 29 ---\nTR- Ophthalmic Lens Services NC II\n27\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:\nICT311201\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a personal\ncomputer by: starting the PC, logging in, using and working with\nfiles, folders and programs, saving work, and closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n\n1. Start the\ncomputer\n\n1.1 The peripheral devices are properly connected\n1.2 Power is checked and the computer and peripheral devices are\nswitched on\n1.3 Proper logging in and logging off is successfully done\n1.4 The operating system features and functions are accessed and\nnavigated\n1.5 Hardware configuration and other system features are checked\n2. Arrange and\ncustomize\ndesktop display/\nWindows\nsettings\n\n2.1 The desktop screen or Windows elements are changed as needed\n2.2 Desktop icons are added, renamed, moved, copied or deleted\n2.3 The online help functions are accessed or used as needed\n2.4 Desktop icons of application programs are selected, opened and\nclosed\n2.5 Properties of icons are displayed\n2.6 Computer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1 A file or folder is created, opened, moved, renamed or copied\n3.2 Files are located, deleted and restored\n3.3 Details and properties of files and folders are displayed or viewed\n3.4 Various files are organized for easy lookup and use\n3.5 Files and information are searched\n3.6 Disks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1 Application programs are added, changed, removed or ran\n4.2 User software or application program are installed, updated and\nupgraded\n4.3 Information/data are moved between documents or files\n5. Print\ninformation\n5.1 Printer is added or installed and correct printer settings is ensured\n5.2 Default printer is assigned accordingly\n5.3 Information or document is printed on the installed printer\n5.4 Progress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1 All open application programs are closed\n6.2 Computer and peripheral devices are properly shut down\n\n--- PDF PAGE 30 ---\nTR- Ophthalmic Lens Services NC II\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Peripheral device\nThis may include but is