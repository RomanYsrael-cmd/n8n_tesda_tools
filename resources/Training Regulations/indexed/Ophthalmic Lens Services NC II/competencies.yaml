        "source_text": "--- PDF PAGE 42 ---\nTR- Ophthalmic Lens Services NC II \n40\nUNIT OF COMPETENCY : \nAPPLY UV COAT/ TINT TO OPHTHALMIC LENSES  \n \nUNIT CODE \n: \nHSC222303 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency describes the skills and knowledge \nrequired to apply UV coat/ tint to ophthalmic lenses. \n \n \nELEMENT \nPERFORMANCE CRITERIA \n \nItalicized terms are elaborated in the Range of Variables \n1.  Check quality of \nlens \n1.1     Quality of lens surface conforms to specified standards \n1.2     Optical quality of lens is within acceptable tolerances  \n1.3   Lens selected complies with UV coat/ tint prescription needs \n2.  Apply work room \npractices \n2.1 \nSolvents, acids and cleaning products are labeled in \ncompliance with OH&S criteria \n2.2 \nHazards are recognized and relevant hazardous situations are \naddressed in accordance with OHS requirements  \n2.3 \nSafety practices are complied with in ordering, use, handling \nand storage of solvents, acids and cleaning products \n2.4 \nSolvents, acids and cleaning products are disposed in \naccordance with legislative and environmental regulations  \n2.5     Appropriate PPEs are used within the work room environment \nin accordance with OHS requirements\n3.  Identify type of UV \ncoat/tint  \n3.1     Lens order is interpreted based on specified prescription \n3.2     UV coat/tinting schedule is arranged based on due date \n3.3 \nCoating process is selected in accordance with prescription \nrequirements\n4.  Apply UV coat/ tint \nto lenses \n4.1 \nLens for UV coat/tint is prepared, ensuring holding apparatus \nwill not interfere with quality of coating  \n4.2 \nUV coating/ tinting is applied in accordance with manufacturer's \nrecommendations \n4.3\nUV coat is cured according to manufacturer's recommendations\n5.  Check UV coat/ tint \nfinish \n5.1  UV coat/ tint is verified in line with manufacturer/suppliers \nrecommendations and/or organizational policies and procedure  \n5.2  Lens surface is verified in line with manufacturer/suppliers \nrecommendations and/or organizational policies and procedure \n5.3     Lens surface quality is verified in line with manufacturer/ \nsuppliers recommendations and/or organizational policies and \nprocedure\n6.  Dispatch lens \n6.1 \nLens is packaged in order that no wastage occur  \n6.2 \nLens is dispatched in accordance with the lens order \n6.3 \nCompletion of job is confirmed in line with prescription \nrequirements\n\n--- PDF PAGE 43 ---\nTR- Ophthalmic Lens Services NC II \n41\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. UV Coat/ tint \n1.1     Tint colors available  \n1.2     UV coat \n2 Coating process \n2.1     Lens preparation \n2.2     Proper color mixing/ UV solution \n2.3     Application of color dye/ UV solution \n2.4     Selection of appropriate equipment/ apparatus \n3 Tools and \nequipment  \n3.1     Ultra-sonic cleaning equipment \n3.2     Solvent and acid  \n3.3   PPE\n\n--- PDF PAGE 44 ---\nTR- Ophthalmic Lens Services NC II \n42\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1     Checked quality of lens \n1.2 \nApplied work room practices \n1.3 \nIdentified type of UV coat/tint \n1.4 \nApplied UV coat/tint to lenses \n1.5 \nChecked UV coat/tint finish \n1.6\nDispatched lens\n2. Underpinning \nknowledge  \n2.1  Safety process \n2.2  Personal Protective Equipment (PPE)  \n2.3  Cleanliness \n2.4 \nManufacturing/process waste disposal  \n2.5 \nStandard operating procedures in line with \nmanufacturer/supplier and/or organization requirements  \n2.6 \nSafe use, handling, storage and disposal of chemicals in \naccordance to supplier's recommendations  \n2.7 \nChemical processes involved in lens tinting and UV coating   \n2.8 \n Types UV coat and tint   \n2.9 \n Lens types and lens materials \n2.10   Process flows and  production methodologies\n3. Underpinning skills \n3.1     Following OHS and standard operating procedures \n3.2      Applying good housekeeping practices \n3.3      Managing process flow \n3.4      Communicating with others \n3.5    Working independently\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nResources essential for assessment include: \n-    access to an optical appliance workplace \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1    Written examination \n5.2     Demonstration with questioning \n5.3   Observation with questioning\n6. Context for \nassessment \n6.1     Competency may be assessed on the job or simulated         \nenvironment. \n6.2      The assessment of practical skills must take place after a \n           period of supervised practice and repetitive experience.\n",
