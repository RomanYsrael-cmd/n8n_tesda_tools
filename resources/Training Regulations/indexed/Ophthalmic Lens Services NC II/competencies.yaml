        "source_title": "MAINTAIN A SAFE, CLEAN AND EFFICIENT WORK ENVIRONMENT",
        "source_text": "--- PDF PAGE 22 ---\nTR- Ophthalmic Lens Services NC II \n20\nUNIT OF COMPETENCY : \nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK \nENVIRONMENT \nUNIT CODE \n: \nHCS515205 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes needed to \nmaintain client relations. The unit incorporates the work safety \nguidelines. It encompasses competencies necessary to maintain a \nsafe workplace for staff, clients and others. It also involves the \napplication of health regulations, including personal hygiene \npracticed by staff members, provision of a caring client environment \nand the efficient operation of the salon. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Comply with health \nregulations \n \n1.1 \nSalon policies and procedures for personal hygiene applied. \n1.2 \nProcedures and practices implemented in a variety of salon \nsituations in accordance with state and local government \nhealth regulations.\n2. Assess own work \n2.1 \nReception, work areas and walkways maintained in a safe, \nuncluttered and organized manner according to salon policy. \n2.2 \nAll routines carried out safely, effectively with minimum \ninconvenience to clients and staff. \n2.3 \nWaste is stored and disposed of according to OHSC \nrequirements. \n2.4 \nSpills, food, waste, hair or potential hazards promptly \nremoved from floors according to salon policy. \n2.5 \nSpills, food, waste, hair or other potential hazards promptly \nremoved from floors according to salon policy. \n2.6 \nLinen is stored, cleaned and disinfected in line with OHS \nrequirements and salon procedures. \n2.7\nRefreshments are provided to all clients.\n3. Check and maintain \ntools and equipment \n3.1   Tools and equipment are stored safely and in position to \ncomply with salon requirements and local health regulations. \n3.2   Tools and equipment are prepared for specific services as \nrequired. \n3.3   Tools and equipment are checked for maintenance \nrequirements. \n3.4\n Tools and equipment are referred for repair as required.\n4.  Check and maintain \nstocks \n \n4.1 \nStock rotation procedures are carried out routinely and \naccurately according to salon procedures. \n4.2 \nStock levels are accurately recorded according to salon \nprocedures. \n4.3 \nUnder or over supplied stock items are notified immediately to \nthe salon supervisor. \n4.4 \nIncorrectly ordered or delivered stock is referred to the salon \nsupervisor for return to supplier. \n4.5 \nSafe lifting and carrying techniques maintained in line with \nsalon occupational health and safety policy and government \nlegislation.\n5.  Provide a relaxed \nand caring \nenvironment\n5.1 Clients are made to feel comfortable according to salon policy. \n5.2 Clients’ needs are reported to. \n5.3 Clients are consulted on specific desired service.\n\n--- PDF PAGE 23 ---\nTR- Ophthalmic Lens Services NC II \n21\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant salon \npolicies and \nprocedures \n            \n \nMay include but not limited to: \n1.1 Hazard Policies and Procedures \n1.2 Emergency, Fire and Accident Procedures \n1.3 Personal Safety Procedures \n1.4 Procedures for the use of Personal protective Clothing and \nEquipment \n1.5 Hazard Identification \n1.6 Job Procedures \n2. Occupational health \nand safety \nprocedures \nMay include but not limited to: \n2.1  Client  \n2.2 Staff \n2.3 Equipment/Tools \n2.4 Premises \n2.5 Stock \n3. Unsafe situations \nMay include but not limited to: \n3.1 Damaged Packaging Material or Containers \n3.2 Broken or Damaged Equipment \n3.3 Inflammable Materials and Fire Hazards \n3.4 Lifting Practices \n3.5 Spillages \n3.6 Waste including hair especially on floors \n3.7 Trolleys \n4. Linkage \nMay be related to the following: \n4.1 Institutional \n4.2 Organizational Linkage \n4.3 Social Services \n4.4 International Market\n\n--- PDF PAGE 24 ---\nTR- Ophthalmic Lens Services NC II \n22\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Generated information on different client requirements and \nneeds. \n1.2 Selected and used strategies to accurately analyzed the client \nrequirements. \n1.3 Assessed current product and services as against client \ndemand. \n1.4 Identified avenues to establish relevant linkage.. \n1.5 Selected promotional activities relevant to enhance \ncompetitiveness of salon. \n1.6  Assisted clients on specific desired services. \n1.7 Checked and prepared tools for the specific salon activities. \n2. Underpinning \nknowledge and \nattitudes \n2.1 Media Options \n2.2 Data Gathering \n2.3 Salon Policies \n2.4 International Market \n2.5 Skills Competition Rules and Procedures \n2.6 New Trends in Products and Services \n2.7 Ethical Limitations \n3. Underpinning skills \n3.1 Communication skills to identify lines of communication, request \nadvice, follow instructions and receive feedback. \n3.2 Technology Skills \n3.3 Interpersonal Skills \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Client \n4.2 Relevant Information \n4.3 Appropriate Products \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1   Observation with questioning \n5.2   Practical Demonstration with questioning \n6. Context of \nassessment \n6.1 Assessment may be conducted in the workplace or in a \n       simulated environment\n",
