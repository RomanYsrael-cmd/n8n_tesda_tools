        "source_title": "MANAGE OWN PERFORMANCE",
        "source_text": "--- PDF PAGE 19 ---\nTR- Ophthalmic Lens Services NC II \n17\nUNIT OF COMPETENCY : \nMANAGE OWN PERFORMANCE \n \nUNIT CODE \n: \nHCS516202 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required in \neffectively managing own workload and quality of work. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Plan for completion of \nown workload  \n \n1.1 \nTasks accurately identified. \n1.2 \nPriority allocated to each task. \n1.3 \nTime lines allocated to each task or series of tasks. \n1.4 \nTasks deadlines known and complied with whenever possible. \n1.5 \nWork schedules are known and completed within agreed time \nframes. \n1.6 \nWork plans developed according to assignment requirements \nand employer policy. \n1.7 \nUncompleted work or tasks detailed and responsibility for \ncompletion passed to incoming shift or other appropriate \npersons. \n2.  Maintain quality of \nown performance \n2.1   Personal performance continually monitored against agreed \nperformance standards. \n2.2 \nAdvice and guidance sought when necessary to achieve or \nmaintain agreed standards. \n2.3 \nGuidance from management applied to achieve or maintain \nagreed standards. \n2.4 \nStandard of work clarified and agreed according to employer \npolicy and procedures. \n3.  Build credibility with \ncustomers/clients \n3.1    Client expectations for reliability, punctuality and appearance \nadhered to. \n3.2    Possible causes of client/customer dissatisfaction identified, \ndealt with and recorded according to employer policy. \n3.3    Client fully informed of all relevant security matters in a timely \nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 20 ---\nTR- Ophthalmic Lens Services NC II \n18\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tasks \n            \n \n1.1 \nMay identified through: \n1.1.1 Assignment instructions \n1.1.2 Verbal Instructions by senior officer \n1.1.3 Policy Documents \n1.1.4 Duty Statements \n1.1.5 Self Assessment \n1.2 \nMay be: \n1.2.1 Daily tasks \n1.2.2 Weekly tasks \n1.2.3 Regularly or irregularly occurring tasks \n2. Performance \nstandards \nMay include: \n2.1 \nAssignment Instructions \n2.2 \nProcedures established in policy documents\n\n--- PDF PAGE 21 ---\nTR- Ophthalmic Lens Services NC II \n19\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Planned for completion of own workload. \n1.2 Assessed verbal or written work plan through observation and \n       discussion of site and employer requirements. \n1.3 Demonstrated capacity to complete task within specified time \n       frame. \n1.4 Maintained quality of own performance.\n2. Underpinning \nknowledge and \nattitudes \n2.1 Site and assignment requirements \n2.2 Employer policy on performance management \n2.3 Indicators of appropriate performance for each area of \n       responsibility \n2.4 Steps for improving or maintaining performance\n3. Underpinning skills \n3.1 Capacity to plan and prioritize security work loads and \n       requirements \n3.2 Time and task management\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Assessment Centers/Venues \n4.2 Accredited Assessors \n4.3 Modes of Assessment \n4.4 Evaluation Reports \n4.5 Access to a relevant venue, equipment and materials \n4.6 Assignment Instructions \n4.7 Logbooks \n4.8 Operational manuals and makers’/customers’ instructions  \n       (if relevant) \n4.9 Assessment Instruments, including personal planner and \n      assessment record book\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1   Written Test/Examination \n5.2   Demonstration with questioning \n5.3 Observation with questioning\n6. Context of \nassessment \n6.1 Company \n6.2 On-Site \n6.3 Assessment activities are carried out through TESDA accredited \n       assessment centers/venues by using closely simulated \n       workplace environment. \n6.4 Continuous assessment in an institutional setting that stimulates \n       the conditions of performance describe in the elements, \n       performance criteria and range of variables statement that make \n       up this unit. \n6.5 Continuous assessment in the workplace, taking into account \n       the range of variables affecting performance. \n6.6 Self-assessment on the same terms as those described above. \n6.7 Simulated assessment or critical incident assessment, provided \n       that the critical incident involves assessment against \n       performance criteria and an evaluation of underpinning \n       knowledge and skill required to achieve the required \n      performance criteria.\n",
