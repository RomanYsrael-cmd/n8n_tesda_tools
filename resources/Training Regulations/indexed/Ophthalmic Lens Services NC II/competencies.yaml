        "source_title": "MAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS/CUSTOMERS",
        "source_text": "--- PDF PAGE 25 ---\nTR- Ophthalmic Lens Services NC II \n23\nUNIT OF COMPETENCY : \nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH \nCLIENTS/CUSTOMERS \nUNIT CODE \n: \nHCS516201 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required in \nbuilding and maintaining an effective relationship with clients, \ncustomers and the public. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated in the Range of Variables \n1.  Maintain a \nprofessional   image  \n \n1.1     Uniform and personal grooming maintained to assignment \nrequirements. \n1.2     Personal presence maintained according to employer \nstandards. \n1.3     Visible work area kept tidy and uncluttered. \n1.4     Equipment stored according to assignment requirements. \n2.  Meet client/customer \nrequirements \n2.1    Client requirements identified and understood by referral to \nthe assignment instructions. \n2.2    Client requirements met according to the assignment \ninstructions. \n2.3    Changes to client’s needs and requirements monitored and \nappropriate action taken. \n2.4     All communication with the client or customer is clear and \ncomplies with assignment requirements. \n3.   Build credibility with \ncustomers/clients \n3.1 \nClient expectations for reliability, punctuality and appearance    \nadhered to. \n3.2      Possible causes of client/customer dissatisfaction identified, \ndealt with and recorded according to employer policy. \n3.3      Client fully informed of all relevant security matters in a timely \nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 26 ---\nTR- Ophthalmic Lens Services NC II \n24\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal Presence \n            \n \nMay include: \n1.1 Stance \n1.2 Posture \n1.3 Body Language \n1.4 Demeanor \n1.5  Grooming \n2. Employer Standards \nMay include: \n2.1  Standing Orders \n3. Client Requirements \nMay include: \n3.1   Assignment Instructions \n3.2   Post Orders \n3.3   Scope to modify instructions/orders in light of changed situations\n4. Assignment \nInstructions \nMay be conveyed in: \n4.1 Writing \n4.2 Verbally \n4.3 Electronically \n5. Client’s Needs and \nRequirements \nMay be detected by: \n5.1 \nReview of the client brief and/or assignment instructions \n5.2 \nDiscussion with the client/customer \n6. Appropriate Action \nMay include: \n6.1 Implementing required changes \n6.2 Referral to appropriate employer personnel \n6.3 Clarification of client needs and instructions \n7. Customers \nMay include: \n7.1  All members of the public\n\n--- PDF PAGE 27 ---\nTR- Ophthalmic Lens Services NC II \n25\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Maintained a professional image. \n1.2 Interpreted client/customer requirements from information \n       contained in the client brief and/or assignment instructions. \n1.3 Dealt successfully with a variety of client/customer interactions. \n1.4 Monitored and acted on changing client or customer needs. \n1.5 Met client/customer requirements. \n1.6 Built credibility with customers/clients.\n2. Underpinning \nknowledge and \nattitudes \n2.1 Uniform and personal grooming requirements of the employer \n       and the client \n2.2 Occupational Health and safety requirement for the assignment \n2.3 Assignment Instructions\n3. Underpinning skills \n3.1 Attention to detail when completing client/employer \n       documentation \n3.2 Interpersonal and communication skills required in client contact \n       assignments \n3.3 Customer service skills required to meet client/customer needs \n3.4 Punctuality \n3.5 Customer Service \n3.6 Telephone Technique \n3.7 Problem Solving and Negotiation \n3.8 Maintaining Records\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Assessment Centers/Venues \n4.2 Accredited Assessors \n4.3 Modes of Assessment \n4.4 Evaluation Reports \n4.5 Access to a relevant venue, equipment and materials \n4.6 Assignment Instructions \n4.7 Logbooks \n4.8 Operational manuals and makers’/customers’ instructions  \n       (if relevant) \n4.9 Assessment Instruments, including personal planner and \n      assessment record book\n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1   Written Test \n5.2   Demonstration with questioning \n5.3 Observation with questioning\n\n--- PDF PAGE 28 ---\nTR- Ophthalmic Lens Services NC II \n26\n6.  Context for \nassessment \n6.1 Company \n6.2 On-Site \n6.3 Assessment activities are carried out through TESDA accredited \n       assessment centers/venues by using closely simulated \n       workplace environment. \n6.4 Continuous assessment in an institutional setting that stimulates \n       the conditions of performance describe in the elements, \n       performance criteria and range of variables statement that make \n       up this unit. \n6.5 Continuous assessment in the workplace, taking into account \n       the range of variables affecting performance. \n6.6 Self-assessment on the same terms as those described above. \n6.7 Simulated assessment or critical incident assessment, provided \n       that the critical incident involves assessment against \n       performance criteria and an evaluation of underpinning \n       knowledge and skill required to achieve the required \n      performance criteria.\n",
