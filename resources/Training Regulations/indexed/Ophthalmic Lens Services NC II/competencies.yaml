ave\nresults of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware components\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or disk\nstorage\n3.2 Mouse and keyboarding skills for running software applications\n3.3 Reading and writing at a level where basic workplace documents\nare understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions using a\npersonal computer whether standalone or in a networked\nenvironment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nwork environment.\n\n--- PDF PAGE 33 ---\nTR- Ophthalmic Lens Services NC II\n31\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nANALYZE AND INTERPRET OPHTHALMIC LENS\nPRESCRIPTION\n\nUNIT CODE\n:\nHSC222301\n\nUNIT DESCRIPTOR\n:\nThis unit of competency describes the skills and knowledge\nrequired to analyze and interpret ophthalmic lens prescription.\n\nELEMENT\nPERFORMANCE CRITERIA\n\nItalicized terms are elaborated in the Range of Variables\n1. Analyze ophthalmic\nlens prescription\n1.1 Patient’s ophthalmic refractive error is recognized and\ndetermined based on optometrist/ophthalmologist’s\nprescription\n1.2 Types of lenses are supplied based on optometrist/\nophthalmologist’s prescription\n1.3 Incomplete/incorrect prescriptions are determined and referred\nto appropriate personnel for action\n1.4 Parameters of atypical prescriptions are interpreted and\nanalyzed to determine specific application\n2. Interpret\nprescription details\n2.1 Lens calculations are performed in accordance with specified\nstandards\n2.2 Frames are verified based on prescription/order to ensure\ncorrect frame is used\n2.3\nOphthalmic lenses are selected based on prescription\nrequirements\n2.4\nBasic mathematical operations are performed accurately\n2.5\nPrescription parameters, needs and mounting criteria are\nstudied and interpreted following specified standards\n2.6\nLens order is interpreted following specified standards\n2.7\nLens manufacturer/supplier’s recommendations are considered\n\n--- PDF PAGE 34 ---\nTR- Ophthalmic Lens Services NC II\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Prescription\nincludes:\n1.1 Spherical power\n1.2 Cylindrical power\n1.3 Axis\n1.4 Addition power\n1.5 Pupillary distance\n1.6 Pupil height/ segment height\n1.7 Prism description\n2. Lens calculations\n2.1\nBase curve\n2.2\nLens diameter\n2.3\nLens thickness\n2.4\nTransposition\n2.5\nLayout\n3. Basic mathematical\noperations\n3.1 Four fundamental operations\n3.2 Simple algebraic operations\n\n--- PDF PAGE 35 ---\nTR- Ophthalmic Lens Services NC II\n33\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAnalyzed ophthalmic lens prescription\n1.2\nInterpreted prescription details\n2. Underpinning\nknowledge\n2.1 Ophthalmic lens prescription details\n2.2 Basic mathematical operations\n3. Underpinning skills\n3.1 Following OHS and standard operating procedures\n3.2 Applying good housekeeping practices\n3.3 Managing process flow\n3.4 Working independently\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nreal or simulated work area\n4.2 materials relevant to the activity\n4.3 prescription\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nWritten examination\n5.2 Demonstration with questioning\n5.3 Observation with questioning\n6. Context for\nassessment\n6.1 Competency may be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 36 ---\nTR- Ophthalmic Lens Services NC II\n34\nUNIT OF COMPETENCY :\nEDGE AND MOUNT OPHTHALMIC APPLIANCES\n\nUNIT CODE\n:\nHSC222302\n\nUNIT DESCRIPTOR\n:\nThis unit of competency describes the skills and knowledge\nrequired to edge and fit ophthalmic lenses.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Operate equipment\n\n1.1\nRelevant lens edging and fitting equipment is operated in\naccordance with manufacturer’s required operating procedures\n1.2\nEquipment and attachments are maintained in accordance with\nmanufacturer's requirements and safety control procedures\n1.3\nEquipment and attachments are stored in accordance with\nmanufacturer's requirements and safety control procedures\n2. Perform skills in\nedging and\nmounting\n\n2.1 Lens parameters are verified in accordance with the\nprescription requirements\n2.2 Lens are edged and mounted in accordance with standard\noperating procedures\n2.3 Mounted lenses are verified in accordance with prescription\nrequirements\n2.4 Atypical appliances are mounted in accordance with\nprescription requirements\n3. Utilize computer\ntechnology\n3.1 Appropriate technology and software applications are\nselected to achieve the requirements of the task\n3.2 Workspace, furniture and equipment are adjusted to suit the\nergonomic requirements of the user\n3.3 Technology is used according to organization requirements\nand in a way which promotes a safe work environment\n3.4 Ophthalmic equipment are used in accordance with the\nmanufacturer's recommendations/instructions\n3.5 Routine maintenance is carried out or arranged in order to\nensure that equipment is maintained in accordance with\nmanufacturer's instructions and organization requirements\n3.6 Equipment faults are identified and appropriate action is taken\nin accordance with manufacturer's instructions or by reporting\nfault to designated person\n4. Perform frame\nmodifications\n4.1 Frames are inspected for faults prior to glazing in accordance\nwith SOP\n4.2 Frames are adjusted in accordance with relevant standards\n4.3 Frames are repaired in accordance with relevant standards\n\n--- PDF PAGE 37 ---\nTR- Ophthalmic Lens Services NC II\n35\n5. Conduct final\nchecking\nprocedures\n\n5.1\nOphthalmic appliance is confirmed against the prescription prior\nto delivery\n5.2\nCorrect type and form of lens used is checked in line with client\nrequirements\n5.3\nLens treatments are checked for quality in accordance with\nprescription requirements\n5.4\nFrame used is checked in line with prescription requirements\n5.5\nStandard frame alignment is carried out and confirmed in\naccordance with specified standards\n5.6\nCompletion of job is confirmed in line with prescription\nrequirements\n\n--- PDF PAGE 38 ---\nTR- Ophthalmic Lens Services NC II\n36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\n1.1\nThe following pieces of equipment and instruments\n-\nmanual edging machine\n-\nautomated edging machine and accessories\n-\nfoci-meters (lens meters)\n-\nmarking/ centration devices\n-\ncalibration and measuring tools\n-\nframe alignment tools\n2. Lens parameters\n2.1 spherical power\n2.2 cylindrical power\n2.3 axis\n2.4 addition power\n2.5 pupillary distance\n2.6 pupil height/segment height\n2.7 prism\n3. Lens\n3.1\nMineral (Glass) material\n3.2\nOrganic (Plastic) material\n3.3 Polycarbonate material\n4. Frame material\n4.1\nMetal\n4.2\nPlastic\n5. Relevant standards\n5.1 International Standards Organization (ISO)\n6. Repairing and\nmodifying spectacle\nframes\n6.1\nUndertaking frame part replacements\n-\ntemples\n-\ntemple tips\n-\nbridge\n-\nnose pads\n-\nscrews\n6.2 Refitting nylon\n6.3 Re-pinning and riveting joints/ hinges\n6.4 Sink joints/ hinges\n6.5 Alignment\n\n--- PDF PAGE 39 ---\nTR- Ophthalmic Lens Services NC II\n37\n7. Atypical\n7.1 Occupationally specific appliances including diving masks,\n swimming goggles\n7.2 Low visual aids\n7.3 Wrap frames\n8. Technology\nMay include:\n8.1 Computer technology, such as laptops and desktops\n8.2 Digital cameras\n8.3 Memory devices\n8.4 Modems\n8.5 Scanners\n8.6 Printers\n8.7 Industry specific equipment\n9. Software\napplications\nMay include:\n9.1 Email, internet\n9.2 Word processing, spreadsheet, database or presentation\npackages\n9.3 Industry specific software\n10. Routine\nmaintenance\nMay include:\n10.1 Regular checking of equipment\n10.2 Replacing consumables\n10.3 'In-house' cleaning and servicing of equipment according to\nmanufacturer's guidelines\n10.4 Periodic servicing by qualified or manufacturer approved\ntechnician\n11. Equipment faults or\nproblems\nMay be identified or anticipated by:\n11.1 Routine checking of equipment\n11.2 Preparation of a maintenance program\n11.3 Encouraging feedback from work colleagues\n\n--- PDF PAGE 40 ---\nTR- Ophthalmic Lens Services NC II\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\noperated optical equipment\n1.2 performed skills in edging and mounting\n1.3 utilized computer technology\n1.4 performed frame adjustments\n1.5 conducted final verification procedures\n2. Underpinning\nknowledge\n2.1\nRelevant optical industry standard\n2.2\nFrame measurement systems including boxing and datum\n2.3\nProperties of lens\n2.4\nScope of metal and plastic frame materials including heating,\nmanipulation, adjusting, handling and repair\n2.5 Manual/automated edging machine including:\n-\nmachine design\n-\nblocking/ chucking systems\n-\nedging wheel designs and characteristics\n-\nmachine operation\n\n2.6 Glazing techniques\n2.7 Impact resistant safety lenses including:\n-\nuses\n-\nimpact resistance\n-\nprinciples and processing of thermal and chemical\ntoughening\n-\nproblems and special lens requirements\n-\nadvantages and disadvantages\n-\noptical industry standards for both general purpose and\nindustrial use\n-\nimpact testing requirements, conditions and procedures\n-\nevaluation of materials including glass, CR39, higher index\nplastics, polycarbonate and laminates\n-\n\n2.8\nFilter and tinted lens processes including:\n-\noptical industry standard\n-\nplastic lens tinting including dyes and tint types, equipment,\npreparation, problems and solutions\n-\ntransmission testing including equipment and\ninstrumentation, equipment limitations and optical industry\nstandard\n2.9 Standard nylon rims including the equipment needed\n2.10 Drilled rimless frames including mounts and rimless types and\n equipment needed\n\n--- PDF PAGE 41 ---\nTR- Ophthalmic Lens Services NC II\n39\n3. Underpinning skills\n3.1\nPerforming frame tracing and lens pattern preparation\n3.2\nHand edge using both hand beveling techniques and safety\nchamfering\n3.3\nHandling glass and plastic lens material\n3.4\nHandling metal and plastic frame material\n3.5\nUsing appropriate techniques to inset lens and fit frames\n3.6\nCalculating minimum size uncut (MSU):\n-\nMSU using centration chart and by calculation to allow for\n PD and decentration for prism\n3.7 Transposing a prescription\n-\ncorrecting neutralization\n-\ndetermining powers\n-\ndetermining axes\n-\ndetermining prism\n-\ndetermining centration\n-\ndetermining additions\n3.8 Operating manual/automated edging machine\n3.9 Using lens samples and to match samples\n3.10 Fitting standard semi-rimless frames\n3.11 Applying grooving techniques\n3.12 Repairing and service semi-rimless frames\n3.13 Applying drilling techniques\n3.14 Mounting lens\n3.15 Performing frame adjustment\n3.16 Performing frame servicing\n3.17 Performing special hand edging techniques including:\n-\nnasal cut and nasal add (anti-nasal)\n-\nchange-overs\n3.18 Using problem solving techniques reducing unwanted vertical\n and/or horizontal prism\n3.19 Rectifying off-axis lenses\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nreal or simulated work area\n4.2 appropriate optical appliance and /or equipment\n4.3 materials relevant to the activity\n4.4 prescription\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nWritten examination\n5.2\nDemonstration with questioning\n5.3 Observation with questioning\n6. Context for\nassessment\n6.1\nCompetency may be assessed on the job or simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 42 ---\nTR- Ophthalmic Lens Services NC II\n40\nUNIT OF COMPETENCY :\nAPPLY UV COAT/ TINT TO OPHTHALMIC LENSES\n\nUNIT CODE\n:\nHSC222303\n\nUNIT DESCRIPTOR\n:\nThis unit of competency describes the skills and knowledge\nrequired to apply UV coat/ tint to ophthalmic lenses.\n\nELEMENT\nPERFORMANCE CRITERIA\n\nItalicized terms are elaborated in the Range of Variables\n1. Check quality of\nlens\n1.1 Quality of lens surface conforms to specified standards\n1.2 Optical quality of lens is within acceptable tolerances\n1.3 Lens selected complies with UV coat/ tint prescription needs\n2. Apply work room\npractices\n2.1\nSolvents, acids and cleaning products are labeled in\ncompliance with OH&S criteria\n2.2\nHazards are recognized and relevant hazardous situations are\naddressed in accordance with OHS requirements\n2.3\nSafety practices are complied with in ordering, use, handling\nand storage of solvents, acids and cleaning products\n2.4\nSolvents, acids and cleaning products are disposed in\naccordance with legislative and environmental regulations\n2.5 Appropriate PPEs are used within the work room environment\nin accordance with OHS requirements\n3. Identify type of UV\ncoat/tint\n3.1 Lens order is interpreted based on specified prescription\n3.2 UV coat/tinting schedule is arranged based on due date\n3.3\nCoating process is selected in accordance with prescription\nrequirements\n4. Apply UV coat/ tint\nto lenses\n4.1\nLens for UV coat/tint is prepared, ensuring holding apparatus\nwill not interfere with quality of coating\n4.2\nUV coating/ tinting is applied in accordance with manufacturer's\nrecommendations\n4.3\nUV coat is cured according to manufacturer's recommendations\n5. Check UV coat/ tint\nfinish\n5.1 UV coat/ tint is verified in line with manufacturer/suppliers\nrecommendations and/or organizational policies and procedure\n5.2 Lens surface is verified in line with manufacturer/suppliers\nrecommendations and/or organizational policies and procedure\n5.3 Lens surface quality is verified in line with manufacturer/\nsuppliers recommendations and/or organizational policies and\nprocedure\n6. Dispatch lens\n6.1\nLens is packaged in order that no wastage occur\n6.2\nLens is dispatched in accordance with the lens order\n6.3\nCompletion of job is confirmed in line with prescription\nrequirements\n\n--- PDF PAGE 43 ---\nTR- Ophthalmic Lens Services NC II\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. UV Coat/ tint\n1.1 Tint colors available\n1.2 UV coat\n2 Coating process\n2.1 Lens preparation\n2.2 Proper color mixing/ UV solution\n2.3 Application of color dye/ UV solution\n2.4 Selection of appropriate equipment/ apparatus\n3 Tools and\nequipment\n3.1 Ultra-sonic cleaning equipment\n3.2 Solvent and acid\n3.3 PPE\n\n--- PDF PAGE 44 ---\nTR- Ophthalmic Lens Services NC II\n42\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Checked quality of lens\n1.2\nApplied work room practices\n1.3\nIdentified type of UV coat/tint\n1.4\nApplied UV coat/tint to lenses\n1.5\nChecked UV coat/tint finish\n1.6\nDispatched lens\n2. Underpinning\nknowledge\n2.1 Safety process\n2.2 Personal Protective Equipment (PPE)\n2.3 Cleanliness\n2.4\nManufacturing/process waste disposal\n2.5\nStandard operating procedures in line with\nmanufacturer/supplier and/or organization requirements\n2.6\nSafe use, handling, storage and disposal of chemicals in\naccordance to supplier's recommendations\n2.7\nChemical processes involved in lens tinting and UV coating\n2.8\n Types UV coat and tint\n2.9\n Lens types and lens materials\n2.10 Process flows and production methodologies\n3. Underpinning skills\n3.1 Following OHS and standard operating procedures\n3.2 Applying good housekeeping practices\n3.3 Managing process flow\n3.4 Communicating with others\n3.5 Working independently\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nResources essential for assessment include:\n- access to an optical appliance workplace\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written examination\n5.2 Demonstration with questioning\n5.3 Observation with questioning\n6. Context for\nassessment\n6.1 Competency may be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 45 ---\nTR- Ophthalmic Lens Services NC II\n43"
