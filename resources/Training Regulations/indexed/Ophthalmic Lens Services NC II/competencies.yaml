        "source_title": "ANALYZE AND INTERPRET OPHTHALMIC LENS PRESCRIPTION",
        "source_text": "--- PDF PAGE 33 ---\nTR- Ophthalmic Lens Services NC II \n31\nCORE COMPETENCIES \n \n \n \n \nUNIT OF COMPETENCY   : \nANALYZE AND INTERPRET OPHTHALMIC LENS \nPRESCRIPTION \n \nUNIT CODE \n: \nHSC222301 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency describes the skills and knowledge \nrequired to analyze and interpret ophthalmic lens prescription. \n \n \nELEMENT \nPERFORMANCE CRITERIA \n \nItalicized terms are elaborated in the Range of Variables \n1.  Analyze ophthalmic \nlens prescription \n1.1     Patient’s ophthalmic refractive error is recognized and \ndetermined based on optometrist/ophthalmologist’s  \nprescription \n1.2     Types of lenses are supplied based on optometrist/ \nophthalmologist’s  prescription \n1.3     Incomplete/incorrect prescriptions are determined and referred \nto appropriate personnel for action \n1.4     Parameters of atypical prescriptions are interpreted and \nanalyzed to determine specific application  \n2.  Interpret \nprescription details \n2.1  Lens calculations are performed in accordance with  specified \nstandards \n2.2  Frames are verified based on prescription/order to ensure \ncorrect frame is used \n2.3 \nOphthalmic lenses are selected based on prescription \nrequirements  \n2.4 \nBasic mathematical operations are performed accurately \n2.5 \nPrescription parameters, needs and mounting criteria are \nstudied and interpreted following specified standards \n2.6 \nLens order is interpreted following specified standards \n2.7 \nLens manufacturer/supplier’s recommendations are considered\n\n--- PDF PAGE 34 ---\nTR- Ophthalmic Lens Services NC II \n32\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Prescription \nincludes: \n1.1    Spherical power \n1.2    Cylindrical power \n1.3    Axis \n1.4    Addition power \n1.5    Pupillary distance \n1.6    Pupil height/ segment height \n1.7    Prism description \n2. Lens calculations \n2.1 \nBase curve \n2.2 \nLens diameter \n2.3 \nLens thickness \n2.4 \nTransposition \n2.5 \nLayout \n3. Basic mathematical \noperations  \n3.1     Four fundamental operations \n3.2     Simple algebraic operations\n\n--- PDF PAGE 35 ---\nTR- Ophthalmic Lens Services NC II \n33\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nAnalyzed ophthalmic lens prescription \n1.2 \nInterpreted prescription details \n2. Underpinning \nknowledge  \n2.1  Ophthalmic lens prescription details \n2.2  Basic mathematical operations \n3. Underpinning skills \n3.1     Following OHS and standard operating procedures \n3.2     Applying good housekeeping practices \n3.3     Managing process flow \n3.4     Working independently \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nreal or simulated work area \n4.2      materials relevant to the activity  \n4.3      prescription \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nWritten examination \n5.2     Demonstration with questioning \n5.3     Observation with questioning \n6. Context for \nassessment \n6.1     Competency may be assessed on the job or simulated \nenvironment. \n6.2     The assessment of practical skills must take place after a period \nof supervised practice and repetitive experience.\n",
