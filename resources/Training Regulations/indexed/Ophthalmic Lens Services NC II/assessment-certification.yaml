  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n 4.1\nTo attain the national Qualification of Ophthalmic Lens Services NC II the candidate\nmust demonstrate competence through project-type assessment covering all the\nunits listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n 4.2 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n 4.3 The following are qualified to apply for assessment and certification:\n\n 4.3.1 Graduates of formal, non-formal and informal including enterprise-based\n training programs\n\n 4.3.2 Experienced workers (wage employed or self employed)\n\n 4.4 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\"\n\n--- PDF PAGE 53 ---\nTR- Ophthalmic Lens Services NC II\n\n51\n\nCOMPETENCY MAP\nOPHTHALMIC LENS SERVICES NC II\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n\nAnalyze and\ninterpret ophthalmic\nlens prescription\n\nEdge and mount\nophthalmic\nappliances\n\nManage own\nperformance\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\n\nApply quality\nstandards\n\nMaintain a safe,\nclean and efficient\nenvironment\n\nApply UV coat/\ntint to ophthalmic\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedure\n\nOperate a\npersonal\ncomputer\nMaintain an effective\nrelationship with\nclients/customers\n\n--- PDF PAGE 54 ---\n\n--- PDF PAGE 55 ---\nTR- Ophthalmic Lens Services NC II\n\n52\nDEFINITION OF TERMS\n\n1.\nLENS - is used to denote a portion of a transparent substance bounded by two smooth\npolished surfaces, both of which may be curved, or only one is curved and the other being\nplane.\n2.\nDIOPTER - is the unit of measurement of the refractive power of the lens.\n3.\nOPHTHALMIC LENSES - are lenses used for correcting ametropia.\n4.\nLENS BLOCK – tool used to hold lens surface\n5.\nNEUTRALIZATION – process of finding the power of unknown lens.\n6.\nPRESCRIPTION – is the designation of an optical system that is intended to relieve certain\ndifficulties of the patient that are related to vision.\n7.\nBENCHWORK – entails the second phase towards the completion of an ophthalmic\nprescription. It is the operation done, after the lens has been finished from the grinding\nlaboratory, in order to insert or mount the lens to a spectacle frame or mounting with utmost\nprecision to satisfy the requirements for a given prescription.\n8.\nDATUM LINE – is a reference line particularly the horizontal line through the geometric\ncenter of a lens shape.\n9.\nCENTERING – is the process of marking and determining the optical center, the axis of the\ncylinder, and base-apex line of a prism. All centering marks are done on the front surface of\nthe lens.\n10.\nGLAZING – is the process of inserting or mounting lenses in spectacle frame.\n11.\nDRILLING - is the process of boring holes through the surface of the lens for retention\npurposes by the use of drilling machine and drilling fluids.\n12.\nMOUNTING – entails the placement of an ophthalmic lens in a rimless frame.\n13.\nPRISM – is a transparent wedge of refracting materials with triangular ends and three\nfaces, two of which meet in line called apex and rest upon a third face called base.\n14.\nFRAME – is a type in which the lenses are encircled by eyewire.\n15.\nBRIDGE – that part of a frame that arches over the nose and connects the two eyewires..\n16.\nFRONT – is the entire pair of glasses except the temples.\n\n--- PDF PAGE 56 ---\nTR- Ophthalmic Lens Services NC II\n\n3\n5\n17.\nPADS – are plastic nosepieces on the arms to support and distribute the weight of glasses\non the nose.\n18.\nTEMPLES – are sidepieces that hinged into the endpiece and fit over the ears.\n19.\nFITTING – is the process of selecting lenses and frames or mountings, taking essential\nmeasurements, determining the size and position relationship, all of which ultimately be\ncombined into an efficient, attractive, comfortable ophthalmic correction.\n20.\nABSORPTION – the process in which radiant energy is converted into other forms, usually\nheat by passage through or reflection from a medium.\n21.\nFILTRATION – the process in which wave lengths of light is transmitted or equally absorb\nthrough a medium/filter.\n\n--- PDF PAGE 57 ---\n54\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who rendered their time and expertise to the development and validation of\nthese Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERTS:\n\nDR. FRANCISCO BAETIONG, JR.\nDean, College of Optometry\nManila Central University\nEdsa, Kalookan City\n\nMR. WILSON CHENG\nManager\nHong Kong Optical Lens Phils., Inc.\n725 Sgt. Bumatay St., Mandaluyong City\n\nDR. EMELITA V. ROLEDA\nGeneral Manager\nESSILAB Philippines\n653 P. Paterno St., Quiapo Manila\nDR. SIENA PAULA G. FERNANDEZ\nProfessional Sales Representative\nHoya Lens Philippines, Inc.\n10/F Sterling Center cor. Ormaza and Dela\nRosa Sts.\nLegaspi Village, Makati City\n\nThe PARTICIPANTS in the National Validation of these Training Regulations\n\nDr. Caroline LI. Ferrer\nClinic Supervisor\nCollege of Optometry\nManila Central University\nCaloocan City\nDr. Teresita H. Marcaida\nBoard of Optometry - Member\nProfessional Regulation Commission\n\nDr. Christine S. Rodriguez\nClinic Training Coordinator\nCollege of Optometry\nManila Central University\nDivina Gracia P. Manabat\nHR Manager\nGeorge Optical Inc.\n\nDr. Katherine M. De Mesa\nCommunity Health Coordinator/ On the\nJob Coordinator\nCollege of Optometry\nManila Central University\nDr. Joel L. Puertollano\nProduction Manager\nPlastilens Int.\nDr. Lynn M. Villamejor\nFaculty\nCollege of Optometry\nManila Central University\nRoman P. Tiu\nArea Manager\nIOS Marketing Corp.\n\nDr. Rachel D. Balan\nFaculty\nCollege of Optometry\nManila Central University\nDr. Elizabeth C. Velasco\nProprietor\nOptik Express\n\nDr. Caroline Matilde V. Gerardo\nOperations Director\nVision Express\nChristopher Mapue\nLaboratory Technician\nHoya Lens Philippines, Inc.\n\n--- PDF PAGE 58 ---\n55\nDr. Anna Joycelyn D. Demegillo\nOperations Director\nVision Express\nGenesis C. Bautista\nOptical Technician\nHong Kong Optical Lens Phils., Inc.\n\nDr. Joselito H. Mapalo\nLaboratory Manager\nVision Express\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n• QSO"
