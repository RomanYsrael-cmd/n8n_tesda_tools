      "text": "4 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)\" --- PDF PAGE 53 --- TR- Ophthalmic Lens Services NC II 51 Analyze and interpret ophthalmic lens prescription Edge and mount ophthalmic appliances Manage own performance Participate in workplace communication Work in a team environment Apply quality standards Maintain a safe, clean and efficient environment Apply UV coat/ tint to ophthalmic Practice career professionalism Practice occupational health and safety procedure Operate a personal computer Maintain an effective relationship with clients/customers --- PDF PAGE 54 --- --- PDF PAGE 55 --- TR- Ophthalmic Lens Services NC II 52 1. LENS - is used to denote a portion of a transparent substance bounded by two smooth polished surfaces, both of which may be curved, or only one is curved and the other being plane. 2. DIOPTER - is the unit of measurement of the refractive power of the lens. 3. OPHTHALMIC LENSES - are lenses used for correcting ametropia. 4. LENS BLOCK – tool used to hold lens surface 5. NEUTRALIZATION – process of finding the power of unknown lens. 6. PRESCRIPTION – is the designation of an optical system that is intended to relieve certain difficulties of the patient that are related to vision. 7. BENCHWORK – entails the second phase towards the completion of an ophthalmic prescription. It is the operation done, after the lens has been finished from the grinding laboratory, in order to insert or mount the lens to a spectacle frame or mounting with utmost precision to satisfy the requirements for a given prescription. 8. DATUM LINE – is a reference line particularly the horizontal line through the geometric center of a lens shape. 9. CENTERING – is the process of marking and determining the optical center, the axis of the cylinder, and base-apex line of a prism. All centering marks are done on the front surface of the lens. 10. GLAZING – is the process of inserting or mounting lenses in spectacle frame. 11. DRILLING - is the process of boring holes through the surface of the lens for retention purposes by the use of drilling machine and drilling fluids. 12. MOUNTING – entails the placement of an ophthalmic lens in a rimless frame. 13. PRISM – is a transparent wedge of refracting materials with triangular ends and three faces, two of which meet in line called apex and rest upon a third face called base. 14. FRAME – is a type in which the lenses are encircled by eyewire. 15. BRIDGE – that part of a frame that arches over the nose and connects the two eyewires.. 16. FRONT – is the entire pair of glasses except the temples. --- PDF PAGE 56 --- TR- Ophthalmic Lens Services NC II 3 5 17. PADS – are plastic nosepieces on the arms to support and distribute the weight of glasses on the nose. 18. TEMPLES – are sidepieces that hinged into the endpiece and fit over the ears. 19. FITTING – is the process of selecting lenses and frames or mountings, taking essential measurements, determining the size and position relationship, all of which ultimately be combined into an efficient, attractive, comfortable ophthalmic correction. 20. ABSORPTION – the process in which radiant energy is converted into other forms, usually heat by passage through or reflection from a medium. 21. FILTRATION – the process in which wave lengths of light is transmitted or equally absorb through a medium/filter. --- PDF PAGE 57 --- 54 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who rendered their time and expertise to the development and validation of these Training Regulations. THE TECHNICAL/INDUSTRY EXPERTS: DR. FRANCISCO BAETIONG, JR. Dean, College of Optometry Manila Central University Edsa, Kalookan City MR. WILSON CHENG Manager Hong Kong Optical Lens Phils., Inc. 725 Sgt. Bumatay St., Mandaluyong City DR. EMELITA V. ROLEDA General Manager ESSILAB Philippines 653 P. Paterno St., Quiapo Manila DR. SIENA PAULA G. FERNANDEZ Professional Sales Representative Hoya Lens Philippines, Inc. 10/F Sterling Center cor. Ormaza and Dela Rosa Sts. Legaspi Village, Makati City The PARTICIPANTS in the National Validation of these Training Regulations Dr. Caroline LI. Ferrer Clinic Supervisor College of Optometry Manila Central University Caloocan City Dr. Teresita H. Marcaida Board of Optometry - Member Professional Regulation Commission Dr. Christine S. Rodriguez Clinic Training Coordinator College of Optometry Manila Central University Divina Gracia P. Manabat HR Manager George Optical Inc. Dr. Katherine M. De Mesa Community Health Coordinator/ On the Job Coordinator College of Optometry Manila Central University Dr. Joel L. Puertollano Production Manager Plastilens Int. Dr. Lynn M. Villamejor Faculty College of Optometry Manila Central University Roman P. Tiu Area Manager IOS Marketing Corp. Dr. Rachel D. Balan Faculty College of Optometry Manila Central University Dr. Elizabeth C. Velasco Proprietor Optik Express Dr. Caroline Matilde V. Gerardo Operations Director Vision Express Christopher Mapue Laboratory Technician Hoya Lens Philippines, Inc. --- PDF PAGE 58 --- 55 Dr. Anna Joycelyn D. Demegillo Operations Director Vision Express Genesis C. Bautista Optical Technician Hong Kong Optical Lens Phils., Inc. Dr. Joselito H. Mapalo Laboratory Manager Vision Express Members of the TESDA Board The MANAGEMENT and STAFF of the TESDA Secretariat • QSO"
