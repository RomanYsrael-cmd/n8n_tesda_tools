      "source_text": "3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in these course qualifications should possess the\nfollowing requirements:\n\n• Must possess a Private Security License/Special Bank Receipt (SBR) authenticated by\nthe Personnel Licensing Section – SAGSD-PNP to exercise profession;\n• Must possess Pre-Licensing Training Certificate or its equivalent duly authorized by the\nPrivate Security Training Management Branch (PSTMB-SAGSD-PNP) under Section 3\nRule V of the 2003 Revised Rules and Regulations Implementing RA 5487 As Amended;\n• Ability to communicate; and\n• Physically fit and mentally healthy as certified by a Public Health Officer\n\n--- PDF PAGE 54 ---\nTR Security Services NC II\n\n-28"
