  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n3.1 CURRICULUM DESIGN\n\nCourse Title\n:\nSECURITY SERVICES\nNC Level: NC II\n\nNominal Training Duration :\n223 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of security guards in\naccordance with industry standards and in compliance with the PNP- SAGSD Memorandums and\nDirectives. It covers core competencies on monitoring activities within area of responsibility,\nenforcing access control and identification system, securing territorial jurisdiction of the company,\nenforce emergency response procedures and preparing security reports.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey workplace\ninformation.\n1.2\nComplete relevant work related\ndocuments.\n1.3\nParticipate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team role\nand responsibility in a team.\n2.2\nDescribe work as a team\nmember.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal objectives\nwith organizational goals.\n3.2\nSet and meet work priorities.\n3.3\nMaintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1\nEvaluate hazard and risks\n4.2\nControl hazards and risks\n4.3\nMaintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 50 ---\nTR Security Services NC II\n\n-24\nCOMMON COMPETENCIES\n(40 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Maintain an\neffective\nrelationship with\nclients/\ncustomers\n\n1.1 Maintain a professional image\n1.2 Build Credibility to meet\ncustomers/clients requirements\n\nGroup\ndiscussion\nLecture\nRole Playing\nSimulation\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n2. Manage own\nperformance\n\n2.1 Plan for completion of own\nworkload\n2.2 Maintain quality of own\nperformance\n\nGroup\ndiscussion\nLecture\nRole Playing\nSimulation\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 51 ---\nTR Security Services NC II\n\n-25\n\nCORE COMPETENCIES\n(165 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Monitor\nactivities within\narea of\nresponsibility\n(AOR)\n\n1.1\nMonitor the access of visitors,\nclients, employees, vehicles\nand telephone calls\n1.2\nControl the access of visitors,\nclients, employees, materials\nand vehicles\n1.3\nConduct roving inspection and\npatrolling\n1.4\nReport untoward incidents and\nobservations\n1.5\nCheck emergency equipment\n\n• Lecture /\nDiscussion\n• Demonstration\n• Self paced\n(Modular)\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n2. Enforce access\ncontrol and\nidentification\nsystem\n\n2.1\nRegulate access and\nidentification system for\npedestrians, visitors and clients\n2.2\nRegulate access and\nidentification system for\nvehicles, deliveries, bodily\nsearch, luggage, baggage,\nbags and parcels\n2.3\nRegulate access and\nidentification system for any\ncompany properties\n2.4\nImplement SOPs for bodily\nsearch and checking luggage,\nbaggage, bags and parcels\n2.5\nImplement SOPs in checking in\nchecking incoming/outgoing\ndeliveries\n2.6\nImplement SOPs in checking\npull out of company properties\n\nLecture /\nDiscussion\nDemonstration\nSelf paced\n(modular)\n\nWritten\nExamination\nDemonstration\nObservation\n\n3. Secure\nterritorial\njurisdiction of\nthe company\n\n3.1\nConduct patrolling of company\npremises and checking of\nbarriers\n3.2\nConduct ocular inspection of\nfacilities/installation\n3.3\nPrevent access of intruders\n3.4\nGather security related\ninformation\n\n• Lecture /\nDiscussion\n• Demonstration\n• Self paced\n(modular)\n\n• Demonstration\n• Observation\n\n--- PDF PAGE 52 ---\nTR Security Services NC II\n\n-26\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n4. Enforce\nemergency\nresponse\nprocedures\n\n4.1\nParticipate in emergency drills\n4.2\nEnforce emergency\npreparedness in robbery,\nkidnap for ransom, drug\ntrafficking and other related\ncrime\n4.3\nEnforce bomb threat preventive\nmeasures\n4.4\nEnforce civil disturbance plan\n4.5\nRender assistance to injured\nvictim\n4.6\nImplement evacuation\nprocedures during emergencies\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\nand\nQuestioning\n• Direct\nObservation\nand\nQuestioning\n\n5. Prepare\nsecurity reports\n\n5.1\nPrepare reports\n5.2\nSubmit report to proper\nauthorities\n\n• Lecture /\nDiscussion/\n• Demonstration\n• Self paced\n(Modular)\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n--- PDF PAGE 53 ---\nTR Security Services NC II\n\n-27\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n• Project Based Instruction is an authentic instructional model. A strategy in which a student\nplan, implement and evaluate projects that have real world application.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in these course qualifications should possess the\nfollowing requirements:\n\n• Must possess a Private Security License/Special Bank Receipt (SBR) authenticated by\nthe Personnel Licensing Section – SAGSD-PNP to exercise profession;\n• Must possess Pre-Licensing Training Certificate or its equivalent duly authorized by the\nPrivate Security Training Management Branch (PSTMB-SAGSD-PNP) under Section 3\nRule V of the 2003 Revised Rules and Regulations Implementing RA 5487 As Amended;\n• Ability to communicate; and\n• Physically fit and mentally healthy as certified by a Public Health Officer\n\n--- PDF PAGE 54 ---\nTR Security Services NC II\n\n-28\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nSECURITY SERVICES – NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees for Security Services NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n1 pc.\nBinocular\n1 set\nPrescribed Basic\nUniform (security\nguard & lady guard) *\n1 ream\nBond Paper\n6 rounds\nAmmunitions - .38 &\n12 g. (For Demo)\n1 pc.\nNight Stick*\n1 pc.\nCalendar\n1 pc.\nBulletin Board\n1 pc.\nWhistle*\n1 pc.\nBlackboard/\nwhiteboard Eraser\n25 pcs.\nArmed Chairs\n1 pc.\nTimepiece\n(synchronized) *\n25 pcs.\nFolder\n1 pair\nDirectional Signage\n25 pcs. Writing pen*\n1 pc.\nLogbook\n1 pc.\nEmergency Light\n25\nNotepad and duty\nchecklist (electronic or\nnot) *\n1 pc.\nMeal Box\n1 pc.\nFire Extinguisher\n1 pcs.\nFlashlights*\n1 pc.\nMetal Polish\n6 pcs.\nHelmet/ Protective\nGear\n1 pcs.\nFirst aid kit*\n25 pcs.\nPencil\n1 pc.\nHolster\n2 pcs.\nService firearms - .38\ncaliber and 12 g. shot\ngun (as required) *\n2 pcs.\nMarking pen\n1 pc.\nMirror with Stand\n2 pcs.\nHandcuffs*\n1 box\nChalk\n1 pc.\nShield\n1 pc.\nMetal detectors*\n25 pc.\nPocket Notebook\n1 pc.\nStretcher\n1 pc.\nCommunication radio*\n1 pc.\nShoe Brush\n3 pcs.\nOffice Table\n1 set\nStun devices*\n1 can\nShoe polish\n1 pc.\nInstructors Desk\n1 pc.\nArmor vests*\n25 pcs.\nTickler\n1 set\nConference Table\n1 unit\nMace\n1 unit\nWhite Board\n1 set\nComputer Table\n1 unit\nComputer\n2 pcs.\nWhiteboard Marker\n1 pc.\nTelephone\n1 unit\nTypewriter\n12 pcs.\nTransparency\nacetate\n1 pc.\nWall Clock\n1 unit\nElectric fan\n1 pc.\nTarget board/sheet\n1 set\nSearch light\n1 unit\nAir con\n1 pc.\nTarget stand\n10 pcs.\nTraffic vests/ gloves\n1 unit\nOverhead Projector\n1unit\nMegaphone\n1 pc.\nProjector screen\n1 pc.\nRostrum\n1 unit\nCamera (still or video)\n1set\nColor post and stand\n1 unit\nMultimedia equipment\n1 pc.\nPhil. Flag\n1 unit\nSound system\n1 unit\nSteel cabinet with\nlock\n2 pcs.\nKicking pads\n\n* Section 8 Rule VIII – Uniform, equipment, and paraphernalia (2003 Rules and Regulations Implementing\nRA 5487 as amended)\n\n--- PDF PAGE 55 ---\nTR Security Services NC II\n\n-29\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n\n10 pcs.\nDummy knife\nTraining Materials:\n\n10 pcs.\nDummy hand guns\n6 pcs.\nRA 5487, as\namended\n\n6 pcs.\nProtective Gear\n(Head) – for martial\narts\n6 pcs.\n2003 Revised\nRules and\nRegulations\nImplementing RA\n5487 as amended\n\n1 unit\nMatting or its\nequivalent (optional)\n25 pcs.\nHandouts/\npopsheets\n\n25 pcs.\nMartial Arts Kimono\n2 pcs/\ntitle\nTextbooks on\nSecurity\n1. Basic Security\nManual\n2. Physical\nSecurity\n3. Security\nSupervisory\n4. Security\nManagement\n5. Investigation\n6. Martial Arts\n7. First Aid\n8. Training\nManual for\nSecurity\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nBuilding (permanent)\n\n104 sq. m.\nStudent/Trainee Working Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource Center\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/ Circulation\nArea\n6 x 4 m.\n24 sq. m.\n24 sq. m.\nFiring Range *1\n\nDrill area / Quadrangle (if not\navailable) *2\n\n*\n1 – Enter into MOA with a Firing range duly licensed by PNP FED\n2 – Enter into agreement with entities to use the ground\n\n--- PDF PAGE 56 ---\nTR Security Services NC II\n\n-30\n3.6 TRAINER’S QUALIFICATIONS FOR SERVICE SECTOR\n\nSECURITY SERVICES – NC II\nTRAINER QUALIFICATION (TQ II)\n\n• Must have completed a Trainers Training Methodology Course (TTMC) or its equivalent\n• Must have a PNP-SAGSD Accreditation Certificate under Section 20 Rule XI of the 2003\nRevised Rules and regulations Implementing RA 5487 As Amended\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of units of\ncompetency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 57 ---\nTR Security Services NC II\n\n-31"
