    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title\n:\nSECURITY SERVICES\nNC Level: NC II\n\nNominal Training Duration :\n223 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of security guards in\naccordance with industry standards and in compliance with the PNP- SAGSD Memorandums and\nDirectives. It covers core competencies on monitoring activities within area of responsibility,\nenforcing access control and identification system, securing territorial jurisdiction of the company,\nenforce emergency response procedures and preparing security reports.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey workplace\ninformation.\n1.2\nComplete relevant work related\ndocuments.\n1.3\nParticipate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team role\nand responsibility in a team.\n2.2\nDescribe work as a team\nmember.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal objectives\nwith organizational goals.\n3.2\nSet and meet work priorities.\n3.3\nMaintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1\nEvaluate hazard and risks\n4.2\nControl hazards and risks\n4.3\nMaintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 50 ---\nTR Security Services NC II\n\n-24\nCOMMON COMPETENCIES\n(40 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Maintain an\neffective\nrelationship with\nclients/\ncustomers\n\n1.1 Maintain a professional image\n1.2 Build Credibility to meet\ncustomers/clients requirements\n\nGroup\ndiscussion\nLecture\nRole Playing\nSimulation\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n2. Manage own\nperformance\n\n2.1 Plan for completion of own\nworkload\n2.2 Maintain quality of own\nperformance\n\nGroup\ndiscussion\nLecture\nRole Playing\nSimulation\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 51 ---\nTR Security Services NC II\n\n-25\n\nCORE COMPETENCIES\n(165 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Monitor\nactivities within\narea of\nresponsibility\n(AOR)\n\n1.1\nMonitor the access of visitors,\nclients, employees, vehicles\nand telephone calls\n1.2\nControl the access of visitors,\nclients, employees, materials\nand vehicles\n1.3\nConduct roving inspection and\npatrolling\n1.4\nReport untoward incidents and\nobservations\n1.5\nCheck emergency equipment\n\n• Lecture /\nDiscussion\n• Demonstration\n• Self paced\n(Modular)\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n2. Enforce access\ncontrol and\nidentification\nsystem\n\n2.1\nRegulate access and\nidentification system for\npedestrians, visitors and clients\n2.2\nRegulate access and\nidentification system for\nvehicles, deliveries, bodily\nsearch, luggage, baggage,\nbags and parcels\n2.3\nRegulate access and\nidentification system for any\ncompany properties\n2.4\nImplement SOPs for bodily\nsearch and checking luggage,\nbaggage, bags and parcels\n2.5\nImplement SOPs in checking in\nchecking incoming/outgoing\ndeliveries\n2.6\nImplement SOPs in checking\npull out of company properties\n\nLecture /\nDiscussion\nDemonstration\nSelf paced\n(modular)\n\nWritten\nExamination\nDemonstration\nObservation\n\n3. Secure\nterritorial\njurisdiction of\nthe company\n\n3.1\nConduct patrolling of company\npremises and checking of\nbarriers\n3.2\nConduct ocular inspection of\nfacilities/installation\n3.3\nPrevent access of intruders\n3.4\nGather security related\ninformation\n\n• Lecture /\nDiscussion\n• Demonstration\n• Self paced\n(modular)\n\n• Demonstration\n• Observation\n\n--- PDF PAGE 52 ---\nTR Security Services NC II\n\n-26\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n4. Enforce\nemergency\nresponse\nprocedures\n\n4.1\nParticipate in emergency drills\n4.2\nEnforce emergency\npreparedness in robbery,\nkidnap for ransom, drug\ntrafficking and other related\ncrime\n4.3\nEnforce bomb threat preventive\nmeasures\n4.4\nEnforce civil disturbance plan\n4.5\nRender assistance to injured\nvictim\n4.6\nImplement evacuation\nprocedures during emergencies\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\nand\nQuestioning\n• Direct\nObservation\nand\nQuestioning\n\n5. Prepare\nsecurity reports\n\n5.1\nPrepare reports\n5.2\nSubmit report to proper\nauthorities\n\n• Lecture /\nDiscussion/\n• Demonstration\n• Self paced\n(Modular)\n\n• Written\nExamination\n• Demonstration\n• Observation"
