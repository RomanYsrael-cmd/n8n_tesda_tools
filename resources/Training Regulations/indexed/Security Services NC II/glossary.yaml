      "term": "1.",
      "definition": "Area of Responsibility – the place where the guards-on-duty are stationed. 2. Bodily Search- is a type of personnel control where the guard-on-duty requires a prospective subject to manual search using hands or electronic equipment. 3. Citizens Arrest – taking of person into custody in order for him/her to be bound to answer for the commission of an offense. 4. Company Premises – refers to a specific place of duty as specified or stated in the Duty Detail Order (DDO). 5. Duty Detail Order (DDO) – is a written order/schedule issued by a superior officer usually the private security agency/branch manager or operations officer assigning the performance of private security/detective services duties. 6. Guard Detailed – a written report consisting of names of guards mobilized to different post assignments in a particular shift. 7. Initial Report – it refers to preliminary phase of investigation report either written or oral and in accordance with the company policies. 8. Inspection Stick – a non-conductor stick used for inspection of bags and personal luggage. 9. Metal Detector – a security equipment being used by the guards to detect firearms, bladed weapons or any metal objects. 10. Night Stick – an equipment being used by the guard to restrain a person without using the firearm. 11. Pedestrian Area – refers to a confined area where customers, employees or visitors can pass for security check. 12. Physical Barriers – a system placed between the potential intruder and the matter to be protected. These barriers are of different types so that entry may be controlled in the company. 13. Roving Inspection – it refers to an exhaustive physical inspection of all operational activities in the company either internal or external. 14. Rules of Evidence – refers to the Rules of Court (Rule 128-131) to be followed by the guard for the preservation of evidence. 15. Security Service Contract – is a contract of service which include among others the money consideration to be paid by the client to the agency; the number of hours of security services per guard per day which the guard himself shall render to the client and the salary each individual security guard shall receive from the agency. 16. Subject – refers to a person or things which are the object for security reasons. 17. Territorial Jurisdiction – refers to area of responsibility, strictly covers and defined by the security service contract. 18. Uniform – a set of uniform including its paraphernalia and covered by RA 5487 IRR."
