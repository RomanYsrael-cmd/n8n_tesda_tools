        "evidence_guide": {
          "source_text": "1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nRegulated of access and identification system for pedestrians,\nvisitors and clients\n1.2\nRegulated of access and identification system for vehicles,\ndeliveries, bodily search, luggage, baggage, bags and parcel\n1.3\nRegulated of access and identification system for company\nproperties\n1.4\nChecked incoming/outgoing deliveries\n1.5\nChecked pull out of properties\n1.6\nDemonstrated capacity to correctly secure premises and\nsystems according to assignment instructions\n1.7\nDemonstrated capacity to determine assignment needs and\ninstructions and deal with monitoring situations in the area\n1.8\nDemonstrated capacity to identify items and goods which may\nbe illicit, stolen or otherwise inappropriate and take necessary\naction\n1.9\nProperly maintained log books, visitor’s log book, vehicle log\nbook, incident reports, computer entries and manifests, key\nregister and all keys and locks are accounted for\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nR.A. 5487 as amended\n2.2\nHandling of Firearms\n2.3\nMaintenance of Firearms\n2.4\nCustomer Relations\n2.5\nHuman Relations\n2.6\nLog/Note Taking\n2.7\nDefense Tactics\n2.8\nFirst Aid\n2.9\nMarksmanship\n2.10 Bomb Awareness\n2.11 Contingency Plan (Typhoon, Earthquake, Fire, Strikes)\n2.12 Basic Life Support\n2.13 Hygiene and Sanitation\n2.14 Personal Hygiene\n2.15 Use of Firearms\n2.16 Protocol Usage\n2.17 Value Formation\n2.18 Telephone Ethics\n2.19 Proper Wearing of Uniform\n2.20 Interim Guard Duty\n2.21 Social Awareness\n2.22 Criminal Justice System\n2.23 Leadership Concept\n2.24 Firefighting Drills\n2.25 Assignment Instructions\n2.26 Alarm Systems and Locations\n2.27 Communication Codes\n2.28 Operation of Communication Equipment\n2.29 Control System Operation\n2.30 Client’s Instructions\n2.31\nSurveillance Techniques\n\n--- PDF PAGE 35 ---\nTR Security Services NC II\n\n-9\n\n2.32 Risk Factors Assessment\n2.33 Company’s Physical Layout\n2.34 Building Security Procedures\n2.35 Dangerous Goods (Items and Materials)\n2.36 Confiscation Procedures (where relevant)\n2.37 Communication (Report Writing, Radio Language)\n2.38 Legal Aspect\n2.39\nGender Awareness and Development\n3. Underpinning skills\n3.1\nRegulating Access And Identification For Pedestrians, Visitors\nAnd Clients\n3.2\nRegulating Access And Identification For Vehicles, Deliveries,\nBodily Search, Luggage, Baggage And Parcels\n3.3\nRegulating Access And Identification For Company Properties\n3.4\nChecking Incoming And Outgoing Deliveries\n3.5\nChecking Pulled-Out Properties\n3.6\nMarksmanship\n3.7\nDefensive Tactics\n3.8\nReport Writing Skills\n3.9\nCommunicating Skills\n3.10 Monitoring Skills\n3.11 Securing Area\n3.12 Observing Area\n3.13 Describing/Identifying suspicious movements\n3.14 Communicating Clearly With Clients/Customers\n3.15 Giving Instructions\n3.16 Conducting Search (Baggage, Vehicles, Loads\n3.17 Directing Traffic\n3.18 Controlling Keys\n3.19\nRecords Keeping\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, security equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instruction (if\nrelevant)\n4.9\nAssessment instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency MUSTbe assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA/PNP\naccredited assessment centers/venues by using closely\nsimulated work place environment\n\n--- PDF PAGE 36 ---\nTR Security Services NC II\n\n-10\nUNIT OF COMPETENCY :\nSECURE TERRITORIAL JURISDICTION OF THE COMPANY\nUNIT CODE\n:"
