        "source_title": "MONITOR ACTIVITIES WITHIN AREA OF RESPONSIBILITY (AOR)",
        "source_text": "--- PDF PAGE 25 ---\nTR  Security Services NC II \n \n-5 \nCORE COMPETENCIES \n \nThis section gives the details of the contents of the core units of competency required in \nSECURITY SERVICES NC II.  \n \nUNIT OF COMPETENCY : \nMONITOR ACTIVITIES WITHIN AREA OF RESPONSIBILITY \n(AOR) \n \nUNIT CODE \n: \nHCS516307 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in monitoring \nactivities within area of responsibility including procedures and \npolicies in monitoring. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Monitor access of \nvisitors, clients, \nemployees, vehicles \nand telephone calls \n1.1 \nAccess of visitors, clients, employees, vehicles and telephone \ncalls are recorded/reported in accordance with company \npolicies. \n1.2 \nObservation position selected appropriate to the situation and \nthe nature of the assignment. \n1.3 \nObservation of site undertaken according to assignment \ninstructions. \n1.4 \nAgency Duty Detail Order (DDOs) and company policies and \nregulations are followed. \n1.5 \nIdentified incidents are acted upon according to assignment \ninstruction, client and legal requirements.\n2. Conduct roving \ninspection  \n      \n2.1 \nArea of assignment of post duties and responsibilities is \nproperly turned-over in accordance to company policies. \n2.2 \nEquipment is checked for serviceability according to standard \noperating procedures. \n2.3 \nFrequency and duration of visits to access points and control \npoints and routine telephone/radio calls to control room are \nconducted according to assignment instructions. \n2.4 \nPreviously reported risk factors are monitored and reported \nuntil rectified. \n2.5 \nMonitoring procedures are implemented in accordance with \ncompany policies and guidelines. \n2.6 \nFactors which increase the risk to security identified during \npatrol, reported, regularly monitored and recorded according \nto assignment instructions.\n3.  Report untoward \nincidents \n     and observations \n3.1 \nFire hazards are reported accurately based on causes, \nlocation and condition. \n3.2 \nSuspicious elements are reported in accordance with the 5Ws \nand 1H. \n3.3 \nProperty damages and losses are reported accurately based \non causes, location and condition. \n3.4 \nViolations of company’s/agency’s rules, regulations and \npolicies are reported using the approved format. \n3.5\nCommunication flow are followed at all times.\n\n--- PDF PAGE 26 ---\nTR  Security Services NC II \n \n-6 \n \n4.  Control access \nentry/exit \n      \n4.1 \nEntry/exit of all entrants are recorded as per company SOPs.  \n4.2 \nScreening and bodily search are conducted as per company \npolicies. \n4.3 \nRegular inspection within the restricted area is conducted as \nper company SOPs.\n5.  Check activated \nsecurity alarm system\n5.1 \nChecking schedule recorded as per company policies. \n5.2 \nSecurity alarm system is checked following manufacturer’s \nSOP. \n5.3 \nSecurity alarm system defects reported as per company \npolicies.\n6.  Check emergency \nalarm system \n  \n6.1 \nFire alarm system is checked following manufacturer’s SOP. \n6.2 \nChecking schedule recorded as per company policies. \n6.3 \nFire fighting equipment is checked following manufacturer’s \nSOP. \n6.4 \nFire alarm system and fire fighting equipment defects are \nreported as per company policies. \n6.5 \nInspection reports on fire exits are recorded, secured and free \nfrom obstructions and hazardous/flammable materials.\n7.  Check garbage \ndisposal \n7.1 \nGarbage disposal is checked in accordance with company \nSOP. \n7.2 \nInspection of garbage disposal recorded using company \nreporting form. \n7.3 \nAny pilfered items or company property are reported to proper \nauthority.\n\n--- PDF PAGE 27 ---\nTR  Security Services NC II \n \n-1 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n 1. Duty Detail Order \n(DDO) \n \n1.1 \nSecurity Guard Post Service: Security Guard posted in \nimmovable fix property \n1.2 \nSecurity Guard Conduction Service Security Guard posted in \nmovable property in Transit \n1.3 \nSecurity Guard Armored Vehicle/Guard Service Security \nGuard assigned to perform security escort service for the \nprotection of large amount cash and valuables through the \noperation of armored vehicle \n1.4 \nElectronic Security Systems and Service Security Guard \nassigned to operate scientifically designed electronic security \nsystem and service\n2.  Risk Factors \n2.1 \nFlood \n2.2 \nFire \n2.3 \nExplosion \n2.4 \nIntruder/s \n2.5 \nVandals \n2.6 \nVehicles and equipment in suspicious places \n2.7 \nSensitive material or correspondence left in public \nview/unattended \n2.8 \nGas Leaks \n2.9 \nStorms \n2.10 Power Failures \n2.11\nEarthquake\n3. Monitoring \nProcedures \nIt includes procedures for monitoring: \n3.1 \nMovement time of client \n3.2 \nEmployees \n3.3 \nVehicles \n3.4 \nTelephone Calls \n3.5 \nFire Hazards \n3.6 \nSuspicious Elements \n3.7 \nUntoward Incidents \n3.8 \nProperty Damages \n3.9 \nViolations on Company \n3.10 Agency Orders \n3.11 Security Alarm System \n3.12 Security Electronic Access System \n3.13 Fire Exits \n3.14 Garbage Disposal \n3.15\nCash/Valuables\n\n--- PDF PAGE 28 ---\nTR  Security Services NC II \n \n-2 \n \n \n \n \nVARIABLE \nRANGE \n4.  Fire Hazards \n4.1 \nMan-Made \n4.1.1 Arson \n4.1.2 Bomb Threat \n4.1.3 Civil Disturbance \n4.1.4 Chemical Spills \n4.1.5 Espionage \n4.1.6 Explosion \n4.1.7 Robbery \n4.1.8 Sabotage \n4.1.9 Terrorism \n4.1.10 Violent\n \n4.2 \nNatural \n4.2.1 Earthquake \n4.2.2 Fire \n4.2.3 Flood \n4.2.4 Hurricane \n4.2.5 Storm \n4.2.6 Tornado \n          4.2.7 Typhoon\n5.  Fire Fighting \nEquipment \n5.1 \nAxe \n5.2 \nFire Extinguisher \n5.3\nFire Hose\n\n--- PDF PAGE 29 ---\nTR  Security Services NC II \n \n-3 \nEVIDENCE GUIDE \n \n1.  Critical aspects of  \n     competency \nAssessment requires evidence that the candidate: \n1.1 \nMonitored access of visitors, clients, employees, vehicles and \ntelephone calls. \n1.2 \nConducted roving inspection. \n1.3 \nReported untoward incidents and observations. \n1.4 \nControlled entry in restricted area. \n1.5 \nChecked activated security alarm system. \n1.6 \nChecked fire alarm system, fire fighting equipment and fire \nexits. \n1.7\nChecked garbage disposal.\n2.  Underpinning \nknowledge and \nattitudes \n2.1 \nRA 5487 as amended \n2.2 \nHandling of Firearms \n2.3 \nMaintenance of Firearms \n2.4 \nCustomer Relations \n2.5 \nHuman Relations \n2.6 \nReport Writing \n2.7 \nLog/Note Taking \n2.8 \nDefensive Tactics (Armed/Unarmed) \n2.9 \nFirst Aid \n2.10  Marksmanship \n2.11 Bomb Awareness \n2.12 Contingency Plan (Typhoon, Earthquake, Fire, Strikes) \n2.13 Basic Life Support \n2.14 Hygiene and Sanitation (Workplace) \n2.15 Personal Hygiene \n2.16 Use of Firearms \n2.17 Protocol Usage \n2.18 Value Formation \n2.19 Telephone Ethics \n2.20 Proper Wearing of Uniform \n2.21 The steps necessary to arrange alarm deactivation \n2.22 Alarm Systems and Locations of Fire Fighting Equipment \n2.23 Communication Codes \n2.24 Operation of Communication Equipment \n2.25 Control System Operation \n2.26 Signal Types and Meanings \n2.27 Instructional User Manual \n2.28 Client’s Instructions \n2.29\nSurveillance Techniques\n \n2.30 Security Equipment Installed \n2.31 Risk Factor Assessment  \n2.32 Site Layout \n2.33 Building Security Procedures \n2.34 Social Awareness \n2.35    Criminal Justice System \n2.36 Leadership Concept \n2.37 Firefighting Drills \n2.38 Communication (Report Writing, Radio Lang.) \n2.39 Legal Aspect \n2.40\nGender Awareness and Development\n\n--- PDF PAGE 30 ---\nTR  Security Services NC II \n \n-4 \n \n3.  Underpinning skills \n3.1 \nMonitoring Access Of Visitors, Clients, Employees, Vehicles \nAnd Telephones \n3.2 \nConducting Roving Inspection \n3.3 \nReporting Untoward Incidents And Observations \n3.4 \nControlling Entry In Restricted Area \n3.5 \nChecking Activated Security Alarm System \n3.6 \nChecking Fire Alarm System, Firefighting Equipment And Fire \nExits \n3.7 \nChecking Garbage Disposal \n3.8 \nEscorting Cash/Valuables \n3.9 \nMarksmanship \n3.10 Defensive Tactics \n3.11 Report Writing Skills \n3.12 Communicating Skills \n3.13 Monitoring Skills \n3.14 Protecting The Area \n3.15 Observing And Identifying Suspicious Movements \n3.16 Roving \n3.17 Surveillance \n3.18 Interpreting Alarm Signals \n3.19 Searching Techniques \n3.20\nBomb Security Awareness\n4.  Resource \nimplications \nThe following resources MUST be provided \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to a relevant venue, security equipment and materials \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.8 \nOperational manuals and makers’/customers’ instructions (if \nrelevant) \n4.9 \nAssessment Instruments, including personal planner and \nassessment record book\n5.  Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nWritten Test \n5.2\nDemonstration with questioning\n6.  Context of \nassessment \n6.1 \nCompany \n6.2 \nOn-Site \n6.3 \nAssessment activities are carried out through TESDA/PNP \naccredited assessment centers/venues by using closely \nsimulated work place environment \n6.4 \nContinuous assessment in an institutional setting that \nstimulates the conditions of performance describe in the \nelements, performance criteria and range of variables \nstatement that make up this unit \n6.5   Continuous assessment in the workplace, taking into account \nthe range of variables affecting performance \n6.6   Self-assessment on the same terms as those described above \n6.7   Simulated assessment or critical incident assessment, provided \nthat the critical incident involves assessment against \nperformance criteria and an evaluation of underpinning \nknowledge and skill required to achieve the required \nperformance criteria\n",
