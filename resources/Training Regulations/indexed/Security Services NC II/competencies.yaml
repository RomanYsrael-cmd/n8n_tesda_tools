cy. \n6.2\nCompany SOPs in checking monitoring scrap area is followed.\n7.  Gather security \nrelated information \n7.1 \nAll security related information/incidents are prepared in \naccordance with the 5Ws and 1H. \n7.2 \nAll security related information/incidents gathered are \ncomplete, accurate and timely.\n\n--- PDF PAGE 37 ---\nTR  Security Services NC II \n \n-11 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Types of Barriers \n1.1 \nWorking System \n1.2 \nTraffic Barriers \n1.3 \nElectronic Access Doors \n1.4\nShutters and Gates\n2.  Incidents \n2.1 \nRefusal to show pass \n2.2 \nLost Pass \n2.3 \nUsing a pass belonging to another party \n2.4 \nAccidents resulting in injury (vehicles/persons) \n2.5 \nVehicles incorrectly parked \n2.6 \nStolen Vehicles \n2.7 \nForced entry of persons and/or vehicles \n2.8\nUnauthorized items found during inspection\n\n--- PDF PAGE 38 ---\nTR  Security Services NC II \n \n-12"
