ing Entry In Restricted Area\n3.5\nChecking Activated Security Alarm System\n3.6\nChecking Fire Alarm System, Firefighting Equipment And Fire\nExits\n3.7\nChecking Garbage Disposal\n3.8\nEscorting Cash/Valuables\n3.9\nMarksmanship\n3.10 Defensive Tactics\n3.11 Report Writing Skills\n3.12 Communicating Skills\n3.13 Monitoring Skills\n3.14 Protecting The Area\n3.15 Observing And Identifying Suspicious Movements\n3.16 Roving\n3.17 Surveillance\n3.18 Interpreting Alarm Signals\n3.19 Searching Techniques\n3.20\nBomb Security Awareness\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, security equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA/PNP\naccredited assessment centers/venues by using closely\nsimulated work place environment\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit\n6.5 Continuous assessment in the workplace, taking into account\nthe range of variables affecting performance\n6.6 Self-assessment on the same terms as those described above\n6.7 Simulated assessment or critical incident assessment, provided\nthat the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria\n\n--- PDF PAGE 31 ---\nTR Security Services NC II\n\n-5\nUNIT OF COMPETENCY : ENFORCE ACCESS CONTROL AND IDENTIFICATION SYSTEM\nUNIT CODE\n:"
