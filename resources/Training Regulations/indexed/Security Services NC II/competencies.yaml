          "source_text": "1. Participate in \nemergency drills \n1.1 \nEmergency equipment and fire fighting equipment are \nprepared as per SOPs. \n1.2 \nInformation regarding emergency drills are disseminated in \nadvance to all concerned. \n1.3\nFire exits are freed from obstructions.\n2. Enforce emergency \npreparedness in \ncases of bank \nrobbery, kidnaps for \nransom, drug \ntrafficking and other \nrelated crimes \n2.1 \nAlarm system is checked as per manufacturer’s SOPs. \n2.2 \nSOPs in information gathering is followed. \n2.3 \nCompany SOPs in evaluation is followed. \n2.4 \nIssued firearms and ammunition are checked in accordance \nwith company policy and procedures. \n2.5 \nPieces of baggage of clients/customers are checked \nthoroughly. \n2.6 \nBody frisking of customers is done as per company SOPs. \n2.7 \nGathered information is coordinated with police authorities as \nper company rules and regulations.\n3. Enforce bomb threat \npreventive measures \n3.1 \nBody frisking of customers is done as per company/agency \nSOPs. \n3.2 \nCustomer baggage checked as per company/agency SOPs. \n3.3 \nGathered information are coordinated with police authorities \nas per company rules and regulations. \n3.4 \nInspection conducted within area of responsibility and as \nidentified in work assignment.\n4. Enforce civil \ndisturbance plan \n4.1 \nReadiness of barricade are checked as per SOPs. \n4.2 \nReadiness of CDC equipment is checked as per SOPs. \n4.3 \nInformation gathered are validated with concerned personnel. \n4.4 \nTeams are organized based on  requirements. \n4.5 \nCommunication netlink with agency and police authority is \nestablished as per company requirements.\n5.  Render assistance to \ninjured victims \n5.1 \nFirst aid procedures is applied following safety guidelines. \n5.2 \nPersonal belongings of injured victims checked as per SOPs. \n5.3 \nPersonal identification of victims is checked and verified. \n5.4 \nHospitals/ambulance service are contacted if needed. \n5.5 \nAssistance for other people in the AOR is requested if \nnecessary.\n6.  Implement \nevacuation \nprocedures during \nemergencies \n6.1 \nEvacuation areas are sealed off and isolated according to \nstandard operating procedures. \n6.2 \nDirection and control of escape route are provided based on \ncompany requirements. \n6.3 \nOnlookers/crowds/other persons are controlled and kept at a \nsafe distance from the emergency area. \n6.4 \nEmergency area secured and are properly protected. \n6.5 \nInjured and sick evacuees are brought to a secured and safe \nplace. \n6.6\nCoordination are made with NDCC and DSWD if necessary.\n\n--- PDF PAGE 41 ---\nTR  Security Services NC II \n \n-15 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Emergency \nEquipment \n1.1 \nLadder \n1.2 \nRope \n1.3 \nBasic First Aid Equipment \n1.4 \nStretcher \n1.5 \nSplint Board \n1.6 \nFlashlight/Search Light \n1.7 \nMegaphone \n1.8 \nCamera \n1.9\nBlanket\n2. Fire Fighting \nEquipment \n2.1 \nFire Extinguisher \n2.2 \nAxe \n2.3\nFire Hose\n3. Firearms and \nammunition \n3.1 \nHelmet \n3.2 \nTruncheon \n3.3 \nWicker Shield \n3.4\nTear Gas\n\n--- PDF PAGE 42 ---\nTR  Security Services NC II \n \n-16"
