        "source_title": "SECURE TERRITORIAL JURISDICTION OF THE COMPANY",
        "source_text": "--- PDF PAGE 36 ---\nTR  Security Services NC II \n \n-10 \nUNIT OF COMPETENCY : \nSECURE TERRITORIAL JURISDICTION OF THE COMPANY \nUNIT CODE \n: \nHCS516309 \nUNIT DESCRIPTION \n: \nThis unit covers the knowledge, skills and attitudes in securing \nterritorial jurisdiction of the company. It includes specific procedures \nin handling territorial jurisdiction. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Patrol perimeter area \n \n1.1 \nAny property damages, defective lightings untoward incidents, \nintruders, suspicious movements of personnel and other \nsuspicious activities within area of responsibility are reported \nto proper authorities. \n1.2 \nSOPs in patrolling is followed as per company/agency policy. \n1.3 \nAll sighted/unauthorized persons and vehicles are interviewed \nand turned-over to the management for proper disposition. \n1.4 \nEntire area of responsibility is patrolled as per company \npolicy.\n2.  Check security \nbarriers \n2.1 \nPresence/visibility/operational/active security barriers are \nreported to proper authorities. \n2.2 \nDamaged/non-existence/defective security barriers \nreported/recorded as per company guidelines.\n3.  Conduct ocular \ninspection of \nfacilities/installation \n \n3.1 \nActual physical observation of facilities and installation \nincluding damages/charges/improvement required/condition \nare reported/recorded in the required format. \n3.2 \nSOPs of company in ocular inspection of facilities/installation \nis followed. \n3.3 \nAll facilities/installations are inspected based on approved \ncompany procedures.\n4.  Check \npersons/vehicles \nentering the \ncompany perimeter \n4.1 \nPersons/vehicles entering perimeter are recorded in the \nlogbook. \n4.2 \nAll non-organic persons entering the perimeter  are \ninterviewed and screened in accordance with company \npolicies and guidelines. \n4.3 \nSOPs of company on checking entry to the company \nperimeter is followed.\n5.  Prevent access of \nintruders \n5.1 \nSystem ID for access within the territorial jurisdiction of the \ncompany is adopted. \n5.2 \nIntruders within company premises are prevented from \nentering in accordance with company policy. \n5.3 \nAccess to company premises are prevented based on the \ninstructions of supervisors.\n6.  Monitor scrap area \n \n6.1 \nScrap items with commercial value are recorded as per \ncompany policy. \n6.2\nCompany SOPs in checking monitoring scrap area is followed.\n7.  Gather security \nrelated information \n7.1 \nAll security related information/incidents are prepared in \naccordance with the 5Ws and 1H. \n7.2 \nAll security related information/incidents gathered are \ncomplete, accurate and timely.\n\n--- PDF PAGE 37 ---\nTR  Security Services NC II \n \n-11 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Types of Barriers \n1.1 \nWorking System \n1.2 \nTraffic Barriers \n1.3 \nElectronic Access Doors \n1.4\nShutters and Gates\n2.  Incidents \n2.1 \nRefusal to show pass \n2.2 \nLost Pass \n2.3 \nUsing a pass belonging to another party \n2.4 \nAccidents resulting in injury (vehicles/persons) \n2.5 \nVehicles incorrectly parked \n2.6 \nStolen Vehicles \n2.7 \nForced entry of persons and/or vehicles \n2.8\nUnauthorized items found during inspection\n\n--- PDF PAGE 38 ---\nTR  Security Services NC II \n \n-12 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate: \n1.1 \nPatrolled perimeter area. \n1.2 \nChecked security barriers. \n1.3 \nConducted ocular inspection of facilities/installation. \n1.4 \nChecked persons entering the company perimeter \n1.5 \nPrevented access of intruders. \n1.6 \nMonitored scrap area. \n1.7\nGathered security related information\n2. Underpinning \nknowledge and \nattitudes \n2.1 \nR.A. 5487 as amended \n2.2 \nHandling of Firearms \n2.3 \nMaintenance of Firearms \n2.4 \nCustomer Relations \n2.5 \nHuman Relations \n2.6 \nLog/Note Taking \n2.7 \nDefense Tactics \n2.8 \nFirst Aid \n2.9 \nMarksmanship \n2.10 Bomb Awareness \n2.11 Contingency Plan (Typhoon, Earthquake, Fire, Strikes) \n2.12 Basic Life Support \n2.13 Hygiene and Sanitation \n2.14 Personal Hygiene \n2.15 Use of Firearms \n2.16 Protocol Usage \n2.17 Value Formation \n2.18 Telephone Ethics \n2.19 Proper Wearing of Uniform \n2.20 Interim Guard Duty \n2.21 Social Awareness \n2.22 Criminal Justice System \n2.23  Leadership Concept \n2.24  Firefighting Drills \n2.25 Assignment Instructions \n2.27 Communication Codes \n2.28 Operation of Communication Equipment \n2.29 Control System Operation \n2.30 Client’s Instructions 2.31  Surveillance Techniques \n2.32 Risk Factors Assessment \n2.33 Company’s Physical Layout \n2.34 Building Security Procedures \n2.35 Dangerous Goods (Items and Materials) \n2.36 Confiscation Procedures (where relevant) \n2.37 Communication (Report Writing, Radio Language) \n2.38 Legal Aspect \n2.39\nGender Awareness and Development\n\n--- PDF PAGE 39 ---\nTR  Security Services NC II \n \n-13 \n3.  Underpinning skills \n3.1 \nPatrolling Perimeter Area \n3.2 \nChecking Security Barriers \n3.3 \nConducting Ocular Inspection Of Facilities And Installation \n3.4 \nChecking Persons And Vehicles Entering The Company \nPerimeter \n3.5 \nPreventing Access Of Intruders \n3.6 \nMonitoring Scrap Area \n3.7 \nGathering Security Related Information \n3.8 \nMarksmanship \n3.9 \nDefensive Tactics \n3.10 Report Writing Skills \n3.11 Communicating Skills \n3.12 Monitoring Skills \n3.13 Securing Area  \n3.14 Observing suspicious movements \n3.15 Describing/Identifying suspicious movements \n3.16  Communicating Clearly With Clients/Customers \n3.17 Giving Instructions \n3.18 Conducting Search (Baggage, Vehicles, Loads) \n3.19 Directing Traffic \n3.20 Controlling Key \n3.21\nRecords Keeping\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to relevant venue, security equipment and materials \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.4 \nOperational manuals and makers’/customers’ instruction (if \nrelevant) \n4.5 \nAssessment instruments, including personal planner and \nassessment record book\n5.  Method of \nAssessment \nCompetency MUST be assessed through: \n5.1 \nWritten Test \n5.2\nDemonstration with questioning\n6.  Context of \nAssessment \n6.1 \nCompany \n6.2 \nOn-Site \n6.3 \nAssessment activities are carried out through TESDA/PNP \naccredited assessment centers/venues by using closely \nsimulated work place environment\n",
