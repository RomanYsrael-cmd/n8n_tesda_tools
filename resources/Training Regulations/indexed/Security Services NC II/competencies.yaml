  "source_section_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate II signed by the TESDA\nDirector General.\n\n4.2 Assessment shall focus on the core units of competency. The basic and common units shall\nbe integrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates\nof\nformal,\nnon-formal\nand\ninformal\nincluding\nenterprise-based\ntraining programs\n\n4.3.2 Experienced Workers (wage employed or self-employed)\n\n4.4 Re-assessment is allowed only after one month from the date of assessment. Re-assessment\nfor National Certificate shall be only on the tasks that the candidate did not successfully\nachieved.\n\n4.5 A candidate who fails the assessment for two (2) consecutive times will be required to go\nthrough a refresher course before taking another assessment.\n\n4.6 Only certified individuals in this Qualification maybe nominated by the industry sector for\naccreditation as competency assessor.\n\n4.7 Only accredited competency assessors are allowed competency assessment, however,\ntrainers who are accredited competency assessors are not allowed to assess their trainees.\n\n4.8 Assessment of competence must be undertaken only in the TESDA accredited assessment\ncenters. The performance assessment (demonstration of competence), however, may be\ndone in any venue of workplace duly designated by an accredited assessment center,\n\n4.9 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 58 ---\nTR Security Services NC II\n\n-32\n\n--- PDF PAGE 59 ---\nTR Security Services NC II\n\n-33\nDEFINITION OF TERMS\n\n1.\nArea of Responsibility – the place where the guards-on-duty are stationed.\n2.\nBodily Search- is a type of personnel control where the guard-on-duty requires a\nprospective subject to manual search using hands or electronic equipment.\n3.\nCitizens Arrest – taking of person into custody in order for him/her to be bound to answer for\nthe commission of an offense.\n4.\nCompany Premises – refers to a specific place of duty as specified or stated in the Duty\nDetail Order (DDO).\n5.\nDuty Detail Order (DDO) – is a written order/schedule issued by a superior officer usually\nthe private security agency/branch manager or operations officer assigning the performance\nof private security/detective services duties.\n6.\nGuard Detailed – a written report consisting of names of guards mobilized to different post\nassignments in a particular shift.\n7.\nInitial Report – it refers to preliminary phase of investigation report either written or oral and\nin accordance with the company policies.\n8.\nInspection Stick – a non-conductor stick used for inspection of bags and personal luggage.\n9.\nMetal Detector – a security equipment being used by the guards to detect firearms, bladed\nweapons or any metal objects.\n10. Night Stick – an equipment being used by the guard to restrain a person without using the\nfirearm.\n11. Pedestrian Area – refers to a confined area where customers, employees or visitors can\npass for security check.\n12. Physical Barriers – a system placed between the potential intruder and the matter to be\nprotected. These barriers are of different types so that entry may be controlled in the\ncompany.\n13. Roving Inspection – it refers to an exhaustive physical inspection of all operational activities\nin the company either internal or external.\n14. Rules of Evidence – refers to the Rules of Court (Rule 128-131) to be followed by the guard\nfor the preservation of evidence.\n15. Security Service Contract – is a contract of service which include among others the money\nconsideration to be paid by the client to the agency; the number of hours of security services\nper guard per day which the guard himself shall render to the client and the salary each\nindividual security guard shall receive from the agency.\n16. Subject – refers to a person or things which are the object for security reasons.\n17. Territorial Jurisdiction – refers to area of responsibility, strictly covers and defined by the\nsecurity service contract.\n18. Uniform – a set of uniform including its paraphernalia and covered by RA 5487 IRR.\n\n--- PDF PAGE 60 ---\nTR Security Services NC II\n\n-34\nACRONYMS\n\n1.\nADC\n-\nAssistant Detachment Commander\n2.\nAFP\n-\nArmed Forces of the Philippines\n3.\nAOR\n-\nArea Of Responsibility\n4.\nAWOL\n-\nAbsence Without Official Leave\n5.\nAMMOS\n-\nAmmunition\n6.\nBSGC\n-\nBasic Security Guard Course\n7.\nCDC\n-\nCivil Disturbance Control\n8.\nCIR\n-\nCrime Inspection Report\n9.\nCOMD\n-\nCommand\n10. CSO\n-\nChief Security Officer\n11. CSG\n-\nCivil Security Group\n12. DC\n-\nDetachment Commander\n13. DDO\n-\nDuty Detail Order\n14. DTR\n-\nDaily Time Record\n15. FAGSD\n-\nFirearms and Explosives Division\n16. FED\n-\nFire Explosives Division\n17. INFO\n-\nInformation\n18. IR\n\n-\nInvestigation Report\n19. L/G\n-\nLady Guard\n20. MR\n-\nMemo Receipt\n21. OIC\n-\nOfficer-In-Charge\n22. OPNS\n-\nOperations\n23. PADPAO\n-\nPhilippine Association of Detectives and Protective\nAgencies Operators\n24. PARSTS\n-\nPhilippine Association of Recognized Security Training\n\nSchools Inc.\n25. PDR\n-\nPost Duties and Responsibility\n26. PIC\n-\nPost-In-Charge\n27. PNP\n-\nPhilippine National Police\n28. POI\n-\nProgram Of Instruction\n29. RTC\n-\nRe-Training Course\n30. SAGSD\n-\nSecurity Agencies and Guards Supervision Division\n31. SCA\n-\nSpecific Control Area\n32. SED\n-\nSecurity Executive Director\n33. SD\n\n-\nSecurity Director\n34. S/G\n-\nSecurity Guard\n35. SIC\n-\nShift In Charge\n36. SOs\n-\nSecurity Officers\n37. SOP\n-\nStandard Operating Procedure\n38. SOTC\n-\nSecurity Officer Training Course\n39. TESDA\n-\nTechnical Education and Skills Development Authority\n40. TL\n\n-\nTeam Leader\n41. 11 GOs\n-\nEleven General Orders\n42. 5Ws & 1H -\nWhat, Where, When, Who, Why, How\n\n--- PDF PAGE 61 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nP/SUPT. TEROY B. TAGUINOD\nAssistant Director for Human Resource\nand Doctrines Development, CSG\nCamp Crame, Quezon City\n\nMR. ROGER P. CUARESMA\nTraining Director\nTREND LINE Career, Trng.\nCenter, Inc. (East Ave., QC)\nP/C INSP. EDITHA M. HINLO\nChief,\nPrivate Security Training Mgmt. Branch\nSecurity Agency and Guard Supervision\n(SAGSD)\nCamp Crame, Quezon City\n\nMR. LIBRADO T. CAYCO SR. CSP\nTraining Director\nTASK Security Academy Inc.\n138 3/F 14th Ave., Near Cor. P.\nTuazon, Brgy. Soccorro\nCubao, Quezon City\nP/SR. INSP. CONSOLACION B. RAPADA\nTraining Officer\nSAGSD, CSG\nCamp Crame, Quezon City\nMR. EDGARDO G. BACSA\nTraining Director\nSun & Shield Sec. Training Center\nBroadway Centrum, Aurora Blvd.\nQuezon City\n\nMAJ. PABLO I. TABERDO, CSP\nTraining Director\nRight Eight Security Agency, Inc.\n2/F Manila Memorial Park Bldg.\n2283 Pasong Tamo Extension\nMakati City\nMS. NELIA S. TOLENTINO\nChairman\nPhil. Assn. Of Recognized Security\nTraining Schools, Inc. (PARSTS)\nSan Andres, Manila\n\nMR. ELPIDIO A. MUESCAN SR.\nPresident\nPhil. Ass. Of Recognized Security\nTraining Schools, Inc. (PARSTS)\nSampaloc, Manila\n\nThe Participants in the Validation of this Training Regulations\n\n• Region I\n\n• Region VII\n\n•\nRegion VIII\n• Region XI\n\n• NCR\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n• SSCO\n•\nNITVET\n• TESDA\nRegional/Provincial\nOffices\n(Regions I, VII, VIII, XI, NCR)\n\n--- PDF PAG