        "source_text": "HCS516311\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in preparing\nsecurity systems reports.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine style and\nform of report\n1.1\nSource of information are verified according to company\nrequirements.\n1.2\nKind of report to be submitted are identified based on\nrequirements.\n1.3\nSecurity correspondence are prepared using approved\nformat.\n1.4\nCommunication flow followed at all times.\n2. Prepare report\n2.1\nReports are prepared in accordance to 5Ws and 1H prepared.\n2.2\nAttachments and justification prepared if needed.\n2.3\nReports are checked as to completeness.\n3. Submit report to\nproper authorities\n\n3.1\nReceipt of reports by appropriate personnel is ensured.\n3.2\nActions on reports submitted are constantly checked.\n3.3\nActions/status on reports submitted are properly documented.\n\n--- PDF PAGE 45 ---\nTR Security Services NC II\n\n-19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Source of Information\n1.1\nPersonnel\n1.2\nInformants\n1.3\nWitness\n1.4\nLogbook\n2. Kind of Report\n\n2.1\nActivity Report\n2.2\nViolation Report\n2.3\nIncident/Spot Report\n2.4\nAccomplishment Report\n2.5\nGuard Details Report\n2.6\nInformation Report\n2.7\nSecurity Equipment Report\n2.8\nExplanation Report\n2.9\nProgress Report\n2.10 Inspection Report\n2.11 Daily Activity Report\n2.12\nEvaluation Report\n3. Security\nCorrespondence\nInclusions\n3.1\nHeading\n3.2\nSubject\n3.3\nFacts/Details\n3.4\nRemarks/Recommendations\n4. Attachments/\nJustifications\n4.1\nPhotocopy and Pictures\n4.2\nStatement (Subscribed/Sworn)\n\n--- PDF PAGE 46 ---\nTR Security Services NC II\n\n-20\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared activity report\n1.2\nPrepared violation report\n1.3\nPrepared incident/spot report\n1.4\nPrepared accomplishment report\n1.5\nPr