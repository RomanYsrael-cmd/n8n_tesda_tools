\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR Security Services NC II\n\n-12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR Security Services NC II\n\n-13\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge and\nattitudes\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\n Workplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR Security Services NC II\n\n-14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH\nCLIENTS/CUSTOMERS\n\nUNIT CODE\n:\nHCS516201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nbuilding and maintaining an effective relationship with clients,\ncustomers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a\nprofessional image\n\n1.1\nUniform and personal grooming maintained to assignment\nrequirements.\n1.2\nPersonal presence maintained according to employer\nstandards.\n1.3\nVisible work area kept tidy and uncluttered.\n1.4\nEquipment stored according to assignment requirements.\n2. Meet client/customer\nrequirements\n2.1\nClient requirements identified and understood by referral to\nthe assignment instructions.\n2.2\nClient requirements met according to the assignment\ninstructions.\n2.3\nChanges to client’s needs and requirements monitored and\nappropriate action taken.\n2.4\nAll communication with the client or customer is clear and\ncomplies with assignment requirements.\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2\nPossible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.3\nClient fully informed of all relevant security matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 19 ---\nTR Security Services NC II\n\n-15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanour\n1.5 Grooming\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n3. Client Requirements\nMay include:\n3.1\nAssignment Instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment instructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 20 ---\nTR Security Services NC II\n\n-1\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image.\n1.2\nInterpreted client/customer requirements from information\ncontained in the client brief and/or assignment instructions.\n1.3\nDealt successfully with a variety of client/customer\ninteractions.\n1.4\nMonitored and acted on changing client or customer needs.\n1.5\nMet client/customer requirements.\n1.6\nBuilt credibility with customers/clients.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nUniform and personal grooming requirements of the employer\nand the client\n2.2\nOccupational Health and safety requirement for the\nassignment\n2.3\nLegal requirements and guidelines for the storage of firearms\nand equipment (as appropriate and where required)\n2.4\nAssignment Instructions\n3. Underpinning skills\n3.1\nAttention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer\nneeds\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and 