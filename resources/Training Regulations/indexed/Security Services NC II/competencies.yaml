ut \n2.50 Building Security Procedures \n2.51 Dangerous Goods (Items and Materials) \n2.52 Confiscation Procedures (where relevant) \n2.53 Communication (Report Writing, Radio Language) \n2.54 Legal Aspect \n2.55\nGender Awareness and Development\n3. Underpinning skills \n3.1 \nParticipating in emergency drills \n3.2 \nEnforcing contingency plan in cases of bank robbery, kidnaps \nfor ransom, drug trafficking and other related crimes \n3.3 \nEnforcing bomb threat preventive measures \n3.4 \nEnforcing contingency civil disturbance plan \n3.5 \nRendering assistance to injured victims \n3.6  \nImplementing evacuation procedures during calamities \n3.7 \nMarksmanship \n3.8 \nDefensive Tactics \n3.9 \nReport Writing Skills \n3.10 Communicating Skills \n3.11 Monitoring Skills \n3.12 Securing Area \n3.13 Observing suspicious movements/area \n3.14 Describing/Identifying suspicious movements/area \n3.15 Communicating clearly with clients/customers \n3.16 Giving instructions \n3.17 Conducting  Search (Baggage, Vehicles, Loads \n3.18 Directing Traffic \n3.19    Controlling Key  \n3.20\nRecords Keeping\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAssessment Centers/Venues \n4.2 \nAccredited Assessors \n4.3 \nModes of Assessment \n4.4 \nEvaluation Reports \n4.5 \nAccess to relevant venue, security equipment and materials \n4.6 \nAssignment Instructions \n4.7 \nLogbooks \n4.8 \nOperational manuals and makers’/customers’ instruction (if \nrelevant) \n4.9 \nAssessment instruments, including personal planner and \nassessment record book\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nWritten Test \n5.2\nDemonstration with questioning\n6. Context of \nassessment \n6.1 \nCompany \n6.2 \nOn-Site \n6.3 \nAssessment activities are carried out through TESDA/PNP \naccredited assessment centers/venues by using closely \nsimulated work place environment",
