Surveillance\n3.18 Interpreting Alarm Signals\n3.19 Searching Techniques\n3.20\nBomb Security Awareness\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, security equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA/PNP\naccredited assessment centers/venues by using closely\nsimulated work place environment\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit\n6.5 Continuous assessment in the workplace, taking into account\nthe range of variables affecting performance\n6.6 Self-assessment on the same terms as those described above\n6.7 Simulated assessment or critical incident assessment, provided\nthat the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria\n\n--- PDF PAGE 31 ---\nTR Security Services NC II\n\n-5\nUNIT OF COMPETENCY : ENFORCE ACCESS CONTROL AND IDENTIFICATION SYSTEM\nUNIT CODE\n:\nHCS516308\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes in enforcing\naccess control and identification system. It includes application of\nSOPs for access and identification in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Regulate access and\nidentification system\nfor pedestrians,\nvisitors and clients\n\n1.1\nBonafide persons entering premises or restricted areas are\nverified by checking relevant details on identification\ndocuments.\n1.2\nIssues and return of entry passes are controlled according to\nassignment instructions.\n1.3\nPersons attempting to gain entry without authorization are\nreported and recorded as appropriate.\n1.4\nIncidents that infringe employment/client instructions are\nrecorded and reported to proper authorities.\n1.5\nSOPs in checking entry of incoming/outgoing pedestrians,\nvisitors and clients are implemented in accordance with\ncompany policies and regulations.\n1.6\nSOPs of disgruntled pedestrians, visitors and clients are\nimplemented in accordance with company policies and\nregulations.\n1.7\nVisitors are received and escorted according to assignment\ninstructions.\n2. Regulate access and\nidentification system\nfor vehicles,\ndeliveries, bodily\nsearch, luggage,\nbaggage, bags and\nparcels\n2.1\nVehicles entering/leaving the site are checked and/or\nmonitored according to assignment instructions.\n2.2\nSearch is carried out according to assignment instructions.\n2.3\nJustification for search of person’s property is clearly\nestablished having regard to company policy.\n2.4\nIncoming/outgoing vehicles, deliveries, luggage, baggage,\nbags and parcels are checked in accordance with company\npolicies and procedures.\n2.5\nVehicle access and issue of vehicle passes are controlled\naccording to assignment instructions.\n2.6\nVehicle parking is permitted according to assignment\ninstructions relevant company policy.\n2.7\nQuestionable items found during search are dealt with\naccording to company policies.\n2.8\nRequest to search person’s property are made according to\nassignment instructions and having regard to legal\nrequirements.\n3. Regulate access and\nidentification system\nfor any company\nproperties\n3.1\nControllable physical barriers are operated according to\nassignment instructions.\n3.2\nKeys and key cards are controlled, recorded and monitored\naccording to assignment instructions.\n3.3\nIncoming and outgoing company properties are checked in\naccordance with company SOP.\n3.4\nKeys, keypads, key cards and alarm panels to secure\npremises are used according to manufacturer’s specification.\n3.5\nKeypad and alarm entry systems are activated and\ndeactivated according to prescribed procedures and client’s\ninstructions.\n\n--- PDF PAGE 32 ---\nTR Security Services NC II\n\n-6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n4. Check incoming\ndeliveries\n4.1\nRequirements for entry/exit are properly counter checked\nand recorded as to its validity.\n4.2\nSOPs of checking incoming/outgoing deliveries were strictly\nfollowed and observed as per company policy.\n4.3\nTime of arrival and departure of delivery vehicle are recorded\nand logged as per company policy.\n4.4\nDrivers and passengers/crew of vehicles are recorded using\napproved reporting forms.\n4.5\nPlate number of delivery vehicles are recorded in the logbook.\n4.6\nLoaded properties are checked with official documents.\n5. Check pull out of\nproperties\n5.1\nRequirements for exit were properly counterchecked and\nrecorded as to its validity.\n5.2\nSOPs of checking pull-out of properties were strictly\nfollowed/observed as per company policy.\n5.3\nTime of departure of vehicles are recorded/logged as per\ncompany policy.\n5.4\nPlate number of vehicle and recorded in the logbook.\n5.5\nPull-out of personnel time departure are recorded in the\nlogbook.\n5.6\nProperties pulled-out are checked with official documents.\n\n--- PDF PAGE 33 ---\nTR Security Services NC II\n\n-7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Identification\nDocuments\n\n1.1\nI. D. Cards\n1.2\nPasses\n1.3 Badges\n1.4\nGate Pass\n1.5\nMaterial Pass\n1.6\nWork Permits\n1.7\nLoad Manifests\n1.8\nReceipts\n2. Persons\n2.1\nVisitors\n2.2\nSales Representatives\n2.3\nContractors\n2.4\nAll persons with valid reasons for entering premises\n2.5\nEmergency Services\n2.6\nDemonstrators\n2.7\nUtility Company\n3. Incidents\n3.1\nRefusal to show pass\n3.2\nLost Pass\n3.3\nUsing a pass belonging to another party\n3.4\nAccidents resulting in injury (vehicles/persons)\n3.5\nVehicles incorrectly parked\n3.6\nStolen Vehicles\n3.7\nForced entry of persons and/or vehicles\n3.8\nUnauthorized items found during inspection\n4. Assignment\nInstruction\n\n4.1\nTypes of Vehicles\n4.1.1 Organic\n4.1.2 Non-Organic\n4.1.3 Size\n4.2\nDesignated Parking Area\n4.2.1 Organic\n4.2.2 Non-Organic\n4.3\nAuthority\n4.3.1 Passes\n4.3.2 Badges\n4.3.3 Stickers/Decals\n5. Types of Physical\nBarriers\n5.1\nWorking System\n5.2\nTraffic Barriers\n5.3\nElectronic Access Doors\n5.4\nShutters and Gates\n6. Official Documents\n\n6.1\nInvoice\n6.2\nDelivery Receipts\n6.3\nPurchase Orders\n6.4\nGate Pass\n6.5\nTally-Out\n7. Requirements for\nEntry/Exit\n7.1\nPersonnel\n7.1.1 Personnel/Authority Pass\n7.1.2 Authorization\n7.2\nProperty\n7.2.1 Delivery\n7.2.2 Demo\n7.2.3 Gate Pass\n7.2.4 Invoice\n7.2.5 Pull-Out Receipt\n7.2.6 Tally-Out\n\n--- PDF PAGE 34 ---\nTR Security Services NC II\n\n-8\nEVIDENCE GUIDE\n\n1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nRegulated of access and identification system for pedestrians,\nvisitors and clients\n1.2\nRegulated of access and identification system for vehicles,\ndeliveries, bodily search, luggage, baggage, bags and parcel\n1.3\nRegulated of access and identification system for company\nproperties\n1.4\nChecked incoming/outgoing deliveries\n1.5\nChecked pull out of properties\n1.6\nDemonstrated capacity to correctly secure premises and\nsystems according to assignment instructions\n1.7\nDemonstrated capacity to determine assignment needs and\ninstructions and deal with monitoring situations in the area\n1.8\nDemonstrated capacity to identify items and goods which may\nbe 