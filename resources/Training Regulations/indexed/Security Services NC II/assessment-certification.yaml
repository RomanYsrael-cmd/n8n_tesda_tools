      "text": "1 To attain the National Qualification of Security Service NC II, the candidate must demonstrate competence through project type assessment covering all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General."
    },
    {
      "number": "4",
      "text": "2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4",
      "text": "3 The following are qualified to apply for assessment and certification:"
    },
    {
