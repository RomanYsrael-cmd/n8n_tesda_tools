      "text": "9 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 58 --- TR Security Services NC II -32 --- PDF PAGE 59 --- TR Security Services NC II -33 1. Area of Responsibility – the place where the guards-on-duty are stationed. 2. Bodily Search- is a type of personnel control where the guard-on-duty requires a prospective subject to manual search using hands or electronic equipment. 3. Citizens Arrest – taking of person into custody in order for him/her to be bound to answer for the commission of an offense. 4. Company Premises – refers to a specific place of duty as specified or stated in the Duty Detail Order (DDO). 5. Duty Detail Order (DDO) – is a written order/schedule issued by a superior officer usually the private security agency/branch manager or operations officer assigning the performance of private security/detective services duties. 6. Guard Detailed – a written report consisting of names of guards mobilized to different post assignments in a particular shift. 7. Initial Report – it refers to preliminary phase of investigation report either written or oral and in accordance with the company policies. 8. Inspection Stick – a non-conductor stick used for inspection of bags and personal luggage. 9. Metal Detector – a security equipment being used by the guards to detect firearms, bladed weapons or any metal objects."
