    {
      "number": "4.1",
      "text": "To attain the National Qualification of Security Service NC II, the candidate must demonstrate competence through project type assessment covering all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General."
    },
    {
      "number": "4.2",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.3",
      "text": "The following are qualified to apply for assessment and certification: 4.3.1 Graduates of formal, non-formal and informal including enterprise-based training programs 4.3.2 Experienced Workers (wage employed or self-employed)"
    },
    {
      "number": "4.4",
      "text": "Re-assessment is allowed only after one month from the date of assessment. Re-assessment for National Certificate shall be only on the tasks that the candidate did not successfully achieved."
    },
    {
