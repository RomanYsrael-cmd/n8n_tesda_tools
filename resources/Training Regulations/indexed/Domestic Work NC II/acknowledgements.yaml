      "source_text": "1.1 Tasks accurately identified 1.2 Priority allocated to each task 1.3 Time lines allocated to each task or series of tasks 1.4 Tasks deadlines known and complied with whenever possible 1.5 Work schedules are known and completed with agreed time frames 1.6 Work plans developed according to assignment requirements and employer policy 1.7 Uncompleted work or tasks detailed and responsibility for completion passed to incoming shift or other appropriate persons 1.1 Assignment instructions 1.2 Verbal instructions 1.3 Policy documents 1.4 Duty statements 1.5 Self-assessment 1.6 Daily tasks 1.7 Weekly tasks 1.8 Regularly or irregularly occurring tasks 1.9 Allocating priority and timelines 1.1 Identifying tasks accurately according to instructions 1.2 Developing work plans according to assignment requirements and employer policy 1.3 Allocating priority and timelines to each task 1.4 Determining tasks deadlines and comply with whenever possible 1.5 Determining and completing work schedules according to agreed time frames 2. Maintain quality of performance 2.1 Personal performance continually monitored against agreed performance standards 2.2 Advice and guidance sought when necessary to achieve or maintain agreed standards 2.3 Guidance from management applied to achieve or maintain agreed standards 2.4 Standard of work clarified and agreed according to employer policy and procedures 2.1 Monitoring personal performance 2.2 Determining performance standards 2.3 Interpreting work standards 2.4 Quality of work 2.1 Monitoring personal performance continually against agreed performance standards 2.2 Seeking advice and guidance when necessary to achieve or maintain agreed standards 2.3 Applying guidance from management to achieve or maintain agreed standards"
