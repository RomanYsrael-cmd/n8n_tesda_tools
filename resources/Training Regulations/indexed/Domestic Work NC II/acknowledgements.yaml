    {
      "source_text": "3.6 TRAINER’S QUALIFICATIONS FOR DOMESTIC WORK NC II"
    },
    {
      "source_text": "Must be a holder of NTTC Level I in Domestic Work NC II"
    },
    {
      "source_text": "Must have good communication skills"
    },
    {
      "source_text": "Must have at least two (2) years job/industry experience"
    },
    {
      "source_text": "Must be qualified with competency in Facilitate E-Learning Sessions (FELS)"
    },
    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional Assessment is gathering of evidences to determine the achievements of the requirements of the qualification to enable the trainer make judgement whether the trainee is competent or not competent."
    },
    {
      "source_text": "-- PDF PAGE 201 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 197 SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT"
    },
    {
      "source_text": "Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards."
    },
    {
      "source_text": "The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to an employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1.1 To attain the national qualification of DOMESTIC WORK NC II, the candidate must demonstrate competence through project-type assessment covering all required units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.1.2 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "source_text": "4.1.3 The qualification of DOMESTIC WORK NC II may be attained through –"
    },
    {
      "source_text": "4.1.3.1 Accumulation of Certificates of Competency (COCs) in the following units of competencies:"
    },
    {
      "source_text": "COC 1: Clean living room, dining room, bedroom, bathroom and kitchen COC 2: Wash and iron clothes, linen and fabric COC 3: Prepare hot and cold meals COC 4: Provide food and beverage service"
    },
    {
      "source_text": "4.1.3.2 Depending on specific employer/workplace requirements, the candidate may choose one or more from the following groups of Elective Competencies. Each group will lead to the issuance of Certificates of Competency (COC) in the following clusters of related competencies:"
    },
    {
      "source_text": "COC 1: Provide care for animals"
    },
    {
      "source_text": "Assist in the care of animals"
    },
    {
      "source_text": "Provide animal care hygiene routines"
    },
    {
      "source_text": "COC 2: Maintain plants and gardens"
    },
    {
      "source_text": "Trim and prune landscape plants"
    },
    {
      "source_text": "Perform weeding and cultivation"
    },
    {
      "source_text": "Water/irrigate plants"
    },
    {
      "source_text": "Control and prevent plant pest and diseases"
    },
    {
      "source_text": "-- PDF PAGE 202 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 198 Holders of unexpired National Certificate or Certificate of Competency (COC 2 : Maintenance) in Landscape Installation and Maintenance (Soft Scape) NC II shall be exempted from the requirement of COC 2 on “Maintain plants and gardens”."
    },
    {
      "source_text": "The elective competencies on providing care and support for newborn, infants, toddlers, children, elderly, people with special needs were not included because these are highly specialized areas. Moreover, the revised Training Regulations on Caregiving NC II are now composed of 4 types designed for specific clients (newborn to toddlers, children to adolescent, elderly and clients with special needs). Hence, a person qualified to apply for assessment and certification in these qualifications may opt to take the National Assessment."
    },
    {
      "source_text": "4.1.4 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.1.4.1 Graduates of WTR-, NTR-registered programs or formal/non- formal/informal including enterprise-based training programs related to domestic work;"
    },
    {
      "source_text": "4.1.4.2 Experienced workers (wage employed or self-employed) who gained competencies in domestic work for at least 2 years within the last five (5) years."
    },
    {
      "source_text": "4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least five (5) years of experience in domestic work within the last ten (10) years may apply for recognition in this Qualification through Portfolio Assessment. The conduct of Portfolio Assessment is subject to TESDA Circular No. 118 series of 2019."
    },
    {
      "source_text": "4.1.6 The Holders of National Certificate (NC) or Certificates of Competency (COCs) in Domestic Work NC II are required to undergo re-assessment under the amended Training Regulations (TRs), upon expiration of their Certificates."
    },
    {
      "source_text": "4.2 COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment."
    },
    {
      "source_text": "This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge"
    },
    {
      "source_text": "-- PDF PAGE 203 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 199 c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment"
    },
    {
      "source_text": "4.2.2 Accredited Assessment Center (AAC). Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "source_text": "4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality-assured system of accreditation procedures before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    },
    {
      "source_text": "The qualifications of Competency Assessors are specified in TESDA’s Implementing Guidelines on the Deployment of Training Regulations (TR) and Competency Assessment Tools (CATs) for Domestic Work NC II."
    },
