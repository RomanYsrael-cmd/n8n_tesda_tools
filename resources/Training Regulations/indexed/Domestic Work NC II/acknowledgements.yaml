      "source_text": "-- PDF PAGE 206 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 202 GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. Alcohol – naturally occurring and easily synthesized compound that induces intoxication when consumed. 2. Ambiance – the combined atmosphere created by the décor, lighting, service, possible environment (such as background music) and song, that enhances the dining or lodging experience. 3. Barbecue – a cooking method involving grilling food over a wood or charcoal fire. Usually some sort of rub, marinade or sauce is burdened on the item before or during cooking. 4. Bed and Bath Linen – items such as sheets, pillow cases, hand towels, bath towels, washcloths and cloth bath mats. 5. Beddings – all bed linens such as sheets and pillow cases and all blankets, shams, dust raffles, pillows, quilts, comforters, coverlets, mattress pads and bed spreads. 6. Blanch – to cook an item briefly in boiling water or hot fat before finishing or storing it. 7. Boil – a cooking method in which items are immersed in liquid at or above the boiling point. 8. Braise – a cooking method in which the main item, usually meat, is seared in fat, then simmered in stock to another liquid in a covered vessel. 9. Broil – a cooking method in which items are cooked by a radiant heat source placed above the food, usually in a broiler. 10. Carpet Sweeper – a handy type of sweeper used to pick-up dirt and particles from the carpet surface. 11. Chop – to cut into pieces of roughly the same size. Also, a small cut of meat including part of the rib. 12. Cuisine – food cooked and served in styles from around the world. 13. Cutlery – refers to knives and other cutting implements. 14. Deep Fry – a cooking method in which foods are cooked by immersion in hot fat; deep fried foods are often coated with breadcrumbs or butter before being cooked. 15. Detergent – a chemical that acts like a soap and is used for cleaning numerous surfaces. Detergents can be used effectively in hard water where ordinary soap not produce suds and will leave a residue. 16. Dice – to cut ingredients into small cubes (1/4 inches for small, 1/3 for medium, ¾ inch for large). 17. Disinfectant – a substance or means used to destroy pathogenic microorganisms. 18. Disinfection – a condition existing when infectious material or infection/s are removed. 19. Fillet – a boneless cut of meat, fish or poultry. 20. Flatware – it denotes all forms of spoons and forks. 21. Furniture, Fixtures & Eqpt. (FFE) – classification of fixed assets that have specified depreciable lives, usually ranging from three to seven years."
    },
    {
      "source_text": "-- PDF PAGE 207 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 203 22. Garnish – an ingredient that decorates, accompanies or completes a dish. Many dishes are identified by the name of their garnishes. 23. Grill – a cooking technique in which foods are cooked by a radiant heat source placed below the food. Also, the piece of equipment on which grilling is done. 24. Housekeeping – refers to cleaning and sanitizing rooms. 25. Linen – traditionally a cloth made from flax fiber but now, it is used to indicate sheets, pillow cases, washcloths, cloth bath mats, towels, tablecloths and napkins. 26. Marinade – a method used in cooking to flavor and moisten foods, may be liquid or dry. Liquid marinades are usually based on acidic ingredients such as wine or vinegar. Dry marinades are usually salt-based. 27. Menu – a list of the chef’s dishes. A list in specific order of the dishes to be served at a given time. 28. Mise en place – French phrase meaning “everything in its place”; a state of overall preparedness, having all the necessary ingredients and cooking utensils at hand ready to use at the moment work on a dish begins. 29. Microwave – a method of meat transfer in which electro-magnetic waves generated by a device called a magnetron penetrate food and cause the water molecules in it to oscillate. 30. Mince – to chop into small pieces. 31. Panbroil – a cooking method similar to dry sautéing that simulates broiling by cooking an item in a hot pan with little or no fat. 32. Panfry – a cooking method in which items are cooked in deep fat in a skillet over medium heat; this generally involves more fat than sautéing or stir-frying but less than deep-frying. 33. Poach – a method in which items are cooked gently in simmering liquid. 34. Pressure Steamer – a machine that steams food by heating water under pressure in a sealed compartment, allowing the steam to reach higher-than-boiling temperature. The food is placed in a sealer chamber that cannot be opened until the pressure has released and the steam properly vented from the chamber. 35. Roast – a dry heat cooking method in which items are cooked in an oven or on a spit over a fire. 36. Sanitizer – a sanitizing substance or product. To sanitize is to prevent the spread of disease. 37. Saute’ - a cooking method in which items are cooked quickly in a small amount in fat in a pan on the range top. 38. Silverware – tableware made of solid silver, silver glit or silver metal; silver plate made from single strip of plated metal. 39. Simmer – to maintain the temperature of a liquid just below boiling. Also, a cooking method in which items are cooked in a simmering liquid. 40. Spirits – are drinks obtained by distillation after fermentation from vegetables, grains, fruits, plants and other substance with sugar or starch-based. 41. Squeegee – a cleaning instrument with rubber blade used for cleaning glass windows and panels."
    },
    {
      "source_text": "-- PDF PAGE 208 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 204 42. Steaming – a cooking method in which items are cooked in a vapor by boiling water or other liquids. 43. Step Ladder – used to reach high objects. 44. Stew – a cooking method nearly identical to braising but generally involving smaller pieces of meat and hence a shorter cooking time. Stewed items also may be blanched, rather than seared, to give the finished product a pale color. Also a dish prepared by using the stewing method."
    },
