      "source_text": "-- PDF PAGE 183 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 179 3.2 TRAINING DELIVERY"
    },
    {
      "source_text": "1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be guided by the principles of competency-based TVET."
    },
    {
      "source_text": "a. Course design is based on competency standards set by the industry or recognized industry sector; (Learning system is driven by competencies written to industry standards) b. Training delivery is learner-centered and should accommodate individualized and self-paced learning strategies; c. Training can be done on actual workplace setting, simulation of a workplace and/or through adoption of modern technology; d. Assessment is based in the collection of evidence of the performance of work to the industry required standards; e. Assessment of competency takes the trainee’s knowledge and attitude into account but requires evidence of actual performance of the competency as the primary source of evidence; f. Training program allows for Recognition of Prior Learning (RPL) or current competencies; g. Training completion is based on satisfactory performance of all specified competencies."
    },
    {
      "source_text": "2. The competency – based TVET system recognizes various types of delivery modes, both on and off-the-job as long as the learning is driven by the competency standards specified by the industry. The following training modalities and their variations/components may be adopted singly or combination with other modalities when designing and delivering training programs:"
    },
    {
      "source_text": "2.1 Institution-based:"
    },
    {
      "source_text": "Dual Training System (DTS)/Dualized training Program (DTP) which contain both in-school and in-industry training or fieldwork components. Details can be referred to the Implementing Rules and Regulations of the DTS Law and the TESDA Guidelines on the DTP;"
    },
    {
      "source_text": "Distance learning is formal education process in which majority of the instruction occurs when the students and instructor are not in the same place. Distance learning may employ correspondence study, audio, video, computer technologies or other modern technology that can be used to facilitate learning and formal and non-formal training. Specific guidelines on this mode shall be issued by the TESDA Secretariat."
    },
    {
      "source_text": "Supervised Industry Learning (SIL) or on-the-job training (OJT) is an approach in training designed to enhance the knowledge and skills of the trainee through actual experience in the workplace to acquire"
    },
    {
      "source_text": "-- PDF PAGE 184 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 180 specific competencies as prescribed in the training regulations. It is imperative that the deployment of trainees in the workplace is adhered to training programs agreed by the institution and enterprise and status and progress of trainees are closely monitored by the training institutions to prevent opportunity for work exploitation."
    },
    {
      "source_text": "The classroom-based or in-center instruction uses of learner-centered methods as well as laboratory or field-work components."
    },
    {
      "source_text": "2.2 Enterprise-based:"
    },
    {
      "source_text": "Formal Apprenticeship is training within employment involving a contract between an apprentice and an enterprise on an approved apprentice able occupation."
    },
    {
      "source_text": "Informal Apprenticeship is based on a training (and working) agreement between an apprentice and a master craftsperson wherein the agreement may be written or oral and the master craftsperson commits to training the apprentice in all the skills relevant to his or her trade over a significant period of time, usually between one and four years, while the apprentice commits to contributing productively to the work of the business. Training is integrated into the production process and apprentices learn by working alongside the experienced craftsperson."
    },
    {
      "source_text": "Enterprise-based Training where training is implemented within the company in accordance with the requirements of the specific company. Specific guidelines on this mode shall be issued by the TESDA Secretariat."
    },
    {
      "source_text": "2.3 Community-based"
    },
    {
      "source_text": "Community-based is short term programs conducted by non- government organizations (NGOs), LGUs, training centers and other TVET providers which are intended to address the specific needs of a community. Such programs can be conducted in informal settings such as barangay hall, basketball courts, etc. These programs can also be mobile training program (MTP)."
    },
    {
      "source_text": "3.3 TRAINEE ENTRY REQUIREMENTS"
    },
    {
      "source_text": "Trainees or students wishing to enroll in this program must possess the following requirements:"
    },
    {
      "source_text": "Must have completed basic education or Holder of Alternative Learning Systems (ALS) certificate of completion with grade 10 equivalent;"
    },
    {
      "source_text": "Must have good communication skills"
    },
    {
      "source_text": "Must be able to navigate through any online training platforms using electronics devices"
    },
    {
      "source_text": "-- PDF PAGE 185 --- Domestic Work NC II – SOCDOW222 Promulgated (05/2022) 181 3.1 TOOLS, EQUIPMENT AND MATERIALS"
    },
    {
      "source_text": "Recommended list of tools, equipment and materials for the training of 25 trainees for DOMESTIC WORK NC II."
