    },
    {
      "source_text": "The Elective competencies are additional core units of competencies that are useful but not absolutely necessary for enhancing the mobility/employability of a person. These competencies are considered important in the performance of the job and may be drawn from among the units of competency in the TRs promulgated for other sectors. Likewise, they are only taken depending on the need of the work environment."
