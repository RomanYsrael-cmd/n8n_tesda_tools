sed\n4.3.4 Lunging forward\n4.3.5 Pecking\n4.3.6 Striking out with paws\n4.4 Submissive gestures:\n4.4.1 Lowering body\n4.4.2 Rolling onto back\n4.4.3 Tail between legs\n4.4.4 Turning away from handler\n\n--- PDF PAGE 85 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n81\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires that the candidate:\n1.1\nConfirmed industry terminology used to describe daily\nwork routines and to report observations and activities\nto supervisor\n1.2\nCleaned work areas and animal housing in accordance\nwith OHS and organization policies and procedures\n1.3\nAssisted in the preparation and distribution of food\nunder supervision\n1.4\nRelated basic animal behavior to animal categories and\nreport observations of live animal behavior and health\nstatus to supervisor.\nThe skills and knowledge required to assist in the care of\nanimals must be transferable to a range of work environments\nand contexts and include the ability to deal with unplanned\nevents.\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nAnimal care workplace\n2.2\nMaterials, tools and equipment relevant to the\nproposed activity or task\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nWritten Examination\n3.2\nInterview\n3.3\nDemonstration with questioning\n\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment\nCenter.\n\n--- PDF PAGE 86 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n82\nUNIT OF COMPETENCY\n:\nPROVIDE ANIMAL CARE HYGIENE ROUTINES\n\nUNIT CODE\n:\nSOC913402\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the responsibilities and\nprocedures required to provide daily care of animals,\nincluding the cleaning of animal housing and grooming or\ncleaning of animals under supervision.\n\nNo licensing, legislative, regulatory or certification\nrequirements apply to this u