  "source_text": "ACKNOWLEDGEMENTS …………………….….…………….....…………\n205 – 206\n\nTRAINING REGULATIONS DOCUMENT REVISION HISTORY …...….\n207\n\n--- PDF PAGE 5 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n1\nTRAINING REGULATIONS FOR\nDOMESTIC WORK NC II\n\nSECTION 1 DEFINITION OF QUALIFICATION\n\nThe DOMESTIC WORK NC II Qualification consists of competencies that a person must\nachieve to clean living room, dining room, bedroom, bathroom and kitchen; wash and iron\nclothes, linen and fabric; prepare hot and cold meals; and provide food and beverage service.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUnit Code\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the workplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nUnit Code\n\nCOMMON COMPETENCIES\nSOC514201\nMaintain an effective relationship with client/customer\nSOC514202\nManage own performance\n\nUnit Code\n\nCORE COMPETENCIES\nSOC913301\nClean living room, dining room, bedroom, bathroom and kitchen\nSOC913302\nWash and iron clothes, linen and fabric\nSOC913303\nSOC913304\nPrepare hot and cold meals\nProvide food and beverage service\n\nUnit Code\n\nELECTIVE COMPETENCIES\nSOC913401\nAssist in the care of animals\nSOC913402\nProvide animal care hygiene routines\nAGR611376\nAGR611377\nAGR611379\nAGR611380\nTrim and prune landscape plants\nPerform weeding and cultivation\nWater/irrigate plants\nControl and prevent plant pest and diseases\n\nA person who has achieved this Qualification is competent to be:\n\n❑ Domestic Worker\n❑ Houseboy\n❑ Housemaid\n❑ Housekeeper\n❑ Hand-launderer\n❑ Helper, Kitchen\n❑ Cleaner, Hotel\n\n--- PDF PAGE 6 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n2\n\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in DOMESTIC WORK NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n: 400311210\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are used\nto gather and convey\ninformation\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non-verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n\n1.1 Effective verbal and\nnonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in the\nworkplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n1.8 Workplace etiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Applying basic\nbusiness writing\nskills\n\n--- PDF PAGE 7 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.9 Applying\ninterpersonal skills\nin the workplace\n1.10 Performing\nactive-listening\nskills\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are read\nand interpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstructions are\nfollowed based on\nestablished procedures\n2.3 Feedback is given to\nworkplace supervisor-\nbased instructions/\ninformation received\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and matters\nconcerning conditions\nof employment are\nsought and asked from\nappropriate sources\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n2.1 Effective verbal and\nnon-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in the\nworkplace\n2.4 Organizational/\nworkplace policies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n2.8 Effective questioning\ntechniques (clarifying\nand probing)\n2.9 Workplace etiquette\n\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace\nmeetings and\ndiscussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Applying basic\nquestioning/\nquerying\n2.9 Applying skills in\nreading for\ninformation\n2.10 Applying skills in\nlocating\n3. Complete\nrelevant\nwork- related\ndocuments\n3.1 Range of forms relating\nto conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.1 Effective verbal and\nnon-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms and\ndocuments\n3.4 Organizational/\nWorkplace policies\n3.1 Completing work-\nrelated documents\n3.2 Applying\noperations of\naddition,\nsubtraction,\ndivision and\nmultiplication\n\n--- PDF PAGE 8 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Errors in recording\ninformation on forms/\ndocuments are identified\nand acted upon\n3.4 Reporting requirements\nto supervisor are\ncompleted according to\norganizational guidelines\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Applying Effective\nrecord keeping\nskills\n\n--- PDF PAGE 9 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n5\n RANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Appropriate\nSources\nMay include:\n1.1\nTeam members\n1.2\nSupervisor/Department Head\n1.3\nSuppliers\n1.4\nTrade personnel\n1.5\nLocal government\n1.6\nIndustry bodies\n2. Medium\nMay include:\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation dissemination\n2.5\nFollow-up or verbal instructions\n2.6\nFace-to-face communication\n2.7\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Workplace\nInteractions\nMay include:\