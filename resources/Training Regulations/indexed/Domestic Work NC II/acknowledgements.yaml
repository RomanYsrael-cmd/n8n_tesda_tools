      "source_text": "This course is designed to provide the learner with knowledge, practical skills and attitude, applicable in performing work activities involve in cleaning living room, dining room, bedrooms, toilet and kitchen, washing and ironing clothes, linen and fabric, preparing hot and cold meals/food, and providing food and beverage service. This include classroom learning activities and practical work in actual work site or simulation area."
