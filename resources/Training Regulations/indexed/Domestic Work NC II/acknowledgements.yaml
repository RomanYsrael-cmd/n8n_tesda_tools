4.2 Animal housing\ncleaning techniques\nand equipment\n4.3 Animal\ntemperaments and\nbehaviors related to\nthe associated\nhazards and risks to\nanimals and staff\nduring animal\nhandling and\ncleaning of housing\n4.4 Basic animal\ngrooming and\ntechniques\n\n4.1 Maintain the\nhighest standards\nof hygiene and\ninfection control at\nall times to reduce\nthe risk of infection\nand cross-infection\n4.2 Participate in\narrangements for\nmaintaining the\nhealth and safety\nof all people and\nanimals in the\nworkplace\n4.3 Use equipment\nand materials\ncorrectly and in\naccordance with\nmanufacturers'\nspecifications\n4.4 Numeracy skills to\nestimate, calculate\nand record routine\nworkplace\nmeasures\n4.5 Problem solving\nskills\n4.6 Use safe manual\nhandling\ntechniques and/or\nequipment\n4.7 Communication\nSkills\n4.8 Use safe manual\nhandling\ntechniques and/or\nequipment\n4.9 Use safe waste\nhandling and\ndisposal\nprocedures\n\n--- PDF PAGE 90 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n86\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Complete\npost-hygiene\ncare of\nanimals\n5.1 Animals are returned to\nhousing.\n5.2 Washing equipment is\ncleaned and stored.\n5.3 Grooming tools are\ncleaned, checked and\nstored.\n5.4 Damaged tools are\nreported to\n(supervisor.)\nappropriate household\nstaff.\n5.5 Supplies are audited\nand documented in\naccordance with\nworkplace procedures.\n5.6 Workplace\ndocuments are\nupdated as required.\n\n5.1 Common diseases,\nailments, injuries\nand other impacts\non animal health\nand wellbeing\n5.2 Protocols, legal and\nethical\nconsiderations in\ndocumenting\nobservations,\nmeasurements,\ntreatments and\ndecisions on animal\ncare\n5.3 Cleaning and storing\nof washing\nequipment\n5.4 Cleaning and storing\nof grooming\nequipment\n5.5 Checking and\nreporting of damage\ntools\n\n5.1 Maintain the\nhighest standards\nof hygiene and\ninfection control at\nall times to reduce\nthe risk of\ninfection and\ncross-infection\n5.2 Participate in\narrangements for\nmaintaining the\nhealth and safety\nof all people and\nanimals in the\nworkplace\n5.3 Use equipment\nand materials\ncorrectly and in\naccordance with\nmanufacturers'\nspecifications\n5.4 Numeracy skills to\nestimate, calculate\nand record routine\nworkplace\nmeasures\n5.5 Problem solving\nskills\n5.6 Use safe manual\nhandling\ntechniques and/or\nequipment\n5.7 Communication\nSkills\n5.8 Use safe manual\nhandling\ntechniques and/or\nequipment\n5.9 Use safe waste\nhandling and\ndisposal\nprocedures\n\n--- PDF PAGE 91 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n87\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Workplace\nroutines\nMay include:\n1.1\nAssisting others in completion of tasks within limits\nof current level of competence\n1.2\nCatching and handling animals under supervision\n1.3\nChecking animals for signs of distress, illness and\ninjury\n1.4\nChecking security and repair of animal housing,\nequipment and general facility\n1.5\nCleaning and grooming animals under supervision\n1.6\nCleaning and preparation of animal cages,\nenclosures, exhibits, displays, general work areas,\noffice, reception and customer service areas\n1.7\nConfirming all animals are in their cages or\nenclosures\n1.8\nDocumenting work tasks in accordance with\nworkplace procedures\n1.9\nOperating general equipment used to complete\nworkplace cleaning routines\n1.10 Picking up rubbish, removing branches or other\nunsightly items not part of exhibit or animal housing\n1.11 Reporting animal health concerns to supervisor\n1.12 Stocktaking and re-supply of items\n1.13 Timeframes for completing tasks.\n2. Animals\nMay include:\n2.1 Animals commonly encountered within the industry\nworkplace and may cover both native and introduced\nspecies\n2.2 Animals from the six major animal groups (mammals,\nbirds, reptiles, amphibians, fish and invertebrates).\n3. Animal status\nMay include:\n3.1 Counting animals\n3.2 Observing and reporting unusual behavior for\nnominated animal:\n3.3 Aggression or docility (depending on animal)\n3.4 Disinterest in surroundings, other animals, people or\nusual stimuli\n3.5 Excessive licking, scratching and rubbing\n3.6 Lethargy\n3.7 Nest building\n3.8 Self mutilation\n3.9 Trembling\n3.10 Vocalizing\n3.11 Observing and reporting indicators of illness or injury:\n3.11.1 Bleeding\n3.11.2 Changes in drinking or eating patterns\n3.11.3 Lameness or reluctance to move and\nvocalizing when attempting to move\n3.11.4 Swelling\n\n--- PDF PAGE 92 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n88\n3.11.5 Unusual amounts, color or texture of feces.\n4. Maintaining a\nclean workplace\nMay include:\n4.1 Animal housing:\n4.1.1 Adjusting animal housing features according\nto weather and climatic conditions\n4.1.2 Collection and removal of feces\n4.1.3 Completing cleaning routines for sick or\nquarantined animals to avoid cross-\ncontamination\n4.1.4 Emptying and cleaning water and feeding\nreceptacles using approved cleaning products\nand methods\n4.1.5 Refilling water containers\n4.1.6 Removing rubbish from housing and\nsurrounding areas\n4.1.7 Removing soiled bedding and disposing in\napproved area\n4.1.8 Replacement of housing furniture items, such as\nvegetation and behavior stimulation items under\ndirection of supervisor\n4.1.9 Resetting of clean bedding materials\n4.1.10 Washing down of toilet areas to remove urine and\nfeces using approved cleaning products and\nmethods\n4.2 General work area cleaning:\n4.2.1 Emptying rubbish bins, picking up general litter within\nthe workplace\n4.2.2 Vacuuming, sweeping, floor cleaning\n4.2.3 Using non-disrupting cleaning methods to control\npotential biohazards, when required\n4.2.4 Washing and wiping down work areas, benches and\nequipment\n4.3 Storing equipment to avoid slip and trip hazards\n4.4 Reporting damaged equipment.\n\n--- PDF PAGE 93 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n89\n5. Hygiene control\npractices\nMay include:\n5.1 Aseptic technique\n5.2 Checking animals skin, coat, shell, carapace or other\nexternal features for:\n5.2.1 Foreign objects such as grass seeds, sticks or\nother vegetation and hardware, such as nails\n5.2.2 General condition\n5.2.3 Signs of coat, skin, shell and carapace shedding\n5.2.4 Signs of damage, including cracks, breaks, splits,\nexudates and, tenderness\n5.2.5 Signs of dirt, feces, food or other items\n5.2.6 Signs of parasites, including presence of eggs,\nblisters or other lesions, rubbed areas of coat, skin\ntexture changes and color changes\n5.3 Completing infection control procedures as required\n5.4 Grooming animals to remove shedding coat or skin, if\nrequired, or for general health and wellbeing\n5.5 Isolating potentially contagious or ill animals under\nsupervision\n5.6 Personal hygiene practices especially washing and\ndrying hands (e.g. before and after animal contact)\n5.7 Providing housing furnishings to assist animal to\ncomplete own shedding process\n5.8 Referring to supervisor animals that may require:\n5.8.1 Wound and injury management treatment\n5.8.2 Examination in relation to potential contagious\nconditions\n5.8.3 Repairs to shell\n5.9 Use of personal protective equipment\n5.10 Washing animal to remove dirt, foreign objects,\nparasites and other undesirable items.\n6. Workplace\ndocuments\nMay include:\n6.1\nAnimal health records\n6.2\nChemical register\n6.3\nDiary, rosters and task completion and timeframe\nrecords\n6.4\nEquipment use, damage and repair register\n6.5\nFacility damage and repair register\n6.6\nIncident reports\n6.7\nMessage recording systems\n6.8\nStock control records\n6.9\nSafe operating procedures.\n\n--- PDF PAGE 94 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n90\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires that the candidate:\n1.1\nConfirmed animal care routines required, clean and\nmaintain animal housing and related facilities\n1.2\nMaintained animal comfort and health through cleaning\nand grooming of animals\n1.3\nReported and documented personal animal care duties\n1.4\nMonitored animals and reported issues as required\naccording to workplace protocols and procedures.\nThe skills and knowledge required to complete animal care\nhygiene routines must be transferable to a range of work\nenvironments and contexts and include the ability to deal with\nunplanned events.\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nAnimal care work place\n2.2\nMaterials, tools and equipment relevant to the proposed\nactivity or task\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nWritten Examination\n3.2\nInterview\n3.3\nDemonstration with questioning\n\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 95 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n91\n\nUNIT OF COMPETENCY :\nTRIM AND PRUNE LANDSCAPE PLANTS\n\nUNIT CODE\n:\nAGR611376\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto trim and prune landscape plant based on the purposes of\nsuch landscape maintenance activity.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\ntrimming and\npruning\nrequirements\n\n1.1 Landscape plants and\ntheir parts that are in\nneed of trimming and\npruning are\ndistinguished according\nto landscape\nmaintenance standards\n(LMS).\n1.2 Purpose and method\nof pruning are\ndetermined according\nto LMS.\n1.3 Utility services are\nlocated using site plans\nand in consultation with\nconcerned persons or\nauthority.\n1.4 Access to the site is\ndetermined in\nconsultation with\nconcerned persons or\nauthority.\n1.5 Occupational Health\nand Safety (OHS)\nhazards are identified,\nrisks assessed and\nreported to concerned\npersons or authority.\n\n1.1 Types of landscape\nplants, their\ncharacteristics and\ngrowth habit\n1.2 Techniques,\nprinciples and\nprocedures of\ntrimming and\npruning applicable to\nplant types and plant\nfactors,\nenvironmental and\ncultural\nconsiderations and\nobjectives of the\ntasks\n1.3 Effects of trimming\nand pruning\noperations on plant\ngrowth and\ndevelopment\n1.4 Functions and uses\nof tools and\nequipment\n1.5 Hygiene practices\nand plant health\nprinciples relevant to\ntrimming and\npruning\n\n1.1 Using of\nappropriate tools\nand equipment\nand prescribed\nsafety/protective\ndevices\n1.2 Understanding\nwork procedures\n1.3 Communication\nskills in receiving\ninstructions and\nrendering even\nsimple oral and\nwritten reports\n1.4 Maintaining tools\nand equipment\n\n2. Prepare for\ntrimming and\npruning\noperations\n2.1 Tools, supplies and\nequipment are\nprepared in accordance\nwith the work\nrequirements.\n2.2 Pre-operational and\nsafety checks are\ncarried out on tools and\nequipment according to\nmanufacturer’s\nspecifications and\nindustry work practices.\n2.3 Prescribed safety and\npersonal protective\nequipment (PPE) is\n2.1 Tools, supplies and\nequipment\npreparation\n2.2 Functions and uses\nof tools and\nequipment\n2.3 Pre-operational and\nsafety checks on\ntools and equipment\n2.4 Selection, usage\nand maintenance of\nprescribed safety\nand personal\nprotective\nequipment (PPE).\n2.1 Preparing\nappropriate tools\nand equipment\nand prescribed\nsafety/protective\ndevices\n2.2 Understanding\nwork procedures\n2.3 Communication\nskills in receiving\ninstructions and\nrendering even\nsimple oral and\nwritten reports\n\n--- PDF PAGE 96 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n92\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nselected, used and\nmaintained.\n\n2.4 Maintaining tools\nand equipment\n\n3. Perform\ntrimming and\npruning\n3.1 Safety and warning\ndevices are installed\naround the site during\nand between work\nperiods.\n3.2 Landscape plants are\ntrimmed and pruned in\naccordance with work\nprogram and LMS.\n3.3 Trimming and pruning\nof landscape plants are\ndone using prescribed\ntools and equipment.\n3.4 Sterilizing\nagent/compound are\napplied on pruning\nwounds in accordance\nwith LMS.\n3.5 Tasks are conducted\nusing appropriate PPE.\n\n3.1 Types of landscape\nplants, their\ncharacteristics and\ngrowth habit\n3.2 Techniques,\nprinciples and\nprocedures of\ntrimming and\npruning applicable to\nplant types and plant\nfactors,\nenvironmental and\ncultural\nconsiderations and\nobjectives of the\ntasks\n3.3 Effects of trimming\nand pruning\noperations on plant\ngrowth and\ndevelopment\n3.4 Functions and uses\nof tools and\nequipment\n3.5 Hygiene practices\nand plant health\nprinciples relevant to\ntrimming and\npruning\n\n3.1 Preparing\nappropriate tools\nand equipment\nand prescribed\nsafety/protective\ndevices\n3.2 Understanding\nwork procedures\n3.3 Communication\nskills in receiving\ninstructions and\nrendering even\nsimple oral and\nwritten reports\n3.4 Maintaining tools\nand equipment\n\n4.Perform post-\ntrimming and\npruning\nactivities\n4.1 Trimming and\npruning wastes are\ncollected and disposed\nfrom the site in\naccordance with\nenvironmental\nstandards and LMS.\n4.2 Recommended manual\nhandling techniques\nare used when lifting or\nmoving heavy loads.\n4.3 Tools and equipment\nare cleaned,\nmaintained and stored\naccording to LMS.\n4.4 Maintenance of clean\nand safe area is\nundertaken throughout\nand on completion of\nwork.\n4.1 Waste management\n4.2 Manual handling\ntechniques used in\nlifting or moving\nheavy loads\n4.3 Cleaning,\nmaintenance, and\nstorage of tools and\nequipment\n4.4 Maintenance of work\narea\n4.5 Documentation of\nwork outputs\n\n4.1 Understanding\nwork procedures\n4.2 Participating in\nteams and\ncontributing to\nteam objectives\n4.3 Communication\nskills in receiving\ninstructions and\nrendering even\nsimple oral and\nwritten reports\n4.4 Maintaining tools\nand equipment\n4.5 Minimizing\nenvironmental\ndisturbances\n\n--- PDF PAGE 97 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n93\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.5 Work outputs are\nrecorded or reported to\nconcerned persons or\nauthority according to\nindustry practices.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Landscape plants\nMay include:\n1.1\nShrubs and hedges\n1.2\nVines\n1.3\nPalms\n1.4\nBamboos\n1.5\nTrees\n2. Purpose\nMay include:\n2.1\nCreate and maintain form and shape of landscape plant\n2.2\nPromote health\n2.3\nDirect or control growth\n2.4\nEncourage flowering and fruiting\n2.5\nRemove/minimize risk/hazard\n3. Utility services\nMay include:\n3.1\nAboveground utilities\n3.1.1\nElectrical and communication lines\n3.1.2\nCable/TV lines\n3.2\nUnderground utilities\n3.2.1\nIrrigation and domestic water distribution lines\n3.2.2\nElectrical and communication lines\n3.2.3\nCable/TV lines\n3.2.4\nDrainages and sewerages\n4. Concerned persons\nor authority\nMay include:\n4.1\nSupervisor\n4.2\nProperty management officer\n4.3\nHome owner\n4.4\nInspector\n5. Hazards\nMay include:\n5.1\nDisturbance or interruption of services\n5.2\nSolar radiation\n5.3\nPollutants (e.g. gaseous, suspended particulate matters)\n5.4\nNoise\n5.5\nManual handling of moving powered equipment or parts,\nsharp tools and materials\n\n--- PDF PAGE 98 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n94\n5.6\nUneven landforms/surfaces\n5.7\nFlying and falling objects\n6. Risks\nMay include:\n6.1\nRisk to co-workers, equipment, other people and animals\nexternal to the workplace (e.g. members of the public,\nstray pets and wildlife)\n6.2\nRisk to natural environment\n7. Tools, supplies and\nequipment\nMay include:\n7.1\nHedge trimmers (HT): Power and manual\n7.2\nShears: Pruning, loping\n7.3\nSaws: Pruning saws, chain saws, bow saws\n7.4\nPole/Tree pruner\n7.5\nTelescopic shaft/high branch pruning chain saws\n7.6\nLadder/adjustable ladder\n7.7\nBasket type boom/cherry picker\n7.8\nSterilizing agent/pruning compound\n8. Safety and PPE\nMay include:\n8.1\nEarly warning devices\n8.2\nOverall\n8.3\nGloves\n8.4\nGoggles\n8.5\nEar muff/plugs\n8.6\nGas mask\n8.7\nSafety belt/harness\n8.8\nClimbing ropes/gadgets\n8.9\nHard hat\n8.10 Shoes/safety shoes\n8.11 Reflectorized vest (depends on location of work)\n9. Early warning\ndevices\nMay include:\n9.1\nTraffic cones\n9.2\nWarning tapes\n9.3\nWarning signage\n10. Sterilizing agent/\ncompound\n10.1 Coal tar\n10.2 Bituminous pruning compound\n10.3 Latex Paint with fungicide\n10.4 Fungicide\n11. Trimming and\npruning wastes\n\nMay include:\n11.1 Tops or shoots\n11.2 Branches\n11.3 Twigs\n11.4 Leaves\n11.5 Flowers and fruits\n12. Maintenance of clean\nand safe area\nMay include:\n12.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n12.2 Disabling tools and equipment after use\n12.3 Using signage and barriers where necessary\n12.4 Removing debris and waste from the work area\n\n--- PDF PAGE 99 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n95\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified trimming and pruning requirements\n1.2\nPrepared supplies, materials, tools, equipment and PPE\n1.3\nTrimmed and pruned landscape plants\n1.4\nApplied sterilizing agent/compound\n1.5\nPerformed post-trimming and pruning operations\n1.6\nObserved OHS practices\n\n2. Resource Implications The following resources should be provided:\n2.1 Landscape plants and/or landscaped area\n2.2 Tools, equipment and supplies relevant to the activity\n2.3\nProtective/safety gadgets\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation with Oral Questioning\n3.2 Interview\n3.3\nPortfolio\n\n4. Context of\nAssessment\n4.1\nCompetency maybe assessed in actual workplace or at\nthe designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 100 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n96\nUNIT OF COMPETENCY :\nPERFORM WEEDING AND CULTIVATION\n\nUNIT CODE\n:\nAGR611377\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto conduct weeding operations and soil cultivation activities.\nThis is purposely to minimize competition and to improve soil\naeration and water absorption/retention, respectively for\nbetter growth and development of the landscape plants.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nrequirements\nfor weeding\nand cultivation\nactivity\n1.1 Weed species and\n“volunteer” plants\n(“’invaders”) that are\nout-of-place and\nconsidered undesirable\nin the landscape are\nidentified based on\nspecific landscape\nmaintenance guidelines\nor as per instructions.\n1.2 Landscape areas\nneeding weeding and\ncultivation are identified\nbased on instructions\nor in accordance with\nLMS.\n\n1.1 Requirements for\nweeding and\ncultivation activity\n1.2 Recognition of the\neffects of weeds and\nundesirable\n“volunteer” species\n(invaders) on\nlandscape plants\n1.3 Knowledge in\ndistinguishing weeds\nand undesirable\n“volunteer” species\n1.4 Landscape area\n\n1.1 Identifying weed\nspecies and\n“volunteer” plants\n1.2 Identifying\nlandscape areas\nneeding weeding\nand cultivation\n2. Prepare for\nweeding and\ncultivation\noperation\n\n2.1 List of weeds and\n“volunteer plants” and\nthe map of specific\nlandscape areas are\nprepared and secured\n2.2 Method and purpose\nof weeding are\ndetermined based on\nthe type of weed\nspecies and out-of-place\n“volunteer” species\n2.3 Tools, supplies and\nequipment needed are\nmade ready and\navailable for use\naccording to the types of\nweeds and “volunteer”\nspecies that needs\nremoval\n2.4 Appropriate safety\nprotective devices are\nprepared for use\n\n2.1 List of weeds and\n“volunteer plants”\n2.2 Map of specific\nlandscape areas\n2.3 Method and purpose\nof weeding\n2.4 Tools, supplies and\nequipment\n2.5 Safety protective\ndevices\n1.1 Identifying weed\nspecies and\n“volunteer” plants\n1.2 Identifying\nlandscape areas\nneeding weeding\nand cultivation\n3. Conduct\nweeding and\nremoval of\n3.1 Weeds and out-of-place\n“volunteer” plant species\nin the landscape are\nremoved and disposed\n3.1 Knowledge in\ndistinguishing weeds\nand undesirable\n“volunteer” species\n3.1 Conducting\nweeding\n\n--- PDF PAGE 101 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n97\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n“volunteer”\nspecies\n\nin accordance with\nlandscape maintenance\nstandard or as per\ninstructions.\n3.2 Weeds and out-of-place\n“volunteer” plant species\nare removed using\nprescribed tools and\nequipment\n3.3 Tasks are done using\nappropriate\nsafety/protective\ndevices.\n\n3.2 Appropriate\nsafety/protective\ndevices\n3.3 Waste disposal\n\n3.2 Using appropriate\ntools and\nequipment\n3.3 Communication\nSkills\n\n4. Determine\ncompacted\nsoil\n4.1 Compacted soil or soil\nthat is having problem\nwith aeration, water\ninfiltration and\nconditions for root\ndevelopment is\ndetermined as per\nestablished practice\n4.2 Effects of compacted\nsoil on root\ndevelopment and\nanchorage are\nrecognized\n4.3 Method and purpose\nof soil cultivation are\ndetermined based on\nthe conditions of the\nsoil\n\n4.1 Compacted soil or\nsoil\n4.2 Effects of\ncompacted soil on\nroot development\nand anchorage\n4.3 Method and purpose\nof soil cultivation\n\n4.1 Compacting soil\n4.2 Familiarizing\neffects of\ncompacted soil on\nroot development\nand anchorage\n4.3 Determining\nmethod and\npurpose of soil\ncultivation\n5. Cultivate\ncompacted\nsoil\n5.1 Compacted soil is\ncultivated simultaneous\nwith weeding\noperations in\naccordance with\nlandscape maintenance\nstandards or as per\ninstructions\n5.2 Soil cultivation is done\nusing appropriate tools\nand equipment\n5.3 Task is performed\nusing prescribed\nsafety/protective\ndevices\n5.1 Compacted Soil\n5.2 Weeding Operations\n5.3 Soil Cultivation\n5.4 Tools and Equipment\n5.5 Safety and Protective\nDevices\n5.1 Compacting soil\n5.2 Familiarizing\neffects of\ncompacted soil on\nroot development\nand anchorage\n5.3 Determining\nmethod and\npurpose of soil\ncultivation\n6. Perform post-\nweeding and\nsoil cultivation\nactivities\n6.1 Tools and equipment\nare cleaned,\nmaintained and stored\nas per instruction of in\naccordance with LMS\n6.1 Cleaning,\nmaintenance and\nstorage of tools and\nequipment\n6.2 Maintenance of work\narea\n6.1 Understanding\nwork procedures\n6.2 Participating in\nteams and\ncontributing to\nteam objectives\n\n--- PDF PAGE 102 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n98\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n6.2 Maintenance of clean\nand safe area is\nundertaken throughout\nand on completion of\nwork\n6.3 Work outputs are\nrecorded or reported to\nconcerned persons or\nauthority according to\nindustry practices\n\n6.3 Documentation of\nwork outputs\n\n6.3 Communication\nskills in receiving\ninstructions and\nrendering even\nsimple oral and\nwritten reports\n6.4 Maintaining tools\nand equipment\n6.5 Minimizing\nenvironmental\ndisturbances\n\n--- PDF PAGE 103 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n99\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Weed species and\nvolunteer plants\n(invaders)\nMay include:\n1.1\nWeeds\n1.1.1 Grass\n1.1.2 Sedges\n1.1.3 Shrubs\n1.1.4 Vines\n1.2\nOut-of-place “volunteer” plant species are those that\ngrow naturally in the site and are competing with\ndesirable plants, making the site ugly and/or are eye-sore\nin the landscape. Volunteer species can be landscape\nplants but is not included in the landscape design\n2. Landscape areas\nMay include:\n2.1\nLawn\n2.2\nFlower beds\n2.3\nHedges and shrubs landscape area\n2.4\nTree lawn or tree planting verges\n3. Methods of weed\ncontrol\nMay include:\n3.1\nManual weeding\n3.2\nMechanical weeding\n3.3\nChemical weeding\n4. Purpose of weeding\nMay include:\n4.1\nRelease the desirable landscape plants from competition\nof weeds and out-of-place “volunteer” species\n4.2\nImprove the health conditions of the landscape plants\n4.3\nLessen susceptibility of the landscape plants from pest\nand disease attack\n5. Methods of soil\ncultivation\nMay include:\n5.1\nManual\n5.2\nMechanical\n6. Purpose of soil\ncultivation\nMay include:\n6.1\nImprove soil structure, porosity, aeration and water\ninfiltration\n6.2\nImprove conditions for root system development and root\nanchorage\n6.3\nImprove water and nutrient absorption\n6.4\nEnhance soil macro and micro-organisms activity\n7. Supplies, tools and\nequipment for\nweeding operations\n\nMay include:\n7.1\nSmall bolo “dulos”\n7.2\nScythe (“Karit”)\n7.3\nSmall round/flat bar\n7.4\nSpade\n7.5\nTrowel\n7.6\nChemicals (Types: Selective herbicide; Wide spectrum)\n8. Tools and equipment\nfor soil cultivator\nMay in clued:\n8.1\nSmall bolo (“dulos”)\n8.2\nSmall round/flat bar\n8.3\nSpade\n8.4\nSoil cultivating machine\n9. Protective/safety\ndevices used in\nweeding and\ncultivation\nMay include:\n9.1\nGoggles\n9.2\nOveralls, gloves\n9.3\nReflectorized vest (depends on location of work)\n10. Maintenance of clean\nand safe area\nMay include:\n10.1 Keeping public access paths and roads clear of debris,\nwaste, tools and equipment\n\n--- PDF PAGE 104 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n100\n10.2 Disabling tools and equipment after use\n10.3 Using signage and barriers where necessary\n10.4 Removing debris and waste from the work area\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined requirements for weeding and cultivation\nactivity\n1.2\nPrepared for weeding and cultivation operation\n1.3\nConducted weeding and removal of “volunteer” plant\nspecies\n1.4\nDetermined compacted soil\n1.5\nCultivated compacted soil\n1.6\nConducted post weeding and soil cultivation operations\n1.7\nUsed/operated tools and equipment properly\n1.8\nUsed prescribed protective/safety gadgets\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nLandscape area\n2.2\nNecessary tools and equipment\n2.3\nRelevant supplies and materials\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDirect Observation with Oral Questioning\n3.2\nInterview\n3.3\nPortfolio\n\n4. Context of\nAssessment\n4.1\nCompetency maybe assessed in actual workplace or at\nthe designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 105 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n101\nUNIIT OF COMPETENCY :\nWATER/IRRIGATE PLANTS\n\nUNIT CODE\n:\nAGR611379\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto maintain the health and vigor of the landscape plants\nthrough proper watering/irrigation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nrequirements\nof watering/\nirrigating\nlandscape\nplants\n\n1.1 Importance of water to\ngrowth and\ndevelopment of\nlandscape plants and\nthe effects of water\nstress (less or excess\nwater) to plants are\nrecognized as per\nestablished practice.\n1.2 Landscape plants\nsuffering from less or\nexcessive watering are\ndetermined using some\nvisually observable\nplant and soil\nconditions and/or\nguidelines.\n\n1.1 Importance of water\nin watering/irrigating\nlandscape plants\n1.2 Requirements of\nwatering/irrigating\nlandscape plants\n1.3 Landscape plants\n1.4 Determine\nlandscape plants\nsuffering from less\nor excessive\nwatering using some\nvisually observable\nplant and soil\nconditions and/or\nguidelines.\n\n1.1 Determining\nrequirements of\nwatering/irrigating\n1.2 Knowing the\nimportance of\nwater\n1.3 Determining\nlandscape plants\nsuffering from less\nor excessive\nwatering\n\n2. Prepare for\nwatering/\nirrigation\nactivity\n2.1 Amount and\nfrequency of\nwatering/irrigation of\nplants are determined\nin accordance with\nLMS or as per\ninstructions.\n2.2 Tools, supplies and\nequipment needed are\nprepared based on the\nmethod of watering\nand/or irrigation to be\nused.\n2.3 Prescribed\nprotective/safety\ndevices are made\nready and available for\nuse.\n\n2.1 Amount and\nfrequency of\nwatering/irrigation\n2.2 Tools, supplies and\nequipment\n2.3 Prescribed\nprotective/safety\ndevices\n\n2.1 Preparing for\nwatering/irrigation\n2.2 Determining\namount and\nfrequency of\nwatering/irrigation\n2.3 Preparing tools,\nsupplies and\nequipment\n2.4 Preparing\nprescribed\nprotective/safety\ndevices\n2.5 Using prescribed\nprotective/safety\ndevices\n\n--- PDF PAGE 106 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n102\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Conduct\nwatering/\nirrigation of\nplant\n3.1 Watering or irrigating of\nplants is done in\naccordance with the\nbasic principles or\nstandard practice or as\nper instructions.\n3.2 Watering/irrigation is\nperformed using the\nirrigation tools and\nequipment appropriate\nto the methods\nselected.\n3.3 Task is performed\nusing the prescribed\nprotective/safety\ngadgets.\n\n3.1 Watering or irrigating\nof plants\n3.2 Irrigation tools and\nequipment\n3.3 Prescribed\nprotective/safety\ngadgets\n\n3.1 Conducting\nwatering/irrigation\nof plant\n3.2 Using irrigation\ntools and\nequipment\n3.3 Using prescribed\nprotective/safety\ngadgets\n4. Perform post-\nwatering/\nirrigation\nactivities\n4.1 Tools and equipment\nare cleaned,\nmaintained and stored\nas per instruction of in\naccordance with LMS.\n4.2 Maintenance of clean\nand safe area is\nundertaken throughout\nand upon completion of\nwork.\n4.3 Work outputs are\nrecorded or reported to\nconcerned persons or\nauthority according to\nindustry practices.\n\n4.1 Cleaning,\nmaintenance and\nstorage of tools and\nequipment\n4.2 Maintenance of work\narea\n4.3 Documentation of\nwork outputs\n4.1 Understanding\nwork procedures\n4.2 Participating in\nteams and\ncontributing to\nteam objectives\n4.3 Communication\nskills in receiving\ninstructions and\nrendering even\nsimple oral and\nwritten reports\n4.4 Maintaining tools\nand equipment\n4.5 Minimizing\nenvironmental\ndisturbances\n\n--- PDF PAGE 107 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n103\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Importance of water\nto plants\nMay include:\n1.1\nMaintains of vital physiological processes in plants\n1.2\nPrimary raw material for photosynthesis or food\nmanufacture\n1.3\nMaintains of turgidity of the cells\n1.4\nHelps in the translocation of nutrients, food and other\nassimilates\n1.5\nMaintains the health conditions of the plant\n2. Plant conditions\nMay include:\nVisually observable conditions of plants suffering from water\nstress\n2.1\nWilting and die back\n2.2\nChange in color and appearance of the leaves\n2.3\nPremature falling of leaves/defoliation\n3. Soil conditions\nMay include:\nVisually observable conditions of soil suffering from water\nstress\n3.1\nWhen dry\n3.1.1\nToo dusty\n3.1.2\nCracks on soil\n3.2\nWhen waterlogged or over-watered\n3.2.1\nToo wet\n3.2.2\nMuddy\n4. Amount and\nfrequency of watering\nMay include:\nDetermining when and how much to irrigate may include:\n4.1\nObservation of the conditions of the plant\n4.2\nObservation of the conditions of the soil\n4.3\nUse of moisture meter\n5. Methods of\nwatering/irrigation\n\nMay include:\nThe methods of watering depend on the kind of landscape\nplants/landscape areas and available facilities:\n5.1\nOverhead irrigation: overhead sprinkler, pop-up etc.\n5.2\nDrip irrigation\n5.3\nFurrow irrigation\n5.4\nBasin irrigation\n6. Tools and equipment\n\nMay include:\nDepending on the method, the following may be needed:\n6.1\nWater hose with and without sprinklers\n6.2\nWater truck\n6.3\nIrrigation system installed\n6.4\nPlumbing tools\n7. Protective/safety\ndevices\n7.1\nOveralls\n7.2\nGloves\n7.3\nHat/hard hat\n7.4\nRain boots\n7.5\nReflectorized vest (depends on the location of work)\n8. Maintenance of clean\nand safe area\nMay include:\n8.1\nKeeping public access paths and roads clear of debris,\nwaste, tools and equipment\n8.2\nDisabling tools and equipment after use\n8.3\nUsing signage and barriers where necessary\n8.4\nRemoving debris and waste from the work area\n\n--- PDF PAGE 108 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n104\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined requirements of watering/irrigating plants\n1.2\nRecognized importance of water to plants and the\nconsequent effects of less or over-watering\n1.3\nDistinguished plants needing watering and plants in\nexcess of watering or suffering from waterlogged\nconditions\n1.4\nPrepared for watering/irrigation activity as per\ninstructions\n1.5\nConducted watering/irrigation using the prescribed tools,\nsupplies and equipment and in accordance with\nstandard practice\n1.6\nPerformed post-watering/irrigation activity\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nLandscape area/landscape plants\n2.2\nTools and equipment\n2.3\nProtective/safety gadgets\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDirect Observation with Oral Questioning\n3.2\nInterview\n3.3\nPortfolio\n\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 109 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n105\nUNIT OF COMPETENCY :\nCONTROL AND PREVENT PLANT PEST AND DISEASES\n\nUNIT CODE\n:\nAGR611380\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto determine types of pests and diseases and their prevention\nand control measures\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nrequirements\nof preventing\nand\ncontrolling\nplant pests\nand diseases\n1.1 Infested and diseased\nlandscape plants are\ndetermined based on\nplant conditions,\nsymptoms and signs\nand other\nmanifestation of\ninfestation and\ninfection.\n1.2 Pests and diseases\nare identified and\nclassified using general\nclassification\nguidelines.\n1.3 Life cycle or various life\nstages of pests from\neggs, larvae, pupa and\nadult and their mode of\nattack or infestation are\nknown.\n1.4 Life cycle or various life\nstages and signs and\nsymptoms of plant\ndiseases and their\nmode of attack are\nknown.\n1.5 Access to the site is\ndetermined in\nconsultation with\nconcerned persons or\nauthority.\n1.6 Occupational Health\nand Safety (OHS)\nhazards are identified,\nrisks assessed and\nreported to concerned\npersons or authority.\n1.1 Plant conditions,\nsymptoms and signs\nand other\nmanifestation of\ninfestation and\ninfection\n1.2 Requirements of\npreventing and\ncontrolling plant\npests and diseases\n1.3 Pests and diseases\n1.4 Life cycle or various\nlife stages of pests\nfrom eggs, larvae,\npupa and adult and\ntheir mode of attack\nor infestation\n1.5 Life cycle or various\nlife stages and signs\nand symptoms of\nplant diseases and\ntheir mode of attack\n1.6 Occupational Safety\nand Health (OSH)\nhazards\n\n1.1 Determining\nrequirements of\npreventing and\ncontrolling plant\npests and\ndiseases\n1.2 Determining\ninfested and\ndiseased\nlandscape plants\n1.3 Identifying and\nclassifying pests\nand diseases\n1.4 Determining life\ncycle or various\nlife stages of pests\nfrom eggs, larvae,\npupa and adult\nand their mode of\nattack or\ninfestation\n1.5 Determining life\ncycle or various\nlife stages and\nsigns and\nsymptoms of plant\ndiseases and their\nmode of attack\n1.6 Identifying\nOccupational\nSafety and Health\n(OSH) hazards\n1.7 Assessing and\nreporting risks\n2. Prepare for\napplication\nof pests and\ndisease\nprevention\nand control\nmeasures\n\n2.1 Method of prevention\nand control is\ndetermined based on\ntypes of pests and\ndiseases, their mode of\nattack and extent of\ninfestation and\ninfection.\n2.1 Method of\nprevention and\ncontrol\n2.2 Types of pests and\ndiseases, their mode\nof attack and extent\nof infestation and\ninfection\n2.1 Preparing\napplication of\npests and disease\nprevention and\ncontrol measures\n2.2 Determining\nmethod of\nprevention and\ncontrol\n\n--- PDF PAGE 110 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n106\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.2 Tools, equipment,\nsupplies and materials\nrelevant to the method\nof prevention and\ncontrol are prepared.\n2.3 Prescribed safety and\npersonal protective\nequipment (PPE) is\nselected in accordance\nwith work requirements.\n\n2.3 Tools, equipment,\nsupplies and\nmaterials relevant to\nthe method of\nprevention and\ncontrol\n2.4 Safety and personal\nprotective\nequipment (PPE)\n\n2.3 Preparing tools,\nequipment,\nsupplies and\nmaterials relevant\nto the method of\nprevention and\ncontrol\n2.4 Selecting\nprescribed safety\nand personal\nprotective\nequipment (PPE)\n\n3. Apply pest\nand disease\nprevention\nand control\nmeasures\n3.1 Manual and biological\nmethod of prevention\nand control of pest and\ndisease are applied\nwhenever applicable.\n3.2 In case of using\nchemical and bio-\npesticides, the\nfrequency and dosage\nof application is\ndetermined based on\ntypes of pests and\ndiseases and extent of\nattack and in\naccordance with LMS\nor manufacturer’s\nrecommendation.\n3.3 Pest and disease\nprevention and control\nmeasures are applied\nin accordance with to\nOHS requirements and\nFertilizer and Pesticide\nAuthority (FPA)\nguidelines.\n3.4 Task is performed\nusing prescribed tools,\nsupplies and\nappropriate\nprotective/safety\ndevices.\n\n3.1 Manual and\nbiological method of\nprevention and\ncontrol of pest and\ndisease\n3.2 Chemical and bio-\npesticides-\nfrequency and\ndosage of\napplication\n3.3 Types of pests and\ndiseases and extent\nof attack\n3.4 Pest and disease\nprevention and\ncontrol measures\n3.5 OHS requirements\n3.6 Fertilizer and\nPesticide Authority\n(FPA) guidelines\n3.7 Prescribed tools,\nsupplies\n\n3.1 Applying pest and\ndisease prevention\nand control\nmeasures\n3.2 Applying manual\nand biological\nmethod of\nprevention and\ncontrol of pest and\ndisease\n3.3 Determining\nchemical and bio-\npesticides, the\nfrequency and\ndosage of\napplication\n3.4 Applying pest and\ndisease prevention\nand control\nmeasures\n4. Perform post-\nprevention\nand control\nmeasures\n4.1 Tools and equipment\nare cleaned,\nmaintained and stored\naccording to LMS.\n4.2 Maintenance of clean\nand safe area is\nundertaken throughout\n4.1 Cleaning,\nmaintenance and\nstorage of tools and\nequipment\n4.2 Maintenance of work\narea\n4.3 Documentation of\nwork outputs\n4.1 Understanding\nwork procedures\n4.2 Participating in\nteams and\ncontributing to\nteam objectives\n4.3 Communication\nskills in receiving\n\n--- PDF PAGE 111 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n107\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nand on completion of\nwork.\n4.3 Work outputs are\nrecorded and reported\nto concerned persons\nor authority according\nto industry practices.\n\ninstructions and\nrendering even\nsimple oral and\nwritten reports\n4.4 Maintaining tools\nand equipment\n4.5 Minimizing\nenvironmental\ndisturbances\n\n--- PDF PAGE 112 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n108\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Landscape plants\n\nMay include:\n1.1\nShrubs and hedges\n1.2\nVines\n1.3\nPalms\n1.4\nBamboos\n1.5\nTrees\n2. Plant conditions\nMay include:\n2.1\nAge/Stage of growth\n2.2\nHealthy and vigorous\n2.3\nDiseased/infected:\n2.4\nInfested\n3. Symptoms, signs\nand other\nmanifestations\ndiseases\nMay include:\n3.1\nDiseases\n3.2\nLeaf spots\n3.3\nAnthracnose\n3.4\nFruiting bodies\n3.5\nPresence of hyphae\n3.6\nPests\n3.6.1\nGall on leaves, stems, branches\n3.6.2\nSkeletonized, browsed/chewed leaves\n3.6.3\nWithering, die back etc\n4. Pests and diseases\nMay include:\n4.1\nPests\n4.1.1\nInsect pests: Chewing, Sucking,\nGirdling/Boring, etc.\n4.1.2\nTermites\n4.1.3\nNematodes\n4.2\nDiseases\n4.2.1\nParasitic fungus\n4.2.2\nBacteria\n4.2.3\nViruses\n5. Methods of\nprevention and\ncontrol\n\nMay include:\n5.1\nPrevention\n5.1.1\nSpecies/individual (genetically superior)\nselection\n5.1.2\nPest and disease free\n5.1.3\nCultural management\n5.1.4\nSanitation\n5.2\nControl\n5.3\nManual/mechanical\n5.4\nChemical (systemic, broad spectrum, contact)\n5.5\nBiological- (insects, microorganisms)\n5.6\nBio-pesticides\n6. Tools, supplies and\nequipment\nMay include:\n6.1\nBackpack sprayer\n6.2\nBoom sprayer\n6.3\nSoil drencher\n6.4\nPruning shears,\n6.5\nPruning saws\n7. Protective/safety\ngadgets\nMay include:\n7.1\nOveralls, gloves\n7.2\nGas mask\n7.3\nGoggles\n7.4\nReflectorized vest ( depends on location of work)\n8. Maintenance of clean\nand safe area\nMay include:\n8.1\nKeeping public access paths and roads clear of debris,\nwaste, tools and equipment\n8.2\nDisabling tools and equipment after use\n\n--- PDF PAGE 113 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n109\n8.3\nUsing signage and barriers where necessary\n8.4\nRemoving debris and waste from the work area\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined requirements for the prevention and control\nof pests and diseases\n1.2\nPrepared for the application of pest and disease\nprevention and control\n1.3\nApplied pest and disease prevention and control\nmeasures\n1.4\nConducted post-pest and disease prevention and\ncontrol operations\n1.5\nPerformed tasks using appropriate tools, equipment and\nsafety/protective devices\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nLandscape area/landscape plants\n2.2\nTools, equipment, supplies and materials and\nprotective/safety devices\n2.3\nInstructions or guidelines\n\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1\nDirect Observation with Oral Questioning\n3.2\nInterview\n3.3\nPortfolio\n\n4. Context of\nAssessment\n4.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 114 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n110\nSECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for DOMESTIC WORK NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: DOMESTIC WORK\nLevel: NC II\n\n Nominal Training Duration:\n\n37 hours\nBasic Competencies\n\n20 hours\nCommon Competencies\n\n90 hours\nCore Competencies\n\n147\n\nhours\n\nTOTAL\n\n80 hours\nSupervised Industry Learning (SIL)\n\nElective Competencies\n\n20 hours\nAssist in the care of animals\n\n20 hours\nProvide animal care hygiene routines\n\n15 hours\nTrim and prune landscape plants\n\n15 hours\nPerform weeding and cultivation\n\n12 hours\nWater/irrigate plants\n\n14 hours\nControl and prevent plant pest and diseases\n\n96 hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in cleaning living room,\ndining room, bedrooms, toilet and kitchen, washing and ironing clothes, linen and\nfabric, preparing hot and cold meals/food, and providing food and beverage service.\nThis include classroom learning activities and practical work in actual work site or\nsimulation area.\n\n--- PDF PAGE 115 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n111\n\nThe common competencies include maintain an effective relationship with\nclients/customers, and manage own performance. It also includes basic competencies\nsuch as, participate in workplace communication, work in a team environment, practice\ncareer professionalism, and practice occupational health and safety procedures. The\ncommon competency –Maintain an effective relationship with clients and customers\nhas been contextualized to include the provisions of Kasambahay law, e.g. standard\nemployment contract, rights and privileges, pre-employment requirements, working\nconditions, barangay registrations, social and other benefits, etc.\n\nIt also has six (6) elective competencies as indicated below:\n1. Assist in the care of animals (20 Hrs)\n2. Provide animal care hygiene routines (20 Hrs)\n3. Trim and Prune landscape plants (15 Hrs)\n4. Perform weeding and cultivation (15 Hrs)\n5. Water/irrigate plants (12 Hrs)\n6. Control and prevent plant pest and diseases (14 Hrs)\n\nThe Elective competencies are additional core units of competencies that are\nuseful but not absolutely necessary for enhancing the mobility/employability of a\nperson. These competencies are considered important in the performance of the job\nand may be drawn from among the units of competency in the TRs promulgated for\nother sectors. Likewise, they are only taken depending on the need of the work\nenvironment.\n\nThese Elective Competencies where selected from the core units of\ncompetencies from the existing WTR in Landscape Installation and Maintenance\n(Softscape) and one (1) NTR on Animal Care with two (2) units of competencies by\nthe Technical Experts invited during the development of the Training Regulation and\nCompetency-Based Curriculum for the Domestic Work NC II.\n\nThe Elective Competencies for Providing Care and Support for Infants,\nToddlers, Children, Elderly, People with Special Needs were not included because\nthese are highly specialized areas and are now in four separate Training Regulations\nse. Hence, the learners should take the whole program as prescribed in the Training\nRegulations.\n\nElective competencies are not mandatory for program registration. TVET\nInstitutions/Training Providers may opt to offer one or two or more competencies if they\nhave the available resources and facilities.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieve.\n\n--- PDF PAGE 116 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n112\n\nCourse Delivery:\nFlexible Learning delivery with the following modes:\nBlended Learning\n• Online\n-\nSynchronous using conferencing apps\n-\nAsynchronous through LMS/CMS\n\n• Offline\n-\nFace to face demonstration\nDistance Learning\n• Modular self-paced\n\n--- PDF PAGE 117 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n113\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\nPerform workplace duties scenario\nfollowing workplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n--- PDF PAGE 118 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n114\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication procedures\nand systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record\nroutine workplace measures\no Basic ma