          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \ntrimming and \npruning \nrequirements \n \n1.1 Landscape plants and \ntheir parts that are in \nneed of trimming and \npruning are \ndistinguished according \nto landscape \nmaintenance standards \n(LMS). \n1.2 Purpose and method \nof pruning are \ndetermined according \nto LMS. \n1.3 Utility services are \nlocated using site plans \nand in consultation with \nconcerned persons or \nauthority. \n1.4 Access to the site is \ndetermined in \nconsultation with \nconcerned persons or \nauthority. \n1.5 Occupational Health \nand Safety (OHS) \nhazards are identified, \nrisks assessed and \nreported to concerned \npersons or authority. \n \n1.1 Types of landscape \nplants, their \ncharacteristics and \ngrowth habit \n1.2 Techniques, \nprinciples and \nprocedures of \ntrimming and \npruning applicable to \nplant types and plant \nfactors, \nenvironmental and \ncultural \nconsiderations and \nobjectives of the \ntasks \n1.3 Effects of trimming \nand pruning \noperations on plant \ngrowth and \ndevelopment \n1.4 Functions and uses \nof tools and \nequipment \n1.5 Hygiene practices \nand plant health \nprinciples relevant to \ntrimming and \npruning \n \n1.1 Using of \nappropriate tools \nand equipment \nand prescribed \nsafety/protective \ndevices \n1.2 Understanding \nwork procedures \n1.3 Communication \nskills in receiving \ninstructions and \nrendering even \nsimple oral and \nwritten reports \n1.4 Maintaining tools \nand equipment \n \n2. Prepare for \ntrimming and \npruning \noperations \n2.1 Tools, supplies and \nequipment are \nprepared in accordance \nwith the work \nrequirements. \n2.2 Pre-operational and \nsafety checks are \ncarried out on tools and \nequipment according to \nmanufacturer’s \nspecifications and \nindustry work practices. \n2.3 Prescribed safety and \npersonal protective \nequipment (PPE) is \n2.1 Tools, supplies and \nequipment \npreparation \n2.2 Functions and uses \nof tools and \nequipment \n2.3 Pre-operational and \nsafety checks on \ntools and equipment \n2.4 Selection, usage \nand maintenance of \nprescribed safety \nand personal \nprotective \nequipment (PPE). \n2.1 Preparing \nappropriate tools \nand equipment \nand prescribed \nsafety/protective \ndevices \n2.2 Understanding \nwork procedures \n2.3 Communication \nskills in receiving \ninstructions and \nrendering even \nsimple oral and \nwritten reports\n\n--- PDF PAGE 96 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n92 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nselected, used and \nmaintained.  \n \n \n2.4 Maintaining tools \nand equipment \n \n3. Perform \ntrimming and \npruning  \n3.1 Safety and warning \ndevices are installed \naround the site during \nand between work \nperiods. \n3.2 Landscape plants are \ntrimmed and pruned in \naccordance with work \nprogram and LMS. \n3.3 Trimming and pruning \nof landscape plants are \ndone using prescribed \ntools and equipment. \n3.4 Sterilizing \nagent/compound are \napplied on pruning \nwounds in accordance \nwith LMS. \n3.5 Tasks are conducted \nusing appropriate PPE.   \n \n3.1 Types of landscape \nplants, their \ncharacteristics and \ngrowth habit \n3.2 Techniques, \nprinciples and \nprocedures of \ntrimming and \npruning applicable to \nplant types and plant \nfactors, \nenvironmental and \ncultural \nconsiderations and \nobjectives of the \ntasks \n3.3 Effects of trimming \nand pruning \noperations on plant \ngrowth and \ndevelopment \n3.4 Functions and uses \nof tools and \nequipment \n3.5 Hygiene practices \nand plant health \nprinciples relevant to \ntrimming and \npruning \n \n3.1 Preparing \nappropriate tools \nand equipment \nand prescribed \nsafety/protective \ndevices \n3.2 Understanding \nwork procedures \n3.3 Communication \nskills in receiving \ninstructions and \nrendering even \nsimple oral and \nwritten reports \n3.4 Maintaining tools \nand equipment \n \n4.Perform post-\ntrimming and \npruning \nactivities \n4.1 Trimming and \npruning wastes are \ncollected and disposed \nfrom the site in \naccordance with \nenvironmental \nstandards and LMS. \n4.2 Recommended manual \nhandling techniques \nare used when lifting or \nmoving heavy loads. \n4.3 Tools and equipment \nare cleaned, \nmaintained and stored \naccording to LMS. \n4.4 Maintenance of clean \nand safe area is \nundertaken throughout \nand on completion of \nwork. \n4.1 Waste management \n4.2 Manual handling \ntechniques used in \nlifting or moving \nheavy loads \n4.3 Cleaning, \nmaintenance, and \nstorage of tools and \nequipment \n4.4 Maintenance of work \narea \n4.5 Documentation of \nwork outputs \n \n4.1 Understanding   \nwork procedures \n4.2 Participating in \nteams and \ncontributing to \nteam objectives \n4.3 Communication \nskills in receiving \ninstructions and \nrendering even \nsimple oral and \nwritten reports \n4.4 Maintaining tools \nand equipment \n4.5 Minimizing \nenvironmental \ndisturbances\n\n--- PDF PAGE 97 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n93 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.5 Work outputs are \nrecorded or reported to \nconcerned persons or \nauthority according to \nindustry practices. \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Landscape plants \nMay include: \n1.1 \nShrubs and hedges \n1.2 \nVines \n1.3 \nPalms \n1.4 \nBamboos \n1.5 \nTrees \n2. Purpose \nMay include: \n2.1 \nCreate and maintain form and shape of landscape plant \n2.2 \nPromote health \n2.3 \nDirect or control growth \n2.4 \nEncourage flowering and fruiting \n2.5 \nRemove/minimize risk/hazard \n3. Utility services \nMay include: \n3.1 \nAboveground utilities \n3.1.1 \nElectrical and communication lines \n3.1.2 \nCable/TV lines \n3.2 \nUnderground