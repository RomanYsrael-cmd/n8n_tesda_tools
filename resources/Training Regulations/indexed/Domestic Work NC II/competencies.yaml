        "source_text": "--- PDF PAGE 109 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n105 \nUNIT OF COMPETENCY : \nCONTROL AND PREVENT PLANT PEST AND DISEASES \n \nUNIT CODE \n: \nAGR611380 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nto determine types of pests and diseases and their prevention \nand control measures     \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nrequirements \nof preventing \nand \ncontrolling \nplant pests \nand diseases \n1.1 Infested and diseased \nlandscape plants are \ndetermined based on \nplant conditions, \nsymptoms and signs \nand other \nmanifestation of \ninfestation and \ninfection. \n1.2 Pests and diseases \nare identified and \nclassified using general \nclassification \nguidelines.  \n1.3 Life cycle or various life \nstages of pests from \neggs, larvae, pupa and \nadult and their mode of \nattack or infestation are \nknown. \n1.4 Life cycle or various life \nstages and signs and \nsymptoms of plant \ndiseases and their \nmode of attack are \nknown. \n1.5 Access to the site is \ndetermined in \nconsultation with \nconcerned persons or \nauthority. \n1.6 Occupational Health \nand Safety (OHS) \nhazards are identified, \nrisks assessed and \nreported to concerned \npersons or authority. \n1.1 Plant conditions, \nsymptoms and signs \nand other \nmanifestation of \ninfestation and \ninfection \n1.2 Requirements of \npreventing and \ncontrolling plant \npests and diseases \n1.3 Pests and diseases \n1.4 Life cycle or various \nlife stages of pests \nfrom eggs, larvae, \npupa and adult and \ntheir mode of attack \nor infestation \n1.5 Life cycle or various \nlife stages and signs \nand symptoms of \nplant diseases and \ntheir mode of attack \n1.6 Occupational Safety \nand Health (OSH) \nhazards \n \n1.1 Determining \nrequirements of \npreventing and \ncontrolling plant \npests and \ndiseases \n1.2 Determining \ninfested and \ndiseased \nlandscape plants  \n1.3 Identifying and \nclassifying pests \nand diseases  \n1.4 Determining life \ncycle or various \nlife stages of pests \nfrom eggs, larvae, \npupa and adult \nand their mode of \nattack or \ninfestation \n1.5 Determining life \ncycle or various \nlife stages and \nsigns and \nsymptoms of plant \ndiseases and their \nmode of attack \n1.6 Identifying \nOccupational \nSafety and Health \n(OSH) hazards \n1.7 Assessing and \nreporting risks \n2. Prepare for \napplication \nof pests and \ndisease \nprevention \nand control \nmeasures \n \n2.1 Method of prevention \nand control is \ndetermined based on \ntypes of pests and \ndiseases, their mode of \nattack and extent of \ninfestation and \ninfection. \n2.1 Method of \nprevention and \ncontrol \n2.2 Types of pests and \ndiseases, their mode \nof attack and extent \nof infestation and \ninfection \n2.1 Preparing \napplication of \npests and disease \nprevention and \ncontrol measures \n2.2 Determining \nmethod of \nprevention and \ncontrol\n\n--- PDF PAGE 110 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n106 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.2 Tools, equipment, \nsupplies and materials \nrelevant to the method \nof prevention and \ncontrol are prepared. \n2.3 Prescribed safety and \npersonal protective \nequipment (PPE) is \nselected in accordance \nwith work requirements. \n \n2.3 Tools, equipment, \nsupplies and \nmaterials relevant to \nthe method of \nprevention and \ncontrol \n2.4 Safety and personal \nprotective \nequipment (PPE) \n \n2.3 Preparing tools, \nequipment, \nsupplies and \nmaterials relevant \nto the method of \nprevention and \ncontrol  \n2.4 Selecting \nprescribed safety \nand personal \nprotective \nequipment (PPE)  \n \n3. Apply pest \nand disease \nprevention \nand control \nmeasures \n3.1 Manual and biological \nmethod of prevention \nand control of pest and \ndisease are applied \nwhenever applicable. \n3.2 In case of using \nchemical and bio-\npesticides, the \nfrequency and dosage \nof application is \ndetermined based on \ntypes of pests and \ndiseases and extent of \nattack and in \naccordance with LMS \nor manufacturer’s \nrecommendation. \n3.3 Pest and disease \nprevention and control \nmeasures are applied \nin accordance with to \nOHS requirements and \nFertilizer and Pesticide \nAuthority (FPA) \nguidelines. \n3.4 Task is performed \nusing prescribed tools, \nsupplies and \nappropriate \nprotective/safety \ndevices. \n \n3.1 Manual and \nbiological method of \nprevention and \ncontrol of pest and \ndisease \n3.2 Chemical and bio-\npesticides- \nfrequency and \ndosage of \napplication \n3.3 Types of pests and \ndiseases and extent \nof attack \n3.4 Pest and disease \nprevention and \ncontrol measures \n3.5 OHS requirements  \n3.6 Fertilizer and \nPesticide Authority \n(FPA) guidelines \n3.7 Prescribed tools, \nsupplies \n \n3.1 Applying pest and \ndisease prevention \nand control \nmeasures \n3.2 Applying manual \nand biological \nmethod of \nprevention and \ncontrol of pest and \ndisease  \n3.3 Determining \nchemical and bio-\npesticides, the \nfrequency and \ndosage of \napplication  \n3.4 Applying pest and \ndisease prevention \nand control \nmeasures  \n4. Perform post- \nprevention \nand control \nmeasures  \n4.1 Tools and equipment \nare cleaned, \nmaintained and stored \naccording to LMS. \n4.2 Maintenance of clean \nand safe area is \nundertaken throughout \n4.1 Cleaning, \nmaintenance and \nstorage of tools and \nequipment \n4.2 Maintenance of work \narea \n4.3 Documentation of \nwork outputs \n4.1 Understanding   \nwork procedures \n4.2 Participating in \nteams and \ncontributing to \nteam objectives \n4.3 Communication \nskills in receiving\n\n--- PDF PAGE 111 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n107 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand on completion of \nwork. \n4.3 Work outputs are \nrecorded and reported \nto concerned persons \nor authority according \nto industry practices. \n \n \ninstructions and \nrendering even \nsimple oral and \nwritten reports \n4.4 Maintaining tools \nand equipment \n4.5 Minimizing \nenvironmental \ndisturbances\n\n--- PDF PAGE 112 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n108 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Landscape plants   \n \nMay include: \n1.1 \nShrubs and hedges \n1.2 \nVines \n1.3 \nPalms \n1.4 \nBamboos \n1.5 \nTrees \n2. Plant conditions \nMay include: \n2.1 \nAge/Stage of growth  \n2.2 \nHealthy and vigorous \n2.3 \nDiseased/infected:  \n2.4 \nInfested \n3. Symptoms, signs  \nand other \nmanifestations \ndiseases \nMay include: \n3.1 \nDiseases \n3.2 \nLeaf spots \n3.3 \nAnthracnose \n3.4 \nFruiting bodies \n3.5 \nPresence of hyphae \n3.6 \nPests \n3.6.1 \nGall on leaves, stems, branches \n3.6.2 \nSkeletonized, browsed/chewed leaves \n3.6.3 \nWithering, die back etc \n4. Pests and diseases \nMay include: \n4.1 \nPests \n4.1.1 \nInsect pests: Chewing, Sucking, \nGirdling/Boring, etc. \n4.1.2 \nTermites \n4.1.3 \nNematodes \n4.2 \nDiseases \n4.2.1 \nParasitic fungus \n4.2.2 \nBacteria \n4.2.3 \nViruses \n5. Methods of \nprevention and \ncontrol \n \nMay include: \n5.1 \nPrevention \n5.1.1 \nSpecies/individual (genetically superior) \nselection \n5.1.2 \nPest and disease free \n5.1.3 \nCultural management \n5.1.4 \nSanitation \n5.2 \nControl  \n5.3 \nManual/mechanical \n5.4 \nChemical (systemic, broad spectrum, contact)  \n5.5 \nBiological- (insects, microorganisms) \n5.6 \nBio-pesticides \n6. Tools, supplies and \nequipment \nMay include: \n6.1 \nBackpack sprayer \n6.2 \nBoom sprayer \n6.3 \nSoil drencher \n6.4 \nPruning shears,  \n6.5 \nPruning saws \n7. Protective/safety \ngadgets  \nMay include: \n7.1 \nOveralls, gloves \n7.2 \nGas mask \n7.3 \nGoggles \n7.4 \nReflectorized vest ( depends on location of work) \n8. Maintenance of clean \nand safe area \nMay include: \n8.1 \nKeeping public access paths and roads clear of debris, \nwaste, tools and equipment \n8.2 \nDisabling tools and equipment after use\n\n--- PDF PAGE 113 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n109 \n8.3 \nUsing signage and barriers where necessary \n8.4 \nRemoving debris and waste from the work area \n \n \nEVIDENCE GUIDE  \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined requirements for the prevention and control \nof pests and diseases \n1.2 \nPrepared for the application of pest and disease \nprevention and control \n1.3 \nApplied pest and disease prevention and control \nmeasures \n1.4 \nConducted post-pest and disease prevention and \ncontrol operations \n1.5 \nPerformed tasks using appropriate tools, equipment and \nsafety/protective devices \n  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 \nLandscape area/landscape plants \n2.2 \nTools, equipment, supplies and materials and \nprotective/safety devices \n2.3 \nInstructions or guidelines \n \n3. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 \nDirect Observation with Oral Questioning \n3.2 \nInterview \n3.3 \nPortfolio \n \n4. Context of \nAssessment \n4.1 \nCompetency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions.\n",
