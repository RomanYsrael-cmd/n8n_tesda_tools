        "source_text": "--- PDF PAGE 49 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n45 \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : CLEAN LIVING ROOM, DINING ROOM, BEDROOM,  \nBATHROOM AND KITCHEN  \n \n \n \nUNIT CODE \n: SOC913301 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills, and attitudes required \nin cleaning living room, dining room, bedroom, bathroom and \nkitchen. It includes the cleaning of surfaces and floors, \ncleaning of furnishings and fixtures, making up beds and cots, \ncleaning of bathroom, sanitizing rooms and maintaining clean \nroom environment.  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Clean \nsurfaces and \nfloors \n1.1 Appropriate \nremoval/cleaning \nequipment, supplies, \n      materials, procedures \nand techniques are \nused in accordance with \nsoil and litter types and \nestablished \n1.2 All wastes are removed \nfrom surface based on \nprocedures. \n1.3 Suitable maintenance \nprocedures are selected \nand applied based on \nidentified floor types \nand surface textures. \n1.4 Cleaning, polishing and \nsweeping are performed \naccording to \n     standard operating \nprocedures. \n1.5 Cleaning, polishing and \nsweeping equipment, \nsupplies and materials \nare used following \nsafety procedures and \n      manufacturer’s \nspecifications. \n1.6 Cleaning/polishing \nequipment is cleaned \nafter use in accordance \nwith relevant safety \nprocedures and \nmanufacturer’s \ninstructions. \n1.1 Types/ Uses/ \nFunctions of \nCleaning Equipment, \nSupplies and \nMaterials  \n1.2 Waste Disposal \nProcedures \n1.2.1 Environmental \nrisks \n1.2.2 Health and \nrelated effects of \nunclean areas \n1.2.3 Chemical and \nother solution \nrelated effects \nand reactions for \ncleaning surfaces \n1.3 Types and \nCharacteristics of \nFloors/Surfaces  \n1.4 Method of Removing \nSuitable Dirt/ Stain \n1.5 Glass Types, \nincluding defects  \n1.6 Methods of \nIdentifying Stains, \nMud, Dirt and Grease  \n1.7 Stain Removal \nTechniques  \n1.8 Procedures in \nArranging Furniture  \n1.9 Cleaning/Polishing \nand Sweeping \nMaterials and \nEquipment \n1.1 Interpersonal \nSkills \n1.2 Keen on details \n1.3 Cleaning Skills \n1.4 Decanting \nChemicals \n1.5 Equipment \nOperation and \nCleaning \n1.6 Communication \nSkills \n1.7 Handling and \nDisposing of \nChemicals \n1.8 Waste Handling \nand Disposal \n1.9 Work Planning \nand Organization \nSkills \n1.10 Documentation \nSkills\n\n--- PDF PAGE 50 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n46 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.7 All cleaning, polishing, \nsweeping materials and \nequipment are \n     stored as per standard \noperating procedures \n(SOPs). \n1.8 Routine maintenance is \ncarried out as per SOPs. \n \n1.10 Cleaning, Polishing \nand Sweeping \nProcedures \n1.11 Maintenance and \nStoring of \nCleaning/Polishing \nEquipment \n \n2. Clean \nfurnishing \nand fixtures \n2.1 Furnishings and \nfixtures are cleaned in \naccordance with \n     standard operating \nprocedures. \n2.2 Furniture positioned \nbased on comfort and \nconvenience and \n      room lay out. \n2.3 Equipment is cleaned \nafter use in accordance \nwith relevant \n      safety and \nmanufacturer’s \ninstructions. \n2.4 All cleaning materials \nand equipment are \nstored following \n     SOPs. \n2.5 Routine maintenance is \ncarried out or arranged \nas per standard \noperating procedures \n \n2.1 Procedures in \ncleaning, arranging \nfurniture: \n2.1.1 Aesthetics \nPrinciples \n2.1.2 Types and uses \nof cleaning \nagents \n2.1.3 Chemical \nreactions to other \nsubstance \n2.1.4 Chemical \ncompatibility/inco\nmpatibility \n2.2 Types and \nCharacteristics of \nFurniture and \nFurnishings  \n2.3 Procedures in \ncleaning maintaining \nroom furniture and \nfurnishings \n \n2.1 Interpersonal \nSkills \n2.2 Keen on details \n2.3 Cleaning Skills \n2.4 Decanting \nChemicals \n2.5 Equipment \nOperation and \nCleaning \n2.6 Communication \nSkills \n2.7 Handling and \nDisposing of \nChemicals \n2.8 Waste Handling \nand Disposal \n2.9 Work Planning \nand Organization \nSkills \n2.10 Documentation \nSkills \n2.11 Arranging \nFurniture \n \n3. Make up \nbeds and \ncots \n3.1 Mattress is aired, freed \nfrom dust and \nvacuumed in \n     accordance with SOPs. \n3.2 Soiled linens and \npillowcases are \nreplaced in accordance \nwith SOPs. \n3.3 Linens are centered and \nmitered when replaced \nas per SOPs. \n3.4 Beds and cots are \nmade-up according to \nprescribed procedure. \n3.1 Types/Classifications \nof Beds \n3.1.1 Various bedding \nmaterials and \naccessories \n3.1.2 Styles and \narrangements of \nbeds and \naccessories \n3.1.3 Types of bed \ninsects/parasites \nand controls \n3.2 Procedures in Bed \nMaking  \n3.2.1 Principles of bed \ndesigns and \narrangements \n3.1 Interpersonal \nSkills \n3.2 Keen on details \n3.3 Cleaning Skills \n3.4 Equipment \nOperation and \nCleaning \n3.5 Communication \nSkills \n3.6 Work Planning \nand Organization \nSkills \n3.7 Documentation \nSkills \n3.8 Making-up Beds\n\n--- PDF PAGE 51 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n47 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.2.2 Basic principle of \nbed aesthetics \n3.3 Knowledge on \ndifferent areas where \ndirt and dust can \neasily accumulate \n3.4 Linens and Fabric  \n \n4.  Clean \nbathrooms \n4.1 Ceilings and walls are \ncleaned in accordance \nwith standard \n      operating procedures \nand techniques. \n4.2 Window edges and sills \nare wiped clean in \naccordance with \nstandard operating \nprocedures. \n4.3 Bath tub, lavatory and \ntoilet bowls are \nscrubbed and \ndisinfected in \naccordance with \nstandard operating \nprocedures and \ntechniques. \n4.4 Accessories are washed \nand cleaned in \naccordance with \nstandard operating \nprocedures and \ntechniques. \n4.5 Bathroom supplies are \nreplenished and \ndefective accessories \nreplaced as per SOPs. \n4.6 Equipment is cleaned \nafter use in accordance \nwith manufacturer’s \ninstruction. \n4.7 All cleaning materials \nand equipment are \nstored in a safe place as \nper SOPs. \n4.8 Routine maintenance is \ncarried out or arranged \nas per standard \noperating procedures  \n \n4.1 Procedures and \nsafety in cleaning \nceiling and other \nhigher surfaces \n4.2 Procedures in \ncleaning bathrooms \n4.2.1 Materials/supplies \nfor cleaning and \nbathrooms \n4.2.2 Types of cleaning \nreagents for \nbathrooms \n4.2.3 Measurements of \nchemicals/solutio\nns formulations \n4.2.4 Chemical \ncompatibility/in \ncompatibility \n4.3 Handling and \ndisposing of chemical \n4.3.1 Reactions/effects \nof chemicals and \nother solutions to \nhuman health \n4.4 Storage of cleaning \nequipment and \nmaterials \n4.5 Chemical \ncompatibility/incomp\natibility \n4.6 Chemical reactions \non temperature \n  \n \n \n4.1 Interpersonal \nSkills \n4.2 Keen on details \n4.3 Cleaning Skills \n4.4 Decanting \nChemicals \n4.5 Equipment \nOperation and \nCleaning \n4.6 Communication \nSkills \n4.7 Handling and \nDisposing of \nChemicals \n4.8 Waste Handling \nand Disposal \n4.9 Work Planning \nand Organization \nSkills \n4.10 Documentation \nSkills \n \n5.  Sanitize \nrooms \n5.1 Sanitizing agents are \n100% accurately \n5.1 Types of Sanitizing \nAgents \n5.1 Interpersonal \nSkills\n\n--- PDF PAGE 52 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n48 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \nmeasured and mixed in \naccordance with \nrelevant safety \nregulations. \n5.2 Excess mixtures of \nsanitizing agents are \ndisposed according \n      to environmental \nrequirements. \n5.3 Rooms are sanitized in \naccordance with \nstandard operating \nprocedures. \n5.4 Equipment is cleaned \nafter use in accordance \nwith manufacturer’s \ninstructions. \n5.5 All cleaning materials \nand equipment are \nstored in a safe place as \nper SOPs. \n5.6 Routine maintenance is \ncarried out or arranged \nas per standard \noperating procedures \n5.1.1 Basic principle on \nidentifying \nsanitizing agents \n(acid-based, \nalkaline-based, \nchlorine, iodine) \n5.1.2 Basic principle of \nformulating \nsolutions \n5.1.3 Applications of \nvarious sanitizing \nagents \n5.1.4 Basic calculations \non formulating \nsanitizing agent \nsolutions \n5.1.5 Effects of \nsanitizing \nsolutions/agents \nto equipment and \nmetallic \ncomponents \n5.2 Standard Operating \nProcedures in \nSanitizing Rooms \n5.3 Disposal of Sanitizing \nAgents \n \n5.2 Keen on details \n5.3 Cleaning Skills \n5.4 Decanting \nChemicals \n5.5 Equipment \nOperation and \nCleaning \n5.6 Communication \nSkills \n5.7 Handling and \nDisposing of \nChemicals \n5.8 Waste Handling \nand Disposal \n5.9 Work Planning \nand Organization \nSkills \n5.10 Documentation \nSkills \n \n6. Maintain \nclean room \n   environment \n6.1 All equipment and \ncleaning paraphernalia \nare checked and \n      maintained according to \nmanufacturer’s \ninstructions. \n6.2 All wastes are removed \nand disposed of in \naccordance with \nemployer’s \nrequirements. \n6.3 All movable furniture \nand fittings are shifted to \nallow access to \n      hidden dust/waste/dirt \nand as per SOPs. \n6.4 Rooms are checked \nregularly for \norderliness/tidiness in \naccordance with \nemployer’s \nrequirements. \n6.1 Equipment Operation \nand Cleaning \n6.2 Types of Cleaning \nEquipment and \nMaintenance \nProcedures \n6.3 Work Planning and \nOrganization  \n6.4 Waste Disposal     \nProcedures: \n6.4.1 Classifications of \nWastes \n6.4.2 Environmental \nProtocols and \