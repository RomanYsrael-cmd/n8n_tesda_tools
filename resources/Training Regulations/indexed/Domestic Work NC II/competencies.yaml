aintain a \nclean \nworkplace \n3.1 Floors benches and \nother flat areas are \ncleaned in accordance \nwith workplace \n(protocols) SOPs. \n3.2 Animal housing areas \nare cleaned in \naccordance with \nworkplace (protocols) \nSOPs \n3.3 Waste and soiled \nbedding is disposed of \nin accordance with \nworkplace (protocols.) \nSOPs. \n3.4 Damage to housing \nand equipment is \nidentified and \nreported. \n3.5 Post-cleaning \nprocedures are \ncompleted. \n \n3.1 Animal housing \ncleaning techniques \nand equipment \n3.2 Organization policies, \nprocedures and \nrequirements, \nincluding OHS and \nemergency \nprocedures \n3.3 Regulations relating \nto the disposal of \nhazardous waste \n3.4 Safe use of \nchemicals and \ncleaning agents \n3.5 Workplace hygiene \nstandards, \ndisinfectants, \ncleaning agents, \ncleaning techniques \nand cleaning \nequipment and \nmaterials. \n \n3.1 Maintain the \nhighest standards \nof hygiene and \ninfection control at \nall times to reduce \nthe risk of \ninfection and \ncross-infection \n3.2 Participate in \narrangements for \nmaintaining the \nhealth and safety \nof all people and \nanimals in the \nworkplace \n3.3 Use equipment \nand materials \ncorrectly and in \naccordance with \nmanufacturers' \nspecifications \n3.4 Numeracy skills to \nestimate, calculate \nand record routine \nworkplace \nmeasures \n3.5 Problem solving \nskills \n3.6 Use safe manual \nhandling \ntechniques and/or \nequipment \n3.7 Communication \nSkills\n\n--- PDF PAGE 89 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n85 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Complete \nhygiene \npractices for \nanimals \n4.1 Hygiene control \nmethods for a range of \nanimals are identified \nand practiced. \n4.2 Basic animal hygiene \ninspection is performed \nand cleaning needs of \nnominated animals are \nidentified. \n4.3 Animals are bathed or \nclea