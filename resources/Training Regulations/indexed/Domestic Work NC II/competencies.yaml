        "source_title": "SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS",
        "source_text": "--- PDF PAGE 15 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n11 \nUNIT OF COMPETENCY : SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS \n \n \n \nUNIT CODE \n: 400311212 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto apply problem-solving techniques to determine the origin \nof problems and plan for their resolution. It also includes \naddressing procedural problems through documentation, and \nreferral. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nroutine \nproblems \n1.1 Routine problems or \nprocedural problem \nareas are identified \n1.2 Problems to be \ninvestigated are \ndefined and \ndetermined \n1.3 Current conditions of \nthe problem are \nidentified and \ndocumented \n1.1 Current industry \nhardware and \nsoftware products \nand services \n1.2 Industry \nmaintenance, service \nand helpdesk \npractices, processes \nand procedures \n1.3 Industry standard \ndiagnostic tools \n1.4 Malfunctions and \nresolutions \n \n1.1 Identifying current \nindustry hardware \nand software \nproducts and \nservices \n1.2 Identifying current \nindustry \nmaintenance, \nservices and \nhelpdesk \npractices, \nprocesses and \nprocedures. \n1.3 Identifying current \nindustry standard \ndiagnostic tools \n1.4 Describing \ncommon \nmalfunctions and \nresolutions. \n1.5 Determining the \nroot cause of a \nroutine \nmalfunction \n2. Look for \nsolutions to \nroutine \nproblems \n2.1 Potential solutions to \nproblem are identified \n2.2 Recommendations \nabout possible \nsolutions are \ndeveloped, \ndocumented, ranked \nand presented to \nappropriate person \nfor decision \n2.1 Current industry \nhardware and \nsoftware products \nand services \n2.2 Industry service and \nhelpdesk practices, \nprocesses and \nprocedures \n2.3 Operating systems \n2.4 Industry standard \ndiagnostic tools \n2.5 Malfunctions and \nresolutions. \n2.6 Root cause analysis \n2.1 Identifying current \nindustry hardware \nand software \nproducts and \nservices \n2.2 Identifying services \nand helpdesk \npractices, \nprocesses and \nprocedures \n2.3 Identifying \noperating systems \n2.4 Identifying current \nindustry standard \ndiagnostic tools\n\n--- PDF PAGE 16 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n12 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n \n \n2.5 Describing \ncommon \nmalfunctions and \nresolutions \n2.6 Determining the \nroot cause of a \nroutine malfunction \n3. Recommend \nsolutions to \nproblems \n3.1 Implementation of \nsolutions are planned \n3.2 Evaluation of \nimplemented solutions \nare planned \n3.3 Recommended \nsolutions are \ndocumented and \nsubmit to appropriate \nperson for \nconfirmation \n \n3.1 Standard procedures \n3.2 Documentation \nproduce  \n3.1 Producing \ndocumentation \nthat recommends \nsolutions to \nproblems \n3.2 Following \nestablished \nprocedures\n\n--- PDF PAGE 17 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n13 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Problems/Procedural \nProblem \n \nMay include: \n1.1 Routine/non – routine processes and quality \nproblems \n1.2 Equipment selection, availability and failure \n1.3 Teamwork and work allocation problem \n1.4 Safety and emergency situations and incidents \n1.5  Work-related problems outside of own work area \n2. Appropriate Person \nMay include: \n2.1 Supervisor or manager \n2.2 Peers/work colleagues \n2.3 Other members of the organization \n3. Document \n \nMay include: \n3.1 Electronic mail \n3.2 Briefing notes \n3.3 Written report \n3.4 Evaluation report \n4. Plan  \n \nMay include: \n4.1 Priority requirements \n4.2 Co-ordination and feedback requirements \n4.3 Safety requirements \n4.4 Risk assessment \n4.5 Environmental requirements\n\n--- PDF PAGE 18 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n14 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined the root cause of a routine problem \n1.2 Identified solutions to procedural problems. \n1.3 Produced documentation that recommends solutions to \nproblems. \n1.4 Followed established procedures. \n1.5 Referred unresolved problems to support persons. \n2. Resource Implications \n2.1 Assessment will require access to a workplace over an \nextended period, or a suitable method of gathering \nevidence of operating ability over a range of situations. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nCase Formulation \n3.2 \nLife Narrative Inquiry \n3.3 \nStandardized test \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk \nthrough of the relevant competency components.  \n4. Context for \nAssessment \n4.1 Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions.\n",
