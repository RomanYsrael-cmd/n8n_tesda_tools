lls \n7.9 Work Planning \nand Organization \nSkills \n7.10 Documentation \nSkills \n \n8. Store excess \nfood and \ningredients \n8.1 Unconsumed cooked \nfood is stored according \nto procedures. \n8.2 Excess ingredients are \nstored according to \nclient’s requirement. \n8.3 Proper method of \nrefrigeration is \n8.1 Food storage  \n8.2 Methods of storing \nfood and ingredients \n8.3 Conversion of \nunconsumed food \ninto new dishes \n \n8.1 Storing food and \ningredients skills \n8.2 Converting \nunconsumed food \nto new dishes \n8.3 Storing of dry and \nwet food/ \ningredients\n\n--- PDF PAGE 69 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n65 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nimplemented as per \nSOPs. \n8.4 Proper storing of dry \nand wet food/ \ningredients is \nimplemented in \naccordance with SOPs \n8.4 Observing \npersonal hygiene \n8.5 Interpersonal \nSkills \n8.6 Keen on details \n8.7 Communication \nSkills \n8.8 Waste Handling \nSkills \n8.9 Work Planning \nand Organization \nSkills \n8.10 Documentation \nSkills \n \n9. Convert \nunconsumed \ncooked food \n \n9.1 Unconsumed cooked \nfood is \nconverted/transformed \ninto new dishes as per \nSOPs. \n9.2 Unconsumed cooked \nfood is stored/frozen at \na temperature of zero \ndegrees and in \naccordance with SOPs. \n9.3 Packed/wrapped \nuncooked foods are \nfrozen at zero degrees \nF temperature and in \naccordance with SOPs. \n9.4 Packed/wrapped food \nfor storage is prepared \nas per SOPs. \n9.5 Uncooked food is \nmaintained at proper \ntemperature and as per \nSOPs \n \n9.1 Food storage  \n9.2 Methods of storing \nfood and ingredients \n9.3 Conversion of \nunconsumed food \ninto new dishes \n \n9.1 Storing food and \ningredients skills \n9.2 Converting \nunconsumed food \nto new dishes \n9.3 Storing of dry and \nwet \nfood/ingredients \n9.4 Observing \npersonal hygiene \n9.5 Interpersonal \nSkills \n9.6 Keen on details \n9.7 Communication \nSkills \n9.8 Waste Handling \nSkills \n9.9 Work Planning \nand Organization \nSkills \n9.10 Documentation \nSkills\n\n--- PDF PAGE 70 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n66 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Ingredients \nMay include: \n1.1 Meat \n1.2 Vegetable \n1.3 Seafood \n1.4 Poultry and Game \n1.5 Stock \n1.6 Cold Food \n1.7 Condiments \n1.8 Milk \n1.9 Dairies \n1.10 Cereals \n1.11 Flour \n1.12 Butter Sauces \n1.13 Fruits \n2. Mis en Place \nMay include: \n2.1 Ingredients \n2.2 Pans \n2.3 Utensils \n2.4 Plates/Serving Pieces \n3. Thawing \nMay include: \n3.1 Soaking \n3.2 Unfreezing \n4. Vegetable Ingredient \n      Preparation \n \nMay include: \n4.1 Skin, Peel, Pare \n4.2 Chop, Slice, Shred, Cube \n4.3 Wedge, Grate, Pure \n4.4 Core, Quarter \n5. Vegetable Manner of \n      Preparation \nMay include: \n5.1 Boiling, Blanching \n5.2 Sauteing \n5.3 Braising \n5.4 Gratinating \n5.5 Roasting/Baking \n6. Seafood Ingredient \n      Preparation \nMay include: \n6.1 Chop, Slice \n6.2 Fillet \n6.3 Mince, Shred \n6.4 Peel, Dice, Blanch \n6.5 Marinate, Poach \n7. Seafood Dishes \n     Preparation \nMay include: \n7.1 Boiling, Steaming \n7.2 Sauteing \n7.3 Deep Frying, Pan Frying \n7.4 Poaching \n7.5 Grilling \n7.6 Baking \n8. Soup Preparation \nMay include: \n8.1 Sauteing \n8.2 Simmering\n\n--- PDF PAGE 71 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n67 \nVARIABLE \nRANGE \n9.  Meat Ingredient \nPreparation \nMay include: \n9.1 Slice, Chop \n9.2 Debone \n9.3 Dice, Mince \n9.4 Marinate \n10. Meat Dishes \n      Preparation \nMay include: \n10.1 Boiling, Steaming, Simmering, Stewing \n10.2 Frying (deep, pan, stir) \n10.3 Sautéing \n10.4 Roasting, Baking, Browning \n10.5 Pressurize Cooking \n10.6 Poaching, Blanching, Braising \n10.7 Broiling, Grilling \n11. Poultry Ingredient \n      Preparation \nMay include: \n11.1 Deboned \n11.2 Chop, Slice \n11.3 Dice,