        "source_title": "PERFORM WEEDING AND CULTIVATION",
        "source_text": "--- PDF PAGE 100 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n96 \nUNIT OF COMPETENCY : \nPERFORM WEEDING AND CULTIVATION \n \nUNIT CODE \n: \nAGR611377 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nto conduct weeding operations and soil cultivation activities. \nThis is purposely to minimize competition and to improve soil \naeration and water absorption/retention, respectively for \nbetter growth and development of the landscape plants.    \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine  \nrequirements \nfor  weeding \nand cultivation \nactivity \n1.1 Weed species and \n“volunteer” plants \n(“’invaders”) that are \nout-of-place and \nconsidered undesirable \nin the landscape are \nidentified based on \nspecific landscape \nmaintenance guidelines \nor as per instructions. \n1.2 Landscape areas \nneeding weeding and \ncultivation are identified \nbased on instructions \nor in accordance with \nLMS. \n \n1.1 Requirements for \nweeding and \ncultivation activity \n1.2 Recognition of the \neffects of weeds and \nundesirable \n“volunteer” species \n(invaders) on \nlandscape plants \n1.3 Knowledge in \ndistinguishing weeds \nand undesirable \n“volunteer” species \n1.4 Landscape area \n \n1.1 Identifying weed \nspecies and \n“volunteer” plants  \n1.2 Identifying \nlandscape areas \nneeding weeding \nand cultivation \n2. Prepare for \nweeding and \ncultivation \noperation  \n \n2.1 List of weeds and \n“volunteer plants” and \nthe map of specific \nlandscape areas are \nprepared and secured \n2.2 Method and purpose \nof weeding are \ndetermined based on \nthe type of weed \nspecies and out-of-place \n“volunteer” species \n2.3 Tools, supplies and \nequipment needed are \nmade ready and \navailable for use \naccording to the types of \nweeds and “volunteer” \nspecies that needs \nremoval \n2.4 Appropriate safety \nprotective devices are \nprepared for use \n \n2.1 List of weeds and \n“volunteer plants” \n2.2 Map of specific \nlandscape areas \n2.3 Method and purpose \nof weeding \n2.4 Tools, supplies and \nequipment \n2.5 Safety protective \ndevices \n1.1 Identifying weed \nspecies and \n“volunteer” plants  \n1.2 Identifying \nlandscape areas \nneeding weeding \nand cultivation \n3. Conduct \nweeding and \nremoval of \n3.1 Weeds and out-of-place \n“volunteer” plant species \nin the landscape are \nremoved and disposed \n3.1 Knowledge in \ndistinguishing weeds \nand undesirable \n“volunteer” species \n3.1 Conducting \nweeding\n\n--- PDF PAGE 101 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n97 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n“volunteer” \nspecies  \n \nin accordance with \nlandscape maintenance \nstandard or as per \ninstructions. \n3.2 Weeds and out-of-place \n“volunteer” plant species \nare removed using \nprescribed tools and \nequipment \n3.3 Tasks are done using \nappropriate \nsafety/protective \ndevices. \n \n3.2 Appropriate \nsafety/protective \ndevices \n3.3 Waste disposal \n \n3.2 Using appropriate \ntools and \nequipment  \n3.3 Communication \nSkills  \n \n4. Determine  \ncompacted \nsoil  \n4.1 Compacted soil or soil \nthat is having problem \nwith aeration, water \ninfiltration and \nconditions for root \ndevelopment is   \ndetermined as per \nestablished practice \n4.2 Effects of compacted \nsoil on root \ndevelopment and \nanchorage are \nrecognized \n4.3 Method and purpose \nof soil cultivation are \ndetermined based on \nthe conditions of the \nsoil \n \n4.1 Compacted soil or \nsoil \n4.2 Effects of \ncompacted soil on \nroot development \nand anchorage \n4.3 Method and purpose \nof soil cultivation \n \n \n4.1 Compacting soil \n4.2 Familiarizing \neffects of \ncompacted soil on \nroot development \nand anchorage \n4.3 Determining \nmethod and \npurpose of soil \ncultivation  \n5. Cultivate \ncompacted \nsoil \n5.1 Compacted soil is \ncultivated simultaneous \nwith weeding \noperations in \naccordance with \nlandscape maintenance \nstandards or as per \ninstructions \n5.2 Soil cultivation is done \nusing appropriate tools \nand equipment \n5.3 Task is performed \nusing prescribed \nsafety/protective \ndevices \n5.1 Compacted Soil \n5.2 Weeding Operations \n5.3 Soil Cultivation \n5.4 Tools and Equipment \n5.5 Safety and Protective \nDevices \n5.1 Compacting soil \n5.2 Familiarizing \neffects of \ncompacted soil on \nroot development \nand anchorage \n5.3 Determining \nmethod and \npurpose of soil \ncultivation \n6. Perform post- \nweeding and \nsoil cultivation \nactivities \n6.1 Tools and equipment \nare cleaned, \nmaintained and stored \nas per instruction of in \naccordance with LMS \n6.1 Cleaning, \nmaintenance and \nstorage of tools and \nequipment  \n6.2 Maintenance of work \narea \n6.1 Understanding   \nwork procedures \n6.2 Participating in \nteams and \ncontributing to \nteam objectives\n\n--- PDF PAGE 102 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n98 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6.2 Maintenance of clean \nand safe area is \nundertaken throughout \nand on completion of \nwork \n6.3 Work outputs are \nrecorded or reported to \nconcerned persons or \nauthority according to \nindustry practices \n \n6.3 Documentation of \nwork outputs \n \n6.3 Communication \nskills in receiving \ninstructions and \nrendering even \nsimple oral and \nwritten reports \n6.4 Maintaining tools \nand equipment \n6.5 Minimizing \nenvironmental \ndisturbances\n\n--- PDF PAGE 103 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n99 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Weed species and \nvolunteer plants \n(invaders)  \nMay include: \n1.1 \nWeeds \n1.1.1 Grass \n1.1.2 Sedges \n1.1.3 Shrubs  \n1.1.4 Vines \n1.2 \nOut-of-place “volunteer” plant species are those that \ngrow naturally in the site and are competing with \ndesirable plants, making the site ugly and/or are eye-sore \nin the landscape. Volunteer species can be landscape \nplants but is not included in the landscape design \n2. Landscape areas \nMay include:  \n2.1 \nLawn  \n2.2 \nFlower beds \n2.3 \nHedges and shrubs landscape area \n2.4 \nTree lawn or tree planting verges \n3. Methods of weed \ncontrol \nMay include: \n3.1 \nManual weeding \n3.2 \nMechanical weeding \n3.3 \nChemical weeding  \n4. Purpose of weeding  \nMay include: \n4.1 \nRelease the desirable landscape plants from competition \nof weeds and out-of-place “volunteer” species \n4.2 \nImprove the health conditions of the landscape plants  \n4.3 \nLessen susceptibility of the landscape plants from pest \nand disease attack \n5. Methods of soil \ncultivation \nMay include: \n5.1 \nManual  \n5.2 \nMechanical \n6. Purpose of soil \ncultivation \nMay include: \n6.1 \nImprove soil structure, porosity, aeration and water \ninfiltration \n6.2 \nImprove conditions for root system development and root \nanchorage \n6.3 \nImprove water and nutrient absorption \n6.4 \nEnhance soil macro and micro-organisms activity \n7. Supplies, tools and \nequipment for \nweeding operations \n \nMay include: \n7.1 \nSmall bolo “dulos” \n7.2 \nScythe (“Karit”) \n7.3 \nSmall round/flat bar \n7.4 \nSpade \n7.5 \nTrowel \n7.6 \nChemicals (Types: Selective herbicide; Wide spectrum)  \n8. Tools and equipment \nfor soil cultivator \nMay in clued: \n8.1 \nSmall bolo (“dulos”) \n8.2 \nSmall round/flat bar \n8.3 \nSpade \n8.4 \nSoil cultivating machine \n9. Protective/safety \ndevices used in \nweeding and \ncultivation \nMay include: \n9.1 \nGoggles \n9.2 \nOveralls, gloves \n9.3 \nReflectorized vest (depends on location of work) \n10. Maintenance of clean \nand safe area \nMay include: \n10.1 Keeping public access paths and roads clear of debris, \nwaste, tools and equipment\n\n--- PDF PAGE 104 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n100 \n10.2 Disabling tools and equipment after use \n10.3 Using signage and barriers where necessary \n10.4 Removing debris and waste from the work area \n \n \n \nEVIDENCE GUIDE  \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined requirements for weeding and cultivation \nactivity \n1.2 \nPrepared for weeding and cultivation operation \n1.3 \nConducted weeding and removal of “volunteer” plant \nspecies \n1.4 \nDetermined compacted soil \n1.5 \nCultivated compacted soil \n1.6 \nConducted post weeding and soil cultivation operations \n1.7 \nUsed/operated tools and equipment properly \n1.8 \nUsed prescribed protective/safety gadgets \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 \nLandscape area \n2.2 \nNecessary tools and equipment \n2.3 \nRelevant supplies and materials \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDirect Observation with Oral Questioning \n3.2 \nInterview \n3.3 \nPortfolio \n \n4. Context of \nAssessment \n4.1 \nCompetency maybe assessed in actual workplace or at \nthe designated TESDA accredited Assessment Center.\n",
