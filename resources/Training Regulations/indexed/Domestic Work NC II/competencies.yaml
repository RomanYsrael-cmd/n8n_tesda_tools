wing food \nquality and safety \nhazard \n3.5 Communication \nSkills \n3.6 Handling food \n3.7 Costing and \nportioning of food \n3.8 Storing of food \n3.9 Interpersonal \nSkills \n3.10 Keen on details \n3.11 Communication \nSkills \n3.12 Waste Handling \nSkills \n3.13 Work Planning \nand Organization \nSkills \n3.14 Documentation \nSkills \n \n4. Prepare \nsauces, \n   dressings and \n   garnishes \n4.1 Materials, \nequipment/utensils are \nprepared prior to \npreparation of sauces, \ndressings and garnishes \nas per SOPs. \n4.2 Sauces, garnishes, hot \nand cold dressing is \nprepared as per SOPs. \n4.1 Mise and Place \n4.2 Methods of preparing \n4.2.1 Sauces \n4.2.2 Garnishes \n4.2.3 Hot and cold \ndressing \n4.3 Types of Sauces \n4.3.1 Ingredients and \nrecipes \n4.3.2 Methods of \nCooking \n4.3.3 Proper Storage of \nSauces \n \n4.1 Preparing \nmaterials, \nequipment, \nutensils \n4.2 Preparing sauces, \ndressings and \ngarnishes \n4.3 Interpersonal \nSkills \n4.4 Keen on details \n4.5 Communication \nSkills \n4.6 Waste Handling \nSkills \n4.7 Work Planning \nand Organization \nSkills \n4.8 Documentation \nSkills\n\n--- PDF PAGE 67 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n63 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5. Prepare \nappetizers \n5.1 D’oeuvres is prepared \naccording to \nrequirement and \npreference of client. \n5.2 Canape’s are prepared \naccording to \nrequirement for \npreference of client. \n5.3 Finger foods are \nprepared according to \nrequirement or \npreference of client. \n5.1 Kinds and \npreparation of  \n5.1.1 D’oeuvres \n5.1.2 Canape’s \n5.1.3 Finger Foods \n5.2 Kinds of Appetizer \n5.2.1 Importance of \nAppetizer \n5.2.2 Familiarization of \ningredients \naccording to \nrecipes \n5.3 Personal Hygiene \n \n5.1 Preparing \nappetizers \n5.2 Familiarizing with \ningredients \n5.3 Observing \npersonal hygiene \n5.4 Inte