ble \n2.2 Napkin folding \nskills \n2.3 Communication \nSkills \n2.4 Interpersonal   \nSkills \n2.5 Keen on details \n2.6 Observing \npersonal hygiene \n2.7 Table Setting \nSkills \n2.8 Waste Handling \nand Disposal\n\n--- PDF PAGE 74 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n70 \nmaterials, and placed \non the table. \n2.6 Required table \nappointments are \nselected according to \nthe style of table \nservice required. \n2.7 The required table \nappointments are set \nup on the table. \n2.8 The aperitif/pre-food \nservice wine is \npresented and served \nfrom the right side of \nthe guest/employer. \n2.9 The food and drink are \nserved according to the \nmenu for the day. \n2.10 The table \nappointments used are \nbussed out from the \nright side of the \nguest/employer when \nhe/she is done with the \nparticular food served. \n2.11 All table appointments, \ntools and equipment \nused during the service \nare cleaned and stored \nin accordance to the \nstandard procedures. \n2.12 The area is cleaned \nand sanitized. \n \n \n \n \n2.9 Work Planning \nand Organization \nSkills \n2.10 Documentation \nSkills \n \n3. Prepare \ncoffee and \nother \nbeverages \n3.1 Coffee maker and other \nequipment are chosen, \nprepared and inspected \nas to cleanliness and \nfunctionality according \nto Standard Operating \nProcedure.  \n3.2 Coffee filter is set up \naccording to standard \nprocedure. \n3.3 The required coffee \ngranules and water is \nmeasured. \n3.4 The coffee maker is \noperated according to \n3.1 Coffee and Types \n3.2 Coffee Preparation \nand Serving \nProcedures \n3.3 Coffee Maker, \nPreparation and \nInspection as to \nFunctionality \n3.4 Wine and Types \n3.5 Wine Selection \n3.6 Selection, \nPreparation and \nServing of Other \nBeverages \n3.7 Bussing Procedures \n3.8 Cleaning Procedures \n3.9 Storing Procedures \n3.1 Preparing coffee \nand other \nbeverages \n3.2 Serving coffee \nand other \nbeverages \n3.3 Preparing and \ninspecting coffee \nmaker \n3.4 Selecting, \npreparing and \nserving wine \n3.5 Communication \nSkills \n3.6 Interpersonal   \nSkills \n3.7 Keen on details \n3.8 Observing \npersonal hygiene \n3.9 Waste handling \nand disposal\n\n--- PDF PAGE 75 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n71 \nstandard operating \nprocedures \n3.5 The wine is selected \naccording to the menu \nto be served \n3.6 Other beverages are \nprepared according to \nemployer’s preference \n3.7 The coffee/tea is served \nat the right side of the \nguest/employer with \nappropriate temperature \n3.8 The wine is presented \nand served according to \nthe standard \nprocedures. \n3.9 Other beverages are \npresented and served  \n3.10 The Coffee and \nbeverages are bussed \nout from the right side \nof the guest/employer. \n3.11 The coffee maker is \ncleaned and stored \naccordingly. \n \n4.  Serve food \nand \nbeverage \n \n4.1 Foods are checked for \ncompleteness and \ncorrectness before \nserving. \n4.2 Foods are placed on \nthe tray and carried \nusing the left hand and \nin accordance with food \nand beverage serving \nprocedures. \n4.3 Foods are served from \nthe left side using the \nleft hand in serving as \nper SOPs. \n4.4 Water goblets are \nfilled/refilled from the \nright side without \nspilling as per SOPs. \n4.5 Beverage are taken \nfrom the bar/kitchen \nand inspected for \ncomplete garnishing (if \nany). \n4.6 Beverage are served \non a bar tray from the \nright side of the client \nbeing served as per \nSOPs. \n \n4.1 Serving techniques \nand standards \n4.2 Food handling and \nsafety \n4.3 Table serving \n4.4 Types of foods, \nbeverages and \ngarnishing \n4.5 Refilling water \n4.6 Washing and \nhandling of fresh \nfruits \n \n4.1 Serving food and \nbeverage \ntechniques \n4.2 Familiarizing with \nfood and \nbeverage \n4.3 Communication \nSkills \n4.4 Interpersonal   \nSkills \n4.5 Keen on details \n4.6 Equipment \nOperation and \nCleaning \n4.7 Observing \npersonal hygiene \n4.8 Waste Handling \nand Disposal \n4.9 Work Planning \nand Organization \nSkills \n4.10 Documentation \nSkills\n\n--- PDF PAGE 76 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n72 \n5.  Clear table \n \n5.1 Clients are asked \npolitely if they are \nfinished as per SOPs. \n5.2 Soiled plates/flat wares \nare bussed out from the \nright side of the family \nmembers and brought \nto the washing \nstation/area as per \nSOPs. \n5.3 Table is crumbed as \nper standard operating \nprocedure. \n5.4 Side plates and knives \nare removed from the \ntable as per SOPs. \n5.5 Condiments/shakers \nand other soiled items \nare removed from the \ntable as per SOPs. \n5.6 Ashtrays are replaced \nas per SOPs. \n5.7 Additional requests are \nasked politely from \nclients as per SOPs. \n5.8 Clients’ needs are \nchecked from time to \ntime until they move out \nfrom the dining area as \nper SOPs. \n \n5.1 Plate Clearing and       \nCarrying Techniques \n5.2 Waste Minimization \nand Environmental \nTechniques \n5.3 Safety Practices \n5.4 Codes and \nRegulations \n \n5.1 Plate clearing and \ncarrying Skills \n5.2 Familiarizing with \ntable set-up \n5.3 Communication \nSkills \n5.4 Interpersonal   \nSkills \n5.5 Keen on details \n5.6 Waste Handling \nand Disposal \n5.7 Work Planning \nand Organization \nSkills \n5.8 Documentation \nSkills\n\n--- PDF PAGE 77 ---\nDomestic Work NC II – SOCDOW222 \nPromulgated (05/2022) \n73 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Dining Environment \nMay include: \n1.1 \nLighting \n1.2 \nRoom Temperature \n1.3 \nMusic \n1.4 \nFloral and Other Decorations \n1.5 \nPrivacy \n1.6 \nBackground  \n2.  Equipment \nMay include: \n2.1 \nTable Cloth/Linen \n2.2 \nChina Wares \n2.3 \nGlassware \n2.4 \nSilverware \n2.5 \nCutlery \n2.6 \nWine \n2.7 \nCondiments \n2.8 \nChairs \n2.9 \nTables \n2.10 Ashtray \n2.11 Toothpicks \n2.12 Cloth/Paper Napkin \n3.  Beverage \nMay include: \n3.1 \nJuice \n3.2 \nWine & Spirits \n3.3 \nTea \n3.4 \nCoffee\n\n--