    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for DOMESTIC WORK NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: DOMESTIC WORK\nLevel: NC II\n\n Nominal Training Duration:\n\n37 hours\nBasic Competencies\n\n20 hours\nCommon Competencies\n\n90 hours\nCore Competencies\n\n147\n\nhours\n\nTOTAL\n\n80 hours\nSupervised Industry Learning (SIL)\n\nElective Competencies\n\n20 hours\nAssist in the care of animals\n\n20 hours\nProvide animal care hygiene routines\n\n15 hours\nTrim and prune landscape plants\n\n15 hours\nPerform weeding and cultivation\n\n12 hours\nWater/irrigate plants\n\n14 hours\nControl and prevent plant pest and diseases\n\n96 hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in cleaning living room,\ndining room, bedrooms, toilet and kitchen, washing and ironing clothes, linen and\nfabric, preparing hot and cold meals/food, and providing food and beverage service.\nThis include classroom learning activities and practical work in actual work site or\nsimulation area.\n\n--- PDF PAGE 115 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n111\n\nThe common competencies include maintain an effective relationship with\nclients/customers, and manage own performance. It also includes basic competencies\nsuch as, participate in workplace communication, work in a team environment, practice\ncareer professionalism, and practice occupational health and safety procedures. The\ncommon competency –Maintain an effective relationship with clients and customers\nhas been contextualized to include the provisions of Kasambahay law, e.g. standard\nemployment contract, rights and privileges, pre-employment requirements, working\nconditions, barangay registrations, social and other benefits, etc.\n\nIt also has six (6) elective competencies as indicated below:\n1. Assist in the care of animals (20 Hrs)\n2. Provide animal care hygiene routines (20 Hrs)\n3. Trim and Prune landscape plants (15 Hrs)\n4. Perform weeding and cultivation (15 Hrs)\n5. Water/irrigate plants (12 Hrs)\n6. Control and prevent plant pest and diseases (14 Hrs)\n\nThe Elective competencies are additional core units of competencies that are\nuseful but not absolutely necessary for enhancing the mobility/employability of a\nperson. These competencies are considered important in the performance of the job\nand may be drawn from among the units of competency in the TRs promulgated for\nother sectors. Likewise, they are only taken depending on the need of the work\nenvironment.\n\nThese Elective Competencies where selected from the core units of\ncompetencies from the existing WTR in Landscape Installation and Maintenance\n(Softscape) and one (1) NTR on Animal Care with two (2) units of competencies by\nthe Technical Experts invited during the development of the Training Regulation and\nCompetency-Based Curriculum for the Domestic Work NC II.\n\nThe Elective Competencies for Providing Care and Support for Infants,\nToddlers, Children, Elderly, People with Special Needs were not included because\nthese are highly specialized areas and are now in four separate Training Regulations\nse. Hence, the learners should take the whole program as prescribed in the Training\nRegulations.\n\nElective competencies are not mandatory for program registration. TVET\nInstitutions/Training Providers may opt to offer one or two or more competencies if they\nhave the available resources and facilities.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieve.\n\n--- PDF PAGE 116 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n112\n\nCourse Delivery:\nFlexible Learning delivery with the following modes:\nBlended Learning\n• Online\n-\nSynchronous using conferencing apps\n-\nAsynchronous through LMS/CMS\n\n• Offline\n-\nFace to face demonstration\nDistance Learning\n• Modular self-paced\n\n--- PDF PAGE 117 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n113\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\nPerform workplace duties scenario\nfollowing workplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n--- PDF PAGE 118 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n114\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication procedures\nand systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record\nroutine workplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people\nof social range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work-related documents\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no Definition of Team\no Difference between team and group\no Objectives and goals of team\n• Lecture/ Discussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n--- PDF PAGE 119 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n115\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nLocate needed information from the\ndifferent sources of information\n2.2 Identify one’s role\nand responsibility\nwithin team\n•\nRole play :\no individual role and responsibility\n•\nRole Play\no Understanding Individual\ndifferences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Analyze routine/procedural problems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n3.2 Look for solutions\nto routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 120 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n116\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Formulate possible solutions to\nproblems and document procedures for\nreporting\n3.3 Look for solutions\nto routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Formulate possible solutions to\nproblems and document procedures for\nreporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management\nstrategies that assist in regulating\nbehavior and achieving personal and\nlearning goals\n• Explain enablers and barriers in\nachieving personal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger,\nworry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\nprofessional\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 hour\n\n--- PDF PAGE 121 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n117\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal\nand career goals\n• Share experiences that show\nconfidence, and resilience in the face of\nsetbacks and frustrations and other\nnegative emotions and unpleasant\nsituations in the workplace\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/ dislikes;\nthrough showing of self-confidence\n• Demonstrate self-acceptance and being\nable to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n1 hour\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-\nregulation based on Self-Regulation\nTheory (SRT)\n• Explain personality development\nconcepts\n• Cite self-help concepts (e. g., 7 Habits\nby Stephen Covey, transactional\nanalysis, psycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility,\nadaptability, etc.\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n1 hour\n\n--- PDF PAGE 122 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n118\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Determine strengths and weaknesses\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to\ndo things better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 hour\n5.2 Discuss and\ndevelop ideas\nwith others\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Communicate ideas through small group\ndiscussions and meetings\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance\n1 hour\n\n--- PDF PAGE 123 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n119\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n5.3 Integrate ideas\nfor change in the\nworkplace\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Communicate ideas through small group\ndiscussions and meetings\n• Demonstrate basic skills in data analysis\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 hour\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\no Organisational protocols\no Confidentiality and accuracy\no Business mathematics and\nstatistics\no Legislation, policy and procedures\nrelating to the conduct of\nevaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 hours\n6.2 Assess gathered\ndata/ information\n• Lecture and discussion on:\no Data analysis techniques/\nprocedures\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n3 hours\n\n--- PDF PAGE 124 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n120\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Organisational values, ethics and\ncodes of conduct\no Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n• Role Play\n• Practical exercises\n• Presentation\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\no Reporting requirements to a range\nof audiences\no Recommendations for possible\nimprovements\n• Analysis and comparison of interim and\nfinal reports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 hours\n7. Practice\nOccupational\nSafety and\nHealth Policies\nand Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety\nmaterials, tools and equipment\n• Handling of safety control resources\n\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n• Discussion of General OSH Standards\nand Principles\n• Performing industry related work\nactivities in accordance with OSH\nStandards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 hours\n\n--- PDF PAGE 125 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n121\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n• Discussion on the process how\nEnvironmental Policies coherence is\nachieved\n•\nDiscussion on Necessary Skills in\nresponse to changing environmental\npolicies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness of\nresource\nutilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work\nProcedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods\nand technologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 hour\n\n--- PDF PAGE 126 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n122\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n9.3 Implement cost-\neffective\noperations\n• Case studies on Preservation,\noptimization and judicious use of\nworkplace resources\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n2 hours\n\n--- PDF PAGE 127 ---\nDomestic Work NC II – SOCDOW222\nPromulgated (05/2022)\n123\nCOMMON COMPETENCIES\n(20 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Maintain an\neffective\nrelationship with\nclients/\ncustomers\n (14 hrs.)\n\n1.1 Maintain a\nprofessional\nimage\n• Lecture and discussion on the following\ntopics:\no Uniform and personal grooming\nrequirements of the employer and\nthe client\no Professional Code of Conduct of a\nHousehold Worker\no Professional Code of Ethics of a\nHousehold worker\no Desirable traits of a Household\nworker\no Uniform,\nequipment\nand\nparaphernalia of a Household\nworker\no Power and Duties of a Household\nworker\no Customer Relation\no Human Relation\no Value Formation\no Gender Awareness\no Courtesy and Discipline\no Kasambahay Law\n- Standard Employment Contract\n- Worke