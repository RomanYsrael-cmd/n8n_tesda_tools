      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of DOMESTIC WORK NC II, the candidate must demonstrate competence through project-type assessment covering all required units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 The qualification of DOMESTIC WORK NC II may be attained through – 4.1.3.1 Accumulation of Certificates of Competency (COCs) in the following units of competencies: COC 1: Clean living room, dining room, bedroom, bathroom and kitchen COC 2: Wash and iron clothes, linen and fabric COC 3: Prepare hot and cold meals COC 4: Provide food and beverage service 4.1.3.2 Depending on specific employer/workplace requirements, the candidate may choose one or more from the following groups of Elective Competencies. Each group will lead to the issuance of Certificates of Competency (COC) in the following clusters of related competencies: COC 1: Provide care for animals • Assist in the care of animals • Provide animal care hygiene routines COC 2: Maintain plants and gardens • Trim and prune landscape plants • Perform weeding and cultivation • Water/irrigate plants • Control and prevent plant pest and diseases Domestic Work NC II – SOCDOW222 Promulgated (05/2022)"
    },
    {
      "number": "198",
      "text": "Holders of unexpired National Certificate or Certificate of Competency (COC 2 : Maintenance) in Landscape Installation and Maintenance (Soft Scape) NC II shall be exempted from the requirement of COC 2 on “Maintain plants and gardens”. The elective competencies on providing care and support for newborn, infants, toddlers, children, elderly, people with special needs were not included because these are highly specialized areas. Moreover, the revised Training Regulations on Caregiving NC II are now composed of 4 types designed for specific clients (newborn to toddlers, children to adolescent, elderly and clients with special needs). Hence, a person qualified to apply for assessment and certification in these qualifications may opt to take the National Assessment. 4.1.4 Any of the following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of WTR-, NTR-registered programs or formal/non- formal/informal including enterprise-based training programs related to domestic work; 4.1.4.2 Experienced workers (wage employed or self-employed) who gained competencies in domestic work for at least 2 years within the last five (5) years. 4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least five (5) years of experience in domestic work within the last ten (10) years may apply for recognition in this Qualification through Portfolio Assessment. The conduct of Portfolio Assessment is subject to TESDA Circular No. 118 series of 2019. 4.1.6 The Holders of National Certificate (NC) or Certificates of Competency (COCs) in Domestic Work NC II are required to undergo re-assessment under the amended Training Regulations (TRs), upon expiration of their Certificates."
