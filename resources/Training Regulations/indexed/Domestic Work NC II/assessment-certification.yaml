mersed in liquid at or above the boiling point. 8. Braise – a cooking method in which the main item, usually meat, is seared in fat, then simmered in stock to another liquid in a covered vessel. 9. Broil – a cooking method in which items are cooked by a radiant heat source placed above the food, usually in a broiler."
