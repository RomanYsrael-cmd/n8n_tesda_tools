      "term": "Broil",
      "definition": "a cooking method in which items are cooked by a radiant heat source placed above the food, usually in a broiler. 10. Carpet Sweeper – a handy type of sweeper used to pick-up dirt and particles from the carpet surface. 11. Chop – to cut into pieces of roughly the same size. Also, a small cut of meat including part of the rib. 12. Cuisine – food cooked and served in styles from around the world. 13. Cutlery – refers to knives and other cutting implements. 14. Deep Fry – a cooking method in which foods are cooked by immersion in hot fat; deep fried foods are often coated with breadcrumbs or butter before being cooked. 15. Detergent – a chemical that acts like a soap and is used for cleaning numerous surfaces. Detergents can be used effectively in hard water where ordinary soap not produce suds and will leave a residue. 16. Dice – to cut ingredients into small cubes (1/4 inches for small, 1/3 for medium, ¾ inch for large). 17. Disinfectant – a substance or means used to destroy pathogenic microorganisms. 18. Disinfection – a condition existing when infectious material or infection/s are removed. 19. Fillet – a boneless cut of meat, fish or poultry. 20. Flatware – it denotes all forms of spoons and forks. 21. Furniture, Fixtures & Eqpt. (FFE) – classification of fixed assets that have specified depreciable lives, usually ranging from three to seven years."
