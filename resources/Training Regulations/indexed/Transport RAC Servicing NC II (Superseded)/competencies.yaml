        "source_title": "SERVICE AND MAINTAIN TRANSPORT AIR- CONDITIONING AND REFRIGERATION UNITS",
        "source_text": "--- PDF PAGE 65 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       63 \n \n \n \n \nUNIT OF COMPETENCY: \n SERVICE AND MAINTAIN TRANSPORT AIR- \nCONDITIONING AND REFRIGERATION \nUNITS \n \nUNIT CODE \n: \nHVC723317 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and \nattitudes in maintaining air-conditioning and \nrefrigeration units in the land and marine \ntransports. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1.  Check and maintain \ncomponents/parts of \nair-conditioning and \nrefrigeration systems \n \n1.1  Evaporator/condenser coil are cleaned in \naccordance with manufacturer's maintenance \nmanual \n1.2  Refrigerant piping are checked for condition, leak, \ninsulation and tightness of support/brackets as per \nmanual \n1.3  Operating condition and electro-mechanical \ncontrols/setting is in accordance with manufacturer's \noperation/service manual \n1.4  Air-conditioning and refrigeration accessories \nand components are checked and adjusted as per \nmanufacturer's operation/service manual  \n1.5  Fittings and support of all systems and equipment \nmust be checked for leakage \n1.6  Correct maintenance procedures  are applied \naccording to standard operating procedures \n \n2.  Maintain lubrication  \nsystem  \n \n2.1  Lubrication system and components are checked to \nmeet operational specifications \n2.2  Oil levels, properties and circulation balances are \nchecked and adjusted to meet operational \nspecifications \n2.3  Oil leaks are detected and rectified based on \nprocedures\n\n--- PDF PAGE 66 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       64 \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variables\n \n3.  Maintain refrigerant system  \n \n3.1  Pressure drops across strainer, filters and \nfilter drier are checked and recorded based \non procedures \n3.2  Refrigerant leaks are detected and rectified \nbased on procedures \n3.3  Refrigerant system variables and \ncontaminants are checked and adjusted \nbased on procedures \n \n \n4.  Maintain secondary heat \ntransfer \n \n4.1 Liquid properties are adjusted based on \nstandards \n4.2 Follow-up action is arranged in accordance \nwith workplace procedures \n \n5.  Maintain air distribution system  \n \n5.1 Air distribution system components are \nchecked and air flows are balanced based \non procedures \n5.2 Outdoor air supply systems are checked \nand maintained based on operational and \nregulatory requirements \n5.3 Humidifier equipment is checked, serviced, \nand sanitized based on operational and \nregulatory requirements \n \n6.  Maintain electrical system \n \n6.1  Electrical wiring are checked for circuit \ntroubles as per standard operating \nprocedures \n6.2  Electrical control and devices are checked \nfor normal operation as per standard \noperating procedures \n6.3  Termination and joints are checked for \nfirmness and tightness as per standard \noperating procedures\n\n--- PDF PAGE 67 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       65 \n \n \n \n \n \n \n    RANGE OF VARIABLES \n  \nVARIABLE \nRANGE \n \n1.  Operating conditions \n \n1.1  Pressures \n1.2  Temperatures \n1.3  Voltages \n1.4  Current draws \n1.5  RPM of compressor pulley \n \n2.  Air-conditioning and  \nRefrigeration components \n \n \n \n \n \n \n2.1  Evaporator \n2.2  Condenser Coil \n2.3  Oil Filters \n2.4  Refrigerant Piping \n2.5  Belts \n2.6  Pulley alignment/tension \n2.7  Mechanical controls and services \n2.8  Compressor \n2.9  Valves \n2.10 Door Hinges \n2.11 Cabinetry/Housing \n2.12 Fans \n2.13 Motors \n2.14 Refrigerant flow control \n \n3.  Liquid properties \n \n3.1  Refrigerant \n3.2  Water (H2O)\n\n--- PDF PAGE 68 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       66 \n \n \n \n \n \n \n \n \n    EVIDENCE GUIDE \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1  Checked air-conditioning/refrigeration equipment \ncomponents and devices in accordance with manufacturer's \nmaintenance/operation manual \n1.2  Checked operating conditions and electro-mechanical \ncontrols/settings in accordance with manufacturer's \noperation/service manual \n1.3  Checked and adjusted lubrication and refrigerant system \nvariables and components to meet operational \nspecifications/efficiency \n1.4  Checked and maintained air distribution system to meet \noperational and regulatory requirements \n1.5  Conducted test  as per standard procedures \n1.6  Demonstrated compliance with safety regulations applicable \nto worksite operations \n1.7  Selected  types of electrical tools/instrument and wiring \ndevices in accordance with specification and job \nrequirements \n1.8  Identified faults and problems and made necessary actions  \nto rectify \n1.9  Communicated interactively with others where applicable  to \nensure safe and effective work operations \n2.  Underpinning \nKnowledge \n \n2.1  SAFETY PRACTICES \n Protective personal equipment/safety gears \n Handling of tools, equipment and accessories \n Safety signs and symbols \n Good housekeeping \n2.2  TRADE MATHEMATICS/MENSURATION \n Linear measurements \n Dimensions \n Ratio and proportion \n Unit conversion \n2.3  BLUEPRINT READING \n Electrical plans, symbols and abbreviations \n Mechanical plan, symbols and abbreviations\n\n--- PDF PAGE 69 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       67 \n \n \n2.  Underpinning \nKnowledge  \n2.4  TRADE THEORY \n \nBasic electricity \n \nAir-conditioning and refrigeration \n \nCompressor \n \nCondenser \n \nExpansion valve \n \nLubricant \n \nPrinciples of Refrigeration \n \nCompression \n \nCondensing \n \nExpansion \n \nRevaporizing \n \nBasic electronics \n \nBasic automotive \n \nElectrical and mechanical system of A/C \n \nHeat transfer \n2.5  MAINTENANCE \n \nPreventive Maintenance \n \nMaintaining electrical system \n \nMaintaining mechanical system \n2.6  LEGISLATION \n \nClean Air Act (RA 8749) \n \nMontreal Protocol \n \nOzone Depleting Refrigerants (ODRs) \n3.  Underpinning      \nSkills \n3.1 Interpreting plans and details \n3.2 Preparing materials \n3.3 Handling of electrical and mechanical tools and equipment \n3.4 Troubleshooting technique \n3.5 Calibrating of expansion valve \n3.6 Maintaining transport air-conditioning and refrigeration \nsystems \n3.7 Adjusting superheat \n4.  Resource  \nImplications \nThings necessary to conduct method of assessment: \n4.1  Work place location \n4.2  Tools and equipment appropriate to servicing/maintaining \ntransport air-conditioning and refrigeration processes \n4.3  Materials relevant to the proposed activity \n4.4  Drawings and specifications relevant to the task \n5.  Methods of     \nAssessment \nCompetency in this unit must be assessed through: \n5.1  Direct observation  \n5.2  Questions related to underpinning knowledge  \n6.  Context for    \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting\n",
