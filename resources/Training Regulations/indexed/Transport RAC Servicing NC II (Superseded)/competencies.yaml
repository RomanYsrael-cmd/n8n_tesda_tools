          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual inspection of all air-conditioning\ncomponents\n1.2 Selected types of electrical tools/instrument and wiring\ndevices, equipment and materials in accordance with\nspecification and job requirement\n1.3 Identified and diagnosed faults in accordance with the\nstandard operating procedures\n1.4 Reported and repaired any signs of damage, lubricant\nleaks and corrosion according to manufacturer's\nspecifications\n1.5 Repaired/replaced transport air-conditioning and\nrefrigeration and its components as per manufacturer's\noperation/repair manual\n1.6 Converted air-conditioning system with appropriate\nrefrigerants following standard operating procedures\n1.7 Air-conditioning system functioned within compressor and\nmanufacturer's acceptable limits of temperatures and\npressures\n1.8 Tested air-conditioning system operation according to\nmanufacturer's specifications and standard operating\nprocedures\n1.9 Performed preventive maintenance in accordance with\nmanufacturer's specifications\n1.10 Recorded and completed maintenance/service reports in\naccordance with standard operating procedures\n1.11 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.12 Communicated interactively with others where applicable\nto ensure safe and effective work operations\n\n--- PDF PAGE 89 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 87\n\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n• Protective personal\nequipment/safety gear\n• Safe handling of tools and\nequipment\n• Proper handling of\nrefrigerants/pressure\ntesting and welding gases\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 BLUEPRINT READING\nAND PLAN\nSPECIFICATION\n• Electrical wiring control\ndiagram\n• Mechanical plan/symbols\nand abbreviations\n• Electrical plans, symbols\nand abbreviations\n\n2.3 TRADE THEORY\n• Basic electricity\n• Basic electronics\n• Basic automotive\n• Basic refrigeration cycle\n• Fundamentals of control\n• Principle and operation of\nauxiliary parts of\nrefrigeration system\n• Principle and operation of\nair-conditioning and\nrefrigeration\n• Principle and operation of\ninterlocking control\n• Fan characteristics\n• Electrical code\n• Air-conditioning and\nrefrigeration system\n• Basic welding\n• Installation procedures\n• Selection of unit and\ncomponents\n• Heat transfer\n\n--- PDF PAGE 90 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 88\n\n2.4 TOOLS/MATERIALS:\nUSES AND\nSPECIFICATIONS\n• Types of electrical controls\n• Types of expansion\nvalves/metering devices\n• Types of compressor\nmotor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of filter drier\n• Types of filter/strainer\nelement\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic\ncontractor\n• Types of unloader\n• Types of compressor\n• Types of pump\n• Phase sequence tester\n2.5 TRADE MATHEMATICS/\nMENSURATION\n• Linear measurements\n• Dimensions\n• Ratio and proportion\n• Unit conversion\n2.6 LEGISLATION\n• Clean Air Act (RA 8749)\n• Montreal Protocol\n• Ozone Depleting\nRefrigerants (ODRs)\n2.7 MAINTENANCE\n• Preventive Maintenance\n2.8 PROCESSES/\n PROCEDURES\n• Electrical control calibration\nprocedures\n• Repair/replace/assemble\ncompressor procedure\n• Repair/replace defective\ncondenser procedure\n• Replace liquid line strainer\nelement procedure\n• Replace metering device\nprocedure\n• Replace pressure controls\nprocedure\n• Replace thermostat\nprocedure\n• Repair/replace refrigerant\npiping procedure\n• Brazing procedure\n• Refrigerant recovery\nprocedures\n• Follow the general\nprocedure for checking-out\ntransport air-conditioning\nand refrigeration control\n• Pump down procedures\n• Replace defrost controls\nprocedure\n• Repair/replace fan/fan\nmotor procedures re:\nevaporator condenser\n• Refrigerant charging\nprocedures\n• Leak testing procedures\n• Mechanical testing\n• Latest update on\nrefrigerant types and usage\nin relation to environmental\nissues\n\n--- PDF PAGE 91 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 89\n\n3. Underpinning\nSkills\n\n3.1 Reading and interpreting schematic diagram, plans,\ndrawings, specifications and manuals\n3.2 Installing equipment, components and accessories\n3.3 Fabricating brackets\n3.4 Using electrical tools and materials properly\n3.5 Handling manual safely\n3.7 Testing electrical/mechanical\n3.8 Troubleshooting technique\n3.9 Replacing defective parts\n3.10 Preparing reports\n3.11 Reading and interpreting manufacturer's manual\n3.12 Performing mathematical computation and calculations,\nincluding linear measurements, ratios and unit conversion\n4. Resource\n Implications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Air-conditioning and refrigeration system\n4.3 Refrigerant\n4.4 Materials, tools and equipment appropriate to\nrepairing/retrofitting processes\n4.5 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 92 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 90\n\nUNIT OF COMPETENCY: PERFORM TESTING AND COMMISSIONING FOR\nTRANSPORT AIR-CONDITIONING AND\nREFRIGERATION\n\nUNIT CODE :"
