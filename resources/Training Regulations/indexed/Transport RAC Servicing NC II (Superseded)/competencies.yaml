itudes in\nchecking condition, performing preventive maintenance\nand storing of tools and equipment based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n--- PDF PAGE 45 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 43\n\n1. Check condition of tools and\nequipment\n\n1.1 Materials, tools and equipment are identified\naccording to classification and job requirements\n1.2 Non-functional tools and equipment are\nsegregated and labeled according to\nclassification\n1.3 Safety of tools and equipment are observed in\naccordance with manufacturer's instructions\n1.4 Condition of PPE are checked in accordance\nwith manufacturer's instructions\n\n2. Perform basic preventive\nmaintenance\n\n2.1 Appropriate lubricants are identified according\nto types of equipment\n2.2 Tools and equipment are lubricated according\nto preventive maintenance schedule or\nmanufacturer's specifications\n2.3 Measuring instruments are checked and\ncalibrated in accordance with manufacturer’s\ninstructions\n2.4 Tools are cleaned and lubricated according to\nstandard procedures\n2.5 Defective instruments, equipment and\naccessories are inspected and replaced\naccording to manufacturer’s specifications\n2.6 Tools are inspected, repaired and replaced\nevery after use\n2.7 Work place are cleaned and in safe state in line\nwith OHSA regulations\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n--- PDF PAGE 46 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 44\n\n3. Store tools and equipment\n\n3.1 Inventory of tools, instruments and equipment\nare conducted and recorded as per company\npractices\n3.2 Tools and equipment are stored