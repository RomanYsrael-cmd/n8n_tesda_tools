        "evidence_guide": {
          "source_text": "--- PDF PAGE 63 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 61\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Read and interpreted work instructions to determine job\nrequirements\n1.2 Selected tools, equipment and materials in line with job\nrequirements\n1.1 Installed unit, equipment/components are sequentially done and\ncorrectly positioned and leveled in line with drawings, designs,\nspecifications and manufacturer's instructions\n1.2 Charged components and systems in accordance with system\ninstructions, specifications, industry codes and regulations\n1.5 Employed safe manual handling techniques in line with\nenterprise procedures\n1.6 Tested unit in line with the manufacturer's instructions\n1.7 Demonstrated compliance with safety regulation applicable to\nworksite operations\n1.8 Identified faults and problems and made necessary action to\nrectify\n1.9 Cleaned worksite and kept in a safe state in accordance with\nenterprise procedures\n1.10 Communicated interactively with others where applicable to\nensure safety and effective work operations\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n•\nProtective personal equipment/safety gears\n•\nHandling of tools, equipment and accessories\n•\nSafety signs and symbols\n•\nGood housekeeping\n2.2 TRADE MATHEMATICS/\n MENSURATION\n•\nLinear measurements\n•\nDimensions\n•\nRatio and proportion\n•\nUnit conversion\n2.3 BLUEPRINT READING AND PLAN SPECIFICATIONS\n•\nElectrical plans, symbols and abbreviations\n2.4 LEGISLATION\n•\nClean Air Act (RA 8749)\n•\nMontreal Protocol\n•\nOzone Depleting Refrigerants (ODRs)\n2.5 MATERIALS, TOOLS: USES AND SPECIFICATIONS\n•\nBolts and nuts\n•\nBrackets\n•\nRivets\n•\nWrenches\n•\nTubing tools\n•\nCutting tools\n\n--- PDF PAGE 64 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 62\n\n2.6 TRADE THEORY\n•\nBasic Electrical\n•\nBasic electronics\n•\nBasic automotive\n•\nAir-conditioning and refrigeration system\n-\nCompressor\n-\nEvaporator\n-\nCondenser\n-\nExpansion valve\n•\nFunction of air-conditioning/refrigerant components\n•\nBasic welding\n•\nPrinciples of air-conditioning and refrigeration\n-\nCompression\n-\nCondensing\n-\nExpansion\n-\nRevaporizing\n•\nInstallation procedures\n•\nSelection of unit and components\n•\nHeat transfer\n2.7 MAINTENANCE\n•\nPreventive Maintenance\n3. Underpinning\nSkills\n3.1 Interpreting plan, drawings, specifications and manuals\n3.2 Installing equipment, components and accessories\n3.3 Fabricating brackets\n3.4 Safe manual handling\n3.5 Reading and interpreting manufacturer’s manual\n3.6 Performing mathematical computation\n4. Resource\nImplications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Tools and equipment appropriate to construction processes\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n4.5 Air-conditioning and refrigeration equipment and\ncomponents\n4.6 Vehicle\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 65 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 63\n\nUNIT OF COMPETENCY:\n SERVICE AND MAINTAIN TRANSPORT AIR-\nCONDITIONING AND REFRIGERATION\nUNITS\n\nUNIT CODE\n:"
        },
        "source_text": "HVC723316\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and\n attitudes to safely install and test air-conditioning\n and refrigeration units in the land and marine\n transports.\n\nELEMENT\nPERFORMANCE CRITERIA\nitalicized terms are elaborated in the\nRange of Variables\n\n1. Prepare for the installation of\nrefrigeration and air-conditioning\nsystems\n\n1.1 Work instructions are read and interpreted to\ndetermine job requirements\n1.2 Installation drawings and component\ninstructions are verified with supervisor\n1.3 Arrangements are made for the installation and\nwith approval of appropriate authority\n1.4 Tools and equipment are selected in line with\njob requirements\n1.5 Unit and associated materials are selected in\naccordance with job requirements\n\n--- PDF PAGE 60 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 58\n\n2. Install refrigeration and air-\nconditioning system components\n2.1 Components of transport air-conditioning and\nrefrigeration\nsystems\nare\nchecked\nand\nidentified as per procedures\n2.2 Components are positioned/secured and\ninstalled in accordance with drawings, designs\nand specifications\n2.3 Supports and bracketing to secure pipework\nare positioned and fixed in accordance with\ndrawings, designs and specifications\n2.4 Piping, tubing, ducting and insulation are\npositioned and secured in accordance with\ndrawings and specifications\n2.5 Safety precautions are observed are\nobserved as per safety standards\n2.6 Valves and controls are installed in\naccordance with designs, specifications and\nwork instructions\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n3. Charge the components of\nrefrigeration and air-\nconditioning systems\n\n3.1 Systems and components are checked for\nleaks in accordance with SOPs\n3.2 Components and systems are charged\nwith refrigerant and secondary heat\ntransfer fluids in accordance with system\ninstructions, specifications, industry codes\nand regulations\n3.3 Identification labels are affixed to systems\nand components in accordance with\nindustry codes and regulations\n3.4 Systems are prepared for testing, and\ndocumentation is completed according to\ncompany policy\n\n--- PDF PAGE 61 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 59\n\n4. Test transport air-conditioning\nand refrigeration systems for\noperation\n\n4.1 Safety precautions are observed as per\nsafety regulations\n4.2 Suitable tools and equipment are selected\nand used as per procedures\n4.3 Test gauges are connected according to\nsystem manufacturer's instructions\n4.4 Level of refrigerant charge is determined\nbased on standard operating procedures\n4.5 Blockages and other malfunctions are\nidentified and located based on\nprocedures\n4.6 Efficiency of the system is determined as\nper procedures\n4.7 Report on installation and testing of unit is\nprepared in line with enterprise procedures\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Work Instructions\n\n1.1 Manufacturer's recommendations/\n specifications\n1.2 Installation drawings\n1.3 Blueprints\n1.4 Components instructions\n\n2. Tools and equipment\n\n2.1 Electric drill and bits\n2.2 Box wrenches\n2.3 Electric arc welding machine\n2.4 Oxy-acetylene welding accessories/set\n\n--- PDF PAGE 62 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 60\n\n3. Unit\n\nTransport air-conditioning and refrigeration\nunits refer to:\n3.1 Land transport (engine driven, e.g. cars,\ntrucks, refrigerated vans, etc.)\n3.2 Marine/sea transport (vessels)\n\n4. Materials\n\n4.1 Angle bar/flat bar/steel plate\n4.2 Bolts, nuts and screw/lock washer\n4.3 Insulation tape\n4.4 Working plans, drawings, manual\n\n5. Components\n\n5.1 Compressor\n5.2 Compressor bracket\n5.3 Compressor assembly\n5.4 Idler/Tension pulley\n5.5 Evaporator assembly\n5.6 Condensers\n5.7 Condenser fan\n5.8 Air ducts\n5.9 Evaporators\n5.10 Expansion device\n\n6. Safety precautions\n\n6.1 Personal safety\n6.2 PPE\n6.3 Safety of others\n\nEVIDENCE GUIDE\n\n--- PDF PAGE 63 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 61\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Read and interpreted work instructions to determine job\nrequirements\n1.2 Selected tools, equipment and materials in line with job\nrequirements\n1.1 Installed unit, equipment/components are sequentially done and\ncorrectly positioned and leveled in line with drawings, designs,\nspecifications and manufacturer's instructions\n1.2 Charged components and systems in accordance with system\ninstructions, specifications, industry codes and regulations\n1.5 Employed safe manual handling techniques in line with\nenterprise procedures\n1.6 Tested unit in line with the manufacturer's instructions\n1.7 Demonstrated compliance with safety regulation applicable to\nworksite operations\n1.8 Identified faults and problems and made necessary action to\nrectify\n1.9 Cleaned worksite and kept in a safe state in accordance with\nenterprise procedures\n1.10 Communicated interactively with others where applicable to\nensure safety and effective work operations\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n•\nProtective personal equipment/safety gears\n•\nHandling of tools, equipment and accessories\n•\nSafety signs and symbols\n•\nGood housekeeping\n2.2 TRADE MATHEMATICS/\n MENSURATION\n•\nLinear measurements\n•\nDimensions\n•\nRatio and proportion\n•\nUnit conversion\n2.3 BLUEPRINT READING AND PLAN SPECIFICATIONS\n•\nElectrical plans, symbols and abbreviations\n2.4 LEGISLATION\n•\nClean Air Act (RA 8749)\n•\nMontreal Protocol\n•\nOzone Depleting Refrigerants (ODRs)\n2.5 MATERIALS, TOOLS: USES AND SPECIFICATIONS\n•\nBolts and nuts\n•\nBrackets\n•\nRivets\n•\nWrenches\n•\nTubing tools\n•\nCutting tools\n\n--- PDF PAGE 64 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 62\n\n2.6 TRADE THEORY\n•\nBasic Electrical\n•\nBasic electronics\n•\nBasic automotive\n•\nAir-conditioning and refrigeration system\n-\nCompressor\n-\nEvaporator\n-\nCondenser\n-\nExpansion valve\n•\nFunction of air-conditioning/refrigerant components\n•\nBasic welding\n•\nPrinciples of air-conditioning and refrigeration\n-\nCompression\n-\nCondensing\n-\nExpansion\n-\nRevaporizing\n•\nInstallation procedures\n•\nSelection of unit and components\n•\nHeat transfer\n2.7 MAINTENANCE\n•\nPreventive Maintenance\n3. Underpinning\nSkills\n3.1 Interpreting plan, drawings, specifications and manuals\n3.2 Installing equipment, components and accessories\n3.3 Fabricating brackets\n3.4 Safe manual handling\n3.5 Reading and interpreting manufacturer’s manual\n3.6 Performing mathematical computation\n4. Resource\nImplications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Tools and equipment appropriate to construction processes\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n4.5 Air-conditioning and refrigeration equipment and\ncomponents\n4.6 Vehicle\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 65 ---\n__________________________________________________________________