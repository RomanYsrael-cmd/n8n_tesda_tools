        "source_text": "HVC311201\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nidentifying, interpreting, applying services to\nspecifications and manuals, and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and\naccessed as per job requirements\n1.2 Version and date of manual is checked to\nensure correct specification and procedure are\nidentified\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of specifications/\nmanuals are located in relations to the work to\nbe conducted\n2.2 Information and procedure in the manual are\ninterpreted in accordance to industry practices\n\n--- PDF PAGE 29 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 27\n\n3. Apply information in manual\n\n3.1 Manual is interpreted according to job\nrequirements\n3.2 Work steps are correctly identified in accordance\nwith manufacturer's specification\n3.3 Manual data is applied according to the given\ntask\n3.4 All correct sequencing and adjustments are\ninterpreted in accordance with information\ncontained on the manual or specifications\n4. Store manuals\n4.1 Manual or specification are stored appropriately\nto ensure prevention of damage, ready access\nand updating of information when required in\naccordance with company requirements\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Procedures, specifications and\nmanuals of instructions\n\nKinds of Manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 30 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 28\n\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance to industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Underpinning\nKnowledge\n\n2.1 Types of manuals used in HVAC/R sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning\nSkills\n3.1 Reading and comprehension skills required to identify and\ninterpret construction manuals and specifications\n3.2 Accessing information and data\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to HVAC/R sector\n\n--- PDF PAGE 31 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 29\n\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct Observation\n5.2 Questions/Interview\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n6. Context for\nAssessment\n6.1 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\nenvironment\n\nUNIT OF COMPETENCY: PERFORM MENSURATIONS AND\nCALCULATIONS\n\nUNIT CODE\n :"
