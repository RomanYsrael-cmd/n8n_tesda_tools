SDA assessment\nguidelines\n\n--- PDF PAGE 25 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 23\n\nUNIT OF COMPETENCY: INTERPRET TECHNICAL DRAWINGS AND\n PLANS\n\nUNIT CODE\n\n : HVC311202\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nanalyzing and interpreting symbols, data and work\nplan based on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Analyze signs, symbols and data\n\n1.1 Technical plans are obtained according to\njob requirements\n1.2 Signs, symbols and data are identified\naccording to job specifications\n1.3 Signs symbols and data are determined\naccording to classification or as\nappropriate in drawing\n\n2. Interpret technical drawings and\nplans\n\n2.1 Necessary tools, materials and equipment\nare identified according to the plan\n2.2 Supplies and materials are listed according\nto specifications\n2.3 Components, assemblies or objects are\nrecognized as required\n2.4 Dimensions are identified as appropriate to\nthe plan\n2.5 Specification details are matched with\nexisting/available resources in line with job\nrequirements\n2.6 Work plan is drawn following the\nspecifications\n\n--- PDF PAGE 26 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 24\n\n3. Apply freehand sketching\n\n3.1 Where applicable, correct freehand\nsketching is produced in accordance with\nthe job requirements\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Technical plans\n\nIncluding but not limited to:\n1.1 Electrical Plans\n1.2 Architectural Plans\n1.3 Welding Procedures Specifications (WPS)\n\n2. Work plan\n\n2.1 Job requirements\n2.2 Installation instructions\n2.3 Components instruction\n\n3. Classification\n\nIncluding but not limited to:\n3.1 Electrical\n3.2 Mechanical\n\n4. Drawing\n\n4.1 Drawing symbols\n4.2 Alphabet of lines\n4.3 Orthographic views\n-\nFront view\n-\nRight side view/left side view\n-\nTop view\n-\nPictorial\n4.4 Schematic diagram\n4.5 Electrical drawings\n4.6 Structural drawings\n4.7 Welding symbols\n\n--- PDF PAGE 27 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 25\n\n5. Tools and materials\n\nIncluding but not limited to:\n5.1 Compass\n5.2 Divider\n5.3 Rulers\n5.4 Triangles\n5.5 Drawing tables\n5.6 Computer\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data according\nto work plan, job requirements and classifications\n1.2 Identified tools and equipment in accordance with job\nrequirements\n1.3 Listed supplies and materials according to blueprint\nspecifications\n1.4 Drawn workplan following specifications\n1.5 Demonstrated ability to determine job specifications based on\nworking/technical drawing\n2. Underpinning\nKnowledge\n\n2.1 TRADE MATHEMATICS\n• Linear measurement\n• Dimension\n• Unit conversion\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n• Electrical, mechanical plan, symbols and abbreviations\n• Drawing standard symbols\n2.3 TRADE THEORY\n• Basic Technical Drawing\n• Types Technical Plans\n• Various Types of Drawings\n•\nNotes and Specifications\n3. Underpinning\nskills\n3.1 Interpreting drawing/orthographic drawing\n3.2 Interpreting technical plans\n3.3 Matching specification details with existing resources\n3.4 Following instructions\n3.5 Handling of drawing instruments\n\n--- PDF PAGE 28 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 26\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Drawings and specification relevant to task\n4.3 Materials and instrument relevant to proposed activity\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct Observation\n5.2 Questions/Interview\n5.3 Written test related to underpinning knowledge\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being undertaken\nwhether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n UNIT OF COMPETENCY: OBSERVE PROCEDURES, SPECIFICATIONS\n AND MANUALS OF INSTRUCTION\n\nUNIT CODE\n\n : HVC311201\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nidentifying, interpreting, applying services to\nspecifications and manuals, and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and\naccessed as per job requirements\n1.2 Version and date of manual is checked to\nensure correct specification and procedure are\nidentified\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of specifications/\nmanuals are located in relations to the work to\nbe conducted\n2.2 Information and procedure in the manual are\ninterpreted in accordance to industry practices\n\n--- PDF PAGE 29 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 27\n\n3. Apply information in manual\n\n3.1 Manual is interpreted according to job\nrequirements\n3.2 Work steps are correctly identified in accordance\nwith manufacturer's specification\n3.3 Manual data is applied according to the given\ntask\n3.4 All correct sequencing and adjustments are\ninterpreted in accordance with information\ncontained on the manual or specifications\n4. Store manuals\n4.1 Manual or specification are stored appropriately\nto ensure prevention of damage, ready access\nand updating of information when required in\naccordance with company requirements\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Procedures, specifications and\nmanuals of instructions\n\nKinds of Manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 30 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 28\n\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance to industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Underpinning\nKnowledge\n\n2.1 Types of manuals used in HVAC/R sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning\nSkills\n3.1 Reading and comprehension skills required to identify and\ninterpret construction manuals and specifications\n3.2 Accessing information and data\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to HVAC/R sector\n\n--- PDF PAGE 31 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 29\n\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct Observation\n5.2 Questions/Interview\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n6. Context for\nAssessment\n6.1 Competency assessment must 