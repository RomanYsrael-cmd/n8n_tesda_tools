        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires that the candidate:\n1.1 Classified materials, tools and equipment according to kind\n1.2 Cleaned workplace areas, materials, tools and equipment\nas per standard procedures\n1.3 Implemented systematize dispensing and retrieval of\nmaterials, tools and equipment\n1.4 Identified and described safety working practices relating to\nall tasks undertaken in the workplace\n1.5 Identified and selected appropriate equipment and safety\ndevices for particular workplace tasks and activities\n1.6 Interpreted hazard warnings and safety signs correctly and\ndescribed the application of these warnings and signs in the\nwork activities\n1.7 Workplace emergency first-aid procedures/treatment are\ncarried out in accordance with OHSA standards/legislation\nand enterprise procedures\n1.8 Responded/maintained accidents/incidents records in\naccordance with SOPs\n1.9 Followed security procedures/policies in accordance with\nenterprise practices and legislation\n1.10 Workplace kept in safe state in accordance with safety\n regulations\n2. Underpinning\nKnowledge\n\n2.1 Kinds and Uses of PPE\n2.2 Identification of Safety Signs and Symbols\n2.3 5S of Good Housekeeping\n2.4 General OH&S principles, responsibilities and legislations\n2.5 OH&S requirements in relations to work safety\n2.6 Environmental requirements relative to work safety\n2.7 Hazard identification and avoidance in the workplace\n2.8 First-aid treatment procedures\n2.9 Kinds of emergency situations – causes and how to deal\nwith different situations\n2.10 Kinds of injuries and effects\n2.11 Accident/hazard reporting\n2.12 Basic security procedures\n2.13 Uses of Manuals\n3. Underpinning\nSkills\n3.1 Wearing the appropriate PPE\n3.2 Reading skills required to interpret work instruction\n3.3 Identifying safety signs and symbols\n3.4 Practice of CPR, Mouth to Mouth Resuscitation and other\nFirst-Aid Treatment\n3.5 Problem solving in emergency situation\n3.6 Handling injured worker\n3.7 Coordination of work in times of emergency\n3.8 Fire fighting procedures and techniques\n3.9 Reporting/recording accidents and potential hazards\n\n--- PDF PAGE 55 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 53\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Work place\n4.2 Materials, tools and equipment relevant to the proposed\nactivity/task\n4.3 Safety signs\n4.4 Safety devices\n4.5 Accident reporting procedures\n4.6 First-aid materials and guidelines\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct observation while task is being undertaken\n5.2 Written test/questioning relevant to underpinning knowledge\n\nAssessment of underpinning knowledge and practical skills may\nbe combined\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group in accordance\nwith the approved industry OHSA regulations\n6.3 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 56 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 54\n\nUNIT OF COMPETENCY: DOCUMENT WORK ACCOMPLISHED\n\nUNIT CODE\n\n : HVC311205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ndocumenting work accomplished.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify forms and data\n1.1 Forms are selected based on the reports\nto be prepared\n1.2 Data are collected based on the reports\nto be prepared\n\n2. Prepare reports\n\n2.1 Reports are completed using standard\nform as per company procedures\n2.2 Reports provide details of work\ncompleted, further action to be taken and\nother details as per company procedures\n2.3 Reports are completed and submitted\nwithin specified time to the concerned\npersonnel/supervisor\n\n--- PDF PAGE 57 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 55\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Forms\n\n1.1 Warranty Paper Request\n1.2 Operating Log Sheet\n1.3 Requisition Forms\n\n2. Data\n\n2.1 Current draw\n2.2 Operating\n2.3 Unit specifications\n2.4 Records of work accomplished\n2.5 Further work required\n2.6 Spare parts used\n\n3. Reports\n\n3.1 Start-up commissioning Report\n3.2 Warranty Paper Request\n3.3 Turn-over Report\n3.4 Operating Log Sheet\n3.5 Service Report\n3.6 Trouble Call Report\n3.7 Requisition\n\n--- PDF PAGE 58 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 56\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nCompetency requires evidence that the candidate:\n1.1 Prepared reports used terminology and language\nappropriate to all users\n1.2 Prepared reports to include alternatives, views, approaches\nand other findings and recommendations for consideration\nby the supervisor\n1.3 Prepared reports are coherent and based on actual\nfindings/analysis/results\n1.4 Prepared reports are accomplished, completed as per\nstandard format and submitted within specified time to the\nconcerned supervisor\n2. Underpinning\nKnowledge\n2.1 SOURCES OF INFORMATION\n• Service manual\n• Parts catalogue\n• Service report\n• Price estimates/quotation\n• Warranty card\n• Types and Uses of Forms\n•Parts and Accessories\n3. Underpinning\nSkills\n3.1 Writing skills needed to complete prepared report forms\n3.2 Reading skills used to read manuals and specifications\n4. Resource\nImplications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Materials relevant to the proposed activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 59 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 57\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: INSTALL TRANSPORT AIR-CONDITIONING\n AND REFRIGERATION UNITS\n\nUNIT CODE :"
        },
        "source_text": "HVC7315201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nneeded to work safely in the workplace including\nsorting, cleaning and dispensing materials, tools\nand equipment, identifying and minimizing\nhazards, responding and recording accidents and\nfollowing basic security.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Sort materials, tools and\nequipment\n\n1.1 Materials, tools and equipment are\nclassified according to its kinds\n1.2 Appropriate areas for materials, tools and\nequipment are designated\n\n2. Clean workplace area,\nmaterials, tools and\nequipment\n\n2.1 Cleaning materials are identified and used\n as per procedure\n2.2 Workplace areas, materials, tools and\nequipment are cleaned as per company\npractices\n2.3 Workplace are in safe state in accordance\nwith safety regulations/company practices\n\n3. Systematize dispensing and\n retrieval of materials, tools\n and equipment\n\n3.1 Systems for requesting, borrowing and\n returning of materials, tools and equipment\n is in-place and implemented\n3.2 Forms used are completely filled-up and\n filed\n3.3 Borrowed tools, and equipment are\n returned to designated area\n3.4 Consumable materials are requested in\n exact quantity\n\n--- PDF PAGE 50 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 48\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n4. Identify and minimize/\neliminate hazards\n\n4.1 Hazards in the work area are recognized and\n reported to designated personnel and\n appropriate control actions are taken\n4.2 Workplace policies and procedures for\ncontrolling risks are established and followed\naccurately\n4.3 Workplace procedures for dealing with\nemergencies are followed whenever\nnecessary within the scope of responsibilities\nand competencies\n4.4 Safety signs and hazard warnings are\ndisplayed and observed at all times in line\nwith workplace health and safety regulations\n4.5 Equipment and safety devices/PPE are\nused/handled according to company or\nmanufacturer's procedures and guidelines\n4.6 Work areas are kept clean, free from obstacles\nand emergency exits are know and kept clear\nat all times\n4.7 Safe manual handling/fighting techniques and\nsafe equipment operation techniques are\nemployed at all times\n5. Respond and record\naccidents\n5.1 Workplace accidents are identified\n5.2 Workplace emergency first-aid procedures/\ntreatment are followed/carried out correctly in\naccordance with standards/regulations and\nenterprise procedures/policies\n5.3 Medical assistance/rescue is coordinated with\nconcerned personnel in line with organizational\npolicies\n5.4 Accident/incident records maintained in\naccordance with standard operating\nprocedures\n\n--- PDF PAGE 51 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 49\n\n6. Follow basic security\n6.1 Security policies/procedures are followed\naccording to enterprise practices and\nappropriate legislation\n6.2 Security related events are recorded/reported\non the relevant forms\n6.3 Staff are advised of enterprise security\nprocedures and correct methods of\nimplementation\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Hazards\n\nHazards that may be present in the workplace\ninclude but not limited to:\n1.1 Flammable materials\n1.2 Running machinery/equipment\n1.3 Toxic substances\n1.4 Debris\n1.5 Open flames\n1.6 Loose objects/fixtures\n1.7 Chemicals\n1.8 Electrical faults\n1.9 Hot metals\n\n2. Emergencies\n\nEmergencies may include but not limited to:\n4.9 Fire\n4.10 Explosion\n4.11 Spills\n4.12 Falls\n4.13 Electrocution\n4.14 Injuries caused by falling objects\n4.15 Injuries caused by sharp objects\n4.16 Injuries caused by wrong usage of tools\n\n--- PDF PAGE 52 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 50\n\n3. Safety signs, symbols and\nhazard warnings\n\nSafety signs and symbols include but not limited to:\n3.1 Industry recognized hazard warning signs and\nsafety symbols\n-\nDanger-High Voltage\n-\nUnauthorized Persons Keep Out\n-\nNo Smoking\n-\nPoisonous Gases\n-\nCaution - Men working on line wires\n3.2 Internationally recognized hazard warning signs\nand safety symbols\n\nVARIABLE\nRANGE\n\n4. Personal Protective\nEquipment (PPE)\n\nPPE may include but not limited to:\n\n4.17 Goggles\n4.18 Gas mask\n4.19 Working gloves\n4.20 Safety shoes\n4.21 Face shield\n4.22 Insulating mat\n4.23 Over-all apron\n4.24 Hard hat\n4.25 Safety belt\n4.26 Protective eyewear\n\n--- PDF PAGE 53 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 51\n\n5. First-aid Treatment\n\nFirst-aid treatment includes but is not limited to:\n5.1 CPR\n5.2 Mouth to mouth resuscitation\n5.3 Application of tourniquet\n5.4 Application of pressure to bleeding wounds or\ncuts\n5.5 First-aid treatment for burned victims\n6. Standards and Regulations\n6.1 Philippine Electrical Code\n6.2 Philippine OH&S Standards\n6.3 Building Code\n6.4 Philippine Environmental Standards\n6.5 Welding Procedures Specifications\n6.6 Clean Air Act\n\n7. Security policies\n\n7.1 Wearing of ID\n7.2 Logging-in and out\n7.3 Wearing of uniform\n7.4 Observance of safety/security signs and\nsymbols\n\n--- PDF PAGE 54 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 52\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires that the candidate:\n1.1 Classified materials, tools and equipment according to kind\n1.2 Cleaned workplace areas, materials, tools and equipment\nas per standard procedures\n1.3 Implemented systematize dispensing and retrieval of\nmaterials, tools and equipment\n1.4 Identified and described safety working practices relating to\nall tasks undertaken in the workplace\n1.5 Identified and selected appropriate equipment and safety\ndevices for particular workplace tasks and activities\n1.6 Interpreted hazard warnings and safety signs correctly and\ndescribed the application of these warnings and signs in the\nwork activities\n1.7 Workplace emergency first-aid procedures/treatment are\ncarried out in accordance with OHSA standards/legislation\nand enterprise procedures\n1.8 Responded/maintained accidents/incidents records in\naccordance with SOPs\n1.9 Followed security procedures/policies in accordance with\nenterprise practices and legislation\n1.10 Workplace kept in safe state in accordance with safety\n regulations\n2. Underpinning\nKnowledge\n\n2.1 Kinds and Uses of PPE\n2.2 Identification of Safety Signs and Symbols\n2.3 5S of Good Housekeeping\n2.4 General OH&S principles, responsibilities and legislations\n2.5 OH&S requirements in relations to work safety\n2.6 Environmental requirements relative to work safety\n2.7 Hazard identification and avoidance in the workplace\n2.8 First-aid treatment procedures\n2.9 Kinds of emergency situations – causes and how to deal\nwith different situations\n2.10 Kinds of injuries and effects\n2.11 Accident/hazard reporting\n2.12 Basic security procedures\n2.13 Uses of Manuals\n3. Underpinning\nSkills\n3.1 Wearing the appropriate PPE\n3.2 Reading skills required to interpret work instruction\n3.3 Identifying safety signs and symbols\n3.4 Practice of CPR, Mouth to Mouth Resuscitation and other\nFirst-Aid Treatment\n3.5 Problem solving in emergency situation\n3.6 Handling injured worker\n3.7 Coordination of work in times of emergency\n3.8 Fire fighting procedures and techniques\n3.9 Reporting/recording accidents and potential hazards\n\n--- PDF PAGE 55 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 53\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Work place\n4.2 Materials, tools and equipment relevant to the proposed\nactivity/task\n4.3 Safety signs\n4.4 Safety devices\n4.5 Accident reporting procedures\n4.6 First-aid materials and guidelines\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct observation while task is being undertaken\n5.2 Written test/questioning relevant to underpinning knowledge\n\nAssessment of underpinning knowledge and practical skills may\nbe combined\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group in accordance\nwith the approved industry OHSA regulations\n6.3 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 56 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 54\n\nUNIT OF COMPETENCY: DOCUMENT WORK ACCOMPLISHED\n\nUNIT CODE\n\n : HVC311205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ndocumenting work accomplished.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify forms and data\n1.1 Forms are selected based on the reports\nto be prepared\n1.2 Data are collected based on the reports\nto be prepared\n\n2. Prepare reports\n\n2.1 Reports are completed using standard\nform as per company procedures\n2.2 Reports provide details of work\ncompleted, further action to be taken and\nother details as per company procedures\n2.3 Reports are completed and submitted\nwithin specified time to the concerned\npersonnel/supervisor\n\n--- PDF PAGE 57 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 55\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Forms\n\n1.1 Warranty Paper Request\n1.2 Operating Log Sheet\n1.3 Requisition Forms\n\n2. Data\n\n2.1 Current draw\n2.2 Operating\n2.3 Unit specifications\n2.4 Records of work accomplished\n2.5 Further work required\n2.6 Spare parts used\n\n3. Reports\n\n3.1 Start-up commissioning Report\n3.2 Warranty Paper Request\n3.3 Turn-over Report\n3.4 Operating Log Sheet\n3.5 Service Report\n3.6 Trouble Call Report\n3.7 Requisition\n\n--- PDF PAGE 58 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 56\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nCompetency requires evidence that the candidate:\n1.1 Prepared reports used terminology and language\nappropriate to all users\n1.2 Prepared reports to include alternatives, views, approaches\nand other findings and recommendations for consideration\nby the supervisor\n1.3 Prepared reports are coherent and based on actual\nfindings/analysis/results\n1.4 Prepared reports are accomplished, completed as per\nstandard format and submitted within specified time to the\nconcerned supervisor\n2. Underpinning\nKnowledge\n2.1 SOURCES OF INFORMATION\n• Service manual\n• Parts catalogue\n• Service report\n• Price estimates/quotation\n• Warranty card\n• Types and Uses of Forms\n•Parts and Accessories\n3. Underpinning\nSkills\n3.1 Writing skills needed to complete prepared report forms\n3.2 Reading skills used to read manuals and specifications\n4. Resource\nImplications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Materials relevant to the proposed activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 59 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 57\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: INSTALL TRANSPORT AIR-CONDITIONING\n AND REFRIGERATION UNITS\n\nUNIT CODE :"
