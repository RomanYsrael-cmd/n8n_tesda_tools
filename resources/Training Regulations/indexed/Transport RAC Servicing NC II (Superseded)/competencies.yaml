        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list\nprepared and as per company standard operating\nprocedures\n1.3 Inspected issued materials and tools as per quantity and\njob specifications\n1.4 Tools provided with appropriate safety devices\n2. Underpinning\nKnowledge\n\n2.1 Types and uses of HVAC/R materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n\n3. Underpinning\nSkills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following Instructions\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant\nto the activities\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n6. Context for\nAssessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 25 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 23\n\nUNIT OF COMPETENCY: INTERPRET TECHNICAL DRAWINGS AND\n PLANS\n\nUNIT CODE\n\n :"
        },
        "source_text": "HVC713201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and\nattitudes in identifying, requesting and receiving\nconstruction materials and tools based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Identify materials\n\n1.1 Materials are listed as per job\nrequirements\n1.2 Quantity and description of materials\nconformed to the job requirements\n1.3 Tools and accessories are identified\naccording to job requirements\n\n2. Requisition materials\n\n2.1 Materials and tools needed are requested\naccording to the list prepared\n2.2 Request is done as per company\nstandard operating procedures\n2.3 Substitute materials and tools are provided\nwithout sacrificing cost and quality of the\nwork\n\n3. Receive and inspect\n materials\n\n3.1 Materials and tools issued are inspected\nas per quantity and specification\n3.2 Tools, accessories and materials checked\nfor damages according to enterprise\nprocedures\n3.3 Materials and tools are set aside to\nappropriate\nlocation\nnearest\nto\nthe\nworkplace\n\n--- PDF PAGE 23 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 21\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Materials and tools\n\n1.1 Air-conditioning\n1.2 Refrigeration\n\n2. Description of materials and\ntools\n\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n\n3. Company standard\nprocedures\n\n3.1 Job Order\n3.2 Requisition Slip\n3.3 Borrower Slip\n\n--- PDF PAGE 24 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 22\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list\nprepared and as per company standard operating\nprocedures\n1.3 Inspected issued materials and tools as per quantity and\njob specifications\n1.4 Tools provided with appropriate safety devices\n2. Underpinning\nKnowledge\n\n2.1 Types and uses of HVAC/R materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n\n3. Underpinning\nSkills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following Instructions\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant\nto the activities\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n6. Context for\nAssessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 25 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 23\n\nUNIT OF COMPETENCY: INTERPRET TECHNICAL DRAWINGS AND\n PLANS\n\nUNIT CODE\n\n :"
      }
