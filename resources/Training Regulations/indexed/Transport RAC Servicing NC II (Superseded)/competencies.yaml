ing and/or\nmanufacturer’s standard\n\n2. Troubleshoot air-conditioning\nand refrigeration systems\n\n2.1 Components are correctly identified in\nline with job requirements\n2.2 Faults are identified and diagnosed as per\nprocedures\n2.3 Faults are identified and diagnosed based\non instructions\n2.4 Operational function of each component is\ninspected and tested in accordance with\nthe standard operating procedures\n2.5 Components are repaired/replaced as per\nmanufacturer’s operation/repair manual\n2.6 Components are reconditioned and\noverhauled in accordance with workplace\nprocedures\n\n--- PDF PAGE 71 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 69\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n3. Test unit\n\n3.1 Unit is tested in line with manufacturer's\ninstructions\n3.2 Report on installation and testing of unit is\nprepared in line with enterprise\nprocedures\n3.3 Unit is tested for short and grounds in\nconformity with troubleshooting\nprocedures\n\n--- PDF PAGE 72 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 70\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Components\n\n1.1 Electrical controls\n-\nThermostat\n-\nTimer\n-\nRelay Thermo disc\n1.2 Compressor\n1.3 Compressor motor and relays\n1.4 Condenser\n1.5 Fan motors\n1.6 Refrigerant circuit\n1.7 Refrigerator defrost heater\n1.8 Evaporator fan and motor (no frost)\n1.9 Refrigerator door strip heater\n1.10 Liquid line strainer\n1.11 Metering device\n1.12 Pressure controls\n1.13 Thermostat\n1.14 Refrigerant piping\n1.15 Defrost controls\n1.16 Fan/fan motor\n1.17 Pipe insulation\n1.18 Door hinges\n1.19 Latches\n1.20 Cabinetry/Housing\n1.21 Expansion valve\n\n2. Tools and instrument\n\nTools\n2.1 Pliers\n2.2 Screwdriver\n2.3 Wrenches\n2.4 Wire stripper/crimper\nInstrument\n2.5 Multi-tester\n2.6 Clamp-ammeter\n2.7 Capacitor tester\n2.8 Electric leak detector\n2.9 Megger\n\n--- PDF PAGE 73 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 71\n\nVARIABLE\nRANGE\n\n3. PPE\n\nIncludes but not limited to:\n3.1 Mask\n3.2 Safety shoes\n3.3 Safety goggles\n3.4 Apron\n3.5 Gloves\n\n4. Test\n\n4.1 Insulation\n4.2 Resistance\n4.3 Mechanical\n4.4 Continuity\n4.5 Timing Sequence\n4.6 Leak\n\n--- PDF PAGE 74 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 72\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Supplied power in compliance with nameplate rating\nand/or manufacturer's standard\n1.2 Selected appropriate wiring diagrams, charts and manuals\nin line with equipment tested\n1.3 Tested transport air-conditioning and refrigerator electrical\nand mechanical controls and its components/accessories\nas per standard procedures\n1.3 Performed leak test as per standard procedures\n1.4 Reconditioned/overhauled transport air-conditioning and\nrefrigeration and its components in accordance with\nworkplace procedures\n1.7 Selected and used appropriate processes, tools, materials\nand equipment to carry out tasks\n1.8 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.9 Identified faults and problems and made necessary action\nto rectify in line with SOP\n1.10 Communicated effectively with others where applicable to\n ensure safe and effective work operations\n1.11Completed troubleshooting as to specifications\n\n--- PDF PAGE 75 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 73\n\n2. Underpinning\nKnowledge\n\n2.1 SAFETY PRACTICES\n• Personal protective\nequipment,\nclothing/safety gears\n• Electrical safety\n2.2 BLUEPRINT READING\nAND PLAN\nSPECIFICATION\n• Electrical plans, symbols\nand abbreviations\n2.3 MATERIALS AND\nTOOLS: USES AND\nSPECIFICATIONS\n• Electrical tools/equipment\n• Parts of refrigerant circuit\n2.4 TRADE THEORY\n• Basic electricity\n• Basic electronics\n• Basic automotive\n• Refrigeration principles\n• Instrumentation\n2.5 PROCESSES/\nPROCEDURES\n• Motor insulation testing\nprocedure\n• Wiring resistance testing\nprocedure\n• Mechanical testing\nprocedure\n• Compressor construction\n• Electrical system analysis\n• Mechanical system analysis\n2.6 LEGISLATION\n• Clean Air Act (R.A. 8749)\n• Montreal Protocol\n• Ozone Depleting\nRefrigerants (ODRs)\n\n--- PDF PAGE 76 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 74\n\n3. Underpinning\nSkills\n3.1 Interpreting plan and details (Schematic diagram)\n3.2 Preparing materials\n3.3 Proper handling of electrical tools/equipment\n3.4 Testing electrical system\n3.5 Testing mechanical system\n3.6 Brazing\n4. Resource\nImplications\n\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Tools and equipment appropriate to troubleshooting\nprocesses\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge (Written\nTest)\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 77 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 75\n\nUNIT OF COMPETENCY: RECOVER AND RECYCLE REFRIGERANT IN\nTRANSPORT REFRIGERATION SYSTEMS\n\nUNIT CODE : HVC723319\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nthe recovery and recycling of refrigerants in air-\nconditioning and refrigeration systems in the land and\nmarine transports. This includes evaluation of unit for\nrecovery/recycling, setting-up of equipment and\nperforming recovery and recycling of refrigerant\noperations.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Assess unit for recovery/\nrecycling\n1.1 Relevant data is gathered on unit to be\nrecovered/recycled as per procedures\n1.2 Appropriateness of unit for refrigerant\nrecovery/recycling is determined according to\nClean Air Act/Montreal Protocol requirements\nand manufacturer's specifications\n2. Set-up equipment for recovery/\nrecycling\n2.1. Equipment, instruments, tools and\naccessories are gathered based on job\nrequirements\n2.2. Equipment, instruments and tools are checked\nas per specifications\n2.3 Equipment, instruments, tools and accessories\nare set-up according to manufacturer's\nrecommendations\n\n3. Perform refrigerant recovery/\nrecycling\n3.1 Optimum recovery of refrigerant is determined\nin line with the Clean Air Act/ Montreal Protocol\n3.2 Refrigerants recovery/recycling is performed\naccording to manufacturer's\nrecommendations and Clean Air Act/Montreal\nProtocol\n3.3 Recovered refrigerant in the tank is identified\nand labeled as per recycling procedures\n3.4 Contaminants are removed from the system\nbased on procedures\n3.5 Recovery/recycling machine is operated and\nmaintained in accordance with manufacturer's\nrecommendations\n3.6 Safety measures in recovery/recycling of\nrefrigerants are observed in accordance with\nindustry requirements\n\n--- PDF PAGE 78 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 76\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Unit\nTransport air-conditioning and refrigeration\nunits refer to:\n1.1 Land transport (engine drive, e.g. cars,\n trucks, refrigerated vans, etc.)\n1.2 Marine/sea transport (vessels)\n\n2. Equipment\n\n2.1 Recovery machine\n2.2 Recycling machine\n\n3. Instruments\n\n3.1 Refrigerant identifier\n3.2 Acid test kit\n\n4. Tools\n\n4.1 System analyzer\n4.2 Spanner\n4.3 Set of wrenches\n4.4 Weighing scale\n4.5 Marker\n4.6 Masking tape\n\n5. Optimum recovery\n\n5.1 Pressure reading of 30 in Hg/\n 760mm Hg.\n\n6. Manufacturer's\nrecommendations\nIncludes but not limited to:\n6.1 Equipment operator's manual\n6.2 Equipment service manual\n6.3 Nameplate data\n\n7. Contaminants\n\n7.1 Acid\n7.2 Moisture\n7.3 Foreign particles e.g. chips, burr\n7.4 Non-condensable gases\n\n--- PDF PAGE 79 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 77\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nCompetency assessment requires evidence that the\ncandidate:\n1.1 Performed refrigerant recycling, complying with\nmanufacturer's recommendations, environmental\nregulations, safety precautions and as specified in the\nClean Air Act/Montreal Protocol\n1.2 Achieved optimum refrigerant recovery following standard\nprocedures/manufacturer's recommendations\n1.3 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.4 Selected and used appropriate to the processes, tools,\nmaterials and equipment to carry out tasks\n1.5 Identified faults and problems and took necessary action\nto rectify\n1.6 Communicated effectively with others where applicable to\nensure safe and effective work operations\n\n--- PDF PAGE 80 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 78\n\n2. Underpinning\nKnowledge\n2.1 Recovery/recycling principles, procedures and standards\n2.2 Ozone-layer depletion and its effects\n2.3 Montreal Protocol and Clean Air Act (RA 8749)\n2.4 Recovery/recycling equipment specifications, parts and\nuses\n2.5 Refrigerant types and specifications\n2.6 Safety precautions in handling refrigerants\n2.7 Refrigerant identifier instrument, specification, parts and\nuses\n2.8 Trade Theory\n-\nBasic electrical\n-\nAir-conditioning and refrigeration\n-\nCompressor\n-\nCondenser\n-\nExpansion valve\n-\nLubricant\n-\nPrinciples of Refrigeration\n-\nCompression\n-\nCondensing\n-\nExpansion\n-\nRevaporizing\n-\nBasic electronics\n-\nBasic automotive\n-\nElectrical and mechanical system of A/C\n-\n Heat transfer\n\n3. Underpinning\nSkills\n\n3.1 Installing and operating recovery and recycling machine\n3.2 Interpreting manufacturer and equipment data\n3.3 Estimating cost of recovery/recycling\n3.4 Maintaining recovery/recycling machine\n3.5 Use of refrigerant identifier\n4. Resource\nImplications\nThings necessary to conduct method of assessment:\n4.1 Manufacturer's manual\n4.2 Work place location\n4.3 Materials, tools and equipment relevant to the proposed\nactivity\n4.4 Air-conditioning/refrigeration unit\n\n--- PDF PAGE 81 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 79\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\nUNIT OF COMPETENCY: REPAIR AND RETROFIT TRANSPORT AIR-\nCONDITIONING AND REFRIGERATION SYSTEMS\nAND ITS ACCESSORIES\n\nUNIT CODE : HVC723320\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ntroubleshooting, repairing and retrofitting air-\nconditioning and refrigeration systems in the land and\nmarine transports. It also includes evaluating the\ncondition of the existing transport air-conditioning and\n\n--- PDF PAGE 82 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 80\n\nrefrigeration system, preparing materials,\nrepairing/replacing faulty transport air-conditioning\nand refrigeration system and its components,\nundertaking preventive maintenance and retrofitting of\ntransport air-conditioning and refrigeration system\nfrom CFC to HCFC/HC refrigerants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Evaluate condition of existing air\nconditioning system in PACU/CRE\n\n1.1 Safe working practices are observed\nbased on safety regulations\n1.2 Visual inspection of all air conditioning\ncomponents is performed and any\nsigns of damage, lubricant leaks and\ncorrosion are reported to the\nsupervisor\n1.3 Air conditioning system is operated to\ncheck that the system performs on R-\n12 as intended by the manufacturer,\nand any malfunction is reported to the\nsupervisor\n1.4 Leak test is performed immediately\nafter the air conditioning system has\nbeen operating for 10 to 15 minutes\nusing a compatible leak detector, and\nany leaks found are repaired\naccording to manufacturer’s\nspecifications\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n--- PDF PAGE 83 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 81\n\n2. Prepare for servicing/repairing\ntransport air-conditioning and\nrefrigeration system\n\n2.1 Work instructions are read and\ninterpreted based on job requirements\n2.2 Electrical materials are prepared as\nper job requirements and are checked\nfor damage\n2.3 Appropriate PPE is selected in line with\nthe job requirements\n2.4 Work safety is observed according to\nenterprise regulations\n\n3. Prepare air conditioning system for\nretrofitting\n3.1 Safe working practices are observed\nthroughout the task\n3.2 Suitable tools and equipment are\nselected and used according to manual\n3.3 Faults identified from a visual\ninspection and an operational check\nare rectified according to\nmanufacturer's specifications\n3.4 Amount of oil in the compressor is\noptimized by running the R-12 air\nconditioning system with the blower on\nhigh speed\n3.5 All R-12 refrigerant is recovered from\nthe vehicle's air conditioning system\nusing compatible refrigerant recovery\nand recycling equipment and in\naccordance with legislation and\nmanufacturer's recommendations\n3.6 Air conditioning system is evacuated\nto remove as much R-12 as possible\nfrom the residue mineral oil\n3.7 Mineral oil is removed from the\nsystem following compressor and\nmanufacturer's recommendations\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n--- PDF PAGE 84 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 82\n\n4. Convert air conditioning system for\nHCFC/HC\n\n4.1 Safe working practices are observed\nthroughout the task\n4.2 Suitable tools and equipment are\nselected and used compatible\ncomponents\n4.3 Non-compatible components are\nreplaced following compressor and\nvehicle manufacturer's\nrecommendations\n4.4 Quick connect service ports are\ninstalled per procedures\n4.5 Air conditioning system is evacuated\nfollowing the procedure outlined in the\nrecovery equipment instructions\n4.6 Specified amount of compatible oil\n(Polyalkylene Glycol [PAG oil] or ester\noil) is installed following compressor\nand manufacturer's recommendations\nand instructions\n4.7 Air conditioning system is charged\nfollowing compressor and vehicle\nmanufacturer's guidelines, and in\naccordance with legislation and codes\nof practice\n4.8 Retrofit labels are installed as per\nprocedure\n\n--- PDF PAGE 85 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 83\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n5. Undertake preventive maintenance\ncheck/adjustment\n\n5.1 Inspection and testing on transport air-\nconditioning and refrigeration\ncomponents is carried out with\nappropriate test equipment in\naccordance with air-conditioning /\nrefrigeration principles, procedures and\nsafety requirements\n5.2 Preventive maintenance is performed\nin accordance with the manufacturer's\nspecifications\n\n6. Test air conditioning system\noperation\n\n6.1 Safe working practices are observed\nas per safety regulations\n6.2 Suitable tools and HCFC/HC\ncompatible equipment are selected\nand used as per procedures and\nvehicle manufacturer's specifications\n6.3 Air-conditioning system is checked\nbased on procedures\n6.4 Any leaks located as a result of leak\n detection tests are sealed in\n compliance with compressor and\n manufacturer's instructions\n6.5 Air-conditioning system is tested and\noperated within compressor and\nmanufacturer's acceptable limits of\ntemperatures and pressures\n\n7. Return to service air-conditioning\nand refrigeration equipment and its\naccessories\n\n7.1 Components are reassembled, tested\nand assessed for correct operation\nagainst specification\n7.2 Assembly and testing procedures are\nfollowed based on manual\n7.3 Maintenance records/service reports\nare recorded and completed in\naccordance with standard operating\nprocedures\n\n--- PDF PAGE 86 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 84\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Electrical materials\n\n1.1 Electrical tape\n1.2 Wire connector\n1.3 Wires and cables\n1.4 Breaker\n1.5 Terminal clips/plugs\n\n2. Safety precautions\n\n2.1 Personal safety\n2.2 Safety of others, equipment\n\n3. Leaks\n\n3.1 Leaks on pipings and around\n compressor, evaporator and condenser\n\n4. Evacuation\n\n4.1 Minimum of 30minutes, steady vacuum\nof 29 in. Hg (mercury) unless otherwise\nspecified by the compressor and\nmanufacturer\n\n5. Mineral oil removal\n\n5.1 Removing and draining components,\n flushing using R-141\n\n6. Components\n\n6.1 Compressor\n6.2 Condenser\n6.3 Evaporator\n6.4 Liquid Line Strainer\n6.5 Metering Device\n6.6 Pressure Controls\n6.7 Thermostat\n6.8 Refrigerant Piping\n6.9 Defrost Controls\n6.10 Fan/Fan Motor\n6.11 Pipe Insulation\n6.12 Door Hinges\n6.13 Latches\n6.14 Cabinetry/Housing\n6.15 Expansion valve\n\n--- PDF PAGE 87 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 85\n\nVARIABLE\nRANGE\n\n7. Non-compatible components\n\n7.1 Filter\n7.2 Compressor\n7.3 Desiccant\n7.4 Receiver-drier (accumulator-drier)\n7.5 Pressure switches and controls\n\n8. Retrofit label\n\n8.1 Name and address of company (or\n individual) performing retrofit service\n8.2 Date service performed\n8.3 Type and amount of refrigerant\n8.4 Type and amount of lubricant\n8.5 Warning to use only refrigerant and the\n specified oil\n\n9. Retrofitting procedures\n\n9.1 CFCs to HCFCs/HC\n\n--- PDF PAGE 88 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 86\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual inspection of all air-conditioning\ncomponents\n1.2 Selected types of electrical tools/instrument and wiring\ndevices, equipment and materials in accordance with\nspecification and job requirement\n1.3 Identified and diagnosed faults in accordance with the\nstandard operating procedures\n1.4 Reported and repaired any signs of damage, lubricant\nleaks and corrosion according to manufacturer's\nspecifications\n1.5 Repaired/replaced transport air-conditioning and\nrefrigeration and its components as per manufacturer's\noperation/repair manual\n1.6 Converted air-conditioning system with appropriate\nrefrigerants following standard operating procedures\n1.7 Air-conditioning system functioned within compressor and\nmanufacturer's acceptable limits of temperatures and\npressures\n1.8 Tested air-conditioning system operation according to\nmanufacturer's specifications and standard operating\nprocedures\n1.9 Performed preventive maintenance in accordance with\nmanufacturer's specifications\n1.10 Recorded and completed maintenance/service reports in\naccordance with standard operating procedures\n1.11 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.12 Communicated interactively with others where applicable\nto ensure safe and effective work operations\n\n--- PDF PAGE 89 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 87\n\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n• Protective personal\nequipment/safety gear\n• Safe handling of tools and\nequipment\n• Proper handling of\nrefrigerants/pressure\ntesting and welding gases\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 BLUEPRINT READING\nAND PLAN\nSPECIFICATION\n• Electrical wiring control\ndiagram\n• Mechanical plan/symbols\nand abbreviations\n• Electrical plans, symbols\nand abbreviations\n\n2.3 TRADE THEORY\n• Basic electricity\n• Basic electronics\n• Basic automotive\n• Basic refrigeration cycle\n• Fundamentals of control\n• Principle and operation of\nauxiliary parts of\nrefrigeration system\n• Principle and operation of\nair-conditioning and\nrefrigeration\n• Principle and operation of\ninterlocking control\n• Fan characteristics\n• Electrical code\n• Air-conditioning and\nrefrigeration system\n• Basic welding\n• Installation procedures\n• Selection of unit and\ncomponents\n• Heat transfer\n\n--- PDF PAGE 90 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 88\n\n2.4 TOOLS/MATERIALS:\nUSES AND\nSPECIFICATIONS\n• Types of electrical controls\n• Types of expansion\nvalves/metering devices\n• Types of compressor\nmotor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of filter drier\n• Types of filter/strainer\nelement\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic\ncontractor\n• Types of unloader\n• Types of compressor\n• Types of pump\n• Phase sequence tester\n2.5 TRADE MATHEMATICS/\nMENSURATION\n• Linear measurements\n• Dimensions\n• Ratio and proportion\n• Unit conversion\n2.6 LEGISLATION\n• Clean Air Act (RA 8749)\n• Montreal Protocol\n• Ozone Depleting\nRefrigerants (ODRs)\n2.7 MAINTENANCE\n• Preventive Maintenance\n2.8 PROCESSES/\n PROCEDURES\n• Electrical control calibration\nprocedures\n• Repair/replace/assemble\ncompressor procedure\n• Repair/replace defective\ncondenser procedure\n• Replace liquid line strainer\nelement procedure\n• Replace metering device\nprocedure\n• Replace pressure controls\nprocedure\n• Replace thermostat\nprocedure\n• Repair/replace refrigerant\npiping procedure\n• Brazing procedure\n• Refrigerant recovery\nprocedures\n• Follow the general\nprocedure for checking-out\ntransport air-conditioning\nand refrigeration control\n• Pump down procedures\n• Replace defrost controls\nprocedure\n• Repair/replace fan/fan\nmotor procedures re:\nevaporator condenser\n• Refrigerant charging\nprocedures\n• Leak testing procedures\n• Mechanical testing\n• Latest update on\nrefrigerant types and usage\nin relation to environmental\nissues\n\n--- PDF PAGE 91 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 89\n\n3. Underpinning\nSkills\n\n3.1 Reading and interpreting schematic diagram, plans,\ndrawings, specifications and manuals\n3.2 Installing equipment, components and accessories\n3.3 Fabricating brackets\n3.4 Using electrical tools and materials properly\n3.5 Handling manual safely\n3.7 Testing electrical/mechanical\n3.8 Troubleshooting technique\n3.9 Replacing defective parts\n3.10 Preparing reports\n3.11 Reading and interpreting manufacturer's manual\n3.12 Performing mathematical computation and calculations,\nincluding linear measurements, ratios and unit conversion\n4. Resource\n Implications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Air-conditioning and refrigeration system\n4.3 Refrigerant\n4.4 Materials, tools and equipment appropriate to\nrepairing/retrofitting processes\n4.5 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 92 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 90\n\nUNIT OF COMPETENCY: PERFORM TESTING AND COMMISSIONING FOR\nTRANSPORT AIR-CONDITIONING AND\nREFRIGERATION\n\nUNIT CODE : HVC723321\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nperforming testing and commissioning air-conditioning\nand refrigeration systems in the land and marine\ntransports.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Prepare for commissioning\nrefrigeration and air-\nconditioning systems\n\n1.1 Work instructions are read and interpreted\nas per job requirements\n1.2 Tools and equipment are selected in\naccordance with job requirements\n1.3 Pre-commissioning checks are completed\nand complied with procedures laid down in\nsystem documents\n1.4 Commissioning method and program are\nproduced and recording sheets are\nprepared in accordance with standard\noperating procedures\n1.5 Flow rates are confirmed for the system to\nbe commissioned\n1.6 Commissioning instruments are\nprocured and calibrated in accordance\nwith system documents\n1.7 PPE is selected in line with job\nrequirements\n\n--- PDF PAGE 93 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 91\n\n2. Assess refrigeration and air-\nconditioning system operation\n\n2.1 Systems are checked safely in\naccordance with standard operating\nprocedures\n2.2 Pressures and temperature are correctly\ndetermined and recorded in accordance\nwith standard operating procedures\n2.3 Faults are correctly isolated to component\nlevel and appropriate corrective action\napplied\n2.4 Refrigeration and air-conditioning systems\nis checked for leaks and contamination\nsafely in accordance with standard\noperating procedures\n\n--- PDF PAGE 94 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 92\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n3. Recover refrigerant and air-\nconditioning system\n3.1 Refrigerant system is evacuated using\nappropriate techniques, tools and\nequipment and in accordance with\nstandard operating procedures, codes\nand regulations\n3.2 Refrigerant evacuated from the\nrefrigeration and air-conditioning systems\nis contained/ disposed of in accordance\nwith standard operating procedures\n3.3 Quantities of refrigerant reclaimed from\nrefrigeration and air-conditioning systems\nand those that are released into the\natmosphere are recorded/ reported in\naccordance with standard operating\nprocedures\n4. Charge the refrigeration and\nair-conditioning system\n4.1 Systems are charged with the correct\nrefrigerant to system specifications and in\naccordance with standard operating\nprocedures and as per manufacturer's\ninstruction manual\n4.2 Appropriate lubricating oil is added to the\nrefrigeration and air-conditioning systems\nin accordance with standard operating\nprocedures\n4.3 Refrigeration and air-conditioning systems\nis checked for leaks using appropriate\ntools, techniques and equipment in\naccordance with standard operating\nprocedures\n5. Perform pre-start checks\n5.1 Electrical, pneumatic and other controls\nare tested and set to meet specified and\nsafety performance requirements\n5.2 Electrical systems are checked in\ncompliance with performance and safety\nrequirement\n5.3 Motor, motor ratings and pump rotation\ndirections are verified based on\nprocedures\n5.4 Fluid flows are tested and balanced as per\nprocedures\n5.5 Noise and vibration levels are confirmed\nwithin limits of specifications\n\n--- PDF PAGE 95 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 93\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Unit\n\nLand and marine transports may include but is\nnot limited to:\n1.1 Land transport (engine driven, e.g. cars,\n trucks, refrigerated vans, etc.)\n1.2 Marine/sea transport (vessels)\n\n2. System documents\n\n2.1 Operating and maintenance procedures\n2.2 Instructions for the system\n2.3 Manufacturer's specifications\n2.4 Company-prepared operating and\n maintenance manuals\n\n3. Commissioning instruments\n\nIncluding but is not limited to:\n3.1 System analyzer\n3.2 Manifold gauge\n3.3 Clampmeter\n3.4 Multi-tester\n3.5 Psychrometer\n3.6 Thermometer\n3.7 Electronic leak detector\n\n--- PDF PAGE 96 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 94\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nCompetency requires evidence that the candidate:\n1.1 Checked refrigeration and air-conditioning system in\naccordance with standard operating procedures, relevant\ncodes and refrigeration\n1.2 Correctly isolated faults to component level applied\nappropriate corrective action\n1.3 Checked refrigeration and air-conditioning for leaks and\ncontamination safely using appropriate tools, techniques\nand equipment in accordance with standard operating\nprocedures\n1.4 Recorded/reported recovered refrigerant from\nrefrigeration and air-conditioning systems are in\naccordance with standard operating procedures and\nrelevant codes and refrigeration\n1.5 Charged systems with the correct refrigerant to system\nspecifications and in accordance with standard operating\nprocedures and as per manufacturer's instruction manual\n1.6 Tested and set electrical, pneumatic and other controls to\nmeet specified and safety performance requirements\n1.7 Identified faults and problems and made necessary action\nto rectify\n1.8 Communicated interactively with others where applicable\nto ensure safe and effective work operations\n1.9 Completed performing commissioning and start-up\nprocedures in accordance with the standard procedures\n\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n• Protective personal equipment/safety gears\n• Safe handling of tools and equipment\n• Proper handling of refrigerants\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n• Electrical wiring control diagram\n•\nMechanical plan/symbols and abbreviation\n\n--- PDF PAGE 97 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 95\n\n2.3 TOOLS/MATERIALS:\nUSES AND\nSPECIFICATIONS\n• Types of electrical controls\n• Types of expansion valve\n• Types of compressor motor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of filter drier\n• Types of filter/strainer\nelement\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic\ncontactor\n• Types of unloader\n• Types of compressor\n• Types of pump\n2.4 MAINTENANCE\n• Preventive maintenance\n2.5 TRADE THEORY\n• Basic electricity\n• Basic electronics\n• Basic automotive\n• Basic refrigeration cycle\n• Fundamentals of\nrefrigeration and control\n• Interlocking control\nsequence\n• Fundamentals of piping\n• Fan characteristics\n• Pump principles\n• Cooling tower principles\n\n2.6 PROCESSES/\nPROCEDURES\n• Compressor test\nprocedures\n• Power supply test\nprocedures\n• Cooler/evaporator test\nprocedures\n• Condensing unit test\nprocedures\n• Pump test procedures\n• Cooling tower test\nprocedures\n• Thermostatic expansion\nvalve test procedures\n• Automatic expansion valve\ntest procedures\n• Electrical control test\nprocedures\n• Leak testing procedure\n(for refrigeration circuit\nand water piping)\n• Pressure testing\nprocedure\n• Vacuum testing\nprocedure\n• Refrigerant charging\nprocedure\n• Pumpdown procedure\n• Crank case heater test\nprocedures\n• Unloading test\nprocedures\n• Start-up procedure\n2.7 LEGISLATION\n• Clean Air Act (RA 8749)\n• Montreal Protocol\n• Ozone Depleting\nRefrigerants (ODRs)\n\n--- PDF PAGE 98 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 96\n\n--- PDF PAGE 99 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 97\n\n3. Underpinning\nSkills\n\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 Performing work safety\n3.4 Using electrical tools and testing equipment properly\n3.5 Electrical testing\n3.6 Mechanical testing\n3.7 Communicating effectively\n4. Resource\nImplications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Tools and equipment appropriate to performing\ncommissioning on the refrigeration and air-conditioning\nsystems\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 100 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 98"
