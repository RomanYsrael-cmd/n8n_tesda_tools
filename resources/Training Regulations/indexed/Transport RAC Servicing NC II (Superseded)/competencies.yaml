        "source_text": "HVC713202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\n preparing materials, tools and equipment, lay-outing\n dimensions and performing basic benchwork based\n on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Prepare materials, tools and\nequipment\n\n1.1 Work plan is interpreted to determine job\nrequirements\n1.2 Materials, tools and equipment are identified\nand prepared according to job requirements\n1.3 Materials are checked according to the required\nspecifications\n1.4 Tools and equipment conditions are checked\nfollowing the standard operating procedures\n(SOPs)\n\n2. Lay-out and mark\ndimensions/features on\nworkplace\n\n2.1 Metallic and non-metallic materials are selected\naccording to the requirements specified in the\nblueprint\n2.2 Dimensions/features are laid-out/marked\naccording to job specifications/blueprint and\nwithin the required tolerance\n2.3 Dimensions are checked against the actual\nwork plan\n\n--- PDF PAGE 37 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 35\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n3. Perform required benchworks\n\n3.1 Work instructions are followed to ensure work\nsafety\n3.2 Benchworks are performed applying\nknowledge on safety procedures and according\nto job requirements\n3.3 Workpieces are clamped in workholding\ndevice to avoid damage and accidents\n3.4 Work pieces are cut, chipped or filed according\nto required measurements, tolerance specified\nin the blueprint and free from burrs and sharp\nedges\n3.5 Drilling is performed according to recommended\nsequence and specifications\n3.6 Proper usage of materials, tools and equipment\nis observed\n3.7 Appropriate PPE and safety procedures are\napplied\n3.8 Worksite is cleaned and cleared of all debris and\nleft in safe state in accordance with OHS\nregulations\n\n--- PDF PAGE 38 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 36\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Work plan\n\n1.1 Job requirements\n1.2 Schedule of work\n\n2. Materials\n\n2.1 Steel brackets\n2.2 Grinding disc\n2.3 Drill bit\n2.4 Flat/angle bars\n2.5 Fastening screws\n2.6 Masonry\n\n3. Tools and equipment\n\n3.1 Portable grinder\n3.2 Hacksaw\n3.3 File\n3.4 Markers\n3.5 Screw drivers\n3.6 Ballpen hammer\n3.7 L-square/steel square\n3.8 Steel rule\n3.9 Measuring tools\n3.10 PPE\n3.11 Portable electric drill\n3.12 Bench wire\n3.13 Tri-square\n\n4. Metallic materials\n\n4.1 Mild steel plate\n4.2 Flat bar\n4.3 Square bar\n4.4 Angle bar\n4.5 Round bar\n4.6 G.I. sheet\n4.7 B.I. sheet\n4.8 Beam\n\n--- PDF PAGE 39 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 37\n\nVARIABLE\nRANGE\n\n5. Non-metallic materials\n\n5.1 PVC\n5.2 Rubber\n5.3 Wood\n5.4 Fiber glass\n5.5 Plastic\n5.6 Ceramics\n\n6. Dimensions\n\n6.1 Measurements\n6.2 Tolerances\n\n7. Work instructions\n\n7.1 Work plan\n7.2 Blueprint\n7.3 Manufacturer’s specifications\n\n8. Personal Protective Equipment\n(PPE)\n\n8.1 Safety shoes\n8.2 Gloves\n8.3 Goggles\n\n9. Benchworks\n\n9.1 Cutting\n9.2 Filing\n9.3 Drilling\n\n10. Workholding device\n\n10.1 Machine vise\n10.2 Pliers\n10.3 Vise grip\n\n11. Manual\n\n11.1 Procedures manual\n11.2 Instructional manual\n\n--- PDF PAGE 40 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 38\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Interpreted work plan to determine job requirements\n1.2 Identified and prepared supplies, materials, tools and\nequipment in accordance with job requirements\n1.3 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.4 Laid-out and checked dimensions in accordance with job\nrequirements and within the tolerances\n1.5 Followed work instructions to ensure safety\n1.6 Performed benchworks in accordance with job\nrequirements\n1.7 Cleaned worksite and left in safe state in accordance\nwith OHSA regulations\n2. Underpinning\nknowledge\n\n2.1 TRADE MATHEMATICS\n• Linear measurements\n• Dimensions\n• Unit conversion\n2.2 TRADE THEORY\n• Basic Benchwork\n2.3 SAFETY PRACTICES\n• PPE\n• Handling of tools, supplies and equipment\n•\nGood housekeeping\n3. Underpinning\nskills\n3.1 Performing basic benchwork\n3.2 Communicating effectively\n3.3 Work safety\n3.4 Preparing materials, tools and equipment\n3.5 Proper handling of tools and equipment\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Work plan\n4.3 Materials, tools and equipment relevant to the proposed\nactivity/task\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written/questioning related to underpinning knowledge\n\n--- PDF PAGE 41 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 39\n\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\nUNIT OF COMPETENCY: PERFORM BASIC ELECTRICAL WORKS\n\nUNIT CODE\n\n :"
