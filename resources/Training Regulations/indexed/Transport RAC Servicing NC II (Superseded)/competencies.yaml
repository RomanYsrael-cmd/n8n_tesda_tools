        "source_text": "HVC723320\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ntroubleshooting, repairing and retrofitting air-\nconditioning and refrigeration systems in the land and\nmarine transports. It also includes evaluating the\ncondition of the existing transport air-conditioning and\n\n--- PDF PAGE 82 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 80\n\nrefrigeration system, preparing materials,\nrepairing/replacing faulty transport air-conditioning\nand refrigeration system and its components,\nundertaking preventive maintenance and retrofitting of\ntransport air-conditioning and refrigeration system\nfrom CFC to HCFC/HC refrigerants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Evaluate condition of existing air\nconditioning system in PACU/CRE\n\n1.1 Safe working practices are observed\nbased on safety regulations\n1.2 Visual inspection of all air conditioning\ncomponents is performed and any\nsigns of damage, lubricant leaks and\ncorrosion are reported to the\nsupervisor\n1.3 Air conditioning system is operated to\ncheck that the system performs on R-\n12 as intended by the manufacturer,\nand any malfunction is reported to the\nsupervisor\n1.4 Leak test is performed immediately\nafter the air conditioning system has\nbeen operating for 10 to 15 minutes\nusing a compatible leak detector, and\nany leaks found are repaired\naccording to manufacturer’s\nspecifications\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n--- PDF PAGE 83 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 81\n\n2. Prepare for servicing/repairing\ntransport air-conditioning and\nrefrigeration system\n\n2.1 Work instructions are read and\ninterpreted based on job requirements\n2.2 Electrical materials are prepared as\nper job requirements and are checked\nfor damage\n2.3 Appropriate PPE is selected in line with\nthe job requirements\n2.4 Work safety is observed according to\nenterprise regulations\n\n3. Prepare air conditioning system for\nretrofitting\n3.1 Safe working practices are observed\nthroughout the task\n3.2 Suitable tools and equipment are\nselected and used according to manual\n3.3 Faults identified from a visual\ninspection and an operational check\nare rectified according to\nmanufacturer's specifications\n3.4 Amount of oil in the compressor is\noptimized by running the R-12 air\nconditioning system with the blower on\nhigh speed\n3.5 All R-12 refrigerant is recovered from\nthe vehicle's air conditioning system\nusing compatible refrigerant recovery\nand recycling equipment and in\naccordance with legislation and\nmanufacturer's recommendations\n3.6 Air conditioning system is evacuated\nto remove as much R-12 as possible\nfrom the residue mineral oil\n3.7 Mineral oil is removed from the\nsystem following compressor and\nmanufacturer's recommendations\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n--- PDF PAGE 84 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 82\n\n4. Convert air conditioning system for\nHCFC/HC\n\n4.1 Safe working practices are observed\nthroughout the task\n4.2 Suitable tools and equipment are\nselected and used compatible\ncomponents\n4.3 Non-compatible components are\nreplaced following compressor and\nvehicle manufacturer's\nrecommendations\n4.4 Quick connect service ports are\ninstalled per procedures\n4.5 Air conditioning system is evacuated\nfollowing the procedure outlined in the\nrecovery equipment instructions\n4.6 Specified amount of compatible oil\n(Polyalkylene Glycol [PAG oil] or ester\noil) is installed following compressor\nand manufacturer's recommendations\nand instructions\n4.7 Air conditioning system is charged\nfollowing compressor and vehicle\nmanufacturer's guidelines, and in\naccordance with legislation and codes\nof practice\n4.8 Retrofit labels are installed as per\nprocedure\n\n--- PDF PAGE 85 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 83\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n5. Undertake preventive maintenance\ncheck/adjustment\n\n5.1 Inspection and testing on transport air-\nconditioning and refrigeration\ncomponents is carried out with\nappropriate test equipment in\naccordance with air-conditioning /\nrefrigeration principles, procedures and\nsafety requirements\n5.2 Preventive maintenance is performed\nin accordance with the manufacturer's\nspecifications\n\n6. Test air conditioning system\noperation\n\n6.1 Safe working practices are observed\nas per safety regulations\n6.2 Suitable tools and HCFC/HC\ncompatible equipment are selected\nand used as per procedures and\nvehicle manufacturer's specifications\n6.3 Air-conditioning system is checked\nbased on procedures\n6.4 Any leaks located as a result of leak\n detection tests are sealed in\n compliance with compressor and\n manufacturer's instructions\n6.5 Air-conditioning system is tested and\noperated within compressor and\nmanufacturer's acceptable limits of\ntemperatures and pressures\n\n7. Return to service air-conditioning\nand refrigeration equipment and its\naccessories\n\n7.1 Components are reassembled, tested\nand assessed for correct operation\nagainst specification\n7.2 Assembly and testing procedures are\nfollowed based on manual\n7.3 Maintenance records/service reports\nare recorded and completed in\naccordance with standard operating\nprocedures\n\n--- PDF PAGE 86 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 84\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Electrical materials\n\n1.1 Electrical tape\n1.2 Wire connector\n1.3 Wires and cables\n1.4 Breaker\n1.5 Terminal clips/plugs\n\n2. Safety precautions\n\n2.1 Personal safety\n2.2 Safety of others, equipment\n\n3. Leaks\n\n3.1 Leaks on pipings and around\n compressor, evaporator and condenser\n\n4. Evacuation\n\n4.1 Minimum of 30minutes, steady vacuum\nof 29 in. Hg (mercury) unless otherwise\nspecified by the compressor and\nmanufacturer\n\n5. Mineral oil removal\n\n5.1 Removing and draining components,\n flushing using R-141\n\n6. Components\n\n6.1 Compressor\n6.2 Condenser\n6.3 Evaporator\n6.4 Liquid Line Strainer\n6.5 Metering Device\n6.6 Pressure Controls\n6.7 Thermostat\n6.8 Refrigerant Piping\n6.9 Defrost Controls\n6.10 Fan/Fan Motor\n6.11 Pipe Insulation\n6.12 Door Hinges\n6.13 Latches\n6.14 Cabinetry/Housing\n6.15 Expansion valve\n\n--- PDF PAGE 87 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 85\n\nVARIABLE\nRANGE\n\n7. Non-compatible components\n\n7.1 Filter\n7.2 Compressor\n7.3 Desiccant\n7.4 Receiver-drier (accumulator-drier)\n7.5 Pressure switches and controls\n\n8. Retrofit label\n\n8.1 Name and address of company (or\n individual) performing retrofit service\n8.2 Date service performed\n8.3 Type and amount of refrigerant\n8.4 Type and amount of lubricant\n8.5 Warning to use only refrigerant and the\n specified oil\n\n9. Retrofitting procedures\n\n9.1 CFCs to HCFCs/HC\n\n--- PDF PAGE 88 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 86\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual inspection of all air-conditioning\ncomponents\n1.2 Selected types of electrical tools/instrument and wiring\ndevices, equipment and materials in accordance with\nspecification and job requirement\n1.3 Identified and diagnosed faults in accordance with the\nstandard operating procedures\n1.4 Reported and repaired any signs of damage, lubricant\nleaks and corrosion according to manufacturer's\nspecifications\n1.5 Repaired/replaced transport air-conditioning and\nrefrigeration and its components as per manufacturer's\noperation/repair manual\n1.6 Converted air-conditioning system with appropriate\nrefrigerants following standard operating procedures\n1.7 Air-conditioning system functioned within compressor and\nmanufacturer's acceptable limits of temperatures and\npressures\n1.8 Tested air-conditioning system operation according to\nmanufacturer's specifications and standard operating\nprocedures\n1.9 Performed preventive maintenance in accordance with\nmanufacturer's specifications\n1.10 Recorded and completed maintenance/service reports in\naccordance with standard operating procedures\n1.11 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.12 Communicated interactively with others where applicable\nto ensure safe and effective work operations\n\n--- PDF PAGE 89 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 87\n\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n• Protective personal\nequipment/safety gear\n• Safe handling of tools and\nequipment\n• Proper handling of\nrefrigerants/pressure\ntesting and welding gases\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 BLUEPRINT READING\nAND PLAN\nSPECIFICATION\n• Electrical wiring control\ndiagram\n• Mechanical plan/symbols\nand abbreviations\n• Electrical plans, symbols\nand abbreviations\n\n2.3 TRADE THEORY\n• Basic electricity\n• Basic electronics\n• Basic automotive\n• Basic refrigeration cycle\n• Fundamentals of control\n• Principle and operation of\nauxiliary parts of\nrefrigeration system\n• Principle and operation of\nair-conditioning and\nrefrigeration\n• Principle and operation of\ninterlocking control\n• Fan characteristics\n• Electrical code\n• Air-conditioning and\nrefrigeration system\n• Basic welding\n• Installation procedures\n• Selection of unit and\ncomponents\n• Heat transfer\n\n--- PDF PAGE 90 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 88\n\n2.4 TOOLS/MATERIALS:\nUSES AND\nSPECIFICATIONS\n• Types of electrical controls\n• Types of expansion\nvalves/metering devices\n• Types of compressor\nmotor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of filter drier\n• Types of filter/strainer\nelement\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic\ncontractor\n• Types of unloader\n• Types of compressor\n• Types of pump\n• Phase sequence tester\n2.5 TRADE MATHEMATICS/\nMENSURATION\n• Linear measurements\n• Dimensions\n• Ratio and proportion\n• Unit conversion\n2.6 LEGISLATION\n• Clean Air Act (RA 8749)\n• Montreal Protocol\n• Ozone Depleting\nRefrigerants (ODRs)\n2.7 MAINTENANCE\n• Preventive Maintenance\n2.8 PROCESSES/\n PROCEDURES\n• Electrical control calibration\nprocedures\n• Repair/replace/assemble\ncompressor procedure\n• Repair/replace defective\ncondenser procedure\n• Replace liquid line strainer\nelement procedure\n• Replace metering device\nprocedure\n• Replace pressure controls\nprocedure\n• Replace thermostat\nprocedure\n• Repair/replace refrigerant\npiping procedure\n• Brazing procedure\n• Refrigerant recovery\nprocedures\n• Follow the general\nprocedure for checking-out\ntransport air-conditioning\nand refrigeration control\n• Pump down procedures\n• Replace defrost controls\nprocedure\n• Repair/replace fan/fan\nmotor procedures re:\nevaporator condenser\n• Refrigerant charging\nprocedures\n• Leak testing procedures\n• Mechanical testing\n• Latest update on\nrefrigerant types and usage\nin relation to environmental\nissues\n\n--- PDF PAGE 91 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 89\n\n3. Underpinning\nSkills\n\n3.1 Reading and interpreting schematic diagram, plans,\ndrawings, specifications and manuals\n3.2 Installing equipment, components and accessories\n3.3 Fabricating brackets\n3.4 Using electrical tools and materials properly\n3.5 Handling manual safely\n3.7 Testing electrical/mechanical\n3.8 Troubleshooting technique\n3.9 Replacing defective parts\n3.10 Preparing reports\n3.11 Reading and interpreting manufacturer's manual\n3.12 Performing mathematical computation and calculations,\nincluding linear measurements, ratios and unit conversion\n4. Resource\n Implications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Air-conditioning and refrigeration system\n4.3 Refrigerant\n4.4 Materials, tools and equipment appropriate to\nrepairing/retrofitting processes\n4.5 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 92 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 90\n\nUNIT OF COMPETENCY: PERFORM TESTING AND COMMISSIONING FOR\nTRANSPORT AIR-CONDITIONING AND\nREFRIGERATION\n\nUNIT CODE :"
