        "source_title": "TROUBLESHOOT TRANSPORT AIR- CONDITIONING AND REFRIGERATION SYSTEMS",
        "source_text": "--- PDF PAGE 70 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       68 \n \n \n \n \n \n   UNIT OF COMPETENCY:  TROUBLESHOOT TRANSPORT AIR-      \n                                               CONDITIONING AND REFRIGERATION SYSTEMS \n \nUNIT CODE               :  HVC723318 \n \n \n   UNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes  \nto    identify, analyze and find remedy faults \npertaining to transport air-conditioning and \nrefrigeration systems.  \n \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variables \n \n1.  Plan and prepare for  \ntroubleshooting \n \n1.1 Appropriate wiring diagrams, charts and \nmanuals are selected in line with \nequipment tested \n1.2  Appropriate materials, tools and  \nequipment are selected for testing \nprocedures \n1.3  Power supply is checked in  compliance \nwith nameplate rating and/or \nmanufacturer’s standard \n \n2.  Troubleshoot air-conditioning \nand refrigeration systems \n \n2.1 Components are correctly identified in \nline with job requirements \n2.2 Faults are identified and diagnosed as per \nprocedures \n2.3 Faults are identified and diagnosed based \non instructions \n2.4 Operational function of each component is \ninspected and tested in accordance with \nthe standard operating procedures \n2.5 Components are repaired/replaced as per \nmanufacturer’s operation/repair manual \n2.6 Components are reconditioned and \noverhauled in accordance with workplace \nprocedures\n\n--- PDF PAGE 71 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       69 \n \n \n \n \n \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variables \n \n3.  Test unit \n \n \n3.1 Unit is tested in line with manufacturer's \ninstructions \n3.2 Report on installation and testing of unit is \nprepared in line with enterprise \nprocedures \n3.3 Unit is tested for short and grounds in \nconformity with troubleshooting \nprocedures\n\n--- PDF PAGE 72 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       70 \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1.  Components \n \n1.1  Electrical controls \n- \nThermostat \n- \nTimer \n- \nRelay Thermo disc \n1.2  Compressor \n1.3  Compressor motor and relays \n1.4  Condenser \n1.5  Fan motors \n1.6  Refrigerant circuit \n1.7  Refrigerator defrost heater \n1.8  Evaporator fan and motor (no frost) \n1.9  Refrigerator door strip heater \n1.10 Liquid line strainer \n1.11 Metering device \n1.12 Pressure controls \n1.13 Thermostat \n1.14 Refrigerant piping \n1.15 Defrost controls \n1.16 Fan/fan motor \n1.17 Pipe insulation \n1.18 Door hinges \n1.19 Latches \n1.20 Cabinetry/Housing \n1.21 Expansion valve \n \n2.  Tools and instrument \n \nTools \n2.1  Pliers \n2.2  Screwdriver \n2.3  Wrenches \n2.4  Wire stripper/crimper \nInstrument \n2.5  Multi-tester \n2.6  Clamp-ammeter \n2.7  Capacitor tester \n2.8  Electric leak detector \n2.9  Megger\n\n--- PDF PAGE 73 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       71 \n \n \n \n \n \nVARIABLE \nRANGE \n \n3.  PPE \n \nIncludes but not limited to: \n3.1  Mask \n3.2  Safety shoes \n3.3  Safety goggles \n3.4  Apron \n3.5  Gloves \n \n4.  Test \n \n4.1  Insulation \n4.2  Resistance \n4.3  Mechanical \n4.4  Continuity \n4.5  Timing Sequence \n4.6  Leak\n\n--- PDF PAGE 74 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       72 \n \n \n \n \n \nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \n \n \n \nAssessment requires evidence that the candidate: \n1.1  Supplied power  in compliance with nameplate rating \nand/or manufacturer's standard \n1.2  Selected appropriate wiring diagrams, charts and manuals \nin line with equipment tested \n1.3  Tested transport air-conditioning and refrigerator electrical \nand mechanical controls and its components/accessories \nas per standard procedures \n1.3 Performed leak test as per standard procedures \n1.4 Reconditioned/overhauled transport air-conditioning and \nrefrigeration and its components in accordance with \nworkplace procedures  \n1.7  Selected and used appropriate processes, tools, materials \nand equipment to carry out tasks \n1.8  Demonstrated compliance with safety regulations \napplicable to worksite operations \n1.9  Identified faults and problems and made necessary action \nto rectify in line with SOP \n1.10 Communicated effectively with others where applicable to  \n         ensure  safe and effective work operations \n1.11Completed troubleshooting as to specifications\n\n--- PDF PAGE 75 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       73 \n \n \n2.  Underpinning  \nKnowledge  \n \n2.1  SAFETY PRACTICES \n Personal protective \nequipment, \nclothing/safety gears \n Electrical safety \n2.2  BLUEPRINT READING \nAND PLAN \nSPECIFICATION \n Electrical plans, symbols \nand abbreviations \n2.3  MATERIALS AND \nTOOLS: USES AND \nSPECIFICATIONS \n Electrical tools/equipment\n Parts of refrigerant circuit \n2.4  TRADE THEORY \n Basic electricity \n Basic electronics \n Basic automotive \n Refrigeration principles  \n Instrumentation \n2.5  PROCESSES/     \nPROCEDURES \n Motor insulation testing \nprocedure \n Wiring resistance testing \nprocedure \n Mechanical testing \nprocedure \n Compressor construction \n Electrical system analysis \n Mechanical system analysis \n2.6  LEGISLATION \n Clean Air Act (R.A. 8749) \n Montreal Protocol \n Ozone Depleting \nRefrigerants (ODRs)\n\n--- PDF PAGE 76 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       74 \n \n \n \n \n \n \n3.  Underpinning  \nSkills \n3.1  Interpreting plan and details (Schematic diagram) \n3.2  Preparing materials \n3.3  Proper handling  of electrical tools/equipment \n3.4  Testing electrical system \n3.5  Testing mechanical system \n3.6  Brazing \n4.  Resource \nImplications \n \n \nThings necessary to conduct method of assessment: \n4.1  Work place location \n4.2  Tools and equipment appropriate to troubleshooting \nprocesses \n4.3  Materials relevant to the proposed activity \n4.4  Drawings and specifications relevant to the task\n5.  Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1  Direct observation  \n5.2  Questions related to underpinning knowledge (Written \nTest) \n6.  Context for \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work   place setting\n",
