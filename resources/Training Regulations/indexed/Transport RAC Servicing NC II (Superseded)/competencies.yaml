        "source_title": "PERFORM MENSURATIONS AND CALCULATIONS",
        "source_text": "--- PDF PAGE 31 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       29 \n \n \n5.  Methods of \nAssessment \nCompetency should be assessed through: \n5.1  Direct Observation  \n5.2  Questions/Interview \n \nAssessment of underpinning knowledge and practical skills may be \ncombined \n6.  Context for \nAssessment \n6.1 Competency assessment must be undertaken in accordance \nwith the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a simulated \nenvironment \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY:  PERFORM MENSURATIONS AND \nCALCULATIONS                                                 \n \nUNIT CODE  \n        :   HVC311203 \n \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes   \n                                            in identifying and measuring objects based on the     \nrequired performance standards.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n\n--- PDF PAGE 32 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       30 \n \n \n1. Select measuring \ninstruments \n \n \n1.1 Object or component to be measured is  \nidentified, classified and interpreted to the \nappropriate regular geometric shape  \n1.2 Measuring tools are selected/identified as per \nobject to be measured or job requirements \n1.3 Correct specifications are obtained from \nrelevant sources \n1.4 Appropriate measuring instruments are \nselected according to job requirements   \n1.5  Alternative measuring tools are used without \nsacrificing cost and quality of work\n2.  Carry out measurements \nand calculations \n \n \n2.1 Accurate measurements and calculations \nare obtained to job requirements \n2.2  Alternative measuring tools are used  \n       without sacrificing cost and quality of work \n2.3  Calculation needed to complete work tasks \nare performed using the four basic process of \naddition (+), subtraction (-), multiplication (x) \nand division (/) including but not limited to: \ntrigonometric \nfunctions, \nalgebraic \ncomputations \n2.4  Calculations involving fractions, percentages \nand mixed numbers are used to complete \nworkplace tasks \n2.5 Numerical computation is self-checked and \ncorrected for accuracy \n2.6 Instruments are read to the limit of accuracy \nof the tool \n2.7 Systems of measurement identified and \nconverted according to job requirements/ISO \n2.8  Workpieces are measured according to job \nrequirements\n \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE\n\n--- PDF PAGE 33 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       31 \n \n \n \n1. Geometric Shape \n \n \n \n \n \n  \nIncluding but I not limited to: \n1.1 Round \n1.2 Square \n1.3 Rectangular \n1.4 Triangle \n1.5 Sphere \n1.6 Conical \n2.  Measuring instruments \nIncluding but not limited to: \n2.1 Micrometer (In-out, depth) \n2.2 Vernier caliper (out, inside) \n2.3 Dial gauge with mag, std. \n2.4 Straight edge \n2.5 Thickness gauge \n2.6 Torque gauge \n2.7 Small hole gauge \n2.8 Telescopic gauge \n2.9 Try-square \n2.10 Protractor \n2.11 Combination gauge \n2.12 Steel rule \n2.13 Voltmeter \n2.14 Ammeter \n2.15 Mega-ohmeter \n2.16 KWH meter \n2.17 Gauges \n2.18 Thermometers \n \n3.  Measurements and \ncalculations \n \n \n3.1 Linear \n3.2 Volume \n3.3 Area \n3.4 Wattage \n3.5 Voltage \n3.6 Resistance \n3.7 Amperage \n3.8 Frequency \n3.9 Impedance\n\n--- PDF PAGE 34 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       32 \n \n \nVARIABLE \nRANGE \n \n \n3.10 Conductance \n3.11 Capacitance \n3.12 Displacement \n3.13 Inside diameter \n3.14 Circumference \n3.15 Length \n3.16 Thickness \n3.17 Outside diameter \n3.18 Taper \n3.19 Out of roundness \n3.20 Oil clearance \n3.21 End play/thrust clearance\n\n--- PDF PAGE 35 ---\n______________________________________________________________________________________________\n_______ \n TRANSPORT RAC SERVICING  NC II  \n \n \n \n \nPromulgated March \n2005 \n       33 \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \n     of Competency \nAssessment requires that the candidate: \n1.1 Selected and prepared appropriate measuring instruments \nin accordance with job requirements \n1.2 Performed measurements and calculations according to job \nrequirements/ ISO \n2. Underpinning \nKnowledge \n \n \n \n \n \n2.1  TRADE MATHEMATICS/MENSURATION \n Four fundamental operation \n Linear measurement \n Dimensions \n Unit conversion \n Ratio and proportion \n Trigonometric functions \n Algebraic equations \n3. Underpinning \nSkills \n3.1 Performing calculation by addition, subtraction, multiplication \nand division: trigonometric functions and algebraic equations\n3.2 Visualizing objects and shapes \n3.3 Interpreting formulas for volume, areas, perimeters of plane \nand geometric figures \n3.4 Proper handling of measuring instruments \n \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Workplace location \n4.2 Problems to solve \n4.3 Measuring instrument appropriate to carry out tasks \n4.4 Instructional materials relevant to the propose activity \n \nAssessment of underpinning knowledge and practical skills may \nbe combined\n5. Methods of \nAssessment \nCompetency should be assessed through: \n5.1 Actual demonstration \n5.2 Direct observation \n5.3  Written test/questioning related to underpinning knowledge\n6.