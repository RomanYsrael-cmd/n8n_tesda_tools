  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide technical and vocational education\nand training (TVET) providers with information and other important\nrequirements to consider when designing training programs for Transport\nRAC Service.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: TRANSPORT RAC SERVICING\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n 34 Hours (Common)\n160 Hours (Core)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills\nin RAC Servicing which installs, services and maintains, troubleshoots\nand repairs transport air-conditioning and refrigeration units. It covers\nthe basic, common and core competencies.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\nGroup discussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n2. Work in a\nteam\nenvironment\n\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 101 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 99\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Prepare\nmaterials and\ntools\n\n1.1 Identify materials and tools\n1.2 Request materials and\ntools\n1.3 Receive and inspect\nmaterials and tools\n\nSelf-paced/ Modular\nDemonstration\nSmall Group\nDiscussion\nDistance Education\n\nWritten\nPractical /\nPerformance Test\n\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\n\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n3. Perform\nmensuration\nand calculation\n\n3.1 Select measuring\ninstruments\n3.2 Carry-out measurements\nand calculations\n\nSelf-paced/ Modular\nDemonstration\nSmall Group\nDiscussion\nDistance Education\n\nWritten/Oral\nExamination\nPractical\nDemonstration\n\n--- PDF PAGE 102 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 100\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n4. Perform basic\nbench work\n\n4.1 Prepare materials, tools\nand equipment for layout\n4.2 Layout features in\nworkplace\n4.3 Cut sheets, plates and\nbars\n4.4 Smooth sheets plates\nand bars\n4.5 Drill holes in sheets,\nplates and bars\n4.6 Bore holes in sheet\nplates and bars\n4.7 Bend sheets, plates and\nbars\n4.8 Join sheets, plates and\nbars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job training\n\nInterview\nDemonstration\nDirect Observation\n\n5. Perform basic\nelectrical\nworks\n\n5.1 Measure and analyze\ncircuit and load\nresistance in electrical\nsystem\n5.2 Measure and analyze\nvoltage in electrical\nsystem\n5.3 Measure and analyze\ncurrent in electrical\nsystem\n5.4 Test simple electrical\ncomponents and\nconnections\n5.5 Repair minor electrical\nsystem troubles\n\nModular\nComputer-based\ntraining\n(Simulation)\nDemonstration\nOn- the-job\ntraining\n\nInterview\nComputer-based\nassessment\n(Simulation)\nDemonstration\nDirect Observation\n\n--- PDF PAGE 103 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 101\n\n6. Maintain tools\nand\nequipment\n\n6.1 Check the conditions of\ntools and equipment;\n6.1 Perform basic preventive\nmaintenance\n6.3 Store tools and\nequipment\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and\nOral questioning\nDemonstration and\nOral questioning\nWritten test\n\n--- PDF PAGE 104 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 102\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n7. Perform\nhousekeeping\nand safety\npractices\n\n7.1 Sort materials, tools and\nequipment\n7.2 Clean workplace area,\nmaterials, tools and\nequipment\n7.3 Systematize dispensing\nand retrieval of materials,\ntools and equipment\n7.4 Identify and minimize/\neliminate hazards\n7.5 Respond and record\naccidents\n7.6 Follow basic securities\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and Oral\nquestioning\nDemonstration and\nOral questioning\nWritten test\n\n8. Document work\naccomplished\n\n8.1 Identify forms and data\n8.2 Prepare reports\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nDemonstration and\nOral questioning\nWritten Test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n\n--- PDF PAGE 105 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 103\n\n1. Install transport air-\nconditioning and\n refrigeration units\n\n1.1 Prepare tools, materials\nInstrument and\nequipment\nfor installation of\ntransport\nrefrigeration and air-\nconditioning system\n1.2 Lay-out mechanical\nComponents,\naccessories and\npiping of transport\nrefrigeration and air-\nconditioning system\n1.3 Install mechanical\ncomponents,\naccessories and\npiping of transport\nrefrigeration\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Questioning\nDemonstration\n\n--- PDF PAGE 106 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 104\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n\n2. Service and\nmaintain transport\nair-conditioning and\nrefrigeration units.\n\n2.1 Check and maintain\ncomponents/parts of\nmobile air-\nconditioning and\nrefrigeration system\n2.2 Maintain electrical\nsystem\n2.3 Maintain electrical\nsystem\n2.4 Repair/Replace\ntransport air-\nconditioning and\nrefrigeration system\nparts and\naccessories\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Questioning\nDemonstration.\n\n3. Trouble shoot\ntransport air-\nconditioning and\nrefrigeration units\n\n3.1 Check power supply\n3.2 Test electrical\ncomponent of air-\nconditioning\nequipment\n3.3 Test electrical\ncomponent of\nDomestic\nrefrigeration units\n3.4 Test air-conditioning\nand Domestic\nrefrigeration circuits\n3.5 Report and record\nfinding of the tested\nunit\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Questioning\nDemonstration\n\n4. Recover and\nrecycle refrigerant\nin transport air-\nconditioning and\nrefrigeration system\n\n4.1 Assess unit for\nrecovery/recycling\n4.2 Set-up equipment/\nrecycle machine\n4.3 Perform refrigerant\nrecovery/recycling\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Questioning\nDemonstration\n\n--- PDF PAGE 107 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 105\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n\n5. Repair and retrofit\ntransport air-\nconditioning and\nrefrigeration systems\n\n5.1 Evaluate, conditioning\nof existing transport air\nconditioning\n5.2 Prepare for servicing/\nrepairing transport air-\nconditioning and\nrefrigeration/system\n5.3 Prepare air-\nconditioning system\nfor retrofitting\n5.4 Troubleshoot air\nconditioning and\nrefrigeration\ncomponents\n5.5 Covert air conditioning\nsystem for HCFC/HC\n5.6 Undertake preventive\nmaintenance check/\nadjustment\n5.7 Test air-conditioning\n5.8 Return to service air-\nconditioning and\nrefrigeration\nequipment and its\naccessories\n\nLecturette\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Question\nDemonstration\n\n6. Perform testing and\ncommissioning for\ntransport air-\nconditioning and\nrefrigeration\n\n6.1 Prepare for\ncommissioning\nrefrigeration and air\nconditioning system.\n6.2 Assess refrigeration\nand air-conditioning\nsystem operation\n6.3 Recover refrigerant\nin refrigeration and\nair-conditioning\nsystem\n6.4 Charge the\nrefrigeration and air-\nconditioning system\n6.5 Perform pre-start\nchecks\n\nDiscussion\nDemonstration\nTrainee Hands-\non\n\nDirect\nObservation\n and\nQuestioning\nDemonstration\n\n--- PDF PAGE 108 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 106\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the\ncurriculum. Delivery shall be guided by the 10 basic principles\nof competency-based TVET:\n\n• The training is based on curriculum developed from\nthe\n\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should\n accommodate individualized and self-paced learning\n strategies;\n• Training is based on work that must be performed;\n• Training\nmaterials\nare\ndirectly\nrelated\nto\nthe\ncompetency\n\nstandards and the curriculum modules;\n\n• Assessment is based in the collection of evidence of\nthe\n\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior\nlearning\n\n(RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various\ntypes of delivery modes, both on and off-the-job as long as the\nlearning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted\nwhen designing training programs:\n\n• The dualized mode of training delivery is preferred\nand recommended. Thus programs would contain\nboth in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual\nTraining System (DTS) Implementing Rules and\nRegulations.\n\n• Modular/self-paced is a competency-based training\nmodality wherein the trainee is allowed to progress at\nhis own pace. The trainer facilitates the training\n\n--- PDF PAGE 109 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 107\n\ndelivery.\n\n• Peer teaching/mentoring is a training modality wherein\nfast learners are given the opportunity to assist the\nslow learners.\n\n• Supervised Industry Training or On-the-Job Training is\nan approach in training designed to enhance the\nknowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in\nwhich majority of the instruction occurs when the\nstudents and instructor are not in the same place.\nDistance learning may employ correspondence study,\nor audio, video or computer technologies.\n\n• Project-based instruction is an authentic instructional\nmodel or strategy in which students plan, implement\nand\nevaluate\nprojects\nthat\nhave\nreal\nworld\napplications.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and\neducational experience. Other requirements like health and\nphysical requirements are also stated. Passing entry written\nexaminations may also be indicated if necessary.\n\n• Can perform basic mathematical computation\n• Good moral character\n• Ability to communicate either oral and written\n• Physically and mentally fit\n\n--- PDF PAGE 110 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 108\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nTRANSPORT RAC SERVICING NC II\n\nRecommended list of tools, equipment and materials for\nthe training of 25 trainees for TRANSPORT RAC Servicing NC\nII.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n6 sets\nSystem\nAnalyzer\n2\nunits\nRecovery/recycling\nmachine\n3\npcs\nLiquid\nreceiver/drier, R\n12\n6 pcs.\nAdjustable\nwrench, 12”\n3\nunits\nVacuum pump\n2\npcs\nLiquid\nreceiver/drier, R\n134a\n6 pcs.\nAdjustable\nwrench, 8”\n1 unit\nPressure washer\n1\npc\n Refrigerant tank\nR 12\n3 sets\nOpen end\nwrench\n1 unit\nRefrigerant identifier\n1\npc\nRefrigerant tank\nR 134a\n3 sets\nBox wrench\n2 sets\nOxyacetylene unit\n5\npcs\nExpansion valve\n3 sets\nAllen\nwrench\n2 sets\nNitrogen cylinder w/\nregulator\n1\ngal\nMineral oil, 3 GS,\n5 GS\n5 sets\nHacksaw\n2 sets\nCharging cylinder ,\nR134a and R12\n1\ngal\nSynthetic oil\n5 pcs\nRubber\nmallet\n2\nunits\nDigital weighing scale\n1 roll Copper tube. 3/8”\n5 pcs.\nBallpen\nhammer\n1 unit\nPortable welding\nmachine\n1\nFlexible pipe,\ndischarge line\n10\npcs.\nFiles,\nassorted\n1 unit\nAir compressor\n1\nFlexible pipe,\nsuction line\n3 sets\nSocket\nwrench\n5units\nAuxillary fan\n10\nFittings,\ndischarge line\n3 sets\nTinner’s\nsnip\n5\nunits\nEvaporator, hang type\n10\nFittings, suction\nline\n\n--- PDF PAGE 111 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 109\n\n3 sets\nScrew\ndrivers\n5 units\nCondenser coil\n1 roll\nAutomotive wire #\n12\n5 pcs.\nLong nose\nplier\n5units\nCompressor\n1roll\nAutomotive wire\n#14\n5 pcs\nSide Cutter\n2 units Transport Refrigeration\nTrainer\n5\nrolls\nElectrical tape\n5 pcs.\nCrimping\ntools\n2 units\nTransport air\nconditioning Trainer\n100\npcs\nAssorted types of\nclamps\n5 pcs.\nVise grip\n1 set\nHole saw\n\n--- PDF PAGE 112 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 110\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n2 sets\nOil pump\n\n100\npcs\nAssorted types of\nflare nuts\n5 sets\nFlaring tools\n\n100\npcs\nAssorted types of\nnuts and bolts\n5 sets\nSwaging tool\n\n100\npcs\nTerminal clips\n5 pcs.\nTube cutter\n\n100\npcs\nAssorted types of\nO ring\n5 pcs.\nTube bender,\n¼”\n\n50\npcs\nSilver rod\n5 pcs.\nTube bender\n\n50\npcs\nAluminum rod\n5 pcs.\nRefrigeration\nratchet\n\n5jar\nAluminum flux\n3 sets\nQuick\nconnector for\nR134a\n\n3 pcs\nThermostat ,auto\naircon\n5 pcs.\nPush pull rule\n\n3\npcs\nThermostat\n,electronic w/\nthermistor\n5 pcs.\nSteel rule\n2 cyls\nNitrogen gas\n5 sets\nSoldering iron\n3 sets\nIdling stabilizer\n2 units\nPortable drill\n\n5 sets\nOverhauling\ngasket ,abacus\n1 unit\nPortable\ngrinder\n\n5 sets\nOverhauling\ngasket,\nNippondenso\n1 set\nPuncher\n\n5 pcs\nignition lighter\n5 sets\nMultitester\n\n5\nboxes\nRags\n5 sets\nThermometer,\ndigital\n\n5\nboxes\nSoap\n10\npcs.\nService\ncylinder, 2.5 kg\n\n10\npcs\nSand paper\n3 pcs.\nRefractometer\n\n5 pcs\nSealant\n3 units\nVacuum gauge\n\n5 pcs\nPressure switch\n\n5 pcs\nControl resistor\n\n5 pcs\nAmbient sensor\n\n--- PDF PAGE 113 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 111\n\n3.5\nTRAINING FACILITIES\n\nTRANSPORT RAC SERVICING NC II\n\nBased on a class intake of 25 students/trainees.\n\nUnit of Competency\n\nSpace\n(m)\nArea in\nSq. Meters\nTotal Area\nin\nSq. Meters\nA. LECTURE AREA*\n4 x 8\n32\n32\nB. LEARNING RESOURCE AREA\n\n4 x 6\n\n24\n\n24\nC. TOOL/STORAGE\n AREA*\n4 x 4\n16\n16\nD. WASH, TOILET AND LOCKER ROOM*\n\n3 x 4\n\n12\n\n12\nE. FACILITIES/\n EQUIPMENT/\n CIRCULATION\n\n25\n\nTOTAL AREA\n\n109\n\n3.6 TRAINER’S QUALIFICATION FOR HVAC/R SECTOR\n\nTRANSPORT RAC SERVICING NC II\n\nTRAINER QUALIFICATION II (TQ II)\n\n• Must have undergone training on Training Methodology II\n(TM II)\n• He must be a holder of RAC Servicing, NC III\n• Good moral character\n• Must be physically and mentally fit\n• Must be computer literate\n• Must be a Civil Service eligible (for government position or\n appropriate professional license issued by the Professional\n Regulatory Board)\n• *Must have at least two (2) years job/industry experience\n\n*Optional: Only when required by the hiring institution\n\n Reference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\n--- PDF PAGE 114 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 112\n\nInstitutional assessment is undertaken by trainees to\ndetermine their achievement of units of competency. A\ncertificate of achievement is issued for each unit of competency."
