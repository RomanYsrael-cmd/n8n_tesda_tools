    "training_delivery": {
      "present": true,
      "source_text": "The delivery of training should adhere to the design of the\ncurriculum. Delivery shall be guided by the 10 basic principles\nof competency-based TVET:\n\n• The training is based on curriculum developed from\nthe\n\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should\n accommodate individualized and self-paced learning\n strategies;\n• Training is based on work that must be performed;\n• Training\nmaterials\nare\ndirectly\nrelated\nto\nthe\ncompetency\n\nstandards and the curriculum modules;\n\n• Assessment is based in the collection of evidence of\nthe\n\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior\nlearning\n\n(RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various\ntypes of delivery modes, both on and off-the-job as long as the\nlearning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted\nwhen designing training programs:\n\n• The dualized mode of training delivery is preferred\nand recommended. Thus programs would contain\nboth in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual\nTraining System (DTS) Implementing Rules and\nRegulations.\n\n• Modular/self-paced is a competency-based training\nmodality wherein the trainee is allowed to progress at\nhis own pace. The trainer facilitates the training\n\n--- PDF PAGE 109 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 107\n\ndelivery.\n\n• Peer teaching/mentoring is a training modality wherein\nfast learners are given the opportunity to assist the\nslow learners.\n\n• Supervised Industry Training or On-the-Job Training is\nan approach in training designed to enhance the\nknowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in\nwhich majority of the instruction occurs when the\nstudents and instructor are not in the same place.\nDistance learning may employ correspondence study,\nor audio, video or computer technologies.\n\n• Project-based instruction is an authentic instructional\nmodel or strategy in which students plan, implement\nand\nevaluate\nprojects\nthat\nhave\nreal\nworld\napplications.",
      "pdf_pages": []
    },
