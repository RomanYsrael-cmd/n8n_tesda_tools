    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: TRANSPORT RAC SERVICING\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n 34 Hours (Common)\n160 Hours (Core)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills\nin RAC Servicing which installs, services and maintains, troubleshoots\nand repairs transport air-conditioning and refrigeration units. It covers\nthe basic, common and core competencies.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\nGroup discussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n2. Work in a\nteam\nenvironment\n\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 101 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 99\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Prepare\nmaterials and\ntools\n\n1.1 Identify materials and tools\n1.2 Request materials and\ntools\n1.3 Receive and inspect\nmaterials and tools\n\nSelf-paced/ Modular\nDemonstration\nSmall Group\nDiscussion\nDistance Education\n\nWritten\nPractical /\nPerformance Test\n\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\n\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n3. Perform\nmensuration\nand calculation\n\n3.1 Select measuring\ninstruments\n3.2 Carry-out measurements\nand calculations\n\nSelf-paced/ Modular\nDemonstration\nSmall Group\nDiscussion\nDistance Education\n\nWritten/Oral\nExamination\nPractical\nDemonstration\n\n--- PDF PAGE 102 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 100\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n4. Perform basic\nbench work\n\n4.1 Prepare materials, tools\nand equipment for layout\n4.2 Layout features in\nworkplace\n4.3 Cut sheets, plates and\nbars\n4.4 Smooth sheets plates\nand bars\n4.5 Drill holes in sheets,\nplates and bars\n4.6 Bore holes in sheet\nplates and bars\n4.7 Bend sheets, plates and\nbars\n4.8 Join sheets, plates and\nbars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job training\n\nInterview\nDemonstration\nDirect Observation\n\n5. Perform basic\nelectrical\nworks\n\n5.1 Measure and analyze\ncircuit and load\nresistance in electrical\nsystem\n5.2 Measure and analyze\nvoltage in electrical\nsystem\n5.3 Measure and analyze\ncurrent in electrical\nsystem\n5.4 Test simple electrical\ncomponents and\nconnections\n5.5 Repair minor electrical\nsystem troubles\n\nModular\nComputer-based\ntraining\n(Simulation)\nDemonstration\nOn- the-job\ntraining\n\nInterview\nComputer-based\nassessment\n(Simulation)\nDemonstration\nDirect Observation\n\n--- PDF PAGE 103 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 101\n\n6. Maintain tools\nand\nequipment\n\n6.1 Check the conditions of\ntools and equipment;\n6.1 Perform basic preventive\nmaintenance\n6.3 Store tools and\nequipment\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and\nOral questioning\nDemonstration and\nOral questioning\nWritten test\n\n--- PDF PAGE 104 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 102\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n7. Perform\nhousekeeping\nand safety\npractices\n\n7.1 Sort materials, tools and\nequipment\n7.2 Clean workplace area,\nmaterials, tools and\nequipment\n7.3 Systematize dispensing\nand retrieval of materials,\ntools and equipment\n7.4 Identify and minimize/\neliminate hazards\n7.5 Respond and record\naccidents\n7.6 Follow basic securities\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and Oral\nquestioning\nDemonstration and\nOral questioning\nWritten test\n\n8. Document work\naccomplished\n\n8.1 Identify forms and data\n8.2 Prepare reports\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nDemonstration and\nOral questioning\nWritten Test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n\n--- PDF PAGE 105 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 103\n\n1. Install transport air-\nconditioning and\n refrigeration units\n\n1.1 Prepare tools, materials\nInstrument and\nequipment\nfor installation of\ntransport\nrefrigeration and air-\nconditioning system\n1.2 Lay-out mechanical\nComponents,\naccessories and\npiping of transport\nrefrigeration and air-\nconditioning system\n1.3 Install mechanical\ncomponents,\naccessories and\npiping of transport\nrefrigeration\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Questioning\nDemonstration\n\n--- PDF PAGE 106 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 104\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n\n2. Service and\nmaintain transport\nair-conditioning and\nrefrigeration units.\n\n2.1 Check and maintain\ncomponents/parts of\nmobile air-\nconditioning and\nrefrigeration system\n2.2 Maintain electrical\nsystem\n2.3 Maintain electrical\nsystem\n2.4 Repair/Replace\ntransport air-\nconditioning and\nrefrigeration system\nparts and\naccessories\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Questioning\nDemonstration.\n\n3. Trouble shoot\ntransport air-\nconditioning and\nrefrigeration units\n\n3.1 Check power supply\n3.2 Test electrical\ncomponent of air-\nconditioning\nequipment\n3.3 Test electrical\ncomponent of\nDomestic\nrefrigeration units\n3.4 Test air-conditioning\nand Domestic\nrefrigeration circuits\n3.5 Report and record\nfinding of the tested\nunit\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Questioning\nDemonstration\n\n4. Recover and\nrecycle refrigerant\nin transport air-\nconditioning and\nrefrigeration system\n\n4.1 Assess unit for\nrecovery/recycling\n4.2 Set-up equipment/\nrecycle machine\n4.3 Perform refrigerant\nrecovery/recycling\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect Observation\n and Questioning\nDemonstration\n\n--- PDF PAGE 107 ---\n______________________________________________________________