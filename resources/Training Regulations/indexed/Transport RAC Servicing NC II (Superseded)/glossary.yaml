  "source_text": "\nDEFINITION OF TERMS\n\n1) Air Cooled Condensing Unit (ACCU)/OUTDOOR UNIT – an\nequipment that condenses refrigerant vapor using air as the\ncondensing medium. It consist of compressor, condenser coil and fan\nmotor\n\n2) Air Cooled Condenser – an equipment that condenses refrigerant\nvapor using air as the condensing medium\n\n3) Air Handling Unit (AHU)/INDOOR UNIT – an air-conditioning\ncomponent that consists of a fan motor and an evaporator coil. It is\nthis equipment used in air-conditioning that absorbs heat from the\nspace\n\n4) Air Distribution – the process of distributing conditioned air into a\nconfined space\n\n5) Check – to verify, inspect, or test an HVAC/R component for\nsatisfactory condition with the use of an instrument or a device\n\n6) Commercial Refrigeration - covers water coolers/ display coolers,\nvendo machine, beverage machine icedrop/ice cream/ice cube vending\nmachines\n\n7) Dehydration – the process of removing moisture from a refrigeration\nsystem\n\n8) Electric Heat Defrost – use of electric resistance heating coils to melt\nice or frost from evaporators\n\n9) Evacuation – removal of air/any gas and moisture from a refrigeration\nsystem\n\n10) Evaporator – the component in a refrigeration system where liquid\nrefrigerant is\n changed into a vapor by the absorption of heat\n\n11) Fan – a mechanical device for moving air\n\n12) Fan Coil Unit (FCU) – an air-conditioning component that consists of\na fan\n motor and an evaporator coil\n\n13) Filter Drier – the component part used in air-conditioning or\nrefrigeration\n system to filter and dehydrates refrigerant in the system\n\n--- PDF PAGE 118 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 116\n\n14) Hot Gas Defrost – component part used to remove frosting on the\nevaporator\n coil using hot gas refrigerant from the compressor\n\n15) Idler Pulley – a pulley used to maintain proper belt tension\n\n16) Inspect – determine the actual condition of HVAC/R component\nwithout the use of instrument\n\n 17) Interlocking – it is the action of interconnecting electric control wires\nto achieve a sequential action\n\n 18) Leak Test – the procedure of determining/pin pointing leaks in a\npressurized system\n\n 19) Liquid Line Solenoid Valve – electrically operated valve that shuts-\noff the flow of the refrigerant to the evaporator\n\n 20) Metering Device – it is one of the major components in a\nrefrigeration system used to regulate the flow of refrigerant into the\nevaporator\n\n21) Package Air-conditioning Unit (PACU)/SPLIT-TYPE – an air-\nconditioning unit that contains the compressor, water-cooled\ncondenser, metering device and evaporator all of which is in one\ncasing\n\n 22) Pull-out – to remove from a place of installation\n\n 23) Pressure Test – a procedure whereby pressure is applied to the\npiping system, the purpose of which is to determine its soundness\nand stability\n\n 24) Pump down – a process of using the compressor to pump and\ncontain all the refrigerant charge into the condenser and/or receiver\n\n 25) Refrigerant Charging – the process of introducing into the system\nthe proper amount of refrigerant\n\n 26) Retrofitting – a process of upgrading existing equipment or system\nusing ozone depleting substances to environmental friendly\nrefrigerant\n\n 27) Service Mechanic – worker who possess basic skills related to\nHVAC/R system\n\n--- PDF PAGE 119 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 117\n\n 28) Sight Glass/Liquid Line Moisture Indicator – indicates refrigerant\nquality and charge\n\n 29) Thermostat Expansion Valve (TXV) – a refrigerant control valve\nconnected before an evaporator that regulates flow of refrigerant.\nOperated by temperature and pressure, and reacts to the degree of\ngas superheat at the evaporator outlet through a feeler bulb\n\n30) Transport Air-conditioning Unit – refers to an air-conditioning unit\ndriven directly from the turning axle of the vehicle when they are in\nmotion, or by the vehicle engine itself, or by a separate gasoline/diesel\nengine and/or electric motor mounted on the same vehicle. It covers\nthe land and marine/sea transports.\n\n31) Troubleshoot – the process of analyzing system defect or malfunction\n\n32) Vacuum – pressure lower than atmospheric pressure measured in\ninches of mercury. Complete vacuum is 29.92 in. mercury or at least\n500 microns\n\n 33) Water Treatment – the use of chemicals in water to prevent\ncorrosion, formation of scales, algae growth and formation of slime\n\n 34) Window Type Air-conditioning Unit – is a self-contained air-\nconditioning\nunit house in a single casing mounted in a wall or window opening\n\n 35) Workmanlike-manner – quality of work within the accepted industry\nstandard\n\n--- PDF PAGE 120 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 118\n\n--- PDF PAGE 121 ---\n______________________________________________________________________________________________\n_______\n TRANSPORT RAC SERVICING NC II\n\nPromulgated March\n2005\n 119\n",
