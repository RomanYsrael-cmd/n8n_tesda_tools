form quality checking procedures\n• Apply quality Workplace procedures\n• Identify faulty materials\n• Check quality of materials or component parts\nas per manufacturer’s standards\n• Interpret specifications or symbols\n• Lecture\n• Field trip\n• Symposium\n• Video clips\n• Simulation/ Role\nplaying\n\n• Written test\n• Demonstration\n& questioning\n• Observation &\nquestioning\n\n3 hours\n1.2. Assess own work\n• Perform workplace procedure in documenting\ncompleted work\n• Perform fault identification and reporting\n• Observe safety and environmental aspects of\nproduction processes\n• Utilize workplace quality indicators\n• Document and report deviations from specified\nquality standards\n• Field trip\n• Symposium\n• Simulation\n• On the job training\n\n• Demonstration\n& questioning\n• Observation &\nquestioning\n\n3 hours\n1.3. Engage in quality\nimprovement\n• Participate in quality improvement processes\na. IEC/ISO standards\nb. Environmental and safety standards\n• Carry out work as per process improvement\nprocedures\n• Monitor operation performance\n• Implement continuous improvement\n• Field trip\n• Symposium\n• Simulation\n• On the job training\n• Demonstration\n& questioning\n• Observation &\nquestioning\n2 hours\n2. Perform\ncomputer\noperations\n\n2.1. Plan and prepare\nfor task to be\nundertaken\n• Plan and prepare computer operation activity\n• Determine task requirements based on required\noutput\n• Determine appropriate hardware and software\n• Lecture\n• Modular\n• Computer based\ntraining (e-\nlearning)\n• Written/Oral\nexamination\n• Practical\ndemonstration\n4 hours\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 66\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Identify/Select typ