n24 hours\n\n--- PDF PAGE 71 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 71\nUnit of\nCompetency\nLearning Outcomes\n Learning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.3. Set schedule for\nscanning\n● Lecture/discussion on NIST standards\nand ITIL version 4\n● Hands-on in setting schedule for\nscanning\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n8 hours\n2.4. Conduct\nevaluation of\nservers, endpoint\nand application\n● Lecture and discussion on:\no Access management of servers,\nendpoint and application\no Configuration management of\nservers, endpoint and application\no Evaluation of encryption\ntechnology of servers, endpoint\nand application\n● Discussion on:\no Data retention and data\ndestruction policy of servers,\nendpoint and application\no Preventive maintenance policy of\nservers, endpoint and application\n● Hands-on in conducting evaluation of\nservers, endpoint and application\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n24 hours\n2.5. Perform\nVulnerability\nManagement (VM)\nchange\nmanagement\n● Lecture/Discussion on:\no Scanning procedures based on\nvulnerability management solution\no Vulnerability management solution\nusage and operations\no List of assets\no Vulnerability Management change\nproposal\n● Hands-on in preparation of vulnerability\nmanagement change proposal\n● Hands-on in preparation of vulnerability\nscanning results/report\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n24 hours\n\n--- PDF PAGE 72 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 72\nUnit of\nCompetency\nLearning Outcomes\n Learning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.6. Perform patch and\nremediation testing\nand deliver report\n● Lecture/Discussion on:\no Patch/remediation strategies and\nsolutions\no Patch and remediation testing\n● Hands-on in performing patch and\nremediation testing\n● Hands-on in preparation of patch and\nremediation testing results/report\n\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n24 hours\n\nSupervised Industry Learning\n\n80 hours\n\nNote:\nThe Supervise Industry Learning (SIL) component may be implemented in flexible manner. It may be integrated within various modules or units of competency or at the end of\nthe in-school or classroom training. Actual hands on / immersion can be conducted in the partner industry/ company through the supervision of the designated industry focal.\n\n--- PDF PAGE 73 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n73\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology (video conferencing, webinar,\netc.).\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 Institution- Based:\n\n● Dual Training System (DTS)/ Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n● Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n● Supervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n\n--- PDF PAGE 74 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n74\n● The classroom-based or in-center instruction uses learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n● Formal Apprenticeship is training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n● Informal Apprenticeship is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits\nto contributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n● Enterprise-based Training where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based:\n\n● Community-Based Training is short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community.\nSuch programs can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n●\nMust have completed basic education or its equivalent as per existing\nDepEd policies and regulations\n●\nMust be certified in Cyber Threat Monitoring NC I or any entry-level\ncybersecurity professional certified by an official certification organization or\nhas one (1) year experience in a security operations center, information\nsecurity/IT security job role\n●\nHas the capacity to communicate in any form\n●\nMust know how to use and operate a computer and mobile device on the\nmost current Operating System (OS)\n●\nPhysically able to manipulate a computer input device\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience and others that may be required from the\ntrainees by the school or training center delivering the TVET program.\n\n--- PDF PAGE 75 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n75\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 20 trainees for Cyber\nThreat Mitigation NC II.\n\nTOOLS\nQty.\nUnit\nDescription/Specification\n1\nunit\nSecurity information and event management (SIEM)\nsoftware/solution*\n\nNote: Must be compatible with the ticketing system, security solution and\nvulnerability scanning tools\n1\nunit\nCybersecurity Ticketing System Software*\n\nNote: Must be compatible with the SIEM\n1\nunit each\nEnterprise or Corporate level Security solution Applications (with\naccess to the management console to the security solution with\nprovision of storage) *\n1.1. Next Generation Anti-Virus (AV)\n1.2. Next Generation Firewall\n1.3. Endpoint Detection and Response (EDR)\n\nNote: Must be compatible with the SIEM\n21\nunits\nVirtualization Applications*\n21\nunits\nVulnerability Scanning Tools Software*\n\nNote: Must be compatible with the SIEM\n21\nunits\nOffice Productivity Tools*\n1\nunit\nInternet access, 50Mbps\n1\npc\n1 TB External hard drive\n1\nunit\nRouter, LAN or WiFi\n1\nunit\nSwitch, 32 ports or higher\n3\npcs\nWhite board eraser, magnetic\n3\nboxes\nWhite board marker, assorted colors\n1\nunit\nVirtual storage for SIEM image, TDR, DLP, NGAV, other security\nsolutions\n* Can be either educational, license or open-source software\n** Must not be open-source software\n\nEQUIPMENT\nQty.\nUnit\nDescription/Specification\n21\nunits\nDesktop computer, (software dependent specifications) with\nmouse and keyboard\nProcessor : i7 8th Gen Core Processor or its equivalent\nand/or higher version\nMemory\n : 16 GB DDR4 or higher\nStorage\n : 512 GB SSD 2.5 inch\nGraphics : Integrated HD Graphics or external VGA card\nAccessories : Mouse and Keyboard\nOperating System : Win 11 Pro 64 Bit or Linux OS\n1\nunit\nServer computer\nProcessor : i7 8th Gen Core Processor or its equivalent\nand/or higher version\n\n--- PDF PAGE 76 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n76\nMemory\n : 64 GB DDR4 or higher\nStorage\n : 1 TB SSD 2.5 inch\nGraphics : Integrated HD Graphics or external VGA card\nAccessories : Mouse and Keyboard\nOperating System : Win 11 Pro 64 Bit or Linux OS\n1\nunit\nLCD Projector or Smart TV\n1\nunit\nPrinter\n1\nunit\nWhite board and / or glass board\n21\nsets\nErgonomic computer tables and chairs\n\nMATERIALS\nQty.\nUnit\nDescription/Specification\n21\npcs\nHand-outs\n21\npcs\nPractice materials\n1\npc\nVideo learning materials\nAs\nneeded\npcs\nReference books/materials\n1\nream\nBond paper, A4\n\nDue to the fast-changing nature of the Information and Communications Technology\n(ICT) sector, TVET providers are reminded to use and provide their trainees with the latest\ntechnology tools, equipment and materials where appropriate and applicable.\n\n--- PDF PAGE 77 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n77\n\n3.5\nTRAINING FACILITIES\n\nBased on class size of 20 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nComputer/ Laboratory/ Lecture\nArea\n7 x 8\n56\n1\n56\nLearning Resource Area\n3 x 5\n15\n1\n15\nWash & Toilet Area\n2 x 2\n4\n2\n8\n Total\n79\nFacilities / Equipment / Circulation**\n24\nTotal Area\n103\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\nAppropriate consideration should be given in providing and allocating workspace,\ncommunications facilities, and the usual workplace amenities to ensure a proper learning\nenvironment. Where applicable, training shall be held or conducted in learning facilities in\naccordance with generally accepted industry standards and practice.\n\n3.6\nTRAINERS QUALIFICATIONS\n\n1. Must be a holder of National TVET Trainer Certificate (NTTC) level I in Cyber\nThreat Mitigation NC II or higher;\n2. Must have at least Three (3) years of paid work experience in a Security Operations\nCenter (SOC) as an intermediate cybersecurity professional within the last five (5)\nyears and certified by an official cybersecurity certification organization.\n3. Must have a valid NBI Clearance\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. It is recommended that a comprehensive written examination\ncovering the basic, common and core competencies be administered at the end of\nthe training.\n\n--- PDF PAGE 78 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n78"
