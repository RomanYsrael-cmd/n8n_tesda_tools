  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Cyber Threat Mitigation NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to training providers. This will equip them with needed knowledge and skills\nin developing their own curricula based on the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude green technology, issues on health and drugs and catering to persons with\ndisabilities (PWD’s) to accompany their curricula.\n\nCourse Title: Cyber Threat Mitigation\n\nNC Level: NC II\n\nNominal Training Duration:\n\n37 hours – Basic Competencies\n\n28 hours – Common Competencies\n\n 240 hours – Core Competencies\n\n ---------------------------------------------------------------\n\n 305 hours – Total (in-school/in-center)\n\n 160 hours – Supervised Industry Learning (SIL)*\n\n * The Supervise Industry Learning (SIL) component may be implemented in flexible manner. It may be\nintegrated within various modules or units of competency or at the end of the in-school or classroom\ntraining. Actual hands on / immersion can be conducted in the partner industry/ company through the\nsupervision of the designated industry focal.\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, &\nattitudes of a cybersecurity analyst/support staff in accordance with industry\nstandards. It covers the basic & common competencies in addition to the core\ncompetencies in monitoring and reporting cyber threats and conducting vulnerability\nscanning.\n\nUpon completion of the course, the learner is expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n:\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 56\nBASIC COMPETENCIES\n(37 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n• Describe Organizational policies\n• Read:\no Effective communication\no Written communication\no Communication procedures and systems\n• Identify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n• Prepare different types of question\n• Gather different sources of information\n• Apply storage system in establishing\nworkplace information\n• Demonstrate Telephone courtesy\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing workplace\ninstructions\n• Read:\no Written notices and instructions\no Workplace interactions and procedures\n• Read instructions on work related\nforms/documents\n• Perform workplace duties scenario following\nworkplace instructions\n• Group\ndiscussion\n• Lecture\n• Demonstration\n\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 57\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork related\ndocuments\n• Describe Communication procedures and\nsystems\n• Read\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n• Read instructions on work related\nforms/documents\n• Practice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of addition,\nsubtraction, division and multiplication\n• Demonstrate office activities in:\no workplace meetings and discussions\nscenario\n• Perform workplace duties scenario following\nsimple written notices\n• Follow simple spoken language\n• Identify the different Non-verbal\ncommunication\n• Demonstrate ability to relate to people of social\nrange in the workplace\n• Gather and provide information in response to\nworkplace requirements\n• Complete work related documents\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n2. Work in a team\nenvironment\n2.1. Describe team role\nand scope\n• Discussion on the team roles and scope\n• Participate in the discussion\no Definition of Team\no Difference between team and group\no Objectives and goals of team\n• Locate needed information from the different\nsources of information\n• Lecture/\nDiscussion\n• Group work\n• Individual work\n• Role play\n• Role play\n• Case study\n• Written test\n1 hour\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 58\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.2. Identify one’s role\nand responsibility\nwithin team\n• Role play\no Individual role and responsibility\n• Role play\no Understanding individual differences\n• Discussion on gender sensitivity\n• Role play\n• Lecture/\nDiscussion\n• Role play\n• Written test\n1 hour\n2.3. Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Participate in the discussion of standard work\nprocedures and practices\n• Group work\n• Role play\n• Lecture/\nDiscussion\n• Role play\n• Written test\n1 hour\n3. Solve/address\nroutine\nproblems\n3.1. Identify routine\nproblems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic\ntools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Analyze routine/procedural problems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n3.2. Look for solutions\nto routine problems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic\ntools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems and\ndocument procedures for reporting\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 59\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.3. Recommend\nsolutions to\nproblems\n• Discuss standard operating procedures and\ndocumentation processes\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n4. Develop Career\nand Life\nDecisions\n4.1. Manage one’s\nemotion\n• Demonstrate self-management strategies that\nassist in regulating behavior and achieving\npersonal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger, worry,\nanxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be changed\nand accept them and remain professional\n• Recall instances that demonstrate self-\ndiscipline, working independently and showing\ninitiative to achieve personal and career goals\n• Share experiences that show confidence, and\nresilience in the face of setbacks and\nfrustrations and other negative emotions and\nunpleasant situations in the workplace\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 hour\n4.2. Develop reflective\npractice\n• Enumerate strategies to improve one’s attitude\nin the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as self-assessment\nstrategy\n• Develop reflective practice through realization\nof limitations, likes/ dislikes; through showing\nof self-confidence\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n1 hour\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 60\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate self-acceptance and being able\nto accept challenges\n4.3. Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-regulation\nbased on Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by\nStephen Covey, transactional analysis,\npsycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility, adaptability,\netc.\n• Determine strengths and weaknesses\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 hour\n5. Contribute to\nworkplace\ninnovation\n5.1. Identify\nopportunities to do\nthings better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges in\ninnovation\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7 habits of highly effective people\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 hour\n\n--- PDF PAGE 61 ---\n______________________________________________________________________________________