urs\n\n--- PDF PAGE 71 ---\n_____________________________________________________________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n 71\nUnit of\nCompetency\nLearning Outcomes\n Learning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.3. Set schedule for\nscanning\n● Lecture/discussion on NIST standards\nand ITIL version 4\n● Hands-on in setting schedule for\nscanning\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n8 hours\n2.4. Conduct\nevaluation of\nservers, endpoint\nand application\n● Lecture and discussion on:\no Access management of servers,\nendpoint and application\no Configuration management of\nservers, endpoint and application\no Evaluation of encryption\ntechnology of servers, endpoint\nand application\n● Discussion on:\no Data retention and data\ndestruction policy of servers,\nendpoint and application\no Preventive maintenance policy of\nservers, endpoint and application\n● Hands-on in conducting evaluation of\nservers, endpoint and application\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n24 hours\n2.5. Perform\nVulnerability\nManagement (VM)\nchange\nmanagement\n● Lecture/Discussion on:\no Scanning procedures based on\nvulnerability management solution\no Vulnerability management solution\nusage and operations\no List of assets\no Vulnerability Management change\nproposal\n● Hands-on in preparation of vulnerability\nmanagement change proposal\n● Hands-on in preparation of vulnerability\nscanning results/report\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer