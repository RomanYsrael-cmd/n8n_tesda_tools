        "source_text": "--- PDF PAGE 49 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n49 \nUNIT OF COMPETENCY   :    PERFORM VULNERABILITY MANAGEMENT/CONTROL  \n \nUNIT CODE                        :    ICT251315 \n \nUNIT DESCRIPTOR           : This unit covers the knowledge, skills and attitude required \nto perform vulnerability management/control. It includes \ncompetencies in installing agent or identifying network \ninfrastructure (product usage or management); setting \nschedule for scanning; performing vulnerability asset \ncontrol (inventory/asset management); conducting audit of \nservers, endpoint and application; performing vulnerability \nManagement (VM) change management (configuration \nmanagement); and performing patch and remediation testing \nand deliver report (patch and capacity management).  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Install agent  \n \n \n1.1. Vulnerability scanning and \nmanagement software are \nidentified based on NIST \nstandards * \n1.2. Core product management \ntraining of the software is \nconducted based on \nproduct * \n1.3. Product installation is \nconducted based on \nproduct manual * \n1.4. Product installation and \nconfiguration is verified \nbased on NIST 800-115 * \n1.1. Ticket management \nsystems \n1.2. Vulnerability \nmanagement solution \n1.3. Knowledge \nManagement usage \n1.4. Verification of installed \nproduct \n1.5. Knowledge on NIST \n800-115 \n1.6. Knowledge in \nOperating Systems \n1.1. Computer \noperation skills \n1.2. Operating \nsystems \noperation  \n1.3. Communication \nskills  \n1.4. Interpreting \nwork \ninstructions \n1.5. Interpersonal \nskills \n2. Perform \nvulnerability \nasset control  \n \n \n2.1. Access to inventory \nmanagement is \ncoordinated with IT Service \nManagement team  \n2.2. Inventory of assets is \ncreated for vulnerability \nscanning * \n2.3. Sorting and grouping of \nassets inventory is \nperformed based on \nISO/IEC 19770 \nparameters* \n2.1. Inventory check of \ndevices assets and \ninfrastructure that \nneeds to undergo \nvulnerability scanning \n2.2. Vulnerability \nmanagement solution \nscan and operations \nprocedure \n2.3. Documentation of \ninventory check \nFamiliarity on \nISO/IEC 19770 \n2.1. Computer \noperation skills \n2.2. Communication \nskills  \n2.3. Interpreting \nwork \ninstructions \n2.4. Interpersonal \nskills \n2.5. Documentation \nskills\n\n--- PDF PAGE 50 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n50 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Set schedule \nfor scanning \n \n \n3.1. Collaboration with IT and \nsoftware development team \non change management is \nperformed based on NIST \nstandards and ITIL version 4* \n3.2. Production and staging load \nscheduling are checked \nbased on NIST standards \nand ITIL version 4* \n3.3. IT and software development \nteam and third party \nprovider’s availability or \nschedule is checked based \non NIST standards and ITIL \nversion 4* \n3.1. Ticket management \nsystems \n3.2. Vulnerability \nmanagement solution \n3.3. Scanning procedures \nbased on vulnerability \nmanagement solution \n3.4. Knowledge \nManagement usage \n3.5. Vulnerability \nmanagement solution \nusage and operations \n3.6. List of assets \n3.7. Knowledge on NIST \n800-115 \n3.8. Knowledge on ITIL \nversion 4 \n3.1. Computer \noperation skills \n3.2. Communication \nskills  \n3.3. Interpreting work \ninstructions \n3.4. Interpersonal \nskills \n \n4. Conduct \nchecking of \nservers, \nendpoint and \napplication \n \n \n4.1. Access management of \nservers, endpoint and \napplication is checked and \nreviewed based on ITIL \nversion 4* \n4.2. Configuration management \nof servers, endpoint and \napplication is checked and \nreviewed based on based \non ITIL version 4* \n4.3. Encryption technology  of \nservers, endpoint and \napplication is evaluated \nbased on ITIL version 4* \n4.4. Review data retention and \ndata destruction policy  of \nservers, endpoint and \napplication are reviewed \nbased on ITIL version 4* \n4.5. Preventive maintenance \npolicy of servers, endpoint \nand application is reviewed \nbased on ITIL version 4* \n4.1. Ticket management \nsystems \n4.2. Vulnerability \nmanagement solution \n4.3. Scanning procedures \nbased on vulnerability \nmanagement solution \n4.4. Knowledge \nManagement usage \n4.5. Vulnerability \nmanagement solution \nusage and operations \n4.6. List of assets \n4.7. Knowledge on NIST \n800-115 \n4.8. Knowledge in ITIL \nversion 4 \n4.9. Knowledge in \nOWASP, stride and \nMitre framework \n4.1. Computer \noperation skills \n4.2. Communication \nskills  \n4.3. Interpreting work \ninstructions \n4.4. Interpersonal \nskills \n4.5. Vulnerability \nScanning skills \n \n5. Perform \nVulnerability \nManagement \n(VM) change \nmanagement  \n \n \n \n5.1. Vulnerability Management \nchange proposal is \nsubmitted to change \nadvisory board (CAB) \naccording to requirement* \n5.2. Vulnerability Management \nchange proposal is \ndeliberated with the change \nadvisory board (CAB)* \n5.3. Approved Vulnerability \nManagement change \nproposal is monitored as \nrelayed by change \nmanager to capacity team \n5.1. Ticket management \nsystems \n5.2. Vulnerability \nmanagement solution \n5.3. Scanning procedures \nbased on vulnerability \nmanagement solution \n5.4. KM usage \n5.5. Vulnerability \nmanagement solution \nusage and operations \n5.6. List of assets \n5.1. Computer \noperation skills \n5.2. Communication \nskills  \n5.3. Interpreting work \ninstructions \n5.4. Interpersonal \nskills \n5.5. Vulnerability \nScanning skills \n5.6. Stakeholder \nmanagement \nskills\n\n--- PDF PAGE 51 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n51 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand subject matter expert \nregarding the requirement \nchange/s * \n5.4. Executed change/s of \nsubject matter expert is \nobserved and validated \nbased on given \nrequirement* \n5.5. Feedback and conclusion \nof change/s request \nprovided by the CAB \nmanager is received and \nanalyzed based on given \nrequirement* \n5.6. Scan is conducted based \non schedule and scope of \nasset that needs to be \nscanned* \n5.7.  Vulnerability scanning \nresults are documented \nand reported* \n5.7. Familiarity on NIST \n800-115 \n5.8. Knowledge in \nOWASP, stride and \nMITRE framework \n \n6. Perform \npatch/ \nremediation \ntesting  \n \n \n6.1. Patch/remediation \nstrategies and solutions are \nacquired from solution \nprovider * \n6.2. Patch and remediation \ntesting executed by the \nsubject matter expert is \nmonitored based on given \nrequirement* \n6.3. Number of failed update, \nfailed patch and adverse \neffect on patch are \ndocumented based on \ngiven standards* \n6.4. Report is delivered to patch \nmanagement team* \n6.1. Ticket management \nsystems \n6.2. Vulnerability \nmanagement solution \n6.3. Scanning procedures \nbased on vulnerability \nmanagement solution \n6.4. Knowledge \nManagement usage \n6.5. Vulnerability \nmanagement solution \nusage and operations \n6.6. List of assets \n6.7. Familiarity on NIST \n800-115 \n6.1. Computer \noperation skills \n6.2. Communication \nskills  \n6.3. Interpreting work \ninstructions \n6.4. Interpersonal \nskills \n6.5. Patch \nManagement \nskills \n6.6. Stakeholder \nmanagement \nskills\n\n--- PDF PAGE 52 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n52 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. NIST standards \nNIST standards may include: \n1.1. NIST 800-115   \n1.2. NIST 800 -53 vulnerability management \n2. Product \nProduct may include:  \n2.1. Tenable,  \n2.2. Qualys,  \n2.3. Fortify \n3. Created \nCreate inventory of assets may include: \n3.1. Collect asset location (e.g, Clark, Davao, Cebu, MM, etc) \n3.2. Collect asset IP and network architecture/design (e.g, \nsegment or VLAN) \n3.3. Collect operating system (e.g, MacOS, iOS, Windows, \nLinux, UNIX, Android, etc) \n3.4. Collect third party software (e.g, CRM, web apps, APKs, \nproductivity software) \n3.5. Collect hosting providers (e.g, AWS, ALI cloud, Azure, \nHuawei, etc.) \n3.6. Collect source code repositories (e.g, Bitbucket, \nSourceForge, ProjectLocker, GitLab, CloudForge, etc) \n4. Parameters \nParameters on how to sort and grouped assets may include: \n4.1. Standard asset classifications \n4.2. Priority assets \n4.3. Legacy assets \n5. Executed \nExecuted changes on may include: \n5.1. Staging environment,  \n5.2. If OK then proceed to production environment  \n5.3. If issue occur, roll back to production environment \n6. Solution Provider Solution Provider may include: \n6.1. internal vendors \n6.2. external vendors \n6.3. software developer\n\n--- PDF PAGE 53 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n53 \nEVIDENCE GUIDE \n \n1. Critical \naspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Installed agent or identify network infrastructure \n1.1.1 Identified vulnerability scanning and management \nsoftware based on NIST standards \n1.1.2 Conducted core product management training of the \nsoftware based on product  \n1.1.3 Conducted product installation and troubleshooting based \non product  \n1.2 Set schedule for scanning \n1.2.1 Performed collaboration with IT and software \ndevelopment team on change management based on \nNIST standards and ITIL version 4 \n1.2.2 Checked production and staging load scheduling based \non NIST standards and ITIL version 4  \n1.2.3 Checked IT, software developer and third-party \nprovider’s availability or schedule based on NIST \nstandards and ITIL version 4 \n1.3 Performed vulnerability asset control (inventory/asset \nmanagement) \n1.3.1 Created inventory of assets for vulnerability scanning \n1.3.2 Performed sorting and grouping of assets inventory \nbased on ISO/IEC 19770 parameters \n1.4 Conducted audit of servers, endpoint and application \n1.4.1 Checked and reviewed access management \n1.4.2 Checked and reviewed configuration management \n1.4.3 Evaluated encryption technology \n1.4.4 Reviewed data retention and data destruction policy \n1.4.5 Reviewed preventive maintenance policy \n1.5 Performed Vulnerability Management (VM) change \nmanagement (configuration management) \n1.5.1 Submitted change proposal by change requestor (CR) \naccording requirement \n1.5.2 Deliberated change proposal by the change advisory \nboard (CAB) \n1.5.3 Relayed approved proposal by change manager to \ncapacity and subject matter expert regarding the \nrequirement change/s \n1.5.4 Executed change/s by the subject matter expert based \non given requirement \n1.5.5 Provided feedback and conclusion of change/s request \nbased on procedures \n1.6 Performed patch and remediation testing and deliver report \n(patch and capacity management) \n1.6.1 Execute patch and remediation testing by based on \ngiven requirement \n1.6.2 Delivered report to patch management team \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Appropriate supplies and materials  \n2.2 Applicable equipment \n2.3 Appropriate software \n2.4 Workplace or assessment area\n\n--- PDF PAGE 54 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n54 \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Written Exam \n4. Context  for \nAssessment \n4.1 Competency may be assessed in the actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
