        "source_text": "--- PDF PAGE 17 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n17 \n \nUNIT OF COMPETENCY :     DEVELOP CAREER AND LIFE DECISIONS  \nUNIT CODE                      :     400311213 \nUNIT DESCRIPTOR         :     This unit covers the knowledge, skills, and attitudes in managing \none’s emotions, developing reflective practice, and boosting self-\nconfidence and developing self-regulation.  \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Manage \none’s \nemotion \n1.1. Self-management \nstrategies are identified \n1.2. Skills to work \nindependently and to \nshow initiative, to be \nconscientious, and \npersevering in the face of \nsetbacks and frustrations \nare developed \n1.3. Techniques for effectively \nhandling negative \nemotions and \nunpleasant situation in \nthe workplace are \nexamined \n \n \n \n1.1  Self-management \nstrategies that assist \nin regulating \nbehavior and \nachieving personal \nand learning goals \n(e.g. Nine self-\nmanagement \nstrategies according \nto Robert Kelley) \n1.2  Enablers and \nbarriers in achieving \npersonal and career \ngoals \n1.3 Techniques in \nhandling negative \nemotions and \nunpleasant situation \nin the workplace \nsuch as frustration, \nanger, worry, \nanxiety, etc. \n1.1  Managing properly \none’s emotions and \nrecognizing situations \nthat cannot be \nchanged and accept \nthem and remain \nprofessional \n1.2  Developing self-\ndiscipline, working \nindependently and \nshowing initiative to \nachieve personal and \ncareer goals \n1.3  Showing confidence, \nand resilience in the \nface of setbacks and \nfrustrations and other \nnegative emotions \nand unpleasant \nsituations in the \nworkplace \n2. Develop \nreflective \npractice \n2.1. Personal strengths and \nachievements, based on \nself-assessment \nstrategies and teacher \nfeedback are \ncontemplated \n2.2. Progress when seeking \nand responding to \nfeedback from teachers \nto assist them in \nconsolidating strengths, \naddressing weaknesses \nand fulfilling their \npotential are monitored \n2.3. Outcomes of personal \nand academic challenges \nby reflecting on previous \nproblem solving and \ndecision making \nstrategies and feedback \nfrom peers and teachers \nare predicted \n2.1 Basic SWOT \nanalysis \n2.2 Strategies to improve \none’s attitude in the \nworkplace \n2.3 Gibbs’ Reflective \nCycle/Model \n(Description, \nFeelings, Evaluation, \nAnalysis, \nConclusion, and \nAction plan) \n2.1 Using the basic \nSWOT analysis as \nself-assessment \nstrategy \n2.2 Developing reflective \npractice through \nrealization of  \nlimitations,  likes/ \ndislikes;  through \nshowing of self-\nconfidence   \n2.3 Demonstrating self-\nacceptance and \nbeing able to accept \nchallenges\n\n--- PDF PAGE 18 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n18 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Boost self-\nconfidence \nand \ndevelop \nself-\nregulation \n3.1. Efforts for continuous \nself-improvement are \ndemonstrated \n3.2. Counter-productive \ntendencies at work are \neliminated \n3.3. Positive outlook in life are \nmaintained.  \n \n3.1 Four components of \nself-regulation based \non Self-Regulation \nTheory (SRT) \n3.2 Personality \ndevelopment \nconcepts \n3.3  Self-help concepts \n(e. g., 7 Habits by \nStephen Covey, \ntransactional \nanalysis, psycho-\nspiritual concepts) \n3.1 Performing effective \ncommunication skills – \nreading, writing, \nconversing skills \n3.2 Showing affective \nskills – flexibility, \nadaptability, etc. \n3.3 Self-assessment for \ndetermining one’s \nstrengths and \nweaknesses\n\n--- PDF PAGE 19 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n19 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Self-management \nstrategies \nMay include but not limited to: \n1.1 Seeking assistance in the form of job coaching or \nmentoring  \n1.2 Continuing dialogue to tackle workplace grievances \n1.3 Collective negotiation/bargaining for better working \nconditions \n1.4 Share your goals to improve with a trusted co-\nworker or supervisor \n1.5 Make a negativity log of every instance when you \ncatch yourself complaining to others \n1.6 Make lists and schedules for necessary activities \n2. Unpleasant situation \nMay include but not limited to: \n2.1 Job burn-out \n2.2 Drug dependence \n2.3 Sulking \n \n \n \nEVIDENCE GUIDE \n1 Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Express emotions appropriately \n1.2 Work independently and show initiative \n1.3 Consistently demonstrate self-confidence and self-\ndiscipline  \n2 Resource   \nImplications \nThe following resources should be provided: \n2.1 Access to workplace and resource s \n2.2 Case studies  \n3 Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration or simulation with oral questioning \n3.2 Case problems involving work improvement and \nsustainability issues \n3.3 Third-party report \n4 Context for \nAssessment \n4.1 Competency assessment may occur in workplace or any \nappropriately simulated environment\n",
