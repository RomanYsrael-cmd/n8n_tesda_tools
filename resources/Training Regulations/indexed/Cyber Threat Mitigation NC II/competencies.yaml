        "source_text": "ICT251315\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required\nto perform vulnerability management/control. It includes\ncompetencies in installing agent or identifying network\ninfrastructure (product usage or management); setting\nschedule for scanning; performing vulnerability asset\ncontrol (inventory/asset management); conducting audit of\nservers, endpoint and application; performing vulnerability\nManagement (VM) change management (configuration\nmanagement); and performing patch and remediation testing\nand deliver report (patch and capacity management).\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Install agent\n\n1.1. Vulnerability scanning and\nmanagement software are\nidentified based on NIST\nstandards *\n1.2. Core product management\ntraining of the software is\nconducted based on\nproduct *\n1.3. Product installation is\nconducted based on\nproduct manual *\n1.4. Product installation and\nconfiguration is verified\nbased on NIST 800-115 *\n1.1. Ticket management\nsystems\n1.2. Vulnerability\nmanagement solution\n1.3. Knowledge\nManagement usage\n1.4. Verification of installed\nproduct\n1.5. Knowledge on NIST\n800-115\n1.6. Knowledge in\nOperating Systems\n1.1. Computer\noperation skills\n1.2. Operating\nsystems\noperation\n1.3. Communication\nskills\n1.4. Interpreting\nwork\ninstructions\n1.5. Interpersonal\nskills\n2. Perform\nvulnerability\nasset control\n\n2.1. Access to inventory\nmanagement is\ncoordinated with IT Service\nManagement team\n2.2. Inventory of assets is\ncreated for vulnerability\nscanning *\n2.3. Sorting and grouping of\nassets inventory is\nperformed based on\nISO/IEC 19770\nparameters*\n2.1. Inventory check of\ndevices assets and\ninfrastructure that\nneeds to undergo\nvulnerability scanning\n2.2. Vulnerability\nmanagement solution\nscan and operations\nprocedure\n2.3. Documentation of\ninventory check\nFamiliarity on\nISO/"
