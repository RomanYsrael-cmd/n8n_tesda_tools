        "source_text": "--- PDF PAGE 13 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n13 \nUNIT OF COMPETENCY:    SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS \n \nUNIT CODE                     :    400311212 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes required \nto apply problem-solving techniques to determine the origin \nof problems and plan for their resolution. It also includes \naddressing procedural problems through documentation, \nand referral. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify \nroutine \nproblems \n1.1  Routine problems or \nprocedural problem \nareas are identified \n1.2  Problems to be \ninvestigated are  defined \nand determined \n1.3  Current conditions of the \nproblem are identified \nand documented \n1.1 Current industry \nhardware and \nsoftware products \nand services \n1.2 Industry \nmaintenance, \nservice and \nhelpdesk \npractices, \nprocesses and \nprocedures \n1.3 Industry standard \ndiagnostic tools \n1.4 Malfunctions and \nresolutions \n \n1.1 Identifying current \nindustry hardware and \nsoftware products and \nservices \n1.2 Identifying current \nindustry maintenance, \nservices and helpdesk \npractices, processes \nand procedures. \n1.3 Identifying current \nindustry standard \ndiagnostic tools \n1.4 Describing common \nmalfunctions and \nresolutions. \n1.5 Determining the root \ncause of a routine \nmalfunction \n \n2. Look for \nsolutions to \nroutine \nproblems \n2.1 Potential solutions to \nproblem are identified \n2.2 Recommendations \nabout possible \nsolutions are \ndeveloped, \ndocumented, ranked \nand presented to \nappropriate person \nfor decision \n2.1 Current industry \nhardware and \nsoftware products \nand services \n2.2 Industry service \nand helpdesk \npractices, \nprocesses and \nprocedures \n2.3 Operating systems \n2.4 Industry standard \ndiagnostic tools \n2.5 Malfunctions and \nresolutions. \n2.6 Root cause \nanalysis \n2.1 Identifying current \nindustry hardware and \nsoftware products and \nservices \n2.2 Identifying services \nand helpdesk \npractices, processes \nand procedures. \n2.3 Identifying operating \nsystem \n2.4 Identifying current \nindustry standard \ndiagnostic tools \n2.5 Describing common \nmalfunctions and \nresolutions. \n2.6 Determining the root \ncause of a routine \nmalfunction\n\n--- PDF PAGE 14 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n14 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Recommend \nsolutions to \nproblems \n3.1 Implementation of \nsolutions are planned \n3.2 Evaluation of \nimplemented solutions \nare planned \n3.3 Recommended \nsolutions are \ndocumented and \nsubmit to appropriate \nperson for confirmation \n \n3.1 Standard \nprocedures \n3.2 Documentation \nproduce  \n3.1 Producing \ndocumentation that \nrecommends solutions \nto problems \n3.2 Following established \nprocedures\n\n--- PDF PAGE 15 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n15 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Problems/Procedural \nProblem \n \nMay include but not limited to: \n1.1 \nRoutine/non – routine processes and quality problems \n1.2 \nEquipment selection, availability and failure \n1.3 \nTeamwork and work allocation problem \n1.4 \nSafety and emergency situations and incidents \n1.5 \n Work-related problems outside of own work area \n2. Appropriate person \nMay include but not limited to: \n2.1 \nSupervisor or manager \n2.2 \nPeers/work colleagues \n2.3 \nOther members of the organization \n3. \nDocument \n \nMay include but not limited to: \n3.1 \nElectronic mail \n3.2 \nBriefing notes \n3.3 \nWritten report \n3.4 \nEvaluation report \n4. \nPlan  \n \nMay include but not limited to: \n4.1 \nPriority requirements \n4.2 \nCo-ordination and feedback requirements \n4.3 \nSafety requirements \n4.4 \nRisk assessment \n4.5 \nEnvironmental requirements\n\n--- PDF PAGE 16 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n16 \nEVIDENCE GUIDE \n       \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Determined the root cause of a routine problem \n1.2. Identified solutions to procedural problems. \n1.3. Produced documentation that recommends solutions to \nproblems. \n1.4. Followed established procedures. \n1.5. Referred unresolved problems to support persons. \n2. Resource \nImplications \n2.1. Assessment will require access to a workplace over an \nextended period, or a suitable method of gathering evidence \nof operating ability over a range of situations. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Case Formulation \n3.2. Life Narrative Inquiry \n3.3. Standardized test \n \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of parts \nof this unit of competency. Simulation should be based on the \nactual workplace and will include walk through of the relevant \ncompetency components. \n4. Context for \nAssessment \n4.1. Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
