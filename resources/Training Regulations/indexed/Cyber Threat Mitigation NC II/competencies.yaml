  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Cyber Threat Mitigation NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 400311210\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning ,\nactive listening and\nspeaking skills are used\nto gather and convey\ninformation\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n1.1 Effective\ncommunication\n1.2 Different modes\nof communication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\ncommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple written\nnotices\n1.3 Participating in\nworkplace meetings and\ndiscussions\n1.4 Preparing work- related\ndocuments\n1.5 Estimating, calculating\nand recording routine\nworkplace measures\n1.6 Relating/ Interacting\nwith people of various\nlevels in the workplace\n1.7 Gathering and providing\nbasic information in\nresponse to workplace\nrequirements\n1.8 Basic business writing\nskills\n1.9 Interpersonal skills in\nthe workplace\n1.10 Active-listening skills\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are read\nand interpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are followed\nbased on established\nprocedures\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes\nof communication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple written\nnotices\n2.3 Participating in\nworkplace meetings and\ndiscussions\n2.4 Completing work-\nrelated documents\n\n--- PDF PAGE 7 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n7\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.3 Feedback is given to\nworkplace supervisor\nbased instructions/\ninformation received\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and matters\nconcerning conditions of\nemployment are sought\nand asked from\nappropriate sources\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n2.5 Estimating, calculating\nand recording routine\nworkplace measures\n2.6 Relating/ Responding to\npeople of various levels\nin the workplace\n2.7 Gathering and providing\ninformation in response\nto workplace\nrequirements\n2.8 Basic questioning/\nquerying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n3. Complete\nrelevant\nwork related\ndocuments\n3.1 Range of forms relating\nto conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.4 Reporting requirements\nto supervisor are\ncompleted according to\norganizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes\nof communication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n3.1 Completing work-\nrelated documents\n3.2 Applying operations of\naddition, subtraction,\ndivision and\nmultiplication\n3.3 Gathering and providing\ninformation in response\nto workplace\nrequirements\n3.4 Effective record keeping\nskills\n\n--- PDF PAGE 8 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace interactions\nMay include:\n4.1.\nFace to face\n4.2.\nTelephone\n4.3.\nElectronic and two way radio\n4.4.\nWritten including electronic, memos, instruction\nand forms,\n4.5.\nNon-verbal including gestures, signals, signs\nand diagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 9 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n9\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format\nof the organization\n1.2. Accessed information using workplace communication\nequipment/systems\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Notebook / Writing materials\n2.4. Computer with internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nDemonstration with oral questioning\n3.2.\nInterview\n3.3.\nWritten test\n3.4.\nThird-party report\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 10 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n10\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 400311211\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify\none’s roles and responsibilities as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Describe team\nrole and scope\n1.1. The role and objective of\nthe team is identified from\navailable sources of\ninformation\n1.2. Team parameters, reporting\nrelationships and\nresponsibilities are identified\nfrom team discussions and\nappropriate external sources\n\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating with\nothers, appropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways in\nimproving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin team\n2.1. Individual role and\nresponsibilities within the\nteam environment are\nidentified\n2.2. Roles and objectives of the\nteam is identified from\navailable source of\ninformation\n2.3. Team parameters, reporting\nrelationships and\nresponsibilities are identified\nbased on team discussions\nand appropriate external\nsources\n2.1. Team roles and\nobjectives\n2.2. Team structure\nand parameters\n2.3. Team\ndevelopment\n2.4. Sources of\ninformation\n2.1. Communicating with\nothers, appropriately\nconsistent with the\nculture of the\nworkplace\n2.2. Developing ways in\nimproving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n3. Work as a\nteam member\n3.1. Effective and appropriate\nforms of communications are\nused and interactions\nundertaken with team\nmembers based on company\npractices\n3.2. Effective and appropriate\ncontributions is made to\ncomplement team activities\nand objectives based on\nworkplace context\n3.3. Protocols in reporting are\nobserved based on standard\ncompany practices\n3.4. Contribute to the development\nof team work plans based on\nan understanding of team’s\nrole and objectives\n3.1. Communication\nprocess\n3.2. Workplace\ncommunication\nprotocol\n3.3. Team planning\nand decision\nmaking\n3.4. Team thinking\n3.5. Team roles\n3.6. Process of\nteam\ndevelopment\n3.7. Workplace\ncontext\n3.1. Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n3.2. Interacting\neffectively with\nothers\n3.3. Deciding as an\nindividual and as a\ngroup using group\nthink strategies and\ntechniques\n3.4. Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 11 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n11\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\nMay include but not limited to:\n1.1.\nWork activities in a team environment with enterprise\nor specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\nMay include but not limited to:\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include but not limited to:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 12 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n12\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Role play involving the participation of individual member to\nthe attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n3.4 Socio-drama and socio-metric methods\n3.5 Sensitivity techniques\n3.6 Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 13 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n13\nUNIT OF COMPETENCY: SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS\n\nUNIT CODE : 400311212\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply problem-solving techniques to determine the origin\nof problems and plan for their resolution. It also includes\naddressing procedural problems through documentation,\nand referral.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems or\nprocedural problem\nareas are identified\n1.2 Problems to be\ninvestigated are defined\nand determined\n1.3 Current conditions of the\nproblem are identified\nand documented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk\npractices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying current\nindustry hardware and\nsoftware products and\nservices\n1.2 Identifying current\nindustry maintenance,\nservices and helpdesk\npractices, processes\nand procedures.\n1.3 Identifying current\nindustry standard\ndiagnostic tools\n1.4 Describing common\nmalfunctions and\nresolutions.\n1.5 Determining the root\ncause of a routine\nmalfunction\n\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential solutions to\nproblem are identified\n2.2 Recommendations\nabout possible\nsolutions are\ndeveloped,\ndocumented, ranked\nand presented to\nappropriate person\nfor decision\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating systems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying current\nindustry hardware and\nsoftware products and\nservices\n2.2 Identifying services\nand helpdesk\npractices, processes\nand procedures.\n2.3 Identifying operating\nsystem\n2.4 Identifying current\nindustry standard\ndiagnostic tools\n2.5 Describing common\nmalfunctions and\nresolutions.\n2.6 Determining the root\ncause of a routine\nmalfunction\n\n--- PDF PAGE 14 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n14\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are planned\n3.2 Evaluation of\nimplemented solutions\nare planned\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to appropriate\nperson for confirmation\n\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation that\nrecommends solutions\nto problems\n3.2 Following established\nprocedures\n\n--- PDF PAGE 15 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n15\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include but not limited to:\n1.1\nRoutine/non – routine processes and quality problems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and incidents\n1.5\n Work-related problems outside of own work area\n2. Appropriate person\nMay include but not limited to:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include but not limited to:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include but not limited to:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 16 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n16\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Determined the root cause of a routine problem\n1.2. Identified solutions to procedural problems.\n1.3. Produced documentation that recommends solutions to\nproblems.\n1.4. Followed established procedures.\n1.5. Referred unresolved problems to support persons.\n2. Resource\nImplications\n2.1. Assessment will require access to a workplace over an\nextended period, or a suitable method of gathering evidence\nof operating ability over a range of situations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Case Formulation\n3.2. Life Narrative Inquiry\n3.3. Standardized test\n\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 17 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n17\n\nUNIT OF COMPETENCY : DEVELOP CAREER AND LIFE DECISIONS\nUNIT CODE : 400311213\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitudes in managing\none’s emotions, developing reflective practice, and boosting self-\nconfidence and developing self-regulation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Manage\none’s\nemotion\n1.1. Self-management\nstrategies are identified\n1.2. Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the face of\nsetbacks and frustrations\nare developed\n1.3. Techniques for effectively\nhandling negative\nemotions and\nunpleasant situation in\nthe workplace are\nexamined\n\n1.1 Self-management\nstrategies that assist\nin regulating\nbehavior and\nachieving personal\nand learning goals\n(e.g. Nine self-\nmanagement\nstrategies according\nto Robert Kelley)\n1.2 Enablers and\nbarriers in achieving\npersonal and career\ngoals\n1.3 Techniques in\nhandling negative\nemotions and\nunpleasant situation\nin the workplace\nsuch as frustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing properly\none’s emotions and\nrecognizing situations\nthat cannot be\nchanged and accept\nthem and remain\nprofessional\n1.2 Developing self-\ndiscipline, working\nindependently and\nshowing initiative to\nachieve personal and\ncareer goals\n1.3 Showing confidence,\nand resilience in the\nface of setbacks and\nfrustrations and other\nnegative emotions\nand unpleasant\nsituations in the\nworkplace\n2. Develop\nreflective\npractice\n2.1. Personal strengths and\nachievements, based on\nself-assessment\nstrategies and teacher\nfeedback are\ncontemplated\n2.2. Progress when seeking\nand responding to\nfeedback from teachers\nto assist them in\nconsolidating strengths,\naddressing weaknesses\nand fulfilling their\npotential are monitored\n2.3. Outcomes of personal\nand academic challenges\nby reflecting on previous\nproblem solving and\ndecision making\nstrategies and feedback\nfrom peers and teachers\nare predicted\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to improve\none’s attitude in the\nworkplace\n2.3 Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings, Evaluation,\nAnalysis,\nConclusion, and\nAction plan)\n2.1 Using the basic\nSWOT analysis as\nself-assessment\nstrategy\n2.2 Developing reflective\npractice through\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating self-\nacceptance and\nbeing able to accept\nchallenges\n\n--- PDF PAGE 18 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n18\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Boost self-\nconfidence\nand\ndevelop\nself-\nregulation\n3.1. Efforts for continuous\nself-improvement are\ndemonstrated\n3.2. Counter-productive\ntendencies at work are\neliminated\n3.3. Positive outlook in life are\nmaintained.\n\n3.1 Four components of\nself-regulation based\non Self-Regulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help concepts\n(e. g., 7 Habits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n3.1 Performing effective\ncommunication skills –\nreading, writing,\nconversing skills\n3.2 Showing affective\nskills – flexibility,\nadaptability, etc.\n3.3 Self-assessment for\ndetermining one’s\nstrengths and\nweaknesses\n\n--- PDF PAGE 19 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n19\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include but not limited to:\n1.1 Seeking assistance in the form of job coaching or\nmentoring\n1.2 Continuing dialogue to tackle workplace grievances\n1.3 Collective negotiation/bargaining for better working\nconditions\n1.4 Share your goals to improve with a trusted co-\nworker or supervisor\n1.5 Make a negativity log of every instance when you\ncatch yourself complaining to others\n1.6 Make lists and schedules for necessary activities\n2. Unpleasant situation\nMay include but not limited to:\n2.1 Job burn-out\n2.2 Drug dependence\n2.3 Sulking\n\nEVIDENCE GUIDE\n1 Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-\ndiscipline\n2 Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resource s\n2.2 Case