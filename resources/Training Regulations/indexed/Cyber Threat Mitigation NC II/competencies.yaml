        "source_text": "ICT315202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to apply quality standards in the workplace. The\nunit also includes the application of relevant safety procedures\nand regulations, organization procedures and customer\nrequirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess\nquality of\nreceived\nmaterials or\ncomponents\n1.1. Work instructions are obtained\nand work is carried out in\naccordance with standard\noperating procedures\n1.2. Received materials or\ncomponent parts are checked\nagainst workplace standards\nand specifications\n1.3. Faulty material or components\nrelated to work are identified\nand isolated\n1.4. Faults and any identified\ncauses are recorded and/or\nreported to the supervisor\nconcerned in accordance with\nworkplace procedures\n1.5. Faulty materials or\ncomponents are replaced in\naccordance with workplace\nprocedures\n1.1. Relevant\nproduction\nprocesses,\nmaterials and\nproducts\n1.2. Characteristics of\nmaterials,\nsoftware and\nhardware used in\nproduction\nprocesses\n1.3. Quality checking\nprocedures\n1.4. Quality Workplace\nprocedures\n1.5. Identification of\nfaulty materials\nrelated to work\n1.1. Reading skills\nrequired to\ninterpret work\ninstruction\n1.2. Critical thinking\n1.3. Interpreting\nwork\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company is\nidentified and used\n2.2. Completed work is checked\nagainst workplace standards\nrelevant to the task undertaken\n2.3. Errors are identified and\nisolated\n2.4. Information on the quality and\nother indicators of production\nperformance is recorded in\naccordance with workplace\nprocedures\n2.5. In cases of deviations from\nspecified quality standards,\ncauses are documented and\nreported in accordance with\nthe workplace’ standards\noperating procedures\n2.1. Safety and\nenvironmental\naspects of\nproduction\nprocesses\n2.2. Fault identification\nand reporting\n2.3. Workplace\nprocedure in\ndocumenting\ncompleted work\n2.4. Workplace Quality\nIndicators\n2.1. Carry out work\nin accordance\nwith OHS\npolicies and\nprocedures\n\n--- PDF PAGE 35 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n35\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Engage in\nquality\nimprovement\n3.1. Process improvement\nprocedures are participated in\nrelation to workplace\nassignment\n3.2. Work is carried out in\naccordance with process\nimprovement procedures\n3.3. Performance of operation or\nquality of product or service to\nensure customer satisfaction\nis monitored\n3.1. Quality\nimprovement\nprocesses\n3.2. Company\ncustomers defined\n3.1. Solution\nproviding and\ndecision-\nmaking\n3.2. Practice\ncompany\nprocess\nimprovement\nprocedure\n\n--- PDF PAGE 36 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMaterials may include but not limited to:\n1.1. Manuals\n1.2. Job orders\n1.3. Instructional videos\n2. Faults\nFaults may include but not limited to:\n2.1. Materials not to specification\n2.2. Materials contain incorrect/outdated information\n2.3. Hardware defects\n2.4. Materials that do not conform with any regulatory\nagencies\n3. Documentation\nDocumentation may include:\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Errors\nErrors may be related but not limited to the following:\n4.1. Deviation from the requirements of the Client\n4.2. Deviation from the requirement of the organization\n5. Quality standards\n\nQuality standards may be related but not limited to the\nfollowing:\n5.1. Materials\n5.2. Hardware\n5.3. Final product\n5.4. Production processes\n5.5. Customer service\n6. Customer\nCustomer may include:\n6.1. Co-worker\n6.2. Supplier/Vendor\n6.3. Client\n6.4. Organization receiving the product or service\n\n--- PDF PAGE 37 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n37\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Method of assessment\nThe assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1. Observation\n2.2. Questioning\n2.3. Practical demonstration\n3. Resource implication\n\nThe following resources should be provided:\n3.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n4. Context for Assessment\n\n4.1. Assessment may be conducted in the workplace\nor in a simulated environment.\n\n--- PDF PAGE 38 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n38\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n:"
