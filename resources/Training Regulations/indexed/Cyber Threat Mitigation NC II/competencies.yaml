        "source_text": "ICT251314\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required\nto perform threat mitigation. This includes competencies in\nevaluating incidents; using threat intelligence; analyzing running\nprocesses and configurations on affected systems; carrying\nout in-depth threat intelligence analysis; and creating and\nimplementing strategy for containment and recovery.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check for\nincidents\n\n1.1. Alerts are validated\nbased on the report.\n1.2. Product detection is\nperformed based on the\n8-point incidence\nresponse.\n1.3. Incident classification is\nidentified based on\nenvironment.\n1.4. Incident criticality is\nprioritized according to\nimpact on the asset.\n\n1.1. Knowledge in Incident\nResponse\n1.2. Basic knowledge with\nWindows, MAC & Linux\nOS\n1.3. Basic knowledge with\nWeb server and website\ndesign and architecture\n1.4. Basic knowledge with\nany scripting and coding\nlanguage, i.e. PHP,\nPython, Java, Visual\nBasic and others\n1.5. Basic knowledge with\nnetwork infrastructure\nand architecture, i.e.\nLAN, WAN, port\nforwarding\n1.6. Basic knowledge on\ndetection and alerting\n(log management)\n1.7. Basic knowledge in\noperating security\nsolution (i.e. scanning\nand operations\nprocedure)\n1.8. Security solution\nseverity classifications\n1.9. Malicious software\nbehaviors\n1.1. Incident\nresponse Skills\n1.2. Determining the\npriority, scope\nand root cause\nof the incident\n1.3. Computer\noperation skills\n1.4. Communication\nskills\n1.5. Interpreting\nwork\ninstructions\n1.6. Interpersonal\nskills\n1.7. Data analysis\nskills\n2. Use cyber\nthreat\nintelligence\n\n2.1. Received threat\nintelligence is utilized to\nidentify tactics,\ntechniques and\nprocedures (TTP) of\nthreat actors (hackers).\n[NIST SP 800-150 & 800-\n172]\n2.1. Basic Cyber Threat\nIntelligence knowledge\n2.1.1. Threat\nintelligence\nsource\n2.1.2. IOCs\n2.1.3. NIST 800-150\n2.1.4. NIST 800-172\n2.2. Basic knowledge on :\n1.1.1. Cyber Kill Chain,\n2.1. Cyber Threat\nIntelligence\n(CTI) Skills\n2.2. Using various\nthreat\nintelligence\nplatforms\n2.3. Able to analyze\nand provide\nContext for intel\n\n--- PDF PAGE 43 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n43\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.2. Indicator of\ncompromise (IOCs) is\ncounter-checked with\nother sources\n2.3. Applicability of IOC is\nchecked versus available\ninfrastructure\n2.4. Preventive\naction/resolution is\napplied by blocking\nidentified IOCs on\navailable security\ntechnology appliances\n2.5. Continuous monitoring is\nconducted to detect\nattempts of download,\naccess and interaction\nwith the malicious IOCs\n2.6. Current threat\nintelligence and threat\nmitigation activities are\ndefined and added to\nknowledge-based\nsystems.\n\n1.1.2. MITRE ATT&CK\nFramework,\n1.1.3. Diamond Model,\nand\n1.1.4. Pyramid of Pain\nfor CTI\n2.3. Knowledge in Incident\nResponse\n2.4. Basic knowledge with\nWindows, MAC & Linux\nOS\n2.5. Basic knowledge with\nWeb server and website\ndesign and architecture\n2.6. Basic knowledge with\nany scripting and coding\nlanguage, i.e. PHP,\nPython, Java, Visual\nBasic and others\n2.7. Basic knowledge with\nnetwork infrastructure\nand architecture, i.e.\nLAN, WAN, port\nforwarding\n2.8. Basic knowledge on\ndetection and alerting\n(log management)\n2.9. Basic knowledge in\noperating security\nsolution (i.e. scanning\nand operations\nprocedure)\n2.10. Security solution\nseverity classifications\n2.11. Malicious software\nbehaviors\nreports to their\norganization\n2.4. CTI analysis\nskills\n2.5. Leveraging/\nUtilizing IOCs to\nimprove\nsecurity controls\ndetections and\nmitigations\n2.6. Providing CTI\nreports\n2.7. Can Articulate\nthe Cyber Kill\nChain, MITRE\nATT&CK\nFramework,\nDiamond\nModel, and\nPyramid of Pain\nfor CTI\n2.8. Computer\noperation skills\n2.9. Communication\nskills\n2.10. Interpreting\nwork\ninstructions\n2.11. Interpersonal\nskills\n2.12. Data analysis\nskills\n\n--- PDF PAGE 44 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n44\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Check\nrunning\nprocesses\nand configs\non affected\nsystems\n3.1. Common security tools\nand security products\navailable are utilized,\nwhen necessary\n3.2. Known and common\nfolder or location is\nchecked for possible\ninstalled malicious files.\n3.3. File integrity is verified\nand monitored by tools\nand security products\nbased on original\ninstallation package or\ndigitally signed files from\nvendors-white listing\n3.4. Tools and security\nproduct are used to\nconfirm detection of\nmalicious activity, files,\nfolder and packets\n3.1. Systems operations\n3.1.1. Linux, i.e.\nProcMon-for-\nLinux\n3.1.2. Windows, i.e. MS\nSysinternals\n3.2. Common security tools\nand security products\n3.2.1. EDR\n3.2.2. MDR\n3.2.3. XDR\n3.2.4. UEBA\n3.3. Security solution usage\nand operations\n3.4. File level analysis\n\n3.1. Operating\nsystems\noperation\n3.2. Computer\noperation skills\n3.3. Communication\nskills\n3.4. Interpreting\nwork\ninstructions\n3.5. Interpersonal\nskills\n3.6. Monitoring skills\n3.7. Data analysis\nskills\n4. Implement\nstrategy for\ncontainment\nand recovery\n\n4.1. TTP and IOCs are\nidentified based on the\ndetection and\nrecommendation of the\nsecurity products\n4.2. IOCs are blocked and\ncontained using the\nfeatures of EDR, NGAV\nand next generation\nfirewall (NGFW)\n4.3. Continuous monitoring is\nconducted to detect\nattempts of download,\naccess and interaction\nwith the malicious IOCs\n4.4. Current threat mitigation\nactivities are defined and\nadded to knowledge-\nbased systems