        "source_text": "400311216\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto identify OSH compliance requirements, prepare OSH\nrequirements for compliance, and perform tasks in\naccordance with relevant OSH policies and procedures\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1. Relevant OSH\nrequirements, regulations,\npolicies and procedures\nare identified in accordance\nwith workplace policies and\nprocedures\n1.2. OSH activity non-\nconformities are conveyed to\nappropriate personnel\n1.3. OSH preventive and\ncontrol requirements are\nidentified in accordance with\nOSH work policies and\nprocedures\n\n1.1. OSH preventive and\ncontrol requirements\n1.2. Hierarchy of Controls\n1.3. Hazard Prevention\nand Control\n1.4. General OSH\nprinciples\n1.5. Work standards and\nprocedures\n1.6. Safe handling\nprocedures of tools,\nequipment and\nmaterials\n1.7. Standard emergency\nplan and procedures\nin the workplace\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n\n2. Prepare OSH\nrequirements\nfor\ncompliance\n\n2.1. OSH work activity material,\ntools and equipment\nrequirements are identified in\naccordance with workplace\npolicies and procedures\n2.2. Required OSH materials,\ntools and equipment are\nacquired in accordance with\nworkplace policies and\nprocedures\n2.3. Required OSH materials,\ntools and equipment are\narranged/ placed in\naccordance with OSH work\nstandards\n2.1. Resources\nnecessary to\nexecute hierarchy of\ncontrols\n2.2. General OSH\nprinciples\n2.3. Work standards and\nprocedures\n2.4. Safe handling\nprocedures of tools,\nequipment and\nmaterials\n2.5. Different OSH\ncontrol measures\n\n2.1. Communication\nskills\n2.2. Estimation skills\n2.3. Interpersonal\nskills\n2.4. Critical thinking\nskills\n2.5. Observation\nskills\n2.6. Material, tool\nand equipment\nidentification\nskills\n\n3. Perform tasks\nin accordance\nwith relevant\nOSH policies\nand\nprocedures\n\n3.1. Relevant OSH work\nprocedures are identified in\naccordance with workplace\npolicies and procedures\n3.2. Work Activities are executed\nin accordance with OSH\nwork standards\n3.3. Non-compliance work\nactivities are reported to\nappropriate personnel\n3.1. OSH work standards\n3.2. Industry related work\nactivities\n3.3. General OSH\nprinciples\n3.4. OSH Violations\n3.5. Non-compliance work\nactivities\n\n3.1. Communication\nskills\n3.2. Interpersonal\nskills\n3.3. Troubleshooting\nskills\n3.4. Critical thinking\nskills\n3.5. Observation\nskills\n\n--- PDF PAGE 28 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies\nand Procedures\nMay include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPermit to Operate\n1.6\nPhilippine Occupational Safety and Health Standards\n1.7\nDepartment Order No. 13 (Construction Safety and\nHealth)\n1.8\nECC regulations\n2. Appropriate Personnel May include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n3. OSH Preventive and\nControl Requirements\nMay include:\n3.1 Resources needed for removing hazard effectively\n3.2 Resources needed for substitution or replacement\n3.3 Resources needed to establishing engineering controls\n3.4 Resources needed for enforcing administrative controls\n3.5 Personal Protective equipment\n4. Non OSH-Compliance\nWork Activities\nMay include non-compliance or observance of the following\nsafety measures:\n4.1 Violations that may lead to serious physical harm or\ndeath\n4.2 Fall Protection\n4.3 Hazard Communication\n4.4 Respiratory Protection\n4.5 Power Industrial Trucks\n4.6 Lockout/Tag-out\n4.7 Working at heights (use of ladder, scaffolding)\n4.8 Electrical Wiring Methods\n4.9 Machine Guarding\n4.10 Electrical General Requirements\n4.11 Asbestos work requirements\n4.12 Excavations work requirements\n\n--- PDF PAGE 29 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n29\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Convey OSH work non-conformities to appropriate\npersonnel\n1.2. Identify OSH preventive and control requirements\nin accordance with OSH work policies and\nprocedures\n1.3. Identify OSH work activity material, tools and\nequipment requirements in accordance with\nworkplace policies and procedures\n1.4. Arrange/Place required OSH materials, tools and\nequipment in accordance with OSH work standards\n1.5. Execute work activities in accordance with OSH\nwork standards\n1.6. Report OSH activity non-compliance work activities\nto appropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1. Facilities, materials tools and equipment necessary\nfor the activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1. Observation/Demonstration with oral questioning\n3.2. 3.2 Third party report\n4. Context for Assessment 4.1. Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 30 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n30\n\nUNIT OF COMPETENCY\n\n:\n\nEXERCISE EFFICIENT AND EFFECTIVE\nSUSTAINABLE PRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:"
