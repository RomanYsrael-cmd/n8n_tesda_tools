        "source_title": "WORK IN TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 10 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n10 \nUNIT OF COMPETENCY:   WORK IN TEAM ENVIRONMENT \nUNIT CODE \n    :     400311211 \nUNIT DESCRIPTOR     : \nThis unit covers the skills, knowledge and attitudes to identify \none’s roles and responsibilities as a member of a team. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Describe team \nrole and scope \n1.1. The role and objective of \nthe team is identified from \navailable sources of \ninformation \n1.2. Team parameters, reporting \nrelationships and \nresponsibilities are identified \nfrom team discussions and \nappropriate external sources  \n \n1.1 Group structure \n1.2 Group \ndevelopment \n1.3 Sources of \ninformation \n1.1 Communicating with \nothers, appropriately \nconsistent with the \nculture of the \nworkplace \n1.2 Developing ways in \nimproving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization \n2. Identify one’s \nrole and \nresponsibility \nwithin team \n2.1. Individual role and \nresponsibilities within the \nteam environment are \nidentified \n2.2. Roles and objectives of the \nteam is identified from \navailable source of \ninformation \n2.3. Team parameters, reporting \nrelationships and \nresponsibilities are identified \nbased on team discussions \nand appropriate external \nsources \n2.1. Team roles and \nobjectives  \n2.2. Team structure \nand parameters \n2.3. Team \ndevelopment \n2.4. Sources of \ninformation \n2.1. Communicating with \nothers, appropriately \nconsistent with the \nculture of the \nworkplace \n2.2. Developing ways in \nimproving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization \n3. Work as a \nteam member \n3.1. Effective and appropriate \nforms of communications are \nused and interactions \nundertaken with team \nmembers based on company \npractices \n3.2. Effective and appropriate \ncontributions is made to \ncomplement team activities \nand objectives based on \nworkplace context \n3.3. Protocols in reporting are \nobserved based on standard \ncompany practices \n3.4. Contribute to the development \nof team work plans based on \nan understanding of  team’s \nrole and objectives  \n3.1. Communication \nprocess \n3.2. Workplace \ncommunication \nprotocol \n3.3. Team planning \nand decision \nmaking \n3.4. Team thinking \n3.5. Team roles \n3.6.  Process of \nteam \ndevelopment \n3.7. Workplace \ncontext \n3.1. Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n3.2. Interacting \neffectively with \nothers \n3.3. Deciding as an \nindividual and as a \ngroup using group \nthink strategies and \ntechniques \n3.4. Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 11 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n11 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Role and objective of \nteam  \nMay include but not limited to: \n1.1. \nWork  activities in a team environment with enterprise \nor specific sector \n1.2. \nLimited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a team \nenvironment \n2. Sources of \ninformation \nMay include but not limited to: \n2.1. \nStandard operating and/or other workplace procedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s specifications and \ninstructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \nMay include but not limited to: \n3.1. \nWork procedures and practices \n3.2. \nConditions of  work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 12 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n12 \nEVIDENCE GUIDE \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1.  Worked in a team to complete workplace activity \n1.2. Worked effectively with others \n1.3. Conveyed information in written or oral form \n1.4. Selected and used appropriate workplace language \n1.5. Followed designated work plan for the job \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2.   Materials relevant to the proposed activity or tasks \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Role play involving the participation of individual member to \nthe attainment of organizational goal \n3.3.  Case studies and scenarios as a basis for discussion of  \nissues and strategies in teamwork \n3.4    Socio-drama and socio-metric methods \n3.5    Sensitivity techniques \n3.6    Written Test \n4. Context for \nAssessment \n4.1. Competency may be assessed in workplace or in a simulated \nworkplace setting \n4.2. Assessment shall be observed while task are being \nundertaken whether individually or in group\n",
