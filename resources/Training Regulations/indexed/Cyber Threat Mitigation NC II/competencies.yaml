nstatistics \n2.2 Data analysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \n2.1 Computing business \nmathematics and \nstatistics \n2.2 Describing data \nanalysis techniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Stating legislation, \npolicy and procedures \nrelating to the conduct \nof evaluations \n2.5 Stating organisational \nvalues, ethics and \ncodes of conduct\n\n--- PDF PAGE 25 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n25 \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Record and \npresent \ninformation  \n3.1 Studied data/information \nare recorded. \n3.2 Recommendations are \nanalysed for action to \nensure they are \ncompatible with the \nproject’s scope and \nterms of reference. \n3.3 Interim and final reports \nare analysed and \noutcomes are compared \nto the criteria \nestablished at the \noutset. \n3.4 Findings are presented \nto stakeholders. \n \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n \n3.1 Describing data \nanalysis techniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Stating legislation, \npolicy and procedures \nrelating to the conduct \nof evaluations \n3.4 Stating organisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 26 ---\nCyber Treat Mitigation NC II (ICTCTM224)                                  Promulgated        November 13, 2024    \n26 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Data analysis techniques \nMay include but not limited to: \n1.1. Domain analysis \n1.2. Content analysis \n1.3. Comparison technique \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determine data / information \n1.2 Studied and applied gathered data/information \n1.3 Recorded and studied studied data/information \n \nThese aspects may be best assessed using a range of \nscenarios what ifs as a stimulus with a walk through forming \npart of the response. These assessment activities should \ninclude a range of problems, including new, unusual and \nimprobable situations that may have happened. \n2. Resource \nImplications \nSpecific resources for assessment \n2.1. Evidence of competent performance should be \nobtained by observing an individual in an information \nmanagement role within the workplace or operational \nor simulated environment. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Written Test \n3.2. Interview \n3.3. Portfolio   \n \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other \nrelevant units of competency. Assessment will occur over a \nrange of situations, which will include disruptions to normal, \nsmooth operation. Simulation may be required to allow for \ntimely assessment of parts of this unit of competency. \nSimulation should be based on the actual workplace and \nwill include walk through of the relevant competency \ncomponents.  \n4. Context for \nAssessment \n4.1. In all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.\n",
