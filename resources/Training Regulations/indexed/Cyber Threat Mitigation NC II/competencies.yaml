d conclusion of change/s request\nbased on procedures\n1.6 Performed patch and remediation testing and deliver report\n(patch and capacity management)\n1.6.1 Execute patch and remediation testing by based on\ngiven requirement\n1.6.2 Delivered report to patch management team\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Appropriate supplies and materials\n2.2 Applicable equipment\n2.3 Appropriate software\n2.4 Workplace or assessment area\n\n--- PDF PAGE 54 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n54\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written Exam\n4. Context for\nAssessment\n4.1 Competency may be assessed in the actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n55"
