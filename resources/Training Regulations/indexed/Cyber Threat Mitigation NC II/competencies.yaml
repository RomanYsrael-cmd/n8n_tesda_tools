        "source_text": "400311215\nUNIT DESCRIPTOR :\nThis unit of covers the knowledge, skills and attitudes\nrequired to present data/information appropriately.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Gather data/\ninformation\n1.1 Evidence, facts and\ninformation are\ncollected\n1.2 Evaluation, terms of\nreference and\nconditions are\nreviewed to determine\nwhether\ndata/information falls\nwithin project scope\n\n1.1 Organisational\nprotocols\n1.2 Confidentiality\n1.3 Accuracy\n1.4 Business\nmathematics and\nstatistics\n1.5 Data analysis\ntechniques/proced\nures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n1.8 Organisational\nvalues, ethics and\ncodes of conduct\n\n1.1 Describing\norganisational\nprotocols relating to\nclient liaison\n1.2 Protecting\nconfidentiality\n1.3 Describing accuracy\n1.4 Computing business\nmathematics and\nstatistics\n1.5 Describing data\nanalysis techniques/\nprocedures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Stating legislation,\npolicy and procedures\nrelating to the conduct\nof evaluations\n1.8 Stating organisational\nvalues, ethics and\ncodes of conduct\n2. Assess\ngathered\ndata/\ninformation\n2.1 Validity of data/\ninformation is assessed\n2.2 Analysis techniques are\napplied to assess data/\ninformation.\n2.3 Trends and anomalies\nare identified\n2.4 Data analysis\ntechniques and\nprocedures are\ndocumented\n2.5 Recommendations are\nmade on areas of\npossible improvement.\n\n2.1 Business\nmathematics and\nstatistics\n2.2 Data analysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\nvalues, ethics and\ncodes of conduct\n2.1 Computing business\nmathematics and\nstatistics\n2.2 Describing data\nanalysis techniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Stating legislation,\npolicy and procedures\nrelating to the conduct\nof evaluations\n2.5 Stating organisational\nvalues, ethics and\ncodes of conduct\n\n--- PDF PAGE 25 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n25\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Record and\npresent\ninformation\n3.1 Studied data/information\nare recorded.\n3.2 Recommendations are\nanalysed for action to\nensure they are\ncompatible with the\nproject’s scope and\nterms of reference.\n3.3 Interim and final reports\nare analysed and\noutcomes are compared\nto the criteria\nestablished at the\noutset.\n3.4 Findings are presented\nto stakeholders.\n\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n3.4 Organisational\nvalues, ethics and\ncodes of conduct\n\n3.1 Describing data\nanalysis techniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Stating legislation,\npolicy and procedures\nrelating to the conduct\nof evaluations\n3.4 Stating organisational\nvalues, ethics and\ncodes of conduct\npractices\n\n--- PDF PAGE 26 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n26\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Data analysis techniques\nMay include but not limited to:\n1.1. Domain analysis\n1.2. Content analysis\n1.3. Comparison technique\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studied data/information\n\nThese aspects may be best assessed using a range of\nscenarios what ifs as a stimulus with a walk through forming