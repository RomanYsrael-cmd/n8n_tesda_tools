        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Evaluated incidents\n1.1.1 Validated alerts based on the report.\n1.1.2 Performed product detection based on the 8-point\nincidence response.\n1.1.3 Identified incident classification based on\nenvironment.\n1.1.4 Prioritized incident criticality according to impact\non the asset.\n1.2 Used threat intelligence\n1.2.1 Utilized received threat intelligence to identify\ntactics, techniques and procedures (TTP) of threat\nactors (hackers).\n1.2.2 Counter-checked indicator of compromise (IOCs)\nwith other sources\n1.2.3 Checked applicability of IOC versus available\ninfrastructure\n1.2.4 Applied preventive action/resolution by blocking\nidentified IOCs on available security technology\nappliances\n1.2.5 Conducted continuous monitoring to detect\nattempts of download, access and interaction with\nthe malicious IOCs\n1.2.6 Defined and added current threat intelligence and\nthreat mitigation activities to knowledge-based\nsystems.\n1.3 Analyzed running processes and configs on affected\nsystems\n1.3.1 Utilized Common security tools and security\nproducts available, when necessary\n1.3.2 Checked known and common folder or location for\npossible installed malicious files.\n1.3.3 Verified and monitored file integrity by tools and\nsecurity products based on original installation\npackage or digitally signed files from vendors-\nwhite listing\n1.3.4 Files, folder, behavior and packets are confirmed\nmalicious or compromised by the tools and\nsecurity product\n1.4 Created and implemented strategy for containment and\nrecovery\n1.4.1 Identified TTP and IOCs based on the detection\nand recommendation of the security products\n1.4.2 Blocked and contained IOCs using the features of\nEDR, NGAV and next generation firewall (NGFW)\n\n--- PDF PAGE 48 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n48\n1.4.3 Conducted continuous monitoring to detect\nattempts of download, access and interaction with\nthe malicious IOCs\n1.4.4 Defined and added current threat mitigation\nactivities to knowledge-based systems.\n1.4.5 Conducted system or infra recovery by checking\nlast known good or viable image, configuration or\ninstance of backup.\n1.4.6 Conducted rollback activity based on the\navailability of last known good image,\nconfiguration and instance\n1.4.7 Conducted removal of malicious IOCs, registry\nhives, files, folders using security products\n1.4.8 Conducted secondary scan using the security\nproducts to determine if there are still malicious\nelements in the enterprise and mobile environment\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Appropriate supplies and materials\n2.2 Applicable equipment\n2.3 Appropriate software\n2.4 Workplace or assessment area\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written Exam\n3.3 Portfolio with interview\n4. Context for\nAssessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 49 ---\nCyber Treat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n49\nUNIT OF COMPETENCY : PERFORM VULNERABILITY MANAGEMENT/CONTROL\n\nUNIT CODE :"
