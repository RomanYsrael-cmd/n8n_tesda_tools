    {
      "number": "15",
      "text": "National Certificate (NC) – is a certification issued to individuals who achieve all the required units of competency for a national qualification defined under the Training Regulations. NCs are aligned to specific levels within the PTQF --- PDF PAGE 82 --- _______________________________________________________________________________________________ Cyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024 82"
