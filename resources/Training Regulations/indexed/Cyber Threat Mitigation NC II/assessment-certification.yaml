      "text": "Electronic Discovery (e-Discovery) - is the process of identifying, preserving, collecting, preparing, analyzing, reviewing, and producing electronically stored information (“ESI”) relevant to pending or anticipated litigation, or requested in government inquiries."
    },
    {
      "number": "25",
      "text": "End-user – anyone who uses an information system or the information it produces. --- PDF PAGE 84 --- _______________________________________________________________________________________________ Cyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024 84"
    },
    {
      "number": "26",
      "text": "Endpoint Detection & Response - also referred to as endpoint detection and threat response (EDTR), is an endpoint security solution that continuously monitors end-user devices to detect and respond to cyber threats like ransomware and malware."
    },
    {
      "number": "27",
      "text": "Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use."
    },
    {
      "number": "28",
      "text": "Event - Occurrence or change of a particular set of circumstances"
    },
    {
      "number": "29",
      "text": "Extended detection and response (XDR) - is a consolidation of tools and data that provides extended visibility, analysis, and response across endpoints, workloads, users, and networks."
    },
    {
