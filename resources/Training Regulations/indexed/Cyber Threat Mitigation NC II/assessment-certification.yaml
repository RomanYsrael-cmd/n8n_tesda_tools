e workplace Apply environmental work standards Exercise efficient and effective sustainable practices in the workplace Evaluate environmental work practices Lead towards improvement of environmental work programs, policies and procedures Manage implementation of environmental programs in the workplace Adopt entrepreneurial mindset in the workplace Practice entrepreneurial skills in the workplace Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs) Sustain entrepreneurial skills Develop and sustain a high- performing enterprise Apply Quality Standards Perform Computer Operations Communicate effectively in a customer contact center Render quality customer service Utilize enterprise/ company technology Conduct contact center campaign Provide specialized support and assistance to customers Lead a contact center work team Manage the activities of a contact center work team Use business technology Use medical technology to carry out task Produce text from audio transcription Review/edit documents Lead a team in delivering quality service Apply traditional drawing techniques for animation Produce traditional cleaned-up drawings Produce traditional in-between drawings Produce Traditional key poses/drawings for animation Create 2D digital animation Export Animation into Video file format Produce digital cleaned-up drawings Produce digital in-between drawings Produce background designs Composite and edit animation sequence Create 3D digital animation Produce storyboard for animation Coordinate the production of animation Produce over-all designs for animation Produce key drawings for animation Create 3D models for animation Apply 3D texture and lighting to 3D models Set character rigging Animate character Composite and render animation sequence Create 2D digital animation Produce cleaned-up and in- betweened drawings Use an authoring tool to create an interactive sequence Produce key drawings for animation Utilize Software Methodologies Develop Responsive Web Design Create Interactive Websites (Using JavaScript) Develop Website Backend Systems Develop designs for a logo Develop designs for print media Develop designs for user experience Develop designs for user interface Develop designs for product packaging Design booth and product/window display Provide an appropriate response to an event/incident Ensure efficient escalation and ticketing Ensure privacy and confidentiality of all security event/incident Monitor and report cybersecurity threats Provide an appropriate action to prevent a possible event/incident Ensure efficient case management of handled event/incident Monitor volume case reporting Ensure privacy and confidentiality of all security event/incident Conduct vulnerability scanning Perform threat mitigation Perform vulnerability management/control --- PDF PAGE 81 --- _______________________________________________________________________________________________ Cyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024 81"
