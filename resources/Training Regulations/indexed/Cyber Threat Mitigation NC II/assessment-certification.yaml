      "text": "Rodolfo B. Bernabe Jr. ● THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT ● CYBER SECURITY PHILIPPINES – CERT ● DEPARTMENT OF INFORMATION AND COMMUNICATION TECHNOLOGY ● THE ARMED FORCES OF THE PHILIPPINES – CYBER COMMAND GROUP ● THE PHILIPPINE NATIONAL POLICE (PNP) – ANTI CYBER CRIME GROUP ● MANDIANT - GOOGLE ● THE MANAGEMENT AND STAFF OF TESDA SECRETARIAT Qualifications and Standards Office (QSO) Dir. El Cid H. Castillo Executive Director, QSO Ms. Bernadette S. Audije Chief TESDS, QSO-CSDD Mr. Samuel E. Calado, Jr. Senior TESDS, QSO-CSDD Mr. Adrian Brian C. Sabanal Senior TESDS, QSO-CSDD Ms. Luz M. Vergara Technical Support Staff, QSO-CSDD Mr. Venzel Y. Concoles Senior TESDS, QSO-CPSDD Ms. Kimberly C. Caballero TESDS I, QSO-CPSDD Ms. Maria Sofia Jasmin A. Cea Technical Support Staff, QSO-CPSDD --- PDF PAGE 89 --- _______________________________________________________________________________________________ Cyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024 89 TRAINING REGULATIONS (TR) Qualification Title: CYBER THREAT MITIGATION NC II Qualification Code: ICTCTM224 Revision No. Document Types* Qualification Title New Version (TESDA Board Resolution No./ Date) Deployment Circular (TESDA Circular/ Implementing Guidelines) 00 Document Created Cyber Threat Mitigation NC II TB No. 2024-10 November 13, 2024 TESDA Circular No. 045 s. 2026 Legend: *Description Types - Document Created - Document Amended - Document Superseded --- PDF PAGE 90 --- Training Regulation are available in electronic copies. for more information, please contact: Technical Education and Skills Development Authority (TESDA) Tele Fax No.: 8818-7728 or visit our website: www.tesda.gov.ph"
