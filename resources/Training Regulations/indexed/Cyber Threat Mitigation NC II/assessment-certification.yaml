    {
      "number": "36",
      "text": "Indicators of compromise (IOCs) - are pieces of forensic data, such as data found in system log entries or files that identify potentially malicious activity on a system or network. Indicators of compromise aid information security and IT professionals in detecting data breaches, malware infections, or other threat."
    },
    {
      "number": "37",
      "text": "Information – data placed in a meaningful and useful context for an end user."
    },
    {
      "number": "38",
      "text": "Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology."
    },
    {
      "number": "39",
      "text": "Information security - Preservation of confidentiality, integrity and availability of information. In addition, other properties, such as authenticity, accountability, non- repudiation, and reliability can also be involved."
    },
    {
      "number": "40",
      "text": "Information security event - It refers to an identified occurrence of a system, service or network state indicating a possible breach of information security policy or failure of safeguards, or a previously unknown situation that may be security relevant"
    },
    {
