      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of Cyber Threat Mitigation NC II, the candidate must demonstrate in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General. 4.1.2. The qualification of Cyber Threat Mitigation NC II may be attained through demonstration of competence through project-type assessment covering all the units required in the qualification. 4.1.3. Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4. The following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of WTR-registered program, RTP-registered programs or formal/non-formal/informal including enterprise-based trainings related to cyber threat mitigation courses and/or programs. 4.1.4.2 Experienced workers (wage employed or self-employed) 4.1.5. The conduct of assessment and issuance of certificates shall follow the operation procedure and implementing guidelines developed for the purpose. 4.1.6. The guidelines on assessment and certification are discussed in details in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”."
