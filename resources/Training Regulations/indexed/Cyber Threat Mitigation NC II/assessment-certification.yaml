  "source_text": "SECTION 4: ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1. To attain the National Qualification of Cyber Threat Mitigation NC II, the\ncandidate must demonstrate in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate II signed by the TESDA\nDirector General.\n\n4.1.2. The qualification of Cyber Threat Mitigation NC II may be attained through\ndemonstration of competence through project-type assessment covering all\nthe units required in the qualification.\n\n4.1.3. Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4. The following are qualified to apply for assessment and certification:\n\n4.1.4.1\nGraduates of WTR-registered program, RTP-registered programs\nor formal/non-formal/informal including enterprise-based trainings\nrelated to cyber threat mitigation courses and/or programs.\n\n4.1.4.2\nExperienced workers (wage employed or self-employed)\n\n4.1.5. The conduct of assessment and issuance of certificates shall follow the\noperation procedure and implementing guidelines developed for the purpose.\n\n4.1.6. The guidelines on assessment and certification are discussed in details in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n--- PDF PAGE 79 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n79\n\nThis document can:\n\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior` assessment\n\n4.2.1 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment activities of candidates for\nnational certification.\n4.2.2 Accredited Competency Assessor. Only competency assessor accredited\nby TESDA is authorized to assess the competencies of candidates for\nnational certification.\n\n--- PDF PAGE 80 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n80\nANNEX A. ICT COMPETENCY MAP – Cyber Threat Mitigation NC II\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace\ncommunication\nUtilize specialized communication\nskill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem-solving techniques in\nthe workplace\nPerform higher order thinking\nprocesses and apply techniques in\nthe workplace\nEvaluate higher order thinking\nskills and adjust problem\nsolving techniques\nEnhance self-management\nskills\nDevelop career and life\ndecisions\nWork in a diverse environment\nContribute to the practice of social\njustice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport Innovation\nContribute to workplace\ninnovation\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into\nwork procedures\nAccess and maintain\ninformation\nPresent relevant\ninformation\nUse information systematically\nManage and evaluate usage of\ninformation\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety\nand health policies and\nprocedures\nPractice occupational\nsafety and health policies\nand procedures\nEvaluate occupational safety\nand health work practices\nLead in improvement of\nOccupational Safety and Health\nProgram, Policies and Procedures\nManage implementation of\noccupational safety and health\nprograms in the workplace\nApply environmental work\nstandards\nExercise efficient and\neffective sustainable\npractices in the workplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial\nmindset in the workplace\nPractice entrepreneurial\nskills in the workplace\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\nDevelop and sustain a high-\nperforming enterprise\n\nCOMMON COMPETENCIES\n\nApply Quality Standards\nPerform Computer\nOperations\n\nCORE COMPETENCIES\n\nCommunicate effectively in a\ncustomer contact center\nRender quality customer\nservice\nUtilize enterprise/ company\ntechnology\nConduct contact center\ncampaign\nProvide specialized support\nand assistance to customers\nLead a contact center work team\nManage the activities of a\ncontact center work team\nUse business technology\nUse medical technology to\ncarry out task\nProduce text from audio\ntranscription\nReview/edit documents\nLead a team in delivering\nquality service\nApply traditional drawing\ntechniques for animation\nProduce traditional cleaned-up\ndrawings\nProduce traditional in-between\ndrawings\nProduce Traditional key\nposes/drawings for animation\nCreate 2D digital animation\nExport Animation into Video\nfile format\nProduce digital cleaned-up\ndrawings\nProduce digital in-between\ndrawings\nProduce background designs\nComposite and edit animation\nsequence\nCreate 3D digital animation\nProduce storyboard for\nanimation\nCoordinate the production of\nanimation\nProduce over-all designs for\nanimation\nProduce key drawings for\nanimation\nCreate 3D models for\nanimation\nApply 3D texture and lighting to\n3D models\nSet character rigging\nAnimate character\nComposite and render\nanimation sequence\nCreate 2D digital animation\nProduce cleaned-up and in-\nbetweened drawings\nUse an authoring tool to create\nan interactive sequence\nProduce key drawings for\nanimation\nUtilize Software Methodologies\nDevelop Responsive Web\nDesign\nCreate Interactive Websites\n(Using JavaScript)\nDevelop Website Backend\nSystems\nDevelop designs for a logo\nDevelop designs for print media\nDevelop designs for user\nexperience\nDevelop designs for user\ninterface\nDevelop designs for product\npackaging\nDesign booth and\nproduct/window display\nProvide an appropriate\nresponse to an event/incident\nEnsure efficient escalation\nand ticketing\nEnsure privacy and\nconfidentiality of all security\nevent/incident\nMonitor and report\ncybersecurity threats\nProvide an appropriate action to\nprevent a possible event/incident\nEnsure efficient case\nmanagement of handled\nevent/incident\nMonitor volume case\nreporting\nEnsure privacy and\nconfidentiality of all security\nevent/incident\nConduct vulnerability scanning\nPerform threat mitigation\nPerform vulnerability\nmanagement/control\n\n--- PDF PAGE 81 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n81\nGLOSSARY OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgements on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context for Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and Context for\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n--- PDF PAGE 82 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n82\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\nSECTOR SPECIFIC\n\n1. Attack - Attempt to destroy, expose, alter, disable, steal or gain unauthorized\naccess to or make unauthorized use of any item that has value to the organization\n2. Asset - Any item that has value to the organization\n3. Attribute - Property or characteristic of an object that can be distinguished\nquantitatively or qualitatively by human or automated means\n4. Authentication - Provision of assurance that a claimed characteristic of an entity\nis correct\n\n--- PDF PAGE 83 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n83\n5. Authenticity - Property that an entity is what it claims to be\n6. Availability - Property of being accessible and usable upon demand by an\nauthorized entity\n7. Business Continuity - Procedures and/or processes for ensuring continued\nbusiness operations\n8. CERT - Computer Emergency Response Team (CERT) or Computer Security and\nIncident Response Team (CSIRT) refers to “an organization that studies computer\nand network security in order to provide incident response services to victims of\nattacks, publish alerts concerning vulnerabilities and threats, and to offer other\ninformation to help improve computer and network security”. At present, “both\nterms (CERT and CSIRT) are used in a synonymous manner” (ENISA, 2015 and\nENISA, 2015a).\n9. Computer security also known as cyber security or IT security - Is the\nprotection of computer systems from the theft or damage to their hardware,\nsoftware or information, as well as from disruption or misdirection of the services\nthey provide.\n10. Confidentiality - Property that information is not made available or disclosed to\nunauthorized individuals, entities, or processes.\n11. Consequence - Outcome of an event affecting objectives.\n12. Control - Means of managing risk, including policies, procedures, guidelines,\npractices or organizational structures, which can be of administrative, technical,\nmanagement, or legal nature.\n13. Control Objective - Statement describing what is to be achieved as a result of\nimplementing controls.\n14. Corrective Action - Action to eliminate the cause of a detected non-conformity or\nother undesirable situation\n15. Data - objective measurements of the attributes (characteristics) of entities such as\npeople, places, things, and events.\n16. Data - Collection of values assigned to base measures, derived measures and/or\nindicators. This definition applies only within the Context for ISO/IEC 27004:2009\n17. DICT - Department of Information and Communications Technology\n18. DDoS - Distributed Denial of Service\n19. Documentation – a collection of documents or information.\n20. Edit – to modify the form or format of data\n21. Effect - Is a deviation from the expected — positive and/or negative.\n22. Effectiveness - Extent to which planned activities are realized and planned results\nachieved.\n23. Efficiency - Relationship between the results achieved and the resources used.\n24. Electronic Discovery (e-Discovery) - is the process of identifying, preserving,\ncollecting, preparing, analyzing, reviewing, and producing electronically stored\ninformation (“ESI”) relevant to pending or anticipated litigation, or requested in\ngovernment inquiries.\n25. End-user – anyone who uses an information system or the information it\nproduces.\n\n--- PDF PAGE 84 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n84\n26. Endpoint Detection & Response - also referred to as endpoint detection and\nthreat response (EDTR), is an endpoint security solution that continuously monitors\nend-user devices to detect and respond to cyber threats like ransomware and\nmalware.\n27. Ergonomics - the science and technology emphasizing the safety, comfort, and\nease of use of human-operated machines. The goal of ergonomics is to produce\nsystems that are user-friendly: safe, comfortable and easy to use.\n28. Event - Occurrence or change of a particular set of circumstances\n29. Extended detection and response (XDR) - is a consolidation of tools and data\nthat provides extended visibility, analysis, and response across endpoints,\nworkloads, users, and networks.\n30. File folders, also called directories, - a way to organize computer files.\n31. Guideline - Description that clarifies what should be done and how, to achieve the\nobjectives set out in policies.\n32. ICT systems - Hardware, software, firmware of computers, telecommunications\nand network equipment or other electronic information handling systems and\nassociated equipment.\n33. Incident – any flagged alert of threat/s detected by the security solution product.\n34. IDS - Intrusion Detection System\n35. IEC - International Electrotechnical Commission\n36. Indicators of compromise (IOCs) - are pieces of forensic data, such as data\nfound in system log entries or files that identify potentially malicious activity on a\nsystem or network. Indicators of compromise aid information security and IT\nprofessionals in detecting data breaches, malware infections, or other threat.\n37. Information – data placed in a meaningful and useful context for an end user.\n38. Information and Communication Technology (ICT) - refers to technologies\nassociated with the transmission and exchange of data in the form of sound, text,\nvisual images, signals or any combination of those forms through the use of digital\ntechnology. It encompasses such services as telecommunications, posts,\nmultimedia, electronic commerce, broadcasting, and information technology.\n39. Information security - Preservation of confidentiality, integrity and availability of\ninformation. In addition, other properties, such as authenticity, accountability, non-\nrepudiation, and reliability can also be involved.\n40. Information security event - It refers to an identified occurrence of a system,\nservice or network state indicating a possible breach of information security policy\nor failure of safeguards, or a previously unknown situation that may be security\nrelevant\n41. Information security incident - It is indicated by a single or a series of unwanted\nor unexpected information security events that have a significant probability of\ncompromising business operations and threating information security\n42. Information system - Application, service, information technology asset, or any\nother information handling component\n43. Infrastructure - Facilities and equipment to enable the ICT DR services, including\nbut not limited to power supply, telecommunications connections and\nenvironmental controls\n\n--- PDF PAGE 85 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n85\n44. Integrity - Property of protecting the accuracy and completeness of assets\n45. ISMS - Information Security Management System\n46. ISO - International Standards Organization\n47. Local Area Network (LAN) – a communications network that typically connects\ncomputers, terminals, and other computerized devices within a limited physical\narea such as an office, building, manufacturing plant and other work sites.\n48. Management - Coordinated activities to direct and control an organization\n49. Management system - Framework of guidelines, policies, procedures, processes\nand associated resources aimed at ensuring an organization meets its objectives\nMeasure Variable to which a value is assigned as the result of measurement\n50. Managed detection and response (MDR) - an MDR solution provides access to\nboth the tools and security expertise that an organization needs to protect itself\nagainst cyber threats. An MDR provider will offer round-the-clock network\nmonitoring and incident investigation and response.\n51. Measurement - Process of obtaining information about the effectiveness of ISMS\nand controls using a measurement method, a measurement function, an analytical\nmodel, and decision criteria\n52. NCERT - National Computer Emergency Response Team\n53. NIST - National Institute of Standards and Technology\n54. Object - Item characterized through the measurement of its attributes\n55. Organizations - Entities which utilize ICT DR services\n56. Owner - Identifies an individual or entity that has approved management\nresponsibility for controlling the production, development, maintenance, use and\nsecurity of the assets. This term does not mean that the person actually has any\nproperty rights to the asset.\n57. POC - Point of Contact\n58. Policy - Overall intention and direction as formally expressed by management\n59. Problem solving skills – able to discern the questions raised by stakeholder on\nsecurity solution operation and handling; included but not limited to problems and\nthe threats identified by the security solution.\n60. Procedure - Specified way to carry out an activity or a process\n61. Process - Set of interrelated or interacting activities which transforms inputs into\noutputs\n62. Quality Assurance – methods for ensuring that information systems are free from\nerrors and fraud and provide information products of high quality.\n63. Record - Document stating results achieved or providing evidence of activities\nperformed\n64. Reliability - Property of consistent intended behavior and results\n65. Review - Activity undertaken to determine the suitability, adequacy and\neffectiveness (2.22) of the subject matter to achieve established objectives\n66. Review object - Specific item being reviewed\n67. Risk - Combination of the probability of an event and its consequence\n\n--- PDF PAGE 86 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n86\n68. Risk acceptance - Decision to accept a risk\n69. Risk analysis - Process to comprehend the nature of risk and to determine the\nlevel of risk\n70. Risk assessment - Overall process of risk identification, risk analysis and risk\nevaluation\n71. Risk management - Coordinated activities to direct and control an organization\nwith regard to risk.\n72. SIEM - Security Information and Event Management\n73. Simulation - the process of imitating a real phenomenon with a set of\nmathematical formulas. Advanced computer programs can simulate weather\nconditions, chemical reactions, atomic reactions, even biological processes.\n74. Software – computer programs and procedures concerned with the operation of\nan information system.\n75. Standards – measures of performance developed to evaluate the progress of a\nsystem toward its objectives\n76. Stakeholder - Person or organization that can affect, be affected by, or perceive\nthemselves to be affected by a decision or activity\n77. System – an assembly of methods, procedures, or techniques unified by regulated\ninteraction to form an organized whole\n78. Third party - Person or body that is recognized as being independent of the\nparties involved, as concerns the issue in question\n79. Threat - Potential cause of an unwanted incident, which may result in harm to a\nsystem or organization\n80. Threat Mitigation - also called cyber risk mitigation or cyber attack mitigation - is a\nterm that describes the tools, processes, and strategies companies use to reduce\nthe severity of or seriousness of a potential data breach or other cyber attack.\n81. Ticket management system – any document (physical or digital) that possessed\nthe following – reporter, time, date, details of incident and status of the case.\n82. User- friendly – a characteristic of human-operated equipment and systems that\nmakes them safe, comfortable, and easy to use.\n83. Validation - Confirmation, through the provision of objective evidence, that the\nrequirements for a specific intended use or application have been fulfilled\n84. Verification - Confirmation, through the provision of objective evidence, that\nspecified requirements have been fulfilled.\n85. Vulnerability - Weakness of an asset or control that can be exploited by one or\nmore threats\n\n--- PDF PAGE 87 ---\n_______________________________________________________________________________________________\nCyber Threat Mitigation NC II (ICTCTM224) Promulgated November 13, 2024\n\n87\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wish to extend\nthanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTHE TECHNICAL EXPERTS PANEL (TEP)\n\nMR. JOSEPH FELIX V. PACAMARRA, MVP MSFT, DPO\nCo-Founder | Chief Executive Officer 