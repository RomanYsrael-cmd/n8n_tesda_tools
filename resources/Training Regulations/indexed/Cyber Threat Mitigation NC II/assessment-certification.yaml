      "number": "8",
      "text": "CERT - Computer Emergency Response Team (CERT) or Computer Security and Incident Response Team (CSIRT) refers to “an organization that studies computer and network security in order to provide incident response services to victims of attacks, publish alerts concerning vulnerabilities and threats, and to offer other information to help improve computer and network security”. At present, “both terms (CERT and CSIRT) are used in a synonymous manner” (ENISA, 2015 and ENISA, 2015a)."
    },
    {
      "number": "9",
      "text": "Computer security also known as cyber security or IT security - Is the protection of computer systems from the theft or damage to their hardware, software or information, as well as from disruption or misdirection of the services they provide."
    },
    {
      "number": "10",
      "text": "Confidentiality - Property that information is not made available or disclosed to unauthorized individuals, entities, or processes."
    },
    {
      "number": "11",
      "text": "Consequence - Outcome of an event affecting objectives."
    },
    {
      "number": "12",
      "text": "Control - Means of managing risk, including policies, procedures, guidelines, practices or organizational structures, which can be of administrative, technical, management, or legal nature."
