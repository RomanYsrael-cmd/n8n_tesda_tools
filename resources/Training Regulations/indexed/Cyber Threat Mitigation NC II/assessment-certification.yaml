      "number": "1",
      "text": "Certification - is the process of verifying and validating the competencies of a person through assessment"
    },
    {
      "number": "2",
      "text": "Certificate of Competency (COC) – is a certification issued to individuals who pass the assessment for a single unit or cluster of units of competency"
    },
    {
