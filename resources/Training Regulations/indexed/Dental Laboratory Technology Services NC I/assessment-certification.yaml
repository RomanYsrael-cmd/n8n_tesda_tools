  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Dental Laboratory Technology Services NC I, the\ncandidate must demonstrate competence in all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2 Assessment shall focus on the units of competency. The basic and common units shall be\nintegrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms\n\n4.3.2 Experienced Workers (wage employed or self-employed)\n\n4.4 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS)”.\n\n--- PDF PAGE 52 ---\nTR Dental Laboratory Technology Services NC I\n Promulgated\n\n48\n"
