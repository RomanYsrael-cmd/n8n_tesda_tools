        "source_title": "FABRICATE MODELS",
        "source_text": "--- PDF PAGE 34 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n30\n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : \nFABRICATE MODELS \nUNIT CODE \n: \nHCS322323 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in fabricating \nmodels. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Verify integrity of \nimpressions    \n \n1.1 \nImpression is disinfected according to Department of Health \nguidelines. \n1.2 \nImpressions are examined for defects. \n1.3 \nImpression is checked to ensure it meets the specifications of \nthe work. \n2.  Select and prepare \nmodel materials \n2.1 \nAppropriate materials are selected. \n2.2 \nMaterials are prepared in accordance with desired outcome. \n3.  Pour impressions \n3.1 \nImpressions are prepared for pouring. \n3.2 \nMaterials are poured into impressions in accordance with \naccepted techniques. \n3.3 \nRequired setting time is allowed. \n5. Finish model \n \n4.1 \nModel is recovered intact from impression. \n4.2 \nModel is inspected for defects. \n4.3      Models a re trimmed according to requirements. \n \n5.  Duplicate model \n5.1 \nDuplicating materials are prepared according to \nmanufacturer’s instructions. \n5.2 \nDuplicating materials are mixed according to manufacturer’s \ninstructions. \n5.3 \nAn accurate, bubble free cast is produced.\n\n--- PDF PAGE 35 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n31\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Impression \n \n \nMay include but are not limited to: \n1.1 \nEdentulous impression \n1.2 \nDentulous impressions \n1.3 \nPartially dentulous \n \n2. Pour materials into \nimpressions \n \n \nMay include but are not limited to: \n \n2.1 \nRigid impression materials \n2.2 \nAqueous elastomers \n2.3 \nNon-aqueous elastomers \n3.  Duplicating materials \nMay include but are not limited to: \n3.1      Stones \n3.2      Diestones \n3.4 \nRefractories\n\n--- PDF PAGE 36 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n32\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nVerified integrity of impressions \n1.2 \nSelected and prepared model materials \n1.3 \nPoured impressions \n1.4 \nFinished models \n1.5      Duplicated model \n1.6 \nFollowed OH&S and Department of Health (DOH) infection \ncontrol guidelines\n \n2. Underpinning \nknowledge  \n \n2.1 \nKnowledge on basic oral anatomy and occlusion \n2.2 \nKnowledge and application of basic hygiene and the \nimportance of maintaining clean equipment and working \nenvironment \n2.3 \nRelevant material science for carrying out procedure \n2.4    Occupation Health and Safety and material safety datasheets \n2.5 \nCurrent Department of Health infection control guidelines, \nuses and specifications of dental packaging equipment and \nrelated products \n2.6 \nDental policies and procedures \n2.7\nIndustry codes of practice and relevant legislation\n \n3. Underpinning skills \n \n3.1 \nCommunicating and interacting appropriately with colleagues, \nhealth care practitioners, other clients and patients \n3.2 \nCommunicating ideas and information \n3.3 \nMaintaining cleanliness \n3.4 \nDemonstrating manual dexterity \n3.5 \nWorking with others and in teams \n3.6 \nPlanning and organizing activities \n3.7 \nLanguage, literacy and numeracy skills appropriate to the job \nrole and function e.g. documenting packaging information and \nrecording procedures\n \n4. Resource \nimplications \n \nThe following resources MUST be provided: \n4.1 \nA real or simulated dental laboratory environment \n4.2 \nRelevant documentation such as: \n4.2.1 dental policies and procedures \n4.2.2 industry codes of practice and relevant legislation \n4.3 \nAccess to a range of packaging equipment and related \nproducts \n4.4 \nA qualified workplace assessor and/or technical expert \nworking in partnership with the assessor\n \n5. Method of \nassessment \n \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nWritten Test/Examination \n5.3 \nThird Party Report \n5.4\nPortfolio\n \n6. Context of \nassessment \n \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting.\n",
