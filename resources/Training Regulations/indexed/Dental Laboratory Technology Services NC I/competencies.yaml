  "source_section_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2 Assessment shall focus on the units of competency. The basic and common units shall be\nintegrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms\n\n4.3.2 Experienced Workers (wage employed or self-employed)\n\n4.4 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS)”.\n\n--- PDF PAGE 52 ---\nTR Dental Laboratory Technology Services NC I\n Promulgated\n\n48\nCOMPETENCY MAP – HEALTH CARE SECTOR (DENTAL LABORATORY TECHNOLOGY SERVICES NC I)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in workplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop teams and\nindividuals\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high\nstandard of patient\nservices\nMaintain instruments and\nequipment in work area\nAssist in dental\nlaboratory procedures\nAssist with\nadministration in dental\npractice\nMaintain an effective\nrelationship with\ncustormers and clients\nManage own\nperformance\nFollow occupational\nhealth and safety\npolicies in dental\npractice\nMaintain infection\ncontrol in dental\npractice\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and\nsupport to children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end\nusers location\nAssist in patient\nmobility\n\nAssist in transporting patients\nAssist in bio-\npsychosocial support\ncare of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\n\nPerform basic life support\n\nMaintain life support\nequipment and\nresources\nImplement safe access\nand extrication\nprocedures in an\nemergency\nManage request for\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic\nambulance\ncommunication skills\n\nSupervise on-road operations\n\nManage the scene of a\nspecial event\nManage routine scene\nDeliver pre-hospital\npatient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\nDrive vehicles under\noperational conditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a\ncommunity\ndevelopment\nframework\n\n--- PDF PAGE 53 ---\nTR Dental Laboratory Technology Services NC I\n Promulgated\n\n49\nPrepare for work in the\ncommunity service industry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education\nprogram in the\ncommunity\nImplement health promotion\nand community interventions\nFabricate models\nFabricate custom\nimpression trays\nFabricate registration\nbite rims\nArticulate models and\ntransfer records\nFabricate mouthguard\nArrange artificial teeth\nfor complete dentures\nSet up and wax removable\npartial dentures\nWax, process and finish\nacrylic dentures and\nappliances\nCast metal alloy\nremovable partial denture\nframework\nFabricate oral splints\nFabricate orthodontic\nappliances\nFabricate thermo\nformed bases and\nappliances\nFabricate metal crown\nand bridge structures\nFabricate ceramic\nrestorations\nFabricate indirect\ncomposite/polymer fixed\nrestorations\nJoin alloy structures\n\n--- PDF PAGE 54 ---\nTR Dental Laboratory Technology Services NC I\n Promulgated\n\n50\nDEFINITION OF TERMS\n\nABUTMENT\n-\nTooth or teeth that support a fixed or removable bridge\nANTERIOR TEETH\n-\nthe six upper or six lower front teeth (canines, laterals & central\nincisors)\nAPEX\n-\nthe tip of the root of a tooth\nAPPLIANCE\n-\na general term referring to devices used to provide a function or\ntherapeutic effect\nARCH\n-\ndescribes the alignment of the upper or lower teeth\nARTICULATE\n-\nto unite by forming a joint or joints\nARTICULATOR\n-\na mechanical device representing the temporo-mandibular joints and\njaw members to which casts of the mouth\nBASE\n-\ncement placed under a dental restoration to insulate the pulp (nerve\nchamber)\nBITE\n-\nrelationship of the upper and lower teeth on closure (occlusion)\nBITE/OCCLUSION\nRIM\n-\n an occluding border or surface constructed on temporary or\npermanent denture bases for the purpose of recording the\nmaxillomandibular relation and for positioning the teeth\nBLEACHING\n-\nchemical or laser treatment of natural teeth for whitening effect\nBONDING\n-\nadhesive dental restoration technique; a tooth-colored composite\nresin to repair and/or change the color or shape of a tooth\nBRACES\n-\ndevices used by orthodontists to gradually reposition teeth to a more\nfavorable alignment\nBRIDGE\n-\nstationary dental prosthesis (appliance) fixed to teeth adjacent to a\nspace; replaces one or more missing teeth, cemented or bonded to\nsupporting teeth or implants adjacent to the space\nBUCCAL\n-\nin dental anatomy, the term is used to refer to the vestibular (or oral)\nsurface of the premolars and molars that faces the cheek\nCANTILEVER\nBRIDGE\n-\nfixed bridge that attaches to adjacent teeth only on one end\nCAP\n-\ncommon term for dental crown\nCAST\n-\nan accurate reproduction or replica of an object or part produced in a\nplastic material which has taken form in an impression or mold\nCLASP\n-\ndevice that retains a removable partial denture to stationary teeth;\ncan be metal or acrylic (matches teeth and gums)\nCONDYLAR\n-\nPertaining to condyle\nCONDYLE\n-\nA round eminence or protuberance at the articular extremity of the\nbone\nCROSS BITE\n-\nreverse biting relationship of upper and lower teeth; aka \"under bite,\"\nas in Class III malocclusuion (prognathic jaw)\nCROWN\n\n(1) the portion of a tooth above the gum line;\n(2) dental restoration covering all or most of the natural tooth\n\n--- PDF PAGE 55 ---\nTR Dental Laboratory Technology Services NC I\n Promulgated\n\n51\nCUSTOM IMPRESION\nTRAY\n-\nan impression tray made from a preliminary impression used to make\nthe final impression\nDENTAL WAXES\n-\n wax compounds used in dentistry are mixtures of individual waxes of\nmaterials or synthetic origin. As with all other dental materials, each\ncomponent n the mixture is selected to given specific properties best\nsuited for the procedure being performed\nDENTURE\n-\nremovable (partial or complete) set of artificial teeth\nDIASTEMA\n-\nopen space between teeth\nDISTAL\n-\nfarthest from any point of reference, as the surfaces of teeth more\ndistant from the median line\nDUPLICATE\n-\nidentically copied from an original\nFABRICATE\n-\nto make; create; to construct by combining or assembling\nFACE-BOW\n-\na caliper-like device used to record the positional relationship of the\nmaxillary arch to the temporo-mandibular joint (or opening axis of the\njaw and to orient dental casts in the same relationship to the opening\naxis of the articulator\nFACE-BOW FORK\n-\na device used to attach the face-bow to an occlusion rim for a face-\nbow transfer\nFACIAL\n-\nthe term is used to refer to the surface of a tooth directed toward the\nface (including the buccal and labial surfaces) and opposite the\nlingual (or oral) surface.\nFACING\n-\ntooth colored overlay on the visible portion of a crown; may be\nacrylic, composite or porcelain\nFILLING\n-\nrestoration of lost tooth structure with metal, porcelain or resin\nmaterials\nFULL DENTURE\n-\nremovable dental prosthesis (appliance) replacing all upper or lower\nteeth\nFULL MOUTH\nRECONSTRUCTION\n-\nextensive restorations of natural teeth with crowns and or fixed\nbridges to manage restorative and bite problems.\nGYPSUM\n-\nis the common name for calcium sulfate dehydrate. Gypsum products\nare more frequently used on laboratory procedures than any other\nsingle group of compounds. Controlled variations in the\nmanufacturing of gypsum products yield a group of dental materials\nincluding plaster, artificial stone(hydrosol), disc stone, casting\ninvestment and soldering investment\nIMPRESSION\n-\nmold made of the teeth and soft tissues\nINLAY\n-\nindirect - filling made by a dental laboratory that is cemented or\nbonded into place,\ndirect - placement of dental composite resin, or porcelaion restoration\nat chairside\nINTEROCCLUSAL\n-\nspace between upper and lower teeth\nINVESTING\n-\nthe act or process of covering or enveloping wholly or in part an\nobject such as a denture, tooth, wax form etc.\nJACKET\n-\ncrown for a front tooth, usually made of porcelain\n\n--- PDF PAGE 56 ---\nTR Dental Laboratory Technology Services NC I\n Promulgated\n\n52\nLABIAL\n-\nin dental anatomy, the term is used to refer to the vestibular (or\nfacial) surface of the incisors and canines that faces the lips\nLAMINATE\n-\nthin plastic or porcelain veneer produced in a dental laboratory and\nthen bonded to a tooth\nMALOCCLUSION\n-\n\"bad bite\" or misalignment of the upper and lower teeth\nMARGIN\n-\ninterface between a restoration and tooth structure\nMARYLAND BRIDGE\n-\na bridge that is bonded to the back of the adjacent teeth; requires\nminimum tooth reduction\nMODEL\n-\na material used extensively for making impressions. It contains\nshellac, talc, glycerin, wax, tallow and palm oil\nMOUTHGUARD\n-\nan intra-oral appliance, made of a soft plastic, which covers all\nocclusal surfaces and the palate and extends to the border of the\nattached gingiva on the vestibular surface of the teeth\nOVERBITE\n-\nvertical overlap of the front teeth; deep bite\nPARTIAL DENTURE\n-\nremovable dental prosthesis (appliance) replacing one or more\nnatural teeth\nPONTIC\n-\nreplacement tooth mounted on a fixed or removal appliance\nPORCELAIN CROWN\n-\nall porcelain restoration covering the coronal portion of tooth (above\nthe gum line)\nPORCELAIN FUSED\nTO METAL (PFM)\nCROWN\n-\nrestoration with metal coping (for strength) covered by porcelain (for\nappearance)\nPORCELAIN INLAY\nOR ONLAY\n-\ntooth-colored restoration made of porcelain, cemented or bonded in\nplace\nPORCELAIN\nVENEERS\n-\na thin layer of porcelain, fabricated by a laboratory) bonded to a\nnatural tooth to replace lost tooth structure, close spaces, straighten\nteeth or change color and/or shape\nPOSTERIOR\n-\nSituated in the back of, or in the back part of, or affecting the back\npart of an organ; used in reference to the back or dorsal surface of\nthe body.\nPROSTHESIS\n\nan artificial appliance for the replacement for a body part, tooth or\nteeth\nREBASE\n-\nthe process of refitting a denture by means of the replacement of the\ndenture base material without changing the occlusal relations of the\nteeth\nRETAINER\n-\na device for retaining or keeping something in position\n\n-\nthe part of a denture that unites the abutment tooth with the\nsuspended portion of the bridge, such as inlay, partial crown or\ncomplete crown.\nSOLDERING\nINVESTMENT\n-\na soldering investment is similar in composition to a casting\ninvestment that has a\nSPLINT\n-\nconnection of two or more teeth so they function as a stronger single\nstructure\n\n--- PDF PAGE 57 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who rendered their time and expertise to the development and validation of\nthese Training Regulations.\n\nDR. ARNON L. RIVERA\n\nPresident\n\nNational Association of Dental/Prosthetics Laboratory, Inc.\n\n#96 Hoover Street, San Juan, Metro Manila\n\nMS. WILMA E. REDLER, C.D.T.\n\nVP Technical and Lecturer\n\nSkytech International Dental Laboratory\n\nRamon Magsaysay, Sta. Mesa, Manila\n\nMR. KOJI MIYATA, C.D.T.\n\nLecturer/Teacher/Maxillo Facial Technician\n\nEmilio Aguinaldo College\n\n1113-1117 San Marcelino Street, Ermita, Manila\n\nMR. CHRISTOPHER P. LOZANO\n\nOperations Manager\n\nPearl of the Orient Dental Studio, Inc.\n\n#770 Aurora Blvd., Cubao, Quezon City\n\nMR. ROMEO G. GAJO, JR.\n\nVice President for Administration/Marketing Manager\n\nPearl of the Orient Dental Studio, Inc.\n\n#770 Aurora Blvd., Cubao, Quezon City\n\nMR. RUVENSTEIN M. LADERA\n\nMarketing Director for Dental Laboratory\n\nInternational Dental Inc. (Interdent, Inc.)\n\n#5307 Gilbarco Bldg., South Superhighway, Makati City\n\nMRS. BUENA V. LADERA\nBranch Manager\n\nInternational Dental Inc. (Interdent, Inc.)\n\n#5307 Gilbarco Bldg., South Superhighway, Makati City\n\nMR. GIL CAMPANA\nOwner\nGC Dental Laboratory\n96 Hoover St., cor. Araullo Street, San Juan, Metro Manila\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n--- PDF PAGE 58 ---\nList of Published Training Regulations\n\n\nAnimal Production NC II\n\nAquaculture NC II\n\nAutomotive Body Painting/Finishing NC II\n\nAutomotive Body Repair NC II\n\nAutomotive Engine Rebuilding NC II\n\nAutomotive Servicing NC II\n\nBartending NC II\n\nBeauty Care NC II\n\nBeauty Care NC III\n\nBuilding Wiring Installation NC II\n\nCaregiving NC II\n\nCarpentry NC II\n\nCommercial Cooking NC II\n\nComputer Hardware Servicing NC II\n\nDeck Seafaring NC II\n Dental Laboratory Technology Services NC I\n\nDental Laboratory Services NC II\n\nDental Laboratory Services NC III\n\nDressmaking NC II\n\nDriving NC II\n\nEngine Seafaring NC II\n\nFood and Beverage Services NC II\n\nFootwear Making NC II\n\nHeavy Equipment Operation NC II\n\nHorticulture NC II\n\nHousehold Services NC II\n\nHousekeeping NC II\n\nMachining NC II\n\nMasonry NC II\n\nMotorcycle and Small Engine Servicing NC II\n\nPerforming Arts (Dance) NC II\n\nPerforming Arts (Song) NC II\n\nPlumbing NC II\n\nPyrotechnics NC II\n\nRAC Servicing NC I\n\nRAC Servicing NC II\n\nSecurity Services NC II\n\nTailoring NC II\n\nTour Guiding Services NC II\n\nTransport RAC Servicing NC II\n\nTravel Services NC II\n\nWelding NC II\nThese materials are available in both printed and electronic copies.\nFor more information please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTelephone Nos.: 893-8303, 893-2139; 817-4076 to 82 loc. 615 to 617\nor visit our website: www.tesda.gov.ph"
