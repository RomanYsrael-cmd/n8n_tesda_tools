        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model for procedure\n1.2\nChecked the dental mouthguard prior to insertion\n1.3\nFitted and evaluated the mouthguard\n1.4\nAltered mouthguard if required\n1.5 Complied with DOH infection control policies and procedures\n1.6\nFollowed OH&S policies and procedures\n2. Underpinning\nknowledge\n\n2.1\nRationale and objectives for mouthguard\n2.2 Types of mouthguard\n2.3 Maintenance requirements for mouthguard\n2.4 Principles of quality assurance and work effectiveness\n2.5 Legal and ethical issues relating to: informed consent, duty of\ncare and confidentiality\n2.6 Relevant OH&S regulations\n2.10\nCurrent DOH infection control guidelines\n3. Underpinning skills\n3.1\nCommunications Skills\n3.2\nProblem Solving\n3.3\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 45 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n41"
