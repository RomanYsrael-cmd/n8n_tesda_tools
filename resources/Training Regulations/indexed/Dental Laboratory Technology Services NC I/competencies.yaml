        "source_title": "FABRICATE MOUTHGUARD",
        "source_text": "--- PDF PAGE 43 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n39\n \nUNIT OF COMPETENCY:  FABRICATE MOUTHGUARD \nUNIT CODE                     :  HCS322327 \nUNIT DESCRIPTOR:   \nThis unit covers the knowledge, skills and attitudes in fabricating \nmouthguard. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare model for \nprocedure \n1.1 \nPrescription is interpreted in accordance with the dentist’s \ninstruction. \n1.2 \nModel is seated and correctly positioned for procedure. \n2. Check the dental \nmouthguard prior to \ninsertion \n2.1 \nMouthguard is decontaminated in accordance with DOH \ninfection control guidelines. \n2.2      Potential injury causing areas of a mouthguard are removed \nprior to insertion. \n2.3 \nMouthguard is assessed to ensure desired thickness and \nprotective capabilities have been achieved. \n3. Fit and evaluate the \nmouthguard \n3.1      Retention and stability are examined. \n3.2 \nThe fitting surfaces of the mouthguard are checked for \naccuracy and comfort. \n3.3      Current DOH infection control guidelines are followed. \n4.  Alter mouthguard if \nrequired \n4.1 \nMaterials and equipment required to carry out alterations are \nused in accordance with manufacturer’s instructions, current \nDOH infection control and OHS guidelines. \n4.2 \nFitting surfaces and occlusion are checked for accuracy and \naltered where pressure is indicated or where discrepancies to \nretention and stability are found. \n4.3 \nDocumentation is completed as required. \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n \n1. Guidelines \n \nRelevant guidelines may include but are not limited to: \n1.1     Department of Health (DOH) infection control guidelines and \nprocedures \n1.2     Occupational Health and Safety Practices\n\n--- PDF PAGE 44 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n40\n \nEVIDENCE GUIDE \n \n1.  Critical aspects of  \n     competency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared model for procedure \n1.2 \nChecked the dental mouthguard prior to insertion \n1.3 \nFitted and evaluated the mouthguard \n1.4 \nAltered mouthguard if required \n1.5      Complied with DOH infection control policies and procedures \n1.6 \nFollowed OH&S policies and procedures  \n2.  Underpinning \nknowledge \n      \n2.1 \nRationale and objectives for mouthguard \n2.2      Types of mouthguard \n2.3      Maintenance requirements for mouthguard \n2.4      Principles of quality assurance and work effectiveness \n2.5      Legal and ethical issues relating to: informed consent, duty of \ncare and confidentiality \n2.6      Relevant OH&S regulations \n2.10 \nCurrent DOH infection control guidelines \n3.  Underpinning skills \n3.1 \nCommunications Skills \n3.2 \nProblem Solving \n3.3 \nPlanning and organizing work activities \n4.  Resource \nimplications \nThe following resources MUST be provided \n4.1 \nA real or simulated dental laboratory environment \n4.2      Relevant documentation such as: \n4.2.1 industry codes of practice \n4.2.2 state legislation as appropriate \n4.2.3 housekeeping/maintenance procedures \n4.3 \nA qualified workplace assessor and/or a technical expert \nworking in partnership with the assessor \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1       Demonstration with questioning \n5.2       Written Test/Examination \n5.3       Third Party Report \n5.4       Portfolio \n6.  Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting.\n",
