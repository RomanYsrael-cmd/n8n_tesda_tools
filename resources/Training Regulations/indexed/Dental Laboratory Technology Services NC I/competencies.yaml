        "source_text": "--- PDF PAGE 39 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n35\nUNIT OF COMPETENCY:  FABRICATE REGISTRATION BITE RIMS \nUNIT CODE                     : HCS322325 \nUNIT DESCRIPTOR:   \nThis unit covers the knowledge, skills and attitudes in fabricating \nregistration bite rims. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Select and prepare \nmaterials \n1.1 \nAppropriate material for the base and rims is selected. \n1.2 \nModel is prepared to enable appropriate application of \nselected base metal. \n2. Fabricate base \n2.1 \nSelected base material is applied to model. \n2.2      Base material is processed in accordance with type of base \nmaterial selected. \n2.3 \nBase material is trimmed to peripheral contours of model and \nappropriate landmarks. \n3. Fabricate registration \nbite rims \n3.1      Bite rim is fabricated in selected material. \n3.2 \nBite rim is trimmed to prescribed dimensions and appropriate \nlandmarks. \n3.3      Bite rim is smoothed and polished in accordance with material \nchosen. \n4.  Prepare face-bow (if \nrequired) \n4.1 \nFace-bow fork is located in required position. \n4.2 \nMaterial is selected as required by the presentation. \n4.3 \nFace-bows are finished in accordance with acceptable \nindustry standard. \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Appropriate materials \nfor base \n \nMay include but are not limited to: \n1.1      Wax \n1.2      Thermo-formed materials \n1.3      Light-cured composite \n1.4      Acrylic \n1.5      Cast metal framework\n\n--- PDF PAGE 40 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n36\nEVIDENCE GUIDE \n \n1.  Critical aspects of  \n     competency \nAssessment requires evidence that the candidate: \n1.1 \nSelected and prepared materials for fabrication of registration \nbite rim. \n1.2 \nConstructed base and registration bite rim \n1.3 \nPrepared face-bow (if required) \n1.4 \nComplied with DOH infection control policies and procedures \n1.5 \nFollowed OH&S policies  \n \n2.  Underpinning \nknowledge \n      \n2.1 \nRelevant material science for carrying out procedures \n2.2      Basic oral anatomy and occlusion \n2.3      Range of standard dimensions \n2.4 \nApplication of registration bite rim \n2.5 \nIndustry codes and practices \n2.6 \nNational and local legislation as appropriate \n2.7 \nHousekeeping/maintenance procedures \n \n3.  Underpinning skills \n3.1 \nManual dexterity \n3.2 \nMaintaining a healthy and safe working environment \n3.3 \nProcessing techniques \n3.4 \nMaintaining personal hygiene \n3.5      Following correct measurements \n3.6 \nPlanning and organizing work activities \n \n4.  Resource \nimplications \nThe following resources MUST be provided \n4.1 \nA real or simulated dental laboratory environment \n4.2      Relevant documentation such as: \n4.2.1 industry codes of practice \n4.2.2 state legislation as appropriate \n4.2.3 housekeeping/maintenance procedures \n \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nWritten Test/Examination \n5.3 \nThird Party Report \n5.4 \nPortfolio \n \n6.  Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting.\n",
