        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge of organizational procedures for \nhandling verbal and written communications \n1.2 \nReceived and acted on verbal messages and instructions \n1.3 \nDemonstrated competency in recording \ninstructions/information \n2. Underpinning \nknowledge  \n \n2.1 \nKnowledge of organizational policies/guidelines in regard to \nprocessing internal/external information \n2.2 \nEthical work practices in handling communications  \n2.3 \nCommunication process \n \n3. Underpinning skills \n3.1 \nConciseness in receiving and clarifying \nmessages/information/communication \n3.2 \nAccuracy in recording messages/information \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nPens \n4.2 \nNote pads \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDirect Observation \n5.2 \nOral interview  \n5.3 \nWritten Evaluation \n5.4 \nThird Party Report \n6. Context of \nassessment \n6.1 \nCompetency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.",
