  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in DENTAL LABORATORY TECHNOLOGY SERVICES NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nRECEIVE AND RESPOND TO WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311101\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nreceive, respond and act on verbal and written communication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine\nspoken messages\n1.1\nRequired information is gathered by listening attentively and\ncorrectly interpreting or understanding\ninformation/instructions.\n1.2\nInstructions/information are properly recorded.\n1.3\nInstructions are acted upon immediately in accordance with\ninformation received.\n1.4\nClarification is sought from workplace supervisor on all\noccasions when any instruction/information is not clear.\n2. Perform workplace\nduties following\nwritten notices\n2.1\nWritten notices and instructions are read and interpreted\ncorrectly in accordance with organizational guidelines.\n2.2\nRoutine written instructions are followed in sequence.\n2.3\nFeedback is given to workplace supervisor based on the\ninstructions/information received.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nMay refer to:\n1.1\nHandwritten and printed material\n1.2\nInternal memos\n1.3\nExternal communications\n1.4\nElectronic mail\n1.5\nBriefing notes\n1.6\nGeneral correspondence\n1.7\nMarketing materials\n1.8 Journal articles\n2. Organizational\nGuidelines\nMay include:\n2.1\nInformation documentation procedures\n2.2\nCompany policies and procedures\n2.3\nOrganizational manuals\n2.4\nService manual\n\n--- PDF PAGE 7 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n 3\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2\nReceived and acted on verbal messages and instructions\n1.3\nDemonstrated competency in recording\ninstructions/information\n2. Underpinning\nknowledge\n\n2.1\nKnowledge of organizational policies/guidelines in regard to\nprocessing internal/external information\n2.2\nEthical work practices in handling communications\n2.3\nCommunication process\n\n3. Underpinning skills\n3.1\nConciseness in receiving and clarifying\nmessages/information/communication\n3.2\nAccuracy in recording messages/information\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nPens\n4.2\nNote pads\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview\n5.3\nWritten Evaluation\n5.4\nThird Party Report\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 8 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n 4\nUNIT OF COMPETENCY :\nWORK WITH OTHERS\nUNIT CODE\n:\n500311102\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ndevelop workplace relationship and contribute in workplace\nactivities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace\nrelationship\n1.1.\nDuties and responsibilities are done in a positive manner to\npromote cooperation and good relationship.\n1.2.\nAssistance is sought from workgroup when difficulties arise\nand addressed through discussions.\n1.3.\nFeedback provided by others in the team is encouraged,\nacknowledged and acted upon.\n1.4.\nDifferences in personal values and beliefs are respected and\nacknowledged in the development.\n2. Contribute to work\ngroup activities\n2.1.\nSupport is provided to team members to ensure workgroup\ngoals are met.\n2.2.\nConstructive contributions to workgroup goals and tasks are\nmade according to organizational requirements.\n2.3.\nInformation relevant to work is shared with team members to\nensure designated goals are met.\n\n--- PDF PAGE 9 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1\nJob description and employment arrangements\n1.2\nOrganization’s policy relevant to work role\n1.3\nOrganizational structures\n1.4\nSupervision and accountability requirements including OHS\n1.5\nCode of conduct\n2. Work group\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3. Feedback on\nperformance\n3.1\nFormal/Informal performance appraisal\n3.2\nObtaining feedback from supervisors and colleagues and\nclients\n3.3\nPersonal, reflective behavior strategies\n3.4\nRoutine organizational methods for monitoring service\ndelivery\n4. Providing support to\nteam members\n4.1\nExplaining/clarifying\n4.2\nHelping colleagues\n4.3\nProviding encouragement\n4.4\nProviding feedback to another team member\n4.5\nUndertaking extra tasks if necessary\n5. Organizational\nrequirements\n5.1\nGoals, objectives, plans, systems and process\n5.2\nLegal and organization policy/guidelines\n5.3\nOHS policies, procedures and programs\n5.4\nEthical standards\n5.5\nDefined resources parameters\n5.6\nQuality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 10 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n 6\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nProvided support to team members to ensure goals are met\n1.2\nActed on feedback from clients and colleagues\n1.3\nAccessed learning opportunities to extend own personal work\ncompetencies to enhance team goals and outcomes.\n\n2. Underpinning\nknowledge\n\n2.1\nThe relevant legislation that affect operations, especially with\nregards to safety\n2.2\nReasons why cooperation and good relationships are important\n2.3\nKnowledge of the organization’s policies, plans and procedures\n2.4\nUnderstanding how to elicit and interpret feedback\n2.5\nKnowledge of workgroup member’s responsibilities and duties\n2.6\nImportance of demonstrating respect and empathy in dealings\nwith colleagues\n2.7\nUnderstanding of how to identify and prioritize personal\ndevelopment opportunities and options\n\n3. Underpinning skills\n\n3.1\nAbility to read and understand the organization’s policies and\nwork procedures\n3.2\nWrite simple instructions for particular routine tasks\n3.3\nInterpret information gained from correspondence\n3.4\nCommunication skills to request advice, receive feedback and\nwork with a team\n3.5\nPlanning skills to organize work priorities and arrangement\n3.6\nTechnology skills including the ability to select and use\ntechnology appropriate to a task\n3.7\nAbility to relate to people from a range of social, cultural and\nethnic backgrounds\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual member\nin relation to the work activities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies\n\n6. Context of\nassessment\n\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 11 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n 7\nUNIT OF COMPETENCY: DEMONSTRATE WORK VALUES\nUNIT CODE : 500311103\nUNIT DESCRIPTOR : This unit covers the outcomes required in demonstrating and living by\ndesirable values and ethics in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\nof work\n1.1\nOne’s unique sense of purpose for working and the why’s of\nwork are identified, reflected on and clearly defined for one’s\ndevelopment as a person and as a member of society.\n1.2\nPersonal mission is in harmony with company’s values.\n2. Apply work\nvalues/ethics\n2.1\nWork values/ethics/concepts are classified and reaffirmed in\naccordance with the transparent company ethical standards,\npolicies and guidelines.\n2.2\nWork practices are undertaken in compliance with industry\nwork ethical standards, organizational policy and guidelines.\n2.3\nPersonal behavior and relationships with co-workers and/or\nclients are conducted in accordance with ethical standards,\npolicy and guidelines.\n2.4 Company resources are used in accordance with transparent\ncompany ethical standards, policy and guidelines.\n3. Deal with ethical\nproblems\n3.1\nCompany ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and guidelines.\n3.2\nWork incidents/situations are reported and/or resolved in\naccordance with company protocol/guidelines.\n3.3\nResolution and/or referral of ethical problems identified are\nused as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and company’s\ncore values.\n4.2 Instructions to co-workers are provided based on ethical,\nlawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers using\nappropriate behavior and language.\n\n--- PDF PAGE 12 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n 8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Work values/ethics/\n concepts\n\nMay include but are not limited to:\n1.1\nCommitment/Dedication\n1.2\nSense of urgency\n1.3\nSense of purpose\n1.4\nLove for work\n1.5\nHigh motivation\n1.6\nOrderliness\n1.7\nReliability\n1.8\nCompetence\n1.9\nDependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19\nSense of nationalism\n\n2. Work practices\n\n2.1\nQuality of work\n2.2\nPunctuality\n2.3\nEfficiency\n2.4 Effectiveness\n2.5\nProductivity\n2.6\nResourcefulness\n2.7\nInnovativeness/Creativity\n2.8\nCost Consciousness\n2.9\n5S\n2.10\nAttention to details\n\n3. Incidents/situations\n\n3.1\nViolent/intensed dispute or argument\n3.2\nGambling\n3.3\nUse of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n\n4. Company resources\n\n4.1\nConsumable materials\n4.2\nEquipment/Machineries\n4.3\nHuman\n4.4\nTime\n4.5\nFinancial resources\n\n5. Instructions\n5.1\n\n5.2\nVerbal\n5.3\nWritten\nEVIDENCE GUIDE\n\n--- PDF PAGE 13 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n 9\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDefined one’s unique sense of purpose for working\n1.2\nClarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3\nDemonstrated work practices satisfactorily and consistently in\ncompliance with industry work ethical standards,\norganizational policy and guidelines\n1.4\nDemonstrated personal behavior and relationships with co-\nworkers and/or clients consistent with ethical standards, policy\nand guidelines\n1.5\nUsed company resources in accordance with company ethical\nstandard, policies and guidelines\n1.6\nFollowed company ethical standards, organizational policy\nand guidelines on the prevention and reporting of unethical\nconduct/behavior\n2. Underpinning\nknowledge\n2.1\nOccupational health and safety\n2.2\nWork values and ethics\n2.3\nCompany performance and ethical standards\n2.4\nCompany policies and guidelines\n2.5\nFundamental rights at work including gender sensitivity\n2.6\nWork responsibilities/job functions\n2.7\nCorporate social responsibilities\n2.8\nCompany code of conduct/values\n2.9\nBalancing work and family responsibilities\n3. Underpinning skills\n3.1\nInterpersonal skills\n3.2\nCommunication skills\n3.3\nSelf awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of assessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nThird Party Reports\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 14 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n10\nUNIT OF COMPETENCY :\nPRACTICE HOUSEKEEPING PROCEDURES\nUNIT CODE\n:\n500311104\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\napply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\nunnecessary items\n1.1\nReusable, recyclable materials are sorted in accordance with\ncompany/office procedures.\n1.2\nUnnecessary items are removed and disposed of in\naccordance with company or office procedures.\n2. Arrange items\n2.1\nItems are arranged in accordance with company/office\nhousekeeping procedures.\n2.2\nWork area is arranged according to job requirements.\n2.3\nActivities are prioritized based on instructions.\n2.4\nItems are provided with clear and visible identification\nmarks based on procedure.\n2.5\nSafety equipment and evacuation passages are kept clear\nand accessible based on instructions.\n3. Maintain work area,\ntools and equipment\n3.1\nCleanliness and orderliness of work area is maintained in\naccordance with company/office procedures.\n3.2\nTools and equipment are cleaned in accordance with\nmanufacturer’s instructions/manual.\n3.3\nMinor repairs are performed on tools and equipment in\naccordance with manufacturer’s instruction and manual.\n3.4\nDefective tools and equipment are reported to immediate\nsupervisor.\n4. Follow standardized\nwork process and\nprocedures\n4.1\nMaterials for common use are maintained in designated area\nbased on procedures.\n4.2\nWork is performed according to standard work procedures.\n4.3\nAbnormal incidents are reported to immediate supervisor.\n5. Perform work\nspontaneously\n5.1\nWork is performed as per instruction.\n5.2\nCompany and office decorum are followed and complied with.\n5.3\nWork is performed in accordance with occupational health\nand safety (OHS) requirements.\n\n--- PDF PAGE 15 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1\nNon-recyclable materials\n1.2\nUnserviceable tools and equipment\n1.3\nPictures, posters and other materials not related to work\nactivity\n1.4\nWaste materials\n2. Identification marks\n2.1\nLabels\n2.2\nTags\n2.3\nColor coding\n3. Decorum\n3.1\nCompany/office rules and regulations\n3.2\nCompany/office uniform\n3.3\nBehavior\n4. Minor repair\nMinor repair include but are not limited to:\n4.1\nReplacement of parts\n4.2\nApplication of lubricants\n4.3\nSharpening of tools\n4.4\nTightening of nuts, bolts and screws\n\n--- PDF PAGE 16 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n12\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPracticed the basic procedures of 5S\n2. Underpinning\nknowledge\n2.1\nPrinciples of 5S\n2.2\nWork process and procedures\n2.3\nSafety signs and symbols\n2.4\nGeneral OH & S principles and legislation\n2.5\nEnvironmental requirements relative to work safety\n2.6\nAccident/Hazard reporting procedures\n3. Underpinning skills\n3.1\nBasic communication skills\n3.2\nInterpersonal skills\n3.3\nReading skills required to interpret instructions\n3.4\nReporting/recording accidents and potential hazards\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFacilities, materials, tools and equipment necessary for the\nactivity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nThird Party Report\n5.2\nInterview\n5.3\nDemonstration with questioning\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 17 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n13\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nMAINTAIN INSTRUMENTS AND EQUIPMENT IN WORK AREA\nUNIT CODE\n:\nHCS346201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nmaintaining instruments and equipment in the work area.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to clean\nused items\n\n1.1\nSafe work practices and standard precautions are followed\nat all times in accordance with legislative and workplace\nguidelines.\n1.2\nSharps and sharps debris are disposed into a container and in\naccordance with workplace guidelines.\n1.3 Waste is segregated and disposed in accordance with\norganization and legislative guidelines.\n2. Clean and dry used\nitems\n2.1\nWorkflow protocols are maintained in instrument\nreprocessing area and in accordance with workplace\nguidelines.\n2.2\nInstruments are prepared for cleaning and in accordance\nwith workplace guidelines.\n2.3\nAppropriate cleaning agents are selected and used in\naccordance with workplace guidelines and manufacturer’s\nspecification.\n2.4\nCleaning methods that avoid the generation of aerosols are\nused in accordance with workplace guidelines.\n2.5\nInstruments are dried and inspected for damage and\nremaining debris and in accordance with workplace\nprocedures.\n2.6\n Cleaning process is monitored in accordance with\nworkplace guidelines.\n3. Prepare and pack\nitems for storage\n\n3.1 Instruments with hinges or ratchets are opened and unlocked\nin accordance with standard operating procedures.\n3.2\nInstrument trays are prepared in accordance with workplace\nprotocols.\n3.3\nCritical site instruments are packaged or wrapped in a\nmanner that prevents damage to delicate items.\n\n--- PDF PAGE 18 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n14\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safe work practices\n\nMay include but are not limited to:\n1.1\nTreatment of all items as a potential source of infection\n1.2\nPersonal hygiene practices especially washing and drying\nhands\n1.3\nWork practices for the safe handling of sharps\n1.4\nWork practices for the safe disposal of sharps and other\nclinical waste\n1.5\nThe use of personal protective equipment:\n1.5.1 heavy duty gloves\n1.5.2 mask and protective eyewear\n1.5.3 hair protection or covering\n1.5.4 protective clothing and safety footwear\n1.6 Safe handling, storage and disposal of chemicals\n1.7 Safe handling techniques especially as they relate to lifting\nand handling dangerous and contaminated items\n2. Legislative and\nworkplace guidelines\nMay include:\n2.1 Infection control guidelines for the transmission of infectious\ndiseases in the health care setting\n2.2\nState legislative requirements\n2.3\nOrganization infection control policies and procedures\n2.4\nOccupational Health and Safety policies and procedures\n2.5\nMaterial Safety Data Sheets for the chemicals used\n3. Waste\nMay include but is not limited to:\n3.1\nClinical waste:\n3.1.1 discarded sharps\n3.1.2 human tissues\n3.1.3 laboratory waste\n3.1.4 any other waste as specified by the workplace\n3.2\nRelated waste:\n3.2.1 radiographic waste\n3.2.2 chemical waste\n3.2.3 metal alloy waste\n3.3\nGeneral waste\n4. Disposal of waste\nrequirements\nMay include:\n4.1\nDisposal in accordance with:\n4.1.1 Environment Protection Policy (Waste Management)\n4.1.2 Environment Protection Regulations (Waste\nManagement)\n4.2\nOrganization policy\n5. Work flow protocols\nMay include:\n5.1\nSeparate hand washing facilities\n5.2\nSink suitable for disposal of liquid waste\n5.3\nOne direction flow of instruments from contaminated to clean\nto sterile\n5.4\nDesignated work area that is physically separate to prevent\npossible contamination of processed items\n5.5\nIdentification and reporting of disruptions to work flow\nprotocols in accordance with workplace procedures\n\n--- PDF PAGE 19 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n15\n\nVARIABLE\nRANGE\n6. Preparation of\ninstruments for\ncleaning\n\nMay include:\n6.1\nSorting according to type of instrument and corresponding\ncleaning method\n6.2 Written procedures for handling specialized items\n6.3\nDisassembly of instruments where possible for detergent to\nreach all surfaces\n6.4 Checking for instrument defects, damage and missing parts\n7. Selection and use of\nappropriate cleaning\nagents\nMay include:\n7.1 Meeting requirements of Product Data Bulletins and Materials\nSafety Data Sheets for the chemicals used\n8. Cleaning methods\nMay include:\n8.1 Initial treatment of used instruments close to their point of use\nto decrease bio burden\n8.2 Thermal washer/disinfector in accordance with current\nstandards\n8.3\nUltrasonic cleaner in accordance with current standards\n8.4\nManual cleaning\n9. Monitoring the\ncleaning process\nMay include:\n9.1 Visual inspection of all items for cleanliness and absence of\ndetergent or rinse additive residues\n9.2 Daily cleaning and maintenance of ultrasonic cleaner and\nwasher/disinfector\n9.3\nDaily performance testing of ultrasonic cleaner\n9.4\nDaily checks of washer/disinfector function and detergent\ndispenser\n10. Critical site\ninstruments\nMay include:\n10.1 Instruments which must be cleaned and disinfected as\nneeded\n11 Routine cleaning and\nchecking of\nsterilizers\nMay include but is not limited to:\n11.1 Daily checks:\n11.1.1 floor of sterilizer is free of debris\n11.1.2 chamber drain and filter are clear\n11.1.3 recording devices, gauges and timers are functioning\ncorrectly\n11.1.4 water reservoir (portable benchtop sterilizers) emptied,\ncleaned and refilled with distilled water\n11.1.5 door seals are intact\n11.2 Cleaning:\n11.2.1 loading tray and external surfaces cleaned daily\n\n--- PDF PAGE 20 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n16\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nFollowed safe handling, drying and cleaning protocols\n1.2\nFollowed correct packing, assembly and wrapping procedures\nand storage\n1.3\nFollowed appropriate OH&S procedures\n\n2. Underpinning\nknowledge\n\n2.1\nWorkflow protocols in the instrument reprocessing area\n2.2\nWorkplace procedures for using an ultrasonic cleaner\n2.3\nWorkplace procedures for manual cleaning\n2.4\nInstrument maintenance checklists\n\n3. Underpinning skills\n\n3.1\nFollowing safe work practices and applying standard\nprecautions during cleaning and preparation of items:\n3.1.1 checking items for defects after cleaning\n3.1.2 selecting and safely using appropriate cleaning agents\n3.1.3 selecting and wearing appropriate personal protective\nequipment\n3.2\nMaintaining workflow protocols in instrument reprocessing\narea from contaminated to clean and disinfect\n3.3\nOperating mechanical cleaners including ultrasonic cleaner or\nsteamer\n3.4\nDrying items before packaging\n3.5\nStoring packaged items in a clean place away from sources of\nmoisture and contamination\n\n4. Resource\nImplications\n\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 21 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n17\nUNIT OF COMPETENCY :\nASSIST IN DENTAL LABORATORY PROCEDURES\nUNIT CODE\n:\nHCS346202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nassisting in dental laboratory procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow dental\nlaboratory\nprocedures\n1.1\nPlanned procedure is identified correctly.\n1.2\nEquipment, instruments and materials is anticipated and\nselected for the planned procedure and arranged them in their\nlikely order of use.\n2. Use dental laboratory\nterminology in\ncommunication\n2.1\nDental terminology is used in communicating with the dental\nteam.\n2.2\nDental terminology is used in receiving, understanding and\ndocumenting written and oral instructions.\n2.3\nFrequently used abbreviations and symbols in dental\nlaboratory are understood.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Equipment,\ninstruments,\nmaterials\nMay include but are not limited to:\n1.1\nHand Instruments\n1.2\nLaboratory Equipment\n1.3\nLaboratory Materials\n2 Personal Protective\nEquipment\nMay include but are not limited to:\n2.1\nGowns and waterproof aprons\n2.2\nGlasses, goggles or face-shields\n2.3\nFace masks\n\n--- PDF PAGE 22 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n18\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nComplied consistently with occupational health and safety\npolicies of OHSS\n1.2\nDemonstrated consistent performance in the following\nworkplace situations such as:\n1.2.1 Maintenance and storage of instruments, equipment\nand materials in accordance with manufacturer\nspecifications and operator’s requirements\n1.2.2 Compliance with occupational health and safety\nprocedures\n1.2.3 Storage of materials in accordance with manufacturer\nspecifications and operator’s requirements\n1.2.4 Maintenance of records of maintenance procedures\nand processes\n\n2. Underpinning\nknowledge\n\n2.1\nFundamental knowledge of oral anatomy including:\n2.1.1 Structure and functions of teeth and the periodontal\ntissues\n2.1.2 Structures of the oral cavity\n2.1.3 Tooth identification\n2.2\nDental laboratory records and laboratory prescriptions\nincluding:\n2.2.1 knowledge of correct dental terminology and how it is\nused in dental laboratory prescription items that\nconstitute a dental laboratory record\n2.2.2 Dental notation systems and prescription symbols\n2.2.3 Confidentiality of prescriptions\n2.2.4 The purpose of study casts and the materials used in\ntheir fabrication\n2.3 Fundamental knowledge of dental laboratory materials\n2.4\nDental laboratory practice/organization policies and\nprocedures\n\n--- PDF PAGE 23 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n19\n\n3. Underpinning skills\n\n3.1\nConsistently using safe work practices to minimize the risk of\ntransmission of infection including:\n3.1.1 Following the procedure for washing and drying of\nhands\n3.1.2 Putting into practice cleaning techniques\n3.1.3 Using personal protective equipment\n3.1.4 Limiting contamination\n3.1.5 Protecting materials, equipment and instruments from\ncontamination until required for use\n3.2\nUsing literacy skills to read and follow directions, policies and\nprocedures including:\n3.2.1 Occupational health and safety policies and procedures\n3.2.2 Infection control policies and procedures\n3.2.3 Practice policies and procedures\n3.3\nConsistently following sequenced written instructions and\nmanufacturer specifications for the preparation of dental\nlaboratory materials\n3.4\nConsistently demonstrating interpersonal skills when relating\nto people from a range of social, cultural and religious\nbackgrounds and physical and mental abilities.\n3.5\nConsistently demonstrating communication skills as required\nin fulfilling the job role as specified by the dental laboratory\npractice /organization including:\n3.5.1 Negotiation\n3.5.2 Asking questions\n3.5.3 Active listening\n3.5.4 Asking for clarification from client and /or carer\n3.5.5 Acknowledging and responding to a range of views\n3.6\nConsistently dealing with conflict\n3.7\nConsistently working with others and displaying empathy with\nclient and relatives\n3.8\nConsistently using problem solving skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate supplies and materials\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 24 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n20\nUNIT OF COMPETENCY :\nASSIST WITH ADMINISTRATION IN DENTAL LABORATORY\nPRACTICE\nUNIT CODE\n:\nHCS346203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nmanaging appointments to suit the client and the organization, to\nrecord and reconcile payments and to maintain client record.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\neffectively with clients\nand other persons\n\n1.1\nClients and other visitors are greeted appropriately.\n1.2\nAn appropriate environment is made available for the client to\ncomplete medical, dental and financial details.\n1.3\nClient and/or carer point of view is listened carefully.\n1.4\nInformation provided to client and/or carer appropriately and\nlanguage used completely so that it can easily be understood.\n1.5\nClient and/or carer ensured they understood information\nprovided to them.\n1.6\nBeing polite and negative comments avoided shows empathy\nand respect for client and/or carer.\n2. Respond\nappropriately to\nenquiries from clients\nand visitors\n2.1\nPersonal dress and presentation is maintained.\n2.2\nCommunication equipment is used effectively.\n2.3\nEnquiries are responded promptly, politely and ethically.\n2.4\nPurpose of an enquiry, the identity of the person is determined\nand relevant record/s retrieved if required.\n2.5\nMessages prioritized and recorded legibly and accurately.\n2.6\nEnquiries outside area of responsibility are referred to\nappropriate supervisor.\n2.7\nElectronic communication with clients and /or carers is\ncomplied in accordance with organizational protocols.\n2.8\nConfidentiality of information relating to clients, staff and the\ndental practice/organization is maintained.\n3. Allocate\nappointments\nappropriate to client\nand organization\nrequirements\n3.1\nClient’s appointment requirements are identified.\n3.2\nAppointment time is set in accordance with the client’s\npreferences and the organization’s requirements.\n3.3\nAppointment details are recorded accurately and legibly\nusing standard dental notation in the organizations\nappointment system.\n3.4\nCopy of appointment details is provided to the client.\n3.5\nAppointment schedules are monitored; clients and the oral\nhealth care team are notified of any necessary changes within\na suitable timeframe.\n4. Calculate and record\nbasic financial\ntransactions\n4.1\nPetty cash vouchers and all monies are completed accurately\nand account for.\n4.2\nCorrect fees are calculated.\n4.3\nGST applied in accordance with identified requirements.\n4.4\nPayments received are checked and recorded legibly and\naccurately.\n4.5\nChecks and credit card vouchers are validated\n4.6\nClient is provided with a receipt.\n\n--- PDF PAGE 25 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n21\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5. Handle cash and\nrecord financial\ntransactions\n5.1\nBalances accurately monies received against records of\npayment in accordance with organization policies\n5.2\nCash is secured in an approved location.\n5.3\nSuspected breaches of security are responded and\nappropriate action taken within minimum delay in accordance\nwith organization policies.\n5.4\nRecord of bad debts identified and appropriate action taken in\nline with office procedures.\n5.5\nBanking procedures are followed in accordance with\norganization policies.\n6. Maintain client\nrecords\n6.1\nCorrect client files are removed and appropriate fees and\ndiagnostic records attached.\n6.2\nOrder of payment is placed in files.\n6.3\nInformation entered legibly, accurately and updated as\nappropriate\n6.4\nClient’s dental records are filed correctly after use\n6.5\nRecords of laboratory work are maintained up-to-date,\naccurate, legible and complete\n7. Assist with client\nrecalls\n7.1\nKnowledge of client recall system is applied\n7.2\nClient records is marked with relevant recall date as\nappropriate and as directed by the operator\n7.3\nClients who are due for recall are identified and notified them\nthat an appointment is due\n7.4\nClients who do not respond to a recall appointment request\nare followed-up with courtesy\n\n--- PDF PAGE 26 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n22\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Communication\nequipment\nMay include but are not limited to:\n1.1 Telephone/Mobile Phone\n1.2 Facsimile\n1.3 E-mail/Website\n2. Maintaining\nconfidentiality\nMay include but are not limited to:\n2.1 Public environments\n2.2 Legal and ethical requirements\n2.3 Writing personal details such as medical and dental histories\nand consent forms\n2.4 Conversations on the telephone/mobile phone\n2.5 Secure location for written records\n2.6 Offering a private location for discussion\n2.7 Information disclosed to an appropriate person consistent with\nthe responsibility of a dental assistant\n3 Appointment\nrequirements\nMay include but are not limited to:\n3.1 Appointment requirements of the client:\n3.1.1\nRoutine examination\n3.1.2\nDefined procedures\n3.1.3\nEmergencies\n3.2 Special requirements of the dental practice:\n3.2.1\nTiming requirements for different types of procedures\n3.2.2\nAvailability of staff\n3.3 Scheduling a series of appointments\n4. Recording of\nappointment details\nMay include:\n4.1 Manual – appointment book\n4.2 Electronic – computer based program\n4.3 Appointment details include the following:\n4.3.1\nClient’s name\n4.3.2\nClient’s contact details\n4.3.3\nProcedure to be performed for that appointment\n5. Dental records\nMay include but are not limited to:\n5.1 Dental charts and dental treatment records\n5.2 Completed medical questionnaires\n5.3 Consent documents obtained for treatment\n5.4 Radiographs, tracings and measurements\n5.5 Diagnostic models\n5.6 Photographs\n5.7 Records of financial transactions\n5.8 Notes made by staff following telephone conversations\n5.9 Reports to and from referring dentists and specialists\n5.10 Copies of correspondence relating to the client\n6. Recall system\nMay include:\n6.1 Manual\n6.2 Electronic\n\n--- PDF PAGE 27 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n23\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied consistently with infection control guidelines of DOH\nand occupational health and safety policies of OHSS\n1.2 Demonstrated consistent performance in the following workplace\nsituations such as:\n1.2.1 Responding to a variety of requests for information from\na range of persons\n1.2.2 Accurate calculation of fees\n1.2.3 Recording of financial transactions in accordance with\ndental practice/organization requirements\n1.2.4 Assist with management of an effective appointment and\nrecall system\n1.2.5 Recording, labeling and filing forms and records in\naccordance with legislation and the dental practice /\norganization policies\n\n2. Underpinning\nknowledge\n\n2.1 Dental terminology:\n2.1.1 Abbreviations and symbols used when recording dental\ntreatment\n2.1.2 FDI notation system used to designate the permanent\nand deciduous teeth during examination and charting\n2.1.3 Palmer notation system used to designate the permanent\nand deciduous teeth during examination and charting\n2.1.4 Community periodontal index\n2.1.5 Symbols used during charting of individual\n\n2.2 Handling and recording financial transactions:\n2.2.1 Itemizing of client accounts\n2.2.2 Issuing invoices\n2.2.3 Recording of payments and issuing receipts\n2.2.4 The different methods of payment\n2.2.5 The details that need to be recorded and checked for\ncredit and/or debit cards and check payments\n2.2.6 Operating a petty cash system\n2.2.7 Organization policy on banking and handling of cash\nsecurely\n\n2.3 Legal requirements\n2.3.1 The reasons for ensuring the confidentiality of\ninformation provided by the client\n2.3.2 Confidentiality requirements for the recording and\nstorage of client records\n2.3.3 The requirements of the Health Privacy Principle and\ntheir application to the collection of information by the\ndental practice or organization\n\n--- PDF PAGE 28 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n24\n\n2.4 Appointments:\n2.4.1 The time requirements of different treatment procedures\nand the effect this has on appointment scheduling\n2.4.2 The particular needs which clients may have for the\ntiming of appointments\n2.4.3 The dentists preferred work routine\n2.4.4 The time constraints imposed by the dental laboratory\n2.4.5 The relevant details that must be entered into the\nappointment system and the written confirmation that\nmust be provided to the client\n2.4.6 The action that must be taken for broken and/or\ncancelled appointments\n2.4.7 Confirmation of appointments\n\n2.5 Recall appointment\n2.5.1 Methods used by the dental practice or the organization\nto identify those clients who require either recall\nexamination or follow-up treatment\n2.5.2 Methods used to follow-up clients who do not respond to\nrecall\n\n3. Underpinning skills\n3.1 Using available technology and software for recording\nappointments and payments\n3.2 Using oral communication skills required to fulfill the job role as\nspecified by the dental practice/organization\n3.2.1 Negotiation\n3.2.2 Asking questions\n3.2.3 Active listening\n3.2.4 Asking for clarification from caller or client\n3.2.5 Acknowledging and responding to a range of views\n3.3 Using literacy skills to read and following directions, policies and\nprocedures\n3.3.1 Occupational health and safety policies and procedures\n3.3.2 Infection control policies and procedures\n3.3.3 Practice/Organization policies and procedures\n3.4 Using numeracy skills\n3.4.1 Basic mathematical calculations such as addition,\nmultiplication and calculations of percentages\n3.4.2 Handling and recording of basic financial calculations\n3.5 Selecting and applying procedures to perform a range of tasks;\nfollowing sequenced written instructions, recording accurately\nand legibly client details\n3.6 Dealing with conflict\n3.7 Using problem solving skills required including using available\nresources, prioritizing appointments and assessing urgency of\ncalls\n\n--- PDF PAGE 29 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n25\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.4 Appropriate supplies and materials\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 30 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n26\n\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:\nICT311201\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a personal\ncomputer by: starting the PC, logging in, using and working with\nfiles, folders and programs, saving work, and closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1\nThe peripheral devices are properly connected\n1.2\nPower is checked and the computer and peripheral devices are\nswitched on\n1.3\nProper logging in and logging off is successfully done\n1.4\nThe operating system features and functions are accessed and\nnavigated\n1.5\nHardware configuration and other system features are checked\n2. Arrange and\ncustomize\ndesktop display/\nWindows\nsettings\n\n2.1\nThe desktop screen or Windows elements are changed as needed\n2.2\nDesktop icons are added, renamed, moved, copied or deleted\n2.3\nThe online help functions are accessed or used as needed\n2.4\nDesktop icons of application programs are selected, opened and\nclosed\n2.5\nProperties of icons are displayed\n2.6\nComputer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1\nA file or folder is created, opened, moved, renamed or copied\n3.2\nFiles are located, deleted and restored\n3.3\nDetails and properties of files and folders are displayed or viewed\n3.4\nVarious files are organized for easy lookup and use\n3.5\nFiles and information are searched\n3.6\nDisks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1\nApplication programs are added, changed, removed or ran\n4.2\nUser software or application program are installed, updated and\nupgraded\n4.3\nInformation/data are moved between documents or files\n5. Print\ninformation\n5.1\nPrinter is added or installed and correct printer settings is ensured\n5.2\nDefault printer is assigned accordingly\n5.3\nInformation or document is printed on the installed printer\n5.4\nProgress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1\nAll open application programs are closed\n6.2\nComputer and peripheral devices are properly shut down\n\n--- PDF PAGE 31 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n27\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Peripheral device\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n2. Computer\nMay include:\n2.1 Laptops/notebooks\n2.2 Workstations\n2.3 Servers\n2.4 other personal computer devices\n3. Application\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n4. Operating system\nMay include but is not limited to the various versions and variants of:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n\n5. System features\nMay include but is not limited to the operating system features and\nhardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n\n--- PDF PAGE 32 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n28\n\nVARIABLE\nRANGE\n6. Online help\nfunctions\n6.1 An instruction manual, or a portion of the manual, integrated and\naccessible from within the program or software being used.\n7. Properties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n8. Various files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n9. Disks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation.\n\n--- PDF PAGE 33 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n29\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof Competency\n1.1 Assessment must confirm the ability to utilize software, navigate\nthe desktop, using system features to perform tasks and save\nresults of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware components\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or disk\nstorage\n3.2 Mouse and keyboarding skills for running software applications\n3.3 Reading and writing at a level where basic workplace documents\nare understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions using a\npersonal computer whether standalone or in a networked\nenvironment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nwork environment.\n\n--- PDF PAGE 34 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n30\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nFABRICATE MODELS\nUNIT CODE\n:\nHCS322323\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in fabricating\nmodels.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Verify integrity of\nimpressions\n\n1.1\nImpression is disinfected according to Department of Health\nguidelines.\n1.2\nImpressions are examined for defects.\n1.3\nImpression is checked to ensure it meets the specifications of\nthe work.\n2. Select and prepare\nmodel materials\n2.1\nAppropriate materials are selected.\n2.2\nMaterials are prepared in accordance with desired outcome.\n3. Pour impressions\n3.1\nImpressions are prepared for pouring.\n3.2\nMaterials are poured into impressions in accordance with\naccepted techniques.\n3.3\nRequired setting time is allowed.\n5. Finish model\n\n4.1\nModel is recovered intact from impression.\n4.2\nModel is inspected for defects.\n4.3 Models a re trimmed according to requirements.\n\n5. Duplicate model\n5.1\nDuplicating materials are prepared according to\nmanufacturer’s instructions.\n5.2\nDuplicating materials are mixed according to manufacturer’s\ninstructions.\n5.3\nAn accurate, bubble free cast is produced.\n\n--- PDF PAGE 35 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Impression\n\nMay include but are not limited to:\n1.1\nEdentulous impression\n1.2\nDentulous impressions\n1.3\nPartially dentulous\n\n2. Pour materials into\nimpressions\n\nMay include but are not limited to:\n\n2.1\nRigid impression materials\n2.2\nAqueous elastomers\n2.3\nNon-aqueous elastomers\n3. Duplicating materials\nMay include but are not limited to:\n3.1 Stones\n3.2 Diestones\n3.4\nRefractories\n\n--- PDF PAGE 36 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n32\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nVerified integrity of impressions\n1.2\nSelected and prepared model materials\n1.3\nPoured impressions\n1.4\nFinished models\n1.5 Duplicated model\n1.6\nFollowed OH&S and Department of Health (DOH) infection\ncontrol guidelines\n\n2. Underpinning\nknowledge\n\n2.1\nKnowledge on basic oral anatomy and occlusion\n2.2\nKnowledge and application of basic hygiene and the\nimportance of maintaining clean equipment and working\nenvironment\n2.3\nRelevant material science for carrying out procedure\n2.4 Occupation Health and Safety and material safety datasheets\n2.5\nCurrent Department of Health infection control guidelines,\nuses and specifications of dental packaging equipment and\nrelated products\n2.6\nDental policies and procedures\n2.7\nIndustry codes of practice and relevant legislation\n\n3. Underpinning skills\n\n3.1\nCommunicating and interacting appropriately with colleagues,\nhealth care practitioners, other clients and patients\n3.2\nCommunicating ideas and information\n3.3\nMaintaining cleanliness\n3.4\nDemonstrating manual dexterity\n3.5\nWorking with others and in teams\n3.6\nPlanning and organizing activities\n3.7\nLanguage, literacy and numeracy skills appropriate to the job\nrole and function e.g. documenting packaging information and\nrecording procedures\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRelevant documentation such as:\n4.2.1 dental policies and procedures\n4.2.2 industry codes of practice and relevant legislation\n4.3\nAccess to a range of packaging equipment and related\nproducts\n4.4\nA qualified workplace assessor and/or technical expert\nworking in partnership with the assessor\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 37 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n33\nUNIT OF COMPETENCY: FABRICATE CUSTOM IMPRESSION TRAYS\nUNIT CODE : HCS322324\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in fabricating\ncustom impression trays.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare model\n1.1\nWork is interpreted.\n1.2\nUndesirable undercuts are blocked out.\n1.4\nOutline is marked and spacer is applied as required.\n2. Select and prepare\nmaterials\n2.1\nSelected materials are obtained and mixed in accordance with\nmanufacturer’s instructions.\n2.2 Equipment is prepared for processing.\n2.4\nMixing vessels and templates are provided.\n3. Fabricate custom\nimpression tray\n3.1\nMaterials are mixed or manipulated to desired outcome.\n3.2\nMaterial is adapted to the cast.\n3.3\nHandle is fabricated and attached as required.\n3.4\nCustom tray is processed in accordance with industry\nstandards.\n3.5\nOutline is trimmed.\n3.6\nSpacer material is removed.\n3.7\nOutline is refined and polished as required.\n3.8\nImpression tray is customized to particular impression\nmaterial requirements.\n3.9\nImpression tray is disinfected according to DOH guidelines.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Custom Trays\n\nTrays may be fabricated for:\n1.1\nFully edentoulous\n1.2\nPartially dentate\n1.3\nFully dentate\n1.4\nImplant cases\n\n2. Spacer materials\n\nA range of spacer materials may be used:\n2.1 Acrylic\n2.2 Thermoplastic\n2.3 Light-cured composite\n\n3. Impression tray\n\nMay include but are not limited to:\n3.1\nFull arch\n3.2\nAnterior\n3.3\nPosterior\n3.4\nQuadrant\n\n--- PDF PAGE 38 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n34\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model.\n1.2\nSelected and prepared materials\n1.3\nFabricated custom impression tray\n1.4\nFollowed OH&S and DOH infection control guidelines\n1.5\nIdentified oro-facial anatomy\n1.6\nFollowed different techniques in model fabrication\n2. Underpinning\nknowledge\n\nKnowledge on the following:\n2.1\nRelevant material science for carrying out procedures\n2.2\nModel fabrication techniques\n2.3\nOro-facial anatomy\n2.4\nCurrent infection control DOH guidelines\n2.5\nOHS and material data safety sheets\n2.6\nDental workplace policies and procedures\n2.7\nIndustry codes of practice, standards and guidelines\n2.8\nNational and local legislation where appropriate\n3. Underpinning skills\n3.1\nModel fabrication techniques\n3.2\nManual dexterity\n3.3\nThermo-forming technology\n3.4\nVisible light-cured techniques\n3.5 Planning and organizing work activities\n3.5\nLanguage, literacy and numeracy skills appropriate to the role\nand workplace requirements\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 Dental policies and procedures\n4.2.2 Industry codes of practice, standards and guidelines\n4.2.3 State legislation where appropriate\n4.3 Access to a range of customers with different requirements\n(real or simulated)\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 39 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n35\nUNIT OF COMPETENCY: FABRICATE REGISTRATION BITE RIMS\nUNIT CODE : HCS322325\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in fabricating\nregistration bite rims.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and prepare\nmaterials\n1.1\nAppropriate material for the base and rims is selected.\n1.2\nModel is prepared to enable appropriate application of\nselected base metal.\n2. Fabricate base\n2.1\nSelected base material is applied to model.\n2.2 Base material is processed in accordance with type of base\nmaterial selected.\n2.3\nBase material is trimmed to peripheral contours of model and\nappropriate landmarks.\n3. Fabricate registration\nbite rims\n3.1 Bite rim is fabricated in selected material.\n3.2\nBite rim is trimmed to prescribed dimensions and appropriate\nlandmarks.\n3.3 Bite rim is smoothed and polished in accordance with material\nchosen.\n4. Prepare face-bow (if\nrequired)\n4.1\nFace-bow fork is located in required position.\n4.2\nMaterial is selected as required by the presentation.\n4.3\nFace-bows are finished in accordance with acceptable\nindustry standard.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Appropriate materials\nfor base\n\nMay include but are not limited to:\n1.1 Wax\n1.2 Thermo-formed materials\n1.3 Light-cured composite\n1.4 Acrylic\n1.5 Cast metal framework\n\n--- PDF PAGE 40 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n36\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nSelected and prepared materials for fabrication of registration\nbite rim.\n1.2\nConstructed base and registration bite rim\n1.3\nPrepared face-bow (if required)\n1.4\nComplied with DOH infection control policies and procedures\n1.5\nFollowed OH&S policies\n\n2. Underpinning\nknowledge\n\n2.1\nRelevant material science for carrying out procedures\n2.2 Basic oral anatomy and occlusion\n2.3 Range of standard dimensions\n2.4\nApplication of registration bite rim\n2.5\nIndustry codes and practices\n2.6\nNational and local legislation as appropriate\n2.7\nHousekeeping/maintenance procedures\n\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nProcessing techniques\n3.4\nMaintaining personal hygiene\n3.5 Following correct measurements\n3.6\nPlanning and organizing work activities\n\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 41 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n37\nUNIT OF COMPETENCY: ARTICULATE MODELS AND TRANSFER RECORDS\nUNIT CODE : HCS322326\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in articulating\nmodels and transferring records.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and prepare\narticulator\n1.1\nWork order requirements are confirmed.\n1.2\nArticulator is selected and adjusted as required.\n1.3\nMounting method to be used is identified in accordance with\nthe type of articulator.\n2. Select and prepare\nmaterials\n2.1\nModels and oral records are positioned in articulator.\n2.2 Mounting materials are prepared and applied to models.\n2.3 Centric records are established and secured.\n2.4 Excess material is removed in accordance with industry\nstandards\n2.8\nEquipment is cleaned in accordance with standard operating\nprocedures (SOPs).\n3. Transfer oral records\nto articulator\n3.1 Records are transported as provided.\n3.2\nMidline is recorded.\n3.3 Vertical height is set and recorded.\n3.4 Condylar angle is set as required.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Type of articulators\n\nMay include but are not limited to:\n1.1 Average movement\n1.2 Semi-adjustable\n1.3 Fully adjustable\n\n--- PDF PAGE 42 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nSelected and prepared articulator\n1.2\nSelected and prepared materials\n1.3\nTransferred oral records to articulator\n1.4\nComplied with DOH infection control policies and procedures\n1.5\nFollowed OH&S policies\n2. Underpinning\nknowledge\n\n2.1\nRecording techniques and devices\n2.2 Mechanical devices\n2.3 Articulators\n2.4 Face-bows\n2.5 Relevant material science for carrying out procedures\n2.9\nBasic oral anatomy and occlusion\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nRecording techniques\n3.4\nArticulating procedure\n3.5\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Range of articulators\n4.3 Range of jaw relationship\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 43 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n39\n\nUNIT OF COMPETENCY: FABRICATE MOUTHGUARD\nUNIT CODE : HCS322327\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in fabricating\nmouthguard.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare model for\nprocedure\n1.1\nPrescription is interpreted in accordance with the dentist’s\ninstruction.\n1.2\nModel is seated and correctly positioned for procedure.\n2. Check the dental\nmouthguard prior to\ninsertion\n2.1\nMouthguard is decontaminated in accordance with DOH\ninfection control guidelines.\n2.2 Potential injury causing areas of a mouthguard are removed\nprior to insertion.\n2.3\nMouthguard is assessed to ensure desired thickness and\nprotective capabilities have been achieved.\n3. Fit and evaluate the\nmouthguard\n3.1 Retention and stability are examined.\n3.2\nThe fitting surfaces of the mouthguard are checked for\naccuracy and comfort.\n3.3 Current DOH infection control guidelines are followed.\n4. Alter mouthguard if\nrequired\n4.1\nMaterials and equipment required to carry out alterations are\nused in accordance with manufacturer’s instructions, current\nDOH infection control and OHS guidelines.\n4.2\nFitting surfaces and occlusion are checked for accuracy and\naltered where pressure is indicated or where discrepancies to\nretention and stability are found.\n4.3\nDocumentation is completed as required.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Guidelines\n\nRelevant guidelines may include but are not limited to:\n1.1 Department of Health (DOH) infection control guidelines and\nprocedures\n1.2 Occupational Health and Safety Practices\n\n--- PDF PAGE 44 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n40\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model for procedure\n1.2\nChecked the dental mouthguard prior to insertion\n1.3\nFitted and evaluated the mouthguard\n1.4\nAltered mouthguard if required\n1.5 Complied with DOH infection control policies and procedures\n1.6\nFollowed OH&S policies and procedures\n2. Underpinning\nknowledge\n\n2.1\nRationale and objectives for mouthguard\n2.2 Types of mouthguard\n2.3 Maintenance requirements for mouthguard\n2.4 Principles of quality assurance and work effectiveness\n2.5 Legal and ethical issues relating to: informed consent, duty of\ncare and confidentiality\n2.6 Relevant OH&S regulations\n2.10\nCurrent DOH infection control guidelines\n3. Underpinning skills\n3.1\nCommunications Skills\n3.2\nProblem Solving\n3.3\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 45 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n41"
