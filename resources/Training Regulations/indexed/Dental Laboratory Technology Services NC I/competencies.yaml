        "evidence_guide": {
          "source_text": "1.\nCritical aspects\nof Competency\n1.1 Assessment must confirm the ability to utilize software, navigate\nthe desktop, using system features to perform tasks and save\nresults of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware components\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or disk\nstorage\n3.2 Mouse and keyboarding skills for running software applications\n3.3 Reading and writing at a level where basic workplace documents\nare understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions using a\npersonal computer whether standalone or in a networked\nenvironment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nwork environment.\n\n--- PDF PAGE 34 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n30\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nFABRICATE MODELS\nUNIT CODE\n:",
          "critical_aspects": [
            "of Competency 1.1 Assessment must confirm the ability to utilize software, navigate the desktop, using system features to perform tasks and save results of work. 2. Underpinning Knowledge Knowledge includes: 2.1 Keyboard layout and functions 2.2 Computer functions 2.3 Basic parts of a computer and various hardware components 2.4 Storage devices and file concepts 2.5 Basic software operation and functionalities 3. Underpinning Skills Skills include: 3.1 Saving and retrieving files to and from various folders or disk storage 3.2 Mouse and keyboarding skills for running software applications 3.3 Reading and writing at a level where basic workplace documents are understood 3.4 Clear ability to communicate with peers and supervisors 3.5 Interpretation of user manuals and help functions 3.6 The ability to carry out written and verbal instructions using a personal computer whether standalone or in a networked environment 4. Resource Implications To demonstrate competence in this unit access to the following resources will be required: 4.1 A personal computer 4.2 A printer 4.3 Mouse and keyboard 4.4 Basic systems software 5. Methods of Assessment Competency may be assessed through: 5.1 Observation in a workplace or simulated environment 5.2 Third party reports 5.3 Exams and tests 5.4 Demonstration of required skills 5.5 Interviews 6. Context for Assessment 6.1 Competency may be assessed in the workplace or in a simulated work environment.",
            "-- PDF PAGE 34 --- TR Dental Laboratory Technology Services NC I Promulgated April 2008",
