          "source_text": "1. Develop effective \nworkplace \nrelationship \n1.1. \nDuties and responsibilities are done in a positive manner to \npromote cooperation and good relationship. \n1.2. \nAssistance is sought from workgroup when difficulties arise \nand addressed through discussions. \n1.3. \nFeedback provided by others in the team is encouraged, \nacknowledged and acted upon. \n1.4. \nDifferences in personal values and beliefs are respected and \nacknowledged in the development. \n2. Contribute to work \ngroup activities \n2.1. \nSupport is provided to team members to ensure workgroup \ngoals are met. \n2.2. \nConstructive contributions to workgroup goals and tasks are \nmade according to organizational requirements. \n2.3. \nInformation relevant to work is shared with team members to \nensure designated goals are met.\n\n--- PDF PAGE 9 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n 5\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Duties and \nresponsibilities  \n1.1 \nJob description and employment arrangements \n1.2 \nOrganization’s policy relevant to work role \n1.3 \nOrganizational structures \n1.4 \nSupervision and accountability requirements including OHS \n1.5\nCode of conduct\n2. Work group \n2.1 \nSupervisor or manager \n2.2 \nPeers/work colleagues \n2.3\nOther members of the organization\n3. Feedback on \nperformance \n3.1 \nFormal/Informal performance appraisal \n3.2 \nObtaining feedback from supervisors and colleagues and \nclients \n3.3 \nPersonal, reflective behavior strategies \n3.4 \nRoutine organizational methods for monitoring service \ndelivery\n4. Providing support to \nteam members \n4.1 \nExplaining/clarifying \n4.2 \nHelping colleagues \n4.3 \nProviding encouragement \n4.4 \nProviding feedback to another team member \n4.5\nUndertaking extra tasks if necessary\n5. Organizational \nrequirements \n5.1 \nGoals, objectives, plans, systems and process \n5.2 \nLegal and organization policy/guidelines \n5.3 \nOHS policies, procedures and programs \n5.4 \nEthical standards \n5.5 \nDefined resources parameters \n5.6 \nQuality and continuous improvement processes and \nstandards\n\n--- PDF PAGE 10 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n 6"
        },
        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nProvided support to team members to ensure goals are met \n1.2 \nActed on feedback from clients and colleagues \n1.3 \nAccessed learning opportunities to extend own personal work \ncompetencies to enhance team goals and outcomes.\n \n2. Underpinning \nknowledge  \n \n2.1 \nThe relevant legislation that affect operations, especially with \nregards to safety \n2.2 \nReasons why cooperation and good relationships are important\n2.3 \nKnowledge of the organization’s policies, plans and procedures\n2.4 \nUnderstanding how to elicit and interpret feedback \n2.5 \nKnowledge of workgroup member’s responsibilities and duties \n2.6 \nImportance of demonstrating respect and empathy in dealings \nwith colleagues \n2.7 \nUnderstanding of how to identify and prioritize personal \ndevelopment opportunities and options\n \n3. Underpinning skills \n \n3.1 \nAbility to read and understand the organization’s policies and \nwork procedures \n3.2 \nWrite simple instructions for particular routine tasks \n3.3 \nInterpret information gained from correspondence \n3.4 \nCommunication skills to request advice, receive feedback and \nwork with a team \n3.5 \nPlanning skills to organize work priorities and arrangement \n3.6 \nTechnology skills including the ability to select and use \ntechnology appropriate to a task \n3.7 \nAbility to relate to people from a range of social, cultural and \nethnic backgrounds \n \n4. Resource \nimplications \n \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n4.2 \nMaterials relevant to the proposed activity or tasks \n \n5. Method of \nassessment \n \nCompetency may be assessed through: \n5.1 \nDirect observations of work activities of the individual member \nin relation to the work activities of the group \n5.2 \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3 \nCase studies and scenarios as a basis for discussion of    \nissues and strategies  \n \n6. Context of \nassessment \n \n6.1 \nCompetency assessment may occur in workplace or any \nappropriately simulated environment \n6.2 \nAssessment shall be observed while task are being undertaken \nwhether individually or in group",
