        "source_title": "ARTICULATE MODELS AND TRANSFER RECORDS",
        "source_text": "--- PDF PAGE 41 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n37\nUNIT OF COMPETENCY:  ARTICULATE MODELS AND TRANSFER RECORDS \nUNIT CODE                     :  HCS322326 \nUNIT DESCRIPTOR:   \nThis unit covers the knowledge, skills and attitudes in articulating \nmodels and transferring records. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Select and prepare \narticulator \n1.1 \nWork order requirements are confirmed. \n1.2 \nArticulator is selected and adjusted as required. \n1.3 \nMounting method to be used is identified in accordance with \nthe type of articulator. \n2. Select and prepare \nmaterials \n2.1 \nModels and oral records are positioned in articulator. \n2.2      Mounting materials are prepared and applied to models. \n2.3      Centric records are established and secured. \n2.4      Excess material is removed in accordance with industry \nstandards \n2.8 \nEquipment is cleaned in accordance with standard operating \nprocedures (SOPs). \n3. Transfer oral records \nto articulator \n3.1      Records are transported as provided. \n3.2 \nMidline is recorded. \n3.3      Vertical height is set and recorded. \n3.4      Condylar angle is set as required. \n \n \n \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Type of articulators \n \nMay include but are not limited to: \n1.1     Average movement \n1.2     Semi-adjustable \n1.3     Fully adjustable\n\n--- PDF PAGE 42 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n38\nEVIDENCE GUIDE \n \n1.  Critical aspects of  \n     competency \nAssessment requires evidence that the candidate: \n1.1 \nSelected and prepared articulator \n1.2 \nSelected and prepared materials \n1.3 \nTransferred oral records to articulator \n1.4 \nComplied with DOH infection control policies and procedures \n1.5 \nFollowed OH&S policies  \n2.  Underpinning \nknowledge \n      \n2.1 \nRecording techniques and devices \n2.2      Mechanical devices \n2.3      Articulators \n2.4      Face-bows \n2.5      Relevant material science for carrying out procedures \n2.9 \nBasic oral anatomy and occlusion \n3.  Underpinning skills \n3.1 \nManual dexterity \n3.2 \nMaintaining a healthy and safe working environment \n3.3 \nRecording techniques \n3.4 \nArticulating procedure \n3.5 \nPlanning and organizing work activities \n4.  Resource \nimplications \nThe following resources MUST be provided \n4.1 \nA real or simulated dental laboratory environment \n4.2      Range of articulators \n4.3      Range of jaw relationship \n4.4 \nA qualified workplace assessor and/or a technical expert \nworking in partnership with the assessor \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1       Demonstration with questioning \n5.2       Written Test/Examination \n5.3       Third Party Report \n5.4       Portfolio \n6.  Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting.\n",
        "required_knowledge": null,
        "required_skills": null
      },
