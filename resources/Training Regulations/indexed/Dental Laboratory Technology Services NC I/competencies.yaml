        "source_title": "DEMONSTRATE WORK VALUES",
        "source_text": "--- PDF PAGE 11 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n 7\nUNIT OF COMPETENCY:    DEMONSTRATE WORK VALUES \nUNIT CODE                     :    500311103 \nUNIT DESCRIPTOR        :   This unit covers the outcomes required in demonstrating and living by \ndesirable values and ethics in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose \nof work \n1.1 \nOne’s unique sense of purpose for working and the why’s of \nwork are identified, reflected on and clearly defined for one’s \ndevelopment as a person and as a member of society. \n1.2 \nPersonal mission is in harmony with company’s values. \n2. Apply work \nvalues/ethics \n2.1 \nWork values/ethics/concepts are classified and reaffirmed in \naccordance with the transparent company ethical standards, \npolicies and guidelines. \n2.2 \nWork practices are undertaken in compliance with industry \nwork ethical standards, organizational policy and guidelines. \n2.3 \nPersonal behavior and relationships with co-workers and/or \nclients are conducted in accordance with ethical standards, \npolicy and guidelines. \n2.4      Company resources are used in accordance with transparent \ncompany ethical standards, policy and guidelines. \n3. Deal with ethical \nproblems \n3.1 \nCompany ethical standards, organizational policy and \nguidelines on the prevention and reporting of unethical \nconduct are accessed and applied in accordance with \ntransparent company ethical standard, policies and guidelines.\n3.2 \nWork incidents/situations are reported and/or resolved in \naccordance with company protocol/guidelines. \n3.3 \nResolution and/or referral of ethical problems identified are \nused as learning opportunities. \n4. Maintain integrity of \nconduct in the \nworkplace \n4.1      Personal work practices and values are demonstrated \nconsistently with acceptable ethical conduct and company’s \ncore values. \n4.2      Instructions to co-workers are provided based on ethical, \nlawful and reasonable directives. \n4.3      Company values/practices are shared with co-workers using \nappropriate behavior and language.\n\n--- PDF PAGE 12 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n 8\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Work values/ethics/ \n      concepts \n \nMay include but are not limited to: \n1.1 \nCommitment/Dedication \n1.2 \nSense of urgency \n1.3 \nSense of purpose \n1.4 \nLove for work \n1.5 \nHigh motivation \n1.6 \nOrderliness \n1.7 \nReliability \n1.8 \nCompetence \n1.9 \nDependability \n1.10 Goal-oriented \n1.11 Sense of responsibility \n1.12 Being knowledgeable \n1.13 Loyalty to work/company \n1.14 Sensitivity to others \n1.15 Compassion/Caring attitude \n1.16 Balancing between family and work \n1.17 Pakikisama \n1.18 Bayanihan spirit/teamwork \n1.19\nSense of nationalism\n \n2. Work practices \n \n2.1 \nQuality of work \n2.2 \nPunctuality \n2.3 \nEfficiency \n2.4      Effectiveness \n2.5 \nProductivity \n2.6 \nResourcefulness \n2.7 \nInnovativeness/Creativity \n2.8 \nCost Consciousness \n2.9 \n5S \n2.10\nAttention to details\n \n3. Incidents/situations \n \n3.1 \nViolent/intensed dispute or argument \n3.2 \nGambling \n3.3 \nUse of prohibited substances \n3.4      Pilferages \n3.5      Damage to person or property \n3.6      Vandalism \n3.7       Falsification \n3.8       Bribery \n3.9       Sexual Harassment \n3.10     Blackmail\n \n4.  Company resources \n \n4.1 \nConsumable materials \n4.2 \nEquipment/Machineries \n4.3 \nHuman \n4.4 \nTime \n4.5\nFinancial resources\n \n5.  Instructions \n5.1 \n \n5.2 \nVerbal \n5.3 \nWritten \nEVIDENCE GUIDE\n\n--- PDF PAGE 13 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n 9\n       \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDefined one’s unique sense of purpose for working \n1.2 \nClarified and affirmed work values/ethics/concepts \nconsistently in the workplace \n1.3 \nDemonstrated work practices satisfactorily and consistently in \ncompliance with industry work ethical standards, \norganizational policy and guidelines \n1.4 \nDemonstrated personal behavior and relationships with co-\nworkers and/or clients consistent with ethical standards, policy \nand guidelines \n1.5 \nUsed company resources in accordance with company ethical \nstandard, policies and guidelines \n1.6 \nFollowed company ethical standards, organizational policy \nand guidelines on the prevention and reporting of unethical \nconduct/behavior\n2.  Underpinning \nknowledge  \n2.1 \nOccupational health and safety \n2.2 \nWork values and ethics \n2.3 \nCompany performance and ethical standards  \n2.4 \nCompany policies and guidelines \n2.5 \nFundamental rights at work including gender sensitivity \n2.6 \nWork responsibilities/job functions \n2.7 \nCorporate social responsibilities \n2.8 \nCompany code of conduct/values \n2.9\nBalancing work and family responsibilities\n3.  Underpinning skills \n3.1 \nInterpersonal skills \n3.2 \nCommunication skills \n3.3 \nSelf awareness, understanding and acceptance \n3.4     Application of good manners and right conduct\n4.  Resource implications \nThe following resources MUST be provided: \n4.1 \nWorkplace or assessment location \n4.2\nCase studies/scenarios\n5.  Method of assessment\nCompetency may be assessed through: \n5.1 \nPortfolio Assessment \n5.2 \nInterview \n5.3\nThird Party Reports\n6.  Context of \nassessment \n6.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting.\n",
