          "source_text": "1.  Verify integrity of \nimpressions    \n \n1.1 \nImpression is disinfected according to Department of Health \nguidelines. \n1.2 \nImpressions are examined for defects. \n1.3 \nImpression is checked to ensure it meets the specifications of \nthe work. \n2.  Select and prepare \nmodel materials \n2.1 \nAppropriate materials are selected. \n2.2 \nMaterials are prepared in accordance with desired outcome. \n3.  Pour impressions \n3.1 \nImpressions are prepared for pouring. \n3.2 \nMaterials are poured into impressions in accordance with \naccepted techniques. \n3.3 \nRequired setting time is allowed. \n5. Finish model \n \n4.1 \nModel is recovered intact from impression. \n4.2 \nModel is inspected for defects. \n4.3      Models a re trimmed according to requirements. \n \n5.  Duplicate model \n5.1 \nDuplicating materials are prepared according to \nmanufacturer’s instructions. \n5.2 \nDuplicating materials are mixed according to manufacturer’s \ninstructions. \n5.3 \nAn accurate, bubble free cast is produced.\n\n--- PDF PAGE 35 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n31\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Impression \n \n \nMay include but are not limited to: \n1.1 \nEdentulous impression \n1.2 \nDentulous impressions \n1.3 \nPartially dentulous \n \n2. Pour materials into \nimpressions \n \n \nMay include but are not limited to: \n \n2.1 \nRigid impression materials \n2.2 \nAqueous elastomers \n2.3 \nNon-aqueous elastomers \n3.  Duplicating materials \nMay include but are not limited to: \n3.1      Stones \n3.2      Diestones \n3.4 \nRefractories\n\n--- PDF PAGE 36 ---\nTR Dental Laboratory Technology Services NC I \nPromulgated April 2008 \n \n32"
