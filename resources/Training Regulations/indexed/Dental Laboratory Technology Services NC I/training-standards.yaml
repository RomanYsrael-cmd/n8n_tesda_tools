  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for the DENTAL LABORATORY TECHNOLOGY SERVICES NC I qualification.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; trainer’s qualification and institutional assessment\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL LABORATORY TECHNOLOGY SERVICES\nNC Level: NC I\n\nNominal Training Duration: 976 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of dental technicians\nin accordance with industry standards. It covers the basic, common and core competencies in NC\nI.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Receive and\nrespond to\nworkplace\ncommunication\n\n1.1 Follow routine spoken messages\n1.2 Perform workplace duties\nfollowing written notices\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n2. Work with\nothers\n\n2.1 Develop effective workplace\nrelationship\n2.2 Contribute to work group\nactivities\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct in the\nworkplace\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n4. Practice\nhousekeeping\nprocedures\n\n4.1 Sort and remove unnecessary\nitems\n4.2 Arrange items\n4.3 Maintain work area, tools and\nequipment\n4.4 Follow standardized work process\nand procedures\n4.5 Perform work spontaneously\n\n• Discussion\n• Plant tour\n• Symposium\n\n• Observation\n• Interview\n\n--- PDF PAGE 46 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n42\nCOMMON COMPETENCIES\n(28 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Maintain\ninstruments and\nequipment in\nwork area\n\n1.1\nPrepare to clean dental\nlaboratory instruments and\nwork area\n1.2\nClean and dry dental\nlaboratory instruments\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n2. Assist in dental\nlaboratory\nprocedures\n\n2.1\nIdentify dental laboratory\nprocedures\n2.2\nUse dental terminology in\ncommunication within the\nhealth care setting\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Assist with\nadministration in\ndental laboratory\npractice\n3.1\nCommunicate effectively with\nclients and other persons\n3.2\nRespond appropriately to\ninquiries from clients and\nvisitors\n3.3\nAllocate appointments\nappropriate to client and\norganization requirements\n3.4\nCalculate and record basic\nfinancial transactions\n3.5\nHandle cash and record\nfinancial transactions\n3.6\nMaintain client records\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n4. Operate a\npersonal\ncomputer\n4.1\nStart and shut down the\ncomputer\n4.2\nArrange and customize\ndesktop display/window\nsetting\n4.3\nWork with files and folders\n(or directories)\n4.4\nWork with user application\nprograms\n4.5\nPrint information\n4.6\nShut down computer\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n• Written Exam\n\n--- PDF PAGE 47 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n43\nCORE COMPETENCIES\n(930 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Fabricate models\n\n1.1\nVerify integrity of\nimpressions\n1.2\nSelect and prepare model\nmaterials\n1.3\nPour impressions\n1.4\nFinish model\n1.5\nDuplicate model\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n2. Fabricate custom\nimpression trays\n\n2.1\nPrepare model\n2.2\nSelect and prepare materials\n2.3\nFabricate custom impression\ntrays\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n3. Fabricate\nregistration bite\nrims\n3.1 Select and prepare materials\n3.2 Fabricate base\n3.3 Fabricate registration bit rims\n3.4 Prepare face-bow (if required)\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n4. Articulate models\nand transfer\nrecords\n4.1 Select and prepare articulator\n4.2 Select and prepare materials\n4.3 Transfer oral records to\narticulator\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n5. Fabricate\nmouthguard\n5.1 Prepare model for procedure\n5.2 Check the dental mouthguard\nprior to insertion\n5.3 Fit and evaluate the\nmouthguard\n5.4 Alter mouthguard if required\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 48 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n44\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 49 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n45\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in these course qualifications should possess the\nfollowing requirements:\n\n• Must be physically and mentally fit (specifically on eye and hand coordination)\n• Must be able to communicate either oral or written\n• Must be at least fifteen (15) years old\n\n• Must be at least a high school graduate or its equivalent\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nDENTAL LABORATORY TECHNOLOGY SERVICES NC I\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees for Dental Laboratory Services NC I are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n25 sets\nBase Former\n(upper, lower\nquadrant)\n25\npcs.\n5 pcs.\n\n1 pc.\nArticulator, Non-\nAdjustable\nArticulator, Semi-\nAdjustable\nArticulator, Fully-\nAdjustable\n25 pcs.\nAbrasives (assorted)\n25 pcs.\nPlaster Knife\n1 pc.\nSteamer\n25 pcs.\nMasks\n25 pcs.\nCaliper\n1 unit\nDrier\n25 pcs.\nLaboratory Gown\n25 sets\nWaxing Instrument\nSet\n25\npcs.\nBunsen Burner\n1 box\nGloves\n5 pcs.\nChisel\n1 pc.\nCleaning Unit\n1 kilo\nAcryllic Resin\n25 pcs.\nDuplicating Tray\n1 pc.\nCuring Unit\n\nPolishing Paste and\nCompound (assorted)\n25 pcs.\nMixing Bowl\n1 pc.\nDie Trimming\nMachine\n1 gal.\nDisinfecting Solution\n25 pcs.\nPlaster Spatula\n25\npcs.\nMicro Motor\n\nDental Lab Waxes\n(assorted)\n25 pcs.\nImpression Tray or\nStock Tray\n1 pc.\nVacuum Former\nMachine\n25 pcs.\nAdhesives\n100\npcs.\nMandrel\n2 pcs. Vibrator\n25\nkilos\neach\nGypsum (assorted)\n25 pcs.\nPlaster Cutters\n2 pcs. Lathe Machine\n25 pcs.\neach\nDuplicating Materials\n(assorted)\n25 pcs. Alcohol Torch\n2 pcs. Pressure Pot\n25 btls.\nAlcohol\n25 pcs.\nGuide or Template\n1 pc.\nVacuum Mixer\n2 tanks\nLaboratory Gases\n\n--- PDF PAGE 50 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n46\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n\n2 pcs. Cast Trimmer\n\n1 unit\nWeighing Scale\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\n\nStudent/Trainee Performance Space\n(S/TPS)\n\n5 x 4 m.\n\n20 sq. m.\n\nLearning Resource Center (LRC)\n\n3 x 5 m.\n\n15 sq. m.\n\nCirculation Area\n\n(S/TPS+LRC+SDR+CR) X 30%\n(50+5+15+10) X 30%=24 sq.m.)\n\n21 sq. m.\n\nSeparate Restrooms for Male and Female\nTrainees/ Students (CR)\n\n2 x 5 m.\n\n10 sq. m.\n\nTotal Workshop Area\n\n75 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR SERVICES SECTOR\n\nDENTAL LABORATORY TECHNOLOGY SERVICES NC I\n\n• Must be TESDA accredited/certified Trainer\n• Must be a holder of a Dental Laboratory Technology Services NC I or its equivalent\n• Must have undergone training on Training Methodology (TM I) or its equivalent\n• Must have a minimum of five (5) years working experience as a dental technician\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 51 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n47"
