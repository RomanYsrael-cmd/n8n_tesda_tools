    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL LABORATORY TECHNOLOGY SERVICES\nNC Level: NC I\n\nNominal Training Duration: 976 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of dental technicians\nin accordance with industry standards. It covers the basic, common and core competencies in NC\nI.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Receive and\nrespond to\nworkplace\ncommunication\n\n1.1 Follow routine spoken messages\n1.2 Perform workplace duties\nfollowing written notices\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n2. Work with\nothers\n\n2.1 Develop effective workplace\nrelationship\n2.2 Contribute to work group\nactivities\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct in the\nworkplace\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n4. Practice\nhousekeeping\nprocedures\n\n4.1 Sort and remove unnecessary\nitems\n4.2 Arrange items\n4.3 Maintain work area, tools and\nequipment\n4.4 Follow standardized work process\nand procedures\n4.5 Perform work spontaneously\n\n• Discussion\n• Plant tour\n• Symposium\n\n• Observation\n• Interview\n\n--- PDF PAGE 46 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n42\nCOMMON COMPETENCIES\n(28 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Maintain\ninstruments and\nequipment in\nwork area\n\n1.1\nPrepare to clean dental\nlaboratory instruments and\nwork area\n1.2\nClean and dry dental\nlaboratory instruments\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n2. Assist in dental\nlaboratory\nprocedures\n\n2.1\nIdentify dental laboratory\nprocedures\n2.2\nUse dental terminology in\ncommunication within the\nhealth care setting\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Assist with\nadministration in\ndental laboratory\npractice\n3.1\nCommunicate effectively with\nclients and other persons\n3.2\nRespond appropriately to\ninquiries from clients and\nvisitors\n3.3\nAllocate appointments\nappropriate to client and\norganization requirements\n3.4\nCalculate and record basic\nfinancial transactions\n3.5\nHandle cash and record\nfinancial transactions\n3.6\nMaintain client records\n\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n4. Operate a\npersonal\ncomputer\n4.1\nStart and shut down the\ncomputer\n4.2\nArrange and customize\ndesktop display/window\nsetting\n4.3\nWork with files and folders\n(or directories)\n4.4\nWork with user application\nprograms\n4.5\nPrint information\n4.6\nShut down computer\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n• Written Exam\n\n--- PDF PAGE 47 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n43\nCORE COMPETENCIES\n(930 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Fabricate models\n\n1.1\nVerify integrity of\nimpressions\n1.2\nSelect and prepare model\nmaterials\n1.3\nPour impressions\n1.4\nFinish model\n1.5\nDuplicate model\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n2. Fabricate custom\nimpression trays\n\n2.1\nPrepare model\n2.2\nSelect and prepare materials\n2.3\nFabricate custom impression\ntrays\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n3. Fabricate\nregistration bite\nrims\n3.1 Select and prepare materials\n3.2 Fabricate base\n3.3 Fabricate registration bit rims\n3.4 Prepare face-bow (if required)\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n4. Articulate models\nand transfer\nrecords\n4.1 Select and prepare articulator\n4.2 Select and prepare materials\n4.3 Transfer oral records to\narticulator\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n5. Fabricate\nmouthguard\n5.1 Prepare model for procedure\n5.2 Check the dental mouthguard\nprior to insertion\n5.3 Fit and evaluate the\nmouthguard\n5.4 Alter mouthguard if required\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 48 ---\nTR Dental Laboratory Technology Services NC I\nPromulgated April 2008\n\n44"
