  "source_text": "ABUTMENT\n-\nTooth or teeth that support a fixed or removable bridge\nANTERIOR TEETH\n-\nthe six upper or six lower front teeth (canines, laterals & central\nincisors)\nAPEX\n-\nthe tip of the root of a tooth\nAPPLIANCE\n-\na general term referring to devices used to provide a function or\ntherapeutic effect\nARCH\n-\ndescribes the alignment of the upper or lower teeth\nARTICULATE\n-\nto unite by forming a joint or joints\nARTICULATOR\n-\na mechanical device representing the temporo-mandibular joints and\njaw members to which casts of the mouth\nBASE\n-\ncement placed under a dental restoration to insulate the pulp (nerve\nchamber)\nBITE\n-\nrelationship of the upper and lower teeth on closure (occlusion)\nBITE/OCCLUSION\nRIM\n-\n an occluding border or surface constructed on temporary or\npermanent denture bases for the purpose of recording the\nmaxillomandibular relation and for positioning the teeth\nBLEACHING\n-\nchemical or laser treatment of natural teeth for whitening effect\nBONDING\n-\nadhesive dental restoration technique; a tooth-colored composite\nresin to repair and/or change the color or shape of a tooth\nBRACES\n-\ndevices used by orthodontists to gradually reposition teeth to a more\nfavorable alignment\nBRIDGE\n-\nstationary dental prosthesis (appliance) fixed to teeth adjacent to a\nspace; replaces one or more missing teeth, cemented or bonded to\nsupporting teeth or implants adjacent to the space\nBUCCAL\n-\nin dental anatomy, the term is used to refer to the vestibular (or oral)\nsurface of the premolars and molars that faces the cheek\nCANTILEVER\nBRIDGE\n-\nfixed bridge that attaches to adjacent teeth only on one end\nCAP\n-\ncommon term for dental crown\nCAST\n-\nan accurate reproduction or replica of an object or part produced in a\nplastic material which has taken form in an impression or mold\nCLASP\n-\ndevice that retains a removable partial denture to stationary teeth;\ncan be metal or acrylic (matches teeth and gums)\nCONDYLAR\n-\nPertaining to condyle\nCONDYLE\n-\nA round eminence or protuberance at the articular extremity of the\nbone\nCROSS BITE\n-\nreverse biting relationship of upper and lower teeth; aka \"under bite,\"\nas in Class III malocclusuion (prognathic jaw)\nCROWN\n\n(1) the portion of a tooth above the gum line;\n(2) dental restoration covering all or most of the natural tooth\n\n--- PDF PAGE 55 ---\nTR Dental Laboratory Technology Services NC I\n Promulgated\n\n51\nCUSTOM IMPRESION\nTRAY\n-\nan impression tray made from a preliminary impression used to make\nthe final impression\nDENTAL WAXES\n-\n wax compounds used in dentistry are mixtures of individual waxes of\nmaterials or synthetic origin. As with all other dental materials, each\ncomponent n the mixture is selected to given specific properties best\nsuited for the procedure being performed\nDENTURE\n-\nremovable (partial or complete) set of artificial teeth\nDIASTEMA\n-\nopen space between teeth\nDISTAL\n-\nfarthest from any point of reference, as the surfaces of teeth more\ndistant from the median line\nDUPLICATE\n-\nidentically copied from an original\nFABRICATE\n-\nto make; create; to construct by combining or assembling\nFACE-BOW\n-\na caliper-like device used to record the positional relationship of the\nmaxillary arch to the temporo-mandibular joint (or opening axis of the\njaw and to orient dental casts in the same relationship to the opening\naxis of the articulator\nFACE-BOW FORK\n-\na device used to attach the face-bow to an occlusion rim for a face-\nbow transfer\nFACIAL\n-\nthe term is used to refer to the surface of a tooth directed toward the\nface (including the buccal and labial surfaces) and opposite the\nlingual (or oral) surface.\nFACING\n-\ntooth colored overlay on the visible portion of a crown; may be\nacrylic, composite or porcelain\nFILLING\n-\nrestoration of lost tooth structure with metal, porcelain or resin\nmaterials\nFULL DENTURE\n-\nremovable dental prosthesis (appliance) replacing all upper or lower\nteeth\nFULL MOUTH\nRECONSTRUCTION\n-\nextensive restorations of natural teeth with crowns and or fixed\nbridges to manage restorative and bite problems.\nGYPSUM\n-\nis the common name for calcium sulfate dehydrate. Gypsum products\nare more frequently used on laboratory procedures than any other\nsingle group of compounds. Controlled variations in the\nmanufacturing of gypsum products yield a group of dental materials\nincluding plaster, artificial stone(hydrosol), disc stone, casting\ninvestment and soldering investment\nIMPRESSION\n-\nmold made of the teeth and soft tissues\nINLAY\n-\nindirect - filling made by a dental laboratory that is cemented or\nbonded into place,\ndirect - placement of dental composite resin, or porcelaion restoration\nat chairside\nINTEROCCLUSAL\n-\nspace between upper and lower teeth\nINVESTING\n-\nthe act or process of covering or enveloping wholly or in part an\nobject such as a denture, tooth, wax form etc.\nJACKET\n-\ncrown for a front tooth, usually made of porcelain\n\n--- PDF PAGE 56 ---\nTR Dental Laboratory Technology Services NC I\n Promulgated\n\n52\nLABIAL\n-\nin dental anatomy, the term is used to refer to the vestibular (or\nfacial) surface of the incisors and canines that faces the lips\nLAMINATE\n-\nthin plastic or porcelain veneer produced in a dental laboratory and\nthen bonded to a tooth\nMALOCCLUSION\n-\n\"bad bite\" or misalignment of the upper and lower teeth\nMARGIN\n-\ninterface between a restoration and tooth structure\nMARYLAND BRIDGE\n-\na bridge that is bonded to the back of the adjacent teeth; requires\nminimum tooth reduction\nMODEL\n-\na material used extensively for making impressions. It contains\nshellac, talc, glycerin, wax, tallow and palm oil\nMOUTHGUARD\n-\nan intra-oral appliance, made of a soft plastic, which covers all\nocclusal surfaces and the palate and extends to the border of the\nattached gingiva on the vestibular surface of the teeth\nOVERBITE\n-\nvertical overlap of the front teeth; deep bite\nPARTIAL DENTURE\n-\nremovable dental prosthesis (appliance) replacing one or more\nnatural teeth\nPONTIC\n-\nreplacement tooth mounted on a fixed or removal appliance\nPORCELAIN CROWN\n-\nall porcelain restoration covering the coronal portion of tooth (above\nthe gum line)\nPORCELAIN FUSED\nTO METAL (PFM)\nCROWN\n-\nrestoration with metal coping (for strength) covered by porcelain (for\nappearance)\nPORCELAIN INLAY\nOR ONLAY\n-\ntooth-colored restoration made of porcelain, cemented or bonded in\nplace\nPORCELAIN\nVENEERS\n-\na thin layer of porcelain, fabricated by a laboratory) bonded to a\nnatural tooth to replace lost tooth structure, close spaces, straighten\nteeth or change color and/or shape\nPOSTERIOR\n-\nSituated in the back of, or in the back part of, or affecting the back\npart of an organ; used in reference to the back or dorsal surface of\nthe body.\nPROSTHESIS\n\nan artificial appliance for the replacement for a body part, tooth or\nteeth\nREBASE\n-\nthe process of refitting a denture by means of the replacement of the\ndenture base material without changing the occlusal relations of the\nteeth\nRETAINER\n-\na device for retaining or keeping something in position\n\n-\nthe part of a denture that unites the abutment tooth with the\nsuspended portion of the bridge, such as inlay, partial crown or\ncomplete crown.\nSOLDERING\nINVESTMENT\n-\na soldering investment is similar in composition to a casting\ninvestment that has a\nSPLINT\n-\nconnection of two or more teeth so they function as a stronger single\nstructure\n\n--- PDF PAGE 57 ---",
