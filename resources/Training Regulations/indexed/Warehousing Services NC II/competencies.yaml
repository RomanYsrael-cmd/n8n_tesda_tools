        "source_text": "--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 12 \nUNIT OF COMPETENCY: \nPRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE                     : \n500311107 \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes in promoting \ncareer growth and advancement.\n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Integrate personal \nobjectives with \norganizational \ngoals \n1.1 Personal growth and \nwork plans are \npursued towards \nimproving the \nqualifications set for \nthe profession \n1.2 Intra- and \ninterpersonal \nrelationships are \nmaintained in the \ncourse of managing \noneself based on \nperformance \nevaluation \n1.3 Commitment to the \norganization and its \ngoal is \ndemonstrated in the \nperformance of \nduties \n Work values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n Company policies \n Company \noperations, \nprocedures and \nstandards  \n Company \nmission/vision \nstatements \n Ways of \nintegrating \npersonal \nobjectives with \norganizational \ngoals \n \n  Integrating skills of \npersonal objectives \nwith organizational \ngoals \n Pursuing personal \ngrowth and work \nplans \n Demonstrating \ncommitment to the \norganization and \nits goals \n Intra and \nInterpersonal skills \n \n2. Set and meet work \npriorities \n2.1 Competing \ndemands are \nprioritized to \nachieve personal, \nteam and \norganizational goals \nand objectives. \n2.2 Resources are \nutilized efficiently \nand effectively to \nmanage work \npriorities and \ncommitments \n \n \n \n \n \n \n Company policies \n procedures and \nstandards  \n Company and \ndepartmental \ngoals and \npriorities  \n Managing \npriorities and \ncommitments \n Economic use and \nmaintenance of \nequipment and \nfacilities \n \n \n \n \n Setting skills of \nwork priorities \n Meeting with work \npriorities \n Intra and \nInterpersonal skills \n Communication \nskills\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 13 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.3 Practices along \neconomic use and \nmaintenance of \nequipment and \nfacilities are \nfollowed  as per \nestablished \nprocedures\n Ways and means \nof practicing \neconomic use and \nmaintenance of \nequipment and \nfacilities \n \n3. Maintain \nprofessional \ngrowth and \ndevelopment \n3.1 Trainings and \ncareer \nopportunities are \nidentified and \navailed of  based \non job requirements \n3.2 Recognitions are \nsought/received \nand demonstrated \nas proof of career \nadvancement \n3.3 Licenses and/or \ncertifications \nrelevant to job and \ncareer are obtained \nand renewed \n Ways of \nidentifying \ntrainings and \ncareer \nopportunities \n Techniques of \nseeking and \nreceiving \nrecognitions \n Procedures of \nobtaining \nlicenses and/or \ncertifications \nrelevant to the \njob \n \n Identifying \ntrainings and \ncareer \nopportunities \n Seeking  \nrecognitions are  \nsought/received \nand demonstrated \nas proof of career \nadvancement \n Obtaining and \nrenewing \nLicenses and/or \ncertifications \nrelevant to job \nand career\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 14 \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1  Performance Appraisal \n1.2  Psychological Profile \n1.3 Aptitude Tests \n2.  Resources \n2.1  Human \n2.2  Financial \n2.3  Technology \n2.3.1  Hardware \n2.3.2 Software \n3.  Trainings and career \nopportunities \n3.1 Participation in training programs \n      3.1.1 Technical \n      3.1.2  Supervisory \n      3.1.3  Managerial \n      3.1.4  Continuing Education \n3.2  Serving as Resource Persons in conferences and \nworkshops \n4.  Recognitions \n4.1  Recommendations \n4.2  Citations \n4.3  Certificate of Appreciations \n4.4  Commendations \n4.5  Awards \n4.6 Tangible and Intangible Rewards\n5.  Licenses and/or \ncertifications \n5.1  National Certificates \n5.2  Certificate of Competency \n5.3 Support Level Licenses \n5.4  Professional Licenses\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 15 \n         EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Attained job targets within key result areas (KRAs) \n1.2 Maintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 Completed trainings and career opportunities which are \nbased on the requirements of the industries \n1.4 Acquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n2. Resource Implications \nThe following resources MUST be provided: \n2.1 Workplace or assessment location \n2.2 Case studies/scenarios\n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1 Portfolio Assessment \n3.2 Interview \n3.3 Simulation/Role-plays \n3.4 Observation \n3.5 Third Party Reports \n3.6 Exams and Tests \n4. Context of Assessment \n4.1 Competency may be assessed individually in the actual \nworkplace or through an accredited assessment institution \nand given by a TESDA qualified assessor \n \n4.2 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n",
