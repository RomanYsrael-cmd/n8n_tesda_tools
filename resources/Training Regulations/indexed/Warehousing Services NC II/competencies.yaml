          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource Implications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nObservation of the individual member in relation to the\nwork activities of the group\n3.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed individually in the actual\nworkplace or through an accredited assessment\ninstitution and given by a TESDA qualified assessor\n4.2.\nCompetency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 12\nUNIT OF COMPETENCY:\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE :"
        },
        "source_text": "500311106\n\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Describe\nteam role\nand scope\n1.1. The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2. Team parameters,\nreporting\nrelationships and\nresponsibilities\nare identified from\nteam discussions\nand appropriate\nexternal sources\n\n• Company\nvision/mission\nstatements\n• Company policies\nand employee code\nof conduct\n• Communication\nprocess\n• Team structure\n• Team roles\n• Group planning and\ndecision making\n• Communicating\nskills appropriately\nand consistent with\nthe culture of the\nworkplace\n• Adopting skills to\nteam role and\nscope of\nresponsibilities\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1. Individual role and\nresponsibilities\nwithin the team\nenvironment are\nidentified\n2.2. Roles and\nresponsibility of\nother team\nmembers are\nidentified and\nrecognized\n2.3. Reporting\nrelationships\nwithin team and\nexternal to team\nare identified\n\n• Company\nvision/mission\nstatements\n• Company policies\nand employee code\nof conduct\n• Communication\nprocess\n• Team structure\n• Team roles\n• Group planning and\ndecision making\n• Methods and\ntechniques of role\nand responsibility\nidentification with a\nteam\n• Communicating\nskills appropriately\nand consistent with\nthe culture of the\nworkplace\n• Role and\nresponsibility\nidentification skills\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 9\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Work as a\nteam\nmember\n3.1. Effective and\nappropriate forms\nof\ncommunications\nused and\ninteractions\nundertaken with\nteam members\nwho contribute to\nknown team\nactivities and\nobjectives\n3.2. Effective and\nappropriate\ncontributions\nmade to\ncomplement team\nactivities and\nobjectives, based\non individual skills\nand competencies\nand workplace\ncontext\n3.3. Observed\nprotocols in\nreporting using\nstandard\noperating\nprocedures\n3.4. Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding of\nteam’s role and\nobjectives and\nindividual\ncompetencies of\nthe members.\n• Approaches of\ninteracting with\nteam members\n• Types of\ncommunications\nused in effective\ninteraction with\nteam members\n• Methods of working\nas a team\n• Techniques in\nworking as a team\n\n• Team working skills\n• Communicating\nskills appropriately\nand consistent with\nthe culture of the\nworkplace\n• Skills in observing\nprotocols when\nmaking reports\n• Using standard\nprocedures when\nmaking reports\n• Developing\nteamwork plans\nbased on team’s\nrole and objectives\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nthe team\n1.1.\nWork activities in a team environment with enterprise or\nspecific sector\n1.2.\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of information\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 11\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource Implications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nObservation of the individual member in relation to the\nwork activities of the group\n3.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed individually in the actual\nworkplace or through an accredited assessment\ninstitution and given by a TESDA qualified assessor\n4.2.\nCompetency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 12\nUNIT OF COMPETENCY:\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE :"
