        "source_text": "--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 54 \nUNIT OF COMPETENCY: PERFORM COMPUTER OPERATIONS \n \nUNIT CODE                     : \nTRS311203 \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes and values \nneeded to perform computer operations which include \ninputting, accessing, producing and transferring data using the \nappropriate hardware and software\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Plan and \nprepare for \ntask to be \nundertaken \n1.1. Requirements of \ntask are \ndetermined \n \n1.2. Appropriate \nhardware and \nsoftware are \nselected according \nto task assigned \nand required \noutcome \n \n1.3. Task is planned to \nensure OSH \nguidelines and \nprocedures are \nfollowed \n \n Means of determining \nrequirements of task \n \n Method of selecting \nappropriate hardware \nand software \naccording to task \nassigned and \nrequired outcome \n \n Manner of planning \ntask to ensure OSH \nguidelines and \nprocedures are \nfollowed \n \n Basic ergonomics of \nkeyboard and \ncomputer use \n Main types of \ncomputers and basic \nfeatures of different \noperating systems \n Main parts of a \ncomputer \n Storage devices and \nbasic categories of \nmemory \n Relevant types of \nsoftware\n Determining \nrequirements of task \n \n Selecting \nappropriate \nhardware and \nsoftware according \nto task assigned and \nrequired outcome \n \n Planning task to \nensure OS & H \nguidelines and \nprocedures are \nfollowed \n \n Reading skills \nrequired to interpret \nwork instruction \n \n Communication \nskills \n \n2. Input data into \ncomputer \n2.1 Data are entered \ninto the computer \nusing appropriate \nprogram/ \nApplication in \naccordance with \ncompany \nprocedures \n Method of entering \ndata into the \ncomputer using \nappropriate \nprogram/application \nin accordance with \ncompany procedures \n \n Entering data into \nthe computer using \nappropriate \nprogram/ \nApplication in \naccordance with \ncompany \nprocedures\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 55 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.2 Accuracy of \ninformation is \nchecked and \ninformation is \nsaved in \naccordance with \nstandard operating \nprocedures \n \n2.3 Inputted data are \nstored in storage \nmedia according \nto requirements \n \n2.4 Work is performed \nwithin ergonomic \nguidelines \n Accuracy of \ninformation is \nchecked and \ninformation is saved \nin accordance with \nstandard operating \nprocedures \n \n Means of storing \ninputted data in \nstorage media \naccording to \nrequirements \n \n Technique of \nperforming work \nwithin ergonomic \nguidelines \n \n Identifying General \nsecurity \nViruses \n \n OS & H principles \nand responsibilities \n \n Calculating computer \ncapacity\n Checking Accuracy \nof information and \nsaving in \naccordance with \nstandard operating \nprocedures \n \n Storing inputted \ndata in storage \nmedia according to \nrequirements \n \n Performing work \nwithin ergonomic \nguidelines \n \n3. Access \ninformation \nusing \ncomputer \n3.1 Correct program/ \napplication is \nselected based on \njob require \n3.2 Program/ \napplication \ncontaining the \ninformation \nrequired is \naccessed \naccording to \ncompany \nprocedures \n3.3 Desktop icons \nare correctly \nselected, opened \nand closed for \nnavigation \npurposes \n Means of selecting \nCorrect \nprogram/application is \nbased on job \nrequirements \n Manner of accessing \nprogram/application \ncontaining the \ninformation required \naccording to company \nprocedures \n \n Ways of selecting, \nopening and closing \ndesktop icons \ncorrectly for \nnavigation purposes \n \n Selecting correct \nprogram/ \nApplication based \non job requirements \n Accessing program/ \nApplication \ncontaining the \ninformation required \naccording to \ncompany \nprocedures \n \n Selecting, opening \nand closing desktop \nicons correctly for \nnavigation purposes\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 56 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3.4 Keyboard \ntechniques are \ncarried out in line \nwith OS&H \nrequirements for \nsafe use of \nkeyboards \n Carrying out \nkeyboard techniques \nin line with oh & s \nrequirements for safe \nuse of keyboards \n \n \n \n Carrying out \nkeyboard \ntechniques in line \nwith OS & H \nrequirements for \nsafe use of \nkeyboards \n \n4. Produce/ \noutput data \nusing \ncomputer \nsystem \n4.1 Entered data are \nprocessed using \nappropriate \nsoftware \ncommands \n \n4.2 Data are printed \nout as required \nusing computer \nhardware/peripher\nal devices in \naccordance with \nstandard operating \nprocedures \n \n4.3 Files and data are \ntransferred \nbetween \ncompatible \nsystems using \ncomputer software, \nhardware and \nperipheral \ndevices in \naccordance with \nstandard operating \nprocedures \n Procedure of \nprocessing entered \ndata using \nappropriate software \ncommands \n \n Method of printing out \ndata as required \nusing computer \nhardware/peripheral \ndevices in \naccordance with \nstandard operating \nprocedures \n \n Techniques of \ntransferring files and \ndata between \ncompatible systems \nusing computer \nsoftware, hardware/ \nperipheral devices in \naccordance with \nstandard operating \nprocedures \n \n Processing entered \ndata using \nappropriate software \ncommands \n \n Printing out data as \nrequired using \ncomputer \nhardware/peripheral \ndevices in \naccordance with \nstandard operating \nprocedures \n \n Transferring files \nand data between \ncompatible systems \nusing computer \nsoftware, hardware/ \nperipheral devices in \naccordance with \nstandard operating \nprocedures \n \n \n5. Maintain \ncomputer \nequipment \nand systems \n5.1 Systems for \ncleaning, minor \nmaintenance and \nreplacement of \nconsumables are \nimplemented \n \n \n \n \n Method of \nimplementing \nSystems for cleaning, \nminor maintenance \nand replacement of \nconsumables \n \n \n \n Implementing \nsystems for \ncleaning, minor \nmaintenance and \nreplacement of \nconsumables\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 57 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5.2 Procedures for \nensuring security \nof data, including \nregular back-ups \nand virus checks \nare implemented in \naccordance with \nstandard operating \nprocedures \n \n5.3 Basic file \nmaintenance \nprocedures are \nimplemented in \nline with the \nstandard operating \nprocedures \n Implementing \nprocedures for \nensuring security of \ndata, including \nregular back-ups and \nvirus checks in \naccordance with \nstandard operating \nprocedures \n \n Technique of \nimplementing basic \nfile maintenance \nprocedures in line \nwith the standard \noperating procedures \n Implementing \nprocedures for \nensuring security of \ndata, including \nregular back-ups \nand virus checks in \naccordance with \nstandard operating \nprocedures \n \n Implementing basic \nfile maintenance \nprocedures in line \nwith the standard \noperating \nprocedures\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 58 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Software \nIncludes the following but not limited to: \n1.1. Word processing packages \n1.2. Data base packages \n1.3. Internet \n1.4. Spreadsheets\n2. OS & H guidelines \nMay include: \n2.1. OS & H guidelines \n2.2. Enterprise procedures \n3. Storage media \nInclude the following but not limited to: \n3.1. diskettes \n3.2. CDs \n3.3. zip disks \n3.4. hard disk drives, local and remote\n4. Ergonomic guidelines \nMay include: \n4.1. Types of equipment used \n4.2. Appropriate furniture \n4.3. Seating posture \n4.4. Lifting posture \n4.5. Visual display unit screen brightness\n5. Desktop icons \nInclude the following but not limited to: \n5.1. Directories/folders \n5.2. Files \n5.3. Network devices \n5.4. Recycle bin\n6. Hardware and peripheral \ndevices \nMay include: \n6.1. Personal computers \n6.2. Networked systems \n6.3. Communication equipment \n6.4. Printers \n6.5. Scanners \n6.6. Keyboard \n6.7. Mouse\n7. Maintenance \nMaintenance includes: \n7.1. Creating more space in the hard disk \n7.2. Reviewing programs \n7.3. Deleting unwanted files \n7.4. Backing up files  \n7.5. Checking hard drive for errors \n7.6. Using up to date anti-virus programs \n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 59 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1. Selected and used hardware components correctly and \naccording to the task requirement \n1.2. Identified and explain the functions of both hardware and \nsoftware used, their general features and capabilities \n1.3. Produced accurate and complete data in accordance with the \nrequirements \n1.4. Used appropriate devices and procedures to transfer  files/data \naccurately \n1.5. Maintained computer system \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1 Written test \n3.2 Direct observation and oral questioning \n4. Context of \nAssessment \n \n \n \n4.1 Competency may be assessed individually in the actual \nworkplace or through an accredited assessment institution and \ngiven by a TESDA qualified assessor \n4.2 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
