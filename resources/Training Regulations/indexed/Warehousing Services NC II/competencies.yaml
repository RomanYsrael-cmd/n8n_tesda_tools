UIRED SKILLS \nincidents are \nhandled \nappropriately in \naccordance with \nestablished \nresponse plan and \nwithin limits of \nresponsibility using \navailable \ncommunications in \nthe work area \ndocumentation and \nreporting \nrequirements \n \ndepending on \ndiffering workplace \ncontexts risk \nsituations and \nenvironments \n \n Applying security \nprograms and \nprocedures in-\nresponse to \nidentified  security \nthreats  \n Promptly reporting \nand/or rectifying any \nidentified problems \nthat may arise when \nfollowing security \nprocedures in \naccordance with \nregulatory \nrequirements and \nworkplace \nprocedures\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 37 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Security measures \n \nMay include: \n1.1 security guards at access points and gates to \nsecured areas  \n1.2 locked doors, gates and fences  \n1.3 use of personal electronic access cards \n1.4 recording of carrier and vehicle registration details \nat gates and checkpoints  \n1.5 bag check points  \n1.6 escorts for visitors in restricted areas  \n1.7 access control in and out of restricted security \nareas \n1.8 use of ID cards  \n1.9 video surveillance equipment \n1.10 X-ray screening of baggage, cargo and goods \n1.11 explosives trace detection (ETD) screening of \npassengers, baggage, cargo and goods  \n1.12 screening of passengers using hand-held and \nwalk through magnetometers \n2. Workplace security procedures \nMay include: \n2.1 Established security procedures \n2.2 Standard operating procedures  \n2.3 Company procedures \n2.4 Enterprise procedures \n2.5\nOrganizational procedures \n3. Communications \n \nMay include: \n3.1   Phone  \n3.2   Radio  \n3.3   Fax \n3.4   Email \n3.5   Electronic data transfer (EDI)  \n3.6   Internet  \n3.7  Oral, aural or signed communications\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 38 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 Secured goods and stocks in accordance with workplace security \nprocedures and applicable security regulations \n \n1.2  Checked and maintained seals, tamper proof packaging, locks \nand other security measures on goods or cargo in accordance \nwith workplace security procedures \n \n1.3 Identified and assessed security threat or situation in accordance \nwith the workplace security program and procedures \n \n1.4 Responded to an identified security threat or situation in \naccordance with workplace security procedures, received \ninstructions, regulatory requirements and emergency response \nplan  \n \n1.5 Handled appropriately any security threats or incidents in \naccordance with established response plan and within limits of \nresponsibility  \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n \n2.2 Materials relevant to the unit of competency \n \n2.3 Technical plans, drawings and specifications relevant to the \nactivities\n3. Methods of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1 Written test \n3.2 Direct observation and oral questioning \n3.3 Demonstration with questioning \n3.4 Interview \n \n4. Context of \nAssessment \n \n \n \n4.1 Competency may be assessed individually in the actual \nworkplace or through an accredited assessment institution and \ngiven by a TESDA qualified assessor \n \n4.2 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
