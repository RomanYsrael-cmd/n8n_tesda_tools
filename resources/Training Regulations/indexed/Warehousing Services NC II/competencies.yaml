 maintenance, and securing and storing\nmaterial handling equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Carry out pre-\noperational\nchecks\n\n1.2 Pre-operational\nchecks are\nconducted to\nmanufacturer\nspecifications to\nensure optimum\nfunctionality of\nmaterial handling\nequipment\n1.3 Necessary\nadjustments to\nequipment are\nmade in\naccordance with\nmanufacturer’s\nspecified checklist\nto ensure efficient\noperation\n1.4 Faulty equipment is\nreported to\nauthorized person\nfor repair and to\nensure equipment\nis safe and effective\nto use\n• Methods of\nconducting pre-\noperational checks\n• Techniques in making\nnecessary\nadjustments\n• Means of reporting\nfaulty equipment to\nrelevant person\n• Tools and equipment\nfor using and\nmaintaining manually\noperated material\nhandling equipment\nand the procedures\nand precautions for\ntheir care, use and\nstorage\n• Selecting and using\nPersonal Protective\nEquipment (PPE)\nwhen carrying-out\npre-operational\nchecks\n• Conducting pre-\noperational checks\nto manufacturer\nspecifications\n• Making necessary\nadjustments to\nequipment\n• Reporting faulty\nequipment to\nrelevant person\n\n2. Operate\nmaterial\nhandling\nequipment\n\n2.1 Appropriate\npersonal\nprotective\nequipment is used\nto minimize the risk\nof injury to operator\n\n• Manner of\nappropriately using\npersonal protective\nequipment\n• Methods of\neliminating or\ncontrolling work\n• Using appropriate\npersonal protective\nequipment.\n• Eliminating or\ncontrolling work\nhazards\n•Operating material\n\n--- PDF PAGE 92 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 88\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n2.2 Work hazards are\neliminated or\ncontrolled\nappropriately when\nusing material\nhandling equipment\nto