        "source_text": "LOG432201\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to apply\nwarehousing operations and workplace procedures. It includes\nidentifying major areas of the workplace in terms of workload,\nethical practices and personal daily routine.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify major\nareas of the\nworkplace\n\n1.1 The layout of the\nworkplace, the flow of\nmaterials and\ngoods/stocks (where\nrelevant) and the\nworkplace\nprocedures in each\nwork area are\nidentified\n\n1.2 Organizational\nstructure of the\nworkplace and the\nrelationship of\nstructure to each\noccupation and\nclassification\ngrouping is outlined\n\n1.3 Individual\nresponsibilities under\nindustrial agreements\nare identified and\nacted on in the\nconduct of assigned\nduties\n\n1.4 Workplace hazards\nare identified and\nrelated hazard\nminimization\nprocedures followed\n\n• Workplace\nprocedures and\nstandards and\nduty of care\nrequirements\nincluding OH&S\nand\nenvironmental\nprotection\nresponsibilities\n\n• Conditions of\nservice including:\nemployer and\nemployee\nobligations,\nemployment\ncontract, OS&H\nand other\nregulations\n\n• Workplace\nstructures and\nthe roles and\nresponsibilities of\nteam/group\nmembers\n\n• Site or workplace\nlayout\n\n• Communicating\neffectively with\nothers when\ncompleting\nworkplace\norientation and\ninduction\nprocedures\n\n• Reading and\ninterpreting\ninstructions,\nprocedures,\ninformation and\nsigns relevant to\nwork activities\n\n• Interpreting and\nfollowing operational\ninstructions and\nprioritize work\n\n• Working\ncollaboratively with\nothers when\ncompleting\nworkplace\norientation and\ninduction\nprocedures\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 22\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.5 Relevant personal\nprotective\nequipment (PPE) are\nidentified and\ncorrectly used in\naccordance with\nregulations and\nworkplace\nrequirements\n\n1.6 Workplace\nemergency\nprocedures are\nidentified and\nfollowed in real and\nsimulated emergency\nsituation\n• Emergency\nprocedures\n\n• Workplace\nhazards and\nrelated hazard\nminimization\nprocedures\n\n• Personal\nprotective\nequipment and\ninstructions of its\nuse\n\n• Applying\nprecautions and\nrequired action to\nminimize, control or\neliminate hazards\nthat may exist\nduring work\nactivities\n\n• Working\nsystematically with\nrequired attention to\ndetail without injury\nto self or others, or\ndamage to goods or\nequipment\n\n• Identifying and\ncorrectly using\nequipment,\nprocesses and\nprocedures\n\n• Selecting and using\nrequired personal\nprotective\nequipment\nconforming to\nindustry and OS&H\nstandards\n2. Organize and\naccept\nresponsibility for\nassigned\nworkload\n\n2.1 Priorities, schedules\nand deadlines are\nestablished in\nconsultation with\nconcerned parties\n\n2.2 Work activities are\nplanned and progress\nof work is\ncommunicated to\nothers whose\npersonal work plans\nand timelines may be\naffected\n\n• Ways of\nestablishing\npriorities and\ndeadlines\n\n• Work planning\nand method of\ncommunicating\nwork progress to\nothers\n\n• Enterprise work\nguidelines,\ndirections or\ninstructions\n\n• Establishing\npriorities and\ndeadlines\n\n• Planning and\ncommunicating work\nprogress to others\n\n• Completing work to\nthe expected\nstandard in the\nworkplace and in\naccordance with any\nguidelines,\ndirections\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 23\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.3 Work is completed to\nthe standard\nexpected in the\nworkplace and in\naccordance with any\nguidelines, directions\nor instructions/\ninformation\n\n2.4 Additional support to\nimprove work is\ncommunicated clearly\nto appropriate\npersonnel\n• Workplace\nstructures and\nthe roles and\nresponsibilities of\nteam/group\nmembers\n\n• Communicating\nadditional support to\nimprove work to\nappropriate\npersonnel\n\n3. Apply ethical\npractices\n\n3.1 Workplace\nprocedures,\nregulations and\nlegislation appropriate\nto the position are\nidentified and\nfollowed\n\n3.2 Commitments and\nundertakings to\nclients, colleagues\nand supervisors are\nmet\n3.3 Required\nconfidentiality is\nmaintained\n3.4 Appropriate codes of\nacceptable and\nethical work practices\nare applied\n3.5 Workplace security\npolicies are identified\n• Workplace\nprocedures,\nregulations and\nlegislation\n\n• Enterprise policy\non commitments\nand undertakings\nto clients,\ncolleagues and\nsupervisors are\nmet\n\n• Techniques of\nmaintaining\ncompany\nconfidentiality\n\n• Company\nWork\nEthics\n• Workplace\nsecurity policies\n\n• Identifying and\nfollowing workplace\nprocedures,\nregulations and\nlegislation\n\n• Meeting\ncommitments and\nundertakings to\nclients, colleagues\nand supervisors\n\n• Maintaining required\nconfidentiality\n\n• Applying\nappropriate codes of\nacceptable and\nethical work\npractices\n\n• Following workplace\nsecurity policies\n\n4. Plan and\norganize an\nassigned daily\nroutine\n\n4.1 Daily routine is\nplanned to take into\naccount rosters,\nindustrial agreements\nand workplace\nprocedures\n\n• Ways of planning\ndaily routine to\ntake into account\nrosters, industrial\nagreements and\nworkplace\nprocedures\n• Planning daily\nroutine taking into\naccount rosters,\nindustrial\nagreements and\nworkplace\nprocedures\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 24\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4.2 Clarification of\nrequirements of tasks\nis sought when\nappropriate\n\n4.3 Achievable time and\nother performance\nmeasures/criteria are\nagreed\n\n• Technique of\nclarifying\nrequirements of\ntasks\n\n• Company\nstandard time\nand other\nperformance\nmeasures of\nwork activities\n• Seeking clarification\nof requirements of\ntasks when\nappropriate\n\n• Agreeing achievable\ntime and other\nperformance\nmeasures\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Workplace procedures\nMay include:\n1.1\nCompany procedures\n1.2\nEnterprise procedures\n1.3\nOrganizational procedures\n1.4\nEstablished departmental procedures\n1.5\nWork Procedure / Processes Flow\n2. Hazards\n\nMay include:\n2.1\nVehicular traffic and pedestrians\n2.2\nUneven ground, steps, road surfaces, work\nsurfaces\n2.3\n Dust and vapors\n2.4\nHazardous or dangerous materials\n2.5\nHumidity, air temperature and radiant heat\n2.6\nLight including UV rays\n2.7\nNoise\n2.8\nWorking at heights\n3. Personal Protective Equipment\n(PPE)\nMay include:\n3.1\nDust mask\n3.2\nHard Hat\n3.3\nHairnet/Head Cap\n3.4\nSafety shoes\n3.5\nGloves\n3.6\nSafety goggles\n3.7\nEar muff/ear plug\n3.8\nSunscreen\n3.9\nHigh visibility clothing\n3.10 Thermal jacket/pants\n3.11 Harness\n4. Instructions/information\nMay include:\n4.1\nWorkplace procedures, checklists and\ninstructions\n4.2\nOperations manuals\n4.3\nInduction/orientation documentation\n4.4\nCompetency standards and training materials\n4.5\nJob specification, site/workplace map and details\nof organization structure\n4.6\nConditions of service, relevant legislation,\nregulations and related documentation\n4.7\nAward, enterprise bargaining agreement, other\nindustrial arrangements\n4.8\nRelevant codes of practice including the national\nstandards for manual handling and the industry\nsafety code\n4.9\nSupplier and/or client instructions\n4.10 Manifests, bar codes, goods and container\nidentification\n4.11 Goods identification numbers and codes\n4.12 Manufacturers specifications\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 26\nVARIABLE\nRANGE\n4.13 Material safety data sheets\n4.14 Quality assurance procedures\n4.15 Emergency procedures\n4.16 Accident procedures\n4.17 Security procedures\n5. Appropriate personnel\nMay include:\n5.1\nManagers\n5.2\nSupervisors/team leaders\n5.3\nWorkplace personnel\n5.4\nContractors\n5.5\nOfficial representatives\n5.6\nUnion representatives\n5.7\nIndustrial relations\n5.8\nOH&S specialists\n5.9\nOther professional or technical staff\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified the layout of the workplace, the flow of materials and\ngoods (where relevant) and the workplace procedures in each\nwork area\n1.2 Identified and followed workplace emergency procedures in real\nand simulated emergency situation\n1.3 Planned work activities and communicated progress of work to\nothers whose personal work plans and timelines may be affected\n1.4 Completed work to the standard expected in the workplace and\nin accordance with any guidelines, directions or instructions/\ninformation\n1.5 Identified and followed workplace procedures, regulations and\nlegislation appropriate to the position\n1.6 Applied appropriate codes of acceptable and ethical work\npractices\n1.7 Planned daily routine to take into account rosters, industrial\nagreements and workplace procedures\n1.8 Applied appropriate codes of acceptable and ethical work\npractices\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n\n3. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n3.3 Interview\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 27\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by a TESDA qualified assessor\n\n4.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 28\nUNIT OF COMPETENCY:\nPERFORM INDUSTRY CALCULATION IN WAREHOUSING\nOPERATIONS\n\nUNIT CODE :"
