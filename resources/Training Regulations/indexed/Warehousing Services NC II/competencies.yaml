        "source_text": "500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory and organizational requirements for occupational\nhealth and safety.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify hazards\nand risks\n1.1 Safety regulations\nand workplace safety\nand hazard control\npractices and\nprocedures are\nclarified and\nexplained based on\norganization\nprocedures\n\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding\nindicators are\nidentified to minimize\nor eliminate risk to\nco-workers,\nworkplace and\nenvironment in\naccordance with\norganization\nprocedures\n\n1.3 Contingency\nmeasures during\nworkplace accidents,\nfire and other\nemergencies are\nrecognized and\nestablished in\naccordance with\norganization\nprocedures\n\n• Company\nworkplace safety\nregulations\n• Industry hazard\ncontrol practices\nand procedures\n• Internationally\nrecognized OHS\nprocedures and\npractices and\nregulations\n• PPE types and\nuses\n• Personal hygiene\npractices\n• Hazards/risks\nidentification and\ncontrol\n• Threshold Limit\nValue -TLV\n• OHS indicators\n• Organization\nsafety and health\nprotocol\n• Safety\nconsciousness\n• Health\nconsciousness\n• Clarifying and\nexplaining safety\nregulations and\nworkplace safety\nand hazard control\n• Identifying\nhazards/risks in\nthe workplace and\ntheir\ncorresponding\nindicators\n• Recognizing\ncontingency\nmeasures during\nworkplace\naccidents, fire and\nother emergencies\n• Practice of\npersonal hygiene\n• Interpersonal skills\n• Communication\nskills\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 17\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Evaluate hazards\nand risks\n2.1 Terms of maximum\ntolerable limits which\nwhen exceeded will\nresult in harm or\ndamage are identified\nbased on threshold\nlimit values (TLV)\n\n2.2 Effects of the\nhazards are\ndetermined\n\n2.3 OHS issues and/or\nconcerns and\nidentified safety\nhazards are reported\nto designated\npersonnel in\naccordance with\nworkplace\nrequirements and\nrelevant workplace\nOHS legislation\n• Methods of\nidentifying terms of\nmaximum tolerable\nlimits\n• Hazard effects\n• Reporting methods\non OHS\nissues/concerns\n• OHS procedures\nand practices and\nregulations\n• PPE types and\nuses\n• Hazards/risks\nidentification and\ncontrol\n• Threshold Limit\nValue -TLV\n• OHS indicators\n• Organization\nsafety and health\nprotocol\n• Safety\nconsciousness\n• Health\nconsciousness\n• Identifying terms of\nmaximum tolerable\nlimits\n• Determining\neffects of hazards\nand risks\n• Reporting OHS\nissues and/or\nconcerns\n• Identifying safety\nhazards\n• Hazards/risks\nidentification and\ncontrol skills\n• Interpersonal skills\n• Communication\nskills\n3. Control hazards\nand risks\n3.1 Occupational Health\nand Safety (OHS)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace are\nconsistently followed\n\n3.2 Procedures for\ndealing with\nworkplace accidents,\nfire and emergencies\nare followed in\naccordance with\norganization OHS\npolicies\n\n• Ways of following\nOccupational\nHealth and Safety\n(OHS) procedures\nfor controlling\nhazards/risks in\nworkplace\n• Ways of following\nprocedures for\ndealing with\nworkplace\naccidents, fire and\nemergencies\n• Types and use of\npersonal protective\nequipment (PPE)\n• OHS procedures\nand practices and\nregulations\n• Following\noccupational\nhealth and safety\n(OHS) procedures\nfor controlling\nhazards/risks in\nworkplace\n• Following\nprocedures for\ndealing with\nworkplace\naccidents, fire and\nemergencies\n• Using correctly\npersonal protective\nequipment (PPE)\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 18\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n3.3 Personal protective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OHS\nprocedures and\npractices\n\n3.4 Appropriate\nassistance is\nprovided in the event\nof a workplace\nemergency in\naccordance with\nestablished\norganization protocol\n• Methods and\ntechniques in\nproviding\nappropriate\nassistance in the\nevent of a\nworkplace\nemergency\n• Hazards/risks\nidentification and\ncontrol\n\n• Providing\nassistance in the\nevent of a\nworkplace\nemergency in\naccordance with\nestablished\norganization\nprotocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related\ndrills and trainings\nare participated in as\nper established\norganization\nguidelines and\nprocedures\n\n4.2 OHS personal\nrecords are\ncompleted and\nupdated in\naccordance with\nworkplace\nrequirements\n• Participation\nprocedures in\nemergency-related\ndrills and trainings\n• Ways of\ncompleting and\nupdating OHS\npersonal records\n• OHS procedures\nand practices and\nregulations\n• OHS indicators\n• Participating in\nemergency-related\ndrills and trainings\n• Completing and\nupdating OHS\npersonal records\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 19\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\n gasses, vapors\n2.4 Ergonomics\n•\nPsychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n•\nPhysiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4.\nPPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 20\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Resource Implications\nThe following resources must be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution\nand given by a TESDA qualified assessor\n\n4.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 21\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nAPPLY WAREHOUSING OPERATIONS AND WORKPLACE\nPROCEDURES\n\nUNIT CODE :"
