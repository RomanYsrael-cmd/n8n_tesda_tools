o complete work\ntasks are performed\nusing the four basic\nprocesses of addition,\nsubtraction,\nmultiplication and\ndivision or any\nappropriate\n\n1.3 Calculations involving\nfractions,\npercentages and\nmixed numbers, and\nusing the four basic\nprocesses, are\nperformed as\nrequired to complete\nworkplace\nprocedures\n\n1.4 The functions of a\ncalculator, numeric\nkeypad or computer\nare used to perform\nmathematical\noperations\n\n• Basic\nmathematical\noperations and\ntechniques\n\n• Ways of\nrepresenting\nbasic\nmathematical\ninformation\n\n• Procedures for\nidentifying and\nusing relevant\nworkplace\ntechnology when\ncarrying out\nworkplace\ncalculations\n\n• Typical\nmathematical\nproblems, and\nappropriate\naction and\nsolutions\n\n• Functions and\nuse of calculator,\nnumeric keypads,\nand computer\n\n• Counting of items\nsingly and in\nbatches and storing\nnumerically as\nrequired in\nworkplace tasks\n\n• Performing needed\ncalculations to\ncomplete work tasks\nusing the four basic\nprocesses of\naddition,\nsubtraction,\nmultiplication and\ndivision\n\n• Performing\ncalculations\ninvolving fractions,\npercentages and\nmixed numbers, and\nusing the four basic\nprocesses\n• Communicating\neffectively with\nothers when\ncarrying out basic\nworkplace\ncalculations\n• Checking and\ncorrecting numerical\ninformation for\naccuracy\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 29\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.5 Numerical information\nis self-checked and\ncorrected for\naccuracy\n• Reading and\ninterpreting\ninstructions,\nprocedures and\ninformation relevant\nto basic workplace\ncalculations\n\n• Using calculators,\nnumeric keypads\nand computer\n2. Prepare\nestimates\n\n2.1 Quantities of\nmaterials and\nresources required to\ncomplete a work task\nare estimated\n2.2 Accurate estimates\nfor work