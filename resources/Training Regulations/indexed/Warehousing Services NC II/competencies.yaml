        "source_text": "--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 45 \nUNIT OF COMPETENCY: \nFOLLOW \nSPECIFICATIONS \nAND \nMANUALS \nOF \nINSTRUCTIONS  WHEN STORING PRODUCTS \n \nUNIT CODE                     : \nLOG432205 \n \nUNIT DESCRIPTOR        : \nThis unit involves the skills and knowledge required to follow \nspecifications and manuals of instructions when storing \nproducts. It includes identifying and categorizing products, \nmatching products to locations based on specified criteria, \nand assisting individuals to solve stock identification and \nlocation problems.\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify and \ncategorize \nproducts \n \n1.1 Products are \nidentified and \ncategorized in terms \nof specified criteria \nin accordance with \nworkplace \nprocedures \n \n Techniques of \nidentifying and \ncategorizing \nproducts in terms of \nspecified criteria and \nin accordance with \nworkplace \nprocedures \n \n Re-ordering \nprocedures and just-\nin-time planning \nprinciples \n \n Requirements for \nworkplace \ndocumentation, \ninventory systems \nand records \n \n Sources of product \ninformation \n \n Types of equipment \nand storage areas \nappropriate for \ndifferent types of \ngoods including \nperishable, fragile, \ndangerous, \ncomposition /state \ngoods \n Identifying \nproducts and \ncategorizing in \nterms of specified \ncriteria in \naccordance with \nworkplace \nprocedures \n \n Using labels, \ninventory systems \nand other \ninformation sources \nto assist in the \nidentification of \nproducts, handling \nand storage \nrequirements\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 46 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Match \nproducts to \nlocations \nbased on \nspecified \ncriteria \n \n2.1 Locations for \nproducts are \ndetermined based \non specified criteria \n \n2.2 Labels, inventory \nsystems and other \ninformation sources \nare used to assist in \nthe identification of \nproducts, handling \nand storage \nrequirements \n \n Ways of determining \nlocations for \nproducts based on \nspecified criteria \n \n Techniques of using \nlabels, inventory \nsystems and other \ninformation sources \nto assist in the \nidentification of \nproducts, handling \nand storage \nrequirements \n \n Information on \nvarious categories \nor groups of \nproducts including \ntheir key \ncharacteristics and \nhazards, and the \nspecial handling, \nstacking, and \nstorage \nrequirements for \neach \n \n Product sources, \ndestinations and \npotential problems\n Determining \nlocations for \nproducts based on \nspecified criteria \n \n Using information on \nproducts/stock to \ndetermine, plan  and \norganize processes \nused for receiving, \nstorage, goods \nmovement, \ndispatch, stock \nlevels, and  re-\nordering processes \n \n3. Assist co-\nworkers to \nsolve stock \nidentification \nand location \nproblems \n \n3.1 New stock items are \nidentified and \nparticular product \ninformation is \nbrought to the \nattention of relevant \nworker \n \n \n \n \n \n \n \n \n \n Ways of identifying \nnew stock items and \nbringing particular \nproduct information \nto the attention of \nrelevant personnel \n \n Methods of  locating \nand assimilating \ninformation relevant \nto the product \n \n \n \n \n Identifying new \nstock items and \nparticular product \ninformation is \nbrought to the \nattention of relevant \nworkers \n \n Assisting co-workers \nwith routine and \nnon-routine stock \nenquiries\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 47 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3.2 Co-workers are \nassisted with routine \nand non-routine \nstock enquiries with \nactions taken to \nupdate information \nof products for \nrelevant personnel \n \n3.3 Co-workers are \nencouraged to \nmaintain and build \nproduct knowledge \nthrough accessing \nproduct information \nand the application \nof problem solving \nand information \nanalysis skills\n Techniques of  \naccessing product \ninformation and the \napplication of \nproblem solving and \ninformation analysis \nskills \n Updating \ninformation of \nproducts for relevant \nco-workers \n \n Encouraging co-\nworkers to maintain \nand build product \nknowledge\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 48 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Workplace procedures \nMay include: \n1.1 Established security procedures \n1.2 Standard operating procedures  \n1.3 Company procedures \n1.4 Enterprise procedures \n1.5\nOrganizational procedures\n2. Products \nMay include: \n2.1 small parts \n2.2 perishable goods \n2.3 overseas export  goods \n2.4 refrigerated products  \n2.5 Special handling goods \n2.6 Storage goods \n2.7 Packaging goods \n2.8 Temperature controlled stocks \n2.9\nDangerous goods\n3. Labels \nMay include: \n3.1 Batch code  \n3.2 Bar code \n3.3 Identification numbering systems \n3.4 Serial numbers  \n3.5\nSymbols for safe handling\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 49 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n \n1.1 Identified products and categorized in terms of specified criteria in \naccordance with workplace procedures \n \n1.2 Locations for products are determined based on specified criteria \n \n1.3 Used labels, inventory systems, and other information sources to \nassist in the identification of products, handling, and storage \nrequirements \n \n1.4 Assisted co-workers with routine and non-routine stock enquiries \nwith actions taken to update information of products for relevant \npersonnel \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1 Written test \n3.2 Direct observation and oral questioning \n3.3 Demonstration with questioning \n3.4 Interview \n4. Context of \nAssessment \n \n \n \n4.1 Competency may be assessed individually in the actual \nworkplace or through an accredited assessment institution and \ngiven by a TESDA qualified assessor \n4.2 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
