rvation and oral questioning\n3.3 Demonstration with questioning\n3.4 Interview\n\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by a TESDA qualified assessor\n\n4.2 Competency assessment must be undertaken in accordance with\nthe endorsed TESDA assessment guidelines\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 39\n\nUNIT OF COMPETENCY:\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE :\nLOG432203\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to provide\neffective\ncustomer\nservice\nskills\nto\nrelevant\nworkplace\noperations. It includes dealing with customer inquiries and\nmonitoring customer satisfaction.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Deal with\ncustomer\ninquiries\n\n1.1 Customer inquiries\nare dealt with\ncourteously and\nefficiently both by\nphone and face to\nface\n\n1.2 Questions are used\nto clarify the\ncustomer's needs or\nconcerns\n\n1.3 Assistance from\nother staff is sought\nwhen a customer' s\ninquiry cannot be\nfully answered\n\n1.4 Knowledge of\nproducts, services\nand/or operations is\nused to answer\ncustomer queries or\nto respond to\ncustomers' needs\n\n• Techniques in\ndealing with\nCustomer inquiries\nboth by phone and\nface to face\n\n• Relevant OH&S and\nenvironmental\nprocedures and\nregulations\n\n• Workplace\nprocedures relevant\nto work activities\n\n• Customer service\npolicies and\nprocedures\n\n• Products and/or\nservices provided by\nthe workplace\nconcerned\n\n• Types of operations\ncarried out in the\nworkplace\nconcerned\n\n• Dealing with\ncustomer inquiries\ncourteously and\nefficiently both by\nphone and face to\nface\n\n• Seeking\nassistance from\nother staff when a\ncustomer' s inquiry\ncannot be fully\nanswered\n\n• Communicating\neffectively with\nothers when\nproviding customer\nservice, including\nthe use of\ntelephone\ntechniques\n\n• Handling customer\nqueries and\ncomplaints\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 40\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Monitor\ncustomer\nsatisfaction\n\n2.1 Customer\nrequirements are\ndealt with according\nto workplace\nprocedures\n\n2.2 Appropriate\nfeedback is provided\nto managers and\ninternal and/or\nexternal customers\n\n2.3 Customer inquiries\nand associated\naction are recorded\nand reported in\naccordance with\nworkplace\nprocedures\n\n• Ways of dealing with\nCustomer\nrequirements\n\n• Appropriate\nmethods of\nproviding feedback\nto managers and\ninternal and/or\nexternal customers\n\n• Ways of recording\ncustomer inquiries\nand associated\naction\n• Sources of\ninformation and\ndocumentation\nneeded to assess\ncustomer\nsatisfaction\n• Providing\nappropriate\nfeedback to\nmanagers and\ninternal and/or\nexternal customers\n\n• Recording and\nreporting customer\ninquiries and\nassociated action\n\n• Completing\ndocumentation\nrelated to the\nprovision of\ncustomer service\n\n• Writing simple\nreports and\nrecords of inquiries\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Customer\nMay be:\n1.1 Internal or\n1.2 External\n2. Workplace procedures\n\nMay include:\n2.1 Established security procedures\n2.2 Standard operating procedures\n2.3 Company procedures\n2.4 Enterprise procedures\n2.5 Organizational procedures\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n\n1.1 Dealt with customer inquiries courteously and efficiently both by\nphone and face to face\n\n1.2 Used knowledge of products, se