        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Interpreted Packaging specifications and order of packaging\ndocumentation\n\n1.2 Selected appropriate packaging technology suitable for the goods\nto be packed\n\n1.3 Identified and matched packaging materials to specifications\n\n1.4 Packed and wrapped goods/products in accordance to packaging\nspecifications and order packaging requirements\n\n1.5 Packed and wrapped goods/products in accordance with OH&S\nrequirements\n\n1.6 Identified workplace labeling standards\n\n1.7 Utilized appropriate goods handling, labeling, and other\nidentification symbols\n\n1.8 Completed workplace documentation\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit MUST be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by a TESDA qualified assessor\n4.2 Competency assessment must be undertaken in accordance with\nthe endorsed TESDA assessment guidelines\n\n--- PDF PAGE 91 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 87\n\nUNIT OF COMPETENCY: OPERATE AND MAINTAIN MATERIAL HANDLING\nEQUIPMENT\n\nUNIT CODE :"
        },
        "source_text": "LOG432305\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to pack\ngoods/products in accordance with regulatory and workplace\nrequirements. It includes selecting packaging materials,\npacking/wrapping goods/products and labeling packed goods/\nproducts.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Select\npackaging\nmaterials\n1.1 Packaging\nspecifications and\norder packaging\ndocumentation are\ncorrectly interpreted\n1.2 Appropriate\npackaging\ntechnology suitable\nfor the goods to be\npacked is selected\n1.3 Packaging\nmaterials are\nidentified and\nmatched to\nspecifications\n1.4 Work plan ensures\nmaterials are used\neconomically and\nthat appropriate\npackaging is used\nthat minimizes loss\nand damage in\ntransit or storage\n1.5 Work is planned in\naccordance with\nOH&S\nrequirements\n• Method of interpreting\npackaging\nspecifications and\norder packaging\ndocumentation\n\n• Ways of selecting\nappropriate\npackaging technology\nsuitable for the goods\nto be packed\n\n• Manner of identifying\nand matching\npackaging materials\nto specifications\n\n• Techniques of using\nwork plan to ensure\nthat materials are\nused economically\n\n• National and\ninternational codes\nand regulations\nrelevant to the\npackaging of goods\nincluding Dangerous\nGoods Code\n\n• Relevant OH&S and\nenvironmental\nprotection\nprocedures and\nguidelines\n• Interpreting correctly\npackaging\nspecifications and\norder packaging\ndocumentation\n\n• Selecting\nappropriate\npackaging\ntechnology suitable\nfor the goods to be\npacked\n\n• Identifying and\nmatching packaging\nmaterials to\nspecifications\n\n• Reading and\ninterpreting\ninstructions,\nprocedures and\nlabels relevant to\nthe packaging of\ngoods\n\n• Estimate the size,\nshape and special\nrequirements of\ngoods and loads\n\n--- PDF PAGE 87 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 83\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Pack/wrap\ngoods/\nproducts\n\n2.1 Packed and\nwrapped goods/\nproducts are in\naccordance to\npackaging\nspecifications and\norder packaging\nrequirements\n\n2.2 Completed packed\ngoods are stacked\nto minimize damage\nfrom within and\noutside\n\n2.3 Packed and\nwrapped\ngoods/products are\nin accordance with\nOH&S requirements\n• Method of packing\nand wrapping of\ngoods/\nproducts\n\n• Ways of stacking\npacked goods to\nminimize damage\nfrom within and\noutside\n\n• OH&S requirements\nin Packing and\nwrapping of\ngoods/products\n\n• National and\ninternational codes\nand regulations\nrelevant to the\npackaging of goods\nincluding Dangerous\nGoods Code\n\n• Workplace\nprocedures and\npolicies for the\npackaging of goods\n\n• Problems that may\noccur when\npackaging goods and\nappropriate action\nthat can be taken to\nresolve the problems\n• Packing and\nwrapping of goods/\nproducts\n\n• Stacking completed\npacked goods to\nminimize damage\nfrom within and\noutside\n\n• Reporting and/or\nrectifying any\nidentified problems,\nfaults or\nmalfunctions that\nmay occur when\npackaging goods\n\n• Selecting and using\nrequired personal\nprotective\nequipment\nconforming to\nindustry and OS&H\nstandards\n\n• Reporting and/or\nrectifying any\nidentified problems,\nfaults or\nmalfunctions that\nmay occur when\npackaging good\n\n3. Label packed\ngoods/\nproducts\n\n3.1 Workplace labeling\nstandards are\nidentified\n\n3.2 Appropriate goods\nhandling, labeling\nand other\nidentification\nsymbols are utilized\n\n• Means of identifying\nworkplace labeling\nstandards\n\n• Method of utilizing\nappropriate goods\nhandling, labeling and\nother identification\nsymbols\n\n• Identifying\nworkplace labeling\nstandards\n\n• Utilizing goods\nhandling, labeling\nand other\nidentification\nsymbols\n\n--- PDF PAGE 88 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 84\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.3 Invoices and\npicking slips are\nattached (where\nrequired)\n\n3.4 Workplace\ndocumentation is\ncompleted\n\n• Means of attaching\ninvoices and picking\nslips (where required)\n\n• Procedure of\ncompleting\nWorkplace\ndocumentation\n\n• Documentation\nrequirements for the\npackaging of goods\n\n• Housekeeping\nstandard procedures\nrequired in the\nworkplace\n• Attaching invoices\nand picking slips\n(where required)\n\n• Completing\ndocumentation\nrelated to work\nactivities when\npackaging goods\n\n--- PDF PAGE 89 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 85\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Goods\nMay include:\n1.1 Special handling,\n1.2 Storage and/or packaging requirements\n1.3 Temperature controlled goods\n1.1 Dangerous goods\n\n2. Packaging materials\nMay include:\n2.1 Corrugated Box\n2.2 Cushioning Materials (bubble wrap, shrink wrap)\n2.3 Packaging Tape\n2.4 Crate (wooden, plastic, metal)\n2.5\nStyrofoam\n3. OH&S requirements\nMay include safe handling of:\n3.1 Chemicals\n3.2 Dangerous or hazardous substances\n3.3 Equipment, goods and materials\n3.4 Oil or water on floor\n3.5 Fire or explosion\n3.6 Damaged packaging or pallets\n3.7 Debris on floor\n3.8 Faulty racking\n3.9 Poorly stacked pallets\n3.10 Faulty equipment\n4. Workplace documentation\nMay include:\n4.1 Goods identification numbers and codes\n4.2 Manifests, picking slips, merchandise transfers,\nstock requisitions and bar codes\n4.3 Operations manuals, job specifications and\ninduction documentation\n4.4 Manufacturer’s specifications for equipment\n4.5 Workplace procedures and policies\n4.6 Supplier and/or client instructions\n\n--- PDF PAGE 90 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 86\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Interpreted Packaging specifications and order of packaging\ndocumentation\n\n1.2 Selected appropriate packaging technology suitable for the goods\nto be packed\n\n1.3 Identified and matched packaging materials to specifications\n\n1.4 Packed and wrapped goods/products in accordance to packaging\nspecifications and order packaging requirements\n\n1.5 Packed and wrapped goods/products in accordance with OH&S\nrequirements\n\n1.6 Identified workplace labeling standards\n\n1.7 Utilized appropriate goods handling, labeling, and other\nidentification symbols\n\n1.8 Completed workplace documentation\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit MUST be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by a TESDA qualified assessor\n4.2 Competency assessment must be undertaken in accordance with\nthe endorsed TESDA assessment guidelines\n\n--- PDF PAGE 91 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 87\n\nUNIT OF COMPETENCY: OPERATE AND MAINTAIN MATERIAL HANDLING\nEQUIPMENT\n\nUNIT CODE :"
