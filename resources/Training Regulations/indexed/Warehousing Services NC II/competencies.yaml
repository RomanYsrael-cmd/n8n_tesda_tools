        "source_text": "--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 50 \nUNIT OF COMPETENCY: MAINTAIN AND USE HAND TOOLS \n \nUNIT CODE                     : \nLOG432206 \n \nUNIT DESCRIPTOR        : \nThis unit involves the skills and knowledge required to \nmaintain and use hand tools in accordance with workplace \nrequirements. It includes selecting and using hand tools to \ncomplete workplace tasks, maintaining basic hand tools in \naccordance with manufacturer’s instructions, and securing \nand storing hand tools in accordance with workplace \nprocedures.  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Select and \nuse hand tools \n \n1.1 Correct tools for \nwork to be carried \nout are chosen to \ncomplete workplace \ntasks and to ensure \nefficient and safe \nworking conditions \n \n1.2 Appropriate \npersonal \nprotective \nequipment  is used \nto minimize the risk \nof personal injury \n \n Proper \nways/techniques of \nusing different \ntypes of hand tools \n \n OH&S and \nenvironmental \nprocedures and \nregulations \nrelevant to the use \nof hand tools \n \n Workplace \nprocedures and \npolicies for the use \nand maintenance \nof hand tools \n \n Problems that can \noccur when using \nand maintaining \nhand tools and \nrelated action that \nshould be taken \n \n \n \n \n \n Choosing the \ncorrect tools for \nwork to be carried \nout to complete \nworkplace tasks \nand to ensure \nefficient and safe \nworking conditions \n \n Using appropriate \npersonal protective \nequipment to \nminimize the risk \nof personal injury \n \n Reporting and/or \nrectifying any \nidentified \nproblems, faults or \nmalfunctions when \nmaintaining and \nusing hand tools in \naccordance with \nregulatory \nrequirements and \nworkplace \nprocedures\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 51 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Maintain hand \ntools \n \n2.1 Equipment is \ncleaned and \nmaintained in \naccordance with \nmanufacturer’s \nspecifications and/or \nlocal instructions to \nensure correct \nfunctionality of \nequipment  \n \n2.2 Any unserviceable \ntools are reported to \nrelevant personnel \nto ensure correct \nfunctionality \n Ways of cleaning \nand maintaining of \nequipment  \n Workplace \nprocedures and \npolicies for the use \nand maintenance of \nhand tools \n \n Problems that can \noccur when using \nand maintaining \nhand tools and \nrelated action that \nshould be taken \n Cleaning and \nmaintaining \nequipment  \n Reporting any \nunserviceable tools \nto relevant \npersonnel to ensure \ncorrect functionality \n \n Communicating \neffectively with \nothers when \nmaintaining and \nusing hand tools \n \n Reading and \ninterpreting \ninstructions, \nprocedures, \ninformation and \nsigns relevant to the \nmaintenance and \nuse of hand tools\n3. Secure and \nstore hand \ntools \n \n3.1 Tools are \ntransported in a \nsafe, secure, \nefficient manner to \nminimize risk of \ninjury to personnel \nand damage to \nequipment  \n \n3.2 Tools and materials \nare stored and \nsecured according \nto manufacturer’s or \nworkplace \nprocedures to \nprevent damage to, \nand losses of, \nequipment \n Procedure of \ntransporting tools in \na safe, secure, \nefficient manner to \nminimize risk of \ninjury to personnel \nand damage to \nequipment  \n \n Ways of storing and \nsecuring tools  \n \n Workplace \ndocumentation and \nrecords \nrequirements \n Transporting tools in \na safe, secure, \nefficient manner to \nminimize risk of \ninjury to personnel \nand damage to \nequipment  \n \n Storing and securing \ntools according to \nmanufacturer’s or \nworkplace \nprocedures \n \n Making \ndocumentation and  \nrecording of tools \nand equipment as \nrequired in the  \nworkplace\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 52 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal  Protective Equipment \n(PPE) \nMay include: \n1.1 \nReflectorized (high visibility) clothing \n1.2 \nSunscreen  \n1.3 \nSun glasses  \n1.4 \nInsect repellent  \n1.5 \nHand gloves \n1.6 \nSafety headwear \n1.7 \nMask   \n1.8 \nFootwear  \n1.9 \nPortable radios  \n1.10 \nFlags and hand lamps  \n1.11 \nSafety glasses and hearing protection  \n1.12 \nSafety devices  \n2. Tools  \nMay include: \n2.1 \nPliers \n2.2 \nScrew driver \n2.3 \nCarpenter’s hammer \n2.4 \nBall peen hammer \n2.5 \nTinsnip \n2.6 \nAdjustable wrench \n2.7 \nCombination wrench \n2.8 \nSocket wrench \n2.9 \nPipe wrench \n2.10 Scissors \n2.11 Cutter \n2.12 Hand hack saw \n2.13 Wood saw \n3. Equipment \nMay include: \n3.1 \nPallet truck \n3.2 \nTrolley \n3.3 \nPortable grinder \n3.4 \nHand drill \n3.5 \nStock lifter (manual operated) \n3.6\nChain block\n4. Materials \nMay include: \n4.1 \nNails \n4.2 \nScrews \n4.3 \nSandpaper \n4.4 \nOils \n4.5 \nGrease \n4.6 \nNylon tie \n4.7 \nRope \n4.8 \nPackaging tapes \n4.9\nMarking pens\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 53 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n \n1.1 Chose the correct tools to be carried out for work to complete \nworkplace tasks and to ensure efficient and safe working \nconditions \n \n1.2 Used appropriate personal  protection equipment  to minimize the \nrisk of personal injury \n \n1.3 Cleaned and maintained tools and equipment in accordance with \nmanufacturer’s specifications and/or local instructions to ensure \ncorrect functionality  \n \n1.4 Reported to relevant personnel any unserviceable tools to ensure \ncorrect functionality \n \n1.5 stored \nand \nsecured \nTools \nand \nmaterials \naccording \nto \nmanufacturer’s or workplace procedures  \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1 Written test \n3.2 Direct observation and oral questioning \n3.3 Demonstration with questioning \n3.4 Interview \n4. Context of \nAssessment \n \n \n \n4.1 Competency may be assessed individually in the actual \nworkplace or through an accredited assessment institution and \ngiven by a TESDA qualified assessor \n4.2 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
