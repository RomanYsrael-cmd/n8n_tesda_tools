        "source_text": "LOG432206\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to\nmaintain and use hand tools in accordance with workplace\nrequirements. It includes selecting and using hand tools to\ncomplete workplace tasks, maintaining basic hand tools in\naccordance with manufacturer’s instructions, and securing\nand storing hand tools in accordance with workplace\nprocedures.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Select and\nuse hand tools\n\n1.1 Correct tools for\nwork to be carried\nout are chosen to\ncomplete workplace\ntasks and to ensure\nefficient and safe\nworking conditions\n\n1.2 Appropriate\npersonal\nprotective\nequipment is used\nto minimize the risk\nof personal injury\n\n• Proper\nways/techniques of\nusing different\ntypes of hand tools\n\n• OH&S and\nenvironmental\nprocedures and\nregulations\nrelevant to the use\nof hand tools\n\n• Workplace\nprocedures and\npolicies for the use\nand maintenance\nof hand tools\n\n• Problems that can\noccur when using\nand maintaining\nhand tools and\nrelated action that\nshould be taken\n\n• Choosing the\ncorrect tools for\nwork to be carried\nout to complete\nworkplace tasks\nand to ensure\nefficient and safe\nworking conditions\n\n• Using appropriate\npersonal protective\nequipment to\nminimize the risk\nof personal injury\n\n• Reporting and/or\nrectifying any\nidentified\nproblems, faults or\nmalfunctions when\nmaintaining and\nusing hand tools in\naccordance with\nregulatory\nrequirements and\nworkplace\nprocedures\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 51\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Maintain hand\ntools\n\n2.1 Equipment is\ncleaned and\nmaintained in\naccordance with\nmanufacturer’s\nspecifications and/or\nlocal instructions to\nensure correct\nfunctionality of\nequipment\n\n2.2 Any unserviceable\ntools are reported to\nrelevant personnel\nto ensure correct\nfunctionality\n• Ways of cleaning\nand maintaining of\nequipment\n• Workplace\nprocedures and\npolicies for the use\nand maintenance of\nhand tools\n\n• Problems that can\noccur when using\nand maintaining\nhand tools and\nrelated action that\nshould be taken\n• Cleaning and\nmaintaining\nequipment\n• Reporting any\nunserviceable tools\nto relevant\npersonnel to ensure\ncorrect functionality\n\n• Communicating\neffectively with\nothers when\nmaintaining and\nusing hand tools\n\n• Reading and\ninterpreting\ninstructions,\nprocedures,\ninformation and\nsigns relevant to the\nmaintenance and\nuse of hand tools\n3. Secure and\nstore hand\ntools\n\n3.1 Tools are\ntransported in a\nsafe, secure,\nefficient manner to\nminimize risk of\ninjury to personnel\nand damage to\nequipment\n\n3.2 Tools and materials\nare stored and\nsecured according\nto manufacturer’s or\nworkplace\nprocedures to\nprevent damage to,\nand losses of,\nequipment\n• Procedure of\ntransporting tools in\na safe, secure,\nefficient manner to\nminimize risk of\ninjury to personnel\nand damage to\nequipment\n\n• Ways of storing and\nsecuring tools\n\n• Workplace\ndocumentation and\nrecords\nrequirements\n• Transporting tools in\na safe, secure,\nefficient manner to\nminimize risk of\ninjury to personnel\nand damage to\nequipment\n\n• Storing and securing\ntools according to\nmanufacturer’s or\nworkplace\nprocedures\n\n• Making\ndocumentation and\nrecording of tools\nand equipment as\nrequired in the\nworkplace\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 52\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Protective Equipment\n(PPE)\nMay include:\n1.1\nReflectorized (high visibility) clothing\n1.2\nSunscreen\n1.3\nSun glasses\n1.4\nInsect repellent\n1.5\nHand gloves\n1.6\nSafety 