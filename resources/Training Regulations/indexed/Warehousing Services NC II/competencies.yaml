        "source_text": "LOG432202\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to carry out\nbasic routine workplace calculations. It specifically includes\ncarrying out required mathematical operations; preparing basic\nestimates of mass, size and volume; and interpreting basic\ngraphical representations of mathematical information.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Carry out\ncalculations\n\n1.1 Items are counted\nsingly and in batches\nand sorted\nnumerically, as\nrequired in workplace\ntasks\n\n1.2 Calculations needed\nto complete work\ntasks are performed\nusing the four basic\nprocesses of addition,\nsubtraction,\nmultiplication and\ndivision or any\nappropriate\n\n1.3 Calculations involving\nfractions,\npercentages and\nmixed numbers, and\nusing the four basic\nprocesses, are\nperformed as\nrequired to complete\nworkplace\nprocedures\n\n1.4 The functions of a\ncalculator, numeric\nkeypad or computer\nare used to perform\nmathematical\noperations\n\n• Basic\nmathematical\noperations and\ntechniques\n\n• Ways of\nrepresenting\nbasic\nmathematical\ninformation\n\n• Procedures for\nidentifying and\nusing relevant\nworkplace\ntechnology when\ncarrying out\nworkplace\ncalculations\n\n• Typical\nmathematical\nproblems, and\nappropriate\naction and\nsolutions\n\n• Functions and\nuse of calculator,\nnumeric keypads,\nand computer\n\n• Counting of items\nsingly and in\nbatches and storing\nnumerically as\nrequired in\nworkplace tasks\n\n• Performing needed\ncalculations to\ncomplete work tasks\nusing the four basic\nprocesses of\naddition,\nsubtraction,\nmultiplication and\ndivision\n\n• Performing\ncalculations\ninvolving fractions,\npercentages and\nmixed numbers, and\nusing the four basic\nprocesses\n• Communicating\neffectively with\nothers when\ncarrying out basic\nworkplace\ncalculations\n• Checking and\ncorrecting numerical\ninformation for\naccuracy\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 29\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.5 Numerical information\nis self-checked and\ncorrected for\naccuracy\n• Reading and\ninterpreting\ninstructions,\nprocedures and\ninformation relevant\nto basic workplace\ncalculations\n\n• Using calculators,\nnumeric keypads\nand computer\n2. Prepare\nestimates\n\n2.1 Quantities of\nmaterials and\nresources required to\ncomplete a work task\nare estimated\n2.2 Accurate estimates\nfor work completion\nare made\n\n• Knowledge,\nTheory,\nApplication,\nSystems\nOperation\n\n• Techniques of\nestimating\nquantities of\nmaterials and\nresources\n\n• Techniques for\nmaking an\naccurate\nestimate of\ncompleting a\nparticular\nwork/activity\n\n• Communication\n• Estimating\nquantities of\nmaterials and\nresources required\nto complete a work\ntask\n\n• Making accurate\nestimates for work\ncompletion\n\n• Communicating\neffectively with\nothers when\ncarrying out basic\nworkplace\ncalculations\n\n• Completing\ndocumentation\n\n• Working\nsystematically with\nrequired attention to\ndetail\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 30\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Interpret\ngraphical\nrepresentations\nof mathematical\ninformation\n\n3.1 Information\nrepresented in\nsymbols, diagrams,\nlogos and pictorial\nrepresentations are\nrecognized,\ninterpreted and acted\nupon in workplace\ntask\n• Methods of\ninterpreting,\nrecognizing and\nrepresenting,\ninformation in\nsymbols,\ndiagrams, logos,\npictorial\nrepresentations\nand other visual\nmaterials\n\n• Recognizing,\ninformation\nrepresented in\nsymbols, diagrams,\npictorial\nrepresentations and\nother visual\nmaterials\n• Interpreting\ninformation\nrepresented in\nsymbols, diagrams,\npictorial\nrepresentations and\nother visual\nmaterials\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Calculations\n\nMay involve:\n1.1 Money\n1.2 Volume\n1.3 Width\n1.4 Height\n1.5 Weight\n1.6 Time\n1.7 Dimensions\n1.8 Length and distance\n1.9 Area\n1.10\nPerimeter\n1.11\nCapacity\n2. Workplace procedures\n\nMay include:\n2.1 Company procedures\n2.2 Enterprise procedures\n2.3 Organizational procedures\n2.4 Established procedures\n3. Mathematical operations\n\nMay include:\n3.1 Multiplication\n3.2 Division\n3.3 Addition\n3.4 Subtraction\n3.5 Fraction\n3.6 Percentages\n3.7 Ratio and proportion\n3.8 Conversion\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 32\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Performed calculations involving fractions, percentages and\nmixed numbers using the four basic processes as required to\ncomplete workplace procedures\n\n1.2 Made accurate estimates to complete assigned work/activities\n\n1.3 Recognized, interpreted and acted upon information represented\nin symbols, diagrams and pictorial representations in workplace\ntask\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n\n2.2 Materials relevant to the unit of competency\n\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n3.4 Interview\n\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by 