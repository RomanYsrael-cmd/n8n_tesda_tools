iable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.2 Labels, inventory\nsystems and other\ninformation\nsources are used to\nassist in the\nidentification of\nproducts, handling\nand storage\nrequirements\n• Strategies of\nidentifying products,\nhandling and\nstorage\nrequirements\n\n• Types of equipment\nand storage areas\nappropriate for\ndifferent types of\ngoods\n• Using labels,\ninventory systems\nand other\ninformation\nsources to assist\nin the identification\nof products,\nhandling and\nstorage\nrequirements\n\n3. Identify\nappropriate\ntransfer and\nhandling\nrequirements\n\n3.1 Resources used to\ntransfer different\nproducts through\nthe storage zones\nare identified and\nevaluated\n\n3.2 Work in receiving\nand dispatch areas\nis supported by\nidentification and\nreporting of\nvariances\n\n3.3 Relevant\ndocumentation is\ncompleted in\naccordance with\nworkplace\nprocedures\n• Ways of identifying\nand evaluating\nresources used to\ntransfer different\nproducts through\nthe storage zones\n\n• Means of\nidentification and\nreporting of\nvariances\n\n• Strategies of\ncompleting\ndocumentation in\naccordance with\nworkplace\nprocedures\n\n• Requirements for\nworkplace\ndocumentation,\ninventory systems\nand records\n\n• Documentation\nrequirements\nincluding reports\nand records\nconcerning\ndamaged or\ncontaminated goods\n\n• Identifying and\nevaluating\nresources used to\ntransfer different\nproducts\n\n• Identifying and\nreporting of work in\nreceiving and\ndispatch areas\n\n• Completing\nrelevant\ndocumentation in\naccordance with\nworkplace\nprocedures\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 68\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Put-away/ store\nstocks/goods\n4.1 Products are sorted,\nassembled, and\nconsolidated in the\nappropriate storage\nareas\n\n4.2 Storing is checked\nin accordance with\ncompany\nprocedures\n\n4.3 Documentation and\nrecording are\ncompleted in\naccordance with\nworkplace\nprocedures\n\n• Methods of sorting,\nassembling and\nconsolidating\nproducts in the\nappropriate storage\nareas\n\n• Methods of checking\nStorage work in\naccordance with\ncompany\nprocedures\n\n• Means of\ncompleting\ndocumentation and\nrecording in\naccordance with\nworkplace\nprocedures\n\n• Relevant OH&S and\nenvironmental\nprotection\nprocedures and\nguide lines\n\n• Re-ordering\nprocedures and just-\nin-time planning\nprinciples\n\n• Requirements for\nworkplace\ndocumentation,\ninventory systems\nand records\n• Sorting,\nassembling and\nconsolidating of\nproducts in the\nappropriate\nstorage areas\n\n• Checking storage\nin accordance with\ncompany\nprocedures\n\n• Completing\ndocumentation and\nrecording in\naccordance with\nworkplace\nprocedures\n\n• Completing\ndocumentation\nrelated to the\norganization of\nwork activities\n\n• Reporting and/or\nrectifying any\nidentified problems\nthat may arise\nwhen performing\nstorage work\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Products\nMay include but not limited to:\n1.1 small parts\n1.2 perishable goods\n1.3 overseas export\n1.4 dangerous goods\n1.5 refrigerated products\n1.6 temperature controlled stock\n1.7\nfragile goods\n2. Storage zones\nMay include but not limited to:\n2.1 Bin/binning systems\n2.2 Rack refrigeration/freezers/cold rooms\n2.3 Marked floor space\n2.4 Containers\n2.5 Racks and racking systems\n2.6 Block/stacks\n2.7\nPallets\n3. Workplace procedures\nMay include:\n3.1 Established security procedures\n3.2 Standard operating procedures\n3.3 Company procedures\n3.4 Enterprise procedures\n3.5 Organizational procedures\n4. Information sources\nMay include:\n4.1 Goods identification numbers and codes\n4.2 Manifests, picking slips, merchandise transfers,\nstock requisitions and bar