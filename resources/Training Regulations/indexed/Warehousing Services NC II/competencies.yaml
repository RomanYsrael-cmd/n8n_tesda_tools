rated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n• Workplace\nprocedures and\npolicies for the use\nand maintenance of\nmaterial handling\nequipment.\nProblems that can\noccur when using\nand maintaining\nminor mechanical\nequipment and\nrelated action that\nshould be taken to\nresolve them\n• Tools and\nequipment for using\nand maintaining\nminor mechanical\nequipment and the\nprocedures and\nprecautions for their\ncare, use, and\nstorage\n• Workplace\ndocumentation and\nrecords\nrequirements\n\n• Reporting identified\nproblems, faults and\nmalfunctions that\nmay arise when\nmaintaining minor\nmechanical\nequipment\n• Selecting and using\nrequired personal\nprotective\nequipment (PPE)\n• Monitoring\nperformance of\nequipment\n4. Secure and\nstore material\nhandling\nequipment\n4.14\nEquipment is\nhandled and\ntransported in a\nsafe, secure and\nefficient manner in\naccordance to\nworkplace\nprocedure\n4.15\nEquipment is\nstored and secured\naccording to\nmanufacturer and\nworkplace\nprocedure\n4.16\n Warehouse\nsignage and\nlifesaving rules are\nfollowed\n• Manner of handling\nand transporting\nequipment\n• Procedure of storing\nand securing\nequipment\n• Relevant OH&S and\nenvironmental\nprocedures and\nregulations\n• Workplace\ndocumentation and\nrecords\nrequirements\n• Following relevant\nwarehouse signage\nand lifesaving rules\n• Handling and\ntransporting\nequipment in a safe,\nsecure and efficient\nmanner\n\n• Storing and securing\nequipment\n\n--- PDF PAGE 94 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 90\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials Handling Equipment\nMay include but not limited to:\n1.1 Pallet trucks/ jack lift/hand lift/pallet lifter\n1.2 Trolley/push cart\n1.3 Portable conveyors\n1.4 Hoist\n1.5 Drum lifters\n1.6 Push/pull attachment\n1.7\nForklift\n2.Specified checklist\nMay include:\n2.1 Hydraulic oil level\n2.2 Bolts and nuts tightening\n2.3 Lever arm operation\n2.4 Wheel condition\n2.5 Equipment’s physical appearance/condition\n2.6 Battery condition\n2.7\nLocking device\n3.Authorized person\nMay include:\n3.1 Team Leader\n3.2 Supervisors\n3.3 Maintenance Head\n3.4 Managers\n3.5\nOSH Specialists/Safety Officer\n4.Personal Protective Equipment\nMay include:\n4.1 Safety Vest\n4.2 Sunscreen\n4.3 Sunglasses/Goggles/Safety Glass\n4.4 Back Support\n4.5 Thermal Suit\n4.6 Insect repellent Suit\n4.7 Gloves\n4.8 Apron\n4.9 Safety headwear/Hard hat\n4.10 Face mask\n4.11 Safety shoes\n4.12 Ear protector/ear plug\n4.13 Harness\n5. Accurate records\nMay include:\n5.1 Material Handling Equipment checklist form\n5.2 PPE Checklist\n5.3 Preventive Maintenance Report\n5.4 Job Order Form\n5.5 Work Permit Form\n\n--- PDF PAGE 95 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 91\nVARIABLE\nRANGE\n6. Warehouse signage and\nlifesaving rules\nMay include:\n6.1 Pedestrian Lane\n6.2 Restricted Area\n6.3 Moving Equipment Warning Signs\n6.4 No Smoking Sign\n6.5 Restricted Use of Mobile\n6.6 Hard Hat Area\n6.7 3-meter Rule\n6.8 Vertical Clearance Signage\n6.9\nStaging/Dispatching/Receiving Area\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Operated material handling equipment in accordance with\nmanufacturer and workplace operating instructions\n1.2 Made necessary adjustments to equipment according to\nmanufacturer instructions to ensure efficient operation\n1.3 Used appropriate personal protective equipment to minimize the\nrisk of injury to operator\n1.4 Equipment is cleaned and maintained in accordance with\nmanufacturer specifications to ensure optimum functionality\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit MUST be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by a TESDA qualified assessor\n4.2 Competency assessment must be undertaken in accordance with\nthe endorsed TESDA assessment guidelines\n\n--- PDF PAGE 96 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 92"
