        "source_text": "--- PDF PAGE 81 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 77 \nUNIT OF COMPETENCY: ISSUE/DISPATCH STOCKS/GOODS \n \nUNIT CODE                     : \nLOG432304 \n \nUNIT DESCRIPTOR        : \nThis unit involves the skills and knowledge required to issue \nstocks/goods in accordance with workplace requirements. It \nincludes analyzing order to identify requirements, following \nworkplace order picking processes to prepare goods for \nissuance/dispatch, \nand \nissuing \nstocks/goods \nfollowing \nworkplace procedures and schedules. \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Analyze order \nto identify \nrequirements \n1.1 Order request and \nconsignment note \ndocumentation is \ninterpreted \n \n1.2 Required schedules \nfor issuance are \nidentified  \n \n1.3 Products on order \nare identified \n \n1.4 Appropriate \nmaterial handling \nequipment is \nselected within \nrequired OS&H \nregulations and \ntimeframe for the \nissuance \n \n Means of interpreting \norder request and \nconsignment note \ndocumentation   \n \n Manner of identifying \nrequired schedules \nfor issuance   \n \n Procedure of \nidentifying product(s) \non order  \n \n Ways of selecting \nappropriate materials \nhandling equipment \nwithin required OS&H \nregulations and \ntimeframe for the \nissuance \n \n Regulations relevant \nto dispatch \noperations, including \nrelevant bond, \nquarantine, or other \nlegal requirements  \n Relevant OS&H and \nenvironmental \nprotection procedures \nand guidelines \n Workplace \nprocedures and \npolicies for issuing \noperations\n Interpreting order \nrequest and \nconsignment note \ndocumentation  \n \n Identifying \nproduct(s) on order \nand required \nschedules for \nissuance  \n \n Communicating \neffectively with \nothers when \norganizing issuance \noperations  \n \n Reading and \ninterpreting \ninstructions, \nprocedures and \nlabels relevant to \nthe organizing of \nissuance operations \n \n Estimate the size, \nshape and special \nrequirements of \ngoods and loads\n\n--- PDF PAGE 82 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 78 \n2. Follow \nworkplace \norder picking \nprocesses to \nprepare goods \nfor issuance \n2.1Goods for issuance \nare selected and  \nchecked against \nproduct knowledge, \nlabels and other \nidentification \nmethods \n \n2.2Products are sorted, \nassembled and \nconsolidated \n \n2.3Orders are secured \nand placed in \nstorage zones, in \naccordance with \nschedule \n \n2.4Order is checked \nagainst dispatch \nschedule and order \nform \n Technique of \nselecting and  \nchecking goods for \nissuance against \nproduct knowledge, \nlabels and other \nidentification methods \n \n Manner of sorting, \nassembling and \nconsolidating \nproducts  \n \n Scheme of securing \nand placing orders in \nstorage zones in \naccordance with \nschedule \n \n System of checking \norder against \ndispatch schedule \nand order form \n \n Regulations relevant \nto issuance \noperations, including \nrelevant bond, \nquarantine, or other \nlegal requirements  \n \n Relevant OS&H and \nenvironmental \nprotection procedures \nand guidelines \n Workplace \nprocedures and \npolicies for issuing \noperations \n Selecting and  \nchecking goods for \nissuance against \nproduct knowledge, \nlabels and other \nidentification \nmethods  \n \n Sorting, assembling \nand consolidating \nproducts  \n \n Securing and \nplacing orders in \nstorage zones in \naccordance with \nschedule \n \n Checking order \nagainst dispatch \nschedule and order \nform \n \n Reading and \ninterpreting \ninstructions, \nprocedures and \nlabels relevant to \nthe organizing of \nissuance operations \n \n \n3. Issue \nstocks/goods  \n3.1 Workplace records \nare completed, and \nlabels and \nappropriate \nissuance \ndocumentation are  \nattached \n3.2 Load labels and \ndocumentation are \nchecked and \nloading is organized \nin accordance with \n Ways of completing, \nworkplace records \nand labels and \nattaching appropriate \nissuance \ndocumentation  \n \n Procedure of \nchecking load labels \nand documentation \nand organizing \nloading in accordance \n Completing \nworkplace records \nand labels and \nattaching \nappropriate \nissuance \ndocumentation \n Checking load \nlabels and \ndocumentation, and \norganizing loading in \naccordance with\n\n--- PDF PAGE 83 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 79 \nworkplace \nprocedures  \n \n3.3 Final check of load \nlabels and \ndocumentation is \ncompleted in \naccordance with \nrequirements  \n \n3.4 Transportation \nrequirements are \ndescribed to delivery \npersonnel where \nappropriate \n \nwith workplace \nprocedures  \n \n Means of final \nchecking of load \nlabels and completing \ndocumentation in \naccordance with \nrequirements  \n \n Manner of describing \ntransportation \nrequirements to \ndelivery personnel \nwhere appropriate \n \n Relevant OS&H and \nenvironmental \nprotection procedures \nand guidelines \n \n Problems that may \noccur when issuing \ngoods and \nappropriate action \nthat can be taken to \nresolve the problems  \n \n Documentation and \nrecord requirements \nfor issuance \noperations \n \n Equipment used \nduring issuance \noperations and the \nprecautions and \nprocedures that \nshould be followed in \nits use \n \n \n Housekeeping \nstandards procedures \nrequired in the \nworkplace \nworkplace \nprocedures \n \n Final checking of \nload labels and \ncompleting \ndocumentation in \naccordance with \nrequirements  \n \n Describing \ntransportation \nrequirements to \ndelivery personnel \nwhere appropriate \n \n Completing \ndocumentation \nrelated to the \norganizing of \nissuance operations \n \n Working \ncollaboratively with \nothers when \norganizing issuance \noperations \n \n \n \n \n \n Selecting and using \nrelevant equipment \nand communications \ntechnology when \norganizing issuance \noperations \n \n \n \n \n Selecting and using \nrequired personal \nprotective \nequipment \nconforming to \nindustry and OS&H \nstandards\n\n--- PDF PAGE 84 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 80 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Products \nMay include but not limited to: \n1.1 \nsmall parts  \n1.2 \nperishable goods \n1.3 \noverseas export  \n1.4 \ndangerous goods  \n1.5 \nrefrigerated products \n1.6 \ntemperature controlled stock \n1.7\nfragile goods\n2. Material handling equipment \nMay include: \n2.1 \nTrolley \n2.2 \nCarts \n2.3 \nLifters \n2.4 \nChain blocks \n2.5\nForklifts\n3. Storage zones \nMay include but not limited to: \n3.1 \nBin/binning systems \n3.2 \nRack refrigeration/freezers/cold rooms  \n3.3 \nMarked floor space  \n3.4 \nContainers  \n3.5 \nRacks and racking systems  \n3.6 \nBlock/stacks  \n3.7\nPallets\n4. Workplace procedures \nMay include: \n4.1 \nEstablished security procedures \n4.2 \nStandard operating procedures  \n4.3 \nCompany procedures \n4.4 \nEnterprise procedures \n4.5\nOrganizational procedures \n5. Documentation \nMay include: \n5.1 \nGoods identification numbers and codes  \n5.2 \nManifests, picking slips, merchandise transfers, \nstock requisitions and bar codes \n5.3 \nManufacturer’s specifications for \nequipment/tools \n5.4 \nSupplier and/or client instructions \n5.5 \nDangerous goods declarations and material \nsafety data sheets (where applicable) \n5.6 \nCodes of practice including the national \nstandards for manual handling and the industry \nsafety code \n5.7 \nAward, enterprise bargaining agreement, other \nindustrial arrangements \n5.8 \nStandards and certification requirements \n5.9 \nQuality assurance procedures \n5.10\nEmergency procedures\n\n--- PDF PAGE 85 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 81 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 interpreted Order request and consignment note documentation  \n \n1.2 Identified products on order  \n \n1.3 Selected and  checked goods for issuance against product \nknowledge, labels, and other identification methods \n \n1.4 Sorted, assembled, and consolidated products  \n \n1.5 Secured and placed orders in storage zones in accordance with \nschedule \n \n1.6 Checked load labels and documentation and organized loading in \naccordance with workplace procedures \n \n1.7 Completed workplace records, and attached labels and \nappropriate issuance documentation  \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1 Written test \n3.2 Direct observation and oral questioning \n3.3 Demonstration with questioning \n3.4 Interview \n4. Context of \nAssessment \n \n \n \n4.1 Competency may be assessed individually in the actual \nworkplace or through an accredited assessment institution and \ngiven by a TESDA qualified assessor \n4.2 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
