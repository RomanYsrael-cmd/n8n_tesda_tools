\n\n• Estimate the size,\nshape and special\nrequirements of\ngoods and loads\n\n--- PDF PAGE 87 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 83\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Pack/wrap\ngoods/\nproducts\n\n2.1 Packed and\nwrapped goods/\nproducts are in\naccordance to\npackaging\nspecifications and\norder packaging\nrequirements\n\n2.2 Completed packed\ngoods are stacked\nto minimize damage\nfrom within and\noutside\n\n2.3 Packed and\nwrapped\ngoods/products are\nin accordance with\nOH&S requirements\n• Method of packing\nand wrapping of\ngoods/\nproducts\n\n• Ways of stacking\npacked goods to\nminimize damage\nfrom within and\noutside\n\n• OH&S requirements\nin Packing and\nwrapping of\ngoods/products\n\n• National and\ninternational codes\nand regulations\nrelevant to the\npackaging of goods\nincluding Dangerous\nGoods Code\n\n• Workplace\nprocedures and\npolicies for the\npackaging of goods\n\n• Problems that may\noccur when\npackaging goods and\nappropriate action\nthat can be taken to\nresolve the problems\n• Packing and\nwrapping of goods/\nproducts\n\n• Stacking completed\npacked goods to\nminimize damage\nfrom within and\noutside\n\n• Reporting and/or\nrectifying any\nidentified problems,\nfaults or\nmalfunctions that\nmay occur when\npackaging goods\n\n• Selecting and using\nrequired personal\nprotective\nequipment\nconforming to\nindustry and OS&H\nstandards\n\n• Reporting and/or\nrectifying any\nidentified problems,\nfaults or\nmalfunctions that\nmay occur when\npackaging good\n\n3. Label packed\ngoods/\nproducts\n\n3.1 Workplace labeling\nstandards are\nidentified\n\n3.2 Appropriate goods\nhandling, labeling\nand other\nidentification\nsymbols are utilized\n\n• Means of identifying\nworkplace labeling\nstandards\n\n• Method of utilizing\nappropriate goods\nhandling, labeling and\nother identification\ns