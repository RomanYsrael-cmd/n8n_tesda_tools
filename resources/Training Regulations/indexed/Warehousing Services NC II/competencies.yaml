        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly and\naccording to the task requirement\n1.2. Identified and explain the functions of both hardware and\nsoftware used, their general features and capabilities\n1.3. Produced accurate and complete data in accordance with the\nrequirements\n1.4. Used appropriate devices and procedures to transfer files/data\naccurately\n1.5. Maintained computer system\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by a TESDA qualified assessor\n4.2 Competency assessment must be undertaken in accordance with\nthe endorsed TESDA assessment guidelines\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 60\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE STOCKS/GOODS\n\nUNIT CODE :\nLOG432201\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to receive\nstocks/goods in accordance with regulatory and workplace\nrequirements. It includes identifying workplace procedures and\ndocumentation requirements for the receipt of stocks/goods;\nchecking\nand\ninspecting\nstocks/goods\non\narrival\nand\ncompleting\nworkplace\ndocumentation;\nand\nunloading,\nunpacking and storing stock/goods.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nworkplace\nprocedures and\ndocumentation\nrequirements\nfor the receipt of\nstocks/goods\n\n1.1 Workplace\nprocedures for\nreceipt of\nstocks/goods are\nidentified\n\n1.2 Purpose of\ndocuments\nassociated with the\nreceived\nstocks/goods is\ninterpreted\n\n1.3 Workplace\ndocumentation\nrequirements for the\nreceipt of\nstocks/goods and\nreporting of damage\nare identified\n\n• Procedures for\nreceipt of\nstocks/goods in the\nworkplace\n\n• Ways of identifying\nworkplace\ndocumentation\nrequirements for the\nreceipt of\nstocks/goods and\nreporting of damage\n\n• National and\ninternational codes\nand regulations\nrelevant to the\nreceiving of\nstocks/goods and\nrelevant bond,\nquarantine or other\nlegislative\nrequirements\n\n• Workplace\nprocedures and\npolicies for the\nreceiving of\nstocks/goods\n\n• Identifying\nworkplace\nprocedures for\nreceipt of\nstocks/goods\n\n• Performing\nworkplace\ndocumentation\nrequirements for\nthe receipt of\nstocks goods and\nreporting of\ndamage\n\n• Reading and\ninterpreting\ninstructions,\nprocedures,\ninformation, labels\nand signs relevant\nto receiving\nstocks/goods\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 61\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Problems that may\noccur when\nreceiving\nstocks/goods and\nappropriate action\nthat can be taken to\nresolve the\nproblems\n\n• Documentation\nrequirements for the\nreceiving of\nstocks/goods\n\n• Promptly reporting\nand/or rectifying\nany identified\nproblems when\nreceiving\nstocks/goods in\naccordance with\nregulatory\nrequirements and\nworkplace\nprocedures\n• Working\nsystematically with\nrequired attention\nto detail without\ninjury to self or\nothers, or damage\nto stocks/goods or\nequipment\n\n• Selecting and\nusing relevant\nstocks/load\nhandling\nequipment when\nreceiving goods\n\n• Selecting and\nusing required\npersonal protective\nequipment\nconforming to\nindustry and\nOS&H standards\n\n• Estimating the\nsize, shape and\nspecial\nrequirements of\nstocks/goods and\nloads\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 62\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2 Check and\ninspect\nstocks/goods on\narrival and\ncomplete\nworkplace\ndocumentation\n\n2.1 Stocks/goods are\nproperly\nchecked/inspected\nprior to receiving\nbased on standard\noperating\nprocedures.\n2.2 Discrepancies\nand/or damaged\nstocks/goods are\nchecked and\nreported\n\n2.3 Non-conforming\nstocks/goods are\nappropriately\ndocumented and\ndispatched or stored\nin accordance with\ncompany\nprocedures\n• Methods and\nprocedures for\nchecking of\nstocks/goods in\ncomparison with\norders or manifests\n\n• Steps in reporting\ndiscrepancies\nand/or damaged of\nstocks/ goods\n\n• Procedure for\ndocumenting and\ndispatching or\nstoring a non-\nconforming\nstocks/goods\n\n• Documentation\nrequirements for the\nreceiving of goods\n• Identifying and\nfollowing\nprocedures for\nchecking of\nstocks/goods\n\n• Documenting and\ndispatching or\nstoring Non-\nconforming\nstocks/goods\n\n• Communicating\neffectively with\nothers when\nreceiving goods\n\n• Read and interpret\ninstructions,\nprocedures,\ninformation, labels\nand signs relevant\nto receiving goods\n\n2.4 Appropriate manual\nhandling techniques\nand equipment are\nidentified\n\n2.5 Safe work\nprocedures are used\nwhen unloading,\nunpacking and\nstoring stocks/goods\n\n2.6 Assistance from\nothers is sought\nwhen required to\nmaintain safe and\neffective work\n\n• Safe working\nprocedures when\nunloading,\nunpacking and\nstoring stock\n\n• Methods of\nunloading and\nunpacking\nstocks/goods in\naccordance with\nworkplace\nprocedures\n\n• Relevant OS&H and\nenvironmental\nprotection\nprocedures and\nguidelines\n\n• Identifying and\nperforming\nappropriate\nmanual handling\ntechniques\n\n• Using safe working\nprocedures when\nunloading,\nunpacking and\nstoring\nstocks/goods\n\n• Seeking\nassistance from\nothers to maintain\nsafe and effective\nwork\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 63\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Specifications and\nstandards for the\nchecking and\ninspection of\nreceived goods\n\n• Housekeeping\nstandards\nprocedures required\nin the workplace\n• Reading and\ninterpreting\ninstructions,\nprocedures,\ninformation, labels\nand signs relevant\nto unloading and\nunpacking of\nstocks/goods\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Received stocks/goods\nReceived goods may include special handling and\nstoring requirements, like:\n1.1 Temperature controlled goods\n1.2 Dangerous goods\n2. Discrepancies\nMay include:\n2.1 Damaged stocks\n2.2 Damaged pallets or packaging\n2.3 Wrong stocks\n2.4 Error in paperwork\n2.5 Poorly stacked stocks\n2.6\nIncorrect quantity\n3. Others\nMay include:\n3.1 Employees\n3.2 Supervisors\n3.3 Suppliers\n3.4 Customers and clients\n3.5 Drivers\n3.6 Agents\n3.7 Relevant authorities and institutions\n3.8 Management\n3.9 Union representatives\n3.10 Industrial relations\n3.11 OH&S specialists\n3.12 Maintenance and technical staff\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 65\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified workplace procedures for receipt of stocks/goods\n\n1.2 Identified workplace documentation requirements for the receipt\nof stocks/goods and reporting of damage\n1.3 Followed work procedure in receiving stocks/goods\n\n1.4 