        "source_title": "APPLY WAREHOUSING OPERATIONS AND WORKPLACE PROCEDURES",
        "source_text": "--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 21 \nCOMMON COMPETENCIES \n \n \nUNIT OF COMPETENCY: \nAPPLY WAREHOUSING OPERATIONS AND WORKPLACE \nPROCEDURES \n \nUNIT CODE                     : \nLOG432201 \n \nUNIT DESCRIPTOR        : \nThis unit involves the skills and knowledge required to apply \nwarehousing operations and workplace procedures. It includes \nidentifying major areas of the workplace in terms of workload, \nethical practices and personal daily routine. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify major \nareas of the \nworkplace \n \n1.1 The layout of the \nworkplace, the flow of \nmaterials and \ngoods/stocks (where \nrelevant) and the \nworkplace \nprocedures in each \nwork area are \nidentified \n \n1.2 Organizational \nstructure of the \nworkplace and the \nrelationship of \nstructure to each \noccupation and \nclassification \ngrouping is outlined \n \n1.3 Individual \nresponsibilities under \nindustrial agreements \nare identified and \nacted on in the \nconduct of assigned \nduties \n \n1.4 Workplace hazards \nare identified and \nrelated hazard \nminimization \nprocedures followed \n \n Workplace \nprocedures and \nstandards and \nduty of care \nrequirements \nincluding OH&S \nand \nenvironmental \nprotection \nresponsibilities \n \n Conditions of \nservice including: \nemployer and \nemployee \nobligations, \nemployment \ncontract, OS&H \nand other \nregulations  \n \n Workplace \nstructures and \nthe roles and \nresponsibilities of \nteam/group \nmembers  \n \n Site or workplace \nlayout  \n \n \n Communicating \neffectively with \nothers when \ncompleting \nworkplace \norientation and \ninduction \nprocedures \n \n Reading and \ninterpreting \ninstructions, \nprocedures, \ninformation and \nsigns relevant to \nwork activities \n \n Interpreting and \nfollowing operational \ninstructions and \nprioritize work \n \n Working \ncollaboratively with \nothers when \ncompleting \nworkplace \norientation and \ninduction \nprocedures\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 22 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.5 Relevant personal \nprotective \nequipment (PPE) are \nidentified and \ncorrectly used in \naccordance with \nregulations and \nworkplace \nrequirements \n \n1.6 Workplace \nemergency \nprocedures are \nidentified and \nfollowed in real and \nsimulated emergency \nsituation \n Emergency \nprocedures  \n \n Workplace \nhazards and \nrelated hazard \nminimization \nprocedures \n \n Personal \nprotective \nequipment and \ninstructions of its \nuse  \n \n \n \n Applying \nprecautions and \nrequired action to \nminimize, control or \neliminate hazards \nthat may exist \nduring work \nactivities \n \n Working \nsystematically with \nrequired attention to \ndetail without injury \nto self or others, or \ndamage to goods or \nequipment \n \n Identifying and \ncorrectly using \nequipment, \nprocesses and \nprocedures \n \n Selecting and using \nrequired personal \nprotective \nequipment \nconforming to \nindustry and OS&H \nstandards\n2. Organize and \naccept \nresponsibility for \nassigned \nworkload \n \n \n \n2.1 Priorities, schedules \nand deadlines are \nestablished in \nconsultation with \nconcerned parties  \n \n2.2 Work activities are \nplanned and progress \nof work is \ncommunicated to \nothers whose \npersonal work plans \nand timelines may be \naffected \n \n \n Ways of \nestablishing \npriorities and \ndeadlines  \n \n Work planning \nand method of \ncommunicating \nwork progress to \nothers \n \n  Enterprise work \nguidelines, \