        "source_text": "TRS311204\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to follow\nsecurity procedures in the warehousing and logistics industries.\nIt includes checking and maintaining the security of any goods\nand cargo, identifying security threats or situations, and\nresponding to a security threat or situation\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Maintain\nsecurity of\nstocks, goods\nand cargo\n\n1.1 Stocks, goods and\ncargo are secured\nwithin specified\nlocations in\naccordance with\nworkplace security\nprocedures and\napplicable security\nregulations\n\n1.2 Seals, tamper proof\npackaging, locks\nand other security\nmeasures on goods\nor cargo are\nchecked and\nmaintained in\naccordance with\nworkplace safety\nand security\nprocedures\n\n1.3 Signs of pillaging,\ntheft and\ninterference are\nrecognized and\nreported in\naccordance with\nworkplace security\nprocedures\n\n1.4 Signs of suspicious\n• Applicable\ntransport security\nlegislation\nincluding relevant\ninternational,\nnational laws,\nregulations, codes\nand/or guidelines\n\n• Relevant\nworkplace security\nprogram and\npolicies and\nprocedures for\nresponding to\nsecurity threats,\nsituations and\nemergencies\n\n• Relevant\nquarantine and\nbond regulations\nand requirements\n\n• Relevant OS&H\nand environmental\nprotection\nprocedures and\nguidelines\n\n•\nCommon security\n• Communicating\neffectively with\nconcerned parties\nwhen following\nsecurity procedures\n\n• Reading and\ninterpreting\ninstructions,\nprocedures,\napplicable\nregulatory\nrequirements,\nlabels, markings, ID\ncards and other\ninformation relevant\nto workplace safety\nand security\n\n• Completing required\ndocumentation and\nreports related to\nsafety and security\nprocedures\n\n• Applying procedures\nfor safety, security\nchecks and\nprecautions as per\nlimits of role and\nresponsibilities\n\n--- PD