onal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution\nand given by a TESDA qualified assessor\n\n4.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 21\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nAPPLY WAREHOUSING OPERATIONS AND WORKPLACE\nPROCEDURES\n\nUNIT CODE :\nLOG432201\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to apply\nwarehousing operations and workplace procedures. It includes\nidentifying major areas of the workplace in terms of workload,\nethical practices and personal daily routine.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify major\nareas of the\nworkplace\n\n1.1 The layout of the\nworkplace, the flow of\nmaterials and\ngoods/stocks (where\nrelevant) and the\nworkplace\nprocedures in each\nwork area are\nidentified\n\n1.2 Organizational\nstructure of the\nworkplace and the\nrelationship of\nstructure to each\noccupation and\nclassification\ngrouping is outlined\n\n1.3 Individual\nresponsibilities under\nindustrial agreements\nare identified and\nacted on in the\nconduct of assigned\nduties\n\n1.4 Workplace hazards\nare identified and\nrelated hazard\nminimization\nprocedures followed\n\n• Workplace\nprocedures and\nstandards and\nduty of care\nrequirements\nincluding OH&S\nand\nenvironmental\nprotection\nresponsibilities\n\n• Conditions of\nservice including:\nemployer and\nemployee\nobligations,\nemployment\ncontract, OS&H\nand other\nregulations\n\n• Workplace\nstructures and\nthe roles and\nr