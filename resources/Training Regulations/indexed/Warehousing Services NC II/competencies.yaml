        "source_text": "--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 71 \nUNIT OF COMPETENCY: PICK GOODS/STOCKS \n \nUNIT CODE                     : \nLOG432303 \nUNIT DESCRIPTOR        : \nThis unit involves the skills and knowledge required to \nparticipate \nin \npicking \nin \naccordance \nwith \nworkplace \nrequirements. It includes checking and securing pick list, \nidentifying bin location, observing FIFO/FEFO, Checking for \ndamages, identifying stock discrepancies, reporting and \ncoordinating stock status \nand completing all required \ndocumentation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Check and \nSecure pick \nlist/order slip \nof goods/stock \nfor picking \n \n1.1 Documents are \ncheck and secures \nbefore picking \nwarehouse \ngoods/stock \n \n1.2 Required resources \nincluding \ndocuments and \nprocedures \nidentified \n \n1.3 Sequence work role \nis planned in a time \neffective manner \n \n Methods of \nidentifying goods as \nper picking or order \nslipare identified \n \n Quantity of \ngoods/stocks to be \npicked are \ndetermined  \n \n Knowledge in \nterming time and \ndate of delivery  \n \n \n In identifying \ndocument of \ngoods/stocks to be \npicked  \n \n Ability to determine \nstock availability and \nstatus for picking \n \n Capacity to pick \ngoods/stock \naccording to time \nand date \nrequirements \n \n Coordinate and \ncommunicate \ngoods/stock \navailability/status  \n2. Identify \ngoods/stock  \nbin \nlocation \nand \nidentification \n \n \n2.1 Pick goods/stocks \naccordance with \nenterprise policies \nand procedures \n \n2.2 Confirm, verify and \nmatch goods/stocks \nidentification \n \n2.3 Report and \ncoordinate \npick/order slip \ndiscrepancy  \n \n \n Procedures of picking \nor stock taking \naccordance with \nenterprise policies  \n \n Product specification \nand code system \n \n Confirming, verifying \nand matching goods/ \nstock identification \n \n Protocol in \ncommunicating and \ncoordinating \n Undertaking \nstocktaking and \npicking SOPs \n \n Following product \nspecification \n \n Confirming, verifying \nand matching \ngoods/stocks  \n \n Documenting stock \nlevels accurately \nand discrepancy \nReading and\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 72 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \ngoods/stock accuracy \nand discrepancy \n \n Workplace processes \nfor records \nmanagement in \nupdating stock \ninventory reports \n \n \ninterpreting \ninstructions, \nprocedures \nand labels relevant \npicking \ngoods/stocks takes  \n \n Reporting and \ncoordinating \nidentified problems \nthat may arise when \npicking warehouse \ngoods/stock \n \n Selecting and using \nrelevant \ncommunication, \nmedium and tools \noffice necessary \nduring picking \nprocedure \n \n Selecting and \nusingrequired \npersonal protective \nequipment \nconforming to \nindustry and OH&S \nstandards while \npicking warehouse \ngoods/stocks \n3. Observing \nFIFO/FEFO \nwhile \npickingwareho\nuse \ngoods/stocks \n \n3.1 Industry picking \nprocedures and \npolicies are strictly \nfollowed \n \n3.2 Warehouse \ngoods/stocks \nstorage date and \ndispatch are \nchecked and \ndetermined  \n \n3.3 Warehouse \ngoods/stock shelf \nlife are regularly \n Method of determining \nwarehouse \ngoods/stock for \nimmediate dispatch \nand issuance in \naccordance with the \nstorage/shelf life  \n \n Means of checking \nand verifying \nwarehouse \ngoods/stocks shelf life \n \n \n Workplace processes \n Taking necessary \naction to rectify \nnearly expired \nwarehouse \ngoods/stocks \n \n 