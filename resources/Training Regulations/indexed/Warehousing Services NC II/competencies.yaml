        "source_text": "--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 3 \nSECTION 2: COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the units of competency required in \nWAREHOUSING SERVICES NC II.  These units of competency are categorized into basic, \ncommon, core and elective competencies. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY: \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE                     : \n500311105 \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes   required to \ngather, interpret and convey information in response to \nworkplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n1. Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and  \nrelevant \ninformation is \naccessed from \nappropriate \nsources  \n1.2 Effective \nquestioning , \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate \nmedium is used to \ntransfer \ninformation and \nideas \n1.4 Appropriate non- \nverbal \ncommunication is \nused \n1.5 Appropriate lines \nof communication \nwith supervisors \nand colleagues are \nidentified and \nfollowed \n \n Procedure of \ngathering workplace \ninformation \n Techniques in \ngathering \ninformation \n Effective methods of \nconveying \ninformation \n Written \ncommunication \nmethods \n Techniques in \nconveying \ncommunication \n Different modes of \ncommunication  \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n Gathering of \nworkplace \ninformation skills \n Sourcing of \ninformation skills \n Sorting of \ninformation skills \n Obtaining \nworkplace \ninformation skills \n Conveying \nworkplace \ninformation skills \n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 4 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n1.6 Defined workplace \nprocedures for the \nlocation and \nstorage of \ninformation are \nused \n1.7 Personal \ninteraction is \ncarried out clearly \nand concisely\n2. Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings \nare attended on \ntime \n2.2 Own opinions are \nclearly expressed \nand those of \nothers are listened \nto without \ninterruption \n2.3 Meeting inputs are \nconsistent with the \nmeeting purpose \nand established \nprotocols \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner  \n2.5 Questions about \nsimple routine \nworkplace \nprocedures and \nmaters concerning \nworking conditions \nof employment are \nasked and \nresponded to \n2.6 Meetings \noutcomes are \ninterpreted and \nimplemented \n \n \n \n \n \n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Decorum in \nparticipating \nworkplace meetings \nand discussions \n Participating skills \nin workplace \nmeetings and \ndiscussions \n Following simple \nspoken language \n Completing work \nrelated \ndocuments \n Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n Relating to people \nof social range in \nthe workplace \n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 5 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n3. Complete \nrelevant work \nrelated \ndocuments \n3.1 Range of forms \nrelating to \nconditions of \nemployment are \ncompleted \naccurately and \nlegibly \n3.2 Workplace data is \nrecorded on \nstandard \nworkplace forms \nand documents \n3.3 Basic \nmathematical \nprocesses are \nused for routine \ncalculations \n3.4 Errors in recording \ninformation on \nforms/ documents \nare identified and \nproperly acted \nupon \n3.5 Reporting \nrequirements to \nsupervisor are \ncompleted \naccording to \norganizational \nguidelines\n Methods of \nmaking/completing \nwork related \ndocuments \n Company standards \nand procedures in \nmaking work related \ndocuments \n Effective \ncommunication \n Different modes of \ncommunication  \n Written \ncommunication \n Organizational \npolicies \n Communication \nprocedures and \nsystems \n Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n Documenting \nskills  \n Report writing \nskills \n Making/developin\ng work related \ndocuments \n Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n Completing work \nrelated \ndocuments \n Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n Ability to relate to \npeople of social \nrange in the \nworkplace\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 6 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6. \nFace to face communication \n3. Storage \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Forms \n4.1. \nPersonnel forms \n4.2. \ntelephone message forms \n4.3. \nsafety reports \n5. Protocols \n5.1. \nObserving meeting \n5.2. \nCompliance with meeting decisions \n5.3. \nObeying meeting instructions \n6. Workplace interactions \n6.1. \nFace to face \n6.2. \nTelephone \n6.3. \nElectronic and two way radio \n6.4. \nWritten including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs \nand diagrams\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 7 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nPrepared written communication following standard \nformat  of the organization \n1.2. \nAccessed information using communication equipment \n1.3. \nMade use of relevant terms as an aid to transfer \ninformation effectively \n1.4. \nConveyed information effectively adopting the formal or \ninformal communication\n2. Resource Implications \n2.1. \nFax machine \n2.2. \nTelephone \n2.3. \nWriting materials \n2.4. \nInternet \n3. Methods of \nAssessment \n3.1. \nDirect Observation \n3.2. \nOral interview and written test \n4. Context of Assessment \n4.1. \nCompetency may be assessed individually in the actual \nworkplace or through an accredited assessment \ninstitution and given by a TESDA qualified assessor \n4.2. \nCompetency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n",
