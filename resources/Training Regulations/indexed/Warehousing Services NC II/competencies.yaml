D SKILLS\n2.3 Practices along\neconomic use and\nmaintenance of\nequipment and\nfacilities are\nfollowed as per\nestablished\nprocedures\n• Ways and means\nof practicing\neconomic use and\nmaintenance of\nequipment and\nfacilities\n\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and\ncareer\nopportunities are\nidentified and\navailed of based\non job requirements\n3.2 Recognitions are\nsought/received\nand demonstrated\nas proof of career\nadvancement\n3.3 Licenses and/or\ncertifications\nrelevant to job and\ncareer are obtained\nand renewed\n• Ways of\nidentifying\ntrainings and\ncareer\nopportunities\n• Techniques of\nseeking and\nreceiving\nrecognitions\n• Procedures of\nobtaining\nlicenses and/or\ncertifications\nrelevant to the\njob\n\n• Identifying\ntrainings and\ncareer\nopportunities\n• Seeking\nrecognitions are\nsought/received\nand demonstrated\nas proof of career\nadvancement\n• Obtaining and\nrenewing\nLicenses and/or\ncertifications\nrelevant to job\nand career\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 14\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 15\n EVIDE