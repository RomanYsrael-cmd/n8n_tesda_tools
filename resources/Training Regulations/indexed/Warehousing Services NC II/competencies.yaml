        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified the layout of the workplace, the flow of materials and\ngoods (where relevant) and the workplace procedures in each\nwork area\n1.2 Identified and followed workplace emergency procedures in real\nand simulated emergency situation\n1.3 Planned work activities and communicated progress of work to\nothers whose personal work plans and timelines may be affected\n1.4 Completed work to the standard expected in the workplace and\nin accordance with any guidelines, directions or instructions/\ninformation\n1.5 Identified and followed workplace procedures, regulations and\nlegislation appropriate to the position\n1.6 Applied appropriate codes of acceptable and ethical work\npractices\n1.7 Planned daily routine to take into account rosters, industrial\nagreements and workplace procedures\n1.8 Applied appropriate codes of acceptable and ethical work\npractices\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n\n3. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n3.3 Interview\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 27\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by a TESDA qualified assessor\n\n4.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 28\nUNIT OF COMPETENCY:\nPERFORM INDUSTRY CALCULATION IN WAREHOUSING\nOPERATIONS\n\nUNIT CODE :"
