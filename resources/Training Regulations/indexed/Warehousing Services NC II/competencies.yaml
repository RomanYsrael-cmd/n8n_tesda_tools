        "source_text": "--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 66 \nUNIT OF COMPETENCY: STORE STOCKS/GOODS \n \nUNIT CODE                     : \nLOG432302 \n \nUNIT DESCRIPTOR        : \nThis unit involves the skills and knowledge required to store \nstocks/goods in accordance with workplace requirements. It \nincludes identifying and categorizing products, matching \nproducts to locations based on specified criteria, identifying \nappropriate transfer and handling requirements   completing \nstock storage.\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify and \ncategorize \nproducts \n \n1.1 Products are \nidentified and \ncategorized in terms \nof specified criteria \nand in accordance \nwith workplace \nprocedures \n1.2 Required resources \nincluding documents \nand procedures are \nidentified and \ncategorized \n1.3 Sequence work role \nis planned in a time \neffective manner \n Product \nidentification \nstrategies \n \n Information on \nvarious categories \nor groups of \nproducts including \ntheir key \ncharacteristics and \nhazards and the \nspecial handling, \nstacking and \nstorage \nrequirements for \neach \n \n Sources of product \ninformation \n \n Identifying and \ncategorizing \nproducts in terms \nof specified criteria \nin accordance with \nworkplace \nprocedures \n \n Accessing, reading \nand interpreting \nproduct \ninformation, \npolicies and \nregulatory \nrequirements \nrelevant to \nworkplace \noperations \n \n Using information \non products/stock \nto determine, plan \nand organize \nprocesses used for \nstorage, goods \nmovement and \ndispatch \nprocesses\n2. Match products \nto locations \nbased on \nspecified criteria\n \n2.1 Locations for \nproducts are \ndetermined based \non specified criteria \n \n \n \n \n Method of \ndetermining \nlocations for \nproducts based on \nspecified criteria \n \n \n Determining \nlocations for \nproducts based on \nspecified criteria\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 67 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.2 Labels, inventory \nsystems and other \ninformation \nsources are used to \nassist in the \nidentification of \nproducts, handling \nand storage \nrequirements \n Strategies of \nidentifying products, \nhandling and \nstorage \nrequirements  \n \n Types of equipment \nand storage areas \nappropriate for \ndifferent types of \ngoods  \n Using labels, \ninventory systems \nand other \ninformation \nsources  to assist \nin the identification \nof products, \nhandling and \nstorage \nrequirements \n \n \n3. Identify \nappropriate \ntransfer and \nhandling \nrequirements \n \n3.1 Resources used to \ntransfer different \nproducts through \nthe storage zones \nare identified and \nevaluated \n \n3.2 Work in receiving \nand dispatch areas \nis supported by \nidentification and \nreporting of \nvariances  \n \n \n3.3 Relevant \ndocumentation is \ncompleted in \naccordance with \nworkplace \nprocedures \n Ways of identifying \nand evaluating \nresources used to \ntransfer different \nproducts through \nthe storage zones  \n \n Means of \nidentification and \nreporting of \nvariances \n \n Strategies of \ncompleting \ndocumentation in \naccordance with \nworkplace \nprocedures \n \n Requirements for \nworkplace \ndocumentation, \ninventory systems \nand records \n \n Documentation \nrequirements \nincluding reports \nand records \nconcerning \ndamaged or \ncontaminated goods \n \n Identifying and \nevaluating \nresources used to \ntransfer different \nproducts  \n \n Identifying and \nreporting of work in \nreceiving and \ndispatch areas  \n \n Completing \nrelevant \ndocumentation in \naccordance with \nworkplace \nprocedures\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n4. Put-away/ store \nstocks/goods  \n4.1 Products are sorted, \nassembled, and \nconsolidated in the \nappropriate storage \nareas \n \n4.2 Storing is checked \nin accordance with \ncompany \nprocedures \n \n4.3 Documentation and \nrecording are \ncompleted in \naccordance with \nworkplace \nprocedures \n \n Methods of sorting, \nassembling and \nconsolidating \nproducts in the \nappropriate storage \nareas \n \n Methods of checking \nStorage work in \naccordance with \ncompany \nprocedures \n \n Means of \ncompleting \ndocumentation and \nrecording in \naccordance with \nworkplace \nprocedures \n \n Relevant OH&S and \nenvironmental \nprotection \nprocedures and \nguide lines \n \n Re-ordering \nprocedures and just-\nin-time planning \nprinciples \n \n Requirements for \nworkplace \ndocumentation, \ninventory systems \nand records \n Sorting, \nassembling and \nconsolidating of \nproducts in the \nappropriate \nstorage areas \n \n Checking storage  \nin accordance with \ncompany \nprocedures \n \n Completing \ndocumentation and \nrecording in \naccordance with \nworkplace \nprocedures \n \n Completing \ndocumentation \nrelated to the \norganization of \nwork activities \n \n Reporting and/or \nrectifying any \nidentified problems \nthat may arise \nwhen performing \nstorage work\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 69 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Products \nMay include but not limited to: \n1.1 small parts  \n1.2 perishable goods \n1.3 overseas export  \n1.4 dangerous goods  \n1.5 refrigerated products \n1.6 temperature controlled stock \n1.7\nfragile goods\n2. Storage zones \nMay include but not limited to: \n2.1 Bin/binning systems \n2.2 Rack refrigeration/freezers/cold rooms  \n2.3 Marked floor space  \n2.4 Containers  \n2.5 Racks and racking systems  \n2.6 Block/stacks  \n2.7\nPallets\n3. Workplace procedures \nMay include: \n3.1   Established security procedures \n3.2   Standard operating procedures  \n3.3   Company procedures \n3.4   Enterprise procedures \n3.5   Organizational procedures \n4. Information sources \nMay include: \n4.1 Goods identification numbers and codes  \n4.2 Manifests, picking slips, merchandise transfers, \nstock requisitions and bar codes, and container \nidentification/serial number  \n4.3 Codes of practice and regulations relevant to \nworkplace operations  \n4.4 National and international regulations and codes \nof practice for the handling, stacking, and \ntransport of dangerous goods and hazardous \nsubstances  \n4.5 Operations manuals, job specifications, and \ninduction documentation  \n4.6 Manufacturer’s specifications for equipment  \n4.7 Workplace procedures and policies \n4.8 Supplier and/or client instructions  \n4.9 Dangerous goods declarations and material safety \ndata sheets (where applicable)  \n4.10 Award, enterprise bargaining agreement, other \nindustrial arrangements \n4.11 Relevant Philippine standards and certification \nrequirements \n4.12 Quality assurance procedures  \n4.13 Emergency procedures\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 70 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 Identified and categorized products in terms of specified criteria \nand in accordance with workplace procedures \n1.2 Determined locations for products based on specified criteria \n1.3 Completed relevant documentation in accordance with workplace \nprocedures \n1.4 Identified and evaluated resources used to transfer different \nproducts  \n1.5 Supported work in receiving and dispatch areas by identification \nand reporting of variances  \n1.6 Sorted, assembled, and consolidated products in the appropriate \nstorage areas \n1.7 Documentation and recording are completed in accordance with \nworkplace procedures \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1 Written test \n3.2 Direct observation and oral questioning \n3.3 Demonstration with questioning \n3.4 Interview \n4. Context of \nAssessment \n \n \n \n4.1 Competency may be assessed individually in the actual \nworkplace or through an accredited assessment institution and \ngiven by a TESDA qualified assessor \n4.2 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
