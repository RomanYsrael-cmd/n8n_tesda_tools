k \ndiscrepancies, \nreport \nand \ncoordinate \nstock \n5.1 Warehouse process \nin identifying  order \nslip/pick list against \ngoods/stock actual \nstatus/availability  \n5.2 Procedure and \n \nProcedure in \nidentifying \ndiscrepancy based \non the order slip/pick \nlist against \ngoods/stocks status/ \n Identifying \ndiscrepancy based \non the order \nslip/pick list against \ngoods/stock \nstatus/availability\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 74 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nstatus/availabi\nlity  \n \nmedium in reporting \nand coordinating \ngoods/stock \ncount/status report \nwas observed  \n \n5.3 Industry policy in \nrectifying \ndiscrepancy in the \norder slip/pick list \nagainst actual \ngoods/stocks status \n \n5.4 Documentation \nrequirements in \nreporting \ngoods/stocks \ndiscrepancy is \nestablished \navailability \n \n \nProcedure and \nmedium in reporting \nand coordinating \ngoods/stock status/ \navailability report \n \n \nIndustry policy in \nrectifying \ndiscrepancy in the \norder slip/pick list \nbased on the \ngoods/stocks actual \navailability  \n \n \nPolicy and \nprocedures in the \ndocumentation \nrequirements in \nreporting \ndiscrepancy against \nthe goods/stocks \nstatus/availability  \n \n Execution of report \nprocedure and \nproper use of \ncommunication tools \nand regarding \ngoods/stocks \nstatus/availability \nreport \n \n Ability to rectify \ndiscrepancy in the \norder slip/pick list \nagainst \ngoods/stocks \nstatus/availability \n \n Observing policy \nand procedures in \nthe documentation \nrequirements in \nreporting \ndiscrepancy against \nthe goods/stocks \nstatus/availability\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 75 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Picking systems \nMay include: \n1.1Automated (SAP,WMS, Oracle, Exceed) \n1.2Manual (bin card/index card, inventory tag, MS \nexcel) \n1.3Paper based  \n1.4Computerized (RFID bar code scanning data logger)\n2. Workplace picking \ndocumentation \nMay include: \n2.1Count Sheet, Tally Sheet \n2.2Inventory Count Tags \n2.3Bin Cards \n2.4 Goods identification numbers and codes \n2.5Manifests, picking slips, merchandise transfers, \nstock requisitions and bar codes  \n2.6Operations manuals, job specifications and induction \ndocumentation \n2.7Standard Operation Procedures \n2.8Manufacturers specifications for equipment  \n2.9Workplace procedures and policies \n2.10Supplier and/or client instructions \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \n \n \n \n \nAssessment  requires evidence that the candidate: \n1.1 Identified goods to be counted and appropriate picking systems  \n1.2 Identified required resources including equipment and record \nkeeping in picking goods/stock  \n1.3 Undertaking goods/stocks picking and inventory updates in \naccordance with enterprise policies and procedures \n1.4 Interpreting and confirming goods/stocks identity and location \n1.5 Checking and verifying goods/stocks status and avilability \n1.6 Reconciling picking discrepancy against goods/stock status and \navailability  \n1.7 Completing workplace documentation requirements \n \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08 \nTR Warehousing Services NC II (New)                                    Promulgated Dec. 16, 2015 \nPage 76 \n3. Methods of \nAssessment \n \nCompetency in this unit MUST be assessed through: \n3.1 Written test \n3.2 Direct observation and oral questioning \n4. Context of \nAssessment \n \n \n \n4.1 Competency may be assessed individually in the actual \nworkplace or through an accredited assessment institution and \ngiven by a TESDA qualified assessor \n4.2 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
