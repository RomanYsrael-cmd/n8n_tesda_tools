umentation;\nand\nunloading,\nunpacking and storing stock/goods.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nworkplace\nprocedures and\ndocumentation\nrequirements\nfor the receipt of\nstocks/goods\n\n1.1 Workplace\nprocedures for\nreceipt of\nstocks/goods are\nidentified\n\n1.2 Purpose of\ndocuments\nassociated with the\nreceived\nstocks/goods is\ninterpreted\n\n1.3 Workplace\ndocumentation\nrequirements for the\nreceipt of\nstocks/goods and\nreporting of damage\nare identified\n\n• Procedures for\nreceipt of\nstocks/goods in the\nworkplace\n\n• Ways of identifying\nworkplace\ndocumentation\nrequirements for the\nreceipt of\nstocks/goods and\nreporting of damage\n\n• National and\ninternational codes\nand regulations\nrelevant to the\nreceiving of\nstocks/goods and\nrelevant bond,\nquarantine or other\nlegislative\nrequirements\n\n• Workplace\nprocedures and\npolicies for the\nreceiving of\nstocks/goods\n\n• Identifying\nworkplace\nprocedures for\nreceipt of\nstocks/goods\n\n• Performing\nworkplace\ndocumentation\nrequirements for\nthe receipt of\nstocks goods and\nreporting of\ndamage\n\n• Reading and\ninterpreting\ninstructions,\nprocedures,\ninformation, labels\nand signs relevant\nto receiving\nstocks/goods\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 61\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Problems that may\noccur when\nreceiving\nstocks/goods and\nappropriate action\nthat can be taken to\nresolve the\nproblems\n\n• Documentation\nrequirements for the\nreceiving of\nstocks/goods\n\n• Promptly reporting\nand/or rectifying\nany identified\nproblems when\nreceiving\nstocks/goods in\naccordance with\nregulatory\nrequirements and\nworkplace\nprocedures\n• Working\nsystematically with\nrequired attention