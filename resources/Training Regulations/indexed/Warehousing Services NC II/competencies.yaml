        "source_text": "LOG432204\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to contribute\nquality procedures within work activities. It includes applying\nquality concepts to work, planning and evaluating improvements\nin work processes and implementing improvements confirmed\nthrough tests and evaluation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Apply quality\nconcepts\n\n1.1 Responsibility is\ntaken for quality of\nown work when\nproviding services or\nproducts to meet\ncustomer needs\n\n1.2 Work is completed\nin accordance with\nworkplace standards\nas defined in\nenterprise policies\nand procedures\n\n1.3 Basic quality\nconcepts are\napplied to work\nactivities\n\n• Ways of meeting\nexternal and internal\ncustomer needs in\nproviding quality\nservices or products\n\n• Means of\ncompleting work\n• Basic quality\nconcepts applied to\nwork activities\n\n• Workplace quality\nassurance and\nimprovement\nprinciples and\nprocedures\n\n• Typical quality-\nrelated problems\nthat may arise in\nwork operations and\nproducts, and\nrelated options for\naction and solutions\n• Providing quality\nwork/services or\nproducts to meet\nexternal and internal\ncustomer needs\n\n• Completing work in\naccordance with\nworkplace standards\nas defined in\nenterprise policies\nand procedure\n• Applying basic\nquality concepts to\nwork activities\n• Reading and\ninterpreting\ninstructions and\ninformation relevant\nto quality\nprocedures and\nstandards\n• Completing\ndocumentation\nrelated to quality\nprocedures and\nstandards\n\n• Working\ncollaboratively with\nothers when\napplying quality\nprocedures and\nstandards\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Test and\nevaluate\nimprovements\n\n2.1 Improvements to\nwork processes are\ntested and\nevaluated\n\n2.2 Evaluation of\nimprovements to\nwork processes are\nchecked for\nimprovement\noutcomes and\ncompliance with\nworkplace\nrequirements\n\n• Methods of testing\nand evaluating\nimprovements to\nwork processes\n• Steps and\nprocedures of\nchecking for\nimprovement\noutcomes and\ncompliance with\nworkplace\nrequirements\n• Typical quality-\nrelated problems\nthat may arise in\nwork operations and\nproducts, and\nrelated options for\naction and solutions\n• Testing\nImprovements to\nwork processes\n• Evaluating\nimprovements to\nwork processes\n• Checking for\nimprovement\noutcomes and\ncompliance with\nworkplace\nrequirements\n• Reporting and/or\nrectifying any\nidentified quality-\nrelated problems in\naccordance with\nworkplace\nprocedure s\n3. Implement\nimprovements\n\n3.1 Improvement\ninitiatives tested\nand confirmed as\nsuccessful are\nimplemented in\naccordance with\nenterprise\nprocedures\n\n3.2 Work is completed\nin accordance with\nworkplace\nprocedure\n• Methods of\nimplementing a\ntested and\nconfirmed\nImprovement\ninitiative\n\n• Ways of completing\nwork in accordance\nwith workplace\nprocedure\n\n• Workplace quality\nassurance and\nimprovement\nprinciples and\nprocedures\n\n• Impact of job on\nenterprise and\nindividual\nperformance\n\n• implementing a\nsuccessful tested\nand confirmed\nImprovement\ninitiative in\naccordance with\nenterprise\nprocedures\n\n• Completing work in\naccordance with\nworkplace\nprocedure\n\n• Completing\ndocumentation\nrelated to quality\nprocedures and\nstandards\n• Reporting and/or\nrectifying any\nidentified quality-\nrelated problems in\naccordance with\nworkplace\nprocedures\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 44\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Customer needs\nCustomer needs may be:\n1.1 External\n1.2 Internal\n2. Workplace procedure\nWorkplace procedures may include:\n2.1 Established security procedures\n2.2 Standard operating procedures\n2.3 Company procedures\n2.4 Enterprise procedures\n2.5 Organizational procedures\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Completed work in accordance with workplace standards as\ndefined in enterprise policies and procedures\n1.2 Applied basic quality concepts to work activities\n1.3 Tested and evaluated improvements to work processes\n1.4 Checked evaluation of improvements for outcomes and\ncompliance with workplace requirements\n1.5 Implemented the tested and confirmed improvement initiatives in\naccordance with enterprise procedures\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n4. Context of\nAssessment\n\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited assessment institution and\ngiven by a TESDA qualified assessor\n\n4.2 Competency assessment must be undertaken in accordance with\nthe endorsed TESDA assessment guidelines\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 45\nUNIT OF COMPETENCY:\nFOLLOW\nSPECIFICATIONS\nAND\nMANUALS\nOF\nINSTRUCTIONS WHEN STORING PRODUCTS\n\nUNIT CODE :"
