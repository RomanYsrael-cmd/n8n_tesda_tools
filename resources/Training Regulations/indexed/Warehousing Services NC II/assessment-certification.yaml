      "number": "4.1",
      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of WAREHOUSING SERVICES NC II, the candidate must demonstrate competence through a project-type assessment covering in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The qualification of WAREHOUSING SERVICES NC II may be attained through - 4.1.2.1 Accumulation of Certificates of Competency (COCs) in the following areas – 4.1.2.2 Receiving stocks/goods and Storing stocks/goods (Warehouse Checker) 4.1.2.3 Picking stocks/goods (Warehouse Picker) 4.1.2.4 Issuing/dispatching stocks/goods (Dispatcher) 4.1.2.5 Packing stocks and goods (Warehouse Packer) 4.1.2.6 Operating and maintaining manual handling equipment (Material Handler) 4.1.3 Assessment shall focus on the units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 The following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of training programs related to warehousing operations/management 4.1.4.2 Experienced workers in warehousing services/industry 4.1.5 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve. 4.1.6 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment. Page 146 4.1.7 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. Page 147"
    }
