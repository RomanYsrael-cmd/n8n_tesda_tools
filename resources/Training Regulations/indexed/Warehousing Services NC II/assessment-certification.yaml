      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 151 --- TR Warehousing Services NC II (New) Promulgated Dec. 16, 2015 Page 147 Warehousing Services Sector Receive Stocks/Goods Pack Goods/Products Store Stocks/Goods Issue/Dispatch Stocks/Goods Operate and Maintain Manual Material Handling Equipment Apply Knowledge in Warehouse Operations Perform Industry Calculation in Warehousing Operations Perform Workplace Security and Safety Contribute to Quality System Provide Effective Customer Service Follow Specifications and Manuals of Instructions Maintain and Use Hand Tools Participate in Workplace Communication Work in a Team Environment Practice Career Professionalism Practice Occupational Health and Safety Procedures Pick stocks/goods Perform Computer Operation --- PDF PAGE 152 --- TR Warehousing Services NC II (New) Promulgated Dec. 16, 2015 Page 148 BOL Bill of Lading- is a document issued by a carrier which details a shipment of merchandise and gives title of that shipment to a specified party. ETA Estimated Time of Arrival- The time expected for the arrival of delivery of goods to the customer. First In, First Out. Goods that are stored first will be released first GSP Good Storage Practice Last In, First Out. Goods/items that are stored last will be released first. MSD Musculoskeletal Disorders. According to the Occupational Safety and Health Administration (OSHA), a musculoskeletal disorder is a disorder of soft tissue, joints, cartilage, blood vessels, or spinal discs. SKU Stock keeping unit, is an identification, usually alphanumeric, of a particular product that allows it to be tracked for inventory purposes. SOP Standard Operating Procedures. A document dictating a set of explicit instructions to successfully accomplish a specific goal. SOPs are intended to be followed without deviation, and provide all the required details and decision branches required to perform a given procedure. Acronym for Task, Individual, Load and Environment. Four specific areas used to assess manual handling activities Axle A straight shaft that is fixed in location and is used to mount rotating wheels or gears Barcode Is an optical machine-readable representation of data relating to the object to which it is attached. It is a small image of lines (bars) and spaces that is affixed to store items identification cards, and etc. to identify a particular product number, person, or location. Bisphenol-A A component in metal can coatings, which protect the food from directly contacting metal surfaces. BPA has been used in food packaging since the 1960s. Cellophane A thin, flexible, transparent cellulose material made from wood pulp and used as a moisture proof wrapping Consignee Is the entity or person who is responsible for the receipt of a shipment. Generally, but not always, the consignee is the same as the receiver or the buyer. Corrugated Cardboard An engineered paper product designed to function as a packaging box that is both versatile and durable. It is the most popular and cost- effective choice for item packaging and storage. Delivery Waiver A permission for claiming goods or merchandise in the absence of the consignee or the rightful person Dolly A low mobile platform that rolls on casters, used for transporting heavy loads Ergonomic Is the scientific discipline concerned with the understanding of interactions among humans and other elements of a system, and the profession that applies theory, principles, data and methods to design in order to optimize human well-being and overall system performance Forklift Is a powered industrial truck (usually engine, hydraulics or electricity) used to lift and move materials in short distances Fulcrum Is the support about which a lever pivots.It may also refer to as a pivot point which a lever turns --- PDF PAGE 153 --- TR Warehousing Services NC II (New) Promulgated Dec. 16, 2015 Page 149 Grid layout In warehouses, it is a floor layout where stocks/goods are arrange in grid having intersecting sections with enough spaces in between Hydraulic Unit The major component of pallet jack/lifter that provides the required lifting force by means of oil pressure Inventory The total amount of goods and/or materials contained in a warehouse, store or factory at any given time. Inventory Reconciliation a process where a company balances its physical inventory with the figures in its accounting books. Lift truck Vehicles used to lift, move, stack, rack, or otherwise manipulate loads. Load Describes the materials being handled by a piece of equipment. Load Leading A condition of pallet truck operation where the forks with the load leading on travel and the steering wheels behind Loading Dock Also called loading bay is an area of a warehouse building where goods vehicles (usually road or rail) are loaded and unloaded. Load Trailing A condition of pallet truck operation with the steering wheels leading on travel and the forks with the load behind Logistics Provider A company that provides management over the flow of goods and materials between points of origin to end-use destination. The provider will often handle shipping, inventory, warehousing, packaging and security functions for shipments. Mast Is the component on a forklift that the forks ride on when they are raised into the air. Comprised of heavy c-channel steel, the forklift mast is often made up of multiple sections, each interlocking within the other to form a type of vertical conveyor as the hydraulic cylinders raise the load. Off-Center Loads Loads that are located out of the center of the pallet. This may lead to tilting and falling of the load during traveling Order Fulfillment Used to describe the act of distribution or the logistics function, however, in the broader sense it refers to the way firms respond to customer orders. Pallet A portable platform designed to allow a forklift or pallet jack to lift, move, and store various loads Pallet Loader A warehousing or manufacturing equipment designed to lift and move load on a pallet Pallet Truck Is a tool used to lift and move pallets are either manually operated or powered by means of electricity and hydraulics Paper Shredder An office machine used to shred documents for the purpose of avoiding highly sensitive information getting into the wrong hands. Physical Inventory Count Window Allows many different methods of creating count lists, verifying and updating inventory counts. Pick List Is a document that is often used to pull particular items in specific quantities from an inventory Polystyrene A synthetic thermoplastic material obtained by polymerizing styrene; used as a white rigid foam for insulating and packing and as a glasslike material in light fittings and water tanks Pre-Operational Checks Visual and physical checks made before operating any pallet jacks/trucks to identify damage, prevent accidents and to ensure the forklift is safe to use Purchase Order A document used to approve, track, and process purchased items Push Rod A part of a hydraulic jack that moves up and down that allows the lifting and lowering of loads in a jack lift or pallet jacks --- PDF PAGE 154 --- TR Warehousing Services NC II (New) Promulgated Dec. 16, 2015 Page 150 Shelf Life Refers to the time a prepared food item will remain fresh, remain healthy to eat, and keep its freshest taste. Short landed A condition where the manifested schedule of delivery does not actually arrive on time. Skid A type of pallet, a metal, wood or plastic platform for holding machinery or equipment. Some pallets have planks across the bottom level, flush with the floor, but a skid has no planks along the full length or width to form a bottom level on the floor. Stacking An orderly pile of stocks/goods, especially one arranged in layers. Stackability The quality of being stackable. Something that can easily be stacked Stock Take Is the physical verification of the quantities and condition of items held in an inventory or warehouse. This may be done to provide an audit of existing stock valuation. It is also the source of stock discrepancy information. Straddle Loaders A pallet lifter where the load rest on a vertical beam/mast and is capable of stacking and picking goods on a higher elevation compared to a pallet jack Stretch Wrap A thin linear low density polyethylene (LLPDE) or low density polyethylene (LPDE) plastic sheet or film that can be tightly wrapped around items to secure them firmly together in place or on a pallet for shipping. T-Bar The part of a pallet jack/truck that connects the jack frame and holds the handle housing the controls. Third-Party Logistics Third-party logistics refers to the outsourcing of logistics functions and other supply chain functions to third-party providers, also called 3PL providers. Threshold Delivery A door to door delivery service Vacuum a space or area entirely devoid of matter particularly air Volatile Formulation Substances formulated to be evaporating rapidly or passes off readily in the form of vapor Walkie A type of pallet jack powered by a motorized battery where the operator walks behind or ahead of the vehicle Walkie-Rider A type of pallet jack powered by a motorized battery where the operator is able to ride over a platform during operation White Glove Delivery A delivery service providing in-home delivery and light assembly of most furniture and related items as well as removal of all packaging materials. Ziplock bag A brand of reusable, re-sealable zipper storage bags and containers that come in different sizes for use with different products. --- PDF PAGE 155 --- TR Warehousing Services NC II (New) Promulgated Dec. 16, 2015 Page 151 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of this Training Regulation. MR. GALVIN A. LAGERA Supply Chain Management Association of the Phils. (SCMAP) 35 East Capitol Drive Brgy. Kapitolyo, Pasig City MR. MARVIN P. ADOLFO Toplis Offshore Training Center 2/F VELCO Centre Oca cor. Delgado Sts. South Harbor, Manila MR. PIERRE CARLO C. CURAY Supply Chain Management Association of the Phils. (SCMAP) 35 East Capitol Drive Brgy. Kapitolyo, Pasig City MR. EMETERIO D. CEDILLO JR. Toplis Offshore Training Center 2/F VELCO Centre Oca cor. Delgado Sts. South Harbor, Manila MR. DARIO O. ARIVE JR. Supply Chain Management Association of the Phils. (SCMAP) 35 East Capitol Drive Brgy. Kapitolyo, Pasig City MR. JOMAR G. GABITO Toplis Offshore Training Center 2/F VELCO Centre Oca cor. Delgado Sts. South Harbor, Manila The PARTICIPANTS in the Validation of this Training Regulation MS. REMELENE M. ALQUERO Inland Logistics Corporation #8 Sampaguita Ave. UPSIV Sucat, Paranaque MS. NERINA B. IRANZO Inland Warehousing and Logistics Div. (IWLD), Corp. 122 East Science Ave., Laguna Technopark Binan, Laguna MS. CAROLYN JEAN C. BALKIN Toplis Offshore Training Center 2/F VELCO Centre Oca cor. Delgado Sts. South Harbor, Manila MS. GUIWENDOLIN M. JAYME VGL Industries, Inc. Highway, Mandaue City, Cebu MS. ROSALIE HABANA Toplis Offshore Training Center 2/F VELCO Centre Oca cor. Delgado Sts. South Harbor, Manila MS. CHRISTINE A. VILLAMARZO Glacier Refrigerated Services Corp. 36 DBP Ave. FTI Complex, Taguig City --- PDF PAGE 156 --- TR Warehousing Services NC II (New) Promulgated Dec. 16, 2015 Page 152 MR. JOSE ELMER J. ABADIA URC Flour Plant Pasig Blvd. Bagong ilog, Pasig City MR. ARON CHRISTIAN JAVIER Fast Services Corporation FMW Bldg. Tierra Nueva Subd., Alabang Muntinlupa MR. VIRGILIO S. AGUSTIN JR. Transfement Management Inc. (TMI) 877 