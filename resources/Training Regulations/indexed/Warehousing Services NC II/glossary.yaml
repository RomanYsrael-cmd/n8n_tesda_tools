  "source_text": "DEFINITION OF TERMS\n\nBOL\nBill of Lading- is a document issued by a carrier which details a\nshipment of merchandise and gives title of that shipment to a specified\nparty.\nETA\nEstimated Time of Arrival- The time expected for the arrival of delivery\nof goods to the customer.\nFIFO\nFirst In, First Out. Goods that are stored first will be released first\nGSP\nGood Storage Practice\nLIFO\nLast In, First Out. Goods/items that are stored last will be released\nfirst.\nMSD\nMusculoskeletal Disorders. According to the Occupational Safety and\nHealth Administration (OSHA), a musculoskeletal disorder is a\ndisorder of soft tissue, joints, cartilage, blood vessels, or spinal discs.\nSKU\nStock keeping unit, is an identification, usually alphanumeric, of a\nparticular product that allows it to be tracked for inventory purposes.\nSOP\nStandard Operating Procedures. A document dictating a set of explicit\ninstructions to successfully accomplish a specific goal. SOPs are\nintended to be followed without deviation, and provide all the required\ndetails and decision branches required to perform a given procedure.\nTILE\nAcronym for Task, Individual, Load and Environment.\nFour specific areas used to assess manual handling activities\nAxle\nA straight shaft that is fixed in location and is used to mount rotating\nwheels or gears\nBarcode\nIs an optical machine-readable representation of data relating to the\nobject to which it is attached. It is a small image of lines (bars) and\nspaces that is affixed to store items identification cards, and etc. to\nidentify a particular product number, person, or location.\nBisphenol-A\nA component in metal can coatings, which protect the food from\ndirectly contacting metal surfaces. BPA has been used in food\npackaging since the 1960s.\nCellophane\nA thin, flexible, transparent cellulose material made from wood pulp\nand used as a moisture proof wrapping\nConsignee\nIs the entity or person who is responsible for the receipt of a shipment.\nGenerally, but not always, the consignee is the same as the receiver\nor the buyer.\nCorrugated\nCardboard\nAn engineered paper product designed to function as a packaging box\nthat is both versatile and durable. It is the most popular and cost-\neffective choice for item packaging and storage.\nDelivery Waiver\nA permission for claiming goods or merchandise in the absence of the\nconsignee or the rightful person\nDolly\nA low mobile platform that rolls on casters, used for transporting heavy\nloads\nErgonomic\nIs the scientific discipline concerned with the understanding of\ninteractions among humans and other elements of a system, and the\nprofession that applies theory, principles, data and methods to design\nin order to optimize human well-being and overall system performance\nForklift\nIs a powered industrial truck (usually engine, hydraulics or electricity)\nused to lift and move materials in short distances\nFulcrum\nIs the support about which a lever pivots.It may also refer to as a pivot\npoint which a lever turns\n\n--- PDF PAGE 153 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 149\nGrid layout\nIn warehouses, it is a floor layout where stocks/goods are arrange in\ngrid having intersecting sections with enough spaces in between\nHydraulic Unit\nThe major component of pallet jack/lifter that provides the required\nlifting force by means of oil pressure\nInventory\nThe total amount of goods and/or materials contained in a warehouse,\nstore or factory at any given time.\nInventory\nReconciliation\na process where a company balances its physical inventory with the\nfigures in its accounting books.\nLift truck\nVehicles used to lift, move, stack, rack, or otherwise manipulate loads.\nLoad\nDescribes the materials being handled by a piece of equipment.\nLoad Leading\nA condition of pallet truck operation where the forks with the load\nleading on travel and the steering wheels behind\nLoading Dock\nAlso called loading bay is an area of a warehouse building where\ngoods vehicles (usually road or rail) are loaded and unloaded.\nLoad Trailing\nA condition of pallet truck operation with the steering wheels leading\non travel and the forks with the load behind\nLogistics Provider\nA company that provides management over the flow of goods and\nmaterials between points of origin to end-use destination. The\nprovider will often handle shipping, inventory, warehousing, packaging\nand security functions for shipments.\nMast\nIs the component on a forklift that the forks ride on when they are\nraised into the air. Comprised of heavy c-channel steel, the forklift\nmast is often made up of multiple sections, each interlocking within\nthe other to form a type of vertical conveyor as the hydraulic cylinders\nraise the load.\nOff-Center Loads\nLoads that are located out of the center of the pallet. This may lead to\ntilting and falling of the load during traveling\nOrder Fulfillment\nUsed to describe the act of distribution or the logistics function,\nhowever, in the broader sense it refers to the way firms respond to\ncustomer orders.\nPallet\nA portable platform designed to allow a forklift or pallet jack to lift,\nmove, and store various loads\nPallet Loader\nA warehousing or manufacturing equipment designed to lift and move\nload on a pallet\nPallet Truck\nIs a tool used to lift and move pallets are either manually operated or\npowered by means of electricity and hydraulics\nPaper Shredder\nAn office machine used to shred documents for the purpose of\navoiding highly sensitive information getting into the wrong hands.\nPhysical Inventory\nCount Window\nAllows many different methods of creating count lists, verifying and\nupdating inventory counts.\nPick List\nIs a document that is often used to pull particular items in specific\nquantities from an inventory\nPolystyrene\nA synthetic thermoplastic material obtained by polymerizing styrene;\nused as a white rigid foam for insulating and packing and as a\nglasslike material in light fittings and water tanks\nPre-Operational\nChecks\nVisual and physical checks made before operating any pallet\njacks/trucks to identify damage, prevent accidents and to ensure the\nforklift is safe to use\nPurchase Order\nA document used to approve, track, and process purchased items\nPush Rod\nA part of a hydraulic jack that moves up and down that allows the\nlifting and lowering of loads in a jack lift or pallet jacks\n\n--- PDF PAGE 154 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 150\nShelf Life\nRefers to the time a prepared food item will remain fresh, remain\nhealthy to eat, and keep its freshest taste.\nShort landed\nA condition where the manifested schedule of delivery does not\nactually arrive on time.\nSkid\nA type of pallet, a metal, wood or plastic platform for holding\nmachinery or equipment. Some pallets have planks across the bottom\nlevel, flush with the floor, but a skid has no planks along the full length\nor width to form a bottom level on the floor.\nStacking\nAn orderly pile of stocks/goods, especially one arranged in layers.\nStackability\nThe quality of being stackable. Something that can easily be stacked\nStock Take\nIs the physical verification of the quantities and condition of items held\nin an inventory or warehouse. This may be done to provide an audit of\nexisting stock valuation. It is also the source of stock discrepancy\ninformation.\nStraddle Loaders\nA pallet lifter where the load rest on a vertical beam/mast and is\ncapable of stacking and picking goods on a higher elevation\ncompared to a pallet jack\nStretch Wrap\nA thin linear low density polyethylene (LLPDE) or low density\npolyethylene (LPDE) plastic sheet or film that can be tightly wrapped\naround items to secure them firmly together in place or on a pallet for\nshipping.\nT-Bar\nThe part of a pallet jack/truck that connects the jack frame and holds\nthe handle housing the controls.\nThird-Party Logistics\nThird-party logistics refers to the outsourcing of logistics functions and\nother supply chain functions to third-party providers, also called 3PL\nproviders.\nThreshold Delivery\nA door to door delivery service\nVacuum\na space or area entirely devoid of matter particularly air\nVolatile Formulation\nSubstances formulated to be evaporating rapidly or passes off readily\nin the form of vapor\nWalkie\nA type of pallet jack powered by a motorized battery where the\noperator walks behind or ahead of the vehicle\nWalkie-Rider\nA type of pallet jack powered by a motorized battery where the\noperator is able to ride over a platform during operation\nWhite Glove Delivery\nA delivery service providing in-home delivery and light assembly of\nmost furniture and related items as well as removal of all packaging\nmaterials.\nZiplock bag\nA brand of reusable, re-sealable zipper storage bags and containers\nthat come in different sizes for use with different products.\n\n--- PDF PAGE 155 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 151"
