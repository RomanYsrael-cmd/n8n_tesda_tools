      "definition": "TR Warehousing Services NC II (New) Promulgated Dec. 16, 2015 Page 149 Grid layout In warehouses, it is a floor layout where stocks/goods are arrange in grid having intersecting sections with enough spaces in between Hydraulic Unit The major component of pallet jack/lifter that provides the required lifting force by means of oil pressure Inventory The total amount of goods and/or materials contained in a warehouse, store or factory at any given time. Inventory Reconciliation a process where a company balances its physical inventory with the figures in its accounting books. Lift truck Vehicles used to lift, move, stack, rack, or otherwise manipulate loads. Load Describes the materials being handled by a piece of equipment. Load Leading A condition of pallet truck operation where the forks with the load leading on travel and the steering wheels behind Loading Dock Also called loading bay is an area of a warehouse building where goods vehicles (usually road or rail) are loaded and unloaded. Load Trailing A condition of pallet truck operation with the steering wheels leading on travel and the forks with the load behind Logistics Provider A company that provides management over the flow of goods and materials between points of origin to end-use destination. The provider will often handle shipping, inventory, warehousing, packaging and security functions for shipments. Mast Is the component on a forklift that the forks ride on when they are raised into the air. Comprised of heavy c-channel steel, the forklift mast is often made up of multiple sections, each interlocking within the other to form a type of vertical conveyor as the hydraulic cylinders raise the load. Off-Center Loads Loads that are located out of the center of the pallet. This may lead to tilting and falling of the load during traveling Order Fulfillment Used to describe the act of distribution or the logistics function, however, in the broader sense it refers to the way firms respond to customer orders. Pallet A portable platform designed to allow a forklift or pallet jack to lift, move, and store various loads Pallet Loader A warehousing or manufacturing equipment designed to lift and move load on a pallet Pallet Truck Is a tool used to lift and move pallets are either manually operated or powered by means of electricity and hydraulics Paper Shredder An office machine used to shred documents for the purpose of avoiding highly sensitive information getting into the wrong hands. Physical Inventory Count Window Allows many different methods of creating count lists, verifying and updating inventory counts. Pick List Is a document that is often used to pull particular items in specific quantities from an inventory Polystyrene A synthetic thermoplastic material obtained by polymerizing styrene; used as a white rigid foam for insulating and packing and as a glasslike material in light fittings and water tanks Pre-Operational Checks Visual and physical checks made before operating any pallet jacks/trucks to identify damage, prevent accidents and to ensure the forklift is safe to use Purchase Order A document used to approve, track, and process purchased items Push Rod A part of a hydraulic jack that moves up and down that allows the lifting and lowering of loads in a jack lift or pallet jacks"
