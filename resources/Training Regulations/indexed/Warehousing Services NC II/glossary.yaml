      "term": "--- PDF PAGE 154 ---",
      "definition": "TR Warehousing Services NC II (New) Promulgated Dec. 16, 2015 Page 150 Shelf Life Refers to the time a prepared food item will remain fresh, remain healthy to eat, and keep its freshest taste. Short landed A condition where the manifested schedule of delivery does not actually arrive on time. Skid A type of pallet, a metal, wood or plastic platform for holding machinery or equipment. Some pallets have planks across the bottom level, flush with the floor, but a skid has no planks along the full length or width to form a bottom level on the floor. Stacking An orderly pile of stocks/goods, especially one arranged in layers. Stackability The quality of being stackable. Something that can easily be stacked Stock Take Is the physical verification of the quantities and condition of items held in an inventory or warehouse. This may be done to provide an audit of existing stock valuation. It is also the source of stock discrepancy information. Straddle Loaders A pallet lifter where the load rest on a vertical beam/mast and is capable of stacking and picking goods on a higher elevation compared to a pallet jack Stretch Wrap A thin linear low density polyethylene (LLPDE) or low density polyethylene (LPDE) plastic sheet or film that can be tightly wrapped around items to secure them firmly together in place or on a pallet for shipping. T-Bar The part of a pallet jack/truck that connects the jack frame and holds the handle housing the controls. Third-Party Logistics Third-party logistics refers to the outsourcing of logistics functions and other supply chain functions to third-party providers, also called 3PL providers. Threshold Delivery A door to door delivery service Vacuum a space or area entirely devoid of matter particularly air Volatile Formulation Substances formulated to be evaporating rapidly or passes off readily in the form of vapor Walkie A type of pallet jack powered by a motorized battery where the operator walks behind or ahead of the vehicle Walkie-Rider A type of pallet jack powered by a motorized battery where the operator is able to ride over a platform during operation White Glove Delivery A delivery service providing in-home delivery and light assembly of most furniture and related items as well as removal of all packaging materials. Ziplock bag A brand of reusable, re-sealable zipper storage bags and containers that come in different sizes for use with different products."
