      "definition": "Bill of Lading- is a document issued by a carrier which details a shipment of merchandise and gives title of that shipment to a specified party. ETA Estimated Time of Arrival- The time expected for the arrival of delivery of goods to the customer. FIFO First In, First Out. Goods that are stored first will be released first GSP Good Storage Practice LIFO Last In, First Out. Goods/items that are stored last will be released first. MSD Musculoskeletal Disorders. According to the Occupational Safety and Health Administration (OSHA), a musculoskeletal disorder is a disorder of soft tissue, joints, cartilage, blood vessels, or spinal discs. SKU Stock keeping unit, is an identification, usually alphanumeric, of a particular product that allows it to be tracked for inventory purposes. SOP Standard Operating Procedures. A document dictating a set of explicit instructions to successfully accomplish a specific goal. SOPs are intended to be followed without deviation, and provide all the required details and decision branches required to perform a given procedure. TILE Acronym for Task, Individual, Load and Environment. Four specific areas used to assess manual handling activities Axle A straight shaft that is fixed in location and is used to mount rotating wheels or gears Barcode Is an optical machine-readable representation of data relating to the object to which it is attached. It is a small image of lines (bars) and spaces that is affixed to store items identification cards, and etc. to identify a particular product number, person, or location. Bisphenol-A A component in metal can coatings, which protect the food from directly contacting metal surfaces. BPA has been used in food packaging since the 1960s. Cellophane A thin, flexible, transparent cellulose material made from wood pulp and used as a moisture proof wrapping Consignee Is the entity or person who is responsible for the receipt of a shipment. Generally, but not always, the consignee is the same as the receiver or the buyer. Corrugated Cardboard An engineered paper product designed to function as a packaging box that is both versatile and durable. It is the most popular and cost- effective choice for item packaging and storage. Delivery Waiver A permission for claiming goods or merchandise in the absence of the consignee or the rightful person Dolly A low mobile platform that rolls on casters, used for transporting heavy loads Ergonomic Is the scientific discipline concerned with the understanding of interactions among humans and other elements of a system, and the profession that applies theory, principles, data and methods to design in order to optimize human well-being and overall system performance Forklift Is a powered industrial truck (usually engine, hydraulics or electricity) used to lift and move materials in short distances Fulcrum Is the support about which a lever pivots.It may also refer to as a pivot point which a lever turns"
