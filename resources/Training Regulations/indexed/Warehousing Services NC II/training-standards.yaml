  "source_section_text": "SECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for WAREHOUSING SERVICES NC II.\n\nThey include information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to enable\ntraining providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language and other\nacademic subjects shall be contextualized. To this end, TVET providers shall develop a\nContextual Learning Matrix (CLM) to include, green technology, issues on health and drugs and\ncater person with disabilities (PWD’s)\n\nCourse Title: WAREHOUSING SERVICES\n\nNC Level: NC II\n\nNominal Training Duration:\n 16 Hours (Basic Competencies)\n\n 98 Hours (Common Competencies)\n 88 Hours (Core Competencies)\n\nTotal:\n202 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of WAREHOUSING\nSERVICES NC II in accordance with industry standards. This covers competencies that a\nperson must achieve in receiving stocks, storing stocks, Issuing/dispatching stocks, operating\nand maintaining manual material handling equipment, performing stock take and inventory,\npacking goods/products, delivering goods/consignment and loading and unloading goods/cargo.\nIt also includes competencies in performing computer operations and carrying out monitoring of\ntemperature controlled stocks.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 97 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 93\nBASIC COMPETENCIES\n (16 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational policies\n\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Read:\no Effective communication\n• Lecture\n• Written\nexamination\n\no Written communication\n\no Communication procedures\nand systems\n\n• Identify:\no Different modes of\ncommunication\n\no Medium of communication\n\no Flow of communication\n\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n\n• Prepare different Types of\nquestion\n• Demonstration\n• Observation\n\n• Gather different sources of\ninformation\n\n• Apply storage system in\nestablishing workplace information\n\n• Demonstrate Telephone courtesy\n\n--- PDF PAGE 98 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 94\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n• Describe Communication\nprocedures and systems\n• Group\ndiscussion\n• Oral evaluation\n\n• Read:\no Meeting protocols\n• Lecture\n\n• Written\nexamination\n\no Nature of workplace meetings\n• Written\nexamination\n\no Workplace interactions\n•\n\no Barriers of communication\n•\n\n• Complete work related documents\n• Demonstration\n• Observation\n\n• Read instructions on work related\nforms/documents\n• Lecture\n• Written\nexamination\n\n• Practice:\n\no Estimate, calculate and record\nroutine workplace measures\n• Demonstration\n• Observation\n\no Basic mathematical processes\nof addition, subtraction, division\nand multiplication\n•\n•\n\n• Demonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n• Role play\n• Oral evaluation\n• Observation\n\n• Perform workplace duties scenario\nfollowing simple written notices\n• Role play\n• Oral evaluation\n• Observation\n\n• Follow simple spoken language\n• Demonstration\n• Observation\n\n• Identify the different Non-verbal\ncommunication\n• Lecture\n• Written\nexamination\n\n--- PDF PAGE 99 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 95\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n• Demonstration\n• Observation\n\n• Gather and provide information in\nresponse to workplace\nrequirements\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Identify:\no types of workplace documents\nand forms\n• Lecture\n• Written\nexamination\n\no kinds of workplace report\n•\n•\n\no Available technology relevant to\nthe enterprise and the\nindividual’s work responsibilities\n•\n•\n\n• Read and follow instructions in\napplying basic mathematical\nconcepts\n•\n•\n\n• Follow simple spoken language\n• Demonstration\n• Observation\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n• Demonstration\n• Observation\n\n• Gather and provide information in\nresponse to workplace\nrequirements\n•\n•\n\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility\nin a team.\n\n• Describe the team role and scope\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n\n--- PDF PAGE 100 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 96\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Read\no Definition of Team\n• Lecture\n• Written\nexamination\n\no Difference between team and\ngroup\n•\n•\n\no Objectives and goals of team\n•\n•\n\n• Identify different sources of\ninformation\n•\n•\n\n2.2 Describe work\nas a team\n• Describe team goals and\nobjectives\n• Group\ndiscussion\n• Oral evaluation\n\n• Perform in setting team goals and\nexpectations scenario\n• Role play\n• Oral evaluation\n• Observation\n\n• Identify\no individual role and responsibility\n• Lecture\n• Written\nexamination\n\n• Practice Interacting effectively with\nothers\n• Group\ndiscussion\n• Oral evaluation\n\n• Read:\n• Lecture\n• Written\nexamination\n\no Fundamental rights at work\nincluding gender sensitivity\n•\n•\n\no Understanding individual\ncompetencies relative to\nteamwork\n\n•\n•\n\no Types of individuals\n•\n•\n\no Role of leaders\n\n•\n•\n\n--- PDF PAGE 101 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 97\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n• Describe performance evaluation\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n• Read:\n• Lecture\n• Written\nexamination\n\no Work values and ethics (Code of\nConduct, Code of Ethics, etc.)\n\no Understanding personal\nobjectives\n\no Understanding organizational\ngoals\n\n• Demonstrate Intra and\nInterpersonal skills at work\n• Demonstration\n• Observation\n\n• Demonstrate personal commitment\nin work\n\n3.2 Set and meet\nwork priorities\n• Describe company policies,\noperations, procedures and\nstandards\n• Group\ndiscussion\n• Oral evaluation\n\n• Read:\n• Lecture\n• Written\nexamination\n\no Time Management\n\no Basic strategic planning\nconcepts\n\no Resource utilization and\nmanagement\n\n• Apply managing goals and time\n• Demonstration\n• Observation\n\n• Practice:\no economic use of resources and\nfacilities\n• Demonstration\n• Observation\n\no time management\n\n•\n•\n\n--- PDF PAGE 102 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 98\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Describe company recognition and\nincentives\n\n• Group\ndiscussion\n• Oral evaluation\n\n• Read:\no Career development\nopportunities\n• Lecture\n• Written\nexamination\n\no In