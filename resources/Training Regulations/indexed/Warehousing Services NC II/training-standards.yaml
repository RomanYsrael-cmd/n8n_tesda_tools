veries\n• Group\nDiscussion\n• Oral evaluation\n\n• Describe ways of ensuring that goods/\nconsignment for delivery are in good\ncondition and in the specified\nsequence\n•\n•\n\n--- PDF PAGE 143 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 139\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Gave examples of different goods,\ndescribe how it can be secured to\nminimize risk of damage, theft,\nmisdelivery and loss\n• Lecture\n\n• Written\nExamination\n\n• Gave examples of items requiring\nspecial treatment, describe needed\ndocumentation before delivery\n\n• Demonstrate how to deal with\ncustomers in a courteous and\nengaging manner\n• Demonstration\n• Observation\n\n• Interpret instructions, procedures and\nlabels relevant to delivery operations\n• Demonstration\n• Observation\n\n• Gave examples of different goods,\ndescribe how it can be secured to\nminimize risk of damage, theft,\nmisdelivery and loss\n• Lecture\n\n• Written\nExamination\n\n• Gave examples of problems on\ndelivery operation that may occur,\ndescribe ways to correct\n\n6.5 Report on\ndelivery activity\n• Gave examples of problems during\ndelivery and describe proper\nprocedure of reporting the incident\n• Lecture\n\n• Written\nExamination\n\n• Identify means of processing\nundelivered and undeliverable\ngoods/consignment\n\n• Demonstrate the procedures of\ncompleting and checking documents\n• Demonstration\n• Observation\n\n--- PDF PAGE 144 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 140\n1.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology (Video Conferencing, Webinar,\netc).\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf.\nTraining program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n•\nThe traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-\nwork components.\n\n1.\nInstitution- Based:\n\n- Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 145 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 141\n\n2.\n Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits to\ntraining the apprentice in all the skills relevant to his or her trade over a\nsignificant period of time, usually between one and four years, while the\napprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n1.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the following\nrequirements:\n\n•\nMust have finished ten (10) years of basic education\n\n•\nMust be able to communicate in English language both oral and written\n\n•\nMust be able to perform basic mathematical computation\n\n--- PDF PAGE 146 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 142\n1.4 TOOLS AND EQUIPMENT LIST OF TOOL, EQUIPMENT AND MATERIALS\n\nWAREHOUSING SERVICES NC II\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nWAREHOUSING SERVICES NC II are as follows:\n\nTOOLS\nQty\nSpecification/s\n5 pcs.\nScrew driver, negative\n5 pcs.\nScrew driver, positive (Philips)\n1 pcs.\nAdjustable wrench\n1 set.\nSet of combination wrench\n1 set\nSet of socket wrench, 3/8” drive\n1 set\nSet of socket wrench, ½ ” drive\n1 set\nHex (Allen) wrench set\n1 pcs.\nCrow (pry) bar, straight head, 16”\n1 pcs.\nCrow (pry) bar, rolling head, 16”\n5 pcs.\nPliers, slip joint, 6”\n5 pcs.\nVise grip pliers, slip joint, 10”\n1 set\nPunch and Chisel Set\n5 pcs.\nCutting Knife (Cutter)\n2 pcs.\nPackaging tape dispenser\n1 pc.\nAnti-fatigue mat\n\nEQUIPMENT *\nQty\nSpecification/s\n1 unit\nPallet truck. 2 tons cap. *\n1 unit\nTrans-