s of packaging\nmaterials and select appropriate\nsuitable to the goods to be packed\n• Lecture\n\n• Written\nExamination\n\n• Interpret packaging specifications and\norder packaging documentation of 3\nexamples given\n• Demonstration\n• Observation\n\n• Describe ways of matching packaging\nmaterials to packaging specifications\n• Demonstration\n• Observation\n\n• Identify the most economical material\nto use on goods/loads according to its\nsize, shape and special requirements\n• Lecture\n\n• Written\nExamination\n\n--- PDF PAGE 142 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 138\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.2 Pack/wrap\ngoods/products\n• Gave example of PPEs and identify\nthose that would most appropriate to\nuse in a given situation\n• Lecture\n\n• Written\nExamination\n\n• Demonstrate the method in packing/\nwrapping of goods/products\nconsidering the\n- packaging specifications\n- order packaging requirements\n- OH&S requirements\n• Demonstration\n• Observation\n\n• Identify packaging problems and\ndescribe ways to correct it\n• Lecture\n• Written\nExamination\n\n• Describe ways of stacking packed\ngoods\n• Demonstration\n• Observation\n\n6.3 Label packed\ngoods/products\n• Describe ways of identifying\nworkplace labeling standards\n• Group\nDiscussion\n• Oral evaluation\n\n• Identify different type of goods and\ndescribe how it can be appropriately\nhandled considering the labels and\nidentification symbols\n• Lecture\n\n• Written\nExamination\n\n• Demonstrate the method of attaching\ninvoices and picking slips\n• Demonstration\n• Observation\n\n• Identify documentation requirements\nfor the packaging of goods/products\n• Lecture\n• Written\nExamination\n\n• Describe ways of stacking packed\ngoods\n• Group\nDiscussion\n• Oral evaluation\n\n6.4 Deliver goods/\nconsignment to\nspecific route\n• State the laws, guidelines when\nundertaking deli