      "source_text": "SECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for WAREHOUSING SERVICES NC II.\n\nThey include information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to enable\ntraining providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language and other\nacademic subjects shall be contextualized. To this end, TVET providers shall develop a\nContextual Learning Matrix (CLM) to include, green technology, issues on health and drugs and\ncater person with disabilities (PWD’s)\n\nCourse Title: WAREHOUSING SERVICES\n\nNC Level: NC II\n\nNominal Training Duration:\n 16 Hours (Basic Competencies)\n\n 98 Hours (Common Competencies)\n 88 Hours (Core Competencies)\n\nTotal:\n202 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of WAREHOUSING\nSERVICES NC II in accordance with industry standards. This covers competencies that a\nperson must achieve in receiving stocks, storing stocks, Issuing/dispatching stocks, operating\nand maintaining manual material handling equipment, performing stock take and inventory,\npacking goods/products, delivering goods/consignment and loading and unloading goods/cargo.\nIt also includes competencies in performing computer operations and carrying out monitoring of\ntemperature controlled stocks.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 97 ---\nTR Warehousing