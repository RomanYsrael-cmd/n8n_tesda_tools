d policies in\ncleaning and maintaining material\nhandling equipment\n• Group\nDiscussion\n• Oral evaluation\n\n• Discuss the occupational safety and\nhealth standards (OSHS) and\nenvironmental procedures and\nregulations related to routine\nmaintenance of equipment\n• Group\nDiscussion\n• Oral evaluation\n\n• Select and wear personal protective\nequipment (PPEs) relevant to routine\nmaintenance of material handling\nequipment\n• Demonstration\n• Observation\n\n• Clean material handling equipment\n\n• Test run and identify problems/defects\nof material handling equipment\n\n• Repair minor problems/defects of\nmaterial handling equipment\n\n• Prepare preventive maintenance\nreport\n\n• Accomplish job order form\n\n5.4 Secure and store\nmaterial handling\nequipment\n• Discuss the procedures and policies in\ncleaning and maintaining material\nhandling equipment\n• Group\nDiscussion\n• Oral evaluation\n\n--- PDF PAGE 141 ---\nTR Warehousing Services NC II (New) Promulgated Dec. 16, 2015\nPage 137\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Discuss the occupational safety and\nhealth standards (OSHS) and\nenvironmental procedures and\nregulations related to routine\nmaintenance of equipment\n\n• Select and wear personal protective\nequipment (PPEs) relevant to routine\nmaintenance of material handling\nequipment\n• Demonstration\n• Observation\n\n• Clean material handling equipment\n\n• Test run and identify problems/defects\nof material handling equipment\n• Demonstration\n• Observation\n\n• Repair minor problems/defects of\nmaterial handling equipment\n\n• Prepare preventive maintenance\nreport\n\n• Accomplish job order form\n\n6. Pack goods/\nproducts\n\n6.1 Select packaging\nmaterials\n• Describe National and International\ncodes and regulations relevant to the\npackaging of goods including\nDangerous Goods Code\n• Group\nDiscussion\n• Oral evaluation\n\n16 hours\n\n• Identify different type