nrestorations\nFabricate indirect\ncomposite/\npolymer fixed\nrestorations\nJoin alloy\nstructures\nArrange artificial\nteeth for\ncomplete\ndentures\nSet-up and wax\nremovable partial\ndentures\nWax, process\nand finish acrylic\ndentures and\nappliances\nFabricate thermo\nformed bases and\nappliances\nRepair and modify\ndentures and\nappliances\nFabricate oral\nsplints\nFabricate orthodontic\nappliances\nFabricate cast\nmetal removable\npartial denture\nframework\nPerform oral\nexamination\nPromote oral\nhealth and hygiene\nOperate a dental\nradiographic\nequipment\nApply the\nprinciple of\nradiology biology\nand protection in\ndental practice\nPerform scaling\nand polishing\nMaintain dental\nrecords and\nresources\nProvide effective\npatient/client\nservice\nManage dental\nlaboratory\nproduction and\noperation\nPerform administrative\nfunctions\nContinue\nprofessional\ngrowth and\ndevelopment\n\n--- PDF PAGE 149 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 145\nParticipate in the\nimplementation\nand monitoring of\nnewborn’s care\nplan\nDevelop the ability\nto recognize\nnewborn’s growth\nand development\nPerform caring\nskills for newborn\nParticipate in the\nimplementation\nand monitoring of\ninfant’s care plan\nProvide physical\nneeds, care and\nsupport to infant\nFoster social,\nintellectual and\nemotional\ndevelopment of\ninfant\nParticipate in the\nimplementation\nand monitoring of\ntoddler’s care plan\nDevelop the\nability to\nrecognize\ntoddler’s growth\nand development\nPerform caring skills\nfor toddler\nParticipate in the\nimplementation\nand monitoring of\npre-schooler’s\ncare plan\nDevelop the\nability to\nrecognize pre-\nschooler’s growth\nand development\nPerform caring\nskills for pre-\nschooler\nProvide\nassistance and\ncare to personal\nneeds of grade\nschooler\nFoster\nphysiological\nneeds and\ncognitive\ndevelopment of\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\ngrade schooler\nRespond to\nemergency for\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\nadolescent\nPromote\ndevelopmental\ntasks for\nadolescent\nRespond to\nemergency for\nadolescent\nDevelop the\nability to\nrecognize aging\nprocess\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nPerform caring\nskills\nPerform specialty\ncare procedures\nAssist client in\nadministering\nprescribed\nmedication\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nProvide\nassistance and\nsupport on\nenvironment and\nbiopsychosocial\nneeds of clients\nDevelop the ability\nto recognize\nhealthy body\nsystems and\napply medical\nterminologies\nProvide care and\nsupport to\nactivities of daily\nliving (ADL) of\nclients\nProvide assistance in\nadministering\nprescribed\nmedications to clients\nProvide care and\nsupport to clients\nwith special\nneeds\nRespond to\nemergency\nsituations\nProvide immediate\ncare and support\nto children with\nspecial needs\nProvide\nimmediate care\nand support to\nadults and elderly\nwith special\nneeds\nCarry out\nresponse\nintegration and\ncoordination in a\nmass casualty\nincident\nPerform patient\nassessment\nProvide\nemergency care\nfor suspected\nspine injury\nProvide pre-\nhospital\ninterventions for\ntrauma patients\nProvide pre-\nhospital\ninterventions for\nshock patients\nProvide pre-hospital\ninterventions for\nmedical patients\nPerform basic life\nsupport and use\nairway adjuncts\nProvide pre-\nhospital\ninterventions for\nspecial patient\npopulations\nPerform patient\npackaging\nConduct patient\ntransport\nDeliver basic pre-\nhospital\ncommunication\nskills\nCreate a positive\nmold from a\nnegative cast\nFabricate a\ntranstibial/ankle\ndisarticulation\nprosthesis\nFabricate a\ntransfemoral/knee\ndisarticulation\nprosthesis\nFabricate a\ntransradial/wrist\ndisarticulation\nprosthesis\nFabricate a\ntranshumeral/elbow\ndisarticulation/shoulder\ndisarticulation\nprosthesis\nPerform basic\nrepair and/or\nreplacement of\nthe prosthetic\ndevices\nFabricate a foot\northosis\nFabricate an\nankle-foot orthosis\nFabricate a knee-\nankle-foot\northosis\nFabricate a wrist-\nhand orthosis\nFabricate a\ncustomized\nplastic thoraco-\nlumbo-sacral\northosis\nPerform basic\nrepair and/or\nreplacement of the\northotic devices\nReceive\nwheelchair\nreferral and\nappointment\nAssist the\nwheelchair\nclinician during\nassessment\nCoordinate\nprocurement of the\nappropriate wheelchair\nsize and its parts\nPerform\nwheelchair\nassembly and\nmodifications\nAssist the\nwheelchair\nclinician in\nwheelchair\ncheckout and\nfitting\nAssist wheelchair\nclinician in user\ntraining\nPerform\nmaintenance and\nrepair on\nwheelchair\n\n--- PDF PAGE 150 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 146\nGLOSSARY OF TERMS\n\n1 ANKLE-FOOT ORTHOSIS\na brace worn on the leg and foot covering the ankle\njoint\n\n2 FOOT ORTHOSIS\na shoe inserts. It can correct issues of the foot and\nabove\n\n3 KNEE-ANKLE-FOOT\nORTHOSIS\na custom-made brace worn from thigh to foot covering\nthe ankle and knee joint\n\n4 LIQUID PLASTER\na mixture of plaster and water\n5 MANDREL\n\nA pipe used to hold the positive mold/cast\n6 NEGATIVE CAST\na plaster mold taken directly from the patient’s limb\n7 ORTHOTICS\n\nthe branch of medicine that deals with the provision\nand use of external devices such as splints and braces.\n8 ORTHOSIS\nan external device used to correct, support, align, or\nprevent deformities, and/or improve function. It is also\nknown as an Orthotic Device\n9 PLASTER\n\na hard-white substance made by the addition of water\nto powdered and partly dehydrated gypsum, used for\nmaking casts\n10 POSITIVE CAST\na solid copy of patient’s limb. It is the product when a\nplaster mixture is poured in a negative cast and cured.\n11 THERMOFORM\na manufacturing process where a plastic sheet is\nheated to a pliable forming temperature, formed to a\nspecific shape in a mold. It is also known as vacuum\nforming\n12 THORACOLUMBOSACRAL\nORTHOSIS\na spinal brace used to sed to support/stabilize the\nspine in conditions such as scoliosis (to prevent the\ncurve from getting larger) or after an injury involving the\nspine.\n\n.\n\n--- PDF PAGE 151 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 147\n\nREFERENCES\n\nDisability and health [Internet]. World Health Organization. 2017 [cited 29 December\n2017]. http://www.who.int/mediacentre/factsheets/fs352/en/\n\nWHO standards for prosthetics and orthotics Contents: Part 1. Standards; Part 2.\nImplementation manual, 2017\n\nWHO Guidelines for Training Personnel in Developing Countries\n\nPhysicians for Peace Philippines Data, UERMMMCI- CARES\n\nAt a glance: The Philippine health care system https://www.manilatimes.net/at-a-\nglance-the-philippine-health-care-system/395117/\n\n--- PDF PAGE 152 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 148\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who provided their time and expertise to the development and\nvalidation of this Training Regulations.\n\n• THE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nMR. JAPHET GERARD V. REGIDOR, CPO\nCertified Prosthetist and Orthotist\nFaculty-Philippines / Philippine School of Prosthetics and Orthotics College of Allied\nRehabilitation Sciences UERMMMCI\n\nMR. NIKOLAI R. SANTOS, PTRP, CPO\nCertified Prosthetist and Orthotist/ Physical Therapist\nFaculty/Clinic Manager- Philippine School of Prosthetics and Orthotics College of\nAllied Rehabilitation Sciences UERMMMCI\n\nMS. ANNA MARGARITA A. LUGUE, PTRP, CPO\nCertified Prosthetist and Orthotist/ Physical Therapist\nProgram Director - Philippine School of Prosthetic