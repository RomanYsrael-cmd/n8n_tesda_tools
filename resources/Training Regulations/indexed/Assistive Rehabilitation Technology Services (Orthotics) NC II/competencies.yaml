        "source_text": "--- PDF PAGE 50 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          46 \nUNIT OF COMPETENCY \n: APPLY BASIC FIRST AID \n \n \n \nUNIT CODE \n: HHC321203 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto provide an initial response where First Aid is required. In \nthis unit it is assumed that the First Aider is working under \nsupervision and / or according to established workplace First \nAid procedures and policies. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Assess the \nsituation \n1.1 Emergency action \nprinciple of First Aid \nis applied based on \nestablished procedure \n1.2 Physical hazards to \nself and casualty’s \nhealth and safety are \nidentified based on \nestablished procedure \n1.3 Immediate risks to \nself and casualty are \nminimized by controlled \nin accordance with \nOHS requirements \n1.4 First Aid kit must be \navailable at all times \nbased on OSH Law \nand First Aid manual \n1.1 First Aid standard \noperating \nprocedure \n1.2 OSH Law RA \n11058 \n1.3 Physical hazards \n1.4 Immediate risk \n1.5 Use of gloves and \nmask \n1.6 First aid kit  \n1.1 Applying \nemergency action \nprinciples of first \naid \n1.2 Identifying physical \nhazards \n1.3 Controlling and \nminimizing \nimmediate risk for \nself and casualty \n1.4 Applying principle \nto activate medical \nassistance \n1.5 Wearing of mask \nand gloves \n1.6 Using of First Aid \nkit \n2. Perform \nprimary \nsurvey of the \nvictim \n2.1 Principles of Body \nSubstance Isolation is \napplied based on \nstandard First Aid \nprocedure \n2.2 Responses and level \nof consciousness of \nthe victim or casualty \nare checked based on \nestablished standard \nfirst aid procedure \n2.3 Potentially life-\nthreatening condition \nis identified and then \nappropriate treatment is \nbegan based on first \naid standard procedure \n2.4 Activate medical \nassistance is applied \nbased on established \nfirst aid procedure \n2.5 Basic life support is \napplied based on \n2.1 OSH Law RA 11058 \n2.2 RA 9003 Solid \nWaste Management \n2.3 First Aid manual \n2.4 Principles of body \nsubstance isolation \n2.5 Basic Life Support \n2.6 Wear mask and \ngloves \n2.1 Applying OSH \nLaw and RA \n9003 \n2.2 Applying \nprinciples of body \nsubstance \nisolation \n2.3 Wearing of mask \nand gloves \n2.4 Identifying any \npotentially life-\nthreatening \ncondition of \ncasualty \n2.5 Activating \nmedical \nassistance is \napplied \n2.6 Applying basic \nlife support\n\n--- PDF PAGE 51 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          47 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nestablished first aid \nprocedure \n3.  Apply \nsecondary \nsurvey of \ncasualty \n3.1 Detailed history of \ncasualty is obtained \nbased on established \nstandard procedure of \nfirst aid \n3.2 Physical examination \nof the casualty is done \nbased on established \nprocedure \n3.3 Vital signs of casualty \nare obtained based on \nestablished standard \nprocedure of first aid  \n3.4 Casualty is endorsed to \nphysician or paramedic \nbased on standard \nprocedure of first aid \n3.5 Written incident \nreport is submitted \nbased on standard \nprocedure of company \nor home facility \n3.1 Therapeutic \ncommunication \n3.2 OSH Law RA 11058 \n3.3 RA 9003 – \nEcological Solid \nWaste Management \n3.4 Detailed history of \ncasualty \n3.5 Physical \nexamination of the \ncasualty \n3.6 Vital signs \nparaphernalia \n3.7 Write an incident \nreport using pen and \npaper \n3.8 Use of computer for \nrecording purpose \n3.1 Applying \ntherapeutic \ncommunication \n3.2 Applying OSH \nLaw RA 11058 \nand RA 9003 \n3.3 Obtaining history \nof casualty \n3.4 Doing the \nphysical \nexamination \n3.5 Obtaining and \ndocumenting \ncasualty’s vital \nsigns \n3.6 Documenting and \nreporting of \nincident\n\n--- PDF PAGE 52 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          48 \n  RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Emergency action \nprinciples of first aid \nMay include: \n1.1 Concept of first aid \n1.2 Objectives of first aid \n1.3 Role of first aider \n1.4 Survey the scene \n1.4.1 Is the scene safe? \n1.4.2 What happened? \n1.4.3 How many people are injured? \n1.4.4 Are there by standers who can help? \n1.4.5 Are there available equipment to be used? \n1.4.6 Identify yourself as First aider with your PPEs on \n1.4.6 Wear mask and gloves \n      1.4.7  Get consent to give care \n2. Physical hazards \nMay include: \n2.1 Quick assessment of the surroundings to identify \nphysical hazards like  \n2.1.1 Falls  \n2.1.2 Slips \n2.1.3 Working from heights \n2.1.4 Collapsed of building \n2.1.5 Fire \n2.1.6 Presence of toxic chemicals, etc. \n3. Immediate risk to self \nand casualty \nMay include: \n3.1 Injury of the first aider and further injury to casualty \n3.2 Death which may occur either or both first aider and \ncasualty \n4. First aid kit \nMay include: \n4.1 Digital BP apparatus \n4.2 Digital thermometer \n4.3 Pulse oximeter \n4.4 Cotton balls \n4.5 Alcohol \n4.6 Disposable gloves (1 box) \n4.7 Disposable mask (1 box) \n4.8 Clinical collar \n4.9 Surgical scissors \n4.10 Bandage scissors \n4.11 Forceps \n4.12 Splint \n4.13 Sterile gauze pads \n4.14 Spine board \n4.15 Ice cap \n4.16 Hot water bag \n4.17 Medical / adhesive tapes\n\n--- PDF PAGE 53 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          49 \nVARIABLE \nRANGE \n5. Principles of body \nsubstance isolation \nMay include: \n5.1  Definition of Body substance Isolation (BSI)  \n    5.1.1  Mode of transmission methods \n          5.1.1.1  Blood or fluid splash \n          5.1.1.2  Surface contamination \n          5.1.1.3  Needle stick exposure \n          5.1.1.4  Oral contamination due to improper  \n                       handwashing \n5.2  Proper handwashing (WHO standard) \n5.3  Proper wearing, removal and disposal  of mask and  \n       gloves  (PPE) \n5.4  Wearing of HazMat (Hazardous material suit) as  \n       needed    \n5.5  Use of disinfectant \n6. Level of \nconsciousness \nMay include: \n6.1 Awake \n6.2 Confused \n6.3 Disoriented \n6.4 Lethargic \n6.5 Obtunded \n6.6 Stuporous \n6.7 Comatose \n6.7.1 Protect spine if necessary \n6.7.2 Check C-A-B \n6.7.2.1 \nCirculation \n6.7.2.2 \nAirway \n6.7.2.3 \nBreathing \n7 Potentially life-\nthreatening condition \nMay include: \n7.1  Types of unconscious victim \n7.1.1 +B   +P   =  Syncope \n7.1.2 –B  + P   =  Respiratory arrest  \n7.1.3 –B   - P  =  Cardiac arrest \n* B-breathing:  *P - pulse \n7.2  TRIAGE (TRIAGE PRIORITY) \n7.3  Casualty who has life threatening condition that \n       involves C-A-B. Treat this victim first and transport as \n       soon as possible \n        7.3.1  Airway and breathing difficulties \n        7.3.2  Choking \n        7.3.3  Uncontrolled and severe bleeding \n        7.3.4  Decreased level of consciousness \n        7.3.5  Shock (different types) \n        7.3.6  Severe burns (2nd and 3rd degree) with \n                  difficulty of breathing \n7.4 Person/casualty who are injured but the condition is \n     not life threatening. Treatment can be delayed  \n     temporarily \n       7.4.1 Burns without airway problem \n       7.4.2 major or multiple or joint injury \n       7.4.3 Back injuries with or without spinal cord injury \n7.5 Person who is injured but only minor. Treatment can\n\n--- PDF PAGE 54 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          50 \nVARIABLE \nRANGE \n      be delayed \n       7.5.1  Minor fracture \n       7.5.2  minor soft tissue injury  \n7.6  Lowest priority (Black) person who is already dead or \n      have little chance of survival \n       7.6.1  Obvious death \n       7.6.2  Obviously non survivable injury \n                 7.6.2.1 Major open brain trauma \n                 7.6.2.2 Full cardiac arrest \n8 Activate medical \nassistance \nMay include: \n8.1  Arrange transfer facilities \n        8.1.1 Phone first – activate or call medical assistance \nthen return to the victim \n        8.1.2  Phone fast – CPR first before calling for medical \nassistance \n9 Basic life support \nMay include: \n9.1  Basic life support definition \n9.1.1 Respiratory arrest \n9.1.2 Cardiac arrest \n9.1.3 Artificial respiration or rescue breathing \n9.1.4 Cardiopulmonary resuscitation \n9.1.4.1  CPR for infant \n9.1.4.2  CPR for children  \n9.1.4.3  CPR for adult \n         * Follow CPR under AHA ( American Heart  \n           Association C-A-B procedure) \n9.2  Check Circulation – Airway - Breathing \n9.2.1 Carotid pulse for adult \n9.2.2 Brachial pulse for infant \n9.2.3 Open airway \n9.2.3.1 \nHead tilt chin lift maneuver \n9.2.3.2 \nJaw thrust maneuver \n9.2.3.3 \nModified jaw thrust maneuver \n9.3 When to stop CPR \n 9.3.1 S -  Spontaneous breathing and pulse has \n                 occurred \n 9.3.2 T – Turned over to the physician or  \n                 paramedics \n9.3.3 O – Operator or first aider is already  \n                 exhausted \n9.3.4 P – Physician assumed responsibility and if \n               the casualty has been declared dead  \n10 Detailed history of \ncasualty \nMay include: \n10.1 Ask the following data: \n         10.1.1 Signs and symptoms of the episode \n          10.1.2 What occurred at the onset of accident \n          10.1.3  Any known allergies \n          10.1.4  Present medication \n                10.1.4.1 Name of medication \n                10.1.4.2 Frequency of medication \n                10.1.4.3 Dosage\n\n--- PDF PAGE 55 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          51 \nVARIABLE \nRANGE \n                10.1.4.4  Time when last taken \n          10.1.5 Past history of casualty’s medical condition \n          10.1.6 Last oral intake, last meal, drink or \n           medication taken prior to accident \n          10.1.7 Events leading to injury or illness \n11 Physical examination \nMay include: \n11.1 \nBegin care and assessment in the order of  \n  importance: \n11.1.1  A – Airway \n11.1.2  B – Breathing \n11.1.3  C – Circulation \n11.1.4  D – Disabilities which includes mental status \n11.1.5  E -  Expose any body part that is fractured \nlike extremities but still maintain casualty’s \nprivacy and dignity \n11.2 \nTechniques of physical examination  \n11.2.1  Inspection   \n11.2.2  Palpation \n11.2.3  Auscultation \n11.2.4  Percussion \n11.3 \nExamine the following: \n11.3.1   D - Deformity \n11.3.2  C - Contusion \n11.3.3  A - Abrasion \n11.3.4  P – Punctured \n11.3.5  B – Bleeding and burns \n11.3.6  T – Tenderness \n11.3.7  L  - Laceration \n11.3.8  S – Swelling \n11.4 \nFor casualty - fall from heights \n11.4.1 Don’t move the casualty \n11.4.2 Wait for the paramedics \n11.4.3 Keep the casualty calm and well ventilated \n12 Vital signs \n12.1 \nBaseline vital signs \n12.1.1 Body temperature \n12.1.2 Pulse rate \n12.1.3 Respiratory rate \n12.1.4 Blood pressure \n12.2 \nAssessment of pain \n12.2.1 Use of pain scale \n13 Incident report \n13.1 \nDefinition of term \n13.1.1 Accident report \n13.1.2 Incident report \n13.2    Find the factor \n     13.2.1 Date, Time and specific location of incident \n     13.2.2 Name, job title and department of employee  \n                involved \n     13.2.3 Names and accounts of witness \n     13.2.4 Events leading up to incident \n     13.2.5 Exactly what the casualty was doing at the \n                moment of incident\n\n--- PDF PAGE 56 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          52 \nVARIABLE \nRANGE \n     13.2.6 Environmental condition e.g. slippery, wet \nfloor, lighting, noise, etc. \n     13.2.7 Circumstances like tools, equipment, PPE \n     13.2.8  Specific injuries of casualty \n     13.2.9  Type of treatment given \n     13.2.10 Damage equipment if there are tools and  \n                  equipment involved in the accident \n     13.2.11 Determine the sequence \n     13.2.12 Events involved in the incident \n     13.2.13 Events after the incident \n     13.2.14 Analyze \n     13.2.15 Recommend  \n     13.2.16 Name, signature, date and time of the \nperson who wrote the incident report  \n \n \n  EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Complied with institutional requirements, OSH laws \ninfections control and manual handling procedures \nand relevant health regulations \n1.2 Identified physical hazards of the casualty and \nminimized immediate risks \n1.3 Assessed and monitored the physical condition of the \ncasualty \n1.4 Responded to emergency using basic life support \nmeasures. \n1.5 Provided initial response where First Aid is required \n1.6 Dealt with complex casualties or incident \n1.7 Prepared reports to concerned personnel in a timely \nmanner  \n2. Resource Implications \nThe following resources should be provided: \n2.1   Access to relevant work station \n2.2 Relevant institutional policies, guidelines procedure \nand protocol \n2.3 Equipment and materials relevant to the proposed \nactivities \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with questioning \n3.2 Interview \n3.3 Third Party report \n3.4 Portfolio \n4. Context of \nAssessment \n4.1 Competency maybe assessed in actual workplace or \nat the designated TESDA Assessment Center.\n",
