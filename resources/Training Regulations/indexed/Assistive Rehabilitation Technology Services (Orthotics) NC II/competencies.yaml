ing \npreparation procedure \n3.2 Positive cast \npositioned the in the \nvacuum pipe securely \nin accordance to \nthermoforming \npreparation procedure \n3.3 Vacuum suction \nchecked following the \nrequired pressure \n(PSI) \n3.1 Vacuum forming \nprocess and \nprinciples \n3.2 Use of vacuum \nstation \n \n3.1 Following Safety \nManual  \n3.2 Identifying and \ncontrolling \nhazard/risks  \n3.3 Vacuum forming \nskills \n3.4 Ability to follow \ncorrect \nprocedures and \ninstructions\n\n--- PDF PAGE 67 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          63 \n4. Thermoform \nsoft liner into \nthe foot \northosis \npositive mold \n4.1 Oven temperature set \nappropriate for \nprescribed materials \n4.2 Materials prepared \naccording to \nprescribed dimensions \n4.3 Liner cooked \naccording to \nprescribed time and \ntemperature \n4.4 Liner molded \nintimately to the \npositive mold via \nbandage / vacuum \nform \n4.1 Properties of \nFoams liners \n4.2 Types and uses of \nOven  \n4.3 Proper setting of \noven temperature  \n4.4 Use of oven and \nfoams \n \n4.1 Proper \npreparation and \nplacement of \nmaterials in oven \n4.2 Following Safety \nManual  \n4.3 Pattern making \n4.4 Identifying and \ncontrolling \nhazard/risks  \n4.5 Ability to handle \noperating \ntools/equipment \n4.6 Ability to follow \ncorrect \nprocedures and \ninstructions \n5. Thermoform \nhard plastic \ncomponent \nof   foot \northosis   \n5.1 Positive Mold \npositioned to the \nvacuum pipe following \nthe thermoforming \nprocedure \n5.2 Vacuum suction was \ntested before actual \nthermoforming \n5.3 Materials prepared \naccording to \nprescribed dimensions \n5.4 Plastic vacuum \nformed to the positive \nmold following the \nthermoforming \nprocedure \n5.5 Foot orthosis checked \nfor cooling and setting \nfollowing the \nthermoforming \nprocedure \n5.6 Foot orthosis \ndismounted from the \nvacuum forming \nstation \n5.7 All machines used \