        "source_title": "FABRICATE A CUSTOMIZED PLASTIC THORACO- LUMBO-SACRAL ORTHOSIS",
        "source_text": "--- PDF PAGE 81 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          77 \nUNIT OF COMPETENCY \n: FABRICATE A CUSTOMIZED PLASTIC THORACO-\nLUMBO-SACRAL ORTHOSIS \n \n \n \nUNIT CODE \n: HHC321312 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto fabricate a customized plastic thoraco-lumbo-sacral \northosis (TLSO). \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Confirm \nprescription / \nspecifications \nof the device \n1.1 Prescription received \nin accordance with \nestablished \ndocumentation \nprocedures \n1.2 Prescription verified \nin accordance with \ndocumentation \nprocedure \n1.3 Prescription logged in \naccordance \ndocumentation \nprocedures \n1.1 Reporting \n1.2 Reporting process \n1.3 Verbal \ncommunication \n1.4 Office protocol \n1.5 Nomenclature of \northotic devices \n1.6 Materials Science \n1.7 Prescription \nterminologies and \nformat \n1.1 Interpersonal \nSkills \n1.2 Communication \nSkills \n1.3 Record-keeping \n1.4 Reading Skills \n1.5 Mathematical \nSkills \n2. Request tools \nand materials \n2.1 Request form filled-up \nin accordance to form \ndesign \n2.2 Availability of tools \nand materials verified \nin accordance to \nstock inventory \n2.3 Materials received in \naccordance with the \nrequest form \n2.1 Institutional policies, \nguidelines and \nprocedures \n2.2 Forms \n2.3 Tool and Materials  \n2.4 Vacuum forming \nprocess and \nprinciples \n2.5 Use of vacuum \nstation \n \n2.1 Interpersonal \nSkills \n2.2 Communication \nSkills \n2.3 Record-keeping \n2.4 Following Safety \nManual \n2.5 Identifying and \ncontrolling \nhazard/risks  \n2.6 Reading skills to \naccess industry \ninformation \n2.7 Verification skills \n3. Prepare a   \nTLSO positive \ncast for \nfabrication \n \n3.1 Positive cast is \nensured free of \nbumps and sharp \nedges in accordance \nto thermoforming \npreparation procedure \n3.2 Positive cast \npositioned the in the \nvacuum pipe securely \nin accordance to \nthermoforming \npreparation procedure \n3.3 Vacuum suction \nchecked following the \n3.1 Vacuum forming \nprocess and \nprinciples \n3.2 Use of vacuum \nstation \n \n3.1 Following Safety \nManual  \n3.2 Identifying and \ncontrolling \nhazard/risks  \n3.3 Vacuum forming \nskills \n3.4 Ability to follow \ncorrect \nprocedures and \ninstructions\n\n--- PDF PAGE 82 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          78 \nrequired pressure \n(PSI) \n4. Thermoform \nhard plastic \ncomponent of \nTLSO \n4.1 Positive Mold \npositioned to the \nvacuum pipe following \nthe thermoforming \nprocedure \n4.2 Vacuum suction was \ntested before actual \nthermoforming \n4.3 Materials prepared \naccording to \nprescribed \ndimensions \n4.4 Plastic vacuum \nformed the to the \npositive mold \nfollowing the \nthermoforming \nprocedure \n4.5 TLSO checked for \ncooling and setting \nfollowing the \nthermoforming \nprocedure \n4.6 TLSO dismounted \nfrom the vacuum \nforming station \n4.7 All machines used \nturned off after the \nfabrication following \nthe equipment \nmanual \n4.8 Tools returned to their \ndesignated cabinets \nfollowing institutional \nprocedures \n4.1 Types and \nthickness of \nPlastics \n4.2 Principles of \nthermoforming \n4.3 Curing of Plastic \n4.4 Use of tools, \nmaterials and \nequipment \n \n4.1 Thermoforming \nskills  \n4.2 Following Safety \nManual  \n4.3 Identifying and \ncontrolling \nhazard/risks  \n4.4 Ability to handle \noperating \ntools/equipment/m\naterials \n4.5 Ability to follow \ncorrect procedures \nand instructions \n5. Cut and grind \nthe plastic \naccording to \nprescribed \ntrimlines \n5.1 TLSO shell cut \naccording to the \nprescribed trimlines \n5.2 Plaster removed inside \nthe TLSO \n5.3 TLSO trimlines \nsmoothened according \nto prescribed trimlines  \n5.4 Turned off all \nmachines used during \nthe fabrication \n5.5 Tools returned to their \ndesignated cabinets \n5.1 Cutting and grinding \ntool and equipment \n5.2 Operation of dust \ncollection system \n5.3 Use of cutting and \ngrinding tools and \nequipment \n \n5.1 Following Safety \nManual  \n5.2 Identifying and \ncontrolling \nhazard/risks  \n5.3 Ability to handle \ncutting and \ngrinding \ntools/equipment \n5.4 Ability to follow \ncorrect procedures \nand instructions \n6. Prepare straps \naccording to \npatient \nmeasurements \n6.1 Sew webbing and \nVelcros together in \naccordance to straps \nfabrication procedure  \n6.2 Cut appropriate \nwebbing and velcros \n6.1 Basic computation \n(i.e., addition, \nsubtraction, \nmultiplication and \ndivision) \n6.2 Basic principles of \nsewing \n6.1 Sewing skills \n6.2 Identifying and \ncontrolling \nhazard/risks  \n6.3 Ability to handle \noperating\n\n--- PDF PAGE 83 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          79 \nfollowing the patient \nmeasurements \n6.3 Place attachment \nholes in the straps \nfollowing the desired \nmeasurements  \n6.3 Use of sewing \nmachine and \nsoldering iron  \ntools/equipment/m\naterials \n6.4 Ability to follow \ncorrect procedures \nand instructions \n7. Store the     \nTLSO \nproperly until \nfitting date \n7.1 TLSO properly labeled \nfollowing device safe \nkeeping process \n7.2 TLSO placed in safe \nand secure \nenvironment safe \nkeeping process \n7.3 TLSO readiness is \ncoordinated following \ninstitutional \nprocedures \n7.1 Written \ncommunication \n7.2 Recording \n \n7.1 Communication \nSkills \n7.2 Record-keeping \n7.3 Reading Skills \n7.4 Writing Skills \n7.5 Ability to handle \noperating \ntools/equipment \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Confirmed prescription / specifications of the device \n1.2 Requested tools and supplies \n1.3 Prepared a TLSO positive cast for fabrication \n1.4 Thermoformed hard plastic component of TLSO \n1.5 Cut and grinded the plastic according to prescribed \ntrimlines \n1.6 Prepared straps according to patient measurements \n1.7 Stored the TLSO properly until fitting date \n2. Resource \nImplications \nThe following resources should be provided: \n2.3 Workshop appropriate for the unit of competency \n2.4 Tools, materials and equipment, appropriate for the unit \nof competency \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with questioning \n3.2 Observation with questioning \n3.3 Written Examination \n3.4 Interview \n4. Context of \nAssessment \n4.1 Competency may be assessed in the actual workplace \nor at the designated TESDA Accredited Assessment \nCenter.\n",
