        "source_text": "--- PDF PAGE 19 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          15 \nUNIT OF COMPETENCY \n: DEVELOP CAREER AND LIFE DECISIONS \n \n \n \nUNIT CODE \n: 400311213 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills, and attitudes in \nmanaging one’s emotions, developing reflective practice, \nand boosting self-confidence and developing self-regulation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Manage \none’s \nemotion \n1.1  Self-management \nstrategies are \nidentified \n1.2  Skills to work \nindependently and to \nshow initiative, to be \nconscientious, and \npersevering in the face \nof setbacks and \nfrustrations are \ndeveloped \n1.3  Techniques for \neffectively handling \nnegative emotions and \nunpleasant situation \nin the workplace are \nexamined \n \n \n \n1.1  Self-management \nstrategies that \nassist in regulating \nbehavior and \nachieving personal \nand learning goals \n(e.g. Nine self-\nmanagement \nstrategies \naccording to Robert \nKelley) \n1.2  Enablers and \nbarriers in \nachieving personal \nand career goals \n1.3 Techniques in \nhandling negative \nemotions and \nunpleasant situation \nin the workplace \nsuch as frustration, \nanger, worry, \nanxiety, etc. \n1.1  Managing \nproperly one’s \nemotions and \nrecognizing \nsituations that \ncannot be \nchanged and \naccept them and \nremain \nprofessional \n1.2  Developing self-\ndiscipline, \nworking \nindependently \nand showing \ninitiative to \nachieve personal \nand career goals \n1.3  Showing \nconfidence, and \nresilience in the \nface of setbacks \nand frustrations \nand other \nnegative \nemotions and \nunpleasant \nsituations in the \nworkplace \n2. Develop \nreflective \npractice \n2.1 Personal strengths and \nachievements, based \non self-assessment \nstrategies and teacher \nfeedback are \ncontemplated \n2.2 Progress when seeking \nand responding to \nfeedback from \nteachers to assist \nthem in consolidating \nstrengths, addressing \nweaknesses and \nfulfilling their potential \nare monitored \n2.1 Basic SWOT \nanalysis \n2.2 Strategies to \nimprove one’s \nattitude in the \nworkplace \n2.3 Gibbs’ Reflective \nCycle/Model \n(Description, \nFeelings, \nEvaluation, \nAnalysis, \nConclusion, and \nAction plan) \n2.1 Using the basic \nSWOT analysis \nas self-\nassessment \nstrategy \n2.2 Developing \nreflective practice \nthrough \nrealization of \nlimitations, likes/ \ndislikes;  through \nshowing of self-\nconfidence   \n2.3 Demonstrating \nself-acceptance\n\n--- PDF PAGE 20 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          16 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3 Outcomes of personal \nand academic \nchallenges by \nreflecting on previous \nproblem solving and \ndecision-making \nstrategies and \nfeedback from peers \nand teachers are \npredicted \nand being able to \naccept challenges \n \n3. Boost self-\nconfidence \nand develop \nself-\nregulation \n3.1 Efforts for continuous \nself-improvement are \ndemonstrated \n3.2 Counter-productive \ntendencies at work are \neliminated \n3.3 Positive outlook in life \nare maintained.   \n3.1 Four components of \nself-regulation based \non Self-Regulation \nTheory (SRT) \n3.2 Personality \ndevelopment \nconcepts \n3.3  Self-help concepts \n(e. g., 7 Habits by \nStephen Covey, \ntransactional \nanalysis, psycho-\nspiritual concepts) \n3.1 Performing \neffective \ncommunication \nskills – reading, \nwriting, conversing \nskills \n3.2 Showing affective \nskills – flexibility, \nadaptability, etc. \n3.3 Self-assessment \nfor determining \none’s strengths \nand weaknesses\n\n--- PDF PAGE 21 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          17 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Self-management \nstrategies \nMay include but not limited to: \n1.1 \nSeeking assistance in the form of job coaching or \nmentoring  \n1.2 \nContinuing dialogue to tackle workplace grievances \n1.3 \nCollective negotiation/bargaining for better working \nconditions \n1.4 \nShare your goals to improve with a trusted co-worker \nor supervisor \n1.5 \nMake a negativity log of every instance when you \ncatch yourself complaining to others \n1.6 \nMake lists and schedules for necessary activities \n2. Unpleasant situation \nMay include but not limited to: \n2.1 \nJob burn-out \n2.2 \nDrug dependence \n2.3 \nSulking \n \n \n \n  EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 \nExpress emotions appropriately \n1.2 \nWork independently and show initiative \n1.3 \nConsistently demonstrate self-confidence and self-\ndiscipline  \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to workplace and resource s \n2.2. Case studies  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration or simulation with oral questioning \n3.2. Case problems involving work improvement and \nsustainability issues \n3.3. Third-party report \n4. Context for \nAssessment \n4.1. Competency assessment may occur in workplace or \nany appropriately simulated environment\n",
