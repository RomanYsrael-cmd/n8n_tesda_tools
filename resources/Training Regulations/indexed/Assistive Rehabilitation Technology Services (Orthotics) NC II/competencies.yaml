        "source_text": "--- PDF PAGE 84 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          80 \nUNIT OF COMPETENCY \n: PERFORM BASIC REPAIR AND/OR REPLACEMENT \nOF THE ORTHOTIC DEVICES \n \n \n \nUNIT CODE \n: HHC321313 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto perform basic repair and/or replacement of the orthotic \ndevices. \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Receive the \northotic \ndevice for \nrepair or \nreplacement \nof prosthetic \ncomponents \n1.1 Orthotic device is \nevaluated for repair, \nreplacement or referral \nto prosthetist \n1.2 Orthotic device for \nreferral to prosthetist is \ndone in the following \nsituations and cases \n1.3 Orthotic device for \nrepair or replacement \nis done in the following \nsituations and cases  \n1.4 Repair/replacement \nneeded for the orthotic \ndevice verified \naccording to \nestablished \ndocumentation \nprocedures \n1.5 Orthotic device for \nrepair/ replacement \nlogged following \nestablished \ndocumentation \nprocedures \n1.1 Reporting \n1.2 Reporting process \n1.3 Verbal \ncommunication \n1.4 Office protocol \n1.5 Nomenclature of \nprosthetic and \northotic devices \n1.6 Materials Science \n1.7 Prosthetic \ncomponents \n1.8 Common problems \nin prosthesis \n1.9 Use of orthotic \ncomponents \n \n1.1 Interpersonal Skills \n1.2 Communication \nSkills \n1.3 Record-keeping \n1.4 Reading Skills \n1.5 Following \nmanufacturer ‘s \nspecification \n \n2.  Perform the \nnecessary \nrepair or \nreplacement \nneeded \naccording to \nlatest \nprescription \n2.1 Replacement/repair \npart/s or materials \nordered in accordance \nto latest prescription \n2.2 Replacement/repair \npart/s confirmed order \nof in accordance to \nstock inventory \n2.3 Replacement/repair \nneeded performed \nfollowing the latest \nprescription \n2.1 Reporting process \n2.2 Verbal \ncommunication \n2.3 Office protocol \n2.4 Basic computation \n(i.e., addition, \nsubtraction, \nmultiplication and \ndivision) \n2.5 Nomenclature of \nprosthetic and \northotic devices \n2.6 Materials Science \n2.7 Tools \n2.8 Equipment \n2.1 Following Safety \nManual  \n2.2 Identifying and \ncontrolling \nhazard/risks  \n2.3 Repairing skills\n\n--- PDF PAGE 85 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          81 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.9 Lower limb \nprosthetic \ncomponents \n2.10 Use of prosthetic \ncomponents \n2.11 Use of tools and \nequipment \n3.  Secure the \northotic device \nfor \nfunctionality \nand safety \n3.1 Safety and functionality \nare checked in \naccordance with \nmanufacturing \nprocedures \n3.2 Orthotic device is \nreturned to patient \nfollowing institutional \nprocedure \n3.3 Orthotic device is \nreceived by patient and \nprovides feedback \n3.4 Orthotic device \nrepaired/replaced \ntogether with patient \nfeedback is logged in \naccordance with \nestablished \ndocumentation \nprocedures \n3.1 Reporting \n3.2 Reporting process \n3.3 Verbal \ncommunication \n \n3.1 Interpersonal skills \n3.2 Communication \nSkills \n3.3 Record-keeping \n3.4 Reading Skills \n3.5 Safe Manual \nHandling \n3.6 Hazard/risks \nidentification and \ncontrol\n\n--- PDF PAGE 86 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          82 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Situation and Cases \nMay include \n1.1 Referral \n1.1.1 Device to small \n1.1.2 Deviation/Changes from latest prescription/ \ncomponents \n1.2 Repair \n1.2.1 Trimlines adjustments due to client discomfort \n1.2.2 Padding for relief in some of the areas in \northosis \n1.2.3 Straps repair due to breakdown \n1.3 Replacement \n1.3.1 Straps and belts replacement due to wear and \ntear \n1.3.2 Bolt and screw replacement due to wear and \ntear \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Received the device for repair or replacement of orthotic \ncomponents \n1.2. Performed the necessary repair or replacement needed \naccording to the specification \n1.3. Secured the device for functionality and safety \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Workshop required for tasks \n2.2. Equipment required for tasks \n2.3. Tools required for tasks \n2.4. Consumable materials required for tasks \n2.5. Non-consumable materials required for tasks  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Practical Exam \n3.2 Demonstration with questioning \n3.3 Written Examination \n4. Context of \nAssessment \n4.1 Competency may be assessed in the actual workplace or \nat the designated TESDA Accredited Assessment Center.\n",
