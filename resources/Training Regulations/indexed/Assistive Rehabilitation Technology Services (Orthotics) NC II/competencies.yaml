onment \nsafe keeping process \n7.3 Ankle-foot orthosis \nreadiness is \ncoordinated following \ninstitutional \nprocedures \n7.1 Written \ncommunication \n7.2 Recording \n \n7.1 Communication \nSkills \n7.2 Record-keeping \n7.3 Reading Skills \n7.4 Writing Skills \n7.5 Ability to handle \noperating \ntools/equipment",
