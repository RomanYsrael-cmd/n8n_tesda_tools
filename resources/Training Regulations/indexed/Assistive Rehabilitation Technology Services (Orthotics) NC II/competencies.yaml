rm basic\nrepair and/or\nreplacement of\nthe prosthetic\ndevices\nFabricate a foot\northosis\nFabricate an\nankle-foot orthosis\nFabricate a knee-\nankle-foot\northosis\nFabricate a wrist-\nhand orthosis\nFabricate a\ncustomized\nplastic thoraco-\nlumbo-sacral\northosis\nPerform basic\nrepair and/or\nreplacement of the\northotic devices\nReceive\nwheelchair\nreferral and\nappointment\nAssist the\nwheelchair\nclinician during\nassessment\nCoordinate\nprocurement of the\nappropriate wheelchair\nsize and its parts\nPerform\nwheelchair\nassembly and\nmodifications\nAssist the\nwheelchair\nclinician in\nwheelchair\ncheckout and\nfitting\nAssist wheelchair\nclinician in user\ntraining\nPerform\nmaintenance and\nrepair on\nwheelchair\n\n--- PDF PAGE 150 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 146\nGLOSSARY OF TERMS\n\n1 ANKLE-FOOT ORTHOSIS\na brace worn on the leg and foot covering the ankle\njoint\n\n2 FOOT ORTHOSIS\na shoe inserts. It can correct issues of the foot and\nabove\n\n3 KNEE-ANKLE-FOOT\nORTHOSIS\na custom-made brace worn from thigh to foot covering\nthe ankle and knee joint\n\n4 LIQUID PLASTER\na mixture of plaster and water\n5 MANDREL\n\nA pipe used to hold the positive mold/cast\n6 NEGATIVE CAST\na plaster mold taken directly from the patient’s limb\n7 ORTHOTICS\n\nthe branch of medicine that deals with the provision\nand use of external devices such as splints and braces.\n8 ORTHOSIS\nan external device used to correct, support, align, or\nprevent deformities, and/or improve function. It is also\nknown as an Orthotic Device\n9 PLASTER\n\na hard-white substance made by the addition of water\nto powdered and partly dehydrated gypsum, used for\nmaking casts\n10 POSITIVE CAST\na solid copy of patient’s limb. It is the product when a\nplaster mixture is poured in a negative cast and cured.\n11 THERMOFORM\na manufacturing process where a plastic sheet is\nheated to a pliable forming temperature, formed to a\nspecific shape in a mold. It is also known as vacuum\nforming\n12 THORACOLUMBOSACRAL\nORTHOSIS\na spinal brace used to sed to support/stabilize the\nspine in conditions such as scoliosis (to prevent the\ncurve from getting larger) or after an injury involving the\nspine.\n\n.\n\n--- PDF PAGE 151 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 147\n\nREFERENCES\n\nDisability and health [Internet]. World Health Organization. 2017 [cited 29 December\n2017]. http://www.who.int/mediacentre/factsheets/fs352/en/\n\nWHO standards for prosthetics and orthotics Contents: Part 1. Standards; Part 2.\nImplementation manual, 2017\n\nWHO Guidelines for Training Personnel in Developing Countries\n\nPhysicians for Peace Philippines Data, UERMMMCI- CARES\n\nAt a glance: The Philippine health care system https://www.manilatimes.net/at-a-\nglance-the-philippine-health-care-system/395117/\n\n--- PDF PAGE 152 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 148\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who provided their time and expertise to the development and\nvalidation of this Training Regulations.\n\n• THE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nMR. JAPHET GERARD V. REGIDOR, CPO\nCertified Prosthetist and Orthotist\nFaculty-Philippines / Philippine School of Prosthetics and Orthotics College of Allied\nRehabilitation Sciences UERMMMCI\n\nMR. NIKOLAI R. SANTOS, PTRP, CPO\nCertified Prosthetist and Orthotist/ Physical Therapist\nFaculty/Clinic Manager- Philippine School of Prosthetics and Orthotics College of\nAllied Rehabilitation Sciences UERMMMCI\n\nMS. ANNA MARGARITA A. LUGUE, PTRP, CPO\nCertified Prosthetist and Orthotist/ Physical Therapist\nProgram Director - Philippine School of Pr