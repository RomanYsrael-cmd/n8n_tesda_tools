        "source_title": "PRESENT RELEVANT INFORMATION",
        "source_text": "--- PDF PAGE 26 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          22 \nUNIT OF COMPETENCY \n: PRESENT RELEVANT INFORMATION \n \n \n \nUNIT CODE \n: 400311215 \n \n \n \nUNIT DESCRIPTOR \n: This unit of covers the knowledge, skills and attitudes \nrequired to present data/information appropriately. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Gather data/ \ninformation \n1.1 Evidence, facts and \ninformation are \ncollected \n1.2 Evaluation, terms of \nreference and \nconditions are \nreviewed to determine \nwhether \ndata/information falls \nwithin project scope \n \n1.1 Organisational \nprotocols  \n1.2 Confidentiality \n1.3 Accuracy \n1.4 Business \nmathematics and \nstatistics \n1.5 Data analysis \ntechniques/procedu\nres \n1.6 Reporting \nrequirements to a \nrange of audiences \n1.7 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n1.8 Organisational \nvalues, ethics and \ncodes of conduct \n \n1.1 Describing \norganisational \nprotocols relating \nto client liaison \n1.2 Protecting \nconfidentiality \n1.3 Describing \naccuracy \n1.4 Computing \nbusiness \nmathematics and \nstatistics \n1.5 Describing data \nanalysis \ntechniques/ \nprocedures \n1.6 Reporting \nrequirements to a \nrange of \naudiences \n1.7 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n1.8 Stating \norganisational \nvalues, ethics and \ncodes of conduct\n\n--- PDF PAGE 27 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          23 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Assess \ngathered \ndata/ \ninformation \n2.1 Validity of data/ \ninformation is assessed \n2.2 Analysis techniques are \napplied to assess data/ \ninformation. \n2.3 Trends and anomalies \nare identified \n2.4 Data analysis \ntechniques and \nprocedures are \ndocumented \n2.5 Recommendations are \nmade on areas of \npossible improvement. \n \n \n2.1 Business \nmathematics and \nstatistics \n2.2 Data analysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \n2.1 Computing \nbusiness \nmathematics and \nstatistics \n2.2 Describing data \nanalysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of \naudiences \n2.4 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n2.5 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n \n3. Record and \npresent \ninformation  \n3.1 Studied \ndata/information are \nrecorded. \n3.2 Recommendations are \nanalysed for action to \nensure they are \ncompatible with the \nproject’s scope and \nterms of reference. \n3.3 Interim and final reports \nare analysed and \noutcomes are \ncompared to the criteria \nestablished at the \noutset. \n3.4 Findings are presented \nto stakeholders. \n \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n \n3.1 Describing data \nanalysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of \naudiences \n3.3 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4 Stating \norganisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 28 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          24 \n   RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Data analysis \ntechniques \nMay include but not limited to: \n1.1. Domain analysis \n1.2. Content analysis \n1.3. Comparison technique \n \n \n   EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determine data / information \n1.2 Studied and applied gathered data/information \n1.3 Recorded and studied data/information \nThese aspects may be best assessed using a range of \nscenarios what ifs as a stimulus with a walk through forming \npart of the response. These assessment activities should \ninclude a range of problems, including new, unusual and \nimprobable situations that may have happened. \n2. Resource \nImplications \nSpecific resources for assessment \n2.1 Evidence of competent performance should be obtained \nby observing an individual in an information management role \nwithin the workplace or operational or simulated environment. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Interview \n3.3 Portfolio   \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk \nthrough of the relevant competency components.  \n4. Context for \nAssessment \n4.1 In all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n",
