        "source_text": "--- PDF PAGE 6 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          2 \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the units of competency required in \nASSISTIVE REHABILITATION TECHNOLOGY SERVICES (ORTHOTICS) NC II. \n \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY \n: PARTICIPATE IN WORKPLACE COMMUNICATION \n \n \n \nUNIT CODE \n: 400311210 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes   required \nto gather, interpret and convey information in response to \nworkplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1  Specific and  relevant \ninformation is \naccessed from \nappropriate sources  \n1.2  Effective questioning,  \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3  Appropriate medium \nis used to transfer \ninformation and ideas \n1.4  Appropriate non- \nverbal communication \nis used \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and followed \n1.6  Defined workplace \n       procedures for the \nlocation and storage \nof information are \nused \n1.7  Personal interaction is \ncarried out clearly and \nconcisely \n \n \n \n1.1 Effective verbal and \nnonverbal \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities  \n1.8 Workplace etiquette \n \n \n1.1  Following simple \nspoken language \n1.2  Performing \nroutine workplace \nduties following \nsimple written \nnotices \n1.3  Participating in \nworkplace \nmeetings and \ndiscussions \n1.4  Preparing work- \nrelated \ndocuments \n1.5  Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6  Relating/ \nInteracting with \npeople of various \nlevels in the \nworkplace \n1.7 Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements\n\n--- PDF PAGE 7 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          3 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.8 Applying basic \nbusiness writing \nskills \n1.9 Applying \ninterpersonal \nskills in the \nworkplace \n1.10 Performing \nactive-listening \nskills \n2.  Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices and \ninstructions are read \nand   interpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction is followed \nbased on established \nprocedures \n2.3 Feedback is given to \nworkplace supervisor-\nbased instructions/ \ninformation received \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters concerning \nconditions of \nemployment are \nsought and asked from \nappropriate sources  \n2.6  Meetings outcomes \nare interpreted and \nimplemented \n2.1 Effective verbal and \nnon-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nworkplace policies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace etiquette \n \n  \n2.1  Following simple \nspoken \ninstructions  \n2.2  Performing \nroutine workplace \nduties following \nsimple written \nnotices \n2.3  Participating in \nworkplace \nmeetings and \ndiscussions \n2.4  Completing work- \nrelated \ndocuments \n2.5  Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n2.6  Relating/ \nResponding to \npeople of various \nlevels in the \nworkplace \n2.7  Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n2.8  Applying basic \nquestioning/ \nquerying \n2.9  Applying skills in \nreading for \ninformation  \n2.10 Applying skills in \nlocating\n\n--- PDF PAGE 8 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          4 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.   Complete \nrelevant \nwork related \ndocuments \n3.1  Range of forms \nrelating to conditions \nof employment are \ncompleted accurately \nand legibly \n3.2  Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3  Errors in recording \ninformation on forms/ \ndocuments are \nidentified and acted \nupon \n3.4  Reporting \nrequirements to \nsupervisor are \ncompleted according \nto organizational \nguidelines \n3.1 Effective verbal and \nnon-verbal \ncommunication \n3.2 Different modes of \ncommunication  \n3.3 Workplace forms \nand documents \n3.4 Organizational/ \nWorkplace policies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities  \n \n \n3.1  Completing work- \nrelated \ndocuments \n3.2  Applying \noperations of \naddition, \nsubtraction, \ndivision and \nmultiplication \n3.3  Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n3.4  Applying Effective \nrecord keeping \nskills\n\n--- PDF PAGE 9 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          5 \n   RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \nMay include: \n1.1. \nTeam members \n1.2. \nSupervisor/Department Head \n1.3. \nSuppliers \n1.4. \nTrade personnel \n1.5. \nLocal government \n1.6. \nIndustry bodies \n2. Medium \nMay include: \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation dissemination \n2.5. \nFollow-up or verbal instructions \n2.6. \nFace-to-face communication \n2.7. \nElectronic media (disk files, cyberspace) \n3. Storage \nMay include: \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Workplace interactions \nMay include: \n4.1. \nFace-to-face \n4.2. \nTelephone \n4.3. \nElectronic and two-way radio \n4.4. \nWritten including electronic means, memos, \ninstruction and forms \n4.5. \nNon-verbal including gestures, signals, signs and \ndiagrams \n5. Forms \nMay include: \n5.1. \nHR/Personnel forms, telephone message forms, \nsafety reports\n\n--- PDF PAGE 10 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          6 \n \n   EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared written communication following standard \nformat of the organization \n1.2 Accessed information using workplace communication \nequipment/systems \n1.3 Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4 Conveyed information effectively adopting formal or \ninformal communication \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Fax machine \n2.2 Telephone \n2.3 Notebook \n2.4 Writing materials \n2.5 Computer with Internet connection \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with oral questioning  \n3.2 Interview  \n3.3 Written test \n3.4 Third-party report \n4. Context for \nAssessment \n4.1 \nCompetency may be assessed individually in the \nactual workplace or through an accredited institution\n",
