        "source_text": "--- PDF PAGE 70 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          66 \nUNIT OF COMPETENCY \n: FABRICATE AN ANKLE-FOOT ORTHOSIS \n \n \n \nUNIT CODE \n: HHC321309 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto manufacture an ankle-foot orthosis. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Confirm \nprescription / \nspecifications \nof the device \n1.1 Prescription received \nin accordance with \nestablished \ndocumentation \nprocedures \n1.2 Prescription verified in \naccordance with \ndocumentation \nprocedure \n1.3 Prescription logged in \naccordance \ndocumentation \nprocedures \n1.1 Reporting \n1.2 Reporting process \n1.3 Verbal \ncommunication \n1.4 Office protocol \n1.5 Nomenclature of \northotic  devices \n1.6 Materials Science \n1.7 Prescription \nterminologies and \nformat \n1.1 Interpersonal \nSkills \n1.2 Communication \nSkills \n1.3 Record-keeping \n1.4 Reading Skills \n1.5Mathematical Skills \n2. Request tools \nand materials \n2.1 Request form filled-\nup in accordance to \nform design \n2.2 Availability of tools \nand materials verified \nin accordance to \nstock inventory \n2.3 Materials received in \naccordance with the \nrequest form \n2.1 Institutional policies, \nguidelines and \nprocedures \n2.2 Forms \n2.3 Tool and Materials  \n2.4 Vacuum forming \nprocess and \nprinciples \n2.5 Use of vacuum \nstation \n \n2.1 Interpersonal \nSkills \n2.2 Communication \nSkills \n2.3 Record-keeping \n2.4 Following Safety \nManual \n2.5 Identifying and \ncontrolling \nhazard/risks  \n2.6 Reading skills to \naccess industry \ninformation \n2.7 Verification skills \n3. Prepare an \nankle-foot \northosis \npositive cast \nfor fabrication \n \n3.1 Positive cast is \nensured free of \nbumps and sharp \nedges in accordance \nto thermoforming \npreparation \nprocedure \n3.2 Positive cast \npositioned the in the \nvacuum pipe securely \nin accordance to \nthermoforming \npreparation \nprocedure \n3.3 Vacuum suction \nchecked following the \nrequired pressure \n(PSI) \n3.1 Vacuum forming \nprocess and \nprinciples \n3.2 Use of vacuum \nstation \n \n3.1 Following Safety \nManual  \n3.2 Identifying and \ncontrolling \nhazard/risks  \n3.3 Vacuum forming \nskills \n3.1 Ability to follow \ncorrect \nprocedures and \ninstructions\n\n--- PDF PAGE 71 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          67 \n4. Thermoform \nhard plastic \ncomponent of   \nan ankle-foot \northosis \n4.1 Positive mold \npositioned to the \nvacuum pipe \nfollowing the \nthermoforming \nprocedure \n4.2 Vacuum suction was \ntested before actual \nthermoforming \n4.3 Materials prepared \naccording to \nprescribed \ndimensions \n4.4 Plastic vacuum \nformed the to the \npositive mold \nfollowing the \nthermoforming \nprocedure \n4.5  Ankle-foot orthosis \nshell checked for \ncooling and setting \nfollowing the \nthermoforming \nprocedure \n4.6 Ankle-foot orthosis \nshell dismounted \nfrom the vacuum \nforming station \n4.7 All machines used \nturned off after the \nfabrication following \nthe equipment \nmanual \n4.8 Tools returned to \ntheir designated \ncabinets following \ninstitutional \nprocedures \n4.1 Types and \nthickness of Plastics \n4.2 Principles of \nthermoforming \n4.3 Curing of Plastic \n4.4 Use of tools, \nmaterials and \nequipment \n \n4.1 Thermoforming \nskills  \n4.2 Following Safety \nManual  \n4.3 Identifying and \ncontrolling \nhazard/risks  \n4.4 Ability to handle \noperating \ntools/equipment/m\naterials \n4.5 Ability to follow \ncorrect procedures \nand instructions \n5. Cut and grind \nthe plastic \naccording to \nprescribed \ntrimlines \n5.1 Ankle-foot orthosis \nshell cut according to \nthe prescribed \ntrimlines \n5.2 Plaster removed \ninside the ankle-foot \northosis shell \n5.3 Ankle-foot orthosis \nshell trimlines \nsmoothened \naccording to \nprescribed trimlines  \n5.4 Turned off all \nmachines used \nduring the fabrication \n5.5 Tools returned to \ntheir designated \ncabinets \n5.1 Cutting and grinding \ntool and equipment \n5.2 Operation of dust \ncollection system \n5.3 Use of cutting and \ngrinding tools and \nequipment \n \n5.1 Following Safety \nManual  \n5.2 Identifying and \ncontrolling \nhazard/risks  \n5.3 Ability to handle \ncutting and \ngrinding \ntools/equipment \n5.4 Ability to follow \ncorrect procedures \nand instructions\n\n--- PDF PAGE 72 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221     Promulgated (05/2021)          68 \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Confirmed prescription / specifications of the device \n1.2 Requested tools and supplies \n1.3 Prepared an ankle-foot orthosis positive cast for fabrication \n1.4 Thermoformed hard plastic component of ankle-foot \northosis  \n1.5 Cut and grinded the plastic according to prescribed \ntrimlines \n1.6 Prepared straps according to patient measurements \n1.7 Stored ankle-foot orthosis properly until fitting date \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Workshop appropriate for the unit of competency \n2.2 Tools, materials and equipment, appropriate for the unit of \ncompetency \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with questioning \n3.2 Observation with questioning \n3.3 Written Examination \n3.4 Interview \n4. Context of \nAssessment \n4.1 Competency may be assessed in the actual workplace or at \nthe designated TESDA Accredited Assessment Center. \n \n \n \n6. Prepare straps \naccording to \npatient \nmeasurements \n6.1 Cut appropriate \nwebbing and velcros \nfollowing the patient \nmeasurements \n6.2 Sew webbing and \nVelcros together in \naccordance to straps \nfabrication procedure \n6.3 Place attachment \nholes in the straps \nfollowing the desired \nmeasurements  \n6.1 Basic computation \n(i.e., addition, \nsubtraction, \nmultiplication and \ndivision) \n6.2 Basic principles of \nsewing \n6.3 Use of sewing \nmachine and  \nsoldering iron  \n6.1 Sewing skills \n6.2 Identifying and \ncontrolling \nhazard/risks  \n6.3 Ability to handle \noperating \ntools/equipment/m\naterials \n6.4 Ability to follow \ncorrect procedures \nand instructions \n7. Store ankle-\nfoot orthosis \nproperly until \nfitting date \n7.1 Ankle-foot orthosis \nproperly labeled \nfollowing device safe \nkeeping process \n7.2 Ankle-foot orthosis \nplaced in safe and \nsecure environment \nsafe keeping process \n7.3 Ankle-foot orthosis \nreadiness is \ncoordinated following \ninstitutional \nprocedures \n7.1 Written \ncommunication \n7.2 Recording \n \n7.1 Communication \nSkills \n7.2 Record-keeping \n7.3 Reading Skills \n7.4 Writing Skills \n7.5 Ability to handle \noperating \ntools/equipment\n",
