n in accordance with\nestablished documentation procedures\n•\nVerify prescription according to\nestablished documentation procedures\n•\nLog prescription in accordance to\nestablished documentation procedures\n•\nDemonstrate interpersonal skills\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping\n•\nDemonstrate reading skills\n•\nFollow manufacturer ‘s specification\n• Interactive Lecture\n• Small Group\nDiscussion\n• Written Exam\n• Practical Exam\n4 hours\n7.2 Perform the\nnecessary repair\nor replacement\nneeded\naccording to the\nspecification\nLecture and discussion on the following:\n• Tools\n• Equipment\n• Use of prosthetic components\n• Use of tools and equipment\nPerform the following tasks:\n•\nInteractive Lecture\n•\nDemonstration and\nReturn\nDemonstration\n• Written Exam\n• Practical Exam\n4 hours\n\n--- PDF PAGE 137 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 133\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethods\nNominal\nDuration\n•\nOrder replacement part/s or materials\naccording to Orthotist’s orders\n•\nConfirm order of replacement part/s\n•\nPerform the replacement needed\naccording to the specifications and P&O\norders\n•\nFollow safety manual\n•\nIdentify and control hazard/risks\n•\nDemonstrate reading skills\n•\nDemonstrate writing skills\n•\nDemonstrate repair skills\n\n7.3 Secure the\ndevice for\nfunctionality and\nsafety\nLecture and discussion on the following:\n•\nReporting\n•\nReporting process\n•\nVerbal communication and division)\n•\nUse of prosthetic components\nPerform the following tasks:\n•\nSecure all bolts and components\n•\nTest for safety and functionality of the\ndevice according to specifications\n•\nSend the repaired device to the Orthotist\n•\nDemonstrate interpersonal skills\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping\n•\nDemonstrate reading skills\n•\nDemonstrate safe manual handling\n\n• Interactive Lecture\n• Demonstration and\nReturn\nDemonstration\n• Written Exam\n• Practical Exam\n8 hours\n\n--- PDF PAGE 138 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 134\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nand their variations/components may be adopted singly or in combination with\nother modalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n● Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n● Supervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative\nthat the deployment of trainees in the workplace is adhered to training\n\n--- PDF PAGE 139 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 135\nprograms agreed by the institution and enterprise and status and\nprogress of trainees are closely monitored by the training institutions to\nprevent opportunity for work exploitation.\n\n● The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\n● Community-based is short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training\nprogram (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the\nfollowing requirements:\n\n• Must have completed at least 10 years basic education or a Holder of\nAlternative Learning Systems (ALS) certificate of completion with grade\n10 equivalent holder; and\n• Must possess good communication skills\n\n* Note: PWDs are accepted unless safety is compromised\n\n--- PDF PAGE 140 ---\nAssistive Rehabilitation Technology Services (Orthotics) NC II - HHCARO221 Promulgated (05/2021) 136\n\n3.4\nTOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 24\ntrainees for Assistive Rehabilitation Technology Services (Orthotics) Nc II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices and\ntheir availability in the local market.\n\nEQUIPMENT\n\nQTY\nUNIT\nSPECIFICATION/DESCRIPTION\n2\npc\nProjector + White Screen OR Television set for lectures\n2\nset\nMicrophone and speakers\nAppropriate for room area\n3\nunits\nStorage Cabinet (2 Door; For tools, devices and materials)\n2\npcs\nAlignment Jig\n2\npcs\nAnvil\n1\npcs\nBench grinder\n5\npcs\nBench vise\n1\nunit\nDrill press\n1\nunit\nDust collection system\n1\nunit\nOven (C