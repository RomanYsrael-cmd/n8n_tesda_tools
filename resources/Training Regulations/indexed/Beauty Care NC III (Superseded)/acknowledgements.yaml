      "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 To attain the National Qualification of BEAUTY CARE NC III, the candidate must demonstrate competence in all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 Individuals aspiring to be awarded the qualification of BEAUTY CARE NC III, must acquire Certificates of Competency in all of the following individual core units of the Qualification. Candidates may apply for assessment in any accredited assessment center."
    },
    {
      "source_text": "4.2.1 Perform temporary hair removal activity 4.2.2 Perform body bleach 4.2.3 Perform creative nail design"
    },
    {
      "source_text": "4.3 Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate."
    },
    {
      "source_text": "4.4 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.5 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.5.1 Graduates of formal, non-formal and informal including enterprise-based training programs 4.5.2 Experienced workers (wage employed or self employed)"
    },
    {
      "source_text": "4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”."
    },
