    {
      "source_text": "UNIT OF COMPETENCY : APPLY QUALITY STANDARDS"
    },
    {
      "source_text": "UNIT CODE : HCS515204"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed to apply quality standards in the workplace. The unit also includes the application of relevant safety procedures and regulations, salon/organizational procedures and other client requirements."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Assess clients service needs"
    },
    {
      "source_text": "1.1 Work instruction is obtained and work is carried out in accordance with standard operating procedures. 1.2 Client’s needs are checked against workplace standards and specifications. 1.3 Faults on clients and any identified causes are recorded and/or reported to the supervisor concerned in accordance with workplace procedures. 1.4 Clients profile and service extended to them are documented in accordance with workplace procedures. 2. Assess own work 2.1 Documentation relative to quality within the company is identified and used. 2.2 Completed work is checked against workplace standards relevant to the task undertaken. 2.3 Errors are identified and improved on. 2.4 Information on the quality and other indicators of individual performance is recorded in accordance with workplace procedures. 2.5 In cases of deviations from specific quality standards, causes are documented and reported in accordance with the workplace’ standard operating procedures. 3. Engage in quality improvement 3.1 Process improvement procedures are participated in relative to workplace assignment. 3.2 Work is carried out in accordance with process improvement procedures. 3.3 Performance of operation or quality of product of service to ensure other client satisfaction is monitored."
    },
    {
      "source_text": "-- PDF PAGE 32 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "28 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. External Clients"
    },
    {
      "source_text": "May include but not limited to: 1.1 Teenagers 1.2 Adult Men 1.3 Working Adult 1.4 Child 2. Faults May include but not limited to: 2.1 Client not satisfied 2.2 Desired result is not within the desired result of client 2.3 Procedures done but do not conform with any Salon policies and procedures 2.4 Damaged caused to client 3. Documentation 3.1 Organization Work Procedures 3.2 Manufacturer’s Instruction Manual 3.3 Client Requirements 3.4 Forms 4. Errors May be related to the following: 4.1 Deviation from the requirements of the client 4.2 Deviation from the requirements of the salon/organization 5. Quality Standards May be related but not limited to the following: 5.1 Supplies and Materials 5.2 Facilities 5.3 Salon Product 5.4 Service Processes and Procedures 5.5 Client Service 5.6 Environmental Regulations 6. Client 6.1 Co-worker 6.2 Supplier/Vendor 6.3 Client 6.4 Organization receiving the product or service"
    },
    {
      "source_text": "-- PDF PAGE 33 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "29 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Carried out work in accordance with the company’s standard operating procedures. 1.2 Performed task according to specifications. 1.3 Reported errors or deviations not in accordance with standard operating procedures. 1.4 Carried out work in accordance with the process improvement. 2. Underpinning knowledge and attitudes 2.1 Relevant Production Processes, Materials and Products 2.2 Characteristics of Materials, Software and Hardware Used in Production Processes 2.3 Quality Checking Procedures 2.4 Client Relations 2.5 Work Place Procedures 2.6 Safety and Environmental Aspects of Service Processes 2.7 Error Identification and Reporting 2.8 Quality Improvement Processes 3. Underpinning skills 3.1 Reading skills required to interpret work instructions, product manufacturer’s requirements 3.2 Communication skills needed to interpret and apply defined work procedures 3.3 Carry out work in accordance with OHS policies and procedures 3.4 Critical thinking 3.5 Solution providing and decision making 3.6 Interpersonal skills or dealing with varied type of clients 4. Resource implications The following resources MUST be provided: 4.1 Materials 4.2 Product 4.3 Equipment 5. Method of assessment Competency may be assessed through: 5.1 Observation with questioning 5.2 Third Party Report 5.3 Practical Demonstration with questioning 6. Context of assessment 6.1 Assessment may be conducted in the workplace or in a simulated environment."
    },
    {
