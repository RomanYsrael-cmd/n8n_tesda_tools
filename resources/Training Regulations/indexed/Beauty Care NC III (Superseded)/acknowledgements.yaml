    },
    {
      "source_text": "UNIT OF COMPETENCY : MANAGE OWN PERFORMANCE"
    },
    {
      "source_text": "UNIT CODE : HCS516202"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in effectively managing own workload and quality of work."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Plan for completion of own workload"
    },
    {
      "source_text": "1.1 Tasks accurately identified. 1.2 Priority allocated to each task. 1.3 Time lines allocated to each task or series of tasks. 1.4 Tasks deadlines known and complied with whenever possible. 1.5 Work schedules are known and completed within agreed time frames. 1.6 Work plans developed according to assignment requirements and employer policy. 1.7 Uncompleted work or tasks detailed and responsibility for completion passed to incoming shift or other appropriate persons. 2. Maintain quality of own performance 2.1 Personal performance continually monitored against agreed performance standards. 2.2 Advice and guidance sought when necessary to achieve or maintain agreed standards. 2.3 Guidance from management applied to achieve or maintain agreed standards. 2.4 Standard of work clarified and agreed according to employer policy and procedures. 3. Build credibility with customers/clients 3.4 Client expectations for reliability, punctuality and appearance adhered to. 3.5 Possible causes of client/customer dissatisfaction identified, dealt with and recorded according to employer policy. 3.6 Client fully informed of all relevant security matters in a timely manner and according to agreed reporting procedures."
    },
    {
      "source_text": "-- PDF PAGE 29 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "25 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Tasks 1.1 May identified through: 1.1.1 Assignment instructions 1.1.2 Verbal Instructions by senior officer 1.1.3 Policy Documents 1.1.4 Duty Statements 1.1.5 Self Assessment 1.2 May be: 1.2.1 Daily tasks 1.2.2 Weekly tasks 1.2.3 Regularly or irregularly occurring tasks 2. Performance Standards May include: 2.1 Assignment Instructions 2.2 Procedures established in policy documents"
    },
    {
