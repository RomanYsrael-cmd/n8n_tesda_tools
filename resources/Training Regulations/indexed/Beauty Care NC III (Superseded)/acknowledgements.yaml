    },
    {
      "source_text": "41 -"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PERFORM CREATIVE NAIL DESIGN"
    },
    {
      "source_text": "UNIT CODE : HCS515310"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in executing creative design on finger and toenails. This involves performing temporary hair removal activity, this involves preparing the client, cleaning of nails, apply desired and agreed creative design."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Prepare clients 1.1 Client is consulted on the type of nail service activity desired. 1.2 Client is consulted on possible health restrictions. 1.3 Treatment area, tools, equipment, supplies and materials are prepared for identified nail service activity according to OHSC requirements. 1.4 Client is advised on maintenance requirements, the advantages and disadvantages of the nail treatment. 1.5 Nail and skin condition are identified by physical and visual check and specific client requirements to be noted and adopt necessary safety precautions. 1.6 Contra-indications including infections and nail disorders are identified and referred to appropriate person for treatment according to D.O.H. rules and regulations. 1.7 Client is positioned safety and comfortably and provided with protective clothing material. 2. Perform cleaning and cutting of nails 2.1 Cuticles are pushed gently without damage to nail boarder following safety procedures. 2.2 Nails are disinfected, cleaned and dried completely. 2.3 Nails are cut and trimmed according to client requirements. 2.4 Tips are blended and shaped to achieve smooth and even finish according to salon standard. 2.5 Appropriate sterilized tools are used to perform the cleaning activity according to OHSC rules and regulations. 2.6 Fingernails are lightly massaged following prescribed movements. 2.7 First aid is applied / administered in case of accidental cuts and wounds. 3. Apply different creative designs 3.1 Nail products are applied according to manufacturer’s recommendation. 3.2 Client is consulted from time to time to ensure safety and comfort during the entire process. 3.3 If necessary, artificial nail area correctly applied using appropriate tools and equipment. 3.4 Results are checked to be correct well-balanced, smooth, neat and free from excess product on cuticle and nail walls. 3.5 Client is advised on after treatment care service."
    },
