      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Planned for completion of own workload. 1.2 Assessed verbal or written work plan through observation and discussion of site and employer requirements. 1.3 Demonstrated capacity to complete task within specified time frame. 1.4 Maintained quality of own performance. 2. Underpinning knowledge and attitudes 2.1 Site and assignment requirements 2.2 Employer policy on performance management 2.3 Indicators of appropriate performance for each area of responsibility 2.4 Steps for improving or maintaining performance 3. Underpinning skills 3.1 Capacity to plan and prioritize security work loads and requirements 3.2 Time and task management 4. Resource implications The following resources MUST be provided: 4.1 Assessment Centers/Venues 4.2 Accredited Assessors 4.3 Modes of Assessment 4.4 Evaluation Reports 4.5 Access to a relevant venue, equipment and materials 4.6 Assignment Instructions 4.7 Logbooks 4.8 Operational manuals and makers’/customers’ instructions (if relevant) 4.9 Assessment Instruments, including personal planner and assessment record book 5. Method of assessment Competency may be assessed through: 5.1 Written Test/Examination 5.2 Demonstration with questioning 5.3 Observation with questioning 6. Context of assessment 6.1 Company 6.2 On-Site 6.3 Assessment activities are carried out through TESDA accredited assessment centers/venues by using closely simulated workplace environment. 6.4 Continuous assessment in an institutional setting that stimulates the conditions of performance describe in the elements, performance criteria and range of variables statement that make up this unit. 6.5 Continuous assessment in the workplace, taking into account the range of variables affecting performance. 6.6 Self-assessment on the same terms as those described above 6.7 Simulated assessment or critical incident assessment, provided that the critical incident involves assessment against performance criteria and an evaluation of underpinning knowledge and skill required to achieve the required performance criteria."
