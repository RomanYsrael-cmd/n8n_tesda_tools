    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Consulted client on desired creative nail service activity. 1.2 Selected necessary tools, equipment, supplies and materials based on specific nail service activity following OHSC requirements. 1.3 Checked and assessed nail, skin condition and adopt necessary safety procedures according to clients’ specific requirements and DOH rules and regulations. 1.4 Positioned client comfortably and safety and provide appropriate protective clothing materials. 1.5 Cleaned and disinfected nails making sure that cuticles are pushed gently without damaging nail borders. 1.6 Cut and trimmed nails. 1.7 Nail ornaments are applied following manufacturers instructions. 1.8 Checked results and applied necessary retouches according to the clients desired outcome. 1.9 Applied appropriate treatment on accidental cuts. 2. Underpinning knowledge and attitudes 2.1 Different Nail Designs 2.2 Type of Nail Polish 2.3 Code of Ethics 2.4 Types of Skin and Nail Condition 2.5 DOH Rules and Regulations 2.6 OHSC Requirements 2.7 Massage Movements 2.8 Nail and Skin Condition Analysis 2.9 Salon Policies / Procedures 2.10 Different Nail Cutting Tools 2.11 Different Nail Designing Tools"
