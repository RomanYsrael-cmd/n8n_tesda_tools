    {
      "source_text": "30 -"
    },
    {
      "source_text": "UNIT OF COMPETENCY : MAINTAIN A SAFE, CLEAN AND EFFICIENT WORK ENVIRONMENT"
    },
    {
      "source_text": "UNIT CODE : HCS515205"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed to maintain client relations. The unit incorporates the work safety guidelines. It encompasses competencies necessary to maintain a safe workplace for staff, clients and others. It also involves the application of health regulations, including personal hygiene practiced by staff members, provision of a caring client environment and the efficient operation of the salon."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Comply with health regulations 1.1 Salon policies and procedures for personal hygiene applied. 1.2 Procedures and practices implemented in a variety of salon situations in accordance with state and local government health regulations. 2. Assess own work 2.1 Reception, work areas and walkways maintained in a safe, uncluttered and organized manner according to salon policy. 2.2 All routines carried out safely, effectively with minimum inconvenience to clients and staff. 2.3 Waste is stored and disposed of according to OHSC requirements. 2.4 Spills, food, waste, hair or potential hazards promptly removed from floors according to salon policy. 2.5 Spills, food, waste, hair or other potential hazards promptly removed from floors according to salon policy. 2.6 Linen is stored, cleaned and disinfected in line with OHS requirements and salon procedures. 2.7 Refreshments are provided to all clients. 3. Check and maintain tools and equipment 3.1 Tools and equipment are stored safely and in position to comply with salon requirements and local health regulations. 3.2 Tools and equipment are prepared for specific services as required. 3.3 Tools and equipment are checked for maintenance requirements. 3.4 Tools and equipment are referred for repair as required. 4. Check and maintain stocks"
    },
    {
      "source_text": "4.1 Stock rotation procedures are carried out routinely and accurately according to salon procedures. 4.2 Stock levels are accurately recorded according to salon procedures. 4.3 Under or over supplied stock items are notified immediately to the salon supervisor. 4.4 Incorrectly ordered or delivered stock is referred to the salon supervisor for return to supplier. 4.5 Safe lifting and carrying techniques maintained in line with salon occupational health and safety policy and government legislation. 5. Provide a relaxed and caring environment 5.1 Clients are made to feel comfortable according to salon policy. 5.2 Clients needs are reported to. 5.3 Clients are consulted on specific desired service."
    },
    {
      "source_text": "-- PDF PAGE 35 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "31 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Relevant Salon Policies and Procedures"
    },
    {
      "source_text": "May include but not limited to: 1.1 Hazard Policies and Procedures 1.2 Emergency, Fire and Accident Procedures 1.3 Personal Safety Procedures 1.4 Procedures for the use of Personal protective Clothing and Equipment 1.5 Hazard Identification 1.6 Job Procedures 2. Occupational Health and Safety Procedures May include but not limited to: 2.1 Client 2.2 Staff 2.3 Equipment/Tools 2.4 Premises 2.5 Stock 3. Unsafe Situations May include but not limited to: 3.1 Damaged Packaging Material or Containers 3.2 Broken or Damaged Equipment 3.3 Inflammable Materials and Fire Hazards 3.4 Lifting Practices 3.5 Spillages 3.6 Waste including hair especially on floors 3.7 Trolleys 4. Linkage May be related to the following: 4.1 Institutional 4.2 Organizational Linkage 4.3 Social Services 4.4 International Market"
    },
    {
      "source_text": "-- PDF PAGE 36 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "32 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Generated information on different client requirements and needs. 1.2 Selected and used strategies to accurately analyzed the client requirements. 1.3 Assessed current product and services as against client demand. 1.4 Identified avenues to establish relevant linkage. 1.5 Selected promotional activities relevant to enhance competitiveness of salon. 1.6 Assisted clients on specific desired services. 1.7 Checked and prepared tools for the specific salon activities. 2. Underpinning knowledge and attitudes 2.1 Media Options 2.2 Data Gathering 2.3 Salon Policies 2.4 International Market 2.5 Skills Competition Rules and Procedures 2.6 New Trends in Products and Services 2.7 Ethical Limitations 3. Underpinning skills 3.1 Communication skills to identify lines of communication, request advice, follow instructions and receive feedback. 3.2 Technology Skills 3.3 Interpersonal Skills 4. Resource implications The following resources MUST be provided: 4.1 Client 4.3 Relevant Information 4.4 Appropriate Products 5. Method of assessment Competency MUST be assessed through: 5.1 Observation with questioning 5.2 Practical Demonstration with questioning 6. Context of assessment 6.1 Assessment may be conducted in the workplace or in a simulated environment."
    },
