    },
    {
      "source_text": "CORE COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PERFORM TEMPORARY HAIR REMOVAL ACTIVITY"
    },
    {
      "source_text": "UNIT CODE : HCS515308"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in performing temporary hair removal activity. This involves preparing the client, and shaving and tweezing on desired and agreed part perform cold and hot waxing."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Prepare clients 1.1 Client is consulted on the specific area to be treated and desired hair removing method. 1.2 Client is advised to remove personal accessories to achieve optimum service result. 1.3 Necessary tools, supplies, materials and hair removing product are prepared according to OHSC requirements. 1.4 Client is provided with protective clothing and positioned in a comfortable manner. 1.5 Skin condition where hair is to be removed is checked thoroughly. 2. Perform shaving and tweezing 2.1 Plucking or tweezing and shaving tools are sterilized and used according to OHSC requirements. 2.2 Hair is shaved following direction of the hair strands and growth. 2.3 Antiseptic is applied on the area to be shaved according to OHSC requirements. 3. Perform cold waxing 3.1 Skin test is performed on hairless section and if found favorable, area is applied with depilatories using standard application method according to OHSC requirements. 3.2 Prescribed timeline is followed according to thickness of hair to be removed. 3.3 The area is washed off with lukewarm water dried up and applied with cold cream. 3.4 A strip of cotton cloth or cellophane is used to firmly press down the wax to adhere correctly. 4. Perform hot waxing"
    },
    {
      "source_text": "4.1 Client is positioned in a correct manner to avoid any error or accident (like burns). 4.2 Wax is put to boiling point to melt completely according to OHSC requirements. 4.3 Temperature and consistency is tested by applying a little portion of wax depilatories on the clients desired area to be wax. 4.4 Wax is spread evenly over the surface using application method with spatula and allowed to harden. 4.5 Wax is quickly pulled off against the direction of the hair growth and tested area is gently massaged afterwards. 4.6 Skin surface is washed with mild soap and water, dried up and applied with talcum powder. 4.7 Residue on the treated area is removed and applied with emollient cream or antiseptic lotion."
    },
    {
      "source_text": "-- PDF PAGE 38 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "34 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Skin Area To Be Shaved 1.1 Eyebrow 1.2 Lower lips 1.3 Armpit 1.4 Nape area 1.5 Cheeks 1.6 Upper lips 1.7 Chin 1.8 Stubbles 1.9 Upper legs 1.10 Navel 1.11 Chest 1.12 Moustache 2. Application Method 2.1 Direct 2.2 Indirect 2.3 Use of Appropriate Tools 3. Tools 3.1 Blade 3.2 Razors 3.3 Stainless Bowl 3.4 Spatula 3.5 Flat Wood (Tongue Depressor) 3.6 Mixing Stick 3.7 Shaver 4. Supplies and Materials 4.1 Wax 4.2 Emollient cream 4.3 Antiseptic 4.4 Cotton 4.5 Tissue Paper 5. Types of Wax 5.1 Natural preparation 5.2 Commercial 6. Skin Hair Removing Method 6.1 Shaving 6.2 Waxing 6.2.1 Hot Waxing 6.2.2 Cold Waxing 6.3 Tweezing or Plucking 6.4 Threading 7. Skin Condition 7.1 Normal 7.2 With Cuts or Abrasions 7.3 With Rashes 7.4 Dry 8. Protective Clothing 8.1 Gauze Mask 8.2 Bath Towel 8.3 Face Towel 8.4 Head Band 8.5 Smock Gown 8.6 Apron 9. Personal Accessories 9.1 Wrist Watch 9.2 Anklet 9.3 Bangles 9.4 Rings"
    },
    {
      "source_text": "-- PDF PAGE 39 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "35 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Checked and analyzed the condition of the skin surface where hair is to be removed. 1.2 Prepared and used tools, equipment, supplies and materials according to OHSC requirements. 1.3 Shaved hair according to the direction of the growth of hair. 1.4 Applied emollient cream on the area surrounding the treated area. 1.5 Conducted skin test to determine tolerance level of the sensitivity of the client. 1.6 Observed appropriate timeline to achieve optimum result of the treatment. 1.7 Consulted client on a regular basis during the entire process to ensue safety and comfort. 1.8 Applied wax and leave on until it hardens following manufacturer’s instruction. 1.9 Taut skin with one hand while the other hand firmly holds on the wax strip. 1.10 Pulled off wax with fast movement following the opposite direction of the hair growth. 2. Underpinning knowledge and attitudes 2.1 Code of Ethics 2.2 Application Method 2.3 Types of Emollient Cream 2.4 Types of Antiseptic Lotion 2.5 D.O.H. Rules and Regulations 2.6 OHSC Rules and Regulations 2.7 Types of Wax 2.8 Salon Rules and Regulations 2.9 Clients Medical Restrictions 3. Underpinning skills 3.1 Negotiating Skills 3.2 Applying correct technique 3.3 Conducting proper skin test 3.4 Regulating wax heat 3.5 Communication skills 3.6 Applying appropriate skin product 3.7 Using appropriate tools, supplies and materials 4. Resource implications The following resources MUST be provided: 4.1 Live Model 4.2 Tools and Equipment 4.3 Appropriate Supplies and Materials 4.4 Simulated or actual Workplace 5. Method of assessment Competency may be assessed through: 5.1 Direct Observation with Questioning 5.2 Demonstration with Questioning 5.3 Written test 6. Context of assessment 6.1 Competency may be assessed in the workplace or accredited assessment center."
    },
    {
      "source_text": "-- PDF PAGE 40 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "36 -"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PERFORM BODY BLEACH"
    },
    {
      "source_text": "UNIT CODE : HCS515309"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in performing body leach. This includes preparing the client, preparing the mixture, actual application of bleach on the body, perform checking and retouch on the treated area."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Prepare client 1.1 Client skin condition and types are checked and analyzed through skin test following DOH rules and regulations. 1.2 All possible skin areas for bleaching are discussed with the client. 1.3 All potential precautions or skin reactions are thoroughly explained to the client. 1.4 Client is advised to remove personal accessories to achieve optimum service result. 1.5 Client is positioned comfortably according to desired body parts to be bleached. 1.6 Protective clothing and materials are provided to the client. 2. Prepare mixture of bleaching product 2.1 Quantity and proper mixture are defined according to body size and skin parts following bleaching product specification. 2.2 Quantity is determined according to body size and skin parts. 2.3 Protective clothing material is worn during the preparation of the mixture. 2.4 Correct mixing technique and process is applied to achieve required product effectiveness. 3. Apply bleaching product 3.1 Mixed product is applied using bare hand on the part of the body starting from the upper portion to the lower body part. 3.2 Necessary tools, supplies and materials are used in the application of bleaching product following OHSC requirements. 3.3 Bleached body parts are rinsed and applied with moisturizing product. 3.4 Bleaching area is covered with floor mat during the entire application process. 4.Perform checking and apply retouch 4.1 Results are assessed against clients desired outcome through physical touch and visual check. 4.2 Client is advised on appropriate body skin maintenance program. 4.3 Tools and materials used are stored at room temperature 4.4 Wastage is properly disposed according to OHSC requirements. 4.5 Bleaching activity is recorded for future reference."
    },
    {
      "source_text": "-- PDF PAGE 41 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "37 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Skin Types 1.1 Fair 1.2 White 1.3 Black 1.4 Porcelain 1.5 Brown or Mulatto 2. Skin Conditions 2.1 Normal 2.2 Dry 2.3 Oily 2.4 With Skin Abrasions 2.5 With Rashes 3. Skin Areas for Bleaching Application 3.1 Underarm 3.2 Arms/Legs 3.3 Face 3.4 Groin 3.5 Entire Body 3.6 Any identified dark spot 4. Bleaching is applied on the client in different position 4.1 Standing 4.2 Sitting 4.3 Lying 4.4 Prone 5. Tools 5.1 Bed 5.2 Bed Sheet 5.3 Stool 5.4 Measuring Spoon 5.5 Measuring Cup 5.6 Plastic / Porcelain Basin 5.7 Stirring Spoon 5.8 Mixing Bowl 5.9 Face Towel 5.10 Tint Brush or Soft Brush 6. Personal Accessories 6.1 Jewelries 6.2 Hair Band 6.3 Hairclips 6.4 Caps 6.5 Hair Pins 6.6 Any pierced items 7. Protective Clothing 7.1 Towel Bath 7.2 Bathrobe 7.3 Headband 7.4 Smock Gown 7.5 Gauze Mask 7.6 Face Towel 7.7 Slippers 7.8 Apron 8. Timeline 8.1 45 Mins. 8.2 60 Mins. Or 1 hour 9. Skin Maintenance Program 9.1 Frequent salon visit 9.2 Daily application of moisturizing cream/lotion 9.3 No exposure to direct sunlight 9.4 Use of sun block cream/lotion"
    },
    {
      "source_text": "-- PDF PAGE 42 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "38 -"
    },
    {
      "source_text": "10. Supplies/Materials 10.1 Lotion 10.2 Soap 10.3 Moisturizing Cream/Lotion 10.4 Shampoo 10.5 Conditioner 10.6 Whitening Lotion 10.7 Whitening Soap 11. Bleaching Products 11.1 Bleaching Powder (Henna) 11.2 Soap Chips 11.3 Hydrogen Peroxide (20 vol.) 11.4 Hydrogen Peroxide (10 vol.) 11.5 Ammonia 11.6 Egg White 11.7 Fresh Milk or Evaporated Milk 11.8 Calamansi Extract 12. Body Size 12.1 Small 12.2 Medium 12.3 Large 12.4 Extra Large 12.5 Litter Large"
    },
    {
      "source_text": "-- PDF PAGE 43 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "39 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Checked and analyzed skin type and condition. 1.2 Discussed different options involved in applying body bleaching. 1.3 Advised client on various chemical reactions and precautionary measures to be adopted during the entire process. 1.4 Positioned client comfortably during the entire process. 1.5 Observed time line for the bleaching activity. 1.6 Mixed product according to salon policies and bleaching product instructions. 1.7 Provided clients with protective clothing according to salon policies. 1.8 Applied bleaching product observing proper direction and appropriate technique. 1.9 Used necessary tools and equipment, Supplies and Materials. 1.10 Provided appropriate advices on skin maintenance program. 1.11 Disposed bleaching residues and sanitize workstation. 2. Underpinning knowledge and attittudes 2.1 Skin Types and Condition 2.2 Bleaching Mixture/Procedure 2.3 Time Management 2.4 Code of Ethics 2.5 Protective Clothing Materials 2.6 Salon Procedures and Policies 2.7 Ratio and Proportion 2.8 Mensuration and Calculations 2.9 Mixing Technique 3. Underpinning skills 3.1 Applying bleaching products 3.2 Using supplies and materials 3.3 Applying bleaching technique 3.4 Adopting mixture 3.5 Applying clients’ relation 3.6 Mixing bleaching product 3.7 Using appropriate tools 3.8 Applying the correct mensuration and calculation 4. Resource implications The following resources MUST be provided: 4.1 Live Model 4.2 Supplies/Materials 4.3 Body Skin Bleaching Products 4.4 Actual Work Station 5. Method of assessment Competency may be assessed through: 5.1 Demonstration with questioning 5.2 Direct observation with questioning 5.3 Written test 6. Context of assessment 6.1 Competency may be assessed in the workplace or accredited assessment center."
    },
    {
