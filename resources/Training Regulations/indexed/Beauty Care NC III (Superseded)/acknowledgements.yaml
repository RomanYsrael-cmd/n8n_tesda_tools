    {
      "source_text": "TRAINING REGULATIONS FOR BEAUTY CARE NC III"
    },
    {
      "source_text": "SECTION 1 BEAUTY CARE NC III QUALIFICATION"
    },
    {
      "source_text": "The BEAUTY CARE NC III Qualification consists of competencies that a person must achieve to perform temporary hair removal activity, perform body bleach and perform creative nail design."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "UNIT CODE BASIC COMPETENCIES 500311109 Lead workplace communication 500311110 Lead small teams 500311111 Develop and practice negotiation skills 500311112 Solve problems related to work activities 500311113 Use mathematical concepts and techniques 500311114 Use relevant technologies"
    },
    {
      "source_text": "UNIT CODE COMMON COMPETENCIES HCS515201 Maintain an effective relationship with clients/customers HCS515202 Manage own performance HCS515204 Apply quality standards HCS515205 Maintain a safe, clean and efficient work environment"
    },
    {
      "source_text": "UNIT CODE CORE COMPETENCIES HCS515308 Perform temporary hair removal activity HCS515309 Perform body bleach HCS515310 Perform creative nail design"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be:"
    },
    {
      "source_text": " Senior Beautician"
    },
    {
      "source_text": "-- PDF PAGE 6 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "2 -"
    },
    {
      "source_text": "SECTION 2 COMPETENCY STANDARDS"
    },
    {
      "source_text": "This section gives the details of the contents of the basic, common and core units of competency required in BEAUTY CARE NC III."
    },
    {
      "source_text": "BASIC COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION"
    },
    {
      "source_text": "UNIT CODE : 500311109"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to lead in the dissemination and discussion of ideas, information and issues in the workplace."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Communicate information about workplace processes 1.1 Appropriate communication method is selected. 1.2 Multiple operations involving several topics areas are communicated accordingly. 1.3 Questions are used to gain extra information. 1.4 Correct sources of information are identified. 1.5 Information is selected and organized correctly. 1.6 Verbal and written reporting is undertaken when required. 1.7 Communication skills are maintained in all situations. 2. Lead workplace discussions 2.1. Response to workplace issues is sought. 2.2. Response to workplace issues is provided immediately. 2.3. Constructive contributions are made to workplace discussions on such issues as production, quality and safety. 2.4. Goals/objectives and action plan undertaken in the workplace are communicated. 3. Identify and communicate issues arising in the workplace 3.1 Issues and problems are identified as they arise. 3.2 Information regarding problems and issues are organized coherently to ensure clear and effective communication. 3.3 Dialogue is initiated with appropriate personnel. 3.4 Communication problems and issues are raised as they arise."
    },
    {
      "source_text": "-- PDF PAGE 7 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "3 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Methods of communication 1.1 Non-verbal gestures 1.2 Verbal 1.3 Face to face 1.4 Two-way radio 1.5 Speaking to groups 1.6 Using telephone 1.7 Written 1.8 Internet"
    },
    {
      "source_text": "-- PDF PAGE 8 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "4 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Dealt with a range of communication/information at one time. 1.2 Made constructive contributions in workplace issues. 1.3 Sought workplace issues effectively. 1.4 Responded to workplace issues promptly. 1.5 Presented information clearly and effectively written form. 1.6 Used appropriate sources of information. 1.7 Asked appropriate questions. 1.8 Provided accurate information. 2. Underpinning knowledge and attitudes 2.1 Organization requirements for written and electronic communication methods 2.2 Effective verbal communication methods 3. Underpinning skills 3.1 Organize information 3.2 Understand and convey intended meaning 3.3 Participate in variety of workplace discussions 3.4 Comply with organization requirements for the use of written and electronic communication methods 4. Resource implications The following resources MUST be provided: 4.1 Variety of Information 4.2 Communication tools 4.3 Simulated workplace 5. Method of assessment Competency MUST be assessed through: 5.1 Direct Observation with questioning 5.2 Interview 6. Context of assessment 6.1 Competency may be assessed in the workplace or in simulated workplace environment 6.2 Assessment shall be observed while task are being undertaken whether individually or in-group"
    },
    {
      "source_text": "-- PDF PAGE 9 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "5 -"
    },
    {
      "source_text": "UNIT OF COMPETENCY : LEAD SMALL TEAMS"
    },
    {
      "source_text": "UNIT CODE : 500311110"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead small teams including setting and maintaining team and individual performance standards."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Provide team leadership 1.1 Work requirements are identified and presented to team members. 1.2 Reasons for instructions and requirements are communicated to team members. 1.3 Team members’ queries and concerns are recognized, discussed and dealt with. 2. Assign responsibilities 2.1 Duties, and responsibilities are allocated having regard to the skills, knowledge and aptitude required to properly undertake the assigned task and according to company policy. 2.2 Duties are allocated having regard to individual preference, domestic and personal considerations, whenever possible. 3. Set performance expectations for team members 3.1 Performance expectations are established based on client needs and according to assignment requirements. 3.2 Performance expectations are based on individual team members duties and area of responsibility. 3.3 Performance expectations are discussed and disseminated to individual team members. 4. Supervise team performance 4.1 Monitoring of performance takes place against defined performance criteria and/or assignment instructions and corrective action taken if required. 4.2 Team members are provided with feedback, positive support and advice on strategies to overcome any deficiencies. 4.3 Performance issues which cannot be rectified or addressed within the team are referenced to appropriate personnel according to employer policy. 4.4 Team members are kept informed of any changes in the priority allocated to assignments or tasks which might impact on client/customer needs and satisfaction. 4.5 Team operations are monitored to ensure that employer/client needs and requirements are met. 4.6 Follow-up communication is provided on all issues affecting the team. 4.7 All relevant documentation is completed in accordance with company procedures."
    },
    {
      "source_text": "-- PDF PAGE 10 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "6 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Work requirements 1.1 Client Profile 1.2 Assignment instructions 2. Team member’s concerns 2.1 Roster/shift details 3. Monitor performance 3.1 Formal process 3.2 Informal process 4. Feedback 4.1 Formal process 4.2 Informal process 5. Performance issues 5.1 Work output 5.2 Work quality 5.3 Team participation 5.4 Compliance with workplace protocols 5.5 Safety 5.6 Customer service"
    },
    {
      "source_text": "-- PDF PAGE 11 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "7 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Maintained or improved individuals and/or team performance given a variety of possible scenario. 1.2 Assessed and monitored team and individual performance against set criteria. 1.3 Represented concerns of a team and individual to next level of management or appropriate specialist and to negotiate on their behalf. 1.4 Allocated duties and responsibilities, having regard to individual’s knowledge, skills and aptitude and the needs of the tasks to be performed. 1.5 Set and communicated performance expectations for a range of tasks and duties within the team and provided feedback to team members. 2. Underpinning knowledge and attitudes 2.1 Company policies and procedures 2.2 Relevant legal requirements 2.3 How performance expectations are set 2.4 Methods of Monitoring Performance 2.5 Client expectations 2.6 Team member’s duties and responsibilities 3. Underpinning skills 3.1 Communication skills required for leading teams 3.2 Informal performance counseling skills 3.3 Team building skills 3.4 Negotiating skills 4. Resource implications The following resources MUST be provided: 4.1 Access to relevant workplace or appropriately simulated environment where assessment can take place 4.2 Materials relevant to the proposed activity or task 5. Method of assessment Competency may be assessed through: 5.1 Direct observations of work activities of the individual member in relation to the work activities of the group 5.2 Observation of simulation and/or role play involving the participation of individual member to the attainment of organizational goal 5.3 Case studies and scenarios as a basis for discussion of issues and strategies in teamwork 6. Context of assessment 6.1 Competency assessment may occur in workplace or any appropriately simulated environment. 6.2 Assessment shall be observed while task are being undertaken whether individually or in-group."
    },
    {
      "source_text": "-- PDF PAGE 12 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "8 -"
    },
    {
      "source_text": "UNIT OF COMPETENCY : DEVELOP AND PRACTICE NEGOTIATION SKILLS"
    },
    {
      "source_text": "UNIT CODE : 500311111"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to collect information in order to negotiate to a desired outcome and participate in the negotiation."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Plan negotiations 1.1 Information on preparing for negotiation is identified and included in the plan. 1.2 Information on creating non verbal environments for positive negotiating is identified and included in the plan. 1.3 Information on active listening is identified and included in the plan. 1.4 Information on different questioning techniques is identified and included in the plan. 1.5 Information is checked to ensure it is correct and up-to- date. 2. Participate in negotiations 2.1 Criteria for successful outcome are agreed upon by all parties. 2.2 Desired outcome of all parties are considered. 2.3 Appropriate language is used throughout the negotiation. 2.4 A variety of questioning techniques are used. 2.5 The issues and processes are documented and agreed upon by all parties. 2.6 Possible solutions are discussed and their viability assessed. 2.7 Areas for agreement are confirmed and recorded. 2.8 Follow-up action is agreed upon by all parties."
    },
    {
      "source_text": "-- PDF PAGE 13 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "9 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Preparing for negotiation 1.1 Background information on other parties to the negotiation 1.2 Good understanding of topic to be negotiated 1.3 Clear understanding of desired outcome/s 1.4 Personal attributes 1.4.1 self awareness 1.4.2 self esteem 1.4.3 objectivity 1.4.4 empathy 1.4.5 respect for others 1.5 Interpersonal skills 1.5.1 listening/reflecting 1.5.2 non verbal communication 1.5.3 assertiveness 1.5.4 behavior labeling 1.5.5 testing understanding 1.5.6 seeking information 1.5.7 self disclosing 1.6 Analytic skills 1.6.1 observing differences between content and process 1.6.2 identifying bargaining information 1.6.3 applying strategies to manage process 1.6.4 applying steps in negotiating process 1.6.5 strategies to manage conflict 1.6.6 steps in negotiating process 1.6.7 options within organization and externally for resolving conflict 2. Non verbal environments 2.1 Friendly reception 2.2 Warm and welcoming room 2.3 Refreshments offered 2.4 Lead in conversation before negotiation begins 3. Active listening 3.1 Attentive 3.2 Don’t interrupt 3.3 Good posture 3.4 Maintain eye contact 3.5 Reflective listening 4. Questioning techniques 4.1 Direct 4.2 Indirect 4.3 Open-ended"
    },
    {
      "source_text": "-- PDF PAGE 14 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "10 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrated sufficient knowledge of the factors influencing negotiation to achieve agreed outcome. 1.2 Participated in negotiation with at least one person to achieve an agreed outcome. 2. Underpinning knowledge and attitudes 2.1 Codes of practice and guidelines for the organization 2.2 Organizations policy and procedures for negotiations 2.3 Decision making and conflict resolution strategies procedures 2.4 Problem solving strategies on how to deal with unexpected questions and attitudes during negotiation 2.5 Flexibility 2.6 Empathy 3. Underpinning skills 3.1 Interpersonal skills to develop rapport with other parties 3.2 Communication skills (verbal and listening) 3.3 Observation skills 3.4 Negotiation skills 4. Resource implications The following resources MUST be provided: 4.1 Room with facilities necessary for the negotiation process 4.2 Human resources (negotiators) 5. Method of assessment Competency may be assessed through: 5.1 Observation/demonstration and questioning 5.2 Portfolio assessment 5.3 Oral and written questioning 5.4 Third party report 6. Context of assessment 6.1 Competency to be assessed in real work environment or in a simulated workplace setting."
    },
    {
      "source_text": "-- PDF PAGE 15 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "11 -"
    },
    {
      "source_text": "UNIT OF COMPETENCY : SOLVE PROBLEMS RELATED TO WORK ACTIVITIES"
    },
    {
      "source_text": "UNIT CODE : 500311112"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit of covers the knowledge, skills and attitudes required to solve problems in the workplace including the application of problem solving techniques and to determine and resolve the root cause of problems."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Identify the problem 1.1 Variances are identified from normal operating parameters; and product quality. 1.2 Extent, cause and nature are of the problem are defined through observation, investigation and analytical techniques. 1.3 Problems are clearly stated and specified. 2. Determine fundamental causes of the problem 2.1 Possible causes are identified based on experience and the use of problem solving tools / analytical techniques. 2.2 Possible cause statements are developed based on findings. 2.3 Fundamental causes are identified per results of investigation conducted. 3. Determine corrective action 3.1 All possible options are considered for resolution of the problem. 3.2 Strengths and weaknesses of possible options are considered. 3.3 Corrective actions are determined to resolve the problem and possible future causes. 3.4 Action plans are developed identifying measurable objectives, resource needs and timelines in accordance with safety and operating procedures. 4. Provide recommendation/s to manager 4.1 Report on recommendations is prepared. 4.2 Recommendations are presented to appropriate personnel. 4.3 Recommendations are followed-up, if required."
    },
    {
      "source_text": "-- PDF PAGE 16 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "12 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Analytical techniques 1.1 Brainstorming 1.2 Intuitions/Logic 1.3 Cause and effect diagrams 1.4 Pareto analysis 1.5 SWOT analysis 1.6 Gant chart, Pert CPM and graphs 1.7 Scattergrams 2. Problem 2.1 Non – routine process and quality problems 2.2 Equipment selection, availability and failure 2.3 Teamwork and work allocation problem 2.4 Safety and emergency situations and incidents 3. Action plans"
    },
    {
      "source_text": "3.1 Priority requirements 3.2 Measurable objectives 3.3 Resource requirements 3.4 Timelines 3.5 Co-ordination and feedback requirements 3.6 Safety requirements 3.7 Risk assessment 3.8 Environmental requirements"
    },
    {
      "source_text": "-- PDF PAGE 17 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "13 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Identified the problem. 1.2 Determined the fundamental causes of the problem. 1.3 Determined the correct / preventive action. 1.4 Provided recommendation to manager. These aspects may be best assessed using a range of scenarios / case studies / what ifs as a stimulus with a walk through forming part of the response. These assessment activities should include a range of problems, including new, unusual and improbable situations that may have happened. 2. Underpinning knowledge and attitudes 2.1 Competence includes a thorough knowledge and understanding of the process, normal operating parameters, and product quality to recognize non-standard situations 2.2 Competence to include the ability to apply and explain, sufficient for the identification of fundamental cause, determining the corrective action and provision of recommendations 2.2.1 Relevant equipment and operational processes 2.2.2 Enterprise goals, targets and measures 2.2.3 Enterprise quality, OHS and environmental requirement 2.2.4 Principles of decision making strategies and techniques 2.2.5 Enterprise information systems and data collation 2.2.6 Industry codes and standards 3. Underpinning skills 3.1 Using range of formal problem solving techniques 3.2 Identifying and clarifying the nature of the problem 3.3 Devising the best solution 3.4 Evaluating the solution 3.5 Implementation of a developed plan to rectify the problem 4. Resource implications 4.1 Assessment will require access to an operating plant over an extended period of time, or a suitable method of gathering evidence of operating ability over a range of situations. A bank of scenarios / case studies / what ifs will be required as well as bank of questions which will be used to probe the reason behind the observable action. 5. Method of assessment Competency may be assessed through: 5.1 Case studies on solving problems in the workplace 5.2 Observation The unit will be assessed in a holistic manner as is practical and may be integrated with the assessment of other relevant units of competency. Assessment will occur over a range of situations, which will include disruptions to normal, smooth operation. Simulation may be required to allow for timely assessment of parts of this unit of competency. Simulation should be based on the actual workplace and will include walk through of the relevant competency components. 6. Context of assessment 6.1 In all workplace, it may be appropriate to assess this unit concurrently with relevant teamwork or operation units."
    },
    {
      "source_text": "-- PDF PAGE 18 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "14 -"
    },
    {
      "source_text": "UNIT OF COMPETENCY : USE MATHEMATICAL CONCEPTS AND TECHNIQUES"
    },
    {
      "source_text": "UNIT CODE : 500311113"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in the application of mathematical concepts and techniques."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Identify mathematical tools and techniques to solve problem 1.1 Problem areas are identified based on given condition. 1.2 Mathematical techniques are selected based on the given problem. 2. Apply mathematical procedure/solution 2.1 Mathematical techniques are applied based on the problem identified. 2.2 Mathematical computations are performed to the level of accuracy required for the problem. 2.3 Results of mathematical computation is determined and verified based on job requirements. 3. Analyze results 3.1 Result of application is reviewed based on expected and required specifications and outcome. 3.2 Appropriate action is applied in case of error."
    },
    {
      "source_text": "-- PDF PAGE 19 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "15 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Mathematical techniques May include but are not limited to: 1.1 Four fundamental operations Measurements 1.2 Use/Conversion of units of measurements 1.3 Use of standard formulas 2. Appropriate action 2.1 Review in the use of mathematical techniques (e.g. recalculation, re-modeling) 2.2 Report error to immediate superior for proper action"
    },
    {
      "source_text": "-- PDF PAGE 20 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "16 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Identified, applied and reviewed the use of mathematical concepts and techniques to workplace problems. 2. Underpinning knowledge and attitudes 2.1 Fundamental operation (addition, subtraction, division, multiplication) 2.2 Measurement system 2.3 Precision and accuracy 2.4 Basic measuring tools/devices 3. Underpinning skills 3.1 Applying mathematical computations 3.2 Using calculator 3.3 Using different measuring tools 4. Resource implications The following resources MUST be provided: 4.1 Calculator 4.2 Basic measuring tools 4.3 Case Problems 5. Method of assessment Competency may be assessed through: 5.1 Authenticated portfolio 5.2 Written Test 5.3 Interview/Oral Questioning 5.4 Demonstration with questioning 6. Context of Assessment 6.1 Competency may be assessed in the work place or in a simulated work place setting."
    },
    {
      "source_text": "-- PDF PAGE 21 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "17 -"
    },
    {
      "source_text": "UNIT OF COMPETENCY : USE RELEVANT TECHNOLOGIES"
    },
    {
      "source_text": "UNIT CODE : 500311114"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and attitude required in selecting, sourcing and applying appropriate and affordable technologies in the workplace."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Study/select appropriate technology"
    },
    {
      "source_text": "1.1 Usage of different technologies is determined based on job requirements. 1.2. Appropriate technology is selected as per work specification. 2. Apply relevant technology"
    },
    {
      "source_text": "2.1 Relevant technology is effectively used in carrying out function. 2.2 Applicable software and hardware are used as per task requirement. 2.3 Management concepts are observed and practiced as per established industry practices. 3. Maintain/enhance relevant technology 3.1 Maintenance of technology is applied in accordance with the industry standard operating procedure, manufacturer’s operating guidelines and occupational health and safety procedure to ensure its operative ability. 3.2 Updating of technology is maintained through continuing education or training in accordance with job requirement. 3.3 Technology failure/ defect is immediately reported to the concern/responsible person or section for appropriate action."
    },
    {
      "source_text": "-- PDF PAGE 22 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "18 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Technology May include but are not limited to: 1.1 Office technology 1.2 Industrial technology 1.3 System technology 1.4 Information technology 1.5 Training technology 2. Management concepts May include but not limited to: 2.1 Real Time Management 2.2 KAIZEN or continuous improvement 2.3 5 S 2.4 Total Quality Management 2.5 Other management/productivity tools 3. Industry standard operating procedure 3.1 Written guidelines relative to the usage of office technology/equipment 3.2 Verbal advise/instruction from the co-worker 4. Manufacturer’s operating guidelines/ instructions 4.1 Written instruction/manuals of specific technology/equipment 4.2 General instruction manual 4.3 Verbal advise from manufacturer relative to the operation of equipment 5. Occupational health and safety procedure 5.1 Relevant statutes on OHS 5.2 Company guidelines in using technology/equipment 6. Appropriate action 6.1 Implementing preventive maintenance schedule 6.2 Coordinating with manufacturer’s technician"
    },
    {
      "source_text": "-- PDF PAGE 23 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "19 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Studied and selected appropriate technology consistent with work requirements. 1.2 Applied relevant technology. 1.3 Maintained and enhanced operative ability of relevant technology. 2. Underpinning knowledge and attitudes 2.1 Awareness on technology and its function 2.2 Repair and maintenance procedure 2.3 Operating instructions 2.4 Applicable software 2.5 Communication techniques 2.6 Health and safety procedure 2.7 Company policy in relation to relevant technology 2.8 Different management concepts 2.9 Technology adaptability 3. Underpinning skills 3.1 Relevant technology application/implementation 3.2 Basic communication skills 3.3 Software applications skills 3.4 Basic troubleshooting skills 4. Resource implications The following resources MUST be provided: 4.1 Relevant technology 4.2 Interview and demonstration questionnaires 4.3 Assessment packages 5. Method of assessment Competency may be assessed through: 5.1 Interview 5.2 Actual demonstration 5.3 Authenticated portfolio (related certificates of training/seminar) 6. Context of assessment 6.1 Competency may be assessed in actual workplace or simulated environment."
    },
    {
      "source_text": "-- PDF PAGE 24 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "20 -"
    },
    {
      "source_text": "COMMON COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : MAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS/CUSTOMERS"
    },
    {
      "source_text": "UNIT CODE : HCS516201"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in building and maintaining an effective relationship with clients, customers and the public."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Maintain a professional image"
    },
    {
      "source_text": "1.1 Uniform and personal grooming maintained to assignment requirements. 1.2 Personal presence maintained according to employer standards. 1.3 Visible work area kept tidy and uncluttered. 1.4 Equipment stored according to assignment requirements. 2. Meet client/customer requirements 2.1 Client requirements identified and understood by referral to the assignment instructions. 2.2 Client requirements met according to the assignment instructions. 2.3 Changes to client’s needs and requirements monitored and appropriate action taken. 2.4 All communication with the client or customer is clear and complies with assignment requirements. 3. Build credibility with customers/clients 3.1 Client expectations for reliability, punctuality and appearance adhered to. 3.2 Possible causes of client/customer dissatisfaction identified, dealt with and recorded according to employer policy. 3.3 Client fully informed of all relevant security matters in a timely manner and according to agreed reporting procedures."
    },
    {
      "source_text": "-- PDF PAGE 25 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "21 -"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Personal Presence"
    },
    {
      "source_text": "May include: 1.1 Stance 1.2 Posture 1.3 Body Language 1.4 Demeanour 1.5 Grooming 2. Employer Standards May include: 2.1 Standing Orders 3. Client Requirements May include: 3.1 Assignment Instructions 3.2 Post Orders 3.3 Scope to modify instructions/orders in light of changed situations 4. Assignment Instructions May be conveyed in: 4.1 Writing 4.2 Verbally 4.3 Electronically 5. Client’s Needs and Requirements May be detected by: 5.1 Review of the client brief and/or assignment instructions 5.2 Discussion with the client/customer 6. Appropriate Action May include: 6.1 Implementing required changes 6.2 Referral to appropriate employer personnel 6.3 Clarification of client needs and instructions 7. Customers May include: 7.1 All members of the public"
    },
    {
      "source_text": "-- PDF PAGE 26 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "22 -"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Maintained a professional image. 1.2 Interpreted client/customer requirements from information contained in the client brief and/or assignment instructions. 1.3 Dealt successfully with a variety of client/customer interactions. 1.4 Monitored and acted on changing client or customer needs. 1.5 Met client/customer requirements. 1.6 Built credibility with customers/clients. 2. Underpinning knowledge and attitudes 2.1 Uniform and personal grooming requirements of the employer and the client 2.2 Occupational Health and safety requirement for the assignment 2.3 Assignment Instructions 3. Underpinning skills 3.1 Attention to detail when completing client/employer documentation 3.2 Interpersonal and communication skills required in client contact assignments 3.3 Customer service skills required to meet client/customer needs 3.4 Punctuality 3.5 Customer Service 3.6 Telephone Technique 3.7 Problem Solving and Negotiation 3.8 Maintaining Records 4. Resource implications The following resources MUST be provided: 4.1 Assessment Centers/Venues 4.2 Accredited Assessors 4.3 Modes of Assessment 4.4 Evaluation Reports 4.5 Access to a relevant venue, equipment and materials 4.6 Assignment Instructions 4.7 Logbooks 4.8 Operational manuals and makers’/customers’ instructions (if relevant) 4.9 Assessment Instruments, including personal planner and assessment record book 5. Method of assessment Competency may be assessed through: 5.1 Written Test/Examination 5.2 Demonstration with questioning 5.3 Observation with questioning"
    },
    {
      "source_text": "-- PDF PAGE 27 --- TR Beauty Care NC III Promulgated August 2005"
    },
    {
      "source_text": "23 -"
    },
    {
      "source_text": "6. Context of assessment 6.1 Company 6.2 On-Site 6.3 Assessment activities are carried out through TESDA accredited assessment centers/venues by using closely simulated workplace environment. 6.4 Continuous assessment in an institutional setting that stimulates the conditions of performance describe in the elements, performance criteria and range of variables statement that make up this unit. 6.5 Continuous assessment in the workplace, taking into account the range of variables affecting performance. 6.6 Self-assessment on the same terms as those described above. 6.7 Simulated assessment or critical incident assessment, provided that the critical incident involves assessment against performance criteria and an evaluation of underpinning knowledge and skill required to achieve the required performance criteria."
    },
    {
