        "source_text": "HCS515310\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in executing\ncreative design on finger and toenails. This involves performing\ntemporary hair removal activity, this involves preparing the client,\ncleaning of nails, apply desired and agreed creative design.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is consulted on the type of nail service activity\ndesired.\n1.2\nClient is consulted on possible health restrictions.\n1.3\nTreatment area, tools, equipment, supplies and materials\nare prepared for identified nail service activity according to\nOHSC requirements.\n1.4\nClient\nis\nadvised\non\nmaintenance\nrequirements,\nthe\nadvantages and disadvantages of the nail treatment.\n1.5\nNail and skin condition are identified by physical and visual\ncheck and specific client requirements to be noted and adopt\nnecessary safety precautions.\n1.6\nContra-indications including infections and nail disorders are\nidentified and referred to appropriate person for treatment\naccording to D.O.H. rules and regulations.\n1.7\nClient is positioned safety and comfortably and provided with\nprotective clothing material.\n2. Perform cleaning and\ncutting of nails\n2.1\nCuticles are pushed gently without damage to nail boarder\nfollowing safety procedures.\n2.2\nNails are disinfected, cleaned and dried completely.\n2.3\nNails are cut and trimmed according to client requirements.\n2.4\nTips are blended and shaped to achieve smooth and even\nfinish according to salon standard.\n2.5\nAppropriate sterilized tools are used to perform the cleaning\nactivity according to OHSC rules and regulations.\n2.6\nFingernails are lightly massaged following prescribed\nmovements.\n2.7\nFirst aid is applied / administered in case of accidental cuts\nand wounds.\n3. Apply different\ncreative designs\n3.1\nNail products are applied according to manufacturer’s\nrecommendation.\n3.2\nClient is consulted from time to time to ensure safety and\ncomfort during the entire process.\n3.3\nIf necessary, artificial nail area correctly applied using\nappropriate tools and equipment.\n3.4\nResults are checked to be correct well-balanced, smooth, neat\nand free from excess product on cuticle and nail walls.\n3.5\nClient is advised on after treatment care service.\n\n--- PDF PAGE 46 ---\n\n--- PDF PAGE 47 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 43 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Creative Nail Service\nActivity\n1.1\nArtificial Nail Sculpture\n1.2\nFancy Nail Design\n1.3\nAirbrush Nail Design\n1.4\nPlain Manicure\n2. Types of Clients\n2.1\nLadies\n2.2\nMen\n3. Nail Skin/Condition\n3.1\nNormal\n3.2\nAbnormal\n3.3\nHang Nail\n4. Nail Ornaments\n4.1\nSculptured Nail\n4.2\nStick on Nail Design\n4.3\nFancy Color Nail Polish\n4.4\nPlain Polish\n5. Massage Movement\n5.1\nPressing\n5.2\nSpreading\n5.3\nCircular Movement\n5.4\nStretching\n5.5\nPulling\n6. Tools and Equipment\n6.1\nManicure Table\n6.2\nStool\n6.3\nPusher\n6.4\nOttoman\n6.5\nManicure Tray\n\n--- PDF PAGE 48 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 44 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on desired creative nail service activity.\n1.2\nSelected necessary tools, equipment, supplies and materials\nbased on specific nail service activity following OHSC\nrequirements.\n1.3\nChecked and assessed nail, skin condition and adopt\nnecessary safety procedures according to clients’ specific\nrequirements and DOH rules and regulations.\n1.4\nPositioned client comfortably and safety and provide\nappropriate protective clothing materials.\n1.5\nCleaned and disinfected nails making sure that cuticles are\npushed gently without damaging nail borders.\n1.6\nCut and trimmed nails.\n1.7\nNail ornaments are applied following manufacturers\ninstructions.\n1.8\nChecked results and applied necessary retouches according\nto the clients desired outcome.\n1.9\nApplied appropriate treatment on accidental cuts.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nDifferent Nail Designs\n2.2\nType of Nail Polish\n2.3\nCode of Ethics\n2.4\nTypes of Skin and Nail Condition\n2.5\nDOH Rules and Regulations\n2.6\nOHSC Requirements\n2.7\nMassage Movements\n2.8\nNail and Skin Condition Analysis\n2.9\nSalon Policies / Procedures\n2.10 Different Nail Cutting Tools\n2.11 Different Nail Designing Tools\n\n--- PDF PAGE 49 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 45 -\n\n3. Underpinning skills\n3.1\nApplying different nail design\n3.2\nNegotiation skills\n3.3\nCommunication skills\n3.4\nHandling tools and equipment\n3.5\nApplying nail polish\n3.6\nCleaning technique\n3.7\nShaping nail technique\n3.8\nCutting / Trimming of nails\n3.9\nPerforming hand massage\n3.10 Observing proper posture\n3.11 Applying correct massage technique\n3.12 Analyzing skin and nail condition\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Live Model\n4.2 Complete Supplies and Materials\n4.3 Appropriate Tools and Equipment\n4.4 Actual or Simulated Workplace\n4.5 Nail Ornaments\n4.6 Protective Clothing\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Direct Observation with Questioning\n5.2 Demonstration with Questioning\n5.3 Written Test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 50 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 46 -"
