          "source_text": "1. Prepare clients \n1.1 \nClient is consulted on the type of nail service activity \ndesired. \n1.2 \nClient is consulted on possible health restrictions. \n1.3 \nTreatment area, tools, equipment, supplies and materials \nare prepared for identified nail service activity according to \nOHSC requirements. \n1.4 \nClient \nis \nadvised \non \nmaintenance \nrequirements, \nthe \nadvantages and disadvantages of the nail treatment. \n1.5 \nNail and skin condition are identified by physical and visual \ncheck and specific client requirements to be noted and adopt \nnecessary safety precautions. \n1.6 \nContra-indications including infections and nail disorders are \nidentified and referred to appropriate person for treatment \naccording to D.O.H. rules and regulations. \n1.7 \nClient is positioned safety and comfortably and provided with \nprotective clothing material.\n2. Perform cleaning and \ncutting of nails \n2.1 \nCuticles are pushed gently without damage to nail boarder \nfollowing safety procedures. \n2.2 \nNails are disinfected, cleaned and dried completely. \n2.3 \nNails are cut and trimmed according to client requirements. \n2.4 \nTips are blended and shaped to achieve smooth and even \nfinish according to salon standard. \n2.5 \nAppropriate sterilized tools are used to perform the cleaning \nactivity according to OHSC rules and regulations. \n2.6 \nFingernails are lightly massaged following prescribed \nmovements. \n2.7 \nFirst aid is applied / administered in case of accidental cuts \nand wounds.\n3. Apply different \ncreative designs \n3.1 \nNail products are applied according to manufacturer’s \nrecommendation. \n3.2 \nClient is consulted from time to time to ensure safety and \ncomfort during the entire process. \n3.3 \nIf necessary, artificial nail area correctly applied using \nappropriate tools and equipment. \n3.4 \nResults are checked to be correct well-balanced, smooth, neat \nand free from excess product on cuticle and nai