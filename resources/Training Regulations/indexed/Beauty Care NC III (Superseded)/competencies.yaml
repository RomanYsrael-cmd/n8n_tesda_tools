        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCarried out work in accordance with the company’s standard\noperating procedures.\n1.2\nPerformed task according to specifications.\n1.3\nReported errors or deviations not in accordance with standard\noperating procedures.\n1.4\nCarried out work in accordance with the process\nimprovement.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nRelevant Production Processes, Materials and Products\n2.2\nCharacteristics of Materials, Software and Hardware Used in\nProduction Processes\n2.3\nQuality Checking Procedures\n2.4\nClient Relations\n2.5\nWork Place Procedures\n2.6\nSafety and Environmental Aspects of Service Processes\n2.7\nError Identification and Reporting\n2.8\nQuality Improvement Processes\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions, product\nmanufacturer’s requirements\n3.2\nCommunication skills needed to interpret and apply defined\nwork procedures\n3.3\nCarry out work in accordance with OHS policies and\nprocedures\n3.4\nCritical thinking\n3.5\nSolution providing and decision making\n3.6\nInterpersonal skills or dealing with varied type of clients\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nMaterials\n4.2\nProduct\n4.3\nEquipment\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nThird Party Report\n5.3\nPractical Demonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 34 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 30 -\n\nUNIT OF COMPETENCY :\nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK\nENVIRONMENT\n\nUNIT CODE\n:"
        },
        "source_text": "HCS515204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\napply quality standards in the workplace. The unit also includes the\napplication of relevant safety procedures and regulations,\nsalon/organizational procedures and other client requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess clients\nservice needs\n\n1.1\nWork instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2\nClient’s needs are checked against workplace standards and\nspecifications.\n1.3\nFaults on clients and any identified causes are recorded\nand/or reported to the supervisor concerned in accordance\nwith workplace procedures.\n1.4\nClients profile and service extended to them are documented\nin accordance with workplace procedures.\n2. Assess own work\n2.1\nDocumentation relative to quality within the company is\nidentified and used.\n2.2\nCompleted work is checked against workplace standards\nrelevant to the task undertaken.\n2.3\nErrors are identified and improved on.\n2.4\nInformation on the quality and other indicators of individual\nperformance is recorded in accordance with workplace\nprocedures.\n2.5\nIn cases of deviations from specific quality standards,\ncauses are documented and reported in accordance with the\nworkplace’ standard operating procedures.\n3. Engage in quality\nimprovement\n3.1\nProcess improvement procedures are participated in relative\nto workplace assignment.\n3.2\nWork is carried out in accordance with process improvement\nprocedures.\n3.3\nPerformance of operation or quality of product of service to\nensure other client satisfaction is monitored.\n\n--- PDF PAGE 32 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 28 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. External Clients\n\nMay include but not limited to:\n1.1\nTeenagers\n1.2\nAdult Men\n1.3\nWorking Adult\n1.4\nChild\n2. Faults\nMay include but not limited to:\n2.1\nClient not satisfied\n2.2\nDesired result is not within the desired result of client\n2.3\nProcedures done but do not conform with any Salon policies\nand procedures\n2.4\nDamaged caused to client\n3. Documentation\n3.1\nOrganization Work Procedures\n3.2\nManufacturer’s Instruction Manual\n3.3\nClient Requirements\n3.4\nForms\n4. Errors\nMay be related to the following:\n4.1\nDeviation from the requirements of the client\n4.2\nDeviation from the requirements of the salon/organization\n5. Quality Standards\nMay be related but not limited to the following:\n5.1\nSupplies and Materials\n5.2\nFacilities\n5.3\nSalon Product\n5.4\nService Processes and Procedures\n5.5\nClient Service\n5.6\nEnvironmental Regulations\n6. Client\n6.1\nCo-worker\n6.2\nSupplier/Vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 33 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 29 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCarried out work in accordance with the company’s standard\noperating procedures.\n1.2\nPerformed task according to specifications.\n1.3\nReported errors or deviations not in accordance with standard\noperating procedures.\n1.4\nCarried out work in accordance with the process\nimprovement.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nRelevant Production Processes, Materials and Products\n2.2\nCharacteristics of Materials, Software and Hardware Used in\nProduction Processes\n2.3\nQuality Checking Procedures\n2.4\nClient Relations\n2.5\nWork Place Procedures\n2.6\nSafety and Environmental Aspects of Service Processes\n2.7\nError Identification and Reporting\n2.8\nQuality Improvement Processes\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions, product\nmanufacturer’s requirements\n3.2\nCommunication skills needed to interpret and apply defined\nwork procedures\n3.3\nCarry out work in accordance with OHS policies and\nprocedures\n3.4\nCritical thinking\n3.5\nSolution providing and decision making\n3.6\nInterpersonal skills or dealing with varied type of clients\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nMaterials\n4.2\nProduct\n4.3\nEquipment\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nThird Party Report\n5.3\nPractical Demonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 34 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 30 -\n\nUNIT OF COMPETENCY :\nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK\nENVIRONMENT\n\nUNIT CODE\n:"
