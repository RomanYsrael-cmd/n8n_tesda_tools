  "source_section_text": "Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA Director General.\n\n4.2 Individuals aspiring to be awarded the qualification of BEAUTY CARE NC III, must acquire\nCertificates of Competency in all of the following individual core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment center.\n\n4.2.1 Perform temporary hair removal activity\n4.2.2 Perform body bleach\n4.2.3 Perform creative nail design\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of competency\ncomprising a qualification, an individual shall be issued the corresponding National\nCertificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures\nManual on Assessment and Certification” and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS)”.\n\n--- PDF PAGE 58 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 54 -\n\nCOMPETENCY MAP\nBEAUTY CARE NC III\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nPerform temporary hair\nremoval activity\nPerform body bleach\nMaintain an effective\nrelationship with\nclients/customers\nManage own\nperformance\nLead workplace\ncommunication\nLead small teams\nApply quality standards\nMaintain a safe, clean\nand efficient environment\nPerform creative\nnail design\nDevelop and practice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\n\n--- PDF PAGE 59 ---\n\n--- PDF PAGE 60 ---\nList of Published Training Regulations\n\n Animal Production NC II\n Aquaculture NC II\n Automotive Body Painting/Finishing NC II\n Automotive Body Repair NC II\n Automotive Engine Rebuilding NC II\n Automotive Servicing NC II\n Bartending NC II\n Beauty Care NC II\n Beauty Care NC III\n Building Wiring Installation NC II\n Carpentry NC II\n Commercial Cooking NC II\n Computer Hardware Servicing NC II\n Deck Seafaring NC II\n Dressmaking NC II\n Driving NC II\n Engine Seafaring NC II\n Food and Beverage Services NC II\n Footwear Making NC II\n Heavy Equipment Operation NC II\n Horticulture NC II\n Household Services NC II\n Housekeeping NC II\n Machining NC II\n Masonry NC II\n Motorcycle and Small Engine Servicing NC II\n Personal Care Service (Caregiving) NC II\n Plumbing NC II\n Pyrotechnics NC II\n RAC Servicing NC I\n RAC Servicing NC II\n Security Services NC II\n Tailoring NC II\n Tour Guiding Services NC II\n Transport RAC Servicing NC II\n Travel Services NC II\n Welding NC II\n\nThese materials are available in both printed and electronic copies.\nFor more information please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTelephone Nos.: 893-8303, 893-2139; 817-4076 to 82 loc. 615 to 617\nor visit our website: www.tesda.gov.ph"
