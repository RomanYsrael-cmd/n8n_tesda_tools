        "source_text": "HCS515308\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in performing\ntemporary hair removal activity. This involves preparing the client,\nand shaving and tweezing on desired and agreed part perform cold\nand hot waxing.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is consulted on the specific area to be treated and\ndesired hair removing method.\n1.2\nClient is advised to remove personal accessories to achieve\noptimum service result.\n1.3\nNecessary tools, supplies, materials and hair removing\nproduct are prepared according to OHSC requirements.\n1.4\nClient is provided with protective clothing and positioned in a\ncomfortable manner.\n1.5\nSkin condition where hair is to be removed is checked\nthoroughly.\n2. Perform shaving and\ntweezing\n2.1\nPlucking or tweezing and shaving tools are sterilized and used\naccording to OHSC requirements.\n2.2\nHair is shaved following direction of the hair strands and\ngrowth.\n2.3\nAntiseptic is applied on the area to be shaved according to\nOHSC requirements.\n3. Perform cold waxing\n3.1\nSkin test is performed on hairless section and if found\nfavorable, area is applied with depilatories using standard\napplication method according to OHSC requirements.\n3.2\nPrescribed timeline is followed according to thickness of hair\nto be removed.\n3.3\nThe area is washed off with lukewarm water dried up and\napplied with cold cream.\n3.4\nA strip of cotton cloth or cellophane is used to firmly press\ndown the wax to adhere correctly.\n4. Perform hot waxing\n\n4.1\nClient is positioned in a correct manner to avoid any error or\naccident (like burns).\n4.2\nWax is put to boiling point to melt completely according to\nOHSC requirements.\n4.3\nTemperature and consistency is tested by applying a little\nportion of wax depilatories on the clients desired area to be\nwax.\n4.4\nWax is spread evenly over the surface using application\nmethod with spatula and allowed to harden.\n4.5\nWax is quickly pulled off against the direction of the hair\ngrowth and tested area is gently massaged afterwards.\n4.6\nSkin surface is washed with mild soap and water, dried up and\napplied with talcum powder.\n4.7\nResidue on the treated area is removed and applied with\nemollient cream or antiseptic lotion.\n\n--- PDF PAGE 38 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 34 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Skin Area To Be\nShaved\n1.1\nEyebrow\n1.2\nLower lips\n1.3\nArmpit\n1.4\nNape area\n1.5\nCheeks\n1.6\nUpper lips\n1.7\nChin\n1.8\nStubbles\n1.9\nUpper legs\n1.10 Navel\n1.11 Chest\n1.12\nMoustache\n2. Application Method\n2.1\nDirect\n2.2\nIndirect\n2.3\nUse of Appropriate Tools\n3. Tools\n3.1\nBlade\n3.2\nRazors\n3.3\nStainless Bowl\n3.4\nSpatula\n3.5\nFlat Wood (Tongue Depressor)\n3.6\nMixing Stick\n3.7\nShaver\n4. Supplies and\nMaterials\n4.1\nWax\n4.2\nEmollient cream\n4.3\nAntiseptic\n4.4\nCotton\n4.5\nTissue Paper\n5. Types of Wax\n5.1\nNatural preparation\n5.2\nCommercial\n6. Skin Hair Removing\nMethod\n6.1\nShaving\n6.2\nWaxing\n6.2.1 Hot Waxing\n6.2.2 Cold Waxing\n6.3\nTweezing or Plucking\n6.4\nThreading\n7. Skin Condition\n7.1\nNormal\n7.2\nWith Cuts or Abrasions\n7.3\nWith Rashes\n7.4\nDry\n8. Protective Clothing\n8.1 Gauze Mask\n8.2 Bath Towel\n8.3 Face Towel\n8.4 Head Band\n8.5 Smock Gown\n8.6 Apron\n9. Personal\nAccessories\n9.1\nWrist Watch\n9.2\nAnklet\n9.3\nBangles\n9.4\nRings\n\n--- PDF PAGE 39 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 35 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked and analyzed the condition of the skin surface\nwhere hair is to be removed.\n1.2\nPrepared and used tools, equipment, supplies and materials\naccording to OHSC requirements.\n1.3\nShaved hair according to the direction of the growth of hair.\n1.4\nApplied emollient cream on the area surrounding the treated\narea.\n1.5\nConducted skin test to determine tolerance level of the\nsensitivity of the client.\n1.6\nObserved appropriate timeline to achieve optimum result of\nthe treatment.\n1.7\nConsulted client on a regular basis during the entire process\nto ensue safety and comfort.\n1.8\nApplied wax and leave on until it hardens following\nmanufacturer’s instruction.\n1.9\nTaut skin with one hand while the other hand firmly holds on\nthe wax strip.\n1.10 Pulled off wax with fast movement following the opposite\ndirection of the hair growth.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCode of Ethics\n2.2\nApplication Method\n2.3\nTypes of Emollient Cream\n2.4\nTypes of Antiseptic Lotion\n2.5\nD.O.H. Rules and Regulations\n2.6\nOHSC Rules and Regulations\n2.7\nTypes of Wax\n2.8\nSalon Rules and Regulations\n2.9\nClients Medical Restrictions\n3. Underpinning skills\n3.1\nNegotiating Skills\n3.2\nApplying correct technique\n3.3\nConducting proper skin test\n3.4\nRegulating wax heat\n3.5\nCommunication skills\n3.6\nApplying appropriate skin product\n3.7\nUsing appropriate tools, supplies and materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nTools and Equipment\n4.3\nAppropriate Supplies and Materials\n4.4\nSimulated or actual Workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect Observation with Questioning\n5.2\nDemonstration with Questioning\n5.3\nWritten test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 40 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 36 -\n\nUNIT OF COMPETENCY :\nPERFORM BODY BLEACH\n\nUNIT CODE\n:"
      }
