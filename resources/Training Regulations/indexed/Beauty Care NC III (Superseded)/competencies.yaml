        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nGenerated information on different client requirements and\nneeds.\n1.2\nSelected and used strategies to accurately analyzed the client\nrequirements.\n1.3\nAssessed current product and services as against client\ndemand.\n1.4\nIdentified avenues to establish relevant linkage.\n1.5\nSelected promotional activities relevant to enhance\ncompetitiveness of salon.\n1.6\nAssisted clients on specific desired services.\n1.7\nChecked and prepared tools for the specific salon activities.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nMedia Options\n2.2\nData Gathering\n2.3\nSalon Policies\n2.4\nInternational Market\n2.5\nSkills Competition Rules and Procedures\n2.6\nNew Trends in Products and Services\n2.7\nEthical Limitations\n3. Underpinning skills\n3.1\nCommunication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.2\nTechnology Skills\n3.3\nInterpersonal Skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nClient\n4.3\nRelevant Information\n4.4\nAppropriate Products\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\n Observation with questioning\n5.2\n Practical Demonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 37 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 33 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM TEMPORARY HAIR REMOVAL ACTIVITY\n\nUNIT CODE\n:"
        },
        "source_text": "HCS515205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\nmaintain client relations. The unit incorporates the work safety\nguidelines. It encompasses competencies necessary to maintain a\nsafe workplace for staff, clients and others. It also involves the\napplication of health regulations, including personal hygiene\npracticed by staff members, provision of a caring client environment\nand the efficient operation of the salon.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Comply with health\nregulations\n1.1\nSalon policies and procedures for personal hygiene applied.\n1.2\nProcedures and practices implemented in a variety of salon\nsituations in accordance with state and local government\nhealth regulations.\n2. Assess own work\n2.1\nReception, work areas and walkways maintained in a safe,\nuncluttered and organized manner according to salon policy.\n2.2\nAll routines carried out safely, effectively with minimum\ninconvenience to clients and staff.\n2.3\nWaste is stored and disposed of according to OHSC\nrequirements.\n2.4\nSpills, food, waste, hair or potential hazards promptly\nremoved from floors according to salon policy.\n2.5\nSpills, food, waste, hair or other potential hazards promptly\nremoved from floors according to salon policy.\n2.6\nLinen is stored, cleaned and disinfected in line with OHS\nrequirements and salon procedures.\n2.7\nRefreshments are provided to all clients.\n3. Check and maintain\ntools and equipment\n3.1\nTools and equipment are stored safely and in position to\ncomply with salon requirements and local health regulations.\n3.2\nTools and equipment are prepared for specific services as\nrequired.\n3.3\nTools and equipment are checked for maintenance\nrequirements.\n3.4\nTools and equipment are referred for repair as required.\n4. Check and maintain\nstocks\n\n4.1\nStock rotation procedures are carried out routinely and\naccurately according to salon procedures.\n4.2\nStock levels are accurately recorded according to salon\nprocedures.\n4.3\nUnder or over supplied stock items are notified immediately to\nthe salon supervisor.\n4.4\nIncorrectly ordered or delivered stock is referred to the salon\nsupervisor for return to supplier.\n4.5\nSafe lifting and carrying techniques maintained in line with\nsalon occupational health and safety policy and government\nlegislation.\n5. Provide a relaxed\nand caring\nenvironment\n5.1\nClients are made to feel comfortable according to salon policy.\n5.2\nClients needs are reported to.\n5.3\nClients are consulted on specific desired service.\n\n--- PDF PAGE 35 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 31 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Relevant Salon\nPolicies and\nProcedures\n\nMay include but not limited to:\n1.1\nHazard Policies and Procedures\n1.2\nEmergency, Fire and Accident Procedures\n1.3\nPersonal Safety Procedures\n1.4\nProcedures for the use of Personal protective Clothing and\nEquipment\n1.5\nHazard Identification\n1.6\nJob Procedures\n2. Occupational Health\nand Safety\nProcedures\nMay include but not limited to:\n2.1\nClient\n2.2\nStaff\n2.3\nEquipment/Tools\n2.4\nPremises\n2.5\nStock\n3. Unsafe Situations\nMay include but not limited to:\n3.1\nDamaged Packaging Material or Containers\n3.2\nBroken or Damaged Equipment\n3.3\nInflammable Materials and Fire Hazards\n3.4\nLifting Practices\n3.5\nSpillages\n3.6\nWaste including hair especially on floors\n3.7\nTrolleys\n4. Linkage\nMay be related to the following:\n4.1\nInstitutional\n4.2\nOrganizational Linkage\n4.3\nSocial Services\n4.4\nInternational Market\n\n--- PDF PAGE 36 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 32 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nGenerated information on different client requirements and\nneeds.\n1.2\nSelected and used strategies to accurately analyzed the client\nrequirements.\n1.3\nAssessed current product and services as against client\ndemand.\n1.4\nIdentified avenues to establish relevant linkage.\n1.5\nSelected promotional activities relevant to enhance\ncompetitiveness of salon.\n1.6\nAssisted clients on specific desired services.\n1.7\nChecked and prepared tools for the specific salon activities.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nMedia Options\n2.2\nData Gathering\n2.3\nSalon Policies\n2.4\nInternational Market\n2.5\nSkills Competition Rules and Procedures\n2.6\nNew Trends in Products and Services\n2.7\nEthical Limitations\n3. Underpinning skills\n3.1\nCommunication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.2\nTechnology Skills\n3.3\nInterpersonal Skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nClient\n4.3\nRelevant Information\n4.4\nAppropriate Products\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\n Observation with questioning\n5.2\n Practical Demonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 37 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 33 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM TEMPORARY HAIR REMOVAL ACTIVITY\n\nUNIT CODE\n:"
