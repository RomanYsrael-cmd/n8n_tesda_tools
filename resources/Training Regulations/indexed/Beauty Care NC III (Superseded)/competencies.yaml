          "source_text": "1.  Prepare client \n1.1 \nClient skin condition and types are checked and analyzed \nthrough skin test following DOH rules and regulations. \n1.2 \nAll possible skin areas for bleaching are discussed with the \nclient. \n1.3 \nAll potential precautions or skin reactions are thoroughly \nexplained to the client. \n1.4 \nClient is advised to remove personal accessories to achieve \noptimum service result. \n1.5 \nClient is positioned comfortably according to desired body \nparts to be bleached. \n1.6\nProtective clothing and materials are provided to the client.\n2.  Prepare mixture of \nbleaching product \n2.1 \nQuantity and proper mixture are defined according to body \nsize and skin parts following bleaching product specification. \n2.2 \nQuantity is determined according to body size and skin parts. \n2.3 \nProtective clothing material is worn during the preparation \nof the mixture. \n2.4 \nCorrect mixing technique and process is applied to achieve \nrequired product effectiveness.\n3.  Apply bleaching \nproduct \n3.1 \nMixed product is applied using bare hand on the part of the \nbody starting from the upper portion to the lower body part. \n3.2 \nNecessary tools, supplies and materials are used in the \napplication of bleaching product following OHSC \nrequirements. \n3.3 \nBleached body parts are rinsed and applied with moisturizing \nproduct. \n3.4 \nBleaching area is covered with floor mat during the entire \napplication process.\n4.Perform checking and \napply retouch \n4.1 \nResults are assessed against clients desired outcome through \nphysical touch and visual check. \n4.2 \nClient is advised on appropriate body skin maintenance \nprogram. \n4.3 \nTools and materials used are stored at room temperature \n4.4 \nWastage is properly disposed according to OHSC \nrequirements. \n4.5\nBleaching activity is recorded for future reference.\n\n--- PDF PAGE 41 ---\nTR Beauty Care NC III \nPromulgated   August 2005 \n- 37 - \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Skin Types \n1.1 \nFair \n1.2 \nWhite \n1.3 \nBlack \n1.4 \nPorcelain \n1.5\nBrown or Mulatto\n2. Skin Conditions \n2.1 \nNormal \n2.2 \nDry \n2.3 \nOily \n2.4 \nWith Skin Abrasions \n2.5\nWith Rashes\n3. Skin Areas for \nBleaching Application\n3.1 \nUnderarm \n3.2 \nArms/Legs \n3.3 \nFace \n3.4 \nGroin \n3.5 \nEntire Body \n3.6\nAny identified dark spot\n4. Bleaching is applied \non the client in \ndifferent position \n4.1 \nStanding \n4.2 \nSitting \n4.3 \nLying \n4.4\nProne\n5. Tools  \n5.1 \nBed \n5.2 \nBed Sheet \n5.3 \nStool \n5.4 \nMeasuring Spoon \n5.5 \nMeasuring Cup \n5.6 \nPlastic / Porcelain Basin \n5.7 \nStirring Spoon \n5.8 \nMixing Bowl \n5.9 \nFace Towel \n5.10\nTint Brush or Soft Brush\n6. Personal Accessories\n6.1 \nJewelries \n6.2 \nHair Band \n6.3 \nHairclips \n6.4 \nCaps \n6.5 \nHair Pins \n6.6\nAny pierced items\n7. Protective Clothing \n7.1 \nTowel Bath \n7.2 \nBathrobe \n7.3 \nHeadband \n7.4 \nSmock Gown \n7.5 \nGauze Mask \n7.6 \nFace Towel \n7.7 \nSlippers \n7.8\nApron\n8.  Timeline \n8.1 \n45 Mins. \n8.2\n60 Mins. Or 1 hour\n9.  Skin Maintenance \nProgram \n9.1 \nFrequent salon visit \n9.2 \nDaily application of moisturizing cream/lotion \n9.3 \nNo exposure to direct sunlight \n9.4\nUse of sun block cream/lotion\n\n--- PDF PAGE 42 ---\nTR Beauty Care NC III \nPromulgated   August 2005 \n- 38 - \n \n10.   Supplies/Materials \n10.1 Lotion \n10.2 Soap \n10.3 Moisturizing Cream/Lotion \n10.4 Shampoo \n10.5 Conditioner \n10.6 Whitening Lotion \n10.7\nWhitening Soap\n11.  Bleaching Products \n11.1 Bleaching Powder (Henna) \n11.2 Soap Chips \n11.3 Hydrogen Peroxide (20 vol.) \n11.4 Hydrogen Peroxide (10 vol.) \n11.5 Ammonia \n11.6 Egg White \n11.7 Fresh Milk or Evaporated Milk \n11.8\nCalamansi Extract\n12.   Body Size \n12.1 Small \n12.2 Medium \n12.3 Large \n12.4 Extra Large \n12.5\nLitter Large\n\n--- PDF PAGE 43 ---\nTR Beauty Care NC III \nPromulgated   August 2005 \n- 39 -"
