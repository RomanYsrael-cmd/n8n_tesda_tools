        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFundamental operation (addition, subtraction, division,\nmultiplication)\n2.2\nMeasurement system\n2.3\nPrecision and accuracy\n2.4\nBasic measuring tools/devices\n3. Underpinning skills\n3.1\nApplying mathematical computations\n3.2\nUsing calculator\n3.3\nUsing different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nCalculator\n4.2\nBasic measuring tools\n4.3\nCase Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nAuthenticated portfolio\n5.2\nWritten Test\n5.3\nInterview/Oral Questioning\n5.4\nDemonstration with questioning\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 21 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 17 -\n\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\n\nUNIT CODE\n:"
