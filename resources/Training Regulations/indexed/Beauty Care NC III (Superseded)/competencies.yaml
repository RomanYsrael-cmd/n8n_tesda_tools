ices implemented in a variety of salon\nsituations in accordance with state and local government\nhealth regulations.\n2. Assess own work\n2.1\nReception, work areas and walkways maintained in a safe,\nuncluttered and organized manner according to salon policy.\n2.2\nAll routines carried out safely, effectively with minimum\ninconvenience to clients and staff.\n2.3\nWaste is stored and disposed of according to OHSC\nrequirements.\n2.4\nSpills, food, waste, hair or potential hazards promptly\nremoved from floors according to salon policy.\n2.5\nSpills, food, waste, hair or other potential hazards promptly\nremoved from floors according to salon policy.\n2.6\nLinen is stored, cleaned and disinfected in line with OHS\nrequirements and salon procedures.\n2.7\nRefreshments are provided to all clients.\n3. Check and maintain\ntools and equipment\n3.1\nTools and equipment are stored safely and in position to\ncomply with salon requirements and local health regulations.\n3.2\nTools and equipment are prepared for specific services as\nrequired.\n3.3\nTools and equipment are checked for maintenance\nrequirements.\n3.4\nTools and equipment are referred for repair as required.\n4. Check and maintain\nstocks\n\n4.1\nStock rotation procedures are carried out routinely and\naccurately according to salon procedures.\n4.2\nStock levels are accurately recorded according to salon\nprocedures.\n4.3\nUnder or over supplied stock items are notified immediately to\nthe salon supervisor.\n4.4\nIncorrectly ordered or delivered stock is referred to the salon\nsupervisor for return to supplier.\n4.5\nSafe lifting and carrying techniques maintained in line with\nsalon occupational health and safety policy and government\nlegislation.\n5. Provide a relaxed\nand caring\nenvironment\n5.1\nClients are made to feel comfortable according to salon policy.\n5.2\nClients needs are reported to.\n5.3\nClients are consulted on specific desired service.\n\n--- PDF PAGE 35 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 31 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Relevant Salon\nPolicies and\nProcedures\n\nMay include but not limited to:\n1.1\nHazard Policies and Procedures\n1.2\nEmergency, Fire and Accident Procedures\n1.3\nPersonal Safety Procedures\n1.4\nProcedures for the use of Personal protective Clothing and\nEquipment\n1.5\nHazard Identification\n1.6\nJob Procedures\n2. Occupational Health\nand Safety\nProcedures\nMay include but not limited to:\n2.1\nClient\n2.2\nStaff\n2.3\nEquipment/Tools\n2.4\nPremises\n2.5\nStock\n3. Unsafe Situations\nMay include but not limited to:\n3.1\nDamaged Packaging Material or Containers\n3.2\nBroken or Damaged Equipment\n3.3\nInflammable Materials and Fire Hazards\n3.4\nLifting Practices\n3.5\nSpillages\n3.6\nWaste including hair especially on floors\n3.7\nTrolleys\n4. Linkage\nMay be related to the following:\n4.1\nInstitutional\n4.2\nOrganizational Linkage\n4.3\nSocial Services\n4.4\nInternational Market\n\n--- PDF PAGE 36 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 32 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nGenerated information on different client requirements and\nneeds.\n1.2\nSelected and used strategies to accurately analyzed the client\nrequirements.\n1.3\nAssessed current product and services as against client\ndemand.\n1.4\nIdentified avenues to establish relevant linkage.\n1.5\nSelected promotional activities relevant to enhance\ncompetitiveness of salon.\n1.6\nAssisted clients on specific desired services.\n1.7\nChecked and prepared tools for the specific salon activities.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nMedia Options\n2.2\nData Gathering\n2.3\nSalon Policies\n2.4\nInternational Market\n2.5\nSkills Competition Rules and Procedures\n2.6\nNew Trends in Products and Services\n2.7\nEthical Limitations\n3. Underpinning skills\n3.1\nCommunication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.2\nTechnology Skills\n3.3\nInterpersonal Skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nClient\n4.3\nRelevant Information\n4.4\nAppropriate Products\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\n Observation with questioning\n5.2\n Practical Demonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 37 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 33 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM TEMPORARY HAIR REMOVAL ACTIVITY\n\nUNIT CODE\n:\nHCS515308\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in performing\ntemporary hair removal activity. This involves preparing the client,\nand shaving and tweezing on desired and agreed part perform cold\nand hot waxing.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is consulted on the specific area to be treated and\ndesired hair removing method.\n1.2\nClient is advised to remove personal accessories to achieve\noptimum service result.\n1.3\nNecessary tools, supplies, materials and hair removing\nproduct are prepared according to OHSC requirements.\n1.4\nClient is provided with protective clothing and positioned in a\ncomfortable manner.\n1.5\nSkin condition where hair is to be removed is checked\nthoroughly.\n2. Perform shaving and\ntweezing\n2.1\nPlucking or tweezing and shaving tools are sterilized and used\naccording to OHSC requirements.\n2.2\nHair is shaved following direction of the hair strands and\ngrowth.\n2.3\nAntiseptic is applied on the area to be shaved according to\nOHSC requirements.\n3. Perform cold waxing\n3.1\nSkin test is performed on hairless section and if found\nfavorable, area is applied with depilatories using standard\napplication method according to OHSC requirements.\n3.2\nPrescribed timeline is followed according to thickness of hair\nto be removed.\n3.3\nThe area is washed off with lukewarm water dried up and\napplied with cold cream.\n3.4\nA strip of cotton cloth or cellophane is used to firmly press\ndown the wax to adhere correctly.\n4. Perform hot waxing\n\n4.1\nClient is positioned in a correct manner to avoid any error or\naccident (like burns).\n4.2\nWax is put to boiling point to melt completely according to\nOHSC requirements.\n4.3\nTemperature and consistency is tested by applying a little\nportion of wax depilatories on the clients desired area to be\nwax.\n4.4\nWax is spread evenly over the surface using application\nmethod with spatula and allowed to harden.\n4.5\nWax is quickly pulled off against the direction of the hair\ngrowth and tested area is gently massaged afterwards.\n4.6\nSkin surface is washed with mild soap and water, dried up and\napplied with talcum powder.\n4.7\nResidue on the treated area is removed and applied with\nemollient cream or antiseptic lotion.\n\n--- PDF PAGE 38 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 34 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Skin Area To Be\nShaved\n1.1\nEyebrow\n1.2\nLower lips\n1.3\nArmpit\n1.4\nNape area\n1.5\nCheeks\n1.6\nUpper lips\n1.7\nChin\n1.8\nStubbles\n1.9\nUpper legs\n1.10 Navel\n1.11 Chest\n1.12\nMoustache\n2. Application Method\n2.1\nDirect\n2.2\nIndirect\n2.3\nUse of Appropriate Tools\n3. Tools\n3.1\nBlade\n3.2\nRazors\n3.3\nStainless Bowl\n3.4\nSpatula\n3.5\nFlat Wood (Tongue Depressor)\n3.6\nMixing Stick\n3.7\nShaver\n4. Supplies and\nMaterials\n4.1\nWax\n4.2\nEmollient cream\n4.3\nAntiseptic\n4.4\nCotton\n4.5\nTissue Paper\n5. Types of Wax\n5.1\nNatural preparation\n5.2\nCommercial\n6. Skin Hair Removing\nMethod\n6.1\nShaving\n6.2\nWaxing\n6.2.1 Hot Waxing\n6.2.2 Cold Waxing\n6.3\nTweezing or Plucking\n6.4\nThreading\n7. Skin Condition\n7.1\nNormal\n7.2\nWith Cuts or Abrasions\n7.3\nWith Rashes\n7.4\nDry\n8. Protective Clothing\n8.1 Gauze Mask\n8.2 Bath Towel\n8.3 Face Towel\n8.4 Head Band\n8.5 Smock Gown\n8.6 Apron\n9. Personal\nAccessories\n9.1\nWrist Watch\n9.2\nAnklet\n9.3\nBangles\n9.4\nRings\n\n--- PDF PAGE 39 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 35 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked and analyzed the condition of the skin surface\nwhere hair is to be removed.\n1.2\nPrepared and used tools, equipment, supplies and materials\naccording to OHSC requirements.\n1.3\nShaved hair according to the direction of the growth of hair.\n1.4\nApplied emollient cream on the area surrounding the treated\narea.\n1.5\nConducted skin test to determine tolerance level of the\nsensitivity of the client.\n1.6\nObserved appropriate timeline to achieve optimum result of\nthe treatment.\n1.7\nConsulted client on a regular basis during the entire process\nto ensue safety and comfort.\n1.8\nApplied wax and leave on until it hardens following\nmanufacturer’s instruction.\n1.9\nTaut skin with one hand while the other hand firmly holds on\nthe wax strip.\n1.10 Pulled off wax with fast movement following the opposite\ndirection of the hair growth.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCode of Ethics\n2.2\nApplication Method\n2.3\nTypes of Emollient Cream\n2.4\nTypes of Antiseptic Lotion\n2.5\nD.O.H. Rules and Regulations\n2.6\nOHSC Rules and Regulations\n2.7\nTypes of Wax\n2.8\nSalon Rules and Regulations\n2.9\nClients Medical Restrictions\n3. Underpinning skills\n3.1\nNegotiating Skills\n3.2\nApplying correct technique\n3.3\nConducting proper skin test\n3.4\nRegulating wax heat\n3.5\nCommunication skills\n3.6\nApplying appropriate skin product\n3.7\nUsing appropriate tools, supplies and materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nTools and Equipment\n4.3\nAppropriate Supplies and Materials\n4.4\nSimulated or actual Workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect Observation with Questioning\n5.2\nDemonstration with Questioning\n5.3\nWritten test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 40 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 36 -\n\nUNIT OF COMPETENCY :\nPERFORM BODY BLEACH\n\nUNIT CODE\n:\nHCS515309\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in performing\nbody leach. This includes preparing the client, preparing the\nmixture, actual application of bleach on the body, perform checking\nand retouch on the treated area.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient skin condition and types are checked and analyzed\nthrough skin test following DOH rules and regulations.\n1.2\nAll possible skin areas for bleaching are discussed with the\nclient.\n1.3\nAll potential precautions or skin reactions are thoroughly\nexplained to the client.\n1.4\nClient is advised to remove personal accessories to achieve\noptimum service result.\n1.5\nClient is positioned comfortably according to desired body\nparts to be bleached.\n1.6\nProtective clothing and materials are provided to the client.\n2. Prepare mixture of\nbleaching product\n2.1\nQuantity and proper mixture are defined according to body\nsize and skin parts following bleaching product specification.\n2.2\nQuantity is determined according to body size and skin parts.\n2.3\nProtective clothing material is worn during the preparation\nof the mixture.\n2.4\nCorrect mixing technique and process is applied to achieve\nrequired product effectiveness.\n3. Apply bleaching\nproduct\n3.1\nMixed product is applied using bare hand on the part of the\nbody starting from the upper portion to the lower body part.\n3.2\nNecessary tools, supplies and materials are used in the\napplication of bleaching product following OHSC\nrequirements.\n3.3\nBleached body parts are rinsed and applied with moisturizing\nproduct.\n3.4\nBleaching area is covered with floor mat during the entire\napplication process.\n4.Perform checking and\napply retouch\n4.1\nResults are assessed against clients desired outcome through\nphysical touch and visual check.\n4.2\nClient is advised on appropriate body skin maintenance\nprogram.\n4.3\nTools and materials used are stored at room temperature\n4.4\nWastage is properly disposed according to OHSC\nrequirements.\n4.5\nBleaching activity is recorded for future reference.\n\n--- PDF PAGE 41 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 37 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Skin Types\n1.1\nFair\n1.2\nWhite\n1.3\nBlack\n1.4\nPorcelain\n1.5\nBrown or Mulatto\n2. Skin Conditions\n2.1\nNormal\n2.2\nDry\n2.3\nOily\n2.4\nWith Skin Abrasions\n2.5\nWith Rashes\n3. Skin Areas for\nBleaching Application\n3.1\nUnderarm\n3.2\nArms/Legs\n3.3\nFace\n3.4\nGroin\n3.5\nEntire Body\n3.6\nAny identified dark spot\n4. Bleaching is applied\non the client in\ndifferent position\n4.1\nStanding\n4.2\nSitting\n4.3\nLying\n4.4\nProne\n5. Tools\n5.1\nBed\n5.2\nBed Sheet\n5.3\nStool\n5.4\nMeasuring Spoon\n5.5\nMeasuring Cup\n5.6\nPlastic / Porcelain Basin\n5.7\nStirring Spoon\n5.8\nMixing Bowl\n5.9\nFace Towel\n5.10\nTint Brush or Soft Brush\n6. Personal Accessories\n6.1\nJewelries\n6.2\nHair Band\n6.3\nHairclips\n6.4\nCaps\n6.5\nHair Pins\n6.6\nAny pierced items\n7. Protective Clothing\n7.1\nTowel Bath\n7.2\nBathrobe\n7.3\nHeadband\n7.4\nSmock Gown\n7.5\nGauze Mask\n7.6\nFace Towel\n7.7\nSlippers\n7.8\nApron\n8. Timeline\n8.1\n45 Mins.\n8.2\n60 Mins. Or 1 hour\n9. Skin Maintenance\nProgram\n9.1\nFrequent salon visit\n9.2\nDaily application of moisturizing cream/lotion\n9.3\nNo exposure to direct sunlight\n9.4\nUse of sun block cream/lotion\n\n--- PDF PAGE 42 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 38 -\n\n10. Supplies/Materials\n10.1 Lotion\n10.2 Soap\n10.3 Moisturizing Cream/Lotion\n10.4 Shampoo\n10.5 Conditioner\n10.6 Whitening Lotion\n10.7\nWhitening Soap\n11. Bleaching Products\n11.1 Bleaching Powder (Henna)\n11.2 Soap Chips\n11.3 Hydrogen Peroxide (20 vol.)\n11.4 Hydrogen Peroxide (10 vol.)\n11.5 Ammonia\n11.6 Egg White\n11.7 Fresh Milk or Evaporated Milk\n11.8\nCalamansi Extract\n12. Body Size\n12.1 Small\n12.2 Medium\n12.3 Large\n12.4 Extra Large\n12.5\nLitter Large\n\n--- PDF PAGE 43 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 39 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked and analyzed skin type and condition.\n1.2\nDiscussed different options involved in applying body\nbleaching.\n1.3\nAdvised client on various chemical reactions and\nprecautionary measures to be adopted during the entire\nprocess.\n1.4\nPositioned client comfortably during the entire process.\n1.5\nObserved time line for the bleaching activity.\n1.6\nMixed product according to salon policies and bleaching\nproduct instructions.\n1.7\nProvided clients with protective clothing according to salon\npolicies.\n1.8\nApplied bleaching product observing proper direction and\nappropriate technique.\n1.9\nUsed necessary tools and equipment, Supplies and Materials.\n1.10 Provided appropriate advices on skin maintenance program.\n1.11\nDisposed bleaching residues and sanitize workstation.\n2. Underpinning\nknowledge and\nattittudes\n2.1\nSkin Types and Condition\n2.2\nBleaching Mixture/Procedure\n2.3\nTime Management\n2.4\nCode of Ethics\n2.5\nProtective Clothing Materials\n2.6\nSalon Procedures and Policies\n2.7\nRatio and Proportion\n2.8\nMensuration and Calculations\n2.9\nMixing Technique\n3. Underpinning skills\n3.1\nApplying bleaching products\n3.2\nUsing supplies and materials\n3.3\nApplying bleaching technique\n3.4\nAdopting mixture\n3.5\nApplying clients’ relation\n3.6\nMixing bleaching product\n3.7\nUsing appropriate tools\n3.8\nApplying the correct mensuration and calculation\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nSupplies/Materials\n4.3\nBody Skin Bleaching Products\n4.4\nActual Work Station\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 44 ---\n\n--- PDF PAGE 45 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 41 -\n\nUNIT OF COMPETENCY :\nPERFORM CREATIVE NAIL DESIGN\n\nUNIT CODE\n:\nHCS515310\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in executing\ncreative design on finger and toenails. This involves performing\ntemporary hair removal activity, this involves preparing the client,\ncleaning of nails, apply desired and agreed creative design.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is consulted on the type of nail service activity\ndesired.\n1.2\nClient is consulted on possible health restrictions.\n1.3\nTreatment area, tools, equipment, supplies and materials\nare prepared for identified nail service activity according to\nOHSC requirements.\n1.4\nClient\nis\nadvised\non\nmaintenance\nrequirements,\nthe\nadvantages and disadvantages of the nail treatment.\n1.5\nNail and skin condition are identified by physical and visual\ncheck and specific client requirements to be noted and adopt\nnecessary safety precautions.\n1.6\nContra-indications including infections and nail disorders are\nidentified and referred to appropriate person for treatment\naccording to D.O.H. rules and regulations.\n1.7\nClient is positioned safety and comfortably and provided with\nprotective clothing material.\n2. Perform cleaning and\ncutting of nails\n2.1\nCuticles are pushed gently without damage to nail boarder\nfollowing safety procedures.\n2.2\nNails are disinfected, cleaned and dried completely.\n2.3\nNails are cut and trimmed according to client requirements.\n2.4\nTips are blended and shaped to achieve smooth and even\nfinish according to salon standard.\n2.5\nAppropriate sterilized tools are used to perform the cleaning\nactivity according to OHSC rules and regulations.\n2.6\nFingernails are lightly massaged following prescribed\nmovements.\n2.7\nFirst aid is applied / administered in case of accidental cuts\nand wounds.\n3. Apply different\ncreative designs\n3.1\nNail products are applied according to manufacturer’s\nrecommendation.\n3.2\nClient is consulted from time to time to ensure safety and\ncomfort during the entire process.\n3.3\nIf necessary, artificial nail area correctly applied using\nappropriate tools and equipment.\n3.4\nResults are checked to be correct well-balanced, smooth, neat\nand free from excess product on cuticle and nail walls.\n3.5\nClient is advised on after treatment care service.\n\n--- PDF PAGE 46 ---\n\n--- PDF PAGE 47 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 43 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Creative Nail Service\nActivity\n1.1\nArtificial Nail Sculpture\n1.2\nFancy Nail Design\n1.3\nAirbrush Nail Design\n1.4\nPlain Manicure\n2. Types of Clients\n2.1\nLadies\n2.2\nMen\n3. Nail Skin/Condition\n3.1\nNormal\n3.2\nAbnormal\n3.3\nHang Nail\n4. Nail Ornaments\n4.1\nSculptured Nail\n4.2\nStick on Nail Design\n4.3\nFancy Color Nail Polish\n4.4\nPlain Polish\n5. Massage Movement\n5.1\nPressing\n5.2\nSpreading\n5.3\nCircular Movement\n5.4\nStretching\n5.5\nPulling\n6. Tools and Equipment\n6.1\nManicure Table\n6.2\nStool\n6.3\nPusher\n6.4\nOttoman\n6.5\nManicure Tray\n\n--- PDF PAGE 48 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 44 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on desired creative nail service activity.\n1.2\nSelected necessary tools, equipment, supplies and materials\nbased on specific nail service activity following OHSC\nrequirements.\n1.3\nChecked and assessed nail, skin condition and adopt\nnecessary safety procedures according to clients’ specific\nrequirements and DOH rules and regulations.\n1.4\nPositioned client comfortably and safety and provide\nappropriate protective clothing materials.\n1.5\nCleaned and disinfected nails making sure that cuticles are\npushed gently without damaging nail borders.\n1.6\nCut and trimmed nails.\n1.7\nNail ornaments are applied following manufacturers\ninstructions.\n1.8\nChecked results and applied necessary retouches according\nto the clients desired outcome.\n1.9\nApplied appropriate treatment on accidental cuts.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nDifferent Nail Designs\n2.2\nType of Nail Polish\n2.3\nCode of Ethics\n2.4\nTypes of Skin and Nail Condition\n2.5\nDOH Rules and Regulations\n2.6\nOHSC Requirements\n2.7\nMassage Movements\n2.8\nNail and Skin Condition Analysis\n2.9\nSalon Policies / Procedures\n2.10 Different Nail Cutting Tools\n2.11 Different Nail Designing Tools\n\n--- PDF PAGE 49 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 45 -\n\n3. Underpinning skills\n3.1\nApplying different nail design\n3.2\nNegotiation skills\n3.3\nCommunication skills\n3.4\nHandling tools and equipment\n3.5\nApplying nail polish\n3.6\nCleaning technique\n3.7\nShaping nail technique\n3.8\nCutting / Trimming of nails\n3.9\nPerforming hand massage\n3.10 Observing proper posture\n3.11 Applying correct massage technique\n3.12 Analyzing skin and nail condition\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Live Model\n4.2 Complete Supplies and Materials\n4.3 Appropriate Tools and Equipment\n4.4 Actual or Simulated Workplace\n4.5 Nail Ornaments\n4.6 Protective Clothing\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Direct Observation with Questioning\n5.2 Demonstration with Questioning\n5.3 Written Test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 50 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 46 -"
