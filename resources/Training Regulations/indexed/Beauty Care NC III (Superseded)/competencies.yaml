iate tools \n3.8\nApplying the correct mensuration and calculation\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nLive Model \n4.2 \nSupplies/Materials \n4.3 \nBody Skin Bleaching Products \n4.4\nActual Work Station\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nDirect observation with questioning \n5.3\nWritten test\n6. Context of \nassessment\n6.1  Competency may be assessed in the workplace or accredited \nassessment center.\n\n--- PDF PAGE 44 ---\n",
