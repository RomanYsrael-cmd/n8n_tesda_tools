        "descriptor": "This unit covers the knowledge, skills and attitude in performing temporary hair removal activity. This involves preparing the client, and shaving and tweezing on desired and agreed part perform cold and hot waxing.",
        "elements": [
          {
            "number": 1,
            "title": "Prepare clients",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Client is consulted on the specific area to be treated and desired hair removing method."
              },
              {
                "number": "1.2",
                "text": "Client is advised to remove personal accessories to achieve optimum service result."
              },
              {
                "number": "1.3",
                "text": "Necessary tools, supplies, materials and hair removing product are prepared according to OHSC requirements."
              },
              {
                "number": "1.4",
                "text": "Client is provided with protective clothing and positioned in a comfortable manner."
              },
              {
                "number": "1.5",
                "text": "Skin condition where hair is to be removed is checked thoroughly."
              }
            ],
            "source_number": 1
          },
          {
            "number": 2,
            "title": "Perform shaving and tweezing",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Plucking or tweezing and shaving tools are sterilized and used according to OHSC requirements."
              },
              {
                "number": "2.2",
                "text": "Hair is shaved following direction of the hair strands and growth."
              },
              {
                "number": "2.3",
                "text": "Antiseptic is applied on the area to be shaved according to OHSC requirements."
              }
            ],
            "source_number": 2
          },
          {
            "number": 3,
            "title": "Perform cold waxing",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Skin test is performed on hairless section and if found favorable, area is applied with depilatories using standard application method according to OHSC requirements."
              },
              {
                "number": "3.2",
                "text": "Prescribed timeline is followed according to thickness of hair to be removed."
              },
              {
                "number": "3.3",
                "text": "The area is washed off with lukewarm water dried up and applied with cold cream."
              },
              {
                "number": "3.4",
                "text": "A strip of cotton cloth or cellophane is used to firmly press down the wax to adhere correctly."
              }
            ],
            "source_number": 3
          },
          {
            "number": 4,
            "title": "Perform hot waxing",
            "performance_criteria": [
              {
                "number": "4.1",
                "text": "Client is positioned in a correct manner to avoid any error or accident (like burns)."
              },
              {
                "number": "4.2",
                "text": "Wax is put to boiling point to melt completely according to OHSC requirements."
              },
              {
                "number": "4.3",
                "text": "Temperature and consistency is tested by applying a little portion of wax depilatories on the clients desired area to be wax."
              },
              {
                "number": "4.4",
                "text": "Wax is spread evenly over the surface using application method with spatula and allowed to harden."
              },
              {
                "number": "4.5",
                "text": "Wax is quickly pulled off against the direction of the hair growth and tested area is gently massaged afterwards."
              },
              {
                "number": "4.6",
                "text": "Skin surface is washed with mild soap and water, dried up and applied with talcum powder."
              },
              {
                "number": "4.7",
                "text": "Residue on the treated area is removed and applied with emollient cream or antiseptic lotion."
              }
            ],
            "source_number": 4
          }
        ],
