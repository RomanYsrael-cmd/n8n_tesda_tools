    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for BEAUTY CARE NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HAIRDRESSING\nNC Level: NC III\n\nSuggested Nominal Training Duration: 398 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of beauticians in\naccordance with industry standards. It covers basic, common and core competencies in NC III.\nBASIC COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1\nCommunicate information\nabout workplace processes.\n1.2\nLead workplace discussions.\n1.3\nIdentify and communicate\nissues arising in the workplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1\nProvide team leadership.\n2.2\nAssign responsibilities among\nmembers\n2.3\nSet performance expectation\nfor team members\n2.4\nSupervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation skills\n3.1\nIdentify relevant information in\nplanning negotiations\n3.2\nParticipate in negotiations\n3.3\nDocument areas for\nagreement\n• Direct\nobservation\n• Simulation/\nrole playing\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve workplace\nproblem related\nto work activities\n4.1\nExplain the analytical\ntechniques\n4.2\nIdentify the problem.\n4.3\nDetermine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 51 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 47 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1\nExplain the analytical\ntechniques\n5.2\nIdentify mathematical tools\nand techniques to solve\nproblem\n5.3\nApply mathematical\nprocedures/ solution\n5.4\nAnalyze results\n• Direct\nobservation\n• Simulation/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1\nIdentify appropriate\ntechnology\n6.2\nApply relevant technology\n6.3\nMaintain/ enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/\nrole playing\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/customers\n1.1 Maintain a professional image\n1.2 Meet client/customer\nrequirements\n1.3 Build credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Manage own\nperformance\n2.1 Identify tasks accurately\n2.2 Allocate priority to each task\n2.3 Allocate time lines to each task\n2.4 Meet and comply deadlines\n2.5 Know and comply with work\nschedules\n2.6 Develop work plans\n2.7 Monitor personal performance\n2.8 Get advice and guidance from\nmanagement\n2.9 Apply guidance from\nmanagement\n2.10\nClarify standard of work\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Apply quality\nstandards\n3.1 Assess clients service needs\n3.2 Assess own work\n3.3 Engage in quality improvement\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Maintain a safe,\nclean and\nefficient work\nenvironment\n4.1 Comply with health regulations\n4.2 Prepare and maintain work\narea\n4.3 Check and maintain tools and\nequipment\n4.4 Check and maintain stocks\n4.5 Provide a relaxed and caring\nenvironment\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 52 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 48 -\n\nCORE COMPETENCIES\n(360 Hrs. (2 months))\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\ntemporary hair\nremoval activity\n\n1.1 Prepare client\n1.2 Perform shaving and tweezing\n1.3 Perform cold waxing\n1.4 Perform hot waxing\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n2. Perform body\nbleach\n2.1 Prepare client\n2.2 Prepare mixture of bleaching\nproduct\n2.3 Apply bleaching product\n2.4 Perform checking and apply\nretouch\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n3. Perform creative\nnail design\n3.1 Prepare client\n3.2 Perform cleaning and cutting\nof nails\n3.3 Apply different creative\ndesigning\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\n--- PDF PAGE 53 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 49 -\n\nThe competency-based TVET system recognizes various types of delivery modes, both on\nand off-the-job as long as the learning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n• Project-based instruction is an authentic instructional model strategy in which students\nplan, implement and evaluate projects that have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n• Must be able to communicate effectively both orally and in written form\n• Must be physically, emotionally, psychologically and mentally fit\n•\nMust be able to perform basic mathematical computation\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nBEAUTY CARE – NC III\n\nRecommended list of tools, equipment and materials for the training of a minimum of 25\ntrainees for Beauty Care NC III are as follows:\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\nBRUSH\n1 unit\nInfrared\n1 btl.\nShampoo, gal\n3 pcs.\nHair brush\n1 unit\nSteamer\n1 btl.\nConditioner, 1 gal\n3 pcs.\nbarber brush\n1 unit\nIron Plate\n1 doz\nBath Towel\n3 pcs.\nSkeleton brush\n1 unit\nHair Dryer\n1 doz\nFace Towel\n3 pcs.\nRoller brush\n1 unit\nBlower\n1 doz\nHand Towel\n3 pcs.\nPaddle brush\n1 unit\nHand blower\n1 roll\nPaper towel\n3 pcs.\nApplicator brush\n2 units\nTimer\n2 sets\nNeck band, ½ doz\n3 pcs.\nTinting brush\n1 unit\nCrimpers\n3 pcs.\nHead band\n1 unit\nCurling Iron\n3 pcs.\nFlannel headband\nMIRROR\n3 units\nElectric Curlers\n(optional)\n3 btl.\nGauze mask\n\n--- PDF PAGE 54 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 50 -\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n5 pcs.\nHand mirror\n1 unit\nFoot spa machine\n1 btl.\nMousse\n10 pcs.\nFront mirror\n1 unit\nFacial machine (5 in 1)\n1 btl.\nGel, 500 ml.\n1 unit\nHand Spa Machine\n1 btl.\nSpray net, 500 ml.\nCOMB\n 1 unit Heating cap\n1 btl.\nHair polish\n3 pcs.\nWide toothed comb\n1 unit\nFacial Steamer\n1 roll\nAluminum foil\n3 pcs.\nBath comb\n1 unit\nHot cabinet\n1 box\nTissue paper\n3 pcs.\nTail comb\n 1 unit Magnifying glass\n(2 in 1)\n1 doz\nTissue roll\n3 pcs.\nLarge tooth comb\n 1 unit Sterilizer\n1 btl.\nTalcum powder, 500\ngrams\n3 pcs.\nAll purpose comb\n1 btl.\nCotton, 500 grams\n3 pcs.\nHaircutting comb\n1 roll\nCling Wrap\n3 pcs.\nTeasing comb\n1 box\nEnd paper\n3 pcs.\nFork comb\n\n3\nsets.\nEar pads\n1 box\nRubber band\nGLOVES\n\n1 btl.\nPerm lotion w/\nneutralizer, 500 ml.\n3 pcs. Rubber gloves\n\n1 set\nDeveloper, 6% 20\nvolumes; 9% 30\nvolumes; 12% 40\nvolumes, 500 ml.\neach\n1 box Disposable gloves,\nbox\n\n1 btl.\nHair wax, 500 ml.\nCAP\n\n3 pcs.\nNeck strip (cloth)\n3 pcs.\nShower cap\n1 set\nColor product form\nCream, Liquid &\nPowder\n3 pcs.\nPerming cap\n\n3 pcs.\nFrosting Cap w/\nHook\n\n3 pcs.\nPlastic applicator\nCLIPS\n\n3 btls.\nPress spray plastic\ndispenser bottle\n12\npcs.\nHair clips, 1 doz.\nSingle prong clip\n(optional)\n\n1 pc.\nWig\nDouble prong clip\n(optional)\n\n1 pc.\nHairpiece\nPIN\n\n1\nHairpin, box\n60\npcs.\nRoller pin, pcs., 5\ndoz\n\n60\npcs.\nPin curl clips, 5 doz.\n\n1 box\nInvisible pins\n6 pcs.\nClamps\n6 pcs.\nDuck bill clamp\n\n--- PDF PAGE 55 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 51 -\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\nROLLERS\n\n5 doz Cylinder shaped\nrollers (long and\nshort) doz.\n\n5 doz Medium size rollers,\ndoz.\n\n5 doz Large size rollers,\ndoz.\n\n5 doz\nJumbo rollers, doz.\n5 doz\nSmall size hair\nrollers wire, doz.\n\n1 pc.\nMeasuring glass\n6 pcs.\nInvisible hairnet\n3\nSmock gown\nTraining Materials:\n3\nApron\nCATALOG\n5\nCape\n1\nMen’s Cut Catalog\n3\nPlastic cape\n1\nLadies Cut Catalog\n3\nMixing bowls\n1\nKid’s Cut Catalog\n3\nPlastic scoop\nMagazines\n2\nDrip pan\nTextbooks\nSCISSORS\n1 pc.\nThinning scissor\n1 pc.\nCutting scissor\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\n\nStudent/Trainee Working Space\n\n1 x 1 m.\n\n1 sq. m.\n\n25 sq. m\n\nLecture/Demo Room\n\n8 x 5 m.\n\n40 sq. m.\n\n40 sq. m.\n\nLearning Resource Center\n\n3 x 5 m.\n\n15 sq. m.\n\n15 sq. m.\n\nFacilities/Equipment/ Circulation\nArea\n\n6 x 4 m.\n\n24 sq. m.\n\n24 sq. m.\nTotal :\n104 sq. m.\n\n--- PDF PAGE 56 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 52 -\n\n3.6 TRAINER’S QUALIFICATIONS FOR BEAUTY CARE NC III\n\nBEAUTY CARE – NC III\nTRAINER QUALIFICATION (TQ III)\n\n• Must have completed Trainer’s Training Methodology Course (TTMC) or its equivalent\n• Must be able to communicate effectively both orally and in written form\n• Must be physically, emotionally, psychologically and mentally fit\n• Must have at least three (3) years experience in the industry\n• Must possess good moral character\n\n3.7 INSTITUTIONAL ASSESSMENT\n\n Institutional Assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 57 ---\nTR Beauty Care NC III\nPromulgated August 2005\n- 53 -"
