        "source_title": "SERVICE AND MAINTAIN ICE PLANT REFRIGERATION SYSTEM",
        "source_text": "--- PDF PAGE 64 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n63\n \nUNIT TITLE  \n \n: SERVICE AND MAINTAIN ICE PLANT  \nREFRIGERATION SYSTEM \n \nUNIT CODE  \n \n:  HVC723326  \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \n \n  in maintaining refrigeration components, lubrication,  \n \n  refrigerant, secondary heat transfers and distribution  \n \n  systems in ice plant refrigeration units. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the \nRange of Variables \n1. Prepare for maintenance \nactivities \n1.1 Work instructions are read and \ninterpreted to determine job \nrequirements \n1.2 Appropriate manufacturer's manual is \nselected based on system requirements \n1.3 Tools and instruments are selected in \naccordance with job requirements \n1.4 Personal protective equipment (PPE) is \nselected and prepared \n2. Check and adjust refrigeration \ncomponents \n2.1 Evaporator/condenser are cleaned in \naccordance with manufacturer's \nmaintenance manual \n2.2 Refrigerant piping are checked for \ncondition, leak, and insulation in \naccordance with standard testing \nprocedures \n2.3 Tightness of support/brackets are \ninspected according to plan \n2.4 Operating condition and electro-\nmechanical controls/settings are \ninspected and adjusted in accordance \nwith manufacturer's operation/service \nmanual \n2.5 Refrigeration components are checked \nand adjusted as per manufacturer's \noperation/service manual \n2.6 Established maintenance procedures are \napplied according to plan  \n3. Maintain lubrication system in \nice plant  \n3.1 Lubrication system variables and \ncomponents are checked and adjusted \nbased on operational specifications \n3.2 Oil levels, properties and circulation \nbalances are checked and adjusted \nbased on operational specifications\n\n--- PDF PAGE 65 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n64\n3.3 Oil filters are checked based on \nmanufacturer’s maintenance procedures \n4. Maintain refrigerant system \n4.1 Liquid supply and back pressure filters \nare checked as per manufacturers \nmaintenance procedures \n4.2 Refrigerant leaks are detected and \nrectified based on procedures \n4.3 Refrigerant system variables and \ncontaminants are checked and adjusted \nbased on procedure’s manual \n4.4 Automatic and manual non-condensable \ngas purgers are checked and adjusted \nbased on operational specifications \n5. Maintain secondary heat \ntransfer equipment  \n \n \n \n \n5.1 Secondary heat transfer loop is \nchecked and findings are documented in \naccordance with established procedures \n5.2 Liquid properties are checked and \nadjusted to meet system requirements  \n5.3 Follow-up action is arranged in  \naccordance with workplace procedures \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Operating conditions \n1.1 Pressures \n1.2 Temperatures \n1.3 Voltages \n1.4 Current draws \n2.   Refrigeration components \n \n \n \n \n \n2.1 \nEvaporator \n2.2 \nCondenser \n2.3 \nRefrigerant pump \n2.4 \nOil Filters \n2.5 \nRefrigerant Piping \n2.6 \nBelts \n2.7 \nPulley alignment/tension \n2.8 \nControls \n2.9 \nCompressor \n2.10 \nValves \n2.11 \nFans/blades \n2.12 \nMotors \n3.  Operational specifications \n \n \n3.1 Unit settings \n3.2 Unit operation procedures \n3.3 Unit requirements \n4.  Refrigerant system \n2.1 Refrigerant \n2.2 Sight glass \n2.3 Level control/stand pipe\n\n--- PDF PAGE 66 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n65\n5. Secondary heat transfer loop \n5.1 Shell and tube condenser \n5.2 Tube-and-tube \n5.3 Plate-heat exchanger \n6. Liquid properties \n6.1 Water \n6.2 Refrigerant \n6.3 Glycol (ethylene or propylene) \n6.4 Brine \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical \nAspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Checked ice plant equipment components and devices in \naccordance with manufacturer's maintenance/operation \nmanual \n1.2 Checked operating conditions and electro-mechanical \ncontrols/settings in accordance with manufacturer's \noperation/service manual \n1.3 Checked and adjusted lubrication and refrigerant system \nvariables and components  \n1.4 Adjusted liquid properties to meet system requirements \n1.5 Conducted test as per standard procedures \n1.6 Demonstrated compliance with safety regulations \n1.7 Applied organizational quality procedures and processes \n1.8 Selected tools/instrument and wiring devices in accordance \nwith specification and job requirement \n1.9 Identified faults and problems and made necessary actions \nto rectify \n2.  Underpinning \nKnowledge \n2.1  SAFETY PRACTICES \n• Protective personal equipment/safety gear \n• Safety hazards \n• Handling of tools and equipment and accessories \n• Safety signs and symbols \n• Proper handling of refrigerant pressure testing  \n• Good housekeeping \n2.2  TRADE  MATHEMATICS/ MENSURATIONS \n• Linear measurements \n• Dimension \n• Ratio and proportion \n• Unit conversion\n\n--- PDF PAGE 67 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n66\n \n2.3  TOOLS/MATERIALS: \nUSES AND \nSPECIFICATIONS \n• Proper use and care of \ntools needed \n• Types of electrical \ncontrols \n• Types expansion \nvalves/motoring \ndevices \n• Types of compressor \n• Types of refrigerant \n• Types of pulley \n• Types of belts \n• Types of fins and \nmaterials use \n2.4  \nLEGISLATION/TREATY \n• Clean Air Act (RA \n8749) \n• Montreal/Kyoto \nProtocol \n2.5  DRAWING/PLAN READINGS \n• Plan specification \n• Electrical wiring diagram \n• Electrical plans, symbols and \nabbreviations \n2.6  TRADE THEORY \n• Fundamentals of refrigeration \n• Refrigeration service valves \n• Basic electricity \n• Troubleshooting charts/service \ncharts \n• Expansion device and low \npressure side of the system \n• How to evaluate the system \n• Pump-out/pump-down \nprocedure \n• Resistance testing procedure \n• Mechanical testing procedure \n• Compressor construction \n• Refrigerant charging procedure \n• Expansion valve adjustment \nprocedure \n• Back pressure valve \nadjustment procedure \n3.  Underpinning  \nSkills \n3.1  Interpreting  plans and details \n3.2  Preparing materials \n3.3  Using of electrical and mechanical tools and equipment \nproperly \n3.4  Troubleshooting technique \n3.5  Calibrating of expansion valve \n3.6  Replacing defective part \n3.7  Troubleshooting of Industrial Refrigeration system \n3.8 Performing work safety practices \n3.9  Adjusting superheat \n3.10 Aligning belt and pulley  \n3.11 Aligning door \n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1  Access to work place location \n4.2  Tools and equipment appropriate to maintaining ice plant \nrefrigeration processes \n4.3  Materials relevant to the activity \n4.4  Drawings and specifications relevant to the task \n5.  Methods of  \nAssessment \nCompetency  must be assessed through: \n5.1 Direct observation/Demonstration  \n5.2  Questions related to underpinning knowledge  \n6.  Context for \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting\n",
