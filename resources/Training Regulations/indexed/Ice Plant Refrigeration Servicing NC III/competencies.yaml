          "source_text": "1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Ensured power supply is in compliance with nameplate\nrating and/or manufacturer’s standard\n1.2 Selected types of electrical tools/instrument and wiring\ndevices in accordance with specification and job requirement\n1.3 Tested refrigerant systems as per standard procedures\n1.4 Demonstrated compliance with safety regulations applicable\nto worksite operations\n1.5 Identified faults and problems and made necessary action to\nrectify\n1.6 Communicated Interactively others where applicable to\nensure safe and effective work operations\n1.7 Completed troubleshooting refrigerant systems according to\nmanufacturer’s installation and standard\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n• Protective personal equipment/safety gears\n• Safe handling of tools and equipment\n• Proper handling of refrigerants\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 DRAWING/PLAN AND SPECIFICATION\n• Electrical wiring control diagram\n• Mechanical plan/symbols and abbreviation\n2.3 TRADE THEORY\n• Basic electricity\n• Basic refrigeration cycle\n• Fundamentals of refrigeration and control\n• Interlocking control sequence\n• Fundamentals of piping\n• Fan characteristics\n• Electrical code\n• Montreal protocol\n• EMB/DENR regulations\n• Pump principles\n• Cooling tower principles\n• Evaporative condenser principle\n\n--- PDF PAGE 71 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n70\n\n2.4 TOOLS/MATERIALS: USES\nAND SPECIFICATIONS\n• Types of electrical controls\n• Types of expansion valve\n• Types of compressor motor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of filter drier\n• Types of filter/strainer\nelement\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic contactor\n• Types of unloader\n• Types of compressor\n• Types of pump\n2.5 MAINTENANCE\n• Preventive maintenance\n2.6 LEGISLATION/TREATY\n• Clean Air Act\n• Montreal/Kyot Protocol\n2.7 PROCESSES/\nPROCEDURES\n• Compressor test\nprocedures\n• Power supply test\nprocedures\n• evaporator test\nprocedures\n• Condensing unit test\nprocedures\n• Pump test procedures\n• Cooling tower test\nprocedures\n• Expansion valve test\nprocedures\n• Automatic expansion\nvalve test procedures\n• Electrical control test\nprocedures\n• Leak testing procedure\n(for refrigeration circuit\nand water/glycol piping)\n• Pressure testing\nprocedure\n• Vacuum testing\nprocedure\n• Refrigerant charging\nprocedure\n• Pump-out/pump-down\nprocedure\n• Crank case/oil separator\nheater test procedures\n• Unloading test\nprocedures\n• Start-up procedure\n\n--- PDF PAGE 72 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n71\n\n3. Underpinning\nSkills\n\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 Following work safety\n3.4 Using electrical tools and testing equipment\n3.5 Performing electrical testing\n3.6 Performing mechanical testing\n3.7 Communicating skills\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to troubleshooting\nrefrigerant system\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 73 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n72\nUNIT TITLE\n\n: RECOVER AND RECYCLE REFRIGERANT IN\nICE PLANT SYSTEM\n\nUNIT CODE\n\n:"
