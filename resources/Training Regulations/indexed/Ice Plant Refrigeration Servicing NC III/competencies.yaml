        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including\nnew, unusual and improbable situations that may have\nhappened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of fundamental\ncause, determining the corrective action and\nprovision of recommendations\n2.2.1. Relevant equipment and operational\nprocesses\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n3. Underpinning Skills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 15 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n14\n\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios / case\nstudies / what ifs will be required as well as bank of\nquestions which will be used to probe the reason\nbehind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over a\nrange of situations, which will include disruptions to normal,\nsmooth operation. Simulation may be required to allow for\ntimely assessment of parts of this UNIT TITLE. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n6. Context for\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 16 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n15\nUNIT TITLE\n: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
        },
        "source_text": "500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and\nattitudes required to solve problems in the\nworkplace including the application of problem\nsolving techniques and to determine and resolve\nthe root cause of problems.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\n Range of Variables\n1.\nIdentify the\nproblem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3.\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental\ncauses of the\nproblem\n2.1.\nPossible causes are identified based on experience\nand the use of problem solving tools / analytical\ntechniques.\n2.2.\nPossible cause statements are developed based on\nfindings\n2.3.\nFundamental causes are identified per results of\ninvestigation conducted\n3.\nDetermine\ncorrective action\n3.1.\nAll possible options are considered for resolution of\nthe problem\n3.2.\nStrengths and weaknesses of possible options are\nconsidered\n3.3.\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4.\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures\n4.\nProvide\nrecommendation/\ns to manager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to appropriate\npersonnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 13 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical\ntechniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 14 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n13\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including\nnew, unusual and improbable situations that may have\nhappened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of fundamental\ncause, determining the corrective action and\nprovision of recommendations\n2.2.1. Relevant equipment and operational\nprocesses\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n3. Underpinning Skills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 15 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n14\n\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios / case\nstudies / what ifs will be required as well as bank of\nquestions which will be used to probe the reason\nbehind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over a\nrange of situations, which will include disruptions to normal,\nsmooth operation. Simulation may be required to allow for\ntimely assessment of parts of this UNIT TITLE. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n6. Context for\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 16 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n15\nUNIT TITLE\n: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
