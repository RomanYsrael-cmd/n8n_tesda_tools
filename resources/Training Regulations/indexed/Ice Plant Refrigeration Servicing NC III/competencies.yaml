 Installation procedures \n• Selection of unit and \ncomponents \n• Heat transfer\n\n--- PDF PAGE 81 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n80\n \n2.4  TOOLS/MATERIALS: \nUSES AND \nSPECIFICATIONS \n• Types of electrical controls \n• Types of expansion \nvalves/metering devices \n• Types of compressor \nelectric motor \n• Types of condenser \n• Types of evaporator \n• Types of refrigerant \n• Types of pressure control \n• Types of defrost timer \n• Types of fan motor \n• Types of fan \n• Types of pipe \n• Types of strainer \n• Types of thermostat \n• Types of circuit breaker \n• Types of magnetic \ncontractor \n• Types of unloader \n• Types of compressor \n• Types of pump \n• Phase sequence tester \n2.5  TRADE MATHEMATICS/ \nMENSURATION \n• Linear measurements \n• Dimensions \n• Ratio and proportion \n• Unit conversion \n2.6  LEGISLATION \n• Clean Air Act (RA 8749) \n• Montreal Protocol \n• Ozone Depleting \nRefrigerants (ODRs) \n2.7  MAINTENANCE \n• Preventive Maintenance \n2.8  PROCESSES/ \n       PROCEDURES \n• Electrical control \ncalibration procedures \n• Repair/replace/assemble \ncompressor procedure \n• Repair/replace defective \ncondenser procedure \n• Replace  liquid line \nstrainer element \nprocedure \n• Replace metering device \nprocedure \n• Replace pressure \ncontrols procedure \n• Replace thermostat \nprocedure \n• Repair/replace \nrefrigerant piping \nprocedure \n• Welding procedure \n• Refrigerant recovery \nprocedures \n• Follow the general \nprocedure for checking-\nout Refrigeration control \n• Pump-out/pump-down \nprocedures \n• Replace defrost controls \nprocedure \n• Repair/replace fan/fan \nmotor procedures re: \nevaporator/condenser \n• Refrigerant charging \nprocedures \n• Leak testing procedures \n• Mechanical testing \n• Latest update on \nrefrigerant types and \nusage in relation to \nenvironmental issues\n\n--- PDF PAGE 82 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n8