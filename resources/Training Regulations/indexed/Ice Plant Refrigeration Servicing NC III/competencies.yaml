ration cycle\n• Fundamental of refrigeration\n• How to select wire size\n• Principles of air distribution\n• Equipment selection and application\n3. Underpinning\nSkills\n\n3.1 Interpreting plan and specifications\n3.2 Preparing materials\n3.3 Communication skills\n3.4 Problem-solving\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Technical plan/drawing relevant to the task\n4.2 Materials relevant to the proposed activity\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 52 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n51\nUNIT TITLE\n:\nINSTALL ICE PLANT REFRIGERATION\nPIPING SYSTEM\n\n UNIT CODE\n :"
