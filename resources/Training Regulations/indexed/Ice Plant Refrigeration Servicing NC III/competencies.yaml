          "source_text": "1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Prepared and checked electrical materials in  consistent with job \nrequirements \n1.2  Installed/laid-out controls/protective devices in conformity with \nthe design/specification/approved working plan \n1.3 Inspected wiring connection for tightness and traced all wires \naccording to the instructions \n1.4 Checked proper wiring termination as per standard operating \nprocedures \n1.5 Demonstrated compliance with safety regulations applicable to \nworksite operations \n1.6 Identified faults and problems and made necessary action to \nrectify, if applicable \n1.7 Communicated interactively with others where applicable to \nensure safe and effective work operations \n1.8 Checked installation of ICE PLANT refrigeration electrical system \naccording to manufacturer’s installation procedures \n2. Underpinning \nKnowledge \n2.1 SAFETY PRACTICES \n• \nProtective personal equipment/safety gears \n• \nSafe handling of tools and equipment \n• \nSafety signs and symbols \n• \nGood housekeeping \n• \nElectrical safety \n2.2 DRAWING/PLAN AND SPECIFICATION \n• \nReading and interpretation of drawing/plan \n• \nElectrical symbol \n• \nElectrical wiring diagram \n2.3 TOOLS AND MATERIALS: PARTS AND USES \n• \nTypes of electrical controls \n• \nClassification of wire \n• \nProper use and care of tools needed \n• \nTypes of fittings \n• \nTypes of cable tray/cable trunk/PVC pipe \n• \nTypes and use of clamp and support \n• \nSize of wire and cables \n2.4 TRADE THEORY \n• \nBasic electricity \n• \nFundamental of control \n• \nPrinciple and operation of ICE PLANT Refrigeration System \n2.5 PROCESSES/PROCEDURES \n• \nSoldering procedure \n• \nInsulation test procedure \n• \nContinuity test procedure \n• \nWire splicing procedure \n• \nPower circuit installation \n• \nVoltage test procedure \n• \nGround test procedure \n2.6 CODES AND REGULATIONS \n• \nPhilippine Electrical Code (PEC) \n• \nLocal rules/requirements\n\n--- PDF PAGE 59 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n58\n3. Underpinning   \nSkills \n \n3.1  Interpreting plan and details \n3.2  Use of electrical materials, tools and equipment \n3.3  Wiring and insulation test \n3.4  Performing work safety \n3.5  Setting up of work \n3.6 Installing protective devices and wiring \n3.7 Connecting power circuit \n3.8 Connecting equipment grounding circuit \n3.9 Testing power wiring \n4.   Resource    \n      Implications \nThe following resources MUST be provided: \n4.1  Work place location \n4.2  Tools and equipment appropriate to installing Industrial \nRefrigeration electrical system \n4.3  Materials relevant to the activity \n4.4  Drawings and specifications relevant to the task \n5.  Methods of    \nAssessment \nCompetency must be assessed through: \n5.1 Direct observation \n5.2 Demonstration  \n5.3 Questions related to underpinning knowledge   \n6.  Context for  \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting",
