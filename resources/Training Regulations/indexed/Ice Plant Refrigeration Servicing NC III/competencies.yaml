        "source_text": "HVC723325\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\nattitudes to safely install the main ICE PLANT\nrefrigeration components and units based on\nmanufacturer's recommendations.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Prepare for installation of\ncomponents and units\n\n1.1 Installation drawings and instructions are\nchecked, read and interpreted for correct\nlocation, dimension and level in\naccordance with established procedures\n1.2 Approval for the installation is\ncoordinated and confirmed with\nappropriate authority\n1.3 Supplies and materials needed for\ninstallation are prepared in accordance\nwith specification and standard operating\nprocedures\n1.4 Work is undertaken in line with safety\nrequirements, including use of\nappropriate PPE\n2. Install components and units\n2.1 Ice plant components to be installed\nare checked and prepared in accordance\nwith drawings, designs and\nspecifications\n2.2 Compressors, shell & tube/plate heat\nexchangers, unit coolers, liquid\nreceivers, intercoolers, separators,\nevaporative condensers and its\naccessories are installed according to\nunit manual recommendation\n2.3 Pipes, fittings, stop valves, control valves\nand other accessories are installed in\naccordance with drawings, designs and\nspecifications\n2.4 Installation is completed with no damage\nto equipment and its components\n2.5 Faults/problems are identified and\nnecessary remedial action is taken in\nline with standard operating procedures\n3. Test-run ice plant refrigeration\nsystem\n3.1 Charging of Ice Plant systems and\ncomponents with refrigerant and\n\n--- PDF PAGE 61 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n60\nsecondary heat transfer fluid are\nensured in accordance with\nmanufacturer's standard operating\nprocedures\n3.2 Pre-start up checks are performed in\naccordance with standard operating\nprocedures\n3.3 Reports and documentation are\ncompleted based on approved format\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Supplies and materials\n1.1\nScrew/bolt/nuts\n1.2\nExpansion bolt\n1.3\nSulfur stick\n1.4\nElectrical tape\n1.5\nBlind rivets\n1.6\nB.I. pipes\n1.7\nWelding rod\n1.8\nRed oxide/paint\n1.9\nWasher\n1.10\nCement\n1.11\nSand\n1.12\nB.I. fittings\n1.13\nInsulation spacers\n1.14\nNitrogen gas\n1.15\nFlanges\n1.16\nOxygen-acetylene gas\n1.17\nClamps\n2. Ice plant refrigeration\ncomponents\n\n2.1\nCompressors\n2.2\nEvaporator (S&T, PHE, unit coolers)\n2.3\nCondensers (S&T, PHE & evaporative\ncondenser)\n2.4\nValves (stop, check & control)\n2.5\nSCADA\n2.6\nFans\n2.7\nSolenoids\n2.8\nThermostats\n2.9\nSwitches\n2.10 Mounting base\n3. Ice plant refrigeration systems\n3.1 Refrigeration systems include:\n• Herring bone coil evaporator\n• Flake/plate/tube ice maker\n• Freezing tank\n4. Condensate drain\n4.1 B.I. pipe\n4.2 Stainless Steel\n\n--- PDF PAGE 62 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n61\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\n of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared supplies, materials and components in\naccordance with standard operating procedures\n1.2 Installed ice plant system and its accessories in conformity\nwith the standard operating procedures\n1.3 Coordinated and confirmed installation arrangements with\nappropriate authority\n1.4 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.5 Selected types of electrical tools/instrument and wiring\ndevices in accordance with specification and job\nrequirement\n1.6 Identified faults and problems and made necessary action\nwith enterprise regulations, if necessary\n1.7 Communicated interactively with others to ensure safe and\neffective work operations\n1.8 Completed installation of ice plant refrigeration system\naccording to manufacturer’s standard operating procedures\n2. Underpinning\n Knowledge\n2.1 SAFETY PRACTICES\n• Protective personal equipment/safety gears\n• Handling of tools, equipment and accessories\n• Safety signs and symbols\n• Good housekeeping\n2.2 TRADE MATHEMATICS/MENSURATION\n• Linear measurements\n• Ratio and proportion\n• Dimension\n2.3 DRAWING/PLAN READINGS\n• Mechanical plans, symbols and abbreviations\n• Electrical plans, symbols and abbreviations\n• Architectural/Structural plans\n• Plumbing plans, symbols and abbreviations\n2.4 TRADE THEORY\n• Basic refrigeration cycle\n• Basic masonry\n• Basic sheet metal\n• Basic welding\n• Knowledge to understand the geographical location/site\nlocation\n2.5 LEGISLATION/TREATY\n• Clean Air Act (RA 8749)\n• Montreal/Kyoto Protocol\n\n--- PDF PAGE 63 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n62\n3. Underpinning\nSkills\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 Proper handling of tools and equipment\n3.4 Performing work safety practices\n3.5 Work set-up and planning\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to installing Industrial\nRefrigeration processes\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 64 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n63\n\nUNIT TITLE\n\n: SERVICE AND MAINTAIN ICE PLANT\nREFRIGERATION SYSTEM\n\nUNIT CODE\n\n:"
