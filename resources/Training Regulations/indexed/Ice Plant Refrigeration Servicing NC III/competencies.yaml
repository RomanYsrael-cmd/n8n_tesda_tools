LATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n58\n3. Underpinning\nSkills\n\n3.1 Interpreting plan and details\n3.2 Use of electrical materials, tools and equipment\n3.3 Wiring and insulation test\n3.4 Performing work safety\n3.5 Setting up of work\n3.6 Installing protective devices and wiring\n3.7 Connecting power circuit\n3.8 Connecting equipment grounding circuit\n3.9 Testing power wiring\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to installing Industrial\nRefrigeration electrical system\n4.3 Materials relevant to the activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation\n5.2 Demonstration\n5.3 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 60 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n59\nUNIT TITLE\n:\nINSTALL ICE PLANT REFRIGERATION\nEQUIPMENT\n\nUNIT CODE\n:"
