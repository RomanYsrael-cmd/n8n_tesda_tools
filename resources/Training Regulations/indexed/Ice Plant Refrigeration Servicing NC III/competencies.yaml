ypes of pump\n2.5 MAINTENANCE\n• Preventive maintenance\n2.6 LEGISLATION/TREATY\n• Clean Air Act\n• Montreal/Kyot Protocol\n2.7 PROCESSES/\nPROCEDURES\n• Compressor test\nprocedures\n• Power supply test\nprocedures\n• evaporator test\nprocedures\n• Condensing unit test\nprocedures\n• Pump test procedures\n• Cooling tower test\nprocedures\n• Expansion valve test\nprocedures\n• Automatic expansion\nvalve test procedures\n• Electrical control test\nprocedures\n• Leak testing procedure\n(for refrigeration circuit\nand water/glycol piping)\n• Pressure testing\nprocedure\n• Vacuum testing\nprocedure\n• Refrigerant charging\nprocedure\n• Pump-out/pump-down\nprocedure\n• Crank case/oil separator\nheater test procedures\n• Unloading test\nprocedures\n• Start-up procedure\n\n--- PDF PAGE 72 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n71\n\n3. Underpinning\nSkills\n\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 Following work safety\n3.4 Using electrical tools and testing equipment\n3.5 Performing electrical testing\n3.6 Performing mechanical testing\n3.7 Communicating skills\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to troubleshooting\nrefrigerant system\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 73 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n72\nUNIT TITLE\n\n: RECOVER AND RECYCLE REFRIGERANT IN\nICE PLANT SYSTEM\n\nUNIT CODE\n\n: HVC723328\n\nUNIT DESCRIPTOR\n\n: This unit covers the knowledge, skills and attitudes\nin recovering and recycling refrigerants in the ice\nplant system. This includes evaluation of unit for\nrecovering/recycling, setting-up of equipment and\nperforming recovery and recycling of refrigerant\noperations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Assess unit for recovery/\nrecycling\n1.1 Relevant data are gathered on unit to be\nrecovered/recycled as per procedure\n1.2 Appropriateness of unit for refrigerant\nrecovery/recycling is determined according to\nClean Air Act/Montreal Protocol requirements and\nmanufacturer's specifications\n2. Set-up equipment for\nrecovery/ recycling\n2.1 Equipment, instruments, tools and accessories\nare gathered based on job requirements\n2.2 Equipment, instruments and tools are checked\nbased on operation’s manual\n2.3 Equipment and accessories are set-up according\nto recovery/recycling requirements\n3. Perform refrigerant\nrecovery/ recycling\n3.1 Optimum recovery of refrigerant is determined in\nline with the Clean Air Act/ Montreal Protocol\n3.2 Refrigerants recovery/recycling is performed\naccording to manufacturer's recommendations\n3.3 Recovered refrigerant in the tank is identified and\nlabeled prior to recycling based on procedure\n3.4 Contaminants are removed from the system\nbased on instrument readings\n3.5 Recovery/recycling machine is operated and\nmaintained in accordance with manufacturer's\nrecommendations\n3.6 Safety measures in recovery/recycling of\nrefrigerants are observed in accordance with\nindustry requirements\n\n--- PDF PAGE 74 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n73\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unit\n1.1 Cold storage plant\n1.2 Ice plant\n1.3 Process refrigeration plant\n2. Equipment\n2.1 Recovery machine\n2.2 Recycling machine\n3. Instruments\n3.1 Refrigerant identifier\n3.2 Acid test kit\n4. Tools/Materials\n4.1 System analyzer\n4.2 refrigeration system\n4.3 Spanner\n4.4 Set of wrenches\n4.5 Weighing scale\n4.6 Marker\n4.7 Masking tape\n5. Optimum recovery\n5.1 Pressure reading of 30 inch/760mm Hg.\n6. Manufacturer's recommendations Includes but not limited to:\n6.1 Equipment operator's manual\n6.2 Equipment service manual\n6.3 Nameplate data\n7. Contaminants\n7.1 Acid\n7.2 Moisture\n7.3 Foreign particles e.g. chips, burr\n7.4 Non-condensable gases\n\n--- PDF PAGE 75 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n74\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Performed refrigerant recycling in compliance with\nmanufacturer's recommendations, environmental\nregulations and safety precautions\n1.2 Achieved optimum refrigerant recovery following standard\nprocedures/manufacturer's recommendations\n1.3 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.4 Selected and used appropriate processes, tools,\nmaterials and equipment to carry out tasks\n1.5 Identified faults and problems and took necessary action\nto rectify\n1.6 Communicated effectively with others where applicable to\nensure safe and effective work operations\n2. Underpinning\nKnowledge\n2.1 Recovery/recycling principles, procedures and standards\n2.2 Ozone-layer depletion and its effects\n2.3 Montreal Protocol, Clean Air Act (RA 8749) and Kyoto\nProtocol\n2.4 Recovery/recycling equipment specifications, parts and\nuses\n2.5 Refrigerant types and specifications\n2.6 Safety precautions in handling refrigerants\n2.7 Refrigerant identifier instrument, specification, parts and\nuses\n2.8 Trade Theory\n-\nBasic electrical\n-\nRefrigeration\n-\nCompressor\n-\nCondenser\n-\nExpansion valve\n-\nLubricant\n-\nPrinciples of Refrigeration\n-\nCompression\n-\nCondensing\n-\nExpansion\n-\nRevaporizing\n-\nBasic electronics\n-\nBasic automotive\n-\nElectrical and mechanical system of refrigeration\n-\n Heat transfer\n\n--- PDF PAGE 76 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n75\n\n3. Underpinning\nSkills\n\n3.1 Installing and operating recovery and recycling machine\n3.2 Interpreting manufacturer and equipment data\n3.3 Estimating cost of recovery/recycling\n3.4 Maintaining recovery/recycling machine\n3.5 Use of refrigerant identifier\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Manufacturer's manual\n4.2 Work place location\n4.3 Materials, tools and equipment relevant to the proposed\nactivity\n4.4 Refrigeration system\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.3 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\n simulated work place setting\n\n--- PDF PAGE 77 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n76\n\nUNIT TITLE\n: REPAIR AND RETROFIT ICE PLANT SYSTEMS\nAND ITS ACCESSORIES\n\nUNIT CODE : HVC723329\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nrepairing and retrofitting ice plant system and its\naccessories. I t includes evaluating the condition and\nrepairing faulty components, performing preventive\nmaintenance and testing ice plant refrigeration\nsystem operation\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Evaluate condition of\nexisting ice plant systems\n1.1 Visual inspections of all refrigeration\ncomponents are performed and any signs of\ndamage, lubricant leaks and corrosion are\nreported to the authorized personnel\n1.2 Refrigeration systems are checked based on\nmanufacturer’s specification\n1.3 Leak test is performed based on time\nrequirement and any leaks found are repaired\naccording to manufacturer’s specifications\n2. Prepare for\nservicing/repairing ice\nplant and components\n2.1\nWork instructions are read and interpreted to\ndetermine job requirements\n2.2\nElectrical materials are prepared and\nchecked in accordance with system\nrequirements\n2.3\nAppropriate PPE is selected and prepared in\nline with the job requirements\n2.4\nWork safety is observed according to\nenterprise regulations\n3. Prepare ice plant\nsystems for retrofitting\n3.1 Required tools and equipment are selected\nand used based on procedure\n3.2 Faults identified from a visual inspection and\noperational check are rectified, according to\nsystem requirements\n3.3 Amount of oil in the compressor crankcase/oil\nseparator is optimized based on procedure\n3.4 Optimum amount of refrigerant is recovered in\naccordance with manufacturer's\nrecommendations\n3.5 Refrigeration system is pump-out and\nevacuated\n4. Repair/replace faulty ice\nplant components\n4.1\nIce plant components are correctly identified\nbased on manual\n\n--- PDF PAGE 78 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n77\n\n4.2\nFaults are identified and diagnosed based on\nprocedure\n4.3\nOperational function of each component is\ninspected and tested in accordance with the\nstandard operating procedures\n4.4\nIce plant components are repaired/replaced\nas per manufacturer's operation/repair\nmanual\n4.5\nIce plant components are reconditioned and\noverhauled in accordance with workplace\nprocedures\n5. Test industrial\nrefrigeration system\noperation\n5.1\nSuitable tools and compatible equipment are\nselected and used based on manufacturer's\nspecifications\n5.2\nRefrigeration system is checked for leaks\nbased on procedure\n5.3\nAny leaks located as a result of leak\ndetection tests are sealed in compliance with\ncompressor and manufacturer's instructions\n5.4\nRefrigeration system is operated within\ncompressor and manufacturer's acceptable\nlimits of temperatures and pressures\n5.5\nSafe working practices are observed\nthroughout the task\n6. Undertake preventive\nmaintenance\ncheck/adjustment on ice\nplant refrigeration\n6.1\nInspection and testing of ice plant\nrefrigeration components is carried out with\nappropriate test equipment in accordance\nwith refrigeration principles, procedures and\nsafety requirements\n6.2\nPreventive maintenance is performed\naccording to established plan\n6.3\nMaintenance records/service reports are\nrecorded and completed in accordance with\nstandard operating procedures\n\n--- PDF PAGE 79 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n78\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Electrical materials\n\n1.1 Electrical tape\n1.2 Wire connector\n1.3 Wires and cables\n1.4 Breaker\n1.5 Terminal clips/plugs\n2. Safety precautions\n2.1 Personal safety\n2.2 Safety of others\n2.3 Safety of equipment\n3. Leaks\nInclude but not limited to:\n3.1 Leaks on piping\n3.2 Leaks around compressor\n3.3 Evaporator and condenser\n4. Evacuation\n4.1 Minimum of 1 hour, steady vacuum of 500\nmicrons unless otherwise specified by the\ncompressor and manufacturer\n5. Ice plant refrigeration\ncomponents\n5.1 Compressor\n5.2 Condenser\n5.3 Evaporator\n5.4 Liquid Line Strainer\n5.5 Metering Device\n5.6 Pressure Controls\n5.7 Expansion Valve\n5.8 Refrigerant Piping\n5.9 Defrost Controls\n5.10 Fan/Fan Motor\n5.11 Pipe Insulation\n\n--- PDF PAGE 80 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n79\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nPerformed visual inspection of all refrigeration\ncomponents\n1.2\nSelected types of electrical tools/instrument and wiring\ndevices, equipment and materials in accordance with\nspecification and job requirement\n1.3\nIdentified and diagnosed faults in accordance with the\nstandard operating procedures\n1.4\nReported and repaired any signs of damage, lubricant\nleaks and corrosion\n1.5\nRepaired/replaced ice plant refrigeration components as\nper manufacturer's operation/repair manual\n1.6\nReconditioned/overhauled ice plant refrigeration\ncomponents in accordance with workplace procedures\n1.7\nTested refrigeration system operation according to\nmanufacturer's specifications and standard operating\nprocedures\n1.8\nPerformed preventive maintenance in accordance with\nmanufacturer's specifications\n1.9\nRecorded and completed maintenance/service reports\nin accordance with standard operating procedures\n1.10 Demonstrated compliance with safety regulations\napplicable to worksite operations\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n• Protective personal\nequipment/safety gear\n• Safe handling of tools and\nequipment\n• Proper handling of\nrefrigerants/pressure\ntesting and welding gases\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 DRAWING/PLAN AND\nSPECIFICATION\n• Electrical wiring control\ndiagram\n• Mechanical plan/symbols\nand abbreviations\n• Electrical plans, symbols\nand abbreviations\n\n2.3 TRADE THEORY\n• Basic electricity\n• Basic refrigeration cycle\n• Fundamentals of control\n• Principle and operation of\nauxiliary parts of\nrefrigeration system\n• Principle and operation of\nrefrigeration system\n• Principle and operation of\ninterlocking control\n• Fan characteristics\n• Electrical code\n• Refrigeration system\n• Basic welding\n• Installation procedures\n• Selection of unit and\ncomponents\n• Heat transfer\n\n--- PDF PAGE 81 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n80\n\n2.4 TOOLS/MATERIALS:\nUSES AND\nSPECIFICATIONS\n• Types of electrical controls\n• Types of expansion\nvalves/metering devices\n• Types of compressor\nelectric motor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of strainer\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic\ncontractor\n• Types of unloader\n• Types of compressor\n• Types of pump\n• Phase sequence tester\n2.5 TRADE MATHEMATICS/\nMENSURATION\n• Linear measurements\n• Dimensions\n• Ratio and proportion\n• Unit conversion\n2.6 LEGISLATION\n• Clean Air Act (RA 8749)\n• Montreal Protocol\n• Ozone Depleting\nRefrigerants (ODRs)\n2.7 MAINTENANCE\n• Preventive Maintenance\n2.8 PROCESSES/\n PROCEDURES\n• Electrical control\ncalibration procedures\n• Repair/replace/assemble\ncompressor procedure\n• Repair/replace defective\ncondenser procedure\n• Replace liquid line\nstrainer element\nprocedure\n• Replace metering device\nprocedure\n• Replace pressure\ncontrols procedure\n• Replace thermostat\nprocedure\n• Repair/replace\nrefrigerant piping\nprocedure\n• Welding procedure\n• Refrigerant recovery\nprocedures\n• Follow the general\nprocedure for checking-\nout Refrigeration control\n• Pump-out/pump-down\nprocedures\n• Replace defrost controls\nprocedure\n• Repair/replace fan/fan\nmotor procedures re:\nevaporator/condenser\n• Refrigerant charging\nprocedures\n• Leak testing procedures\n• Mechanical testing\n• Latest update on\nrefrigerant types and\nusage in relation to\nenvironmental issues\n\n--- PDF PAGE 82 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n81\n3. Underpinning\nSkills\n\n3.1 Reading and interpreting schematic diagram, plans,\ndrawings, specifications and manuals\n3.2 Preparing materials\n3.3 Installing equipment, components and accessories\n3.4 Fabricating brackets\n3.5 Proper Use of electrical tools and materials\n3.6 Safe manual handling\n3.7 Testing electrical/mechanical\n3.8 Troubleshooting technique\n3.9 Replacing defective parts\n3.10 Preparing reports\n3.11 Literacy and language skills needed to read and\ninterpret manufacturer's manual\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Refrigeration system\n4.3 Refrigerant\n4.4 Materials, tools and equipment appropriate to\nrepairing/retrofitting processes\n4.5 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 83 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n82\n\nUNIT TITLE\n: PERFORM START-UP AND COMMISSIONING\n OF ICE PLANT SYSTEM\n\nUNIT CODE : HVC723330\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\n\ntesting, starting up and ensuring fitness of ice plant\nsystem for operation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Prepare for commissioning of\nan ice plant systems\n2.1 Work instructions are read and interpreted\nprior to commissioning\n2.2 Tools and equipment are selected in\naccordance with job requirements\n2.3 Pre-commissioning checks are completed\nand complied with procedures laid down in\nsystem documents\n2.4 Commissioning method and program are\nsecured and recording sheets are prepared\nin accordance with established procedures\n2.5 Commissioning instruments are prepared\nand calibrated in accordance with system\ndocuments\n2. Assess ice plant system\noperation\n2.1 Systems are checked safely in accordance\nwith standard operating procedures\n2.2 Pressures and temperature are determined\nand recorded in accordance with established\nprocedures\n2.3 Faults are isolated to component level and\nappropriate corrective action is applied\n2.4 Refrigeration systems are checked for leaks\nand contamination safely in accordance with\nstandard operating procedures\n3. Recover refrigerant from the\nsystem\n3.1 Refrigerant system is evacuated using\nappropriate method and techniques in\naccordance with prescribed codes and\nregulations\n3.2 Refrigerant evacuated from the refrigeration\nare contained/ disposed of in accordance\nwith standard operating procedures\n3.3 Amount of refrigerant reclaimed from\nrefrigeration system are recorded/ reported in\naccordance with established procedures\n4. Charge the refrigeration system 4.1 Systems are charged with required\nrefrigerant according to system specifications\nand manufacturer's instruction\n\n--- PDF PAGE 84 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n83\n4.2 Appropriate lubricating oil is added to the\nrefrigeration systems in accordance with\nstandard operating procedures\n4.3 Refrigeration systems are checked for leaks\nusing appropriate tools and techniques in\naccordance with established operating\nprocedures\n5. Perform pre-start checks\n5.1 Electrical, pneumatic and other controls are\ntested and set to meet specified and safety\nperformance requirements\n5.2 Electrical systems are checked based on\nprocedure and safety requirement\n5.3 Motor, motor ratings and pump rotation\ndirections are verified against fuse ratings\nand overload settings based on manual\n5.4 Fluid flows are tested and balanced based\non specifications\n5.5 Noise and vibration levels are confirmed\nwithin limits\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. System documents\n\n1.1 Operating and maintenance\nprocedures/instructions for the system\n1.2 Manufacturer's specifications\n1.3 Company-prepared operating and\nmaintenance manuals\n2. Commissioning instruments\n\nIncluding but is not limited to:\n2.1 System analyzer\n2.2 Manifold gauge\n2.3 Clamp meter\n2.4 Multi-tester\n2.5 Thermometer\n2.6 Electronic leak detector (Halocarbon)\n2.7 Sulfur Stick (Ammonia)\n\n--- PDF PAGE 85 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n84\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Checked refrigeration system in accordance with standard\noperating procedures\n1.2 Isolated faults to component level and applied appropriate\ncorrective action\n1.3 Checked refrigeration for leaks and contamination safely\n1.4 Recorded/Reported recovery of refrigerant from the systems\nin accordance with relevant codes and regulation\n1.5 Charged systems with the correct refrigerant based on\nsystem specifications\n1.6 Tested and set electrical and other controls to meet\nspecified performance requirements\n1.7 Identified faults and problems and made necessary action to\nrectify\n1.8 Communicated interactively with others to ensure safe and\neffective work operations\n1.9 Completed commissioning and starting-up procedures in\naccordance with the standard procedures\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n• Protective personal equipment/safety gears\n• Safe handling of tools and equipment\n• Proper handling of refrigerants\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 DRAWING/PLAN AND SPECIFICATION\n• Electrical wiring control diagram\n• Mechanical plan/symbols and abbreviation\n\n--- PDF PAGE 86 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n85\n\n2.3 TOOLS/MATERIALS:\nUSES AND\nSPECIFICATIONS\n• Types of electrical controls\n• Types of expansion valve\n• Types of compressor\nelectric motor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of strainer\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic\ncontactor\n• Types of unloader\n• Types of compressor\n• Types of pump\n2.4 MAINTENANCE\n• Preventive maintenance\n2.5 TRADE THEORY\n• Basic electricity\n• Basic refrigeration cycle\n• Fundamentals of\nrefrigeration and control\n• Interlocking control\nsequence\n• Fundamentals of piping\n• Fan characteristics\n• Pump principles\n• Cooling tower principles\n• Evaporative condenser\nprinciples\n\n2.6 PROCESSES/\nPROCEDURES\n• Compressor test\nprocedures\n• Power supply test\nprocedures\n• Evaporator test procedures\n• Condensing unit test\nprocedures\n• Pump test procedures\n• Cooling tower test\nprocedures\n• Expansion valve test\nprocedures\n• Automatic expansion valve\ntest procedures\n• Electrical control test\nprocedures\n• Leak testing procedure (for\nrefrigeration circuit and\nwater/glycol piping)\n• Pressure testing procedure\n\n• Vacuum testing procedure\n• Refrigerant charging\nprocedure\n• Pump-out/pump-down\nprocedure\n• Crank case heater test\nprocedures\n• Unloading test procedures\n• Start-up procedure\n2.7 LEGISLATION/TREATY\n• Clean Air Act (RA 8749)\n• Montreal/Kyoto Protocol\n\n--- PDF PAGE 87 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n86\n3. Underpinning\nSkills\n\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 Performing work safety\n3.4 Proper handling of electrical tools and testing equipment\n3.5 Performing electrical testing\n3.6 Performing mechanical testing\n3.7 Communicating effectively\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment relevant to commissioning of\nrefrigeration systems\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 88 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n87"
