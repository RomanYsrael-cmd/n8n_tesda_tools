          "source_text": "1. Evaluate condition of \nexisting ice plant systems \n1.1 Visual inspections of all refrigeration \ncomponents are performed and any signs of \ndamage, lubricant leaks and corrosion are \nreported to the authorized personnel \n1.2 Refrigeration systems are checked based on \nmanufacturer’s specification \n1.3 Leak test is performed based on time \nrequirement and any leaks found are repaired \naccording to manufacturer’s specifications \n2.  Prepare for \nservicing/repairing ice \nplant and components \n2.1 \nWork instructions are read and interpreted to \ndetermine job requirements \n2.2 \nElectrical materials are prepared and \nchecked in accordance with system \nrequirements \n2.3 \nAppropriate PPE is selected and prepared in \nline with the job requirements \n2.4 \nWork safety is observed according to \nenterprise regulations \n3.  Prepare ice plant \nsystems for retrofitting \n3.1 Required tools and equipment are selected \nand used based on procedure \n3.2 Faults identified from a visual inspection and \noperational check are rectified, according to \nsystem requirements \n3.3 Amount of oil in the compressor crankcase/oil \nseparator is optimized based on procedure \n3.4 Optimum amount of refrigerant is recovered in \naccordance with manufacturer's \nrecommendations \n3.5 Refrigeration system is pump-out and \nevacuated \n4.  Repair/replace faulty ice \nplant components \n4.1 \nIce plant components are correctly identified \nbased on manual\n\n--- PDF PAGE 78 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n77\n \n4.2 \nFaults are identified and diagnosed based on \nprocedure \n4.3 \nOperational function of each component is \ninspected and tested in accordance with the \nstandard operating procedures \n4.4 \nIce plant components are repaired/replaced \nas per manufacturer's operation/repair \nmanual \n4.5 \nIce plant components are reconditioned and \noverhauled in accordance with workplace \nprocedures \n5.  Test industrial \nrefrigeration system \noperation  \n5.1 \nSuitable tools and compatible equipment are \nselected and used based on manufacturer's \nspecifications \n5.2 \nRefrigeration system is checked for leaks \nbased on procedure \n5.3 \nAny leaks located as a result of leak \ndetection tests are sealed in compliance with \ncompressor and manufacturer's instructions \n5.4 \nRefrigeration system is operated within \ncompressor and manufacturer's acceptable \nlimits of temperatures and pressures \n5.5 \nSafe working practices are observed \nthroughout the task  \n6.  Undertake preventive \nmaintenance \ncheck/adjustment on ice \nplant refrigeration  \n6.1 \nInspection and testing of ice plant \nrefrigeration components is carried out with \nappropriate test equipment in accordance \nwith refrigeration principles, procedures and \nsafety requirements \n6.2 \nPreventive maintenance is performed \naccording to established plan \n6.3 \nMaintenance records/service reports are \nrecorded and completed in accordance with \nstandard operating procedures\n\n--- PDF PAGE 79 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n78\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Electrical materials \n \n \n \n \n1.1 Electrical tape \n1.2 Wire connector \n1.3 Wires and cables \n1.4 Breaker \n1.5 Terminal clips/plugs \n2.  Safety precautions \n2.1 Personal safety \n2.2 Safety of others \n2.3 Safety of equipment \n3.  Leaks \nInclude but not limited to: \n3.1 Leaks on piping  \n3.2 Leaks around compressor \n3.3 Evaporator and condenser \n4.  Evacuation \n4.1 Minimum of 1 hour, steady vacuum of 500 \nmicrons unless otherwise specified by the   \ncompressor and manufacturer \n5.  Ice plant refrigeration \ncomponents \n5.1 Compressor \n5.2 Condenser \n5.3 Evaporator \n5.4 Liquid Line Strainer \n5.5 Metering Device \n5.6 Pressure Controls \n5.7 Expansion Valve \n5.8 Refrigerant Piping \n5.9 Defrost Controls \n5.10 Fan/Fan Motor \n5.11 Pipe Insulation\n\n--- PDF PAGE 80 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n79"
