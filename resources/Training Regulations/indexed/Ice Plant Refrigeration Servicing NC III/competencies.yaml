        "source_text": "HVC723323\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nto install ice plant refrigeration piping systems\naccording to plan. It includes preparation of piping\nrequirements, laying out and insulation of secondary\nrefrigerant piping\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Prepare piping requirements\n1.1 Work instructions are read and\n interpreted based on job requirements\n1.2 Piping requirements are prepared and\nchecked for damages in accordance with\nplans and specifications\n1.3 Tools and equipment are selected\nrelevant to required tasks\n1.4 Fabrication of pipe hangers and supports\nare checked in conformity with designs\nand specifications\n1.5 Work is undertaken in line with safety\nrequirements\n2. Lay-out refrigerant/secondary\nrefrigerant piping\n2.1 Selection of brackets and supports are\ninspected in accordance with job\nrequirements\n2.2 Installation of brackets and supports are\nchecked according to plan\n2.3 Refrigerant/secondary refrigerant piping is\nlaid out in conformity with design\n2.4 Refrigerant/secondary refrigerant piping is\ninstalled in accordance with approved\ndesign and manufacturer's specification\n3. Inspect welding of pipe joints\n\n3.1 Tools and equipment required for pipe\nbrazing are inspected in line with job\nrequirements\n3.2 Operation of SMAW/GTAW equipment is\nsupervised in accordance with\nmanufacturer's manual and safety\nrequirements\n3.3 Quality of welded pipe joints are inspected\nensuring no leakage and quality finish in\naccordance with enterprise standards\n3.4 Economical use of piping materials are\nensured in accordance with approved plan\nand standard operating procedures\n\n--- PDF PAGE 53 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n52\n4. Perform insulation of\nrefrigerant/ secondary\nrefrigerant piping\n4.1 Required insulating/sealing/adhesive\nmaterials are applied in accordance with\nmanufacturer's specifications\n4.2 Refrigerant /secondary refrigerant piping is\ninsulated as per standard procedures\n4.3 Joints are prepared and checked to ensure\nfit and air tightness in line with standard\nprocedures\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Piping requirements\n\n1.1 Piping\n1.2 Pipe fittings\n1.3 Stop and control valves\n1.4 Insulation\n1.5 Hangers, clamps, brackets\n2. Tools\n2.1 Wrenches\n2.2 Pliers\n2.3 Screw driver\n2.4 Hammer\n2.5 Pipe cutter\n2.6 Chisel\n2.7 Electric drill\n2.8 Electric disc grinder\n3. Equipment\n3.1 Plasma cutter equipment\n3.2 SMAW and GTAW equipment\n3.3 Leak detector (Halocarbon)\n3.4 Vacuum pump\n3.5 Oxy-Acetylene welding equipment\n4. Secondary refrigerant\n4.1 Nitrogen gas\n4.2 Ammonia\n\n--- PDF PAGE 54 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n53\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Prepared and checked piping requirements\n1.2 Ensured fabrication of pipe hangers and supports are in\nconformity with design and specifications\n1.3 Ensured laying-out of refrigerant/secondary refrigerant piping are\nin conformity with design/manufacturer's installation procedures\n1.4 Inspected welding of piping joints in accordance with approved\nindustry standards\n1.5 Checked installation of piping system in accordance with the plan\nand designs\n1.6 Demonstrated compliance with safety regulations applicable to\nworksite operations\n1.7 Identified faults and problems and made necessary action to\nrectify, if applicable\n1.8 Communicated interactively with others to ensure safe and\neffective work operations\n2. Underpinning\n Knowledge\n2.1 SAFETY PRACTICES\n•\nProtective personal equipment/safety gears\n•\nHandling of tools, equipment and accessories\n•\nSafety signs and symbols\n•\nGood housekeeping\n•\nRules on the safe use of scaffolds and ladders\n2.2 DRAWING/PLAN READINGS\n•\nReading of drawing/plan and interpretation\n•\nPlan specifications\n2.3 MATERIALS/TOOLS AND EQUIPMENT\n•\nProper use and care of tools needed\n•\nTypes of insulation\n•\nImportance of support and bracket\n•\nTypes of piping/sizing\n•\nTypes of fittings\n2.4 TRADE THEORY\n•\nBasic refrigeration cycle\n•\nPipe processing\n•\nHeat transfer\n•\nBasic arc welding\n•\nBasic gas welding\n•\nLeak testing\n•\nWelding procedure\n•\nPiping principles\n•\nSlope and risers\n•\nPrinciple of water treatment\n•\nFlushing of nitrogen\n2.5 LEGISLATION/TREATY\n•\nClean Air Act (RA 8749)\n•\nMontreal/Kyoto Protocol\n\n--- PDF PAGE 55 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n54\n3. Underpinning\n Skills\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 Welding procedures\n3.4 Using of tools and equipment properly\n3.5 Testing techniques on leak\n3.6 Performing work safety\n3.7 Setting-up of work\n3.8 Pressurizing\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to installing Industrial\nRefrigeration piping system\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation\n5.2 Demonstration\n5.3 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 56 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n55\nUNIT TITLE\n:\nINSTALL ICE PLANT REFRIGERATION\nELECTRICAL SYSTEM\n\nUNIT CODE\n:"
