        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nPerformed visual inspection of all refrigeration\ncomponents\n1.2\nSelected types of electrical tools/instrument and wiring\ndevices, equipment and materials in accordance with\nspecification and job requirement\n1.3\nIdentified and diagnosed faults in accordance with the\nstandard operating procedures\n1.4\nReported and repaired any signs of damage, lubricant\nleaks and corrosion\n1.5\nRepaired/replaced ice plant refrigeration components as\nper manufacturer's operation/repair manual\n1.6\nReconditioned/overhauled ice plant refrigeration\ncomponents in accordance with workplace procedures\n1.7\nTested refrigeration system operation according to\nmanufacturer's specifications and standard operating\nprocedures\n1.8\nPerformed preventive maintenance in accordance with\nmanufacturer's specifications\n1.9\nRecorded and completed maintenance/service reports\nin accordance with standard operating procedures\n1.10 Demonstrated compliance with safety regulations\napplicable to worksite operations\n2. Underpinning\nKnowledge\n2.1 SAFETY PRACTICES\n• Protective personal\nequipment/safety gear\n• Safe handling of tools and\nequipment\n• Proper handling of\nrefrigerants/pressure\ntesting and welding gases\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 DRAWING/PLAN AND\nSPECIFICATION\n• Electrical wiring control\ndiagram\n• Mechanical plan/symbols\nand abbreviations\n• Electrical plans, symbols\nand abbreviations\n\n2.3 TRADE THEORY\n• Basic electricity\n• Basic refrigeration cycle\n• Fundamentals of control\n• Principle and operation of\nauxiliary parts of\nrefrigeration system\n• Principle and operation of\nrefrigeration system\n• Principle and operation of\ninterlocking control\n• Fan characteristics\n• Electrical code\n• Refrigeration system\n• Basic welding\n• Installation procedures\n• Selection of unit and\ncomponents\n• Heat transfer\n\n--- PDF PAGE 81 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n80\n\n2.4 TOOLS/MATERIALS:\nUSES AND\nSPECIFICATIONS\n• Types of electrical controls\n• Types of expansion\nvalves/metering devices\n• Types of compressor\nelectric motor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of strainer\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic\ncontractor\n• Types of unloader\n• Types of compressor\n• Types of pump\n• Phase sequence tester\n2.5 TRADE MATHEMATICS/\nMENSURATION\n• Linear measurements\n• Dimensions\n• Ratio and proportion\n• Unit conversion\n2.6 LEGISLATION\n• Clean Air Act (RA 8749)\n• Montreal Protocol\n• Ozone Depleting\nRefrigerants (ODRs)\n2.7 MAINTENANCE\n• Preventive Maintenance\n2.8 PROCESSES/\n PROCEDURES\n• Electrical control\ncalibration procedures\n• Repair/replace/assemble\ncompressor procedure\n• Repair/replace defective\ncondenser procedure\n• Replace liquid line\nstrainer element\nprocedure\n• Replace metering device\nprocedure\n• Replace pressure\ncontrols procedure\n• Replace thermostat\nprocedure\n• Repair/replace\nrefrigerant piping\nprocedure\n• Welding procedure\n• Refrigerant recovery\nprocedures\n• Follow the general\nprocedure for checking-\nout Refrigeration control\n• Pump-out/pump-down\nprocedures\n• Replace defrost controls\nprocedure\n• Repair/replace fan/fan\nmotor procedures re:\nevaporator/condenser\n• Refrigerant charging\nprocedures\n• Leak testing procedures\n• Mechanical testing\n• Latest update on\nrefrigerant types and\nusage in relation to\nenvironmental issues\n\n--- PDF PAGE 82 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n81\n3. Underpinning\nSkills\n\n3.1 Reading and interpreting schematic diagram, plans,\ndrawings, specifications and manuals\n3.2 Preparing materials\n3.3 Installing equipment, components and accessories\n3.4 Fabricating brackets\n3.5 Proper Use of electrical tools and materials\n3.6 Safe manual handling\n3.7 Testing electrical/mechanical\n3.8 Troubleshooting technique\n3.9 Replacing defective parts\n3.10 Preparing reports\n3.11 Literacy and language skills needed to read and\ninterpret manufacturer's manual\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Refrigeration system\n4.3 Refrigerant\n4.4 Materials, tools and equipment appropriate to\nrepairing/retrofitting processes\n4.5 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 83 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n82\n\nUNIT TITLE\n: PERFORM START-UP AND COMMISSIONING\n OF ICE PLANT SYSTEM\n\nUNIT CODE :"
