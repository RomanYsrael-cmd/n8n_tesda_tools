        "source_text": "--- PDF PAGE 77 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n76\n \nUNIT TITLE \n:   REPAIR AND RETROFIT ICE PLANT SYSTEMS \nAND ITS ACCESSORIES \n \nUNIT CODE                     :  HVC723329 \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes in  \nrepairing and retrofitting ice plant system and its \naccessories. I t includes evaluating the condition and \nrepairing faulty components, performing preventive \nmaintenance and testing ice plant refrigeration \nsystem operation      \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the  \nRange of Variables \n1. Evaluate condition of \nexisting ice plant systems \n1.1 Visual inspections of all refrigeration \ncomponents are performed and any signs of \ndamage, lubricant leaks and corrosion are \nreported to the authorized personnel \n1.2 Refrigeration systems are checked based on \nmanufacturer’s specification \n1.3 Leak test is performed based on time \nrequirement and any leaks found are repaired \naccording to manufacturer’s specifications \n2.  Prepare for \nservicing/repairing ice \nplant and components \n2.1 \nWork instructions are read and interpreted to \ndetermine job requirements \n2.2 \nElectrical materials are prepared and \nchecked in accordance with system \nrequirements \n2.3 \nAppropriate PPE is selected and prepared in \nline with the job requirements \n2.4 \nWork safety is observed according to \nenterprise regulations \n3.  Prepare ice plant \nsystems for retrofitting \n3.1 Required tools and equipment are selected \nand used based on procedure \n3.2 Faults identified from a visual inspection and \noperational check are rectified, according to \nsystem requirements \n3.3 Amount of oil in the compressor crankcase/oil \nseparator is optimized based on procedure \n3.4 Optimum amount of refrigerant is recovered in \naccordance with manufacturer's \nrecommendations \n3.5 Refrigeration system is pump-out and \nevacuated \n4.  Repair/replace faulty ice \nplant components \n4.1 \nIce plant components are correctly identified \nbased on manual\n\n--- PDF PAGE 78 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n77\n \n4.2 \nFaults are identified and diagnosed based on \nprocedure \n4.3 \nOperational function of each component is \ninspected and tested in accordance with the \nstandard operating procedures \n4.4 \nIce plant components are repaired/replaced \nas per manufacturer's operation/repair \nmanual \n4.5 \nIce plant components are reconditioned and \noverhauled in accordance with workplace \nprocedures \n5.  Test industrial \nrefrigeration system \noperation  \n5.1 \nSuitable tools and compatible equipment are \nselected and used based on manufacturer's \nspecifications \n5.2 \nRefrigeration system is checked for leaks \nbased on procedure \n5.3 \nAny leaks located as a result of leak \ndetection tests are sealed in compliance with \ncompressor and manufacturer's instructions \n5.4 \nRefrigeration system is operated within \ncompressor and manufacturer's acceptable \nlimits of temperatures and pressures \n5.5 \nSafe working practices are observed \nthroughout the task  \n6.  Undertake preventive \nmaintenance \ncheck/adjustment on ice \nplant refrigeration  \n6.1 \nInspection and testing of ice plant \nrefrigeration components is carried out with \nappropriate test equipment in accordance \nwith refrigeration principles, procedures and \nsafety requirements \n6.2 \nPreventive maintenance is performed \naccording to established plan \n6.3 \nMaintenance records/service reports are \nrecorded and completed in accordance with \nstandard operating procedures\n\n--- PDF PAGE 79 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n78\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Electrical materials \n \n \n \n \n1.1 Electrical tape \n1.2 Wire connector \n1.3 Wires and cables \n1.4 Breaker \n1.5 Terminal clips/plugs \n2.  Safety precautions \n2.1 Personal safety \n2.2 Safety of others \n2.3 Safety of equipment \n3.  Leaks \nInclude but not limited to: \n3.1 Leaks on piping  \n3.2 Leaks around compressor \n3.3 Evaporator and condenser \n4.  Evacuation \n4.1 Minimum of 1 hour, steady vacuum of 500 \nmicrons unless otherwise specified by the   \ncompressor and manufacturer \n5.  Ice plant refrigeration \ncomponents \n5.1 Compressor \n5.2 Condenser \n5.3 Evaporator \n5.4 Liquid Line Strainer \n5.5 Metering Device \n5.6 Pressure Controls \n5.7 Expansion Valve \n5.8 Refrigerant Piping \n5.9 Defrost Controls \n5.10 Fan/Fan Motor \n5.11 Pipe Insulation\n\n--- PDF PAGE 80 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n79\n \nEVIDENCE GUIDE \n \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 \nPerformed visual inspection of all refrigeration \ncomponents \n1.2 \nSelected types of electrical tools/instrument and wiring \ndevices, equipment and materials in accordance with \nspecification and job requirement \n1.3 \nIdentified and diagnosed faults in accordance with the \nstandard operating procedures \n1.4 \nReported and repaired any signs of damage, lubricant \nleaks and corrosion \n1.5 \nRepaired/replaced ice plant refrigeration components as \nper manufacturer's operation/repair manual \n1.6 \nReconditioned/overhauled ice plant refrigeration \ncomponents in accordance with workplace procedures \n1.7 \nTested refrigeration system operation according to \nmanufacturer's specifications and standard operating \nprocedures \n1.8 \nPerformed preventive maintenance in accordance with \nmanufacturer's specifications \n1.9 \nRecorded and completed maintenance/service reports \nin accordance with standard operating procedures \n1.10 Demonstrated compliance with safety regulations \napplicable to worksite operations \n2.  Underpinning \nKnowledge \n2.1  SAFETY PRACTICES \n• Protective personal \nequipment/safety gear \n• Safe handling of tools and \nequipment \n• Proper  handling of \nrefrigerants/pressure \ntesting and welding gases \n• Safety signs and symbols \n• Safety hazard \n• Good housekeeping \n2.2 DRAWING/PLAN AND \nSPECIFICATION \n• Electrical wiring control \ndiagram \n• Mechanical plan/symbols \nand abbreviations \n• Electrical plans, symbols \nand abbreviations \n \n2.3  TRADE THEORY \n• Basic electricity \n• Basic refrigeration cycle \n• Fundamentals of control \n• Principle and operation of \nauxiliary parts of \nrefrigeration system \n• Principle and operation of \nrefrigeration system \n• Principle and operation of \ninterlocking control \n• Fan characteristics \n• Electrical code \n• Refrigeration system \n• Basic welding \n• Installation procedures \n• Selection of unit and \ncomponents \n• Heat transfer\n\n--- PDF PAGE 81 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n80\n \n2.4  TOOLS/MATERIALS: \nUSES AND \nSPECIFICATIONS \n• Types of electrical controls \n• Types of expansion \nvalves/metering devices \n• Types of compressor \nelectric motor \n• Types of condenser \n• Types of evaporator \n• Types of refrigerant \n• Types of pressure control \n• Types of defrost timer \n• Types of fan motor \n• Types of fan \n• Types of pipe \n• Types of strainer \n• Types of thermostat \n• Types of circuit breaker \n• Types of magnetic \ncontractor \n• Types of unloader \n• Types of compressor \n• Types of pump \n• Phase sequence tester \n2.5  TRADE MATHEMATICS/ \nMENSURATION \n• Linear measurements \n• Dimensions \n• Ratio and proportion \n• Unit conversion \n2.6  LEGISLATION \n• Clean Air Act (RA 8749) \n• Montreal Protocol \n• Ozone Depleting \nRefrigerants (ODRs) \n2.7  MAINTENANCE \n• Preventive Maintenance \n2.8  PROCESSES/ \n       PROCEDURES \n• Electrical control \ncalibration procedures \n• Repair/replace/assemble \ncompressor procedure \n• Repair/replace defective \ncondenser procedure \n• Replace  liquid line \nstrainer element \nprocedure \n• Replace metering device \nprocedure \n• Replace pressure \ncontrols procedure \n• Replace thermostat \nprocedure \n• Repair/replace \nrefrigerant piping \nprocedure \n• Welding procedure \n• Refrigerant recovery \nprocedures \n• Follow the general \nprocedure for checking-\nout Refrigeration control \n• Pump-out/pump-down \nprocedures \n• Replace defrost controls \nprocedure \n• Repair/replace fan/fan \nmotor procedures re: \nevaporator/condenser \n• Refrigerant charging \nprocedures \n• Leak testing procedures \n• Mechanical testing \n• Latest update on \nrefrigerant types and \nusage in relation to \nenvironmental issues\n\n--- PDF PAGE 82 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n81\n3.  Underpinning  \nSkills \n \n \n \n \n \n3.1 Reading and interpreting schematic diagram, plans, \ndrawings, specifications and manuals \n3.2 Preparing materials \n3.3 Installing equipment, components and accessories \n3.4 Fabricating brackets \n3.5 Proper Use of electrical tools and materials \n3.6 Safe manual handling \n3.7 Testing electrical/mechanical  \n3.8 Troubleshooting technique \n3.9 Replacing defective parts \n3.10 Preparing reports \n3.11 Literacy and language skills needed to read and \ninterpret manufacturer's manual \n4.  Resource    \n     Implications \nThe following resources MUST be provided: \n4.1 Work place location \n4.2 Refrigeration system \n4.3 Refrigerant \n4.4  Materials, tools and equipment appropriate to \nrepairing/retrofitting processes \n4.5  Drawings and specifications relevant to the task \n5.  Methods of \nAssessment \nCompetency must be assessed through: \n5.1 Direct observation/Demonstration  \n5.2  Questions  related to underpinning knowledge  \n6.  Context for  \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting\n",
