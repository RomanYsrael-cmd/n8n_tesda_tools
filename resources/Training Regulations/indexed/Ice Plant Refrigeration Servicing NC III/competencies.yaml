        "source_title": "TROUBLESHOOT ICE PLANT REFRIGERATION SYSTEM",
        "source_text": "--- PDF PAGE 68 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n67\n \n \nUNIT TITLE  \n \n:  TROUBLESHOOT ICE PLANT REFRIGERATION \n SYSTEM \n \nUNIT CODE  \n \n:  HVC723327 \n \nUNIT DESCRIPTOR \n \n: This unit covers the knowledge, skills and attitudes  \nin troubleshooting ice plant refrigeration systems.  It  \nincludes planning and preparing materials, tools and  \nequipment and identifying and rectifying faults. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the  \nRange of Variables \n1.  Plan and prepare for \ntroubleshooting \n1.1 Appropriate wiring diagrams, charts and \nmanuals are interpreted in line with job \nrequirements \n1.2 Appropriate materials, tools and equipment \nare selected and prepared based on manual \n1.3 Power supply is checked to ensure \ncompliance with nameplate rating and/or \nmanufacturer’s standard \n2.  Identify and rectify faults  \n2.1 Refrigeration system components are \ntested following correct testing procedures \n2.2 Faults/problems with refrigerant system are \ndiagnosed in accordance with established \nprocedures \n2.3 Remedial action is taken to overcome \nfaults/problems in line system requirements \n2.4 Work is completed safely in line with \nworkplace safety guidelines \n2.5 Appropriate PPE is selected and used in \nline with the job requirements \n2.6 Report on testing procedure, including \nfaults and repair, is completed in line with \nSOPs \n3.  Test-run refrigeration system \n3.1 Refrigeration system is tested in line with \nmanufacturer's instructions \n3.2 System is evaluated in accordance with \nspecifications and requirements   \n3.3 Report on testing refrigeration system is \nprepared and completed in line with \nenterprise procedures\n\n--- PDF PAGE 69 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n68\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Refrigeration system  \n     components \n1.1  Compressor \n1.2  Cooling tower \n1.3  Condensers \n1.3.1 Evaporative Condenser \n1.3.2 Air cooled condenser \n1.3.3 Water cooled condenser \n1.4  Evaporator (Refrigerant Flow Control) \n1.5  Metering device \n1.5.1 Electrical controls \n1.5.2 Thermostat \n1.5.3 Timer \n1.5.4 Expansion valves \n1.5.5 Back pressure valves \n1.6  Refrigerant circuit \n2.  Test \n \n \n \n \n2.1  Insulation \n2.2  Resistance \n2.3  Mechanical \n2.4  Continuity \n2.5  Timing Sequence \n3.  PPE \nIncludes but not limited to: \n3.1  Self Breathing Apparatus \n3.2  Gas mask \n3.3  Safety shoes \n3.4  Safety goggles \n3.5  Apron \n3.6  Gloves \n3.7  Mask\n\n--- PDF PAGE 70 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n69\n \nEVIDENCE GUIDE \n \n1.  Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Ensured power supply is in compliance with nameplate \nrating and/or manufacturer’s standard \n1.2 Selected types of electrical tools/instrument and wiring \ndevices in accordance with specification and job requirement \n1.3 Tested refrigerant systems as per standard procedures \n1.4 Demonstrated compliance with safety regulations applicable   \nto worksite operations \n1.5 Identified faults and problems and made necessary action to \nrectify \n1.6 Communicated Interactively others where applicable to \nensure safe and effective work operations \n1.7 Completed troubleshooting refrigerant systems  according to \nmanufacturer’s installation and standard \n2.  Underpinning \nKnowledge \n2.1  SAFETY PRACTICES \n• Protective personal equipment/safety gears \n• Safe handling of tools and equipment \n• Proper  handling of refrigerants \n• Safety signs and symbols \n• Safety hazard \n• Good housekeeping \n2.2 DRAWING/PLAN AND SPECIFICATION \n• Electrical wiring control diagram \n• Mechanical plan/symbols and abbreviation \n2.3  TRADE THEORY \n• Basic electricity \n• Basic refrigeration cycle \n• Fundamentals of refrigeration and control \n• Interlocking control sequence \n• Fundamentals of piping \n• Fan characteristics \n• Electrical code \n• Montreal protocol \n• EMB/DENR regulations \n• Pump principles \n• Cooling tower principles \n• Evaporative condenser principle\n\n--- PDF PAGE 71 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n70\n \n2.4  TOOLS/MATERIALS: USES \nAND SPECIFICATIONS \n• Types of electrical controls \n• Types of expansion valve \n• Types of compressor motor \n• Types of condenser \n• Types of evaporator \n• Types of refrigerant \n• Types of pressure control \n• Types of defrost timer \n• Types of fan motor \n• Types of fan \n• Types of pipe \n• Types of filter drier \n• Types of filter/strainer \nelement \n• Types of thermostat \n• Types of circuit breaker \n• Types of magnetic contactor \n• Types of unloader \n• Types of compressor \n• Types of pump \n2.5  MAINTENANCE \n• Preventive maintenance \n2.6  LEGISLATION/TREATY \n• Clean Air Act \n• Montreal/Kyot Protocol \n2.7  PROCESSES/ \nPROCEDURES \n• Compressor test \nprocedures \n• Power supply test \nprocedures \n• evaporator test \nprocedures \n• Condensing unit test \nprocedures \n• Pump test procedures \n• Cooling tower test \nprocedures \n• Expansion valve test \nprocedures \n• Automatic expansion \nvalve test procedures \n• Electrical control test \nprocedures \n• Leak testing procedure \n(for refrigeration circuit \nand water/glycol piping) \n• Pressure testing \nprocedure \n• Vacuum testing \nprocedure \n• Refrigerant charging \nprocedure \n• Pump-out/pump-down \nprocedure \n• Crank case/oil separator \nheater test procedures \n• Unloading test \nprocedures \n• Start-up procedure\n\n--- PDF PAGE 72 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III \n \n \n71\n \n3.  Underpinning \nSkills \n \n \n \n3.1 Interpreting plan and details \n3.2 Preparing  materials \n3.3 Following work safety \n3.4 Using  electrical tools and testing equipment \n3.5 Performing electrical testing \n3.6 Performing mechanical testing \n3.7 Communicating skills \n \n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1 Work place location \n4.2 Tools and equipment appropriate to troubleshooting \nrefrigerant system \n4.3 Materials relevant to the proposed activity \n4.4 Drawings and specifications relevant to the task \n \n5.  Methods of \nAssessment \nCompetency must be assessed through: \n5.1 Direct observation/Demonstration  \n5.2 Questions related to underpinning knowledge  \n \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n",
