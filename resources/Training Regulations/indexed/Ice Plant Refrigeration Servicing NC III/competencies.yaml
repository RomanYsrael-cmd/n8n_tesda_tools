        "evidence_guide": {
          "source_text": "1. Critical Aspects\n of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared supplies, materials and components in\naccordance with standard operating procedures\n1.2 Installed ice plant system and its accessories in conformity\nwith the standard operating procedures\n1.3 Coordinated and confirmed installation arrangements with\nappropriate authority\n1.4 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.5 Selected types of electrical tools/instrument and wiring\ndevices in accordance with specification and job\nrequirement\n1.6 Identified faults and problems and made necessary action\nwith enterprise regulations, if necessary\n1.7 Communicated interactively with others to ensure safe and\neffective work operations\n1.8 Completed installation of ice plant refrigeration system\naccording to manufacturer’s standard operating procedures\n2. Underpinning\n Knowledge\n2.1 SAFETY PRACTICES\n• Protective personal equipment/safety gears\n• Handling of tools, equipment and accessories\n• Safety signs and symbols\n• Good housekeeping\n2.2 TRADE MATHEMATICS/MENSURATION\n• Linear measurements\n• Ratio and proportion\n• Dimension\n2.3 DRAWING/PLAN READINGS\n• Mechanical plans, symbols and abbreviations\n• Electrical plans, symbols and abbreviations\n• Architectural/Structural plans\n• Plumbing plans, symbols and abbreviations\n2.4 TRADE THEORY\n• Basic refrigeration cycle\n• Basic masonry\n• Basic sheet metal\n• Basic welding\n• Knowledge to understand the geographical location/site\nlocation\n2.5 LEGISLATION/TREATY\n• Clean Air Act (RA 8749)\n• Montreal/Kyoto Protocol\n\n--- PDF PAGE 63 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n62\n3. Underpinning\nSkills\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 Proper handling of tools and equipment\n3.4 Performing work safety practices\n3.5 Work set-up and planning\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to installing Industrial\nRefrigeration processes\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Questions related to underpinning knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 64 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n63\n\nUNIT TITLE\n\n: SERVICE AND MAINTAIN ICE PLANT\nREFRIGERATION SYSTEM\n\nUNIT CODE\n\n:"
