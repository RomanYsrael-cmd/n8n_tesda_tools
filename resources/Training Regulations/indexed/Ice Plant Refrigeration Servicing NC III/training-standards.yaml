ofit ICE\nPLANT\nrefrigeration\nsystem and Its\naccessories\n8.1 Evaluate condition of\nexisting refrigeration\nsystem\n8.2 Plan for servicing/\nrepairing refrigeration\nplant and components\n8.3 Prepare the system for\nretrofitting\n8.4 Repair/replace faulty\ncomponents\n8.5 Test refrigeration system\noperation\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n9. Perform start-Up\nand\ncommissioning\nfor ICE PLANT\nrefrigeration\nsystems\n\n9.1 Prepare for\ncommissioning ICE\nPLANT refrigeration\nsystem\n9.2 Assess the system\noperation\n9.3 Recover refrigerant from\nthe system\n9.4 Charge the system\n9.5 Perform pre-start up\nchecks\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n--- PDF PAGE 93 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n92\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the\ncurriculum. Delivery shall be guided by the 10 basic principles of\ncompetency-based TVET:\n\n• The training is based on curriculum developed from the\n\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should\n accommodate individualized and self-paced learning\n strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\n\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\n\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning\n\n(RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various\ntypes of delivery modes, both on and off-the-job as long as the\nlearning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when\ndesigning training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-\nschool and in-industry training or fieldwork components.\nDetails can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n\n• Modular/self-paced is a competency-based training\nmodality wherein the trainee is allowed to progress at his\nown pace. The trainer facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein\nfast learners are given the opportunity to assist the slow\nlearners.\n\n--- PDF PAGE 94 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n93\n\n• Supervised Industry Training or On-the-Job Training is an\napproach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in\nthe training regulations.\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or\ncomputer technologies.\n\n• Project-based instruction is an authentic instructional\nmodel or strategy in which students plan, implement and\nevaluate projects that have real world applications.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and\neducational experience. Other requirements like health and\nphysical requirements may be included. Passing entry written\nexaminations may also be indicated if necessary.\n\nBefore entering this course, the learner must be able to:\n• install PACU/CRE components, piping system, and\nelectrical system\n• service and maintain PACU/CRE\n• troubleshoot PACU/CRE\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nICE PLANT REFRIG