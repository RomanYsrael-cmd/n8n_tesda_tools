    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title :\nICE PLANT REFRIGERATION SERVICING\n PTQF\n:\nNC III\n\nNominal Training Duration: 184 hours (Basic)\n\n 216 hours (Common)\n 272 hours (Core)\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\nICE PLANT Refrigeration Servicing. It includes installation, servicing and\nmaintaining, troubleshooting and repairing Ice Plant Refrigeration System.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes\n1.2 Lead workplace discussion\n1.3 Identify and communicate\nissues arising in the\nworkplace\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Lead small\nteams\n2.1 Provide team leadership\n2.2 Assign responsibilities\n2.3 Set performance\nexpectations for team\nmembers\n2.4 Supervise team\nperformance\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 89 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n88\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Plan negotiations\n3.2 Participate in negotiations\nDiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Solve problems\nrelated to work\nactivities\n4.1 Identify the problem\n4.2 Determine fundamental\ncause of problem\n4.3 Determine corrective/\npreventive action\n4.4 Provide/Convey\nrecommendations to\nmanager\nDiscussion\nCase study\nSymposium\nObservation\nInterview\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblems\n5.2 Apply mathematical\ncomputation\n5.3 Analyze the result of\nmathematical application\nDiscussion\nCase study\nContextual\nlearning\nQuestioning (oral\nand written)\n6. Use relevant\ntechnologies\n6.1 Study/Select appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/Enhance relevant\ntechnology\nDiscussion\nCase study\nSymposium\nObservation\nInterview\nCase study\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nmaterials and\ntools\n1.1 Identify materials and tools\n1.2 Request materials and tools\n1.3 Receive and inspect\nmaterials and tools\nSelf-paced/\nModular\nDemonstration\nGroup\nDiscussion\nWritten\nPractical /\nPerformance Test\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring\ninstruments\n3.2 Carry-out measurements\nand calculations\n\nSelf-paced/\nModular\nDemonstration\nGroup\nDiscussion\n\nWritten/Oral\nExamination\nPractical\nDemonstration\n\n--- PDF PAGE 90 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n89\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform basic\nbench work\n\n4.1 Prepare materials, tools and\nequipment for layout\n4.2 Layout features in\nworkplace\n4.3 Cut sheets, plates and bars\n4.4 Smooth sheets plates and\nbars\n4.5 Drill holes in sheets, plates\nand bars\n4.6 Bore holes in sheet plates\nand bars\n4.7 Bend sheets, plates and\nbars\n4.8 Join sheets, plates and bars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job\ntraining\n\nInterview\nDemonstration\nDirect\nObservation\n5. Perform basic\nelectrical works\n5.1 Measure and analyze circuit\nand load resistance in\nelectrical system\n5.2 Measure and analyze\nvoltage in electrical system\n5.3 Measure and analyze\ncurrent in electrical system\n5.4 Test simple electrical\ncomponents and\nconnections\n5.5 Repair minor electrical\nsystem troubles\nModular\nComputer-\nbased training\n(Simulation)\nDemonstration\nOn- the-job\ntraining\n\nInterview\nComputer-based\nassessment\n(Simulation)\nDemonstration\nDirect\nObservation\n6. Maintain tools\nand equipment\n6.1 Check the conditions of\ntools and equipment\n6.2 Perform basic preventive\nmaintenance\n6.3 Store tools and equipment\nSmall Group\nDiscussion\nDemonstration\nof Practical\nSkills\nModular\nObservation and\nOral questioning\nDemonstration\nand Oral\nquestioning\nWritten test\n7. Perform\nhousekeeping\nand safety\npractices\n\n7.1 Sort materials, tools and\nequipment\n7.2 Clean workplace area,\nmaterials, tools and\nequipment\n7.3 Systematize dispensing and\nretrieval of materials, tools\nand equipment\n7.4 Identify and minimize/\neliminate hazards\n7.5 Respond and record\naccidents\n7.6 Follow basic securities\nSmall Group\nDiscussion\nDemonstration\nof Practical\nSkills\nModular\n\nObservation and\nOral questioning\nDemonstration\nand Oral\nquestioning\nWritten test\n\n8. Document work\naccomplished\n8.1 Identify forms and data\n8.2 Prepare reports\nLecture\nDemonstration\nof Practical\nSkills\nModular\nDemonstration\nand Oral\nquestioning\nWritten Test\n\n--- PDF PAGE 91 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n90\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Survey site for\ninstallation\n\n1.1 Prepare for surveying site\n1.2 Survey site\nDiscussion\nDemonstration\nHands-on\nIndustry visit\nDemonstration/\nObservation with\nQuestioning\nWritten report\n2. Install ICE\nPLANT\nrefrigeration\npiping system\n\n2.1 Prepare piping\nrequirements\n2.2 Lay out refrigerant\nsecondary refrigerant piping\nsystem\n2.3 Perform insulation of\nrefrigerant/secondary\nrefrigerant piping\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n3. Install ICE\nPLANT\nrefrigeration\nelectrical\nsystem\n\n3.1 Lay out electrical system\n3.2 Install power supply wiring\n3.3 Install controls and\nprotective devices\n3.4 Test run electrical system\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n4. Install ICE\nPLANT\nrefrigeration\nequipment\n4.1 Perform pre installation\nactivities\n4.2 Install ICE PLANT\nrefrigeration system\ncomponents and units\n4.3 Test run ICE PLANT\nrefrigeration system\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n5. Service and\nmaintain ICE\nPLANT\nrefrigeration\nsystem\n5.1 Inspect/Adjust ICE PLANT\nrefrigeration components\n5.2 Maintain lubrication system\n5.3 Maintain refrigerant system\n5.4 Maintain secondary heat\ntransfer equipment\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n6. Troubleshoot\nICE PLANT\nrefrigeration\nsystem\n\n6.1 Prepare for troubleshooting\n6.2 Diagnose faults\n6.3 Troubleshoot electrical\nsystem\n6.4 Troubleshoot mechanical\nsystem\n6.5 Test run refrigeration system\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n7. Recover and\nrecycle\nrefrigerant from\nICE PLANT\nrefrigeration\nsystem\n7.1 Assess the unit for\nrecovery/recycling\n7.2 Set up equipment for\nrecovery/recycling\nactivities\n7.3 Recovery/recycle\nrefrigerant\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n--- PDF PAGE 92 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n91\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n8. Repair and\nretrofit ICE\nPLANT\nrefrigeration\nsystem and Its\naccessories\n8.1 Evaluate condition of\nexisting refrigeration\nsystem\n8.2 Plan for servicing/\nrepairing refrigeration\nplant and components\n8.3 Prepare the system for\nretrofitting\n8.4 Repair/replace faulty\ncomponents\n8.5 Test refrigeration system\noperation\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n9. Perform start-Up\nand\ncommissioning\nfor ICE PLANT\nrefrigeration\nsystems\n\n9.1 Prepare for\ncommissioning ICE\nPLANT refrigeration\nsystem\n9.2 Assess the system\noperation\n9.3 Recover refrigerant from\nthe system\n9.4 Charge the system\n9.5 Perform pre-start up\nchecks\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n--- PDF PAGE 93 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n92"
