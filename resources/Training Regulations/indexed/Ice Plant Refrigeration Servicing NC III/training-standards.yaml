    "source_text": "SECTION 3\nTRAINING STANDARDS\n\nThese guidelines are set to provide technical and vocational education\nand training (TVET) providers with information and other important requirements\nto consider when designing training programs for ICE PLANT Refrigeration\nServicing NC III.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title :\nICE PLANT REFRIGERATION SERVICING\n PTQF\n:\nNC III\n\nNominal Training Duration: 184 hours (Basic)\n\n 216 hours (Common)\n 272 hours (Core)\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\nICE PLANT Refrigeration Servicing. It includes installation, servicing and\nmaintaining, troubleshooting and repairing Ice Plant Refrigeration System.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes\n1.2 Lead workplace discussion\n1.3 Identify and communicate\nissues arising in the\nworkplace\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Lead small\nteams\n2.1 Provide team leadership\n2.2 Assign responsibilities\n2.3 Set performance\nexpectations for team\nmembers\n2.4 Supervise team\nperformance\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 89 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n88\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Plan negotiations\n3.2 Participate in negotiations\nDiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Solve problems\nrelated to work\nactivities\n4.1 Identify the problem\n4.2 Determine fundamental\ncause of problem\n4.3 Determine corrective/\npreventive action\n4.4 Provide/Convey\nrecommendations to\nmanager\nDiscussion\nCase study\nSymposium\nObservation\nInterview\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblems\n5.2 Apply mathematical\ncomputation\n5.3 Analyze the result of\nmathematical application\nDiscussion\nCase study\nContextual\nlearning\nQuestioning (oral\nand written)\n6. Use relevant\ntechnologies\n6.1 Study/Select appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/Enhance relevant\ntechnology\nDiscussion\nCase study\nSymposium\nObservation\nInterview\nCase study\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nmaterials and\ntools\n1.1 Identify materials and tools\n1.2 Request materials and tools\n1.3 Receive and inspect\nmaterials and tools\nSelf-paced/\nModular\nDemonstration\nGroup\nDiscussion\nWritten\nPractical /\nPerformance Test\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring\ninstruments\n3.2 Carry-out measurements\nand calculations\n\nSelf-paced/\nModular\nDemonstration\nGroup\nDiscussion\n\nWritten/Oral\nExamination\nPractical\nDemonstration\n\n--- PDF PAGE 90 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n89\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform basic\nbench work\n\n4.1 Prepare materials, tools and\nequipment for layout\n4.2 Layout features in\nworkplace\n4.3 Cut sheets, plates and bars\n4.4 Smooth sheets plates and\nbars\n4.5 Drill holes in sheets, plates\nand bars\n4.6 Bore holes in sheet plates\nand bars\n4.7 Bend sheets, plates and\nbars\n4.8 Join sheets, plates and bars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job\ntraining\n\nInterview\nDemonstration\nDirect\nObservation\n5. Perform basic\nelectrical works\n5.1 Measure and analyze circuit\nand load resistance in\nelectrical system\n5.2 Measure and analyze\nvoltage in electrical system\n5.3 Measure and analyze\ncurrent in electrical system\n5.4 Test simple electrical\ncomponents and\nconnections\n5.5 Repair minor electrical\nsystem troubles\nModular\nComputer-\nbased training\n(Simulation)\nDemonstration\nOn- the-job\ntraining\n\nInterview\nComputer-based\nassessment\n(Simulation)\nDemonstration\nDirect\nObservation\n6. Maintain tools\nand equipment\n6.1 Check the conditions of\ntools and equipment\n6.2 Perform basic preventive\nmaintenance\n6.3 Store tools and equipment\nSmall Group\nDiscussion\nDemonstration\nof Practical\nSkills\nModular\nObservation and\nOral questioning\nDemonstration\nand Oral\nquestioning\nWritten test\n7. Perform\nhousekeeping\nand safety\npractices\n\n7.1 Sort materials, tools and\nequipment\n7.2 Clean workplace area,\nmaterials, tools and\nequipment\n7.3 Systematize dispensing and\nretrieval of materials, tools\nand equipment\n7.4 Identify and minimize/\neliminate hazards\n7.5 Respond and record\naccidents\n7.6 Follow basic securities\nSmall Group\nDiscussion\nDemonstration\nof Practical\nSkills\nModular\n\nObservation and\nOral questioning\nDemonstration\nand Oral\nquestioning\nWritten test\n\n8. Document work\naccomplished\n8.1 Identify forms and data\n8.2 Prepare reports\nLecture\nDemonstration\nof Practical\nSkills\nModular\nDemonstration\nand Oral\nquestioning\nWritten Test\n\n--- PDF PAGE 91 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n90\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Survey site for\ninstallation\n\n1.1 Prepare for surveying site\n1.2 Survey site\nDiscussion\nDemonstration\nHands-on\nIndustry visit\nDemonstration/\nObservation with\nQuestioning\nWritten report\n2. Install ICE\nPLANT\nrefrigeration\npiping system\n\n2.1 Prepare piping\nrequirements\n2.2 Lay out refrigerant\nsecondary refrigerant piping\nsystem\n2.3 Perform insulation of\nrefrigerant/secondary\nrefrigerant piping\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n3. Install ICE\nPLANT\nrefrigeration\nelectrical\nsystem\n\n3.1 Lay out electrical system\n3.2 Install power supply wiring\n3.3 Install controls and\nprotective devices\n3.4 Test run electrical system\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n4. Install ICE\nPLANT\nrefrigeration\nequipment\n4.1 Perform pre installation\nactivities\n4.2 Install ICE PLANT\nrefrigeration system\ncomponents and units\n4.3 Test run ICE PLANT\nrefrigeration system\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n5. Service and\nmaintain ICE\nPLANT\nrefrigeration\nsystem\n5.1 Inspect/Adjust ICE PLANT\nrefrigeration components\n5.2 Maintain lubrication system\n5.3 Maintain refrigerant system\n5.4 Maintain secondary heat\ntransfer equipment\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n6. Troubleshoot\nICE PLANT\nrefrigeration\nsystem\n\n6.1 Prepare for troubleshooting\n6.2 Diagnose faults\n6.3 Troubleshoot electrical\nsystem\n6.4 Troubleshoot mechanical\nsystem\n6.5 Test run refrigeration system\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n7. Recover and\nrecycle\nrefrigerant from\nICE PLANT\nrefrigeration\nsystem\n7.1 Assess the unit for\nrecovery/recycling\n7.2 Set up equipment for\nrecovery/recycling\nactivities\n7.3 Recovery/recycle\nrefrigerant\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n--- PDF PAGE 92 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n91\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n8. Repair and\nretrofit ICE\nPLANT\nrefrigeration\nsystem and Its\naccessories\n8.1 Evaluate condition of\nexisting refrigeration\nsystem\n8.2 Plan for servicing/\nrepairing refrigeration\nplant and components\n8.3 Prepare the system for\nretrofitting\n8.4 Repair/replace faulty\ncomponents\n8.5 Test refrigeration system\noperation\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n9. Perform start-Up\nand\ncommissioning\nfor ICE PLANT\nrefrigeration\nsystems\n\n9.1 Prepare for\ncommissioning ICE\nPLANT refrigeration\nsystem\n9.2 Assess the system\noperation\n9.3 Recover refrigerant from\nthe system\n9.4 Charge the system\n9.5 Perform pre-start up\nchecks\nDiscussion\nDemonstration\nHands-on\nIndustry visit\n\nDemonstration/\nObservation with\nQuestioning\n\n--- PDF PAGE 93 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n92\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the\ncurriculum. Delivery shall be guided by the 10 basic principles of\ncompetency-based TVET:\n\n• The training is based on curriculum developed from the\n\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should\n accommodate individualized and self-paced learning\n strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\n\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\n\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning\n\n(RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various\ntypes of delivery modes, both on and off-the-job as long as the\nlearning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when\ndesigning training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-\nschool and in-industry training or fieldwork components.\nDetails can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n\n• Modular/self-paced is a competency-based training\nmodality wherein the trainee is allowed to progress at his\nown pace. The trainer facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein\nfast learners are given the opportunity to assist the slow\nlearners.\n\n--- PDF PAGE 94 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n93\n\n• Supervised Industry Training or On-the-Job Training is an\napproach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in\nthe training regulations.\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or\ncomputer technologies.\n\n• Project-based instruction is an authentic instructional\nmodel or strategy in which students plan, implement and\nevaluate projects that have real world applications.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and\neducational experience. Other requirements like health and\nphysical requirements may be included. Passing entry written\nexaminations may also be indicated if necessary.\n\nBefore entering this course, the learner must be able to:\n• install PACU/CRE components, piping system, and\nelectrical system\n• service and maintain PACU/CRE\n• troubleshoot PACU/CRE\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nICE PLANT REFRIGERATION SERVICING NC III\n\nRecommended list of tools, equipment and materials for the training\nof 25 trainees for ICE PLANT Refrigeration Servicing NC III.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n10 sets\nPush and Pull\nRule\n5 units\nMasonry drill\n2 rms\nForm Report\n10 sets\nMeter stick\n5 units\nMotor compressor\n25\nsets\nBlueprint\n10 sets\nSpirit level/water\nlevel\n5 units\nFan motor\n25\nsets\nManufacturer’s\nmanual\n10 sets\nScrew driver\n2 units\nHigh Pressure water\n25\nsets\nSealant\n\n--- PDF PAGE 95 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n94\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n10\nsets\nPliers\n5\nunits\nVacuum pump\n25\nsets\nCondensate drain\n10\nsets\nWrench Box\n5\nsets\nEvaporator fan and\nmotor\n10\nsets\nElectrical wire\n\n10\nsets\nScrew driver\n5\nunits\nOxy-Acetylene\nwelding outfit\n5 units\nCircuit breaker/safety\nswitch\n10\nsets\nCrimping tools\n5\nunits\nEvaporator fan and\nmotor\n25\nsets\nWiring diagrams\n\n10\nsets\nBending tool\n5\nunits\nCondenser fan motor\n25\nsets\nCourseware (Learning\nelements and Manuals)\n10\nsets\nSwaging tool\n2\nunits\nOverload protector\n10\nsets\nSwitch\n\n10\nsets\nFlaring tool\n3\nunits\nArc welding machine\n10\nsets\nCapacitor\n10\nsets\nTube cutters\n5\nunits\nRecovery/recycling\nmachine\n10\nsets\nRelay\n10\nunits\nVernier caliper\n\n5 sets\nPhilippine Electrical\nCode\n10\nunits\nAdjustable wrench\n\n10\nsets\nElectrical tape\n10\nsets\nOpen end wrench\n\n15\nsets\nAir filters\n10\nunits\nMulti-tester\n\n25\nsets\nRequisition slip\n10\nsets\nClamp ammeter\n\n5 liters\nOil\n5 sets\nMegger tester\n\n5 units\nGrease\n5 units\nLeak detector\n\n10\nboxes\nRags\n10\nunits\nSystem analyzer\n\n10\nboxes\nSoap\n10\nunits\nDigital thermometer\n\n25\nsets\nSand paper\n\n5 units Refrigerant cylinder\n\n 5\nunits\nNitrogen gas\n\n25\nsets\nPersonal protective\nequipment\n\n25\nsets\nTubes (Copper steel,\nAluminum relevant to\nrequired activity task.\n\n25\nsets\nFiller rolls (Bronze ,\nSteel, Aluminum\nRelevant to required\nactivity/ task\n\n10\nsets\nFluxes (Borax,\nAluminum and Silver)\n\n--- PDF PAGE 96 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n95\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n\n25\nboxes\nFittings\n\n5 sets\nNitrogen regulator\n\n2 units\nHigh pressure\n washer\n\n15\nunits\nStrike lighter\n\n10\nsets\nDefective electrical\ncontrols\n\n10\nsets\nRelays\n\n5 sets\nTimer\n\n10\nsets\nRotary switch\n\n10\nunits\nPull-push switch\n\n10\nunits\nThermostant\n\n10\nsets\nGood condition\nelectrical controls\n\n10\nsets\nSwitch pull-push/rotary\n\n10\nsets\nDefective capacitators\n\n25\nsets\nFilter\n\n5 sets\nBorax\n\n25\nsets\nFilter drier\n\n25\nsets\nTapelone tape\n\n30\npcs.\nCopper elbow\n\n20\npcs.\nCopper onion\n\n10\npcs.\nCopper elbow 3/8” OD\n\n20\npcs.\nFilter drier connection\n\n--- PDF PAGE 97 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n96\n\n3.5\nTRAINING FACILITIES\n\n ABSORPTION REFRIGERATION SERVICING NC III\n\nBased on a class intake of 25 students/trainees.\n\nSPACE REQUIREMENTS\n\nSpace\n(m)\n\nArea in\nSq. Meters\nTotal Area\nin\nSq. Meters\n\nA. LECTURE AREA*\n4.00 x\n8.00\n32.00\n32.00\nB. LEARNING RESOURCE AREA\n\n4.00 x\n6.00\n\n24.00\n\n24.00\nC. TOOL/STORAGE\n AREA*\n4.00 x\n4.00\n16.00\n16.00\nD. WASH, TOILET AND LOCKER ROOM*\n\n3.00 x\n4.00\n\n12.00\n\n12.00\nTOTAL\n84\nE. FACILITIES/\n EQUIPMENT/\n CIRCULATION\n\n25\n\nTOTAL AREA\n\n109\n *Common facilities for all HVAC/R Courses\n\n--- PDF PAGE 98 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n97\n3.6\nTRAINER’S QUALIFICATION FOR HVAC/R SECTOR\n\nICE PLANT REFRIGERATION SERVICING NC III\n\nTRAINER QUALIFICATION III (TQ III)\n\n• Must have undergone training on Training Methodology III or\nequivalent training/experience\n• He must be a holder of Ice Plant Refrigeration Servicing NC III\nor equivalent training/experience\n• Good moral character\n• Must be physically and mentally fit\n• Must be computer literate\n• Must be a Civil Service eligible (for government position or\nappropriate professional license issued by the Professional\nRegulatory Board)\n• *Must have at least two (2) years job/industry experience\n\n*Optional: Only when required by the hiring institution\n\n Reference: TESDA Board Resolution No. 2004-03\n\n3.12 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to\ndetermine their achievement of units of competency. A certificate\nof achievement is issued for each UNIT TITLE.\n\n--- PDF PAGE 99 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n98"
