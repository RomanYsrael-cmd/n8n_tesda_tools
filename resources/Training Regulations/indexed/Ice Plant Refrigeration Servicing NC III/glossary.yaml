  "source_text": "DEFINITION OF TERMS:\n\n1. Alternate Refrigerant\n-replacement refrigerant that can accomplish the same\ntask as the one being replaced, but may require that\nrefrigeration or air-conditioning equipment be\nredesigned or replaced\n\n2. Brazed Tube\n-tube made from sheet or strip with a longitudinal\nbrazed joint\n\n3. Capillary Tube\n-small bore tube used for metering by controlling length\nand bore size. In refrigeration, a tube of small internal\ndiameter used as a refrigerant pressure and flow control\nbetween high and low sides\n-tube used to transmit pressure from the sensitive bulb\nof some temperature controls to the operating element\n\n4. Compression Ratio\n-the ratio determined by dividing the discharge\npressure, in psia, by the suction pressure, psia\n\n5. Crankcase\n\n-the casing or covering for the crankshaft of the\nreciprocating compressor\n\n6. Evaporator Unit\n\n-assembly of refrigerating compressor, evaporator, and\nnecessary accessories attached to one base\n\n7. Expansion Valve\n\n-a valve designed to meter the flow of liquid refrigerant\nto an evaporator\n\n8. Filter\n\n-a very fine strainer for removing foreign matter and dirt\nfrom the refrigerant\n\n9. Gas Tungsten-Arc Welding\n(GTAW)\n\n-arc-welding process wherein coalescence is produced\nby heating with an arc between a single tungsten (non\nconsumable) electrode and the work.\nNote: Shielding is obtained from a gas or gas mixture.\nPressure may or may not be added\n\n10. Insulation\n\n-any material intended to reduce the flow of heat\n\n11. Liquid Receiver\n\n-vessel, permanently connected to a refrigerating\nsystem by inlet and outlet pipes, for storage of liquid\nrefrigerant\n\n12. Nitrogen Purge\n-procedure in which nitrogen gas is bled into piping as it\nis welded, brazed, or soldered; or after, to displace\ngases within the piping. The nitrogen displaces the air\nfrom inside the pipe, minimizing oxidation and resultant\nscale formation\n\n--- PDF PAGE 101 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n100\n13. Ohm’s law\n\n-direct current flowing in an electric circuit is directly\nproportional to the voltage applied to the circuit; it is\nvalid for metallic circuits and many circuits containing\nan electrolytic resistance\n\n14. Oil separator\n\n-a device for separating out oil and returning it to\nthe compressor crankcase entrained in the discharge\ngas from a compressor\n\n15. Pressure Gage\n\n-instrument for measuring pressure above or below\natmospheric pressure\n\n16. Propylene Glycol\n\n-clear, colorless liquid used to depress the freezing\npoint of water for use as a secondary coolant in\nHVAC&R systems\n\n17. Pull-Down Test\n\n-first operational check on a refrigerating installation to\nmeasure the time taken to pull the temperature down to\nthe desired conditions, while also measuring the\ntemperatures, pressures, and associated data\n\n18. Pump Down\n\n-of refrigerant, withdrawal of all refrigerant from the low\nside of a system by pumping it to either the condenser\nor the liquid receiver\n\n19. Qualification Test\n\n-procedure used to verify the accuracy of the\nmeasurement techniques (temperature, airflow rates,\nduct heat calibration) employed in determination of\nheating or cooling effect\n\n20. Rating\n\n-assigned value of those performance characteristics\n(under standard rating conditions) by which a unit may\nbe selected to fit its application\nNote: These values apply to all units of like (nominal)\nsize and type (identification) produced by the same\nmanufacturer\n\n21. Refrigerating Capacity\n(gross)\n\n-total rate of heat removal from all sources by the\nevaporator of a refrigerating system at stated\nconditions. It is numerically equal to the system\nrefrigerating effect\n\n22. Refrigerating System\nContaminants\n\n-contaminants include water (most important and\nuniversal contaminant); dirt; particles; organic materials\nsuch as waxes, acids, and sludges; or other products of\nchemical reactions taking place while the system is\noperating\n\n23. Refrigeration Cycle\n\n-The complete operation involved in providing\nrefrigeration\n\n--- PDF PAGE 102 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n101\n\n24. Repair\n\n-to restore to good or sound condition, within the\nfollowing constraints: operation must be fully restored\nwithout embellishment; and failure must have occurred\n\n25. Retrofit\n\n-modification of existing equipment, systems, or\nbuildings to incorporate improved performance, updated\noperation, or both. Derived from retroactive refit\n\n26. Risers\n\n-a vertical tube or pipe that carries refrigerant in any\nform from a lower to a higher level\n\n27. Shielded Metal-Arc\nWelding (SMAW)\n\n- arc-welding process wherein coalescence\nis produced by heating with an electric arc between a\ncovered metal electrode and the work\nNote: Shielding is obtained from decomposition of the\nelectrode covering. Pressure is not used and filler metal\nis obtained from the electrode\n\n28. Sludge\n-product of decomposition of oil resulting from\nimpurities,\nmoisture, or chemical reactions and favored by\nexcessive temperature. Sludge may be mushy, gummy,\nor hard\n\n29. Suction Lift\n\n-combination of static suction lift and friction head in\nsuction piping when the source of liquid is below the\npump centerline\n\n30. Superheat\n\n-The temperature increase above saturation\ntemperature or above boiling point\n\n31. Symbol\n\n-letter, figure, other character or mark, or combination of\nletters used to represent a specific thing\n\n32. Time Defrosting\n\n-defrosting process automatically and intermittently\noperated for a predetermined period\n\n33. Ton (of refrigeration)\n\n-time rate of cooling equal to 12,000 Btu/h\n(approximately 3517 W)\n\n--- PDF PAGE 103 ---\nTRAINING REGULATION - ICE PLANT REFRIGERATION SERVICING NC III\n\n102"
}
