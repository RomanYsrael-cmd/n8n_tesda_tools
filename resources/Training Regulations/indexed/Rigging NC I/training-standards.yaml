  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for RIGGING NC I.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - RIGGING\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n1. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\nDirect observation\nQuestions or interview\nPortfolio (credentials)\nWritten / Oral Test\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n3. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation of\napplication of tasks\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC I\n\n RIGGING\n\nNominal Training Hours:\n80 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\na rigger in accordance with industry standards. It covers core competencies such\nas inspect rigging gears, install rigging gears and assist crane operator.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Inspect Rigging\nGears\n\n1.1 Explain the\nimportance and\n procedure in\n inspecting rigging\n gears\n1.2 Understand the\n workload limit of the\n slings, blocks or\n fittings\n1.3 Explain the proper\n handling and\n storage of rigging\n gears\n1.4 Inspect snatch\nblocks\n1.5 Inspect fittings\n1.6 Inspect slings\nLecture\nDemonstration\n\nObservation and\noral questioning\nDemonstration\nand oral\nquestioning\nWritten test\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Install Rigging\nGears\n\n2.1 Explain the\n fundamental science\n and mathematics of\n evaluating load.\n2.2 Evaluate the load of\n rigging gears.\n2.3 Select and connect\n slings and hitches\n2.4 Explain the principle\n and concept in\n determining load\n limits and load\n control stability of\n rigging gear.\n2.5 Determine and\n observe load limits\n of rigging gears.\n2.7 Determine and\n achieve load control\n stability\n2.8 Demonstrate correct\n procedures in\n installing rigging\n gears base on\n reference manual.\nLecture\nDemonstration\n\nObservation and\noral questioning\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Assist Crane\nOperator\n\n3.1 Explain the concept\n and principles of\n communication\n signal\n3.2 Establish\n communication\n signal\n3.3 Explain the\n importance of\n environmental\n condition, hazards\n and work\n obstructions.\n3.4 Guide crane\n operator in handling\n the load\nLecture\nDemonstration\n\nObservation and\noral questioning\nDemonstration\nand oral\nquestioning\nWritten test\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT OPERATION\n\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• Can communicate both oral and written\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computation.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for rigging\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n\n• Open end\nspanners (mm)\n1 unit\n• Crane\n1 set\n• Reference\n1 set\n•\nBack Wrench (mm)\n\n1 set\n•\nBooks\n1 set\n• Ring spanners (11\npcs) mm\n\n1 set\n• Manuals\n1 set\n•\nSocket Accessories\n\n1 set\n•\nCatalogs\n1 set\n• Ratchet, reversible,\nmale extension,\nmale & female,\nadjustable offset\nhandle\n\n1 set\n• Brochure\n1 set\n•\nAdjustable wrench\n\n1 set\n•\nModules/LEs\n1 set\n\n• Combination pliers\n\n1 set\n• CD/Video\n tapes\n1 set\n• Screwdrivers\nstandard tip-round\nblade\n\n2 sets\n• Bolts\n1 set\n\n• Screwdriver,\nPhilips type-round\nblade\n\n2 sets\n• Nuts\n\n2 sets\n• Retaining\npine\n\n2 sets\n•\nSheaves\n\n2 sets\n•\nHooks\n\n2 sets\n•\nSide plates\n\n2 sets\n•\nShackles\n\n--- PDF PAGE 55 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2 sets\n• Locks\n\n2 sets\n• Wire rope\nclips\n\n2 sets\n•\nTypes of links\n\n2 sets\n• Types of\nthimbles\n\n2 sets\n•\nSleeves\n\n2 sets\n•\nSockets\n\n2 sets\n•\nFiller rod\n\nNOTE: Implementation of the training program can be made possible through a MOA between\nthe training school and industry. It is so because of the high cost of equipment that the school\ncan’t afford to attained.\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.5\nTRAINING FACILITIES\n\nThe rigging workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION\n\n 3.6 TRAINERS’ QUALIFICATION\n\nHEAVY EQUIPMENT OPERATION (LIFTING)\n\nTRAINER QUALIFICATION (TQ II)\n\n•\nMust be a holder of NC II\n•\nMust have undergone training on Training Methodology II (TM II)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION"
