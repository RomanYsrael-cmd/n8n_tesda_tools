    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - RIGGING\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n1. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\nDirect observation\nQuestions or interview\nPortfolio (credentials)\nWritten / Oral Test\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n3. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation of\napplication of tasks\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC I\n\n RIGGING\n\nNominal Training Hours:\n80 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\na rigger in accordance with industry standards. It covers core competencies such\nas inspect rigging gears, install rigging gears and assist crane operator.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Inspect Rigging\nGears\n\n1.1 Explain the\nimportance and\n procedure in\n inspecting rigging\n gears\n1.2 Understand the\n workload limit of the\n slings, blocks or\n fittings\n1.3 Explain the proper\n handling and\n storage of rigging\n gears\n1.4 Inspect snatch\nblocks\n1.5 Inspect fittings\n1.6 Inspect slings\nLecture\nDemonstration\n\nObservation and\noral questioning\nDemonstration\nand oral\nquestioning\nWritten test\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Install Rigging\nGears\n\n2.1 Explain the\n fundamental science\n and mathematics of\n evaluating load.\n2.2 Evaluate the load of\n rigging gears.\n2.3 Select and connect\n slings and hitches\n2.4 Explain the principle\n and concept in\n determining load\n limits and load\n control stability of\n rigging gear.\n2.5 Determine and\n observe load limits\n of rigging gears.\n2.7 Determine and\n achieve load control\n stability\n2.8 Demonstrate correct\n procedures in\n installing rigging\n gears base on\n reference manual.\nLecture\nDemonstration\n\nObservation and\noral questioning\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Assist Crane\nOperator\n\n3.1 Explain the concept\n and principles of\n communication\n signal\n3.2 Establish\n communication\n signal\n3.3 Explain the\n importance of\n environmental\n condition, hazards\n and work\n obstructions.\n3.4 Guide crane\n operator in handling\n the load\nLecture\nDemonstration\n\nObservation and\noral questioning\nDemonstration\nand oral\nquestioning\nWritten test\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION"
  },
