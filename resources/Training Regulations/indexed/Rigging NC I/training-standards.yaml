ecifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• Can communicate both oral and written\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computation.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for rigging\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n\n• Open end\nspanners (mm)\n1 unit\n• Crane\n1 set\n• Reference\n1 set\n•\nBack Wrench (mm)\n\n1 set\n•\nBooks\n1 set\n• Ring spanners (11\npcs) mm\n\n1 set\n• Manuals\n1 set\n•\nSocket Accessories\n\n1 set\n•\nCatalogs\n1 set\n• Ratchet, reversible,\nmale extension,\nmale & female,\nadjustable offset\nhandle\n\n1 set\n• Brochure\n1 set\n•\nAdjustable wrench\n\n1 set\n•\nModules/LEs\n1 set\n\n• Combination pliers\n\n1 set\n• CD/Video\n tapes\n1 set\n• Screwdrivers\nstandard tip-round\nblade\n\n2 sets\n• Bolts\n1 set\n\n• Screwdriver,\nPhilips type-round\nblade\n\n2 sets\n• Nuts\n\n2 sets\n• Retaining\npine\n\n2 sets\n•\nSheaves\n\n2 sets\n•\nHooks\n\n2 sets\n•\nSide plates\n\n2 sets\n•\nShackles\n\n--- PDF PAGE 55 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2 sets\n• Locks\n\n2 sets\n• Wire rope\nclips\n\n2 sets\n•\nTypes of links\n\n2 sets\n• Types of\nthimbles\n\n2 sets\n•\nSleeves\n\n2 sets\n•\nSockets\n\n2 sets\n•\nFiller rod\n\nNOTE: Implementation of the training program can be made possible through a MOA between\nthe training school and industry. It is so because of the high cost of equipment that the school\ncan’t afford to attained.\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.5\nTRAINING FACILITIES\n\nThe rigging workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.25 hectare (MOA/Rental)\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION\n\n 3.6 TRAINERS’ QUALIFICATION\n\nHEAVY EQUIPMENT OPERATION (LIFTING)\n\nTRAINER QUALIFICATION (TQ II)\n\n•\nMust be a holder of NC II\n•\nMust have undergone training on Training Methodology II (TM II)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION"
