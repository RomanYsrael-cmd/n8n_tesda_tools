  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of RIGGING NC I, the candidate must\ndemonstrate competence through project-type assessment covering all the\nunits listed in Section 1. The successful candidate shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2\nThe qualification of Rigging NC I can be attained through demonstration of\ncompetence through project-type assessment covering all the units of\nqualification.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\"\n\n--- PDF PAGE 59 ---\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION - SUB- SECTOR\nBASIC\nInspect\nrigging\ngears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall\nrigging\ngears\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nAssist\ncrane\noperator\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\ntools\nObserve procedures,\nspecifications and\nmanual of instructions\nMaintain tools and\nequipment\nPerform\nmensuration and\ncalculations\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Deformation\nRefers to a change in the original shape of the fitting.\n2. Fittings\nRefer to the tools or devices used as attachment for wire rope,\nchain or web sling.\n3. Grooves\nRefers to a depression in the periphery of a sheave for supporting\na rope.\n4. Hitches\nRefers to a method of lifting with a sling (i.e. vertical, basket,\nchoker) for better load control.\n5. Kink\nRefers to a sharp bend in a wire rope that permanently distorts the\nwire and strands but not dogleg.\n6. Rigger\nRefers to a qualified person who is responsible for connecting the\nload, and inspecting the rigging gears and assisting the crane\noperator.\n7. Rigging Chart\nRefers to the rigger’s lifting guide provided by the manufacturer.\n8. Rigging Gears\nRefer to the use of the general rigging hardware such as spreader\nbar, slings, shackles, splicing kit, tagline, etc.\n9. Sheave\nRefers to a grove pulley with a rim.\n10. Sleeves\nRefer to a kind of swage or ferule in press fitting used to form a\nloop/ eye at the end of a wire rope.\n11. Tagline\nRefers to a rope attached to prevent additional movement of a\nload.\n12.User’s Manual\nRefers to the manufacturer’s general catalogue.\n13. Wear\nRefers to a reduction in the circumference of a fitting due to\nfriction.\n14. Work Load Limit\nRefers to the maximum mass or force which the product is\nauthorized to support in a particular service.\n15. Wire Rope\nRefers to a material composed of hi-carbon steel wires and\nstrands laid helically around a core.\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies and who contributed their\ntime and expertise to the development and validation of this Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quia