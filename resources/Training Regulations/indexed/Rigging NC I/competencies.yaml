        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\n\nAssessment must confirm evidence that the candidate\n1.1 Demonstrated understanding on the workload limit of the\nslings, blocks or fittings.\n1.2 Demonstrated understanding on the condition of rigging\ngears.\n1.3 Demonstrated understanding of user’s manual, among others.\n1.4 Demonstrated proper handling and storage of rigging gears.\n2. Underpinning\n(related)\nKnowledge and\nattitudes\n\nThe essential knowledge and attitude of a Rigger needs to\nperform work to the required standard include:\n2.1 Controlled risk procedures\n2.2 Various load factors\n2.3 Limitations of slings, blocks and fittings\n2.4 Rigging manuals and reference book\n2.5 Identification and usage of specific rigging gears\n3. Underpinning\nSkills\n\nThe essential skills a Rigger needs to perform work to the\nstandard include:\n3.1 Communication skills\n 3.1.1 Reports\n 3.1.2 Checklist\n3.2 Detecting modifications\n3.3 Determining correct use of rigging gears\n3.4 Following proper risk procedures\n4. Resource\nImplications\n\nThe following resources must be provided:\n4.1 Standard rigging gears\n4.2 Job site\n5. Method of\nAssessment\n\n5.1 Oral/Written questioning\n5.2 Observation of practical demonstration\n5.3 Work records and documents\n6. Context of\nAssessment\n6.1 Assessment maybe conducted in on-the-job or in a simulated\nvenue and in accordance with work safe procedures.\n\n--- PDF PAGE 37 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY\nINSTALL RIGGING GEARS\nUNIT CODE"
        },
        "source_text": "CON721301\nUNIT DESCRIPTOR\nThis unit describes the outcomes required in\ninspecting rigging gears to reduce risk on the job\nsite. It covers the skills required to inspect snatch\nblocks, fittings and slings following job and / or\nmanufacturer's requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Inspect snatch blocks\n1.1 Condition of sheave groove is inspected\naccording to the tolerance as indicated in the\nwire rope user’s manual\n1.2 Wear and deformation of side plates is\ninspected according to rigging chart for blocks\n1.3 Condition of sheave hub is checked in\naccordance with manufacturer’s catalogue\n1.4 Fasteners are properly secured in\naccordance with the user’s manual\n1.5 Clearance and swivel case are checked in\naccordance with the manufacturer’s standards\n1.6 Typical block components are checked for\ndamages, clearance, proper installation as per\nblocks handbook\n2.\nInspect fittings\n2.1 Fittings are inspected for excessive wear\naccording to the limits as indicated in the\nmanufacturer’s manual.\n2.2 Check for visual damages is undertaken on\nthe fittings according to the rigging chart\n2.3 Check for modification is undertaken\naccording to the manufacturer’s catalogue\n2.4 Check for proper installation is carried out\naccording to information manual.\n\n--- PDF PAGE 33 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.\nInspect sling\n3.1 Visual check for damages is carried out based\non manufacturer’s inspection criteria.\n3.2 Sling capacity to lift the load is checked\naccording to workload limit.\n3.3 Sling for permanently affixed identification is\nchecked in accordance with industry standards.\n\n--- PDF PAGE 34 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Fasteners\n1.1 Nuts\n1.2 Bolts\n1.3 Retaining pins\n2. Typical block\ncomponent\n2.1 Sheaves\n2.2 Bolts\n2.3 Hooks\n2.4 Side plates\n2.5 Shackles\n2.6 Locks\n3. Fittings\n3.1 Shackles\n3.2 Wire rope clips\n3.3 All types of hooks\n3.4 Turnbuckles\n3.5 All types of links\n3.6 All types of thimbles\n3.7 Swivels\n3.8 Eye bolts\n3.9 Sheaves\n3.9 Sleeves\n3.10 Sockets\n4. Excessive wear\n4.1 >5% (critical areas)\n4.2 >10% (non-critical areas)\n5. Visual damages\n5.1 Nicks\n5.2 Cracks\n5.3 Gouges\n5.4 Deformations\n6. Modification\n6.1 Welding\n6.2 Substitution of other components\n6.3 Heating\n6.4 Bending\n\n--- PDF PAGE 35 ---\nTR HEAVY EQUIPMENT OPERATION\n\n7. Installation\n7.1 Latches\n7.2 Bearing\n7.3 Locking devices\n7.4 Wire rope clips\n7.5 Wedge socket\n8. Inspection\n criteria\n8.1 Wire rope sling\n 8.1.1 Kingking\n 8.1.2 Crushing\n 8.1.3 Unstranding\n 8.1.4 Broken or cut strands\n 8.1.5 Stranding displacement\n 8.1.6 Core protrusion\n 8.1.7 Corrosion\n 8.1.8 Bird caging\n 8.1.9 Broken wire\n8.2 Chain sling\n 8.2.1 Wear\n 8.2.2 Nick, cracks, breaks\n 8.2.3 Gouges, stretch, bends\n 8.2.4 Weld splatter\n 8.2.5 Excessive temperature\n 8.2.6 Throat opening of hook\n 8.2.7 Corrosion\n8.3 Synthetic sling\n 8.3.1 Acid or caustic burns\n 8.3.2 Melting or charring\n 8.3.3 Holes or cuts\n 8.3.4 Tears and snugs\n 8.3.5 Broken stitches\n 8.3.6 Worn stitches\n 8.3.7 Excessive abrasion\n 8.3.8 Knot\n9. affixed\nidentification\n\n9.1 Size\n9.2 Grade\n9.3 Rated capacity\n9.4 Manufacturer\n\n--- PDF PAGE 36 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment must confirm evidence that the candidate\n1.1 Demonstrated understanding on the workload limit of the\nslings, blocks or fittings.\n1.2 Demonstrated understanding on the condition of rigging\ngears.\n1.3 Demonstrated understanding of user’s manual, among others.\n1.4 Demonstrated proper handling and storage of rigging gears.\n2. Underpinning\n(related)\nKnowledge and\nattitudes\n\nThe essential knowledge and attitude of a Rigger needs to\nperform work to the required standard include:\n2.1 Controlled risk procedures\n2.2 Various load factors\n2.3 Limitations of slings, blocks and fittings\n2.4 Rigging manuals and reference book\n2.5 Identification and usage of specific rigging gears\n3. Underpinning\nSkills\n\nThe essential skills a Rigger needs to perform work to the\nstandard include:\n3.1 Communication skills\n 3.1.1 Reports\n 3.1.2 Checklist\n3.2 Detecting modifications\n3.3 Determining correct use of rigging gears\n3.4 Following proper risk procedures\n4. Resource\nImplications\n\nThe following resources must be provided:\n4.1 Standard rigging gears\n4.2 Job site\n5. Method of\nAssessment\n\n5.1 Oral/Written questioning\n5.2 Observation of practical demonstration\n5.3 Work records and documents\n6. Context of\nAssessment\n6.1 Assessment maybe conducted in on-the-job or in a simulated\nvenue and in accordance with work safe procedures.\n\n--- PDF PAGE 37 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY\nINSTALL RIGGING GEARS\nUNIT CODE"
      }
