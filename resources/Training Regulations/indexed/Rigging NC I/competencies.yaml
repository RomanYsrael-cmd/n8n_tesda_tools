        "source_title": "ASSIST CRANE OPERATOR",
        "source_text": "--- PDF PAGE 43 ---\nTR HEAVY EQUIPMENT OPERATION  \n \nUNIT OF COMPETENCY\nASSIST CRANE OPERATOR\nUNIT CODE\nCON721303\nUNIT DESCRIPTOR \nThis unit describes the outcomes required in \ncommunicating with crane operator during lifting and \ntransferring of heavy loads. It includes skills required \nto establish communication signals with and guide \ncrane operator when lifting and transferring of heavy \nloads.\n \nELEMENT \nPERFORMANCE CRITERIA \n \nBold and italicized terms are elaborated in the  \nRange of Variables \n1. Establish communication \nsignal \n1.1 Appropriate communication signal is \ndetermined and used according to work site \ncondition. \n1.2 Identified communication signal is relayed with \nthe Crane Operator according to work condition.\n1.3  Appropriate  communication signal is  \n      executed according to lifting plan. \n1.4 Clear communication signal is established by \nusing radio or hand signals. \n2. Guide crane operator in \nhandling the load \n2.1 Unusual loading or environmental condition is \nanticipated and communicated with the Crane \nOperator according to communication signal \nselected. \n2.2 Distances, heights and clearances in the work \narea are observed, assessed and \ncommunicated with the Crane Operator \naccording to communication signal selected. \n2.3 Environmental hazards are relayed to Crane \nOperator according to communication signal \nselected.  \n2.4 Tagline is provided to achieve loads stability. \n2.5 Total lift of load is observed and communicated   \nbased on communication signal selected.   \n2.6 Traveling path of load is directed based on the \nassessed environmental hazards. \n2.7 Risk management procedures are \ncommunicated based on communication signal \nselected.\n\n--- PDF PAGE 44 ---\nTR HEAVY EQUIPMENT OPERATION  \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Communication \nsignal \n \n1.1 Hand-held radio   \n1.2 Hand signals (international standard) \n \n2. Environmental \nhazards \n \n \n2.1 People \n2.2 Obstructions \n             2.2.1 Material (concrete) \n             2.2.2 Structural\n\n--- PDF PAGE 45 ---\nTR HEAVY EQUIPMENT OPERATION  \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency  \n \n \n \nAssessment must confirm evidence that the candidate \n1.1 Demonstrated ability in the use of reference material and \nhand-held radio. \n1.2 Demonstrated understanding of risk-control procedures \n1.3 Demonstrated ability to communicate and work with Crane \noperator in satisfactory execution of lifting plan \n2. Underpinning \n(related) \nknowledge and \nattitude \n2.1 Different hand signals (international standard) \n2.2  Use of hand-held radio \n2.3  Basic rigging principles \n2.4  Risk management \n3. Underpinning \nskills \n \n \n \n3.1 Ability in speaking clearly \n3.2  Ability in using hand-held radio \n3.3  Ability in using various hand signals \n3.4  Interpreting reference material \n3.5  Executing lifting plan \n4. Resource \nimplications \n \nThe following resources must be provided: \n4.1  Hand-held radio \n4.2  Crane  \n5. Method of \nassessment \n \n \nCompetency in this unit must be assessed through: \n5.1  Oral/written questioning  \n5.2  Demonstration \n5.3  Work record and documentation \n6. Context of \nassessment \n \n6.1  Competency in this unit maybe assessed in a simulated  \n       venue\n",
