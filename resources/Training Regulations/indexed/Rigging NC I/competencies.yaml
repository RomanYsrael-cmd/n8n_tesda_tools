COMPETENCIES\n\nUNIT OF COMPETENCY\nINSPECT RIGGING GEARS\nUNIT CODE\nCON721301\nUNIT DESCRIPTOR\nThis unit describes the outcomes required in\ninspecting rigging gears to reduce risk on the job\nsite. It covers the skills required to inspect snatch\nblocks, fittings and slings following job and / or\nmanufacturer's requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Inspect snatch blocks\n1.1 Condition of sheave groove is inspected\naccording to the tolerance as indicated in the\nwire rope user’s manual\n1.2 Wear and deformation of side plates is\ninspected according to rigging chart for blocks\n1.3 Condition of sheave hub is checked in\naccordance with manufacturer’s catalogue\n1.4 Fasteners are properly secured in\naccordance with the user’s manual\n1.5 Clearance and swivel case are checked in\naccordance with the manufacturer’s standards\n1.6 Typical block components are checked for\ndamages, clearance, proper installation as per\nblocks handbook\n2.\nInspect fittings\n2.1 Fittings are inspected for excessive wear\naccording to the limits as indicated in the\nmanufacturer’s manual.\n2.2 Check for visual damages is undertaken on\nthe fittings according to the rigging chart\n2.3 Check for modification is undertaken\naccording to the manufacturer’s catalogue\n2.4 Check for proper installation is carried out\naccording to information manual.\n\n--- PDF PAGE 33 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.\nInspect sling\n3.1 Visual check for damages is carried out based\non manufacturer’s inspection criteria.\n3.2 Sling capacity to lift the load is checked\naccording to workload limit.\n3.3 Sling for permanently affixed identification is\nchecked in accordance with industry standards.\n\n--- PDF PAGE 34 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Fasteners\n1.1 Nuts\n1.2 Bolts\n1.3 Retaining pins\n2. Typical block\ncomponent\n2.1 Sheaves\n2.2 Bolts\n2.3 Hooks\n2.4 Side plates\n2.5 Shackles\n2.6 Locks\n3. Fittings\n3.1 Shackles\n3.2 Wire rope clips\n3.3 All types of hooks\n3.4 Turnbuckles\n3.5 All types of links\n3.6 All types of thimbles\n3.7 Swivels\n3.8 Eye bolts\n3.9 Sheaves\n3.9 Sleeves\n3.10 Sockets\n4. Excessive wear\n4.1 >5% (critical areas)\n4.2 >10% (non-critical areas)\n5. Visual damages\n5.1 Nicks\n5.2 Cracks\n5.3 Gouges\n5.4 Deformations\n6. Modification\n6.1 Welding\n6.2 Substitution of other components\n6.3 Heating\n6.4 Bending\n\n--- PDF PAGE 35 ---\nTR HEAVY EQUIPMENT OPERATION\n\n7. Installation\n7.1 Latches\n7.2 Bearing\n7.3 Locking devices\n7.4 Wire rope clips\n7.5 Wedge socket\n8. Inspection\n criteria\n8.1 Wire rope sling\n 8.1.1 Kingking\n 8.1.2 Crushing\n 8.1.3 Unstranding\n 8.1.4 Broken or cut strands\n 8.1.5 Stranding displacement\n 8.1.6 Core protrusion\n 8.1.7 Corrosion\n 8.1.8 Bird caging\n 8.1.9 Broken wire\n8.2 Chain sling\n 8.2.1 Wear\n 8.2.2 Nick, cracks, breaks\n 8.2.3 Gouges, stretch, bends\n 8.2.4 Weld splatter\n 8.2.5 Excessive temperature\n 8.2.6 Throat opening of hook\n 8.2.7 Corrosion\n8.3 Synthetic sling\n 8.3.1 Acid or caustic burns\n 8.3.2 Melting or charring\n 8.3.3 Holes or cuts\n 8.3.4 Tears and snugs\n 8.3.5 Broken stitches\n 8.3.6 Worn stitches\n 8.3.7 Excessive abrasion\n 8.3.8 Knot\n9. affixed\nidentification\n\n9.1 Size\n9.2 Grade\n9.3 Rated capacity\n9.4 Manufacturer\n\n--- PDF PAGE 36 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment must confirm evidence that the candidate\n1.1 Demonstrated understanding on the workload limit of the\nslings, blocks or fittings.\n1.2 Demonstrated understanding on the condition of rigging\ngears.\n1.3 Demonstrated understanding of user’s manual, among others.\n1.4 Demonstrated proper handling and storage of rigging gears.\n2. Underpinning\n(related)\nKnowledge and\nattitudes\n\nThe essential knowledge and attitude of a Rigger needs to\nperform work to the required standard include:\n2.1 Controlled risk procedures\n2.2 Various load factors\n2.3 Limitations of slings, blocks and fittings\n2.4 Rigging manuals and reference book\n2.5 Identification and usage of specific rigging gears\n3. Underpinning\nSkills\n\nThe essential skills a Rigger needs to perform work to the\nstandard include:\n3.1 Communication skills\n 3.1.1 Reports\n 3.1.2 Checklist\n3.2 Detecting modifications\n3.3 Determining correct use of rigging gears\n3.4 Following proper risk procedures\n4. Resource\nImplications\n\nThe following resources must be provided:\n4.1 Standard rigging gears\n4.2 Job site\n5. Method of\nAssessment\n\n5.1 Oral/Written questioning\n5.2 Observation of practical demonstration\n5.3 Work records and documents\n6. Context of\nAssessment\n6.1 Assessment maybe conducted in on-the-job or in a simulated\nvenue and in accordance with work safe procedures.\n\n--- PDF PAGE 37 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY\nINSTALL RIGGING GEARS\nUNIT CODE\nCON721302\nUNIT DESCRIPTOR\nThis unit describes the outcomes required in the\nproper selection and use of rigging gears. It covers\nskills required to evaluate load, connect slings and\nhitches, determine limitations of rigging gears and\nload control stability.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Evaluate the load\n1.1 Center of gravity is determined according to odd\nor simple load shape or by means of trial lifting.\n1.2 Load weight is determined according to\ndocuments, dynamometer (load scale), or size,\nshape and type of material.\n1.3 Density and volume of load is determined in\naccordance with material handbook.\n1.4 Lifting (pick) point or connecting point is\ndetermined according to reference manual.\n2. Select and connect slings\nand hitches\n2.1 Appropriate hitches or combination of\nhitches is identified in accordance with the\nreference material and environmental\nconditions in the jobsite.\n2.2 Horizontal sling angle is determined in\naccordance with the reference material.\n2.3 Number and appropriate type of slings are\ndetermined and identified according to job\nrequirements.\n2.4 Proper procedures for attaching slings and\nhitches are carried out in accordance with the\nrigging handbook and training manual.\n3. Determine and observe load\nlimits of rigging gears\n3.1 Appropriate rigging gears are determined\naccording to job requirements.\n3.2 Work load limit is determined according to the\nreference materials.\n3.3 Work load limit is embossed or tagged readable\non the rigging gears according to manufacturer’s\nspecifications.\n\n--- PDF PAGE 38 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Determine and achieve load\ncontrol stability\n4.1 Center of gravity (CG) of the load is located\naccording to the recommendations of company\nauthorized personnel.\n4.2 Special techniques or combinations of basic\nhitches are applied to provide good load control\nin accordance with the training manual.\n4.3 The CG of the load is rigged directly under the\nhook, as per job specifications.\n\n--- PDF PAGE 39 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Shape\n\n1.1 Cylinder\n1.2 Concrete slab\n1.3 Structural steel\n1.4 Steel flats\n1.5 Cone\n1.6 Sphere\n2. Document\n\n2.1 Bill of ladings\n2.2 Drawings and catalogues\n2.3 Labels\n2.4 Tags\n2.5 Nameplate\n3. Hitches\n\n3.1 Vertical\n3.2 Choker\n3.3 Basket\n4. Combination of\nhitches\n4.1 Double wrap basket hitch\n4.2 Double wrap choker hitch\n5. Reference\nmaterials\n5.1 Rigging chart\n5.2 Rigging handbook\n5.3 Training manual\n5.4 Manufacturer’s catalogue\n6. Environmental\nconditions\n6.1 Windy\n6.2 Wet\n6.3 Rainy\n6.4 Extreme heat\n6.5 Other obstructions e.g., fogginess, material obstructions\n7. Horizontal sling\nangles\n\n7.1 90 degrees\n7.2 60 degrees (ideal)\n7.3 50 degrees\n7.4 45 degrees\n7.5 30 degrees (maximum allowable angle)\n\n--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT OPERATION\n\n8. Number of slings\n8.1 Single leg\n8.2 Double leg\n8.3 Triple leg\n8.4 Quadruple leg\n9. Type of slings\n\n9.1 Synthetic\n9.2 Wire rope\n9.3 Chain (grade 80 or 100)\n10. Rigging gears\n\n10.1 Hoist hook\n 10.1.1 eye hook\n 10.1.2 shank hook\n 10.1.3 swivel hook\n10.2 Sliding choker hook\n10.3 Sure lock hook\n 10.2.1 eye hook\n 10.2.2 swivel hook\n 10.2.3 clevis hook\n 10.2.4 shank hook\n10.4 Eye sling hook\n10.5 Clevis sling hook\n10.6 Grab hook (eye or clevis)\n10.7 Weld-on hook\n10.8 Sorting hook\n10.9 Barrel hook\n10.10 Latch\n 10.10.1 Shank hook\n 10.10.2 Swivel hook\n 10.10.3 Clevis sling hook\n 10.10.4 Eye sling hook\n 10.10.5 Eye hook\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT OPERATION\n\n10. Rigging gears\n (cont.)\n\n10.11 Shackles\n 10.11.1 Screw pin anchor shackle\n 10.11.2 Screw pin chain shackle\n 10.11.3 Bolt type anchor shackle\n 10.11.4 Bolt type chain shackle\n10.12 Links and rings\n10.13 Turnbuckle\n 10.13.1 Hook & hook\n 10.13.2 Hook & eye\n 10.13.3 Eye & eye\n 10.13.4 Jaw & eye\n 10.13.5 Jaw & jaw\n10.14 Eye bolt\n10.15 Slings\n\n--- PDF PAGE 42 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment must confirm evidence that the candidate\n1.1 Demonstrated ability to use and interpret material reference\nbook\n1.2 Demonstrated correct procedures in installing rigging gears\n1.3 Complied with enterprise standard operating procedure.\n1.4 Demonstrated understanding on acceptable tolerance of\neach rigging gear\n1.5 Complied with risk management procedures and practices\n\n2. Underpinning\n(related)\nknowledge and\nattitudes\n\n2.1 Identification and use of different rigging gears\n2.2 Proper procedure for installing rigging gears\n2.3 Importance of load control\n2.4 Importance of horizontal sling angles\n2.5 Basic Mathematics\n2.6 Wear and tear tolerance of the various rigging gears\n2.7 Understand lifting plan\n3. Underpinning\nskills\n\n3.1 Ability in selecting appropriate hardware\n3.2 Interpreting correctly the rigging chart\n3.3 Following enterprise standard operating procedure\n3.4 Properly attaching rigging gears\n3.5 Ability in using various combinations of rigging gears\n3.6 Basic calculations\n3.7 Ability in accomplishing rigging checklist\n3.8 Following lifting plan\n4. Resource\nimplications\n\nThe following resources must be provided:\n4.1 Rigging gears reference book\n4.2 Job site\n4.3 Rigging gears\n4.4 Measuring tools\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through:\n5.1 Written/oral questioning\n5.2 Demonstration\n5.3 Work record and documents\n6. Context of\nassessment\n6.1 Competency in this unit maybe assessed on a simulated\n workplace environment\n\n--- PDF PAGE 43 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY\nASSIST CRANE OPERATOR\nUNIT CODE\nCON721303\nUNIT DESCRIPTOR\nThis unit describes the outcomes required in\ncommunicating with crane operator during lifting and\ntransferring of heavy loads. It includes skills required\nto establish communication signals with and guide\ncrane operator when lifting and transferring of heavy\nloads.\n\nELEMENT\nPERFORMANCE CRITERIA\n\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Establish communication\nsignal\n1.1 Appropriate communication signal is\ndetermined and used according to work site\ncondition.\n1.2 Identified communication signal is relayed with\nthe Crane Operator according to work condition.\n1.3 Appropriate communication signal is\n executed according to lifting plan.\n1.4 Clear communication signal is established by\nusing radio or hand signals.\n2. Guide crane operator in\nhandling the load\n2.1 Unusual loading or environmental condition is\nanticipated and communicated with the Crane\nOperator according to communication signal\nselected.\n2.2 Distances, heights and clearances in the work\narea are observed, assessed and\ncommunicated with the Crane Operator\naccording to communication signal selected.\n2.3 Environmental hazards are relayed to Crane\nOperator according to communication signal\nselected.\n2.4 Tagline is provided to achieve loads stability.\n2.5 Total lift of load is observed and communicated\nbased on communication signal selected.\n2.6 Traveling path of load is directed based on the\nassessed environmental hazards.\n2.7 Risk management procedures are\ncommunicated based on communication signal\nselected.\n\n--- PDF PAGE 44 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Communication\nsignal\n\n1.1 Hand-held radio\n1.2 Hand signals (international standard)\n\n2. Environmental\nhazards\n\n2.1 People\n2.2 Obstructions\n 2.2.1 Material (concrete)\n 2.2.2 Structural\n\n--- PDF PAGE 45 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment must confirm evidence that the candidate\n1.1 Demonstrated ability in the use of reference material and\nhand-held radio.\n1.2 Demonstrated understanding of risk-control procedures\n1.3 Demonstrated ability to communicate and work with Crane\noperator in satisfactory execution of lifting plan\n2. Underpinning\n(related)\nknowledge and\nattitude\n2.1 Different hand signals (international standard)\n2.2 Use of hand-held radio\n2.3 Basic rigging principles\n2.4 Risk management\n3. Underpinning\nskills\n\n3.1 Ability in speaking clearly\n3.2 Ability in using hand-held radio\n3.3 Ability in using various hand signals\n3.4 Interpreting reference material\n3.5 Executing lifting plan\n4. Resource\nimplications\n\nThe following resources must be provided:\n4.1 Hand-held radio\n4.2 Crane\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through:\n5.1 Oral/written questioning\n5.2 Demonstration\n5.3 Work record and documentation\n6. Context of\nassessment\n\n6.1 Competency in this unit maybe assessed in a simulated\n venue\n\n--- PDF PAGE 46 ---\nTR HEAVY EQUIPMENT OPERATION"
