  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the core units of competency\nrequired in HEAVY EQUIPMENT OPERATION - RIGGING NC I. These units of\ncompetency are categorized into basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY:\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE :\n500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto receive, respond and act on verbal and written\ncommunication.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Follow routine spoken\nmessages\n1.1 Required information is gathered by listening attentively\nand correctly interpreting or understanding\ninformation/instructions\n1.2 Instructions/information are properly recorded\n1.3 Instructions are acted upon immediately in accordance\nwith information received\n1.4 Clarification is sought from workplace supervisor on all\noccasions when any instruction/information is not clear\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with organizational\nguidelines\n2.2 Routine written instruction are followed in sequence\n2.3 Feedback is given to workplace supervisor based on the\ninstructions/information received\n\n--- PDF PAGE 5 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1 Handwritten and printed material\n1.2 Internal memos\n1.3 External communications\n1.4 Electronic mail\n1.5 Briefing notes\n1.6 General correspondence\n1.7 Marketing materials\n1.8 Journal articles\n2. Organizational\nGuidelines\nIt may include:\n2.1 Information documentation procedures\n2.2 Company policies and procedures\n2.3 Organization manuals\n2.4 Service manual\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of organizational procedures\nfor handling verbal and written communications\n1.2 Received and acted on verbal messages and\n\n--- PDF PAGE 6 ---\nTR HEAVY EQUIPMENT OPERATION\n\ninstructions\n1.3 Demonstrated competency in recording\ninstructions/information\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Knowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2 Ethical work practices in handling communications\n2.3 Communication process\n3. Underpinning Skills\n3.1 Conciseness in receiving and clarifying\nmessages/information/communication\n3.2 Accuracy in recording messages/information\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Pens\n4.2 Note pad\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n6. Context of Assessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\nUNIT OF COMPETENCY:\nWORK WITH OTHERS\nUNIT CODE :\n500311102\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto develop workplace relationship and contribute in\nworkplace activities\n\n--- PDF PAGE 7 ---\nTR HEAVY EQUIPMENT OPERATION\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good relationship\n1.2 Assistance is sought from workgroup when difficulties\narise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and tasks\nare made according to organizational requirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n\n--- PDF PAGE 8 ---\nTR HEAVY EQUIPMENT OPERATION\n\n1.4 Supervision and accountability requirements including\nOHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues\nand clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n4. Providing support to\nteam members\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Provided support to team members to ensure goals are\nmet\n1.2 Acted on feedback from clients and colleagues\n1.3 Accessed learning opportunities to extend own personal\nwork competencies to enhance team goals and\noutcomes\n\n--- PDF PAGE 9 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Underpinning\nKnowledge\n2.1 The relevant legislation that affects operations,\nespecially with regards to safety\n2.2 Reasons why cooperation and good relationships are\nimportant\n2.3 Knowledge of the organization’s policies, plans and\nprocedures\n2.4 Understanding how to elicit and interpret feedback\n2.5 Knowledge of workgroup member’s responsibilities and\nduties\n2.6 Importance of demonstrating respect and empathy in\ndealings with colleagues\n2.7 Understanding of how to identify and prioritize personal\ndevelopment opportunities and options\n3. Underpinning Skills\n3.1 Ability to read and understand the organization’s policies\nand work procedures\n3.2 Write simple instructions for particular routine tasks\n3.3 Interpret information gained from correspondence\n3.4 Communication skills to request advice, receive\nfeedback and work with a team\n3.5 Planning skills to organized work priorities and\narrangement\n3.6 Technology skills including the ability to select and use\ntechnology appropriate to a task\n3.7 Ability to relate to people from a range of social, cultural\nand ethnic backgrounds.\n\n--- PDF PAGE 10 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2 Materials relevant to the proposed activity or task\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1 Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2 Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3 Case studies and scenarios as a basis for discussion of\nissues and strategies\n6. Context for Assessment\n6.1 Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\nUNIT OF COMPETENCY:\nDEMONSTRATE WORK VALUES\nUNIT CODE :\n50031103\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitude in\ndemonstrating proper work values.\n\n--- PDF PAGE 11 ---\nTR HEAVY EQUIPMENT OPERATION\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Define the purpose\nof work\n\n1.1 One’s unique sense of purpose for working and the\nwhy’s of work are identified, reflected on and clearly\ndefined for one’s development as a person and as a\nmember of society.\n1.2 Personal mission is in harmony with company’s values\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent company\nethical standards, policies and guidelines\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational policy\nand guidelines\n2.3 Personal behavior and relationships with co-workers\nand/or clients are conducted in accordance with ethical\nstandards, policy and guidelines\n2.4 Company resources are used in accordance with\ntransparent company ethical standard, policies and\nguidelines\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines\n3.2 Work incidents/situations are reported and/or\nresolved in accordance with company protocol /\nguidelines\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and\ncompany’s core values\n4.2 Instructions to co-workers are provided based on\nethical, lawful and reasonable directives\n4.3 Company values/practices are shared with co-workers\nusing appropriate behavior and language\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n--- PDF PAGE 12 ---\nTR HEAVY EQUIPMENT O