      "definition": "Refers to a change in the original shape of the fitting. 2. Fittings Refer to the tools or devices used as attachment for wire rope, chain or web sling. 3. Grooves Refers to a depression in the periphery of a sheave for supporting a rope. 4. Hitches Refers to a method of lifting with a sling (i.e. vertical, basket, choker) for better load control. 5. Kink Refers to a sharp bend in a wire rope that permanently distorts the wire and strands but not dogleg. 6. Rigger Refers to a qualified person who is responsible for connecting the load, and inspecting the rigging gears and assisting the crane operator. 7. Rigging Chart Refers to the rigger’s lifting guide provided by the manufacturer. 8. Rigging Gears Refer to the use of the general rigging hardware such as spreader bar, slings, shackles, splicing kit, tagline, etc. 9. Sheave Refers to a grove pulley with a rim. 10. Sleeves Refer to a kind of swage or ferule in press fitting used to form a loop/ eye at the end of a wire rope. 11. Tagline Refers to a rope attached to prevent additional movement of a load. 12.User’s Manual Refers to the manufacturer’s general catalogue. 13. Wear Refers to a reduction in the circumference of a fitting due to friction. 14. Work Load Limit Refers to the maximum mass or force which the product is authorized to support in a particular service. 15. Wire Rope Refers to a material composed of hi-carbon steel wires and strands laid helically around a core."
