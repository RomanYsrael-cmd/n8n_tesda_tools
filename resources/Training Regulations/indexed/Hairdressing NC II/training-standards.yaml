      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany the curricula.\n\nCourse Title: HAIRDRESSING\nNC Level: NC II\n\nNominal Training Duration:\n\n37 Hours (Basic Competencies)\n\n 24 Hours (Common Competencies)\n\n480 Hours (Core Competencies)\n\n541\n\n40 Supervised Industry Learning (SIL)\n\n581 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing pre and post hair care activities, hair and scalp\ntreatment, basic hair coloring, hair bleaching, basic hair perming, hair straightening\nand basic haircutting. This include classroom learning activities and practical work\nin actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 126 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n122\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\nPerform workplace duties scenario\nfollowing workplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n--- PDF PAGE 127 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n123\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication procedures\nand systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record\nroutine workplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people\nof social range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work-related documents\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no Definition of Team\no Difference between team and group\no Objectives and goals of team\n• Lecture/ Discussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n--- PDF PAGE 128 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n124\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nLocate needed information from the\ndifferent sources of information\n2.2 Identify one’s role\nand responsibility\nwithin team\n•\nRole play :\no individual role and responsibility\n•\nRole Play\no Understanding Individual\ndifferences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Analyze routine/procedural problems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n3.2 Look for solutions\nto routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 129 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n125\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Formulate possible solutions to\nproblems and document procedures for\nreporting\n3.3 Look for solutions\nto routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Formulate possible solutions to\nproblems and document procedures for\nreporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management\nstrategies that assist in regulating\nbehavior and achieving personal and\nlearning goals\n• Explain enablers and barriers in\nachieving personal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger,\nworry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\nprofessional\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 hour\n\n--- PDF PAGE 130 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n126\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal\nand career goals\n• Share experiences that show\nconfidence, and resilience in the face of\nsetbacks and frustrations and other\nnegative emotions and unpleasant\nsituations in the workplace\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/ dislikes;\nthrough showing of self-confidence\n• Demonstrate self-acceptance and being\nable to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n1 hour\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-\nregulation based on Self-Regulation\nTheory (SRT)\n• Explain personality development\nconcepts\n• Cite self-help concepts (e. g., 7 Habits\nby Stephen Covey, transactional\nanalysis, psycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility,\nadaptability, etc.\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n1 hour\n\n--- PDF PAGE 131 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n127\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Determine strengths and weaknesses\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to\ndo things better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 hour\n5.2 Discuss and\ndevelop ideas\nwith others\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Communicate ideas through small group\ndiscussions and meetings\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance\n1 hour\n\n--- PDF PAGE 132 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n128\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n5.3 Integrate ideas\nfor change in the\nworkplace\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Communicate ideas through small group\ndiscussions and meetings\n• Demonstrate basic skills in data analysis\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 hour\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\no Organisational protocols\no Confidentiality and accuracy\no Business mathematics and\nstatistics\no Legislation, policy and procedures\nrelating to the conduct of\nevaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 hours\n6.2 Assess gathered\ndata/ information\n• Lecture and discussion on:\no Data analysis techniques/\nprocedures\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n3 hours\n\n--- PDF PAGE 133 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n129\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Organisational values, ethics and\ncodes of conduct\no Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n• Role Play\n• Practical exercises\n• Presentation\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\no Reporting requirements to a range\nof audiences\no Recommendations for possible\nimprovements\n• Analysis and comparison of interim