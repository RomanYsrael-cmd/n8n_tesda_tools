nNominal\nDuration\n1. Maintain an\neffective\nrelationship with\nclients/\ncustomers (6\nhours)\n1.1 Maintain a\nprofessional\nimage\n\n• Lecture and discussion on the following\ntopics:\no Stance\no Posture\no Body language\no Grooming\no Standing orders\no Company policy and procedures\n• Maintain uniform and personal grooming\nin accordance with established policies\nand procedures\n• Maintain stance, posture, body language,\nand other personal presence in according\nto required standards\n• Keep visible work area tidy and\nuncluttered\n• Store equipment according to assignment\nrequirements\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n 1 hour\n1.2 Meet client\nrequirements\n\n• Lecture and discussion on the following\ntopics:\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n\n--- PDF PAGE 137 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n133\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Assignment instructions\no Post orders\no Reviewing assignment instructions\no Discussion techniques with\nclient/customer\no Implementing required changes\no Referral to appropriate\nemployer/personnel\no Clarification of client needs and\ninstructions\n•\nIdentify assignment instructions and\npost orders according to standard\nprocedures\n•\nAccomplish scope to modify\ninstructions/orders in the light of\nchanged situations\n•\nMeet client requirements according to\nthe assignment instructions\n•\nMonitor and appropriate action is taken\nin changes to client’s needs and\nrequirements\n•\nClear and comply with assignment\nrequirements of all communications with\nthe client or customer\n1.3 Build credibility\nwith clients\n\n•\nLecture and discussion on the following\ntopics:\no Interpersonal skills\no Customer service skills\no Telephone etiquette\no Maintaining records\n•\nAdhere to client expectations for\nreliability, punctuality and appearance\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n\n--- PDF PAGE 138 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n134\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nIdentify, attend and record possible\ncauses of client/customer dissatisfaction\naccording to employer policy\n•\nInform client of all relevant security\nmatters in a timely manner and\naccording to agreed reporting\nprocedures\n1.4 Establish\nprofessional\nrelationship with\nthe client\n\n•\nLecture and discussion on the following\ntopics:\no Types of Client\no Main Components of Client\nRelationship\no Relative Intelligence\no Effect on Customer Satisfaction\no Benefits of Customer\nRelationship Management\no Improving Client Relationship\n• Demonstrate the ability to establish\nprofessional relationship with client\n• Demonstrate the ability of genuine\nconcern for the welfare of the clients\n• Demonstrate the ability required in\nhandling clients\n• Demonstrate the ability required in\nrendering client service skills\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n1.5 Manage client\ninteractions\n\n•\nLecture and discussion on the following\ntopics:\no Manage client interactions\no Causes of client/customer\ndissatisfaction\no Assignment Instructions\no Reporting procedures\n•\nPerform the following skills:\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n\n--- PDF PAGE 139 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n135\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Attention to detail when completing\nclient/employer documentation\no Interpersonal and communication\nskills required in client contact\nassignments\no Customer service skills required to\nmeet client/customer needs\n\n1.6 Provide\neffective\nresponses to\nclient enquiries\n•\nLecture and discussion on the following\ntopics:\no Common industry and company\nservices, problems and solutions\no Legal and ethical company and\nindustry aspects\no Client motivations and expectations\no Effective communication techniques\no Industry ethics and practices\no Detailed product and service\nknowledge\n•\nUse communication skills\n•\nUse language skills\n•\nUse numeracy skills\n•\nUse technology skills\n•\nRelate to people from a range of society,\ncultural and ethnic backgrounds\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n2. Manage own\nperformance (6\nhours)\n2.1 Plan for\ncompletion of\nown workload\n\n• Lecture and discussion on the following\ntopics:\n• Interaction\n• Group Discussion\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n2 hours\n\n--- PDF PAGE 140 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n136\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Assignment instructions\no Verbal instructions\no Policy documents\no Duty statements\no Self assessment\no Daily tasks\no Weekly tasks\no Regularly or irregularly occurring\ntasks\no Allocating priority and timelines\n• Identify tasks accurately according to\ninstructions\n• Develop work plans according to\nassignment requirements and employer\npolicy\n• Allocate priority and timelines to each\ntask\n• Determine tasks deadlines and comply\nwith whenever possible\n• Determine and complete work schedules\naccord