  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of HAIRDRESSING NC II, the candidate\nmust demonstrate competence in all units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals\nwho were assessed as competent in cluster of related units of competency,\nnamely:\n\n COC 1 Provide support salon services\n• Perform pre and post hair care activities\n• Perform hair and scalp treatment\n\nCOC 2 Provide hair coloring/bleaching services\n• Perform basic hair coloring\n• Perform basic hair bleaching\n\n COC 3 Provide hair perming/straightening services\n• Perform basic hair perming\n• Perform hair straightening\n\n COC 4 Provide haircutting services\n• Perform basic haircutting\n\nUpon accumulation and submission of all the COCs acquired, an individual\nshall be issued the corresponding National Certificate for the Qualification.\n\n4.1.3 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to undergo assessment and certification:\n\n4.1.4.1\nGraduates of WTR-registered program, NTR-registered programs\nor formal/non-formal/informal including enterprise-based trainings\nrelated to HAIRDRESSING NC II.\n\n--- PDF PAGE 212 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n208\n4.1.4.2\nExperienced workers (wage employed or self-employed) who\ngained competencies in providing hairdressing services for at least\ntwo (2) years within the last five (5) years.\n\n4.1.5\nRecognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of hairdressing experience within the\nlast five (5) years may apply for recognition in this Qualification through\nPortfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must\nbe consistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System.\n\n4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC) in\nHairdressing NC II are required to undergo re-assessment under the amended\nTraining Regulations (TRs), upon expiration of their Certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 213 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n209\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nteam\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career\nand life\ndecisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health\npolicies and\nprocedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying learning\nand innovation in\nthe organization\nUse information\nsystematically\nEvaluate occupational\nsafety and health\nwork practices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\nUtilize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice of\nsocial justice in\nthe workplace\nManage\ninnovative work\ninstructions\nManage and\nevaluate usage\nof information\nLead in improvement\nof Occupational\nSafety and Health\nProgram, Policies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork procedures\nDevelop\nsystems in\nmanaging and\nmaintaining\ninformation\nManage\nimplementation of\noccupational safety\nand health programs\nin the workplace\nManage\nimplementation of\nenvironmental\nprograms in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\n\nMaintain an effective\nrelationship with\nclients/customers\nManage own performance\nApply quality standards\nMaintain a safe, clean and\nefficient environment\nCOMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR\nHAIRDRESSING NC II\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\n--- PDF PAGE 214 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n210\n\nPerform facial\ncleansing\nPerform temporary\nhair removal activity\nPerform body\nscrub\nPerform pre and\npost hair care\nactivities\nPerform hair and\nscalp treatment\nPerform basic\nhair coloring\nPerform basic\nhair bleaching\nPerform basic\nhair perming\nPerform hair\nstraightening\nPerform basic\nhaircutting\nPerform advanced\nand creative\nhaircutting\nPerform\nadvanced and\ncreative hair\ncoloring\nPerform advanced\nand creative hair\nperming\nPerform basic\nmen’s\nhaircutting\nPerform shave\nand style beard\nand mustache\nPerform chair\nmanipulative\nrelaxing services\nPerform\nmanicure and\npedicure\nPerform hand\nand foot spa\nPerform\npreparatory\nactivities\nPrepare appropriate\nproducts, tools and\nequipment\nPerform nail\nenhancement\ntechnology\nprocedures\nPerform post\nservice activities\nPerform\nadvanced nail\npolish\nprocedures\nApply facial\nmake-up\nPerform body\nbleach\n\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 215 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n211\nGLOSSARY OF TERMS\n\nAnalysis Hair\n- an examination to determine the condition of the hair prior to a hair\ntreatment\nAniline\nDerivative\nTints\n- are also known as penetrating tints, synthetic, organic tints and\nperoxide or oxidation tints and are commonly called tints in the\nindustry\nBasic\nHairshaping\n- shaping the hair that is not too long or too short to different head\nshape\nBleaching\n- removing the natural pigmentation\nBlunt cutting\n- all hair strands must direct at the same point. The hair appears to be\nthe same length\nBob\n- a level haircut above the shoulders\nCold waving\n- a system of permanent waving involving the use of chemicals, without\nthe application of heat\nColor Fillers\n- are used if the hair is in damaged condition and there is doubt that the\ncolor result will be an even shade\nColor stripping\n- removing artificial color by bleaching or chemical color stripper\nColor test/tint\n- a method of determining the action of color on a small strand of hair\nConditioner\n- creams, waxes and oils which help protect and maintain the health\nand condition of the hair\nConditioning\n- the application of special chemical agents to the hair to help restore\nits strength and give it body in order to protect it against possible\nbreakage\nContour\nwinding\n- a loose wave, winding the perm rods to the contour of the head -shape\nCuticle\n- the outer layer of the hair; the hard skin at the base of the fingernail\nCleanse - to make (someone or something) clean\nDigital Perm\n- is a new technique of creating a shiny and bouncy wave to your hair.\nAs a new trend-setting hairstyling treatment, the digital perm uses\ntemperature controlled rods that are all powered by a machine with a\ndigital display\nDiffuser\n- an attachment on a blow dryer that “shatters’ the flow of air so that the\nhair can be soft styled\nDisinfection\n- this is a chemical process that eliminates the majority of\nmicroorganisms. These chemical products destroy, bacteria, fungi\nand viruses.\nDye\n- to color or stain the hair with tint\nElasticity\n- the ability of the hair to stretch and return to its original form without\nbreaking\nEmulsifying\nagent\n- a substance used to form an emulsion, e.g. shampoo\n\n--- PDF PAGE 216 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n212\nEnd paper\n- a small paper tissue used at the end of a strand of hair to assist the\nwinding of the perm rod\nImplements\n- a tool, utensil or other piece of equipment, especially as used for a\nparticular purpose\nFrosting\n- to lighten or darken small selected strands of hair over the entire head\nto blend with the root of the hair\nFirst-Aid\n- means immediate assistance given in case of injury until medical aid\nhas been obtained\nGraduation\n- the grade at which the hair is cut by degrees\nGuideline\n- a line to follow when shaping the balance of the hair\nHair analysis\n- an examination to determine the condition of the hair prior to a hair\ntreatment\nHair Density\n- the amount of hair strands per square inch on the scalp\nHair Cutting\n- a process to thinning, tapering and shortening of the hair into a\nbecoming shapes or styles\nHairstyling\n- a process of arranging the hair into a temporary design\n- involves arranging the hair in a particular style, appropriately suited to\nthe cut, and may require the use of hairstyling aid such as hair spray,\ngel or mousse\nHair stylist\n- a person who designs and dresses the hair\nKeratin\n- keratin is a protein that your hair is made up of.\nLayer/Layering\n- holding the hair out from the head at a 90 degree angle and then\nremoving a defined amount to remove volume, give movement, and\nadded texture\nLysine\n- an animo acid found in hair\nMedulla\n- a hollow pith or core of the hair fiber.\nMelanin\n- the dark or black pigment in the epidermis and hair, and in the\nchoroids or coat of the eye\nMold\n- to form a shape\nNeutralizer\n- an agent capable of neutralizing another substance\nNormal hair\nshedding\n- a certain amount of hair is shed daily. This is nature’s method to make\nway for new hair. The average daily shedding is estimated at 50-80\nhairs. Hair loss beyond this estimated average indicates some scalp\nor hair trouble.\nLayering\n- is a technique used by hairdressers to change the thickness of the\nhair, creating either a thinning or thicker appearance. In this way the\nhair can be given a fuller appearance, more texture and movement.\nPatch or skin\ntest\n- a procedure to test chemical reaction on scalp and skin\nPerm\n- abbreviation for permanent wave\n\n--- PDF PAGE 217 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n213\nPersonal\nProtective\nEquipment\n- means any clothing, device or other article that is intended to be worn\nor used by a worker to prevent injury or to facilitate rescue\nPorosity\n- ability of the hair to absorb liquid\nRebonding\n- rejoining the lines and bonds on the keratin chais – neutralizing\nRelaxer\n- a chemical applied to the hair to remove the natural curl\nSanitation\n- procedure that reduces the number of germs on instruments and\nsurfaces. This works by chemically cleaning surfaces to prevent the\nspread of infection. These products are often purchased in a\nconcentrated form and then mixed with water\nSectioning\n- hair sectioning is dividing the head into uniform working panels\nSetting lotion\n- a liquid used to facilitate setting, retaining the holding power of the set\n(or blow dry) by coating the hair fibre and thereby resisting the\nabsorption of moisture\nShimmering\n- shading or tinting parts of the hair to enhance the style\nShingling\n- is cutting the hair close to the nape and gradually longer toward the\ncrown, without showing a definite line\nSlithering\n- tapering the hair to graduated length with scissors\nStack winding\n- a method of permanent waving whereby the perm rod are built up on\ntop of each other, in a pile\nSterilisation\n- This process completely gets rid of all microbial life and destroys all\npotentially dangerous organism\nStreaking\n- layers or strands of hair with a contrasting color, usually placed so as\nto enhance the appearance\nTaper\n- to diminish a strand of hair gradually toward the points by cutting.\nRemoving bulk from the ends of the hair\nThinning\n- removing bulk from the hair\nToners\n- the colors applied to hair which has been lightened – delicate pastel\nshades, e.g. champagne, beige, silver\nTexture\n- coarseness and fineness of the hair\nTexturizing\n- thinning or notching are used to create wispy or spiky effect.\nTrichologist\n- a person trained in the science of caring for the hair\nTrichology\n- the study of the structure and functions of the hair\nVent brush\n- a brush with widely spaced plastic bristles designed to be used while\nblow drying\nWorkplace\n- refers to the office. Premises or worksite where a worker is temporary\nor habitually assigned. Where is not a fixed or definite workplace, the\nterm shall include the place where the worker actually performs\nregular work, or where he regularly reports to render service or to take\nassignment\n\n--- PDF PAGE 218 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n214\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend sincerest thank you and appreciation to the representatives of business, industry,\nacademe and government agencies who provided their time and expertise in the\ndevelopment and validation of this Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERT AND REVIEW PANEL\n\nMANOLITO “Ching” D. DONDONILLA\nTechnical Expert/Member\nPhilippine International Cosmetologists Assn. (PICA)\n\n ANDREW I. GALINDON\nTechnical Expert/Board Member\nPhilippine International Cosmetologists Assn. (PICA)\n\n CRISTINA P. MARPURI\nTechnical Expert/Member\nPhilippine International Cosmetologists Assn. (PICA)\n\nThe PARTICIPANTS in the Validation of this Training Regulation\n\nName\nOrganization/Company\nMary Helen L. Reyes\nReyes Haircutters\nDanilo V. Romero\nReyes Haircutters\nAlejandro S. Dungo\nReyes Haircutters\nMarites R. Del Pilar\nReyes Haircutters\nAndy A. Pasion, Jr.\nAndy Pasion Asia Training Institute Inc.\nMa. Lea D. Ycoy\nAndy Pasion Asia Training Institute Inc.\nEdwin L. Labalan\nEdwin Lisa Brows & Aesthetics\nHarizon C. Olivar\nHarizon “Hanz” Olivar Salon\nNoroddin M. Manuel\nFelicitite Training Center Corporate\nCarla K. Gilhang\nDesigner’s Cave Salon Co.\nGloria R. Katipunan\nDesigner’s Cave Salon Co.\nJanuary C. Donato\nGraciella Beauty Salon\nShaylyn E. Reburiano\nUniminx\nRaul A. Reburiano, Jr.\nUnihair Expressions\nRolando R. Wong\nBeauty Kingdom\nCarmela B. Ocampo\nALS Cabuyao\nEvelyn M. Ebbat\nALS Cabuyao\n\nThe Participants in the National Validation of this Training Regulation\n• Members of the Philippine International Haircutters Association (PIHA)\n• Members of the Philippine International Cosmetologists Association (PICA)\n• Members of the Haircutters and Cosmetologists Association of the Philippines\n(HACAP)\n\n--- PDF PAGE 219 ---\nTR - Hairdressing NC II Revision 01\nPromulgated (06/09/2020)\n215\nThe Members of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\nQualifications and Standards Office (QSO)\n-\nMS. IMELDA B. TAGANAS, Executive Director\n\n•\nCompetency Standards Developmen