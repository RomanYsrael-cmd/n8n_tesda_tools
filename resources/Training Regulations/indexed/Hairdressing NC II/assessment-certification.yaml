      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of HAIRDRESSING NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in cluster of related units of competency, namely: COC 1 Provide support salon services • Perform pre and post hair care activities • Perform hair and scalp treatment COC 2 Provide hair coloring/bleaching services • Perform basic hair coloring • Perform basic hair bleaching COC 3 Provide hair perming/straightening services • Perform basic hair perming • Perform hair straightening COC 4 Provide haircutting services • Perform basic haircutting Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification. 4.1.3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4 Any of the following are qualified to undergo assessment and certification: 4.1.4.1 Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to HAIRDRESSING NC II. Promulgated (06/09/2020)"
    },
    {
      "number": "208",
      "text": "4.1.4.2 Experienced workers (wage employed or self-employed) who gained competencies in providing hairdressing services for at least two (2) years within the last five (5) years. 4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least three (3) years of hairdressing experience within the last five (5) years may apply for recognition in this Qualification through Portfolio Assessment. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System. 4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC) in Hairdressing NC II are required to undergo re-assessment under the amended Training Regulations (TRs), upon expiration of their Certificates. 4.1.7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
