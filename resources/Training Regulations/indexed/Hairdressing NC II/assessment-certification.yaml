      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 213 --- TR - Hairdressing NC II Revision 01 Promulgated (06/09/2020) 209 Receive and respond to workplace communication Work with others Solve/address routine problems Enhance self- management skills Support Innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace Participate in workplace communication Work in team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace Lead workplace communication Lead small teams Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro- small-medium enterprises (MSMEs) Utilize specialized communication skill Develop and lead teams Perform higher order thinking processes and apply techniques in the workplace Contribute to the practice of social justice in the workplace Manage innovative work instructions Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health Program, Policies and Procedures Lead towards improvement of environmental work programs, policies and procedures Sustain entrepreneurial skills Manage and sustain effective communication strategies Manage and sustain high performing teams Evaluate higher order thinking skills and adjust problem solving techniques Advocate strategic thinking for global citizenship Incorporate innovation into work procedures Develop systems in managing and maintaining information Manage implementation of occupational safety and health programs in the workplace Manage implementation of environmental programs in the workplace Develop and sustain a high- performing enterprise Maintain an effective relationship with clients/customers Manage own performance Apply quality standards Maintain a safe, clean and efficient environment COMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR --- PDF PAGE 214 --- TR - Hairdressing NC II Revision 01 Promulgated (06/09/2020) 210 Perform facial cleansing Perform temporary hair removal activity Perform body scrub Perform pre and post hair care activities Perform hair and scalp treatment Perform basic hair coloring Perform basic hair bleaching Perform basic hair perming Perform hair straightening Perform basic haircutting Perform advanced and creative haircutting Perform advanced and creative hair coloring Perform advanced and creative hair perming Perform basic men’s haircutting Perform shave and style beard and mustache Perform chair manipulative relaxing services Perform manicure and pedicure Perform hand and foot spa Perform preparatory activities Prepare appropriate products, tools and equipment Perform nail enhancement technology procedures Perform post service activities Perform advanced nail polish procedures Apply facial make-up Perform body bleach --- PDF PAGE 215 --- TR - Hairdressing NC II Revision 01 Promulgated (06/09/2020) 211 Analysis Hair - an examination to determine the condition of the hair prior to a hair treatment Aniline Derivative Tints - are also known as penetrating tints, synthetic, organic tints and peroxide or oxidation tints and are commonly called tints in the industry Basic Hairshaping - shaping the hair that is not too long or too short to different head shape Bleaching - removing the natural pigmentation Blunt cutting - all hair strands must direct at the same point. The hair appears to be the same length Bob - a level haircut above the shoulders Cold waving - a system of permanent waving involving the use of chemicals, without the application of heat Color Fillers - are used if the hair is in damaged condition and there is doubt that the color result will be an even shade Color stripping - removing artificial color by bleaching or chemical color stripper Color test/tint - a method of determining the action of color on a small strand of hair Conditioner - creams, waxes and oils which help protect and maintain the health and condition of the hair Conditioning - the application of special chemical agents to the hair to help restore its strength and give it body in order to protect it against possible breakage Contour winding - a loose wave, winding the perm rods to the contour of the head -shape Cuticle - the outer layer of the hair; the hard skin at the base of the fingernail Cleanse - to make (someone or something) clean Digital Perm - is a new technique of creating a shiny and bouncy wave to your hair. As a new trend-setting hairstyling treatment, the digital perm uses temperature controlled rods that are all powered by a machine with a digital display Diffuser - an attachment on a blow dryer that “shatters’ the flow of air so that the hair can be soft styled Disinfection - this is a chemical process that eliminates the majority of microorganisms. These chemical products destroy, bacteria, fungi and viruses. Dye - to color or stain the hair with tint Elasticity - the ability of the hair to stretch and return to its original form without breaking Emulsifying agent - a substance used to form an emulsion, e.g. shampoo --- PDF PAGE 216 --- TR - Hairdressing NC II Revision 01 Promulgated (06/09/2020) 212 End paper - a small paper tissue used at the end of a strand of hair to assist the winding of the perm rod Implements - a tool, utensil or other piece of equipment, especially as used for a particular purpose Frosting - to lighten or darken small selected strands of hair over the entire head to blend with the root of the hair First-Aid - means immediate assistance given in case of injury until medical aid has been obtained Graduation - the grade at which the hair is cut by degrees Guideline - a line to follow when shaping the balance of the hair Hair analysis - an examination to determine the condition of the hair prior to a hair treatment Hair Density - the amount of hair strands per square inch on the scalp Hair Cutting - a process to thinning, tapering and shortening of the hair into a becoming shapes or styles Hairstyling - a process of arranging the hair into a temporary design - involves arranging the hair in a particular style, appropriately suited to the cut, and may require the use of hairstyling aid such as hair spray, gel or mousse Hair stylist - a person who designs and dresses the hair Keratin - keratin is a protein that your hair is made up of. Layer/Layering - holding the hair out from the head at a 90 degree angle and then removing a defined amount to remove volume, give movement, and added texture Lysine - an animo acid found in hair Medulla - a hollow pith or core of the hair fiber. Melanin - the dark or black pigment in the epidermis and hair, and in the choroids or coat of the eye Mold - to form a shape Neutralizer - an agent capable of neutralizing another substance Normal hair shedding - a certain amount of hair is shed daily. This is nature’s method to make way for new hair. The average daily shedding is estimated at 50-80 hairs. Hair loss beyond this estimated average indicates some scalp or hair trouble. Layering - is a technique used by hairdressers to change the thickness of the hair, creating either a thinning or thicker appearance. In this way the hair can be given a fuller appearance, more texture and movement. Patch or skin test - a procedure to test chemical reaction on scalp and skin Perm - abbreviation for permanent wave --- PDF PAGE 217 --- TR - Hairdressing NC II Revision 01 Promulgated (06/09/2020) 213 Personal Protective Equipment - means any clothing, device or other article that is intended to be worn or used by a worker to prevent injury or to facilitate rescue Porosity - ability of the hair to absorb liquid Rebonding - rejoining the lines and bonds on the keratin chais – neutralizing Relaxer - a chemical applied to the hair to remove the natural curl Sanitation - procedure that reduces the number of germs on instruments and surfaces. This works by chemically cleaning surfaces to prevent the spread of infection. These products are often purchased in a concentrated form and then mixed with water Sectioning - hair sectioning is dividing the head into uniform working panels Setting lotion - a liquid used to facilitate setting, retaining the holding power of the set (or blow dry) by coating the hair fibre and thereby resisting the absorption of moisture Shimmering - shading or tinting parts of the hair to enhance the style Shingling - is cutting the hair close to the nape and gradually longer toward the crown, without showing a definite line Slithering - tapering the hair to graduated length with scissors Stack winding - a method of permanent waving whereby the perm rod are built up on top of each other, in a pile Sterilisation - This process completely gets rid of all microbial life and destroys all potentially dangerous organism Streaking - layers or strands of hair with a contrasting color, usually placed so as to enhance the appearance Taper - to diminish a strand of hair gradually toward the points by cutting. Removing bulk from the ends of the hair Thinning - removing bulk from the hair Toners - the colors applied to hair which has been lightened – delicate pastel shades, e.g. champagne, beige, silver Texture - coarseness and fineness of the hair Texturizing - thinning or notching are used to create wispy or spiky effect. Trichologist - a person trained in the science of caring for the hair Trichology - the study of the structure and functions of the hair Vent brush - a brush with widely spaced plastic bristles designed to be used while blow drying Workplace - refers to the office. Premises or worksite where a worker is temporary or habitually assigned. Where is not a fixed or definite workplace, the term shall include the place where the worker actually performs regular work, or where he regularly reports to render service or to take assignment --- PDF PAGE 218 --- TR - Hairdressing NC II Revision 01 Promulgated (06/09/2020) 214 The Technical Education and Skills Development Authority (TESDA) would like to extend sincerest thank you and appreciation to the representatives of business, industry, academe and government agencies who provided their time and expertise in the development and validation of this Training Regulations. MANOLITO “Ching” D. DONDONILLA Technical Expert/Member Philippine International Cosmetologists Assn. (PICA) ANDREW I. GALINDON Technical Expert/Board Member Philippine International Cosmetologists Assn. (PICA) CRISTINA P. MARPURI Technical Expert/Member Philippine International Cosmetologists Assn. (PICA) The PARTICIPANTS in the Validation of this Training Regulation Name Organization/Company Mary Helen L. Reyes Reyes Haircutters Danilo V. Romero Reyes Haircutters Alejandro S. Dungo Reyes Haircutters Marites R. Del Pilar Reyes Haircutters Andy A. Pasion, Jr. Andy Pasion Asia Training Institute Inc. Ma. Lea D. Ycoy Andy Pasion Asia Training Institute Inc. Edwin L. Labalan Edwin Lisa Brows & Aesthetics Harizon C. Olivar Harizon “Hanz” Olivar Salon Noroddin M. Manuel Felicitite Training Center Corporate Carla K. Gilhang Designer’s Cave Salon Co. Gloria R. Katipunan Designer’s Cave Salon Co. January C. Donato Graciella Beauty Salon Shaylyn E. Reburiano Uniminx Raul A. Reburiano, Jr. Unihair Expressions Rolando R. Wong Beauty Kingdom Carmela B. Ocampo ALS Cabuyao Evelyn M. Ebbat ALS Cabuyao The Participants in the National Validation of this Training Regulation • Members of the Philippine International Haircutters Association (PIHA) • Members of the Philippine International Cosmetologists Association (PICA) • Members of the Haircutters and Cosmetologists Association of the Philippines (HACAP) --- PDF PAGE 219 --- TR - Hairdressing NC II Revision 01 Promulgated (06/09/2020) 215 The Members of the TESDA Board and Secretariat The MANAGEMENT and STAFF of the TESDA Secretariat Qualifications and Standards Office (QSO) - MS. IMELDA B. TAGANAS, Executive Director • Competency Standards Development Division - MS. MA. ISABEL G. GAMUROT, Division Chief - MR. EDWIN G. MAGLALANG - MS. BARBARA JANE B. REYES • Competency Programs and Standards Development Division - MS. MERCEDES E. JAVIER, Division Chief - MS. JENNIFER C. CASPE - MR. JOSEPH CYRUS P. SANTALISIS --- PDF PAGE 220 --- TR - Hairdressing NC II Revision 01 Promulgated (06/09/2020) 216 TRAINING REGULATIONS (TR) Qualification Title: Hairdressing NC II Qualification Code: SOCHDR220 Revision No. Document Types* Qualification Title TESDA Board Resolution No./ Date Deployment Circular (TESDA Circular/ Implementing Guidelines) 00 Document Created Hairdressing NC II BR No. 2010-18 11/25/2010 N/A 01 Document Amended Hairdressing NC II BR No. 2020-26 06/09/2020 TESDA Circular No. 105 series of 2020 Legend: *Description Types - Document Created - Document Amended - Document Superseded --- PDF PAGE 221 --- Training Regulation are available in both printed and electronic copies for more information, please contact: Technical Education and Skills Development Authority (TESDA) Tele Fax No.: 818-7728 or visit our website: www.tesda.gov.ph"
