      "term": "These include large worn",
      "definition": "out or broken household, commercial, and industrial items such as furniture, lamps, bookcases, filing cabinets, and other similar items; 3. Buy-back center shall refer to a recycling center that purchases or otherwise accepts recyclable materials from the public for the purpose of recycling such materials; 4. Collection shall refer to the act of removing solid waste from the source or from a communal storage point; 5. Composting shall refer to the controlled decomposition of organic matter by micro- organisms, mainly bacteria and fungi, into a humus-like product; 6. Consumer electronics shall refer to special waste that includes worn-out, broken, and other discarded items such as radios, stereos, and TV sets; 7. Controlled dump shall refer to a disposal site at which solid waste is deposited in accordance with the minimum prescribed standards of site operation; 8. Department shall refer to the Department of Environment and Natural Resources; 9. Disposal shall refer to the discharge, deposit, dumping, spilling, leaking or placing of any solid waste into or in a land; 10. Disposal site shall refer to a site where solid waste is finally discharged and deposited; 11. Ecological solid waste management shall refer to the systematic administration of activities which provide for segregation at source, segregated transportation, storage, transfer, processing, treatment, and disposal of solid waste and all other waste management activities which do not harm the environment; 12. Environmentally acceptable shall refer to the quality of being re-usable, biodegradable or compostable, recyclable and not toxic or hazardous to the environment; 13. Generation shall refer to the act or process of producing solid waste; 14. Generator shall refer to a person, natural or juridical, who last uses a material and makes it available for disposal or recycling; 15. Hazardous waste shall refer to solid waste management or combination of solid waste which because of its quantity, concentration or physical, chemical or infectious characteristics may: (1) cause, or significantly contribute to an increase in mortality or an increase in serious irreversible, or incapacitating reversible, illness; or (2) pose a substantial present or potential hazard to human health or the environment when improperly treated, stored, transported, or disposed of, or otherwise managed; 16. Leachate shall refer to the liquid produced when waste undergo decomposition, and when water percolate through solid waste undergoing decomposition. It is contaminated liquid that contains dissolved and suspended materials; 17. Materials recovery facility - includes a solid waste transfer station or sorting station, drop-off center, a composting facility, and a recycling facility; 18. Municipal waste shall refer to wastes produced from activities within local government units which include a combination of domestic, commercial, institutional and industrial wastes and street litters; 19. Open dump shall refer to a disposal area wherein the solid wastes are indiscriminately thrown or disposed of without due planning and consideration for environmental and"
