  "source_text": "SECTION 1\nSANITARY LANDFILL OPERATIONS NC II QUALIFICATION\n\nThe SANITARY LANDFILL OPERATIONS NC II Qualification consists of\ncompetencies that a person must achieve to direct dumping/disposal of in-coming\nwaste in the active cell and perform post-dumping activities.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\nTRS311201 Develop and update industry knowledge\nTRS311204 Perform workplace security and safety practices\nUTL532201 Maintain environmental health and awareness in the workplace\n\nUNIT CODE\nUTL541301\nCORE COMPETENCIES\n Direct dumping/disposal of in-coming waste in the active cell\nUTL541302\nPerform post-dumping activities\n\nA person who has achieved this Qualification is competent to be:\n\n Sanitary Landfill Facility (SLF) Spotter\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\n\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -2-"
