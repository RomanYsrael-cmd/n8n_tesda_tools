        "source_text": "--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n24- \nUNIT OF COMPETENCY  :    PERFORM WORKPLACE SECURITY AND SAFETY \nPRACTICES \n \nUNIT CODE \n: \nTRS311204 \n \nUNIT DESCRIPTOR \n:    This unit of competency deals with the knowledge, skills and  \nattitudes  in following health, safety and security practices.  It \nincludes dealing with emergency situations and maintaining \nsafe personal presentation standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Follow \nworkplace \nprocedures for \nhealth, safety \nand security \npractices \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n1.1 Correct health, \nsafety and \nsecurity \nprocedures are \nfollowed in line with \nlegislation and \nenterprise \nprocedures \n1.2 Breaches of health, \nsafety and security \nprocedures are \nidentified and \nreported in line with \nenterprise \nprocedure. \n1.3 Suspicious \nbehavior or \nunusual \noccurrences are \nreported in line \nwith enterprise \nprocedure. \n1.1 Technology \n1.1.1 Correct health, \nsafety and security \nprocedures \n1.1.2 Types of breaches \nof health, safety \nand security \nprocedures \n \n1.2 Communications \n1.2.1 Verbal and written \ncommunication \n1.2.1 Interaction with \nclients \n \n1.3 Safety  \n1.3.1 Personal Safety \nEquipment \n1.3.2 Work hazards \n \n1.4 Codes and Regulations \n1.4.1 Occupational \nsafety and health \nstandards \n1.4.2 RA 9003 \n1.4.3 RA 6969 \n1.4.4 Local ordinances \n \n1.5 Values \n1.5.1 Safety- and -health \nconsciousness \n1.5.2 Resourcefulness \n1.5.3 Diligence \n1.5.4 Time-\nconsciousness \n1.5.5 Cost –\nconsciousness \n \n1.1 Knowing the \nsources of \ninformation on the \nindustry \n1.2 Assessing and \nupdating industry \ninformation to \neffect improved \nwork performance \n1.3 Applying industry \ninformation to \nday-to-day work \nactivities \n1.4 Practicing \ncommunication \nskills\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n25- \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1.5.6 Personal integrity \nin doing routine \nmanagement \npractices \n1.5.7 Perseverance in \nexecutive routine \nworks \n1.5.8 Ability to work with \nothers \nharmoniously \n \n2. Deal with \nemergency \nsituations \naccording to \ncompany \nguidelines \nand/or \nsuperior'/s' \norders \n2.1 Emergency and \npotential \nemergency \nsituations are \nrecognized and \nappropriate actions \nare taken within \nindividual’s scope \nof responsibility. \n2.2 Emergency \nprocedures are \nfollowed in line with \nenterprise \nprocedures. \n2.3 Assistance is \nsought from \ncolleagues to \nresolve or respond \nto emergency \nsituation. \n2.4 Details of \nemergency \nsituations are \nreported in line with \nenterprise \nprocedures. \n2.1 Technology \n2.1.1 Types of  \nemergency \nsituations and \nprocedures \n \n2.2Communications \n2.2.1 Verbal and written \ncommunication \n2.2.2 Interaction with \nclients \n \n2.3 Safety  \n2.3.1 Personal Safety \nEquipment \n2.3.2 Work hazards \n \n2.4 Codes and Regulations \n2.4.1 Occupational \nsafety and health \nstandards \n2.4.2 RA 9003 \n2.4.3 RA 6969 \n2.4.4 Local ordinances \n \n2.5 Values \n2.5.1 Safety- and- health \nconsciousness \n2.5.2 Resourcefulness \n2.5.3 Diligence \n2.5.4 Time- \nconsciousness \n2.5.5 Cost- \nconsciousness \n2.5.6 Personal integrity \nin doing routine \nmanagement \npractices \n \n2.1 Practicing \nintra \nand interpersonal  \nskills \n2.2 Applying \nappropriate \nactions to \nemergencies \n2.3 Reporting \nemergency \nsituations\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n26- \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n2.5.7 Perseverance in \nroutine works \n2.5.8 Ability to work with \nothers \nharmoniously \n3 Maintain safe \npersonal \npresentation \nstandards \n3.1   Safe personal \nstandards are \nidentified and \nfollowed in line with \nenterprise \nrequirements. \n3.1 Technology \n3.1.1 Types of  \nemergency \nsituations and \nprocedures \n \n \n3.1.2 Personal safety \nstandards \n3.2Communications \n3.2.1 Verbal and written \ncommunication \n3.2.2 Interaction with \nclients \n3.3 Safety  \n3.3.1 Personal Safety \nEquipment \n3.3.2 Work hazards \n3.4 Codes and Regulations \n3.4.1 Occupational \nsafety and health \nstandards \n3.4.2 RA 9003 \n3.4.3 RA 6969 \n3.4.4 Local ordinances \n3.5 Values \n3.5.1 Safety- and- \nhealth \nconsciousness \n3.5.2 Resourcefulness \n3.5.3 Diligence \n3.5.4 Time -\nconsciousness \n3.5.5 Cost -\nconsciousness \n3.5.6 Personal integrity \nin doing routine \nmanagement \npractices \n3.5.7 Perseverance in \nroutine works \n3.5.8 Ability to work \nwith others \nharmoniously \n3.1 Practicing \nintra \nand interpersonal  \nskills \n3.2 Following \nappropriate  \nsafety personal \nstandards\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n27- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Health, Safety and Security \nProcedures \nMay include but are not limited to: \n1.1 Use of personal protective clothing and equipment \n1.2 Safe posture including sitting, standing, bending \n1.3 Manual handling including lifting, transferring \n1.4 Safe handling of chemicals, poisons and dangerous \nmaterials \n1.5 Ergonomically sound furniture and work stations \n1.6 Emergency fire and accident \n1.7 Hazard identification and control \n1.8 Security of documents, cash, equipment, people \n1.9 Key control systems \n \n2. Breaches of Procedure \nMay include but are not limited to: \n2.1 Loss of keys \n2.2 Strange or suspicious persons \n2.3 Broken or malfunctioning equipment \n2.4 Loss of property, goods or materials \n2.5 Damaged property or fittings \n2.6 Lack of suitable signage when required \n2.7 Lack of training on health and safety issues \n2.8 Unsafe work practices \n \n3. Emergency \nMay include but is not limited to: \n3.1   Personal injuries \n3.2 Fire \n3.3 Electrocution \n3.4 Natural calamity i.e. earthquake/flood \n3.5 Criminal acts i.e. robbery \n3.6 Bomb\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n28- \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Complied with industry practices and procedures \n1.2 Used interactive communication with others \n1.3 Complied with workplace safety, security and hygiene practices \n1.4 Identified faults and problems and the necessary corrective \naction \n1.5 Promoted public relation among others \n1.6 Complied with quality standards \n1.7 Responded to emergency situations in line with enterprise \nguidelines \n1.8  Complied with proper dress code \n \n2. Resource   \nimplications \nThe following resources should be provided: \n2.1 Procedures manual on safety, security, health and emergency \n2.2 Availability of tools, equipment, supplies and materials \n \n3. Methods of \nassessment \nCompetency may be assessed through: \n3.1 Written examination \n3.2 Practical demonstration \n3.3 Interview \n \n4. Context of \nassessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting.\n",
