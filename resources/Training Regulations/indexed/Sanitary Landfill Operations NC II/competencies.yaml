        "source_text": "--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n42- \nUNIT OF COMPETENCY : \nPERFORM POST-DUMPING ACTIVITIES \n \nUNIT CODE \n: \nUTL541302 \n \nUNIT DESCRIPTOR \n: \nThis unit involves the post dumping activities in the active area \nof the sanitary landfill cell \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.Directpushing, \nspreading and \ncompactingof \ndisposed/dumped \nwastes and re-\nprofiling of slope \n \n1.1  Dumped waste is \npushed, spread, and \ncompacted as intruc \nted to equipment \noperators and in \naccordance with SLF \nprocedures . \n1.2  Re-profiling of slopes \nare checked and \nensured based on site \nrequirements and \ninstructions from site \nforeman. \n1.3  Daily coveris applied \nas instructed to \nequipment operatorsin \naccordance with \nestablished SLF \nprocedures. \n1.4  Dumping area is \nchecked for \ncleanliness and \nreadiness for the next \nday operations in \naccordance with \nestablished SLF \nprocedures \n1.1   Technology \n1.1.1 Post Dumping \nProcedures as \nspecified in the \nSLF Manual \n1.1.2 OSH procedures \nand guidelines \n1.1.3 Cross Section of \nthe SLF dumping \narea \n \n1.2 Communications \n1.2.1 Protocol in area \n1.2.2 Verbal and written \ncommunication \n \n1.3 Safety  \n1.3.1 Personal Safety \nEquipment \n1.3.2 Work hazards \n1.3.3 Wastes \nCharacteristics  \n \n1.4 Codesand \nRegulations relating to \nsolid wastes \n1.4.1 Occupational \nsafety and health \nstandards \n1.4.2 RA 9003 \n1.4.3 RA 6969 \n1.4.4 Local \nenvironmental \nordinances \n \n1.5 Values \n1.5.1 Safety- and-\nhealth \nconsciousness \n1.5.2 Resourceful-\nness. \n1.1  Practicing verbal \nand written \ncommunications  \n1.2  Followingand \ngiving  \ninstructions \n1.3  Keen \nobservation skills \n1.4  Coordinating \nSkills \n1.5  Documenting \nSkills\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n43- \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n1.5.3 Diligence \n1.5.4 Time- \nconsciousness \n1.5.5 Cost- \nconsciousness \n1.5.6 Personal \nintegrity in doing \nroutine tasks \n1.5.7 Perseverance in  \nroutine works \n1.5.8 Ability to work \nwith others \nharmoniously \n \n2.  Assist in \nmonitoring  \nleachate condition \n2.1  Leachate production \nis monitored and \nmanaged in \naccordance with \nestablished \nprocedures of Sanitary \nLandfill (SLF) manual \nof operations. \n2.2  Water and leachate \nsampling are done on \na regular basis in \naccordance with \nestablished \nprocedures of Sanitary \nLandfill (SLF) manual \nof operations. \n2.3 Leachate collection \nfacilities are ensured \nto be in good condition \nand any damages are \nreported in \naccordance with \nestablished SLF \nprocedures \n2.1 Technology \n2.1.1 SLF \nOperations   \nManual \n2.1.2 NSWMC \nManual  on \nEstablishment \nand Operations \nfor Sanitary \nLandfill \n2.1.3 Monitoring \nform \n \n2.2 Science \n2.2.1 Water and \nleachate \nsampling form \nand \nprocedures \n2.2.2 Leachate  \ntypes, \ncomposition \nand hazards \n \n \n2.3 Communications \n2.3.1 Protocol in \narea \n2.3.2 Incidence \nreporting \n2.3.3 Monitoring \nforms \n2.3.4 Verbal and \nwritten \ncommunication \n2.1 Practicing \nverbal and \nwritten \ncommunications  \n2.2 Giving and \nfollowing \ninstructions \n2.3 Keen \nobservation \nskills \n2.4 Coordinating \nSkills \n2.5 Documenting \nSkills\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n44- \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated