        "source_text": "--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n29- \nUNIT OF COMPETENCY  :     MAINTAIN ENVIRONMENTAL HEALTH AND AWARENESS \nIN THE WORKPLACE \n \nUNIT CODE \n: \nUTL532201 \n \nUNIT DESCRIPTOR \n:    This unit of competency deals with the knowledge, skills and \nattitudes in maintaining environmental health and awareness \nin the workplace.  It includes dealing with environmental risks \nand hazards, emergency situations and maintaining self-\npersonal living standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify \nenvironmental risks \nand hazards in the \nwork place \n \n1.1  Proper procedures \nare followed in line \nwith company and \nenterprise \nprocedures \n1.2  Breaches of \nenvironmental safety \nand security \nprocedures are \nidentified and \nreported in line with \nenterprise \nprocedure. \n1.3  Suspicious \nworkplace \nconditions or \nunusual \noccurrences that \nare potential risks \nor hazards are \nreported in line \nwith enterprise \nprocedure. \n1.1  Technology \n1.1.1  Correct waste \ncollection and  \nhauling \nprocedures to \nassure  \nenvironmental \nhealth and \nsafety \n1.1.2  Identify types of \nbreaches of \nhealth, safety \nand operational \nprocedures that \nendanger \nenvironmental \nhealth \n1.1.3  Types of wastes \nand their \ncharacteristics \nand effects on \nthe environment \n1.1.4  Ways that \ndifferent waste \naffect the \nenvironment \n1.1.5 Reasons for \ncorrect/proper \nuse of PPEs. \n \n1.2Communications \n1.2.1  Verbal and \nwritten \ncommunication \n1.2.2  Interaction with \nclients \n \n \n1.1  Identifying \nenvironmental risks \nand hazards in the \nwork place \n1.2  Understanding and \nfollowing the proper \nprocedures \n1.3  Identifying and \nreporting breaches \nof environmental \nsafety and security \nprocedures \n1.4 Reporting \nsuspicious \nworkplace \nconditions or \nunusual \noccurrences that \nare potential risks of \nhazards \n1.5  Practicing \ncommunication \nskills \n1.6  Writing report\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n30- \n \n \n \n \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n \n1.3Safety  \n1.3.1Personal \nProtective \nEquipment \n1.3.2Work hazards \n \n1.4Codes and \nRegulations \n1.4.1Occupational \nsafety and health \nstandards \n1.4.2RA 9003 \n1.4.3RA 6969 \n1.4.4Clean Air Act \n1.4.5Clean Water Act \n1.4.6Other Laws \n1.4.7Local ordinances \n \n1.5Values \n1.5.1Safety- and -\nhealth \nconsciousness \n1.5.2Resourcefulness \n1.5.3Diligence \n1.5.4Time-\nconsciousness \n1.5.5Cost -\nconsciousness \n1.5.6Personal integrity \nin doing routine \nmanagement \npractices \n1.5.7Perseverance in \nexecutive routine \nworks \n1.5.8Ability to work \nwith others \nharmoniously\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n31- \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.Assist and/or \ncontributes in the \nformulation of  \nmitigation measures \nto eliminate the \nenvironmental risks \nand hazards in the \nwork place \n \n \n \n \n \n \n2.1Proper procedures \nare followed in line \nwith company and \nenterprise procedures \n2.2Breaches of \nenvironmental safety \nand security \nprocedures are \nidentified and reported \nin line with enterprise \nprocedure. \n2.3Suspicious \nworkplace conditions \nor unusual \noccurrences that are \npotential risks or \nhazards are reported \nin line with enterprise \nprocedure. \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n2.1  Technology \n2.1.1  Correct waste \ncollection and  \nhauling \nprocedures to \nassure  \nenvironmental \nhealth and \nsafety \n2.1.2  Identify types of \nbreaches of \nhealth, safety \nand operational \nprocedures that \nendanger \nenvironmental \nhealth \n2.1.3  Types of wastes \nand their \ncharacteristics \nand effects on \nthe environment \n2.1.4  Ways that \ndifferent waste \naffect the \nenvironment. \n2.1.5 Reasons for \ncorrect/proper \nuse of PPEs. \n2.2Communications \n2.21  Verbal and \nwritten \ncommunication \n2.2.2  Interaction with \nclients \n2.3Safety  \n2.3.1Personal Safety \nEquipment \n2.3.2 Work hazards \n2.4Codes and \nRegulations \n2.4.1Occupational \nsafety and health \nstandards \n2.4.2RA 9003 \n2.4.3RA 6969 \n2.4.4Clean Air Act \n2.4.5Clean Water Act \n2.4.6Other Laws \n2.1 Formulating \nmitigation measures \nto eliminate \nenvironmental risks \nand hazards in the \nwork place  \n2.2 Understanding and \nfollowing the proper \nprocedures \n2.3 Identifying and \nreporting breaches \nof environmental \nsafety and security \nprocedures \n2.4  Reporting \nsuspicious \nworkplace \nconditions or \nunusual \noccurrences that \nare potential risksor \nhazards \n2.5 Practicing \ncommunication \nskills \n2.6  Writing reports\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n32- \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n \n2.4.7Local ordinances \n2.5Values \n2.5.1Safety- and -\nhealth \nconsciousness \n2.5.2Resourcefulness \n2.5.3Diligence \n2.5.4Time-\nconsciousness \n2.5.5Cost -\nconsciousness \n2.5.6Personal integrity \nin doing routine \nmanagement \npractices \n2.5.7Perseverance in \nexecutive routine \nworks \n2.5.8Ability to work \nwith others \nharmoniously \n \n3. Implement mitigation \nmeasures to \neliminate the \nenvironmental risks \nand hazards in the \nwork place \n \n3.1Proper procedures \nare followed in line \nwith company and \nenterprise procedures \n3.2Breaches of \nenvironmental safety \nand security \nprocedures are \nidentified and reported \nin line with enterprise \nprocedure. \n3.3Suspicious \nworkplace conditions \nor unusual \noccurrences that are \npotential risks or \nhazards are reported \nin line with enterprise \nprocedure \n \n \n \n \n \n \n \n \n3.1  Technology \n3.1.1  Correct waste \ncollection and  \nhauling \nprocedures to \nassure  \nenvironmental \nhealth and safety \n3.1.2  Identify types of \nbreaches of \nhealth, safety \nand operational \nprocedures that \nendanger \nenvironmental \nhealth \n3.1.3  Types of wastes \nand their \ncharacteristics \nand effects on \nthe environment \n3.1.4  Ways that \ndifferent waste \naffect the \nenvironment. \n \n \n3.1  Implementing  \nmitigation measures \nto eliminate \nenvironmental risks \nand hazards in the \nwork place  \n3.2  Understanding and \nfollowing the proper \nprocedures \n3.3  Identifying and \nreporting breaches \nof environmental \nsafety and security \nprocedures \n3.4  Reporting \nsuspicious \nworkplace \nconditions or \nunusual \noccurrences that \nare potential risks of \nhazards \n3.5  Practicing \ncommunication \nskills \n3.6  Writing reports\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n33- \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n \n3.1.5 Reasons for \ncorrect/proper \nuse of PPEs. \n3.2Communications \n3.2.1  Verbal and \nwritten \ncommunication \n3.2.2  Interaction with \nclients \n3.3Safety  \n3.3.1Personal Safety \nEquipment \n3.3.2Work hazards \n3.4Codes and \nRegulations \n3.4.1Occupational \nsafety and health \nstandards \n3.4.2RA 9003 \n3.4.3RA 6969 \n3.4.4Clean Air Act \n3.4.5Clean Water Act \n3.4.6Other Laws \n3.4.7Local ordinances \n \n3.5Values \n3.5.1Safety- and -\nhealth \nconsciousness \n3.5.2Resourcefulness \n3.5.3Diligence \n3.5.4Time-\nconsciousness \n3.5.5Cost -\nconsciousness \n3.5.6Personal integrity \nin doing routine \nmanagement \npractices \n3.5.7Perseverance in \nexecutive routine \nworks \n    3.5.8Ability to work with  \nothers \nharmoniously\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n34- \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Environmental risks and \nhazards   \nMay include but are not limited to: \n1.1 Physical hazards – impact, illumination, pressure, noise, \nvibration, temperature, radiation  \n1.2 Biological hazards- bacteria, viruses, plants, parasites, \nmites, molds, fungi, insects \n1.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, \ngases, vapors \n1.4 Ergonomics \n1.4.1 Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n1.4.2   Physiological factors – monotony, personal \nrelationship, work out cycle \n1.5 Presence of un-qualified and/or untrained persons in the \nworkplace \n \n2.   Proper procedures \nMay include but are not limited to: \n2.1 The operational activity flows used in the job. \n2.2. Use of personal protective clothing and equipment \n2.3  The proper checking of of equipment and tools before use \n2.4  Safe posture including sitting, standing, bending \n2.5  Manual handling of waste including lifting, transferring and \nstowing the waste in proper order \n2.6  Emergency fire and accident \n2.7  Hazard identification and control \n2.8  Proper procedures in handling waste accidents and/or \nspillage \n \n3.   Breaches \nMay include but is not limited to: \n3.1  Continued use and/or operation of wrong and/or \nmalfunctioning tools and equipment \n3.2  Presence of un-qualified and/or untrained persons within \nthe work area \n3.3  Unsafe containment of waste. \n3.4  Improper system of operations in collection and hauling of \nwaste \n3.5  Lack of suitable signage when required \n3.6  Lack of training on health and safety issues \n3.7  Unsafe work practices\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n35- \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n3.1 Complied with industry and company practices and procedures \n3.2 Used interactive communication with others \n3.3 Complied with workplace safety, security and hygiene practices \n3.4 Identified faults and problems and the necessary corrective \naction \n3.5 Maintained environmental health in the workplace \n2.   Resource   \nImplications \nThe following resources should be provided: \n3.1 Procedures manual on safety, security, health and emergency \n3.2 Availability of tools, equipment, supplies and materials \n3.3 Availability of PPEs \n \n3.   Methods of \nassessment \nCompetency may be assessed through: \n3.4 Written examination \n3.5 Practical demonstration \n3.6 Interview \n \n4.   Context of \nassessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting.\n",
