        "source_title": "PARTICIPATE IN WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -2- \nSECTION 2 COMPETENCY STANDARDS \n \nThese guidelines are set to provide the Technical Vocational Education and Training \n(TVET) providers with information and other important requirements to consider when \ndesigning training programs for SANITARY LANDFILL OPERATIONS NCII. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311105 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and  relevant \ninformation is accessed \nfrom appropriate \nsources  \n1.2 Effective questioning,  \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate medium is \nused to transfer \ninformation and ideas \n1.4 Appropriate non- verbal \ncommunication is used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and followed \n1.6 Defined workplace \nprocedures for the \nlocation and storage of \ninformation are used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n1.1 Procedure of \ngathering \nworkplace \ninformation \n1.2 Techniques in \ngathering \ninformation \n1.3 Effective methods \nof conveying \ninformation \n1.4 Written \ncommunication \nmethods \n1.5 Techniques in \nconveying \ncommunication \n1.6 Different modes of \ncommunication  \n1.7 Organizational \npolicies \n1.8 Communication \nprocedures and \nsystems \n1.9 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n1.1 Gathering of \nworkplace \ninformation skills \n1.2 Sourcing of \ninformation skills \n1.3 Sorting of \ninformation skills \n1.4 Obtaining \nworkplace \ninformation skills \n1.5 Conveying \nworkplace \ninformation skills \n1.6 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -3- \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2 Own opinions are clearly \nexpressed and those of \nothers are listened to \nwithout interruption \n2.3 Meeting inputs are \nconsistent with the \nmeeting purpose and \nestablished protocols \n2.4 Workplace interactions\nare conducted in a \ncourteous manner  \n2.5 Questions about simple \nroutine workplace \nprocedures and matters \nconcerning working \nconditions of \nemployment are asked \nand responded to \n2.6 Meetings outcomes are \ninterpreted and \nimplemented \n \n2.1 Effective \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Written \ncommunication \n2.4 Organizational \npolicies \n2.5 Communication \nprocedures and \nsystems \n2.6 Decorum in \nparticipating \nworkplace \nmeetings and \ndiscussions \n2.1 Participating skills \nin workplace \nmeetings and \ndiscussions \n2.2 Following simple \nspoken language \n2.3 Completing work \nrelated documents \n2.4 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n2.5 Relating to people \nof social range in \nthe workplace \n2.6 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements \n3. Complete \nrelevant work \nrelated \ndocuments \n3.1 Range of forms relating \nto conditions of \nemployment are \ncompleted accurately \nand legibly \n3.2 Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3 Basic mathematical \nprocesses are used for \nroutine calculations \n3.4 Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon \n3.5 Reporting requirements \nto supervisor are \ncompleted according to \norganizational guidelines\n3.1 Methods of \nmaking/completing \nwork related \ndocuments \n3.2 Company \nstandards and \nprocedures in \nmaking work \nrelated documents \n3.3 Effective \ncommunication \n3.4 Different modes of \ncommunication  \n3.5 Written \ncommunication \n3.6 Organizational \npolicies \n3.7 Communication \nprocedures and \nsystems \n3.8 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n3.1 Documenting skills  \n3.2 Report writing \nskills \n3.3 Making/developing \nwork related \ndocuments \n3.4 Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n3.5 Completing work \nrelated documents \n3.6 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n3.7 Ability to relate to \npeople of social \nrange in the \nworkplace\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -4- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n \n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6. \nFace to face communication \n \n3. Storage \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n \n4. Forms \nPersonnel forms, telephone message forms, safety reports \n \n5. Workplace \ninteractions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, instruction and forms, \nnon-verbal including gestures, signals, signs and diagrams \n \n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -5- \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard format  \nof the organization \n1.2. Accessed information using communication equipment \n1.3. Made use of relevant terms as an aid to transfer information \neffectively \n1.4. Conveyed information effectively adopting the formal or \ninformal communication \n \n2. Resource Implications \nThe following resources should be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Writing materials \n2.4. Internet \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Direct Observation \n3.2. Oral interview and written test \n \n4. Context for \nAssessment \nCompetency may be assessed individually in the actual workplace \nor through accredited institution\n",
