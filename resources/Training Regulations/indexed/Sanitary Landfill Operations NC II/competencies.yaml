        "source_text": "--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n10- \nUNIT OF COMPETENCY   : PRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE \n: 500311107 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes in \npromoting career growth and advancement. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Integrate \npersonal \nobjectives with \norganizational \ngoals \n1.1 Personal growth and \nwork plans are pursued \ntowards improving the \nqualifications set for the \nprofession \n1.2 Intra- and interpersonal \nrelationships are \nmaintained in the course \nof managing oneself \nbased on performance \nevaluation \n1.3 Commitment to the \norganization and its goal \nis demonstrated in the \nperformance of duties  \n \n1.1 Work values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n1.2 Company policies \n1.3 Company \noperations, \nprocedures and \nstandards  \n1.4 Company \nmission/vision \nstatements \n1.5 Ways of \nintegrating \npersonal \nobjectives with \norganizational \ngoals \n \n1.1  Integrating skills \nof personal \nobjectives with \norganizational \ngoals \n1.2 Pursuing personal \ngrowth and work \nplans \n1.3 Demonstrating \ncommitment to the \norganization and \nits goals \n1.4 Intra and \nInterpersonal skills \n \n2. Set and meet \nwork priorities \n2.1 Competing demands are \nprioritized to achieve \npersonal, team and \norganizational goals and \nobjectives. \n2.2 Resources are utilized \nefficiently and effectively \nto manage work \npriorities and \ncommitments \n2.3 Practices along \neconomic use and \nmaintenance of \nequipment and facilities \nare followed  as per \nestablished procedures \n2.1 Company policies \n2.2 procedures and \nstandards  \n2.3 Company and \ndepartmental goals \nand priorities  \n2.4 Managing priorities \nand commitments \n2.5 Economic use and \nmaintenance of \nequipment and \nfacilities \n2.6 Ways and means \nof practicing \neconomic use and \nmaintenance of \nequipment and \nfacilities \n \n2.1 Setting skills of \nwork priorities \n2.2 Meeting with work \npriorities \n2.3 Intra and \nInterpersonal skills \n2.4 Communication \nskills\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n11- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. \nMaintain \nprofessional \ngrowth and \ndevelopment \n3.1 Trainings and career \nopportunities are \nidentified and availed of \nbased on job \nrequirements \n3.2 Recognitions are \nsought/received and \ndemonstrated as proof \nof career advancement \n3.3 Licenses and/or \ncertifications relevant \nto job and career are \nobtained and renewed \n \n3.1 Ways of identifying \ntrainings and \ncareer \nopportunities \n3.2 Techniques of \nseeking and \nreceiving \nrecognitions \n3.3 Procedures of \nobtaining licenses \nand/or \ncertifications \nrelevant to the job \n \n \n3.1 Identifying \ntrainings and \ncareer \nopportunities \n3.2 Seeking  \nrecognitions are  \nsought/received \nand demonstrated \nas proof of career \nadvancement \n3.3 Obtaining and \nrenewing Licenses \nand/or \ncertifications \nrelevant to job and \ncareer\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n12- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1 Performance Appraisal \n1.2 Psychological Profile \n1.3 Aptitude Tests \n \n2.  Resources \n2.1 Human \n2.2 Financial \n2.3 Technology \n2.3.1  Hardware \n2.3.2 Software \n \n3.  Trainings and career \nopportunities \n3.1  Participation in training programs \n      3.1.1 Technical \n      3.1.2  Supervisory \n      3.1.3  Managerial \n      3.1.4  Continuing Education \n3.2  Serving as Resource Persons in conferences and workshops \n \n4.  Recognitions \n4.1  Recommendations \n4.2  Citations \n4.3  Certificate of Appreciations \n \nCommendations \n4.6 \nAwards \n4.7 \nTangible and Intangible Rewards \n \n5.  Licenses and/or \ncertifications \n5.1 \nNational Certificates \n5.2 \nCertificate of Competency \n5.3 \nSupport Level Licenses \n5.4 \nProfessional Licenses\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \n \nTR- SANITARY LANDFILL OPERATIONS NC II  (NEW)           Promulgated Dec. 16, 2015                             -\n13- \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 \nCompleted trainings and career opportunities which are \nbased on the requirements of the industries \n1.4 \nAcquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n \n2.  Resource Implications \nThe following resources should be provided: \n2.1  Workplace or assessment location \n2.2  Case studies/scenarios \n \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1  Portfolio Assessment \n3.2  Interview \n3.3   Simulation/Role-plays \n3.4   Observation \n3.5   Third Party Reports \n3.6   Exams and Tests \n \n4.  Context for \nAssessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting\n",
