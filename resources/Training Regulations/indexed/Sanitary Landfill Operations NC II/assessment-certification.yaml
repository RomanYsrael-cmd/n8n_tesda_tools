  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the Training\nRegulations for SANITARY LANDFILL OPERATIONS NC II as follows:\n\nBASIC COMPETENCIES\nParticipate in workplace communication\nWork in team environment\nPractice career professionalism\nPractice occupational health and safety procedures\nCOMMON COMPETENCIES\nDevelop and update industry knowledge\nPerform workplace security and safety practices\nMaintain environmental health and awareness in the\nwork place\nCORE COMPETENCIES\nDirect dumping/disposal of in-coming waste in the\nactive cell\nDirect post-dumping activities\n\n4.1.2 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.1.3 The following are qualified to apply for assessment and certification:\n\n- Graduates of training programs related to waste management\n- Experienced workers in sanitary landfill facilities\n\n4.1.4 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.1.5 A candidate who fails the assessment for two (2) consecutive times will be\nrequired to go through a refresher course before taking another assessment.\n\n--- PDF PAGE 71 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -66-\n\n4.1.6 Only certified individuals in this Qualification may be nominated by the industry\nsector for accreditation as competency assessor.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 72 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -67-\n\nANNEX A - COMPETENCY MAP\nSANITARY LANDFILL OPERATIONS NC II\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace\ncommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in workplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialist\ncommunication skills\nDevelop team and\nIndividuals\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize Work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nDevelop and update\nindustry knowledge\nPerform workplace\nsecurity and safety\npractices\nMaintain environmental\nhealth and awareness in\nthe work place\n\nCORE COMPETENCIES\n\n Direct\ndumping/disposal of in-\ncoming waste in the\nactive cell\nPerformt post-\ndumping activities\n\n--- PDF PAGE 73 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -68-\n\nDEFINITION OF COMMON TERMS\n\n1. Agricultural waste shall refer to waste generated from planting or harvesting of crops,\ntrimming or pruning of plants and wastes or run-off materials from farms or fields;\n\n2. Bulky wastes shall refer to waste materials which cannot be appropriately placed in\nseparate containers because of either its bulky size, shape or other physical attributes.\nThese include large worn-out or broken household, commercial, and industrial items\nsuch as furniture, lamps, bookcases, filing cabinets, and other similar items;\n\n3. Buy-back center shall refer to a recycling center that purchases or otherwise accepts\nrecyclable materials from the public for the purpose of recycling such materials;\n\n4. Collection shall refer to the act of removing solid waste from the source or from a\ncommunal storage point;\n\n5. Composting shall refer to the controlled decomposition of organic matter by micro-\norganisms, mainly bacteria and fungi, into a humus-like product;\n\n6. Consumer electronics shall refer to special waste that includes worn-out, broken, and\nother discarded items such as radios, stereos, and TV sets;\n\n7. Controlled dump shall refer to a disposal site at which solid waste is deposited in\naccordance with the minimum prescribed standards of site operation;\n\n8. Department shall refer to the Department of Environment and Natural Resources;\n\n9. Disposal shall refer to the discharge, deposit, dumping, spilling, leaking or placing of any\nsolid waste into or in a land;\n\n10. Disposal site shall refer to a site where solid waste is finally discharged and deposited;\n\n11. Ecological solid waste management shall refer to the systematic administration of\nactivities which provide for segregation at source, segregated transportation, storage,\ntransfer, processing, treatment, and disposal of solid waste and all other waste\nmanagement activities which do not harm the environment;\n\n12. Environmentally acceptable shall refer to the quality of being re-usable, biodegradable\nor compostable, recyclable and not toxic or hazardous to the environment;\n\n13. Generation shall refer to the act or process of producing solid waste;\n\n14. Generator shall refer to a person, natural or juridical, who last uses a material and\nmakes it available for disposal or recycling;\n\n15. Hazardous waste shall refer to solid waste management or combination of solid waste\nwhich because of its quantity, concentration or physical, chemical or infectious\ncharacteristics may:\n\n--- PDF PAGE 74 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -69-\n(1) cause, or significantly contribute to an increase in mortality or an increase in serious\nirreversible, or incapacitating reversible, illness; or\n(2) pose a substantial present or potential hazard to human health or the environment when\nimproperly treated, stored, transported, or disposed of, or otherwise managed;\n\n16. Leachate shall refer to the liquid produced when waste undergo decomposition, and\nwhen water percolate through solid waste undergoing decomposition. It is contaminated\nliquid that contains dissolved and suspended materials;\n\n17. Materials recovery facility - includes a solid waste transfer station or sorting station,\ndrop-off center, a composting facility, and a recycling facility;\n\n18. Municipal waste shall refer to wastes produced from activities within local government\nunits which include a combination of domestic, commercial, institutional and industrial\nwastes and street litters;\n\n19. Open dump shall refer to a disposal area wherein the solid wastes are indiscriminately\nthrown or disposed of without due planning and consideration for environmental and\nHealth standards;\n\n20. Opportunity to recycle shall refer to the act of providing a place for collecting source-\nseparated recyclable material, located either at a disposal site or at another location\nmore convenient to the population being served, and collection at least once a month of\nsource-separated recyclable material from collection service customers and to providing\na public education and promotion program that gives notice to each person of the\nopportunity to recycle and encourage source separation of recyclable material;\n\n21. Person(s) shall refer to any being, natural or judicial, susceptible of rights and\nobligations, or of being the subject of legal relations;\n\n22. Post-consumer material shall refer only to those materials or products generated by a\nbusiness or consumer which have served their intended end use, and which have been\nseparated or diverted from solid waste for the purpose of being collected, processed and\nused as a raw material in the manufacturing of recycled product, excluding materials and\nby-products generated from, and by-products generated from, and commonly used within\nan original manufacturing process, such as mill scrap;\n\n23. Receptacles shall refer to individual containers used for the source separation and the\ncollection of recyclable materials;\n\n24. Recovered material shall refer to material and by products that have been recovered or\ndiverted from solid waste for the purpose of being collected, processed and used as a\nraw material in the manufacture of a recycled product;\n\n25. Recyclable material shall refer to any waste material retrieved from the waste stream\nand free from contamination that can still be converted into suitable beneficial use or for\nother purposes, including, but not limited to, newspaper, ferrous scrap metal, non-ferrous\nscrap metal, used oil, corrugated cardboard, aluminum, glass, office paper, tin cans and\nother materials as may be determined by the Commission;\n\n--- PDF PAGE 75 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -70-\n26. Recycled material shall refer to post-consumer material that has been recycled and\nreturned to the economy;\n\n27. Recycling shall refer to the treating of used or waste materials through a process of\nmaking them suitable for beneficial use and for other purposes, and includes any\nprocess by which solid waste materials are transformed into new products in such a\nmanner that the original product may lose their identity, and which maybe used as raw\nmaterials for the production of other goods or services: Provided, That the collection,\nsegregation and re-use of previously used packaging material shall be deemed recycling\nunder this Act;\n\n28. Resource conversation shall refer to the reduction of the amount of solid waste that are\ngenerated or the reduction of overall resource consumption, and utilization of recovered\nresources;\n\n29. Resources recovery shall refer to the collection, extraction or recovery of recyclable\nmaterials from the waste stream for the purpose of recycling, generating energy or\nproducing a product suitable for beneficial use: Provided, That such resource recovery\nfacilities exclude incineration;\n\n30. Re-use shall refer to the process of recovering materials intended for the same or\ndifferent purpose without the alteration of physical and chemical characteristics;\n\n31. Sanitary landfill shall refer to a waste disposal site designed, constructed, operated and\nmaintained in a manner that exerts engineering control over significant potential\nenvironment impacts arising from the development and operation of the facility;\n\n32. Schedule of Compliance shall refer to an enforceable sequence of actions or\noperations to be accomplished within a stipulated time frame leading to compliance with\na limitation, prohibition or standard set forth in this Act or any rule of regulation issued\npursuant thereto;\n\n33. Secretary landfill shall refer to the Secretary of the Department of Environment and\nNatural Resources;\n\n34. Segregation shall refer to a solid waste management practice of separating different\nmaterials found in solid waste in order to promote recycling and re-use of resources and\nto reduce the volume of waste for collection and disposal;\n\n35. Segregation at source shall refer to a solid waste management practice of separating,\nat the point of origin, different materials found in solid waste in order to promote recycling\nand re-use of resources and to reduce the volume of waste for collection and disposal;\n\n36. Solid waste shall refer to all discarded household, commercial waste, non-hazardous\ninstitutional and industrial waste, street sweepings, construction debris, agricultural\nwaste, and other non-hazardous/non-toxic solid waste.\n\nUnless specifically noted otherwise, the term “solid waste” as used in this Act shall not\ninclude:\n(1) Waste identified or listed as hazardous waste of a solid, liquid, contained gaseous or\nsemisolid form which may cause or contribute to an increase in mortality or in serious\n\n--- PDF PAGE 76 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -71-\nor incapacitating reversible illness, or acute/chronic effect on the health of persons\nand other organisms;\n(2) Infectious waste from hospitals such as equipment, instruments, utensils, and fomites\nof a disposable nature from patients who are suspected to have or have been\ndiagnosed as having communicable diseases and must therefore be isolated as\nrequired by public health agencies, laboratory wastes such as pathological\nspecimens (i.e. all tissues, specimens of blood elements, excreta, and secretions\nobtained from patients or laboratory animals) and disposable fomites that may harbor\nor transmit pathogenic organisms, and surgical operating room pathologic materials\nfrom outpatient areas and emergency rooms; and\n(3) Waste resulting from mining activities, including contaminated soil and debris.\n\n37. Solid waste management shall refer to the discipline associated with the control of\ngeneration, storage, collection, transfer and transport, processing, and disposal of solid\nwastes in a manner that is in accord with the best principles of public health, economics,\nengineering, conservation, aesthetics, and other environmental considerations, and that is\nalso responsive to public attitudes;\n\n38. Solid waste management facility shall refer to any resource recovery system or\ncomponent thereof; any system, program, or facility for resource conservation; any facility\nfor the collection, source separation, storage, transportation, transfer, processing,\ntreatment, or disposal of solid waste;\n\n39. Source reduction shall refer to the reduction of solid waste before it enters the solid\nwaste stream by methods such as product design, materials substitution, materials re-use\nand packaging restrictions;\n\n40. Source separation shall refer to the sorting of solid waste into some or all of its\ncomponent parts at the point of generation;\n\n41. Special wastes shall refer to household hazardous wastes such as paints, thinners,\nhousehold batteries, lead-acid batteries, spray canisters and the like. These include\nwastes from residential and commercial sources that comprise of bulky wastes, consumer\nelectronics, white goods, yard wastes that are collected separately, batteries, oil, and\ntires. These wastes are usually handled separately from other residential and commercial\nwastes;\n\n42. Storage shall refer to the interim containment of solid wastes after generation and prior\nto collection for ultimate recovery or disposal;\n\n43. Transfer stations shall refer to those facilities utilized to receive solid wastes,\ntemporarily store, separate, convert, or otherwise process the materials in the solid\nwastes, or to transfer the solid wastes directly from smaller to larger vehicles for transport.\nThis term does not include any of the following:\n\n(1) a facility whose principal function is to receive, store, separate, convert or otherwise\nprocess in accordance with national minimum standards, manure;\n(2) a facility, whose principal function is to receive, store, convert, or otherwise process\nwastes which have already been separated for re-use and are intended for disposals,\nand\n\n--- PDF PAGE 77 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -72-\n(3) the operations premises of a duly licensed solid waste handling operator who\nreceives, stores, transfers, or otherwise processes wastes as an activity incidental to\nthe conduct of a refuse collection and disposal business.\n44. Waste diversion shall refer to activities which reduce or eliminate the amount of solid\nwaste from waste disposal facilities;\n\n45. White goods shall refer to large worn-out or broken household, commercial, and\nindustrial appliances such as stoves, refrigerators, dishwashers, and clothes washers\nand dryers collected separately. White goods are usually dismantled for the recovery of\nspecific materials (e.g., copper, aluminum, etc.);\n\n46. Yard waste shall refer to wood, small or chipped branches, leaves, grass clippings,\ngarden debris, vegetable residue that is recognized as part of a plant or vegetable and\nother materials identified by the Commission.\n\n--- PDF PAGE 78 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -73-\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who rendered their time and expertise to the development and\nvalidation of these Training Regulations.\nINITIATOR:\n\nTECHNICAL EXPERTS:\nOTHER EXPERTS:\n\nENGR. ELIGIO ILDEFONSO\nRegulatory Requirements\nMS. JULIET MANLAPAZ\nRegulatory requirements\nMR. RUPERTO C. AJON\nTraining Regulations\nMS. RAQUEL REYES\nRegulatory Requirements\nMR. CESAR V. TUAZON\nTraining Regulations\n\nMEMBERS OF THE TESDA BOARD\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQSO\n•\nTESDA Regional Office\n MS. LIZETTE C. CARDENAS\n Solid Waste Management Association of the Philippines\n7- A South J. Brgy. Sacred Heart, Quezon City\n\nENGR. ABRAHAM Q. GENUINO\nSLF CONSTRUCTION & OPERATIONS\nMR. CELSO JUCUTAN\nSLF OPERATIONS\nMR. JUNE LACABA\nSLF SUPERVISION\nBEST Incorporated\nMorong, Rizal\nENGR. MARVIN MARQUEZ\nSLF OPERATIONS\nENGR. ZALDY NEBRES\nSLF OPERATIONS\nENGR. LOUIE SABATER\nSLF OPERATIONS\nENGR. CALEB TAPNIO\nSLF OPERATIONS\nIPM Construction and Dev’t Corporation\nRm 804 Ortigas Bldg., Ortigas, Pasig City\nENGR. REMBERTO G. TOLEDANO\nSLF OPERATIONS\nBEST Incorporated\nMorong, Rizal\nMS. JOANNA M. PASCUAL\nHAZCHEM\nBrgy. Makiling, Calamba City\nMR. ELMER F. PAGKALIWANGAN\nSLF Operations\nPhilippine Ecology Systems Corp.\n136 Malakas St., Quezon City\nMR. RONEL PASCUAL\nSLF Operations\nPhilippine Ecology Systems Corp.\n136 Malakas St., Quezon City\n\n--- PDF PAGE 79 ---"
