  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the Training\nRegulations for SANITARY LANDFILL OPERATIONS NC II as follows:\n\nBASIC COMPETENCIES\nParticipate in workplace communication\nWork in team environment\nPractice career professionalism\nPractice occupational health and safety procedures\nCOMMON COMPETENCIES\nDevelop and update industry knowledge\nPerform workplace security and safety practices\nMaintain environmental health and awareness in the\nwork place\nCORE COMPETENCIES\nDirect dumping/disposal of in-coming waste in the\nactive cell\nDirect post-dumping activities\n\n4.1.2 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.1.3 The following are qualified to apply for assessment and certification:\n\n- Graduates of training programs related to waste management\n- Experienced workers in sanitary landfill facilities\n\n4.1.4 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.1.5 A candidate who fails the assessment for two (2) consecutive times will be\nrequired to go through a refresher course before taking another assessment.\n\n--- PDF PAGE 71 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -66-\n\n4.1.6 Only certified individuals in this Qualification may be nominated by the industry\nsector for accreditation as competency assessor.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 72 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -67-\n\n"
