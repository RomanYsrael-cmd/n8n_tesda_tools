formation to improve\njob performance\n\n•\nLecture\n\n• Written examination\n\n1.2. Access, apply\nand share\nindustry\ninformation\n• Apply relevant updated\ngeneral knowledge of:\no Latest job requirement in\nthe industry\n•\nDemonstration\n• Observation\n4 hrs.\n\n• Video presentation on\nindustry career updates\n•\nVideo viewing\n• Oral evaluation\n\n• Apply updated knowledge to\nimprove job performance\n•\nDemonstration\n• Observation\n\n--- PDF PAGE 59 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -54-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Conduct regular session\nwith co-workers on day-to-\nday activities\n• Group\nDiscussion\n• Oral evaluation\n\n• Coordinate interview/\nresearch with industry\n•\nIndividual/\ngroup\nassignment\n•\n\n1.3. Update\ncontinuously\nrelevant\nindustry\nknowledge\n\n• Conduct regular re-echo\nsession with co-workers on\nlatest industry technology\nseminars attended\n• Group\nDiscussion\n• Oral evaluation\n4 hrs\n2. Perform\nworkplace\nsecurity and\nsafety\nprocedures\n2.1 Perform\nworkplace\nhealth, safety\nand security\npractices\n• Describe Company policies\n•\nGroup\nDiscussion\n\n• Oral evaluation\n8 hrs\n\n• Read:\no Proper health, safety and\nsecurity procedures\n\no Breaches of health,\nsafety and security\nprocedures\n• Lecture\n• Written Test\n\n• Video presentation on\nhealth, safety and security\nprocedures\n•\nVideo viewing\n• Oral evaluation\n\n• Identify Types of dangerous\nprocedures\n• Lecture\n• Written Test\n\n--- PDF PAGE 60 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -55-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n2.2 Deal with\nemergency\nsituations\n• Describe Company policies\n•\nGroup\nDiscussion\n\n• Oral evaluation\n8 hrs\n\n• Video presentation on\nResponding to emergency\nsituations\n•\nVideo viewing\n• Oral evaluation\n\n• Read:\no Emergency situations\no Emergency procedures\n• Lecture\n• Written Test\n\n3. Maintain\nenvironment\nal health and\nawareness\n\n3.1 Identifying\nenvironmental\nrisks and\nhazards in the\nwork place\n• Identify:\no Types of breaches of\nhealth, safety and\noperational procedures\no Types of wastes, their\ncharacteristics and their\neffect on the environment\no Environmental risks and\nhazards in the work place\n• Lecture\n• Written Test\n\n• Follow waste collection and\nhauling procedures\n• Demonstration\n• Observation\n\n• Read:\no Reasons for the\ncorrect/Proper use of\nPPEs\n• Lecture\n• Written Test\n\n--- PDF PAGE 61 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -56-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n3.2 Formulate\nmitigation\nmeasures to\neliminate\nenvironmental\nrisks and\nhazards in the\nwork place\n• Identify environmental risks\nand hazards in the work\nplace\n\n• Lecture\n• Written examination\n\n• Demonstrate formulating\nmitigation measures to\neliminate environmental\nrisks and hazards in the\nwork place\n•\nDemonstration\n•\nRole Play\n• Observation\n\n3.3 Implement\nmitigation\nmeasures to\neliminate\nenvironmental\nrisks and\nhazards in the\nwork place\n• Read environmental risks\nand hazards in the work\nplace\n• Lecture\n• Written examination\n\n• Follow workplace activities\nto implement mitigation\nmeasures to eliminate\nenvironmental risks and\nhazards\n•\nDemonstration\n•\nRole Play\n• Observation\n\n--- PDF PAGE 62 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -57-\nCORE COMPETENCIES\n(40 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Direct\ndumping/dis\nposal of in-\ncoming\nwaste in the\nactive cell\n1.1. Check road\naccess to\nactive cell\n• Describe\no\nEnvironmental laws\nand ordinances\no\nGovernment and other\ncontrol-regulating\nagency policies and\nrestrictions\n• Group\ndiscussion\n• Oral evaluation\n12 hrs.\n\n•\nRead\no\nManual of Operations of\nthe Sanitary Landfill\nFacility\no\nWaste characteristics,\nhandling and\nmanagement\no\nEffects of waste in\ncontributing to\nenvironmental pollution\nand degradation\n• Lecture\n• Written examination\n\n1.2. Check\nmanifests\n• Describe Understanding\nData Manifest\n• Group\ndiscussion\n• Oral evaluation\n4 hrs.\n\n• Conduct exercise on\ndeveloping data manifest\n• Demonstration\n• Observation\n\n--- PDF PAGE 63 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -58-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Identify\no\nDifferent Codes and\nregulations pertaining\nsolid waste\no\nCorrective Actions\n• Lecture\n• Written examination\n\n• Apply coordinating skills in\nthe different activities in the\nworkplace\n• Demonstration\n• Observation\n\n• Report Procedures and\nstrategy\n•\nDemonstration\n•\nRole Play\n• Observation\n\n• Apply Corrective Actions of\nactual waste\n\n1.3. Implement\nwaste\ndisposal\nsystem in\nactive cell\n• Read\no Different local\nordinances in relation to\nDisposal of Waste to\nCell\no OSH in Waste Disposal\no The role of the Spotter\nin relation to waste\ndisposal\n• Lecture\n• Written examination\n8 hrs.\n\n• Identify Different types of\ndisposal procedures and\nstrategy in accordance with\nSLF Manual\n• Lecture\n• Written examination\n\n• Apply different waste\ndisposal procedures at the\nwork site\n•\nDemonstration\n• Observation\n\n--- PDF PAGE 64 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -59-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Use checklist in monitor\nwaste disposal\n•\nDemonstration\n• Observation\n\n• Report procedures and\nstrategy\n•\nDemonstration\n• Observation\n\n• Practice\no different roles of spotter\no protocol in waste\ndisposal area\n•\nDemonstration\n•\nRole Play\n• Observation\n\n• Observe OSH in relation to\nwaste disposal\n•\nDemonstration\n• Observation\n\n2. Direct post\ndumping\nactivities\n2.1\nDirect the\npushing,\nspreading\nand\ncompacting\nof disposed\nwaste and\nre-profiling of\nslope\n• Describe\no Inspection and\nmonitoring dump sites\nand slope\no The role of equipment\noperator in the dump\nsite\n• Group\ndiscussion\n• Oral evaluation\n8 hrs.\n\n• Read Procedures in\nchecking dump site\n• Lecture\n• Written examination\n\n• Identify different strategies\nin:\no Pushing, spreading,\ncompacting waste\no Profiling of the slope\n• Lecture\n• Written examination\n\n• Use checklist in checking,\ninspecting and monitoring\ndump site\n•\nDemonstration\n• Observation\n\n--- PDF PAGE 65 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -60-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Follow procedures in\noverseeing, pushing,\nspreading and compacting\nof waste in dump site\n•\nDemonstration\n• Observation\n\n• Apply the different waste\ndisposal procedures in\ndump site\n•\nDemonstration\n• Observation\n\n• Practice operating\nequipment in the dump site\n•\nDemonstration\n• Observation\n\n2.2\nAssist in\nmonitoring of\nleachate\ncondition\n• Describe\no\nTheory and principle\ninvolved in leachate\no\nTheory and concept\ninvolved in performing\nwater and leachate\nsampling\n• Group\ndiscussion\n• Oral evaluation\n8 hrs.\n\n• Read Manuals of operation\nof water sampling and\nLeachate\n• Lecture\n• Written examination\n\n• Monitor condition of the\nleachate facilities\n• Demonstration\n• Observation\n\n• Demonstrate water\nsampling\n• Demonstration\n• Observation\n\n--- PDF PAGE 66 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -61-\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as laboratory\nor field-work components.\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain both\nin-school and in-industry training or fieldwork components. Details can be referred\nto the Implementing Rules and Regulations of the DTS Law and the TESDA\nGuidelines on the DTP;\n\n--- PDF PAGE 67 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -62-\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should possess\nthe following requirements:\n\n• Able to read and write\n• Not physically impaired for the course\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school or training center delivering the TVET program\n\n--- PDF PAGE 68 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -63-\n\n3.4 LIST OF TOOL, EQUIPMENT AND MATERIALS\nSANITARY LANDFILL OPERATIONS NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum\nof 25 trainees for SANITARY LANDFILL OPERATIONS NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25\nDust Mask\n\n25\nFolders\n15\nRubber Boots\n1 unit\nFire Extinguishers\n5\nMarking Pens\n15\nHardhats\n1\nLaptop\n2\nWhite\nBoards/Blackboard\n25\nCotton Gloves\nlinings\n1\nProjector Screen\n3\nWhiteboard\nMarkers/Chalk\n15\nSafety Goggles\n1\nMultimedia Equipment\n2\nWhiteboard\nErasers/Blackboar\nd Erasers\n15\nReflectorized Vest\n1\nSound System\n5\nMarking Pens\n\n1 set\nComputer hardware +\nsoftware\n25\nBallpens\n\n1 set\nTable top working\nmodel of an SLF\nthat demonstrates\nactual movement\nof miniature eqpt,\nwaste and waste\nproduct\n\n1 set\nWaste Character\ngallery\n\n1 set\nMaterials gallery\nfor SLF\nconstruction\n\nTraining Materials:\n\n• Republic Act 9003 –\nEcological Solid Waste\nManagement Act of\n2000\n• Republic Act 6969 –\nToxic and Hazardous\nWaste\n• RA 8749 Clean Air Act\n• RA 9275 Clean Water\nAct\n• EIA EO\n• PD 1586\n• WACS Training\nModules\n\n--- PDF PAGE 69 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -64-\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n\n•\nSLF Operations\nManual\n•\nEnvironmental\nCompliance\nCertificate\n\n•\n Handouts/ Popsheets\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nLecture Area\n8 x 5 m\n40 sq meter\n40 sq meter\nLearning Resource Area\n8x5 m\n40 sq. meter\n40 sq meter\nFacilities/Equipment/Circulation\nArea\n\n30 sq. meter\nSLF(own or access to)\nCategory 3\n(min)\n(per DENR\napproved design)\n(per DENR\napproved design)\n\nTotal workshop\narea\n110 ++sq. meter\nLecture Area\n8 x 5 m\n40 sq meter\n40 sq meter\n\n**The training center has the option to partner with an SLF facility with ECC.\n\n3.6 TRAINER’S QUALIFICATIONS FOR SANITARY LANDFILL OPERATIONS NC II\n\nTRAINER QUALIFICATION\n•\nHolder of NTTC Level I in Sanitary Landfill Operations NC II\n•\nMust be able to communicate in English and Filipino/vernacular;\n•\nMust have at least 5 years relevant SLF industry experience; and\n•\nMust have attended relevant training and seminars on SLF operations.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for all units of competency.\n\n--- PDF PAGE 70 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -65-"
