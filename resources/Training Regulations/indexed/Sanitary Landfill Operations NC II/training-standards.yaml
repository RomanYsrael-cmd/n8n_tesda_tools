      "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for SANITARY LANDFILL OPERATIONS NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: SANITARY LANDFILL OPERATIONS\nNC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n44 Hours (Common Competencies)\n40 Hours (Core Competencies)\n\n 102 Hours\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Sanitary\nLandfill Operations (SLF) Spotter in accordance to industry standards. It covers the basic,\ncommon, and core competencies in managing in-coming waste in active cell.\n\nThe training center has the option to partner with an operational SLF in providing\nfacilities and equipment in the conduct of training and assessment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 51 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -46-\nBASIC COMPETENCIES\n(18Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Read:\no Effective communication\n•\nLecture\n• Written examination\n\no Written communication\n\no Communication procedures\nand systems\n\n• Identify:\no Different modes of\ncommunication\n\no Medium of communication\n\no Flow of communication\n\no Available technology\nrelevant to the enterprise\nand the individual’s work\nresponsibilities\n\n• Prepare different Types of\nquestion\n•\nDemonstration\n• Observation\n\n• Gather different sources of\ninformation\n\n• Apply storage system in\nestablishing workplace\ninformation\n\n• Demonstrate Telephone\ncourtesy\n\n--- PDF PAGE 52 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -47-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n• Describe Communication\nprocedures and systems\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\no Meeting protocols\n•\nLecture\n• Written examination\n\no Nature of workplace\nmeetings\n•\nLecture\n• Written examination\n\no Workplace interactions\n\no Barriers of communication\n\n• Complete work related\ndocuments\n•\nDemonstration\n• Observation\n\n• Read instructions on work\nrelated forms/documents\n•\nLecture\n• Written examination\n\n• Practice:\n\no Estimate, calculate and\nrecord routine workplace\nmeasures\n•\nDemonstration\n• Observation\n\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n\n• Demonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Perform workplace duties\nscenario following simple written\nnotices\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n\n--- PDF PAGE 53 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -48-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Identify the different Non-verbal\ncommunication\n•\nLecture\n• Written examination\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information\nin response to workplace\nrequirements\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Identify:\no types of workplace\ndocuments and forms\n•\nLecture\n• Written examination\n\no kinds of workplace report\n\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n\n• Read and follow instructions in\napplying basic mathematical\nconcepts\n\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information\nin response to workplace\nrequirements\n\n--- PDF PAGE 54 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -49-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility in\na team.\n• Describe the team role and\nscope\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Read\no Definition of Team\n•\nLecture\n• Written examination\n\no Difference between team\nand group\n\no Objectives and goals of\nteam\n\n• Identify different sources of\ninformation\n\n2.2 Describe work\nas a team\n• Describe team goals and\nobjectives\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Perform in setting team goals\nand expectations scenario\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Identify\no individual role and\nresponsibility\n•\nLecture\n• Written examination\n\n• Practice Interacting effectively\nwith others\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\no Fundamental rights at work\nincluding gender sensitivity\no Understanding individual\ncompetencies relative to\nteamwork\no Types of individuals\no Role of leaders\n•\nLecture\n• Written examination\n\n--- PDF PAGE 55 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -50-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives with\norganizational\ngoals\n• Describe performance\nevaluation\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hours\n• Read:\n•\nLecture\n• Written examination\n\no Work values and ethics\n(Code of Conduct, Code of\nEthics, etc.)\n\no Understanding personal\nobjectives\n\no Understanding organizational\ngoals\n\n• Demonstrate Intra and\nInterpersonal skills at work\n•\nDemonstration\n• Observation\n\n• Demonstrate personal\ncommitment in work\n\n3.2 Set and meet\nwork priorities\n• Describe company policies,\noperations, procedures and\nstandards\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\n•\nLecture\n• Written examination\n\no Time Management\n\no Basic strategic planning\nconcepts\n\no Resource utilization and\nmanagement\n\n• Apply managing goals and time\n•\nDemonstration\n• Observation\n\n• Practice:\no economic use of resources\nand facilities\n•\nDemonstration\n• Observation\n\n--- PDF PAGE 56 ---\nTR- SANITARY LANDFILL OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015 -51-\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\no time management\n\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Describe company recognition\nand incentives\n\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\n•\nLecture\n• Written examination\n\no Career development\nopportunities\n\no Information on relevant\nlicenses and or certifications\n\no personal career development\nneeds\n\n• Identify career opportunities\n\n• Determine personal career\ndevelopment needs\n•\nGroup\ndiscussion\n• Oral evaluation\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazard\nand risks\n• Describe OHS procedures,\npractices and regulations\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hours\n\n• Read\n•\nLecture\n• Written examination\n\no OHS indicators\n\no Organizational contingency\npractices\n\n• Practice hazards/risks