        "source_title": "Set-up multiple axis CNC lathe machine, workpiece and cutting tools",
        "source_text": "--- PDF PAGE 51 ---\nTR – CNC Lathe Machine Operation NC III  \n49 \n \nUNIT OF COMPETENCY: \nSet-up multiple axis CNC lathe machine, workpiece \nand cutting tools \n \nUNIT CODE: \nMEE821305 \n \nUNIT DESCRIPTOR: \nThis unit covers the knowledge and skills required to \n                                                 set-up machine with multiple-axis and cutting tools \n                                                 and driven tools, download program, set-up \n                                                 workpiece, dry-run program and perform trial cut on \n                                                 workpiece. \n \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1 \nSet-up machine with \nmultiple axis, cutting \ntools and driven tools \n1.1 \n \n1.2 \n \n1.3 \n1.4 \n \n1.5 \n \n \n1.6 \nOil and coolant is checked according to \nmanufacturer’s specification. \nAir and hydraulic pressure is checked according to \nmanufacturer’s specification. \nMachine zero point is set to the required position. \nCutting tools and driven tools are set according \nto required sequence of operations.  \nWork holding and clamping devices are \ntightened according to standard operating \nprocedures. \nTool set-up is performed according to standard \noperating procedures. \n \n2 \nDownload/ inputed \nprogram \n2.1 \n \n2.2 \n \n2.3 \nProgram is downloaded/ inputed to the machine \nusing appropriate devices. \nProgram is simulated to determine the correctness \nof the tool path and other work parameters. \nWorkpiece zero point is set to the required \nposition.\n3. \nSet-up workpiece \n3.1 \n \n \n \n3.2 \n \nWorkpiece is mounted and centered on clamping \ndevice to required level of accuracy using tools and \ninstruments in accordance with workplace \nprocedures. \nSet-up is performed in accordance with safety \nrequirements. \n4 \nDry-run program  \n4.1 \n \n4.2 \nDry run is performed in accordance with the \ndesired tool path movement. \nWhere necessary, program is edited according to \nrequired tool path movement.  \n5 \nPerform trial cut on \nworkpiece \n5.1 \n5.2 \n \n5.3 \nMachined workpiece as programmed. \nChecked and measured workpiece dimensions \nusing appropriate measuring instruments. \nWhere required, program is edited and tool \nparameters are corrected/ adjusted.\n\n--- PDF PAGE 52 ---\nTR – CNC Lathe Machine Operation NC III  \n50 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.   Cutting tools and driven \ntools \nCutting tools used in CNC lathe operations include: \n1.1   External and internal cutting tools \n1.2   Grooving tools \n1.3   Drills \n1.4   Taps \n1.5   End mill, start drill, twist drill used as driven tools  \n2.   Tool set-up \n2.1   Scratch method \n2.2   Tool-setting  device method \n3.   Workpiece \nWorkpiece materials used in turning operations: \n3.1   Ferrous metals \n3.2   Non-ferrous metals \n3.3   Non – metallic materials \n \n4.   Work holding and \nClamping device \nClamping device and lathe accessories include: \n4.1   Three jaw chuck  \n4.2   Collet chuck (optional) \n4.3   Live center  (optional) \n4.4   Lathe center \n4.5   T – wrench (optional) \n4.6   Spacers \n4.7   Open end wrench \n4.8   Allen wrench \n4.9   Bar feeder    \n4.10 Part catcher  \n5.   Instruments \n5.1   Tool pre - setting device (optional) \n5.2   Dial indicator \n5.3   Dial test indicator \n5.4   Gauges (go-no go, pitch, plug, radius, etc.) \n5.5   Coordinate measuring machine (CMM) (optional) \n5.6   Bevel protractor \n5.7   Profile projector \n5.8   Surface-texture tester \n5.9   Surface-finish comparator \n5.10 Steel rule\n\n--- PDF PAGE 53 ---\nTR – CNC Lathe Machine Operation NC III  \n51 \nEVIDENCE GUIDE \n1. \nCritical aspects \nof evidence  \nAssessment requires evidence that the candidate:   \n1.1  Performed machine set-up with multiple axis, and cutting \n       tools and driven tools \n1.2  Downloaded/ inputed program \n1.3  Performed workpiece set-up \n1.4 Performed program dry-run  \n1.5 Performed trial cut on workpiece \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1   Shop safety practices \n2.1.1   Safe working habits \n2.1.2   Identification of hazardous areas \n2.1.3   Protective clothing and devices \n2.1.4   Safe handling of tools, equipment and materials \n2.1.5   Housekeeping \n2.1.6   First-aid \n2.1.7   Fire extinguishers \n \n2.2   Measurements \n2.2.1   Linear measuring tools (vernier, micrometer) \n2.2.2   Angular measuring tools (Vernier bevel protractor) \n2.2.3   Geometrical tolerances measuring tools  \n(dial test  indicator, radius gauge, vernier height \ngauge, 2 pt. bore gauge, 3 pt. bore gauge) \n2.2.4   Surface finish measuring instrument \n3. \nUnderpinning \nskills \n3.1   Identification of cutting tools \n3.2   Use of measuring instruments \n3.3   Determining workpiece specifications \n3.4   Scratch methods for tool set-up \n3.5   Use of tool setter \n3.6   Application of bar feeder \n3.7   Use of profile projector (optional) \n4. \nResource \nimplications \nThe following resources must be provided: \n4.1   Tools, equipment and facilities appropriate for the processes \nor activities for the job requirements  \n4.2   Materials as specified in the drawing \n4.3   Drawings, sketches or blueprint \n5. \nMethod of \nassessment \nCompetency must be assessed through: \n5.1   direct observation \n5.2   demonstration \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
