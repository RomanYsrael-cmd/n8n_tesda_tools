        "source_text": "--- PDF PAGE 54 ---\nTR – CNC Lathe Machine Operation NC III  \n52 \nUNIT OF COMPETENCY :    \nPerform Advanced CNC Lathe Machine Operations \n \nUNIT CODE  \n \n:          MEE821306 \n \nUNIT DESCRIPTOR  \n:        This unit covers the skills required to perform complex \n                                                     CNC lathe machine operations involving the use of \n                                                     additional driven tools.  \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nTurn workpiece  \n1.1 \n \n1.2 \n \n \n1.3 \n \n1.4 \n \n1.5 \n \nWorkpiece is mounted or set in accordance with \nstandard operating procedures. \nComplex CNC Lathe operations are performed to \nproduce component according to drawing  \nspecification. \nCorrective measures/adjustments are performed \nif necessary. \nSafety procedures are observed during machining \noperation.using personal protective devices. \nPersonal protective devices are used in \naccordance with occupational health and safety \n(OHS) requirements. \n2. \nCheck, and measure \nworkpiece  \n2.1 \n \n \n2.2 \n \n \nWorkpiece is checked and measured in \nconformance to specification using appropriate \nmethods, measuring tools and equipment. \nDefective workpieces are marked, recorded and \nreported for proper action.  \n \n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1.  Complex CNC Lathe \n     Operations \nAdvanced lathe operations \n1.1 face turning \n1.2 longitudinal turning \n1.3 contour turning (circular, taper) \n1.4 cutting recess, shoulders, grooves, fillets and \nchamfers, drilling, boring \n1.5 thread cutting \n1.6 parting-off \n1.7 bar feeding \n \n2.   Corrective measures/ \n      adjustments \n2.1 Replacement of cutting tools \n2.2 Adjustment of tool offset \n2.3 Adjustment of cutting speed and feed rate \n \n3. Measuring tools \n3.1 Vernier caliper (Digital or read out) \n3.2 Micrometer (Digital or read out) \n3.3 Gages (thread, drill, surface comparator / roughness \ntester, radius, screw pitch, taper) \n3.4 Profile projector (optional) \n3.5 Hardness tester (optional)\n\n--- PDF PAGE 55 ---\nTR – CNC Lathe Machine Operation NC III  \n53 \nEVIDENCE GUIDE \n1. \nCritical aspects \nof evidence  \nAssessment requires evidence that the candidate:   \n1.1   Turned and millled workpiece \n1.2   Checked and measured workpiece \n \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1   Shop safety practices \n2.1.1   Safe working habits \n2.1.2   Identification of hazardous areas \n2.1.3   Protective clothing and devices \n2.1.4   Safe handling of tools, equipment and materials \n2.1.5   Housekeeping \n2.1.6   First-aid \n2.1.7   Fire extinguishers \n \n2.2   Drawing interpretation \n2.2.1   Standard drawing scales, symbols and abbreviations \n2.2.2   Orthographic and isometric drawings \n2.2.3   1st and 3rd angle projections \n2.2.4   Assembly and detail drawings \n2.2.5   Interpreting tolerances, limits and fits \n2.2.6   Surface finish \n \n2.3   Shop mathematics \n2.3.1   Basic arithmetic operations \n2.3.2   Fractions and decimals \n2.3.3   Percentages and ratios \n2.3.4   Conversion of units (English to metric) \n2.3.5   Trigonometric functions \n2.3.6   Pythagorean theorem \n \n2.4   Measurements \n2.4.1   Linear measuring tools (vernier, micrometer) \n2.4.2   Precision angular measuring tools  \n           (Vernier bevel protractor) \n2.4.3   Geometrical tolerances measuring tools  \n(dial test  indicator, radius gauge, vernier height \ngauge, 2 pt. bore gauge, 3 pt. bore gauge) \n2.4.4   Dial indicator \n \n \n2.5   Materials and related science \n2.5.1   Classification and mechanical properties of \nengineering materials \n \n2.6   CNC Lathe and milling machine operations  \n2.6.1   Lathe types and specifications \n2.6.2   Lathe parts and functions \n2.6.3   Setting cutting speed, rpm, feed rate \n2.6.4   Workholding and tool holding devices  \n2.6.5   Tool offset and tool geometry \n2.6.6   Tool set up in turning and milling operations \n2.6.7   Lathe accessories, fixtures and attachments  \n2.6.8   Milling machine accessories, fixtures and, \n           attachments and operation.\n\n--- PDF PAGE 56 ---\nTR – CNC Lathe Machine Operation NC III  \n54 \n \n3. \nUnderpinning \nskills \n3.1   Selection of cutting tools \n3.2   Use of measuring instruments \n3.3   Determining  workpiece specifications \n3.4   Computation of feed, cutting speed and machine rpm \n3.5   Application of G – codes and M – codes \n3.6   Application of bar feeder \n3.7   Using of profile projector (optional) \n4. \nResource \nimplications \nThe following resources must be provided: \n4.1   Tools, equipment and facilities appropriate to processes or \n        activities \n4.2   Materials relevant to the proposed activity \n4.3   Drawings, sketches or blueprint \n5. \nMethod of \nassessment \nCompetency must be assessed through: \n5.1   Direct observation with questioning \n5.2   Written exam \n5.3   Demonstration \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
