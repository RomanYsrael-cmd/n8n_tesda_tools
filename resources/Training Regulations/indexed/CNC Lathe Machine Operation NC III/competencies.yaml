 \n2.4.4  Milling operation processes  \n3. \nUnderpinning \nskills \n3.1   Selection of cutting tools \n3.2   Computation of feed, cutting speed and machine rpm \n3.3   Application of G – codes and M – codes \n3.4   Integration of bar feeder in the program \n4. \nResource \nimplications \nThe following resources must be provided \n4.1  Drawings, sketches or blueprint/materials \n4.2  Computers and simulation software’s \n5. \nMethod of \nassessment \nCompetency must be assessed through: \n5.1   direct observation with questioning \n5.2   written exam  \n5.3   demonstration (actual programming) \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
