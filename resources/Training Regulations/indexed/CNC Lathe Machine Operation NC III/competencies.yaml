  "source_section_text": "Section\n1. Successful candidates shall be awarded a National Certificate signed by\nthe TESDA Director General.\n4.2\nThe qualification of CNC Lathe Machine Operation NC III may be attained\nthrough:\n4.2.1.\nAccumulation of Certificates of Competency (COCs) in all the\nfollowing units of competencies:\n4.2.1.1 Write advanced CNC lathe machine program\n4.2.1.2 Set- up multiple-axis CNC lathe machine, workpiece and\n cutting tools\n4.2.1.3\nPerform advanced CNC lathe machine operations\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\n4.2.2\nDemonstration of competence through project-type assessment\ncovering all the units required in the qualification.\n\n4.3\nAccumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1.\nHolder of CNC lathe Machine Operation NC II or equivalent\nqualification; or\n\n4.5.2.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.5.3.\nExperienced workers (wage employed or self employed\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 67 ---\nTR – CNC Lathe Machine Operation NC III\n65\n\nSet-up CNC milling\nmachine, work- piece and\ncutting tools\nWrite basic CNC lathe\nmachine program\nPerform basic CNC lathe\nmachine operations\nCORE\nCOMPETENCIES\nCompetency Map\nMetals and Engineering Sector\nReceive and respond\nto workplac