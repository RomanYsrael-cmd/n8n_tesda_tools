    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: CNC LATHE MACHINE OPERATION NC Level: NC III\n\nTraining Duration: 24 Hours (Basic)\n 130 Hours (Common)\n\n 80 Hours (Core)\n 234 Hours\n\nCourse Description:\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nin CNC Lathe Machine Operation NC III.\nIt covers the competencies required to write advanced CNC lathe machine\nprogram, set-up machine with multiple axis, workpiece and cutting tools and\nperform advanced CNC lathe machine operations.\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n\n1.1 Communicate\n information about\n workplace processes\n1.2 Lead workplace\n discussions\n Identify and\n communicate issues\n arising in the\n workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n2. Lead small\nteams\n\n2.1 Provide team\nleadership\n2.2 Assign responsibilities\n2.3 Set performance\nexpectations for team\nmembers\n2.4 Supervised team\nperformance\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n--- PDF PAGE 58 ---\nTR – CNC Lathe Machine Operation NC III\n56\n\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Plan negotiations\n3.2 Participate in\n negotiations\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n4. Solve\nproblems\nrelated to work\nactivities\n\n4.1 Identify the problem\n4.2 Determine\n fundamental causes\n of the problem\n4.3 Determine corrective\n action\n4.4 Provide\n recommendation/s to\n manager\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n5. Use\nmathematical\nconcepts and\ntechniques\n\n5.1 Identify mathematical\n tools and techniques\n to solve problem\n5.2 Apply procedure /\n solution\n5.3 Analyze results\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n6. Use relevant\ntechnologies\n\n6.1 Study / select\nappropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain / enhance\nrelevant technology\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n questioning\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\n practices\n\n1.1 Identify hazards\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling\nof tools, equipment\nand materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecture\n• Group\n discussion\n• Interaction\n• Role playing /\n Simulation\n\n• Observation\n• Demonstration\n• Interview /\n Questioning\n\n2. Interpret\nworking\ndrawing and\nsketches\n\n2.1 Interpret technical\n drawing\n2.2 Prepare freehand\nsketch of parts\n2.3 Interpret details from\n freehand sketch\n• Lecture\n• Group\n discussion\n• Interaction\n\n• Observation\n• Interview /\n Questioning\n\n--- PDF PAGE 59 ---\nTR – CNC Lathe Machine Operation NC III\n57\n\n3. Select / cut\nworkshop\nmaterials\n\n3.1 Determine requirement\n3.2 Select and measure\n materials\n3.3 Cut materials\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n4. Perform shop\ncomputations\n(Basic)\n\n4.1 Perform four\nfundamentals\noperations\n4.2 Perform basic\ncalculations\n involving fractions and\n decimals\n4.3 Perform basic\ncalculations\n involving percentages\n4.4 Perform basic\ncalculation\n involving ration and\n proportion\n4.5 Perform calculations on\nalgebraic\n expressions\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n5. Measure\n workpiece\n (Basic)\n\n5.1 Select and use\nmeasuring tools\n5.2 Clean and store\nmeasuring tools\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\nQuestioning\n6. Perform\nroutine\nhousekeeping\n\n6.1 Organize work area\n6.2 Clean Work area\n\n• Lecture\n• Group\n discussion\n• Simulation\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n7. Perform Shop\ncomputations\n(Intermediate)\n\n7.1 Perform calculations\n involving triangles\n7.2 Calculate taper\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n8. Measure\nworkpiece\nusing angular\nmeasuring\ninstruments\n\n8.1 Select and use angular\n measuring tools\n8.2 Maintain angular\nmeasuring tools\n8.3 Clean and store\nmeasuring\nTools\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 60 ---\nTR – CNC Lathe Machine Operation NC III\n58\n\n9. Perform shop\n Computation\n (Advanced)\n\n9.1 Calculate gear ratio\n9.2 Solve indexing\nproblems\n9.3 Solve gearing\nproblems\n9.4 Use geometrical\nprinciples in the\nsolution of problems\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n10. Measure\nworkpiece\n using gages\n and\n surface\n texture\n comparator\n10.1 Select and use fixed\nand adjustable gages\n10.2 Perform surface\ntexture measurements\n10.3 Clean and store\nmeasuring tools\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n11. Perform\npreventive\n and\n corrective\n maintenance\n11.1 Perform inspection of\n machine\n11.2 Perform cleaning and\n lubricating of machine\n11.3 Perform minor\n machine repair and\n adjustments\n11.4 Maintain hand tools\n• Lecture\n• Demonstration\n• Group\n discussion\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n12. Prepare cost\nestimate\n\n12.1 Determine customer\n requirements\n12.2 Estimate cost\n components\n12.3 Cost the job\n12.4 Verify and document\n costs\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n--- PDF PAGE 61 ---\nTR – CNC Lathe Machine Operation NC III\n59\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Write advanced\nCNC lathe\nmachine\nprogram\n1.1 Determine job\n requirements\n1.2 Write advanced CNC\n Lathe machine\n program\n1.3 Edit advanced CNC\n Lathe machine\n programs\n• Lecture\n• Group\nDiscussion/\ninteraction\n\n• Observation\n• Interview\n• Interview/\nQuestioning\n2. Set-up multiple-\naxis CNC lathe\nmachine,\nworkpiece and\ncutting tools\n2.1 Set-up machine with\n multiple axis, cutting\n tools and driven tools\n2.2 Download program\n2.3 Set-up workpiece\n2.4 Dry-run program\n2.5 Perform trial cut on\nworkpiece\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n3 Perform\nadvanced CNC\nlathe machine\n operations\n3.1 Turn workpiece\n3.2 Check and measure\nworkpiece\n\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n--- PDF PAGE 62 ---\nTR – CNC Lathe Machine Operation NC III\n60"
