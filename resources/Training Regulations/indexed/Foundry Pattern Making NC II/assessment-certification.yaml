      "number": "4.2",
      "text": "The qualification of Foundry Patternmaking NC II may be attained through. 4.2.1 Accumulation of Certificates of Competency (COCs) in all the following areas: 4.2.1.1 Manufacture Wood Pattern o Develop and manufacture wood patterns o Performs general woodworking machine operations o Use and maintain measuring instrument 4.2.1.2 Manufacture Polymer Patterns o Develop and manufacture polymer patterns o Use and maintain measuring instrument 4.2.1.3 Manufacture Plated Pattern o Develop and manufacture assembled plated patterns o Develop and manufacture production patterns o Use and maintain measuring instrument Successful candidates shall be awarded Certificates of Competency (COC) bearing the signature of the Regional Director and Chair of the recognized local industry body."
