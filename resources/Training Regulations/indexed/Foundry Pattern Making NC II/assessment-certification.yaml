  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.To attain the National Qualification of Foundry Patternmaking NC II, the candidate\nmust demonstrate competence in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2 The qualification of Foundry Patternmaking NC II may be attained through.\n\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the following\nareas:\n\n4.2.1.1 Manufacture Wood Pattern\no Develop and manufacture wood patterns\no Performs general woodworking machine operations\no Use and maintain measuring instrument\n\n4.2.1.2 Manufacture Polymer Patterns\no Develop and manufacture polymer patterns\no Use and maintain measuring instrument\n\n4.2.1.3 Manufacture Plated Pattern\no Develop and manufacture assembled plated patterns\no Develop and manufacture production patterns\no Use and maintain measuring instrument\n\nSuccessful candidates shall be awarded Certificates of Competency (COC)\nbearing the signature of the Regional Director and Chair of the recognized local\nindustry body.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n1.1.1 Graduates of formal, non-formal and informal including\nenterprise-based training programs.\n\n1.1.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\n\n--- PDF PAGE 57 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n55\n\n"
