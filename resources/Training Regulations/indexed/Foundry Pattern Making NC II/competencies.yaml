        "source_text": "ALT742304\n\nUNIT DESCRIPTOR: This unit covers developing pattern and\n manufacturing metal production patterns and core boxes.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirements\n\n1.1 Drawings, instructions and specifications are\n interpreted and understood.\n1.2 Pattern type and design is conceptualized and planned\nwith reference to customer's specification (written or\nverbal) for number, layout, runner system and core box\ndesign.\n1.3 Pattern design is interpreted and visualized from\ndrawings, prints or plans and checked against customer\nrequirements.\n1.4 A plan is developed for sequence of manufacture for\neither a high or low volume foundry production pattern.\n\n2. Manufacture\nproduction\npatterns and core\nboxes\n\n2.1 Appropriate materials are selected and obtained to\nmeet requirements of strength, durability and component\nfinish etc.\n2.2 Calculations appropriate to establishing pattern\nparameters are performed, including angles, tapers,\ncontraction, etc. where applicable.\n2.3 Appropriate machines and machining process are\nselected to shape/produce production patterns and core\nboxes to specification.\n2.4 A range of hand and hand held power tools are selected to\nfashion/manufacture production patterns and core boxes to\nspecification.\n2.5 Production patterns and core boxes are checked to\nspecification and surface finish and are checked for\nmoldability.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n38\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Appropriate\nmaterials\n1.1 Ferrous\n1.2 Non-ferrous\n1.3 Alloy materials\n\n2. Calculations\n\n2.1 The determination of contraction rates\n2.2 General engineering calculation such as:\n2.2.1 Volume\n2.2.2 Area\n2.2.3 Length\n2.2.4 Width, etc.\n\n3. Appropriate\n machines\n\n3.3 Lathe machine\n3.4 Milling machine\n3.5 Grinders\n3.6 Pedestal drills\n3.7 Pantographs, and other machines as needed\n4. Patterns\nPattern types\n4.1 One-piece, loose piece (unlimited size)\n4.2 Split, loose piece pattern (unlimited size)\n4.3 One piece match plate (depending on molding machine)\n4.4 Split match plate (depending on molding machine)\n4.5 Multi cavity patterns\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n39\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate\n1.1 Determined job requirement.\n1.2 Developed pattern equipment\n1.3 Manufactured production patterns and core boxes\n2. Underpinning\nknowledge and\nattitudes\n2.1 Determining job requirements from written instructions, sketches\nand drawings\n2.2 Planning and sequencing manufacturing operations\n2.3 Characteristics of metals and alloys and their application\nin the development/manufacture of production patterns\n2.4 Tolerances and contraction rates in the manufacture of production\npatterns\n2.5 Production molding and casting techniques\n2.6 Tooling required for casting/molding\n2.7 Methoding techniques\n2.8 The use and application of jigs and fixtures\n2.9 Methods of construction including machining provision\nand clamping arrangements\n2.10 Techniques, tools and equipment to measure,\nmark out and produce production patterns\n2.11 Formulae and mathematical techniques required for\nmanufacturing production patterns/core boxes i.e.\ncontraction, taper, clearances, machining allowances etc.\n2.12 Identification coding and numbering\n2.13 Pattern checking techniques\n2.14 Moldability i.e. surface finish, face taper, convex or\nconcave perspectives, undercuts, etc.\n2.15 Use and application of personal protective equipment\n2.16 Safe work practices and procedures\n2.17 Hazards and control measures associated with\ndeveloping and manufacturing production patterns\n3. Underpinning\nskills\n\n3.1 Checking and clarifying task-related information\n3.2 Selecting appropriate metals to suit the molding/casting\ntechniques and foundry process\n3.3 Laying out/constructing production pattern/core boxes\n3.4 Joining and fixing component parts\n3.5 Checking pattern for conformance to specifications\n3.6 Measuring components to specified tolerances\n3.7 Calculating contraction rates\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment, materials and documentation\n5.Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Third party reports\n5.3Portfolio\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n40\nUNIT OF COMPETENCY: PERFORM GENERAL WOODWORKING MACHINE\nOPERATIONS\n\nUNIT CODE:"
