ay be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n34\n\nUNIT OF COMPETENCY: DEVELOP AND MANUFACTURE ASSEMBLED\n PLATED PATTERNS\nUNIT CODE:\nALT742303\n\nUNIT DESCRIPTOR: This unit covers assembling plated patterns.\n.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirement\n\n1.1 Job instructions and specifications are correctly interpreted\nand followed.\n\n2. Inspect and layout\npatterns\n\n2.1 Pattern(s) are inspected to ensure dimensions and surface\nfinish conforms to specifications.\n2.2 Pattern and runner system is laid out to specifications from\ndrawings, sketches or verbal instructions.\n2.3 Pattern(s) alignment is correctly laid-out.\n\n3. Mount pattern on\nplates\n\n3.1 Cope and drag patterns/double-sided match plate patterns are\nattached to pattern plate/s according to specification.\n3.2 Cope and drag patterns/double-sided match plate patterns are\ninspected for security and alignment.\n\n4. Mount runner\nsystem\n\n4.1 Volume of runner system conforms to specification.\n4.2 All calculations are performed without error.\n4.2 Runner components are attached to pattern plates using\nappropriate fixing and joining techniques using dowels and\nother fixing attachments to specification.\n\n5. Inspect plated\npattern assembly\n\n5.1 Surface and moldability of plated pattern assembly\nare inspected and measured for compliance with specification\n\nRANGE OF VARIABLES\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n35\n\nVARIABLE\nRANGE\n\n1. Pattern\n\n1.1 Metal\n1.2 Wood\n\n2. Match Plate\n\n2.1 Plane\n2.2 Offset\n\n3. Alignment\n\n3.1 Measurement (X Y Plane)\n3.2 