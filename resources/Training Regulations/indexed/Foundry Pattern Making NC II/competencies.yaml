        "source_title": "DEVELOP AND MANUFACTURE POLYMER PATTERNS",
        "source_text": "--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n31\nUNIT OF COMPETENCY: DEVELOP AND MANUFACTURE POLYMER  \n                                           PATTERNS  \n \nUNIT CODE:  \nALT742302 \n \nUNIT DESCRIPTOR: This unit covers designing, manufacturing and finishing \n  \n \n \n    the polymer patterns. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Determine job \nrequirements. \n \n1.1 Job instructions and specifications are correctly \ninterpreted and followed. \n \n2. Inspect and prepare \npattern \n \n \n2.1 Patterns or cores are inspected for appropriate surface \nfinish and set up on joint line or flat board to specification. \n2.2 Appropriate parting agent is selected and applied to \npolymer specifications \n \n3. Manufacture molds \n \n3.1 Appropriate polymer materials are selected to \nspecification. \n3.2 Polymer and hardener are mixed to correct ratios and \nspecifications using standard safety and operating \nprocedures. \n3.3 Polymer is applied to specification following \npredetermined methods such as ensuring air is not \nentrapped in application, excessive heat is not generated \nand de-lamination does not occur in final use. \n3.4 Pattern/core box is stripped, inspected, cleaned and \nrepaired as required. \n3.5 Faces of polymer pattern are machined and finished to \nspecifications. \n3.6 Appropriate method of location is applied to patterns and \ncore boxes. \n3.7 Polymer tooling is checked for conformance to \nspecifications as required.\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n32\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Surface finish \n \n1.1 Texture \n1.2  Gel coat \n1.3  Aluminum fill \n \n2. Parting agent  \n \n2.1 PVA \n2.2 Wax \n \n3. Polymer materials \n \n3.1 Epoxy resins \n3.2 Urethane \n \n4. Method of location \n \n4.1 Male joint  \n4.2 Female joint \n4.3 Pin  \n4.4 Bush\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n33\nEVIDENCE GUIDE \n1. Critical aspects \nof competency  \nAssessment requires evidence that the candidate: \n1.1 Determined job requirements. \n1.2 Inspected and prepared pattern \n1.3 Manufactured molds \n2. Underpinning  \nknowledge and \nattitudes  \n2.1 Methods of locating patterns and core boxes \n2.2 Range of surface finishes \n2.3 Range of polymers and their applications \n2.4 Mixing ratios and calculations \n2.5 Characteristics of polymer under exothermic reaction \n2.6 Exothermic control procedures \n2.7 Methods of stripping \n2.8 Pattern checking techniques \n2.9 Kinds, use and application of personal protective equipment \n2.10 Safe work practices and procedures \n2.11 Hazards and control measures associated with producing \npolymer patterns\n3. Underpinning \nskills \n \n3.1 Reading, interpreting and following information on written job \ninstructions, specifications, standard operating procedures, \ncharts, lists, drawings and other applicable reference documents \n3.2 Undertaking numerical operations, geometry and calculations / \nformulae within the scope of this unit, including determination of \ncontraction rates \n3.3 Measuring polymer materials \n3.4 Interpreting written instructions, sketches and drawings \n3.5 Making master patterns \n3.6 Machining patterns/core boxes and tooling aids \n3.7 Sealing the patterns or cores with appropriate surface finish \n3.8 Alignment of pattern to core box \n3.9 Setting up with necessary locations \n3.10 Applying the parting agents \n3.11 Selecting polymers \n3.12 Preparing polymer and hardener \n3.13 Applying polymer coating \n3.14 Releasing patterns and molds\n4. Resource \nImplications  \nThe following resources MUST be provided: \n4.1  All manuals/catalogues relative to this unit \n4.2  Job order, requisitions \n4.3 Materials, tools, equipment and facilities relevant to the unit.\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Demonstration with questioning \n5.3 Interview  \n5.4 Portfolio  \n5.5  Third Party Report \n6. Context of  \nassessment  \n \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2Assessment may be conducted in the workplace or a  \n      simulated environment.\n",
