ics\nand applications\n2.2 Molding and casting techniques\n2.3 Tools required for casting/molding\n2.4 Jigs and fixtures methods of construction\n2.5 Formulas and mathematical techniques required for\nnecessary manufacturing of patterns/core boxes i.e.\ncontraction, taper, clearances, machining allowances etc.\n2.6 Identification of coding and numbering\n2.7 Pattern checking techniques\n2.8 Moldability i.e. surface finish, face taper, convex or\nconcave perspectives, undercuts, etc.\n2.9 Types of personal protective equipment\n2.10 Safe work practices and procedures\n\n3. Underpinning skills\n\n3.1 Reading/interpreting/following information on written\njob instructions, specifications, standard operating\nprocedures, charts, lists, drawings and other documents\n3.2 Performing computation on different numerical\noperations, geometry and formulas within the scope of\nthis unit\n3.3 Selecting appropriate timber to suit the molding/ casting\ntechniques and foundry process\n3.4 Laying out the pattern/core boxes\n3.5 Constructing patterns/core boxes\n3.6 Joining and fixing component parts\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n5. Method of assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Interview\n5.4 Portfolio\n6. Context of assessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n31\nUNIT OF COMPETENCY: DEVELOP AND MANUFACTURE POLYMER\n PATTERNS\n\nUNIT CODE:\nALT742302\n\nUNIT DESCRIPTOR: This unit covers designing, manufacturing and finishing\n\n the polymer patterns.\n\n