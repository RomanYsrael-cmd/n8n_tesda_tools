        "source_text": "ALT742305\n\nUNIT DESCRIPTOR: This unit covers setting up and operating wood working\nmachines used by engineering pattern makers and fabricators.\n\n ELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All inspections methods are carried out according to industry\nregulations/guidelines, occupational health and safety and company\nprocedures)\n\n1. Determine job\nrequirements\n1.1 Job requirements, instructions and specifications are\ninterpreted and understood.\n1.2 Appropriate woodworking machine is selected to meet\nspecifications.\n\n2. Set up\nwoodworking\nmachines\n\n2.1 Tools/cutters are selected appropriate to task requirements.\n2.2 Cutting tools are sharpened and/or shaped to specification.\n2.3 Tools/cutters are correctly installed using standard operating\nprocedures.\n2.4 Guards/stops are set and adjusted as required.\n2.5 Woodworking machines are set-up in accordance with\ncompany standard operating procedures and safety\nrequirements\n\n3. Operate\nwoodworking\nmachines\n3.1 Material to be machined is positioned and secured effectively.\n3.2 Materials are machined to specification using standard\noperating procedures.\n3.3 Material use is optimized and waste is minimized.\n\n4. Check finished\ncomponent\n\n4.1 Machined component is checked against specifications and\npredetermined finish.\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n41\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Job requirements\n1.1 Sizing\n1.2 Appearance in terms of figure, grain or surface finish\n1.3 Allowance of imperfections such as twist, bow, bend,\n sloping grain, knots, shakes, gum veins etc.\n\n2. Woodworking\nmachines\n2.1 Band saws\n2.2 Buzzers\n2.3 Thicknesses\n2.4 Disk sander\n2.5 Bobbin sander\n2.6 Pattern mill\n2.7 Wood lathe\n2.8 Pedestal router and drill\n\n3 Cutting tools\n\n3.1 Blades\n3.2 Router bits\n\n4 Guards/stops\n\n4.1 Fixed guards and stops\n4.2 Variable guards and stops\n\n5 Set up\n\n5.1 Installation of the blades and cutters\n5.2 Settings for the job\n5.3 Adjustments for sizing and speed\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n42\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidences that the candidate:\n1.1 Determined job requirements.\n1.2 Had set up woodworking machines.\n1.3 Operated woodworking machines.\n1.4 Checked finished component.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Knowledge of application and use of general wood working\nmachines\n2.2 Procedure in interpreting instructions, drawings or sketches\n2.3 Numerical operations and calculations within the scope\nof this unit\n2.4 Consequences of selecting inappropriate materials\n2.5 Various processes requiring models calculus, engineering\ncalculations and formulae relating to developing and\nmanufacturing precision models\n2. 6 Different machines and machining processes and\ntheir operations\n2.7 Various checking procedures and devices including coordinate\nmeasuring and machine checking\n2.8 Procedures for recording deviation or modification to\noriginal drawings or specifications\n2.9 Hazards and control measures associated with developing and\nmanufacturing precision models\n\n3. Underpinning\nskills\n\n3.1 Determining job requirements from job instructions,\nspecifications, standard operating procedures and other\napplicable reference documents\n3.2 Checking and clarifying task-related information\n3.3 Selecting and setting machines\n3.4 Setting guards and stops\n3.5 Handling, machining and storing timber and wood\n3.6 Measuring materials and components to specified\nsizes/tolerances\n3.7 Checking for conformance to specifications\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment, materials and documentation\n4.3 The candidate must be permitted to refer to any relevant\nworkplace procedures, product and manufacturing specifications,\ncodes, standards, manuals and reference materials.\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with Questioning\n5.2 Demonstration with questioning\n5.3 Portfolio\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n43\n\nUNIT OF COMPETENCY: USE AND MAINTAIN MEASURING INSTRUMENT\n\nUNIT CODE:"
