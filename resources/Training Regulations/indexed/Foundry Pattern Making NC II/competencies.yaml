        "source_text": "ALT742301\n\nUNIT DESCRIPTOR: This unit covers developing and manufacturing wood patterns, both\nregular shaped and split patterns, based on an understanding of casting\nand molding principles.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.Determine job\nrequirements\n\n1.1 Job instructions and specifications are interpreted correctly.\n1.2 Type of wood pattern required is determined through\napplication of molding/casting techniques and foundry\nprocesses.\n1.3 Appropriate timber/timber composites are selected to meet\nspecification.\n\n2. Develop and lay out\nwood patterns\n\n2.1 Pattern parameters are calculated to specification e.g.\nangles, tapers, clearances, contractions etc.\n2.2 Pattern is laid out showing tapers, machining allowances,\ncore prints and method of construction to specification.\n2.3 Jigs and fixtures are developed and manufactured to aid\nwood pattern manufacture as required.\n\n3.Manufacture wood\npatterns\n\n3.1 Materials are marked out and construction is developed to\nmeet specification.\n3.2 Pattern or pattern component parts are produced to size and\nshape and checked for conformance to specifications using\nacceptable wood pattern making techniques and procedures\nand utilizing appropriate hand and handheld power tools.\n3.3 Pattern component parts are joined or fixed as required and\nchecked for conformance to specification.\nusing acceptable wood pattern making techniques and\nprocedures\n3.4 Pattern is correctly marked, color-coded or tagged according\nto specifications or standard operating procedures.\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n29\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1.Molding/casting\ntechniques\n\n1.1 The variety of sand molding techniques and sand\nmediums\n\n2.Timber/timber\ncomposites\n\n2.1 Hardwood\n2.2 Softwood\n2.3 Laminates\n2.4 Plywood\n2.5 Veneers and bonded fiberboard\n\n3. Calculations\n\nCalculations include the determination of:\n3.1 Contraction rates,\n3.2 General engineering calculations\n\n4. Joining and fixing\n\nJoining and fixing may include:\n4.1 Glued\n4.2 Screwed\n4.3 Nailed\n4.4 Stapled\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n30\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Determined job requirements\n1.2 Developed and lay out wood patterns\n1.3 Manufactured wood patterns\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Kinds of timber products including features, characteristics\nand applications\n2.2 Molding and casting techniques\n2.3 Tools required for casting/molding\n2.4 Jigs and fixtures methods of construction\n2.5 Formulas and mathematical techniques required for\nnecessary manufacturing of patterns/core boxes i.e.\ncontraction, taper, clearances, machining allowances etc.\n2.6 Identification of coding and numbering\n2.7 Pattern checking techniques\n2.8 Moldability i.e. surface finish, face taper, convex or\nconcave perspectives, undercuts, etc.\n2.9 Types of personal protective equipment\n2.10 Safe work practices and procedures\n\n3. Underpinning skills\n\n3.1 Reading/interpreting/following information on written\njob instructions, specifications, standard operating\nprocedures, charts, lists, drawings and other documents\n3.2 Performing computation on different numerical\noperations, geometry and formulas within the scope of\nthis unit\n3.3 Selecting appropriate timber to suit the molding/ casting\ntechniques and foundry process\n3.4 Laying out the pattern/core boxes\n3.5 Constructing patterns/core boxes\n3.6 Joining and fixing component parts\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n5. Method of assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Interview\n5.4 Portfolio\n6. Context of assessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n31\nUNIT OF COMPETENCY: DEVELOP AND MANUFACTURE POLYMER\n PATTERNS\n\nUNIT CODE:"
