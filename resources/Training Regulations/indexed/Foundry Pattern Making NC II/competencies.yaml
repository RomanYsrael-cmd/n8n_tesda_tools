        "source_text": "--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n34\n \nUNIT OF COMPETENCY: DEVELOP AND MANUFACTURE ASSEMBLED  \n                                           PLATED PATTERNS \nUNIT CODE:  \nALT742303 \n \nUNIT DESCRIPTOR: This unit covers assembling plated patterns. \n. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Determine job \nrequirement  \n \n1.1 Job instructions and specifications are correctly interpreted \nand followed. \n \n2. Inspect and layout \npatterns \n \n2.1 Pattern(s) are inspected to ensure dimensions and surface \nfinish conforms to specifications. \n2.2 Pattern and runner system is laid out to specifications from \ndrawings, sketches or verbal instructions. \n2.3 Pattern(s) alignment is correctly laid-out. \n \n3. Mount pattern on \nplates \n \n3.1 Cope and drag patterns/double-sided match plate patterns are \nattached to pattern plate/s according to specification. \n3.2 Cope and drag patterns/double-sided match plate patterns are \ninspected for security and alignment. \n \n4. Mount runner \nsystem \n \n4.1 Volume of runner system conforms to specification. \n4.2 All calculations are performed without error. \n4.2 Runner components are attached to pattern plates using \nappropriate fixing and joining techniques using dowels and \nother fixing attachments to specification. \n \n5. Inspect plated \npattern assembly \n \n5.1 Surface and moldability of plated pattern assembly \nare inspected and measured for compliance with specification \n \n \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n35\n \nVARIABLE \nRANGE \n \n1. Pattern \n \n1.1  Metal  \n1.2 Wood\n \n2. Match Plate \n \n2.1 Plane \n2.2 Offset\n \n3. Alignment \n \n3.1 Measurement (X Y Plane) \n3.2 Dowels\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n36\nEVIDENCE GUIDE \n1. Critical aspect \nof competency \nAssessment requires evidence that the candidate: \n1.1 Determined job requirements. \n1.2 Inspected and laid-out patterns \n1.3 Mounted pattern on plates \n1.4 Mounted runner system \n1.5 Inspected plated pattern assembly\n \n2. Underpinning  \nknowledge \nand attitudes \n2.1 Determining job requirements from written instructions, \nspecifications, sketches and drawings \n2.2 Planning and sequencing tasks \n2.3 Checking and clarifying task-related information \n2.4 Performing relevant calculations \n2.5 Following verbal instructions \n2.6 Applying surface finishes for the molding process \n2.7 Laying out patterns and runner systems \n2.8 Attaching pattern and runner components \n2.9 Locating and aligning patterns \n2.10 Types of pattern plates \n2.11Techniques for avoiding cross jointing or mismatch of the pattern \nand their relationship to the pin-centre \n2.12 Methoding systems \n2.13 Moldability of materials i.e. surface finish, face taper, convex or \nconcave perspectives, undercuts, etc. \n2.14 Molding and casting techniques \n2.15 Kinds, use and application of personal protective equipment \n2.16 Safe work practices and procedures \n2.17 Hazards and control measures associated with assembling plated \npatterns\n \n3. Underpinning \nskills \n3.1 Checking patterns for compliance  \n3.2 Perform measurement, numerical operations and calculations \nassociated with assembling plated patterns \n3.3 Fixing and drilling techniques \n3.4 Following safety, quality, communication, materials handling \ntechniques \n 3.5 Recording and reporting associated with assembling plated \npatterns or other units requiring the exercise of the skills and \nknowledge covered by this unit.\n \n4. Resource \nImplications  \nThe following resources MUST be provided: \n4.4  All manuals/catalogues relative to this unit \n4.5  Job order, requisitions \n4.6 Materials, tools, equipment and facilities relevant to the unit.\n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Demonstration with questioning \n5.3Portfolio \n6. Context of \nassessment \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n      simulated environment.\n",
