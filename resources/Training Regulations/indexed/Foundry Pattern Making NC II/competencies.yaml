        "source_title": "USE AND MAINTAIN MEASURING INSTRUMENT",
        "source_text": "--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n43\n \n \nUNIT OF COMPETENCY: USE AND MAINTAIN MEASURING INSTRUMENT \n \nUNIT CODE: ALT821303 \n \nUNIT DESCRIPTOR: This unit identifies the competence required to measure components \nor sections using non-specialist instrument and maintain the \nmeasuring instrument. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Measure \ndimensions or \nvariables using \nappropriate \ninstrument \n \n1.1 Measurement of dimensions and variables are \ncompleted without causing damage to any instrument or \ncomponents \n1.2 Appropriate measuring instrument is selected \n1.3 Relevant measuring techniques are used and results \nappropriately recorded \n1.4 All measuring activities are carried out according to \nindustry regulations/guidelines OHS & requirements  and \nenterprise/procedures policies\n \n2. Maintain measuring \ninstrument \n2.1 Maintenance of measuring instrument is achieved without \ncausing damage to any instrument or component \n2.2 Routine care and storage of measuring instrument is \nundertaken according to manufacture specifications \n2.3 Checking and calibrating of measuring devices is done \nprior to use. \n2.4 All maintenance activities of measuring instruments are \ncarried out according  to industry regulations/guidelines \nOHS legislation, and enterprise procedures policies\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n44\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Dimension and \nvariables \nmeasurement  \n1.1 Measuring Tape \n Diameter of Furnace components \n External Dimensions \n1.2 Steel Rule \n \nStraightness \n \nAlignment \n1.3  Leveling Gauge \n Warpage \n Level and angle \n1.4  Pyrometer \n2. Measuring \ninstrument and \ntools \n2.1 Handtools \n2.2 Depth gage \n2.3 Vernier Caliper \n2.4 Straight edge \n2.5 Feeler gage \n2.6 Inside Caliper  \n2.7 T-squares  \n2.8 Flat edges  \n2.9 Dividers  \n2.10 Protractors\n3. Measuring \ntechnique \n3.1 Correct usage of the above mentioned measuring  \n      instrument and tools. \n3.2 Out of round or ovality \n3.3 Cylindricity or taper conicity\n4. OHS \nRequirements \n4.1 Wearing of personal protective instrument such as  \n      apron, goggles, gloves, safety shoes \n4.2 Disposal of wastes materials \n4.3 Workshop housekeeping\n5. Routine care \nand storage of \nmeasuring \ninstrument  \n5.1 Periodic check up of  pyrometer with standard bars  \n5.2 Storage in box separated from hand tools \n5.3 Proper handling \n5.4 Not to exposed to liquid such as water.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY PATTERNMAKING NC II                                                                                                                Promulgated   \n           \n45\nEVIDENCE GUIDE \n \n1. Critical aspects \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Measured components or section using correct instrument.  \n1.2 Maintained measuring instrument. \n2. Underpinning \nknowledge and \nattitudes \n2.1 Personal and instrument safety requirements \n2.2 Measuring instrument types and their application \n2.3 Measuring procedures \n2.4 Measuring instrument graduation \n2.5 Measuring instrument maintenance procedures \n2.6 Positive Work values ( Perseverance, Patience,   \n     Honesty,  Attention to Details)\n3. Underpinning \nskills \n3.1 Accessing, interpreting and applying technical  \n      information \n3.2 Using tools and instrument correctly and safely \n3.3 Maintain measuring instrument \n2.1 Using measuring instrument \n3 Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & instrument \n4.3 Materials relevant to the activity \n4 Method of \nassessment \nCompetency MUST be assessed through \n5.1 Demonstration of skills in measurement of length, squareness, \nflatness, angles, roundness, depth, clearance or any \nmeasurements that can be taken from analogue or digital \ndevices. \n5.2 Written examination\n5 Context of \nassessment \n6.1 The assessment of practical skills must only take place after a \nperiod of supervised practice and repetitive experience in a safe \nworking environment. If workplace conditions are not available, \nassessment in simulated workplace conditions is acceptable.\n",
