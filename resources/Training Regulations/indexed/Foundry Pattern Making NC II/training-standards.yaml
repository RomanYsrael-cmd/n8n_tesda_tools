  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Foundry Pattern Making NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Foundry-Pattern Making\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n120 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in\nthe field of foundry-pattern making in accordance with industry standards. It covers core\ncompetencies such as; develop and manufacture wood patterns, develop and manufacture\npolymer patterns, develop and manufacture assembled plated patterns, develop and\nmanufacture polystyrene patterns, develop and manufacture production patterns, develop and\nmanufacture vacuum forming moulds, develop and manufacture precision molds, develop and\nmanufacture gear conveyor screw and propeller patterns, perform general woodworking\nmachine operations, use and maintain measuring instrument.\n\nThis course is also designed to enhance the basic and common knowledge, skills and\nattitudes of an individual in the field of foundry-pattern making.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\n meeting and\ndiscussion.\n•\nGroup discussion\n•\nInteraction\n\n•\nWritten test\n•\nPractical/perform\nance test\n•\nInterview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a\nteam\n member.\n•\nDiscussion\n•\nInteraction\n\n•\nObservation\n•\nSimulation\n•\nRole playing\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n47\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n•\nGroup Discussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1Identify hazardous risks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in\nthe drawings &\nspecifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct observation\n• Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1. Select measuring\ninstrument and\n2.2 Carry out\nmeasurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral questioning\n• Direct observation\n\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed\nmanuals and interpret\ndata and specification\n4.2 Apply information\naccessed in manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance Learning\n\n• Written test\n• Direct observation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Simulation\n• Written test\n• Direct observation\n• Demonstration\n• Interview\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n48\n\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nmanufacture\nwood patterns\n1.1 Determine job\nrequirements\n1.2 Develop and lay out\nwood patterns\n1.3 Manufacture wood\npatterns\n•\nLecture/\nDemonstration\n•\nDual Training\n•\nDistance learning\n\n•\nWritten\nexamination\n•\nDirect\nObservation\n•\nProject method\n•\nInteview\n2. Develop and\nmanufacture\npolymer\npatterns\n2.1 Determine job\nrequirements.\n2.2 Inspect and prepare\npattern\n2.3 Manufacture molds\n•\nLecture/\nDemonstration\n•\nDual Training\n•\nPractical exercises\n\n•\nInterview\n•\nDemonstration\n•\nDirect\nObservation\nw/questioning\n•\nPortfolio\n•\nThird party\nreport\n3. Develop and\nmanufacture\nassembled\nplated patterns\n3.1 Determine job\nrequirement\n3.2 Inspect and layout\npatterns\n3.3 Mount pattern on\nplates\n3.4 Mount runner system\n3.5 Inspect plated pattern\nassembly\n•\nLecture/\nDemonstration\n•\nDual Training\n•\nPractical exercises\n\n•\nDirect\nObservation\n•\nQuestioning\n•\nDemonstration\n•\nPortfolio\n\n4. Develop and\nmanufacture\nproduction\npatterns\n4.1Determine job\nrequirements\n4.2.Manufacture\nproduction\npatterns and core\nboxes\n•\nLecture/\nDemonstration\n•\nDual Training\n•\nPractical exercises\n\n•\nDirect\nObservation\n•\nQuestioning\n•\nThird party\n•\nPortfolio\n\n5. Performs\ngeneral\nwoodworking\nmachine\noperations\n5.1 Determine job\nrequirements\n5.2 Set up woodworking\nmachines\n5.3 Operate woodworking\nmachines\n5.4 Check finished\ncomponent\n•\nLecture/\nDemonstration\n•\nDual Training\n•\nPractical exercises\n\n•\nDirect\nObservation\n•\nQuestioning\n•\nDemonstration\n•\nPortfolio\n\n6. Use and\nMaintain\nMeasuring\nInstruments\n6.1 Measure dimensions\nor variables using\nappropriate\ninstruments\n6.2 Maintain measuring\ninstruments\n•\nLecture/\nDemonstration\n•\nDual Training\n•\nPractical exercises\n\n•\nDemonstration\n•\nWritten exam\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n49\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the\ncurriculum modules;\n Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY PATTERNMAKING NC II Promulgated\n\n50\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• With experience in basic machining\n• With good moral character;\n• Ability to communicate both oral and written; and\n• Physically and mentally fit\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n FOUNDRY PATTERN MAKING NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nFoundry Pattern Making NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\nBox wrench\n1 unit\nWood lathe\n12 pcs\nPlywood (1/2 thk)\n2 sets\nOpen end\nwrench\n1 unit\nBand saw\n12 pcs\nPlywood (1/4 thk)\n2 sets\nSocket wrench\n1 unit\nCircular saw\n24 pcs\nLumber 1”x4”x12