  "source_text": "For the purpose of this competency standard, the following words are defined:\n\n.1\nCompetency – is the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace.\n\n.2\nUnit of Competency – describes a work activity.\n\n.3\nElements – are building blocks of a unit of competency. It describes in outcome\nterms the functions that a person who works in a particular area of\nwork is able to perform.\n\n.4\nPerformance Criteria – are evaluative statements that specify what is to be\nassessed and the required level of performance.\n\n.5\nRange of Variables – describe the circumstances or context in which the work\nis to be performed.\n\n.6\nEvidence Guide – a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning skills,\nresource implications, context of assessment and assessment\nmethods.\n\n.7\nBlanching – refers to a heat treatment in which the raw food material is\nimmersed in hot water or exposed to live steam.\n\n.8\nBottling/Canning – refers to a preservation of foods in hermetically sealed\ncontainers such as tin cans and glass jars by sterilization with heat\n\n.9\nBFAD - means Bureau of Food and Drug\n\n.10\nBrine – refers to a salt solution\n\n.11\nCabinet Drying - refers to a process of dehydrating food material using a\ncabinet drier consisting of a closed chamber which is well insulated\nagainst heat loss\n\n.12\nChilling – is subjecting meat to a temperature of 2-4°C(36-40°F at certain\nperiod of time\n\n.13\nCuring – refers to a process by which salt, sugar and salitre and other\npreservatives and adjuncts are introduced/are used to prolong the\nkeeping quality of the products\n\n--- PDF PAGE 121 ---\n___________________________________________________\nTR-Food Processing NC III\n119\n\n.14\nDehydration- refers to drying by artificially produced heat under carefully\ncontrolled conditions of temperature, humidity and airflow within a\nchamber\n\n.15\nDry Curing– refers to a method of curing meat where curing mixture is rubbed\non the surface of the food material being cured.\n\n.16\nExhausting – refers to the removal of air and gases from the raw material and\nthe container before sealing; It refers to the heating of canned foods to\na center can temperature of 180°C to 205°F before sealing.\n\n.17\nFermentation – refers to the anaerobic oxidation of carbohydrates by microbial\nenzymes\n\n.18\nFood Additives- refer to substances intentionally added to foods to achieve or\nretain desired characteristics\n\n.19\nFood Processing – refers to the application of heat in varying degree to the\nfood enclosed in a container for a sufficient time to sterilize the product\n\n.20\nGMP – Good Manufacturing Practice which is a combination of manufacturing\nand quality control procedures aimed at ensuring that products are\nconsistently manufactured to their specifications\n\n.21\nGRAS - means generally regarded as safe\n\n.22\nHACCP – Hazard Analysis Critical Control Point is a food safety management\nsystem which concentrates prevention strategies on known hazards\nand the risks of them occurring at specific points in the food chain\n\n.23\nHazard – the potential to cause harm which may include bacteria, virus, toxin,\nparasite, chemical or physical hazard. Operational malpractices or\nother operations/processes can also become hazards if they lead to\nunacceptable contamination or growth and survival of organisms and\nmicroorganisms\n\n.24\nHermetic Sealing - refers to the closure of tin cans or glass jars tightly to\nprevent the entrance of microorganisms\n\n.25\nPackaging – any container or material used in the packaging of a product\nwhich may include materials in direct contact with the product, printed\npacks including labeling, and other materials including outer cartons or\ndelivery cases\n\n.26\nPacking Medium – refers to brine, syrup, broth, oil or other similar ingredients\nused as canning medium\n\n.27\nPickling- refers to the preservation of foods by brine and vinegar with or\nwithout bacterial fermentation\n\n--- PDF PAGE 122 ---\n___________________________________________________\nTR-Food Processing NC III\n120\n\n.28\npH meter – refers to an instrument used to measure the acidity of a sample\n\n.29\nPreservatives- refer to food additives that retard spoilage and preserve the\nnatural color & flavor of food products\n\n.30\nPulverize – to reduce by crushing or grinding to very small particles\n\n.31\nRaw Materials – consist of the main food material to be processed including\nminor food ingredients\n\n.32\nRetort Specification – refers to a steam pressure canner used in sterilizing low\nacid canned foods\n\n.33\nSalinometer- refers to the instrument to measure strength of brine\n\n.34\nSanitation - refers to the process of treating food contact and non-food contact\nsurface with physical agents and chemicals to kill the residual\nmicroorganisms present after cleaning\n\n.35\nSmoke – refers to the gas from burning wood material containing combustible\nand noncombustible substances, the combustible substances are the\nmain sources of smoke which consist of cellulose, lignin, pentosans,\ntannic acid, protein substances, resins and terpenes\n\n.36\n Smoking – refers to subjecting the product to the action of smoke from burning\nwood materials\n\n.37\nSmoke House- refers to a closed smoke chamber where smoke is produced\nwhich may range from the temporary (barrel) smoke house to the\npermanent frame or concrete smoke house.\n\n.38\nStandard Measurement – refers to something set up as a rule for measuring\nor a model to be followed\n\n.39\nSugar Concentrates – refer to products cooked with sugar to attain a\nconcentration of 40-65% or to saturated sucrose level\n\n.40\nSyrup – refers to a sugar solution whether light, medium or heavy syrup\n\n.41\nThermal Processing – refers to the method of processing food in hermetically\nsealed container by applying heat with the right temperature and time,\nenough to kill microorganisms responsible in the spoilage of food which\ninvolve bottling and canning\n\n--- PDF PAGE 123 ---\n___________________________________________________\nTR-Food Processing NC III\n121\n\n.42\nWater Bath – it is a set up used for canning consisting of a large kettle with\nfitting cover deep enough to have an inch or two over the tops of the\ncontainers of food and an extra 1-2 inch space for boiling with a\nwooden or metal rack made for holding filled containers; used for\nprocessing high acid canned products.\n\n--- PDF PAGE 124 ---\n___________________________________________________\nTR-Food Processing NC III\n122",
