  "source_section_text": "SECTION 2\n\nCOMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for FOOD PROCESSING NC III. These\nunits of competency are categorized into basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas\nare communicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all\nsituations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to\nworkplace discussions on such issues as\nproduction, quality and safety\n2.4. Goals/objectives and action plan undertaken in\nthe workplace are communicated\n\n--- PDF PAGE 6 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n4\n\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and\neffective communication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised\nas they arise\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 7 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n5\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Dealt with a range of communication/information at\none time\n1.2. Made constructive contributions in workplace issues\n1.3. Sought workplace issues effectively\n1.4. Responded to workplace issues promptly\n1.5. Presented information clearly and effectively written\nform\n1.6. Used appropriate sources of information\n1.7. Asked appropriate questions\n1.8. Provided accurate information\n2. Underpinning\nknowledge\n2.1. Organization requirements for written and electronic\ncommunication methods\n2.2. Effective verbal communication methods\n3. Underpinning\nSkills\n3.1. Organize information\n3.2. Understand and convey intended meaning\n3.3. Participate in variety of workplace discussions\n3.4. Comply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Variety of Information\n4.2. Communication tools\n4.3. Simulated workplace\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through\n5.1. Direct Observation\n5.2. Interview\n6. Context for\nAssessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 8 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n6\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1. Work requirements are identified and\npresented to team members\n1.2. Reasons for instructions and requirements are\ncommunicated to team members\n1.3. Team members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1. Duties, and responsibilities are allocated\nhaving regard to the skills, knowledge and\naptitude required to properly undertake the\nassigned task and according to company\npolicy\n2.2. Duties are allocated having regard to individual\npreference, domestic and personal\nconsiderations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1. Performance expectations are established\nbased on client needs and according to\nassignment requirements\n3.2. Performance expectations are based on\nindividual team members duties and area of\nresponsibility\n3.3. Performance expectations are discussed and\ndisseminated to individual team members\n\n--- PDF PAGE 9 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n7\n4. Supervise team\nperformance\n4.1. Monitoring of performance takes place\nagainst defined performance criteria and/or\nassignment instructions and corrective action\ntaken if required\n4.2. Team members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3. Performance issues which cannot be rectified\nor addressed within the team are referenced to\nappropriate personnel according to employer\npolicy\n4.4. Team members are kept informed of any\nchanges in the priority allocated to assignments\nor tasks which might impact on client/customer\nneeds and satisfaction\n4.5. Team operations are monitored to ensure that\nemployer/client needs and requirements are\nmet\n4.6. Follow-up communication is provided on all\nissues affecting the team\n4.7. All relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 10 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 11 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n9\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Underpinning\nKnowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6. Team member’s duties and responsibilities\n3. Underpinning\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4. Negotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or task\n\n--- PDF PAGE 12 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n10\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n11\nUNIT TITLE\n\n: DEVELOP AND PRACTICE NEGOTIATION\n SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes\n\n required to collect information in order to negotiate\n to a desired outcome and participate in the\n negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1 Information on preparing for negotiation is identified\nand included in the plan\n1.2 Information on creating non verbal environments for\npositive negotiating is identified and included in the plan\n1.3 Information on active listening is identified and included\nin the plan\n1.4 Information on different questioning techniques is\nidentified and included in the plan\n1.5 Information is checked to ensure it is correct and up-to-\ndate\n2. Participate in\nnegotiations\n2.1 Criteria for successful outcome are agreed upon by all\nparties\n2.2 Desired outcome of all parties are considered\n2.3 Appropriate language is used throughout the negotiation\n2.4 A variety of questioning techniques are used\n2.5 The issues and processes are documented and agreed\nupon by all parties\n2.6 Possible solutions are discussed and their viability\nassessed\n2.7 Areas for agreement are confirmed and recorded\n2.8 Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 14 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 15 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n13\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning Skills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 16 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n14\n\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the\nRange of Variables\n1. Identify the problem\n1.1. Variances are identified from normal operating\nparameters; and product quality\n1.2. Extent, cause and nature of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3. Problems are clearly stated and specified\n2. Determine fundamental\ncauses of the problem\n2.1. Possible causes are identified based on\nexperience and the use of problem solving tools /\nanalytical techniques.\n2.2. Possible cause statements are developed based\non findings\n2.3. Fundamental causes are identified per results of\ninvestigation conducted\n3. Determine corrective\naction\n3.1. All possible options are considered for resolution\nof the problem\n3.2. Strengths and weaknesses of possible options\nare considered\n3.3. Corrective actions are determined to resolve the\nproblem and possible future causes\n3.4. Action plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1. Report on recommendations are prepared\n4.2. Recommendations are presented to appropriate\npersonnel.\n4.3. Recommendations are followed-up, if required\n\n--- PDF PAGE 17 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1. Brainstorming\n1.2. Intuitions/Logic\n1.3. Cause and effect diagrams\n1.4. Pareto analysis\n1.5. SWOT analysis\n1.6. Gant chart, Pert CPM and graphs\n1.7. Scattergrams\n2. Problem\n\n2.1. Non – routine process and quality problems\n2.2. Equipment selection, availability and failure\n2.3. Teamwork and work allocation problem\n2.4. Safety and emergency situations and\nincidents\n3. Action plans\n\n3.1. Priority requirements\n3.2. Measurable objectives\n3.3. Resource requirements\n3.4. Timelines\n3.5. Coordination and feedback requirements\n3.6. Safety requirements\n3.7. Risk assessment\n3.8. Environmental requirements\n\n--- PDF PAGE 18 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n16\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of\nproblems, including new, unusual and improbable\nsituations that may have happened.\n2. Underpinning\nKnowledge\n2.1. Competence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2. Competence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1. Relevant equipment and operational\nprocesses\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n3. Underpinning\nSkills\n3.1. Using range of formal problem solving techniques\n3.2. Identifying and clarifying the nature of the problem\n3.3. Devising the best solution\n3.4. Evaluating the solution\n3.5. Implementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 19 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n17\n4. Resource\nImplications\n4.1. Assessment will require access to an operating plant\nover an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios / case\nstudies / what ifs will be required as well as bank of\nquestions which will be used to probe the reason\nbehind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context for\nAssessment\n6.1. In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 20 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n18\nUNIT TITLE\n: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills,\nand attitude required in selecting, sourcing and applying\nappropriate\nand\naffordable\ntechnologies\nin\nthe\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the\nRange of Variables\n\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different technologies is determined based\non job requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced\nas per established industry practices\n\n3. Maintain/enhance\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance\nwith the industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to ensure\nits operative ability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance with job\nrequirement\n3.3 Technology failure/ defect is immediately reported to\nthe concerned/responsible person or section for\nappropriate action\n\n--- PDF PAGE 21 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5\nTraining technology\n2. Management\nconcepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5S\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard\noperating procedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2\nVerbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1 Written instruction/manuals of specific technology/\nequipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health\nand safety\nprocedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n20\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning Skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nAssessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n21\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY FOOD SAFETY AND SANITATION\n\nUNIT CODE\n : AGR741201\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes required\nto apply food safety and sanitation in the workplace\n\n ELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the Range of\nVariables\n11. Wear Personal\nProtective Equipment\n\n1.1 Personal protective equipment are checked\naccording to manufacturer’s specifications\n\n1.2 Personal protective equipment are worn\naccording to the job requirement\n2. Observe Personal\nHygiene and Good\nGrooming\n2.1 Personal hygiene and good grooming is practiced in\nline with workplace health and safety\nrequirements\n3. Implement Food\nSanitation Practices\n\n3.1 Sanitary food handling practices are implemented\nin line with workplace sanitation regulations\n\n3.2 Safety measures are observed in line with\nworkplace safety practices.\n4. Render Safety\nMeasures and First Aid\nProcedures\n\n4.1 Safety measures are applied according to\nworkplace rules and regulations\n\n4.2 First aid procedures are applied and coordinated\nwith concerned personnel according to workplace\nstandard operating procedures.\n5. Implement\nhousekeeping activities\n\n5.1 Work area and surroundings are cleaned in\naccordance with workplace health and safety\nregulations\n\n5.2 Waste is disposed according to organization’s\nwaste disposal system\n\n5.3 Hazards in the work area are recognized and\nreported to designated personnel according to\nworkplace procedures\n\n--- PDF PAGE 24 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n22\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Manufacturer’s\nSpecifications\nManufacturer’s specifications may include but not\nlimited to:\n\n1.1 Handling\n1.2 Operating\n1.3 Discharge Label\n1.4 Reporting\n1.5 Testing\n1.6 Positioning\n1.7 Refilling\n2. Personal Protective\nEquipment\nPersonal Protective Equipment may include but not\nlimited to:\n\n2.1 Apron/laboratory gown\n2.2 Mouth masks\n2.3 Gloves\n2.4 Rubber boots/safety shoes\n2.5 Head gears such as caps, hair nets, ear plug\n3. Workplace Health and\nSafety Requirements\nWorkplace and Safety Requirements may include:\n\n3.1 Health/Medical Certificate\n3.2 DOLE requirements\n3.3 BFAD requirements\n3.4 Personal Hygiene and good grooming\n3.5 Plant Sanitation and waste management\n4. Safety Measures\nSafety measures may include but not limited to:\n\n4.1 Labeling of chemicals and other sanitizing agents\n4.2 Installation of fire fighting equipment in the work\narea\n4.3 Installation of safety signages and symbols\n4.4 Implementation of 5S in the work area\n4.5 Removal of combustible material in the work area\n\n5. First Aid Procedures\nFirst Aid Procedures may include but not limited to:\n\n5.1 Mouth to mouth resuscitation\n5.2 CPR\n5.3 Application of tourniquet\n5.4 Applying pressure to bleeding wounds or cuts\n5.5 First aid treatment for burned victims\n\n--- PDF PAGE 25 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n23\n6. Hazards\nHazards in the workplace may include but not limited\nto:\n\n6.1 Physical\n6.2 Biological\n6.3 Chemical\n\n--- PDF PAGE 26 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n24\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Cleaned, checked and sanitized personal protective\nequipment\n1.2 Practiced proper personal hygiene and good\ngrooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the\nwork area\n2. Underpinning\nKnowledge\n2.1 Safety Practices\n2.1.1 Proper waste disposal\n2.1.2 Environmental protection and concerns\n2.1.3 Food safety principles and practices\n2.1.4 Good grooming and personal hygiene\n\n 2.2 Codes and Regulations\n2.2.1 TQM and other food quality system principles\n2.2.2 ISO, HACCP, EMS, 5S\n2.2.3 Good Food Manufacturing Practices\n\n2.3 Equipment: Uses and Specifications\n2.3 1 Parts and functions of personal protective\nequipment\n2.3.2 First Aid Kit\n2.3.3 Sanitizing equipment\n\n2.4 Basic microbiology including types of\nmicroorganisms and its control\n3. Underpinning Skills\n3.1 Sanitary food handling practices\n3.2 Implementing housekeeping activities\n3.3 Applying first aid treatment\n3.4\nCoordination skills\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 A combination of direct observation and\nquestioning of a candidate processing foods.\n5. Resource Implications\n\nThe following resources must be provided:\n5.1 Work area/station\n5.2 First Aid kit\n5.3 PPE relevant to the activities\n5.4 Fire extinguisher\n5.5 Stretcher\n5.6 Materials, tools and equipment relevant to the unit of\ncompetency\n6. Context of Assessment 6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 27 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n25\n\nUNIT OF COMPETENCY: USE STANDARD MEASURING DEVICES AND\nINSTRUMENTS\n\nUNIT CODE\n : AGR741202\n\nUNIT DESCRIPTOR: This unit deals with the knowledge, skills and attitudes\nrequired to use standard measuring devices, instruments in\nthe workplace\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the Range\nof Variables\n1. Identify Standard Measuring\nDevices and Instruments\n\n1.1 Standard measuring devices and\ninstruments are identified according to\nmanufacturer’s specifications\n\n1.2 Devices and instruments for measuring are\nproperly checked, sanitized and calibrated prior\nto use\n2. Review the Procedures in\nUsing Standard Measuring\nDevices and Instruments\n2.1 Procedures in using the standard measuring\ndevices and instruments are recalled according\nto manufacturer’s specifications\n\n2.2 Printed procedures/brochures/catalogues are\nconsulted according to specified food\nprocessing methods\n3. Follow Procedures of Using\nMeasuring Devices and\nInstruments\n\n3.1 Methods/practices of using measuring devices\nand instruments are strictly observed according\nto manufacturer’s specifications and workplace\nrequirements\n\n3.2 Measuring devices and instruments are cleaned,\nwiped dry and stowed after use to ensure\nconformity with workplace requirements\n\n--- PDF PAGE 28 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n26\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Standard Measuring\nDevices\nStandard Measuring Devices may include but not\nlimited to the following:\n\n1.1 Weighing scales and balances of various\ncapacities and sensitivities\n1.2 Measuring cups of varying capacities for dry\ningredients\n1.3 Measuring cups of varying capacities for liquid\ningredients\n2. Standard Measuring\nInstruments\nStandard Measuring Instruments may include but\nnot limited to the following:\n\n2.1 Salinometer\n2.2 Thermometers of varying temperature range\n( 0-300 C )\n2.3 Refractometer of varying range ( 0 – 90 B)\n2.4 Glasswares like cylinders, beakers, flasks of\nvarying graduations\n3. Food Processing Methods\nFood Processing Methods include the following:\n\n3.1 Process foods by Salting, Curing and Smoking\n3.2 Process foods by Fermentation and Pickling\n3.3 Process foods by Canning and Bottling\n3.4 Process foods by Sugar Concentration\n3.5 Process foods by Drying and Dehydration\n\n--- PDF PAGE 29 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n27\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Identified, prepared and calibrated standard\nmeasuring devices and instruments\n1.2 Followed correctly the procedures in using\nstandard measuring devices and instruments\n1.3 Followed proper cleaning and sanitizing and\nstowing procedures of measuring devices and\nequipment before and after use\n2. Underpinning Knowledge\n2.1 Safe handling of measuring devices and\ninstruments\n2.2 Specifications and functions of measuring devices\nand instruments\n2.3 Defects and breakages of measuring devices and\ninstruments\n2.4 Procedures in cleaning, sanitizing and calibrating\nand stowing equipment and instruments\n3. Underpinning Skills\n\n3.1 Communication skills\n3.2 Calibrating skills\n3.3 Sanitary handling of devices and instruments\n3.4 Measuring devices and instruments\n3.5 Stowing measuring devices and instruments\n4. Methods of Assessment\nCompetency in this unit must be assessed through:\n\n4.1 Direct observation and questioning of a\ncandidate\nusing\nmeasuring\ndevices\nand\ninstruments\n5. Resource Implications\nThe following resources must be provided:\n\n5.1 Work area/station\n5.2 Materials, tools and equipment relevant to the\nUnit of Competency\n6. Context of Assessment\n6.1 Assessment should occur on the job or in a\nsimulated workplace\n\n--- PDF PAGE 30 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n28\n\nUNIT OF COMPETENCY: USE FOOD PROCESSING TOOLS, EQUIPMENT AND\nUTENSILS\n\nUNIT CODE\n: AGR741203\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to operate food processing tools, equipment and\ninstruments in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the\nRange of Variables\n1. Perform Pre-\nOperation Activities\n1.1 Appropriate tools and equipment/utensils are\nassembled according to food processing methods\n\n1.2 Food processing tools and equipment/utensils\nare inspected and checked according to\nmanufacturer’s specifications\n\n1.3 Food processing equipment is set up, adjusted and\nreadied according to job requirements\n2. Operate Food\nprocessing Equipment\n\n2.1 Food processing equipment is switched on\naccording to manufacturer’s specifications\n\n2.2 Performance of food processing equipment is\nchecked to ensure conformity with specified output\n\n2.3 Operation of food processing equipment is\nmanaged to achieve planned outcomes\n\n2.4 Minor trouble shooting on food processing tools,\nequipment and utensils is performed when\nnecessary\n3. Perform Post-\nOperation Activities\n3.1 Food processing equipment is switched off and\nunplugged after operation in accordance with\nmanufacturer’s specifications\n\n3.2 Food processing tools, equipment and instruments\nare cleaned, sanitized and stowed as required\naccording to manufacturer’s specifications and\nworkplace policies and regulations\n\n3.3 Minor preventive maintenance on equipment is\nperformed in line with organization’s maintenance\nsystem\n\n--- PDF PAGE 31 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n29\n\n3.4 Main machine parts are inspected and checked in\nline with organization’s policy\n\n3.5 Condition of machine is monitored to ensure\nserviceability in accordance with workplace rules\nand regulations\n\n--- PDF PAGE 32 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n30\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Food Processing Methods\nFood Processing Methods include:\n\n1.1 Salting\n1.2 Curing\n1.3 Smoking\n1.4 Fermentation\n1.5 Pickling\n1.6 Canning\n1.7 Bottling\n1.8 Sugar concentration\n1.9 Drying\n1.10 Dehydration\n2. Food Processing Tools,\nEquipment and Utensils\nTools, Equipment and Utensils used for the following\nfood processing methods:\n\n2.1 Salting\n2.2 Curing\n2.3 Smoking\n2.4 Fermentation\n2.5 Pickling\n2.6 Canning\n2.7 Bottling\n2.8 Sugar concentration\n2.9 Drying\n2.10 Dehydration\n3. Manufacturer’s\nSpecifications\nManufacturer’s specifications may include but not\nlimited to:\n\n3.1 Handling requirements\n3.2 Operating requirements\n3.3 Discharge Label\n3.4 Reporting\n3.5 Testing\n3.6 Positioning\n3.7 Refilling\n\n--- PDF PAGE 33 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n31\n\n4. Minor Preventive Machine\nMaintenance\nMinor Preventive Machine Maintenance may include\nbut not limited to checking of the following:\n\n4.1 Machine temperature\n4.2 Hydraulic fluid\n4.3 Wear and surface condition\n4.4 Crack\n4.5 Leak detection\n4.6 Vibration\n4.7 Corrosion/erosion\n4.8 Electric insulation\n5. Condition of Machine\n5.1 Serviceable\n5.2 Repairable\n5.3 Defective\n\n--- PDF PAGE 34 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n32\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Assembled, inspected, checked and sanitized\nappropriate tools and equipment/instruments\n1.2 Set-up, adjusted and readied tools and equipment\nand instruments according to requirements\n1.3 Operated and monitored performance of equipment\nto ensure specified output\n1.4 Performed post operation activities\n1.5 Performed minor trouble shooting on food\nprocessing tools, equipment and utensils\n2. Underpinning Knowledge\n2.1 Equipment, tools and instruments: Uses and\nSpecifications\n2.2 Equipment, tools and instruments: Parts and\nFunctions\n2.3 Sanitizing agents: Uses and Specification\n2.4 Minor preventive maintenance\n2.5 Proper stowing of tools and equipment/instruments\n2.6 Minor trouble shooting\n2.7 Interpreting manufacturer’s specifications\n2.8 Equipment/machine wear and tear process\n3. Underpinning Skills\n3.1 Equipment/machine parts tear down and assembly\n3.2 Inspecting and checking condition of\nequipment/machines before, during and after\noperation\n3.3 Performing minor trouble shooting\n3.4 Performing minor preventive maintenance\n3.5 Reporting equipment/machine, tools, instruments\nbreakdown and recording same in standard forms\n4. Methods of Assessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation and questioning of a candidate\noperating\nfood\nprocessing\ntools\nand\nequipment/instruments\n4.2 Submission of written report on the performance\nand condition of equipment/machine, tools,\ninstruments used.\n5. Resource Implications\nThe following resources must be provided:\n\n5.1 Work area/station\n5.2 Materials, tools and equipment relevant to the Unit\nof Competency\n6. Context of Assessment\n6.1 Assessment should occur on the job or in a\nsimulated workplace\n\n--- PDF PAGE 35 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n33\n\nUNIT OF COMPETENCY : PERFORM MATHEMATICAL COMPUTATIONS\n\nUNIT CODE\n\n: AGR741204\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes to\nperform mathematical computations in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the\nRange of Variables\n1. Gather and Tabulate the\nRecorded Data\n1.1 Records of weights and measurements of raw\nmaterials and ingredients are gathered and\nsummarized according to workplace standard\noperating procedures\n\n1.2 Records of weights and measurements of finished\nprocessed products are gathered and\nsummarized according to workplace standard\noperating procedures\n\n1.3 Summarized data are tabulated according to\nenterprise requirements\n2. Review the Various\nFormulations\n2.1 Raw materials and ingredients and percentage\nformulations are checked/counter checked\naccording to approved specifications and\nenterprise requirements\n\n2.2 Finished products and percentage formulations\nare reviewed according to approved\nspecifications and enterprise requirements\n3. Calculate Production\nInput and Output\n3.1 Data on raw material consumption and\ncorresponding percentage equivalent are\ncalculated in line with enterprise requirements\n\n3.2 Data on actual spoilage and rejects and\ncorresponding percentage equivalents are\ncalculated according to enterprise requirements\n\n3.3 Data on actual yields and recoveries and\ncorresponding percentage equivalents are\ncalculated according to enterprise requirements\n\n3.4 All calculated data are recorded according to\nenterprise requirements\n\n--- PDF PAGE 36 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n34\n4. Compute Production Cost\n4.1 Costs of production are computed according to\norganization’s standard procedures\n\n4.2 Computed costs of production are reviewed and\nvalidated according to organization’s production\nrequirements\n\n--- PDF PAGE 37 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n35\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Weights and\nMeasurements\nWeights and Measurements may include:\n\n1.1 Gravimetric\n1.2 Volumetric\n1.3 Lengths, diameters, widths\n1.4 Seam measurements\n1.5 Hotness/coldness ( temperature)\n1.6 Concentrations of solutions\n2. Costs of Production\nCosts of production are computed using the following:\n\n2.1 Ingredient formulation\n2.2 Percentage formulation\n2.3 Conversion\n2.4 Ratios and proportion\n2.5 Spoilage and rejects and corresponding\npercentages\n2.6 Recoveries and yields and corresponding\npercentages\n\n--- PDF PAGE 38 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n36\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Gathered the records of weights and\nmeasurements of raw materials/ingredients\nand finished processed products\n1.2 Summarized and tabulated all raw data\ngathered\n1.3 Calculated the production inputs and outputs\n1.4 Computed the costs of production\n1.5 Reviewed all formulations and concentrations\nof solutions according to specifications and\nstandards of the enterprise\n2. Underpinning Knowledge\n2.1 Mensuration\n2.2 Percentage formulation\n2.3 Fraction, ratios and proportions\n2.4 Basic Mathematical Operations\n2.5 Conversion factors\n3. Underpinning Skills\n3.1 Basic Mathematical skills\n3.2 Basic Accounting skills\n3.3 Recording skills\n3.4 Data Gathering skills\n4. Methods of Assessment\nCompetency in this unit must be assessed\nthrough:\n\n4.1 A combination of direct observation and\nquestioning of a candidate computing costs of\nproduction\n4.2 Submission of a written report showing a\nrecord of production data including raw data\n5. Resource Implications\nThe following resources should be provided:\n\n5.1 Work area/station\n5.2 Materials relevant to recording and\ndocumentation of production data\n5.3. Computer with printer and software\n5.4 Calculator\n5.5 Work table\n6. Context of Assessment\n6.1 Assessment should occur on the job or in a\nsimulated workplace\n\n--- PDF PAGE 39 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n37\n\nUNIT OF COMPETENCY: IMPLEMENT GOOD MANUFACTURING PRACTICE\nAND PROCEDURES\n\nUNIT CODE : AGR741205\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to comply with relevant Good Manufacturing Practice\n(GMP) codes through the implementation of workplace GMP\nand quality procedures\n\nELEMENT\nPERFORMANCE CRITERIA\n Bold Italicized terms are elaborated in the\nRange of Variables\n1. Identify\nrequirements of\nGMP related to\nown work\n1.1. Sources of information on GMP requirements are located\n1.2. GMP requirements and responsibilities related to own\nwork are identified\n2. Observe personal\nhygiene and\nconduct to meet\nGMP requirements\n2.1. Personal hygiene meets GMP requirements\n2.2. Clothing is prepared, used, stored and disposed of\naccording to GMP and workplace procedures\n2.3. Personal movement around the workplace complies with\narea entry and exit procedures\n3. Implement GMP\nrequirements when\ncarrying out work\nactivities\n3.1. GMP requirements are identified\n3.2. Work area, materials, equipment and product are\nroutinely monitored to ensure compliance with GMP\nrequirements\n3.3. Raw materials, packaging components and product are\nhandled according to GMP and workplace procedures\n3.4. Workplace procedures to control resource allocation and\nprocess are followed to meet GMP requirements\n3.5. Common forms of contamination are identified and\nappropriate control measures are followed according to\nGMP requirements\n3.6. The workplace is maintained in a clean and tidy order to\nmeet GMP housekeeping standards\n\n--- PDF PAGE 40 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n38\n4. Participate in\nimproving GMP\n4.1. Processes, practices or conditions which could result in\nnon-compliance with GMP are identified and reported\naccording to workplace reporting requirements\n4.2. Corrective action is implemented within level of\nresponsibility\n4.3. GMP issues are raised with designated personnel\n5. Participate in\nvalidation\nprocesses\n5.1. Validation procedures are followed to meet GMP\nrequirements\n5.2. Issues arising from validation are raised with designated\npersonnel\n5.3. Validation procedures are documented to meet GMP\nrequirements\n6. Complete\nworkplace\ndocumentation to\nsupport GMP\n6.1. Documentation and recording requirements are identified\n6.2. Information is recorded according to workplace\nreporting procedures to meet GMP requirements\n\n--- PDF PAGE 41 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH&S\nrequirements may\ninclude:\n1.1. OH&S legal requirements\n1.2. Enterprise OH&S policies, procedures and programs\n2. Work is carried out\nin accordance with\nregulations.\nRegulatory\nrequirements may\ninclude:\n2.1. Relevant regulations regarding food processing and food\nsafety regulations\n2.2. Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n2.3. Environment Management Bureau regulations regarding\nemissions, waste treatment, noise and effluent treatment\nand control\n3. Hygiene and\nsanitation\nrequirements may\ninclude:\n3.1. Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n3.2. Requirements set out by Bureau of Food and Drugs\n3.3. Workplace requirements\n4. Workplace\nrequirements may\ninclude:\n4.1. Work instructions\n4.2. Standard operating procedures\n4.3. OH&S requirements\n4.4. Quality assurance requirements\n4.5. Equipment manufacturers’ advice\n4.6. Material Safety Data Sheets\n4.7. Codes of Practice and related advice\n5. Products may\ninclude\n5.1. Products, raw materials, packaging components and\nconsumables, part-processed product, finished product\nand cleaning materials\n6. Responsibility and\nreporting systems\n6.1. Responsibility for applying Good Manufacturing Practice\nrelates to the person’s work area\n6.2. Reporting systems may include electronic and manual\ndata recording and storage systems\n\n--- PDF PAGE 42 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n40\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1. Located and followed workplace information relating to\nGMP responsibilities\n1.2. Maintained personal hygiene consistent with GMP\n1.3. Followed workplace procedures when moving around\nthe workplace and/or from one task to another to\nmaintain GMP\n1.4. Used, stored and disposed of appropriate\nclothing/footwear as required by work tasks and\nconsistent with GMP\n1.5. Identified and reported situations that do or could\ncompromise GMP\n1.6. Applied appropriate control measures to control\ncontamination\n1.7. Recorded results of monitoring, and maintain records\nas required by GMP\n1.8. Followed validation procedures within level of\nresponsibility\n1.9. Identified and responded to out-of-specification or\nunacceptable raw materials, packaging components,\nfinal or part processed product within level of\nresponsibility\n1.10. Followed procedures to isolate or quarantine non-\nconforming product\n1.11. Handled, cleaned and stored equipment, utensils, raw\nmaterials, packaging components and related items\naccording to GMP and workplace procedures\n1.12. Maintained GMP for own work\n1.13. Handled and/or disposed of out-of-specification or\ncontaminated materials, packaging\ncomponents/consumables and product, waste and\nrecyclable material according to GMP as required by\nwork responsibilities\n1.14. Maintained the work area in a clean and tidy state\n1.15. Identified and reported signs of pest infestation\n2. Underpinning\nKnowledge and\n2.1. The role of GMP in preventing contamination, its\nrelationship to legislative responsibilities and potential\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n41\nAttitudes\nimplications of non-compliance\n2.2. GMP arrangements in the workplace. This includes\nawareness of relevant GMP codes of practice and\nrelated workplace policies and procedures to\nimplement these responsibilities\n2.3. The relationship between GMP and the quality system,\npersonnel responsible for designing and managing\nGMP, personal role to maintain GMP, the role of\ninternal and external auditors as appropriate\n2.4. Procedures followed to investigate contamination\nevents and performance improvement processes\n2.5. Personal clothing and footwear requirements for\nworking in and/or moving between work areas\n2.6. Personal clothing use, storage and disposal\nrequirements\n2.7. Awareness of common micro biological, physical and\nchemical contaminants relevant to the work process.\nThis includes the types of contamination likely to occur,\nthe conditions under which they occur, possible\nconsequences and control methods to prevent\noccurrence\n2.8. Food preservation methods including smoking, drying,\nfreezing, use of low and high temperatures, use of\npreservatives, radiation\n2.9. Basic concepts of quality assurance including quality\nspecifications, operating parameters, validation\nprocedures and control methods. This includes an\nunderstanding of related documentation including\nStandard Operating Procedures and/or batch\ninstructions\n2.10. Control methods and procedures used in the work area\nto maintain GMP. This includes an understanding of\nthe purpose of control, the consequences if not\ncontrolled and the method of control where relevant. It\nmay include an understanding of methods used to\nmonitor process control; purpose and requirements of\nvalidation procedures; and purpose of equipment\ncalibration\n2.11. GMP responsibilities and requirements relating to work\nrole\n2.12. Basic understanding of the properties, handling and\nstorage requirements of raw materials, packaging\ncomponents and final product handled and used\n\n--- PDF PAGE 44 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n42\n2.13. Standards for materials, equipment and utensils used\nin the work area\n2.14. Recall and traceability procedures relevant to work role\n2.15. Procedures for responding to out-of-specification or\nunacceptable performance/outcomes. This includes\nprocedures for identifying or isolating materials or\nproduct of unacceptable quality\n2.16. Purpose of keeping records and the recording\nrequirements of GMP. This includes an understanding\nof product and materials traceability procedures\n2.17. Housekeeping requirements and responsibilities\nrelating to own work. Where relevant this includes use\nand storage of housekeeping/cleaning equipment\n2.18. Waste collection, recycling and handling procedures\nrelevant to own work responsibilities\n2.19. Responsibilities for reporting and recording quality\ninformation\n3. Underpinning Skills\n3.1. Planning and organizing work (time management)\n3.2.\nWorking with others and in teams\n4. Resource\nImplication\nThe following resources should be provided:\n4.1. Workplace location and access to workplace policies\n4.2.\nMaterials relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency in this unit must be assessed using at least two\n(2) of the following methods:\n5.1. A\ncombination\nof\ndirect\nobservation\nand\noral\nquestioning\n5.2. Written report\n5.3. Written Test\n5.4.\nPortfolio\n6. Context of\nAssessment\nAssessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 45 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n43\n\nUNIT OF COMPETENCY: IMPLEMENT ENVIRONMENTAL POLICIES AND\n PROCEDURES\n\nUNIT CODE : AGR741206\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to implement environmental policies and procedures\nwhen carrying out work responsibilities\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the Range of\nVariables\n1. Conduct work in\naccordance with\nenvironmental\npolicies and\nprocedures\n1.1. Immediate work area is routinely checked to ensure\ncompliance with environmental requirements\n1.2. Hazards and unacceptable performance are identified,\nremoved and/or reported to appropriate personnel\naccording to workplace procedures\n1.3. Workplace procedures and work instructions are\nfollowed\n1.4. Where control requirements are not met, incidents are\npromptly reported and corrective action is taken\n1.5. Measures used to minimize and handle waste are\nfollowed\n1.6. Environmental data is recorded in required format\naccording to workplace reporting requirements\n2. Participate in\nimproving\nenvironmental\npractices at work\n2.1. Processes or conditions which could result in an\nunacceptable environmental outcome are identified and\nreported according to workplace reporting requirements\n2.2. Corrective action is taken in accordance with the\nenvironmental management and emergency response\nplans as required\n2.3. Contributions are made to a participative arrangements\nfor managing environmental issues in the workplace\nwithin workplace procedures and level of responsibility\n\n--- PDF PAGE 46 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n44\n3. Respond to an\nenvironmental\nemergency\n3.1. Emergency situations are identified and reported\naccording to workplace reporting requirements\n3.2. Emergency procedures are followed as appropriate to\nthe nature of the emergency and according to workplace\nprocedures\n\n--- PDF PAGE 47 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n45\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. OH&S\nrequirements may\ninclude:\n1.1. OH&S legal requirements\n1.2. Enterprise OH&S policies, procedures and programs\n2. Work in carried out\nin accordance with\nregulations.\nRegulatory\nrequirements may\ninclude:\n2.1. Relevant regulations regarding food processing and food\nsafety regulations\n2.2. Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n2.3. Environment Management Bureau regulations regarding\nemissions, waste treatment, noise and effluent treatment\nand control\n3. Hygiene and\nsanitation\nrequirements may\ninclude:\n3.1. Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n3.2. Requirements set out by Bureau of Food and Drugs\n3.3. Workplace requirements\n4. Workplace\nrequirements may\ninclude:\n4.1. Work instructions\n4.2. Standard operating procedures\n4.3. OH&S requirements\n4.4. Quality assurance requirements\n4.5. Equipment manufacturers’ advice\n4.6. Material Safety Data Sheets\n4.7. Codes of Practice and related advice\n5. Identification and\ncontrol of hazards\nmay include:\n5.1. Procedures are available that outline appropriate\nresponse to environmental incidents, accidents and\nemergencies\n5.2. At this level identification and control of environmental\nhazards relates to own work. Corrective action typically\ninvolves recognizing any event which occurs as part of\nthe work process and presents an unacceptable\nenvironmental risk or outcome, taking corrective action\nwithin level of responsibility, and/or reporting to the\nappropriate person in the work area\n5.3. Work responsibilities may involve handling of hazardous\nwaste\n\n--- PDF PAGE 48 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n46\n5.4. An environmental hazard is any activity, product or\nservice that has the potential to affect the environment.\nThis may also be referred to as an environmental aspect\n5.5. An environmental risk is the likelihood that the hazard\ncan cause harm to the environment\n5.6. A control measure is a method or procedure used to\nprevent or minimize environmental risks\n5.7. Responsibility for identifying and controlling\nenvironmental risks relates to immediate work\nresponsibilities\n5.8. Participating in improvement may involve participation in\nstructured improvement programs, one-off projects and\nday-to-day problem solving and consultative groups\n\n--- PDF PAGE 49 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n47\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1. Accessed and applied workplace information on\nenvironmental policies and procedures relating to own\nwork\n1.2. Fitted and used appropriate personal protective clothing\nand equipment\n1.3. Checked own work area to identify environmental\nhazards\n1.4. Reported hazards according to workplace procedure in a\nclear and timely manner\n1.5. Followed work procedures to control or minimize\nenvironmental risk. This may include monitoring\nparameters set for environmental aspects such as\nairborne particulate, noise, and water quality. It may also\ninclude demonstrating use of emergency equipment\naccording to work role requirements\n1.6. Recorded environmental information as required by the\nenvironmental management program\n1.7. Participated in processes to raise issues and\nsuggestions to improve environmental issues\nmanagement. This requires appropriate communication\nskills to structure and present information and interact\nwith others\n1.8. Followed procedures to collect, deposit, recycle and/or\ndispose of waste in own work area\n1.9. Followed procedures to respond to environmental\nemergencies such as spills and emissions. This may\ninclude following procedures to alert the appropriate\nemergency services\n1.10.Maintained housekeeping standards in work area\n2. Underpinning\nKnowledge and\nAttitudes\n2.1. Workplace approach to managing environmental issues.\nThis includes awareness of relevant work procedures,\npersonnel responsible for environmental issues,\nconsultative arrangements for reporting and improving\nenvironmental practices and may include an\nunderstanding of the role of internal and external\nauditors as appropriate\n2.2. Responsibilities of self and employer to manage\nenvironmental issues on site. This includes an\nawareness of any license or agreements in place with\n\n--- PDF PAGE 50 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n48\nresource management authorities and the purpose of\nthese arrangements\n2.3. Sources of advice on environmental issues in the\nworkplace\n2.4. Environmental hazards and risks associated with the\nwork carried out. Examples may include water pollution,\nair pollution, noise, waste handling, emergencies such as\nspills, and hazardous chemicals or waste\n2.5. Work procedures as they relate to environmental\nresponsibilities. This includes use of appropriate\npersonal protective clothing and equipment as required\n2.6. Procedures used to prevent or control environmental\nrisks associated with own work. Where this requires use\nof emergency equipment, this includes understanding\nthe purpose, capacity and limitations of equipment,\nlocation and storage requirements and safe handling and\nequipment use\n2.7. Basic concepts of hazard identification, risk assessment\nand control options. This includes an understanding of\nthe hierarchy of hazard control\n2.8. Workplace procedures for identifying and responding to\nhazards, investigating incidents and improving\nenvironmental management and resource utilisation\n2.9. Impact of work practices on resource utilisation and\nwastage\n2.10. Procedures used to handle and dispose of waste\naccording to workplace requirements. This includes an\nawareness of the need to separate solid and liquid\nwaste, and remove waste in solid form rather than\nhosing down drains. It may also include an\nunderstanding of handling requirements for hazardous\nwaste\n2.11. The difference between trade waste and storm water\ndrains\n2.12. Consequences of inappropriate waste handling and\ndisposal\n2.13. Procedures for responding to unplanned incidents such\nas spills and leaks as relevant to the work area\n2.14. Emergency response system and procedures\n2.15. Responsible use of resources in own work area\n2.16. Reporting procedures and responsibilities\n2.17.Consultative processes in the workplace for raising\n\n--- PDF PAGE 51 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n49\nissues/suggestions on environmental issues\n3. Underpinning\nSkills\n3.1. Planning and organizing work (time management)\n3.2. Working with others and in teams\n4. Resource\nImplication\nThe following resources should be provided:\n4.1. Workplace location and access to workplace policies\n4.2. Materials relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency in this unit must be assessed using at least two\n(2) of the following methods:\n5.1. A combination of direct observation and oral questioning\n5.2. Written report\n5.3. Written Test\n5.4. Portfolio\n6. Context of\nAssessment\nAssessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 52 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n50\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE AND STORE STOCK\n\nUNIT CODE : AGR741312\n\nUNIT DESCRIPTOR: This unit involves the skills, knowledge and attitude\nrequired to assist in the receipt and storage of stock for a\nprocessing concern. It involves assistance in taking\ndelivery of stock, storing the received stock, rotating and\nmaintaining stock in accordance with relevant regulatory\nand workplace procedures, and completing required\ndocumentation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the Range of\nVariables\n1. Take delivery of stock\n1.1. Incoming stock is checked against orders and\ndelivery documentation in accordance with\nworkplace procedures\n1.2. Items are subjected to inspection, and variations\nare communicated to the appropriate person in line\nwith workplace procedures\n1.3. All records are completed in accordance with\nworkplace procedures\n2. Store stock\n2.1. All stocks are promptly and safely transported to\nappropriate storage area and stored according to\nworkplace procedures\n2.2. Appropriate personal protection equipment is\nused according to OHS requirements and\nworkplace procedures\n2.3. Stock levels are recorded in accordance with\nworkplace procedures\n2.4. Stock is labeled in accordance with workplace\nprocedures\n3. Rotate and maintain\nstock\n3.1. Stock is rotated, or moved using appropriate\nequipment, where necessary, in accordance with\nworkplace procedures and OHS requirements\n3.2. Stock quality is checked, and out-of-specification\nstocks are reported according to workplace\nprocedures\n3.3. Stock is placed in storage or disposed of in\naccordance with workplace procedures and\nlegislations\n3.4. All required records and documentation are\ncompleted in accordance with workplace procedures\n\n--- PDF PAGE 53 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n51\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include but not limited to:\n1.1. Raw materials\n1.2. Goods in process\n1.3. Finished products\n1.4. Packaging materials and supplies\n1.5. Tools and equipment\n1.6. Office and stationery supplies\n1.7. Forms, brochures and documents\n1.8. Vouchers and tickets\n2. Workplace\nprocedures\nMay include but not limited to:\n2.1. Standard operating procedures\n2.2. Workplace operations manual\n2.3. Occupational health and safety (OHS) procedures\n2.4. Manufacturers' advice\n2.5. Standard forms and reports\n2.6. Written or verbal instructions\n2.7. Workplace quality and customer service standards\n3. Inspection\nItems are inspected for the following:\n3.1. Damage\n3.2. Quality\n3.3. “Use-by / Best before” dates\n3.4. Breakages\n3.5. Discrepancies\n4. Records\nMay include but not limited to:\n4.1. Name of warehouseman\n4.2. Date of delivery\n4.3. Type of stock\n4.4. Stock codes\n4.5. Quantity\n4.6. Quality specifications\n4.7. “Use by/ Best before” dates\n4.8. Supplier information\n4.9. Reports re: out-of-specification deliveries, as\nnecessary\n4.10. Receipts and withdrawals\n5. Personal protective\nequipment (PPE)\nMay include but not limited to:\n5.1 Gloves\n5.2 Safety headwear and footwear\n5.3 Safety glasses\n5.4\nProper work clothes\n6. OHS requirements\nOccupational Health and Safety requirements may include:\n6.1 Health/medical certificate\n\n--- PDF PAGE 54 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n52\n6.2 DOLE requirements\n6.3 Personal hygiene and good grooming\n6.4 Plant sanitation and waste management\n6.5 BFAD requirements\n6.6 PPE requirements\n\n--- PDF PAGE 55 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n53\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. took delivery of stock\n1.2. stored stock\n1.3. rotated and maintained stock\n1.4. followed work procedures\n1.5. completed required documentation\n\nThe skills and knowledge required in receiving and storing\nstock must be transferable to a different work environment.\n2. Underpinning\nKnowledge and\nAttitude\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1. Basic knowledge of relevant stock\n2.2. Interpretation of workplace specifications and orders\nfor supplies\n2.3. Stock security systems\n2.4. Safe lifting, handling and storage procedures\n2.5. Warehouse plan/layout\n2.6. Protocols and procedures for liaising with supplier\nrepresentatives, drivers and colleagues using\nappropriate technology\n2.7. Relevant OHS and environmental regulations and\nprocedures\n2.8. Relevant codes of practice and legislative\nrequirements (for example dangerous goods\nregulations, health and hygiene regulations, etc.)\n2.9. Completion of relevant records/documentation\n\n2.10. Attitudes in the workplace should include:\n2.10.1 Honest\n2.10.2 Dependable\n2.10.3 Accurate\n2.10.4 Environment-conscious\n2.10.5 Positive work values\n2.10.6 Cost conscious\n2.10.7 Safety conscious\n3. Underpinning Skills\n3.1. Ability to read and interpret instructions, procedures\nand labels relevant to receiving and storing stock\n\n--- PDF PAGE 56 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n54\n3.2. Ability to select and use relevant\ncommunications/computing equipment when\nreceiving and storing stock\n3.3. Ability to select and use relevant personal protection\nequipment\n3.4. Ability to follow work procedures\n3.5. Oral and written communication skills\n3.6. Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation/Demonstration with oral\nquestioning\n4.2. Written test\n4.3. Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Specific work area/station\n5.2 Equipment and tools for receiving and storing stock\n5.3 Materials relevant to the proposed activity\n5.4 Relevant workplace procedures, schedules and\nrecords\n\n6. Context of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2 Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 57 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n55\n\nUNIT OF COMPETENCY: CONTROL AND ORDER STOCK\n\nUNIT CODE : AGR741313\n\nUNIT DESCRIPTOR:\nThis unit covers the skills, knowledge and attitude\nrequired to control and order stock for a processing\nconcern. It involves maintaining stock levels and records,\norganizing and administering stock takes, identifying\nstock losses, processing stock orders, and following up\norders.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the\nRange of Variables\n1. Maintain stock levels\nand records\n\n1.1. Stocks levels are monitored and maintained\naccording to workplace requirements and OHS\nrequirements\n1.2. Stock security systems are monitored and adjusted\nas required according to workplace requirements\n1.3. Stock re-order cycles are maintained, monitored and\nadjusted as required according to workplace\nrequirements\n1.4. Appropriate personnel are informed of their\nresponsibilities in regard to recording of stock\naccording to workplace procedures\n1.5. Stock storage and movement records are maintained\nin accordance with workplace procedures\n1.6. Stock performance is monitored and fast/slow\nmoving items are identified and reported in\naccordance with workplace procedures\n2. Organize and\nadminister stock takes\n2.1. Stock takes are organized and responsibilities\nallocated to staff in accordance with workplace\nprocedures\n2.2. Timely reports on stock take data are made in line\nworkplace requirements\n3. Identify stock losses\n\n3.1. Losses are identified, recorded and assessed\nagainst potential losses in line with workplace\nprocedures\n3.2. Avoidable losses are identified, reasons established,\nand controls recommended and implemented to\nprevent future avoidable losses according to\nworkplace procedures\n4. Process stock orders\n\n4.1. Stock orders are processed in accordance with\nworkplace procedures\n4.2. Stock ordering and recording systems are\nmaintained in line with workplace procedures\n\n--- PDF PAGE 58 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n56\n4.3. Appropriate purchase and supply agreements are\nused and details recorded in line with workplace\nrequirements\n4.4. Negotiated purchase and supply agreements are\nrecorded and filed according to workplace\nprocedures\n5. Follow up orders\n5.1. Delivery process is monitored to meet agreed\ndeadlines according to workplace procedures\n5.2. Appropriate liaison is undertaken with colleagues\nand suppliers to ensure continuity of supply\naccording to workplace procedures\n5.3. Routine supply problems are followed up or referred\nto the appropriate person in accordance with\nworkplace policy\n5.4. Stock is distributed in accordance with agreed\nallocations\n5.5. All required records and documentation are\ncompleted in accordance with workplace procedures\n\n--- PDF PAGE 59 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n57\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include but not limited to:\n1.1. Raw materials\n1.2. Goods in process\n1.3. Finished products\n1.4. Packaging materials and supplies\n1.5. Tools and equipment\n1.6. Office and stationery supplies\n1.7. Forms, brochures and documents\n1.8. Vouchers and tickets\n2. Workplace\nrequirements\nMay include but not limited to:\n2.1. standard operating procedures\n2.2. workplace operations manual\n2.3. occupational health and safety (OHS) procedures\n2.4. manufacturers' advice\n2.5. standard forms and reports\n2.6. written or verbal instructions\n2.7. workplace quality and customer service standards\n3. Records\nMay include but not limited to:\n3.1. Type of stock\n3.2. Quantity\n3.3. Quality specifications\n3.4. Use by dates\n3.5. Stock codes\n3.6. Order frequency\n3.7. Lead time\n3.8. Minimum stock levels\n3.9. Supplier information\n3.10. Reports re: out-of-specification deliveries, if\nnecessary\n\n--- PDF PAGE 60 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n58\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. maintained stock levels and records\n1.2. organized and administered stock takes\n1.3. identified stock losses\n1.4. processed stock orders\n1.5. followed work procedures\n1.6. completed records and documentation\n\nThe skills and knowledge required to control and order\nstock must be transferable to a different work environment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nBasic knowledge of relevant stock\n2.2.\nPrinciples of stock control and ordering\n2.3.\nCommon examples of stock control and ordering\ndocumentation and systems used in the workplace\n2.4.\nInterpretation of workplace specifications and\norders for supplies\n2.5.\nStock security systems\n2.6.\nSafe lifting, handling, storage and retrieval\nprocedures\n2.7.\nWarehouse plan/layout\n2.8.\nProtocols and procedures for liaising with supplier\nrepresentatives, drivers and colleagues using\nappropriate technology\n2.9.\nRelevant OHS and environmental regulations and\nprocedures\n2.10. Use of appropriate personal protective equipment\n2.11. Relevant codes of practice and legislative\nrequirements (for example dangerous goods\nregulations, health and hygiene regulations, etc.)\n2.12. Completion of relevant records/documentation\n2.13. Attitudes in the workplace should include:\n2.13.1 Honest\n2.13.2 Accurate\n2.13.3 Dependable\n2.13.4 Systematic and organized\n2.13.5 Environment-conscious\n2.13.6\nPositive work values\n\n--- PDF PAGE 61 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n59\n2.13.7 Cost conscious\n2.13.8 Safety conscious\n3. Underpinning Skills\n3.1. Ability to read and interpret instructions, procedures\nand labels relevant to controlling and ordering stocks\n3.2. Ability to select and use relevant\ncommunications/computing equipment when\ncontrolling and ordering stocks\n3.3. Ability to select and use relevant personal protection\nequipment\n3.4. Ability to follow work procedures\n3.5. Oral and written communication skills\n3.6. Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation/Demonstration with oral\nquestioning\n4.2. Written test\n4.3. Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Equipment and tools for controlling and ordering\nstock\n5.3. Materials relevant to the proposed activity\n5.4. Relevant workplace procedures, schedules and\nrecords\n6. Context of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 62 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n60\n\nUNIT OF COMPETENCY: APPLY PRODUCT KNOWLEDGE TO COMPLETE\nWORK OPERATIONS\n\nUNIT CODE : AGR741314\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to apply product knowledge to complete work\noperations in accordance with workplace requirements\nincluding identifying products in a subsection of a warehouse\nor other storage area, examining quality and reporting on\nproducts, and using inventory and labeling systems to identify\nand locate products.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the Range of\nVariables\n1. Identify products in\na subsection of a\nwarehouse or\nother storage area\n1.1 Products are identified against specified criteria in\naccordance with workplace procedures\n1.2 Storage and handling characteristics are identified\nand applied consistently\n1.3 Products are described to internal customers identifying\nfeatures which may affect location, safety or storage\nrequirements\n\n2. Examine quality\nand report on\nproducts\n2.1 Products are inspected in accordance with workplace\nquality assurance procedures\n2.2 Workplace procedures are followed to replace, return or\ndispose of stock/products which are not useable\n2.3 Non-conforming products are recorded/reported in\naccordance with workplace procedures\n\n3. Use inventory and\nlabeling systems\nto identify and\nlocate products\n3.1 Inventory and labeling systems are used to locate\nproducts within the workplace\n3.2 Goods are physically located and identified\n\n--- PDF PAGE 63 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Products\nCategories or groups of products/stock may include:\n1.1 Perishable goods\n1.2 Refrigerated products\n1.3 Temperature controlled stock\n1.4 Fragile goods\n1.5 Dangerous goods\n1.6\nOverseas export\n2. Identification\ncriteria\nDistinguishing identification criteria for products may include:\n2.1 Shape\n2.2 Size\n2.3 Color\n2.4 Bar codes\n2.5 Labels\n2.6 Traceability standards\n3. Storage and\nhandling\ncharacteristics\nThe characteristics of products/stock may include:\n3.1 Perishability\n3.2 Weight\n3.3 Form\n3.4 State\n3.5 Size\n3.6 Fragility\n3.7 Product storage and handling requirements\n4. Inventory and\nlabeling systems\nInventory systems may be:\n4.1 Automated\n4.2 Manual\n4.3 Paper-based\n4.4 Computerized\n4.5 Microfiche\nLabeling systems may include:\n4.6 Batch code\n4.7 Bar code\n4.8 Identification numbering systems\n4.9 Serial numbers\n4.10 Symbols for safe handling\n4.11 Nutritional labeling\n\n--- PDF PAGE 64 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n62\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1 Identified products/stock stored in the subsection of the\nworkplace\n1.2 Identified properties and purposes of specific categories\nof goods\n1.3 Explained the characteristics of stock in relation to\nspecific handling and storage requirements\n1.4 Interpreted and used workplace policies, procedures and\npractices in relation to product location and condition\n1.5 Used workplace maps and location guides with inventory\nsystems to physically locate goods in an efficient manner\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Codes and regulations relevant to the products being\nidentified, handled, transported, stacked and/or stored as\npart of work operations\n2.2 Relevant OHS and environmental protection procedures\nand guidelines\n2.3 Workplace procedures and policies for the identification,\nhandling, stacking and storage of particular categories of\nproducts\n2.4 Focus of operation of work systems, equipment,\nmanagement and site operating systems for the\npackaging of goods\n2.5 Categories or groups of products and the special\nhandling, stacking and storage requirements for each\n2.6 Purpose and use of cataloguing and labeling systems\n2.7 Types of equipment and storage areas appropriate for\ndifferent types of goods including perishable, fragile,\ndangerous, composition/state goods\n2.8 Housekeeping standard procedures required in the\nworkplace\n2.9 Site layout and obstacles\n2.10 Attitudes in the workplace should include:\n2.10.1\nPunctual/Time conscious\n2.10.2\nCost conscious\n2.10.3\nEnvironmental and pollution conscious\n2.10.4\nFlexible/adaptable\n2.10.5\nHonest\n2.10.6\nDependable\n2.10.7\nInnovative\n2.10.8\nAlert\n2.10.9\nSystematic and organized\n2.10.10 Committed\n\n--- PDF PAGE 65 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n63\n2.10.11 Good listener and fast learner\n2.10.12 Creative\n2.10.13 Resourceful\n2.10.14 Self–starter\n2.10.15 Decisive\n\n3. Underpinning\nSkills\n3.1 Ability to read and interpret instructions, procedures and\nlabels relevant to the handling and storage of goods\n3.2 Ability to use required personal protective clothing and\nequipment conforming to industry and OHS standards\n3.3 Ability to estimate the size, shape and special\nrequirements of goods/loads\n3.4 Locating, interpreting and applying relevant information\n3.5 Conveying information in written and oral form\n3.6 Maintaining workplace records\n3.7 Providing customer/client service and working effectively\nwith others\n3.8 Selecting and using appropriate workplace colloquial and\ntechnical language and communication technologies in\nthe workplace context\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Demonstration/Direct observation with oral questioning\n4.2 Written test\n4.3 Portfolio\n5. Resource\nImplications\nResources may include:\n5.1 Range of exercises\n5.2 Case Studies\n5.3 Simulated practical and knowledge assessments\n5.4 Range of operational and workplace situations\n\n6. Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or\nsimulated workplace environment.\n\n--- PDF PAGE 66 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n64\n\nUNIT OF COMPETENCY: PERFORM BASIC TESTS ON RAW MATERIALS, IN-\nPROCESS AND FINISHED PRODUCTS\n\nUNIT CODE : AGR741315\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to perform basic tests and/or procedures on raw\nmaterials, in-process and finished products using standard\nmethods.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the Range of\nVariables\n1. Receive, label,\nand store\nsamples for\ntesting\n1.1 Laboratory samples are labeled to ensure all required\ninformation are transcribed accurately and legibly\naccording to workplace procedures.\n1.2 Samples are registered into the laboratory system\naccording to workplace procedures..\n1.3 Sample testing requirements are recorded according to\nworkplace procedures..\n1.4 Sample integrity is maintained according to workplace\nprocedures.\n1.5 Storage condition is monitored according to workplace\nprocedures.\n1.6 Sample contamination is eliminated according to\nworkplace procedures.\n2. Prepare sample\n2.1 Materials to be tested, appropriate standard method and\nsafety requirements are identified\n2.2 Personal protective equipment is used as specified for\nstandard method and material to be tested\n2.3 Sample description is recorded and compared with\nspecification and discrepancies recorded and reported\n2.4 Sample is prepared in accordance with appropriate\nstandard methods.\n3. Perform tests on\nsamples\n3.1 Calibration status of equipment is checked and\ncalibrated if applicable.\n3.2 Perform sequence of tests to be performed as per\nstandard method\n3.3 Sample and standards to be tested are identified,\nprepared and weighed or measured\n3.4 Test reagents or equipment/instrumentation are set up\nas per standard method\n\n--- PDF PAGE 67 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n65\n3.5 Tests are conducted in accordance with enterprise\nprocedures\n3.6 Results are recorded in accordance with enterprise\nprocedures\n3.7 \"Out of specification\" or atypical results are identified and\nreported promptly to appropriate personnel\n3.8 Test equipment is cleaned and cared for.\n3.9 Unused reagents are stored as required by relevant\nregulations and codes\n3.10 Wastes are disposed in accordance with safety, industry\nand environmental requirements\n\n--- PDF PAGE 68 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n66\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Materials\nMaterials may include any one but not limited to the following:\n1.1 Fruits and vegetables\n1.2 Livestock and poultry\n1.3 Fish and other marine products\n1.4 Fats and oils\n1.5 Cereals and starches\n1.6\nSugars and sweeteners\n2. Personal\nProtective\nEquipment\nPPE requirements include:\n2.1 Apron/laboratory gown\n2.2 Mouth masks\n2.3 Gloves\n2.4 Rubber boots\n2.5\nHead gears such as caps, hairnets, ear plug\n3. Sample\npreparation\n3.1 Preparation of sample can include but not limited to:\n3.1.1 Sub-sampling or splitting using procedures such\nas riffling, coning and quartering, manual and\nmechanical splitters\n3.1.2 Physical treatments such as ashing, dissolving,\nfiltration, sieving, centrifugation and comminution.\n4. Tests\nA typical test involved in this Unit of Competency may include:\n4.1 Appearance, color, identity, freshness\n4.2 Melting points, boiling points, refractive indices, densities\nincluding compacted densities, viscosity measurements\n4.3 Ashes including sulfated ashes\n4.4 Pinhole dispersion, wet dry variation, compression\nstrength and flexural strength\n4.5 Spot tests, gravimetric tests, time/temperature, texture,\npH, dipsticks, TSS (total soluble solids), salt content, TA\n(titrable acidity), and moisture\n5. Test reagent\nTest reagents may include but not limited to prepared\nsolutions of:\n5.1 Sodium hydroxide\n5.2 Hydrochloric acid\n5.3 Sulfuric acid\n5.4 Hydrogen peroxide\n5.5 Anhydrous alcohol\n6. Test Equipment\nTest equipment may include any one of the following:\n6.1 Centrifuge\n6.2 Thermometers\n6.4 pH meter\n6.5 Color chart/Colorimeter\n6.6 Texture meter\n6.7 Weighing scales\n6.8 Refractometer\n6.9 Salinometer\n\n--- PDF PAGE 69 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n67\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1 Applied SOPs to efficiently prepare samples for test and\nanalyses\n1.2 Used safety information (eg, MSDSs) and performed\nprocedures safely\n1.3 Checked testing equipment calibration status\n1.4 Completed all tests within required timeline without\nsacrificing safety, accuracy or quality\n1.5 Calculated, recorded and presented results accurately\nand legibly\n1.6 Cleaned and maintained equipment\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Purpose of tests\n2.2 Principles of the standard methods\n2.3 Calibration procedures and their basis\n2.4 Relevant standards/specifications and their interpretation\n2.5 Recording and Interpretation of test result, including\ncalculation of results from test data where required\n2.6 Procedures for recognition of unexpected or unusual\nresults and likely causes\n2.7 OHS procedures for sample testing\n2.8 Attitudes in the workplace should include\n2.8.1 Accurate\n2.8.2 Self-esteem\n2.8.3 Punctual/Time conscious\n2.8.4 Cost conscious\n2.8.5 Environmental and pollution conscious\n2.8.6 Flexible/adaptable\n2.8.7 Honest\n2.8.8 Dependable\n2.8.9 Innovative\n2.8.10 Alert\n2.8.11 Systematic and organized\n2.8.12 Committed\n2.8.13 Good listener and fast learner\n2.8.14 Creative\n2.8.15 Resourceful\n2.8.16 Self–starter\n3. Underpinning\nSkills\n3.1 Oral and written communication skills\n3.2 Calibrating skills\n3.3 Basic computer skills\n3.4\nBasic mathematical skills ( conversion, percentage and\nformulation)\n3.5\nRecording and reporting skills\n\n--- PDF PAGE 70 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n68\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Demonstration/Direct observation with oral questioning\n4.2 Written test\n4.3 Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Standard laboratory equipped with appropriate\nequipment and calibration standards\n5.2 SOPs, calibration and testing procedures.\n5.3 Materials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should be done in the workplace or\nsimulated workplace environment.\n\n--- PDF PAGE 71 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n69\n\nUNIT OF COMPETENCY: OPERATE A BOILER\n\nUNIT CODE : AGR7413xx\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\ninvolved to start, operate, monitor, shut down and store a\nboiler under the supervision of an engineer.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the Range of\nVariables\n1. Start boiler\n1.1 Personal protective clothing and equipment is\nselected for use, following statutory requirements and\nwork place procedures\n1.2 Pre-operational safety checks are conducted in\naccordance with statutory requirements, manufacturer’s\nrecommendations and plant operating procedures\n1.3 Hazards and potential hazards in work area are\nidentified and reported in accordance with statutory\nrequirements and work place procedures\n1.4 Prevention/control measures are selected in accordance\nwith the hierarchy of control.\n1.5 Boiler is started and brought on line safely, in\naccordance with statutory requirements, manufacturer’s\nrecommendations and work place procedures\n1.6 Maintenance requirements are identified and reported\nin accordance with workplace requirements\n\n2. Operate and\nmonitor boiler\n2.1 Operating status is diagnosed and operating log is\nmaintained clearly and accurately, in accordance with\nstatutory requirements and workplace procedures\n2.2 Boiler is monitored in accordance with statutory\nrequirements, manufacturer’s recommendations and\nworkplace procedures\n2.3 Water quality tests are conducted in accordance with\nmanufacturers recommendations and workplace\nprocedures and adjusted as a result of tests to meet\nworkplace criteria\n2.4 Boiler house chemicals are stored and handled in\naccordance with statutory requirements, manufacturer’s\nrecommendations and workplace procedures\n\n--- PDF PAGE 72 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n70\n2.5 Boiler emergency is responded to in accordance with\nstatutory requirements, manufacturer’s\nrecommendations and workplace procedures\n3. Shut down and\nstore boiler\n3.1 Boiler is shut down in accordance with statutory\nrequirements, manufacturer’s recommendations and\nworkplace procedures.\n3.2 Boiler is cleaned internally and externally in accordance\nwith statutory requirements, manufacturer’s\nrecommendations and workplace procedures\n3.3 Boiler valves and fittings are removed for maintenance\nin accordance with statutory requirements,\nmanufacturer’s recommendations and workplace\nprocedures.\n3.4 Appropriate mode of storage is identified in accordance\nwith statutory requirements, manufacturer’s\nrecommendations and workplace procedures.\n3.5 Boiler is stored in accordance with statutory\nrequirements, manufacturer’s recommendations and\nworkplace procedures\n\n--- PDF PAGE 73 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n71\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Protective\nclothing and\nequipment\nRelevant personal protective equipment may include but not\nlimited to:\n1.1 Thermally insulated gloves\n1.2 Hard hat head protection\n1.3 Ear protection (muffs or plugs)\n1.4 Chemical resistant gloves and apron\n1.5 Respiratory devices\n1.6 Working protective gloves\n1.7 Eye protection\n1.8 Whole body fire-resistant clothing\n2. Pre-operational\nsafety checks\nPre-operational checks may include but not be limited to:\n2.1 Checks of feed water supply and system\n2.2 Fuel supply/heat source system\n2.3 Operation and position of boiler valves\n2.4 Boiler water level\n2.5 Combustion air supply system\n2.6 Combustion equipment\n2.7 Essential fittings\n2.8 Fire fighting equipment\n2.9 Inspection and location of explosion doors\n3. Hazards and\npotential hazards\nHazards that may be encountered in the workplace include\nbut are not limited to:\n3.1 Chemical hazards\n3.2 Thermal hazards\n3.3 Boiler low water condition\n3.4 Manual handling hazards\n3.5 Machinery guard requirements\n3.6 Leakage of steam plant\n3.7 Leakage of fuel\n3.8 Rubbish and combustibles in area\n3.9 Fumes from a liquid chemical spill\n3.10 Odor of gas\n4. Maintenance\nrequirements\nMaintenance requirements that may be encountered in the\nworkplace include but are not limited to:\n4.1 Leaking steam pipe\n4.2 Exposed electrical wiring\n4.3 Leaks in high pressure feed line\n4.4 Leaking feed pump gland\n4.5\nLeaking gauge glass mounting\n\n--- PDF PAGE 74 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n72\n4.6 Defective lighting in the workplace\n4.7 Leaking safety valve\n4.8 Lockout tags.\n5. Operating log\nInformation contained in the operating log may include:\n5.1 Time in use\n5.2 Steam pressure\n5.3 Chemical treatment\n5.4 Test results\n5.5 Maintenance/repair requirements.\n6. Boiler monitoring\nMonitoring may include but not be limited to:\n6.1 Checks of steam reticulation line pressure\n6.2 Usage of and supply of steam\n6.3 Quality of steam\n6.4 Combustion/heat source system\n6.5 Feed water system\n6.6 Fuel system\n6.7 Combustion air supply\n6.8 Water level\n6.9 Steam pressure\n6.10 Operation of control/safety devices\n7. House chemicals\nChemicals may include but not be limited to:\n7.1 Extinguishing agent’s carbon dioxide\n7.2 Water\n7.3 Soda acid\n7.4 Organic foam and dry powder\n7.5 Oxygen scavenger\n7.6 Feed water additives\n7.7 Other chemicals\n7.8 Amines\n7.9 Condensate chemicals\n8. Boiler\nemergency\nResponses to an emergency may include but not limited to:\n8.1 Identification of emergency\n8.2 Isolation of heat source\n8.3 Selection and application of appropriate fire-fighting\nequipment\n8.4 Establishment of water level\n8.5 Notification of downstream users\n8.6 Operation of boiler only when safe to do so\n8.7 Notify appropriate regulatory authorities\n9. Valves and\nfittings\nValves and fittings may include but not be limited to:\n\n9.1 Safety valves\n9.2\nGauge glasses\n\n--- PDF PAGE 75 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n73\n9.3 Main steam stop valve\n9.4 Feed water stop valve\n9.5 Blow down valve\n9.6 Flame failure detection device\n9.7 Water level controller\n9.8 Boiler steam pressure gauge\n10. Mode of storage\nModes for storing boilers include:\n10.1 Dry storage\n10.2 Open/close condition\n10.3 Wet storage\n\n--- PDF PAGE 76 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n74\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1 Operated tools, boiler and equipment safely and\neffectively\n1.2 Knew the operating principles and operating methods of\nboilers and steam equipment\n1.3 Knew the processes and procedures relevant to working\nwith a boiler and steam equipment\n1.4 Located, interpreted and applied relevant information,\nstandards and specifications\n1.5 Complied with the site safety plan and occupational\nhealth and safety legislation/regulations/codes of\npractice/advisory standards applicable to workplace\noperations\n1.6 Complied with organizational policies and procedures\nincluding quality requirements\n1.7 Communicated and worked effectively and safely with\nothers.\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Components, controls and features of reciprocating\nsteam engines and their functions\n2.2 Principles of the safe removal of obstacles and hazards\nfrom the workplace\n2.3 Electrical/steam/boiler hazards\n2.4 The hierarchy of hazard control measures with\nelimination of substitution, isolation and engineering\ncontrol measures being selected before safe work\npractices and personal protective equipment\n2.5 Occupational health and safety legislation, standards,\ncodes of practices and advisory standards\n2.6 Licenses and permits including legislative requirements\nwith regard to licensing\n2.7 Demonstrate safe and environmentally responsible\nworkplace practices.\n2.8 Attitudes in the workplace should include\n2.8.1 Punctual/Time conscious\n2.8.2 Cost conscious\n2.8.3 Environmental and pollution conscious\n2.8.4 Flexible/adaptable\n2.8.5 Honest\n2.8.6 Dependable\n2.8.7 Innovative\n2.8.8 Alert\n2.8.9 Systematic and organized\n\n--- PDF PAGE 77 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n75\n2.8.10 Committed\n2.8.11 Good listener and fast learn\n2.8.12 Creative\n2.8.13 Resourceful\n2.8.14 Self–starter\n3. Underpinning\nSkills\n3.1\nReading and interpreting manufacturers’ specifications,\nwork and maintenance plans and material safety data\nsheets\n3.2\nCommunicating faults, malfunctions and workplace\nhazards, reports and maintain operational records\n3.3\nWorking with other boiler operators and personnel in a\nteam environment\n3.4\nUnderstand interrelationship among workplace\nprocesses and procedures in the English language\n3.5\nManual lifting\n3.6\nUnderstand tables and figures for job procedures\n3.7\nUnderstand and interpret signals and instructions in the\nEnglish language.\n3.8\nAble to listen and understand job requirement\n3.9\nPerform routine safety, basic service and maintenance\nprocedures\n3.10 Demonstrate emergency operating procedures.\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation/Demonstration with oral questioning\n4.2 Written test\n4.3 Portfolio\n\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Workplace\n5.2 Temperature measuring equipment\n5.3 Lifting equipment\n5.4 Tubes, valves, and fittings\n5.5 Personal protective clothing and equipment\n5.6 Chemicals e.g. soda acid, amines, additives\n5.7 First aid kit/fire fighting equipment\n5.8 Water testing/gas monitoring equipment\n6. Context of\nAssessment\n6.1 Assessment must be applied in a real work\nenvironment or replicated industrial workplace.\n\n--- PDF PAGE 78 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n76\n\nUNIT OF COMPETENCY: OPERATE PUMPING EQUIPMENT\n\nUNIT CODE : AGR741317\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to operate pumping equipment\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the\nRange of Variables\n1. Prepare pumps\nfor operation\n1.1 Equipment, tools, materials and services are\nconfirmed as available and ready for operation according\nto requirements\n1.2 Equipment and tools are checked and calibrated to\nconfirm readiness for use in accordance with\nmanufacturer’s specifications\n\n2. Operate\nPumping\nEquipment\n2.1 Pumps are started up according to company procedures\n2.2 Pump performance is monitored to confirm performance\nis maintained in accordance with manufacturers’\nspecification\n2.3 Equipment performance not within specification is\nidentified, rectified and/or reported based on operating\nmanuals and company reporting system\n\n3. Shutdown and\nMaintain\nPumping\nEquipment\n3.1 Pumping equipment is shut-down according to company\nprocedures\n3.2 Pumps are dismantled for cleaning or cleaned in place\naccording to manufacturers’ specifications\n3.3 Parts and things in motors and pumps are replaced\naccording to the preventive maintenance schedule and\nwith his level of responsibility\n3.4 Corrective action is taken when the pump or motor fails\nbased on knowledge of the pump or motor lifecycle and\nwithin his level of responsibility\n3.5 Workplace information is recorded in the company\nprescribed format\n\n--- PDF PAGE 79 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n77\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Equipment,\nTools, Materials\nEquipment, tools, materials for this unit of competency\n1.1 Pumps like positive displacement pumps, kinetic pumps,\ncentrifugal pumps, etc\n1.2 Jack lifts and trolleys\n1.3 Wrenches and screw drivers\n1.4 Pipes, seals, valves, bearings, impeller, etc.\n2. Corrective action\nCorrective action may include but not limited to\n2.1 Alignment of pump and motor\n2.2 Tightening/Replacement of loose/worn out belts\n2.3\nTightening of nuts and bolts\n3. Workplace\nInformation\nThis can include\n3.1 Standard operating procedures\n3.2 Manufacturers’ specifications\n3.3 Production schedules\n3.4 Batch/recipe instructions\n\n--- PDF PAGE 80 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n78\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Accessed workplace information to identify pumping\nrequirements\n1.2 Checked the alignment of the pump and motor\n1.3 Operated the pumping system\n1.4 Monitored pump operation and the supply and flow of\nmaterials to and from the pump\n1.5 Took corrective action in response to out-of-specification\nresults or non-compliance\n1.6 Cleaned and sanitized equipment and tools\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Purpose and basic principles of pumping\n2.1.1 Effect of raw materials on pumping\n2.1.2 Effect of pumping on material quality\n2.1.3 Pumping procedures and operating parameters\n2.1.4 Pumping system and equipment components\n\n2.2 Basic operating principles of process control systems\nwhere relevant\n\n2.3 Codes and Regulations\n2.3.1 TQM and other good food quality system principles\n2.3.2 HACCP, ISO & EMS\n2.3.3 Good Manufacturing Practices\n2.3.4 OHS hazards and controls\n\n2.4 Select, fit and use personal protective clothing and/or\nequipment\n2.4.1\nGloves, Boots\n2.4.2\nHairnets, etc.\n\n2.5 Materials: Uses and Specifications\n2.5.1 Raw materials\n2.5.2 Ingredients and spices\n\n2.6 Maintenance\n2.6.1 Maintaining equipment and tools\n2.6.2 Trouble shooting\n2.6.3 Cleaning requirements associated with\nchangeovers and types of shut downs\n\n2.7 Attitudes in the workplace should include:\n2.7.1 Self- esteem\n2.7.2 Time conscious/punctual\n2.7.3\nCost conscious\n\n--- PDF PAGE 81 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n79\n2.7.4 Environment and pollution conscious\n2.7.5 Flexible/adaptable\n2.7.6 Honest\n2.7.7 Dependable\n2.7.8 Self starter\n2.7.9 Alert\n2.7.10 Systematic and organized\n2.7.11 Committed\n2.7.12 Good team worker\n2.7.13 Good listener and fast learner\n2.7.14 Creative\n3. Underpinning\nSkills\n3.1 Communication skills (oral & written)\n3.2 Calibrating skills\n3.3 Basic computer skills\n3.4 Basic mathematical skills (arithmetic, conversion,\nweights and measurements, ratios and proportions)\n3.5 Recording and reporting skills\n3.6 Sanitary food handling practices\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation/Demonstration with oral questioning\n4.2 Written test\n4.3 Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/ station\n5.2 Equipment, tools and materials to pump for processing\n5.3\nMaterials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n\n--- PDF PAGE 82 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n80\n\nUNIT OF COMPETENCY: OPERATE AND MONITOR FOOD PROCESSES AND\nEQUIPMENT\n\nUNIT CODE : AGR7413xx\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to combine ingredients, additives and materials in the\ncorrect quantities and sequence and to operate, monitor,\ncontrol and shut down food processes and equipment to\nachieve the required process and product characteristics. The\nkey factors are the successful operation of the equipment and\nthe ability to recognize when the process is not working as\nintended\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the\nRange of Variables\n1. Prepare the food\nequipment and\nprocess for\noperation\n1.1 Identify work requirements from workplace approved\noperating procedures\n1.2 Materials are confirmed and available to meet\nproduction requirements\n1.3 Pre-mixes are prepared as required according to the\nproduction schedule\n1.4 Cleaning and maintenance requirements and status are\nidentified and confirmed\n1.5 Machine components and related attachments are\nfitted and adjusted to meet operating requirements\n1.6 Processing/operating parameters are entered as\nrequired to meet safety and production requirements\n1.7 Food equipment performance is checked and adjusted\nas required according to manufacturers’ specifications\n1.8 Pre-start checks are carried out as required by\nworkplace requirements\n\n2. Operate and\nMonitor the Food\nProcess\n2.1 Ingredients and additives are delivered to the food\nequipment in the required quantities and sequence to\nmeet recipe specifications\n2.2\nThe process is started and operated according to\n\n--- PDF PAGE 83 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n81\nworkplace procedures\n2.3 Equipment is monitored to identify variation in operating\nconditions according to operating manuals\n2.4 Variation in equipment operation is identified and\nmaintenance requirements are reported according to\nworkplace reporting requirements\n2.5 The process is monitored to confirm that specifications\nare met based on production requirements\n2.6 Out-of-specification product/process/packaging\noutcomes are identified, rectified and/or reported to\nmaintain the process within specification\n2.7 Product is transferred to required production or storage\nlocation\n2.8 The workplace is maintained according to housekeeping\nstandards\n2.9 Workplace records are maintained according to\nworkplace recording requirements\n\n3. Shutdown, Clean\nand Maintain the\nFood Process\n3.1 The appropriate shut down procedure is identified\naccording to operating manuals\n3.2 The process is shut down according to workplace\nprocedures\n3.3 Maintenance requirements are identified, reported, and\nconducted according to workplace procedures\n\n--- PDF PAGE 84 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n82\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Materials\nMaterials for processing may include any one but not limited\nto:\n1.1 Fresh fruit\n1.2 Fresh vegetables\n1.3 Fish and other marine products\n1.4 Meat and poultry\n1.5 Jam and jelly\n1.6 Sauces and catsup\n1.7 Food additives\n1.8 Cereals and starches\n1.9 Fats and oil\n1.10 Sugar and sweeteners\n1.11 Gases\n2. Machine\nComponents and\nRelated\nattachments\nMachine components and related attachments for this unit of\ncompetency may include any one of the following:\n2.1 Mixing kettles\n2.2 Stirrers, mixers, agitators, paddles\n2.3 Vacuum cookers\n2.4 Concentrators\n2.5 Weighing scales\n2.6 Pumps\n2.7 Materials transfer and handling equipment\n2.8 Storage tank\n3. Food Equipment\nFood equipment may include any one of the following\n3.1 Heat exchanger\n3.2 Spray dryer\n3.3 Retort equipment\n3.3.1 Static and batch retorts\n3.3.2 Continuous retorts\n3.3.3 Hydrostatic cookers with or without over-pressure\n3.3.4 Water retort\n3.4 Steaming/cooking equipment\n3.4.1 Hot water blanchers\n3.4.2 Steam blanchers\n\n3.5 Water purification equipment\n3.5.1 Dosing equipment\n3.5.2 Storage tanks\n3.5.3 Pumps and valves\n3.5.4 Distillation systems\n3.5.5 Reverse osmosis systems\n3.5.6 Ultra violet light\n\n--- PDF PAGE 85 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n83\n3.5.7 Deionization plants\n3.5.8 Softeners, carbon tanks and filters\n3.6 Dehydration equipment\n3.7 Packaging equipment\n4. Pre-start checks\nThis may involve\n4.1 Inspecting equipment condition to identify any signs of\nwear\n4.2 Selecting appropriate settings and/or related parameters\n4.3 Canceling isolation or lockouts as required\n4.4 Confirming that equipment is clean, correctly configured\nfor processing requirements\n4.5 Sensors and controls are correctly positioned\n4.6 Any scheduled maintenance has been carried out and all\nsafety guards are in place and operational\n5. Process\nProcesses may include any one of the following\n5.1 Use of high temperatures\n5.1.1 Thermal processing\n5.1.2 Dry heat cooking\n5.1.3 Moist heat cooking\n5.1.4 Heat application\n5.1.5 Dehydration\n\n5.2 Use of low temperatures\n5.2.1 Chilling\n5.2.2 Freezing\n6\nProduct\nProducts from processing may include any one but not limited\nto\nFood products in the following forms\n6.1 Fresh/chilled products\n6.2 Canned products\n6.3 Bottled products\n6.4 Poached products\nWater produced may include\n6.5 Purified water\n6.6 Deionized Water\n6.7 Reverse Osmosis (RO)\n6.8 Distilled water\n6.9\nWater for Injection (WFI)\n7\nWorkplace\nrecords\nRecords can include\n7.1 Standard operating procedures\n7.2 Manufacturers’ advice\n7.3 Production schedules and instructions\n7.4 Batch/recipe instructions\n7.5 Standard forms and reports\n\n--- PDF PAGE 86 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n84\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Accessed workplace information to identify processing\nrequirements\n1.2 Understood the importance of critical material properties\nand quantities\n1.3 Conducted pre-start checks\n1.4 Loaded materials in correct quantities and sequence and\nmonitored automatic ingredient addition and/or manual\naddition\n1.5 Started, operated, monitored and adjusted process\nequipment to achieve required outcomes\n1.6 Monitored the supply and flow of ingredients, additives\nand materials to and from the process\n1.7 Paced the process to meet production requirements\n1.8 Cooled, cleaned and handled post-treated containers to\nmeet requirements\n1.9 Took corrective action in response to out-of-specification\nresults or non-compliance\n1.10 Responded to and/or reported equipment failure within\nlevel of responsibility\n1.11 Located emergency stop functions on equipment\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Purpose and basic principles of preparing mixes and\nblends, heat treatment and retort process, freezing,\nsteaming/cooking, water purification, dehydration\n2.1.1 Characteristics and basic function of ingredients\nand additives used\n2.1.2 Method and sequence of ingredient addition\nrequired to achieve required blend characteristics\n\n2.2 Basic operating principles of equipment for mixing/\nblending,\nretort/thermal\nprocessing,\nfreezing\nand\nrefrigeration,\nsteaming/cooking,\nwater\npurification,\ndehydration including packaging processes\n2.2.1 Operational understanding of main equipment\ncomponents\n2.2.2 Status and purpose of guards\n2.2.3 Basic principles and operation of processing system\n2.2.4 Equipment operating capacities and applications\n2.2.5 Purpose and location of sensors and related\nfeedback instrumentation\n\n2.3 Principles of use of high and low temperatures\n2.4 The flow of the process and the effect of mix preparation/\nproduct output on downstream processes\n2.5\nQuality characteristics required of the product\n\n--- PDF PAGE 87 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n85\n2.6 Techniques used to monitor the process\n2.7 Typical equipment faults and related causes. This\nincludes recognition of signs and symptoms of faulty\nequipment and early warning signs of potential problems\n2.8 Codes and Regulations\n2.8.1 Food Standards Code including labeling, weights\nand measures legislation\n2.8.2 Food safety\n2.8.3 Environmental management\n2.8.4 Good Manufacturing Practices\n2.8.5 OHS hazards and controls\n\n2.9 Select, fit and use personal protective clothing and/or\nequipment\n2.9.1\nGloves, Boots\n2.9.2\nHairnets, etc.\n\n2.9 Maintenance\n2.9.1 Maintaining equipment and tools\n2.9.2 Cleaning requirements associated with\nchangeovers and types of shut downs\n\n2.10 Understanding of methods and procedures for non-food\nhandlers when carrying out work responsibilities in a food\nhandling area\n\n2.11 Waste collection, recycling, and handling procedures\n\n2.12 Attitudes in the workplace should include\n2.12.1\nSelf- esteem\n2.12.2\nTime conscious/punctual\n2.12.3\nCost conscious\n2.12.4\nEnvironment and pollution conscious\n2.12.5\nFlexible/adaptable\n2.12.6\nHonest\n2.12.7\nDependable\n2.12.8\nSelf starter\n2.12.9\nAlert\n2.12.10 Systematic and organized\n2.12.11 Committed\n2.12.12 Good team worker\n2.12.13 Good listener and fast learner\n2.12.14 Creative\n3. Underpinning\nSkills\n\n3.1 Communication skills (oral & written)\n3.2 Calibrating skills\n3.3 Basic computer skills\n3.4\nBasic mathematical skills (arithmetic, conversion,\n\n--- PDF PAGE 88 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n86\nweights and measurements, ratios and proportions)\n3.5 Recording and reporting skills\n3.6 Sanitary food handling practices\n3.7 Using process control systems\n3.8 Conduct product/batch changeovers\n3.9 Collecting samples and conduct tests\n3.10 Conducting routine maintenance\n3.11 Cleaning and sanitizing equipment\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation/Demonstration with oral questioning\n4.2 Written test\n4.3\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/station\n5.2 Equipment, tools and components for mixing/ blending,\nretort/thermal processing, freezing and refrigeration,\nsteaming/cooking, water purification, dehydration\n5.3\nMaterials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n\n--- PDF PAGE 89 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n87\n\nUNIT OF COMPETENCY: OPERATE A PACKAGING PROCESS\n\nUNIT CODE : AGR741319\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to set up, operate, adjust and shut down a process for\ncan seaming, high speed wrapping, and other packaging\nsystems\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the\nRange of Variables\n1. Prepare\nequipment and\nprocess for\noperation\n1.1 Materials are confirmed and available to meet operating\nrequirements\n1.2 Utilities are confirmed as available and ready for\noperation\n1.3 Cleaning and maintenance requirements and status are\nidentified and confirmed\n1.4 Machine components and related attachments are\nfitted and adjusted to meet operating requirements\n1.5 Operating parameters are entered as required to meet\nsafety and production requirements\n1.6 Materials, product and packaging components/\nconsumables are loaded or positioned as required to\nmeet packaging requirements\n1.7 Equipment performance is checked and adjusted as\nrequired\n1.8 Pre-start checks are carried out as required by\nworkplace requirements\n\n2. Operate and\nMonitor the\nProcess\n2.1 The process is started and operated according to\nworkplace procedures\n2.2 Equipment is monitored to identify variation in operating\nconditions\n2.3 Variation in equipment operation is identified and\nmaintenance requirements are reported according to\nworkplace reporting requirements\n2.4 The process is monitored and packed item inspected to\nconfirm that specifications are met\n2.5 Out-of-specification product/process outcomes are\nidentified, rectified and/or reported to maintain the\n\n--- PDF PAGE 90 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n88\nprocess within specification\n2.6 The workplace meets housekeeping standards\n2.7 Workplace records are maintained according to\nworkplace recording requirements\n3. Shutdown the\nProcess\n3.1 The appropriate shut down procedure is identified\n3.2 The process is shut down according to workplace\nprocedures\n3.3 Equipment is prepared for cleaning and maintenance\naccording to workplace requirements\n3.4 Maintenance requirements are identified and reported\naccording to workplace reporting requirements\n3.5 Waste is collected, treated and disposed or recycled\naccording to company procedures\n\n--- PDF PAGE 91 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n89\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Materials\nPackaging materials and supplies may include any one of the\nfollowing\n1.1 Plastic\n1.2 Bottles\n1.3 Glass\n1.4 Can\n1.5 Laminates\n1.6 Paper\n1.7\nCarton\n2. Utilities\nUtilities may include\n2.1 Power\n2.2 Steam\n2.3 Water\n2.4 Vacuum and compressed and instrumentation air\n3. Machine\ncomponents\nTypical equipment that may form a packaging sub-system\nmay include any one of the following\n3.1 Conveyor systems\n3.2 Filling, sealing, wrapping, thermo-form equipment\n3.3 Case packers\n3.4 Bundlers\n3.5 Ink jet coders\n3.6 Labelers\n3.7 Palletizers\n3.8 Shrink wrappers and strappers\n4. Pre-start checks\nChecks for this unit of competency may involve:\n4.1 Inspecting equipment condition to identify any signs of\nwear\n4.2 Setting coders and printers\n4.3 Selecting appropriate settings and/or related parameters;\n4.4 Canceling isolation or lockouts as required\n4.5 Confirming that equipment is clean, correctly configured\nfor wrapping requirements\n4.6 Sensors and controls are correctly positioned\n4.7 Any scheduled maintenance has been carried out and all\nsafety guards are in place and operational\n5. Workplace\nrecords\nRecords can include\n5.1 Standard operating procedures\n5.2 Manufacturers’ advice\n5.3\nProduction schedules and instructions\n\n--- PDF PAGE 92 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n90\n5.4 Specifications\n5.5 Batch instructions\n5.6 Standard forms and reports\n\n--- PDF PAGE 93 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n91\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Accessed workplace information to identify packaging\nrequirements\n1.2 Selected, fitted and used personal protective clothing\nand/or equipment\n1.3 Conducted pre-start checks\n1.4 Confirmed supply of necessary materials and services\n1.5 Started, operated, monitored and adjusted the\nequipment to achieve required outcomes.\n1.6 Monitored supply and flow of materials to and from the\nprocess\n1.7 Inspected packing components and packed items\n1.8 Took corrective action in response to out-of-specification\nresults\n1.9 Responded to and/or reported equipment failure within\nlevel of responsibility\n1.10 Located emergency stop functions on equipment\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Purpose and basic principles of can seaming, wrapping,\nand other packaging systems\n2.2 Basic operating principles of equipment\n2.2.1 Operational understanding of main equipment\ncomponents\n2.2.2 Equipment operating capacities and applications\n2.2.3 Equipment and instrumentation components,\npurpose and operation\n2.2.4 Purpose and location of sensors and related\nfeedback instrumentation\n2.3 Product and packaging coding requirements and related\nlegal requirements including product weight\n2.4 The flow of processes supplying the packaging process\nand the effect of outputs on downstream processes\n2.5 Quality characteristics to be achieved by the can\nseaming, wrapping, and packaging process\n2.6 Packaging components and parameters\n2.7 Operating requirements and parameters and corrective\naction required where operation is outside specified\noperating parameters\n2.8 Typical equipment faults and related causes\n2.9 Contamination/food safety risks and related control\nmeasures\n2.10 Common causes of variation and corrective action\nrequired\n2.11 Attitudes in the workplace should include\n2.11.1\nSelf- esteem\n\n--- PDF PAGE 94 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n92\n2.11.2\nTime conscious/punctual\n2.11.3\nCost conscious\n2.11.4\nEnvironment and pollution conscious\n2.11.5\nFlexible/adaptable\n2.11.6\nHonest\n2.11.7\nDependable\n2.11.8\nSelf starter\n2.11.9\nAlert\n2.11.10 Systematic and organized\n2.11.11 Committed\n2.11.12 Good team worker\n2.11.13 Good listener and fast learner\n2.11.14 Creative\n3. Underpinning\nSkills\n3.1 Using process control systems\n3.2 Conduct product/batch changeovers\n3.3 Conducting routine maintenance\n3.4 Cleaning and sanitizing equipment\n3.5 Report and record workplace information\n3.6 Shut down equipment in response to an emergency\nsituation or routine shut down requirements\n3.7 Maintain work area to meet housekeeping standards\n3.8 Sort, collect, treat, recycle or dispose of waste\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation/demonstration with oral questioning\n4.2 Written test\n4.3\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/ station\n5.2 Equipment, tools and materials for wrapping process\n5.3\nMaterials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n\n--- PDF PAGE 95 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n93\n\nUNIT OF COMPETENCY: WORK IN A FREEZER STORAGE AREA\n\nUNIT CODE : AGR741320\n\nUNIT DESCRIPTOR: This unit deals with the knowledge, skills and attitudes\nrequired to enter a freezer storage environment; monitor\nequipment operation in a freezer storage environment; handle\nfrozen product safely; and respond to freezer storage area\nexposure and gas leaks\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the\nRange of Variables\n1. Prepare to enter a\nfreezer storage\nenvironment\n1.1 Personal protective equipment and clothing\n(PPE) is selected, correctly fitted, checked and\ninspected prior to entering a freezer according to\norganizational requirements\n1.2 Correct points of entry and exit are identified and\nused in accordance with organizational requirements\n1.3 All doors and screens are kept secure in accordance\nwith organizational requirements\n1.4 Personal hygiene and product safety procedures are\nfollowed according to organizational requirements\n2. Monitor equipment\noperation in a\nfreezer storage\nenvironment\n2.1 The effect of freezing temperatures have on\nequipment is identified\n2.2 Equipment is monitored to ensure it is in operational\norder when used in a freezer, according to\norganizational requirements.\n2.3 Freezer temperatures are monitored according to\norganizational requirements\n\n3. Handle frozen\nproduct safely\n3.1 Handling requirements for frozen product are\nidentified according to organizational requirements\n3.2 Frozen product is handled safely according to\norganizational requirements\n4. Respond to freezer\nstorage area\nexposure and gas\nleaks\n4.1 Signs and symptoms of exposure are identified\n4.2 Action is taken to minimize effects of exposure of self\nand others, according to organizational requirements\n4.3 Emergency procedures for gas leaks are identified in\naccordance with organizational requirements\n\n--- PDF PAGE 96 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n94\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Personal protective\nequipment and\nclothing\nPersonal protective equipment and clothing may include\nbut not limited to:\n1.1 Rubber Boots\n1.2 Head gear such as Hat/hard hat, caps, ear\nplugs/muffs\n1.3 Heavy Sweaters/Coat/Apron/Overalls\n1.4\nGloves\n1.5\nDust/gas mask/mouth masks\n1.6 Protective eyewear\n1.7 Safety harness\n2. Organizational\nrequirements\nOrganizational requirements in this Unit of Competency\nmay include but not limited to:\n1.1 Site-specific and company standard operating\nprocedures (SOP)\n1.2 Occupational health and safety\n1.3 Food safety and quality management requirements\n3. Handling\nrequirements\nHandling requirements may include but is not limited to:\n3.1 Temperatures\n3.2 Documentation\n3.3 Product rotation\n3.4 Packing arrangements\n\n--- PDF PAGE 97 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n95\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used PPE according to organizational\nrequirements\n1.2 Read and followed organizational requirements\n1.3 Operated and monitored equipment according to\napproved specifications\n1.4 Checked and adjusted the freezer temperatures\n1.5 Handled frozen products properly\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Basic principles and operation of freezer storage\n2.2 Parts and functions of equipment\n2.3 Personal hygiene and product safety procedures\n2.4 Effect of freezing temperature on equipment\n2.5 Freezer temperature requirements for a range of\nproducts\n2.6 Handling requirements for a range of products\n2.7 Signs and symptoms of gas exposure\n2.8 Emergency procedures for gas leaks\n2.9 Attitudes in the workplace should include\n2.9.1 Time conscious/punctual\n2.9.2 Cost conscious\n2.9.3 Environment and pollution conscious\n2.9.4 Flexible/adaptable\n2.9.5 Honest\n2.9.6 Self-starter\n2.9.7 Alert\n2.9.8 Systematic and organized\n2.9.9 Committed\n2.9.10 Good team worker\n2.9.11 Good listener and fast learner\n2.9.12 Creative\n3. Underpinning Skills\n3.1 Sanitary food products handling\n3.2 Communication skills (oral & written)\n3.3 Recording and reporting skills\n3.4 Use of PPE\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct\nobservation/Demonstration\nwith\noral\nquestioning\n4.2 Written test\n4.3\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/ station\n5.2\nEquipment and tools in freezer storage\n\n--- PDF PAGE 98 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n96\n5.3 Materials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n\n--- PDF PAGE 99 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n97\n\nUNIT OF COMPETENCY: WORK WITH TEMPERATURE CONTROLLED STOCK\n\nUNIT CODE : AGR741321\n\nUNIT DESCRIPTOR: This unit deals with the knowledge, skills and attitudes\nrequired to work in stores designed for temperature controlled\nstock\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the\nRange of Variables\n1. Store stock to meet\ntemperature control\nrequirements\n1.1. Goods requiring temperature control are identified\n1.2. Goods are located in appropriate storage\ntemperature zone to meet storage requirements\n\n2. Monitor and\nmaintain\ntemperature of stock\nwithin specifications\n2.1 The temperature of goods is monitored to confirm\ntemperature is within specified limits\n2.2 Temperature of storage areas is monitored to confirm\ntemperature is within storage zone limit\n2.3 Short term storage times are complied with for transit\nstock\n2.4 Stocks handling procedures to maintain\ntemperature control are implemented according to\nworkplace procedures\n\n3. Identify and rectify\nproblems\n3.1 Out-of-specification storage or product temperatures\nare identified, rectified and/or reported\n3.2 Damaged product is segregated according to\nworkplace procedures\n\n--- PDF PAGE 100 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n98\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Goods\nGoods in storage may include but not limited to any one of\nthe following:\n1.1 Fruits\n1.2 Vegetables\n1.3 Fish and other marine products\n1.4 Meat and poultry\n1.5 Cereals and starches\n1.6 Dairy products\n1.7 Fats and oil\n1.8 Sugars and sweeteners\n1.9 Confectionery products\n1.10 Cakes, breads and pastries\n2. Storage\nrequirements\nStorage requirements in this Unit of Competency may\ninclude but not limited to:\n2.1 Temperature limits for a range of goods\n2.2 Short and long term storage periods for a range of\ngoods\n2.3 Segregation\n2.4 Co-storage requirements\n3. Stocks handling\nprocedures\nHandling procedures in this Unit of Competency may\ninclude but not limited to:\n3.1 Stock rotation\n3.2 Identification, segregation, and disposal of damaged\nstock\n\n--- PDF PAGE 101 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n99\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified storage requirements for a range of goods\n1.2 Identified temperature controlled storage facilities and\ntemperature zones\n1.3 Used materials handling equipment in a temperature\ncontrolled environment\n1.4 Followed procedures to measure temperature of\nproduct\n1.5 Used instrumentation to monitor stores and zone\ntemperatures\n1.6 Identified and reported out-of-standard temperatures\n1.7 Took corrective action in response to out-of-\nspecification temperatures\n1.8 Implemented procedures to segregate damaged\nproduct\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Temperature control storage facilities\n2.2 Short and long term storage requirements of products\n2.3 HACCP\n2.4 OHS hazards and controls\n2.5 Environmental aspects, impacts and controls\n2.6 Attitudes in the workplace should include\n2.6.1 Time conscious/punctual\n2.6.2 Cost conscious\n2.6.3 Environment and pollution conscious\n2.6.4 Flexible/adaptable\n2.6.5 Honest\n2.6.6 Dependable\n2.6.7 Self-starter\n2.6.8 Alert\n2.6.9 Systematic and organized\n2.6.10 Committed\n2.6.11 Good team worker\n2.6.12 Good listener and fast learner\n3. Underpinning Skills\n3.1 Operating goods handling equipment\n3.2 Stock handling skills\n3.3 Monitoring and use of instrumentation\n3.4 Housekeeping skills\n3.5 Recording and reporting skills\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct\nobservation/Demonstration\nwith\noral\nquestioning\n4.2\nWritten test\n\n--- PDF PAGE 102 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n100\n4.3 Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/ station\n5.2 Equipment and tools needed to measure and control\ntemperature of stock\n5.3 Materials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n\n--- PDF PAGE 103 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n101\nUNIT OF COMPETENCY: HANDLE DANGEROUS GOODS/HAZARDOUS\n\nSUBSTANCES\n\nUNIT CODE : AGR741322\n\nUNIT DESCRIPTOR: This unit deals with the knowledge, skills and attitudes\nrequired to handle dangerous goods and hazardous\nsubstances, including identifying requirements for working with\ndangerous goods and/or hazardous substances, confirming\nsite incident procedures, selecting handling techniques, and\nhandling and storing dangerous goods and hazardous\nsubstances\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the\nRange of Variables\n1. Identify\nrequirements for\nworking with\ndangerous goods\nand/or hazardous\nsubstances\n1.1. Dangerous goods and/or hazardous substances\nare identified\n1.2. Storage requirements for hazardous substances\nand/or dangerous goods are identified and applied\naccording to workplace procedures\n1.3. Legislative requirements for hazardous substances\nand/or dangerous goods are known and used to plan\nwork activities according to statutory regulations\n1.4. Handling procedures for different classes and\ncharacteristics of goods are observed\n1.5. Confirmation is sought from relevant personnel where\ndangerous goods or hazardous materials do not\nappear to be appropriately marked according to set\nspecifications of authority\n2. Confirm site incident\nprocedures\n2.1 Incident reporting processes are identified\n2.2 Emergency equipment is located and checked\naccording to workplace procedures and statutory\nregulations\n2.3 Emergency procedures are identified and confirmed\n3. Select handling\ntechniques\n3.1 Load handling and shifting procedures are selected in\naccordance with identified requirements for particular\ngoods\n3.2 Handling equipment is checked for conformity with\nworkplace requirements and manufacturer's\nguidelines\n3.3 Where relevant, suitable signage is checked for\ncompliance with workplace procedures\n\n--- PDF PAGE 104 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n102\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Dangerous goods\nand/or hazardous\nsubstances\nDangerous goods and/or hazardous substances may\ninclude but not limited to:\n1.1 Chemicals\n1.2 Cleaning and sanitizing agents\n1.3 Combustible/Explosive materials\n1.4\nSpills, leakages, ruptures\n1.5 Dust/vapors\n2. Emergency\nprocedures\nEmergency procedures may include:\n2.1 Response to spillage/leaks\n2.2 Evacuation\n2.3 Fire-fighting\n2.4\nFirst aid\n3. Workplace\nrequirements\nWorkplace requirements in this Unit of Competency may\ninclude but not limited to:\n3.1 Site restrictions and procedures\n3.2 Use of safety and personal protection equipment\n3.3 Communications equipment\n3.4 Specialized lifting and/or handling equipment\n3.5 Incident breakdown procedures\n3.6 Authorities and permits\n3.7 Hours of operations\n3.8 Noise restrictions\n3.9 Additional gear and equipment\n3.10 Segmentation procedures\n3.11 Emergency procedures\n\n--- PDF PAGE 105 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n103\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified dangerous goods/hazardous substances\n1.2 Handled dangerous goods/hazardous substances\nsafely\n1.3 Assessed handling and storage precautions and\nrequirements for dangerous goods/hazardous\nsubstances\n1.4 Estimated weight and dimensions of load and any\nspecial requirements\n1.5 Selected appropriate equipment and work systems\nincluding personal protection equipment\n1.6 Identified job and site hazards and planned work to\nminimize risks\n1.7 Located, interpreted and applied relevant information\n1.8 Applied hierarchy of hazard control\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Relevant regulations and codes concerning the\nhandling of dangerous goods and hazardous\nsubstances\n2.2 Workplace procedures for handling and storing\ndangerous goods/hazardous substances\n2.3 Risks\nwhen\nhandling\ndangerous\ngoods\nand\nhazardous substances and related precautions to\ncontrol the risk\n2.4 Equipment applications, capacities, configurations,\nsafety hazards and control mechanisms\n2.5 Housekeeping standards procedures required in the\nworkplace\n2.6 Permit and license requirements\n2.7 OHS policies and procedures\n2.8 Attitudes in the workplace should include\n2.8.1 Time conscious/punctual\n2.8.2 Environment and pollution conscious\n2.8.3 Honest\n2.8.4 Dependable\n2.8.5 Self-starter\n2.8.6 Alert\n2.8.7 Systematic and organized\n2.8.8 Committed\n2.8.9 Good team worker\n2.8.10 Good listener and fast learner\n2.8.11 Creative\n3. Underpinning Skills\n3.1 Modification of activities depending on differing\nworkplace contexts, risk situations and environments\n\n--- PDF PAGE 106 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n104\n3.2 Identification of containers and goods coding,\nmarkings and, where applicable, emergency\ninformation panels\n3.3 Planning own work including predicting\nconsequences and identifying improvements\n3.4 Performing first aid\n3.5 Ability to read and comprehend simple statements in\nEnglish\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation/Demonstration with oral\nquestioning\n4.2 Written test\n4.3 Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/station\n5.2 Range of exercises, case studies and other simulated\npractical and knowledge assessments\n5.3 Range of operational situations\n5.4 Materials relevant to the proposed activity\n\n6. Context of\nAssessment\n6.1 Assessment should occur in an appropriate work\nsituation or at accredited training institution or in a\nsimulated workplace.\n\n--- PDF PAGE 107 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n105"
