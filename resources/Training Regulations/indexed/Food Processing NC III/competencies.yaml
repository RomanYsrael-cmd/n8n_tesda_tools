          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Identified, prepared and calibrated standard\nmeasuring devices and instruments\n1.2 Followed correctly the procedures in using\nstandard measuring devices and instruments\n1.3 Followed proper cleaning and sanitizing and\nstowing procedures of measuring devices and\nequipment before and after use\n2. Underpinning Knowledge\n2.1 Safe handling of measuring devices and\ninstruments\n2.2 Specifications and functions of measuring devices\nand instruments\n2.3 Defects and breakages of measuring devices and\ninstruments\n2.4 Procedures in cleaning, sanitizing and calibrating\nand stowing equipment and instruments\n3. Underpinning Skills\n\n3.1 Communication skills\n3.2 Calibrating skills\n3.3 Sanitary handling of devices and instruments\n3.4 Measuring devices and instruments\n3.5 Stowing measuring devices and instruments\n4. Methods of Assessment\nCompetency in this unit must be assessed through:\n\n4.1 Direct observation and questioning of a\ncandidate\nusing\nmeasuring\ndevices\nand\ninstruments\n5. Resource Implications\nThe following resources must be provided:\n\n5.1 Work area/station\n5.2 Materials, tools and equipment relevant to the\nUnit of Competency\n6. Context of Assessment\n6.1 Assessment should occur on the job or in a\nsimulated workplace\n\n--- PDF PAGE 30 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n28\n\nUNIT OF COMPETENCY: USE FOOD PROCESSING TOOLS, EQUIPMENT AND\nUTENSILS\n\nUNIT CODE\n:"
