        "source_text": "AGR741205\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to comply with relevant Good Manufacturing Practice\n(GMP) codes through the implementation of workplace GMP\nand quality procedures\n\nELEMENT\nPERFORMANCE CRITERIA\n Bold Italicized terms are elaborated in the\nRange of Variables\n1. Identify\nrequirements of\nGMP related to\nown work\n1.1. Sources of information on GMP requirements are located\n1.2. GMP requirements and responsibilities related to own\nwork are identified\n2. Observe personal\nhygiene and\nconduct to meet\nGMP requirements\n2.1. Personal hygiene meets GMP requirements\n2.2. Clothing is prepared, used, stored and disposed of\naccording to GMP and workplace procedures\n2.3. Personal movement around the workplace complies with\narea entry and exit procedures\n3. Implement GMP\nrequirements when\ncarrying out work\nactivities\n3.1. GMP requirements are identified\n3.2. Work area, materials, equipment and product are\nroutinely monitored to ensure compliance with GMP\nrequirements\n3.3. Raw materials, packaging components and product are\nhandled according to GMP and workplace procedures\n3.4. Workplace procedures to control resource allocation and\nprocess are followed to meet GMP requirements\n3.5. Common forms of contamination are identified and\nappropriate control measures are followed according to\nGMP requirements\n3.6. The workplace is maintained in a clean and tidy order to\nmeet GMP housekeeping standards\n\n--- PDF PAGE 40 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n38\n4. Participate in\nimproving GMP\n4.1. Processes, practices or conditions which could result in\nnon-compliance with GMP are identified and reported\naccording to workplace reporting requirements\n4.2. Corrective action is implemented within level of\nresponsibility\n4.3. GMP issues are raised with designated personnel\n5. Participate in\nvalidation\nprocesses\n5.1. Validation procedures are followed to meet GMP\nrequirements\n5.2. Issues arising from validation are raised with designated\npersonnel\n5.3. Validation procedures are documented to meet GMP\nrequirements\n6. Complete\nworkplace\ndocumentation to\nsupport GMP\n6.1. Documentation and recording requirements are identified\n6.2. Information is recorded according to workplace\nreporting procedures to meet GMP requirements\n\n--- PDF PAGE 41 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH&S\nrequirements may\ninclude:\n1.1. OH&S legal requirements\n1.2. Enterprise OH&S policies, procedures and programs\n2. Work is carried out\nin accordance with\nregulations.\nRegulatory\nrequirements may\ninclude:\n2.1. Relevant regulations regarding food processing and food\nsafety regulations\n2.2. Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n2.3. Environment Management Bureau regulations regarding\nemissions, waste treatment, noise and effluent treatment\nand control\n3. Hygiene and\nsanitation\nrequirements may\ninclude:\n3.1. Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n3.2. Requirements set out by Bureau of Food and Drugs\n3.3. Workplace requirements\n4. Workplace\nrequirements may\ninclude:\n4.1. Work instructions\n4.2. Standard operating procedures\n4.3. OH&S requirements\n4.4. Quality assurance requirements\n4.5. Equipment manufacturers’ advice\n4.6. Material Safety Data Sheets\n4.7. Codes of Practice and related advice\n5. Products may\ninclude\n5.1. Products, raw materials, packaging components and\nconsumables, part-processed product, finished product\nand cleaning materials\n6. Responsibility and\nreporting systems\n6.1. Responsibility for applying Good Manufacturing Practice\nrelates to the person’s work area\n6.2. Reporting systems may include electronic and manual\ndata recording and storage systems\n\n--- PDF PAGE 42 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n40\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1. Located and followed workplace information relating to\nGMP responsibilities\n1.2. Maintained personal hygiene consistent with GMP\n1.3. Followed workplace procedures when moving around\nthe workplace and/or from one task to another to\nmaintain GMP\n1.4. Used, stored and disposed of appropriate\nclothing/footwear as required by work tasks and\nconsistent with GMP\n1.5. Identified and reported situations that do or could\ncompromise GMP\n1.6. Applied appropriate control measures to control\ncontamination\n1.7. Recorded results of monitoring, and maintain records\nas required by GMP\n1.8. Followed validation procedures within level of\nresponsibility\n1.9. Identified and responded to out-of-specification or\nunacceptable raw materials, packaging components,\nfinal or part processed product within level of\nresponsibility\n1.10. Followed procedures to isolate or quarantine non-\nconforming product\n1.11. Handled, cleaned and stored equipment, utensils, raw\nmaterials, packaging components and related items\naccording to GMP and workplace procedures\n1.12. Maintained GMP for own work\n1.13. Handled and/or disposed of out-of-specification or\ncontaminated materials, packaging\ncomponents/consumables and product, waste and\nrecyclable material according to GMP as required by\nwork responsibilities\n1.14. Maintained the work area in a clean and tidy state\n1.15. Identified and reported signs of pest infestation\n2. Underpinning\nKnowledge and\n2.1. The role of GMP in preventing contamination, its\nrelationship to legislative responsibilities and potential\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n41\nAttitudes\nimplications of non-compliance\n2.2. GMP arrangements in the workplace. This includes\nawareness of relevant GMP codes of practice and\nrelated workplace policies and procedures to\nimplement these responsibilities\n2.3. The relationship between GMP and the quality system,\npersonnel responsible for designing and managing\nGMP, personal role to maintain GMP, the role of\ninternal and external auditors as appropriate\n2.4. Procedures followed to investigate contamination\nevents and performance improvement processes\n2.5. Personal clothing and footwear requirements for\nworking in and/or moving between work areas\n2.6. Personal clothing use, storage and disposal\nrequirements\n2.7. Awareness of common micro biological, physical and\nchemical contaminants relevant to the work process.\nThis includes the types of contamination likely to occur,\nthe conditions under which they occur, possible\nconsequences and control methods to prevent\noccurrence\n2.8. Food preservation methods including smoking, drying,\nfreezing, use of low and high temperatures, use of\npreservatives, radiation\n2.9. Basic concepts of quality assurance including quality\nspecifications, operating parameters, validation\nprocedures and control methods. This includes an\nunderstanding of related documentation including\nStandard Operating Procedures and/or batch\ninstructions\n2.10. Control methods and procedures used in the work area\nto maintain GMP. This includes an understanding of\nthe purpose of control, the consequences if not\ncontrolled and the method of control where relevant. It\nmay include an understanding of methods used to\nmonitor process control; purpose and requirements of\nvalidation procedures; and purpose of equipment\ncalibration\n2.11. GMP responsibilities and requirements relating to work\nrole\n2.12. Basic understanding of the properties, handling and\nstorage requirements of raw materials, packaging\ncomponents and final product handled and used\n\n--- PDF PAGE 44 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n42\n2.13. Standards for materials, equipment and utensils used\nin the work area\n2.14. Recall and traceability procedures relevant to work role\n2.15. Procedures for responding to out-of-specification or\nunacceptable performance/outcomes. This includes\nprocedures for identifying or isolating materials or\nproduct of unacceptable quality\n2.16. Purpose of keeping records and the recording\nrequirements of GMP. This includes an understanding\nof product and materials traceability procedures\n2.17. Housekeeping requirements and responsibilities\nrelating to own work. Where relevant this includes use\nand storage of housekeeping/cleaning equipment\n2.18. Waste collection, recycling and handling procedures\nrelevant to own work responsibilities\n2.19. Responsibilities for reporting and recording quality\ninformation\n3. Underpinning Skills\n3.1. Planning and organizing work (time management)\n3.2.\nWorking with others and in teams\n4. Resource\nImplication\nThe following resources should be provided:\n4.1. Workplace location and access to workplace policies\n4.2.\nMaterials relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency in this unit must be assessed using at least two\n(2) of the following methods:\n5.1. A\ncombination\nof\ndirect\nobservation\nand\noral\nquestioning\n5.2. Written report\n5.3. Written Test\n5.4.\nPortfolio\n6. Context of\nAssessment\nAssessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 45 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n43\n\nUNIT OF COMPETENCY: IMPLEMENT ENVIRONMENTAL POLICIES AND\n PROCEDURES\n\nUNIT CODE :"
