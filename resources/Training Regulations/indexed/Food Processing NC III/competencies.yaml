        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. maintained stock levels and records\n1.2. organized and administered stock takes\n1.3. identified stock losses\n1.4. processed stock orders\n1.5. followed work procedures\n1.6. completed records and documentation\n\nThe skills and knowledge required to control and order\nstock must be transferable to a different work environment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nBasic knowledge of relevant stock\n2.2.\nPrinciples of stock control and ordering\n2.3.\nCommon examples of stock control and ordering\ndocumentation and systems used in the workplace\n2.4.\nInterpretation of workplace specifications and\norders for supplies\n2.5.\nStock security systems\n2.6.\nSafe lifting, handling, storage and retrieval\nprocedures\n2.7.\nWarehouse plan/layout\n2.8.\nProtocols and procedures for liaising with supplier\nrepresentatives, drivers and colleagues using\nappropriate technology\n2.9.\nRelevant OHS and environmental regulations and\nprocedures\n2.10. Use of appropriate personal protective equipment\n2.11. Relevant codes of practice and legislative\nrequirements (for example dangerous goods\nregulations, health and hygiene regulations, etc.)\n2.12. Completion of relevant records/documentation\n2.13. Attitudes in the workplace should include:\n2.13.1 Honest\n2.13.2 Accurate\n2.13.3 Dependable\n2.13.4 Systematic and organized\n2.13.5 Environment-conscious\n2.13.6\nPositive work values\n\n--- PDF PAGE 61 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n59\n2.13.7 Cost conscious\n2.13.8 Safety conscious\n3. Underpinning Skills\n3.1. Ability to read and interpret instructions, procedures\nand labels relevant to controlling and ordering stocks\n3.2. Ability to select and use relevant\ncommunications/computing equipment when\ncontrolling and ordering stocks\n3.3. Ability to select and use relevant personal protection\nequipment\n3.4. Ability to follow work procedures\n3.5. Oral and written communication skills\n3.6. Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation/Demonstration with oral\nquestioning\n4.2. Written test\n4.3. Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Equipment and tools for controlling and ordering\nstock\n5.3. Materials relevant to the proposed activity\n5.4. Relevant workplace procedures, schedules and\nrecords\n6. Context of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 62 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n60\n\nUNIT OF COMPETENCY: APPLY PRODUCT KNOWLEDGE TO COMPLETE\nWORK OPERATIONS\n\nUNIT CODE :"
        },
        "source_text": "AGR741313\n\nUNIT DESCRIPTOR:\nThis unit covers the skills, knowledge and attitude\nrequired to control and order stock for a processing\nconcern. It involves maintaining stock levels and records,\norganizing and administering stock takes, identifying\nstock losses, processing stock orders, and following up\norders.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the\nRange of Variables\n1. Maintain stock levels\nand records\n\n1.1. Stocks levels are monitored and maintained\naccording to workplace requirements and OHS\nrequirements\n1.2. Stock security systems are monitored and adjusted\nas required according to workplace requirements\n1.3. Stock re-order cycles are maintained, monitored and\nadjusted as required according to workplace\nrequirements\n1.4. Appropriate personnel are informed of their\nresponsibilities in regard to recording of stock\naccording to workplace procedures\n1.5. Stock storage and movement records are maintained\nin accordance with workplace procedures\n1.6. Stock performance is monitored and fast/slow\nmoving items are identified and reported in\naccordance with workplace procedures\n2. Organize and\nadminister stock takes\n2.1. Stock takes are organized and responsibilities\nallocated to staff in accordance with workplace\nprocedures\n2.2. Timely reports on stock take data are made in line\nworkplace requirements\n3. Identify stock losses\n\n3.1. Losses are identified, recorded and assessed\nagainst potential losses in line with workplace\nprocedures\n3.2. Avoidable losses are identified, reasons established,\nand controls recommended and implemented to\nprevent future avoidable losses according to\nworkplace procedures\n4. Process stock orders\n\n4.1. Stock orders are processed in accordance with\nworkplace procedures\n4.2. Stock ordering and recording systems are\nmaintained in line with workplace procedures\n\n--- PDF PAGE 58 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n56\n4.3. Appropriate purchase and supply agreements are\nused and details recorded in line with workplace\nrequirements\n4.4. Negotiated purchase and supply agreements are\nrecorded and filed according to workplace\nprocedures\n5. Follow up orders\n5.1. Delivery process is monitored to meet agreed\ndeadlines according to workplace procedures\n5.2. Appropriate liaison is undertaken with colleagues\nand suppliers to ensure continuity of supply\naccording to workplace procedures\n5.3. Routine supply problems are followed up or referred\nto the appropriate person in accordance with\nworkplace policy\n5.4. Stock is distributed in accordance with agreed\nallocations\n5.5. All required records and documentation are\ncompleted in accordance with workplace procedures\n\n--- PDF PAGE 59 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n57\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include but not limited to:\n1.1. Raw materials\n1.2. Goods in process\n1.3. Finished products\n1.4. Packaging materials and supplies\n1.5. Tools and equipment\n1.6. Office and stationery supplies\n1.7. Forms, brochures and documents\n1.8. Vouchers and tickets\n2. Workplace\nrequirements\nMay include but not limited to:\n2.1. standard operating procedures\n2.2. workplace operations manual\n2.3. occupational health and safety (OHS) procedures\n2.4. manufacturers' advice\n2.5. standard forms and reports\n2.6. written or verbal instructions\n2.7. workplace quality and customer service standards\n3. Records\nMay include but not limited to:\n3.1. Type of stock\n3.2. Quantity\n3.3. Quality specifications\n3.4. Use by dates\n3.5. Stock codes\n3.6. Order frequency\n3.7. Lead time\n3.8. Minimum stock levels\n3.9. Supplier information\n3.10. Reports re: out-of-specification deliveries, if\nnecessary\n\n--- PDF PAGE 60 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n58\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. maintained stock levels and records\n1.2. organized and administered stock takes\n1.3. identified stock losses\n1.4. processed stock orders\n1.5. followed work procedures\n1.6. completed records and documentation\n\nThe skills and knowledge required to control and order\nstock must be transferable to a different work environment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nBasic knowledge of relevant stock\n2.2.\nPrinciples of stock control and ordering\n2.3.\nCommon examples of stock control and ordering\ndocumentation and systems used in the workplace\n2.4.\nInterpretation of workplace specifications and\norders for supplies\n2.5.\nStock security systems\n2.6.\nSafe lifting, handling, storage and retrieval\nprocedures\n2.7.\nWarehouse plan/layout\n2.8.\nProtocols and procedures for liaising with supplier\nrepresentatives, drivers and colleagues using\nappropriate technology\n2.9.\nRelevant OHS and environmental regulations and\nprocedures\n2.10. Use of appropriate personal protective equipment\n2.11. Relevant codes of practice and legislative\nrequirements (for example dangerous goods\nregulations, health and hygiene regulations, etc.)\n2.12. Completion of relevant records/documentation\n2.13. Attitudes in the workplace should include:\n2.13.1 Honest\n2.13.2 Accurate\n2.13.3 Dependable\n2.13.4 Systematic and organized\n2.13.5 Environment-conscious\n2.13.6\nPositive work values\n\n--- PDF PAGE 61 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n59\n2.13.7 Cost conscious\n2.13.8 Safety conscious\n3. Underpinning Skills\n3.1. Ability to read and interpret instructions, procedures\nand labels relevant to controlling and ordering stocks\n3.2. Ability to select and use relevant\ncommunications/computing equipment when\ncontrolling and ordering stocks\n3.3. Ability to select and use relevant personal protection\nequipment\n3.4. Ability to follow work procedures\n3.5. Oral and written communication skills\n3.6. Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation/Demonstration with oral\nquestioning\n4.2. Written test\n4.3. Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Equipment and tools for controlling and ordering\nstock\n5.3. Materials relevant to the proposed activity\n5.4. Relevant workplace procedures, schedules and\nrecords\n6. Context of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 62 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n60\n\nUNIT OF COMPETENCY: APPLY PRODUCT KNOWLEDGE TO COMPLETE\nWORK OPERATIONS\n\nUNIT CODE :"
