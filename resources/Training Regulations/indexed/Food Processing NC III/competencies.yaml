        "source_text": "AGR741319\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to set up, operate, adjust and shut down a process for\ncan seaming, high speed wrapping, and other packaging\nsystems\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the\nRange of Variables\n1. Prepare\nequipment and\nprocess for\noperation\n1.1 Materials are confirmed and available to meet operating\nrequirements\n1.2 Utilities are confirmed as available and ready for\noperation\n1.3 Cleaning and maintenance requirements and status are\nidentified and confirmed\n1.4 Machine components and related attachments are\nfitted and adjusted to meet operating requirements\n1.5 Operating parameters are entered as required to meet\nsafety and production requirements\n1.6 Materials, product and packaging components/\nconsumables are loaded or positioned as required to\nmeet packaging requirements\n1.7 Equipment performance is checked and adjusted as\nrequired\n1.8 Pre-start checks are carried out as required by\nworkplace requirements\n\n2. Operate and\nMonitor the\nProcess\n2.1 The process is started and operated according to\nworkplace procedures\n2.2 Equipment is monitored to identify variation in operating\nconditions\n2.3 Variation in equipment operation is identified and\nmaintenance requirements are reported according to\nworkplace reporting requirements\n2.4 The process is monitored and packed item inspected to\nconfirm that specifications are met\n2.5 Out-of-specification product/process outcomes are\nidentified, rectified and/or reported to maintain the\n\n--- PDF PAGE 90 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n88\nprocess within specification\n2.6 The workplace meets housekeeping standards\n2.7 Workplace records are maintained according to\nworkplace recording requirements\n3. Shutdown the\nProcess\n3.1 The appropriate shut down procedure is identified\n3.2 The process is shut down according to workplace\nprocedures\n3.3 Equipment is prepared for cleaning and maintenance\naccording to workplace requirements\n3.4 Maintenance requirements are identified and reported\naccording to workplace reporting requirements\n3.5 Waste is collected, treated and disposed or recycled\naccording to company procedures\n\n--- PDF PAGE 91 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n89\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Materials\nPackaging materials and supplies may include any one of the\nfollowing\n1.1 Plastic\n1.2 Bottles\n1.3 Glass\n1.4 Can\n1.5 Laminates\n1.6 Paper\n1.7\nCarton\n2. Utilities\nUtilities may include\n2.1 Power\n2.2 Steam\n2.3 Water\n2.4 Vacuum and compressed and instrumentation air\n3. Machine\ncomponents\nTypical equipment that may form a packaging sub-system\nmay include any one of the following\n3.1 Conveyor systems\n3.2 Filling, sealing, wrapping, thermo-form equipment\n3.3 Case packers\n3.4 Bundlers\n3.5 Ink jet coders\n3.6 Labelers\n3.7 Palletizers\n3.8 Shrink wrappers and strappers\n4. Pre-start checks\nChecks for this unit of competency may involve:\n4.1 Inspecting equipment condition to identify any signs of\nwear\n4.2 Setting coders and printers\n4.3 Selecting appropriate settings and/or related parameters;\n4.4 Canceling isolation or lockouts as required\n4.5 Confirming that equipment is clean, correctly configured\nfor wrapping requirements\n4.6 Sensors and controls are correctly positioned\n4.7 Any scheduled maintenance has been carried out and all\nsafety guards are in place and operational\n5. Workplace\nrecords\nRecords can include\n5.1 Standard operating procedures\n5.2 Manufacturers’ advice\n5.3\nProduction schedules and instructions\n\n--- PDF PAGE 92 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n90\n5.4 Specifications\n5.5 Batch instructions\n5.6 Standard forms and reports\n\n--- PDF PAGE 93 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n91\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Accessed workplace information to identify packaging\nrequirements\n1.2 Selected, fitted and used personal protective clothing\nand/or equipment\n1.3 Conducted pre-start checks\n1.4 Confirmed supply of necessary materials and services\n1.5 Started, operated, monitored and adjusted the\nequipment to achieve required outcomes.\n1.6 Monitored supply and flow of materials to and from the\nprocess\n1.7 Inspected packing components and packed items\n1.8 Took corrective action in response to out-of-specification\nresults\n1.9 Responded to and/or reported equipment failure within\nlevel of responsibility\n1.10 Located emergency stop functions on equipment\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Purpose and basic principles of can seaming, wrapping,\nand other packaging systems\n2.2 Basic operating principles of equipment\n2.2.1 Operational understanding of main equipment\ncomponents\n2.2.2 Equipment operating capacities and applications\n2.2.3 Equipment and instrumentation components,\npurpose and operation\n2.2.4 Purpose and location of sensors and related\nfeedback instrumentation\n2.3 Product and packaging coding requirements and related\nlegal requirements including product weight\n2.4 The flow of processes supplying the packaging process\nand the effect of outputs on downstream processes\n2.5 Quality characteristics to be achieved by the can\nseaming, wrapping, and packaging process\n2.6 Packaging components and parameters\n2.7 Operating requirements and parameters and corrective\naction required where operation is outside specified\noperating parameters\n2.8 Typical equipment faults and related causes\n2.9 Contamination/food safety risks and related control\nmeasures\n2.10 Common causes of variation and corrective action\nrequired\n2.11 Attitudes in the workplace should include\n2.11.1\nSelf- esteem\n\n--- PDF PAGE 94 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n92\n2.11.2\nTime conscious/punctual\n2.11.3\nCost conscious\n2.11.4\nEnvironment and pollution conscious\n2.11.5\nFlexible/adaptable\n2.11.6\nHonest\n2.11.7\nDependable\n2.11.8\nSelf starter\n2.11.9\nAlert\n2.11.10 Systematic and organized\n2.11.11 Committed\n2.11.12 Good team worker\n2.11.13 Good listener and fast learner\n2.11.14 Creative\n3. Underpinning\nSkills\n3.1 Using process control systems\n3.2 Conduct product/batch changeovers\n3.3 Conducting routine maintenance\n3.4 Cleaning and sanitizing equipment\n3.5 Report and record workplace information\n3.6 Shut down equipment in response to an emergency\nsituation or routine shut down requirements\n3.7 Maintain work area to meet housekeeping standards\n3.8 Sort, collect, treat, recycle or dispose of waste\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation/demonstration with oral questioning\n4.2 Written test\n4.3\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/ station\n5.2 Equipment, tools and materials for wrapping process\n5.3\nMaterials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n\n--- PDF PAGE 95 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n93\n\nUNIT OF COMPETENCY: WORK IN A FREEZER STORAGE AREA\n\nUNIT CODE :"
