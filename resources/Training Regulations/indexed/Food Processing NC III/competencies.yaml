              {
                "number": "5.2",
                "text": "At this level identification and control of environmental hazards relates to own work. Corrective action typically involves recognizing any event which occurs as part of the work process and presents an unacceptable environmental risk or outcome, taking corrective action within level of responsibility, and/or reporting to the appropriate person in the work area"
