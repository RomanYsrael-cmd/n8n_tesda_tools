              },
              {
                "number": "2.2",
                "text": "Responsibilities of self and employer to manage environmental issues on site. This includes an awareness of any license or agreements in place with --- PDF PAGE 50 --- ____________________________________________________________________________ TR- Food Processing NC III 48 resource management authorities and the purpose of these arrangements"
