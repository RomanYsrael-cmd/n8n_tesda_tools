        "source_text": "AGR741320\n\nUNIT DESCRIPTOR: This unit deals with the knowledge, skills and attitudes\nrequired to enter a freezer storage environment; monitor\nequipment operation in a freezer storage environment; handle\nfrozen product safely; and respond to freezer storage area\nexposure and gas leaks\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the\nRange of Variables\n1. Prepare to enter a\nfreezer storage\nenvironment\n1.1 Personal protective equipment and clothing\n(PPE) is selected, correctly fitted, checked and\ninspected prior to entering a freezer according to\norganizational requirements\n1.2 Correct points of entry and exit are identified and\nused in accordance with organizational requirements\n1.3 All doors and screens are kept secure in accordance\nwith organizational requirements\n1.4 Personal hygiene and product safety procedures are\nfollowed according to organizational requirements\n2. Monitor equipment\noperation in a\nfreezer storage\nenvironment\n2.1 The effect of freezing temperatures have on\nequipment is identified\n2.2 Equipment is monitored to ensure it is in operational\norder when used in a freezer, according to\norganizational requirements.\n2.3 Freezer temperatures are monitored according to\norganizational requirements\n\n3. Handle frozen\nproduct safely\n3.1 Handling requirements for frozen product are\nidentified according to organizational requirements\n3.2 Frozen product is handled safely according to\norganizational requirements\n4. Respond to freezer\nstorage area\nexposure and gas\nleaks\n4.1 Signs and symptoms of exposure are identified\n4.2 Action is taken to minimize effects of exposure of self\nand others, according to organizational requirements\n4.3 Emergency procedures for gas leaks are identified in\naccordance with organizational requirements\n\n--- PDF PAGE 96 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n94\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Personal protective\nequipment and\nclothing\nPersonal protective equipment and clothing may include\nbut not limited to:\n1.1 Rubber Boots\n1.2 Head gear such as Hat/hard hat, caps, ear\nplugs/muffs\n1.3 Heavy Sweaters/Coat/Apron/Overalls\n1.4\nGloves\n1.5\nDust/gas mask/mouth masks\n1.6 Protective eyewear\n1.7 Safety harness\n2. Organizational\nrequirements\nOrganizational requirements in this Unit of Competency\nmay include but not limited to:\n1.1 Site-specific and company standard operating\nprocedures (SOP)\n1.2 Occupational health and safety\n1.3 Food safety and quality management requirements\n3. Handling\nrequirements\nHandling requirements may include but is not limited to:\n3.1 Temperatures\n3.2 Documentation\n3.3 Product rotation\n3.4 Packing arrangements\n\n--- PDF PAGE 97 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n95\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used PPE according to organizational\nrequirements\n1.2 Read and followed organizational requirements\n1.3 Operated and monitored equipment according to\napproved specifications\n1.4 Checked and adjusted the freezer temperatures\n1.5 Handled frozen products properly\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Basic principles and operation of freezer storage\n2.2 Parts and functions of equipment\n2.3 Personal hygiene and product safety procedures\n2.4 Effect of freezing temperature on equipment\n2.5 Freezer temperature requirements for a range of\nproducts\n2.6 Handling requirements for a range of products\n2.7 Signs and symptoms of gas exposure\n2.8 Emergency procedures for gas leaks\n2.9 Attitudes in the workplace should include\n2.9.1 Time conscious/punctual\n2.9.2 Cost conscious\n2.9.3 Environment and pollution conscious\n2.9.4 Flexible/adaptable\n2.9.5 Honest\n2.9.6 Self-starter\n2.9.7 Alert\n2.9.8 Systematic and organized\n2.9.9 Committed\n2.9.10 Good team worker\n2.9.11 Good listener and fast learner\n2.9.12 Creative\n3. Underpinning Skills\n3.1 Sanitary food products handling\n3.2 Communication skills (oral & written)\n3.3 Recording and reporting skills\n3.4 Use of PPE\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct\nobservation/Demonstration\nwith\noral\nquestioning\n4.2 Written test\n4.3\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/ station\n5.2\nEquipment and tools in freezer storage\n\n--- PDF PAGE 98 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n96\n5.3 Materials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n\n--- PDF PAGE 99 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n97\n\nUNIT OF COMPETENCY: WORK WITH TEMPERATURE CONTROLLED STOCK\n\nUNIT CODE :"
