        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1 Identified products/stock stored in the subsection of the\nworkplace\n1.2 Identified properties and purposes of specific categories\nof goods\n1.3 Explained the characteristics of stock in relation to\nspecific handling and storage requirements\n1.4 Interpreted and used workplace policies, procedures and\npractices in relation to product location and condition\n1.5 Used workplace maps and location guides with inventory\nsystems to physically locate goods in an efficient manner\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Codes and regulations relevant to the products being\nidentified, handled, transported, stacked and/or stored as\npart of work operations\n2.2 Relevant OHS and environmental protection procedures\nand guidelines\n2.3 Workplace procedures and policies for the identification,\nhandling, stacking and storage of particular categories of\nproducts\n2.4 Focus of operation of work systems, equipment,\nmanagement and site operating systems for the\npackaging of goods\n2.5 Categories or groups of products and the special\nhandling, stacking and storage requirements for each\n2.6 Purpose and use of cataloguing and labeling systems\n2.7 Types of equipment and storage areas appropriate for\ndifferent types of goods including perishable, fragile,\ndangerous, composition/state goods\n2.8 Housekeeping standard procedures required in the\nworkplace\n2.9 Site layout and obstacles\n2.10 Attitudes in the workplace should include:\n2.10.1\nPunctual/Time conscious\n2.10.2\nCost conscious\n2.10.3\nEnvironmental and pollution conscious\n2.10.4\nFlexible/adaptable\n2.10.5\nHonest\n2.10.6\nDependable\n2.10.7\nInnovative\n2.10.8\nAlert\n2.10.9\nSystematic and organized\n2.10.10 Committed\n\n--- PDF PAGE 65 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n63\n2.10.11 Good listener and fast learner\n2.10.12 Creative\n2.10.13 Resourceful\n2.10.14 Self–starter\n2.10.15 Decisive\n\n3. Underpinning\nSkills\n3.1 Ability to read and interpret instructions, procedures and\nlabels relevant to the handling and storage of goods\n3.2 Ability to use required personal protective clothing and\nequipment conforming to industry and OHS standards\n3.3 Ability to estimate the size, shape and special\nrequirements of goods/loads\n3.4 Locating, interpreting and applying relevant information\n3.5 Conveying information in written and oral form\n3.6 Maintaining workplace records\n3.7 Providing customer/client service and working effectively\nwith others\n3.8 Selecting and using appropriate workplace colloquial and\ntechnical language and communication technologies in\nthe workplace context\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Demonstration/Direct observation with oral questioning\n4.2 Written test\n4.3 Portfolio\n5. Resource\nImplications\nResources may include:\n5.1 Range of exercises\n5.2 Case Studies\n5.3 Simulated practical and knowledge assessments\n5.4 Range of operational and workplace situations\n\n6. Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or\nsimulated workplace environment.\n\n--- PDF PAGE 66 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n64\n\nUNIT OF COMPETENCY: PERFORM BASIC TESTS ON RAW MATERIALS, IN-\nPROCESS AND FINISHED PRODUCTS\n\nUNIT CODE :"
        },
        "source_text": "AGR741314\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to apply product knowledge to complete work\noperations in accordance with workplace requirements\nincluding identifying products in a subsection of a warehouse\nor other storage area, examining quality and reporting on\nproducts, and using inventory and labeling systems to identify\nand locate products.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the Range of\nVariables\n1. Identify products in\na subsection of a\nwarehouse or\nother storage area\n1.1 Products are identified against specified criteria in\naccordance with workplace procedures\n1.2 Storage and handling characteristics are identified\nand applied consistently\n1.3 Products are described to internal customers identifying\nfeatures which may affect location, safety or storage\nrequirements\n\n2. Examine quality\nand report on\nproducts\n2.1 Products are inspected in accordance with workplace\nquality assurance procedures\n2.2 Workplace procedures are followed to replace, return or\ndispose of stock/products which are not useable\n2.3 Non-conforming products are recorded/reported in\naccordance with workplace procedures\n\n3. Use inventory and\nlabeling systems\nto identify and\nlocate products\n3.1 Inventory and labeling systems are used to locate\nproducts within the workplace\n3.2 Goods are physically located and identified\n\n--- PDF PAGE 63 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Products\nCategories or groups of products/stock may include:\n1.1 Perishable goods\n1.2 Refrigerated products\n1.3 Temperature controlled stock\n1.4 Fragile goods\n1.5 Dangerous goods\n1.6\nOverseas export\n2. Identification\ncriteria\nDistinguishing identification criteria for products may include:\n2.1 Shape\n2.2 Size\n2.3 Color\n2.4 Bar codes\n2.5 Labels\n2.6 Traceability standards\n3. Storage and\nhandling\ncharacteristics\nThe characteristics of products/stock may include:\n3.1 Perishability\n3.2 Weight\n3.3 Form\n3.4 State\n3.5 Size\n3.6 Fragility\n3.7 Product storage and handling requirements\n4. Inventory and\nlabeling systems\nInventory systems may be:\n4.1 Automated\n4.2 Manual\n4.3 Paper-based\n4.4 Computerized\n4.5 Microfiche\nLabeling systems may include:\n4.6 Batch code\n4.7 Bar code\n4.8 Identification numbering systems\n4.9 Serial numbers\n4.10 Symbols for safe handling\n4.11 Nutritional labeling\n\n--- PDF PAGE 64 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n62\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1 Identified products/stock stored in the subsection of the\nworkplace\n1.2 Identified properties and purposes of specific categories\nof goods\n1.3 Explained the characteristics of stock in relation to\nspecific handling and storage requirements\n1.4 Interpreted and used workplace policies, procedures and\npractices in relation to product location and condition\n1.5 Used workplace maps and location guides with inventory\nsystems to physically locate goods in an efficient manner\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Codes and regulations relevant to the products being\nidentified, handled, transported, stacked and/or stored as\npart of work operations\n2.2 Relevant OHS and environmental protection procedures\nand guidelines\n2.3 Workplace procedures and policies for the identification,\nhandling, stacking and storage of particular categories of\nproducts\n2.4 Focus of operation of work systems, equipment,\nmanagement and site operating systems for the\npackaging of goods\n2.5 Categories or groups of products and the special\nhandling, stacking and storage requirements for each\n2.6 Purpose and use of cataloguing and labeling systems\n2.7 Types of equipment and storage areas appropriate for\ndifferent types of goods including perishable, fragile,\ndangerous, composition/state goods\n2.8 Housekeeping standard procedures required in the\nworkplace\n2.9 Site layout and obstacles\n2.10 Attitudes in the workplace should include:\n2.10.1\nPunctual/Time conscious\n2.10.2\nCost conscious\n2.10.3\nEnvironmental and pollution conscious\n2.10.4\nFlexible/adaptable\n2.10.5\nHonest\n2.10.6\nDependable\n2.10.7\nInnovative\n2.10.8\nAlert\n2.10.9\nSystematic and organized\n2.10.10 Committed\n\n--- PDF PAGE 65 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n63\n2.10.11 Good listener and fast learner\n2.10.12 Creative\n2.10.13 Resourceful\n2.10.14 Self–starter\n2.10.15 Decisive\n\n3. Underpinning\nSkills\n3.1 Ability to read and interpret instructions, procedures and\nlabels relevant to the handling and storage of goods\n3.2 Ability to use required personal protective clothing and\nequipment conforming to industry and OHS standards\n3.3 Ability to estimate the size, shape and special\nrequirements of goods/loads\n3.4 Locating, interpreting and applying relevant information\n3.5 Conveying information in written and oral form\n3.6 Maintaining workplace records\n3.7 Providing customer/client service and working effectively\nwith others\n3.8 Selecting and using appropriate workplace colloquial and\ntechnical language and communication technologies in\nthe workplace context\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Demonstration/Direct observation with oral questioning\n4.2 Written test\n4.3 Portfolio\n5. Resource\nImplications\nResources may include:\n5.1 Range of exercises\n5.2 Case Studies\n5.3 Simulated practical and knowledge assessments\n5.4 Range of operational and workplace situations\n\n6. Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or\nsimulated workplace environment.\n\n--- PDF PAGE 66 ---\n_____