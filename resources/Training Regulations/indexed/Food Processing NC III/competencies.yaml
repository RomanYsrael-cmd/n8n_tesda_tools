tenance\n2.9.1 Maintaining equipment and tools\n2.9.2 Cleaning requirements associated with\nchangeovers and types of shut downs\n\n2.10 Understanding of methods and procedures for non-food\nhandlers when carrying out work responsibilities in a food\nhandling area\n\n2.11 Waste collection, recycling, and handling procedures\n\n2.12 Attitudes in the workplace should include\n2.12.1\nSelf- esteem\n2.12.2\nTime conscious/punctual\n2.12.3\nCost conscious\n2.12.4\nEnvironment and pollution conscious\n2.12.5\nFlexible/adaptable\n2.12.6\nHonest\n2.12.7\nDependable\n2.12.8\nSelf starter\n2.12.9\nAlert\n2.12.10 Systematic and organized\n2.12.11 Committed\n2.12.12 Good team worker\n2.12.13 Good listener and fast learner\n2.12.14 Creative\n3. Underpinning\nSkills\n\n3.1 Communication skills (oral & written)\n3.2 Calibrating skills\n3.3 Basic computer skills\n3.4\nBasic mathematical skills (arithmetic, conversion,\n\n--- PDF PAGE 88 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n86\nweights and measurements, ratios and proportions)\n3.5 Recording and reporting skills\n3.6 Sanitary food handling practices\n3.7 Using process control systems\n3.8 Conduct product/batch changeovers\n3.9 Collecting samples and conduct tests\n3.10 Conducting routine maintenance\n3.11 Cleaning and sanitizing equipment\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation/Demonstration with oral questioning\n4.2 Written test\n4.3\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Work area/station\n5.2 Equipment, tools and components for mixing/ blending,\nretort/thermal processing, freezing and refrigeration,\nsteaming/cooking, water purification, dehydration\n5.3\nMaterials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n\n--- PDF PAGE 89 ---\n_____________________________