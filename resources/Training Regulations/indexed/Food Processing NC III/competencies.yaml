        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Cleaned, checked and sanitized personal protective\nequipment\n1.2 Practiced proper personal hygiene and good\ngrooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the\nwork area\n2. Underpinning\nKnowledge\n2.1 Safety Practices\n2.1.1 Proper waste disposal\n2.1.2 Environmental protection and concerns\n2.1.3 Food safety principles and practices\n2.1.4 Good grooming and personal hygiene\n\n 2.2 Codes and Regulations\n2.2.1 TQM and other food quality system principles\n2.2.2 ISO, HACCP, EMS, 5S\n2.2.3 Good Food Manufacturing Practices\n\n2.3 Equipment: Uses and Specifications\n2.3 1 Parts and functions of personal protective\nequipment\n2.3.2 First Aid Kit\n2.3.3 Sanitizing equipment\n\n2.4 Basic microbiology including types of\nmicroorganisms and its control\n3. Underpinning Skills\n3.1 Sanitary food handling practices\n3.2 Implementing housekeeping activities\n3.3 Applying first aid treatment\n3.4\nCoordination skills\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 A combination of direct observation and\nquestioning of a candidate processing foods.\n5. Resource Implications\n\nThe following resources must be provided:\n5.1 Work area/station\n5.2 First Aid kit\n5.3 PPE relevant to the activities\n5.4 Fire extinguisher\n5.5 Stretcher\n5.6 Materials, tools and equipment relevant to the unit of\ncompetency\n6. Context of Assessment 6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 27 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n25\n\nUNIT OF COMPETENCY: USE STANDARD MEASURING DEVICES AND\nINSTRUMENTS\n\nUNIT CODE\n :"
        },
        "source_text": "AGR741201\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes required\nto apply food safety and sanitation in the workplace\n\n ELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the Range of\nVariables\n11. Wear Personal\nProtective Equipment\n\n1.1 Personal protective equipment are checked\naccording to manufacturer’s specifications\n\n1.2 Personal protective equipment are worn\naccording to the job requirement\n2. Observe Personal\nHygiene and Good\nGrooming\n2.1 Personal hygiene and good grooming is practiced in\nline with workplace health and safety\nrequirements\n3. Implement Food\nSanitation Practices\n\n3.1 Sanitary food handling practices are implemented\nin line with workplace sanitation regulations\n\n3.2 Safety measures are observed in line with\nworkplace safety practices.\n4. Render Safety\nMeasures and First Aid\nProcedures\n\n4.1 Safety measures are applied according to\nworkplace rules and regulations\n\n4.2 First aid procedures are applied and coordinated\nwith concerned personnel according to workplace\nstandard operating procedures.\n5. Implement\nhousekeeping activities\n\n5.1 Work area and surroundings are cleaned in\naccordance with workplace health and safety\nregulations\n\n5.2 Waste is disposed according to organization’s\nwaste disposal system\n\n5.3 Hazards in the work area are recognized and\nreported to designated personnel according to\nworkplace procedures\n\n--- PDF PAGE 24 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n22\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Manufacturer’s\nSpecifications\nManufacturer’s specifications may include but not\nlimited to:\n\n1.1 Handling\n1.2 Operating\n1.3 Discharge Label\n1.4 Reporting\n1.5 Testing\n1.6 Positioning\n1.7 Refilling\n2. Personal Protective\nEquipment\nPersonal Protective Equipment may include but not\nlimited to:\n\n2.1 Apron/laboratory gown\n2.2 Mouth masks\n2.3 Gloves\n2.4 Rubber boots/safety shoes\n2.5 Head gears such as caps, hair nets, ear plug\n3. Workplace Health and\nSafety Requirements\nWorkplace and Safety Requirements may include:\n\n3.1 Health/Medical Certificate\n3.2 DOLE requirements\n3.3 BFAD requirements\n3.4 Personal Hygiene and good grooming\n3.5 Plant Sanitation and waste management\n4. Safety Measures\nSafety measures may include but not limited to:\n\n4.1 Labeling of chemicals and other sanitizing agents\n4.2 Installation of fire fighting equipment in the work\narea\n4.3 Installation of safety signages and symbols\n4.4 Implementation of 5S in the work area\n4.5 Removal of combustible material in the work area\n\n5. First Aid Procedures\nFirst Aid Procedures may include but not limited to:\n\n5.1 Mouth to mouth resuscitation\n5.2 CPR\n5.3 Application of tourniquet\n5.4 Applying pressure to bleeding wounds or cuts\n5.5 First aid treatment for burned victims\n\n--- PDF PAGE 25 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n23\n6. Hazards\nHazards in the workplace may include but not limited\nto:\n\n6.1 Physical\n6.2 Biological\n6.3 Chemical\n\n--- PDF PAGE 26 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n24\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Cleaned, checked and sanitized personal protective\nequipment\n1.2 Practiced proper personal hygiene and good\ngrooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the\nwork area\n2. Underpinning\nKnowledge\n2.1 Safety Practices\n2.1.1 Proper waste disposal\n2.1.2 Environmental protection and concerns\n2.1.3 Food safety principles and practices\n2.1.4 Good grooming and personal hygiene\n\n 2.2 Codes and Regulations\n2.2.1 TQM and other food quality system principles\n2.2.2 ISO, HACCP, EMS, 5S\n2.2.3 Good Food Manufacturing Practices\n\n2.3 Equipment: Uses and Specifications\n2.3 1 Parts and functions of personal protective\nequipment\n2.3.2 First Aid Kit\n2.3.3 Sanitizing equipment\n\n2.4 Basic microbiology including types of\nmicroorganisms and its control\n3. Underpinning Skills\n3.1 Sanitary food handling practices\n3.2 Implementing housekeeping activities\n3.3 Applying first aid treatment\n3.4\nCoordination skills\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 A combination of direct observation and\nquestioning of a candidate processing foods.\n5. Resource Implications\n\nThe following resources must be provided:\n5.1 Work area/station\n5.2 First Aid kit\n5.3 PPE relevant to the activities\n5.4 Fire extinguisher\n5.5 Stretcher\n5.6 Materials, tools and equipment relevant to the unit of\ncompetency\n6. Context of Assessment 6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 27 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n25\n\nUNIT OF COMPETENCY: USE STANDARD MEASURING DEVICES AND\nINSTRUMENTS\n\nUNIT CODE\n :"
