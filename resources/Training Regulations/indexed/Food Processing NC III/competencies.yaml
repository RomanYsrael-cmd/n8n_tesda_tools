                "number": "5.3",
                "text": "Work responsibilities may involve handling of hazardous waste --- PDF PAGE 48 --- ____________________________________________________________________________ TR- Food Processing NC III 46"
              },
              {
                "number": "5.4",
                "text": "An environmental hazard is any activity, product or service that has the potential to affect the environment. This may also be referred to as an environmental aspect"
