        "source_text": "AGR741206\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to implement environmental policies and procedures\nwhen carrying out work responsibilities\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the Range of\nVariables\n1. Conduct work in\naccordance with\nenvironmental\npolicies and\nprocedures\n1.1. Immediate work area is routinely checked to ensure\ncompliance with environmental requirements\n1.2. Hazards and unacceptable performance are identified,\nremoved and/or reported to appropriate personnel\naccording to workplace procedures\n1.3. Workplace procedures and work instructions are\nfollowed\n1.4. Where control requirements are not met, incidents are\npromptly reported and corrective action is taken\n1.5. Measures used to minimize and handle waste are\nfollowed\n1.6. Environmental data is recorded in required format\naccording to workplace reporting requirements\n2. Participate in\nimproving\nenvironmental\npractices at work\n2.1. Processes or conditions which could result in an\nunacceptable environmental outcome are identified and\nreported according to workplace reporting requirements\n2.2. Corrective action is taken in accordance with the\nenvironmental management and emergency response\nplans as required\n2.3. Contributions are made to a participative arrangements\nfor managing environmental issues in the workplace\nwithin workplace procedures and level of responsibility\n\n--- PDF PAGE 46 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n44\n3. Respond to an\nenvironmental\nemergency\n3.1. Emergency situations are identified and reported\naccording to workplace reporting requirements\n3.2. Emergency procedures are followed as appropriate to\nthe nature of the emergency and according to workplace\nprocedures\n\n--- PDF PAGE 47 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n45\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. OH&S\nrequirements may\ninclude:\n1.1. OH&S legal requirements\n1.2. Enterprise OH&S policies, procedures and programs\n2. Work in carried out\nin accordance with\nregulations.\nRegulatory\nrequirements may\ninclude:\n2.1. Relevant regulations regarding food processing and food\nsafety regulations\n2.2. Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n2.3. Environment Management Bureau regulations regarding\nemissions, waste treatment, noise and effluent treatment\nand control\n3. Hygiene and\nsanitation\nrequirements may\ninclude:\n3.1. Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n3.2. Requirements set out by Bureau of Food and Drugs\n3.3. Workplace requirements\n4. Workplace\nrequirements may\ninclude:\n4.1. Work instructions\n4.2. Standard operating procedures\n4.3. OH&S requirements\n4.4. Quality assurance requirements\n4.5. Equipment manufacturers’ advice\n4.6. Material Safety Data Sheets\n4.7. Codes of Practice and related advice\n5. Identification and\ncontrol of hazards\nmay include:\n5.1. Procedures are available that outline appropriate\nresponse to environmental incidents, accidents and\nemergencies\n5.2. At this level identification and control of environmental\nhazards relates to own work. Corrective action typically\ninvolves recognizing any event which occurs as part of\nthe work process and presents an unacceptable\nenvironmental risk or outcome, taking corrective action\nwithin level of responsibility, and/or reporting to the\nappropriate person in the work area\n5.3. Work responsibilities may involve handling of hazardous\nwaste\n\n--- PDF PAGE 48 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n46\n5.4. An environmental hazard is any activity, product or\nservice that has the potential to affect the environment.\nThis may also be referred to as an environmental aspect\n5.5. An environmental risk is the likelihood that the hazard\ncan cause harm to the environment\n5.6. A control measure is a method or procedure used to\nprevent or minimize environmental risks\n5.7. Responsibility for identifying and controlling\nenvironmental risks relates to immediate work\nresponsibilities\n5.8. Participating in improvement may involve participation in\nstructured improvement programs, one-off projects and\nday-to-day problem solving and consultative groups\n\n--- PDF PAGE 49 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n47\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1. Accessed and applied workplace information on\nenvironmental policies and procedures relating to own\nwork\n1.2. Fitted and used appropriate personal protective clothing\nand equipment\n1.3. Checked own work area to identify environmental\nhazards\n1.4. Reported hazards according to workplace procedure in a\nclear and timely manner\n1.5. Followed work procedures to control or minimize\nenvironmental risk. This may include monitoring\nparameters set for environmental aspects such as\nairborne particulate, noise, and water quality. It may also\ninclude demonstrating use of emergency equipment\naccording to work role requirements\n1.6. Recorded environmental information as required by the\nenvironmental management program\n1.7. Participated in processes to raise issues and\nsuggestions to improve environmental issues\nmanagement. This requires appropriate communication\nskills to structure and present information and interact\nwith others\n1.8. Followed procedures to collect, deposit, recycle and/or\ndispose of waste in own work area\n1.9. Followed procedures to respond to environmental\nemergencies such as spills and emissions. This may\ninclude following procedures to alert the appropriate\nemergency services\n1.10.Maintained housekeeping standards in work area\n2. Underpinning\nKnowledge and\nAttitudes\n2.1. Workplace approach to managing environmental issues.\nThis includes awareness of relevant work procedures,\npersonnel responsible for environmental issues,\nconsultative arrangements for reporting and improving\nenvironmental practices and may include an\nunderstanding of the role of internal and external\nauditors as appropriate\n2.2. Responsibilities of self and employer to manage\nenvironmental issues on site. This includes an\nawareness of any license or agreements in place with\n\n--- PDF PAGE 50 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n48\nresource management authorities and the purpose of\nthese arrangements\n2.3. Sources of advice on environmental issues in the\nworkplace\n2.4. Environmental hazards and risks associated with the\nwork carried out. Examples may include water pollution,\nair pollution, noise, waste handling, emergencies such as\nspills, and hazardous chemicals or waste\n2.5. Work procedures as they relate to environmental\nresponsibilities. This includes use of appropriate\npersonal protective clothing and equipment as required\n2.6. Procedures used to prevent or control environmental\nrisks associated with own work. Where this requires use\nof emergency equipment, this includes understanding\nthe purpose, capacity and limitations of equipment,\nlocation and storage requirements and safe handling and\nequipment use\n2.7. Basic concepts of hazard identification, risk assessment\nand control options. This includes an understanding of\nthe hierarchy of hazard control\n2.8. Workplace procedures for identifying and responding to\nhazards, investigating incidents and improving\nenvironmental management and resource utilisation\n2.9. Impact of work practices on resource utilisation and\nwastage\n2.10. Procedures used to handle and dispose of waste\naccording to workplace requirements. This includes an\nawareness of the need to separate solid and liquid\nwaste, and remove waste in solid form rather than\nhosing down drains. It may also include an\nunderstanding of handling requirements for hazardous\nwaste\n2.11. The difference between trade waste and storm water\ndrains\n2.12. Consequences of inappropriate waste handling and\ndisposal\n2.13. Procedures for responding to unplanned incidents such\nas spills and leaks as relevant to the work area\n2.14. Emergency response system and procedures\n2.15. Responsible use of resources in own work area\n2.16. Reporting procedures and responsibilities\n2.17.Consultative processes in the workplace for raising\n\n--- PDF PAGE 51 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n49\nissues/suggestions on environmental issues\n3. Underpinning\nSkills\n3.1. Planning and organizing work (time management)\n3.2. Working with others and in teams\n4. Resource\nImplication\nThe following resources should be provided:\n4.1. Workplace location and access to workplace policies\n4.2. Materials relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency in this unit must be assessed using at least two\n(2) of the following methods:\n5.1. A combination of direct observation and oral questioning\n5.2. Written report\n5.3. Written Test\n5.4. Portfolio\n6. Context of\nAssessment\nAssessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 52 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n50\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE AND STORE STOCK\n\nUNIT CODE :"
