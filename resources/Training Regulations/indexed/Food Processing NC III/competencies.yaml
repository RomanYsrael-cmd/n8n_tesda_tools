        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1 Applied SOPs to efficiently prepare samples for test and\nanalyses\n1.2 Used safety information (eg, MSDSs) and performed\nprocedures safely\n1.3 Checked testing equipment calibration status\n1.4 Completed all tests within required timeline without\nsacrificing safety, accuracy or quality\n1.5 Calculated, recorded and presented results accurately\nand legibly\n1.6 Cleaned and maintained equipment\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Purpose of tests\n2.2 Principles of the standard methods\n2.3 Calibration procedures and their basis\n2.4 Relevant standards/specifications and their interpretation\n2.5 Recording and Interpretation of test result, including\ncalculation of results from test data where required\n2.6 Procedures for recognition of unexpected or unusual\nresults and likely causes\n2.7 OHS procedures for sample testing\n2.8 Attitudes in the workplace should include\n2.8.1 Accurate\n2.8.2 Self-esteem\n2.8.3 Punctual/Time conscious\n2.8.4 Cost conscious\n2.8.5 Environmental and pollution conscious\n2.8.6 Flexible/adaptable\n2.8.7 Honest\n2.8.8 Dependable\n2.8.9 Innovative\n2.8.10 Alert\n2.8.11 Systematic and organized\n2.8.12 Committed\n2.8.13 Good listener and fast learner\n2.8.14 Creative\n2.8.15 Resourceful\n2.8.16 Self–starter\n3. Underpinning\nSkills\n3.1 Oral and written communication skills\n3.2 Calibrating skills\n3.3 Basic computer skills\n3.4\nBasic mathematical skills ( conversion, percentage and\nformulation)\n3.5\nRecording and reporting skills\n\n--- PDF PAGE 70 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n68\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Demonstration/Direct observation with oral questioning\n4.2 Written test\n4.3 Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Standard laboratory equipped with appropriate\nequipment and calibration standards\n5.2 SOPs, calibration and testing procedures.\n5.3 Materials relevant to the proposed activity\n6. Context of\nAssessment\n6.1 Assessment should be done in the workplace or\nsimulated workplace environment.\n\n--- PDF PAGE 71 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n69\n\nUNIT OF COMPETENCY: OPERATE A BOILER\n\nUNIT CODE : AGR7413xx\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\ninvolved to start, operate, monitor, shut down and store a\nboiler under the supervision of an engineer.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, italicized terms are elaborated in the Range of\nVariables\n1. Start boiler\n1.1 Personal protective clothing and equipment is\nselected for use, following statutory requirements and\nwork place procedures\n1.2 Pre-operational safety checks are conducted in\naccordance with statutory requirements, manufacturer’s\nrecommendations and plant operating procedures\n1.3 Hazards and potential hazards in work area are\nidentified and reported in accordance with statutory\nrequirements and work place procedures\n1.4 Prevention/control measures are selected in accordance\nwith the hierarchy of control.\n1.5 Boiler is started and brought on line safely, in\naccordance with statutory requirements, manufacturer’s\nrecommendations and work place procedures\n1.6 Maintenance requirements are identified and reported\nin accordance with workplace requirements\n\n2. Operate and\nmonitor boiler\n2.1 Operating status is diagnosed and operating log is\nmaintained clearly and accurately, in accordance with\nstatutory requirements and workplace procedures\n2.2 Boiler is monitored in accordance with statutory\nrequirements, manufacturer’s recommendations and\nworkplace procedures\n2.3 Water quality tests are conducted in accordance with\nmanufacturers recommendations and workplace\nprocedures and adjusted as a result of tests to meet\nworkplace criteria\n2.4 Boiler house chemicals are stored and handled in\naccordance with statutory requirements, manufacturer’s\nrecommendations and workplace procedures\n\n--- PDF PAGE 72 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n70\n2.5 Boiler emergency is responded to in accordance with\nstatutory requirements, manufacturer’s\nrecommendations and workplace procedures\n3. Shut down and\nstore boiler\n3.1 Boiler is shut down in accordance with statutory\nrequirements, manufacturer’s recommendations and\nworkplace procedures.\n3.2 Boiler is cleaned internally and externally in accordance\nwith statutory requirements, manufacturer’s\nrecommendations and workplace procedures\n3.3 Boiler valves and fittings are removed for maintenance\nin accordance with statutory requirements,\nmanufacturer’s recommendations and workplace\nprocedures.\n3.4 Appropriate mode of storage is identified in accordance\nwith statutory requirements, manufacturer’s\nrecommendations and workplace procedures.\n3.5 Boiler is stored in accordance with statutory\nrequirements, manufacturer’s recommendations and\nworkplace procedures\n\n--- PDF PAGE 73 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n71\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Protective\nclothing and\nequipment\nRelevant personal protective equipment may include but not\nlimited to:\n1.1 Thermally insulated gloves\n1.2 Hard hat head protection\n1.3 Ear protection (muffs or plugs)\n1.4 Chemical resistant gloves and apron\n1.5 Respiratory devices\n1.6 Working protective gloves\n1.7 Eye protection\n1.8 Whole body fire-resistant clothing\n2. Pre-operational\nsafety checks\nPre-operational checks may include but not be limited to:\n2.1 Checks of feed water supply and system\n2.2 Fuel supply/heat source system\n2.3 Operation and position of boiler valves\n2.4 Boiler water level\n2.5 Combustion air supply system\n2.6 Combustion equipment\n2.7 Essential fittings\n2.8 Fire fighting equipment\n2.9 Inspection and location of explosion doors\n3. Hazards and\npotential hazards\nHazards that may be encountered in the workplace include\nbut are not limited to:\n3.1 Chemical hazards\n3.2 Thermal hazards\n3.3 Boiler low water condition\n3.4 Manual handling hazards\n3.5 Machinery guard requirements\n3.6 Leakage of steam plant\n3.7 Leakage of fuel\n3.8 Rubbish and combustibles in area\n3.9 Fumes from a liquid chemical spill\n3.10 Odor of gas\n4. Maintenance\nrequirements\nMaintenance requirements that may be encountered in the\nworkplace include but are not limited to:\n4.1 Leaking steam pipe\n4.2 Exposed electrical wiring\n4.3 Leaks in high pressure feed line\n4.4 Leaking feed pump gland\n4.5\nLeaking gauge glass mounting\n\n--- PDF PAGE 74 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n72\n4.6 Defective lighting in the workplace\n4.7 Leaking safety valve\n4.8 Lockout tags.\n5. Operating log\nInformation contained in the operating log may include:\n5.1 Time in use\n5.2 Steam pressure\n5.3 Chemical treatment\n5.4 Test results\n5.5 Maintenance/repair requirements.\n6. Boiler monitoring\nMonitoring may include but not be limited to:\n6.1 Checks of steam reticulation line pressure\n6.2 Usage of and supply of steam\n6.3 Quality of steam\n6.4 Combustion/heat source system\n6.5 Feed water system\n6.6 Fuel system\n6.7 Combustion air supply\n6.8 Water level\n6.9 Steam pressure\n6.10 Operation of control/safety devices\n7. House chemicals\nChemicals may include but not be limited to:\n7.1 Extinguishing agent’s carbon dioxide\n7.2 Water\n7.3 Soda acid\n7.4 Organic foam and dry powder\n7.5 Oxygen scavenger\n7.6 Feed water additives\n7.7 Other chemicals\n7.8 Amines\n7.9 Condensate chemicals\n8. Boiler\nemergency\nResponses to an emergency may include but not limited to:\n8.1 Identification of emergency\n8.2 Isolation of heat source\n8.3 Selection and application of appropriate fire-fighting\nequipment\n8.4 Establishment of water level\n8.5 Notification of downstream users\n8.6 Operation of boiler only when safe to do so\n8.7 Notify appropriate regulatory authorities\n9. Valves and\nfittings\nValves and fittings may include but not be limited to:\n\n9.1 Safety valves\n9.2\nGauge glasses\n\n--- PDF PAGE 75 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n73\n9.3 Main steam stop valve\n9.4 Feed water stop valve\n9.5 Blow down valve\n9.6 Flame failure detection device\n9.7 Water level controller\n9.8 Boiler steam pressure gauge\n10. Mode of storage\nModes for storing boilers include:\n10.1 Dry storage\n10.2 Open/close condition\n10.3 Wet storage\n\n--- PDF PAGE 76 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n74\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1 Operated tools, boiler and equipment safely and\neffectively\n1.2 Knew the operating principles and operating methods of\nboilers and steam equipment\n1.3 Knew the processes and procedures relevant to working\nwith a boiler and steam equipment\n1.4 Located, interpreted and applied relevant information,\nstandards and specifications\n1.5 Complied with the site safety plan and occupational\nhealth and safety legislation/regulations/codes of\npractice/advisory standards applicable to workplace\noperations\n1.6 Complied with organizational policies and procedures\nincluding quality requirements\n1.7 Communicated and worked effectively and safely with\nothers.\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Components, controls and features of reciprocating\nsteam engines and their functions\n2.2 Principles of the safe removal of obstacles and hazards\nfrom the workplace\n2.3 Electrical/steam/boiler hazards\n2.4 The hierarchy of hazard control measures with\nelimination of substitution, isolation and engineering\ncontrol measures being selected before safe work\npractices and personal protective equipment\n2.5 Occupational health and safety legislation, standards,\ncodes of practices and advisory standards\n2.6 Licenses and permits including legislative requirements\nwith regard to licensing\n2.7 Demonstrate safe and environmentally responsible\nworkplace practices.\n2.8 Attitudes in the workplace should include\n2.8.1 Punctual/Time conscious\n2.8.2 Cost conscious\n2.8.3 Environmental and pollution conscious\n2.8.4 Flexible/adaptable\n2.8.5 Honest\n2.8.6 Dependable\n2.8.7 Innovative\n2.8.8 Alert\n2.8.9 Systematic and organized\n\n--- PDF PAGE 77 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n75\n2.8.10 Committed\n2.8.11 Good listener and fast learn\n2.8.12 Creative\n2.8.13 Resourceful\n2.8.14 Self–starter\n3. Underpinning\nSkills\n3.1\nReading and interpreting manufacturers’ specifications,\nwork and maintenance plans and material safety data\nsheets\n3.2\nCommunicating faults, malfunctions and workplace\nhazards, reports and maintain operational records\n3.3\nWorking with other boiler operators and personnel in a\nteam environment\n3.4\nUnderstand interrelationship among workplace\nprocesses and procedures in the English language\n3.5\nManual lifting\n3.6\nUnderstand tables and figures for job procedures\n3.7\nUnderstand and interpret signals and instructions in the\nEnglish language.\n3.8\nAble to listen and understand job requirement\n3.9\nPerform routine safety, basic service and maintenance\nprocedures\n3.10 Demonstrate emergency operating procedures.\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation/Demonstration with oral questioning\n4.2 Written test\n4.3 Portfolio\n\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Workplace\n5.2 Temperature measuring equipment\n5.3 Lifting equipment\n5.4 Tubes, valves, and fittings\n5.5 Personal protective clothing and equipment\n5.6 Chemicals e.g. soda acid, amines, additives\n5.7 First aid kit/fire fighting equipment\n5.8 Water testing/gas monitoring equipment\n6. Context of\nAssessment\n6.1 Assessment must be applied in a real work\nenvironment or replicated industrial workplace.\n\n--- PDF PAGE 78 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n76\n\nUNIT OF COMPETENCY: OPERATE PUMPING EQUIPMENT\n\nUNIT CODE :"
