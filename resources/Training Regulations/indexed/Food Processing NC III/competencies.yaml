        "source_text": "AGR741312\n\nUNIT DESCRIPTOR: This unit involves the skills, knowledge and attitude\nrequired to assist in the receipt and storage of stock for a\nprocessing concern. It involves assistance in taking\ndelivery of stock, storing the received stock, rotating and\nmaintaining stock in accordance with relevant regulatory\nand workplace procedures, and completing required\ndocumentation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold Italicized terms are elaborated in the Range of\nVariables\n1. Take delivery of stock\n1.1. Incoming stock is checked against orders and\ndelivery documentation in accordance with\nworkplace procedures\n1.2. Items are subjected to inspection, and variations\nare communicated to the appropriate person in line\nwith workplace procedures\n1.3. All records are completed in accordance with\nworkplace procedures\n2. Store stock\n2.1. All stocks are promptly and safely transported to\nappropriate storage area and stored according to\nworkplace procedures\n2.2. Appropriate personal protection equipment is\nused according to OHS requirements and\nworkplace procedures\n2.3. Stock levels are recorded in accordance with\nworkplace procedures\n2.4. Stock is labeled in accordance with workplace\nprocedures\n3. Rotate and maintain\nstock\n3.1. Stock is rotated, or moved using appropriate\nequipment, where necessary, in accordance with\nworkplace procedures and OHS requirements\n3.2. Stock quality is checked, and out-of-specification\nstocks are reported according to workplace\nprocedures\n3.3. Stock is placed in storage or disposed of in\naccordance with workplace procedures and\nlegislations\n3.4. All required records and documentation are\ncompleted in accordance with workplace procedures\n\n--- PDF PAGE 53 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n51\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include but not limited to:\n1.1. Raw materials\n1.2. Goods in process\n1.3. Finished products\n1.4. Packaging materials and supplies\n1.5. Tools and equipment\n1.6. Office and stationery supplies\n1.7. Forms, brochures and documents\n1.8. Vouchers and tickets\n2. Workplace\nprocedures\nMay include but not limited to:\n2.1. Standard operating procedures\n2.2. Workplace operations manual\n2.3. Occupational health and safety (OHS) procedures\n2.4. Manufacturers' advice\n2.5. Standard forms and reports\n2.6. Written or verbal instructions\n2.7. Workplace quality and customer service standards\n3. Inspection\nItems are inspected for the following:\n3.1. Damage\n3.2. Quality\n3.3. “Use-by / Best before” dates\n3.4. Breakages\n3.5. Discrepancies\n4. Records\nMay include but not limited to:\n4.1. Name of warehouseman\n4.2. Date of delivery\n4.3. Type of stock\n4.4. Stock codes\n4.5. Quantity\n4.6. Quality specifications\n4.7. “Use by/ Best before” dates\n4.8. Supplier information\n4.9. Reports re: out-of-specification deliveries, as\nnecessary\n4.10. Receipts and withdrawals\n5. Personal protective\nequipment (PPE)\nMay include but not limited to:\n5.1 Gloves\n5.2 Safety headwear and footwear\n5.3 Safety glasses\n5.4\nProper work clothes\n6. OHS requirements\nOccupational Health and Safety requirements may include:\n6.1 Health/medical certificate\n\n--- PDF PAGE 54 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n52\n6.2 DOLE requirements\n6.3 Personal hygiene and good grooming\n6.4 Plant sanitation and waste management\n6.5 BFAD requirements\n6.6 PPE requirements\n\n--- PDF PAGE 55 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n53\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. took delivery of stock\n1.2. stored stock\n1.3. rotated and maintained stock\n1.4. followed work procedures\n1.5. completed required documentation\n\nThe skills and knowledge required in receiving and storing\nstock must be transferable to a different work environment.\n2. Underpinning\nKnowledge and\nAttitude\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1. Basic knowledge of relevant stock\n2.2. Interpretation of workplace specifications and orders\nfor supplies\n2.3. Stock security systems\n2.4. Safe lifting, handling and storage procedures\n2.5. Warehouse plan/layout\n2.6. Protocols and procedures for liaising with supplier\nrepresentatives, drivers and colleagues using\nappropriate technology\n2.7. Relevant OHS and environmental regulations and\nprocedures\n2.8. Relevant codes of practice and legislative\nrequirements (for example dangerous goods\nregulations, health and hygiene regulations, etc.)\n2.9. Completion of relevant records/documentation\n\n2.10. Attitudes in the workplace should include:\n2.10.1 Honest\n2.10.2 Dependable\n2.10.3 Accurate\n2.10.4 Environment-conscious\n2.10.5 Positive work values\n2.10.6 Cost conscious\n2.10.7 Safety conscious\n3. Underpinning Skills\n3.1. Ability to read and interpret instructions, procedures\nand labels relevant to receiving and storing stock\n\n--- PDF PAGE 56 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n54\n3.2. Ability to select and use relevant\ncommunications/computing equipment when\nreceiving and storing stock\n3.3. Ability to select and use relevant personal protection\nequipment\n3.4. Ability to follow work procedures\n3.5. Oral and written communication skills\n3.6. Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation/Demonstration with oral\nquestioning\n4.2. Written test\n4.3. Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Specific work area/station\n5.2 Equipment and tools for receiving and storing stock\n5.3 Materials relevant to the proposed activity\n5.4 Relevant workplace procedures, schedules and\nrecords\n\n6. Context of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2 Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 57 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n55\n\nUNIT OF COMPETENCY: CONTROL AND ORDER STOCK\n\nUNIT CODE :"
