 Process stock orders\n2.5 Follow up orders\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n\n3. Apply product\nknowledge to\ncomplete work\noperations (24 hrs)\n\n3.1 Identify products in a\nsubsection of a\nwarehouse or other\nstorage area\n3.2 Examine quality and report\non products\n3.3 Use inventory and labeling\nsystems to identify and\nlocate products\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n\n4. Perform basic\ntests in raw\nmaterials, in\nprocess and\nfinished products\n(40 hrs)\n4.1 Receive, label, and store\nsamples for testing\n4.2 Prepare samples\n4.3 Perform tests on samples\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n\n 5. Operate a boiler\n(32 hrs)\n5.1 Start boiler\n5.2 Operate and monitor boiler\n5.3 Shut down and store boiler\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n\n6. Operate pumping\n6.1 Prepare pumps for\n• Audio Visual\n•\nObservation\n\n--- PDF PAGE 111 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n109\nequipment (32 hrs)\noperation\n6.2 Operate Pumping\nEquipment\n6.3 Shutdown and Maintain\nPumping Equipment\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n\n7. Operate and\nmonitor food\nprocesses and\nequipment (320\nhrs)\n7.1 Prepare the food\nequipment and process for\noperation\n7.2 Operate and Monitor the\nFood Process\n7.3 Shutdown, Clean and\nMaintain the Food Process\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n8. Operate a\npackaging process\n(200 hrs)\n8.1 Prepare equipment and\nprocess for operation\n8.2 Operate and Monitor the\nProcess\n8.3 Shutdown the Process\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n\n9. Work in a freezer\nstorage area (24\nhrs)\n9.1 Prepare to enter a freezer\nstorage environment\n9.2 Monitor equipment\noperation in a freezer\nstorage environment\n9.3 Handle frozen product\nsafely\n9.4 Respond to freezer storage\narea exposure and gas\nleaks\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n\n10. Work with\ntemperature\ncontrolled stock\n(24 hrs)\n10.1 Store stock to meet\ntemperature control\nrequirements\n10.2 Monitor and maintain\ntemperature of stock\nwithin specifications\n10.3 Identify and rectify\nproblems\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n\n11. Handle\ndangerous\ngoods/\nhazardous\nsubstances (24\nhrs)\n11.1 Identify requirements for\nworking with dangerous\ngoods and/or hazardous\nsubstances\n11.2 Confirm site incident\nprocedures\n11.3 Select handling\ntechniques\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n•\nWritten Test\n\n--- PDF PAGE 112 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n110\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 113 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n111\n•\nProject-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate both oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n FOOD PROCESSING NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Food Processing NC III.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n5\nWeighing scales and\nbalances of various\ncapacities and\nsensitivities\n1 set\nFood processing\nsystem with retort,\npump, boiler, cooker,\nsteamer, dehydrator\nA. Food supplies\n5\nDietetic scales (1 kg.\ncapacity)\n1\nChiller\n5 doz\nFresh eggs\n15\nPairing knives\n1\nRefrigerator\n10 kg\nFresh meat\n10\nPeelers\n1\nFreezer\n10\npcs\nDressed poultry\n5\nMeasuring spoons,\nsets\n5\nStoves\n20 kg\nFresh fish\n(medium size)\n5\nMeasuring cups\n(solid)\n1 set Food packaging\nsystem with filling &\nsealing, can seamer,\nshrink wrapper,\nstrapper, case\npacker, labeler\n1 set\nCuring\ningredients (good\nfor 10 kg)\n5\nMeasuring cups\n(liquid)\n1\nJack lift\n20 kg\nFresh fish (small)\n1 set\nWrench, screw\ndriver, belts, nuts &\nbolts\n1\nTrolley\n10 kg\nFresh fruits\n2\nClocks/timer\n1\nWheeler\n10 kg\nFresh vegetables\n\n--- PDF PAGE 114 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n112\n15\nMixing bowls,\nstainless steel\n1\nPoly/temperature\nsealer\n2 gal\nAll spice pickling\nsolution\n10\nHard plastic\nchopping boards\n1\nCap sealer\n3 kg\nSalt (Pangasinan)\n5\nThermometers of\nvarying temperature\nrange\n1\nPressure canner\n1\nsack\nRefined sugar\n5\nGlasswares like\ncylinder, beaker,\nflask\n1\nPressure cooker\n3 gal\nVinegar\n5\nJar liter\n1\nCap seal\n1 gal\nMother vinegar\n1\nFood processor, set\n1\nOven\n1 kg\nCitric acid\n5\nWire baskets\n2\nSteam-jacketed\nkettle\n1 kg\nSodium benzoate\n15\nCasseroles stainless\nsteel\n5\nSmoking trays\n1 kg\nFirming agent\n10\nSaucepan, stainless\nsteel\n1\nMeat grinder\n1 can\nActive dry yeast\n15\nSpoons, wooden\n1\nStuffer/linker\n\n10\nSpoon, basting\n1\nSilent cutter\nB. Non food\n4\nPaddles, wooden\n2\nBrix refractometers\n(0-90o brix)\n5\nsets\nPackaging\nmaterials – can,\npaper, plastic,\nbottle, glass,\ncarton, laminates\n10\nFood tongs\n1\nSalinometer\n1\npack\nTags/labels\n2\nSteamer\n2\nElectronic scales\n(0.1 gm capacity)\n1 set\nChemicals – soda\nacid, amines,\ncondensate\nchemicals\n5\nSoaking container\n1\nConsistometer/\nviscosimeter\n3\nboxe\ns\n8 oz., 12 oz.,\nround bottles w/\nPVC caps\n5\nFermented\ncontainers\n1\nVacuum pack\nmachine\n3\nboxe\ns\nCatsup bottles w/\nplastic caps\n20\nUtility trays\n1\nLaboratory scale\ncabinet drier or\nforced draft oven\n2\npack\ns\nCap seals\n15\nColanders, stainless\nsteel\n1\nHeadspace gauge\n2\ngals\nDisinfectant/\nsanitizers\n\n5\nsets\nTest equipment – pH\nmeter, centrifuge,\nmoisture meter, color\nchart /colorimeter,\ntexture meter\n3 set\nVarious test\nreagents e.g.\nhydrochloric acid,\nsulfuric acid,\nsodium\n\n--- PDF PAGE 115 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n113\nhydroxide,\nhydrogen\nperoxide\n\nTRAINING\nMATERIALS\n5\nsets\nComputer\n5\nBar soap/\ndetergent\n\nBooks/reference\n5\nsets\nFire Fighting\nEquipment\n1 btl.\nGlue\n\nManuals\n5\nsets\nFirst aid kit\n\nVideos\n5\nsets\nPPE – apron, mouth\nmask, gloves, rubber\nboots, head gear,\nhard hat, goggles,\nheavy sweater\n\n3.5 TRAINING FACILITIES\n\nFOOD PROCESSING NC III\n\nThe food processing workshop must be of concrete structure. Based on a class\nsize of 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building (permanent)\nLaboratory area\n6 x10\n60\n60\nTool room & S/M storage\narea\n4 x 5\n20\n20\nLearning resource area\n5 x 6\n30\n30\nWash area/comfort room\n(male & female)\n2.5 x 4\n10\n10\nTotal\n120\nFacilities/Equipment/Circul\nation (30% of teaching\naccommodation)\n\n40\nB. Experimental Land\nArea\n\nn/a\nTotal workshop area\n160\n\nNote: Experimental area will change according to availability of land.\n\n--- PDF PAGE 116 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n114\n3.6 TRAINER’S QUALIFICATIONS FOR FOOD PROCESSING NC III\n\nTRAINER QUALIFICATION (TQ III)\n• Must be a holder of Food Processing NC III or its equivalent\n• Must have undergone training on Training Methodology III (TM III)\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by the learner who\nenrolled in a structured learning program to determine the achievement of\ncompetencies. It is administered by the trainer/assessor at end of each\nlearning module.\n\nThe result of the institutional assessment may be considered as an\nevidence for national assessment.\n\n--- PDF PAGE 117 ---\n_______________________________________________________