  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Food Processing NC III, the\ncandidate must demonstrate competence of all the units listed in Section\n1. Successful candidates shall be awarded a National Certificate signed\nby the TESDA Director General.\n\n4.2 The qualification of Food Processing NC III may be attained through\naccumulation of Certificates of Competency (COCs) in the following\nareas:\n\n4.2.1 Receive, store, control and order stock\n4.2.1.1\nReceive and store stock\n4.2.1.2\nControl and order stock\n4.2.1.3\nApply product knowledge to complete work operations\n4.2.1.4\nHandle dangerous goods/hazardous substances\n4.2.2 Perform basic tests in raw materials, in process and finished\nproducts\n4.2.3 Operate a boiler\n4.2.4 Operate pumping equipment\n4.2.5 Operate and monitor food processes and equipment\n4.2.6 Operate a packaging process\n4.2.7 Work in a freezer and with temperature controlled stock\n4.2.7.1\nWork in a freezer storage area\n4.2.7.2\nWork with temperature controlled stock\n\nSuccessful candidates shall be awarded Certificates of\nCompetency (COCs)\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units\nof competency comprising a qualification, an individual shall be issued\nthe corresponding National Certificate\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n 4.5 The following are qualified to apply for assessment and certification:\n\n 4.5.1 Graduates of formal, non formal and informal including\nenterprise-based training programs.\n4.5.2. Experienced workers ( wage employed or self-employed)\n\n 4.6 The guidelines on assessment and certification are discussed in detail in\nthe Procedures manual on Assessment and Certification and Guidelines\non the implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 118 ---\n____________________________________________________________________________\nTR- Food Processing NC III\n\n116\n"
