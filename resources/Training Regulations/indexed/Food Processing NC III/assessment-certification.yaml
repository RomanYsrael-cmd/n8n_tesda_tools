      "text": "6 The guidelines on assessment and certification are discussed in detail in the Procedures manual on Assessment and Certification and Guidelines on the implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 118 --- ____________________________________________________________________________ TR- Food Processing NC III 116 Implement sampling procedures Load and unload raw materials, products and/or supplies Control and order stock Operate a packaging process Participate in sensory analysis Inspect and sort materials and product Process Food by Salting, Curing and Smoking Apply product knowledge to complete work operations Work in a freezer storage area Set up and operate processes in a production / packaging system Dispense non bulk ingredients Process Food by Fermentation and Pickling Perform basic tests in raw materials, in process and finished products Work with temperature controlled stock Participate in an audit process Prepare raw materials for processing Process food by sugar concentration Operate a boiler Handle dangerous goods/hazardous substances Participate in a HACCP team Operate basic equipment Package Finished / Processed Food Products Operate pumping equipment Apply raw materials / ingredients and process knowledge Monitor workplace performance and participate in improvement processes Clean and sanitize equipment and processing/packaging area Receive and store stock Operate and monitor food processes and equipment Maintain food safety when loading, unloading and transporting food --- PDF PAGE 119 --- ____________________________________________________________________________ TR- Food Processing NC III 117 Continuation ….. Competency Map for Processed Food and Beverages Sector Apply Food Safety and Sanitation Use Standard Measuring Devices / Instruments Use Food Processing Tools, Equipment and Utensils Follow work procedures to maintain Good Manufacturing Practice Perform Mathematical Computation Implement Good Manufacturing Practice Procedures Implement Environmental Policies and Procedures Monitor the Implementation of Good Manufacturing Practice Procedures Monitor the Implementation of Environmental Policies and Procedures Receive and Respond to Workplace Communication Participate in Workplace Communication Lead Workplace Communication Use Relevant Technologies Collect, analyze and organize information Work with Others Work in a Team Environment Lead Small Team Utilize Specialized Communication Skills Plan and Organize Work Demonstrate Work Values Practice Career Professionalism Develop and practice negotiation skills Develop Team and Individual Practice Housekeeping Procedures Practice Occupational Health and Safety Procedures Solve Workplace Problems Related to Work Activities Apply Problem Solving Techniques in the Workplace Food Processing NC III --- PDF PAGE 120 --- ___________________________________________________ TR-Food Processing NC III 118 For the purpose of this competency standard, the following words are defined: .1 Competency – is the application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace. .2 Unit of Competency – describes a work activity. .3 Elements – are building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in a particular area of work is able to perform. .4 Performance Criteria – are evaluative statements that specify what is to be assessed and the required level of performance. .5 Range of Variables – describe the circumstances or context in which the work is to be performed. .6 Evidence Guide – a guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment methods. .7 Blanching – refers to a heat treatment in which the raw food material is immersed in hot water or exposed to live steam. .8 Bottling/Canning – refers to a preservation of foods in hermetically sealed containers such as tin cans and glass jars by sterilization with heat .9 BFAD - means Bureau of Food and Drug .10 Brine – refers to a salt solution .11 Cabinet Drying - refers to a process of dehydrating food material using a cabinet drier consisting of a closed chamber which is well insulated against heat loss .12 Chilling – is subjecting meat to a temperature of 2-4°C(36-40°F at certain period of time .13 Curing – refers to a process by which salt, sugar and salitre and other preservatives and adjuncts are introduced/are used to prolong the keeping quality of the products --- PDF PAGE 121 --- ___________________________________________________ TR-Food Processing NC III 119 .14 Dehydration- refers to drying by artificially produced heat under carefully controlled conditions of temperature, humidity and airflow within a chamber .15 Dry Curing– refers to a method of curing meat where curing mixture is rubbed on the surface of the food material being cured. .16 Exhausting – refers to the removal of air and gases from the raw material and the container before sealing; It refers to the heating of canned foods to a center can temperature of 180°C to 205°F before sealing. .17 Fermentation – refers to the anaerobic oxidation of carbohydrates by microbial enzymes .18 Food Additives- refer to substances intentionally added to foods to achieve or retain desired characteristics .19 Food Processing – refers to the application of heat in varying degree to the food enclosed in a container for a sufficient time to sterilize the product .20 GMP – Good Manufacturing Practice which is a combination of manufacturing and quality control procedures aimed at ensuring that products are consistently manufactured to their specifications .21 GRAS - means generally regarded as safe .22 HACCP – Hazard Analysis Critical Control Point is a food safety management system which concentrates prevention strategies on known hazards and the risks of them occurring at specific points in the food chain .23 Hazard – the potential to cause harm which may include bacteria, virus, toxin, parasite, chemical or physical hazard. Operational malpractices or other operations/processes can also become hazards if they lead to unacceptable contamination or growth and survival of organisms and microorganisms .24 Hermetic Sealing - refers to the closure of tin cans or glass jars tightly to prevent the entrance of microorganisms .25 Packaging – any container or material used in the packaging of a product which may include materials in direct contact with the product, printed packs including labeling, and other materials including outer cartons or delivery cases .26 Packing Medium – refers to brine, syrup, broth, oil or other similar ingredients used as canning medium .27 Pickling- refers to the preservation of foods by brine and vinegar with or without bacterial fermentation --- PDF PAGE 122 --- ___________________________________________________ TR-Food Processing NC III 120 .28 pH meter – refers to an instrument used to measure the acidity of a sample .29 Preservatives- refer to food additives that retard spoilage and preserve the natural color & flavor of food products .30 Pulverize – to reduce by crushing or grinding to very small particles .31 Raw Materials – consist of the main food material to be processed including minor food ingredients .32 Retort Specification – refers to a steam pressure canner used in sterilizing low acid canned foods .33 Salinometer- refers to the instrument to measure strength of brine .34 Sanitation - refers to the process of treating food contact and non-food contact surface with physical agents and chemicals to kill the residual microorganisms present after cleaning .35 Smoke – refers to the gas from burning wood material containing combustible and noncombustible substances, the combustible substances are the main sources of smoke which consist of cellulose, lignin, pentosans, tannic acid, protein substances, resins and terpenes .36 Smoking – refers to subjecting the product to the action of smoke from burning wood materials .37 Smoke House- refers to a closed smoke chamber where smoke is produced which may range from the temporary (barrel) smoke house to the permanent frame or concrete smoke house. .38 Standard Measurement – refers to something set up as a rule for measuring or a model to be followed .39 Sugar Concentrates – refer to products cooked with sugar to attain a concentration of 40-65% or to saturated sucrose level .40 Syrup – refers to a sugar solution whether light, medium or heavy syrup .41 Thermal Processing – refers to the method of processing food in hermetically sealed container by applying heat with the right temperature and time, enough to kill microorganisms responsible in the spoilage of food which involve bottling and canning --- PDF PAGE 123 --- ___________________________________________________ TR-Food Processing NC III 121 .42 Water Bath – it is a set up used for canning consisting of a large kettle with fitting cover deep enough to have an inch or two over the tops of the containers of food and an extra 1-2 inch space for boiling with a wooden or metal rack made for holding filled containers; used for processing high acid canned products. --- PDF PAGE 124 --- ___________________________________________________ TR-Food Processing NC III 122 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of this Training Regulation. PHILIPPINE CHAMBER OF AGRICULTURE AND FOOD INC. Mr. EDWARD F. DAVID Chair, PhilFoodEx Rm. 305, Bahay ng Alumni Pres. Ramon Magsaysay Ave. U.P. Campus, Diliman, Quezon City Ms. CECILIA DELA PAZ Nutrivina Phils. Unit 801, Manila Luxury Cond. Pearl Drive cor. Goldloop St., Ortigas Pasig City Mr. JOSE D. GONZALES, JR. Rizal Experimental Station & Pilot School of Cottage Industries Jenny’s Avenue Extn. Maybunga, Pasig City Ms. AURORA C. SUBIDA Maya Kitchen 8th Flr., Liberty Building, Pasay Road Makati City Mr. BOBBY C. PRADEL Mofel’s Food International Corp 20220 Arpilleda St., Makati City Mr. GEORGE LORENZANA Lorenzana Food Corp. 551 M. Naval St., Navotas, Metro Manila Ms. LOURDES M. LABRADOR Catillejos Agri-Farms Inc. Boni Avenue, Mandaluyong City Mr. ANTONIO A. TAN Universal Robina Corporation E. Rodriguez Jr. Avenue, Pasig City Mr. GILBERT P. EVARISTO Gema Coco Foods Corporation White Plains, Quezon City Mr. CARLOS N. JOSE Nestle Philippines Incorporated Rockwell Center, Makati City --- PDF PAGE 125 --- ___________________________________________________ TR-Food Processing NC III 123 The PARTICIPANTS in the National Validation of this Training Regulation Castillejos Agri-Farms Inc. Department of Science and Technology – Industrial Technology Development Institute Food Development Center Goldilocks Marigold Commodities Corporation Narigin Food Corporation Technology Resource Center The Management and Staff of TESDA Secretariat"
