  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment p\nprocess is based on evidence or information gathered to prove achievement of\ncompetencies. The process may be applied to a full qualification or employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals\nwho were assessed as competent in a single unit or cluster of related units of\ncompetency.\n\n4.1.2.1.\nAssist in Quality Inspection\n\n4.1.2.2.\nDispense Materials\n\n4.1.2.3.\nPrepare Packaging Materials and Supplies for Processing\n\n4.1.2.4.\nOperate Basic Equipment\n\n4.1.2.5.\nClean and Sanitize Equipment and Processing/Packaging\nPremises\n\n4.1.2.6.\nDebone and Fillet Fish\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the\ncorresponding National Certificate for the Qualification.\n\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the relevant unit/s of competency.\n\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n--- PDF PAGE 144 ---\nFood Processing NC I Promulgated January 11, 2019 140\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 145 ---\nFood Processing NC I Promulgated January 11, 2019 141\nCOMPETENCY MAP FOR PROCESSED FOOD AND BEVERAGES SECTOR\n\nFOOD PROCESSING NC I\n\nCORE UNITS OF COMPETENCY\n\nAssist in Quality\nInspection\nDispense Materials\nPrepare Packaging\nMaterials and Supplies\nfor Processing\nOperate Basic\nEquipment\nClean and Sanitize\nEquipment and\nProcessing/Packaging\nPremises\nDebone and Fillet Fish\n\nCOMMON UNITS OF COMPETENCY\n\nApply Food Safety and\nSanitation\nUse Standard Measuring\nDevices / Instruments\nUse Food Processing\nTools, Equipment and\nUtensils\nImplement Good\nManufacturing Practice and\nProcedures\n\nBASIC UNITS OF COMPETENCY\n\nReceive and respond to\nworkplace\ncommunication\nWork with others\nSolve/address routine\nproblems\nEnhance self-\nmanagement skills\nSupport innovation\nAccess and maintain\ninformation\nFollow occupational\nsafety and health\npolicies and procedures\nApply environmental\nwork standards\nAdopt entrepreneurial\nmindset in the\nworkplace\n\n--- PDF PAGE 146 ---\nFood Processing NC I Promulgated January 11, 2019 142\nGLOSSARY OF TERMS\n\nFor the purpose of this competency standard, the following words are defined:\n\n1.\nBasic equipment - equipment requiring limited application and process knowledge\nand limited equipment adjustment.\n\n2.\nCleaning - the process of removing the maximum amount of soil from an article in the\nmost efficient way.\n\n3.\nCompetency – the application of knowledge, skills and attitudes to perform work\nactivities to the standard expected in the workplace.\n\n4.\nDispense – to provide, to give, to distribute.\n\n5.\nDefects – refer to deviations from the required specifications\n\n6.\nElement – building blocks of a unit of competency. It describes in outcome terms the\nfunctions that a person who works in a particular area of work is able to perform.\n\n7.\nE numbers - all numbers prefixed with E are food additives which are legal in the\nwhole of the European Union. Those prefixed with (E) are licensed for use in the\nUnited Kingdom and possibly other countries but not throughout the EU generally\n(International Dictionary of Food and Cooking, 1998).\n\n8.\nEvidence Guide – a guide for assessment that provides information on critical aspects\nof competency, underpinning knowledge, underpinning skills, resource implications,\ncontext of assessment and assessment methods.\n\n9.\nFood additives - substances intentionally added to foods to achieve or retain desired\ncharacteristics\n\n10.\nFood processing - the methods and techniques used to transform raw ingredients\ninto finished food products\n\n11.\nForklift - a powered industrial truck used to lift and transport materials, normally by\nmeans of steel forks inserted under the load.\n\n12.\nGood Manufacturing Practice (GMP) - a combination of manufacturing and quality\ncontrol procedures aimed at ensuring that products are consistently manufactured to\ntheir specifications.\n\n13.\nGrading – the process of classifying into groups according to a set of recognized\ncriteria\n\n14.\nGRAS - Generally Regarded As Safe\n\n15.\nHazard Analysis Critical Control Point (HACCP) - a food safety management\nsystem which concentrates prevention strategies on known hazards and the risks of\nthem occurring at specific points in the food chain.\n\n--- PDF PAGE 147 ---\nFood Processing NC I Promulgated January 11, 2019 143\n\n16.\nHazard – the potential to cause harm which may include bacteria, virus, toxin, parasite,\nchemical or physical hazard. Operational malpractices or other operations/processes\ncan also become hazards if they lead to unacceptable contamination or growth and\nsurvival of organisms and microorganisms.\n\n17.\nNon-bulk – ingredients, spices, pre-mixed ingredients\n\n18.\nPackaging – any container or material used in the packaging of a product which may\ninclude materials in direct contact with the product, printed packs including labeling,\nand other materials including outer cartons or delivery cases.\n\n19.\nPacking - act of putting materials and/or products in a container\n\n20.\nPallet - low, portable platform made of wood or metal or in combination to facilitate\nhandling, storage or transport of materials and products as a unit load using forklift.\n\n21.\nPerformance Criteria – evaluative statements that specify what is to be assessed and\nthe required level of performance.\n\n22.\npH meter - an instrument used to measure the acidity of a sample\n\n23.\nPortfolio - documentary evidence of a person’s knowledge and skills\n\n24.\nPre-coding – stamping/labeling of stickers of packaging materials\n\n25.\nProcessing aid – an additive which facilitates processing without significantly\ninfluencing the character or properties of the finished product (Australian Institute of\nFood Science and Technology, and Association of Public Analysts)\n\n26.\nRange of Variables – describes the circumstances or context in which the work is to\nbe performed.\n\n27.\nRaw materials - consist of the main food material to be processed including minor\nfood ingredients\n\n28.\nRefractometer - instrument commonly used for measuring fluid concentrations such\nas sugar content (Brix level) of carbonated beverages, fruits, juices, and/or\nvegetables.\n\n29.\nRisk - the probability that a particular adverse consequence results from a hazard\nwithin a stated time under stated conditions (Australian Institute of Food Science and\nTechnology, and Association of Public Analysts)\n\n30.\nSalinometer - instrument used to measure strength of brine\n\n31.\nSampling - the process of drawing or selecting product units from a lot to project the\ncharacteristics of a larger population.\n\n--- PDF PAGE 148 ---\nFood Processing NC I Promulgated January 11, 2019 144\n32.\nSanitation - the process of treating food contact and non-food contact surface with\nphysical agents and chemicals to kill the residual microorganisms present after\ncleaning\n\n33.\nSorting - the process of classifying materials and/or products according to a set of\ncriteria such as size, weight, color, variety, among others.\n\n34.\nUnit of Competency – describes a work activity.\n\n--- PDF PAGE 149 ---\nFood Processing NC I Promulgated January 11, 2019 145\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nFood Processing NC I\nQualification Code:\nPFBFOP119\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nFood Processing NC I\nNot Applicable\nTB No. 2007-56\nDecember 19,\n2007\nNot\nApplicable\n01\nDocument Amended\nFood Processing NC I\nTB No. 2007-56\nDecember 19,\n2007\nTB No. 2019-05\nJanuary 11,\n2019\nIn Transit\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 150 ---\nFood Processing NC I Promulgated January 11, 2019 146\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nrecognize the commitment of industry stakeholders who shared their time and expertise for\nthe development of this Training Regulations.\n\nTHE TECHNICAL EXPERT PANEL\n\nMS. LOURDES S. RIVERA\nTechnical Expert\nUltima Entrepinoy Forum Center\nNutrition Foundation of the Philippines\nBuilding, 107 E. Rodriguez Ave., Quezon\nCity\n\nMS. MA. DIVINA D. ALCASABAS\nTechnical Expert\nPhilippine Women's University\nPhil. Assoc. of Food tech.\nCityland, Shaw Blvd.\nMS. JOSEPHINE M. MAZA\nTechnical Expert\nWinfield International Training and\nConsultancy, Inc.\nUnit 1206, 12F Cityland Condominium 10\nTower II, 154 H.V. Dela Costa St., cor\nValero St., Salcedo Village, Makati\n\nMS. RACHEL F. ROCAFORT\nTechnical Expert\nFood Development Center\nFTI Complex, Taguig City\n\n• THE PARTICIPANTS OF NATIONAL VALIDATION\n\nA. LIST OF VALIDATORS\n\n1. SANCHO E. PAYOS\nMeatworld International\n\n2. MARJESS S. BONCATO\nLa Filipina Foods\n\n3. ETHEL LOPEZ\nNewly Weds Foods\n\n4. SALISA S. BIÑAN\nNFHFI/ Jr. Mercado & Sons\nAgricultural, Ent., Inc.\n\n5. MARGARET BONANZA\nNFHFI/ Jr. Mercado & Sons\nAgricultural, Ent., Inc.\n\n--- PDF PAGE 151 ---\nFood Processing NC I Promulgated January 11, 2019 147\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat