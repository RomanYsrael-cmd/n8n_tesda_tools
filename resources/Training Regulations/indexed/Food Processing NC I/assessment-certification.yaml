      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all units of competency in a qualification with a promulgated Training Regulations. 4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals who were assessed as competent in a single unit or cluster of related units of competency. 4.1.2.1. Assist in Quality Inspection 4.1.2.2. Dispense Materials 4.1.2.3. Prepare Packaging Materials and Supplies for Processing 4.1.2.4. Operate Basic Equipment 4.1.2.5. Clean and Sanitize Equipment and Processing/Packaging Premises 4.1.2.6. Debone and Fillet Fish 4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification. 4.1.4 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency. 4.1.5 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry Food Processing NC I Promulgated January 11, 2019 140 4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/ assessment process."
