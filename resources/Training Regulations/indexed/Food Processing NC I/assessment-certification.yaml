    {
      "number": "4.2",
      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 145 --- Food Processing NC I Promulgated January 11, 2019 141 Assist in Quality Inspection Dispense Materials Prepare Packaging Materials and Supplies for Processing Operate Basic Equipment Clean and Sanitize Equipment and Processing/Packaging Premises Debone and Fillet Fish Apply Food Safety and Sanitation Use Standard Measuring Devices / Instruments Use Food Processing Tools, Equipment and Utensils Implement Good Manufacturing Practice and Procedures Receive and respond to workplace communication Work with others Solve/address routine problems Enhance self- management skills Support innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace --- PDF PAGE 146 --- Food Processing NC I Promulgated January 11, 2019 142 For the purpose of this competency standard, the following words are defined: 1. Basic equipment - equipment requiring limited application and process knowledge and limited equipment adjustment. 2. Cleaning - the process of removing the maximum amount of soil from an article in the most efficient way. 3. Competency – the application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace. 4. Dispense – to provide, to give, to distribute. 5. Defects – refer to deviations from the required specifications 6. Element – building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in a particular area of work is able to perform. 7. E numbers - all numbers prefixed with E are food additives which are legal in the whole of the European Union. Those prefixed with (E) are licensed for use in the United Kingdom and possibly other countries but not throughout the EU generally (International Dictionary of Food and Cooking, 1998). 8. Evidence Guide – a guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment methods. 9. Food additives - substances intentionally added to foods to achieve or retain desired characteristics 10. Food processing - the methods and techniques used to transform raw ingredients into finished food products 11. Forklift - a powered industrial truck used to lift and transport materials, normally by means of steel forks inserted under the load. 12. Good Manufacturing Practice (GMP) - a combination of manufacturing and quality control procedures aimed at ensuring that products are consistently manufactured to their specifications. 13. Grading – the process of classifying into groups according to a set of recognized criteria 14. GRAS - Generally Regarded As Safe 15. Hazard Analysis Critical Control Point (HACCP) - a food safety management system which concentrates prevention strategies on known hazards and the risks of them occurring at specific points in the food chain. --- PDF PAGE 147 --- Food Processing NC I Promulgated January 11, 2019 143 16. Hazard – the potential to cause harm which may include bacteria, virus, toxin, parasite, chemical or physical hazard. Operational malpractices or other operations/processes can also become hazards if they lead to unacceptable contamination or growth and survival of organisms and microorganisms. 17. Non-bulk – ingredients, spices, pre-mixed ingredients 18. Packaging – any container or material used in the packaging of a product which may include materials in direct contact with the product, printed packs including labeling, and other materials including outer cartons or delivery cases. 19. Packing - act of putting materials and/or products in a container 20. Pallet - low, portable platform made of wood or metal or in combination to facilitate handling, storage or transport of materials and products as a unit load using forklift. 21. Performance Criteria – evaluative statements that specify what is to be assessed and the required level of performance. 22. pH meter - an instrument used to measure the acidity of a sample 23. Portfolio - documentary evidence of a person’s knowledge and skills 24. Pre-coding – stamping/labeling of stickers of packaging materials 25. Processing aid – an additive which facilitates processing without significantly influencing the character or properties of the finished product (Australian Institute of Food Science and Technology, and Association of Public Analysts) 26. Range of Variables – describes the circumstances or context in which the work is to be performed. 27. Raw materials - consist of the main food material to be processed including minor food ingredients 28. Refractometer - instrument commonly used for measuring fluid concentrations such as sugar content (Brix level) of carbonated beverages, fruits, juices, and/or vegetables. 29. Risk - the probability that a particular adverse consequence results from a hazard within a stated time under stated conditions (Australian Institute of Food Science and Technology, and Association of Public Analysts) 30. Salinometer - instrument used to measure strength of brine 31. Sampling - the process of drawing or selecting product units from a lot to project the characteristics of a larger population. --- PDF PAGE 148 --- Food Processing NC I Promulgated January 11, 2019 144 32. Sanitation - the process of treating food contact and non-food contact surface with physical agents and chemicals to kill the residual microorganisms present after cleaning 33. Sorting - the process of classifying materials and/or products according to a set of criteria such as size, weight, color, variety, among others. 34. Unit of Competency – describes a work activity. --- PDF PAGE 149 --- Food Processing NC I Promulgated January 11, 2019 145 TRAINING REGULATIONS (TR) Qualification Title: Food Processing NC I Qualification Code: PFBFOP119 Revision No. Document Description Types* Replaces Version (TESDA Board Resolution No./ Date) New Version (TESDA Board Resolution No./ Date) Deployment (TESDA Circular/ Implementing Guidelines) 00 Document Created Food Processing NC I Not Applicable TB No. 2007-56 December 19, 2007 Not Applicable 01 Document Amended Food Processing NC I TB No. 2007-56 December 19, 2007 TB No. 2019-05 January 11, 2019 In Transit Legend: *Description Types - Document Created - Document Amended --- PDF PAGE 150 --- Food Processing NC I Promulgated January 11, 2019 146 The Technical Education and Skills Development Authority (TESDA) would like to recognize the commitment of industry stakeholders who shared their time and expertise for the development of this Training Regulations. MS. LOURDES S. RIVERA Technical Expert Ultima Entrepinoy Forum Center Nutrition Foundation of the Philippines Building, 107 E. Rodriguez Ave., Quezon City MS. MA. DIVINA D. ALCASABAS Technical Expert Philippine Women's University Phil. Assoc. of Food tech. Cityland, Shaw Blvd. MS. JOSEPHINE M. MAZA Technical Expert Winfield International Training and Consultancy, Inc. Unit 1206, 12F Cityland Condominium 10 Tower II, 154 H.V. Dela Costa St., cor Valero St., Salcedo Village, Makati MS. RACHEL F. ROCAFORT Technical Expert Food Development Center FTI Complex, Taguig City • THE PARTICIPANTS OF NATIONAL VALIDATION A. LIST OF VALIDATORS"
