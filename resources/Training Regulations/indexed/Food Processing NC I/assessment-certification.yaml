  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment p\nprocess is based on evidence or information gathered to prove achievement of\ncompetencies. The process may be applied to a full qualification or employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals\nwho were assessed as competent in a single unit or cluster of related units of\ncompetency.\n\n4.1.2.1.\nAssist in Quality Inspection\n\n4.1.2.2.\nDispense Materials\n\n4.1.2.3.\nPrepare Packaging Materials and Supplies for Processing\n\n4.1.2.4.\nOperate Basic Equipment\n\n4.1.2.5.\nClean and Sanitize Equipment and Processing/Packaging\nPremises\n\n4.1.2.6.\nDebone and Fillet Fish\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the\ncorresponding National Certificate for the Qualification.\n\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the relevant unit/s of competency.\n\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n--- PDF PAGE 144 ---\nFood Processing NC I Promulgated January 11, 2019 140\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 145 ---\nFood Processing NC I Promulgated January 11, 2019 141\n"
