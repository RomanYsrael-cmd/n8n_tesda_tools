        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared tools and processing/packaging area\n1.2 Prepared fish for deboning/filleting\n1.3 Deboned/filleted fish\n1.4 Stored tools and disposed waste\n1.5 Accomplished production data\n2. Methods of\nAssessment\nCompetency must be assessed through:\n2.1 Direct observation with oral questioning\n2.2 Demonstration with oral questioning\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Specific work area/station\n3.2 Equipment and tools relevant to cleaning and sanitizing\nequipment and processing/packaging area Materials\nrelevant to the proposed activity\n3.3 Relevant workplace procedures, schedules and records\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n4.2 Ability to apply competency over time and on a number of\noccasions.\n\n--- PDF PAGE 100 ---\nFood Processing NC I Promulgated January 11, 2019 96"
        },
        "source_text": "PFB751347\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to prepare tools, equipment, and processing/\npackaging area for operation, prepare fish, debone and\nfillet, clean and store equipment and tools, dispose\nwaste, accomplish report and transferring fish to the next\nproduction line.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare tools,\nequipment and\nprocessing and\npackaging area\n1.1 Tools and\nequipment are\ncleaned and set to\nmeet operating\nrequirements and\naccording to\nindustry\nguidelines.\n1.2 Tools, equipment\nand processing and\npackaging area are\nsanitized according\nto workplace\nprocedures and\nindustry\nguidelines.\n1.3 Tools and\nequipment\nperformance are\nchecked and\nadjusted as\nrequired and\nindustry\nguidelines.\n1.1 Use of equipment\nand tools\n1.2 Performance\nchecking of tools\nand equipment\n1.3 Performance\nadjustment of\ntools and\nequipment\n1.4 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.5 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n1.6 RA 9275 – Clean\nWater Act of 2004\n1.1 Equipment\noperation skills\n1.2 Cleaning tools\nand equipment\n1.3 Sanitizing tools,\nequipment and\nprocessing/pack\naging area\n1.4 Checking and\nadjusting tools\nand equipment\n2. Prepare fish for\ndeboning and\nfilleting\n2.1 Fish evisceration\ntechniques are\napplied in\naccordance to fish\ncuts and industry\nguidelines.\n2.2 Fishes are washed\naccording to\ncompany’s\nspecification, GMP\nrequirements, and\nindustry\nguidelines.\n2.3 Fishes are chilled\naccording to\ncompany’s\nspecification and\n2.1 Weighing and\ngrading of fishes\n2.2 Evisceration\ntechniques\n2.3 Washing of fishes\n2.4 Chilling\nrequirements\n2.5 Fish cuts\n2.6 7S of Good\nhousekeeping\n2.7 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n2.8 OSH Rule No.\n1150 – Materials\n2.1 Applying fish\nevisceration\ntechnique\n2.2 Washing fishes\n2.3 Chilling fishes\n2.4 Scaling fishes\n\n--- PDF PAGE 96 ---\nFood Processing NC I Promulgated January 11, 2019 92\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nindustry\nguidelines.\n2.4 Fishes are scaled\naccording to\ncompany\nspecifications and\nindustry\nguidelines.\nHandling &\nStorage\n2.9 RA 9003 –\nEcological Solid\nWaste\nManagement Act\nof 2000\n2.10 RA 9275 – Clean\nWater Act of 2004\n3. Debone and fillet\nfish\n3.1 Fishes are deboned\nin accordance to\ncompany’s\nspecification and\nindustry\nguidelines.\n3.2 Fishes are fillet in\naccordance to\ncompany’s\nspecification and\nindustry\nguidelines.\n3.3 Deboned/fillet\nfishes are washed\nand transferred to\nnext production line\naccording to\ncompany’s\nspecification, GMP\nand industry\nguidelines.\n3.4 Workplace is\nmaintained\naccording to\nhousekeeping\nstandards and\nindustry\nguidelines.\n3.1 Fish anatomy\n3.2 Techniques of\ndeboning\n3.3 Methods of\nscaling\n3.4 Techniques of\ndeskinning\n3.5 Types of Fillet\n3.6 7S of Good\nhousekeeping\n3.7 Packing\ndeboned/fillet\nfishes\n3.8 PPEs\n3.9 OSH Rule 1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n3.10 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n3.11 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n3.12 RA 9003 –\nEcological Solid\nWaste\nManagement Act\nof 2000\n3.13 RA 9275 – Clean\nWater Act of 2004\n3.1 Deboning fishes\n3.2 Filleting fishes\n3.3 Washing\ndeboned/fillet\nfishes\n3.4 Maintaining\nworkplace\n4. Conduct post\noperation\n4.1 Tools are cleaned\nand stored based\non workplace\nprocedures,\noperation manuals,\nand industry\nguidelines.\n\n4.1 Labelling\nrequirements for\nretail\n4.2 Production data of\ndeboned/fillet\nfishes\n\n4.1 Cleaning tools\n4.2 Disposing\nwastes\n4.3 Accomplishing\nproduction data\nchecklist\n\n--- PDF PAGE 97 ---\nFood Processing NC I Promulgated January 11, 2019 93\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.2 Wastes are\ndisposed according\nto industry\nguidelines.\n4.3 Production data\nchecklist is\naccomplished\naccording to\nenterprise protocol.\n4.3 Communication\nSkills (oral and\nwritten)\n4.4 OSH Rule 1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n4.5 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n4.6 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n4.7 RA 9003 –\nEcological Solid\nWaste\nManagement Act\nof 2000\n\n--- PDF PAGE 98 ---\nFood Processing NC I Promulgated January 11, 2019 94\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and equipment\nTools may include:\n1.1 Tools:\n1.1.1 Tweezor\n1.1.2 Knives\n1.1.3 Rubber hammer\n1.1.4 HDPE Chopping board\n1.1.5 Colander\n1.1.6 Basin\n1.1.7 Tray\n1.2 Equipment\n1.2.1 Digital weighing scale (25kg cap.)\n1.2.2 Vacuum sealer\n1.2.3 Freezer\n1.2.4 Plastic sealer\n2. Fishes\nFish includes:\n2.1 Dilis\n2.2 Danggit\n2.3 Bangus\n2.4 Tilapia\n2.5 Labahita\n2.6 Yellow fin\n2.7 Cream dory\n2.8 Tuna\n3. Fish cuts\nFish cuts includes:\n3.1 Whole fish\n3.2 Butterfly fillet\n3.3 Cross-section or steak\n4. Washing of fishes\nWashing of fishes done before and after evisceration\nincludes:\n4.1 Use of ice water\n4.2 Use of disinfectants\n4.3 Use of salt/sodium chloride water\n5. Fillet\nTypes of Fillet includes:\n5.1 Whole fish\n5.2 Butterfly fillet\n5.3 Cross-section\n6. Industry guidelines\nMay include:\n6.1 OSH Rule 1070 – Occupational Health &\nEnvironmental Control\n6.2 OSH Rule No. 1080 – Personal Protective\nEquipment & Devices\n6.3 OSH Rule No. 1150 – Materials Handling & Storage\n6.4 RA 9003-Ecological Solid Waste Management Act\nof 2000\n6.5 RA 9275 – Clean Water Act of 2004\n\n--- PDF PAGE 99 ---\nFood Processing NC I Promulgated January 11, 2019 95\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared tools and processing/packaging area\n1.2 Prepared fish for deboning/filleting\n1.3 Deboned/filleted fish\n1.4 Stored tools and disposed waste\n1.5 Accomplished production data\n2. Methods of\nAssessment\nCompetency must be assessed through:\n2.1 Direct observation with oral questioning\n2.2 Demonstration with oral questioning\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Specific work area/station\n3.2 Equipment and tools relevant to cleaning and sanitizing\nequipment and processing/packaging area Materials\nrelevant to the proposed activity\n3.3 Relevant workplace procedures, schedules and records\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n4.2 Ability to apply competency over time and on a number of\noccasions.\n\n--- PDF PAGE 100 ---\nFood Processing NC I Promulgated January 11, 2019 96"
