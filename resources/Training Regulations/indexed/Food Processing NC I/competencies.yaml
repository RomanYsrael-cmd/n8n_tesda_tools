        "source_text": "PFB751344\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the skills, knowledge and attitudes\nrequired to acquire and prepare packaging materials and\nsupplies for processing.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Acquire packaging\nmaterials and\nsupplies for\nprocessing\n1.1 Material requisition\nform is\naccomplished\nbased on\npackaging\nrequirements.\n1.2 Packaging\nmaterials and\nsupplies are\nselected according\nto production\nrequirements\nEcological Solid\nWaste\nManagement Act of\n2000.\n1.3 Packaging\nmaterials and\nsupplies are\nhandled according\nto GMP\nrequirement and\nOHS\nrequirements.\n1.4 Packaging\nmaterials are\nchecked and\nreceived according\nto requisition and\nindustry\nguidelines.\n1.5 Deviation from\nrequisitions is\nreported according\nto workplace\nprocedures.\n1.1 Principles and\nprocedures for\npreparing raw\nmaterials\n1.2 Proper handling\nof raw materials\n1.3 Identification and\nproper use of\ncleaning/washing\nequipment,\nimplements and\nutilities\n1.4 Proper cleaning\nand/or washing\nprocedure\n1.5 Awareness of\nCodes or\nRegulations such\nas HACCP and\nGMP\n1.6 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.7 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n1.8 Environment and\npollution\nconscious\n1.9 RA 9003-\nEcological Solid\nWaste\nManagement Act\nof 2000\n1.10 Attitude:\n1.10.1 Time\nconscious/\npunctual\n1.10.2 Cost\nconscious\n1.1 Accomplishing\nrequisition form\n1.2 Selecting\npackaging\nmaterials and\nsupplies\n1.3 Checking and\nreceiving\npackaging\nmaterials\n1.4 Handling\npackaging\nmaterials and\nsupplies\n1.5 Practicing\nworkplace and\nOSHS\nrequirements\n1.6 Working with\nothers and in\nteams\n1.7 Basic\nmathematical\nskills (weights\nand\nmeasurements,\nratios and\nproportions)\n1.8 Sanitary food\nhandling\npractices\n\n--- PDF PAGE 77 ---\nFood Processing NC I Promulgated January 11, 2019 73\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.10.3 Flexible /\nadaptable\n1.10.4 Honest\n1.10.5 Socially\nresponsible\n1.10.6 Depend-\nable\n1.10.7 Alert\n1.10.8 Systematic\nand\norganized\n1.10.9 Good team\nworker\n1.10.10 Good\nlistener and\nfast learner\n1.10.11 Creative\n2. Prepare packaging\nmaterials\n2.1 Packaging\nmaterials are\ncleaned according\nto required\nspecifications and\nindustry\nguidelines.\n2.2 Pre-coding of\npackaging materials\nis performed\nfollowing company\npractice.\n2.3 Generic packaging\nis marked\naccording to\nproduction\nschedule.\n2.4 PPEs are worn\nfollowing company\npractices.\n2.1 Food safety\nprinciples and\npractices\n2.2 Proper cleaning\nand/or washing\nprocedure\n2.3 Awareness of\nCodes or\nRegulations such\nas HACCP and\nGMP\n2.4 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n2.5 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n2.6 Environmental\nprotection and\nconcerns\n2.7 RA 9275– Clean\nWater Act of 2004\n2.8 RA 9003-\nEcological Solid\nWaste\nManagement Act\nof 2000\n2.9 Attitude\n2.9.1 Time\nconscious/\npunctual\n2.9.2 Cost\n2.1 Sanitary food\nhandling\npractices\n2.2 Cleaning\npackaging\nmaterials\n2.3 Conducting pre-\ncoding of\npackaging\nmaterials\n2.4 Marking generic\npackaging\n2.5 Wearing PPEs\n\n--- PDF PAGE 78 ---\nFood Processing NC I Promulgated January 11, 2019 74\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nconscious\n2.9.3\nEnvironment\nand\npollution\nconscious\n2.9.4 Flexible /\nadaptable\n2.9.5 Honest\n2.9.6 Socially\nresponsible\n2.9.7 Dependable\n2.9.8 Alert\n2.9.9 Systematic\nand\norganized\n2.9.10 Good team\nworker\n2.9.11 Good\nlistener and\nfast learner\n2.9.12 Creative\n3. Complete\npreparation of\npackaging\nmaterials\n3.1 Records are\ncompleted\naccording to\nworkplace\nrequirements.\n3.2 Workplace is\ncleaned and\nsanitized according\nto company\npractice and\nindustry\nguidelines.\n3.3 PPEs are\nmaintained\naccording to\ncompany policy.\n3.4 Waste\nmanagement is\npracticed according\nto industry\nguidelines.\n3.1 Recording and\nreporting\nprocedures\n3.2 Proper cleaning\nand/or washing\nprocedure\n3.3 Food safety\nprinciples and\npractices\n3.4 Proper waste\ndisposal\n3.5 Awareness of\nCodes or\nRegulations such\nas HACCP and\nGMP\n3.6 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n3.7 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n3.8 Environmental\nprotection and\nconcerns\n3.9 RA 9275– Clean\nWater Act of 2004\n3.1 Recording and\nreporting skills\ndeviation from\nrequisition\n3.2 Communication\nskills (oral and\nwritten)\n3.3 Sanitary food\nhandling\npractices\n\n--- PDF PAGE 79 ---\nFood Processing NC I Promulgated January 11, 2019 75\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.10 RA 9003-\nEcological Solid\nWaste\nManagement Act\nof 2000\n3.11 Attitude:\n3.11.1 Time\nconscious/\npunctual\n3.11.2 Cost\nconscious\n3.11.3 Environ-\nment and\npollution\nconscious\n3.11.4 Flexible /\nadaptable\n3.11.5 Honest\n3.11.6 Socially\nresponsible\n3.11.7 Depend-\nable\n3.11.8 Alert\n3.11.9 Systematic\nand\norganized\n3.11.10 Good\nteam worker\n3.11.11 Good\nlistener and\nfast learner\n3.11.12 Creative\n\n--- PDF PAGE 80 ---\nFood Processing NC I Promulgated January 11, 2019 76\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Packaging materials and\nsupplies\nPackaging materials and supplies may include:\n1.1 Containers / Bottles / Cans\n1.2 Caps\n1.3 Cap seals\n1.4 Labels\n1.5 Pouches\n1.6 Plastic bags\n1.7 Secondary packaging including:\n1.7.1 Cartons\n2. GMP requirements\nWorkplace requirements may include:\n2.1 Company policies and procedures\n2.2 Standard operating procedures\n2.3 Work instructions\n2.4 Production schedules\n2.5 Forms and Reports\n3. OHS requirements\nOccupational Health and Safety requirements may\ninclude:\n3.1 Health/medical certificate\n3.2 Personal hygiene and good grooming\n3.3 Plant sanitation and waste management\n3.4 Food Drugs Administration (FDA) requirements\n3.5 PPE requirements\n3.6 Apron/laboratory gown\n3.7 Mouth masks\n3.8 Gloves\n3.9 Rubber boots\n3.10 Head gears such as caps, hairnets, ear plugs\n3.11 Sweat bands\n4. Cleaning\nCleaning may include:\n4.1 Washing\n4.2 Brushing\n4.3 Separation of foreign material such as dirt, hair,\nmud, etc.\n4.4 Drying\n5. Records\nRecords may include:\n5.1 Materials used\n5.2 Date of preparation\n5.3 Location\n5.4 Batch number\n5.5 Weight/measure\n5.6 Name of person who prepared material\n6. Industry guidelines\nMay include:\n6.1 RA 9275– Clean Water Act of 2004\n6.2 RA 9003-Ecological Solid Waste Management Act\nof 2000\n6.3 OSH Rule No. 1080 – Personal Protective\nEquipment & Devices\n6.4 OSH Rule No. 1150 – Materials Handling & Storage\n\n--- PDF PAGE 81 ---\nFood Processing NC I Promulgated January 11, 2019 77\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Acquired packaging materials and supplies for processing\n1.2 Prepared packaging materials\n1.3 Followed work procedures\n1.4 Completed records and preparation of packaging\n2. Methods of\nAssessment\nCompetency must be assessed through:\n2.1 Direct observation with oral questioning\n2.2 Demonstration with oral questioning\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Specific work area/station\n3.2 Equipment and tools for sampling\n3.3 Materials relevant to the proposed activity\n3.4 Relevant workplace procedures, schedules and records\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n4.2 Ability to apply competency over time and on a number of\noccasions.\n\n--- PDF PAGE 82 ---\nFood Processing NC I Promulgated January 11, 2019 78\nUNIT OF COMPETENCY\n:\nOPERATE BASIC EQUIPMENT\n\nUNIT CODE\n:"
