        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Assembled, inspected, checked and sanitized appropriate\ntools and equipment/instruments\n1.2 Set-up, adjusted and readied tools and equipment and\ninstruments according to requirements\n1.3 Operated and monitored performance of equipment to\nensure specified output\n1.4 Performed post operation activities\n1.5 Performed minor trouble shooting on food processing\ntools, equipment and utensils\n2. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n2.1 Direct observation and questioning of a candidate\noperating food processing tools and\nequipment/instruments\n2.2 Submission of written report on the performance and\ncondition of equipment/machine, tools, instruments used.\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Work area/station\n3.2 Materials, tools and equipment relevant to the Unit of\nCompetency\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 57 ---\nFood Processing NC I Promulgated January 11, 2019 53\nUNIT OF COMPETENCY\n:\nIMPLEMENT GOOD MANUFACTURING PRACTICE\nAND PROCEDURES\n\nUNIT CODE\n:"
        },
        "source_text": "AGR741203\n\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required to operate\nfood processing tools, equipment and instruments in the\nworkplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform Pre-\nOperation\nActivities\n1.1 Appropriate tools\nand equipment/\nutensils are\nassembled\naccording to food\nprocessing\nmethod.\n1.2 Food processing\ntools and\nequipment /\nutensils are\ninspected and\nchecked according\nto manufacturer’s\nspecifications.\n1.3 Food processing\nequipment is set\nup, adjusted and\nreadied according\nto job requirements.\n1.1 Equipment, tools\nand instruments:\nParts and\nFunctions\n1.2 Written and oral\ncommunication\n1.3 Interpreting\nmanufacturer’s\nspecifications\n1.4 Following\nmanufacturer’s\nmanual\n1.1 Machine parts\ntear down and\nassembly\n1.2 Inspecting and\nchecking\ncondition of\nequipment/\nmachines\n1.3 Reporting\nequipment/\nmachine, tools,\ninstruments\nbreakdown and\nrecording same\nin standard\nforms\n1.4 Communication\nskills\n\n--- PDF PAGE 51 ---\nFood Processing NC I Promulgated January 11, 2019 47\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Operate Food\nprocessing\nequipment\n2.1 Food processing\nequipment is\nswitched on\naccording to\nmanufacturer’s\nspecifications.\n2.2 Performance of\nfood processing\nequipment is\nchecked to ensure\nconformity with\nspecified output.\n2.3 Operation of food\nprocessing\nequipment is\nmanaged to\nachieve planned\noutcomes.\n2.4 Minor trouble\nshooting on food\nprocessing tools,\nequipment and\nutensils is\nperformed when\nnecessary\n2.1 Following\nmanufacturer’s\nmanual\n2.2 Equipment/\nmachine wear\nand tear process\n2.1 Inspecting and\nchecking\ncondition of\nequipment/\nmachines\n2.2 Performing minor\ntroubleshooting\n\n--- PDF PAGE 52 ---\nFood Processing NC I Promulgated January 11, 2019 48\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Perform Post-\nOperation\nActivities\n3.1 Food processing\nequipment is\nswitched off and\nunplugged after\noperation in\naccordance with\nmanufacturer’s\nspecifications.\n3.2 Food processing\ntools, equipment\nand instruments are\ncleaned, sanitized\nand stowed as\nrequired according\nto manufacturer’s\nspecifications and\nworkplace policies\nand regulations.\n3.3 Minor preventive\nmaintenance on\nequipment is\nperformed in line\nwith organization’s\nmaintenance\nsystem.\n3.4 Main machine parts\nare inspected and\nchecked in line with\norganization’s\npolicy.\n3.5 Condition of\nmachine is\nmonitored to ensure\nserviceability in\naccordance with\nworkplace rules and\nregulations\n3.1 Sanitizing agents:\nUses and\nSpecification\n3.2 Proper cleaning\nand stowing of\ntools and\nequipment/\ninstruments\n3.3 Minor preventive\nmaintenance\n3.1 Sanitizing,\ncleaning and\nstowing\nmeasuring\ndevices and\ninstruments\n3.2 Performing minor\npreventive\nmaintenance\n3.3 Performing\nregular\nmaintenance\n\n--- PDF PAGE 53 ---\nFood Processing NC I Promulgated January 11, 2019 49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Food Processing\nMethods\nFood Processing Methods include:\n1.1 Salting\n1.2 Curing\n1.3 Smoking\n1.4 Fermentation\n1.5 Pickling\n1.6 Canning\n1.7 Bottling\n1.8 Sugar concentration\n1.9 Drying\n1.10 Dehydration\n2. Food Processing Tools,\nEquipment and Utensils\nTools, Equipment and Utensils may include but not\nlimited to:\n\n2.1 Tools\n2.1.1 Cutting implements such as:\n2.1.2 Knives\n2.1.3 Slicer\n2.1.4 Vegetable cutter\n2.1.5 Cutter\n2.1.6 Peeler\n2.1.7 Measuring spoons and cups\n2.1.8 steam jacketed kettle lifter\n2.1.9 Scalers\n2.1.10 Exhaust box\n2.1.11 wire basket\n2.1.12 Syringe and needle\n2.1.13 Blow torch\n2.1.14 Cooking tools like:\n2.1.15 Saucepans\n2.1.16 Non-stick pan\n2.1.17 Containers for Fermentation\n2.1.18 Large stoneware\n2.1.19 Crocks\n2.1.20 Food-grade plastic containers\n2.1.21 Large glass jars\n2.1.22 A heavy plate or glass lid that fits down\ninside the container\n2.1.23 Apparatus/Instruments\n2.1.23.1 Salinometer\n2.1.23.2 Polyscalers\n2.1.23.3 Weighing scales of varying\ncapacities & sensitivities\n2.1.23.4 Refractometer\n2.1.23.5 Jelly thermometer\n2.1.23.6 Politer\n2.1.23.7 Candy thermometer\n\n--- PDF PAGE 54 ---\nFood Processing NC I Promulgated January 11, 2019 50\nVARIABLE\nRANGE\n2.2 Equipment\n2.2.1 Cold storage equipment like:\n2.2.2 Refrigerators\n2.2.3 Freezer\n2.2.4 Chiller\n2.2.5 Smoke house\n2.2.6 Oven\n2.2.7 Food processor\n2.2.8 Pressure cooker\n2.2.9 Sealers (can & plastic)\n2.2.10 Plastic protect cap\n2.2.11 Jack lifts\n2.2.12 Sealer\n2.2.13 Wheelers\n2.2.14 Soaking vat\n2.2.15 Stove/burner\n2.2.16 Meat grinder/chopper\n2.2.17 Tumbler\n2.2.18 Meat slicer\n2.2.19 Octo clam\n2.2.20 Sausage stuffer\n2.2.21 Trolleys\n2.2.22 Vacuum packaging\n2.2.23 Machine\n2.2.24 Impulse sealer\n2.2.25 Machine sealer\n2.2.26 blanching machine\n2.2.27 Soaking container\n2.2.28 Fermentation vat\n2.2.29 Grinder\n2.2.30 sterilizer mixer\n2.2.31 Enamel kettle/vat\n\n2.3 Utensils\n2.3.1 Kitchen utensils like:\n2.3.2 Casserole\n2.3.3 Chopping boards\n2.3.4 Colanders\n2.3.5 Mixing bowls\n2.3.6 Food tongs\n2.3.7 Spoon ladder\n2.3.8 Wooden ladle\n2.3.9 Wooden spoon\n2.3.10 Bowls made from:\n2.3.10.1 Stoneware\n2.3.10.2 Glass\n2.3.10.3 Aluminum\n2.3.10.4 stainless steel\n2.3.10.5 unchipped enamelware\n2.3.10.6 Funnel\n2.3.10.7 Strainer\n2.3.10.8 Strainers\n2.3.10.9 Exhauster\n\n--- PDF PAGE 55 ---\nFood Processing NC I Promulgated January 11, 2019 51\nVARIABLE\nRANGE\n2.3.10.10 juice extractor\n2.3.10.11 steamer\n2.3.10.12 basting spoons paddle\n2.3.10.13 Sorting tray\n2.3.10.14 Smoking trays\n2.3.10.15 Utility trays\n2.3.10.16 Food tray\n3. Manufacturer’s\nSpecifications\nManufacturer’s specifications may include but not limited\nto:\n3.1 Handling requirements\n3.2 Operating requirements\n3.3 Discharge Label\n3.4 Reporting\n3.5 Testing\n3.6 Positioning\n3.7 Refilling\n4. Minor Preventive Machine\nMaintenance\nMinor Preventive Machine Maintenance may include but\nnot limited to checking of the following:\n4.1 Machine temperature\n4.2 Hydraulic fluid\n4.3 Wear and surface condition\n4.4 Crack\n4.5 Leak detection\n4.6 Vibration\n4.7 Corrosion/erosion\n4.8 Electric insulation\n5. Condition of Machine\nMay include:\n5.1 Serviceable\n5.2 Repairable\n5.3 Defective\n\n--- PDF PAGE 56 ---\nFood Processing NC I Promulgated January 11, 2019 52\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Assembled, inspected, checked and sanitized appropriate\ntools and equipment/instruments\n1.2 Set-up, adjusted and readied tools and equipment and\ninstruments according to requirements\n1.3 Operated and monitored performance of equipment to\nensure specified output\n1.4 Performed post operation activities\n1.5 Performed minor trouble shooting on food processing\ntools, equipment and utensils\n2. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n2.1 Direct observation and questioning of a candidate\noperating food processing tools and\nequipment/instruments\n2.2 Submission of written report on the performance and\ncondition of equipment/machine, tools, instruments used.\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Work area/station\n3.2 Materials, tools and equipment relevant to the Unit of\nCompetency\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 57 ---\nFood Processing NC I Promulgated January 11, 2019 53\nUNIT OF COMPETENCY\n:\nIMPLEMENT GOOD MANUFACTURING PRACTICE\nAND PROCEDURES\n\nUNIT CODE\n:"
