        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned, checked and sanitized personal protective\nequipment\n1.2 Practiced proper personal hygiene and good grooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the work\narea\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Work area/station\n2.2 First Aid kit\n2.3 PPE relevant to the activities\n2.4 Fire extinguisher\n2.5 Stretcher\n2.6 Materials, tools and equipment relevant to the unit of\ncompetency\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 A combination of direct observation and questioning of a\ncandidate processing foods\n4. Context of\nassessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 46 ---\nFood Processing NC I Promulgated January 11, 2019 42\nUNIT OF COMPETENCY\n:\nUSE STANDARD MEASURING DEVICES /\nINSTRUMENTS\n\nUNIT CODE\n:"
        },
        "source_text": "AGR741201\n\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required to apply food\nsafety and sanitation in the workplace\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Wear Personal\nProtective\nEquipment\n1.1 Personal protective\nequipment are\nchecked according\nto manufacturer’s\nspecifications.\n1.2 Personal protective\nequipment are worn\naccording to the job\nrequirement.\n1.1 Good Food\nManufacturing\nPractices\n1.2 Parts and\nfunctions of\npersonal\nprotective\nequipment\n1.3 First Aid Kit\n1.4 Sanitizing\nequipment\n1.1 Practicing GMP\n2. Observe Personal\nHygiene and Good\nGrooming\n2.1 Personal hygiene\nand good grooming\nis practiced in line\nwith workplace\nhealth and safety\nrequirements.\n2.1 Good grooming\nand personal\nhygiene\n2.1 Good grooming\nand personal\nhygiene\npractices\n3. Implement Food\nSanitation\nPractices\n3.1 Sanitary food\nhandling practices\nare implemented in\nline with workplace\nsanitation\nregulations.\n3.2 Safety measures\nare observed in line\nwith workplace\nsafety practices.\n3.1 Proper waste\ndisposal\n3.2 Environmental\nprotection and\nconcerns\n3.3 Food safety\nprinciples and\npractices\n3.4 TQM and other\nfood quality\nsystem principles\n3.1 Practicing Food\nsafety\n4. Render Safety\nMeasures and\nFirst Aid\nProcedures\n4.1 Safety measures\nare applied\naccording to\nworkplace rules and\nregulations.\n4.2 First aid\nprocedures are\napplied and\ncoordinated with\nconcerned\npersonnel\naccording to\nworkplace standard\noperating\nprocedures.\n4.1 Parts and\nfunctions of\npersonal\nprotective\nequipment\n4.2 First Aid Kit\n4.1 Practicing PPE\n4.2 Applying first aid\ntreatment\n\n--- PDF PAGE 43 ---\nFood Processing NC I Promulgated January 11, 2019 39\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Implement\nhousekeeping\nactivities\n5.1 Work area and\nsurroundings are\ncleaned in\naccordance with\nworkplace health\nand safety\nregulations.\n5.2 Waste is disposed\naccording to\norganization’s\nwaste disposal\nsystem.\n5.3 Hazards in the\nwork area are\nrecognized and\nreported to\ndesignated\npersonnel\naccording to\nworkplace\nprocedures.\n5.1 Housekeeping /\n5’s\n5.2 Proper waste\ndisposal\n5.1 Implementing\nhousekeeping\nactivities\n5.2 Practicing proper\nwaste disposal\n5.3 Coordination\nskills\n\n--- PDF PAGE 44 ---\nFood Processing NC I Promulgated January 11, 2019 40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manufacturer’s\nSpecifications\nManufacturer’s specifications may include but not limited\nto:\n1.1 Handling\n1.2 Operating\n1.3 Discharge Label\n1.4 Reporting\n1.5 Testing\n1.6 Positioning\n1.7 Refilling\n2. Personal Protective\nEquipment\nPersonal Protective Equipment may include but not\nlimited to:\n2.1 Apron/laboratory gown\n2.2 Mouth masks\n2.3 Gloves\n2.4 Rubber boots/safety shoes\n2.5 Head gears such as caps, hair nets, earl plug\n3. Workplace Health and\nSafety Requirements\nWorkplace and Safety Requirements may include:\n3.1 Health/Medical Certificate\n3.2 DOLE requirements\n3.3 BFAD requirements\n3.4 Personal Hygiene and good grooming\n3.5 Plant Sanitation and waste management\n4. Safety Measures\nSafety measures may include but not limited to:\n4.1 Labeling of chemicals and other sanitizing agents\n4.2 Installation of fire fighting equipment in the work\narea\n4.3 Installation of safety signages and symbols\n4.4 Implementation of 5S in the work area\n4.5 Removal of combustible material in the work area\n5. First Aid Procedures\nFirst Aid Procedures may include but not limited to:\n5.1 Mouth to mouth resuscitation\n5.2 CPR\n5.3 Application of tourniquet\n5.4 Applying pressure to bleeding wounds or cuts\n5.5 First aid treatment for burned victims\n6. Hazards\nHazards in the workplace may include but not limited to:\n6.1 Physical\n6.2 Biological\n6.3 Chemical\n\n--- PDF PAGE 45 ---\nFood Processing NC I Promulgated January 11, 2019 41\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned, checked and sanitized personal protective\nequipment\n1.2 Practiced proper personal hygiene and good grooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the work\narea\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Work area/station\n2.2 First Aid kit\n2.3 PPE relevant to the activities\n2.4 Fire extinguisher\n2.5 Stretcher\n2.6 Materials, tools and equipment relevant to the unit of\ncompetency\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 A combination of direct observation and questioning of a\ncandidate processing foods\n4. Context of\nassessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 46 ---\nFood Processing NC I Promulgated January 11, 2019 42\nUNIT OF COMPETENCY\n:\nUSE STANDARD MEASURING DEVICES /\nINSTRUMENTS\n\nUNIT CODE\n:"
