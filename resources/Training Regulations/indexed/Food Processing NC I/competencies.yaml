\nand equipment\n1.3 Sanitizing tools,\nequipment and\nprocessing/pack\naging area\n1.4 Checking and\nadjusting tools\nand equipment\n2. Prepare fish for\ndeboning and\nfilleting\n2.1 Fish evisceration\ntechniques are\napplied in\naccordance to fish\ncuts and industry\nguidelines.\n2.2 Fishes are washed\naccording to\ncompany’s\nspecification, GMP\nrequirements, and\nindustry\nguidelines.\n2.3 Fishes are chilled\naccording to\ncompany’s\nspecification and\n2.1 Weighing and\ngrading of fishes\n2.2 Evisceration\ntechniques\n2.3 Washing of fishes\n2.4 Chilling\nrequirements\n2.5 Fish cuts\n2.6 7S of Good\nhousekeeping\n2.7 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n2.8 OSH Rule No.\n1150 – Materials\n2.1 Applying fish\nevisceration\ntechnique\n2.2 Washing fishes\n2.3 Chilling fishes\n2.4 Scaling fishes\n\n--- PDF PAGE 96 ---\nFood Processing NC I Promulgated January 11, 2019 92\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nindustry\nguidelines.\n2.4 Fishes are scaled\naccording to\ncompany\nspecifications and\nindustry\nguidelines.\nHandling &\nStorage\n2.9 RA 9003 –\nEcological Solid\nWaste\nManagement Act\nof 2000\n2.10 RA 9275 – Clean\nWater Act of 2004\n3. Debone and fillet\nfish\n3.1 Fishes are deboned\nin accordance to\ncompany’s\nspecification and\nindustry\nguidelines.\n3.2 Fishes are fillet in\naccordance to\ncompany’s\nspecification and\nindustry\nguidelines.\n3.3 Deboned/fillet\nfishes are washed\nand transferred to\nnext production line\naccording to\ncompany’s\nspecification, GMP\nand industry\nguidelines.\n3.4 Workplace is\nmaintained\naccording to\nhousekeeping\nstandards and\nindustry\nguidelines.\n3.1 Fish anatomy\n3.2 Techniques of\ndeboning\n3.3 Methods of\nscaling\n3.4 Techniques of\ndeskinning\n3.5 Types of Fillet\n3.6 7S of Good\nhousekeeping\n3.7 Packing\ndeboned/fillet\nfishes\n3.8 PPEs\n3.9 OSH Rule 1070 –\nOccupational\nHealth &\nEnviro