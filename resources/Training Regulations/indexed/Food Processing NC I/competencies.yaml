        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified the problem.\n1.2 Determined the fundamental causes of the problem.\n1.3 Determined the correct / preventive action.\n1.4 Developed action plans in managing routine problems.\n\nThese aspects may be best assessed using project-based\nlearning mode of assessment and case formulation.\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Developed SMART personal and career goals\n1.2 Applied goal setting principles\n1.3 Identified sensitively the positive and negative emotions in\nthe workplace\n1.4 Responded with appropriate emotions in the workplace\n1.5 Identified possible consequences of inappropriate\nemotional responses in a social and work-related context\n1.6 Applied learning styles to positively influence school/work\nperformance\n1.7 Developed reflective practice through realization of\nlimitations, likes/ dislikes; through showing of self-\nconfidence\n2. Resource\nImplications\nThe following resources for should be provided:\n2.1 Access to workplace and resources\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration or simulation with oral questioning (ex. how\nto recognize emotions)\n3.2 Case problems involving workplace diversity issues\n3.3 Third-party report\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 22 ---\nFood Processing NC I Promulgated January 11, 2019 18\nUNIT OF COMPETENCY\n:\nSUPPORT INNOVATION\n\nUNIT CODE\n:"
