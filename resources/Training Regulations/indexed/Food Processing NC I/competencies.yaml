ent and utensils\n2. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n2.1 Direct observation and questioning of a candidate\noperating food processing tools and\nequipment/instruments\n2.2 Submission of written report on the performance and\ncondition of equipment/machine, tools, instruments used.\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Work area/station\n3.2 Materials, tools and equipment relevant to the Unit of\nCompetency\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 57 ---\nFood Processing NC I Promulgated January 11, 2019 53\nUNIT OF COMPETENCY\n:\nIMPLEMENT GOOD MANUFACTURING PRACTICE\nAND PROCEDURES\n\nUNIT CODE\n:\nAGR741205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to comply with relevant Good Manufacturing\nPractice (GMP) codes through the implementation of\nworkplace GMP and quality procedures\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nrequirements of\nGMP related to\nown work\n1.1 Sources of\ninformation on GMP\nrequirements are\nlocated.\n1.2 GMP requirements\nand responsibilities\nrelated to own work\nare identified.\n1.1 GMP\nRequirements\n1.2 GMP Codes of\npractice, policies\nand procedures\n1.3 GMP Role of\ninternal and\nexternal auditors\n1.4 Contamination\nevents and\nperformance\nimprovement\nprocesses\nprocedures\n1.5 Personal clothing\nand footwear\nrequirements at\nwork areas\n1.6 Use of personal\nclothing, storage\nand disposal\nrequirements\n1.7 Micro biological,\nphysical and\nchemical\ncontaminants\n1.8 Basic concepts of\nquality assurance\n1.9 Control methods\nand procedures\nused in GMP:\n1.20 GMP\nresponsibilities\nand requirements\nrelating to work\nrole\n1.21 Basic properties,\nhandling and\nstorage\nrequirements of\nraw materials,\npackaging\n1.1 Planning and\norganizing work\n(time\nmanagement)\n1.2 Working with\nothers and in\nteams\n1.3 Practicing GMP\n1.4 Following\ncontamination\ninvestigation\nprocedures\n\n--- PDF PAGE 58 ---\nFood Processing NC I Promulgated January 11, 2019 54\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncomponents and\nfinal product\n1.22 Standards for\nmaterials,\nequipment and\nutensils used in\nthe work area\n1.23 Recall and\ntraceability\nprocedures\nrelevant to work\nrole\n1.24 Procedures for\nidentifying or\nisolating materials\nor product of\nunacceptable\nquality\n1.25 Record keeping\nand the recording\nrequirements of\nGMP\n2. Observe personal\nhygiene and\nconduct to meet\nGMP requirements\n2.1 Personal hygiene\nmeets GMP\nrequirements.\n2.2 Clothing is\nprepared, used,\nstored and\ndisposed of\naccording to GMP\nand workplace\nprocedures.\n2.3 Personal movement\naround the\nworkplace complies\nwith area entry and\nexit procedures.\n2.1 Personal hygiene\n2.2 PPE\n2.1 Practicing GMP\n\n--- PDF PAGE 59 ---\nFood Processing NC I Promulgated January 11, 2019 55\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Implement GMP\nrequirements\nwhen carrying out\nwork activities\n3.1 GMP requirements\nare identified.\n3.2 Work area,\nmaterials,\nequipment and\nproduct are\nroutinely monitored\nto ensure\ncompliance with\nGMP requirements.\n3.3 Raw materials,\npackaging\ncomponents and\nproduct are handled\naccording to GMP\nand workplace\nprocedures.\n3.4 Workplace\nprocedures to\ncontrol resource\nallocation and\nprocess are\nfollowed to meet\nGMP requirements.\n3.5 Common forms of\ncontamination are\nidentified and\nappropriate control\nmeasures are\nfollowed according\nto GMP\nrequirements.\n3.6 The workplace is\nmaintained in a\nclean and tidy order\nto meet GMP\nhousekeeping\nstandard.\n3.1 Good\nManufacturing\nPractices 