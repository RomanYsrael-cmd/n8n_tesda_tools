3 Search engines\nfor information\n2.1 Finding and\nselecting search\nengine to find\nand select\nappropriate\ninformation\n2.2 Using suitable\ntechniques to\nfind useful\ninformation\neasier\n2.3 Using records\n2.4 Carrying out\nSearches\n\n--- PDF PAGE 25 ---\nFood Processing NC I Promulgated January 11, 2019 21\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.6 Searches are carry\nout as per\nrequirements.\n3. Examine\ninformation\n3.1 Information and its\nsources are\nevaluated for\nrelevance and\nvalidity to business\nand/or client\nrequirements.\n3.2 Information is\nexamined as\nrequired to identify\nkey issues.\n3.3 Detailed evaluation\nof information is\ncarried out as\nrequired using\nrelevant techniques\nincluding\nmathematical\ncalculations.\n3.1 Data evaluation\nprocedures\n3.2 Cultural aspects\nof information and\nmeaning\n3.3 Sources of public\nsector work-\nrelated\ninformation\n3.4 Public sector\nstandards\n3.1 Evaluating data\n3.2 Practicing\ncultural aspects\nof information\nand meaning\n3.3 Using public\nsector standards\n4. Secure information\n4.1 Basic file-handling\ntechniques are\nused for the\nsoftware\n4.2 Techniques is used\nto handle, organize\nand secure\ninformation\n4.1 Policies,\nprocedures and\nguidelines relating\nto information\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n4.2 Basic file-handling\ntechniques\n4.3 Techniques in\nhandling,\norganizing and\nsaving files\n4.4 Electronic and\nmanual filing\nsystems\n4.1 Handling\npolicies,\nprocedures and\nguidelines\nrelating to\ninformation\nhandling in the\npublic sector,\nincluding\nconfidentiality,\nprivacy, security,\nfreedom of\ninformation\n4.2 Using basic file-\nhandling\ntechniques is\nused for the\nsoftware\n4.3 Using different\ntechniques in\nhandling,\norganizing and\nsaving files\n4.4 Using electronic\nand manual filing\nsystems