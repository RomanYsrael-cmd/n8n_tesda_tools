        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned/sanitized processing/packaging premises\n1.2 Cleaned/sanitized equipment\n1.3 Cleaned, sanitized, maintained and stored equipment\n1.4 Stored cleaning equipment and chemicals\n1.5 Followed recording and reporting guidelines\n1.6 Followed work procedures\n2. Methods of\nAssessment\nCompetency must be assessed through:\n2.1 Direct observation with oral questioning\n2.2 Demonstration with oral questioning\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Specific work area/station\n3.2 Equipment and tools relevant to cleaning and sanitizing\nequipment and processing/packaging area Materials\nrelevant to the proposed activity\n3.3 Relevant workplace procedures, schedules and records\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n4.2 Ability to apply competency over time and on a number of\noccasions.\n\n--- PDF PAGE 95 ---\nFood Processing NC I Promulgated January 11, 2019 91\nUNIT OF COMPETENCY\n:\nDEBONE AND FILLET FISH\n\nUNIT CODE\n:"
        },
        "source_text": "PFB751346\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to clean and sanitize processing/ packaging\npremises and equipment. This does not include cleaning-\nin-place (CIP). It involves preparation of sanitizing\nsolutions, disinfecting and disinfestation of equipment\nand processing/packaging premises, storing of\nequipment and chemicals, completing records, and\ndisposing waste properly.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Clean and sanitize\nprocessing/\npackaging\npremises\n1.1 Cleaning/\nsanitizing supplies\nand materials, and\nutilities are\nprepared according\nto cleaning and\nsanitizing\nrequirements and\nindustry\nguidelines.\n1.2 Sanitizing solution is\nprepared according\nto workplace\nrequirements and\napplication, and\nindustry\nguidelines.\n1.3 Processing/\npackaging premises\nare cleared in\npreparation for\ncleaning according\nto workplace\nrequirements and\nindustry\nguidelines.\n1.4 Processing/\npackaging premises\nare cleaned and\nsanitized according\nto workplace\nprocedures and\nindustry\nguidelines.\n1.5 Checklists are filled-\nup according to\nworkplace\nprocedures.\n1.1 Cleaning supplies\nand materials\n1.2 Methods of\npreparing sanitizing\nsolutions\n1.3 Procedures in\ncleaning and\nsanitizing\npackaging and\nprocessing areas\n1.4 Cleaning and\nmaintenance\nchecklist\n1.6 Communication\nskills (oral and\nwritten)\n1.7 OSH Rule No. 1080\n– Personal\nProtective\nEquipment &\nDevices\n1.8 OSH Rule No. 1090\n– Hazardous\nMaterials\n1.9 OSH Rule No. 1150\n– Materials\nHandling & Storage\n1.10 RA 6969-Toxic\nSubstances and\nHazardous and\nNuclear Wastes\nControl Act of 1990\n1.11 RA 9003-\nEcological Solid\nWaste\nManagement Act of\n2000\n1.1 Prepare cleaning\nsupplies and\nmaterials\n1.2 Prepare\nsanitizing\nsolutions\n1.3 Clean and\nsanitize\npackaging and\nprocessing areas\n1.4 Fill-up\nmaintenance\nchecklist\n\n--- PDF PAGE 90 ---\nFood Processing NC I Promulgated January 11, 2019 86\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Clean and sanitize\nequipment\n2.1 Cleaning/\nsanitizing supplies\nand materials, and\nutilities are\nprepared according\nto manufacturer’s\nspecifications and\nindustry\nguidelines.\n2.2 Mix sanitizing\nsolutions according\nto manufacturer’s\nspecifications and\nindustry\nguidelines.\n2.3 Equipment are\ncleaned and\nsanitized according\nto manufacturer’s\nspecifications and\nindustry\nguidelines.\n2.1 Methods of\npreparing sanitizing\nsolutions\n2.2 Procedures in\ndisassembling,\ncleaning, sanitize\nand assembling\nequipment\n2.3 Procedure in\nchecking the\nworking condition of\nequipment\n2.4 OSHS\n2.5 AO 153\n2.5.1 GMP and\nSSOP\n2.6 OSH Rule No. 1080\n– Personal\nProtective\nEquipment &\nDevices\n2.7 OSH Rule No. 1090\n– Hazardous\nMaterials\n2.8 OSH Rule No. 1150\n– Materials\nHandling & Storage\n2.9 RA 9003-Ecological\nSolid Waste\nManagement Act of\n2000\n2.10 RA 9275 – Clean\nWater Act of 2004\n2.1 Prepare\nsanitizing\nsolutions\n2.2 Disassemble,\nclean, sanitize\nand assemble\nequipment\n2.3 Fill-up\nmaintenance\nchecklist\n3. Perform shut down\nactivities\n3.1 Cleaning equipment\nand chemicals are\nstored according to\nworkplace\nprocedure.\n3.2 Waste from cleaning\nprocess is disposed\nof according to\nworkplace and OHS\nrequirements, and\nindustry\nguidelines.\n3.3 Equipment and\nprocessing/\npackaging area are\nrestored to operating\norder according to\n\n3.1 Shut down\nprocedures\n3.2 Storing\n3.3 7S of Good\nHousekeeping\n3.4 OSH Rule No. 1080\n– Personal\nProtective\nEquipment &\nDevices\n3.5 OSH Rule No. 1090\n– Hazardous\nMaterials\n3.6 OSH Rule No. 1150\n– Materials\nHandling & Storage\n\n3.1 Storing cleaning\nequipment and\nchemicals\n3.2 Disposing waste\nfrom cleaning\n3.3 Restoring\nequipment and\nprocessing/pack\naging area\n3.4 Conducting\nrecord keeping\n\n--- PDF PAGE 91 ---\nFood Processing NC I Promulgated January 11, 2019 87\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n workplace\nprocedures and\nindustry\nguidelines.\n3.4 Records are\ncompleted in line\nwith workplace\nrequirements.\n3.7 RA 6969-Toxic\nSubstances and\nHazardous and\nNuclear Wastes\nControl Act of 1990\n3.8 RA 9003-Ecological\nSolid Waste\nManagement Act of\n2000\n3.9 RA 9275 – Clean\nWater Act of 2004\n\n--- PDF PAGE 92 ---\nFood Processing NC I Promulgated January 11, 2019 88\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning/sanitation\nsupplies and materials\nCleaning/sanitation supplies and materials may include:\n1.1 Chemicals (cleaners, sanitizers, etc.)\n1.2 Cleaning and scouring pads\n1.3 Washcloth\n1.4 Brush (floor brush)\n1.5 Pail\n1.6 Basin\n1.7 Dipper\n1.8 Hose\n1.9 Mop\n1.10 Mop wringer\n1.11 Squeegee\n1.12 pressure washer\n1.13 vacuum cleaner\n1.14 Garbage bin / Trash bag\n1.15 Towel dispenser\n1.16 Chlorine paper (for testing effectiveness of\nsanitation)\n1.17 ATP (adenosine triphosphate) quick test\n2. Utilities\nUtilities may include:\n2.1 Power\n2.2 Water\n2.3 Steam\n2.4 Compressed air\n2.5 Instrumentation air\n3. Cleaning and sanitation\nCleaning and sanitation may include but not limited to:\n3.1 Processing/packaging premises\n3.1.1 Cleaning\n3.1.1.1 Soil:\n• Organic – produced by cooking\nequipment and deposited on\nceilings, walls, exhaust hood,\nfood production equipment,\nutensils and tableware\n• Inorganic – airborne (free\nfloating) or bonded dust which\nadheres to surfaces\n3.1.1.2 Pest\n• Sanitation\n3.1.1.3 Destruction of pathogens that\nsurvive in the cleaning process\n\n3.2 Equipment\n3.2.1 Cleaning\n3.2.1.1 Organic\n• Fats/ Lard\n• Sawdust\n3.2.1.2 Inorganic\n• Dust\n• Mineral oil\n\n--- PDF PAGE 93 ---\nFood Processing NC I Promulgated January 11, 2019 89\nVARIABLE\nRANGE\