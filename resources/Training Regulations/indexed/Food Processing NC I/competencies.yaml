        "source_text": "PFB751342\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to conduct preparatory activities, check raw\nmaterials, in-process products and finished products, and\nconduct post operation activities. It includes sampling\nrequirements, sample preparation and information,\npreparing, sanitizing and storing of tools and equipment,\nrecording, and waste disposal.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Conduct\npreparatory\nactivities\n1.1 Sampling\nrequirements are\nfollowed in\naccordance with the\nsampling plan.\n1.2 Tools and\nequipment are\nprepared according\nto industry\nguidelines.\n1.3 Tools and\nequipment are\ncalibrated\naccording to\nindustry\nguidelines.\n1.4 Defective tools and\nequipment are\nreported to\nimmediate\nsupervisor\naccording to\nworkplace\nprocedures.\n1.5 Preparation area is\ncleaned and\nmaintained\naccording to\nindustry\nguidelines.\n1.1 Sampling\nrequirements,\nmethods and\nrecording\n1.2 Good Laboratory\nPractices\n1.3 Uses, function\nand operation of\ntools and\nequipment\n1.4 Preparation of\ndifferent tools and\nmaterials\n1.5 Calibration of\ntools and\nequipment\n1.6 Defective tools\nand equipment\n1.7 AO 153 (cGMP)\n1.8 Halal Principles\n1.9 Food Safety Act\nof 2013\n1.10 Accomplishment\nof checklist report\n1.11 Interpretation and\nfollowing\ninstructions\n1.12 OSH Rule No.\n1060 – Premises\nof Establishments\n1.13 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.14 OSH Rule No.\n1150 – Materials\nHandling &\n1.1 Following\nsampling\nrequirements\n1.2 Recording and\nreporting skills\n1.3 Calibration skills\n1.4 Identifying\ndefective tools\nand equipment\n1.5 Cleaning and\nsanitizing skills\n\n--- PDF PAGE 64 ---\nFood Processing NC I Promulgated January 11, 2019 60\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nStorage\n1.15 RA 9275 – Clean\nWater Act of 2004\n2. Check raw\nmaterials, in-\nprocess products\nand finished\nproducts\n2.1 Raw materials,\npackaging materials\nand delivery land\nvehicle are checked\naccording to\nindustry\nguidelines.\n2.2 Samples are\nprepared according\nto sampling\nprocedures and\nsampling plan.\n2.3 Sample\ninformation is\nrecorded according\nto industry\nguidelines.\n2.4 Quality control\nchecklist is\naccomplished\nbased on workplace\nprocedure.\n2.5 Raw Materials, In-\nprocess products\nand Finished\nProducts are\nchecked according\nto industry\nguidelines and free\nfrom defects.\n2.6 Acceptable raw\nmaterials and\nproducts are\nweighed and kept in\naccordance with\nindustry\nguidelines.\n2.1 Raw materials\nand product\n2.1.1 Receiving\nand\nhandling\n2.1.2 Disposal of\ndefective\nraw\nmaterials\nand product\n2.1.3 Product\ncharacteris-\ntics\n2.2 Sampling\nprocedures\n2.3 Sampling plan\n2.4 Sampling\ninformation\n2.5 Preparing and\nhandling of\nsamples\n2.6 Accomplishment\nof checklist\n2.7 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n2.8 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n2.9 RA 9003 –\nEcological Solid\nWaste\nManagement Act\nof 2000\n2.1 Sampling\ncollection skills\n2.2 Preparing and\nhandling skills\n2.3 Cleaning skills\n2.4 Receiving and\nhandling skills\n2.5 Skills in\ndetermining\nacceptable and\ndefective\nproducts\n3. Conduct post\noperation activities\n3.1 Equipment and\ntools are cleaned\nand kept according\nto industry\nguidelines.\n3.2 Records are\ncompleted and\nreported according\nto workplace\nprocedures.\n\n3.1 Different wastes\n3.2 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n3.3 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n\n3.1 Recording and\nreporting skills\n3.2 Waste\nsegregation and\ndisposal skills\n3.3 Cleaning and\nstoring skills\n3.4 Communication\nskills\n\n--- PDF PAGE 65 ---\nFood Processing NC I Promulgated January 11, 2019 61\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Off-specs raw\nmaterials and\nproducts are\nreported to\nimmediate\nsupervisor\naccording to\norganizational\nguidelines.\n3.4 Wastes are\ndisposed according\nto waste\nmanagement\npractices.\n3.4 RA 9003-\nEcological Solid\nWaste\nManagement Act\nof 2000\n\n--- PDF PAGE 66 ---\nFood Processing NC I Promulgated January 11, 2019 62\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sampling requirements\nSampling requirements includes:\n1.1 Under controlled conditions\n1.1.1 Time\n1.1.2 Temperature\n1.1.3 Light\n1.1.4 Humidity\n1.1.5 Sanitary conditions\n1.1.6 Weight\n1.1.7 Quantity\n2. Tools and equipment\nTools and equipment may include:\n2.1 Tools:\n2.1.1 Weighing scale\n2.1.2 Knives\n2.1.3 Bucket\n2.1.4 Chopping board\n2.1.5 Sampling borer (buriki)\n2.1.6 Forceps\n2.1.7 Thermometer\n2.1.8 Beaker\n2.1.9 Sieve or strainer\n2.1.10 Graduated cylinder\n2.1.11 Sets of standard weights\n2.1.12 Refractometer (with work instructions)\n2.1.13 pH meter (with work instructions)\n2.1.14 Containers\n2.1.14.1 Trays\n2.1.14.2 Canister\n2.2 Equipment:\n2.2.1 Stainless steel tables / Receiving table\n2.2.2 Belt conveyor and roller sorter\n3. Preparation of tools and\nequipment\nPreparation of tools, materials and equipment includes:\n3.1 Checking\n3.2 Cleaning\n3.3 Sanitizing\n3.4 Calibrating\n4. Samples\nSamples may include:\n4.1 Raw materials\n4.1.1 Condition and Certificate of Analysis (COA)\nof raw materials\n4.2 Goods Produce in process\n4.3 Finished products\n4.4 Packaging materials and supplies\n4.5 Packaged products\n5. Sample information\nSample information may include:\n5.1 Date of sampling\n5.2 Location of sampling\n5.3 Origin (source) of sample\n5.4 Amount of sample / sample size\n5.5 Quality attributes\n\n--- PDF PAGE 67 ---\nFood Processing NC I Promulgated January 11, 2019 63\nVARIABLE\nRANGE\n5.6 Other physical properties (e.g. moisture, size,\nweight) characteristics of sample\n6. Preparation of samples\nPreparation of samples includes:\n6.1 Collection\n6.2 Weighing\n6.3 Packaging\n6.4 Labeling\n6.5 Storing\n6.6 Handling\n7. Raw materials, in-process\nproducts and finished\nproducts\nRaw materials and products may include:\n7.1 Raw materials\n7.1.1 Livestock meat\n7.1.2 Poultry\n7.1.3 Fish and other marine\n7.1.4 Cereals and starches\n7.1.5 Fruits and vegetables\n7.1.6 Root crops\n7.1.7 Nuts\n7.1.8 Seeds\n7.1.9 Fats and oils\n7.1.10 Processing supplies\n7.1.11 Salt\n7.1.12 Sugar and sweeteners\n7.1.13 Condiments\n7.1.14 Spices\n7.1.15 Herbs\n7.1.16 Food additives\n7.2 In-process products (based from the process flow of\neach target product)\n7.2.1 Finished Products\n7.2.2 Livestock products\n7.2.3 Poultry products\n7.2.4 Fish and other marine products\n7.2.5 Cereals and starches products\n7.2.6 Fruits and vegetables products\n7.2.7 Root crops products\n7.2.8 Nuts products\n7.2.9 Seeds products\n7.2.10 Fats and oils products\n8. Defects\nDefects may include:\n8.1 For raw materials:\n8.1.1 Blemishes\n8.1.2 Irregular size and shape\n8.1.3 Off color\n8.1.4 Off-odor\n8.1.5 Stale\n8.1.6 Insect/ disease damage\n8.1.7 Presence of insects and other contaminants,\nmolds, etc.\n8.1.8 Discoloration\n8.1.9 Spoilage\n\n--- PDF PAGE 68 ---\nFood Processing NC I Promulgated January 11, 2019 64\nVARIABLE\nRANGE\n8.2 For in-processed/finished products:\n8.2.1 Damaged packaging\n8.2.2 Packaging materials(off-color, deformed,\ncracked)\n8.2.3 Contaminated contents\n8.2.4 Off-odor thawed (for frozen foods)\n8.2.5 Physical and chemical attributes\n9. Wastes\nWastes includes:\n9.1 Defective raw materials and products\n9.2 Refused raw materials and products\n9.3 Used containers\n9.4 Defective packaging materials\n10. Records\nRecords may include:\n10.1 Items inspected / sorted\n10.2 Inspector’s (Supervisor) name\n10.3 Date and place of inspection\n10.4 Spoilage and rejects\n10.5 Yields and recoveries\n10.6 Supplier details\n10.7 Monitoring checklist\n11. Reports\nReports includes:\n11.1 Oral\n11.2 Written\n12. Industry guidelines\nIndustry guidelines may include:\n12.1 Manufacturer’s requirements\n12.2 Workplace requirements/procedures\n12.3 Company standards\n12.4 Standard operating procedures\n12.5 Industry standards\n12.6 Organizational guidelines\n12.7 OSH Rule No. 1060 – Premises of Establishments\n12.8 OSH Rule No. 1080 – Personal Protective\nEquipment & Devices\n12.9 OSH Rule No. 1150 – Materials Handling & Storage\n12.10 RA 9003 – Ecological Solid Waste Management\nAct of 2000\n12.11 RA 9275 – Clean Water Act of 2004\n\n--- PDF PAGE 69 ---\nFood Processing NC I Promulgated January 11, 2019 65\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, checked and calibrated appropriate tools and\nequipment\n1.2 Identified sampling requirements\n1.3 Collected, handled and prepared samples\n1.4 Recorded sample information\n1.5 Followed work procedures\n2. Methods of\nAssessment\nCompetency must be assessed through:\n2.1 Direct observation with oral questioning\n2.2 Demonstration with oral questioning\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Specific work area/station\n3.2 Equipment and tools for sampling\n3.3 Materials relevant to the proposed activity\n3.4 Relevant workplace procedures, schedules and records\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n4.2 Ability to apply competency over time and on a number of\noccasions.\n\n--- PDF PAGE 70 ---\nFood Processing NC I Promulgated January 11, 2019 66\nUNIT OF COMPETENCY\n:\n DISPENSE MATERIALS\n\nUNIT CODE\n:"
