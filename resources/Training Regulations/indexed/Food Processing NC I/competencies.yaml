        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Recognize related occupational safety and health risks\nand hazards based on OSH work standards\n1.2 Identify incident/emergency procedures relevant to\nworkplace based on relevant OSH work standards\n1.3 Follow the OSH work instructions in accordance with\nworkplace policies and procedures\n1.4 Utilize personal protective equipment, materials, tools,\nmachinery, and equipment according to OSH work\nstandards\n1.5 Obey OSH requirements in accordance with workplace\npolicies and procedures\n1.6 Executed incident/ emergency procedures based on OSH\nProcedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary for the\nactivity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 34 ---\nFood Processing NC I Promulgated January 11, 2019 30\nUNIT OF COMPETENCY\n:\nAPPLY ENVIRONMENTAL WORK STANDARDS\n\nUNIT CODE\n:"
        },
        "source_text": "400311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to\nidentify relevant occupational safety and health policies\nand procedures, perform relevant occupational safety\nand health procedures, and comply with relevant\noccupational safety and health policies and standards\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify relevant\noccupational\nsafety and health\npolicies and\nprocedures\n1.1 Related\noccupational\nsafety and health\nrisks and hazards\nare recognized\nbased on OSH\nwork standards.\n1.2 OSH\nrequirements/\nregulations\ntowards work are\ndetermined in\naccordance to\nworkplace policies\nand procedures.\n1.3 Incident/\nEmergency\nprocedures\nrelevant to\nworkplace are\nidentified based on\nrelevant OSH work\nstandards.\n1.1 Occupational\nsafety and health\nrisks and hazards\n1.2 OSH work\nstandards\n1.3 Government\napproved\nOccupational\nSafety and Health\nPolicies and\nregulations\n1.4 Terms related to\noccupational\nsafety and health\n1.5 Workplace\nprocess and\nprocedures\n1.6 Standard\nemergency plan\nand procedures\n1.1 Observation\nskills\n1.2 Critical thinking\nskills\n1.3 Communication\nskills\n\n--- PDF PAGE 30 ---\nFood Processing NC I Promulgated January 11, 2019 26\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform relevant\noccupational\nsafety and health\nprocedures\n2.1 Safety devices are\nchecked in\naccordance with\nworkplace OSH\nwork standards.\n2.2 OSH Work\ninstructions are\nfollowed in\naccordance with\nworkplace policies\nand procedures.\n2.3 Personal\nprotective\nequipment,\nmaterials, tools,\nmachinery, and\nequipment are\nutilized according to\nOSH work\nstandards.\n2.1 OSH Work\ninstructions\nPersonal\nprotective\nequipment\n2.2 Safe handling\nprocedures of\ntools, equipment\nand materials\n2.3 Standard\nemergency plan\nand procedures\n2.4 Different OSH\ncontrol measures\n2.5 Standard accident\nand illness\nreporting\nprocedures\n2.1 Communication\nskills\n2.2 Knowledge\nmanagement\n2.3 Organizing skills\n2.4 Observation\nskills\n3. Comply with\nrelevant\noccupational\nsafety and health\npolicies and\nstandards\n3.1 Preventive Control\nMeasures are\nidentified in\naccordance with\nOSH work\nstandards.\n3.2 OSH requirements\nare obeyed in\naccordance with\nworkplace policies\nand procedures.\n3.3 Incident/\nEmergency\nprocedures are\nexecuted based on\nOSH Procedures.\n3.1 OSH Preventive\nControl Measures\n3.2 Principles of 5S\n3.3 Environmental\nrequirements\nrelative to\nindustrial wastes\ndisposal\n3.4 OSH\nrequirements\nrelative to safe\nhandling and\ndisposal of\nmaterials\n3.5 Personal hygiene\npractices\n3.1 Communication\nskills\n3.2 Knowledge\nmanagement\n3.3 Organizing skills\n3.4 Critical thinking\nskills\n3.5 Observation\nskills\n\n--- PDF PAGE 31 ---\nFood Processing NC I Promulgated January 11, 2019 27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational Safety and\nHealth Risks and\nHazards\nMay include:\n1.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, extreme temperature, radiation\n1.2 Biological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n1.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n1.4 Ergonomics\n1.5 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n1.6 Physiological factors – monotony, personal\nrelationship, work out cycle\n1.7 Safety hazards (unsafe workplace condition) –\nconfined space, excavations, falling objects, gas\nleaks, electrical, poor storage of materials and\nwaste, spillage, waste and debris\n1.8 Unsafe workers’ act (Smoking in off-limited areas,\nSubstance and alcohol abuse at work)\n2. OSH Work Standards\nMay include:\n2.1 OSHS Rule 1090 Hazardous Materials\n2.2 OSHS Rule Gas & Electric Welding and Cutting\nOperations\n2.3 OSHS Rule 1120 Hazardous Work Processes\n2.4 OSHS Rule 1150 Materials Handling & Storage\n2.5 OSHS Rule 1180 Internal Combustion Engine\n2.6 OSHS Rule 1210 Electrical Safety\n2.7 OSHS Rule 1420 Logging\n2.8 OSHS Rule 1410 Construction Safety\n2.9 OSHS Rule 1950 Pesticides & Fertilizers\n3. OSH Requirements/\nRegulations\nMay include:\n3.1 Clean Air Act\n3.2 Building code\n3.3 National Electrical and Fire Safety Codes\n3.4 Waste management statutes and rules\n3.5 Permit to Operate\n3.6 Philippine Occupational Safety and Health\nStandards\n3.7 Department Order No. 13 (Construction Safety and\nHealth)\n3.8 ECC regulations\n3.9 Republic Act No. 11058 – An Strengthening\nCompliance with Occupational Safety and Health\n4. Incident and Emergency\nProcedures\nMay include:\n4.1 Chemical spills\n4.2 Equipment/vehicle accidents\n4.3 Explosion\n4.4 Fire Drill\n4.5 Gas leak\n4.6 Injury to personnel\n\n--- PDF PAGE 32 ---\nFood Processing NC I Promulgated January 11, 2019 28\nVARIABLE\nRANGE\n4.7 Structural collapse\n4.8 Earthquake drill\n4.9 Toxic and/or flammable vapors emission\n4.10 Evacuation\n4.11 Isolation\n4.12 Basic life support/CPR\n4.13 Decontamination\n4.14 Calling designed emergency personnel\n5. OSH Work Instructions\nMay include:\n5.1 Worker’s Participation Policies\n5.2 Company Environment Safety and Health Policies\n5.3 Continual OSH Improvement Instructions\n5.4 Education and Training\n5.5 Safety and Health Policy Statements\n5.6 Mission and Vision Statements\n5.7 Operating Instructions and Policies\n6. Personal Protective\nEquipment\nMay include:\n6.1 Arm/Hand guard, gloves\n6.2 Eye protection (goggles, shield)\n6.3 Hearing protection (ear muffs, ear plugs)\n6.4 Hair Net/cap/bonnet\n6.5 Hard hat\n6.6 Face protection (mask, shield)\n6.7 Apron/Gown/coverall/jump suit\n6.8 Anti-static suits\n6.9 High-visibility reflective vest\n7. Preventive Control\nMeasures\nMay include:\n7.1 Eliminate the hazard (i.e., get rid of the dangerous\nmachine\n7.2 Isolate the hazard (i.e. keep the machine in a closed\nroom and operate it remotely; barricade an unsafe\narea off)\n7.3 Substitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n7.4 Use administrative controls to reduce the risk (i.e.\ngive trainings on how to use equipment safely;\nOSH-related topics, issue warning signages,\nrotation/shifting work schedule)\n7.5 Use engineering controls to reduce the risk (i.e. use\nsafety guards to machine)\n7.6 Use personal protective equipment\n7.7 Safety, Health and Work Environment Evaluation\n7.8 Periodic and/or special medical examinations of\nworkers\n\n--- PDF PAGE 33 ---\nFood Processing NC I Promulgated January 11, 2019 29\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Recognize related occupational safety and health risks\nand hazards based on OSH work standards\n1.2 Identify incident/emergency procedures relevant to\nworkplace based on relevant OSH work standards\n1.3 Follow the OSH work instructions in accordance with\nworkplace policies and procedures\n1.4 Utilize personal protective equipment, materials, tools,\nmachinery, and equipment according to OSH work\nstandards\n1.5 Obey OSH requirements in accordance with workplace\npolicies and procedures\n1.6 Executed incident/ emergency procedures based on OSH\nProcedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary for the\nactivity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 34 ---\nFood Processing NC I Promulgated January 11, 2019 30\nUNIT OF COMPETENCY\n:\nAPPLY ENVIRONMENTAL WORK STANDARDS\n\nUNIT CODE\n:"
