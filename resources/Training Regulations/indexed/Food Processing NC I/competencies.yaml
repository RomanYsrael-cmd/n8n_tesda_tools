        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, prepared and calibrated standard measuring\ndevices and instruments\n1.2 Followed correctly the procedures in using standard\nmeasuring devices and instruments\n1.3 Followed proper cleaning and sanitizing and stowing\nprocedures of measuring devices and equipment before\nand after use\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Work area/station\n2.2 Materials, tools and equipment relevant to the Unit of\nCompetency\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation and questioning of a candidate using\nmeasuring devices and instruments\n4. Context of\nassessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 50 ---\nFood Processing NC I Promulgated January 11, 2019 46\nUNIT OF COMPETENCY\n:\nUSE FOOD PROCESSING TOOLS, EQUIPMENT AND\nUTENSILS\n\nUNIT CODE\n:"
        },
        "source_text": "AGR741202\n\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required to use\nstandard measuring devices, instruments in the\nworkplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify Standard\nMeasuring\nDevices and\nInstruments\n1.1 Standard\nmeasuring\ndevices and\ninstruments are\nidentified according\nto manufacturer’s\nspecifications.\n1.2 Devices and\ninstruments for\nmeasuring are\nproperly checked,\nsanitized and\ncalibrated prior to\nuse.\n1.1 Safe handling of\nmeasuring\ndevices and\ninstruments\n1.2 Specifications and\nfunctions of\nmeasuring\ndevices and\ninstruments\n1.3 Defects and\nbreakages of\nmeasuring\ndevices and\ninstruments\n1.4 Procedures in\nsanitizing and\ncalibrating and\nstowing\nequipment and\ninstruments\n1.1 Communication\nskills\n1.2 Sanitary\nhandling of\ndevices and\ninstruments\n1.3 Calibrating skills\n2. Review the\nProcedures in\nUsing Standard\nMeasuring\nDevices and\nInstruments\n2.1 Procedures in using\nthe standard\nmeasuring\ndevices and\ninstruments are\nrecalled according\nto manufacturer’s\nspecifications.\n2.1 Printed procedures/\nbrochures/\ncatalogues are\nconsulted according\nto specified food\nprocessing\nmethods.\n2.1 Standard\nmeasuring\ndevices\n2.2 Food processing\nmethods\n2.1 Recalling\nprocedures in\nusing standard\nmeasuring\ndevices and\ninstruments\n2.2 Consulting\nprinted\nprocedures/\nbrochures/\ncatalogues\n\n--- PDF PAGE 47 ---\nFood Processing NC I Promulgated January 11, 2019 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Follow procedures\nof using measuring\ndevices and\ninstruments\n3.1 Methods/practices\nof using measuring\ndevices and\ninstruments are\nstrictly observed\naccording to\nmanufacturer’s\nspecifications and\nworkplace\nrequirements.\n3.2 Measuring devices\nand instruments are\ncleaned, wiped dry\nand stowed after\nuse to ensure\nconformity with\nworkplace\nrequirements.\n3.1 Procedures in\ncleaning, and\nstowing\nequipment and\ninstruments\n3.1 Measuring\ndevices and\ninstruments\n3.2 Cleaning and\nstowing\nmeasuring\ndevices and\ninstruments\n\n--- PDF PAGE 48 ---\nFood Processing NC I Promulgated January 11, 2019 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Standard Measuring\nDevices\nStandard Measuring Devices may include but not limited\nto the following:\n1.1 Weighing scales and balances of various capacities\nand sensitivities\n1.2 Measuring cups of varying capacities for dry\ningredients\n1.3 Measuring cups of varying capacities for liquid\ningredients\n2. Standard Measuring\nInstruments\nStandard Measuring Instruments may include but not\nlimited to the following:\n2.1 Salinometer\n2.2 Thermometers of varying temperature range (0-300\nC)\n2.3 Refractometer of varying range (0 – 90 B)\n2.4 Glasswares like cylinders, beakers, flasks) of\nvarying graduations\n3. Food Processing\nMethods\nFood Processing Methods include the following:\n3.1 Process foods by Salting, Curing and Smoking\n3.2 Process foods by Fermentation and Pickling\n3.3 Process foods by Canning and Bottling\n3.4 Process foods by Sugar Concentration\n3.5 Process foods by Drying and Dehydration\n\n--- PDF PAGE 49 ---\nFood Processing NC I Promulgated January 11, 2019 45\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, prepared and calibrated standard measuring\ndevices and instruments\n1.2 Followed correctly the procedures in using standard\nmeasuring devices and instruments\n1.3 Followed proper cleaning and sanitizing and stowing\nprocedures of measuring devices and equipment before\nand after use\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Work area/station\n2.2 Materials, tools and equipment relevant to the Unit of\nCompetency\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation and questioning of a candidate using\nmeasuring devices and instruments\n4. Context of\nassessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 50 ---\nFood Processing NC I Promulgated January 11, 2019 46\nUNIT OF COMPETENCY\n:\nUSE FOOD PROCESSING TOOLS, EQUIPMENT AND\nUTENSILS\n\nUNIT CODE\n:"
