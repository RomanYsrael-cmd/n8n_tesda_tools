  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Food Processing NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\n\nUNIT CODE\n:\n400311101\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to receive, respond and act on verbal and\nwritten communication.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow routine\nspoken messages\n1.1 Required\ninformation is\ngathered by\nlistening attentively\nand correctly\ninterpreting or\nunderstanding\ninformation/\ninstructions\n1.2 Instructions/\ninformation are\nrecorded in\naccordance with\nworkplace\nrequirements\n1.3 Instructions are\nacted upon\nimmediately in\naccordance with\ninformation\nreceived\n1.4 Clarification is\nsought from\nworkplace\nsupervisor on all\noccasions when\nany instruction/\ninformation is not\nclear\n1.1 Organizational\npolicies/\nguidelines in\nregard to\nprocessing\ninternal/external\ninformation\n1.2 Ethical work\npractices in\nhandling\ncommunications\n1.3 Overview of the\nCommunication\nprocess\n1.4 Effective note-\ntaking and\nquestioning\ntechniques\n1.1 Conciseness in\nreceiving and\nclarifying\nmessages/\ninformation/\ncommunication\n1.2 Accuracy in\nrecording\nmessages/\ninformation\n1.3 Basic\ncommunication\nskills\n1.4 Active-listening\nSkills\n1.5 Note-taking skills\n1.6 Clarifying and\nprobing\nquestions\n(questioning\nskills)\n2. Perform workplace\nduties following\nwritten notices\n2.1 Written notices\nand instructions are\nread and\ninterpreted correctly\nin accordance with\n2.1 Organizational\nguidelines in\nregard to\nprocessing\ninternal/ external\n2.1 Conciseness in\nreceiving and\nclarifying\nmessages/\ninformation/\n\n--- PDF PAGE 7 ---\nFood Processing NC I Promulgated January 11, 2019 3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\norganizational\nguidelines.\n2.2 Routine written\ninstructions are\nfollowed in\nsequence.\n2.3 Feedback is given\nto workplace\nsupervisor based\non the instructions/\ninformation\nreceived.\ninformation\n2.2 Ethical work\npractices in\nhandling\ncommunications\n2.3 Overview of the\nCommunication\nprocess\n2.4 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\ncommunication\n2.2 Accuracy in\nrecording\nmessages/\ninformation\n2.3 Clarifying and\nprobing\nquestions\n(Questioning\nSkills)\n2.4 Skills in reading\nand recording\nand labeling data\n2.5 Skills in locating\ninformation\n\n--- PDF PAGE 8 ---\nFood Processing NC I Promulgated January 11, 2019 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nMay include but not limited to:\n1.1 Written work instructions\n1.2 Internal memos/memorandum\n1.3 Business letters\n1.4 External communications\n1.5 Electronic mail\n1.6 Briefing notes\n1.7 General correspondence\n1.8 Marketing materials\n1.9 Guidelines/Circulars\n2. Organizational guidelines\nMay include but not limited to:\n2.1 Information documentation procedures\n2.2 Company guidelines and procedures\n2.3 Standard Operating Procedure (SOPs)\n2.4 Organization manuals\n2.5 Departmental Policies and Procedures Manual\n2.6 Service manual\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of\norganizational procedures in handling verbal and written\ncommunications\n1.2 Received and acted on verbal messages and instructions\ncorrectly and efficiently\n1.3 Demonstrated ability in recording instructions/information\n1.4 Utilized effective clarifying and probing techniques where\nnecessary\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Pens\n2.2 Note pads\n2.3 Computer (if applicable)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration on communication skills (e. g., role-\nplaying)\n3.3 Oral questioning/Interview\n3.3 Written Test\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or in a simulated environment in TESDA-\naccredited institutions\n\n--- PDF PAGE 9 ---\nFood Processing NC I Promulgated January 11, 2019 5\n\nUNIT OF COMPETENCY :\nWORK WITH OTHERS\n\nUNIT CODE\n:\n400311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired in working as member of a team, interacting\nwith co-members and performing one’s role in the team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop effective\nworkplace\nrelationships\n1.1 Duties and\nresponsibilities\nare done in a\npositive manner to\npromote\ncooperation and\ngood relationship.\n1.2 Assistance is\nsought from\nworkgroup when\ndifficulties arise and\naddressed through\ndiscussions.\n1.3 Feedback provided\nby others in the\nteam is\nencouraged,\nacknowledged and\nacted upon\n1.4 Differences in\n.personal values\nand beliefs are\nrespected and\nacknowledged\nduring interaction.\n1.1 One’s role, duties\nand responsibilities\nin the workplace\n1.2 Acknowledging/\nreceiving and giving\nfeedback\n1.3 Valuing respect and\nempathy in the\nworkplace\n1.4 Workplace\ncommunication\nprotocols\n1.5 Teamwork\n1.6 Collaboration and\nteambuilding within\nthe enterprise\n1.1 Communication\nskills – oral and\nwritten (e. g.,\nrequesting\nadvice, receiving\nfeedback)\n1.2 Ability to relate\nto/interact with\npeople from a\nrange of social\nand cultural\nbackgrounds\n2. Contribute to work\ngroup activities\n2.1 Support is\nprovided to team\nmembers to ensure\nworkgroup goals\nare met.\n2.2 Constructive\ncontributions to\nworkgroup goals\nand tasks are made\naccording to\norganizational\nrequirements.\n2.3 Information relevant\nto work is shared\nwith team members\nto ensure\ndesignated goals\nare met.\n2.1 Importance of\ncreative\ncollaboration, social\nperceptiveness and\nproblem sensitivity in\nthe workplace\n2.2 Organizational\nRequirements\n2.3 importance of\ninitiative and\ndedication in group\nprocess\n2.4 Office and workplace\ntechnologies and\nautomation\n(hardware, software\nsystems)\n2.1 Communication\nskills – oral and\nwritten (e. g.,\nrequesting\nadvice, receiving\nfeedback)\n2.2 Organizing work\npriorities and\narrangements\n2.3 Team player\nskills\n2.4 Technology skills\nincluding the\nability to select\nand use\ntechnology\nappropriate to a\ntask\n\n--- PDF PAGE 10 ---\nFood Processing NC I Promulgated January 11, 2019 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\nMay include but not limited to:\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements\nincluding OHS\n1.5 Enterprise code of conduct\n2. Work group\nMay include but not limited to:\n2.1 Supervisor or manager\n2.2 Peers/work colleagues and clients\n2.3 Other members of the organization\n3. Feedback\nMay include but not limited to:\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and\ncolleagues and clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring\nservice delivery\n4. Providing support to team\nmembers\nMay include but not limited to:\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\nMay include but not limited to:\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 11 ---\nFood Processing NC I Promulgated January 11, 2019 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Provided support to team members to ensure goals are\nmet\n1.2 Acted on feedback from clients and colleagues\n1.3 Demonstrated quality/active participation in team meetings\nand activities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Role play\n3.3 Interview/Oral questioning\n3.4 Structured and unstructured activity\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nFood Processing NC I Promulgated January 11, 2019 8\nUNIT OF COMPETENCY\n:\nSOLVE/ADDRESS ROUTINE PROBLEMS\n\nUNIT CODE\n:\n400311103\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to\ndetermine and resolve the root cause of routine\nproblems.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nproblem\n1.1 Desired operating/\noutput parameters and\nexpected quality of\nproducts/services are\nidentified.\n1.2 The nature of the\nproblem by observation\non routines are defined.\n1.3 Problems are stated\nand specified clearly.\n1.1 Competence\nincludes mastery\nof knowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard\nsituations\n1.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of\nproblems routine\nproblems and to\ndetermine the\ncorrective actions.\n1.3 Relevant\nequipment and\noperational\nprocesses\n1.4 Enterprise goals,\ntargets and\nmeasures\n1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n1.6 Enterprise\ninformation\nsystems and data\ncollation\n1.7 Industry codes\nand standards\n1.1 Using range of\nformal\nproblem-\nsolving\ntechniques\n(e.g., planning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation).\n1.2 Identifying and\nclarifying the\nnature of the\nproblem.\n\n--- PDF PAGE 13 ---\nFood Processing NC I Promulgated January 11, 2019 9\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Assess\nfundamental\ncauses of the\nproblem\n2.1 Problem-solving tool\nappropriate to the\nproblem and the\ncontext is selected\n2.2 Possible causes based\non experience and the\nuse of problem-solving\ntools/basic analytical\ntechniques are\nidentified\n2.3 Possible fundamental\ncauses of problems are\nspecified.\n2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard\nsituations\n2.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of\nproblems routine\nproblems and to\ndetermine the\ncorrective actions.\n2.3 Relevant\nequipment and\noperational\nprocesses\n2.4 Enterprise goals,\ntargets and\nmeasures\n2.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n2.6 Enterprise\ninformation\nsystems and data\ncollation\n2.7 Industry codes\nand standards\n2.1 Using range of\nformal\nproblem-\nsolving\ntechniques\n(e.g., planning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation).\n2.2 Identifying\nextent and\ncauses of\nprocedural\nproblems.\n\n--- PDF PAGE 14 ---\nFood Processing NC I Promulgated January 11, 2019 10\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Determine\ncorrective action\n3.1 All possible options are\nconsidered for\nresolution of the routine\nproblem.\n3.2 Corrective actions are\ndetermined to resolve\nthe problem and\npossible future causes\n3.3 Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and\noperating procedures\n3.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard\nsituations\n3.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the\nidentification of\nfundamental\ncause,\ndetermining the\ncorrective action\nand provision of\nrecommendations\n3.3 Relevant\nequipment and\noperational\nprocesses\n3.4 Enterprise goals,\ntargets and\nmeasures\n3.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n3.6 Principles of\ndecision making\nstrategies and\ntechniques\n3.7 Enterprise\ninformation\nsystems and data\ncollation\n3.8 Industry codes\nand standards\n3.1 Using range of\nformal\nproblem-\nsolving\ntechniques.\n3.2 Identifying and\nclarifying the\nnature of the\nproblem.\n3.3 Devising and\napplying the\nbest possible\nsolution to a\nproblem.\n3.4 Evaluating the\nsolution\n4. Communicate\naction plans and\nrecommendations\nto routine\nproblems\n4.1 Report on\nrecommendations are\nprepared.\n4.2 Recommendations are\npresented to\nappropriate person.\n4.3 Recommendations are\nfollowed-up, if required.\n4.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\n4.1 Using range of\nformal problem\nsolving\ntechniques\n4.2 Identifying and\nclarifying the\nnature of the\nproblem\n\n--- PDF PAGE 15 ---\nFood Processing NC I Promulgated January 11, 2019 11\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nproduct quality to\nrecognize non-\nstandard\nsituations\n4.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the\nidentification of\nfundamental\ncause,\ndetermining the\ncorrective action\nand provision of\nrecommendations\n4.3 Relevant\nequipment and\noperational\nprocesses\n4.4 Enterprise goals,\ntargets and\nmeasures\n4.5 Enterprise quality,\nOHS and\nenvironmental\nrequirement\n4.6 Principles of\ndecision making\nstrategies and\ntechniques\n4.7 Enterprise\ninformation\nsystems and data\ncollation\n4.8 Industry codes\nand standards\n4.3 Devising the\nbest possible\nsolution to a\nroutine\nproblem\n4.4 Evaluating the\nsolution\n4.5 Developing\naction plans to\nresolving and\nmanaging\nroutine\nproblems\n\n--- PDF PAGE 16 ---\nFood Processing NC I Promulgated January 11, 2019 12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problem\nMay include but not limited to:\n1.1 Routine/non – routine processes and quality\nproblems\n1.2 Equipment selection, availability and failure\n1.3 Teamwork and work allocation problem\n1.4 Safety and emergency situations and incidents\n2. Basic analytical\ntechniques\nMay include but not limited to:\n2.1 Brainstorming\n2.2 Case Analysis\n2.3 Cause and effect diagrams\n2.4 Pareto analysis\n2.5 SWOT analysis\n2.6 Gant chart, Pert CPM and graphs\n2.7 Scattergram\n3. Action plans\nMay include but not limited to:\n3.1 Priority requirements\n3.2 Measurable objectives\n3.3 Resource requirements\n3.4 Timelines\n3.5 Co-ordination and feedback requirements\n3.6 Safety requirements\n3.7 Risk assessment\n3.8 Environmental requirements\n4. Appropriate person\nMay include but not limited to:\n4.1 Supervisor or manager\n4.2 Peers/work colleagues\n4.3 Other members of the organization\n\n--- PDF PAGE 17 ---\nFood Processing NC I Promulgated January 11, 2019 13\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified the problem.\n1.2 Determined the fundamental causes of the problem.\n1.3 Determined the correct / preventive action.\n1.4 Developed action plans in managing routine problems.\n\nThese aspects may be best assessed using project-based\nlearning mode of assessment and case formulation.\n2. Resource\nImplications\n2.1 Assessment will require access to a workplace over an\nextended period, or a suitable method of gathering\nevidence of operating ability over a range of situations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Case Formulation\n3.2 Life Narrative Inquiry (Interview)\n3.3 Standardized test\n\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the\nrelevant competency components.\n\nThese assessment activities should include a range of\nproblems, including new, unusual and improbable situations\nthat may have happened.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 18 ---\nFood Processing NC I Promulgated January 11, 2019 14\nUNIT OF COMPETENCY\n:\nENHANCE SELF-MANAGEMENT SKILLS\n\nUNIT CODE\n:\n400311104\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes in\napplying the ability to regulate actions, make good\ndecisions, and show appropriate behavior based on self-\nawareness.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Set personal and\ncareer goals\n1.1 The difference\nbetween personal\nand career goals\nare described.\n1.2 Clear and concise\npersonal and career\ngoals are\ndeveloped.\n1.3 Characteristics of\nmotivational goals\naccording to Locke\n&Latham are\nidentified.\n1.1 Definition of\npersonal goals\nand career goals\n1.2 SMART Model for\ngoal setting\n1.3 Five principle of\ngoal setting\naccording to\nLocke & Latham\n(Clarity,\nChallenge,\nCommitment,\nFeedback, and\nTask complexity)\n1.1 Setting of\npersonal and\ncareer goals\n1.2 Defining,\ncreating, and\nmapping\npersonal and\ncareer goals\nusing SMART\nModel for goal\nsetting\n1.3 Applying goal\nsetting principles\nto personal and\ncareer goals\n2. Recognize\nemotions\n2.1 Influence that\npeople, situations\nand events have on\nemotions are\ndescribed.\n2.2 Importance of\nresponding with\nappropriate\nemotions are\nexplained.\n2.3 Influences on and\nconsequences of\nemotional\nresponses in a\nsocial and work-\nrelated contexts\nare examined.\n2.1 Common positive\nand negative\nemotions\nmanifested in the\nworkplace\n2.2 Professional and\nnon-professional\nbehaviors in the\nworkplace\n2.3 Triggers and\nimplications of\npositive and\nnegative\nemotions in the\nworkplace\n2.1 Identifying\nsensitively the\npositive and\nnegative\nemotions in the\nworkplace\n2.2 Responding with\nappropriate\nemotions in the\nworkplace\n2.3 Identifying\npossible\nconsequences of\ninappropriate\nemotional\nresponses in a\nsocial and work-\nrelated context\n3. Describe oneself\nas a learner\n3.1 Factors and\nstrategies that\nassist learning are\nidentified and\ndescribed.\n3.2 Preferred learning\nstyles according to\nVAK Learning Style\nModel and Kolb’s\nTheory of Learning\n3.1 Kolb’s Theory of\nLearning Styles\n(Converger,\nDiverger,\nAssimilator,\nAccommodator)\n3.2 VAK Learning\nStyle Model\n(Visual, Auditory,\nKinesthetic)\n3.1 Identifying\nfactors and\nstrategies that\nassist learning\n3.2 Applying learning\nstyles to\npositively\ninfluence\nschool/work\nperformance\n\n--- PDF PAGE 19 ---\nFood Processing NC I Promulgated January 11, 2019 15\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nStyles are\nidentified.\n3.3 Range of learning\nstrategies\nappropriate to\nspecific tasks and\ndescribe work\npractices that assist\ntheir learning are\nidentified and\nchosen.\n3.3 Range of learning\nstrategies\nappropriate to\nspecific tasks and\ndescribe work\npractices that\nassist their\nlearning\n3.3 Using\nappropriate\nlearning\nstrategies to\nimprove study\nhabits and\nlearning\n\n--- PDF PAGE 20 ---\nFood Processing NC I Promulgated January 11, 2019 16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal goals\nMay include but not limited to:\n1.1 Graduate from Tech-Voc training\n1.2 Buy a car\n1.3 Travel around the world\n2. Career goals\nMay include but not limited to:\n2.1 Graduate from Tech-Voc training\n2.2 Graduate from college\n2.3 Buy a car\n2.4 Retire at 50 years old\n3. Emotions\nPositive emotions may include but not limited to:\n3.1 Joy\n3.2 Gratitude\n3.3 Hope\n3.4 Serenity\n\nNegative emotions may include but not limited to:\n3.5 Anger\n3.6 Fear\n3.7 Disgust\n3.8 Sadness\n4. Social and work-related\ncontexts\nMay include professional behavior such as–\n4.1 Committed to developing and improving their skills\n4.2 Professionals get the job done\n4.3 They keep their word and deliver what they\npromise.\n\nMay include non-professional behavior such as–\n4.4 They engage in office politics\n4.5 Bluffing and misrepresenting their skills\n4.6 Blaming a colleague\n5. Learning styles\nMay include but not limited to:\n5.1 Visual\n5.2 Auditory\n5.3 Kinesthetic\n5.4 Converger\n5.5 Diverger\n5.6 Assimilator\n5.7 Accommodator\n6. Learning strategies\nMay include but not limited to:\n6.1 Explain and describe ideas with many details\n6.2 Switch between ideas while studying\n6.3 Use specific examples to understand abstract ideas\n\n--- PDF PAGE 21 ---\nFood Processing NC I Promulgated January 11, 2019 17\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified the problem.\n1.2 Determined the fundamental causes of the problem.\n1.3 Determined the correct / preventive action.\n1.4 Developed action plans in managing routine problems.\n\nThese aspects may be best assessed using project-based\nlearning mode of assessment and case formulation.\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Developed SMART personal and career goals\n1.2 Applied goal setting principles\n1.3 Identified sensitively the positive and negative emotions in\nthe workplace\n1.4 Responded with appropriate emotions in the workplace\n1.5 Identified possible consequences of inappropriate\nemotional responses in a social and work-related context\n1.6 Applied learning styles to positively influence school/work\nperformance\n1.7 Developed reflective practice through realization of\nlimitations, likes/ dislikes; through showing of self-\nconfidence\n2. Resource\nImplications\nThe following resources for should be provided:\n2.1 Access to workplace and resources\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration or simulation with oral questioning (ex. how\nto recognize emotions)\n3.2 Case problems involving workplace diversity issues\n3.3 Third-party report\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 22 ---\nFood Processing NC I Promulgated January 11, 2019 18\nUNIT OF COMPETENCY\n:\nSUPPORT INNOVATION\n\nUNIT CODE\n:\n400311105\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to identify, recognize and support innovation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the need\nfor innovation in\none’s area of work\n1.1 The value of\ninnovative practices\nin the workplace is\nrecognized.\n1.2 Creativity in\ninnovation in one’s\nscope of work is\napplied.\n1.3 The need for\ninnovation in own\nscope of work is\nrecognized.\n1.1 Clear-cut\ndefinition of\ninnovation\n1.2 Current practice\nin own scope of\nwork\n1.3 Workplace\nprocedures\n1.1 Contributing in\nbrainstorming\nsession\n1.2 Examining\ncurrent practice\nin one’s scope of\nwork\n1.3 Identifying issues\nand concerns of\none’s scope of\nwork\n2. Recognize\ninnovative and\ncreative ideas\n2.1 Opportunities within\nthe team are\nidentified to develop\ninnovation.\n2.2 Creative ideas of\ncoworkers pertaining\nto work practices are\nanalyzed.\n2.3 Environment\nconducive for\nlearning and\ninnovating is\nmaintained.\n2.1 Support required\nto generate\ncreative ideas\n2.2 Difference\nbetween\ninnovation and\ncreativity\n2.3 Innovative climate\nin one’s scope of\nwork\n2.1 Identifying\nresources\nrequired for\ncreativity and\ninnovation\n2.2 Examining\npotential\nobstacles to and\nopportunities for\ncreativity and\ninnovation\n2.3 Communicating\ncreative ideas of\nco-workers\n3. Support individuals’\naccess to flexible\nand innovative\nways of working\n3.1 Individuals and key\npeople are reinforced\nto identify innovative\nideas to achieve\noutcomes.\n3.2 Sharing of best\npractices using\nflexible and\ninnovative ways of\nworking is\naccomplished.\n3.3 Obstacles to progress\nin implementing\nflexible and\ninnovative ways of\nworking are\nrecognized.\n3.1 The role of\nemployees/worke\nrs in the\nimprovement of\npractices in the\norganization\n3.2 Best practices\nusing flexible and\ninnovative ways\nof working\n3.3 Obstacles in\nimplementing\ninnovation in\none’s scope of\nwork\n3.1 Encouragi