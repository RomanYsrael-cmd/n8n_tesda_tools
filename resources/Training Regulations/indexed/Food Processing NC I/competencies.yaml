        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared and monitored materials and equipment for\ndispensing\n1.2 Dispensed materials are labelled\n1.3 Used and cleaned dispensing equipment\n1.4 Followed work procedures\n1.5 Completed required records\n1.6 Handled raw materials, products and supplies during\nloading and unloading\n1.7 Practiced OSH during loading and unloading\n2. Methods of\nAssessment\nCompetency must be assessed through:\n2.1 Direct observation with oral questioning\n2.2 Demonstration with oral questioning\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Specific work area/station\n3.2 Equipment and tools for dispensing\n3.3 Materials relevant to the proposed activity\n3.4 Relevant workplace procedures, schedules and records\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n4.2 Ability to apply competency over time and on a number of\noccasions\n\n--- PDF PAGE 76 ---\nFood Processing NC I Promulgated January 11, 2019 72\nUNIT OF COMPETENCY\n:\nPREPARE PACKAGING MATERIALS AND SUPPLIES\nFOR PROCESSING\n\nUNIT CODE\n:"
        },
        "source_text": "PFB751343\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to prepare, dispense, and load and unload raw\nmaterials, products and supplies. It involves pre-start\nchecks, dispensing and labeling of materials, recording,\nand proper handling of materials.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform\npreparatory\nactivities\n1.1 Materials are\nreceived according\nto industry\nguidelines.\n1.2 Containers/bags\nand labels are\nprepared according\nto industry\nguidelines.\n1.3 Pre-start checks\nare carried out\naccording to\nindustry\nguidelines.\n1.1 Personal\nprotective\nequipment (PPE):\n1.1.1 Apron/\nlaboratory\ngown\n1.1.2 Face masks\n1.1.3 Gloves\n1.1.4 Rubber\nboots/safety\nshoes\n1.1.5 Head gears\nsuch as\ncaps, hair\nnets, ear\nplug, sweat\nband\n1.2 OSHS\nrequirements:\n1.2.1 Health/\nmedical\ncertificate\n1.2.2 DOLE\nrequire-\nments\n1.2.3 Personal\nhygiene and\ngood\ngrooming\n1.2.4 AO 153\n1.3 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.4 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n\n1.1 Perform\ninspection,\nchecking and\nreporting\ncondition of\nequipment/\nmachines before,\nduring and after\noperation\n1.2 Receiving\nmaterials\n1.3 Preparing\ncontainers/\n1.4 bags and labels\n1.5 Conducting pre-\nstart checks\n1.6 Applying OSHS\n1.7 Wearing of PPEs\n\n--- PDF PAGE 71 ---\nFood Processing NC I Promulgated January 11, 2019 67\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Conduct\ndispensing\nactivities\n2.1 Dispensed\nmaterials are\nlabeled according\nto industry\nguidelines.\n2.2 Accuracy and\nvariation of\nmeasuring,\ndispensing and\nweighing\nequipment is\nmonitored and\nreported according\nto workplace\nprocedures.\n2.3 Workplace is\nmaintained\naccording to\nindustry\nguidelines.\n2.1 Labelling\nProcedures\n2.2 Use of equipment\n2.3 Monitoring and\nreporting\nprocedures\n2.4 7S of Good\nHousekeeping\n2.5 AO 153\n2.6 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n2.7 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n2.1 Dispense/\nmeasure\nmaterials and\nequipment\n2.2 Housekeeping\nskills\n2.3 Labeling\ndispensed\nmaterials\n2.4 Monitoring\naccuracy and\nvariation of\nmeasuring/dispe\nnsing and\nweighing\nequipment\n2.5 Maintaining\nworkplace\n3. Complete the\ndispensing\nprocess\n3.1 Dispensing\nequipment is shut\ndown and cleaned\naccording to\nindustry\nguidelines.\n3.2 Maintenance\nrequirements and\nunacceptable\nequipment/utensil\nconditions are\nreported according\nto workplace\nprocedures.\n3.3 Records are\ncompleted\naccording to\nworkplace\nprocedures.\n3.4 Waste\nmanagement is\npracticed according\nto Ecological Solid\nWaste\nManagement Act of\n2000\n3.1 Company’s\nDispensing\nprocedures /\nStandard\nOperating\nProcedures\n3.2 Standard\nOperating\nProcedures on\npreparing\nrecords/\ndocumentation\n3.3 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n3.4 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n3.5 RA 9003 –\nEcological Solid\nWaste\nManagement Act\nof 2000\n\n3.1 Use of SOP in\nshutting down\nequipment\n3.2 Cleaning skills\n3.3 Preparing\nreports (filling-up\nforms)\n3.4 Waste\nsegregation and\ndisposal skills\n3.5 Shutting down\ndispensing\nequipment\n3.6 Reporting\nmaintenance\nrequirements\nand\nunacceptable\nequipment/\nutensil conditions\n3.7 Conducting\nrecord keeping\n\n--- PDF PAGE 72 ---\nFood Processing NC I Promulgated January 11, 2019 68\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Load and unload\nraw materials,\nproducts and\nsupplies\n4.1 Special dispensing\nof raw materials is\nperformed\naccording to\nindustry\nguidelines.\n4.2 Raw materials,\nproducts and\nsupplies are\nunpacked\naccording to\nindustry\nguidelines.\n4.3 Raw materials are\npiled according to\nindustry\nguidelines.\n4.4 Raw materials are\ndispensed in\naccordance to\nproduction\nsequence and\nindustry\nguidelines.\n4.1 Occupational\nHealth and Safety\nregulatory and\nlegislative\nrequirements\n4.1.1 Dangerous\nor\nhazardous\nraw\nmaterials\n4.1.2 Good\nManufactu-\nring\nPractices\n(GMP)\n4.2 Raw materials,\nproducts and/or\nsupplies\n4.2.1 Special\nhandling\n4.2.1.1 FIFO/\nFEFO\n4.2.2 Unpacking\n4.2.3 Documen-\ntation\n4.3 Identification of\nhazards and risks\n4.3.1 physical\n4.3.2 biological\n4.3.3 chemical\n4.4 cGMP\n4.5 HACCP\n4.6 Piling of raw\nmaterials\n4.7 Production\nsequence\n4.8 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n4.9 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n4.1 OSHS\nobservation\n4.2 GMP\n4.3 Use of PPE\n4.4 Handling and\ndocumentation\nskills\n4.5 Conducting\nspecial\ndispensing of\nraw materials\n4.6 Unpacking raw\nmaterials,\nproducts and\nsupplies\n4.7 Piling raw\nmaterials\n4.8 Dispensing raw\nmaterials\n\n--- PDF PAGE 73 ---\nFood Processing NC I Promulgated January 11, 2019 69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMaterials may include but not limited to bulk and non-\nbulk ingredients including pre-mixed ingredients\n1.1 Food additives\n1.1.1 Colors\n1.1.2 Flavors\n1.1.3 Preservatives\n1.1.4 Extenders\n1.1.5 Binders\n1.1.6 Cloudifier\n1.2 Fruits and vegetables\n1.3 Livestock meat\n1.4 Poultry and poultry\n1.5 Fish and other marine\n1.6 Cereals and starches\n1.7 Sugar and sweeteners\n1.8 Fats and oils\n1.9 Processing supplies\n1.9.1 Salt\n1.9.2 Sugar\n1.9.3 Condiments\n1.9.4 Spices\n1.9.5 Herbs\n1.9.6 Sauces\n1.10 Packaging materials:\n1.10.1 Bottles\n1.10.2 Cans\n1.10.3 Cups\n1.10.4 Cup seal\n1.10.5 Label\n1.10.6 Pouches\n1.10.7 Plastic bags\n1.11 Secondary packaging materials:\n1.11.1 Cartons\n2. Measuring, dispensing\nand weighing equipment\nMeasuring, dispensing and weighing equipment may\ninclude:\n2.1 Weighing scales (equipment)\n2.2 Pipettes (tools)\n2.3 Plastic Beaker (tools) 100ml, 250ml, 500ml\n2.4 Graduated cylinders (liquid)\n2.5 Measuring cups (dry and liquid)\n2.6 Other dispensing instruments and adjuncts\n3. Pre-start checks\nPre-start checks may include but not limited to:\n3.1 Calibrating weighing scale\n3.2 Following instructions for equipment settings\n3.3 Confirming that weighing scale is cleaned and\nsanitized\n3.4 Ensuring safety guards are in place\n3.5 Ensuring that sensors and controls are correctly\npositioned\n\n--- PDF PAGE 74 ---\nFood Processing NC I Promulgated January 11, 2019 70\nVARIABLE\nRANGE\n4. Label\nLabel may include:\n4.1 Name of material\n4.2 Batch number\n4.3 Weight/Measure\n4.4 Date of preparation\n4.5 Operator/ inspector/issuer\n5. Records\nRecords may include:\n5.1 Materials used\n5.2 Equipment used\n5.3 Equipment faults, including repairs, servicing\nundertaken or recommended, preventive\nmaintenance activities\n5.4 Operational details\n5.5 Labels\n5.6 Requisition slip\n5.7 Stock card\n5.8 Order slip\n6. Industry guidelines\nIndustry guidelines may include:\n6.1 Workplace requirements/procedures\n6.2 Manufacturer’s specifications\n6.3 Food processing requirements\n6.4 Housekeeping standards\n6.5 Standard operating procedures\n6.6 OSH Rule No. 1080 – Personal Protective\nEquipment & Devices\n6.7 OSH Rule No. 1150 – Materials Handling & Storage\n6.8 RA 9003 – Ecological Solid Waste Management Act\nof 2000\n\n--- PDF PAGE 75 ---\nFood Processing NC I Promulgated January 11, 2019 71\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared and monitored materials and equipment for\ndispensing\n1.2 Dispensed materials are labelled\n1.3 Used and cleaned dispensing equipment\n1.4 Followed work procedures\n1.5 Completed required records\n1.6 Handled raw materials, products and supplies during\nloading and unloading\n1.7 Practiced OSH during loading and unloading\n2. Methods of\nAssessment\nCompetency must be assessed through:\n2.1 Direct observation with oral questioning\n2.2 Demonstration with oral questioning\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Specific work area/station\n3.2 Equipment and tools for dispensing\n3.3 Materials relevant to the proposed activity\n3.4 Relevant workplace procedures, schedules and records\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n4.2 Ability to apply competency over time and on a number of\noccasions\n\n--- PDF PAGE 76 ---\nFood Processing NC I Promulgated January 11, 2019 72\nUNIT OF COMPETENCY\n:\nPREPARE PACKAGING MATERIALS AND SUPPLIES\nFOR PROCESSING\n\nUNIT CODE\n:"
