t\n2.1.4 Chopping board\n2.1.5 Sampling borer (buriki)\n2.1.6 Forceps\n2.1.7 Thermometer\n2.1.8 Beaker\n2.1.9 Sieve or strainer\n2.1.10 Graduated cylinder\n2.1.11 Sets of standard weights\n2.1.12 Refractometer (with work instructions)\n2.1.13 pH meter (with work instructions)\n2.1.14 Containers\n2.1.14.1 Trays\n2.1.14.2 Canister\n2.2 Equipment:\n2.2.1 Stainless steel tables / Receiving table\n2.2.2 Belt conveyor and roller sorter\n3. Preparation of tools and\nequipment\nPreparation of tools, materials and equipment includes:\n3.1 Checking\n3.2 Cleaning\n3.3 Sanitizing\n3.4 Calibrating\n4. Samples\nSamples may include:\n4.1 Raw materials\n4.1.1 Condition and Certificate of Analysis (COA)\nof raw materials\n4.2 Goods Produce in process\n4.3 Finished products\n4.4 Packaging materials and supplies\n4.5 Packaged products\n5. Sample information\nSample information may include:\n5.1 Date of sampling\n5.2 Location of sampling\n5.3 Origin (source) of sample\n5.4 Amount of sample / sample size\n5.5 Quality attributes\n\n--- PDF PAGE 67 ---\nFood Processing NC I Promulgated January 11, 2019 63\nVARIABLE\nRANGE\n5.6 Other physical properties (e.g. moisture, size,\nweight) characteristics of sample\n6. Preparation of samples\nPreparation of samples includes:\n6.1 Collection\n6.2 Weighing\n6.3 Packaging\n6.4 Labeling\n6.5 Storing\n6.6 Handling\n7. Raw materials, in-process\nproducts and finished\nproducts\nRaw materials and products may include:\n7.1 Raw materials\n7.1.1 Livestock meat\n7.1.2 Poultry\n7.1.3 Fish and other marine\n7.1.4 Cereals and starches\n7.1.5 Fruits and vegetables\n7.1.6 Root crops\n7.1.7 Nuts\n7.1.8 Seeds\n7.1.9 Fats and oils\n7.1.10 Processing supplies\n7.1.11 Salt\n7.1.12 Sugar and sweeteners\n7.1.13 Condiments\n7.1.14 Spices\n7.1.15 Herbs\n7.1.16 Food additives\n7.2 In-process products (based from the process flow of\neach target product)\n7.2.1 Finished Products\n7.2.2 Livestock products\n7.2.3 Poultry products\n7.2.4 Fish and other marine products\n7.2.