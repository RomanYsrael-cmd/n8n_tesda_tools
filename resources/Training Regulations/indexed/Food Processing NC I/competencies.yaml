nts\nMay include:\n3.1 Department of Health – Food Establishments –\nCode of Sanitation of the Philippines (P.D.856)\n3.2 Requirements set out by Bureau of Food and Drugs\n3.3 Workplace requirements\n4. Workplace requirements\nMay include:\n4.1 Work instructions\n4.2 Standard operating procedures\n4.3 OH&S requirements\n4.4 Quality assurance requirements\n4.5 Equipment manufacturers’ advice\n4.6 Material Safety Data Sheets\n4.7 Codes of Practice and related advice\n5. Products\nMay include:\n5.1 Raw materials\n5.2 Packaging components and consumables\n5.3 Part-processed product\n5.4 Finished product and cleaning materials\n6. Responsibility and\nreporting systems\nMay include:\n6.1 Responsibility for applying Good Manufacturing\nPractice relates to the person’s work area\n6.2 Reporting systems may include electronic and\nmanual data recording and storage systems\n\n--- PDF PAGE 62 ---\nFood Processing NC I Promulgated January 11, 2019 58\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1 Located and followed workplace information relating to\nGMP responsibilities\n1.2 Maintained personal hygiene consistent with GMP\n1.3 Followed workplace procedures when moving around the\nworkplace and/or from one task to another to maintain\nGMP\n1.4 Used, stored and disposed of appropriate\nclothing/footwear as required by work tasks and consistent\nwith GMP\n1.5 Identified and reported situations that do or could\ncompromise GMP\n1.6 Applied appropriate control measures to control\ncontamination\n1.7 Recorded results of monitoring, and maintain records as\nrequired by GMP\n1.8 Followed validation procedures within level of responsibility\n1.9 Identified and responded to out-of-specification or\nunacceptable raw materials, packaging components, final\nor part processed product within level of responsibility\n1.10 Followed procedures to isolate or quarantine non-\nconforming product\n1.11 Handled, cleaned and stored equipment, utensils, raw\nmaterials, packaging components and related items\naccording to GMP and workplace procedures\n1.12 Maintained GMP for own work\n1.13 Handled and/or disposed of out-of-specification or\ncontaminated materials, packaging\ncomponents/consumables and product, waste and\nrecyclable material according to GMP as required by work\nresponsibilities\n1.14 Maintained the work area in a clean and tidy state\n1.15 Identified and reported signs of pest infestation\n2. Resource\nImplication\nThe following resources should be provided:\n2.1 Workplace location and access to workplace policies\n2.2 Materials relevant to the proposed activity and tasks\n3. Methods of\nAssessment\nCompetency in this unit must be assessed using at least two (2)\nof the following methods:\n3.1 A combination of direct observation and oral questioning\n3.2 Written report\n3.3 Written Test\n3.4 Portfolio\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 63 ---\nFood Processing NC I Promulgated January 11, 2019 59\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\n ASSIST IN QUALITY INSPECTION\n\nUNIT CODE\n:\n PFB751342\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to conduct preparatory activities, check raw\nmaterials, in-process products and finished products, and\nconduct post operation activities. It includes sampling\nrequirements, sample preparation and information,\npreparing, sanitizing and storing of tools and equipment,\nrecording, and waste disposal.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Conduct\npreparatory\nactivities\n1.1 Sampling\nrequirements are\nfollowed in\naccordance with the\nsampling plan.\n1.2 Tools and\nequipment are\nprepared according\nto industry\nguidelines.\n1.3 Tools and\nequipment are\ncalibrated\naccording to\nindustry\nguidelines.\n1.4 Defective tools and\nequipment are\nreported to\nimmediate\nsupervisor\naccording to\nworkplace\nprocedures.\n1.5 Preparation area is\ncleaned and\nmaintained\naccording to\nindustry\nguidelines.\n1.1 Sampling\nrequirements,\nmethods and\nrecording\n1.2 Good Laboratory\nPractices\n1.3 Uses, function\nand operation of\ntools and\nequipment\n1.4 Preparation of\ndifferent tools and\nmaterials\n1.5 Calibration of\ntools and\nequipment\n1.6 Defective tools\nand equipment\n1.7 AO 153 (cGMP)\n1.8 Halal Principles\n1.9 Food Safety Act\nof 2013\n1.10 Accomplishment\nof checklist report\n1.11 Interpretation and\nfollowing\ninstructions\n1.12 OSH Rule No.\n1060 – Premises\nof Establishments\n1.13 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.14 OSH Rule No.\n1150 – Materials\nHandling &\n1.1 Following\nsampling\nrequirements\n1.2 Recording and\nreporting skills\n1.3 Calibration skills\n1.4 Identifying\ndefective tools\nand equipment\n1.5 Cleaning and\nsanitizing skills\n\n--- PDF PAGE 64 ---\nFood Processing NC I Promulgated January 11, 2019 60\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nStorage\n1.15 RA 9275 – Clean\nWater Act of 2004\n2. Check raw\nmaterials, in-\nprocess products\nand finished\nproducts\n2.1 Raw materials,\npackaging materials\nand delivery land\nvehicle are checked\naccording to\nindustry\nguidelines.\n2.2 Samples are\nprepared according\nto sampling\nprocedures and\nsampling plan.\n2.3 Sample\ninformation is\nrecorded according\nto industry\nguidelines.\n2.4 Quality control\nchecklist is\naccomplished\nbased on workplace\nprocedure.\n2.5 Raw Materials, In-\nprocess products\nand Finished\nProducts are\nchecked according\nto industry\nguidelines and free\nfrom defects.\n2.6 Acceptable raw\nmaterials and\nproducts are\nweighed and kept in\naccordance with\nindustry\nguidelines.\n2.1 Raw materials\nand product\n2.1.1 Receiving\nand\nhandling\n2.1.2 Disposal of\ndefective\nra