        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared equipment for use\n1.2 Conducted pre-operational checks on equipment\n1.3 Operated and shut-down equipment\n1.4 Cleaned, maintained and stored tools, machine and\nequipment\n1.5 Followed work procedures\n1.6 Followed recording and reporting guidelines\n2. Methods of\nAssessment\nCompetency must be assessed through:\n2.1 Direct observation with oral questioning\n2.2 Demonstration with oral questioning\n3. Resource\nImplications\nThe following resources must be provided:\n3.1 Specific work area/station\n3.2 Equipment and tools for sampling\n3.3 Materials relevant to the proposed activity\n3.4 Relevant workplace procedures, schedules and records\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n4.2 Ability to apply competency over time and on a number of\noccasions.\n\n--- PDF PAGE 89 ---\nFood Processing NC I Promulgated January 11, 2019 85\nUNIT OF COMPETENCY\n:\nCLEAN AND SANITIZE EQUIPMENT AND\nPROCESSING/PACKAGING PREMISES\n\nUNIT CODE\n:"
        },
        "source_text": "PFB751345\n\nUNIT DESCRIPTOR\n:\nThis competency standard covers the skills, knowledge\nand attitudes required to prepare, operate and maintain\nbasic equipment. It involves pre-operational checks,\noperation of basic machine/equipment, managing waste,\nand recording and reporting of damaged equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare equipment\nfor use\n1.1 Basic machine/\nequipment is\naccessed in\naccordance with\nassignment\ninstructions and\nworkplace\nrequirements.\n1.2 Routine pre-\noperational\nchecks are carried\nout according to\nmanufacturers’\nspecifications and\nindustry\nguidelines.\n1.3 Pre-operational\nchecklist is\naccomplished and\nsubmitted\naccording to\nworkplace\nprocedures.\n1.1 Types,\ncharacteristics\nand functions of\nbasic equipment\n1.2 Equipment\noperation and\nshut-down\n1.3 Pre-operational\nchecks and\nprocedures\n1.4 Routine\nmaintenance\nprocedures\n1.5 Cleaning and\nsanitation\nprocedures for\nwork area and\nequipment\n1.6 Security and\nstorage of\nequipment and\nmaterials\n1.7 Lock out and tag\nout procedures\n1.8 Safe workplace\nprocedures\n1.9 Emergency\nprocedures\n1.10 Environmental\nand waste\ndisposal\nprocedures\n1.11 Reporting and\ndocumentation\nrequirements and\nprocesses\n1.12 Relevant\nlegislative\nprovisions\nincluding OHS\nrequirements\n1.13 Awareness of\n1.1 Operate basic\nequipment skills\n1.2 Conducting pre-\nstart checks on\nequipment\n1.3 Appling safe\nworkplace\npractices and\nprocedures\n1.4 Cleaning and\nsanitation\nprocedures for\nwork area and\nequipment\n1.5 Locating\nemergency stop\nfunctions on\nequipment\n1.6 Equipment\nshutting-down\nprocedures\n1.7 Following work\nprocedures\n1.8 Reading and\nfollowing written\ninformation\n1.9 Oral and written\ncommunication\nskills\n1.10 Working with\nothers and in\nteams\n1.11 Time\nmanagement\n1.12 Recording and\nreporting skills\n\n--- PDF PAGE 83 ---\nFood Processing NC I Promulgated January 11, 2019 79\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nCodes or\nRegulations such\nas HACCP and\nGMP\n1.14 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n1.15 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n1.16 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n1.15 Attitude:\n1.15.1 Accurate\n1.15.2 Environ-\nment-\nconscious\n1.15.3 Positive\nwork values\n1.15.4 Cost\nconscious\n1.15.5 Safety\nconscious\n1.15.6 Personal\nhygiene\n2. Operate equipment\n2.1 Suitable personal\nprotective\nequipment is used\nand maintained in\naccordance with\noccupational\nhealth and safety\n(OHS)\nrequirements,\nmanufacturers’\nspecifications and\nindustry\nguidelines.\n2.2 Machine/\nEquipment is\noperated in\naccordance with\nOHS requirements,\nmanufacturers’\nspecifications and\nindustry\n2.1 Personal\nprotective\nequipment\n2.2 Calibration and\nadjustment of\nbasic food\nprocessing\nequipment\n2.3 Equipment\noperation\n2.4 Reporting of\ndefective food\nprocessing\nequipment\n2.5 Identification of\nout of\nspecification\nproduct\n2.6 OSH Rule No.\n1070 –\nOccupational\n2.1 Wear PPE\n2.2 Calibrate and\nadjust\nequipment\n2.3 Operate basic\nfood processing\nequipment\n2.4 Prepare report\non out of\nspecification\nproduction and\ndefective\nequipment\n\n--- PDF PAGE 84 ---\nFood Processing NC I Promulgated January 11, 2019 80\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nguidelines.\n2.3 Malfunctioned\nequipment is\nreported according\nto workplace\nprocedures.\nHealth &\nEnvironmental\nControl\n2.7 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n2.8 OSH Rule No.\n1150 – Materials\nHandling &\nStorage\n2.9 OSH Rule No.\n1210 – Electrical\nSafety\n3. Maintain\nequipment and\nresources\n3.