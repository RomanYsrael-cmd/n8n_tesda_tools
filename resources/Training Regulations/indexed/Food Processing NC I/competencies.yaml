        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1 Located and followed workplace information relating to\nGMP responsibilities\n1.2 Maintained personal hygiene consistent with GMP\n1.3 Followed workplace procedures when moving around the\nworkplace and/or from one task to another to maintain\nGMP\n1.4 Used, stored and disposed of appropriate\nclothing/footwear as required by work tasks and consistent\nwith GMP\n1.5 Identified and reported situations that do or could\ncompromise GMP\n1.6 Applied appropriate control measures to control\ncontamination\n1.7 Recorded results of monitoring, and maintain records as\nrequired by GMP\n1.8 Followed validation procedures within level of responsibility\n1.9 Identified and responded to out-of-specification or\nunacceptable raw materials, packaging components, final\nor part processed product within level of responsibility\n1.10 Followed procedures to isolate or quarantine non-\nconforming product\n1.11 Handled, cleaned and stored equipment, utensils, raw\nmaterials, packaging components and related items\naccording to GMP and workplace procedures\n1.12 Maintained GMP for own work\n1.13 Handled and/or disposed of out-of-specification or\ncontaminated materials, packaging\ncomponents/consumables and product, waste and\nrecyclable material according to GMP as required by work\nresponsibilities\n1.14 Maintained the work area in a clean and tidy state\n1.15 Identified and reported signs of pest infestation\n2. Resource\nImplication\nThe following resources should be provided:\n2.1 Workplace location and access to workplace policies\n2.2 Materials relevant to the proposed activity and tasks\n3. Methods of\nAssessment\nCompetency in this unit must be assessed using at least two (2)\nof the following methods:\n3.1 A combination of direct observation and oral questioning\n3.2 Written report\n3.3 Written Test\n3.4 Portfolio\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 63 ---\nFood Processing NC I Promulgated January 11, 2019 59\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\n ASSIST IN QUALITY INSPECTION\n\nUNIT CODE\n:"
        },
        "source_text": "AGR741205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to comply with relevant Good Manufacturing\nPractice (GMP) codes through the implementation of\nworkplace GMP and quality procedures\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nrequirements of\nGMP related to\nown work\n1.1 Sources of\ninformation on GMP\nrequirements are\nlocated.\n1.2 GMP requirements\nand responsibilities\nrelated to own work\nare identified.\n1.1 GMP\nRequirements\n1.2 GMP Codes of\npractice, policies\nand procedures\n1.3 GMP Role of\ninternal and\nexternal auditors\n1.4 Contamination\nevents and\nperformance\nimprovement\nprocesses\nprocedures\n1.5 Personal clothing\nand footwear\nrequirements at\nwork areas\n1.6 Use of personal\nclothing, storage\nand disposal\nrequirements\n1.7 Micro biological,\nphysical and\nchemical\ncontaminants\n1.8 Basic concepts of\nquality assurance\n1.9 Control methods\nand procedures\nused in GMP:\n1.20 GMP\nresponsibilities\nand requirements\nrelating to work\nrole\n1.21 Basic properties,\nhandling and\nstorage\nrequirements of\nraw materials,\npackaging\n1.1 Planning and\norganizing work\n(time\nmanagement)\n1.2 Working with\nothers and in\nteams\n1.3 Practicing GMP\n1.4 Following\ncontamination\ninvestigation\nprocedures\n\n--- PDF PAGE 58 ---\nFood Processing NC I Promulgated January 11, 2019 54\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncomponents and\nfinal product\n1.22 Standards for\nmaterials,\nequipment and\nutensils used in\nthe work area\n1.23 Recall and\ntraceability\nprocedures\nrelevant to work\nrole\n1.24 Procedures for\nidentifying or\nisolating materials\nor product of\nunacceptable\nquality\n1.25 Record keeping\nand the recording\nrequirements of\nGMP\n2. Observe personal\nhygiene and\nconduct to meet\nGMP requirements\n2.1 Personal hygiene\nmeets GMP\nrequirements.\n2.2 Clothing is\nprepared, used,\nstored and\ndisposed of\naccording to GMP\nand workplace\nprocedures.\n2.3 Personal movement\naround the\nworkplace complies\nwith area entry and\nexit procedures.\n2.1 Personal hygiene\n2.2 PPE\n2.1 Practicing GMP\n\n--- PDF PAGE 59 ---\nFood Processing NC I Promulgated January 11, 2019 55\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Implement GMP\nrequirements\nwhen carrying out\nwork activities\n3.1 GMP requirements\nare identified.\n3.2 Work area,\nmaterials,\nequipment and\nproduct are\nroutinely monitored\nto ensure\ncompliance with\nGMP requirements.\n3.3 Raw materials,\npackaging\ncomponents and\nproduct are handled\naccording to GMP\nand workplace\nprocedures.\n3.4 Workplace\nprocedures to\ncontrol resource\nallocation and\nprocess are\nfollowed to meet\nGMP requirements.\n3.5 Common forms of\ncontamination are\nidentified and\nappropriate control\nmeasures are\nfollowed according\nto GMP\nrequirements.\n3.6 The workplace is\nmaintained in a\nclean and tidy order\nto meet GMP\nhousekeeping\nstandard.\n3.1 Good\nManufacturing\nPractices (GMP)\n3.2 Control resource\nallocation and\nprocesses in the\nworkplace\n3.3 Contaminants\n3.4 Maintaining\ncleanliness in the\nworkplace\n3.1 Practicing GMP\n\n--- PDF PAGE 60 ---\nFood Processing NC I Promulgated January 11, 2019 56\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Participate in\nimproving GMP\n4.1 Processes,\npractices or\nconditions which\ncould result in non-\ncompliance with\nGMP are identified\nand reported\naccording to\nworkplace reporting\nrequirements.\n4.2 Corrective action is\nimplemented within\nlevel of\nresponsibility.\n4.3 GMP issues are\nraised with\ndesignated\npersonnel.\n4.1 Non-compliance\nand corrective\naction in GMP\n4. Practicing GMP\n5. Participate in\nvalidation\nprocesses\n5.1 Validation\nprocedures are\nfollowed to GMP\nrequirements.\n5.2 Issues arising from\nvalidation are\nraised with\ndesignated\npersonnel.\n5.3 Validation\nprocedures are\ndocumented to\nmeet GMP\nrequirements.\n5.1 Validation\nprocedures in\nGMP\n5.1 Practicing GMP\n6. Complete\nworkplace\ndocumentation to\nsupport GMP\n6.1 Documentation and\nrecording\nrequirements are\nidentified.\n6.2 Information is\nrecorded according\nto workplace\nreporting\nprocedures to\nmeet GMP\nrequirements.\n6.1 Documentation\nand workplace\nreporting\nprocedures in\nGMP\n6.1 Practicing GMP\n\n--- PDF PAGE 61 ---\nFood Processing NC I Promulgated January 11, 2019 57\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH&S requirements\nMay include:\n1.1 OH&S legal requirements\n1.2 Enterprise OH&S policies, procedures and\nprograms\n2. Work\nMay include:\n2.1 Relevant regulations regarding food processing and\nfood safety regulations\n2.2 Department of Health – Food Establishments –\nCode of Sanitation of the Philippines (P.D.856)\n2.3 Environment Management Bureau regulations\nregarding emissions, waste treatment, noise and\neffluent treatment and control\n3. Hygiene and sanitation\nrequirements\nMay include:\n3.1 Department of Health – Food Establishments –\nCode of Sanitation of the Philippines (P.D.856)\n3.2 Requirements set out by Bureau of Food and Drugs\n3.3 Workplace requirements\n4. Workplace requirements\nMay include:\n4.1 Work instructions\n4.2 Standard operating procedures\n4.3 OH&S requirements\n4.4 Quality assurance requirements\n4.5 Equipment manufacturers’ advice\n4.6 Material Safety Data Sheets\n4.7 Codes of Practice and related advice\n5. Products\nMay include:\n5.1 Raw materials\n5.2 Packaging components and consumables\n5.3 Part-processed product\n5.4 Finished product and cleaning materials\n6. Responsibility and\nreporting systems\nMay include:\n6.1 Responsibility for applying Good Manufacturing\nPractice relates to the person’s work area\n6.2 Reporting systems may include electronic and\nmanual data recording and storage systems\n\n--- PDF PAGE 62 ---\nFood Processing NC I Promulgated January 11, 2019 58\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1 Located and followed workplace information relating to\nGMP responsibilities\n1.2 Maintained personal hygiene consistent with GMP\n1.3 Followed workplace procedures when moving around the\nworkplace and/or from one task to another to maintain\nGMP\n1.4 Used, stored and disposed of appropriate\nclothing/footwear as required by work tasks and consistent\nwith GMP\n1.5 Identified and reported situations that do or could\ncompromise GMP\n1.6 Applied appropriate control measures to control\ncontamination\n1.7 Recorded results of monitoring, and maintain records as\nrequired by GMP\n1.8 Followed validation procedures within level of responsibility\n1.9 Identified and responded to out-of-specification or\nunacceptable raw materials, packaging components, final\nor part processed product within level of responsibility\n1.10 Followed procedures to isolate or quarantine non-\nconforming product\n1.11 Handled, cleaned and stored equipment, utensils, raw\nmaterials, packaging components and related items\naccording to GMP and workplace procedures\n1.12 Maintained GMP for own work\n1.13 Handled and/or disposed of out-of-specification or\ncontaminated materials, packaging\ncomponents/consumables and product, waste and\nrecyclable material according to GMP as required by work\nresponsibilities\n1.14 Maintained the work area in a clean and tidy state\n1.15 Identified and reported signs of pest infestation\n2. Resource\nImplication\nThe following resources should be provided:\n2.1 Workplace location and access to workplace policies\n2.2 Materials relevant to the proposed activity and tasks\n3. Methods of\nAssessment\nCompetency in this unit must be assessed using at least two (2)\nof the following methods:\n3.1 A combination of direct observation and oral questioning\n3.2 Written report\n3.3 Written Test\n3.4 Portfolio\n4. Context of\nAssessment\n4.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 63 ---\nFood Processing NC I Promulgated January 11, 2019 59\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\n ASSIST IN QUALITY INSPECTION\n\nUNIT CODE\n:"
