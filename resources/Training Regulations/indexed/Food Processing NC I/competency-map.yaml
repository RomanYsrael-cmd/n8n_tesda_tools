  "source_text": "Section 1\nFOOD PROCESSING NC I QUALIFICATION\n\nThe Food Processing NC I Qualification consists of competencies that a person\nmust achieve to assist in quality inspection, dispense materials, prepare packaging\nmaterials and supplies for processing, operate basic equipment, clean and sanitize\nequipment and processing/packaging premises, and debone and fillet fish.\n\nThis Qualification is packaged from the competency map of the Processed Food and\nBeverage Sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n400311101\nReceive and respond to workplace communication\n400311102\nWork with others\n400311103\nSolve/address routine problems\n400311104\nEnhance self-management skills\n400311105\nSupport innovation\n400311106\nAccess and maintain information\n400311107\nFollow occupational safety and health policies and procedures\n400311108\nApply environmental work standards\n400311109\nAdopt entrepreneurial mindset in the workplace\n\nUNIT CODE\nCOMMON COMPETENCIES\nAGR741201\nApply Food Safety and Sanitation\nAGR741202\nUse Standard Measuring Devices and Instruments\nAGR741203\nUse Food Processing Tools, Equipment and Utensils\nAGR741207\nImplement Good Manufacturing Practice and Procedures\n\nUNIT CODE\nCORE COMPETENCIES\nPFB751342\nAssist in Quality Inspection\nPFB751343\nDispense Materials\nPFB751344\nPrepare Packaging Materials and Supplies for Processing\nPFB751345\nOperate Basic Equipment\nPFB751346\nClean and Sanitize Equipment and Processing/Packaging\nPremises\nPFB751347\nDebone and Fillet Fish\n\nA person who has achieved this Qualification is competent to be:\n\n Quality control aide, Laboratory aide, Production aide\n Food Processing aide\n Food Factory worker\n Food Production helper\n Fish Deboner\n\n--- PDF PAGE 6 ---\nFood Processing NC I Promulgated January 11, 2019 2"
