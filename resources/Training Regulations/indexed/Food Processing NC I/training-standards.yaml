    "source_text": "3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers to develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ngreen technology, issues on health and drugs and cater person with disabilities\n(PWD’s)\n\nCourse Title: FOOD PROCESSING\n\nNC Level: NC I\n\nNominal Training Duration:\n\n47 hrs Basic Competencies\n\n14 hrs Common Competencies\n\n136 hrs Core Competencies\nTotal\n197 hrs\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical\nskills and attitude, applicable in performing work activities involve in assisting in\nquality inspection, dispensing materials, preparing packaging materials and\nsupplies for processing, operating basic equipment, cleaning and sanitizing\nequipment and processing/packaging premises and deboning and filleting fish. This\ninclude classroom learning activities and practical work in actual work site or\nsimulation area.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieve.\n\n--- PDF PAGE 101 ---\nFood Processing NC I Promulgated January 11, 2019 97\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken\nmessages\n• Exercise Conciseness in receiving and\nclarifying messages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n1.1 Perform\nworkplace\nduties\nfollowing\nwritten notices\n• Practice Accuracy in following written/\noral instruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling written\ncommunication\n• Practice relaying/ disseminating\nmessages/ information\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n2. Work with\nothers\n2.1 Develop\neffective\nworkplace\nrelationships\n• Read job description and organizations\npolicies relevant to work role\n• Read personnel code of conduct and\ndiscipline\n• Role play on cooperation and good\nrelationship\n• Study table of organization and identify\nteam members\n• Role play on team work.\n• Role play on receiving feedback from\nsupervisor\n• Role play on providing feedback.\n• Listen to lecture on Valuing and\nexemplifying respect and empathy in\nthe workplace\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured\nactivity\n• Written Test\n2 hours\n\n--- PDF PAGE 102 ---\nFood Processing NC I Promulgated January 11, 2019 98\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.2 Contribute to\nwork\n group activities\n• Discussion on creative collaboration,\nsocial perceptiveness and problem\nsensitivity\n• Role play on creative collaboration,\nsocial perceptiveness and problem\nsensitivity.\n• Participate in a goal setting activity\n• Participate in planning and\nimplementation of a group activity.\n• Participate in evaluation of the group\nactivity\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured\nactivity\n• Written Test\n1 hour\n3. Solve/address\nroutine\nproblems\n3.1 Identify the\nproblem\n• Show mastery of the current industry\nhardware and software products and\nservices\n3.1.1.1 Show mastery of knowledge\nand understanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n3.1.1.2 Relevant equipment and\noperational processes\n3.1.1.3 Enterprise goals, targets\nand measures\n3.1.1.4 Enterprise quality OHS and\nenvironmental requirement\n3.1.1.5 Enterprise information\nsystems and data collation\n3.1.1.6 Industry codes and\nstandards\n• Use range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive\nprocessing of information)\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 hour\n\n--- PDF PAGE 103 ---\nFood Processing NC I Promulgated January 11, 2019 99\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Identify and clarify the nature of the\nproblem\n3.2 Assess\nfundamental\ncauses of\nproblem\n• Show mastery of the current industry\nhardware and software products and\nservices\n3.2.1.1 Show mastery of knowledge\nand understanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n3.2.1.2 Relevant equipment and\noperational processes\n3.2.1.3 Enterprise goals, targets\nand measures\n3.2.1.4 Enterprise quality OHS and\nenvironmental requirement\n3.2.1.5 Enterprise information\nsystems and data collation\n3.2.1.6 Industry codes and\nstandards\n• Use range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive\nprocessing of information)\n• Identify and clarify the nature of the\nproblem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 hour\n3.3 Determine\ncorrective\naction\n• Show mastery of the current industry\nhardware and software products and\nservices\n3.3.1.1 Show mastery of knowledge\nand understanding of the process,\nnormal operating parameters, and\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\n1 hour\n\n--- PDF PAGE 104 ---\nFood Processing NC I Promulgated January 11, 2019 100\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nproduct quality to recognize non-\nstandard situations\n3.3.1.2 Relevant equipment and\noperational processes\n3.3.1.3 Enterprise goals, targets\nand measures\n3.3.1.4 Enterprise quality OHS and\nenvironmental requirement\n3.3.1.5 Enterprise information\nsystems and data collation\n3.3.1.6 Industry codes and\nstandards\n• Use range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive\nprocessing of information)\n• Identify and clarify the nature of the\nproblem\ntest\n\n3.4 Communicate\naction plans\nand\nrecommendati\nons to routine\nproblems\n• Show mastery of the current industry\nhardware and software products and\nservices\n3.4.1.1 Show mastery of knowledge\nand understanding of the process,\nnormal operating parameters, and\nproduct quality to recognize non-\nstandard situations\n3.4.1.2 Relevant equipment and\noperational processes\n3.4.1.3 Enterprise goals, targets\nand measures\n3.4.1.4 Enterprise quality OHS and\nenvironmental requirement\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n--- PDF PAGE 105 ---\nFood Processing NC I Promulgated January 11, 2019 101\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.4.1.5 Enterprise information\nsystems and data collation\n3.4.1.6 Industry codes and\nstandards\n• Use range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive\nprocessing of information)\n• Identify and clarify the nature of the\nproblem\n4. Enhance Self-\nManagement\nSkills\n4.1 Set personal\nand career\ngoals\n• Define and set personal goals and\ncareer goals\n• Describe the SMART Model for goal\nsetting\n• Create personal and career goals\nusing SMART Model for goal setting\n• Explain and apply the principles of\ngoal setting according to Locke &\nLatham\n• Discussion\n• Making of\npersonal and\ncareer goals by\nstudents\n• Brainstorming\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n4.2 Recognize\nemotions\n• Identify common positive and\nnegative emotions manifested in the\nworkplace\n• Distinguish professional and non-\nprofessional behaviors in the\nworkplace\n• Recognize triggers and implications of\npositive and negative emotions in the\nworkplace\n• Respond with appropriate emotions\nand identify possible consequences of\ninappropriate emotional responses in\na social and work-related context\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n\n--- PDF PAGE 106 ---\nFood Processing NC I Promulgated January 11, 2019 102\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.3 Describe\noneself as a\nlearner\n• Review Kolb’s Theory of Learning\nStyles\n• Describe VAK Learning Style Model\n(Visual, Auditory, Kinesthetic)\n• Cite learning strategies appropriate to\nspecific tasks and describe work\npractices that assist learning\n• Identify factors and strategies that\nassist learning\n• Apply learning styles to positively\ninfluence school/work performance\n• Use appropriate learning strategies to\nimprove study habits and learning\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Simulation\n• Demonstration\nor simulation\nwith oral\