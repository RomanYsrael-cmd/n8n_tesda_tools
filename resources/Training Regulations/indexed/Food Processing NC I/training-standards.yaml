      "source_text": "3.2\nTRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their variations/components\nmay be adopted singly or in combination with other modalities when designing and\ndelivering training programs:\n\nSchool/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an approach in\ntraining designed to enhance the knowledge and skills of the trainee through\nactual experience in the workplace to acquire specific competencies as\nprescribed in the training regulations. It is imperative that the deployment of\ntrainees in the workplace is adhered to training programs agreed by the\ninstitution and enterprise and status and progress of trainees are closely\nmonitored by the training institutions to prevent opportunity for work exploitation.\n\n• Project-based instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n--- PDF PAGE 133 ---\nFood Processing NC I Promulgated January 11, 2019 129\nEnterprise-Based:\n\nEnterprise-based training may also be taken to mean a school or training center with\none or more partner enterprise or an enterprise or group of enterprises setting up a\ncommon training facility or partnering with a school or training center.\n\n• Enterprise-based Training - where training is implemented within the company in\naccordance with the requirements of the specific company.\n\n• Formal Apprenticeship – Training within employment involving a contract between\nan apprentice and an enterprise on an approved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement between\nan apprentice and a master craftsperson wherein the agreement may be written or\noral and the master craftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually between one and\nfour years, while the apprentice commits to contributing productively to the work of\nthe business. Training is integrated into the production process and apprentices\nlearn by working alongside the experienced craftsperson.\n\nCommunity-Based –refers to a short program conducted or coordinated by NGOs,\nLGUs, training centers and other TVET providers which are intended to address the\nspecific needs of a community. Such programs are usually conducted in informal settings\nsuch as barangay hall, basketball courts and other available venues in a community."
    },
