e internet or\nan intranet\n• Lecture and discussion on:\no Techniques in finding useful\ninformation\no Search engines for information\n• Find and select appropriate\ninformation\n• Perform information searching on the\ninternet using different search engines\n• Group discussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n6.3 Examine\ninformation\n• Lecture and discussion on:\no Data evaluation procedures\no Cultural aspects of information and\nmeaning\no Sources of public sector work-\nrelated information\n• Evaluation of searched information\n• Group discussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n6.4 Secure\ninformation\n• Lecture and discussion on:\no Basic file-handling techniques\no Techniques in handling, organizing\nand saving files\no Electronic and manual filing\nsystems\n• Performance of basic file-handling\ntechniques\n• Application of electronic and manual\nfiling systems\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n6.5 Manage\ninformation\n• Lecture and discussion on:\no Organizational information\nhandling and storage procedures\no Databases and data storage\nsystems\n\n• Group discussion\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 110 ---\nFood Processing NC I Promulgated January 11, 2019 106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Managing databases and data storage\nsystems\n7. Follow\nOccupational\nSafety And\nHealth Policies\nand Procedures\n7.1 Identify\nrelevant\noccupational\nsafety and\nhealth policies\nand\nprocedures\n• Discussion of Risks and Hazards\n• Risk and Hazard Identification\n• Lecture\n• Group\nDiscussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n2 hours\n7.2 Perform\nrelevant\noccupational\nsafety and\nhealth\nprocedures\n• Demonstration of proper use of\nPersonal Protective Equipment and\nMaterials Handling\n• Practice Emergency Plan\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n2 hours\n7.3 Comply with\nrelevant\noccupational\nsafety and\nhealth policies\nand standards\n• Discussion on Personal Hygiene and\nPreventive Control Measures\n• Practice 5S and waste segregation\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n4 hours\n8. Apply\nEnvironmental\nWork Standards\n8.1 Identify\nenvironmental\nwork hazards\n•\nDiscussions in\no Reduction in greenhouse gas\nemissions,\no Increase the share of renewables\nof gross final energy consumption,\no Long-term reduction of energy\nconsumption,\no Release of materials into the\nenvironment should, in the long\nrun, not exceed the adaptability of\nthe eco-system,\n\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n\n--- PDF PAGE 111 ---\nFood Processing NC I Promulgated January 11, 2019 107\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Dangers and unjustifiable risks to\nhuman health\no Energy and natural resource\nconsumption and the provision of\ntransport services\n8.2 Follow\nenvironmental\nwork\nprocedures\n•\nDiscussions Protection against\n- Human Dangers\n- Overconsumption of Resources\n- Destruction of Ecosystems\n- Habitat Destructions\n- Extinction of Wildlife\n- Pollutions\n- Water Degradation\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n Questioning\n1 hour\n8.3 Comply with\nenvironmental\nwork\nrequirements\n•\nDiscussions Environmental\nRegulations and its requirements\nrelevant to the industry and work\nactivities\n•\nDemonstration and Practice\nEnvironmental Compliance\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n Questioning\n1 hour\n9. Adopt\nEntrepreneurial\nMindset in the\nWorkplace\n9.1 Determine\nentrepre-\nneurial\nmindset\n•\nDiscussion on Entrepreneurial\nMindset\n•\nGames to develop entrepreneurial\nmind set\n• Lecture\n discussion\n• Games\n• Written Test\n• Role play\n2 hours\n9.2 Identify\nentrepre-\nneurial\npractices\n•\nCase study- quality assurance\npractices\n•\nDiscussion on cost effective\nmeasures\n•\nDiscussion on Workplace quality\nPolicy\n• Case study\n• Lecture\ndiscussion\n• Written Test\n• Case Study\n1 hour\n\n--- PDF PAGE 112 ---\nFood Processing NC I Promulgated January 11, 2019 108\nCOMMON COMPETENCIES\n14 HRS\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Apply Food\nSafety and\nSanitation\n1.1 Wear personal\nprotective\nequipment\n1.2 Observe\npersonal\nhygiene and\ngood grooming\n1.3 Implement\nfood safety\npractices\n1.4 Render safety\nmeasures and\nfirst aid\nprocedures\n1.5 Implement\nhousekeeping\nactivities\n• Knowledge, Theory, Practices\nand Systems Operations\n• Safety Practices\n• Good grooming and personal\nhygiene\n• Proper waste disposal\n• Environmental protection and\nconcerns\n• Food safety principles and\npractices\n• Housekeeping / 5’s\n• Codes and Regulations\n• Good Food Manufacturing\nPractices\n• Materials, Tools, Equipment:\nUses, Specifications and\nMaintenance\n• Parts and functions of\npersonal protective\nequipment\n• First Aid Kit\n• Sanitizing equipment\n• Lecture\n• Group\nDiscussion\n• Role Play\n• Self-paced\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4 hours\n2. Use Standard\nMeasuring\nDevices /\nInstruments\n2.1 Identify\nstandard\nmeasuring\ndevices and\ninstruments\n2.2 Review the\nprocedures in\nusing\n• Knowledge, Theory, Practices\nand Systems Operations\n• Safe handling of measuring\ndevices and instruments\n• Specifications and functions\nof measuring devices and\ninstruments\n\n• Lecture\n• Group\nDiscussion\n• Role Play\n• Self-paced\n• Demonstration\n• Observation\n• Interviews /\n questioning\n4 hours\n\n--- PDF PAGE 113 ---\nFood Processing NC I Promulgated January 11, 2019 109\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nstandard\nmeasuring\ndevices and\ninstruments.\n2.3 Follow\nprocedures in\nusing\nmeasuring\ndevices and\ninstruments\n• Defects and breakages of\nmeasuring devices and\ninstruments\n• Procedures in sanitizing and\ncalibrating and stowing\nequipment and instruments\n3. Use Food\nProcessing\nTools,\nEquipment and\nUtensils\n3.1 Perform pre-\noperation\nactivities\n3.2 Operate food\nprocessing\nequipment\n3.3 Perform post-\noperation\nactivities\n• Communication\n• Written and oral\ncommunication\n• Interpreting manufacturer’s\nspecifications\n• Following manufacturer’s\nmanual\n• Materials, Tools and\nEquipment: uses,\nSpecifications and\nMaintenance\n• Sanitizing agents: Uses and\nSpecification\n• Proper cleaning and stowing\nof tools and equipment/\ninstruments\n• Equipment/ machine wear\nand tear process\n• Minor preventive maintenance\n\n• Lecture\n• Group\nDiscussion\n• Role Play\n• Self-paced\n• Demonstration\n• Observation\n• Interviews /\n questioning\n4 hours\n\n--- PDF PAGE 114 ---\nFood Processing NC I Promulgated January 11, 2019 110\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Implement\nGood\nManufacturing\nPractice\nProcedure\n4.1 Identify\nrequirements\nof GMP\nrelated to own\nwork\n4.2 Observe\npersonal\nhygiene and\nconduct to\nmeet GMP\nrequirements\n4.3 Implement\nGMP\nrequirements\nwhen carrying\nout work\