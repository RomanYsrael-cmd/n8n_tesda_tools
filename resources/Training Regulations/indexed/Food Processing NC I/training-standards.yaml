  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for FOOD PROCESSING NC I.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers to develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ngreen technology, issues on health and drugs and cater person with disabilities\n(PWD’s)\n\nCourse Title: FOOD PROCESSING\n\nNC Level: NC I\n\nNominal Training Duration:\n\n47 hrs Basic Competencies\n\n14 hrs Common Competencies\n\n136 hrs Core Competencies\nTotal\n197 hrs\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical\nskills and attitude, applicable in performing work activities involve in assisting in\nquality inspection, dispensing materials, preparing packaging materials and\nsupplies for processing, operating basic equipment, cleaning and sanitizing\nequipment and processing/packaging premises and deboning and filleting fish. This\ninclude classroom learning activities and practical work in actual work site or\nsimulation area.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieve.\n\n--- PDF PAGE 101 ---\nFood Processing NC I Promulgated January 11, 2019 97\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken\nmessages\n• Exercise Conciseness in receiving and\nclarifying messages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n1.1 Perform\nworkplace\nduties\nfollowing\nwritten notices\n• Practice Accuracy in following written/\noral instruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling written\ncommunication\n• Practice relaying/ disseminating\nmessages/ information\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n2. Work with\nothers\n2.1 Develop\neffective\nworkplace\nrelationships\n• Read job description and organizations\npolicies relevant to work role\n• Read personnel code of conduct and\ndiscipline\n• Role play on cooperation and good\nrelationship\n• Study table of organization and identify\nteam members\n• Role play on team work.\n• Role play on receiving feedback from\nsupervisor\n• Role play on providing feedback.\n• Listen to lecture on Valuing and\nexemplifying respect and empathy in\nthe workplace\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured\nactivity\n• Written Test\n2 hours\n\n--- PDF PAGE 102 ---\nFood Processing NC I Promulgated January 11, 2019 98\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.2 Contribute to\nwork\n group activities\n• Discussion on creative collaboration,\nsocial perceptiveness and problem\nsensitivity\n• Role play on creative collaboration,\nsocial perceptiveness an