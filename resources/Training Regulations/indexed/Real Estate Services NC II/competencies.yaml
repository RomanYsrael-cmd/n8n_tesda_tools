        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated product knowledge and sales process\n(prospecting, presentation, site orientation)\n1.1. Demonstrated knowledge and skills in identifying\nnecessary/appropriate sales and marketing tools\n1.2. Applied legal laws and regulations and\ndocumentation procedures\n1.3. Identified needed requirements as required by the\ndeveloper and financing institutions\n1.4. Used appropriate software applications and tools\nand equipment\n1.5. Applied the appropriate financing terms, provisions\nand conditions\n2. Resource Implications\n\nThe following resources must be provided:\n2.1\nWorkplace location\n2.2\nMaterials, supplies, tools and equipment relevant to\nthe unit of competency\n2.3\nTechnical plans, drawings and specifications\nrelevant to the activities\n2.4\nInternet\n3. Methods of Assessment\n\nCompetency in this unit must be assessed through:\n3.1. Written test\n3.2. Direct observation and oral questioning\n4. Context of Assessment\n\n4.1\nCompetency may be assessed actual workplace or\nat designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 87 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 83\n\nUNIT OF COMPETENCY:\nPERFORM SALES DOCUMENTATION FUNCTION\nUNIT CODE :"
