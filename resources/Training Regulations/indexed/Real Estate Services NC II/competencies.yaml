ant national and local government regulations \nrelating to: \n2.1.1 anti-discrimination and equal employment \nopportunity \n2.1.2 consumer protection \n2.1.3 environmental issues \n2.1.4 franchises and business structure \n2.1.5 OHS \n2.1.6 Privacy property management. \n3. Types of tenancies  \nMay include: \n3.1 residential lease \n3.2 commercial lease \n3.3 industrial lease \n3.4 agricultural lease \n3.5 institutional or recreational lease \n4. Effective communication \nstrategies   \nMay include: \n4.1 active listening \n4.2 being non-judgmental \n4.3 exploring problems \n4.4 expressing an individual perspective \n4.5 providing sufficient time for questions and responses \n4.6 providing summarizing and reflective responses in \nconflict situations \n4.7 using appropriate words, behavior and posture\n\n--- PDF PAGE 69 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 65 \nVARIABLE \nRANGE \n4.8 using clarifying and summarizing questions \n4.9 using clear and concise language \n4.10 using culturally appropriate communication \n4.11 using plain English \n4.12 using verbal and non-verbal communication. \n5. Listings   \nMay include:  \n5.1 acquisition of the rent roll \n5.2 advertising \n5.3 builders and property developers \n5.4 callers to the office \n5.5 promoting investment property \nrecommendations service \n6. Authority documents   \nMay include:  \n6.1 exclusive leasing or managing authority \n6.2 general leasing or managing authority \n6.3 sole agency leasing or managing authority. \n7. Property leasing process   May include: \n7.1 assigning or subletting premises \n7.2 bonds \n7.3 entry by the landlord or agent \n7.4 guarantees \n7.5 looking after the premises \n7.6 property insurance \n7.7 rents \n7.8 repairs \n7.9 running expenses \n8. Statutory and agency \nleasing documents   \nMay include: \n8.1 bond claim form \n8.2 bond lodgment form \n8.3 bond transfer form \n8.4 condition report \n8.5 notice of