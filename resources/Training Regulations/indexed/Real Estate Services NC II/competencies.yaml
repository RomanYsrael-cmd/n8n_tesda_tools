        "source_text": "SOC333206\n\nUNIT DESCRIPTOR : This unit involves the skills and knowledge required to meet\nthe core legal and ethical requirements associated with\nproperty management. This includes awareness of the\nlegislation dealing with the leasing and management of\nproperty, the role and responsibility of agency personnel in\nproperty management, the recording of property management\ntransactions and the completion of property management\ndocumentation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Apply\nknowledge of\nproperty\nmanagement\n\n1.1 Purpose of property\nmanagement and\nrelationship with asset\nmanagement are\nidentified in line with\nagency practice.\n1.2 Roles and responsibilities\nof government\nagencies regulating the\nlease and management\nof property are identified\nin relation to agency\npractice.\n1.3 Legislation regulating the\nlease and management\nof properties is identified\nin the context of agency\npractice.\n1.4 Types of tenancies are\nidentified in line with\nlegislation.\n1.5 Principles of property\nmanagement are\nidentified in the context of\nlegislative requirements\nand agency practice.\n1.6 Ethical and conduct\nstandards and key\nprinciples of consumer\nprotection, equal\nemployment opportunity\n1.1 Contract law in the\nreal estate industry,\nincluding agent\nliability for breach of\ncontract and\nnegligence\n1.2 Ethical and conduct\nstandards relevant\nto licensed real\nestate agents and\nreal estate\nrepresentatives\n1.3 Key principles of\nconsumer\nprotection, equal\nemployment\nopportunity and\nprivacy legislation\n1.4 Key register\nprocess of leasing\nand managing\nproperty, including\nprospecting,\nobtaining listings,\ngaining authorities\nto lease and\nmanage property,\nadvertising,\n1.5 Managing tenancy\napplications and\n1.1 Ability to\ncommunicate with\nand relate to a\nrange of people\nfrom diverse\nsocial, economic\nand cultural\nbackgrounds and\nwith varying\nphysical and\nmental abilities\n1.2 Analytical skills to\ninterpret\ndocuments such\nas legislation,\nregulations,\nleases and\nauthority forms\n1.3 Computing skills\nto access agency\nand resource\ndatabases, use\nstandard software\npackages, send\nand receive\nemails, access\nthe internet and\nweb pages, and\ncomplete and\nlodge standard\n\n--- PDF PAGE 60 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 56\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nand privacy legislation in\nrelation to property\nmanagement are\nidentified in the context of\nlegislative requirements\nand agency practice.\nagreements,\n1.6 Preparing property\ncondition reports,\nconducting\ninspections,\n1.7 Handling\nterminations and\nvacations and\nmaintaining\nproperty\n1.8 Relevant legislation\nand local\ngovernment\nregulations relating\nto:\n1.9 Anti-discrimination\nand equal\nemployment\nopportunity\n1.10 Consumer\nprotection\nenvironmental\nissues\n1.11 Relevant\nOccupational\nSafety and Health\nand environmental\nprocedures and\nregulations\n1.12 Privacy property\nmanagement\n1.13 Standard trade\npractices\n1.14 Risks and risk\nmanagement\nstrategies\n1.15 Roles and\nresponsibilities of\ngovernment\nagencies regulating\nthe rent/ lease and\nmanagement of\nproperty\n1.16 Types of tenancies\ndocuments online\n1.4 Decision making\nand problem\nsolving skills to\nanalyze situations\nand make\ndecisions\nassociated with\nthe leasing and\nmanagement of\nproperty\n1.5 Literacy skills to\naccess and\ninterpret a variety\nof texts, including\nleases;\n1.6 Prepare general\ninformation and\npapers;\n1.7 Prepare formal\nand informal\nletters, reports\nand applications;\nand complete\nprescribed forms\n1.8 Negotiation and\nconflict resolution\nskills to resolve\ndisputes with\ntenants and\nlandlords\n1.9 Numeracy skills\nto calculate and\ninterpret