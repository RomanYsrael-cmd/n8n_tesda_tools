        "source_text": "--- PDF PAGE 87 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 83 \n \nUNIT OF COMPETENCY: \nPERFORM SALES DOCUMENTATION FUNCTION  \nUNIT CODE                     : \nSOC333302 \nUNIT DESCRIPTOR        : This unit involves the knowledge, skills and attitude required to \nmarket and document the transactions.  \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variable \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Organize data \nsourced from \nprospecting \nactivity \n \n1.1 \nClient’s data/ \ninformation are \nrecorded following \nclient’s information \nsheet. \n1.2 \nData is analyzed \nand presented to \nBroker for \nevaluation. \n1.3 \nData is filed \naccording to \nestablished \nprocedure. \n1.1 \nVerbal \n1.2 \nWritten \n1.3 \nOffice protocols \n1.4 \nForms \n1.5 \nProject Selling \n1.6 \nBuyers Information \nSheets Client’s \n1.7 \nReservation \nagreement \n1.8 \nProspect appointment \nslip \n1.9 \nBrokerage \n1.10 Contract of agency \n1.11 Code of Ethics \n1.12 Personality \nDevelopment \n1.13 Waste Management \n1.14 Occupational Health \nand Safety Policies \nand Guidelines \n1.15 Basic Real Estate \nMathematics \nHARDWARE \n1.16 Use of Personal \ncomputer \n1.17 Laptop \n1.18 Use of Mobile \n1.19 Use of Calculator \nSOFTWARE \n1.20 Use of mobile \napplication tools \n1.21 Use of application \nsoftware \n1.22 Graphic application \n1.1 Customer service \n1.2 Writing skills \n1.3 Business writing \n1.4 Filing \n \n2. Sort the \nprospects in \naccordance \n2.1 \nData is arranged \naccording to \nlocation / client’s \n2.1 Verbal \n2.2 Written \n2.3 Office protocols \n2.1 Customer service \n2.2 Writing skills \n2.3 Business writing\n\n--- PDF PAGE 88 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 84 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variable \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nwith client’s \nneeds and \nfinancial \ncapability \n \nrequirements. \n2.2 \nArrange according \nto brokers priority/ \nevaluation.  \n2.3 \nSchedule of tripping \nis planned \naccording to the \navailability of client \nand site. \n2.4 \nSchedule with client \nis arranged and \ncoordinated \nfollowing \nestablished \nguidelines. \n2.5 \nFeedback result is \ngathered for \ndocumentation. \n2.6 \nClient/prospect \nappointment slip is \nchecked as per \nBroker’s monitoring \nactivities. \n2.4 Forms \n2.5 Tripping vehicle request \n2.6 Price list \n2.7 Inventory \n2.8 Flyers \n2.9 Subdivision Map \n2.10 Lot Plan \n2.11 Vicinity Map \n2.12 Code of Ethics \n2.13 Personality \nDevelopment \n2.14 Waste Management \n2.15 Occupational Health \nand Safety Policies \nand Guidelines \n2.16 Basic Real Estate \nMathematics \nHARDWARE \n2.17 Use of Personal \ncomputer \n2.18 Laptop \n2.19 Use of Mobile \n2.20 Use of Calculator \nSOFTWARE \n2.21 Use of mobile \napplication  tools \n2.22 Use of application \nsoftware \n2.23 Graphic application \n2.4 Filing \n \n3. Booked Sale \ndocumentation \n \n3.1 Requirements are \nmet in accordance \nwith established \nprocedures \n3.2 Required \ndocuments are \nfamiliarized in \naccordance to \nmode of payment \nand established \nstandards \n3.1.1 Cash \n3.1.2 Installment \n3.3 Legal laws and \nregulations are \nfamiliarized \n3.4 Documentation \n3.1 Verbal \n3.2 Written \n3.3 Office protocols \n3.4 Documents \n3.4.1 Contract to sell - if \ninstallment \n3.4.2 Contract of Sale \n(DOAS) – if cash basis \n3.4.3 Deed of Restrictions \n3.4.4 Payment Details \n3.5 Code of Ethics \n3.6 Basic Real Estate \nMathematics \n3.7 Global Positioning \nSystem (GPS) \n3.8 Satellite Imaging \n3.9 Zoning \n3.1 Customer service \n3.2 Writing skills \n3.3 Business writing \n3.4 Filing\n\n--- PDF PAGE 89 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 85 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variable \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nand procedures \nare familiarized in \naccordance with \nestablished \nstandard operating \nprocedures (SOP) \n3.5 Geographic location \nprinciple related to \nreal estate is \nfamiliarized in \naccordance to \nstandard operating \nprocedures(SOP) \nHARDWARE \n3.10 Use of Personal \ncomputer \n3.11 Use of Mobile \n3.12 Use of Calculator \nSOFTWARE \n3.13 Use of mobile \napplication  tools \n3.14 Use of application \nsoftware \n3.15 Graphic application \n4. Assist buyer \nregarding \nchosen \nfinancing \noptions \n \n4.1 \nChecklist of \nrequirements is \ncollected in \naccordance with \nestablished \nstandard \n4.2 \nBuyers capacity to \npurchase the \nproperty is \nestablished in \naccordance with \nestablished \nstandard and \naccording to \nfinancial \ncapability. \n4.3 \nBuyers capability  \nto pay is evaluated \nin accordance with \nstandard operating \nprocedures \n4.4 \nSigned \nRequirements for \nsubmission to \nfinancial institutions \nare assisted in \naccordance with \nestablished \nprocedures \n4.5 \nSigned documents \nare collected with \nthe attached \nrequirements as per \nestablished \nprocedure. \n4.1 Verbal \n4.2 Written \n4.3 Office protocols \n4.4 Documents \n4.5 Financing Options \n4.6 In-house \n4.7 bank \n4.8 Basic Real Estate \nMathematics \nHARDWARE \n4.9 Use of Personal \ncomputer \n4.10 Use of Mobile \n4.11 Use of Calculator \nSOFTWARE \n4.12 Use of mobile \napplication  tools \n4.13 Use of application \nsoftware \n4.1 Customer service \n4.2 Writing skills \n4.3 Business writing \n4.4 Filing \n4.5 Persistence in \nfollowing up\n\n--- PDF PAGE 90 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 86 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variable \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n5. Collect loan \nrequirements \n \n5.3 Borrower’s \nrequirement are \ncoordinated in \naccordance with \nestablished \nstandard \n5.4 Borrowers \nrequirements is \ncollected in \naccordance with \nfinancing \ninstitutions \nestablished \nstandard \n5.5 Requirements \ncollected are \nevaluated for \ncompleteness in \naccordance with to \nchecklist \nrequirements \n5.6 Requirements \ncollected are \nsubmitted \naccording to \nestablished \nstandards. \n \n5.1 Verbal \n5.2 Office protocols \n5.3 Documents \n5.4 Financing Options \na. \nIn-house \nb. \nbank \n5.5 Personality \nDevelopment \n5.6 Basic Real Estate \nMathematics \nHARDWARE \n5.7 Use of Personal \ncomputer \n5.8 Laptop \n5.9 Use of Mobile \n5.10 Use of Calculator \nSOFTWARE \n5.11 Use of mobile \napplication  tools \n5.12 Use of application \nsoftware \n5.13 Graphic application \n5.1 Customer service \n5.2 Filing\n\n--- PDF PAGE 91 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 87 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1. \nName \n1.2. \nAddress \n1.3. \nContact details  \n1.4. \nE-mail address \n1.5. \nCompany/business address \n1.6. \nOthers  \n2. Requirements \nMay include: \n2.1. TIN \n2.2. Photocopy of any three(3) of the following \n2.2.1. Government issued IDs \n2.2.2. Company ID \n2.2.3. NSO-issued Birth certificate \n2.2.4. NSO-issued Marriage contract (if \nmarried) \n2.2.5. NSO-issued Certificate of No Marriage (if \nsingle) \n2.2.6. Valid Community Tax Certificate \n2.3. Bank’s letter of guaranty \n2.4. Certification of Loan Approval (Pag-Ibig member) \n3. Required Documents \nMay include: \n3.1. Cash \n3.1.1. Deed of Absolute Sale \n3.1.2. Certificate of Title \n3.1.3. Tax Declaration \n3.1.4. Acknowledgement Receipt of full \npayment \n3.1.5. Tax Clearance on Real Property \n3.1.6. Cancellation of Mortgage (if applicable)  \n3.2. Installment \n3.2.1. Contract to Sell (signed by buyer and \ndeveloper) \n3.2.2. Deed of Absolute Sale (if with issued \nLetter of Guarantee) \n3.2.3. Transfer of Title to Borrower \n3.2.4. Promissory Note \n4. Laws and Regulations \nMay include: \n4.1 RESA Law – RA 9646 \n4.2 MACEDA Law –  Buyers protection\n\n--- PDF PAGE 92 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 88 \nVARIABLE \nRANGE \n4.3 PD 957 – Subdivision and Condominium Buyers \nProtective Decree \n4.4 RA 4726 – Condominium Act \n4.5 BP 220 – Socialized Housing \n4.6 Magna Carta for Homeowners \n4.7 Taxation Law \n5. Documentation and \nProcedures \nMay include: \n5.7 Business Forms \n1.7.1 Buyers information sheet \n1.7.2 Prospect appointment slip \n5.8 Reservation Agreement \n5.9 Booking Checklists \n5.10 Contract to Sell \n5.11 Deed of Absolute Sale \n6. Financial Capability \nMay include: \n6.1. \nTerms of payment \n6.1.1. Cash \n6.1.2. Installment \n6.1.2.1. \nBank financed \n6.1.2.2. \nIn-house financed \n6.1.2.3. \nGovernment financed (HDMF or \nNHMFC) \n7. Signed Requirements \nMay include: \n7.1. ITR \n7.2. TIN \n7.3. If Employed \n7.3.1. Government issued IDs \n7.3.2. Valid Community Tax Certificate \n7.3.3. Certificate of Employment \n7.3.4. At least 3 months copy of pay slip \n7.4. Business Registration (Businessman) \n7.4.1. DTI / SEC \n7.4.2. Mayor’s Permit and \n7.4.3. Other Licenses \n7.4.4. BIR registration \n7.4.5. Valid Gov’t IDs\n\n--- PDF PAGE 93 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 89 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDemonstrated knowledge and skills in data \nmanagement and documentation \n1.2. \nDemonstrated knowledge and skills in coordinating \nand scheduling of tripping/viewing \n1.3. \nDemonstrated knowledge and skills in legal laws \nand regulations \n1.4. \nUsed software applications, tools and equipment \n1.5. \nApplied the appropriate financing terms, provisions \nand conditions \n \n2. Resource Implications \nThe following resources must be provided: \n2.1 \nWorkplace location \n2.2 \nMaterials, supplies, tools and equipment relevant to \nthe unit of competency \n2.3 \nTechnical plans, drawings and specifications \nrelevant to the activities \n2.4 \nInternet and application software \n \n3. Methods of Assessment \nCompetency in this unit must be assessed through: \n3.1 \nDirect Observation \n3.2 \nOral interview and written test \n4. Context of Assessment \n4.1 \nCompetency maybe assessed in actual workplace or \nat the designated TESDA Assessment Center\n",
