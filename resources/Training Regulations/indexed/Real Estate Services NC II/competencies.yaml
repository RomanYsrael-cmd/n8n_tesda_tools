        "source_text": "SOC333203\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to follow security\nand safety procedures in the workplace. It includes checking and\nmaintaining the security of any files/documents.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Maintain\nsafety and\nsecurity of\ndata\n\n1.1 Documents are secured\nwithin specified\nlocations, , in\naccordance with\nworkplace and\napplicable safety and\nsecurity regulations\n1.2 Seals, tamper proof\npackaging, locks and\nother security\nmeasures on\ndocuments are checked\nand maintained in\naccordance with\nworkplace safety and\nsecurity procedures\n1.3 Signs of pilferage , theft\nand interference are\nrecognized and reported\nin accordance with\nworkplace safety and\nsecurity procedures\n1.4 Signs of suspicious and\nunscrupulous\ndocuments are\nrecognized and reported\npromptly to designated\npersonnel\n1.5 Any breaches of security\nrequirements are\nreported promptly to\ndesignated personnel in\naccordance with\nworkplace safety and\nsecurity procedures\n1.1 Relevant\nworkplace security\nprogram and\npolicies and\nprocedures for\nresponding to\nsecurity threats,\nsituations and\nemergencies\n1.2 Relevant\nquarantine and\nbond regulations\nand requirements\n1.3 Relevant OH&S\nand environmental\nprotection\nprocedures and\nguidelines\n1.4 Common security\nthreats and\nincidents that may\noccur in the\nworkplace and\nrelated roles and\nresponsibilities of\npersonnel when\nreporting them and\nresponding to\nthem\n\n1.1 Communicating\neffectively with\nconcerned party\nwhen following\nsecurity procedures\n1.2 Reading and\ninterpreting\ninstructions,\nprocedures,\napplicable regulatory\nrequirements, labels,\nmarkings, ID cards\nand other\ninformation relevant\nto workplace safety\nand security\n1.3 Completing required\ndocumentation and\nreports related to\nsafety and security\nprocedures\