        "source_text": "--- PDF PAGE 26 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 22 \nUNIT OF COMPETENCY :    PRESENT RELEVANT INFORMATION  \n \n      UNIT CODE \n               :    400311215 \n \nUNIT DESCRIPTOR     :     This unit of covers the knowledge, skills and attitudes   \n \n \n \nrequired to present data/information appropriately. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Gather \ndata/ \ninformation \n1.1 Evidence, facts \nand information \nare collected \n1.2 Evaluation, terms \nof reference and \nconditions are \nreviewed to \ndetermine \nwhether \ndata/information \nfalls within \nproject scope \n \n1.1 Organisational \nprotocols  \n1.2 Confidentiality \n1.3 Accuracy \n1.4 Business \nmathematics and \nstatistics \n1.5 Data analysis \ntechniques/proced\nures \n1.6 Reporting \nrequirements to a \nrange of audiences \n1.7 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n1.8 Organisational \nvalues, ethics and \ncodes of conduct \n \n1.1 Describing \norganisational \nprotocols relating \nto client liaison \n1.2 Protecting \nconfidentiality \n1.3 Describing \naccuracy \n1.4 Computing \nbusiness \nmathematics and \nstatistics \n1.5 Describing data \nanalysis \ntechniques/ \nprocedures \n1.6 Reporting \nrequirements to a \nrange of audiences \n1.7 Stating legislation, \npolicy and \nprocedures relating \nto the conduct of \nevaluations \n1.8 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n2. Assess \ngathered \ndata/ \ninformation \n2.1 Validity of data/ \ninformation is \nassessed \n2.2 Analysis \ntechniques are \napplied to assess \ndata/ information. \n2.3 Trends and \nanomalies are \nidentified \n2.4 Data analysis \ntechniques and \n2.1 Business \nmathematics and \nstatistics \n2.2 Data analysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \nrelating to the \n2.1 Computing \nbusiness \nmathematics and \nstatistics \n2.2 Describing data \nanalysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of \naudiences\n\n--- PDF PAGE 27 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 23 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \nprocedures are \ndocumented \n2.5 Recommendation\ns are made on \nareas of possible \nimprovement. \n \n \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \n2.4 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n2.5 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n3. Record and \npresent \ninformation  \n3.1 Studied \ndata/information \nare recorded. \n3.2 Recommendation\ns are analysed for \naction to ensure \nthey are \ncompatible with \nthe project’s \nscope and terms \nof reference. \n3.3 Interim and final \nreports are \nanalysed and \noutcomes are \ncompared to the \ncriteria \nestablished at the \noutset. \n3.4 Findings are \npresented to \nstakeholders. \n \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n \n3.1 Describing data \nanalysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of \naudiences \n3.3 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4 Stating \norganisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 28 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 24 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Data analysis \ntechniques \nMay include but not limited to: \n1.1. Domain analysis \n1.2. Content analysis \n1.3. Comparison technique \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determine data / information \n1.2 Studied and applied gathered data/information \n1.3 Recorded and studied data/information \n \nThese aspects may be best assessed using a range of \nscenarios what ifs as a stimulus with a walk- through \nforming part of the response. These assessment activities \nshould include a range of problems, including new, unusual \nand improbable situations that may have happened. \n2. Resource \nImplications \nSpecific resources for assessment \n2.1. Evidence of competent performance should be \nobtained by observing an individual in an information \nmanagement role within the workplace or operational \nor simulated environment. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Written Test \n3.2. Interview \n3.3. Portfolio   \n \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other \nrelevant units of competency. Assessment will occur over a \nrange of situations, which will include disruptions to normal, \nsmooth operation. Simulation may be required to allow for \ntimely assessment of parts of this unit of competency. \nSimulation should be based on the actual workplace and \nwill include walk through of the relevant competency \ncomponents.  \n4. Context for \nAssessment \n4.1. In all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.\n",
