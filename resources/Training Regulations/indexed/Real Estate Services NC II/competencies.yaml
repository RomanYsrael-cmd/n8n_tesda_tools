n--- PDF PAGE 50 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 46\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nsituation\naccordance with\nworkplace security\nprocedures, received\ninstructions, regulatory\nrequirements and\nemergency response\nplan.\n3.2 Security threats or\nincidents are handled\nappropriately in\naccordance with\nestablished response\nplan and within limits of\nresponsibility using\navailable\ncommunications in the\nwork area.\noperations in the\nworkplace and\naction that can be\ntaken to address\nand resolve the\nproblems\n3.2 Relevant\ndocumentation\nand reporting\nrequirements\n\nprocedures\n3.2 Working\ncollaboratively with\nothers when\nfollowing safety and\nsecurity procedures\n3.3 Modifying activities\ndepending on\ndiffering workplace\ncontexts risk\nsituations and\nenvironments\n3.4 Applying procedures\nfor safety and\nsecurity checks and\nprecautions as per\nlimits of role and\nresponsibilities\n3.5 Promptly reporting\nand/or rectifying any\nidentified problems\nthat may arise when\nfollowing safety and\nsecurity procedures\nin accordance with\nregulatory\nrequirements and\nworkplace\nprocedures\n\n--- PDF PAGE 51 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Security Measures\nMay include:\n1.1\nSecurity guards at access points and gates to secured\nareas\n1.2\nLocked doors, gates and fences\n1.3\nUsed of personal electronic access cards\n1.4\nRecording of carrier and vehicle registration details at\ngates and checkpoints\n1.5\nBag check points\n1.6\nEscorted visitors in restricted areas\n1.7\nAccessed control into and out of restricted security areas\n1.8\nUsed of ID cards\n1.9\nVideo surveillance equipment\n1.10 X-ray screening of baggage, cargo and goods\n1.11 Explosives traced detection (ETD) screening of\npassengers, baggage, cargo and goods\n1.12 Screened passengers using hand-held and walk through\nmagnetometers\n2. Workplace safety and\nsecurity procedures\nMay include:\n2.1\nEstablished safety and security procedures\n2.2\nStandard operating procedures\n2.3\nCompany procedures\n2.4\nEnterprise procedures\n2.5\nOrganizational procedures\n3. Communications\nMay include:\n3.1\nPhone\n3.2\nRadio\n3.3\nFax\n3.4\nEmail\n3.5\nElectronic data transfer (EDI)\n3.6\nInternet\n3.7\nOral, visual or signed communications\n\n--- PDF PAGE 52 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 48\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Secured\ndocuments\nin\naccordance\nwith\napplicable\nworkplace safety seals, tamper proof packaging, locks and\nother security measures on data and business in\naccordance with workplace security procedures and\nsecurity procedures Checked and maintained\n1.2 Identified and assessed safety and security threat or\nsituation in accordance with the workplace safety and\nsecurity program and procedures\n1.3 Responded to an identified safety and security threat or\nsituation in accordance with workplace security procedures,\nreceived\ninstructions,\nregulatory\nrequirements\nand\nemergency response plan\n1.4 Handled appropriately any safety and security threats or\nincidents in accordance with established response plan and\nwithin limits of responsibility\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written test\n3.2 Demonstration and practical application\n3.3 Interview\n4. Context of Assessment 4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 53 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 49\n\nUNIT OF COMPETENCY:\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE :"
