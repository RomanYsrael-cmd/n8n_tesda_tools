          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 communicated effectively and accurately with clients\n1.2 accurately completed statutory and agency residential\ntenancy documentation, including authority, leasing and\ntermination documents\n1.3 Applied ethical and conduct standards and key\nprinciples of consumer protection, equal employment\nopportunity and privacy in relation to the leasing and\nmanagement of property\n1.4 Applied the process of leasing and managing property\n1.5 Applied legislation and the regulatory framework\nrelevant to the leasing and management of property\n1.6 Applied the role, rights and responsibilities of the agent\nand tenant using and maintaining a key register.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant\nto the activities\n3. Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 72 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 68\n\nUNIT OF COMPETENCY:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE :"
