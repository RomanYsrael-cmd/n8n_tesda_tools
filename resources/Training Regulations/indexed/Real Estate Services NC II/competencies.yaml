        "source_text": "--- PDF PAGE 94 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 90 \n \nUNIT OF COMPETENCY: \nPERFORM LOAN PROCESSING FUNCTION  \n \nUNIT CODE                     : \nSOC333303 \n \nUNIT DESCRIPTOR        : \nThis unit involves the knowledge, skills and attitude required to \nIllustrate the loan processing with financing institutions and the \ngoverning laws involved. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Coordinate \nwith broker \nand borrower \nregarding \nfinancing \noptions \n \n \n \n \n \n \n \n \n \n \n1.1 Borrower is advised on \nfinancing options \n \n1.2 Documents for \nsubmission is facilitated \naccording to the brokers \nadvise  \n \n1.3 Documents submitted are \nevaluated in accordance \nwith pre qualification \nrequirements/ checklists \nprovided by the financing \ninstitutions and evaluation \nprocedures \n \n1.1 Verbal \n1.2 Office protocols \n1.3 Personality \nDevelopment \n1.4 Documents and \nprocedures \n1.4.1 \nFinancing \nRequirements \n1.4.2 \nBusiness Forms \n–  \nHARDWARE \n1.5 Use of Personal \ncomputer \n1.6 Laptop \n1.7 Use of Mobile \n1.8 Use of Calculator \n1.1 Customer \nservice \n1.2 Oral and \nwritten skills \n1.3 Filing \n1.4 Coordination \nSkills \n \n \n \n \n \n \n \n \n \n \n2. Submit loan \napplication to  \nfinancing \ninstitutions \n2.1 Loan application \nrequirements is \nsubmitted in accordance \nwith the checklist \n2.2 Notice of loan approval is \nsecured from financing \ninstitution \n2.3 Loan documents is \ncoordinated with the \nborrower for signing  \n2.4 Letter of guarantee is \ncoordinated with financing \ninstitutions before signing \nof Deed of Absolute Sale \n2.5 Documents for processing \nis coordinated with \nappropriate  government \nagency (BIR, Local Tax \nMunicipal, Register of \nDeeds and Municipal \nAssessor)  \n2.6 Co