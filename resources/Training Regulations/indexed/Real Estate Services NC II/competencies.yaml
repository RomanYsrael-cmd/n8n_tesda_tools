        "source_text": "SOC333202\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to carry out\nbasic business mathematics. It specifically includes carrying out\nrequired mathematical operations in preparing contracts for\naccurate information on area, contract price, taxes and other\ncharges related to sales or lease.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Carry out\ncalculations\n\n1.1 Items are counted singly\nand /or batches and\nsorted numerically, as\nrequired in workplace\ntasks\n1.2 Calculations needed to\ncomplete work tasks are\nperformed using the four\nbasic processes of\naddition, subtraction,\nmultiplication and division\nor any appropriate\n1.3 Calculations involving\nfractions, percentages\nand mixed numbers, and\nusing the four basic\nprocesses, are\nperformed as required to\ncomplete workplace\nprocedures\n1.4 The functions of a\ncalculator, numeric\nkeypad or computer are\nused to perform\nmathematical\noperations\n1.5 Numerical information is\nself-checked and\ncorrected for accuracy\n1.1 Basic\nmathematical\noperations and\ntechniques\n1.2 Means of\nrepresenting basic\nmathematical\ninformation\n1.3 Typical\nmathematical\nproblems, and\nappropriate\ncomputation and\nsolutions\n1.4 Functions and use\nof calculator,\nnumeric keypads,\nand computer\n1.5 Procedures for\nidentifying and\nusing relevant\nworkplace\ntechnology when\ncarrying out\nworkplace\ncalculations\n\n1.1 Counting of items\nsingly and / or in\nbatches and\nsorted numerically\nas required in\nworkplace tasks\n1.2 Performing needed\ncalculations to\ncomplete work\ntasks using the\nfour basic\nprocesses of\naddition,\nsubtraction,\nmultiplication and\ndivision\n1.3 Performing\ncalculations\ninvolving fractions,\npercentages and\nmixed numbers,\nand using the four\nbasic processes\n1.4 Communicating\neffectively with\nothers when\ncarrying out basic\nworkplace\ncalculations\n1.5 Checking and\ncorrecting\nnumerical\ninformation for\naccuracy\n1.6 Reading and\ninterpreting\ninstructions,\nprocedures and\n\n--- PDF PAGE 45 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 41\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\ninformation\nrelevant to basic\nworkplace\ncalculations\n1.7 Using calculators,\nnumeric keypads\nand computer\n2. Prepare\nestimates\n\n2.1 Quantities of materials\nand resources required\nto complete a work task\nare estimated\n2.2 The time needed to\ncomplete a work activity\nis estimated\n2.3 Acceptable estimates for\nwork completion are\nmade\n\n2.1 Techniques of\nestimating\nquantities of\nmaterials and\nresources\n2.2 Method of\nestimating the time\nneeded to\ncomplete a work\nactivity\n2.3 Techniques for\nmaking an\nacceptable\nestimate of\ncompleting a\nparticular\nwork/activity\n2.1 Estimating\nquantities of\nmaterials and\nresources required\nto complete a work\ntask\n2.2 Estimating the time\nneeded to\ncomplete a work\nactivity\n2.3 Making acceptable\nestimates for work\ncompletion\n2.4 Communicating\neffectively with\nothers when\ncarrying out basic\nworkplace\ncalculations\n2.5 Completing\ndocumentation\nrelated to work\nactivities\n2.6 Working\nsystematically with\ncareful attention to\ndetail\n3. Interpret\ngraphical\nrepresentations\nof mathematical\ninformation\n\n3.1 Information represented\nin symbols, diagrams,\nlogo and other visual\nmaterials is recognized,\ninterpreted and acted\nupon in workplace task\n3.1 Methods of\ninterpreting,\nrecognizing and\nrepresenting,\ninformation in\nsymbols,\ndiagrams, logo\nand other visual\nmaterials\n3.2 Relevant OH&S\nresponsibilities\n3.1 Recognizing,\ninformation\nrepresented in\nsymbols,\ndiagrams, logo\nand other visual\nmaterials\n3.2 Interpreting\ninformation\nrepresented in\nsymbols,\ndiagrams, logo\nand other visual\nmaterials\n\n--- PDF PAGE 