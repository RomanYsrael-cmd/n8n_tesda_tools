          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDemonstrated knowledge and skills in data\nmanagement and documentation\n1.2.\nDemonstrated knowledge and skills in coordinating\nand scheduling of tripping/viewing\n1.3.\nDemonstrated knowledge and skills in legal laws\nand regulations\n1.4.\nUsed software applications, tools and equipment\n1.5.\nApplied the appropriate financing terms, provisions\nand conditions\n\n2. Resource Implications\nThe following resources must be provided:\n2.1\nWorkplace location\n2.2\nMaterials, supplies, tools and equipment relevant to\nthe unit of competency\n2.3\nTechnical plans, drawings and specifications\nrelevant to the activities\n2.4\nInternet and application software\n\n3. Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1\nDirect Observation\n3.2\nOral interview and written test\n4. Context of Assessment\n4.1\nCompetency maybe assessed in actual workplace or\nat the designated TESDA Assessment Center\n\n--- PDF PAGE 94 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 90\n\nUNIT OF COMPETENCY:\nPERFORM LOAN PROCESSING FUNCTION\n\nUNIT CODE :"
        },
