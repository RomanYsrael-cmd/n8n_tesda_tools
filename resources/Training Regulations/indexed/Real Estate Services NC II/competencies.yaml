          "source_text": "1. Critical\nAspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified the layout of the workplace, the flow of materials and goods\n(where relevant) and the workplace procedures in each work area\n1.2 Identified and followed workplace emergency procedures in real and\nsimulated emergency situation\n1.3 Planned work activities and communicated progress of work to others\nwhose personal work plans and timelines may be affected\n1.4 Completed work to the standard expected in the workplace and in\naccordance with any guidelines, directions or instructions/ information\n1.5 Identified and followed workplace procedures, regulations and\nlegislation appropriate to the position\n1.6 Applied appropriate codes of acceptable and ethical work practices\n1.7 Planned daily routine to take into account rosters, industrial agreements\nand workplace procedures\n1.8 Applied appropriate codes of acceptable and ethical work practices\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the activities\n3. Methods of\nAssessment\nCompetency in this unit maybe assessed through:\n3.1 Written test\n3.2 Demonstration and practical application\n3.3 Interview\n\n4. Context of\nAssessment\n\n4.1 Competency may be assessed in actual workplace or at the designated\nTESDA Accredited Assessment Center.\n\n--- PDF PAGE 44 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 40\nUNIT OF COMPETENCY:\nPERFORM INDUSTRY CALCULATION IN REAL ESTATE\nOPERATIONS\n\nUNIT CODE :"
