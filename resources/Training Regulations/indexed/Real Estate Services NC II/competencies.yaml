ition report \n12.11 prospecting for properties \n12.12 renewal and termination of lease \n12.13 reviewing the tenancy with the landlord \n \n13. Strategies for resolving \ndisputes   \nMay include: \n13.1 conciliation \n13.2 mediation \n13.3 negotiation \n13.4 referral to court \n13.5 referral to tribunal. \n14. Key register   \nMay include: \n14.1 access to keys \n14.2 coding of keys \n14.3 entry of key in register \n14.4 non-return of keys \n14.5 records \n14.6 security and storage procedures.\n\n--- PDF PAGE 71 ---\nREAL ESTATE SERVICES NC II                 Revision 01               Promulgated (01/11/2019) \n 67"
