  "source_text": "COMPETENCY MAP\nFor Real Estate Services NC II\n\nPerform\nsales/marketing\nfunction\nPerform loan\nprocessing\nfunction\nPerform sales\ndocumentation\nfunction\nCORE\nCOMPETENCIES\n\nPerform property/\nmanagement\nfunction\nApply knowledge\nin real estate\nservice\noperations\nContribute to\nquality system\nELECTIVE\nCOMPETENCIES\nPerform basic\nappraisal\nfunction\nBasic\nenvironmental\nimpact assessment\nCOMMON\nCOMPETENCIES\nPerform industry\ncalculation in\nreal estate\noperations\n\nPerform\nworkplace\nsecurity and\nsafety\nFollow ethical\nstandards in the\npractice of real\nestate\nPerform computer\noperations\n\nProvide effective\ncustomer service\nBASIC COMPETENCIES\nParticipate in\nWorkplace\nCommunication\nContribute to\nworkplace\ninnovation\n\nWork in a Team\nEnvironment\n\nPresent relevant\ninformation\n\nProcess title\ntransfer and\nregistration\nProcess loan\npackages\nSolve/address\ngeneral workplace\nproblems\n\nDevelop career and\nlife decisions\nPractice\noccupational safety\nand health policies\nand procedures\nExercise efficient and\neffective sustainable\npractices in the\nworkplace\nPractice\nentrepreneurial skills\nin the workplace\n\n--- PDF PAGE 158 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 154\n\nGLOSSARY OF TERMS\n\n1. ABANDONMENT -\n\nThe voluntary surrender of property rights, with no\nintention of reclaiming them and without vesting\ninterest in another person. Non-use is not\nnecessarily abandonment.\n2. ABSTRACT -\nA history of the ownership of a property, showing\ntransfers in ownership and factors affecting\nownership, such as mortgages. Abstract of Title\n3. ACCEPTANCE -\n\nThe expression of the intention of the person\nreceiving an offer (offeree, usually the seller) to be\nbound by the terms of the offer. The acceptance\nmust be communicated to the offeror and must be\nin writing to be enforceable. The buyer has the\nright to revoke the offer anytime before the\nseller's acceptance.\n4. ACCRETION -\n\nAn increase in dry land by gradual deposit of\nwaterborne, solid material and riparian land. Soil\ndeposited by accretion is called alluvium. The\nowner of riparian land becomes owner of title to\nland formed by accretion. Antonym: erosion.\nSudden removal of land because of strong current\nis called avulsion. Accretion is one mode of\nacquiring title or ownership to the land.\n5. ACCRUED DEPRECIATION -\nThe difference between the present worth of\nimprovements and the reproduction or replacement\ncost new, both measured on the appraisal date.\n6. ACRE\nA measure of land equaling 43,560 square feet; or\n4,840 square yards\n7. AD VALOREM TAX -\nA tax on the value of the object or thing subject to\ntaxation. Tax based on value.\n8. ADMINISTRATOR -\nA person appointed by the court to manage and\nsettle the estate of a deceased person who has left\nno will.\n9. ADVERSE POSSESSION -\n\nAcquisition of title to real property owned by\nsomeone else, by open, notorious, and continuous\npossession for the statutory period of time. Burden\nto prove title is on the possessor, who does not\nhave a marketable title until he obtains and records\na judicial decree quieting title. Under Act 141\n(Public Land Act) prescriptive period for acquisition\nby adverse possession is 30 years. However,\nunder RA10023 (New Residential Free Patent Act)\npossession may only be 10 years.\n10. AFFIDAVIT -\n\nA written declaration, sworn before an officer who\nhas authority to administer oaths like a notary\npublic.\n\n--- PDF PAGE 159 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 155\n\n11. CONTRACT TO SELL-\n\nA written agreement whereby the purchaser\nagrees to buy certain real estate and the seller\nagrees to sell upon terms and conditions set forth\nin the agreement. This is perfection of a sale.\n12. AIR RIGHTS -\n\nThe rights vested by a grant of an estate in real\nproperty to build upon, occupy, or use, in the\nmanner and degree permitted, all or any portion of\nspace above the ground or any other stated\nelevation within vertical planes, the basis of which\ncorresponds with the boundaries of the real estate\ndescribed in the grant. Use of air rights is subject\nto limitation by the police power of the State.\n13. ALIENATION -\nThe voluntary transfer of real property from one\nperson to another. Example: sale, exchange,\nassignment, donation.\n14. AMENITIES -\n\nTangible and intangible benefits generated and\nreceived through exercise of rights to real property,\nnot necessarily in the form of money.\n15. AMORTIZATION -\nLiquidation or gradual retirement of a financial\nobligation by periodic installments. Usually, it\nincludes interest and principal.\n16. APPRAISAL -\n\nA written estimate plus written opinion of value;\na conclusion resulting from the analysis of facts.\nValuation is just an estimate with no written\nopinion.\n17. APPRAISER -\n\nOne\nqualified\nby\neducation,\ntraining,\nand\nexperience who is hired to estimate the value of\nreal and personal property based upon experience,\njudgment, facts, and the use of the formal\nappraisal processes. A person who is licensed to\nestimate value.\n18. APPRECIATION -\n\nAn increased conversion value of property or\nmediums of exchange due to economic or related\ncauses which may prove to be either temporary or\npermanent.\n19. APPURTENANCE -\nSomething annexed to another principal thing and\nwhich passes as incident to it, for example a right\nof way passing with a principal property.\n20. ASSETS -\nAll valuable things owned by a person, corporation,\nor other entity, encumbered or not.\n21. ASSIGNMENT (OF LEASE) -\n\nA transfer to another of rights, interest, or claim in\nor to real or personal property. The party who\nassigns or transfers his interest is the assignor,\nand the assignee is the one to whom the\nassignment is made.\n22. ASSUMPTION OF MORTGAGE\n-\nThe taking of title to property by a grantee wherein\nhe assumes liability for payment of an existing note\nsecured by a mortgage or deed of trust against the\n\n--- PDF PAGE 160 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 156\n\nproperty.\n23. ATTACHMENT -\n\nThe legal process of seizing the real or personal\nproperty of a defendant in a law suit, by levy or\njudicial order, and holding it in the custody of the\ncourt as security for satisfaction of the judgment.\n24. ATTORNEY- IN FACT -\n\nA person authorized to perform certain acts for\nanother person, under power of attorney.\n25. BASE LINE AND MERIDIAN -\n\nEstablished lines used by surveyors to locate and\ndescribe land under the rectangular survey method\nof property description. The first north-south line is\nthe principal meridian; the first east-west line is the\nbase line, at right angles to the meridian.\n26. BASE MAP -\n\nA map with reference points on which land\nownership data can be plotted.\n27. BEARING -\n\nThe cardinal direction (North, South, East, West) of\na line; e.g., North 50 degrees, 30 minutes West.\n28. BENCH MARK -\n\nA mark of known elevation affixed to a permanent\nreference or monument, such as an iron post or\nbrass marker, usually embedded in cement or a\nconcrete structure and used to establish elevations\nover other surveys in the area.\n29. BENEFICIARY -\n\nA person who receives and benefits from the gifts\nor acts of another, such as one who is designated\nto receive the proceeds from a will or trust.\n30. BLANKET MORTGAGE -\nA single mortgage which covers more than one\npiece of real estate.\n31. BOND -\n\nAny obligation under seal. A real estate bond is a\nwritten obligation, usually issued on security of a\nmortgage or a trust deed.\n32. COMPARABLE -\n\nProperties listed in an appraisal report which are\nsubstantially equivalent to the subject property,\ncomparable in selling price, physical character,\nrental, income or similar measure.\n33. BREACH OF CONTRACT -\n\nViolation of any of the terms or conditions of a\ncontract without legal excuse.\n34. BUNDLE OF RIGHTS -\n\nBeneficial interests or rights which attach to the\nownership of real property, including the right to\nsell, lease, encumber, use, enjoy, exclude, will, etc.\nWhen purchasing real estate, one actually buys the\nrights previously held by the seller, except those\nwhich are reserved or limited in the sale.\n35. CAPITALIZATION -\n\nIn appraising, determining value of property by\nconsidering\nnet\nincome\nand\npercentage\nof\nreasonable return on the investment. Formula:\n\n--- PDF PAGE 161 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 157\n\nValue = Net Operating Income / Cap Rate\n36. CAPITALIZATION RATE -\nThe percentage ratio between net income from\ninvestment and the value of the investment.\nCommonly expressed as \"return on and return of\"\ncapital. Return on refers to “interest rate” while\nreturn of refers to “ recapture rate”.\n37. CASH VALUE -\nThe actual money that an asset will bring on the\nopen market without any lengthy delay. It is\nsynonymous with MARKET VALUE or OBJECTIVE\nVALUE.\n38. CERTIFICATE OF TITLE -\n\nA document stating that title to a particular property\nis clear. It is prepared by an attorney or qualified\nperson who has examined the abstract of title, but\nis not to be confused with title insurance. It is only\nan opinion that title is good. Usually given to a\nhomeowner with the deed.\n39. CHATTEL -\n\nPersonal property which is tangible and movable.\nThe word \"chattel\" evolved from the word \"cattle\",\none of man's early important possessions.\n40. COMMON ELEMENT -\n\nIn a condominium, land and parts of buildings used\nby all owners for mutual convenience and safety.\nThese are non alienable areas of a condominium\nproject – sometimes called COMMON AREAS.\n41. COMMON EXPENSE -\n\nIn a condominium, expenses of operation and\nsums declared by the by laws to be common\nexpense. Differentiate regular assessment and\nspecial assessment in condominium project.\n42. COMMUNITY PROPERTY -\n\nProperty accumulated through joint efforts of\nhusband and wife, or by either one, during their\nmarriage and owned in common. Without pre-\nnuptial agreement, married couple’s marriage\nsettlement beginning August 3, 1988 (Family\nCode) falls under Absolute Community of\nProperty.\n43. COMPOUND INTEREST -\nInterest paid both on the original principal and on\ninterest accrued from the time it fell due.\n44. CONDEMNATION -\n\nIn real property law, the process by which property\nof a private owner is taken for public use, with just\ncompensation to the owner. Condemnation occurs\nunder the right of eminent domain. In the\nPhilippines\nit\nis\npopularly\nknown\nas\nEXPROPRIATION.\n45. CONDITIONAL SALE\nCONTRACT -\n\nA contract whereby the owner retains title to the\nproperty until the purchaser has met all of the\nterms and conditions of the contract. Example:\nContract to Sell. It is different from Conditional\nDEED of Sale. There is transfer of ownership here\n\n--- PDF PAGE 162 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 158\n\nalready because of the word DEED.\n46. CONDOMINIUM -\n\nFee ownership of a unit (or right) in multi-unit\nbuilding with joint ownership of common areas. It is\ndifferent from Condominium Unit or Condominium\nProject.\n47. CONSIDERATION -\n\nAn act or forbearance, or the promise thereof,\nwhich is offered by one party to induce another to\nenter into a contract; that which is given in\nexchange\nfor\nsomething\nfrom\nanother.\nConsideration is usually something of value, such\nas the purchase price in money, though it may be\npersonal services or exchanged property. It is the\nprice bargained for and paid for a promise.\n48. CONSTRUCTIVE EVICTION -\n\nBreach of a covenant of warranty or quiet\nenjoyment; for example, the inability of a purchaser\nor lessee to obtain possession by reason of a\nparamount outstanding title. An act by the landlord\nwhich deprives the tenant of the beneficial use and\noccupancy of the premises devised.\n49. CONSTRUCTIVE NOTICE -\n\nOften\ncalled\nlegal\nnotice,\nthe\nconclusive\npresumption that all persons have knowledge of\nthe contents of a recorded instrument. It is one of\nthe purposes of registration.\n50. CONTRACT -\n\nAn agreement, either oral or written to do or not to\ndo certain things. In real estate, there are many\ndifferent types of contracts, including listings,\ncontracts\nof\nsale,\noptions,\nmortgages,\nassignments, leases, deeds, escrow agreements,\nand loan commitments, among others.\n51. CONTRACT RENT -\n\nPayment for use of property, as specified in a\nlease.\n52. CONVEYANCE -\n\nThe transfer of title to real property by means of a\nwritten instrument, such as a deed.\n53. COST OF REPRODUCTION -\n\nThe normal cost of exact duplication of a property\nwith the same or closely similar materials as of a\ncertain date or period. Differentiate reproduction\nvs. replacement cost.\n54. COVENANT -\nA written agreement in a deed which pledges that\neither party will perform or abstain from specified\nacts on a certain property, or which specifies or\nforbids certain uses of the property.\n55. DEED -\n\nA legal instrument in writing, duly executed,\nsealed, and delivered, whereby the owner of real\nproperty (grantor) conveys to another (grantee)\nsome right, title, or interest in real estate.\n\n--- PDF PAGE 163 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 159\n\n56. DEED OF RESTRICTION -\n\nA provision in a deed controlling or limiting the use\nof the land or condominium units or project as a\nwhole.\n57. DEFICIENCY JUDGMENT -\n\nAt a foreclosure sale, the difference between the\nindebtedness sued upon and the sale price or\nmarket value of the real estate. Applicable to\njudicial foreclosure.\n58. DEFICIENCY PAYMENT -\n\nAdditional compensation required in a final\njudgment in condemnation proceedings or in\nforeclosure sale (judicial foreclosure).\n59. DEPRECIATION –\n\na. A lowering of value. A reduction; lessening.\nThe decline in value of property. Loss in\nmarket value. Deterioration over a period of\ntime. The opposite of appreciation.\nb. In appraising, depreciation is the reduction on\nvalue of a property as measured from the cost\nto replace it. It is the difference between the\nreplacement cost and the market value.\nc. In accounting, it is a write-off (usually annually)\nof a portion of an asset on the records.\n60. EARNEST MONEY -\n\nThe cash deposit made by a purchaser of real\nestate as evidence of good faith. Sometimes it is\ncalled RESERVATION MONEY in project selling.\nIt is part of the purchase price. In brokers\nexamination, it is opposite of OPTION MONEY\nwhere option money is not considered part of\npurchase price.\n61. ECONOMIC LIFE -\n\nThe period over which a property will yield a return\non the investment, over and above the economic\nor ground rent due to land.\n62. ECONOMIC OBSOLESCENCE -\n\nImpairment of desirability or useful life arising from\neconomic forces, such as changes in optimum land\nuse, a legislative enactment which restrict or impair\nproperty rights, and changes in supply-demand\nrelationships. In appraisal, this is an incurable\ndepreciation.\n\nSee\nalso\nFUNCTIONAL\nOBSOLESCENCE ( maybe curable or incurable).\n63. EFFECTIVE AGE -\nAge in years, indicated by the condition and utility\nof a structure.\n64. EMINENT DOMAIN -\n\nThe right of the government to take private\nproperty for a necessary public use, with just\ncompensation paid to the owner. Through eminent\n\n--- PDF PAGE 164 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 160\n\ndomain, the state may acquire land (either fee,\nleasehold, or easement) for streets, parks, public\nbuildings, public rights-of-way, and the like. The\nstate may delegate the power of eminent domain\nto local governments and to public corporations\nand associations such as school districts. No\nprivate property is exempt from this exercise of\ngovernment power.\n65. ENCROACHMENT -\nTrespass; the building of a structure or any\nimprovements partly or wholly intruding upon the\nproperty of another.\n66. ENCUMBRANCE -\nAny claim, lien, charge or liability attached to and\nbinding upon real property which may lessen the\nvalue of the property but will not necessarily\nprevent transfer of title. There are two general\nclassifications of encumbrances:\n(1) those that affect the title, such as judgments,\nmortgages, mechanic's liens and other liens\nwhich are charges on property used to secure\na debt or obligation; and\n(2) those that affect the physical condition of the\nproperty such as restrictions, encroachments,\nand easements.\n67. EQUITY -\n\nIn real estate, the interest or value of the real\nestate over and above the amount of the\nindebtedness thereon. In real estate : Formula is :\nSelling Price - Loan Value = Buyer’s Equity\n68. ESCALATION CLAUSE -\n\nA clause in a lease which causes a rent increase,\ncontingent on a specific action.\n69. ESCHEAT -\n\nThe reverting of property to the state by reason of\nfailure of person legally entitled to hold or when\nheirs capable of inheriting are lacking.\n70. ESCROW -\n\n In real estate, it is the state or condition of a deed\nwhich is conditionally held by a third party, called\nthe escrow agent, pending the performance or\nfulfillment of some act or condition.\n71. ESTATE -\nIn real estate it refers to the degree, quantity,\nnature, and extent of interest which a person has in\nreal property, such as a fee simple absolute estate,\nan estate for years.\n72. ESTOPPEL -\n\nA legal doctrine which prevents one from asserting\nrights that are inconsistent with a previous position\nor representation.\n73. EVICTION -\nDispossession by process of law; the act of\ndepriving a person of the possession of lands he\n\n--- PDF PAGE 165 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 161\n\nhas held pursuant to a judgment of the court.\n74. EXCHANGE -\n\nDisposal of any real interest by exchanging it for\nanother real interest of equal value instead of cash.\n75. EXECUTOR -\n\nAn individual or institution designated in a will and\nappointed by a court to settle the estate of the\ntestator.\n76. EXPERT WITNESS -\n\nPersons with particular knowledge or skill which\nenables them to give an opinion on the facts in\ndispute.\n77. FAIR MARKET VALUE -\nLegal term synonymous with MARKET VALUE.\n78. FEE -\nWhen applied to property, an inheritable estate in\nland.\n79. FEE SIMPLE -\n\nThe most comprehensive ownership of real\nproperty known to law; the largest bundle of\nownership rights possible in real estate. Fee simple\ntitle is sometimes referred to as \"the fee\".\n80. FIRST MORTGAGE -\n\nThe mortgage on property that is superior in right\nto any other mortgage. Also called senior\nmortgage. However, government liens like taxes\nthough not annotated in the title are superior to\nany other kind of lien\n81. FIXTURE -\nA chattel which is affixed to and becomes a part of\nreal property.\n82. FORECLOSURE -\n\nProcedure whereby property pledged as security\nfor a debt is sold to pay the debt in event of default\nin payments or terms.\n83. GRADUATED LEASE -\n\nA lease that provides for the varying rental rate,\noften based upon future determination; sometimes\nrent is based upon result of periodic appraisals;\nused largely in long-term leases.\n84. GRANT -\nThe act of conveying or transferring real property,\nthe operative words in a conveyance of real estate\nare to \"grant, bargain, and sell\". The grantor (the\nperson who conveys the real estate) delivers the\ngrant, in the form of a deed, to the grantee.\n85. GRANTEE -\nEntity to whom a grant is made, or to whom real\nestate is conveyed. The buyer.\n86. GRANTOR -\nEntity who makes a grant, conveys real estate by\ndeed. The seller.\n87. GROSS INCOME -\nThe projected annual income from operation of a\nbusiness or from management of a property.\nDifferentiate potential gross income and effective\n\n--- PDF PAGE 166 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 162\n\ngross income\n88. GROSS RENT MULTIPLIER -\nRatio of sales price to monthly rental income for\nsingle family residential properties.\n89. GROUND LEASE -\nA lease to use land for a stated period; may be\nsecured by improvements which the tenant will\nprovide.\n90. HECTARE -\nA metric surface measure: 10,000 square meters\nor 2.471 acres.\n91. IMPROVEMENTS -\nAn addition to land which costs labor or capital\n(buildings,\npavements,\netc.),\nmore\nor\nless\npermanently\nattached.\nMore\nthan\nrepair\nor\nreplacement.\n92. INSTALLMENT CONTRACT -\nPurchase of real estate upon an installment basis;\nupon default, payments are forfeited. Often called\na LAND CONTRACT, the deed to the property is\nnot given to the purchaser until either all or a\ncertain portion of the purchase price has been\npaid. It is often called Contract to Sell.\n93. INTEREST RATE -\nThe rate of return on an investment, specifically,\nthe rate charged on borrowed money.\n94. INTESTATE -\nA person who dies having made no will, or one\ndefective in form; in which case, his estate\ndescends to his heirs at law or next of kin.\n95. JUNIOR LIEN -\n\nA lien placed upon property after a previous lien\nhas been made and recorded. See also SENIOR\nLIEN.\n96. JUST COMPENSATION -\n\nMarket value paid for real estate taken in a\ncondemnation action plus consequential damage\nminus consequential benefits.\n97. LAND MANAGEMENT -\nPlanning and execution of programs to use,\nimprove and maintain land and water areas for the\ngreatest net public benefit, while supporting the\nassigned mission. Includes forest and wildlife\nmanagement, agriculture and grazing leasing,\noutdoor recreation, etc.\n98. LAND SURVEYING -\nLocation and identification of a parcel of land by a\nprofessional surveyor or engineer.\n\n--- PDF PAGE 167 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 163\n\n99. LEASE -\nA written document by which the owner transfers\nthe rights of use and occupancy of land and/or\nstructures to another person or entity for a\nspecified period of time in return for a specified\nrental.\n100.\nLEASEHOLD -\nThe interest or estate which a lessee has in real\nproperty by virtue of his lease. See also leased fee\nestate, sub-leasehold and sandwich lease.\n101.\nLEGAL DESCRIPTION -\nA statement containing a designation by which\nland is identified according to a system set up by\nlaw or approved by law.\n102.\nLIEN -\nA hold or claim which one person has upon the\nproperty of another as a security for some debt or\ncharge.\n103.\nLIS PENDENS -\nA public notice, filed against specific lands, that an\naction at law is pending that may affect the title to\nthe land.\n104.\nMARKET PRICE -\nThe price paid regardless of pressures, motives, or\nintelligence.\n105.\nMARKET VALUE -\nThe price at which a willing seller would sell and a\nwilling buyer would buy, neither being under\nabnormal pressure.\n106.\nMORTGAGE -\nA legal instrument pledging a described property\nfor repayment of a loan under certain terms.\n107.\nMORTGAGEE -\none to whom a mortgage is made; the lender.\n108.\nMORTGAGOR -\nOne who makes a mortgage, the borrower.\n109.\nNEGOTIABLE -\nA promissory note, or similar instrument, is said to\nbe negotiable if title to the instrument, and the\nmoney it represents, can be transferred by mere\nendorsement and delivery by the holder, or by\ndelivery only.\n110.\nNET INCOME -\nin general, synonymous with net earnings, but\nconsidered a broader and better term; the balance\nremaining, after deducting from the gross income\nall operating expenses, maintenance, taxes, and\nlosses pertaining to operating properties excepting\ninterest or other financial charges on borrowed or\nother capital.\n111.\nNET LEASE -\nA lease agreement whereby the lessee pays all\nproperty charges (taxes, insurance, maintenance)\n\n--- PDF PAGE 168 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 164\n\nin addition to rent. Local market customs and terms\nvary, in some areas, \"net, net\" and \"net, net, net\"\nare used.\n112.\nOBLIGOR -\nOne who places himself under a legal obligation to\nan obligee.\n113.\nOBSOLESCENCE -\nAs applied to real estate it is the loss of value due\nto\nstructural,\neconomic,\nor\nsocial\nchanges\nbecoming outmoded.\n114.\nOPEN-END MORTGAGE\n-\nA mortgage containing a clause that permits the\nmortgagor to borrow money after the loan has\nbeen reduced without rewriting the mortgage.\n115.\nOPTION -\nA privilege, acquired for a consideration, of\ndemanding within a specified time the carrying out\nof a transaction upon stipulated terms. The\noptionor grants an option to an optionee.\n116.\nPARTITION -\n\nThe dividing of common interests in real property\nowned jointly by two or more persons. It\nsometimes happens that one of several tenants in\ncommon or joint tenants desires to sell the property\nwhile the other tenants think it best to hold on to\nthe investment. If the parties cannot reach an\nagreement, an action in partition is often the\nsolution. The main purpose is to provide a means\nby which people, fording themselves in an\nunwarranted\ncommon\nrelationship,\ncan\nfree\nthemselves\nfrom\nthe\nrelationship.\nSee\nCONDOMINIUM CONCEPT.\n117.\nPATENT -\n\nAn instrument by which the Federal Government\nconveys public land to an individual.\n118.\nPERCENTAGE LEASE -\nA lease whereby rental is a percentage of gross or\nnet income from sales or services. Such a lease\noften guarantees a minimum or maximum rent,\nregardless of business volume.\n119.\nPERMIT -\nA privilege, revocable at will, granted to another\nFederal agency to use real property for a specific\npurposes; confers no possessory interest.\n120.\nPERSONAL PROPERTY\n-\nAll physical objects of a personal or movable\nnature subject to ownership, except real estate\n(real property). See also PROPERTY and REAL\nPROPERTY.\n121.\nPLAT -\nMap of town, section, or subdivision, showing\nlocation and boundaries of individual properties.\n\n--- PDF PAGE 169 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 165\n\n122.\nPLOT -\nA piece of land.\n123.\nPREPAYMENT PENALTY\n-\nPenalty for the payment of a mortgage or deed of\ntrust note before it actually becomes due.\n124.\nPRESCRIPTION -\nThe acquiring of aright in property, usually in the\nform of an intangible property right such as an\neasement or right-of-way, by means of adverse\nuse\nof\nproperty\nthat\nis\ncontinuous\nand\nuninterrupted for the prescriptive period.\n125.\nPRICE -\nThe amount paid in legal tender, goods, or\nservices; the consideration; purchase price. The\nterms for which a thing is done.\n126.\nPRINCIPAL -\nAmount of a loan balance. In a mortgage payment\nof principal and interest, the principal repays the\nloan.\n127.\nPROPERTY -\nThe rights or interests a person has in the thing he\nowns; not, in the technical sense, the thing itself.\nThese rights include the right to possess, to use, to\nencumber, to transfer and to exclude, commonly\ncalled\nthe\nbundle\nof\nrights.\nIn\nmodern\nunderstanding, however, property has come to\nmean the thing itself to which certain ownership\nrights are attached. Property is either real or\npersonal.\n128.\nPUBLIC DOMAIN LANDS\n-\nLand or interest in land owned by the Philippine\nGovernment\n129.\nQUIET TITLE -\nCourt action brought to establish title and to\nremove a cloud on the title.\n130.\nQUITCLAIM DEED -\nA deed of conveyance with conveys to the grantee\nwithout warranty of title whatever interest, title, or\nclaim the grantor possesses.\n131.\nREAL PROPERTY -\nLand and anything built on, growing on, or affixed\nto land. See also PROPERTY, PERSONAL\nPROPERTY.\n132.\nREALTY -\nA term sometimes used as a collective noun for\nreal property or real estate.\n133.\nRESCISSION OF\nCONTRACTS -\nThe abrogating or annulling of contracts. the\nrevocation or repealing of a contract by mutual\nconsent by parties to the contract, or for cause by\neither party to the contract.\n134.\nREDEMPTION -\nThe right to redeem property during the foreclosure\nperiod; the right of an owner to redeem his\nproperty after a sale for taxes. Often referred to as\nEquity of Redemption.\n\n--- PDF PAGE 170 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 166\n\n135.\nRENT -\nA compensation, either in money, provisions,\nchattels, or labor, received by the owner of real\nestate from the occupant.\n136.\nREPLACEMENT COSTS\n-\nCost of a building with equivalent utility or similar\nfeatures but with modern materials and eliminating\ndeficiencies of the building it replaces.\n137.\nRIGHT-OF-WAY -\nThe right or privilege, acquired through accepted\nusage or by contract, to pass over a designated\nportion of the property of another. A right-of-way\nmay be private, as in an access easement given a\nneighbor, or public, as in the right-of-way to use\nthe highways and streets.\n138.\nSALE-LEASEBACK -\nA situation where the owner of a piece of property\nwishes to sell the property and retain occupancy by\nleasing it from the buyer.\n139.\nSALES CONTRACT -\nA contract by which buyer and seller agree to the\nterms of the sale.\n140.\nSITE -\nA parcel of land, sufficiently improved to be used\nas a building lot or for other purposes requiring an\nimproved site. Unimproved lot is rawland.\n141.\nSUBDIVISION -\nAny land which is divided or is proposed to be\ndivided for the purpose of disposition into two or\nmore lots, parcels, units, or interests.\n142.\nSURVEY -\nThe act by which the quantity and boundaries of a\npiece of land are ascertained; the paper containing\na statement of the courses, distance, and quantity\nof land is also called a survey.\n143.\n\nTAX DEED - A deed given where property has\nbeen purchased at a sale to the public of property\nfor nonpayment of taxes.\n144.\nTAX LIEN -\nA government claim for unpaid real estate tax.\n145.\nTAX SALE -\nA sale of property, usually at auction, for\nnonpayment of taxes assessed against it.\n146.\nTITLE -\nThe right to or ownership of lands. Also, the\nevidence\nof\nownership.\nTitle\nto\nproperty\nencompasses all the bundle of rights an owner\npossesses.\n147.\nTRADE FIXTURES -\nArticles of personal property annexed to real\nproperty but which are necessary to the carrying\n\n--- PDF PAGE 171 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 167\n\non of a trade and are removable by the owner. It is\nconsidered personal property. Fixture is real\nproperty.\n148.\nUTILITY -\nThe usefulness of a property; its ability to\nsatisfactorily function for the purpose for which it\nwas intended. It is the criterion of value.\n149.\nVALUE -\nAbility to command goods, including money, in\nexchange; the quantity of goods, including money,\nwhich should be commanded or received in\nexchange for the thing valued; utility; desirability.\nAs applied to a property value may be broadly\ndefined as \"the present worth of all the rights to\nfuture benefits arising from ownership\".\n150.\nWAIVER -\nThe renunciation, abandonment, or surrender of a\nright, claim, or privilege.\n151.\nWARRANTY DEED -\nA deed that contains a covenant that the grantor\nwill protect the grantee against any claimant.\n152.\nZONING -\nThe public regulation, through police power, of the\ncharacter and extent of real estate use. Uniform\nrestrictions on improvements, building height,\ndensity of population, and other factors regulate\nthe use and development of private property.\n\n--- PDF PAGE 172 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 168\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nReal Estate Services NC II\nQualification Code:\nSOCRES219\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nReal Estate Services\nNC II\n2019-10 /\n01/11/19\n026/3/1/2019\n Legend: *Description Types\n-\nDocument Created\n-\nDocument Amended\n\n--- PDF PAGE 173 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 169",
