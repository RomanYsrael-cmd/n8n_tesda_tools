  "source_text": "SECTION 1: REAL ESTATE SERVICES NC II\n\nThe REAL ESTATE SERVICES NC II Qualification consists of competencies that a person must\nachieve to assist the real estate broker in performing sales/marketing, documentation, loans and property\nmanagement functions.\n\nThis qualification will show performance of a prescribed range of functions involving known\nroutines and procedures leading towards a successful job in real estate services.\n\nLikewise, this qualification is packaged from the competency map of real estate services.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the workplace\nPractice entrepreneurial skills in the workplace\n\nUNIT CODE\nCOMMON COMPETENCIES\nSOC333201\nApply knowledge in real estate service practice\nSOC333202\nPerform industry calculation in real estate operations\nSOC333203\nPerform workplace security and safety\nSOC333204\nProvide effective customer service\nSOC333205\nContribute to quality system\nSOC333206\nIdentify legal and ethical requirements of property management to\ncomplete agency work\nSOC333207\nPerform computer operations\n\nUNIT CODE\nCORE COMPETENCIES\nSOC333301\nPerform sales/marketing function\nSOC333302\nPerform sales documentation function\nSOC333303\nPerform loan processing function\nSOC333304\nPerform property/management function\n\nA person who has achieved this Qualification is competent to be a:\n❑\nReal Estate Salesperson\n\n--- PDF PAGE 6 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 2"
