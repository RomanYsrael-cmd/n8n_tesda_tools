      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide training on the development of competency-based curricula to enable training\nproviders develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language and other\nacademic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual\nLearning Matrix (CLM) to include green technology, issues on health and drugs and persons with\ndisabilities (PWD’s).\n\nCourse Title: REAL ESTATE SERVICES\n\nNC Level: NC II\n\nNominal Training Duration:\n\n37 Hrs.\nBasic Competencies\n\n 24 Hrs.\nCommon Competencies\n\n88 Hrs.\nCore Competencies\n\n 149 Hrs\nTotal\n\n 60 hrs.\nSIT\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of REAL ESTATE\nSERVICES NC II in accordance with industry standards. This covers competencies that a person must\nachieve in performing functions for sales/marketing, sales documentation, loan processing and property\nmanagement.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 109 ---\n_________________________________________________________________________________________________________________________________________________________\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 105\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communicationt\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available t