      "present": true,
      "source_text": "1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\nb.\nTraining delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace and/or\nthrough adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n1.\nThe competency – based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or combination with other modalities\nwhen designing and delivering training programs:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n 2.2 Enterprised-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n--- PDF PAGE 151 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 147\n\n• Informal Apprenticeship – is based on training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – short term programs conducted by Non-Government\nOrganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be Mobile Training Programs\n(MTP).",
      "pdf_pages": []
    },
