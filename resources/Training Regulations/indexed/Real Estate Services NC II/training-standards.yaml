cussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 117 ---\n_________________________________________________________________________________________________________________________________________________________\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 113\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities\nin accordance with OSH Standards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n2 Hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource utilization\n- Discussion on the process how\nEnvironmental Policies coherence is\nachieved\n•\nDiscussion on Necessary Skills in\nresponse to changing environmental\npolicies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n8.2 Determine causes\nof inefficiency of\nresource utilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work Procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 118 ---\n_________________________________________________________________________________________________________________________________________________________\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 114\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 Hour\n\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 Hour\n\n9.3 Implement cost-\neffective operations\n• Case studies on Preservation, optimization\nand judicious use of workplace resources\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n2 Hours\n\n--- PDF PAGE 119 ---\n_________________________________________________________________________________________________________________________________________________________\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 115\n\nCOMMON COMPETENCIES\n(24 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.\nApply\nknowledge in\nreal estate\nservice practice\n1.1. Identify major areas\nof the workplace\n•\nDescribe:\no workplace procedures and\nstandards and duty of care\nrequirements including OH&S\nand environmental protection\nresponsibilities\n•\nGroup\nDiscussion\n• Oral Evaluation\n3 hours\n\no conditions of service includi