grees, 30 minutes West. 28. BENCH MARK - A mark of known elevation affixed to a permanent reference or monument, such as an iron post or brass marker, usually embedded in cement or a concrete structure and used to establish elevations over other surveys in the area. 29. BENEFICIARY - A person who receives and benefits from the gifts or acts of another, such as one who is designated to receive the proceeds from a will or trust. 30. BLANKET MORTGAGE - A single mortgage which covers more than one piece of real estate. 31. BOND - Any obligation under seal. A real estate bond is a written obligation, usually issued on security of a mortgage or a trust deed. 32. COMPARABLE - Properties listed in an appraisal report which are substantially equivalent to the subject property, comparable in selling price, physical character, rental, income or similar measure. 33. BREACH OF CONTRACT - Violation of any of the terms or conditions of a contract without legal excuse. 34. BUNDLE OF RIGHTS - Beneficial interests or rights which attach to the ownership of real property, including the right to sell, lease, encumber, use, enjoy, exclude, will, etc. When purchasing real estate, one actually buys the rights previously held by the seller, except those which are reserved or limited in the sale. 35. CAPITALIZATION - In appraising, determining value of property by considering net income and percentage of reasonable return on the investment. Formula: REAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)"
