  "source_text": "SECTION 4\nASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments whether\ncompetency has been achieved. The purpose of assessment is to confirm that an individual can perform\nto the standards expected at the workplace as expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove achievement of\ncompetencies. The process may be applied to an employable unit(s) of competency in partial\nfulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences may apply\nfor recognition in a particular qualification through competency assessment.\n\n 4.1.4 The following are qualified to apply for assessment:\n\n4.1.4.1 Graduating students/trainees of NTR programs or graduates of\nformal/non-formal/informal including enterprise-based trainings related to\nreal estate services\n4.1.4.2 Experienced real estate agent for at least 2 years.\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through a\nrecognition/assessment process.\n\n--- PDF PAGE 156 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 152\n\n4.1.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 157 ---\nREAL ESTATE SERVICES NC II Revision 01 Promulgated (01/11/2019)\n 153\n\n"
