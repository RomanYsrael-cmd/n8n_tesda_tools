      "text": "5 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 58 --- ______________________________________________________________________________________ TR - DRIVING NC II Promulgated December 2004 56 Perform Mensuration and Calculation Move and Position Vehicle Apply Appropriate Sealant/ Adhesive Use and Apply Lubricant/ Coolant Perform Housekeeping Automotive/Land Transport Area Read, Interpret and Apply Specifications and Manuals Carry Out Vehicle Maintenance and Servicing Drive Light Vehicles Implement and Coordinate Accident- Emergency Procedures Obey and Observe Traffic Rules and Regulations Demonstrate work values Practice housekeeping procedures (5S) Participate in workplace communication Work in team environment Practice career professionalism Work with others Develop and practice negotiation skills Use mathematical concepts and techniques Use relevant technologies Solve problems related to work activities Receive and respond to workplace communication Develop teams and individuals Utilize specialized communication skills Practice occupational health and safety Lead workplace Collect, analyze and organize Information Plan and organize work Apply problem- solving techniques in the workplace Lead small teams Promote environmental protection Perform Job Estimates Interpret/Draw Technical Drawing Drive Articulated Vehicles Perform Minor Maintenance and servicing for Articulated Vehicle Perform Pre- and Post Operation Procedures for Articulated Vehicles Respond to Emergency Situations --- PDF PAGE 59 --- ______________________________________________________________________________________ TR - DRIVING NC II Promulgated December 2004 57 1. Absolute speed limit - The maximum or minimum legal speed at which one may drive. This speed limit may or may not be posted. 2. Accident, motor vehicle - Any mishap involving a moving vehicle and resulting in death, injury or property damage. 3. Basic speed limit - Any speed below the absolute limit that is safe for existing road, weather or traffic conditions. 4. Collision - Any crash between motor vehicles or between a motor vehicle and another object. 5. Driving license - A legal document in the form of plastic identification card and official receipt issued by LTO authorizing a person to drive and operate a specified type of motor vehicle after satisfactorily completing and passing the standard requirement as categorized either non-professional or professional proficiency level. 6. Defensive driving - Being prepared to handle through any hazardous situation caused by other users of the road. 7. Directional signals - Lights on motor vehicle or hand signals used to indicate left and right turns and stops. 8. Driver - A person who drives motor vehicle and transport passengers and loads over specified routes or destination for a fee. 9. Fare - Refers to the price charged to transport a passenger 10. Franchised route - Refers to the designated travel route assigned by LTFRB (DOTC) to a specific public passenger motor vehicle indicating the particular main streets, roads and avenues to ply including its limitations and boundaries. 11. Periodic Maintenance Service - The regular servicing prescribed by manufacturer to maintain the vehicle’s top performance. 12. Motorcycle - Refers to a single passenger vehicle for operation on ordinary and typically having two wheels and a gasoline internal combustion engine. --- PDF PAGE 60 --- ______________________________________________________________________________________ TR - DRIVING NC II Promulgated December 2004 58 13. Public Utility Jeepney (PUJ) - Refers to a locally manufactured and modified jeepney-type vehicle intended to carry as much passengers as prescribed and authorized by Land Transportation Franchise Regulatory Board (LTFRB) as approved by the Department of Transportation and Communication (DOTC). 14. Regulatory signs - Traffic signs that tell what a driver must or must not do under penalty of the law. 15. Road Related Accident and Emergency - Refers to unforeseen and unanticipated road happenings usually resulted from by driver’s negligence/error, abnormal road condition and motor vehicle mechanical safety breakdown resulting to grave vehicular accident, passenger body injury and damage to property. 16. Roadway markings - Markings on a pavement separating lanes of travel or indicating what a driver may do. 17. Seat belt - A belt anchored to the vehicle frame. It prevents the passengers from being thrown against parts of the interior of the vehicle or from the vehicle in the event of a collision. 18. Taxicab - Refers to a public utility car that transport passenger to a designated location and collect fare recorded on taximeter based on mileage or time factors specified by the LTFRB. 19. Traffic - The flow of all motor vehicles and pedestrians along the street and the highway 20. Traffic signal lights - Traffic controls which usually located at intersections to regulate traffic flow 21. Tricycle Unit - Refers to a 3-wheeled motor vehicle consisting of a motorcycle and a modified passenger sidecar with a seating capacity prescribed and authorized. It is franchised by LTFRB to operate and transport passengers within a specified area of operation with a pre-set and fixed fare. 22. Warning signs - Traffic signs that alert drivers to potential hazards ahead --- PDF PAGE 61 --- ______________________________________________________________________________________ TR - DRIVING NC II Promulgated December 2004 59 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who rendered their time and expertise to the development and validation of this Training Regulation. • 