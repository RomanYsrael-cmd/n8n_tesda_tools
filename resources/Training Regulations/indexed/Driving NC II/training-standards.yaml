    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for DRIVING NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: LIGHT VEHICLE DRIVING\n\nNC LEVEL: NC II\n\nTraining Nominal Hours:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n\n80 Hours (Core Competencies)\nCourse Description:\n\n This course is designed to equip the individual the desirable attitudes and\nskills of the land transport light vehicle driver in accordance with industry standards,\nincluding the regulatory requirements issued by appropriate regulatory bodies,\ngovernment and/or private. It covers the following four core competencies: Carry Out\nVehicle Maintenance and Servicing, Drive Light Vehicles, Obey and Observe Traffic\nRules and Regulations and Implement and Coordinate Accident/Emergency\nProcedures. It covers the basic, common and core competencies.\n\n This course is also designed to equip the individual the basic and common\nknowledge , skills and attitudes of the land transport light vehicle driver in accordance\nwith industry standards.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\n role and responsibility in a\nteam.\n2.2 Describe work as a team\n member.\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\n objectives with\norganizational goals.\n 3.2 Set and meet work\npriorities.\n3.3 Maintain professional\n growth and development.\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 51 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n49\n4. Practice\noccupational\nhealth and safety\n4.1Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\n health and safety\n awareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nAppropriate\nSealant/\nAdhesive\n1.1. Identify appropriate\nsealant/ adhesive\n1.2. Prepare surface for\nsealant/ adhesive\napplication\n1.3. Store unused and\ndispose used\nsealant/adhesive\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance Learning\n\n•\nWritten test\n•\nOral questioning\n•\nDirect observation\n•\nProject method\n•\nInterview\n2. Move and\nPosition Vehicle\n2.1. Prepare vehicle for\ndriving\n2.2. Move and position\nvehicle\n2.3. Check the vehicle\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance Learning\n•\nWritten test\n•\nOral questioning\n•\nDirect observation\n•\nProject method\n•\nInterview\n3. Perform\nMensuration\nand Calculation\n3.1. Select measuring\ninstrument and carry\nout measurement and\ncalculations.\n3.2. Maintain measuring\ninstruments\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance Learning\n•\nWritten test\n•\nOral questioning\n•\nDirect observation\n•\nProject method\n•\nInterview\n4. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed\nmanuals and interpret\ndata and specification\n4.2 Apply information\naccessed in manual\n4.3 Store manual\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance Learning\n•\nWritten test\n•\nOral questioning\n•\nDirect observation\n•\nProject method\n•\nInterview\n5. Use and Apply\nLubricant/\nCoolant\n5.1. Identify type of\nlubricant/coolant\n5.2 Use and apply\nlubricant\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance Learning\n•\nWritten test\n•\nOral questioning\n•\nDirect observation\n•\nProject method\n•\nInterview\n6. Perform Shop\nMaintenance\n\n6.1 Inspect/clean tools and\nwork area\n6.2 Store/arrange tools and\nshop equipment\n6.3 Dispose wastes/used\nlubricants\n6.4 Report damaged\ntools/equipment\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance Learning\n\n•\nWritten test\n•\nOral questioning\n•\nDirect observation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 52 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n50\n\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Carry out minor\nvehicle\nmaintenance\nand servicing\n1.1Clean vehicle unit\n1.2 Maintain and service the\nvehicle system\n\n• Demonstration\n• Discussion\n• Dual Training\n• Distance Learning\n• Computer based\nlearning\n• Interview\n• Direct\n observation\n• Demonstration\n of practical\n skills\n2. Drive light\nvehicles\n2.1 Perform light vehicle pre-\nstarting and warm-up\n2.2 Drive light vehicles\n2.3 Monitor and maintain\nvehicle performance\n• Demonstration\n• Discussion\n• Dual Training\n• Distance Learning\n• Computer based\nlearning\n• Interview\n• Direct\n• observation\n• Demonstration\n• of practical\n• skills\n• Portfolio\n3. Observe traffic\nrules and\nregulations\n3.1 Observe traffic signs and\nroad markers\n3.2 Obey traffic rules and\nregulations\n3.3 Respect traffic enforcers\nand other traffic\nmanagement unit\n• Role play\n• Simulation\n• Discussion\n• Demonstration\n• Interview\n• Direct\n observation\n• Written Exam\n4. Implement and\ncoordinate\naccident/emerg\nency\nprocedures\n4.1Respond to emergencies\n4.2 Arrange follow-up support\nand assistance\n• Role play\n• Simulation\n• Discussion\n• Demonstration\n• Interview\n• Direct\n observation\n• Written Exam\n\n--- PDF PAGE 53 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n51\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and\nthe curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off the-job components;\n•\nTraining program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\n\n--- PDF PAGE 54 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n52\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy\nin which students plan, implement and evaluate projects that have real\nworld applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are\nalso stated. Passing entry written examinations may also be indicated if\nnecessary.\n\n•\nWith good moral character;\n•\nAble to communicate both orally and in writing\n•\nPhysically fit and mentally healthy as certified by a Public\n Health Officer\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of\n25 trainees for Driving NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQuantity\nItem\nQuantity\nItem\nQuantity\nItem\n4 pcs.\nMop\nCar\n5 boxes\nSoap\n4 pcs.\nBasket\nJeepney\n5 ltrs.\nShampoo\n4 pcs.\nPail\n4 pcs.\nPolisher\n\n4 pcs.\nBroom\n4 pcs.\nHose\nVacuum Pump\n10 ltrs.\nGear Oil\n4 pcs.\nCross wrench\nSteam Cleaner\n20 pcs.\nAir Freshener\n4 pcs.\nMechanical\npliers\n\nAir Compressor\n10 pcs.\nPolish\n4 pcs.\nLong nose\npliers\n\n10 ltrs.\nDistilled water\n25 pairs\nGlove\n4 pcs.\nFan belt\n25 pcs.\nApron\n8 pcs.\nWheel cap\n25 pairs\nGoggles\n10 pcs.\nFuse\n25 pairs\nPlastic boots\n4 rolls\nElectrical tape\n4 sets\nCombination\nwrench\n\n2 ltrs.\nBrake fluid\n4 pcs.\nA/C belt\n4 pcs.\nScrewdriver\n(flat & Phillips)\n\n4 pcs.\nP/S belt\n\n--- PDF PAGE 55 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n53\n4 pcs.\nEarly Warning\nDevice\n\n10 ltrs.\nCoolant\n4 pcs.\nJack\n10 ltrs.\nAdditives\n4 pcs.\nSpare tire\n4 pcs.\nRelay\n4 pcs.\nFlashlight\n4 pcs.\nFender cover\n4 pcs.\nEmergency\nlighting device/\ntrouble light\nTraining Materials:\n\n• Reference\nBooks\n4 pcs.\nDunce Pin\n\n•\nManuals\n4 pcs.\nTire Gauge\n\n• Brochures\n4 pcs.\nCreeper\n\n• Catalogs\n\n• CDs/Video\ntapes\n\n• Learning\nModules\n\n3.5 TRAINING FACILITIES\nDRIVING - NC II\n\nBased on a class size of 25 students/trainees\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN\nSQUARE\nMETERS\nTOTAL AREA\nIN SQUARE\nMETERS\nBuilding (Permanent)\n20.00 X 30.00\n600.00\n600.00\nStudent/Trainee working space\nLecture Room\n9.00 X 6.00\n54.00\n54.00\nLearning Resource Center\n6.00 X 4.00\n24.00\n24.00\nFacilities/Equipment/Circulation\nArea\n\nDriving lane\n\n--- PDF PAGE 56 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n54\n3.6 TRAINERS’ QUALIFICATION FOR AUTOMOTIVE/LAND TRANSPORT\n SECTOR\nDRIVER NC II (CLASSIFIED UNDER THE LTO RESTRICTION CODE 1 AND 2)\n\n• Must be a holder of a Land Transport Light Vehicle NC II certificate\n• Must be a holder of a Trainer Qualification Level II (TQ II) certificate\n• Must be computer literate\n• Must be able to communicate, both orally and in writing\n• Must be physically and mentally fit\n• Must have a minimum of one-year industry experience in driving\n light vehicles\n• Must possess a current professional driver’s license issued by the Land\nTransportation Office.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine\ntheir achievement of units of competency. A certificate of achievement\nis issued for each unit of competency.\n\n--- PDF PAGE 57 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n55"
