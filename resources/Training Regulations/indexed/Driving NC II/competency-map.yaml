  "source_text": "Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.2 The qualification of Driving NC II may be attained through demonstration of\ncompetence through a single comprehensive project-type assessment\ncovering all required units of competency of the qualification.\n\n4.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\nenterprise-based training programs.\n\n4.4.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 58 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n56\n\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCOMPETENCY MAP\nDRIVING\n\nPerform\nMensuration and\nCalculation\nMove and Position\nVehicle\n\nApply Appropriate\nSealant/ Adhesive\nUse and Apply\nLubricant/ Coolant\nPerform\nHousekeeping\nAutomotive/Land\nTransport Area\nRead, Interpret and\nApply Specifications\nand Manuals\nCarry Out Vehicle\nMaintenance and\nServicing\nDrive Light\nVehicles\nImplement and\nCoordinate Accident-\nEmergency Procedures\nObey and Observe\nTraffic Rules and\nRegulations\nBASIC\nCOMPETENCIES\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\n(5S)\nParticipate\nin workplace\ncommunication\nWork\nin team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\nPractice\noccupational\nhealth and\nsafety\nLead\nworkplace\nCollect,\nanalyze and\norganize\nInformation\nPlan\nand organize\nwork\nApply\nproblem-\nsolving\ntechniques in\nthe workplace\nLead\nsmall teams\nPromote\nenvironmental\nprotection\n\nPerform Job Estimates\nInterpret/Draw\nTechnical Drawing\nDrive Articulated\nVehicles\nPerform Minor\nMaintenance and\nservicing for Articulated\nVehicle\nPerform Pre- and Post\nOperation Procedures\nfor Articulated Vehicles\nRespond to Emergency\nSituations\n\n--- PDF PAGE 59 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n57\n\nDEFINITION OF TERMS\n\n1.\nAbsolute speed limit\n- The maximum or minimum legal speed at which\none may drive. This speed limit may or may not be\nposted.\n2.\nAccident, motor vehicle\n- Any mishap involving a moving vehicle and\nresulting in death, injury or property damage.\n3.\nBasic speed limit\n- Any speed below the absolute limit that is safe for\nexisting road, weather or traffic conditions.\n4.\nCollision\n- Any crash between motor vehicles or between a\nmotor vehicle and another object.\n5.\nDriving license\n- A legal document in the form of plastic identification\ncard and official receipt issued by LTO authorizing a\nperson to drive and operate a specified type of\nmotor vehicle after satisfactorily completing and\npassing the standard requirement as categorized\neither non-professional or professional proficiency\nlevel.\n6.\nDefensive driving\n- Being prepared to handle through any hazardous\nsituation caused by other users of the road.\n7.\nDirectional signals\n- Lights on motor vehicle or hand signals used to\nindicate left and right turns and stops.\n8.\nDriver\n- A person who drives motor vehicle and transport\npassengers and loads over specified routes or\ndestination for a fee.\n9.\nFare\n- Refers to the price charged to transport a\npassenger\n10.\nFranchised route\n- Refers to the designated travel route assigned by\nLTFRB (DOTC) to a specific public passenger\nmotor vehicle indicating the particular main streets,\nroads and avenues to ply including its limitations\nand boundaries.\n11.\nPeriodic Maintenance\nService\n- The regular servicing prescribed by manufacturer to\nmaintain the vehicle’s top performance.\n12.\n Motorcycle\n- Refers to a single passenger vehicle for operation\non ordinary and typically having two wheels and a\ngasoline internal combustion engine.\n\n--- PDF PAGE 60 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n58\n\n13.\n Public Utility Jeepney\n(PUJ)\n- Refers to a locally manufactured and modified\njeepney-type vehicle intended to carry as much\npassengers as prescribed and authorized by Land\nTransportation Franchise Regulatory Board\n(LTFRB) as approved by the Department of\nTransportation and Communication (DOTC).\n14.\nRegulatory signs\n- Traffic signs that tell what a driver must or must not\ndo under penalty of the law.\n15.\nRoad Related Accident\nand Emergency\n- Refers to unforeseen and unanticipated road\nhappenings usually resulted from by driver’s\nnegligence/error, abnormal road condition and\nmotor vehicle mechanical safety breakdown\nresulting to grave vehicular accident, passenger\nbody injury and damage to property.\n16.\nRoadway markings\n- Markings on a pavement separating lanes of travel\nor indicating what a driver may do.\n17.\nSeat belt\n- A belt anchored to the vehicle frame. It prevents the\npassengers from being thrown against parts of the\ninterior of the vehicle or from the vehicle in the\nevent of a collision.\n18.\nTaxicab\n- Refers to a public utility car that transport\npassenger to a designated location and collect fare\nrecorded on taximeter based on mileage or time\nfactors specified by the LTFRB.\n19.\nTraffic\n- The flow of all motor vehicles and pedestrians along\nthe street and the highway\n20.\nTraffic signal lights\n- Traffic controls which usually located at\nintersections to regulate traffic flow\n21.\nTricycle Unit\n- Refers to a 3-wheeled motor vehicle consisting of a\nmotorcycle and a modified passenger sidecar with a\nseating capacity prescribed and authorized. It is\nfranchised by LTFRB to operate and transport\npassengers within a specified area of operation with\na pre-set and fixed fare.\n22.\nWarning signs\n- Traffic signs that alert drivers to potential hazards\nahead\n\n--- PDF PAGE 61 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n59\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who rendered their time and expertise to the development and\nvalidation of this Training Regulation.\n\n•\nTHE TESDA ADVISORY PANEL (TAP)\nMR. ALLEN RAYMUND A. RUFO\nTAP Chairman – Automotive Sector\nTOYOTA Motors Philippines, Corp.\nSta. Rosa, Laguna\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig city\nMS. MA. CLARISSA V. FUNESTO\nTAP Alternate Chairperson – Automotive Sector\nHONDA Phils. Inc.\nParañaque city\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig city\nMR. SIXTO D. CAYPUNO\nTAP Member – Academe\nSamson Technical College\nCubao, Quezon City\nMR. BENITO S. FELIX\nTAP Member – Academe\nTechnological University of the Philippines\nTagig, MM\nMR. ANGEL Y. DIMALANTA\nTAP Member – Labor\nTOYOTA Motors Philippines, Corp.\nBicutan, Parañaque, MM.\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nDRIVER\nMR. ELY G. PRELIGERA\nMR. PEDRO N. BANGALAN\nSucat FX Drivers Association\nMR. RODOLFO B. VELASCO\nRBV Auto Management and Consultancy\nNew Manila, Quezon city\nMR. JAMES N. REGATO\nSucat Parañaque Jeepney Drivers Association\nMR. BENIGNO L. AQUINO\nToyota Motors Phils.\nCanlubang, Laguna\nThe PARTICIPANTS in the Review and Validation of this Training Regulations\nMS. DAISY P. JACOBO\nChief, Traffic Safety Division\nLTO East Ave. Quezon city\n\nMR. JOSE B. VELASCO\n MR. NONATO B. MARTIN MR. FREDMAR C. SALVADOR\nFEJODAP/HERDIVIJODA\nThe Members of the TESDA Board\nThe EXECUTIVE COMMITTEE (EXCOM), TESDA Secretariat\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• SSCO\n•\nNITVET\n•\nOFTVET\n•\nOCSA"
