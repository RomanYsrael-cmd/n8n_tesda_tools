        "source_title": "IMPLEMENT AND COORDINATE ACCIDENT- EMERGENCY PROCEDURES",
        "source_text": "--- PDF PAGE 47 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n45\n \n \n \nUNIT OF COMPETENCY: IMPLEMENT AND COORDINATE ACCIDENT-\nEMERGENCY PROCEDURES \n \nUNIT CODE: ALT832304 \n \nUNIT DESCRIPTOR: This unit involves the skills, knowledge and attitudes required in \nresponding to emergency incidents, follow-up support and assistance and \ncommunicate to concerned individual during emergency. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Respond to \nemergencies \n \n1.1 Emergency and potential emergency situations are \nidentified and assessed based on emergency procedure. \n1.2 Actions are prioritized and provided based on the \ncriticality of the emergency situation. \n1.3 Incident reports are prepared in accordance with \nregulatory and workplace procedures \n1.4 Responsibilities are fulfilled in accordance with \nemergency procedures and/or regulatory requirements \n2. Arrange follow-\nup support and \nassistance \n2.1 Medical assistance and support is arranged in \naccordance with workplace procedures \n2.2 First aid is applied in accordance with medical procedure \n2.3 Passenger needs are identified and provided based on \nemergency situation.\n\n--- PDF PAGE 48 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n46\n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Emergency \nEmergency situation and incidents may include the following \nbut not limited to: \n1.1 Vehicle collision \n1.2 Crime incidents (hold-up, kidnapping and related crimes) \n1.3 Hit and run \n1.4 Fire resulted from engine overheating or faulty electric \nwiring\n2. Responsibilities \n2.1 Reporting to police authority \n2.2 Facilitate Insurance claim \n2.3 Informing victim’s relatives \n2.4 Respond to investigation and authority inquiry\n3. Action  \n3.1 Facilitating medical assistance \n3.2 Transporting of injured passenger to the nearest  \n      medical facility \n3.3 Transporting of road crime victim to police station \n3.4Giving reminders to passengers while on board the public   \ntransport vehicle  \n3.5 Providing assistance in controlling the site both prior to \nand following arrival of emergency services\n\n--- PDF PAGE 49 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n47\n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate \n1.1  Responded to emergency situations \n1.2  Arranged follow-up support and assistance \n2. Underpinning \nknowledge and \nattitudes \n2.1 Relevant OHS and environmental procedures and \nregulations \n2.2 Kinds of emergency situations \n2.3 Procedure to be followed in the event of emergency \n2.4  Problem that may arise during emergency situations \n2.5  First aid practices \n2.6  Kinds of body injury and how to deal with them \n2.7 Positive work values (Honesty, Presence of mind, \nCompassion, etc.)\n3 Underpinning \nskills \n3.1 Appropriate reporting and preparing of necessary  \ndocumentation to authority and medical personnel \n3.2 Handling injured person \n3.3 Transporting injured persons \n3.4  Handling and use of fire extinguishers \n3.5  Following emergency procedures \n3.6 Handling crime situations\n4 Resource \nimplications \nThe following resources MUST be provided: \n4.1 Simulation equipment and materials  used for \ndemonstrating emergency situation  \n4.2  Vehicle unit \n4.3  A well-ventilated and lighted  room with table and chairs \nfor written/oral examination\n5 Method of \nassessment \nCompetency must be assessed through: \n5.1 Demonstration of the task in implementing and \ncoordinating accident-emergency procedures \n5.2  Interview \n5.3Written/oral exam\n6 Context for \nassessment \n6.1 Competency must be assessed in actual workplace or \nsimulated environment  \n6.2 Assessment of competence must comply with the  \nassessment requirements of the relevant Road and traffic \ncontrol Authority\n",
