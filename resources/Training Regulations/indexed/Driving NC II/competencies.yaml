        "source_text": "ALT832302\n\nUNIT DESCRIPTOR: This unit involves the skills and knowledge and attitudes\nrequired to drive a light vehicle safely including handling of passengers, systematic\nand efficient control of all vehicle functions, monitoring of traffic and road conditions,\nmanagement of vehicle condition, and performance and effective management of\nhazardous situations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform light\nvehicle pre-\nstarting and\nwarm-up\n1.1 Vehicle inspection is performed as per manufacturer’s\nspecification\n1.2 Safety harness/devices and tools are checked according to\nLTO/LTFRB requirements\n1.3 Warm up of light vehicle is performed as per manufacturer's\nmanual\n2. Drive light\nvehicle\n2.1 Light vehicle is driven in accordance with traffic rules and\nregulations and manufacturer’s instruction\n2.2 Driving hazards are identified and/or anticipated and avoided or\ncontrolled through defensive driving as per standard operating\nprocedures.\n2.3 The Light vehicle is parked, shut down and secured in accordance\nwith manufacturer’s specifications, traffic regulations and\nworkplace procedures\n2.3 Passengers and loads are transported up to the route assigned\nand fares are collected as per LTFRB regulations\n2.5 Driving is performed according to the restriction and condition\nstated in the official receipt license and within the occupational\nhealth and safety standards (OHS).\n2.7 Out-of line/anti carnapping clearance permit is secured as per\ntraffic rules and regulations\n3. Monitor and\nmaintain\nvehicle\nperformance\n\n3.1 Defective or irregular performance or malfunctions are monitored\nand reported to the appropriate person/authority.\n3.2 Minor vehicle maintenance is performed in accordance with\nmanufacturer's instruction\n3.3 Vehicle records are maintained/updated in accordance with\nworkplace procedures\n\n--- PDF PAGE 41 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Vehicle\ninspection\n1.1 Lights (head light, park light, signal lights, hazard, etc.)\n1.2 Mirrors (rear view, side view, windshields, etc.)\n1.3 Under hood\n1.4 Underchassis\n1.5Passenger seats\n2. Light Vehicle\n2.1 Private car\n2.2 Owner type jeepney\n2.3 Taxicab\n2.4Public utility jeepney\n3. Fares\n3.1 Taximeter\n3.2 Fare matrix\n4. Safety\nharness/devices\n& tools\n4.1 Seat belt\n4.2 Early Warning Device\n4.3 Handtools (Wrench, pliers, screwdriver, early warning\ndevice, jack, spare tires)\n4.4 Flashlights or emergency lighting device\n4.5 Consumable materials and spare parts such as\n• Rags\n• Fan belt\n• Wheel cap\n• Fuse\n• Electrical tapes\n• Brake fluid\n• Motor oil\n5. Traffic\nregulations\n5.1 Registration, driving license and other relevant permits\n5.2 Use of seat belt\n5.3 Availability of EWD\n5.4 Observance of franchise route\n5.5 Use of uniform\n5.6 Compliance with vehicle emission standards\n\n--- PDF PAGE 42 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n40\n\n6. Driving hazards\n6.1 Stalled vehicles and other road obstruction\n6.2 Excavation and road repairs\n6.3 Flood\n6.4 Heavy traffic volume\n6.5 Accidents\n6.6 Heavy rains and typhoons\n6.7 Fog/smog\n6.8 Uncentered force of gravity or inertia\n6.9 Slippery roads\n6.10 Winding and zigzag road\n6.11 Blind corners\n6.12 Humps\n6.13 Unattended children along streets\n6.14 Stray animals\n6.15 Open manhole\n6.16 Reckless and uncooperative drivers\n6.17 Loose stones\n6.18\nMental and physical fatigue\n7. Occupational\nHealth & Safety\n7.1 Safety in handling vehicle and passengers while driving\n7.2 Safety on road and traffic management including\nmanagement of pedestrians\n7.3 Use of personal protective equipment and devices such\nas uniform, gas mask, gloves , sunglasses, shoes, cap\n7.4 Use of seat belt and early warning devices\n\n--- PDF PAGE 43 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n41\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Performed pre-operational and warm up\n1.2 Drove light vehicle\n1.3Transported passengers and other loads to destination\n safely.\n1.4 Monitored and maintained vehicle performance\n1.5 Followed OHS and environmental protection procedures and\nregulations\n1.6 Followed emergency procedures\n2 Underpinning\nknowledge and\nattitudes\n2.1 Relevant OHS and environmental procedures and regulations\n2.2 Parts of light vehicle and its functions\n2.3 Knowledge on passenger behavior/customer relation\n2.4 Types of load or cargo\n2.5 Procedure on how to drive the light vehicle\n2.6 Procedure to be followed in the event of emergency and\n road related crimes\n2.7 Engine power management and safe driving strategies\n2.8 Fatigue management techniques\n2.9 Principle of stress management when driving a vehicle\n2.10 Traffic rules and regulations\n2.11 Kinds of traffic violations\n2.12 Positive work values (Honesty, Patience, Perseverance,\nCourtesy, etc.)\n3 Underpinning\nskills\n3.1 Computing fares and distances\n3.2 Managing fatigue while driving\n3.3 Reading/Interpreting traffic signs and symbols and road\n advisory\n3.4 Maintaining proper distance and speed\n3.5 Responding to road-related accidents and crimes\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Light vehicle with appropriate tools/instruments for actual\nperformance of works\n4.2 Driver's Manual\n4.3 Ample space for driving including traffic signs and symbols for\ndriving and maneuvering the light vehicle, assistance of other\npersons to act as passengers and traffic enforcer\n5 Method of\nassessment\nCompetency must be assessed through\n5.1 Direct observation/Demonstration with Questioning\n5.2 Interview\n5.2 Written/Oral test\n6 Context for\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n6.2 Assessment of competence must comply with the assessment\nrequirements of the relevant Road and traffic control Authority\n\n--- PDF PAGE 44 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n42\n\nUNIT OF COMPETENCY: OBEY AND OBSERVE TRAFFIC RULES AND\n REGULATIONS\nCODE:"
