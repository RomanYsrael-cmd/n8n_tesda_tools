ABLE \nRANGE \n1 \n Traffic signs \nTraffic signs include but not limited to: \n1.1.1 No blowing of horns \n1.1.1 Yield \n1.1.1 No Parking \n1.1.1 One way \n1.1.1 No U-turn\n2 \nRoad Markers \n2.1.1 Merging traffic \n2.1.1 No overtaking \n2.1.1 Pedestrian lane \n2.1.1 Total stop\n3 \nTraffic rules \nand  \nregulations  \nTraffic rules and regulations include: \n3.1.1 Road obstruction \n3.1.1 Illegal terminal \n3.1.1 Wearing of safety belts \n3.1.1 Observing the Unified Vehicle Volume Reduction \nScheme \n3.1.1  Driving license/registration/franchise/Official receipt \nand certificate of registration (ORCR) \n3.1.1  No using of cellphone while driving \n3.1.1 Avoiding driving under the influence of drugs or \nalcohol\n4 \nPrescribed \nAttire/Outfit \nProper attire or outfit prescribed by law include but not limited \nto: \n4.1.1 Blue polo for PUJ drivers \n4.1.1 White polo for taxicab drivers \n4.1.1 Shoes \n4.1.1 Long pants\n\n--- PDF PAGE 46 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n44\n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate \n1.1 Followed traffic signs and road markers \n1.2 Obeyed traffic rules and regulations \n1.3 Practiced courtesy and good communication \n1.4 Respected traffic enforcers and other traffic management \nunits. \n2. Underpinning \nknowledge and \nattitude \n2.1 Traffic signs and symbols \n2.2 Road markers \n2.3 Traffic rules and regulations \n2.4 Defensive driving techniques \n2.5 Positive work values  \n2.6 Driver's Code of ethics  \n2.7 Different Traffic Enforcers \n2.8 Traffic violations and penalties \n2.9Good grooming\n3. Underpinning \nskills \n3.1  Communication skills \n3.2  Interpersonal skills \n3.3 Managing conflict\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Light Vehicle  \n4.2 Ample space with traffic signs and symbols for driving and \nmaneuvering the vehicle, persons to act as passengers and \ntraffic enforcer \n4.2 Well lighted and ventilated room with  table and chairs for \nwritten/oral assessment \n5. Method of \nassessment \nCompetency must be assessed through: \n5.1 Direct observation \n5.2  Demonstration  \n5.3 Interview \n5.4 Written or Oral test/interview for the assessment of \nunderpinning knowledge\n6. Context for \nassessment \n6.1 Competency must be assessed in actual workplace or \nsimulated environment  \n6.2 Assessment of competence must comply with the assessment \nrequirements of the relevant Road and traffic control Authority\n",
