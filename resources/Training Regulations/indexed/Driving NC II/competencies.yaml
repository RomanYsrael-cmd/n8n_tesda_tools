        "source_title": "Carry out minor vehicle maintenance and servicing",
        "source_text": "--- PDF PAGE 36 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n34\n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:  CARRY OUT MINOR VEHICLE MAINTENANCE AND \nSERVICING \n \nCODE NO.: ALT723348 \n  \nUNIT DESCRIPTOR: This unit involves the skills and knowledge and attitudes \nrequired to carry out basic servicing and maintenance of a light vehicle such as \ncleaning the vehicle. It also includes the action to implement the vehicle \nmanufacturer’s specifications for routine checks and maintenance and that the vehicle \nis operational to the requirements of both the workplace and the relevant road and \ntraffic authority. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Clean vehicle \nunit \n1.1 Vehicle is cleaned as per prescribed procedures using \nappropriate cleaning supplies, tools/ equipment and \naccording to occupational health and safety (OHS). \n1.2 Wastes are disposed of as per relevant ordinance, rules or \nlaw.\n2. Maintain and \nservice the \nvehicle system \n \n2.1 Minor routine checks are undertaken based on \nmanufacturer's manual. \n2.2 Minor routine repair and servicing are undertaken in \naccordance with occupational health and safety procedures \nand manufacturer's manual. \n2.3 Brakes are inspected and appropriate action is undertaken \nin accordance with manufacturer's specifications. \n2.4 Complex repair and service requirements are identified and \nreferred following workplace procedures. \n2.5 Records of routine servicing, maintenance and repairs are \nkept and updated in accordance with workplace \nprocedures\n\n--- PDF PAGE 37 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n35\n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Cleaning \nsupplies \nCleaning supplies may include but not limited to: \n1.1 Soap \n1.2 Shampoo \n1.3 Rags \n1.4 Oil \n1.5 Air freshener \n1.6 Polish \n1.7Water\n2. Cleaning Tools \nand Equipment \n2.1 Vacuum cleaner \n2.2 Steam cleaner \n2.3 Mop and basket \n2.4 Pail \n2.5 Polisher \n2.6 Broom \n2.7 Hose \n2.8Pressure Washer\n3. Routine Check \nRoutine checks on vehicle components are done on the \nfollowing but not limited to: \n3.1 Battery \n3.2 Tire air pressure \n3.3  Water level \n3.4  Lights \n3.5  Horn \n3.6  Mirrors \n3.7 Propeller \n3.8 Bolts and nuts tightness \n3.9 Brake fluid \n3.10 Oil level \n3.11 Fan belt  \n3.12\nWheel bearing\n4. Minor routine \nrepairs \nMinor routine repairs include the following but not limited to \nthe replacement of : \n4.1 blown bulbs in vehicle lights \n4.2 broken fan belt \n4.3 blown fuse \n4.4 broken side mirrors \n4.5 rear tail-light lens \n4.6 tires \n4.7 broken coolant hose \n4.8 worn out wheel caps \n4.9brake shoe/pad\n\n--- PDF PAGE 38 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n36\n \n \n5. Minor routine \nservicing \nMinor routine servicing may include the following but not \nlimited to: \n5.1 Topping up of water/coolant levels and brake fluid \n5.2 Change/topping of engine oils \n5.3 Air pressure set of tires \n5.4 Addition of gear oil \n5.5 Repacking/greasing of bearing ball joints, tie rod end \n5.6 Tire rotation \n5.7 Cleaning of battery terminals\n6. Occupational \nHealth and \nSafety  \n \n6.1 Use of personal protective equipment such as: \n Gloves \n Gas mask \n Apron \n Eye goggles \n6.2  Open space ventilation for work area \n6.3 Provision of fire extinguisher in work area\n\n--- PDF PAGE 39 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n37\n \nEVIDENCE GUIDE \n \n1. Critical \naspects of \ncompetency \nAssessment requires evidence that the candidate \n1.1 Diagnosed basic vehicle faults and undertake \nadjustment/repairs  \n1.2 Carried out routine servicing and maintenance of vehicle \nsystem \n1.3 Identified complex servicing and maintenance problems \n1.4 Demonstrated safety, environmental and hazard control \nprecautions and procedures during routine maintenance \noperations \n1.5 Communicated effectively with others in carrying out vehicle \nmaintenance\n2 Underpinning \nknowledge \nand attitudes \n2.1 Relevant OHS and pollution control procedures \n2.2 Procedure for checking and routine service and maintenance \nof a vehicle  \n2.3 Problems that may occur during routine servicing and \nmaintenance of a vehicle and appropriate actions and \nsolutions \n2.4 Faults and irregularities that may occur in vehicles. \n2.5 Principles of operation of vehicle system such as electrical \nsystem, fuel system, cooling system, steering system, \nexhaust system, tires, brakes \n2.6  Basic fault finding procedures required during routine \nservicing and maintenance of vehicles \n2.7 Uses of tools materials, and parts  for routine servicing and \nmaintenance \n2.8 Positive Work Values (Honesty, Quality, Common Sense \nPatience Concern for Safety) \n2.9 5 S\n3 Underpinning \nskills \n3.1 Recognizing and diagnosing vehicle faults and irregularities \n3.2  Performing housekeeping  \n3.3 Writing and documenting simple report  \n3.4 Communicating skills \n3.5Handling tools and materials\n4 Resource \nimplications \nThe following resources must be provided: \n4.1 Light vehicle \n4.2 Supplies and materials relevant to the task \n4.3  Workplace for conducting routine servicing and maintenance \n4.4 A small room for written examination\n5 Method of \nassessment \nCompetency must be assessed through  \n5.1 Observation or Demonstration of skills  \n5.2  Interview \n5.3 Written or Oral test for the assessment of underpinning \nknowledge\n6 Context for \nassessment \n6.1 Practical assessment must be conducted at TESDA \naccredited assessment centers and/or in an appropriate work \nsituation\n",
