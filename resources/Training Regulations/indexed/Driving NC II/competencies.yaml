        "source_title": "PERFORM MENSURATION AND CALCULATION",
        "source_text": "--- PDF PAGE 18 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n16\n \n \nCOMMON COMPETENCIES \n \n \n \n \n \nAUTOMOTIVE \n \n \nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION \n \nUNIT CODE: ALT311202 \n \nUNIT DESCRIPTOR: \nThis unit includes identifying caring, handling and use of \nmeasuring instruments. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n \n1. Select  measuring   \n \n instruments \n \n1.1 Object or component to be measured is identified \n1.2 Correct specifications are obtained from relevant source \n1.3 Appropriate measuring instrument is selected according to \njob requirements\n \n2. Carry out  \n     measurements  \n     and calculation \n \n \n2.1 Measuring tools are selected in line with job requirements \n2.2 Accurate measurements are obtained to job \n2.3 Calculation needed to complete work tasks are performed  \n       using the four basic process of addition (+), subtraction (-),  \n       multiplication (x) and division (/). \n2.4 Calculations involving fractions, percentages and mixed  \n       numbers are used to complete workplace tasks. \n2.5 Numerical computation is self-checked and corrected for  \n       accuracy \n2.6 Instruments are read to the limit of accuracy of the tool.\n      \n3. Maintain  \nmeasuring \ninstruments \n \n3.1 Measuring instruments must kept free from corrosion \n3.2 Measuring instruments not dropped to avoid damage \n3.3 Measuring instruments cleaned before and after using.\n\n--- PDF PAGE 19 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n17\n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Measuring \ninstruments \nMeasuring instruments \nincludes: \n \n1.1 Multitester \n1.2 Micrometer (In-out, depth) \n1.3 Vernier caliper (Out, \ninside) \n1.4 Dial Gauge with Mag. Std. \n1.5 Plastigauge \n1.6 Straight Edge \n1.7 Thickness gauge\n \n \n \n1.8 Torque Gauge \n1.9 Small Hole gauge \n1.10 Telescopic Gauge \n1.11 Try square \n1.12 Protractor \n1.13 Combination gauge \n1.14 Steel rule  \n \n2. Calculation \n \nKinds of Part Mensuration include: \n2.1 Volume \n2.2 Area \n2.3 Displacement \n2.4 Inside diameter \n2.5 Circumference \n2.6 Length \n2.7 Thickness \n2.8 Outside diameter \n2.9 Taper \n2. 10 Out of roundness \n2.11Oil clearance \n2.12 End play/thrust clearance\n\n--- PDF PAGE 20 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n18\n \n \nEVIDENCE GUIDE \n \n \n1. Critical aspect \nof competency \n \n \nAssessment requires evidence that the candidate: \n1.1 Selected measuring instruments \n1.2 Carried-out measurements and calculations. \n1.3 Maintained measuring instruments\n \n2. Underpinning \nknowledge and \nattitudes \n \n2.1 Types of Measuring instruments and its uses \n2.2 Safe handling procedures in using measuring instruments \n2.3 Four fundamental operation of mathematics \n2.2 Formula for Volume, Area, Perimeter and other geometric \nfigures\n \n3. Underpinning     \n      skills \n \n3.1 Caring and Handling measuring instruments \n3.2 Calibrating and using measuring instruments \n3.1 Performing calculation by  Addition, Subtraction, \nMultiplication and Division \n3.2  Visualizing objects and shapes \n3.3  Interpreting formula for volume, area, perimeter and other \ngeometric figures\n \n4. Resource     \n      implication \nThe following resources must be provided: \n4.1 Workplace location \n4.2 Measuring instrument appropriate to servicing processes \n4.3 Instructional materials relevant to the propose activity \n \n5. Methods of  \n    assessment \n \nCompetency must be assessed through: \n5.1 Observation with questioning \n5.2 Written or oral examination \n5.3 Interview \n5.4 Demonstration with questioning\n \n6. Context for  \n    assessment \n \n \n6.1 Competency elements must be assessed in a safe \n       working environment \n1.1 Assessment may be conducted in a workplace or  \n      simulated environment\n\n--- PDF PAGE 21 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n19\n \n \nUNIT TITLE:  READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS. \n \nUNIT CODE: ALT723203 \n \nUNIT DESCRIPTOR:  This unit deals with identifying, interpreting and applying service \nspecification manuals, maintenance procedure manuals and \nperiodic maintenance manual. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Identify and \naccess   \n      manual/   \n     specification\n \n1.1 Appropriate manuals are identified and accessed as per \njob requirements. \n1.2 Version and date of manual is checked to ensure correct \nspecification and procedure are identified.\n \n2.  Interpret manuals \n \n2.1 Relevant sections, chapters of manuals/specifications \nare located in relations to the work to be conducted \n2.2 Information and procedure in the manual are interpreted \nin accordance to industry practices\n \n3. Apply information \nin manual \n \n \n3.1 Manual is interpreted according to job requirements \n3.2 Work steps are correctly identified in accordance with \nmanufacturer specification \n3.3 Manual data is applied according to the given task \n3.4 All correct sequencing and adjustments are interpreted in \naccordance with information contained on the manual or \nspecifications\n \n4. Store manuals \n \n4.1 Manual or specification are stored appropriately to  \n      ensure prevention of damage, ready access and  \n      updating of information when required in accordance  \n      with company requirements\n\n--- PDF PAGE 22 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n20\n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Manuals \n \n Kinds of manuals: \n1.1 Manufacturer’s specification manual \n1.2 Repair manual \n1.3 Maintenance Procedure Manual \n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 23 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n21\n \nEVIDENCE GUIDE \n \n \n1.Critical aspect of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Identified and accessed manual/specification \n1.2 Interpreted manuals \n1.3 Applied information in manuals \n1.4 Stored manuals \n \n2. Underpinning  \nknowledge and \nattitudes \n \n2.1 Types of manuals used in automotive industry \n2.2 Identification of symbols used in the manuals \n3.1 Identification of units of measurements \n3.2 Unit conversion\n \n3. Underpinning \nskills \n \n3.1 Reading and comprehension skills required to identify \nand interpret automotive manuals and specifications \n3.2 Accessing information and data\n \n4. Resource \nImplication \n \nThe following resources must be provided: \n4.1  All manuals/catalogues relative to Automotive \n4.2  Job order, requisitions \n4.3  Actual vehicle or simulator \n \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1 Observation with questioning \n5.2 Interview  \n \n6. Context for \nassessment  \n \n \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n       simulated environment.\n",
