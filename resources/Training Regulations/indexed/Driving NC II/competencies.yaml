  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in DRIVING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills\nare used to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage\nof information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others\nare listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose\nand established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n4\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context for\nAssessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n5\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and\nobjectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n7\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning Skills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n 4.2. Materials relevant to the proposed activity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to\nthe work activities of the group\n5.2.\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are maintained\nin the course of managing oneself based on performance\nevaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n1.\nSet and meet work\npriorities\n2.1 Competing demands are prioritized to achieve personal,\nteam and organizational goals and objectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n2.\nMaintain\nprofessional growth\nand development\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated\nas proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n9\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n10\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed training and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n11\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE : 500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 14 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly used\nin accordance with organization OHS procedures and\npractices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 15 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n13\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\n gasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 16 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n14\n\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal\nrecords\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 17 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n15\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\n Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n3. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n4. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n5. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n16\n\nCOMMON COMPETENCIES\n\nAUTOMOTIVE\n\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit includes identifying caring, handling and use of\nmeasuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to\njob requirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\n using the four basic process of addition (+), subtraction (-),\n multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments must kept free from corrosion\n3.2 Measuring instruments not dropped to avoid damage\n3.3 Measuring instruments cleaned before and after using.\n\n--- PDF PAGE 19 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n17\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments\nincludes:\n\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Plastigauge\n1.6 Straight Edge\n1.7 Thickness gauge\n\n1.8 Torque Gauge\n1.9 Small Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n\n2. Calculation\n\nKinds of Part Mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 20 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n18\n\nEVIDENCE GUIDE\n\n1. Critical aspect\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.2 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Underpinning\n skills\n\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.1 Performing calculation by Addition, Subtraction,\nMultiplication and Division\n3.2 Visualizing objects and shapes\n3.3 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implication\nThe following resources must be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Methods of\n assessment\n\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context for\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n1.1 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 21 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n19\n\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and\nperiodic maintenance manual.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per\njob requirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications\nare located in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted\nin accordance to industry practices\n\n3. Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 22 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n20\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 23 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n21\n\nEVIDENCE GUIDE\n\n1.Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n3.1 Identification of units of measurements\n3.2 Unit conversion\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify\nand interpret automotive manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nImplication\n\nThe following resources must be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6. Context for\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 24 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n22\n\nUNIT OF COMPETENCY: MOVE AND POSITION VEHICLE\n\nUNIT CODE: ALT723202\n\nUNIT DESCRIPTOR: This competency unit covers the knowledge, skills and attitude\nneeded to move and position vehicle in a workshop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare vehicle for\n driving\n\n1.1 Correct check-up procedures performed based on\n vehicle manufacturer standard\n\n2. Move and position\n vehicle\n\n2.1 Select vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3 Park vehicle following parking safety techniques\nand procedure\n\n3. Check the vehicle\n\n3.1 Vehicle position is checked as per required\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 25 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n23\n\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n\n1. Check up procedure\nCheck up procedures include the following:\n1.1 Oil level\n1.2 Brake fluid\n1.3 Clutch fluid\n1.4 Coolant level\n1.5 Battery (electrolyte)\n1.6 Tire pressure\n1.7 Position of driving gear\n1.8 Lighting and warning devices\n\n2. Vehicles\n\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n\n3.Parking safety\n techniques\n\n3.1 Engaging of Park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 26 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n24\n\nEVIDENCE GUIDE\n\n1.Critical aspect of\n competency\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for driving.\n1.2 Moved and positioned vehicle\n1.3 Checked the vehicle.\n\n2. Underpinning\n knowledge and\n attitudes\n2.1 Driver’s Code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4Vehicle accessories for safe driving and parking\n\n3. Underpinning skills\n\n3.1 Ability to handle vehicle/maneuver vehicle the easiest\n way\n3.2 Immediate response to accident\n3.3 Preparing vehicle for driving\n3.4 Parking Downhill, Uphill, Parallel\n3.5 Shifting Gears\n3.6Maneuvering\n\n4. Resource\n implication\nThe following resources must be provided:\n4.1 Driving range/area\n4.2 Appropriate vehicle for driving\n4.3 Vehicle accessories\n\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n\n6. Context for\n assessment\n6.1 Assessment must be undertaken in accordance with the\n endorsed TESDA assessment guidelines\n1.2 Assessment of practical skills must be done in a\n workplace or simulated environment.\n\n--- PDF PAGE 27 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n25\n\nUNIT OF COMPETENCY: APPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE: ALT723201\n\nUNIT DESCRIPTOR: This competency unit covers the selection and application of\nsealant/adhesives.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1Sealant/adhesive selected in line with job requirements\n and manufacturer’s specification\n1.2 Sealant/adhesive checking is performed to ensure that\nproduct is fit for use.\n2. Prepare surface for\nSealant/adhesive\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nsealant/adhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in line\n with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n3.3Tools and equipment used to apply sealant/adhesive\nare appropriate to job requirements\n3.4 Safety are observed and PPE are worn in accordance\nwith industry SOP\n3.5 Hazards associated with the use of sealant and\nadhesives are identified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed\nprocedure\n4.2 Waste are disposed as per workshop SOP\n\n--- PDF PAGE 28 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n26\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n\n2. Tools and equipment\nTools and equipment include:\n2.1 Putty knife\n2.2 Scraper\n2.3 Compressor\n2.4 Steel brush\n2.5 Paint brush\n2.6 Rubber hammer\n2.7 Hand tools\nPersonal protective equipment include:\n2.8 Gloves\n2.9 Apron\n2.10 Safety shoes\n2.11Goggles\n2.12Gas mask\n\n3. Safety\nSafety includes:\n3.1 Ventilation\n3.2 Handling of Flammable/Irritating substances\n3.3 Use of Personal Protective Equipment\n\n4. Hazards\n Hazard includes:\n4.1 Fumes\n4.2 Skin irritation\n4.3 Burns\n\n5. Adhesive/Sealant\n checking\n\nAdhesive/Sealant checking includes:\n5.1 Expiry date\n5.2 Free of contamination\n5.3 Cap/Covers\n5.4 Tightly closed\n5.5Concentration\n\n--- PDF PAGE 29 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n27\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n\n2. Underpinning\nknowledge and\nattitude\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.3 Procedures in sealant/adhesive application\n2.4 Procedures in interpreting manuals\n\n3. Underpinning skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3.Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n\n4. Resource\n implication\nThe following resources must be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Methods of\n assessment\n\nCompetency must be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n•Application of adhesive/sealant\n\n6.Context for\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or\nsimulated environment\n\n--- PDF PAGE 30 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n28\n\nUNIT OF COMPETENCY: USE AND APPLY LUBRICANTS/COOLANT\n\nUNIT CODE: ALT723204\n\nUNIT DESCRIPTOR: This unit identifies the competencies required to select and\n apply different types of lubricants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify types of\nlubricants/ coolant\n1.1 Correct information on lubrication schedule is\naccessed and interpreted from appropriate\nmanufacturers specifications manuals\n1.2 Type and quantity of lubricants/coolant is identified as\nper job requirements\n\n2. Use and apply\n lubricants/coolant\n2.1 Correct procedure for change of lubricant is identified\nfollowing manufacturer’s specification or manual\n2.1 Correct tools and equipment are selected and used in\n line with job requirements\n2.3 Existing lubricants is removed and replaced with\nspecified types and quantity of new materials in line with\nmanufacturer’s specification\n2.4 Safe procedure and use of PPE is observed when\nremoving or replacing lubricant\n2.5 Used lubricants are disposed in accordance with\n environmental guidelines\n2. 6 Work is checked in line with company SOP.\n\n3. Perform\nhousekeeping\nactivities\n\n3.1. Tools, equipment and materials are properly stored as\nper company SOP\n3.2 Workplace is free from waste materials\n\n--- PDF PAGE 31 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n29\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Manuals\n\n1.1 Manufacturer’s specification manual\n1.2 Periodic Maintenance manual\n1.3 Service Manual\n2.Lubricants/ Coolant\n\nKinds of lubricants include:\n2.1 Engine oil:\n•\nDiesel engine oil\n•\nGasoline engine oil\n2.2 Automatic Transmission Fluid\n•\nDestro II\n•\nT4\n2.3 Gear oil lubricants:\n•\nOil #90\n•\nOil #140\n•\nOil #30\n•\nOil #40\n2.4 Grease\n• Special (velocity joint)\n Molybdenum disolfate)\n• Ordinary\n• Multi-purpose oil\n• Contact point lubricant\n (grease)\n2.5 Brake/Clutch System\n•\nBrake fluid\n•\nDOT3\n\n2.6 Power Steering Fluid\n•\nHydraulic Fluid\n\n2.7 Radiator Coolant\n•\nLong last coolant\n\n2.8 A/C Compressor Oil\n•\nPag oil\n3. Lubricant\n Schedule\nSchedule for changing oil:\n3.1 Kilometers traveled used\n3.2 No. of Hours used\n3.3 Monthly\n4. Tool and\n equipment\nTools used includes:\n4.1 Hand tools\n4.2 Oiler\n4.3 Oil Dispenser\n4.4 Grease gun\n5. Personal\nProtective\nEquipment (PPE)\n\nPPE include:\n5.1 Apron\n5.2 Gloves\n5.3 Goggles\n5.4 Safety shoes\n\n--- PDF PAGE 32 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n30\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types/Classification of Lubricants\n2.2 Identifying lubrication schedule\n2.3 Cause and Effects of Gear Oil Dilution\n2.4 Purpose of Lubrication (Problem and effects)\n2.5 Hazard associated with lubrication\n\n3. Underpinning skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3 Lubrication Procedure\n\n4. Resource\nimplication\n\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to activity\n\n5. Methods of\nassessment\n\nCompetency must be assessed through\n5.1 Demonstration with questioning\n5.2 Written/Oral examination\n\n6. Context for\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment must be undertaken in accordance with the\n endorsed industry assessment guidelines\n6.3 Assessment of underpinning knowledge and skills may be\n assessed on or off the job\n\n--- PDF PAGE 33 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n31\n\nUNIT OF COMPETENCY: PERFORM SHOP MAINTENANCE\n\nUNIT CODE: ALT723307\n\nUNIT DESCRIPTOR: This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and checking of\ntools/ equipment and disposal of used materials are also\nincorporated in this competency\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n.\n1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n\n3. Dispose wastes/used\nlubricants\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared has no error/discrepancy\n\n--- PDF PAGE 34 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Area\nWork areas include:\n1.1 Workshop areas for servicing/repairing light and/or heavy\nvehicle and/or\n plant transmissions and/or outdoor power equipment\n1.2 Open workshop/garage and enclosed, ventilated office area\n1.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning\n requirement\n2.1 Cleaning solvent\n2.2 Inventory of supplies, tools, equipment, facilities\n2.3 List of mechanics/technicians\n2.4 Rags\n2.5 Broom\n2.6 Map\n2.7 Pail\n2.8 Used oil container\n2.9 Oiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6 Industry Occupational Health &Safety\n4. Company\nstandard\noperating\nprocedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4 Safety shoes\n\n--- PDF PAGE 35 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n33\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Cleaned workshop tools/facilities\n1.2Maintained equipment, tools and facilities\n1.3Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 36 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n34\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: CARRY OUT MINOR VEHICLE MAINTENANCE AND\nSERVICING\n\nCODE NO.: ALT723348\n\nUNIT DESCRIPTOR: This unit involves the skills and knowledge and attitudes\nrequired to carry out basic servicing and maintenance of a light vehicle such as\ncleaning the vehicle. It also includes the action to implement the vehicle\nmanufacturer’s specifications for routine checks and maintenance and that the vehicle\nis operational to the requirements of both the workplace and the relevant road and\ntraffic authority.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Clean vehicle\nunit\n1.1 Vehicle is cleaned as per prescribed procedures using\nappropriate cleaning supplies, tools/ equipment and\naccording to occupational health and safety (OHS).\n1.2 Wastes are disposed of as per relevant ordinance, rules or\nlaw.\n2. Maintain and\nservice the\nvehicle system\n\n2.1 Minor routine checks are undertaken based on\nmanufacturer's manual.\n2.2 Minor routine repair and servicing are undertaken in\naccordance with occupational health and safety procedures\nand manufacturer's manual.\n2.3 Brakes are inspected and appropriate action is undertaken\nin accordance with manufacturer's specifications.\n2.4 Complex repair and service requirements are identified and\nreferred following workplace procedures.\n2.5 Records of routine servicing, maintenance and repairs are\nkept and updated in accordance with workplace\nprocedures\n\n--- PDF PAGE 37 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n35\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Cleaning\nsupplies\nCleaning supplies may include but not limited to:\n1.1 Soap\n1.2 Shampoo\n1.3 Rags\n1.4 Oil\n1.5 Air freshener\n1.6 Polish\n1.7Water\n2. Cleaning Tools\nand Equipment\n2.1 Vacuum cleaner\n2.2 Steam cleaner\n2.3 Mop and basket\n2.4 Pail\n2.5 Polisher\n2.6 Broom\n2.7 Hose\n2.8Pressure Washer\n3. Routine Check\nRoutine checks on vehicle components are done on the\nfollowing but not limited to:\n3.1 Battery\n3.2 Tire air pressure\n3.3 Water level\n3.4 Lights\n3.5 Horn\n3.6 Mirrors\n3.7 Propeller\n3.8 Bolts and nuts tightness\n3.9 Brake fluid\n3.10 Oil level\n3.11 Fan belt\n3.12\nWheel bearing\n4. Minor routine\nrepairs\nMinor routine repairs include the following but not limited to\nthe replacement of :\n4.1 blown bulbs in vehicle lights\n4.2 broken fan belt\n4.3 blown fuse\n4.4 broken side mirrors\n4.5 rear tail-light lens\n4.6 tires\n4.7 broken coolant hose\n4.8 worn out wheel caps\n4.9brake shoe/pad\n\n--- PDF PAGE 38 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n36\n\n5. Minor routine\nservicing\nMinor routine servicing may include the following but not\nlimited to:\n5.1 Topping up of water/coolant levels and brake fluid\n5.2 Change/topping of engine oils\n5.3 Air pressure set of tires\n5.4 Addition of gear oil\n5.5 Repacking/greasing of bearing ball joints, tie rod end\n5.6 Tire rotation\n5.7 Cleaning of battery terminals\n6. Occupational\nHealth and\nSafety\n\n6.1 Use of personal protective equipment such as:\n• Gloves\n• Gas mask\n• Apron\n• Eye goggles\n6.2 Open space ventilation for work area\n6.3 Provision of fire extinguisher in work area\n\n--- PDF PAGE 39 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n37\n\nEVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Diagnosed basic vehicle faults and undertake\nadjustment/repairs\n1.2 Carried out routine servicing and maintenance of vehicle\nsystem\n1.3 Identified complex servicing and maintenance problems\n1.4 Demonstrated safety, environmental and hazard control\nprecautions and procedures during routine maintenance\noperations\n1.5 Communicated effectively with others in carrying out vehicle\nmaintenance\n2 Underpinning\nknowledge\nand attitudes\n2.1 Relevant OHS and pollution control procedures\n2.2 Procedure for checking and routine service and maintenance\nof a vehicle\n2.3 Problems that may occur during routine servicing and\nmaintenance of a vehicle and appropriate actions and\nsolutions\n2.4 Faults and irregularities that may occur in vehicles.\n2.5 Principles of operation of vehicle system such as electrical\nsystem, fuel system, cooling system, steering system,\nexhaust system, tires, brakes\n2.6 Basic fault finding procedures required during routine\nservicing and maintenance of vehicles\n2.7 Uses of tools materials, and parts for routine servicing and\nmaintenance\n2.8 Positive Work Values (Honesty, Quality, Common Sense\nPatience Concern for Safety)\n2.9 5 S\n3 Underpinning\nskills\n3.1 Recognizing and diagnosing vehicle faults and irregularities\n3.2 Performing housekeeping\n3.3 Writing and documenting simple report\n3.4 Communicating skills\n3.5Handling tools and materials\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Light vehicle\n4.2 Supplies and materials relevant to the task\n4.3 Workplace for conducting routine servicing and maintenance\n4.4 A small room for written examination\n5 Method of\nassessment\nCompetency must be assessed through\n5.1 Observation or Demonstration of skills\n5.2 Interview\n5.3 Written or Oral test for the assessment of underpinning\nknowledge\n6 Context for\nassessment\n6.1 Practical assessment must be conducted at TESDA\naccredited assessment centers and/or in an appropriate work\nsituation\n\n--- PDF PAGE 40 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n38\n\nUNIT OF COMPETENCY:\nDRIVE LIGHT VEHICLE\n\nCODE NO.: ALT832302\n\nUNIT DESCRIPTOR: This unit involves the skills and knowledge and attitudes\nrequired to drive a light vehicle safely including handling of passengers, systematic\nand efficient control of all vehicle functions, monitoring of traffic and road conditions,\nmanagement of vehicle condition, and performance and effective management of\nhazardous situations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform light\nvehicle pre-\nstarting and\nwarm-up\n1.1 Vehicle inspection is performed as per manufacturer’s\nspecification\n1.2 Safety harness/devices and tools are checked according to\nLTO/LTFRB requirements\n1.3 Warm up of light vehicle is performed as per manufacturer's\nmanual\n2. Drive light\nvehicle\n2.1 Light vehicle is driven in accordance with traffic rules and\nregulations and manufacturer’s instruction\n2.2 Driving hazards are identified and/or anticipated and avoided or\ncontrolled through defensive driving as per standard operating\nprocedures.\n2.3 The Light vehicle is parked, shut down and secured in accordance\nwith manufacturer’s specifications, traffic regulations and\nworkplace procedures\n2.3 Passengers and loads are transported up to the route assigned\nand fares are collected as per LTFRB regulations\n2.5 Driving is performed according to the restriction and condition\nstated in the official receipt license and within the occupational\nhealth and safety standards (OHS).\n2.7 Out-of line/anti carnapping clearance permit is secured as per\ntraffic rules and regulations\n3. Monitor and\nmaintain\nvehicle\nperformance\n\n3.1 Defective or irregular performance or malfunctions are monitored\nand reported to the appropriate person/authority.\n3.2 Minor vehicle maintenance is performed in accordance with\nmanufacturer's instruction\n3.3 Vehicle records are maintained/updated in accordance with\nworkplace procedures\n\n--- PDF PAGE 41 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Vehicle\ninspection\n1.1 Lights (head light, park light, signal lights, hazard, etc.)\n1.2 Mirrors (rear view, side view, windshields, etc.)\n1.3 Under hood\n1.4 Underchassis\n1.5Passenger seats\n2. Light Vehicle\n2.1 Private car\n2.2 Owner type jeepney\n2.3 Taxicab\n2.4Public utility jeepney\n3. Fares\n3.1 Taximeter\n3.2 Fare matrix\n4. Safety\nharness/devices\n& tools\n4.1 Seat belt\n4.2 Early Warning Device\n4.3 Handtools (Wrench, pliers, screwdriver, early warning\ndevice, jack, spare tires)\n4.4 Flashlights or emergency lighting device\n4.5 Consumable materials and spare parts such as\n• Rags\n• Fan belt\n• Wheel cap\n• Fuse\n• Electrical tapes\n• Brake fluid\n• Motor oil\n5. Traffic\nregulations\n5.1 Registration, driving license and other relevant permits\n5.2 Use of seat belt\n5.3 Availability of EWD\n5.4 Observance of franchise route\n5.5 Use of uniform\n5.6 Compliance with vehicle emission standards\n\n--- PDF PAGE 42 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n40\n\n6. Driving hazards\n6.1 Stalled vehicles and other road obstruction\n6.2 Excavation and road repairs\n6.3 Flood\n6.4 Heavy traffic volume\n6.5 Accidents\n6.6 Heavy rains and typhoons\n6.7 Fog/smog\n6.8 Uncentered force of gravity or inertia\n6.9 Slippery roads\n6.10 Winding and zigzag road\n6.11 Blind corners\n6.12 Humps\n6.13 Unattended children along streets\n6.14 Stray animals\n6.15 Open manhole\n6.16 Reckless and uncooperative drivers\n6.17 Loose stones\n6.18\nMental and physical fatigue\n7. Occupational\nHealth & Safety\n7.1 Safety in handling vehicle and passengers while driving\n7.2 Safety on road and traffic management including\nmanagement of pedestrians\n7.3 Use of personal protective equipment and devices such\nas uniform, gas mask, gloves , sunglasses, shoes, cap\n7.4 Use of seat belt and early warning devices\n\n--- PDF PAGE 43 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n41\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Performed pre-operational and warm up\n1.2 Drove light vehicle\n1.3Transported passengers and other loads to destination\n safely.\n1.4 Monitored and maintained vehicle performance\n1.5 Followed OHS and environmental protection procedures and\nregulations\n1.6 Followed emergency procedures\n2 Underpinning\nknowledge and\nattitudes\n2.1 Relevant OHS and environmental procedures and regulations\n2.2 Parts of light vehicle and its functions\n2.3 Knowledge on passenger behavior/customer relation\n2.4 Types of load or cargo\n2.5 Procedure on how to drive the light vehicle\n2.6 Procedure to be followed in the event of emergency and\n road related crimes\n2.7 Engine power management and safe driving strategies\n2.8 Fatigue management techniques\n2.9 Principle of stress management when driving a vehicle\n2.10 Traffic rules and regulations\n2.11 Kinds of traffic violations\n2.12 Positive work values (Honesty, Patience, Perseverance,\nCourtesy, etc.)\n3 Underpinning\nskills\n3.1 Computing fares and distances\n3.2 Managing fatigue while driving\n3.3 Reading/Interpreting traffic signs and symbols and road\n advisory\n3.4 Maintaining proper distance and speed\n3.5 Responding to road-related accidents and crimes\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Light vehicle with appropriate tools/instruments for actual\nperformance of works\n4.2 Driver's Manual\n4.3 Ample space for driving including traffic signs and symbols for\ndriving and maneuvering the light vehicle, assistance of other\npersons to act as passengers and traffic enforcer\n5 Method of\nassessment\nCompetency must be assessed through\n5.1 Direct observation/Demonstration with Questioning\n5.2 Interview\n5.2 Written/Oral test\n6 Context for\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n6.2 Assessment of competence must comply with the assessment\nrequirements of the relevant Road and traffic control Authority\n\n--- PDF PAGE 44 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n42\n\nUNIT OF COMPETENCY: OBEY AND OBSERVE TRAFFIC RULES AND\n REGULATIONS\nCODE: ALT832303\n\nUNIT DESCRIPTOR: This unit involves the skills and knowledge and attitudes\nrequired in obeying and observing traffic rules and regulations while driving light\nvehicle.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Observe traffic\nsigns and road\nmarkers\n1.1 Traffic signs and road markers are identified and\nfollowed in accordance with concerned traffic\nauthorities.\n2. Obey traffic rules\nand regulations\n2.1 Traffic rules and regulations are identified and\nfollowed in accordance with concerned traffic authorities.\n\n2.2 License and registrations are maintained as prescribed\nby law.\n\n2.3Driver outfit/attire is worn as prescribed by law.\n3. Practice courtesy\n3.1 Positive work values are demonstrated as per code of\nethics of drivers\n\n3.2 Complaints are responded and handled with respect\nbased on driver's code of ethics\n\n3.3Reminders are conveyed to passengers politely.\n4. Respect traffic\nenforcers and\nother traffic\nmanagement unit\n4.1 Traffic authority instructions are complied as prescribed\nby law.\n\n4.2 Traffic violation tickets/receipts issued by Traffic\nenforcers are accepted and appropriate action is taken.\n\n--- PDF PAGE 45 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n43\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1\n Traffic signs\nTraffic signs include but not limited to:\n1.1.1 No blowing of horns\n1.1.1 Yield\n1.1.1 No Parking\n1.1.1 One way\n1.1.1 No U-turn\n2\nRoad Markers\n2.1.1 Merging traffic\n2.1.1 No overtaking\n2.1.1 Pedestrian lane\n2.1.1 Total stop\n3\nTraffic rules\nand\nregulations\nTraffic rules and regulations include:\n3.1.1 Road obstruction\n3.1.1 Illegal terminal\n3.1.1 Wearing of safety belts\n3.1.1 Observing the Unified Vehicle Volume Reduction\nScheme\n3.1.1 Driving license/registration/franchise/Official receipt\nand certificate of registration (ORCR)\n3.1.1 No using of cellphone while driving\n3.1.1 Avoiding driving under the influence of drugs or\nalcohol\n4\nPrescribed\nAttire/Outfit\nProper attire or outfit prescribed by law include but not limited\nto:\n4.1.1 Blue polo for PUJ drivers\n4.1.1 White polo for taxicab drivers\n4.1.1 Shoes\n4.1.1 Long pants\n\n--- PDF PAGE 46 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n44\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Followed traffic signs and road markers\n1.2 Obeyed traffic rules and regulations\n1.3 Practiced courtesy and good communication\n1.4 Respected traffic enforcers and other traffic management\nunits.\n2. Underpinning\nknowledge and\nattitude\n2.1 Traffic signs and symbols\n2.2 Road markers\n2.3 Traffic rules and regulations\n2.4 Defensive driving techniques\n2.5 Positive work values\n2.6 Driver's Code of ethics\n2.7 Different Traffic Enforcers\n2.8 Traffic violations and penalties\n2.9Good grooming\n3. Underpinning\nskills\n3.1 Communication skills\n3.2 Interpersonal skills\n3.3 Managing conflict\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Light Vehicle\n4.2 Ample space with traffic signs and symbols for driving and\nmaneuvering the vehicle, persons to act as passengers and\ntraffic enforcer\n4.2 Well lighted and ventilated room with table and chairs for\nwritten/oral assessment\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation\n5.2 Demonstration\n5.3 Interview\n5.4 Written or Oral test/interview for the assessment of\nunderpinning knowledge\n6. Context for\nassessment\n6.1 Competency must be assessed in actual workplace or\nsimulated environment\n6.2 Assessment of competence must comply with the assessment\nrequirements of the relevant Road and traffic control Authority\n\n--- PDF PAGE 47 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n45\n\nUNIT OF COMPETENCY: IMPLEMENT AND COORDINATE ACCIDENT-\nEMERGENCY PROCEDURES\n\nUNIT CODE: ALT832304\n\nUNIT DESCRIPTOR: This unit involves the skills, knowledge and attitudes required in\nresponding to emergency incidents, follow-up support and assistance and\ncommunicate to concerned individual during emergency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Respond to\nemergencies\n\n1.1 Emergency and potential emergency situations are\nidentified and assessed based on emergency procedure.\n1.2 Actions are prioritized and provided based on the\ncriticality of the emergency situation.\n1.3 Incident reports are prepared in accordance with\nregulatory and workplace procedures\n1.4 Responsibilities are fulfilled in accordance with\nemergency procedures and/or regulatory requirements\n2. Arrange follow-\nup support and\nassistance\n2.1 Medical assistance and support is arranged in\naccordance with workplace procedures\n2.2 First aid is applied in accordance with medical procedure\n2.3 Passenger needs are identified and provided based on\nemergency situation.\n\n--- PDF PAGE 48 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n46\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Emergency\nEmergency situation and incidents may include the following\nbut not limited to:\n1.1 Vehicle collision\n1.2 Crime incidents (hold-up, kidnapping and related crimes)\n1.3 Hit and run\n1.4 Fire resulted from engine overheating or faulty electric\nwiring\n2. Responsibilities\n2.1 Reporting to police authority\n2.2 Facilitate Insurance claim\n2.3 Informing victim’s relatives\n2.4 Respond to investigation and authority inquiry\n3. Action\n3.1 Facilitating medical assistance\n3.2 Transporting of injured passenger to the nearest\n medical facility\n3.3 Transporting of road crime victim to police station\n3.4Giving reminders to passengers while on board the public\ntransport vehicle\n3.5 Providing assistance in controlling the site both prior to\nand following arrival of emergency services\n\n--- PDF PAGE 49 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n47\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Responded to emergency situations\n1.2 Arranged follow-up support and assistance\n2. Underpinning\nknowledge and\nattitudes\n2.1 Relevant OHS and environmental procedures and\nregulations\n2.2 Kinds of emergency situations\n2.3 Procedure to be followed in the event of emergency\n2.4 Problem that may arise during emergency situations\n2.5 First aid practices\n2.6 Kinds of body injury and how to deal with them\n2.7 Positive work values (Honesty, Presence of mind,\nCompassion, etc.)\n3 Underpinning\nskills\n3.1 Appropriate reporting and preparing of necessary\ndocumentation to authority and medical personnel\n3.2 Handling injured person\n3.3 Transporting injured persons\n3.4 Handling and use of fire extinguishers\n3.5 Following emergency procedures\n3.6 Handling crime situations\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Simulation equipment and materials used for\ndemonstrating emergency situation\n4.2 Vehicle unit\n4.3 A well-ventilated and lighted room with table and chairs\nfor written/oral examination\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration of the task in implementing and\ncoordinating accident-emergency procedures\n5.2 Interview\n5.3Written/oral exam\n6 Context for\nassessment\n6.1 Competency must be assessed in actual workplace or\nsimulated environment\n6.2 Assessment of competence must comply with the\nassessment requirements of the relevant Road and traffic\ncontrol Authority\n\n--- PDF PAGE 50 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n48"
