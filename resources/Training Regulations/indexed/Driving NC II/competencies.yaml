          "source_text": "1. Select  measuring   \n \n instruments \n \n1.1 Object or component to be measured is identified \n1.2 Correct specifications are obtained from relevant source \n1.3 Appropriate measuring instrument is selected according to \njob requirements\n \n2. Carry out  \n     measurements  \n     and calculation \n \n \n2.1 Measuring tools are selected in line with job requirements \n2.2 Accurate measurements are obtained to job \n2.3 Calculation needed to complete work tasks are performed  \n       using the four basic process of addition (+), subtraction (-),  \n       multiplication (x) and division (/). \n2.4 Calculations involving fractions, percentages and mixed  \n       numbers are used to complete workplace tasks. \n2.5 Numerical computation is self-checked and corrected for  \n       accuracy \n2.6 Instruments are read to the limit of accuracy of the tool.\n      \n3. Maintain  \nmeasuring \ninstruments \n \n3.1 Measuring instruments must kept free from corrosion \n3.2 Measuring instruments not dropped to avoid damage \n3.3 Measuring instruments cleaned before and after using.\n\n--- PDF PAGE 19 ---\n______________________________________________________________________________________    \nTR - DRIVING NC II                                                                                        Promulgated December 2004                           \n17\n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Measuring \ninstruments \nMeasuring instruments \nincludes: \n \n1.1 Multitester \n1.2 Micrometer (In-out, depth) \n1.3 Vernier caliper (Out, \ninside) \n1.4 Dial Gauge with Mag. Std. \n1.5 Plastigauge \n1.6 Straight Edge \n1.7 Thickness gauge\n \n \n \n1.8 Torque Gauge \n1.9 Small Hole gauge \n1.10 Telescopic Gauge \n1.11 Try square \n1.12 Protractor \n1.13 Combination gauge \n1.14 Steel rule  \n \n2. Calculation \n \nKinds of Part Mensuration include: \n2.1 Volume \n2.2 Area \n2.3 Displacement \n2.4 Inside diameter \n2.5 Circumference \n