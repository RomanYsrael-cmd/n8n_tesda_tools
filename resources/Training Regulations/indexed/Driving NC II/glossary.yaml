      "term": "13.",
      "definition": "Public Utility Jeepney (PUJ) - Refers to a locally manufactured and modified jeepney-type vehicle intended to carry as much passengers as prescribed and authorized by Land Transportation Franchise Regulatory Board (LTFRB) as approved by the Department of Transportation and Communication (DOTC). 14. Regulatory signs - Traffic signs that tell what a driver must or must not do under penalty of the law. 15. Road Related Accident and Emergency - Refers to unforeseen and unanticipated road happenings usually resulted from by driver’s negligence/error, abnormal road condition and motor vehicle mechanical safety breakdown resulting to grave vehicular accident, passenger body injury and damage to property. 16. Roadway markings - Markings on a pavement separating lanes of travel or indicating what a driver may do. 17. Seat belt - A belt anchored to the vehicle frame. It prevents the passengers from being thrown against parts of the interior of the vehicle or from the vehicle in the event of a collision. 18. Taxicab - Refers to a public utility car that transport passenger to a designated location and collect fare recorded on taximeter based on mileage or time factors specified by the LTFRB. 19. Traffic - The flow of all motor vehicles and pedestrians along the street and the highway 20. Traffic signal lights - Traffic controls which usually located at intersections to regulate traffic flow 21. Tricycle Unit - Refers to a 3-wheeled motor vehicle consisting of a motorcycle and a modified passenger sidecar with a seating capacity prescribed and authorized. It is franchised by LTFRB to operate and transport passengers within a specified area of operation with a pre-set and fixed fare. 22. Warning signs - Traffic signs that alert drivers to potential hazards ahead"
