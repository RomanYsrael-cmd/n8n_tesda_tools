      "term": "1.",
      "definition": "Absolute speed limit - The maximum or minimum legal speed at which one may drive. This speed limit may or may not be posted. 2. Accident, motor vehicle - Any mishap involving a moving vehicle and resulting in death, injury or property damage. 3. Basic speed limit - Any speed below the absolute limit that is safe for existing road, weather or traffic conditions. 4. Collision - Any crash between motor vehicles or between a motor vehicle and another object. 5. Driving license - A legal document in the form of plastic identification card and official receipt issued by LTO authorizing a person to drive and operate a specified type of motor vehicle after satisfactorily completing and passing the standard requirement as categorized either non-professional or professional proficiency level. 6. Defensive driving - Being prepared to handle through any hazardous situation caused by other users of the road. 7. Directional signals - Lights on motor vehicle or hand signals used to indicate left and right turns and stops. 8. Driver - A person who drives motor vehicle and transport passengers and loads over specified routes or destination for a fee. 9. Fare - Refers to the price charged to transport a passenger 10. Franchised route - Refers to the designated travel route assigned by LTFRB (DOTC) to a specific public passenger motor vehicle indicating the particular main streets, roads and avenues to ply including its limitations and boundaries. 11. Periodic Maintenance Service - The regular servicing prescribed by manufacturer to maintain the vehicle’s top performance. 12. Motorcycle - Refers to a single passenger vehicle for operation on ordinary and typically having two wheels and a gasoline internal combustion engine."
