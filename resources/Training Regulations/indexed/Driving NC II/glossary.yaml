  "source_text": "1.\nAbsolute speed limit\n- The maximum or minimum legal speed at which\none may drive. This speed limit may or may not be\nposted.\n2.\nAccident, motor vehicle\n- Any mishap involving a moving vehicle and\nresulting in death, injury or property damage.\n3.\nBasic speed limit\n- Any speed below the absolute limit that is safe for\nexisting road, weather or traffic conditions.\n4.\nCollision\n- Any crash between motor vehicles or between a\nmotor vehicle and another object.\n5.\nDriving license\n- A legal document in the form of plastic identification\ncard and official receipt issued by LTO authorizing a\nperson to drive and operate a specified type of\nmotor vehicle after satisfactorily completing and\npassing the standard requirement as categorized\neither non-professional or professional proficiency\nlevel.\n6.\nDefensive driving\n- Being prepared to handle through any hazardous\nsituation caused by other users of the road.\n7.\nDirectional signals\n- Lights on motor vehicle or hand signals used to\nindicate left and right turns and stops.\n8.\nDriver\n- A person who drives motor vehicle and transport\npassengers and loads over specified routes or\ndestination for a fee.\n9.\nFare\n- Refers to the price charged to transport a\npassenger\n10.\nFranchised route\n- Refers to the designated travel route assigned by\nLTFRB (DOTC) to a specific public passenger\nmotor vehicle indicating the particular main streets,\nroads and avenues to ply including its limitations\nand boundaries.\n11.\nPeriodic Maintenance\nService\n- The regular servicing prescribed by manufacturer to\nmaintain the vehicle’s top performance.\n12.\n Motorcycle\n- Refers to a single passenger vehicle for operation\non ordinary and typically having two wheels and a\ngasoline internal combustion engine.\n\n--- PDF PAGE 60 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n58\n\n13.\n Public Utility Jeepney\n(PUJ)\n- Refers to a locally manufactured and modified\njeepney-type vehicle intended to carry as much\npassengers as prescribed and authorized by Land\nTransportation Franchise Regulatory Board\n(LTFRB) as approved by the Department of\nTransportation and Communication (DOTC).\n14.\nRegulatory signs\n- Traffic signs that tell what a driver must or must not\ndo under penalty of the law.\n15.\nRoad Related Accident\nand Emergency\n- Refers to unforeseen and unanticipated road\nhappenings usually resulted from by driver’s\nnegligence/error, abnormal road condition and\nmotor vehicle mechanical safety breakdown\nresulting to grave vehicular accident, passenger\nbody injury and damage to property.\n16.\nRoadway markings\n- Markings on a pavement separating lanes of travel\nor indicating what a driver may do.\n17.\nSeat belt\n- A belt anchored to the vehicle frame. It prevents the\npassengers from being thrown against parts of the\ninterior of the vehicle or from the vehicle in the\nevent of a collision.\n18.\nTaxicab\n- Refers to a public utility car that transport\npassenger to a designated location and collect fare\nrecorded on taximeter based on mileage or time\nfactors specified by the LTFRB.\n19.\nTraffic\n- The flow of all motor vehicles and pedestrians along\nthe street and the highway\n20.\nTraffic signal lights\n- Traffic controls which usually located at\nintersections to regulate traffic flow\n21.\nTricycle Unit\n- Refers to a 3-wheeled motor vehicle consisting of a\nmotorcycle and a modified passenger sidecar with a\nseating capacity prescribed and authorized. It is\nfranchised by LTFRB to operate and transport\npassengers within a specified area of operation with\na pre-set and fixed fare.\n22.\nWarning signs\n- Traffic signs that alert drivers to potential hazards\nahead\n\n--- PDF PAGE 61 ---\n______________________________________________________________________________________\nTR - DRIVING NC II Promulgated December 2004\n59",
