  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for TOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES\nNC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: TOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES\nNC Level: II\n\nNominal Training Duration: 37 Hours (Basic)\n\n 28 Hours (Common)\n\n 72 Hours (Core)\n 137 Hours\n\n 200 Hours - Supervised Industry Training (SIT)\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in interpreting and\nresponding to requests for independent tour services, designing and developing tour\npackage itinerary, and determining tour package cost and selling price. This includes\nclassroom learning activities and practical work in actual work site or simulation area.\n\nTo complete the course, all units prescribed for this qualification must be\nachieved.\n.\n\n--- PDF PAGE 77 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 73\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLea