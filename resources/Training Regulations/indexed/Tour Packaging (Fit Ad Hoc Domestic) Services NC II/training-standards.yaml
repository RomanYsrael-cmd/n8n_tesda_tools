  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for TOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES\nNC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: TOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES\nNC Level: II\n\nNominal Training Duration: 37 Hours (Basic)\n\n 28 Hours (Common)\n\n 72 Hours (Core)\n 137 Hours\n\n 200 Hours - Supervised Industry Training (SIT)\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in interpreting and\nresponding to requests for independent tour services, designing and developing tour\npackage itinerary, and determining tour package cost and selling price. This includes\nclassroom learning activities and practical work in actual work site or simulation area.\n\nTo complete the course, all units prescribed for this qualification must be\nachieved.\n.\n\n--- PDF PAGE 77 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 73\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n•\nGroup\ndiscussion\n•\nLecture\n•\nDemonstration\n•\nOral evaluation\n•\nWritten\nexamination\n•\nObservation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n\n•\nGroup\ndiscussion\n•\nLecture\n•\nDemonstration\n•\nOral evaluation\n•\nWritten\nexamination\n•\nObservation\n2 hours\n\n--- PDF PAGE 78 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 74\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork related\ndocuments\n•\nDescribe Communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people of\nsocial range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work related documents\n•\nGroup\ndiscussion\n•\nLecture\n•\nDemonstration\n•\nRole play\n•\nOral evaluation\n•\nWritten\nexamination\n•\nObservation\n2 hours\n\n2. Work in a team\nenvironment\n2.1 Describe team role\nand scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the\ndifferent sources of information\n•\nLecture/\nDiscussion\n•\nGroup Work\n•\nIndividual Work\n•\nRole Play\n•\nRole Play\n•\nCase Study\n•\nWritten Test\n1 hour\n\n--- PDF PAGE 79 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 75\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Identify one’s role\nand responsibility\nwithin a team\n•\nRole play :\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n•\nRole Play\n•\nLecture/\nDiscussion\n•\nRole Play\n•\nWritten Test\n1 hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Participate in the discussion of standard\nwork procedures and practices\n•\nGroup work\n•\nRole Play\n•\nLecture/\nDiscussion\n•\nRole Play\n•\nWritten Test\n1 hour\n3. Solve/address\ngeneral\nworkplace\nproblems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Analyze routine/procedural problems\n•\nGroup\ndiscussion\n•\nLecture\n•\nDemonstration\n•\nRole playing\n•\nCase\nFormulation\n•\nLife Narrative\nInquiry\n(Interview)\n•\nStandardized\ntest\n1 hour\n\n3.2 Look for solutions\nto routine problems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems\nand document procedures for reporting\n•\nGroup\ndiscussion\n•\nLecture\n•\nDemonstration\n•\nRole playing\n•\nCase\nFormulation\n•\nLife Narrative\nInquiry\n(Interview)\n•\nStandardized\ntest\n1 hour\n\n--- PDF PAGE 80 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 76\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.1 Recommend\nsolutions to\nproblems\n• Discuss standard operating procedures\nand documentation processes\n•\nGroup\ndiscussion\n•\nLecture\n•\nDemonstration\n•\nRole playing\n•\nCase\nFormulation\n•\nLife Narrative\nInquiry\n(Interview)\n•\nStandardized\ntest\n1 hour\n4. Develop career\nand life decisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management strategies\nthat assist in regulating behavior and\nachieving personal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger,\nworry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\nprofessional\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal and\ncareer goals\n• Share experiences that show confidence,\nand resilience in the face of setbacks and\nfrustrations and other negative emotions\nand unpleasant situations in the workplace\n•\n Discussion\n•\n Interactive\nLecture\n•\n Brainstorming\n•\n Demonstration\n•\n Role-playing\n•\nDemonstration\nor simulation\nwith oral\nquestioning\n•\nCase problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n\n4.2 Develop reflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n•\n Small Group\nDiscussion\n•\n Interactive\nLecture\n•\nBrainstorming\n•\n Demonstration\n•\n5 Role-playing\n•\nDemonstration\nor simulation\nwith oral\nquestioning\n•\nCase problems\ninvolving\n1 hour\n\n--- PDF PAGE 81 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 77\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Develop reflective practice through\nrealization of limitations, likes/ dislikes;\nthrough showing of self-confidence\n• Demonstrate self-acceptance and being\nable to accept challenges\nworkplace\ndiversity issues\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-regulation\nbased on Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by\nStephen Covey, transactional analysis,\npsycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility,\nadaptability, etc.\n• Determine strengths and weaknesses\n•\n Small Group\nDiscussion\n•\n Interactive\nLecture\n•\n Brainstorming\n•\n Demonstration\n•\n Role-playing\n•\n Demonstration\nor simulation\nwith oral\nquestioning\n•\n Case\nproblems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to do\nthings better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n•\nInteractive\nLecture\n•\nAppreciative\nInquiry\n•\nDemonstration\n•\nGroup work\n•\nPsychological\nand behavioral\nInterviews\n•\nPerformance\nEvaluation\n•\nLife Narrative\nInquiry\n•\nReview of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n•\nStandardized\nassessment of\ncharacter\n1 hour\n\n--- PDF PAGE 82 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 78\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nstrengths and\nvirtues applied\n\n5.2 Discuss and\ndevelop ideas with\nothers\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n•\nInteractive\nLecture\n•\nAppreciative\nInquiry\n•\nDemonstration\n•\nGroup work\n•\nPsychological\nand behavioral\nInterviews\n•\nPerformance\nEvaluation\n•\nLife Narrative\nInquiry\n•\nReview of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n•\nStandardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n\n5.3 Integrate ideas for\nchange in the\nworkplace\n\n•\nIdentify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n•\nAppreciate positive impacts and\nchallenges in innovation\n•\nShow mastery of the different types of\nchanges and levels of participation in the\nworkplace\n•\nDiscuss 7 habits of highly effective people\n•\nInteractive\nLecture\n•\nAppreciative\nInquiry\n•\nDemonstration\n•\nGroup work\n•\nPsychological\nand behavioral\nInterviews\n•\nPerformance\nEvaluation\n•\nLife Narrative\nInquiry\n•\nReview of\nportfolios of\n1 hour\n\n--- PDF PAGE 83 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 79\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nCommunicate ideas through small group\ndiscussions and meetings\n•\nDemonstrate basic skills in data analysis\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n•\nStandardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\no Organisational protocols\no Confidentiality and accuracy\no Business mathematics and statistics\no Legislation, policy and procedures\nrelating to the conduct of evaluations\n• Reviewing data/ information\n•\nGroup\ndiscussion\n•\nLecture\n•\nDemonstration\n•\nRole Play\n•\nOral evaluation\n•\nWritten Test\n•\nObservation\n•\nPresentation\n2 hours\n6.2 Assess gathered\ndata/ information\n• Lecture and discussion on:\no Data analysis techniques/ procedures\no Organisational values, ethics and\ncodes of conduct\no Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n•\nGroup\ndiscussion\n•\nLecture\n•\nDemonstration\n•\nRole Play\n•\nPractical\nexercises\n•\nOral evaluation\n•\nWritten Test\n•\nObservation\n•\nPresentation\n3 hours\n6.3 Record and\npresent 