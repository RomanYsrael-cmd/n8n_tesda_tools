 the\nclient\n\n1.2 Analyze tour\nrequirements of the\nclient\n•\nAnalyze and classify client's profile\n\n•\nLecture\n•\nDemonstration\n•\nDiscussion\n•\nPractical skill\nexercises\n•\nRole-play\n\n• Written\nexamination\n• Observation/\nDemonstration\nwith oral\nquestioning\n\n•\nMatch requested destination and activities\nwith client's classification\n\n•\nInterpret and incorporate special needs\nand interests\n•\nDetermine tour objectives\n\n1.3 Prepare and deliver\nresponse\n\n•\nDetermine type and mode of response in\nverbal or written form\n•\nLecture\n•\nDemonstration\n•\nDiscussion\n•\nPractical skill\nexercises\n•\nRole-play\n\n• Written\nexamination\n• Observation/\nDemonstration\nwith oral\nquestioning\n\n•\nConstruct response content according to\nenterprise standards\n\n•\nDeliver appropriate response\n•\nAddress and respond to clarifications,\nrevisions and additional requests\n\n--- PDF PAGE 92 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 88\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n2. Design and develop\ntour package\nitinerary\n2.1 Prepare the tour package\nitinerary\n\n• Determine tour itinerary destinations and\ntour duration based on the client’s\nrequirements\n• Lecture with\nDemonstration\n• Hands-on\n• Written\nexamination\n• Observation/\nDemonstration\nwith oral\nquestioning\n\n8 Hours\n• Draft skeletal itinerary based on client’s\nrequirements\n• Understand types and characteristics of\nPhilippine destinations\n2.2 Determine the tour\n components and\n the services\n required\n•\nDetermine tour components required to\nmeet the client's requirements\n• Lecture with\ndemonstration\n• Hands-on\n• Written\nexamination\n• Observation/\nDemonstration\nwith oral\nquestioning\n\n12 Hours\n•\nArrange tour components and services in\nchronological order\n•\nDetermine mode of transportation,\nhotel/lodging category, meal plan, tour\nguides and tour escorts services\n•\nIncorporate ancillary services\n•\nUnderstand basic tour package\ncomponents and tour package variable\nelements\n2.3 Select the suppliers best\nsuited to provide the\ncomponents/ services\nrequired\n\n•\nIdentify tour package component\n• Lecture with\ndemonstration\nHands-on\n• Written\nexamination\n• Observation/\nDemonstration\nwith oral\nquestioning\n\n4 Hours\n•\nSelect suppliers best suited for the tour\nservice required\n•\nPrepare and complete technical itinerary\nbased on selected suppliers\n\n--- PDF PAGE 93 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 89\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n3. Determine tour\npackage cost and\nselling price\n3.1 Determine type of tour\ncomponent cost\n\n• Understand fixed and variable costs\n• Discussion\n• Interaction\n• Power point\nPresentation\n• Computer\nWorkshop\n• Role-play\n\n• Observation/\nDemonstration\nwith oral\nquestioning\n\n16 Hours\n• Lift available rates from preferred\nsuppliers on file\n• Contract rates from other suppliers for\ntour components and ancillary products\nand services not on file;\n• Identify applicable terms, conditions and\nconcessions based on type and inclusions\nof tour package\n3.2 Calculate tour\ncomponent costs\n\n• Calculate fixed and variable costs based\non itinerary components\n• Discussion\n• Interaction\n• Hands-on\nexercises\n• Computer\nWorkshop\n• Observation/\nDemonstration\nwith oral\nquestioning\n\n20 Hours\n• Determine supplements and reductions\nbased on lodging cost components\n• Incorporate costs for tour guide\n3.3 Calculate tour package\nselling price\n• Calculate desired mark-up/profit margins\n• Discussion\n• Interaction\n• Hands-on\nexercises\n• Computer\nWorkshop\n• Observation/\nDemonstration\nwith oral\nquestioning\n\n4 Hours\n• Calculate applicable government taxes\n• Calculate commission schemes including\ncommissions\n\n--- PDF PAGE 94 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 90\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe DTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 95 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 91\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction may be enhanced through\nuse of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production process\nand apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted\nby non-government organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific needs of\na community. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• Must have completed the 10-year basic education or an Alternative\nLearning System (ALS) Certificate of Completion with grade 10\nequivalent holder\n• Able to communicate in verbal and written form\n\n--- PDF PAGE 96 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 92\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for TOUR PACKAGING (FIT AD HOC DOMESTIC)\nSERVICES NC II are as follows:\n\nFACILITIES\nEQUIPMENT\n\nSUPPLIES AND\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\nSUPPLIES\n\nWorkshop\n1 unit\nProjector screen\n 25\npcs\nWriting materials\n\nLaboratory\n1 unit\nOverhead projector\n 25\npcs\nSample itinerary forms\n\nAudio-visual\nroom\n1 unit\nElectric fan\n 25\npcs\nSample costing sheets\n\nLecture\nroom\n1 set\nFirst aid cabinet with\nupdated medical\nsupplies\n 25\npcs\nSample supplier's rate and\nvalidity sheets\n\nStorage/\nstock room\n1 pc\nFiling cabinet\n 25\npcs\nSample supplier's terms and\nconditions\n\n1 unit\nFire extinguisher\n 25\npcs\nRecord books/Notebooks\n\n1 unit\nEmergency light\n 25\npcs\nEnvelopes/file folders\n\n1 unit\nDirectional signage\n\n1 unit\nAir condition\nAccessories\n\n1 unit\nTelephones\n 25\npcs\nCalculator\n\n1 unit\nGDS Computer with\ninternet connection\nReferences\n\n1 unit\nTV\n 25\npcs\nSupplier’s Brochures\n\n1 unit\nVideo player\n 25\npcs\nSample SOP Manuals\n\n1 unit\nLCD\n 25\npcs\nSample flowcharts\n\n1 unit\nLicensed Software on\nGlobal Distribution\nSystem (GDS)\n 25\npcs\nRelevant Maps\n\n1 unit\nLicensed Software\n -\nUpdated Video Clips\n\n -\nPictures\n\n--- PDF PAGE 97 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 93\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nStudent/Trainee Working\nSpace\n1m x 1m\n1 sq. m\n25 sq. m\nContextual Learning\nLaboratory\n8m x 5m\n40 sq. m\n40 sq. m\nLecture Room\n8m x 5m\n40 sq. m\n40 sq. m\nLearning Resource\nCenter\n3m x 5m\n15 sq. m\n15 sq. m\nFacilities/Equipment/\nCirculation Area\n3m x 5m\n15 sq. m\n15 sq. m\nTotal workshop area:\n135 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS\n\n• Holder of National TVET Trainer Certificate (NTTC) Level I in Tour\n Packaging (FIT ADHOC DOMESTIC) Services NC II\n• Must have at least three (3) years industry experience in Tour Operations\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 98 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 94"
