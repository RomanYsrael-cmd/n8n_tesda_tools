  "source_text": "SECTION 4\nASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 Assessment shall cover all the competencies of the qualification with the\nbasic and common units integrated or assessed concurrently with the core\nunits of competency.\n\n4.1.2 A National Certificate (NC) shall be issued when a candidate has\ndemonstrated competence in all the units of competency that comprised\nthe Training Regulations for Tour Packaging (FIT Ad Hoc Domestic)\nServices NC II.\n\n4.1.3 The following are qualified to apply for assessment and certification:\n\n4.1.3.1\nCandidates and/or graduates of tourism and hospitality degree\nprograms;\n\n4.1.3.2\nCompleted the Tour Packaging (FIT Ad Hoc Domestic)\nServices NC II (consisting of 120 lecture hours + 200 hours of\nsupervised industry training).\n\n4.1.3.3\nIndustry practitioner with at least two (2) years of work\nexperience in tour packaging.\n\n--- PDF PAGE 99 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 95\n\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment. SAG\nis a pre-assessment tool to help the candidate and the assessor determine\nwhat evidence is available, where gaps exist, including readiness for\nassessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 100 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 96\n\n"
