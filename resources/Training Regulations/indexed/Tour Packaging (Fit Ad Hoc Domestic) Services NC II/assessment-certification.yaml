ur group; FOREIGN refers to the\ninternational (foreign) or domestic (local)\ntraveler\n\nINDIVIDUAL/INDEPENDENT\narrangements that are not part of a tour\npackage and\n\nTRAVELLER\nPerson availing of the travel / tour services\n\n5. GATEWAY\nentry/exit point of a destination\n\n6. GOVERNMENT TAX\nshare of collected amount due to the\ngovernment\n\n7. INDIVIDUAL/INDEPENDENT in the acronym FIT the letter I refers to an\nINDIVIDUAL or INDEPENDENT travelers who\nis not part of a tour group and whose tour\nrequirements and arrangements are not bound\nby tour group restrictions\n\n8. INTERNET\nelectronic information distribution system\n\n9. ITINERARY\na schedule of products, services and activities\narranged in a chronological order\n\n10. ITINERARY – SKELETAL\na general day-to-day schedule of products,\nservices and activities arranged in a\nchronological order\n\n11. ITINERARY – TECHNICAL\na specific schedule detailing transportation\nmodes, times, location and duration of\nproducts, services and activities arranged in a\nchronological order\n\n12. LGU\nLocal Government Unit\n\n--- PDF PAGE 104 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 100\n\n13. MARK UP\na percentage of tour costs or fixed amount that\nis added to the tour costs and reflects the profit\nof the enterprise\n\n14. OHS OPERATIONS\nMANAGER\nOccupational Health and Safety head of the\noperations department that coordinates all\nactivities pertaining to the services of all tour\ngroups and individual travelers\n\n15. PTQCS\nPhilippine T-VET Quality Certification System\n\n16. PRICE\nthe sum total amount to be collected from the\nclient on a per person basis that comprises the\ntour cost, mark-up, and government taxes\n\n17. REGULAR PACKAGE\nA tour package assembled based on the\ninterests of target market\n\n18. RESERVATION\nrefers to an advance request for a product or\nservice\n\n19. SUPPLIER\nrefers\nto\nhotels,\nrestaurants,\nresorts,\ntransportation operators and other entities that\nsupplies and accommodates travelers/tourists\n\n20. TOUR COSTS\nthe sum total of all cost per person based on tour\ncomponents included in the tour package; it\nrepresents all payments due to suppliers\n\n21. TOUR COORDINATOR\nan enterprise employee who assist the tour guide\nand the travelers on arrival, during and on\ndeparture for all scheduled activities in the\nitinerary\n\n22. TOUR GUIDE\nan individual duly trained and licensed by the\nLGU and accredited with the DOT who manages\nand accompanies local or foreign travelers within\na destination to provide information and oversee\nthe delivery the tour components by the suppliers\n\n--- PDF PAGE 105 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 101\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nTour Packaging (FIT AD HOC DOMESTIC) Services NC II\nQualification Code:\nTRSTOP219\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nTour Packaging\n(FIT AD HOC\nDOMESTIC)\nServices NC II\n2019-11 /\n01/11/19\nNo. 028 series\nof 2019\n\nLegend: *Description Types\n- Document Created\n\n--- PDF PAGE 106 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 102\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTHE TECHNICAL EXPERTS PANEL\n\nPAUL LIM SO\nManaging Director\nGreat Sights Travel and Tours Corporation\n19-RA Padre Faura Center\n472 Padre Faura cor. M.H. Del Pilar Sts.\nErmita, Manila\n\nBIENVENIDO G. CLARAVALL\nTourism Industry Practitioner/Consultant/\nProfessor\nUniver