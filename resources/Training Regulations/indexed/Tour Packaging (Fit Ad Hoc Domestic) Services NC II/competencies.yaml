        "source_text": "--- PDF PAGE 68 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      64 \n \nUNIT OF COMPETENCY:    DESIGN AND DEVELOP A TOUR PACKAGE ITINERARY \n \nUNIT CODE  \n        :   TRS422306 \n \nUNIT DESCRIPTOR       :    This unit deals with the skills and knowledge required to design \nand develop a tour itinerary according to the clients \nrequirements and/or interests. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Prepare the \ntour package \nitinerary  \n1.1 Tour itinerary \ndestinations are  \ndetermined based \non the client’s \nrequirements \n1.2 Tour duration is \ndetermined based \non the client’s \nrequirements \n1.3 A skeletal itinerary \nis drafted based on \nthe client’s \nrequirements \n \n \n \n \n \n \n1.1 Basic itinerary \nplanning rules \n1.2 Different types and \ncharacteristics of \nPhilippine \ndestinations  \n1.3 Suitability of the \nduration of tour \npackage  \n1.1 Application of itinerary \nplanning rules \n1.2 Mapping and plotting \ntour route and itinerary \n1.3 Alternative routing \nplanning \n1.4 Analyze of Philippine \ndestination attributes \n1.5 Ability to determine \nduration  \n1.6 Computer literacy and \nuse of information and \ncommunication \ntechnology\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      65 \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nBold and italicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.   Determine \nthe tour \n      components \nand \n     the services \nrequired \n2.1.    Tour components \nand services are \narranged in \nchronological order  \n2.2.    Mode of \ntransportation is \ndetermined \n2.3.    Hotel /lodging \ncategory is determined \n2.4    Sightseeing and \nactivities are scheduled \n2.6.   Tour guides and tour \ndirector services are \ndetermined \n2.7.   Ancillary Services are \nincorporated \n2.1.  Basic Tour \nPackage \ncomponents \n2.2. Tour Package \nvariable \nelements \n2.3. Ancillary \nProducts and \nServices \n2.1   Differentiating tour \nactivities, facilities, \nattractions and \nservices \n2.2   Differentiating \nlodging facilities and \nmeal plans \n2.3   Determining tour \nguide /escort \nrequirements \n2.4   Determining  ancillary \nand/or extraordinary \nservices \n3.    Select the \nsuppliers \nbest suited to \nprovide the \ncomponents/ \nservices \nrequired \n \n3.1. Tour package \ncomponent are   \nidentified \n3.2. Suppliers best suited for \nthe tour service required \nare selected \n3.3. Technical Itinerary \nbased on selected \nsuppliers is completed \n \n \n3.1   Classification \nand \ncharacteristics \nof appropriate \nsuppliers \n3.2   Directory of \nSuppliers \n \n3.1   Selecting appropriate \nsuppliers \n3.2   Accessing Directory \nof suppliers according \nto enterprise \nprocedures \n3.3   Computer literacy\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      66 \n \nRANGE OF VARIABLES   \n   \n \nVARIABLE \n \n \nRANGE \n \n1. Tour itinerary destinations \n \n \nMay include: \nTour destination depend on: \n1.1 Client profile    \n1.1. Client interest  \n1.2. Destination attributes \n1.3. Destination accessibility    \n2. Tour duration \nMay include: \nTour duration may depend on: \n2.1 Number of nights   \n2.1. Number of destinations   \n2.2. In-transit overnights  \n3. Tour components \nMay include :  \n3.1 Transportation to and from destinations and \non-sites  \n3.2 Accommodations \n3.3 Sightseeing tours and entertainment \n3.4 Tour guide/escort services \n3.5 Cruises \n3.6 Food and Beverage \n3.7 Insurance and/or miscellaneous services  \n3.8  Other requirements of the client \n \n***(Prioritize DOT Accredited establishments)*** \n4. Mode of transportation \nMay include: \n4.1.  Air – fixed or rotary wing \n4.1. Land – rail or road \n4.2. Water – salt or fresh/brackish water \n5. Hotel /lodging category \n \n \nMay include: \n5.1.  Hotel in urban setting   \n5.1. Resort in non-urban setting   \n5.2. Dormitory-type \n5.3. Guest house/pension \n5.4. Campsite  \n6. Meal plan \nMay include: \n6.1. Full-board \n6.2. Half-board  \n6.3. Bed and breakfast \n6.4. European plan   \n7. Ancillary Services \nMay include: \n7.1.  Special meals and other dietary requirements \n7.1. Equipment for PWDA \n7.2. Facilities for Senior Citizens \n7.3. Special transportation preferences \n7.4. Special rooming arrangements  \n7.5. Special Religious /Cultural arrangements\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      67 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of   \ncompetency \nAssessment requires evidences that the candidate: \n1.1.   Designed a tour itinerary that incorporates the client’s  \n          requirements \n1.2.   Identified the tour components required and the special   \n          services, if any  \n1.3     Identified and selected the suppliers best suited to   \n          provide the client’s requirements and special needs \n1.4    Communicated effectively with others to ensure effective   \n         work operation \n2.  Resource  \nimplications \nThe following resources should be provided: \n2.1. Rates and information of the following suppliers:  \n2.1.1 air, sea & land transportation \n2.1.2 accommodation establishments \n2.1.3 attractions and activities enterprises \n2.1.4 tour guide & escort  \n2.1.5 other ancillary services \n2.2. Telephone/Fax OR Email \n2.3. Computer with internet connection \n2.4.  Writing materials \n3.  Methods of   \nassessment \nCompetency in this unit may be assessed through: \n3.1    Review of actual written assessment output based on a \nscenario related to tour packaging (proposal, itinerary, \nsuggestions) \n3.2.   Review of portfolios done in the workplace pertaining to \ntour packaging (proposal, bids, e-mails) \n3.4    Demonstration/ Observation with Oral Questioning \n4.  Context for  \nassessment \n4.1   Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
