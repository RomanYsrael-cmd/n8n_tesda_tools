ess \ngathered \ndata/ \ninformation \n2.1 Validity of data/ \ninformation is \nassessed \n2.2 Analysis \ntechniques are \napplied to assess \ndata/ information. \n2.3 Trends and \nanomalies are \nidentified \n2.4 Data analysis \ntechniques and \nprocedures are \ndocumented \n2.5 Recommendation\ns are made on \nareas of possible \nimprovement. \n \n \n2.1 Business \nmathematics and \nstatistics \n2.2 Data analysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \n2.1 Computing \nbusiness \nmathematics and \nstatistics \n2.2 Describing data \nanalysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of \naudiences \n2.4 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n2.5 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n \n3. Record and \npresent \ninformation  \n3.1 Studied \ndata/information \nare recorded. \n3.2 Recommendation\ns are analysed for \naction to ensure \nthey are \ncompatible with \nthe project’s \nscope and terms \nof reference. \n3.3 Interim and final \nreports are \nanalysed and \noutcomes are \ncompared to the \ncriteria \nestablished at the \noutset. \n3.4 Findings are \npresented to \nstakeholders. \n \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n \n3.1 Describing data \nanalysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of \naudiences \n3.3 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4 Stating \norganisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 29 ---\nTESDA-SOP-