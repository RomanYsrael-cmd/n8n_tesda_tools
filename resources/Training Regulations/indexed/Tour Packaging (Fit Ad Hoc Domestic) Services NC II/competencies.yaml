ollowing resources should be provided:\n2.1 Sources of information on the industry\n2.2 Industry knowledge\n3. Methods of assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Interview/questions\n\n3.2 Practical demonstration\n3.3 Portfolio of industry information related to\n trainee’s work\n4. Context for assessment\n4.1 Competency assessment may occur in\nworkplace or any appropriately simulated\nenvironment.\n4.2 Assessment may be performed on multiple\noccasions involving a combination of direct,\nindirect and supplementary forms of evidence.\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 40\n\nUNIT OF COMPETENCY : OBSERVE WORKPLACE HYGIENE PROCEDURES\n\nUNIT CODE : TRS311202\n\nUNIT DESCRIPTOR : This unit of competency deals with the knowledge, skills and\nattitudes in observing workplace hygiene procedures. It\nincludes following hygiene procedures and identifying and\npreventing hygiene risks.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Follow\nhygiene\nprocedures\n1.1 Workplace hygiene\nprocedures are\nimplemented in line\nwith enterprise and\nlegal requirements\n1.2 Handling and storage\nof items are\nundertaken in line\nwith enterprise and\nlegal requirements\n1.1 Typical hygiene and\ncontrol procedures\nin the hospitality and\ntourism industries\n1.2 Overview of\nlegislation and\nregulation in relation\nto food handling,\npersonal and\ngeneral hygiene\n1.3 Knowledge on\nfactors which\ncontribute to\nworkplace hygiene\nproblems\n1.4 General hazards in\nhandling of food,\nlinen and laundry\nand garbage,\nincluding major\ncauses of\ncontamination and\ncross-infection\n\n1.1 Ability to follow\ncorrect procedures\nand instructions\n1.2 Ability to handle\noperating tools/\nequipment\n1.3 Application to\nhygiene principles\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-