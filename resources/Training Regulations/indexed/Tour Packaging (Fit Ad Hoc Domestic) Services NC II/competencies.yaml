 Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n2.4 Work is performed\nwithin ergonomic\nguidelines\n\n3. Access\ninformation\nusing computer\n3.1 Correct program/\napplication is selected\nbased on job\nrequirements\n3.2 Program/application\ncontaining the\ninformation required is\naccessed according to\ncompany procedures\n3.3 Desktop icons are\ncorrectly selected,\nopened and closed for\nnavigation purposes\n3.4 Keyboard techniques\nare carried out in line\nwith OH & S\nrequirements for safe\nuse of keyboards\n3.1 Relevant types of\nsoftware\n3.2 OH & S principles\nand responsibilities\n3.3 Calculating\ncomputer capacity\n3.1 Reading skills\nrequired to\ninterpret work\ninstruction\n3.2 Communication\nskills\n\n4. Produce/output\ndata using\ncomputer\nsystem\n4.1 Entered data are\nprocessed using\nappropriate software\ncommands\n4.2 Data are printed out\nas required using\ncomputer\nhardware/peripheral\ndevices in accordance\nwith standard\noperating procedures\n4.3 Files and data are\ntransferred between\ncompatible systems\nusing computer\nsoftware, hardware/\nperipheral devices in\naccordance with\nstandard operating\nprocedures\n4.1 Relevant types of\nsoftware\n4.2 General security\n4.3 Viruses\n4.4 OH & S principles\nand responsibilities\n4.5 Calculating\ncomputer capacity\n4.1 Reading skills\nrequired to\ninterpret work\ninstruction\n4.2 Communication\nskills\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 46\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Maintain\ncomputer\nequipment and\nsystems\n5.1 Systems for cleaning,\nminor maintenance\nand replacement of\nconsumables are\nimplemented\n5.2 Procedures for\nensuring security of\ndata, including regular\nback-ups and virus\nchecks are\nimplemented in\naccordance with\nstandard operating\nprocedures\n5.3 Basic file maintenance\nprocedures are\nimplemented in line\nwith the standard\noperating procedures\n5.1 General security\n5.2 Viruses\n5.3 OH & S principles\nand responsibilities\n5.4 Calculating\ncomputer capacity\n5.5 Maintenance\nprocedures for\ncomputer\n5.1 Applying\nmaintenance\nprocedures\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 47\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and peripheral\ndevices\nMay include:\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7. Mouse\n2. Software\nMay include:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n3. OH & S guidelines\nMay include but are not limited to:\n3.1. OHS guidelines\n3.2. Enterprise procedures\n4. Storage media\nMay include:\n4.1. Diskettes\n4.2. CDs\n4.3. Zip disks\n4.4. Hard disk drives, local and remote\n5. Ergonomic guidelines\nMay include:\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5. Visual display unit screen brightness\n6. Desktop icons\n May include:\n6.1. Directories/folders\n6.2. Files\n6.3. Network devices\n6.4. Recycle bin\n7. Maintenance\nMay include:\n7.1. Creating more space in the hard disk\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external\nsurfaces\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 48\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly and\naccording to the task requirement\n1.2. Identified and explain the functions of both hardware and\nsoftware us