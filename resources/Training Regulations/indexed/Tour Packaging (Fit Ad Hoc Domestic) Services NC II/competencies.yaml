        "source_text": "--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      68 \n \nUNIT OF COMPETENCY    :    DETERMINE TOUR PACKAGE COST AND SELLING  PRICE  \n \n \nUNIT CODE \n \n        :   TRS422307 \nUNIT DESCRIPTOR           :    This unit deals with the skills and knowledge required to    \ncalculate a tour package cost and determine the selling  \n \nprice to/for independent tour arrangements to Philippines \ndestinations. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Determine \ntype of tour \ncomponent \ncost    \n1.1 Tour itinerary \ncomponents are \nanalyzed to \ndetermine the fixed \nand variable costs \n1.2 Contracted rates of \nelected suppliers are \nreviewed to \ndetermine terms and \nconditions and \nvalidity \n1.1. Difference between  \n    fixed and variable  \n       costs \n1.2 Rates, terms,  \nconditions and \nvalidity of negotiated \ncontracts with \nsuppliers \n1.1  Differentiating \nordinary and \nextraordinary \nrequirements and/or \nancillary or auxiliary \nservices \n1.2  Computer literacy \n(Word / Excel / \nPowerpoint) \n \n2. Calculate tour \ncomponent \ncosts \n \n \n2 .1 Tour components \ncosts are calculated \nbased on the \ncontracted rates of \nsuppliers (FIT) and \ntype of cost, on a per \nperson basis \n2.2. Lodging cost \ncomponents are \ndetermined by type \nof room and number \nof clients per room on \na per person basis \n2.3. Supplements and \nreductions are \ndetermined based on \nlodging cost \ncomponents \n2.4. Costing sheet \ntemplates are used to \ncalculate the tour \ncomponent costs \naccording to \nenterprise format \n \n \n \n2.1 Negotiate terms \nand conditions and \nvalidity and \ncontracted rates \nfrom suppliers \n2.2 Basic tour package \ncomponents, fixed \nand variable \nelements and \nancillary products \n2.3 Fixed and variable \ncosting rules \n2.4 Formula to \ndetermine the twin-\nshare, single-room \nsupplement and \ntriple room \nreduction or 1/3 \ntriple costs \n2.6  High/shoulder/low \nseason \ndifferentiation \n2.7  Applicability of FIT \nrates \n \n2.1  Computer literacy \n(Word / Excel / \nPowerpoint) \n2.2  Application of  \nmathematical \nequations\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      69 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.    Calculate \ntour package \nselling price \n3.1 Mark-up based on \nmarket trends, \ncurrent industry \npractices and/or \nenterprise policies is \nadded to the tour \ncost    \n3.2. Government taxes \nare calculated and \nadded based on the \ntour cost with mark-\nup  \n3.3. Mark-up and \ngovernment taxes \ncalculations are \nreflected in the \nenterprise Costing \nSheet Template  \n \n2.1. Formula for mark up \n2.2. Formula for \ngovernment taxes \n3.1 Computer literacy  \n(Word / Excel / \nPowerpoint) \n3.2  Application of \nmathematical \nequations\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      70 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Contracted rates  \n \nMay include: \n1.1. Peak/shoulder/lean season rates \n1.2. Room supplements/reduction \n1.3. Rate, rate + tax, rate + tax and fees  \n2. Terms and \nconditions    \n \n \n \nMay include: \n2.1. Payment upon confirmation \n2.2. Payment upon check-out  \n2.3. 15-day or 30-day credit facility \n3. Validity \nMay include: \nAny of the following: \n3.1.    January 1 to December 31 \n3.2.    April 1 to March 31 \n3.3.    October 1 to March 31 \n3.4.    Ad Hoc or One-off (valid only on dates/segments \nindicated) \n3.5.    Year-round  \n4. Type of room \n \n \nMay include: \n4.1.  Twin room \n4.2.  Double room \n4.3.  Single room occupancy \n4.4.  Triple room \n4.5.  Twin room with extra bed \n4.6.  Quad room \n4.7.  Dormitory-type \n5. Supplements and \nreductions  \n \n \n \n \n \n \n \nMay include: \n5.1.  Supplement for porter fees \n5.2.  Supplement for single-room occupancy \n5.3.  Supplement for foreign-language-speaking tour guide \n5.4.  Supplement for transport fares \n5.5.  Supplement for half-board/full-board \n5.6.  Supplement for arrival/departure transfers \n5.7.  Triple room reduction \n5.8.  Child rate reduction  \n6. Tour Cost  \n \nMay include: \n6.1 Tour cost is the sum total of all cost per person based on \ntour components included in the tour package  \n6.2 It represents all payments due to suppliers \n6.3 Enterprise develop their own respective templates, \nhowever the foregoing must be clearly indicated \n7. Tour Cost with \nmark-up \n \n \n \n \n \nMay include: \n7.1 Tour cost plus mark-up (profit) is the sum total price to be \ncollected from the client on a per person basis   \n7.2 It must include all government taxes due \n7.3 Enterprise develop their own respective templates, \nhowever the cost, mark-up and taxes due must be clearly \nindicated\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      71 \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of   \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Determined the type of tour component cost – \nfixed and variable and selected the most suitable \nservice providers \n1.2 Selected the contract rates and calculated the tour \ncomponent costs  \n1.3 Used an accepted tour costing sheet format \nindicating tour cost, profit  or mark-up and \napplicable government taxes due  \n1.6   Communicated effectively with others to ensure \neffective work operation \n2.   Resource  implications \nThe following resources should be provided: \n2.1 Contracted rates of suppliers from, air, sea & land \ntransportation, taxes, parking fees, toll fees and \nother surcharges \n2.2 Accommodations rates including taxes, meal rates \nincluding taxes services charges Entrance fees, \ntaxes, tour guide & escort fees including, meals, \naccommodations and other expenses, ancillary \nservices \n3.  Methods of   assessment \nCompetency in this unit may be assessed through: \n3.1   Competency in this unit may be assessed through: \n3.1   Review of actual written assessment output based \non a scenario related to tour packaging (proposal, \nitinerary, suggestions) \n3.2. Observation with oral Questioning \n3.3. Review of portfolios done in the workplace pertaining \nto tour packaging tour costing calculation, \ncalculation of mark-up based on tour objectives and \ncalculation of government taxes due \n 3.4  Demonstration with Oral Questioning \n4.  Context for  assessment \n4.1  Competency may be assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center\n",
        "required_knowledge": [
