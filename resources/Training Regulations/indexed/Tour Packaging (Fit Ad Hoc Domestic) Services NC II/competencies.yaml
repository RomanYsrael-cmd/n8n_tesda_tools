        "source_text": "TRS311205\n\nUNIT DESCRIPTOR\n :\nThis unit of competency deals with the knowledge, skills and\nattitudes in providing effective customer service. It includes\ngreeting customer, identifying customer needs, delivering\nservice to customer, handling queries through telephone, fax\nmachine, internet and email and handling complaints,\nevaluation and recommendation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Greet\ncustomer\n1.1 Customers are\ngreeted in line\nwith enterprise\nprocedure\n1.2 Verbal and non-\nverbal\ncommunications\nare appropriate to\nthe given situation\n1.3 Non-verbal\ncommunication\nof customer is\nobserved\nresponding to\ncustomer\n1.4 Sensitivity to\ncultural and\nsocial\ndifferences is\ndemonstrated\n1.1 Communication\n 1.1.1 Interactive\ncommunication with\nothers\n 1.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n1.2 Attitude\n 1.2.1 Attentive,\npatient and cordial\n 1.2.2 Eye-to-eye\n contact\n 1.2.3 Maintain\n teamwork and\n cooperation\n1.3 Theory\n 1.3.1 Interview\n techniques\n 1.3.2 Communication\nprocess\n 1.3.3 Communication\n barriers\n1.1 Effective\ncommunication skills\n1.2 Non-verbal\ncommunication -\nbody language\n1.3 Good time\nmanagement\n1.4 Ability to work calmly\nand unobtrusively\neffectively\n\n2. Identify\ncustomer\nneeds\n2.1 Appropriate\ninterpersonal\nskills are used to\nensure that\ncustomer needs\nare accurately\nidentified\n2.2 Customer needs\nare assessed for\nurgency so that\npriority for service\ndelivery can be\nidentified\n2.3 Customers are\nprovided with\ninformation\n2.1 Communication\n2.1.1 Interactive\ncommunication with\nothers\n2.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n2.2 Safety Practices\n2.2.1 Safe work\npractices\n2.2.2 Personal\nhygiene\n2.3 Attitude\n2.3.1 Attentive, patient and\ncordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork\nand cooperation\n2.1 Effective\ncommunication skills\n2.2 Non-verbal\ncommunication -\nbody language\n2.3 Good time\nmanagement\n2.4 Ability to work calmly\nand unobtrusively\neffectively\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 55\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n2.4 Personal limitation in\naddressing customer\nneeds is identified and\nwhere appropriate,\nassistance is sought\nfrom supervisor\n\n2.4 Theory\n 2.4.1 Selling/upselling\n techniques\n 2.4.2 Interview\ntechniques\n 2.4.3 Conflict resolution\n 2.4.4 Communication\n process\n 2.4.5 Communication\n barriers\n\n3. Deliver service\nto customer\n3.1 Customer needs are\npromptly attended to in\nline with enterprise\nprocedure\n3.2 Appropriate rapport is\nmaintained with\ncustomer to enable\nhigh quality service\ndelivery\n3.3 Opportunity to enhance\nthe quality of service\nand products are taken\nwherever possible\n\n3.1 Communication\n 3.1. Interactive\n communication\n with others\n 3.1.2 Interpersonal\n skills/ social\n graces with\n sincerity\n3.2 Safety Practices\n 3.2.1 Safe work\n practices\n 3.2.2 Personal\n hygiene\n3.3 Attitude\n 3.3.1 Attentive,\n patient\n and cordial\n 3.3.2 Eye-to-eye\n contact\n 3.3.3 Maintain\n teamwork\n and cooperation\n3.4 Theory\n 3.4.1 Selling/upselling\n techniques\n 3.4.2 Interview\n techniques\n 3.4.3 Conflict\nresolution\n 3.4.4 Communication\n process\n 3.4.5 Communication\n Barriers\n\n3.1 Effective\ncommunication\nskills\n3.2 Non-verbal\ncommunication\n- body language\n3.3 Good time\nmanagement\n3.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 56\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Handle queries\nthrough use of\ncommon\nbusiness tools\nand technology\n4.1 Use telephone,\ncomputer, fax\nmachine, internet\nefficiently to determine\ncustomer\nrequirements\n4.2 Queries/ information\nare recorded in line\nwith enterprise\nprocedure\n4.3 Queries are acted\nupon promptly and\ncorrectly in line with\nenterprise procedure\n4.1 Communication\n 4.1.1 Interactive\ncommunication with\nothers\n 4.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n4.2 Attitude\n 4.2.1 Attentive,\npatient and cordial\n 4.2.2 Maintain\nteamwork and\ncooperation\n4.3 Theory\n 4.3.1 Interview\n techniques\n 4.3.2 Communication\n process\n 4.3.3 Communication\nbarriers\n4.1 Effective\ncommunication\nskills\n4.2 Non-verbal\ncommunication -\nbody language\n4.3 Good time\nmanagement\n4.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n5. Handle\ncomplaints,\nevaluation and\nrecommendations\n5.1 Guests are greeted\nwith a smile and eye-\nto-eye contact\n5.2 Responsibility for\nresolving the complaint\nis taken within limit of\nresponsibility\n5.3 Nature and details of\ncomplaint are\nestablished and agreed\nwith the customer\n5.4 Threats to personal\nsafety are identified\nand managed to\npersonal safety of\ncustomers or\ncolleagues and\nappropriate assistance\nis organized\n5.5 Appropriate action is\ntaken to resolve the\ncomplaint to the\ncustomers satisfaction\nwherever possible\n5.6 Conflict situations are\nresolved within scope\nof individual\nresponsibility by\napplying effective\ncommunication skills\n5.1 Communication\n 5.1.1 Interactive\ncommunication with\nothers\n 5.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n5.2 Attitude\n 5.2.1 Attentive,\npatient\n and cordial\n 5.2.2 Eye-to-eye\ncontact\n 5.2.3 Maintain\nteamwork\n and cooperation\n5.3 Theory\n 5.3.1 Interview\n techniques\n 5.3.2 Conflict\nresolution\n 5.3.3 Communication\n process\n 5.3.4 Communication\n barriers\n5.1 Effective\ncommunication\nskills\n5.2 Non-verbal\ncommunication -\nbody language\n5.3 Good time\nmanagement\n5.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n5.5 Proper way of\nhandling\ncomplaints\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 57\n\nand according to\nenterprise policy\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Customers\nMay include:\n1.1 Internal\n1.2 External\n2. Non-verbal communication May include:\n2.1 Body language\n2.2 Dress and accessories\n2.3 Gestures and mannerisms\n2.4 Voice tonality and volume\n2.5 Use of space\n2.6 Culturally specific communication customs and\npractices\n3. Cultural and social\ndifferences\nMay include:\n3.1 Modes of greeting, farewelling and conversation\n3.2 Body language/ use of body gestures\n3.3 Formality of language\n4. Interpersonal skills\nMay include:\n4.1 Interactive communication\n4.2 Public relation\n4.3 Good working attitude\n4.4 Sincerity\n4.5 Pleasant disposition\n4.6 Effective communication skills\n5. Customer and colleagues\nneeds\nMay include:\n5.1 Those with a disability\n5.2 Those with special cultural or language needs\n5.3 Unaccompanied children\n5.4 Parents with young children\n5.5 Pregnant women\n5.6 Single women\n6. Enterprise procedure\nMay include:\n6.1 Modes of greeting and farewelling\n6.2 Addressing the person by name\n6.3 Time-lapse before a response\n6.4 Style manual requirements\n6.5 Standard letters and proformas\n7. Business tools and\ntechnology\nMay include:\n7.1 Telephone\n7.2 Fax machine\n7.3 Computer equipment\n7.4 Internet, email\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 58\n\nVARIABLE\nRANGE\n8. Complaint\nMay include:\n8.1 Level of service\n8.2 Product standards\n8.3 Processes\n8.4 Information given\n8.5\nCharges and fees\n9. Threats to personal safety\nMay include:\n9.1 Violent customers\n9.2 Drug and alcohol affected customers\n9.3 Customers fighting amongst themselves\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety\npractices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with company facilities,\nproducts and services\n1.7 Demonstrated ability to work effectively with others\n1.8 Applied company rules and standards\n1.9 Applied telephone ethics\n1.10 Applied correct procedure in using telephone, fax\nmachine, internet\n1.11 Handled customer complaints within limit of\nindividual responsibility\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Availability of telephone, fax machine, internet, etc.\n2.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n2.3 Availability of office supplies\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n4. Context for\nassessment\n4.1 Competency assessment may occur in workplace or\nany appropriately simulated environment.\n4.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 59\n\nCORE COMPETENCIES\n\n UNIT OF COMPETENCY : INTERPRET AND RESPOND TO REQUESTS FOR\nINDIVIDUAL/INDEPENDENT TOUR SERVICES\n\nUNIT CODE\n\n :"
