ements\n6.5 Standard letters and proformas\n7. Business tools and\ntechnology\nMay include:\n7.1 Telephone\n7.2 Fax machine\n7.3 Computer equipment\n7.4 Internet, email\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 58\n\nVARIABLE\nRANGE\n8. Complaint\nMay include:\n8.1 Level of service\n8.2 Product standards\n8.3 Processes\n8.4 Information given\n8.5\nCharges and fees\n9. Threats to personal safety\nMay include:\n9.1 Violent customers\n9.2 Drug and alcohol affected customers\n9.3 Customers fighting amongst themselves\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety\npractices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with company facilities,\nproducts and services\n1.7 Demonstrated ability to work effectively with others\n1.8 Applied company rules and standards\n1.9 Applied telephone ethics\n1.10 Applied correct procedure in using telephone, fax\nmachine, internet\n1.11 Handled customer complaints within limit of\nindividual responsibility\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Availability of telephone, fax machine, internet, etc.\n2.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n2.3 Availability of office supplies\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n4. Context for\nassessment\n4.1 Competency assessment may occur in workplace or\nany appropriately simulated environment.\n4.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 59\n\nCORE COMPETENCIES\n\n UNIT OF COMPETENCY : INTERPRET AND RESPOND TO REQUESTS FOR\nINDIVIDUAL/INDEPENDENT TOUR SERVICES\n\nUNIT CODE\n\n : TRS422305\n\nUNIT DESCRIPTOR : This unit deals with the knowledge and skills required to\ninterpret\nand\nrespond\nto\nrequests\nfor\nindividual/\nindependent tour arrangements to Philippines destinations.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Receive and\n record the\n tour\n requirements\n of the client\n1.1 Client details are\nrecorded\n1.2 Client profile is\ndetermined\n1.3 Individual/Independent\ntour requirements are\nrecorded\n1.4 Client special requests\nare noted\n1.5 All information is\nrecorded and reviewed\naccording to enterprise\nprocedures\n\n1.1 Effective\ncommunication -\nverbal and non-\nverbal\n1.2 Market\nclassifications\n1.3 Database\nmanagement\n\n1.1 Communication Skills\n1.2 Active listening\n1.3 Questioning\ntechniques\n1.4 Understanding\nmarket classifications\n1.5 Ability to gather and\nnote correct and\ncomplete information\n1.6 Computer Literacy\n\n2. Analyze tour\nrequirements\nof client\n2.1 Client profile is analyzed\nand classified\n2.2 Requested destination\nand activities are\nmatched with client\nrequirements\n2.3 Special needs and\ninterests are interpreted\nand incorporated\n2.4 Tour objectives are\ndetermined\n\n2.1 Philippine\n Geography\n2.2 Philippine\nDestinations\n2.3 Special Interests\nLocations\n2.4 Online resources\n(e.g. DOT, LGU,\nNational Library\nwebsites)\n2.1 Ability to analyze\nand understand\nmarket\nsegments/profile\n2,2, Ability to understand\nspecial\nneeds/interests\n2.3. Ability to select\nsuitable Philippines\ndestinations and\nactivities\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 60\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Prepare and\ndeliver\nresponse\n3.1. Type and mode of\nresponse, in verbal or\nwritten form is\ndetermined\n3.2 Content is\nconstructed according\nto enterprise\nstandards\n3.3 Response is\ndelivered in a timely\nmanner\n3.4 Clarifications,\nrevisions and\nadditional requests\nare addressed and\nresponded to\n3.1 Business writing\nprinciples\n3.2 Technical writing\n3.3 Enterprise\ndocuments -\nforms and\ntemplates\n3.4 Updated\nSoftware\nApplication\n3.1 Communication Skills\n3.2 Use of Information\nand Communication\nTechnology\nequipment\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Client details\n\nMay include:\n1.1.\nNames/s\n1.2.\nContact Number – Mobile and Landline\n1.3.\nAddress – Email and Home\n1.4.\nContact Person and details\n2. Client profile\n\nMay include:\n2.1\nSolo/couple\n2.2\nFamily and friends\n2.3\nBudget/Backpacker\n2.4\nMid-ranged traveler\n2.5\nHigh-end traveler\n2.6\nFIT/ Corporate\n2.7\nOther special interests (e.g. Pilgrims, Adventures,\nEco-tourists)\n3. Individual/Independent\ntour requirements\n\nMay include:\n3.1. Transportation to and from destinations and on-sites\n3.2. Accommodations\n3.3. Sightseeing tours and entertainment\n3.4. Tour guide/escort services\n3.5. Cruises\n3.6. Meal Plan\n3.7. Insurance and/or miscellaneous services\n3.8. Other requirements of the client\n\n4. Client special\nrequests\nMay include:\n4.1. Dietary Requirements\n4.2. People with Different Ability (PWDA)\n4.3. Senior citizens\n4.4. Transportation Preferences\n4.5. Rooming Preference\n4.6. Religious /Cultural Considerations and sensitivities\n4.7. Extra-ordinary Services\n5. Client classification\nMay include:\n5.1. Leisure/holiday\n5.2. Adventure/sports\n5.3. Historical/heritage\n5.4. Eco-tourism\n5.5. Culinary tourism\n5.6. Educational/agricultural tours/farm tourism\n\n6. Tour objectives\nMay include:\n6.1. Satisfaction of Client’s needs and wants\n6.2. Destination promotions\n6.3. Enterprise enhancement\n6.4. Financial gain\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 62\n\nVARIABLE\nRANGE\n7. Type and mode of\nresponse\nMay include:\nType of response:\n7.1.1 inquiry\n7.1.2 acknowledgement\n7.1.3 proposal\n7.1.4 clarification\n7.1.5 amendment\n7.1.6 confirmation\n7.1.7 re-confirmation\n7.1.8 cancellation.\n7.1.9 terms and conditions\nMode of response:\n7.2.1 Face-to-face (counter)\n7.2.2 Telephone – (voice) Landline / Mobile\n7.2.3 SMS\n7.2.4 Fax\n7.2.5 Internet – Email / Social Media\n7.2.6 Mail/courier service\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 63\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Took the client’s requirements according to the specifics\nprovided\n1.2 Interpreted the client’s requirements correctly and\nconfirmed specific services, and special requirements, if\nany\n1.3 Analyzed the client’s requirements according to the\nrequests and special needs\n1.4 Communicated effectively with others to ensure effective\nwork operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection\n2.3 Writing materials\n\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n 3.1 Review of actual written assessment output based on a\nscenario related to tour packaging (proposal, itinerary,\nsuggestions)\n3.2. Review of portfolios done in the workplace pertaining to\ntour packaging (proposal, bids, e-mails)\n3.4 Demonstration/ Observation with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 68 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 64\n\nUNIT OF COMPETENCY: DESIGN AND DEVELOP A TOUR PACKAGE ITINERARY\n\nUNIT CODE\n : TRS422306\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to design\nand develop a tour itinerary according to the clients\nrequirements and/or interests.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Prepare the\ntour package\nitinerary\n1.1 Tour itinerary\ndestinations are\ndetermined based\non the client’s\nrequirements\n1.2 Tour duration is\ndetermined based\non the client’s\nrequirements\n1.3 A skeletal itinerary\nis drafted based on\nthe client’s\nrequirements\n\n1.1 Basic itinerary\nplanning rules\n1.2 Different types and\ncharacteristics of\nPhilippine\ndestinations\n1.3 Suitability of the\nduration of tour\npackage\n1.1 Application of itinerary\nplanning rules\n1.2 Mapping and plotting\ntour route and itinerary\n1.3 Alternative routing\nplanning\n1.4 Analyze of Philippine\ndestination attributes\n1.5 Ability to determine\nduration\n1.6 Computer literacy and\nuse of information and\ncommunication\ntechnology\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 65\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Determine\nthe tour\n components\nand\n the services\nrequired\n2.1. Tour components\nand services are\narranged in\nchronological order\n2.2. Mode of\ntransportation is\ndetermined\n2.3. Hotel /lodging\ncategory is determined\n2.4 Sightseeing and\nactivities are scheduled\n2.6. Tour guides and tour\ndirector services are\ndetermined\n2.7. Ancillary Services are\nincorporated\n2.1. Basic Tour\nPackage\ncomponents\n2.2. Tour Package\nvariable\nelements\n2.3. Ancillary\nProducts and\nServices\n2.1 Differentiating tour\nactivities, facilities,\nattractions and\nservices\n2.2 Differentiating\nlodging facilities and\nmeal plans\n2.3 Determining tour\nguide /escort\nrequirements\n2.4 Determining ancillary\nand/or extraordinary\nservices\n3. Select the\nsuppliers\nbest suited to\nprovide the\ncomponents/\nservices\nrequired\n\n3.1. Tour package\ncomponent are\nidentified\n3.2. Suppliers best suited for\nthe tour service required\nare selected\n3.3. Technical Itinerary\nbased on selected\nsuppliers is completed\n\n3.1 Classification\nand\ncharacteristics\nof appropriate\nsuppliers\n3.2 Directory of\nSuppliers\n\n3.1 Selecting appropriate\nsuppliers\n3.2 Accessing Directory\nof suppliers according\nto enterprise\nprocedures\n3.3 Computer literacy\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 66\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Tour itinerary destinations\n\nMay include:\nTour destination depend on:\n1.1 Client profile\n1.1. Client interest\n1.2. Destination attributes\n1.3. Destination accessibility\n2. Tour duration\nMay include:\nTour duration may depend on:\n2.1 Number of nights\n2.1. Number of destinations\n2.2. In-transit overnights\n3. Tour components\nMay include :\n3.1 Transportation to and from destinations and\non-sites\n3.2 Accommodations\n3.3 Sightseeing tours and entertainment\n3.4 Tour guide/escort services\n3.5 Cruises\n3.6 Food and Beverage\n3.7 Insurance and/or miscellaneous services\n3.8 Other requirements of the client\n\n***(Prioritize DOT Accredited establishments)***\n4. Mode of transportation\nMay include:\n4.1. Air – fixed or rotary wing\n4.1. Land – rail or road\n4.2. Water – salt or fresh/brackish water\n5. Hotel /lodging category\n\nMay include:\n5.1. Hotel in urban setting\n5.1. Resort in non-urban setting\n5.2. Dormitory-type\n5.3. Guest house/pension\n5.4. Campsite\n6. Meal plan\nMay include:\n6.1. Full-board\n6.2. Half-board\n6.3. Bed and breakfast\n6.4. European plan\n7. Ancillary Services\nMay include:\n7.1. Special meals and other dietary requirements\n7.1. Equipment for PWDA\n7.2. Facilities for Senior Citizens\n7.3. Special transportation preferences\n7.4. Special rooming arrangements\n7.5. Special Religious /Cultural arrangements\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 67\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1. Designed a tour itinerary that incorporates the client’s\n requirements\n1.2. Identified the tour components required and the special\n services, if any\n1.3 Identified and selected the suppliers best suited to\n provide the client’s requirements and special needs\n1.4 Communicated effectively with others to ensure effective\n work operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1. Rates and information of the following suppliers:\n2.1.1 air, sea & land transportation\n2.1.2 accommodation establishments\n2.1.3 attractions and activities enterprises\n2.1.4 tour guide & escort\n2.1.5 other ancillary services\n2.2. Telephone/Fax OR Email\n2.3. Computer with internet connection\n2.4. Writing materials\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Review of actual written assessment output based on a\nscenario related to tour packaging (proposal, itinerary,\nsuggestions)\n3.2. Review of portfolios done in the workplace pertaining to\ntour packaging (proposal, bids, e-mails)\n3.4 Demonstration/ Observation with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 68\n\nUNIT OF COMPETENCY : DETERMINE TOUR PACKAGE COST AND SELLING PRICE\n\nUNIT CODE\n\n : TRS422307\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to\ncalculate a tour package cost and determine the selling\n\nprice to/for independent tour arrangements to Philippines\ndestinations.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Determine\ntype of tour\ncomponent\ncost\n1.1 Tour itinerary\ncomponents are\nanalyzed to\ndetermine the fixed\nand variable costs\n1.2 Contracted rates of\nelected suppliers are\nreviewed to\ndetermine terms and\nconditions and\nvalidity\n1.1. Difference between\n fixed and variable\n costs\n1.2 Rates, terms,\nconditions and\nvalidity of negotiated\ncontracts with\nsuppliers\n1.1 Differentiating\nordinary and\nextraordinary\nrequirements and/or\nancillary or auxiliary\nservices\n1.2 Computer literacy\n(Word / Excel /\nPowerpoint)\n\n2. Calculate tour\ncomponent\ncosts\n\n2 .1 Tour components\ncosts are calculated\nbased on the\ncontracted rates of\nsuppliers (FIT) and\ntype of cost, on a per\nperson basis\n2.2. Lodging cost\ncomponents are\ndetermined by type\nof room and number\nof clients per room on\na per person basis\n2.3. Supplements and\nreductions are\ndetermined based on\nlodging cost\ncomponents\n2.4. Costing sheet\ntemplates are used to\ncalculate the tour\ncomponent costs\naccording to\nenterprise format\n\n2.1 Negotiate terms\nand conditions and\nvalidity and\ncontracted rates\nfrom suppliers\n2.2 Basic tour package\ncomponents, fixed\nand variable\nelements and\nancillary products\n2.3 Fixed and variable\ncosting rules\n2.4 Formula to\ndetermine the twin-\nshare, single-room\nsupplement and\ntriple room\nreduction or 1/3\ntriple costs\n2.6 High/shoulder/low\nseason\ndifferentiation\n2.7 Applicability of FIT\nrates\n\n2.1 Computer literacy\n(Word / Excel /\nPowerpoint)\n2.2 Application of\nmathematical\nequations\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 69\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Calculate\ntour package\nselling price\n3.1 Mark-up based on\nmarket trends,\ncurrent industry\npractices and/or\nenterprise policies is\nadded to the tour\ncost\n3.2. Government taxes\nare calculated and\nadded based on the\ntour cost with mark-\nup\n3.3. Mark-up and\ngovernment taxes\ncalculations are\nreflected in the\nenterprise Costing\nSheet Template\n\n2.1. Formula for mark up\n2.2. Formula for\ngovernment taxes\n3.1 Computer literacy\n(Word / Excel /\nPowerpoint)\n3.2 Application of\nmathematical\nequations\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 70\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Contracted rates\n\nMay include:\n1.1. Peak/shoulder/lean season rates\n1.2. Room supplements/reduction\n1.3. Rate, rate + tax, rate + tax and fees\n2. Terms and\nconditions\n\nMay include:\n2.1. Payment upon confirmation\n2.2. Payment upon check-out\n2.3. 15-day or 30-day credit facility\n3. Validity\nMay include:\nAny of the following:\n3.1. January 1 to December 31\n3.2. April 1 to March 31\n3.3. October 1 to March 31\n3.4. Ad Hoc or One-off (valid only on dates/segments\nindicated)\n3.5. Year-round\n4. Type of room\n\nMay include:\n4.1. Twin room\n4.2. Double room\n4.3. Single room occupancy\n4.4. Triple room\n4.5. Twin room with extra bed\n4.6. Quad room\n4.7. Dormitory-type\n5. Supplements and\nreductions\n\nMay include:\n5.1. Supplement for porter fees\n5.2. Supplement for single-room occupancy\n5.3. Supplement for foreign-language-speaking tour guide\n5.4. Supplement for transport fares\n5.5. Supplement for half-board/full-board\n5.6. Supplement for arrival/departure transfers\n5.7. Triple room reduction\n5.8. Child rate reduction\n6. Tour Cost\n\nMay include:\n6.1 Tour cost is the sum total of all cost per person based on\ntour components included in the tour package\n6.2 It represents all payments due to suppliers\n6.3 Enterprise develop their own respective templates,\nhowever the foregoing must be clearly indicated\n7. Tour Cost with\nmark-up\n\nMay include:\n7.1 Tour cost plus mark-up (profit) is the sum total price to be\ncollected from the client on a per person basis\n7.2 It must include all government taxes due\n7.3 Enterprise develop their own respective templates,\nhowever the cost, mark-up and taxes due must be clearly\nindicated\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 71\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the type of tour component cost –\nfixed and variable and selected the most suitable\nservice providers\n1.2 Selected the contract rates and calculated the tour\ncomponent costs\n1.3 Used an accepted tour costing sheet format\nindicating tour cost, profit or mark-up and\napplicable government taxes due\n1.6 Communicated effectively with others to ensure\neffective work operation\n2. Resource implications\nThe following resources should be provided:\n2.1 Contracted rates of suppliers from, air, sea & land\ntransportation, taxes, parking fees, toll fees and\nother surcharges\n2.2 Accommodations rates including taxes, meal rates\nincluding taxes services charges Entrance fees,\ntaxes, tour guide & escort fees including, meals,\naccommodations and other expenses, ancillary\nservices\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Competency in this unit may be assessed through:\n3.1 Review of actual written assessment output based\non a scenario related to tour packaging (proposal,\nitinerary, suggestions)\n3.2. Observation with oral Questioning\n3.3. Review of portfolios done in the workplace pertaining\nto tour packaging tour costing calculation,\ncalculation of mark-up based on tour objectives and\ncalculation of government taxes due\n 3.4 Demonstration with Oral Questioning\n4. Context for assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 72"
