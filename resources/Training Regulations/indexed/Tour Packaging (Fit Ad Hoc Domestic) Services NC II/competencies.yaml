om colleagues to \nresolve or respond to \nemergency situations \n2.1 Systems, \nProcesses and \nOperations \n    2.1.1 Workplace   \n             health, safety  \n             and security  \n             procedures     \n     2.1.2 Emergency  \n             procedures \n     2.1.3 Personal   \n             presentation \n2.2 Safety Practices \n     2.2.1 Practice safety   \n              measures \n     2.2.2 5S       \n             Implementation \n2.1  Ability to make  \ndecision \n2.2  Time management \n2.3   Ability to offer \nalternative steps \n2.4   Applying \nemergency \nprocedures\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      51 \n \n4.4  Details of emergency \nsituations are \nreported in line with \nenterprise \nprocedures \n5.   Maintain safe \npersonal \npresentation \nstandards \n 5.1 Safe personal \nstandards are \nidentified and \nfollowed in line with \nenterprise \nrequirements \n5.1 Personal \npresentation \n5.2 Safety Practices \n         3.2.1 Practice   \n           safety measures \n          3.2.2 5S \nImplementation \n5.1 Following safe  \npersonal standards \n \n6.   Maintain a safe \nand secure \nworkplace \n6.1  Workplace health, \nsafety and security \nresponsibilities are \nidentified  \n6.2   Framework to \nmaintain workplace \nhealth, safety and \nsecurity are \nmaintained \n6.3   Procedures for \nidentifying and \nassessing health, \nsafety and security \nhazards and risks \nare implemented \n6.4   Injuries, illnesses and \nincidents are \ninvestigated \n6.5  Organization's health, \nsafety and security \neffectiveness are \nevaluated  \n6.1 Workplace health, \nsafety and security \nprocedures \n6.1  Ability to make \ndecision \n6.2  Ability to use \nobservation and \nmonitoring \ntechniques\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      52 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Health, safety and security \nprocedures \nMay include : \n1.1 Use of personal protective clothing and \nequipment \n1.2 Safe posture including sitting, standing, bending \n1.3 Manual handling including lifting, transferring \n1.4 Safe work techniques including knives and \nequipment, handling hot surfaces, computers \nand electronic equipment \n1.5 Safe handling of chemicals, poisons and \ndangerous materials \n1.6 Ergonomically sound furniture and work stations \n1.7 Emergency fire and accident \n1.8 Hazard identification and control \n1.9 Security of documents, cash, equipment, people \n1.10 Key control systems \n2. Breaches of procedure \nMay include: \n2.1 Loss of keys \n2.2 Strange or suspicious persons \n2.3 Broken or malfunctioning equipment \n2.4 Loss of property, goods or materials \n2.5 Damaged property or fittings \n2.6 Lack of suitable signage when required \n2.7 Lack of training on health and safety issues \n2.8 Unsafe work practices \n3. Emergency \nMay include: \n3.1   Personal injuries                              \n3.2   Fire \n3.3   Electrocution \n3.4   Natural calamity i.e. earthquake/flood \n3.5   Criminal acts i.e. robbery\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II   Revision 00   Promulgated  (01/11/2019)      53 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate : \n1.1  Complied with industry practices and procedures \n1.2  Used interactive communication with others \n1.3  Complied with workplace safety, security and hygiene \npractices \n1.4  Identified faults & problems and the necessary corrective \naction \n1.5  Demonstrated ability to perform child production duties \nrelevant to the tourism industry \n1.6  Demonstrated ability to prepare for observation and \nmonitoring activities relevant to designated situations \n1.7   Promoted public relation among others \n1.8   Complied with quality standards \n1.9  Responded to emergency situations in line with enterprise \nguidelines \n1.10  Complied with proper dress code \n2.  Resource \nimplications \nThe following resources should be provided: \n2.1   Procedures Manual on safety, security, health and \nemergency \n2.2   Availability of tools, equipment, supplies and materials  \n3.  Methods of \nassessment \nCompetency in this unit may  be assessed through: \n3.1   Written examination \n3.2   Practical demonstration  \n3.3   Interview \n4.   Context for \nassessment \n4.1   Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2   Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
