  "source_section_text": "SECTION 1 TOUR PACKAGING (Free Individual/Independent Traveler (FIT)\n AD HOC DOMESTIC) SERVICES NC II QUALIFICATION\n\nThe TOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II\nQualification consists of competencies that a person must achieve to receive, process\nand respond to requests for independent tour arrangements in the Philippines. It designs\nand develops tour itineraries, costs and prices the tour components; and prepares and\nprovides/sends appropriate responses for tour arrangements.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\nas shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in a team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nTRS311201\nDevelop and update industry knowledge\nTRS311202\nObserve workplace hygiene procedures\nTRS311203\nPerform computer operations\nTRS311204\nPerform workplace and safety practices\nTRS311205\nProvide effective customer service\n\nCODE NO.\nCORE COMPETENCIES\nTRS422305 Interpret and respond to request for individual/ independent tour\n services\nTRS422306\nDesign and develop a tour package itinerary\nTRS422307\nDetermine tour package cost and selling price\n\n--- PDF PAGE 6 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 2\n\nA person who has achieved this Qualification is competent to be a:\n\n❑ Tour Packaging Staff\n❑ Tour Operations Costing Staff\n❑ Staff Assistant for Tours\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 3"
}
