        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Took the client’s requirements according to the specifics\nprovided\n1.2 Interpreted the client’s requirements correctly and\nconfirmed specific services, and special requirements, if\nany\n1.3 Analyzed the client’s requirements according to the\nrequests and special needs\n1.4 Communicated effectively with others to ensure effective\nwork operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection\n2.3 Writing materials\n\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n 3.1 Review of actual written assessment output based on a\nscenario related to tour packaging (proposal, itinerary,\nsuggestions)\n3.2. Review of portfolios done in the workplace pertaining to\ntour packaging (proposal, bids, e-mails)\n3.4 Demonstration/ Observation with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 68 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 64\n\nUNIT OF COMPETENCY: DESIGN AND DEVELOP A TOUR PACKAGE ITINERARY\n\nUNIT CODE\n :"
        },
        "source_text": "TRS422305\n\nUNIT DESCRIPTOR : This unit deals with the knowledge and skills required to\ninterpret\nand\nrespond\nto\nrequests\nfor\nindividual/\nindependent tour arrangements to Philippines destinations.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Receive and\n record the\n tour\n requirements\n of the client\n1.1 Client details are\nrecorded\n1.2 Client profile is\ndetermined\n1.3 Individual/Independent\ntour requirements are\nrecorded\n1.4 Client special requests\nare noted\n1.5 All information is\nrecorded and reviewed\naccording to enterprise\nprocedures\n\n1.1 Effective\ncommunication -\nverbal and non-\nverbal\n1.2 Market\nclassifications\n1.3 Database\nmanagement\n\n1.1 Communication Skills\n1.2 Active listening\n1.3 Questioning\ntechniques\n1.4 Understanding\nmarket classifications\n1.5 Ability to gather and\nnote correct and\ncomplete information\n1.6 Computer Literacy\n\n2. Analyze tour\nrequirements\nof client\n2.1 Client profile is analyzed\nand classified\n2.2 Requested destination\nand activities are\nmatched with client\nrequirements\n2.3 Special needs and\ninterests are interpreted\nand incorporated\n2.4 Tour objectives are\ndetermined\n\n2.1 Philippine\n Geography\n2.2 Philippine\nDestinations\n2.3 Special Interests\nLocations\n2.4 Online resources\n(e.g. DOT, LGU,\nNational Library\nwebsites)\n2.1 Ability to analyze\nand understand\nmarket\nsegments/profile\n2,2, Ability to understand\nspecial\nneeds/interests\n2.3. Ability to select\nsuitable Philippines\ndestinations and\nactivities\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 60\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Prepare and\ndeliver\nresponse\n3.1. Type and mode of\nresponse, in verbal or\nwritten form is\ndetermined\n3.2 Content is\nconstructed according\nto enterprise\nstandards\n3.3 Response is\ndelivered in a timely\nmanner\n3.4 Clarifications,\nrevisions and\nadditional requests\nare addressed and\nresponded to\n3.1 Business writing\nprinciples\n3.2 Technical writing\n3.3 Enterprise\ndocuments -\nforms and\ntemplates\n3.4 Updated\nSoftware\nApplication\n3.1 Communication Skills\n3.2 Use of Information\nand Communication\nTechnology\nequipment\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Client details\n\nMay include:\n1.1.\nNames/s\n1.2.\nContact Number – Mobile and Landline\n1.3.\nAddress – Email and Home\n1.4.\nContact Person and details\n2. Client profile\n\nMay include:\n2.1\nSolo/couple\n2.2\nFamily and friends\n2.3\nBudget/Backpacker\n2.4\nMid-ranged traveler\n2.5\nHigh-end traveler\n2.6\nFIT/ Corporate\n2.7\nOther special interests (e.g. Pilgrims, Adventures,\nEco-tourists)\n3. Individual/Independent\ntour requirements\n\nMay include:\n3.1. Transportation to and from destinations and on-sites\n3.2. Accommodations\n3.3. Sightseeing tours and entertainment\n3.4. Tour guide/escort services\n3.5. Cruises\n3.6. Meal Plan\n3.7. Insurance and/or miscellaneous services\n3.8. Other requirements of the client\n\n4. Client special\nrequests\nMay include:\n4.1. Dietary Requirements\n4.2. People with Different Ability (PWDA)\n4.3. Senior citizens\n4.4. Transportation Preferences\n4.5. Rooming Preference\n4.6. Religious /Cultural Considerations and sensitivities\n4.7. Extra-ordinary Services\n5. Client classification\nMay include:\n5.1. Leisure/holiday\n5.2. Adventure/sports\n5.3. Historical/heritage\n5.4. Eco-tourism\n5.5. Culinary tourism\n5.6. Educational/agricultural tours/farm tourism\n\n6. Tour objectives\nMay include:\n6.1. Satisfaction of Client’s needs and wants\n6.2. Destination promotions\n6.3. Enterprise enhancement\n6.4. Financial gain\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 62\n\nVARIABLE\nRANGE\n7. Type and mode of\nresponse\nMay include:\nType of response:\n7.1.1 inquiry\n7.1.2 acknowledgement\n7.1.3 proposal\n7.1.4 clarification\n7.1.5 amendment\n7.1.6 confirmation\n7.1.7 re-confirmation\n7.1.8 cancellation.\n7.1.9 terms and conditions\nMode of response:\n7.2.1 Face-to-face (counter)\n7.2.2 Telephone – (voice) Landline / Mobile\n7.2.3 SMS\n7.2.4 Fax\n7.2.5 Internet – Email / Social Media\n7.2.6 Mail/courier service\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 63\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Took the client’s requirements according to the specifics\nprovided\n1.2 Interpreted the client’s requirements correctly and\nconfirmed specific services, and special requirements, if\nany\n1.3 Analyzed the client’s requirements according to the\nrequests and special needs\n1.4 Communicated effectively with others to ensure effective\nwork operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection\n2.3 Writing materials\n\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n 3.1 Review of actual written assessment output based on a\nscenario related to tour packaging (proposal, itinerary,\nsuggestions)\n3.2. Review of portfolios done in the workplace pertaining to\ntour packaging (proposal, bids, e-mails)\n3.4 Demonstration/ Observation with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 68 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 64\n\nUNIT OF COMPETENCY: DESIGN AND DEVELOP A TOUR PACKAGE ITINERARY\n\nUNIT CODE\n :"
