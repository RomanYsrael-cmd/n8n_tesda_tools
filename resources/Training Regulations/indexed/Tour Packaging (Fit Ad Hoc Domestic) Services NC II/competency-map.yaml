  "source_text": "COMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\n TOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 101 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 97\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nDevelop and update tourism\nindustry knowledge\nObserve workplace hygiene\nknowledge\nPerform computer\noperations\nPerform workplace and\nsafety practices\nProvide effective\ncustomer service\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 102 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 98\n\nInterpret and respond\nto request for\nindividual/\nindependent tour\nservices\nDesign and develop a\ntour package itinerary\nDetermine tour package\ncost and selling price\nOperate technology-based\ninformation system\n\nProvide information and\nadvice on a destination,\nproduct or service\n\nPromote\ntourism\nproducts and services\n\nResearch information\nrelevant to\n locality and tour Itinerary\n\nCoordinate tour\narrangements for clients\n\nAccompany and guide\nclients in accordance with\nthe tour itinerary\n\nAccompany and guide\nclients in accordance with\nthe tour itinerary\n\nReceive and process\nreservations\n\nOperate computerized\nreservations system\n\nProvide accommodation\nreception\nConduct night audit\n\nProvide club reception\nservices\n\nProvide porter\nservices\n\nPlan and develop event\nproposal and bid\n\nDevelop an event concept\n\nDevelop event program\n\nSelect event venue and\nsite\n\nDevelop and update\nevent industry\nProvide on-site event\nmanagement\nManage contractors for\nindoor events\n\nDevelop and update\nknowledge on\nProvide on-site information\nand assistance\n\nMonitor entry to venue\n\nProvide a site briefing or\nscripted\nOperate a ride location\n\nLoad and unload a ride\n\nMaintain safety in water-\nbased rides\n\nOperate a games\nlocation\n\nPromote at a games\nlocation\n\nOperate animal enclosure\nexhibit\n\nProvide general animal\ncare\n\nRescue animals\n\nCORE COMPETENCIES\n\n--- PDF PAGE 103 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 99\n\nGLOSSARY OF TERMS\n\n1. ADHOC PACKAGE\nA tour package assembled based on the specific\nrequirements of a client\n\n2. COSTING SHEET\nan enterprise generated spread sheet that\ndetails the per person cost of the components of\na tour package and reflect the total cost, mark-\nup and taxes due\n\n3. DOT\nDepartment of Tourism\n\n4. FIT\nFREE/FOREIGN\nin the acronym FIT the letter F refers to\nFREE or not a participant in an inclusive\ntour group; FOREIGN refers to the\ninternational (foreign) or domestic (local)\ntraveler\n\nINDIVIDUAL/INDEPENDENT\narrangements that are not part of a tour\npackage and\n\nTRAVELLER\nPerson availing of the travel / tour services\n\n5. GATEWAY\nentry/exit point of a destination\n\n6. GOVERNMENT TAX\nshare of collected amount due to the\ngovernment\n\n7. INDIVIDUAL/INDEPENDENT in the acronym FIT the letter I refers to an\nINDIVIDUAL or INDEPENDENT travelers who\nis not part of a tour group and whose tour\nrequirements and arrangements are not bound\nby tour group restrictions\n\n8. INTERNET\nelectronic information distribution system\n\n9. ITINERARY\na schedule of products, services and activities\narranged in a chronological order\n\n10. ITINERARY – SKELETAL\na general day-to-day schedule of products,\nservices and activities arranged in a\nchronological order\n\n11. ITINERARY – TECHNICAL\na specific schedule detailing transportation\nmodes, times, location and duration of\nproducts, services and activities arranged in a\nchronological order\n\n12. LGU\nLocal Government Unit\n\n--- PDF PAGE 104 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 100\n\n13. MARK UP\na percentage of tour costs or fixed amount that\nis added to the tour costs and reflects the profit\nof the enterprise\n\n14. OHS OPERATIONS\nMANAGER\nOccupational Health and Safety head of the\noperations department that coordinates all\nactivities pertaining to the services of all tour\ngroups and individual travelers\n\n15. PTQCS\nPhilippine T-VET Quality Certification System\n\n16. PRICE\nthe sum total amount to be collected from the\nclient on a per person basis that comprises the\ntour cost, mark-up, and government taxes\n\n17. REGULAR PACKAGE\nA tour package assembled based on the\ninterests of target market\n\n18. RESERVATION\nrefers to an advance request for a product or\nservice\n\n19. SUPPLIER\nrefers\nto\nhotels,\nrestaurants,\nresorts,\ntransportation operators and other entities that\nsupplies and accommodates travelers/tourists\n\n20. TOUR COSTS\nthe sum total of all cost per person based on tour\ncomponents included in the tour package; it\nrepresents all payments due to suppliers\n\n21. TOUR COORDINATOR\nan enterprise employee who assist the tour guide\nand the travelers on arrival, during and on\ndeparture for all scheduled activities in the\nitinerary\n\n22. TOUR GUIDE\nan individual duly trained and licensed by the\nLGU and accredited with the DOT who manages\nand accompanies local or foreign travelers within\na destination to provide information and oversee\nthe delivery the tour components by the suppliers\n\n--- PDF PAGE 105 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 101\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nTour Packaging (FIT AD HOC DOMESTIC) Services NC II\nQualification Code:\nTRSTOP219\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nTour Packaging\n(FIT AD HOC\nDOMESTIC)\nServices NC II\n2019-11 /\n01/11/19\nNo. 028 series\nof 2019\n\nLegend: *Description Types\n- Document Created\n\n--- PDF PAGE 106 ---\nTOUR PACKAGING (FIT AD HOC DOMESTIC) SERVICES NC II Revision 00 Promulgated (01/11/2019) 102",
