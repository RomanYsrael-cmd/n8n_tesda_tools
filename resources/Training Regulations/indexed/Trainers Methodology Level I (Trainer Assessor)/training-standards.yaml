  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\nand delivering training programs for TRAINERS METHODOLOGY (TM) LEVEL I\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title:\nCourse on Training Methodologies and Assessment\n(Trainers Methodology Level I)\n\nSuggested Nominal Training Duration: 128 hrs. (Basic Competencies)\n136 hrs. (Core Competencies)\n\nCourse Description:\n\nThis qualification is designed to enhance the knowledge, skills, positive attitude and work\nvalues of the learner in accordance with the prevailing standards in the Technical and Vocational\nEducation and Training (TVET) sector. This encompasses competencies required of a Technical–\nVocational Trainer to perform the tasks in the areas of instructional delivery/ facilitation,\ncompetency assessment, and maintenance of training resources / facilities.\n\nTo obtain this, all units of competency prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES – 128 hours\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\nCommunication\n1.1 Communicate\ninformation about\nworkplace processes\n1.2 Lead workplace\ndiscussions\n1.3 Identify and\ncommunicate issues\narising in the workplace\n• Group discussion\n• Role-playing\n• Brainstorming\n• Observation\n• Interview\n2. Apply math\nand science\nprinciples in\ntechnical\ntraining\n2.1 Identify math and\nscience manifestations in\nthe course content and\nthe workplace\n2.2 Relate math and science\nconcepts to common and\nworkplace situations\n2.3 Assess trainees’\ninternalization of math\nand science concepts\n2.4 Introduce further\nenhancements\n• Lecture-discussion\n• Projects/case\nstudies\n• Demonstration\nwith oral\nquestioning\n• Case problems\n\n--- PDF PAGE 77 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n73\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Apply\nenvironmental\nprinciples and\nadvocate\nconservation\n3.1 Follow environmental\nworkplace practices\n3.2 Contribute to improve\nenvironmental work\npractices\n3.3 Recognize and report\npotential environmental\nthreats\n•Lecture-discussion\n• Field visits\n•Direct\nobservation\n• Interview\n4. Utilize IT\napplications in\ntechnical\ntraining\n4.1 Set-up work environment\n4.2 Utilize word processing\napplication\n4.3 Utilize presenter\napplication\n4.4 Utilize spread sheet\napplication\n4.5 Utilize internet and www\nto communicate and\ncollect information\n•Lecture-discussion\n• Practical lab\n• Demonstration\n•Demonstration/\ndirect\nobservation with\noral questioning\n• Portfolio\nevaluation\n5. Lead small\nteams\n5.1 Provide team leadership\n5.2 Assign responsibilities\n5.3 Set performance\nexpectations for team\nmembers\n5.4 Supervised team\nperformance\n•Lecture\n• Demonstration\n• Self-paced\n(modular)\n•Demonstration\n• Case studies\n6. Apply work\nethics, values\nand quality\nprinciples\n6.1 Observe workplace\npolicies and guidelines\n6.2 Value self-worth and\nprofession\n6.3 Observe proper conduct\nin dealing with learners\nand parents\n•Lecture-discussion\n• Role-playing/\nsimulation\n• Case studies\n7. Work\neffectively in\nvocational\neducation and\ntraining\n7.1 Work within the\nvocational education and\ntraining policy framework\n7.2 Work within the training\norganization’s quality\nframework\n7.3 Manage work and work\nrelationships\n7.4 Demonstrate a client-\nfocused approach to\nwork\n•Lecture-discussion\n• Case studies\n•Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Third-party report\n8. Foster and\npromote an\ninclusive\nlearning culture\n8.1 Practice inclusivity\n8.2 Promote and respond to\ndiversity\n8.3 Develop and implement\nwork strategies to\nsupport inclusivity\n8.4 Promote a culture of\nlearning\n8.5 Monitor and improve\nwork practices\n•Lecture-discussion\n• Role-playing/\nsimulation\n• Field visits\n•Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Third-party report\n\n--- PDF PAGE 78 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n74\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n9. Ensure healthy\nand safe\nlearning\nenvironment\n9.1 Identify Occupational\nHealth and Safety (OHS)\nresponsibilities\n9.2 Identify hazards in the\nlearning environment\n9.3 Assess risks in the\nlearning environment\n9.4 Develop and implement\nactions to ensure the\nhealth safety and welfare\nof learners and/or\ncandidates\n9.5 Provide appropriate\nOccupational Health and\nSafety (OHS)\nrequirements to learners\nand/or candidates\n9.6 Monitor Occupational\nHealth and Safety (OHS)\narrangements in the\nlearning environment\n•Lecture-discussion\n• Field visits\n• Case studies\n•Demonstration\nwith oral\nquestioning\n• Case problems\n• Interview\n\n10. Maintain and\nenhance\nprofess-ional\npractice\n10.1 Model high standards of\nperformance\n10.2 Determine personal\ndevelopment needs\n10.3 Participate in\nprofessional\ndevelopment activities\n10.4 Reflect on and evaluate\nprofessional practice\n•Lecture-discussion\n• Role-playing\n• Case studies\n• Reporting/\npresentation\n•Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Written report\n11. Develop and\npromote\nappreciation for\ncosts and\nbenefits of\ntechnical\ntraining\n11.1 Study training cost\ncomponents\n11.2 Evaluate training costs\nand benefits\n11.3 Monitor conduct and\nresults of training\n11.4 Promote awareness of\ncosts and benefits of\ntraining\n•Lecture-discussion\n• Case studies\n•Case problems\n• Written exam\n• Interview\n• Written report\n\n12. Develop and\npromote\nunderstanding\nof global labor\nmarkets.\n12.1 Identify current and\nfuture trends/concerns\n12.2 Assess new\ndevelopments\n12.3 Utilize labor market\ninformation to best effect\n•Lecture-discussion\n• Case studies\n•Case problems\n• Written exam\n• Interview\n• Oral presentation\n\n--- PDF PAGE 79 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n75\nCORE COMPETENCIES – 136 hours\n\nNote: The training provider may offer the whole Course on Training Methodologies and Assessment covering\nCore Competency Nos. 1 to 6. Alternately, Units of competency Nos. 1, 2, 3, 4, and 6 may be bundled into a\nmodular course on Delivering/Conducting Training. Unit of competency No. 5 may be offered as a modular\ncourse on Conducting Assessment.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Plan training\nsession\n1.1 Identifying learner’s\ntraining requirements\n1.2 Prepare session plan\n1.3 Prepare instructional\nmaterials\n1.4 Prepare assessment\ninstruments (Institutional)\n1.5 Organize learning and\nteaching resources\nBased on CBC\nmethodology\n\n• Lecture\n• Video\npresentation\n• Group discussion\n• Computer aided\ninstruction\n• Computer based\nlearning (e-\nlearning)\n• Writeshop\n• Hands-on\nBased on CBC\nassessment method\n\n• Interview / Oral\nquestioning\n• Written output\n• Written/oral\nexamination\n• Demonstration\n2. Facilitate\nlearning session\n2.1 Prepare training facilities\n/resources\n2.2 Conduct pre-assessment\n2.3 Facilitate training\nsession\n2.4 Conduct competency\nassessment\n2.5 Review delivery of\ntraining session\n• Group discussion\n• Simulation\n• Lecture\n• Self –pace\ninstruction\n\n• Written test\n• Demonstration/\noral questioning\n\n3. Utilize\nelectronic\nmedia in\nfacilitating\ntraining\n3.1 Present a lesson through\ndirect video\nfootage/capture\n3.2 Present lesson via film\nviewing method\n3.3 Utilize computer and\nmultimedia technology to\npresent a lesson\n• Focused group\ndiscussion\n• Guided learning\nand exploration\n• Peer teaching\n• Role playing\n• Computer Aided\nInstruction\n• Demonstration\n• Oral Questioning\n• Written\nexamination\n\n--- PDF PAGE 80 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n76\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Supervise work-\nbased learning\n4.1 Establish training\nrequirement for trainees\n4.2 Monitor work-based\ntraining\n4.3 Review and evaluate\nwork-based training\neffectiveness\n• Hands-on\n• Discussions\n• Practical\nperformance\n• Case study\n• Discussion\n• Group activities\n• Open forum\n• Discussion\n• Action planning\n• Interview\n• Demonstration\nwith oral\nquestioning\n• Written test Oral\nQuestioning\n\n5. Conduct\ncompetency\nassessment\n5.1 Organize assessment\nactivities\n5.2 Prepare the candidate\n5.3 Gather evidence\n5.4 Make the assessment\ndecision\n5.5 Record assessment\nresults\n5.6 Provide feedback to\ncandidates\n• Lecture\n• Video\npresentation\n• Group discussion\n\n• Written\nexamination\n• Oral Interview\n• Demonstration\n• Direct\nobservation\n\n6. Maintain\ntraining facilities\n6.1 Plan and schedule\nmaintenance activities\n6.2 Implement\nhousekeeping activities\n6.3 Maintain training\nequipment and tools\n6.4 Document maintenance\ninspection\n\n• Group discussion\n• Simulation\n• Lecture\n• Self –pace\ninstruction\n\n• Written test\n• Demonstration /\nquestioning\n\n--- PDF PAGE 81 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n77\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n\nThe training is based on curriculum developed from the competency standards;\n\n\nLearning is modular in its structure;\n\n\nTraining delivery is individualized and self-paced;\n\n\nTraining is based on work that must be performed;\n\n\nTraining materials are directly related to the competency standards and the curriculum\nmodules;\n\n\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n\n\nTraining is based both on and off-the-job components;\n\n\nAllows for recognition of prior learning (RPL) or current competencies;\n\n\nTraining allows for multiple entry and exit; and\n\n\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both on\nand off-the-job as long as the learning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and\nRegulations.\n\n•\nModular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer just facilitates the training\ndelivery.\n\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n•\nSupervised industry training or on-the-job training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n\n•\nDistance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, audio, video or computer technologies.\n\n--- PDF PAGE 82 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n78\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nCandidate/trainee must satisfy the following requirements -- :\n\n•\nGraduate of baccalaureate degree or equivalent in training/experience along the field\nof Technical -Vocational Education and Training\n•\nCertified at the same or higher NC Level in the qualification that will be handled (for\ntechnical trainers)\n•\nAble to communicate orally and in writing\n•\nPhysically fit and mentally healthy\n•\nProficient in quantitative and qualitative analysis\n•\nProficient in verbal reasoning.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nTRAINERS METHODOLOGY LEVEL I\n\nRecommended list of tools and materials per trainee for TM Level I\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n\nHand tools (for the\ntarget trade areas)\n\nComputer and\nperipherals\n\nPaper and pencil\nLCD projector\nAudio video materials\n\nElectronic /Multimedia\nequipment\n\nHand outs\n\nTraining facilities/\nequipment\n(Depending on trade\narea)\n\nReference books\n\nWorkplace or\nsimulated environment\n\nManuals\nDifferent types of forms\n\nMaterials and\nconsumables for\nmaintenance activities\n\n--- PDF PAGE 83 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n79\n3.5\nTRAINING FACILITIES\n\nTRAINERS METHODOLOGY LEVEL I\n\nThe competency-based training environment for the training of trainers must include\ncomponent areas for the following - practical work area, learning resource center, training\nresource and production area, assessment area, quality control and support area.\nAt the minimum, there should be provisions for a lecture and workshop area, learning\nresource area, multimedia/computer/audio-visual laboratory and workshop/production area.\n\n3.6\nTRAINERS’ QUALIFICATIONS – Course on Training Methodologies and Assessment\n\n•\nMust be a holder of Trainers Methodology Level III or higher/equivalent qualification\nor training/experience*\n•\nWith at least five (5) years experience as trainer/teacher\n•\nWith good moral character\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\nMust be a holder of professional teacher license issued by PRC or equivalent**\n•\nMust have 1 year industry experience***\n\n*\nequivalent qualification will be accepted only during the transition period toward the\nTrainers Methodology Levels III and IV when there are few or no holders yet of TM III\nand TM IV; this period will be further defined by TESDA\n** this applies only to schools prescribing this requirement\n*** optional; only when required by the hiring institution\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 84 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n80"
