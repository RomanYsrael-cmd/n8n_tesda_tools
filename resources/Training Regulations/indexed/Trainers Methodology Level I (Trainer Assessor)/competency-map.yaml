  "source_text": "Section 1. Successful candidates shall be awarded a\nNational TM Certificate signed by the TESDA Director General.\n\n4.2\nThe Qualification may be acquired through accumulation of TM Certificates of Competency\n(COC) in the following cluster of units of competency and individual unit of competency –\n\n4.2.1\nDeliver training session\n\n4.2.1.1\nPlan training session\n4.2.1.2\nFacilitate training session\n4.2.1.3\nUtilize electronic media in facilitating training\n4.2.1.4\nMaintain training facilities\n4.2.1.5\nSupervise work-based learning\n\n4.2.2\nConduct competency assessment\n\n4.3\nUpon accumulation and submission of the above two (2) TM-COCs acquired, an individual\nshall be issued the National TM I Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic competencies shall be\nintegrated or assessed concurrently with the core units.\n\n4.5\nThe candidate applying for assessment and certification under TM I must be\n\n4.5.1 BS graduate or equivalent\n4.5.2 Certified in the National Certificate level that will be handled/facilitated\n\n--- PDF PAGE 85 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n81\n\nLegend\nTrainer\nQualification I\nCompetency Map\nTrainer Qualification\nCORE\nCOMPETENCIES\nPlan training sessions\nFacilitate learning sessions\nSupervise Work-based\nlearning\nConduct competency\nassessment\nMaintain training facilities\nUtilize electronic media in\nfacilitating training\nFacilitate development of\ncompetency standards\nDevelop competency\nassessment tools\nDevelop learning materials\nDevelop learning materials\nfor E-learning\nConduct training needs\nanalysis\nDevelop training curriculum\nDesign and develop\nmaintenance system\nBASIC\nCOMETENCIES\nLead workplace\nCommunication\nApply math and science\nprinciples in technical\ntraining\nApply environmental\nprinciples and advocate\nconservation\nUtilize IT applications in\ntechnical training\nLead small teams\nApply work ethics, values\nand quality principles\nWork effectively in\nvocational education and\ntraining\nFoster and promote a\nlearning culture\nEnsure healthy and safe\nlearning environment\nMaintain and enhance\nprofessional practice\nDevelop and promote\nappreciation for cost-\nbenefits of technical training\nDevelop and promote\nglobal understanding of\nlabor markets\nLegend\nTrainer\nQualification I\nCompetency Map\nTrainer Qualification\nCORE\nCOMPETENCIES\nPlan training sessions\nFacilitate learning sessions\nSupervise Work-based\nlearning\nConduct competency\nassessment\nMaintain training facilities\nUtilize electronic media in\nfacilitating training\nFacilitate development of\ncompetency standards\nDevelop competency\nassessment tools\nDevelop learning materials\nDevelop learning materials\nfor E-learning\nConduct training needs\nanalysis\nDevelop training curriculum\nDesign and develop\nmaintenance system\nBASIC\nCOMETENCIES\nLead workplace\nCommunication\nApply math and science\nprinciples in technical\ntraining\nApply environmental\nprinciples and advocate\nconservation\nUtilize IT applications in\ntechnical training\nLead small teams\nApply work ethics, values\nand quality principles\nWork effectively in\nvocational education and\ntraining\nFoster and promote a\nlearning culture\nEnsure healthy and safe\nlearning environment\nMaintain and enhance\nprofessional practice\nDevelop and promote\nappreciation for cost-\nbenefits of technical training\nDevelop and promote\nglobal understanding of\nlabor markets\n\n--- PDF PAGE 86 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n82\nDEFINITION OF TERMS\n\n1.\nTrainer\na person who enables a learner or group of learners to develop\nor acquire competencies toward performing a particular trade or\ntechnical work\n2.\nAssessor\nan accredited individual authorized to evaluate or assess\ncompetencies of a candidate or person applying for certification\n\n3.\nQualification\na cluster of units of competency that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a\nperson on successful completion of a course and/or in\nrecognition of having demonstrated competencies relevant to an\nindustry\n4.\nCompetency\nassessment\nthe process of collecting evidence and making judgments on\nwhether competency has been achieved\n\n5.\nCompetency standard\na description of competency formed by the knowledge, abilities,\nskills, comprehension and attitudes required for acceptable\nperformance of a productive function and established as a\nreference or requirement for a qualification. Competency\nstandards are made up of units of competency, which are\nthemselves made up of elements of competency, together with\nperformance criteria, a range of variables, and an evidence\nguide\n6.\nUnit of competency\na component of a competency standard. A unit of competency is\na statement of a key function or role in a particular job or\noccupation\n\n--- PDF PAGE 87 ---\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the representatives of business, industry, academe and government\nagencies who donated their time and expertise to the development and validation of these\nTraining Regulations.\n\nTHE TECHNICAL WORKING GROUP\n\n1)\nMr. FELIPE T. TORRES\n\nConsultant\n\nGokongwei Brothers Foundation Learning and Development Center\n\n2)\nMr. ARTHUR LUIS P. FLORENTIN, FPM\n\nPeople Management Association of the Philippines (PMAP)\n\nPhilippine Society for Training and Development (PSTD)\n\n3)\nMs. MARJORIE G. MENDENILLA\n\nExecutive Director\n\nTEVSAPHIL\n\n4)\nMr. FREDELITO N. SUAREZ\n\nAssociate Director, Academic Services\n\nMMLDC Foundation, Inc.\n\n5)\nMr. RODOLFO C. MENGUITA\n\nTraining Director/HRD Manager\n\nD. M. Consunji, Inc.\n\n6)\nMr. VLADIMIR H. SANTOS\n\nMFI Foundation, Inc.\n\n7)\nMs. MILAGROS O. HERNANDEZ\n\nPhilippine Society for Training and Development\n\nMembers of the TESDA Board\n\nThe TESDA Board Standards-Setting and Systems Development Committee\n\nThe Management and Staff of the TESDA Secretariat\nQualifications and Standards Office (QSO)\nCompetency Assessment and Certification Office (CACO)\n\n--- PDF PAGE 88 ---"
