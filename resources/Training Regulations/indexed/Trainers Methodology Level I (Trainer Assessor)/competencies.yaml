        "source_text": "500232104\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required in demonstrating and\nliving out desirable work ethics, values and principles in the\nworkplace and training environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Observe workplace\npolicies and guidelines\n1.1\nAttendance and punctuality are observed in line with\nenterprise policies and guidelines.\n1.2\nWork functions are performed in line with work\nposition/delegation and according to enterprise goals and\nobjectives.\n1.3\nCommunication, request, and complaints are channelled\nthrough authority in line with enterprise policies and\nprocedures.\n1.4\nAcademic freedom is exercised in line with enterprise goals\nand objectives\n1.5\nQuality work instructions are delivered in accordance with\nwork deadlines and training calendars.\n2. Value self-worth and\nprofession\n2.1\nBest practices in teaching are demonstrated at all times.\n2.2\nPersonal and professional upgrading is exercised in line with\npersonal goals and enterprise guidelines and policies.\n2.3\nConfidentiality of records and other documents are\nmaintained in line with enterprise policies and guidelines.\n2.4\nProfessional courtesy is exercised at all times\n2.5\nProfessional role and image as technical trainer are\nmaintained in the classroom/training environment and\nrelated situations.\n\n3. Observe proper\nconduct in dealing with\nlearners and parents\n3.1\nPromotion of learners is performed based on non-prejudice\ndecision and actual accomplishments and performance of\nlearners.\n3.2\nLearners were given equal opportunities to learn and utilize\nschool facilities in line with the enterprise objective and\ngoals.\n3.3\nParent consultations are performed in line with enterprise\npolicies and guidelines\n\n--- PDF PAGE 22 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work functions\nMay include but not limited to:\n1.1\nTeaching\n1.2\nGuiding\n1.3\nManaging events and school activities\n2. Academic freedom\nMay include but not limited to:\n2.1\nSelection of teaching methods\n2.2\nImplementation of remedial classes\n2.3\nChanging methods of collecting evidence of learning\n3. Best practices in\nteaching\nMay include:\n3.1\nTeaching with teaching aids\n3.2\nEmploying learner-centered activities\n4. Non-prejudice decision\nMay include, but not limited to:\n4.1\nDecision made from favour\n4.2\nDecision came from political reason\n\n--- PDF PAGE 23 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n19\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nObserved workplace policies and guidelines\n1.2\nValued self-worth and profession\n1.3\nObserved proper conduct in dealing with learners and\nparents.\n2. Underpinning\nKnowledge\n2.1\nCode of ethics and right conduct\n2.2\nPersonnel management\n2.3\nFilipino customs and traits\n3. Underpinning Skills\n3.1\nInterpersonal skills\n3.2\nCommunication skills\n4. Resource Implications\nThe following MUST be provided:\n4.1\nCase study\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nWritten test/ Interview\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace /simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 24 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n20\nUNIT OF COMPETENCY\n:\nWORK EFFECTIVELY IN VOCATIONAL EDUCATION AND\nTRAINING\n\nUNIT CODE\n:"
