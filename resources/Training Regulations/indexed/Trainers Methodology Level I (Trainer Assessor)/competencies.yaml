          "source_text": "VARIABLE \nRANGE \n1. Work folder is \nconfigured  \n \nMay include but not limited to: \n1.1 \nFolder creation \n1.2 \nFolder copy and transfer \n1.3\nFolder sharing\n2. Desktop and shortcuts \nsettings are configured \nMay include but not limited to: \n2.1 \nDesktop background and screen saver settings \n2.2 \nScreen resolution settings \n2.3\nShortcut and link creation \n3. Document layout and \nformatting  \nMay include: \n3.1 \nPage settings \n3.2 \nFont Settings \n3.3 \nFormatting styles \n3.4\nTable utilization\n4. Application features  \nMay include, but not limited to: \n4.1 \nFooter and header setting \n4.2 \nMail merge \n4.3 \nReview and editing tools \n4.4 \nReference features \n4.5\nForm creation features\n5. Best practices in \nutilizing presentation \npackage \nMay include but not limited to: \n5.1 \nNumber of text lines, font size and fore and back colors. \n5.2 \nOptimal utilization of animation and transition effects to \nenhance learning experience not to distract audience. \n5.3\nAwareness in unconscious actions during presentation\n6. Printing of presentation \nmaterials \nMay include but not limited to: \n6.1 \nSlide \n6.2\nNotes\n7. Workbook and \nworksheet settings \nMay include but not limited to: \n7.1 \nPage setup \n7.2 \nHeader setup \n7.3\nWorksheet organization\n8. Formula \nMay include but not limited to: \n8.1 \nSummation \n8.2 \nDivision \n8.3 \nMultiplication \n8.4 \nDivision \n8.5 \nAverage \n8.6 \nRounding off \n8.7 \nIf \n8.8\nConcatenate \n9. Browser configuration \nMay include but not limited to: \n9.1 \nCookie settings \n9.2 \nPlug-in setup \n9.3 \nAccessibility adjustments\n\n--- PDF PAGE 17 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n13"
