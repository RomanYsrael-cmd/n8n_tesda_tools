        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1\nPrepared training facilities/resources.\n1.2\nConducted pre-assessment to learners.\n1.3\nFacilitated training session.\n1.4\nConducted competency assessment.\n1.5\nReviewed delivery of training session.\n2. Underpinning\nKnowledge\n\n2.1\nPrinciples of adult learning.\n2.2\nPrinciples in assessing and procedures in conducting and\nreviewing training sessions.\n2.3\nPreparation of training resources.\n2.4\nProcedures in conducting pre-assessment.\n2.5\nProcedures in conducting competency assessment.\n3. Underpinning Skills\n3.1\nSkills in facilitating group and individual learning.\n3.2\nSkills in designing task to facilitate learning.\n3.3\nSkills in conducting pre-assessment of learners.\n3.4\nSkills in conducting competency assessment.\n3.5\nSkills in reviewing delivery of training sessions.\n4. Resource Implications\n\nThe following resources MUST be provide:\n4.1\nAccess to learners and learning environment.\n4.2\nAccess to appropriate tools, equipment and materials\nrelevant to the training activities.\n5. Methods of\nAssessment\nCompetency maybe assessed through:\n5.1\nDemonstration / Observation with oral questioning.\n5.2\nPortfolio\n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 63 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n59\nUNIT OF COMPETENCY\n:\nSUPERVISE WORK-BASED LEARNING\n\nUNIT CODE\n:"
        },
        "source_text": "TVT232302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in delivering\nCompetency-Based Training Session. It covers the following:\npreparing\ntraining\nsession,\nconducting\npre-assessment,\nfacilitating training session, conducting competency assessment\nand reviewing delivery of training session.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare Training\nFacilities/Resources\n1.1\nAppropriate training facilities/resources are prepared\nbased on the session requirement.\n1.2\nLearning stations are prepared & set-up according to\nlearning activities.\n1.3\nTools and equipment are prepared and set-up according to\nlearning activities.\n2. Conduct Pre-\nassessment\n2.1\nPre-assessment instruments are prepared in accordance\nwith the number of applicants.\n2.2\nContext and procedures of pre-training assessment are well\nexplained according to guidelines.\n2.3\nEvidence is gathered using the assessment tools specified in\nthe evidence plan.\n2.4\nEvidences are evaluated and feedbacks are discussed\nbased on the results of the pre-training assessment.\n2.5\nCurrent competencies and prior learning are determined and\ncredited.\n2.6\nCharacteristics and profile of learners are evaluated.\n3. Facilitate Training\nSession\n3.1\nLearners are properly oriented on the CBT delivery system.\n3.2\nAppropriate training methods are used based on the level\nand characteristics of the learners.\n3.3 Learners are assisted to achieve session outcomes.\n3.4\nWork and learning activities are monitored based on training\nplan.\n3.5\nFeedback is provided to improve learners’ competence.\n4. Conduct Competency\nAssessment\n\n4.1\nLearners are oriented on the evidence requirements relevant\nto the evidence plan.\n4.2\nCompetency assessment tools, materials and equipment are\nprovided to learners.\n4.3\nEvidences are gathered and documented using relevant\nassessment tools.\n4.4\nAssessment results are recorded in accordance with the\napproved rating system.\n4.5\nAppropriate feedback mechanism is used to inform learner\nof his/her progress.\n5. Review Delivery of\nTraining Session\n\n5.1\nAppropriate training session evaluation instruments are\nused.\n5.2\nInterpretation is made on the results of evaluation on delivery\nof training session.\n5.3\nAdjustments on delivery of training session are made based\non the results of evaluation.\n\n--- PDF PAGE 61 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n57\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Training Facilities /\nResources\nMay include but not limited to the following:\n1.1\nLearning Guide\n1.2\nInstructional Materials\n1.2.1\nCDs\n1.2.2\nLEs\n1.2.3\nCBLM\n1.3\nService manuals\n1.4\nReferences\n1.5\nJournals\n1.6\nFurniture and fixtures\n1.7\nTools and equipment\n1.8\nWorkstations\n2. Evidence\n2.1\nDirect\n2.2\nIndirect\n3. Profile of learners\nMay include but not limited to:\n3.1\nLearner’s styles\n3.2\nLearner’s objectives\n3.3\nLearner’s resources\n3.4\nEthnicities\n3.5\nLanguage\n4. Feedback\nMay include but not limited to:\n4.1\nLearners strong and weak points\n4.2\nRating/grades\n4.3\nLearner’s Progress specification\n4.4\nProcedures\n4.5\nLearner’s Deficiency\n4.6\nRecommendation for improvement\n5. Training Methods\nMay include but not limited to the following:\n5.1\nOral presentations\n5.2\nSimulation activities\n5.3\nGroup work\n5.4\nDemonstration\n5.5\nLaboratory work\n5.6\nAssignments\n5.7\nComputer-based learning\n5.8\nGroup discussion\n5.9\nLecture\n6. Feedback Mechanism\nMay include but not limited to:\n6.1\nVerbal communication\n6.2\nWritten communication\n6.2.1\nAttendance records\n6.2.2\nAssessment records\n6.2.3\nIndividual learners progress reports/chart surveys\n6.3\nElectronic media communication\n7. Training Session\nEvaluation Instruments\nMay include but not limited to :\n7.1\nSupervisor survey\n7.2\nExit survey\n7.3\nTrainer’s competence survey\n7.4\nInstructional materials survey\n7.5\nStudent’s evaluation of instruction\n7.6\nSystems audit\n\n--- PDF PAGE 62 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n58\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1\nPrepared training facilities/resources.\n1.2\nConducted pre-assessment to learners.\n1.3\nFacilitated training session.\n1.4\nConducted competency assessment.\n1.5\nReviewed delivery of training session.\n2. Underpinning\nKnowledge\n\n2.1\nPrinciples of adult learning.\n2.2\nPrinciples in assessing and procedures in conducting and\nreviewing training sessions.\n2.3\nPreparation of training resources.\n2.4\nProcedures in conducting pre-assessment.\n2.5\nProcedures in conducting competency assessment.\n3. Underpinning Skills\n3.1\nSkills in facilitating group and individual learning.\n3.2\nSkills in designing task to facilitate learning.\n3.3\nSkills in conducting pre-assessment of learners.\n3.4\nSkills in conducting competency assessment.\n3.5\nSkills in reviewing delivery of training sessions.\n4. Resource Implications\n\nThe following resources MUST be provide:\n4.1\nAccess to learners and learning environment.\n4.2\nAccess to appropriate tools, equipment and materials\nrelevant to the training activities.\n5. Methods of\nAssessment\nCompetency maybe assessed through:\n5.1\nDemonstration / Observation with oral questioning.\n5.2\nPortfolio\n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 63 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n59\nUNIT OF COMPETENCY\n:\nSUPERVISE WORK-BASED LEARNING\n\nUNIT CODE\n:"
      }
