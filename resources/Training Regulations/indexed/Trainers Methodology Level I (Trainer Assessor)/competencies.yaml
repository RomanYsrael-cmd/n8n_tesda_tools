        "source_title": "MAINTAIN AND ENHANCE PROFESSIONAL PRACTICE",
        "source_text": "--- PDF PAGE 45 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n41 \nUNIT OF COMPETENCY \n: \nMAINTAIN AND ENHANCE PROFESSIONAL PRACTICE \n \nUNIT CODE \n: \n500232108 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required for \nindividuals to manage their personal professional performance and \nto take responsibility for their professional development in relation \nto the provision of training and services. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Model high standards of \nperformance \n1.1 \nPersonal performance is consistent with the organization’s \ngoals and objectives. \n1.2 \nAppropriate professional techniques and strategies are \nmodeled in accordance with existing organizational policies and \nguidelines. \n1.3 \nPersonal work goals and plans reflect individual responsibilities \nand accountabilities in accordance with organizational/legal \nrequirements. \n1.4 \nEthical and inclusive practices are applied in professional \npractice and in accordance with existing organizational policies \nand guidelines.\n2. Determine personal \ndevelopment needs \n2.1 \nPersonal knowledge and skills are assessed against units of \ncompetency and other relevant benchmarks in accordance with \nthe development needs and priorities. \n2.2 \nChanges in vocational education, training policy and operating \nenvironments are identified in accordance with the impact on \nprofessional practice and personal development needs.  \n2.3 \nFeedback from colleagues and clients is identified and used in \naccordance with personal learning needs/areas of professional \ndevelopment. \n2.4 \nFuture career options are identified as appropriate. \n2.5 \nPersonal learning needs are documented and updated in \naccordance with existing policies and procedures. \n2.6 \nPersonal development needs are discussed with relevant \npersonnel for inclusion in accordance with the professional \ndevelopment plan.\n3. Participate in \nprofessional \ndevelopment activities \n3.1\nDevelopment opportunities suitable to personal learning \nstyle/s are selected and used in accordance with continuous \nsupport of learning and maintenance of current professional \npractice/s.  \n3.2 \nProfessional networks are participated in accordance with \ncontinuous support of learning and maintenance of current \nprofessional practice/s.  \n3.3 \nOwn performance and professional competency is continuously \nimproved through engagement in accordance with professional \ndevelopment activities. \n3.4 \nTechnology is used to maintain regular communication in \naccordance with relevant networks, organizations and \nindividuals.\n4. Reflect on and evaluate \nprofessional practice \n4.1\nDevelopments and trends impacting on professional practice \nare researched and integrated in accordance with work \nperformance.  \n4.2 \nFeedback from colleagues/clients is used to identify and \nintroduce improvements in accordance work performance. \n4.3 \nInnovative and responsive approaches for improving \nprofessional practice are identified and used in accordance with \ncontinuous support to improve techniques and processes. \n4.4 \nRecords, reports and recommendations for improvement are \nmanaged in accordance with the organization’s systems and \nprocesses.\n\n--- PDF PAGE 46 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n42 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Organization’s goals \nand objectives \nMay include: \n1.1 \nbusiness plan \n1.2 \nstrategic plan \n1.3 \noperational plan/s \n1.4 \norganization’s code of conduct \n1.5 \nflexibility and client responsiveness \n1.6 \nclient satisfaction \n1.7 \nfinancial performance \n1.8 \npeople management \n1.9 \nmarketing and client service \n1.10 quality and quality assurance \n2. Professional \ntechniques and \nstrategies \nMay include: \n2.1 \ntechniques for initiating action and directing decision making \n2.2 \nstrategies for presenting a confident and assured manner in \nchallenging situations \n2.3 \nmaintaining ethical practice in the face of opposition \n2.4 \nmodeling behavioral and personal presentation standards \n2.5 \nmotivation strategies \n2.6 \ntime management \n2.7 \nstrategies for acknowledging and respecting the attitudes \nand beliefs of others \n2.8 \ntechniques for promoting active participation \n3. Organizational/legal \nrequirements \nMay include: \n3.1 \ncustomer complaints, grievances and appeals \n3.2 \nrisk identification and management, including OHS \n3.3 \nquality and continuous improvement processes and \nstandards, including validation systems \n3.4 \nfinancial management, including refund policies and systems \nto protect fees paid in advance (if appropriate) \n3.5 \nrecognition of qualifications issued by other training \norganizations \n3.6 \naccess and equity \n3.7 \nclient selection, enrolment and induction/orientation \n3.8 \nstaff recruitment, induction and ongoing development and \nmonitoring \n3.9 \navailability of policies and procedures to all personnel and \nlearners/clients \n3.10 collaborative/partnership arrangements \n3.11 confidentiality and privacy requirements \n3.12 ethical standards \n3.13 defined resource parameters\n\n--- PDF PAGE 47 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n43 \n \nVARIABLE \nRANGE \n \n3.14 administrative and records management system, for \nexample: \n3.14.1 reporting/recording requirements and arrangements \n3.14.2 maintenance, retention, archiving, retrieval, storage \nand security of information \n3.14.3 document version control \n4. Ethical and inclusive \npractices \nMay include: \n4.1 \ndemonstrating probity in all areas of responsibility \n4.2 \nmodeling organizational/professional codes of conduct \n4.3 \nreinforcing ethical conduct in interactions with and between \nother people \n4.4 \nshowing respect for individual diversity, culture and religion \n4.5 \nrecognizing and utilizing difference to develop both the \nindividual and the organization \n4.6 \ndemonstrating sensitivity to the circumstances and \nbackground of others \n4.7 \nfostering a culture of inclusiveness \n4.8 \nnew/revised policy directions in vocational education and \ntraining \n5. Feedback \nMay include: \n5.1 \nformal/informal performance appraisals \n5.2 \nobtaining comments from supervisors and colleagues \n5.3 \nobtaining comments from clients \n5.4 \npersonal reflective behavior strategies \n5.5 \nroutine organizational methods for monitoring service \ndelivery \n6. Professional \ndevelopment plan \nMay include: \n6.1 \nthe organization’s professional development plan for each \nindividual staff member, outlining: \n6.2 \nwork and personal career objectives \n6.3 \nidentified areas requiring development \n6.4 \nlearning opportunities/activities \n6.5 \nrelevant work activities/projects \n6.6 \nlinks to organizational training needs profile \n7. Development \nopportunities \nMay include: \n7.1 \nundertaking further higher education \n7.2 \nundertaking professional development in specific areas of \npractice \n7.3 \ninternal training/development programs \n7.4 \nrelevant conferences, seminars and workshops \n7.5 \nreading relevant journals and literature \n7.6 \nnetworking with internal/external colleagues \n7.7 \ncoaching and/or mentoring\n\n--- PDF PAGE 48 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n44 \n \nVARIABLE \nRANGE \n8. Current professional \npractice/s \nMay include: \n8.1 \nvocational competency and/or technical expertise in subject \nmatter \n8.2 \nprofessional practice as a trainer/facilitator,  \n9. Professional networks \nMay include: \n9.1 \ninformal networks with: \n9.1.1 \nother trainers/facilitators \n9.1.2 \npeople working in industry/vocational area \n9.1.3 \ncontacts in vocational education and training \n9.2 \nformal networks such as: \n9.2.1 local/ trainer networks \n9.2.2 interest and support groups \n9.2.3 regional, specialist and peak associations \n9.2.4 professional/occupation associations \n9.2.5 communities of practice \n10. Technology \nMay include: \n10.1 computer-based communication, e.g. email, Internet, \nExtranet and Intranet \n10.2 facsimile machines \n10.3 telephone \n10.4 video conferencing \n11. Developments and \ntrends \nMay include: \n11.1 new/revised Training Packages in vocational area of \nexpertise \n11.2 legislative/regulatory changes in vocational area of \ncompetency \n11.3 new developments/directions/trends in vocational education \nand training \n11.4 policy changes in vocational education and training \n12. Continuous support to \nimprove techniques \nand processes \nMay include: \n12.1 limited and systemic evaluation \n12.2 records review and maintenance \n12.3 self-assessment \n12.4 strategic business/operational planning \n12.5 ongoing education and training \n12.6 team meetings and networking\n\n--- PDF PAGE 49 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n45 \nEVIDENCE GUIDE \n \n1. Critical aspects of  \nCompetency   \nAssessment requires evidence that the candidate : \n1.1 \nModeled high standards of performance  \n1.2 \nDetermined personal development needs \n1.3 \nParticipated in professional development activities \n1.4 \nReflected on and evaluate professional practice \n2. Underpinning \nknowledge and  \nattitude \n2.1 \norganizational goals/objectives \n2.2 \norganizational processes, procedures and opportunities \nrelating to professional development \n2.3 \na range of continuous improvement techniques and \nprocesses and their application \n2.4 \nsocial and education trends and changes impacting on the \nvocational education and training environment, for example: \n2.4.1 policy changes \n2.4.2 technological changes \n2.4.3 cultural changes \n2.4.4 economical changes \n2.5 \nnetworks relevant to professional practice \n2.6 \nstandards/principles, ethnical/inclusive principles and \npractices \n2.7 \ntypes and availability of training development activities and \nopportunities \n2.8 \nrelevant policies, legislation, codes of practice and national \nstandards for example: \n2.8.1 Training Packages, competency standards, other \nrelevant benchmarks \n2.8.2 licensing requirements \n2.8.3 industry/workplace requirements \n2.8.4 duty of care under common law \n2.8.5 recording information and confidentiality requirements \n2.8.6 anti-discrimination including equal opportunity, racial \nvilification and disability discrimination \n2.8.7 workplace relations \n2.8.8 industrial awards/enterprise agreements \n2.8.9 National Reporting System \n2.9 \nrelevant OHS knowledge relating to the work role/work \ncontext, and OHS when managing own professional practice \nand performance \n3. Underpinning skills \n3.1 \nreflection skills to: \n3.1.1 systematically evaluate personal work practices to \nimprove performance or understanding \n3.1.2 reduce or prevent stress \n3.2 \nleadership skills to present a professional image\n\n--- PDF PAGE 50 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n46 \n \n \n3.3 \nself-evaluation skills to: \n3.3.1 identify gaps in skills or knowledge \n3.3.2 obtain competencies to meet current and future \norganizational objectives \n3.4 \nresearch skills to: \n3.4.1 keep up with trends in vocational education and \ntraining to obtain current information \n3.4.2 identify relevant industry affiliations \n3.4.3 keep up with trends/changes/developments in the \nvocational area of competency \n3.5 \ncommunication skills to: \n3.5.1 obtain feedback from colleagues and clients \n3.5.2 participate in professional networks \n3.5.3 consult with colleagues and clients \n3.6 \ninterpersonal skills to: \n3.6.1 participate in industry events and activities \n3.6.2 build professional relationships \n3.7 \nnetworking skills to build an industry network \n3.8 \nliteracy skills to: \n3.8.1 document personal learning needs \n3.8.2 read and interpret vocational education and training \ninformation such as legal/ organizational policy \ndocuments \n3.8.3 complete and maintain records related to professional \ndevelopment \n3.9 \ntime management skills to: \n3.9.1 organize professional development activities \n3.9.2 analyze and identify career options \n3.9.3 create a balance between work, study, personal and \nrecreation activities \n4. Resource Implication \n \nThe following resources MUST be provided: \n4.1 \nrelevant organizational/legal documentation \n4.2 \naccess to relevant benchmarks \n4.3 \naccess to networks, technology, communication \n5. Method of assessment \nCompetency must be assessed through : \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nWritten Test \n5.4 \nThird Party Report \n6. Context for \nassessment \n \n6.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group\n",
