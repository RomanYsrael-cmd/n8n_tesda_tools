        "source_title": "UTILIZE ELECTRONIC MEDIA IN FACILITATING TRAINING",
        "source_text": "--- PDF PAGE 73 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n69 \nUNIT OF COMPETENCY \n: \nUTILIZE ELECTRONIC MEDIA IN FACILITATING TRAINING   \n \nUNIT CODE \n: \nTVT232306 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required in \nadvance training environment using electronic media in \nfacilitating training, including operation and maintenance of the \nequipment.   \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Inspect electronic \nmedia equipment \n1.1 \nElectronic media equipment are inspected according to \nspecified checklist. \n1.2 \nAbnormalities or fault are identified and problem areas are \nanticipated.  \n1.3 \nHealth and Safety hazards are identified. \n2. Operate electronic \nmedia equipment to \ndeliver a lesson \n2.1 \nEquipment are set-up in accordance with health and  safety \nstandards  \n2.2 \nElectronic media equipment are operated in accordance to \nUser’s Manual \n2.3 \nEquipment are used for optimum performance  based on its \ncapacity \n2.4 \nTeacher and learner cantered learning principles are \nimplemented in line with the execution of session plan.  \n3. Maintain electronic \nmedia equipment \n3.1 \nPreventive maintenance procedure, diagnostic tools and \nsystem check are applied periodically. \n3.2 \nChecklist are maintained as per Standard Operating \nProcedures  \n3.3 \nAV/multimedia equipment are stored to safe rack/cabinet\n\n--- PDF PAGE 74 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n70 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Electronic media \nequipment \nMay include but not limited to  \n1.1 \nAudio Mixers \n1.2 \nComputer Application Software \n1.3 \nMicrophones \n1.4 \nDVDs/CDs \n1.5 \nAudio Amplifiers \n1.6 \nSpeakers System \n1.7 \nP.A Systems   \n1.8 \nCamera (Digital/Film Based) \n1.9 \nVideo Camera \n1.10 AV Tapes \n1.11 Video Monitor \n1.12 LCD Projector \n1.13 Electronic Whiteboard \n1.14 Personal Computer \n2. Diagnostic Tools  \n2.1 \nAnti-virus software   \n2.2 \nMulti tester\n\n--- PDF PAGE 75 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n71 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nInspected A/V equipment \n1.2 \nOperated A/V and multimedia equipment to deliver a lesson \n1.3 \nMaintained A/V equipment \n2. Underpinning \nKnowledge \n2.1  \nSAFETY PRACTICES \n2.1.1 \nelectrical / radiation and shock hazards \n2.2 \nMATERIALS AND TOOLS:USES AND SPECIFICATIONS \n2.2.1 A/V equipment uses and specifications \n2.2.2 Electronic media equipment uses and     \nspecifications \n2.2.3 Uses and care for electronic media equipment \n2.2.4 Diagnostic tools uses and specifications \n2.3 \nTRADE THEORY \n2.3.1 A/V equipment nomenclature  \n2.3.2 Multimedia equipment nomenclature \n2.3.3 A/V multimedia equipment handling procedures \n2.3.4 Quality of sound,  \n2.3.5 Quality of A/V  \n2.3.6 Psychological perceptions \n2.3.7 Preventive maintenance \n2.3.8 Tips and tricks in presenting \n2.4 \nLEGISLATION \n2.4.1 Licensing agreement  \n3. Underpinning Skills \n3.1 \nBasic Computer Operation \n3.2 \nCommunication Skills \n3.3 \nPlanning/Organizational Skills \n3.4 \nPresentation Skills \n3.5 \nAdopt relevant industry and community practices and \nexperiences \n3.6 \nMaintain appropriate documents and records \n4. Resource Implications \n \nThe following resources MUST be provided: \n4.1 \nA/V and multimedia equipment \n4.2 \nUser’s manual \n4.3 \nOHS practice \n4.4 \nWorkstation \n4.5 \nWorkplace guidelines \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration / Observation with Oral questioning \n5.2 \nPortfolio \n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area \n/ TESDA Assessment Center\n",
