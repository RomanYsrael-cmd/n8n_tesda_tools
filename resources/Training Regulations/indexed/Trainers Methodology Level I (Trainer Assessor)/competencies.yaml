  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency required for\nTRAINERS METHODOLOGY (TM) LEVEL I. These units of competency are categorized into\nbasic and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nlead in the dissemination and discussion of ideas, information\nand issues in the workplace.\n\nContext of this unit\n:\nThis unit is adopted from the basic competencies for National Certificate\nLevel III. In the context of the Trainers Methodology (TM), the term\n“workplace” in this unit would be understood to mean “training/learning\nenvironment.”\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1\nAppropriate communication method is selected\n1.2\nMultiple operations involving several topics areas are\ncommunicated accordingly\n1.3\nQuestions are used to gain extra information\n1.4\nCorrect sources of information are identified\n1.5\nInformation is selected and organized correctly\n1.6\nVerbal and written reporting is undertaken when required\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1\nResponse to workplace issues are sought\n2.2\nResponse to workplace issues are provided immediately\n2.3\nConstructive contributions are made to workplace\ndiscussions on such issues as production, quality and safety\n2.4\nGoals/objectives and action plan undertaken in the\nworkplace are communicated\n\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1\nIssues and problems are identified as they arise\n3.2\nInformation regarding problems and issues are organized\ncoherently to ensure clear and effective communication\n3.3\nDialogue is initiated with appropriate personnel\n3.4\nCommunication problems and issues are raised as they\narise\n\n--- PDF PAGE 7 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3\nFace to face\n1.4\nTwo-way radio\n1.5\nSpeaking to groups\n1.6\nUsing telephone\n1.7\nWritten\n1.8\nInternet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning Skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of written\nand electronic communication methods\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of Assessment\nCompetency may be assessed through:\n5.1\nDirect Observation\n5.2\nInterview\n6. Context for\nAssessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment\n\n--- PDF PAGE 8 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n4\nUNIT TITLE\n:\nAPPLY MATH AND SCIENCE PRINCIPLES IN TECHNICAL\nTRAINING\n\nUNIT CODE\n:\n500232101\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to integrate math and\nscience concepts in the content and delivery of technical training\nprograms and to motivate trainees in learning and applying such\nconcepts in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify math and\nscience manifestations\nin the course content\nand the workplace\n1.1\nCourse content and learning outcomes are reviewed and\nstudied for math and science content\n1.2\nSituations in the workplace and in everyday life are related to\nthe course or program are identified for inclusion or mention\nin the training\n1.3\nTraining aids, lesson plans or session notes are prepared,\nadopted or customized incorporating or highlighting\napplications of math and science principles\n\n2. Relate math and\nscience concepts to\ncommon and\nworkplace situations\n2.1\nPractical applications of math and science related to the\ndesired learning outcomes are incorporated, explained and\nstressed during the training\n2.2\nTrainees are aided and encouraged to identify and apply\nmath and science concepts in their work and everyday life\n2.3\nClass examples/cases, exercises, and assignments are\ngiven for trainees to explore and reflect on the\napplications/manifestations of math and science along the\ncourse content\n3. Assess trainees’\ninternalization of math\nand science concepts\n3.1\nTrainees’ retention of basic math and science concepts are\nreviewed to identify areas needing further intervention\n3.2\nTrainees’ appreciation of math and science principles along\nthe trade area or subject matter is determined using\napplicable assessment methodology\n3.3\nSimple mathematical and scientific models/representations\nare discussed to aid in the understanding and application of\nprinciples and theories using language, style and format that\nare readily understood\n3.4\nPoorly-understood areas of math and science relevant to the\ncourse are given extra attention and explained in user-\nfriendly terms in accordance with trainees’ interests and\nlearning styles\n\n4. Introduce further\nenhancements\n4.1\nPersonal knowledge, experiences and observations of self\nand others in the area Of math and science applications are\ncited and incorporated in the lessons and lecture-discussions\n4.2\nResults of application of math and science concepts are\nevaluated and documented for replication and enhancement\n4.3\nLogical, systematic and scientific thinking and methods are\nintroduced and developed for trainees to assimilate and\napply in their own work and study\n4.4\nContextual and experiential learning methods are utilized\nto aid in appreciation of math and science concepts\n\n--- PDF PAGE 9 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Training aids\nMay include –\n1.1\nCurriculum/modules\n1.2\nLearning materials/activities\n1.2.1\nSelf-paced materials\n1.2.2\nJob sheets\n1.2.3\nRelated theory\n1.3\nAudio-visual aids\n1.3.1\nCharts\n1.3.2\nGraphs\n1.3.2\nDiagrams\n1.4\nInteractive video\n1.5\nComputer-based training materials\n2. Assessment\nmethodology\nMay include –\n2.1\nProjects\n2.2\nCase problems\n2.3\nWritten tests\n2.4\nOral questioning\n2.5\nInterviews\n3. Models/representations\nMay include –\n3.1\nSimple quantitative models\n3.1.1\nmathematical formulas using elementary algebra\n3.1.2\nconstants and variables\n3.1.3\nfunctions and relations\n3.2\nBasic laws and principles\n3.2.1\nOhm’s law\n3.2.2\nNewton’s laws of motion\n3.2.3\nBoyle’s law\n3.3\nGraphs and diagrams\n3.3.1\nCharts and flowcharts\n3.3.2\nCharacteristic curves\n3.3.3\nRefrigeration cycle\n3.3.4\nSchematic/block diagrams\n3.3.5\nFree-body diagrams\n4. Learning styles\nMay include –\n4.1\nKolb-model styles\n4.1.1\nConverger\n4.1.2\nDiverger\n4.1.3\nAssimilator\n4.1.4\nAccommodator\n4.2\nHoney-Mumford model styles\n4.2.1\nActivist\n4.2.2\nReflector\n4.2.3\nTheorist\n4.2.4\nPragmatist\n4.3\nFleming-model styles\n4.3.1\nVisual learners\n4.3.2\nAuditory learners\n4.3.3\nReading/writing-preference learners\n4.3.4\nKinesthetic/tactile learners\n5. Contextual and\nexperiential learning\nmethods\nMay include –\n5.1\nCase studies and problems\n5.2\nProject-based instruction\n5.3\nField trips\n5.4\nCompany visits\n5.5\nInterviews\n5.6\nInstitutional attachments/immersion\n5.7\nCommunity service\n\n--- PDF PAGE 10 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n6\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate –\n1.1\nDemonstrated understanding of basic math and science\nconcepts relevant to the competency or qualification\n1.2\nDemonstrated ability to apply math and science principles to\nthe competency or tasks being performed\n1.3\nDemonstrated ability to integrate and contextualize math and\nscience concepts in the design and delivery of technical\ntraining\n2. Underpinning\nknowledge and\nattitudes\n2.1\nBasic arithmetic – the four fundamental operations\n2.2\nElementary algebra\n2.3\nBasic science\n2.3.1\nGeneral science\n2.3.2\nNatural sciences\n2.3.3\nPhysical and biological sciences\n2.3.4\nSocial sciences\n2.4\nBasic training methodology\n2.5\nPositive work values (patience, perseverance, empathy,\nprofessionalism, concern for safety and quality)\n3. Underpinning skills\n3.1\nCommunication skills\n3.2\nTraining development and management skills\n3.3\nObserving safety and health requirements in the classroom,\nlaboratory and workshop\n3.4\nInstructional skills\n4. Resource implications\nThe following resources must be provided –\n4.1\nAccess to math and science lab or similar workshop\n4.2\nAccess to real or simulated work area\n4.3\nCase problems in math and science applications\n5. Method of Assessment\nCompetency may be assessed through –\n5.1\nObservation or demonstration with oral questioning\n5.2\nWritten exam\n5.3\nCase problems\n5.4\nInterview\n5.5\nPortfolio\n5.6\nThird-party report\n6. Context of assessment\nCompetency may be assessed on the job or in a simulated work\nenvironment\n\n--- PDF PAGE 11 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n7\nUNIT OF COMPETENCY\n:\nAPPLY ENVIRONMENTAL PRINCIPLES AND ADVOCATE\nCONSERVATION\n\nUNIT CODE\n:\n500232102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\napply/adopt environmental principles and advocate conservation\nin diverse technical-vocational training environments, including\nobserving and contributing to positive environment work\npractices. This covers the following: environmental work\npractices, contributing to improvements of environmental\npractices, and reporting potential environmental threats.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow environmental\nworkplace practices\n1.1\nWorkplace practices and work instructions relating to\npotential environmental impacts are recognized and followed,\nand clarification is sought where necessary.\n1.2\nRelevant legislation, codes and national standards that\nimpact on workplace environmental practices are recognized\nand followed.\n1.3\nChanges to work practices and procedures are responded to\npositively and promptly in accordance with organizational\nrequirements.\n1.4\nIndividual roles/responsibilities are determined and performed\nbased on the program/ activities identified\n2. Contribute to improve\nenvironmental work\npractices\n\n2.1\nSuggestions are made to designated personnel for\nimprovements to workplace practices where possible.\n2.2\nInformation is gathered and improvements are suggested to\nsupport the development of improved workplace\napproaches to environmental practices.\n2.3\nEnvironmental issues and their relationship to workplace\npractices are discussed in the workplace with colleagues and\ndesignated personnel.\n2.4\nContributions to the review of environmental practices and\npolicies are made within limits of responsibility\n3. Recognize and report\npotential environmental\nthreats\n3.1\nSigns or symptoms of the potential environmental threat\nare recognized.\n3.2\nInformation about or observations of a potential\nenvironmental threat are reported to supervisors and/or\nappropriate authorities.\n3.3\nLocation and extent of the potential environmental threat is\naccurately recorded.\n3.4\nReports on the potential environmental threat are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 12 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n8\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Workplace practices\nand work instructions\nMay include but are not limited to procedures or work instructions\nfor:\n1.1\nEnvironmental l hazard identification and risk analysis\n1.2\nAvoiding or minimizing environmental risks,\n1.3\nImproving environmental performance,\n1.4\nWaste minimization and segregation,\n1.5\nEnvironmental monitoring,\n1.6\nSigns and labels (e.g., chemical labels),\n1.7\nEmergency procedures,\n1.8\nHazard and incident recording and reporting procedures\n1.9\nEnvironmental data recording and reporting procedures\nwhere applicable.\n1.10\nVerbal instructions from persons with responsibility related to\nenvironmental work practices.\n2. Legislation, codes and\nnational standards\nMay include:\n2.1\nPhilippine Clean-Air Act of 1999 (RA 8749)\n2.2\nPhilippine Clean-Water Act of 2004 (RA 9275)\n2.3\nEcological Solid Waste Management Act of 2000 (RA 9003)\n2.4\nMontreal Protocol\n2.5\nKyoto Protocol\n2.6\nEnvironmental Awareness and Education Act of 2008 (RA\n9512)\n2.7\nPhilippine Climate-Change Act of 2009 (RA 9729)\n2.8\nCodes of Practice relating to environment-critical jobs\n3. Suggestions\n\nMay include but are not limited to the ideas to:\n3.1\nMinimize hazards and risks,\n3.2\nReduce and dispose of waste,\n3.3\nEfficient use energy\n3.4\nConserve water\n3.5\nReduce air and noise pollution\n3.6\nMake more efficient use of resources and improve\nenvironmental performance,\n3.7\nReduce soil disturbance and improve habitat resources.\n4. Designated personnel\nMay include but are not limited to:\n4.1\nAdministrators/ Managers,\n4.2\nSupervisors\n4.3\nPeople who are responsible for work area or who may be\nassigned to act as a mentor/trainer to a person\n5. Workplace approaches\nto environmental\npractices.\nMay include but are not limited to:\n5.1\nPreventing and minimizing the production of pollution (e.g.,\ndischarges to air, land and water, hazardous waste,\n5.2\nReducing 'burning off',\n5.3\nComposting ,\n5.4\nRecycling materials,\n5.5\nConservation practices), and\n5.6\nImproving workplace maintenance practices (e.g., using a\nbroom instead of a hose, using environment-friendly cleaning\nagents)\n\n--- PDF PAGE 13 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n9\n\nVARIABLE\nR A N G E\n6. Environmental issues\nMay include:\n6.1\nSustainability,\n6.2\nReduction and disposal of waste,\n6.3\nWater quality,\n6.4\nEnergy efficiency,\n6.5\nBiodiversity and habitat protection,\n6.6\nConservation of natural resources,\n6.7\nAir quality,\n6.8\nLand contamination,\n6.9\nNoise,\n6.10 Soil and salinity management\n6.11 Fire management.\n7. Environmental practices\nand policies\nMay include:\n7.1\nWaste minimization and management,\n7.2\nSustainability ,\n7.3\nLocal, regional, state and national strategies on weed and\npest management,\n7.4\nProtection of land and habitat and conservation of resources,\n7.5\nEnergy use,\n7.6\nGreenhouse gas emissions,\n7.7\nUse of chemicals and plant and equipment.\n8. Signs or symptoms\nMay include but are not limited to:\n8.1\nObservation of the presence of weeds,\n8.2\nPest animals or chemicals;\n8.3\nDamage caused to plants, animals or the environment,\n8.4\nChanges in plant (e.g., dieback of trees) and animal health,\n8.5\nErosion of soils,\n8.6\nSoils in water suspension,\n8.7\nPresence of salt.\n9. Potential environmental\nthreat\nMay include but are not limited to:\n9.1\nThis includes spills , leaks, pollution ,planned and unplanned\nemissions, soil compaction, disturbance and erosion,\n9.2\nAccidents and disposal of waste, and damage or disruption to\necosystems resulting from work practices.\n9.3\nAlso includes plants, animals or diseases that are classified\nas an environmental threat or problem in an area,\n9.4\nUnauthorized changes in land use\n9.5\nFire risks and threats, and inappropriate human interaction\non the environment.\n9.6\nThis may include damage to habitat resources, disruption of\nanimal behavior and territorial use, illegal vegetation\nclearance, seed collection, firewood gathering, nest\ndisturbance and egg collecting.\n10.Reported\nIncludes how the reports are made:\n10.1 Verbally (face-to-face or through communication equipment)\n10.2 In writing (memo, notes, faxes, email or electronic\nmessages).\n11.Recorded\n11.1\nEnvironmental data,\n11.2 Maintenance and inspection reports,\n11.3 Incident or accident reports,\n11.4 Complaints from the public.\n\n--- PDF PAGE 14 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of workplace practices and work\ninstructions.\n1.2\nDescribed relevant legislations, codes and national standard\nenvironmental practices according to the different\nenvironmental issues/concerns.\n1.3\nFollowed environmental workplace practices\n1.4\nContributed to improve environmental work practices\n1.5\nRecognized and reported on a potential environmental threat\n1.6\nMaintained environmental records\n2. Underpinning\nKnowledge\n2.1\nRelevant legislation from all levels of government on\nenvironmental issues\n2.2\nRelevant environmental policies and workplace/industry\npractices and procedures\n2.3\nGood practice approaches relevant to work area particularly\nin regard to minimizing environment hazards and risks, and\nimproving environmental performance\n2.4\nEnvironmental issues, especially in regard to water\ncatchments, air, noise, ecosystems, habitat, efficient use of\nresources, sustainability and waste minimization\n2.5\nPotential environmental threats and problems relevant to a\ngiven region and occupation\n2.6\nGeneral work place practices and their potential impact on the\nenvironment.\n3. Underpinning Skills\n3.1\nPerforming research and analysis\n3.2\nReading / interpreting data and information\n3.3\nProblem solving\n3.4\nCommunicate with supervisors and workplace colleagues\n3.5\nRecognize basic environmental hazards and threats\n3.6\nFollow workplace directions and instructions\n3.7\nKeep simple records.\n4. Resource Implications\n The following resources MUST be provided:\n4.1\nWorkplace/Assessment location\n4.2\nLegislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n4.3\nCase studies/scenarios relating to environmental protection\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1\nWritten/ Oral Examination\n5.2\nInterview/Third Party Reports\n5.3\nPortfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n5.4\nSimulations\n6. Context for Assessment\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 15 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n11\nUNIT OF COMPETENCY\n:\nUTILIZE IT APPLICATIONS IN TECHNICAL TRAINING\n\nUNIT CODE\n:\n500232103\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\nutilize IT applications in training. Specifically it covers setting-up\nof\nwork\nenvironment,\nutilization\nof\nword\nprocessing,\nspreadsheet, presentation applications and utilization of internet\nand www to communicate and collect information.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Set-up work\nenvironment\n1.1\nWork folder is configured in accordance with enterprise IT\nutilization guidelines.\n1.2\nDesktop and shortcuts settings are configured in-line\nwith personal preference.\n1.3\nConnectivity to printer are checked and tested in accordance\nwith equipment user guide.\n\n2. Utilize word processing\napplication\n2.1\nDocument layout and formatting are applied in line with\ndocument formatting requirements.\n2.2\nApplication features are utilized to enhance productivity in\nline with application guide/ help instructions\n2.3\nPrinting of documents is performed in line with enterprise IT\nutilization guidelines\n3. Utilize presenter\napplication\n3.1\nPresentation layout, formatting and theme utilization are\napplied in line with target audience requirements\n3.2\nAnimation and slide transitions are applied to enhance\nviewing and interactivity experience in-line with best\npractices in utilizing presentation package.\n3.3\nPrinting of presentation materials are performed in line\nwith user requirements and enterprise IT utilization\nguidelines\n3.4\nPackaging and exporting of presentation is performed in line\nwith application help instructions/wizard.\n3.5\nPresentation of information is performed in line with best\npractices in utilizing presentation package.\n\n4. Utilize spread sheet\napplication\n4.1\nWorkbook and worksheet settings and formatting are\napplied in line with printing requirements.\n4.2\nFormula and conditional formatting are utilized to enhance\nproductivity in line with the application help instructions.\n4.3\nCharts are utilized to enhance data presentation in line with\nthe application help instructions.\n4.4\nPrinting of worksheet is performed in line with document\nlayout requirements and enterprise IT utilization guidelines.\n5. Utilize internet and\nwww to communicate\nand collect information\n5.1\nChat and email facility is utilized to exchange information\nand resources in line with chat help instructions.\n5.2\nBrowser is configured to enhance productivity in line with\nthe application help instruction\n5.3\nwww is utilized to research and acquire resources in line with\nenterprise IT utilization guidelines.\n\n--- PDF PAGE 16 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work folder is\nconfigured\n\nMay include but not limited to:\n1.1\nFolder creation\n1.2\nFolder copy and transfer\n1.3\nFolder sharing\n2. Desktop and shortcuts\nsettings are configured\nMay include but not limited to:\n2.1\nDesktop background and screen saver settings\n2.2\nScreen resolution settings\n2.3\nShortcut and link creation\n3. Document layout and\nformatting\nMay include:\n3.1\nPage settings\n3.2\nFont Settings\n3.3\nFormatting styles\n3.4\nTable utilization\n4. Application features\nMay include, but not limited to:\n4.1\nFooter and header setting\n4.2\nMail merge\n4.3\nReview and editing tools\n4.4\nReference features\n4.5\nForm creation features\n5. Best practices in\nutilizing presentation\npackage\nMay include but not limited to:\n5.1\nNumber of text lines, font size and fore and back colors.\n5.2\nOptimal utilization of animation and transition effects to\nenhance learning experience not to distract audience.\n5.3\nAwareness in unconscious actions during presentation\n6. Printing of presentation\nmaterials\nMay include but not limited to:\n6.1\nSlide\n6.2\nNotes\n7. Workbook and\nworksheet settings\nMay include but not limited to:\n7.1\nPage setup\n7.2\nHeader setup\n7.3\nWorksheet organization\n8. Formula\nMay include but not limited to:\n8.1\nSummation\n8.2\nDivision\n8.3\nMultiplication\n8.4\nDivision\n8.5\nAverage\n8.6\nRounding off\n8.7\nIf\n8.8\nConcatenate\n9. Browser configuration\nMay include but not limited to:\n9.1\nCookie settings\n9.2\nPlug-in setup\n9.3\nAccessibility adjustments\n\n--- PDF PAGE 17 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSet-up work environment\n1.2\nUtilized word processing application\n1.3\nUtilized presenter application\n1.4\nUtilized spreadsheet application\n1.5\nUtilized internet and www to communicate and collect\ninformation\n2. Underpinning\nKnowledge\n2.1\nI.T. Principles (i.e. internet technology, www)\n2.2\nBest practices in using presenter application\n2.3\nBasic mathematical operation\n2.4\nLogic reasoning\n2.5\nProductivity application features\n2.6\nFile management\n2.7\nAcademic documents (i.e. record sheet, accomplishment\ncharts, session plan)\n3. Underpinning Skills\n\n3.1\nEncoding and computing skills\n3.2\nPresentation skills\n3.3\nLogic reasoning skills\n4. Resource Implications\nThe following MUST be provided:\n4.1\nComputer with network and internet access\n4.2\nPrinter and printing consumables\n4.3\nSpecification of sample document, worksheet, presentation\nmaterials\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace /simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 18 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n14\nUNIT OF COMPETENCY\n:\nLEAD SMALL TEAMS\n\nUNIT CODE\n\n:\n500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead small\nteams including setting and maintaining team and individual\nperformance standards.\n\nContext of this unit\n:\nThis unit is adopted from the basic competencies for National\nCertificate Level III. In the context of the Trainers Methodology (TM), the\nsmall teams here would refer to groups of trainees, audience or\nparticipants in a training situation, or a group of fellow trainers.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to team\nmembers\n1.2\nReasons for instructions and requirements are\ncommunicated to team members\n1.3\nTeam members’ queries and concerns are recognized,\ndiscussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having regard to\nthe skills, knowledge and aptitude required to properly\nundertake the assigned task and according to company\npolicy\n2.2\nDuties are allocated having regard to individual preference,\ndomestic and personal considerations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on client\nneeds and according to assignment requirements\n3.2\nPerformance expectations are based on individual team\nmembers duties and area of responsibility\n3.3\nPerformance expectations are discussed and disseminated\nto individual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against defined\nperformance criteria and/or assignment instructions and\ncorrective action taken if required\n4.2\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3\nPerformance issues which cannot be rectified or addressed\nwithin the team are referenced to appropriate personnel\naccording to employer policy\n4.4\nTeam members are kept informed of any changes in the\npriority allocated to assignments or tasks which might impact\non client/customer needs and satisfaction\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6\nFollow-up communication is provided on all issues affecting\nthe team\n4.7\nAll relevant documentation is completed in accordance with\ncompany procedures\n\n--- PDF PAGE 19 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s\nqueries and concerns\n2.1\nRoster details\n2.2\nShift details\n3. Monitoring of\nperformance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 20 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n16\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2\nAssessed and monitored team and individual performance\nagainst set criteria\n1.3\nRepresented concerns of a team and individual to next level\nof management or appropriate specialist and to negotiate on\ntheir behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5\nSet and communicated performance expectations for a range\nof tasks and duties within the team and provided feedback to\nteam members\n\n2. Underpinning\nKnowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning Skills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of Assessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context for\nAssessment\nAssessment should be conducted in the workplace/ simulated area/\nTESDA Assessment Center\n\n--- PDF PAGE 21 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n17\n\nUNIT OF COMPETENCY\n:\nAPPLY WORK ETHICS, VALUES AND QUALITY\nPRINCIPLES\nUNIT CODE\n:\n500232104\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required in demonstrating and\nliving out desirable work ethics, values and principles in the\nworkplace and training environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Observe workplace\npolicies and guidelines\n1.1\nAttendance and punctuality are observed in line with\nenterprise policies and guidelines.\n1.2\nWork functions are performed in line with work\nposition/delegation and according to enterprise goals and\nobjectives.\n1.3\nCommunication, request, and complaints are channelled\nthrough authority in line with enterprise policies and\nprocedures.\n1.4\nAcademic freedom is exercised in line with enterprise goals\nand objectives\n1.5\nQuality work instructions are delivered in accordance with\nwork deadlines and training calendars.\n2. Value self-worth and\nprofession\n2.1\nBest practices in teaching are demonstrated at all times.\n2.2\nPersonal and professional upgrading is exercised in line with\npersonal goals and enterprise guidelines and policies.\n2.3\nConfidentiality of records and other documents are\nmaintained in line with enterprise policies and guidelines.\n2.4\nProfessional courtesy is exercised at all times\n2.5\nProfessional role and image as technical trainer are\nmaintained in the classroom/training environment and\nrelated situations.\n\n3. Observe proper\nconduct in dealing with\nlearners and parents\n3.1\nPromotion of learners is performed based on non-prejudice\ndecision and actual accomplishments and performance of\nlearners.\n3.2\nLearners were given equal opportunities to learn and utilize\nschool facilities in line with the enterprise objective and\ngoals.\n3.3\nParent consultations are performed in line with enterprise\npolicies and guidelines\n\n--- PDF PAGE 22 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work functions\nMay include but not limited to:\n1.1\nTeaching\n1.2\nGuiding\n1.3\nManaging events and school activities\n2. Academic freedom\nMay include but not limited to:\n2.1\nSelection of teaching methods\n2.2\nImplementation of remedial classes\n2.3\nChanging methods of collecting evidence of learning\n3. Best practices in\nteaching\nMay include:\n3.1\nTeaching with teaching aids\n3.2\nEmploying learner-centered activities\n4. Non-prejudice decision\nMay include, but not limited to:\n4.1\nDecision made from favour\n4.2\nDecision came from political reason\n\n--- PDF PAGE 23 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n19\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nObserved workplace policies and guidelines\n1.2\nValued self-worth and profession\n1.3\nObserved proper conduct in dealing with learners and\nparents.\n2. Underpinning\nKnowledge\n2.1\nCode of ethics and right conduct\n2.2\nPersonnel management\n2.3\nFilipino customs and traits\n3. Underpinning Skills\n3.1\nInterpersonal skills\n3.2\nCommunication skills\n4. Resource Implications\nThe following MUST be provided:\n4.1\nCase study\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nWritten test/ Interview\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace /simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 24 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n20\nUNIT OF COMPETENCY\n:\nWORK EFFECTIVELY IN VOCATIONAL EDUCATION AND\nTRAINING\n\nUNIT CODE\n:\n500232105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\nwork effectively in the policy and operating environment of the\nvocational education and training sector.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Work within the\nvocational education\nand training policy\nframework\n1.1\nRelevant national vocational education and training\npolicies and frameworks are accessed, analyzed, applied\nand guided in accordance with work practices and\nresponsibilities.\n1.2\nKey vocational education and training organizations and\nstakeholders are identified, accessed and informed in\naccordance with updated work practices.\n1.3\nLegislation and guidelines are accessed, used, complied\nand ensured in accordance work practices and policy\nrequirements.\n1.4\nSources of information and advice on vocational\neducation and training policy and operating context are\naccessed on a regular basis and changes are noted as\nappropriate.\n1.5\nOpportunities are taken up to contribute to vocational\neducation and training in accordance with organizational\npolicy developments.\n1.6\nVocational education and training terminology is used to\ncommunicate effectively in accordance with sector.\n2. Work within the training\norganization’s quality\nframework\n2.1\nRelevant organizational documentation is accessed,\nused, supported and ensured in accordance work roles and\nresponsibilities.\n2.2\nWork is conducted in accordance with the training\norganization’s quality assurance strategies, processes,\npolicies and procedures\n2.3\nEthical and legal responsibilities are adhered to in\naccordance with work practices.\n2.4\nWork is undertaken in accordance with the prevailing\nindustrial and employee relations systems and practices.\n2.5\nFeedback and advice on work quality is actively sought from\ncolleagues and clients in accordance with the prevailing\nindustrial and employee relations systems and practices.\n\n--- PDF PAGE 25 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n21\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Manage work and work\nrelationships\n3.1\nWork is planned, prioritized and organized to achieve agreed\nand expected outcomes.\n3.2\nWorkloads are assessed and guidance/support is sought\nfrom relevant personnel where work issues arise and in\naccordance with existing organizational policies and\nguidelines.\n3.3\nRelevant technological skills are used to enhance work\noutcomes and in accordance with prevailing industrial\nsystems and practices.\n3.4\nWork is undertaken in a collaborative manner with\ncolleagues through sharing of information and ideas and\nworking together on work outcomes in accordance with the\nprevailing industrial and employee relations systems and\npractices.\n3.5\nFeedback on managing work and professional relationships\nis obtained from clients and colleagues and is evaluated\nand acted upon.\n\n4. Demonstrate a client-\nfocused approach to\nwork\n4.1\nClients and their needs and expectations form the basis for\ndeveloping effective work practices and outcomes in\naccordance with operational limits.\n4.2\nEffective\ncommunication\nstrategies\nare\ndeveloped,\nutilized, established and maintained in accordance with client\nrelationships.\n4.3\nProcesses for evaluating and improving client satisfaction\nare developed and built in accordance with work practices.\n\n--- PDF PAGE 26 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. National vocational\neducation and training\npolicies and\nframeworks\nMay include:\n1.1\nPhilippine TVET Trainers Qualification Framework (PTTQF)\n1.2\nTraining Packages\n1.3\nUser Choice\n1.4\ntraineeship and apprenticeship arrangements\n2. Vocational education\nand training\norganizations and\nstakeholders\nMay include:\n2.1\nDepartment of Labor and Employment (DOLE)\n2.2\nTechnical Education and Skills Development Authority\n(TESDA)\n2.3\nIndustry Skills Councils (ISCs)\n2.4\ntraining organizations\n\n3. Legislation and\nguidelines\nMay include:\n3.1\nguidelines on program/project funding\n3.2\nUser Choice\n3.3\napprenticeships/traineeships\n3.4\nimplementation of Training Packages\n3.5\nregistration\n3.6\ncourse accreditation\n3.7\naccess and equity\n3.8\nanti-discrimination\nincluding\nequal\nopportunity,\nracial\nvilification and disability discrimination\n3.9\nindustrial relations\n3.10 code of practice\n3.11 occupational health and safety (OHS)\n4. Sources of information\nand advice\nMay include:\n4.1\nweb-based information from vocational education and\ntraining organizations and stakeholders such as the National\nTraining Information Service (NTIS)\n4.2\nprinted policies, newsletters, bulletins, publications of\nvocational education and training organizations and\nstakeholders\n4.3\nproducts including revised Training Packages, support\nmaterials and professional development materials\nimplementation guidelines\n4.4\nresearch journals\n4.5\nconference papers\n\n--- PDF PAGE 27 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n23\n\nVARIABLE\nRANGE\n5. Opportunities\nMay include:\n5.1\nattendance at workshops and consultations conducted by\nrelevant vocational education and training organizations and\nstakeholders\n5.2\nindividual or organizational written submissions and\nfeedback to relevant vocational education and training\norganizations and stakeholders\n5.3\nparticipation in forums, networks, conferences\n5.4\nparticipation in training organization meetings\n5.5\nparticipation in validation meetings\n5.6\nresearch/consultancy\n5.7\ncontribution to online consultations\n6. Vocational education\nand training\nterminology\nMay include but not limited to:\n6.1\nAcronyms\n6.2\nlanguage of the profession\n6.3\nlanguage styles commonly used in vocational education and\ntraining environments\n7. Relevant organizational\ndocumentation\nMay include:\n7.1\nstrategic plans\n7.2\nbusiness plans\n7.3\npolicies and procedures\n7.4\nposition descriptions\n7.5\nresponsibility statements\n8. Training organization’s\nquality assurance\nstrategies, processes,\npolicies and\nprocedures\nMay relate to:\n8.1\nquality arrangements for clients covering:\n8.1.1\nenrolment and induction/orientation\n8.1.2\ncomplaints, grievances and appeals\n8.1.3\nassessment, including skills recognition, pre-\nassessment and appeals\n8.1.4\nidentification of training support requirements, for\nexample, language, literacy and/or numeracy needs\n8.1.5\nfees\n8.1.6\nprivacy\n8.1.7\naccess and equity\n8.1.8\nwelfare and guidance\n8.1.9\nissuance of qualifications\n8.1.10 mutual recognition of qualifications, Statements of\nAttainment, credit and articulation arrangements\n8.2\ninternal quality policies and procedures covering:\n8.2.1 risk management\n8.2.2 continuous improvement\n8.2.3 OHS\n8.2.4 equal employment opportunity (EEO)\n8.2.5 discrimination and workplace harassment\n8.2.6 staff disciplinary procedures\n\n--- PDF PAGE 28 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n24\n\nVARIABLE\nRANGE\n\n8.2.7\nfinancial management\n8.2.8\nrecords management\n8.2.9\nmanagement processes for learning resources and\nlearning materials\n8.2.10 recruitment and induction of personnel\n8.2.11 staff qualifications\n8.3\nlearning and professional/staff development opportunities\n8.4\ntraining organization staff development programs\n8.5\nparticipation in networks\n8.6\nindividual learning initiatives\n8.7\nmembership of professional associations/networks\n8.8\nrelevant university courses\n9. Ethical and legal\nresponsibilities\nMay include:\n9.1\ncompliance with relevant legislation including:\n9.1.1\nOHS legislation\n9.1.2\nEEO legislation\n9.1.3\nanti-discrimination legislation\n9.1.4\nlegislation relating to overseas learners\n9.2\ncompliance with industrial awards, enterprise agreements\nand employment contracts\n9.3\nmeeting environmental standards\n9.4\nduty of care\n9.5\nrecognizing and being sensitive to individual differences and\ndiversity\n9.6\nprovision of accurate information, advice and services\n9.7\nproviding support to learners appropriate to their needs\n9.8\nmaintaining client privacy and confidentiality\n9.9\ncode of practice\n10. Work issues\nMay include:\n10.1 time pressures\n10.2 work overload\n10.3 competing demands\n10.4 unexpected contingencies\n10.5 technology problems\n10.6 relations with other personnel\n10.7 client issues/relations\n11. Relevant technological\nskills\nMay include checking that the idea:\n11.1 using computer word processing software to produce\ndocuments, reports and learning materials\n11.2 using computer presentation applications\n11.3 using computer data processing software to produce\nstatistical information\n11.4 using computers/communication systems to support online\nlearning\n\n--- PDF PAGE 29 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n25\n\nVARIABLE\nRANGE\n\n11.5 conducting web searches\n11.6 participating in Internet/video conferencing\n11.7 using chat rooms\n11.8 managing email\n11.9 operating computer projection equipment\n11.10 operating overhead projectors\n11.11 operating other business equipment, e.g. fax machines,\nphotocopiers and telephone systems\n12. Clients and colleagues May include:\n12.1 individual learners, apprentices and trainees, employees\n12.2 enterprises/industry\n12.3 other parts of the training organization\n12.4 government departments/agencies, or other organizations\n13. Clients and their needs\nand expectations\nMay include:\n13.1 a focus on individual learner objectives such as:\n13.1.1 new skills\n13.1.2 specific competencies\n13.1.3 target qualifications\n13.1.4 new career\n13.1.5 career advancement\n13.1.6 improved language\n13.1.7 literacy and numeracy skills\n13.2 preference for particular learning styles\n13.3 individualized learning support systems\n13.4 individualized organizational training\n13.5 client centered approaches\n13.6 information and advice on courses, learning programs and\nqualifications\n14. Operational limits\nMay include:\n14.1 level of responsibility, autonomy, classification level\n14.2 staffing resource limitations\n14.3 physical environment limitations\n14.4 cost\n14.5 time\n14.6 scheduling difficulties\n14.7 OHS\n15. Effective\ncommunication\nstrategies\nMay include:\n15.1 establishing clarity of purpose\n15.2 ongoing liaison\n15.3 effective reporting arrangements\n15.4 continuous feedback mechanisms\n\n--- PDF PAGE 30 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n26\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nWorked within the vocational education and training policy\nframework\n1.2\nWorked within the training organization’s quality framework\n1.3\nManaged work and work relationships\n1.4\nDemonstrated a client-focused approach to work\n2. Underpinning\nknowledge and\nattitude\n2.1\nTraining Packages, including the purpose and structure of:\n2.1.1\nunits of competency\n2.1.2\nAssessment Guidelines\n2.1.3\nqualifications\n2.1.4\nEmployability Skills\n2.1.5\nsupport materials\n2.2\nPhilippine TVET Trainers Qualification Framework (PTTQF)\n2.3\nsources of information on vocational education and training,\nfor example:\n2.3.1\nNTIS web site for accessing details on units,\ncourses/qualifications, training organizations, and\nTraining Packages and support materials\n2.4\nsources of information on legal and organizational\nrequirements, for example:\n2.5\norganizational manuals, documents, publications\n2.6\norganizational data systems\n2.7\npublications, newsletters of relevant authorities\n2.8\ncompetency-based training and assessment, for example:\n2.9\ncompetency standards define performance outcomes,\napplied knowledge and skills needed for work\n2.10 competency standards form the basis for teaching and\nlearning and training delivery in recognized TVET\n2.11 learning is outcomes focused not inputs driven\n2.12 competency standards establish requirements for\nassessment\n2.13 assessment is criterion referenced/not norm referenced\n2.14 assessment is reported as competent/not yet competent\n2.15 competency standards are industry defined\n2.16 competency standards have a national focus\n2.16.1 the training organization’s systems, policies and\nprocedures\n2.16.2 relevant vocational education and training\nterminology appropriate to the work role\n\n--- PDF PAGE 31 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n27\n\n2.16.3 the diversity of clients, client needs, client\nexpectations for vocational education and training\nservices\n2.16.4 relevant legal and policy requirements, codes of\npractice, national standards and legislations, for\nexample:\n2.17 specific industry/workplace legal/compliance and licensing\nrequirements\n2.18 duty of care under common law\n2.19 anti-discrimination including equal opportunity, racial\nvilification and disability discrimination\n2.20 workplace relations, industrial awards and enterprise\nagreements\n2.21 privacy/security of information\n2.22 copyright/plagiarism\n2.23 relevant OHS knowledge relating to the work role/work\ncontext, and OHS considerations when working in vocational\neducation and training, including:\n2.24 internal policies and procedures to meet OHS requirements\n2.25 hazards commonly found in the work environment\n2.26 sources of OHS information and expertise\n3. Underpinning skills\n3.1\nliteracy skills to:\n3.1.1\nread and understand vocational education and\ntraining policy and other documents, vocational\neducation and training terminology and language\nstyles\n3.1.2\ninterpret legal requirements of vocational education\nand training policies, procedures and guidelines\n3.1.3\nwrite documents for a range of vocational education\nand training audiences and purposes\n3.2\nlanguage skills to:\n3.2.1\ncommunicate with personnel across all levels of the\norganization and with clients\n3.2.2\nunderstand and use vocabulary and terminology\nspecific to the vocational education and training\nenvironment\n3.2.3\nlisten and summarize key points, make evaluative\njudgments and articulate verbally or in writing to a\nclient or colleague\n3.2.4\nfacilitate discussions to encourage problem solving,\nsharing of strategies, and exploring different solutions\nto problems\n3.2.5\nwork effectively as a team member\n\n--- PDF PAGE 32 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n28\n\n3.3\nrecognizing and being sensitive to individual difference and\ndiversity, for example:\n3.3.1\nbeing sensitive to and valuing culture\n3.3.2\nacting without bias/discrimination\n3.3.3\nresponding to individuals with particular needs\n3.3.4\nrecognizing the importance of religion\n3.4\nplanning skills to:\n3.4.1\nidentify and access relevant sources of national\nvocational education and training policies,\nframeworks, legislation and guidelines\n3.4.2\nparticipate in opportunities to contribute to vocational\neducation and training organizational policy\ndevelopments\n3.4.3\nmanage work and work relationships\n3.5\nresearch skills to access information\n3.6\ntechnology skills to:\n3.6.1\nuse computer hardware and relevant software\n3.6.2\nuse office/business equipment\n4. Resource implications\nThe following resources MUST be provided:\n4.1\naccess to business, organizational, legislative and vocational\neducation and training documentation\n4.2\naccess to clients\n4.3\naccess to colleagues\n4.4\naccess to a TVET operating environment\n\n5. Method of assessment\nCompetency may be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n6. Context for assessment\n\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or as a team under limited\nsupervision\n\n--- PDF PAGE 33 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n29\nUNIT OF COMPETENCY\n:\nFOSTER AND PROMOTE AN INCLUSIVE LEARNING\nCULTURE\n\nUNIT CODE\n:\n500232106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nfoster and promote an environment which supports inclusive\nwork practices and learning culture.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Practice inclusivity\n1.1\nIndividual differences and clients with particular needs\nare acknowledged, respected and valued in accordance with\nexisting work practices and learning culture.\n1.2\nPersonal perceptions and attitudes about difference are\nexamined and revised to improve communication and\nprofessionalism in accordance with existing work practices\nand learning culture.\n1.3\nPrinciples underpinning inclusivity are integrated into all\nwork practices.\n1.4\nThe training organization’s access and equity policy is used\nin accordance to work practices.\n1.5\nIndividuals' rights and confidentiality are respected at all\ntimes.\n2. Promote and respond\nto diversity\n2.1\nThe ground rules for participation and behavior with\ncolleagues and clients are established in accordance with a\ncooperative and agreed process/es.\n2.2\nIndividuals are encouraged to express themselves and to\ncontribute to the work and learning environment in\naccordance with cooperative and agreed process/es.\n2.3\nIndividuals are provided with opportunities to indicate\nspecific needs to support their participation in learning and\nwork in accordance with a cooperative and agreed\nprocess/es.\n2.4\nRelevant research, guidelines and resources are accessed\nto support inclusivity in accordance with existing guidelines\nand procedures.\n2.5\nVerbal and body language is sensitive to different cultures\nand backgrounds and differences in physical and intellectual\nabilities and as appropriate.\n3. Develop and implement\nwork strategies to\nsupport inclusivity\n3.1\nDocumented resources to support and guide inclusive\npractices are identified and used to inform work strategies in\naccordance with existing guidelines and procedures.\n3.2\nSupport persons are identified and included in the work and\nlearning process where appropriate and agreed to.\n3.3\nRelevant professional support services are identified and\naccessed, as appropriate.\n\n--- PDF PAGE 34 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n30\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n3.4\nAny physical environment support needs are\nacknowledge and incorporated into work practices, where\npracticable and approved by appropriate personnel.\n3.5\nOHS issues associated with inclusivity are identified and\naddressed in accordance with existing guidelines and\nprocedures.\n3.6\nInclusiveness is modeled in accordance with work\nperformance.\n4. Promote a culture of\nlearning\n4.1\nSupport and advice is provided to colleagues and clients to\nencourage new and ongoing participation in accordance with\nlearning opportunities.\n4.2\nThe benefits of learning are explored with colleagues and\nclients in accordance with a culture of learning.\n4.3\nLearning and competency achievement is recognized and\nrewarded in accordance with the work and/or learning\nenvironment.\n4.4\nOpportunities to develop own and others generic skills are\nidentified in accordance with the work and/or learning\nenvironment.\n4.5\nMultiple pathways to achieve own and others future learning\ngoals are discussed in accordance with the work and/or\nlearning environment.\n5. Monitor and improve\nwork practices\n5.1\nEffective work practices to enhance inclusivity and a learning\nculture are identified in accordance with the work and/or\nlearning environment\n5.2\nConscious actions are taken to modify and improve in\naccordance with work practices.\n5.3\nStrategies and policies to support inclusivity are regularly\nreviewed in accordance with continuous improvement of\nwork processes.\n5.4\nProposed changes to relevant strategies and policies are\ndocumented and reported in accordance with organizational\nstructure.\n\n--- PDF PAGE 35 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Individual differences\nMay include:\n1.1\nlearning difficulties\n1.2\nliteracy and numeracy needs\n1.3\nlanguage other than English (LOTE)\n1.4\ncultural background, images and perceptions\n1.5\nsocio-economic background\n1.6\nage, gender, sexuality\n1.7\nreligious practices\n1.8\nintellectual impairment or disability\n1.9\nmedical conditions such as arthritis, epilepsy, diabetes and\nasthma\n1.10 physical impairment or disability involving hearing vision,\nvoice or mobility\n1.11\npsychological or psychiatric impairment\n2. Clients with particular\nneeds\nMay include:\n2.1\nwomen where under-represented\n2.2\nrural and remote learners\n2.3\npeople with disabilities, either permanent or temporary\n2.4\npeople from non-English speaking backgrounds\n2.5\nyouth at risk\n3. Principles\nMay include:\n3.1\nsupporting equal opportunity for participation\n3.2\nfostering and advocating independence\n3.3\nensuring cooperative approaches to learning\n3.4\nusing client-centered approaches to learning\n3.5\nsupporting, encouraging and valuing individual contributions\n3.6\nmotivating learners\n3.7\ncreating opportunities for participation and success\n3.8\nmaking reasonable adjustments to procedures, activities and\nassessment for equity\n3.9\nacknowledging current strengths and skills as a basis for\nfurther learning\n4. Ground rules\nMay include:\n4.1\nguidelines of behavior and acceptance\n4.2\ncommon understandings between learners about group\ninteraction, respect and acceptance\n4.3\nexpectations of working relationships\n4.4\nsafety of learners and others\n4.5\ncomfort of learners and others\n4.6\nagreed consequences for breaching ground rules\n5. Specific needs\nMay include:\n5.1\nphysical environment adjustments\n5.2\nadjustments to learning and assessment activities\n5.3\nOHS issues to be addressed\n5.4\nlanguage requirements\n5.5\nliteracy and numeracy issues\n5.6\nmore time/additional support to learners\n5.7\nneed for a broad general education\n\n--- PDF PAGE 36 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n32\n\nVARIABLE\nRANGE\n6. Verbal and body\nlanguage\nMay refer to:\n6.1\nlanguage that recognizes and values individual differences\n6.2\nlanguage that supports inclusivity\n6.3\nlanguage that is non-discriminatory\n6.4\nlanguage that does not devalue, denote or derogate\n6.5\nlanguage that does not suggest fear, mistrust or lack of\nunderstanding\n6.6\nlanguage that does not label or suggest assumptions about\ncapabilities\n7. Documented resources May include:\n7.1\njournals\n7.2\ninformation technology resources such as the web, hardware\nand software\n7.3\ntexts and references\n8. Support persons\nMay include:\n8.1\nfamily members\n8.2\ngovernment officers in specialist support services\n8.3\ncase workers and personal careers\n8.4\nadvocates for a person or group\n8.5\npeer support\n8.6\ninterpreters\n8.7\ncommunity representatives\n8.8\nnote takers\n8.9\nlibrary personnel\n8.10 technical support\n8.11 human resources personnel\n8.12 administrative personnel\n8.13 career counselors\n8.14 student services officers\n8.15\nequity liaison officers\n9. Physical environment\nsupport needs\nMay include:\n9.1\nmodifications to layout of premises\n9.2\nequipment modifications\n9.3\nuse of adaptive technologies\n9.4\nchanges to work schedules\n9.5\nmodifications to job design\n10. OHS issues\nMay include:\n10.1 issues relating to the learner\n10.2\nissues relating to the OHS impact on others\n11. Generic skills\nMay include:\n11.1 Employability Skills including:\n11.1.1 communication\n11.1.2 teamwork\n11.1.3 problem solving\n11.1.4 initiative and enterprise\n11.1.5 planning and organizing\n11.1.6 self-management\n11.1.7 learning\n11.1.8 technology\n11.2 innovation\n11.3\nlanguage, literacy, numeracy and communication skills\n\n--- PDF PAGE 37 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n33\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nPracticed inclusivity\n1.2\nPromoted and respond to diversity\n1.3\nDeveloped and implement work strategies to support\ninclusivity\n1.4\nPromoted a culture of learning\n1.5\nMonitored and improve work practices\n2. Underpinning\nknowledge and\nattitude\n2.1\nthe principles underpinning inclusivity and how to integrate\nthem into work practices\n2.2\nthe diversity of clients, client needs, client backgrounds and\ndiffering expectations for vocational education and training\nservices\n2.3\nethical and inclusive behaviors expected of professional\nrelationships with clients and colleagues\n2.4\nsources of information to support inclusive practices\n2.5\navailability and types of supports for clients with specific\nneeds\n2.6\nrelevant policies, legal requirements, codes of practice on:\n2.6.1\ndisability, discrimination, inclusiveness, human rights,\nequal opportunity, racial discrimination\n2.6.2\nduty of care responsibilities\n2.6.3\naccess and equity policies\n2.7\norganizational work systems, practices\n2.8\nOHS relating to the work role/work context, and OHS\nconsiderations when fostering and promoting an inclusive\nlearning culture including:\n2.8.1\ninternal policies and procedures to meet OHS\nrequirements\n2.8.2\nhazards commonly found in the work environment\n2.9\nduty of care of the training and trainer for the learner and\nothers who may be affected by actions of others within or\nattending the training\n3. Underpinning skills\n3.1\nlanguage and communication skills that:\n3.1.1\nreflect inclusive language\n3.1.2\naddress cross cultural communication, indirect\ncommunication, participation of others (family/\ncommunity/elders), appropriate time and\ncommunication protocols\n3.1.3\ninvolve consultation and liaison with clients, other\ncolleagues, counselors, experts and specialists on\nlearning concerns/issues\n\n--- PDF PAGE 38 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n34\n\n3.1.4 reflect good practice in active listening, appropriate\neye contact, friendly tone, appropriate volume, clarity\nof diction and plain English\n3.1.5 encourage expression by all individuals\n3.1.6 involve a variety of mediums\n3.2\nrecognizing and being sensitive to individual difference and\ndiversity, for example:\n3.2.1 being sensitive to and valuing culture\n3.2.2 acting without bias/discrimination\n3.2.3 responding to individuals with particular needs\n3.2.4 recognizing the importance of religion\n3.3\nresearch skills to identify and increase knowledge of\nindividual differences and how these impact on individuals\n3.4\nproblem solving skills to:\n3.4.1\nidentify specific needs\n3.4.2\nrespond appropriately to cultural diversity\n\n4. Resource Implication\n\nThe following resources MUST be provided:\n4.1\naccess to relevant policies, legislation, guidelines and\nresources to support inclusivity\n4.2\naccess to clients/colleagues\n4.3\naccess to workplace environment\n\n5. Method of assessment\nCompetency may be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n\n6. Context for assessment\n\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 39 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n35\nUNIT OF COMPETENCY\n:\nENSURE A HEALTHY AND SAFE LEARNING\nENVIRONMENT\n\nUNIT CODE\n:\n500232107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\nensure the health, safety and welfare of learners and\ncandidates.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify Occupational\nHealth and Safety\n(OHS) responsibilities\n1.1\nThe purpose and approaches of OHS in the learning\nenvironment are defined in accordance with OHS standards.\n1.2\nDocumentation outlining the OHS legal responsibilities of\nthe various parties in the learning environment is accessed,\nread and interpreted in accordance with OHS standards\n1.3\nOrganizational OHS documentation is identified and\naccessed in accordance with standard operating procedures.\n\n2. Identify hazards in the\nlearning environment\n2.1\nSources of information are researched and accessed to\nidentify hazards common within the industry in which the\nlearning will take place.\n2.2\nLearning environment is inspected prior to use in\nconsultation with various parties in order to identify hazards.\n2.3\nAny specific OHS needs of learners and/or candidates are in\naccordance with OHS standards.\n2.4\nAny potential hazards created by learners and/or candidates\nwith specific needs are identified in accordance with OHS\nstandards.\n2.5\nPersonal limitations and responsibilities in identifying\nhazards are recognized and specialist advisers are\nconsulted in accordance with OHS standards.\n3. Assess risks in the\nlearning environment\n3.1\nLikelihood of injury as a result of exposure to identified\nhazard/s is assessed in accordance with OHS standards.\n3.2\nSeverity of any potential injury, illness or negative/adverse\noutcome arising from the identified hazard is assessed for\nrisk in accordance with OHS standards.\n3.3\nHazards are prioritized for action in consultation with various\nparties in accordance with OHS standards.\n3.4\nPersonal limitations in assessing risks are recognized and\nspecialist advisers are consulted in accordance with OHS\nstandards.\n\n--- PDF PAGE 40 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n36\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Develop and implement\nactions to ensure the\nhealth safety and\nwelfare of learners\nand/or candidates\n4.1\nRisk controls are developed based on the hierarchy of\ncontrol in accordance with OHS standards.\n4.2\nRisk control action plan is identified and accessed or\nformulated in consultation with various parties.\n4.3\nActions within the control and responsibility of the\ntrainer/facilitator are implemented in accordance with OHS\nstandards.\n4.4\nOutstanding risk control actions are referred to the various\nparties for implementation.\n4.5\nSupervisory arrangements appropriate to learners and/or\ncandidates levels of knowledge/skill/ experience are\nmonitored to ensure their health and safety.\n5. Provide appropriate\nOccupational Health\nand Safety (OHS)\nrequirements to\nlearners and/or\ncandidates\n5.1\nLearners and/or candidates are provided with appropriate\ninformation related to OHS\n5.2\nLearners and/or candidates are assessed for knowledge of\nOHS requirements.\n5.3\nLearners and/or candidates are supplied with personal\nprotective equipment in accordance with OHS standards\n6. Monitor Occupational\nHealth and Safety\n(OHS) arrangements in\nthe learning\nenvironment\n6.1\nAchievement against the risk control action plan is monitored\nand any issues addressed as appropriate\n6.2\nThe effectiveness and reliability of existing risk controls are\nconfirmed with relevant parties.\n6.3\nEffective hazard and incident reporting and investigation\nprocesses are confirmed on a continuing basis.\n\n--- PDF PAGE 41 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Approaches of OHS\nMay include:\n1.1\nthe establishment and maintenance of a healthy and safe\nlearning environment through:\n1.1.1 a consultative approach\n1.1.2 a systems approach\n1.2\nshared responsibilities for OHS\n1.3\ntrainer/facilitator familiarization with OHS requirements of the\nspecific learning environment\n\n2. OHS legal\nresponsibilities\nMay include:\n2.1\nrequirements under legislation relating to OHS and common\nlaw duty of care\n2.2\nlegislative requirements for consultation\n2.3\nrequirements under hazard-specific and other OHS\nregulations\n2.4\nlegislative requirements for reporting and record keeping\nrelated to OHS\n\n3. Various parties\nMay include:\n3.1\nmanagers/supervisors\n3.2\ndesignated person for OHS\n3.3\nemployee OHS representatives\n3.4\nother people with prior OHS knowledge, for example:\n3.4.1\ntrainers/facilitators and assessors\n3.4.2\nprogram coordinators\n3.5\ntraining and/or assessment organization\n4. Organizational OHS\ndocumentation\nThe training organization and/or workplace in which the training\nservices take place, and may include:\n4.1\npolicies and procedures\n4.2\nincident reports\n4.3\nemergency procedures\n4.4\ninduction information\n4.5\nrisk assessment\n4.6\nsafety reports\n5. Sources of information\nMay include:\n5.1\nOHS regulatory authorities\n5.2\nindustry bodies\n5.3\nsubject and technical specialists including OHS\nprofessionals\n5.4\nhazard and injury reports from similar learning environments\n\n--- PDF PAGE 42 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n38\n\nVARIABLE\nRANGE\n6. Hierarchy of control\nThe preferred priority for risk control, emphasizing hazard\nelimination and, where this is not possible, risk minimization by\nsuch means as:\n6.1\nsubstitution with a lesser hazard\n6.2\nisolation of the hazard from people at risk\n6.3\nengineering controls\n6.4\nadministrative means (eg, safe work practices, procedures\nand training)\n6.5\nuse of personal protective equipment\n7. Supervisory\narrangements\nMay include:\n7.1\nLevel of knowledge\n7.2\nLevel of experience\n7.3\nrights, responsibilities and obligations of the various parties\n7.4\nthe code of conduct in the learning environment\n7.5\ntypes of potential hazardous events/emergencies and\nrequired responses\n7.6\nhazards and their control in the learning environment,\nincluding the use and maintenance of personal protective\nequipment\n8. Appropriate information May include:\n8.1\nsafe access and egress\n8.2\nwork procedures\n8.3\nfirst aid provisions\n8.4\narrangements in the learning environment for the\nmanagement of OHS, including:\n8.4.1 reporting procedures for hazards, incidents, injuries\nand faulty equipment\n8.4.2 processes to use when injury does occur\n8.4.3 policies and procedures, including staff handbooks\n\n--- PDF PAGE 43 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nIdentified OHS responsibilities\n1.2\nIdentified hazards in the learning environment\n1.3\nAssessed risks in the learning environment\n1.4\nDeveloped and implement actions to ensure the health\nsafety and welfare of learners and/or candidates\n1.5\nProvided appropriate OHS requirements to learners and/or\ncandidates\n1.6\nMonitored OHS arrangements in the learning environment\n2. Underpinning\nknowledge and attitude\n2.1\nrelevant policies, legal requirements, codes of practice and\nnational, for example:\n2.1.1\nlegislative requirements for information and\nconsultation relevant to safety\n2.1.2\nlegislative requirements for record keeping related to\nOHS\n2.1.3\nlegislative requirements for safe workplaces\n2.2\nOHS roles and responsibilities of employers, the training/\ntrainers/facilitators, learners and/or candidates, managers\nand supervisors\n2.3\nduty of care obligations for training and/or trainers/facilitators\n2.4\nhazards and risks in the specific industry where learning will\ntake place\n2.5\ncommon risk control strategies applicable to the industry\nwhere learning and/or will take place\n2.6\nbasics of a systematic approach to OHS\n2.7\nsources of information on OHS requirements relevant to the\nspecific industry where learning will take place\n2.8\norganizational OHS documentation including policies,\nprocedures and risk control strategies\n2.9\nhierarchy of control as it applies to risks encountered in the\nlearning environment\n2.10 knowledge of the learning environment sufficient to be able\nto identify hazards and conduct simple risk assessment\n3. Underpinning skills\n3.1\nliteracy skills to:\n3.1.1\naccess a range of sources of OHS information\n3.1.2\nread and understand OHS documentation\n3.1.3\ninterpret OHS legal requirements\n3.1.4\nwrite hazard and incident reports\n3.1.5\ncontribute to the development of a risk control action\nplan (if required)\n\n--- PDF PAGE 44 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n40\n\n3.2\nlanguage skills to:\n3.2.1 communicate and consult with a range of people from\ndifferent levels and backgrounds\n3.2.2 listen and summarize key points, make evaluative\njudgments and articulate verbally\n3.3\ntechnology skills to:\n3.3.1\nuse computer hardware and relevant software\n3.3.2\nuse office/business equipment\n3.4\nresearch skills to access relevant OHS information\n3.5\nnegotiation skills\n4. Resource Implication\n\nThe following resources MUST be provided:\n4.1\naccess to resources and equipment to establish and\nmaintain the safety, health and welfare of the learner and/or\ncandidate\n4.2\naccess to legislative and training organization documentation\non OHS\n5. Method of assessment\nCompetency may be assessed through :\n5.1\nDemonstration with questioning\n5.2\nCase Study/Situation\n5.3\nInterview\n5.4\nPortfolio Assessment\n6. Context for assessment\n\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 45 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n41\nUNIT OF COMPETENCY\n:\nMAINTAIN AND ENHANCE PROFESSIONAL PRACTICE\n\nUNIT CODE\n:\n500232108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required for\nindividuals to manage their personal professional performance and\nto take responsibility for their professional development in relation\nto the provision of training and services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Model high standards of\nperformance\n1.1\nPersonal performance is consistent with the organization’s\ngoals and objectives.\n1.2\nAppropriate professional techniques and strategies are\nmodeled in accordance with existing organizational policies and\nguidelines.\n1.3\nPersonal work goals and plans reflect individual responsibilities\nand accountabilities in accordance with organizational/legal\nrequirements.\n1.4\nEthical and inclusive practices are applied in professional\npractice and in accordance with existing organizational policies\nand guidelines.\n2. Determine personal\ndevelopment needs\n2.1\nPersonal knowledge and skills are assessed against units of\ncompetency and other relevant benchmarks in accordance with\nthe development needs and priorities.\n2.2\nChanges in vocational education, training policy and operating\nenvironments are identified in accordance with the impact on\nprofessional practice and personal development needs.\n2.3\nFeedback from colleagues and clients is identified and used in\naccordance with personal learning needs/areas of professional\ndevelopment.\n2.4\nFuture career options are identified as appropriate.\n2.5\nPersonal learning needs are documented and updated in\naccordance with existing policies and procedures.\n2.6\nPersonal development needs are discussed with relevant\npersonnel for inclusion in accordance with the professional\ndevelopment plan.\n3. Participate in\nprofessional\ndevelopment activities\n3.1\nDevelopment opportunities suitable to personal learning\nstyle/s are selected and used in accordance with continuous\nsupport of learning and maintenance of current professional\npractice/s.\n3.2\nProfessional networks are participated in accordance with\ncontinuous support of learning and maintenance of current\nprofessional practice/s.\n3.3\nOwn performance and professional competency is continuously\nimproved through engagement in accordance with professional\ndevelopment activities.\n3.4\nTechnology is used to maintain regular communication in\naccordance with relevant networks, organizations and\nindividuals.\n4. Reflect on and evaluate\nprofessional practice\n4.1\nDevelopments and trends impacting on professional practice\nare researched and integrated in accordance with work\nperformance.\n4.2\nFeedback from colleagues/clients is used to identify and\nintroduce improvements in accordance work performance.\n4.3\nInnovative and responsive approaches for improving\nprofessional practice are identified and used in accordance with\ncontinuous support to improve techniques and processes.\n4.4\nRecords, reports and recommendations for improvement are\nmanaged in accordance with the organization’s systems and\nprocesses.\n\n--- PDF PAGE 46 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Organization’s goals\nand objectives\nMay include:\n1.1\nbusiness plan\n1.2\nstrategic plan\n1.3\noperational plan/s\n1.4\norganization’s code of conduct\n1.5\nflexibility and client responsiveness\n1.6\nclient satisfaction\n1.7\nfinancial performance\n1.8\npeople management\n1.9\nmarketing and client service\n1.10 quality and quality assurance\n2. Professional\ntechniques and\nstrategies\nMay include:\n2.1\ntechniques for initiating action and directing decision making\n2.2\nstrategies for presenting a confident and assured manner in\nchallenging situations\n2.3\nmaintaining ethical practice in the face of opposition\n2.4\nmodeling behavioral and personal presentation standards\n2.5\nmotivation strategies\n2.6\ntime management\n2.7\nstrategies for acknowledging and respecting the attitudes\nand beliefs of others\n2.8\ntechniques for promoting active participation\n3. Organizational/legal\nrequirements\nMay include:\n3.1\ncustomer complaints, grievances and appeals\n3.2\nrisk identification and management, including OHS\n3.3\nquality and continuous improvement processes and\nstandards, including validation systems\n3.4\nfinancial management, including refund policies and systems\nto protect fees paid in advance (if appropriate)\n3.5\nrecognition of qualifications issued by other training\norganizations\n3.6\naccess and equity\n3.7\nclient selection, enrolment and induction/orientation\n3.8\nstaff recruitment, induction and ongoing development and\nmonitoring\n3.9\navailability of policies and procedures to all personnel and\nlearners/clients\n3.10 collaborative/partnership arrangements\n3.11 confidentiality and privacy requirements\n3.12 ethical standards\n3.13 defined resource parameters\n\n--- PDF PAGE 47 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n43\n\nVARIABLE\nRANGE\n\n3.14 administrative and records management system, for\nexample:\n3.14.1 reporting/recording requirements and arrangements\n3.14.2 maintenance, retention, archiving, retrieval, storage\nand security of information\n3.14.3 document version control\n4. Ethical and inclusive\npractices\nMay include:\n4.1\ndemonstrating probity in all areas of responsibility\n4.2\nmodeling organizational/professional codes of conduct\n4.3\nreinforcing ethical conduct in interactions with and between\nother people\n4.4\nshowing respect for individual diversity, culture and religion\n4.5\nrecognizing and utilizing difference to develop both the\nindividual and the organization\n4.6\ndemonstrating sensitivity to the circumstances and\nbackground of others\n4.7\nfostering a culture of inclusiveness\n4.8\nnew/revised policy directions in vocational education and\ntraining\n5. Feedback\nMay include:\n5.1\nformal/informal performance appraisals\n5.2\nobtaining comments from supervisors and colleagues\n5.3\nobtaining comments from clients\n5.4\npersonal reflective behavior strategies\n5.5\nroutine organizational methods for monitoring service\ndelivery\n6. Professional\ndevelopment plan\nMay include:\n6.1\nthe organization’s professional development plan for each\nindividual staff member, outlining:\n6.2\nwork and personal career objectives\n6.3\nidentified areas requiring development\n6.4\nlearning opportunities/activities\n6.5\nrelevant work activities/projects\n6.6\nlinks to organizational training needs profile\n7. Development\nopportunities\nMay include:\n7.1\nundertaking further higher education\n7.2\nundertaking professional development in specific areas of\npractice\n7.3\ninternal training/development programs\n7.4\nrelevant conferences, seminars and workshops\n7.5\nreading relevant journals and literature\n7.6\nnetworking with internal/external colleagues\n7.7\ncoaching and/or mentoring\n\n--- PDF PAGE 48 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n44\n\nVARIABLE\nRANGE\n8. Current professional\npractice/s\nMay include:\n8.1\nvocational competency and/or technical expertise in subject\nmatter\n8.2\nprofessional practice as a trainer/facilitator,\n9. Professional networks\nMay include:\n9.1\ninformal networks with:\n9.1.1\nother trainers/facilitators\n9.1.2\npeople working in industry/vocational area\n9.1.3\ncontacts in vocational education and training\n9.2\nformal networks such as:\n9.2.1 local/ trainer networks\n9.2.2 interest and support groups\n9.2.3 regional, specialist and peak associations\n9.2.4 professional/occupation associations\n9.2.5 communities of practice\n10. Technology\nMay include:\n10.1 computer-based communication, e.g. email, Internet,\nExtranet and Intranet\n10.2 facsimile machines\n10.3 telephone\n10.4 video conferencing\n11. Developments and\ntrends\nMay include:\n11.1 new/revised Training Packages in vocational area of\nexpertise\n11.2 legislative/regulatory changes in vocational area of\ncompetency\n11.3 new developments/directions/trends in vocational education\nand training\n11.4 policy changes in vocational education and training\n12. Continuous support to\nimprove techniques\nand processes\nMay include:\n12.1 limited and systemic evaluation\n12.2 records review and maintenance\n12.3 self-assessment\n12.4 strategic business/operational planning\n12.5 ongoing education and training\n12.6 team meetings and networking\n\n--- PDF PAGE 49 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n45\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nModeled high standards of performance\n1.2\nDetermined personal development needs\n1.3\nParticipated in professional development activities\n1.4\nReflected on and evaluate professional practice\n2. Underpinning\nknowledge and\nattitude\n2.1\norganizational goals/objectives\n2.2\norganizational processes, procedures and opportunities\nrelating to professional development\n2.3\na range of continuous improvement techniques and\nprocesses and their application\n2.4\nsocial and education trends and changes impacting on the\nvocational education and training environment, for example:\n2.4.1 policy changes\n2.4.2 technological changes\n2.4.3 cultural changes\n2.4.4 economical changes\n2.5\nnetworks relevant to professional practice\n2.6\nstandards/principles, ethnical/inclusive principles and\npractices\n2.7\ntypes and availability of training development activities and\nopportunities\n2.8\nrelevant policies, legislation, codes of practice and national\nstandards for example:\n2.8.1 Training Packages, competency standards, other\nrelevant benchmarks\n2.8.2 licensing requirements\n2.8.3 industry/workplace requirements\n2.8.4 duty of care under common law\n2.8.5 recording information and confidentiality requirements\n2.8.6 anti-discrimination including equal opportunity, racial\nvilification and disability discrimination\n2.8.7 workplace relations\n2.8.8 industrial awards/enterprise agreements\n2.8.9 National Reporting System\n2.9\nrelevant OHS knowledge relating to the work role/work\ncontext, and OHS when managing own professional practice\nand performance\n3. Underpinning skills\n3.1\nreflection skills to:\n3.1.1 systematically evaluate personal work practices to\nimprove performance or understanding\n3.1.2 reduce or prevent stress\n3.2\nleadership skills to present a professional image\n\n--- PDF PAGE 50 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n46\n\n3.3\nself-evaluation skills to:\n3.3.1 identify gaps in skills or knowledge\n3.3.2 obtain competencies to meet current and future\norganizational objectives\n3.4\nresearch skills to:\n3.4.1 keep up with trends in vocational education and\ntraining to obtain current information\n3.4.2 identify relevant industry affiliations\n3.4.3 keep up with trends/changes/developments in the\nvocational area of competency\n3.5\ncommunication skills to:\n3.5.1 obtain feedback from colleagues and clients\n3.5.2 participate in professional networks\n3.5.3 consult with colleagues and clients\n3.6\ninterpersonal skills to:\n3.6.1 participate in industry events and activities\n3.6.2 build professional relationships\n3.7\nnetworking skills to build an industry network\n3.8\nliteracy skills to:\n3.8.1 document personal learning needs\n3.8.2 read and interpret vocational education and training\ninformation such as legal/ organizational policy\ndocuments\n3.8.3 complete and maintain records related to professional\ndevelopment\n3.9\ntime management skills to:\n3.9.1 organize professional development activities\n3.9.2 analyze and identify career options\n3.9.3 create a balance between work, study, personal and\nrecreation activities\n4. Resource Implication\n\nThe following resources MUST be provided:\n4.1\nrelevant organizational/legal documentation\n4.2\naccess to relevant benchmarks\n4.3\naccess to networks, technology, communication\n5. Method of assessment\nCompetency must be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n6. Context for\nassessment\n\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 51 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n47\nUNIT TITLE\n:\nDEVELOP AND PROMOTE APPRECIATION FOR COSTS AND\nBENEFITS OF TECHNICAL TRAINING\n\nUNIT CODE\n:\n500232109\n\nDESCRIPTOR\n:\nThis unit covers the outcomes required in estimating and\nevaluating costs and benefits of training, determining its cost-\neffectiveness and returns, and identifying, recommending and\nadvocating cost-efficient training practices\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study training cost\ncomponents\n1.1\nFeatures and benefits of training programs are identified and\nanalyzed based on financial and customer requirements\n1.2\nCost components are analyzed to determine those which\ndeliver the desired training features and benefits\n1.3\nWastages or excesses are determined for possible reduction\nor elimination\n2. Evaluate training costs\nand benefits\n2.1\nVariances in training performance and results are studied to\ndetermine good and bad practices\n2.2\nPlanned performance is compared with actual performance\nto identify future enhancements in conduct of training\n2.3\nCost reduction and control measures that do not impact\ngreatly on training results are recommended\n2.4\nUsage of training resources is analyzed for optimization or\nreduction\n3. Monitor conduct and\nresults of training\n3.1\nSimple formative and summative evaluations of training are\ndone to evaluate achievement of learning outcomes\n3.2\nQuality training programs are monitored and\nnoted/documented for best practices and results replication\n3.3\nBenefits and returns on training investments are studied\nusing relevant data\n3.4\nCost-effective training programs are identified and\nrecommended for documentation, replication and further\nenhancement.\n4. Promote awareness of\ncosts and benefits of\ntraining\n4.1\nBenefits of training as investment rather than cost center are\nexplained and stressed to trainees, fellow trainers and\nadministrators where applicable\n4.2\nEconomy in use of training supplies and materials and care\nin use of training equipment and facilities are stressed\ncontinually\n4.3\nModel/best practices in optimum and judicious use of training\nresources are documented, practiced and demonstrated\n\n--- PDF PAGE 52 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Benefits and returns on\ntraining investment\nMay include:\n1.1\nLong-term impact such as --\n1.1.1 Increased profitability of firm\n1.1.2 Industrial peace\n1.2\nImmediate results such as --\n1.2.1 Positive customer feedback\n1.2.2 Less product recalls/rejects\n1.2.3 Consistent/increasing school enrolment\n1.2.4 Higher absorption rate of graduates\n1.2.5 Lower drop-out rates\n1.2.6 Lower worker attrition rate\n2. Relevant training data\nMay include:\n2.1\nData from graduate tracer studies\n2.2\nEnrolment data\n2.3\nTrainee drop-out\n2.4\nTrainee learning evaluation\n2.5\nEmployment/absorption rate\n2.6\nReaction-level evaluation\n2.7\nTrainee skills certification rate\n2.8\nPer-capita training costs\n2.9\nSkill utilization rate\n\n--- PDF PAGE 53 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n49\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate –\n1.1\nDemonstrated ability to identify, estimate and evaluate\ntraining cost components\n1.2\nDemonstrated ability to assess training programs according\nto their cost-effectiveness and return on investment\n1.3\nDemonstrated ability to explain training costs and benefits\nand advocate cost-effective training\n2. Underpinning\nknowledge and attitude\n2.1\nBasic arithmetic – four fundamental operations\n2.2\nBasic cost accounting and bookkeeping\n2.3\nBasic training methodology including training costs and\nbenefits\n2.4\nTraining system evaluation concepts\n2.5\nPositive work traits and values (attention to detail,\npersistence, cost-consciousness, safety- and time-\nconsciousness, quality-consciousness)\n3. Underpinning skills\n3.1\nCommunication skills\n3.2\nComputer literacy\n3.3\nComputational and accounting skills\n3.4\nObserving safety and health precautions\n3.5\nInstructional and facilitation skills\n4. Resource implications\nThe following resources MUST be provided –\n4.1\nAccess to training and enrolment data, e. g., collection,\nexpenses, trainee performance data\n4.2\nAccess to an ongoing training program\n4.3\nCase problems in cost-effective training\n5. Methods of\nassessment\nCompetency may be assessed through –\n5.1\nCase problems\n5.2\nWritten exam\n5.3\nInterview\n5.4\nSubmission and presentation of written report or case study\n5.5\nPortfolio\n5.6\nThird-party report\n6. Context of assessment\nCompetency may be assessed on the job or in a simulated work\nenvironment\n\n--- PDF PAGE 54 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n50\nUNIT TITLE\n:\nDEVELOP AND PROMOTE UNDERSTANDING OF GLOBAL\nLABOR MARKETS\n\nUNIT CODE\n:\n500232110\n\nDESCRIPTOR\n:\nThis unit describes the outcomes required in understanding,\nanalyzing and disseminating information on global labor-market\ntrends and concerns as they affect the TVET, labor and\nemployer sectors.\n\nELEMENT\nPERFORMANCE CRITERIA\n1. Identify current and\nfuture trends/concerns\n1.1\nRelevant and reliable sources of labor-market information\n(LMI) are identified and accessed based on needs\n1.2\nGlobal and local relevance of labor-market (LM) trends are\nstudied and analyzed for their implications in the labor and\ntraining market\n1.3\nRelevant events, including positions and interests of\ntrainees, clients and training providers are studied and\nconsidered in the design and delivery of training\n2. Assess new\ndevelopments\n2.1\nEmerging issues of potential significance to the local and\nglobal labor markets are identified and studied\n2.2\nResearch findings are assessed for significance to the\ntechnical and vocational education and training (TVET)\nsector\n2.3\nOpportunities and risks of new developments are identified\nand assessed\n2.4\nViews of trainees, training providers and other stakeholders\nare identified and assessed for their potential benefit or\nimpact\n2.5\nWhere necessary responses and strategies for LM threats\nand opportunities are developed in consultation with other\nTVET partners\n2.6\nNew and emerging concepts, technologies, products and\nprocesses are noted and evaluated based on their\nimplications for the TVET and labor market\n3. Utilize labor market\ninformation to best\neffect\n3.1\nAwareness of LM situation and related concerns are\npromoted through talks, lectures and other training\nopportunities\n3.2\nRelevant information on LM and new technologies are\nincorporated in the curriculum and during the training\n3.3\nMention/Presentations of LMI and trends are made during\nmeetings, fora and training situations using language and\ndelivery styles adapted to the audience\n3.4\nWhere necessary, responses and strategies to global labor-\nmarket developments are developed and recommended\nusing analytical tools and current LMI\n\n--- PDF PAGE 55 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. LMI sources\nMay include --\n1.1\nProfessional literature and journals\n1.2\nIndustry associations\n1.3\nResource persons\n1.4\nInternet sites, e. g., JobsDB\n1.5\nIndustry/trade meetings/conferences\n1.6\nTrade fairs\n1.7\nNetwork of contacts or key informants\n1.8\nStatistical reports\n1.9\nGovernment agencies, e. g., NSCB/NSO, DOLE (BLE,\nPOEA, BLES)\n2. Responses and\nstrategies\nMay include --\n2.1\nRetraining\n2.2\nSearch for new markets and partners\n2.3\nSkills updating/upgrading\n2.4\nRefresher courses\n2.5\nUpdating of competency standards\n2.6\nCompetency assessment and certification\n2.7\nAdoption of new training methods and technologies\n2.8\nRedesign of training programs/courses\n3. Analytical tools\nMay include –\n3.1\nSWOT analysis\n3.2\nForce-field analysis\n3.3\nProblem/Objectives tree\n3.4\nFishbone/cause-and-effect diagram\n\n--- PDF PAGE 56 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n52\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate –\n1.1\nDemonstrated ability to understand and analyze global labor\nmarkets\n1.2\nDemonstrated ability to identify and take advantage of\nopportunities in the global LM\n1.3\nDemonstrated ability to respond to potential threats to TVET\narising from LM trends\n1.4\nDemonstrated ability to adapt technical training to global LM\ntrends\n2. Underpinning\nknowledge and\nattitudes\n2.1\nLabor-market paradigm\n2.1.1\nSupply side – TVET providers and schools,\ncommunities\n2.1.2\nDemand side – employers (government and private\nsector)\n2.1.3\nLabor requirements variations and seasonality in the\nLM\n2.2\nTVET sector knowledge – work regime, systems,\ntechnologies and unique aspects relevant to sector or\ngeographic area\n2.3\nProfile of TVET sector stakeholders, opinion leaders and\nmajor players\n2.4\nLegislations and regulations that impact on the TVET sector\n2.5\nEvents and trends that have shaped the global labor market\nover time\n2.6\nTrends in customer expectations and buying patterns\n2.7\nPositive work values (proactiveness, practicality, results and\nservice orientation, quality-consciousness)\n3. Underpinning skills\n3.1\nResearching LMI\n3.2\nAnalyzing the relevance, accuracy and shortcomings of\ninformation\n3.3\nDiscerning trends, issues ands implications\n3.4\nAssessing threats and opportunities\n3.5\nCommunication and presentation skills\n4. Resource implications\nThe following resources MUST be provided –\n4.1\nTVET situationers and/or LMI research reports\n4.2\nCase problems\n5. Method of assessment\nCompetency may be assessed through –\n5.1\nInterview and oral questioning based on case problems\n5.2\nDemonstration with oral questioning of an oral presentation\nmade by the candidate\n5.3\nThird-party report\n5.4\nPortfolio (includes reports, recommendations, research and\ninformation relating to the global LM written by candidate)\n6. Context of assessment\nAssessment must be conducted in the workplace or a simulated\nwork environment\n\n--- PDF PAGE 57 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n53\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPLAN TRAINING SESSION\n\nUNIT CODE\n:\nTVT232301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in planning a\ntraining session. It includes identifying learner’s requirements,\npreparing session plan, preparing instructional materials and\norganizing learning and teaching and assessment resources.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify learner’s training\nrequirements\n1.1\nCurriculum document is reviewed and analyzed.\n1.2\nCurrent competencies of target group are determined.\n1.3\nCompetencies required to be attained are compared with\ncurrent competencies of target group.\n1.4\nResults of comparison are used to determine training\nrequirements.\n1.5\nTraining requirements are validated with appropriate people.\n2. Prepare session plans\n2.1\nInstructional blueprint and learning-engagement plan are\nprepared\n2.2\nTraining delivery modes are identified.\n2.3\nTraining methods that pertains to the required competencies\nare addressed.\n2.4\nSequence of training activities is determined.\n2.5\nResources to support learning are identified.\n2.6\nSession plan is finalized according to required format.\n3. Prepare instructional\nmaterials\n3.1\nInstructional materials that are focused on a key concept or\nidea related to the work activity under consideration are\nprepared.\n3.2\nThe text and illustrations that are clear, legible and appropriate\nto the trainees are prepared.\n3.3\nLanguage, style and format of the materials are appropriate to\nthe trainee’s characteristics and needs\n4. Prepare assessment\ninstruments (Institutional\n4.1\nRelevant modules of instruction are identified, read and\ninterpreted to identify the required evidence.\n4.2\nEvidence requirements are determined which show full\ncoverage of the training module to be assessed and a\nconsistent performance of the relevant learning activities.\n4.3\nSuitable assessment methods are identified and selected which\nare appropriate with the learning outcome of a module of\ninstruction.\n4.4\nAssessment instruments are prepared in accordance with the\ncontent and learning outcome specified under the assessment\ncriteria of a module of instruction.\n4.5\nAssessment instruments are checked for validity, fairness,\nsafety and cost effectiveness.\n5. Organize learning and\nteaching resources\n5.1\nResources required for training are checked for availability.\n5.2\nAppropriate training locations are identified and arranged\naccording to the training needs.\n5.3\nResource requirements are documented and access is\narranged in accordance with the organization, procedures and\nappropriate staff.\n\n--- PDF PAGE 58 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n54\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Target group\n1.1\nStudents\n1.2\nWorkers\n1.3\ncommunity members\n1.4\ntrainers\n2. Appropriate people\n2.1\nLGU\n2.2\nNGO\n2.3\nEnterprise\n2.4\nIndustry Organizations\n2.5\nPeople’s Organizations\n2.6\nTrade union\n2.7\nEmployer\n2.8\nGovernment agency\n3. Training delivery modes\nMay include but are not limited to the following:\n3.1\nDual training\n3.2\nOn- the-job / off- the- job training\n3.3\nDistance delivery\n3.4\nSelf-paced individualized delivery\n3.5\nCommunity training\n4. Training methods\nMay include but are not limited to the following:\n4.1\nOral presentations\n4.2\nSimulation activities\n4.3\nGroup work\n4.4\nDemonstration\n4.5\nLaboratory work\n4.6\nAssignments\n4.7\nComputer-based learning\n4.8\nGroup discussion\n4.9\nLecture\n5. Resources\n\n5.1\nStaff\n5.2\nFacilities\n5.3\nPlant equipment\n5.4\nTools, supplies and materials\n5.5\nAudio-visual materials (multi-media)\n5.6\nLearning aids (instructional materials)\n6. Session plan\nSession plan format may include:\n6.1\nSession objectives\n6.2\nSubject content\n6.3\nResources and materials\n6.4\nDelivery modes and assessment methods\n7. Instructional materials\nIncludes but is not limited to:\n7.1\nNon-print and Print-based materials\n7.2\nInformation / Operation / Job sheet\n7.3\nLearning guide\n7.4\nSelf check / Performance checklist\n7.5\nModel answer\n8. Trainee’s characteristics\nIncludes but is not limited to:\n8.1\nAge\n8.2\nGender\n8.3\nLearning style\n8.4\nReligion\n8.5\nCulture\n8.6\nEthnicity\n9. Evidence\n9.1\ndirect\n9.2\nindirect\n10. Training locations\n10.1\nTraining center\n10.2\nSchool\n10.3\nWorkplace\n10.4\nCommunity\n\n--- PDF PAGE 59 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n55\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the trainee:\n1.1\nIdentified and analysed relevant curriculum document.\n1.2\nIdentified current competencies of target group.\n1.3\nIdentified learners’ training requirements.\n1.4\nPrepared plan for a series of training sessions.\n1.5\nIdentified relevant delivery method, training activities and\ntraining delivery modes.\n1.6\nIdentified and organized resources required for the series of\ntraining sessions.\n1.7\nOrganized access to appropriate training location.\n2. Underpinning\nknowledge and attitude\n\n2.1\nCompetency standards and related curriculum\n2.2\nIdentification and correct usage of equipment, processes and\nprocedures relevant to the competencies being delivered\n2.3\nTraining delivery modes\n2.4\nTraining methods\n2.5\nTarget groups – identify and needs\n2.6\nRecognition of current competencies\n2.7\nOccupational health and safety relevant to the competencies\nbeing delivered.\n2.8\nCommunity development modes and training approaches.\n3. Underpinning Skills\n3.1\nTechnical writing skills required to document session plans\nand prepare basic instructional materials\n3.2\nStrategies for determining current competencies of learners\n3.3\nPlanning and organizational skills\n3.4\nSkills in operating personal computer\n\n4. Resource Implications\n\nThe following resources MUST be provided:\n4.1\nRelevant curriculum documents\n4.2\nWorkplace or simulated environment /Context\n5. Methods of\nAssessment\nCompetencies must be assessed by:\n5.1\nObservation/demonstration with oral questioning\n5.2\nWritten examination\n5.3\nPortfolio\n5.4\nThird party report\n\n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 60 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n56\nUNIT OF COMPETENCY\n:\nFACILITATE LEARNING SESSION\n\nUNIT CODE\n:\nTVT232302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in delivering\nCompetency-Based Training Session. It covers the following:\npreparing\ntraining\nsession,\nconducting\npre-assessment,\nfacilitating training session, conducting competency assessment\nand reviewing delivery of training session.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare Training\nFacilities/Resources\n1.1\nAppropriate training facilities/resources are prepared\nbased on the session requirement.\n1.2\nLearning stations are prepared & set-up according to\nlearning activities.\n1.3\nTools and equipment are prepared and set-up according to\nlearning activities.\n2. Conduct Pre-\nassessment\n2.1\nPre-assessment instruments are prepared in accordance\nwith the number of applicants.\n2.2\nContext and procedures of pre-training assessment are well\nexplained according to guidelines.\n2.3\nEvidence is gathered using the assessment tools specified in\nthe evidence plan.\n2.4\nEvidences are evaluated and feedbacks are discussed\nbased on the results of the pre-training assessment.\n2.5\nCurrent competencies and prior learning are determined and\ncredited.\n2.6\nCharacteristics and profile of learners are evaluated.\n3. Facilitate Training\nSession\n3.1\nLearners are properly oriented on the CBT delivery system.\n3.2\nAppropriate training methods are used based on the level\nand characteristics of the learners.\n3.3 Learners are assisted to achieve session outcomes.\n3.4\nWork and learning activities are monitored based on training\nplan.\n3.5\nFeedback is provided to improve learners’ competence.\n4. Conduct Competency\nAssessment\n\n4.1\nLearners are oriented on the evidence requirements relevant\nto the evidence plan.\n4.2\nCompetency assessment tools, materials and equipment are\nprovided to learners.\n4.3\nEvidences are gathered and documented using relevant\nassessment tools.\n4.4\nAssessment results are recorded in accordance with the\napproved rating system.\n4.5\nAppropriate feedback mechanism is used to inform learner\nof his/her progress.\n5. Review Delivery of\nTraining Session\n\n5.1\nAppropriate training session evaluation instruments are\nused.\n5.2\nInterpretation is made on the results of evaluation on delivery\nof training session.\n5.3\nAdjustments on delivery of training session are made based\non the results of evaluation.\n\n--- PDF PAGE 61 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n57\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Training Facilities /\nResources\nMay include but not limited to the following:\n1.1\nLearning Guide\n1.2\nInstructional Materials\n1.2.1\nCDs\n1.2.2\nLEs\n1.2.3\nCBLM\n1.3\nService manuals\n1.4\nReferences\n1.5\nJournals\n1.6\nFurniture and fixtures\n1.7\nTools and equipment\n1.8\nWorkstations\n2. Evidence\n2.1\nDirect\n2.2\nIndirect\n3. Profile of learners\nMay include but not limited to:\n3.1\nLearner’s styles\n3.2\nLearner’s objectives\n3.3\nLearner’s resources\n3.4\nEthnicities\n3.5\nLanguage\n4. Feedback\nMay include but not limited to:\n4.1\nLearners strong and weak points\n4.2\nRating/grades\n4.3\nLearner’s Progress specification\n4.4\nProcedures\n4.5\nLearner’s Deficiency\n4.6\nRecommendation for improvement\n5. Training Methods\nMay include but not limited to the following:\n5.1\nOral presentations\n5.2\nSimulation activities\n5.3\nGroup work\n5.4\nDemonstration\n5.5\nLaboratory work\n5.6\nAssignments\n5.7\nComputer-based learning\n5.8\nGroup discussion\n5.9\nLecture\n6. Feedback Mechanism\nMay include but not limited to:\n6.1\nVerbal communication\n6.2\nWritten communication\n6.2.1\nAttendance records\n6.2.2\nAssessment records\n6.2.3\nIndividual learners progress reports/chart surveys\n6.3\nElectronic media communication\n7. Training Session\nEvaluation Instruments\nMay include but not limited to :\n7.1\nSupervisor survey\n7.2\nExit survey\n7.3\nTrainer’s competence survey\n7.4\nInstructional materials survey\n7.5\nStudent’s evaluation of instruction\n7.6\nSystems audit\n\n--- PDF PAGE 62 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n58\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1\nPrepared training facilities/resources.\n1.2\nConducted pre-assessment to learners.\n1.3\nFacilitated training session.\n1.4\nConducted competency assessment.\n1.5\nReviewed delivery of training session.\n2. Underpinning\nKnowledge\n\n2.1\nPrinciples of adult learning.\n2.2\nPrinciples in assessing and procedures in conducting and\nreviewing training sessions.\n2.3\nPreparation of training resources.\n2.4\nProcedures in conducting pre-assessment.\n2.5\nProcedures in conducting competency assessment.\n3. Underpinning Skills\n3.1\nSkills in facilitating group and individual learning.\n3.2\nSkills in designing task to facilitate learning.\n3.3\nSkills in conducting pre-assessment of learners.\n3.4\nSkills in conducting competency assessment.\n3.5\nSkills in reviewing delivery of training sessions.\n4. Resource Implications\n\nThe following resources MUST be provide:\n4.1\nAccess to learners and learning environment.\n4.2\nAccess to appropriate tools, equipment and materials\nrelevant to the training activities.\n5. Methods of\nAssessment\nCompetency maybe assessed through:\n5.1\nDemonstration / Observation with oral questioning.\n5.2\nPortfolio\n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 63 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n59\nUNIT OF COMPETENCY\n:\nSUPERVISE WORK-BASED LEARNING\n\nUNIT CODE\n:\nTVT232303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nparticularly establishing training requirements for trainees,\nmonitoring work-based training, and reviewing and evaluating\nwork-based learning effectiveness to supervise work-based\nlearning process.\n\nElement\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Establish training\nrequirements for\ntrainees\n1.1\nRelevant policies and guidelines are accessed and\ninterpreted to guide the development of work-based\narrangements\n1.2\nGoals for learning for the trainees are identified and\ndiscussed with relevant personnel\n1.3\nTraining plan is prepared in accordance with agreed\noutcomes\n1.4\nTraining schedule is developed, discussed and agreed with\nrelevant personnel\n1.5\nSupport mechanisms are identified and arranged according\nto the needs of the trainees\n1.6\nAvailability of materials is confirmed with relevant personnel\nwithin the budget requirements\n1.7\nThe objectives for undertaking work-based training and the\nprocesses involved are explained to the trainees\n2. Monitor work-based\ntraining\n2.1\nVisits to work-based training venue are conducted in\naccordance with requirements to ensure training\narrangements are met\n2.2\nTrainees progress is monitored and recorded against the\ntraining plan and contingencies are addressed\n2.3\nWork performance s are observed and alternative\napproaches are suggested\n2.4\nOHS requirements are monitored to ensure health, safety\nand welfare of the trainees\n2.5\nFeedback is provided to trainees about work performance\n3. Review and evaluate\nwork-based learning\neffectiveness\n3.1\nWork performance and learning achievement are analyzed in\naccordance with requirements\n3.2\nTrainees are encouraged to provide feedback on their\nlearning experience\n3.3\nThe effectiveness of the work-based learning is evaluated\nagainst the extent of attainment of the objectives\n3.4\nImprovements and changes to work-based learning are\nrecommended based on the review process\n\n--- PDF PAGE 64 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n60\nRANGE OF VARIABLES\n\nVariable\nRange\n1. Policies and guidelines\nInclude but not limited to:\n1.1\nRelevant acts or legislations governing\napprenticeships/learnerships\n1.2\nLaws on gender advocacy and development (GAD) and\npersons with disabilities (PWD)\n1.3\nRequirements stated in the training contract\n2. Training plan\nTraining Plan to include:\n2.1\nCompetencies to be obtained\n2.2\nTimeframe for achieving competencies\n2.3\nTraining to be undertaken\n2.4\nDelivery modes\n2.5\nDetails for structured training\n2.6\nAssessment details and arrangements\n2.7\nParties responsible for training delivery and assessment\n2.8\nTitle of qualification to be awarded\n3. Relevant personnel\n3.1\nWorkplace supervisor\n3.2\nTraining manager\n3.3\nTrainer/facilitator/assessor\n3.4\nTraining or assessment personnel\n3.5\nWorkers whose own jobs may be affected by the proposed\nchanges\n4. Support mechanisms\nMechanisms may include:\n4.1\nContact numbers for help or guidance\n4.2\nOn-line or e-mail tutoring\n4.3\nWork-based mentoring\n4.4\nLearning partners\n4.5\nContact numbers of other trainees\n4.6\nEquipment/tools/material needs\n5. Objectives\nObjectives may include:\n5.1\nIntroduction of new technology\n5.2\nNew products/service\n5.3\nNew position or job roles\n5.4\nAddressing identified skills gap\n5.5\nQuality improvements\n5.6\nCompetency achievement\n5.7\nOHS requirements\n6. Feedback\n6.1\nPerformance reviews\n6.2\nFormal or informal group or individual discussions\n\n--- PDF PAGE 65 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n61\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nCompetency requires evidence that the candidate:\n1.1\nestablished training requirements for trainees\n1.2\nmonitored work-based learning\n1.3\nreviewed and evaluated work-based learning effectiveness\n2.\nUnderpinning\nknowledge\n2.1\nPrinciples of learning\n2.2\nLearner styles (auditory, visual, left/right brain, theoretical, etc)\n2.3\nArea/subject matter of the delivery\n2.3.1\nrelevant competency standards\n2.3.2\nspecific unit/topic/subject\n2.3.3\nspecific areas of knowledge as defined in the learning\nprogram\n2.4\nIntroduction to learning theories\n2.4.1\ncognitive learning theory\n2.4.2\nandragogy\n2.4.3\npedagogy\n2.4.4\ninformation processing\n2.4.5\nbehavioral learning theory\n2.5\nTrainee group profile including characteristics and needs of\nindividual in the group\n2.6\nContent and requirements of the training program/plan\n2.7\nDelivery methods and techniques\n2.8\nTechniques for handling inappropriate behaviors\n2.9\nBehaviors which indicate learning difficulties\n2.10 Resources, equipment and support services available for\ntrainees with special needs\n2.11 Policy, legal requirements, codes of practice, competency\nstandards and other relevant legislations\n2.12\nOHS requirements\n3.\nUnderpinning skills\n3.1\nFacilitation skills to facilitate discussion and group interaction\n3.2\nHandle difficult trainees and situations\n3.3\nManage group activities\n3.4\nManage conflict\n3.5\nObserve and interpret behavior that puts others at risk\n3.6\nDifferent training delivery methods/ techniques, such as:\n3.6.1\ndemonstration\n3.6.2\ninstruction\n3.6.3\npresentation/lectures\n3.6.4\nguided facilitation of individual and group activities\n3.6.5\nfacilitating group discussions\n3.6.6\nbrainstorming activities\n3.6.7\nproviding and guiding practice opportunities\n3.6.8\ntutoring\n3.6.9\nproject-based\n3.6.10 coaching/mentoring\n3.7\nOral communication and interpersonal skills\n3.8\nNegotiation and conflict resolution skills\n3.9\nObservation skills\n3.10 Literacy skills to prepare presentations, questions, learning\nactivities, handouts, etc.\n3.11\nUsing audio/video equipment and computer\n4.\nResource implications\nThe following resources must be provided:\n4.1\ntraining venue for learning activities\n4.2\nlearning resources relevant to the activity\n4.3\ntime for organizing, monitoring, reviewing work-based learning\n5.\nMethod of assessment\nCompetency may be assessed through:\n5.1\ninterview\n5.2\nwritten exam\n5.3\nthird party report\n5.4\nportfolio\n6.\nContext for assessment\nCompetency may be assessed individually in the actual workplace or\nthrough accredited institution\n\n--- PDF PAGE 66 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n62\nUNIT OF COMPETENCY\n:\nCONDUCT COMPETENCY ASSESSMENT\n\nUNIT CODE\n:\nTVT232304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nconducting assessment. It details the requirements for\norganizing assessment activities, preparing the candidate,\ngathering and evaluating evidence, making assessment\ndecision, recording and providing feedback on assessment\noutcome.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Organize assessment\nactivities\n\n1.1\nAssessment activities in the workplace, training center or\nassessment center are identified and organized in\naccordance with the relevant Evidence Guide.\n1.2\nResources required for assessment, as specified in the\nEvidence Guide and the assessment tools, are obtained,\nchecked, and arranged within a safe and accessible\nassessment environment.\n1.3\nCost of assessment and assessment process are checked to\nensure compliance with organizational policy and\nprocedures..\n1.4\nAppropriate personnel are informed of the assessment\nactivity in line with organizational policy and procedures.\n2. Prepare the candidate\n\n2.1\nThe context and purpose of assessment are explained to\ncandidates in line with the requirements of the relevant\nAssessment Guidelines.\n2.2\nThe needs of the candidates are determined to establish any\nallowable adjustments in the assessment procedure\n2.3\nInformation is conveyed using verbal and non-verbal\nlanguage which promotes a supportive assessment\nenvironment.\n2.4\nLegal and ethical responsibilities associated with the\nassessment are explained to the candidates in line with the\nrelevant Assessment Guidelines.\n2.5\nThe competency standards to be assessed and the evidence\nto be collected are clearly explained to the candidate.\n2.6\nThe assessment procedure is explained to the candidate in\nline with the relevant Assessment Guidelines.\n3. Gather evidence\n\n3.1\nEvidence is gathered, using assessment methods specified\nin the relevant Evidence Guide\n3.2\nEvidence is gathered and documented in accordance with\nthe assessment procedures specified in the relevant\nAssessment Guidelines\n3.3\nReasonable adjustments are incorporated in the evidence\ngathering procedures, where appropriate, in line with the\nprocedures detailed in the Assessment Guidelines.\n3.4\nEvidence is gathered and documented using the relevant\nassessment tools.\n\n--- PDF PAGE 67 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n63\n\nELEMENT\nPERFORMANCE CRITERIA\nBold, Italicized terms are elaborated in the Range of Variables\n4. Make the assessment\ndecision\n4.1\nThe evidence is evaluated in terms of the rules of evidence\n4.2\nThe evidence is evaluated according to the dimensions of\ncompetency\n4.3\nThe assessment decision is made based on evaluation of\nthe evidence and the requirements of the relevant unit(s) of\ncompetency\n5. Record assessment\nresults\n5.1\nAssessment results are recorded accurately in accordance\nwith approved record keeping guidelines of the organization\n5.2\nRecords of the assessment procedure, evidence collected\nand confidentiality of assessment outcomes is maintained\naccording to the approved policy guidelines of the\norganization\n5.3\nIssuing of certificates is organized in line with approved\npolicy guidelines of the organization\n6. Provide feedback to\ncandidates\n6.1\nClear and constructive feedback on the assessment decision\nis given to the candidate in line with the relevant Assessment\nGuidelines.\n6.2\nWays of overcoming any gaps in competency are explored\nwith the candidate.\n6.3\nThe candidate is advised of available reassessment in line\nwith organizational policy and procedures.\n6.4\nAny assessment decision disputed by the candidate is\nrecorded and reported promptly to appropriate personnel in\nline with organizational policy and procedures.\n\n--- PDF PAGE 68 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Context and purpose of\nAssessment\nAssessment is carried out in order to:\n1.1\nCertify that an individual has achieved competency\n1.2\nRecruit and select trainees for a job\n1.3\nMonitor individual performance at work\n1.4\nDetermine training needs\n1.5\nConduct skills audit\n1.6\nRecognize prior learning\n1.7\nClassify a person against industry or enterprise standards\n1.8\nProvide feedback on progress during training\n2. Evidence\nEvidence may include both:\n2.1\nDirect evidence\n2.2\nIndirect evidence\n3. Record keeping\nRecord keeping may include:\n3.1\nForms designed for the specific assessment result\n3.2\nChecklist for recording\n3.3\nObservations/process\n3.4\nCombination of the above\n\n--- PDF PAGE 69 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n65\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nOriented the trainee\n1.2\nConducted assessment in accordance with competency\nrequirements and Assessment Guidelines\n1.3\nEvaluated gathered evidences and making sound decision\n1.4\nAssessment results are recorded in accordance with the\napproved assessment guidelines and record keeping\nprocedures\n1.5\nRecorded and reported assessment outcomes\n1.6\nProvided feedback to the trainee including advise on ways of\nmeeting training needs/gaps identified through the\nassessment\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCompetency standards and Assessment Guidelines\nCurriculum\n2.2\nOccupational health and safety regulations and procedures\nrelevant to the specified context\n2.3\nEvidence gathering process, method and tools\n2.4\nRules of evidence and dimensions of competency\n3. Underpinning Skills\n3.1\nCommunication skills required to convey message to the\ntrainee\n3.2\nSkills in gathering evidence, recording assessment results\nand reporting on the conduct of assessments\n3.3\nSkills in the application of various assessment methods\n3.4\nSkills in developing evidence guide & assessment tool\n3.5\nSkills in evaluating evidences and making assessment\ndecision\n4. Resource Implication\nThe following resources MUST be provided:\n4.1\nAccess to relevant competencies, sources of information on\nassessment methods, assessment tools and assessment\nprocedures.\n4.2\nRelevant workplace, community and school training center\nand equipment\n4.3\nStandard Operating Procedures from\ncommunity/enterprise/industry\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration/ Observation with oral questioning\n5.2\nPortfolio\n6. Context of Assessment\n\nAssessment should be conducted in the workplace / simulated\narea / TESDA Assessment Center\n\n--- PDF PAGE 70 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n66\nUNIT OF COMPETENCY\n:\nMAINTAIN TRAINING FACILITIES\n\nUNIT CODE\n:\nTVT232305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and attitude in maintaining training\nfacilities, includes implementing housekeeping activities and\nmaintaining training systems, equipment, tools, materials and\ndocuments.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan maintenance\nactivities\n1.1\nTraining facilities and equipment are identified.\n1.2\nRequisition for instructional equipment, tools, supplies and\nmaterials are prepared according to established procedures.\n1.3\nTraining equipment, tools, materials/supply inventory is\nprepared\n1.4\nEquipment, tools, supplies and materials option are\nthoroughly researched and ergonomic requirements are\nconsidered.\n1.5\nEquipment, tools, supplies and materials are identified and\njustified.\n1.6\nEquipment and systems impact on learners are accurately\ndocumented according to procedures\n1.7\nMaintenance activities are established according to\npolicies\n2. Prepare schedule of\nmaintenance\n2.1\nAreas /equipment to be maintained are identified\n2.2\nMaintenance activities, resources and schedule are\nidentified and prepared according to job requirements.\n2.3\nTechnical support services are identified as necessary\n3. Implement\nhousekeeping activities\n\n3.1\nRegular inspections are carried out in the work area\naccording to workplace procedures and standards.\n3.2\nFacilities are maintained in accordance with Occupational\nHealth and Safety.\n3.3\nDisposal of waste and dangerous chemicals are checked in\naccordance with Occupational Health and Safety, regulations\nand organizational policies and other regulations\n3.4\nInstructional materials and /equipment are secured in safe\nplaces in accordance with procedures.\n4. Maintain training\nequipment and tools\n4.1\nExecute regular maintenance activities and routine\nservicing/repair according to scheduled plan.\n4.2\nMaintenance procedures are followed in accordance with the\nmanufacturers manual and organization policies.\n4.3\nRespond to failed or unsafe equipment in accordance with\norganizational policies & procedures.\n4.4\nEquipment and tools are secured according to safety\nstandards\n4.5\nComplex faults or repair requirements outside area of\nresponsibility or competence are reported for specialist\nassistance in accordance with organizational procedures.\n4.6\nMaintenance activities are documented and reported\naccording to procedures\n5. Document\nmaintenance\ninspections\n5.1\nRegular inspections are carried out in the work area\naccording to workplace procedures and standards\n5.2\nMaintenance and repair activities are documented and\nreported according to organizational policies\n5.3\nDocuments are kept according to procedure\n\n--- PDF PAGE 71 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n67\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Facilities\n\nIncludes but not limited to:\n1.1\nElectrical system\n1.2\nVentilation system\n1.3\nWater system\n1.4\nWorkshops\n1.5\nFixtures\n1.6\nInfrastructure\n1.7\nLaboratory\n1.8\nWorkstations\n2. Equipment\nIncludes but not limited to:\n2.1\nlarge items of equipment\n2.2\nsmall items of equipment\n2.3\nsimple equipment\n2.4\ncomplex equipment\n2.5\nequipment with significant health and safety implications\n3. Maintenance activities\n\nIncludes but not limited to:\n3.1\nInspections of facilities and equipment\n3.2\nCleaning and lubricating of tools and equipment\n3.3\nTagging of defective tools and equipment\n3.4\nDisinfecting tools and equipment\n3.5\nRepairs\n4. Resources and\nschedule\n4.1\nManpower\n4.2\nFinancial\n4.3\nManufacturer’s manual\n4.4\nMaintenance guide\n4.5\nSupplies and materials\n4.6\nTools and equipment\n4.7\nOutsourcing services\n5. Organization policies\n\nIncludes but not limited to:\n5.1\nWarranty Agreement\n5.2\nWaste Management Scheme\n5.3\nDocumentation\n5.4\n5S Procedures\n5.5\nInventory of tools and equipment\n6. Documents\nIncludes but not limited to:\n6.1\nmaintenance plans\n6.2\nscheduling documents\n6.3\nbudgets\n6.4\nrequisitions\n6.5\ninventory reports\n6.6\nreports\n6.7\nsubmissions\n\n--- PDF PAGE 72 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n68\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPlanned and scheduled maintenance activities.\n1.2\nDetermined areas and facilities are cleaned and maintained\nin accordance with OHS and 5S procedure.\n1.3\nIdentified regular maintenance activities routine\nservicing/repair are scheduled.\n1.4\nSelected procedures are followed in accordance with the\nmanufacturers manual and organizational policies\n1.5\nIdentified repair activities are performed, documented /\nreported according to organizational policies\n1.6\nChecked the disposal of waste and dangerous chemicals\n2. Underpinning\nKnowledge\n2.1\nSafety Practices\n2.1.1\nPlanning and scheduling\n2.1.2\nProblem identification\n2.1.3\nWaste Management\n2.1.4\nKnowledge in 5’s\n2.2\nMaterials and Tools: Uses and specifications\n2.2.1\nTypes/classification and proper dosage of chemicals\n2.2.2\nmaterial, consumable and labor costs\n2.2.3\ntypes of tools and equipment and procedures for their\nsafe use, operation and maintenance\n2.2.4\nManufacturers specification\n2.3\nProcesses\n2.3.1\nCommunication protocol\n2.3.2\nPreventive maintenance\n2.3.3\nCorrective maintenance\n2.3.4\nmaterial, consumable and labor costs\n2.3.5\nmaintenance procedures and methodologies\n2.3.6\nenterprise work schedules\n2.3.7\nprocedures for the recording, reporting and\nmaintenance of workplace records and information\n2.4\nLegislation\n2.4.1\nKnowledge about OH & S Organization policies\n2.4.2\nenvironmental protection requirements\n2.4.3\nRA 9003-Solid waste management\n3. Underpinning Skills\n\n3.1\nplanning and Scheduling of Activity\n3.2\nInspections activity\n3.3\nuse and maintain relevant tools, machinery and equipment\n3.4\nidentify problems and equipment faults and demonstrate\nappropriate response procedures\n3.5\nprioritize maintenance works\n3.6\ninterpret of inspection data\n3.7\ncalculate of maintenance works resource quantities and\nproject costs\n3.8\nHousekeeping\n3.9\nTroubleshooting technique\n3.10\nPreparation of Reports\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to learning environment\n4.2\nAccess to appropriate tools and equipment and materials\n4.3\nAccess to other resources\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 73 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n69\nUNIT OF COMPETENCY\n:\nUTILIZE ELECTRONIC MEDIA IN FACILITATING TRAINING\n\nUNIT CODE\n:\nTVT232306\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required in\nadvance training environment using electronic media in\nfacilitating training, including operation and maintenance of the\nequipment.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect electronic\nmedia equipment\n1.1\nElectronic media equipment are inspected according to\nspecified checklist.\n1.2\nAbnormalities or fault are identified and problem areas are\nanticipated.\n1.3\nHealth and Safety hazards are identified.\n2. Operate electronic\nmedia equipment to\ndeliver a lesson\n2.1\nEquipment are set-up in accordance with health and safety\nstandards\n2.2\nElectronic media equipment are operated in accordance to\nUser’s Manual\n2.3\nEquipment are used for optimum performance based on its\ncapacity\n2.4\nTeacher and learner cantered learning principles are\nimplemented in line with the execution of session plan.\n3. Maintain electronic\nmedia equipment\n3.1\nPreventive maintenance procedure, diagnostic tools and\nsystem check are applied periodically.\n3.2\nChecklist are maintained as per Standard Operating\nProcedures\n3.3\nAV/multimedia equipment are stored to safe rack/cabinet\n\n--- PDF PAGE 74 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n70\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Electronic media\nequipment\nMay include but not limited to\n1.1\nAudio Mixers\n1.2\nComputer Application Software\n1.3\nMicrophones\n1.4\nDVDs/CDs\n1.5\nAudio Amplifiers\n1.6\nSpeakers System\n1.7\nP.A Systems\n1.8\nCamera (Digital/Film Based)\n1.9\nVideo Camera\n1.10 AV Tapes\n1.11 Video Monitor\n1.12 LCD Projector\n1.13 Electronic Whiteboard\n1.14 Personal Computer\n2. Diagnostic Tools\n2.1\nAnti-virus software\n2.2\nMulti tester\n\n--- PDF PAGE 75 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n71\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInspected A/V equipment\n1.2\nOperated A/V and multimedia equipment to deliver a lesson\n1.3\nMaintained A/V equipment\n2. Underpinning\nKnowledge\n2.1\nSAFETY PRACTICES\n2.1.1\nelectrical / radiation and shock hazards\n2.2\nMATERIALS AND TOOLS:USES AND SPECIFICATIONS\n2.2.1 A/V equipment uses and specifications\n2.2.2 Electronic media equipment uses and\nspecifications\n2.2.3 Uses and care for electronic media equipment\n2.2.4 Diagnostic tools uses and specifications\n2.3\nTRADE THEORY\n2.3.1 A/V equipment nomenclature\n2.3.2 Multimedia equipment nomenclature\n2.3.3 A/V multimedia equipment handling procedures\n2.3.4 Quality of sound,\n2.3.5 Quality of A/V\n2.3.6 Psychological perceptions\n2.3.7 Preventive maintenance\n2.3.8 Tips and tricks in presenting\n2.4\nLEGISLATION\n2.4.1 Licensing agreement\n3. Underpinning Skills\n3.1\nBasic Computer Operation\n3.2\nCommunication Skills\n3.3\nPlanning/Organizational Skills\n3.4\nPresentation Skills\n3.5\nAdopt relevant industry and community practices and\nexperiences\n3.6\nMaintain appropriate documents and records\n4. Resource Implications\n\nThe following resources MUST be provided:\n4.1\nA/V and multimedia equipment\n4.2\nUser’s manual\n4.3\nOHS practice\n4.4\nWorkstation\n4.5\nWorkplace guidelines\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation with Oral questioning\n5.2\nPortfolio\n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 76 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n72"
}
