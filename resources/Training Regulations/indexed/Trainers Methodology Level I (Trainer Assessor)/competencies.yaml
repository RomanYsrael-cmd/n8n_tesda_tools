        "source_title": "APPLY MATH AND SCIENCE PRINCIPLES IN TECHNICAL TRAINING",
        "source_text": "--- PDF PAGE 8 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n4 \nUNIT TITLE  \n: \nAPPLY MATH AND SCIENCE PRINCIPLES IN TECHNICAL \nTRAINING \n \nUNIT CODE \n: \n500232101 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to integrate math and \nscience concepts in the content and delivery of technical training \nprograms and to motivate trainees in learning and applying such \nconcepts in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Identify math and \nscience manifestations \nin the course content \nand the workplace \n1.1 \nCourse content and learning outcomes are reviewed and \nstudied for math and science content \n1.2 \nSituations in the workplace and in everyday life are related to \nthe course or program are identified for inclusion or mention \nin the training \n1.3 \nTraining aids, lesson plans or session notes are prepared, \nadopted or customized incorporating or highlighting \napplications of math and science principles \n \n2. Relate math and \nscience concepts to \ncommon and \nworkplace situations  \n2.1 \nPractical applications of math and science related to the \ndesired learning outcomes are incorporated, explained and \nstressed during the training \n2.2 \nTrainees are aided and encouraged to identify and apply \nmath and science concepts in their work and everyday life \n2.3 \nClass examples/cases, exercises, and assignments are \ngiven for trainees to explore and reflect on the \napplications/manifestations of math and science along the \ncourse content \n3. Assess trainees’ \ninternalization of math \nand science concepts  \n3.1 \nTrainees’ retention of basic math and science concepts are \nreviewed to identify areas needing further intervention \n3.2 \nTrainees’ appreciation of math and science principles along \nthe trade area or subject matter is determined using \napplicable assessment methodology \n3.3 \nSimple mathematical and scientific models/representations \nare discussed to aid in the understanding and application of \nprinciples and theories using language, style and format that \nare readily understood \n3.4 \nPoorly-understood areas of math and science relevant to the \ncourse are given extra attention and explained in user-\nfriendly terms in accordance with trainees’ interests and \nlearning styles   \n \n4. Introduce further \nenhancements  \n4.1 \nPersonal knowledge, experiences and observations of self \nand others in the area Of math and science applications are \ncited and incorporated in the lessons and lecture-discussions\n4.2 \nResults of application of math and science concepts are \nevaluated and documented for replication and enhancement \n4.3 \nLogical, systematic and scientific thinking and methods are \nintroduced and developed for trainees to assimilate and \napply in their own work and study \n4.4 \nContextual and experiential learning methods are utilized \nto aid in appreciation of math and science concepts\n\n--- PDF PAGE 9 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n5 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE  \n1. Training aids\nMay include –\n1.1 \nCurriculum/modules \n1.2 \nLearning materials/activities \n1.2.1 \nSelf-paced materials \n1.2.2 \nJob sheets \n1.2.3 \nRelated theory \n1.3 \nAudio-visual aids \n1.3.1 \nCharts \n1.3.2 \nGraphs \n1.3.2 \nDiagrams \n1.4 \nInteractive video \n1.5\nComputer-based training materials\n2. Assessment \nmethodology \nMay include –\n2.1 \nProjects \n2.2 \nCase problems \n2.3 \nWritten tests \n2.4 \nOral questioning \n2.5\nInterviews \n3. Models/representations\nMay include –\n3.1 \nSimple quantitative models \n3.1.1 \nmathematical formulas using elementary algebra \n3.1.2 \nconstants and variables \n3.1.3 \nfunctions and relations  \n3.2 \nBasic laws and principles \n3.2.1 \nOhm’s law \n3.2.2 \nNewton’s laws of motion  \n3.2.3 \nBoyle’s law \n3.3 \nGraphs and diagrams \n3.3.1 \nCharts and flowcharts \n3.3.2 \nCharacteristic curves \n3.3.3 \nRefrigeration cycle \n3.3.4 \nSchematic/block diagrams \n3.3.5\nFree-body diagrams \n4. Learning styles\nMay include –\n4.1 \nKolb-model styles \n4.1.1 \nConverger \n4.1.2 \nDiverger \n4.1.3 \nAssimilator \n4.1.4 \nAccommodator \n4.2 \nHoney-Mumford model styles \n4.2.1 \nActivist \n4.2.2 \nReflector \n4.2.3 \nTheorist \n4.2.4 \nPragmatist \n4.3 \nFleming-model styles \n4.3.1 \nVisual learners \n4.3.2 \nAuditory learners \n4.3.3 \nReading/writing-preference learners \n4.3.4\nKinesthetic/tactile learners\n5. Contextual and \nexperiential learning \nmethods \nMay include –\n5.1 \nCase studies and problems \n5.2 \nProject-based instruction \n5.3 \nField trips \n5.4 \nCompany visits \n5.5 \nInterviews \n5.6 \nInstitutional attachments/immersion \n5.7\nCommunity service\n\n--- PDF PAGE 10 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n6 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate – \n1.1 \nDemonstrated understanding of basic math and science \nconcepts relevant to the competency or qualification \n1.2 \nDemonstrated ability to apply math and science principles to \nthe competency or tasks being performed \n1.3 \nDemonstrated ability to integrate and contextualize math and \nscience concepts in the design and delivery of technical \ntraining  \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nBasic arithmetic – the four fundamental operations \n2.2 \nElementary algebra \n2.3 \nBasic science \n2.3.1 \nGeneral science \n2.3.2 \nNatural sciences \n2.3.3 \nPhysical and biological sciences \n2.3.4 \nSocial sciences \n2.4 \nBasic training methodology \n2.5 \nPositive work values (patience, perseverance, empathy, \nprofessionalism, concern for safety and quality) \n3. Underpinning skills \n3.1 \nCommunication skills \n3.2 \nTraining development and management skills \n3.3 \nObserving safety and health requirements in the classroom, \nlaboratory and workshop \n3.4 \nInstructional skills \n4. Resource implications \nThe following resources must be provided – \n4.1 \nAccess to math and science lab or similar workshop \n4.2 \nAccess to real or simulated work area \n4.3 \nCase problems in math and science applications \n5. Method of Assessment \nCompetency may be assessed through – \n5.1 \nObservation or demonstration with oral questioning \n5.2 \nWritten exam \n5.3 \nCase problems \n5.4 \nInterview \n5.5 \nPortfolio \n5.6 \nThird-party report \n6. Context of assessment \nCompetency may be assessed on the job or in a simulated work \nenvironment\n",
