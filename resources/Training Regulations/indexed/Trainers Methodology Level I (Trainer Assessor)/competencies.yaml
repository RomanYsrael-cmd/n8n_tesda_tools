        "source_title": "SUPERVISE WORK-BASED LEARNING",
        "source_text": "--- PDF PAGE 63 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n59 \nUNIT OF COMPETENCY \n: \nSUPERVISE WORK-BASED LEARNING \n \nUNIT CODE \n: \nTVT232303 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required \nparticularly establishing training requirements for trainees, \nmonitoring work-based training, and reviewing and evaluating \nwork-based learning effectiveness to supervise work-based \nlearning process.  \n \nElement \nPerformance Criteria \nItalicized terms are elaborated in the Range of Variables \n1. Establish training \nrequirements for \ntrainees \n1.1 \nRelevant policies and guidelines are accessed and \ninterpreted to guide the development of work-based \narrangements \n1.2 \nGoals for learning for the trainees are identified and \ndiscussed with relevant personnel \n1.3 \nTraining plan is prepared in accordance with agreed \noutcomes \n1.4 \nTraining schedule is developed, discussed and agreed with \nrelevant personnel  \n1.5 \nSupport mechanisms are identified and arranged according \nto the needs of the trainees \n1.6 \nAvailability of materials is confirmed with relevant personnel \nwithin the budget requirements \n1.7 \nThe objectives for undertaking work-based training and the \nprocesses involved are explained to the trainees \n2. Monitor work-based \ntraining \n2.1 \nVisits to work-based training venue are conducted in \naccordance with requirements to ensure training \narrangements are met \n2.2 \nTrainees progress is monitored and recorded against the \ntraining plan and contingencies are addressed \n2.3 \nWork performance s are observed and alternative \napproaches are suggested \n2.4 \nOHS requirements are monitored to ensure health, safety \nand welfare of the trainees \n2.5 \nFeedback is provided to trainees about work performance  \n3. Review and evaluate \nwork-based learning \neffectiveness \n3.1 \nWork performance and learning achievement are analyzed in \naccordance with requirements \n3.2 \nTrainees are encouraged to provide feedback on their \nlearning experience \n3.3 \nThe effectiveness of the work-based learning is evaluated \nagainst the extent of attainment of the objectives \n3.4 \nImprovements and changes to work-based learning are \nrecommended based on the review process\n\n--- PDF PAGE 64 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n60 \nRANGE OF VARIABLES \n \nVariable \nRange \n1. Policies and guidelines \nInclude but not limited to: \n1.1 \nRelevant acts or legislations governing \napprenticeships/learnerships  \n1.2 \nLaws on gender advocacy and development (GAD) and \npersons with disabilities (PWD) \n1.3 \nRequirements stated in the training contract \n2. Training plan \nTraining Plan to include: \n2.1 \nCompetencies to be obtained \n2.2 \nTimeframe for achieving competencies \n2.3 \nTraining to be undertaken \n2.4 \nDelivery modes \n2.5 \nDetails for structured training \n2.6 \nAssessment details and arrangements \n2.7 \nParties responsible for training delivery and assessment \n2.8 \nTitle of qualification to be awarded  \n3. Relevant personnel \n3.1 \nWorkplace supervisor \n3.2 \nTraining manager \n3.3 \nTrainer/facilitator/assessor \n3.4 \nTraining or assessment personnel \n3.5 \nWorkers whose own jobs may be affected by the proposed \nchanges \n4. Support mechanisms \nMechanisms may include: \n4.1 \nContact numbers for help or guidance \n4.2 \nOn-line or e-mail tutoring \n4.3 \nWork-based mentoring \n4.4 \nLearning partners \n4.5 \nContact numbers of other trainees \n4.6 \nEquipment/tools/material needs \n5. Objectives \nObjectives may include: \n5.1 \nIntroduction of new technology \n5.2 \nNew products/service \n5.3 \nNew position or job roles \n5.4 \nAddressing identified skills gap \n5.5 \nQuality improvements \n5.6 \nCompetency achievement \n5.7 \nOHS requirements \n6. Feedback \n6.1 \nPerformance reviews \n6.2 \nFormal or informal group or individual discussions\n\n--- PDF PAGE 65 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n61 \nEVIDENCE GUIDE \n \n1.\nCritical aspects of \ncompetency \nCompetency requires evidence that the candidate:\n1.1 \nestablished training requirements for trainees \n1.2 \nmonitored work-based learning \n1.3\nreviewed and evaluated work-based learning effectiveness\n2.\nUnderpinning \nknowledge \n2.1\nPrinciples of learning \n2.2 \nLearner styles (auditory, visual, left/right brain, theoretical, etc) \n2.3 \nArea/subject matter of the delivery \n2.3.1 \nrelevant competency standards \n2.3.2 \nspecific unit/topic/subject \n2.3.3 \nspecific areas of knowledge as defined in the learning \nprogram \n2.4 \nIntroduction to learning theories \n2.4.1 \ncognitive learning theory \n2.4.2 \nandragogy \n2.4.3 \npedagogy \n2.4.4 \ninformation processing \n2.4.5 \nbehavioral learning theory \n2.5 \nTrainee group profile including characteristics and needs of \nindividual in the group \n2.6 \nContent and requirements of the training program/plan \n2.7 \nDelivery methods and techniques \n2.8 \nTechniques for handling inappropriate behaviors \n2.9 \nBehaviors which indicate learning difficulties \n2.10 Resources, equipment and support services available for \ntrainees with special needs \n2.11 Policy, legal requirements, codes of practice, competency \nstandards and other relevant legislations \n2.12\nOHS requirements\n3.\nUnderpinning skills\n3.1\nFacilitation skills to facilitate discussion and group interaction\n3.2 \nHandle difficult trainees and situations \n3.3 \nManage group activities \n3.4 \nManage conflict \n3.5 \nObserve and interpret behavior that puts others at risk \n3.6 \nDifferent training delivery methods/ techniques, such as: \n3.6.1 \ndemonstration \n3.6.2 \ninstruction \n3.6.3 \npresentation/lectures \n3.6.4 \nguided facilitation of individual and group activities \n3.6.5 \nfacilitating group discussions \n3.6.6 \nbrainstorming activities  \n3.6.7 \nproviding and guiding practice opportunities \n3.6.8 \ntutoring  \n3.6.9 \nproject-based \n3.6.10 coaching/mentoring \n3.7 \nOral communication and interpersonal skills \n3.8 \nNegotiation and conflict resolution skills \n3.9 \nObservation skills \n3.10 Literacy skills to prepare presentations, questions, learning \nactivities, handouts, etc. \n3.11\nUsing audio/video equipment and computer\n4.\nResource implications\nThe following resources must be provided:\n4.1 \ntraining venue for learning activities \n4.2 \nlearning resources relevant to the activity \n4.3\ntime for organizing, monitoring, reviewing work-based learning\n5.\nMethod of assessment\nCompetency may be assessed through:\n5.1 \ninterview \n5.2 \nwritten exam \n5.3 \nthird party report \n5.4\nportfolio\n6.\nContext for assessment\nCompetency may be assessed individually in the actual workplace or \nthrough accredited institution\n",
