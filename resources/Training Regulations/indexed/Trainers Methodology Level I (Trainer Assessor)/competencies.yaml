          "source_text": "VARIABLE \nRANGE  \n1. Training aids\nMay include –\n1.1 \nCurriculum/modules \n1.2 \nLearning materials/activities \n1.2.1 \nSelf-paced materials \n1.2.2 \nJob sheets \n1.2.3 \nRelated theory \n1.3 \nAudio-visual aids \n1.3.1 \nCharts \n1.3.2 \nGraphs \n1.3.2 \nDiagrams \n1.4 \nInteractive video \n1.5\nComputer-based training materials\n2. Assessment \nmethodology \nMay include –\n2.1 \nProjects \n2.2 \nCase problems \n2.3 \nWritten tests \n2.4 \nOral questioning \n2.5\nInterviews \n3. Models/representations\nMay include –\n3.1 \nSimple quantitative models \n3.1.1 \nmathematical formulas using elementary algebra \n3.1.2 \nconstants and variables \n3.1.3 \nfunctions and relations  \n3.2 \nBasic laws and principles \n3.2.1 \nOhm’s law \n3.2.2 \nNewton’s laws of motion  \n3.2.3 \nBoyle’s law \n3.3 \nGraphs and diagrams \n3.3.1 \nCharts and flowcharts \n3.3.2 \nCharacteristic curves \n3.3.3 \nRefrigeration cycle \n3.3.4 \nSchematic/block diagrams \n3.3.5\nFree-body diagrams \n4. Learning styles\nMay include –\n4.1 \nKolb-model styles \n4.1.1 \nConverger \n4.1.2 \nDiverger \n4.1.3 \nAssimilator \n4.1.4 \nAccommodator \n4.2 \nHoney-Mumford model styles \n4.2.1 \nActivist \n4.2.2 \nReflector \n4.2.3 \nTheorist \n4.2.4 \nPragmatist \n4.3 \nFleming-model styles \n4.3.1 \nVisual learners \n4.3.2 \nAuditory learners \n4.3.3 \nReading/writing-preference learners \n4.3.4\nKinesthetic/tactile learners\n5. Contextual and \nexperiential learning \nmethods \nMay include –\n5.1 \nCase studies and problems \n5.2 \nProject-based instruction \n5.3 \nField trips \n5.4 \nCompany visits \n5.5 \nInterviews \n5.6 \nInstitutional attachments/immersion \n5.7\nCommunity service\n\n--- PDF PAGE 10 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n6"
