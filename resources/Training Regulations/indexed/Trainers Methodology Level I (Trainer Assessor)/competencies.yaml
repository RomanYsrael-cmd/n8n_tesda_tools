        "source_title": "CONDUCT COMPETENCY ASSESSMENT",
        "source_text": "--- PDF PAGE 66 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n62 \nUNIT OF COMPETENCY \n: \nCONDUCT COMPETENCY ASSESSMENT  \n \nUNIT CODE \n:  \nTVT232304 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \nconducting assessment. It details the requirements for \norganizing assessment activities, preparing the candidate, \ngathering and evaluating evidence, making assessment \ndecision, recording and providing feedback on assessment \noutcome. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Organize assessment \nactivities \n \n1.1 \nAssessment activities in the workplace, training center or \nassessment center are identified and organized in \naccordance with the relevant Evidence Guide.    \n1.2 \nResources required for assessment, as specified in the \nEvidence Guide and the assessment tools, are obtained, \nchecked, and arranged within a safe and accessible \nassessment environment. \n1.3 \nCost of assessment and assessment process are checked to \nensure compliance with organizational policy and \nprocedures.. \n1.4 \nAppropriate personnel are informed of the assessment \nactivity in line with organizational policy and procedures. \n2. Prepare the candidate \n \n2.1 \nThe context and purpose of assessment are explained to \ncandidates in line with the requirements of the relevant \nAssessment Guidelines. \n2.2 \nThe needs of the candidates are determined to establish any \nallowable adjustments in the  assessment procedure \n2.3 \nInformation is conveyed using verbal and non-verbal \nlanguage which promotes a supportive assessment \nenvironment. \n2.4 \nLegal and ethical responsibilities associated with the \nassessment are explained to the candidates in line with the \nrelevant Assessment Guidelines. \n2.5 \nThe competency standards to be assessed and the evidence \nto be collected are clearly explained to the candidate. \n2.6 \nThe assessment procedure is explained to the candidate in \nline with the relevant Assessment Guidelines. \n3. Gather evidence \n \n \n \n3.1 \nEvidence is gathered, using assessment methods specified \nin the relevant Evidence Guide \n3.2 \nEvidence is gathered and documented in accordance with \nthe assessment procedures specified in the relevant \nAssessment Guidelines \n3.3 \nReasonable adjustments are incorporated in the evidence \ngathering procedures, where appropriate, in line with the \nprocedures detailed in the Assessment Guidelines. \n3.4 \nEvidence is gathered and documented using the relevant \nassessment tools.\n\n--- PDF PAGE 67 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n63 \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, Italicized terms are elaborated in the Range of Variables \n4. Make the assessment \ndecision \n4.1 \nThe evidence is evaluated in terms of the rules of evidence \n4.2 \nThe evidence is evaluated according to the dimensions of \ncompetency \n4.3 \nThe assessment decision is made based on evaluation of \nthe evidence and the requirements of the relevant unit(s) of \ncompetency \n5. Record assessment \nresults \n5.1 \nAssessment results are recorded accurately in accordance \nwith approved record keeping guidelines of the organization\n5.2 \nRecords of the assessment procedure, evidence collected \nand confidentiality of assessment outcomes is maintained \naccording to the approved policy guidelines of the \norganization \n5.3 \nIssuing of certificates is organized in line with approved \npolicy guidelines of the organization \n6. Provide feedback to \ncandidates  \n6.1 \nClear and constructive feedback on the assessment decision \nis given to the candidate in line with the relevant Assessment \nGuidelines. \n6.2 \nWays of overcoming any gaps in competency are explored \nwith the candidate. \n6.3 \nThe candidate is advised of available reassessment in line \nwith organizational policy and procedures. \n6.4 \nAny assessment decision disputed by the candidate is \nrecorded and reported promptly to appropriate personnel in \nline with organizational policy and procedures.\n\n--- PDF PAGE 68 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n64 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Context and purpose of \nAssessment \nAssessment is carried out in order to: \n1.1 \nCertify that an individual has achieved competency \n1.2 \nRecruit and select trainees for a job \n1.3 \nMonitor individual performance at work \n1.4 \nDetermine training needs \n1.5 \nConduct skills audit \n1.6 \nRecognize  prior  learning \n1.7 \nClassify a person against industry or enterprise standards \n1.8 \nProvide feedback on progress during training \n2. Evidence \nEvidence may include both: \n2.1 \nDirect evidence \n2.2 \nIndirect evidence \n3.  Record keeping \nRecord keeping may include: \n3.1 \nForms designed for the specific assessment result \n3.2 \nChecklist for recording \n3.3 \nObservations/process \n3.4 \nCombination of the above\n\n--- PDF PAGE 69 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n65 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nOriented the trainee \n1.2 \nConducted assessment in accordance with competency \nrequirements and Assessment Guidelines \n1.3 \nEvaluated gathered evidences and making sound decision \n1.4 \nAssessment results are recorded in accordance with the \napproved assessment guidelines and record keeping \nprocedures \n1.5 \nRecorded and reported assessment outcomes \n1.6 \nProvided feedback to the trainee including advise on ways of \nmeeting training needs/gaps identified through the \nassessment \n2.  Underpinning \nKnowledge and \nAttitude \n2.1 \nCompetency standards and Assessment Guidelines \nCurriculum \n2.2 \nOccupational health and safety regulations and procedures \nrelevant to the specified context \n2.3 \nEvidence gathering process, method and tools \n2.4 \nRules of evidence and dimensions of competency \n3.   Underpinning Skills \n3.1 \nCommunication skills required to convey message to the \ntrainee \n3.2 \nSkills in gathering evidence, recording assessment results \nand reporting on the conduct of assessments \n3.3 \nSkills in the application of various assessment methods \n3.4 \nSkills in developing evidence guide & assessment tool \n3.5 \nSkills in evaluating evidences and making assessment \ndecision \n4.  Resource Implication \nThe following resources MUST be provided: \n4.1 \nAccess to relevant competencies, sources of information on \nassessment methods, assessment tools and assessment \nprocedures. \n4.2 \nRelevant workplace, community and school training center \nand equipment \n4.3 \nStandard Operating Procedures from \ncommunity/enterprise/industry  \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration/ Observation with oral questioning \n5.2 \nPortfolio \n6.  Context of Assessment \n \nAssessment should be conducted in the workplace / simulated \narea / TESDA Assessment Center\n",
