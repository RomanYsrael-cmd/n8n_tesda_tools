        "source_text": "--- PDF PAGE 54 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n50 \nUNIT TITLE \n:   \nDEVELOP AND PROMOTE UNDERSTANDING OF GLOBAL \nLABOR MARKETS \n \nUNIT CODE \n: \n500232110 \n \nDESCRIPTOR \n:   \nThis unit describes the outcomes required in understanding, \nanalyzing and disseminating information on global labor-market \ntrends and concerns as they affect the TVET, labor and \nemployer sectors. \n \nELEMENT \nPERFORMANCE CRITERIA \n1. Identify current and \nfuture trends/concerns \n1.1 \nRelevant and reliable sources of labor-market information \n(LMI) are identified and accessed based on needs \n1.2 \nGlobal and local relevance of labor-market (LM) trends are \nstudied and analyzed for their implications in the labor and \ntraining market  \n1.3 \nRelevant events, including positions and interests of \ntrainees, clients and training providers are studied and \nconsidered in the design and delivery of training \n2. Assess new \ndevelopments  \n2.1 \nEmerging issues of potential significance to the local and \nglobal labor markets are identified and studied \n2.2 \nResearch findings are assessed for significance to the \ntechnical and vocational education and training (TVET)  \nsector \n2.3 \nOpportunities and risks of new developments are identified \nand assessed \n2.4 \nViews of trainees, training providers and other stakeholders \nare identified and assessed for their potential benefit or \nimpact \n2.5 \nWhere necessary responses and strategies for LM threats \nand opportunities are developed in consultation with other \nTVET partners  \n2.6 \nNew and emerging concepts, technologies, products and \nprocesses are noted and evaluated based on their \nimplications for the TVET and labor market \n3. Utilize labor market \ninformation to best \neffect \n3.1 \nAwareness of LM situation and related concerns are \npromoted through talks, lectures and other training \nopportunities \n3.2 \nRelevant information on LM and new technologies are \nincorporated in the curriculum and during the training \n3.3 \nMention/Presentations  of LMI and trends are made during \nmeetings, fora and training situations using language and \ndelivery styles adapted to the audience \n3.4 \nWhere necessary, responses and strategies to global labor-\nmarket developments are developed and recommended \nusing analytical tools and current LMI\n\n--- PDF PAGE 55 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n51 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE  \n1. LMI sources \nMay include -- \n1.1 \nProfessional literature and journals \n1.2 \nIndustry associations \n1.3 \nResource persons \n1.4 \nInternet sites, e. g., JobsDB \n1.5 \nIndustry/trade meetings/conferences \n1.6 \nTrade fairs \n1.7 \nNetwork of contacts or key informants \n1.8 \nStatistical reports \n1.9 \nGovernment agencies, e. g., NSCB/NSO, DOLE (BLE, \nPOEA, BLES) \n2. Responses and \nstrategies \nMay include -- \n2.1 \nRetraining \n2.2 \nSearch for new markets and partners \n2.3 \nSkills updating/upgrading \n2.4 \nRefresher courses \n2.5 \nUpdating of competency standards \n2.6 \nCompetency assessment and certification \n2.7 \nAdoption of new training methods and technologies \n2.8 \nRedesign of training programs/courses \n3. Analytical tools \nMay include – \n3.1 \nSWOT analysis \n3.2 \nForce-field analysis \n3.3 \nProblem/Objectives tree \n3.4 \nFishbone/cause-and-effect  diagram\n\n--- PDF PAGE 56 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n52 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate – \n1.1 \nDemonstrated ability to understand and analyze global labor \nmarkets \n1.2 \nDemonstrated ability to identify and take advantage of \nopportunities in the global LM \n1.3 \nDemonstrated ability to respond to potential threats to TVET \narising from LM trends \n1.4 \nDemonstrated ability to adapt technical training to global LM \ntrends \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nLabor-market paradigm \n2.1.1 \nSupply side – TVET providers and schools, \ncommunities \n2.1.2 \nDemand side – employers (government and private \nsector) \n2.1.3 \nLabor requirements variations and seasonality in the \nLM \n2.2 \nTVET sector knowledge – work regime, systems, \ntechnologies and unique aspects relevant to sector or \ngeographic area \n2.3 \nProfile of TVET sector stakeholders, opinion  leaders and \nmajor players \n2.4 \nLegislations and regulations that impact on the TVET sector \n2.5 \nEvents and trends that have shaped the global labor market \nover time \n2.6 \nTrends in customer expectations and buying patterns \n2.7 \nPositive work values (proactiveness, practicality, results and \nservice orientation, quality-consciousness)  \n3. Underpinning skills \n3.1 \nResearching LMI \n3.2 \nAnalyzing the relevance, accuracy and shortcomings of \ninformation \n3.3 \nDiscerning trends, issues ands implications \n3.4 \nAssessing threats and opportunities \n3.5 \nCommunication and presentation skills \n4. Resource implications \nThe following resources MUST be provided – \n4.1 \nTVET situationers and/or LMI research reports \n4.2 \nCase problems \n5. Method of assessment \nCompetency may be assessed through – \n5.1 \nInterview and oral questioning based on case problems \n5.2 \nDemonstration with oral questioning of an oral presentation \nmade by the candidate \n5.3 \nThird-party report \n5.4 \nPortfolio (includes reports, recommendations, research and \ninformation relating to the global LM written by candidate) \n6. Context of assessment \nAssessment must be conducted in the workplace or a simulated \nwork environment\n",
        "required_knowledge": null,
        "required_skills": null
      }
