        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidences that the trainee:\n1.1\nIdentified and analysed relevant curriculum document.\n1.2\nIdentified current competencies of target group.\n1.3\nIdentified learners’ training requirements.\n1.4\nPrepared plan for a series of training sessions.\n1.5\nIdentified relevant delivery method, training activities and\ntraining delivery modes.\n1.6\nIdentified and organized resources required for the series of\ntraining sessions.\n1.7\nOrganized access to appropriate training location.\n2. Underpinning\nknowledge and attitude\n\n2.1\nCompetency standards and related curriculum\n2.2\nIdentification and correct usage of equipment, processes and\nprocedures relevant to the competencies being delivered\n2.3\nTraining delivery modes\n2.4\nTraining methods\n2.5\nTarget groups – identify and needs\n2.6\nRecognition of current competencies\n2.7\nOccupational health and safety relevant to the competencies\nbeing delivered.\n2.8\nCommunity development modes and training approaches.\n3. Underpinning Skills\n3.1\nTechnical writing skills required to document session plans\nand prepare basic instructional materials\n3.2\nStrategies for determining current competencies of learners\n3.3\nPlanning and organizational skills\n3.4\nSkills in operating personal computer\n\n4. Resource Implications\n\nThe following resources MUST be provided:\n4.1\nRelevant curriculum documents\n4.2\nWorkplace or simulated environment /Context\n5. Methods of\nAssessment\nCompetencies must be assessed by:\n5.1\nObservation/demonstration with oral questioning\n5.2\nWritten examination\n5.3\nPortfolio\n5.4\nThird party report\n\n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 60 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n56\nUNIT OF COMPETENCY\n:\nFACILITATE LEARNING SESSION\n\nUNIT CODE\n:"
        },
        "source_text": "TVT232301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in planning a\ntraining session. It includes identifying learner’s requirements,\npreparing session plan, preparing instructional materials and\norganizing learning and teaching and assessment resources.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify learner’s training\nrequirements\n1.1\nCurriculum document is reviewed and analyzed.\n1.2\nCurrent competencies of target group are determined.\n1.3\nCompetencies required to be attained are compared with\ncurrent competencies of target group.\n1.4\nResults of comparison are used to determine training\nrequirements.\n1.5\nTraining requirements are validated with appropriate people.\n2. Prepare session plans\n2.1\nInstructional blueprint and learning-engagement plan are\nprepared\n2.2\nTraining delivery modes are identified.\n2.3\nTraining methods that pertains to the required competencies\nare addressed.\n2.4\nSequence of training activities is determined.\n2.5\nResources to support learning are identified.\n2.6\nSession plan is finalized according to required format.\n3. Prepare instructional\nmaterials\n3.1\nInstructional materials that are focused on a key concept or\nidea related to the work activity under consideration are\nprepared.\n3.2\nThe text and illustrations that are clear, legible and appropriate\nto the trainees are prepared.\n3.3\nLanguage, style and format of the materials are appropriate to\nthe trainee’s characteristics and needs\n4. Prepare assessment\ninstruments (Institutional\n4.1\nRelevant modules of instruction are identified, read and\ninterpreted to identify the required evidence.\n4.2\nEvidence requirements are determined which show full\ncoverage of the training module to be assessed and a\nconsistent performance of the relevant learning activities.\n4.3\nSuitable assessment methods are identified and selected which\nare appropriate with the learning outcome of a module of\ninstruction.\n4.4\nAssessment instruments are prepared in accordance with the\ncontent and learning outcome specified under the assessment\ncriteria of a module of instruction.\n4.5\nAssessment instruments are checked for validity, fairness,\nsafety and cost effectiveness.\n5. Organize learning and\nteaching resources\n5.1\nResources required for training are checked for availability.\n5.2\nAppropriate training locations are identified and arranged\naccording to the training needs.\n5.3\nResource requirements are documented and access is\narranged in accordance with the organization, procedures and\nappropriate staff.\n\n--- PDF PAGE 58 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n54\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Target group\n1.1\nStudents\n1.2\nWorkers\n1.3\ncommunity members\n1.4\ntrainers\n2. Appropriate people\n2.1\nLGU\n2.2\nNGO\n2.3\nEnterprise\n2.4\nIndustry Organizations\n2.5\nPeople’s Organizations\n2.6\nTrade union\n2.7\nEmployer\n2.8\nGovernment agency\n3. Training delivery modes\nMay include but are not limited to the following:\n3.1\nDual training\n3.2\nOn- the-job / off- the- job training\n3.3\nDistance delivery\n3.4\nSelf-paced individualized delivery\n3.5\nCommunity training\n4. Training methods\nMay include but are not limited to the following:\n4.1\nOral presentations\n4.2\nSimulation activities\n4.3\nGroup work\n4.4\nDemonstration\n4.5\nLaboratory work\n4.6\nAssignments\n4.7\nComputer-based learning\n4.8\nGroup discussion\n4.9\nLecture\n5. Resources\n\n5.1\nStaff\n5.2\nFacilities\n5.3\nPlant equipment\n5.4\nTools, supplies and materials\n5.5\nAudio-visual materials (multi-media)\n5.6\nLearning aids (instructional materials)\n6. Session plan\nSession plan format may include:\n6.1\nSession objectives\n6.2\nSubject content\n6.3\nResources and materials\n6.4\nDelivery modes and assessment methods\n7. Instructional materials\nIncludes but is not limited to:\n7.1\nNon-print and Print-based materials\n7.2\nInformation / Operation / Job sheet\n7.3\nLearning guide\n7.4\nSelf check / Performance checklist\n7.5\nModel answer\n8. Trainee’s characteristics\nIncludes but is not limited to:\n8.1\nAge\n8.2\nGender\n8.3\nLearning style\n8.4\nReligion\n8.5\nCulture\n8.6\nEthnicity\n9. Evidence\n9.1\ndirect\n9.2\nindirect\n10. Training locations\n10.1\nTraining center\n10.2\nSchool\n10.3\nWorkplace\n10.4\nCommunity\n\n--- PDF PAGE 59 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n55\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the trainee:\n1.1\nIdentified and analysed relevant curriculum document.\n1.2\nIdentified current competencies of target group.\n1.3\nIdentified learners’ training requirements.\n1.4\nPrepared plan for a series of training sessions.\n1.5\nIdentified relevant delivery method, training activities and\ntraining delivery modes.\n1.6\nIdentified and organized resources required for the series of\ntraining sessions.\n1.7\nOrganized access to appropriate training location.\n2. Underpinning\nknowledge and attitude\n\n2.1\nCompetency standards and related curriculum\n2.2\nIdentification and correct usage of equipment, processes and\nprocedures relevant to the competencies being delivered\n2.3\nTraining delivery modes\n2.4\nTraining methods\n2.5\nTarget groups – identify and needs\n2.6\nRecognition of current competencies\n2.7\nOccupational health and safety relevant to the competencies\nbeing delivered.\n2.8\nCommunity development modes and training approaches.\n3. Underpinning Skills\n3.1\nTechnical writing skills required to document session plans\nand prepare basic instructional materials\n3.2\nStrategies for determining current competencies of learners\n3.3\nPlanning and organizational skills\n3.4\nSkills in operating personal computer\n\n4. Resource Implications\n\nThe following resources MUST be provided:\n4.1\nRelevant curriculum documents\n4.2\nWorkplace or simulated environment /Context\n5. Methods of\nAssessment\nCompetencies must be assessed by:\n5.1\nObservation/demonstration with oral questioning\n5.2\nWritten examination\n5.3\nPortfolio\n5.4\nThird party report\n\n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 60 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n56\nUNIT OF COMPETENCY\n:\nFACILITATE LEARNING SESSION\n\nUNIT CODE\n:"
