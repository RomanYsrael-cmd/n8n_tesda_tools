        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning Skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of written\nand electronic communication methods\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of Assessment\nCompetency may be assessed through:\n5.1\nDirect Observation\n5.2\nInterview\n6. Context for\nAssessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment\n\n--- PDF PAGE 8 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n4\nUNIT TITLE\n:\nAPPLY MATH AND SCIENCE PRINCIPLES IN TECHNICAL\nTRAINING\n\nUNIT CODE\n:"
        },
        "source_text": "500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nlead in the dissemination and discussion of ideas, information\nand issues in the workplace.\n\nContext of this unit\n:\nThis unit is adopted from the basic competencies for National Certificate\nLevel III. In the context of the Trainers Methodology (TM), the term\n“workplace” in this unit would be understood to mean “training/learning\nenvironment.”\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1\nAppropriate communication method is selected\n1.2\nMultiple operations involving several topics areas are\ncommunicated accordingly\n1.3\nQuestions are used to gain extra information\n1.4\nCorrect sources of information are identified\n1.5\nInformation is selected and organized correctly\n1.6\nVerbal and written reporting is undertaken when required\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1\nResponse to workplace issues are sought\n2.2\nResponse to workplace issues are provided immediately\n2.3\nConstructive contributions are made to workplace\ndiscussions on such issues as production, quality and safety\n2.4\nGoals/objectives and action plan undertaken in the\nworkplace are communicated\n\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1\nIssues and problems are identified as they arise\n3.2\nInformation regarding problems and issues are organized\ncoherently to ensure clear and effective communication\n3.3\nDialogue is initiated with appropriate personnel\n3.4\nCommunication problems and issues are raised as they\narise\n\n--- PDF PAGE 7 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3\nFace to face\n1.4\nTwo-way radio\n1.5\nSpeaking to groups\n1.6\nUsing telephone\n1.7\nWritten\n1.8\nInternet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning Skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of written\nand electronic communication methods\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of Assessment\nCompetency may be assessed through:\n5.1\nDirect Observation\n5.2\nInterview\n6. Context for\nAssessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment\n\n--- PDF PAGE 8 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n4\nUNIT TITLE\n:\nAPPLY MATH AND SCIENCE PRINCIPLES IN TECHNICAL\nTRAINING\n\nUNIT CODE\n:"
      },
