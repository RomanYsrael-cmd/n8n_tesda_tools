          "source_text": "1. Critical aspects of  \nCompetency   \nAssessment requires evidence that the candidate : \n1.1 \nPracticed inclusivity \n1.2 \nPromoted and respond to diversity \n1.3 \nDeveloped and implement work strategies to support \ninclusivity \n1.4 \nPromoted a culture of learning \n1.5 \nMonitored and improve work practices \n2. Underpinning \nknowledge and  \nattitude \n2.1 \nthe principles underpinning inclusivity and how to integrate \nthem into work practices \n2.2 \nthe diversity of clients, client needs, client backgrounds and \ndiffering expectations for vocational education and training \nservices \n2.3 \nethical and inclusive behaviors expected of professional \nrelationships with clients and colleagues \n2.4 \nsources of information to support inclusive practices \n2.5 \navailability and types of supports for clients with specific \nneeds \n2.6 \nrelevant policies, legal requirements, codes of practice on: \n2.6.1 \ndisability, discrimination, inclusiveness, human rights, \nequal opportunity, racial discrimination \n2.6.2 \nduty of care responsibilities \n2.6.3 \naccess and equity policies \n2.7 \norganizational work systems, practices \n2.8 \nOHS relating to the work role/work context, and   OHS \nconsiderations when fostering and promoting an inclusive \nlearning culture including: \n2.8.1 \ninternal policies and procedures to meet OHS \nrequirements \n2.8.2 \nhazards commonly found in the work environment \n2.9 \nduty of care of the training and trainer for the learner and \nothers who may be affected by actions of others within or \nattending the training  \n3. Underpinning skills \n3.1 \nlanguage and communication skills that: \n3.1.1 \nreflect inclusive language \n3.1.2 \naddress cross cultural communication, indirect \ncommunication, participation of others (family/ \ncommunity/elders), appropriate time and \ncommunication protocols \n3.1.3 \ninvolve consultation and liaison with clients, other \ncolleagues, counselors, experts and specialists on \nlearning concerns/issues\n\n--- PDF PAGE 38 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n34 \n \n \n3.1.4 reflect good practice in active listening, appropriate \neye contact, friendly tone, appropriate volume, clarity \nof diction and plain English \n3.1.5 encourage expression by all individuals \n3.1.6 involve a variety of mediums \n3.2 \nrecognizing and being sensitive to individual difference and \ndiversity, for example: \n3.2.1 being sensitive to and valuing culture \n3.2.2 acting without bias/discrimination \n3.2.3 responding to individuals with particular needs \n3.2.4 recognizing the importance of religion \n3.3 \nresearch skills to identify and increase knowledge of \nindividual differences and how these impact on individuals \n3.4 \nproblem solving skills to: \n3.4.1 \nidentify specific needs \n3.4.2 \nrespond appropriately to cultural diversity \n \n4. Resource Implication \n \nThe following resources MUST be provided: \n4.1 \naccess to relevant policies, legislation, guidelines and \nresources to support inclusivity \n4.2 \naccess to clients/colleagues \n4.3 \naccess to workplace environment  \n \n5. Method of assessment \nCompetency may be assessed through : \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nWritten Test \n5.4 \nThird Party Report \n \n6. Context for assessment\n \n6.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group",
