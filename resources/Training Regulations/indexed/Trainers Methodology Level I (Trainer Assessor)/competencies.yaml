          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nObserved workplace policies and guidelines\n1.2\nValued self-worth and profession\n1.3\nObserved proper conduct in dealing with learners and\nparents.\n2. Underpinning\nKnowledge\n2.1\nCode of ethics and right conduct\n2.2\nPersonnel management\n2.3\nFilipino customs and traits\n3. Underpinning Skills\n3.1\nInterpersonal skills\n3.2\nCommunication skills\n4. Resource Implications\nThe following MUST be provided:\n4.1\nCase study\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nWritten test/ Interview\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace /simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 24 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n20\nUNIT OF COMPETENCY\n:\nWORK EFFECTIVELY IN VOCATIONAL EDUCATION AND\nTRAINING\n\nUNIT CODE\n:"
