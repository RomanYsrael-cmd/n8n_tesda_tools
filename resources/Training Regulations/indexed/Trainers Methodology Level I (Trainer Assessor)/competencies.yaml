        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nPracticed inclusivity\n1.2\nPromoted and respond to diversity\n1.3\nDeveloped and implement work strategies to support\ninclusivity\n1.4\nPromoted a culture of learning\n1.5\nMonitored and improve work practices\n2. Underpinning\nknowledge and\nattitude\n2.1\nthe principles underpinning inclusivity and how to integrate\nthem into work practices\n2.2\nthe diversity of clients, client needs, client backgrounds and\ndiffering expectations for vocational education and training\nservices\n2.3\nethical and inclusive behaviors expected of professional\nrelationships with clients and colleagues\n2.4\nsources of information to support inclusive practices\n2.5\navailability and types of supports for clients with specific\nneeds\n2.6\nrelevant policies, legal requirements, codes of practice on:\n2.6.1\ndisability, discrimination, inclusiveness, human rights,\nequal opportunity, racial discrimination\n2.6.2\nduty of care responsibilities\n2.6.3\naccess and equity policies\n2.7\norganizational work systems, practices\n2.8\nOHS relating to the work role/work context, and OHS\nconsiderations when fostering and promoting an inclusive\nlearning culture including:\n2.8.1\ninternal policies and procedures to meet OHS\nrequirements\n2.8.2\nhazards commonly found in the work environment\n2.9\nduty of care of the training and trainer for the learner and\nothers who may be affected by actions of others within or\nattending the training\n3. Underpinning skills\n3.1\nlanguage and communication skills that:\n3.1.1\nreflect inclusive language\n3.1.2\naddress cross cultural communication, indirect\ncommunication, participation of others (family/\ncommunity/elders), appropriate time and\ncommunication protocols\n3.1.3\ninvolve consultation and liaison with clients, other\ncolleagues, counselors, experts and specialists on\nlearning concerns/issues\n\n--- PDF PAGE 38 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n34\n\n3.1.4 reflect good practice in active listening, appropriate\neye contact, friendly tone, appropriate volume, clarity\nof diction and plain English\n3.1.5 encourage expression by all individuals\n3.1.6 involve a variety of mediums\n3.2\nrecognizing and being sensitive to individual difference and\ndiversity, for example:\n3.2.1 being sensitive to and valuing culture\n3.2.2 acting without bias/discrimination\n3.2.3 responding to individuals with particular needs\n3.2.4 recognizing the importance of religion\n3.3\nresearch skills to identify and increase knowledge of\nindividual differences and how these impact on individuals\n3.4\nproblem solving skills to:\n3.4.1\nidentify specific needs\n3.4.2\nrespond appropriately to cultural diversity\n\n4. Resource Implication\n\nThe following resources MUST be provided:\n4.1\naccess to relevant policies, legislation, guidelines and\nresources to support inclusivity\n4.2\naccess to clients/colleagues\n4.3\naccess to workplace environment\n\n5. Method of assessment\nCompetency may be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n\n6. Context for assessment\n\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 39 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n35\nUNIT OF COMPETENCY\n:\nENSURE A HEALTHY AND SAFE LEARNING\nENVIRONMENT\n\nUNIT CODE\n:"
        },
        "source_text": "500232106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nfoster and promote an environment which supports inclusive\nwork practices and learning culture.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Practice inclusivity\n1.1\nIndividual differences and clients with particular needs\nare acknowledged, respected and valued in accordance with\nexisting work practices and learning culture.\n1.2\nPersonal perceptions and attitudes about difference are\nexamined and revised to improve communication and\nprofessionalism in accordance with existing work practices\nand learning culture.\n1.3\nPrinciples underpinning inclusivity are integrated into all\nwork practices.\n1.4\nThe training organization’s access and equity policy is used\nin accordance to work practices.\n1.5\nIndividuals' rights and confidentiality are respected at all\ntimes.\n2. Promote and respond\nto diversity\n2.1\nThe ground rules for participation and behavior with\ncolleagues and clients are established in accordance with a\ncooperative and agreed process/es.\n2.2\nIndividuals are encouraged to express themselves and to\ncontribute to the work and learning environment in\naccordance with cooperative and agreed process/es.\n2.3\nIndividuals are provided with opportunities to indicate\nspecific needs to support their participation in learning and\nwork in accordance with a cooperative and agreed\nprocess/es.\n2.4\nRelevant research, guidelines and resources are accessed\nto support inclusivity in accordance with existing guidelines\nand procedures.\n2.5\nVerbal and body language is sensitive to different cultures\nand backgrounds and differences in physical and intellectual\nabilities and as appropriate.\n3. Develop and implement\nwork strategies to\nsupport inclusivity\n3.1\nDocumented resources to support and guide inclusive\npractices are identified and used to inform work strategies in\naccordance with existing guidelines and procedures.\n3.2\nSupport persons are identified and included in the work and\nlearning process where appropriate and agreed to.\n3.3\nRelevant professional support services are identified and\naccessed, as appropriate.\n\n--- PDF PAGE 34 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n30\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n3.4\nAny physical environment support needs are\nacknowledge and incorporated into work practices, where\npracticable and approved by appropriate personnel.\n3.5\nOHS issues associated with inclusivity are identified and\naddressed in accordance with existing guidelines and\nprocedures.\n3.6\nInclusiveness is modeled in accordance with work\nperformance.\n4. Promote a culture of\nlearning\n4.1\nSupport and advice is provided to colleagues and clients to\nencourage new and ongoing participation in accordance with\nlearning opportunities.\n4.2\nThe benefits of learning are explored with colleagues and\nclients in accordance with a culture of learning.\n4.3\nLearning and competency achievement is recognized and\nrewarded in accordance with the work and/or learning\nenvironment.\n4.4\nOpportunities to develop own and others generic skills are\nidentified in accordance with the work and/or learning\nenvironment.\n4.5\nMultiple pathways to achieve own and others future learning\ngoals are discussed in accordance with the work and/or\nlearning environment.\n5. Monitor and improve\nwork practices\n5.1\nEffective work practices to enhance inclusivity and a learning\nculture are identified in accordance with the work and/or\nlearning environment\n5.2\nConscious actions are taken to modify and improve in\naccordance with work practices.\n5.3\nStrategies and policies to support inclusivity are regularly\nreviewed in accordance with continuous improvement of\nwork processes.\n5.4\nProposed changes to relevant strategies and policies are\ndocumented and reported in accordance with organizational\nstructure.\n\n--- PDF PAGE 35 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Individual differences\nMay include:\n1.1\nlearning difficulties\n1.2\nliteracy and numeracy needs\n1.3\nlanguage other than English (LOTE)\n1.4\ncultural background, images and perceptions\n1.5\nsocio-economic background\n1.6\nage, gender, sexuality\n1.7\nreligious practices\n1.8\nintellectual impairment or disability\n1.9\nmedical conditions such as arthritis, epilepsy, diabetes and\nasthma\n1.10 physical impairment or disability involving hearing vision,\nvoice or mobility\n1.11\npsychological or psychiatric impairment\n2. Clients with particular\nneeds\nMay include:\n2.1\nwomen where under-represented\n2.2\nrural and remote learners\n2.3\npeople with disabilities, either permanent or temporary\n2.4\npeople from non-English speaking backgrounds\n2.5\nyouth at risk\n3. Principles\nMay include:\n3.1\nsupporting equal opportunity for participation\n3.2\nfostering and advocating independence\n3.3\nensuring cooperative approaches to learning\n3.4\nusing client-centered approaches to learning\n3.5\nsupporting, encouraging and valuing individual contributions\n3.6\nmotivating learners\n3.7\ncreating opportunities for participation and success\n3.8\nmaking reasonable adjustments to procedures, activities and\nassessment for equity\n3.9\nacknowledging current strengths and skills as a basis for\nfurther learning\n4. Ground rules\nMay include:\n4.1\nguidelines of behavior and acceptance\n4.2\ncommon understandings between learners about group\ninteraction, respect and acceptance\n4.3\nexpectations of working relationships\n4.4\nsafety of learners and others\n4.5\ncomfort of learners and others\n4.6\nagreed consequences for breaching ground rules\n5. Specific needs\nMay include:\n5.1\nphysical environment adjustments\n5.2\nadjustments to learning and assessment activities\n5.3\nOHS issues to be addressed\n5.4\nlanguage requirements\n5.5\nliteracy and numeracy issues\n5.6\nmore time/additional support to learners\n5.7\nneed for a broad general education\n\n--- PDF PAGE 36 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n32\n\nVARIABLE\nRANGE\n6. Verbal and body\nlanguage\nMay refer to:\n6.1\nlanguage that recognizes and values individual differences\n6.2\nlanguage that supports inclusivity\n6.3\nlanguage that is non-discriminatory\n6.4\nlanguage that does not devalue, denote or derogate\n6.5\nlanguage that does not suggest fear, mistrust or lack of\nunderstanding\n6.6\nlanguage that does not label or suggest assumptions about\ncapabilities\n7. Documented resources May include:\n7.1\njournals\n7.2\ninformation technology resources such as the web, hardware\nand software\n7.3\ntexts and references\n8. Support persons\nMay include:\n8.1\nfamily members\n8.2\ngovernment officers in specialist support services\n8.3\ncase workers and personal careers\n8.4\nadvocates for a person or group\n8.5\npeer support\n8.6\ninterpreters\n8.7\ncommunity representatives\n8.8\nnote takers\n8.9\nlibrary personnel\n8.10 technical support\n8.11 human resources personnel\n8.12 administrative personnel\n8.13 career counselors\n8.14 student services officers\n8.15\nequity liaison officers\n9. Physical environment\nsupport needs\nMay include:\n9.1\nmodifications to layout of premises\n9.2\nequipment modifications\n9.3\nuse of adaptive technologies\n9.4\nchanges to work schedules\n9.5\nmodifications to job design\n10. OHS issues\nMay include:\n10.1 issues relating to the learner\n10.2\nissues relating to the OHS impact on others\n11. Generic skills\nMay include:\n11.1 Employability Skills including:\n11.1.1 communication\n11.1.2 teamwork\n11.1.3 problem solving\n11.1.4 initiative and enterprise\n11.1.5 planning and organizing\n11.1.6 self-management\n11.1.7 learning\n11.1.8 technology\n11.2 innovation\n11.3\nlanguage, literacy, numeracy and communication skills\n\n--- PDF PAGE 37 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n33\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nPracticed inclusivity\n1.2\nPromoted and respond to diversity\n1.3\nDeveloped and implement work strategies to support\ninclusivity\n1.4\nPromoted a culture of learning\n1.5\nMonitored and improve work practices\n2. Underpinning\nknowledge and\nattitude\n2.1\nthe principles underpinning inclusivity and how to integrate\nthem into work practices\n2.2\nthe diversity of clients, client needs, client backgrounds and\ndiffering expectations for vocational education and training\nservices\n2.3\nethical and inclusive behaviors expected of professional\nrelationships with clients and colleagues\n2.4\nsources of information to support inclusive practices\n2.5\navailability and types of supports for clients with specific\nneeds\n2.6\nrelevant policies, legal requirements, codes of practice on:\n2.6.1\ndisability, discrimination, inclusiveness, human rights,\nequal opportunity, racial discrimination\n2.6.2\nduty of care responsibilities\n2.6.3\naccess and equity policies\n2.7\norganizational work systems, practices\n2.8\nOHS relating to the work role/work context, and OHS\nconsiderations when fostering and promoting an inclusive\nlearning culture including:\n2.8.1\ninternal policies and procedures to meet OHS\nrequirements\n2.8.2\nhazards commonly found in the work environment\n2.9\nduty of care of the training and trainer for the learner and\nothers who may be affected by actions of others within or\nattending the training\n3. Underpinning skills\n3.1\nlanguage and communication skills that:\n3.1.1\nreflect inclusive language\n3.1.2\naddress cross cultural communication, indirect\ncommunication, participation of others (family/\ncommunity/elders), appropriate time and\ncommunication protocols\n3.1.3\ninvolve consultation and liaison with clients, other\ncolleagues, counselors, experts and specialists on\nlearning concerns/issues\n\n--- PDF PAGE 38 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n34\n\n3.1.4 reflect good practice in active listening, appropriate\neye contact, friendly tone, appropriate volume, clarity\nof diction and plain English\n3.1.5 encourage expression by all individuals\n3.1.6 involve a variety of mediums\n3.2\nrecognizing and being sensitive to individual difference and\ndiversity, for example:\n3.2.1 being sensitive to and valuing culture\n3.2.2 acting without bias/discrimination\n3.2.3 responding to individuals with particular needs\n3.2.4 recognizing the importance of religion\n3.3\nresearch skills to identify and increase knowledge of\nindividual differences and how these impact on individuals\n3.4\nproblem solving skills to:\n3.4.1\nidentify specific needs\n3.4.2\nrespond appropriately to cultural diversity\n\n4. Resource Implication\n\nThe following resources MUST be provided:\n4.1\naccess to relevant policies, legislation, guidelines and\nresources to support inclusivity\n4.2\naccess to clients/colleagues\n4.3\naccess to workplace environment\n\n5. Method of assessment\nCompetency may be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n\n6. Context for assessment\n\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 39 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n35\nUNIT OF COMPETENCY\n:\nENSURE A HEALTHY AND SAFE LEARNING\nENVIRONMENT\n\nUNIT CODE\n:"
