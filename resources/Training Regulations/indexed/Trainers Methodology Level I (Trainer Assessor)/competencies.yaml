          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of workplace practices and work\ninstructions.\n1.2\nDescribed relevant legislations, codes and national standard\nenvironmental practices according to the different\nenvironmental issues/concerns.\n1.3\nFollowed environmental workplace practices\n1.4\nContributed to improve environmental work practices\n1.5\nRecognized and reported on a potential environmental threat\n1.6\nMaintained environmental records\n2. Underpinning\nKnowledge\n2.1\nRelevant legislation from all levels of government on\nenvironmental issues\n2.2\nRelevant environmental policies and workplace/industry\npractices and procedures\n2.3\nGood practice approaches relevant to work area particularly\nin regard to minimizing environment hazards and risks, and\nimproving environmental performance\n2.4\nEnvironmental issues, especially in regard to water\ncatchments, air, noise, ecosystems, habitat, efficient use of\nresources, sustainability and waste minimization\n2.5\nPotential environmental threats and problems relevant to a\ngiven region and occupation\n2.6\nGeneral work place practices and their potential impact on the\nenvironment.\n3. Underpinning Skills\n3.1\nPerforming research and analysis\n3.2\nReading / interpreting data and information\n3.3\nProblem solving\n3.4\nCommunicate with supervisors and workplace colleagues\n3.5\nRecognize basic environmental hazards and threats\n3.6\nFollow workplace directions and instructions\n3.7\nKeep simple records.\n4. Resource Implications\n The following resources MUST be provided:\n4.1\nWorkplace/Assessment location\n4.2\nLegislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n4.3\nCase studies/scenarios relating to environmental protection\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1\nWritten/ Oral Examination\n5.2\nInterview/Third Party Reports\n5.3\nPortfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n5.4\nSimulations\n6. Context for Assessment\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 15 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n11\nUNIT OF COMPETENCY\n:\nUTILIZE IT APPLICATIONS IN TECHNICAL TRAINING\n\nUNIT CODE\n:"
        },
        "source_text": "500232102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\napply/adopt environmental principles and advocate conservation\nin diverse technical-vocational training environments, including\nobserving and contributing to positive environment work\npractices. This covers the following: environmental work\npractices, contributing to improvements of environmental\npractices, and reporting potential environmental threats.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow environmental\nworkplace practices\n1.1\nWorkplace practices and work instructions relating to\npotential environmental impacts are recognized and followed,\nand clarification is sought where necessary.\n1.2\nRelevant legislation, codes and national standards that\nimpact on workplace environmental practices are recognized\nand followed.\n1.3\nChanges to work practices and procedures are responded to\npositively and promptly in accordance with organizational\nrequirements.\n1.4\nIndividual roles/responsibilities are determined and performed\nbased on the program/ activities identified\n2. Contribute to improve\nenvironmental work\npractices\n\n2.1\nSuggestions are made to designated personnel for\nimprovements to workplace practices where possible.\n2.2\nInformation is gathered and improvements are suggested to\nsupport the development of improved workplace\napproaches to environmental practices.\n2.3\nEnvironmental issues and their relationship to workplace\npractices are discussed in the workplace with colleagues and\ndesignated personnel.\n2.4\nContributions to the review of environmental practices and\npolicies are made within limits of responsibility\n3. Recognize and report\npotential environmental\nthreats\n3.1\nSigns or symptoms of the potential environmental threat\nare recognized.\n3.2\nInformation about or observations of a potential\nenvironmental threat are reported to supervisors and/or\nappropriate authorities.\n3.3\nLocation and extent of the potential environmental threat is\naccurately recorded.\n3.4\nReports on the potential environmental threat are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 12 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n8\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Workplace practices\nand work instructions\nMay include but are not limited to procedures or work instructions\nfor:\n1.1\nEnvironmental l hazard identification and risk analysis\n1.2\nAvoiding or minimizing environmental risks,\n1.3\nImproving environmental performance,\n1.4\nWaste minimization and segregation,\n1.5\nEnvironmental monitoring,\n1.6\nSigns and labels (e.g., chemical labels),\n1.7\nEmergency procedures,\n1.8\nHazard and incident recording and reporting procedures\n1.9\nEnvironmental data recording and reporting procedures\nwhere applicable.\n1.10\nVerbal instructions from persons with responsibility related to\nenvironmental work practices.\n2. Legislation, codes and\nnational standards\nMay include:\n2.1\nPhilippine Clean-Air Act of 1999 (RA 8749)\n2.2\nPhilippine Clean-Water Act of 2004 (RA 9275)\n2.3\nEcological Solid Waste Management Act of 2000 (RA 9003)\n2.4\nMontreal Protocol\n2.5\nKyoto Protocol\n2.6\nEnvironmental Awareness and Education Act of 2008 (RA\n9512)\n2.7\nPhilippine Climate-Change Act of 2009 (RA 9729)\n2.8\nCodes of Practice relating to environment-critical jobs\n3. Suggestions\n\nMay include but are not limited to the ideas to:\n3.1\nMinimize hazards and risks,\n3.2\nReduce and dispose of waste,\n3.3\nEfficient use energy\n3.4\nConserve water\n3.5\nReduce air and noise pollution\n3.6\nMake more efficient use of resources and improve\nenvironmental performance,\n3.7\nReduce soil disturbance and improve habitat resources.\n4. Designated personnel\nMay include but are not limited to:\n4.1\nAdministrators/ Managers,\n4.2\nSupervisors\n4.3\nPeople who are responsible for work area or who may be\nassigned to act as a mentor/trainer to a person\n5. Workplace approaches\nto environmental\npractices.\nMay include but are not limited to:\n5.1\nPreventing and minimizing the production of pollution (e.g.,\ndischarges to air, land and water, hazardous waste,\n5.2\nReducing 'burning off',\n5.3\nComposting ,\n5.4\nRecycling materials,\n5.5\nConservation practices), and\n5.6\nImproving workplace maintenance practices (e.g., using a\nbroom instead of a hose, using environment-friendly cleaning\nagents)\n\n--- PDF PAGE 13 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n9\n\nVARIABLE\nR A N G E\n6. Environmental issues\nMay include:\n6.1\nSustainability,\n6.2\nReduction and disposal of waste,\n6.3\nWater quality,\n6.4\nEnergy efficiency,\n6.5\nBiodiversity and habitat protection,\n6.6\nConservation of natural resources,\n6.7\nAir quality,\n6.8\nLand contamination,\n6.9\nNoise,\n6.10 Soil and salinity management\n6.11 Fire management.\n7. Environmental practices\nand policies\nMay include:\n7.1\nWaste minimization and management,\n7.2\nSustainability ,\n7.3\nLocal, regional, state and national strategies on weed and\npest management,\n7.4\nProtection of land and habitat and conservation of resources,\n7.5\nEnergy use,\n7.6\nGreenhouse gas emissions,\n7.7\nUse of chemicals and plant and equipment.\n8. Signs or symptoms\nMay include but are not limited to:\n8.1\nObservation of the presence of weeds,\n8.2\nPest animals or chemicals;\n8.3\nDamage caused to plants, animals or the environment,\n8.4\nChanges in plant (e.g., dieback of trees) and animal health,\n8.5\nErosion of soils,\n8.6\nSoils in water suspension,\n8.7\nPresence of salt.\n9. Potential environmental\nthreat\nMay include but are not limited to:\n9.1\nThis includes spills , leaks, pollution ,planned and unplanned\nemissions, soil compaction, disturbance and erosion,\n9.2\nAccidents and disposal of waste, and damage or disruption to\necosystems resulting from work practices.\n9.3\nAlso includes plants, animals or diseases that are classified\nas an environmental threat or problem in an area,\n9.4\nUnauthorized changes in land use\n9.5\nFire risks and threats, and inappropriate human interaction\non the environment.\n9.6\nThis may include damage to habitat resources, disruption of\nanimal behavior and territorial use, illegal vegetation\nclearance, seed collection, firewood gathering, nest\ndisturbance and egg collecting.\n10.Reported\nIncludes how the reports are made:\n10.1 Verbally (face-to-face or through communication equipment)\n10.2 In writing (memo, notes, faxes, email or electronic\nmessages).\n11.Recorded\n11.1\nEnvironmental data,\n11.2 Maintenance and inspection reports,\n11.3 Incident or accident reports,\n11.4 Complaints from the public.\n\n--- PDF PAGE 14 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of workplace practices and work\ninstructions.\n1.2\nDescribed relevant legislations, codes and national standard\nenvironmental practices according to the different\nenvironmental issues/concerns.\n1.3\nFollowed environmental workplace practices\n1.4\nContributed to improve environmental work practices\n1.5\nRecognized and reported on a potential environmental threat\n1.6\nMaintained environmental records\n2. Underpinning\nKnowledge\n2.1\nRelevant legislation from all levels of government on\nenvironmental issues\n2.2\nRelevant environmental policies and workplace/industry\npractices and procedures\n2.3\nGood practice approaches relevant to work area particularly\nin regard to minimizing environment hazards and risks, and\nimproving environmental performance\n2.4\nEnvironmental issues, especially in regard to water\ncatchments, air, noise, ecosystems, habitat, efficient use of\nresources, sustainability and waste minimization\n2.5\nPotential environmental threats and problems relevant to a\ngiven region and occupation\n2.6\nGeneral work place practices and their potential impact on the\nenvironment.\n3. Underpinning Skills\n3.1\nPerforming research and analysis\n3.2\nReading / interpreting data and information\n3.3\nProblem solving\n3.4\nCommunicate with supervisors and workplace colleagues\n3.5\nRecognize basic environmental hazards and threats\n3.6\nFollow workplace directions and instructions\n3.7\nKeep simple records.\n4. Resource Implications\n The following resources MUST be provided:\n4.1\nWorkplace/Assessment location\n4.2\nLegislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n4.3\nCase studies/scenarios relating to environmental protection\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1\nWritten/ Oral Examination\n5.2\nInterview/Third Party Reports\n5.3\nPortfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n5.4\nSimulations\n6. Context for Assessment\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 15 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n11\nUNIT OF COMPETENCY\n:\nUTILIZE IT APPLICATIONS IN TECHNICAL TRAINING\n\nUNIT CODE\n:"
