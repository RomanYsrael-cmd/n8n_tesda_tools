        "source_text": "TVT232305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and attitude in maintaining training\nfacilities, includes implementing housekeeping activities and\nmaintaining training systems, equipment, tools, materials and\ndocuments.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan maintenance\nactivities\n1.1\nTraining facilities and equipment are identified.\n1.2\nRequisition for instructional equipment, tools, supplies and\nmaterials are prepared according to established procedures.\n1.3\nTraining equipment, tools, materials/supply inventory is\nprepared\n1.4\nEquipment, tools, supplies and materials option are\nthoroughly researched and ergonomic requirements are\nconsidered.\n1.5\nEquipment, tools, supplies and materials are identified and\njustified.\n1.6\nEquipment and systems impact on learners are accurately\ndocumented according to procedures\n1.7\nMaintenance activities are established according to\npolicies\n2. Prepare schedule of\nmaintenance\n2.1\nAreas /equipment to be maintained are identified\n2.2\nMaintenance activities, resources and schedule are\nidentified and prepared according to job requirements.\n2.3\nTechnical support services are identified as necessary\n3. Implement\nhousekeeping activities\n\n3.1\nRegular inspections are carried out in the work area\naccording to workplace procedures and standards.\n3.2\nFacilities are maintained in accordance with Occupational\nHealth and Safety.\n3.3\nDisposal of waste and dangerous chemicals are checked in\naccordance with Occupational Health and Safety, regulations\nand organizational policies and other regulations\n3.4\nInstructional materials and /equipment are secured in safe\nplaces in accordance with procedures.\n4. Maintain training\nequipment and tools\n4.1\nExecute regular maintenance activities and routine\nservicing/repair according to scheduled plan.\n4.2\nMaintenance procedures are followed in accordance with the\nmanufacturers manual and organization policies.\n4.3\nRespond to failed or unsafe equipment in accordance with\norganizational policies & procedures.\n4.4\nEquipment and tools are secured according to safety\nstandards\n4.5\nComplex faults or repair requirements outside area of\nresponsibility or competence are reported for specialist\nassistance in accordance with organizational procedures.\n4.6\nMaintenance activities are documented and reported\naccording to procedures\n5. Document\nmaintenance\ninspections\n5.1\nRegular inspections are carried out in the work area\naccording to workplace procedures and standards\n5.2\nMaintenance and repair activities are documented and\nreported according to organizational policies\n5.3\nDocuments are kept according to procedure\n\n--- PDF PAGE 71 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n67\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Facilities\n\nIncludes but not limited to:\n1.1\nElectrical system\n1.2\nVentilation system\n1.3\nWater system\n1.4\nWorkshops\n1.5\nFixtures\n1.6\nInfrastructure\n1.7\nLaboratory\n1.8\nWorkstations\n2. Equipment\nIncludes but not limited to:\n2.1\nlarge items of equipment\n2.2\nsmall items of equipment\n2.3\nsimple equipment\n2.4\ncomplex equipment\n2.5\nequipment with significant health and safety implications\n3. Maintenance activities\n\nIncludes but not limited to:\n3.1\nInspections of facilities and equipment\n3.2\nCleaning and lubricating of tools and equipment\n3.3\nTagging of defective tools and equipment\n3.4\nDisinfecting tools and equipment\n3.5\nRepairs\n4. Resources and\nschedule\n4.1\nManpower\n4.2\nFinancial\n4.3\nManufacturer’s manual\n4.4\nMaintenance guide\n4.5\nSupplies and materials\n4.6\nTools and equipment\n4.7\nOutsourcing services\n5. Organization policies\n\nIncludes but not limited to:\n5.1\nWarranty Agreement\n5.2\nWaste Management Scheme\n5.3\nDocumentation\n5.4\n5S Procedures\n5.5\nInventory of tools and equipment\n6. Documents\nIncludes but not limited to:\n6.1\nmaintenance plans\n6.2\nscheduling documents\n6.3\nbudgets\n6.4\nrequisitions\n6.5\ninventory reports\n6.6\nreports\n6.7\nsubmissions\n\n--- PDF PAGE 72 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n68\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPlanned and scheduled maintenance activities.\n1.2\nDetermined areas and facilities are cleaned and maintained\nin accordance with OHS and 5S procedure.\n1.3\nIdentified regular maintenance activities routine\nservicing/repair are scheduled.\n1.4\nSelected procedures are followed in accordance with the\nmanufacturers manual and organizational policies\n1.5\nIdentified repair activities are performed, documented /\nreported according to organizational policies\n1.6\nChecked the disposal of waste and dangerous chemicals\n2. Underpinning\nKnowledge\n2.1\nSafety Practices\n2.1.1\nPlanning and scheduling\n2.1.2\nProblem identification\n2.1.3\nWaste Management\n2.1.4\nKnowledge in 5’s\n2.2\nMaterials and Tools: Uses and specifications\n2.2.1\nTypes/classification and proper dosage of chemicals\n2.2.2\nmaterial, consumable and labor costs\n2.2.3\ntypes of tools and equipment and procedures for their\nsafe use, operation and maintenance\n2.2.4\nManufacturers specification\n2.3\nProcesses\n2.3.1\nCommunication protocol\n2.3.2\nPreventive maintenance\n2.3.3\nCorrective maintenance\n2.3.4\nmaterial, consumable and labor costs\n2.3.5\nmaintenance procedures and methodologies\n2.3.6\nenterprise work schedules\n2.3.7\nprocedures for the recording, reporting and\nmaintenance of workplace records and information\n2.4\nLegislation\n2.4.1\nKnowledge about OH & S Organization policies\n2.4.2\nenvironmental protection requirements\n2.4.3\nRA 9003-Solid waste management\n3. Underpinning Skills\n\n3.1\nplanning and Scheduling of Activity\n3.2\nInspections activity\n3.3\nuse and maintain relevant tools, machinery and equipment\n3.4\nidentify problems and equipment faults and demonstrate\nappropriate response procedures\n3.5\nprioritize maintenance works\n3.6\ninterpret of inspection data\n3.7\ncalculate of maintenance works resource quantities and\nproject costs\n3.8\nHousekeeping\n3.9\nTroubleshooting technique\n3.10\nPreparation of Reports\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to learning environment\n4.2\nAccess to appropriate tools and equipment and materials\n4.3\nAccess to other resources\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace / simulated area\n/ TESDA Assessment Center\n\n--- PDF PAGE 73 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n69\nUNIT OF COMPETENCY\n:\nUTILIZE ELECTRONIC MEDIA IN FACILITATING TRAINING\n\nUNIT CODE\n:"
