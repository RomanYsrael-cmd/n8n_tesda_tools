        "evidence_guide": {
          "source_text": "1. Critical aspects of  \nCompetency   \nAssessment requires evidence that the candidate : \n1.1 \nIdentified OHS responsibilities \n1.2 \nIdentified hazards in the learning environment \n1.3 \nAssessed risks in the learning environment \n1.4 \nDeveloped and implement actions to ensure the health \nsafety and welfare of learners and/or candidates \n1.5 \nProvided appropriate OHS requirements to learners and/or \ncandidates \n1.6 \nMonitored OHS arrangements in the learning environment \n2. Underpinning \nknowledge and  attitude\n2.1 \nrelevant policies, legal requirements, codes of practice and \nnational, for example: \n2.1.1 \nlegislative requirements for information and \nconsultation relevant to safety \n2.1.2 \nlegislative requirements for record keeping related to \nOHS \n2.1.3 \nlegislative requirements for safe workplaces \n2.2 \nOHS roles and responsibilities of employers, the training/ \ntrainers/facilitators, learners and/or candidates, managers \nand supervisors \n2.3 \nduty of care obligations for training and/or trainers/facilitators \n2.4 \nhazards and risks in the specific industry where learning will \ntake place \n2.5 \ncommon risk control strategies applicable to the industry \nwhere learning and/or will take place \n2.6 \nbasics of a systematic approach to OHS \n2.7 \nsources of information on OHS requirements relevant to the \nspecific industry where learning will take place \n2.8 \norganizational OHS documentation including policies, \nprocedures and risk control strategies \n2.9 \nhierarchy of control as it applies to risks encountered in the \nlearning environment \n2.10 knowledge of the learning environment sufficient to be able \nto identify hazards and conduct simple risk assessment \n3. Underpinning skills \n3.1 \nliteracy skills to: \n3.1.1 \naccess a range of sources of OHS information \n3.1.2 \nread and understand OHS documentation \n3.1.3 \ninterpret OHS legal requirements \n3.1.4 \nwrite hazard and incident reports \n3.1.5 \ncontribute to the development of a risk control action \nplan (if required)\n\n--- PDF PAGE 44 ---\nTRAINERS METHODOLOGY LEVEL I \nRe-titled   May 2011 \n40 \n \n \n3.2 \nlanguage skills to: \n3.2.1 communicate and consult with a range of people from \ndifferent levels and backgrounds \n3.2.2 listen and summarize key points, make evaluative \njudgments and articulate verbally \n3.3 \ntechnology skills to: \n3.3.1 \nuse computer hardware and relevant software \n3.3.2 \nuse office/business equipment \n3.4 \nresearch skills to access relevant OHS information \n3.5 \nnegotiation skills \n4. Resource Implication \n \nThe following resources MUST be provided: \n4.1 \naccess to resources and equipment to establish and \nmaintain the safety, health and welfare of the learner and/or \ncandidate \n4.2 \naccess to legislative and training organization documentation \non OHS \n5. Method of assessment \nCompetency may be assessed through : \n5.1 \nDemonstration with questioning \n5.2 \nCase Study/Situation \n5.3 \nInterview \n5.4 \nPortfolio Assessment \n6. Context for assessment\n \n6.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group",
