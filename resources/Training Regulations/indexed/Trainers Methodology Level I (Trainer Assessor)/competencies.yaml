y must be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n6. Context for\nassessment\n\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 51 ---\nTRAINERS METHODOLOGY LEVEL I\nRe-titled May 2011\n47\nUNIT TITLE\n:\nDEVELOP AND PROMOTE APPRECIATION FOR COSTS AND\nBENEFITS OF TECHNICAL TRAINING\n\nUNIT CODE\n:"
