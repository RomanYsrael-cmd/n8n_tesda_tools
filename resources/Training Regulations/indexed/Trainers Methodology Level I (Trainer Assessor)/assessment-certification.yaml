onal education and training Foster and promote a learning culture Ensure healthy and safe learning environment Maintain and enhance professional practice Develop and promote appreciation for cost- benefits of technical training Develop and promote global understanding of labor markets --- PDF PAGE 86 --- Re-titled May 2011 82 1. Trainer a person who enables a learner or group of learners to develop or acquire competencies toward performing a particular trade or technical work 2. Assessor an accredited individual authorized to evaluate or assess competencies of a candidate or person applying for certification 3. Qualification a cluster of units of competency that meets job roles and is significant in the workplace. It is also a certification awarded to a person on successful completion of a course and/or in recognition of having demonstrated competencies relevant to an industry 4. Competency assessment the process of collecting evidence and making judgments on whether competency has been achieved 5. Competency standard a description of competency formed by the knowledge, abilities, skills, comprehension and attitudes required for acceptable performance of a productive function and established as a reference or requirement for a qualification. Competency standards are made up of units of competency, which are themselves made up of elements of competency, together with performance criteria, a range of variables, and an evidence guide 6. Unit of competency a component of a competency standard. A unit of competency is a statement of a key function or role in a particular job or occupation --- PDF PAGE 87 --- The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. 1) Mr. FELIPE T. TORRES Consultant Gokongwei Brothers Foundation Learning and Devel