    {
      "term": "Unit of competency",
      "definition": "Competency standard a description of competency formed by the knowledge, abilities, skills, comprehension and attitudes required for acceptable performance of a productive function and established as a reference or requirement for a qualification. Competency standards are made up of units of competency, which are themselves made up of elements of competency, together with performance criteria, a range of variables, and an evidence guide"
