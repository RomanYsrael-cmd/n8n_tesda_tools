  "source_text": "1.\nTrainer\na person who enables a learner or group of learners to develop\nor acquire competencies toward performing a particular trade or\ntechnical work\n2.\nAssessor\nan accredited individual authorized to evaluate or assess\ncompetencies of a candidate or person applying for certification\n\n3.\nQualification\na cluster of units of competency that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a\nperson on successful completion of a course and/or in\nrecognition of having demonstrated competencies relevant to an\nindustry\n4.\nCompetency\nassessment\nthe process of collecting evidence and making judgments on\nwhether competency has been achieved\n\n5.\nCompetency standard\na description of competency formed by the knowledge, abilities,\nskills, comprehension and attitudes required for acceptable\nperformance of a productive function and established as a\nreference or requirement for a qualification. Competency\nstandards are made up of units of competency, which are\nthemselves made up of elements of competency, together with\nperformance criteria, a range of variables, and an evidence\nguide\n6.\nUnit of competency\na component of a competency standard. A unit of competency is\na statement of a key function or role in a particular job or\noccupation\n\n--- PDF PAGE 87 ---\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the representatives of business, industry, academe and government\nagencies who donated their time and expertise to the development and validation of these\nTraining Regulations.\n\nTHE TECHNICAL WORKING GROUP\n\n1)\nMr. FELIPE T. TORRES\n\nConsultant\n\nGokongwei Brothers Foundation Learning and Development Center\n\n2)\nMr. ARTHUR LUIS P. FLORENTIN, FPM\n\nPeople Management Association of the Philippines (PMAP)\n\nPhilippine Society for Training and Development (PSTD)\n\n3)\nMs. MARJORIE G. MENDENILLA\n\nExecutive Director\n\nTEVSAPHIL\n\n4)\nMr. FREDELITO N. SUAREZ\n\nAssociate Director, Academic Services\n\nMMLDC Foundation, Inc.\n\n5)\nMr. RODOLFO C. MENGUITA\n\nTraining Director/HRD Manager\n\nD. M. Consunji, Inc.\n\n6)\nMr. VLADIMIR H. SANTOS\n\nMFI Foundation, Inc.\n\n7)\nMs. MILAGROS O. HERNANDEZ\n\nPhilippine Society for Training and Development\n\nMembers of the TESDA Board\n\nThe TESDA Board Standards-Setting and Systems Development Committee\n\nThe Management and Staff of the TESDA Secretariat\nQualifications and Standards Office (QSO)\nCompetency Assessment and Certification Office (CACO)\n\n--- PDF PAGE 88 ---",
