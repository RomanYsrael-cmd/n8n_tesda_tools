          "source_text": "1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate\n1.1 Performed inspection of machine\n1.2 Performed cleaning and lubricating of machine\n1.3 Performed machine repairs and adjustments\n1.4 Documented work done\n2. Underpinning\nknowledge\n2.1 Proper cleaning and oiling\n2.2 Kinds of oil\n2.3 Parts and function of machine tools\n2.4 Cutting oil, coolant or compound\n2.5 Pulleys and belts\n2.6 Handling and storage of tools\n2.7 Checklist of safe working conditions\n2.8 Procedures in cleaning and disposal of waste\n materials\n2,09 Conventional and CNC Machine tools\n2.10 5s (housekeeping)\n2.11 Quality and safety procedures\n3. Underpinning skills\n3.1 Inspecting and repairing hand tools\n3.2 Inspecting and changing drive pulleys and belts\n3.3 Replacing and adjusting machine parts\n3.4 Distinguishing old and new coolant\n3.5 Distinguishing polluted coolant\n3.6 Selecting coolant, cutting oil or compounds\n3.7 Changing coolant\n3.8 Inspecting work area for safe working environment\n3.9 Cleaning work area\n3.10 Disposing metal scraps, chips and waste\n materials.\n3.11 Operation of conventional and CNC machines\n3.12 Communication skills\n3.13 Observing safety precautions\n4. Resource Implications\nThe following resources should be provided\n4.1 Tools, equipment and facilities appropriate to processes\nor activity\n4.2 Materials relevant to the proposed activity\n5. Method of Assessment\nThe following assessment methods are suggested:\n5.1 Direct observation of activities\n5.2 Oral or written questioning\n5.3 Practical demonstration\n5.4 Third party report\n5.5 Portfolio assessment\n6. Context for Assessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 31 ---\nTR – CNC Milling Machine Operation NC II\n29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nWrite Basic CNC Milling Machine Program\n\nUNIT CODE\n\n:"
