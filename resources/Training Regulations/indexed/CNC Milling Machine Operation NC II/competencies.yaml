        "source_text": "MEE722211\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nperforming preventive and repair/corrective maintenance\nsuch as inspection and repair of hand tools, machine parts,\ncleaning and lubrication and changing drive pulley and belts.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform inspection of\nmachine\n\n1.1\n\n1.2\n\n1.3\n\nMachine inspected according to worksite\nprocedures.\nStatus report is recorded on maintenance record\nsheets or reported orally according to worksite\nprocedure.\nUnusual /abnormal machine conditions are\nreported or responded to in accordance with\nworksite procedures\n2.\nPerform cleaning and\nlubricating of machine\n\n2.1\n\n2.2\n\n2.3\nMachines are lubricated as per manufacturer’s\nrecommendation using appropriate\nlubricant/materials\nFluids and lubricants replaced and/or filled up\naccording to prescribed schedule.\nCleaning and lubrication performed is recorded and\nreported in accordance with worksite procedures.\n3.\nPerform machine repair\nand adjustments\n\n3.1\n\n3.2\n\n3.3\n\nMachine repairs performed according to\nmanufacturer’s instruction or worksite procedures.\nMachine moving parts adjusted to manufacturer’s\nspecifications.\nRepairs and adjustments performed are recorded\nand reported in accordance with worksite\nprocedures.\n4.\nMaintain hand and\ncutting tools\n4.1\n\n4.2\n\n4.3\nCutting tools are ground to recommended\nspecifications\nHand tools lubricated and stored according to\nprescribed procedure\nWhere necessary tool replacements are made in\naccordance with job requirements.\n\n--- PDF PAGE 29 ---\nTR – CNC Milling Machine Operation NC II\n27\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1 V-belt\n1.2 Bearing\n1.3 Gears\n1.4 Clutch\n1.5 Drive pulley\n1.6 Control panel\n1.7 Machine guard\n2. Machines\nMachine includes but not limited to:\n2.1 CNC Lathe machine\n2.2 CNC Milling machine\n2.3 Grinding machine\n2.4 Conventional machine tools\n3. Tools and materials\n\nTools and materials used include:\n3.1 Lubricants\n3.2 Oil can\n3.3 Grease gun\n3.4 Oil\n3.5 Coolant or compound\n4. Machine maintenance and\nrepairs\n4.1 Machine repairs may include the following:\n 4.1.1 Replacement of defective parts such as\n Gears, belts, pulleys, screws, bearings, pins\n lead screw, batteries\n4.1.2 Adjustment/calibration of machines such\nbelt tensions, bolts and nuts, digital read-out\n5. Machine moving/rotating\nparts\n5.1 May include:\n 5.1.1 Carriage\n 5.1.2 Gears\n 5.1.3 Pulley\n 5.1.4 Belts\n\n6. Unusual /abnormal machine\nconditions\n6.1 May include:\n 6.1.1 Unusual sound/ noisy\n Motor, Machine\n 6.1.2 Excessive vibration\n 6.1.3 Unusual smell\n 6.1.4 Excessive backlash\n 6.1.5 Misalignment\n\n--- PDF PAGE 30 ---\nTR – CNC Milling Machine Operation NC II\n28\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate\n1.1 Performed inspection of machine\n1.2 Performed cleaning and lubricating of machine\n1.3 Performed machine repairs and adjustments\n1.4 Documented work done\n2. Underpinning\nknowledge\n2.1 Proper cleaning and oiling\n2.2 Kinds of oil\n2.3 Parts and function of machine tools\n2.4 Cutting oil, coolant or compound\n2.5 Pulleys and belts\n2.6 Handling and storage of tools\n2.7 Checklist of safe working conditions\n2.8 Procedures in cleaning and disposal of waste\n materials\n2,09 Conventional and CNC Machine tools\n2.10 5s (housekeeping)\n2.11 Quality and safety procedures\n3. Underpinning skills\n3.1 Inspecting and repairing hand tools\n3.2 Inspecting and changing drive pulleys and belts\n3.3 Replacing and adjusting machine parts\n3.4 Distinguishing old and new coolant\n3.5 Distinguishing polluted coolant\n3.6 Selecting coolant, cutting oil or compounds\n3.7 Changing coolant\n3.8 Inspecting work area for safe working environment\n3.9 Cleaning work area\n3.10 Disposing metal scraps, chips and waste\n materials.\n3.11 Operation of conventional and CNC machines\n3.12 Communication skills\n3.13 Observing safety precautions\n4. Resource Implications\nThe following resources should be provided\n4.1 Tools, equipment and facilities appropriate to processes\nor activity\n4.2 Materials relevant to the proposed activity\n5. Method of Assessment\nThe following assessment methods are suggested:\n5.1 Direct observation of activities\n5.2 Oral or written questioning\n5.3 Practical demonstration\n5.4 Third party report\n5.5 Portfolio assessment\n6. Context for Assessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 31 ---\nTR – CNC Milling Machine Operation NC II\n29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nWrite Basic CNC Milling Machine Program\n\nUNIT CODE\n\n:"
