  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for CNC MILLING MACHINE OPERATION NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: CNC MILLING MACHINE OPERATION NC Level: NC II\n\nTraining Duration: 18 Hours (Basic)\n\n138 Hours (Common)\n\n80 Hours (Core)\n 236 Hours\n\nCourse Description:\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nin CNC Milling Machine Operation NC II.\nIt covers the competencies required to write basic CNC milling program, set-up\nmachine, workpiece and cutting tools and perform basic CNC milling machine\noperations.\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion.\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\n team role and\n responsibility in a team.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\n objectives with\n organizational goals.\n3.2 Set and meet work\n priorities.\n3.3 Maintain professional\n growth and\n development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 42 ---\nTR – CNC Milling Machine Operation NC II\n40\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\n risks\n4.2 Control hazards and\n risks\n4.3 Maintain occupational\n health and safety\n awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\nworking\ndrawings and\nsketches\n1.1 Interpret technical\ndrawing\n1.2 Prepare freehand\nsketch of parts\n1.3 Interpret details from\nfreehand sketch\n• Lecture\n• Group\nDiscussion/\ninteraction\n\n• Observation\n• Interview\n• Interview/\nQuestioning\n2. Select and cut\n workshop\n materials\n2.1 Determine requirements\n2.2 Select and measure\nmaterials\n2.3 Cut materials\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n3. Perform shop\n computations\n (Basic)\n3.1 Perform four\nfundamental operations\n3.2 Perform basic\ncalculations involving\nfractions and decimals\n3.3 Perform basic\ncalculations involving\npercentages\n3.4 Perform basic\ncalculation involving\nratio and proportion\n3.5 Perform calculations on\nalgebraic expressions\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n4. Measure\nworkpiece\n (Basic)\n4.1 Select and use\nmeasuring instruments\n4.2 Clean and store\nmeasuring\ninstruments\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n--- PDF PAGE 43 ---\nTR – CNC Milling Machine Operation NC II\n41\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Perform shop\ncomputations\n(Intermediate)\n5.1 Perform calculations\ninvolving triangles\n5.2 Calculate taper\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n6. Measure\nworkpiece\nusing\nangular\nmeasuring\ninstruments\n6.1 Select and use angular\nmeasuring tools.\n6.2 Maintain angular\nmeasuring tools\n6.3 Clean and store\nmeasuring tools\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n7. Perform\npreventive\nand corrective\n maintenance\n7.1 Perform inspection of\nmachine\n7.2 Perform cleaning and\nlubricating of machine\n7.3 Perform minor machine\nrepair and adjustments\n7.4 Maintain hand tools\n• Lecture\n• Demonstration\n• Group\ndiscussion\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Write basic CNC\nmilling program\n1.1 Determine job\n requirements\n1.2 Write basic CNC Milling\n machine program\n1.3 Edit basic CNC Milling\n machine programs\n• Lecture\n• Group\nDiscussion/\ninteraction\n\n• Observation\n• Interview\n• Interview/\nQuestioning\n2. Set-up CNC\nmilling machine,\nworkpiece and\ncutting tools\n2.1 St-up machine and\n cutting tools\n2.2 Downoad program\n2.3 Set-up workpiece\n2.4 Dry-run workpiece\n2.5 Perform trial cut on\nworkpiece\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n3 Perform basic\nCNC milling\nmachine\noperations\n\n3.1 Mill workpiece\n3.2 Check and measure\nworkpiece\n\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n--- PDF PAGE 44 ---\nTR – CNC Milling Machine Operation NC II\n42\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 45 ---\nTR – CNC Milling Machine Operation NC II\n43\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and their educational\nattainment. Other requirements like health and physical requirements are also\nstated. Passing entry written entrance examinations may also be indicated if\nnecessary.\n\n•\nMust be high school graduate\n•\nWith good moral character;\n•\nAble to communicate in writing\n•\nPhysically and mentally fit ; and\n•\nMust have knowledge and skills in conventional milling machine operation\nand basic computer operation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nCNC MILLING MACHINE OPERATION NC II\n\nRecommended list of tools, equipment and materials for the training of 16\ntrainees for CNC Milling Machine Operation NC II\n\nEQUIPMENT\nQTY\nDescription\nQTY\nDescription\n8 units\n3-axis CNC Milling Machine with\ncomplete standard accessories\n1 unit\nOHP/LCD Projector\n1 unit\nPower Hack saw\n\nSUPPLIES AND MATERIALS\nQTY\nDescription\nQTY\nDescription\n2 pcs.\nAluminum bar 50x50mm x 5m,\nT6\n2 pcs.\nAluminum bar 50 x100mm x 5m,\nT6\n1 pc.\nAluminum Flat bar 60 x 100mm x\n5m, T6\n10 kgs.\nRags\n16 pcs.\n256 mb flash drive\n3 boxes\nWhiteboard marker Black, Blue\nand red color\n16 pcs.\nPaint brush 50 mm width\n\nTRAINING MATERIALS\nQTY\nDescription\nQTY\nDescription\n8 pcs.\nTeachers Guide\n6 pcs.\nManuals\n16 pcs.\nCNC simulation software\nReference books\nCatalogs\nBrochures\nModules/ LEs\nCDs/ Video tapes\nHandouts\n\n--- PDF PAGE 46 ---\nTR – CNC Milling Machine Operation NC II\n44\n\nTOOLS\n\nTRAINING MATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDESCRIPTION\n8 pcs.\nStaggered tooth\nside cutter dia.\n36mm x 5mm\n32\npcs .\nEnd Mill 4, 6, 8, 10,\n12, 16 mm dia\n8 pcs.\nFace Mill, 16 x 20 x\n40mm dia.\n3 sets\nHand Tap M6, M8,\nM10, M12\n8 pcs.\nNC start drill 10mm\ndia.\n6\nboxes\nDrill bit dia.1mm-\n13mm set\n8 pcs.\neach\nMachine tap M3-M6,\nM8, M10 set\n16\npcs.\nCenter drill # 2\n8 pcs.\nSlot cutter dia. 16\nmm\n8 sets\nEngraving Tool\n8 pcs.\nEdge finder\n8 sets\nNeedle File\n8 pcs.\nFlat File, 2nd cut,\n150 mm\n8 pcs.\nRubber mallet\n1 set\nLetter punch\n2 pcs.\nBall peen hammer,\n0.5 kgs\n\nMEASURING INSTRUMENTS\nQTY\nDescription\n\n8 pcs.\nVernier caliper\n(Digital) 150mm\n8 pcs.\nMicrometer (Digital)\n0- 25 mm\n8\npcs.\nDial indicator with\nmagnetic stand,\nlever-type, 0.01\nleast count\n1 pc.\nBevel protractor\n1 pc.\nThread pitch gage\n1\nset\nGage block\n(optional)\n1 pc.\nVernier height gage\nwith dial indicator\n(optional)\n\n--- PDF PAGE 47 ---\nTR – CNC Milling Machine Operation NC II\n45\n3.5 TRAINING FACILITIES\nCNC LATHE MACHINE OPERATION NC II\n\nThe CNC Machining workshop must be of concrete structure for 16 trainees. The\nspace requirements for the teaching/learning and circulation areas are as follows:\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building\n (Permanent)\n\n79M x 25M\n\n1,975 sq. M\n• CNC Basic Milling\nworkshop\n\n10.0M x 5.5M\n\n55 sq. M\n\n55 sq. M\n• CNC Intermediate and\nProduction workshop\n\n7.5M x 11.0M\n\n82.5 sq. M\n\n82.5 sq. M\n• Quality Control room\n\n10.0M x 11.0M\n\n110 sq. M\n\n110 sq. M\n• Learning Resource\nCenter\n\n5.0M x 5.0M\n\n25 sq. M\n\n25 sq. M\n• Audio Visual room\n\n5.0M x5.0M\n\n25 sq. M\n\n25 sq. M\n• Tool\nRoom\nand\nStorage\n\n10.0M x 11.0M\n\n110 sq M\n\n110 sq M\n\n•Metrology room\n\n7.0M x 11.0M\n\n70 sq. M\n\n70 sq. M\n\n3.6 TRAINER’S QUALIFICATIONS FOR CNC MILLING MACHINE OPERATION\n NC II\n\nTRAINER QUALIFICATION (TQ III)\n• Must be a holder of CNC Milling Machine Operation NC III or equivalent\n qualification.\n• Must have undergone training on Training Methodology II (TM II) or equivalent\nin training /experience\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each unit\nof competency.\n\n--- PDF PAGE 48 ---\nTR – CNC Milling Machine Operation NC II\n46"
