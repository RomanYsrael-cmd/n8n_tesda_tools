  "source_text": "Definition of Terms\n\nbench work\nthe operations incident to the process of laying out, fitting,\nassembling, etc… when the work is placed on the bench or\nin a bench vise\n\nboring\nis the operation of enlarging a hole by means of an\nadjustable cutting tool with only one cutting edge\n\nchipping\nis the operation of removing/cutting metal using hammer\nand chisel\n\ncounter boring\nis the operation of enlarging the end of a hole cylindrically\n\ndrilling\nis the operation of producing a circular hole by removing\nsolid metal\n\nfacing\nthe lathe operation of finishing the ends of the work, to\nmake the piece the right length. Also known as squaring\n\ngrinding\nrefers to the removal of material from a workpiece with\ngrinding wheel\n\nlaying out\nterm used to include the marking or scribling of center\npoints, circles, arcs, or straight lines upon metal surfaces,\neither curved or flat, for the guidance of the worker\n\nmilling\nrefers to removal of metal by feeding a workpiece through\nthe periphery of rotating circular cutter\n\nreaming\nis an operation of sizing and finishing a hole by means of a\ncutting tool having several cutting edges. reaming serves to\nmake the hole smoother, straighter, and more accurate\n\nspot-facing\nis the operation of smoothing and squaring the surface\naround a hole\n\ntapping\nis the operation of forming internal threads by means of a\ntool called tap\n\nturning\nrefers to shaping a workpiece by gripping it in a\nworkholding device and rotating it under power against a\nsuitable cutting tool\n\nCNC machining\nrefers to the fabrication of work piece either turning, milling\nor any other machining process with the use of\nComputerized Numerically Controlled machine tools\n\nprogramming\nthe process of coding machining conditions in which\ninformations such as cutter dimensions, cutter movement ,\nprocessing orders, federate or spindle speed all under fixed\nregulation or specified format which refers to the\nworkpiece drawing to instruct Numerically Controlled\nmachine tool\n\nCAD\nComputer Aided Design – the use of graphics-oriented\ncomputer software for designing and drafting applications\n\nCAM\nComputer Aided Manufacturing- computer software that\ngenerates programs for the operation of NC (numerical\ncontrol) machine tools\n\n--- PDF PAGE 51 ---\nTR – CNC Milling Machine Operation NC II\n49"
