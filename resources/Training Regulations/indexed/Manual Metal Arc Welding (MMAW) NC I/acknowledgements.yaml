    {
      "source_text": "SECTION 1 MANUAL METAL ARC WELDING (MMAW) NC I QUALIFICATION"
    },
    {
      "source_text": "The Manual Metal Arc Welding (MMAW) NC I Qualification consists of competencies that a person must achieve to weld carbon steel plates components as specified drawings, welding procedure specification or oral instructions using MMAW process. MMAW is also known as Shielded Metal Arc Welding (SMAW)."
    },
    {
      "source_text": "This Qualification conforms with the latest edition of ISO 9606-1: Qualification testing of welders — Fusion welding — Part 1: Steels, AWS D 1.1 Structural Welding Code- Steel; ASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing Qualifications; and Asian Welding Federation- Common Welders Certification Scheme (AWF-CWCS)."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of the Metals and Engineering Sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
