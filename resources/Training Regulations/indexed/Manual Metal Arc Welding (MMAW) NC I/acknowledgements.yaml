    },
    {
      "source_text": "5. OSH Work Instructions May include: 5.1 Worker’s Participation Policies 5.2 Company Environment Safety and Health Policies 5.3 Continual OSH Improvement Instructions 5.4 Education and Training 5.5 Safety and Health Policy Statements 5.6 Mission and Vision Statements 5.7 Operating Instructions and Policies"
    },
    {
      "source_text": "6. Personal Protective Equipment May include: 6.1 Arm/Hand guard, gloves 6.2 Eye protection (goggles, shield) 6.3 Hearing protection (ear muffs, ear plugs) 6.4 Hair Net/cap/bonnet 6.5 Hard hat 6.6 Face protection (mask, shield) 6.7 Apron/Gown/coverall/jump suit 6.8 Anti-static suits 6.9 High-visibility reflective vest"
    },
    {
      "source_text": "7. Preventive Control Measures May include: 7.1 Eliminate the hazard (i.e., get rid of the dangerous machine 7.2 Isolate the hazard (i.e. keep the machine in a closed room and operate it remotely; barricade an unsafe area off) 7.3 Substitute the hazard with a safer alternative (i.e., replace the machine with a safer one) 7.4 Use administrative controls to reduce the risk (i.e. give trainings on how to use equipment safely; OSH-related topics, issue warning signage’s, rotation/shifting work schedule) 7.5 Use engineering controls to reduce the risk (i.e. use safety guards to machine) 7.6 Use personal protective equipment 7.7 Safety, Health and Work Environment Evaluation 7.8 Periodic and/or special medical examinations of workers"
