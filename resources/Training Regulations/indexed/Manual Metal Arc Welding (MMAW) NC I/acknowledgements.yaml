    {
      "source_text": "3.2 TRAINING DELIVERY"
    },
    {
      "source_text": "1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be guided by the principles of competency-based TVET."
    },
    {
      "source_text": "a. Course design is based on competency standards set by the industry or recognized industry sector; (Learning system is driven by competencies written to industry standards)"
    },
    {
      "source_text": "b. Training delivery is learner-centered and should accommodate individualized and self-paced learning strategies;"
    },
    {
      "source_text": "c. Training can be done on an actual workplace setting, simulation of a workplace and/or through adoption of modern technology."
    },
    {
      "source_text": "d. Assessment is based in the collection of evidence of the performance of work to the industry required standards;"
    },
    {
      "source_text": "e. Assessment of competency takes the trainee’s knowledge and attitude into account but requires evidence of actual performance of the competency as the primary source of evidence."
    },
    {
      "source_text": "f. Training program allows for recognition of prior learning (RPL) or current competencies;"
    },
    {
      "source_text": "g. Training completion is based on satisfactory completion of all specified competencies not on the specified nominal duration of learning."
    },
    {
      "source_text": "2. The competency-based TVET system recognizes various types of delivery modes, both on-and off-the-job as long as the learning is driven by the competency standards specified by the industry. The following training modalities and their variations/components may be adopted singly or in combination with other modalities when designing and delivering training programs:"
    },
    {
      "source_text": "-- PDF PAGE 100 --- Manual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 96"
    },
    {
      "source_text": "2.1 Institution- Based:"
    },
    {
      "source_text": "Dual Training System (DTS)/Dualized Training Program (DTP) which contain both in-school and in-industry training or fieldwork components. Details can be referred to the Implementing Rules and Regulations of the DTS Law and the TESDA Guidelines on the DTP;"
    },
    {
      "source_text": "Distance learning is a formal education process in which majority of the instruction occurs when the students and instructor are not in the same place. Distance learning may employ correspondence study, audio, video, computer technologies or other modern technology that can be used to facilitate learning and formal and non-formal training. Specific guidelines on this mode shall be issued by the TESDA Secretariat."
    },
    {
      "source_text": "Supervised Industry Learning (SIL) or on-the-job training (OJT) is an approach in training designed to enhance the knowledge and skills of the trainee through actual experience in the workplace to acquire specific competencies as prescribed in the training regulations. It is imperative that the deployment of trainees in the workplace is adhered to training programs agreed by the institution and enterprise and status and progress of trainees are closely monitored by the training institutions to prevent opportunity for work exploitation."
    },
    {
      "source_text": "The classroom-based or in-center instruction uses of learner- centered methods as well as laboratory or field-work components."
    },
    {
      "source_text": "2.2 Enterprise-Based:"
    },
    {
      "source_text": "Formal Apprenticeship - Training within employment involving a contract between an apprentice and an enterprise on an approved apprenticeable occupation."
    },
    {
      "source_text": "Informal Apprenticeship - is based on a training (and working) agreement between an apprentice and a master craftsperson wherein the agreement may be written or oral and the master craftsperson commits to training the apprentice in all the skills relevant to his or her trade over a significant period of time, usually between one and four years, while the apprentice commits to contributing productively to the work of the business."
    },
    {
      "source_text": "-- PDF PAGE 101 --- Manual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 97 Training is integrated into the production process and apprentices learn by working alongside the experienced craftsperson."
    },
    {
      "source_text": "Enterprise-based Training- where training is implemented within the company in accordance with the requirements of the specific company. Specific guidelines on this mode shall be issued by the TESDA Secretariat."
    },
    {
      "source_text": "2.3 Community-Based"
    },
    {
      "source_text": "Community-Based – short term programs conducted by non- government organizations (NGOs), LGUs, training centers and other TVET providers which are intended to address the specific needs of a community. Such programs can be conducted in informal settings such as barangay hall, basketball courts, etc. These programs can also be mobile training program (MTP)."
    },
    {
      "source_text": "3. Republic Act. No. 11551, “An Act Integrating Labor Education in the Tertiary Education Curriculum” seeks to integrate labor education in the Technical Vocational Education and Training (TVET) curriculum. As provided in Section 3.b., “Labor education refers to the teaching of basic knowledge on labor rights and other skills relating to negotiation, fostering smooth interpersonal relations in the workplace, and mechanisms for redress of grievances and other concerns.”"
    },
    {
      "source_text": "The Implementing Rules and Regulations for RA 11551 is still being drafted by the TWG as of the date when this proposed TR is being presented to the TESDA Board for approval and promulgation. In the meantime, that TESDA is finalizing the labor education framework that will serve as a basis in developing the labor education curriculum for TVET, the process of integration shall be done by integrating labor education concepts in the Competency Based Curriculum (CBC) that will be developed by the TVIs that intends to register the TVET program. The labor education concepts to be integrated in the CBC shall be derived from the definition of labor education provided in Republic Act. No. 11551"
    },
    {
