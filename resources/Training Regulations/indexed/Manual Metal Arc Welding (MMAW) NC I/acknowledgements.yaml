  "source_text": "ACKNOWLEDGEMENTS 111-113\n\nTRAINING REGULATIONS (TR) DOCUMENT REVISION HISTORY 114\n\n--- PDF PAGE 5 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 1\n\nTRAINING REGULATIONS FOR\nMANUAL METAL ARC WELDING (MMAW) NC I\n\nSECTION 1 MANUAL METAL ARC WELDING (MMAW) NC I QUALIFICATION\n\nThe Manual Metal Arc Welding (MMAW) NC I Qualification consists of competencies\nthat a person must achieve to weld carbon steel plates components as specified drawings,\nwelding procedure specification or oral instructions using MMAW process. MMAW is also known\nas Shielded Metal Arc Welding (SMAW).\n\n This Qualification conforms with the latest edition of ISO 9606-1: Qualification testing of\nwelders — Fusion welding — Part 1: Steels, AWS D 1.1 Structural Welding Code- Steel; ASME\nIX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing Qualifications; and Asian\nWelding Federation- Common Welders Certification Scheme (AWF-CWCS).\n\nThis Qualification is packaged from the competency map of the Metals and Engineering\nSector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311101\nReceive and respond to workplace communication\n400311102\nWork with others\n400311103\nSolve/address routine problems\n400311104\n400311105\n400311106\n400311107\n\n400311108\n400311109\n\nEnhance self-management skills\nSupport innovation\nAccess and maintain information\nFollow occupational safety and health policies and\nprocedures\nApply environmental work standards\nAdopt entrepreneurial mindset in the workplace\nCODE NO.\nCOMMON COMPETENCIES\nMEE721202\nInterpret Drawings and Sketches\nMEE721210\nPerform Basic Workshop Measurements & Computations\nMEE721211\nContribute to Quality System\nMEE721205\nUse Hand Tools\nMEE721212\nPrepare Materials and Consumables\nInterpret Drawings and Sketches\nPerform Basic Workshop Measurements & Computations\nContribute to Quality Management System\nUse Hand Tools\nPrepare Materials and Consumables\n\nCODE NO.\nMEE721321\nMEE721322\nMEE721323\n\nCORE COMPETENCIES\nSet up Welding Equipment\nPrepare / Fit up Welding Joints\nWeld Carbon Steel Plates using MMAW\n\n--- PDF PAGE 6 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 2\nA person who has achieved this Qualification is competent to be a –\n\n-\nCarbon Steel Plate/ Pipe Welder (MMAW)\n\n--- PDF PAGE 7 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 3\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in MANUAL METAL ARC WELDING (MMAW) NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\n\nUNIT CODE\n:\n400311101\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required to\nreceive, respond and act on verbal and written communication.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow routine\n spoken\n messages\n1.1 Required information is\ngathered by listening\nattentively and correctly\ninterpreting or\nunderstanding\ninformation/ instructions\n1.2 Instructions/ information\nare recorded in\naccordance with\nworkplace requirements\n1.3 Instructions are acted\nupon immediately in\naccordance with\ninformation received\n 1.4 Clarification is sought\nfrom workplace\nsupervisor on all\noccasions when any\ninstruction/ information\nis not clear\n1.1 Organizational\npolicies/ guidelines\nin regard to\nprocessing\ninternal/external\ninformation\n1.2 Ethical work\npractices in\nhandling\ncommunications\n1.3 Overview of the\nCommunication\nprocess\n1.4 Effective note-\ntaking and\nquestioning\ntechniques\n1.1 Conciseness in\nreceiving and\nclarifying\nmessages/\ninformation/\ncommunication\n1.2 Accuracy in\nrecording\nmessages/\ninformation\n1.3 Basic\ncommunication\nskills\n1.4 Active-listening\nSkills\n1.5 Note-taking skills\n1.6 Clarifying and\nprobing\nquestions\n(questioning\nskills)\n2. Perform\nworkplace\nduties\nfollowing\nwritten notices\n2.1 Written notices and\ninstructions are read\nand interpreted\ncorrectly in accordance\nwith organizational\nguidelines\n2.2 Routine written\ninstructions are\nfollowed in sequence\n2.3 Feedback is given to\nworkplace supervisor\nbased on the\n2.1 Organizational\nguidelines in\nregard to\nprocessing\ninternal/ external\ninformation\n2.2 Ethical work\npractices in\nhandling\ncommunications\n2.3 Overview of the\nCommunication\nprocess\n2.1 Conciseness in\nreceiving and\nclarifying\nmessages/\ninformation/\ncommunication\n2.2 Accuracy in\nrecording\nmessages/\ninformation\n2.3 Clarifying and\nprobing\nquestions\n\n--- PDF PAGE 8 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 4\ninstructions/\ninformation received\n2.4 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n\n(Questioning\nSkills)\n2.4 Skills in reading\nand recording\nand labeling data\n2.5 Skills in locating\ninformation\n\n--- PDF PAGE 9 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. 2WS\nMay include:\n1.1. Written work instructions\n1.2. Internal memos/memorandum\n1.3. Business letters\n1.4. External communications\n1.5. Electronic mail\n1.6. Briefing notes\n1.7. General correspondence\n1.8. Marketing materials\n1.9. Guidelines/Circulars\n\n2. Organizational\nguidelines\nMay include:\n2.1. Information documentation procedures\n2.2. Company guidelines and procedures\n2.3. Standard Operating Procedure (SOPs)\n2.4. Organization manuals\n2.5. Departmental Policies and Procedures Manual\n2.6. Service manual\n\n--- PDF PAGE 10 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of\norganizational procedures in handling verbal and written\ncommunications\n1.2 Received and acted on verbal messages and instructions\ncorrectly and efficiently\n1.3 Demonstrated ability in recording instructions/information\n1.4 Utilized effective clarifying and probing techniques where\nnecessary\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Pens\n2.2 Note pads\n2.3 Computer (if applicable)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration on communication skills (e. g., role- playing)\n3.3 Oral questioning/Interview\n3.3 Written Test\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\n workplace or in a simulated environment in TESDA-\n accredited institutions\n\n--- PDF PAGE 11 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 7\nUNIT OF COMPETENCY :\nWORK WITH OTHERS\n\nUNIT CODE\n:\n400311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required in\nworking as member of a team, interacting with co-members and\nperforming one’s role in the team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop\neffective\nworkplace\nrelationships\n1.1 Duties and\nresponsibilities are\ndone in a positive\nmanner to promote\ncooperation and good\nrelationship\n1.2 Assistance is sought\nfrom workgroup\nwhen difficulties arise\nand addressed\nthrough discussions\n1.3 Feedback provided\nby others in the team\nis encouraged,\nacknowledged and\nacted upon\n1.4 Differences in\npersonal values and\nbeliefs are respected\nand acknowledged\nduring interaction\n\n1.1 One’s role, duties\nand responsibilities\nin the workplace\n1.2 Acknowledging/\nreceiving and\ngiving feedback\n1.3 Valuing respect\nand empathy in the\nworkplace\n1.4 Workplace\ncommunication\nprotocols\n1.5 Teamwork\n1.6 Collaboration and\nteambuilding within\nthe enterprise\n1.1 Communication\nskills – oral and\nwritten\n(e. g., requesting\nadvice, receiving\nfeedback)\n1.2 Ability to relate\nto/interact with\npeople from a\nrange of social\nand cultural\nbackgrounds\n\n2. Contribute to\nwork group\nactivities\n2.1 Support is provided\nto team members to\nensure workgroup\ngoals are met\n2.2 Constructive\ncontributions to\nworkgroup goals and\ntasks are made\naccording to\norganizational\nrequirements\n2.3 Information relevant\nto work is shared with\nteam members to\nensure designated\ngoals are met\n2.1 Importance of\ncreative\ncollaboration,\nsocial\nperceptiveness and\nproblem sensitivity\nin the workplace\n2.2 Organizational\nRequirements\n2.3 Importance of\ninitiative and\ndedication in group\nprocess\n2.4 Office and\nworkplace\ntechnologies and\nmachine\n(hardware,\nsoftware systems)\n\n2.1 Communication\nskills – oral and\nwritten (e. g.,\nrequesting advice,\nreceiving\nfeedback)\n2.2 Organizing work\npriorities and\narrangements\n2.3 Team player\nskills\n\n2.4 Technology skills\nincluding the\nability to select\nand use\ntechnology\nappropriate to a\ntask\n\n1\n\n--- PDF PAGE 12 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\nMay include:\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Enterprise code of conduct\n\n2. Work group\nMay include:\n2.1 Supervisor or manager\n2.2 Peers/work colleagues and clients\n2.3 Other members of the organization\n\n3. Feedback\nMay include:\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitori