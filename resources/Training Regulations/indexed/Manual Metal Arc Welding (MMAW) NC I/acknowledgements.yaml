    {
      "source_text": "VARIABLE RANGE 1. Occupational Safety and Health Risks and Hazards May include: 1.1 Physical hazards – impact, illumination, pressure, noise, vibration, extreme temperature, radiation 1.2 Biological hazards- bacteria, viruses, plants, parasites, mites, molds, fungi, insects 1.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, gasses, vapors 1.4 Ergonomics 1.5 Psychological factors – over exertion/ excessive force, awkward/static positions, fatigue, direct pressure, varying metabolic cycles 1.6 Physiological factors – monotony, personal relationship, work out cycle 1.7 Safety hazards (unsafe workplace condition) – confined space, excavations, falling objects, gas leaks, electrical, poor storage of materials and waste, spillage, waste and debris 1.8 Unsafe workers’ act (Smoking in off-limited areas, Substance and alcohol abuse at work)"
    },
    {
