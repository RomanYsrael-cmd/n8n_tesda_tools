E,\n2.4 Relevant documentation such as WPS and\n working drawing\n2.5 Fire Extinguishers\n3. Method of assessment\nCompetency must be assessed through:\n3.1 Observation and interview\n3.2 Demonstration and interview\n3.3 Written test\n3.4 Portfolio\n3.5 Nondestructive (NDT) and/or Destructive\n testing(DT) of test coupon\n4. Context of assessment\n4.1 Competency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting or at the\ndesignated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 73 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 69\n\nSECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for MANUAL METAL ARC WELDING (MMAW) NC I.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: MANUAL METAL ARC WELDING (MMAW) NC Level NC I\n\nNominal Training Duration:\n47 Hours (Basic Competencies)\n40 Hours (Common Competencies)\n 181 Hours (Core Competencies)\n\n 268 Hours\n 80 Supervised Industry Learning (SIL)\n 348 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involved in applying safety practices,\ninterpreting drawings and sketches, performing basic workshop measurements and computing\nindustry calculations, contributing to Quality System, using hand tools, preparing weld materials\nand consumables, setting up welding equipment, preparing/fit up welding joints fit up weld\nmaterials, repairing welds and welding carbon steel plates using MMAW. This includes\nclassroom learning activities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this qualification\nmust be achieved.\n\n--- PDF PAGE 74 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 70\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken messages\n• Exercise Conciseness in\nreceiving and clarifying\nmessages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n\n1.2 Perform workplace\nduties following\nwritten notices\n• Practice Accuracy in\nfollowing written/ oral\ninstruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling\nwritten communication\n• Practice relaying/\ndisseminating messages/\ninformation\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n\n--- PDF PAGE 75 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 71\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work with\nothers\n2.1 Develop effective\nworkplace\nrelationships\n\n• Read job description and\norganizations policies\nrelevant to work role\n• Read personnel code of