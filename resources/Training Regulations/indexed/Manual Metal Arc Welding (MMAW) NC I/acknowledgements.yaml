 to be assessed in\naccordance with the requirements identified in the evidence guide of\nthe relevant unit/s of competency.\n\n4.1.3 The\nindustry\nshall\ndetermine\nassessment\nand\ncertification\nrequirements for each qualification with promulgated Training\nRegulations: It includes the following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work and/or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment:\n\n4.1.5 For all Shielded Metal Arc Welding NC I holder, the individual/holder\nwill have to undergo assessment in the amended TR for Manual\nMetal Arc Welding (MMAW) NC I.\n\n--- PDF PAGE 108 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 104\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.\nAssist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior `\n4.2.2 Accredited\nAssessment\nCenter.\nOnly Assessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 109 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 105\n\nANNEX A\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nCOMPETENCY MAP –\nMETALS AND ENGINEERING SECTOR\n MANUAL METAL ARC WELDING (MMAW) NC I\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 110 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 106\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead