        "source_text": "MEE721322\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n preparing/ fitting up welding joints.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.Set up root\nopening and\nalignment\n\n1.1 Root opening and\nalignment is set up\n1.2 Root opening is set up\nin accordance with the\nrequirements of WPS.\n1.3 Welding joint is\naligned within the\nrange of acceptability\nof code and standard.\n1.4 Task is performed in\naccordance with\ncompany or industry\nrequirements and\nsafety procedure\n1.5 Required output is\ncompleted as per WPS\nand verified by\nimmediate supervisor\n1.1 Basic welding\njoints\n1.2 Parts of welding\njoint\n1.3 Welding joint\ndesign\n1.4 Dimensional\nMeasurement\n1.5 OSH Standards\n1.6 Work Instructions\n(written and\nverbal).\n1.7 Productivity work\nmeasurements\n1.8 Adherence to\nwork\nrequirements.\n1.9 5S and Proper\nHousekeeping\n1.9\nWaste\nSegregation/ 3R\n1.10 AWF-CWCS/\nISO 9606-1 / AWS\nD1.1 / ASME IX.\n1.11 DOLE DO\n198s2018\npolicies on OSH\nas applicable\n1.12 DOH guidelines\non safety and\nhealth as\napplicable\n\n1.1 Setting up root\nopening and\nalignment\n1.2 Performing\nmeasurement\ns\n1.3 Applying\nsafety\nprocedures\n1.4 Applying\nproductive\nmethods and\ntechniques in\nsetting up root\nopening and\nalignment\n2. Perform tack\nwelding\n\n2.1 Tack welds are\nperformed on the\nwelding joints in\naccordance with the\nrequirements of WPS\nor jobs requirement.\n2.2 Backing plate,\nstiffeners, running\nplates are installed as\nrequired.\n2.1 Basic welding\njoints\n2.2 Parts of welding\njoint\n2.3 Welding joint\ndesign\n2.4 Dimensional\nMeasurement\n2.5 Tack welding\n2.6 OSH Standards\n2.1 Performing\nTack Welding\n2.2 Performing\nmeasurements\n2.3 Applying safety\nprocedures\n2.4 Applying\nproductive\nmethods and\ntechniques in\n\n--- PDF PAGE 65 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 