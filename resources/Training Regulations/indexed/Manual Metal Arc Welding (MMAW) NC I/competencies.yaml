\naccomplished\n3.3 Obstacles to\nprogress in\nimplementing flexible\nand innovative ways\nof working are\nrecognized\n\n3.1 The role of\nemployees/work\ners in the\nimprovement of\npractices in the\norganization\n3.2 Best practices\nusing flexible\nand innovative\nways of working\n3.3 Obstacles in\nimplementing\ninnovation in\none’s scope of\nwork\n3.1 Encouraging co-\nworkers to\ngenerate and\ndevelop ideas\n3.2 Evaluating\npotential\nobstacles to and\nopportunities for\ncreativity and\ninnovation\n3.3 Sharing of best\npractices related\nto innovation and\ncreativity\n\n--- PDF PAGE 26 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Innovative practices\nMay include:\n1.1\nSelf-directed support\n1.2\nCommunity based services\n1.3\nWorking within a collaborative arrangement\n1.4\nMaking scope of work more efficient\n\n2. Innovation\nMay include:\n2.1\nNew ideas\n2.2\nOriginal ideas\n2.3\nDifferent ideas\n2.4\nMethods or tools\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified need for innovation in the area of work\n1.2\nRecognized innovative and creative ideas\n1.3\nPursed agreement for flexible and innovative ways of\nworking\n1.4\nSupported individuals and people to access flexible and\ninnovative ways of working\n2. Resource\nImplications\nSpecific resources for assessment\n2.1. Evidence of competent performance should be obtained by\nobserving an individual in an information management role\nwithin the workplace or operational or simulated environment.\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Test\n3.2. Interview\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 27 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 23\nUNIT OF COMPETENCY :\nACCESS AND MAINTAIN INFORMATION\n\nUNIT CODE\n:"
