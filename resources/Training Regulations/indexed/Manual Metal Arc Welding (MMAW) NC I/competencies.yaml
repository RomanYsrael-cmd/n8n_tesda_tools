        "source_text": "400311109\n\nUNIT DESCRIPTOR\n: This unit covers the outcomes required to support\nand internalize an entrepreneurial mindset and\nobserve basic entrepreneurial practices in the\nworkplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nentrepreneurial\nmindset\n1.1 Entrepreneurial\nmindset in the\nworkplace is\ndetermined from\nenterprise practices\nand policies.\n1.2 Entrepreneurial\nmindset in the\nworkplace is\nstudied and\naffirmed based on\ncurrent enterprise\npractices\n1.3 Clarification from\nreliable sources is\nsought regarding\nentrepreneurial\nmindset and\ncorporate culture.\n\n1.1 Workplace policies\nand practices relating\nto entrepreneurship\n1.2 Elements of\ncorporate culture\n1.3 Entrepreneurial\nmindset\n1.4 Entrepreneurial\npractices in the\nworkplace\n1.5 Desirable attitudes:\n- Patience\n- Willingness to\nlearn\n- Attention to details\n1.1 Identifying\nentrepreneurial mindset\n1.2 Studying and affirming\nentrepreneurial mindset\n1.3 Selecting and emulating\ndesirable entrepreneurial\npractices\n1.4 Communication skills\n\n--- PDF PAGE 43 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 39\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Identify\nentrepreneurial\npractices\n2.1 Entrepreneurial\npractices are\ndetermined based\non enterprise\nrequirements\n2.2 Entrepreneurial\npractices are\nperformed following\nworkplace and\nclient requirements.\n2.3 Cost-effective\nmeasures are\ncomplied with\nreference to\nworkplace best\npractices\n\n2.1 Quality assurance\npractices\n2.2 Workplace and client\nrequirements\n2.3 Types of cost-\neffective measures\n2.4 Workplace quality\npolicy\n2.5 Attitude:\n-\nPatience\n-\nAttention to\ndetails\n2.1 Performing quality\nassurance practices\n2.2 Complying quality\nassurance requirements\n2.3 Complying to cost-\neffective measures\n2.4 Communication skills\n\n--- PDF PAGE 44 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Entrepreneurial mindset\nMay include workplace thinking relating to:\n1.1 Economy in the use of resources\n1.2 Waste management\n1.3 Quality-consciousness\n1.4 Cost-consciousness\n1.5 Safety- and health- consciousness\n\n2. Quality assurance\npractices\nMay include:\n2.1 Use of quality procedures manual\n2.2 Quality policy\n2.3 Best/Good practices\n2.4 Continuous improvement program\n\n3. Reliable sources\nMay include:\n3.1 Supervisors\n3.2 Colleagues\n3.3 Clients/Partners\n\n--- PDF PAGE 45 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 41\n EVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated affirmation of entrepreneurial mindset\n1.2\nObserved entrepreneurial practices\n1.3\nComplied with cost effective measures\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nSimulated or actual workplace\nTools, materials and supplies needed to demonstrate the\nrequired tasks\n2.2\nReferences and manuals\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Third-party report\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 46 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 42\n COMMON COMPETENCIES\n\nUNIT OF COMPETENCY : INTERPRET DRAWINGS AND SKETCHES\n\nUNIT CODE\n\n:"
