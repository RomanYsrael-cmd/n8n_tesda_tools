        "source_text": "MEE721202\n\nUNIT DESCRIPTOR\n : This unit covers the competencies required to read and\n interpret drawings and sketches.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret technical\ndrawing\n1.1 Dimensions\nidentified as\nappropriate.\n1.2 Instructions\nidentified and\nfollowed as\nrequired.\n1.3 Material\nrequirements\nidentified as\nrequired.\n1.4 Symbols\nrecognized as\nappropriate in the\ndrawing/ sketch.\n1.5 Tolerance, limits\nand fits identified in\nthe drawing.\n1.1 Alphabet of lines\n1.2 Projections\n1.3 Drawing\nsymbols\n1.4 Dimensioning\ntechniques\n1.5 Tolerance, limits\nand fits\n1.6 Engineering\nmaterials\n1.7 Drawing tools\nand supplies\n1.8 AWF-CWCS/\nISO 9606-1 /\nAWS D1.1 /\nASME IX.\n\n1.1 Identifying\ndimension\n1.2 Identifying\ninstruction\n1.3 Identifying material\n1.4 Recognizing\nsymbols in the\ndrawing\n1.5 Identifying\ntolerance, limits\nand fits\n2. Interpret details\nfrom freehand\nsketch\n2.1 Dimensions\nidentified as\nappropriate.\n2.2 Instructions\nidentified and\nfollowed as\nrequired.\n2.3 Material\nrequirements\nidentified as\nrequired.\n2.4 Symbols\nrecognized as\nappropriate in the\ndrawing.\n2.1 Alphabet of\nlines\n2.2 Projections\n2.3 Drawing\nsymbols\n2.4 Dimensioning\n techniques\n2.5 Tolerance, limits\n and fits\n2.6 Engineering\n materials\n2.7 Drawing tools\n and supplies\n2.8 AWF-CWCS/\n ISO 9606-1 /\n AWS D1.1 /\n ASME IX.\n\n2.1 Identifying\ndimensions\n2.2 Identifying\ninstruction\n2.3 Identifying material\nrequirements\n2.4 Recognizing\nsymbols\n\n--- PDF PAGE 47 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing/sketch\nMay include:\n1.1 Perspective\n1.2 Joint design\n1.3 Welding symbols\n2. Tolerance\nMay include:\n2.1 General tolerance\n2.2 Groove Angle\n2.3 Root Face\n2.4 Root Opening\n\n EVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate interpreted:\n1.1 Drawings\n1.2 Sketches.\n\n2.\nResource\nimplications\nThe following resources must be provided:\n2.1 Drawings or plans\n2.2 Sketches\n2.3 Measuring tools\n3.\nMethod of\nassessment\nCompetency must be assessed through:\n3.1 Direct observation\n3.2Written or oral short answer questions\n3.3 Demonstration\n\n4.\nContext for\nassessment\n4.1 Competency may be assessed in the workplace or in\nsimulated workplace environment or at the designated\nTESDA Accredited Assessment Center.\n\n--- PDF PAGE 48 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 44\nUNIT OF COMPETENCY : PERFORM BASIC WORKSHOP MEASUREMENTS &\nCOMPUTATIONS\n\nUNIT CODE\n\n:"
