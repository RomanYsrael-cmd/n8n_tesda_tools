S\nWPS Requirements are the following:\n1.1 Welding positions\n 1.1.1 PA(1F), PC(2F),PF(3F),PE(4F)\n 1.1.2 PA(1G), PC (2G), PF(3G)\n1.2 Material thickness(s)\n 1.2.1 3≤s ‹12(plate)\n1.3 Type of material\n 1.3.1 Carbon steel\n1.4 Welding Electrodes (Type and Size)\n1.5 Welding Parameters ( Amperage, Polarity,Travel\nspeed)\n1.6 Joint preparation\n\n2. Defects\nMay include:\n2.1 Porosity/Pinholes/Blowholes\n2.2 Undercut\n2.3 Arc Strike\n2.4 Spatters\n2.5 Slag inclusion\n2.6 Concavity/convexity\n2.7 Excessive reinforcement\n2.8 Burn Through/ Melt Through\n2.9 Crater cracks\n2.10 Cracks\n2.11 Lack of Fusion\n2.12 Under Fill\n2.13 Overlap\n2.14 Misalignment\n2.15 Distortion\n\n--- PDF PAGE 72 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 68\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Welded carbon steel plates in PC(2G) and\nPF(3G) positions to acceptable standard\nfollowing the approved WPS.\n1.2 Observed safety measures applicable to\nworksite operation\n1.3 Communicated effectively with others to\nensure effective work\n1.4 Observed and complied with the productivity\nrequirements\n1.5 Complied with attitudinal work requirements\n\n2. Resource implications\nThe following resources must be provided:\n2.1 Well ventilated work area/shop with\nappropriate welding machines,accessories,\noven, tools,positioners, jigs and fixtures\n2.2 Supplies and materials\n2.3 PPE,\n2.4 Relevant documentation such as WPS and\n working drawing\n2.5 Fire Extinguishers\n3. Method of assessment\nCompetency must be assessed through:\n3.1 Observation and interview\n3.2 Demonstration and interview\n3.3 Written test\n3.4 Portfolio\n3.5 Nondestructive (NDT) and/or Destructive\n testing(DT) of test coupon\n4. Context of assessment\n4.1 Competency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting or at the\ndesignated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 73 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 69"
