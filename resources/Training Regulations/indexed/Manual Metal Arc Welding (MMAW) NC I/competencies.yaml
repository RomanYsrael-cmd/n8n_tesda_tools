        "source_text": "MEE721205\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to use hand\n tools.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.Identify and\nuse of\nPersonal\nProtective\nEquipment\n(PPE)\n1.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n1.2 Proper Care and\nMaintenance of PPEs\nare performed in\naccordance with\nOSHS\n1.3 Storage and Disposal\nof PPE are followed\naccording to OSHS\n\n1.1 OSH rule 1080 work\nstandard\n1.2 Company/ workplace\npolicies/ guidelines\n1.3 Standards and safety\nrequirements of\nwork process and\nprocedures\n1.1 Applying safety\nprocedures\n1.2 Communication\nskill\n3.3 Observation skills\n\n2. Select and\nuse of tools\nand\nequipment\n\n2.1 Hand tools selected\nare appropriate to the\nrequirements of the\ntask.\n2.2 Tools and equipment\nare inspected\naccording to\nmanufacturer’s\nrecommendation\n2.3 Tools and equipment\nare used as per\noperation manual\ninstructions.\n2.1 Tools and\nequipment\nInstruction manual\n2.2 Adherence to work\nrequirements\n\n2.1 Communication\nskills\n2.2 Handling of tools\nand equipment\n\n3.Perform simple\nmaintenance of\ntools and\nequipment\n3.1Tools and equipment\nare cleaned and\nlubricated (routine\nmaintenance)\naccording to\nmanufacturer’s\nrecommendation.\n3.2 Unsafe or defective\ntools are identified\nand marked for repair/\ndecommission\naccording to\nprocedure.\n3.3 Minor tools and\nequipment repair are\nperformed according\n3.1 Proper cleaning\n and oiling.\n3.2 Equipment\ninspection and\nmaintenance.\n3.3 Simple repairs of\nhand tools\n\n3.1Cleaning and\nlubricating.\n3.2 Conducting simple\ncheck –up and\nremedies\n3.3 Performing minor\nrepairs\n\n--- PDF PAGE 54 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 50\nto manufacturer’s\ninstruction or worksite\nprocedure.\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal protective\n Equipment (PPE)\nMay include:\n1.1 Welding Mask\n1.2 Welding apron/jacket\n1.3 Welding gloves (long)\n1.4 Safety goggles\n1.5 Respirator (as per NIOSH)\n1.6 Safety shoes\n1.7 Oxy-acetylene Goggles\n2. Hand tools\nMay include:\n2.1 Chipping Hammer\n2.2 Steel brush\n2.3 Pliers/ tongs\n2.4 Files-bastard cut\n2.5 Portable disc grinder\n2.6 Try square\n2.7 Steel rule\n2.8 Files-half round\n2.9 Welding gauges\n2.10 Adjustable wrench\n2.11 C- Clamps\n3. Task\nMay include:\n3.1 Testing / Inspection\n3.2 Adjusting\n3.3 Dismantling\n3.4 Assembling\n4. Routine maintenance\nMay include:\n4.1 Cleaning\n4.2 Lubricating\n4.3 Adjusting\n4.4 Simple tool repair\n\n--- PDF PAGE 55 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 51\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used hand tools appropriate to the job\n1.2 Performed routine maintenance and storage of hand tools\n\n2\nResource\nimplications\nThe following resources should be provided\n2.1 Tools, equipment and facilities appropriate to the process or\nactivity\n2.2 Materials relevant to the proposed activity\n\n3.\nMethod of\nassessment\nCompetency should be assessed through:\n3.1 Demonstration\n3.2 Written or oral short answer questions\n3.3 Practical exercises\n\n4.\nContext for\nassessment\n4.1 Competency may be assessed in the workplace or in\nsimulated workplace environment or at the designated\nTESDA Accredited Assessment Center.\n\n--- PDF PAGE 56 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 52\nUNIT TITLE\n: PREPARE MATERIALS AND CONSUMABLES\n\nUNIT CODE\n:"
