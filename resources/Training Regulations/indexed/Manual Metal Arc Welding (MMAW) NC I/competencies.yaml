          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Recognize related occupational safety and health\nrisks and hazards based on OSH work standards\n1.2. Identify incident/emergency procedures relevant\nto workplace based on relevant OSH work\nstandards\n1.3. Follow the OSH work instructions in accordance\nwith workplace policies and procedures\n1.4. Utilize personal protective equipment, materials,\ntools, machinery, and equipment according to\nOSH work standards\n1.5. Obey OSH requirements in accordance with\nworkplace policies and procedures\n1.6. Executed incident/ emergency procedures based\non OSH Procedures\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment\nnecessary for the activity\n\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work place\nor in a simulated work place setting\n\n--- PDF PAGE 37 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 33\nUNIT OF COMPETENCY\n: APPLY ENVIRONMENTAL WORK STANDARDS\n\nUNIT CODE\n\n:"
        },
        "source_text": "400311107\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes to identify\nrelevant occupational safety and health policies and procedures,\nperform relevant occupational safety and health procedures, and\ncomply with relevant occupational safety and health policies and\nstandards\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nrelevant\noccupational\nsafety and\nhealth policies\nand\nprocedures\n1.1 Related\noccupational\nsafety and health\nrisks and hazards\nare recognized\nbased on OSH\nwork standards\n1.2 OSH\nrequirements/\nregulations\ntowards work are\ndetermined in\naccordance to\nworkplace policies\nand procedures\n1.3 Incident/\nEmergency\nprocedures relevant\nto workplace are\nidentified based on\nrelevant OSH work\nstandards\n\n1.1. Occupational\nsafety and health\nrisks and\nhazards\n1.2. OSH work\nstandards\n1.3. Government\napproved\nOccupational\nSafety and\nHealth Policies\nand regulations\n1.4. Terms related to\noccupational\nsafety and health\n1.5. Workplace\nprocess and\nprocedures\n1.6. Standard\nemergency plan\nand procedures\n1.1 Observation skills\n1.2 Critical thinking\nskills\n1.3 Communication\nskills\n\n--- PDF PAGE 33 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 29\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Perform\nrelevant\noccupational\nsafety and\nhealth\nprocedures\n2.1 Safety devices are\nchecked in\naccordance with\nworkplace OSH\nwork standards\n2.2 OSH Work\ninstructions are\nfollowed in\naccordance with\nworkplace policies\nand procedures*\n2.3 Personal protective\nequipment,\nmaterials, tools,\nmachinery, and\nequipment are\nutilized according to\nOSH work standards\n\n2.1 OSH Work\nInstructions\nPersonal\nprotective\nequipment\n2.2 Safe handling\nprocedures of\ntools, equipment\nand materials\n2.3 Standard\nemergency plan\nand procedures\n2.4 Different OSH\ncontrol measures\n2.5 Standard accident\nand illness\nreporting\nprocedures\n\n2.1 Communication\nskills\n2.2 Knowledge\nmanagement\n2.3 Organizing skills\n2.4 Observation skills\n\n3. Comply with\nrelevant\noccupational\nsafety and\nhealth policies\nand standards\n3.1 Preventive Control\nMeasures are\nidentified in\naccordance with\nOSH work\nstandards\n3.2 OSH requirements\nare obeyed in\naccordance with\nworkplace policies\nand procedures\n3.3 Incident/ Emergency\nprocedures are\nexecuted based on\nOSH Procedures\n\n3.1 OSH Preventive\nControl\nMeasures\n3.2 Principles of 5S\n3.3 Environmental\nrequirements\nrelative to\nindustrial wastes\ndisposal\n3.4 OSH requirements\nrelative to safe\nhandling and\ndisposal of\nmaterials\n3.5 Personal hygiene\npractices\n\n3.1 Communication\nskills\n3.2 Knowledge\nmanagement\n3.3 Organizing skills\n3.4 Critical thinking skills\n3.5 Observation skills\n\n--- PDF PAGE 34 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 30\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational\nSafety and Health\nRisks and\nHazards\nMay include:\n1.1 Physical hazards – impact, illumination, pressure, noise,\nvibration, extreme temperature, radiation\n1.2 Biological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n1.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n1.4 Ergonomics\n1.5 Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n1.6 Physiological factors – monotony, personal relationship,\nwork out cycle\n1.7 Safety hazards (unsafe workplace condition) – confined\nspace, excavations, falling objects, gas leaks, electrical,\npoor storage of materials and waste, spillage, waste and\ndebris\n1.8 Unsafe workers’ act (Smoking in off-limited areas,\nSubstance and alcohol abuse at work)\n\n2. OSH Work\nStandards\nMay include:\n2.1\nOSHS Rule 1090 Hazardous Materials\n2.2\nOSHS Rule Gas & Electric Welding and Cutting\nOperations\n2.3\nOSHS Rule 1120 Hazardous Work Processes\n2.4\nOSHS Rule 1150 Materials Handling & Storage\n2.5\nOSHS Rule 1180 Internal Combustion Engine\n2.6\nOSHS Rule 1210 Electrical Safety\n2.7\nOSHS Rule 1420 Logging\n2.8\nOSHS Rule 1410 Construction Safety\n2.9\nOSHS Rule 1950 Pesticides & Fertilizers\n\n3. OSH\nRequirements/\nRegulations\nMay include:\n3.1\nClean Air Act\n3.2\nBuilding code\n3.3\nNational Electrical and Fire Safety Codes\n3.4\nWaste management statutes and rules\n3.5\nPermit to Operate\n3.6\nPhilippine Occupational Safety and Health Standards\n3.7\nDepartment Order No. 13 (Construction Safety and\nHealth)\n3.8\nECC regulations\n3.9\nRepublic Act No. 11058 – An Strengthening Compliance\nwith Occupational Safety and Health\n\n4. Incident and\nEmergency\nProcedures\nMay include:\n4.1\nChemical spills\n4.2\nEquipment/vehicle accidents\n4.3\nExplosion\n\n--- PDF PAGE 35 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 31\n4.4\nFire Drill\n4.5\nGas leak\n4.6\nInjury to personnel\n4.7\nStructural collapse\n4.8\nEarthquake drill\n4.9\nToxic and/or flammable vapors emission\n4.10\nEvacuation\n4.11\nIsolation\n4.12\nBasic life support/CPR\n4.13\nDecontamination\n4.14 Calling designed emergency personnel\n\n5. OSH Work\nInstructions\nMay include:\n5.1\nWorker’s Participation Policies\n5.2\nCompany Environment Safety and Health Policies\n5.3\nContinual OSH Improvement Instructions\n5.4\nEducation and Training\n5.5\nSafety and Health Policy Statements\n5.6\nMission and Vision Statements\n5.7\nOperating Instructions and Policies\n\n6. Personal\nProtective\nEquipment\nMay include:\n6.1\nArm/Hand guard, gloves\n6.2\nEye protection (goggles, shield)\n6.3\nHearing protection (ear muffs, ear plugs)\n6.4\nHair Net/cap/bonnet\n6.5\nHard hat\n6.6\nFace protection (mask, shield)\n6.7\nApron/Gown/coverall/jump suit\n6.8\nAnti-static suits\n6.9\nHigh-visibility reflective vest\n\n7. Preventive\nControl\nMeasures\nMay include:\n7.1\nEliminate the hazard (i.e., get rid of the dangerous\nmachine\n7.2\nIsolate the hazard (i.e. keep the machine in a closed\nroom and operate it remotely; barricade an unsafe area\noff)\n7.3\nSubstitute the hazard with a safer alternative (i.e., replace\nthe machine with a safer one)\n7.4\nUse administrative controls to reduce the risk (i.e. give\ntrainings on how to use equipment safely; OSH-related\ntopics, issue warning signage’s, rotation/shifting work\nschedule)\n7.5\nUse engineering controls to reduce the risk (i.e. use\nsafety guards to machine)\n7.6\nUse personal protective equipment\n7.7\nSafety, Health and Work Environment Evaluation\n7.8\nPeriodic and/or special medical examinations of workers\n\n--- PDF PAGE 36 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 32\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Recognize related occupational safety and health\nrisks and hazards based on OSH work standards\n1.2. Identify incident/emergency procedures relevant\nto workplace based on relevant OSH work\nstandards\n1.3. Follow the OSH work instructions in accordance\nwith workplace policies and procedures\n1.4. Utilize personal protective equipment, materials,\ntools, machinery, and equipment according to\nOSH work standards\n1.5. Obey OSH requirements in accordance with\nworkplace policies and procedures\n1.6. Executed incident/ emergency procedures based\non OSH Procedures\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment\nnecessary for the activity\n\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work place\nor in a simulated work place setting\n\n--- PDF PAGE 37 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 33\nUNIT OF COMPETENCY\n: APPLY ENVIRONMENTAL WORK STANDARDS\n\nUNIT CODE\n\n:"
