          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed tack welding\n1.2 Checked root opening and alignment\n1.3 Positioned fitted weld joint\n1.4 Observed safety measures applicable to\nworksite operation\n1.5 Communicated effectively with others to ensure\neffective work\n1.6 Observed and complied with the productivity\nrequirements\n1.7 Complied with attitudinal work requirements\n2. Resource implications\nThe following resources must be provided:\n2.1 Drawing and\n2.2 Well ventilated work area/shop with appropriate\nwelding machines, accessories, positioners, jigs\nand fixtures.\n2.3 PPE\n3. Method of assessment\nCompetency must be assessed through:\n3.1 Observation/evaluation\n3.2 Oral questioning\n4. Context of assessment\n4. Competency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting or at the designated TESDA\nAccredited Assessment Center.\n\n--- PDF PAGE 67 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 63\nUNIT OF COMPETENCY :\nWELD CARBON STEEL PLATES USING MMAW\n\nUNIT CODE\n\n:"
