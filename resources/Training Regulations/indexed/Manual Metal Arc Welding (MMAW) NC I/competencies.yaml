        "source_text": "400311103\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required to\nsolve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the\nroot cause of routine problems.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nproblem\n1.1 Desired\noperating/output\nparameters and\nexpected quality of\nproducts/services are\nidentified.\n1.2 The nature of the\nproblem by observation\non routines are\ndefined.\n1.3 Problems are stated\nand specified clearly.\n1.1 Competence\nincludes mastery of\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n1.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of problems\nroutine problems\nand to determine\nthe corrective\nactions.\n1.3 Relevant\nequipment and\noperational\nprocesses\n1.4 Enterprise goals,\ntargets and\nmeasures\n1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n1.6 Enterprise\ninformation\nsystems and data\ncollation\n1.7 Industry codes and\nstandards\n\n1.1 Using range of\nformal problem-\nsolving\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n1.2 Identifying and\nclarifying the\nnature of the\nproblem.\n\n--- PDF PAGE 15 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 11\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Assess\nfundamental\ncauses of the\nproblem\n2.1 Problem-solving tool\nappropriate to the\nproblem and the\ncontext is selected\n2.2 Possible causes\nbased on experience\nand the use of\nproblem-solving\ntools/basic analytical\ntechniques are\nidentified\n2.3 Possible fundamental\ncauses of problems\nare specified.\n\n2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n2.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of\nproblems routine\nproblems and to\ndetermine the\ncorrective actions.\n2.3 Relevant\nequipment and\noperational\nprocesses\n2.4 Enterprise goals,\ntargets and\nmeasures\n2.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n2.6 Enterprise\ninformation\nsystems and data\ncollation\n2.7 Industry codes and\nstandards\n2.1 Using range of\nformal problem-\nsolving\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation).\n2.2 Identifying extent\nand causes of\nprocedural\nproblems.\n\n--- PDF PAGE 16 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 12\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Determine\ncorrective\naction\n3.1 All possible options are\nconsidered for\nresolution of the routine\nproblem.\n3.2 Corrective actions are\ndetermined to resolve\nthe problem and\npossible future causes\n3.3 Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and\noperating procedures\n\n3.1 Competence\nincludes a thorough\nknowledge and\nunderstanding of\nthe process, normal\noperating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n3.2 Competence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action\nand provision of\nrecommendations\n3.3 Relevant equipment\nand operational\nprocesses\n3.4 Enterprise goals,\ntargets and\nmeasures\n3.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n3.6 Principles of\ndecision making\nstrategies and\ntechniques\n3.7 Enterprise\ninformation\nsystems and data\ncollation\n3.8 Industry codes and\nstandards\n\n3.1 Using range of\nformal problem-\nsolving\ntechniques.\n3.2 Identifying and\nclarifying the\nnature of the\nproblem.\n3.3 Devising and\napplying the\nbest possible\nsolution to a\nproblem.\n3.4 Evaluating the\nsolution\n\n4. Communicate\naction plans and\nrecommendations\nto routine\nproblems\n4.1 Report on\nrecommendations are\nprepared\n4.2 Recommendations are\npresented to\nappropriate person.\n4.3 Recommendations are\nfollowed-up, if required\n4.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n4.1 Using range of\nformal problem\nsolving\ntechniques\n4.2 Identifying and\nclarifying the\nnature of the\nproblem\n4.3 Devising the best\npossible solution\n\n--- PDF PAGE 17 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 13\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n4.3 Relevant equipment\nand operational\nprocesses\n4.4 Enterprise goals,\ntargets and\nmeasures\n4.5 Enterprise quality,\nOHS and\nenvironmental\nrequirement\n4.6 Principles of\ndecision making\nstrategies and\ntechniques\n4.7 Enterprise\ninformation\nsystems and data\ncollation\n4.8 Industry codes and\nstandards\n\nto a routine\nproblem\n4.4 Evaluating the\nsolution\n4.5 Developing\naction plans to\nresolving and\nmanaging\nroutine\nproblems.\n\n--- PDF PAGE 18 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 14\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Problem\n\nMay include:\n1.1.\nRoutine/non – routine processes and quality\nproblems\n1.2.\nEquipment selection, availability and failure\n1.3.\nTeamwork and work allocation problem\n1.4. Safety and emergency situations and incidents\n\n2. Basic analytical\ntechniques\nMay include:\n2.1.\nBrainstorming\n2.2.\nCase Analysis\n2.3.\nCause and effect diagrams\n2.4.\nPareto analysis\n2.5.\nSWOT analysis\n2.6.\nGant chart, Pert CPM and graphs\n2.7.\nScatter grams\n\n3. Action plans\n\nMay include:\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n4. Appropriate person\nMay include:\n4.1 Supervisor or manager\n4.2 Peers/work colleagues\n4.3 Other members of the organization\n\n--- PDF PAGE 19 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 15\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem.\n1.2.\nDetermined the fundamental causes of the problem.\n1.3.\nDetermined the correct / preventive action.\n1.4.\nDeveloped action plans in managing routine problems.\n\nThese aspects may be best assessed using project-based learning\nmode of assessment and case formulation.\n\n2. Resource\nImplications\n Assessment will require access to a workplace over an extended\nperiod, or a suitable method of gathering evidence of operating ability\nover a range of situations.\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Case Formulation\n3.2. Life Narrative Inquiry (Interview)\n3.3. Standardized test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the relevant\ncompetency components.\nThese assessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may have\nhappened.\n\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA accredited\n institutions\n\n--- PDF PAGE 20 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 16\nUNIT OF COMPETENCY :\nENHANCE SELF-MANAGEMENT SKILLS\n\nUNIT CODE\n:"
