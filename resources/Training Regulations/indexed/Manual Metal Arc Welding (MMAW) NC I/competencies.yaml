        "source_text": "400311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required in\nworking as member of a team, interacting with co-members and\nperforming one’s role in the team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop\neffective\nworkplace\nrelationships\n1.1 Duties and\nresponsibilities are\ndone in a positive\nmanner to promote\ncooperation and good\nrelationship\n1.2 Assistance is sought\nfrom workgroup\nwhen difficulties arise\nand addressed\nthrough discussions\n1.3 Feedback provided\nby others in the team\nis encouraged,\nacknowledged and\nacted upon\n1.4 Differences in\npersonal values and\nbeliefs are respected\nand acknowledged\nduring interaction\n\n1.1 One’s role, duties\nand responsibilities\nin the workplace\n1.2 Acknowledging/\nreceiving and\ngiving feedback\n1.3 Valuing respect\nand empathy in the\nworkplace\n1.4 Workplace\ncommunication\nprotocols\n1.5 Teamwork\n1.6 Collaboration and\nteambuilding within\nthe enterprise\n1.1 Communication\nskills – oral and\nwritten\n(e. g., requesting\nadvice, receiving\nfeedback)\n1.2 Ability to relate\nto/interact with\npeople from a\nrange of social\nand cultural\nbackgrounds\n\n2. Contribute to\nwork group\nactivities\n2.1 Support is provided\nto team members to\nensure workgroup\ngoals are met\n2.2 Constructive\ncontributions to\nworkgroup goals and\ntasks are made\naccording to\norganizational\nrequirements\n2.3 Information relevant\nto work is shared with\nteam members to\nensure designated\ngoals are met\n2.1 Importance of\ncreative\ncollaboration,\nsocial\nperceptiveness and\nproblem sensitivity\nin the workplace\n2.2 Organizational\nRequirements\n2.3 Importance of\ninitiative and\ndedication in group\nprocess\n2.4 Office and\nworkplace\ntechnologies and\nmachine\n(hardware,\nsoftware systems)\n\n2.1 Communication\nskills – oral and\nwritten (e. g.,\nrequesting advice,\nreceiving\nfeedback)\n2.2 Organizing work\npriorities and\narrangements\n2.3 Team player\nskills\n\n2.4 Technology skills\nincluding the\nability to select\nand use\ntechnology\nappropriate to a\ntask\n\n1\n\n--- PDF PAGE 12 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\nMay include:\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Enterprise code of conduct\n\n2. Work group\nMay include:\n2.1 Supervisor or manager\n2.2 Peers/work colleagues and clients\n2.3 Other members of the organization\n\n3. Feedback\nMay include:\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service delivery\n\n4. Providing\nsupport to team\nmembers\nMay include:\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n\n5. Organizational\nrequirements\n\nMay include:\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and standards\n\n--- PDF PAGE 13 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 9\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals are met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nDemonstrated quality/active participation in team meetings\nand activities\n\n2. Resource\nImplications\nThe following 