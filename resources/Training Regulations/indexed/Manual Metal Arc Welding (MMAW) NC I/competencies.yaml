        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Welded carbon steel plates in PC(2G) and\nPF(3G) positions to acceptable standard\nfollowing the approved WPS.\n1.2 Observed safety measures applicable to\nworksite operation\n1.3 Communicated effectively with others to\nensure effective work\n1.4 Observed and complied with the productivity\nrequirements\n1.5 Complied with attitudinal work requirements\n\n2. Resource implications\nThe following resources must be provided:\n2.1 Well ventilated work area/shop with\nappropriate welding machines,accessories,\noven, tools,positioners, jigs and fixtures\n2.2 Supplies and materials\n2.3 PPE,\n2.4 Relevant documentation such as WPS and\n working drawing\n2.5 Fire Extinguishers\n3. Method of assessment\nCompetency must be assessed through:\n3.1 Observation and interview\n3.2 Demonstration and interview\n3.3 Written test\n3.4 Portfolio\n3.5 Nondestructive (NDT) and/or Destructive\n testing(DT) of test coupon\n4. Context of assessment\n4.1 Competency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting or at the\ndesignated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 73 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 69"
        },
        "source_text": "MEE721301\n\nDESCRIPTOR\n\n:\nThis unit covers the skills, knowledge and\n attitudes in welding carbon steel plates using\nMMAW process.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform single\npass fillet weld\n1.1 Root pass is\nperformed in\naccordance with\nWPS or job\nrequirement.\n1.2 Task is performed in\naccordance with\ncompany or industry\nrequirement and\nsafety procedure.\n1.3 Weld is cleaned\nfree from slag and\nother impurities\n1.4 Weld is visually\nchecked for defects\nand repaired, as\nrequired\n1.5 Weld is visually\nacceptable in\naccordance with\napplicable codes and\nstandards.\n1.6 Required output is\ncompleted as per\nWPS and verified by\nimmediate supervisor\n1.1 OSH Standards\n1.2 Work instructions\n(written and\nverbal).\n1.3 Welding techniques\n1.4 Hand tools and\nPower tools\n1.5 Welding defects,\ncauses and\nremedies\n1.6 Visual Inspection\n1.7 Productivity work\nmeasurements\n1.8 Adherence to work\nrequirements\n1.9 5S and Proper\nHousekeeping\n1.10 Waste\nSegregation/ 3R\n1.11 AWF-CWCS/ ISO\n9606-1 / AWS D1.1\n/ ASME IX.\n1.12 DOLE DO\n198s2018 policies\non OSH as\napplicable\n1.13 DOH guidelines on\nsafety and health\nas applicable\n\n1.1Communication\nskill\n1.2 Applying Welding\ntechniques\n1.3 Applying Welding\nrepair Techniques\n1.4 Performing\nWelding\nInspection\n1.5Applying safety\nprocedures\n1.6 Applying\nproductive\nmethods and\ntechniques in\nperforming single\npass fillet weld\n2. Perform\nmultiple pass\nfillet welds\n2.1 Multiple pass fillet\nwelds are performed\nin accordance with\nWPS or job\nrequirement.\n2.2 Task is performed in\naccordance with\ncompany or industry\nrequirement and\nsafety procedure.\n2.3 Welds are cleaned\nfree from slag and\nother impurities\n2.1 OSH Standards\n2.2 work instructions\n(written and\nverbal).\n2.3 Welding techniques\n2.4 Had tools and\nPower tools\n2.5 Welding defects,