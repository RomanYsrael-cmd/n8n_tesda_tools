  "source_text": "SECTION 1 MANUAL METAL ARC WELDING (MMAW) NC I QUALIFICATION\n\nThe Manual Metal Arc Welding (MMAW) NC I Qualification consists of competencies\nthat a person must achieve to weld carbon steel plates components as specified drawings,\nwelding procedure specification or oral instructions using MMAW process. MMAW is also known\nas Shielded Metal Arc Welding (SMAW).\n\n This Qualification conforms with the latest edition of ISO 9606-1: Qualification testing of\nwelders — Fusion welding — Part 1: Steels, AWS D 1.1 Structural Welding Code- Steel; ASME\nIX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing Qualifications; and Asian\nWelding Federation- Common Welders Certification Scheme (AWF-CWCS).\n\nThis Qualification is packaged from the competency map of the Metals and Engineering\nSector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311101\nReceive and respond to workplace communication\n400311102\nWork with others\n400311103\nSolve/address routine problems\n400311104\n400311105\n400311106\n400311107\n\n400311108\n400311109\n\nEnhance self-management skills\nSupport innovation\nAccess and maintain information\nFollow occupational safety and health policies and\nprocedures\nApply environmental work standards\nAdopt entrepreneurial mindset in the workplace\nCODE NO.\nCOMMON COMPETENCIES\nMEE721202\nInterpret Drawings and Sketches\nMEE721210\nPerform Basic Workshop Measurements & Computations\nMEE721211\nContribute to Quality System\nMEE721205\nUse Hand Tools\nMEE721212\nPrepare Materials and Consumables\nInterpret Drawings and Sketches\nPerform Basic Workshop Measurements & Computations\nContribute to Quality Management System\nUse Hand Tools\nPrepare Materials and Consumables\n\nCODE NO.\nMEE721321\nMEE721322\nMEE721323\n\nCORE COMPETENCIES\nSet up Welding Equipment\nPrepare / Fit up Welding Joints\nWeld Carbon Steel Plates using MMAW\n\n--- PDF PAGE 6 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 2\nA person who has achieved this Qualification is competent to be a –\n\n-\nCarbon Steel Plate/ Pipe Welder (MMAW)\n\n--- PDF PAGE 7 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 3"
