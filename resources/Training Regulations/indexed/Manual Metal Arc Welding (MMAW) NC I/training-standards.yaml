sion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 2 Hours\n\n--- PDF PAGE 94 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 90\nCORE COMPETENCIES\n(181 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Set-up Welding\nEquipment\n1.1 Set up welding machine\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and\nfixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 2 Hours\n\n1.2 Set up welding accessories\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and\nfixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 1 Hour\n\n1.3 Set up welding positioners,\njigs and fixtures\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and fixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 1 Hour\n\n--- PDF PAGE 95 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 91\n2. Prepare / Fit up\nWelding Joints\n2.1 Set-up root opening and\n alignment\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 4 Hours\n\n2.2 Perform tack welding\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 8 Hours\n\n2.3 Set-up fitted welding joints\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 4 Hours\n\n--- PDF PAGE 96 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 92\n3. Weld Carbon\nSteel Plates\nUsing MMAW\n\n3.1 Perform single pass fillet\nwelds in different positions-\nPA (1F), PC(2F),\nPF(3F),PE(4F)\n\n• Explain and obtain single\npass fillet welds in\ndifferent positions in\naccordance to welding\ncodes and standards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) e.g.\nVisual Testing,\nDye Penetrant\nTesting and\nDestructive\ntesting (DT)\ne.g. Break\nTest of test\ncoupon\n\n• 44 Hours\n\n3.2 Perform multiple pass fillet\nwelds in different positions-\nPA(1F), PC(2F), PF(3F),\nPE(4F)\n\n• Explain and obtain\nmultiple pass fillet welds in\ndifferent positions in\naccordance to welding\ncodes and standards\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) e.g.\nVisual Testing,\nDye Penetrant\nTesting of test\ncoupon\n\n• 44 Hours\n\n--- PDF PAGE 97 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 93\n\n3.3 Perform root passes\n in different\npositions- PA(1G), PC (2G),\nPF (3G)\n\n• Explain and obtain root\npasses weld in different\npositions in accordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n\n• 20 Hours\n\n3.4 Perform subsequent fill\npasses on groove/butt jointin\ndifferent positions PA(1G),\nPC (2G), PF (3G)\n\n• Explain and obtain\nsubsequent fill passes in\ndifferent positions in\naccordance to welding\ncodes and standards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n•\nDemonstra\ntion and oral\nquestioning/\nInterview\n•\nWritten\ntest\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n• 30\nHours\n\n--- PDF PAGE 98 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 94\n\n3.5 Perform capping on groove/\nbutt joint in different\npositions- PA(1G), PC (2G),\nPF (3G)\n• Explain and obtain\ncapping in different\npositions in accordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n\n• 15\nHours\n\n3.6 Perform final visual\nInspection in all test coupon\nin different positions\n• Explain and obtain final\nvisual Inspection in\ndifferent positions in\naccordance to welding\ncodes and standards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n\n• 8 hours\n\n--- PDF PAGE 99 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 95\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry\nor recognized industry sector; (Learning system is driven by\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance\nof work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n--- PDF PAGE 100 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 96\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n• Distance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin\nthe\nsame\nplace.\nDistance\nlearning\nmay\nemploy\ncorrespondence study, audio, video, computer technologies or\nother modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this\nmode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Learning (SIL) or on-the-job training (OJT) is\nan approach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace to\nacquire specific competencies as prescribed in the training\nregulations. It is imperative that the deployment of trainees in the\nworkplace is adhered to training programs agreed by the\ninstitution and enterprise and status and progress of trainees are\nclosely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship - Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\n\n--- PDF PAGE 101 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 97\nTraining is integrated into the production process and apprentices\nlearn by working alongside the experienced craftsperson.\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP).\n\n3. Republic Act. No. 11551, “An Act Integrating Labor Education in the\nTertiary Education Curriculum” seeks to integrate labor education in the\nTechnical Vocational Education and Training (TVET) curriculum. As\nprovided in Section 3.b., “Labor education refers to the teaching of basic\nknowledge on labor rights and other skills relating to negotiation, fostering\nsmooth interpersonal relations in the workplace, and mechanisms for\nredress of grievances and other concerns.”\n\nThe Implementing Rules and Regulations for RA 11551 is still being\ndrafted by the TWG as of the date when this proposed TR is being\npresented to the TESDA Board for approval and promulgation. In the\nmeantime, that TESDA is finalizing the labor education framework that\nwill serve as a basis in developing the labor education curriculum for\nTVET, the process of integration shall be done by integrating labor\neducation concepts in the Competency Based Curriculum (CBC) that will\nbe developed by the TVIs that intends to register the TVET program.\nThe labor education concepts to be integrated in the CBC shall be\nderived from the definition of labor education provided in Republic Act.\nNo. 11551\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the\nfollowing requirements:\n\n• Must possess good communication skills\n• Physically fit (including differently-abled person)\n\n--- PDF PAGE 102 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 98\n• Can perform basic mathematical computation\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\n Recommended list of tools, materials and equipment for the training of 20\ntrainees for Manual Metal Arc Welding NC I.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices\nand their availability in the local market.\n\n A. (Full Qualification)\n\nTOOLS\nQTY\nDescription\n20 pcs.\nChipping Hammer\n60 pcs.\nSteel brush\n20 prs.\nPlier/tongs\n20 pcs.\nFiles-bastard cut\n20 pcs.\nWelding Mask\n20 pcs\nWelding apron/jacket\n40 prs.\nWelding gloves(long)\n20 prs.\nSafety goggles, wide vision, clear\n5 prs.\nOxy-acetylene\nGoggles\n20 pcs.\nTry square 300 mm. Long\n20 pcs.\nSteel rule300mm. long\n20 pcs.\nFiles-half round\n20 pcs.\nWelding gauges\n60 pcs\nRespirator (as per NIOSH)\n20 prs\nSafety Shoes (High-cut)\n10 pcs\nAdjustable wrench 12 inch\n\n--- PDF PAGE 103 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 99\n10 pcs\nC- Clamps (8inch)\n1 unit\nClamp Ammeter (Optional)\n\nMATERIALS (Per Participants)\nQTY\nDescription\n5 kgs.\nElectrodes 3.2mm (ISO /E6011)\n20 kgs.\nElectrodes 3.2mm (ISO /E7018)\n5 kgs.\nElectrodes 3.2mm (ISO /E6013)\n2 pcs\nSoftstone / Chalk Marker\n3 pcs\nDark glass lens\n25 pcs\nClear glass lens\n40 pcs.\nCutting disc 3/32” X 5/8” X 4”\n20 pcs\n\nGrinding disc 1/4” X 5/8” X 4”\n 38 pcs.\nCarbon steel plate 10mm X 150mm X 200mm\n40 pcs.\nCarbon steel plate\n6mm X 100mm X 200mm\n\n--- PDF PAGE 104 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 100\nEQUIPMENT\nQTY\nDescription\n10 units\nMMAW/SMAW machine AC/DC 250-300 Amps. and\naccessories\n10pcs.\nWelding table with welding positioners\n1 unit\nElectrode oven (Big)\n\n10 units\nPortable disc grinder\n1 set\nVentilation System\n2 units\nWork bench w/ bench vise on 4 corners\n2 sets\nOxy-fuel cutting outfit\n2 units\nPedestal /bench grinding machine\n2 units\nIndustrial fan\n5 units\nPortable Oven (quiver)\n4 Units\nFire Extinguishers\n3 units\nWaste Bins\n1 Unit\nScrap Bin\n2 sets\nLiquid Penetrant Test (PT) kit\n1 Unit\nMechanical Press (break/bend test)\n1 unit\nPlate and pipe beveling cutting equipment\n(Mechanical or Automatic)\n\n--- PDF PAGE 105 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 101\n3.5 TRAINING FACILITIES\n\nThe welding workshop must be of concrete structure. Based on class size of\n20 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY.\nTOTAL AREA IN\nSQ. METERS\nContextual Learning\nArea\n(Lecture Room)\n3 x 4\n12\n1\n12\nDistance Learning\n(Laboratory/Workshop/\nActivity area)\n\n56\n\n56\n-\nWelding Booth*\n2 X 1.5 = 3\n3 x 10 booths\n30\n10\n30\n-\nGrinding Booth*\n2 X 1.5\n\n3\n2\n6\n-\nMaterials/Preparat\nion Area*\n2 X 2.5\n\n5\n2\n10\n-\nBench work Area*\n2 X 2.5\n\n5\n2\n10\nStorage Area (Tool room\n& S/M storage area)\n4 X 5\n\n20\n1\n20\nLearning Resource\nArea*\n5 X 7\n\n35\n\n1\n35\nWash Area /Comfort\nRoom (male & female)\n2.5 X 4\n10\n1\n10\nCirculation Area**\n\n(27.3)\n\nTotal Workshop Area\n\n (160.3~160)\n\nNOTE: Access to and use of equipment /facilities can be provided through cooperative arrangements\nor MOA with other partner companies\n\n--- PDF PAGE 106 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 102\n 3.6 TRAINER’S QUALIFICATIONS FOR MANUAL METAL ARC WELDING (MMAW) NC I\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\n Manual Metal Arc Welding (MMAW) NC II or higher\n• Must be physically fit (including differently-abled person)\n• Must have at least 2 years welding job/industry/ teaching experience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 107 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 103"
