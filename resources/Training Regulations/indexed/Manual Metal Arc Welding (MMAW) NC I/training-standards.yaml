n\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n\n• 8 hours\n\n--- PDF PAGE 99 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 95\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry\nor recognized industry sector; (Learning system is driven by\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance\nof work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n--- PDF PAGE 100 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 96\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n• Distance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin\nthe\nsame\nplace.\nDistance\nlearning\nmay\nemploy\ncorrespondence study, audio, video, computer technologies or\nother modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this\nmode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Learning (SIL) or on-the-job training (OJT) is\nan approach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace to\nacquire specific competencies as prescribed in the training\nregulations. It is imperative that the deployment of trainees in the\nworkplace is adhered to training programs agreed by the\ninstitution and enterprise and status and progress of trainees are\nclosely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship - Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\n\n--- PDF PAGE 101 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 97\nTraining is integrated into the production process and apprentices\nlearn by working alongside the experienced craftsperson.\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP).\n\n3. Republic Act. No. 11551, “An Act Integrating Labor Education in the\nTertiary Education Curriculum” seeks to integrate labor education in the\nTechnical Vocational Education and Training (TVET) curriculum. As\nprovided in Section 3.b., “Labor education refers to the teaching of basic\nknowledge on labor rights and other skills relating to negotiation, fostering\nsmooth interpersonal relations in the workplace, and mechanisms for\nredress of grievances and other concerns.”\n\nThe Implementing Rules and Regulations for RA 11551 is still being\ndrafted by the TWG as of the date when this proposed TR is being\npresented to the TESDA Board for approval and promulgation. In the\nmeantime, that TESDA is finalizing the labor education framework that\nwill serve as a basis in developing the labor education curriculum for\nTVET, the process of integration shall be done by integrating labor\neducation concepts in the Competency Based Curriculum (CBC) that will\nbe developed by the TVIs that intends to register the TVET program.\nThe labor education concepts to be integrated in the CBC shall be\nderived from the definition of labor education provided in Republic Act.\nNo. 11551\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the\nfollowing requirements:\n\n• Must possess good communication skills\n• Physically fit (including differently-abled person)\n\n--- PDF PAGE 102 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 98\n• Can perform basic mathematical computation\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\n Recommended list of tools, materials and equipment for the training of 20\ntrainees for Manual Metal Arc Welding NC I.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices\nand their availability in the local market.\n\n A. (Full Qualification)\n\nTOOLS\nQTY\nDescription\n20 pcs.\nChipping Hammer\n60 pcs.\nSteel brush\n20 prs.\nPlier/tongs\n20 pcs.\nFiles-bastard cut\n20 pcs.\nWelding Mask\n20 pcs\nWelding apron/jacket\n40 prs.\nWelding gloves(long)\n20 prs.\nSafety goggles, wide vision, clear\n5 prs.\nOxy-acetylene\nGoggles\n20 pcs.\nTry square 300 mm. Long\n20 pcs.\nSteel rule300mm. long\n20 pcs.\nFiles-half round\n20 pcs.\nWelding gauges\n60 pcs\nRespirator (as per NIOSH)\n20 prs\nSafety Shoes (High-cut)\n10 pcs\nAdjustable wrench 12 inch\n\n--- PDF PAGE 103 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 99\n10 pcs\nC- Clamps (8inch)\n1 unit\nClamp Ammeter (Optional)\n\nMATERIALS (Per Participants)\nQTY\nDescription\n5 kgs.\nElectrodes 3.2mm (ISO /E6011)\n20 kgs.\nElectrodes 3.2mm (ISO /E7018)\n5 kgs.\nElectrodes 3.2mm (ISO /E6013)\n2 pcs\nSoftstone / Chalk Marker\n3 pcs\nDark glass lens\n25 pcs\nClear glass lens\n40 pcs.\nCutting disc 3/32” X 5/8” X 4”\n20 pcs\n\nGrinding disc 1/4” X 5/8” X 4”\n 38 pcs.\nCarbon steel plate 10mm X 150mm X 200mm\n40 pcs.\nCarbon steel plate\n6mm X 100mm X 200mm\n\n--- PDF PAGE 104 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 100\nEQUIPMENT\nQTY\nDescription\n10 u