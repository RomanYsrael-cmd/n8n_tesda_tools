ine proper\nPPE in\naccordance with\nsafety standards\n•\nKnow and Identify\nwelding safety\nhazards\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 3 Hours\n\n5.2 Set up cutting equipment and\nmaterials\n\n•\nDetermine proper\nPPE in\naccordance with\nsafety standards\n•\nKnow and Identify\nwelding safety\nhazards\n•\nDetermine Proper\nset-up of\nequipment and\nmaterials\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 3 Hours\n\n--- PDF PAGE 93 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 89\n\n5.3 Cut and prepare edge of\n materials\n\n•\nDetermine proper\nPPE in\naccordance with\nsafety standards\n•\nKnow and Identify\nwelding safety\nhazards\n•\nKnow how to cut\nmaterials\naccording to\nspecifications.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 8 Hours\n\n5.4 Clean surfaces and edges\n\n•\nDetermine proper\nPPE in\naccordance with\nsafety standards\n•\nKnow and Identify\nwelding safety\nhazards\n•\nKnow how to\nclean materials\naccording to\nspecifications.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 2 Hours\n\n5.5 Prepare welding consumables\n•\nDetermine proper\nPPE in\naccordance with\nsafety standards\n•\nKnow and Identify\nwelding safety\nhazards\n•\nKnow how to\nselect and prepare\nproper welding\nconsumables.\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n• 2 Hours\n\n--- PDF PAGE 94 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 90\nCORE COMPETENCIES\n(181 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Set-up Welding\nEquipment\n1.1 Set up welding machine\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and\nfixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 2 Hours\n\n1.2 Set up welding accessories\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and\nfixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 1 Hour\n\n1.3 Set up welding positioners,\njigs and fixtures\n\n• Explain and demonstrate\nhow to set-up welding\nequipment.\n• Explain and demonstrate\nhow to set-up welding\naccessories.\n• Explain and demonstrate\nhow to set-up welding\npositioners, jigs and fixtures.\n• Lecture\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 1 Hour\n\n--- PDF PAGE 95 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 91\n2. Prepare / Fit up\nWelding Joints\n2.1 Set-up root opening and\n alignment\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 4 Hours\n\n2.2 Perform tack welding\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 8 Hours\n\n2.3 Set-up fitted welding joints\n\n• Explain and demonstrate\nhow to set-up root opening\nand alignment.\n• Obtain tack welds.\n• Explain and obtain correct\nfitted welding joints\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n• 4 Hours\n\n--- PDF PAGE 96 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 92\n3. Weld Carbon\nSteel Plates\nUsing MMAW\n\n3.1 Perform single pass fillet\nwelds in different positions-\nPA (1F), PC(2F),\nPF(3F),PE(4F)\n\n• Explain and obtain single\npass fillet welds in\ndifferent positions in\naccordance to welding\ncodes and standards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) e.g.\nVisual Testing,\nDye Penetrant\nTesting and\nDestructive\ntesting (DT)\ne.g. Break\nTest of test\ncoupon\n\n• 44 Hours\n\n3.2 Perform multiple pass fillet\nwelds in different positions-\nPA(1F), PC(2F), PF(3F),\nPE(4F)\n\n• Explain and obtain\nmultiple pass fillet welds in\ndifferent positions in\naccordance to welding\ncodes and standards\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) e.g.\nVisual Testing,\nDye Penetrant\nTesting of test\ncoupon\n\n• 44 Hours\n\n--- PDF PAGE 97 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 93\n\n3.3 Perform root passes\n in different\npositions- PA(1G), PC (2G),\nPF (3G)\n\n• Explain and obtain root\npasses weld in different\npositions in accordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n\n• 20 Hours\n\n3.4 Perform subsequent fill\npasses on groove/butt jointin\ndifferent positions PA(1G),\nPC (2G), PF (3G)\n\n• Explain and obtain\nsubsequent fill passes in\ndifferent positions in\naccordance to welding\ncodes and standards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n•\nDemonstra\ntion and oral\nquestioning/\nInterview\n•\nWritten\ntest\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n• 30\nHours\n\n--- PDF PAGE 98 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 94\n\n3.5 Perform capping on groove/\nbutt joint in different\npositions- PA(1G), PC (2G),\nPF (3G)\n• Explain and obtain\ncapping in different\npositions in accordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n\n• 15\nHours\n\n3.6 Perform final visual\nInspection in all test coupon\nin different positions\n• Explain and obtain final\nvisual Inspection in\ndifferent positions in\naccordance to welding\ncodes and standards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructi\nve Testing\n(NDT) of test\ncoupon\n\n• 8 hours\n\n--- PDF PAGE 99 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 95",
