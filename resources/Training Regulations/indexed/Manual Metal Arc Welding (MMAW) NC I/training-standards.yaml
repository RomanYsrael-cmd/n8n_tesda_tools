    "source_text": "Section 3.b., “Labor education refers to the teaching of basic\nknowledge on labor rights and other skills relating to negotiation, fostering\nsmooth interpersonal relations in the workplace, and mechanisms for\nredress of grievances and other concerns.”\n\nThe Implementing Rules and Regulations for RA 11551 is still being\ndrafted by the TWG as of the date when this proposed TR is being\npresented to the TESDA Board for approval and promulgation. In the\nmeantime, that TESDA is finalizing the labor education framework that\nwill serve as a basis in developing the labor education curriculum for\nTVET, the process of integration shall be done by integrating labor\neducation concepts in the Competency Based Curriculum (CBC) that will\nbe developed by the TVIs that intends to register the TVET program.\nThe labor education concepts to be integrated in the CBC shall be\nderived from the definition of labor education provided in Republic Act.\nNo. 11551\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the\nfollowing requirements:\n\n• Must possess good communication skills\n• Physically fit (including differently-abled person)\n\n--- PDF PAGE 102 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 98\n• Can perform basic mathematical computation\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\n Recommended list of tools, materials and equipment for the training of 20\ntrainees for Manual Metal Arc Welding NC I.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices\nand their availability in the local market.\n\n A. (Full Qualification)\n\nTOOLS\nQTY\nDescription\n20 pcs.\nChipping Hammer\n60 pcs.\nSteel brush\n20 prs.\nPlier/tongs\n20 pcs.\nFiles-bastard cut\n20 pcs.\nWelding Mask\n20 pcs\nWelding apron/jacket\n40 prs.\nWelding gloves(long)\n20 prs.\nSafety goggles, wide vision, clear\n5 prs.\nOxy-acetylene\nGoggles\n20 pcs.\nTry square 300 mm. Long\n20 pcs.\nSteel rule300mm. long\n20 pcs.\nFiles-half round\n20 pcs.\nWelding gauges\n60 pcs\nRespirator (as per NIOSH)\n20 prs\nSafety Shoes (High-cut)\n10 pcs\nAdjustable wrench 12 inch\n\n--- PDF PAGE 103 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 99\n10 pcs\nC- Clamps (8inch)\n1 unit\nClamp Ammeter (Optional)\n\nMATERIALS (Per Participants)\nQTY\nDescription\n5 kgs.\nElectrodes 3.2mm (ISO /E6011)\n20 kgs.\nElectrodes 3.2mm (ISO /E7018)\n5 kgs.\nElectrodes 3.2mm (ISO /E6013)\n2 pcs\nSoftstone / Chalk Marker\n3 pcs\nDark glass lens\n25 pcs\nClear glass lens\n40 pcs.\nCutting disc 3/32” X 5/8” X 4”\n20 pcs\n\nGrinding disc 1/4” X 5/8” X 4”\n 38 pcs.\nCarbon steel plate 10mm X 150mm X 200mm\n40 pcs.\nCarbon steel plate\n6mm X 100mm X 200mm\n\n--- PDF PAGE 104 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 100\nEQUIPMENT\nQTY\nDescription\n10 units\nMMAW/SMAW machine AC/DC 250-300 Amps. and\naccessories\n10pcs.\nWelding table with welding positioners\n1 unit\nElectrode oven (Big)\n\n10 units\nPortable disc grinder\n1 set\nVentilation System\n2 units\nWork bench w/ bench vise on 4 corners\n2 sets\nOxy-fuel cutting outfit\n2 units\nPedestal /bench grinding machine\n2 units\nIndustrial fan\n5 units\nPortable Oven (quiver)\n4 Units\nFire Extinguishers\n3 units\nWaste Bins\n1 Unit\nScrap Bin\n2 sets\nLiquid Penetrant Test (PT) kit\n1 Unit\nMechanical Press (break/bend test)\n1 unit\nPlate and pipe beveling cutting equipment\n(Mechanical or Automatic)\n\n--- PDF PAGE 105 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 101\n3.5 TRAINING FACILITIES\n\nThe welding workshop must be of concrete structure. Based on class size of\n20 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY.\nTOTAL AREA IN\nSQ. METERS\nContextual Learning\nArea\n(Lecture Room)\n3 x 4\n12\n1\n12\nDistance Learning\n(Laboratory/Workshop/\nActivity area)\n\n56\n\n56\n-\nWelding Booth*\n2 X 1.5 = 3\n3 x 10 booths\n30\n10\n30\n-\nGrinding Booth*\n2 X 1.5\n\n3\n2\n6\n-\nMaterials/Preparat\nion Area*\n2 X 2.5\n\n5\n2\n10\n-\nBench work Area*\n2 X 2.5\n\n5\n2\n10\nStorage Area (Tool room\n& S/M storage area)\n4 X 5\n\n20\n1\n20\nLearning Resource\nArea*\n5 X 7\n\n35\n\n1\n35\nWash Area /Comfort\nRoom (male & female)\n2.5 X 4\n10\n1\n10\nCirculation Area**\n\n(27.3)\n\nTotal Workshop Area\n\n (160.3~160)\n\nNOTE: Access to and use of equipment /facilities can be provided through cooperative arrangements\nor MOA with other partner companies\n\n--- PDF PAGE 106 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 102\n 3.6 TRAINER’S QUALIFICATIONS FOR MANUAL METAL ARC WELDING (MMAW) NC I\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\n Manual Metal Arc Welding (MMAW) NC II or higher\n• Must be physically fit (including differently-abled person)\n• Must have at least 2 years welding job/industry/ teaching experience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 107 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 103"
