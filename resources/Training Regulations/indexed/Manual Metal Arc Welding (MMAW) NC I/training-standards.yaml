\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality\nOHS and\nenvironmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 80 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 76\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Enhance Self-\nManagement\nSkills\n\n4.1 Set personal and\ncareer goals\n•\nDefine and set personal\ngoals and career goals\n•\nDescribe the SMART\nModel for goal setting\n•\nCreate personal and\ncareer goals using SMART\nModel for goal setting\n•\nExplain and apply the\nprinciples of goal setting\naccording to Locke &\nLatham\n• Discussion\n• Making of\npersonal and\ncareer goals by\nstudents\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n4.2 Recognize\nemotions\n•\nIdentify common positive\nand negative emotions\nmanifested in the\nworkplace\n•\nDistinguish professional\nand non-professional\nbehaviors in the workplace\n•\nRecognize triggers and\nimplications of positive and\nnegative emotions in the\nworkplace\n•\nRespond with appropriate\nemotions and identify\npossible consequences of\ninappropriate emotional\nresponses in a social and\nwork-related context\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 81 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 77\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.3 Describe oneself as\na learner\n3.1.1 Review Kolb’s Theory of\nLearning Styles\n3.1.2 Describe VAK Learning\nStyle Model (Visual,\nAuditory, Kinesthetic)\n3.1.3 Cite learning strategies\nappropriate to specific\ntasks and describe work\npractices that assist\nlearning\n3.1.4 Identify factors and\nstrategies that assist\nlearning\n3.1.5 Apply learning styles to\npositively influence\nschool/work performance\n3.1.6 Use appropriate learning\nstrategies to improve\nstudy habits and learning\n•\nDiscussion\n•\nInteractive\nLecture\n•\n Brainstorming\n•\nSimulation\n•\nDemonstration or\nsimulation with\noral questioning\n•\nCase problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 82 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 78\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Support\nInnovation\n5.1 Identify the need\nfor innovation in\none’s area of work\n• Show mastery of the clear-\ncut definition of innovation\nand its characteristics\n• Identify the need for\ninnovation in one’s work\narea\n• Identify work procedures\nneeding change\n• Contribute to brainstorming\nsessions with co-workers on\nidentifying tasks needing\nchange\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 83 ---\nManual Metal Arc Welding (MMA