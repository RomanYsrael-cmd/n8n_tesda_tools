    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for MANUAL METAL ARC WELDING (MMAW) NC I.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: MANUAL METAL ARC WELDING (MMAW) NC Level NC I\n\nNominal Training Duration:\n47 Hours (Basic Competencies)\n40 Hours (Common Competencies)\n 181 Hours (Core Competencies)\n\n 268 Hours\n 80 Supervised Industry Learning (SIL)\n 348 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involved in applying safety practices,\ninterpreting drawings and sketches, performing basic workshop measurements and computing\nindustry calculations, contributing to Quality System, using hand tools, preparing weld materials\nand consumables, setting up welding equipment, preparing/fit up welding joints fit up weld\nmaterials, repairing welds and welding carbon steel plates using MMAW. This includes\nclassroom learning activities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this qualification\nmust be achieved.\n\n--- PDF PAGE 74 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 70\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken messages\n• Exercise Conciseness in\nreceiving and clarifying\nmessages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n\n1.2 Perform workplace\nduties following\nwritten notices\n• Practice Accuracy in\nfollowing written/ oral\ninstruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling\nwritten communication\n• Practice relaying/\ndisseminating messages/\ninformation\n• Analyze different messages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n\n--- PDF PAGE 75 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 71\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work with\nothers\n2.1 Develop effective\nworkplace\nrelationships\n\n• Read job description and\norganizations policies\nrelevant to work role\n• Read personnel code of\nconduct and discipline\n• Role play on cooperation\nand good relationship\n• Study table of organization\nand identify team members\n• Role play on team work.\n• Role play on receiving\nfeedback from supervisor\n• Role play on providing\nfeedback.\n• Listen to lecture on Valuing\nand exemplifying respect\nand empathy in the\nworkplace\n\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured\nactivity\n• Written Test\n2 Hours\n\n2.2 Contribute to work\ngroup activities\n•\nDiscussion on creative\ncollaboration, social\nperceptiveness and\nproblem sensitivity\n•\nRole play on creative\ncollaboration, social\nperceptiveness and\nproblem sensitivity.\n•\nParticipate in a goal\nsetting activity\n•\nParticipate in planning and\nimplementation of a group\nactivity.\n•\nParticipate in evaluation of\nthe group activity\n\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured\nactivity\n• Written Test\n1 Hour\n\n--- PDF PAGE 76 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 72\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine\nproblems\n3.1 Identify the problem\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\n recognize non-\n standard situations\n- Relevant equipment\nand operational\nprocesses\n- Enterprise goals,\ntargets and measures\n- Enterprise quality\nOHS and\nenvironmental\nrequirement\n- Enterprise information\nsystems and data\ncollation\n- Industry codes and\nstandards\n•\nUse range of formal\nproblem-solving\ntechniques (e.g., planning,\nattention, simultaneous\nand successive processing\nof information)\n•\nIdentify and clarify the\nnature of the problem\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n\n1 Hour\n\n--- PDF PAGE 77 ---\nManual Metal Arc Welding (MMAW) NC I – MEEMAW121 Promulgated (9/14/2021) 73\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Assess fundamental\ncauses of problem\n\n•\nShow mastery of the\ncurrent industry hardware\nand software products and\nservices\n- Show mastery of\nknowledge and\nunderstanding of the\nprocess, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations\n- Relevant equipme