  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a\npromulgated Training Regulations.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to\nindividuals who were assessed as competent in a single unit or cluster of\nrelated units of competency.\n\nCOC 1 – OPERATE AQUACULTURE NURSERY\n•\nConduct site selection and pond preparation –\n• Perform nursery operations\n\nCOC 2 – CONDUCT GROW-OUT OPERATION\n•\nConduct site selection and pond preparation\n• Produce aquaculture commodities\n•\nCarry out post production activities\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued\nthe corresponding National Certificate for the Qualification.\n\n4.1.4 Assessment shall cover all competencies, with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.5 Any of following are qualified to apply for assessment and certification:\n\n4.1.5.1 Graduates of WTR-, NTR--registered programs or formal/non-\nformal/informal including industry-based trainings related to\nhatchery operation.\n4.1.5.2 Experienced workers in hatchery operation.\n\n4.1.6\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)\".\n\n4.1.7 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the relevant unit/s of competency.\n\n--- PDF PAGE 110 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 106\n\n4.1.8 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n4.1.9 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through a\nrecognition/assessment process.\n\n4.1.10 A candidate who fails the assessment for two (2) consecutive times shall\nbe advised to go through a refresher course before taking another\nassessment.\n\n4.1.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n• Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 111 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 107\n\n"
}
