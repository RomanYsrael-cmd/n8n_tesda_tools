e cultured to serve as food of the zooplankton, rotifers and fry Conditioning of Breeders A method wherein the breeders are pampered by providing them nutritious feeds and optimum water conditions to effect the maturity of the fish D.O. (Dissolved Oxygen) Refers to a quantity of oxygen mixed with water in the operation of a paddle wheel or the action of air current. The unit of the D.O. is commonly expressed in part per million (ppm). FCR Food Conversion Ratio is the Total amount of Feeds consumed over the Net Weight of Fish. Egg Fertilization The process of mixing the fish eggs with fish milt either by natural or artificial method. Fish Nursery Refers to smaller unit areas of confinement wherein small fish larvae or fish fry are reared. It may either be in ponds, cages, tanks, etc Fish Pond An aquaculture facility with an earthen bottom surrounded by dikes, with water inlets and drain outlets. Fish Cage Installed in open waters like lakes, dams, rivers and sea-water coves, lagoons, impoundments etc. --- PDF PAGE 114 --- TR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 110 Fish Pen Aquaculture facility in inland areas such as lakes, rivers, darns spring and deep wells devoid of salinity Fry Newly hatched fish. Which are transparent, with big, head and does not in any way resemble the adult fish Grow out Refers to bigger unit areas of confinement where fingerlings are stocked and grown to marketable size. It may either be in ponds, cages and fish pens. Hapa Net An enclosure made of fine mesh net for larvae/fry Hatchery Operation Refers to a large production of larvae/fry Hormones Are agents, (synthetically or naturally produced) used to fasten growth and induce ovulation and to effect sex reversal in fish. Incubator Are hatching facilities where fertilized eggs are hatched. Mature Breeders Fishes that are gravid (female) or with milt (male) Induce Spawning An artificial propagation method through hormone injection to hasten the maturity of the eggs and trigger spawning Larvae Refers to newly hatched fish eggs Liming Application of agricultural lime in ponds to elevate soil ph of acidic ponds Modular Culture Technique The process of culturing fish in grow-out units in short culture period. This requires one nursery unit in for every grow-out culture unit, thus making 4 to 5 harvests per year in one grow-out unit depending on the market size of fish OHS Operating Health Standard Optimum Refers to the best environmental condition provided to the fish to effect maximum production Pathogenic Bacteria Disease causing bacteria Ph Meter Instrument used to measure the hydrogen ions concentration of soil or water Phytoplankton Unicellular microscopic algae suspended in water Sea-Water Refers to waters with at east 32 ppt salinity Satiation feeding Refers to the feed consumption of fish wherein it indicates whether fish is fully filled-up to the gut. Seine Net A type of fishing gear made up of nets, ropes, floats and sinkers used to harvest fish Spawner Mature female fish or shrimp used for breeding. Stress A negative environmental condition caused by biological, physical --- PDF PAGE 115 --- TR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 111 or chemical factors affecting the health, growth and well being of fish Stripping An artificial method by gently pressing the belly of male and female brood fish to release eggs and milt Tanks A culture system that is made up of cement, glass and plastic of different shapes Viable A state or condition where an undertaking or venture in aquaculture results to good performance as to technical and economic profitability of a project Water Quality Refers to the over-all physical, chemical and biological parameters of the water Zooplankton Animal base food protein --- PDF PAGE 116 --- TR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 112 TRAINING REGULATIONS (TR) Qualification Title: Aquaculture (G