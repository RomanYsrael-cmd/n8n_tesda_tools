      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all units of competency in a qualification with a promulgated Training Regulations. 4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in a single unit or cluster of related units of competency. COC 1 – OPERATE AQUACULTURE NURSERY • Conduct site selection and pond preparation – • Perform nursery operations COC 2 – CONDUCT GROW-OUT OPERATION • Conduct site selection and pond preparation • Produce aquaculture commodities • Carry out post production activities 4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification. 4.1.4 Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.5 Any of following are qualified to apply for assessment and certification: 4.1.5.1 Graduates of WTR-, NTR--registered programs or formal/non- formal/informal including industry-based trainings related to hatchery operation. 4.1.5.2 Experienced workers in hatchery operation. 4.1.6 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\". 4.1.7 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency. 4.1.8 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry 4.1.9 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/assessment process. 4.1.10 A candidate who fails the assessment for two (2) consecutive times shall be advised to go through a refresher course before taking another assessment."
    },
    {
      "number": "4.1",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. • Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    }
