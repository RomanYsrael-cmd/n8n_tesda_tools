  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a\npromulgated Training Regulations.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to\nindividuals who were assessed as competent in a single unit or cluster of\nrelated units of competency.\n\nCOC 1 – OPERATE AQUACULTURE NURSERY\n•\nConduct site selection and pond preparation –\n• Perform nursery operations\n\nCOC 2 – CONDUCT GROW-OUT OPERATION\n•\nConduct site selection and pond preparation\n• Produce aquaculture commodities\n•\nCarry out post production activities\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued\nthe corresponding National Certificate for the Qualification.\n\n4.1.4 Assessment shall cover all competencies, with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.5 Any of following are qualified to apply for assessment and certification:\n\n4.1.5.1 Graduates of WTR-, NTR--registered programs or formal/non-\nformal/informal including industry-based trainings related to\nhatchery operation.\n4.1.5.2 Experienced workers in hatchery operation.\n\n4.1.6\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)\".\n\n4.1.7 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the relevant unit/s of competency.\n\n--- PDF PAGE 110 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 106\n\n4.1.8 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n4.1.9 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through a\nrecognition/assessment process.\n\n4.1.10 A candidate who fails the assessment for two (2) consecutive times shall\nbe advised to go through a refresher course before taking another\nassessment.\n\n4.1.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n• Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 111 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 107\n\nANNEX A\n\nReceive and respond to\nworkplace communication\n\nParticipate in workplace\ncommunication\nLead workplace communication\n\nUtilize specialized\ncommunication skill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in a team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general workplace\nproblems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher-order thinking\nprocesses and apply techniques\nin the workplace\nEvaluate higher order thinking\nskills and adjust problem solving\ntechniques\nEnhance self-management\nskills\nDevelop career and life decisions\nWork in a diverse environment\nContribute to the practice of\nsocial justice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport innovation\nContribute to workplace innovation\n\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into work\nprocedures\nAccess and maintain\ninformation\nPresent relevant information\n\nUse information systematically\n\nManage and evaluate usage of\ninformation\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety and\nhealth policies and procedures\nPractice occupational safety and\nhealth policies and procedures\n\nEvaluate occupational safety\nand health work practices\nLead in improvement of\noccupational safety and health\nprogram, policies and\nprocedures\nManage implementation of OSH\nprograms in the workplace\nApply environmental work\nstandards\nExercise efficient and effective\nsustainable practices in the\nworkplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial mindset\nin the workplace\nPractice entrepreneurial skills in\nthe workplace\n\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\n\nDevelop and sustain a high-\nperforming enterprise\n\nBASIC COMPETENCIES\nCOMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR\nAQUACULTURE (GROW-OUT OPERATION) NC II\n\n--- PDF PAGE 112 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 108\n\nApply safety measures in\nfarm operation\nUse farm tools and\nequipment\nPerform estimation and basic\ncalculation\nApply basic first aid\n\nProcess farm wastes\n\nPerform record keeping\nMaintain service records\nConduct Diagnosis\n\nPerform Shop Maintenance\n\nProvide Quality Customer Service\nComply with Quality and\nEthical Standards\nPerform mensuration and\ncalculations\nMaintain tools and equipment\n\nApply food safety and\nsanitation\n\nPrevent and fight fire\n\nComply with Quality and\nEthical Standards\nPerform mensuration and\ncalculations\nMaintain tools and equipment\n\nApply food safety and\nsanitation\n\nPrevent and fight fire\n\nProvide first aid treatment on\nboard\n\nProtect marine environment\n\nComply with emergency\nprocedures\n\nApply safety measures in\nfarm and nursery operations\nUse farm and nursery tools and\nequipment\n\nDevelop and update industry\nknowledge\n\nApply deckhand skills aboard\na fishing vessel\nLoad and unload goods /\ncargo\nAssemble and repair\ndamaged netting\nOperate a vessel of up to 3.0\nGT\nMonitor condition and seaworthiness\nof a vessel\nPerform routine maintenance\ntasks on a small coastal\nvessel\nOperate and troubleshoot\nlow powered marine\nengines\nApply weather information\nwhen navigating a vessel\nContribute to safe navigation\nApply basic food handling and safety\npractices\nSupervise unloading and\nloading of net\nEvaluate net mending\nAdminister and monitor net\nmending\nUnload and load fish and fish\nproducts\nClassify fish and fish products\nOperate Seaweed Nursery\nGrow-out seaweed\nProduce raw dried seaweed\nMarket seaweed\nConduct site selection and pond\npreparation\nPerform nursery operations\nProduce aquaculture\ncommodities\nCarry out post production\nactivities\nConduct pre-operational\naquaculture activities\nOperate tilapia hatchery and nursery\nPerform tilapia grow-out\nConduct preparatory\nactivities\nProduce natural foods\nConduct broodstock\nmanagement and spawning\nManage feeding and maintain good\nhealth of stock\nComplete hatchery operation\n\nCOMMON COMPETENCIES\nCORE COMPETENCIES\n\n--- PDF PAGE 113 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 109\n\nGLOSSARY OF TERMS\n\nAcclimation\nRefers to adjusting the prevailing water condition of fish in an\nenvironment from lower to higher temperature to optimal\ntemperature, from tower or higher salinity to optimal salinity (like\nfrom freshwater to salt water environment), etc.\n\nAverage Body Weight\nIs the total weight of fish over the number of fish\n\nAD-Libitum\nRefers to the mode of providing unlimited fish feeds to fish\n\nAFMA\nAgriculture and Fisheries Modernization Act\n\nAquarium Fish or\nOrnamental fish\nAny fish that can be placed in confinement and with aesthetic\nvalue\n\nArtemia\nLive food commonly used for fish larvae\n\nBFAR\nBureau of Fisheries and Aquatic Resources\n\nBOD\nBiological Oxygen Demand\n\nBrackish Water\nRefers to the mixture of freshwater and sea water naturally\noccurring in estuaries\n\nBrachionus\nA rotifer used as larval feed for marine & freshwater fish larvae\n\nBreeder\nSexually mature fish that are used for breeding\n\nChlorella\nA unicellular green algae cultured to serve as food of the\nzooplankton, rotifers and fry\n\nConditioning of Breeders\nA method wherein the breeders are pampered by providing them\nnutritious feeds and optimum water conditions to effect the\nmaturity of the fish\n\nD.O. (Dissolved Oxygen)\nRefers to a quantity of oxygen mixed with water in the operation\nof a paddle wheel or the action of air current. The unit of the D.O.\nis commonly expressed in part per million (ppm).\n\nFCR\nFood Conversion Ratio is the Total amount of Feeds consumed\nover the Net Weight of Fish.\n\nEgg Fertilization\nThe process of mixing the fish eggs with fish milt either by natural\nor artificial method.\n\nFish Nursery\nRefers to smaller unit areas of confinement wherein small fish\nlarvae or fish fry are reared. It may either be in ponds, cages,\ntanks, etc\n\nFish Pond\nAn aquaculture facility with an earthen bottom surrounded by\ndikes, with water inlets and drain outlets.\n\nFish Cage\nInstalled in open waters like lakes, dams, rivers and sea-water\ncoves, lagoons, impoundments etc.\n\n--- PDF PAGE 114 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 110\n\nFish Pen\nAquaculture facility in inland areas such as lakes, rivers, darns\nspring and deep wells devoid of salinity\n\nFry\nNewly hatched fish. Which are transparent, with big, head and\ndoes not in any way resemble the adult fish\n\nGrow out\nRefers to bigger unit areas of confinement where fingerlings are\nstocked and grown to marketable size. It may either be in ponds,\ncages and fish pens.\n\nHapa Net\nAn enclosure made of fine mesh net for larvae/fry\n\nHatchery Operation\nRefers to a large production of larvae/fry\n\nHormones\nAre agents, (synthetically or naturally produced) used to fasten\ngrowth and induce ovulation and to effect sex reversal in fish.\n\nIncubator\nAre hatching facilities where fertilized eggs are hatched.\n\nMature Breeders\nFishes that are gravid (female) or with milt (male)\n\nInduce Spawning\nAn artificial propagation method through hormone injection to\nhasten the maturity of the eggs and trigger spawning\n\nLarvae\nRefers to newly hatched fish eggs\n\nLiming\nApplication of agricultural lime in ponds to elevate soil ph of acidic\nponds\n\nModular Culture Technique\nThe process of culturing fish in grow-out units in short culture\nperiod. This requires one nursery unit in for every grow-out culture\nunit, thus making 4 to 5 harvests per year in one grow-out unit\ndepending on the market size of fish\n\nOHS\nOperating Health Standard\n\nOptimum\nRefers to the best environmental condition provided to the fish to\neffect maximum production\n\nPathogenic Bacteria\nDisease causing bacteria\n\nPh Meter\nInstrument used to measure the hydrogen ions concentration of\nsoil or water\n\nPhytoplankton\nUnicellular microscopic algae suspended in water\n\nSea-Water\n\nRefers to waters with at east 32 ppt salinity\nSatiation feeding\nRefers to the feed consumption of fish wherein it indicates whether\nfish is fully filled-up to the gut.\n\nSeine Net\nA type of fishing gear made up of nets, ropes, floats and sinkers\nused to harvest fish\nSpawner\n\nMature female fish or shrimp used for breeding.\nStress\nA negative environmental condition caused by biological, physical\n\n--- PDF PAGE 115 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 111\n\nor chemical factors affecting the health, growth and well being of\nfish\n\nStripping\nAn artificial method by gently pressing the belly of male and\nfemale brood fish to release eggs and milt\n\nTanks\nA culture system that is made up of cement, glass and plastic of\ndifferent shapes\n\nViable\nA state or condition where an undertaking or venture in\naquaculture results to good performance as to technical and\neconomic profitability of a project\n\nWater Quality\nRefers to the over-all physical, chemical and biological parameters\nof the water\n\nZooplankton\n\nAnimal base food protein\n\n--- PDF PAGE 116 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 112\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAquaculture (Grow-out Operation) NC II\nQualification Code:\nAFFAGO220\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment Circular\n(TESDA Circular/\nImplementing Guidelines)\n00\nDocument\nCreated\nAquaculture NC II\nTBR No. 2004-21/\n12/09/2004\nNot applicable\n\nDocument\nSuperseded\nAquaculture NC II\nTBR No.2004-21/\n12/09/2004\nNot applicable\n00\nDocument\nAmended\nAquaculture (Hatchery\nOperation) NC II\nTBR No. 2020-23/\n06/09/2020\nTESDA Circular\nNo. 106 series of 2020\n00\nDocument\nAmended\nAquaculture (Grow-out\nOperation) NC II\nTBR No. 2020-24/\n06/09/2020\nTESDA Circular\nNo. 101 series of 2020\n00\nDocument\nAmended\nAquaculture (Tilapia\nCulture) NC II\nTBR No. 2020-25/\n06/09/2020\nTESDA Circular\nNo. 107 series of 2020\nLegend: *Description Types\n-Document Created\n\n-Document Amended\n-Document Superseded\n\n--- PDF PAGE 117 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 113\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nrecognize the commitment of industry stakeholders who shared their time and expertise for the\ndevelopment of this Training Regulations. This undertaking was also made possible through\nthe support by Department of Agriculture- Bureau of Fisheries and Aquatic Resources through\nBureau of Fisheries and Aquatic Resources (BFAR) – Region X.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nMR. RODRIGO L. BASALLO\nTechnical Expert\nPhilippine Association of Fish Producers,\nInc.(PAFPI)\n\nMR. ROSSELLER G. SABILLA\nTechnical Expert\nUniversity of Naawan\nMisamis Oriental\nMR. ANTONIO BATISTIL\nTechnical Expert\nThree Light Aqua Resources, Inc.\nMR. DING GILMAR C. SUBSUBAN\nTechnical Expert\nBureau of Fisheries and Aquatic\nResources\n\nMR. JOSEPH MARTIN H. BORROMEO\nTechnical Expert\nPhilippine Association of Fish Producers,\nInc.\n\nMR. EUGINIO B. TOMAQUIN\nTechnical Expert\nThree Light Aqua Resources, Inc.\nMR. JOSE PACLIBARE\nTechnical Expert\nBureau of Fisheries and Aquatic Resources\n\nTHE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING REGULATION:\n\nCAGAYAN VALIDATORS:\n\nMS. ARLENE B. NOVO\nProvincial Agricultural Office\nMisamis Oriental\n\nMS. MICHIL K. GANOB\nOversea Feeds Corps.\nSan Fernando, Cebu City\nMR. RICHARD ALLAN G. BIONGCOG\nBalingasag Aquaculture\nMisamis, Oriental\n\nMR. ARMAMENTO C. JESUS\nOversea feeds Corps.\nSan Fernando, Cebu City\nMR. ENOCH GUSTILO\nBalingasag Aquaculture\nMisamis, Oriental\nMR. ARNIL C. EMATA\nCollege of Agriculture, Xavier\nUniversity\nCagaya de Oro City\nMR. MARCELINO S. LIMCHU\nJULMAR\nCagayan de Oro\n\n--- PDF PAGE 118 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 114\n\nDAGUPAN VALIDATORS:\n\nMS. JULIET P. EDADES\nProvincial Aquaculture Office\nDagupan City\nMR. FLORENCIO M. URBANO\nTESDA-Pangsaninan Technological\nInstitute\nBinmaley, Pangasinan\n\nMR. FREDERICK D. CARBONELL\nBFAR- NIFTDC\nDagupan City\n\nMR. JOEMARK C. OCLIMA\nBFAR-NIFTDC\nDagupan City\nMR. RICARDO R. BILOG\nBFAR- NIFTDC\nDagupan City\n\nMR. EDUARDO S. MARAMBA\nMaramba Farms\nDagupan City\nMR. CRISOSTOMO R. BILOG\nBFAR-NIFTDC\nDagupan City\n\nMR. CARLOS B. CARIZAL\nTESDA-Bangui Institute of Technology\nIlocos Norte\nMR. DOMINADOR V. BILOG, JR,\nBFAR-NIFTDC\nDagupan City\nMR. ARMANDO C. GARCIA\nPangasinan State University-Binam