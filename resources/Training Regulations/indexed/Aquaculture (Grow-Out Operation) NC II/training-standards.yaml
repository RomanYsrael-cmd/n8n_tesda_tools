d\n•\nDiscussion on Necessary Skills in\nresponse to changing\nenvironmental policies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n• Discussion of Environmental\nProtection and Resource Efficiency\nTargets\n• Analysis on the Relevant Work\nProcedure\n• Lecture\n• Group Discussion\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 80 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 76\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.3 Convey\ninefficient and\nineffective\nenvironmental\npractices\n• Identification of (re)training needs\nand usage of environment friendly\nmethods and technologies\n• Identification of environmental\ncorrective actions\n• Practicing Environment Awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n• Determine best entrepreneurial\npractices\n• Discussion on Quality procedures\nand practices\n• Explain cost consciousness in\nresource utilization\n• Interview\n• Lecture/Discussion\n• Interview\n• Written Test\n• Interview\n1 Hour\n\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best\npractices\n• Lecture/Discussion • Written Test\n• Interview\n1 Hour\n\n9.3 Implement cost-\neffective\noperations\n• Apply the preservation,\noptimization and judicious use of\nworkpla