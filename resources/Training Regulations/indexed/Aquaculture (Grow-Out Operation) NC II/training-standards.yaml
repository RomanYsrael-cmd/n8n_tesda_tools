rculation areas as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building (permanent)\n\n•\nStudent/Trainee\nWorking Space\n7.00 X 9.00\n63.00 sq.m\n\n•\nLearning Resource\nCenter\n5.10 X 6.00\n30.60 sq.m\n\n•\nWash room\n1.60 X 1.20\n\n1.92 sq.m\n\n•\nComfort room\nmale: 2.30 X1.20\nfemale:2.30 X1.80\nPWD: 1.60 X1.80\n9.78 sq.m\n\n•\nFacilities/Equipmen\nt/ Circulation Area\n(30% of teaching\naccommodation)\n1.90 X3.00\n5.70 sq.m\n\n•\nStore Room\n1.90 X4.50\n8.55 sq.m\n119.55 sq. m.\nB. Experimental\nAquaculture Farm\n\n10,000 sq. m.\nEarthen Ponds\nGrow out area\n\nPond\n\nPen\n\nCage\n\nTOTAL AREA\n\n10,119.55 sq.m.\n NOTE: Access to and use of equipment /facilities can be provided through cooperative\narrangements or MOA with other partner- farms/companies.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR AQUACULTURE (Grow-out Operation)\nNC II\n\n• Must be a holder of National TVET Trainer Certification (NTTC) I in Aquaculture\n(Grow-out Operation) NC Il\n• Must have at least 2 years’ job/industry experience within the last five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the achievements\nof the requirements of the qualification to enable the trainer make judgement whether the\ntrainee is competent or not competent.\n\n--- PDF PAGE 109 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 105"
