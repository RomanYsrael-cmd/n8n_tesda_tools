      "source_text": ", EQUIPMENT AND, MATERIALS\n\nAQUACULTURE (GOW-OUT OPERATION) NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Aquaculture (Grow - out Operation) NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their availability\nin the local market.\n\nA.\nFULL QUALIFICATION\nTOOLS\nQTY\nDESCRIPTION\n5 pcs.\nScythe\n5 pcs.\nDigging blade\n5 pcs.\nBolo\n5 pcs.\nHammer\n5 pcs.\nWheel borrow\n5 pcs.\nThumper\n5 pcs.\nScissor\n5 pcs.\nSaw\n5 pcs.\nSteel Tape\n5 pcs.\nTry Square\n5 pcs.\nChisel\n5 pcs.\nShovel\n5 pcs.\nRake\n5 pcs.\nSickle\n5 pcs.\nScrewdrivers\n5 pcs.\nFliers\n5 pcs.\nWrench\n5 pcs.\nRuler\n5 pcs.\nCaliper\n5 pcs.\nBackpack Sprayer\n5 pcs.\nCalculator\n5 units\nGrader\n5 pcs.\nKnife\n5 pcs.\nAbacus\n5 pcs.\nAdjustable range\n5 pcs.\nCrab trap\n5 pcs.\nTransfer crate (70kg capacity)\n\n--- PDF PAGE 104 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 100\n\nEQUIPMENT\nQTY\nDESCRIPTION\n2 units\nWeighing scale\n5 pcs.\npH meter\n5 pcs.\nRefractometer\n10pcs.\nThermometer\n5 pcs.\nHydrometer\n3 units\nOxygen tank with Oxygen hose\n5 pcs.\nPortable aerators\n1 unit\nStandby generator\n\nPPEs\n25pairs\nGloves\n25pairs\nBoots\n25pcs.\nMasks\n25pcs.\nLong Sleeve Shirt\n25pcs.\nHat\n1 unit\nChilling tank (500L)\n1 unit\nChilling boat*\n1 unit\nTruck*\n1 unit\nPump boat*\n1 unit\nPaddle boat*\n1 unit\nConditioning cage (10X10m)\n1 unit\nTransfer cage(5X5X2m)\n3 units\nOxygen regulator\n1 pc.\nDO meter\n1 unit\nHarvesting raft*`\n2 unit\nSorting table\n\nMATERIALS\nQTY\nDESCRIPTION\n1-Li.\nFluids\n1-Li.\nLubricants\n4 sacks\nOrganic and inorganic fertilizers\n2 sacks\nLime\nBfts\nLumber\n1 pc.\nCast Nets\n2 packs\nVegetable Seeds\n4 pcs.\nHapa nets of different sizes\n5 pcs.\nBamboo poles\nrolls\nRopes of different sizes\n1L\npesticides\n100 pcs\nPla