als are \nobserved according \nto manual and work \nrequirements. \n3.3 Constructive \ncontributions to \noffice operations are \nmade according to \nenterprise \nrequirements. \n3.4 Ability to work within \none’s allotted time \nand finances is \nsustained.  \n3.1 Optimization of \nworkplace resources \n3.2 5S procedures and \nconcepts \n3.3 Criteria for cost-\neffectiveness \n3.4 Workplace \nproductivity \n3.5 Impact of \nentrepreneurial \nmindset to \nworkplace \nproductivity \n3.6 Ways in fostering \nentrepreneurial \nattitudes: \n3.7 Quality-\nconsciousness \n3.8 Safety-\nconsciousness \n3.1 Implementing \npreservation and \noptimizing \nworkplace \nresources \n3.2 Observing \njudicious use of \nworkplace tools, \nequipment and \nmaterials \n3.3 Making \nconstructive \ncontributions to \noffice operations \n3.4 Sustaining ability \nto work within \nallotted time and \nfinances\n\n--- PDF PAGE 39 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 35 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.Good practices \nMay include: \n1.1 Economy in use of resources \n1.2 Documentation of quality practices  \n2.Resources utilization \nMay include: \n2.1 Consumption/ use of consumables \n2.2 Use/Maintenance of assigned equipment and \nfurniture \n2.3 Optimum use of allotted /available time"
