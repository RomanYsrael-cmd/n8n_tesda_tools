        "source_text": "--- PDF PAGE 61 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 57 \n \nUNIT OF COMPETENCY \n: \nPRODUCE AQUACULTURE COMMODITIES \n \n \n \nUNIT CODE \n: \nAFF622316 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude \nrequired to conduct stocking, conduct feeding activities, \nmonitor growth progress, perform harvesting activities. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Conduct \nstocking \nactivities \n1.1 Stocks are assessed \nbased on the quality \nof fingerlings \n1.2 Stocks are \nacclimatized based on \nGAqP \n1.3 Stocks are released \nfollowing industry \nprocedures \n1.1 Computation \nstocking density  \n1.2 Process of \nacclimatization \n(salinity, \ntemperature) \n1.3 Survival rate \nestimation \n1.1 Assessing of \nstocks \n1.2 Acclimatizing of \nstocks \n1.3 Releasing of \nstocks \n2. Conduct \nfeeding \nactivities  \n2.1 Feed type is \ndetermined based on \nDays of Culture (DOC) \n2.2 Amount of feeds are \ncomputed according to \nestimated biomass \n2.3 Feeds are prepared \nand transported from \nwarehouse to grow \nout area \n2.4 Feeding is conducted \nbased on workplace \nprocedure \n2.5 Feeding is adjusted \nbased on growth \nprogress \n2.6 Feed forecasting is \nperformed following \nstandard industry \npractices. \n2.7 Safety practices are \napplied following \nOSHS. \n2.1 Types of feeds \n2.2 Computation of \nfeed ration \n2.3 Handling of feeds \n2.4 Feeding \nprocedures \n2.5 Growth stage of \naquaculture \nspecies \n2.6 Feeding \nadjustments \n2.7 Feed forecasting \n2.8 Feeding guide \n2.9 GAqP \n2.10 OSHS \n2.1 Determining feed \ntype \n2.2 Determining feed \nvolume \n2.3 Preparing and \ntransporting of \nfeeds \n2.4 Feeding of \nfingerlings \n2.5 Performing feed \nforecasting \n2.6 Using feeding \nguide \n2.7 Swimming and \ndiving \n2.8 Applying safety \npractices\n\n--- PDF PAGE 62 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 58 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Monitor \ngrowth \nprogress \n3.1 Representative \nsampling is \nconducted based on \nestablished industry \npractice. \n3.2 Estimated average \nbiomass is \ncompared to ideal \naverage body \nweight \n3.3 Computed biomass \nis used to adjust \nfeed requirement  \n3.4 Resampling is \nperformed following \nestablished \nenterprise \nprocedure \n3.5 Water quality is \nmonitored following \nindustry procedures. \n3.6 Safety practices are \napplied following \nOSHS. \n3.1 Procedure of \nrepresentative \nsampling \n3.2 Estimation of \naverage biomass \n3.3 Using of \ncomputed \nbiomass \n3.4 Use of weighing \nscale \n3.5 Resampling \nmethod \n3.6 Feed conversion \nratio (FCR) \n3.7 Feeding guide \n3.8 Use of physico-\nchemical \nparameter \ninstruments \n3.1 Conducting \nrepresentative \nsampling \n3.2 Determining \nestimated \naverage body \nweight \n3.3 Performing \nanalysis \n3.4 Adjusting feeding \n3.5 Performing \nresampling \n3.6 Utilizing weighing \nscale \n3.7 Using of feeding \nguide \n3.8 Using of physico-\nchemical \nparameter \ninstruments \n3.9 Swimming and \ndiving \n3.10 Applying safety \npractices \n4.Perform \nharvesting \nactivities \n4.1 Harvesting tools, \nmaterials and \nequipment are \nprepared according to \nwork requirements \n4.2 Harvesting methods \nare applied based on \nestablished enterprise \npractices . \n4.3 Volume of harvest is \nrecorded according to \nweight and quantity \n4.4 Safety measures are \npracticed following \nOSHS \n4.1. Types of \nharvesting tools, \nmaterials and \nequipment \n4.2. Time of harvesting \n4.3. Weather condition \n4.4. Tide Table \n4.5. Established \ncriteria in \nsegregating and \nsorting \n4.6. Uses and \nfunctions of tools, \nmaterials and \nequipment \n4.7. Preparation of \ntools, materials \nand equipment \n4.8. Different \nharvesting \nmethods \n4.9. Record keeping \n4.10. Quantity of ice \n4.11. Volume of \nharvest \n4.12. Food Safety Act \n4.13. OSHS \n4.1. Preparing of \nharvesting tools, \nmaterials and \nequipment \n4.2. Applying \nharvesting \nmethods \n4.3. Practicing Food \nSafety Act \n4.4. Recording of \nvolume of \nharvest \n4.5. Practicing safety \nmeasures \n4.6. Swimming and \ndiving\n\n--- PDF PAGE 63 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 59 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Grow –out area  \nGrow –out area includes: \n1.1 Cage \n1.2 Pond \n1.3 Pen \n2. Harvesting tools, materials \nand equipment \nHarvesting tools, materials and equipment may include: \nMaterials:   \n2.1 Scoop net \n2.2 Sein nets \n2.3 Styrofoam boxes \n2.4 Chilling tanks \n2.5 Ice (cracked and crushed) \nTools: \n2.6 Bolo \n2.7 Crab trap \n2.8 Transfer crate \n2.9 Knife \n2.10 Pair of scissors \nEquipment: \n2.11 Weighing scale \n2.12 Paddle boat \n2.13 Chilling tank \n2.14 Chilling boat \n2.15 Transfer cage \n2.17 Harvesting raft \n2.18 Motorized boat \n2.19 Transport vehicle \n3. Harvesting methods \nHarvesting methods may include: \n3.1 Scooping \n3.2 Lifting \n3.3 Seining \n3.4 Casting \n3.5 Picking \n3.6 Draining\n\n--- PDF PAGE 64 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 60 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Conduct feeding activities \n1.2 Monitor growth progress \n1.3 Monitor grow out cage \n1.4 Perform harvesting activities \n2.  Resource Implications \n \nThe following resources MUST be provided: \n2.1 Actual or simulated grow out cage, pen and pond areas  \n2.2 Tools, materials and equipment relevant to the task to be \ndemonstrated \n2.3 PPEs \n2.4 Manuals and references \n3.  Methods of Assessment \nCompetency may be assessed through: \n3.1 Written exam \n3.2 Demonstration \n3.3 Oral questioning \n4.  Context of Assessment \n4.1. Competency maybe assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
