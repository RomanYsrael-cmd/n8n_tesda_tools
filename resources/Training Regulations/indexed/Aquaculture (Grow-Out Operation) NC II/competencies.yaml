        "source_text": "--- PDF PAGE 11 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 7 \n \nUNIT OF COMPETENCY :  WORK IN A TEAM ENVIRONMENT \n \nUNIT CODE                      : \n400311211 \n \nUNIT DESCRIPTOR         : \nThis unit covers the skills, knowledge and attitudes to identify one’s  \nroles and responsibilities as a member of a team. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Describe \nteam role \nand scope \n1.1 The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation \n1.2 Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources  \n1.1 Group structure \n1.2 Group development \n1.3 Sources of \ninformation \n1.1 Communicating \nwith others, \nappropriately \nconsistent with \nthe culture of the \nworkplace \n1.2 Developing ways \nin improving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization \n2. Identify \none’s role \nand \nresponsibilit\ny within a \nteam \n2.1 Individual roles and \nresponsibilities within \nthe team environment \nare identified \n2.2 Roles and objectives \nof the team is \nidentified from \navailable sources of \ninformation  \n2.3 Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified based on \nteam discussions and \nappropriate external \nsources \n2.1 Team roles and \nobjectives  \n2.2 Team structure and \nparameters \n2.3 Team development \n2.4 Sources of \ninformation \n \n2.1 Communicating \nwith others, \nappropriately \nconsistent with \nthe culture of the \nworkplace \n2.2 Developing ways \nin improving work \nstructure and \nperforming \nrespective roles in \nthe group or \norganization \n3. Work as a  \nteam \nmember \n3.1 Effective and \nappropriate forms of \ncommunications are \nused and interactions \nundertaken with team \nmembers based on \ncompany practices.  \n3.2 Effective and \nappropriate \ncontributions made to \ncomplement team \nactivities and \n3.1 Communication \nProcess \n3.2 Workplace \ncommunication \nprotocol \n3.3 Team planning and \ndecision making \n3.4 Team thinking \n3.5 Team roles \n3.6 Process of team \ndevelopment \n3.1 Communicating \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n3.2 Interacting \neffectively with \nothers \n3.3 Deciding as an \nindividual and as \na group using \ngroup think\n\n--- PDF PAGE 12 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 8 \n \nobjectives, based on \nworkplace context \n3.3 Protocols in reporting \nare observed based \non standard company \npractices.  \n3.4 Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of \nteam’s role and \nobjectives \n3.7 Workplace context \n \n \nstrategies and \ntechniques \n3.4 Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 13 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 9 \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Role and objective of team  May include but not limited to: \n1.1. \nWork activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement \nmaybe demonstrated on the job, either \nindividually or in a team environment \n2. Sources of information \nMay include but not limited to: \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s specifications \nand instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \nMay include but not limited to: \n3.1. \nWork procedures and practices \n3.2. \nConditions of work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, \nsafe handling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 14 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 10 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Worked in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n2. Resource Implications \nThe following resources should be provided: \n2.1 Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2 Materials relevant to the proposed activity or tasks \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Role play involving the participation of individual \nmember to the attainment of organizational goal \n3.2 Case studies and scenarios as a basis for discussion \nof    issues and strategies in teamwork \n3.3 Socio-drama and socio-metric methods \n3.4 Sensitivity techniques \n3.5 Written Test \n4. Context for Assessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while task are being \nundertaken whether individually or in group\n",
