        "source_text": "--- PDF PAGE 37 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 33 \n \nUNIT OF COMPETENCY :  PRACTICE ENTREPRENEURIAL SKILLS IN THE \nWORKPLACE \n \nUNIT CODE                      : \n400311218 \n \nUNIT DESCRIPTOR         : \nThis unit covers the outcomes required to apply \nentrepreneurial workplace best practices and implement \ncost-effective operations. \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Apply \nentrepreneurial \nworkplace best \npractices \n  \n1.1 Good practices \nrelating to \nworkplace \noperations are \nobserved and \nselected following \nworkplace policy. \n1.2 Quality procedures \nand practices are \ncomplied with \naccording to \nworkplace \nrequirements.  \n1.3 Cost-conscious \nhabits in resource \nutilization are \napplied based on  \nindustry standards.  \n1.1 Workplace best \npractices, policies \nand criteria \n1.2 Resource utilization \n1.3 Ways in fostering \nentrepreneurial \nattitudes: \n1.3.1 Patience \n1.3.2 Honesty \n1.3.3 Quality-\nconsciousne\nss \n1.3.4 Safety-\nconsciousne\nss \n1.3.5 Resourcefuln\ness  \n1.1 Communication \nskills \n1.2 Complying with \nquality \nprocedures \n \n \n \n2. Communicate \nentrepreneurial \nworkplace best \npractices  \n \n2.1 Observed good \npractices relating to \nworkplace \noperations are \ncommunicated to \nappropriate \nperson. \n2.2 Observed quality \nprocedures and \npractices are \ncommunicated to  \nappropriate person \n2.3 Cost-conscious \nhabits in resource \nutilization are \ncommunicated \nbased on industry \nstandards.  \n2.1 Workplace best \npractices, policies \nand criteria \n2.2 Resource utilization \n2.3 Ways in fostering \nentrepreneurial \nattitudes: \n2.3.1 Patience \n2.3.2 Honesty \n2.3.3 Quality-\nconsciousne\nss \n2.3.4 Safety-\nconsciousne\nss \n2.3.5 Resourcefuln\ness  \n2.1 Communication \nskills \n2.2 Complying with \nquality \nprocedures \n2.3 Following \nworkplace \ncommunication \nprotocol\n\n--- PDF PAGE 38 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 34 \n \n3. Implement cost-\neffective \noperations \n3.1 Preservation and \noptimization of \nworkplace resources \nis implemented in \naccordance with \nenterprise policy \n3.2 Judicious use of \nworkplace tools, \nequipment and \nmaterials are \nobserved according \nto manual and work \nrequirements. \n3.3 Constructive \ncontributions to \noffice operations are \nmade according to \nenterprise \nrequirements. \n3.4 Ability to work within \none’s allotted time \nand finances is \nsustained.  \n3.1 Optimization of \nworkplace resources \n3.2 5S procedures and \nconcepts \n3.3 Criteria for cost-\neffectiveness \n3.4 Workplace \nproductivity \n3.5 Impact of \nentrepreneurial \nmindset to \nworkplace \nproductivity \n3.6 Ways in fostering \nentrepreneurial \nattitudes: \n3.7 Quality-\nconsciousness \n3.8 Safety-\nconsciousness \n3.1 Implementing \npreservation and \noptimizing \nworkplace \nresources \n3.2 Observing \njudicious use of \nworkplace tools, \nequipment and \nmaterials \n3.3 Making \nconstructive \ncontributions to \noffice operations \n3.4 Sustaining ability \nto work within \nallotted time and \nfinances\n\n--- PDF PAGE 39 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 35 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.Good practices \nMay include: \n1.1 Economy in use of resources \n1.2 Documentation of quality practices  \n2.Resources utilization \nMay include: \n2.1 Consumption/ use of consumables \n2.2 Use/Maintenance of assigned equipment and \nfurniture \n2.3 Optimum use of allotted /available time \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to identify and sustain cost-\neffective activities in the workplace  \n1.2 Demonstrated ability to practice entrepreneurial \nknowledge, skills and attitudes in the workplace. \n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated or actual workplace \n2.2 Tools, materials and supplies needed to demonstrate \nthe required tasks  \n2.3 References and manuals \n2.3.1 Enterprise procedures manuals \n2.3.2 Company quality policy \n3. Methods of Assessment \nCompetency in this unit should be assessed through: \n3.1 Interview \n3.2 Third-party report \n4.Context of Assessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
