ocumented, ranked \nand presented to \nappropriate person \nfor decision \n2.1 Current industry \nhardware and \nsoftware products \nand services \n2.2 Industry service \nand helpdesk \npractices, \nprocesses and \nprocedures \n2.3 Operating systems \n2.4 Industry standard \ndiagnostic tools \n2.5 Malfunctions and \nresolutions. \n2.6 Root cause \nanalysis \n2.1 Identifying current \nindustry hardware \nand software \nproducts and \nservices \n2.2 Identifying \nservices and \nhelpdesk \npractices, \nprocesses and \nprocedures. \n2.3 Identifying \noperating system \n2.4 Identifying current \nindustry standard \ndiagnostic tools \n2.5 Describing \ncommon \nmalfunctions and \nresolutions. \n2.6 Determining the \nroot cause of a \nroutine \nmalfunction \n3. Recommend \nsolutions to \nproblems \n3.1 Implementation of \nsolutions are \nplanned \n3.2 Evaluation of \nimplemented \nsolutions are planned \n3.3 Recommended \nsolutions are \ndocumented and \nsubmit to appropriate \nperson for \nconfirmation \n3.1 Standard \nprocedures \n3.2 Documentation \nproduce  \n3.1 Producing \ndocumentation \nthat recommends \nsolutions to \nproblems \n3.2 Following \nestablished \nprocedures\n\n--- PDF PAGE 17 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 13 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Problems/Procedural \nProblem \n \nMay include but not limited to: \n1.1 \nRoutine/non – routine processes and quality \nproblems \n1.2 \nEquipment selection, availability and failure \n1.3 \nTeamwork and work allocation problem \n1.4 \nSafety and emergency situations and incidents \n1.5 \n Work-related problems outside of own work area \n2. Appropriate person \nMay include but not limited to: \n2.1 \nSupervisor or manager \n2.2 \nPeers/work colleagues \n2.3 \nOther members of the organization \n3. \nDocument \n \nMay include but not limited to: \n3.1 \nElectronic mail \n3.2 \nBriefing notes \n3.3 \nWritten report \n3.4 \nEvaluation report \n4. \nPlan  \n \nMay include but not limited to: \n4.1 \nPriority requirements \n4.2 \nCo-ordination and feedback requirements \n4.3 \nSafety requirements \n4.4 \nRisk assessment \n4.5 \nEnvironmental requirements\n\n--- PDF PAGE 18 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 14 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined the root cause of a routine problem \n1.2 Identified solutions to procedural problems. \n1.3 Produced documentation that recommends \nsolutions to problems. \n1.4 Followed established procedures. \n1.5 Referred unresolved problems to support persons. \n2. Resource Implications \n2.1. Assessment will require access to a workplace over \nan extended period, or a suitable method of \ngathering evidence of operating ability over a range \nof situations. \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nCase Formulation \n3.2 \nLife Narrative Inquiry \n3.3 \nStandardized test \nThe unit will be assessed in a holistic manner as is \npractical and may be integrated with the assessment of \nother relevant units of competency. Assessment will occur \nover a range of situations, which will include disruptions to \nnormal, smooth operation. Simulation may be required to \nallow for timely assessment of parts of this unit of \ncompetency. Simulation should be based on the actual \nworkplace and will include walk through of the relevant \ncompetency components.  \n4. Context for Assessment \n4.1 Competency may be assessed individually in the \nactual workplace or simulation environment in \nTESDA accredited institutions.\n",
