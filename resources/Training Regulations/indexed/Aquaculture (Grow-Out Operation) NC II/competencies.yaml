        "source_text": "--- PDF PAGE 19 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 15 \n \nUNIT OF COMPETENCY :  DEVELOP CAREER AND LIFE DECISIONS \n \nUNIT CODE                      : \n400311213 \n \nUNIT DESCRIPTOR         : \nThis unit covers the knowledge, skills, and attitudes in \nmanaging one’s emotions, developing reflective practice, \nand \nboosting \nself-confidence \nand \ndeveloping \nself-\nregulation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Manage one’s \nemotion \n1.1 Self-management \nstrategies are \nidentified \n1.2 Skills to work \nindependently and to \nshow initiative, to be \nconscientious, and \npersevering in the \nface of setbacks and \nfrustrations are \ndeveloped \n1.3 Techniques for \neffectively handling \nnegative emotions \nand unpleasant \nsituation in the \nworkplace are \nexamined \n \n \n1.1 Self-management \nstrategies that \nassist in regulating \nbehavior and \nachieving personal \nand learning goals \n(e.g. Nine self-\nmanagement \nstrategies \naccording to Robert \nKelley) \n1.2 Enablers and \nbarriers in \nachieving personal \nand career goals \n1.3 Techniques in \nhandling negative \nemotions and \nunpleasant situation \nin the workplace \nsuch as frustration, \nanger, worry, \nanxiety, etc. \n1.1 Managing \nproperly one’s \nemotions and \nrecognizing \nsituations that \ncannot be \nchanged and \naccept them and \nremain \nprofessional \n1.2 Developing self-\ndiscipline, \nworking \nindependently \nand showing \ninitiative to \nachieve personal \nand career goals \n1.3 Showing \nconfidence, and \nresilience in the \nface of setbacks \nand frustrations \nand other \nnegative \nemotions and \nunpleasant \nsituations in the \nworkplace \n2. Develop \nreflective \npractice \n2.1 Personal strengths \nand achievements, \nbased on self-\nassessment \nstrategies and \nteacher feedback are \ncontemplated \n2.2 Progress when \nseeking and \nresponding to \nfeedback from \nteachers to assist \n2.1 Basic SWOT \nanalysis \n2.2 Strategies to \nimprove one’s \nattitude in the \nworkplace \n2.3 Gibbs’ Reflective \nCycle/Model \n(Description, \nFeelings, \nEvaluation, \nAnalysis, \n2.1 Using the basic \nSWOT analysis \nas self-\nassessment \nstrategy \n2.2 Developing \nreflective practice \nthrough \nrealization of \nlimitations, likes/ \ndislikes; through\n\n--- PDF PAGE 20 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 16 \n \nthem in consolidating \nstrengths, addressing \nweaknesses and \nfulfilling their potential \nare monitored \n2.3 Outcomes of \npersonal and \nacademic challenges \nby reflecting on \nprevious problem \nsolving and decision \nmaking strategies \nand feedback from \npeers and teachers \nare predicted \nConclusion, and \nAction plan) \nshowing of self-\nconfidence  \n2.3 Demonstrating \nself-acceptance \nand being able to \naccept challenges \n \n3. Boost self-\nconfidence and \ndevelop self-\nregulation \n3.1 Efforts for continuous \nself-improvement are \ndemonstrated \n3.2 Counter-productive \ntendencies at work \nare eliminated \n3.3 Positive outlook in life \nare maintained.   \n3.1 Four components of \nself-regulation \nbased on Self-\nRegulation Theory \n(SRT) \n3.2 Personality \ndevelopment \nconcepts \n3.3  Self-help concepts \n(e. g., 7 Habits by \nStephen Covey, \ntransactional \nanalysis, psycho-\nspiritual concepts) \n3.1 Performing \neffective \ncommunication \nskills – reading, \nwriting, \nconversing skills \n \n3.2 Showing affective \nskills – flexibility, \nadaptability, etc. \n \n3.3 Self-assessment \nfor determining \none’s strengths \nand weaknesses\n\n--- PDF PAGE 21 ---\nTR - Aquaculture (Grow-out Operation) NCII  Revision 00             Promulgated     (06/09/2020)                                                Page 17 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Self-management \nstrategies \nMay include but not limited to: \n1.1 \nSeeking assistance in the form of job coaching or \nmentoring  \n1.2 \nContinuing dialogue to tackle workplace \ngrievances \n1.3 \nCollective negotiation/bargaining for better \nworking conditions \n1.4 \nShare your goals to improve with a trusted co-\nworker or supervisor \n1.5 \nMake a negativity log of every instance when you \ncatch yourself complaining to others \n1.6 \nMake lists and schedules for necessary activities \n2. Unpleasant situation \nMay include but not limited to: \n2.1 \nJob burn-out \n2.2 \nDrug dependence \n2.3 \nSulking \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Express emotions appropriately \n1.2 Work independently and show initiative \n1.3 Consistently demonstrate self-confidence and self-\ndiscipline  \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to workplace and resource s \n2.2. Case studies  \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration or simulation with oral questioning \n3.2. Case problems involving work improvement and \nsustainability issues \n3.3. Third-party report \n4. Context for Assessment \n4.1. Competency assessment may occur in workplace \nor any appropriately simulated environment\n",
