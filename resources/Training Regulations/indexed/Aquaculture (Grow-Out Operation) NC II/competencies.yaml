  "source_section_text": "SECTION 1\nAQUACULTURE (GROW-OUT OPERATION) NC II QUALIFICATION\n\nThe AQUACULTURE (GROW-OUT OPERATION) NC II Qualification consists of\ncompetencies that a person must achieve to conduct site selection and pond preparations,\nperform nursery operations, produce aquaculture commodities and carry out post -\nproduction activities. This also includes competencies to grow commercially viable\naquaculture species in brackish, freshwater and marine ecosystems, except tilapia and\nseaweed.\n\nThis Qualification is packaged from the competency` map of the Agriculture,\nForestry and Fishery Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCode\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the workplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCode\nCOMMON COMPETENCIES\nAFF 321201\nApply safety measures in farm operations\nAFF321202\nUse farm tools and equipment\nAFF321203\nPerform estimation and basic calculation\n\nCode\nCORE COMPETENCIES\nAFF622314\nConduct site selection and pond preparations\nAFF622315\nPerform nursery operations\nAFF622316\nProduce aquaculture commodities\nAFF622317\nCarry out post-production activities\n\nA person who has achieved this Qualification is competent to be:\n\n• Aquaculture Worker\n• Grow-out operator\n\n--- PDF PAGE 6 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 2"
