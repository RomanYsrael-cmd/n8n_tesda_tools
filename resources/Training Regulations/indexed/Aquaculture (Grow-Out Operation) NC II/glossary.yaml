      "definition": "Food Conversion Ratio is the Total amount of Feeds consumed over the Net Weight of Fish. Egg Fertilization The process of mixing the fish eggs with fish milt either by natural or artificial method. Fish Nursery Refers to smaller unit areas of confinement wherein small fish larvae or fish fry are reared. It may either be in ponds, cages, tanks, etc Fish Pond An aquaculture facility with an earthen bottom surrounded by dikes, with water inlets and drain outlets. Fish Cage Installed in open waters like lakes, dams, rivers and sea-water coves, lagoons, impoundments etc. TR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 110 Fish Pen Aquaculture facility in inland areas such as lakes, rivers, darns spring and deep wells devoid of salinity Fry Newly hatched fish. Which are transparent, with big, head and does not in any way resemble the adult fish Grow out Refers to bigger unit areas of confinement where fingerlings are stocked and grown to marketable size. It may either be in ponds, cages and fish pens. Hapa Net An enclosure made of fine mesh net for larvae/fry Hatchery Operation Refers to a large production of larvae/fry Hormones Are agents, (synthetically or naturally produced) used to fasten growth and induce ovulation and to effect sex reversal in fish. Incubator Are hatching facilities where fertilized eggs are hatched. Mature Breeders Fishes that are gravid (female) or with milt (male) Induce Spawning An artificial propagation method through hormone injection to hasten the maturity of the eggs and trigger spawning Larvae Refers to newly hatched fish eggs Liming Application of agricultural lime in ponds to elevate soil ph of acidic ponds Modular Culture Technique The process of culturing fish in grow-out units in short culture period. This requires one nursery unit in for every grow-out culture unit, thus making 4 to 5 harvests per year in one grow-out unit depending on the market size of fish"
