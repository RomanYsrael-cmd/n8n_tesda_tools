  "source_text": "Acclimation\nRefers to adjusting the prevailing water condition of fish in an\nenvironment from lower to higher temperature to optimal\ntemperature, from tower or higher salinity to optimal salinity (like\nfrom freshwater to salt water environment), etc.\n\nAverage Body Weight\nIs the total weight of fish over the number of fish\n\nAD-Libitum\nRefers to the mode of providing unlimited fish feeds to fish\n\nAFMA\nAgriculture and Fisheries Modernization Act\n\nAquarium Fish or\nOrnamental fish\nAny fish that can be placed in confinement and with aesthetic\nvalue\n\nArtemia\nLive food commonly used for fish larvae\n\nBFAR\nBureau of Fisheries and Aquatic Resources\n\nBOD\nBiological Oxygen Demand\n\nBrackish Water\nRefers to the mixture of freshwater and sea water naturally\noccurring in estuaries\n\nBrachionus\nA rotifer used as larval feed for marine & freshwater fish larvae\n\nBreeder\nSexually mature fish that are used for breeding\n\nChlorella\nA unicellular green algae cultured to serve as food of the\nzooplankton, rotifers and fry\n\nConditioning of Breeders\nA method wherein the breeders are pampered by providing them\nnutritious feeds and optimum water conditions to effect the\nmaturity of the fish\n\nD.O. (Dissolved Oxygen)\nRefers to a quantity of oxygen mixed with water in the operation\nof a paddle wheel or the action of air current. The unit of the D.O.\nis commonly expressed in part per million (ppm).\n\nFCR\nFood Conversion Ratio is the Total amount of Feeds consumed\nover the Net Weight of Fish.\n\nEgg Fertilization\nThe process of mixing the fish eggs with fish milt either by natural\nor artificial method.\n\nFish Nursery\nRefers to smaller unit areas of confinement wherein small fish\nlarvae or fish fry are reared. It may either be in ponds, cages,\ntanks, etc\n\nFish Pond\nAn aquaculture facility with an earthen bottom surrounded by\ndikes, with water inlets and drain outlets.\n\nFish Cage\nInstalled in open waters like lakes, dams, rivers and sea-water\ncoves, lagoons, impoundments etc.\n\n--- PDF PAGE 114 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 110\n\nFish Pen\nAquaculture facility in inland areas such as lakes, rivers, darns\nspring and deep wells devoid of salinity\n\nFry\nNewly hatched fish. Which are transparent, with big, head and\ndoes not in any way resemble the adult fish\n\nGrow out\nRefers to bigger unit areas of confinement where fingerlings are\nstocked and grown to marketable size. It may either be in ponds,\ncages and fish pens.\n\nHapa Net\nAn enclosure made of fine mesh net for larvae/fry\n\nHatchery Operation\nRefers to a large production of larvae/fry\n\nHormones\nAre agents, (synthetically or naturally produced) used to fasten\ngrowth and induce ovulation and to effect sex reversal in fish.\n\nIncubator\nAre hatching facilities where fertilized eggs are hatched.\n\nMature Breeders\nFishes that are gravid (female) or with milt (male)\n\nInduce Spawning\nAn artificial propagation method through hormone injection to\nhasten the maturity of the eggs and trigger spawning\n\nLarvae\nRefers to newly hatched fish eggs\n\nLiming\nApplication of agricultural lime in ponds to elevate soil ph of acidic\nponds\n\nModular Culture Technique\nThe process of culturing fish in grow-out units in short culture\nperiod. This requires one nursery unit in for every grow-out culture\nunit, thus making 4 to 5 harvests per year in one grow-out unit\ndepending on the market size of fish\n\nOHS\nOperating Health Standard\n\nOptimum\nRefers to the best environmental condition provided to the fish to\neffect maximum production\n\nPathogenic Bacteria\nDisease causing bacteria\n\nPh Meter\nInstrument used to measure the hydrogen ions concentration of\nsoil or water\n\nPhytoplankton\nUnicellular microscopic algae suspended in water\n\nSea-Water\n\nRefers to waters with at east 32 ppt salinity\nSatiation feeding\nRefers to the feed consumption of fish wherein it indicates whether\nfish is fully filled-up to the gut.\n\nSeine Net\nA type of fishing gear made up of nets, ropes, floats and sinkers\nused to harvest fish\nSpawner\n\nMature female fish or shrimp used for breeding.\nStress\nA negative environmental condition caused by biological, physical\n\n--- PDF PAGE 115 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 111\n\nor chemical factors affecting the health, growth and well being of\nfish\n\nStripping\nAn artificial method by gently pressing the belly of male and\nfemale brood fish to release eggs and milt\n\nTanks\nA culture system that is made up of cement, glass and plastic of\ndifferent shapes\n\nViable\nA state or condition where an undertaking or venture in\naquaculture results to good performance as to technical and\neconomic profitability of a project\n\nWater Quality\nRefers to the over-all physical, chemical and biological parameters\nof the water\n\nZooplankton\n\nAnimal base food protein\n\n--- PDF PAGE 116 ---\nTR - Aquaculture (Grow-out Operation) NCII Revision 00 Promulgated (06/09/2020) Page 112\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAquaculture (Grow-out Operation) NC II\nQualification Code:\nAFFAGO220\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment Circular\n(TESDA Circular/\nImplementing Guidelines)\n00\nDocument\nCreated\nAquaculture NC II\nTBR No. 2004-21/\n12/09/2004\nNot applicable\n\nDocument\nSuperseded\nAquaculture NC II\nTBR No.2004-21/\n12/09/2004\nNot applicable\n00\nDocument\nAmended\nAquaculture (Hatchery\nOperation) NC II\nTBR No. 2020-23/\n06/09/2020\nTESDA Circular\nNo. 106 series of 2020\n00\nDocument\nAmended\nAquaculture (Grow-out\nOperation) NC II\nTBR No. 2020-24/\n06/09/2020\nTESDA Circular\nNo. 101 series of 2020\n00\nDocument\nAmended\nAquaculture (Tilapia\nCulture) NC II\nTBR No. 2020-25/\n06/09/2020\nTESDA Circular\nNo. 107 series 