        "source_text": "AFF611305\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nconduct site characterization, select suitable seed variety and\nselect quality seed.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Conduct site\ncharacterization\n\n1.1\nSoil characterization is\nperformed according\nto soil type\nclassification\n1.2\nEcosystem is\nidentified according to\nestablished\nclassification\n1.3\nClimatic pattern is\nidentified based on\nClimatic Type from\nPAG-ASA\n1.4\nTopography and\nelevation of the site\nare determined based\non ocular observation\n1.5\nInformation on the\noccurrence of\nprevalent pests and\ndiseases are\ndetermined.\n1.6\nRecord keeping is\ndone based on\nworkplace procedures\n1.7\nAvailable reference\nmaterials are sourced\nout based on work\nrequirements.\n•\nSoil characterization\nprocedures\no Soil Sampling\no Feel Method\no Visual\nexamination\n•\nSoil type\nclassification\n•\nTypes of ecosystem\n•\nTypes of climatic\npattern\n•\nClimatic types\n•\nTypes of land\ntopography\n•\nElevation\n•\nPests and\ndiseases profile\n•\nFarm record keeping\nand documentation\n•\nDifferent reference\nmaterials and their\nsources\n•\nWays of sourcing\nreference materials\n•\nClassifying soil\ntypes\n•\nIdentifying\necosystems\n•\nIdentifying climatic\npatterns and types\n•\nDetermining\ntopography and\nelevation of the\nsite\n•\nDetermining\nprevious and\ncurrent occurrence\nof prevalent pests\nand diseases\n•\nCommunication\nskills and record\nkeeping skills\n•\nSourcing out of\ndifferent reference\nmaterials\n2.\nSelect suitable\nseed variety\n2.1 Varietal\ncharacterization is\nperformed for\nsuitability of variety in\nthe site.\n2.2 List of recommended\nvarieties is sourced\nout for reference in\nselection process.\n• Morphology and\ngrowth stages of rice\nand corn plant\n• Varietal\ncharacteristics\n• Agronomic\ncharacteristics\n•\nDisease and insect\n• Identifying rice and\ncorn varieties\n• Determining varietal\ncharacteristics\n• Sourcing of the\nrecommended lists\n\n• Selecting variety for\n\n--- PDF PAGE 33 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 29\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.3 Suited variety is\nchosen based on site\ncharacterization\n\npest reactions\n•\nAdaptability Test\n•\nSources of the\nrecommended lists of\nrice and corn\nvarieties\n•\nVarietal selection\nprocedures\n•\nNational Seed\nIndustry Council\n(NSIC) approved\nseed varieties\nthe specific site\n\n3.\nSelect quality\nseed\n\n3.1 Classes of seeds are\nenumerated based on\nNSIC\n3.2 Characteristics of\nquality seeds are\ndetermined based on\nNSIC\n3.3 Germination test is\nperformed according\nto established\nprocedures\n3.4 Quality seeds are\nchosen based on\nNSIC\n3.5 Return and exchange\nof non-germinating\nseeds to the source is\ndone following\nindustry procedures\n• Classes of seeds\n• NSIC\n• Characteristics of\nQuality seeds\n• Germination Tests\no\nDate harvested\no\nComputation of\nseed germination\no\nSampling\n• Selection procedures\nfor quality seeds\n• Return and exchange\nof non-germinating\nseeds\n• Communication skills\n\n• Classifying seeds\n• Determining quality\nseeds\n• Conducting seed\ngermination test\n• Computing seed\ngermination\n• Selecting quality\nseeds\n• Negotiating for the\nreturn and\nexchange of non-\ngerminating seeds\nto the source\n\n--- PDF PAGE 34 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Soil type classification\nSoil type classification include:\n1.1\nSandy loam\n1.2\nClay loam\n1.3\nSilt\n1.4\nClay\n1.5\nSandy\n1.6\nSilty clay\n2. Ecosystem\nEcosystem includes:\n2.1\nUpland\n2.2\nIrrigated lowland\n2.3\nRain fed lowland\n2.4\nSaline\n2.5\nCool elevated\n2.6\nRiverine\n3. Climatic pattern\nClimatic pattern includes:\n3.1\nWet\n3.2\nDry\n4. Climatic type\nClimatic Type includes:\n4.1\nType 1\n4.2\nType 2\n4.3\nType 3\n4.4\nType 4\n5. Topography\nTopography includes:\n5.1\nHilly\n5.2\nFlat\n5.3\nSloping\n5.4\nMountainous\n5.5\nPlateau\n6. Available reference\nAvailable reference includes:\n6.1\nElectronic\n6.1.1\nWebsite\n6.1.2\nSocial media\n6.1.3\nText messaging\n6.2\nPrints\n6.2.1\nBooks\n6.2.2\nManuals\n6.2.3\nProduction guide\n6.2.4\nComics\n6.2.5\nPamphlets\n6.2.6\nMonographs\n\n--- PDF PAGE 35 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 31\n\nVARIABLE\nRANGE\n7. Varietal characteristics\nVarietal characteristics refer to:\n7.1\nAgronomic characteristics\n7.2\nDisease and insect pest reactions\n7.3\nSeed characteristics\n8. Classes of seeds\nClasses of seeds include:\n8.1\nBreeder\n8.2\nFoundation\n8.3\nRegistered\n8.4\nCertified seeds\n8.5\nGood seeds\n9. Quality seeds\nQuality seeds include:\n9.1\nRelatively pure\n9.2\nClean\n9.3\nHigh germination\n9.4\nFewer weed seeds\n9.5\nFree from seed borne pests and diseases\n9.6\nFull and uniform in size\n9.7\nViable\n9.8\nVigor\n10. Germination test\nGermination test includes:\n10.1 Rice\n10.1.1\nRag doll method\n10.1.2\nPetri dish\n10.2 Corn\n10.2.1\nSeed box method\n\n--- PDF PAGE 36 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 32\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Characterized site.\n1.2 Selected suitable seed variety.\n1.3 Selected quality seed.\n1.4 Matched rice and corn variety specific to site\ncharacteristics\n2. Resource implications\nThe following resources MUST be provided:\n2.1 Farm site/ simulated workplace\n2.2 Different classes of seeds\n2.3 NSIC approved rice and corn seed varieties\n2.4 PPE\n2.5 Tools and equipment relevant to the proposed activity or\ntasks\n2.6 Reference –PNS; Quality Standards and PNS; PhilGap\n(rice and corn)\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Written examination\n3.3 Oral questioning\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center in a\nsimulated workplace setting.\n\n--- PDF PAGE 37 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 33\n\nUNIT OF COMPETENCY\n:\nPERFORM LAND PREPARATION\nUNIT CODE\n:"
