ords\n6.2 Incident reports\n6.3 Accident reports\n6.4 OSH-related training completed\n\n--- PDF PAGE 22 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 18\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OSH) procedures\nfor controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OSH procedures and practices\n1.7 Completed and updated OSH personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 23 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 19\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nAPPLY SAFETY MEASURES IN FARM OPERATIONS\n\nUNIT CODE\n:\nAFF321201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nperform safety measures effectively and efficiently. It includes\nidentifying areas, tools, materials, time and place in performing\nsafety measures.\n\nELEMENT\nPERFORMANCE\nC