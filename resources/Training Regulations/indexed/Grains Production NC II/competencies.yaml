6, 2015                                      41 \nVARIABLE \nRANGE \n13. Pre-transplanting \nactivities \nPre-transplanting activities include \n13.1 Flooding of seed bed \n13.2 Pulling and tying of seedlings \n13.3 Washing of roots \n13.4 Hauling and distribution of seedlings \n14. Post operation activities \nfor crop establishment \nPost operation activities include: \n14.1 \nReplanting of missing hills \n14.2 \nEmploying 7s of Good Housekeeping \n14.3 \nCleaning tools and equipment \n14.4 \nStorage of tools, material and equipment \n14.5 \nRecord keeping \n14.6 \nWaste disposal \n15. Insurance \nInsurance includes: \n15.1 \nCrop \n15.2 \nFarmer\n\n--- PDF PAGE 46 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      42 \nEVIDENCE GUIDE \n \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Germinated seeds \n1.2 Conducted direct seeding operation \n1.3 Established crop for transplanting \n1.4 Pulled and transplanted plant \n1.5 Applied for crop insurance \n1.6\nPracticed OSHS\n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1 Farm site/ simulated workplace \n2.2 Tools, materials and equipment for crop establishment \noperations  \n2.3 Seeds and germinated seeds \n2.4 Operator’s manual \n2.5\nPPE\n3.  Method of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration \n3.2 Written examination \n3.3 Oral questioning \n4.  Context for \nAssessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n",
