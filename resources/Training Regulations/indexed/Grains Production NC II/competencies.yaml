        "source_text": "AFF611308\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nconduct nutrient management, perform water management,\ncarry-out pest management, conduct management of abiotic\nstresses and conduct seed purification activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Conduct\nnutrient\nmanagement\n1.1 Soil fertility is determined\nusing recommended\nassessment methods\n1.2 Kinds of fertilizer are\nselected based on soil\nanalysis and crop\nrequirement\n1.3 Amount of fertilizer is\n computed based on\n industry\n recommendations\n1.4 Fertilizer is applied\naccording to\nrecommendations\n\n•\nImportance of soil\nanalysis\n•\nSoil sampling\ntechnique/s\n•\nKinds of fertilizer\n•\nRatio and\nproportion\ncomputation for\nfertilizers\n•\nCalendar of\nfertilizer application\no\nMaturity of\nvariety\no\nType of soil\n•\nApplication of\nfertilizer\n•\nIndustry\nrecommendations\nfor fertilizer\napplication\no\nKind\no\nRight amount\no\nRight timing\no\nRight place\n•\nAssessing soil\nfertility\n•\nSelecting fertilizers\n•\nComputing for ratio\nand proportion of\namount of fertilizer\n•\nPreparing calendar\nof fertilizer\napplication\n•\nApplying fertilizer\n\n2. Perform water\nmanagement\n2.1\nWater need is assessed\nbased on ecosystem\n2.2\nWater management\nstrategy is applied\nbased on different\ncultural crop\nmanagement\n2.3\n Water conservation is\nemployed based on\nestablished farm\npractices\n2.4\nOcular monitoring is\nconducted to observe the\n•\nImportance of water\nmanagement on the\ndifferent growth\nstages of rice and\ncorn\n•\nWater requirements\nin different\necosystems\n•\nWater level and\ncontent assessment\nmethods\n•\nImportance of\ndifferent water\n• Reading or\ninterpreting the\nmeasuring\ninstrument for water\nlevel\n• Assessing water\nlevel\n• Applying appropriate\nmanagement\nstrategies\n• Employing\nappropriate water\nconservation\n\n--- PDF PAGE 48 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 44\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndepth of water\n\nmanagement\nstrategies.\no\nCalendar of\nplanting\no\nScheduling of\nfarm irrigation\nactivities\n•\nWater conservation\nmethods and their\napplications\n•\nDifferent techniques\nof water\nimpounding\no\nSmall farm\nreservoir\no\nSmall water\nimpounding\nproject\no\nShallow tube\nwell\n•\nProcedures of\nmonitoring activities\n•\nMonitoring checklist\n•\nKinds of fertilizer\n•\nRatio and\nproportion\ncomputation for\nfertilizers\n•\nCalendar of\nfertilizer application\no\nMaturity of\nvariety\no\nType of soil\nmethod/s\n• Conducting\nmonitoring activities\n\n3. Carry-out pest\nmanagement\n\n3.1\nOccurrence of pests and\ndiseases is assessed\nfollowing industry\nstandard procedures\n3.2\nPests and diseases\nmanagement is adopted\nbased on industry\nstandard procedures\n3.3\nRegular field monitoring\nis conducted based on\nindustry procedures\n3.4\nAction is taken to prevent\nfurther crop damages\nand losses.\n\n•\nKnowledge on the\norigin/ occurrence\nof a particular\ndisease\n•\nManagement\noptions for a\nparticular pest/\ndisease (IPM)\n•\nIdentify/ Classify\npests and diseases\n•\nAgro ecosystem\nAnalysis (AESA)\nand its importance\nas decision making\ntool for pest and\ndiseases\n•\nAssessing\noccurrence of pests\nand diseases\n•\nAdopting pests and\ndiseases\nmanagement\n•\nConducting regular\nfield monitoring\n•\nApplying preventive\naction\n\n--- PDF PAGE 49 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 45\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\nmanagement\n•\nDifferent techniques\nof damage\nassessment\no\nCultural\no\nBiological\no\nMechanical\no\nChemical\n•\nPreventive actions\nagainst pest and\ndiseases\n4. Conduct\nmanagement\nof abiotic\nstresses\n4.1 Assessment of abiotic\nstresses is done\nfollowing industry\nstandard procedures\n4.2 Abiotic stress\nmanagement is adopted\nbased on industry\nstandards\n4.3 Regular field monitoring\nis conducted based on\nindustry procedures\n4.4 Action is taken based on\nthe result of monitoring\nactivities\n•\nDifferent abiotic\nstresses\n•\nAssessment of\nabiotic stresses\n•\nAbiotic stress\nmanagement\n•\nField monitoring\nprocedures\n•\nPreventive action\nagainst abiotic\nstresses\n•\nOHSH practices\n•\nPerforming\nassessment of\nabiotic stress\n•\nAdopting abiotic\nstress management\n•\nConducting regular\nfield monitoring\n•\nApplying regular\naction against\nabiotic stress\n5. Conduct seed\npurification\nactivity\n5.1 Area is selected for seed\npurification activity based\non recommended criteria.\n5.2 Off-types are removed\nfollowing established farm\nprocedures\n5.3 Disposal of off-types is\ndone following established\nfarm procedures\n5.4 Seeds are harvested\nbased on maturity indices.\n5.5 Post- harvest operations\nare done separately for\nseed production\n•\nSelection criteria\n•\nCharacteristics of\noff-types\n•\nStages of rice and\ncorn where rouging\nis best done\n•\nSources of off-types\no Plant height\no Color of leaves\no Presence/abse\nnce of awn\no Panicle\no Flag leaf\no Maturity etc.\n•\nHarvest and post-\nharvest operations\n•\nRouging\nprocedures\no Importance of\nrouging\n•\nPhilGAP for rouging\n•\nOSHS\n•\nDisposal\nprocedures of off-\n•\nUnderstanding the\nimportance of\nrouging\n•\nIdentify the proper\ntime of rouging\n•\nSelecting area for\nseed purification\nactivity\n•\nIdentifying different\noff-types\n•\nRouging of off-\ntypes\n•\nProper disposing of\noff- types\n\n•\nPerforming\nseparate harvesting\nand post-harvesting\noperations for seed\nproduction\n•\nPracticing OSHS\n•\nDocumenting and\nrecord keeping\n\n--- PDF PAGE 50 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 46\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ntypes and weeds\n•\nEnvironmental rules\nand regulations on\nsolid wastes\nmanagement\n•\nPhilGAP on agri-\nwastes disposal\n•\nHarvesting and\npost-harvesting\nprocedures for seed\nproduction activity\n•\nRecord keeping\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Assessment methods\nAssessment methods include:\n1.1 Soil analysis\n1.2 Minus- One Element Technique\n1.3 Leaf Color Chart\n1.4 Nutrient Omission Plot Technique\n1.5 Rice crop manager (electronic based)\n1.6 Leaf tissue analysis\n2. Kinds of fertilizer\nKinds of fertilizers include:\n2.1 Organic\n2.2 Inorganic/Synthetic\n3. Fertilizer computation\nFertilizer computation includes:\n3.1. Ratio and proportion\n3.2. Simple substitution\n4. Methods of fertilizer application\nMethods of fertilizer application include:\n4.1. Basal (First Application)\n4.2. Top dressing\n4.3. Side dressing\n4.4. Foliar Application\n\n--- PDF PAGE 51 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 47\n\nVARIABLE\nRANGE\n5. Recommendations\nRecommendations include:\n5.1 Right kind\n5.2 Right amount\n5.3 Right Timing\n5.4 Right Place\n6. Water assessment\nmethods\nWater assessment methods include:\n6.1 Conventional (Level of water in the Paddy)\n6.2 Traditional (Stick method, feel method)\n7. Water management\nstrategy\nWater management strategy includes:\n7.1\nSchedule of irrigation\n7.2\nWater source\n7.3\nWater flooding\n7.4\nWater draining\n8. Water conservation\n\nWater conservation includes:\n8.1\nAlternate wetting and drying\n8.2\nWater impounding\n8.3\nMulching\n9. Pests and diseases\nPests and diseases include:\n9.1\nInsect pests\n9.2\nWeeds\n9.3\nVertebrate pests (rats and birds)\n9.4\nSnail\n10. Diseases\nDiseases include:\n10.1\nFungal\n10.2\nBacterial\n10.3\nViral\n10.4\nNematodes\n11. Pest and diseases\nmanagement\nPests and disease management includes:\n11.1\nCultural control\n11.2\nBiological control\n11.3\nChemical control\n11.4\nMechanical control\n12. Crop damage\nCrop damages include:\n12.1\nDiseases infections\n12.2\nInsect Infestations\n12.3\nOther crop damages\n13. Abiotic stresses\nAbiotic stresses include:\n13.1\nDrought\n13.2\nExtreme temperature\n13.3\nLight- intensity stress\n13.4\nNutrient deficiencies\n13.5\nNutrient toxicity\n\n--- PDF PAGE 52 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 48\n\n13.6 Excessive water\n13.7 Typhoons/ Strong winds\n13.8 Pollutants\n13.9 Salinity\n13.10 Acidity\n13.11 Alkalinity\n14. Abiotic stress\nmanagement\nAbiotic stress management includes:\n14.1 Cultural\n14.2 Biological\n14.3 Mechanical\n14.4 Chemical\n15. Action\n Action includes:\n15.1 Exhaust all measures to prevent/ control abiotic stresses\n15.2 Report and coordinate with proper authorities for quick\nresponse and assistance\n15.3 Report and claim crop insurance\n16. Selection criteria\nSelection criteria include:\n16.1 Free from pests and diseases\n16.2 Accessible to water\n16.3 Fertile soil\n16.4 Less occurrence of off-types/rogues\n16.5 Away from artificial lights\n17. Disposal of off-\ntypes\nDisposal of off-types includes:\n17.1 Remove and carry\n17.2 Composting\n17.3 Feeds for livestock\n17.4 Remove and burry\n18. Post - harvest\nPost- harvest includes:\n18.1 Piling\n18.2 Threshing\n18.3 Drying\n18.4 Cleaning\n18.5 Sacking\n18.6 hauling\n18.7 Storage\n18.8 Dehusking\n18.9 Shelling\n18.10 Record keeping\n\n--- PDF PAGE 53 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 49\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Conducted nutrient management\n1.2 Performed water management\n1.3 Carried-out pest management\n1.4 Conducted management of abiotic stresses\n1.5 Conducted seed purification activity\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Farm site/simulated workplace\n2.2 Storage area\n2.3 Tools, materials and equipment for crop management\noperations (see section 3.4 for list of equipment, tools and\nmaterials)\n2.4 Operator’s manual\n2.5 Sack (packaging material)\n2.6 PPE\n3. Method of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Exam\n3.2 Oral questioning\n3.3 Demonstration\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center in a\nsimulated workplace setting.\n\n--- PDF PAGE 54 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 50\n\nUNIT OF COMPETENCY : CONDUCT HARVEST AND POST-HARVEST OPERATIONS\n\nUNIT CODE\n:"
