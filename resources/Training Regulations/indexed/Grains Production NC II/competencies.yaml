        "source_title": "WORK IN TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 10 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      6 \nUNIT OF COMPETENCY \n: \nWORK IN TEAM ENVIRONMENT \nUNIT CODE \n: \n500311106 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes to identify role  \n \n \nand responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. \nDescribe team \nrole and scope \n1.1 The role and objective \nof the team is identified \nfrom available sources \nof information \n1.2 Team parameters, \nreporting relationships \nand responsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources.\n \nCommunication \nprocess \n \nTeam structure \n \nTeam roles \n \nGroup planning and \ndecision making \n \nCommunicate \nappropriately, \nconsistent with the \nculture of the \nworkplace \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1 Individual role and \nresponsibilities within \nthe team environment \nare identified. \n2.2 Roles and responsibility \nof other team members \nare identified and \nrecognized. \n2.3 Reporting relationships \nwithin team and external \nto team are identified. \n \nCommunication \nprocess \n \nTeam structure \n \nTeam roles \n \nGroup planning and \ndecision making   \n \nCommunicate \nappropriately, \nconsistent with the \nculture of the \nworkplace \n3. Work as a team \nmember  \n3.1. Effective and \nappropriate forms of \ncommunications used \nand interactions \nundertaken with team \nmembers who contribute \nto known team activities \nand objectives. \n3.2. Effective and \nappropriate \ncontributions made to \ncomplement team \nactivities and objectives, \nbased on individual \nskills and competencies \nand workplace context. \n \n \n \nCommunication \nprocess \n \nTeam structure \n \nTeam roles \n \nGroup planning and \ndecision making \n \nCommunicate \nappropriately, \nconsistent with the \nculture of the \nworkplace \n \nInteracting \neffectively with \nothers\n\n--- PDF PAGE 11 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      7 \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.3. Observed protocols in \nreporting using standard \noperating procedures. \n3.4. Contribute to the \ndevelopment of team \nwork plans based on an \nunderstanding of team’s \nrole and objectives and \nindividual competencies \nof the members.\n \n \n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Role and objective of \nteam  \n1.1. Work activities in a team environment with enterprise or specific \nsector \n1.2. Limited discretion, initiative and judgment maybe demonstrated on \nthe job, either individually or in a team environment \n2. Sources of information \n2.1. Standard operating and/or other workplace procedures \n2.2. Job procedures \n2.3. Machine/equipment manufacturer’s specifications and instructions \n2.4. Organizational or external personnel \n2.5. Client/supplier instructions \n2.6. Quality standards \n2.7. OSH and environmental standards \n3. Workplace context \n3.1. Work procedures and practices \n3.2. Conditions of work environments \n3.3. Legislation and industrial agreements \n3.4. Standard work practice including the storage, safe handling and \ndisposal of chemicals \n3.5. Safety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 12 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      8 \nEVIDENCE GUIDE \n \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nOperated in a team to complete workplace activity \n1.2. \nWorked effectively with others \n1.3. \nConveyed information in written or oral form \n1.4. \nSelected and used appropriate workplace language \n1.5. \nFollowed designated work plan for the job \n1.6. \nReported outcomes  \n2. Resource Implications \nThe following resources MUST be provided: \n2.1. \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2. \nMaterials relevant to the proposed activity or tasks \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation   of the individual member in relation to the work \nactivities of the group \n3.2. \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3. \nCase studies and scenarios as a basis for discussion of issues \nand strategies in teamwork \n4. Context for Assessment \n4.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n4.2 \nAssessment shall be observed while task are being undertaken \nwhether individually or in group\n",
