nd panicle\ninitiation\n3.4. For corn, days after sowing\n4.\nObstructions\nObstructions may include but not limited to:\n4.1 Weeds\n4.2 Stakes\n4.3 Wedges\n5.\nHarvesting tools and materials\nHarvesting tools and materials may include:\n5.1 Scythe\n5.2 Sacks\n5.3 Twines\n5.4 Labels/Markers\n5.5 Lumber\n5.6 bamboos\n5.7 Nails\n5.8 Roofing material\n6.\nRecords\nRecords include:\n6.1 Crop history\n6.2 Farm activity calendar\n6.3 Farm records\n7.\nMachinery services\nMachinery services include:\n7.1 Harvester\n7.2 Thresher\n7.3 Mechanical dryer\n7.4 Rice and corn mill\n7.5 Truck hauler\n8.\nAppropriate harvesting\nAppropriate harvesting methods include:\n8.1 Manual\n8.2 Mechanical\n\n--- PDF PAGE 58 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 54\nVARIABLE\nRANGE\n9.\nPostharvest operations\nPostharvest operations include:\n9.1 Handling/Hauling\n9.2 Threshing\n9.3 Dehusking\n9.4 Shelling\n9.5 Cleaning\n9.6 Drying\n9.7 Milling\n9.8 Packaging and sacking\n9.9 Storing\n10. Postharvest equipment and\nfacilities\nPostharvest equipment and facilities include:\n10.1 Thresher\n10.2 Mechanical dryer\n10.3 Dehusker\n10.4 Sheller\n10.5 Solar dryer\n10.6 Rice and corn mill\n10.7 Warehouse\n11. Damages and losses\nDamages and losses include:\n11.1 Broken grains\n11.2 Discolored grains\n11.3 Grain impurities\n11.4 Spoiled grains\n11.5 Pest-infected grains\n11.6 Moldy corn\n11.7 Spillage due to improper\n11.8 Handling\n12. Packaging\nPackaging includes:\n12.1 Sacks\n12.2 Plastic bags\n13. Appropriate storage area\nAppropriate storage area:\n13.1 Cool\n13.2 Dry\n13.3 Secured\n13.4 Free from pests and diseases\n13.5 Clean\n14. Recommended practices\nRecommended practices include:\n14.1 Using new sacks or cleaning used sacks by\nremoving insect pests\n14.2 Separating old stocks from new ones to\nprevent infestation\n14.3 Reporting to immediate authority when\ninfestation is alarming\n\n--- PDF PAGE 59 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 55\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Carried out pre-harvest operation\n1.2 Carried out harvesting activity\n1.3 Carried out post-harvest operations\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Farm site/simulated workplace\n2.2 Storage facilities/simulated workplace\n2.3 Tools,\nmaterials,\nequipment\nand\nmachineries\nfor\nharvesting and post-harvesting operation\n2.4 PPE\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Written examination\n3.2 Oral questioning\n3.3 Demonstration\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center in\na simulated workplace setting.\n\n--- PDF PAGE 60 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 56"
