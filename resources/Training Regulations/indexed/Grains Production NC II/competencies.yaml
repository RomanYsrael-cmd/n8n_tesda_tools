          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Carried out pre-harvest operation\n1.2 Carried out harvesting activity\n1.3 Carried out post-harvest operations\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Farm site/simulated workplace\n2.2 Storage facilities/simulated workplace\n2.3 Tools,\nmaterials,\nequipment\nand\nmachineries\nfor\nharvesting and post-harvesting operation\n2.4 PPE\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Written examination\n3.2 Oral questioning\n3.3 Demonstration\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center in\na simulated workplace setting.\n\n--- PDF PAGE 60 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 56"
