          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Carry out pre-\nharvest \noperation \n \n1.1 Matured crop is determined \nbased on physiological \ngrowth and physical \nindicators \n1.2 Records of crop \nagronomic history is \nverified and referenced for \nmaturity \n1.3 Records are verified for \nharvesting activities \nfollowing established farm \nprocedures \n1.4 Weather condition is \nmonitored based on \nweather forecast \n1.5 Rice field is drained of \nwater according to \nrecommended industry \npractices \n1.6 Obstructions from the \nfield are removed for \nefficient harvesting \n1.7 Harvesting tools and \nmaterials are prepared \nfollowing work requirement.\n1.8 Machinery services are \nobtained for harvest and \npost-harvest operations.  \n \nPhysiological \nindicators of rice and \ncorn crop maturity \n \nPhysical indicators \nof rice and corn crop \nmaturity \n \nAgronomic \ncharacteristics of \ndifferent rice and \ncorn varieties \n \nRecords verification \n \nWeather condition \nand forecasting \n \nProper water \nmanagement before \nharvest \n \nTypes of \nobstructions from \nthe rice field and \ncorn field \n \nAppropriate \nharvesting tools and \nmaterials for rice \nand corn \n \nDocumentation and \nfarm record keeping \n \nThe Art of \nNegotiating \n \nMachinery service \nproviders for rice \nand corn \n \nDetermining \nmatured crop \no Identifying \nphysiological \nindicators of rice \nand corn crop \nmaturity \no Identifying \nphysical \nindicators of rice \nand corn crop \nmaturity \n \nVerifying \ninformation on \nagronomic history \n \nVerifying records \nfor harvesting \nactivities \n \nMonitoring \nweather \nconditions and \nforecasts \n \nPreparing \ncontingency plan \nfor weather \ndisturbances \n \nDraining of water \nfrom the rice field \n \nRemoving \nobstructions from \nthe field \n \nPreparing \nharvesting tools \nand materials \n \nIdentifying \ndifferent\n\n--- PDF PAGE 55 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      51 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmachineries for \nharvest and post-\nharvest \noperations \n \nNegotiating with \nmachinery service \nproviders for rice \n \nObtaining \nmachinery \nservices\n2. Carry out \nharvesting \nactivity \n2.1 Appropriate harvesting \nmethods are implemented \nbased on best cultural \npractices  \n2.2 Pilling is done based on \nrecommended practices \n2.3 PPE is worn according to \nOSHS \n2.4 Harvesting tools are used \naccording to work \nrequirement \n2.5 Mechanical harvesting is \nmonitored following work \nrequirement \n \nHarvesting methods \no Manual \no Mechanical \n \nPiling practices \n \nProcedures for \nSafety in the use of \ntools and equipment \n \nUse of honesty tools \n \nMonitoring \nprocedures \n \n \nIdentifying factors \naffecting quality of \ngrain at harvest \n \nEstimating yield \n \nHarvesting rice \nand corn crop \n \nImplementing \nappropriate \nharvesting \nmethods \n \nPilling of \nharvested grains \n \nWearing \nappropriate PPE \n \nUsing harvesting \ntools \n \nMonitoring \nmechanized \nharvesting\n3. Carry out post-\nharvest \noperations \n3.1 Postharvest operations \nare done based on \nrecommended \ntechnologies \n3.2 Use of post- harvest \nequipment and facilities \nare monitored to avoid \ngrain damage and losses \n3.3 Handling and    packaging \nare done according to \nvariety and destination \n3.4 Bags of palay are stored in \nan appropriate storage \narea \n3.5 Monitoring of storage pests \nand diseases is done \nbased on recommended \npractices \n \n \n \nPostharvest \nequipment and \nfacilities for grains \nand their uses \n \nCare & maintenance \nof post-harvest \nequipment & \nfacilities \n \nPostharvest grain \ndamages and losses \n \nProper handling and \npackaging of grains \n \nProper storing and \nstacking of grains \n \n \nProcedures in \nmonitoring storage \npest & diseases \n \nStorage pests & \ndiseases\n \nPerforming \npostharvest \noperations such \nas handling/ \nhauling, \nthreshing, \ncleaning, drying, \nmilling and storing \n \nIdentifying \ndifferent \npostharvest \nequipment & \nfacilities \n \nDistinguishing \nspecific uses of \nthe different \npostharvest \nequipment & \nfacilities \n \nIdentifying grain\n\n--- PDF PAGE 56 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      52 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \nEffective \nCommunication & \nCoordination \n \ndamages and \nestimating \nspillage/losses \n \nPackaging, \nsorting and \nstacking of milled \ngrain following \nrecommended \nindustry \nstandards \n \nStoring and \nstacking of grain \nfollowing industry \nstandards \n \nCleaning of used \nand infested \nsacks of grain \n \nSeparating old \nstocks from new \nones \n \nCommunicating \ninfestation to \nproper authorities\n\n--- PDF PAGE 57 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      53 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. \nPhysiological growth \nPhysiological growth includes: \n1.1 Days after seeding \n1.2 Days after transplanting \n1.3 Days after panicle initiation\n2. \nPhysical indicators \nPhysical indicators include:  \n2.1 Change in color from green to golden yellow \npanicles \n2.2 From green to brown husks \n2.3 Hardening of grains \n2.4 Drying of silk \n2.5 Translucent grain\n3. \n Crop agronomic history \nCrop agronomic history includes: \n3.1. Variety \n3.2. Planting calendar (days after seeding and \ndays after heading) \n3.3. For rice, days after seeding and panicle \ninitiation \n3.4. For corn, days after sowing\n4. \nObstructions \nObstructions may include but not limited to: \n4.1 Weeds \n4.2 Stakes \n4.3 Wedges\n5. \nHarvesting tools and materials \nHarvesting tools and materials may include: \n5.1 Scythe \n5.2 Sacks \n5.3 Twines \n5.4 Labels/Markers \n5.5 Lumber \n5.6 bamboos \n5.7 Nails \n5.8 Roofing material\n6. \nRecords \nRecords include: \n6.1 Crop history \n6.2 Farm activity calendar \n6.3 Farm records\n7. \nMachinery services \nMachinery services include: \n7.1 Harvester \n7.2 Thresher \n7.3 Mechanical dryer \n7.4 Rice and corn mill \n7.5 Truck hauler\n8. \nAppropriate harvesting \nAppropriate harvesting methods include: \n8.1 Manual \n8.2 Mechanical\n\n--- PDF PAGE 58 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      54 \nVARIABLE \nRANGE \n9. \nPostharvest operations \nPostharvest operations include: \n9.1 Handling/Hauling \n9.2 Threshing \n9.3 Dehusking \n9.4 Shelling \n9.5 Cleaning \n9.6 Drying \n9.7 Milling \n9.8 Packaging and sacking \n9.9 Storing\n10. Postharvest equipment and \nfacilities \nPostharvest equipment and facilities include: \n10.1 Thresher \n10.2 Mechanical dryer \n10.3 Dehusker \n10.4 Sheller \n10.5 Solar dryer \n10.6 Rice and corn mill \n10.7 Warehouse\n11. Damages and losses \nDamages and losses include: \n11.1 Broken grains \n11.2 Discolored grains \n11.3 Grain impurities \n11.4 Spoiled grains \n11.5 Pest-infected grains  \n11.6 Moldy corn \n11.7 Spillage due to improper \n11.8 Handling\n12. Packaging \nPackaging includes: \n12.1 Sacks  \n12.2 Plastic bags\n13. Appropriate storage area \nAppropriate storage area: \n13.1 Cool \n13.2 Dry \n13.3 Secured \n13.4 Free from pests and diseases  \n13.5 Clean \n14. Recommended practices \nRecommended practices include: \n14.1 Using new sacks or cleaning used sacks by \nremoving insect pests \n14.2 Separating old stocks from new ones to \nprevent infestation \n14.3 Reporting to immediate authority when \ninfestation is alarming\n\n--- PDF PAGE 59 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      55"
