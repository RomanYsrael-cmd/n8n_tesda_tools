  "source_section_text": "SECTION 1\nGRAINS PRODUCTION NC II QUALIFICATION\n\nThe GRAINS PRODUCTION NC II Qualification consists of competencies that a Rice/Corn\nfarmer and Rice/Corn grower must achieve to conduct variety and seed selection, perform land\npreparation, carry-out crop establishment, manage crop and conduct harvest and post-harvest\noperations. It also includes performing manual land preparation.\n\nThe Units of Competency comprising this Qualification include the following:\n\nA person who has achieved this Qualification is competent to be:\n\n Rice/Corn Farmer\n Rice/Corn Grower\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\nUNIT CODE\nCOMMON COMPETENCIES\nAGR321201\nApply safety measures in farm operations\nAGR321202\nUse farm tools and equipment\nAGR321203\nPerform estimation and basic calculation\n\nUNIT CODE\n\nCORE COMPETENCIES\nAFF 611305\nConduct variety and seed selection\nAFF 611306\nPerform land preparation\nAFF 611307\nCarry-out crop establishment\nAFF 611308\nManage crop\nAFF 611309\nConduct of harvest and post-harvest operations\n\n--- PDF PAGE 6 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 2"
