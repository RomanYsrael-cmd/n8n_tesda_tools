        "source_text": "AFF321202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\n\nuse farm tools and equipment. It includes selection, operation and\n\npreventive maintenance of farm tools and equipment.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Select and use\nfarm tools\n\n1.1 Appropriate farm\ntools are identified\naccording to\nrequirement / use\n1.2 Farm tools are\nchecked for faults and\ndefective tools\nreported in\naccordance with farm\nprocedures\n1.3 Appropriate tools are\nsafely used according\nto job requirements\nand manufacturers\nconditions\n• Types and uses of\nfarm tools\n• Characteristics of\nfunctional tools\n• Checking tools for\ndefects/faults\n• Segregation and\nreporting defective\ntools\n• Uses of tools and\nequipment\n\n• Identifying farm\ntools for the work\n• Checking the\nconditions of tools\n• Reporting defective\ntools\n• Using tools\n2. Select and\noperate farm\nequipment\n2.1 Identify appropriate\nfarm equipment\n2.2 Instructional manual of\nthe farm tools and\nequipment are\ncarefully read prior to\noperation\n2.3 Pre-operation check-\nup is conducted in line\nwith manufacturers\nmanual\n2.4 Faults in farm\nequipment are\nidentified and reported\nin line with farm\nprocedures\n2.5 Farm equipment used\naccording to its\nfunction\n2.6 Safety procedures are\nfollowed.\n• Types and operations\nof farm equipment\n• Standards operating\nprocedures of farm\nequipment\n• Instructional manual\nof equipment\n• Pre-operation check-\nup\n• Equipment\nSpecification\n• Procedures in\ncalibrating and use of\nequipment\n• Equipment faults\nidentification and\nreporting\n• Operation of\nequipment\n• Codes and\nRegulations on\n• Identifying\nappropriate farm\nequipment for the\nwork\n• Reading\ninstructional\nmanual.\n• Conducting pre-\noperation check-up\n• Identifying\nfaults/defects of\nfarm equipment\n• Reporting on\ndefective farm\nequipment\n• Operating farm\nequipment\n• Following safety\nprocedures.\n\n--- PDF PAGE 28 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 24\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nenvironmental\nprotection\n• Safety and keeping\nof equipment every\nafter use\n•\nSafety measures\n3. Perform\npreventive\nmaintenance\n3.1 Tools and equipment\nare cleaned\nimmediately after use\nin line with farm\nprocedures\n3.2 Routine check-up and\nmaintenance are\nperformed\n3.3 Tools and equipment\nare stored in\ndesignated areas in\nline with farm\nprocedures\n• Cleaning procedures\nof tools and\nequipment\n• Maintenance\nprocedures of farm\nequipment\n• Storage of tools and\nequipment\n• Designated storage\nareas\n\n• Cleaning tools and\nequipment\n• Performing\nroutinary check-up\nof tools and\nequipment\n• Maintaining farm\nequipment\n• Storing tools and\nequipment\n\n--- PDF PAGE 29 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\n\nFarm equipment include:\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Farm tools\nFarm tools includes:\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5\nMeasuring tools\n2.6 Garden tools\n3. Pre-operation check-up\nPre-operation check –up includes:\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipment according to manual specification\n1.3\nPerformed preventive maintenance\n2.\nResource\nImplications\nThe following resources MUST be provided:\n2.1 Service/operational manual of farm tools and equipment\n2.2 Tools and equipment\n2.3 Farm implements\n3.\nMethod of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1\nDirect observation\n3.2\nPractical demonstration\n3.3\nThird Party Report\n4.\nContext of\nAssessment\nAssessment may occur in the workplace or in a simulated workplace\nor as part of a team under limited supervision\n\n--- PDF PAGE 30 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 26\nUNIT OF COMPETENCY : PERFORM ESTIMATION AND BASIC CALCULATION\n\nUNIT CODE :"
