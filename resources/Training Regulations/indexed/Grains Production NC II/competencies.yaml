        "source_text": "AFF611307\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto germinate seeds, conduct direct seeding operation and\nestablish crop for transplanting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nGerminate\nseeds\n1.1 Seed soaking is done\naccording to industry\nstandards\n1.2 Seed is incubated\nfollowing industry\nstandards\n1.3 Incubated seeds are\nexamined for whitish dot as\na sign of germination.\n1.4 Germinated seeds are\nhandled and transported\nto site following industry\nstandards\n1.5 Wearing of PPE is\npracticed following the\nOSHS standards\n\n• Procedures of\nseed soaking\n• Procedures of\nseed incubation\n• Indicators of seed\ngermination\n• Practice OSHS\n• Wearing of PPE\n• Documentation\nand record\nkeeping\n• Proper handling\nand transporting of\ngerminated seeds\no Avoidance\nfrom\ncontamination\nof chemicals\n• Proper wastes\ndisposal (Reduce,\nReuse, Recycle-\n3Rs)\n• Soaking of seeds\n• Incubating seeds\n• Identifying\ngerminated seed\n• Handling and\ntransporting of\ngerminated\nseeds\n• Wearing PPE\n• Practicing proper\nwastes disposal\n2.\nConduct direct\nseeding\noperation\n2.1 Tools, materials and\nequipment are prepared\nbased on work\nrequirements\n2.2 Field is checked for\nreadiness for direct\nseeding operation\n2.3 Corrective measures are\ndone based on the result of\ninspection\n2.4 Prevention of pests is\nemployed according to\nresult of inspection\n2.5 Direct seeding is\nperformed following\n• Preparation of\ntools, materials\nand equipment\n• Ways of checking\nthe field\n• Corrective\nmeasures\n• Prevention of\npests\n• Direct seeding\nprocedures\no manual\nbroadcasting\n• Preparing tools,\nmaterials and\nequipment\n• Checking field by\nocular inspection\n• Analytical skills\n• Preventing pests\n• Using drum\nseeders\n• Broadcasting\n(manual) seeds\n• Wearing PPE\n•\nUsing drum\n\n-