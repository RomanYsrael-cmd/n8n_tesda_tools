 \n Practicing OSHS \n Wearing PPE \n Communication \nskills \n Practicing GAP \n\nRepairing dikes\n3. Perform post-\ntillage operations \n3.1 Damaged dikes are \nrepaired following \nstandard industry \nprocedures. \n3.2 Proper wastes disposal is \npractice following \nenvironmental rules and \nregulations. \n3.3 Transaction with the \nmachinery service provider \nis completed with reference \nto work contract. \n3.4 Record keeping is done \nfollowing workplace \nprocedures.  \n \n Activities of \nrepairing dikes \n Reinforce dikes \nusing bamboo \npoles procedure \n Proper wastes \ndisposal \n Procedures in \nclosing transaction \nwith machinery \nservices provider \n Communication \nskills \n Simple record \nkeeping\n Repairing \ndamaged dikes \n Disposing \nwastes \n Completing \ntransactions with \nmachinery \nservice provider \n Performing \nrecord keeping\n\n--- PDF PAGE 39 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      35 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nLand clearing \nactivities \nLand clearing activities include: \n1.1 Cleaning of dikes/levees \n1.2 Cleaning of irrigation and drainage canals  \n1.3 Spreading of remaining crop stubbles \n2. \nTopography \nTopography includes: \n2.1 Hilly \n2.2 Flat \n2.3 Sloping \n2.4 Moutainous \n2.5 Plateau\n3. \nTools, Materials, \nEquipment \nTools, materials and equipment include: \n3.1 Equipment \n3.1.1 \nGrass cutter \n3.1.2 \nKnapsack sprayer \n3.1.3 \nPPE \n3.1.4 \nCarabao \n3.1.5 \nFarm Attachments  \n3.1.5.1 Tooth comb-harrow \n3.1.5.2 Carabao-drawn plow \n3.1.5.3 Puddler \n3.1.5.4 Wooden planks \n3.2 Tools \n3.2.1 \nBolo \n3.2.2 \nScythe \n3.2.3 \nSpade or shovel \n3.2.4 \nSpading fork \n3.2.5 \nGarden hoe \n3.2.6 \nRake \n3.2.7 \nA-frame (1 unit) \n3.3 Materials \n3.3.1 \nFuel \n3.3.2 \nEngine oil \n3.3.3\nSharpening stone\n4. \nConstructing and \nrepairing dikes \nCons