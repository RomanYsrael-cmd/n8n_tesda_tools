        "source_text": "AFF611306\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nperform pre- tillage operations, conduct tillage operation and\nperform post-tillage operation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform pre-\ntillage operations\n\n1.1 Land clearing activities\nare done according to\ntopography\n1.2 Tools, materials and\nequipment are made\nready for land preparation\n1.3 Safety procedures is\nfollowed according to\nOSHS\n1.4 Machinery services are\nsourced out following work\nrequirement\n1.5 Dikes are constructed\nand repaired according to\nindustry standard\nprocedures\n\n• Land clearing\nactivities\no\nImportance of\nland cleaning\nin rice and\ncorn\nproduction.\n• Different\ntopography\n• Tools, materials,\nand equipment\nrequired in land\npreparations\n• Procedures in\npreparation of\ntools, material and\nequipment\n• OSHS\n• PPE\n• Different\nmachinery\nservices for land\npreparations\n• Philippine Good\nAgricultural\nPractices\n(PhilGAP)\n• Activities of\nrepairing dikes\n• Clearing the\narea.\n• Preparing tools,\nmaterials and\nequipment\n• Practicing OSHS\n• Wearing PPE\n• Sourcing of\nmachinery\nservices\n• Communication\nskills\n• Practicing\nPhilGAP\n• Constructing and\nrepairing dikes\n\n--- PDF PAGE 38 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 34\n\n2. Conduct tillage\noperations\n2.1 Tillage operation is\ncarried-out according to\nstandard tillage practices.\n2.2 Tillage operation is\nmonitored following\nestablished industry\nprocedures\n2.3 Safety measures are\npracticed according to\nOSH standards\n\n.\n\n• Tillage operation\nand practices\n• Monitoring tillage\noperation\n• Characteristics of\na well prepared\nwetland and\ndryland fields\n• OSHS\n• Safety procedures\nfor land\npreparation\n\n• Performing\ntillage operation\n• Monitoring tillage\noperation\n• Cleaning the\narea\n• Preparing tools,\nmaterials and\nequipment\n• Practicing OSHS\n• Wearing PPE\n• Communication\nskills\n• Practicing GAP\n•\nRepairing dikes\n3. Perform post-\ntillage operations\n3.1 Damaged dikes are\nrepaired following\nstandard industry\nprocedures.\n3.2 Proper wastes disposal is\npractice following\nenvironmental rules and\nregulations.\n3.3 Transaction with the\nmachinery service provider\nis completed with reference\nto work contract.\n3.4 Record keeping is done\nfollowing workplace\nprocedures.\n\n• Activities of\nrepairing dikes\n• Reinforce dikes\nusing bamboo\npoles procedure\n• Proper wastes\ndisposal\n• Procedures in\nclosing transaction\nwith machinery\nservices provider\n• Communication\nskills\n• Simple record\nkeeping\n• Repairing\ndamaged dikes\n• Disposing\nwastes\n• Completing\ntransactions with\nmachinery\nservice provider\n• Performing\nrecord keeping\n\n--- PDF PAGE 39 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nLand clearing\nactivities\nLand clearing activities include:\n1.1 Cleaning of dikes/levees\n1.2 Cleaning of irrigation and drainage canals\n1.3 Spreading of remaining crop stubbles\n2.\nTopography\nTopography includes:\n2.1 Hilly\n2.2 Flat\n2.3 Sloping\n2.4 Moutainous\n2.5 Plateau\n3.\nTools, Materials,\nEquipment\nTools, materials and equipment include:\n3.1 Equipment\n3.1.1\nGrass cutter\n3.1.2\nKnapsack sprayer\n3.1.3\nPPE\n3.1.4\nCarabao\n3.1.5\nFarm Attachments\n3.1.5.1 Tooth comb-harrow\n3.1.5.2 Carabao-drawn plow\n3.1.5.3 Puddler\n3.1.5.4 Wooden planks\n3.2 Tools\n3.2.1\nBolo\n3.2.2\nScythe\n3.2.3\nSpade or shovel\n3.2.4\nSpading fork\n3.2.5\nGarden hoe\n3.2.6\nRake\n3.2.7\nA-frame (1 unit)\n3.3 Materials\n3.3.1\nFuel\n3.3.2\nEngine oil\n3.3.3\nSharpening stone\n4.\nConstructing and\nrepairing dikes\nConstructing and repairing dikes include:\n4.1 Sealing rat burrows, cracks and damaged dikes\n4.2 Installing screen mesh to water inlets and outlets\n4.3 Elevating water dikes\n5.\nTillage Operation\nTilling operation includes:\n5.1 Wet tillage practices\n5.2 Dry land tillage practices\n5.3\nWet and dry tillage practices.\n6.\nRepairing damaged\ndikes\nRepairing damage dikes include:\n6.1 Sealing and patching rat burrows, cracks, damaged dikes\n6.2 Reinforcing dikes\n6.3 Using bamboo poles\n6.4 Elevating dikes\n\n--- PDF PAGE 40 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 36\n EVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed pre- tillage operations\n1.2\nConducted tillage operation\n1.3\nPerformed post- tillage operation\n1.4\nPracticed safety measures following OSH standards\n1.5\nPerformed record keeping\n2.\nResource\nImplications\nThe following resources MUST be provided:\n2.1\nFarm site/ simulated workshop\n2.2\nTools, materials, farm implements and equipment for land\npreparation activities\n2.3\nPPE\n2.4\nOperator’s manual\n3.\nMethod of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration\n3.2\nWritten examination\n3.3\nOral questioning\n4.\nContext for\nAssessment\n4.1\nCompetency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center in\na simulated workplace setting.\n\n--- PDF PAGE 41 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 37\n\nUNIT OF COMPETENCY:\n:\nCARRY OUT CROP ESTABLISHMENT\nUNIT CODE:\n:"
