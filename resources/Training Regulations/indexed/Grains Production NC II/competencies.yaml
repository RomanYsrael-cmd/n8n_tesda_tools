        "source_text": "500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1. Specific and relevant\ninformation is\naccessed from\nappropriate sources\n1.2. Effective questioning,\nactive listening and\nspeaking skills are\nused together and\n convey information\n1.3. Appropriate medium is\nused to transfer\ninformation and ideas\n1.4. Appropriate non- verbal\ncommunication is used\n1.5. Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6. Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7. Personal interaction is\ncarried out clearly and\nconcisely\n•\nEffective\ncommunication\n•\nDifferent modes\nof communication\n•\n Written\ncommunication\n•\nOrganizational\npolicies\n•\nCommunication\nprocedures and\nsystems\n•\nTechnology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n•\nFollow simple\nspoken language\n•\nPerform routine\nworkplace duties\nfollowing simple\nwritten notices\n•\nParticipate in\nworkplace\nmeetings and\ndiscussions\n•\nComplete work\nrelated documents\n•\nEstimate, calculate\nand record routine\nworkplace\nmeasures\n•\nAbility to relate to\npeople of social\nrange in the\nworkplace\n•\nGather and\nprovide information\nin response to\nworkplace\nrequirements\n\n--- PDF PAGE 7 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are at\nended on time\n2.2 Own opinions are clear\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of employment\nare asked and responded\nto.\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n•\nEffective\ncommunication\n•\nDifferent modes\nof communication\n•\nWritten\ncommunication\n•\nOrganizational\npolicies\n•\nCommunication\nprocedures and\nsystems\n•\nTechnology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n•\nFollow simple\nspoken language\n•\nPerform routine\nworkplace duties\nfollowing simple\nwritten notices\n•\nParticipate in\nworkplace\nmeetings and\ndiscussions\n•\nComplete work\nrelated documents\n•\nEstimate, calculate\nand record routine\nworkplace\nmeasures\n•\nAbility to relate to\npeople of social\nrange in the\nworkplace\n•\nGather and\nprovide\ninformation in\nresponse to\nworkplace\nrequirements\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating to\nconditions of employment\nare completed accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements to\nsupervisor are completed\naccording to\norganizational guidelines\n•\nEffective\ncommunication\n•\nDifferent modes\nof communication\n•\n Written\ncommunication\n•\nOrganizational\npolicies\n•\nCommunication\nprocedures and\nsystems\n•\nTechnology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n•\nComplete work\nrelated documents\n•\nBasic\nmathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n•\nGather and\nprovide information\nin response to\nworkplace\nrequirements\n\n--- PDF PAGE 8 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms\n4.2.\nTelephone message forms\n4.3.\nSafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two-way radio\n5.4.\nWritten including electronic, memos, instruction and forms, non-\nverbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 5\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format of the\norganization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer information\neffectively\n1.4. Conveyed information effectively adopting the formal or informal\ncommunication\n2. Resource Implications\nThe following resources MUST be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Internet\n3. Methods of Assessment\nCompetency in this unit MUST be assessed through:\n3.1. Direct Observation\n3.2. Oral interview and written test\n4. Context for Assessment\n4.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n4.2\nAssessment shall be observed while task are being undertaken\nwhether individually or in