  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in GRAINS PRODUCTION NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1. Specific and relevant\ninformation is\naccessed from\nappropriate sources\n1.2. Effective questioning,\nactive listening and\nspeaking skills are\nused together and\n convey information\n1.3. Appropriate medium is\nused to transfer\ninformation and ideas\n1.4. Appropriate non- verbal\ncommunication is used\n1.5. Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6. Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7. Personal interaction is\ncarried out clearly and\nconcisely\n•\nEffective\ncommunication\n•\nDifferent modes\nof communication\n•\n Written\ncommunication\n•\nOrganizational\npolicies\n•\nCommunication\nprocedures and\nsystems\n•\nTechnology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n•\nFollow simple\nspoken language\n•\nPerform routine\nworkplace duties\nfollowing simple\nwritten notices\n•\nParticipate in\nworkplace\nmeetings and\ndiscussions\n•\nComplete work\nrelated documents\n•\nEstimate, calculate\nand record routine\nworkplace\nmeasures\n•\nAbility to relate to\npeople of social\nrange in the\nworkplace\n•\nGather and\nprovide information\nin response to\nworkplace\nrequirements\n\n--- PDF PAGE 7 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are at\nended on time\n2.2 Own opinions are clear\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of employment\nare asked and responded\nto.\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n•\nEffective\ncommunication\n•\nDifferent modes\nof communication\n•\nWritten\ncommunication\n•\nOrganizational\npolicies\n•\nCommunication\nprocedures and\nsystems\n•\nTechnology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n•\nFollow simple\nspoken language\n•\nPerform routine\nworkplace duties\nfollowing simple\nwritten notices\n•\nParticipate in\nworkplace\nmeetings and\ndiscussions\n•\nComplete work\nrelated documents\n•\nEstimate, calculate\nand record routine\nworkplace\nmeasures\n•\nAbility to relate to\npeople of social\nrange in the\nworkplace\n•\nGather and\nprovide\ninformation in\nresponse to\nworkplace\nrequirements\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating to\nconditions of employment\nare completed accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements to\nsupervisor are completed\naccording to\norganizational guidelines\n•\nEffective\ncommunication\n•\nDifferent modes\nof communication\n•\n Written\ncommunication\n•\nOrganizational\npolicies\n•\nCommunication\nprocedures and\nsystems\n•\nTechnology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n•\nComplete work\nrelated documents\n•\nBasic\nmathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n•\nGather and\nprovide information\nin response to\nworkplace\nrequirements\n\n--- PDF PAGE 8 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms\n4.2.\nTelephone message forms\n4.3.\nSafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two-way radio\n5.4.\nWritten including electronic, memos, instruction and forms, non-\nverbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 5\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format of the\norganization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer information\neffectively\n1.4. Conveyed information effectively adopting the formal or informal\ncommunication\n2. Resource Implications\nThe following resources MUST be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Internet\n3. Methods of Assessment\nCompetency in this unit MUST be assessed through:\n3.1. Direct Observation\n3.2. Oral interview and written test\n4. Context for Assessment\n4.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n4.2\nAssessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 10 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 6\nUNIT OF COMPETENCY\n:\nWORK IN TEAM ENVIRONMENT\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\n\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nDescribe team\nrole and scope\n1.1 The role and objective\nof the team is identified\nfrom available sources\nof information\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources.\n•\nCommunication\nprocess\n•\nTeam structure\n•\nTeam roles\n•\nGroup planning and\ndecision making\n•\nCommunicate\nappropriately,\nconsistent with the\nculture of the\nworkplace\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1 Individual role and\nresponsibilities within\nthe team environment\nare identified.\n2.2 Roles and responsibility\nof other team members\nare identified and\nrecognized.\n2.3 Reporting relationships\nwithin team and external\nto team are identified.\n•\nCommunication\nprocess\n•\nTeam structure\n•\nTeam roles\n•\nGroup planning and\ndecision making\n•\nCommunicate\nappropriately,\nconsistent with the\nculture of the\nworkplace\n3. Work as a team\nmember\n3.1. Effective and\nappropriate forms of\ncommunications used\nand interactions\nundertaken with team\nmembers who contribute\nto known team activities\nand objectives.\n3.2. Effective and\nappropriate\ncontributions made to\ncomplement team\nactivities and objectives,\nbased on individual\nskills and competencies\nand workplace context.\n\n•\nCommunication\nprocess\n•\nTeam structure\n•\nTeam roles\n•\nGroup planning and\ndecision making\n•\nCommunicate\nappropriately,\nconsistent with the\nculture of the\nworkplace\n•\nInteracting\neffectively with\nothers\n\n--- PDF PAGE 11 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 7\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3. Observed protocols in\nreporting using standard\noperating procedures.\n3.4. Contribute to the\ndevelopment of team\nwork plans based on an\nunderstanding of team’s\nrole and objectives and\nindividual competencies\nof the members.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1. Work activities in a team environment with enterprise or specific\nsector\n1.2. Limited discretion, initiative and judgment maybe demonstrated on\nthe job, either individually or in a team environment\n2. Sources of information\n2.1. Standard operating and/or other workplace procedures\n2.2. Job procedures\n2.3. Machine/equipment manufacturer’s specifications and instructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OSH and environmental standards\n3. Workplace context\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe handling and\ndisposal of chemicals\n3.5. Safety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 12 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 8\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource Implications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1.\nObservation of the individual member in relation to the work\nactivities of the group\n3.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of issues\nand strategies in teamwork\n4. Context for Assessment\n4.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n4.2\nAssessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 13 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 9\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\n\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Integrate\npersonal\nobjectives with\norganizational\ngoals\n1.1 Personal growth and work\nplans are pursued towards\nimproving the\nqualifications set for the\nprofession\n1.2 Intra- and interpersonal\nrelationships are\nmaintained in the course\nof managing oneself\nbased on performance\nevaluation\n1.3 Commitment to the\norganization and its goal\nis demonstrated in the\nperformance of duties\n•\nWork values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n•\nCompany policies\n•\nCompany\noperations,\nprocedures and\nstandards\n•