        "source_text": "AFF321201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nperform safety measures effectively and efficiently. It includes\nidentifying areas, tools, materials, time and place in performing\nsafety measures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.\nDetermine\nareas of\nconcern for\nsafety\nmeasures\n1.1 Work tasks are\nidentified in line with\nfarm operations\n1.2 Place for safety\nmeasures are\ndetermined in line with\nfarm operations\n1.3 Time for safety\nmeasures are\ndetermined in line with\nfarm operations\n1.4 Appropriate tools,\nmaterials and outfits\nare prepared in line\nwith job requirements\n• Different work tasks\nin farm operations\n• Place and time for\nimplementation of\nsafety measures\n• Different hazards in\nthe workplace\n• Types of tools,\nmaterials and\noutfits\n• Preparation of\ntools, materials and\noutfits\n\n• Identifying\nwork tasks in farm\noperations\n• Determining place\nand time for\nimplementation of\nsafety measures\n• Reading labels,\nmanuals and other\nbasic safety\ninformation\n• Identifying\neffective/functional\ntools, materials and\noutfit\n• Preparing tools,\nmaterials and\noutfits\n• Discarding\ndefective tools, and\nmaterials\n2\nApply\nappropriate\nsafety\nmeasures\n2.1 Tools and materials are\nused according to\nspecifications and\nprocedures\n2.2 Outfits are worn\naccording to farm\nrequirements\n2.3 Effectivity/shelf\nlife/expiration of\nmaterials are strictly\nobserved\n2.4 Emergency procedures\nare known and followed\n• Uses and functions\nof tools\n• Outfits and how to\nwear it\n• Expiration/shelf life\nof materials\n• Proper disposal of\nexpired materials\n• Environmental rules\nand regulations\n• Emergency\nprocedures\n• Using tools and\nmaterials in the\nworkplace\n• Wearing of outfits\n• Observing\nexpiration/shelf life\nof materials\n• Disposing of\nexpired materials\n• Following\nemergency\nprocedures\n\n--- PDF PAGE 24 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 20\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nto ensure a safe work\nrequirement\n2.5 Hazards in the\nworkplace are identified\nand reported in line\nwith farm guidelines\n• Hazards\nidentification and\nreporting\n• Communication\nskills\n•\nOSHS\n• Identifying and\nreporting of hazards\nin workplace area.\n\n3\nSafe keep\n/dispose tools,\nmaterials and\noutfit\n3.1 Used tools and outfit\nare cleaned after use\nand stored in\ndesignated areas\n3.2 Unused materials are\nproperly labeled and\nstored according to\nmanufacturers\nrecommendation and\nfarm requirements\n3.3 Waste materials are\ndisposed according to\nmanufacturers,\ngovernment and farm\nrequirements\n• Procedures of\ncleaning used tools\nand outfits\n• Label and storage\nunused materials\n• Disposal of wastes\nmaterials\n• Manufacturers\nrecommendation on\nkeeping materials\n• Environmental rules\nand regulations\n• Cleaning used tools\nand outfit\n• Labeling and\nstoring unused\nmaterials\n• Disposing waste\nmaterials\n\n--- PDF PAGE 25 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nWork tasks\nWork task may be selected from any of the\nsubsectors:\n1.1 Crop production\n1.2 Post-harvest\n1.3 Agri-marketing\n1.4 Farm equipment\n2.\nPlace\n2.1 Stock room/storage areas/warehouse\n2.2 Field/farm/orchard\n3.\nTime\n3.1 Fertilizer and pesticides application\n3.2 Feed mixing and feeding\n3.3 Harvesting and hauling\n4. Tools, materials and\noutfits\n4.1 Tools\n4.1.1\nWrenches\n4.1.2\nScrew driver\n4.1.3\nPliers\n4.2 Outfit\n4.2.1\nMasks\n4.2.2\nGloves\n4.2.3\nBoots\n4.2.4\nOverall coats\n4.2.5\nHat\n4.2.6\nEye goggles\n5. Emergency procedures\n5.1 Location of first aid kit\n5.2 Evacuation\n5.3 Agencies contract\n5.4 Farm emergency procedures\n6. Hazards\n6.1 Chemical\n6.2 Electrical\n6.3 Falls\n\n--- PDF PAGE 26 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 22\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined areas of concern for safety measures\n1.2\nApplied appropriate safety measures according to industry\nrequirements\n1.3\nPrepared tools, materials and outfit needed\n1.4\nPerformed proper disposal of used materials\n1.5\nCleaned and stored tools, materials and outfit in designated\nfacilities\n2. Resource\nImplications\n\nThe following resources MUST be provided:\n2.1\nFarm location\n2.2\nTools, equipment and outfits appropriate in applying safety\nmeasures\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1\nPractical demonstration\n3.2\nThird Party Report\n4. Context of\nAssessment\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 27 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 23\nUNIT OF COMPETENCY : USE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
      }
