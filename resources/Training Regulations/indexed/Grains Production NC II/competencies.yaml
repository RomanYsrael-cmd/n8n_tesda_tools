        "source_text": "--- PDF PAGE 13 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      9 \nUNIT OF COMPETENCY   : \nPRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE \n: \n500311107 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in promoting  \n \n \ncareer growth and advancement. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Integrate \npersonal \nobjectives with \norganizational \ngoals \n1.1 Personal growth and work \nplans are pursued towards \nimproving the \nqualifications set for the \nprofession \n1.2 Intra- and interpersonal \nrelationships are \nmaintained in the course \nof managing oneself \nbased on performance \nevaluation \n1.3 Commitment to the \norganization and its goal \nis demonstrated in the \nperformance of duties \n \nWork values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n \nCompany policies \n \nCompany \noperations, \nprocedures and \nstandards  \n \nFundamental rights \nat work including \ngender sensitivity \n \nPersonal hygiene \npractices \n \nAppropriate \npractice of \npersonal hygiene \n \nIntra and \nInterpersonal \nskills \n \nCommunication \nskills \n2. Set and meet \nwork priorities \n2.1 Competing demands are \nprioritized to achieve \npersonal, team and \norganizational goals and \nobjectives. \n2.2 Resources are utilized \nefficiently and effectively \nto manage work priorities \nand commitments \n2.3 Practices along economic \nuse and maintenance of \nequipment and facilities \nare followed as per \nestablished procedures \n \nWork values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n \nCompany policies \n \nCompany \noperations, \nprocedures and \nstandards  \n \nFundamental rights \nat work including \ngender sensitivity \n \nPersonal hygiene \npractices \n\nTime management\n \nAppropriate \npractice of \npersonal hygiene \n \nIntra and \nInterpersonal \nskills \n \nCommunication \nskills \n \nManaging goals \nand time\n\n--- PDF PAGE 14 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      10 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. \nMaintain \nprofessional \ngrowth and \ndevelopment \n3.1 Trainings and career \nopportunities are \nidentified and availed of \nbased on job \nrequirements \n3.2 Recognitions are \nsought/received and \ndemonstrated as proof of \ncareer advancement \n3.3 Licenses and/or \ncertifications relevant to \njob and career are \nobtained and renewed \n \n Work values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n Company policies \n Company \noperations, \nprocedures and \nstandards  \n Fundamental rights \nat work including \ngender sensitivity \n Personal hygiene \npractices\n Appropriate \npractice of \npersonal hygiene \n Intra and \nInterpersonal \nskills \n Communication \nskills\n\n--- PDF PAGE 15 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      11 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1 Performance Appraisal \n1.2 Psychological Profile \n1.3\nAptitude Test\n2.  Resources \n2.1 Human \n2.2 Financial \n2.3 Technology \n2.3.1 Hardware \n2.3.2 Software\n3.  Trainings and career \nopportunities \n3.1 Participation in training programs \n3.1.1  Technical \n3.1.2  Supervisory \n3.1.3  Managerial \n3.1.4  Continuing Education \n3.2 Serving as Resource Persons in conferences and \nworkshops\n4.  Recognitions \n4.1 Recommendations \n4.2 Citations \n4.3 Certificate of Appreciations \n4.4 Commendations \n4.5 Awards \n4.6\nTangible and Intangible Rewards\n5.  Licenses and/or \ncertifications \n5.1 National Certificates \n5.2 Certificate of Competency \n5.3 Support Level Licenses \n5.4\nProfessional Licenses\n\n--- PDF PAGE 16 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      12 \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in the course of \nmanaging oneself based on performance evaluation \n1.3 \nCompleted trainings and career opportunities which are based \non the requirements of the industries \n1.4 \nAcquired and maintained licenses and/or certifications according \nto the requirement of the qualification \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1 \nWorkplace or assessment location \n2.2 \nCase studies/scenarios \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nPortfolio Assessment \n3.2 \nInterview \n3.3 \nSimulation/Role-plays \n3.4 \nObservation \n3.5 \nThird Party Reports \n3.6 \nExams and Tests \n4.  Context for \nAssessment \n4.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n4.2 \nAssessment shall be observed while task are being undertaken \nwhether individually or in group\n",
