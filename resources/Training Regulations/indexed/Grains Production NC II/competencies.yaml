        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard format of the \norganization \n1.2. Accessed information using communication equipment \n1.3. Made use of relevant terms as an aid to transfer information \neffectively \n1.4. Conveyed information effectively adopting the formal or informal \ncommunication \n2. Resource Implications \nThe following resources MUST be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Writing materials \n2.4. Internet \n3. Methods of Assessment \nCompetency in this unit MUST be assessed through: \n3.1. Direct Observation \n3.2. Oral interview and written test \n4. Context for Assessment \n4.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n4.2 \nAssessment shall be observed while task are being undertaken \nwhether individually or in group",
