        "source_text": "AFF321203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nperform basic workplace calculations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.\nPerform\nestimation\n1.1\nJob requirements are\nidentified from written\nor oral\ncommunications\n1.2\nQuantities of\nmaterials and\nresources required to\ncomplete a work task\nare estimated\n1.3\nThe time needed to\ncomplete a work\nactivity is estimated\n1.4\nAccurate estimate for\nwork completion are\nmade\n1.5\nEstimate of materials\nand resources are\nreported to\nappropriate person\n•\nJob requirements/\nlabor needs\n•\nCalculation of\nquantities of\nmaterials and\nresources required\n•\nCalculation of time\nfor job completion\n•\nPreparation of\nestimate report\n•\nBasic mathematical\noperations\n•\nPercentage and\nratios\n•\nUnit Conversion\n\n•\nIdentifying job\nrequirements/labor\n•\nEstimating\nquantities of\nmaterials and\nresources required\n•\nEstimating time for\njob completion\n•\nPerforming basic\ncalculation\n•\nCompute\npercentage\n•\nConvert English to\nmetric systems of\nmeasurement\n•\nPreparing estimate\nreport\n2.\nPerform basic\nworkplace\ncalculation\n2.1\nSystem and units of\nmeasurement to be\nfollowed are\nascertained\n2.2\nCalculation needed to\ncomplete work tasks\nare performed using\nthe four basic\nmathematical\noperation\n2.3\nCalculate whole\nfraction, percentage\nand mixed when are\nused to complete the\ninstructions\n2.4\nNumber computed is\nchecked following\nwork requirements\n•\nFour basic\nmathematical\noperation\n•\nSystem and units of\nmeasurement\n•\nFraction, percentage\nand ratio\n•\nMaterial take off\n•\nMaterials costing\n•\nCompute bill of\nmaterials\n•\nCompute project\ncost\n\n--- PDF PAGE 31 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 27\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Four basic mathematical\noperation\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n2. System of measurement\n2.1 English\n2.2 Metric\n3. Units of measurement\n3.1 Area\n3.2 Volume\n3.3 Weight\n3.4 Length\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Resource Implications\nThe following resources MUST be provided:\n2.1\nRelevant tools and equipment for basic calculation\n2.2\nRecommended data\n3. Method of Assessment\n\nCompetency in this unit MUST be assessed through:\n3.1\nPractical demonstration\n3.2\nWritten examination\n4. Context of Assessment\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision.\n\n--- PDF PAGE 32 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 28\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nCONDUCT VARIETY AND SEED SELECTION\nUNIT CODE\n:"
