s \nDamages and losses include: \n11.1 Broken grains \n11.2 Discolored grains \n11.3 Grain impurities \n11.4 Spoiled grains \n11.5 Pest-infected grains  \n11.6 Moldy corn \n11.7 Spillage due to improper \n11.8 Handling\n12. Packaging \nPackaging includes: \n12.1 Sacks  \n12.2 Plastic bags\n13. Appropriate storage area \nAppropriate storage area: \n13.1 Cool \n13.2 Dry \n13.3 Secured \n13.4 Free from pests and diseases  \n13.5 Clean \n14. Recommended practices \nRecommended practices include: \n14.1 Using new sacks or cleaning used sacks by \nremoving insect pests \n14.2 Separating old stocks from new ones to \nprevent infestation \n14.3 Reporting to immediate authority when \ninfestation is alarming\n\n--- PDF PAGE 59 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      55 \n \n \n \nEVIDENCE GUIDE \n \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Carried out pre-harvest operation \n1.2 Carried out harvesting activity \n1.3 Carried out post-harvest operations \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1 Farm site/simulated workplace \n2.2 Storage facilities/simulated workplace \n2.3 Tools, \nmaterials, \nequipment \nand \nmachineries \nfor \nharvesting and post-harvesting operation  \n2.4 PPE\n3. Method of \nAssessment \nCompetency may be assessed through: \n3.1 Written examination \n3.2 Oral questioning \n3.3 Demonstration\n4. Context for \nAssessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center in \na simulated workplace setting.\n",
