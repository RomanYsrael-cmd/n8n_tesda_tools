ological \nindicators of rice \nand corn crop \nmaturity \no Identifying \nphysical \nindicators of rice \nand corn crop \nmaturity \n \nVerifying \ninformation on \nagronomic history \n \nVerifying records \nfor harvesting \nactivities \n \nMonitoring \nweather \nconditions and \nforecasts \n \nPreparing \ncontingency plan \nfor weather \ndisturbances \n \nDraining of water \nfrom the rice field \n \nRemoving \nobstructions from \nthe field \n \nPreparing \nharvesting tools \nand materials \n \nIdentifying \ndifferent\n\n--- PDF PAGE 55 ---\nTESD-SOP-QSO-01-F08 \nTR –Grains Production NC II (New)                               Promulgated December 16, 2015                                      51 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmachineries for \nharvest and post-\nharvest \noperations \n \nNegotiating with \nmachinery service \nproviders for rice \n \nObtaining \nmachinery \nservices\n2. Carry out \nharvesting \nactivity \n2.1 Appropriate harvesting \nmethods are implemented \nbased on best cultural \npractices  \n2.2 Pilling is done based on \nrecommended practices \n2.3 PPE is worn according to \nOSHS \n2.4 Harvesting tools are used \naccording to work \nrequirement \n2.5 Mechanical harvesting is \nmonitored following work \nrequirement \n \nHarvesting methods \no Manual \no Mechanical \n \nPiling practices \n \nProcedures for \nSafety in the use of \ntools and equipment \n \nUse of honesty tools \n \nMonitoring \nprocedures \n \n \nIdentifying factors \naffecting quality of \ngrain at harvest \n \nEstimating yield \n \nHarvesting rice \nand corn crop \n \nImplementing \nappropriate \nharvesting \nmethods \n \nPilling of \nharvested grains \n \nWearing \nappropriate PPE \n \nUsing harvesting \ntools \n \nMonitoring \nmechanized \nharvesting\n3. Carry out post-\nharvest \noperations \n3.1 Postharvest operations \nare done based on \nreco