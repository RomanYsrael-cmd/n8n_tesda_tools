        "source_text": "500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and\nsafety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify hazards\nand risks\n1.1 Safety regulations and\nworkplace safety and\nhazard control practices\nand procedures are\nclarified and explained\nbased on organization\nprocedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding indicators\nare identified to minimize\nor eliminate risk to co-\nworkers, workplace and\nenvironment in\naccordance with\norganization procedures\n1.3 Contingency measures\nduring workplace\naccidents, fire and other\nemergencies are\nrecognized and\nestablished in\naccordance with\norganization procedures.\n•\nOSH procedures\nand practices and\nregulations\n•\nPersonal hygiene\npractices\n•\nHazards/risks\nidentification and\ncontrol\n•\nOrganization\nsafety and health\nprotocol\n•\nSafety\nconsciousness\n•\nHealth\nconsciousness\n•\nPractice of\npersonal hygiene\n•\nHazards/risks\nidentification and\ncontrol skills\n•\nInterpersonal skills\n•\nCommunication\nskills\n2. Evaluate hazards\nand risks\n2.1 Terms of maximum\ntolerable limits which\nwhen exceeded will\nresult in harm or\ndamage are identified\nbased on threshold limit\nvalues (TLV)\n2.2 Effects of the hazards\nare determined\n\n•\nOSH procedures\nand practices and\nregulations\n•\nPersonal hygiene\npractices\n•\nHazards/risks\nidentification and\ncontrol\n•\nThreshold Limit\nValue –TLV\n•\nPractice of\npersonal hygiene\n•\nHazards/risks\nidentification and\ncontrol skills\n•\nInterpersonal skills\n•\nCommunication\nskills\n\n--- PDF PAGE 18 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 14\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n2.3 OSH issues and/or\nconcerns and identified\nsafety hazards are\nreported to designated\npersonnel in accordance\nwith workplace\nrequirements and\nrelevant workplace OSH\nlegislation\n•\nOSH indicators\n•\nOrganization\nsafety and health\nprotocol\n•\nSafety\nconsciousness\n•\nHealth\nconsciousness\n\n3. Control hazards\nand risks\n3.1 Occupational Health and\nSafety (OSH)\nprocedures for\ncontrolling hazards/risks\nin workplace are\nconsistently followed\n3.2 Procedures for dealing\nwith workplace\naccidents, fire and\nemergencies are\nfollowed in accordance\nwith organization OSH\npolicies\n3.3 Personal protective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OSH\nprocedures and\npractices\n3.4 Appropriate assistance\nis provided in the event\nof a workplace\nemergency in\naccordance with\nestablished organization\nprotocol\n•\nOSH procedures\nand practices and\nregulations\n•\nPPE types and\nuses\n•\nPersonal hygiene\npractices\n•\nHazards/risks\nidentification and\ncontrol\n•\nOSH indicators\n•\nOrganization\nsafety and health\nprotocol\n•\nSafety\nconsciousness\n•\nHealth\nconsciousness\n•\nPractice of\npersonal hygiene\n•\nHazards/risks\nidentification and\ncontrol skills\n•\nInterpersonal skills\n•\nCommunication\nskills\n4. Maintain OSH\nawareness\n4.1 Emergency-related\ndrills and trainings are\nparticipated in as per\nestablished organization\nguidelines and\nprocedures\n4.2 OSH personal records\nare completed and\nupdated in accordance\nwith workplace\nrequirements\n•\nOSH procedures\nand practices and\nregulations\n•\nPPE types and\nuses\n•\nPersonal hygiene\npractices\n•\nOSH indicators\n•\nOrganization\n• Practice of personal\nhygiene\n• Interpersonal skills\n• Communication\nskills\n\n--- PDF PAGE 19 ---\nTESD-SOP-QSO-01-F08\nTR –Grains Production NC II (New) Promulgated December 16, 2015 15\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLED