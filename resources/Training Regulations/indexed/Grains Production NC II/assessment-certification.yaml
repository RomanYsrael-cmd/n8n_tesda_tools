      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 The Full National Qualification of GRAINS PRODUCTION NC II shall be acquired through the accumulation of Certificates of Competency in the following clusters/units of competencies: COC 1 Manage Grains Production • Conduct variety and seed selection • Carry-out crop establishment • Manage crop COC 2 Perform Land Preparation COC 3 Conduct Harvest and Post-Harvest Operation 4.1.2 Upon accumulation and submission of all the above COCs acquired, an individual shall be issued the corresponding National Certificate signed by the TESDA Director General. Certificates of Competency (COCs) shall be issued to candidates who have been assessed as competent in any of the above COCs (COC 1, COC 2, COC 3). 4.1.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.5 The following are qualified to apply for assessment : 4.1.5.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non-formal/informal including enterprise-based trainings related to grains production 4.1.5.2 Industry workers in grains production 4.1.6 Re-assessment shall focus only on the specific area/s where the candidate has not satisfactorily achieved the required level of competence AND must be undertaken within two (2) years during the period of validity of the Training Regulations. 4.1.7 A candidate who fails the assessment for two (2) consecutive times shall be advised to go through a refresher course before taking another assessment."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment. 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. 4.2.3.1 Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level I (NTTC) in Grains Production NC II • Have at least 2 years relevant industry experience for the last five (5) years • Have assisted in the actual conduct of assessment to at least two (2) candidates. For Industry-Assessor • Holder of National Certificate in Grains Production NCII • Holder of Certificate of Competency (COC) in Conduct Competency Assessment under the Trainers Methodology Level I (TM I) • Have at least two (2) years relevant industry experience for the last five (5) years • Have assisted in the actual conduct of assessment to at least two (2) candidates."
    }
