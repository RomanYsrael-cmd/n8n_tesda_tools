  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The Full National Qualification of GRAINS PRODUCTION NC II shall be\nacquired through the accumulation of Certificates of Competency in the\nfollowing clusters/units of competencies:\n\nCOC 1 Manage Grains Production\n• Conduct variety and seed selection\n• Carry-out crop establishment\n• Manage crop\n\nCOC 2 Perform Land Preparation\n\nCOC 3 Conduct Harvest and Post-Harvest Operation\n\n4.1.2 Upon accumulation and submission of all the above COCs acquired, an\nindividual shall be issued the corresponding National Certificate signed by the\nTESDA Director General. Certificates of Competency (COCs) shall be issued\nto candidates who have been assessed as competent in any of the above\nCOCs (COC 1, COC 2, COC 3).\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, work or life experiences may\napply for recognition in a particular qualification through competency\nassessment.\n\n--- PDF PAGE 112 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 108\n4.1.5\nThe following are qualified to apply for assessment :\n\n4.1.5.1\nGraduating students/trainees of WTR-registered programs, graduates\nof NTR programs or graduates of formal/non-formal/informal including\nenterprise-based trainings related to grains production\n\n4.1.5.2\nIndustry workers in grains production\n\n4.1.6\nRe-assessment shall focus only on the specific area/s where the candidate has\nnot satisfactorily achieved the required level of competence AND must be\nundertaken within two (2) years during the period of validity of the Training\nRegulations.\n\n4.1.7\nA candidate who fails the assessment for two (2) consecutive times shall be\nadvised to go through a refresher course before taking another assessment.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1\nSelf-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\n\nThis document can:\na)\nIdentify the candidate’s skills and knowledge\nb)\nHighlight gaps in candidate’s skills and knowledge\nc)\nProvide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd)\nAssist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment.\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are authorized\nby TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 113 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 109\n4.2.3.1\nQualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) in Grains\nProduction NC II\n• Have at least 2 years relevant industry experience for the last five (5)\nyears\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\nFor Industry-Assessor\n• Holder of National Certificate in Grains Production NCII\n• Holder of Certificate of Competency (COC) in Conduct Competency\nAssessment under the Trainers Methodology Level I (TM I)\n• Have at least two (2) years relevant industry experience for the last five\n(5) years\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\n--- PDF PAGE 114 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 110\n\n"
}
