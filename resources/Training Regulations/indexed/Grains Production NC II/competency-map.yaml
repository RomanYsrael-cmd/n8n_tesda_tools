  "source_text": "COMPETENCY MAP – AGRICULTURE, FORESTRY AND FISHERY SECTOR\nGRAINS PRODUCTION NC II\n\n--- PDF PAGE 115 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 111\n\nSupervise\nagronomic crop\nmaintenance\nProduce fruit\nbearing crops\nUndertake\nagronomical\ncrop\nmaintenance\nactivities\nImplement\nvertebrate pest\ncontrol program\nImplement a\nplant\nestablishment\nprogram\nMaintain the\nworkplace\nPerform post\nharvest\noperations of\nmajor tropical\nfruits\nUndertake\nagronomic crop\nharvesting\nactivities\nMonitor and\noperate water\ntreatment\nprocesses\nTransport,\nhandle and\nstore chemicals\nSupport\nagronomic crop\nwork\nPerform post\nharvest\noperation of\nmajor lowland\nand semi-\ntemperate\nvegetable crops\nSave, prepare\nand store\nagricultural\nseed\nCollect samples\nfor a rural\nproduction of\nhorticulture\nmonitoring\nprogram\nSupervise\nagricultural crop\nestablishment\nSupport\nhorticultural\ncrop work\nPrepare land\nfor agricultural\ncrop production\nUndertake field\nbudding and\ngrafting\nSave, prepare\nand store\nagricultural\nseed\nImplement and\nmonitor quality\nassurance\nprocedures\nSupport\nirrigation work\nPrepare and\napply chemicals\nCoordinate a\nhorticultural\ncrop\nmaintenance\nprogram\nUndertake\nagronomic crop\nmaintenance\nactivities\nSupport and\nreview business\nstructures and\nrelationships\nSupport nursery\nwork\nimplement a\nplant nutrition\nprogram\nEstablish\nhorticultural\ncrops\nCoordinate\nmachinery and\nequipment\nmaintenance\nand repair for\nagricultural\ncrops\nPromote plant\nhealth\nConduct pre-\nhorticultural\nfarm operations\nControl weeds\nUndertake a\npropagation\nprogram\nOperate\npertigation\nequipment\nImplement and\nmonitor a\nproperty\nimprovement\nplan\nProduce\nvegetables\nImplement a\npost-harvest\nprogram\nCoordinate\nhorticultural\ncrop harvesting\nOperate within\na budget\nframework\nSupervise\nmaintenance of\nmachinery and\nequipment\nPlan &\nimplement a\nchemical use\nprogram\nEstablish\nagronomic\ncrops\nSupervise\nhorticultural\ncrop harvesting\nComply with\nindustry quality\nassurance\nrequirements\nKeep records\nfor a farm\nbusiness\nApply basic first\naid\nImplement\nvertebrate pest\ncontrol program\nControl weeds,\npests and /or\ndiseases in\ncrops\nSupervise\nagronomic crop\nharvesting\nAnalyze and\ninterpret\nproduction data\nConduct Variety\nand Seed\nSelection\nPerform Land\npreparation\nCarry-out Crop\nEstablishment\nManage crop\nConduct of\nHarvest and\nPost-Harvest\nOperations\n\nCORE COMPETENCY\n\n--- PDF PAGE 116 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 112\nGLOSSARY OF TERMS\n\n1. 3Rs- Reduce, Re-use, and Recycle\n2. ABIOTIC- Non living thing the abiotic factor at the environment include light temperature and\natmospheric gases\n3. AWD- Alternate wet and dry\n4. BIOTIC- of or having to do with or living organism, produce or caused by living organism\n5. CLIMATE CHANGE – records changes over decades to millions of years\n\n6. CLIMATE – average and variations of weather over a long period of time (30 years)\n\n7. CLEANING- removal of unnecessary materials/debris in the field; is an essential postharvest\noperation which is done by removing foreign seeds and other impurities\n8. CRH- Carbonized Rice Hull\n9. DEHUSKING –process of removing outer covering of corn ears\n10. DIKES- levees or bunds enclosing a field\n11. DRY LAND TILLAGE – plowing and harrowing dry soil or upland fields\n12. DRYING – the process of reducing moisture content through the process of heat transfer by\nconverting water in the grains to a vapor which is brought to the atmosphere\n\n13. FARMALITE –a tool use to directly sow corn seeds\n\n14. GRAIN QUALITY –is a combination of physical and chemical characteristics which are\nconsidered desirable\n\n15. HARVEST - the process or period of gathering in mature crops by cutting the panicles\nattached to the stalks\n\n16. LAND PREPARATION – the process of preparing the soil for planting.\n\n17. MILLING – involves the removal of hull and bran from rough rice to produce milled rice or\nwhite rice\n\n18. MOISTURE CONTENT–is the quantity of water contained in a material or grain at a given\ntime\n\n19. OFF TYPE- Means any seed or plant not a part of the variety in that deviates\n\n--- PDF PAGE 117 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 113\n20. OSHS- Occupational Safety Hazzard Standard\n21. PhilGAP – Philippine Good Agricultural Practices\n22. PPE- Protective Polyethylene Equipment\n23. POSTHARVEST –encompasses the sequence of activities and operations from the time and\nplace of harvest to the time and place of consumption\n\n24. RIVERINE – area of crop production along the river banks\n\n25. SHELLING – removal of grains from the cob\n\n26. SICKLE – a farming tool with a long curved blade and long handle that is used for cutting\ngrains\n\n27. SIDE PLOWING – passing the plow along the edges of the field (near the dikes)\n28. SIPS- Soak, Incubate, Prepare the area for sowing and Sow the pre-germinated seeds\n\n29. STORAGE – the preservation of quality and quantity of palay/rice for future use.\n\n30. TILLAGE – is the process of mechanically altering some physical characteristics of the soil to\nobtain a condition more appropriate for growing crops\n\n31. THRESHING – the process of detaching and separating rice grains from the panicle\n\n32. UPLAND- a land area that does not impound water, not confined to higher elevation alone.\n\n33. WEATHER – all natural phenomena within the atmosphere at a given time (hours to days)\n\n34. WETLAND TILLAGE – preparing the soil of lowland fields in a saturated or flooded condition\n\n35. WEED - weed is a plant considered undesirable in a particular situation a plant in the wrong\nplace.\n\n--- PDF PAGE 118 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 114",
