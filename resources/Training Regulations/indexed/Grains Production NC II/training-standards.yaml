      "source_text": "3.2 TRAINING DELIVERY\n\n1.\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology (Video Conferencing, Webinar, etc).\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2.\nThe competency-based TVET system recognizes various types of delivery modes, both\non-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1. Institution- Based:\n\n•\nClassroom-based or School-based training coordinated study other the\nschool or center, with classroom and/or laboratory components.\n\n•\nDual Training System (DTS) / Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\n\n•\nSupervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n\n--- PDF PAGE 102 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 98\n•\nProject-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n2.2. Enterprise-Based:\n\nEnterprise-based training may also be taken to mean a school or training center\nwith one or more partner enterprise or an enterprise or group of enterprises\nsetting up a common training facility or partnering with a school or training center.\n\n•\nFormal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n•\nInformal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n•\nEnterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\n\n2.3. Community-Based –refers to a short program conducted or coordinated by\nNGOs, LGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs are usually\nconducted in informal settings such as barangay hall, basketball courts and other\navailable venues in a community. These programs can also be mobile training\nprograms (MTP)."
    },
