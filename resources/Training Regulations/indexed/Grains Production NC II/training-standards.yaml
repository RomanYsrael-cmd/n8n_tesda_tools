  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for GRAINS PRODUCTION NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide training on the development of competency-based curricula to enable\ntraining providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language and other\nacademic subjects shall be contextualized. To this end, TVET providers may develop a\nContextual Learning Matrix (CLM) to include also green technology, issues on health and drugs\nand persons with disabilities (PWD’s).\n\nCourse Title: GRAINS PRODUCTION NC Level NC II\n\nNominal Training Duration:\n\n 20 hrs\nBasic Competencies\n72 hrs\nCommon Competencies\n331 hrs\nCore Competencies\n Total\n423 hrs\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of a rice\nor corn farmer or rice or corn grower to conduct variety and seed selection, perform land\npreparation, carry-out crop establishment, manage crop and conduct harvest and post-harvest\noperations. It covers skills rice and corn farming and growing focusing on manual operations;\nwhile for mechanized operations, the farmer has to have competencies in sourcing out services\nfrom farm machinery service providers.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 61 ---\nTR –Grains Production NC II (New) Promulgated December 16, 2015 57\nBASIC COMPETENCIES\n20 HRS\n\nUnit of\nCompetenc