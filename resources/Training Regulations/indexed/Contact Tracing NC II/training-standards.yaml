llow protocol and confidentiality of\nrecords and data at all times\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n4 hours\n\n5.3 Prepare reports\nbased on\n• Lecture and discussion on the following topics:\no Workplace Records System Requirements\no Report Preparation\no System Back-up\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Oral questioning/\ninterview\n• Written Test\n4 hours\n\n--- PDF PAGE 124 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n120\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nworkplace\nrecord system\no Workplace feedback mechanism\n• Perform the following tasks:\no Prepare reports in accordance with\nstandard forms\no Submit reports to immediate supervisor in\naccordance with established standards\nand procedures\no Follow protocol and confidentiality of\nrecords and data at all times\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Return\ndemonstration\n• Direct observation\nof candidate\n6. Conduct\nmonitoring and\nsurveillance (8\nhours)\n6.1 Monitor close\ncontacts of a\nspecific case\n• Lecture and discussion on the following topics:\no Basic health background\no Monitoring Records and Documentation\no Use of medical equipment in vital signs\ntaking\no Health Interventions\n• Perform the following tasks:\no Monitor all contacts’ vital signs in\naccordance with established standards\nand procedures\no Gather relevant information through\ninterview\no Update all contacts’ signs and symptoms\nlog forms regularly\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n3 hours\n\n6.2 Update client’s\nrecords\n• Lecture and discussion on the following topics:\no Interview Update Process\no Health Data Information Updating\no Data/Records Updating\no Clients/Patients Health Status\n• Perform the following tasks:\no Conduct interview in accordance with\nestablished standards and procedures\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n3 hours\n\n--- PDF PAGE 125 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n121\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Update health data information in\naccordance with established standards\nand procedures\no Maintain records in accordance with\ndocumentation process\n• Face-to-face\nlecture/ discussion\n• Role-playing\n6.3 Inform\nimmediate\nsupervisor of\nspecific\ncases/findings in\na timely manner\n• Lecture and discussion on the following topics:\no Identifying organizational position for\nproper communication of findings\no Incident reporting of specific cases (e.g.\nsymptoms: fever, cough, sore throat,\ndifficulty of breathing, colds, diarrhea)\n• Perform the following tasks:\no Specific cases are discussed with the\nsupervisor in accordance with\no documentation process\no Specific cases are reported promptly in\naccordance with documentation process\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n2 hours\n\n--- PDF PAGE 126 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n122\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution-based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies; or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of\nthe trainee through actual experience in the workplace to acquire\n\n--- PDF PAGE 127 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n123\n\nspecific competencies as prescribed in the training regulations. It is\nimperative that the deployment of trainees in the workplace is adhered\nto training programs agreed by the institution and enterprise and status\nand progress of trainees are closely monitored by the training institutions\nto prevent opportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production process\nand apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-based:\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program should possess the following\nrequirements:\n\n• Must have completed at least 10 years basic education or Holder of\nAlternative Learning Systems (ALS) certificate of completion with grade 10\nequivalent\n• Must possess good communication skills\n\n--- PDF PAGE 128 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n124\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Contact Tracing NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices and\ntheir availability in the local market.\n\nTOOLS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n25\npcs\nCalculator\n\nINSTRUCTONAL MANUALS/FORMS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n\nStandard Forms for Case Investigation:\n25\nforms\nCOVID-19 Case Investigation Form\n25\nforms\nWHO Case Report Form\n25\nforms\nTravel History, Places Visited and Events\nAttached form\n25\nforms\nClose Contact Line List Form\n25\nforms\nClose Contact Profile Form\n25\nforms\nContact Tracing signs and Symptoms Log Form\n25\nforms\nHealth Workers Risk Assessment Form\n\nRelevant Policies and Procedure Manuals:\n25\npcs\nRA 11469\n25\npcs\nRA 11332\n25\npcs\nAO 2020-0013\n25\npcs\nDOH Admin Order 2020-0013\n25\npcs\nDepartment Memo No. 2020-0068\n25\npcs\nDepartment Circular No. 2020-0048\n25\npcs\nDepartment Circular No. 2020-0152\n25\npcs\nDepartment Circular No. 2020-0108\n25\nforms\nSigns and Symptoms Log Form\n25\nforms\nReferral Form\n\nMATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n25\npcs\nBallpen\n25\npcs\nPencil\n3\nreams\nCoupon Bond / Bond Paper\n25\npcs\nLogbook\n\n--- PDF PAGE 129 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n125\n\n25\npcs\nFolder\n25\npcs\nFastener\n25\npcs\nEraser\n25\npcs\nNotebook\n25\npcs\nRuler, 12 inches\n25\npcs\nHand sanitizer, 100 ml\n\nPersonal Protective Equipment:\n25\npcs\nFaces shield\n25\npcs\nRespirator (N95 or FFP2)\n25\npcs\nApron\n25\npcs\nGown\n25\npcs\nGloves, latex\n25\npcs\nGoggles\n25\npcs\nSurgical mask (disposable)\n\nCleaning and Disinfection Materials:\n10\nbottles\nAlcohol, 70% Isopropyl content, 500 ml\n5\nbars\nHand soap\n5\nbottles\nChlorine bleach, 500 ml\n\nEQUIPMENT\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n2\nunits\nTransport Services\n\nCommunication Devices:\n2\nunits\nCellphone\n2\nunits\n2 Way Radio\n2\nunits\nLandline Telephone\n\nDevices in taking vital signs:\n2\nunits\nStethoscope\n2\nunits\nBp apparatus (aneroid or digital)\n2\nunits\nPen lights\n2\nunits\nPulse oximeter, fingertip type\n2\nunits\nComputer Unit with Accessories with following\nspecs:\n-\nWindows 8 and higher\n-\nAt least 8GB RAM\n-\nAt least 500GB of hard disk space\n-\nAt least 2.89 ghz processor\n-\nAt least 5mbps internet connection\n2\nunits\nLaptop with following specs:\n-\nOS Name- Microsoft Windows 10 Pro\n-\nProcessor Inter ® Core ™ i7-10510U CPU @1.8\nGHz 2.30 GHz\n-\nInstalled RAM 16.0 GB (15.0GB usable\n\n--- PDF PAGE 130 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n126\n\n-\nDevice DCE 114b8-5AC4-4CB5-8CBE-\n051F72A148C6\n-\nSystem Type 64-Bit operating system, x 64-\nbased processor\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 learners/trainees.\n\nSpace Requirement\nSize in\nMeters\nArea in Sq.\nMeters\nTotal Area in\nSq. Meters\nDistance Learning\n(Laboratory/Workshop/Activity\narea)\n3x4\n12\n12\nPractical Work Area\n5x4\n20\n20\nContextual Learning Area\n(Lecture Room)\n5x6\n30\n30\nSeparate restrooms for female,\nmale and PWD\n\n10\n10\nCirculation Area (30% of total\narea)\n\n22\n22\nTotal Workshop Area:\n94 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Contact\nTracing NC II;\n• Must be a graduate of any health or allied health course or Bachelor’s Degree;\n• Must have at least two (2) years public health* industry experience within the\nlast five (5) years; and\n• Must possess good communication skills\n\n*Note:\nPractice of public health refers to disease prevention, emergency response,\ndisease surveillance, health research, health promotion and education,\npopulation health and health system management (Reference: World Health\nOrganization (WHO) European Action Plan for Strengthening Public Health\nCapacities and Services (2012)\nhttps://www.euro.who.int/en/health-topics/Health-systems/public-health-\nservices/public-health-services). A certificate of employment or any document\nwhich will serve as evidence that indeed the trainer has public health industry\nexperience in any area as indicated must be submitted.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 131 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n127"
