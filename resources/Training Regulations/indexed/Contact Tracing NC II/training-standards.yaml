ce\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n• Discussion of environmental protection and\nresource efficiency targets\n• Analysis on the relevant work procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.3 Convey\ninefficient and\nineffective\nenvironmental\npractices\n• Identification of (re)training needs and usage\nof environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing environment awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n\n--- PDF PAGE 100 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n96\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on best entrepreneurial practices\n• Discussion on quality procedures and\npractices\n• Case studies on cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 hour\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating entrepreneurial\nworkplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n9.3 Implement cost-\neffective\noperations\n• Case studies on Preservation, optimization\nand judicious use of workplace resources\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n2 hours\n\n--- PDF PAGE 101 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n97\n\nCOMMON COMPETENCIES\n(112 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1 Implement\nand monitor\ninfection\ncontrol\npolicies and\nprocedures\n(32 hours)\n1.1 Provide\ninformation to\nthe work group\nabout the\norganization's\ninfection control\npolicies and\nprocedures.\n•\nLecture and discussion on:\n-\nUse of personal protective equipment (PPE)\n-\nTransmission of infectious diseases\n-\nConcepts and modes of communication\n-\nCommunication equipment (computer,\ntelephone, cell phone etc.)\n-\nOSH, infection control, environmental and\ninstitutional, rules, guidelines, policies and\nprocedures\n-\nRespecting for patient / client rights\n-\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n•\nDemonstrate proper use of personal\nprotective equipment (PPE)\n•\nDemonstrate proper hand washing (WHO\nStandard)\n•\nApply Body Substance Isolation (BSI) by\nusing PPE (Personal Protective Equipment)\n•\nDemonstrate use of disinfectant\n•\nApply social distancing\n•\nDemonstrate operating equipment for\ncommunication\n•\nApply effective communicating and\ninterpersonal skills including:\n-\nlanguage competence\n-\nliteracy and reading competence\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 102 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n98\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nnegotiating Skills\n-\nintra and Interpersonal skills\n1.2 Integrate the\norganization's\ninfection control\npolicy and\nprocedure into\nwork practices\n•\nLecture and discussion on:\n-\nUse of verbal and non-verbal therapeutic\ncommunication\n-\nRA 11058 – OSH Law\n-\nRA 9008 – Ecological Solid Waste\nManagement Act\n-\nRA 856 – Sanitation Code of the Phil.\n-\nHazards and infectious risk\n-\nSafe work procedures\n-\nUse of computer for documentation and\nreporting\n•\nDemonstrate appropriate wearing, removal\nand disposal of PPE (Personal Protective\nEquipment)\n•\nEncourage employees to report hazards and\nrisks in the work place\n•\nRecognize suggestions of employees to\nimprove infection control practices\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n1.3 Monitor infection\ncontrol\nperformance and\nimplement\nimprovements in\npractices\n•\nLecture and discussion on:\n-\nKey performance indicators of infection\ncontrol and prevention\n-\nMonitoring, surveillance and investigation of\ninfection risks and hazardous events\n-\nAggregate infection control information\nreports\n•\nDemonstrate identification, correction and\nreporting inadequacies in work procedures\nand infection control measures\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Demonstration\nwith oral\nquestioning\n8 hours\n\n--- PDF PAGE 103 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n99\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Respond\neffectively to\ndifficult/\nchallenging\nbehavior\n(24 hours)\n2.1 Plan responses\n•\nLecture and discussion on:\n-\nConcepts and modes of communication\n-\nEnvironmental and institutional, rules,\nguidelines, policies and procedures\n-\nIssues relating to difficult and challenging\nbehavior\n-\nPatient / client issues which need to be\nreferred to an appropriate health\nprofessional\n-\nPolicies and rules of health professionals\ninvolved with the care of patient / client\n-\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n-\nModes of verbal, non-verbal, and written\ncommunication\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult\nor challenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills\n•\nDemonstrate reporting and documentation\nwith accuracy\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Demonstration\nwith oral\nquestioning\n12 hours\n2.2 Apply response\n•\nLecture and discussion on:\n-\nSuitable communication techniques to\nachieve the desired outcomes in responding\nto difficult or challenging behavior\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n8 hours\n\n--- PDF PAGE 104 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n100\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult\nor challenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills\nDemonstrate reporting and documentation\nwith accuracy\n• Video Presentation\n(offline / face to