ollowing tasks:\no Define learning outcomes you and the\npatient expect from the teaching-learning\nprocess\no Develop specific learning objectives using\nWHO, DOES, WHAT, HOW, and WHEN\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n4 hours\n\n--- PDF PAGE 122 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n118\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nas guide in accordance with established\nstandards and procedures\no Decide together with the patient what\ninformation will be taught by looking\nat the information that the patient ‘needs\nto know’ and what is ‘nice to know’\n(Patient information is decided on what to\nbe taught (needs to know) and what not to\nbe taught (nice to know)\no Give simple written instructions as\nnecessary\n4.4 Evaluate the\npatient’s\nprogress during\nand after\nteaching\n• Lecture and discussion on the following topics:\no Paraphrasing techniques\no Identification of learning gaps\no Evaluation of learning/ performance\n• Perform the following tasks:\no Ask patient to restate instructions in his or\nher own words\no Ask patient questions to see whether there\nare areas of instruction that need\nreinforcing or re-teaching\no Follow-up patient including family\nmembers as needed to determining how\nwell the patient is performing tasks he or\nshe has been taught\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n4 hours\n\n5. Perform data\nrecording and\nreporting (12\nhours)\n5.1 Demonstrate\ncomputer\nliteracy and\ndata/records\nmanagement\n• Lecture and discussion on the following topics:\no Basic MS Office Application\no Email System\no Search Engines and Web Browsing\no Data/Records management\n• Perform the following tasks:\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n4 hours\n\n--- PDF PAGE 123 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n119\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Navigate/operate basic Microsoft Office\napplications in accordance with\nestablished standards and procedures\no Use E-mail system in accordance with\nestablished standards and procedures\no Conduct basic functions of www-browser\nto search for necessary information in\naccordance with established standards\nand procedures\no Store, maintain, and retrieved easily data\nor files in a hard drive in an organized\nmanner\no Follow protocol and confidentiality of\nrecords and data at all times\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n5.2 Collate records\n• Lecture and discussion on the following topics:\no Types of Records\no Documentation and Recording Procedure\no Standard Forms in records system\no Basic Statistics\n• Perform the following tasks:\no Update client’s information in accordance\nwith workplace records system\nrequirements and criteria\no Follow documents and records data with a\nset of standards\no Summarize client’s information based on\nthe workplace records system\no Follow protocol and confidentiality of\nrecords and data at all times\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n4 hours\n\n5.3 Prepare reports\nbased on\n• Lecture and discussion on the following topics:\no Workplace Records System Requirements\no Report Preparation\no System Back-up\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Oral questioning/\ninterview\n• Written Test\n4 hours\n\n--- PDF PAGE 124 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n120\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nworkplace\nrecord system\no Workplace feedback mechanism\n• Perform the following tasks:\no Prepare reports in accordance with\nstandard forms\no Submit reports to immediate supervisor in\naccordance with established standards\nand procedures\no Follow protocol and confidentiality of\nrecords and data at all times\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Return\ndemonstration\n• Direct observation\nof candidate\n6. Conduct\nmonitoring and\nsurveillance (8\nhours)\n6.1 Monitor close\ncontacts of a\nspecific case\n• Lecture and discussion on the following topics:\no Basic health background\no Monitoring Records and Documentation\no Use of medical equipment in vital signs\ntaking\no Health Interventions\n• Perform the following tasks:\no Monitor all contacts’ vital signs in\naccordance with established standards\nand procedures\no Gather relevant information through\ninterview\no Update all contacts’ signs and symptoms\nlog forms regularly\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n3 hours\n\n6.2 Update client’s\nrecords\n• Lecture and discussion on the following topics:\no Interview Update Process\no Health Data Information Updating\no Data/Records Updating\no Clients/Patients Health Status\n• Perform the following tasks:\no Conduct interview in accordance with\nestablished standards and procedures\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n3 hours\n\n--- PDF PAGE 125 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n121\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Update health data information in\naccordance with established standards\nand procedures\no Maintain records in accordance with\ndocumentation process\n• Face-to-face\nlecture/ discussion\n• Role-playing\n6.3 Inform\nimmediate\nsupervisor of\nspecific\ncases/findings in\na timely manner\n• Lecture and discussion on the following topics:\no Identifying organizational position for\nproper communication of findings\no Incident reporting of specific cases (e.g.\nsymptoms: fever, cough, sore throat,\ndifficulty of breathing, colds, diarrhea)\n• Perform the following tasks:\no Specific cases are discussed with the\nsupervisor in accordance with\no documentation process\no Specific cases are reported promptly in\naccordance with documentation process\n• Individual/Modular/\nSelf-paced\nLearning\n• Distance Learning\n• Individual home\nassignment\n• Focus Group\nDiscussion\n• Face-to-face\nlecture/ discussion\n• Role-playing\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct observation\nof candidate\n2 hours\n\n--- PDF PAGE 126 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n122",
