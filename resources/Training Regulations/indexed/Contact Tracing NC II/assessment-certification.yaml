    {
      "number": "1",
      "text": "Case investigation - is part of the process of supporting patients with suspected or confirmed infection. Public health staff work with a patient to help them recall everyone with whom they have had close contact during the timeframe while they may have been infectious."
    },
    {
      "number": "2",
      "text": "Close Contact - is someone who was within 6 feet of an infected person for a total of 15 minutes or more starting from 48 hours before illness onset until the time the patient is isolated. They should stay home, maintain social distancing, and self-monitor until 14 days from the last date of exposure."
    },
    {
      "number": "3",
      "text": "Contact follow-up - Regular follow-up should be conducted with all contacts to monitor for symptoms and test for signs of infection."
    },
    {
      "number": "4",
      "text": "Contact Identification - Once someone is confirmed as infected with a virus, contacts are identified by asking about the person’s activities and the activities and roles of the people around them since onset of illness. Contacts can be anyone who has been in contact with an infected person: family members, work colleagues, friends, or health care providers."
    },
    {
      "number": "5",
      "text": "Contact Listing - All persons considered to have contact with the infected person should be listed as contacts. Efforts should be made to identify every listed contact and to inform them of their contact status, what it means, the actions that will follow, and the importance of receiving early care if they develop symptoms. Contacts should also be provided with information about prevention of the disease. In some cases, quarantine or isolation is required for high risk contacts, either at home, or in hospital."
    },
    {
      "number": "6",
      "text": "Contact Tracing - People in close contact with someone who is infected with a virus, such as the Ebola virus, are at higher risk of becoming infected themselves, and of potentially further infecting others. Closely watching these contacts after exposure to an infected person will help the contacts to get care and treatment, and will prevent further transmission of the virus."
    },
    {
      "number": "7",
      "text": "Data Recording - is to set in writing and assure the preservation of the data collected in the course of field or laboratory studies. The experimental design of each study determines the types of data to be collected in terms of the objectives and resources available for the study."
    },
    {
      "number": "8",
      "text": "Data Reporting - is the process of collecting and submitting data which gives rise to accurate analyses of the facts on the ground;[1] inaccurate data reporting can lead to vastly uninformed decision-making based on erroneous evidence. Different from data analysis that transforms data and information into insights, data reporting is the previous step that translates raw data into information.[1] When data is not reported, the problem is known as underreporting; the opposite problem leads to false positives. --- PDF PAGE 137 --- Contact Tracing NC II - HHHCCT221 Promulgated (06/2021) 133"
    },
    {
      "number": "9",
      "text": "Epidemiological Investigation - is a set of procedures used to identify the cause, i.e. the infectious agent, responsible for the disease. It is also used to identify the people affected, the circumstances and mode of spread of the disease, and other relevant factors involved in propagating the epidemic."
    },
    {
      "number": "10",
      "text": "Health Facility - any location where healthcare is provided. Health facilities range from small clinics and doctor's offices to urgent care centers and large hospitals with elaborate emergency rooms and trauma centers. The number and quality of health facilities in a country or region is one common measure of that area's prosperity and quality of life. In many countries, health facilities are regulated to some extent by law; licensing by a regulatory agency is often required before a facility may open for business. Health facilities may be owned and operated by for-profit businesses, non-profit organizations, governments, and in some cases by individuals, with proportions varying by country."
    },
    {
      "number": "11",
      "text": "Interview - a meeting of people face to face, especially for consultation"
    },
    {
      "number": "12",
      "text": "Monitoring - observe and check the progress or quality of (something) over a period of time; keep under systematic review."
    },
    {
      "number": "13",
      "text": "Notifiable Diseases - is any disease that is required by law to be reported to government authorities. The collation of information allows the authorities to monitor the disease, and provides early warning of possible outbreaks."
    },
    {
      "number": "14",
      "text": "Profiling - the recording and analysis of a person's psychological and behavioral characteristics, so as to assess or predict their capabilities in a certain sphere or to assist in identifying a particular subgroup of people."
    },
    {
      "number": "15",
      "text": "Quarantine Facility - an approved facility in which organisms are raised or held in isolation to prevent pathogen introduction or the spread of disease."
    },
    {
      "number": "16",
      "text": "Referral - an act of referring someone or something for consultation, review, or further action. The directing of a patient to a medical specialist by a primary care physician. A person whose case has been referred to a specialist doctor or a professional body."
    },
    {
      "number": "17",
      "text": "Surveillance - closely watching a patient's condition but not treating it unless there are changes in test results. Surveillance is also used to find early signs that a disease has come back. It may also be used for a person who has an increased risk of a disease, such as cancer. --- PDF PAGE 138 --- Contact Tracing NC II - HHHCCT221 Promulgated (06/2021) 134 The Technical Education and Skills Development Authority (TESDA) would like to extend thanks and appreciation to the representatives of business, industry, academe and government agencies who provided their time and expertise to the development of this Training Regulations. DR. PRETCHELL P. TOLENTINO Human Resource Management Officer V Department of Health - Health Human Resource Development Bureau Sta. Cruz, Manila DR. DONNABEL TUBERA-PANES Medical Officer IV Head, City Epidemiology Surveillance Unit, Baguio City DR. NELSON P. HORA Medical Officer IV Head, Contact Tracing and Monitoring Team City Camp Health District, Baguio City DR. AVA REBECCA V. ALEJANDRO Municipal Health Officer Unisan, Quezon MS. MARIA YZLETTE LISING Administrative Officer IV Department of Health - Health Human Resource Development Bureau Sta. Cruz, Manila MR. EBENEZER BONBON Human Resource Management Officer IV Department of Health - Health Human Resource Development Bureau Sta. Cruz, Manila MS. MA. CATHERINE C. ARZOBAL Human Resource Management Officer III Department of Health - Health Human Resource Development Bureau Sta. Cruz, Manila MS. JOANNA MARI V. LUNAR Human Resource Management Officer II Department of Health - Health Human Resource Development Bureau Sta. Cruz, Manila --- PDF PAGE 139 --- Contact Tracing NC II - HHHCCT221 Promulgated (06/2021) 135 The PARTICIPANTS in the Validation of this Training Regulation Mary G. Ng TESDA Board Board Member Rogelio J. Chavez, JR. TESDA Board Board Member Randolph I. Nonato TESDA Board Board Member Arturo M. Milan TESDA Board Board Member Dr. Elsa Florendo Commission on Highe