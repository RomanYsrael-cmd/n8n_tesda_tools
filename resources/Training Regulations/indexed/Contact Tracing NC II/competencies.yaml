        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Accomplished standard interview/documentation form\n1.2 Accomplished Close Contact Line List Form\n1.3 Donning and doffing of Personal Protective Equipment\n1.4 Planned and prepared for the conduct of case\ninvestigation\n1.5 Conducted interview with the patient\n1.6 Closed procedure/ interview\n1.7 Evaluated the outputs of the interview\n1.8 Identified close contacts\n2. Resource Implications\nThe following resources should be provided:\n2.1 Standard Forms for case investigation\n2.2 Personal Protective Equipment\n2.3 Transportation expenses\n2.4 Supplies needed for interviews such as ballpen,\npencils, etc.\n2.5 Cellphone load for data if using online platform\n2.6 Food and water\n2.7 Hand Sanitizer\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Role-playing\n3.2 Question and answer\n3.3 Examination\n3.4 Return demonstration on donning and doffing including\nhealth care waste management\n4. Context of Assessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 71 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n67\n\nUNIT OF COMPETENCY : CONDUCT PROFILING OF ALL CONTACTS AND\nINDEX CASES AND FOLLOW-UP\n\nUNIT CODE\n:"
        },
        "source_text": "HHC532334\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge skills and attitudes required\nto gather relevant and specific information from the\nidentified suspected, probable and confirmed positive cases\nfor all notifiable diseases.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1. Plan and\nprepare for\nthe conduct\nof case\ninvestigation\n\n1.1 Patient’s personal\ninformation is checked\nand verified in\naccordance with\nestablished standards\nand procedures\n1.2 Method of the interview\nis identified and location\nis assessed if conducive\nfor interview\n1.3 Contact tracer\nmembers and roles of\neach member are\nidentified and discussed\nin accordance with\nestablished standards\nand procedures\n1.4 Prescribed/Standard\ncontact tracing forms are\nprepared in accordance\nwith established\nstandards and\nprocedures\n\n1.1 RA 10173 - Data\nPrivacy Act of 2012\nand its IRR\n1.2 Proclamation No.\n929, s. 2020, RRD\n1.3 IATF Resolutions\n1.4 Risk Assessment\n1.5 Basic Safety and\nSecurity in the Field\n1.6 Basic Computing\nand Numerical\nReasoning\n1.7 Basic Logic\n1.8 Basic Psychology\n1.9 RA 11332 -\nMandatory Reporting\nof Notifiable\nDiseases and Health\nEvents of Public\nHealth Concern Act\n1.10 Donning and\nDoffing of PPE\n1.11 Basic Computer\nProcessing\n1.12 Document\nProcessing\n(Microsoft Office\nWord, Excel,\nPowerPoint,\nGoogle Mail, Docs,\nDrive)\n1.13 Appropriate\nApps/Information\nSystem\n1.1 Ability to encode,\nmanage, and\nupdate information\nsystems\n1.2 Ability to set-up and\nwear the Personal\nProtective\nEquipment (PPE)\n1.3 Ability to conduct\nBasic First Aid\n1.4 Psychosocial Skills\n1.5 Probing Skills\n1.6 Information\nGathering\n1.7 Report Writing\n1.8 Communication and\nResearch Skills\n1.9 Ability to relate with\nand communicate\ninformation to\npeople with different\nsocial, cultural and\nethnic backgrounds\n\n--- PDF PAGE 65 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1.14 Use of appropriate\ngadgets for contact\ntracing\n2. Conduct\ninterview\nwith the\npatient\n\n2.1 Preliminary verification\nof identity must be\nestablished in\naccordance with\nestablished procedures\n2.2 Rapport and trust are\nestablished with the\npatient and his/her\nfamily\n2.3 Patient’s and family’s\nemotional state,\nbasic necessities and\npatient living status is\nassessed and\naddressed accordingly\n2.4 Members of the\ncontact tracing team\nand their roles are\ndiscussed to the\npatient and to his/her\nfamily in accordance\nwith established\nstandards and\nprocedures\n2.5 Reason for interview is\nexplained to the patient\nand to his/her family in\naccordance with\nestablished standards\nand procedures\n2.6 Open statements are\nused to start the\ninterview proper in\naccordance with\nestablished standards\nand procedures.\n(Reiteration of Opening\nSpiel/ Statement)\n2.7 Appropriate probing\nquestions are used to\nelicit more information\nfrom the patient and\nhis/her family as\nappropriate\n2.8 Active listening is\ndemonstrated at all\ntimes\n2.1 Non-verbal\nCommunication\n2.2 Verbal\nCommunication\n2.3 Active Listening\n2.4 Gatekeeping of\nInformation\n2.5 Privacy and\nConfidentiality\n2.6 Basic Computing\nand Numerical\nReasoning\n2.7 Basic Logic\n2.8 Inductive Reasoning\n2.9 Deductive\nReasoning\n2.10 Use of recording\ndevices, mobile/\ncellular phones,\ntablets, laptop, etc.\n2.11 Case Investigation\nForm\n2.12 WHO Case Report\nForm\n2.1 Psychosocial Skills\n2.2 Probing Skills\n2.3 Communication\nSkills\n2.4 Information\nGathering\n2.5 Report writing/\nminutes of the\ninterview\n2.6 Research Skills\n2.7 Ability to relate\nwith and\ncommunicate\ninformation to\npeople with\ndifferent social,\ncultural and ethnic\nbackgrounds\n2.8 Interview\nTechniques\n\n--- PDF PAGE 66 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n62\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n2.9 Case Investigation\nforms and other forms\nprescribed are filled out\nappropriately\n3. Close\nprocedure/\ninterview\n3.1 All questions and\ninformation gathered\nare verified and\nconsolidated in\naccordance with\nestablished standards\n3.2 Information gathered is\nreviewed and validated\nwith the client/ patient\n3.3 Interview was closed\npolitely, positively, and\nprospectively\n(reassurance)\n3.1 Non-Verbal\nCommunication\n3.2 Verbal\nCommunication\n3.3 Active listening\n3.4 Gatekeeping of\nInformation\n3.5 Privacy and\nconfidentiality\n3.6 Basic Computing\nand Numerical\nReasoning\n3.7 Basic Logic\n3.8 Inductive Reasoning\n3.9 Deductive\nReasoning\n3.10 Use of recording\ndevices, mobile/\ncellular phones,\ntablets, laptop, etc.\n3.11 Case Investigation\nForm\n3.12 WHO Case Report\nForm\n3.1 Communication\nSkills\n3.2 Critical thinking\nSkills\n3.3 Interpersonal Skills\n4. Evaluate the\noutputs of the\ninterview\n4.1 Aims and objectives for\nthe epidemiological\ninterview have been\nexamined if achieved\nand in accordance with\nestablished standards\nand procedures\n4.2 Epidemiological\ninvestigation is reviewed\nin the light of\ninformation obtained\nduring the interview and\nin accordance with\nestablished standards\nand procedures\n4.3 Interview techniques\ndeveloped by evaluating\nhow one performed and\nset goals for the future\n4.1 Non-verbal\nCommunication\n4.2 Verbal\nCommunication\n4.3 Active listening\n4.4 Gatekeeping of\nInformation\n4.5 Privacy and\nconfidentiality\n4.6 Basic Computing\nand Numerical\nReasoning\n4.7 How to evaluate\nepidemiological\ninterview\n4.8 Epidemiological\nInterview\n4.9 Deductive\nReasoning\n4.10 Use of\nappropriate\ncontact tracing\n4.1 Communication\nSkills\n4.2 Critical thinking\nSkills\n\n--- PDF PAGE 67 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n63\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\ngadgets such as\nrecording\ndevices, mobile/\ncellular phones,\ntablets, laptop,\netc.\n4.11 Case\nInvestigation\nForm\n4.12 WHO Case\nReport Form\n5. Identify close\ncontacts or\npersons\n5.1 Close contacts are\nidentified in accordance\nwith the Close Contact\nLine List Form\n5.2 List of close contacts\nare reviewed and\nverified with the patient\n5.3 List of all close contacts\nare reported to the\nrespective epidemiology\nunit or local authorities\n\n5.1 Verbal\nCommunication\n5.2 Non-Verbal\nCommunication\n5.3 Active Listening\n5.4 IATF Resolutions\nand DOH Issuances\n5.5 Use of PPE\n5.6 Use of Electronic\nGadgets\n5.1 Communication\nSkills\n5.2 Critical thinking\nSkills\n\n--- PDF PAGE 68 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n64\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Information\n\nMay include:\n1.1\nFull Name (Last, First, Middle)\n1.2\nDate of Birth (mm/dd/yyyy) and Age (n)\n1.3\nSex and Gender\n1.4\nOccupation\n1.5\nCivil Status\n1.6\nNationality\n1.7\nValid Government ID Num (e.g. UMID, SSS, GSIS,\nPagibig, Passport Number and PHIC No.)\n1.8\nPermanent Address\n1.9\nCurrent Address\n1.10 Workplace Address\n1.11 Results of the notifiable disease test, if available\n1.12 Travel History the past 14 days until patient was seen\nby contact tracing team\n1.13 History of exposure to a known confirmed case\n1.14 Name of Interviewer\n1.15 Name of the disease reporting unit\n2. Method\nMay include:\n2.1 Phone\n2.2 Face to Face\n2.3 Social Media\n3. Contact Tracer Members\nMay include:\n3.1 Health worker\n3.2 Medical Technologist\n3.3 Police (preferably from the Women and Children’s\nDesk)\n3.4 Barangay Health Emergency Response Team\n3.5 Disinfection Team\n3.6 Transportation Team\n4. Emotional State\nMay include:\n4.1 Fear\n4.2 Anxiety\n4.3 Anger\n4.4 Sadness\n5. Basic Necessities\nMay include:\n5.1 Financial\n5.2 Food\n5.3 Communication Gadgets\n6. Patient Living Status\nMay include:\n6.1 Urban Poor\n6.2 Low\n6.3 Middle\n6.4 High Class\n7. Opening statements\nMay include but not limited to:\n7.1 “My name is [First Name], what’s yours?\n7.2 “How are you feeling right now?”\n\n--- PDF PAGE 69 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n65\n\n7.3 “I can help you with this”\n7.4 “I am here to help”\n8. Probing statements\nMay include but not limited to:\n8.1 “Can you remember what you did for the past minutes/\nhours/ days…(chronological order)”\n8.2 “Can you tell me more about...”\n8.3 “Kindly explain to me...”\n8.4 “Please describe to me...”\n8.5 “Is it okay if you show me...”\n9. Interview Techniques\nMay include:\n9.1 Context Reinstatement\n9.2 Varied Retrieval\n9.3 Concentration\n9.4 Imaginary\n9.5 Control of Information\n9.6 Witness Compatible Questioning\n9.7 Free recall model\n10. Close contacts\nMay include:\n10.1 Face-to-face contact within 1 meter and for more than\n15 minutes\n10.2 Direct physical contact\n10.3 Direct care without using proper PPEs\n10.4 Other situations as indicated by local risk\nassessments\n10.5 Individuals who cared for, lived, worked, travelled and\ntransacted with a confirmed case of notifiable disease\n\n--- PDF PAGE 70 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n66\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Accomplished standard interview/documentation form\n1.2 Accomplished Close Contact Line List Form\n1.3 Donning and doffing of Personal Protective Equipment\n1.4 Planned and prepared for the conduct of case\ninvestigation\n1.5 Conducted interview with the patient\n1.6 Closed procedure/ interview\n1.7 Evaluated the outputs of the interview\n1.8 Identified close contacts\n2. Resource Implications\nThe following resources should be provided:\n2.1 Standard Forms for case investigation\n2.2 Personal Protective Equipment\n2.3 Transportation expenses\n2.4 Supplies needed for interviews such as ballpen,\npencils, etc.\n2.5 Cellphone load for data if using online platform\n2.6 Food and water\n2.7 Hand Sanitizer\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Role-playing\n3.2 Question and answer\n3.3 Examination\n3.4 Return demonstration on donning and doffing including\nhealth care waste management\n4. Context of Assessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 71 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n67\n\nUNIT OF COMPETENCY : CONDUCT PROFILING OF ALL CONTACTS AND\nINDEX CASES AND FOLLOW-UP\n\nUNIT CODE\n:"
