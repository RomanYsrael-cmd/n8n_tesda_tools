        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Communicated appropriately with clients\n1.2. Handled complaints and resolved conflict, or referred\nmatters to supervisors when required\n1.3. Complied with relevant policies, protocols, guidelines\nand procedures of the organization\n1.4. Established and maintained good interpersonal\nrelationship with clients\n1.5. Demonstrated courtesy in all interactions with clients,\ntheir visitors, and family\n2. Resource Implications The following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Relevant government and organizational policy,\nguidelines, procedures and protocols\n2.3. Any relevant legislation in relation to service delivery\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with questioning\n3.2. Interview\n3.3. Third party report\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 64 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n60\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : CONDUCT CASE INVESTIGATION AND CONTACT\nIDENTIFICATION\n\nUNIT CODE\n:"
        },
        "source_text": "HHC321204\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nin the maintenance of high standards of patient / client\nservices.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\nappropriately\nwith patients /\nclients\n1.1 Effective\ncommunication\nstrategies and\ntechniques are\nidentified and used to\nachieve best client\nservice outcomes\n1.2 Complaints are\nresponded to in\naccordance with\norganizational policy\nto ensure best service\nto clients\n1.3 Complaints are dealt\nwith in accordance\nwith established\nprocedures\n1.4 Interpreter services\nare accessed as\nrequired\n1.5 Action is taken to\nresolve conflicts either\ndirectly, where a\npositive outcome can\nbe immediately\nachieved, or by\nreferral to the\nappropriate personnel\n1.6 Participation in work\nteam is constructive\nand collaborative and\ndemonstrates an\nunderstanding of own\nrole\n1.1 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n1.2 Management of\nconflict\n1.3 Knowledge on\ncultural differences\nof client including\nrules and policies as\nnecessary\n1.4 Roles and\nresponsibilities of\nself and other\nworkers within the\norganization\n1.5 Knowledge on client\nissues that need to\nbe referred to an\nappropriate health\nprofessional\n1.6 Organizational /\ninstitutional policies\nand procedures for\nprivacy and\nconfidentiality of\ninformation provided\nby clients and\nothers\n1.7 Institutional policy\non patient / client\nrights and\nresponsibilities\n1.8 Knowledge on the\nuse mathematical\noperations such as\naddition,\nsubtraction, division,\nmultiplication\n1.1 Calculating the cost\nfor additional\npersonnel\nequipment (ex.\nInterpreter,\ngadgets)\n1.2 Identifying the\nmode on\ncommunication\nappropriate for the\nsituation\n1.3 Applying modes of\ncommunication\n1.4 Operating\nequipment of\ncommunication\nneeded\n1.5 Establishing and\nmaintaining\nrelationships,\ntaking into account\nindividual\ndifferences\n1.6 Following the\ninstructions and\nguidance of health\nprofessionals\ninvolved with the\ncare of client\n1.7 Respecting client\nrights\n1.8 Using effective\nlistening\ntechniques\n1.9 Using appropriate\nverbal and non-\nverbal\ncommunication\nstyles\n\n--- PDF PAGE 59 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n55\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.9 Concepts on modes\nof communication\n1.10 Knowledge on the\nuse of equipment\n1.11 Knowledge on\noperating of\nequipment needed\nfor communication\n(computer, cell\nphone, and other\nforms of media)\n\n1.10 Using oral and\nwritten\ncommunication\n1.11 Applying problem\nsolving skills that\nincludes using\navailable\nresources while\nprioritizing\nworkload\n1.12 Dealing with\nconflict\n1.13 Working with\nothers and\ndisplaying\nempathy with\nclient and\nrelatives\n1.14 Demonstrating\nintra and\ninterpersonal\nskills\n1.15 Reporting and\ndocumentation\nwith accuracy\n2. Establish and\nmaintain good\ninterpersonal\nrelationship\nwith clients\n2.1 Rapport is established\nto ensure the service\nis appropriate to and\nin the best interests of\nclients\n2.2 Effective listening\nskills are used to\nensure a high level of\neffective\ncommunication and\nquality of service\n2.3 Client concerns and\nneeds are correctly\nidentified and\nresponded to\nresponsibly and\naccordingly\nestablished\nprocedures and\nguidelines\n2.4 Effectiveness of\ninterpersonal\ninteraction is\nconsistently\nmonitored and\n2.1 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n2.2 Management of\nconflict\n2.3 Knowledge on\ncultural differences\nof client including\nrules and policies\nas necessary\n2.4 Organizational /\ninstitutional policies\nand procedures for\nprivacy and\nconfidentiality of\ninformati