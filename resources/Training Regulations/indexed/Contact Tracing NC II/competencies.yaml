                "text": "Comatose 6.7.1 Protect spine if necessary 6.7.2 Check C-A-B 6.7.2.1 Circulation 6.7.2.2 Airway 6.7.2.3 Breathing 7 Potentially life- threatening condition May include:"
              },
              {
                "number": "7.1",
                "text": "Types of unconscious victim 7.1.1 +B +P = Syncope 7.1.2 –B + P = Respiratory arrest 7.1.3 –B - P = Cardiac arrest * B-breathing: *P - pulse"
              },
