                "number": "7.2",
                "text": "TRIAGE (TRIAGE PRIORITY)"
              },
              {
                "number": "7.3",
                "text": "Casualty who has life threatening condition that involves C-A-B. Treat this victim first and transport as soon as possible 7.3.1 Airway and breathing difficulties 7.3.2 Choking 7.3.3 Uncontrolled and severe bleeding 7.3.4 Decreased level of consciousness 7.3.5 Shock (different types) 7.3.6 Severe burns (2nd and 3rd degree) with difficulty of breathing"
              },
              {
                "number": "7.4",
                "text": "Person/casualty who are injured but the condition is not life threatening. Treatment can be delayed temporarily 7.4.1 Burns without airway problem 7.4.2 major or multiple or joint injury --- PDF PAGE 54 --- Contact Tracing NC II - HHHCCT221 Promulgated (06/2021) 50 VARIABLE RANGE 7.4.3 Back injuries with or without spinal cord injury"
