        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Convey OSH work non-conformities to appropriate\npersonnel\n1.2. Identify OSH preventive and control requirements in\naccordance with OSH work policies and procedures\n1.3. Identify OSH work activity material, tools and\nequipment requirements in accordance with workplace\npolicies and procedures\n1.4. Arrange/Place required OSH materials, tools and\nequipment in accordance with OSH work standards\n1.5. Execute work activities in accordance with OSH work\nstandards\n1.6. Report OSH activity non-compliance work activities to\nappropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary for\nthe activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for Assessment 4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 33 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n29\n\nUNIT OF COMPETENCY : EXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE\nPRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:"
        },
        "source_text": "400311216\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to identify OSH compliance requirements, prepare\nOSH requirements for compliance, perform tasks in\naccordance with relevant OSH policies and procedures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations, policies\nand procedures are\nidentified in\naccordance with\nworkplace policies and\nprocedures\n1.2 OSH activity non-\nconformities are\nconveyed to\nappropriate\npersonnel\n1.3 OSH preventive and\ncontrol requirements\nare identified in\naccordance with OSH\nwork policies and\nprocedures\n1.1 OSH preventive and\ncontrol requirements\n1.2 Hierarchy of\nControls\n1.3 Hazard Prevention\nand Control\n1.4 General OSH\nprinciples\n1.5 Work standards and\nprocedures\n1.6 Safe handling\nprocedures of tools,\nequipment and\nmaterials\n1.7 Standard\nemergency plan and\nprocedures in the\nworkplace\n1.1 Applying\ncommunication\nskills\n1.2 Applying\ninterpersonal\nskills\n1.3 Applying critical\nthinking skills\n1.4 Applying\nobservation skills\n\n2. Prepare OSH\nrequirements\nfor compliance\n\n2.1 OSH work activity\nmaterial, tools and\nequipment\nrequirements are\nidentified in\naccordance with\nworkplace policies and\nprocedures\n2.2 Required OSH\nmaterials, tools and\nequipment are\nacquired in\naccordance with\nworkplace policies and\nprocedures\n2.3 Required OSH\nmaterials, tools and\nequipment are\narranged/ placed in\n2.1 Resources\nnecessary to\nexecute hierarchy of\ncontrols\n2.2 General OSH\nprinciples\n2.3 Work standards and\nprocedures\n2.4 Safe handling\nprocedures of tools,\nequipment and\nmaterials\n2.5 Different OSH\ncontrol measures\n\n2.1 Applying\nCommunication\nskills\n2.2 Applying\nestimation skills\n2.3 Applying\ninterpersonal\nskills\n2.4 Applying critical\nthinking skills\n2.5 Applying\nobservation skills\n2.6 Identifying\nmaterial, tool and\nequipment\n\n--- PDF PAGE 30 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n26\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\naccordance with OSH\nwork standards\n3. Perform tasks\nin accordance\nwith relevant\nOSH policies\nand\nprocedures\n\n3.1 Relevant OSH work\nprocedures are\nidentified in\naccordance with\nworkplace policies and\nprocedures\n3.2 Work Activities are\nexecuted in\naccordance with OSH\nwork standards\n3.3 Non-compliance\nwork activities are\nreported to\nappropriate\npersonnel\n\n3.1 OSH work\nstandards\n3.2 Industry related\nwork activities\n3.3 General OSH\nprinciples\n3.4 OSH Violations\n3.5 Non-compliance\nwork activities\n\n3.1 Applying\ncommunication\nskills\n3.2 Applying\ninterpersonal\nskills\n3.3 Applying\ntroubleshooting\nskills\n3.4 Applying critical\nthinking skills\n3.5 Applying\nobservation skills\n\n--- PDF PAGE 31 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n27\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies and\nProcedures\nMay include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPermit to Operate\n1.6\nPhilippine Occupational Safety and Health\nStandards\n1.7\nDepartment Order No. 13 (Construction Safety\nand Health)\n1.8\nECC regulations\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n3. OSH Preventive and\nControl Requirements\nMay include:\n3.1 Resources needed for removing hazard effectively\n3.2 Resources needed for substitution or replacement\n3.3 Resources needed to establishing engineering\ncontrols\n3.4 Resources needed for enforcing administrative\ncontrols\n3.5 Personal Protective equipment\n4. Non OSH-Compliance\nWork Activities\nMay include non-compliance or observance of the\nfollowing safety measures:\n4.1 Violations that may lead to serious physical harm\nor death\n4.2 Fall Protection\n4.3 Hazard Communication\n4.4 Respiratory Protection\n4.5 Power Industrial Trucks\n4.6 Lockout/Tag-out\n4.7 Working at heights (use of ladder, scaffolding)\n4.8 Electrical Wiring Methods\n4.9 Machine Guarding\n4.10 Electrical General Requirements\n4.11 Asbestos work requirements\n4.12 Excavations work requirements\n\n--- PDF PAGE 32 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n28\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Convey OSH work non-conformities to appropriate\npersonnel\n1.2. Identify OSH preventive and control requirements in\naccordance with OSH work policies and procedures\n1.3. Identify OSH work activity material, tools and\nequipment requirements in accordance with workplace\npolicies and procedures\n1.4. Arrange/Place required OSH materials, tools and\nequipment in accordance with OSH work standards\n1.5. Execute work activities in accordance with OSH work\nstandards\n1.6. Report OSH activity non-compliance work activities to\nappropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary for\nthe activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for Assessment 4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 33 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n29\n\nUNIT OF COMPETENCY : EXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE\nPRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:"
