        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Used Personal Protective Equipment (PPE)\n1.2 Observed safety and IPC protocols in and out of the\nvehicle\n1.3 Established rapport and secured informed consent\nfrom patient and family\n1.4 Performed proper coordination with all parties\ninvolved in the transfer/transport\n1.5 Monitored and documented patient status while on\ntransport\n1.6 Cleaned and disinfected the vehicle and equipment\nused in the transport of patient\n1.7 Properly disposed all materials used\n1.8 Properly filled out all necessary forms\n1.9 Generated proper reporting and documentation of the\nreferral/transport activity\n2. Resource Implications\nThe following resources should be provided:\n2.1 Personal Protective Equipment (PPE)\n2.2 Face masks for patients\n2.3 Communication devices\n2.4 Transport vehicles\n2.5 Referral forms\n2.6 Cleaning and disinfection materials\n2.7 Devices for vital signs monitoring\n3. Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1 Interview with candidate\n3.2 Interviews with patients and families (simulation)\n3.3 Interviews with drivers and health workers\n(simulation)\n3.4 Actual Demonstration\n4. Context of Assessment\n 4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 79 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n75\n\nUNIT OF COMPETENCY : CONDUCT HEALTH EDUCATION PROGRAMS\n\nUNIT CODE\n:"
        },
        "source_text": "HHC532336\n\nUNIT DESCRIPTOR\n: Involves safe transport between and within health facilities,\nand coordination with the community and primary care\nfacilities for all notifiable diseases patients needing referral.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1. Observe\nproper\ninfection\nprevention\ncontrol\n(IPC)\nprotocols\n\n1.1 Personal Protective\nEquipment PPE (gown,\nmask, eye protection,\ngloves) donned and\ndoffed in accordance\nwith established\nstandards and\nprocedures\n1.2 Proper hand hygiene is\nperformed in accordance\nwith established\nstandards and\nprocedures\n1.3 Patient is assisted to\nminimize contact with\nthe vehicle and to avoid\nother unnecessary\nphysical contact\n1.4 Vehicle is kept well-\nventilated during\ntransport (eg. opening\nwindows to reduce risk\nof transmission)\n1.5 Driver is advised on\nproper cleaning and\ndisinfection of vehicle\nand other tools and\nequipment with patient\ncontact in accordance\nwith established\nstandards and\nprocedures\n1.1 Effective verbal and\nnon-verbal\ncommunication\n1.2 Risk communication\n1.3 Guidelines on proper\ncleaning and\nsanitation of vehicles\nand equipment\n1.4 Proper ventilation of\nthe vehicle\n1.5 Safe distance to\navoid transmission\n1.6 Characteristics of\nnotifiable diseases\nand mode of\ntransmission\n1.7 Infection prevention\nand control protocols\n1.8 Guidelines on the\nproper use of PPE\nand other protective\ndevices\n1.1 Giving clear and\nproper instructions\nto patient and driver\n1.2 Proper Donning and\ndoffing of PPE\n1.3 Preventing\ntransmission of the\nvirus within and\noutside the vehicle\n1.4 Cleaning and\ndisinfection of the\nvehicle\n1.5 Cleaning and\ndisinfection of all\ntools and\nequipment used in\nthe transfer (eg.\nstretcher,\nwheelchair, etc.)\n1.6 Proper\ndisposal/cleaning of\ncontaminated\nmaterials\n2. Coordinate\nwith drivers\nand health\nworkers on\n2.1 Available resources in\nthe community are\nidentified in accordance\nwith established\n2.1 Risk Communication\n2.2 Negotiation\n2.3 Mapping and location\nof all available\n2.1 Coordination with\nhospitals, health\nfacilities,\nquarantine\n\n--- PDF PAGE 75 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n71\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\nthe transport\nof patient for\nreferral\n\nstandards and\nprocedures e.g.\nvehicles, health\nworkers, hospitals and\nhealth facilities,\nmakeshift areas, testing\nlabs & kits, etc.\n2.2 Needed vehicles to\npick-up and transport\nthe patient is\ndispatched/contacted in\naccordance with\nestablished standards\nand procedures\n2.3 Receiving facility is\nnotified of: estimated\ntime of arrival, patient\ncondition and potential\ninfectious risks\n2.4 Relevant stakeholders/\ncorrespondence in the\ncommunity are being\ncoordinated as\nnecessary\nhospitals and\nfacilities\n2.4 Estimated time of\ntravel from one\nlocation/facility to\nanother\n2.5 Pathophysiology of\nnotifiable diseases\n2.6 Incubation period\n2.7 Disease progression\n2.8 Use of applicable\nand fastest means of\ncommunication\nfacilities, testing\nlaboratories and\nother relevant\noffices in the\ncommunity\n2.2 Coordination with\nthe driver of\ntransport vehicles\n2.3 Communicating\naccurate\ndetail/information\nregarding the\nstatus of the patient\nbeing transported\n3. Observe\nproper\nreferral and\ntransfer\nprotocol\n3.1 Informed consent is\nsecured from the\npatient and/or family\nmembers\n3.2 Family members are\ninformed that they will\nnot be taken alongside\nthe patient and advises\nthem to undergo\nquarantine and\nmonitoring of symptoms\n3.3 Patient referral forms\nare accurately filled-out\nin accordance with\nestablished standards\nand procedures\n3.4 Designated route is\nrecognized and used in\naccordance with\nestablished standards\nand procedures\n3.5 Health of all staff\ninvolved in the transfer\nand transport is\ndocumented in\naccordance with\n3.1 Patient’s rights\nconfidentiality and\ndata privacy\n3.2 Principles of\ncounselling and\nreassuring\ncommunication\n3.3 Designated transport\nroute for ambulance/\nemergency vehicles\n3.4 Mode of transmission\nof notifiable diseases\n3.5 Incubation period\n3.6 Proper referral and\nreporting forms\n3.7 Proper use of\ninformation systems\nfor referral and\nreporting\n\n3.1 Maintaining patient\nconfidentiality and\ndata privacy\n3.2 Providing\nreassurance to\npatient and family\n3.3 Use of appropriate\nreferral and\nreporting forms\n3.4 Use of information\nsystems for referral\nand reporting\n3.5 Accurate reporting\nand documentation\nof health status of\nboth patient and\nhealth staff\n\n--- PDF PAGE 76 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n72\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\nestablished standards\nand procedures\n4. Monitor\npatient’s\ncondition\nduring\ntransport\n4.1 Accurate and timely\ninformation is provided\nto patient and their\nfamily in accordance\nwith established\nstandards and\nprocedures\n4.2 Patient’s symptoms are\nmonitored while on\ntransport in accordance\nwith established\nstandards and\nprocedures\n4.3 Primary care\nmanagement and\nappropriate interaction\nis provided, as\nnecessary\n4.4 A log of referral/transfer\nis kept in accordance\nwith established\nstandards and\nprocedures\n4.5 Family members are\nadvised on quarantine\nand monitoring of\nsymptoms in accordance\nwith established\nstandards and\nprocedures\n\n4.1 Principles of\ncounselling\n4.2 Location and\ndistance of health\nfacilities and\nquarantine facilities\nin the community\n4.3 Disease progression\n4.4 Range of disease\nseverity and\ncomplications\n4.5 Risk factors for\ncontracting the\ndisease\n4.6 Vulnerable\npopulations\n4.7 Use necessary\nmedical tools (eg.\nthermal scanner, BP\napparatus, etc.\n4.1 Counselling and\ngiving advice to\npatient and family\n4.2 Monitoring and\nreporting of\npatient’s status\nwhile on transport\n4.3 Performing\nnecessary\ninitial/primary care\nmanagement while\non transport\n4.4 Documentation of\nthe referral/\ntransport activity\n\n--- PDF PAGE 77 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n73\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Resources\nMay include:\n1.1 Available ambulance or transport vehicles\n1.2 Available hospitals and health facilities\n1.3 Available quarantine facilities or makeshift areas\n1.4 Available testing laboratories and testing kits\n1.5 Available health workers\n2. Correspondence\nMay include:\n2.1 Drivers of transport vehicle\n2.2 Triage officers in facilities\n2.3 Facility managers\n2.4 Local officials\n2.5 municipal/city/provincial social worker\n2.6 municipal/city/provincial health officer\n2.7 staff in designated Philhealth office\n3. Interactions\nMay include:\n3.1 testing\n3.2 quarantine\n3.3 referral\n3.4 hospitalization\n3.5 health emergency\n3.6 financial assistance\n3.7 psychosocial assistance\n4. Forms\nMay include:\n4.1 referral forms\n4.2 patient information\n4.3 profile of patient’s family/close contacts\n4.4 patient transport forms\n4.5 patient health status\n4.6 status of accompanying health workers and team\n\n--- PDF PAGE 78 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n74\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Used Personal Protective Equipment (PPE)\n1.2 Observed safety and IPC protocols in and out of the\nvehicle\n1.3 Established rapport and secured informed consent\nfrom patient and family\n1.4 Performed proper coordination with all parties\ninvolved in the transfer/transport\n1.5 Monitored and documented patient status while on\ntransport\n1.6 Cleaned and disinfected the vehicle and equipment\nused in the transport of patient\n1.7 Properly disposed all materials used\n1.8 Properly filled out all necessary forms\n1.9 Generated proper reporting and documentation of the\nreferral/transport activity\n2. Resource Implications\nThe following resources should be provided:\n2.1 Personal Protective Equipment (PPE)\n2.2 Face masks for patients\n2.3 Communication devices\n2.4 Transport vehicles\n2.5 Referral forms\n2.6 Cleaning and disinfection materials\n2.7 Devices for vital signs monitoring\n3. Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1 Interview with candidate\n3.2 Interviews with patients and families (simulation)\n3.3 Interviews with drivers and health workers\n(simulation)\n3.4 Actual Demonstration\n4. Context of Assessment\n 4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 79 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n75\n\nUNIT OF COMPETENCY : CONDUCT HEALTH EDUCATION PROGRAMS\n\nUNIT CODE\n:"
