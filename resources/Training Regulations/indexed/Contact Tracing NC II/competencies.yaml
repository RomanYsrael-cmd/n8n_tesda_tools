amphlets\n9.3 Flyers\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Established rapport with the patient\n1.2 Maintained confidentiality and privacy\n1.3 Complied with established policies and procedures\n1.4 Communicated effectively with patients and significant\nothers and team members\n1.5 Responded effectively to patients learning needs\n1.6 Provided appropriate health education to patient\n1.7 Made use of appropriate educational materials to\ntransfer information effectively\n1.8 Assessed patients learning\n2. Resource Implications\nThe following resources should be provided:\n2.1 Case Investigation Forms\n2.2 Relevant Policies and Procedures Manuals\n2.3 Notebook\n2.4 Writing Material\n2.5 Telephone/ Cost of communication\n2.6 Computer and Internet Connection (as necessary)\n2.7 Transportation/Transportation Allowance\n3. Methods of Assessment Competency in this unit must be assessed through:\n3.1 Third Party Report\n3.2 Simulation\n3.3 Interview\n3.4 Written Test\n4. Context of Assessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 84 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n80\n\nUNIT OF COMPETENCY : PERFORM DATA RECORDING AND REPORTING\n\nUNIT CODE\n: HHC532338\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude required\nin contact tracing to record and report relevant information.\nThe unit involves the documentation of information on the\nactivities involving the patient.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1. Demonstrate\ncomputer\nliteracy and\ndata/records\nmanagement\n\n1.1 Basic Microsoft Office\napplications are\nnavigated/operated in\naccordance with\nestablished standards\nand procedures\n1.2 E-mail system is used in\naccordance with\nestablished standards\n