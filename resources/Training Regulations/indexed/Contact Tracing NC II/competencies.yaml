h\nestablished standards\nand procedures\n2.6 Open statements are\nused to start the\ninterview proper in\naccordance with\nestablished standards\nand procedures.\n(Reiteration of Opening\nSpiel/ Statement)\n2.7 Appropriate probing\nquestions are used to\nelicit more information\nfrom the patient and\nhis/her family as\nappropriate\n2.8 Active listening is\ndemonstrated at all\ntimes\n2.1 Non-verbal\nCommunication\n2.2 Verbal\nCommunication\n2.3 Active Listening\n2.4 Gatekeeping of\nInformation\n2.5 Privacy and\nConfidentiality\n2.6 Basic Computing\nand Numerical\nReasoning\n2.7 Basic Logic\n2.8 Inductive Reasoning\n2.9 Deductive\nReasoning\n2.10 Use of recording\ndevices, mobile/\ncellular phones,\ntablets, laptop, etc.\n2.11 Case Investigation\nForm\n2.12 WHO Case Report\nForm\n2.1 Psychosocial Skills\n2.2 Probing Skills\n2.3 Communication\nSkills\n2.4 Information\nGathering\n2.5 Report writing/\nminutes of the\ninterview\n2.6 Research Skills\n2.7 Ability to relate\nwith and\ncommunicate\ninformation to\npeople with\ndifferent social,\ncultural and ethnic\nbackgrounds\n2.8 Interview\nTechniques\n\n--- PDF PAGE 66 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n62\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n2.9 Case Investigation\nforms and other forms\nprescribed are filled out\nappropriately\n3. Close\nprocedure/\ninterview\n3.1 All questions and\ninformation gathered\nare verified and\nconsolidated in\naccordance with\nestablished standards\n3.2 Information gathered is\nreviewed and validated\nwith the client/ patient\n3.3 Interview was closed\npolitely, positively, and\nprospectively\n(reassurance)\n3.1 Non-Verbal\nCommunication\n3.2 Verbal\nCommunication\n3.3 Active listening\n3.4 Gatekeeping of\nInformation\n3.5 Privacy and\nconfidentiality\n3.6 Basic Computing\nand Numerical\nReasoning\n3.7 Basic Logic\n3.8 Inductive Reasoning\n3.9 Deductive\nReasoning\n3.10 Use of recording\ndevices, mobile/\ncellular phones,\ntablets, laptop, etc.\n3.11 Case Investigation\nForm\n3.12 WHO Case Report\nForm\n3.1 Communication\nSkills\n3.2 Critical thinking\nSkills\n3.3 Interpersonal Skills\n4. Evaluate the\noutputs of the\ninterview\n4.1 Aims and objectives for\nthe epidemiological\ninterview have been\nexamined if achieved\nand in accordance with\nestablished standards\nand procedures\n4.2 Epidemiological\ninvestigation is reviewed\nin the light of\ninformation obtained\nduring the interview and\nin accordance with\nestablished standards\nand procedures\n4.3 Interview techniques\ndeveloped by evaluating\nhow one performed and\nset goals for the future\n4.1 Non-verbal\nCommunication\n4.2 Verbal\nCommunication\n4.3 Active listening\n4.4 Gatekeeping of\nInformation\n4.5 Privacy and\nconfidentiality\n4.6 Basic Computing\nand Numerical\nReasoning\n4.7 How to evaluate\nepidemiological\ninterview\n4.8 Epidemiological\nInterview\n4.9 Deductive\nReasoning\n4.10 Use of\nappropriate\ncontact tracing\n4.1 Communication\nSkills\n4.2 Critical thinking\nSkills\n\n--- PDF PAGE 67 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n63\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\ngadgets such as\nrecording\ndevices, mobile/\ncellular phones,\ntablets, laptop,\netc.\n4.11 Case\nInvestigation\nForm\n4.12 WHO Case\nReport Form\n5. Identify close\ncontacts or\npersons\n5.1 Close contacts are\nidentified in accordance\nwith the Close Contact\nLine List Form\n5.2 List of close contacts\nare reviewed and\nverified with the patient\n5.3 List of all close contacts\nare reported to the\nrespective epidemiology\nunit or local authorities\n\n5.1 Verbal\nCommunication\n5.2 Non-Verbal\nCommunication\n5.3 Active Listening\n5.4 IATF Resolutions\nand DOH Issuances\n5.5 Use of PPE\n5.6 Use of Electronic\nGadgets\n5.1 Communication\nSkills\n5.2 Critical thinking\nSkills\n\n--- PDF PAGE 68 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n64\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Information\n\nMay include:\n1.1\nFull Name (Last, First, Middle)\n1.2\nDate of Birth (mm/dd/yyyy) and Age (n)\n1.3\nSex and Gender\n1.4\nOccupation\n1.5\nCivil Status\n1.6\nNationality\n1.7\nValid Government ID Num (e.g. UMID, SSS, GSIS,\nPagibig, Passport Number and PHIC No.)\n1.8\nPermanent Address\n1.9\nCurrent Address\n1.10 Workplace Address\n1.11 Results of the notifiable disease test, if available\n1.12 Travel History the past 14 days until patient was seen\nby contact tracing team\n1.13 History of exposure to a known confirmed case\n1.14 Name of Interviewer\n1.15 Name of the disease reporting unit\n2. Method\nMay include:\n2.1 Phone\n2.2 Face to Face\n2.3 Social Media\n3. Contact Tracer Members\nMay include:\n3.1 Health worker\n3.2 Medical Technologist\n3.3 Police (preferably from the Women and Children’s\nDesk)\n3.4 Barangay Health Emergency Response Team\n3.5 Disinfection Team\n3.6 Transportation Team\n4. Emotional State\nMay include:\n4.1 Fear\n4.2 Anxiety\n4.3 Anger\n4.4 Sadness\n5. Basic Necessities\nMay include:\n5.1 Financial\n5.2 Food\n5.3 Communication Gadgets\n6. Patient Living Status\nMay include:\n6.1 Urban Poor\n6.2 Low\n6.3 Middle\n6.4 High Class\n7. Opening statements\nMay include but not limited to:\n7.1 “My name is [First Name], what’s yours?\n7.2 “How are you feeling right now?”\n\n--- PDF PAGE 69 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n65\n\n7.3 “I can help you with this”\n7.4 “I am here to help”\n8. Probing statements\nMay include but not limited to:\n8.1 “Can you remember what you did for the past minutes/\nhours/ days…(chronological order)”\n8.2 “Can you tell me more about...”\n8.3 “Kindly explain to me...”\n8.4 “Please describe to me...”\n8.5 “Is it okay if you show me...”\n9. Interview Techniques\nMay include:\n9.1 Context Reinstatement\n9.2 Varied Retrieval\n9.3 Concentration\n9.4 Imaginary\n9.5 Control of Information\n9.6 Witness Compatible Questioning\n9.7 Free recall model\n10. Close contacts\nMay include:\n10.1 Face-to-face contact within 1 meter and for more than\n15 minutes\n10.2 Direct physical contact\n10.3 Direct care without using proper PPEs\n10.4 Other situations as indicated by local risk\nassessments\n10.5 Individuals who cared for, lived, worked, travelled and\ntransacted with a confirmed case of notifiable disease\n\n--- PDF PAGE 70 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n66\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Accomplished standard interview/documentation form\n1.2 Accomplished Close Contact Line List Form\n1.3 Donning and doffing of Personal Protective Equipment\n1.4 Planned and prepared for the conduct of case\ninvestigation\n1.5 Conducted interview with the patient\n1.6 Closed procedure/ interview\n1.7 Evaluated the outputs of the interview\n1.8 Identified close contacts\n2. Resource Implications\nThe following resources should be provided:\n2.1 Standard Forms for case investigation\n2.2 Personal Protective Equipment\n2.3 Transportation expenses\n2.4 Supplies needed for interviews such as ballpen,\npencils, etc.\n2.5 Cellphone load for data if using online platform\n2.6 Food and water\n2.7 Hand Sanitizer\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Role-playing\n3.2 Question and answer\n3.3 Examination\n3.4 Return demonstration on donning and doffing including\nhealth care waste management\n4. Context of Assessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 71 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n67\n\nUNIT OF COMPETENCY : CONDUCT PROFILING OF ALL CONTACTS AND\nINDEX CASES AND FOLLOW-UP\n\nUNIT CODE\n: HHC532335\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge skills and attitudes required\nto conduct profiling of all contacts and index cases and\nfollow-up.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1. Profile all\ncontacts\nand index\ncases\n\n1.1 Collected data are\nvetted and harmonized\nin accordance with\nestablished standards\nand procedures (Vetting\nand harmonization of\ncollected data)\n1.2 Collected data are\ncompleted and validated\nvia phone calls, face-to-\nface interviews and\nother appropriate\ncommunication\nplatforms\n1.3 Identified all contacts\nand index cases are\nlocated in accordance\nwith established\nstandards and\nprocedures\n1.4 Identified all contacts\nand index cases are\nassessed if symptomatic\nor asymptomatic in\naccordance with\nestablished standards\nand procedures\n1.5 Close contacts who are\nsymptomatic or\nasymptomatic are\nclassified based on\nstandard protocols\n1.1 Verbal\nCommunication\n1.2 Non-Verbal\nCommunication\n1.3 Active Listening\n1.4 Basic Arithmetic\n1.5 IATF Resolutions/\nRelated Issuances\n1.6 Close Contact Line\nList Form\n1.7 Contact Tracing\nSigns and Symptoms\nLog Form\n1.8 Health Workers Risk\nAssessment Form\n1.1 Spatial Skills\n1.2 Decision Making\nSkills\n1.3 Data Analytics\n1.4 Data Visualization\n1.5 Data Storytelling\n1.6 Communication\nSkills\n\n2. Conduct\nfollow-up with\nall contacts\nand index\ncases\n2.1 Continuous information\nis elicited in accordance\nwith established\nstandards and\nprocedures\n2.2 Follow through\nsubstantial information\n2.1 Verbal\nCommunication\n2.2 Non-Verbal\nCommunication\n2.3 Basic Arithmetic\n2.4 Information\nGathering\n2.1 Spatial Skills\n2.2 Decision Making\nSkills\n2.3 Data Analytics\n2.4 Data Visualization\n2.5 Data Storytelling\n\n--- PDF PAGE 72 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n68\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\nof all contacts and index\ncases to\nsecure/complete\ninformation as needed\n2.3 Information is gathered\nin residential and non-\nresidential areas in\naccordance with\nestablished standards\nand procedures\n2.4 Coordinate updated\ninformation gathered\nwith the BHERT, CESU\n\n2.6 Communication\nSkills\n\n--- PDF PAGE 73 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n69\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. All Contacts\nMay include:\n1.1\nClose Contacts\n1.1.1 Close contacts with symptoms\n 1.1.1.1 FIT Suspect COVID-19 Case Definition\n 1.1.1.2 DON NOT FIT Covid-19 Case Definition\n1.1 2 Close contacts without symptoms\n 1.1.2.1 Non-health worker\n 1.1.2.2 Non-health worker with low risk\nexposure\n 1.1.2.3 Health worker with high risk exposure\n 1.1.2.4 Contacts in a congregate setting (jail,\norphanage, silungan centers)\n1.2 General Contacts/ Proximate contacts\n 1.2.1 Classroom\n 1.2.2 Office\n 1.2.3 Gathering\n 1.2.4 Crowded places (grocery store, establishments)\n1.3 Contact of a Contact\n 1.3.1 F1 Close contact of Confirmed case\n 1.3.2 F2 Close contact of F1\n 1.3.3 F3 Close contact of F2\n 1.3.4 F4 Close contact of F3\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Profiled all contacts and index cases\n1.2 Conducted follow-up with all contacts and index cases\n1.3 Accomplished Standard Forms\n2. Resource Implications\nThe following resources should be provided:\n2.1 Standard Forms used in contact profiling and follow-up\n2.2 Personal Protective Equipment\n2.3 Transportation expenses\n2.4 Supplies needed for profiling and follow-up such as\nballpen, pencils, etc.\n2.5 Cellphone load for data if using online platform\n2.6 Food and water\n2.7 Hand Sanitizer\n3. Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1 Role-playing\n3.2 Question and answer\n3.3 Examination\n\n--- PDF PAGE 74 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n70\n\n4. Context of Assessment\n4.1 Competency may be assessed in the actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\nUNIT OF COMPETENCY : CONDUCT REFERRAL TO HEALTH FACILITY,\nQUARANTINE FACILITY OR OTHER RELEVANT\nAGENCIES\n\nUNIT CODE\n: HHC532336\n\nUNIT DESCRIPTOR\n: Involves safe transport between and within health facilities,\nand coordination with the community and primary care\nfacilities for all notifiable diseases patients needing referral.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1. Observe\nproper\ninfection\nprevention\ncontrol\n(IPC)\nprotocols\n\n1.1 Personal Protective\nEquipment PPE (gown,\nmask, eye protection,\ngloves) donned and\ndoffed in accordance\nwith established\nstandards and\nprocedures\n1.2 Proper hand hygiene is\nperformed in accordance\nwith established\nstandards and\nprocedures\n1.3 Patient is assisted to\nminimize contact with\nthe vehicle and to avoid\nother unnecessary\nphysical contact\n1.4 Vehicle is kept well-\nventilated during\ntransport (eg. opening\nwindows to reduce risk\nof transmission)\n1.5 Driver is advised on\nproper cleaning and\ndisinfection of vehicle\nand other tools and\nequipment with patient\ncontact in accordance\nwith established\nstandards and\nprocedures\n1.1 Effective verbal and\nnon-verbal\ncommunication\n1.2 Risk communication\n1.3 Guidelines on proper\ncleaning and\nsanitation of vehicles\nand equipment\n1.4 Proper ventilation of\nthe vehicle\n1.5 Safe distance to\navoid transmission\n1.6 Characteristics of\nnotifiable diseases\nand mode of\ntransmission\n1.7 Infection prevention\nand control protocols\n1.8 Guidelines on the\nproper use of PPE\nand other protective\ndevices\n1.1 Giving clear and\nproper instructions\nto patient and driver\n1.2 Proper Donning and\ndoffing of PPE\n1.3 Preventing\ntransmission of the\nvirus within and\noutside the vehicle\n1.4 Cleaning and\ndisinfection of the\nvehicle\n1.5 Cleaning and\ndisinfection of all\ntools and\nequipment used in\nthe transfer (eg.\nstretcher,\nwheelchair, etc.)\n1.6 Proper\ndisposal/cleaning of\ncontaminated\nmaterials\n2. Coordinate\nwith drivers\nand health\nworkers on\n2.1 Available resources in\nthe community are\nidentified in accordance\nwith established\n2.1 Risk Communication\n2.2 Negotiation\n2.3 Mapping and location\nof all available\n2.1 Coordination with\nhospitals, health\nfacilities,\nquarantine\n\n--- PDF PAGE 75 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n71\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\nthe transport\nof patient for\nreferral\n\nstandards and\nprocedures e.g.\nvehicles, health\nworkers, hospitals and\nhealth facilities,\nmakeshift areas, testing\nlabs & kits, etc.\n2.2 Needed vehicles to\npick-up and transport\nthe patient is\ndispatched/contacted in\naccordance with\nestablished standards\nand procedures\n2.3 Receiving facility is\nnotified of: estimated\ntime of arrival, patient\ncondition and potential\ninfectious risks\n2.4 Relevant stakeholders/\ncorrespondence in the\ncommunity are being\ncoordinated as\nnecessary\nhospitals and\nfacilities\n2.4 Estimated time of\ntravel from one\nlocation/facility to\nanother\n2.5 Pathophysiology of\nnotifiable diseases\n2.6 Incubation period\n2.7 Disease progression\n2.8 Use of applicable\nand fastest means of\ncommunication\nfacilities, testing\nlaboratories and\nother relevant\noffices in the\ncommunity\n2.2 Coordination with\nthe driver of\ntransport vehicles\n2.3 Communicating\naccurate\ndetail/information\nregarding the\nstatus of the patient\nbeing transported\n3. Observe\nproper\nreferral and\ntransfer\nprotocol\n3.1 Informed consent is\nsecured from the\npatient and/or family\nmembers\n3.2 Family members are\ninformed that they will\nnot be taken alongside\nthe patient and advises\nthem to undergo\nquarantine and\nmonitoring of symptoms\n3.3 Patient referral forms\nare accurately filled-out\nin accordance with\nestablished standards\nand procedures\n3.4 Designated route is\nrecognized and used in\naccordance with\nestablished standards\nand procedures\n3.5 Health of all staff\ninvolved in the transfer\nand transport is\ndocumented in\naccordance with\n3.1 Patient’s rights\nconfidentiality and\ndata privacy\n3.2 Principles of\ncounselling and\nreassuring\ncommunication\n3.3 Designated transport\nroute for ambulance/\nemergency vehicles\n3.4 Mode of transmission\nof notifiable diseases\n3.5 Incubation period\n3.6 Proper referral and\nreporting forms\n3.7 Proper use of\ninformation systems\nfor referral and\nreporting\n\n3.1 Maintaining patient\nconfidentiality and\ndata privacy\n3.2 Providing\nreassurance to\npatient and family\n3.3 Use of appropriate\nreferral and\nreporting forms\n3.4 Use of information\nsystems for referral\nand reporting\n3.5 Accurate reporting\nand documentation\nof health status of\nboth patient and\nhealth staff\n\n--- PDF PAGE 76 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n72\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\nestablished standards\nand procedures\n4. Monitor\npatient’s\ncondition\nduring\ntransport\n4.1 Accurate and timely\ninformation is provided\nto patient and their\nfamily in accordance\nwith established\nstandards and\nprocedures\n4.2 Patient’s symptoms are\nmonitored while on\ntransport in accordance\nwith established\nstandards and\nprocedures\n4.3 Primary care\nmanagement and\nappropriate interaction\nis provided, as\nnecessary\n4.4 A log of referral/transfer\nis kept in accordance\nwith established\nstandards and\nprocedures\n4.5 Family members are\nadvised on quarantine\nand monitoring of\nsymptoms in accordance\nwith established\nstandards and\nprocedures\n\n4.1 Principles of\ncounselling\n4.2 Location and