itudes in\nmanaging one’s emotions, developing reflective practice,\nand\nboosting\nself-confidence\nand\ndeveloping\nself-\nregulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage\none’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the face\nof setbacks and\nfrustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions and\nunpleasant situation\nin the workplace are\nexamined\n\n1.1 Self-management\nstrategies that assist\nin regulating\nbehavior and\nachieving personal\nand learning goals\n(e.g. Nine self-\nmanagement\nstrategies according\nto Robert Kelley)\n1.2 Enablers and\nbarriers in achieving\npersonal and career\ngoals\n1.3 Techniques in\nhandling negative\nemotions and\nunpleasant situation\nin the workplace\nsuch as frustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing properly\none’s emotions and\nrecognizing\nsituations that\ncannot be changed\nand accept them\nand remain\nprofessional\n1.2 Developing self-\ndiscipline, working\nindependently and\nshowing initiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setback and\nfrustrations and\nother negative\nemotions and\nunpleasant\nsituations in the\nworkplace\n2. Develop\nreflective\npractice\n2.1 Personal strengths and\nachievements, based\non self-assessment\nstrategies and teacher\nfeedback are\ncontemplated\n2.2 Progress when seeking\nand responding to\nfeedback from\nteachers to assist them\nin consolidating\nstrengths, addressing\nweaknesses and\nfulfilling their potential\nare monitored\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\nConclusion, and\nAction plan)\n2.1 Using the 