  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required in\nCONTACT TRACING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n: 400311210\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n\n1.1 Effective verbal and\nnonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n1.8 Workplace etiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Applying basic\nbusiness writing\nskills\n\n--- PDF PAGE 7 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n3\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.9 Applying\ninterpersonal skills\nin the workplace\n1.10 Performing\nactive-listening\nskills\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are read\nand interpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction is followed\nbased on established\nprocedures\n2.3 Feedback is given to\nworkplace supervisor-\nbased instructions/\ninformation received\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters concerning\nconditions of\nemployment are\nsought and asked from\nappropriate sources\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n2.1 Effective verbal and\nnon-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nworkplace policies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n2.8 Effective questioning\ntechniques (clarifying\nand probing)\n2.9 Workplace etiquette\n\n2.1 Following simple\nspoken\ninstructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace\nmeetings and\ndiscussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Applying basic\nquestioning/\nquerying\n2.9 Applying skills in\nreading for\ninformation\n2.10 Applying skills in\nlocating\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\n3.1 Effective verbal and\nnon-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.1 Completing work-\nrelated documents\n3.2 Applying\noperations of\naddition,\nsubtraction,\n\n--- PDF PAGE 8 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n4\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nworkplace forms and\ndocuments\n3.3 Errors in recording\ninformation on forms/\ndocuments are\nidentified and acted\nupon\n3.4 Reporting requirements\nto supervisor are\ncompleted according to\norganizational\nguidelines\n\n3.4 Organizational/\nWorkplace policies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n\ndivision and\nmultiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Applying Effective\nrecord keeping\nskills\n\n--- PDF PAGE 9 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n5\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1.\nTeam members\n1.2.\nSupervisor/Department Head\n1.3.\nSuppliers\n1.4.\nTrade personnel\n1.5.\nLocal government\n1.6.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation dissemination\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace-to-face communication\n2.7.\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace interactions\nMay include:\n4.1.\nFace-to-face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic means, memos,\ninstruction and forms\n4.5.\nNon-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 10 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n6\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard\nformat of the organization\n1.2 Accessed information using workplace communication\nequipment/systems\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting formal or\ninformal communication\n2. Resource Implications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Notebook\n2.4 Writing materials\n2.5 Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Written test\n3.4 Third-party report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n7\n\nUNIT OF COMPETENCY\n: WORK IN A TEAM ENVIRONMENT\n\nUNIT CODE\n: 400311211\n\nUNIT DESCRIPTOR\n: This unit covers the skills, knowledge and attitudes to identify\none’s roles and responsibilities as a member of a team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and objective\nof the team is identified\nfrom available sources\nof information\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n1.1 Group structure\n1.2 Group development\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles and\nresponsibilities within\nthe team environment\nare identified\n2.2 Roles and objectives of\nthe team is identified\nfrom available sources\nof information\n2.3 Team parameters,\nreporting relationships\nand responsibilities are\nidentified based on\nteam discussions and\nappropriate external\nsources\n2.1 Team roles and\nobjectives\n2.2 Team structure and\nparameters\n2.3 Team development\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n3. Work as a\nteam\nmember\n3.1 Effective and\nappropriate forms of\ncommunications are\nused and interactions\nundertaken with team\nmembers based on\ncompany practices\n3.2 Effective and\nappropriate\ncontributions made to\ncomplement team\nactivities and\nobjectives, based on\nworkplace context\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning and\ndecision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace context\n\n3.1 Communicating\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as\na group using\ngroup think\nstrategies and\ntechniques\n\n--- PDF PAGE 12 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n8\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Protocols in reporting\nare observed based on\nstandard company\npractices\n3.4 Contribute to the\ndevelopment of team\nwork plans based on an\nunderstanding of team’s\nrole and objectives\n\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n9\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\nMay include but not limited to:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of information\nMay include but not limited to:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include but not limited to:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 14 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n10\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Worked in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Role play involving the participation of individual member\nto the attainment of organizational goal\n3.2 Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n3.3 Socio-drama and socio-metric methods\n3.4 Sensitivity techniques\n3.5 Written Test\n4. Context for\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n11\n\nUNIT OF COMPETENCY\n: SOLVE/ADDRESS GENERAL WORKPLACE\nPROBLEMS\n\nUNIT CODE\n: 400311212\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto apply problem-solving techniques to determine the origin\nof problems and plan for their resolution. It also includes\naddressing procedural problems through documentation,\nand referral.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems or\nprocedural problem\nareas are identified\n1.2 Problems to be\ninvestigated are defined\nand determined\n1.3 Current conditions of\nthe problem are\nidentified and\ndocumented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and helpdesk\npractices, processes\nand procedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying current\nindustry hardware\nand software\nproducts and\nservices\n1.2 Identifying current\nindustry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying current\nindustry standard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n\n--- PDF PAGE 16 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n12\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential solutions to\nproblem are identified\n2.2 Recommendations\nabout possible solutions\nare developed,\ndocumented, ranked\nand presented to\nappropriate person for\ndecision\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service and\nhelpdesk practices,\nprocesses and\nprocedures\n2.3 Operating systems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause analysis\n2.1 Identifying current\nindustry hardware\nand software\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating system\n2.4 Identifying current\nindustry standard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are planned\n3.2 Evaluation of\nimplemented solutions\nare planned\n3.3 Recommended\nsolutions are\ndocumented and submit\nto appropriate person\nfor confirmation\n\n3.1 Standard procedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat recommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 17 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n13\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include but not limited to:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and incidents\n1.5\nWork-related problems outside of own work area\n2. Appropriate person\nMay include but not limited to:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\n