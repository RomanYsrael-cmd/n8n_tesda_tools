                "number": "9.1",
                "text": "Basic life support definition 9.1.1 Respiratory arrest 9.1.2 Cardiac arrest 9.1.3 Artificial respiration or rescue breathing 9.1.4 Cardiopulmonary resuscitation 9.1.4.1 CPR for infant 9.1.4.2 CPR for children 9.1.4.3 CPR for adult * Follow CPR under AHA (American Heart Association C-A-B procedure)"
              },
              {
                "number": "9.2",
                "text": "Check Circulation – Airway - Breathing 9.2.1 Carotid pulse for adult 9.2.2 Brachial pulse for infant 9.2.3 Open airway 9.2.3.1 Head tilt chin lift maneuver 9.2.3.2 Jaw thrust maneuver 9.2.3.3 Modified jaw thrust maneuver"
              },
