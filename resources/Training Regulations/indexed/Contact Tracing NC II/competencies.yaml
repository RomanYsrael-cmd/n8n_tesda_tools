        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Monitored close contacts of a specific case\n1.2 Updated clients’ record\n1.3 Informed immediate supervisor of specific\ncases/findings in a timely manner\n2. Resource Implications\nThe following resources should be provided:\n2.1 Sign and Symptom Log Form\n2.2 Office Supplies\n2.3 Transportation Expenses\n2.4 Facilities appropriate for the activity\n2.5 Tools and materials appropriate for the activity\n3.Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1 Interview\n3.2 Observation with Questioning\n3.3 Case Analysis\n3.4 Demonstration with Questioning\n3.5 Written Examination\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 91 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n87"
        },
        "source_text": "HHC532339\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, and attitudes\nrequired in contact tracing to conduct monitoring and\nsurveillance of identified close contact of an infected\nindividual.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1. Monitor close\ncontacts of a\nspecific case\n\n1.1 All contacts’ vital signs\nare monitored in\naccordance with\nestablished standards\nand procedures\n1.2 Relevant information is\ngathered through\ninterview\n1.3 All contacts’ Signs and\nSymptoms Log Forms\nare updated regularly\n\n1.1 Basic health\nbackground\n1.2 Records\n1.3 Documentation\n1.4 Effective verbal and\nnonverbal\ncommunications\n1.5 Use of medical\nequipment in vital\nsigns taking\n1.6 Health Interventions\n1.7 Data Privacy Act of\n2012\n1.1 Information\ngathering\n1.2 Ability to take vital\nsigns\n1.3 Ability to apply\nfirst-aid\n1.4 Communication\nskills\n1.5 Relating to people\nwith different\nsocial, cultural and\nethnic\nbackgrounds\n2. Update\nclient’s record\n\n2.1 Interview conducted in\naccordance with\nestablished standards\nand procedures\n2.2 Health data information\nis updated in accordance\nwith established\nstandards and\nprocedures\n2.3 Records are maintained\nin accordance with\ndocumentation process\n\n2.1 Interview Process\n2.2 Documentation\nProcess\n2.3 Health Data\nInformation\n2.4 Data/Records\n Management\n2.5 Clients Health\n Status\n2.6 Data Privacy Act of\n2012\n\n2.1 Information\ngathering\n2.2 Communication\nskills\n2.3 Relating to people\nwith different\nsocial, cultural and\nethnic\nbackgrounds\n\n3. Inform\nimmediate\n3.1 Specific cases are\ndiscussed with the\n3.1 Basic health\nbackground\n3.1 Gathering\ninformation\n\n--- PDF PAGE 89 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n85\n\nsupervisor of\nspecific\ncases/findings\nin a timely\nmanner\nsupervisor in accordance\nwith documentation\nprocess\n3.2 Specific cases are\nreported promptly in\naccordance with\ndocumentation process\n3.2 Effective verbal and\nnonverbal\ncommunications\n3.3 Use of medical\nequipment in vital\nsigns taking\n\n3.2 Communicating\nskills\n3.3 Ability to take vital\nsigns\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Vital Signs\nMay include:\n1.1 BP readings\n1.2 Temperature\n1.3 Pulse rate\n1.4 Others\n\n2. Health Data Information\nMay include:\n2.1 Name\n2.2 Date of Birth/Age\n2.3 Gender\n2.4 Occupation\n2.5 Civil Status\n2.6 Nationality\n2.7 Passport Number\n2.8 Permanent Address\n2.9 Current Address\n2.10 Contact Number\n2.11 Email Address\n2.12 Address outside the Philippines, if applicable\n2.13 Travel History\n2.14 Exposure History\n2.15 Clinical Information\n2.16 Specimen Information\n2.17 Classification\n2.18 Outcome\n2.19 Others\n3. Specific Cases\nMay include:\n3.1 Symptoms:\n3.1.1 Fever\n3.1.2 Cough\n3.1.3 Sore throat\n3.1.4 Difficulty of breathing\n3.1.5 Colds\n3.1.6 Diarrhea\n3.1.7 Others\n\n--- PDF PAGE 90 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n86\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Monitored close contacts of a specific case\n1.2 Updated clients’ record\n1.3 Informed immediate supervisor of specific\ncases/findings in a timely manner\n2. Resource Implications\nThe following resources should be provided:\n2.1 Sign and Symptom Log Form\n2.2 Office Supplies\n2.3 Transportation Expenses\n2.4 Facilities appropriate for the activity\n2.5 Tools and materials appropriate for the activity\n3.Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1 Interview\n3.2 Observation with Questioning\n3.3 Case Analysis\n3.4 Demonstration with Questioning\n3.5 Written Examination\n4. Context of Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 91 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n87"
