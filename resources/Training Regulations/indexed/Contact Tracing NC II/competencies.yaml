        "source_text": "HHC532338\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude required\nin contact tracing to record and report relevant information.\nThe unit involves the documentation of information on the\nactivities involving the patient.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1. Demonstrate\ncomputer\nliteracy and\ndata/records\nmanagement\n\n1.1 Basic Microsoft Office\napplications are\nnavigated/operated in\naccordance with\nestablished standards\nand procedures\n1.2 E-mail system is used in\naccordance with\nestablished standards\nand procedures\n1.3 Basic functions of www-\nbrowser to search for\nnecessary information\nare conducted in\naccordance with\nestablished standards\nand procedures\n1.4 Data or files are stored,\nmaintained, and easily\nretrieved in a hard drive\nin an organized manner\n1.5 Protocol and\nconfidentiality of records\nand data are followed at\nall times\n1.1 Basic MS Office\nApplication\n1.2 Email System\n1.3 Search Engines and\nWeb Browsing\n1.4 Data/Records\nmanagement\n1.5 Data Privacy Act of\n2012 and Health\nProtocols\n\n1.1 Applies basic\ncomputer skill in\nwork using basic\nMS Office\nApplications other\ncomputer\n1.2 Ability to use basic\ne-mail system\n1.3 Ability to launch\nsearch engines\nand conduct basic\nweb searches\n1.4 Ability to maintain,\nstore, and retrieve\nfiles in an\norganized manner\n\n 2. Collate\nrecords\n2.1 Client’s information is\nupdated in accordance\nwith workplace records\nsystem requirements and\ncriteria\n2.1 Records\n2.2 Documentation\n2.3 Standard Forms\n2.4 Basic Mathematics\n2.1 Information\n gathering\n2.2 Communication\n skills\n2.3 Relating to people\n with different\n\n--- PDF PAGE 85 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n81\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n R