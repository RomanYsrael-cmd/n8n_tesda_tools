ge of audiences\n2.4 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\nvalues, ethics and\ncodes of conduct\n2.1 Computing\nbusiness\nmathematics and\nstatistics\n2.2 Describing data\nanalysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Stating legislation,\npolicy and\nprocedures relating\nto the conduct of\nevaluations\n2.5 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n3. Record and\npresent\ninformation\n3.1 Studied\ndata/information are\nrecorded\n3.2 Recommendations are\nanalysed for action to\nensure they are\ncompatible with the\nproject’s scope and\nterms of reference\n3.3 Interim and final\nreports are analysed\nand outcomes are\ncompared to the\ncriteria established at\nthe outset\n3.4 Findings are\npresented to\nstakeholders\n\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n3.4 Organisational\nvalues, ethics and\ncodes of conduct\n\n3.1 Describing data\nanalysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Stating legislation,\npolicy and\nprocedures relating\nto the conduct of\nevaluations\n3.4 Stating\norganisational\nvalues, ethics and\ncodes of conduct\npractices\n\n--- PDF PAGE 28 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n24\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Data analysis\ntechniques\nMay include but not limited to:\n1.1. Domain analysis\n1.2. Content analysis\n1.3. Comparison technique\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied data/information\nThese aspects may be best assessed using a range of\nscenarios what ifs as a stimulus with a walk through forming\npart of the response. These assessment activities should\ninclude a range of problems, including new, unusual and\nimprobable situations that may have happened.\n2. Resource Implications\nSpecific resources for assessment\n2.1 Evidence of competent performance should be obtained\nby observing an individual in an information management\nrole within the workplace or operational or simulated\nenvironment.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Interview\n3.3 Portfolio\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n4. Context for\nAssessment\n4.1 In all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 29 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n25\n\nUNIT OF COMPETENCY\n: PRACTICE OCCUPATIONAL SAFETY AND HEALTH\nPOLICIES AND PROCEDURES\n\nUNIT CODE\n:"
