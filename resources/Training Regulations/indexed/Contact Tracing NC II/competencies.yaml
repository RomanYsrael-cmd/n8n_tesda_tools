                "text": "Lowest priority (Black) person who is already dead or have little chance of survival 7.6.1 Obvious death 7.6.2 Obviously non survivable injury 7.6.2.1 Major open brain trauma 7.6.2.2 Full cardiac arrest 8 Activate medical assistance May include:"
