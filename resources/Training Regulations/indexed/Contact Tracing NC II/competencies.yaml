                "number": "9.3",
                "text": "When to stop CPR 9.3.1 S - Spontaneous breathing and pulse has occurred 9.3.2 T – Turned over to the physician or paramedics 9.3.3 O – Operator or first aider is already exhausted 9.3.4 P – Physician assumed responsibility and if the casualty has been declared dead 10 Detailed history of casualty May include:"
              },
              {
                "number": "10.1",
                "text": "Ask the following data: 10.1.1 Signs and symptoms of the episode 10.1.2 What occurred at the onset of accident 10.1.3 Any known allergies --- PDF PAGE 55 --- Contact Tracing NC II - HHHCCT221 Promulgated (06/2021) 51 VARIABLE RANGE 10.1.4 Present medication 10.1.4.1 Name of medication 10.1.4.2 Frequency of medication 10.1.4.3 Dosage 10.1.4.4 Time when last taken 10.1.5 Past history of casualty’s medical condition 10.1.6 Last oral intake, last meal, drink or medication taken prior to accident 10.1.7 Events leading to injury or illness 11 Physical examination May include:"
              },
              {
                "number": "11.1",
                "text": "Begin care and assessment in the order of importance: 11.1.1 A – Airway 11.1.2 B – Breathing 11.1.3 C – Circulation 11.1.4 D – Disabilities which includes mental status 11.1.5 E - Expose any body part that is fractured like extremities but still maintain casualty’s privacy and dignity 11.2 Techniques of physical examination 11.2.1 Inspection 11.2.2 Palpation 11.2.3 Auscultation 11.2.4 Percussion 11.3 Examine the following: 11.3.1 D - Deformity 11.3.2 C - Contusion 11.3.3 A - Abrasion 11.3.4 P – Punctured 11.3.5 B – Bleeding and burns 11.3.6 T – Tenderness 11.3.7 L - Laceration 11.3.8 S – Swelling 11.4 For casualty - fall from heights 11.4.1 Don’t move the casualty 11.4.2 Wait for the paramedics 11.4.3 Keep the casualty calm and well ventilated 12 Vital signs 12.1 Baseline vital signs 12.1.1 Body temperature 12.1.2 Pulse rate 12.1.3 Respiratory rate 12.1.4 Blood pressure 12.2 Assessment of pain 12.2.1 Use of pain scale --- PDF PAGE 56 --- Contact Tracing NC II - HHHCCT221 Promulgated (06/2021) 52 VARIABLE RANGE 13 Incident report 13.1 Definition of term 13.1.1 Accident report 13.1.2 Incident report"
              },
              {
                "number": "13.2",
                "text": "Find the factor 13.2.1 Date, Time and specific location of incident 13.2.2 Name, job title and department of employee involved 13.2.3 Names and accounts of witness 13.2.4 Events leading up to incident 13.2.5 Exactly what the casualty was doing at the moment of incident 13.2.6 Environmental condition e.g. slippery, wet floor, lighting, noise, etc. 13.2.7 Circumstances like tools, equipment, PPE 13.2.8 Specific injuries of casualty 13.2.9 Type of treatment given 13.2.10 Damage equipment if there are tools and equipment involved in the accident 13.2.11 Determine the sequence 13.2.12 Events involved in the incident 13.2.13 Events after the incident 13.2.14 Analyze 13.2.15 Recommend 13.2.16 Name, signature, date and time of the person who wrote the incident report --- PDF PAGE 57 --- Contact Tracing NC II - HHHCCT221 Promulgated (06/2021) 53 EVIDENCE GUIDE"
