  "source_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1\nGraduates\nof\nWTR-registered\nprograms,\nNTR-registered\nprograms or formal/non-formal/informal including enterprise-\nbased trainings related to CONTACT TRACING NC II; or\n\n4.1.3.2\nExperienced workers (wage employed or self-employed) who\ngained competencies in contact tracing for at least two (2) years\nwithin the last five (5) years.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of contact tracing experience within\nthe last five (5) years may apply for recognition in this Qualification through\nPortfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must\nbe consistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System”.\n\n4.1.5 The guidelines on assessment and certification are discussed in detail in\nthe “Procedures Manual on Assessment and Certification” and “Guidelines\non the Implementation of the “Philippine TVET Competency Assessment\nand Certification System (PTCACS)”.\n\n--- PDF PAGE 132 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n128\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including readiness\nfor assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 133 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n129\n\nMaintain instruments\nand equipment in\nwork area\nAssist in dental\nlaboratory\nprocedures\nAssist with\nadministration in\ndental laboratory\npractice\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond effectively\nto difficult/\nchallenging\nbehavior\nApply basic first\naid\nMaintain high\nstandard of\npatient / client\nservices\nApply quality\nstandards\nMaintain a safe,\nclean and\nefficient\nenvironment\nMaintain an\neffective\nrelationship with\nclients/ customers\n(marketing)\n\nUpdate industry\nknowledge and\npractice through\ncontinuing education\nUse pharmaceutical\ncalculation\ntechniques and\nterminologies\nMaintain an\neffective\nrelationship with\ncustomers and\nclients\nManage own\nperformance\nFollow occupational\nhealth and safety\npolicies in dental\nlaboratory facilities\nMaintain\ninfection control\nin de