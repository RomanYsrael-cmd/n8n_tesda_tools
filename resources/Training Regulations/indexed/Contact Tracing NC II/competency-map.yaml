  "source_text": "COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR\nCONTACT TRACING NC II\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\n--- PDF PAGE 134 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n130\n\nPrepare and\nmaintain beds\nCollect and\nmaintain linen\nstocks at end-\nusers location\nAssist in patient\nmobility\nAssist in\ntransporting\npatients\nAssist in bio-\npsychosocial\nsupport care of\npatients\nHandle waste in a\nhealth care\nenvironment\nPlan the hilot wellness\nprogram of client/s\nProvide pre-\nservice to hilot\nclient/s\nApply hilot\nwellness\nmassage\ntechniques\nProvide post\nadvice and post-\nservices to hilot\nclients\nPractice good\nhousekeeping\nMonitor supply/\ninventory of\npharmaceutical\nproducts\nHandle and control\npharmaceutical\nproducts\nArrange and display\npharmaceutical\nproducts\nPerform good\nlaboratory\npractices\nAdhere to good\nmanufacturing\npractices\nDemonstrate product\nknowledge on\nmedicines\nDispense\npharmaceutical\nproducts\nPerform health\npromotion\neducation,\nvigilance\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical\nequipment\nPerform\npreventive\nmaintenance on\nbiomedical\nequipment\nRepair\nbiomedical\nequipment\nAssess and refer\nbiomedical\nequipment\nDevelop massage\npractice\nPerform client\nconsultation\nPerform body\nmassage and work\narea\nMaintain and\norganize tools,\nequipment,\nsupplies\nPerform basic life\nsupport\nMaintain life\nsupport\nequipment and\nresources\nImplement safe\naccess and\nextrication\nprocedures in an\nemergency\nManage request\nfor ambulance\nservice\nAllocate\nambulance\nservice\nresources\nCoordinate\nemergency\nresources\nDeliver basic\nambulance\ncommunication skills\nSupervise on-\nroad operations\nManage the scene of\nan emergency\nManage the scene\nof a special event\nManage routine\nscene\nDeliver pre-\nhospital patient\ncare\nDeliver intensive\npre-hospital\npatient care\nManage\nambulance\noperations\nTransport\nemergency\npatients\nTransport non-\nemergency\npatients\nDrive vehicles\nunder operational\nconditions\nAssist the\nhousehold to\nidentify health\nproblems to\npromote health\nand well-being\nShare knowledge and\nskills among\nmembers to provide\ninformation, education\nand communication\n(IEC) and/or\nhousehold teaching in\ndisease prevention\nand control\nEnsure the proper\nmaintenance of\nhealth station and\nsafe custody of its\nequipment,\nmedical supplies,\nmaterials, and\nhealth records\nMonitor health\nstatus of\nhousehold\nmembers under\nhis/her area of\nservice coverage\nMaintain updated\nlist/records of\nhealth activities\nAnalyze and\ninterpret\nophthalmic lens\nprescription\nEdge and mount\nophthalmic\nappliances\nApply UV coat/\ntint to\nophthalmic\nlenses\nFabricate models\nFabricate custom\nimpression trays\nFabricate\nregistration bite\nrims\nArticulate models and\ntransfer records\nFabricate\nmouthguard\nFabricate metal\ncrown and bridge\nstructures\nFabricate ceramic\nrestorations\nFabricate indirect\ncomposite/\npolymer fixed\nrestorations\nJoin alloy\nstructures\nArrange artificial\nteeth for\ncomplete\ndentures\nSet-up and wax\nremovable partial\ndentures\nWax, process and\nfinish acrylic\ndentures and\nappliances\nFabricate thermo\nformed bases and\nappliances\nRepair and modify\ndentures and\nappliances\nFabricate oral\nsplints\nFabricate\northodontic\nappliances\nFabricate cast\nmetal removable\npartial denture\nframework\nPerform oral\nexamination\nPromote oral\nhealth and\nhygiene\nOperate a\ndental\nradiographic\nequipment\nApply the\nprinciple of\nradiology biology\nand protection in\ndental practice\nPerform scaling\nand polishing\nMaintain dental\nrecords and\nresources\nProvide effective\npatient/client service\nManage dental\nlaboratory\nproduction and\noperation\nPerform\nadministrative\nfunctions\nContinue\nprofessional\ngrowth and\ndevelopment\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 135 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n131\n\nParticipate in the\nimplementation\nand monitoring of\nnewborn’s care\nplan\nDevelop the ability\nto recognize\nnewborn’s growth\nand development\nPerform caring\nskills for\nnewborn\nParticipate in the\nimplementation and\nmonitoring of infant’s\ncare plan\nProvide physical\nneeds, care and\nsupport to infant\nFoster social,\nintellectual and\nemotional\ndevelopment of\ninfant\nParticipate in the\nimplementation and\nmonitoring of toddler’s\ncare plan\nDevelop the ability\nto recognize\ntoddler’s growth\nand development\nPerform caring\nskills for toddler\nParticipate in the\nimplementation and\nmonitoring of pre-\nschooler’s care plan\nDevelop the ability\nto recognize pre-\nschooler’s growth\nand development\nPerform caring\nskills for pre-\nschooler\nProvide\nassistance and\ncare to personal\nneeds of grade\nschooler\nFoster\nphysiological\nneeds and\ncognitive\ndevelopment of\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\ngrade schooler\nRespond to\nemergency for\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\nadolescent\nPromote\ndevelopmental\ntasks for\nadolescent\nRespond to\nemergency for\nadolescent\nDevelop the ability\nto recognize aging\nprocess\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nPerform caring\nskills\nPerform\nspecialty care\nprocedures\nAssist client in\nadministering\nprescribed\nmedication\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nProvide\nassistance and\nsupport on\nenvironment and\nbiopsychosocial\nneeds of clients\nDevelop the ability to\nrecognize healthy\nbody systems and\napply medical\nterminologies\nProvide care and\nsupport to\nactivities of daily\nliving (ADL) of\nclients\nProvide\nassistance in\nadministering\nprescribed\nmedications to\nclients\nProvide care and\nsupport to clients\nwith special needs\nRespond to\nemergency\nsituations\nProvide\nimmediate care\nand support to\nchildren with\nspecial needs\nProvide\nimmediate care\nand support to\nadults and\nelderly with\nspecial needs\nCarry out\nresponse\nintegration and\ncoordination in a\nmass casualty\nincident\nPerform patient\nassessment\nProvide\nemergency care\nfor suspected\nspine injury\nProvide pre-hospital\ninterventions for\ntrauma patients\nProvide pre-\nhospital\ninterventions for\nshock patients\nProvide pre-\nhospital\ninterventions for\nmedical patients\nPerform basic life\nsupport and use\nairway adjuncts\nProvide pre-\nhospital\ninterventions for\nspecial patient\npopulations\nPerform patient\npackaging\nConduct patient\ntransport\nDeliver basic pre-\nhospital\ncommunication\nskills\nCreate a positive\nmold from a\nnegative cast\nFabricate a\ntranstibial/ankle\ndisarticulation\nprosthesis\nFabricate a\ntransfemoral/knee\ndisarticulation\nprosthesis\nFabricate a\ntransradial/wrist\ndisarticulation\nprosthesis\nFabricate a\ntranshumeral/\nelbow\ndisarticulation/\nshoulder\ndisarticulation\nprosthesis\nPerform basic\nrepair and/or\nreplacement of\nthe prosthetic\ndevices\nFabricate a foot\northosis\nFabricate an\nankle-foot orthosis\nFabricate a\nknee-ankle-foot\northosis\nFabricate a wrist-\nhand orthosis\nFabricate a\ncustomized\nplastic thoraco-\nlumbo-sacral\northosis\nPerform basic\nrepair and/or\nreplacement of\nthe orthotic\ndevices\nReceive wheelchair\nreferral and\nappointment\nAssist the\nwheelchair\nclinician during\nassessment\nCoordinate\nprocurement of\nthe appropriate\nwheelchair size\nand its parts\nPerform\nwheelchair\nassembly and\nmodifications\nAssist the\nwheelchair\nclinician in\nwheelchair\ncheckout and\nfitting\nAssist wheelchair\nclinician in user\ntraining\nPerform\nmaintenance\nand repair on\nwheelchair\nConduct case\ninvestigation and\ncontact\nidentification\nConduct profiling\nof all contacts and\nindex cases and\nfollow-up\nConduct referral\nto health facility/\nquarantine facility/\nother relevant\nagencies\nConduct health\neducation programs\nPerform data\nrecording and\nreporting\nConduct\nmonitoring and\nsurveillance\n\n--- PDF PAGE 136 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n132\n\nGLOSSARY OF TERMS\n\n1. Case investigation - is part of the process of supporting patients with suspected or\nconfirmed infection. Public health staff work with a patient to help them recall\neveryone with whom they have had close contact during the timeframe while they\nmay have been infectious.\n\n2. Close Contact - is someone who was within 6 feet of an infected person for a total of\n15 minutes or more starting from 48 hours before illness onset until the time the patient\nis isolated. They should stay home, maintain social distancing, and self-monitor until\n14 days from the last date of exposure.\n\n3. Contact follow-up - Regular follow-up should be conducted with all contacts to\nmonitor for symptoms and test for signs of infection.\n\n4. Contact Identification - Once someone is confirmed as infected with a virus,\ncontacts are identified by asking about the person’s activities and the activities and\nroles of the people around them since onset of illness. Contacts can be anyone who\nhas been in contact with an infected person: family members, work colleagues,\nfriends, or health care providers.\n\n5. Contact Listing - All persons considered to have contact with the infected person\nshould be listed as contacts. Efforts should be made to identify every listed contact\nand to inform them of their contact status, what it means, the actions that will follow,\nand the importance of receiving early care if they develop symptoms. Contacts should\nalso be provided with information about prevention of the disease. In some cases,\nquarantine or isolation is required for high risk contacts, either at home, or in hospital.\n\n6. Contact Tracing - People in close contact with someone who is infected with a virus,\nsuch as the Ebola virus, are at higher risk of becoming infected themselves, and of\npotentially further infecting others. Closely watching these contacts after exposure to\nan infected person will help the contacts to get care and treatment, and will prevent\nfurther transmission of the virus.\n\n7. Data Recording - is to set in writing and assure the preservation of\nthe data collected in the course of field or laboratory studies. The experimental\ndesign of each study determines the types of data to be collected in terms of the\nobjectives and resources available for the study.\n\n8. Data Reporting - is the process of collecting and submitting data which gives rise\nto accurate analyses of the facts on the ground;[1] inaccurate data reporting can lead\nto vastly uninformed decision-making based on erroneous evidence. Different\nfrom data analysis that transforms data and information into insights, data reporting\nis the previous step that translates raw data into information.[1] When data is not\nreported, the problem is known as underreporting; the opposite problem leads\nto false positives.\n\n--- PDF PAGE 137 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n133\n\n9. Epidemiological Investigation - is a set of procedures used to identify the cause,\ni.e. the infectious agent, responsible for the disease. It is also used to identify the\npeople affected, the circumstances and mode of spread of the disease, and other\nrelevant factors involved in propagating the epidemic.\n\n10. Health Facility - any location where healthcare is provided. Health facilities range from\nsmall clinics and doctor's offices to urgent care centers and large hospitals with\nelaborate emergency rooms and trauma centers. The number and quality of health\nfacilities\nin\na country or\nregion\nis\none\ncommon\nmeasure\nof\nthat\narea's prosperity and quality\nof\nlife.\nIn\nmany\ncountries,\nhealth\nfacilities\nare regulated to some extent by law; licensing by a regulatory agency is often\nrequired before a facility may open for business. Health facilities may be owned and\noperated by for-profit businesses, non-profit organizations, governments, and in\nsome cases by individuals, with proportions varying by country.\n\n11. Interview - a meeting of people face to face, especially for consultation\n\n12. Monitoring - observe and check the progress or quality of (something) over a period\nof time; keep under systematic review.\n\n13. Notifiable Diseases - is any disease that is required by law to be reported to\ngovernment authorities. The collation of information allows the authorities to monitor\nthe disease, and provides early warning of possible outbreaks.\n\n14. Profiling - the recording and analysis of a person's psychological and behavioral\ncharacteristics, so as to assess or predict their capabilities in a certain sphere or to\nassist in identifying a particular subgroup of people.\n\n15. Quarantine Facility - an approved facility in which organisms are raised or held in\nisolation to prevent pathogen introduction or the spread of disease.\n\n16. Referral - an act of referring someone or something for consultation, review, or further\naction. The directing of a patient to a medical specialist by a primary care physician.\nA person whose case has been referred to a specialist doctor or a professional body.\n\n17. Surveillance - closely watching a patient's condition but not treating it unless there\nare changes in test results. Surveillance is also used to find early signs that a\ndisease has come back. It may also be used for a person who has an increased risk\nof a disease, such as cancer.\n\n--- PDF PAGE 138 ---\nContact Tracing NC II - HHHCCT221 Promulgated (06/2021)\n134",
