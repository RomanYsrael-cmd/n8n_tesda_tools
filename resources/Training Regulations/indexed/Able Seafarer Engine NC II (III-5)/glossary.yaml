  "source_text": "DEFINITION OF TERMS \n \n1. \nAuxiliary \nmachinery \nis a diesel engine that acts as prime mover from a ship \ngenerator. The other machineries found inside the engine \nroom other than the auxiliary engine and main engine. \n \n2. \nBallasting/ \nDeballasting \ntransferring, taking in or discharging water ballast. It is \nusually arranged to work the bilges, fire system, or sanitary \ncirculation as required. \n \n3. \nBilge \nthe lowest part of hull next to the keelson \n \n4. \nBlueprints \na contact print, with white line on blue background of a \ndrawing; made on linen or a ferro-prusiate paper and \ndeveloped in water or special solution. \n \n \n \n5. \nBunkering \nthe process of loading, storage of solid or liquid fuel oil in \ncontainers, tanks from which the fuel can be continuously or \nintermittently withdrawn the ship fuel oil storage tank. \n \n6. \nCondenser \na heat transfer device that reduces a thermodynamic fluid \nfrom its vapor phase to its liquid phase. \n. \n7. \nCrankcase \nthe housing of a crankshaft of an engine \n \n8. \nCylinder head \nthe cap that serves to close the end of the piston chamber \nor reciprocating engine, pump or compressor \n \n9. \nEconomizer \na force flow, once-throw, conviction-heat –transfer tube \nbank in which boiler feed water is raised to boiling \ntemperature to produce steam by using the heat generated \nfrom internal combustion \n \n10. Engine Room \nspace in which a vessel’s main propulsion and auxiliary \nengines \n \n11. Governor \na device, especially one acquitted by centrifugal force of \nwhirling weight oppose by gravity or by spring used to \nprovide automatic control of speed or power of a prime \nmover. \n \n12. Heat exchanger \nany device that transfer heat from one fluid to another or to \nthe environment. \n \n13. Lashing \na fastening made by a piece of cordage, chain, or wire in \nsecuring a movable object or uniting two or more parts or \nobjects together.\n\n--- PDF PAGE 72 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n68 \n \n14. Liferaft \na passenger ship equipment covering deficiency if any, in \nlifeboat capacity for all persons on board. \n \n15. Major maintenance \nany maintenance job, which requires the shut down of the \nequipment to be maintained and requires big or large \nresources \n \n16. Man over board \nalarm cry when a person falls into the water. \n \n17. Manipulate \nto work, operate, or when a person falls into the water. \n \n18. Minor maintenance \nany maintenance job, which can be performed by a single \nperson with ease and few resources. \n \n19. Monitor \nto watch, to check on or regulate the performance of a \nmachine. \n \n20. Motorman \nis a rating forming part of an engineering watch and \nprovides support in all engineering tasks in tanker ships. \n \n21. Nozzle \na tube like device, usually streamlined, accelerating and \ndirecting fluid, whose pressure decreases as it leaves the \nnozzle. \n \n22. Oiler \nIs a rating forming part of an engineering watch and \nprovides support in all engineering tasks in ships except \ntanker \n \n23. Parameter \nis a quantity, which is constant in a given set of conditions, \nbut may be different under other condition. \n \n24. Preventive \nmaintenance \nto feed furnish internal combustion engine or may be \ndifferent under other condition. \n \n25. Sea chest \na pipe between s hip’s side and a valve in the hull from \ndraining water. \n \n26. Sounding \nmeasurement used to ascertain the depth of liquid by a lead \nline sounder and pathometers. \n \n27. Tank sounding \nthe level of the liquid inside the tank. \n \n28. Valve \na gate or a variable orifice that is used to regulate the flow \nof liquid sludge a precipitate/residue from oil. \n \n29. Wash Paint \nthe process of cleaning, washing and drying inside the \nengine rooms.\n\n--- PDF PAGE 73 ---"
