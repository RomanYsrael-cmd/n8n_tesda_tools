  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS \n \n \n \nAssessment of an individual’s competence leads to the issuance of a Certificate of \nProficiency (COP) in the relevant unit of competency. \n \nA Certificate of Proficiency (COP) is issued when a candidate has demonstrated \ncompetence in all the units of competency that comprise the relevant promulgated \nqualification. \n \n1. \nCandidate wanting to be certified will have to be assessed in accordance with the \nrequirements identified in the evidence guide of the relevant unit/s of competency. \nAs a rule, the unit/s of competency shall be the benchmark for all assessment \nunder the Training Regulations for Maritime Sector. \n \n2. \nCandidate must have completed the prescribed course of instruction or acquired all \nthe units of competency contained in this Training Regulation and with equivalent \nsea service experience. The following are qualified to apply for assessment and \ncertification: \n \n \nHolder of Certificate of Proficiency (COP) for Rating Forming Part of an \nEngineering Watch NC II (STCW Regulation III/4 ; and \n \nHas completed TESDA-registered training program for ABLE SEAFARER \nENGINE inclusive of an approved sea going service in the engine department \nof not less than twelve (12) months on board seagoing vessel of 750 kW \npropulsion power or more, supported by an accomplished Training Record \nBook as prescribed by the TESDA/MARINA; OR \n \nMinimum eighteen (18) months sea going service in the engine department \nand qualified as a rating forming part of a engine watch on board seagoing \nvessel of 750 kW propulsion power or more, evidenced by a certificate from the \nmanning agency/shipping company which must be reflected in the Seafarers’ \nIdentification and Record Book (SIRB) and in addition, a duly accomplished \nTraining Record Book as prescribed by the TESDA/MARINA. \n \n3. \nCandidates for a COP shall be required to undergo assessment using the methods \nidentified in the units of competency. \n \n4. \nConduct of assessment and issuance of certificates shall follow the procedures \nmanuals and implementing guidelines developed for the assessment and \ncertification of Able Seafarer Engine as institutionalized by and between TESDA \nand MARINA through a Memorandum of Agreement (MOA). \n \n5. \nCandidates who are found to be competent under the qualification for Able Seafarer \nEngine as contained in Section 1 shall be awarded with the corresponding \nCertificate of Proficiency (COP).\n\n--- PDF PAGE 70 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n66 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nCORE \nCOMPETENCIES \n \n \nCOMMON \nCOMPETENCIES\n \n \nBASIC \nCOMPETENCIES\nCOMPETENCY MAP \nFor Maritime Sector \nPerform \nmaintenance and \nsanitation of galley \nequipment and \nPerform cargo \nhandling and \nstowage at the \nsupport level \nPerform marine \nengineering at \nthe support level \nCarry out a watch \nroutine appropriate to \nthe duties of rating \nforming part of an \nengine room watch \nSteer the ship and \nalso comply with \nhelm orders in the \nEnglish language \nPerform \nvictualing \nservices \nPerform \nhousekeeping \nservices \nPerform safe usage \nof electrical \nequipment at the \nsupport level\nMaintain the \ncorrect boiler \nwater levels and \nsteam pressure \nKeep a proper \nlook-out by sight \nand hearing \nSupervise the \nmaintenance and \nsanitation of galley \nequipment and \nutensils and related \nareas \nPerform mess hall \nservice \nPerform \nmaintenance \nand repair at the \nsupport level\nOperate emergency \nequipment and apply \nemergency \nprocedures \nContribute to \nmonitoring and \ncontrolling a safe \nwatch \nProvide assistance \nin receiving and \nstoring provisions \nAssist engineer \nin the \nmaintenance of \nmain engine \nOperate emergency \nequipment and apply \nemergency \nprocedures \nPrepare and \ncook meat dishes \nPrepare stocks, \nsauces and soups \nEstablish and \nmaintain catering \nstandards \nControl the operation \nof the ship and care \nfor persons on board \nat the support level \nPerform \nnavigation at the \nsupport level \nSupervise \npreparation of \nmeals \nPrepare bread \nproducts and hot \nand cold desserts \nPrepare and \ncook seafood \nPrepare and \ncook poultry \nproducts \nPrepare side \ndishes and \nbreakfast meal \nPrepare \nappetizers, salads \nand sandwiches \n(hot and cold and \nopen) \nTake precautions to \nprevent pollution of \nthe marine \nenvironment\nComply with \nemergency \nprocedures \nTake immediate \naction upon \nencountering an \naccident or other \nmedical emergency \nFight and \nextinguish fire \nMinimize the risk of \nfire and maintain a \nstate of readiness to \nrespond emergency \nsituations involving \nfi\nSurvive at sea in \nthe event of ship \nabandonment \nPerform stock \ncontrol \nWork within \nmulti-cultural and \nreligious \nenvironment \nProtect marine \nenvironment/ waste \nsegregation mgmt. \nObserve catering \nhealth and safety \npractices \nPractice food \nsafety, sanitation \nand hygiene \nObserve \npersonal hygiene \nObserve safe \nworking \npractices \nLead small teams \nLead in workplace \ncommunication \nWork in team \nenvironment \nParticipate in \nworkplace \ncommunication \nWork with others \nReceive and \nrespond to \nworkplace \ncommunication \nSolve problems \nrelated to work \nactivities \nDevelop and \npractice negotiation \nskills \nPractice \noccupational \nhealth and \nsafety \nd\nPractice career \nprofessionalism \nPractice basic \nhousekeeping \nprocedures \nDemonstrate \nwork values \nUse relevant \ntechnologies \nUse mathematical \nconcepts and \ntechniques \nDemonstrate \nsecurity \nawareness \npractices \nPerform \nmaintenance and \nrepair at the \nsupport level\n\n--- PDF PAGE 71 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n67 \n DEFINITION OF TERMS \n \n1. \nAuxiliary \nmachinery \nis a diesel engine that acts as prime mover from a ship \ngenerator. The other machineries found inside the engine \nroom other than the auxiliary engine and main engine. \n \n2. \nBallasting/ \nDeballasting \ntransferring, taking in or discharging water ballast. It is \nusually arranged to work the bilges, fire system, or sanitary \ncirculation as required. \n \n3. \nBilge \nthe lowest part of hull next to the keelson \n \n4. \nBlueprints \na contact print, with white line on blue background of a \ndrawing; made on linen or a ferro-prusiate paper and \ndeveloped in water or special solution. \n \n \n \n5. \nBunkering \nthe process of loading, storage of solid or liquid fuel oil in \ncontainers, tanks from which the fuel can be continuously or \nintermittently withdrawn the ship fuel oil storage tank. \n \n6. \nCondenser \na heat transfer device that reduces a thermodynamic fluid \nfrom its vapor phase to its liquid phase. \n. \n7. \nCrankcase \nthe housing of a crankshaft of an engine \n \n8. \nCylinder head \nthe cap that serves to close the end of the piston chamber \nor reciprocating engine, pump or compressor \n \n9. \nEconomizer \na force flow, once-throw, conviction-heat –transfer tube \nbank in which boiler feed water is raised to boiling \ntemperature to produce steam by using the heat generated \nfrom internal combustion \n \n10. Engine Room \nspace in which a vessel’s main propulsion and auxiliary \nengines \n \n11. Governor \na device, especially one acquitted by centrifugal force of \nwhirling weight oppose by gravity or by spring used to \nprovide automatic control of speed or power of a prime \nmover. \n \n12. Heat exchanger \nany device that transfer heat from one fluid to another or to \nthe environment. \n \n13. Lashing \na fastening made by a piece of cordage, chain, or wire in \nsecuring a movable object or uniting two or more parts or \nobjects together.\n\n--- PDF PAGE 72 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n68 \n \n14. Liferaft \na passenger ship equipment covering deficiency if any, in \nlifeboat capacity for all persons on board. \n \n15. Major maintenance \nany maintenance job, which requires the shut down of the \nequipment to be maintained and requires big or large \nresources \n \n16. Man over board \nalarm cry when a person falls into the water. \n \n17. Manipulate \nto work, operate, or when a person falls into the water. \n \n18. Minor maintenance \nany maintenance job, which can be performed by a single \nperson with ease and few resources. \n \n19. Monitor \nto watch, to check on or regulate the performance of a \nmachine. \n \n20. Motorman \nis a rating forming part of an engineering watch and \nprovides support in all engineering tasks in tanker ships. \n \n21. Nozzle \na tube like device, usually streamlined, accelerating and \ndirecting fluid, whose pressure decreases as it leaves the \nnozzle. \n \n22. Oiler \nIs a rating forming part of an engineering watch and \nprovides support in all engineering tasks in ships except \ntanker \n \n23. Parameter \nis a quantity, which is constant in a given set of conditions, \nbut may be different under other condition. \n \n24. Preventive \nmaintenance \nto feed furnish internal combustion engine or may be \ndifferent under other condition. \n \n25. Sea chest \na pipe between s hip’s side and a valve in the hull from \ndraining water. \n \n26. Sounding \nmeasurement used to ascertain the depth of liquid by a lead \nline sounder and pathometers. \n \n27. Tank sounding \nthe level of the liquid inside the tank. \n \n28. Valve \na gate or a variable orifice that is used to regulate the flow \nof liquid sludge a precipitate/residue from oil. \n \n29. Wash Paint \nthe process of cleaning, washing and drying inside the \nengine rooms.\n\n--- PDF PAGE 73 ---\nACKNOWLEDGEMENTS \