  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\n\n\nAssessment of an individual’s competence leads to the issuance of a Certificate of\nProficiency (COP) in the relevant unit of competency.\n\nA Certificate of Proficiency (COP) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the relevant promulgated\nqualification.\n\n1.\nCandidate wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\nAs a rule, the unit/s of competency shall be the benchmark for all assessment\nunder the Training Regulations for Maritime Sector.\n\n2.\nCandidate must have completed the prescribed course of instruction or acquired all\nthe units of competency contained in this Training Regulation and with equivalent\nsea service experience. The following are qualified to apply for assessment and\ncertification:\n\n\nHolder of Certificate of Proficiency (COP) for Rating Forming Part of an\nEngineering Watch NC II (STCW Regulation III/4 ; and\n\nHas completed TESDA-registered training program for ABLE SEAFARER\nENGINE inclusive of an approved sea going service in the engine department\nof not less than twelve (12) months on board seagoing vessel of 750 kW\npropulsion power or more, supported by an accomplished Training Record\nBook as prescribed by the TESDA/MARINA; OR\n\nMinimum eighteen (18) months sea going service in the engine department\nand qualified as a rating forming part of a engine watch on board seagoing\nvessel of 750 kW propulsion power or more, evidenced by a certificate from the\nmanning agency/shipping company which must be reflected in the Seafarers’\nIdentification and Record Book (SIRB) and in addition, a duly accomplished\nTraining Record Book as prescribed by the TESDA/MARINA.\n\n3.\nCandidates for a COP shall be required to undergo assessment using the methods\nidentified in the units of competency.\n\n4.\nConduct of assessment and issuance of certificates shall follow the procedures\nmanuals and implementing guidelines developed for the assessment and\ncertification of Able Seafarer Engine as institutionalized by and between TESDA\nand MARINA through a Memorandum of Agreement (MOA).\n\n5.\nCandidates who are found to be competent under the qualification for Able Seafarer\nEngine as contained in Section 1 shall be awarded with the corresponding\nCertificate of Proficiency (COP).\n\n--- PDF PAGE 70 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n66\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nCORE\nCOMPETENCIES\n\n\nCOMMON\nCOMPETENCIES\n\n\nBASIC\nCOMPETENCIES\n"
