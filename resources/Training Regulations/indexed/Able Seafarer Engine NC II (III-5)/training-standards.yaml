ortable VHF radio\n\n• Manuals/ Catalogs/\nBrochures\n5 pcs.\n• Dustpan\n2 pcs\n• Telephone\n\n• Modules/Les\n4 pcs.\n• Shovel\n2 units\n• Bunkering hose with flange (\n2 inch dia, 5 meters in length)\n\n• CDs/Video tapes\n2 pcs\n• Portable drill\n1pc.\n• Official engine log\nBook\n1 set\n• Dies with holder\n1 unit\n• *Manifold with at least 2\nconnection port, each port\nfitted with valve before the\nconnection flange\n25pcs.\n• Engine log book\n(replica)\n1 set\n• Flaring tool\n25pcs.\n• Clip board with daily\nlog sheet\n1 set\n• Drill (various sizes)\n1 pc.\n• Bunker checklist\n\n\n8 pcs.\n• Bolt and nuts for securing\nflange\n1 pc\n\n• Video related to\nunsafe conditions or\npotencial hazard in\nengine room\n\n\n1 unit\n• Bunker sampling equipment\n\n\n\n\n1 pc.\n• Video related to\nemergencies in\nengine room\n\n\n2 pcs\n• Removable stopper for the\nswing valve\n1 pc.\n• Video related to\nbunkering\n\n--- PDF PAGE 65 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n61\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n\n\n1 unit\n• 2 compartment tank (each\ncompartment - W - 0.5 m, L-\n1 m, H -1.5 m) with sounding\npipe (0.5 meter length from\ntank top) on all compartment\nwith swing valve at the end\nof one of the sounding pipe\n\n\n\n\n1 unit\n• Starter panel for motor which\ncan simulate electrical\ntrouble\n\n\n\n\n1 unit\n• Motor ( 220 V )\n\n\n\nNOTE: *The use of simulator (description is in the next table) may be used in lieu of actual\nequipment\n\n\nSIMULATOR/S\nQTY\nDescription\n1 set\nENGINE ROOM SIMULATORS (ERS) EQUIPMENT\n\n1. The simulated engine room shall as a minimum reflect a typical machinery found\non merchant ships. The following main components shall be simulated and all\nnecessary sub-systems, and all necessary sub-systems included for a low speed\nengine:\n\n— main engine including turbocharger system\n— 2 auxiliary diesel generators\n— lubrication oil separator\n— steering gear system\n— fire pump\n— shaft generator\n— cooling water system including freshwater generation system\n— turbo generator\n— fuel oil Bunkering system\n— fuel oil Settling and Service systems\n— 2 heavy fuel oil separators\n— 1 diesel oil separator\n— steam generation plant including exhaust and oil-fired boilers\n— 2 starting air compressors\n— diesel oil and heavy fuel oil supply to main and auxiliary engines\n— main engine operation from engine room, engine control room and bridge\n— turbocharger system\n— air ventilation system for engine and control room\n— bilge water system including oily water treatment systems\n— stern tube system\n— deck machinery applicable to the ship model\n— ballast system\n— Sewage treatment system.\n\nMedium and High Speed Engines\n\n2. The simulated engine room shall consist of typical machinery found on merchant\nships. The following main components shall be simulated and all necessary sub-\nsystems included for a medium and high speed engine:\n\n--- PDF PAGE 66 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n62\n— one or more main engines\n— main SW system\n— 2 auxiliary engines\n— fuel oil tanks\n— fuel oil separator\n— lubrication oil separator\n— main engine(s), including:\n— fresh water system\n— lubrication system\n— turbocharger system\n— ME SW system.\n— reduction gear system\n— controllable propeller pitch where applicable\n— steam generation system as applicable\n— freshwater generator\n— bilge wells and bilge separation system\n— 2 air compressors\n— steering gear system\n— fire pump\n— electrical power plant\n— deck machinery applicable to the ship model\n— ballast system\n— sewage treatment system\n\nSteam Propulsion\n\n3. The simulation model should reflect main steam related subsystems of an\nactual ship:\n\n— HFO supply system\n— DO supply system\n— boil-off gas supply system if LNG ship is simulated\n— 1 ½ boiler system or twin boiler systems each including:\n— local and remote control systems\n— safety systems\n— burner management system\n— burner system, incl. minimum 3 burners\n— air/flue gas system\n— heating surfaces\n— water/ steam system.\n— main turbine, including:\n — local and remote control systems\n— safety systems\n— throttle control\n— draining and heating system\n— gland sealing system.\n — main reduction gear system including:\n — lubrication system incl. purifier\n— governor sensor system.\n — condenser and condensate feed systems\n— SW circ system\n— aux SW system\n— vacuum pumps\n— condenser condensate level control.\n\n — atmospheric drain system\n— atmospheric drain tank\n— drain pumps\n— level control.\n\n— feed water pre-heaters (one or more)\n\n--- PDF PAGE 67 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n63\n— de-aerator system\n— boiler feed water pumps\n— back pressure steam system and auxiliary\n— ballast system\n— deck machinery applicable to the ship model.\n\nElectric Propulsion Motors (Diesel and/or Gas)\n\n4. The simulated engine room shall reflect typical machinery found on merchant or\npassenger ships. The following main components shall, as a minimum be\nsimulated and all necessary sub-systems included for a diesel and/or gas turbine\nelectric propulsion plant:\n\n— propulsion electric motor(s)\n— 2 or more high voltage generators\n— 2 or more prime movers (diesel engines or gas-turbines)\n— cooling water system including freshwater generation system\n— fuel oil Bunkering system\n— fuel oil Settling and Service systems\n— fuel oil separator system\n— lubrication oil separator system\n— steam generation plant as applicable\n— starting air and service air system\n— main engine operation from engine room, engine control room and bridge\n— bilge water system including oily water treatment systems.\n— ballast system\n— stern tube system\n— steering gear system\n— deck machinery applicable to the ship model\n-- fire pump\n\n\n\nREMARKS:\n\nAbove tools, equipment and materials are applicable for the training delivery of the CORE\nCOMPETENCIES.\n\nThe tools, equipment and materials for the delivery of the COMMON COMPETENCIES shall\ncomply with the standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in\ntheir prescribed and regulated training program in BASIC SAFETY TRAINING (BST) and\nSECURITY AWARENESS TRAINING courses.\n\n--- PDF PAGE 68 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n64\n3.5\nTRAINING FACILITIES\nABLE SEAFARER ENGINE NC II (STCW Regulation III/5)\n\nBased on a class size of 24 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL\nAREA IN SQ.\nMETERS\n• Lecture Room (Job/ Site/\nSchool\n\n42.00\n42.00\n• Trainee Working Space\n 1.50 x 1.50 /\ntrainee\n2.2.5 per trainee\n54.00\n• Lecture Resource Center\n4.00 x 5.00\n20.00\n20.00\n• Administration / Faculty\n\n\n30.00\nTotal Workshop Area\n\n\n146.00\n\nREMARKS:\n\n1. The training facilities for the delivery of the COMMON COMPETENCIES shall comply with the\nstandards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in their\nprescribed and regulated training program in BASIC SAFETY TRAINING (BST) and\nSECURITY AWARENESS TRAINING courses.\n\n\n\n3.6\nTRAINER’S QUALIFICATIONS FOR MARITIME SECTOR\n\nABLE SEAFARER ENGINE NC II (STCW Regulation III/5)\nTRAINER QUALIFICATION\n\n• Must be a licensed Officer-In-Charge of an Engineering Watch and at least with\ntwelve (12) months seagoing service in the position\n• Must be proficient in English communication\n• Must be a holder of National TVET Trainer Certificate (NTTC) I – Able Seafarer\nEngine NC II (STCW Regulation III/5)\n\nREMARKS:\n\nAbove trainer’s qualifications are applicable for the delivery of the CORE\nCOMPETENCIES.\n\nThe trainer’s qualifications for the delivery of the common competencies shall comply with\nthe standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in their\nprescribed and regulated training in Basic Safety Training (BST) and SECURITY\nAWARENESS TRAINING courses.\n\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 69 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n65"
