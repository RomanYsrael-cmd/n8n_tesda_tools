d materials are applicable for the training delivery of the CORE\nCOMPETENCIES.\n\nThe tools, equipment and materials for the delivery of the COMMON COMPETENCIES shall\ncomply with the standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in\ntheir prescribed and regulated training program in BASIC SAFETY TRAINING (BST) and\nSECURITY AWARENESS TRAINING courses.\n\n--- PDF PAGE 68 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n64\n3.5\nTRAINING FACILITIES\nABLE SEAFARER ENGINE NC II (STCW Regulation III/5)\n\nBased on a class size of 24 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL\nAREA IN SQ.\nMETERS\n• Lecture Room (Job/ Site/\nSchool\n\n42.00\n42.00\n• Trainee Working Space\n 1.50 x 1.50 /\ntrainee\n2.2.5 per trainee\n54.00\n• Lecture Resource Center\n4.00 x 5.00\n20.00\n20.00\n• Administration / Faculty\n\n\n30.00\nTotal Workshop Area\n\n\n146.00\n\nREMARKS:\n\n1. The training facilities for the delivery of the COMMON COMPETENCIES shall comply with the\nstandards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in their\nprescribed and regulated training program in BASIC SAFETY TRAINING (BST) and\nSECURITY AWARENESS TRAINING courses.\n\n\n\n3.6\nTRAINER’S QUALIFICATIONS FOR MARITIME SECTOR\n\nABLE SEAFARER ENGINE NC II (STCW Regulation III/5)\nTRAINER QUALIFICATION\n\n• Must be a licensed Officer-In-Charge of an Engineering Watch and at least with\ntwelve (12) months seagoing service in the position\n• Must be proficient in English communication\n• Must be a holder of National TVET Trainer Certificate (NTTC) I – Able Seafarer\nEngine NC II (STCW Regulation III/5)\n\nREMARKS:\n\nAbove trainer’s qualifications are applicable for the delivery of the CORE\nCOMPETENCIES.\n\nThe trainer’s qualifications for the delivery of the common competencies shall comply with\nthe standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in their\nprescribed and regulated training 