      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for ABLE SEAFARER ENGINE NC II (STCW\nRegulation III/5).\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: ABLE SEAFARER ENGINE NC II (STCW Regulation III/5)\n\nSuggested Nominal Training Duration:\n18 Hours (Basic Competencies)\n60 Hours (Common Competencies)\n68 Hours (Core Competencies)\n\nCourse Description:\nThis course is designed to equip individual with basic and common operational\nskills, knowledge and attitudes of ABLE SEAFARER ENGINE NC II (STCW Regulation\nIII/5).\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n\nDiscussion\nInteraction\n\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 59 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n55\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Survive at sea\nin the event of\nship\nabandonment\n1.1 Respond to the indicated\nemergency\n1.2 Board a survival craft\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Written\n• Questioning\n• Observation\n• Practical\nperformance\n\n2. Minimize the\nrisk of fire and\nmaintain a\nstate of\nreadiness to\nrespond to\nemergency\nsituations\ninvolving fire\n\n2.1 Carry out fire minimization\nprocedures\n2.2 Respond to emergencies\ninvolving fire\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\nperformance\n\n3. Fight and\nextinguish\nfires\n3.1 Operate portable fire-\nfighting equipment\n3.2 Carry out fire-fighting\noperations\n\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n4. Take\nimmediate\naction upon\nencountering\nan accident or\nother medical\nemergency\n\n4.1 Determine the need of\ncasualty\n4.2 Administer first-aid to the\nvictim\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n5. Comply with\nemergency\nprocedures\n5.1 Take action on becoming\naware of an emergency\n5.2 Follow established\nemergency procedures\n5.3 Follow procedures for the\nuse of various life-saving\nequipment\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n\n--- PDF PAGE 60 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n56\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Take\nprecautions to\nprevent\npollution of\nthe marine\nenvironment\n6.1 Practice compliance with\nlegislative requirements for\nprotection of the marine\nenvironment\n6.2 Practice anti-pollution\nprocedures\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n7. Observe safe\nworking\npractices\n7.1 Identify and follow\nworkplace procedures for\nhazard identification and\nrisk control\n7.2 Contribute to arrangements\nfor the management of\noccupational health and\nsafety\n7.3 Understand and take\nnecessary actions to\ncontrol fatigue\n7.4 Complete occupational\nhealth and safety records\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n8. Demonstrate\nsecurity\nawareness\npractices\n8.1 Contribute to the\nenhancement of maritime\nsecurity through\nheightened awareness\n8.2 Recognize security threats\n8.3 Understand the need for\nand maintaining security\nawareness and vigilance\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\nNOTE: *Trainee-applicant who already possesses the relevant certificate of training\nand/or certificate of competency on BST and Security Awareness Training shall\nnot be required to undergo training or certification on Common Competencies\n\n--- PDF PAGE 61 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n57\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmarine\nengineering at\nthe support\nlevel\n1.1 Contribute to a safe\nengineering watch\n1.2 Contribute to the\nmonitoring and controlling\nof an engine-room watch\n1.3 Contribute to fuelling and\noil transfer operations\n1.4 Contribute to bilge and\nballast operations\n1.5 Contribute to the operation\nof equipment and\nmachinery\n\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Simulation\n\n• Observation\n• Practical\nDemonstration\nand Oral\nExamination\n• Written Test\n2. Perform safe\nusage of\nelectrical\nequipment at\nthe support\nlevel\n2.1 Operate electrical\nequipment\n2.2 Follow safety and hazard\ncontrol procedures\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Simulation\n\n• Observation\n• Practical\nDemonstration\nand Oral\nExamination\n• Written Test\n3. Perform\nmaintenance\nand repair at\nthe support\nlevel\n3.1 Contribute in routine\nplanned maintenance of\nequipment and machinery\n3.2 Contribute in repairs of\nequipment and machinery\n3.3 Carry out stores operations\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Simulation\n\n• Observation\n• Practical\nDemonstration\nand Oral\nExamination\n• Written Test\n\n--- PDF PAGE 62 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n58\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off the job components\n•\nAllows for recognition of prior learning (RPL) or current competencies\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when\ndesigning training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 63 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n59\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience.\nOther requirements like health and physical requirements are also stated. Passing entry\nwritten examinations may also be indicated if necessary.\n\n•\nHolder of Certificate of Proficiency (COP) for Rating Forming Part of an\nEngineering Watch II (STCW Regulation III/4); or\n•\nMust have completed a course on Rating Forming Part of an Engineering\nWatch from accredited training center of TESDA/ MARINA; and\n•\nMust have passed the medical examination for eyesight and hearing as per\nDOH Administrative Order No. 2013-0006\n\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS 