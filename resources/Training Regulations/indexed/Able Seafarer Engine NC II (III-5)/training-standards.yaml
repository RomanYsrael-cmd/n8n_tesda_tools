ng gear system\n— fire pump\n— shaft generator\n— cooling water system including freshwater generation system\n— turbo generator\n— fuel oil Bunkering system\n— fuel oil Settling and Service systems\n— 2 heavy fuel oil separators\n— 1 diesel oil separator\n— steam generation plant including exhaust and oil-fired boilers\n— 2 starting air compressors\n— diesel oil and heavy fuel oil supply to main and auxiliary engines\n— main engine operation from engine room, engine control room and bridge\n— turbocharger system\n— air ventilation system for engine and control room\n— bilge water system including oily water treatment systems\n— stern tube system\n— deck machinery applicable to the ship model\n— ballast system\n— Sewage treatment system.\n\nMedium and High Speed Engines\n\n2. The simulated engine room shall consist of typical machinery found on merchant\nships. The following main components shall be simulated and all necessary sub-\nsystems included for a medium and high speed engine:\n\n--- PDF PAGE 66 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5)\nRevised June 26, 2013\n62\n— one or more main engines\n— main SW system\n— 2 auxiliary engines\n— fuel oil tanks\n— fuel oil separator\n— lubrication oil separator\n— main engine(s), including:\n— fresh water system\n— lubrication system\n— turbocharger system\n— ME SW system.\n— reduction gear system\n— controllable propeller pitch where applicable\n— steam generation system as applicable\n— freshwater generator\n— bilge wells and bilge separation system\n— 2 air compressors\n— steering gear system\n— fire pump\n— electrical power plant\n— deck machinery applicable to the ship model\n— ballast system\n— sewage treatment system\n\nSteam Propulsion\n\n3. The simulation model should reflect main steam related subsystems of an\nactual ship:\n\n— HFO supply system\n— DO supply system\n— boil-off gas supply system if LNG ship is simulated\n— 1 ½ boiler system or twin boiler systems each including:\n— local and 