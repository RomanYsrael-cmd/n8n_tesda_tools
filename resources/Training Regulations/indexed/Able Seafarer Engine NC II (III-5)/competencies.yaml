        "source_title": "OBSERVE SAFE WORKING PRACTICES",
        "source_text": "--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n34 \nUNIT OF COMPETENCY \n: \nOBSERVE SAFE WORKING PRACTICES \n \nUNIT CODE \n: \nMTM834214 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge and skills required to \nobserve established maritime safe working practices.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables  \n1. Identify and follow \nworkplace procedures \nfor hazard identification \nand risk control  \n1.1   Safety regulations and established vessel’s safety and \nhazard control practices and procedures are obtained, \ninterpreted and applied to day-to-day work activities. \n1.2   Workplace procedures for Occupational Health and Safety \nand related work instructions for controlling risks onboard a \nvessel are followed. \n1.3   Workplace procedures for dealing with shipboard \naccidents, fire and emergencies are known and followed. \n1.4   Hazards in the workplace are identified and appropriate \naction is taken to report them and to minimize or eliminate \nrisk to personnel, vessel and the environment. \n1.5   Where relevant, procedures and precautions necessary for \nentry into a pump room, fuel tanks or other confined spaces \non a vessel are followed. \n1.6   Personal protection clothing and equipment is used in \naccordance with established shipboard safety practices \nand procedures. \n1.7   Appropriate assistance is provided in the event of a \nshipboard emergency to secure the vessel and its \nmachinery and equipment and to maintain the safety of the \nvessel and persons involved. \n1.8   Established emergency and contingency plans are followed \nin the event of a shipboard emergency. \n2. Contribute to \narrangements for the \nmanagement of \noccupational health and \nsafety \n2.1   Occupational Health and Safety issues and identified safety \nhazards are raised with designated personnel in \naccordance with workplace procedures and relevant \noccupational health and safety legislation. \n2.2   Contributions to occupational health and safety \nmanagement in the workplace are made within workplace \nprocedures and provisions of relevant legislation. \n2.3   Occupational health and safety issues are raised with \ndesignated personnel in accordance with workplace \nprocedures and relevant occupational health and safety \nlegislation. \n2.4   Contribute to participative arrangements for occupational \nhealth and safety management in the workplace within \nvessel’s procedures and scope of responsibilities and \ncompetencies.  \n3. Take necessary actions \nto control fatigue \n3.1   Fatigue symptoms are recognized and identified. \n3.2   Corrective actions are taken on discovery of fatigue in \naccordance with established company procedures. \n3.3   Fatigue management practices are observed at all times. \n3.4   Reports related to incidence of fatigue are communicated \nto appropriate authority in accordance with established \ncompany procedures. \n4.  Complete occupational \nhealth and safety \nrecords    \n4.1   Occupational health and safety records for self are \ncompleted in accordance with workplace requirements. \n4.2   Legal requirements for the maintenance of records of \noccupational injury and diseases are followed.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n35 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Emergencies  \nMay include: \n1.1 \nLoss of propulsion \n1.2 \nLoss of electrical power \n1.3 \nLoss of steerage \n1.4 \nFlooding of vessel \n1.5 \nFire or explosion \n1.6 \nLoss of refrigeration \n1.7 \nLoss of water making ability \n1.8 \nFuel oil, lubrication oil, steam and gas leaks \n1.9 \nOverheating and over speed of machinery, \ngovernors, emergency trips \n \n2. Hazards in the workplace  May include: \n2.1 \nMoving heavy loads in an unsafe work \nenvironment \n2.2 \nUnsecure machinery, components or repair \nequipment \n2.3 \nSlippery deck \n2.4 \nWelding equipment \n2.5 \nSharp tools and implements \n2.6 \nPower tools \n2.7 \nMoving and rotating machinery \n2.8 \nFlammable liquids, vapors and fuel \n2.9 \nUsing equipment beyond safe working limits \n2.10 Poor housekeeping procedures \n2.11 Electrical wiring and systems \n2.12 Hot pipes and valves (steam, fuel oil, lubricating \noil) \n2.13 Cold pipes and valves (refrigeration and liquefied \ngas cargoes) \n2.14 Working at heights \n2.15 Exposed electrical circuits \n2.16 Toxic gases and substances \n2.17 Chemicals and other harmful substances \n2.18 Damaged cargo and containers \n \n3. Participative \narrangements  \nMay include: \n3.1 \nFormal and informal meetings which include \noccupational health and safety \n3.2 \nOccupational health and safety committees \n3.3 \nOther committees, for example, consultative, \nplanning and purchasing \n3.4 \nHealth and safety representatives \n3.5 \nSuggestions, requests, reports and concerns put \nforward by vessel’s crew to senior officers\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n36 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidences that the candidate: \n1.1 \nidentified and followed workplace procedures for hazard \nidentification and risk control  \n1.2 \ncontributed to arrangements for the management of OHS \nonboard a vessel \n1.3 \nunderstood and taken necessary actions to control fatigue \n1.4 \ncompleted OHS records as required \n1.5 \ncommunicated effectively with others on workplace safety \nmatters \n \n2. Required \nKnowledge  \n2.1 \nKnowledge of relevant maritime and OHS regulations \n2.2 \nISM Code Safety Management System procedures (where \napplicable) \n2.3 \nThe provisions of OHS Acts, regulations and codes of \npractice relevant to the workplace, including the rights and \nresponsibilities of the workplace parties under OHS Acts, \nregulations and codes of practice; \n2.4 \nThe ways in which OHS is managed in the workplace, and \nactivities required under OHS legislation, for example: \n2.4.1  policies \n2.4.2  procedures \n2.4.3  plant and equipment maintenance \n2.4.4  hazard identification \n2.4.5  risk assessment and control \n2.4.6  OHS instruction \n2.4.7  training and provision of OHS information \n2.5 \nHazards that exist in the workplace \n2.6 \nThe preferred order of ways to control risks (known as the \nhierarchy of control); \n2.7 \nWorkplace OHS procedures relevant to the work being \nundertaken, including procedures for: \n2.7.1  recognizing and reporting on hazards, for example, \nwork area inspections \n2.7.2  work operations to control risks, for example, permit \nto work systems and isolation procedures \n2.7.3  responding to accidents, fires and emergencies \n2.7.4  raising OHS issues \n2.7.5  employee participation in OHS management, for \nexample, consultative or OHS committees and \n2.7.6  joint employer/employee inspections \n2.8 \nThe meaning of OHS symbols found on signs and labels \nin the workplace \n2.9 \nDesignated personnel responsible for OHS onboard a \nvessel \n2.10 Effects of sleep, schedules, and the circadian rhythm on \nfatigue \n2.11 Effects of physical stressors on seafarers \n2.12 Effects of environmental stressors in and outside the ship \nand their impact \n2.13 Effects of schedule changes on seafarer fatigue\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n37 \n \n3. Required Skills \n3.1 Applying OHS in the workplace, and activities required  \nunder OHS legislation, \n3.2 Applying order of ways to control risks (known as the \nhierarchy of control) \n3.3 Designating personnel responsible for OHS onboard a \nvessel \n3.4 Communication skills \n \n4. Resource  \nImplications  \nThe following resources should be provided: \n4.1 simulated workplace environment \n4.2 workplace standards, procedures, policies, guidelines \n4.3 tools and equipment relevant to work activities \n \n5. Methods of \nAssessment     \n \nCompetency in this unit may be assessed through: \n5.1 Observation/simulated practical demonstration in the \napplication of safe working practices and safety hazard \ncontrol onboard a vessel \n5.2 Simulation/role plays to test the candidate’s knowledge and \nskills in the application of safe working practices and \nhazard control and safety hazard control on a \ncommercial/or training vessel \n \n6. Context of \nAssessment \n6.1   Assessment may be conducted in the workplace or in \nsimulated work environment\n",
