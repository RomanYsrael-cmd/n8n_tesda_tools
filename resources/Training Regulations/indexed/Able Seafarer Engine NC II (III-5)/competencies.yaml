          "source_text": "1.  Operate electrical \nequipment  \n1.1. \nShipboard Electrical equipment and its power supply \nare identified according to their functions. \n1.2. \nShipboard electrical equipment is operated in \naccordance with established procedures and \nmanufacturer’s instructions.  \n1.3. \nInitial immediate corrective action is performed on \nelectrical problems and faults and reported to relevant \npersonnel. \n \n2.  Follow safety and \nhazard control \nprocedures \n \n2.1 \nSafety, hazard minimization and pollution control \nprocedures and national and international regulations \nare followed at all times during the operation of electrical \nmachinery and electrical equipment. \n2.2 \nOperational hazards are Identified and unsafe \nequipment are reported to concerned personnel in \naccordance with company policies and procedures. \n2.3 \nIsolation and emergency procedures are carried out and \nimmediately reported to relevant personnel n the event \nof any electrical equipment failure. \n2.4 \nShipboard emergency and contingency plans \nfollowed in the event of a electrical equipment failure or \nemergency. \n2.5 \nHousekeeping is observed at all times in engine room.\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n47 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Shipboard electrical \nequipment \nMay include: \n1.1 \nFixed \n1.2 \nPortable \n1.3 \nHand-held \n \n2. Power supply \nMay include: \n2.1 \nVoltages \n2.2 \nCurrent \n2.3 \nFrequency \n \n3. Operated \nOperation of shipboard electrical machinery  equipment may \nbe carried out: \n3.1 \nBy day or night in both normal and emergency \nsituations \n3.2 \nUnder any permissible conditions of weather \n3.3 \nWhile underway \n3.4 \nDuring berthing and unberthing operations \n3.5 \nWhile anchored or moored \n3.6 \nIn dry dock \n3.7 \nWhen bunkering \n3.8 \nDuring cargo operations \n \n4.  Operational hazards  