        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nresponded to indicated emergency \n1.2 \nboarded survival craft \n \n2. Required Knowledge \n2.1 \nTypes of emergency situations and actions to be \ntaken when- \n2.1.1 called to survival craft stations \n2.1.2 required to abandon ship \n2.1.3 in the water \n2.1.4 aboard a survival craft \n2.1.5 a person falls overboard (man \noverboard) \n2.2 \nTypes, uses and location of life-saving appliances \n2.3 \nSurvival craft equipment and how to operate them \n2.4 \nValue of training and drills \n2.5 \nTypes and uses of personal protective clothing and \nequipment \n \n3. Required Skills \n3.1 \nDonning lifejacket \n3.2 \nDonning and using an immersion suit \n3.3 \nJumping from a height into the water \n3.4 \nRighting an inverted life raft while wearing a lifejacket \n3.5 \nKeeping afloat without a lifejacket \n3.6 \nTaking initial action on boarding survival craft \n3.7 \nStreaming a drogue or sea-anchor \n3.8 \nOperating survival craft equipment \n3.9 \nOperating location devices including radio equipment \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place with recommended facilities \n4.2 \ntools and equipment appropriate to the activity \n4.3 \nmaterials relevant to the proposed activity and tasks \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nDemonstration and questioning of related \nunderpinning knowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a \nsimulated workplace setting\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n17 \nUNIT OF COMPETENCY \n: \nMINIMIZE THE RISK OF FIRE AND MAINTAIN A STATE \nOF READINESS TO RESPOND TO EMERGENCY \nSITUATIONS INVOLVING FIRE \n \nUNIT CODE \n:",
