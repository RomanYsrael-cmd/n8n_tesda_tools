 and \nrescue and fire-fighting team on board a vessel  \n3.4 \nDetermining the operational capability of fire-fighting \nappliances, equipment and systems \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place with recommended facilities \n4.2 \ntools and equipment appropriate to the activity \n4.3 \nmaterials relevant to the proposed activity and tasks \n \n5. Methods of Assessment Competency in this unit must be assessed through: \n5.1 \nDemonstration  and questioning of  related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment \n6.1      Competency may be assessed in workplace or in a \nsimulated workplace setting",
