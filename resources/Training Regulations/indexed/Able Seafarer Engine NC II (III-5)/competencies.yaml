          "source_text": "1. Contribute to a safe \nengineering watch \n1.1 \nThe conduct, handover and relief of the engineering \nwatch is carried out in conformity with accepted \nprinciples and vessel’s procedures. \n1.2 \nWatchkeeping principles and procedures are \nfollowed in accordance with established marine. \nengineering practice and regulatory requirements \n1.3 \nA safe engineering watch is achieved based on  the  \naccepted bridge and engine room resource \nmanagement principles and procedures. \n1.4 \nFatigue management strategies are correctly \napplied in accordance with STCW codes. \n1.5 \nCommunications with the officer of the watch are \nclear and concise. \n1.6 \nOrders from the officer on watch are understood and \naccurately executed. \n \n2. Contribute to the \nmonitoring and \ncontrolling of an \nengine-room watch \n2.1 \nThe frequency and extent of monitoring of main \npropulsion and auxiliary machinery is carried out in \nconformity with accepted principles and procedures. \n2.2 \nAppropriate entries pertaining to the engineering \nwatch are recorded in the engine room book as per \nstandard operating procedures. \n2.3 \nAny deviation from the normal parameters is reported \nimmediately to the engineer on watch. \n2.4 \nMalfunctions of the main propulsion and auxiliary \nmachineries and its parameters are identified, and \nreported immediately to the duty engineer. \n2.5 \nUnsafe conditions or potential hazards are \npromptly recognized, reported and rectified before \nwork continues. \n2.6 \nEngine room emergency is reported immediately \nand appropriate action is undertaken.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n42 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3. Contribute to fuelling \nand oil transfer \noperations \n3.1 \nFuel system and oil transfer operations are \ncarried out in accordance with established safety \npractices and equipment operating instructions. \n3.2 \nDangerous, hazardous and harmful liquid is handled \nin compliance with established safety practices. \n3.3 \nThe performance of machinery and equipment \nused in fuel system and oil transfer operations are \nmonitored in accordance with vessel’s survey \nrequirements and manufacturer’s instructions. \n3.4 \nCommunications made within the operators’ area of \nresponsibility are consistently successful. \n3.5 \nHousekeeping is observed at all times in engine \nroom. \n \n4.  Contribute to bilge and \nballast operations \n4.1 \nBilge and ballast operations and maintenance are \ncarried out in accordance with established safety \nstandards and regulatory requirements, to avoid \npollution of the marine environment. \n4.2 \nAny operational problems encountered in the use of \nequipment and machinery on the vessel are reported \nand/or rectified in accordance with standard \nprocedures. \n4.3 \nRecords of performance of machinery and \nequipment used in bilge and ballast operations are \nmaintained in accordance with established \nprocedures. \n4.4 \nCommunications made within the operators’ area of \nresponsibility are consistently successful. \n4.5 \nHousekeeping is observed at all times in engine room. \n \n5.  Contribute to the \noperation of \nequipment and \nmachinery \n5.1 \nPre-operational checks of equipment and machinery \nand associated systems are carried out in \naccordance with safety requirements and shipboard \npractices. \n5.2 \nOperation of equipment and machinery is performed in \naccordance with manufacturer’s specifications and \ninstructions and safety requirements. \n5.3 \nAny operational problems encountered in the use of \nequipment and machinery on the vessel are reported \nand/or rectified in accordance with standard \nprocedures. \n5.4 \nPost-operational checks of equipment and machinery \nand associated systems are carried out in accordance \nwith safety requirements and shipboard practices. \n5.5 \nCommunications made within the operators’ area of \nresponsibility are consistently successful. \n5.6 \nHousekeeping is observed at all times in engine \nroom.\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n43 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Watchkeeping \nprinciples and \nprocedures \nMay include: \n1.1 Maintenance of safe engineering watch   \n1.2 Avoidance of pollution of the marine environment \n1.3 Appropriate assistance must be available to be \nsummoned to the engine room if required by a \nchange in the vessel’s operational situation \n \n2. Fatigue management \nstrategies \nMay include: \n2.1   Recognition of symptoms of fatigue \n2.2   Arranging to take a break when symptoms of fatigue \nare identified \n2.3   Maintenance of personal fitness and health and \nappropriate dietary habits \n2.4   Avoidance of excessive consumption of alcohol prior \nto watchkeeping duties \n \n3. Unsafe conditions or \npotential hazards \nMay include: \n3.1   Unsafe conditions \n        3.1.1   System leakages \n        3.1.2   Excessive pressure \n        3.1.3   Excessive temperature \n        3.1.4   Excessive vibration \n3.2   Potential hazards \n        3.2.1   Electrical hazards \n        3.2.2   Uninsulated high temperature lines \n        3.2.3   Unsecure movable equipment and tools \n        3.2.4   Open engine room plating \n \n4. Emergencies   \nMay include: \n4.1    Loss of propulsion or / and steerage \n4.2    Flooding of engine room \n4.3    Fire or explosion in engine room \n4.4    Breakdown and failure of refrigeration system \n4.5    Malfunction of fresh water generator \n4.6    Fuel oil, lubrication oil, steam and gas leaks \n4.7    Breakdown of generating set \n4.8    Pump failure  \n4.9    Overheating and over speeding of machinery which \nresult in  emergency trips \n \n5. Fuel system and oil \ntransfer operations \nMay include: \n5.1    Prepare for fuelling and transfer operations \n5.2    Procedures for connecting and disconnecting \nfuelling and transfer hoses \n5.3    Procedures relating to incidents that may arise \nduring fuelling and transferring operations \n5.4    Secure from fuelling and transfer operations \n5.5    Ability to correctly measure and report tank levels\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n44 \n \nVARIABLE \nRANGE \n6. Machinery and \nequipment used in \nfuel system and oil \ntransfer \nTypes of machinery and equipment may include: \n6.1    Pumps and pumping systems \n6.2    Auxiliary systems and controls, including \n6.2.1  Fuel and oil \n6.2.2  Waste management and pollution control \nsystems as per the MARPOL Convention \n6.2.3  Cargo pumps, tank washing machines and \nassociated systems \n \n7. Safety standards and \nregulatory \nrequirements \nMay include: \n7.1    Company standard \n7.2    MARPOL Regulations, \n7.3    National Regulations  \n7.4    Code of safe working practices \n \n8. Bilge and ballast \noperations \n \nBilge and ballast operations may be carried out: \n8.1    By day or night in both normal and emergency \nsituations \n8.2    Under any permissible conditions of weather while  \nunderway \n8.3    When bunkering \n8.4    During cargo operations \n \n9. Machinery and \nequipment used in \nbilge and ballast \noperations \nTypes of machinery may include:: \n9.1    Pumps and pumping systems \n9.2    Auxiliary systems and controls, including \n9.2.1  Bilge and ballast system, oily water separator \n9.2.2  Waste management and pollution control \nsystems as per the MARPOL Convention \n9.2.3  Cargo pumps, tank washing machines and \nassociated systems  \n \n10. Communication \nMay include but are not limited to: \n10.1    Portable VHF Radio \n10.2    Hand signals \n10.3.   Established means of communication \n \n11. Equipment, machinery \nand associated \nsystems \nEquipment, machinery and associated system may include \nbut are not limited to: \n11.1   Valves and pumps \n11.2   Hoists and lifting equipment \n11.3   Hatches, watertight doors, ports and related equipment \n11.4   Anti-pollution equipment \n \n12. Operational problems \nMay include: \n12.1    No power \n12.2    No suction \n12.3    Un able to deliver set pressure \n12.4    Faulty limit switch \n12.5    Block water tight doors\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n45"
        },
        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate :  \n1.1 \ncontribute to a safe engineering watch \n1.2 \ncontribute to the monitoring and controlling of an \nengine-room watch \n1.3 \ncontribute to fuelling and oil transfer operations \n1.4 \ncontribute to bilge and ballast operations \n1.5 \ncontribute to the operation of equipment and machinery \n1.6 \nensured adherence to national and international \nregulations, IMO Conventions and Codes \n1.7 \ncommunicated effectively with others in the course of \nwatchkeeping duties \n1.8 \nmaintained watchkeeping records     \n2. Required Knowledge  2.1 \nKnowledge on pertinent sections of STCW Code on \nSafe Engineering Watch \n2.2 \nDuties and responsibilities of an engine rating forming \npart of the engineering watch on both manned and UMS \nvessels with respect to safety of personnel and vessel, \nwhen taking over, keeping and handover a watch \n2.3 \nMain engine and its associated systems \n2.4 \nDiesel alternator systems \n2.5 \nTurbo alternator system  \n2.6 \nTerms used in machinery spaces and names of \nmachinery and equipment \n2.7 \nProcedures for the relief, maintenance and handover of \na watch \n2.8 \nInformation required to maintain a safe watch \n2.9 \nFunction of main propulsion and auxiliary machinery \n2.10 Function of fuel system and oil transfer operations \n2.11 Function of the bilge and ballast systems \n2.12 MARPOL Regulations \n3. Required Skills \n \n3.1 \nOperating and maintaining vessel’s main and auxiliary \nsystems including start up, normal running, shut down \nand emergency situations \n3.2 \nOperating and maintaining fuel system and oil transfer \noperations \n3.3 \nOperating and maintaining bilge and ballast system \n3.4 \nOperating main and auxiliary machinery monitoring \ndevices \n3.5 \nPerforming safe working practices for machinery and \nenclosed spaces \n3.6 \nIsolating main and auxiliary engine safely prior to work \ncommencing  \n3.7 \nWorking principles of fire prevention, detection and fire \nfighting \n3.8 \nUsing and operating anti-pollution equipment \n3.9 \nCommunication skills \n3.10 Maintaining records \n4. Resource \nImplications \n \nThe following resources should be provided : \n4.1 \nworkplace \n4.2 \ntools and equipment appropriate in maintaining \nwatchkeeping activities, fuel, oil transfer, bilge and \nballast operations, or simulator \n4.3 \nmaterials relevant to the activity and tasks  \n5. Methods of \nAssessment \n \nCompetency in this unit  must be assessed through : \n5.1 \nPractical demonstration and questioning of related  \nunderpinning  knowledge \n5.2 \nWritten examination \n5.3 \nPortfolio (e.g. approved in-service and training ship \nexperiences, etc.) \n6. Context of \nAssessment \n6.1    Competency may be assessed in simulated workplace \nsetting  or accredited assessment center",
