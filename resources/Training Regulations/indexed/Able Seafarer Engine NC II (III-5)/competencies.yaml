        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nOperated in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n1.6 \nReported outcomes \n \n2. Underpinning \nKnowledge and \nAttitude \n2.1 \nCommunication process \n2.2 \nTeam structure \n2.3 \nTeam roles \n2.4 \nGroup planning and decision making \n \n3. Underpinning Skills \n3.1 \nCommunicate appropriately, consistent with the culture of \nthe workplace \n \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n4.2 \nMaterials relevant to the proposed activity or tasks \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nObservation of the individual member in relation to the \nwork activities of the group \n5.2 \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3 \nCase studies and scenarios as a basis for discussion of \nissues and strategies in teamwork \n \n6. Context for \nAssessment \n6.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n8 \nUNIT OF COMPETENCY : \nPRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE \n:"
        },
        "source_text": "500311106 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Describe team role \nand scope \n1.1 \nThe role and objective of the team is identified from \navailable sources of information \n1.2 \nTeam parameters, reporting relationships and \nresponsibilities are identified from team discussions and \nappropriate external sources \n \n2. Identify own role \nand responsibility \nwithin team \n2.1 \nIndividual role and responsibilities within the team \nenvironment are identified \n2.2 \nRoles and responsibility of other team members are \nidentified and recognized \n2.3 \nReporting relationships within team and external to team \nare identified \n \n3. Work as a team \nmember \n3.1 \nEffective and appropriate forms of communications used \nand interactions undertaken with team members who \ncontribute to known team activities and objectives \n3.2 \nEffective and appropriate contributions made to \ncomplement team activities and objectives, based on \nindividual skills and competencies and workplace \ncontext \n3.3 \nObserved protocols in reporting using standard operating \nprocedures \n3.4 \nContribute to the development of team work plans based \non an understanding of team’s role and objectives and \nindividual competencies of the members.\n\n--- PDF PAGE 10 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n6 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Role and objective of \nteam \n1.1 \nWork activities in a team environment with enterprise \nor specific sector \n1.2 \nLimited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a \nteam environment \n \n2. Sources of information \n2.1 \nStandard operating and/or other workplace \nprocedures \n2.2 \nJob procedures \n2.3 \nMachine/equipment manufacturer’s specifications and \ninstructions \n2.4 \nOrganizational or external personnel \n2.5 \nClient/supplier instructions \n2.6 \nQuality standards \n2.7 \nOHS and environmental standards \n \n3. Workplace context \n3.1 \nWork procedures and practices \n3.2 \nConditions of work environments \n3.3 \nLegislation and industrial agreements \n3.4 \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5 \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 11 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n7 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nOperated in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n1.6 \nReported outcomes \n \n2. Underpinning \nKnowledge and \nAttitude \n2.1 \nCommunication process \n2.2 \nTeam structure \n2.3 \nTeam roles \n2.4 \nGroup planning and decision making \n \n3. Underpinning Skills \n3.1 \nCommunicate appropriately, consistent with the culture of \nthe workplace \n \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n4.2 \nMaterials relevant to the proposed activity or tasks \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nObservation of the individual member in relation to the \nwork activities of the group \n5.2 \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3 \nCase studies and scenarios as a basis for discussion of \nissues and strategies in teamwork \n \n6. Context for \nAssessment \n6.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n8 \nUNIT OF COMPETENCY : \nPRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE \n:"
