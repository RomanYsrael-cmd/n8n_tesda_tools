        "source_title": "PERFORM MAINTENANCE AND REPAIR AT THE SUPPORT LEVEL",
        "source_text": "--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n50 \nUNIT OF COMPETENCY \n: \nPERFORM MAINTENANCE AND REPAIR AT THE \nSUPPORT LEVEL \n \nUNIT CODE \n: \nMTM816316 \n \nUNIT DESCRIPTOR \n: \nThis unit involves the skills and knowledge required in \nthe routine maintenance and repair procedures of the \nshipboard equipment and machinery. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Contribute in routine \nplanned \nmaintenance of \nequipment and \nmachinery \n \n1.1 \nCleaning materials and equipment are identified and \nselected in preparation for routine maintenance. \n1.2 \nMaintenance arrangements for equipment and \nmachinery on the vessel are  carried out in accordance \nwith technical, safety and procedural specifications. \n1.3 \nOperational problems or faults with the vessel’s \nequipment and machinery are identified and reported to \nthe relevant personnel. \n1.4 \nRoutine lubrication and other preventive maintenance of \nequipment and machinery are carried out in accordance \nwith manufacturer’s instructions. \n1.5 \nPreventive and remedial maintenance carried out on \nequipment and machinery spaces are communicated to \nthe engine officer for record keeping. \n \n2. Contribute in repairs \nof equipment and \nmachinery \n \n2.1 \nCorrect shut down of malfunctioning/faulty machinery or \nequipment and disassembly procedure are carried out \nwith the supervision of an engineering officer. \n2.2 \nDamaged or faulty components are repaired / replaced \nwith the supervision of an engineering officer. \n2.3 \nRepaired machinery is re-assembled and tested in \naccordance with manufacturer’s instructions and the \nsupervision of engineering officer. \n2.4 \nPerformance of repaired machinery and associated \nsafety devices, control systems and alarms is tested in \naccordance with manufacturer’s instructions and in \nconsultation with relevant personnel.  \n2.5 \nReplaced damage parts and consumable are disposed \nin accordance with the International regulations. \n2.6 \nHousekeeping is observed at all times in engine room. \n \n3. Carry out stores \noperations \n3.1 \nPerformance of stowage of dangerous, hazardous and \nharmful stores complied with established safety \npractices. \n3.2 \nSafe handling of stores is undertaken following \nestablished standard procedures. \n3.3 \nSecuring of stores is performed, when necessary or in \nthe event of unforeseen circumstances. \n3.4 \nCommunications made within the operator’s area of \nresponsibility are consistently successful.\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n51 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Cleaning materials \nand equipment \nMay include: \n1.1 Materials  \n      1.1.1  Detergents \n      1.1.2  Cleaning Rags \n      1.1.3  Mops \n      1.1.4  Chemicals \n      1.1.5  Degreaser \n      1.1.6  Metal Polish \n      1.1.7  Wire brush \n      1.1.8  Paint brush \n      1.1.9  Oil pan \n1.2 Equipment  \n      1.2.1 Spray equipment \n      1.2.2 Vacuum cleaner \n      1.2.3 Polisher \n      1.2.4 Grinder \n      1.2.5 Jet chisel \n      1.2.6 Greaser  \n \n2.  Maintenance \nMay include: \n2.1  Maintenance \n2.1.1 Planned maintenance systems \n2.1.2 Operational checks \n2.1.3 Recording \n2.1.4 Reporting \n2.1.5 Isolation \n2.1.6 Cleanliness \n2.1.7 Use of correct tools, parts, and lubricants \n2.1.8 Worksite preparation \n2.2  Maintenance tools and equipment  \n2.2.1 Hand and power tools \n2.2.2 Greasing and lubrication tools \n2.2.3 Protective clothing and equipment such as: \n2.2.4 Eye and ear protection \n2.2.5 Safety boots and helmet \n2.2.6 Dust and fume masks \n \n3.  Tested \nMay include: \n3.1 \nMeters and gauges, oxygen meter and gas detectors \n3.2 \nComputer displays of performance parameters \n3.3 \nHand tools, such as spanners, wrenches, screwdrivers, \nhacksaws, etc. \n3.4 \nGreasing and lubrication tools \n3.5 \nElectric power tools, such as grinders, lathes, drills, etc. \n3.6 \nPneumatic power tools, such as grinders, sanders, drills, \netc. \n3.7 \nWelding equipment \n3.8 \nBlock and tackle and portable and manual lifting \nequipment and hydraulic jacks \n3.9 \nMaterial safety data sheets \n3.10 Protective clothing and equipment such as: \n3.10.1 Eye and ear protection \n3.10.2 Safety boots and helmet \n3.10.3 Dust and fume masks \n3.10.4 Boiler suit/overall\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n52 \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nused and carried out planned routine maintenance of \nequipment and machinery \n1.2 \nidentified typical problems related to the equipment and \nmachinery operation and maintenance and undertook \nappropriate action in conjunction with other vessel \npersonnel \n1.3 \nensured the exercise of all required safety, environmental \nand hazard control precautions and procedures during \nequipment and machinery operation and maintenance \n1.4 \ncarried out stores operations \n1.5 \ncommunicated effectively with others during the operation \nand maintenance of equipment and machinery  \n \n2.  Required \nKnowledge \n2.1 \nSections of the relevant maritime regulations \n2.2 \nRelevant OH&S and pollution control legislation and codes of \npractice \n2.3 \nPrinciple design and safety features and component parts of \nequipment and machinery \n2.4 \nProcedures for operating and carrying out planned \nmaintenance of equipment and machinery \n2.5 \nProcedures for isolating defective equipment and machinery \nor components \n2.6 \nRepair and/or replacement procedures for equipment and \nmachinery and components \n2.7 \nPrinciples and procedures of machinery lubrication as they \nrelate to equipment and machinery on a vessel, including: \n2.7.1 \nApplication of grease \n2.7.2 \nChanging of gearbox lubricating oil \n2.7.3 \nLubrication of a steel wire rope is demonstrated \n2.7.4 \nThe applications and use of \"denso\" tape are \nidentified  \n2.7.5 \nThe changing of lubricating and hydraulic oil \n2.8 \nProcedures for the replacement of flexible hoses in \nequipment and machinery \n2.9 \nProcedures for using hand and power tools for typical \nmaintenance operations on equipment and machinery \n2.10 Maintenance and repair hazards and problems and \nappropriate preventative and remedial action and solutions \n2.11 Safety, environmental and hazard control precautions and \nprocedures relevant to the operation and maintenance of \nequipment and machinery \n2.12 Safe procedures for handling heavy machinery and \ncomponent parts during maintenance of equipment and \nmachinery \n2.13 Knowledge and ability to read and interpret Material Safety \nData Sheets \n2.14 Knowledge and ability to read and interpret operational \nmanuals and specifications. \n2.15 Maritime communication techniques needed during the use \nand maintenance of equipment and machinery on a vessel \n2.16 Maintenance records that must be maintained on a \ncommercial vessel \n2.17 Procedures for stowage and securing of stores\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised  June 26, 2013 \n53 \n \n3.  Required Skills \n3.1 \nUsing and carrying out planned routine maintenance of \nequipment and machinery \n3.2 \nIdentifying the operational and maintenance problems \nand determining appropriate courses of action \n3.3 \nEnsuring the application of safety precautions relevant \nto use and maintenance of equipment and machinery \n3.4 \nApplying environmental protection procedures when \ncarrying out maintenance operations \n3.5 \nHandling of dangerous, hazardous and harmful stores \n3.6 \nAction taken promptly to report and/or rectify defective \nor malfunctioning equipment and machinery, and \ncomponents in accordance with manufacturer’s \ninstructions and established procedures \n3.7 \nWork is completed systematically with required \nattention to detail \n \n4. Resource Implications The following resources must be provided : \n4.1 \nworkplace \n4.2 \ntools and equipment appropriate in equipment and \nmachinery operation  \n4.3 \nmaterials relevant to the activity and tasks  \n \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through : \n5.1 \nPractical demonstration and questioning of related  \nunderpinning  knowledge \n5.2 \nWritten examination \n5.3 \nPortfolio (e.g. approved in-service and training ship \nexperiences, etc.) \n  \n6. Context of \nAssessment \n6.1     Competency may be assessed in simulated workplace \nsetting or accredited assessment center\n",
