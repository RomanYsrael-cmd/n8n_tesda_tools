        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 \nCompleted trainings and career opportunities which \nare based on the requirements of the industries \n1.4 \nAcquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n \n2. Underpinning \nKnowledge \n2.1 \nWork values and ethics (Code of Conduct, Code of \nEthics, etc.) \n2.2 \nCompany policies \n2.3 \nCompany operations, procedures and standards \n2.4 \nFundamental rights at work including gender \nsensitivity \n2.5 \nPersonal hygiene practices \n \n3. Underpinning Skills \n3.1 \nAppropriate practice of personal hygiene \n3.2 \nIntra and Interpersonal skills \n3.3 \nCommunication skills \n \n4. Resource Implications \nThe following resources MUST be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nCase studies/scenarios \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nPortfolio Assessment \n5.2 \nInterview \n5.3 \nSimulation/Role-plays \n5.4 \nObservation \n5.5 \nThird Party Reports \n5.6 \nExams and Tests \n \n6. Context of Assessment \n6.1 \nCompetency may be assessed in the work place or in \na simulated work place setting\n\n--- PDF PAGE 15 ---\nTR - Able Seafarer Engine NC II (STCW Regulation III/5) \nRevised June 26, 2013 \n11 \n \nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY \nPROCEDURES \n \nUNIT CODE :"
