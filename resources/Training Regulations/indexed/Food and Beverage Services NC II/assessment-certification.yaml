ems in managing, and maintaining information Manage implementation of OSH programs in the workplace Manage implementation of environmental program in the workplace Develop and sustain a high- performing enterprise COMPETENCY MAP - TOURISM Sector (Hotel and Restaurant) --- PDF PAGE 120 --- FOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 116 Develop and update industry knowledge Observe workplace hygiene procedures Perform computer operations Perform workplace and safety practices Provide effective customer service Receive and resolve customer complaints Work cooperatively in a general administration environment Maintain quality customer/ guest service Roster staff Control and Order stock* Prepare and deliver training sessions Plan, conduct and evaluate staff performance assessment Maintain hospitality industry knowledge Perform child protection duties relevant to the tourism industry Develop and supervise operational approaches Manage quality customer service Manage finances within a budget Plan and implement a series of training events Use the assessment system for training outcomes --- PDF PAGE 121 --- FOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 117 Receive and resolve customer complaints Work cooperatively in a general administration environment Maintain quality customer/ guest service Roster staff Control and Order stock* Prepare and deliver training sessions Plan, conduct and evaluate staff performance assessment Monitor and evaluate the effectiveness of training outcome Maintain hospitality industry knowledge Perform child protection duties relevant to the tourism industry Develop and supervise operational approaches Manage quality customer service Manage finances within a budget Plan and implement a series of training events Use the assessment system for training outcomes Evaluate the effectiveness of assessment system Develop and update tourism industry knowledge Develop protective environments for children in tourism destinations Establish and maintain a business relationship Gather and present product information Maintain quality customer/ guest service Manage and resolve conflict situations Manage financial performance within a budget Prepare dining room/restaurant area service Provide food and beverage services to guests Close dining room/restaurant area after service Provide room service --- PDF PAGE 122 --- FOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 118 GLOSSARY OF TERMS: Ambiance general mood or atmosphere characterized by lighting, music, design and symmetry of furniture Biodegradable waste any product that can be easily broken down naturally by water, oxygen, the sun's rays, radiation, or microorganisms. Bussing Term used for clearing and resetting tables after guests have left. In busier restaurants, this is done by the busboy also called a busser. Condiments these are added to food to enhance flavor of dishes Decoy System a system of stacking similar sized and shaped items together. It is designed to help efficiently sort soiled dishes before they are loaded into the dishwasher Docket System a kitchen order ticket or bill control system used in food and beverage enterprises to document and track food orders. It contains details related to the table number, items ordered, and their quantity. Empathy the ability to understand and share the feelings of another person Enterprise a business or company; may refer to a hotel, restaurant, bar, or any related food and beverage establishment. Ergonomics the study of people in their working environment. The use of ergonomic principles eliminates discomfort and risk of injury in the workplace, thus, increasing efficiency and productivity. Handover an act of giving something or passing on of information to another’s possession or control; the transfer of responsibility and accountability. This is synonymous to “Endorsement” Intoxicated a state wherein a person is affected by alcohol where physical and mental control is diminished Liaise the act of coordinating to relevant persons or departments and establishing a good working relationship with them Menu consist of list of food and beverage offerings in a restaurant to help diners make ordering decisions Mise en place (MEEZ ahn plahs) a French term that means “to put in place”. It describes the advance preparation before the doors open for business. In service, this refers to setting up everything that is needed before the service starts for a smooth flow of the operation. --- PDF PAGE 123 --- FOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 119 Non-Biodegradable Waste which cannot be decomposed or degraded by the biological process Point of sale (POS) the hardware and software that enables the business to operate more efficiently and effectively. The POS system in the restaurant can be used for taking orders, inventory management, menu optimization and payment reporting and processing. Replenish the process of filling-up or restocking items Reservations an arrangement to secure a dining space/table ahead of time in a restaurant or dining facility 3 bucket system This is a procedure for washing, rinsing, and sanitizing where a different bucket and sponge or mop is used for each task Upsell a sales technique used to increase or upgrade purchases of guests Waiter Station Also known as the service station; the waiter's station is a table or a drawer set up in a restaurant that contains the necessary items to assist the staff in the performance of their duties. --- PDF PAGE 124 --- FOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 120 REFERENCES:"
