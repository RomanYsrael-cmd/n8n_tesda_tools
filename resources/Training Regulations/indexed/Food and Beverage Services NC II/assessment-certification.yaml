  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of FOOD AND BEVERAGE SERVICES NC II, the\ncandidate must demonstrate competence in all units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1 Candidates and/or graduates of tourism and hospitality degree.\n4.1.3.2 Graduates of the Food and Beverage Services NC II\n (consisting of 229 lecture hours + 114.5 hours of supervised industry\n training);\n4.1.3.3\nK-12 graduates of Home Economics Strand with FBS NC II\n4.1.3.4\nIndustry practitioner with knowledge in professional FBS for at least\ntwo (2) years.\n4.1.3.5\nGraduates of formal, non-formal and informal including enterprise-based\ntraining programs\n4.1.3.3\nExperienced workers (wage employed or self-employed)\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences with at\nleast three (3) years of food and beverage services experience within the last five\n(5) years may apply for recognition in this Qualification through Portfolio\nAssessment.\n\n4.1.5 Holders of National Certificate (NC) or Certificates of Competency (COC) in Food and\nBeverage Services NC II are required to undergo re-assessment under the amended\nTraining Regulations (TRs), upon expiration of their Certificates.\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)”.\n\n--- PDF PAGE 118 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023\n114\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 119 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 115\n\n BASIC COMPETENCIES\n\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and health\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\n\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse information\nsystematically\nEvaluate\noccupational\nsafety and health\nwork practices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nUtilize a\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher-\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice of\nsocial justice\nin the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate usage\nof information\nLead in\nimprovement of\nOccupational\nSafety and Health\n(OSH) programs,\npolicies and\nprocedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and\nadjust problem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof environmental\nprogram in the\nworkplace\nD