      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of FOOD AND BEVERAGE SERVICES NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 Any of the following are qualified to apply for assessment and certification: 4.1.3.1 Candidates and/or graduates of tourism and hospitality degree. 4.1.3.2 Graduates of the Food and Beverage Services NC II (consisting of 229 lecture hours + 114.5 hours of supervised industry training); 4.1.3.3 K-12 graduates of Home Economics Strand with FBS NC II 4.1.3.4 Industry practitioner with knowledge in professional FBS for at least two (2) years. 4.1.3.5 Graduates of formal, non-formal and informal including enterprise-based training programs 4.1.3.3 Experienced workers (wage employed or self-employed) 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least three (3) years of food and beverage services experience within the last five (5) years may apply for recognition in this Qualification through Portfolio Assessment. 4.1.5 Holders of National Certificate (NC) or Certificates of Competency (COC) in Food and Beverage Services NC II are required to undergo re-assessment under the amended Training Regulations (TRs), upon expiration of their Certificates. 4.1.6 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”. FOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023"
    },
