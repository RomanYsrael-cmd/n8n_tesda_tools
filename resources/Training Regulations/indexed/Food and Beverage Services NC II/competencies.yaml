        "source_text": "TRS311205\n\nUNIT DESCRIPTOR\n :\nThis unit of competency deals with the knowledge, skills and\nattitudes in providing effective customer service. It includes\ngreeting customer, identifying customer needs, delivering\nservice to customer, handling queries through telephone, fax\nmachine, internet and email and handling complaints, evaluation\nand recommendation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Greet customer\n1.1 Customers are greeted\nin line with enterprise\nprocedure\n1.2 Verbal and non-verbal\ncommunications are\nappropriate to the given\nsituation\n1.3 Non-verbal\ncommunication of\ncustomer is observed\nresponding to customer\n1.4 Sensitivity to cultural\nand social differences\nis demonstrated\n1.1 Communication\n 1.1.1 Interactive\ncommunication with\nothers\n 1.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n1.2 Attitude\n 1.2.1 Attentive,\npatient and cordial\n 1.2.2 Eye-to-eye\n contact\n 1.2.3 Maintain\n teamwork and\n cooperation\n1.3 Theory\n 1.3.1 Interview\n techniques\n 1.3.2 Communication\nprocess\n 1.3.3 Communication\n barriers\n1.1 Effective\ncommunication\nskills\n1.2 Non-verbal\ncommunication\n- body\nlanguage\n1.3 Good time\nmanagement\n1.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n\n2. Identify\ncustomer needs\n2.1 Appropriate\ninterpersonal skills\nare used to ensure that\ncustomer needs are\naccurately identified\n2.2 Customer needs are\nassessed for urgency\nso that priority for\nservice delivery can be\nidentified\n2.3 Customers are provided\nwith information\n2.1 Communication\n2.1.1 Interactive\ncommunication with\nothers\n2.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n2.2 Safety Practices\n2.2.1 Safe work\npractices\n2.2.2 Personal\nhygiene\n2.3 Attitude\n2.3.1 Attentive, patient and\ncordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork\nand cooperation\n2.1 Effective\ncommunication\nskills\n2.2 Non-verbal\ncommunication\n- body\nlanguage\n2.3 Good time\nmanagement\n2.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n\n--- PDF PAGE 60 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 56\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n2.4 Personal limitation in\naddressing customer\nneeds is identified and\nwhere appropriate,\nassistance is sought\nfrom supervisor\n\n2.4 Theory\n 2.4.1 Selling/upselling\n techniques\n 2.4.2 Interview\ntechniques\n 2.4.3 Conflict resolution\n 2.4.4 Communication\n process\n 2.4.5 Communication\n barriers\n\n3. Deliver service\nto customer\n3.1 Customer needs are\npromptly attended to in\nline with enterprise\nprocedure\n3.2 Appropriate rapport is\nmaintained with\ncustomer to enable\nhigh quality service\ndelivery\n3.3 Opportunity to enhance\nthe quality of service\nand products are taken\nwherever possible\n\n3.1 Communication\n 3.1. Interactive\n communication\nwith others\n 3.1.2 Interpersonal\nskills/social\ngraces with\n sincerity\n3.2 Safety Practices\n 3.2.1 Safe work\n practices\n 3.2.2 Personal hygiene\n3.3 Attitude\n 3.3.1 Attentive, patient\n and cordial\n 3.3.2 Eye-to-eye\n contact\n 3.3.3 Maintain\n teamwork\n and cooperation\n3.4 Theory\n 3.4.1 Selling/upselling\n techniques\n 3.4.2 Interview\n techniques\n 3.4.3 Conflict\nresolution\n 3.4.4 Communication\n process\n 3.4.5 Communication\n Barriers\n\n3.1 Effective\ncommunication\nskills\n3.2 Non-verbal\ncommunication\n- body\nlanguage\n3.3 Good time\nmanagement\n3.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n\n--- PDF PAGE 61 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 57\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Handle