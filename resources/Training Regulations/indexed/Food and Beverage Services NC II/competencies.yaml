  "source_section_text": "Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1 Candidates and/or graduates of tourism and hospitality degree.\n4.1.3.2 Graduates of the Food and Beverage Services NC II\n (consisting of 229 lecture hours + 114.5 hours of supervised industry\n training);\n4.1.3.3\nK-12 graduates of Home Economics Strand with FBS NC II\n4.1.3.4\nIndustry practitioner with knowledge in professional FBS for at least\ntwo (2) years.\n4.1.3.5\nGraduates of formal, non-formal and informal including enterprise-based\ntraining programs\n4.1.3.3\nExperienced workers (wage employed or self-employed)\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences with at\nleast three (3) years of food and beverage services experience within the last five\n(5) years may apply for recognition in this Qualification through Portfolio\nAssessment.\n\n4.1.5 Holders of National Certificate (NC) or Certificates of Competency (COC) in Food and\nBeverage Services NC II are required to undergo re-assessment under the amended\nTraining Regulations (TRs), upon expiration of their Certificates.\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)”.\n\n--- PDF PAGE 118 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023\n114\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 119 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 115\n\n BASIC COMPETENCIES\n\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and health\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\n\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse information\nsystematically\nEvaluate\noccupational\nsafety and health\nwork practices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nUtilize a\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher-\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice of\nsocial justice\nin the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate usage\nof information\nLead in\nimprovement of\nOccupational\nSafety and Health\n(OSH) programs,\npolicies and\nprocedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and\nadjust problem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof environmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\n\nCOMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\n FOOD AND BEVERAGE SERVICES NC II\n\n--- PDF PAGE 120 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 116\n\n COMMON COMPETENCIES\n\nDevelop and\nupdate\nindustry\nknowledge\nObserve\nworkplace\nhygiene\nprocedures\n\nPerform\ncomputer\noperations\n\nPerform\nworkplace\nand\nsafety\npractices\n\nProvide\neffective\ncustomer\nservice\n\nReceive and\nresolve\ncustomer\ncomplaints\nWork\ncooperatively in a\ngeneral\nadministration\nenvironment\nMaintain\nquality\ncustomer/\nguest service\nRoster staff\nControl and\nOrder stock*\nPrepare and\ndeliver\ntraining\nsessions\nPlan, conduct\nand evaluate\nstaff\nperformance\nassessment\nMaintain\nhospitality\nindustry\nknowledge\nPerform child\nprotection\nduties\nrelevant to\nthe tourism\nindustry\nDevelop and\nsupervise\noperational\napproaches\nManage quality\ncustomer service\nManage\nfinances within\na budget\nPlan and\nimplement a\nseries of training\nevents\nUse the\nassessment\nsystem for\ntraining\noutcomes\n\n--- PDF PAGE 121 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 117\n\nCORE COMPETENCIES\n\nReceive and\nresolve customer\ncomplaints\nWork\ncooperatively in a\ngeneral\nadministration\nenvironment\nMaintain quality\ncustomer/ guest\nservice\nRoster staff\nControl and\nOrder stock*\nPrepare and\ndeliver training\nsessions\nPlan, conduct\nand evaluate staff\nperformance\nassessment\nMonitor and\nevaluate the\neffectiveness of\ntraining outcome\nMaintain\nhospitality\nindustry\nknowledge\nPerform child\nprotection duties\nrelevant to the\ntourism industry\nDevelop and\nsupervise\noperational\napproaches\nManage quality\ncustomer service\nManage finances\nwithin a budget\nPlan and\nimplement a\nseries of training\nevents\nUse the\nassessment\nsystem for\ntraining outcomes\nEvaluate the\neffectiveness of\nassessment system\nDevelop and\nupdate tourism\nindustry\nknowledge\nDevelop\nprotective\nenvironments for\nchildren in\ntourism\ndestinations\nEstablish and\nmaintain a\nbusiness\nrelationship\nGather and\npresent product\ninformation\nMaintain quality\ncustomer/ guest\nservice\nManage and\nresolve conflict\nsituations\nManage financial\nperformance\nwithin a budget\n\nPrepare dining\nroom/restaurant\narea service\nProvide food\nand beverage\nservices to\nguests\nClose dining\nroom/restaurant\narea after\nservice\nProvide room\nservice\n\n--- PDF PAGE 122 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023\n118\n\nGLOSSARY OF TERMS:\n\nAmbiance\n\ngeneral mood or atmosphere characterized by lighting, music,\ndesign and symmetry of furniture\n\nBiodegradable waste\nany product that can be easily broken down naturally by water,\noxygen, the sun's rays, radiation, or microorganisms.\n\nBussing\n Term used for clearing and resetting tables after guests have\nleft. In busier restaurants, this is done by the busboy also\ncalled a busser.\n\nCondiments\n\nthese are added to food to enhance flavor of dishes\n\nDecoy System\na system of stacking similar sized and shaped items together.\n\nIt is designed to help efficiently sort soiled dishes before they\n\nare loaded into the dishwasher\n\nDocket System\na kitchen order ticket or bill control system used in food and\n\nbeverage enterprises to document and track food orders.\n\nIt contains details related to the table number, items ordered,\n\nand their quantity.\n\nEmpathy\n\nthe ability to understand and share the feelings of another\nperson\n\nEnterprise\n a business or company; may refer to a hotel, restaurant, bar, or\nany related food and beverage establishment.\n\nErgonomics\n the study of people in their working environment. The use of\nergonomic principles eliminates discomfort and risk of injury in\nthe workplace, thus, increasing efficiency and productivity.\n\nHandover\n an act of giving something or passing on of information to\nanother’s possession or control; the transfer of responsibility\nand accountability. This is synonymous to “Endorsement”\n\nIntoxicated\n\na state wherein a person is affected by alcohol where physical\nand mental control is diminished\n\nLiaise\n\nthe act of coordinating to relevant persons or departments and\nestablishing a good working relationship with them\n\nMenu\n\nconsist of list of food and beverage offerings in a restaurant to\nhelp diners make ordering decisions\n\nMise en place (MEEZ ahn plahs) a French term that means “to put in place”. It describes\nthe advance preparation before the doors open for business. In\nservice, this refers to setting up everything that is needed\nbefore the service starts for a smooth flow of the operation.\n\n--- PDF PAGE 123 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023\n119\n\nNon-Biodegradable\n Waste which cannot be decomposed or degraded by the\nbiological process\n\nPoint of sale (POS)\n the hardware and software that enables the business to\noperate more efficiently and effectively. The POS system in\nthe restaurant can be used for taking orders, inventory\nmanagement, menu optimization and payment reporting and\nprocessing.\n\nReplenish\n\nthe process of filling-up or restocking items\n\nReservations\n\nan arrangement to secure a dining space/table ahead of time\nin a restaurant or dining facility\n\n3 bucket system\nThis is a procedure for washing, rinsing, and sanitizing\n\nwhere a different bucket and sponge or mop is used for\n\neach task\n\nUpsell\n\na sales technique used to increase or upgrade purchases of\nguests\n\nWaiter Station\n\nAlso known as the service station; the waiter's station is a\ntable or a drawer set up in a restaurant that contains the\nnecessary items to assist the staff in the performance of their\nduties.\n\n--- PDF PAGE 124 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023\n120\n\nREFERENCES:\n\n1) https://www.advantagechemical.com/resources/everything-warewashing\n2) https://www.coursehero.com/file/p37rcib5/The-following-are-the-four-main-types-of-\ndocket-system-used-in-most-hotel/\n3) https://www.advantagechemical.com/resources/everything-warewashing\n4) https://www.thebalancesmb.com/glossary-of-terms-2888526\n5) ASEAN Tool box\n\n--- PDF PAGE 125 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 121\n\nACKNOWLEDGEMENTS\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\n1. DR. LILIBETH C. ARAGON\n\nDean\nCollege of International Tourism and Hospitality\nManagement- LPU Manila\nASEAN Master Trainer\n\n2. RICHIE O. CRUZ\nBar Consultant/Trainer/Content Creator\nPinoytender Management Consultancy\n\n3. MARIA SUSANNA F. EDILO\n\nConsultant/Trainer\nBRYDGE Philippines, Inc.\nASEAN Master Assessor\n\n4. MARIO D. GATMAITAN\nStrategic Director of Operation\nTourism Site Management\nRajah Travel Operations\n\n5. DR. RHEA CORINA B. MEJIA\nDean\nCenter\nfor\nTechnical\nEducation/Assessment\nCenter Manager - LPU Batangas\nASEAN Master Trainer\n\n6. DR. RYAN L. MEJIA\nDean\nCollege of International Tourism and Hospitality\nManagement - LPU Batangas\nExpert-Restaurant\nService,\nWorld\nSkills\nCompetition\nASEAN Master Assessor\n\n--- PDF PAGE 126 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 122\nThe Participants in the Validation of this Training Regulations\n\nNAME\nCOMPANY/INDUSTRY\n1.\nRachelle D. Basilio\nDirector\nCenter for Technical Education\nLPU Manila\n2.\nShella D. Bawar\nTVET Trainer\nTESDA Women’s Center\n3.\nNoemi Teresa J. Cancio\nIndependent Consultant\nASEAN Master Trainer\n4.\nShiela Dawang\nAssistant Professor\nLyceum of the Philippines University-\nManila\nASEAN Master Trainer\n\n5.\nGener J. Desquitado\nFreelance\nTrainer/Assessor\n6.\nNandy M. Gaya\nDean\nColegio de Sta Teresa de Avila\n\n7.\nEanglebert D. Guina\nFounder/CEO\nWine Head Sommelier Philippines\n8.\nWilfredo P. Jadoc\nSenior Bartender\nRCCL Crew Management Inc.\n9.\nMaureen Perez\nProgram Chair\nLyceum of the Philippines University-\nLaguna\nASEAN Master Trainer\n\n10.\nRamil M. Quiñonez\nFaculty, Industry Practitioner\nUniversity of Santo Tomas\n11.\nZoilo Caparos\nAssistant Vice President for Training\nThe Bistro Group\n\n--- PDF PAGE 127 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 123\n\nTourism Industry Board Foundation, Inc. (TIBFI)\n\nThe TESDA Board Members and Secretariat\n\nThe MANAGEMENT a