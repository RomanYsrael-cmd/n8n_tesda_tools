          "source_text": "1. Critical aspects of\nCompetency\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studies data/information\n\nThese aspects may be best assessed using a range\nof scenarios what ifs as a stimulus with a walk-\nthrough forming part of the response. These\nassessment activities should include a range of\nproblems, including new, unusual and improbable\nsituations that may have happened.\n2. Resource Implications\nSpecific resources for assessment\n2.1. Evidence of competent performance should be\nobtained by observing an individual in an\ninformation management role within the\nworkplace or operational or simulated\nenvironment.\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1. Written Test\n3.2. Interview\n3.3. Portfolio\n\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment\nof other relevant units of competency. Assessment\nwill occur over a range of situations, which will\ninclude disruptions to normal, smooth operation.\nSimulation may be required to allow for timely\nassessment of parts of this unit of competency.\nSimulation should be based on the actual workplace\nand will include walk through of the relevant\ncompetency components.\n4. Context for Assessment\n4.1. In all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 29 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 25\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND HEALTH\nPOLICIES AND PROCEDURES\n\nUNIT CODE\n :"
