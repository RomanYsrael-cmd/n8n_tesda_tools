m service\npreparation\nMay include:\n5.1 Positioning of trolley, trays and equipment\n5.2 Arranging items, setting up tableware and condiments\n5.3 Ensuring guest safety, comfort and satisfaction\n\n6. Room service account\nprocess\nMay include:\n6.1 Determining guest’s preference for account payment\n6.2 For charge accounts, guests are asked to sign the bills\n6.3 Forwarding the bill to relevant section or person\n6.4 Confirming details of account where required\n\n--- PDF PAGE 85 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 81\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1\nTook, retrieved and processed room service\norders properly\n1.2\nSet up trays and trolleys\n1.3\nPresented and served room service orders\n1.4\nPresented and processed account.\n2. Resource implications\nThe following resources should be provided:\n2.1\nFood and beverage room service supplies and\n equipment\n2.2\nRoom service menu\n2.3\nRoom service tableware and appointments\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Oral Questioning\n3.3 Portfolio\n4. Context for assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center\n\n--- PDF PAGE 86 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 82"
