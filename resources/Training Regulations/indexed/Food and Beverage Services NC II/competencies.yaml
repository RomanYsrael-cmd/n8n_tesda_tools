          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Brought soiled dishes to the stewarding dishwashing area\nusing the decoy system.\n1.2 Demonstrated knowledge and skills on onsite segregation\nof biodegradable and non biodegradable wastes.\n1.3 Conducted handover for the incoming shift.\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Complete tableware (dinnerware, glassware, flatware,\nhollowware) as specified in list of the tools and equipment\nof this Training Regulations\n2.2 Tables and chairs for a restaurant simulation setting\n2.3 Cleaning tools and equipment\n2.4 Waste bins, trays, basin or similar repository for waste\nsegregation\n2.5 Logbook, record book, boards, or the like for endorsement\nentries\n3. Methods of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Oral Questioning\n3.3 Portfolio\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 81 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 77\n\nUNIT OF COMPETENCY :\nPROVIDE ROOM SERVICE\n\nUNIT CODE\n:"
        },
        "source_text": "TRS513312\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nin the closing of the dining room/restaurant area after\nservice operations when all the guests have left. This unit\nfocuses on tasks in maintaining a clean and orderly\nenterprise at the end of each shift so that the dining\nroom/restaurant will be ready for the next shift’s/day’s\nopening. It involves closing duties of cleaning and tidying\nareas; maintaining supplies and equipment; and reporting\nand endorsing for the next shift.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Clean and tidy\nfood and\nbeverage\nareas\n\n1.1. Cleaning\ntechniques are\napplied to food\nservice areas.\n1.2 Tables, chairs, and\nfurniture are\norganized and\nsanitized in\naccordance with\nenterprise\nstandards.\n1.3 Soiled dishes are\nbrought to the\nstewarding\ndishwashing area\nusing the decoy\nsystem.\n1.4 Onsite segregation\nof biodegradable\nand non-\nbiodegradable\nwaste is performed\nin accordance with\nenterprise\nstandards.\n1.1 Communication\n1.2. Chemical solution\nand its usage\n1.3 Waste segregation\ntechniques\n1.4 Cleaning\ntechniques\n1.5 3 Bucket system\n1.6 Handling of\nhazardous waste\n1.7 DOH guidelines on\nsafety and health\n1.8 DOLE policies on\nOHS as applicable\n1.9 IATF/LGU current\nguidelines\n\n1.1 Communication skills\n1.2 Time management skills\n1.3 Application of health and\nsafety protocols and\nprocedures\n1.4 Coordination skills\n1.5 Time management skills\n1.6 Analytical skills\n1.7 Use of cleaning and\nsanitizing chemicals\n\n--- PDF PAGE 78 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 74\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Maintain\nrestaurant\nsupplies and\nequipment\n\n2.1 Supplies are stored,\nstocked and\nreplenished for the\nnext shift.\n2.2. Equipment are\ncleaned and stored\nin accordance with\nhygiene regulations\nand enterprise\nprocedures.\n2.3 Electrical equipment\nare turned off where\nappropriate.\n\n2.1 Communication\n2.2. Equipment\noperation\ninstructions\ntechniques\n2.3 Safe storage of\nequipment\n2.4 DOH guidelines on\nsafety and health\n2.5 DOLE policies on\nOHS as\napplicable\n2.6 IATF/LGU current\nguidelines\n\n2.1 Communication skills\n2.2 Application of health and\nsafety protocols and\nprocedures\n2.3 Coordination skills\n2.4 Time management skills\n2.5 Analytical skills\n2.6. Decision making skills\n\n3. Report and\nendorse for the\nnext shift\n\n3.1 Equipment and\nitems requiring\nmaintenance are\nidentified and\nreported to the\nspecific restaurant\npersonnel or\ndepartments.\n3.2 Lost and found items\nare recorded and\nreported in\naccordance with\nenterprise\nstandards.\n3.3 Handover is\nconducted properly\nand concisely for the\nincoming shift when\napplicable.\n3.1 Equipment\nhandling\n3.2 Enterprise\nreporting system\n3.3 Role of different\npersonnel and\ndepartments\n3.4 Lost and found\nprocedures,\nrecording and\nreporting system of\nthe enterprise\n3.5 Handover\nprocedures\n3.6 DOH guidelines\non safety and\nhealth\n\n3.1 Communication skills\n3.2 Coordination skills\n3.3 Time management skills\n3.4 Decision making skills\n3.5 Analytical skills\n3.6 Application of health and\nsafety protocols and\nprocedures\n\n--- PDF PAGE 79 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 75\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning techniques\nMay include:\n1.1 Wiping down\n1.2 Washing\n1.3 Sanitizing\n1.4 Dry and wet cleaning activities\n2. Foodservice areas\n\nMay include:\n2.1 Dining area\n2.2 Function rooms\n2.3 Floors\n2.4 Front and back of the house areas\n3. Biodegradable and\nnon-biodegradable\nwastes\nMay include:\n3.1 Food wastes\n3.2 Paper\n3.3. Carton\n3.4 Beverage wastes - cans, bottles\n3.4 Plastic\n3.5 Metals\n4. Supplies\nMay include:\n4.1 Condiments\n4.2 Salt and pepper shakers\n4.3 Napkin dispensers\n4.4 Coasters\n5. Handover conducted\nMay include:\n5.1 Endorsement logbook system\n5.2 Identified problems\n5.3 Shortages of food and beverage\n5.4 Details of service status\n5.5 Guest reservations\n\n--- PDF PAGE 80 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 76\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Brought soiled dishes to the stewarding dishwashing area\nusing the decoy system.\n1.2 Demonstrated knowledge and skills on onsite segregation\nof biodegradable and non biodegradable wastes.\n1.3 Conducted handover for the incoming shift.\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Complete tableware (dinnerware, glassware, flatware,\nhollowware) as specified in list of the tools and equipment\nof this Training Regulations\n2.2 Tables and chairs for a restaurant simulation setting\n2.3 Cleaning tools and equipment\n2.4 Waste bins, trays, basin or similar repository for waste\nsegregation\n2.5 Logbook, record book, boards, or the like for endorsement\nentries\n3. Methods of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Oral Questioning\n3.3 Portfolio\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 81 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 77\n\nUNIT OF COMPETENCY :\nPROVIDE ROOM SERVICE\n\nUNIT CODE\n:"
