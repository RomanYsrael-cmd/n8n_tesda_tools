        "source_text": "TRS513311\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in\nthe provision of food and beverage service to guests in various\ntypes of dining venues and diverse styles of service. This unit\nfocuses on the procedures in the delivery of food and beverages\nto the guest as well as on the knowledge and skills that\nunderpins the efficient work performance in assisting the guest\nduring meal service including handling conflict situations.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Welcome and\nseat guests\n1.1 Guests are welcomed\nwith appropriate\ngreetings and\ngestures.\n1.2 Details of\nreservations are\nchecked according to\nthe standards of the\nfood service\nenterprise.\n1.3 Guests are escorted\nand seated taking\ninto account table\nallocations, number\nof parties, and traffic\nflow of guests in the\ndining room.\n1.4 Table napkins are\nopened for the guests\nwhen applicable.\n1.1 Customer service\n1.2 Communication\n1.3 Workplace health,\nsafety and security\nprocedures\n1.4 Presentation skills\n1.5 Culture and diversity\n1.6 DOH guidelines on\nHygiene, Health and\nSafety\n1.7 Welcoming of\nguests/self-\nintroduction of the\nwaiter\n1.8 IATF/LGU current\nguidelines\n\n1.1 Opening and laying\nthe napkin properly\n1.2 Communication\nskills\n1.3 Application of safety\nand security\nprotocols\n1.4 Coordination skills\n1.5 Attention to details\n1.6 Time management\n2. Take food and\nbeverage\norders\n2.1 The menu is\npresented to the\nguest in accordance\nwith the enterprise\nstandard procedures.\n2.2 Information about\nfood items are\nprovided in clear\nexplanations and\ndescriptions.\n2.3 Upselling strategies\nare carried out\nproperly.\n2.4 Orders are taken\ncompletely in\naccordance with the\nenterprise standard\nprocedures.\n2.1 Methods of order\ntaking/Ordering\nsystem (Manual\nand/or digital)\n2.2 Communication\n2.3 Menu knowledge\n2.4 POS process\n2.5 Adjusting covers\n2.6 Knowledge on\nenterprise service\nand procedures\n2.7 DOH health, safety\nand security\nprocedures\n2.8 Cultural sensitivity\nand diversity\n\n2.1 Communication\nskills\n2.2 Basic technical\nskills in performing\ndigital tasks\n2.3 Selling techniques\n(Upselling,\ndownselling, cross\nselling)\n2.4. Time management\nskills\n2.5 Analytical skills\n2.6 Decision making\nskills\n2.7 Presentation skills\n2.8 Attention to details\n2.9 Application of safety\nprotocols and\nprocedures\n\n--- PDF PAGE 70 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 66\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2.5 Special requests and\nrequirements are\nnoted accurately.\n2.6 Orders are repeated\nback to the guests to\nconfirm items.\n2.7 Required cutleries for\nthe menu choices are\nplaced or adjusted\nproperly.\n\n3. Liaise\nbetween\nkitchen and\nservice areas\n3.1 Orders are placed and\nsent to the kitchen\npromptly.\n3.2 Quality of food is\nchecked in\naccordance with\nestablishment\nstandards\n3.3 Colleagues are\nadvised promptly\nregarding readiness of\nitems for service\n3.4 Service information\nare communicated thru\nteam briefings and\nrelayed accurately to\nthe specific restaurant\npersonnel or\ndepartments\n3.1 Sequence of food\nservice\n3.2 Food and beverage\nservice lead time\n3.3 Product knowledge,\nstandards and\nprocedures\n3.4 Enterprise quality\nstandards\n3.5 Culture and diversity\n3.6 DOH guidelines on\nHygiene, Health and\nSafety\n\n3.1 Communication\nskills\n3.2 Use and application\nof different\ngadgets/software\n3.3 Coordination skills\n3.4 Decision making\nskills\n3.5 Time management\nskills\n3.6 Application of\nprotocols and\nprocedures\n\n--- PDF PAGE 71 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 67\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Serve food\norders\n4.1 Water is served in\naccordance with the\nset standards of the\nenterprise.\n4.2 Food orders are\npicked up promptly\naccording to\nstandard cooking\ntime with appropriate\ngarnish and\naccompaniments and\nchecked to ensure\nquality.\n4.3 Correct food orders\nare served for each\nguest and the name\nof the dish or order is\nmentioned upon\nserving to the guest.\n4.4 Food orders are\nserved with minimal\ndisturbance to the\nother guests and in\naccordance with\nhygienic\nrequirements.\n4.5 Food orders are\nserved according to\ngeneral service\nprocedures and in\naccordance with the\nenterprise standards.\n4.1 Communication\n4.2 Customers service\n4.3 Food safety\nprinciples\n4.4 Types of table\nservice styles\n4.5 Sequence of service\n4.6 Menu Knowledge\n4.7 DOH guidelines on\nsafety and health\n4.8 DOLE policies on\nOHS as applicable\n4.9 IATF/LGU current\nguidelines\n\n4.1 Carrying plates and\ntrays\n4.2 Organization skills\n4.3 Coordination skills\n4.4 Communication\nskills\n4.5 Time management\n4.6 Decision making\nskills\n4.7 Analytical skills\n4.8 Application of health\nand safety protocols\nand procedures\n4.9 Interpersonal skills\n\n5. Assist the\ndiners\n5.1 Additional requests\nor needs of the\nguests are\nanticipated.\n5.2 Additional food and\nbeverage are offered\nand served at the\nappropriate times.\n5.3 Necessary\ncondiments and\nappropriate\ntableware are\nprovided based on\nthe food order.\n5.4 Delays or\ndeficiencies in\nservice are\nrecognized and\nfollowed up promptly\n5.1 The “3-minute”\ncheck\n5.2 Customer service\n5.3 General service\nprinciples\n5.4 Sequence of service\n5.5 Handling guests with\nspecial needs\n5.6 Serving food\n5.7 Adjusting covers\n5.8 Menu knowledge\n5.9 Culture and diversity\n5.10 DOH guidelines on\nsafety and health\n5.11DOLE policies on\nOHS as applicable\n5.12 Child protection\nlaws\n5.13 IATF/LGU current\n guidelines\n5.1 Communication\nskills\n5.2 Coordination skills\n5.3 Attention to details\n5.4 Time management\n5.5 Analytical skills\n5.6 Decision making\nskills\n5.7 Application of health\nand safety protocols\nand procedures\n\n--- PDF PAGE 72 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 68\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nbased on enterprise\npolicy.\n5.5 The “3-minute\ncheck” is conducted\nto monitor guest ‘s\nsatisfaction by\nrevisiting guest\ntables at appropriate\ntimings.\n5.6 Children and guests\nwith special needs\nare treated with extra\nattention and care.\n\n6. Serve\nbeverage\norders\n6.1 Beverage orders are\npicked up promptly\nfrom the bar.\n6.2 Beverage orders are\nchecked for\npresentation and\nappropriate\ngarnishes.\n6.3 Beverages are served\nefficiently according to\nestablished standards\nof service.\n6.4 Beverages are served\naccording to the\nrecommended\ntemperature.\n6.5 For full bottle wine\norders, wine is\npresented, opened,\nand poured with\nminimal disturbance\nto the other guests.\n6.6 Wine service is\ncarried out in\naccordance with\nenterprise\nprocedures.\n6.7 Intoxicated and/or\nunderaged guests are\nidentified and referred\nto an appropriate\nperson following the\nenterprise standards\nand policies.\n6.1 Types of beverages\n6.2 Types of\nglassware/beverage\nware\n6.3 Standard beverage\ngarnishings\n6.4 Types of wines\n6.5 Wine tasting rituals\n6.6. Understanding Wine\nlabels\n6.7. Responsible service\nof alcohol\n6.8 Beverage product\nknowledge\n6.9 DOH guidelines on\nsafety and health\n6.10DOLE policies on\nOHS as applicable.\n6.11 IATF/LGU current\nguidelines\n6.12 Wine-Food pairing\n6.13 Tools and\naccessories\n\n6.1 Wine service\nsequence\n6.2 Guest anticipation\nskills\n6. 3 Communication\nskills\n6.4 Analytical skills\n6.5 Coordination skills\n6.6 Application of health\nand safety protocols\nand procedures\n\n--- PDF PAGE 73 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 69\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n7. Conclude food\nservice\n7.1 Soiled dishes are\nremoved when\nguests are finished\nwith the meal\n7.2 Bills are prepared\nand processed\naccurately in\ncoordination with the\ncashier.\n7.3 Guests are thanked\nand escorted out of\nthe door.\n7.4 Tables are cleared,\nreset and made\nready for the next\nseating.\n7.5 End of service\nassistance is\nprovided following\nthe enterprise\nstandards and\npolicies\n\n7.1 Pricing and product\nknowledge\n7.2 POS Operations\n7.3 Customer Service\n7.4 Basic Math\n7.5 Table clearing\nprocedures\n7.6 Cleaning and\nmaintenance of\nfoodservice\nequipment\n7.7 Food safety\nprinciples\n7.8 Table set-up\n7.9 DOH guidelines on\nsafety and health\n7.10 DOLE policies on\nOHS as applicable\n7.11 Presenting bills and\naccepting payments\n7.13 IATF/LGU current\nguidelines\n\n7.1 Communication\nskills\n7.2 Coordination skills\n7.3 Digital skills\n7.4 Presentation skills\n7.5 Organizational\nskills\n7.6 Analytical skills\n7.7 Application of health\nand safety protocols\nand procedures\n8. Handle conflict\nsituations\n\n8.1 Guest complaints\nare identified and\nverbal and non\nverbal cues are\nrecognized.\n8.2 Complaints are\nreceived and\naccurately recorded in\naccordance with\nenterprise\nprocedures.\n8.3 Empathy is shown to\nthe guest to show\ngenuine concern and\nconsideration.\n8.4 Situations and\nconcerns that can\nnot be handled by\nthe waiter are\nelevated or referred\nto higher authority in\naccordance with\nenterprise\nstandards.\n\n8.1 Communication\n8.2 Customer relations\n8.3 Time Management\n8.4 Procedures in\nhandling guest\ncomplaints\n\n8.1 Communication\nskills\n8.2 Analytical skills\n8.3 Listening skills\n8.4 Coordination\nskills\n8.5 Anger\nManagement\n\n--- PDF PAGE 74 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 70\n\nRANGE OF VARIABLES\n\nVARIABLE\nSCOPE\n1. Menu\nMay include:\n1.1 Digital menu\n1.2 Static menu\n1.3 Board menu\n2. Information about food\nitems\nMay include:\n2.1 Cooking method\n2.2 Serving portions\n2.3 Tastes and flavors\n2.4 Ingredients including food allergens\n2.5 Cooking time\n2.6 Side dishes\n3. Order taking systems\nMay include:\n3.1 Docket system\n3.3 Checklist\n3.3 Blank order slips\n3.4 Touch Screen POS system\n4. Service information\nMay include:\n4.1 Out of stock items\n4.2 Items on specials or promos\n3.5 Number of reservations\n4.4 Special requests or instructions of guests\n5. General service\nprinciples\nMay include:\n5.1 Never reach in front of the guest when serving.\n5.2 Do not place dirty, chipped, cracked tableware before the\nguest.\n5.3 Handle flatware/cutleries and glassware properly\n5.4 Glasses should never be filled too full.\n5.5 Glasses are handled by the base or the stem.\n5.6 Crumb table when necessary.\n5.7 Food service styles\n\n6. 3-Minute Check\nMay include:\n6.1 Ensure guest satisfaction about their meals\n6.2 Replenish condiments\n6.3. Providing additional items\n6.4 Clear unused items\n7. Guests with special\nneeds\nMay include:\n7.1 Children\n7.2 Elderly people\n7.3 Persons with Disability\n7.4 Persons with dietary restrictions\n8. Beverages\nMay include:\n8.1 Alcoholic beverages\n8.2 Non-Alcoholic beverages( e.g. juices, sodas, coffee, tea)\n\n--- PDF PAGE 75 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 71\n9. Wine Presentation\n\nMay include:\n9.1 Types of wine\n9.2 Name of wine\n9.2 Grape varietal\n9.3 Alcohol content\n9.4. Vineyard\n9.5 Vintage\n10. Wine Service\nMay include:\n10.1 Serving at the proper temperature\n10.2 Food pairing\n10.3 Offering of wine\n11. Bill processing\nMay include:\n11.1 Cash payments\n11.2 Card\n11.3 Cashless transactions\n11.4 Vouchers/GCs/LOAs\n12. End of service\nassistance\nMay include:\n12.1 Filling up of guest comment forms\n12.2 Valet service\n12.3 Obtaining transportation service\n12.4. Retrieving items that have been placed into safe\nkeeping\n13. Guest complaints\n\nMay include:\n13.1 Level of service\n13.2 Product standards\n13.3 Processes\n13.4 Information given\n13.5 Charges and fees\n14. Verbal and non-verbal\ncues\nMay include:\n14.1 Facial expressions\n14.2 Hand gestures\n14.3 Tone of voice\n14.4 Tapping on the table\n15. Empathy\nMay include:\n15.1 Understand and share the feelings\n15.2 Agree truthfully to minor points\n15.3 Express sincere regret\n15.4 Thank the guest for bringing up the matter\n15.5 Not taking offense when guest complains\n15.6 Approach with friendly spirit\n\n--- PDF PAGE 76 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 72\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Checked the details of reservations\n1.2 Provided information about the food items\n1.3 Took complete orders\n1.4 Served food orders according to general service\nprocedures\n1.5 Performed the “3-minute” check\n1.6 Served beverages according to established standards of\nservice\n1.7 Presented, opened and poured wine in front of the guest.\n1.8 Cleared and reset the tables and made ready for the next\nseating\n1.9 Handled conflict situations\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Complete tableware (dinnerware, glassware, flatware,\nhollowware) as specified in list of the tools and\nequipment of this Training Regulations\n2.2 Wines (unopened bottles); wine bucket and stand,\ncloth/table napkin\n2.3 Bar tools\n2.4 Dining room/restaurant equipment\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Oral Questioning\n3.3 Portfolio\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 77 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 73\nUNIT OF COMPETENCY :\nCLOSE DINING ROOM/RESTAURANT AREA AFTER\nSERVICE\n\nUNIT CODE\n:"
