        "source_text": "400311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice,\nand boosting self-confidence and developing self-\nregulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the\nface of setbacks and\nfrustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined\n\n1.1 Self-\nmanagement\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling\nnegative\nemotions and\nunpleasant\nsituation in the\nworkplace\nsuch as\nfrustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing properly\none’s emotions\nand recognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n--- PDF PAGE 20 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Develop\nreflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\nassessment\nstrategies and\nteacher feedback\nare contemplated\n2.2 Progress when\nseeking and\nresponding to\nfeedback from\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and\ndecision-making\nstrategies and\nfeedback from peers\nand teachers are\npredicted\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’\nReflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\nConclusion,\nand Action\nplan)\n2.1 Using the basic\nSWOT analysis\nas self-\nassessment\nstrategy\n2.2 Developing\nreflective practice\nthrough\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able to\naccept\nchallenges\n\n3. Boost self-\nconfidence and\ndevelop self-\nregulation\n3.1 Efforts for continuous\nself-improvement are\ndemonstrated\n3.2 Counter-productive\ntendencies at work\nare eliminated\n3.3 Positive outlook in life\nare maintained.\n3.1 Four\ncomponents of\nself-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g.,\n7 Habits by\nStephen Covey,\ntransactional\nanalysis,\npsycho-spiritual\nconcepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting, conversing\nskills\n\n3.2 Showing affective\nskills – flexibility,\nadaptability, etc.\n\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 21 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 17\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include:\n1.1\nSeeking assistance in the form of job coaching or\nmentoring\n1.2\nContinuing dialogue to tackle workplace grievances\n1.3\nCollective negotiation/bargaining for better working\nconditions\n1.4\nShare your goals to improve with a trusted co-worker or\nsupervisor\n1.5\nMake a negativity log of every instance when you catch\nyourself complaining to others\n1.6\nMake lists and schedules for necessary activities\n2. Unpleasant\nsituation\nMay include:\n2.1\nJob burn-out\n2.2\nDrug dependence\n2.3\nSulking\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-discipline\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to workplace and resource s\n2.2. Case studies\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration or simulation with oral questioning\n3.2. Case problems involving work improvement and\nsustainability issues\n3.3. Third-party report\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 22 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 18\nUNIT OF COMPETENCY :\nCONTRIBUTE TO WORKPLACE INNOVATION\n\n UNIT CODE\n :"
