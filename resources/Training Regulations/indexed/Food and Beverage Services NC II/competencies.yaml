        "source_title": "PERFORM COMPUTER OPERATIONS",
        "source_text": "--- PDF PAGE 48 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    44 \nUNIT OF COMPETENCY: \n PERFORM COMPUTER OPERATIONS \n \nUNIT CODE                     :        TRS311203 \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes and \nvalues needed to perform computer operations which \nincludes inputting, accessing, producing and transferring \ndata using the appropriate hardware and software  \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Plan and \nprepare for task \nto be \nundertaken \n1.1 Requirements of task \nare determined \n1.2 Appropriate hardware \nand software is \nselected according to \ntask assigned and \nrequired outcome \n1.3 Task is planned to \nensure OH & S \nguidelines and \nprocedures are \nfollowed \n1.1 Basic ergonomics of \nkeyboard and \ncomputer use \n1.2 Main types of \ncomputers and basic \nfeatures of different \noperating systems \n1.3 Main parts of a \ncomputer \n1.4 Storage devices and \nbasic categories of \nmemory \n1.5 Relevant types of \nsoftware \n1.6 General security \n1.7 Viruses \n1.8 OH & S principles \nand responsibilities \n1.9 Calculating \ncomputer capacity \n1.1 Reading skills \nrequired to \ninterpret work \ninstruction \n1.2 Communication \nskills \n \n2.  Input data into \ncomputer \n2.1 Data are entered into \nthe computer using \nappropriate \nprogram/application in \naccordance with \ncompany procedures \n2.2 Accuracy of \ninformation is checked \nand information is \nsaved in accordance \nwith standard \noperating procedures \n2.3 Inputted data are \nstored in storage \nmedia according to \nrequirements \n2.1 Storage devices and \nbasic categories of \nmemory \n2.2 Relevant types of \nsoftware \n2.3 General security \n2.4 Viruses \n2.5 OH & S principles \nand responsibilities \n2.6 Calculating \ncomputer capacity \n2.1 Reading skills \nrequired to \ninterpret work \ninstruction \n2.2 Communication \nskills\n\n--- PDF PAGE 49 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    45 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n2.4 Work is performed \nwithin ergonomic \nguidelines \n \n \n3.   Access \ninformation \nusing computer \n3.1 Correct program/ \napplication is selected \nbased on job \nrequirements \n3.2 Program/application \ncontaining the \ninformation required is \naccessed according to \ncompany procedures \n3.3 Desktop icons are \ncorrectly selected, \nopened and closed for \nnavigation purposes \n3.4 Keyboard techniques \nare carried out in line \nwith OH & S \nrequirements for safe \nuse of keyboards \n3.1 Relevant types of \nsoftware \n3.2 OH & S principles \nand responsibilities \n3.3 Calculating \ncomputer capacity \n3.1 Reading skills \nrequired to \ninterpret work \ninstruction \n3.2 Communication \nskills \n \n4.   Produce/output \ndata using \ncomputer \nsystem \n4.1 Entered data are \nprocessed using \nappropriate software \ncommands \n4.2 Data are printed out \nas required using \ncomputer \nhardware/peripheral \ndevices in accordance \nwith standard \noperating procedures \n4.3 Files and data are \ntransferred between \ncompatible systems \nusing computer \nsoftware, hardware/ \nperipheral devices in \naccordance with \nstandard operating \nprocedures  \n4.1 Relevant types of \nsoftware \n4.2 General security \n4.3 Viruses \n4.4 OH & S principles \nand responsibilities \n4.5 Calculating \ncomputer capacity \n4.1 Reading skills \nrequired to \ninterpret work \ninstruction \n4.2 Communication \nskills\n\n--- PDF PAGE 50 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    46 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n5.   Maintain \ncomputer \nequipment and \nsystems \n5.1 Systems for cleaning, \nminor maintenance \nand replacement of \nconsumables are \nimplemented \n5.2 Procedures for \nensuring security of \ndata, including regular \nback-ups and virus \nchecks are \nimplemented in \naccordance with \nstandard operating \nprocedures \n5.3 Basic file maintenance \nprocedures are \nimplemented in line \nwith the standard \noperating procedures \n5.1 General security \n5.2 Viruses \n5.3 OH & S principles \nand responsibilities \n5.4 Calculating \ncomputer capacity  \n5.5 Maintenance \nprocedures for \ncomputer \n5.1 Applying \nmaintenance \nprocedures\n\n--- PDF PAGE 51 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    47 \n  RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hardware and peripheral \ndevices \nMay include: \n1.1. Personal computers \n1.2. Networked systems \n1.3. Communication equipment \n1.4. Printers \n1.5. Scanners \n1.6. Keyboard \n1.7. Mouse \n2. Software \nMay include: \n2.1. Word processing packages \n2.2. Data base packages \n2.3. Internet \n2.4. Spreadsheets \n3. OH & S guidelines \nMay include: \n3.1. OHS guidelines \n3.2. Enterprise procedures \n4. Storage media \nMay include: \n4.1. Diskettes \n4.2. CDs \n4.3. Zip disks \n4.4. Hard disk drives, local and remote \n5. Ergonomic guidelines \nMay include: \n5.1. Types of equipment used \n5.2. Appropriate furniture \n5.3. Seating posture \n5.4. Lifting posture \n5.5. Visual display unit screen brightness\n\n--- PDF PAGE 52 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    48 \nVARIABLE \nRANGE \n6. Desktop icons \n May include: \n6.1. Directories/folders \n6.2. Files \n6.3. Network devices \n6.4. Recycle bin \n7. Maintenance \nMay include: \n7.1. Creating more space in the hard disk \n7.2. Reviewing programs \n7.3. Deleting unwanted files \n7.4. Backing up files  \n7.5. Checking hard drive for errors \n7.6. Using up to date anti-virus programs \n7.7. Cleaning dust from internal and external \nsurfaces\n\n--- PDF PAGE 53 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    49 \n EVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Selected and used hardware components correctly and \naccording to the task requirement \n1.2. Identified and explain the functions of both hardware and \nsoftware used, their general features and capabilities \n1.3. Produced accurate and complete data in accordance \nwith the requirements \n1.4. Used appropriate devices and procedures to transfer  \nfile/data accurately \n1.5. Maintained computer system \n2. Resource \nimplications \nThe following resources should be provided: \n2.1. Computer hardware with peripherals \n2.2. Appropriate software \n3. Methods of \nassessment \nCompetency in this unit may be assessed through: \n3.1.    Observation \n3.2.    Questioning \n3.3.    Practical demonstration \n4. Context for \nassessment \n4.1. Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2. Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
