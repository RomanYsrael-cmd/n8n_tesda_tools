              {
                "number": "1.1",
                "text": "Inquiries are answered promptly, clearly and accurately."
              },
              {
                "number": "1.2",
                "text": "Reservation data are recorded/retrieved and processed promptly and accurately according to enterprise standards"
              },
              {
                "number": "1.3",
                "text": "Additional information about the food service establishment is provided when necessary."
              },
              {
                "number": "1.4",
                "text": "Reserved tables for the day are prepared on schedule."
              }
            ],
