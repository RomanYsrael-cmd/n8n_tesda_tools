        "source_text": "--- PDF PAGE 69 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    65 \nUNIT OF COMPETENCY:    PROVIDE FOOD AND BEVERAGE SERVICES TO GUESTS \n \nUNIT CODE  \n        :   TRS513311 \n \nUNIT DESCRIPTOR        :    This unit covers the knowledge, skills and attitudes   required in \nthe provision of food and beverage service to guests in various \ntypes of dining venues and diverse styles of service. This unit \nfocuses on the procedures in the delivery of food and beverages \nto the guest as well as on the knowledge and skills that \nunderpins the efficient work performance in assisting the guest \nduring meal service including handling conflict situations. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized \nterms are elaborated in \nthe Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Welcome and \nseat guests \n1.1  Guests are welcomed \nwith appropriate \ngreetings and \ngestures. \n1.2  Details of \nreservations are \nchecked according to \nthe standards of the \nfood service \nenterprise. \n1.3  Guests are escorted \nand seated taking \ninto account table \nallocations, number \nof parties, and traffic \nflow of guests in the \ndining room. \n1.4  Table napkins are \nopened for the guests \nwhen applicable. \n1.1  Customer service \n1.2  Communication  \n1.3 Workplace health, \nsafety and security \nprocedures \n1.4 Presentation skills \n1.5 Culture and diversity \n1.6 DOH guidelines on \nHygiene, Health and \nSafety \n1.7 Welcoming of \nguests/self-\nintroduction of the \nwaiter \n1.8 IATF/LGU current \nguidelines \n \n \n1.1  Opening and laying \nthe napkin properly \n1.2  Communication \nskills \n1.3 Application of safety \nand security \nprotocols \n1.4 Coordination skills \n1.5 Attention to details \n1.6 Time management \n2. Take food and \nbeverage \norders \n2.1  The menu is \npresented to the \nguest in  accordance \nwith the enterprise \nstandard procedures. \n2.2 Information about \nfood items are \nprovided in clear \nexplanations and \ndescriptions. \n2.3  Upselling strategies \nare carried out \nproperly. \n2.4  Orders are taken \ncompletely in \naccordance with the \nenterprise standard \nprocedures. \n2.1 Methods of order \ntaking/Ordering \nsystem (Manual \nand/or digital) \n2.2 Communication \n2.3  Menu knowledge \n2.4  POS process \n2.5  Adjusting covers \n2.6 Knowledge on \nenterprise service \nand procedures \n2.7 DOH health, safety \nand security \nprocedures \n2.8 Cultural sensitivity \nand diversity \n \n \n \n2.1  Communication \nskills \n2.2  Basic technical \nskills in performing \ndigital tasks \n2.3 Selling techniques \n(Upselling, \ndownselling, cross \nselling) \n2.4. Time management \nskills \n2.5 Analytical skills \n2.6 Decision making \nskills \n2.7 Presentation skills \n2.8 Attention to details \n2.9 Application of safety \nprotocols and \nprocedures\n\n--- PDF PAGE 70 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    66 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized \nterms are elaborated in \nthe Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.5  Special requests and \nrequirements are \nnoted accurately. \n2.6  Orders are repeated \nback to the guests to \nconfirm items. \n2.7  Required cutleries for \nthe menu choices are \nplaced or adjusted \nproperly. \n \n \n3. Liaise \nbetween \nkitchen and \nservice areas \n3.1 Orders are placed and \nsent to the kitchen \npromptly. \n3.2 Quality of food is \nchecked in \naccordance with \nestablishment \nstandards \n3.3 Colleagues are \nadvised promptly \nregarding readiness of \nitems for service \n3.4 Service information \nare communicated thru \nteam briefings and \nrelayed accurately to \nthe specific restaurant \npersonnel or \ndepartments \n3.1 Sequence of food \nservice \n3.2 Food and beverage \nservice lead time \n3.3 