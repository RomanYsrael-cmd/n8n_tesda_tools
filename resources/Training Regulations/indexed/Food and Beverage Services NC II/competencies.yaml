        "source_text": "--- PDF PAGE 26 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    22 \nUNIT OF COMPETENCY \n:    PRESENT RELEVANT INFORMATION  \n \n  UNIT CODE \n               :     400311215 \n \nUNIT DESCRIPTOR \n    :     This unit of covers the knowledge, skills and attitudes   \n \n \n \nrequired to present data/information appropriately. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Gather \ndata/ \ninformation \n1.1 Evidence, facts \nand information \nare collected \n1.2 Evaluation, terms \nof reference and \nconditions are \nreviewed to \ndetermine \nwhether \ndata/information \nfalls within \nproject scope \n \n1.1 Organisational \nprotocols  \n1.2 Confidentiality \n1.3 Accuracy \n1.4 Business \nmathematics and \nstatistics \n1.5 Data analysis \ntechniques/proced\nures \n1.6 Reporting \nrequirements to a \nrange of audiences \n1.7 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n1.8 Organisational \nvalues, ethics and \ncodes of conduct \n \n1.1 Describing \norganisational \nprotocols relating \nto client liaison \n1.2 Protecting \nconfidentiality \n1.3 Describing \naccuracy \n1.4 Computing \nbusiness \nmathematics and \nstatistics \n1.5 Describing data \nanalysis \ntechniques/ \nprocedures \n1.6 Reporting \nrequirements to a \nrange of audiences \n1.7 Stating legislation, \npolicy and \nprocedures relating \nto the conduct of \nevaluations \n1.8 Stating \norganisational \nvalues, ethics and \ncodes of conduct\n\n--- PDF PAGE 27 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    23 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Assess \ngathered \ndata/ \ninformation 