        "source_text": "--- PDF PAGE 6 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    2 \nSECTION 2   COMPETENCY STANDARDS \n \nThis section details the contents of the basic, common and core units of competency \nrequired in FOOD AND BEVERAGES SERVICES NC II. \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY:    PARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n    :    400311210 \n \nUNIT DESCRIPTOR     : \nThis unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and \nrelevant \ninformation is \naccessed from \nappropriate \nsources  \n1.2 Effective \nquestioning, active \nlistening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate \nmedium is used \nto transfer \ninformation and \nideas \n1.4 Appropriate non- \nverbal \ncommunication is \nused \n1.5 Appropriate lines of \ncommunication \nwith supervisors \nand colleagues \nare identified and \nfollowed \n1.6 Defined workplace \n       procedures for the \nlocation and \nstorage of \ninformation are \nused \n1.1 Effective verbal \nand nonverbal \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n1.8 Workplace \netiquette \n \n \n1.1 Following simple \nspoken language \n1.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3 Participating in \nworkplace meetings \nand discussions \n1.4 Preparing work- \nrelated documents \n1.5 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6 Relating/ Interacting \nwith people of \nvarious levels in the \nworkplace \n1.7 Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements \n1.8 Basic business \nwriting skills \n19 Interpersonal skills in \nthe workplace \n2.0 Active-listening skills\n\n--- PDF PAGE 7 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    3 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n  \nREQUIRED \nSKILLS \n \n1.7 Personal \ninteraction is \ncarried out clearly \nand concisely \n \n \n \n2.  Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices \nand instructions \nare read and   \ninterpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction are \nfollowed based on \nestablished \nprocedures \n2.3 Feedback is given \nto workplace \nsupervisor based \ninstructions/ \ninformation \nreceived \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters \nconcerning \nconditions of \nemployment are \nsought and asked \nfrom appropriate  \n      sources  \n2.6  Meetings \noutcomes are \ninterpreted and \nimplemented \n2.1 Effective verbal \nand non-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nWorkplace \npolicies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace \netiquette \n \n  \n2.1 Following simple \nspoken instructions  \n2.2 Performing routin