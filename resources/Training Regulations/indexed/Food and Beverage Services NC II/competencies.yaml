        "source_text": "--- PDF PAGE 81 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    77 \n \n \nUNIT OF COMPETENCY : \nPROVIDE ROOM SERVICE \n \nUNIT CODE \n: \nTRS513313 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes    \nrequired in the provision of food and beverage service \nparticularly in the guest room of a commercial \naccommodation establishment.   \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized \nterms are elaborated in \nthe Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Take and \nprocess room \nservice orders \n \n1.1.  Room service   \norders are \ntaken/retrieved and \nprocessed promptly \nin accordance with \nenterprise \nstandards. \n1.2   Details of orders \nare clarified, and \nchecked for \naccuracy \n1.3   Suggestive selling \ntechniques are \nused to optimize \nroom service sales.  \n1.4   Relevant \ninformation are \nrecorded and \nchecked in \naccordance with \nenterprise policy \nand procedures \n1.5   Orders are \npromptly transferred \nand relayed to the \nappropriate \ndepartment/section \nfor  preparation \n1.1 Communication \n1.2 Suggestive selling \n1.3 Customer Service \n1.4. Presentation skills \n1.5 Product knowledge \n1.6 Room service \nenterprise standards \nand procedures \n1.7 DOH guidelines on \nsafety and health \n1.8 IATF/LGU current \nguidelines \n \n \n \n1.1 Communication skills  \n1.2 Suggestive selling \n1.3 Telephone/ \nCommunication \nskills \n1.4 Listening \n1.5 Time management \n1.6 Analytical skills \n1.7 Decision making \nskills \n1.8 Attention to details \n1.9 Application of health \nand safety protocols \nand procedures \n1.10 Use of gadgets and \nenterprise software \n1.11 Coordination skills\n\n--- PDF PAGE 82 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    78 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized \nterms are elaborated in \nthe Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.  Set up trays \nand trolleys  \n2.1 Room service \nequipment and \nsupplies are \nchecked for \ncleanliness and \nprepared in \naccordance with \nenterprise \nprocedures. \n2.2  Room service \ntrays or trolleys \nare set up \naccording to the \norders received \nand enterprise \nstandards.  \n2.3  Orders are \nchecked before \nleaving the kitchen \nfor delivery.  \n2.1 Enterprise \nstandards and \nprocedures in setting \nup of trolleys \n2.2 Product knowledge \nand service \nprocedures \n2.3 Equipment and its \noperations \n2.4 Proper use of \nchemicals and \nsolutions \n2.5 Order checking \nprocedures of the \nenterprise \n2.5 DOH guidelines on \nsafety and health \n2.6 DOLE policies on \nOHS as applicable \n2.7 IATF/LGU current \nguidelines \n \n2.1 Communication skills  \n2.2 Suggestive selling \n2.3 Time management \n2.4 Analytical skills \n2.5 Decision making \nskills \n2.6 Attention to details \n2.7 Setting up of trolleys \n2.8 Coordination skills \n2.9 Practice health and \nhygiene protocols and \nprocedures \n3.  Present and \nserve food \nand beverage \norders to \nguests \n3.1  Guests are greeted \npolitely in accordance \nwith the \nestablishment's \nenterprise service \nprocedures.  \n3.2  In-room service is \nprepared in \naccordance with \nguest \nrequirements/prefere\nnces. \n3.3  Room service \nitems/orders are \nidentified and \nconfirmed with the \nguest. \n3.4  Food and beverage \nroom service orders \nare served in \naccordance with \nenterprise standards. \n3.5  Room service \naccount is \npresented and \nprocessed in \naccordance with the \nenterprise \nprocedures. \n3.1 Enterprise \nstandards and \nprocedures in setting \nup of trolleys \n3.2 Product knowledge \nand service \nprocedures \n3.3 Room service \nprocedures of the \nenterprise \n3.4 Equipment and its \noperations \n3.5 Presentation and \nproper service of \nfood and beverage \n3.6 Proper use of \nchemicals and \nsolutions \n3.7 Enterprise \nstandards and \nprocedures in \npresentation and \nchecking of bills \n3.8 Billing arrangements \nand processing \nprocedures \n3.9 DOH guidelines on \nsafety and health \n \n3.1 Communication skills  \n3.2 Suggestive selling \n3.3 Time management \n3.4 Analytical skills \n3.5 Decision making \nskills \n3.6 Attention to details \n3..7 Coordination skills \n3.8 Practice health and \nhygiene protocols \nand procedures\n\n--- PDF PAGE 83 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    79 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized \nterms are elaborated in \nthe Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.10 DOLE policies on \nOHS as applicable \n3.11 IATF/LGU current \nguidelines \n \n4. Clear room \nservice \ntrolleys, trays \nand soiled \ndishes \n4.1  Dirty trays or trolleys \nare cleared in \naccordance with the \nenterprise standards. \n4.2  Trays or trolleys are \ncleaned and returned \nto the room service \narea. \n4.3  Room service \nsupplies are \nrestocked in \npreparation for the \nnext room service \norders. \n4.1 Cleaning \nprocedures of room \nservice equipment’s  \n4.2 Stocking procedures \nof the enterprise \n4.3 DOH guidelines on \nsafety and health \n4.4 DOLE policies on \nOHS as applicable \n4.5 IATF/LGU current \nguidelines \n \n4.1  Communication \nskills  \n4.2 Time management \n4.3  Analytical skills \n4.4 Decision making \nskills \n4.5  Attention to details \n4.6 Coordination skills \n4.7  Practice health and \nhygiene protocols \nand procedures\n\n--- PDF PAGE 84 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    80 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Take/retrieve and \nprocessed room \nservice orders \nMay include: \n1.1  Recording room service order details in the logbook \n1.2  Encoding room service order details in the computer \n1.3  Coordinating room service orders with relevant staff and \ndepartments \n2. Relevant information \nMay include : \n2.1  Name of the guest \n2.2  Room number \n2.3  Number of persons \n2.4  Detailed food orders \n2.5  Time the order was taken \n2.6  Time for delivery \n \n3. Room service \nequipment and \nsupplies \nMay include: \n3.1  Trays or trolleys \n3.2  Toasters     \n3.3  Tableware and appointments \n3.4  Warming equipment \n3.5  Linen \n3.6  Printed materials \n \n4. Set-ups for room \nservice trays and or \ntrolleys  \nMay include: \n4.1  Butters \n4.2  Condiments  \n4.3  Cutlery \n4.4  Glassware \n4.5  Beverages  \n4.6  Linen \n \n5. In-room service \npreparation  \nMay include: \n5.1  Positioning of trolley, trays and equipment \n5.2  Arranging items, setting up tableware and condiments \n5.3  Ensuring guest safety, comfort and satisfaction \n \n6. Room service account \nprocess \nMay include: \n6.1 Determining guest’s preference for account payment \n6.2 For charge accounts, guests are asked to sign the bills \n6.3  Forwarding the bill to relevant section or person \n6.4  Confirming details of account where required\n\n--- PDF PAGE 85 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221              Promulgated November 13, 2023                    81 \nEVIDENCE GUIDE \n \n1.  Critical aspects of   \ncompetency \nAssessment requires evidences that the candidate: \n1.1 \nTook, retrieved and processed room service \norders properly \n1.2 \nSet up trays and trolleys  \n1.3 \nPresented and served room service orders \n1.4 \nPresented and processed account. \n2.   Resource  implications \nThe following resources should be provided: \n2.1 \nFood and beverage room service supplies and    \n    equipment \n2.2 \nRoom service menu  \n2.3 \nRoom service tableware and appointments \n3.  Methods of   assessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration \n3.2   Oral Questioning   \n3.3   Portfolio \n4.  Context for  assessment \n4.1   Competency may be assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center\n",
