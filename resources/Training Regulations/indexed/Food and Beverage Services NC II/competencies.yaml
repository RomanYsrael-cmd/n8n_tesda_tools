        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Took and processed table reservations\n1.2 Prepared service station and equipment\n1.3 Set up dining and/or buffet tables\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Complete tableware (dinnerware, glassware, flatware,\nhollowware) as specified in list of the tools and equipment\nof this Training Regulations\n2.2 Tables and chairs for a restaurant simulation setting\n2.3 Table service linen (correct size and material)\n2.4 POS\n2.5 Telephone\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Oral Questioning\n3.3 Portfolio\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 69 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 65\nUNIT OF COMPETENCY: PROVIDE FOOD AND BEVERAGE SERVICES TO GUESTS\n\nUNIT CODE\n :"
        },
        "source_text": "TRS513310\n\n UNIT DESCRIPTOR : This unit covers the knowledge and skills required in the\npreparation of the dining room /restaurant area before the\nstart of the service operations. It involves opening duties or\nthe dining room mise-en-place prior to service.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Take and\nprocess table\nreservations\n\n1.1 Inquiries are\nanswered promptly,\nclearly and\naccurately.\n1.2 Reservation data are\nrecorded/retrieved and\nprocessed promptly\nand accurately\naccording to enterprise\nstandards\n1.3 Additional information\nabout the food service\nestablishment is\nprovided when\nnecessary.\n1.4 Reserved tables for\nthe day are prepared\non schedule.\n1.1.Communication\n1.2 Customer service\nprocedures\n1.3 Reservation\nsystems\n1.4 Industry\ninformation\nsources\n1.5 Enterprise\nProduct\nknowledge\n1.6 Computer/\nsoftware\napplications\n1.7 IATF/LGU\ncurrent\nguidelines\n\n1.1 Telephone skills\n1.2 Listening skills\n1.3 Negotiation skills\n1.4 Communication skills\n1.5 Computer/Digital skills\n1.6 Use of different types of\ngadgets\n1.7 Food delivery\napplications\n1.8 Analytical skills\n\n2. Prepare\nservice\nstations and\nequipment\n2.1 Service or waiter’s\nstation is stocked\nadequately with\nsupplies necessary\nfor service\n2.2 Reception and dining\narea including\ntableware and\nequipment are\ncleaned, sanitized,\nand put in their proper\nplaces following\nprotocols and\nstandard procedures\nof the enterprise.\n2.3 Conditions of all\ntables, furniture,\nfixtures, and dining\n2.1 Dining room mis-\nen place\n2.2 Types of\ntableware\n2.3 Cleaning and\nmaintenance of\nfoodservice\nequipment\n2,4 Use and\nknowledge on\nCleaning\nchemicals\n2.5 DOH guidelines\non Hygiene,\nHealth and\nSafety\n2.6 Ergonomics\n2.1 Communication skills\n2.2 Organizational skills\n2.3 Good housekeeping\nskills (5 S)\n2.4 Practice of health and\nsafety protocols and\nprocedures\n2.4 Time management\n2.5 Application of hygiene\nprinciples and safe\nhandling of tableware\nand equipment\n2.6 Ability to follow correct\noperating procedures\nand instructions\n\n--- PDF PAGE 65 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 61\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nroom area are\nchecked.\n2.4 Electrical appliances\nor equipment like\ncoffee machine, tea\npots, plate warmers\netc. in the dining area\nare turned on and\nkept ready.\n2.7 IATF/LGU\ncurrent\nguidelines\n2.8 Occupational\nhealth and safety\nprinciples and\nresponsibilities\n3. Set up tables\nin the dining\narea\n\n3.1 Dining and/or buffet\ntables are set up\naccording to the\nstandards of the food\nservice\nestablishment.\n3.2 In cases where the\nmenu is pre-arranged\nor fixed, covers are\nset correctly\naccording to the\npredetermined menu.\n3.3 Tableware and\nglassware are wiped\nand polished before\nthey are set up on the\ntable.\n3.4 Cloth napkins are\nfolded properly and\nlaid on the table\nappropriately\naccording to napkin\nfolding style.\n3.1 Type of tabletop\nset-up\n3.2 Kinds of\ntableware\n3.3 Types of linen\n3.4 Types of menu\n3.5 Types of skirting\n3.6 Buffet design\n3.7 DOH guidelines\non Hygiene,\nHealth and\nSafety\n3.8 IATF/LGU\ncurrent\nguidelines\n3.9 Workplace safety\nand hygiene\nprocedures\n3.1 Table setting procedures\n3.2 Napkin folding\n3.3 Proper handling of\ntableware\n3.4 Table skirting\n3.5 Practice of health and\nsafety protocols and\nprocedures\n3.6 Time management\n\n4. Set the mood/\nambiance of\nthe dining area\n4.1 Lights are adjusted\naccording to time of\nthe day.\n4.2 Tables, chairs and\nother dining room\nfurniture are arranged\nto ensure comfort and\nconvenience of the\nguests.\n4.3 Appropriate music is\nplayed when\napplicable\n4.4 Floors/carpets are\ncleaned.\n4.5 Air-condition or\ncooling units are\n4.1 Ergonomics\n4.2. DOH guidelines\non Hygiene,\nHealth and\nSafety\n4.3 Workplace\nhealth, safety\nand security\nprocedures\n\n4.1 Proportion, design and\nsymmetry\n4.2 Technical skills\n(audio/video)\n4.3 Ability to follow correct\noperating procedures\nand instructions\n4.4 Observation and\nmonitoring techniques\n4.5 Decision making\n4.6 Analytical skills\n\n--- PDF PAGE 66 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 62\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nadjusted for the\ncomfort of the guests\n4.6 Decorations are set-\nup according to the\ntheme or concept of\nthe dining room.\n\n--- PDF PAGE 67 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 63\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Inquiries\nMay be received through the following:\n1.1\nTelephone\n1.2\nEmail\n1.3\nRestaurant website\n1.4\nThird party reservation service\n1.5\nIn person\n2. Reservation data\nMay include:\n2.1 Date of reservation\n2.2 Time of arrival\n2.3 Number of persons\n2.4 Name of person who will use the reservation\n2.5 Name of person making the reservation\n2.6 Contact details of the person checking in and of\n the person making the reservation\n2.7 Special requirements\n2.8 Sources of reservations\n2.9 Table assignment\n3. Processing reservations\nMay include:\n3.1 Recording reservation details in the logbook\n3.2 Encoding reservation details in the computer\n3.3 Coordinating reservations with relevant staff and\n departments\n3.4 Briefing about reservations details\n3.5 Setting up table assignments\n4. Supplies\nMay include:\n4.1 Napkins\n4.2 Menu folders\n4.3 Order slips\n4.4 Wine list\n4.5 Condiments\n4.6 Table cloth/Placemats\n4.7 Salt and Pepper shakers\n\n5. Tableware and equipment\nMay include:\n5.1 Dinnerware/chinaware\n5.2 Glassware/Beverageware\n5.3 Silverware/Flatware\n5.4 Holloware\n5.5 Refrigerators/Chillers\n5.6 Coffee makers/machines\n5.7 Point of Sales (POS)\n5.8 Wine service equipment\n5.9 Dessert cart\n5.10 Linen\n\n--- PDF PAGE 68 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 64\n6. Table setup\nMay include:\n6.1 Ala carte\n6.2 Set menu\n6.3 Buffet\n\n7. Napkin folding styles\nMay include:\n7.1 Pyramid\n7.2 Bird of paradise\n7.3 Bishop’s hat\n7.4 Rose bud\n7.5 Sail\n7.6 Candle\n7.7 Crown\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Took and processed table reservations\n1.2 Prepared service station and equipment\n1.3 Set up dining and/or buffet tables\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Complete tableware (dinnerware, glassware, flatware,\nhollowware) as specified in list of the tools and equipment\nof this Training Regulations\n2.2 Tables and chairs for a restaurant simulation setting\n2.3 Table service linen (correct size and material)\n2.4 POS\n2.5 Telephone\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Oral Questioning\n3.3 Portfolio\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 69 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 65\nUNIT OF COMPETENCY: PROVIDE FOOD AND BEVERAGE SERVICES TO GUESTS\n\nUNIT CODE\n :"
