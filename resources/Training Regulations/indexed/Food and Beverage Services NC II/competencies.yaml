        "source_text": "400311217\n\nUNIT\nDESCRIPTOR\n\n:\nThis unit covers knowledge, skills and attitude to identify the\nefficiency and effectiveness of resource utilization,\ndetermine causes of inefficiency and/or ineffectiveness of\nresource utilization and Convey inefficient and ineffective\nenvironmental practices\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nefficiency and\neffectiveness\nof resource\nutilization\n\n1.1 Required\nresource\nutilization in the\nworkplace is\nmeasured using\nappropriate\ntechniques\n1.2 Data are\nrecorded in\naccordance with\nworkplace\nprotocol\n1.3 Recorded data are\ncompared to\ndetermine the\nefficiency and\neffectiveness of\nresource utilization\naccording to\nestablished\nenvironmental\nwork procedures\n1.1. Importance of\nEnvironmental\nLiteracy\n1.2. Environmental\nWork\nProcedures\n1.3. Waste\nMinimization\n1.4. Efficient Energy\nConsumptions\n1.1 Recording Skills\n1.2 Writing Skills\n1.3 Innovation Skills\n\n2. Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n2.1 Potential causes\nof inefficiency\nand/or\nineffectiveness\nare listed\n2.2 Causes of\ninefficiency\nand/or\nineffectiveness\nare identified\nthrough\ndeductive\nreasoning\n2.3 Identified causes\nof inefficiency\nand/or\nineffectiveness\n2.1 Causes of\nenvironmental\ninefficiencies\nand\nineffectiveness\n\n2.1 Deductive\nReasoning Skills\n2.2 Critical thinking\n2.3 Problem Solving\n2.4 Observation\nSkills\n\n--- PDF PAGE 34 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 30\nare validated thru\nestablished\nenvironmental\nprocedures\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Convey\ninefficient and\nineffective\nenvironmental\npractices\n\n3.1 Efficiency and\neffectiveness of\nresource\nutilization are\nreported to\nappropriate\npersonnel\n3.2 Concerns related\nresource\nutilization are\ndiscussed with\nappropriate\npersonnel\n3.3 Feedback on\ninformation/\nconcerns raised\nare clarified with\nappropriate\npersonnel\n3.1 Appropriate\nPersonnel to\naddress the\nenvironmental\nhazards\n3.2 Environmental\ncorrective actions\n3.1 Written and Oral\nCommunication\nSkills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation\nSkills\n3.5 Practice\nEnvironmental\nAwareness\n\n--- PDF PAGE 35 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1 Utilization of Energy, Water, Fuel Procedures\n1.2 Waster Segregation Procedures\n1.3 Waste Disposal and Reuse Procedures\n1.4 Waste Collection Procedures\n1.5 Usage of Hazardous Materials Procedures\n1.6 Chemical Application Procedures\n1.7 Labeling Procedures\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n\n--- PDF PAGE 36 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 32\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Measured required resource utilization in the workplace\nusing appropriate techniques\n1.2. Recorded data in accordance with workplace protocol\n1.3. Identified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4. Validate the identified causes of inefficiency and/or\nineffectiveness thru established environmental\nprocedures\n1.5. Report efficiency and effectives of resource utilization to\nappropriate personnel\n1.6. Clarify feedback on information/concerns raised with\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nWorkplace\n2.2\nTools, materials and equipment relevant to the tasks\n2.3\nPPE\n2.4\nManuals and references\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration\n3.2\nOral questioning\n3.3\nWritten examination\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or\n any appropriately simulated environment\n4.2 Assessment shall be observed while task are being\n undertaken whether individually or in-group\n\n--- PDF PAGE 37 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 33\n\nUNIT OF COMPETENCY\n\n:\n\nPRACTICE ENTREPRENEURIAL SKILLS IN THE\nWORKPLACE\n\nUNIT CODE\n:"
