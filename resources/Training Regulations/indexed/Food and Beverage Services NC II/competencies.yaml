          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety practices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with company facilities,\nproducts and services\n1.7 Demonstrated ability to work effectively with others\n1.8 Applied company rules and standards\n1.9 Applied telephone ethics\n1.10 Applied correct procedure in using telephone, fax\nmachine, internet\n1.11 Handled customer complaints within limit of individual\nresponsibility\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Availability of telephone, fax machine, internet, etc.\n2.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n2.3 Availability of office supplies\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1Written examination\n3.2 Practical demonstration\n4. Context for\nassessment\n4.1Competency assessment may occur in workplace or any\nappropriately simulated environment.\n4.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 64 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 60\nCORE COMPETENCIES\n\n UNIT OF COMPETENCY : PREPARE DINING ROOM/RESTAURANT AREA FOR\nSERVICE\n\n UNIT CODE\n :"
