        "source_text": "TRS513313\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in the provision of food and beverage service\nparticularly in the guest room of a commercial\naccommodation establishment.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Take and\nprocess room\nservice orders\n\n1.1. Room service\norders are\ntaken/retrieved and\nprocessed promptly\nin accordance with\nenterprise\nstandards.\n1.2 Details of orders\nare clarified, and\nchecked for\naccuracy\n1.3 Suggestive selling\ntechniques are\nused to optimize\nroom service sales.\n1.4 Relevant\ninformation are\nrecorded and\nchecked in\naccordance with\nenterprise policy\nand procedures\n1.5 Orders are\npromptly transferred\nand relayed to the\nappropriate\ndepartment/section\nfor preparation\n1.1 Communication\n1.2 Suggestive selling\n1.3 Customer Service\n1.4. Presentation skills\n1.5 Product knowledge\n1.6 Room service\nenterprise standards\nand procedures\n1.7 DOH guidelines on\nsafety and health\n1.8 IATF/LGU current\nguidelines\n\n1.1 Communication skills\n1.2 Suggestive selling\n1.3 Telephone/\nCommunication\nskills\n1.4 Listening\n1.5 Time management\n1.6 Analytical skills\n1.7 Decision making\nskills\n1.8 Attention to details\n1.9 Application of health\nand safety protocols\nand procedures\n1.10 Use of gadgets and\nenterprise software\n1.11 Coordination skills\n\n--- PDF PAGE 82 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 78\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Set up trays\nand trolleys\n2.1 Room service\nequipment and\nsupplies are\nchecked for\ncleanliness and\nprepared in\naccordance with\nenterprise\nprocedures.\n2.2 Room service\ntrays or trolleys\nare set up\naccording to the\norders received\nand enterprise\nstandards.\n2.3 Orders are\nchecked before\nleaving the kitchen\nfor delivery.\n2.1 Enterprise\nstandards and\nprocedures in setting\nup of trolleys\n2.2 Product knowledge\nand service\nprocedures\n2.3 Equipment and its\noperations\n2.4 Proper use of\nchemicals and\nsolutions\n2.5 Order checking\nprocedures of the\nenterprise\n2.5 DOH guidelines on\nsafety and health\n2.6 DOLE policies on\nOHS as applicable\n2.7 IATF/LGU current\nguidelines\n\n2.1 Communication skills\n2.2 Suggestive selling\n2.3 Time management\n2.4 Analytical skills\n2.5 Decision making\nskills\n2.6 Attention to details\n2.7 Setting up of trolleys\n2.8 Coordination skills\n2.9 Practice health and\nhygiene protocols and\nprocedures\n3. Present and\nserve food\nand beverage\norders to\nguests\n3.1 Guests are greeted\npolitely in accordance\nwith the\nestablishment's\nenterprise service\nprocedures.\n3.2 In-room service is\nprepared in\naccordance with\nguest\nrequirements/prefere\nnces.\n3.3 Room service\nitems/orders are\nidentified and\nconfirmed with the\nguest.\n3.4 Food and beverage\nroom service orders\nare served in\naccordance with\nenterprise standards.\n3.5 Room service\naccount is\npresented and\nprocessed in\naccordance with the\nenterprise\nprocedures.\n3.1 Enterprise\nstandards and\nprocedures in setting\nup of trolleys\n3.2 Product knowledge\nand service\nprocedures\n3.3 Room service\nprocedures of the\nenterprise\n3.4 Equipment and its\noperations\n3.5 Presentation and\nproper service of\nfood and beverage\n3.6 Proper use of\nchemicals and\nsolutions\n3.7 Enterprise\nstandards and\nprocedures in\npresentation and\nchecking of bills\n3.8 Billing arrangements\nand processing\nprocedures\n3.9 DOH guidelines on\nsafety and health\n\n3.1 Communication skills\n3.2 Suggestive selling\n3.3 Time management\n3.4 Analytical skills\n3.5 Decision making\nskills\n3.6 Attention to details\n3..7 Coordination skills\n3.8 Practice health and\nhygiene protocols\nand procedures\n\n--- P