  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of competency\nrequired in FOOD AND BEVERAGES SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311210\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and\nrelevant\ninformation is\naccessed from\nappropriate\nsources\n1.2 Effective\nquestioning, active\nlistening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate\nmedium is used\nto transfer\ninformation and\nideas\n1.4 Appropriate non-\nverbal\ncommunication is\nused\n1.5 Appropriate lines of\ncommunication\nwith supervisors\nand colleagues\nare identified and\nfollowed\n1.6 Defined workplace\n procedures for the\nlocation and\nstorage of\ninformation are\nused\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/ Interacting\nwith people of\nvarious levels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n19 Interpersonal skills in\nthe workplace\n2.0 Active-listening skills\n\n--- PDF PAGE 7 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n1.7 Personal\ninteraction is\ncarried out clearly\nand concisely\n\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices\nand instructions\nare read and\ninterpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are\nfollowed based on\nestablished\nprocedures\n2.3 Feedback is given\nto workplace\nsupervisor based\ninstructions/\ninformation\nreceived\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters\nconcerning\nconditions of\nemployment are\nsought and asked\nfrom appropriate\n sources\n2.6 Meetings\noutcomes are\ninterpreted and\nimplemented\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace meetings\nand discussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Basic\nquestioning/querying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n\n--- PDF PAGE 8 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Complete\nrelevant\nwork-\nrelated\ndocuments\n3.1 Range of forms\nrelating to\nconditions of\nemployment are\ncompleted\naccurately and\nlegibly\n3.2 Workplace data is\nrecorded on\nstandard\nworkplace forms\nand documents\n3.3 Errors in recording\ninformation on\nforms/ documents\nare identified and\nacted upon\n3.4 Reporting\nrequirements to\nsupervisor are\ncompleted\naccording to\norganizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n\n3.1 Completing work-\nrelated documents\n3.2 Applying operations\nof addition,\nsubtraction, division\nand multiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 9 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nsources\nMay include:\n1.1.\nTeam members\n1.2.\nSupervisor/Department Head\n1.3.\nSuppliers\n1.4.\nTrade personnel\n1.5.\nLocal government\n1.6.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation dissemination\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace-to-face communication\n2.7.\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace\ninteractions\nMay include:\n4.1.\nFace-to-face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic means, memos,\ninstruction and forms\n4.5.\nNon-verbal including gestures, signals, signs\nand diagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 10 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using workplace communication\nequipment/systems\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Notebook\n2.4. Writing materials\n2.5. Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Interview\n3.3. Written test\n3.4. Third-party report\n\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the\nactual workplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 7\n\n UNIT OF COMPETENCY: WORK IN A TEAM ENVIRONMENT\n\n UNIT CODE : 400311211\n\n UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to\n\nidentify one’s roles and responsibilities as a member of\na team.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team\nparameters,\nreporting\nrelationships and\nresponsibilities\nare identified from\nteam discussions\nand appropriate\nexternal sources\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles\nand\nresponsibilities\nwithin the team\nenvironment are\nidentified\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities\nare identified\nbased on team\ndiscussions and\nappropriate\nexternal sources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n--- PDF PAGE 12 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 8\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Work as a\nteam\nmember\n3.1 Effective and\nappropriate\nforms of\ncommunications\nare used and\ninteractions\nundertaken with\nteam members\nbased on\ncompany\npractices.\n3.2 Effective and\nappropriate\ncontributions\nmade to\ncomplement\nteam activities\nand objectives,\nbased on\nworkplace\ncontext\n3.3 Protocols in\nreporting are\nobserved based\non standard\ncompany\npractices.\n3.4 Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding\nof team’s role\nand objectives\n\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning and\n decision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace context\n\n3.1 Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as\na group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\nMay include:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 14 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 10\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n3.4 Socio-drama and socio-metric methods\n3.5 Sensitivity techniques\n3.6 Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task is being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 11\n\nUNIT OF COMPETENCY :\nSOLVE/ADDRESS GENERAL WORKPLACE\nPROBLEMS\n\nUNIT CODE : 400311212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired\nto\napply problem-solving\ntechniques\nto\ndetermine the origin of problems and plan for their\nresolution. It also includes addressing procedural\nproblems through documentation, and referral.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems\nor procedural\nproblem areas\nare identified\n1.2 Problems to be\ninvestigated are\ndefined and\ndetermined\n1.3 Current conditions\nof the problem are\nidentified and\ndocumented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk practices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying\ncurrent industry\nhardware and\nsoftware products\nand services\n1.2 Identifying\ncurrent industry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n\n--- PDF PAGE 16 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential\nsolutions to\nproblem are\nidentified\n2.2 Recommendatio\nns about\npossible\nsolutions are\ndeveloped,\ndocumented,\nranked and\npresented to\nappropriate\nperson for\ndecision\n2.1 Current industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating\nsystems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating system\n2.4 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation\nof solutions are\nplanned\n3.2 Evaluation of\nimplemented\nsolutions are\nplanned\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to\nappropriate\nperson for\nconfirmation\n\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat recommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 17 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and\nincidents\n1.5\n Work-related problems outside of own work\narea\n\n2. Appropriate person\nMay include:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 18 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 14\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends solutions\nto problems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n\n2. Resource\nImplications\n2.1. Assessment will require access to a workplace over an\nextended period, or a suitable method of gathering\nevidence of operating ability over a range of situations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nCase Formulation\n3.2\nLife Narrative Inquiry\n3.3\nStandardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 19 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 15\nUNIT OF COMPETENCY :\nDEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n : 400311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice,\nand boosting self-confidence and developing self-\nregulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the\nface of setbacks and\nfrustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined\n\n1.1 Self-\nmanagement\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling\nnegative\nemotions and\nunpleasant\nsituation in the\nworkplace\nsuch as\nfrustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing properly\none’s emotions\nand recognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n--- PDF PAGE 20 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Develop\nreflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\nassessment\nstrategies and\nteacher feedback\nare contemplated\n2.2 Progress when\nseeking and\nresponding to\nfeedback from\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and\ndecision-making\nstrategies and\nfeedback from peers\nand teachers are\npredicted\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’\nReflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\nConclusion,\nand Action\nplan)\n2.1 Using the basic\nSWOT analysis\nas self-\nassessment\nstrategy\n2.2 Developing\nreflective practice\nthrough\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able to\naccept\nchallenges\n\n3. Boost self-\nconfidence and\ndevelop self-\nregulation\n3.1 Efforts for continuous\nself-improvement are\ndemonstrated\n3.2 Counter-productive\ntendencies at work\nare eliminated\n3.3 Positive outlook in life\nare maintained.\n3.1 Four\ncomponents of\nself-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g.,\n7 Habits by\nStephen Covey,\ntransactional\nanalysis,\npsycho-spiritual\nconcepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting, conversing\nskills\n\n3.2 Showing affective\nskills – flexibility,\nadaptability, etc.\n\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 21 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 17\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include:\n1.1\nSeeking assistance in the form of job coaching or\nmentoring\n1.2\nContinuing dialogue to tackle workplace grievances\n1.3\nCollective negotiation/bargaining for better working\nconditions\n1.4\nShare your goals to improve with a trusted co-worker or\nsupervisor\n1.5\nMake a negativity log of every instance when you catch\nyourself complaining to others\n1.6\nMake lists and schedules for necessary activities\n2. Unpleasant\nsituation\nMay include:\n2.1\nJob burn-out\n2.2\nDrug dependence\n2.3\nSulking\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-discipline\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to workplace and resource s\n2.2. Case studies\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration or simulation with oral questioning\n3.2. Case problems involving work improvement and\nsustainability issues\n3.3. Third-party report\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 22 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 18\nUNIT OF COMPETENCY :\nCONTRIBUTE TO WORKPLACE INNOVATION\n\n UNIT CODE\n :\n400311214\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\n\nrequired to make a pro-active and positive\n\ncontribution to workplace innovation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nopportunities\nto do things\nbetter\n1.1 Opportunities for\nimprovement are\nidentified\nproactively in own\narea of work.\n1.2 Information are\ngathered and\nreviewed which\nmay be relevant to\nideas and which\nmight assist in\ngaining support for\nidea.\n1.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n1.2 Positive impacts\nand challenges in\ninnovation.\n1.3 Types of changes\nand responsibility.\n1.4 Seven habits of\nhighly effective\npeople.\n\n1.1 