  "source_text": ":\n\nAmbiance\n\ngeneral mood or atmosphere characterized by lighting, music,\ndesign and symmetry of furniture\n\nBiodegradable waste\nany product that can be easily broken down naturally by water,\noxygen, the sun's rays, radiation, or microorganisms.\n\nBussing\n Term used for clearing and resetting tables after guests have\nleft. In busier restaurants, this is done by the busboy also\ncalled a busser.\n\nCondiments\n\nthese are added to food to enhance flavor of dishes\n\nDecoy System\na system of stacking similar sized and shaped items together.\n\nIt is designed to help efficiently sort soiled dishes before they\n\nare loaded into the dishwasher\n\nDocket System\na kitchen order ticket or bill control system used in food and\n\nbeverage enterprises to document and track food orders.\n\nIt contains details related to the table number, items ordered,\n\nand their quantity.\n\nEmpathy\n\nthe ability to understand and share the feelings of another\nperson\n\nEnterprise\n a business or company; may refer to a hotel, restaurant, bar, or\nany related food and beverage establishment.\n\nErgonomics\n the study of people in their working environment. The use of\nergonomic principles eliminates discomfort and risk of injury in\nthe workplace, thus, increasing efficiency and productivity.\n\nHandover\n an act of giving something or passing on of information to\nanother’s possession or control; the transfer of responsibility\nand accountability. This is synonymous to “Endorsement”\n\nIntoxicated\n\na state wherein a person is affected by alcohol where physical\nand mental control is diminished\n\nLiaise\n\nthe act of coordinating to relevant persons or departments and\nestablishing a good working relationship with them\n\nMenu\n\nconsist of list of food and beverage offerings in a restaurant to\nhelp diners make ordering decisions\n\nMise en place (MEEZ ahn plahs) a French term that means “to put in place”. It describes\nthe advance preparation before the doors open for business. In\nservice, this refers to setting up everything that is needed\nbefore the service starts for a smooth flow of the operation.\n\n--- PDF PAGE 123 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023\n119\n\nNon-Biodegradable\n Waste which cannot be decomposed or degraded by the\nbiological process\n\nPoint of sale (POS)\n the hardware and software that enables the business to\noperate more efficiently and effectively. The POS system in\nthe restaurant can be used for taking orders, inventory\nmanagement, menu optimization and payment reporting and\nprocessing.\n\nReplenish\n\nthe process of filling-up or restocking items\n\nReservations\n\nan arrangement to secure a dining space/table ahead of time\nin a restaurant or dining facility\n\n3 bucket system\nThis is a procedure for washing, rinsing, and sanitizing\n\nwhere a different bucket and sponge or mop is used for\n\neach task\n\nUpsell\n\na sales technique used to increase or upgrade purchases of\nguests\n\nWaiter Station\n\nAlso known as the service station; the waiter's station is a\ntable or a drawer set up in a restaurant that contains the\nnecessary items to assist the staff in the performance of their\nduties.\n\n--- PDF PAGE 124 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023\n120\n\nREFERENCES:\n\n1) https://www.advantagechemical.com/resources/everything-warewashing\n2) https://www.coursehero.com/file/p37rcib5/The-following-are-the-four-main-types-of-\ndocket-system-used-in-most-hotel/\n3) https://www.advantagechemical.com/resources/everything-warewashing\n4) https://www.thebalancesmb.com/glossary-of-terms-2888526\n5) ASEAN Tool box\n\n--- PDF PAGE 125 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 121",
