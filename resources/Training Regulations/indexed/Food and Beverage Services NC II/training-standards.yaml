      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall provide Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: FOOD AND BEVERAGE SERVICES\n\nNC Level: II\n\nNominal Training Duration: 37 Hrs. (Basic)\n 28 Hrs. (Common)\n\n 164 Hrs. (Core)\n 229 Hours\n 114.5 Hours - Supervised Industry Learning (SIL)\n\nCourse Description:\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude as a food and beverage service attendant or waiter in preparing the dining room area\nfor guests, providing food and beverage services to guests, closing dining room/restaurant\narea and providing room service in accordance with industry standards in various restaurants\nor dining establishments. This includes classroom learning activities and practical work in the\nactual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 87 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 83\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 88 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 84\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork-related\ndocuments\n•\nDescribe Communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people of\nsocial range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work-related documents\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 89 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 85\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work in a team\nenvironment\n2.1 Describe team role\nand scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the\ndifferent sources of information\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n2.2 Identify one’s role\nand responsibility\nwithin team\n•\nRole play:\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play: Communication protocols\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n3. Solve/address\ngeneral\nworkplace\nproblems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Analyze routine/procedural problems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n3.2 Look for solutions\nto routine problems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n1 hour\n\n--- PDF PAGE 90 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 86\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems\nand document procedures for reporting\n• Standardized\ntest\n\n3.1 Recommend\nsolutions to\nproblems\n• Discuss standard operating procedures\nand documentation processes\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n4. Develop career\nand life decisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management strategies\nthat assist in regulating behavior and\nachieving personal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger,\nworry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\nprofessional\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal and\ncareer goals\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n\n--- PDF PAGE 91 ---\nFOOD AND BEVERAGE SERVICES NC II - TRSFBS221 Promulgated November 13, 2023 87\nUnit of