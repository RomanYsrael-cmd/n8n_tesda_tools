  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of PEST MANAGEMENT\n(VEGETABLES) NC II, the candidate must demonstrate competence in\nall the units listed in Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2.\nThe qualification of PEST MANAGEMENT (VEGETABLES) NC II may\nbe attained through accumulation of Certificates of Competency\n(COCs) in the following areas:\n\n4.2.1. Conduct field assessment\n4.2.2. Apply bio-control measures\n4.2.3. Apply cultural management strategies\n4.2.4. Apply physical control measures\n4.2.5. Apply chemical control measures\n4.2.6. Monitor results of control activities and provide feedback\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs).\n\n4.3.\nUpon accumulation and submission of all COCs required for the\nrelevant units of competency comprising this qualification, an individual\nshall be issued the corresponding National Certificate.\n4.4.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.5.\nThe following are qualified to apply for assessment and certification:\n\n4.5.1. Graduates of formal, non-formal and informal including\nenterprise-based training programs\n\n4.5.2. Experienced Workers (wage employed or self-employed)\n\n4.6.\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 76 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n74\n"
}
