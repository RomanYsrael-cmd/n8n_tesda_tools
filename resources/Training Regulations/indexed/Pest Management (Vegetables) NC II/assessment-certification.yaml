      "text": "6. The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 76 --- ____________________________________________________ TR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007 74 COMPETENCY MAP FOR PEST MANAGEMENT (VEGETABLES) Conduct field assessment Apply bio-control measures Apply cultural management strategies Apply physical control measures Apply chemical control measures Monitor results of pest management activities and provide feedback Apply Safety Measures In Farm Operations Use Farm Tools and Equipment Perform Estimation and Basic Calculation Receive and respond to workplace communication Work with others Demonstrate work values Practice housekeeping procedures Participate in workplace communication Work in a team environment Practice career professionalism Practice occupational health and safety procedures Lead workplace communication Lead small teams Develop and practice negotiation skills Solve problems related to work activities Use mathematical concepts and techniques Use relevant technologies Utilize specialized communication skills Develop teams and individuals Apply problem solving techniques in the workplace Plan and organize work Collect, analyze and organize information Promote environmental protection --- PDF PAGE 77 --- ____________________________________________________ TR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007 75 Beneficial organisms - organisms such as parasite, predator, pollinators and volunteer or cultivated plants that out-compete the weeds, insects and other non- vertebrates, and micro organisms that attack the weeds. Biological control - the use of living organisms such as parasites, predators, among others, to control pests Botanical pesticides – indigenous plants with insecticidal properties that are used to control pests Chemical – substance that is used to control pests Chemical control – strategy for controlling pests employing the use of pesticides Crop rotation – the practice of planting two or more crops in a regular succession such that the crop that is susceptible to a serious pest is replaced with another crop that is not susceptible, on a rotating basis. Cultural management strategy – in relation to pest management refers to the modification of the environment to lessen the area’s attractiveness to pests Disease - results from the interaction of three factors: a susceptible host, a pathogen (disease causing organism) and a favorable environment. It may be caused by parasitic (e.g. fungi, bacteria, virus, mycoplasma, nematodes, and flowering parasitic plants) and non-parasitic (e.g. lack or excess nutrients, unfavorable soil-weather relations) factors Furrowing - the final step in land preparation by making furrows or beds for planting Hilling up - the process of covering the applied fertilizer material by raising the soil towards the base of the plant to stabilize its stand for better plant growth Insect pest – a destructive or harmful insect Integrated pest management (IPM) - a sustainable approach to managing pests by combining biological, cultural, physical and chemical tools in a way that minimizes economic, health, and environmental risks (National IPM Network) Intercropping - the practice of cultivating two or more crops in the same space at the same time Irrigation – any method of supplying water to the plant to sustain growth --- PDF PAGE 78 --- ____________________________________________________ TR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007 76 Land preparation - process of readying the soil prior to planting to enhance the successful establishment of the crop Mulching – the process of covering the soil around the stem of a growing plant with organic materials, plastic or other materials mainly to conserve soil moisture, prevent soil erosion, suppress weed growth, prevent soil-borne diseases Natural enemy – a beneficial insect or organism used for the control of insect pests Pest - a living organism that has a damaging effect on plants and animals. It includes insect pests, weeds, diseases, others (e.g. rats, birds, slugs, domestic animals) Pest management - strategy of maintaining pest populations below the economic injury level through the use of any control measures that are ecologically, economically and socially acceptable Pesticide - any substance or mixture of substances intended for preventing, destroying, repelling, or mitigating any pest Physical control – also known as mechanical control, involve the use of barriers, traps, or physical removal to prevent or reduce pest problems. Pruning – the removal of diseased or weak parts of plants Repellent crops – crops which repel destructive pests Resistant variety – crop variety that can resist the adverse effects of pests and unfavorable weather conditions Sanitation - keeping the area clean of plants or materials that may harbor pests Smudging - burning of plant debris to create a cleansing smoke bath Thinning - the removal of undesirable plants Tillage - the mechanical manipulation of the soil Trap crops - alternate crops planted in an area to attract destructive pests and reduce their impact on the specific crop Weed - any undesirable plant Wrapping - the practice of putting protective on the produce cover to protect them from being attacked by pests. May include the use of newspapers, plastics, and other materials. --- PDF PAGE 79 --- ____________________________________________________ TR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007 77 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies and labor groups who donated their time and expertise to the development and validation of these Training Regulations. PHILIPPINE CHAMBER OF AGRICULTURE AND FOOD, INC. (PCAFI) DR. RODOLFO ESTIGOY Chief Bureau of Postharvest Research and Extension Central Luzon State University, Science City of Muñoz, Nueva Ecija MR. ALEJANDRO T. ESCANO President Philippine Chamber of Agriculture and Food, Inc. MFI Bldg., Ortigas Avenue Extension, Pasig City MR. EDWIN ANDOT President Chamber of Agriculture, Fisheries and Food in Northern Mindanao 2nd Floor, United Way Bldg. Capitol Compound, Cagayan de Oro City DR. ALMA DELA CRUZ Professor Central Luzon State University Science City of Muñoz, Nueva Ecija Mr. Damaso Callo, Jr. Project Specialist ASEAN IPM Knowledge Center Dr. Rodel Maghirang Program Coordinator GMA High Value Commercial Crops Program, Department of Agriculture Mr. Oscar Edralin Field Development Supervisor DuPont Crop Protection Mr. Nap Saavedra Vice President Technical Development Syngenta Philippines, Inc. Mr. Peter Magdaraog Agriculturist II Crop Research Division, Bureau of Plant Industry The Participants in the National Validation of this Training Regulation: Bureau of Plant Industry Eastwest Seed Co. CropKing Chemicals Inc. Harbest Agribusiness Corp. Crop Protection Cluster, National Crop Protection Center, UP Los Baños Philippine Fruit and Vegetable Industries / Department of Agrarian Reform Department of Agriculture – RFU 5 UP Los Baños Pahinungod The Management and Staff of the TESDA Secretariat • QSO"
