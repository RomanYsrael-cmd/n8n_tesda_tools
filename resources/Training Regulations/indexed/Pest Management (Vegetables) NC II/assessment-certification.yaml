  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of PEST MANAGEMENT\n(VEGETABLES) NC II, the candidate must demonstrate competence in\nall the units listed in Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2.\nThe qualification of PEST MANAGEMENT (VEGETABLES) NC II may\nbe attained through accumulation of Certificates of Competency\n(COCs) in the following areas:\n\n4.2.1. Conduct field assessment\n4.2.2. Apply bio-control measures\n4.2.3. Apply cultural management strategies\n4.2.4. Apply physical control measures\n4.2.5. Apply chemical control measures\n4.2.6. Monitor results of control activities and provide feedback\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs).\n\n4.3.\nUpon accumulation and submission of all COCs required for the\nrelevant units of competency comprising this qualification, an individual\nshall be issued the corresponding National Certificate.\n4.4.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.5.\nThe following are qualified to apply for assessment and certification:\n\n4.5.1. Graduates of formal, non-formal and informal including\nenterprise-based training programs\n\n4.5.2. Experienced Workers (wage employed or self-employed)\n\n4.6.\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 76 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n74\nCOMPETENCY MAP FOR PEST MANAGEMENT (VEGETABLES)\n\nCORE COMPETENCIES\n\nConduct field\nassessment\n\nApply bio-control\nmeasures\n\nApply cultural\nmanagement\nstrategies\n\nApply physical control\nmeasures\n\nApply chemical\ncontrol measures\n\nMonitor results of\npest management\nactivities and\nprovide feedback\n\nCOMMON COMPETENCIES\n\nApply Safety\nMeasures In Farm\nOperations\n\nUse Farm Tools and\nEquipment\n\nPerform Estimation and\nBasic Calculation\n\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\n\nWork\nwith\nothers\n\nDemonstrate\nwork values\n\nPractice\nhousekeeping\nprocedures\n\nParticipate in\nworkplace\ncommunication\n\nWork in a\nteam\nenvironment\n\nPractice career\nprofessionalism\n\nPractice\noccupational\nhealth and\nsafety\nprocedures\n\nLead\nworkplace\ncommunication\n\nLead small\nteams\n\nDevelop and\npractice\nnegotiation\nskills\n\nSolve\nproblems\nrelated\nto work\nactivities\n\nUse\nmathematical\nconcepts and\ntechniques\n\nUse relevant\ntechnologies\n\nUtilize\nspecialized\ncommunication\nskills\n\nDevelop\nteams and\nindividuals\n\nApply problem\nsolving\ntechniques in the\nworkplace\n\nPlan and\norganize\nwork\n\nCollect,\nanalyze and\norganize\ninformation\n\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 77 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n75\n\nDEFINITION OF TERMS\n\nBeneficial organisms - organisms such as parasite, predator, pollinators and\nvolunteer or cultivated plants that out-compete the weeds, insects and other non-\nvertebrates, and micro organisms that attack the weeds.\n\nBiological control - the use of living organisms such as parasites, predators,\namong others, to control pests\n\nBotanical pesticides – indigenous plants with insecticidal properties that are used\nto control pests\n\nChemical – substance that is used to control pests\n\nChemical control – strategy for controlling pests employing the use of pesticides\n\nCrop rotation – the practice of planting two or more crops in a regular succession\nsuch that the crop that is susceptible to a serious pest is replaced with another crop\nthat is not susceptible, on a rotating basis.\n\nCultural management strategy – in relation to pest management refers to the\nmodification of the environment to lessen the area’s attractiveness to pests\n\nDisease - results from the interaction of three factors: a susceptible host, a pathogen\n(disease causing organism) and a favorable environment. It may be caused by\nparasitic (e.g. fungi, bacteria, virus, mycoplasma, nematodes, and flowering parasitic\nplants) and non-parasitic (e.g. lack or excess nutrients, unfavorable soil-weather\nrelations) factors\n\nFurrowing - the final step in land preparation by making furrows or beds for\nplanting\n\nHilling up - the process of covering the applied fertilizer material by raising the soil\ntowards the base of the plant to stabilize its stand for better plant growth\n\nInsect pest – a destructive or harmful insect\n\nIntegrated pest management (IPM) - a sustainable approach to managing pests\nby combining biological, cultural, physical and chemical tools in a way that minimizes\neconomic, health, and environmental risks (National IPM Network)\n\nIntercropping - the practice of cultivating two or more crops in the same space at\nthe same time\n\nIrrigation – any method of supplying water to the plant to sustain growth\n\n--- PDF PAGE 78 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n76\nLand preparation - process of readying the soil prior to planting to enhance the\nsuccessful establishment of the crop\n\nMulching – the process of covering the soil around the stem of a growing plant with\norganic materials, plastic or other materials mainly to conserve soil moisture, prevent\nsoil erosion, suppress weed growth, prevent soil-borne diseases\n\nNatural enemy – a beneficial insect or organism used for the control of insect pests\n\nPest - a living organism that has a damaging effect on plants and animals. It\nincludes insect pests, weeds, diseases, others (e.g. rats, birds, slugs, domestic\nanimals)\n\nPest management - strategy of maintaining pest populations below the economic\ninjury level through the use of any control measures that are ecologically,\neconomically and socially acceptable\n\nPesticide - any substance or mixture of substances intended for preventing,\ndestroying, repelling, or mitigating any pest\n\nPhysical control – also known as mechanical control, involve the use of barriers,\ntraps, or physical removal to prevent or reduce pest problems.\n\nPruning – the removal of diseased or weak parts of plants\n\nRepellent crops – crops which repel destructive pests\n\nResistant variety – crop variety that can resist the adverse effects of pests and\nunfavorable weather conditions\n\nSanitation - keeping the area clean of plants or materials that may harbor pests\n\nSmudging - burning of plant debris to create a cleansing smoke bath\n\nThinning - the removal of undesirable plants\n\nTillage - the mechanical manipulation of the soil\n\nTrap crops - alternate crops planted in an area to attract destructive pests and\nreduce their impact on the specific crop\n\nWeed - any undesirable plant\n\nWrapping - the practice of putting protective on the produce cover to protect them\nfrom being attacked by pests. May include the use of newspapers, plastics, and\nother materials.\n\n--- PDF PAGE 79 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n77\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of these Training Regulations.\n\nPHILIPPINE CHAMBER OF AGRICULTURE AND FOOD, INC. (PCAFI)\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\n\nDR. RODOLFO ESTIGOY\nChief\nBureau of Postharvest Research and\nExtension\nCentral Luzon State University, Science City\nof Muñoz, Nueva Ecija\nMR. ALEJANDRO T. ESCANO\nPresident\nPhilippine Chamber of Agriculture and Food,\nInc.\nMFI Bldg., Ortigas Avenue Extension, Pasig\nCity\n\nMR. EDWIN ANDOT\nPresident\nChamber of Agriculture, Fisheries and Food\nin Northern Mindanao\n2nd Floor, United Way Bldg.\nCapitol Compound, Cagayan de Oro City\n\nDR. ALMA DELA CRUZ\nProfessor\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\n\nMr. Damaso Callo, Jr.\nProject Specialist\nASEAN IPM Knowledge Center\nDr. Rodel Maghirang\nProgram Coordinator\nGMA High Value Commercial Crops\nProgram, Department of Agriculture\n\nMr. Oscar Edralin\nField Development Supervisor\nDuPont Crop Protection\n\nMr. Nap Saavedra\nVice President\nTechnical Development\nSyngenta Philippines, Inc.\nMr. Peter Magdaraog\nAgriculturist II\nCrop Research Division,\nBureau of Plant Industry\n\nThe Participants in the National Validation of this Training Regulation:\n\nBureau of Plant Industry\nEastwest Seed Co.\nCropKing Chemicals Inc.\nHarbest Agribusiness Corp.\nCrop Protection Cluster,\nNational Crop Protection Center,\nUP Los Baños\nPhilippine Fruit and Vegetable Industries /\nDepartment of Agrarian Reform\nDepartment of Agriculture – RFU 5\nUP Los Baños Pahinungod\n\nThe Management and Staff of the TESDA Secretariat\n\n•\nQSO"
