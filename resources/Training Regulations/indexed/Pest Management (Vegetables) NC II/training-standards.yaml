      "source_text": "3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements:\n•\nAbility to communicate, both orally and in writing; and\n•\nPhysically fit and mentally healthy as certified by a Public Health\nOfficer.\n\n4.1 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n PEST MANAGEMENT (VEGETABLES) NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Pest Management for Vegetables NC II.\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n\n5 pcs\n\nMeasuring cup\n\n5 pcs\n\nKnapsack sprayer\n5\ndifferent\nsamples\n vegetables\n10 pcs\nShovel\n1pc\nPower sprayer\n5\ndifferent\nsamples\npests\n5 pcs\nLight hoe\n1unit\nMower\n5\ndifferent\nsamples\nrepellant and\ntrap crops\n\n25 pcs\n\nBolo\n1 unit\nTractor/carabao\n5\ndifferent\nsamples\nbeneficial\norganisms\n1 pc\nHarrow\n\n25 pcs\nProtective\neyewear\n1 pc\nAnimal-drawn\nplow\n\n25 pairs\nRubber boots\n1 pc\nDisc plow\n\n25 pairs\nGloves\n5 pcs Cutting tools\n1unit\nOverhead\nprojector/LCD\nprojector\n25 pcs\nMask\n5 sets\nDigging tools\n5 units\nComputer\n25 pcs\nHearing\nprotection\n5 sets\nKnife\n\n5 pcs\nCatching nets\n5 pcs\nPruning shears\n\nOTHERS\n\nBotanical\npesticides\n25 pcs\nTrowel\n1 lot\nStorage area\n5 bottles\nFungicides\n25 pcs\nSprinklers\n\n5 bottles\nInsecticides\n15 pcs\nRake\n\nCleaning\nagents (e.g.\ndetergent,\nsoap)\n10 pcs Broomstick\n5 pcs\nCloth\n\n--- PDF PAGE 73 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n71\n5 pcs\nContainer\n5 sacks\nMulching\nmaterials\n25 pcs Hat\n\nLEARNING\nMATERIALS\n3 sacks\nRice hull\n2 pcs\nStorage\ntools/cabinet\n\nInstructional\nsupplies and\nmaterials\n5 pcs\nPail\n10 pcs\nScissors\n\nReference\nmaterials / books\n3 rolls\nRope\n5 pcs\nCalculator\n\nVisual aids\n250 pcs\nAgri bags,\nplastic\n\nProcedural\nmanuals\n\n5 pcs\nMarking pens\n\n25 pcs\nPens\n\n25 pcs\n