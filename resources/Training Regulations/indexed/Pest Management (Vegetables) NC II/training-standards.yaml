      "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider\nwhen\ndesigning\ntraining\nprograms\nfor\nPEST\nMANAGEMENT\n(VEGETABLES) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PEST MANAGEMENT ( VEGETABLES) NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n 14 Hours (Common)\n 280 Hours (Core)\n 312 Total Hours\nCourse Description:\n\nThe PEST MANAGEMENT (VEGETABLES) NC II Qualification consists of\ncompetencies that a person must achieve in vegetable pest management in both\nbackyard and commercial farms. It covers the basic, common and core\ncompetencies.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n•\nGroup\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 68 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n66\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate safety\nmeasures\n1.3. Safekeep/maintain/\ndispose tools, materials\nand outfit.\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use farm\ntools\n2.2. Prepare and operate\nfarm equipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation\nand\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n3.3. Apply corrective\nmeasures as necessary\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nExercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 69 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n67\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\n\nAssessment\nApproach\n\n1. Conduct field\nassessment\n\n1.1. Assess the area\n1.2. Identify the pest and\ntheir natural enemies,\nand other beneficial\norganisms\n1.3. Collect data related to\nnatural enemy\npopulations and pest\ninfestations\n1.4. Maintain records and\nprovide feedback\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n2. Apply bio-\ncontrol\nmeasures\n2.1. Identify target pests\nand their natural\nenemies, and other\nbeneficial organisms\n2.2. Select the bio-control\nactivities and prepare\nfor their\nimplementation\n2.3. Implement control\nactivities\n2.4. Check performance of\ncontrol activities\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n4. Apply cultural\nmanagement\nstrategies\n\n3.1. Identify target pests\nand their natural\nenemies, and other\nbeneficial organisms\n3.2. Select the cultural\nmanagement\nstrategies and prepare\nfor their\nimplementation\n3.3. Implement control\nactivities\n3.4. Check performance of\ncontrol activities\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n\n--- PDF PAGE 70 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n68\n4. Apply physical\ncontrol\n4.1. Identify target pests\nand their natural\nenemies, and other\nbeneficial organisms\n4.2. Select the physical\ncontrol measures and\nprepare for their\nimplementation\n4.3. Implement control\nactivities\n4.4. Check performance of\ncontrol activities\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n5.Apply chemical\ncontrol\n5.1. Identify the target\npests and their natural\nenemies\n5.2. Select the appropriate\nchemical\n5.3. Prepare for the\napplication of the\nchemical\n5.4. Apply chemical\n5.5. Clean up following\napplication\n5.6. Record chemical\ncontrol activities\n5.7. Transport, handle and\nstore chemicals\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n6. Monitor results\nof pest\nmanagement\nactivities and\nprovide\nfeedback\n6.1. Check performance of\ncontrol activities\n6.2. Address performance\nof control activities\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n\n--- PDF PAGE 71 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n69\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\no The training is based on curriculum developed from the\ncompetency standards;\no Learning is modular in its structure;\no Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\no Training is based on work that must be performed;\no Training materials are directly related to the competency\nstandards and the curriculum modules;\no Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\no Training program allows for recognition of prior learning (RPL)\nor current competencies;\no Training allows for multiple entry and exit; and\no Training programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\no The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\no Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\no Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\no Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\no Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\no Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate\nprojects that have real world applications.\n\n--- PDF PAGE 72 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n70\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements:\n•\nAbility to communicate, both orally and in writing; and\n•\nPhysically fit and mentally healthy as certified by a Public Health\nOfficer.\n\n4.1 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n PEST MANAGEMENT (VEGETABLES) NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Pest Management for Vegetables NC II.\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n\n5 pcs\n\nMeasuring cup\n\n5 pcs\n\nKnapsack sprayer\n5\ndifferent\nsamples\n vegetables\n10 pcs\nShovel\n1pc\nPower sprayer\n5\ndifferent\nsamples\npests\n5 pcs\nLight hoe\n1unit\nMower\n5\ndifferent\nsamples\nrepellant and\ntrap crops\n\n25 pcs\n\nBolo\n1 unit\nTractor/carabao\n5\ndifferent\nsamples\nbeneficial\norganisms\n1 pc\nHarrow\n\n25 pcs\nProtective\neyewear\n1 pc\nAnimal-drawn\nplow\n\n25 pairs\nRubber boots\n1 pc\nDisc plow\n\n25 pairs\nGloves\n5 pcs Cutting tools\n1unit\nOverhead\nprojector/LCD\nprojector\n25 pcs\nMask\n5 sets\nDigging tools\n5 units\nComputer\n25 pcs\nHearing\nprotection\n5 sets\nKnife\n\n5 pcs\nCatching nets\n5 pcs\nPruning shears\n\nOTHERS\n\nBotanical\npesticides\n25 pcs\nTrowel\n1 lot\nStorage area\n5 bottles\nFungicides\n25 pcs\nSprinklers\n\n5 bottles\nInsecticides\n15 pcs\nRake\n\nCleaning\nagents (e.g.\ndetergent,\nsoap)\n10 pcs Broomstick\n5 pcs\nCloth\n\n--- PDF PAGE 73 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n71\n5 pcs\nContainer\n5 sacks\nMulching\nmaterials\n25 pcs Hat\n\nLEARNING\nMATERIALS\n3 sacks\nRice hull\n2 pcs\nStorage\ntools/cabinet\n\nInstructional\nsupplies and\nmaterials\n5 pcs\nPail\n10 pcs\nScissors\n\nReference\nmaterials / books\n3 rolls\nRope\n5 pcs\nCalculator\n\nVisual aids\n250 pcs\nAgri bags,\nplastic\n\nProcedural\nmanuals\n\n5 pcs\nMarking pens\n\n25 pcs\nPens\n\n25 pcs\nPencils\n\n25 pcs\nNotebooks\n\n5 reams\nBond paper\n\n3 dozens Paper clips\n\n1 kit\nFirst aide\nsupplies/\nmedicine\n\n3.5 TRAINING FACILITIES\n\n PEST MANAGEMENT (VEGETABLES) NC II\n\nBased on a class size of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN SQ.\nMETERS\nA. Building\n(permanent)\n\n• Student/Trainee\nWorking Space\n2.00 x 2.00 per\nstudent trainee\n\n4.00 per student\n\n100.00\n•\nLecture Room\n7.00 x 5.00\n35.00\n35.00\n• Learning Resource\nCenter (Library)\n3.00 x 5.00\n15.00\n15.00\n• Facilities/Equipment/\nCirculation Area\n(30% of teaching\naccommodation)\n\n39.30\n•\nStore room\n4.00 x 4.00\n16.00\n16.00\nB. Experimental Land\nArea (Vegetable\nFarm)*\n5.00 per student\ntrainee\n125.00\n125.00\n* Experimental area may vary depending on availability of land and type of vegetable.\n\n--- PDF PAGE 74 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n72\n\n3.6 TRAINER’S QUALIFICATIONS FOR PEST MANAGEMENT\n (VEGETABLES) NC II\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Pest Management for Vegetables NC II or its equivalent\n• Must have undergone training on Training Methodology II (TM II) or\nequivalent in training/experience\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issue by the Professional Regulatory Commission)\n\n* Optional: Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004-03\n\n3.7.\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 75 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n73"
