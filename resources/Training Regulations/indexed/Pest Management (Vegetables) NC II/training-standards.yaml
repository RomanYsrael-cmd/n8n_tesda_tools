    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: PEST MANAGEMENT ( VEGETABLES) NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n 14 Hours (Common)\n 280 Hours (Core)\n 312 Total Hours\nCourse Description:\n\nThe PEST MANAGEMENT (VEGETABLES) NC II Qualification consists of\ncompetencies that a person must achieve in vegetable pest management in both\nbackyard and commercial farms. It covers the basic, common and core\ncompetencies.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n•\nGroup\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 68 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n66\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate safety\nmeasures\n1.3. Safekeep/maintain/\ndispose tools, materials\nand outfit.\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use farm\ntools\n2.2. Prepare and operate\nfarm equipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation\nand\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n3.3. Apply corrective\nmeasures as necessary\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nExercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 69 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n67\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\n\nAssessment\nApproach\n\n1. Conduct field\nassessment\n\n1.1. Assess the area\n1.2. Identify the pest and\ntheir natural enemies,\nand other beneficial\norganisms\n1.3. Collect data related to\nnatural enemy\npopulations and pest\ninfestations\n1.4. Maintain records and\nprovide feedback\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n2. Apply bio-\ncontrol\nmeasures\n2.1. Identify target pests\nand their natural\nenemies, and other\nbeneficial organisms\n2.2. Select the bio-control\nactivities and prepare\nfor their\nimplementation\n2.3. Implement control\nactivities\n2.4. Check performance of\ncontrol activities\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n4. Apply cultural\nmanagement\nstrategies\n\n3.1. Identify target pests\nand their natural\nenemies, and other\nbeneficial organisms\n3.2. Select the cultural\nmanagement\nstrategies and prepare\nfor their\nimplementation\n3.3. Implement control\nactivities\n3.4. Check performance of\ncontrol activities\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n\n--- PDF PAGE 70 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n68\n4. Apply physical\ncontrol\n4.1. Identify target pests\nand their natural\nenemies, and other\nbeneficial organisms\n4.2. Select the physical\ncontrol measures and\nprepare for their\nimplementation\n4.3. Implement control\nactivities\n4.4. Check performance of\ncontrol activities\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n5.Apply chemical\ncontrol\n5.1. Identify the target\npests and their natural\nenemies\n5.2. Select the appropriate\nchemical\n5.3. Prepare for the\napplication of the\nchemical\n5.4. Apply chemical\n5.5. Clean up following\napplication\n5.6. Record chemical\ncontrol activities\n5.7. Transport, handle and\nstore chemicals\n\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n6. Monitor results\nof pest\nmanagement\nactivities and\nprovide\nfeedback\n6.1. Check performance of\ncontrol activities\n6.2. Address performance\nof control activities\n• Lecture/\nDiscussion\n• Direct\nobservation\n• Practical\ndemonstration\n\n• Direct\nobservation\nwith oral\nquestioning\n• Practical\ndemonstration\nwith oral\nquestioning\n• Portfolio\nassessment\n\n--- PDF PAGE 71 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n69"
