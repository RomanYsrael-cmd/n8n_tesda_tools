  "source_text": "COMPETENCY MAP FOR PEST MANAGEMENT (VEGETABLES)\n\nCORE COMPETENCIES\n\nConduct field\nassessment\n\nApply bio-control\nmeasures\n\nApply cultural\nmanagement\nstrategies\n\nApply physical control\nmeasures\n\nApply chemical\ncontrol measures\n\nMonitor results of\npest management\nactivities and\nprovide feedback\n\nCOMMON COMPETENCIES\n\nApply Safety\nMeasures In Farm\nOperations\n\nUse Farm Tools and\nEquipment\n\nPerform Estimation and\nBasic Calculation\n\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\n\nWork\nwith\nothers\n\nDemonstrate\nwork values\n\nPractice\nhousekeeping\nprocedures\n\nParticipate in\nworkplace\ncommunication\n\nWork in a\nteam\nenvironment\n\nPractice career\nprofessionalism\n\nPractice\noccupational\nhealth and\nsafety\nprocedures\n\nLead\nworkplace\ncommunication\n\nLead small\nteams\n\nDevelop and\npractice\nnegotiation\nskills\n\nSolve\nproblems\nrelated\nto work\nactivities\n\nUse\nmathematical\nconcepts and\ntechniques\n\nUse relevant\ntechnologies\n\nUtilize\nspecialized\ncommunication\nskills\n\nDevelop\nteams and\nindividuals\n\nApply problem\nsolving\ntechniques in the\nworkplace\n\nPlan and\norganize\nwork\n\nCollect,\nanalyze and\norganize\ninformation\n\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 77 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n75",
