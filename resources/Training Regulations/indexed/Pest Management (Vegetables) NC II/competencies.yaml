        "source_text": "AGR321202\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of farm\ntools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use farm\ntools\n\n1.1\nIdentified appropriate farm tools according to\nrequirement/use\n1.2\nFarm tools are checked for faults and defective tools\nreported in accordance with farm procedures\n1.3\nAppropriate tools and equipment are safely used\naccording to job requirements and manufacturers\nconditions\n2.\nSelect and operate\nfarm equipment\n2.1\nIdentify appropriate farm equipment\n2.2\nInstructional manual of the farm tools and equipment\nare carefully read prior to operation\n2.3\nPre-operation check-up is conducted in line with\nmanufacturers manual\n2.4\nFaults in farm equipment are identified and reported\nin line with farm procedures\n2.5\nFarm equipment used according to its function\n2.6\nFollowed safety procedures\n3.\nPerform preventive\nmaintenance\n3.1\nTools and equipment are cleaned immediately after\nuse in line with farm procedures\n3.2\nRoutine check-up and maintenance are performed\n3.3\nTools and equipment are stored in designated areas\nin line with farm procedures\n\n--- PDF PAGE 21 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\n\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Farm tools\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5 Measuring tools\n2.6 Garden tools\n3. Pre-operation check-up\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\n--- PDF PAGE 22 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n20\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipments according to manual\nspecification\n1.3\nPerformed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Ideal good work habits to demonstrate to workers\neasy and safety standards during operation of\nfarm equipment\n2.2 Codes and Regulations\n2.2.1 Environmental Compliance Certificate (ECG)\n2.2.2 Effective work supervision in the operations of\nfarm equipment\n\n2.3 Tools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n\n2.4 Maintenance\n2.4.1 Regular upkeep of equipment\n2.4.2 Preventive maintenance skills\n\n2.5 Values\n2.5.1 Positive outlook towards work\n2.5.2\nPossesses pre-emptive/anticipatory skills\n3.\nUnderpinning\nSkills\n3.1\nAbility to recognized defective farm equipment\n3.2\nPerform proper management practices of safety\nmeasures\n4.\nMethod of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nDirect observation\n4.2\nPractical demonstration\n4.3\nThird Party Report\n5.\nResource\nImplications\nThe following resources must be provided:\n5.1\nService/operational manual of farm tools and equipment\n5.2\n Tools and equipment\n5.3\n Farm implements\n6.\nContext of\nAssessment\n6.1\nAssessment may occur in the workplace or in a\nsimulated workplace or as part of a team under limited\nsupervision\n\n--- PDF PAGE 23 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n21\n\nUNIT TITLE:\n\nPERFORM ESTIMATION AND BASIC\nCALCULATIONS\n\nUNIT CODE:"
