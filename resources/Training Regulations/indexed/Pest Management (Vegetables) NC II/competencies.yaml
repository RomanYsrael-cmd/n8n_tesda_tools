          "source_text": ") \n1.  Assess the area  \n1.1. Field is visited for assessment according to \nfarm work procedures  \n1.2. Plant appearance and growth are observed for \npossible presence of pests and their natural \nenemies, other beneficial organisms and \nnutritional disorders according to farm work \nprocedures \n1.3. Occupational Health and Safety (OHS) \nhazards are identified, risks assessed and \nsuitable preventive measures are implemented \naccording to farm work procedures \n1.4. Environment and other relevant information \nwith regard to assessment activities are noted \nfollowing standard procedures  \n2.  Identify pests and their \nnatural enemies, and \nother beneficial \norganisms \n2.1. Pests and their natural enemies, and other \nbeneficial organisms are identified and \nrecorded in field notes according to farm work \nprocedures \n2.2. The supervisor or the pest specialist is \nconsulted as required to validate the identity of \npests and their natural enemies, and other \nbeneficial organisms in line with farm work \nprocedures\n\n--- PDF PAGE 27 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n25\n \nELEMENT \nPERFORMANCE CRITERIA \n3.  Collect data related to \nnatural enemy \npopulations and pest \ninfestations  \n3.1. Information on the identified natural enemies’ \ndensity as well as degree of pest infestation \nand severity of pest damage are gathered \naccording to farm work procedures  \n3.2. Data on the environment and other relevant \ninformation are collected in accordance with \nfarm work procedures \n3.3. Levels of infestation/severity tolerated by the \nclient, market or environment are determined \nin line with integrated pest management plan \n3.4. Professional advice is obtained as required \naccording to enterprise guidelines \n4.  Maintain records and \nprovide feedback \n4.1. \nRecords are completed and updated in line \nwith workplace procedures \n4.2. \nResults of assessment activities are \ndiscussed with the supervisor following \nstandard procedures\n\n--- PDF PAGE 28 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n26\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Farm work procedures \n \n1.1. Supervisor/s’ oral and written instructions \n1.2. Standard operating procedures \n1.3. Pest management plan \n1.4. Industry best practice guidelines on pest \nmanagement \n1.5. Good agricultural practices (GAP) \n1.6. OHS procedures \n2. Pests \n2.1. Insect pests \n2.2. Weeds \n2.3. Diseases \n2.4. Others (snails, birds,rodents, slugs, etc.)\n3. Natural enemies and \nbeneficial organisms  \n3.1. Parasites/parasitoids \n3.2. Predators  \n3.3. Pollinators  \n3.4. Repellant or refuge plants \n3.5. Micro-organisms / Entomopathogens \n4. Nutritional disorders \nDeficiencies in: \n4.1. Nitrogen  \n4.2. Phosphorus \n4.3. Potassium \n4.4. Microelements  \n5. OHS hazards   \nHazards may include:  \n5.1. body irritation \n5.2. poisoning \n5.3. solar radiation \n5.4. dust \n5.5. pollen \n5.6. soil-borne micro organisms \n5.7. noise \n5.8. chemicals and hazardous substances \n5.9. slippery or uneven surfaces \n5.10. moving equipment \n5.11. machinery and vehicles \n5.12. sharp objects\n\n--- PDF PAGE 29 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n27\n \nVARIABLE \nRANGE \n6. Environment \n6.1. Soil Fertility \n6.2. Soil Type \n6.3. Weather Conditions \n6.4. Topography \n6.5. Water, Etc. \n \n7. Other relevant \ninformation \n7.1. Crop variety \n7.2. Cropping pattern/system \n7.3. Stage of the crop \n8. Records \n8.1. Date and time of inspection \n8.2. Location \n8.3. Identity of pests and their natural enemies, \nand beneficial organisms \n8.4. Manifestations/Symptoms \n8.5. Plant parts attacked (e.g. leaf, fruit, etc.) \n8.6. Nature of damage (borer, miner, leaf \nfeeder, leaf curling, etc.) \n8.7. Extent of damage (number of plants / plots \naffected / size of area)  \n8.8. Population counts of natural enemies \n8.9. Environment (soil fertility, soil type, \nweather conditions, topography, water , \netc.)  and other relevant information (e.g.  \ncrop variety,  cropping pattern/system, \nstage of crop, etc.)\n\n--- PDF PAGE 30 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n28"
        },
        "evidence_guide": {
          "source_text": "1.  Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate: \n \n1.1. assessed the area; \n1.2. identified the range of pests present and their \nnatural enemies, and other beneficial \norganisms; \n1.3. collected data related to natural enemy \npopulations and pest infestations; and  \n1.4. maintained records and provided feedback. \n \nThe skills and knowledge required to conduct field \nassessment must be transferable to a different work \nenvironment.  For example, this may include different \nvegetables, fields/farms and pests.  \n2.  Underpinning \nKnowledge and \nAttitude \nKnowledge and understanding are essential to apply \nthis standard in the workplace, to transfer the skills to \nother contexts, and to deal with unplanned events.  \nThe knowledge requirements for this competency \nstandard are listed below: \n2.1. \nPest and natural enemy recognition, and \nother beneficial organisms \n2.2. \nRange of vegetable species/varieties \n2.3. \nIPM concepts and principles (Identification, \nbiology, behavior, population dynamics) \n2.4. \nProcedures for agro-ecosystems analysis \n(AESA) \n2.5. \nInteractions among pest infestations, natural \nenemy populations, other beneficial \norganisms, the environment and other \nrelevant information (e.g. cropping \nsystems/patterns, crop varieties and others) \n2.6. \nNutritional disorders (deficiencies in NPK and \nmicroelements) \n2.7. \nOHS risks, hazards, and prevention \n2.8. \ndata collection requirements \n2.9. \nrecord keeping requirements \n2.10. reporting requirements \n \nAttitude: \n2.11. Accuracy \n2.12. Environment-conscious \n2.13. Positive work values \n2.14. Work ethics \n2.15. Cost consciousness \n2.16. Safety consciousness\n\n--- PDF PAGE 31 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n29\n3.  Underpinning Skills \nTo achieve the performance criteria, appropriate \nliteracy and numeracy levels as well as some \ncomplementary skills are required.  These include \nthe ability to: \nLiteracy: \n3.1. \npests and natural enemy recognition, and \nother beneficial organisms \n3.2. \nsymptoms recognition \n3.3. \nfamiliarity with life cycle/biology, habitat and \ndestructive stage of pest and natural enemies \n3.4. \nfollow guidelines and procedures for \ninspection activities \n \nNumeracy: \n3.5. \ndensity count / estimation \n3.6. \ndamage degree estimation  \n3.7. \ncollect data \n3.8. \nkeep records \n \nInterpersonal:  \n3.9. \nmake oral and written reports \n3.10. communicate with farmers, team members \nand supervisor \n4.  Resource Implications \nThe following resources MUST be provided: \n4.1. vegetable farm or a simulated \nworkplace/demonstration farm \n4.2. farm procedures relating to field assessment \nactivities \n5.  Methods of \nAssessment \nCompetency must be assessed through: \n5.1. Direct observation with oral questioning \n5.2. Demonstration with oral questioning \n5.3. Portfolio assessment \n6.  Context for \nAssessment \n6.1. Assessment should be in a vegetable field or in \na simulated workplace/demo farm \n6.2. Ability to apply competency over time and on a \nnumber of occasions.",
