        "source_text": "--- PDF PAGE 63 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n61\nUNIT OF COMPETENCY:   MONITOR RESULTS OF PEST-MANAGEMENT \nACTIVITIES AND PROVIDE FEEDBACK \n \nUNIT CODE                       :        AGR321325 \n \nUNIT DESCRIPTOR:    This unit covers the skills and knowledge required for \nmonitoring the results of control activities and providing \nfeedback.  It involves checking and recording the \nperformance of control activities and addressing the \nperformance of control activities. \n \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized terms are elaborated in the range of variables) \n1.  Check and record \nperformance of \ncontrol activities \n1.1   Targeted plant response to pest management \nactivities, as well as any non-targeted effects \nsuch as environmental impact or pest responses, \nis regularly monitored and recorded, according to \nwork instructions, OHS requirements and \nprotocols and standards \n1.2   Progress report is prepared and submitted to \nsupervisor as required, according to farm work \nprocedures\n2.  Address \nperformance of \ncontrol activities \n2.1   Any gap or deviation from expected results of \ncontrol activities is reported to supervisor \naccording to standard procedures \n2.2   Adjustments to control measures are \nimplemented, where necessary, according to \nwork instructions \n2.3   Records are kept and updated regularly \naccording to farm work procedures\n\n--- PDF PAGE 64 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n62\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Pest management \nactivities  \n1.1. Bio-control measures \n1.2. Physical control measures \n1.3. Cultural management strategies \n1.4. Chemical control measures\n2.  OHS requirements \nSystems and procedures for: \n2.1. the safe operation and maintenance of \nmachinery and equipment including hydraulics \nand guarding of exposed moving parts. \n2.2. identifying hazards, assessing and reporting \nrisks. \n2.3. emergency operating procedures. \n2.4. safe lifting, carrying and handling techniques. \n2.5. manual handling systems and procedures, \nhandling and storage of hazardous \nsubstances, and the appropriate use of \npersonal protective clothing and equipment. \n2.6. safe systems and procedures for outdoor work \nincluding protection from solar radiation, \nprotection of people in the workplace, \nprotection from hazardous noise, mechanical \nvibration, organic and other dusts, and \nprotection from fire risk. \n3.  Farm work \nprocedures \n3.1. Supervisor/s’ oral and written instructions \n3.2. Standard operating procedures \n3.3. Pest management plan \n3.4. Best practice guidelines on pest management \n3.5. Good agricultural practices \n3.6. OHS procedures \n4.  Record \n4.1. Date and time of monitoring \n4.2. Location \n4.3. Specific control measures implemented \n4.4. Success of treatments \n4.5. Observable negative effects on the \nenvironment \n4.6. Effectivity of the control measures \nimplemented / results of application\n\n--- PDF PAGE 65 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n63\nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidences that the \ncandidate: \n1.1   Monitored results of control activities and \nprovided feedback \n1.2   Followed work instructions \n \nThe skills and knowledge required to monitor \nresults of control activities and provide feedback \nmust be transferable to a different work \nenvironment.  For example, this may include \ndifferent crops, control measures and \nfarms/areas. \n2.  Underpinning Knowledge \nand Attitude \nKnowledge and understanding are essential to \napply this standard in the workplace, to transfer \nthe skills to other contexts, and to deal with \nunplanned events.  The knowledge requirements \nfor this competency standard are listed below: \n \n2.1. Types of control measures  \n2.2. Expected effects/impacts of control \nmeasures \n2.3. Possible remedial actions for \ngaps/deviations between the effect/impact \nof control measures and actual results \n2.4. OHS requirements \n2.5. Record keeping requirements \n2.6. Reporting requirements \n2.7. Monitoring requirements \n \nAttitude: \n2.8. Accuracy \n2.9. Environment-conscious \n2.10. Positive work values \n2.11. Work ethics \n2.12. Cost consciousness \n2.13. Safety consciousness \n3.  Underpinning Skills \nTo achieve the performance criteria, appropriate \nliteracy and numeracy levels as well as some \ncomplementary skills are required.  These include \nthe ability to: \nLiteracy: \n3.1. \nDetermine gaps/deviations between \nexpected effect/impact and actual results \n3.2. \nPrepare and use properly tools, \nequipment and machinery, including PPE,\n\n--- PDF PAGE 66 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n64\nfor pest management activities \n3.3. \nApply remedial actions, when necessary \n3.4. \nFollow work instructions \n \nNumeracy: \n3.5. \nCollect data \n3.6. \nKeep records \n \nInterpersonal: \n3.7. \nMake oral and written reports \n3.8. \nCommunicate with farmers, team \nmembers and supervisor\n4.  Resource Implications \nThe following resources MUST be provided: \n4.1.   Vegetable farm or simulated workplace / \ndemo farm \n4.2.   Enterprise procedures relating to pest \nmanagement activities\n5.  Methods of Assessment \nCompetency must be assessed through: \n5.1. Direct observation with oral questioning \n5.2. Demonstration with oral questioning \n5.2.    Portfolio assessment\n6.  Context for Assessment \n6.1. Assessment should be in a workplace or in \na simulated workplace \n6.2. Demonstration of competency over time \nand on a number of occasions\n",
