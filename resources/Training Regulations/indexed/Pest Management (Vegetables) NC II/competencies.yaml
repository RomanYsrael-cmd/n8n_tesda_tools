to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n3. Control\nhazards\nand\nrisks\n3.1 Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with\nestablished organization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 14 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\n gasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 15 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n13\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal\nrecords\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 16 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n14\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value (TLV).\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\n Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value (TLV)\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 17 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n15\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY SAFETY MEASURES IN FARM\nOPERATIONS\n\nUNIT CODE\n:\nAGR321201\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to perform safety measures effectively and\nefficiently. It includes identifying areas, tools, materials,\ntime and place in performing safety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine areas of\nconcern for safety\nmeasures\n1.1\nWork tasks are identified in line with farm\noperations\n1.2\nPlace for safety measures are determined in line\nwith farm operations\n1.3\nTime for safety measures are determined in line with\nfarm operations\n1.4\nAppropriate tools, materials and outfits are\nprepared in line with job requirements\n2.\nApply appropriate\nsafety measures\n2.1\nTools and materials are used according to\nspecifications and procedures\n2.2\nOutfits are worn according to farm requirements\n2.3\nEffectivity/Shelf life/Expiration of materials are\nstrictly observed\n2.4\nEmergency procedures are known and followed to\nensure a safe work requirement\n2.5\nHazards in the workplace are identified and reported\nin line with farm guidelines\n3.\nSafekeep/dispose\ntools, materials and\noutfit\n3.1\nUsed tools and outfit are cleaned after use and\nstored in designated areas\n3.2\nUnused materials are properly labeled and stored\naccording to manufacturers recommendation and\nfarm requirements\n3.3\nWaste materials are disposed according to\nmanufacturers, government and farm requirements\n\n--- PDF PAGE 18 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nWork tasks\nWork task may be selected from any of the subsectors:\n1.1\nAquaculture\n1.2\nAnimal Production\n1.3\nCrop Production\n1.4\nPost-harvest\n1.5\nAgri-marketing\n1.6\nFarm Equipment\n2.\nPlace\n2.1\nAnimal pens, cages, barns\n2.2\nFish ponds, cages\n2.3\nStock room/storage areas/warehouse\n2.4\nField/farm/orchard\n3.\nTime\n3.1\nVaccination and medication period\n3.2\nFertilizer and pesticides application\n3.3\nFeed mixing and feeding\n3.4\nHarvesting and hauling\n3.5\nCleaning, sanitizing and disinfecting\n3.6\nDressing, butchering and castration\n4.\nTools, materials and\noutfits\n4.1\nTools\n4.1.1\nWrenches\n4.1.2\nScrew driver\n4.1.3\nPliers\n4.2\nMaterials\n4.2.1\nBottles\n4.2.2\nPlastic\n4.2.3\nBags\n4.2.4\nSyringe\n4.3\nOutfit\n4.3.1\nMasks\n4.3.2\nGloves\n4.3.3\nBoots\n4.3.4\nOverall coats\n4.3.5\nHat\n4.3.6\nEye goggles\n5.\nEmergency procedures\n5.1\nLocation of first aid kit\n5.2\nEvacuation\n5.3\nAgencies contract\n5.4\nFarm emergency procedures\n6.\nWaste materials\n6.1\nAnimal manure\n6.2\nWaste water\n6.3\nSyringes\n6.4\nUnused farm chemicals e.g. pesticides, chemicals,\nfertilizers\n6.5\nExpired reagents\n6.6\nDead animals\n7.\nHazards\n7.1\nChemical\n7.2\nElectrical\n7.3\nFalls\n\n--- PDF PAGE 19 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n17\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to\nindustry requirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Safekeep/cleaned tools, materials and outfit in designated\nfacilities\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Implementation of regulatory controls and policies\nrelative to treatment of area and application of\nchemicals\n2.1.2 Proper disposal of waste materials\n2.2 Codes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n\n2.3 Tools and Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health\nprotection\n\n2.4 Maintenance\n2.4.1\nRegular check-up and repair of tools, materials\nand outfit before and after use\n3. Underpinning\nSkills\n3.1 Ability to recognize effective tools, materials and outfit\n3.2 Ready skills required to read labels, manuals and other\nbasic safety information\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1 Practical demonstration\n4.2 Third Party Report\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Farm location\n5.2 Tools, equipment and outfits appropriate in applying\nsafety measures\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 20 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n18\n\nUNIT TITLE:\n\nUSE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE:\n\nAGR321202\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of farm\ntools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use farm\ntools\n\n1.1\nIdentified appropriate farm tools according to\nrequirement/use\n1.2\nFarm tools are checked for faults and defective tools\nreported in accordance with farm procedures\n1.3\nAppropriate tools and equipment are safely used\naccording to job requirements and manufacturers\nconditions\n2.\nSelect and operate\nfarm equipment\n2.1\nIdentify appropriate farm equipment\n2.2\nInstructional manual of the farm tools and equipment\nare carefully read prior to operation\n2.3\nPre-operation check-up is conducted in line with\nmanufacturers manual\n2.4\nFaults in farm equipment are identified and reported\nin line with farm procedures\n2.5\nFarm equipment used according to its function\n2.6\nFollowed safety procedures\n3.\nPerform preventive\nmaintenance\n3.1\nTools and equipment are cleaned immediately after\nuse in line with farm procedures\n3.2\nRoutine check-up and maintenance are performed\n3.3\nTools and equipment are stored in designated areas\nin line with farm procedures\n\n--- PDF PAGE 21 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\n\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Farm tools\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5 Measuring tools\n2.6 Garden tools\n3. Pre-operation check-up\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\n--- PDF PAGE 22 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n20\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipments according to manual\nspecification\n1.3\nPerformed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Ideal good work habits to demonstrate to workers\neasy and safety standards during operation of\nfarm equipment\n2.2 Codes and Regulations\n2.2.1 Environmental Compliance Certificate (ECG)\n2.2.2 Effective work supervision in the operations of\nfarm equipment\n\n2.3 Tools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n\n2.4 Maintenance\n2.4.1 Regular upkeep of equipment\n2.4.2 Preventive maintenance skills\n\n2.5 Values\n2.5.1 Positive outlook towards work\n2.5.2\nPossesses pre-emptive/anticipatory skills\n3.\nUnderpinning\nSkills\n3.1\nAbility to recognized defective farm equipment\n3.2\nPerform proper management practices of safety\nmeasures\n4.\nMethod of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nDirect observation\n4.2\nPractical demonstration\n4.3\nThird Party Report\n5.\nResource\nImplications\nThe following resources must be provided:\n5.1\nService/operational manual of farm tools and equipment\n5.2\n Tools and equipment\n5.3\n Farm implements\n6.\nContext of\nAssessment\n6.1\nAssessment may occur in the workplace or in a\nsimulated workplace or as part of a team under limited\nsupervision\n\n--- PDF PAGE 23 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n21\n\nUNIT TITLE:\n\nPERFORM ESTIMATION AND BASIC\nCALCULATIONS\n\nUNIT CODE:\n\nAGR321203\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform basic workplace calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform estimation\n1.1 Job requirements are identified from written or oral\ncommunications\n1.2 Quantities of materials and resources required to\ncomplete a work task are estimated\n1.3 The time needed to complete a work activity is\nestimated\n1.4 Accurate estimate for work completion are made\n1.5 Estimate of materials and resources are reported to\nappropriate person\n2.\nPerform basic\nworkplace\ncalculation\n2.1 Calculations to be made are identified according to\njob requirements\n2.2 Correct method of calculation identified\n2.3 System and units of measurement to be followed\nare ascertained\n2.4 Calculation needed to complete work tasks are\nperformed using the four basic process of addition,\ndivision, multiplication and subtraction\n2.5 Calculate whole fraction, percentage and mixed when\nare used to complete the instructions\n2.6 Number computed in self checked and completed for\nalignment\n\n--- PDF PAGE 24 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nCalculations\n\n1.1\nQuantity of feeds\n1.2\nAmount of fertilizer\n1.3\nAmount of medicines\n2.\nMethod of calculation\n\n2.1\nAddition\n2.2\nSubtraction\n2.3\nMultiplication\n2.4\nDivision\n2.5\nRatio and proportion\n3.\nSystem of measurement\n3.1\nEnglish\n3.2\nMetric\n4.\nUnits of measurement\n4.1\nArea\n4.2\nVolume\n4.3\nWeight\n\n--- PDF PAGE 25 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n23\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nMathematics\n2.1.1\nBasic mathematical operations\n2.1.2\nPercentage and ratios\n2.1.3\nUnit Conversion\n2.1.4\nBasic accounting principles and procedures\n2.1.4.1 Production cost\n2.1.4.2 Sales\n2.1.4.3 Accounts receivables/payables\n\n2.2\nSystems, Processes and Operations\n2.2.1 Knowledge in different management practices and\noperational procedures\n\n2.3\nValues\n2.3.1 Safety consciousness\n2.3.2 Time consciousness and management\n2.3.3 Cost consciousness\n2.3.4 Precision\n3. Underpinning\nSkills\n3.1\nAbility to perform basic calculation\n3.2\nCommunicate effectively\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nWritten examination\n\n5. Resource\nImplications\nThe following resources must be provided:\n5.1\nRelevant tools and equipment for basic calculation\n5.2\nRecommended data\n6. Context of\nAssessment\n6.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 26 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n24\n CORE COMPETENCIES\n\nUNIT OF COMPETENCY: CONDUCT FIELD ASSESSMENT\n\nUNIT CODE : AGR321320\n\nUNIT DESCRIPTOR: This unit covers the skills, knowledge and attitudes required\nfor performing field-assessment activities. It\ninvolves\nassessment of the area, identification of pests and their\nnatural enemies, and other beneficial organisms, collecting\ndata related to natural enemy populations and pest\ninfestations and maintaining records and providing feedback.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized terms are elaborated in the range of variables)\n1. Assess the area\n1.1. Field is visited for assessment according to\nfarm work procedures\n1.2. Plant appearance and growth are observed for\npossible presence of pests and their natural\nenemies, other beneficial organisms and\nnutritional disorders according to farm work\nprocedures\n1.3. Occupational Health and Safety (OHS)\nhazards are identified, risks assessed and\nsuitable preventive measures are implemented\naccording to farm work procedures\n1.4. Environment and other relevant information\nwith regard to assessment activities are noted\nfollowing standard procedures\n2. Identify pests and their\nnatural enemies, and\nother beneficial\norganisms\n2.1. Pests and their natural enemies, and other\nbeneficial organisms are identified and\nrecorded in field notes according to farm work\nprocedures\n2.2. The supervisor or the pest specialist is\nconsulted as required to validate the identity of\npests and their natural enemies, and other\nbeneficial organisms in line with farm work\nprocedures\n\n--- PDF PAGE 27 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n25\n\nELEMENT\nPERFORMANCE CRITERIA\n3. Collect data related to\nnatural enemy\npopulations and pest\ninfestations\n3.1. Information on the identified natural enemies’\ndensity as well as degree of pest infestation\nand severity of pest damage are gathered\naccording to farm work procedures\n3.2. Data on the environment and other relevant\ninformation are collected in accordance with\nfarm work procedures\n3.3. Levels of infestation/severity tolerated by the\nclient, market or environment are determined\nin line with integrated pest management plan\n3.4. Professional advice is obtained as required\naccording to enterprise guidelines\n4. Maintain records and\nprovide feedback\n4.1.\nRecords are completed and updated in line\nwith workplace procedures\n4.2.\nResults of assessment activities are\ndiscussed with the supervisor following\nstandard procedures\n\n--- PDF PAGE 28 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n26\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Farm work procedures\n\n1.1. Supervisor/s’ oral and written instructions\n1.2. Standard operating procedures\n1.3. Pest management plan\n1.4. Industry best practice guidelines on pest\nmanagement\n1.5. Good agricultural practices (GAP)\n1.6. OHS procedures\n2. Pests\n2.1. Insect pests\n2.2. Weeds\n2.3. Diseases\n2.4. Others (snails, birds,rodents, slugs, etc.)\n3. Natural enemies and\nbeneficial organisms\n3.1. Parasites/parasitoids\n3.2. Predators\n3.3. Pollinators\n3.4. Repellant or refuge plants\n3.5. Micro-organisms / Entomopathogens\n4. Nutritional disorders\nDeficiencies in:\n4.1. Nitrogen\n4.2. Phosphorus\n4.3. Potassium\n4.4. Microelements\n5. OHS hazards\nHazards may include:\n5.1. body irritation\n5.2. poisoning\n5.3. solar radiation\n5.4. dust\n5.5. pollen\n5.6. soil-borne micro organisms\n5.7. noise\n5.8. chemicals and hazardous substances\n5.9. slippery or uneven surfaces\n5.10. moving equipment\n5.11. machinery and vehicles\n5.12. sharp objects\n\n--- PDF PAGE 29 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n27\n\nVARIABLE\nRANGE\n6. Environment\n6.1. Soil Fertility\n6.2. Soil Type\n6.3. Weather Conditions\n6.4. Topography\n6.5. Water, Etc.\n\n7. Other relevant\ninformation\n7.1. Crop variety\n7.2. Cropping pattern/system\n7.3. Stage of the crop\n8. Records\n8.1. Date and time of inspection\n8.2. Location\n8.3. Identity of pests and their natural enemies,\nand beneficial organisms\n8.4. Manifestations/Symptoms\n8.5. Plant parts attacked (e.g. leaf, fruit, etc.)\n8.6. Nature of damage (borer, miner, leaf\nfeeder, leaf curling, etc.)\n8.7. Extent of damage (number of plants / plots\naffected / size of area)\n8.8. Population counts of natural enemies\n8.9. Environment (soil fertility, soil type,\nweather conditions, topography, water ,\netc.) and other relevant information (e.g.\ncrop variety, cropping pattern/system,\nstage of crop, etc.)\n\n--- PDF PAGE 30 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n28\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate:\n\n1.1. assessed the area;\n1.2. identified the range of pests present and their\nnatural enemies, and other beneficial\norganisms;\n1.3. collected data related to natural enemy\npopulations and pest infestations; and\n1.4. maintained records and provided feedback.\n\nThe skills and knowledge required to conduct field\nassessment must be transferable to a different work\nenvironment. For example, this may include different\nvegetables, fields/farms and pests.\n2. Underpinning\nKnowledge and\nAttitude\nKnowledge and understanding are essential to apply\nthis standard in the workplace, to transfer the skills to\nother contexts, and to deal with unplanned events.\nThe knowledge requirements for this competency\nstandard are listed below:\n2.1.\nPest and natural enemy recognition, and\nother beneficial organisms\n2.2.\nRange of vegetable species/varieties\n2.3.\nIPM concepts and principles (Identification,\nbiology, behavior, population dynamics)\n2.4.\nProcedures for agro-ecosystems analysis\n(AESA)\n2.5.\nInteractions among pest infestations, natural\nenemy populations, other beneficial\norganisms, the environment and other\nrelevant information (e.g. cropping\nsystems/patterns, crop varieties and others)\n2.6.\nNutritional disorders (deficiencies in NPK and\nmicroelements)\n2.7.\nOHS risks, hazards, and prevention\n2.8.\ndata collection requirements\n2.9.\nrecord keeping requirements\n2.10. reporting requirements\n\nAttitude:\n2.11. Accuracy\n2.12. Environment-conscious\n2.13. Positive work values\n2.14. Work ethics\n2.15. Cost consciousness\n2.16. Safety consciousness\n\n--- PDF PAGE 31 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n29\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate\nliteracy and numeracy levels as well as some\ncomplementary skills are required. These include\nthe ability to:\nLiteracy:\n3.1.\npests and natural enemy recognition, and\nother beneficial organisms\n3.2.\nsymptoms recognition\n3.3.\nfamiliarity with life cycle/biology, habitat and\ndestructive stage of pest and natural enemies\n3.4.\nfollow guidelines and procedures for\ninspection activities\n\nNumeracy:\n3.5.\ndensity count / estimation\n3.6.\ndamage degree estimation\n3.7.\ncollect data\n3.8.\nkeep records\n\nInterpersonal:\n3.9.\nmake oral and written reports\n3.10. communicate with farmers, team members\nand supervisor\n4. Resource Implications\nThe following resources MUST be provided:\n4.1. vegetable farm or a simulated\nworkplace/demonstration farm\n4.2. farm procedures relating to field assessment\nactivities\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1. Direct observation with oral questioning\n5.2. Demonstration with oral questioning\n5.3. Portfolio assessment\n6. Context for\nAssessment\n6.1. Assessment should be in a vegetable field or in\na simulated workplace/demo farm\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 32 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n30\nUNIT OF COMPETENCY: APPLY BIO-CONTROL MEASURES\n\nUNIT CODE : AGR321321\n\nUNIT DESCRIPTOR: This unit covers the skills, knowledge and attitudes required\nto apply bio-control measures for pests as a primary IPM\nstrategy. It includes identifying the target pests and their\nnatural enemies and other beneficial organisms, selecting\nbio-control activities and preparing for the application,\nimplementing the control activities and checking the\nperformance of the said control activities.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized terms are elaborated in the range of variables)\n1. Identify target pests\nand their natural\nenemies, and other\nbeneficial organisms\n1.1. Pests, which warrant action, and their natural\nenemies, and other beneficial organisms\nare identified according to general\nclassification / life cycle and behavior /\nsigns and symptoms and stage of plant\ngrowth\n1.2. The supervisor, or the pest specialist, is\nconsulted as required to validate data on target\npests and their natural enemies, and other\nbeneficial organisms according to farm work\nprocedures\n1.3. Requirement for available bio-control\nmeasures are assessed in line with the IPM\nstrategy\n2. Select bio-control\nactivities and prepare\nfor the application\n2.1. Bio-control measures are selected according to\ntarget pests and their natural enemies, and\nother beneficial organisms, availability and\nappropriateness to prevailing pest density,\nlevel of severity/infestation, the environment\nand other relevant information in accordance\nwith farm work procedures\n2.2. All necessary supplies and materials, and\ntools, machinery , equipment and facilities\nare prepared according to farm work\nprocedures\n2.3. Suitable PPE is selected according to OHS\nrequirements\n\n--- PDF PAGE 33 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n31\n\nELEMENT\nPERFORMANCE CRITERIA\n3. Implement control\nactivities\n3.1. Appropriate bio-control measures are\nimplemented in line with farm work procedures\n3.2. Tools, machinery and equipment, facilities and\nPPE are used in accordance with OHS\nrequirements\n4. Check performance of\ncontrol activities\n4.1. Management options implemented are\nrecorded and monitored in line with farm work\nprocedures\n4.2. Supplemental and remedial actions are\nundertaken, as necessary, according to work\ninstructions\n4.3. Records are maintained according to standard\nprocedures\n\n--- PDF PAGE 34 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Pests\n\n1.1. Insect pests\n1.2. Weeds\n1.3. Diseases\n1.4. Others (snails, birds,rodents, slugs, etc.)\n2. Natural enemies and\nbeneficial organisms\n2.1. Parasites/parasitoids\n2.2. Predators\n2.3. Pollinators\n2.4. Repellant or refuge plants\n2.5. Micro-organisms / Entomopathogens\n3. General\nclassification\n3.1. Defoliator, borer, miner, root feeder, etc. (for\ninsect pests)\n3.2. Grass, broad leaf, or sedge (for weeds)\n3.3. Bacterium, fungus, virus, plant parasitic\nnematode, mycoplasma, viroids (for\ndiseases)\n4. Life cycle (for insect\npests and their\nnatural enemies, and\nother beneficial\norganisms)\n4.1 Complete life cycle\n4.1.1. Egg\n4.1.2. Larva\n4.1.3. Pupa\n4.1.4. Adult\n4.2 Incomplete life cycle\n4.2.1. Egg\n4.2.2. Nymph\n4.2.3. Adult\n\n5. Behavior (for insect\npests and natural\nenemies, and other\nbeneficial organisms)\n5.1. Where it stays/ Habitat\n5.2. Diurnal/nocturnal\n5.3. Destructive stage\n5.4. Alternate hosts/predators\n5.5. Reproduction as influenced by external\nfactors\n5.6. Response to external factors (e.g. rain,\nsevere dehydration, shading)\n5.7. Nature and extent of damage\n5.8. Critical period of infestation\n6. Signs (for insect\npests) and\n6.1. Signs of pest infestation such as population\n\n--- PDF PAGE 35 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n33\nsymptoms (for\ndiseases)\ndensity, severity of damage, etc.\n6.2. Manifestations of the disease such as\nspotting, rotting, wilting, blighting, curling,\nyellowing, dwarfing, etc.\n7. Stage of plant growth\n7.1. Seed / Seedling\n7.2. Vegetative stage\n7.3. Reproductive stage\n8. Farm work\nprocedures\n8.1. Supervisor/s’ oral and 