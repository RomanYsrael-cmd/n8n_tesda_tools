        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nMathematics\n2.1.1\nBasic mathematical operations\n2.1.2\nPercentage and ratios\n2.1.3\nUnit Conversion\n2.1.4\nBasic accounting principles and procedures\n2.1.4.1 Production cost\n2.1.4.2 Sales\n2.1.4.3 Accounts receivables/payables\n\n2.2\nSystems, Processes and Operations\n2.2.1 Knowledge in different management practices and\noperational procedures\n\n2.3\nValues\n2.3.1 Safety consciousness\n2.3.2 Time consciousness and management\n2.3.3 Cost consciousness\n2.3.4 Precision\n3. Underpinning\nSkills\n3.1\nAbility to perform basic calculation\n3.2\nCommunicate effectively\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nWritten examination\n\n5. Resource\nImplications\nThe following resources must be provided:\n5.1\nRelevant tools and equipment for basic calculation\n5.2\nRecommended data\n6. Context of\nAssessment\n6.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 26 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n24\n CORE COMPETENCIES\n\nUNIT OF COMPETENCY: CONDUCT FIELD ASSESSMENT\n\nUNIT CODE :"
