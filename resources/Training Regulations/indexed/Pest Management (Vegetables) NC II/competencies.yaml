        "source_title": "APPLY CHEMICAL CONTROL MEASURES",
        "source_text": "--- PDF PAGE 53 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n51\nUNIT OF COMPETENCY:    APPLY CHEMICAL CONTROL MEASURES  \n \nUNIT CODE                     :    AGR321324 \n \nUNIT DESCRIPTOR:  This unit covers the skills, knowledge and attitude required \nwhen one decides to apply chemical control measures, after \nthorough consideration of non-chemical alternatives within \nthe integrated pest management strategy. It involves \nidentification of the target pest and their natural enemies, \nand other beneficial organisms, selecting the appropriate \npesticide, preparing for its safe application, actual application, \ncleaning up after, and record keeping.    \n \n \nELEMENT\nPERFORMANCE CRITERIA \n(Italicized terms are elaborated in the range of variables) \n1.  Identify target pests and \ntheir natural enemies, \nand other beneficial \norganisms \n1.1. Pests, which warrant action, and their \nnatural enemies, and other beneficial \norganisms are identified according to \ngeneral classification / life cycle and \nbehavior / signs and symptoms  and \nstage of plant growth \n1.2. The supervisor, or the pest specialist, is \nconsulted as required to validate \nidentification of target pests and their \nnatural enemies according to farm work \nprocedures \n1.3.  Requirement for pesticide use is  \nassessed as an option after consideration \nof non-chemical alternatives within the IPM \nstrategy \n2.  Select appropriate \npesticide  \n2.1. Appropriate pesticide(s) is(are) selected \nbased on target pest, pest and natural \nenemy density, level of severity/infestation, \nenvironment and other relevant \ninformation in accordance with farm work \nprocedures \n2.2. Labels are checked according to \nrequirements and specifications \n2.3. Pesticide to be used is in accordance with \nlegislations and regulations  \n2.4. OHS hazards are identified, risks \nassessed, controls implemented and \nreported to the supervisor according to farm \nwork procedures\n\n--- PDF PAGE 54 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n52\n \n3.  Prepare for the \napplication of appropriate \npesticide  \n3.1. Suitable personal protective equipment is \nselected according to product label and \nsafety requirements \n \n3.2. Suitable application equipment and tools \nare selected according to farm work \nprocedures \n3.3. Pre-operational and safety checks on \napplication equipment and tools are carried \nout, and calibrations and adjustments \nmade, according to manufacturers’ \nspecifications and farm work procedures \n3.4. Pesticide mixing rates are defined and \ncalculated according to requirements and \nspecifications \n3.5. Pesticides are mixed according to \ndirections, standards and legislative \nrequirements \n4.  Apply appropriate \npesticide  \n4.1. Meteorological conditions and forecasts \nare assessed prior to and during application \naccording to farm work procedures \n4.2. Specific products are applied in accordance \nwith prescribed timing, rate and method \naccording to farm work procedures and \nproduct labels/directions, with due \nconsideration of the environmental \nimplications \n4.3. Appropriate PPE are used according to \nfarm work procedures and product \nlabels/directions \n5.  Clean up following \napplication  \n5.1. Application equipment and tools are \ncleaned and stored according to farm work \nprocedures \n5.2. Unused chemicals are stored or disposed \nof according to storage temperature \nrequirements, standard procedures and \nlabel directions \n5.3. Used containers are disposed of properly \naccording to prescribed procedures \n5.4. Site is cleaned according to directions and \nstandards \n5.5. Chemical spills are handled according to \nstandard procedures \n5.6. Personal safety is observed according to \nprescribed procedures\n\n--- PDF PAGE 55 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n53\n \n6.  Check and record \nperformance of control \nactivities  \n6.1. Product applications are recorded \naccording to farm work procedures \n6.2. Supplemental and remedial actions are \nundertaken, if necessary, according to work \ninstructions \n6.3. Observable adverse effects to natural \nenemies, humans, farm animals and the \nenvironment are recorded according to farm \nwork procedures \n6.4. Records are maintained as required by \nlegislation and enterprise guidelines \n7.  Transport, handle and \nstore chemicals \n7.1. Chemicals are transported or carried to and \nfrom the farm building using specified \ncontainer/equipment and materials \n7.2. Unused chemicals are properly stored \nusing first in first out system\n\n--- PDF PAGE 56 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n54\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Pests  \n \n1.1. Insect pests \n1.2. Weeds \n1.3. Diseases \n1.4. Others (snails, birds,rodents, slugs, etc.)\n2. Natural enemies \nand beneficial \norganisms  \n2.1. Parasites/parasitoids \n2.2. Predators  \n2.3. Pollinators  \n2.4. Repellant or refuge plants \n2.5. Micro-organisms / Entomopathogens \n3. General \nclassification  \n3.1. Defoliator, borer, miner, root feeder, etc. (for \ninsect pests) \n3.2. Grass, broad leaf, or sedge (for weeds)  \n3.3. Bacterium, fungus, virus, plant parasitic \nnematode, mycoplasma, viroids  (for diseases) \n4. Life cycle (for \ninsect pests and \ntheir natural \nenemies, and \nother beneficial \norganisms) \n4.1   Complete life cycle \n4.1.1. Egg  \n4.1.2. Larva \n4.1.3. Pupa \n4.1.4. Adult \n4.2   Incomplete life cycle  \n4.2.1. Egg \n4.2.2. Nymph \n4.2.3. Adult \n \n5. Behavior (for \ninsect pests and \nnatural enemies, \nand other \nbeneficial \norganisms) \n5.1. Where it stays/ Habitat \n5.2. Diurnal/nocturnal \n5.3. Destructive stage \n5.4. Alternate hosts/predators \n5.5. Reproduction as influenced by external factors \n5.6. Response to external factors (e.g. rain, severe \ndehydration, shading) \n5.7. Nature and extent of damage \n5.8. Critical period of infestation\n\n--- PDF PAGE 57 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n55\n \n6. Signs (for insect \npests) and \nsymptoms (for \ndiseases) \n6.1. Signs of pest infestation such as population \ndensity, severity of damage, etc. \n6.2. Manifestations of the disease such as spotting, \nrotting, wilting, blighting, curling, yellowing, \ndwarfing, etc. \n7. Stage of plant \ngrowth \n7.1. Seed / Seedling \n7.2. Vegetative stage \n7.3. Reproductive stage \n8. Farm work \nprocedures \n8.1. Supervisor/s’ oral and written instructions \n8.2. Standard operating procedures \n8.3. Pest management plan \n8.4. Best practice guidelines on pest management \n8.5. Good agricultural practices \n8.6. OHS procedures \n9. Pesticide \n9.1. Herbicide  \n9.2. Insecticide  \n9.3. Fungicide \n9.4. Bactericide  \n9.5. Nematicide \n9.6. Rodenticide \n9.7. Acaricide \n9.8. Other chemicals for managing pests\n10. Integrated Pest \nManagement (IPM) \n10.1. \nBiological, cultural, and physical management \noptions  that can be integrated to avoid \nindiscriminate use of chemical measures\n11.   Environment \n11.1. Soil Fertility \n11.2. Soil Type \n11.3. Weather Conditions \n11.4. Topography \n11.5. Water, Etc. \n12.   Other relevant \ninformation  \n12.1. \nCrop variety \n12.2. \nCropping pattern/system \n12.3. \nStage of the crop \n13.  Labels \n13.1.   Pesticide label may be: \n13.1.1.  green (less toxic) \n13.1.2.  blue (slightly toxic) \n13.1.3.  yellow (moderately toxic) or  \n13.1.4.  red (highly toxic).   \n13.2.  The label also defines the:  \n13.2.1.   active ingredient\n\n--- PDF PAGE 58 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n56\n13.2.2.   the re-entry period \n13.2.3.   manufacturer’s recommended \ndosages  \n13.2.4.  time intervals between applications \n13.2.5.  compatibility with other pesticides \n13.2.6.  expiration date  \n14. Legislations and \nregulations \nMay include: \n14.1. Pesticides Acts,  \n14.2. Occupational Health and Safety Acts  \n14.3. Hazardous Substances Regulations/ Codes of \nPractice \n14.4. Dangerous Drugs Acts \n14.5. Poisons Act  \n14.6. Protection of the Environment Acts. \n15.  OHS hazards \nand risks \n15.1.  OHS hazards include exposure of the operators \nand others in the workplace to the absorption \nof chemicals through the skin and by inhalation \nand ingestion.   \n15.2   Risks may include acute poisoning, chronic or \nlong-term health effects, and lack of \nappropriate insurance coverage \n16. Personal \nprotective \nequipment   \nMay include: \n16.1. Boots \n16.2. Hat/Hard hat \n16.3. Coveralls, Gloves \n16.4. Protective eyewear \n16.5. Hearing protection \n16.6. Respirator or face mask \n16.7. Sun protection (sun hat, sun screen). \n17. Application \nequipment  \n17.1  Sprayer (e.g. knapsack,  hand held pneumatic \nsprayers, power sprayers) \n18.   Pre-operational \nand safety \nchecks \nChecks may be made on: \n18.1. weather conditions (e.g., wind)  \n18.2. application equipment \n18.3. nozzles \n18.4. hoses \n18.5. regulators/gauges \n18.6. respirator  \n18.7. cartridges \n18.8. drench and protective clothing and equipment.\n\n--- PDF PAGE 59 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n57\n19. Meteorological \nconditions \n19.1  Rain, wind, temperature, and relative humidity  \n20. Environmental \nimplications \n20.1 Detrimental environmental impacts may arise \nwhere excessive/indiscriminate use and \nimproper disposal of chemicals and waste \nmaterials lead to contamination of the produce, \nwater systems, among others.  \n21. Records \n21.1. Date and time of application \n21.2. Location \n21.3. Specific control measures implemented \n21.4. Rate of application   \n21.5. Supplies and materials used (quantity, cost, \netc.) \n21.6. Labor (man days and wage rates) \n21.7. Chemical disposal methods \n21.8. Success of treatments \n21.9. Observable negative effects on the \nenvironment \n21.10. Economic thresholds \n21.11. Effectivity of the pesticides / results of \napplication  \n21.12. Inventory records \n21.13. Field assessment records\n\n--- PDF PAGE 60 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n58\nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidences that the \ncandidate, after consideration of available non-\nchemical alternatives: \n \n1.1. Selected, prepared and applied appropriate \npesticide \n1.2. Followed work instructions \n1.3. Complied with OHS requirements \n \nThe skills and knowledge required to apply \nchemicals must be transferable to a different \nwork environment.  For example, this could \ninclude different chemicals, application methods, \nvegetables, pests, and farms/areas. \n2.  Underpinning Knowledge \nand Attitude \nKnowledge and understanding are essential to \napply this standard in the workplace, to transfer \nthe skills to other contexts, and to deal with \nunplanned events.  The knowledge requirements \nfor this competency standard are listed below: \n2.1. \nIPM concepts and principles \n(Identification, biology, behavior, \npopulation dynamics) \n2.2. \nRange of vegetable species / varieties \n2.3. \nRecognition of common pests of \nvegetables and their natural enemies  \n2.4. \nEconomic, aesthetic or environmental \nthresholds for a range of pests \n2.5. \nImpact of pesticides on the environment \n(e.g., on natural enemies, humans and \nother non-target organisms) as well as \nhuman health \n2.6. \nProper transport, handling and storage of \npesticides \n2.7. \nProper disposal of pesticides  \n2.8. \nTypes/classification, uses, application \nrates and their calculations, and methods \nof application of chemicals \n2.9. \nRange and use of tools and equipment for \nimplementing chemical control measures \n2.10. Calibration and adjustments of application \nequipment \n2.11. Pre-operational and safety check \nrequirements for application tools, \nmachinery and equipment Cost effective \nuse of chemicals\n\n--- PDF PAGE 61 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n59\n2.12. Selection, use and maintenance of PPE \n2.13. OHS issues, legislative requirements and \nCodes of Practice relevant to chemical \nuse and hazardous substances \n \nAttitude: \n2.14. Accuracy \n2.15. Environment-conscious \n2.16. Positive work values \n2.17. Work ethics \n2.18. Cost consciousness \n2.19. Safety consciousness \n3.  Underpinning Skills \nTo achieve the performance criteria, appropriate \nliteracy and numeracy levels as well as some \ncomplementary skills are required.  These include \nthe ability to: \nLiteracy: \n3.1. Recognize common pests of  vegetables \nand their natural enemies \n3.2. Differentiate between symptoms of \ndiseases and nutrient deficiencies \n3.3. Use, maintain and store appropriate PPE \n3.4. Skill in operation of application equipment \n3.5. Proper transport, handling and storage  of \npesticides  \n3.6. Read and interpret chemical labels \n3.7. Follow work instructions \n \nNumeracy: \n3.8. Calculate quantities and application rates of \nchemicals  \n3.9. Calibrate equipment \n3.10. Collect data \n3.11. Keep records \n \nInterpersonal: \n3.12. Make oral and written reports \n3.13. Communicate with farmers, team members \nand supervisor\n\n--- PDF PAGE 62 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n60\n \n4.  Resource Implications \nThe following resources MUST be provided: \n4.1   Vegetable farm or simulated \nworkplace/demo farm \n4.2   Materials, tools, machinery and equipment \nfor chemical mixing and application, and \nstorage facilities  \n4.3   Enterprise procedures relating to chemical \nuse \n5.  Methods of Assessment \nCompetency must be assessed through: \n5.1. Direct observation with oral questioning \n5.2. Demonstration with oral questioning \n5.3. Portfolio assessment\n6.  Context for Assessment \n6.1   Assessment should be in a workplace or in \na simulated workplace \n6.2   Demonstration of competency over time \nand on a number of occasions.\n",
