          "source_text": ") \n1.  Check and record \nperformance of \ncontrol activities \n1.1   Targeted plant response to pest management \nactivities, as well as any non-targeted effects \nsuch as environmental impact or pest responses, \nis regularly monitored and recorded, according to \nwork instructions, OHS requirements and \nprotocols and standards \n1.2   Progress report is prepared and submitted to \nsupervisor as required, according to farm work \nprocedures\n2.  Address \nperformance of \ncontrol activities \n2.1   Any gap or deviation from expected results of \ncontrol activities is reported to supervisor \naccording to standard procedures \n2.2   Adjustments to control measures are \nimplemented, where necessary, according to \nwork instructions \n2.3   Records are kept and updated regularly \naccording to farm work procedures\n\n--- PDF PAGE 64 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n62\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Pest management \nactivities  \n1.1. Bio-control measures \n1.2. Physical control measures \n1.3. Cultural management strategies \n1.4. Chemical control measures\n2.  OHS requirements \nSystems and procedures for: \n2.1. the safe operation and maintenance of \nmachinery and equipment including hydraulics \nand guarding of exposed moving parts. \n2.2. identifying hazards, assessing and reporting \nrisks. \n2.3. emergency operating procedures. \n2.4. safe lifting, carrying and handling techniques. \n2.5. manual handling systems and procedures, \nhandling and storage of hazardous \nsubstances, and the appropriate use of \npersonal protective clothing and equipment. \n2.6. safe systems and procedures for outdoor work \nincluding protection from solar radiation, \nprotection of people in the workplace, \nprotection from hazardous noise, mechanical \nvibration, organic and other dusts, and \nprotection from fire risk. \n3.  Farm work \nprocedures \n3.1. Supervisor/s’ oral and written instructions \n3.2. Standard operating procedures \n3.3. Pest management plan \n3.4. Best practice guidelines on pest management \n3.5. Good agricultural practices \n3.6. OHS procedures \n4.  Record \n4.1. Date and time of monitoring \n4.2. Location \n4.3. Specific control measures implemented \n4.4. Success of treatments \n4.5. Observable negative effects on the \nenvironment \n4.6. Effectivity of the control measures \nimplemented / results of application\n\n--- PDF PAGE 65 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n63"
