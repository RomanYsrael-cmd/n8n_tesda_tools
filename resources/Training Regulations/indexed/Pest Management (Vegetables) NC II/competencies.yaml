          "source_text": ") \n1.  Identify target pests \nand their natural \nenemies, and other \nbeneficial organisms \n1.1. Pests, which warrant action, and their natural \nenemies, and other beneficial organisms \nare identified according to general \nclassification / life cycle and behavior / \nsigns and symptoms and stage of plant \ngrowth \n1.2. The supervisor, or the pest specialist, is \nconsulted as required to validate data on target \npests and their natural enemies, and other \nbeneficial organisms according to farm work \nprocedures \n1.3. Requirement for available bio-control \nmeasures are assessed in line with the IPM \nstrategy \n2.  Select bio-control \nactivities and prepare \nfor the application  \n2.1. Bio-control measures are selected according to \ntarget pests and their natural enemies, and \nother beneficial organisms, availability and \nappropriateness to prevailing pest density, \nlevel of severity/infestation, the environment \nand other relevant information in accordance \nwith farm work procedures  \n2.2. All necessary supplies and materials, and \ntools, machinery , equipment and facilities \nare prepared according to farm work \nprocedures \n2.3. Suitable PPE is selected according to OHS \nrequirements\n\n--- PDF PAGE 33 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n31\n \nELEMENT \nPERFORMANCE CRITERIA \n3.  Implement control \nactivities \n3.1. Appropriate bio-control measures are \nimplemented in line with farm work procedures \n3.2. Tools, machinery and equipment, facilities and \nPPE are used in accordance with OHS \nrequirements \n4.  Check performance of \ncontrol activities \n4.1. Management options implemented are \nrecorded and monitored in line with farm work \nprocedures \n4.2. Supplemental and remedial actions are \nundertaken, as necessary, according to work \ninstructions \n4.3. Records are maintained according to standard \nprocedures\n\n--- PDF PAGE 34 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n32\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Pests  \n \n1.1. Insect pests \n1.2. Weeds \n1.3. Diseases \n1.4. Others (snails, birds,rodents, slugs, etc.) \n2. Natural enemies and \nbeneficial organisms  \n2.1. Parasites/parasitoids \n2.2. Predators  \n2.3. Pollinators  \n2.4. Repellant or refuge plants \n2.5. Micro-organisms / Entomopathogens \n3. General \nclassification  \n3.1. Defoliator, borer, miner, root feeder, etc. (for \ninsect pests) \n3.2. Grass, broad leaf, or sedge (for weeds)  \n3.3. Bacterium, fungus, virus, plant parasitic \nnematode, mycoplasma, viroids  (for \ndiseases) \n4. Life cycle (for insect \npests and their \nnatural enemies, and \nother beneficial \norganisms) \n4.1   Complete life cycle \n4.1.1. Egg  \n4.1.2. Larva \n4.1.3. Pupa \n4.1.4. Adult \n4.2   Incomplete life cycle  \n4.2.1. Egg \n4.2.2. Nymph \n4.2.3. Adult \n \n5. Behavior (for insect \npests and natural \nenemies, and other \nbeneficial organisms) \n5.1. Where it stays/ Habitat \n5.2. Diurnal/nocturnal \n5.3. Destructive stage \n5.4. Alternate hosts/predators \n5.5. Reproduction as influenced by external \nfactors \n5.6. Response to external factors (e.g. rain, \nsevere dehydration, shading) \n5.7. Nature and extent of damage \n5.8. Critical period of infestation \n6. Signs (for insect \npests) and \n6.1. Signs of pest infestation such as population\n\n--- PDF PAGE 35 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n33\nsymptoms (for \ndiseases) \ndensity, severity of damage, etc. \n6.2. Manifestations of the disease such as \nspotting, rotting, wilting, blighting, curling, \nyellowing, dwarfing, etc. \n7. Stage of plant growth \n7.1. Seed / Seedling \n7.2. Vegetative stage \n7.3. Reproductive stage \n8. Farm work \nprocedures \n8.1. Supervisor/s’ oral and written instructions \n8.2. Standard operating procedures \n8.3. Pest management plan \n8.4. Best practice guidelines on pest management\n8.5. Good agricultural practices \n8.6. OHS procedures \n9. Bio-control measures \n9.1. Enhancement of natural enemies population \n(e.g., avoid indiscriminate use of pesticides) \n9.2. Supplemental use of other beneficial \norganisms (e.g., parasitoids, predators, insect \npathogens, entomopathogens) \n9.3. Planting repellent and trap crops \n9.4. Selective use of botanical pesticides \n9.5. Others (e.g., natural population build-up of \nfrogs, lizards, snakes)\n10. Integrated Pest \nManagement (IPM) \n10.1. Biological, cultural, and physical \nmanagement options  that can be \nintegrated to avoid indiscriminate use of \nchemical measures\n11. Environment \n11.1. Soil Fertility \n11.2. Soil Type \n11.3. Weather Conditions \n11.4. Topography \n11.5. Water, Etc. \n12. Other relevant \ninformation \n12.1. Crop variety \n12.2. Cropping pattern/system \n12.3. Stage of the crop \n13. Supplies and \nmaterials \nMay include: \n13.1. farmer-level or village-laboratory mass-\nproduced biological control agents (e.g., \nparasitoids, predators, or insect pathogens) \n13.2. other natural enemies, or beneficial \norganisms \n13.3. selected botanical pesticides (e.g. chilli or \nhot pepper solution, marigold extracts) \n13.4. repellent crops (e.g. marigold) \n13.5. trap crops (e.g. susceptible crops or \nalternate hosts of destructive pests)\n\n--- PDF PAGE 36 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n34\n13.6. cards \n13.7. paper strips \n13.8.\nmeasuring cup, others\n14. Tools, machinery ,  \nequipment, and \nfacilities \nMay include: \n14.1. village-level bio-control laboratory \n14.2. mist blower/sprayer/applicator \n14.3. nets, others \n15. Personal protective \nequipment   \nMay include: \n15.1. Boots \n15.2. Hat/Hard hat \n15.3. Coveralls, Gloves \n15.4. Protective eyewear \n15.5. Hearing protection \n15.6. Respirator or face mask \n15.7. Sun protection (sun hat, sun screen). \n16. OHS requirements \nSystems and procedures for: \n16.1. the safe operation and maintenance of \ntools, machinery and equipment. \n16.2. identifying hazards, assessing and \nreporting risks. \n16.3. emergency operating procedures. \n16.4. safe lifting, carrying and handling \ntechniques. \n16.5. manual handling systems and procedures, \nhandling and storage of hazardous \nsubstances, and the appropriate use of \npersonal protective clothing and equipment. \n16.6. manual on understanding hazards on the \nuse of pesticides to natural enemies, \nhumans, and other non-target organisms \n16.7. safe systems and procedures for outdoor \nwork including protection from solar \nradiation, protection of people in the \nworkplace, protection from hazardous \nnoise, mechanical vibration, organic and \nother dusts, and protection from fire risk.\n17. Records \n17.1. Date and time of application \n17.2. Location \n17.3. Specific control measures implemented  \n17.4. Supplies and materials used (quantity, cost, \netc.) \n17.5. Labor (man days and wage rates) \n17.6. Field assessment records\n\n--- PDF PAGE 37 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n35"
