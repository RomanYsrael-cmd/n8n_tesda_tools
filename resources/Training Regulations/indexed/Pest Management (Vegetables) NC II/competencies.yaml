          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate:\n\n1.1. assessed the area;\n1.2. identified the range of pests present and their\nnatural enemies, and other beneficial\norganisms;\n1.3. collected data related to natural enemy\npopulations and pest infestations; and\n1.4. maintained records and provided feedback.\n\nThe skills and knowledge required to conduct field\nassessment must be transferable to a different work\nenvironment. For example, this may include different\nvegetables, fields/farms and pests.\n2. Underpinning\nKnowledge and\nAttitude\nKnowledge and understanding are essential to apply\nthis standard in the workplace, to transfer the skills to\nother contexts, and to deal with unplanned events.\nThe knowledge requirements for this competency\nstandard are listed below:\n2.1.\nPest and natural enemy recognition, and\nother beneficial organisms\n2.2.\nRange of vegetable species/varieties\n2.3.\nIPM concepts and principles (Identification,\nbiology, behavior, population dynamics)\n2.4.\nProcedures for agro-ecosystems analysis\n(AESA)\n2.5.\nInteractions among pest infestations, natural\nenemy populations, other beneficial\norganisms, the environment and other\nrelevant information (e.g. cropping\nsystems/patterns, crop varieties and others)\n2.6.\nNutritional disorders (deficiencies in NPK and\nmicroelements)\n2.7.\nOHS risks, hazards, and prevention\n2.8.\ndata collection requirements\n2.9.\nrecord keeping requirements\n2.10. reporting requirements\n\nAttitude:\n2.11. Accuracy\n2.12. Environment-conscious\n2.13. Positive work values\n2.14. Work ethics\n2.15. Cost consciousness\n2.16. Safety consciousness\n\n--- PDF PAGE 31 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n29\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate\nliteracy and numeracy levels as well as some\ncomplementary skills are required. These include\nthe ability to:\nLiteracy:\n3.1.\npests and natural enemy recognition, and\nother beneficial organisms\n3.2.\nsymptoms recognition\n3.3.\nfamiliarity with life cycle/biology, habitat and\ndestructive stage of pest and natural enemies\n3.4.\nfollow guidelines and procedures for\ninspection activities\n\nNumeracy:\n3.5.\ndensity count / estimation\n3.6.\ndamage degree estimation\n3.7.\ncollect data\n3.8.\nkeep records\n\nInterpersonal:\n3.9.\nmake oral and written reports\n3.10. communicate with farmers, team members\nand supervisor\n4. Resource Implications\nThe following resources MUST be provided:\n4.1. vegetable farm or a simulated\nworkplace/demonstration farm\n4.2. farm procedures relating to field assessment\nactivities\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1. Direct observation with oral questioning\n5.2. Demonstration with oral questioning\n5.3. Portfolio assessment\n6. Context for\nAssessment\n6.1. Assessment should be in a vegetable field or in\na simulated workplace/demo farm\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 32 ---\n____________________________________________________\nTR – PEST MANAGEMENT (VEGETABLES) NC II Promulgated July 2007\n\n30\nUNIT OF COMPETENCY: APPLY BIO-CONTROL MEASURES\n\nUNIT CODE :"
