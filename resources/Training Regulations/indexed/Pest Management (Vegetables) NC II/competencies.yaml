          "source_text": ") \n1.  Identify target pests and \ntheir natural enemies, \nand other beneficial \norganisms \n1.1. \nPests, which warrant action, and their \nnatural enemies, and other beneficial \norganisms are identified according to \ngeneral classification / life cycle and \nbehavior / signs and symptoms  and \nstage of plant growth \n1.2. \nThe supervisor, or the pest specialist, is \nconsulted as required to validate \nidentification of target pests according to \nfarm work procedures \n1.3. \nRequirement for cultural management \nstrategies are assessed in line with the IPM \nstrategy \n2.  Select cultural \nmanagement strategies \nand prepare for  \nimplementation \n2.1. \nCultural management strategies are \nselected according to target pest and their \nnatural enemies, and other beneficial \norganisms, availability and appropriateness \nto prevailing pest density, level of \nseverity/infestation,  the environment and \nother relevant information in accordance \nwith farm work procedures \n2.2. \nAll necessary supplies and materials, and \ntools, machinery  and equipment are \nprepared according to farm work \nprocedures \n2.3. \nSuitable personal protective equipment is \nselected according to OHS requirements\n\n--- PDF PAGE 40 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n38\n \n3.  Implement control \nactivities \n3.1. Appropriate cultural management strategies \nare implemented in line with farm work \nprocedures \n3.2. Tools, machinery and equipment, as well as \nPPE are used in accordance with OHS \nrequirements \n \n4.  Check performance of \ncontrol activities \n4.1. \nControl activities are recorded and \nmonitored in line with farm work procedures \n4.2. \nSupplemental and remedial actions are \nundertaken, if necessary, according to work \ninstructions \n4.3. \nRecords are maintained according to \nstandard procedures\n\n--- PDF PAGE 41 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n39\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Pests  \n \n1.1. Insect pests \n1.2. Weeds \n1.3. Diseases \n1.4. Others (snails, birds,rodents, slugs, etc.) \n2. Natural enemies \nand beneficial \norganisms  \n2.1. Parasites/parasitoids \n2.2. Predators  \n2.3. Pollinators  \n2.4. Repellant or refuge plants \n2.5. Micro-organisms / Entomopathogens \n3. General \nclassification  \n3.1. Defoliator, borer, miner, root feeder, etc. (for \ninsect pests) \n3.2. Grass, broad leaf, or sedge (for weeds)  \n3.3. Bacterium, fungus, virus, plant parasitic \nnematode, mycoplasma, viroids  (for diseases) \n4. Life cycle (for \ninsect pests and \ntheir natural \nenemies, and other \nbeneficial \norganisms) \n4.1   Complete life cycle \n4.1.1. Egg  \n4.1.2. Larva \n4.1.3. Pupa \n4.1.4. Adult \n4.2   Incomplete life cycle  \n4.2.1. Egg \n4.2.2. Nymph \n4.2.3. Adult \n4.2.4. Niad \n4.2.5. Adult \n5. Behavior (for insect \npests and natural \nenemies, and other \nbeneficial \norganisms) \n5.1. Where it stays/ Habitat \n5.2. Diurnal/nocturnal \n5.3. Destructive stage \n5.4. Alternate hosts/predators \n5.5. Reproduction as influenced by external factors \n5.6. Response to external factors (e.g. rain, severe \ndehydration, shading) \n5.7. Nature and extent of damage \n5.8. Critical period of infestation \n6. Signs (for insect \npests) and \n6.1. Signs of pest infestation such as population \ndensity, severity of damage, etc.\n\n--- PDF PAGE 42 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n40\nsymptoms (for \ndiseases) \n6.2. Manifestations of the disease such as spotting, \nrotting, wilting, blighting, curling, yellowing, \ndwarfing, etc. \n7. Stage of plant \ngrowth \n7.1. Seed / Seedling \n7.2. Vegetative stage \n7.3. Reproductive stage \n8. Farm work \nprocedures \n8.1. Supervisor/s’ oral and written instructions \n8.2. Standard operating procedures \n8.3. Pest management plan \n8.4. Best practice guidelines on pest management \n8.5. Good agricultural practices \n8.6. OHS procedures \n9. Cultural management \nstrategies \n9.1. \nLand preparation \n9.2. \nHilling up \n9.3. \nPruning / Thinning \n9.4. \nTrellising \n9.5. \nWeeding \n9.6. \nIrrigation \n9.7. \nSanitation \n9.8. \nSoil sterilization / solarization \n9.9. \nMulching \n9.10. Timing of planting and harvesting \n9.11. Use of resistant varieties \n9.12. Crop rotation  \n9.13. Intercropping \n9.14. Others\n10. Integrated Pest \nManagement (IPM) \n10.1 Biological, cultural, and physical management \noptions  that can be integrated to avoid \nindiscriminate use of chemical measures\n11.   Environment \n11.1 Soil Fertility \n11.2 Soil Type \n11.3 Weather Conditions \n11.4 Topography \n11.5\nWater, Etc\n12.   Other relevant \ninformation  \n12.1. Crop variety \n12.2. Cropping pattern/system \n12.3. Stage of the crop\n13. Supplies and \nmaterials \nMay include:  \n13.1. fumigants \n13.2. disinfectants \n13.3. soil inoculants (e.g trichoderma for soil \nsterilization) \n13.4. planting materials of resistant crops and \nintercrops \n13.5. wires \n13.6. bamboo poles \n13.7. mulching materials \n13.8. plastic sheets, others\n\n--- PDF PAGE 43 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n41\n14. Tools, machinery ,  \nequipment, and \nfacilities \n14.1  Tools may include: \n14.1.1  hoe \n14.1.2  bolo \n14.1.3  shovel \n14.1.4  hose \n14.1.5  pruning shears/scissors, others   \n14.2  Machinery and equipment may include: \n14.2.1  tractor \n14.2.2  other farm implements \n14.2.3  animal-drawn farm implements \n15. Personal protective \nequipment   \nMay include: \n15.1. Boots \n15.2. Hat/Hard hat \n15.3. Coveralls, Gloves \n15.4. Protective eyewear \n15.5. Hearing protection \n15.6. Respirator or face mask \n15.7. Sun protection (sun hat, sun screen). \n16. OHS requirements \nSystems and procedures for: \n16.1. the safe operation and maintenance of tools, \nmachinery and equipment. \n16.2. identifying hazards, assessing and reporting \nrisks. \n16.3. emergency operating procedures. \n16.4. safe lifting, carrying and handling techniques. \n16.5. manual handling systems and procedures, \nhandling and storage of hazardous \nsubstances, and the appropriate use of \npersonal protective clothing and equipment. \n16.6. safe systems and procedures for outdoor \nwork including protection from solar radiation, \nprotection of people in the workplace, \nprotection from hazardous noise, mechanical \nvibration, organic and other dusts, and \nprotection from fire risk.\n17. Records \n17.1. Date and time of application \n17.2. Location \n17.3. Specific control measures implemented  \n17.4. Supplies and materials used (quantity, cost, \netc.) \n17.5. Labor (man days and wage rates) \n17.6. Field assessment records\n\n--- PDF PAGE 44 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n42"
