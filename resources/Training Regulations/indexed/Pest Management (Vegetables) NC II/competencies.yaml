        "source_title": "APPLY PHYSICAL-CONTROL MEASURES",
        "source_text": "--- PDF PAGE 46 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n44\nUNIT OF COMPETENCY:    APPLY PHYSICAL-CONTROL MEASURES \n \nUNIT CODE                     :    AGR321323 \n \nUNIT DESCRIPTOR:   This unit covers the skills, knowledge and attitude required to \napply physical-control measures for pests, in line with the \nIPM strategy.  It includes identifying the target pests and their \nnatural enemies, and other beneficial organisms, selecting \nthe physical control activities and preparing for their \nimplementation, implementing the control activities and \nchecking the performance of the control activities.  \n \n \nELEMENT\nPERFORMANCE CRITERIA \n(Italicized terms are elaborated in the range of variables) \n1.  Identify target pests and \ntheir natural enemies, \nand other beneficial \norganisms \n1.1. Pests, which warrant action, and their \nnatural enemies, and other beneficial \norganisms are identified according to \ngeneral classification / life cycle and \nbehavior / signs and symptoms  and stage \nof plant growth \n1.2. The supervisor, or the pest specialist, is \nconsulted as required to validate identification \nof target pests according to farm work \nprocedures \n1.3. Requirement for physical control measures \nis assessed in line with the IPM strategy \n \n2.  Select physical control \nmeasures and prepare \nfor  implementation \n2.1. Physical control measures are selected \naccording to target pest and their natural \nenemies, and other beneficial organisms, \navailability and appropriateness to prevailing \npest density, level of severity/infestation,  the \nenvironment and other relevant \ninformation in accordance with farm work \nprocedures \n2.2. All necessary supplies and materials, and \ntools, machinery  and equipment are \nprepared according to farm work procedures \n2.3. Suitable personal protective equipment is \nselected according to OHS requirements\n\n--- PDF PAGE 47 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n45\n \nELEMENT \nPERFORMANCE CRITERIA \n3.  Implement control \nactivities \n3.1. Appropriate physical control measures are \nimplemented in line with farm work \nprocedures \n3.2. Tools, machinery and equipment, as well as \nPPE are used in accordance with OHS \nrequirements \n \n4.  Check performance of \ncontrol activities \n4.1. Control activities are recorded and monitored \nin line with farm work procedures \n4.2. Supplemental and remedial actions are \nundertaken, if necessary, according to work \ninstructions \n4.3. Records are maintained according to \nstandard procedures\n\n--- PDF PAGE 48 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n46\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Pests  \n \n1.1. Insect pests \n1.2. Weeds \n1.3. Diseases \n1.4. Others (snails, birds,rodents, slugs, etc.) \n2. Natural enemies \nand beneficial \norganisms  \n2.6. Parasites/parasitoids \n2.7. Predators  \n2.8. Pollinators  \n2.9. Repellant or refuge plants \n2.10. Micro-organisms / Entomopathogens \n3. General \nclassification  \n3.1. Defoliator, borer, miner, root feeder, etc. (for \ninsect pests) \n3.2. Grass, broad leaf, or sedge (for weeds)  \n3.3. Bacterium, fungus, virus, plant parasitic \nnematode, mycoplasma, viroids  (for diseases) \n4. Life cycle (for \ninsect pests and \ntheir natural \nenemies, and other \nbeneficial \norganisms) \n4.1   Complete life cycle \n4.1.1. Egg  \n4.1.2. Larva \n4.1.3. Pupa \n4.1.4. Adult \n \n4.2   Incomplete life cycle  \n4.2.1. Egg \n4.2.2. Nymph \n4.2.3. Adult \n \n5. Behavior (for insect \npests and natural \nenemies, and other \nbeneficial \norganisms) \n5.1. Where it stays/ Habitat \n5.2. Diurnal/nocturnal \n5.3. Destructive stage \n5.4. Alternate hosts/predators \n5.5. Reproduction as influenced by external factors \n5.6. Response to external factors (e.g. rain, severe \ndehydration, shading) \n5.7. Nature and extent of damage \n5.8. Critical period of infestation \n \n6. Signs (for insect \n6.1. Signs of pest infestation such as population\n\n--- PDF PAGE 49 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n47\npests) and \nsymptoms (for \ndiseases) \ndensity, severity of damage, etc. \n6.2. Manifestations of the disease such as spotting, \nrotting, wilting, blighting, curling, yellowing, \ndwarfing, etc. \n7. Stage of plant \ngrowth \n7.1. Seed / Seedling \n7.2. Vegetative stage \n7.3. Reproductive stage \n8. Farm work \nprocedures \n8.1. Supervisor/s’ oral and written instructions \n8.2. Standard operating procedures \n8.3. Pest management plan \n8.4. Best practice guidelines on pest management \n8.5. Good agricultural practices \n8.6. OHS procedures \n9. Physical control \nmeasures \n9.1. Hand pulling \n9.2. Hoeing \n9.3. Tillage \n9.4. Mulching \n9.5. Wrapping / bagging \n9.6. Pruning / thinning \n9.7. Use of physical barriers (e.g. nets)  \n9.8. Traps (e.g. sticky traps, bait traps)  \n9.9. Others\n10. Integrated Pest \nManagement (IPM) \n10.1. Biological, cultural, and physical management \noptions  that can be integrated to avoid \nindiscriminate use of chemical measures\n11.   Environment \n11.1. Soil Fertility \n11.2. Soil Type \n11.3. Weather Conditions \n11.4. Topography \n11.5. Water, Etc. \n12.   Other relevant \ninformation  \n12.1. Crop variety \n12.2. Cropping pattern/system \n12.3. Stage of the crop \n13. Supplies and \nmaterials \nMay include: \n13.1. gloves \n13.2. mulching materials (e.g. cogon grass, rice \nstraw, other grasses) \n13.3. plastic (e.g. polyethylene sheets) \n13.4. wrapping/bagging materials (e.g. newspaper, \nplastic)   \n13.5. disinfectants  \n13.6. trapping materials \n13.7. nets \n \n14. Tools, machinery ,  \nMay include:\n\n--- PDF PAGE 50 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n48\nequipment, and \nfacilities \n14.1 hoe \n14.2 bolo \n14.3 shovel \n14.4 pruning shears \n14.5 work animal \n14.6 animal- drawn farm implements \n15. Personal \nprotective \nequipment   \nMay include: \n15.1. Boots \n15.2. Hat/Hard hat \n15.3. Coveralls, Gloves \n15.4. Protective eyewear \n15.5. Hearing protection \n15.6. Respirator or face mask \n15.7. Sun protection (sun hat, sun screen) \n16. OHS requirements \nSystems and procedures for: \n16.1. the safe operation and maintenance of tools, \nmachinery and equipment. \n16.2. identifying hazards, assessing and reporting \nrisks. \n16.3. emergency operating procedures. \n16.4. safe lifting, carrying and handling techniques. \n16.5. manual handling systems and procedures, \nhandling and storage of hazardous \nsubstances, and the appropriate use of \npersonal protective clothing and equipment. \n16.6. safe systems and procedures for outdoor \nwork including protection from solar radiation, \nprotection of people in the workplace, \nprotection from hazardous noise, mechanical \nvibration, organic and other dusts, and \nprotection from fire risk.\n17. Records \n17.1. Date and time of application \n17.2. Location \n17.3. Specific control measures implemented  \n17.4. Supplies and materials used (quantity, cost, \netc.) \n17.5. Labor (man days and wage rates) \n17.6. Field assessment records\n\n--- PDF PAGE 51 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n49\nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate: \n \n1.1. identified target pests and their natural \nenemies, and other beneficial organisms \n1.2. selected and applied physical control \nmeasures  \n1.3. followed work instructions \n1.4. complied with OHS requirements \n \nThe skills and knowledge required to apply physical \ncontrol measures for managing pests must be \ntransferable to a different work environment. For \nexample, this may include different vegetables, pests \nand farms/areas. \n2.  Underpinning \nKnowledge and \nAttitude \nKnowledge and understanding are essential to apply \nthis standard in the workplace, to transfer the skills to \nother contexts, and to deal with unplanned events.  \nThe knowledge requirements for this competency \nstandard are listed below: \n \n2.1. IPM concepts and principles (Identification, \nbiology, behavior, population dynamics) \n2.2. Range of vegetable species / varieties \n2.3. Range of common pests and their natural \nenemies  \n2.4. Economic, aesthetic or environmental \nthresholds for a range of pests \n2.5. Physical control measures  \n2.6. Range and use of tools and farm implements \nfor applying physical control measures \n2.7. Occupational health and safety requirements \n2.8. Selection, use and maintenance of personal \nprotective equipment \n2.9. Relevant provincial/municipal legislation and \nregulations \n \nAttitude: \n2.10. Accuracy \n2.11. Environment-conscious \n2.12. Positive work values \n2.13. Work ethics \n2.14. Cost consciousness \n2.15.\nSafety consciousness\n\n--- PDF PAGE 52 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n50\n \n3.  Underpinning Skills  \nTo achieve the performance criteria, appropriate \nliteracy and numeracy levels as well as some \ncomplementary skills are required.  These include \nthe ability to: \nLiteracy: \n3.1. \nRecognize common pests of vegetables and \ntheir natural enemies  \n3.2. \nDifferentiate between symptoms of diseases \nand nutrient deficiencies \n3.3. \nApply physical control measures \n3.4. \nUse, maintain and store appropriate PPE \n3.5. \nFollow work instructions \n \nNumeracy: \n3.6. \nDensity count / estimation \n3.7. \nDamage degree estimation  \n3.8. \nCollect data \n3.9. \nKeep records \n \nInterpersonal: \n3.10. Make oral and written reports \n3.11. Communicate with farmers, team members \nand supervisor \n4.  Resource Implications \nThe following resources MUST be provided: \n4.1. Vegetable farm or a simulated workplace/demo \nfarm \n4.2. Enterprise procedures relating to physical \ncontrol measures\n5.  Methods of \nAssessment \nCompetency must be assessed through: \n5.1. Direct observation with oral questioning  \n5.2. Demonstration with oral questioning \n5.3.\nPortfolio assessment\n6.  Context for \nAssessment \n6.1. Assessment should be in a vegetable farm or \nin a simulated workplace/demo farm \n6.2. Demonstration of competency over time and \non a number of occasions.\n",
