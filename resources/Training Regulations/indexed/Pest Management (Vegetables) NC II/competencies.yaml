        "source_text": "--- PDF PAGE 17 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n15\nCOMMON COMPETENCIES \n \nUNIT TITLE  \n: \nAPPLY SAFETY MEASURES IN FARM \nOPERATIONS \n \nUNIT CODE  \n:  \nAGR321201 \n \nUNIT DESCRIPTOR :  \nThis unit covers the knowledge, skills and attitudes \nrequired to perform safety measures effectively and \nefficiently. It includes identifying areas, tools, materials, \ntime and place in performing safety measures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nDetermine areas of \nconcern for safety \nmeasures  \n1.1 \nWork tasks are identified in line with farm \noperations \n1.2 \nPlace for safety measures are determined in line \nwith farm operations \n1.3 \nTime for safety measures are determined in line with \nfarm operations \n1.4 \nAppropriate tools, materials and outfits are \nprepared in line with job requirements\n2. \nApply appropriate \nsafety measures \n2.1 \nTools and materials are used according to \nspecifications and procedures \n2.2 \nOutfits are worn according to farm requirements \n2.3 \nEffectivity/Shelf life/Expiration of materials are \nstrictly observed \n2.4 \nEmergency procedures are known and followed to \nensure a safe work requirement \n2.5 \nHazards in the workplace are identified and reported \nin line with farm guidelines\n3. \nSafekeep/dispose \ntools, materials and \noutfit \n3.1 \nUsed tools and outfit are cleaned after use and \nstored in designated areas \n3.2 \nUnused materials are properly labeled and stored \naccording to manufacturers recommendation and \nfarm requirements \n3.3 \nWaste materials are disposed according to \nmanufacturers, government and farm requirements\n\n--- PDF PAGE 18 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n16\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nWork tasks \nWork task may be selected from any of the subsectors: \n1.1 \nAquaculture \n1.2 \nAnimal Production \n1.3 \nCrop Production \n1.4 \nPost-harvest \n1.5 \nAgri-marketing \n1.6\nFarm Equipment\n2. \nPlace \n2.1 \nAnimal pens, cages, barns \n2.2 \nFish ponds, cages \n2.3 \nStock room/storage areas/warehouse \n2.4 \nField/farm/orchard \n3. \nTime \n3.1 \nVaccination and medication period \n3.2 \nFertilizer and pesticides application \n3.3 \nFeed mixing and feeding \n3.4 \nHarvesting and hauling \n3.5 \nCleaning, sanitizing and disinfecting \n3.6\nDressing, butchering and castration\n4. \nTools, materials and \noutfits \n4.1 \nTools \n4.1.1 \nWrenches \n4.1.2 \nScrew driver \n4.1.3 \nPliers \n4.2 \nMaterials \n4.2.1 \nBottles \n4.2.2 \nPlastic \n4.2.3 \nBags \n4.2.4 \nSyringe \n4.3 \nOutfit \n4.3.1 \nMasks \n4.3.2 \nGloves \n4.3.3 \nBoots \n4.3.4 \nOverall coats \n4.3.5 \nHat \n4.3.6\nEye goggles\n5. \nEmergency procedures \n5.1 \nLocation of first aid kit \n5.2 \nEvacuation \n5.3 \nAgencies contract \n5.4\nFarm emergency procedures\n6. \nWaste materials \n6.1 \nAnimal manure \n6.2 \nWaste water \n6.3 \nSyringes \n6.4 \nUnused farm chemicals e.g. pesticides, chemicals, \nfertilizers \n6.5 \nExpired reagents \n6.6\nDead animals\n7. \nHazards \n7.1 \nChemical \n7.2 \nElectrical \n7.3\nFalls\n\n--- PDF PAGE 19 ---\n____________________________________________________ \nTR – PEST MANAGEMENT  (VEGETABLES)  NC II               Promulgated  July 2007                                                   \n \n \n17\nEVIDENCE GUIDE \n \n1. Critical Aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined areas of concern for safety measures \n1.2 Applied appropriate safety measures according to \nindustry requirements \n1.3 Prepared tools, materials and outfit needed \n1.4 Performed proper disposal of used materials \n1.5 Safekeep/cleaned tools, materials and outfit in designated \nfacilities \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Safety Practices  \n2.1.1 Implementation of regulatory controls and policies \nrelative to treatment of area and application of \nchemicals \n2.1.2 Proper disposal of waste materials \n2.2 Codes and Regulations \n2.2.1 Compliance to health program of DOH and DENR \n2.2.2 Hazard identification \n2.2.3 Emergency procedures \n \n2.3 Tools and Equipment: Uses and Specification \n2.3.1 Masks, gloves, boots, overall coats for health \nprotection \n \n2.4 Maintenance \n2.4.1 \nRegular check-up and repair of tools, materials \nand outfit before and after use\n3. Underpinning \nSkills \n3.1 Ability to recognize effective tools, materials and outfit \n3.2 Ready skills required to read labels, manuals and other \nbasic safety information \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Practical demonstration  \n4.2 Third Party Report \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Farm location \n5.2 Tools, equipment and outfits appropriate in applying \nsafety measures \n6. Context of \nAssessment \n6.1 \nAssessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
