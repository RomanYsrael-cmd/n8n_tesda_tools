    "source_text": "SECTION 3 TRAINING STANDARDS\n\nGAS TUNGSTEN ARC WELDING (GTAW)\n\n3.1 CURRICULUM DESIGN\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for GAS TUNGSTEN ARC WELDING\n(GTAW).\n\nCourse Title: GTAW\n\n Level: II\n\nNominal Training Hours: 18 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 194 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nGTAW Welder in accordance with industry standards. It covers core competencies\nsuch as Setting-up Welding Equipment, Preparing Weld Materials, Fitting up Weld\nMaterials, Welding Carbon Steel Plates Using GTAW, Welding Carbon Steel Plates\nand Pipes Using GTAW and Repairing Welds.\n\nBASIC COMPETENCIES\n\n1. Participate in\nworkplace\ncommunicati\non\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice\ncareer\nprofessionali\nsm\n3.1Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 52 ---\nWeldncii11-3\n01/04/05\n\n50\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n\n4.2 Control hazards and risks\n\n4.3 Maintain occupational\nhealth\n and safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nwork safely\n1.1 Identify hazardous areas\nand conditions\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling of\ntools, equipment and\nmaterials\n1.4 Explain/perform first aid\nprocedure\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\napplication\n\n• Oral questioning\n• Written\n• demonstration\n2. Contribute to\nquality\nsystem\n2.1 Inspect work done\n2.2 Apply quality standards to\nwork\n2.3 Protect company/\ninstitution properties\n2.4 Protect customer interest\n• Lecturette\n• Practical\napplication\n\n• Oral questioning\n• Written\n• Demonstration\n3. Use hand\ntools\n3.1 Use different handtools\n3.2 Maintain handtools\n• Lecturette\n• Practical\napplication\n• Oral questioning\n• Written\n• Demonstration\n4. Interpret\nBlueprints\n4.1 Interpret technical\ndrawing.\n4.2 Interpret welding symbols\n\n• Lecturette\n\n• Practical\napplication\n• Oral\nquestioning\n• Written test\n\n5. Perform\n Com\nindustry\ncalculations\n5.1 Solve mathematical\nproblems\n5.2 Convert systems of\nmeasurement\n5.3 Measure workpiece\n• Lecturette\n• Practical\napplication\n\n• Oral questioning\n\n• Written test\n\n6. Prepare\nWeld\nMaterials\n6.1 Identify the different\ncutting equipment and\naccessories\n6.2 Identify types of mild steel\n• Lecturette\n• Practical\napplication\n• Observation\n• Demonstration\nand oral\nquestioning\n\n--- PDF PAGE 53 ---\nWeldncii11-3\n01/04/05\n\n51\nelectrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective\nequipment\n6.5 Prepare welding\nconsumables, tools and\naccessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n\n• Written test\n\n7. Set-up\nWelding\nEquipment\n7.1 Explain welding principles\nand concepts.\n7.2 Identify the parts of\nwelding machine\n7.3 Set up welding machine\nand accessories\n7.4 Set up welding\npositioners, jigs and\nfixtures\n7.5 Set up pre-heating\nequipment (as required)\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\nbacking plate and\nstiffener.\n8.2 Explain the methods of\nstriking an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen,\nbacking plate and\nstiffener.\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n9. Repair\n Welds\n9.1 Identify causes and\nprevention of the different\nweld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and\nequipment\n9.4 Remove defects\n9.5 Perform re-welding\n• Lecturette\n• Demonstration\n\n• Observation and\noral questioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 54 ---\nWeldncii11-3\n01/04/05\n\n52\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld\nCarbon\nSteel\nPlates\nUsing\nGTAW\n1.1 Explain GTAW welding\nprinciples\n1.2 Explain the different\nshielding gases and their\nuses\n1.3 Deposit weld beads on\nplates\n1.4 Weld plates in single pass\nfillet joints in all positions\n1.5 Weld plates in multiple\npass fillet joints in all\npositions\n1.6 Weld plates in single pass\ngroove joints in all\npositions\n1.7 Weld plates in multiple\npass groove joints in all\npositions\n• Discussion\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•\n\n2. Weld\nCarbon\nSteel Pipes\nUsing\nGTAW\n2.1 Weld plates in single pass\ngroove joints in overhead\npositions\n2.2 Weld pipe in 2G, 5G and\n6G positions\n• Discussion\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n\n--- PDF PAGE 55 ---\nWeldncii11-3\n01/04/05\n\n53\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-\nbased TVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various\ntypes of delivery modes, both on and off-the-job as long as the\nlearning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when\ndesigning training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n\n•\nModular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery\n.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n--- PDF PAGE 56 ---\nWeldncii11-3\n01/04/05\n\n54\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n•\ncompleted training in SMAW NC II or a holder of SMAW NC II\n•\ncan communicate both oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS,EQUIPMENT AND MATERIALS\n\nRecommended list of tools and materials per trainee for GAS TUNGSTEN\nARC WELDING - NC II\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12 units\nGTAW Welding\nmachine and\naccessories*\n250 kls.\nFiller wire, 1.6\nor 2.4mm dia.\n50 pcs.\nSteel brush\n12 pcs.\nWelding\npositioners\n25pcs.\nMild steel flat\nbar 3.2mm x\n50mm x 6m\n12 pcs.\nPlier/tongs\n12 units\nPortable disc\ngrinder\n25pcs.\nMild steel flat\nbar 6mm x\n50mm x 6m\n20 pcs. Files-bastard\ncut\n1 unit\nExhaust fan\n25 pcs.\n\nCarbon steel\npipe, 50mm dia.\nx 6m, schedule\n40\n25 pcs.\nWelding Mask\n2 units\nWork bench w/\nbench vice on 4\ncorners\n5 cyl.\nArgon gas\n25 sets\nLeather\napron/jacket\n1 unit\nPedestal /bench\ngrinding machine\n1 pc.\nDark glass\n25 sets Leather gloves,\nlong\n1 unit\nIndustrial fan\n14 pcs.\nLens clear glass\n5 pcs.\nSafety goggles,\nwide vision,\nclear\n\n10pcs\nCutting disc\n3/32” x 5/8” x 4”\ndia.\n5 pcs\nOxy-acetylene\ngoggles\n\n20 pcs.\nGrinding disc\n1/4” x 5/8” x 4”\ndia.\n12 pcs.\nTry square 300\nmm. long\n\n1 tube\nMetal marker\n\n--- PDF PAGE 57 ---\nWeldncii11-3\n01/04/05\n\n55\n12 pcs.\nSteel square\n300 mm. long\n\n10pcs.\nTungsten\nElectrode 2.4\nmm\n12 pcs. Files-half round\n5 pcs.\nFillet gauge\n5 pcs.\nHand Hacksaw\n\nNote: Tools and equipment for all welding process.\n* for GTAW welding process\n\n3.5 TRAINING FACILITIES\n GTAW NC II\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area*\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 58 ---\nWeldncii11-3\n01/04/05\n\n56\n3.6 TRAINERS QUALIFICATIONS\n\nGTAW NC II\n\nTRAINER QUALIFICATION (TQ II)\n\n- Must be a holder of GTAW Welder NC II\n- Must have undergone training on Training Methodology II (TM II)\n- Must be physically and mentally fit\n- *Must have at least 2 years job/industry experience\n- Must be a civil service eligible (for government position or appropriate professional\nlicense issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 59 ---\nWeldncii11-3\n01/04/05\n\n57"
