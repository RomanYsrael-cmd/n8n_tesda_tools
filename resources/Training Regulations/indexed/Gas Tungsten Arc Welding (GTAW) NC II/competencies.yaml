  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency\nrequired in Gas Tungsten Arc Welding (GTAW) NC II.\n\nBASIC COMPETENCIES\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3 Appropriate medium is used to transfer information\nand ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6 Defined workplace procedures for the location and\nstorage of information are used\n1.7 Personal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose\nand established protocols\n2.4 Workplace interactions are conducted in a courteous\nmanner\n2.5 Questions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6 Meetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1 Range of forms relating to conditions of employment\nare completed accurately and legibly\n3.2 Workplace data is recorded on standard workplace\nforms and documents\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents\nare identified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nWeldncii11-3\n01/04/05\n\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nWeldncii11-3\n01/04/05\n\n4\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4.\nInternet\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\nWeldncii11-3\n01/04/05\n\n5\nUNIT OF COMPETENCY: WORK IN A TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and\nobjectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\nWeldncii11-3\n01/04/05\n\n6\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources\nof\ninformation\n2.1.\nStandard\noperating\nand/or\nother\nworkplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nWeldncii11-3\n01/04/05\n\n7\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge\nand\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning Skills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n 4.2. Materials relevant to the proposed activity or tasks\n5. Methods\nof\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to\nthe work activities of the group\n5.2.\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context\nfor\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nWeldncii11-3\n01/04/05\n\n8\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are maintained in\nthe course of managing oneself based on performance\nevaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve personal,\nteam and organizational goals and objectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per established\nprocedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated as\nproof of career advancement\n3.3 Licenses and/or certifications relevant to job and career\nare obtained and renewed\n\n--- PDF PAGE 11 ---\nWeldncii11-3\n01/04/05\n\n9\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\nWeldncii11-3\n01/04/05\n\n10\n EVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\nWeldncii11-3\n01/04/05\n\n11\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE : 500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2.\nEvaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 14 ---\nWeldncii11-3\n01/04/05\n\n12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3.\nControl hazards\nand risks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly used\nin accordance with organization OHS procedures and\npractices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4.\nMaintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 15 ---\nWeldncii11-3\n01/04/05\n\n13\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nSafety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2.\nHazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n\n--- PDF PAGE 16 ---\nWeldncii11-3\n01/04/05\n\n14\nVARIABLE\nRANGE\n3.\nContingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4.\nPPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n5.\nEmergency-\nrelated drills and\ntraining\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6.\nOHS personal\nrecords\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 17 ---\nWeldncii11-3\n01/04/05\n\n15\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\n Attitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4 Communication skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nWeldncii11-3\n01/04/05\n\n16\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : APPLY SAFETY PRACTICES\n\nUNIT CODE\n\n: MEE721201\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to apply\n safety practices in the workplace.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify hazardous area\n1.1\n\n1.2\nHazards are identified correctly in accordance\nwith OHS principles.\nSafety signs and symbols are identified and\nadhered to.\n2.\nUse protective clothing\nand devices\n2.1\n\nAppropriate protective clothing and devices\ncorrectly selected and used in accordance with\nOHS requirements or industry/company policy\n3.\nPerform safe handling of\ntools, equipment and\nmaterials\n3.1\n\n3.2\nSafety procedures for pre-use check and\noperation of tools and equipment followed in\naccordance with industry/ company policies.\nTools, equipment and materials handled safely in\naccordance with OHS requirements and industry/\ncompany policies.\n4.\nPerform first aid\n4.1\nFirst aid treatment of injuries are carried out\naccording to recommended procedures\n5.\nUse fire extinguisher\n5.1\nFire extinguisher selected and operated correctly\naccording to the type of fire.\n\n--- PDF PAGE 19 ---\nWeldncii11-3\n01/04/05\n\n17\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hazards\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving parts\n2. Protective clothing and\n devices\n Protective clothing and devices may include but is not\n limited to:\n2.1 safety glasses/goggles\n2.2 safety shoes\n2.3 overalls\n2.4 cap\n2.5 gloves\n3. Injuries\nInjuries may include:\n3.1 burns/scalds\n3.2 fractures\n3.3 cuts and abrasions\n3.4 poisoning\n3.5 foreign bodies in the eye\n3.6 concussion\n3.7 shock\n4. Type of fires\nFires involving or caused by:\n4.1 common combustibles (wood, cloth, paper, rubber\nand plastic)\n4.2 flammable liquids (gasoline, oil, solvents, paints, etc.)\n4.3 energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4.4 combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 20 ---\nWeldncii11-3\n01/04/05\n\n18\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 identified hazardous area\n1.2 used protective clothing and devices\n1.3 handled tools, equipment and materials properly\n1.4 performed first aid\n1.5 used fire extinguisher\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety signs, symbols and alarms\n2.2 Safety precautionary measures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.6 Engineering materials\n2.7 Fire extinguishers\n3.\nUnderpinning\nskills\n3.1 Operating machine tools\n3.2 Handling tools and materials\n3.3 Communicating with superiors and co-workers\n3.4 Interpreting instructions\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\n• Competency may be assessed in the workplace or in\n simulated workplace environment.\n\n--- PDF PAGE 21 ---\nWeldncii11-3\n01/04/05\n\n19\nUNIT OF COMPETENCY : INTERPRET DRAWINGS AND SKETCHES\n\nUNIT CODE\n\n: MEE721202\n\nUNIT DESCRIPTOR\n : This unit covers the competencies required to read and\n interpret drawings and sketches.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify standard\nalphabet of lines\n1.1\n1.2\nAlphabet of lines are identified\nUses of the alphabet of lines are explained\n2.\nIdentify orthographic/\nisometric views\n2.1\n2.2\nOrthographic and isometric drawing are identified\nOrthographic and isometric views are explained\n3.\nInterpret standard\ndrawing symbols,\ndimensional tolerances\nand notations\n3.1\n\n3.2\n\nDrawing symbols are interpreted according to\ndrawing standards\nDimensional tolerances, notations are interpreted\naccording to specifications\n\n--- PDF PAGE 22 ---\nWeldncii11-3\n01/04/05\n\n20\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawing\nDrawing technique include\n1.1 Perspective\n1.2 Exploded view\n1.3 Hidden view technique\n\nProjections\n1.4 First angle projections\n1.5 Third angle projections\n2. Tolerance\n2.1 General tolerance\n2.2 Angular tolerance\n2.3 Geometric tolerance\n\n--- PDF PAGE 23 ---\nWeldncii11-3\n01/04/05\n\n21\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate interpreted\ntechnical drawings and sketches.\n2.\nUnderpinning\nknowledge\n2.1 Alphabet of lines\n2.2 Projections\n2.3 Drawing symbols\n2.4 Dimensioning techniques\n2.5 Tolerances\n3.\nUnderpinning\nskills\n3.1 Communication skills (reading and comprehension)\n3.2 Computation skills\n\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Working drawing or plans or sketches\n4.2 Measuring tools\n4.3 Drawings, sketches or blueprint\n4.4 Specimen parts/components\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 direct observation\n5.2 written or oral short answer questions\n5.3 demonstration\n5.4 project/work sample\n5.5 portfolio\n6.\nContext for\nassessment\n• Competency may be assessed in the workplace or in\n simulated workplace environment.\n\n--- PDF PAGE 24 ---\nWeldncii11-3\n01/04/05\n\n22\nUNIT OF COMPETENCY : PERFORM INDUSTRY CALCULATIONS\n\nUNIT CODE\n\n: MEE721203\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to perform\n basic calculations using the four fundamental\n operation.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform four\nfundamental operations.\n1.1\n\nSimple calculations involving whole numbers,\nmixed numbers, fraction and decimal are\nperformed using four fundamental operations.\n2.\nPerform conversion of\nunits\n2.1\n\n2.2\n\nUnits are converted to the required figure using\nthe given formulae\nEnglish measurements are converted to metric\nmeasurements according to procedure.\n3.\nPerform calculations on\nalgebraic expressions\n3.1\n\n3.2\n\n3.3\n\n3.4\nSimple calculations are performed on algebraic\nexpressions using four fundamental operations.\nSimple transposition of formulae are carried out to\nisolate the variable required, involving the four\nfundamental operations.\nWhere appropriate, formulae are constructed to\nenable problems to be solved.\nEquations involving on unknown solved correctly.\n4.\nCompute percentage\nand ratio\n4.1\nPercentages are computed using appropriate\nformula.\nRatio and proportion are computed using\nappropriate formula.\n\n--- PDF PAGE 25 ---\nWeldncii11-3\n01/04/05\n\n23\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Four fundamental\n operations\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n2. Units\n2.1 Fractions\n2.2 Mixed numbers\n2.3 decimal\n\n--- PDF PAGE 26 ---\nWeldncii11-3\n01/04/05\n\n24\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1 using four fundamental operations\n1.2 involving fractions and mixed numbers\n1.3 involving fractions and decimals\n1.4 on algebraic expressions\n1.5 involving ratio and proportion\n2.\nUnderpinning\nknowledge and\nattitude\n\n2.1 English and metric system of measurements\n2.2 Four fundamental operations\n2.3 Method of transposing formulae\n2.4 Equation formulation\n3.\nUnderpinning\nskills\n3.1 Performing calculations using pen and paper or with the use\nof calculator\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools and facilities appropriate to processes or activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 27 ---\nWeldncii11-3\n01/04/05\n\n25\nUNIT OF COMPETENCY : CONTRIBUTE TO QUALITY SYSTEM\n\nUNIT CODE\n\n: MEE721204\n\nUNIT DESCRIPTOR\n\n: This unit involves competence required to inspect work\n against specification and standards and apply quality\n standards to work.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nInspect work done\n1.1\n\n1.2\n\n1.3\nAppropriate inspections are conducted to ensure\ncompany quality systems and procedures are\nmaintained/ followed.\nJob specifications/work order and quality\nstandards are identified.\nFaults/Defects are identified and rectified\naccording to company procedures.\n2.\nApply quality standards\nto work\n2.1\n\n2.2\n\n2.3\n\n2.4\nInspections are conducted throughout the\nmanufacturing processes to ensure quality\nstandards are maintained.\nAppropriate quality standards are applied\nthroughout the production/fabrication process.\nAll activities are coordinated throughout the\nworkplace to ensure efficient quality work\noutcomes.\nRecords of work quality are maintained according\nto the company requirements.\n3\nProtect company\nproperty and customer\ninterests\n3.1\n\n3.2\nPossible damage to company property is\navoided by adherence to company quality\nprocedures.\nQuality of work is reviewed to ensure customer\nrequirements and company standards are met.\n\n--- PDF PAGE 28 ---\nWeldncii11-3\n01/04/05\n\n26\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Quality system and\n procedures\nQuality system and procedures may be contained in:\n1.1 work instructions\n1.2 safe work procedures\n1.3 product specifications\n1.4 equipment maintenance schedules\n1.5 technical procedures adopted or specifically\nprepared standards\n1.6 company/industry rules\n\n2. Company property\nCompany properties includes :\n2.1 production and/or fabrication equipment\n2.2 hand and power tools\n2.3 OH&S paraphernalia\n2.4 facilities\n\n--- PDF PAGE 29 ---\nWeldncii11-3\n01/04/05\n\n27\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 inspected work done against specification\n1.2 applied quality standards to work\n1.3 protected company property and customer interests\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Communication/feedback methods-written and verbal\n2.2 Company systems, processes and work quality\n requirements\n2.3 Work inspection techniques\n2.4 Quality assurance principles\n2.5 Safety precautionary measures\n2.6 Handling materials, tools and equipment\n3.\nUnderpinning\nskills\n3.1 Problem solving skills\n3.2 Communicating with superiors and co-workers\n3.3 Interpreting job specification and work order\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\n activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 30 ---\nWeldncii11-3\n01/04/05\n\n28\nUNIT OF COMPETENCY : USE HAND TOOLS\n\nUNIT CODE\n\n: MEE721205\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to use hand\n tools.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect hand tools\n1.1\n\n1.2\n\nHand tools selected are appropriate to the\nrequirements of the task.\nUnsafe or defective tools are identified and\nmarked for repair according to procedure.\n2.\nUse hand tools\n2.1\n\n2.2\n\nHand tools are used to produce the desired\noutcomes to job specifications.\nTask performed in accordance with company or\nindustry safety procedure.\n3.\nMaintain hand tools\n3.1\n\n3.2\n\nRoutine maintenance of hand tools is\nundertaken according to standard operating\nprocedures, principles and techniques.\nHand tools are stored in designated location in\naccordance with manufacturer’s\ninstruction/standard operating procedure.\n\n--- PDF PAGE 31 ---\nWeldncii11-3\n01/04/05\n\n29\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hand tools\nHand tools includes but not limited to:\n1.1 Hacksaws\n1.2 Hammers (ball peen, chipping)\n1.3 Punches\n1.4 Screwdrivers\n1.5 Wrenches\n1.6 Scrapers\n1.7 Chisels\n1.8 Gouges\n1.9 Files\n1.10 Clamps\n2. Task\nTasks may include:\n2.1 Adjusting\n2.2 Dismantling\n2.3 Assembling\n2.4 Finishing of item or components\n3. Routine maintenance\nRoutine maintenance may include:\n3.1 Cleaning\n3.2 Lubricating\n3.3 Tightening\n3.4 Simple tool repair\n3.5 Hand sharpening\n\n--- PDF PAGE 32 ---\nWeldncii11-3\n01/04/05\n\n30\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used hand tools appropriate to the job\n1.2 Performed routine maintenance and storage of hand tools\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Types and uses of hand tools\n2.2 Hand tool defects\n2.3 Procedure, principles and techniques in maintenance of\n hand tools\n\n3.\nUnderpinning\nskills\n3.1 Handling tools and materials\n3.2 Communicating with superiors and co-workers\n3.3 Interpreting instructions\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to the process\n or activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 33 ---\nWeldncii11-3\n01/04/05\n\n31\nUNIT TITLE\n: PREPARE WELD MATERIALS\n\nUNIT CODE\n: MEE721206\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n preparing welding materials.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the range of Variables\n1. Set up cutting\nequipment\n1.1 Cutting equipment should be operational and should\n conform to acceptable OH&S standards\n1.2 Set up cutting equipment is appropriate for operation\n intended\n2. Cut and prepare edge\nof materials\n2.1 Materials are cut based on specified\n dimension/specifications.\n2.2 Task is performed in accordance with company or\nindustry requirements and safety procedure.\n\n3. Clean surfaces and\nedges\n3.1 Surfaces are cleaned to required specifications.\n3.2 Task is performed in accordance with company or\nindustry requirements and safety procedure\n4. Prepare welding\nconsumables\n4.1 Consumables are prepared in accordance with\n required specifications\n4.2 Welding consumables are prepared in accordance with\nmanufacturer’s instructions\n5. Prepare welding\nsafety and protective\nequipment\n5.1 PPE should conform to acceptable OH&S\n requirement and standards\n\n--- PDF PAGE 34 ---\nWeldncii11-3\n01/04/05\n\n32\n\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Materials and\nconsumables\n\n1.1 Mild steel\n1.2 Carbon steel\n1.3 Alloy steel (level III & IV)\n1.4 Cutting gases\n1.5 Gouging electrodes\n1.6 Grinding/cutting discs\n1.7 Run on/run off, backing plates/ring\n1.8 Cutting accessories\n2. Cut\nCut material using\n2.1 Oxy-acetylene gas cutting equipment (manual and /or\n automatic)\n2.2 Plasma cutting equipment\n2.3 Shearing machine\n2.4 Disc cutter\n3. Specification\nSpecifications based on\n3.1 Welding codes\n3.2 Reference Industry standards\n3.3 Client specification\n4. Cleaned\nSurfaces and edges are cleaned by\n4.1 Grinding or sanding\n4.2 Filing\n4.3 Chemical washing (Degreaser)\n5. Safety procedures\n5.1 Wearing of required PPE\n5.2 Securing oxy-acetylene tanks before, during and after\nuse\n5.3 Checking oxy-acetylene hose for gas leaks\n5.4 Switch off equipment after use\n5.5 Checking electrical equipment and devices\n\n--- PDF PAGE 35 ---\nWeldncii11-3\n01/04/05\n\n33\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Perform edge preparation in accordance with\n WPS and safety procedures\n1.2 Use edge preparation equipment and tools in\n accordance with the requirements or\n manufacturer’s instructions\n2. Underpinning knowledge\n2.1 Interpretation of plans and drawings\n2.2 Selection of appropriate method of edge\n preparation\n2.3 Selection of appropriate cutting equipment,\n accessories and supplies\n2.4 Operation of cutting equipment such as\n mechanical, gas and plasma\n2.5 Operation of grinding equipment\n2.6 Safety procedures for cutting and grinding\n3. Underpinning skills\n3.1 Measuring and communication skills\n3.2 Set up of cutting equipment such as mechanical,\n gas and plasma\n3.3 Cutting techniques\n3.4 Grinding techniques\n3.5 Observance of safety procedures\n4. Resource implications\nThe following resources must be provided:\n4.1 Relevant documentation such as WPS and\n working drawing\n4.2 Supplies and materials\n4.3 Cutting equipment and facilities\n4.4 Grinding equipment and facilities\n4.5 Measuring tools\n4.6 PPE\n4.7 Stand-by fire fighting equipment\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n5.3 Inspection of prepared edges\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 36 ---\nWeldncii11-3\n01/04/05\n\n34\nUNIT TITLE\n:\nSET UP WELDING EQUIPMENT\n\nUNIT CODE\n:\nMEE721207\n\nDESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes in\npreparing equipment for welding.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.1 Set up welding\nmachine\n\n1.1 Requirements for welding is determined from job\nrequirements, welding procedures and specifications\nand/or technical drawings.\n1.2 Welding machine is set up in accordance with job\nrequirements, welding procedures and specifications,\ntechnical drawings and manufacturer’s instructions.\n1.3 Welding machine should be connected to an\n independent power supply and wired up or set to the\npolarity indicated in the welding procedures\n/specifications or as recommended by the\nmanufacturer.\n1.4 Current, voltage, and filler rod settings is fine-tuned or\nadjusted consistent with job requirements to produce\nacceptable weld.\n1.5 Task is completed without causing damage to the tools,\nequipment and materials and injury to self and others.\n2. Set up welding\naccessories\n2.1 Welding machine accessories and consumables are\nidentified from job requirements, welding procedures\nand specifications.\n2.1 Welding machine accessories and consumables are set\nup in accordance with job requirements, welding\nprocedures and specifications and/or manufacturer’s\ninstructions.\n2.2 Purging hoses, damps, flow meter, regulators, torches\nand guns are properly installed where needed.\n2.3 Gas tanks properly secured where needed.\n2.4 Tungsten electrodes properly ground where needed.\n3. Set up welding\npositioners, jigs and\nfixtures\n3.1 Braces, stiffeners, rails and other jigs are provided and\nin conformity with job requirements.\n3.2 Work items/materials are protected from strong winds,\ndrafts and rainfall\n4. Set up pre-heating\ntools/equipment as\nrequired\n4.1 Pre-heating equipment appropriate to the job\nrequirement and specifications\n4.2 Equipment operated in conformance with the\nmanufacturer’s instructions.\n\n--- PDF PAGE 37 ---\nWeldncii11-3\n01/04/05\n\n35\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Welding machine\n\nTypes, kind and uses of GTAW welding machines\n1.1 Alternating current (AC)\n1.2 Direct current (DC)\n1.3 Constant current\n1.4 Constant voltage\n2. Polarity\nApplication and uses\n2.1 Direct current – electrode positive (reverse polarity)\n2.2 Direct current – electrode negative (straight polarity)\n2.3 Alternating current\n3. Accessories\n3.1 tig torches short and long back caps\n3.2 regulators and flow meters\n3.3 gas hoses and adaptors\n3.4 gas cylinders\n3.5 ceramic caps\n3.6 collet and collet bodies\n4. Gases\n4.1 Pure inert gas (argon, etc.)\n\n--- PDF PAGE 38 ---\nWeldncii11-3\n01/04/05\n\n36\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Set up and install welding machine,\n accessories,\nwelding positioners, jigs and fixtures and pre-\n heating equipment within allotted time and in\n accordance with OH&S rules and accessible\n and convenient location.\n1.2 Applied housekeeping and 5S practices\n2. Underpinning knowledge\n2.1 Types and uses of welding equipment and\naccessories\n2.2 Power requirement and capacity of welding\n machine and its accessories\n2.3 Operating capacity of welding machine and\n accessories\n2.4 Basic electricity\n2.5 Shop safety, housekeeping and 5S procedures\n3. Underpinning skills\n3.1 Setting and operating welding machine and\n accessories\n3.2 Communication skills\n3.3 Recognizing operational abnormalities and\n faults in welding machine and accessories\n3.4 Fine tuning of welding machine and accessories\n for optimum operation\n3.5 Minor repairs/maintenance of welding machine\n and accessories\n3.6 Use of PPE\n4. Resource implications\nThe following resources must be provided:\n4.1 Appropriately ventilated work area/shop with\nwelding facilities, machines and accessories\n4.2 PPE\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 39 ---\nWeldncii11-3\n01/04/05\n\n37\nUNIT TITLE\n: FIT UP WELD MATERIALS\n\nUNIT CODE\n: MEE721208\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in fitting\n up welding materials.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform tack welding\n\n1.1 Tack welding is performed in accordance with the\nrequirements of WPS and client’s specifications.\n1.2 Tack welding is performed visually and dimensionally\nacceptable.\n1.3 Backing plate, stiffener, running plate installed as\nrequired.\n1.4 Joints are free from rust, paints, grease and other\n foreign materials prior to fit up or tacking.\n2. Check gap and\n alignment\n2.1 Root gap is performed in accordance with the\nrequirements of WPS.\n2.2 Alignment within the range of acceptability of code and\nstandard.\n2.3 Fitted materials visually free from stresses\n3. Set up welding\n positioner\n3.1 Weld specimen positioned and secured according to the\nrequirements.\n\n--- PDF PAGE 40 ---\nWeldncii11-3\n01/04/05\n\n38\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Tack welding\n\nKinds of tacking\n1.1 Bridge tacking\n1.2 Permanent tacking\n1.3 Temporary tacking\n2. Visually and\n dimensionally\n acceptable\n2.1 Acceptable tack welds\n2.2 Fully fused to the base metal\n2.3 Free from defects and discontinuities\n2.4 Evenly distributed\n3. Root gap\n3.1 WPS requirements\n3.2 Client requirements\n4. Backing materials\n4.1 Stiffeners\n4.2 Backing plate\n4.3 Strong back\n5. Alignment\n5.1 Codes and specifications\n5.2 Client requirements\n\n--- PDF PAGE 41 ---\nWeldncii11-3\n01/04/05\n\n39\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 performed tack welding\n1.2 checked gap and alignment\n1.3 set up welding positioners\n2. Underpinning knowledge\n2.1 Fit up tolerances\n2.2 Mensuration\n2.3 WPS\n2.4 Welding materials and consumables\n2.5 Drawing and plan interpretation\n2.6 Welding codes (symbols)\n2.7 Identification of weld defects\n2.8 Fit up\n3. Underpinning skills\n3.1 Applying weld techniques\n3.2 Handling welding materials and consumables\n3.3 Rectifying weld defects\n3.4 Measuring skills\n3.5 Communication skills\n3.6 Pre-heating technique\n3.7 Observance of safety procedures\n4. Resource implications\nThe following resources must be provided:\n4.1 Drawing and plans\n4.2 Appropriately ventilated work area/shop with\nwelding facilities, machines and accessories\n4.3 PPE\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation/evaluation\n5.2 Oral questioning\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 42 ---\nWeldncii11-3\n01/04/05\n\n40\nUNIT TITLE\n: REPAIR WELDS\n\nUNIT CODE\n: MEE721209\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n repairing welds.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Mark/locate weld\ndefects\n1.1 Identified weld defects marked/located according to\n recommended practice\n1.2 Weld defects are located and marked according to\n procedures\n3. Prepare tools and\n equipment\n2.1 Tools and equipment are prepared based on job\nrequirements and provision of wind barriers.\n2.2 Task is performed in accordance with company or\nindustry requirements and safety procedure\n\n3. Remove defects\n3.1 Weld defects are removed/excavated in accordance with\n approved industry procedures or client requirements.\n3.2 Removal of non-defective welds is minimized and\n cleaned.\n3.3 Visual and dye-penetrant test is performed to verify the\nextent of removal of defects, where applicable\n3.4 Welding inspector is informed to verify the extent of\ndefect removal.\n3.5 Task is performed in accordance with company or\nindustry requirement and safety procedure\n\n4. Perform re-welding\n4.1 Re-welding is performed in accordance with approved\n repair procedure.\n4.2 Task is performed in accordance with company or\n industry requirement and safety procedure\n4.3 Re-welding is performed with no new weld\n defects or damages occurred\n4.4 Weld visually checked after re-welding for acceptability\n\n--- PDF PAGE 43 ---\nWeldncii11-3\n01/04/05\n\n41\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Weld defects\n1.1 Porosity\n1.2 Root undercut\n1.3 and solid material inclusion\n1.4 Concavity/convexity\n1.5 Degree of reinforcement\n1.6 Burn Through\n1.7 Crater cracks\n1.8 Cracks\n1.9 Lack of Fusion (tie-in)\n1.10 Pinholes/Blowholes\n1.11 Under Fill\n1.12 Excess/incomplete penetration\n1.13 Slag/tungsten inclusion\n1.14 Overlap\n1.15 Misalignment\n1.16 Distortion\n2. Tools and equipment\n2.1 Welding machine and accessories\n2.2 Gouging outfit and accessories\n2.3 Portable grinder\n2.4 Chipping hammer\n2.5 Files\n2.6 Extension cord and lightings\n2.7 Barriers\n2.8 Dye-penetrant kit\n2.9 Portable oven\n3. Removed/excavated\nDefects removed by\n3.1 Grinding\n3.2 Arc/air Gouging\n3.3 Cutting (mechanical, gas)\n3.4 Plasma gouging\n\n--- PDF PAGE 44 ---\nWeldncii11-3\n01/04/05\n\n42\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\nrepaired weld defects within the approved weld\nrepair procedures\n2. Underpinning knowledge\n2.1 Interpretation of weld repair procedures and\n WPS\n2.2 Causes and identification of weld defects\n2.3 Materials and consumables\n2.4 Welding Equipment and Tools\n2.5 Welding Codes (symbols)\n2.6 Repair techniques\n2.7 Selection and use of PPE\n3. Underpinning skills\n3.1 Operating weld defect removal tools and\n equipment\n3.2 Applying correct weld techniques\n3.3 Measuring skills\n3.4 Communication skills\n3.5 Rectifying weld defects\n3.6 Handling welding tools and equipment\n3.7 Handling materials and consumables\n3.8 Identifying weld defects\n4. Resource implications\nThe following resources must be provided:\n4.1 Weld defect removal and repair facilities and\n equipment\n4.2 Supplies and materials\n4.3 PPE\n4.4 Relevant documentation such as WPS and\n approved repair procedure\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Observation and interview\n5.2 Performance record\n6. Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 45 ---\nWeldncii11-3\n01/04/05\n\n43\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nWeld Carbon Steel Plates Using GTAW\n\nUNIT CODE:\nMEE721311\n\nDESCRIPTOR:\nThis unit covers the skills, knowledge and attitudes\nrequired in welding carbon steel plates 1F-4F and 1G-4G\npositions using GTAW process.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform root pass\n1.1 Root pass is performed in accordance with WPS\nand/or client specifications.\n1.2 Task is performed in accordance with company or\nindustry requirement and safety procedure.\n1.3 Weld is visually checked for defects and repaired, as\n required\n1.4 Weld is visually acceptable in accordance with\napplicable codes and standards\n2. Clean root pass\n2.1 Root pass is cleaned and free from defects and\ndiscontinuities\n2.2 Task is performed in accordance with approved WPS\n3. Weld subsequent/\nfilling passes\n\n3.1 Subsequent/ filling passes is performed in\naccordance with approved WPS\n3.2 Weld is visually checked for defects and repaired, as\n required\n3.3 Weld is visually acceptable in accordance with\napplicable codes and standards\n4. Perform capping\n4.1 Capping is performed in accordance with WPS and/or\n client specifications\n4.2 Weld is visually checked for defects and repaired, as\n required\n4.3 Weld is visually acceptable in accordance with\napplicable codes and standards\n\n--- PDF PAGE 46 ---\nWeldncii11-3\n01/04/05\n\n44\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. WPS\nWPS Requirements\n1.1 Welding positions\n1.1.1 1F – 4F\n1.1.2 1G – 4G\n1.2 Wall thickness\n 1.2.1 1.6 mm and above\n1.3 Type of material\n 1.3.1 Carbon or mild steel\n1.4 Consumables\n1.4.1 Filler metal\n1.4.2 Tungsten rod (type and size)\n1.4.3 Shielding gas (argon or other available\ninert gas)\n1.5 Travel speed\n1.6 Current setting (polarity, amperage, voltage)\n1.7 Shielding gas flow rate\n1.8 Welding accessories\n1.9 Joint preparation\n2. Defects\n2.1 Porosity\n2.2 Undercut\n2.3 Arc Strike\n2.4 Elongated intrusion\n2.5 Tungsten inclusion\n2.6 Concavity/convexity\n2.7 Degree of reinforcement\n2.8 Burn Through\n2.9 Crater cracks\n2.10 Cracks\n2.11 Lack of Fusion\n2.12 Pinholes/Blowholes\n2.13 Under Fill\n2.14 Overlap\n2.15 Misalignment\n2.16 Distortion\n\n--- PDF PAGE 47 ---\nWeldncii11-3\n01/04/05\n\n45\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the\ncandidate welded carbon steel plates using\nGTAW in 2G and 3G positions to acceptable\nstandards following the approved WPS.\n2. Underpinning Knowledge\n2.1 Drawing/Plan/WPS interpretation\n2.2 Materials and consumables (filler rod,\ntungsten rod, shielding gas, base metal)\n2.3 Welding Equipment and Tools\n2.4 Basic Mathematics (Multiplication, Division,\nAddition and Subtraction)\n2.5 Welding Codes\n2.6 Identification of weld defects\n3. Underpinning Skills\n3.1 Measuring skills\n3.2 Communication skills\n3.3 Rectifying weld defects\n3.4 Applying welding techniques for GTAW\n3.5 Handling welding tools and equipment\n3.6 Handling materials and consumables and\n checking purity of inert gas\n4. Resource Implications\nThe following resources must be provided:\n4.1 GTAW facilities and equipment\n4.2 Supplies and materials\n4.3 PPE\n4.4 Relevant documentation such as WPS and\n working drawing\n4.5 Stand-by fire-fighting equipment\n5. Method of Assessment\nCompetency must be assessed through:\n5.1 Observation and interview\n5.2 Demonstration and interview\n5.3 Written test\n5.4 Portfolio\n6. Context of Assessment\nCompetency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 48 ---\nWeldncii11-3\n01/04/05\n\n46\nUNIT OF COMPETENCY:\nWeld Carbon Steel Pipes using GTAW\n\nUNIT CODE:\nMEE721312\n\nDESCRIPTOR:\nThis unit covers the skills, knowledge and attitudes\nrequired in welding carbon steel pipes in 2G and 5G and/or\n6G positions using GTAW process.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform root pass\n1.1 Root pass is performed in accordance with WPS\nand/or client specifications.\n1.2 Task is performed in accordance with company or\nindustry requirement and safety procedure.\n1.3 Weld is visually checked for defects and repaired, as\n required\n1.4 Weld is visually acceptable in accordance with\napplicable codes and standards\n2. Clean root pass\n2.1 Root pass is cleaned and free from defects and\ndiscontinuities\n2.2 Task is performed in accordance with approved\nWPS\n3. Weld subsequent/\nfilling passes\n\n3.1 Subsequent/ filling passes performed in accordance\nwith approved WPS\n3.2 Weld visually checked for defects and repaired, as\n required\n3.3 Weld visually acceptable in accordance with\napplicable codes and standards\n4. Perform capping\n4.1 Capping performed in accordance with WPS and/or\n client specifications\n4.2 Weld visually checked for defects and repaired, as\n required\n4.3 Weld visually acceptable in accordance with\napplicable codes standards\n\n--- PDF PAGE 49 ---\nWeldncii11-3\n01/04/05\n\n47\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. WPS\nWPS Requirements\n1.1 Welding positions\n1.1.1 2G and 5G,and/or 6G\n1.2 Pipe wall thickness\n1.2.1 1.6mm and above\n1.3 Type of material\n 1.3.1 Carbon or mild steel\n1.4 Consumables\n 1.4.1 Filler wire (diameter)\n 1.4.2 Tungsten rod (type and design)\n 1.4.3 Shielding gas (argon and other available\ninert gas)\n1.5 Travel speed\n1.6 Current setting (polarity, amperage, voltage)\n1.7 Shielding gas flow rate\n1.8 Welding accessories\n1.9 Joint preparation\n2. Defects\n2.1 Porosity\n2.2 Undercut\n2.3 Arc Strike\n2.4 Elongated intrusion\n2.5 Tungsten inclusion\n2.6 Concavity/convexity\n2.7 Degree of reinforcement\n2.8 Burn through\n2.9 Crater cracks\n2.10 Cracks\n2.11 Lack of Fusion\n2.12 Pinholes/Blowholes\n2.13 Under fill\n2.14 Overlap\n2.15 Misalignment\n2.16 Distortion\n\n--- PDF PAGE 50 ---\nWeldncii11-3\n01/04/05\n\n48\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the\ncandidate welded carbon steel pipes using\nGTAW in 2G and 5G and/or 6G positions to\nacceptable standards following approved WPS.\n2. Underpinning Knowledge\n2.1 Drawing/Plan/WPS interpretation\n2.2 Materials and consumables (filler rod,\ntungsten rod, shielding gas, base metal)\n2.3 Welding Equipment and Tools\n2.4 Basic Mathematics (Multiplication, Division,\nAddition and Subtraction)\n2.5 Welding Codes\n2.6 Identification of weld defects\n3. Underpinning Skills\n3.1 Measuring skills\n3.2 Communication skills\n3.3 Rectifying weld defects\n3.4 Applying welding techniques for GTAW\n3.5 Handling welding tools and equipment\n3.6 Handling materials and consumables and\n checking purity of inert gas\n4. Resource Implications\nThe following resources must be provided:\n4.1 GTAW facilities and equipment\n4.2 Supplies and materials\n4.3 PPE\n4.4 Relevant documentation such as WPS and\n working drawing\n4.5 Stand-by fire fighting equipment\n5. Method of Assessment\nCompetency must be assessed through:\n5.1 Observation and interview\n5.2 Demonstration and interview\n5.3 Written test\n5.4 Portfolio\n6. Context of Assessment\nCompetency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 51 ---\nWeldncii11-3\n01/04/05\n\n49"
