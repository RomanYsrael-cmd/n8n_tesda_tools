        "source_text": "--- PDF PAGE 31 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n29\nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY     :\nPERFORM SITE ASSESSMENT\n \n \nUNIT CODE                          :   \n \nUNIT DESCRIPTOR             : \n CON724325 \n \nThis unit deals with the knowledge, skills and attitudes in \nperforming site assessment.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1.  Validate \nparameters for the\ninstallation  \n \n \n1.1 Ocular survey of location/area is performed in accordance \nwith design considerations and validated with the use of \nprescribed instruments \n1.2 Installation parameters of the system design are validated \nagainst existing site conditions \n1.3 Variances in the parameters of components, if any, are \nidentified and noted in the installation checklist form\n \n2.  Prepare \ninstallation data \nsheet \n \n2.1 Installation layout is prepared following existing safety \nstandards, accepted best practices, and user preferences \n2.2 Components lay out is prepared according to the installation \ndata sheet  \n2.3 Final layout takes into account validated parameters \n2.4 Logistical considerations are taken into account and noted \nin the report.\n\n--- PDF PAGE 32 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n30\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Location/Area \n \n1.1 Roof \n1.2 Ground area \n1.3 Ceiling \n1.4 Wall \n1.5 Ventilated area \n1.6 Not-ventilated area \n1.7 House area in square meters \n1.8 Mode of Transportation/hauling \n1.9 Degree of ease/difficulty of access to site \n1.10Weather data\n2.  Prescribed \ninstruments \n2.1 Magnetic Compass \n2.2 Measuring Tapes \n2.3 Altimeter \n2.4 GPS \n2.5 Transit \n2.6 Video \n2.7 Push/pull rule tape \n2.8 Camera\n3.  Installation \nparameters \n3.1 Work area \n3.2 Shading \n3.3 Structure characteristics \n3.4 Soil type/condition \n3.5 Flow rate of water source \n4.  Components \n \n4.1 PV Module/array \n4.2 Support structures \n4.3 Charge Controller/regulator \n4.4 Battery/battery bank \n4.5 Inverter/converter \n4.6 Lighting fixtures and accessories \n4.7 Convenience outlets for appliances and devices \n4.8 Wires and cables \n4.9 Fastening fixtures\n5.  Logistical \nConsiderations \n5.1 Transport/hauling \n5.2 Storage of materials/supplies \n5.3 Security Condition \n5.4 Work schedules \n5.5 Access Road \n5.6 Insurance requirement \n5.7 Board and lodging \n5.8 Food/drinking water \n5.9 Travel expenses \n5.10 Weather/climate \n5.11 Contingency fund \n5.12 Porters\n\n--- PDF PAGE 33 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n31\nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate \n1.1 Performed site assessment \n1.2 Validated installation design parameters \n1.3 Determined locations of all components \n1.4 Validated parameters for the installations \n1.5 Prepared installation data sheet\n2.  Underpinning \nknowledge and \nattitudes \n \n \n2.1 PV technology and systems \n2.2 Principles of electricity \n2.3 Electrical load characteristics \n2.4 Safety working habits \n2.5 Basic mathematical operations \n2.6 System components characteristics \n2.7 Instruments used in site assessment \n2.8 Enterprise goals, targets, and measures \n2.9 Environmental requirements \n2.10 Principles of decision making strategies and techniques  \n2.11 Observant/attentive to details \n2.12 Honest \n2.13 Courteous\n3.  Underpinning  \nskills \n3.1 Interpretations of installation electrical drawing \n3.2 Preparing materials & instruments \n3.3 Surveying skills and experience \n3.4 Communication skills \n3.5 Interpersonal Skills \n3.6 Instrument surveying skills \n3.7 Drawing specification skills \n3.8 Mapping skills \n3.9 Using range of formal problem solving technique \n3.10 Solution evaluation skills\n4.  Resource \nimplications \nThe following resources must be provided: \n4.1 Drawings/Specifications relevant to task \n4.2 Site/location map \n4.3 Materials/instruments relevant to site assessment \n4.4 Forms\n5.  Method of \nassessment \nCompetency must be assessed through: \n5.1 Demonstration and observation with question \n5.2 Oral/written examination \n5.3 Portfolio \n5.4 Third party report\n6.  Context of \nassessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace \n6.2 Competency assessment must be undertaken in accordance \nwith the endorsed TESDA assessment guidelines\n",
