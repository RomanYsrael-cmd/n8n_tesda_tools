        "evidence_guide": {
          "source_text": "1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in\naccordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n2. Underpinning\nknowledge and\nattitude\n\n2.1 TRADE MATHEMATICS / MENSURATION\n• Four fundamental operation\n• Linear measurement\n• Dimensions\n• Unit conversion\n• Ratio and proportion\n• Trigonometric functions\n• Algebraic equations\n3. Underpinning\nskills\n3.1 Performing calculation by addition, subtraction, multiplication\nand division; trigonometric functions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of plane\nand geometric figures\n3.4 Proper handling of measuring instruments\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n5. Method of\nassessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to underpinning knowledge\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being undertaken\nwhether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the TESDA assessment guidelines\n\n--- PDF PAGE 28 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n26\n\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\nUNIT CODE :"
        },
        "source_text": "CON311203\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n\n1. Select measuring instruments\n\n1.1 Object or component to be measured is\nidentified, classified and interpreted according to\nthe appropriate regular geometric shape\n1.2 Measuring tools are selected/identified as per\nobject to be measured or job requirements\n1.3 Correct specifications are obtained from relevant\nsources\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.5 Alternative measuring tools are used without\nsacrificing cost and quality of work\n2. Carry out measurements and\ncalculations\n\n2.1 Accurate measurements are obtained\naccording to job requirements\n2.3 Alternative measuring tools are used\n without sacrificing cost and quality of work\n2.4 Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x)\nand division (/) including but not limited to:\ntrigonometric functions, algebraic computations\n2.5 Calculations involving fractions, percentages\nand mixed numbers are used to complete\nworkplace tasks\n2.6 Numerical computation is self-checked and\ncorrected for accuracy\n2.7 Instruments are read to the limit of accuracy of\nthe tool\n2.8 Systems of measurement identified and\nconverted according to job requirements/ISO\n2.9 Workpieces are measured according to job\nrequirements\n\n--- PDF PAGE 26 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n24\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Geometric shape\n\n Including but is not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6\nConical\n2. Measuring instruments\nIncluding but not limited to:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega-ohmeter\n2.16 Kilowatt hour meter\n2.17 Gauges\n2.18 Thermometers\n2. Measurements and\ncalculations\n\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Resistance\n3.7 Amperage\n3.8 Frequency\n3.9\nImpedance\n\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.13 Inside diameter\n3.14 Circumference\n3.15 Length\n3.16 Thickness\n3.17 Outside diameter\n3.18 Taper\n3.19 Out of roundness\n3.20 Oil clearance\n3.21 End play/Thrust clearance\n\n--- PDF PAGE 27 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n25\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in\naccordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n2. Underpinning\nknowledge and\nattitude\n\n2.1 TRADE MATHEMATICS / MENSURATION\n• Four fundamental operation\n• Linear measurement\n• Dimensions\n• Unit conversion\n• Ratio and proportion\n• Trigonometric functions\n• Algebraic equations\n3. Underpinning\nskills\n3.1 Performing calculation by addition, subtraction, multiplication\nand division; trigonometric functions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of plane\nand geometric figures\n3.4 Proper handling of measuring instruments\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n5. Method of\nassessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to underpinning knowledge\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being undertaken\nwhether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the TESDA assessment guidelines\n\n--- PDF PAGE 28 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n26\n\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\nUNIT CODE :"
