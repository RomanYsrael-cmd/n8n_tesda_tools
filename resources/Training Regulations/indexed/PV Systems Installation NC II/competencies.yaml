          "source_text": "1.  Prepare to \ncommission PV \nsystem \n \n \n1.1 Work instructions are validated to ensure clear understanding \nof job requirements \n1.2 Commissioning procedures are planned according to \nmanufacturer’s instructions and job order requirements \n1.3 Personal protective equipment (PPE) needed to complete \njob order requirements are obtained according to established \nprocedures \n1.4 Tools, measuring instruments and materials needed for \ncommissioning are obtained according to established \nprocedures\n2. Commission PV \nsystem \n \n \n2.1 Each  component and the whole system are checked if \noperational and are installed according to established \nprocedures and job order requirements \n2.2 Corrective measures or rectifications on the installation are \nmade in line with established procedures \n2.3 PV systems is activated according to commissioning \nprocedures \n2.4 Occupational health and safety procedures are followed \nduring commissioning \n3.  Inspect and notify \ncompletion  of work \n3.1 Final inspection is undertaken to ensure that  commissioning \nof PV system meets job requirements \n3.2 Commissioning document is accomplished and written \nreport is prepared using the prescribed format and submitted \nto the supervisor \n3.3 Work completed is notified to a supervisor and customer \naccording to established procedure \n3.4 Proper housekeeping is observed and practiced in \naccordance with occupational health and safety standards \n3.5 Customer is oriented on the use of the installed system \naccording to company procedures and manufacturer’s \ninstruction.\n\n--- PDF PAGE 45 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n43\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Commissioning \nprocedures  \n \n \n \n1.1 PV module/array functional test \n1.2 Charge controller/Regulator functional test \n1.3 Battery functional test \n1.4 Load Test \n1.5 High potential test \n2. Personal protective \nequipment (PPE) \n \n2.1 Mask \n2.2 Safety goggles or face shield \n2.3 Gloves (rubber/leather) \n2.4 Safety harness \n2.5 First aid kit \n2.6 Hard hat \n2.7 Safety shoes \n2.8 Leather apron \n2.9 Safety belts \n2.10 Electrician holster kit \n2.11 Safety clothes/pants \n2.12\nInsulating mat\n3. Tools, measuring \ninstruments, and \nmaterials \n \n \n \n3.1 Tools \n    3.1.1 Screwdrivers \n    3.1.2 Pliers \n    3.1.3 Wrenches \n    3.1.4 Ladder/scaffolding \n    3.1.5 Magnetic compass \n    3.1.6 Spirit level \n3.2 Measuring instrument \n   3.2.1 Clamp meter \n   3.2.2 Multi-meter \n   3.2.3 Hydrometer \n3.3 Materials \n   3.3.1 Wires and cables \n   3.3.2 Connectors \n   3.3.3 Clamps \n   3.3.4 Electrical tape \n   3.3.5 Oil and grease \n   3.3.6 Fuse \n   3.3.7 Diodes \n   3.3.8 Staple wires, screws and nails \n   3.3.9 Asphalt/sealant (if needed) \n   3.3.10 Distilled water \n  3.3.11 Bolts and nuts\n4. Commissioning \ndocuments \n4.1 CD for Solar Home System \n4.2 CD for Battery Charging Station \n4.3 CD for School Electrification\n\n--- PDF PAGE 46 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n44"
