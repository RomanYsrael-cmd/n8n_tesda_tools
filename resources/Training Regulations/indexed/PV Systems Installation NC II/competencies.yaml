        "evidence_guide": {
          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted work instructions\n1.2 Selected tools, materials, and components for PV installation\n1.3 Used personal protective equipment\n1.4 Demonstrated procedures for installation of PV components\n1.5 Followed safety procedures\n1.6 Cleaned worksite/housekeeping\n1.7 Stored excess materials including tools\n1.8 Accessed information relevant in conducting users’ briefing/\norientation regarding the installed system.\n1.9 Correctly followed work instructions\n1.10 Made final checks to ensure work conforms with the installation\ndrawing plan\n1.11 Communicated effectively to ensure safety and effective work\noperations\n2.Underpinning\nknowledge\nand attitude\n2.1 PV system operation\n2.2 PEC requirements\n2.3 Installation procedures for PV components\n2.4 Work ethics\n2.5 Respect for area/site cultural practices\n2.6 Awareness of peace and order situation in the area and site condition\n2.7 Safety practices\n2.7.1 Personal protective equipment (PPE)\n2.7.2 Safe handling of tools\n2.7.3 Safety signs/symbols\n2.7.4 Knowledge of workplace/equipment hazards\n2.7.5 Housekeeping\n2.8 Electrical Installation Drawing and Specification\n2.8.1 Electrical wiring diagram\n2.8.2 Mechanical symbols/abbreviation\n2.9 Trade Theory\n2.9.1 Principles of electricity\n2.9.2 Principles and operation of accessories/parts\n2.9.3 Installation procedure\n2.9.4 Selection of units and components\n2.10 Tools/Materials uses and specification\n2.10.1 Types of electrical controllers\n2.10.2 Types of PV Modules\n2.10.3 Types of loads\n2.10.4 Types of wires\n2.10.5 Types of fuse\n2.10.6 Types of circuit breakers\n2.10.7 Types of water pumps\n2.10.8 Types of hammer\n2.10.9 Types of screwdriver\n2.10.10 Types of soldering irons\n2.10.11 Types of pliers\n2.10.12 Types of wrenches\n2.10.13\nTypes of fastening fixtures\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n41\n3. Underpinning\nskills\n3.1 Reading and interpretation of codes, symbols and diagrams\n3.2 Interpreting plan and details\n3.3 Preparing materials\n3.4 Interpreting product and technical brochures\n3.5 Use of hand tools and equipment\n3.6 Splicing, Dressing and Terminating wires\n3.7 Soldering Techniques\n3.8 Practice safe working habits\n3.9 Performing first aid\n3.10 Tracing circuits\n3.11 Follow simple spoken language\n3.12 Ability to relate to people of social range\n3.13 Interpreting product and technical brochures\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Work area\n4.2 Drawings and specifications relevant to the task\n4.3 Complete system components and accessories\n4.4 Tools and equipment appropriate for installation of PV\ncomponents\n4.3 Personal Protective Equipment (PPE)\n4.4 IEC materials (e.g. flipcharts))\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation with questioning\n5.2 Written/Oral examination\n5.3 Demonstration with questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 44 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n42\nUNIT OF COMPETENCY :\nPERFORM PV SYSTEMS TESTING AND\nCOMMISSIONING\n\nUNIT CODE :"
        },
        "source_text": "CON724327\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in\ninstalling stand alone PV system 1 KW or less.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Plan and\nprepare work\n\n1.1 Electrical drawings are read and interpreted to determine job\norder requirements\n1.2 Type and quantity of system components and other materials\nare identified in line with job order requirements\n1.3 Tools and equipment are selected in line with job order\nrequirements\n1.4 Personal protective equipment (PPE) are identified and\nselected in line with safety requirements\n1.5 Instructions in preparation for work activity are communicated\nclearly and confirmed to ensure that the instructions are\nunderstood.\n1.6 Procedure for planning and preparation of work is checked to\nensure that it is done correctly and in accordance to\nestablished company standards procedure to ensure safety.\n1.7 All components/materials needed to the work are obtained and\nestimated according to established procedures and plans\n\n2. Install PV\ncomponents\n\n2.1 Pre-installation procedures are performed as per\nmanufacturer’s recommendation\n2.2 Procedures for installation of PV components are performed in\nline with job order requirements\n2.3 Schedule of work is followed based on agreed time and quality\nstandards\n2.4 Consultations/ instructions are sought with supervisor/end user\nif unplanned events or conditions occur\n2.5 Ongoing checking of quality of work is undertaken in\naccordance with instructions and requirements\n2.6 Conductors/wires are terminated/splice in accordance with\nexisting PV component standards\n2.7 Installation of PV system is accomplished without causing\ndamage to components, materials, supplies and minimum\nwastage, and injury to self/others.\n2.8 Safety procedures are followed based on regulations\n3. Notify completion\nof work\n3.1 Final checks are made to ensure that work conforms with\nplans/ drawings/instructions and requirements\n3.2 Supervisor is notified upon completion of work\n3.3 Tools, equipment and any excess materials, where\nappropriate, are cleaned, checked and returned to storage in\naccordance with established safety procedures\n3.4Work area is cleaned and made safe\n\n--- PDF PAGE 39 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n37\n\n4. Obtain and\nconvey\ninformation\n4.1 Specific and relevant information about the system installed is\naccessed from appropriate sources\n4.2 Effective questioning and speaking skills are used to gather\nand convey information\n4.3 Appropriate medium is used to transfer information.\n4.4 Conduct of conveying information is carried out clearly and\nconcisely.\n4.5 Conveying information is conducted in a courteous manner\nappropriate to the cultural background of the costumer/s.\n5. Complete\nrelevant work\nrelated\ndocuments\n5.1 Forms relating to the conduct of job are completed accurately\n5.2 Reporting requirements are completed according to the\nguidelines\n\n--- PDF PAGE 40 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. System components\n\n1.1 Solar Module(s)\n1.2 Support structures\n1.3 Charge Controller/regulator\n1.4 Battery/battery bank\n1.5 Inverter\n1.6 Wires and accessories\n1.7 Protective devices such as:\n1.7.1 Disconnect switch\n1.7.2 Fuse\n1.7.3 Breakers\n1.7.4 Diodes\n1.7.5 Low-voltage disconnect\n1.8 DC – DC converters\n1.9 Grounding system\n1.10 Lighting fixtures and accessories\n1.11 Convenience outlets for appliances and devices\n1.12 Loads (AC and DC lights, water pumps, and/or\nappliances)\n\n2. Tools and equipment\n2.1 Tools:\n2.1.1\nScrewdrivers\n2.1.2 Pliers\n2.1.3 Wrenches\n2.1.4 Hammer\n2.1.5 Electrician’s knife\n2.1.6 Hacksaw\n2.1.7 Cross cut saw\n2.1.8 Hand drill\n2.2 Measuring instruments\n2.2.1 Clamp meter\n2.2.2 Ammeter\n2.2.3 Voltmeter\n2.2.4 Multimeter\n2.3 Ladder/scaffolding\n\n3. Personal protective\nequipment (PPE)\n\nMay include but not limited to:\n3.1 Rubber gloves\n3.2 Leather gloves\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Goggles\n3.6 Electrician’s holster\n3.7 Safety belts\n3.8 Safety clothes/pants\n\n4. Regulations\n4.1 Philippine Electrical Code\n4.2 Electrical safety\n4.3 Mechanical safety\n4.4 Civil safety\n\n--- PDF PAGE 41 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n39\n5. Appropriate sources\n5.1 Components Specification and Manual.\n5.2 Suppliers\n5.3 Dealers\n5.4 Trade personnel\n5.5 Industry bodies\n5.6Distributors\n6. Medium\n6.1 Information discussion\n6.2 One on one communication\n6.3 Group interaction\n6.4.Vernacular speaking\n7. Forms\n\n7.1 Customer manual\n7.2 Warranty documents\n7.3 Product procedures\n7.4 Product specifications\n7.5 Product features\n7.6 Product instruction\n\n--- PDF PAGE 42 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n40\nEVIDENCE GUIDE\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted work instructions\n1.2 Selected tools, materials, and components for PV installation\n1.3 Used personal protective equipment\n1.4 Demonstrated procedures for installation of PV components\n1.5 Followed safety procedures\n1.6 Cleaned worksite/housekeeping\n1.7 Stored excess materials including tools\n1.8 Accessed information relevant in conducting users’ briefing/\norientation regarding the installed system.\n1.9 Correctly followed work instructions\n1.10 Made final checks to ensure work conforms with the installation\ndrawing plan\n1.11 Communicated effectively to ensure safety and effective work\noperations\n2.Underpinning\nknowledge\nand attitude\n2.1 PV system operation\n2.2 PEC requirements\n2.3 Installation procedures for PV components\n2.4 Work ethics\n2.5 Respect for area/site cultural practices\n2.6 Awareness of peace and order situation in the area and site condition\n2.7 Safety practices\n2.7.1 Personal protective equipment (PPE)\n2.7.2 Safe handling of tools\n2.7.3 Safety signs/symbols\n2.7.4 Knowledge of workplace/equipment hazards\n2.7.5 Housekeeping\n2.8 Electrical Installation Drawing and Specification\n2.8.1 Electrical wiring diagram\n2.8.2 Mechanical symbols/abbreviation\n2.9 Trade Theory\n2.9.1 Principles of electricity\n2.9.2 Principles and operation of accessories/parts\n2.9.3 Installation procedure\n2.9.4 Selection of units and components\n2.10 Tools/Materials uses and specification\n2.10.1 Types of electrical controllers\n2.10.2 Types of PV Modules\n2.10.3 Types of loads\n2.10.4 Types of wires\n2.10.5 Types of fuse\n2.10.6 Types of circuit breakers\n2.10.7 Types of water pumps\n2.10.8 Types of hammer\n2.10.9 Types of screwdriver\n2.10.10 Types of soldering irons\n2.10.11 Types of pliers\n2.10.12 Types of wrenches\n2.10.13\nTypes of fastening fixtures\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n41\n3. Underpinning\nskills\n3.1 Reading and interpretation of codes, symbols and diagrams\n3.2 Interpreting plan and details\n3.3 Preparing materials\n3.4 Interpreting product and technical brochures\n3.5 Use of hand tools and equipment\n3.6 Splicing, Dressing and Terminating wires\n3.7 Soldering Techniques\n3.8 Practice safe working habits\n3.9 Performing first aid\n3.10 Tracing circuits\n3.11 Follow simple spoken language\n3.12 Ability to relate to people of social range\n3.13 Interpreting product and technical brochures\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Work area\n4.2 Drawings and specifications relevant to the task\n4.3 Complete system components and accessories\n4.4 Tools and equipment appropriate for installation of PV\ncomponents\n4.3 Personal Protective Equipment (PPE)\n4.4 IEC materials (e.g. flipcharts))\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation with questioning\n5.2 Written/Oral examination\n5.3 Demonstration with questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 44 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n42\nUNIT OF COMPETENCY :\nPERFORM PV SYSTEMS TESTING AND\nCOMMISSIONING\n\nUNIT CODE :"
