        "evidence_guide": {
          "source_text": "1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3.\nUnderpinning skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6.\nContext of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE CONSTRUCTION MATERIALS AND TOOLS\nUNIT CODE :",
          "underpinning_skills": [
            "3.1 Practice of personal hygiene 3.2 Hazards/risks identification and control skills 3.3 Interpersonal skills 3.4 Communication skills 4. Resource implications The following resources must be provided: 4.1 Workplace or assessment location 4.2 OHS personal records 4.3 PPE 4.4 Health records 5. Method of assessment Competency may be assessed through: 5.1 Portfolio Assessment 5.2 Interview 5.3 Case Study/Situation 6. Context of assessment 6.1 Competency may be assessed in the work place or in a simulated work place setting",
            "-- PDF PAGE 16 --- ____________________________________________________________________________________________________ TR PV SYSTEMS INSTALLATION NC II 14 COMMON COMPETENCIES",
            "UNIT OF COMPETENCY: PREPARE CONSTRUCTION MATERIALS AND TOOLS UNIT CODE :"
