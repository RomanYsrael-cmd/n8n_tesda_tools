        "source_title": "CHECK PV COMPONENTS/MATERIALS COMPLIANCE",
        "source_text": "--- PDF PAGE 34 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n32\n \nUNIT OF COMPETENCY       : CHECK PV COMPONENTS/MATERIALS \nCOMPLIANCE\n \nUNIT CODE                            :   \n \nCON724326 \nUNIT DESCRIPTOR               :\nThis unit covers the knowledge, skills and attitudes in \nchecking PV components/materials compliance prior to \ninstallation.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  Range of Variables\n \n1.  Identify \ncomponents/ \nmaterials and \nspecifications for \ninspection/ \ntesting \n \n1.1 Components/Materials are listed as per job requirements \n1.2 Component/Material specifications are listed for \ninspection/testing  \n1.3 Components/materials are identified in line with job order \nrequirements \n1.4 Components/materials are inspected for damage in line with \nenterprise requirements \n1.5 Damaged component/materials and accessories are \nrecorded/noted and reported to supervisor\n2.  Interpret manuals\n2.1 Relevant sections and chapters of specifications/manuals are \nlocated in relation to the work to be conducted  \n2.2 Information and procedure in the manual are interpreted in \naccordance to the job requirement \n2.3 Testing procedure are prepared according to the \nmanufacturers’ specifications. \n2.4 Manuals of components/materials and accessories are \ninterpreted in line manufacturer/supplier/specification\n3. Identify and \nprepare test  \ninstruments\n3.1 Test instruments are listed as per job order requirement \n3.2 Test instrument specifications are complied with in  \n     accordance to the test procedure requirement\n4. Inspect/test \ncomponents and \nmaterials \n4.1 Testing procedures are identified in accordance with the \nmanufacturer’s specifications \n4.2 Tests results are recorded in material testing forms \n4.3  Inspection/Testing is accomplished without  causing damage \nto components and materials and injury to self and others  \n4.4 Task is performed using personal protective  equipment \n(PPE)\n 5. Report test \nresults \n5.1 Test results are evaluated against the manufacturer’s \nspecifications \n5.2 Report is made on the compliance or non-compliance of the \nmaterial according to manufacturer’s specifications \n6 \nNotify \ncompletion of \nwork \n6.1 Final checks are made to ensure that work  conforms with \ninstructions and job requirements \n6.2 Supervisor is notified upon completion of work \n6.3 Tools, equipment and any surplus resources and materials are, \nwhere appropriate, cleaned, checked and returned to storage \nin accordance with established procedures \n6.4  Work area is cleaned up and made safe according to \noccupational health and safety (OH & S) regulation\n\n--- PDF PAGE 35 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n33\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1.  Components \nmaterials \n \n \n \n1.1   PV Module/array \n1.2 Support structures \n1.3 Charge Controller/regulator \n1.4 Battery/battery bank \n1.5 Inverter/converter \n1.6 Lighting fixtures and accessories \n1.7 Convenience outlets for appliances and  devices \n1.8 Wires and cables \n1.9 Fastening fixtures\n2.  Specifications \n \n2.1 Voltage  \n2.2 Current \n2.3 Voltage settings \n2.4 Specific gravity  \n2.5 Illumination of lights \n2.6 International Electro-technical Commission (IEC) and other \ncertifying bodies  \n2.7 Dimension (length, diameter/size, thickness)  \n2.8 IP/NEMA outdoor ratings (tropicalized, sunlight-resistant)\n3. Test instruments \n3.1 Voltmeter \n3.2 Ammeter \n3.3 Variable Power Supply \n3.4 Hydrometer \n3.5 Lux meter \n3.6 Multi-meter \n3.7 Clamp meter\n4. Test procedures \n4.1 Measurement of terminal voltage  \n4.2 Measurement of current flow \n4.3 Measurement of voltage settings of charge \ncontroller/regulator \n4.4 Measurement of specific gravity of battery electrolyte \nsolution \n4.5 Measurement of illumination output of lights \n5. Personal protective \nequipment (PPE) \n5.1 Goggles \n5.2 Rubber gloves \n5.3 Safety shoes \n5.4 Leather apron \n5.5 Hard hat\n\n--- PDF PAGE 36 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n34\nEVIDENCE GUIDE \n1.  Critical aspects \n     of competency \nAssessment requires evidence that the candidate: \n1.1 Identified and selected components/materials  \n1.2 Checked quality and ratings of test equipment \n1.3 Inspected/Tested components/materials   \n1.4 Reported and replaced defective materials and tools to \nsupervisor \n1.5 Checked PV components and materials compliance \n1.6 Identified and prepare test instruments \n1.7 Interpreted manuals \n1.8 Inspected PV components and materials for damage in line with \njob requirement\n2.  Underpinning  \n     knowledge and \nattitudes \n2.1 Basic principles of electricity \n2.2 Electrical measuring instruments \n2.3 Basic mathematics  \n2.4 IEC and other certifying body standards \n2.5 IP/NEMA standards \n2.6 Product Standards (PS)  \n2.7 Selection and usage of tools \n2.8 Personal Protective Equipment (PPE) \n2.9 Types and uses of PV components/materials \n2.10 Different forms \n2.11 Requisition procedure \n2.12 Types of PV specifications and tools \n2.13 Common materials \n2.14 Common damage to PV components/materials/ accessories \n2.15 Safety Conscious \n2.16  Observant/Attentive to details \n2.17 Safety conscious \n2.18 Honest \n2.19\nPatience\n3.  Underpinning   \n     skills \n3.1 Visual assessment of components/materials \n3.2  Preparing materials/tools/tests  \n3.3  Using test instruments, tools, and equipment  \n3.4 5S Skills \n3.5 Reading and interpreting manufacturer’s specifications and \nmanuals \n3.6 Mathematical skills \n3.7 Proper handling of PV components/materials \n3.8 Following instructions\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace location \n4.2  Tools and equipment appropriate for the activity \n4.3  Manufacturer’s manual \n4.4  Personal Protective Equipment (PPE) \n4.5  Inspection/testing instruments \n4.7 PV Components/materials appropriate for electrical installation \nlay-out\n\n--- PDF PAGE 37 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n35\n5. Method of  \nassessment \nCompetency must be assessed through: \n5.1 Demonstration and observation with question \n5.2 Written/oral examination \n5.3 Portfolio \n5.4 Third party\n6. Context of \nassessment \n6.1 Competency may be assessed in the workplace or in a simulated \nworkplace \n6.2 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines\n",
