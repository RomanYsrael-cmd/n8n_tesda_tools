        "evidence_guide": {
          "source_text": "1.  Critical  \naspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Interpreted work instructions \n1.2 Selected  tools, materials, and components for PV installation \n1.3 Used personal protective equipment \n1.4 Demonstrated  procedures for installation of PV components \n1.5 Followed safety procedures \n1.6 Cleaned worksite/housekeeping \n1.7 Stored excess materials including tools \n1.8 Accessed information relevant in conducting users’ briefing/ \norientation regarding the installed system. \n1.9 Correctly followed work instructions \n1.10 Made final checks to ensure work conforms with the installation \ndrawing plan \n1.11 Communicated effectively to ensure safety and effective work \noperations\n2.Underpinning  \nknowledge \nand attitude \n2.1 PV system operation \n2.2 PEC requirements \n2.3 Installation procedures for PV components \n2.4 Work ethics \n2.5 Respect for area/site cultural practices \n2.6 Awareness of peace and order situation in the area and site condition \n2.7 Safety practices \n2.7.1 Personal protective equipment (PPE) \n2.7.2 Safe handling of tools \n2.7.3 Safety signs/symbols \n2.7.4 Knowledge of workplace/equipment hazards \n2.7.5 Housekeeping \n2.8 Electrical Installation Drawing and Specification \n2.8.1 Electrical wiring diagram \n2.8.2 Mechanical symbols/abbreviation \n2.9 Trade Theory \n2.9.1 Principles of electricity \n2.9.2 Principles and operation of accessories/parts \n2.9.3 Installation procedure \n2.9.4 Selection of units and components \n2.10 Tools/Materials uses and specification \n2.10.1 Types of electrical controllers \n2.10.2 Types of PV Modules \n2.10.3 Types of loads \n2.10.4 Types of wires \n2.10.5 Types of fuse \n2.10.6 Types of circuit breakers \n2.10.7 Types of water pumps \n2.10.8 Types of hammer \n2.10.9 Types of screwdriver \n2.10.10 Types of soldering irons \n2.10.11 Types of pliers \n2.10.12 Types of wrenches \n2.10.13\nTypes of fastening fixtures\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________________________________ \nTR PV SYSTEMS INSTALLATION NC II                                                                                                                                 \n41\n3.  Underpinning   \nskills \n3.1  Reading and interpretation of codes, symbols and diagrams  \n3.2  Interpreting plan and details  \n3.3  Preparing materials \n3.4  Interpreting product and technical brochures \n3.5  Use of hand tools and equipment \n3.6  Splicing, Dressing and Terminating wires \n3.7  Soldering Techniques \n3.8  Practice safe working habits \n3.9  Performing first aid \n3.10  Tracing circuits \n3.11 Follow simple spoken language \n3.12 Ability to relate to people of social range \n3.13 Interpreting product and technical brochures\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Work area \n4.2 Drawings and specifications relevant to the task \n4.3 Complete system components and accessories \n4.4 Tools and equipment appropriate for installation of PV \ncomponents \n4.3  Personal Protective Equipment (PPE) \n4.4 IEC materials (e.g. flipcharts))\n5.  Method of \nassessment \nCompetency must be assessed through: \n5.1 Direct observation with questioning \n5.2 Written/Oral examination \n5.3 Demonstration with questioning\n6.  Context of \nassessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace \n6.2 Competency assessment must be undertaken in accordance \nwith the endorsed TESDA assessment guidelines",
