        "evidence_guide": {
          "source_text": "1.  Critical \naspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Planned the commissioning procedure and prepared the necessary \ntools, equipment, and materials necessary to conduct the activity \n1.2 Demonstrated commissioning procedures according to established \nprocedures and job order requirements \n1.3 Notified completion of work to supervisor and customer. \n1.4 Undertaken final inspection to ensure the installation met job order \nrequirements \n1.5 Demonstrated proper housekeeping in accordance with occupational \nhealth and safety standards\n2.Underpinning \nknowledge \nand attitude \n2.1 PV system and individual components functionality and standard \noperating ranges \n2.2 Common system/equipment malfunctions and basic corrective or \ntechniques \n2.3 Commissioning procedures for PV systems and parts of a \ncommissioning document \n2.4 Basic principles of electricity \n2.5 Use and proper handling of tools and test instruments \n2.6 Occupational health and safety standards \n2.7 PEC requirements \n2.8 Awareness of peace and order situation, cultural practices, and other \nsite conditions \n2.9 Work Ethics\n3.Underpinning \nskills \n3.1 Interpreting electrical drawings  \n3.2 Tracing schematic diagrams and circuits \n3.3 Handling of tools, test instruments, and materials \n3.4 Communication skills \n3.5 Interpersonal skills \n3.6Perform first aid\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 Actual site or workplace with PV system to be commissioned  \n4.2 Tools, measuring instruments, and materials appropriate for PV \nsystem commissioning \n4.3 Electrical installation drawings and installation data sheet \n4.4 Forms   \n Commissioning document \n Acceptance document \n4.5Personal protective equipment (PPE)\n5.  Method of \nassessment \nCompetency must be assessed through: \n5.1 Demonstration and observation with questioning \n5.2 Written/Oral examination \n5.3 Third Party Report \n5.4Portfolio\n6.  Context of \nassessment \n6.1 Competency may be assessed in the workplace or in a simulated \nworkplace \n6.2 Competency assessment must be undertaken in accordance with the \nendorsed TESDA assessment guidelines",
