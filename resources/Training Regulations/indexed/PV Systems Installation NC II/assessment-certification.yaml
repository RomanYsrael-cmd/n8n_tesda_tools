  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of PV Systems Installation NC II, the\ncandidate must demonstrate competence all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2.\nThe qualification of PV Systems Installation NC II may be attained through\ndemonstration of competence through a single comprehensive project-type\nassessment covering all required units of competency of the qualification.\n\nInstall PV Systems\n• Perform Site Assessment\n• Check PV Components/Materials Compliance\n• Install PV System\n• Perform PV System Testing and Commissioning\n\n4.3.\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4.\nThe following are qualified to apply for assessment and certification:\n\n4.4.1. Graduates of formal, non-formal and informal including\n\nEnterprise-based training programs\n\n4.4.2. Experienced Workers (wage-employed or self-employed)\n\n4.5.\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 56 ---\n54\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n\n"
