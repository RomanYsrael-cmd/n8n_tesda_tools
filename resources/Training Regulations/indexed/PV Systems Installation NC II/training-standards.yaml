    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: PV SYSTEMS INSTALLATION\n\nNC Level: NC II\n\nNominal Training Duration: 284 Hrs\n\n18 Hours (Basic)\n\n72 Hours (Common)\n\n 194 Hours (Core)\n\nCourse Description:\n\n The course is designed to enhance the knowledge, desirable attitudes and\nskills of a PV Systems installation technician in accordance with industry standards. It\ncovers core competencies such as: perform site assessment, check PV components\nand materials’ compliance, install and commission PV system and prepare\ndocumentation requirements for PV systems installation.\n\nIt also includes competencies in workplace communication; work in a team\nenvironment, practice career professionalism, practice occupational health and safety,\nprepare construction materials and tools, perform mensuration and calculation,\nmaintain tools and equipment, observe procedures, specifications and manuals of\ninstructions and interpret technical drawings and plans.\n\nTo obtain these, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\n 18 Hours\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n Group\ndiscussion\n Interaction\n Lecture\n Reportorial\n• Written test\n• Practical/Perfor\nmance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n Group\nDiscussion/\nInteraction\n Case study\n Simulation\n• Written test\n• Observation\n• Simulation Role\nplaying\n• Case studies\nand\nscenarios\n\n--- PDF PAGE 48 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n46\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n Interactive-\nlecture\n Simulation\n Demonstration\n Self-paced\ninstruction\n Group\ndiscussion\n Structured\nactivity\nFilm viewing\n• Role play\n• Interview\n• Written exam\n• Demonstration\n• Portfolio\nassessment\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational health\nand safety awareness\n Interactive-\nlecture\n Simulation\n Symposium\n Group\ndynamics\n Film viewing\n Self-paced\ninstruction\n• Case/Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written\nexamination\n\nCOMMON COMPETENCIES\n72 Hours\n Unit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials and tools\napplicable to a specific\nconstruction job\n1.2 Request appropriate\nmaterials and tools\n1.3 Receive and inspect\nmaterials\n• Lecture -\nDemonstration\n• Self-paced\nInstruction\n• Group\nDiscussion\n• Power Point\nPresentation\n Oral Questions\n Direct\nobservation\n Written Test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions\n2.1 Identify, access, and\ninterpret\nspecification/manuals.\n2.2 Apply information in\nmanual.\n2.3 Store manuals.\n\n Classroom\ndiscussion/\nLecture\n Self-paced\ninstruction\n Demonstration\n Practical exam\n Oral exam\n Written test/\nquestioning\n3. Interpret\ntechnical drawing\n3.1 Analyze sign, symbols and\ndata\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand sketching\n Demonstration\n Classroom\ndiscussions\n Self-paced\ninstruction\n Direct\nobservation\n Practical exam\n Written test /\nquestioning\n\n--- PDF PAGE 49 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n47\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out measurements\nand calculations\n Lecture-\ndemonstration\n Self-paced\ninstruction\n Group\ndiscussion\n Actual\ndemonstration\n Classroom\ndiscussion\n Oral questioning\n Direct\nObservation\n Written test /\nquestioning\n Actual\ndemonstration\n5. Maintain tools\nand equipment\n5.1 Check condition of tools\nand equipment\n5.2 Perform basic preventive\nmaintenance\n5.3 Sharpen edge and tooth\ncutting tools\n5.4 Store tools and equipment\n Lecture –\nDemonstration\n Self-paced\ninstruction\n Group\ndiscussion\n Classroom\ndiscussion\n Oral questioning\n Direct\nobservation\n Written test/\nquestioning\n Practical exam\n\nCORE COMPETENCIES\n194 Hours\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Perform site\nassessment\n\n1.1 Validate Parameters for\nthe Installation\n1.2 Prepare Installation Data\nSheet\n1.3 Prepare site assessment\nreport\n Lecture-\ndemonstration\n Case Studies\n Self-paced\ninstruction\n Group\ndiscussion\n Direct observation\nwith questions\n Demonstration with\nquestions\n Oral/written\nexamination\n2. Check PV\ncomponents/\nmaterials\ncompliance\n2.1 Inspect and test\ncomponents and\nmaterials\n2.2. Interpret individual\ncomponent manuals\n2.3 Report test results\n Lecture-\ndemonstration\n Case Studies\n Self-paced\ninstruction\n Group\ndiscussion\n Direct observation\nwith questions\n Oral/written\nexamination\n\n--- PDF PAGE 50 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n48\n3. Install PV\nsystem\nPreparing Documentation on\nPV Systems\n3.1 Plan and prepare work\n3.2. Complete relevant work\nrelated documents\nInstalling PV Components\n3.3 Install PV\nModule/Panel/Array\n3.4 Install Controller\n3.5 Install Battery\n3.6 Install Inverter\nInstalling Electrical Wiring\