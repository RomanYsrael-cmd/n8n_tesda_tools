  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for PV Systems Installation NC II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: PV SYSTEMS INSTALLATION\n\nNC Level: NC II\n\nNominal Training Duration: 284 Hrs\n\n18 Hours (Basic)\n\n72 Hours (Common)\n\n 194 Hours (Core)\n\nCourse Description:\n\n The course is designed to enhance the knowledge, desirable attitudes and\nskills of a PV Systems installation technician in accordance with industry standards. It\ncovers core competencies such as: perform site assessment, check PV components\nand materials’ compliance, install and commission PV system and prepare\ndocumentation requirements for PV systems installation.\n\nIt also includes competencies in workplace communication; work in a team\nenvironment, practice career professionalism, practice occupational health and safety,\nprepare construction materials and tools, perform mensuration and calculation,\nmaintain tools and equipment, observe procedures, specifications and manuals of\ninstructions and interpret technical drawings and plans.\n\nTo obtain these, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\n 18 Hours\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n Group\ndiscussion\n Interaction\n Lecture\n Reportorial\n• Written test\n• Practical/Perfor\nmance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n Group\nDiscussion/\nInteraction\n Case study\n Simulation\n• Written test\n• Observation\n• Simulation Role\nplaying\n• Case studies\nand\nscenarios\n\n--- PDF PAGE 48 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n46\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n Interactive-\nlecture\n Simulation\n Demonstration\n Self-paced\ninstruction\n Group\ndiscussion\n Structured\nactivity\nFilm viewing\n• Role play\n• Interview\n• Written exam\n• Demonstration\n• Portfolio\nassessment\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational health\nand safety awareness\n Interactive-\nlecture\n Simulation\n Symposium\n Group\ndynamics\n Film viewing\n Self-paced\ninstruction\n• Case/Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written\nexamination\n\nCOMMON COMPETENCIES\n72 Hours\n Unit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials and tools\napplicable to a specific\nconstruction job\n1.2 Request appropriate\nmaterials and tools\n1.3 Receive and inspect\nmaterials\n• Lecture -\nDemonstration\n• Self-paced\nInstruction\n• Group\nDiscussion\n• Power Point\nPresentation\n Oral Questions\n Direct\nobservation\n Written Test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions\n2.1 Identify, access, and\ninterpret\nspecification/manuals.\n2.2 Apply information in\nmanual.\n2.3 Store manuals.\n\n Classroom\ndiscussion/\nLecture\n Self-paced\ninstruction\n Demonstration\n Practical exam\n Oral exam\n Written test/\nquestioning\n3. Interpret\ntechnical drawing\n3.1 Analyze sign, symbols and\ndata\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand sketching\n Demonstration\n Classroom\ndiscussions\n Self-paced\ninstruction\n Direct\nobservation\n Practical exam\n Written test /\nquestioning\n\n--- PDF PAGE 49 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n47\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out measurements\nand calculations\n Lecture-\ndemonstration\n Self-paced\ninstruction\n Group\ndiscussion\n Actual\ndemonstration\n Classroom\ndiscussion\n Oral questioning\n Direct\nObservation\n Written test /\nquestioning\n Actual\ndemonstration\n5. Maintain tools\nand equipment\n5.1 Check condition of tools\nand equipment\n5.2 Perform basic preventive\nmaintenance\n5.3 Sharpen edge and tooth\ncutting tools\n5.4 Store tools and equipment\n Lecture –\nDemonstration\n Self-paced\ninstruction\n Group\ndiscussion\n Classroom\ndiscussion\n Oral questioning\n Direct\nobservation\n Written test/\nquestioning\n Practical exam\n\nCORE COMPETENCIES\n194 Hours\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Perform site\nassessment\n\n1.1 Validate Parameters for\nthe Installation\n1.2 Prepare Installation Data\nSheet\n1.3 Prepare site assessment\nreport\n Lecture-\ndemonstration\n Case Studies\n Self-paced\ninstruction\n Group\ndiscussion\n Direct observation\nwith questions\n Demonstration with\nquestions\n Oral/written\nexamination\n2. Check PV\ncomponents/\nmaterials\ncompliance\n2.1 Inspect and test\ncomponents and\nmaterials\n2.2. Interpret individual\ncomponent manuals\n2.3 Report test results\n Lecture-\ndemonstration\n Case Studies\n Self-paced\ninstruction\n Group\ndiscussion\n Direct observation\nwith questions\n Oral/written\nexamination\n\n--- PDF PAGE 50 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n48\n3. Install PV\nsystem\nPreparing Documentation on\nPV Systems\n3.1 Plan and prepare work\n3.2. Complete relevant work\nrelated documents\nInstalling PV Components\n3.3 Install PV\nModule/Panel/Array\n3.4 Install Controller\n3.5 Install Battery\n3.6 Install Inverter\nInstalling Electrical Wiring\n3.7 Prepare electrical tools,\nmaterials and equipment\n3.8 Read and interpret\nelectrical diagrams\n3.9 Install lighting and power\ncircuit using electrical non-\nmetallic conduit.\n3.10 Install light and power\ncircuit using sheathed\nnon-metallic cable\n3.11 Install light and power\ncircuit using electrical non-\nmetallic surface raceway.\n Lecture-\ndemonstration\n Self-paced\ninstruction\n Group\ndiscussion\n\n Direct Observation\n and Questioning\n Demonstration\n Oral/written\nexamination\n\n4. Perform PV\nsystem testing\nand\ncommissioning\n4.1 Prepare to commission\nPV system\n4.2 Commission PV system\n4.3 Inspect and notify\ncompletion of work\n Lecture-\ndemonstration\n Self-paced\ninstruction\n Group\ndiscussion\n Oral/Written test\n Demonstration with\nquestioning\n Observation with\nquestioning\nThird party report\n\n--- PDF PAGE 51 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n49\n3.2 TRAINING DELIVERY\n\n The delivery of training should adhere to the design of the curriculum. Delivery\nshall be guided by the 10 basic principles of competency-based TVET:\n•\nThe training is based on curriculum developed from the\ncompetency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency\n\nstandards and the curriculum modules;\n•\nAssessment is based on the collection of evidence of the\n\nperformance of work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nTraining program allows for recognition of prior learning\n\n(RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are registered with the UTPRAS.\n\n The competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n\n Modular/self-paced is a competency-based training modality wherein the\ntrainee is allowed to progress at his/her own pace. The trainer only facilitates\nthe training delivery.\n\n Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n\n Supervised Industry Training or On-the-Job Training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee through\nactual experience in the workplace to acquire specific competencies\nprescribed in the training regulations.\n\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n\n Project-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 52 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n50\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are\nalso stated. Passing entry written examinations may also be indicated if\nnecessary.\n\nTo qualify as trainee for PV Systems Installation Technician NC II, a\ncandidate must possess the following:\n\n• Can communicate both orally and in written\n• Physically and mentally fit to undergo training\n• At least 18 years old\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nPV SYSTEMS INSTALLATION NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nPV Systems Installation NC II.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nITEM\nQTY\nITEM\nQTY\nITEM\n5 pcs.\nSpirit level\n5 units\nDC drill\n 2 rolls\n Wire AWG #12\n- PDX\n5 pcs.\nHack saw\n25 units\n Multi-meter\n 2 rolls\n Wire AWG #12\n- Royal Cord\n12 sets.\nPliers 9”\n(electrician, long\nnose, side cutter)\n5 units\nClamp meter\n5 rolls\n Electrical tape\n12 sets\nScrewdrivers\n25\nunits\n Hydrometer\n1 box\nWood screw ½” x 8\n12 sets.\nCombination\nWrenches - open\n& box (6mm – 14\nmm)\n 5 units\n Battery Cell\ntester\n50 m\nCircular loom (mica\ntubing 3/8”)\n12 pcs.\nWire stripper\n10 pcs. PV module\n25 pcs.\nReceptacle surface\ntype\n 25 pcs.\n Magnetic\nCompass\n10 pcs. Controller\n25 pcs.\nReceptacle flush\ntype\n12 pcs.\nBattery\n25 pcs.\nCO (DC)\n12\npcs.\nTools holster\n5 pcs.\n Battery Box\n10 pcs.\nJunction Box (4x4)\n12 pcs.\nMeasuring tape\n10 pcs.\n Support\nStructure\n - single module\n25 pcs.\nConvenient outlet\nc.o. (flush type) 2\ngang w/ plate and\ncover\n5 pcs.\nClaw hammer\n 5 pcs.\nVariable Power\nSupply ( output 5-\n10 pcs.\nTumbler switch\n\n--- PDF PAGE 53 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n51\n30VDC, 30 A)\n5 pcs.\nCross Cut Saw\n 25 pcs.\n Safety goggles\n12 pcs.\nIncandescent bulb\n50 w/ 250V AC\n25 pcs.\nHard hat\n12 pcs.\nCFL 11 W 12Vdc\n25 pcs.\nSafety Gloves\n12 pcs.\nConnectors\n.\n5 pcs.\nSafety Belt\n12 pcs.\nClamps\n .\n\n5 pcs\n Support\nStructure\n- double module\n2 packs\nBattery grease\n\n 1 pcs.\n Inverter (full sine)\n200 VA\n1 boxes\nFuse\n\n 1 pcs.\n Inverter\n(modified) 500 VA\n1 boxes\nDiodes\n\n1 pc.\nOscilloscope w/\naccesories\n 2 rolls\n Wire AWG #14\n- PDX\n\n 2 rolls\n Wire AWG #14\n- Royal Cord\n5 boxes\nStaple Wire 1”\n\n50\npcs.\nPVC clamp ½\n20\nPVC conduit ½,\n20 pcs.\nJunction box PVC\n20 pcs.\nConnectors PVC, ½\n10 pcs.\nElbow PVC ½\n\n5 sets\nPanel board with 15\namp circuit breaker\n\n20 pcs.\nSwitch (3 way with\nplate and cover)\n\n10 pcs.\nSwitch (single pole\nwith plate and\ncover)\n\n1 pc.\nWhiteboard 4 x 8 x\n¾\n\n1 pc.\nWhiteboard 4 x 4 x\n¾ with movable\nstand\n\n1 box\nWhiteboard marker,\nassorted color\n\n2 pcs.\nWhiteboard eraser\nmagnetic\n\n--- PDF PAGE 54 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n52\n3.5\nTRAINING FACILITIES\nPV SYSTEMS INSTALLATION NC II\n\nBased on a class intake of 25 students/trainees, below are the space requirement &\ntheir sizes:\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ. METERS\nLecture/Demo Area\n6 x 5\n30\n30\nLaboratory Area\n8 x 8\n64\n64\nLearning Resource Area\n3 x 5\n15\n15\nWash, Toilet, & Locker Room\n3 x 5\n15\n15\nCirculation**\n\n33\n Total Area\n\n157\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINER QUALIFICATIONS (TQ)\n\n PV SYSTEMS INSTALLATION NC II\n\n• Must be a holder of at least PV Systems Installation NC II,\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years relevant industry experience and/or teaching\nexperience2\n• Must be a civil-service eligible or holder of appropriate professional license issued\nby the Professional Regulatory Commission (for government positions only)\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or equivalent”\nupon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 55 ---\n____________________________________________________________________________________________________\nTR PV SYSTEMS INSTALLATION NC II\n53"
