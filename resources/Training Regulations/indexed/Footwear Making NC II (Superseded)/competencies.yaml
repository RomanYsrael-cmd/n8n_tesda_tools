        "source_title": "PERFORM BASIC MACHINE LASTING",
        "source_text": "--- PDF PAGE 80 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n78\n \nUNIT OF COMPETENCY: \nPERFORM BASIC MACHINE LASTING \nUNIT CODE:\nFWR744320\nUNIT DESCRIPTOR: \nThis unit covers knowledge, skills and attitude required in \nperforming toe lasting, seat and side lasting of a flat \nlasted construction. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1 Perform machine \nsettings \n1.1 Machine is set up according to manufacturer's \nspecifications and work ticket requirements \n \n1.2 Machine is tested in accordance with manufacturer's \nrequirements \n2 Perform toe lasting \n2.1 Toe lasting is performed in accordance with work \nticket and style/design of shoes \n \n2.2 Toe lasting is performed with no excess adhesive \nand no crease at toe featheredge \n3 Carry out seat and side \nlasting \n3.1 Seat and side lasting is carried out within 30 \nseconds to 1 ½ minutes per set in accordance with \nwork ticket and standard operating procedures \n \n3.2 Seat of lasted upper is flattened and evened without \ndamage. \n \n3.3 Adhesive is applied to the seat of lasted upper \nwithout excess (no extrusion). \n \n3.4 Seat and side lasting are checked as per standard \nquality procedures\n\n--- PDF PAGE 81 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n79\n \nRANGE OF VARIABLES  \n \nVARIABLE \n \nRANGE \n \n1. Machine setting \nThe different machine settings to be done are: \n1.1 \nTemperature \n1.2 \nCycle Dwell timer \n1.3 \nAir Pressure  \n1.4 \nWiper Temperature Regulator \n1.5 \nThermoplastic Rod Temperature Regulator \n1.6 \nPincer Pull Pressure Regulator \n1.7 \nHeater Switch \n1.8 \nPositioning of lasted upper \n2. Damages \n2.1 \nDamage to lining \n2.2 \nDamage to upper  \n2.3 \nStraining of lining \n2.4 \nBurst seam of lining \n2.5 \nBurst seam of upper \n2.6\nTwisted lining\n3. Adhesives \n3.1 \nNeoprene \n3.2 \nPolyurethane  \n3.3 \nWater based \n3.4 \nSolvent based \n3.5 \nRubber cement \n3.6 \nHot melt adhesive \n3.7 \nLatex \n3.8\nGraft adhesives\n\n--- PDF PAGE 82 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n80\n \nEVIDENCE GUIDE  \n1 Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared machine settings  \n1.2 Performed toe lasting \n1.3 Carried out seat and side lasting \n2 Underpinning \nknowledge and \nattitude \n2.1 \nSafe work practices and first aid  \n2.2 \nSafe handling of tools and materials  \n2.3 \nUpper size/fit and color system \n2.4 \nKinds of damages/defects in lasting upper \n2.5 \nMachine lasting operations \n2.6 \nQuality standards procedures \n2.7 \nTypes and Characteristics of Adhesive  \n2.8 \nPositive work values (orderliness and being \norganize, cost, quality and safety consciousness, \npatience, etc.) \n3 Underpinning skills \n3.1 Operating lasting machines \n3.2 Communicating and interacting skills  \n3.3 Interpreting work ticket  \n3.4 Assessing quality of the lasted uppers and \nrecognizing its defects.\n4 Resource implications The following resources MUST be provided: \n4.1 \nWorkplace with proper lighting and ventilation \n4.2 \nWork ticket \n4.3 \nMaterials and tools relevant to the activity \n4.4\nTools and equipment relevant to the activity\n5 Methods of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct \nobservation/ \ndemonstration \nof \nthe \ncandidate’s application of knowledge to tasks and \nquestioning related to underpinning knowledge  \n5.2\nPortfolio \n6 \nContext  for \nassessment \n6.1 Competency may be assessed individually in the \nworkplace or in a simulated workplace setting or in \nany TESDA accredited assessment center\n",
        "required_knowledge": null,
