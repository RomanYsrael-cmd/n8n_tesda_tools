        "source_title": "PERFORM BLOCKING/CRIMPING OPERATION",
        "source_text": "--- PDF PAGE 42 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n40\n \nUNIT OF COMPETENCY:\nPERFORM BLOCKING/CRIMPING OPERATION\nUNIT CODE:\nFWR744313 \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitude \nrequired in performing blocking/crimping operation.    \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare upper for \nblocking  \n1.1 \nVamps are prepared in accordance with styles and \ndesigns.  \n \n1.2 \nChalk powder is placed on the grain side of leather \nas per standard work procedures. \n \n1.3 \nEnsured that prepared vamps are free from excess \nwater.  \n2. Set up machine  \n2.1 \nMachine is set and adjusted according to \nmanufacturer's manual. \n \n2.2 \nBlade is selected and placed in the machine in \naccordance with shoe style or design. \n \n2.3 \nBlocking plates are set according to required \nposition. \n3. Perform blocking \n3.1 \nBlocking is performed in accordance with standard \noperating procedures. \n \n3.2 \nBlocked vamps are inspected and segregated in \naccordance with company standard/design/style. \n \n3.3 \nDamaged vamps are identified, reported and \nadjusted based on procedure \n4. Perform trimming of \nvamps \n4.1 \nTrimmed vamps are paired in accordance with \nshape and shades of materials. \n \n4.2 \nVamps are trimmed as per standard operating \nprocedures.\n\n--- PDF PAGE 43 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n41\n \nRANGE OF VARIABLES  \n \nVARIABLE \n \nRANGE \n1. Preparation of vamps \n1.1 \nLaid face-to-face \n1.2 \nMatched to its pair \n1.3 \nEdges are leveled \n1.4\nPerformed stitched markings\n2. Blade \n2.1 \nComponents \n2.1.1 Apron \n2.1.2 Tongue \n2.1.3 Plug \n2.1.4 Full vamp \n2.2 \nDesign/Pattern \n2.2.1 Whole cut \n2.2.2 ¾ cut \n2.2.3 Bellows tongue \n2.3.1 Last  \n3. Damaged vamps \n3.1 \nCreases \n3.2 \nGrain crack \n3.3 \nLoose grain \n3.4 \nBurned vamps \n3.5 \nRipped vamps\n\n--- PDF PAGE 44 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n42\n \nEVIDENCE GUIDE  \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1 \nPrepared upper for blocking \n1.2 \nSet up blocking machine \n1.3 \nPerformed blocking \n1.4 \nPerformed trimming of vamps \n1.5\nApplied quality in work areas\n2. Underpinning \nknowledge and attitude \n2.1 \nParts and functions of blocking machine  \n2.2 \nDifferent leather types and finishes \n2.3 \nFamiliarity with the types of upper and lining \ncomponents \n2.4 \n5S \n2.5 \nPositive work values (patience, cost, quality and \nsafety consciousness, etc.)\n3. Underpinning skills  \n3.1 \nSetting up and operating blocking machines \n3.2 \nInterpreting design and details specified by the \nshoe design \n3.3 \nInterpreting work ticket \n3.4 \nInterpreting \ncompanies \nquality \nstandards \nprocedures \n3.5\nCommunicating and interacting skills\n4. Resource implications  \nThe following resources MUST be provided: \n4.1 \n  Workplace with proper lighting and ventilation \n4.2 \n  Work ticket \n4.3 \n  Blocking machine \n4.4 \n  Vamps to be blocked \n4.5 \n  Air supply \n4.6 \n  Chalk powder \n4.7 \n  Blocked vamp pattern \n4.8 \n  Water \n4.9 \n  Flat bowl \n4.10 Blocking blades \n4.11 Knife  \n4.12 Grinding stone \n4.13\nCutting board\n5. Methods of \nassessment  \nCompetency must be assessed through: \n5.1   Direct observation/ demonstration of candidate’s \nperformance \nof \nknowledge \nto \ntasks \nand \nquestioning related to underpinning knowledge\n6. Context  for \nassessment  \n6.1 \nCompetency may be assessed individually in the \nactual workplace or in a simulated environment or \nin TESDA accredited assessment center\n",
