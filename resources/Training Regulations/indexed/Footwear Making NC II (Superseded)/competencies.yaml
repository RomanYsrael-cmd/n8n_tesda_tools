        "source_title": "CHECK CUT UPPER and LINING COMPONENTS",
        "source_text": "--- PDF PAGE 38 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n36\n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY: \nCHECK CUT UPPER and LINING COMPONENTS \nUNIT CODE:\nFWR744312\nUNIT DESCRIPTOR: \nThis unit cover the knowledge, skills and attitude required \nin checking cut upper component. The qualities of cut \nupper components are in accordance with the standard \nset by the company.\n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Inspect received cut \nupper and lining \ncomponents \n1.1 \nQuality and quantity of received cut upper and \nlining components are assessed based on job \nspecifications. \n \n1.2 \nComponents are checked for tightness and stretch \nfrom heel to toe as per standard operating \nprocedures. \n \n1.3 \nQuality of cut components is checked according to \nuniformity of shades, substance and type of \nmaterials. \n \n1.4 \nEnsured that cut upper and lining components are \nfree from major defects \n2. Segregate cut upper \nand lining components \n2.1 \nCut upper and lining components are classified \naccording to sizes, uniformity of shades, substance \nand grain variations \n \n2.2 \nCut upper and lining components are paired \naccording to shape and size \n \n2.3 \nDefective cut upper and lining components are \nidentified, returned/replaced and reported in \naccordance with company procedures\n3. Bundle cut upper and \nlining components \n3.1 \nCut upper and lining components are piled and \nstacked according to sizes and pairs. \n \n3.2 \nStacked cut upper and lining components are \nbundled and recorded in accordance with company \nprocedures \n \n3.3 \nProduction report sheets are prepared , recorded \nand submitted as per company procedures\n\n--- PDF PAGE 39 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n37\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1. Upper and lining \ncomponents \n1.1 Vamp \n1.2 Toe cap \n1.3 Wing cap \n1.4 Quarters \n1.5 Counter \n1.6 Tongue \n1.7 Back strap \n1.8 Eyelet Facing/Eye stay \n1.9 Straps \n1.10 Collar \n1.11 Heel cover \n1.12 Vamp lining \n1.13 Quarter lining \n1.14 Heel grip \n1.15 Sock lining \n2. Quality \n2.1 \nFinish \n2.2 \nColor \n2.3 \nSize \n2.4 \nMaterial \n2.5\nAlignment\n3. Major defects present \nin cut components \n3.1 Leather: \n3.1.1 \nvein marks \n3.1.2 \ntick marks \n3.1.3 \nlooseness \n3.1.4 \nflay cuts \n3.1.5 \nscratches \n3.1.6 \nputrefaction \n3.1.7 \nwobble fly \n3.1.8 \nbarb wire marks \n3.1.9 \nsalt burns \n3.1.10 ammonia burns \n3.1.11 discoloration \n3.1.12 brand marks \n3.1.13 heavy hair follicles \n3.1.14 heavy grain \n3.1.15 growth marks \n \n3.2 Man-made materials \n3.2.1 \nScratches \n3.2.2 \nStains \n3.2.3\nHole\n\n--- PDF PAGE 40 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n38\n \n4. Sizes \n4.1 French: \n4.1.1 \nMen’s size:  39 – 44 \n4.1.2 \nLadies’ size:  35 – 39 \n4.1.3 \nChildren’s size :  21 – 38 \n4.2 American \n4.2.1 \nMen’s size:  5 - 12 \n4.2.2 \nLadies’ size:  4 -9 \n4.2.3 \nChildren’s size :  11 - 6\n\n--- PDF PAGE 41 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n39\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Assessed / checked the quality of received \ncomponents \n1.2 Identified, segregated and reported defective \ncomponents \n1.3 Bundled cut upper and lining components \n1.4 Recorded information on production report sheet \n1.5 Interpreted and followed instructions from work ticket \n2. Underpinning \nknowledge and attitude\n2.1 Safe work practices \n2.2 Basic product knowledge \n2.3 Sizing components \n2.4 Types and characteristics of leather and man-made \ncomponents \n2.5 Footwear terms \n2.6 Positive work values (Quality, cost and safety \nconsciousness, attention to details, patience, \nperseverance, etc.) \n3. Underpinning skills \n3.1 Assessing leather quality and recognizing leather \ndefects and variations in grain and color \n3.2 Communicating and interacting skills \n3.3 Interpreting work ticket \n3.4 Determining direction of stretch and tightness of \nmaterials \n4. Resource implications \nThe following resources MUST be provided: \n4.1 Workplace  with proper lighting and ventilation \n4.2 Work ticket \n4.3 Materials relevant to the activity \n5. Methods of \nassessment \n5.1 Competency must be assessed through direct \nobservation \n/ \ndemonstration \nof \ncandidate’s \napplication of knowledge to tasks and questioning \nrelated to underpinning knowledge  \n6. Context  for \nassessment \n6.1 Competency may be assessed individually in the \nactual workplace or simulated environment or in \nTESDA accredited assessment center\n",
