          "source_text": "1. Prepare work pieces  \n1.1 \nWork pieces are repaired and cleaned before \npolishing in accordance with standard operating \nprocedures. \n \n1.2 \nPolishing materials and equipment are \nprepared in accordance with standard operating \nprocedures.\n2. Apply first coating  \n2.1 \nChemicals used are selected and applied to the \nshoe in accordance with manufacturer's manual. \n \n2.2 \nCream filler is applied to shoe upper according to \ncompany requirements. \n \n2.3 \nDrying time is followed according to the company \nrequirements. \n3. Perform cotton \nbrushing \n3.1 \nCotton brushing operation is done according to \ntypes and finishes of leather. \n \n3.2 \nUppers are free from damage, patches and \ndiscoloration. \n4. Apply final coating  \n4.1 \nTopcoat chemicals are applied evenly on shoe \nuppers in accordance with company standard.  \n \n4.2 \nBuffing is done following the shoe contours.  \n \n4.3 \nShoe uppers are free from discoloration after mop \nbrushing. \n \n4.4 \nDamage are recorded in the work ticket as per \nstandard operating procedures\n5. Perform final polishing \nand brushing of shoes. \n5.1 \nShoes are arranged to the flow of operation for \nfinal polishing. \n \n5.2 \nFinal brushing is done in accordance with standard \noperating procedures. \n \n5.3 \nDamaged shoes are segregated and repaired \naccording to standard operating procedures.\n\n--- PDF PAGE 98 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n96\n \nRANGE OF VARIABLES  \n \nVARIABLE \n \nRANGE \n1. Complete shoe \n1.1 \nVamp \n1.2 \nToe Cap \n1.3 \nWing Cap \n1.4 \nQuarters  \n1.5 \nCounter  \n1.6 \nTongue  \n1.7 \nBack strap \n1.8 \nEyelet Facing/ Eye stay  \n1.9 \nStraps \n1.10 Collar \n1.11 Sole \n1.12 Heel \n1.13\nSole edging\n2. Polishing materials \n2.1 \nRug \n2.2 \nTop coat/gloss \n2.3 \nUpper cleaning materials \n2.4 \nFaking crayons \n2.5 \nShoe polisher \n2.6 \nCarnauba wax \n2.7 \nFinishing oil \n2.8 \nSafety gloves \n2.9 \nCrepe rubber \n2.10 Insole iron  \n2.11\nWater cleaner\n3. Polishing equipment \n3.1 \nCotton roller \n3.2 \nSpray gun \n3.3 \nDryer \n3.4\nCompressor\n4. Damages visible on the \npolished shoe \n4.1 \nupper discoloration \n4.2 \nknife cuts \n4.3 \npoor top coat application \n4.4 \nuneven brushing \n4.5\nburned out sole\n5. Leather \ntypes \nand \nfinishes \n5.1 \nFull grain \n5.2 \nSemi-aniline \n5.3 \nBrush off \n5.4 \nOil Pull-up \n5.5 \nNappa \n5.6 \nCrazy horse \n5.7\nNubuck\n\n--- PDF PAGE 99 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n97"
