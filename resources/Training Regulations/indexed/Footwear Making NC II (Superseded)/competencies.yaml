          "source_text": "1. Perform sole attaching \nand pressing \n1.1 Solvents are reactivated in accordance with \nmanufacturer's requirements. \n \n1.2 Sole attached to lasted upper according to \nstandard operating procedures and without \ncausing damage to the materials. \n \n1.3 Sole press machine is set up in accordance with \nmanufacturer's manual. \n \n1.4 Pressing is performed in accordance with standard \noperating procedures. \n2. Perform edge cleaning \noperations \n2.1 Sole and upper are cleaned and free from excess \nadhesive and without harming the bond. \n \n2.2 Tools for edge cleaning are used in accordance \nwith the type of upper material. \n3. Delasting and \ninspection of shoe \n3.1 Delasting is performed in accordance with standard \noperating procedures. \n  \n3.2 Delasting is performed without causing damage to \nthe topline and seams. \n \n3.3 Shoes are inspected in accordance with quality \nstandard procedures.\n\n--- PDF PAGE 92 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n90\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. Outsoles \n1.1 \nLeather Unit Soles \n1.2 \nPolyvinyl Chloride (PVC) \n1.3 \nThermoplastic Rubber (TPR) \n1.4 \nThermoplastic Urethane (TPU) \n1.5 \nPolyurethane (PU) \n1.6 \nEthyl Vinyl Acetate (EVA) \n1.7 \nNylon \n1.8 \nRubber (Vulcanized, Unvulcanized) \n1.9 \nCrepe \n1.10 Resin \n2. Re-activated \n2.1 \nSemi – automatic (10 seconds) \n2.1.1 \nFlash re-activator machine  \n2.2 \nOperator controlled (30 seconds) \n2.2.1 \nQuartz – halogen lamps \n2.2.2 \nFabricated re-activator machine  \n3. Standard operation \n3.1 \nToe part of lasted upper to forepart of outsole \n3.2 \nSeat area of outsole to back part of lasted upper \n3.3 \nSides of lasted upper to sides of outsole \n4. Damages \n4.1 \nIncorrect positioning of lasted upper to outsole \n4.2 \nWeak adhesion due to improper solvent \napplication and/or priming procedures\n5. Sole Press Machines \n5.1 \nTwo station sole press machine \n5.1.1 \nPneumatic  \n5.1.2 \nHydraulic pressure sole press \n5.2 \nOne station \n5.2.1 \nPneumatic  \n5.2.2\nHydraulic pressure sole press\n6. Tools \n6.1 \nPale crepe \n6.2 \nSolvent \n6.3 \n“balibol” \n6.4\nresin rubber\n7. Type of Upper \nMaterials  \n7.1 \nLeather \n7.2 \nSynthetic \n7.3\nFabrics\n\n--- PDF PAGE 93 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n91"
