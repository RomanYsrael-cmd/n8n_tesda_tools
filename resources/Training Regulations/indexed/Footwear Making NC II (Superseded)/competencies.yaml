        "source_title": "PERFORM UPPER LEATHER SPLITTING OPERATION",
        "source_text": "--- PDF PAGE 48 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n46\n \nUNIT OF COMPETENCY: \nPERFORM UPPER LEATHER SPLITTING \nOPERATION\nUNIT CODE: \nFWR744315 \nUNIT DESCRIPTOR: \nThis unit covers knowledge, skills and attitudes required \nin reducing leather substance using machine with a \ncontrolled endless revolving blade. This operation is \nmainly directed at reducing heel covers, platform and \nwedge covers.  It can also be used to reduce insole \nbinding and the weight of complete shoe uppers.\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the range of variables\n1 Perform machine \nsetting procedures  \n1.1 Machine adjustments are made in accordance \nwith splitting specifications and safety procedures. \n \n1.2 Band knife is sharpened and repositioned in \naccordance with manufacturers procedural manual. \n \n1.3 Machine is tested in accordance with \nmanufacturer’s requirements / procedures. \n2. Position  work pieces \non the bench top  \n2.1 Work pieces are stacked according to splitting \nrequirements. \n \n2.2 Work pieces and tools are positioned according to \nthe flow of operation. \n3. Perform splitting \noperations  \n3.1 Splitting is done uniformly in accordance with work \nticket and safety requirements. \n \n3.2 Splitting is performed without damage to grain \nsurface. \n4. Segregate and bundle \nupper components \n4.1 Upper components are segregated according to \nsize and parts. \n  \n4.2 Upper components are piled up in pairs according \nto sizes and parts and then bundled.\n\n--- PDF PAGE 49 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n47\n \nRANGE OF VARIABLES  \n \nVARIABLE \n \nRANGE \n \n1. Work pieces \n1.1 \nInsole \n1.2 \nOutsole \n1.3 \nShoe lace/string \n1.4 \nStraps \n1.5\nBelts\n2. Machine adjustments \n2.1 \nTension \n2.2 \nThickness \n2.3\nSize\n3. Tools \n3.1 \nShears/scissors/cutters \n3.2 \nLeather substance gauge \n3.3 \nCleaning brush\n\n--- PDF PAGE 50 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n48\n \nEVIDENCE GUIDE  \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate:  \n1.1 \nSet the splitting machine \n1.2 \nPositioned work pieces \n1.3 \nSplit components uniformly \n1.4 \nSegregated and bundled upper components \n1.5 \nInterpreted and followed the work instructions \naccurately  \n2. Underpinning \nknowledge and attitude\n2.1 \nSafe work practices  \n2.2 \nMachine’s parts and function and adjustments \n2.3 \nTools \n2.4 \nFamiliarity with upper and lining component parts \n2.5 \nQuality standards \n2.6 \nMaintenance \n2.7 \nPositive work values (being organize, cost, quality \nand safety consciousness, patience, attention to \ndetails, etc.)  \n2.8 \n5S \n3. Underpinning skills  \n3.1 \nAdjusting  and setting procedures \n3.2 \nMeasuring thickness of leather using thickness \ngauge and ruler \n3.3 \nCommunicating and interacting skills \n3.4 \nInterpreting work ticket \n4. Resource implications  \nThe following resources MUST be provided: \n4.1 \nSplitting machine  \n4.2 \nWorkplace with proper lighting and ventilation \n4.3 \nWork ticket \n4.4 \nMaterials relevant to the proposed activity \n4.5 \nTools and equipment appropriate for measuring \nleather substance  \n5. Methods of \nassessment  \nCompetency must be assessed through: \n5.1 \nDirect \nobservation/ \ndemonstration \nof \nthe \ncandidate’s application of knowledge to tasks and \nquestioning related to underpinning knowledge  \n5.2 \nPortfolio   \n6. Context for \nassessment  \n6.1 \nCompetency may be assessed individually in the \nworkplace or in a simulated workplace setting or in \nany TESDA accredited assessment center\n",
