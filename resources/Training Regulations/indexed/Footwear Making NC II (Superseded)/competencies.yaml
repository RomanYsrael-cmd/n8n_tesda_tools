        "source_title": "SET UP AND OPERATE MACHINE/S",
        "source_text": "--- PDF PAGE 29 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n27\n \nUNIT OF COMPETENCY\nSET UP AND OPERATE MACHINE/S\nUNIT CODE   \nFWR744205\nUNIT DESCRIPTOR \nThis unit covers the knowledge and skills required to set \nup, operate and sample run machines for footwear \nmanufacturing\n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Set up / prepare \nmachines \n \n1.1 \nProduct specifications are interpreted in relation to \nmachine setting requirements \n \n1.2 \nType of machines to be set up are identified in \naccordance with the job requirement \n \n1.3 \nMachines for footwear manufacturing  are set in \naccordance with product specifications, machine \nmanufacturer’s instructions and company \nprocedures\n \n2. Conduct sample run \n \n2.1 \nMaterials to be used for sampling is obtained \n \n2.2 \nMachine is operated in accordance with \nmanufacturer’s and company instructions to \nproduce a specified sample\n \n3. Test machine output \n \n3.1 \nMachine outputs are tested or organized in \naccordance with company procedures to ensure \nrequired standards of quality are met\n \n4. Re-adjust machine \nsetting to meet \nrequirements \n \n4.1 \nTest results are interpreted to determine machine \nadjustment requirements \n \n4.2 \n Adjustment changes are assessed in accordance \nwith product and machine specifications \n \n4.3 \n Appropriate production personnel are informed of \nthe availability of the newly set up machine in \naccordance with workplace procedures\n \n5. Maintain records \n \n5.1 \nRecords are maintained and reports prepared in \naccordance with the company procedures\n\n--- PDF PAGE 30 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n28\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. Machines for footwear \nmanufacturing \n \n1.1 \nSewing machines (flatbed, post-bed, cylinder arm, \nzigzag, etc.) \n1.2 \nLasting machines (toe lasting machine, seat and \nside lasting machine, mulling machine, chiller, heat \nsetting machine, sole attaching machine, etc.) \n1.3 \nFinishing machine (buffing machine, etc.) \n \n2. Machine output \n \n2.1 \nProduct sample \n2.2 \nService samples \n2.3 \nMachine operation \n  \n3.  Machine adjustments \n \n3.1 \nAir Pressure \n3.2 \nTemperature \n3.3 \nSpeed \n3.4 \nTime delay  \n3.5 \nMotor and Needle timing (for sewing machines)\n\n--- PDF PAGE 31 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n29\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nInterpreted product specifications in relation to \nmachine setting requirements \n1.2 \nObtained appropriate materials to be used for \nsample or test run \n1.3 \nOperated machines with ease and confidence \n1.4 \nTested or organized sample run to ensure quality \nstandards are met \n1.5 \nInterpreted test results \n1.6 \nAssessed adjustment changes \n1.7\nMaintained records and prepared reports\n2. Underpinning \nknowledge  \n2.1 \nSetting up and adjustment requirements for the \nrange of machines and equipment used in the \ncompany \n2.2 \nQuality requirements \n2.3 \nMachine manufacturer’s specifications \n2.4 \nSafety and environmental aspects of relevant \ncompany activities \n2.5 \nWorkplace procedures and reporting processes \n2.6\nRelevant OH&S legislation and codes of practice\n3. Underpinning skills \n3.1 \nSetting and operating footwear manufacturing \nmachines \n3.2 \nTesting and analyzing samples for test run \n3.3 \nApplying all relevant safety practices when working \nin the industry \n3.4 \nCommunicating effectively with individuals, work \ngroups and supervisors \n3.5 \nMaintaining records and document and transfer \ninformation \n3.6\nInterpreting and carrying out established procedures\n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDirect observation of work activities related to \nfootwear construction and manufacturing processes.\n6. Context of assessment \n6.1 \nCompetency assessment may occur in workplace or \nany appropriately simulated environment and in any \nTESDA accredited assessment center/s\n",
