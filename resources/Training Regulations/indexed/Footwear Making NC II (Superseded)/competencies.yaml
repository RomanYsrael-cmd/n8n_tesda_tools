        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted product specifications in relation to\nmachine setting requirements\n1.2\nObtained appropriate materials to be used for\nsample or test run\n1.3\nOperated machines with ease and confidence\n1.4\nTested or organized sample run to ensure quality\nstandards are met\n1.5\nInterpreted test results\n1.6\nAssessed adjustment changes\n1.7\nMaintained records and prepared reports\n2. Underpinning\nknowledge\n2.1\nSetting up and adjustment requirements for the\nrange of machines and equipment used in the\ncompany\n2.2\nQuality requirements\n2.3\nMachine manufacturer’s specifications\n2.4\nSafety and environmental aspects of relevant\ncompany activities\n2.5\nWorkplace procedures and reporting processes\n2.6\nRelevant OH&S legislation and codes of practice\n3. Underpinning skills\n3.1\nSetting and operating footwear manufacturing\nmachines\n3.2\nTesting and analyzing samples for test run\n3.3\nApplying all relevant safety practices when working\nin the industry\n3.4\nCommunicating effectively with individuals, work\ngroups and supervisors\n3.5\nMaintaining records and document and transfer\ninformation\n3.6\nInterpreting and carrying out established procedures\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation of work activities related to\nfootwear construction and manufacturing processes.\n6. Context of assessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment and in any\nTESDA accredited assessment center/s\n\n--- PDF PAGE 32 ---\n_________________________________________________________________________________________________\nTR 