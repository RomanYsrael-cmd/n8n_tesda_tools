        "source_title": "PERFORM HEEL-ATTACHING OPERATION",
        "source_text": "--- PDF PAGE 94 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n92\n \nUNIT OF COMPETENCY  \nPERFORM HEEL-ATTACHING OPERATION \nUNIT CODE:\nFWR744323\nUNIT DESCRIPTOR:  \nThis unit covers the knowledge, skills and attitudes \nrequired in attaching heel. \n \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare work pieces \n1.1 \nWork pieces are prepared in accordance with work \nstandards. \n \n1.2 \nRoughing machine is used in accordance with \nmanufacturer’s procedural manual. \n2. Attach heel to sole \n2.1 \nAdhesive is dried and re-activated in accordance \nwith heel attachment procedures. \n \n2.2 \nAttached heel is aligned to the centerline of the \nsole and slightly inclined with back part higher than \nthe front depending on its height. \n3. Press sole \n3.1. \nSole is pressed according to standard operating \nprocedures. \n \n3.2. \nPressed sole is free from damages. \n4. De-last shoe \n4.1 \nDe-lasting of shoe is performed in accordance with \ncompany procedures. \n \n4.2 \nShape of the shoe is retained according to design \nand style.  \n5. Fix heel to sole \n5.1 \nHeel is fixed to the sole in accordance with \nstandard operating procedures. \n \n5.2 \nHeels are fixed with no protruding fasteners on the \nheel area.\n\n--- PDF PAGE 95 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n93\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1.  Prepared \nPreparation includes: \n1.1 \nRoughing \n1.2 \nMarking \n1.3 \nPriming \n1.4\nApplying adhesive\n2. Sole materials \n2.1 \nLeather \n2.2 \nResin Rubber \n2.3 \nEVA (Ethyl Vinyl Acetate) \n2.4 \nTPR (Thermo Plastic Rubber) \n2.5 \nPU (Poly Urethane) \n2.6\nCrepe Rubber\n3. Heels \n3.1 \nThe use of heels vary on: \n3.1.1 \nMen’s shoes \n3.1.2 \nLadies’ shoes \n3.2 \nThe different heel materials used are: \n3.2.1 \nWood \n3.2.2 \nRubber \n3.2.3 \nLeather \n3.2.4 \nPlastic \n4. Heel height \n4.1 \nThe different heel height varies and depends on \nthe design of shoe. These can range from 5mm – \n75mm or higher \n5. Damages \n5.1 \nPress marks \n5.2 \nScratch marks \n5.3 \nMis-alignment \n6. Adhesives \n6.1 \nPolyurethane (PU) \n6.2 \nPolychloroprene \n7. Fasteners \n7.1 \nButtress nail \n7.2 \nStaple \n7.3 \nScrew \n7.4 \nCommon Nail\n\n--- PDF PAGE 96 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n94\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared workpieces \n1.2 \nAttached heel to sole \n1.3 \nPressed sole \n1.4 \nDe-lasted shoe \n1.5 \nFixed heel to sole \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nSafe work practices \n2.2 \nFirst Aid Treatment and Accident Prevention \n2.3 \nMachine setting and maintenance \n2.4 \nFootwear terms \n2.5 \nAnatomy of Shoe \n2.6 \nTypes of adhesive  \n2.7 \nTypes of heel and sole materials \n2.8 \nTypes of grinder \n2.9 \nQuality Standard \n2.10 5S \n2.11 Positive work values (orderliness and being \norganize, patience, cost, quality and safety \nconsciousness, etc.) \n3. Underpinning skills \n3.1 \nCommunicating and interacting skills \n3.2 \nInterpreting work ticket \n3.3 \nOperating sole pressing machine \n3.4 \nApplying company quality standards \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nWorkplace with proper lighting and ventilation \n4.2 \nWork ticket \n4.3 \nMaterials relevant to the activity \n4.4 \nTools and equipment appropriate for heel attaching \noperation \n5. Method of assessment \nCompetency must be assessed through: \n5.1    Direct observation/demonstration of the candidate’s \napplication of knowledge to tasks and questioning \nrelated to underpinning knowledge  \n5.2    Portfolio\n6. Context  for \nassessment \n6.1 \nCompetency may be assessed individually in the \nactual workplace or in a simulated environment or \nin TESDA accredited assessment center\n",
        "required_knowledge": null,
        "required_skills": null
