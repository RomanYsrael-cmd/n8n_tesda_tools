        "source_title": "PERFORM STITCHING OPERATION ON UPPER AND/OR LINING COMPONENTS",
        "source_text": "--- PDF PAGE 57 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n55\n \nUNIT OF COMPETENCY: \nPERFORM STITCHING OPERATION ON UPPER \nAND/OR LINING COMPONENTS\nUNIT CODE:  \nFWR744318 \nUNIT DESCRIPTOR: \nThis unit covers knowledge, skills and attitudes required \nto operate stitching machines and determine the stitching \nparameters and quality of stitched uppers and/or lining \ncomponents\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare work pieces \n1.1 \nWork bundle is received and checked in \naccordance with the work ticket \n \n1.2 \nWork pieces are organized according to standard \noperating procedure \n \n1.3 \nWork pieces are laid out in correct sequence in \naccordance with standard operating procedure \n \n1.4 \nComponents are attached according to work \nspecification using appropriate attaching materials \n2. Prepare machine for \nstitching \n \n2.1 \nStitching machine is set-up and adjusted in \naccordance with the workplace requirements and \nspecifications on the work ticket \n \n2.2 \nNeedle system, size and point are identified in \naccordance with the material and machine being \nused \n \n2.3 \nThread size, type and color are chosen in \naccordance with the needle and material \nrequirements \n \n2.4 \nMachine’s stitch regulator is set-up and adjusted in \naccordance with job work specification \n \n2.5 \nHook timing is set in accordance with stitch \nformation when required\n\n--- PDF PAGE 58 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n56\n \n3. Stitch upper and/or \nlining components \n3.1 \nTask is completed within specified time frame \naccording to the design/style of shoe, seam, \nbinding and trimmings to be done \n \n3.2 \nDistance of stitches from the edge are followed in \naccordance with job specification \n \n3.3 \nAllowances between double rows of stitching are \nfollowed in accordance with the design specified in \nthe work ticket \n4. Trim excess threads of \nthe stitched \ncomponents \n4.1 \nTask is completed within specified time frame and \nquantity of stitched components to be trimmed \n \n4.2 \nExcess threads of more than 10 mm are trimmed in \naccordance with job specification \n \n4.3 \nStitched components are arranged and placed to \nthe WTM\n\n--- PDF PAGE 59 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n57\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1.  Attaching materials for \ncomponents \n1.1 Rubber cement \n1.2 Contact cement \n1.3 Double-sided tape \n1.4Hot melt adhesive\n2. Stitching machine \n2.1 \nFlat Bed \n2.1.1 Single Needle \n2.1.2 Double Needle \n2.1.3 Zigzag \n \n2.2 Post Bed \n2.2.1 Single Needle \n2.2.2 Double Needle \n \n2.3 Cylinder Arm \n \n2.4 Computerized Stitching Machines \n2.4.1 Semi-computerized \n2.4.2 Fully computerized \n \n2.5Patcher Machine\n3. Needle system, size \nand point \n3.1 \nNeedle system includes: 34, 134, 134-35, 438 \n \n3.2 \nNeedle size \n3.2.1 Metric (40,45,50,…,480 MN) OR \n3.2.2 Singer or Simon Co. (4,5,6,…,36) \n \n3.3 \nNeedle point includes: \n3.3.1 Round – R \n3.3.2 Wedge – P, PCL, PCR \n3.3.3 Cross – S \n3.3.4 Twist or Reverse twist – LR, LL \n3.3.5\nSD1, DI, D\n4. Thread size, type and \ncolor \n4.1 \nThread thickness \n        10, 20, 30, 40, …, 150 \n \n4.2 \nThread twist \n4.2.1 Z – twist \n4.2.2 S – twist \n \n4.3 \nThread types \n4.3.1 Natural (cotton, flax, jute, hemp, kapok, \nwool, hair silk) \n4.3.2 Organic (rayon, synthetic fibers – \npolyamides, polyurethane, polyvinyl, nylon) \n4.3.3\nInorganic (gold, silver, copper)\n\n--- PDF PAGE 60 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n58\n \n5. Seam \n5.1 Closed \n5.2 Lapped \n5.3 Open \n5.4 Silked or French \n5.5 Brooklyn \n5.6 Piped  \n5.7 Butted \n5.8 Blind \n5.9 Cording \n5.10 Decorative\n6. Binding \n6.1 English or U-binding \n6.2 French Binding \n6.3\nItalian Binding\n7. Machine parts \n7.1 Bench top \n7.2 Head \n7.3 Arm \n7.4 Bobbin Rewinder \n7.5 Thread Stand \n7.6 Motor \n7.7 Treadle \n7.8 Tension Regulator \n7.9 Face Plate \n7.10 Throat Plate \n7.11 Feed Wheel \n7.12 Pressure Wheel \n7.13 Bobbin Case \n8. Materials \n \n8.1 Leather \n8.2 Synthetic \n8.3 Fabric \n9. Trimmings and \nfastening \n9.1 Velcro \n9.2 Elastic \n9.3 Buckle straps \n10. Time Frame \n10.1 Stitching operation = 30-60 seconds/pair \n10.2 Trimming – 10 seconds/pair \n        Note: Time varies depending on the design/style to \nbe stitched and quantity of threads to be \ntrimmed\n\n--- PDF PAGE 61 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n59\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nOrganized work pieces  \n1.2 \nAdjusted the stitching machine \n1.3 \nDetermined needle and thread to be used \n1.4 \nPerformed the required stitching operations \n1.5 \nCleaned/organized work area \n1.6 \nMaintained stitching machine working condition \n1.7 \nDemonstrated correct procedures in operating at \nleast 3 out of  5 types listed in the range of \nvariables (preferably flat-bed, post-bed and cylinder \narm machine) \n2. Underpinning \nknowledge and attitude \n2.1 \nMachine parts and functions \n2.2 \nMachine operating procedures \n2.3 \nThread and needle specifications, and thread – \nneedle relationship \n2.4 \nSeam types, binding types and other stitching \noperations \n2.5 \nFamiliarity with upper and lining components \n2.6 \nThe sequence of operation dictated by the shoe \ndesign \n2.7 \nPositive work values ( patience, attention to details, \nbeing organize, cost, quality and safety \nconsciousness) \n2.8 \n5S \n2.9 \nQuality Standard \n2.10 Identifying and interpreting different measurement \nunits used in the Metric and English System \n3. Underpinning skills \n3.1 \nDexterity in stitching upper and lining components \n3.2 \nAdjusting, operating and maintaining of machine \n3.3 \nInterpreting design and details specified by the \nshoe design \n3.4 \nInterpreting work ticket \n3.5 \nCommunicating and interacting skills\n\n--- PDF PAGE 62 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n60\n \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nWorkplace location with proper lighting  \n4.2 \nWork ticket \n4.3 \nIndustrial sewing machine \n4.4 \nMaterials to be stitched \n4.5 \nStitching supplies (e.g. thread, needle)  \n4.6 \nTools (e.g. scissors or nippers, screwdrivers, \nprecision keys) \n4.7 \nOil and cleaning agents (e.g. kerosene) \n4.8 \nUpper sample or specification chart \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1 \nDirect \nobservation \n/ \ndemonstration \nof \nthe \ncandidate’s performance of knowledge to task and \nquestion related to underpinning knowledge  \n5.2 \nPortfolio \n6. Context  for \nassessment \n6.1 \nCompetency may be assessed individually in \nworkplace or in a simulated workplace setting or in \nany TESDA accredited assessment center.\n",
