        "source_text": "--- PDF PAGE 11 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n9\n \nUNIT OF COMPETENCY:    PRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE                     :    500311107 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes in \npromoting career growth and advancement. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Integrate personal \nobjectives with \norganizational goals \n1.1 \nPersonal growth and work plans are pursued \ntowards improving the qualifications set for the \nprofession \n1.2 \nIntra- and interpersonal relationships is are \nmaintained in the course of managing oneself \nbased on performance evaluation \n1.3 \nCommitment to the organization and its goal is \ndemonstrated in the performance of duties \n2. Set and meet work \npriorities \n2.1 \nCompeting demands are prioritized to achieve \npersonal, team and organizational goals and \nobjectives. \n2.2 \nResources are utilized efficiently and effectively to \nmanage work priorities and commitments \n2.3 \nPractices along economic use and maintenance of \nequipment and facilities are followed  as per \nestablished procedures \n3 Maintain professional \ngrowth and development\n3.1 \nTrainings and career opportunities are identified \nand availed of  based on job requirements \n3.2 \nRecognitions are  sought/received and \ndemonstrated as proof of career advancement \n3.3    Licenses and/or certifications relevant to job and \ncareer are obtained and renewed\n\n--- PDF PAGE 12 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n10\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1  Performance Appraisal \n1.2  Psychological Profile \n1.3 Aptitude Tests \n2.  Resources \n2.1  Human \n2.2  Financial \n2.3  Technology \n2.3.1  Hardware \n2.3.2 Software \n3.  Trainings and career \nopportunities \n3.1 Participation in training programs \n      3.1.1 Technical \n      3.1.2  Supervisory \n      3.1.3  Managerial \n      3.1.4  Continuing Education \n3.2  Serving as Resource Persons in conferences and \nworkshops \n4.  Recognitions \n4.1  Recommendations \n4.2  Citations \n4.3  Certificate of Appreciation \n4.4  Commendations \n4.5  Awards \n4.6 Tangible and Intangible Rewards \n5.  Licenses and/or \ncertifications \n5.1  National Certificates \n5.2  Certificate of Competency \n5.3 Support Level Licenses \n5.4  Professional Licenses\n\n--- PDF PAGE 13 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n11\n \nEVIDENCE GUIDE \n       \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in \nthe course of managing oneself based on \nperformance evaluation \n1.3 \nCompleted trainings and career opportunities which \nare based on the requirements of the industries \n1.4 \nAcquired and maintained licenses and/or \ncertifications according to the requirement of the \nqualification \n2.  Underpinning \nknowledge and \nattitudes \n2.1 \nWork values and ethics (Code of Conduct, Code of \nEthics, etc.) \n2.2 \nCompany policies \n2.3 \nCompany operations, procedures and standards  \n2.4 \nFundamental rights at work including gender \nsensitivity \n2.5    Personal hygiene practices\n3.  Underpinning skills \n3.1 \nAppropriate practice of personal hygiene \n3.2 \nIntra and Interpersonal skills \n3.3    Communication skills\n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nWorkplace or assessment location \n4.2\nCase studies/scenarios\n5.  Methods of \nassessment \nCompetency may be assessed through: \n5.1 \nPortfolio Assessment \n5.2 \nInterview \n5.3 \nSimulation/Role-plays \n5.4 \nObservation \n5.5 \nThird Party Reports \n5.6\nExams and Tests\n6.  Context for assessment\n6.1 Competency may be assessed in the work place or in \na simulated work place setting\n",
