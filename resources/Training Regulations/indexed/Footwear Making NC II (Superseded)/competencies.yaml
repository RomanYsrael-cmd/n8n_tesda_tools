        "source_title": "PERFORM BASIC HAND LASTING",
        "source_text": "--- PDF PAGE 69 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n67\n \nUNIT OF COMPETENCY\nPERFORM BASIC HAND LASTING\nUNIT CODE\nFWR744311\nUNIT DESCRIPTOR \nThis unit covers knowledge, skills and attitudes required \nin basic manual lasting following enterprise and quality \nrequirement.\n \nELEMENT  \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Attach upper to \ninsole/last \n1.1 Counter is aligned in accordance with identified \nback height of last \n1.2 Back seam is straightened and positioned at the \ncenter of the counter \n1.3 Tacks are firmly embedded and hammered into \nmetal seat plate \n1.4 Safety practices are observed in handling of lasting \npincer and tacks\n2 \nApply adhesive to \nupper components and \ninsole \n2.1 Adhesive for upper materials are selected based on \njob specifications and product materials \ncompatibility \n2.2 Upper components and insole surfaces are \nprepared according to company procedures \n2.3 Adhesive is applied to components according to \nmanufacturer’s recommendations and company \nprocedures  \n2.4 Adhesive is evenly applied to bottom and along the \nedge of insole  \n2.5 Ensured that outside of upper components or last \nare clean and free from adhesive \n2.6 Adhesive is dried in accordance with manufacturer’s \nrecommendation\n3 \nCarry out toe lasting  \n3.1 Topline of upper is positioned in accordance with \nwork practice \n3.2 Lasting allowance of upper are pulled using lasting \npincers and secured at the insole \n3.3 Whole upper is straight and wrinkles or pleats \nshowing at shoe feather edge are flattened in \naccordance with company practice\n\n--- PDF PAGE 70 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n68\n \n4 \nPerform seat and \nside lasting \n4.1 Ensured that topline of upper is tight from toe to last \n4.2 Pleats and creases found between lining and upper \nmaterial are removed and flattened in accordance \nwith company procedures \n4.3 Upper stiffener and lining are pulled tightly and \nhammered to insole leaving no surplus material at \nthe waist \n4.4 Tacks are turned over on the metal seat plate \n5 Flatten upper to feather \nedge \n5.1 Feather edge gave a smooth feather line \n5.2 Upper is completely lasted to insole and is free from \ndamage \n5.3 Ensured that upper is tightly lasted with no pucker \nor gaps between the upper and last\n\n--- PDF PAGE 71 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n69\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1. Back height \n \n1.1 \nBack straps \n1.2 \nBasic counters \n1.3 \nCounters Dogtails \n1.4\nCollar\n2. Insole \n \n2.1 \nUpper Materials: \n2.1.1 \nLeather \n2.1.2 \nSynthetics \n2.1.3 \nFabrics \n \n2.2 \nInsole Materials: \n2.2.1 \nLeather board \n2.2.2 \nCellulose board \n2.2.3 \nLeather \n2.2.4 \nPlastic \n2.2.5 \nWoven/Non-woven material \n2.2.6 \nFabric \n2.2.7\nFiberboard\n3. Adhesive \n3.1 \nNeoprene \n3.2 \nPolyurethane \n3.3 \nSolvent based \n3.4 \nHot melt adhesive \n3.5 \nLatex \n3.6\nGrafted adhesive\n4. Damage \n4.1 \nDamage to lining \n4.2 \nDamage to upper \n4.3 \nStraining of lining \n4.4 \nBurst seam of lining \n4.5 \nBurst seam of upper \n4.6 \nTwisted lining \n4.7 \nTack damage \n4.8 \nPrint through of toe-puff \n4.9 \nPrint through of stiffener \n4.10\nRips caused by over pulling\n5. Tacks  \n5.1 \nStaples \n5.2\nNail tacks\n6.  Tools \n6.1 \nPincers \n6.2 \nStaple remover \n6.3\nTack remover knife\n\n--- PDF PAGE 72 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n70\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nChecked counter’s position against back height \nand back seam \n1.2 \nRemoved and flattened all creases between lining, \ninterlining and upper \n1.3 \nApplied adhesive to bottom edge of upper and \nedge of insole \n1.4 \nFollowed procedures in applying adhesive to upper \nand last \n1.5 \nAllowed proper drying time of adhesive \n1.6 \nSecured topline at correct height \n1.7 \nDetermined tacks are turned over on metal seat \nplate \n1.8 \nChecked all temporary tacks are removed from \ninsole \n1.9 \nInspected the quality of lasted shoes \n1.10 Compared lasted pairs are matching\n2. Underpinning \nknowledge and attitude \n2.1 \nSafe work practices and first aid regulations \n2.2 \nCleanliness and orderliness in the workplace \n2.3 \nUpper and backing materials \n2.4 \nHandling and storage of adhesive \n2.5 \nCompany quality standards \n2.6 \nSolvents and adhesive materials \n2.7 \nFootwear hand lasting tools \n2.8\nHand lasting operation\n3. Underpinning skills \n3.1 \nInterpreting  work tickets \n3.2 \nCommunicating and interacting effectively with \nother staff and management within the workplace\n4. Resource implications \nThe following resources must be provided: \n4.1 \nWorkplace location with proper lighting \n4.2 \nWork ticket \n4.3 \nMaterials relevant to proposed activity \n4.4 \nTools and equipment appropriate for the process of \nhand lasting\n\n--- PDF PAGE 73 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n71\n \n5. Methods of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDirect \nobservation/demonstration \nwith \noral \nquestioning related to underpinning knowledge  \n5.2\nPortfolio.\n6. Context  for \nassessment \n6.1 \nCompetency may be assessed individually in the \nworkplace or in a simulated workplace setting or in \nany TESDA accredited assessment center\n",
        "required_knowledge": null,
        "required_skills": null
      },
