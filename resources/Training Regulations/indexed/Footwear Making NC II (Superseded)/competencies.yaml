        "source_text": "FWR744310\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nto prepare upper for hand lasting such us manual insole\nattachment and manual reactivation of toe puff and\nstiffeners\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Immerse toe puff and\nstiffeners into toluene\nsolution\n1.1.\nTask\nis\nperformed\nin\naccordance\nwith\nprocedures and manufacturer's specifications.\n1.2.\nUsed solvents (toluene) are stored or disposed\nfollowing environmental rules and regulations.\n2. Insert toe puff and\nstiffeners to upper\n2.1\nTask\nis\nperformed\nin\naccordance\nwith\nprocedures and manufacturer's specifications.\n2.2\nTask is performed without damage to upper\ncomponent.\n2.3\nInserted toe-puff and stiffeners are evenly\ndistributed inside the upper component.\n2.4\nEnsured that lining is flattened and free from\ndefects.\n3. Attach insole to last\nwith tacks\n3.1.\nTask\nis\nperformed\nin\naccordance\nwith\nprocedures and manufacturer's specifications.\n3.2.\nInsole is securely attached and flushed to the\nlast according to the type of method used.\n3.3.\nUpper parts and last with insole are placed into\nthe rack or other working transportation\nmethod according to procedures.\n\n--- PDF PAGE 67 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n65\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Method\n1.1\nTacks/staple\n1.2\nUnifast\n1.3\nHot melt or adhesive\n1.4\nDouble-sided pads\n2. Insole\n2.1\nLeather board\n2.2\nCellulose board\n2.3\nLeather\n2.4\nPlastic\n2.5\nWoven/Non-woven material\n2.6\nFabric\n2.7\nFiberboard\n3. Toe puff and\nStiffeners\n3.1\nLeather\n3.2\nLeather board\n3.3\nPerformed layer\n3.4\nCelluloid\n3.5\nThermoplastic\n3.6\nNitrocellulose impregnated with fabrics\n3.7\nPaint on\n3.8\nImpregnated fabric – heat reactivated\n3.9\nPrint on\n3.10 Filmic\n3.11 Polystyrene\n3.12 Celastic\n3.13 Rubber\n4. Upper\n4.1\nLeather\n4.2\nSynthetics\n4.3\nFabrics\n5. Racks/Work Transport\nMethods (WTM)\n5.1\nRacks\n5.2\nConveyor\n5.3\nTrolleys\n5.4\nBoxes\n5.5\nBags\n5.6\nMonorail\n5.7\nHand\n6. Defects\n6.1\nDamage to lining\n6.2\nDamage to upper\n6.3\nStraining of lining\n6.4\nBurst seam of lining\n6.5\nBurst seam of upper\n6.6\nTwisted lining\n6.7\nPockets between lining and upper\n6.8\nCreases\n\n--- PDF PAGE 68 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n66\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked the last, insole and stitched upper\n1.2\nInserted toe puff and stiffeners into the uppers\n1.3\nFitted stiffener up to top line of quarter and or\ncounter.\n1.4\nAttached insole to shoe last\n2. Underpinning\nknowledge and\nattitude\n2.1\nSafe work practices and first aid regulations\n2.2\nBasic arithmetic\n2.3\nFootwear anatomy\n2.4\nToe puff and stiffener materials\n2.5\nLast shapes\n2.6\nUpper size/fit and color system\n2.7\nSolvent and adhesive materials\n2.8\nBack heights\n2.9\nHandling and storage of adhesives\n2.10 Quality standards\n2.11 Insole materials\n2.12 Uni-fast pegs\n2.13 Hot melt glue gun\n2.14 Positive work values (organize, cost, quality and\nsafety consciousness, patience, etc.)\n3. Underpinning skills\n3.1\nInterpreting work tickets\n3.2\nCommunicating skills\n3.3\nUsing tacking/stapling tools\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nMaterials relevant to the activity\n4.3\nTools and equipment appropriate for attaching\ninsoles and inserting toe puff and stiffeners into\nuppers\n4.4\nWork ticket\n4.5\nLasting table\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation / demonstration of the\ncandidate’s application of knowledge to tasks and\nquestioning related to underpinning knowledge\n5.2 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 69 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n67\n\nUNIT OF COMPETENCY\nPERFORM BASIC HAND LASTING\nUNIT CODE"
