 \nconscious, patience, orderliness and being \norganize, attention to details, etc.)\n3. Underpinning skills \n3.1 \nAssessing quality of the lasted uppers and \nrecognizing its defects. \n3.2 \nCommunicating and interacting skills. \n3.3 \nInterpreting work ticket. \n3.4 \nDetermining damages on the lasted uppers and \noutsoles. \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nWorkplace with proper lighting and ventilation \n4.2 \nWork ticket \n4.3 \nMaterials, tools and equipment relevant to the \nactivity\n5. Methods of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDirect observation/demonstration of the candidate’s \napplication of knowledge to tasks and questioning \nrelated to underpinning knowledge  \n5.2\nPortfolio\n6. Context for \nassessment \n6.1 \nCompetency may be assessed individually in the \nworkplace or in a simulated workplace setting or in \nany TESDA accredited assessment center\n",
