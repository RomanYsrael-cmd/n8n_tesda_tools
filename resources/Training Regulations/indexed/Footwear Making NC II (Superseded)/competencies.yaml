        "source_title": "PERFORM QUALITY CHECKING, REPAIR AND PACKING OF DE-LASTED SHOES",
        "source_text": "--- PDF PAGE 103 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n101\n \nUNIT OF COMPETENCY \nPERFORM \nQUALITY \nCHECKING, \nREPAIR \nAND \nPACKING OF DE-LASTED SHOES\nUNIT CODE: \nFWR744326 \nUNIT DESCRIPTOR: \nThis unit covers knowledge, skills and attitude required in \nperforming quality checking, repairing and packing of de \n– lasted footwear. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Inspect shoes for final \ndispatch \n1.1 \nShoes are inspected in accordance with company \nprocedures/requirements. \n \n1.2 \nMinor shoe defects/damages are identified and \nsegregated in accordance with standard operating \nprocedures. \n \n1.3 \nInspection report accomplished is 100% accurate. \n2. Repair shoe \ndefects/damages \n2.1 \nShoe defects/damages are repaired according to \ncompany procedures. \n \n2.2 \nRepairing tools and equipment are cleaned and \nstored in accordance with standard operating \nprocedures. \n \n2.3 \nRepair reports are accomplished as per company \nprocedures. \n3. Pack shoes in boxes \n3.1 \nShoes are packed with packaging materials in \naccordance with standard operating procedures. \n \n3.2 \nBoxes are assembled and labeled in accordance \nwith company requirements. \n \n3.3 \nDehumidifying agent is put in boxes according to \ncompany procedures. \n \n3.4 Shoe boxes are bundled and marked according to \ncolor, stock and destination.\n\n--- PDF PAGE 104 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n102\n \nRANGE OF VARIABLES  \n \nVARIABLE\n \nRANGE \n1. Minor defects/ \n      damages \n1.1 For Uppers \n1.1.1 \nScratches \n1.1.2 \nVeins \n1.1.3 \nMinor seam bursting \n1.1.4 \nCreases \n1.1.5 \nKnife cuts \n1.1.6 \nOver scouring \n1.1.7 \nDiscoloration \n1.1.8 \nNeedle scratches \n1.1.9 \nBrand marks \n1.1.10 \nPoor folding \n1.1.11 \nPoor stitching \n1.1.12 \nExcess adhesive \n1.1.13 \nStitch-marking lines \n1.2 For Bottom \n1.2.1 \nDiscoloration due to: scratches, burn \nmarks, cuts, dents \n1.2.2\nDeformities\n2. Repairing tools and \nequipment \n2.1 Scissors \n2.2 Cutter \n2.3 Safety gloves \n2.4 Crepe rubber \n2.5 Ironing rod \n2.6 Ironing board \n2.7 Repairing Materials \n2.7.1 \nFaking/repairing crayons \n2.7.2 \nDyes \n2.7.3 \nCyanoacrylate (Glue or Adhesives) \n2.7.4 \nWax \n2.7.5 \nSandpaper \n2.7.6 \nLiquid detergent \n2.7.7 \nRags \n2.7.8 \nTap water \n2.7.9\nKerosene\n3 Packaging materials \n3.1 Tissue paper \n3.2 Shoe pad \n3.3 Silica gel \n3.4 Shoe box \n3.5 Shoe tags \n3.6 Labels \n4 \nLabel \n4.1 Barcode \n4.2 Stock number \n4.3 Size \n4.4 Color \n4.5 price\n\n--- PDF PAGE 105 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n103\nEVIDENCE GUIDE  \n1. Critical \naspects \nof \ncompetency  \nAssessment requires evidence that the candidate:  \n1.1 Inspected shoes \n1.2 Repaired minor defects/damages to shoes \n1.3 Accomplished reports of inspected and repaired \nshoes \n1.4 Packed shoes in boxes  \n2. Underpinning \nknowledge \nand \nattitude \n2.1 Safe work practices \n2.2 First Aid Treatment \n2.3 Basic product knowledge \n2.4 Familiar with footwear terms \n2.5 Quality standards \n2.6 Tools and equipment for repairing and packing of \nshoes \n2.7 Shoe repair procedures \n2.8 Different methods of packaging shoes \n2.9 Positive work values (orderliness and being \norganize, cost, quality and safety consciousness, \npatience, etc.) \n3. Underpinning skills  \n3.1 Communicating skills \n3.2 Interpreting work ticket \n3.3 Handling and operating tools and equipment for \nrepairing shoes \n4. Resource implications \nThe following resources MUST be provided: \n4.1 Workplace with proper lighting and ventilation \n4.2 Work ticket \n4.3 Materials relevant to the activity \n4.4 Tools and equipment appropriate for repairing. \n5. Methods of \nassessment  \nCompetency MUST be assessed through: \n5.1 Direct observation/demonstration of the candidate’s \napplication of knowledge to tasks and questioning \nrelated to underpinning knowledge  \n5.2 Portfolio \n6. Context for  \nassessment  \n6.1 Competency may be assessed individually in the \nactual workplace or in a simulated environment or in \nTESDA accredited assessment center\n",
