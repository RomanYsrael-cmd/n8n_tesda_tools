        "source_text": "FWR744319\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitude required in\nthe performance of hand stitching operation.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare materials\n1.1\nThread is selected in accordance with the work\nticket.\n\n1.2\nNeedles are threaded and waxed in accordance\nwith standard operating procedures.\n\n1.3\nParts and holes are checked for damage and\ndefects.\n\n1.4\nHoles for stitching are punched based on\nstandard operating procedures and work ticket.\n2. Perform hand stitching\n2.1\nHand stitching is performed in accordance with the\nwork ticket without damage to the upper\ncomponent.\n\n2.2\nHand stitching style is performed according to the\nrequired design of the shoe.\n\n2.3\nThread and upper component are checked for\ndamage in accordance with company procedures.\n\n2.4\nStitches made are leveled and equal for both pair\nof shoes.\n\n--- PDF PAGE 64 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n62\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Thread\n1.1\nColor\n1.2\nSize\n1.3\nSubstance\n2. Damage and defects\n2.1\nvein marks\n2.2\ntick marks\n2.3\nlooseness\n2.4\nflay cuts\n2.5\nscratches\n2.6\nputrefaction\n2.7\nwobble fly\n2.8\nbarb wire marks\n2.9\nsalt burns\n2.10 ammonia burns\n2.11 discoloration\n2.12 brand marks\n2.13 heavy hair follicles\n2.14 heavy grain\n2.15 growth marks\n3. Stitching style\n3.1\nBox\n3.2\nCross\n3.3\nStraight\n3.4\nPie crust\n\n--- PDF PAGE 65 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n63\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared materials\n1.2\nPerformed hand stitching\n2. Underpinning\nknowledge and attitude\n2.1\nHand Stitching procedures\n2.2\nMaterials for footwear\n2.3\nTypes and sizes of threads, waxes and needles\n2.4\nTools\n2.5\nTypes of stitches\n2.6\nQuality of stitching and finished footwear\n2.7\nSafety Practices\n2.8\nPositive work values (orderliness and being\norganize, cost, quality and safety consciousness,\npatience, attention to details, etc.)\n3. Underpinning skills\n3.1\nSelecting thread, needles and punchers\n3.2\nPreparing and punching holes\n3.3\nMeasuring in Metric / English system\n3.4\nInterpreting work ticket\n3.5\nCommunicating and interacting skills\n4. Resource implications\nThe following resources MUST be provided\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nChair/stool\n4.3\nFinger protector (leather ring)\n4.4\nWork ticket\n4.5\nNeedles\n4.6\nCut upper parts\n4.7\nThread\n4.8\nHand-stitching wax (pagkit)\n4.9\nPunchers\n4.10 Dividers\n4.11 Awl\n4.12\nKnife\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation / demonstrations of the\ncandidate’s performance of knowledge to task and\nquestions related to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nTESDA-accredited assessment center\n\n--- PDF PAGE 66 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n64\n\nUNIT OF COMPETENCY:\nPREPARE UPPER FOR HAND LASTING\nUNIT CODE:"
