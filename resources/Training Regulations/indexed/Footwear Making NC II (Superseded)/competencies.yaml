        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSet the splitting machine\n1.2\nPositioned work pieces\n1.3\nSplit components uniformly\n1.4\nSegregated and bundled upper components\n1.5\nInterpreted and followed the work instructions\naccurately\n2. Underpinning\nknowledge and attitude\n2.1\nSafe work practices\n2.2\nMachine’s parts and function and adjustments\n2.3\nTools\n2.4\nFamiliarity with upper and lining component parts\n2.5\nQuality standards\n2.6\nMaintenance\n2.7\nPositive work values (being organize, cost, quality\nand safety consciousness, patience, attention to\ndetails, etc.)\n2.8\n5S\n3. Underpinning skills\n3.1\nAdjusting and setting procedures\n3.2\nMeasuring thickness of leather using thickness\ngauge and ruler\n3.3\nCommunicating and interacting skills\n3.4\nInterpreting work ticket\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nSplitting machine\n4.2\nWorkplace with proper lighting and ventilation\n4.3\nWork ticket\n4.4\nMaterials relevant to the proposed activity\n4.5\nTools and equipment appropriate for measuring\nleather substance\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect\nobservation/\ndemonstration\nof\nthe\ncandidate’s application of knowledge to tasks and\nquestioning related to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 51 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n49\n\nUNIT OF COMPETENCY:\nPERFORM MACHINE PERFORATION AND GIMPING\nOPERATIONS\nUNIT CODE:"
