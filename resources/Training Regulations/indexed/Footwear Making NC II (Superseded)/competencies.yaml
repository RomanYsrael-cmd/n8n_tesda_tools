        "source_title": "PERFORM PRE-BONDING OPERATIONS",
        "source_text": "--- PDF PAGE 86 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n84\n \nUNIT OF COMPETENCY \nPERFORM PRE-BONDING OPERATIONS \nUNIT CODE:\nFWR744321\nUNIT DESCRIPTOR: \nThis unit covers knowledge, skills and attitude required to \nperform pre-bonding operations such as tack lifting, \nbottom \nand \noutsole \ncementing, \nand \nsolvent \nwiping/priming in preparation for bonding operations.\n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Remove tacks from \nbottom of lasted upper\n1.1 \nTacks are removed from the lasted upper as per \nstandard operating procedures. \n \n1.2 \nLasted uppers removed are free from scratch \nmarks. \n \n1.3 \nBonding of lasting margin to the insole is kept \nintact. \n2. Mark and inspect \nquality of lasted upper \n2.1 \nOutsoles and lasted uppers are matched \naccording to style and size. \n \n2.2 \nBottom profile of upper is marked according to the \narea of sole to be used. \n \n2.3 \nLasted uppers are inspected according to standard \noperating procedures \n3. Perform roughing and \nscouring \n3.1 \nRoughing and scouring is performed in accordance \nwith standard operating procedures. \n \n3.2 \nGrains and finish of the lasting margin are \nremoved without damage to upper. \n \n3.3 \nFibers of the last are teased/raised in accordance \nwith work procedures. \n \n3.4 \nTop surface of the outsole is scoured without \ndamage and free from plasticisers.\n\n--- PDF PAGE 87 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n85\n \n4. Perform bottom \ncementing and \nattachment of filler \n \n4.1 \nBottom cementing and attachment of filler are \nperformed in accordance with work specification. \n \n4.2 \nFiller is attached on the bottom profile of the lasted \nupper in accordance with the thickness of upper \nmaterial. \n5. Perform sole wiping \nand sole cementing \n5.1 \nOutsole is primed according to material \nrequirement/specification. \n  \n5.2 \nOutsole is primed without causing damage to \nmaterial. \n \n5.3 \nPrimers are handled in accordance with OH & S \nrequirements. \n \n5.4 \nSole wiping and cementing is performed in \naccordance with standard operating procedures.\n\n--- PDF PAGE 88 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n86\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. Insoles \n1.1 \nLeather Board \n1.2 \nCellulose board \n1.3 \nPlastic \n1.4 \nWoven/Non-woven material \n1.5 \nFabric \n1.6 \nFiber board \n2. Outsoles \n2.1 \nLeather Unit Soles \n2.2 \nPolyvinyl Chloride (PVC) \n2.3 \nThermoplastic Rubber (TPR) \n2.4 \nThermoplastic Urethane (TPU) \n2.5 \nPolyurethane (PU) \n2.6 \nEthyl Vinyl Acetate (EVA) \n2.7 \nNylon \n2.8 \nRubber (Vulcanized, Unvulcanized) \n2.9 \nCrepe \n2.10 Resin \n3. Finish \n3.1 \npatent  \n3.2 \npearlised \n3.3 \nburnish \n3.4 \nbrush off \n3.5 \nnubuck \n3.6 \nfull grain \n3.7 \ncorrected \n3.8 \ncrazy horse \n3.9 \nprinted \n3.10 oil pull up \n3.11 exotic (ex. Snake print, ostrich, crocodile, etc.) \n4. Damages \n4.1 \nOver roughed uppers which extends over the \nmarked areas \n4.2 \nBurnt areas due to blunt brush or abrasive \n4.3 \nOver roughed insoles \n4.4 \nScratches \n4.5 \nTears \n4.6\nCuts\n\n--- PDF PAGE 89 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n87\n \n5. Adhesives \n5.1 \nPolyurethane (PU) \n5.2 \nPolyester \n5.3 \nEthyl Vinyl Acetate (EVA) \n5.4 \nPolychloroprene \n5.5\nHotmelt\n6. Fillers \n6.1 \nScrap leather \n6.2 \nSawdust \n6.3 \nRubber \n6.4 \nFoam \n6.5 \nFelt materials \n7. Upper Materials  \n7.1 \nLeather \n7.2 \nSynthetic \n7.3 \nFabrics \n8. Primers \n8.1 \nMEK (mixed solvents) \n8.2 \nPVC Primer \n8.3 \nPU Primer \n8.4 \nRubber Primer\n\n--- PDF PAGE 90 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n88\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nChecked quality of lasted uppers \n1.2 \nOperated roughing and scouring machines \n1.3 \nPerformed roughing and scouring of shoes \n1.4 \nPerformed bottom cementing and attaching of filler \n1.5 \nPerformed sole wiping and cementing  \n1.6 \nCarried out priming operations  \n1.7 \nFollowed instructions from work ticket. \n2. Underpinning \nknowledge and \nattitude \n2.1 \nSafe work practices. \n2.2 \nFirst aid treatment \n2.3 \nHandling of tools and materials \n2.4 \nProducts used in bonding (e.g. adhesives, \nsolvents, primers) \n2.5 \nFootwear terms \n2.6 \nQuality standards \n2.7 \nDifferent outsole materials \n2.8 \nPositive work values (orderliness and being \norganize, cost, quality and safety consciousness, \npatience, etc) \n3. Underpinning skills \n3.1 \nAssessing quality of the lasted uppers and \nrecognizing the uppers’ defects. \n3.2 \nCommunicating and interacting skills \n3.3 \nInterpreting work ticket \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nWorkplace with proper lighting and ventilation \n4.2 \nWork ticket \n4.3 \nTools and materials  \n4.4 \nMachines needed to the said activity \n5. Methods of \nassessment \nCompetency MUST be assessed through: \n5.1  Direct observation/demonstration of the candidate’s \napplication of knowledge to tasks and questioning \nrelated to underpinning knowledge  \n5.2    Portfolio\n6. Context  for \nassessment \n6.1 Competency may be assessed individually in the \nworkplace or in a simulated workplace setting or in \nany TESDA accredited assessment center\n",
