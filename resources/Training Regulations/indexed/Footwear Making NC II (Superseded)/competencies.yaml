        "source_title": "USE AND CARE FOR HAND AND POWER TOOLS",
        "source_text": "--- PDF PAGE 25 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n23\n \nUNIT OF COMPETENCY USE AND CARE FOR HAND AND POWER TOOLS \nUNIT CODE   \nFWR744204\nUNIT DESCRIPTOR \nThis unit covers the knowledge, skills and attitudes \nrequired in using/handling and maintaining of hand and \npower tools\n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Select appropriate \ntools for work \n1.1. \nWork requirements are interpreted in accordance \nwith the instructions of the supervising engineer \n \n1.2. \nAppropriate hand and power tools are selected \nfor the tasks required \n \n1.3. \nSelected hand and power tools are checked for \ntheir serviceability \n \n1.4. \nDefective tools are identified and reported and \nappropriate action is taken for their repair or \nreplacement in accordance with established \nprocedures \n \n1.5. \nInstruction for the use of the tools are accessed \nand interpreted if required\n2. Use hand and power \ntools \n2.1. \nWork area, work pieces and tools are prepared for \nthe required tasks in accordance with engineer’s \ninstructions and established practice \n \n2.2. \nOther personnel in the work area are made aware \nof the work being carried out as required by safety \nmanagement procedures \n \n2.3. \nWhere relevant, work is marked out using \nappropriate marking out tools in accordance with \nestablished procedures \n \n2.4. \nHand and power tools are used for the tasks as \ndirected and in accordance with established \nprocedures and manufacturer’s instructions \n \n2.5. \nDesired outcomes for the work are achieved to job \nspecifications, including finish, tension, size, \nshape etc. as required\n\n--- PDF PAGE 26 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n24\n3. Follow safety and \nhazard control \nprocedures \n3.1. \nAll required safety precautions, procedures and \nregulations are followed when using hand and \npower tools \n \n3.2. \nOperational hazards are identified when using \nhand and power tools and action is taken in \nconjunction with others to minimize or eliminate \nrisk to self, other personnel, the vessel and the \nenvironment \n4. Care for hand and \npower tools \n4.1. \nTools are used only for their intended purposes in \naccordance with manufacturer’s instructions and \nestablished procedures \n \n4.2. \nCare of tools are properly done in accordance \nwith manufacturer’s instruction and established \nprocedures \n \n4.3. \nTools are adjusted, tightened and or lubricated in \naccordance with manufacturer’s instructions and \nestablished procedures \n \n4.4. \nGrinding wheels are dressed and made true in \naccordance with manufacturer’s instructions and \nestablished procedures \n \n4.5. \nDefective or worn tools and tool components are \nidentified, marked as required and reported and \nappropriate action is taken for the repair or \nreplacement in accordance with established \nprocedures\n\n--- PDF PAGE 27 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n25\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hand tools \n1.1 Maintenance: \n1.1.1 \nSpanner \n1.1.2 \nScrew drivers (Philips) \n1.1.3 \nAllen keys \n1.1.4 \nPlier \n1.1.5 \nNylon hammer \n1.1.6 \nDressing tool \n1.2 Production \n1.2.1 \nSnips \n1.2.2 \nScissors \n1.2.3 \nPincers \n1.2.4 \nFiles/rasp \n1.2.5 \nFolding hammer \n1.2.6\nTack remover\n2. Power tools: \n2.1 Puncher \n2.2 Spreader \n2.3 Beta \n2.4 Cutting/clicking knife \n3. Operational hazards \nwhen using and \ncaring for hand and \npower tools include \n3.1 Sharp blades \n3.2 Moving and rotating blades and equipment \n3.3 Sparks in areas where flammable and explosive \nsubstances are stored \n3.4 Using tools beyond safe working limits \n3.5 Poor housekeeping procedures \n3.6 Non-compliance with safe working procedures\n4. Care of tools includes \n4.1 Cleaning \n4.2 Sharpening \n4.3 Storing \n4.4 Using tools in accordance with manufacturer’s \ninstruction and established procedures \n4.5 Using tools only for their intended purpose\n\n--- PDF PAGE 28 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n26\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate :  \n1.1. Selected appropriate hand and power tools to \ncomplete assigned tasks \n1.2. Used hand and power tools in accordance with \nestablished procedures and manufacturer’s \ninstructions \n1.3. Cared for hand and power tools in accordance with \nestablished procedures and manufacturer’s \ninstructions \n1.4. Ensure the exercise of all required safety, \nenvironmental and hazard control precautions and \nprocedures when using hand and power tools in \naccordance to complete assigned tasks \n1.5. Take appropriate action if a hand or power tools is \nfound to be defective or worn.    \n2. Underpinning \nknowledge  \n \n2.1. Knowledge on the types, names and identifying \nfeatures of various hand and power tools required \nfor work tasks that may be carried out by  ratings \n2.2. Ability to read and interpret work specifications and \ndrawings \n2.3. Ability to mark out work to specifications and to \nmeasure and check the quality of finished work \nincluding the correct use of hand and power tools\n3. Underpinning skills \n \n3.1. Observing procedures for the use and care of hand \nor power tools required for work tasks  \n3.2. Environmental protection measures when carrying \nout basic production tasks\n4. Resource implications \n \nThe following resources MUST be provided : \n4.1. Workplace \n4.2. Tools and equipment appropriate in maintaining \nhousekeeping activities \n4.3.\nMaterials relevant to the proposed activity and tasks\n5. Method \nof \nassessment \n \nCompetency MUST be assessed through: \n5.1. Direct observation and application to tasks and \nquestions related to underpinning knowledge  \n5.2. Under general guidance, checking various stages of \nthe process and at the completion of the activity \nagainst performance criteria and specifications \nWhile task are being undertaken \n6. Context \nfor \nassessment \n6.1. Competency may be assessed individually in the \nworkplace or in simulated workplace environment  \nand in any TESDA accredited assessment center/s\n",
