          "source_text": "1. Attach upper to \ninsole/last \n1.1 Counter is aligned in accordance with identified \nback height of last \n1.2 Back seam is straightened and positioned at the \ncenter of the counter \n1.3 Tacks are firmly embedded and hammered into \nmetal seat plate \n1.4 Safety practices are observed in handling of lasting \npincer and tacks\n2 \nApply adhesive to \nupper components and \ninsole \n2.1 Adhesive for upper materials are selected based on \njob specifications and product materials \ncompatibility \n2.2 Upper components and insole surfaces are \nprepared according to company procedures \n2.3 Adhesive is applied to components according to \nmanufacturer’s recommendations and company \nprocedures  \n2.4 Adhesive is evenly applied to bottom and along the \nedge of insole  \n2.5 Ensured that outside of upper components or last \nare clean and free from adhesive \n2.6 Adhesive is dried in accordance with manufacturer’s \nrecommendation\n3 \nCarry out toe lasting  \n3.1 Topline of upper is positioned in accordance with \nwork practice \n3.2 Lasting allowance of upper are pulled using lasting \npincers and secured at the insole \n3.3 Whole upper is straight and wrinkles or pleats \nshowing at shoe feather edge are flattened in \naccordance with company practice\n\n--- PDF PAGE 70 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n68\n \n4 \nPerform seat and \nside lasting \n4.1 Ensured that topline of upper is tight from toe to last \n4.2 Pleats and creases found between lining and upper \nmaterial are removed and flattened in accordance \nwith company procedures \n4.3 Upper stiffener and lining are pulled tightly and \nhammered to insole leaving no surplus material at \nthe waist \n4.4 Tacks are turned over on the metal seat plate \n5 Flatten upper to feather \nedge \n5.1 Feather edge gave a smooth feather line \n5.2 Upper is completely lasted to insole and is free from \ndamage \n5.3 Ensured that upper is tightly lasted with no pucker \nor gaps between the upper and last\n\n--- PDF PAGE 71 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n69\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1. Back height \n \n1.1 \nBack straps \n1.2 \nBasic counters \n1.3 \nCounters Dogtails \n1.4\nCollar\n2. Insole \n \n2.1 \nUpper Materials: \n2.1.1 \nLeather \n2.1.2 \nSynthetics \n2.1.3 \nFabrics \n \n2.2 \nInsole Materials: \n2.2.1 \nLeather board \n2.2.2 \nCellulose board \n2.2.3 \nLeather \n2.2.4 \nPlastic \n2.2.5 \nWoven/Non-woven material \n2.2.6 \nFabric \n2.2.7\nFiberboard\n3. Adhesive \n3.1 \nNeoprene \n3.2 \nPolyurethane \n3.3 \nSolvent based \n3.4 \nHot melt adhesive \n3.5 \nLatex \n3.6\nGrafted adhesive\n4. Damage \n4.1 \nDamage to lining \n4.2 \nDamage to upper \n4.3 \nStraining of lining \n4.4 \nBurst seam of lining \n4.5 \nBurst seam of upper \n4.6 \nTwisted lining \n4.7 \nTack damage \n4.8 \nPrint through of toe-puff \n4.9 \nPrint through of stiffener \n4.10\nRips caused by over pulling\n5. Tacks  \n5.1 \nStaples \n5.2\nNail tacks\n6.  Tools \n6.1 \nPincers \n6.2 \nStaple remover \n6.3\nTack remover knife\n\n--- PDF PAGE 72 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n70"
