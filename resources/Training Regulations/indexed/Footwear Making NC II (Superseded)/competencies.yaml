        "source_title": "PERFORM FOLDING OPERATIONS",
        "source_text": "--- PDF PAGE 54 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n52\n \nUNIT OF COMPETENCY: \nPERFORM FOLDING OPERATIONS \nUNIT CODE:\nFWR744317\nUNIT DESCRIPTOR: \nThis unit covers knowledge, skills and attitude required in \nfolding upper materials prior to stitching or attaching\n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variable \n1. Attach reinforcement \nmaterial \n1.1 \nReinforcement material is attached on the edge \nof the upper components according to required \nallowances. \n  \n1.2 \nDimensions of prepared reinforcement material are \nin accordance with work ticket specifications. \n  \n1.3 \nOverlapping of the reinforcement materials ends is \naligned as per standard operating procedures. \n2. Apply adhesive on the \nedge to be folded \n2.1 \nAdhesive is applied to components in accordance \nwith work ticket specifications. \n \n2.2 \nApplication tools are cleaned and stored \naccording to company requirements and practices. \n \n2.3 \nMask is worn in accordance with company safety \nrequirements. \n3. Cut nicks on concave \nedges \n3.1 \nNicks are slanted with lengths not exceeding half \nthe width of fold. \n \n3.2 \nDistances between nicks are equally distributed in \naccordance with shoe design. \n4. Perform folding \noperation \n4.1 \nFolding method is selected in accordance with \nwork ticket. \n \n4.2 \nFolding operation is performed according to \nquality company standard. \n  \n4.3 \nFolding tools are used in accordance with safety \nprocedures.\n\n--- PDF PAGE 55 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n53\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1. Reinforcement material\n1.1 \nSelf-adhesive \n1.1.1 Nylon tape \n1.1.2 Woven tape \n1.2 \nNon-adhesive \n1.2.1 Cotton tape \n1.2.2 Drill cloth strip \n1.3 \nString for thermo folding machine \n2. Allowance for \nreinforcement material \n2.1 \nDistance from the edge = 4-5 mm \n2.2 \nWidth from the edge = 3-4 mm \n2.3 \nOverlapping = 10 mm \n3. Adhesive \n3.1 \nLatex \n3.2 \nDouble-sided adhesive tape \n3.3 \nHot melt \n3.3.1 Chips \n3.3.2 Block \n3.4 \nRubber solution \n3.4.1 water-based \n3.4.2 solvent-based \n4. Application tools \n4.1 \nFlat Brushes \n4.2 \nRound Brushes \n5. Folding tools \n5.1 \nScissors \n5.2 \nNylon Board or Marble \n5.3 \nAwl or Folding Knife \n5.4 \nFolding hammer \n5.5 \nBrush  \n6. QS of Folding \nOperation \n6.1 Even and smooth \n6.2 Folding width is 4-5 mm all over the edge \n6.3 No bulges and corners on curve \n6.4 Follow the shape or contour of shoe component \nand design\n\n--- PDF PAGE 56 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n54\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttached reinforcement material  \n1.2 \nApplied adhesive  \n1.3 \nPerformed folding operations  \n1.4 \nCut nicks on concave edges \n1.5 \nUsed correct type of adhesive for folding \n1.6 \nUsed folding tools with safety \n1.7 \nApplied quality in work areas \n2. Underpinning \nknowledge and attitude \n2.1 \nReinforcement material \n2.2 \nAdhesive \n2.3 \nMaterials to be folded \n2.4 \nFolding tools \n2.5 \nSnipping and tucking procedures \n2.6 \nInterpreting and converting Metric to English \nSystem and vice versa \n2.7 \nPositive work values (Quality consciousness, \npatience, attention to work details, orderliness, etc.)\n3. Underpinning skills \n3.1 \nInterpreting design and details  \n3.2 \nInterpreting work ticket \n3.3 \nCommunicating and interacting skills \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nWorkplace with proper lighting and ventilation \n4.2 \nWork ticket \n4.3 \nFolding tools \n4.4 \nMaterials to be folded \n4.5 \nReinforcement materials \n4.6 \nAdhesive \n4.7 \nUpper sample or specification chart \n5. Methods of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDirect \nobservation/ \ndemonstration \nof \nthe \ncandidate’s performance of knowledge to task sand \nquestioning related to underpinning knowledge  \n5.2 \nPortfolio  \n6. Context for \nassessment \n6.1 \nCompetency may be assessed individually in the \nworkplace or in a simulated workplace setting or in \nTESDA accredited assessment center.\n",
