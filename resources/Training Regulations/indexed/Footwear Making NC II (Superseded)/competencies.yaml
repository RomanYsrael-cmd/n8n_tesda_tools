          "source_text": "1. Remove tacks from \nbottom of lasted upper\n1.1 \nTacks are removed from the lasted upper as per \nstandard operating procedures. \n \n1.2 \nLasted uppers removed are free from scratch \nmarks. \n \n1.3 \nBonding of lasting margin to the insole is kept \nintact. \n2. Mark and inspect \nquality of lasted upper \n2.1 \nOutsoles and lasted uppers are matched \naccording to style and size. \n \n2.2 \nBottom profile of upper is marked according to the \narea of sole to be used. \n \n2.3 \nLasted uppers are inspected according to standard \noperating procedures \n3. Perform roughing and \nscouring \n3.1 \nRoughing and scouring is performed in accordance \nwith standard operating procedures. \n \n3.2 \nGrains and finish of the lasting margin are \nremoved without damage to upper. \n \n3.3 \nFibers of the last are teased/raised in accordance \nwith work procedures. \n \n3.4 \nTop surface of the outsole is scoured without \ndamage and free from plasticisers.\n\n--- PDF PAGE 87 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n85\n \n4. Perform bottom \ncementing and \nattachment of filler \n \n4.1 \nBottom cementing and attachment of filler are \nperformed in accordance with work specification. \n \n4.2 \nFiller is attached on the bottom profile of the lasted \nupper in accordance with the thickness of upper \nmaterial. \n5. Perform sole wiping \nand sole cementing \n5.1 \nOutsole is primed according to material \nrequirement/specification. \n  \n5.2 \nOutsole is primed without causing damage to \nmaterial. \n \n5.3 \nPrimers are handled in accordance with OH & S \nrequirements. \n \n5.4 \nSole wiping and cementing is performed in \naccordance with standard operating procedures.\n\n--- PDF PAGE 88 ---\n_______________________________________________