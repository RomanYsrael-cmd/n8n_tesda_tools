        "source_title": "PERFORM TOE PUFF AND STIFFENERS ACTIVATION",
        "source_text": "--- PDF PAGE 77 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n75\n \nUNIT OF COMPETENCY: \nPERFORM TOE PUFF AND STIFFENERS \nACTIVATION\nUNIT CODE:  \nFWR744307 \nUNIT DESCRIPTOR: \nThis unit covers knowledge, skills and attitudes required \nto activate toe puff and stiffeners by using toe puff press \nand back part molding machine \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Set machine \n1.1 \nMachine is adjusted based on the type of upper \nand stiffener materials. \n \n1.2 \nEnsured that toe puff press machine is free from \nadhesive residues. \n2. Insert /Activate toe-puff\n2.5 \nTask is performed in accordance with procedures \nand manufacturer's specifications. \n \n2.6 \nTask is performed without damage to upper \ncomponent. \n \n2.7 \nInserted/activated toe-puff is evenly distributed \ninside the upper and lining component. \n \n2.8 \nLining is flattened and freed from defects. \n3. Insert /Activate \nstiffener \n3.1 \nStiffeners are inserted/activated between upper \nand lining in accordance with standard operating \nprocedures. \n  \n3.2 \nCenter of stiffener and counter or quarter are \nmatched and aligned with the back seam. \n \n3.3 \nStiffener is molded and activated in accordance \nwith back part molding standard. \n \n3.4 \nTask is performed without damage to upper and \nlining components.\n\n--- PDF PAGE 78 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n76\n \nRANGE OF VARIABLES  \n \nVARIABLE \n \nRANGE \n \n1. Machine adjustments  \n1.1 \nAir pressure \n1.2 \nTemperature \n1.3 \nTime setting \n1.4 \nWiper adjustments \n1.5\nBack part moulding machine \n2. Toe Puff materials \n2.1 \nPrint on \n2.2 \nPaint on \n2.3 \nFilmic \n2.4 \nPolystyrene \n2.5 \nCelastic \n2.6 \nRubber \n2.7\nLeather board\n3. Stiffener materials \n3.1 \nLeather \n3.2 \nLeather board \n3.3 \nPerformed layer \n3.4 \nCelluloid  \n3.5 \nThermoplastic  \n3.6 \nNitrocellulose impregnated with fabrics \n3.7 \nPaint on \n3.8\nImpregnated fabric – heat reactivated\n4. Defects \n4.1 \nDamage to lining and/or upper \n4.2 \nStraining of lining  \n4.3 \nBurst seam of lining and/or upper \n4.4 \nTwisted lining \n4.5\nPockets between lining and upper\n\n--- PDF PAGE 79 ---\n_________________________________________________________________________________________________ \nTR Footwear Making NC II 12/07/04                                                                                 promulgated 12/09/04 \n \n \n \n77\n \nEVIDENCE GUIDE  \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nSet up toe puff press machine and back part \nmoulding machine \n1.2 \nInserted/activated toe puff and stiffeners  \n1.3 \nMoulded stiffeners correctly \n1.4 \nOperated the toe puff press machine and back \npart moulding machine \n2. Underpinning \nknowledge and attitude\n2.1 \nSafe work practices and first aid regulations \n2.2 \nTypes of toe puff and stiffener materials \n2.3 \nUpper size/fit and color system \n2.4 \nMachine parts and functions   \n2.5 \nTypes of solvent and adhesive materials \n2.6 \n5 S \n2.7 \nBack heights  \n2.8 \nQuality standards procedures \n2.9 \nPositive work values (orderliness and being \norganize, cost, quality and safety consciousness, \npatience, etc.)\n3. Underpinning skills \n3.1 \nInterpreting  work tickets \n3.2 \nAdjustments for toe puff and stiffener reactivation \nand moulding \n3.3 \nOperation and minor maintenance of toe-puff press \nand back part moulding machine \n3.4 \nOperating toe-puff press and back part moulding \nmachine \n3.5\nCommunicating skills\n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nToe puff press machine \n4.2 \nBack part moulding machine with hot and cold \nmouldings \n4.3 \nMaterials relevant to the activity \n4.4 \nTools appropriate for inserting toe puff and \nstiffeners into uppers \n4.5 \nWork ticket \n4.6\nWorkplace with proper lighting and ventilation\n5. Methods of \nassessment \nCompetency MUST be assessed through:  \n5.1   Direct observation/ demonstration of the candidate’s \napplication of knowledge to tasks and questioning \nrelated to underpinning knowledge   \n5.2    Portfolio\n6. Context  for \nassessment \n6.1 \nCompetency may be assessed individually in the \nworkplace or in a simulated workplace setting or in \nTESDA accredited assessment center\n",
