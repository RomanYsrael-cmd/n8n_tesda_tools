  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and\ncore units of competency required in FOOTWEAR MAKING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace information\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3 Appropriate medium is used to transfer information\nand ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6 Defined workplace procedures for the location and\nstorage of information are used\n1.7 Personal interaction is carried out clearly and\nconcisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3 Meeting inputs are consistent with the meeting\npurpose and established protocols\n2.4 Workplace interactions are conducted in a\ncourteous manner\n2.5 Questions about simple routine workplace\nprocedures & maters concerning working conditions\nof employment are asked and responded to\n2.6 Meetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1 Range of forms relating to conditions of employment\nare completed accurately and legibly\n3.2 Workplace data is recorded on standard workplace\nforms and documents\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents\nare identified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\n\n--- PDF PAGE 6 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n4\naccording to organizational guidelines\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 7 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n5\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nknowledge and\nattitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource implications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4.\nInternet\n5. Methods of\nassessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context for\nassessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 8 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n6\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role and\nscope\n1.1. The role and objective of the team is identified\nfrom available sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team\nmembers who contribute to known team activities\nand objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based\non individual skills and competencies and\nworkplace context\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 9 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n7\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1. Work activities in a team environment with\nenterprise or specific sector\n1.2. Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of information\n2.1. Standard operating and/or other workplace\nprocedures\n2.2. Job procedures\n2.3. Machine/equipment manufacturer’s specifications\nand instructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OHS and environmental standards\n3. Workplace context\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5. Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 10 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n8\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected\nand\nused\nappropriate\nworkplace\nlanguage\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nknowledge and attitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning skills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource implications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n 4.2. Materials relevant to the proposed activity or tasks\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation\nto the work activities of the group\n5.2.\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for\nassessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n9\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued\ntowards improving the qualifications set for the\nprofession\n1.2\nIntra- and interpersonal relationships is are\nmaintained in the course of managing oneself\nbased on performance evaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3 Maintain professional\ngrowth and development\n3.1\nTrainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 12 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciation\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 13 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n11\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in\nthe course of managing oneself based on\nperformance evaluation\n1.3\nCompleted trainings and career opportunities which\nare based on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n2. Underpinning\nknowledge and\nattitudes\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender\nsensitivity\n2.5 Personal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3 Communication skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context for assessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 14 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n12\n\nUNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are clarified\nand explained based on organization procedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 15 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 16 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n14\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nSafety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health\nStandards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2.\nHazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure,\nnoise,\n2.2\nvibration, temperature, radiation\n2.3\nBiological hazards- bacteria, viruses, plants,\nparasites,\n2.4\nmites, molds, fungi, insects\n2.5\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke,\n2.6\ngasses, vapors\n2.7\nErgonomics\n2.7.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.7.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n\n--- PDF PAGE 17 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n15\n\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6 OHS personal records\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 18 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n16\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\n attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4 Resource implications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5 Methods of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6 Context for\nassessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 19 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n17\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\nAPPLY FOOTWEAR PRODUCTION PRACTICES AND\nPRINCIPLES\nUNIT CODE\nFWR744201\nUNIT DESCRIPTOR\nThis unit covers the basic knowledge, skills and attitudes\nthat individuals need to work more effectively in the\nfootwear production industry. This unit is required for all\nqualifications in footwear production.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicize terms are elaborated in the Range of Variables\n1. Apply\nknowledge\nof\nfootwear products and\nsystems\nin\nthe\nworkplace\n1.1\nParts and styles of footwear are identified,\nrecognized and followed during production.\n\n1.2\nMaterials are selected and used in accordance\nwith work order and characteristics of the materials\n\n1.3\nTools\nand\nmachines\nare\nidentified\nand\nselected/specified based on work and safety\nrequirements\nand\nmanufacturer’s\nrecommendations\n\n1.4\nQuality of work is consistently maintained at\noptimum level\n2. Demonstrate\nproductive\nwork\npractices\n2.1\nWork load is prioritized to meet job orders and\ndelivery dates\n\n2.2\nWastage of production material and time is\nminimized through consistent practice of quality\nprocedures\n\n2.3\nResponsibilities and duties are performed in a\npositive manner to promote cooperation within the\nworkplace and meet production target deliveries\n\n2.4\nProblems,\nconflicts\nor\ncontingencies\nare\nrecognized and addressed and/or referred to\nappropriate person(s)\n\n--- PDF PAGE 20 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n18\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Parts and styles of\nfootwear\n1.1 Parts of footwear are:\n1.1.1\nUpper components\n1.1.2\nLining and interlining components\n1.1.3\nBottom components\n\n1.2 Styles of footwear:\n1.2.1\nDerby\n1.2.2\nOxford\n1.2.3\nMonk\n1.2.4\nCourt shoe\n1.2.5\nTrainer\n1.2.6\nBoot\n1.2.7\nMoccasin\n1.2.8\nSlip-on\n2. Materials\n2.1 Leather\n2.2 Synthetic\n2.3 Fabric\n2.4 Reinforcement materials\n2.5 Grindery\n3. Tools and machines\n3.1 Upper making tools\n3.2 Lasting tools\n3.3 Stitching machines\n3.4 Lasting machines\n4. Appropriate person(s)\n4.1 Team leader/Supervisor\n4.2 Production manager\n4.3 Shop steward\n\n--- PDF PAGE 21 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n19\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of footwear productions,\nterminology, materials, tools and equipment\n1.2\nDemonstrated knowledge of parts and styles of\nfootwear and current design trends\n1.3\nDemonstrated ability to select/specify appropriate\ntool, equipment and materials for one or more\nproduction operations\n1.4\nDemonstrated ability to contribute to a productive\nwork environment and meet production target\n1.5\nDemonstrated ability to identify and address\nproblems at the work place\n2. Underpinning\nknowledge\n2.1\nFootwear production terminology\n2.2\nFootwear production materials\n2.3\nKey processes or operations in footwear production\n2.4\nTypes and design of footwear\n2.5\nFootwear quality standards\n2.6\nOccupational health and safety\n2.7\nBasic shop mathematics\n3. Underpinning skills\n3.1\nCommunication skills – communicating and\ninteracting with co-workers\n3.2\nOperation and setting of common footwear\nproduction materials, tools and equipment\n3.3\nLiteracy skills – reading and interpreting labels,\ndescription, work ticket and relevant workplace\ndocuments\n3.4\nNumeracy skills – estimating time, arithmetic\noperations, measurement skills\n4. Resource implication\nThe following resources MUST be provided:\n4.1\nWorkplace environment\n4.2\nWorkplace documentation, e.g., company policies,\nprocedures\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nWritten/Oral questioning\n5.2\nObservation of work activities\n5.3\nThird-party report\n5.4\nPortfolio assessment\n6. Context of assessment\n6.1\nAssessment should be conducted individually in\nthe workplace or simulated workplace environment\nand in any TESDA accredited assessment center/s\n\n--- PDF PAGE 22 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n20\n\nUNIT OF COMPETENCY\n\nCARRY OUT MEASUREMENTS & CALCULATIONS\nUNIT CODE\nFWR744203\nUNIT DESCRIPTOR\nThis unit covers the knowledge and skills required in\nobtaining accurate pattern scale area, calculating/\nestimating the materials, requirements and costs\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Obtain measurements\n\n1.1\nMeasurements are obtained according to job\ninstructions using measuring devices\n\n1.2\nSystem of measurement to be used is identified.\n\n2. Perform simple\ncalculations\n\n2.1\nSimple calculations carried out based on the\nrequirements of the situation\n2.2\nCorrectness of calculations verified based on\nproduction requirements\n\n3. Estimate approximate\nquantities\n\n3.1\nMeasurements or quantities estimated on job\nrequirements\n\n3.2\nMeasurements identified/recorded without error\n\n3.3\nQuantities of materials suitable for work undertaken\nare calculated and recorded according to job\ninstructions\n\n--- PDF PAGE 23 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n21\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Measuring device\n\n1.1\nTape measure\n1.2\nRuler\n1.3\nMeter stick\n1.4\nThickness Gauge\n1.5\nDivider\n\n2. System of\nmeasurement\n\n2.1\nEnglish system\n2.2\nMetric system\n\n3. Simple Calculations\n(Four Fundamental\nOperations)\n\n3.1\nAddition\n3.2\nSubtraction\n3.3\nMultiplication\n3.4\nDivision\n\n--- PDF PAGE 24 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n22\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated effective use of measuring devices\n1.2\nTook and recorded accurate measurements\n1.3\nPerformed simple calculations according to\nspecifications\n1.4\nEstimated required quantities of materials\n2. Underpinning\nknowledge and\nattitudes\n2.1\nDrawings and specifications\n2.2\nMaterials relevant to the construction processes\n2.3\nBasic operation in measurement and calculations\n3. Underpinning skills\n3.1\nReading and interpreting work ticket\n3.2\nMeasuring and calculating manually\n3.3\nRecording measurement\n3.4\nOperating electronic calculating devices\n3.5\nCommunicating effectively\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation of work activities related to\npattern scaling and estimating costs relevant to\nfootwear construction /manufacturing.\n6. Context for\nassessment\n6.1\nCompetency assessment may occur in workplace\nor any appropriately simulated environment and in\nany TESDA accredited assessment center/s\n\n--- PDF PAGE 25 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n23\n\nUNIT OF COMPETENCY USE AND CARE FOR HAND AND POWER TOOLS\nUNIT CODE\nFWR744204\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes\nrequired in using/handling and maintaining of hand and\npower tools\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select appropriate\ntools for work\n1.1.\nWork requirements are interpreted in accordance\nwith the instructions of the supervising engineer\n\n1.2.\nAppropriate hand and power tools are selected\nfor the tasks required\n\n1.3.\nSelected hand and power tools are checked for\ntheir serviceability\n\n1.4.\nDefective tools are identified and reported and\nappropriate action is taken for their repair or\nreplacement in accordance with established\nprocedures\n\n1.5.\nInstruction for the use of the tools are accessed\nand interpreted if required\n2. Use hand and power\ntools\n2.1.\nWork area, work pieces and tools are prepared for\nthe required tasks in accordance with engineer’s\ninstructions and established practice\n\n2.2.\nOther personnel in the work area are made aware\nof the work being carried out as required by safety\nmanagement procedures\n\n2.3.\nWhere relevant, work is marked out using\nappropriate marking out tools in accordance with\nestablished procedures\n\n2.4.\nHand and power tools are used for the tasks as\ndirected and in accordance with established\nprocedures and manufacturer’s instructions\n\n2.5.\nDesired outcomes for the work are achieved to job\nspecifications, including finish, tension, size,\nshape etc. as required\n\n--- PDF PAGE 26 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n24\n3. Follow safety and\nhazard control\nprocedures\n3.1.\nAll required safety precautions, procedures and\nregulations are followed when using hand and\npower tools\n\n3.2.\nOperational hazards are identified when using\nhand and power tools and action is taken in\nconjunction with others to minimize or eliminate\nrisk to self, other personnel, the vessel and the\nenvironment\n4. Care for hand and\npower tools\n4.1.\nTools are used only for their intended purposes in\naccordance with manufacturer’s instructions and\nestablished procedures\n\n4.2.\nCare of tools are properly done in accordance\nwith manufacturer’s instruction and established\nprocedures\n\n4.3.\nTools are adjusted, tightened and or lubricated in\naccordance with manufacturer’s instructions and\nestablished procedures\n\n4.4.\nGrinding wheels are dressed and made true in\naccordance with manufacturer’s instructions and\nestablished procedures\n\n4.5.\nDefective or worn tools and tool components are\nidentified, marked as required and reported and\nappropriate action is taken for the repair or\nreplacement in accordance with established\nprocedures\n\n--- PDF PAGE 27 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n25\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\n1.1 Maintenance:\n1.1.1\nSpanner\n1.1.2\nScrew drivers (Philips)\n1.1.3\nAllen keys\n1.1.4\nPlier\n1.1.5\nNylon hammer\n1.1.6\nDressing tool\n1.2 Production\n1.2.1\nSnips\n1.2.2\nScissors\n1.2.3\nPincers\n1.2.4\nFiles/rasp\n1.2.5\nFolding hammer\n1.2.6\nTack remover\n2. Power tools:\n2.1 Puncher\n2.2 Spreader\n2.3 Beta\n2.4 Cutting/clicking knife\n3. Operational hazards\nwhen using and\ncaring for hand and\npower tools include\n3.1 Sharp blades\n3.2 Moving and rotating blades and equipment\n3.3 Sparks in areas where flammable and explosive\nsubstances are stored\n3.4 Using tools beyond safe working limits\n3.5 Poor housekeeping procedures\n3.6 Non-compliance with safe working procedures\n4. Care of tools includes\n4.1 Cleaning\n4.2 Sharpening\n4.3 Storing\n4.4 Using tools in accordance with manufacturer’s\ninstruction and established procedures\n4.5 Using tools only for their intended purpose\n\n--- PDF PAGE 28 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n26\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate :\n1.1. Selected appropriate hand and power tools to\ncomplete assigned tasks\n1.2. Used hand and power tools in accordance with\nestablished procedures and manufacturer’s\ninstructions\n1.3. Cared for hand and power tools in accordance with\nestablished procedures and manufacturer’s\ninstructions\n1.4. Ensure the exercise of all required safety,\nenvironmental and hazard control precautions and\nprocedures when using hand and power tools in\naccordance to complete assigned tasks\n1.5. Take appropriate action if a hand or power tools is\nfound to be defective or worn.\n2. Underpinning\nknowledge\n\n2.1. Knowledge on the types, names and identifying\nfeatures of various hand and power tools required\nfor work tasks that may be carried out by ratings\n2.2. Ability to read and interpret work specifications and\ndrawings\n2.3. Ability to mark out work to specifications and to\nmeasure and check the quality of finished work\nincluding the correct use of hand and power tools\n3. Underpinning skills\n\n3.1. Observing procedures for the use and care of hand\nor power tools required for work tasks\n3.2. Environmental protection measures when carrying\nout basic production tasks\n4. Resource implications\n\nThe following resources MUST be provided :\n4.1. Workplace\n4.2. Tools and equipment appropriate in maintaining\nhousekeeping activities\n4.3.\nMaterials relevant to the proposed activity and tasks\n5. Method\nof\nassessment\n\nCompetency MUST be assessed through:\n5.1. Direct observation and application to tasks and\nquestions related to underpinning knowledge\n5.2. Under general guidance, checking various stages of\nthe process and at the completion of the activity\nagainst performance criteria and specifications\nWhile task are being undertaken\n6. Context\nfor\nassessment\n6.1. Competency may be assessed individually in the\nworkplace or in simulated workplace environment\nand in any TESDA accredited assessment center/s\n\n--- PDF PAGE 29 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n27\n\nUNIT OF COMPETENCY\nSET UP AND OPERATE MACHINE/S\nUNIT CODE\nFWR744205\nUNIT DESCRIPTOR\nThis unit covers the knowledge and skills required to set\nup, operate and sample run machines for footwear\nmanufacturing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Set up / prepare\nmachines\n\n1.1\nProduct specifications are interpreted in relation to\nmachine setting requirements\n\n1.2\nType of machines to be set up are identified in\naccordance with the job requirement\n\n1.3\nMachines for footwear manufacturing are set in\naccordance with product specifications, machine\nmanufacturer’s instructions and company\nprocedures\n\n2. Conduct sample run\n\n2.1\nMaterials to be used for sampling is obtained\n\n2.2\nMachine is operated in accordance with\nmanufacturer’s and company instructions to\nproduce a specified sample\n\n3. Test machine output\n\n3.1\nMachine outputs are tested or organized in\naccordance with company procedures to ensure\nrequired standards of quality are met\n\n4. Re-adjust machine\nsetting to meet\nrequirements\n\n4.1\nTest results are interpreted to determine machine\nadjustment requirements\n\n4.2\n Adjustment changes are assessed in accordance\nwith product and machine specifications\n\n4.3\n Appropriate production personnel are informed of\nthe availability of the newly set up machine in\naccordance with workplace procedures\n\n5. Maintain records\n\n5.1\nRecords are maintained and reports prepared in\naccordance with the company procedures\n\n--- PDF PAGE 30 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n28\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Machines for footwear\nmanufacturing\n\n1.1\nSewing machines (flatbed, post-bed, cylinder arm,\nzigzag, etc.)\n1.2\nLasting machines (toe lasting machine, seat and\nside lasting machine, mulling machine, chiller, heat\nsetting machine, sole attaching machine, etc.)\n1.3\nFinishing machine (buffing machine, etc.)\n\n2. Machine output\n\n2.1\nProduct sample\n2.2\nService samples\n2.3\nMachine operation\n\n3. Machine adjustments\n\n3.1\nAir Pressure\n3.2\nTemperature\n3.3\nSpeed\n3.4\nTime delay\n3.5\nMotor and Needle timing (for sewing machines)\n\n--- PDF PAGE 31 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n29\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted product specifications in relation to\nmachine setting requirements\n1.2\nObtained appropriate materials to be used for\nsample or test run\n1.3\nOperated machines with ease and confidence\n1.4\nTested or organized sample run to ensure quality\nstandards are met\n1.5\nInterpreted test results\n1.6\nAssessed adjustment changes\n1.7\nMaintained records and prepared reports\n2. Underpinning\nknowledge\n2.1\nSetting up and adjustment requirements for the\nrange of machines and equipment used in the\ncompany\n2.2\nQuality requirements\n2.3\nMachine manufacturer’s specifications\n2.4\nSafety and environmental aspects of relevant\ncompany activities\n2.5\nWorkplace procedures and reporting processes\n2.6\nRelevant OH&S legislation and codes of practice\n3. Underpinning skills\n3.1\nSetting and operating footwear manufacturing\nmachines\n3.2\nTesting and analyzing samples for test run\n3.3\nApplying all relevant safety practices when working\nin the industry\n3.4\nCommunicating effectively with individuals, work\ngroups and supervisors\n3.5\nMaintaining records and document and transfer\ninformation\n3.6\nInterpreting and carrying out established procedures\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation of work activities related to\nfootwear construction and manufacturing processes.\n6. Context of assessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment and in any\nTESDA accredited assessment center/s\n\n--- PDF PAGE 32 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n30\n\nUNIT OF COMPETENCY\nPERFORM BASIC MAINTENANCE\nUNIT CODE\nFWR744206\nUNIT DESCRIPTOR\nThis unit covers the knowledge and skills requires in\nperforming minor maintenance of the machines and\nequipment for footwear manufacturing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Perform machine\nadjustments\n\n1.1\nMachine adjustments are done in accordance with\nmanufacturer’s and enterprise requirements\n\n1.2\nProblem with machine is identified and reported in\naccordance with company procedures\n\n2. Clean and operate\nmachine\n\n2.1\nMachine is cleaned and lubricated in accordance\nwith workplace requirements and manufacturer’s\ncleaning and lubricating instructions\n\n2.2\nMachine operation is monitored to ensure correct\nprocedures are carried out and work meets quality\nstandards\n\n3. Check machine\noperation\n\n3.1\nMachine is checked to ensure correct operation\n\n3.2\nProblems encountered and similar observations are\ndocumented and referred to supervisor or\nappropriate personnel\n\n--- PDF PAGE 33 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n31\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Machine adjustments\n\n1.1\nAir Pressure\n1.2\nTemperature\n1.3\nSpeed\n1.4\nTime delay\n1.5\nMotor and Needle timing (for sewing machines)\n\n2. Problem with machines\n2.1\nMinor Faults:\n2.1.1\nMachine control\n2.1.2\nBroken parts (needles, belts, screws, etc.)\n\n2.2\nMajor Faults:\n2.2.1 Broken body parts (motors, circuit boards,\nvalves, pipes, etc.)\n2.2.2 Defective power supply\n2.2.3 Unavailability of replacements\n\n--- PDF PAGE 34 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n32\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nStarted and stopped machine\n1.2\nMonitored machine operations\n1.3\nIdentified and reported machine problems\n1.4\nIdentified and corrected minor machine and\nassociated equipment/tools faults\n1.5\nIdentified and documented major machine or\nproduct faults\n1.6\nRecorded and documented machine maintenance\n1.7\nCleaned and lubricated machine\n2. Underpinning\nknowledge\n2.1\nProcedures and guidelines for safe operation of\nmachines\n2.2\nTypical fault conditions and related fault finding\nprocedures\n2.3\nBasic machine maintenance and repair techniques\n2.4\nSafety policies and procedures\n2.5\nQuality standard procedures\n2.6\nWorkplace recording and reporting procedures\n3. Underpinning skills\n3.1\nAssessing operating performance of machine\n3.2\nStarting and stopping machines according to\nspecifications\n3.3\nMonitoring machine operations\n3.4\nRecognizing fault conditions\n3.5\nRectifying minor machine faults or problems\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation of work activities related to\nfootwear constructions and manufacturing\nprocesses.\n6. Context for\nassessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment and in any\nTESDA accredited assessment center/s\n\n--- PDF PAGE 35 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n33\n\nUNIT OF COMPETENCY\nAPPLY QUALITY STANDARDS\nUNIT CODE\nFWR744208\nUNIT DESCRIPTOR\nThis unit covers the knowledge and skills required in\napplying quality standards to work operations in the\nindustry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess own work\n1.1\nCompleted work is checked against workplace\nstandards relevant to the operations being\nundertaken\n\n1.2\nAn understanding is demonstrated on how the work\nactivities and completed work relate to the next\nproduction process and to the final appearance of\nthe product\n\n1.3\nFaulty pieces or final products are identified and\nisolated in accordance with company policies and\nprocedures\n\n1.4\nFaults and any identified causes are recorded and\nreported in accordance with workplace procedures\n2. Assess quality of\nreceived component\nparts\n2.1\nReceived materials, component parts or final\nproduct are quality checked against workplace\nstandards and specifications\n\n2.2\nCauses of any identified faults are identified and\ncorrective actions are taken in accordance with\nworkplace procedures\n3. Record information\n3.1\nBasic information on the quality of received\ncomponents are recorded in accordance with\nworkplace procedures\n4. Study causes of quality\ndeviations\n4.1 Causes of deviations from final products are\ninvestigated and reported in accordance with\nworkplace procedures\n\n4.2 Suitable preventive action is recommended based on\nworkplace quality standards and identified causes of\ndeviation from specified quality standards of materials\nor final product\n\n4.3 Quality parameters of work are achieved.\n\n--- PDF PAGE 36 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n34\n\nRANGE OF VARIABLES\n\nVARIABLES\n\nRANGE\n\n1. Quality check\n\n1.1\nVisual inspection\n1.2\nPhysical measurements\n1.3\nCheck against patterns\n\n2. Quality standards\nrelated to:\n\n2.1\nMaterials\n2.2\nComponent parts\n2.3\nFinal product\n2.4\nProduction processes\n\n3. Quality parameters\n\n3.1\nFinish\n3.2\nFit\n3.3\nSize\n3.4\nDurability\n3.5\nProduct variations\n3.6\nMaterials\n3.7\nAlignment\n3.8\nColor\n3.9\nFree from damage and imperfections\n\n--- PDF PAGE 37 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n35\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked completed work continuously against\nworkplace standard\n1.2\nIdentified and isolated faulty pieces or final product\n1.3\nChecked received materials, component parts or\nfinal product against workplace standards\n1.4\nIdentified and applied corrective actions on the\ncauses of identified faults\n1.5\nMeasured materials, component parts or products\n1.6\nRecorded basic information regarding quality\nperformance\n1.7\nInvestigated causes of deviations of materials\nagainst standard\n1.8\nRecommended suitable preventive actions\n2. Underpinning\nknowledge\n2.1\nRelevant quality standards, policies and\nprocedures\n2.2\nCharacteristics of materials used\n2.3\nSafety environment aspects of production\nprocesses\n2.4\nRelevant measurement techniques and quality\nchecking procedures\n2.5\nWorkplace procedures\n2.6\nReporting procedures\n3. Underpinning skills\n3.1\nInterpreting work instructions, specifications,\nstandards and patterns appropriate to the\nassessee’s work\n3.2\nCarrying out relevant visual inspections of\nmaterials, component parts and final products\n3.3\nCarrying out relevant physical measurements\n3.4\nMaintaining accurate work records in accordance\nwith procedures\n3.5\nMeeting work specifications\n3.6\nCommunicating effectively within defined\nworkplace procedures\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation of work activities related to\nfootwear construction /manufacturing processes.\n6. Context for\nassessment\n6.1\nCompetency assessment may occur in workplace\nor any appropriately simulated environment and in\nany TESDA accredited assessment center/s\n\n--- PDF PAGE 38 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n36\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nCHECK CUT UPPER and LINING COMPONENTS\nUNIT CODE:\nFWR744312\nUNIT DESCRIPTOR:\nThis unit cover the knowledge, skills and attitude required\nin checking cut upper component. The qualities of cut\nupper components are in accordance with the standard\nset by the company.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect received cut\nupper and lining\ncomponents\n1.1\nQuality and quantity of received cut upper and\nlining components are assessed based on job\nspecifications.\n\n1.2\nComponents are checked for tightness and stretch\nfrom heel to toe as per standard operating\nprocedures.\n\n1.3\nQuality of cut components is checked according to\nuniformity of shades, substance and type of\nmaterials.\n\n1.4\nEnsured that cut upper and lining components are\nfree from major defects\n2. Segregate cut upper\nand lining components\n2.1\nCut upper and lining components are classified\naccording to sizes, uniformity of shades, substance\nand grain variations\n\n2.2\nCut upper and lining components are paired\naccording to shape and size\n\n2.3\nDefective cut upper and lining components are\nidentified, returned/replaced and reported in\naccordance with company procedures\n3. Bundle cut upper and\nlining components\n3.1\nCut upper and lining components are piled and\nstacked according to sizes and pairs.\n\n3.2\nStacked cut upper and lining components are\nbundled and recorded in accordance with company\nprocedures\n\n3.3\nProduction report sheets are prepared , recorded\nand submitted as per company procedures\n\n--- PDF PAGE 39 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n37\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Upper and lining\ncomponents\n1.1 Vamp\n1.2 Toe cap\n1.3 Wing cap\n1.4 Quarters\n1.5 Counter\n1.6 Tongue\n1.7 Back strap\n1.8 Eyelet Facing/Eye stay\n1.9 Straps\n1.10 Collar\n1.11 Heel cover\n1.12 Vamp lining\n1.13 Quarter lining\n1.14 Heel grip\n1.15 Sock lining\n2. Quality\n2.1\nFinish\n2.2\nColor\n2.3\nSize\n2.4\nMaterial\n2.5\nAlignment\n3. Major defects present\nin cut components\n3.1 Leather:\n3.1.1\nvein marks\n3.1.2\ntick marks\n3.1.3\nlooseness\n3.1.4\nflay cuts\n3.1.5\nscratches\n3.1.6\nputrefaction\n3.1.7\nwobble fly\n3.1.8\nbarb wire marks\n3.1.9\nsalt burns\n3.1.10 ammonia burns\n3.1.11 discoloration\n3.1.12 brand marks\n3.1.13 heavy hair follicles\n3.1.14 heavy grain\n3.1.15 growth marks\n\n3.2 Man-made materials\n3.2.1\nScratches\n3.2.2\nStains\n3.2.3\nHole\n\n--- PDF PAGE 40 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n38\n\n4. Sizes\n4.1 French:\n4.1.1\nMen’s size: 39 – 44\n4.1.2\nLadies’ size: 35 – 39\n4.1.3\nChildren’s size : 21 – 38\n4.2 American\n4.2.1\nMen’s size: 5 - 12\n4.2.2\nLadies’ size: 4 -9\n4.2.3\nChildren’s size : 11 - 6\n\n--- PDF PAGE 41 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n39\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Assessed / checked the quality of received\ncomponents\n1.2 Identified, segregated and reported defective\ncomponents\n1.3 Bundled cut upper and lining components\n1.4 Recorded information on production report sheet\n1.5 Interpreted and followed instructions from work ticket\n2. Underpinning\nknowledge and attitude\n2.1 Safe work practices\n2.2 Basic product knowledge\n2.3 Sizing components\n2.4 Types and characteristics of leather and man-made\ncomponents\n2.5 Footwear terms\n2.6 Positive work values (Quality, cost and safety\nconsciousness, attention to details, patience,\nperseverance, etc.)\n3. Underpinning skills\n3.1 Assessing leather quality and recognizing leather\ndefects and variations in grain and color\n3.2 Communicating and interacting skills\n3.3 Interpreting work ticket\n3.4 Determining direction of stretch and tightness of\nmaterials\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Workplace with proper lighting and ventilation\n4.2 Work ticket\n4.3 Materials relevant to the activity\n5. Methods of\nassessment\n5.1 Competency must be assessed through direct\nobservation\n/\ndemonstration\nof\ncandidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulated environment or in\nTESDA accredited assessment center\n\n--- PDF PAGE 42 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n40\n\nUNIT OF COMPETENCY:\nPERFORM BLOCKING/CRIMPING OPERATION\nUNIT CODE:\nFWR744313\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude\nrequired in performing blocking/crimping operation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare upper for\nblocking\n1.1\nVamps are prepared in accordance with styles and\ndesigns.\n\n1.2\nChalk powder is placed on the grain side of leather\nas per standard work procedures.\n\n1.3\nEnsured that prepared vamps are free from excess\nwater.\n2. Set up machine\n2.1\nMachine is set and adjusted according to\nmanufacturer's manual.\n\n2.2\nBlade is selected and placed in the machine in\naccordance with shoe style or design.\n\n2.3\nBlocking plates are set according to required\nposition.\n3. Perform blocking\n3.1\nBlocking is performed in accordance with standard\noperating procedures.\n\n3.2\nBlocked vamps are inspected and segregated in\naccordance with company standard/design/style.\n\n3.3\nDamaged vamps are identified, reported and\nadjusted based on procedure\n4. Perform trimming of\nvamps\n4.1\nTrimmed vamps are paired in accordance with\nshape and shades of materials.\n\n4.2\nVamps are trimmed as per standard operating\nprocedures.\n\n--- PDF PAGE 43 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n41\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Preparation of vamps\n1.1\nLaid face-to-face\n1.2\nMatched to its pair\n1.3\nEdges are leveled\n1.4\nPerformed stitched markings\n2. Blade\n2.1\nComponents\n2.1.1 Apron\n2.1.2 Tongue\n2.1.3 Plug\n2.1.4 Full vamp\n2.2\nDesign/Pattern\n2.2.1 Whole cut\n2.2.2 ¾ cut\n2.2.3 Bellows tongue\n2.3.1 Last\n3. Damaged vamps\n3.1\nCreases\n3.2\nGrain crack\n3.3\nLoose grain\n3.4\nBurned vamps\n3.5\nRipped vamps\n\n--- PDF PAGE 44 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n42\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared upper for blocking\n1.2\nSet up blocking machine\n1.3\nPerformed blocking\n1.4\nPerformed trimming of vamps\n1.5\nApplied quality in work areas\n2. Underpinning\nknowledge and attitude\n2.1\nParts and functions of blocking machine\n2.2\nDifferent leather types and finishes\n2.3\nFamiliarity with the types of upper and lining\ncomponents\n2.4\n5S\n2.5\nPositive work values (patience, cost, quality and\nsafety consciousness, etc.)\n3. Underpinning skills\n3.1\nSetting up and operating blocking machines\n3.2\nInterpreting design and details specified by the\nshoe design\n3.3\nInterpreting work ticket\n3.4\nInterpreting\ncompanies\nquality\nstandards\nprocedures\n3.5\nCommunicating and interacting skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\n Workplace with proper lighting and ventilation\n4.2\n Work ticket\n4.3\n Blocking machine\n4.4\n Vamps to be blocked\n4.5\n Air supply\n4.6\n Chalk powder\n4.7\n Blocked vamp pattern\n4.8\n Water\n4.9\n Flat bowl\n4.10 Blocking blades\n4.11 Knife\n4.12 Grinding stone\n4.13\nCutting board\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation/ demonstration of candidate’s\nperformance\nof\nknowledge\nto\ntasks\nand\nquestioning related to underpinning knowledge\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or in a simulated environment or\nin TESDA accredited assessment center\n\n--- PDF PAGE 45 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n43\n\nUNIT OF COMPETENCY:\nPERFORM SKIVING OPERATION\nUNIT CODE:\nFWR744314\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nin operating single step cylinder knife skiving machine\nand determining the quality of skived upper parts.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform machine\nsetting procedures\n1.1\nMachine adjustments are made in accordance\nwith skiving specifications and safety\nprocedures.\n\n1.2\nCylinder knife is sharpened in accordance with\nmanufacturer’s procedural manual.\n\n1.3\nMachine is tested in accordance with\nmanufacturer’s requirements / procedures.\n2. Position work pieces\non the bench top\n\n2.1\nWork pieces are stacked according to skiving\nrequirements.\n\n2.2\nWork pieces are positioned according to the flow of\noperation.\n3. Skive components\n3.1\nSkiving is performed in accordance with safety\nrequirements and job specifications.\n\n3.2\nSkiving is performed using appropriate tools and\nequipment and personal protective equipment\n(PPE).\n4. Segregate and bundle\nupper components\n\n4.1\nUpper components are segregated in accordance\nwith company policies and procedures.\n\n4.2\nUpper components are bundled and labeled in\naccordance with company policies and procedures.\n5. Perform machine\nmaintenance\n5.1\nMachine and its accessories and tools are cleaned\nin accordance with manufacturer's requirements.\n\n5.2\nWaste materials are disposed of in accordance\nwith housekeeping practices.\n\n5.3\nMachines are lubricated / oiled in accordance with\nmanufacturer’s recommendations\n\n--- PDF PAGE 46 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n44\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Machine Adjustment\n1.1\nWidth Guide\n1.2\nPressure Foot\n1.3\nHeight Adjustment\n2. Skiving Specifications\n2.1\nFold Skive\n2.2\nUnderlay Skive\n2.3\nRaw edge Skive\n2.3.1 Open Raw\n2.3.2 Close Raw\n2.4\nSplitting\n3. Safety Requirements\n3.1\nCompliance with safety hazards and measures\nwhile working\n3.2\nSafety in machine setting and maintenance\n4. Tools\n4.1\nDressing tool\n4.2\nShears/scissors/cutters\n4.3\nLeather substance gauge\n4.4\nCleaning brush\n5. PPE\n5.1\nApron\n5.2\nMask\n\n--- PDF PAGE 47 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n45\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAdjusted the machine\n1.2\nPerformed skiving operations:\n 1.2.1 Folding\n 1.2.2 Underlay\n 1.2.3 Raw edges\n1.3\nPerformed basic machine preventive maintenance\n1.4\nInterpreted and followed work ticket instructions\n1.5\nOrganized work pieces and cleaned work area\n2. Underpinning\nknowledge and attitude\n2.1\nSafe work practices\n2.2\nMachine’s parts and function and adjustment\n2.3\nTools\n2.4\nTypes of pressure foot and feed rollers\n2.5\nTypes of skives\n2.6\nFamiliarity with upper and lining components parts\n2.7\nQuality standards\n2.8\nMaintenance\n2.9\nPositive work values (being organize, cost, quality\nand safety consciousness, patience, etc.)\n3. Underpinning skills\n3.1\nAdjusting and setting procedures\n3.2\nMeasuring thickness of leather using thickness\ngauge and ruler\n3.3\nCommunicating and interacting skills\n3.4\nInterpreting work ticket\n4. Resource implications\nThe following resources MUST be provided\n4.1\nSingle-step cylinder skiving machine\n4.2\nWorkplace with proper lighting and ventilation\n4.3\nWork ticket\n4.4\nMaterials relevant to the proposed activity\n4.5\nTools and equipment appropriate for measuring\nleather\n5. Method of assessment\nCompetency MUST be assessed through:\n5.1\nDirect observation/demonstration of the candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 48 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n46\n\nUNIT OF COMPETENCY:\nPERFORM UPPER LEATHER SPLITTING\nOPERATION\nUNIT CODE:\nFWR744315\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nin reducing leather substance using machine with a\ncontrolled endless revolving blade. This operation is\nmainly directed at reducing heel covers, platform and\nwedge covers. It can also be used to reduce insole\nbinding and the weight of complete shoe uppers.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the range of variables\n1 Perform machine\nsetting procedures\n1.1 Machine adjustments are made in accordance\nwith splitting specifications and safety procedures.\n\n1.2 Band knife is sharpened and repositioned in\naccordance with manufacturers procedural manual.\n\n1.3 Machine is tested in accordance with\nmanufacturer’s requirements / procedures.\n2. Position work pieces\non the bench top\n2.1 Work pieces are stacked according to splitting\nrequirements.\n\n2.2 Work pieces and tools are positioned according to\nthe flow of operation.\n3. Perform splitting\noperations\n3.1 Splitting is done uniformly in accordance with work\nticket and safety requirements.\n\n3.2 Splitting is performed without damage to grain\nsurface.\n4. Segregate and bundle\nupper components\n4.1 Upper components are segregated according to\nsize and parts.\n\n4.2 Upper components are piled up in pairs according\nto sizes and parts and then bundled.\n\n--- PDF PAGE 49 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n47\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Work pieces\n1.1\nInsole\n1.2\nOutsole\n1.3\nShoe lace/string\n1.4\nStraps\n1.5\nBelts\n2. Machine adjustments\n2.1\nTension\n2.2\nThickness\n2.3\nSize\n3. Tools\n3.1\nShears/scissors/cutters\n3.2\nLeather substance gauge\n3.3\nCleaning brush\n\n--- PDF PAGE 50 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n48\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSet the splitting machine\n1.2\nPositioned work pieces\n1.3\nSplit components uniformly\n1.4\nSegregated and bundled upper components\n1.5\nInterpreted and followed the work instructions\naccurately\n2. Underpinning\nknowledge and attitude\n2.1\nSafe work practices\n2.2\nMachine’s parts and function and adjustments\n2.3\nTools\n2.4\nFamiliarity with upper and lining component parts\n2.5\nQuality standards\n2.6\nMaintenance\n2.7\nPositive work values (being organize, cost, quality\nand safety consciousness, patience, attention to\ndetails, etc.)\n2.8\n5S\n3. Underpinning skills\n3.1\nAdjusting and setting procedures\n3.2\nMeasuring thickness of leather using thickness\ngauge and ruler\n3.3\nCommunicating and interacting skills\n3.4\nInterpreting work ticket\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nSplitting machine\n4.2\nWorkplace with proper lighting and ventilation\n4.3\nWork ticket\n4.4\nMaterials relevant to the proposed activity\n4.5\nTools and equipment appropriate for measuring\nleather substance\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect\nobservation/\ndemonstration\nof\nthe\ncandidate’s application of knowledge to tasks and\nquestioning related to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 51 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n49\n\nUNIT OF COMPETENCY:\nPERFORM MACHINE PERFORATION AND GIMPING\nOPERATIONS\nUNIT CODE:\nFWR744316\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nin operating and maintaining perforating machine and\nchecking quality of perforated or gimped upper\ncomponents\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform machine\nsetting adjustments\n1.1\nMachine is set up as per standard operating\nprocedures and work ticket.\n\n1.2\nMachine operation is tested in accordance with\nmanufacturer's manual.\n\n1.3\nSafety precautions are followed in accordance with\nOH& S requirements.\n2. Place work pieces on\nbench top\n2.1\nWork pieces are stacked according to standard\noperating procedures\n\n2.2\nWork pieces are positioned according to procedure\n3. Perform perforating\noperation\n\n3.1\nPunching is performed without damage to the\ncomponent as per work quality standard.\n\n3.2\nPunched holes size are in accordance with\nspecifications.\n4. Perform gimping\noperation\n4.1\nTask is completed within 30 seconds depending on\nshoe design.\n\n4.2\nGimped edge is cut as per work specification (5mm\nor depending on the allowance provided on the\nupper component).\n\n4.3\nGuide markings between the gimps are visibly\ndone as per standard procedures.\n\n4.4\nGimp crossover cut are done at the cut-off edge as\nper standard procedures\n5. Segregate and bundle\nupper components\n5.1\nUpper components are segregated according to\nsize and parts\n\n5.2\nUpper components are piled up in pairs according\nto sizes and parts and then bundled.\n6. Perform machine\nmaintenance\n6.1\nMachine is cleaned and oiled according to safety\nstandards and manufacturer's manual\n\n6.2\nNylon plate and reduction block are rotated as per\nmanufacturer's manual\n\n--- PDF PAGE 52 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n50\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Machine set-up\n1.1\nPressure\n1.2\nSpacing\n1.3\nAngle of tube\n2. Specifications\n2.1\nSize\n2.2\nDistance\n2.3\nAlignment\n2.4\nComplete penetration of punch\n3. Punched holes\n3.1\nDiamond\n3.2\nTriangle\n3.3\nOblong\n3.4\nDrop\n3.5\nRound\n3.6\nGimp\n3.7\nFan\n\n--- PDF PAGE 53 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n51\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSet up perforating machine\n1.2\nPerformed perforating and/or gimping operation\n1.3\nMaintained perforating machine in good working\ncondition\n2. Underpinning\nknowledge and attitude\n2.1\nPerforating and gimping operations\n2.2\nTubes and dies used in perforating machine\n2.3\nPerforating machine parts and functions\n2.4\nGimping machine parts and functions\n2.5\nProcedures in replacing tubes and dies\n2.6\nMachine adjustments procedures\n2.7\nGuide adjustments\n2.8\nQuality of punching and gimping\n2.9\nMaintenance Procedures\n2.10 Positive work values (being orderly and organize,\ncost and quality consciousness, attention to details,\npatience, etc.)\n3. Underpinning skills\n3.1\nSelecting type of tube or die based on the\nspecifications on the shoe design and work ticket\n3.2\nOperating perforating and gimping machines\n3.3\nInterpreting work ticket\n3.4\nCommunicating and interacting skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nPerforating machine\n4.4\nTubes and dies\n4.5\nUpper components\n4.6\nMaintenance tools\n5. Methods of\nassessment\n5.1\nCompetency must be assessed through direct\nobservation/\ndemonstration\nof\ncandidate’s\nperformance\nof\nknowledge\nto\ntasks\nand\nquestioning related to underpinning knowledge\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 54 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n52\n\nUNIT OF COMPETENCY:\nPERFORM FOLDING OPERATIONS\nUNIT CODE:\nFWR744317\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitude required in\nfolding upper materials prior to stitching or attaching\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n1. Attach reinforcement\nmaterial\n1.1\nReinforcement material is attached on the edge\nof the upper components according to required\nallowances.\n\n1.2\nDimensions of prepared reinforcement material are\nin accordance with work ticket specifications.\n\n1.3\nOverlapping of the reinforcement materials ends is\naligned as per standard operating procedures.\n2. Apply adhesive on the\nedge to be folded\n2.1\nAdhesive is applied to components in accordance\nwith work ticket specifications.\n\n2.2\nApplication tools are cleaned and stored\naccording to company requirements and practices.\n\n2.3\nMask is worn in accordance with company safety\nrequirements.\n3. Cut nicks on concave\nedges\n3.1\nNicks are slanted with lengths not exceeding half\nthe width of fold.\n\n3.2\nDistances between nicks are equally distributed in\naccordance with shoe design.\n4. Perform folding\noperation\n4.1\nFolding method is selected in accordance with\nwork ticket.\n\n4.2\nFolding operation is performed according to\nquality company standard.\n\n4.3\nFolding tools are used in accordance with safety\nprocedures.\n\n--- PDF PAGE 55 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n53\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Reinforcement material\n1.1\nSelf-adhesive\n1.1.1 Nylon tape\n1.1.2 Woven tape\n1.2\nNon-adhesive\n1.2.1 Cotton tape\n1.2.2 Drill cloth strip\n1.3\nString for thermo folding machine\n2. Allowance for\nreinforcement material\n2.1\nDistance from the edge = 4-5 mm\n2.2\nWidth from the edge = 3-4 mm\n2.3\nOverlapping = 10 mm\n3. Adhesive\n3.1\nLatex\n3.2\nDouble-sided adhesive tape\n3.3\nHot melt\n3.3.1 Chips\n3.3.2 Block\n3.4\nRubber solution\n3.4.1 water-based\n3.4.2 solvent-based\n4. Application tools\n4.1\nFlat Brushes\n4.2\nRound Brushes\n5. Folding tools\n5.1\nScissors\n5.2\nNylon Board or Marble\n5.3\nAwl or Folding Knife\n5.4\nFolding hammer\n5.5\nBrush\n6. QS of Folding\nOperation\n6.1 Even and smooth\n6.2 Folding width is 4-5 mm all over the edge\n6.3 No bulges and corners on curve\n6.4 Follow the shape or contour of shoe component\nand design\n\n--- PDF PAGE 56 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n54\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttached reinforcement material\n1.2\nApplied adhesive\n1.3\nPerformed folding operations\n1.4\nCut nicks on concave edges\n1.5\nUsed correct type of adhesive for folding\n1.6\nUsed folding tools with safety\n1.7\nApplied quality in work areas\n2. Underpinning\nknowledge and attitude\n2.1\nReinforcement material\n2.2\nAdhesive\n2.3\nMaterials to be folded\n2.4\nFolding tools\n2.5\nSnipping and tucking procedures\n2.6\nInterpreting and converting Metric to English\nSystem and vice versa\n2.7\nPositive work values (Quality consciousness,\npatience, attention to work details, orderliness, etc.)\n3. Underpinning skills\n3.1\nInterpreting design and details\n3.2\nInterpreting work ticket\n3.3\nCommunicating and interacting skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nFolding tools\n4.4\nMaterials to be folded\n4.5\nReinforcement materials\n4.6\nAdhesive\n4.7\nUpper sample or specification chart\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect\nobservation/\ndemonstration\nof\nthe\ncandidate’s performance of knowledge to task sand\nquestioning related to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nTESDA accredited assessment center.\n\n--- PDF PAGE 57 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n55\n\nUNIT OF COMPETENCY:\nPERFORM STITCHING OPERATION ON UPPER\nAND/OR LINING COMPONENTS\nUNIT CODE:\nFWR744318\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nto operate stitching machines and determine the stitching\nparameters and quality of stitched uppers and/or lining\ncomponents\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare work pieces\n1.1\nWork bundle is received and checked in\naccordance with the work ticket\n\n1.2\nWork pieces are organized according to standard\noperating procedure\n\n1.3\nWork pieces are laid out in correct sequence in\naccordance with standard operating procedure\n\n1.4\nComponents are attached according to work\nspecification using appropriate attaching materials\n2. Prepare machine for\nstitching\n\n2.1\nStitching machine is set-up and adjusted in\naccordance with the workplace requirements and\nspecifications on the work ticket\n\n2.2\nNeedle system, size and point are identified in\naccordance with the material and machine being\nused\n\n2.3\nThread size, type and color are chosen in\naccordance with the needle and material\nrequirements\n\n2.4\nMachine’s stitch regulator is set-up and adjusted in\naccordance with job work specification\n\n2.5\nHook timing is set in accordance with stitch\nformation when required\n\n--- PDF PAGE 58 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n56\n\n3. Stitch upper and/or\nlining components\n3.1\nTask is completed within specified time frame\naccording to the design/style of shoe, seam,\nbinding and trimmings to be done\n\n3.2\nDistance of stitches from the edge are followed in\naccordance with job specification\n\n3.3\nAllowances between double rows of stitching are\nfollowed in accordance with the design specified in\nthe work ticket\n4. Trim excess threads of\nthe stitched\ncomponents\n4.1\nTask is completed within specified time frame and\nquantity of stitched components to be trimmed\n\n4.2\nExcess threads of more than 10 mm are trimmed in\naccordance with job specification\n\n4.3\nStitched components are arranged and placed to\nthe WTM\n\n--- PDF PAGE 59 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n57\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Attaching materials for\ncomponents\n1.1 Rubber cement\n1.2 Contact cement\n1.3 Double-sided tape\n1.4Hot melt adhesive\n2. Stitching machine\n2.1\nFlat Bed\n2.1.1 Single Needle\n2.1.2 Double Needle\n2.1.3 Zigzag\n\n2.2 Post Bed\n2.2.1 Single Needle\n2.2.2 Double Needle\n\n2.3 Cylinder Arm\n\n2.4 Computerized Stitching Machines\n2.4.1 Semi-computerized\n2.4.2 Fully computerized\n\n2.5Patcher Machine\n3. Needle system, size\nand point\n3.1\nNeedle system includes: 34, 134, 134-35, 438\n\n3.2\nNeedle size\n3.2.1 Metric (40,45,50,…,480 MN) OR\n3.2.2 Singer or Simon Co. (4,5,6,…,36)\n\n3.3\nNeedle point includes:\n3.3.1 Round – R\n3.3.2 Wedge – P, PCL, PCR\n3.3.3 Cross – S\n3.3.4 Twist or Reverse twist – LR, LL\n3.3.5\nSD1, DI, D\n4. Thread size, type and\ncolor\n4.1\nThread thickness\n 10, 20, 30, 40, …, 150\n\n4.2\nThread twist\n4.2.1 Z – twist\n4.2.2 S – twist\n\n4.3\nThread types\n4.3.1 Natural (cotton, flax, jute, hemp, kapok,\nwool, hair silk)\n4.3.2 Organic (rayon, synthetic fibers –\npolyamides, polyurethane, polyvinyl, nylon)\n4.3.3\nInorganic (gold, silver, copper)\n\n--- PDF PAGE 60 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n58\n\n5. Seam\n5.1 Closed\n5.2 Lapped\n5.3 Open\n5.4 Silked or French\n5.5 Brooklyn\n5.6 Piped\n5.7 Butted\n5.8 Blind\n5.9 Cording\n5.10 Decorative\n6. Binding\n6.1 English or U-binding\n6.2 French Binding\n6.3\nItalian Binding\n7. Machine parts\n7.1 Bench top\n7.2 Head\n7.3 Arm\n7.4 Bobbin Rewinder\n7.5 Thread Stand\n7.6 Motor\n7.7 Treadle\n7.8 Tension Regulator\n7.9 Face Plate\n7.10 Throat Plate\n7.11 Feed Wheel\n7.12 Pressure Wheel\n7.13 Bobbin Case\n8. Materials\n\n8.1 Leather\n8.2 Synthetic\n8.3 Fabric\n9. Trimmings and\nfastening\n9.1 Velcro\n9.2 Elastic\n9.3 Buckle straps\n10. Time Frame\n10.1 Stitching operation = 30-60 seconds/pair\n10.2 Trimming – 10 seconds/pair\n Note: Time varies depending on the design/style to\nbe stitched and quantity of threads to be\ntrimmed\n\n--- PDF PAGE 61 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n59\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOrganized work pieces\n1.2\nAdjusted the stitching machine\n1.3\nDetermined needle and thread to be used\n1.4\nPerformed the required stitching operations\n1.5\nCleaned/organized work area\n1.6\nMaintained stitching machine working condition\n1.7\nDemonstrated correct procedures in operating at\nleast 3 out of 5 types listed in the range of\nvariables (preferably flat-bed, post-bed and cylinder\narm machine)\n2. Underpinning\nknowledge and attitude\n2.1\nMachine parts and functions\n2.2\nMachine operating procedures\n2.3\nThread and needle specifications, and thread –\nneedle relationship\n2.4\nSeam types, binding types and other stitching\noperations\n2.5\nFamiliarity with upper and lining components\n2.6\nThe sequence of operation dictated by the shoe\ndesign\n2.7\nPositive work values ( patience, attention to details,\nbeing organize, cost, quality and safety\nconsciousness)\n2.8\n5S\n2.9\nQuality Standard\n2.10 Identifying and interpreting different measurement\nunits used in the Metric and English System\n3. Underpinning skills\n3.1\nDexterity in stitching upper and lining components\n3.2\nAdjusting, operating and maintaining of machine\n3.3\nInterpreting design and details specified by the\nshoe design\n3.4\nInterpreting work ticket\n3.5\nCommunicating and interacting skills\n\n--- PDF PAGE 62 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n60\n\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace location with proper lighting\n4.2\nWork ticket\n4.3\nIndustrial sewing machine\n4.4\nMaterials to be stitched\n4.5\nStitching supplies (e.g. thread, needle)\n4.6\nTools (e.g. scissors or nippers, screwdrivers,\nprecision keys)\n4.7\nOil and cleaning agents (e.g. kerosene)\n4.8\nUpper sample or specification chart\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect\nobservation\n/\ndemonstration\nof\nthe\ncandidate’s performance of knowledge to task and\nquestion related to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center.\n\n--- PDF PAGE 63 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n61\n\nUNIT OF COMPETENCY:\nPERFORM HAND-STITCHING OPERATIONS\nUNIT CODE:\nFWR744319\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitude required in\nthe performance of hand stitching operation.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare materials\n1.1\nThread is selected in accordance with the work\nticket.\n\n1.2\nNeedles are threaded and waxed in accordance\nwith standard operating procedures.\n\n1.3\nParts and holes are checked for damage and\ndefects.\n\n1.4\nHoles for stitching are punched based on\nstandard operating procedures and work ticket.\n2. Perform hand stitching\n2.1\nHand stitching is performed in accordance with the\nwork ticket without damage to the upper\ncomponent.\n\n2.2\nHand stitching style is performed according to the\nrequired design of the shoe.\n\n2.3\nThread and upper component are checked for\ndamage in accordance with company procedures.\n\n2.4\nStitches made are leveled and equal for both pair\nof shoes.\n\n--- PDF PAGE 64 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n62\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Thread\n1.1\nColor\n1.2\nSize\n1.3\nSubstance\n2. Damage and defects\n2.1\nvein marks\n2.2\ntick marks\n2.3\nlooseness\n2.4\nflay cuts\n2.5\nscratches\n2.6\nputrefaction\n2.7\nwobble fly\n2.8\nbarb wire marks\n2.9\nsalt burns\n2.10 ammonia burns\n2.11 discoloration\n2.12 brand marks\n2.13 heavy hair follicles\n2.14 heavy grain\n2.15 growth marks\n3. Stitching style\n3.1\nBox\n3.2\nCross\n3.3\nStraight\n3.4\nPie crust\n\n--- PDF PAGE 65 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n63\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared materials\n1.2\nPerformed hand stitching\n2. Underpinning\nknowledge and attitude\n2.1\nHand Stitching procedures\n2.2\nMaterials for footwear\n2.3\nTypes and sizes of threads, waxes and needles\n2.4\nTools\n2.5\nTypes of stitches\n2.6\nQuality of stitching and finished footwear\n2.7\nSafety Practices\n2.8\nPositive work values (orderliness and being\norganize, cost, quality and safety consciousness,\npatience, attention to details, etc.)\n3. Underpinning skills\n3.1\nSelecting thread, needles and punchers\n3.2\nPreparing and punching holes\n3.3\nMeasuring in Metric / English system\n3.4\nInterpreting work ticket\n3.5\nCommunicating and interacting skills\n4. Resource implications\nThe following resources MUST be provided\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nChair/stool\n4.3\nFinger protector (leather ring)\n4.4\nWork ticket\n4.5\nNeedles\n4.6\nCut upper parts\n4.7\nThread\n4.8\nHand-stitching wax (pagkit)\n4.9\nPunchers\n4.10 Dividers\n4.11 Awl\n4.12\nKnife\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation / demonstrations of the\ncandidate’s performance of knowledge to task and\nquestions related to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nTESDA-accredited assessment center\n\n--- PDF PAGE 66 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n64\n\nUNIT OF COMPETENCY:\nPREPARE UPPER FOR HAND LASTING\nUNIT CODE:\nFWR744310\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nto prepare upper for hand lasting such us manual insole\nattachment and manual reactivation of toe puff and\nstiffeners\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Immerse toe puff and\nstiffeners into toluene\nsolution\n1.1.\nTask\nis\nperformed\nin\naccordance\nwith\nprocedures and manufacturer's specifications.\n1.2.\nUsed solvents (toluene) are stored or disposed\nfollowing environmental rules and regulations.\n2. Insert toe puff and\nstiffeners to upper\n2.1\nTask\nis\nperformed\nin\naccordance\nwith\nprocedures and manufacturer's specifications.\n2.2\nTask is performed without damage to upper\ncomponent.\n2.3\nInserted toe-puff and stiffeners are evenly\ndistributed inside the upper component.\n2.4\nEnsured that lining is flattened and free from\ndefects.\n3. Attach insole to last\nwith tacks\n3.1.\nTask\nis\nperformed\nin\naccordance\nwith\nprocedures and manufacturer's specifications.\n3.2.\nInsole is securely attached and flushed to the\nlast according to the type of method used.\n3.3.\nUpper parts and last with insole are placed into\nthe rack or other working transportation\nmethod according to procedures.\n\n--- PDF PAGE 67 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n65\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Method\n1.1\nTacks/staple\n1.2\nUnifast\n1.3\nHot melt or adhesive\n1.4\nDouble-sided pads\n2. Insole\n2.1\nLeather board\n2.2\nCellulose board\n2.3\nLeather\n2.4\nPlastic\n2.5\nWoven/Non-woven material\n2.6\nFabric\n2.7\nFiberboard\n3. Toe puff and\nStiffeners\n3.1\nLeather\n3.2\nLeather board\n3.3\nPerformed layer\n3.4\nCelluloid\n3.5\nThermoplastic\n3.6\nNitrocellulose impregnated with fabrics\n3.7\nPaint on\n3.8\nImpregnated fabric – heat reactivated\n3.9\nPrint on\n3.10 Filmic\n3.11 Polystyrene\n3.12 Celastic\n3.13 Rubber\n4. Upper\n4.1\nLeather\n4.2\nSynthetics\n4.3\nFabrics\n5. Racks/Work Transport\nMethods (WTM)\n5.1\nRacks\n5.2\nConveyor\n5.3\nTrolleys\n5.4\nBoxes\n5.5\nBags\n5.6\nMonorail\n5.7\nHand\n6. Defects\n6.1\nDamage to lining\n6.2\nDamage to upper\n6.3\nStraining of lining\n6.4\nBurst seam of lining\n6.5\nBurst seam of upper\n6.6\nTwisted lining\n6.7\nPockets between lining and upper\n6.8\nCreases\n\n--- PDF PAGE 68 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n66\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked the last, insole and stitched upper\n1.2\nInserted toe puff and stiffeners into the uppers\n1.3\nFitted stiffener up to top line of quarter and or\ncounter.\n1.4\nAttached insole to shoe last\n2. Underpinning\nknowledge and\nattitude\n2.1\nSafe work practices and first aid regulations\n2.2\nBasic arithmetic\n2.3\nFootwear anatomy\n2.4\nToe puff and stiffener materials\n2.5\nLast shapes\n2.6\nUpper size/fit and color system\n2.7\nSolvent and adhesive materials\n2.8\nBack heights\n2.9\nHandling and storage of adhesives\n2.10 Quality standards\n2.11 Insole materials\n2.12 Uni-fast pegs\n2.13 Hot melt glue gun\n2.14 Positive work values (organize, cost, quality and\nsafety consciousness, patience, etc.)\n3. Underpinning skills\n3.1\nInterpreting work tickets\n3.2\nCommunicating skills\n3.3\nUsing tacking/stapling tools\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nMaterials relevant to the activity\n4.3\nTools and equipment appropriate for attaching\ninsoles and inserting toe puff and stiffeners into\nuppers\n4.4\nWork ticket\n4.5\nLasting table\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation / demonstration of the\ncandidate’s application of knowledge to tasks and\nquestioning related to underpinning knowledge\n5.2 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 69 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n67\n\nUNIT OF COMPETENCY\nPERFORM BASIC HAND LASTING\nUNIT CODE\nFWR744311\nUNIT DESCRIPTOR\nThis unit covers knowledge, skills and attitudes required\nin basic manual lasting following enterprise and quality\nrequirement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Attach upper to\ninsole/last\n1.1 Counter is aligned in accordance with identified\nback height of last\n1.2 Back seam is straightened and positioned at the\ncenter of the counter\n1.3 Tacks are firmly embedded and hammered into\nmetal seat plate\n1.4 Safety practices are observed in handling of lasting\npincer and tacks\n2\nApply adhesive to\nupper components and\ninsole\n2.1 Adhesive for upper materials are selected based on\njob specifications and product materials\ncompatibility\n2.2 Upper components and insole surfaces are\nprepared according to company procedures\n2.3 Adhesive is applied to components according to\nmanufacturer’s recommendations and company\nprocedures\n2.4 Adhesive is evenly applied to bottom and along the\nedge of insole\n2.5 Ensured that outside of upper components or last\nare clean and free from adhesive\n2.6 Adhesive is dried in accordance with manufacturer’s\nrecommendation\n3\nCarry out toe lasting\n3.1 Topline of upper is positioned in accordance with\nwork practice\n3.2 Lasting allowance of upper are pulled using lasting\npincers and secured at the insole\n3.3 Whole upper is straight and wrinkles or pleats\nshowing at shoe feather edge are flattened in\naccordance with company practice\n\n--- PDF PAGE 70 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n68\n\n4\nPerform seat and\nside lasting\n4.1 Ensured that topline of upper is tight from toe to last\n4.2 Pleats and creases found between lining and upper\nmaterial are removed and flattened in accordance\nwith company procedures\n4.3 Upper stiffener and lining are pulled tightly and\nhammered to insole leaving no surplus material at\nthe waist\n4.4 Tacks are turned over on the metal seat plate\n5 Flatten upper to feather\nedge\n5.1 Feather edge gave a smooth feather line\n5.2 Upper is completely lasted to insole and is free from\ndamage\n5.3 Ensured that upper is tightly lasted with no pucker\nor gaps between the upper and last\n\n--- PDF PAGE 71 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n69\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Back height\n\n1.1\nBack straps\n1.2\nBasic counters\n1.3\nCounters Dogtails\n1.4\nCollar\n2. Insole\n\n2.1\nUpper Materials:\n2.1.1\nLeather\n2.1.2\nSynthetics\n2.1.3\nFabrics\n\n2.2\nInsole Materials:\n2.2.1\nLeather board\n2.2.2\nCellulose board\n2.2.3\nLeather\n2.2.4\nPlastic\n2.2.5\nWoven/Non-woven material\n2.2.6\nFabric\n2.2.7\nFiberboard\n3. Adhesive\n3.1\nNeoprene\n3.2\nPolyurethane\n3.3\nSolvent based\n3.4\nHot melt adhesive\n3.5\nLatex\n3.6\nGrafted adhesive\n4. Damage\n4.1\nDamage to lining\n4.2\nDamage to upper\n4.3\nStraining of lining\n4.4\nBurst seam of lining\n4.5\nBurst seam of upper\n4.6\nTwisted lining\n4.7\nTack damage\n4.8\nPrint through of toe-puff\n4.9\nPrint through of stiffener\n4.10\nRips caused by over pulling\n5. Tacks\n5.1\nStaples\n5.2\nNail tacks\n6. Tools\n6.1\nPincers\n6.2\nStaple remover\n6.3\nTack remover knife\n\n--- PDF PAGE 72 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n70\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked counter’s position against back height\nand back seam\n1.2\nRemoved and flattened all creases between lining,\ninterlining and upper\n1.3\nApplied adhesive to bottom edge of upper and\nedge of insole\n1.4\nFollowed procedures in applying adhesive to upper\nand last\n1.5\nAllowed proper drying time of adhesive\n1.6\nSecured topline at correct height\n1.7\nDetermined tacks are turned over on metal seat\nplate\n1.8\nChecked all temporary tacks are removed from\ninsole\n1.9\nInspected the quality of lasted shoes\n1.10 Compared lasted pairs are matching\n2. Underpinning\nknowledge and attitude\n2.1\nSafe work practices and first aid regulations\n2.2\nCleanliness and orderliness in the workplace\n2.3\nUpper and backing materials\n2.4\nHandling and storage of adhesive\n2.5\nCompany quality standards\n2.6\nSolvents and adhesive materials\n2.7\nFootwear hand lasting tools\n2.8\nHand lasting operation\n3. Underpinning skills\n3.1\nInterpreting work tickets\n3.2\nCommunicating and interacting effectively with\nother staff and management within the workplace\n4. Resource implications\nThe following resources must be provided:\n4.1\nWorkplace location with proper lighting\n4.2\nWork ticket\n4.3\nMaterials relevant to proposed activity\n4.4\nTools and equipment appropriate for the process of\nhand lasting\n\n--- PDF PAGE 73 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n71\n\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect\nobservation/demonstration\nwith\noral\nquestioning related to underpinning knowledge\n5.2\nPortfolio.\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 74 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n72\n\nUNIT OF COMPETENCY:\nATTACH INSOLE TO LAST BY MACHINE\nUNIT CODE:\nFWR744309\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes\nrequired in attaching insole to the last by machine and\ndetermines the quality and standards of an attached\ninsole before lasting\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Set machine for\noperation\n1.1 Insoles and last are prepared in accordance with job\nspecifications\n\n1.2 Machine adjustments are made in accordance with\nthe job and materials specifications\n\n1.3 Machine is tested in accordance with manufacturer’s\nprocedural manual\n2. Attach insole to the last\n2.1 Insole is attached to the last in accordance with job\nspecification\n\n2.2 Insole attaching machine is operated in accordance\nwith manufacturer’s procedural manual\n\n2.3 Attached insoles are checked according to company\nstandards\n\n--- PDF PAGE 75 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n73\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Machine adjustments\n1.1\nInsole tacking machine\n1.1.1\nAir pressure (must not exceed 100 psi)\n1.1.2\nAir lubricator and air filter\n1.1.3\nStaple/tacks guides or raceway\n1.1.4\nHeight of stand\n1.1.5\nDepth of staples/tacks\n1.2\nHot melt/ Glue gun\n1.2.1\nTemperature setting\n2. Attached insole\n2.1\nTacks/staple\n2.2\nUnifast\n2.3\nHot melt or adhesive\n3. Insole\n3.1\nType\n3.2\nThickness\n\n--- PDF PAGE 76 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n74\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed machine adjustments\n1.2 Attached insole to last by machine\n1.3 Checked quality of attached insole\n2. Underpinning\nknowledge and attitude\n2.1 Safe work practices and first aid regulation\n2.2 Shapes and specifications of last\n2.3 Insole materials\n2.4 Types, parts and functions of the insole attaching\nmachines\n2.5 Tools used for insole attachment\n2.6 Procedures in attaching insole to last\n2.7 Operating procedures of insole attaching machine\n2.8 Positive work values ( being organize, cost, quality\nand safety consciousness, patience, attention to\ndetails, etc.)\n3. Underpinning skills\n3.1 Interpreting work tickets\n3.2 Operating insole attaching machine\n3.3 Communicating skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Materials relevant to the activity\n4.2 Tools and equipment appropriate for attaching insole\nto the last\n4.3 Work ticket\n4.4 Workplace with appropriate lighting and ventilation\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation/ demonstration of the candidate’s\napplication of knowledge to task and questions\nrelated to underpinning knowledge and skills\n5.2 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or in a simulated environment or in\nTESDA accredited assessment center\n\n--- PDF PAGE 77 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n75\n\nUNIT OF COMPETENCY:\nPERFORM TOE PUFF AND STIFFENERS\nACTIVATION\nUNIT CODE:\nFWR744307\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nto activate toe puff and stiffeners by using toe puff press\nand back part molding machine\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Set machine\n1.1\nMachine is adjusted based on the type of upper\nand stiffener materials.\n\n1.2\nEnsured that toe puff press machine is free from\nadhesive residues.\n2. Insert /Activate toe-puff\n2.5\nTask is performed in accordance with procedures\nand manufacturer's specifications.\n\n2.6\nTask is performed without damage to upper\ncomponent.\n\n2.7\nInserted/activated toe-puff is evenly distributed\ninside the upper and lining component.\n\n2.8\nLining is flattened and freed from defects.\n3. Insert /Activate\nstiffener\n3.1\nStiffeners are inserted/activated between upper\nand lining in accordance with standard operating\nprocedures.\n\n3.2\nCenter of stiffener and counter or quarter are\nmatched and aligned with the back seam.\n\n3.3\nStiffener is molded and activated in accordance\nwith back part molding standard.\n\n3.4\nTask is performed without damage to upper and\nlining components.\n\n--- PDF PAGE 78 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n76\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Machine adjustments\n1.1\nAir pressure\n1.2\nTemperature\n1.3\nTime setting\n1.4\nWiper adjustments\n1.5\nBack part moulding machine\n2. Toe Puff materials\n2.1\nPrint on\n2.2\nPaint on\n2.3\nFilmic\n2.4\nPolystyrene\n2.5\nCelastic\n2.6\nRubber\n2.7\nLeather board\n3. Stiffener materials\n3.1\nLeather\n3.2\nLeather board\n3.3\nPerformed layer\n3.4\nCelluloid\n3.5\nThermoplastic\n3.6\nNitrocellulose impregnated with fabrics\n3.7\nPaint on\n3.8\nImpregnated fabric – heat reactivated\n4. Defects\n4.1\nDamage to lining and/or upper\n4.2\nStraining of lining\n4.3\nBurst seam of lining and/or upper\n4.4\nTwisted lining\n4.5\nPockets between lining and upper\n\n--- PDF PAGE 79 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n77\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSet up toe puff press machine and back part\nmoulding machine\n1.2\nInserted/activated toe puff and stiffeners\n1.3\nMoulded stiffeners correctly\n1.4\nOperated the toe puff press machine and back\npart moulding machine\n2. Underpinning\nknowledge and attitude\n2.1\nSafe work practices and first aid regulations\n2.2\nTypes of toe puff and stiffener materials\n2.3\nUpper size/fit and color system\n2.4\nMachine parts and functions\n2.5\nTypes of solvent and adhesive materials\n2.6\n5 S\n2.7\nBack heights\n2.8\nQuality standards procedures\n2.9\nPositive work values (orderliness and being\norganize, cost, quality and safety consciousness,\npatience, etc.)\n3. Underpinning skills\n3.1\nInterpreting work tickets\n3.2\nAdjustments for toe puff and stiffener reactivation\nand moulding\n3.3\nOperation and minor maintenance of toe-puff press\nand back part moulding machine\n3.4\nOperating toe-puff press and back part moulding\nmachine\n3.5\nCommunicating skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nToe puff press machine\n4.2\nBack part moulding machine with hot and cold\nmouldings\n4.3\nMaterials relevant to the activity\n4.4\nTools appropriate for inserting toe puff and\nstiffeners into uppers\n4.5\nWork ticket\n4.6\nWorkplace with proper lighting and ventilation\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation/ demonstration of the candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2 Portfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nTESDA accredited assessment center\n\n--- PDF PAGE 80 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n78\n\nUNIT OF COMPETENCY:\nPERFORM BASIC MACHINE LASTING\nUNIT CODE:\nFWR744320\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitude required in\nperforming toe lasting, seat and side lasting of a flat\nlasted construction.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Perform machine\nsettings\n1.1 Machine is set up according to manufacturer's\nspecifications and work ticket requirements\n\n1.2 Machine is tested in accordance with manufacturer's\nrequirements\n2 Perform toe lasting\n2.1 Toe lasting is performed in accordance with work\nticket and style/design of shoes\n\n2.2 Toe lasting is performed with no excess adhesive\nand no crease at toe featheredge\n3 Carry out seat and side\nlasting\n3.1 Seat and side lasting is carried out within 30\nseconds to 1 ½ minutes per set in accordance with\nwork ticket and standard operating procedures\n\n3.2 Seat of lasted upper is flattened and evened without\ndamage.\n\n3.3 Adhesive is applied to the seat of lasted upper\nwithout excess (no extrusion).\n\n3.4 Seat and side lasting are checked as per standard\nquality procedures\n\n--- PDF PAGE 81 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n79\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Machine setting\nThe different machine settings to be done are:\n1.1\nTemperature\n1.2\nCycle Dwell timer\n1.3\nAir Pressure\n1.4\nWiper Temperature Regulator\n1.5\nThermoplastic Rod Temperature Regulator\n1.6\nPincer Pull Pressure Regulator\n1.7\nHeater Switch\n1.8\nPositioning of lasted upper\n2. Damages\n2.1\nDamage to lining\n2.2\nDamage to upper\n2.3\nStraining of lining\n2.4\nBurst seam of lining\n2.5\nBurst seam of upper\n2.6\nTwisted lining\n3. Adhesives\n3.1\nNeoprene\n3.2\nPolyurethane\n3.3\nWater based\n3.4\nSolvent based\n3.5\nRubber cement\n3.6\nHot melt adhesive\n3.7\nLatex\n3.8\nGraft adhesives\n\n--- PDF PAGE 82 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n80\n\nEVIDENCE GUIDE\n1 Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared machine settings\n1.2 Performed toe lasting\n1.3 Carried out seat and side lasting\n2 Underpinning\nknowledge and\nattitude\n2.1\nSafe work practices and first aid\n2.2\nSafe handling of tools and materials\n2.3\nUpper size/fit and color system\n2.4\nKinds of damages/defects in lasting upper\n2.5\nMachine lasting operations\n2.6\nQuality standards procedures\n2.7\nTypes and Characteristics of Adhesive\n2.8\nPositive work values (orderliness and being\norganize, cost, quality and safety consciousness,\npatience, etc.)\n3 Underpinning skills\n3.1 Operating lasting machines\n3.2 Communicating and interacting skills\n3.3 Interpreting work ticket\n3.4 Assessing quality of the lasted uppers and\nrecognizing its defects.\n4 Resource implications The following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nMaterials and tools relevant to the activity\n4.4\nTools and equipment relevant to the activity\n5 Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct\nobservation/\ndemonstration\nof\nthe\ncandidate’s application of knowledge to tasks and\nquestioning related to underpinning knowledge\n5.2\nPortfolio\n6\nContext for\nassessment\n6.1 Competency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 83 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n81\n\nUNIT OF COMPETENCY PERFORM CHILLING OPERATION\nUNIT CODE:\nFWR744308\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitude required in\nperforming chilling operation\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Set chilling machine\n1.1\nChilling machine is set in accordance with factory\nstandards/requirements of upper, and sole\nmaterial.\n\n1.2\nAdjustments are made in accordance with the work\nticket\n2. Monitor chilling\noperation\n2.1\nFootwear for chilling is positioned on the conveyor\naccording to standard operating procedures\n\n2.2\nChilling operation is monitored in accordance with\nstandard operating procedures and work ticket\n\n2.3\nFootwear is retrieved from chiller and grouped\ntogether according to the work ticket\n\n2.4\nMachine problems or malfunction reported to\nsupervisors\nin\naccordance\nwith\ncompany\nprocedures\n\n--- PDF PAGE 84 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n82\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Machine Setting\n\n1.1\nTemperature\n1.2\nTime\n1.3\nSpeed\n2. Upper Material\n\n2.1\nNatural Leather\n2.2\nSynthetic/Man-made\n2.3\nFabrics\n3. Sole Material\n\n3.1\nThermoplastic Rubber (TPR)\n3.2\nPolyurethane (PU)\n3.3\nSolid Rubber\n3.4\nMicrocellular Rubber\n3.5\nResin Rubber\n3.6\nPolyvinyl Chloride (PVC)\n3.7\nEthylene Vinyl Acetate (EVA)\n\n--- PDF PAGE 85 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n83\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidences that the candidate:\n1.1\nAdjusted machine settings\n1.2\nMonitored chilling operations\n2. Underpinning\nknowledge and\nattitude\n2.1\nChilling machine settings.\n2.2\nSafe work practices\n2.3\nFirst aid\n2.4\nBasic product knowledge\n2.5\n5S\n2.6\nPositive work values (orderliness and being\norganize, cost, quality and safety consciousness,\npatience, etc.)\n3. Underpinning skills\n3.1\nCommunicating and interacting skills\n3.2\nInterpreting work ticket\n4. Resource implications\nThe following resources MUST be provided\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nMaterials relevant to the activity\n4.4\nTools and equipment appropriate for chilling\noperation\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation/ demonstration of candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nwork place or in a simulated workplace setting or in\nany TESDA accredited assessment center.\n\n--- PDF PAGE 86 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n84\n\nUNIT OF COMPETENCY\nPERFORM PRE-BONDING OPERATIONS\nUNIT CODE:\nFWR744321\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitude required to\nperform pre-bonding operations such as tack lifting,\nbottom\nand\noutsole\ncementing,\nand\nsolvent\nwiping/priming in preparation for bonding operations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Remove tacks from\nbottom of lasted upper\n1.1\nTacks are removed from the lasted upper as per\nstandard operating procedures.\n\n1.2\nLasted uppers removed are free from scratch\nmarks.\n\n1.3\nBonding of lasting margin to the insole is kept\nintact.\n2. Mark and inspect\nquality of lasted upper\n2.1\nOutsoles and lasted uppers are matched\naccording to style and size.\n\n2.2\nBottom profile of upper is marked according to the\narea of sole to be used.\n\n2.3\nLasted uppers are inspected according to standard\noperating procedures\n3. Perform roughing and\nscouring\n3.1\nRoughing and scouring is performed in accordance\nwith standard operating procedures.\n\n3.2\nGrains and finish of the lasting margin are\nremoved without damage to upper.\n\n3.3\nFibers of the last are teased/raised in accordance\nwith work procedures.\n\n3.4\nTop surface of the outsole is scoured without\ndamage and free from plasticisers.\n\n--- PDF PAGE 87 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n85\n\n4. Perform bottom\ncementing and\nattachment of filler\n\n4.1\nBottom cementing and attachment of filler are\nperformed in accordance with work specification.\n\n4.2\nFiller is attached on the bottom profile of the lasted\nupper in accordance with the thickness of upper\nmaterial.\n5. Perform sole wiping\nand sole cementing\n5.1\nOutsole is primed according to material\nrequirement/specification.\n\n5.2\nOutsole is primed without causing damage to\nmaterial.\n\n5.3\nPrimers are handled in accordance with OH & S\nrequirements.\n\n5.4\nSole wiping and cementing is performed in\naccordance with standard operating procedures.\n\n--- PDF PAGE 88 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n86\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Insoles\n1.1\nLeather Board\n1.2\nCellulose board\n1.3\nPlastic\n1.4\nWoven/Non-woven material\n1.5\nFabric\n1.6\nFiber board\n2. Outsoles\n2.1\nLeather Unit Soles\n2.2\nPolyvinyl Chloride (PVC)\n2.3\nThermoplastic Rubber (TPR)\n2.4\nThermoplastic Urethane (TPU)\n2.5\nPolyurethane (PU)\n2.6\nEthyl Vinyl Acetate (EVA)\n2.7\nNylon\n2.8\nRubber (Vulcanized, Unvulcanized)\n2.9\nCrepe\n2.10 Resin\n3. Finish\n3.1\npatent\n3.2\npearlised\n3.3\nburnish\n3.4\nbrush off\n3.5\nnubuck\n3.6\nfull grain\n3.7\ncorrected\n3.8\ncrazy horse\n3.9\nprinted\n3.10 oil pull up\n3.11 exotic (ex. Snake print, ostrich, crocodile, etc.)\n4. Damages\n4.1\nOver roughed uppers which extends over the\nmarked areas\n4.2\nBurnt areas due to blunt brush or abrasive\n4.3\nOver roughed insoles\n4.4\nScratches\n4.5\nTears\n4.6\nCuts\n\n--- PDF PAGE 89 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n87\n\n5. Adhesives\n5.1\nPolyurethane (PU)\n5.2\nPolyester\n5.3\nEthyl Vinyl Acetate (EVA)\n5.4\nPolychloroprene\n5.5\nHotmelt\n6. Fillers\n6.1\nScrap leather\n6.2\nSawdust\n6.3\nRubber\n6.4\nFoam\n6.5\nFelt materials\n7. Upper Materials\n7.1\nLeather\n7.2\nSynthetic\n7.3\nFabrics\n8. Primers\n8.1\nMEK (mixed solvents)\n8.2\nPVC Primer\n8.3\nPU Primer\n8.4\nRubber Primer\n\n--- PDF PAGE 90 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n88\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked quality of lasted uppers\n1.2\nOperated roughing and scouring machines\n1.3\nPerformed roughing and scouring of shoes\n1.4\nPerformed bottom cementing and attaching of filler\n1.5\nPerformed sole wiping and cementing\n1.6\nCarried out priming operations\n1.7\nFollowed instructions from work ticket.\n2. Underpinning\nknowledge and\nattitude\n2.1\nSafe work practices.\n2.2\nFirst aid treatment\n2.3\nHandling of tools and materials\n2.4\nProducts used in bonding (e.g. adhesives,\nsolvents, primers)\n2.5\nFootwear terms\n2.6\nQuality standards\n2.7\nDifferent outsole materials\n2.8\nPositive work values (orderliness and being\norganize, cost, quality and safety consciousness,\npatience, etc)\n3. Underpinning skills\n3.1\nAssessing quality of the lasted uppers and\nrecognizing the uppers’ defects.\n3.2\nCommunicating and interacting skills\n3.3\nInterpreting work ticket\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nTools and materials\n4.4\nMachines needed to the said activity\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation/demonstration of the candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 91 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n89\n\nUNIT OF COMPETENCY:\nPERFORM BONDING OPERATIONS\nUNIT CODE:\nFWR744322\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nto perform lasting operation such as sole attaching, sole\npressing and de-lasting\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform sole attaching\nand pressing\n1.1 Solvents are reactivated in accordance with\nmanufacturer's requirements.\n\n1.2 Sole attached to lasted upper according to\nstandard operating procedures and without\ncausing damage to the materials.\n\n1.3 Sole press machine is set up in accordance with\nmanufacturer's manual.\n\n1.4 Pressing is performed in accordance with standard\noperating procedures.\n2. Perform edge cleaning\noperations\n2.1 Sole and upper are cleaned and free from excess\nadhesive and without harming the bond.\n\n2.2 Tools for edge cleaning are used in accordance\nwith the type of upper material.\n3. Delasting and\ninspection of shoe\n3.1 Delasting is performed in accordance with standard\noperating procedures.\n\n3.2 Delasting is performed without causing damage to\nthe topline and seams.\n\n3.3 Shoes are inspected in accordance with quality\nstandard procedures.\n\n--- PDF PAGE 92 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n90\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Outsoles\n1.1\nLeather Unit Soles\n1.2\nPolyvinyl Chloride (PVC)\n1.3\nThermoplastic Rubber (TPR)\n1.4\nThermoplastic Urethane (TPU)\n1.5\nPolyurethane (PU)\n1.6\nEthyl Vinyl Acetate (EVA)\n1.7\nNylon\n1.8\nRubber (Vulcanized, Unvulcanized)\n1.9\nCrepe\n1.10 Resin\n2. Re-activated\n2.1\nSemi – automatic (10 seconds)\n2.1.1\nFlash re-activator machine\n2.2\nOperator controlled (30 seconds)\n2.2.1\nQuartz – halogen lamps\n2.2.2\nFabricated re-activator machine\n3. Standard operation\n3.1\nToe part of lasted upper to forepart of outsole\n3.2\nSeat area of outsole to back part of lasted upper\n3.3\nSides of lasted upper to sides of outsole\n4. Damages\n4.1\nIncorrect positioning of lasted upper to outsole\n4.2\nWeak adhesion due to improper solvent\napplication and/or priming procedures\n5. Sole Press Machines\n5.1\nTwo station sole press machine\n5.1.1\nPneumatic\n5.1.2\nHydraulic pressure sole press\n5.2\nOne station\n5.2.1\nPneumatic\n5.2.2\nHydraulic pressure sole press\n6. Tools\n6.1\nPale crepe\n6.2\nSolvent\n6.3\n“balibol”\n6.4\nresin rubber\n7. Type of Upper\nMaterials\n7.1\nLeather\n7.2\nSynthetic\n7.3\nFabrics\n\n--- PDF PAGE 93 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n91\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified damages on the finished shoe.\n1.2\nPerformed sole attaching and pressing\n1.3\nPerformed edge cleaning operations\n1.4\nDe-lasted and inspected shoe\n2. Underpinning\nknowledge and attitude\n2.1\nSafe work practices\n2.2\nSafe handling of tools and materials\n2.3\nProducts used in bonding (e.g. adhesives,\nsolvents, primers)\n2.4\nFootwear terms\n2.5\nQuality standards on lasting\n2.6\nTypes of outsole materials\n2.7\n5 S\n2.8\nPositive work values (cost, quality and safety\nconscious, patience, orderliness and being\norganize, attention to details, etc.)\n3. Underpinning skills\n3.1\nAssessing quality of the lasted uppers and\nrecognizing its defects.\n3.2\nCommunicating and interacting skills.\n3.3\nInterpreting work ticket.\n3.4\nDetermining damages on the lasted uppers and\noutsoles.\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nMaterials, tools and equipment relevant to the\nactivity\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect observation/demonstration of the candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 94 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n92\n\nUNIT OF COMPETENCY\nPERFORM HEEL-ATTACHING OPERATION\nUNIT CODE:\nFWR744323\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes\nrequired in attaching heel.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare work pieces\n1.1\nWork pieces are prepared in accordance with work\nstandards.\n\n1.2\nRoughing machine is used in accordance with\nmanufacturer’s procedural manual.\n2. Attach heel to sole\n2.1\nAdhesive is dried and re-activated in accordance\nwith heel attachment procedures.\n\n2.2\nAttached heel is aligned to the centerline of the\nsole and slightly inclined with back part higher than\nthe front depending on its height.\n3. Press sole\n3.1.\nSole is pressed according to standard operating\nprocedures.\n\n3.2.\nPressed sole is free from damages.\n4. De-last shoe\n4.1\nDe-lasting of shoe is performed in accordance with\ncompany procedures.\n\n4.2\nShape of the shoe is retained according to design\nand style.\n5. Fix heel to sole\n5.1\nHeel is fixed to the sole in accordance with\nstandard operating procedures.\n\n5.2\nHeels are fixed with no protruding fasteners on the\nheel area.\n\n--- PDF PAGE 95 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n93\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Prepared\nPreparation includes:\n1.1\nRoughing\n1.2\nMarking\n1.3\nPriming\n1.4\nApplying adhesive\n2. Sole materials\n2.1\nLeather\n2.2\nResin Rubber\n2.3\nEVA (Ethyl Vinyl Acetate)\n2.4\nTPR (Thermo Plastic Rubber)\n2.5\nPU (Poly Urethane)\n2.6\nCrepe Rubber\n3. Heels\n3.1\nThe use of heels vary on:\n3.1.1\nMen’s shoes\n3.1.2\nLadies’ shoes\n3.2\nThe different heel materials used are:\n3.2.1\nWood\n3.2.2\nRubber\n3.2.3\nLeather\n3.2.4\nPlastic\n4. Heel height\n4.1\nThe different heel height varies and depends on\nthe design of shoe. These can range from 5mm –\n75mm or higher\n5. Damages\n5.1\nPress marks\n5.2\nScratch marks\n5.3\nMis-alignment\n6. Adhesives\n6.1\nPolyurethane (PU)\n6.2\nPolychloroprene\n7. Fasteners\n7.1\nButtress nail\n7.2\nStaple\n7.3\nScrew\n7.4\nCommon Nail\n\n--- PDF PAGE 96 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n94\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared workpieces\n1.2\nAttached heel to sole\n1.3\nPressed sole\n1.4\nDe-lasted shoe\n1.5\nFixed heel to sole\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSafe work practices\n2.2\nFirst Aid Treatment and Accident Prevention\n2.3\nMachine setting and maintenance\n2.4\nFootwear terms\n2.5\nAnatomy of Shoe\n2.6\nTypes of adhesive\n2.7\nTypes of heel and sole materials\n2.8\nTypes of grinder\n2.9\nQuality Standard\n2.10 5S\n2.11 Positive work values (orderliness and being\norganize, patience, cost, quality and safety\nconsciousness, etc.)\n3. Underpinning skills\n3.1\nCommunicating and interacting skills\n3.2\nInterpreting work ticket\n3.3\nOperating sole pressing machine\n3.4\nApplying company quality standards\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nMaterials relevant to the activity\n4.4\nTools and equipment appropriate for heel attaching\noperation\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Direct observation/demonstration of the candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2 Portfolio\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or in a simulated environment or\nin TESDA accredited assessment center\n\n--- PDF PAGE 97 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n95\n\nUNIT OF COMPETENCY:\nPERFORM POLISHING OPERATION\nUNIT CODE:\nFWR744324\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes in\nperforming the polishing operation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare work pieces\n1.1\nWork pieces are repaired and cleaned before\npolishing in accordance with standard operating\nprocedures.\n\n1.2\nPolishing materials and equipment are\nprepared in accordance with standard operating\nprocedures.\n2. Apply first coating\n2.1\nChemicals used are selected and applied to the\nshoe in accordance with manufacturer's manual.\n\n2.2\nCream filler is applied to shoe upper according to\ncompany requirements.\n\n2.3\nDrying time is followed according to the company\nrequirements.\n3. Perform cotton\nbrushing\n3.1\nCotton brushing operation is done according to\ntypes and finishes of leather.\n\n3.2\nUppers are free from damage, patches and\ndiscoloration.\n4. Apply final coating\n4.1\nTopcoat chemicals are applied evenly on shoe\nuppers in accordance with company standard.\n\n4.2\nBuffing is done following the shoe contours.\n\n4.3\nShoe uppers are free from discoloration after mop\nbrushing.\n\n4.4\nDamage are recorded in the work ticket as per\nstandard operating procedures\n5. Perform final polishing\nand brushing of shoes.\n5.1\nShoes are arranged to the flow of operation for\nfinal polishing.\n\n5.2\nFinal brushing is done in accordance with standard\noperating procedures.\n\n5.3\nDamaged shoes are segregated and repaired\naccording to standard operating procedures.\n\n--- PDF PAGE 98 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n96\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Complete shoe\n1.1\nVamp\n1.2\nToe Cap\n1.3\nWing Cap\n1.4\nQuarters\n1.5\nCounter\n1.6\nTongue\n1.7\nBack strap\n1.8\nEyelet Facing/ Eye stay\n1.9\nStraps\n1.10 Collar\n1.11 Sole\n1.12 Heel\n1.13\nSole edging\n2. Polishing materials\n2.1\nRug\n2.2\nTop coat/gloss\n2.3\nUpper cleaning materials\n2.4\nFaking crayons\n2.5\nShoe polisher\n2.6\nCarnauba wax\n2.7\nFinishing oil\n2.8\nSafety gloves\n2.9\nCrepe rubber\n2.10 Insole iron\n2.11\nWater cleaner\n3. Polishing equipment\n3.1\nCotton roller\n3.2\nSpray gun\n3.3\nDryer\n3.4\nCompressor\n4. Damages visible on the\npolished shoe\n4.1\nupper discoloration\n4.2\nknife cuts\n4.3\npoor top coat application\n4.4\nuneven brushing\n4.5\nburned out sole\n5. Leather\ntypes\nand\nfinishes\n5.1\nFull grain\n5.2\nSemi-aniline\n5.3\nBrush off\n5.4\nOil Pull-up\n5.5\nNappa\n5.6\nCrazy horse\n5.7\nNubuck\n\n--- PDF PAGE 99 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n97\n\nEVIDENCE GUIDE\n1. Critical\naspects\nof\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nApplied first coating\n1.2\nPerformed cotton brushing\n1.3\nApplied final coating\n1.4\nPerformed final shoe polishing and brushing\n1.5\nSegregated and reported damage shoes\n2. Underpinning\nknowledge and attitude\n2.1\nSafe work practices\n2.2\nFirst aid treatment\n2.3\nSafe handling of tools and materials\n2.4\nFootwear terms\n2.5\nTypes of polishing materials, tools and equipment\n2.6\nTypes and characteristics of leather shoes\n2.7\nDefects of leather\n2.8\nPositive work values (being organize, cost, quality\nand safety consciousness, patience, attention to\ndetails, etc.)\n3. Underpinning skills\n3.1\nIdentifying leather defects and variation in grains\nand shades\n3.2\nPolishing techniques\n3.3\nCommunicating skills\n3.4\nInterpreting work ticket.\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nMaterials relevant to the activity\n4.4\nTools and equipment appropriate for polishing.\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation / demonstration of the candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or in a simulation environment or in\nTESDA accredited assessment center\n\n--- PDF PAGE 100 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n98\n\nUNIT OF COMPETENCY:\nPERFORM\nSOCK\nATTACHMENT\n&\nCLEANING\nOPERATION\nUNIT CODE:\nFWR744325\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitude required in\nperforming sock attachment and cleaning of de-lasted\nfootwear..\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare work pieces\n1.1\nWork pieces are selected and identified in\naccordance with the job specifications.\n\n1.2\nWork pieces are arranged/positioned in\naccordance with standard operating procedures.\n2. Attach sock into the\nshoe\n2.1\nSock lining (and shoe lace, if necessary) is\nattached depending on design and style of shoe.\n\n2.2\nBrand name labels are attached in accordance\nwith company procedures.\n3. Clean the shoes\n3.1\nCleaning materials are selected and applied\naccording to materials specifications.\n\n3.2\nShoes are cleaned in accordance with company\nprocedures.\n\n--- PDF PAGE 101 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n99\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Label\n1.1\nPrinting\n1.2\nEmbroidering\n1.3\nStitching\n1.4\nStickers\n1.5\nEmbossing\n2. Cleaning\n2.1\nWet\n2.2\nDry\n\n--- PDF PAGE 102 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n100\n\nEVIDENCE GUIDE\n1. Critical\naspects\nof\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttached company label to sock lining (and shoe\nlaces, if necessary)\n1.2\nCleaned shoes in accordance with company\nprocedures\n2. Underpinning\nknowledge and\nattitude\n2.1\nSafe work practices\n2.2\nFirst Aid Treatment\n2.3\nSafe handling of tools and materials.\n2.4\nBasic product knowledge\n2.5\nFamiliar with footwear terms\n2.6\nMaterials, tools and equipment used for attaching\nsock lining ( and shoe lace, if necessary)\n2.7\nKnowledge on different footwear cleaning\nprocedures\n2.8\nPositive work values (orderliness and being\norganize, cost, quality and safety conscious,\npatience, etc.)\n3. Underpinning skills\n3.1\nCommunicating and interacting skills\n3.2\nInterpreting work ticket.\n3.3\nCleaning of shoes\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nMaterials relevant to the proposed activity\n4.4\nTools\nand\nequipment\nappropriate\nfor\nsole\nattachment and packing\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation/demonstration of the candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or in a simulated environment or\nin any TESDA accredited assessment center\n\n--- PDF PAGE 103 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n101\n\nUNIT OF COMPETENCY\nPERFORM\nQUALITY\nCHECKING,\nREPAIR\nAND\nPACKING OF DE-LASTED SHOES\nUNIT CODE:\nFWR744326\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitude required in\nperforming quality checking, repairing and packing of de\n– lasted footwear.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect shoes for final\ndispatch\n1.1\nShoes are inspected in accordance with company\nprocedures/requirements.\n\n1.2\nMinor shoe defects/damages are identified and\nsegregated in accordance with standard operating\nprocedures.\n\n1.3\nInspection report accomplished is 100% accurate.\n2. Repair shoe\ndefects/damages\n2.1\nShoe defects/damages are repaired according to\ncompany procedures.\n\n2.2\nRepairing tools and equipment are cleaned and\nstored in accordance with standard operating\nprocedures.\n\n2.3\nRepair reports are accomplished as per company\nprocedures.\n3. Pack shoes in boxes\n3.1\nShoes are packed with packaging materials in\naccordance with standard operating procedures.\n\n3.2\nBoxes are assembled and labeled in accordance\nwith company requirements.\n\n3.3\nDehumidifying agent is put in boxes according to\ncompany procedures.\n\n3.4 Shoe boxes are bundled and marked according to\ncolor, stock and destination.\n\n--- PDF PAGE 104 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n102\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Minor defects/\n damages\n1.1 For Uppers\n1.1.1\nScratches\n1.1.2\nVeins\n1.1.3\nMinor seam bursting\n1.1.4\nCreases\n1.1.5\nKnife cuts\n1.1.6\nOver scouring\n1.1.7\nDiscoloration\n1.1.8\nNeedle scratches\n1.1.9\nBrand marks\n1.1.10\nPoor folding\n1.1.11\nPoor stitching\n1.1.12\nExcess adhesive\n1.1.13\nStitch-marking lines\n1.2 For Bottom\n1.2.1\nDiscoloration due to: scratches, burn\nmarks, cuts, dents\n1.2.2\nDeformities\n2. Repairing tools and\nequipment\n2.1 Scissors\n2.2 Cutter\n2.3 Safety gloves\n2.4 Crepe rubber\n2.5 Ironing rod\n2.6 Ironing board\n2.7 Repairing Materials\n2.7.1\nFaking/repairing crayons\n2.7.2\nDyes\n2.7.3\nCyanoacrylate (Glue or Adhesives)\n2.7.4\nWax\n2.7.5\nSandpaper\n2.7.6\nLiquid detergent\n2.7.7\nRags\n2.7.8\nTap water\n2.7.9\nKerosene\n3 Packaging materials\n3.1 Tissue paper\n3.2 Shoe pad\n3.3 Silica gel\n3.4 Shoe box\n3.5 Shoe tags\n3.6 Labels\n4\nLabel\n4.1 Barcode\n4.2 Stock number\n4.3 Size\n4.4 Color\n4.5 price\n\n--- PDF PAGE 105 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n103\nEVIDENCE GUIDE\n1. Critical\naspects\nof\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Inspected shoes\n1.2 Repaired minor defects/damages to shoes\n1.3 Accomplished reports of inspected and repaired\nshoes\n1.4 Packed shoes in boxes\n2. Underpinning\nknowledge\nand\nattitude\n2.1 Safe work practices\n2.2 First Aid Treatment\n2.3 Basic product knowledge\n2.4 Familiar with footwear terms\n2.5 Quality standards\n2.6 Tools and equipment for repairing and packing of\nshoes\n2.7 Shoe repair procedures\n2.8 Different methods of packaging shoes\n2.9 Positive work values (orderliness and being\norganize, cost, quality and safety consciousness,\npatience, etc.)\n3. Underpinning skills\n3.1 Communicating skills\n3.2 Interpreting work ticket\n3.3 Handling and operating tools and equipment for\nrepairing shoes\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Workplace with proper lighting and ventilation\n4.2 Work ticket\n4.3 Materials relevant to the activity\n4.4 Tools and equipment appropriate for repairing.\n5. Methods of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation/demonstration of the candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2 Portfolio\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or in a simulated environment or in\nTESDA accredited assessment center\n\n--- PDF PAGE 106 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n104"
