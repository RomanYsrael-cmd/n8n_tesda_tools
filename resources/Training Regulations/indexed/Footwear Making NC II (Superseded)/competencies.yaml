        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSet up perforating machine\n1.2\nPerformed perforating and/or gimping operation\n1.3\nMaintained perforating machine in good working\ncondition\n2. Underpinning\nknowledge and attitude\n2.1\nPerforating and gimping operations\n2.2\nTubes and dies used in perforating machine\n2.3\nPerforating machine parts and functions\n2.4\nGimping machine parts and functions\n2.5\nProcedures in replacing tubes and dies\n2.6\nMachine adjustments procedures\n2.7\nGuide adjustments\n2.8\nQuality of punching and gimping\n2.9\nMaintenance Procedures\n2.10 Positive work values (being orderly and organize,\ncost and quality consciousness, attention to details,\npatience, etc.)\n3. Underpinning skills\n3.1\nSelecting type of tube or die based on the\nspecifications on the shoe design and work ticket\n3.2\nOperating perforating and gimping machines\n3.3\nInterpreting work ticket\n3.4\nCommunicating and interacting skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nPerforating machine\n4.4\nTubes and dies\n4.5\nUpper components\n4.6\nMaintenance tools\n5. Methods of\nassessment\n5.1\nCompetency must be assessed through direct\nobservation/\ndemonstration\nof\ncandidate’s\nperformance\nof\nknowledge\nto\ntasks\nand\nquestioning related to underpinning knowledge\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 54 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n52\n\nUNIT OF COMPETENCY:\nPERFORM FOLDING OPERATIONS\nUNIT CODE:"
        },
        "source_text": "FWR744316\nUNIT DESCRIPTOR:\nThis unit covers knowledge, skills and attitudes required\nin operating and maintaining perforating machine and\nchecking quality of perforated or gimped upper\ncomponents\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform machine\nsetting adjustments\n1.1\nMachine is set up as per standard operating\nprocedures and work ticket.\n\n1.2\nMachine operation is tested in accordance with\nmanufacturer's manual.\n\n1.3\nSafety precautions are followed in accordance with\nOH& S requirements.\n2. Place work pieces on\nbench top\n2.1\nWork pieces are stacked according to standard\noperating procedures\n\n2.2\nWork pieces are positioned according to procedure\n3. Perform perforating\noperation\n\n3.1\nPunching is performed without damage to the\ncomponent as per work quality standard.\n\n3.2\nPunched holes size are in accordance with\nspecifications.\n4. Perform gimping\noperation\n4.1\nTask is completed within 30 seconds depending on\nshoe design.\n\n4.2\nGimped edge is cut as per work specification (5mm\nor depending on the allowance provided on the\nupper component).\n\n4.3\nGuide markings between the gimps are visibly\ndone as per standard procedures.\n\n4.4\nGimp crossover cut are done at the cut-off edge as\nper standard procedures\n5. Segregate and bundle\nupper components\n5.1\nUpper components are segregated according to\nsize and parts\n\n5.2\nUpper components are piled up in pairs according\nto sizes and parts and then bundled.\n6. Perform machine\nmaintenance\n6.1\nMachine is cleaned and oiled according to safety\nstandards and manufacturer's manual\n\n6.2\nNylon plate and reduction block are rotated as per\nmanufacturer's manual\n\n--- PDF PAGE 52 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n50\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Machine set-up\n1.1\nPressure\n1.2\nSpacing\n1.3\nAngle of tube\n2. Specifications\n2.1\nSize\n2.2\nDistance\n2.3\nAlignment\n2.4\nComplete penetration of punch\n3. Punched holes\n3.1\nDiamond\n3.2\nTriangle\n3.3\nOblong\n3.4\nDrop\n3.5\nRound\n3.6\nGimp\n3.7\nFan\n\n--- PDF PAGE 53 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n51\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSet up perforating machine\n1.2\nPerformed perforating and/or gimping operation\n1.3\nMaintained perforating machine in good working\ncondition\n2. Underpinning\nknowledge and attitude\n2.1\nPerforating and gimping operations\n2.2\nTubes and dies used in perforating machine\n2.3\nPerforating machine parts and functions\n2.4\nGimping machine parts and functions\n2.5\nProcedures in replacing tubes and dies\n2.6\nMachine adjustments procedures\n2.7\nGuide adjustments\n2.8\nQuality of punching and gimping\n2.9\nMaintenance Procedures\n2.10 Positive work values (being orderly and organize,\ncost and quality consciousness, attention to details,\npatience, etc.)\n3. Underpinning skills\n3.1\nSelecting type of tube or die based on the\nspecifications on the shoe design and work ticket\n3.2\nOperating perforating and gimping machines\n3.3\nInterpreting work ticket\n3.4\nCommunicating and interacting skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace with proper lighting and ventilation\n4.2\nWork ticket\n4.3\nPerforating machine\n4.4\nTubes and dies\n4.5\nUpper components\n4.6\nMaintenance tools\n5. Methods of\nassessment\n5.1\nCompetency must be assessed through direct\nobservation/\ndemonstration\nof\ncandidate’s\nperformance\nof\nknowledge\nto\ntasks\nand\nquestioning related to underpinning knowledge\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nworkplace or in a simulated workplace setting or in\nany TESDA accredited assessment center\n\n--- PDF PAGE 54 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n52\n\nUNIT OF COMPETENCY:\nPERFORM FOLDING OPERATIONS\nUNIT CODE:"
