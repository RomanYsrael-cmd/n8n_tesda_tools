      "number": "4",
      "text": "5 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”. --- PDF PAGE 119 --- _________________________________________________________________________________________________ TR Footwear Making NC II 12/07/04 promulgated 12/09/04 115 Apply footwear production practices and principles Set up and operate machines Perform basic maintenance Apply quality standards Carry out measurements and calculation C O RE C O M PE TE N CI ES C O M M O N C O M PE TE N CI ES Use and care of hand and power tools Perform Upper Leather Splitting Operation Perform Seam Rubbing Operation Perform Eyeleting Operation Perform Stamping Operation Perform Folding Operation Perform Blocking / Crimping Check Cut Upper and Lining Components Perform Skiving Operation Perform Machine Perforating and Gimping Operation Attach Insole by Machine Mark Upper and Lining Components Perform Basic Machine Lasting Perform Toe-Puff and Stiffeners Activation Apply Edge Inking Perform Manual Perforating and Gimping Operation Prepare Upper for Handlasting Perform Pre-bonding Operation Perform Chilling Operation Perform Stitching Operation on Upper and Lining Components Perform Bonding Operation Perform Hand Stitching Operation Perform Polishing Operation Perform Sock Attachment and Cleaning Operation Perform Quality Checking, Repair and Packing of De-lasted Shoes Perform Heel Attaching Operation Cut Leather by Hand Cut by Machine Make Footwear Design Make Footwear Pattern Grade Footwear Pattern Perform Basic Handlasting Lead workplace communication Work with others Work in team environment Lead small teams Solve problems related to work activities Receive and respond to workplace communication Participate in workplace communication C S Apply problem solving techniques to workplace Plan and organize work Practice career professionalism Demonstrate work values Practice occupational health and safety procedures Develop and practice negotiation skills Use mathematical method Use relevant technologies Utilize specialized communication skills Develop team and individual Collect, analyze and organize information Promote environmental protection Practice basic housekeeping procedures --- PDF PAGE 120 --- _________________________________________________________________________________________________ TR Footwear Making NC II 12/07/04 promulgated 12/09/04 116 Attaching is the temporary joining together of components using an adhesive until they can be stitched Bottom the sole, insole, heel of the shoe Blocking/Crimping performed on a high fronted vamp to improve shape and fit and to achieve greater curvature of upper Bonding Attaching of lasted sole to upper using adhesives Counter refers to a component stitched to the rear of the quarters to give added stiffness specially in brogue shoes. De-lasting the process of removing the finished shoe from the last after sole attaching or finishing Eyelet a ring of metal or other material inserted in the shoe upper to provide a durable ring for lace holes Folding an upper edge treatment where a narrow margin of the edge is folded over and secured by adhesive Gimping a decorative margin like a row of saw teeth cut into an upper component where it overlays another component, as in a brogue shoe Heel seat part of the footwear bottom, it may either be attached separately or may be an integral part of the sole and may be of various types ( Spanish, Louis, wedge, etc.) The heel tip/top lift is an integral part of the heel. Insole a structural sole member of the sole between the foot and the outsole. May be of leather, fiberboard, leather board or synthetic material of various kinds. Its moisture absorbent qualities are considered to be important for foot health and comfort Last the generalized approximate foot form or mould on which a boot or shoe is made Lasting the shaping of the upper tightly to the contour of the last and pulling and stretching the upper to avail bunches or wrinkles by machine Lining the inside material used under the upper and generally cut to the same shape of upper, giving certain allowances. Linings are made of leather, fabric or man-made materials Seam Rubbing the process of flattening or rubbing down of back seam of components to avoid ridges/impressions on the upper --- PDF PAGE 121 --- _________________________________________________________________________________________________ TR Footwear Making NC II 12/07/04 promulgated 12/09/04 117 Skiving used to reduce edge substance to create smooth joining between two components Sole layer of materials that covers the bottom of shoe and is the walking surface of the shoe Splitting dividing an upper or bottom component into two or more parts by cutting it through its thickness parallel to the surface Stamping used for identification during manufacturing. Necessary to provide information without detracting from appearance of footwear Stitching/Closing is the permanent joining parts together by use of threads Toe-Puff stiffening material, usually of impregnated fabric, fiberboard or printed-on plastic, under the toe part of the upper (in between the upper and lining) to help shape retention, appearance and protect the toes. Upper is the top part of the shoe including lining, reinforcement and accessories Vamp the part of the upper between the toe cap and the quarters, including the toe in the case of capless style subjected to maximum flexing while walking --- PDF PAGE 122 --- _________________________________________________________________________________________________ TR Footwear Making NC II 12/07/04 promulgated 12/09/04 118 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations."
