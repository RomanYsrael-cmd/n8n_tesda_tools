  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Footwear Making NC II, the candidate\nmust demonstrate competence through project-type assessment covering all the\nunits listed in Section 1. Successful candidates shall be awarded National\nCertificate signed by the TESDA Director General\n\n4.2\nThe qualification of Footwear Making NC II may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in all the\nfollowing areas:\n\n4.2.1.1\nAssemble Footwear Upper Components\n4.2.1.1.1 Check cut upper and lining components\n4.2.1.1.2 Perform blocking/crimping\n4.2.1.1.3 Perform skiving operations\n4.2.1.1.4 Perform upper leather splitting operation\n4.2.1.1.5 Perform machine perforating and gimping operation\n4.2.1.1.6 Perform folding operation\n4.2.1.1.7 Perform stitching operation on upper and/or lining\ncomponents\n4.2.1.1.8 Perform hand stitching operation\n4.2.1.2\nPerform Footwear Lasting by Machine and by Hand\n4.2.1.2.1 Prepare uppers for hand lasting\n4.2.1.2.2 Perform basic hand lasting\n4.2.1.2.3 Attach insole by machine\n4.2.1.2.4 Perform toe-puff and stiffener activation\n4.2.1.2.5 Perform basic machine lasting\n4.2.1.2.6 Perform chilling operation\n4.2.1.2.7 Perform pre-bonding operations\n4.2.1.2.8 Perform bonding operations\n4.2.1.2.9 Perform heel attaching operations\n\n4.2.1.3\nPerform Footwear Finishing Operations\n4.2.1.3.1 Perform sock attachment and cleaning operation\n4.2.1.3.2 Perform polishing operation\n4.2.1.3.3 Perform quality checking, repairing and packaging of de-lasted\nshoes\n\nSuccessful candidates shall be awarded Certificates of\nCompetency (COC).\n\n4.2.2 Demonstration of competence through project-type assessment covering\nall the required units of qualification.\n\n--- PDF PAGE 118 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n116\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 119 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n115\nApply footwear\nproduction practices\nand principles\nQUALIFICATION\nFOOTWEAR MAKING NC II\nSet up and\noperate\nmachines\nPerform\nbasic\nmaintenance\nApply\nquality\nstandards\nCarry out\nmeasurements\nand calculation\nC\nO\nRE\nC\nO\nM\nPE\nTE\nN\nCI\nES\nC\nO\nM\nM\nO\nN\nC\nO\nM\nPE\nTE\nN\nCI\nES\nUse and care\nof hand and\npower tools\nPerform Upper\nLeather\nSplitting\nOperation\nPerform Seam\nRubbing\nOperation\nPerform\nEyeleting\nOperation\nPerform\nStamping\nOperation\nPerform\nFolding\nOperation\nPerform\nBlocking /\nCrimping\nCheck Cut Upper\nand Lining\nComponents\nPerform\nSkiving\nOperation\nPerform Machine\nPerforating and\nGimping\nOperation\nAttach\nInsole\nby\nMachine\nMark Upper and\nLining\nComponents\n Perform Basic\nMachine Lasting\n Perform Toe-Puff\nand Stiffeners\nActivation\nApply Edge\nInking\nPerform Manual\n Perforating and\nGimping Operation\n Prepare Upper\nfor Handlasting\nPerform\nPre-bonding\nOperation\n Perform\nChilling\nOperation\nPerform Stitching\nOperation on\nUpper and Lining\nComponents\nPerform\nBonding\nOperation\nPerform Hand\nStitching\nOperation\nPerform\nPolishing\nOperation\nPer