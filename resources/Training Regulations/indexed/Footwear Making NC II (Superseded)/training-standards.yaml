13\npcs.\n5\npcs.\n Shoe iron\n\n1 box\nNail (heel)\n25\npcs.\nAdhesive\nbrush\n\n75\npairs\nShoe upper\n\n25\npairs\nShoe last\n25\npcs.\nAdhesive\ndispenser\n\n3 rolls\neach\nSilver and gold\nfoil\n1 gal.\nadhesive\n\n1\nsheet\n4 mm thick\nfoam\n\n 5\npcs.\nPolishing wax\n2 kls.\nrug\n\n 5 pcs.\n Shoe polisher\n5 pcs.\nCrepe rubber\n\n25\npcs.\nSafety gloves\n2 qrtz.\nFinishing oil\n\n1 box\nFaking crayon\n(assorted\ncolor)\n** Machine/Equipment may be available at workshops of industry partners."
