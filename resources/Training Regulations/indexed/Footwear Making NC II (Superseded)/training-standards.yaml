  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Footwear Making NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FOOTWEAR MAKING\n NC Level: NC II\n\nNominal Training Hours: 18 hours (Basic)\n\n 24 hours (Common)\n\n 640 hours (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of a\nfootwear maker in accordance with industry standards. It covers core competencies\nsuch as check cut upper and lining components, perform blocking and crimping\noperation, perform skiving operations, perform leather splitting, perform machine\nperforating and gimping operation, perform folding operation, perform stitching\noperation on upper and/or lining components, perform hand stitching operation,\nprepare upper for hand lasting, perform basic hand lasting, attach insole by\nmachine, perform puff and stiffener activation, perform basic machine lasting,\nperform chilling operation, perform pre-bonding operation, perform bonding\noperation, perform heel attaching operation, perform sock attachment and cleaning\noperation, perform polishing operation, perform quality check, repair and packaging\nof de-lasted shoes.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1\nParticipate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n\n1.2 Complete relevant work\nrelated documents.\n\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and responsibility in\na team.\n\n2.2 Describe work as a team\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 107 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n105\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with organizational\ngoals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth\n.\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n\n4.3 Maintain occupational\nhealth and safety awareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning\nOutcomes\n\nMethodology\nAssessment\nApproach\n1. Apply footwear\nproduction\npractices and\nprinciples\n\n1.5 Apply\nknowledge of\nfootwear\nproducts and\nsystems in the\nworkplace\n1.6 Demonstrate\nproductive work\npractices\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n2. Carry out\nmeasurements\nand calculations\n2.1 Obtain\nmeasurements\n2.2 Perform simple\ncalculations\n2.3 Estimate\napproximate\nquantities\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n3. Use & care for\nhand and power\ntools\n3.1 Select\nappropriate\ntools for work\n3.2 Use hand and\npower tools\n3.3 Follow safety\nand hazard\ncontrol\nprocedures\n3.4 Care for hand\nand power tools\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n\n--- PDF PAGE 108 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n106\n\n4. Set-up and\noperate\nmachines\n4.1 Set machines\n4.2 Conduct\nsample run\n4.3 Test machine\noutput\n4.4 Re-adjust\nmachine setting\nto meet\nrequirements\n4.5 Maintain\nrecords\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n5. Perform basic\nmaintenance\n5.1 Perform\nmachine\nadjustments\n5.2 Clean and\noperate\nmachine\n5.3 Check machine\noperation\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n6. Apply quality\nstandard\n6.1 Assess own\nwork\n6.2 Assess quality\nof received\ncomponents\nparts\n6.3 Record\ninformation\n6.4 Study causes of\nquality\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n\nCORE COMPETENCIES\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n1. Check cut\nupper and\nlining\ncomponents\n1.1 Inspect received\n cut upper and lining\n components.\n\n1.2 Segregate cut upper\n and lining\n component\n\n1.3 Bundle cut upper\n and lining\n components\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstratio\nn with oral\nquestioning\n\n--- PDF PAGE 109 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n107\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform\n blocking\n /crimping\n operation\n2.1 Prepare machine\n and upper for\n blocking\n\n2.2 Perform blocking\n operations\n2.3 Perform /trimming of\nvamps\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n3. Perform\nSkiving\noperations\n3.1 Perform machine\n procedures\n\n3.2 Skive components\n\n3.3 Perform machine\n maintenance\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n4. Perform\n leather\n splitting\n4.1 Perform machine\n setting procedures\n\n4.2 Perform splitting\n operations\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\nDemonstration\nwith oral\nquestioning\n5. Perform\n machine\n perforating\n and\n gimping\n operation\n5.1 Perform machine\n setting\n\n5.2 Perform perforating\n operation\n\n5.3 Perform gimping\n operation\n\n5.4 Perform machine\n maintenance\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n6. Perform\nfolding\noperation\n6.1 Prepare the\n components for\n folding\n\n6.2 Fold components\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n7. Perform\nstitching\noperation on\nupper and/or\nlining\ncomponents\n7.1 Prepare machine for\n stitching\n\n7.2 Stitch upper and /or\n lining components\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 110 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n108\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n8. Perform\nhand stitching\noperation\n8.1 Prepare shoe upper\n\n8.2 Select hand\nstitching tools and\nmaterials\n\n8.3 Perform hand\n stitching\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n9. Prepare\nupper for\nhand lasting\n9.1 Prepare toe puff and\n stiffeners.\n\n9.2 Attach toe puff and\n stiffeners to shoe\n upper.\n\n9.3 Prepare and attach\n insole to shoe last\n using tacks.\n\n9.4 Position shoe upper\nto shoe last.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n10. Perform basic\nhand lasting\n10.1 Attach upper to\ninsole/last\n10.2 Apply adhesive to\nupper components\nand insole\n10.3 Carry out toe lasting\n10.4 Perform seat and\nside lasting\n10.5 Flatten upper to\nfeather edge\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n11. Attach insole\nby machine\n11.1 Set insole attaching\nmachine\n11.2 Attach insole\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n12. Perform toe\npuff and\nstiffener\nactivation\n12.1 Prepare machine\n\n12.2 Activate toe\n puff/stiffeners\n12.3 Prepare workpieces\n to transport for the\n next stage.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 111 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n109\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n13. Perform basic\nmachine\nlasting\n13.1 Attach shoe upper\nto shoe last with\ninsole.\n\n13.2 Set machine for\n lasting\n13.3 Carry-out toe\nlasting\n\n13.4 Perform seat and\nside lasting.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n14. Perform\nchilling\noperation\n14.1 Set chilling machine\n\n14.2 Monitor chilling\n operation\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n15 Perform pre-\nbonding\noperation\n15.1 Perform roughing\nand scouring\n\n15.2 Perform bottom\n cementing and filler\n attachment\n\n15.3 Perform sole wiping\n and cementing\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n16 Perform\nbonding\noperation\n\n16.1 Perform sole\n attaching and\n pressing\n\n16.2. Perform edge\n cleaning operations\n\n16.3. Perform de-lasting\n and inspection of\n shoes\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n17 Perform heel\nattaching\noperation\n17.1 Prepare\nworkpieces\n\n17.2 Attach heel to sole\n\n17.3 Fix heel to sole\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 112 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n110\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n18. Perform\npolishing\noperation\n18.1 Prepare shoe, and\n polishing materials\n (chemicals)\n18.2 Apply polishing\n chemicals\n18.3 Perform polishing\n and brushing\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n19. Perform sock\nattachment\nand cleaning\noperation\n19.1 Prepare and attach\n sock lining in the\n shoes.\n\n19.2 Clean shoes\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n20. Perform\nquality\nchecking,\nrepairing and\npackaging of\nde-lasted\nshoes.\n20.1 Inspect shoes for\n final dispatch\n20.2 Repair (minor)\n shoe defects\n20.3 Pack shoes on\n their appropriate\n boxes\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n--- PDF PAGE 113 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n111\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• can communicate both orally and in written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school of training center delivering the TVET program.\n\n--- PDF PAGE 114 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n112\n3.4 LIST OF TOOLS,EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor.\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25\npcs.\n Trimming\nScissors\n5 units\n Indust’l. sewing\nmachine\n25\npacks\n Needles\n2\npcs.\nBall rubbing\ntool\n 1 unit\n** Skiving machine\n5\ncones\n Thread\n1\npc.\n Honing\nstick\n 2 units\n Working table\n(1X 3 m.)\n25\npairs\n Cut upper &\nlining\nComponents\n(leather)\n1\npc\n Automatic\nNumbering\nmachine\n(manual)\n\n1 unit\n**Perforating/gimping\nmachine\n25\npcs.\n Plastic tray\n25\npcs.\nScissors\n1 unit\n**Splitting machine\n25\npcs.\nMarble slabs\n25\npcs.\nAwl\n1 unit\n**Blocking/crimping\nmachine\n25\npcs.\nProtective\nmask\n25\npcs.\nFolding\nhammer\n1 unit\n**Toe lasting\nmachine/accessories\n1 gal.\nAdhesive\n25\npcs.\nAdhesive\nbrush\n1 unit\n**Seat lasting\nmachine/accessories\n1 roll\nReinforcement\ntape\n1 set\nDiamond\npuncher\n1 unit\nRoughing machine\n3\nsheets\nSolvent based\nstiffeners\n1 set\nTriangle\npuncher\n1 unit\nPressing machine\n1 gal.\nsolvent\n1 set\nRound\npuncher\n1 unit\nShoe maker table\n1 gal.\nadhesive\n25\npcs.\nShoe\nhammer\n1 unit\nShoe rack\n50 pcs\nStitching\nneedle\n(pangkustura)\n5\npcs.\nSpring\ndivider\n1 unit\nStamping machine\n(with accessories)\n5 pcs.\nBeeswax\n(pagkit)\n 25\npcs.\nTacks\nlifter/puller\n1 unit\n Polishing machine\n10\nspool\nCotton thread\n 25\npcs.\nCutting\nknife\n1 unit\nSpray gun\n3\nsheets\nSliced foam\n 25\npcs.\nCutting\nboard\n1 unit\nAir compressor\n3\nsheets\nInsole board\n 25\npcs.\nAwl\n1 unit\n Cotton roller\n1 roll\nPlastic\n 25\npcs.\nLasting\npincer\n\n1 gal.\nprimer\n 25\npcs.\nAdhesive\nbrush\n\n1 kl.\nLast powder\n 25\nPlastic box\n25 pcs\nSilver pen\n\n--- PDF PAGE 115 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n113\npcs.\n5\npcs.\n Shoe iron\n\n1 box\nNail (heel)\n25\npcs.\nAdhesive\nbrush\n\n75\npairs\nShoe upper\n\n25\npairs\nShoe last\n25\npcs.\nAdhesive\ndispenser\n\n3 rolls\neach\nSilver and gold\nfoil\n1 gal.\nadhesive\n\n1\nsheet\n4 mm thick\nfoam\n\n 5\npcs.\nPolishing wax\n2 kls.\nrug\n\n 5 pcs.\n Shoe polisher\n5 pcs.\nCrepe rubber\n\n25\npcs.\nSafety gloves\n2 qrtz.\nFinishing oil\n\n1 box\nFaking crayon\n(assorted\ncolor)\n** Machine/Equipment may be available at workshops of industry partners.\n\n3.5 TRAINING FACILITIES\n FOOTWEAR MAKING NC – II\n\nThe workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\n Shop area\n 6 X 10\n60\n\n60\nTool Room & S/M Storage\nArea\n2 X 4\n8\n\n8\nLearning Resource Area\n5 X 9\n45\n\n45\nWash Area /Comfort Room\n(male & female)\n2.5 X 4\n10\n\n10\nTotal\n\n123\nCirculation Area**\n\n37\nTotal Workshop Area\n\n160\n\n--- PDF PAGE 116 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n114\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS FOR FOOTWEAR MAKING NC II\n\nTRAINER QUALIFICATION (TQ II)\n\nTo qualify as trainer for footwear making NC II, the person must:\n• be a holder of NC II\n• have undergone training on Training Methodology II (TM II)\n• be physically and mentally fit\n• * have at least 1 year job/industry experience\n• be a civil service eligible (for government position or appropriate professional\nlicense issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 117 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n115"
