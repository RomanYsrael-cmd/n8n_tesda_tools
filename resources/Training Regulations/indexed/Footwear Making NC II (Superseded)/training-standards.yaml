    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FOOTWEAR MAKING\n NC Level: NC II\n\nNominal Training Hours: 18 hours (Basic)\n\n 24 hours (Common)\n\n 640 hours (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of a\nfootwear maker in accordance with industry standards. It covers core competencies\nsuch as check cut upper and lining components, perform blocking and crimping\noperation, perform skiving operations, perform leather splitting, perform machine\nperforating and gimping operation, perform folding operation, perform stitching\noperation on upper and/or lining components, perform hand stitching operation,\nprepare upper for hand lasting, perform basic hand lasting, attach insole by\nmachine, perform puff and stiffener activation, perform basic machine lasting,\nperform chilling operation, perform pre-bonding operation, perform bonding\noperation, perform heel attaching operation, perform sock attachment and cleaning\noperation, perform polishing operation, perform quality check, repair and packaging\nof de-lasted shoes.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1\nParticipate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n\n1.2 Complete relevant work\nrelated documents.\n\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and responsibility in\na team.\n\n2.2 Describe work as a team\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 107 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n105\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with organizational\ngoals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth\n.\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n\n4.3 Maintain occupational\nhealth and safety awareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning\nOutcomes\n\nMethodology\nAssessment\nApproach\n1. Apply footwear\nproduction\npractices and\nprinciples\n\n1.5 Apply\nknowledge of\nfootwear\nproducts and\nsystems in the\nworkplace\n1.6 Demonstrate\nproductive work\npractices\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n2. Carry out\nmeasurements\nand calculations\n2.1 Obtain\nmeasurements\n2.2 Perform simple\ncalculations\n2.3 Estimate\napproximate\nquantities\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n3. Use & care for\nhand and power\ntools\n3.1 Select\nappropriate\ntools for work\n3.2 Use hand and\npower tools\n3.3 Follow safety\nand hazard\ncontrol\nprocedures\n3.4 Care for hand\nand power tools\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n\n--- PDF PAGE 108 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n106\n\n4. Set-up and\noperate\nmachines\n4.1 Set machines\n4.2 Conduct\nsample run\n4.3 Test machine\noutput\n4.4 Re-adjust\nmachine setting\nto meet\nrequirements\n4.5 Maintain\nrecords\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n5. Perform basic\nmaintenance\n5.1 Perform\nmachine\nadjustments\n5.2 Clean and\noperate\nmachine\n5.3 Check machine\noperation\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n6. Apply quality\nstandard\n6.1 Assess own\nwork\n6.2 Assess quality\nof received\ncomponents\nparts\n6.3 Record\ninformation\n6.4 Study causes of\nquality\nGroup discussion\nInteraction\nObservation\nDemonstration\nInterviews/\nQuestioning\n\nCORE COMPETENCIES\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n1. Check cut\nupper and\nlining\ncomponents\n1.1 Inspect received\n cut upper and lining\n components.\n\n1.2 Segregate cut upper\n and lining\n component\n\n1.3 Bundle cut upper\n and lining\n components\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstratio\nn with oral\nquestioning\n\n--- PDF PAGE 109 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n107\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform\n blocking\n /crimping\n operation\n2.1 Prepare machine\n and upper for\n blocking\n\n2.2 Perform blocking\n operations\n2.3 Perform /trimming of\nvamps\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n3. Perform\nSkiving\noperations\n3.1 Perform machine\n procedures\n\n3.2 Skive components\n\n3.3 Perform machine\n maintenance\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n4. Perform\n leather\n splitting\n4.1 Perform machine\n setting procedures\n\n4.2 Perform splitting\n operations\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\nDemonstration\nwith oral\nquestioning\n5. Perform\n machine\n perforating\n and\n gimping\n operation\n5.1 Perform machine\n setting\n\n5.2 Perform perforating\n operation\n\n5.3 Perform gimping\n operation\n\n5.4 Perform machine\n maintenance\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n6. Perform\nfolding\noperation\n6.1 Prepare the\n components for\n folding\n\n6.2 Fold components\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n7. Perform\nstitching\noperation on\nupper and/or\nlining\ncomponents\n7.1 Prepare machine for\n stitching\n\n7.2 Stitch upper and /or\n lining components\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 110 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n108\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n8. Perform\nhand stitching\noperation\n8.1 Prepare shoe upper\n\n8.2 Select hand\nstitching tools and\nmaterials\n\n8.3 Perform hand\n stitching\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n9. Prepare\nupper for\nhand lasting\n9.1 Prepare toe puff and\n stiffeners.\n\n9.2 Attach toe puff and\n stiffeners to shoe\n upper.\n\n9.3 Prepare and attach\n insole to shoe last\n using tacks.\n\n9.4 Position shoe upper\nto shoe last.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n10. Perform basic\nhand lasting\n10.1 Attach upper to\ninsole/last\n10.2 Apply adhesive to\nupper components\nand insole\n10.3 Carry out toe lasting\n10.4 Perform seat and\nside lasting\n10.5 Flatten upper to\nfeather edge\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n11. Attach insole\nby machine\n11.1 Set insole attaching\nmachine\n11.2 Attach insole\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n12. Perform toe\npuff and\nstiffener\nactivation\n12.1 Prepare machine\n\n12.2 Activate toe\n puff/stiffeners\n12.3 Prepare workpieces\n to transport for the\n next stage.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 111 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n109\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n13. Perform basic\nmachine\nlasting\n13.1 Attach shoe upper\nto shoe last with\ninsole.\n\n13.2 Set machine for\n lasting\n13.3 Carry-out toe\nlasting\n\n13.4 Perform seat and\nside lasting.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n14. Perform\nchilling\noperation\n14.1 Set chilling machine\n\n14.2 Monitor chilling\n operation\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n15 Perform pre-\nbonding\noperation\n15.1 Perform roughing\nand scouring\n\n15.2 Perform bottom\n cementing and filler\n attachment\n\n15.3 Perform sole wiping\n and cementing\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n16 Perform\nbonding\noperation\n\n16.1 Perform sole\n attaching and\n pressing\n\n16.2. Perform edge\n cleaning operations\n\n16.3. Perform de-lasting\n and inspection of\n shoes\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n17 Perform heel\nattaching\noperation\n17.1 Prepare\nworkpieces\n\n17.2 Attach heel to sole\n\n17.3 Fix heel to sole\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 112 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n110\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n18. Perform\npolishing\noperation\n18.1 Prepare shoe, and\n polishing materials\n (chemicals)\n18.2 Apply polishing\n chemicals\n18.3 Perform polishing\n and brushing\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n19. Perform sock\nattachment\nand cleaning\noperation\n19.1 Prepare and attach\n sock lining in the\n shoes.\n\n19.2 Clean shoes\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n20. Perform\nquality\nchecking,\nrepairing and\npackaging of\nde-lasted\nshoes.\n20.1 Inspect shoes for\n final dispatch\n20.2 Repair (minor)\n shoe defects\n20.3 Pack shoes on\n their appropriate\n boxes\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning"
