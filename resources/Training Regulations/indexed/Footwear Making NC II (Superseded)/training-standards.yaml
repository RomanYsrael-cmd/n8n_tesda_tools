al\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 112 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n110\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n18. Perform\npolishing\noperation\n18.1 Prepare shoe, and\n polishing materials\n (chemicals)\n18.2 Apply polishing\n chemicals\n18.3 Perform polishing\n and brushing\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n19. Perform sock\nattachment\nand cleaning\noperation\n19.1 Prepare and attach\n sock lining in the\n shoes.\n\n19.2 Clean shoes\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n20. Perform\nquality\nchecking,\nrepairing and\npackaging of\nde-lasted\nshoes.\n20.1 Inspect shoes for\n final dispatch\n20.2 Repair (minor)\n shoe defects\n20.3 Pack shoes on\n their appropriate\n boxes\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n--- PDF PAGE 113 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n111\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• can communicate both orally and in written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school of training center delivering the TVET program.\n\n--- PDF PAGE 114 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n112\n3.4 LIST OF TOOLS,EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor.\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25\npcs.\n Trimming\nScissors\n5 units\n Indust’l. sewing\nmachine\n25\npacks\n Needles\n2\npcs.\nBall rubbing\ntool\n 1 unit\n** Skiving machine\n5\ncones\n Thread\n1\npc.\n Honing\nstick\n 2 units\n Working table\n(1X 3 m.)\n25\npairs\n Cut upper &\nlining\nComponents\n(leather)\n1\npc\n Automatic\nNumbering\nmachine\n(manual)\n\n1 unit\n**Perforating/gimping\nmachine\n25\npcs.\n Plastic tray\n25\npcs.\nScissors\n1 unit\n**Splitting machine\n25\npcs.\nMarble slabs\n25\npcs.\nAwl\n1 unit\n**Blocking/crimping\nmachine\n25\npcs.\nProtective\nmask\n25\npcs.\nFolding\nhammer\n1 unit\n**Toe lasting\nmachine/accessories\n1 gal.\nAdhesive\n25\npcs.\nAdhesive\nbrush\n1 unit\n**Seat lasting\nmachine/accessories\n1 roll\nReinforcement\ntape\n1 set\nDiamond\npuncher\n1 unit\nRoughing machine\n3\nsheets\nSolvent based\nstiffeners\n1 set\nTriangle\npuncher\n1 unit\nPressing machine\n1 gal.\nsolvent\n1 set\nRound\npuncher\n1 unit\nShoe maker table\n1 gal.\nadhesive\n25\npcs.\nShoe\nhammer\n1 unit\nShoe rack\n50 pcs\nStitching\nneedle\n(pangkustura)\n5\npcs.\nSpring\ndivider\n1 unit\nStamping machine\n(with accessories)\n5 pcs.\nBeeswax\n(pagkit)\n 25\npcs.\nTacks\nlifter/puller\n1 unit\n Polishing machine\n10\nspool\nCotton thread\n 25\npcs.\nCutting\nknife\n1 unit\nSpray gun\n3\nsheets\nSliced foam\n 25\npcs.\nCutting\nboard\n1 unit\nAir compressor\n3\nsheets\nInsole board\n 25\npcs.\nAwl\n1 unit\n Cotton roller\n1 roll\nPlastic\n 25\npcs.\nLasting\npincer\n\n1 gal.\nprimer\n