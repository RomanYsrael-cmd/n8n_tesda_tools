      "source_text": "3.5 TRAINING FACILITIES\n FOOTWEAR MAKING NC – II\n\nThe workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\n Shop area\n 6 X 10\n60\n\n60\nTool Room & S/M Storage\nArea\n2 X 4\n8\n\n8\nLearning Resource Area\n5 X 9\n45\n\n45\nWash Area /Comfort Room\n(male & female)\n2.5 X 4\n10\n\n10\nTotal\n\n123\nCirculation Area**\n\n37\nTotal Workshop Area\n\n160\n\n--- PDF PAGE 116 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n114\n** Area requirement is equivalent to 30% of the total teaching/learning areas"
