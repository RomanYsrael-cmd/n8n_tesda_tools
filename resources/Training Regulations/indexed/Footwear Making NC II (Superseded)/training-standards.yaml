l\nquestioning\n\n6. Perform\nfolding\noperation\n6.1 Prepare the\n components for\n folding\n\n6.2 Fold components\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n7. Perform\nstitching\noperation on\nupper and/or\nlining\ncomponents\n7.1 Prepare machine for\n stitching\n\n7.2 Stitch upper and /or\n lining components\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 110 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n108\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n8. Perform\nhand stitching\noperation\n8.1 Prepare shoe upper\n\n8.2 Select hand\nstitching tools and\nmaterials\n\n8.3 Perform hand\n stitching\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n9. Prepare\nupper for\nhand lasting\n9.1 Prepare toe puff and\n stiffeners.\n\n9.2 Attach toe puff and\n stiffeners to shoe\n upper.\n\n9.3 Prepare and attach\n insole to shoe last\n using tacks.\n\n9.4 Position shoe upper\nto shoe last.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n10. Perform basic\nhand lasting\n10.1 Attach upper to\ninsole/last\n10.2 Apply adhesive to\nupper components\nand insole\n10.3 Carry out toe lasting\n10.4 Perform seat and\nside lasting\n10.5 Flatten upper to\nfeather edge\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n11. Attach insole\nby machine\n11.1 Set insole attaching\nmachine\n11.2 Attach insole\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n12. Perform toe\npuff and\nstiffener\nactivation\n12.1 Prepare machine\n\n12.2 Activate toe\n puff/stiffeners\n12.3 Prepare workpieces\n to transport for the\n next stage.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 111 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n109\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n13. Perform basic\nmachine\nlasting\n13.1 Attach shoe upper\nto shoe last with\ninsole.\n\n13.2 Set machine for\n lasting\n13.3 Carry-out toe\nlasting\n\n13.4 Perform seat and\nside lasting.\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n14. Perform\nchilling\noperation\n14.1 Set chilling machine\n\n14.2 Monitor chilling\n operation\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n15 Perform pre-\nbonding\noperation\n15.1 Perform roughing\nand scouring\n\n15.2 Perform bottom\n cementing and filler\n attachment\n\n15.3 Perform sole wiping\n and cementing\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n16 Perform\nbonding\noperation\n\n16.1 Perform sole\n attaching and\n pressing\n\n16.2. Perform edge\n cleaning operations\n\n16.3. Perform de-lasting\n and inspection of\n shoes\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n17 Perform heel\nattaching\noperation\n17.1 Prepare\nworkpieces\n\n17.2 Attach heel to sole\n\n17.3 Fix heel to sole\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 112 ---\n_________________________________________________________________________________________________\nTR Footwear Making NC II 12/07/04 promulgated 12/09/04\n\n110\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodology\nAssessment\nApproach\n18. Perform\npolishing\noperation\n18.1 Prepare shoe, and\n polishing materials\n (chemicals)\n18.2 Apply polishing\n chemicals\n18.3 Perform polishing\n and brushing\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n19. Perform sock\nattachment\nand cleaning\noperation\n19.1 Prepare and attach\n sock lining in the\n shoes.\n\n19.2 Clean shoes\n\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning\n20. Perform\nquality\nchecking,\nrepairing and\npackaging of\nde-lasted\nshoes.\n20.1 Inspect shoes for\n final dispatch\n20.2 Repair (minor)\n shoe defects\n20.3 Pack shoes on\n their appropriate\n boxes\nDiscussion\nDemonstration\n\n• Observation\nwith oral\nquestioning\n• Demonstration\nwith oral\nquestioning",
