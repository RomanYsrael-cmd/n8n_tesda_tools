{
  "present": true,
  "entries": [
    {
      "term": "Attaching",
      "definition": "is the temporary joining together of components using an adhesive until they can be stitched"
    },
    {
      "term": "Bottom",
      "definition": "the sole, insole, heel of the shoe"
    },
    {
      "term": "Blocking/Crimping",
      "definition": "performed on a high fronted vamp to improve shape and fit and to achieve greater curvature of upper"
    },
    {
      "term": "Bonding",
      "definition": "Attaching of lasted sole to upper using adhesives"
    },
    {
      "term": "Counter",
      "definition": "refers to a component stitched to the rear of the quarters to give added stiffness specially in brogue shoes."
    },
    {
      "term": "De-lasting",
      "definition": "the process of removing the finished shoe from the last after sole attaching or finishing"
    },
    {
      "term": "Eyelet",
      "definition": "a ring of metal or other material inserted in the shoe upper to provide a durable ring for lace holes"
    },
    {
      "term": "Folding",
      "definition": "an upper edge treatment where a narrow margin of the edge is folded over and secured by adhesive"
    },
    {
      "term": "Gimping",
      "definition": "a decorative margin like a row of saw teeth cut into an upper component where it overlays another component, as in a brogue shoe"
    },
    {
      "term": "Heel",
      "definition": "seat part of the footwear bottom, it may either be attached separately or may be an integral part of the sole and may be of various types ( Spanish, Louis, wedge, etc.) The heel tip/top lift is an integral part of the heel."
    },
    {
      "term": "Insole",
      "definition": "a structural sole member of the sole between the foot and the outsole. May be of leather, fiberboard, leather board or synthetic material of various kinds. Its moisture absorbent qualities are considered to be important for foot health and comfort"
    },
    {
      "term": "Last",
      "definition": "the generalized approximate foot form or mould on which a boot or shoe is made"
    },
    {
      "term": "Lasting",
      "definition": "the shaping of the upper tightly to the contour of the last and pulling and stretching the upper to avail bunches or wrinkles by machine"
    },
    {
      "term": "Lining",
      "definition": "the inside material used under the upper and generally cut to the same shape of upper, giving certain allowances. Linings are made of leather, fabric or man-made materials"
    },
    {
      "term": "Seam Rubbing",
      "definition": "the process of flattening or rubbing down of back seam of components to avoid ridges/impressions on the upper TR Footwear Making NC II 12/07/04 promulgated 12/09/04"
    },
    {
      "term": "Skiving",
      "definition": "used to reduce edge substance to create smooth joining between two components"
    },
    {
      "term": "Sole",
      "definition": "layer of materials that covers the bottom of shoe and is the walking surface of the shoe"
    },
    {
      "term": "Splitting",
      "definition": "dividing an upper or bottom component into two or more parts by cutting it through its thickness parallel to the surface"
    },
    {
      "term": "Stamping",
      "definition": "used for identification during manufacturing. Necessary to provide information without detracting from appearance of footwear"
    },
    {
      "term": "Stitching/Closing",
      "definition": "is the permanent joining parts together by use of threads"
    },
    {
      "term": "Toe-Puff",
      "definition": "stiffening material, usually of impregnated fabric, fiberboard or printed-on plastic, under the toe part of the upper (in between the upper and lining) to help shape retention, appearance and protect the toes."
    },
    {
      "term": "Upper",
      "definition": "is the top part of the shoe including lining, reinforcement and accessories"
    },
    {
      "term": "Vamp",
      "definition": "the part of the upper between the toe cap and the quarters, including the toe in the case of capless style subjected to maximum flexing while walking TR Footwear Making NC II 12/07/04 promulgated 12/09/04"
    }
  ],
