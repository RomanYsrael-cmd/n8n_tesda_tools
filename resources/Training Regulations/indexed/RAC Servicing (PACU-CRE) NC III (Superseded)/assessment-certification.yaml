    {
      "number": "4.2",
      "text": "The qualification of RAC Servicing (PACU/CRE) NC III may be attained through: 4.2.1 Accumulation of Certificates of Competency (COCs) in the following clusters of competencies: C.O.C 1 - Installing and servicing packaged-type air-conditioning unit (PACU) • Install PACU • Service and maintain PACU • Troubleshoot and repair PACU • Perform start-up, testing and commissioning for PACU C.O.C. 2 - Installing and servicing commercial refrigeration equipment (CRE) • Install CRE • Service and maintain CRE • Troubleshoot and repair CRE • Perform start-up, testing and commissioning for CRE Successful candidates shall be awarded Certificates of Competency (COCs). 4.2.2 For individuals, who already possess National Certificate (NC) or Certificate of Competency (COC) along RAC servicing, portfolio assessment is applicable, provided they are already employed and have related experience for the past three (3) years or more along the qualification. However, if the assessor finds the evidences presented inadequate, he may still require the candidate to undergo the practical demonstration or present other evidences in the form of Third Party Report, etc. depending on the need for supplementary evidences."
