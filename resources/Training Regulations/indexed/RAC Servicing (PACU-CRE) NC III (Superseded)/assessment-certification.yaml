  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of RAC Servicing (PACU/CRE) NC III,\nthe candidate must demonstrate competence covering all the units listed in\nSection 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2 The qualification of RAC Servicing (PACU/CRE) NC III may be attained\nthrough:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the following\nclusters of competencies:\nC.O.C 1 - Installing and servicing packaged-type air-conditioning unit\n(PACU)\n• Install PACU\n• Service and maintain PACU\n• Troubleshoot and repair PACU\n• Perform start-up, testing and commissioning for PACU\nC.O.C. 2 - Installing and servicing commercial refrigeration equipment\n(CRE)\n• Install CRE\n• Service and maintain CRE\n• Troubleshoot and repair CRE\n• Perform start-up, testing and commissioning for CRE\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs).\n\n4.2.2 For individuals, who already possess National Certificate (NC) or Certificate\nof Competency (COC) along RAC servicing, portfolio assessment is\napplicable, provided they are already employed and have related experience\nfor the past three (3) years or more along the qualification. However, if the\nassessor finds the evidences presented inadequate, he may still require the\ncandidate to undergo the practical demonstration or present other evidences\nin the form of Third Party Report, etc. depending on the need for\nsupplementary evidences.\n\n4.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\".\n\n--- PDF PAGE 98 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n96\nCOMPETENCY MAP - HVAC/R Sector\nRAC Servicing (PACU/CRE) NC III\n\nCORE COMPETENCIES\n\nInstall window- type AC/\ndomestic refrigeration units\nService & maintain\nwindow-type AC/ domestic\nrefrigeration units\nTroubleshoot window-\ntype AC/domestic\nrefrigeration systems\nRecover & recycle\nrefrigerant in window-\ntype AC/domestic\nrefrigeration systems\nRepair & retrofit\nwindow-type\nAC/ domestic\nrefrigeration systems\nPerform Testing and\ncommissioning for\nwindow-type AC/domestic\nrefrigeration\nInstall package-type air-\nconditioning unit (PACU) /\ncommercial refrigeration\nequipment (CRE)\n\nInstall PACU/CRE\nelectrical systems\n\nInstall PACU/CRE\npiping systems\n\nService & maintain\nPACU/CRE units\n\nSurvey site for installation\n\nTroubleshoot PACU/CRE\nn systems\nRecover / recycle\nrefrigerant in PACU/\nCRE systems\nRepair & retrofit\nPACU/CRE systems &\nits accessories\nPerform start-up, testing\nand\ncommissioning for\nPACU/CRE\nInstall transport air-\nconditioning\n& refrigeration units\nService & maintain\ntransport AC\n& refrigeration units\nRecover & recycle\nrefrigerant in transport\nAC & refrigeration\nsystems\nTroubleshoot transport\nair-conditioning &\nrefrigeration\nsystems\nPerform testing &\ncommissioning for\ntransport AC &\nrefrigeration\nRepair & retrofit transport\nac & refrigeration systems\n& its accessories\nInstall package-type air-\nconditioning unit\n(PACU)\nInstall commercial\nrefrigeration\nequipment (CRE)\nService & maintain\nPACU\nService & maintain\nCRE\n\nTroubleshoot and repair\nPACU\n\nTroubleshoot and repair\nCRE\nPerform start-up,\ntest and\ncommissioning for\nPACU\nPerform start-up, test\nand\ncommissioning for\nCRE\n\nCOMMON COMPETENCIES\n\nPrepare materials and\ntools\nObserve procedures,\nSpecifications &\nmanuals of instructions\nPerform\nmensurations &\ncalculations\nPerform basic\nbenchwork\nPerform basic\nelectrical works\nMaintain tools And\nequipment\nPerform housekeeping\nand safety practices\nDocument work\naccomplished\nInterpret technical\ndrawings and plans\n\nBASIC COMPETENCIES\n\nReceive and Respond\nto Workplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize information\nPlan and Organize\nWork\nPromote\nenvironmental\nprotection\n\nANNEX A\n\n--- PDF PAGE 99 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n97\n\nDEFINITION OF TERMS:\n\n1) Air Cooled Condensing Unit (ACCU)/OUTDOOR UNIT – an equipment that\ncondenses refrigerant vapor using air as the condensing medium. It consist of\ncompressor, condenser coil and fan motor\n\n2) Air Cooled Condenser – an equipment that condenses refrigerant vapor using\nair as the condensing medium\n\n3) Air Handling Unit (AHU)/INDOOR UNIT – an air-conditioning component that\nconsists of a fan motor and an evaporator coil. It is this equipment used in air-\nconditioning that absorbs heat from the space\n\n4) Air Distribution – the process of distributing conditioned air into a confined\nspace\n\n5) Check – to verify, inspect, or test an HVAC/R component for satisfactory\ncondition with the use of an instrument or a device\n\n6) Commercial Refrigeration - covers water coolers/ display coolers, vendo\nmachine, beverage machine icedrop/ice cream/ice cube vending machines\n\n7) Commissioning - process by which an equipment, facility, or plant\n(which is installed, or is complete or near completion) is tested to verify\nif it functions according to its design objectives or specifications.\n\n8) Dehydration – the process of removing moisture from a refrigeration system\n\n9) Electric Heat Defrost – use of electric resistance heating coils to melt ice or\nfrost from evaporators\n\n10) Evacuation – removal of air/any gas and moisture from a refrigeration system\n\n11) Evaporator – the component in a refrigeration system where liquid refrigerant\nis changed into a vapor by the absorption of heat\n\n12) Fan – a mechanical device for moving air\n\n13) Fan Coil Unit (FCU) – an air-conditioning component that consists of a fan\n motor and an evaporator coil\n\n14) Filter Drier – the component part used in air-conditioning or refrigeration\n system to filter and dehydrates refrigerant in the system\n\n15) Hot Gas Defrost – component part used to remove frosting on the evaporator\n coil using hot gas refrigerant from the compressor\n\n16) Idler Pulley – a pulley used to maintain proper belt tension\n\n--- PDF PAGE 100 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n98\n\n16) Inspect – determine the actual condition of HVAC/R component without the\nuse of instrument\n\n 17) Interlocking – it is the action of interconnecting electric control wires to\nachieve a sequential action\n\n 18) Leak Test – the procedure of determining/pin pointing leaks in a pressurized\nsystem\n\n 19) Liquid Line Solenoid Valve – electrically operated valve that shuts-off the\nflow of the refrigerant to the evaporator\n\n 20) Metering Device – it is one of the major components in a refrigeration\nsystem used to regulate the flow of refrigerant into the evaporator\n\n21) Package Air-conditioning Unit (PACU)– an air-conditioning unit that\ncontains the compressor, water-cooled condenser, metering device and\nevaporator all of which is in one casing.\n\n 22) Pull-out – to remove from a place of installation\n\n 23) Pressure Test – a procedure whereby pressure is applied to the piping\nsystem, the purpose of which is to determine its soundness and stability\n\n 24) Pump down – a process of using the compressor to pump and contain all the\nrefrigerant charge into the condenser and/or receiver\n\n 25) Refrigerant Charging – the process of introducing into the system the proper\namount of refrigerant\n\n 26) Retrofitting – a process of upgrading existing equipment or system using\nozone depleting substances to environmental friendly refrigerant\n\n 27) Service Mechanic – worker who possess basic skills related to HVAC/R\nsystem\n\n 28) Sight Glass/Liquid Line Moisture Indicator – indicates refrigerant quality\nand charge\n\n 29) Split-type Air-conditioner – an air conditioning system that comes in two\npieces: one piece contains the compressor, condenser, and a fan; the other\nunit contains the evaporator and a fan. The condenser, installed outside the\nhouse, connects to several evaporators, one in each room to be cooled,\nmounted inside the house. Each evaporator is individually controlled, allowing\ndifferent rooms or zones to be cooled to varying degrees.\n\n--- PDF PAGE 101 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n99\n\n30) Thermostat Expansion Valve (TXV) – a refrigerant control valve connected\nbefore an evaporator that regulates flow of refrigerant. Operated by\ntemperature and pressure, and reacts to the degree of gas superheat at the\nevaporator outlet through a feeler bulb\n\n31) Transport Air-conditioning Unit – refers to an air-conditioning unit driven\ndirectly from the turning axle of the vehicle when they are in motion, or by the\nvehicle engine itself, or by a separate gasoline/diesel engine and/or electric\nmotor mounted on the same vehicle. It covers the land and marine/sea\ntransports.\n\n32) Troubleshoot – the process of analyzing system defect or malfunction\n\n33) Vacuum – pressure lower than atmospheric pressure measured in inches of\nmercury. Complete vacuum is 29.92 in. mercury or at least 500 microns\n\n 34) Water Treatment – the use of chemicals in water to prevent corrosion,\nformation of scales, algae growth and formation of slime\n\n 35) Window Type Air-conditioning Unit – is a self-contained air-conditioning\nunit house in a single casing mounted in a wall or window opening\n\n 36) Workmanlike-manner – quality of work within the accepted industry standard\n\n--- PDF PAGE 102 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n100\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TECHNICAL ADVISORY PANEL (TAP)\n\nENGR. ROSENDO C. PEREZ, JR.\nMR. DANILO G. DUYA\nTAP Chairman\nVice-President\nPresident\nTDS Air-conditioning Industries, Inc.\nMECSYS Corporation\n#72 Kamias Road, Quezon City\n#2 Alondra St., Miranilla Homes\nTandang Sora, Congressional Ave., QC\n•\nTHE TECHNICAL EXPERT PANEL (TEP) - FY 2004\n\nMR. SABAS B. BERGANTINOS\nMR. EDUARDO M. FERNANDEZ\nFormer Consultant\nInstructor\nR. N. Ferrer & Associates\nc/o Philippine Society of Ventilating,\nTechnological University of the\nPhilippines - Manila\nAir-conditioning and Refrigeration\nAyala Boulevard, Manila\n(PSVARE)\n\nUnit 924 Citiland Tower cor. Shaw Blvd.\nand St. Francis Sts., Mandaluyong City\nMR. EDILBERTO S. MACATANGAY\nOwner\nMR. NELSON ZAPATA\nTechnocycle Corporation\nFormer Manager\nUnit E and F\nUnity Marketing\nKm. 31 National Road\nBinondo, Manila\nCorner Summit Circle, Bayan