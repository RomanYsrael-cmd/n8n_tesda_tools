        "source_text": "HVC723345\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ntroubleshooting and repairing refrigeration systems. It\nincludes planning troubleshooting and repair, preparing\nmaterials, tools and equipment and identifying and\nrepairing faults. This standard covers refrigeration\nequipment used in commercial applications.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan and prepare for\ntroubleshooting and repair\n1.1 Appropriate wiring diagrams, charts and\nmanuals are interpreted in line with the job\nrequirements\n1.2 Appropriate materials, tools and equipment\nare selected based on job requirements\n1.3 Power supply is checked to ensure\ncompliance with nameplate rating and/or\nmanufacturer’s specifications\n2. Identify and repair\nfaults/troubles\n2.1 Appropriate PPE is selected and used in line\nwith the job requirements\n2.2 Refrigeration system components are\ntested following manufacturer’s manual, RAC\nCode of Practice and/or enterprise\ntroubleshooting policy\n2.3 Faults/problems with refrigerant system are\ndiagnosed in line with manufacturer’s\nmanual, RAC Code of Practice and/or\nenterprise troubleshooting policy\n2.4 Remedial action is taken to overcome\nfaults/problems in line with manufacturer’s\nmanual, RAC Code of Practice and/or\nenterprise troubleshooting policy\n2.5 Work is completed safely in line with\nenterprise safety guidelines\n2.6 Report on testing procedure, including faults\nand repair, is completed in line with RAC\nCode of Practice and/or enterprise\ntroubleshooting policies.\n\n--- PDF PAGE 74 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n72\n3. Perform refrigerant recovery/\nrecycling and retrofitting on\ncommercial refrigeration\nsystems\n3.1 Safe working practices are observed\nthroughout the task as per enterprise\nprocedure\n3.2 Suitable tools and equipment are selected\nand used based on job requirement\n3.3 Optimum recovery of refrigerant is performed\nin line with RAC Code of Practice\n3.4 Refrigerants recovery/recycling is performed\naccording to manufacturer's\nrecommendations and RAC Code of\nPractice\n3.5 Retrofitting is performed based on RAC Code\nof Practice\n4. Test run CRE\n4.1 Equipment is tested in line with\nmanufacturer's instructions\n4.2 Report on testing equipment is prepared in\nline with enterprise procedures\n\n--- PDF PAGE 75 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n73\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. PPE\nIncludes but is not limited to:\n1.1. Mask\n1.2. Safety shoes\n1.3. 1Safety goggles\n1.4. Apron\n1.5. Gloves\n\n2. Refrigeration system\ncomponents\n2.1. Components:\n2.1.1. Expansion valves\n2.1.2. Evaporator\n2.1.3. Compressor\n2.1.4. Condenser\n2.2. Accessories\n2.2.1. Filter/dryer\n2.2.2. Sight glass\n2.3. Consumables\n2.3.1. Oil\n2.3.2. Refrigerant\n3. Faults/problems in\ndiagnosing\nMay include:\n3.1\nLeakage\n3.2\nContamination\n3.3\nFractionation\n3.4\nRestriction\n\n4. Manufacturer's\nrecommendations\nIncludes but not limited to:\n4.1. Equipment operator's manual\n4.2. Equipment service manual\n4.3. Nameplate data\n\n--- PDF PAGE 76 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n74\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Interpreted appropriate wiring diagrams, charts and\nmanuals.\n1.2 Checked power supply in compliance with nameplate rating\nand/or manufacturer’s standard\n1.3 Tested refrigerant system components as per standard\nprocedures\n1.4 Diagnosed and repaired faults/problems.\n1.5 Demonstrated compliance with safety regulations applicable\nto worksite operations\n1.6 Performed refrigerant recovery/recycling and retrofitting\naccordingly.\n1.7 Test run air-conditioning unit in line with manufacturer’s\ninstruction.\n1.8 Communicated Interactively others where applicable to\nensure safe and effective work operations\n2. Required\nKnowledge and\nAttitude\n2.1 SAFETY PRACTICES\n• Protective personal equipment/safety gears\n• Safe handling of tools and equipment\n• Proper handling of refrigerants\n• Safety signs and symbols\n• Safety hazard\n• Good housekeeping\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n• Electrical wiring control diagram\n• Mechanical plan/symbols and abbreviation\n2.3 TRADE THEORY\n• Basic electricity\n• Basic refrigeration cycle\n• Fundamentals of refrigeration and control\n• Interlocking control sequence\n• Fundamentals of piping\n• Fan characteristics\n• Electrical code\n• Montreal protocol\n• EMB/DENR regulations\n• Pump principles\n• Cooling tower principles\n\n--- PDF PAGE 77 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n75\n\n2.4 TOOLS/MATERIALS: USES\nAND SPECIFICATIONS\n• Types of electrical controls\n• Types of expansion valve\n• Types of compressor motor\n• Types of condenser\n• Types of evaporator\n• Types of refrigerant\n• Types of pressure control\n• Types of defrost timer\n• Types of fan motor\n• Types of fan\n• Types of pipe\n• Types of filter drier\n• Types of filter/strainer\nelement\n• Types of thermostat\n• Types of circuit breaker\n• Types of magnetic contactor\n• Types of unloader\n• Types of compressor\n• Types of pump\n2.5 MAINTENANCE\n• Preventive maintenance\n2.6 LEGISLATION\n• Clean Air Act\n• Montreal Protocol\n• Ozone Depleting Refrigerants\n(ODRs)\nRAC Code of Practice\n• Chemical Control Orders\n(CCOs) and other issuances\nrelating to ozone-depleting\nsubstances (ODS):\n• R.A. 6969 – Toxic\nsubstances and\nhazardous and nuclear\nwastes control act of\n1990.\n• DENR-AO 1992-29 - IRR\nof R.A. 6969\n• DENR-AO 2004-08 –\nRevised CCO for ODS\n• EMB MC 2005-03 –\nAlternatives to ODS\n2.7 PROCESSES/\nPROCEDURES\n• Compressor test\nprocedures\n• Power supply test\nprocedures\n• Cooler/evaporator test\nprocedures\n• Condensing unit test\nprocedures\n• Pump test procedures\n• Cooling tower test\nprocedures\n• Thermostatic expansion\nvalve test procedures\n• Automatic expansion\nvalve test procedures\n• Electrical control test\nprocedures\n• Leak testing procedure\n(for refrigeration circuit\nand water piping)\n• Pressure testing\nprocedure\n• Vacuum testing\nprocedure\n• Refrigerant charging\nprocedure\n• Pumpdown procedure\n• Crank case heater test\nprocedures\n• Unloading test\nprocedures\n• Start-up procedure\n\n--- PDF PAGE 78 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n76\n\n3. Required Skills\n\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 Following work safety\n3.4 Using electrical tools and testing equipment\n3.5 Performing electrical testing\n3.6 Performing mechanical testing\n3.7 Communicating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to troubleshooting\nrefrigerant system\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation\n5.2 Questions related to Required knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 79 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n77\nUNIT OF COMPETENCY: PERFORM START-UP, TEST AND COMMISSIONING\nFOR PACKAGE-TYPE AIR-CONDITIONING UNIT\n\nUNIT CODE :"
