        "source_text": "HVC723342\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nmaintaining air-conditioner system, components and\naccessories including lubrication and air-distribution\nsystems PACU.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Prepare for\nmaintenance activities\n1.1 Work instructions are read and interpreted to determine\njob requirements\n1.2 Appropriate manufacturer's manual is consulted if\navailable; otherwise, standard maintenance procedures\nare adopted.\n1.3 Tools and equipment are selected in accordance with job\nrequirements\n1.4 Work safety is observed according to enterprise\nregulations\n2 Check and adjust air-\nconditioning\naccessories, controls\nand operating\nconditions\n2.1 Evaporator/condenser coils are cleaned in accordance\nwith manufacturer's maintenance manual.\n2.2 Refrigerant piping is checked for abnormal conditions\nbased on procedure.\n2.3 Operation/Controls/Settings are checked and adjusted\nin accordance with manufacturer's specifications.\n2.4 Air-conditioning accessories are adjusted accordingly\nbased on manufacturer's maintenance manual.\n2.5 Maintenance procedures are applied according to\nmanufacturer's maintenance manual\n3 Maintain lubrication\nsystem in PACU\n3.1 Lubrication system variables and components are checked\nand adjusted based on manufacturer’s maintenance\nmanual\n3.2 Oil parameters are checked and adjusted based on\nmanufacturer’s specifications\n3.3 Oil leaks and restrictions are detected and rectified based\non standard maintenance procedures\n3.4 Used oil is disposed properly according to RAC Code of\nPractice.\n4 Maintain refrigeration\nsystem in PACU\n4.1 Operating parameters are measured and analyzed based\non standard specifications\n4.2 Pressure and temperature drops across strainer, filters\nand filter driers are checked and recorded based on\nstandard maintenance procedures\n4.3 Leak testing is performed based on RAC Code of Practice.\n4.4 Refrigeration components, accessories and\nconsumables are checked for contaminants in\naccordance manufacturer’s manual or RAC Code of\nPractice.\n5 Maintain air distribution\nsystem in PACU\n5.1 Air distribution system components are checked and air\nflows are balanced based on manufacturer’s specifications\n5.2 Outdoor air supply systems are checked and maintained to\nmeet operational and regulatory requirements\n\n--- PDF PAGE 59 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n57\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Abnormal conditions\nMay include:\n1.1 leaks\n1.2 insulation cracks\n1.3 looseness of supports/brackets\n2. Operation/Controls/Settings\nMay include:\n2.1 Pressures\n2.2 Temperatures\n2.3 Voltages\n2.4 Current draws\n2.5 Air flow\n2.6 Noise level\n2.7 vibrations\n3. Air-conditioning accessories\n\nMay include:\n3.1. Pulley alignment/belt tension\n3.2. Unloader\n3.3. Fan blades/blower\n3.4. Motors\n4. Oil parameters\nMay include:\n4.1 Oil levels\n4.2 Oil properties\n4.3 Purity of oil\n4.4\nOil viscosity\n5. Operating parameters\nMay include:\n5.1. Operating temperature\n5.2. Superheat\n5.3. pressure\n5.4. voltage\n5.5. current\n5.6. air velocity\n5.7.\nsound level and vibration\n6. Refrigeration components,\naccessories and consumables\n\n6.1. Components:\n6.1.1. Expansion valves\n6.1.2. Evaporator\n6.1.3. Compressor\n6.1.4. Condenser\n6.2. Accessories\n6.2.1. Filter/dryer\n6.2.2. Sight glass\n6.3. Consumables\n6.3.1. Oil\n6.3.2. Refrigerant\n7. Air distribution system\n\nMay include:\n7.1. Air swing\n7.2. Ducting system\n7.3. Grilles\n7.4.\nLouvers\n\n--- PDF PAGE 60 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n58\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Prepared for maintenance activities.\n1.2 Checked and adjusted air-conditioning accessories, controls and\noperating conditions\n1.3 Applied maintenance procedures according to manufacturer’s\nmaintenance manual.\n1.4 Checked and maintained lubrication system in PACU.\n1.5 Checked and maintained refrigeration system in PACU.\n1.6 Checked and maintained air distribution system in PACU.\n1.7 Communicated interactively with others where applicable to\nensure safe and effective work operations\n2. Required\nKnowledge and\nAttitude\n2.1 SAFETY PRACTICES\n•\nProtective personal equipment/safety gear\n•\nSafety hazards\n•\nHandling of tools and equipment and accessories\n•\nSafety signs and symbols\n•\nProper handling of refrigerant pressure testing\n•\nGood housekeeping\n2.2 TRADE MATHEMATICS/ MENSURATIONS\n•\nLinear measurements\n•\nDimension\n•\nRatio and proportion\n•\nUnit conversion\n2.3 TOOLS/MATERIALS: USES AND SPECIFICATIONS\n•\nProper use and care of tools needed\n•\nTypes of electrical controls\n•\nTypes expansion valves/motoring devices\n•\nTypes of compressor\n•\nTypes of refrigerant\n•\nTypes of pulley\n•\nTypes of belts\n•\nTypes of latches\n•\nTypes of door hinges\n•\nTypes of coil cleaner\n•\nTypes of fins and materials use\n2.4 LEGISLATION\n•\nClean Air Act (RA 8749)\n•\nMontreal Protocol/ DENR rules\n•\nOzone Depleting Refrigerants (ODRs)\n•\nChemical Control Orders (CCOs) and other issuances relating to\nozone-depleting substances (ODS):\n•\nR.A. 6969 – Toxic substances and hazardous and nuclear\nwastes control act of 1990.\n•\nDENR-AO 1992-29 - IRR of R.A. 6969\n•\nDENR-AO 2004-08 – Revised CCO for ODS\n•\nEMB MC 2005-03 – Alternatives to ODS\n2.5 BLUEPRINT READINGS\n•\nPlan specification\n•\nElectrical wiring diagram\n•\nElectrical plans, symbols and abbreviations\n\n--- PDF PAGE 61 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n59\n\n2.6 TRADE THEORY\n• Fundamentals of refrigeration\n• Basic refrigeration cycle\n• Refrigeration service valves\n• Basic electricity\n• Understanding of troubleshooting charts/service charts\n• Expansion device and low pressure side of the system\n• How to charge the system\n• How to evaluate the system\n• Pump down procedure\n• Resistance testing procedure\n• Mechanical testing procedure\n• Compressor construction\n• Refrigerant charging procedure\n• TXV adjustment procedure\n• AXV adjustment procedure\n•\nHumidifier equipment servcing\n3. Required\nSkills\n3.1 Interpreting plans and details\n3.2 Preparing materials\n3.3 Using of electrical and mechanical tools & equipment\nproperly\n3.4 Troubleshooting technique\n3.5 Calibrating of expansion valve\n3.6 Replacing defective part\n3.7 Troubleshooting of PACU system\n3.8 Performing work safety practices\n3.9 Adjusting superheat\n3.10 Aligning belt and pulley\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to maintaining PACU\nprocesses\n4.3 Materials relevant to the activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation\n5.2 Demonstration\n5.3 Questions related to Required knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 62 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________ 60\nUNIT OF COMPETENCY: SERVICE AND MAINTAIN COMMERCIAL\n REFRIGERATION EQUIPMENT (CRE)\n\nUNIT CODE\n\n :"
