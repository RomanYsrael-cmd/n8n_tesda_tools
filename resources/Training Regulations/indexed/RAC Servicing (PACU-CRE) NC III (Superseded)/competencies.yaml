        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Completed pre-start-up, testing and commissioning checks and\ncomplied with manufacturer’s manuals.\n1.2 Performed electrical related checks.\n1.3 Performed refrigerant piping related checks.\n1.4 Performed condensing unit related checks.\n1.5 Performed compressor unit related checks.\n1.6 Performed indoor unit related checks.\n1.7 Performed metering device related checks.\n1.8 Charged refrigeration system with the correct refrigerant\n1.9 Tested and set electrical, pneumatic and other controls to meet\nspecified and safety performance requirements\n1.10 Communicated interactively with others where applicable to\nensure safe and effective work operations\n1.11 Completed commissioning and starting-up procedures in\naccordance with the standard procedures\n2. Required\nKnowledge and\nAttitude\n2.1 SAFETY PRACTICES\n•\nProtective personal equipment/safety gears\n•\nSafe handling of tools and equipment\n•\nProper handling of refrigerants\n•\nSafety signs and symbols\n•\nSafety hazard\n•\nGood housekeeping\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n•\nElectrical wiring control diagram\n•\nHVAC-R plan/symbols and abbreviation\n2.3 TOOLS/MATERIALS: USES AND SPECIFICATIONS\n•\nTypes of electrical controls\n•\nTypes of expansion valve\n•\nTypes of compressor motor\n•\nTypes of condenser\n•\nTypes of evaporator\n•\nTypes of refrigerant\n•\nTypes of pressure control\n•\nTypes of defrost timer\n•\nTypes of fan motor\n•\nTypes of fan\n•\nTypes of pipe\n•\nTypes of filter drier\n•\nTypes of filter/strainer element\n•\nTypes of thermostat\n•\nTypes of circuit breaker\n•\nTypes of magnetic contactor\n•\nTypes of unloader\n•\nTypes of compressor\n•\nTypes of pump\n\n2.4 MAINTENANCE\n•\nPreventive maintenance\n\n--- PDF PAGE 86 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n84\n\n2.5 TRADE THEORY\n•\nBasic electricity\n•\nBasic refrigeration cycle\n•\nFundamentals of refrigeration\nand control\n•\nInterlocking control sequence\n•\nFundamentals of piping\n•\nFan characteristics\n•\nPump principles\n•\nCooling tower principles\n2.6 PROCESSES/\nPROCEDURES\n•\nCompressor test procedures\n•\nPower supply test procedures\n•\nCooler/evaporator test\nprocedures\n•\nCondensing unit test\nprocedures\n•\nPump test procedures\n•\nCooling tower test procedures\n•\nThermostatic expansion valve\ntest procedures\n•\nAutomatic expansion valve\ntest procedures\n•\nElectrical control test\nprocedures\n•\nLeak testing procedure (for\nrefrigeration circuit and water\npiping)\n•\nPressure testing procedure\n•\nVacuum testing procedure\n•\nRefrigerant charging\nprocedure\n•\nPumpdown procedure\n•\nCrank case heater test\nprocedures\n•\nUnloading test procedures\n•\nStart-up procedure\n2.8 LEGISLATION\n•\nClean Air Act (RA 8749)\n•\nMontreal Protocol\n•\nOzone Depleting Refrigerants\n(ODRs)\n•\nHVAC-R Code of Practice\n•\nChemical Control Orders\n(CCOs) and other issuances\nrelating to ozone-depleting\nsubstances (ODS):\n•\nR.A. 6969 – Toxic\nsubstances and\nhazardous and nuclear\nwastes control act of\n1990.\n•\nDENR-AO 1992-29 - IRR\nof R.A. 6969\n•\nDENR-AO 2004-08 –\nRevised CCO for ODS\n•\nEMB MC 2005-03 –\nAlternatives to ODS\n3. Required Skills\n\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 performing work safety\n3.4 Proper handling of electrical tools and testing equipment\n3.5 Performing pre-start-up activity\n3.6 Performing electrical testing\n3.7 Performing mechanical testing\n3.8 Performing commissioning activity\n3.9 Communicating effectively\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate in performing start-up, testing\nand commissioning refrigeration and air-conditioning systems\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.3 Direct observation\n5.4 Questions related to Required knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 87 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n85"
        },
        "source_text": "HVC723347\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nperforming start-up, test and commissioning in the\ncommercial refrigeration equipment (CRE).\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare for start-up, test\nand commissioning of CRE\n1.1. Work instructions are read and interpreted to\ndetermine job requirements\n1.2. Tools and equipment are selected in\naccordance with job requirements\n1.3. Pre-start-up, testing and commissioning\nchecks are completed and complied with\nmanufacturer’s manuals.\n1.4. Commissioning method and program are\nproduced and recording sheets are prepared in\naccordance with manufacturer’s manuals.\n1.5. Commissioning instruments are calibrated in\naccordance with system documents\n1.6. PPEs are selected in line with job requirements\n2. Conduct start-up, test and\ncommissioning of CRE\n2.1. Electrical related checks are performed\nbased on manufacturer’s manuals.\n2.2. Refrigerant piping related checks are\nperformed based on manufacturer’s manuals.\n2.3. Condensing unit related checks are\nperformed based on manufacturer’s manuals.\n2.4. Compressor unit related checks are\nperformed based on manufacturer’s manuals.\n2.5. Indoor unit related checks are performed\nbased on manufacturer’s manuals and site\nconditions\n2.6. Metering device related checks are\nperformed based in manufacturer’s manuals\n2.7. Systems are charged with the correct\nrefrigerant to system specifications and in\naccordance with manufacturer's manual\n2.8. Appropriate lubricating oil is added to the\nrefrigeration systems in accordance with\nstandard operating procedures\n2.9. Start-up, testing and commissioning reports\nare accomplished in line with enterprise\npolicies and procedures.\n\n--- PDF PAGE 84 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n82\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1\nCommissioning instruments\n\nIncluding but is not limited to:\n1.1 Manifold gauge\n1.2 Clampmeter\n1.3 Multi-tester\n1.4 Psychrometer\n1.5 Thermometer\n1.6 Electronic leak detector\n1.7 Balometer\n2\nElectrical related checks\nThis includes:\n2.1 Power supply source checks\n2.2 Power supply isolation checks\n2.3 Safety and circuit protection checks\n2.4 Wirings and piping checks\n2.5 Grounding systems checks\n3\nRefrigerant piping related\nchecks\nMay include:\n3.1 Inspection of U-traps/ pipe riser installation\n3.2 Leak testing\n3.3 Pipe insulation inspection\n3.4 Pipe and fittings inspection\n4\nCondensing unit related\nchecks\nMay include:\n4.1 Leveling and dimension validation\n4.2 Spacing and positioning validation\n4.3 Verification of access for servicing\n5\nCompressor unit related\nchecks\nMay include:\n5.1 Connection of cranked- case heater\n5.2 Oil level verification\n5.3 Terminal connection inspection\n6\nIndoor related checks\nMay include but not limited to:\n6.1 CRE\n6.1.1 Condensate drain pipe inspection\n6.1.2 Leveling and dimension verification\n6.1.3 Temperature and pressure check\n6.1.4 Verification of the installation quality\nof unit\n6.1.5 Air leakage check (i.e. door hinges\nalignment, door gasket)\n7\nMetering device related\nchecks\nMay include but not limited to:\n7.1 Sensing valve tightness and location\nverification\n7.2 Vibration check\n\n--- PDF PAGE 85 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n83\n\n EVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Completed pre-start-up, testing and commissioning checks and\ncomplied with manufacturer’s manuals.\n1.2 Performed electrical related checks.\n1.3 Performed refrigerant piping related checks.\n1.4 Performed condensing unit related checks.\n1.5 Performed compressor unit related checks.\n1.6 Performed indoor unit related checks.\n1.7 Performed metering device related checks.\n1.8 Charged refrigeration system with the correct refrigerant\n1.9 Tested and set electrical, pneumatic and other controls to meet\nspecified and safety performance requirements\n1.10 Communicated interactively with others where applicable to\nensure safe and effective work operations\n1.11 Completed commissioning and starting-up procedures in\naccordance with the standard procedures\n2. Required\nKnowledge and\nAttitude\n2.1 SAFETY PRACTICES\n•\nProtective personal equipment/safety gears\n•\nSafe handling of tools and equipment\n•\nProper handling of refrigerants\n•\nSafety signs and symbols\n•\nSafety hazard\n•\nGood housekeeping\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n•\nElectrical wiring control diagram\n•\nHVAC-R plan/symbols and abbreviation\n2.3 TOOLS/MATERIALS: USES AND SPECIFICATIONS\n•\nTypes of electrical controls\n•\nTypes of expansion valve\n•\nTypes of compressor motor\n•\nTypes of condenser\n•\nTypes of evaporator\n•\nTypes of refrigerant\n•\nTypes of pressure control\n•\nTypes of defrost timer\n•\nTypes of fan motor\n•\nTypes of fan\n•\nTypes of pipe\n•\nTypes of filter drier\n•\nTypes of filter/strainer element\n•\nTypes of thermostat\n•\nTypes of circuit breaker\n•\nTypes of magnetic contactor\n•\nTypes of unloader\n•\nTypes of compressor\n•\nTypes of pump\n\n2.4 MAINTENANCE\n•\nPreventive maintenance\n\n--- PDF PAGE 86 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n84\n\n2.5 TRADE THEORY\n•\nBasic electricity\n•\nBasic refrigeration cycle\n•\nFundamentals of refrigeration\nand control\n•\nInterlocking control sequence\n•\nFundamentals of piping\n•\nFan characteristics\n•\nPump principles\n•\nCooling tower principles\n2.6 PROCESSES/\nPROCEDURES\n•\nCompressor test procedures\n•\nPower supply test procedures\n•\nCooler/evaporator test\nprocedures\n•\nCondensing unit test\nprocedures\n•\nPump test procedures\n•\nCooling tower test procedures\n•\nThermostatic expansion valve\ntest procedures\n•\nAutomatic expansion valve\ntest procedures\n•\nElectrical control test\nprocedures\n•\nLeak testing procedure (for\nrefrigeration circuit and water\npiping)\n•\nPressure testing procedure\n•\nVacuum testing procedure\n•\nRefrigerant charging\nprocedure\n•\nPumpdown procedure\n•\nCrank case heater test\nprocedures\n•\nUnloading test procedures\n•\nStart-up procedure\n2.8 LEGISLATION\n•\nClean Air Act (RA 8749)\n•\nMontreal Protocol\n•\nOzone Depleting Refrigerants\n(ODRs)\n•\nHVAC-R Code of Practice\n•\nChemical Control Orders\n(CCOs) and other issuances\nrelating to ozone-depleting\nsubstances (ODS):\n•\nR.A. 6969 – Toxic\nsubstances and\nhazardous and nuclear\nwastes control act of\n1990.\n•\nDENR-AO 1992-29 - IRR\nof R.A. 6969\n•\nDENR-AO 2004-08 –\nRevised CCO for ODS\n•\nEMB MC 2005-03 –\nAlternatives to ODS\n3. Required Skills\n\n3.1 Interpreting plan and details\n3.2 Preparing materials\n3.3 performing work safety\n3.4 Proper handling of electrical tools and testing equipment\n3.5 Performing pre-start-up activity\n3.6 Performing electrical testing\n3.7 Performing mechanical testing\n3.8 Performing commissioning activity\n3.9 Communicating effectively\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate in performing start-up, testing\nand commissioning refrigeration and air-conditioning systems\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.3 Direct observation\n5.4 Questions related to Required knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 87 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n85"
