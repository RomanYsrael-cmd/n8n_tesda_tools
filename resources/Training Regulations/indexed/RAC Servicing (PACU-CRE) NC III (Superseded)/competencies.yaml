        "source_text": "--- PDF PAGE 40 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n38\n \nUNIT TITLE \n:   PERFORM HOUSEKEEPING AND SAFETY   \n                                              PRACTICES FOR REFRIGERATION SERVICING \n \n UNIT CODE  \n        :   HVC7315201 \n \nUNIT DESCRIPTOR         :  This unit covers the knowledge, skills and attitudes \nneeded to work safely in the workplace including  sorting, \ncleaning and dispensing materials, tools and equipment, \nidentifying and minimizing hazards, responding and \nrecording accidents and following basic security. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the  \nRange of Variables\n1. Sort materials, tools and  \nequipment \n \n1.1 Materials, tools and equipment are    classified \naccording to its kinds \n1.2 Appropriate areas for materials, tools and \nequipment are designated\n2. Clean workplace area, \nmaterials, tools and \nequipment \n \n2.1 Cleaning materials are identified and used  \n      as per procedure \n2.2 Workplace areas, materials, tools and equipment \nare cleaned as per company practices \n2.3 Workplace are in safe state in accordance with \nsafety regulations/company practices\n3. Systematize dispensing \nand retrieval of materials, \ntools and equipment  \n3.1 Systems for requesting, borrowing and  \n       returning of materials, tools and equipment  \n       is in-place and implemented \n3.2 Forms used are completely filled-up and  \n       filed \n3.3  Borrowed tools, and equipment are  \n       returned to designated area \n3.4  Consumable materials are requested in  \n      exact quantity\n4. Identify and minimize/ \neliminate hazards \n4.1  Hazards in the work area are recognized and  \n       reported to designated personnel and   \n       appropriate control actions are taken \n4.2  Workplace policies and procedures for controlling \nrisks are established and followed accurately \n4.3   Workplace procedures for dealing with \nemergencies are followed whenever necessary \nwithin the scope of responsibilities and \ncompetencies \n4.4  Safety signs and hazard warnings are \ndisplayed and observed at all times in line with \nworkplace health and safety regulations  \n4.5  Equipment and safety devices/PPE  are \nused/handled according to company or \nmanufacturer's procedures and guidelines\n\n--- PDF PAGE 41 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n39\nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the \n Range of Variables\n \n \n4.6  Work areas are kept clean, free from obstacles \nand emergency exits are know and kept clear at \nall times \n4.7  Safe manual handling/fighting techniques and \nsafe equipment operation techniques are \nemployed at all times\n5.  Respond and record \naccidents \n5.1 Workplace accidents are identified \n5.2  Workplace emergency first-aid procedures/ \ntreatment are followed/carried out correctly in \naccordance with standards/regulations and \nenterprise procedures/policies \n5.3  Medical assistance/rescue is coordinated with \nconcerned personnel in line with organizational \npolicies \n5.4  Accident/incident records maintained in \naccordance with standard operating procedures\n6.  Follow basic security \n6.1  Security policies/procedures are followed  \naccording to enterprise practices and appropriate \nlegislation \n6.2  Security related events are recorded/reported on \nthe relevant forms \n6.3  Staff are advised of enterprise security \nprocedures and correct methods of \nimplementation\n\n--- PDF PAGE 42 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n40\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Hazards \nHazards that may be present in the workplace include but \nnot limited to: \n1.1 Flammable materials \n1.2 Running machinery/equipment \n1.3 Toxic substances  \n1.4 Debris \n1.5 Open flames \n1.6 Loose objects/fixtures \n1.7 Chemicals \n1.8 Electrical faults \n1.9 Hot metals\n2.  Emergencies \nEmergencies may include but not limited to: \n2.1 Fire \n2.2 Explosion \n2.3 Spills \n2.4 Falls \n2.5 Electrocution \n2.6 Injuries caused by falling objects \n2.7 Injuries caused by sharp objects \n2.8Injuries caused by wrong usage of tools\n3.  Safety signs, symbols  \nand hazard warnings \nSafety signs and symbols include but  not limited to: \n3.1 Industry recognized hazard warning signs and safety \nsymbols \n- \nDanger-High Voltage \n- \nUnauthorized Persons Keep Out \n- \nNo Smoking \n- \nPoisonous Gases \n- \nCaution - Men working on line wires \n3.2 Internationally recognized hazard warning signs and \nsafety symbols\n4.  Personal Protective \nEquipment (PPE) \nPPE may include but not limited to: \n \n4.1 \nGoggles \n4.2 \nGas mask \n4.3 \nWorking gloves \n4.4 \nSafety shoes \n4.5 \nFace shield \n4.6 \nInsulating mat \n4.7 \nOver-all apron \n4.8 \nHard hat \n4.9 \nSafety belt \n4.10\nProtective eyewear\n\n--- PDF PAGE 43 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n41\n \nVARIABLE \nRANGE \n5.  First-aid Treatment \nFirst-aid treatment includes but is not limited to: \n5.1 CPR \n5.2 Mouth to mouth resuscitation \n5.3 Application of tourniquet \n5.4 Application of pressure to bleeding wounds or cuts \n5.5 First-aid treatment for burned victims\n6.  Standards and \nRegulations \n6.1 Philippine Electrical Code \n6.2 Philippine OH&S Standards \n6.3 Building Code \n6.4 Philippine Environmental Standards \n6.5 Welding Procedures Specifications \n6.6 Clean Air Act\n7.  Security policies \n7.1 Wearing of ID \n7.2 Logging-in and out \n7.3 Wearing of uniform \n7.4 Observance of safety/security signs and symbols\n\n--- PDF PAGE 44 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n42\n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires that the candidate: \n1.1 Classified materials, tools and equipment according to kind \n1.2 Cleaned workplace areas, materials, tools and equipment \nas per standard procedures \n1.3 Implemented systematize dispensing and retrieval of \nmaterials, tools and equipment \n1.4 Identified and described safety working practices relating to \nall tasks undertaken in the workplace \n1.5 Identified and selected appropriate equipment and safety \ndevices for particular workplace tasks and activities \n1.6 Interpreted hazard warnings and safety signs correctly and \ndescribed the application of these warnings and signs in the \nwork activities \n1.7 Workplace emergency first-aid procedures/treatment are \ncarried out in accordance with OHSA standards/legislation \nand enterprise procedures \n1.8 Responded/maintained accidents/incidents records in \naccordance with SOPs \n1.9 Followed security procedures/policies in accordance with \nenterprise practices and legislation \n1.10 Workplace kept in safe state in accordance with safety  \n        regulations\n2. Required \nKnowledge and \nAttitude \n \n \n \n \n \n \n \n2.1 \nKinds and Uses of PPE  \n2.2 \nIdentification of  Safety Signs and Symbols \n2.3 \n5S of Good Housekeeping \n2.4 \nGeneral OH&S principles, responsibilities and legislations \n2.5 \nOH&S requirements in relations to work safety \n2.6 \nEnvironmental requirements relative to work safety \n2.7 \nHazard identification and avoidance in the workplace \n2.8 \nFirst-aid treatment procedures \n2.9 \nKinds of emergency situations – causes and how to deal \nwith different situations \n2.10  Kinds of injuries and effects \n2.11 Accident/hazard reporting \n2.12 Basic security procedures \n2.13  Uses of Manuals\n3.  Required Skills \n3.1 Wearing appropriate PPE \n3.2 Reading skills required to interpret work instruction \n3.3 Identifying safety signs and symbols \n3.4 Practice of CPR, Mouth to Mouth Resuscitation and other \nFirst-Aid Treatment \n3.5 Problem solving in emergency situation \n3.6 Handling injured worker \n3.7 Coordination of work in times of emergency \n3.8 Fire fighting procedures and techniques \n3.9  Reporting/recording accidents and potential hazards\n\n--- PDF PAGE 45 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n43\n4.  Resource  \nImplications \nThe following resources should be provided: \n4.1  Work place \n4.2 Materials, tools and equipment relevant to the proposed \nactivity/task \n4.3 Safety signs \n4.4 Safety devices \n4.5 Accident reporting procedures \n4.6 First-aid materials and guidelines\n5.  Methods of \nAssessment \nCompetency should be assessed through: \n \n5.1  Direct observation while task is being undertaken \n21.1 Written test/questioning relevant to Required knowledge \n21.2 Assessment of Required knowledge and practical skills \nmay be combined\n6.  Context for \nAssessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.3 Assessment shall be observed while task are being \nundertaken whether individually or in group in accordance \nwith the approved industry OHSA regulations \n6.4 Competency assessment must be undertaken in accordance \nwith the endorsed TESDA assessment guidelines\n",
