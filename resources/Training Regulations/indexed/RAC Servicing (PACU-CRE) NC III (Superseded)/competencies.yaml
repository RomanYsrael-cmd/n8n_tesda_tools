          "source_text": "1. Plan and prepare for \ntroubleshooting and repair \n1.1 Appropriate wiring diagrams, charts and \nmanuals are interpreted in line with the job \nrequirements \n1.2 Appropriate materials, tools and equipment \nare selected based on job requirements \n1.3 Power supply is checked to ensure \ncompliance with nameplate rating and/or \nmanufacturer’s specifications \n2. Identify and repair \nfaults/troubles  \n2.1 Appropriate PPE is selected and used in line \nwith the job requirements \n2.2 Refrigeration system components are \ntested following manufacturer’s manual, RAC \nCode of Practice and/or enterprise \ntroubleshooting policy \n2.3 Faults/problems with refrigerant system are \ndiagnosed in line with manufacturer’s \nmanual, RAC Code of Practice and/or \nenterprise troubleshooting policy \n2.4 Remedial action is taken to overcome \nfaults/problems in line with manufacturer’s \nmanual, RAC Code of Practice and/or \nenterprise troubleshooting policy \n2.5 Work is completed safely in line with \nenterprise safety guidelines \n2.6 Report on testing procedure, including faults \nand repair, is completed in line with RAC \nCode of Practice and/or enterprise \ntroubleshooting policies.\n\n--- PDF PAGE 74 ---\nTR - RAC SERVICING NC III \n \nPromulgated _______________ \n72\n3. Perform refrigerant recovery/ \nrecycling and retrofitting on \ncommercial refrigeration \nsystems \n3.1 Safe working practices are observed \nthroughout the task as per enterprise \nprocedure \n3.2 Suitable tools and equipment are selected \nand used based on job requirement \n3.3 Optimum recovery of refrigerant is performed \nin line with RAC Code of Practice \n3.4 Refrigerants recovery/recycling is performed \naccording to manufacturer's \nrecommendations and RAC Code of \nPractice \n3.5 Retrofitting is performed based on RAC Code \nof Practice \n4. Test run CRE \n4.1 Equipment is tested in line with \nmanufacturer's instructions \n4.2 Report on testing equipment is prepared in \nline with enterprise procedures\n\n--- PDF PAGE 75 ---\nTR - RAC SERVICING NC III \n \nPromulgated _______________ \n73\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. PPE \nIncludes but is not limited to: \n1.1. Mask \n1.2. Safety shoes \n1.3. 1Safety goggles \n1.4. Apron \n1.5. Gloves \n \n2. Refrigeration system \ncomponents \n2.1. Components: \n2.1.1. Expansion valves \n2.1.2. Evaporator  \n2.1.3. Compressor  \n2.1.4. Condenser \n2.2. Accessories \n2.2.1. Filter/dryer \n2.2.2. Sight glass  \n2.3. Consumables \n2.3.1. Oil \n2.3.2. Refrigerant \n3. Faults/problems in \ndiagnosing \nMay include: \n3.1 \nLeakage \n3.2 \nContamination \n3.3 \nFractionation  \n3.4 \nRestriction  \n \n4. Manufacturer's \nrecommendations \nIncludes but not limited to: \n4.1. Equipment operator's manual \n4.2. Equipment service manual \n4.3. Nameplate data\n\n--- PDF PAGE 76 ---\nTR - RAC SERVICING NC III \n \nPromulgated _______________ \n74"
