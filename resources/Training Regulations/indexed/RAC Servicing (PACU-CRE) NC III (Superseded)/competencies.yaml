        "source_text": "HVC311203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n in identifying and measuring objects based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\n Range of Variables\n1. Select measuring\ninstruments\n\n1.1 Object or component to be measured is\nidentified, classified and interpreted to the\nappropriate regular geometric shape\n1.2 Measuring tools are selected/identified as per\nobject to be measured or job requirements\n1.3 Correct specifications are obtained from\nrelevant sources\n1.4 Appropriate measuring instruments are\nselected according to job requirements\n1.5 Alternative measuring tools are used without\nsacrificing cost and quality of work\n2. Carry out measurements\nand calculations\n\n2.1 Accurate measurements and calculations\nare obtained to job requirements\n2.2 Alternative measuring tools are used\n without sacrificing cost and quality of work\n2.3 Calculation needed to complete work tasks\nare performed using the four basic process of\naddition (+), subtraction (-), multiplication (x)\nand division (/) including but not limited to:\ntrigonometric functions, algebraic\ncomputations\n2.4 Calculations involving fractions, percentages\nand mixed numbers are used to complete\nworkplace tasks\n2.5 Numerical computation is self-checked and\ncorrected for accuracy\n2.6 Instruments are read to the limit of accuracy\nof the tool\n2.7 Systems of measurement identified and\nconverted according to job requirements/ISO\n2.8 Workpieces are measured according to job\nrequirements\n\n--- PDF PAGE 29 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n27\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Geometric Shape\n\n Including but I not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring instruments\nIncluding but not limited to:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega-ohmmeter\n2.16 KWH meter\n2.17 Gauges\n2.18\nThermometers\n3. Measurements and\ncalculations\n\n3.1\nLinear\n3.2\nVolume\n3.3\nArea\n3.4\nWattage\n3.5\nVoltage\n3.6\nResistance\n3.7\nAmperage\n3.8\nFrequency\n3.9\nImpedance\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.13 Inside diameter\n3.14 Circumference\n3.15 Length\n3.16 Thickness\n3.17\nOutside diameter\n\n--- PDF PAGE 30 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n28\n\nVARIABLE\nRANGE\n\n3.18 Taper\n3.19 Out of roundness\n3.20 Oil clearance\n3.21\nEnd play/thrust clearance\n\nEVIDENCE GUIDE\n\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments\nin accordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n2. Required\nKnowledge and\nAtttude\n\n2.1 TRADE MATHEMATICS/MENSURATION\n• Four fundamental operation\n• Linear measurement\n• Dimensions\n• Unit conversion\n• Ratio and proportion\n• Trigonometric functions\n• Algebraic equations\n3. Required Skills\n3.1 Performing calculation by addition, subtraction, multiplication\nand division: trigonometric functions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of plane\nand geometric figures\n3.4 Proper handling of measuring instruments\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of Required knowledge and practical skills may be\ncombined\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to Required knowledge\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the TESDA assessment guidelines\n\n--- PDF PAGE 31 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n29\n\nUNIT TITLE\n\n: PERFORM BASIC BENCHWORK\n\nUNIT CODE\n\n:"
