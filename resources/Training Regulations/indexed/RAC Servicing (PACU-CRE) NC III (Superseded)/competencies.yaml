        "source_text": "HVC723343\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nmaintaining refrigeration system, components and\naccessories including lubrication and air-distribution\nsystems in CRE.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for\nmaintenance\nactivities\n1.1. Work instructions are read interpreted to determine job\nrequirements\n1.2. Appropriate manufacturer's manual is consulted if available;\notherwise, RAC Code of Practice and/or enterprise\nmaintenance policy procedures are adopted.\n1.3. Tools and equipment are selected in accordance with job\nrequirements\n1.4. Work safety is observed according to enterprise regulations\n2. Check and adjust\nrefrigeration\naccessories, controls\nand operating\nconditions\n2.1. Evaporator/condenser coils are cleaned in accordance with\nmanufacturer's maintenance manual.\n2.2. Refrigerant piping is checked for abnormal conditions\nbased on procedure.\n2.3. Operation/Controls/Settings are checked and adjusted in\naccordance with manufacturer's specifications.\n2.4. Refrigeration accessories are adjusted accordingly based\non manufacturer's maintenance manual.\n2.5. Maintenance procedures are applied according to\nmanufacturer's maintenance manual\n3. Maintain lubrication\nsystem in CRE\n3.1. Lubrication system variables and components are checked\nand adjusted based on manufacturer’s maintenance manual\n3.2. Oil parameters are checked and adjusted based on\nmanufacturer’s specifications\n3.3. Oil leaks and restrictions are detected and rectified based on\nmanufacturer’s maintenance manual\n3.4. Used oil is disposed properly according to RAC Code of\nPractice.\n4. Maintain refrigeration\nsystem in CRE\n4.1. Operating parameters are measured and analyzed based\non manufacturer’s standards and/or RAC Code of Practice.\n4.2. Pressure and temperature drops across strainer, filters and\nfilter driers are checked and recorded based on\nmanufacturer’s maintenance manual and/or RAC Code of\nPractice\n4.3. Leak testing is performed based on RAC Code of Practice.\n4.4. Refrigeration components, accessories and\nconsumables are checked for contaminants in accordance\nmanufacturer’s manual or RAC Code of Practice.\n5. Maintain air\ndistribution system in\nCRE\n5.1 Air distribution system components are checked and air\nflows are balanced based on manufacturer’s specifications.\n5.2 Outdoor air supply systems are checked and maintained to\nmeet operational and regulatory requirements.\n\n--- PDF PAGE 63 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________ 61\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work instructions\nMay include:\n1.1 Work permits\n1.2 Job orders\n1.3 Blueprints\n2. Abnormal conditions\nMay include:\n1.8 leaks\n1.9 insulation cracks\n1.10 looseness of supports/brackets\n3. Operation/Controls/Settings\nMay include:\n3.1 Pressures\n3.2 Temperatures\n3.3 Voltages\n3.4 Current draws\n3.5 Air flow\n3.6 Noise level\n3.7 Vibrations\n4. Refrigeration accessories\n\nMay include:\n4.1 Pressure switch\n4.2 Temperature control\n4.3 Pulley alignment/belt tension\n4.4 Unloader\n4.5 Fan blades/blower\n4.6 Motors\n5. Oil parameters\nMay include:\n5.1 Oil levels\n5.2 Oil properties\n5.3 Purity of oil\n5.4 Oil viscosity\n6. Operating parameters\nMay include:\n6.1 Operating temperature\n6.2 Superheat\n6.3 pressure\n6.4 voltage\n6.5 current\n6.6 air velocity\n6.7 sound level and vibration\n\n--- PDF PAGE 64 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________ 62\n7. Refrigeration components,\naccessories and consumables\n\nMay include:\n7.1 Components:\n7.1.1 Expansion valves\n7.1.2 Evaporator\n7.1.3 Compressor\n7.1.4 Condenser\n7.2 Accessories\n7.2.1 Filter/dryer\n7.2.2 Sight glass\n7.3 Consumables\n7.3.1 Oil\n7.3.2 Refrigerant\n8. Air distribution system\n\nMay include:\n8.1 Grilles\n8.2 Louvers\n8.3 Evaporator blower\n\n--- PDF PAGE 65 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________ 63\nEVIDENCE GUIDE\n1 Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Prepared for maintenance activities.\n1.2 Checked and adjusted refrigeration equipment accessories,\ncontrols and operating conditions\n1.3 Applied maintenance procedures according to manufacturer’s\nmaintenance manual.\n1.4 Checked and maintained lubrication system in CRE.\n1.5 Checked and maintained refrigeration system in CRE.\n1.6 Checked and maintained air distribution system in CRE.\n1.7 Communicated interactively with others where applicable to\nensure safe and effective work operations\n2 Required\nKnowledge and\nAttitude\n2.1 SAFETY PRACTICES\n•\nProtective personal equipment/safety gear\n•\nSafety hazards\n•\nHandling of tools and equipment and accessories\n•\nSafety signs and symbols\n•\nProper handling of refrigerant pressure testing\n•\nGood housekeeping\n2.2 TRADE MATHEMATICS/ MENSURATIONS\n•\nLinear measurements\n•\nDimension\n•\nRatio and proportion\n•\nUnit conversion\n2.3 TOOLS/MATERIALS: USES AND SPECIFICATIONS\n•\nProper use and care of tools needed\n•\nTypes of electrical controls\n•\nTypes expansion valves/motoring devices\n•\nTypes of compressor\n•\nTypes of refrigerant\n•\nTypes of pulley\n•\nTypes of belts\n•\nTypes of latches\n•\nTypes of door hinges\n•\nTypes of coil cleaner\n•\nTypes of fins and materials use\n2.4 LEGISLATION\n•\nClean Air Act (RA 8749)\n•\nMontreal Protocol/ DENR rules\n•\nOzone Depleting Refrigerants (ODRs)\n•\nChemical Control Orders (CCOs) and other issuances relating to\nozone-depleting substances (ODS):\n•\nR.A. 6969 – Toxic substances and hazardous and nuclear\nwastes control act of 1990.\n•\nDENR-AO 1992-29 - IRR of R.A. 6969\n•\nDENR-AO 2004-08 – Revised CCO for ODS\n•\nEMB MC 2005-03 – Alternatives to ODS\n2.5 BLUEPRINT READINGS\n•\nPlan specification\n•\nElectrical wiring diagram\n•\nElectrical plans, symbols and abbreviations\n\n--- PDF PAGE 66 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n64\n\n2.6 TRADE THEORY\n• Fundamentals of refrigeration\n• Basic refrigeration cycle\n• Refrigeration service valves\n• Basic electricity\n• Understanding of troubleshooting charts/service charts\n• Expansion device and low pressure side of the system\n• How to charge the system\n• How to evaluate the system\n• Pump down procedure\n• Resistance testing procedure\n• Mechanical testing procedure\n• Compressor construction\n• Refrigerant charging procedure\n• TXV adjustment procedure\n• AXV adjustment procedure\n3 Required\nSkills\n3.1 Interpreting plans and details\n3.2 Preparing materials\n3.3 Using of electrical and mechanical tools and equipment\nproperly\n3.4 Troubleshooting technique\n3.5 Calibrating of expansion valve\n3.6 Replacing defective part\n3.7 Troubleshooting of PACU/CRE system\n3.10 Performing work safety practices\n3.11 Adjusting superheat\n3.10 Aligning belt and pulley\n3.11 Aligning door\n4 Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to maintaining\nPACU/CRE processes\n4.3 Materials relevant to the activity\n4.4 Drawings and specifications relevant to the task\n5 Methods of\nAssessment\nCompetency must be assessed through:\n1.1 Direct observation\n1.2 Questions related to Required knowledge\n6 Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 67 ---\nTR - RAC SERVICING NC III\n\nPromulgated _______________\n65\nUNIT OF COMPETENCY: TROUBLESHOOT AND REPAIR PACKAGE TYPE AIR-\nCONDITIONING UNIT (PACU)\n\nUNIT CODE :"
