        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires that the candidate:\n1.1 Classified materials, tools and equipment according to kind\n1.2 Cleaned workplace areas, materials, tools and equipment\nas per standard procedures\n1.3 Implemented systematize dispensing and retrieval of\nmaterials, tools and equipment\n1.4 Identified and described safety working practices relating to\nall tasks undertaken in the workplace\n1.5 Identified and selected appropriate equipment and safety\ndevices for particular workplace tasks and activities\n1.6 Interpreted hazard warnings and safety signs correctly and\ndescribed the application of these warnings and signs in the\nwork activities\n1.7 Workplace emergency first-aid procedures/treatment are\ncarried out in accordance with OHSA standards/legislation\nand enterprise procedures\n1.8 Responded/maintained accidents/incidents records in\naccordance with SOPs\n1.9 Followed security procedures/policies in accordance with\nenterprise practices and legislation\n1.10 Workplace kept in safe state in accordance with safety\n regulations\n2. Required\nKnowledge and\nAttitude\n\n2.1\nKinds and Uses of PPE\n2.2\nIdentification of Safety Signs and Symbols\n2.3\n5S of Good Housekeeping\n2.4\nGeneral OH&S principles, responsibilities and legislations\n2.5\nOH&S requirements in relations to work safety\n2.6\nEnvironmental requirements relative to work safety\n2.7\nHazard identification and avoidance in the workplace\n2.8\nFirst-aid treatment procedures\n2.9\nKinds of emergency situations – causes and how to deal\nwith different situations\n2.10 Kinds of injuries and effects\n2.11 Accident/hazard reporting\n2.12 Basic security procedures\n2.13 Uses of Manuals\n3. Required Skills\n3.1 Wearing appropriate PPE\n3.2 Reading skills required to interpret work instruction\n3.3 Identifying safety signs and symbols\n3.4 Practice of CPR, Mouth to Mouth Resuscitation and other\nFirst-Aid Treatment\n3.5 Problem solving in emergency situation\n3.6 Handling injured worker\n3.7 Coordination of work in times of emergency\n3.8 Fire fighting procedures and techniques\n3.9 Reporting/recording accidents and potential hazards\n\n--- PDF PAGE 45 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n43\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Work place\n4.2 Materials, tools and equipment relevant to the proposed\nactivity/task\n4.3 Safety signs\n4.4 Safety devices\n4.5 Accident reporting procedures\n4.6 First-aid materials and guidelines\n5. Methods of\nAssessment\nCompetency should be assessed through:\n\n5.1 Direct observation while task is being undertaken\n21.1 Written test/questioning relevant to Required knowledge\n21.2 Assessment of Required knowledge and practical skills\nmay be combined\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.3 Assessment shall be observed while task are being\nundertaken whether individually or in group in accordance\nwith the approved industry OHSA regulations\n6.4 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 46 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n44\n\nUNIT TITLE\n: DOCUMENT WORK ACCOMPLISHED\n\nUNIT CODE\n\n : HVC311205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ndocumenting work accomplished.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Identify forms and data\n1.3 Forms are selected based on the reports\nto be prepared\n1.4 Data are collected based on the reports\nto be prepared\n2. Prepare reports\n2.1 Reports are completed using standard\nform as per company procedures\n2.2 Reports provide details of work\ncompleted, further action to be taken and\nother details as per company procedures\n2.3 Reports are completed and submitted\nwithin specified time to the concerned\npersonnel/supervisor\n\n--- PDF PAGE 47 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n45\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Forms\n1.1 Warranty Paper Request\n1.2 Operating Log Sheet\n1.3 Requisition Forms\n2. Data\n\n2.1 Current draw\n2.2 Operating\n2.3 Unit specifications\n2.4 Records of work accomplished\n2.5 Further work required\n2.6 Spare parts used\n3. Reports\n\n3.1 Start-up commissioning\nReport\n3.2 Warranty Paper Request\n3.3 Turn-over Report\n3.4 Operating Log Sheet\n3.5 Service Report\n3.6 Trouble Call Report\n3.7 Requisition\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nCompetency requires evidence that the candidate:\n1.1 Prepared reports used terminology and language\nappropriate to all users\n1.2 Prepared reports to include alternatives, views, approaches\nand other findings and recommendations for consideration\nby the supervisor\n1.3 Prepared reports are coherent and based on actual\nfindings/analysis/results\n1.4 Prepared reports are accomplished, completed as per\nstandard format and submitted within specified time to the\nconcerned supervisor\n2. Required\nKnowledge and\nAttitude\n2.1 SOURCES OF INFORMATION\n• Service manual\n• Parts catalogue\n• Service report\n• Price estimates/quotation\n• Warranty card\n• Types and Uses of Forms\n• Parts and Accessories\n3. Required Skills\n3.1 Writing skills needed to complete prepared report forms\n3.2 Reading skills used to read manuals and specifications\n4. Resource\nImplications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Materials relevant to the proposed activity\n5. Methods Of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to Required knowledge\n6. Context For\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 48 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n46\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: INSTALL PACKAGE TYPE AIR-CONDITIONING UNIT\n(PACU)\n\nUNIT CODE :"
