              "source_text": "Assessment requires evidence that the candidate: 1.1 Completed pre-start-up, testing and commissioning checks and complied with manufacturer’s manuals. 1.2 Performed electrical related checks. 1.3 Performed refrigerant piping related checks. 1.4 Performed condensing unit related checks. 1.5 Performed compressor unit related checks. 1.6 Performed indoor unit related checks. 1.7 Performed metering device related checks. 1.8 Charged air-conditioning system with the correct refrigerant 1.9 Tested and set electrical, pneumatic and other controls to meet specified and safety performance requirements 1.10 Communicated interactively with others where applicable to ensure safe and effective work operations 1.11 Completed commissioning and starting-up procedures in accordance with the standard procedures 2. Required Knowledge and Attitude 2.1 SAFETY PRACTICES • Protective personal equipment/safety gears • Safe handling of tools and equipment • Proper handling of refrigerants • Safety signs and symbols • Safety hazard • Good housekeeping 2.2 BLUEPRINT READING AND PLAN SPECIFICATION • Electrical wiring control diagram • HVAC-R plan/symbols and abbreviation 2.3 TOOLS/MATERIALS: USES AND SPECIFICATIONS • Types of electrical controls • Types of expansion valve • Types of compressor motor • Types of condenser • Types of evaporator • Types of refrigerant • Types of pressure control • Types of defrost timer • Types of fan motor • Types of fan • Types of pipe • Types of filter drier • Types of filter/strainer element • Types of thermostat • Types of circuit breaker • Types of magnetic contactor • Types of unloader • Types of compressor • Types of pump 2.4 MAINTENANCE • Preventive maintenance --- PDF PAGE 82 --- TR - RAC SERVICING NC III Promulgated _______________ 80 2.5 TRADE THEORY • Basic electricity • Basic refrigeration cycle • Fundamentals of air- conditioning and control • Interlocking control sequence • Fundamentals of piping • Fan characteristics • Pump principles • Cooling tower principles 2.6 PROCESSES/ PROCEDURES • Compressor test procedures • Power supply test procedures • Cooler/evaporator test procedures • Condensing unit test procedures • Pump test procedures • Cooling tower test procedures • Thermostatic expansion valve test procedures • Automatic expansion valve test procedures • Electrical control test procedures • Leak testing procedure (for refrigeration circuit and water piping) • Pressure testing procedure • Vacuum testing procedure • Refrigerant charging procedure • Pumpdown procedure • Crank case heater test procedures • Unloading test procedures • Start-up procedure 2.7 LEGISLATION • Clean Air Act (RA 8749) • Montreal Protocol • Ozone Depleting Refrigerants (ODRs) • HVAC-R Code of Practice • Chemical Control Orders (CCOs) and other issuances relating to ozone-depleting substances (ODS): • R.A. 6969 – Toxic substances and hazardous and nuclear wastes control act of 1990. • DENR-AO 1992-29 - IRR of R.A. 6969 • DENR-AO 2004-08 – Revised CCO for ODS • EMB MC 2005-03 – Alternatives to ODS 3. Required Skills 3.1 Interpreting plan and details 3.2 Preparing materials 3.3 performing work safety 3.4 Proper handling of electrical tools and testing equipment 3.5 Performing pre-start-up activity 3.6 Performing electrical testing 3.7 Performing mechanical testing 3.8 Performing commissioning activity 3.9 Communicating effectively"
