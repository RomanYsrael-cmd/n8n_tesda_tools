        "source_text": "HVC311205\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nchecking condition, performing preventive maintenance and\nstoring of tools and equipment based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Check condition of\ntools and\nequipment\n\n1.1 Materials, tools and equipment are identified according to\nclassification and job requirements\n1.2 Non-functional tools and equipment are segregated and\nlabeled according to classification\n1.3 Safety of tools and equipment are observed in accordance\nwith manufacturer's instructions\n1.4 Condition of PPE are checked in accordance with\nmanufacturer's instructions\n2. Perform basic\npreventive\nmaintenance\n2.1 Appropriate lubricants are identified according to types of\nequipment\n2.2 Tools and equipment are lubricated according to preventive\nmaintenance schedule or manufacturer's specifications\n2.3 Measuring instruments are checked and calibrated in\naccordance with manufacturer’s instructions\n2.4 Tools are cleaned and lubricated according to standard\nprocedures\n2.5 Defective instruments, equipment and accessories are\ninspected and replaced according to manufacturer’s\nspecifications\n2.6 Tools are inspected, repaired and replaced every after use\n2.7 Work place are cleaned and in safe state in line with OHSA\nregulations\n3. Store tools and\nequipment\n\n3.1 Inventory of tools, instruments and equipment are conducted\nand recorded as per company practices\n3.2 Tools and equipment are stored safely in appropriate locations\nin accordance with manufacturer's specifications or company\nprocedures\n\n--- PDF PAGE 38 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n36\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\n-\nCutting tools - hacksaw, crosscut saw, rip\nsaw\n-\nBoring tools - auger, brace, grinlet, hand drill\n-\nHolding tools - vise grip, C-clamp, bench\nvise\n-\nThreading tools - die and stock, taps\n\n2.2Measuring instruments/Equipment\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n4. Forms\n4.4 Maintenance schedule forms\n4.5 Requisition Slip\n4.6 Inventory Form Slip\n4.7 Inspection Form Slip\n4.8 Procedures\n\n--- PDF PAGE 39 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n37\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\n instruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and its accessories\n1.5 Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained work place in accordance with OHSA regulations\n1.8 Stored tools and equipment safely in appropriate locations\nand in accordance with company practices\n2. Required\nKnowledge and\nAttitude\n\n2.1 SAFETY PREFRIGERATIONTICES\n• Use of PPE\n• Handling of tools and equipment\n• Good housekeeping\n2.2 MATERIALS, TOOLS AND EQUIPMENT\n• Types and Uses of lubricants\n• Types and Uses of cleaning materials\n• Types and Uses of measuring instruments and equipment\n2.3 PREVENTIVE MAINTENANCE\n• Methods and techniques\n•\nProcedures\n3. Required\nSkills\n3.1 Preparing maintenance materials, tools and equipment\n3.2 Proper handling of tools and equipment\n3.3 Performing preventive maintenance\n3.4 Following instructions\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Work place\n4.2 Maintenance Schedule\n4.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Written test/questioning relevant to Required knowledge\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 40 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n38\n\nUNIT TITLE\n: PERFORM HOUSEKEEPING AND SAFETY\n PRACTICES FOR REFRIGERATION SERVICING\n\n UNIT CODE\n :"
