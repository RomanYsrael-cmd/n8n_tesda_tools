        "source_text": "--- PDF PAGE 48 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n46\n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY: INSTALL PACKAGE TYPE AIR-CONDITIONING UNIT \n(PACU)  \n \nUNIT CODE                      : HVC723340  \n \nUNIT DESCRIPTOR         : This unit covers the knowledge, skills and attitudes to \nsafely install the main packaged-type air-conditioning unit \n(PACU) components and units as well as accessories \nbased on manufacturer's recommendations. It also \nincludes site survey, installation of electrical and piping \nsystems. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of \nVariables \n1. Survey site for \ninstallation \n1.1 Work instructions /technical plans/drawings are \ninterpreted as per job requirements \n1.2 Installation requirements are verified in line \nwith site conditions \n1.3 Alteration/comments are prepared as per survey \nconducted \n1.4 Result of survey is prepared in line with \nenterprise procedures.\n2. Install PACU piping \nsystems \n2.1 \nPiping materials are prepared consistent with \nthe approved designs and specifications  \n2.2 \nBrackets and supports are mounted in \naccordance with site conditions \n2.3 \nPiping are installed, cleaned and tested in \naccordance with manufacturer's specifications, \nrecommendations and RAC Code of Practice \n2.4 \nCorrect insulation and sealing/adhesive \nmaterials are used and installed in accordance \nwith manufacturer's specifications \n3. Install PACU electrical \nsystems \n3.1 Electrical materials are prepared consistent with \njob requirements and are checked for damage \n3.2 Appropriate PPE is selected in line with the job \nrequirements \n3.3 Electrical system is laid-out and installed in \naccordance with the approved designs, \nspecifications, working plans, drawings and \napplicable provisions of the latest edition of PEC \n3.4 Electrical system is tested/energized in line with \napplicable provisions of the latest edition of PEC \n3.5 Report on testing/energization of electrical \nsystem is prepared in line with enterprise \nprocedures\n\n--- PDF PAGE 49 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n47\n \n4. Install indoor and \noutdoor unit and \naccessories \n \n \n4.1 Indoor units and air-cooled condensing units \n(ACCUs) are mounted in accordance with site \nconditions and manufacturer’s specifications  \n4.2 Accessories are installed according to \nmanufacturer’s specifications \n4.3 Refrigerant lines are connected in accordance \nwith manufacturer’s specifications \n4.4 Field wiring connections are terminated in \naccordance with manufacturer’s specifications \n4.5 Condensate drain line is installed in accordance \nwith manufacturer’s specification. \n4.6 Faults/problems arising from installation are \ncorrected in line with standard operating \nprocedures \n4.7 Pre-start up checks are undertaken in \naccordance with manufacturer’s specifications \nand enterprise policies\n\n--- PDF PAGE 50 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n48\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1 \nInstallation requirements \nMay include: \n1.1 Piping requirements \n1.2 Electrical requirements  \n1.3 Drain location \n1.4 Mounting location \n1.5 Equipment requirements\n2 \nPiping materials \nMay include: \n2.1 Pipes and fittings \n2.2 Tubing \n2.3 Insulations \n2.4 Hangers, clamps, brackets\n \n3 \nElectrical materials \n \n \nMay include: \n3.1 Electrical tape \n3.2 Wire connector \n3.3 Wires and cables \n3.4 Breaker \n3.5 Terminal clips/plugs\n \n4 \nElectrical system \nMay include: \n4.1 Electrical conduits \n4.2 Controls and protective devices \n4.3 Electrical control wires/cables \n4.4 Power supply\n5 \nIndoor units \nMay include: \n5.1 Package-type air-con \n5.2 Split-type air-con \n5.2.1 \nCassette type \n5.2.2 \nCeiling (free-blow) \n5.2.3 \nCeiling concealed  \n5.2.4 \nWall type \n5.2.5\nFloor mounted\n6 \nRefrigerant lines \nMay include: \n6.1 Gas lines (vapor lines) \n6.2 Liquid lines \n7 \nCondensate drain \nMay include: \n7.1 PVC pipe/clamp \n7.2 Plastic tubing/clamp \n7.3 G.I. or metal tubing/clamp\n8 \nAccessories  \nMay include: \n8.1 filter drier (soldered/flared) \n8.2 sight glass or moisture indicator \n8.3 solenoid valve (optional)\n9 \nPre-start up checks \nMay include: \n9.1 Insulation \n9.2 Termination \n9.3 Sequence test \n9.4 Refrigerant leakage \n9.5 Equipment\n\n--- PDF PAGE 51 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n49\n    \n    EVIDENCE GUIDE \n1. Critical aspects  \n     of competency \nAssessment requires evidence that the candidate: \n1.1 Conducted survey of site for installation of the unit. \n1.2 Prepared and installed piping materials correctly. \n1.3 Used and installed correct insulation and sealing/adhesive \nmaterials. \n1.4 Prepared, laid out and installed electrical system correctly. \n1.5 Tested/Energized electrical system in line with applicable \nprovision of latest edition of PEC. \n1.6 Installed indoor and outdoor units and accessories \naccordingly. \n1.7 Corrected faults/problems arising from installation. \n1.8 Undertook pre-start up checks. \n2. Required   \n     Knowledge \nand Attitude \n2.1  SAFETY PRACTICES \n Protective personal equipment/safety gears \n Handling of tools, equipment and accessories \n Safety signs and symbols \n Good housekeeping \n2.2  TRADE MATHEMATICS/MENSURATION \n Linear measurements \n Ratio and proportion \n Dimension \n2.3  BLUEPRINT READINGS \n Mechanical plans, symbols and abbreviations \n Electrical plans, symbols and abbreviations \n Architectural/Structural plans \n Plumbing plans, symbols and abbreviations \n2.4  TRADE THEORY \n Basic refrigeration cycle \n Basic masonry  \n Basic sheet metal \n Basic welding \n Basic electricity \n Basic plumbing \n Fundamental of refrigeration \n How to select wire size \n Principles of air distribution \n Equipment selection and application \n Knowledge to understand the geographical location/site \nlocation \n2.5 LEGISLATION \n Clean Air Act (RA 8749) \n Montreal Protocol/DENR rules \n\nOzone Depleting Refrigerants (ODRs)\n\n--- PDF PAGE 52 ---\nTR - RAC SERVICING NC III                                                                        Promulgated ____________________ \n50\n3.  Required   \nSkills \n3.1  Interpreting plan and details \n3.2  Preparing materials \n3.3  Proper handling  of tools and equipment \n3.4  Performing work safety practices \n3.5  Work set-up and planning \n3.6  Basic electrical installation \n3.7  Tube processing  \n3.8  Plumbing works \nCommunication skills\n4.  Resource  \nImplications \nThe following resources MUST be provided: \n4.1  Technical plan/drawing relevant to the task \nWork place location \n4.2  Tools and equipment appropriate to installing PACU \nprocesses \n4.3  Materials relevant to the proposed activity \n4.4  Drawings and specifications relevant to the task \n5.  Methods of  \nAssessment \n \nCompetency must be assessed through: \n5.1 Direct observation  \n5.2 Demonstration  \n5.3 Questions related to Required knowledge  \n6.  Context for   \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting\n",
