  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in RAC SERVICING (PACU/CRE) NC III.\n\nBASIC COMPETENCIES\n\nUNIT TITLE\n\n:\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n :\n500311109\n\n UNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\n\nattitudes required to lead in the dissemination\n\nand discussion of ideas, information and issues\n\nin the workplace.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace\nprocesses\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4. Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1.\nNon-verbal gestures\n1.2.\nVerbal\n1.3.\nFace to face\n1.4.\nTwo-way radio\n1.5.\nSpeaking to groups\n1.6.\nUsing telephone\n1.7.\nWritten\n1.8.\nInternet\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written\nform\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Required knowledge\nand Attitudes\n2.1.\nOrganization requirements for written and electronic\ncommunication methods\n2.2.\nEffective verbal communication methods\n3. Required Skills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 6 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n4\nUNIT TITLE\n\n:\nLEAD SMALL TEAMS\n\nUNIT CODE\n :\n500311110\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and\n\nattitudes to lead small teams including setting\n\nand maintaining team and individual performance\nstandards.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1.\nWork requirements are identified and presented to\nteam members\n1.2.\nReasons for instructions and requirements are\ncommunicated to team members\n1.3.\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign\nresponsibilities\n2.1.\nDuties and responsibilities are allocated having regard\nto the skills, knowledge and aptitude required to\nproperly undertake the assigned task according to\ncompany policy\n2.2.\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for\nteam members\n3.1.\nPerformance expectations are established based on\nclient needs and according to assignment requirements\n3.2.\nPerformance expectations are based on individual team\nmembers duties and area of responsibility\n3.3.\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1.\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2.\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3.\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to appropriate\npersonnel according to employer policy\n4.4.\nTeam members are kept informed of any changes in the\npriority allocated to assignments or tasks which might\nimpact on client/customer needs and satisfaction\n4.5.\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6.\nFollow-up communication is provided on all issues\naffecting the team\n4.7.\nAll relevant documentation is completed in accordance\nwith company procedures\n\n--- PDF PAGE 7 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n5\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\n2.1. Roster/shift details\n3. Monitor\nperformance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 8 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n6\nEVIDENCE GUIDE\n\n1. Critical\nAspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2. Assessed and monitored team and individual performance\nagainst set criteria\n1.3. Represented concerns of a team and individual to next level\nof management or appropriate specialist and to negotiate on\ntheir behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5. Set and communicated performance expectations for a range\nof tasks and duties within the team and provided feedback to\nteam members\n2. Required\nKnowledge\nand Attitude\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6.\nTeam member’s duties and responsibilities\n3. Required\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4.\nNegotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or task\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 9 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n7\n\nUNIT TITLE\n\n: DEVELOP AND PRACTICE NEGOTIATION\n SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes\n\n required to collect information in order to negotiate\n to a desired outcome and participate in the\n negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1 Information on preparing for negotiation is identified\nand included in the plan\n1.2 Information on creating non verbal environments for\npositive negotiating is identified and included in the plan\n1.3 Information on active listening is identified and included\nin the plan\n1.4 Information on different questioning techniques is\nidentified and included in the plan\n1.5 Information is checked to ensure it is correct and up-to-\ndate\n2. Participate in\nnegotiations\n2.1 Criteria for successful outcome are agreed upon by all\nparties\n2.2 Desired outcome of all parties are considered\n2.3 Appropriate language is used throughout the negotiation\n2.4 A variety of questioning techniques are used\n2.5 The issues and processes are documented and agreed\nupon by all parties\n2.6 Possible solutions are discussed and their viability\nassessed\n2.7 Areas for agreement are confirmed and recorded\n2.8 Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 10 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 11 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n9\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Required\nKnowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Required Skills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 12 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n10\n\nUNIT TITLE\n:\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause of problems.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1.\nIdentify the\nproblem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3.\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental\ncauses of the\nproblem\n2.1.\nPossible causes are identified based on experience\nand the use of problem solving tools / analytical\ntechniques.\n2.2.\nPossible cause statements are developed based on\nfindings\n2.3.\nFundamental causes are identified per results of\ninvestigation conducted\n3.\nDetermine\ncorrective action\n3.1.\nAll possible options are considered for resolution of\nthe problem\n3.2.\nStrengths and weaknesses of possible options are\nconsidered\n3.3.\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4.\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures\n4.\nProvide\nrecommendation/\ns to manager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to appropriate\npersonnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 13 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical\ntechniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 14 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n12\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including\nnew, unusual and improbable situations that may have\nhappened.\n2. Required\nKnowledge and\nAttitude\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of fundamental\ncause, determining the corrective action and\nprovision of recommendations\n2.2.1. Relevant equipment and operational\nprocesses\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n3. Required Skills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 15 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n13\n\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios / case\nstudies / what ifs will be required as well as bank of\nquestions which will be used to probe the reason\nbehind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over a\nrange of situations, which will include disruptions to normal,\nsmooth operation. Simulation may be required to allow for\ntimely assessment of parts of this UNIT TITLE. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n6. Context for\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 16 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n14\nUNIT TITLE\n: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts\nand techniques.\n\nELEMENT\nPerformance Criteria\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Identify\nmathematical tools\nand techniques to\nsolve problem\n1.1 Problem areas are identified based on given condition\n1.2 Mathematical techniques are selected based on the\ngiven problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the level\nof accuracy required for the problem\n2.3 Results of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected\nand required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 17 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Required Knowledge\nand Attitude\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Required Skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n16\nUNIT TITLE\n: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This UNIT TITLE covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on\njob requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced as\nper established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance with\nthe industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to ensure\nits operative ability\n3.2 Updating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3 Technology failure/ defect is immediately reported to the\nconcern/responsible person or section for appropriate\naction\n\n--- PDF PAGE 19 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n17\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5Training technology\n2. Management\nconcepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5S\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard\noperating procedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1 Written instruction/manuals of specific technology/\nequipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health\nand safety\nprocedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 20 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n18\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Required Knowledge\nand Attitudes\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Required Skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nAssessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 21 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n19\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: PREPARE MATERIALS AND TOOLS\n\nUNIT CODE\n: HVC713201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nidentifying, requesting and receiving construction\nmaterials and tools based on the required performance\nstandards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n\n1. Identify materials\n\n1.1 Materials are listed as per job\nrequirements\n1.2 Quantity and description of materials\nconformed to the job requirements\n1.3 Tools and accessories are identified\naccording to job requirements\n\n2. Requisition materials\n\n2.1 Materials and tools needed are requested\naccording to the list prepared\n2.2 Request is done as per company\nstandard operating procedures\n2.3 Substitute materials and tools are provided\nwithout sacrificing cost and quality of the\nwork\n\n3. Receive and inspect\n materials\n\n3.1 Materials and tools issued are inspected\nas per quantity and specification\n3.2 Tools, accessories and materials checked\nfor damages according to enterprise\nprocedures\n3.3 Materials and tools are set aside to\nappropriate location nearest to the\nworkplace\n\n--- PDF PAGE 22 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n20\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials and tools\n1.1 Air-conditioning\n1.2 Refrigeration\n2. Description of materials and\ntools\n\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n3. Company standard\nprocedures\n3.1 Job Order\n3.2 Requisition Slip\n3.3 Borrower Slip\n\nEVIDENCE GUIDE\n\n1. Critical\nAspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list\nprepared and as per company standard operating\nprocedures\n1.3 Inspected issued materials and tools as per quantity and\njob specifications\n1.4 Tools provided with appropriate safety devices\n2. Required\nKnowledge\nand Attitude\n2.1 Types and uses of HVAC/R materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n3. Required Skills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following Instructions\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the UNIT TITLE\n4.3 Technical plans, drawings and specifications relevant to\nthe activities\n5. Method of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation and\n5.2 Oral questioning\n6. Context for\nAssessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 23 ---\nTR - RAC SERVICING NC III Promulgated ____________________\n21\n\n UNIT TITLE\n:\nINTERPRET TECHNICAL DRAWINGS AND\n\nPLANS\n\nUNIT CODE\n:\nHVC311202\n\n UNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in\nanalyzing and interpreting symbols, data and work plan\nbased on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the\nRange of Variables\n1. Analyze signs, symbols and data\n\n1.1 Technical plans are obtained according to\njob requirements\n1.2 Signs, symbols and data are identified\naccording to job specifications\n1.3 Sign