sion\nDemonstration\nTrainee hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n7\nPerform start-up test\nand commissioning for\nPACU\n\n7.1 Prepare for pre-start-\nup, test and\ncommissioning for\nPACU\n7.2 Conduct pre-start-up,\ntesting and\ncommissioning for\nPACU\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n8\nPerform start-up test\nand commissioning for\nCRE\n\n8.1 Prepare for pre-start-\nup, test and\ncommissioning for\nCRE\n8.2 Conduct pre-start-up,\ntesting and\ncommissioning for\nCRE\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n--- PDF PAGE 92 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n90\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery shall be guided by the 10 basic principles of competency-based TVET:\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nTraining program allows for recognition of prior learning (RPL) or current\ncompetencies;\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n\n•\nModular/self-paced is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery.\n\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n\n•\nSupervised Industry Training or On-the-Job Training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n•\nProject-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 93 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n91\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may be\nincluded. Passing entry written examinations may also be indicated if\nnecessary.\n\nBefore entering this course, the learner:\n• Must have undergone RAC Servicing (DomRAC) Training or a holder of\nRAC Servicing NC II or with at least one-year work experience in RAC\nservicing\n• Can communicate both oral and written\n• Good moral character\n• Can perform basic mathematical computation\n• Physically and mentally fit\n\n3.4\nLIST OF TOOLS, EQUIPMENT 