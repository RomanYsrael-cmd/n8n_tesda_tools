/trainees.\n\nSPACE REQUIREMENTS\nSpace (m)\nArea in\nSq. Meters\nTotal Area\nin\nSq. Meters\nA. LECTURE AREA*\n4.00 x 8.00\n32.00\n32.00\nB. LEARNING RESOURCE AREA\n4.00 x 6.00\n24.00\n24.00\nC. TOOL/STORAGE AREA*\n4.00 x 4.00\n16.00\n16.00\nD. WASH, TOILET AND LOCKER\nROOM*\n\n3.00 x 4.00\n\n12.00\n\n12.00\nTOTAL\n84\nE. FACILITIES/ EQUIPMENT/\n CIRCULATION\n\n25\n\nTOTAL AREA\n\n109\n *Common facilities for all HVAC/R Courses\n\n3.6\nTRAINER’S QUALIFICATION FOR HVAC/R SECTOR\n\nRAC SERVICING (PACU/CRE) NC III\n\n• Must be National TVET Trainers Certificate (NTTC) Level 1 Holder\n• Good moral character\n• Must be physically and mentally fit\n• Must be computer literate\n• Must be a Civil Service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Board)\n• *Must have at least two (2) years job/industry experience\n\n*Optional: Only when required by the hiring institution\n\n Reference: TESDA Board Resolution No. 2004-03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit title.\n\n--- PDF PAGE 97 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n95"
