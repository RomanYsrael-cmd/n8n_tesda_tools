  "source_section_text": "SECTION 3. - TRAINING STANDARDS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for RAC Servicing (PACU/CRE) NC III.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title :\nRAC SERVICING (PACU/CRE) NC III\n PTQF\n:\nNC III\n\nNominal Training Duration: 18 Hours (Basic)\n\n 28 Hours (Common)\n180 Hours (Core)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in RAC\nServicing which install, service and maintain, troubleshoot and repair as well as\nstarting-up, testing and commissioning package-type air-conditioning unit\n(PACU) and commercial refrigeration equipment (CRE).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes\n1.2 Lead workplace discussion\n1.3 Identify and communicate\nissues arising in the\nworkplace\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Lead small\nteams\n2.1 Provide team leadership\n2.2 Assign responsibilities\n2.3 Set performance\nexpectations for team\nmembers\n2.4 Supervise team\nperformance\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 88 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n86\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Plan negotiations\n3.2 Participate in negotiations\nDiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Solve problems\nrelated to work\nactivities\n4.1 Identify the problem\n4.2 Determine fundamental\ncause of problem\n4.3 Determine corrective/\npreventive action\n4.4 Provide/Convey\nrecommendations to\nmanager\nDiscussion\nCase study\nSymposium\nObservation\nInterview\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblems\n5.2 Apply mathematical\ncomputation\n5.3 Analyze the result of\nmathematical application\nDiscussion\nCase study\nContextual\nlearning\nQuestioning (oral\nand written)\n6. Use relevant\ntechnologies\n6.1 Study/Select appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/Enhance relevant\ntechnology\nDiscussion\nCase study\nSymposium\nObservation\nInterview\nCase study\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nmaterials and\ntools\n1.1 Identify materials and tools\n1.2 Request materials and tools\n1.3 Receive and inspect\nmaterials and tools\nSelf-paced/\nModular\nDemonstration\nGroup\nDiscussion\nWritten\nPractical /\nPerformance Test\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring\ninstruments\n3.2 Carry-out measurements\nand calculations\n\nSelf-paced/\nModular\nDemonstration\nGroup\nDiscussion\n\nWritten/Oral\nExamination\nPractical\nDemonstration\n\n--- PDF PAGE 89 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n87\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform basic\nbench work\n\n4.1 Prepare materials, tools and\nequipment for layout\n4.2 Layout features in\nworkplace\n4.3 Cut sheets, plates and bars\n4.4 Smooth sheets plates and\nbars\n4.5 Drill holes in sheets, plates\nand bars\n4.6 Bore holes in sheet plates\nand bars\n4.7 Bend sheets, plates and\nbars\n4.8 Join sheets, plates and bars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job\ntra