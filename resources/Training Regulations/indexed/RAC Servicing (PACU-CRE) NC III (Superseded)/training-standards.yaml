    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title :\nRAC SERVICING (PACU/CRE) NC III\n PTQF\n:\nNC III\n\nNominal Training Duration: 18 Hours (Basic)\n\n 28 Hours (Common)\n180 Hours (Core)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in RAC\nServicing which install, service and maintain, troubleshoot and repair as well as\nstarting-up, testing and commissioning package-type air-conditioning unit\n(PACU) and commercial refrigeration equipment (CRE).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes\n1.2 Lead workplace discussion\n1.3 Identify and communicate\nissues arising in the\nworkplace\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Lead small\nteams\n2.1 Provide team leadership\n2.2 Assign responsibilities\n2.3 Set performance\nexpectations for team\nmembers\n2.4 Supervise team\nperformance\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 88 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n86\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Plan negotiations\n3.2 Participate in negotiations\nDiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Solve problems\nrelated to work\nactivities\n4.1 Identify the problem\n4.2 Determine fundamental\ncause of problem\n4.3 Determine corrective/\npreventive action\n4.4 Provide/Convey\nrecommendations to\nmanager\nDiscussion\nCase study\nSymposium\nObservation\nInterview\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblems\n5.2 Apply mathematical\ncomputation\n5.3 Analyze the result 