    "source_text": "SECTION 3. - TRAINING STANDARDS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for RAC Servicing (PACU/CRE) NC III.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title :\nRAC SERVICING (PACU/CRE) NC III\n PTQF\n:\nNC III\n\nNominal Training Duration: 18 Hours (Basic)\n\n 28 Hours (Common)\n180 Hours (Core)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in RAC\nServicing which install, service and maintain, troubleshoot and repair as well as\nstarting-up, testing and commissioning package-type air-conditioning unit\n(PACU) and commercial refrigeration equipment (CRE).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes\n1.2 Lead workplace discussion\n1.3 Identify and communicate\nissues arising in the\nworkplace\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Lead small\nteams\n2.1 Provide team leadership\n2.2 Assign responsibilities\n2.3 Set performance\nexpectations for team\nmembers\n2.4 Supervise team\nperformance\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 88 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n86\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Plan negotiations\n3.2 Participate in negotiations\nDiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Solve problems\nrelated to work\nactivities\n4.1 Identify the problem\n4.2 Determine fundamental\ncause of problem\n4.3 Determine corrective/\npreventive action\n4.4 Provide/Convey\nrecommendations to\nmanager\nDiscussion\nCase study\nSymposium\nObservation\nInterview\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblems\n5.2 Apply mathematical\ncomputation\n5.3 Analyze the result of\nmathematical application\nDiscussion\nCase study\nContextual\nlearning\nQuestioning (oral\nand written)\n6. Use relevant\ntechnologies\n6.1 Study/Select appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/Enhance relevant\ntechnology\nDiscussion\nCase study\nSymposium\nObservation\nInterview\nCase study\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nmaterials and\ntools\n1.1 Identify materials and tools\n1.2 Request materials and tools\n1.3 Receive and inspect\nmaterials and tools\nSelf-paced/\nModular\nDemonstration\nGroup\nDiscussion\nWritten\nPractical /\nPerformance Test\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring\ninstruments\n3.2 Carry-out measurements\nand calculations\n\nSelf-paced/\nModular\nDemonstration\nGroup\nDiscussion\n\nWritten/Oral\nExamination\nPractical\nDemonstration\n\n--- PDF PAGE 89 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n87\n\nUNIT TITLE\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform basic\nbench work\n\n4.1 Prepare materials, tools and\nequipment for layout\n4.2 Layout features in\nworkplace\n4.3 Cut sheets, plates and bars\n4.4 Smooth sheets plates and\nbars\n4.5 Drill holes in sheets, plates\nand bars\n4.6 Bore holes in sheet plates\nand bars\n4.7 Bend sheets, plates and\nbars\n4.8 Join sheets, plates and bars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job\ntraining\n\nInterview\nDemonstration\nDirect\nObservation\n5. Perform basic\nelectrical works\n5.1 Measure and analyze circuit\nand load resistance in\nelectrical system\n5.2 Measure and analyze\nvoltage in electrical system\n5.3 Measure and analyze\ncurrent in electrical system\n5.4 Test simple electrical\ncomponents and\nconnections\n5.5 Repair minor electrical\nsystem troubles\nModular\nComputer-\nbased training\n(Simulation)\nDemonstration\nOn- the-job\ntraining\n\nInterview\nComputer-based\nassessment\n(Simulation)\nDemonstration\nDirect\nObservation\n6. Maintain tools\nand equipment\n6.1 Check the conditions of\ntools and equipment\n6.2 Perform basic preventive\nmaintenance\n6.3 Store tools and equipment\nSmall Group\nDiscussion\nDemonstration\nof Practical\nSkills\nModular\nObservation and\nOral questioning\nDemonstration\nand Oral\nquestioning\nWritten test\n7. Perform\nhousekeeping\nand safety\npractices\n\n7.1 Sort materials, tools and\nequipment\n7.2 Clean workplace area,\nmaterials, tools and\nequipment\n7.3 Systematize dispensing and\nretrieval of materials, tools\nand equipment\n7.4 Identify and minimize/\neliminate hazards\n7.5 Respond and record\naccidents\n7.6 Follow basic securities\nSmall Group\nDiscussion\nDemonstration\nof Practical\nSkills\nModular\n\nObservation and\nOral questioning\nDemonstration\nand Oral\nquestioning\nWritten test\n\n8. Document work\naccomplished\n8.1 Identify forms and data\n8.2 Prepare reports\nLecture\nDemonstration\nof Practical\nSkills\nModular\nDemonstration\nand Oral\nquestioning\nWritten Test\n\n--- PDF PAGE 90 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n88\nCORE COMPETENCIES\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n1 Install package type\nair-conditioning unit\n(PACU)\n\n1.1 Survey site for\ninstallation\n1.2 Install PACU piping\nsystems\n1.3 Install PACU\nelectrical systems\n1.4 Install indoor and\noutdoor unit and\naccessories\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n2 Install Commercial\nRefrigeration\nEquipment (CRE)\n\n2.1 Survey site for\ninstallation\n2.2 Install CRE piping\nsystems\n2.3 Install CRE\nelectrical systems\n2.4 Install indoor and\noutdoor unit and\naccessories\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect observation\nand Questioning\nDemonstration\n3 Service and Maintain\nPACU\n\n3.1 Prepare for\nmaintenance\nactivities\n3.2 Check and adjust air-\nconditioning\naccessories, controls\nand operating\nconditions\n3.3 Maintain lubrication\nsystem in PACU\n3.4 Maintain refrigeration\nsystem in PACU\n3.5 Maintain air\ndistribution system in\nPACU\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect observation\n and Questioning\nDemonstration\n4 Service and Maintain\nCRE\n\n4.1 Prepare for\nmaintenance\nactivities\n4.2 Check and adjust\nrefrigeration\naccessories, controls\nand operating\nconditions\n4.3 Maintain lubrication\nsystem in CRE\n4.4 Maintain refrigeration\nsystem in CRE\n4.5 Maintain air\ndistribution system in\nCRE\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n--- PDF PAGE 91 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n89\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n5 Troubleshoot and\nrepair PACU\n\n5.1 Plan and prepare\nfor troubleshooting\nand repair\n5.2 Identify and repair\nfaults/problems\n5.3 Perform refrigerant\nrecovery/ recycling\nand retrofitting on\nair conditioning\nsystems\n5.4 Test run air-\nconditioning unit\n\nDiscussion\nDemonstration\nTrainee hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n6 Troubleshoot and\nrepair CRE\n\n6.1 Plan and prepare\nfor troubleshooting\nand repair\n6.2 Identify and repair\nfaults/problems\n6.3 Perform refrigerant\nrecovery/ recycling\nand retrofitting on\ncommercial\nrefrigeration\nsystems\n6.4 Test run CRE\n\nDiscussion\nDemonstration\nTrainee hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n7\nPerform start-up test\nand commissioning for\nPACU\n\n7.1 Prepare for pre-start-\nup, test and\ncommissioning for\nPACU\n7.2 Conduct pre-start-up,\ntesting and\ncommissioning for\nPACU\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n8\nPerform start-up test\nand commissioning for\nCRE\n\n8.1 Prepare for pre-start-\nup, test and\ncommissioning for\nCRE\n8.2 Conduct pre-start-up,\ntesting and\ncommissioning for\nCRE\n\nDiscussion\nDemonstration\nTrainee Hands-on\n\nDirect observation\n and Questioning\nDemonstration\n\n--- PDF PAGE 92 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n90\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery shall be guided by the 10 basic principles of competency-based TVET:\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nTraining program allows for recognition of prior learning (RPL) or current\ncompetencies;\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n\n•\nModular/self-paced is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery.\n\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n\n•\nSupervised Industry Training or On-the-Job Training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n•\nProject-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 93 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n91\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may be\nincluded. Passing entry written examinations may also be indicated if\nnecessary.\n\nBefore entering this course, the learner:\n• Must have undergone RAC Servicing (DomRAC) Training or a holder of\nRAC Servicing NC II or with at least one-year work experience in RAC\nservicing\n• Can communicate both oral and written\n• Good moral character\n• Can perform basic mathematical computation\n• Physically and mentally fit\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nRAC SERVICING (PACU/CRE) NC III\n\nRecommended list of tools, equipment and materials for the training of\n25 trainees for RAC Servicing (PACU/CRE) NC III.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n10\nsets\nPush and Pull\nRule\n5 units\nMasonry drill\n2\nrms\nForm Report\n10\nsets\nMeter stick\n5 units\nMotor compressor\n25\nsets\nBlueprint\n10\nsets\nSpirit\nlevel/water level\n5 units\nFan motor\n25\nsets\nManufacturer’s\nmanual\n10\nsets\nScrew driver\n2 units\nHigh Pressure\nwater\n25\nsets\nSealant\n10\nsets\nPliers\n2 units\nHigh Pressure\nwater\n25\nsets\nCondensate draine\n10\nsets\nWrench Box\n5 units\nRefrigerator units\n10\nsets\nElectrical wire\n10\nsets\nScrew driver\n5 units\nVacuum pump\n5\nunits\nCircuit breaker/safety\nswitch\n10\nsets\nCrimping tools\n5 sets\nEvaporator fan and\nmotor\n25\nsets\nWiring diagrams\n10\nsets\nBending tool\n5 units\nOxy-Acetylene\nwelding outfit\n25\nsets\nCourseware\n(Learning elements\nand Manuals)\n10\nsets\nSwaging tool\n5 units\nEvaporator fan and\nmotor\n10\nsets\nSwitch\n\n10\nsets\nFlaring tool\n5 units\nDefective air-swing\nmotor\n10\nsets\nCapacitor\n\n--- PDF PAGE 94 ---\nTRAINING REGULATION – RAC Servicing (PACU/CRE) NC III (DRAFT COPY)\n\n92\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n10\nsets\nTube cutters\n5\nunits\nGood condition air-\nswing motors\n10\nsets\nRelay\n10\nunits\nVernier caliper\n5\nunits\nRefrigerator and air-\nconditioning unit\nwith leak piping\n5 sets\nPhilippine Electrical\nCode\n10\nunits\nAdjustable wrench\n\n10\nsets\nElectrical tape\n10\nsets\nOpen end wrench\n2\nunits\nOverload protector\n15\nsets\nAir filters\n10\nunits\nMulti-tester\n5\nunits\nPackage type A/C\nunit\n25\nsets\nRequisition slip\n10\nsets\nClamp ammeter\n3\nunits\nArc welding machine\n5\nliters\nOil\n5 sets\nMegger tester\n5\nunits\nRecovery/recycling\nmachine\n5\nunits\nGrease\n5\nunits\nLeak detector\n5\nunits\nCom