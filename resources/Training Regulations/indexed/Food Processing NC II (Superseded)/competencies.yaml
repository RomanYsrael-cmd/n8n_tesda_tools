          "source_text": "1. Prepare \nEquipment, \nTools, Materials \nand Utensils \n1.1 \nEquipment and tools for salting, curing and \nsmoking are prepared in accordance with \nmanufacturer’s specifications. \n1.2 \nEquipment for the above food processing \nmethods are checked, sanitized and calibrated in \naccordance with manufacturer’s specifications. \n1.3 \nKitchen utensils for the above food processing \nmethods are readied and sanitized in accordance \nwith manufacturer’s specifications. \n1.4 \nOffice \nequipment \nand \nmaterials/ \nsupplies \nneeded are prepared in accordance with approved \nspecifications. \n2. Prepare the Raw \nMaterials \n2.1 \nRaw materials are sorted and graded in \naccordance with specifications  \n2.2 \nEggs for salting are cleaned and washed in \naccordance with approved standard procedures. \n2.3 \nPoultry for curing are skinned, eviscerated and \nwashed in accordance with approved specifications \nand standard procedures. \n2.4 \nMeat for curing are deskinned, deboned, sliced, \nchopped and minced in accordance with approved \nspecifications and standard procedures. \n2.5 \nFish/other marine products are cleaned, descaled, \neviscerated, deboned, filleted and washed in \naccordance with approved specifications and \nstandard procedures. \n2.6 \nCleaned raw materials are weighed in accordance \nwith approved specifications\n\n--- PDF PAGE 49 ---\n__________________________________________________ \nTR- Food Processing NC II                                                         \n47\n3. Prepare Salting \nand Curing \nSolutions and \nMixtures \n3.1 \nRequired salt and other ingredients and adjuncts \nfor salting and curing are measured and weighed in \nline \nwith \napproved \nspecifications \nand \nOHS \nrequirements \n3.2 \nRequired ingredients for pumping pickle, cover \npickle and dry cure mixture are measured and \nweighed in line with approved specifications \n \n4. Cure the \nMaterials \n4.1 \nCuring mixture and prepared materials are mixed in \naccordance with approved specifications and \nenterprise requirements \n4.2 \nMixture is allowed to be cured at room temperature \nor refrigerated temperature at appropriate number \nof days. \n4.3 \nMaterials being cured are kept submerged in \nsolution to obtain even distribution/penetration of \ncure mixture in line with approved specifications \n5. Finish the Cured \nMaterials \n5.1 \nCured food materials are removed from the \nsolution, washed and drained in accordance with \nstandard operating procedures \n5.2 \nDrained cured materials are cooked in appropriate \ncooking medium \n5.3 \nCooked cured products are smoked according to  \nspecifications \n5.4 \nCooked cured smoked products are transferred to \ncontainers and cooled according to specifications \n5.5 \nSalted eggs are hard boiled then dipped in grana \nsolution according to approved specifications \n6. Prepare \nProduction \nReport \n6.1 \nDaily production input is noted and documented  \naccording to standard operating procedures. \n6.2 \nDaily production output is noted and documented  \naccording to standard operating procedures. \n6.3 \n All production data are recorded and presented \naccording to prescribed format.\n\n--- PDF PAGE 50 ---\n__________________________________________________ \nTR- Food Processing NC II                                                         \n48\n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n \n1. \nEquipment, \nTools and \nMaterials  \n1.1 \nSalting, Curing and Smoking equipment and materials \nmay include but not limited to: \n1.1.1 \nSmokehouse   \n1.1.2 \nPolysealer \n1.1.3 \nSoaking vats \n1.1.4 \nChiller/refrigerator/ freezer \n1.1.5 \nOven \n1.1.6 \nSalinometer \n1.1.7 \nJack lifts, trolleys and wheelers \n1.1.8 \nWeighing scales of varying capacities and \nsensitivities \n1.1.9 \nCutting implements like knives, slicers, peelers \n1.1.10 Fuel for smoking like wood, wood shavings, half-\ndried leaves, coconut husks & shells, rice hulls, \ncorn cobs, saw dust \n \n1.2 Office equipment, supplies may include but not limited to \nthe following: \n1.2.1 \nComputer with printer \n1.2.2 \nCalculator \n1.2.3 \nOverhead projector \n1.2.4 \nBond papers \n1.2.5 \nComputer papers \n1.2.6 \nNote pads \n1.2.7 \nPencils/ball pen \n1.2.8 \nIndex cards \n1.2.9 \nClips \n1.2.10  Folders \n1.2.11 Clip pads \n1.2.12 Reporting and recording forms /logbooks \n1.2.13 Adhesive tapes. \n1.2.14 Bulletin boards \n1.2.15 White boards and white board markers \n1.2.16 Chalks  \n1.2.17 Pentel pens \n \n2. \nFood \nProcessing \nMethods \nFood Processing methods involved in this Unit of Competency \nis limited to: \n2.1 \nSalting \n2.2 \nCuring \n2.3 \nSmoking\n\n--- PDF PAGE 51 ---\n__________________________________________________ \nTR- Food Processing NC II                                                         \n49\n \n \n \n \n \n \n3. \nKitchen \nUtensils \nKitchen utensils include but not limited to: \n3.1 \nCasseroles \n3.2 \nMixing bowls \n3.3 \nChopping boards \n3.4 \nColander \n3.5 \nSaucepans \n3.6 \nUtility trays  \n3.7 \nFood tongs \n4. \nRaw Materials \nRaw materials include: \n4.1 \nFresh eggs \n4.2 \nDressed poultry \n4.3 \nFresh meat  \n4.4 \nFish/other marine products \n \n5. \nIngredients \nIngredients may include but not limited to: \n5.1 Salt \n5.2 Sugar \n5.3 Condiments \n5.4 Spices \n5.5 Herbs \n5.6 Grana solutions \n \n6. \nOHS \nrequirements \nOccupational Health and Safety requirements may include: \n6.1   Health/medical certificate \n6.2   Dole requirements \n6.3   Personal hygiene & good grooming \n6.4   Plant sanitation & waste management \n6.5   BFAD requirements \n6.6   PPE requirements  \n6.6.1 apron/laboratory gown \n6.6.2 mouth masks \n6.6.3 gloves  \n6.6.4 rubber boots,  \n    6.6.5  head gears such as caps, hairnets, ear plug \n7 Production Data \nProduction data include: \n7.1 \nProduction input \n7.2 \nProduction output \n7.3 \nProduction target \n7.4 \nProduction schedule\n\n--- PDF PAGE 52 ---\n__________________________________________________ \nTR- Food Processing NC II                                                         \n50"
