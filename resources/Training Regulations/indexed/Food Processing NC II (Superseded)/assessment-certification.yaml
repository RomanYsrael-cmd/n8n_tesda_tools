_________________________________ TR- Food Processing NC II 85 Continuation ….. Competency Map for Agri- Fishery Sector ( Food Processing and Beverage Sub-Sector) Use product knowledge to complete work operations Use information technology devices and computer applications in the workplace Implement sampling procedures Participate in sensory analysis Perform basic tests Maintain food safety when loading, unloading and transporting food Operate a boiler – basic Operate a waste water treatment system Apply principles of food packaging Manage the implementation of environmental management policies Apply raw materials / ingredients and process knowledge Operate processes in packaging system Set up a production / packaging line for operation Control food contamination and spoilage Manage the implementation of occupational health and safety policies and procedures in the workplace Control and order stock Participate in HACCP team Solve problem using “quality tools” Describe and analyze data using mathematical principles Manage water treatment process Implement the pest prevention program Participate in an audit process Use inventory system to organize stock control Establish process capability Optimize a work process Monitor the implementation of environmental management policies Participate in improvement process Apply understanding of food additives Manage a work area within budget Participate in product recalls Monitor the implementation of Good Manufacturing Practice Procedures Receive and store stock Apply understanding of legal requirements in food product Manage and evaluate new product trials Plan and coordinate maintenance Operate processes in a production system Report on workplace performance Apply basic engineering principles to a food production process Manage internal audits Schedule and manage production --- PDF PAGE 88 --- ____________________________________________________________________________ TR- Food Processing NC II 86 Continuation ….. Competency Map for Agri Fishery Sector ( Food Processing and Beverage Sub-Sector) Apply Food Safety and Sanitation Use Standard Measuring Devices / Instruments Use Food Processing Tools, Equipment and Utensils Perform Mathematical Computation Implement good manufacturing practice procedures Implement environmental policies and procedures Receive and Respond to Workplace Communication Participate in Workplace Communication Lead Workplace Communication Utilize specialist communication Develop Team and Individual Work With Others Work in a Team Environment Lead Small Team Solve Workplace Problems Related to Work Activities Apply Problem Solving Techniques in the Workplace Practice Career Professionalism Practice Occupational Health and Safety Practice housekeeping procedures Demonstrate work values Plan and Organize Work Food Processing NC II --- PDF PAGE 89 --- ___________________________________________________ TR-Food Processing NC II 87 For the purpose of this competency standard, the following words are defined: .1 Competency – is the application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace. .2 Unit of Competency – describes a work activity. .3 Elements – are building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in a particular area of work is able to perform. .4 Performance Criteria – are evaluative statements that specify what is to be assessed and the required level of performance. .5 Range of Variables – describe the circumstances or context in which the work is to be performed. .6 Evidence Guide – a guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment methods. .7 Blanching – refers to a heat treatment in which the raw food material is immersed in hot water or exposed to live steam. .8 Bottling/Canning – refers to a preservation of foods in hermetically sealed containers such as tin cans and glass jars by sterilization with heat .9 BFAD - means Bureau of Food and Drug .10 Brine – refers to a salt solution .11 Cabinet Drying - refers to a process of dehydrating food material using a cabinet drier consisting of a closed chamber which is well insulated against heat loss .12 Chilling – is subjecting meat to a temperature of 2-4°C(36-40°F at certain period of time .13 Curing – refers to a process by which salt, sugar and salitre and other preservatives and adjuncts are introduced/are used to prolong the keeping quality of the products .14 Dehydration- refers to drying by artificially produced heat under carefully controlled conditions of temperature, humidity and airflow within a chamber --- PDF PAGE 90 --- ___________________________________________________ TR-Food Processing NC II 88 .15 Dry Curing– refers to a method of curing meat where curing mixture is rubbed on the surface of the food material being cured. .16 Exhausting – refers to the removal of air and gases from the raw material and the container before sealing; It refers to the heating of canned foods to a center can temperature of 180°C to 205°F before sealing. .17 Fermentation – refers to the anaerobic oxidation of carbohydrates by microbial enzymes .18 Food Additives- refer to substances intentionally added to foods to achieve or retain desired characteristics .19 Food Processing – refers to the application of heat in varying degree to the food enclosed in a container for a sufficient time to sterilize the product .20 GRAS- means generally regarded as safe .21 Hermetic Sealing- refers to the closure of tin cans or glass jars tightly to prevent the entrance of microorganisms .22 Packing Medium – refers to brine, syrup, broth, oil or other similar ingredients used as canning medium .23 Pickling- refers to the preservation of foods by brine and vinegar with or without bacterial fermentation .24 PH meter – refers to an instrument used to measure the acidity of a sample .25 Preservatives- refer to food additives that retard spoilage and preserve the natural color & flavor of food products .26 Pulverize – to reduce by crushing or grinding to very small particles .27 Raw Materials – consist of the main food material to be processed including minor food ingredients .28 Retort Specification – refers to a steam pressure canner used in sterilizing low acid canned foods .29 Sanitation - refers to the process of treating food contact and non-food contact surface with physical agents and chemicals to kill the residual microorganisms present after cleaning .30 Salinometer- refers to the instrument to measure strength of brine --- PDF PAGE 91 --- ___________________________________________________ TR-Food Processing NC II 89 .31 Standard Measurement – refers to something set up as a rule for measuring or a model to be followed .32 Smoke – refers to the gas from burning wood material containing combustible and noncombustible substances, the combustible substances are the main sources of smoke which consist of cellulose, lignin, pentosans, tannic acid, protein substances, resins and terpenes .33 Smoking – refers to subjecting the product to the action of smoke from burning wood materials .34 Smoke House- refers to a closed smoke chamber where smoke is produced which may range from the temporary (barrel) smoke house to the permanent frame or concrete smoke house. .35 Sugar Concentrates – refer to products cooked with sugar to attain a concentration of 40-65% or to saturated sucrose level .36 Syrup – refers to a sugar solution whether light, medium or heavy syrup .37 Thermal Processing – refers to the method of processing food in hermetically sealed container by applying heat with the right temperature and time, enough to kill microorganisms responsible in the spoilage of food which involve bottling and canning .38 Water Bath – it is a set up used for canning consisting of a large kettle with fitting cover deep enough to have an inch or two over the tops of the containers of food and an extra 1-2 inch space for boiling with a wooden or metal rack made for holding filled containers; used for processing high acid canned products. --- PDF PAGE 92 --- ___________________________________________________ TR-Food Processing NC II 90 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of this Training Regulation. THE TESDA ADVISORY PANEL (TAP) Mr. EDWARD F. DAVID Chair, PhilFoodEx Rm. 305, Bahay ng Alumni Pres. Ramon Magsaysay Ave. U.P. Campus, Diliman, Quezon City Ms. CECILIA DELA PAZ Nutrivina Phils. Unit 801, Manila Luxury Cond. Pearl Drive cor. Goldloop St., Ortigas Pasig City Mr. JOSE D. GONZALES, JR. Rizal Experimental Station & Pilot School of Cottage Industries Jenny’s Avenue Extn. Maybunga, Pasig City Ms. AURORA C. SUBIDA Maya Kitchen 8th Flr., Liberty Building, Pasay Road Makati City Mr. BOBBY C. PRADEL Mofel’s Food International Corp 20220 Arpilleda St., Makati City Mr. GEORGE LORENZANA Lorenzana Food Corp. 551 M. Naval St., Navotas, Metro Manila Ms. MA. LIGAYA T. BRAGANZA Phil. Women’s University Taft Avenue, Manila Ms. REGGIE A. SOLANA Nutrinova Phils. Unit 801, Manila Luxury Cond. Pearl Drive, cor. Goldloop St Ortigas, Pasig City Ms. MILAGROS C. REYES Rizal Experimental Station & Pilot School of Cottage Industries Jenny’s Avenue Extn. Maybunga, Pasig City Ms. OLIVIA P. ESTIOKO Technology & Livelihood Resource Center 8th Flr., Citystate Bldg. 709 Shaw Blvd., Pasig City The PARTICIPANTS in the National Validation of this Training Regulation --- PDF PAGE 93 --- ___________________________________________________ TR-Food Processing NC II 91 The Standards Setting and Systems Development Committee • Atty. RANULFO P. PAYOS – Chairperson • Dr. ALBERTO VICTORP. FENIX, J