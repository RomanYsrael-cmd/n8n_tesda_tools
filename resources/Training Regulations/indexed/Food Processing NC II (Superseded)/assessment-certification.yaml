  "arrangements": [
    {
      "number": "4",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "To attain the National Qualification of Food Processing, NC II, the candidate must demonstrate competence through project type assessment covering all the units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.2",
      "text": "The qualification of Food Processing, NC II may be attained through: 4.2.1 Accumulation of Certificates of Competency (COCs) in the following areas: 4.2.1.1 Process Food by Salting, Curing and Smoking 4.2.1.2 Process Food by Fermentation and Pickling 4.2.1.3 Process Food by Sugar Concentration 4.2.1.4 Package Finished/Processed Food Products Successful candidates shall be awarded Certificates of Competency (COCs) 4.2.2 Demonstration of competence through project-type assessment covering all required units of the qualification."
    },
    {
      "number": "4.3",
      "text": "Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate"
    },
    {
      "number": "4.4",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.5",
      "text": "The following are qualified to apply for assessment and certification: 4.5.1 Graduates of formal, non formal and informal including enterprise-based training programs. 4.5.2. Experienced workers ( wage employed or self-employed)"
    },
    {
      "number": "4.6",
      "text": "The guidelines on assessment and certification are discussed in detail in the Procedures manual on Assessment and Certification and Guidelines on the implementation of the Philippine TVET Qualification and Certification System (PTQCS). TR- Food Processing NC II"
    }
  ],
  "source_text": "SECTION\n4\nNATIONAL\nASSESSMENT\nAND\nCERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of Food Processing, NC II, the\ncandidate must demonstrate competence through project type\nassessment covering all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The qualification of Food Processing, NC II may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1.1 Process Food by Salting, Curing and Smoking\n4.2.1.2 Process Food by Fermentation and Pickling\n4.2.1.3 Process Food by Sugar Concentration\n4.2.1.4 Package Finished/Processed Food Products\n\nSuccessful candidates shall be awarded Certificates of\nCompetency (COCs)\n\n4.2.2 Demonstration of competence through project-type assessment\ncovering all required units of the qualification.\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units\nof competency comprising a qualification, an individual shall be issued\nthe corresponding National Certificate\n\n4.4 Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with the\ncore units.\n\n 4.5 The following are qualified to apply for assessment and certification:\n\n 4.5.1 Graduates of formal, non formal and informal including\nenterprise-based training programs.\n\n4.5.2. Experienced workers ( wage employed or self-employed)\n\n 4.6 The guidelines on assessment and certification are discussed in detail in\nthe Procedures manual on Assessment and Certification and Guidelines\non the implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 86 ---\n____________________________________________________________________________\nTR- Food Processing NC II\n\n84\n"
}
