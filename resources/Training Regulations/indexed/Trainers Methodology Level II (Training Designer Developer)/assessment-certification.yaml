n facilitating training Facilitate development of competency standards Develop competency assessment tools Develop learning materials Develop learning materials for E- learning Conduct training needs analysis Develop training curriculum Design and develop maintenance system Facilitate development of competency standards --- PDF PAGE 98 --- Re-titled May 2011 94 1) Trainer – a person who enables a learner or group of learners to develop or acquire competencies toward performing a particular trade or technical work 2) Qualification – a cluster of units of competency that meets job roles and is significant in the workplace. It is also a certification awarded to a person on successful completion of a course and/or in recognition of having demonstrated competencies relevant to an industry 3) Curriculum – refers to the specifications for a course or subject (module) which describe the relevant learning experiences a trainee or student undergoes, generally including objectives, content, intended learning outcomes, training methodology, recommended assessment tasks, etc. 4) Competency standard – a description of competency formed by the knowledge, abilities, skills, comprehension and attitudes required for acceptable performance of a productive function and established as a reference or requirement for a qualification. Competency standards are made up of units of competency, which are themselves made up of elements of competency, together with performance criteria, a range of variables, and an evidence guide 5) Unit of competency – a component of a competency standard. A unit of competency is a statement of a key function or role in a particular job or occupation 6) Instructional design – this covers the planning, delivery and assessment of instruction; the instructional design process includes analyzing a training or performance problem, defining the intended outcomes, determining how to present the content to learners to achieve those outcomes, developing the training cou