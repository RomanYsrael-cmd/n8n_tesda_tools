  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of TM II, the candidate must demonstrate competence\nin all the units of competency listed in Section 1. Successful candidates shall be awarded\na National TM Certificate signed by the TESDA Director General.\n\n4.2\nThe Qualification may be acquired through accumulation of TM Certificates of Competency\n(COC) in the following units of competency –\n\n4.2.1 Conduct training-needs analysis\n4.2.2 Develop training curriculum\n4.2.3 Develop learning materials\n4.2.4 Develop E-learning materials\n4.2.5 Develop assessment tools\n4.2.6 Design and develop maintenance system for training facilities\n4.2.7 Facilitate development of competency standards – Elective unit\n\n4.3\nUpon accumulation and submission of the above six (6) TM-COCs acquired, an individual\nshall be issued the National TM II Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic competencies shall be\nintegrated or assessed concurrently with the core units.\n\n4.5\nThe candidate applying for assessment and certification under TM II must be\n\n4.5.1 BS graduate or equivalent\n4.5.2 Holder of TM I qualification\n4.5.3 Certified of National Certificate level that will be handled/facilitated\n\n--- PDF PAGE 97 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n93\n\nLegend\nTrainer\nQualification II\n"
