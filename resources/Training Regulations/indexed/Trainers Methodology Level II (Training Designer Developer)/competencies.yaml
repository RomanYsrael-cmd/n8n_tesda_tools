        "source_title": "DEVELOP LEARNING MATERIALS",
        "source_text": "--- PDF PAGE 66 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n62 \n \nUNIT OF COMPETENCY : \nDEVELOP LEARNING MATERIALS  \n \n \nUNIT CODE \n: \nTVT232309 \n \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude required to \ndevelop training materials including print, mock-up/simulator \nand models. This include research and interpret the learning \nmaterial requirements, design the learning material and plan the \ncontent, develop the learning material content, review learning \nmaterial prior to implementation, evaluate the design and \ndevelopment process of instructional materials. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized items are elaborated in the Range of Variables \n1. Analyze the learning  \nmaterials requirements \n1.1 \nThe brief, focus and type of learning materials is clarified \nwith the client \n1.2 \nThe likely target audience/s, their learning needs and the \nlearning environment for the resource are researched \n1.3 \nCharacteristics of the learners/end users of the learning \nresource are identified  \n1.4 \nExisting information which may be relevant is gathered, \ncollated and analyzed  \n1.5 \nEthical and legal considerations are identified and acted \nupon  \n1.6 \nA development work plan is written and documented \n1.7 \nBroad time frames, possible costs and logistics of the learning \nmaterials are considered \n \n2. Design the learning \nmaterials \n2.1 \nA range of design options is generated using a variety of \nprinciples and techniques  \n2.2 \nDesign concepts are established, taking into consideration \nprocess, material, quantity, cost and outcome requirement \n2.3 \nTime is taken to reflect on the designs, identifying the \nimplications of each  \n2.4 \nThe diversity of learners/end users and their learning styles \nare researched and embedded into the design specifications \n2.5 \nAn outline or prototype for the learning resource is \ndeveloped and confirmed with the client \n2.6 \nRelevant personnel are identified to support the development \nphase, if needed \n \n3. Develop the content of \nthe learning materials \n3.1 \nContent and content specification is developed in accordance \nwith the agreed design  \n3.2 \nThe learning materials content is broken into manageable \nchunks/segments of learning and sequenced according to \nlearning principles and techniques \n3.3 \nExisting learning materials are accessed and modified \n/customized to suit the learning purposes and audience  \n3.4 \nNew, relevant and engaging learning activities and related \nlearning materials are developed and documented, based on \napplication of learning principles\n\n--- PDF PAGE 67 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n63 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized items are elaborated in the Range of Variables \n \n3.5 Text is clear, concise, grammatically correct and appropriate for \nthe intended audience/s \n3.6 \nThe resource is formatted using an appropriate style guide \n3.7 \nVisuals are relevant, instructive and appropriate for the \nintended audience/s  \n3.8 \nMechanisms for reviewing work in progress are established \n3.9 \nModifications are made to the design and/or content, to \naddress changes in project parameters  \n3.10 Prototype systems and components are developed in \naccordance with the agreed design     \n3.11 Mock-up /simulator’s   plan and specification is developed and \nconfirmed with the client        \n3.12 Relevant personnel are identified to support the development \nphase, if needed \n3.13 Manual for prototype, model/simulator is developed \n \n4. Review/test learning \nmaterials \n4.1 \nContent of the developed materials is checked against content \nspecifications  \n4.2 \nText, format and visual design are checked for clarity and \nfocus  \n4.3 \nRelevant personnel are identified and support is sought for the \nreview and validation \n4.4 \nAn external review is conducted using appropriate methods, \nand feedback is incorporated  \n4.5 \nFinal draft is reviewed against the brief and other relevant \ncriteria prior to delivery to the client \n \n5. Evaluate the design \nand development \nprocess \n5.1 \nThe design and development process is reviewed against \nappropriate evaluation criteria \n5.2 \nTime is taken to reflect and identify areas for improvement  \n5.3 \nIdentified improvements are documented for future projects\n\n--- PDF PAGE 68 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n64 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Brief, focus and type of \nlearning materials \n \n \nIncludes but not limited to: \n1.1 \nClient proposal \n1.2 \nIdentified gap in  training   \n1.3 \nA tender  \n1.4 \nAn organizational needs \n2. Likely target \naudience/s and \nlearning environment  \n \nIncludes but not limited to: \n2.1 \nWho the learning material  is for \n2.2 \nWhat the learning materials is designed to do \n2.3 \nHow the learning materials will be used \n2.4 \nWhere the learning materials will be used \n2.5 \nPossible mediums to be used  \n2.6 \nDisinfecting tools and equipment \n3. Research \nMay include: \n3.1 \nInterview  \n3.2 \nFocus groups \n3.3 \nInformal discussion \n3.4 \nLiterature reviews \n3.5 \nInternet research  \n3.6 \nEvaluation of existing products \n3.7 \nQuestionnaires \n3.8 \nWorkshops \n4. Characteristics  of the \nlearners/end users \n \nIncludes but not limited to: \n4.1 \nLevel of prior experience/ knowledge of content area \n4.2 \nSkill/competency profile \n4.3 \nRange and response to previous learning experiences \n4.4 \nLevel of education \n4.5 \nSocio-economic background, age, gender \n4.6 \nCurrent work \n4.7 \nWork culture  \n4.8 \nCultural and ethnic background  \n4.9 \nDisability or learning support needs \n4.10 Prepared learning style \n4.11 Motivation for learning  \n5. Existing information \nMay include: \n5.1 \nIndustry/users needs \n5.2 \nIndustry best practice and culture \n5.3 \nExisting  learning materials \n5.4 \nRelevant training regulation/competency standards \n5.5 \nRelevant courses, curriculum, modules \n5.6 \nWorkplace procedures, documentation, and requirements \n5.7 \nIndustry coverage \n5.8 \nRoles and responsibilities of groups and individuals  \n5.9 \nInformation from industry experts and advisers\n\n--- PDF PAGE 69 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n65 \n \nVARIABLE \nRANGE \n6. Ethical and legal \nconsiderations \nMay include: \n6.1 \nContract preparation \n6.2 \nMeeting contact requirements \n6.3 \nIntellectual property \n6.4 \nRegulatory requirements including occupational health and \nsafety (OHS) \n6.5 \nOrganizational requirements  \n6.6 \nEquity issues and needs \n6.7 \nPotential legal consequences of false, misleading or incorrect \ninformation \n7. Development  work \nplan \nMay include: \n7.1 \nTimelines and milestones to be achieved  \n7.2 \nScheduled meetings and focus group \n7.3 \nConsultative process \n7.4 \nHandover requirements \n7.5 \nEquipment, learning resources, and learning materials needed \n7.6 \nIndustry information/practices \n7.7 \nBudget \n7.8 \nIdentification of risk/risk management strategies \n7.9 \nOrganization/industrial policies \n7.10 Access to experts/advisers \n8. Design options \n8.1 \nuse and extent of practical activity-based content and passive \ncontent (reading, interpreting and absorbing information \n8.2 \nuse and extent of text-based information and graphical \ninformation \n8.3 \nlevel of depth of text-based information and sophistication of \nlanguage \n8.4 \n options for presenting text-based information e.g. straight text, \nquestion and answer, case studies \n8.5 \nVisual design \n8.6 \nSequencing material \n8.7 \nSources for further information/further reading \n8.8 \nStyle guides \n8.9 \nVisual look \n9. Learning style \nMay include: \n9.1 \nTheoretical    \n9.2 \nPragmatic \n9.3 \nActive \n9.4 \nReflective \n9.5 \nKinaesthetic \n9.6 \nAuditory \n9.7 \nvisual \n10. Outline or prototype \nMay include: \n10.1 Framework  \n10.2 Format specifications \n10.3 Mock-up \n10.4 Model/simulator\n\n--- PDF PAGE 70 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n66 \n \nVARIABLE \nRANGE \n11. Relevant personnel \n11.1 Subject matter/technical experts \n11.2 Industry experts \n11.3 Colleagues  \n11.4 Learners or users \n11.5 Industry stakeholders \n11.6 Specialist consultants, e.g. language, literacy and numeracy \nspecialists \n12. Learning  materials \nMay include :  \n12.1 Print Learning package  \n12.1.1 learner/user guides \n12.1.2 trainer/facilitator guides \n12.1.3 training guides \n12.1.4 example training programs \n12.1.5 specific case studies \n12.1.6 professional development materials \n12.1.7 assessment materials \n12.2 Other published, commercially available support materials for \nTraining Packages/courses \n12.3 organizational learning resources \n12.4 references and texts \n12.5 manuals \n12.6 record/log books \n13. Mechanism \nMay include: \n13.1 Verbal or written communication with relevant personnel \n13.2 Verbal or written communication with content experts \n13.3 Project updates \n13.4 Internal/external  reviews of drafts \n14.  Methods, and  \nfeedback \nMay include: \n14.1 evaluation by experts \n14.2 pilot \n14.3 focus groups \n14.4 Questionnaires \n14.5 Checklists \n14.6 Workshops \n14.7 telephone interview \n15. Evaluation criteria \nMay include: \n15.1 meeting the brief \n15.2 satisfaction of the client \n15.3 timeliness \n15.4 cost \n15.5 design issues/modifications required \n15.6 blockages and responses \n15.7 team effectiveness/cohesion \n15.8 level of expertise required/available\n\n--- PDF PAGE 71 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n67 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nAnalyzed leaning materials requirements \n1.2 \nDesigned and planned learning materials contents \n1.3 \nDeveloped learning materials contents and prototype  \n1.4 \nReviewed and finalized learning materials \n1.5 \nEvaluated design and development process \n \n2 \nUnderpinning  \nKnowledge \n2.1 \nSound knowledge of the vocational education and training \nsystem: \n2.1.1 relevant terminology \n2.1.2 training and assessment processes \n2.1.3 Training regulation and competency standards \n2.1.4 Philippine TVET  Qualification Framework ( PTQF) \nrequirements \n2.2 \nInstructional design : \n2.2.1 planning, analysis, development, synthesis, evaluation \n2.2.2 presenting material in a logical order and sequence \n2.2.3 opportunities for collaborative learning between \nlearners \n2.2.4 navigation tools \n2.2.5 presenting material in order of increasing difficulty \n2.2.6 opportunities for review of material and repetition \n2.2.7 the need for learner activity and interactivity \n2.2.8 inclusion of a variety of approaches and techniques for \npresenting information and activities and for \nencouraging participation by learning \n2.2.9 structure of the information \n2.2.10 ensure learning is embedded in a realistic and relevant \ncontext \n2.2.11 techniques to engage the learner in learning \n2.3 \nVisual design principles/techniques: \n2.3.1 format \n2.3.2 composition \n2.3.3 balance \n2.3.4 typography \n2.3.5 images/graphics charts/diagrams \n2.4 \nResearch and evaluation techniques: \n2.4.1 interviews \n2.4.2 focus groups \n2.4.3 workshops \n2.4.4 questionnaires \n2.4.5 literature reviews \n2.4.6 web research \n2.4.7 pilot processes\n\n--- PDF PAGE 72 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n68 \n \n \n2.5 \nGeneral knowledge of the main branches of learning theory: \n2.5.1 behavioural learning theory \n2.5.2 information processing theory \n2.5.3 cognitive learning theory \n2.5.4 andragogy \n2.5.5 vocational education and training pedagogy \n2.6 \nLearning principles: \n2.6.1 adults are autonomous and self-directed \n2.6.2 adults have life experience to draw on \n2.6.3 adults are goal-oriented \n2.6.4 adults need relevance \n2.6.5 adults are practical \n2.6.6 adults need to be shown respect \n2.7 \nCultural awareness \n2.8 \nA range of learning approaches and styles of   learning    \nresources \n2.9 \nDifferent learning styles,: \n2.9.1 activist \n2.9.2 reflector \n2.9.3 theorist \n2.9.4 pragmatist \n2.9.5 kinaesthetic \n2.9.6 auditory \n2.9.7 visual \n2.10 Relevant policy, legislation, codes of practice and     national   \nstandards including Commonwealth and state/territory \nlegislation, for example: \n2.10.1 Copyright and privacy laws relating to electronic \ntechnology \n2.10.2 security of information \n2.10.3 plagiarism \n2.10.4 competency standards \n2.10.5 licensing \n2.10.6 industry/workplace requirements \n2.10.7 duty of care under common law \n2.10.8 anti-discrimination including equal opportunity, racial \nvilification and disability discrimination \n2.10.9 workplace relations \n2.10.10 industrial awards/enterprise agreements \n2.11 Relevant OHS knowledge relating to the work role, and   OHS \nprocedures which need to be included in the content of the \nlearning resource \n2.12 OHS obligations of the training and/or assessment \norganization, the trainer/facilitator and learner\n\n--- PDF PAGE 73 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n69 \n \n3.  Underpinning Skills \n \n3.1 \nReview and analysis skills to: \n3.1.1 identify areas for improvement \n3.1.2 recognize personal limitations \n3.2 \nCommunication and interpersonal skills to: \n3.2.1 collaborate with a range of people \n3.2.2 seek feedback from others \n3.2.3 be open to feedback and suggestions \n3.2.4 maintain a network \n3.2.5 listen \n3.2.6 negotiate \n3.3 \nComputer/technical skills, for example: \n3.3.1 using a range of software programs \n3.3.2 using a range of office equipment \n3.4 \nLiteracy/writing skills, including: \n3.4.1 writing from the learner's perspective \n3.4.2 writing for different audiences \n3.4.3 using plain English and correct grammar \n3.4.4 pitching writing to the appropriate level \n3.4.5 using an appropriate style \n3.4.6 having an eye for detail \n3.5 \nTime management skills, including keeping to appropriate \ntimelines \n3.6 \nAnalytical skills to: \n3.6.1 identify critical learning points \n3.6.2 structure and weight the contents appropriately \n3.6.3 determine appropriateness of feedback \n3.7 \nAbility to develop a range of learning activities \n3.8 \nResearch skills to: \n3.8.1 find content and relevant information \n3.8.2 interview relevant people \n3.8.3 solve problems \n3.8.4 ask questions \n \n4.  Resource Implications \nThe following resources MUST be provided: \n4.1 \nAccess to learning environment \n4.2 \nAccess to appropriate tools and equipment and materials \n4.3 \nResearch for content of learning materials \n4.4 \nAccess to experts for review and consultation \n \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration / Observation and with oral questioning \n5.2 \nPortfolio \n \n6.  Context for \nAssessment \nAssessment should be conducted in the workplace/ simulated area / \nTESDA Assessment Center\n",
