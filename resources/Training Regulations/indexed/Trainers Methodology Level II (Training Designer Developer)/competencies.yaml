          "source_text": "VARIABLE \nRANGE \n1. Approaches of OHS \nMay include: \n1.1 \nthe establishment and maintenance of a healthy and safe \nlearning environment through: \n1.1.1 a consultative approach \n1.1.2 a systems approach \n1.2 \nshared responsibilities for OHS \n1.3 \ntrainer/facilitator familiarization with OHS requirements of the \nspecific learning environment \n \n2. OHS legal \nresponsibilities \nMay include: \n2.1 \nrequirements under legislation relating to OHS and common \nlaw duty of care \n2.2 \nlegislative requirements for consultation \n2.3 \nrequirements under hazard-specific and other OHS \nregulations \n2.4 \nlegislative requirements for reporting and record keeping \nrelated to OHS \n \n3. Various parties \nMay include: \n3.1 \nmanagers/supervisors \n3.2 \ndesignated person for OHS \n3.3 \nemployee OHS representatives \n3.4 \nother people with prior OHS knowledge, for example: \n3.4.1 trainers/facilitators and assessors \n3.4.2 program coordinators \n3.5 \ntraining and/or assessment organization \n \n4. Organizational OHS \ndocumentation \nThe training organization and/or workplace in which the training \nservices take place, and may include: \n4.1 \npolicies and procedures \n4.2 \nincident reports \n4.3 \nemergency procedures \n4.4 \ninduction information \n4.5 \nrisk assessment \n4.6 \nsafety reports \n \n5. Sources of information \nMay include: \n5.1 \nOHS regulatory authorities \n5.2 \nindustry bodies \n5.3 \nsubject and technical specialists including OHS professionals \n5.4 \nhazard and injury reports from similar learning environments\n\n--- PDF PAGE 41 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n37 \n \nVARIABLE \nRANGE \n6. Hierarchy of control \nThe preferred priority for risk control, emphasizing hazard elimination \nand, where this is not possible, risk minimization by such means as: \n6.1 \nsubstitution with a lesser hazard \n6.2 \nisolation of the hazard from people at risk \n6.3 \nengineering controls \n6.4 \nadministrative means (eg, safe work practices, procedures \nand training) \n6.5 \nuse of personal protective equipment \n \n7. Supervisory \narrangements \nMay include: \n7.1 \nLevel of knowledge \n7.2 \nLevel of experience \n7.3 \nrights, responsibilities and obligations of the various parties \n7.4 \nthe code of conduct in the learning environment \n7.5 \ntypes of potential hazardous events/emergencies and required \nresponses \n7.6 \nhazards and their control in the learning environment, \nincluding the use and maintenance of personal protective \nequipment \n \n8. Appropriate \ninformation \nMay include: \n8.1 \nsafe access and egress \n8.2 \nwork procedures \n8.3 \nfirst aid provisions \n8.4 \narrangements in the learning environment for the \nmanagement of OHS, including: \n8.4.1 reporting procedures for hazards, incidents, injuries \nand faulty equipment \n8.4.2 processes to use when injury does occur \n8.4.3 policies and procedures, including staff handbooks\n\n--- PDF PAGE 42 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n38"
