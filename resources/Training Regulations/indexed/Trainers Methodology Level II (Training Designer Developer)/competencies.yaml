        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nAnalyzed leaning materials requirements \n1.2 \nDesigned and planned learning materials contents \n1.3 \nDeveloped learning materials contents and prototype  \n1.4 \nReviewed and finalized learning materials \n1.5 \nEvaluated design and development process \n \n2 \nUnderpinning  \nKnowledge \n2.1 \nSound knowledge of the vocational education and training \nsystem: \n2.1.1 relevant terminology \n2.1.2 training and assessment processes \n2.1.3 Training regulation and competency standards \n2.1.4 Philippine TVET  Qualification Framework ( PTQF) \nrequirements \n2.2 \nInstructional design : \n2.2.1 planning, analysis, development, synthesis, evaluation \n2.2.2 presenting material in a logical order and sequence \n2.2.3 opportunities for collaborative learning between \nlearners \n2.2.4 navigation tools \n2.2.5 presenting material in order of increasing difficulty \n2.2.6 opportunities for review of material and repetition \n2.2.7 the need for learner activity and interactivity \n2.2.8 inclusion of a variety of approaches and techniques for \npresenting information and activities and for \nencouraging participation by learning \n2.2.9 structure of the information \n2.2.10 ensure learning is embedded in a realistic and relevant \ncontext \n2.2.11 techniques to engage the learner in learning \n2.3 \nVisual design principles/techniques: \n2.3.1 format \n2.3.2 composition \n2.3.3 balance \n2.3.4 typography \n2.3.5 images/graphics charts/diagrams \n2.4 \nResearch and evaluation techniques: \n2.4.1 interviews \n2.4.2 focus groups \n2.4.3 workshops \n2.4.4 questionnaires \n2.4.5 literature reviews \n2.4.6 web research \n2.4.7 pilot processes\n\n--- PDF PAGE 72 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n68 \n \n \n2.5 \nGeneral knowledge of the main branches of learning theory: \n2.5.1 behavioural learning theory \n2.5.2 information processing theory \n2.5.3 cognitive learning theory \n2.5.4 andragogy \n2.5.5 vocational education and training pedagogy \n2.6 \nLearning principles: \n2.6.1 adults are autonomous and self-directed \n2.6.2 adults have life experience to draw on \n2.6.3 adults are goal-oriented \n2.6.4 adults need relevance \n2.6.5 adults are practical \n2.6.6 adults need to be shown respect \n2.7 \nCultural awareness \n2.8 \nA range of learning approaches and styles of   learning    \nresources \n2.9 \nDifferent learning styles,: \n2.9.1 activist \n2.9.2 reflector \n2.9.3 theorist \n2.9.4 pragmatist \n2.9.5 kinaesthetic \n2.9.6 auditory \n2.9.7 visual \n2.10 Relevant policy, legislation, codes of practice and     national   \nstandards including Commonwealth and state/territory \nlegislation, for example: \n2.10.1 Copyright and privacy laws relating to electronic \ntechnology \n2.10.2 security of information \n2.10.3 plagiarism \n2.10.4 competency standards \n2.10.5 licensing \n2.10.6 industry/workplace requirements \n2.10.7 duty of care under common law \n2.10.8 anti-discrimination including equal opportunity, racial \nvilification and disability discrimination \n2.10.9 workplace relations \n2.10.10 industrial awards/enterprise agreements \n2.11 Relevant OHS knowledge relating to the work role, and   OHS \nprocedures which need to be included in the content of the \nlearning resource \n2.12 OHS obligations of the training and/or assessment \norganization, the trainer/facilitator and learner\n\n--- PDF PAGE 73 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n69 \n \n3.  Underpinning Skills \n \n3.1 \nReview and analysis skills to: \n3.1.1 identify areas for improvement \n3.1.2 recognize personal limitations \n3.2 \nCommunication and interpersonal skills to: \n3.2.1 collaborate with a range of people \n3.2.2 seek feedback from others \n3.2.3 be open to feedback and suggestions \n3.2.4 maintain a network \n3.2.5 listen \n3.2.6 negotiate \n3.3 \nComputer/technical skills, for example: \n3.3.1 using a range of software programs \n3.3.2 using a range of office equipment \n3.4 \nLiteracy/writing skills, including: \n3.4.1 writing from the learner's perspective \n3.4.2 writing for different audiences \n3.4.3 using plain English and correct grammar \n3.4.4 pitching writing to the appropriate level \n3.4.5 using an appropriate style \n3.4.6 having an eye for detail \n3.5 \nTime management skills, including keeping to appropriate \ntimelines \n3.6 \nAnalytical skills to: \n3.6.1 identify critical learning points \n3.6.2 structure and weight the contents appropriately \n3.6.3 determine appropriateness of feedback \n3.7 \nAbility to develop a range of learning activities \n3.8 \nResearch skills to: \n3.8.1 find content and relevant information \n3.8.2 interview relevant people \n3.8.3 solve problems \n3.8.4 ask questions \n \n4.  Resource Implications \nThe following resources MUST be provided: \n4.1 \nAccess to learning environment \n4.2 \nAccess to appropriate tools and equipment and materials \n4.3 \nResearch for content of learning materials \n4.4 \nAccess to experts for review and consultation \n \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration / Observation and with oral questioning \n5.2 \nPortfolio \n \n6.  Context for \nAssessment \nAssessment should be conducted in the workplace/ simulated area / \nTESDA Assessment Center",
