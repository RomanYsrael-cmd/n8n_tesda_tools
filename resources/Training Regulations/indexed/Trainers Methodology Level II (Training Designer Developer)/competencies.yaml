        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nVerified maintenance requirements with appropriate personnel\nof the organization\n1.2\nResearched and planned maintenance activities for facilities\nand equipment\n1.3\nInterpreted documentation relevant to facilities and equipment\nmaintenance management\n1.4\nEstablished maintenance systems according to organization\nneeds\n1.5\nEstablished maintenance procedures including recoding and\nreporting\n1.6\nEstablished procedures for review of maintenance system\n2. Underpinning\nKnowledge\n2.1\napplicable legislative, regulatory or certification requirements\nand codes of practice relevant to\n2.2\norganizing enterprise maintenance programs\n2.3\norganizational and site standards, requirements, policies and\nprocedures for organizing maintenance programs\n2.4\nprinciples of cultural diversity and access and equity\n2.5\nenvironmental protection requirements\n2.6\nestablished communication channels and protocols\n2.7\nproblem identification and resolution\n2.8\ntypes of tools and equipment and procedures for their safe\nuse, operation and maintenance\n2.9\nmaterial, consumable and labor costs\n2.10 maintenance procedures and methodologies\n2.11 enterprise work schedules\n2.12 procedures for the recording, reporting and maintenance of\nworkplace records and information\n2.13 appropriate mathematical procedures for estimation and\nmeasurement\n3. Underpinning Skills\n\n3.1\ncomply with legislation, regulations, standards, codes of\npractice and established safe practices and procedures for\norganizing enterprise maintenance programs\n3.2\nuse and maintain relevant tools, machinery and equipment\n3.3\nidentify problems and equipment faults and demonstrate\nappropriate response procedures\n3.4\nuse appropriate communication and interpersonal techniques\nwith colleagues and others\n3.5\naccurately record and maintain information relating to\norganizing enterprise maintenance programs\n3.6\nefficiently and safely organize enterprise maintenance\nprograms\n3.7\nuse and maintain relevant tools, machinery and equipment\n3.8\nidentify problems and equipment faults and demonstrate\nappropriate response procedures\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to learning environment\n4.2\nAccess to appropriate tools and equipment and materials\n4.3\nAccess to research and other resources\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace / simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 83 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n79\n\nUNIT OF COMPETENCY :\nDEVELOP LEARNING MATERIALS FOR E-LEARNING\n\nUNIT CODE\n:"
        },
        "source_text": "TVT232311\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and attitudes required to design and\ndevelop maintenance system applicable to diverse training\nfacilities.\nit\ninclude\nverifying\nmaintenance\nrequirements,\nresearching\nand\nplanning\nfor\nfacility\nand\nequipment\nmaintenance, establishing of maintenance systems, developing\nmaintenance procedure, researches and plan facility and\nequipment maintenance, and establish systems for audit and\nreview of the systems and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Verify maintenance\nrequirements\n1.1\nApplicable Occupational Health and Safety (OHS),\nlegislative and organizational requirements relevant to\norganizing maintenance programs are identified and complied\nwith\n1.2\nFacility and Equipment specifications, service requirements\nand workplace procedures are checked for recommended\nmaintenance intervals and processes\n1.3\nSpecial requirements for maintenance are separated from\nroutine /day-to- day maintenance schedules\n1.4\nComparisons with previous maintenance, intended equipment\nuse, training requirements and standard operating procedures\nare made\n1.5\nAn outline plan for maintenance and a related work schedule\nare specified and developed\n1.6\nCommunication with others is established and maintained in\naccordance with OHS requirements\n\n2. Research and plan for\nfacility and equipment\nmaintenance\n2.1\nWork requirements are identified and clarified /confirmed with\nappropriate parties or by site inspection\n2.2\nRelevant codes and standards, are identified and monitored\nthroughout the work procedure\n2.3\nResources and service providers Identified, obtained and\ninspected in compliance with work plan and job specifications\n2.4\nRelevant plans, drawings and text are selected and interpreted\nin accordance with the work plan\n2.5\nPlan maintenance in detail including sequencing, prioritizing\nand considerations made where appropriate for the\nmaintenance of safety, security and capacity in accordance\nwith system/site/organization requirements and reference\ninformation\n2.6\nResolve coordination requirements, including requests for\nisolations where appropriate, with others involved, affected or\nrequired by the work\n2.7\nPotential hazards are identified and prevention and/or control\nmeasures are selected\n2.8\nEquipment and facility maintenance history, condition\nmonitoring information, recent modifications and existing status\nare addressed in defining work scope\n2.9\nCosting of work is prepared and impact on budget assessed.\n\n--- PDF PAGE 78 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n74\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Establish maintenance\nsystems\n3.1\nCompliance documentation relevant to facilities and\nequipment maintenance management systems are accessed,\ninterpreted\n3.2\nMaintenance strategy for facility and equipment are developed\naccording to organization requirements\n3.3\nEstablish systems to ensure that the condition and\nperformance of equipment and facilities are regularly reported\nand discussed within the organization\n3.4\nAreas /items prone to defects, demonstrating frailty, or\nscheduled for regular maintenance, are identified ,and\ninformation used to develop a long-term maintenance plan\n3.5\nIndividuals in the organization responsible for performing\nregular or scheduled maintenance duties is informed of the\ndetails of the plan\n3.6\nData to be included in the reports on repair work are identified\n3.7\nSchedules and staff rosters are checked to verify time when\nthe maintenance process may be scheduled including optimum\ntraining for shut- down\n3.8\nDetailed work plans are developed to accord with training\nschedules, availability of expertise and scheduling of resource\navailability\n\n4. Complete maintenance\nprocedures\n4.1\nMaintenance work schedule is completed following the work\nplan\n4.2\nSystems and procedures are established, to satisfy identified\nmaintenance requirements\n4.3\nAppropriate readings, measurements and recordings are made\nand compared to equipment, product and other relevant\nspecifications\n4.4\nAreas requiring further testing are identified and complied with\nand appropriate procedures for testing recommended to\nappropriate personnel\n4.5\nAdjustments to the work schedule and plan are made based on\nexperience and documentation completed\n4.6\nMaintenance records and reports are completed and\nforwarded to appropriate personnel\n\n5. Establish procedures\nfor review of\nmaintenance systems\n5.1\nProcedures to evaluate and confirm system/equipment are\nestablished in compliance with organizational requirements\n5.2\nprocedures to confirm the currency of and compliance with\nfacility and equipment maintenance and safety standards are\nestablished\n5.3\nSystem of recording and reporting facility and equipment\ninformation is established\n5.4\nProcedures is established incorporating feedback of the\nreview system\n5.5\nEstablish procedures for response to instances of non-\ncompliance or other discrepancies/deficiencies revealed by a\nreview\n\n--- PDF PAGE 79 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n75\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational Health\nand Safety (OHS)\nIncludes but not limited to:\n1.1\nthe use of personal protective equipment and clothing\n1.2\nsafety equipment\n1.3\nfirst aid equipment\n1.4\nfire fighting equipment\n1.5\nhazard and risk control\n1.6\nelimination of hazardous materials and substances\n1.7\nmanual handling including shifting, lifting and carrying\n\n2. Legislative\nIncludes but not limited to:\n2.1\nOHS\n2.2\nthe environment\n2.3\nrelevant industry codes of practice\n2.4\noutsourcing agreement\n\n3. organizational\nrequirements\n3.1\norganizational policies\n3.2\nrole and responsibilities\n3.3\nquality assurance\n3.4\nrecording and reporting\n3.5\nequipment use and storage\n3.6\nrecycling and re-use guidelines\n3.7\nethical standards\n3.8\naccess and equity\n3.9\nwaste disposal guidelines\n\n4. Facilities\n\nIncludes but not limited to:\n4.1\nElectrical system\n4.2\nVentilation system\n4.3\nWater system\n4.4\nWorkshops\n4.5\nFixtures\n4.6\nInfrastructure\n4.7\nLaboratory\n4.8\nWorkstations\n\n5. Equipment\nIncludes but not limited to:\n5.1\nlarge items of equipment\n5.2\nsmall items of equipment\n5.3\nsimple equipment\n5.4\ncomplex equipment\n5.5\nequipment with significant health and safety implications\n\n--- PDF PAGE 80 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n76\n\nVARIABLE\nRANGE\n6. Maintenance\n\nIncludes but not limited to:\n6.1\nmajor cleaning procedures of work areas\n6.2\nfacility inspection and repairs\n6.2.1 lighting\n6.2.2 ventilation\n6.2.3 plumbing\n6.3\nrepair of equipment and tools\n\n7. Plan\nIncludes but not limited to:\n7.1\nSequence, use of consumables and labor requirements\n7.2\nBudgetary requirements\n7.3\nOutsourcing scheme\n\n8. Schedule\nMay include:\n8.1\nwork schedules for personnel,\n8.2\nscheduling of processing work\n8.2.1 days\n8.2.2 times\n8.2.3 frequency\n8.3\nscheduling of equipment and facility down time\n\n9. Communication\n9.1\nverbal and written\n9.2\nconstructive feedback,\n9.3\nactive listening, questioning to clarify and confirm\nunderstanding,\n9.4\nreporting\n\n10. Relevant codes and\nstandards\nIncludes but not limited to:\n10.1 Occupational Health and Safety (OH&S) standards\n10.2 codes of practice\n10.3 fire codes\n10.4 electrical codes\n10.5 manufacturers' specifications\n10.6 environmental requirements\n10.7 institutional procedures\n\n11. Resources\n\nIncludes but not limited to:\n11.1 all service providers\n11.2 staffing\n11.3 materials\n11.4 equipment\n11.5 tools\n11.6 finances\n\n--- PDF PAGE 81 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n77\n\nVARIABLE\nRANGE\n12. Service providers\nIncludes but not limited to:\n12.1 internal staff\n12.2 external specialists\n12.3 maintenance contractors\n12.4 consultant firms\n\n13. Documentation\nIncludes but not limited to:\n13.1 job cards\n13.2 check sheets\n13.3 safety rule procedures\n13.4 drawings\n13.5 Quality Assurance documentation\n13.6 maintenance procedures and outage reports\n\n14. Systems\nIncludes but not limited to:\n14.1 a plan allocating of personnel\n14.2 reporting and recording\n14.3 routine and non-routine maintenance of the components of a\nfacility, including\n14.3.1 electrical\n14.3.2 ventilation\n14.3.3 plumbing\n14.3.4 equipment\n14.3.5 fixtures and fittings\n14.3.6 grounds\n\n15. Data\nIncludes but not limited to:\n15.1 date\n15.2 time\n15.3 nature of faults/repair\n15.4 repairs carried out\n\n16. Reports\nIncludes but not limited to:\n16.1 equipment type, and size,\n16.2 inspection, quality outcomes,\n16.3 hazards, incidents or malfunctions\n16.4 manual reporting\n16.5 computer-based system or another appropriate organizational\ncommunication system\n\n--- PDF PAGE 82 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n78\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nVerified maintenance requirements with appropriate personnel\nof the organization\n1.2\nResearched and planned maintenance activities for facilities\nand equipment\n1.3\nInterpreted documentation relevant to facilities and equipment\nmaintenance management\n1.4\nEstablished maintenance systems according to organization\nneeds\n1.5\nEstablished maintenance procedures including recoding and\nreporting\n1.6\nEstablished procedures for review of maintenance system\n2. Underpinning\nKnowledge\n2.1\napplicable legislative, regulatory or certification requirements\nand codes of practice relevant to\n2.2\norganizing enterprise maintenance programs\n2.3\norganizational and site standards, requirements, policies and\nprocedures for organizing maintenance programs\n2.4\nprinciples of cultural diversity and access and equity\n2.5\nenvironmental protection requirements\n2.6\nestablished communication channels and protocols\n2.7\nproblem identification and resolution\n2.8\ntypes of tools and equipment and procedures for their safe\nuse, operation and maintenance\n2.9\nmaterial, consumable and labor costs\n2.10 maintenance procedures and methodologies\n2.11 enterprise work schedules\n2.12 procedures for the recording, reporting and maintenance of\nworkplace records and information\n2.13 appropriate mathematical procedures for estimation and\nmeasurement\n3. Underpinning Skills\n\n3.1\ncomply with legislation, regulations, standards, codes of\npractice and established safe practices and procedures for\norganizing enterprise maintenance programs\n3.2\nuse and maintain relevant tools, machinery and equipment\n3.3\nidentify problems and equipment faults and demonstrate\nappropriate response procedures\n3.4\nuse appropriate communication and interpersonal techniques\nwith colleagues and others\n3.5\naccurately record and maintain information relating to\norganizing enterprise maintenance programs\n3.6\nefficiently and safely organize enterprise maintenance\nprograms\n3.7\nuse and maintain relevant tools, machinery and equipment\n3.8\nidentify problems and equipment faults and demonstrate\nappropriate response procedures\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to learning environment\n4.2\nAccess to appropriate tools and equipment and materials\n4.3\nAccess to research and other resources\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace / simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 83 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n79\n\nUNIT OF COMPETENCY :\nDEVELOP LEARNING MATERIALS FOR E-LEARNING\n\nUNIT CODE\n:"
