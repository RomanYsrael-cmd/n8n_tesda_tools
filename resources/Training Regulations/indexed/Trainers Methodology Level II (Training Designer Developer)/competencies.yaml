        "source_title": "FACILITATE DEVELOPMENT OF COMPETENCY STANDARDS",
        "source_text": "--- PDF PAGE 86 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n82 \nELECTIVE COMPETENCY \n \nUNIT TITLE \n: \nFACILITATE DEVELOPMENT OF COMPETENCY \nSTANDARDS   \n \n \nUNIT CODE \n: \nTVT232313 \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to facilitate the \ndevelopment of competency standards for particular work \nfunctions, work processes, work roles and work-related \nvocational outcomes. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized bold terms are elaborated in the Range of Variables \n1.  Prepare workshop \nmaterials and venue  \n \n1.1 \nVenue, food, supplies and materials are coordinated in \naccordance with standard office procedures. \n1.2 \nDocuments/Records are prepared in accordance with \nstandard format. \n1.3 \nHandouts and presentation materials are prepared based on \nneed/backgrounds of expert-panel members. \n1.4 \nExpert panel is identified and organized following established \nprocedures. \n \n2.  Draft competency \nstandards   \n \n2.1 \nExperts are oriented on the process and methods of \ndeveloping competency standards based on established \nprocedures.  \n2.2 \nWhere applicable, functional analysis is performed in \naccordance with accepted procedures. \n2.3 \nIn case of lack of or unavailability of experts, review of \nliterature and adaptation of existing/comparable competency \nstandards are carried out in consultation with industry partners. \n2.4 \nThe identified unit/s of competency is/are developed in \naccordance with competency standards requirements and \nprocess. \n2.5 \nCompetency standards are drafted in accordance with \nexpert/working committee recommendations. \n2.6 \nDraft competency standards are packaged/ presented in \naccordance with approved format. \n \n3. Finalize competency \nstandards     \n3.1 \nRespondents in the validation are identified/ targeted to ensure \nparticipation of broad range of stakeholders. \n3.2 \nDraft competency standards are validated with a \nrepresentative group of industry experts/stakeholders.  \n3.3 \nValidation results are documented and analyzed using criteria \nand a judgment is made to modify, amend or maintain draft. \n3.4 \nValidated competency standards are checked to ensure the \nrevised/finalized standards meets relevant requirements. \n3.5 \nCompetency standards are finalized in accordance with \nvalidation recommendations.\n\n--- PDF PAGE 87 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n83 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Venue, supplies and \nmaterials \nMay include but not be limited to: \n1.1 \nFunction room \n1.1.1 Sound system \n1.1.2 Projector \n1.1.3 Computers/ Laptop \n1.1.4 Tables and chairs \n1.2 \nSupplies and materials \n1.2.1 Bond paper \n1.2.2 Pen/pencil \n1.2.3 Board marker \n1.2.4 White board \n1.2.5 Brown envelope \n \n2.  Documents/records \n2.1 \nAttendance sheet \n2.2 \nExperts’ nomination form \n2.3 \nAppointment of experts \n \n3.  Handouts \nMay include but not be limited to: \n3.1 \nPaper-based handouts \n3.2 \nSlide presentations \n3.3 \nSample unit/s of competency \n \n4.  Established procedures \nfor expert panels \n4.1 \nRequest nominations from industry associations/partners \nexpert-panel members \n4.2 \nNominees fill out nomination forms \n4.3 \nConvene expert panel into series of writeshop-meetings to \ndraft the competency standards \n4.4 \nValidate and finalize the competency standards with expert \npanel \n \n5.  Criteria \n5.1 \nRelevance of the feedback \n5.2 \nAppropriateness of the feedback \n5.3 \nWhether feedback adds value or meaning \n5.4 \nWhether feedback adds new content \n5.5 \nWhether feedback adds to quality of draft \n \n6.  Requirements \n \nMay include: \n6.1 \nGuidelines of relevant body \n6.2 \nIndustry needs \n6.3 \nClient requirements\n\n--- PDF PAGE 88 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n84 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate -- \n1.1 \nPrepared workshop materials and venue \n1.2 \nFacilitated competency standards writeshop and validation \n1.3 \nFinalized competency standards \n \n2.  Underpinning \nknowledge and attitude \n \n2.1 \nGuidelines for developing competency standards \n2.2 \nThe technical and vocational education and training (TVET) \nenvironment \n2.3 \nPolicies, legislation, codes of practice and national standards \nrelevant to TVET   \n \n3.  Underpinning Skills \n3.1 \nPresentation skills \n3.2 \nCommunication skills \n3.3 \nFacilitation skills \n3.4 \nAnalysis skills \n3.5 \nThinking skills \n \n4.  Resource Implications \n \nThe following resources MUST be provided: \n4.1 \nAccess to panel of experts \n4.2 \nVenue \n4.3 \nSupplies and materials \n4.4 \nHandouts \n \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nInterview \n5.2 \nDemonstration with oral questioning \n5.3 \nWritten exam/case problems \n \n6.  Context of Assessment \nAssessment should be conducted in the workplace / simulated area / \nTESDA Assessment Center\n",
