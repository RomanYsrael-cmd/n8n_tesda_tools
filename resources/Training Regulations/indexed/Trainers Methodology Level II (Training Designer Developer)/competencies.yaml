          "source_text": "VARIABLE \nRANGE \n1. Brief, focus and type of \nlearning materials \n \n \nIncludes but not limited to: \n1.1 \nClient proposal \n1.2 \nIdentified gap in  training   \n1.3 \nA tender  \n1.4 \nAn organizational needs \n2. Likely target \naudience/s and \nlearning environment  \n \nIncludes but not limited to: \n2.1 \nWho the learning material  is for \n2.2 \nWhat the learning materials is designed to do \n2.3 \nHow the learning materials will be used \n2.4 \nWhere the learning materials will be used \n2.5 \nPossible mediums to be used  \n2.6 \nDisinfecting tools and equipment \n3. Research \nMay include: \n3.1 \nInterview  \n3.2 \nFocus groups \n3.3 \nInformal discussion \n3.4 \nLiterature reviews \n3.5 \nInternet research  \n3.6 \nEvaluation of existing products \n3.7 \nQuestionnaires \n3.8 \nWorkshops \n4. Characteristics  of the \nlearners/end users \n \nIncludes but not limited to: \n4.1 \nLevel of prior experience/ knowledge of content area \n4.2 \nSkill/competency profile \n4.3 \nRange and response to previous learning experiences \n4.4 \nLevel of education \n4.5 \nSocio-economic background, age, gender \n4.6 \nCurrent work \n4.7 \nWork culture  \n4.8 \nCultural and ethnic background  \n4.9 \nDisability or learning support needs \n4.10 Prepared learning style \n4.11 Motivation for learning  \n5. Existing information \nMay include: \n5.1 \nIndustry/users needs \n5.2 \nIndustry best practice and culture \n5.3 \nExisting  learning materials \n5.4 \nRelevant training regulation/competency standards \n5.5 \nRelevant courses, curriculum, modules \n5.6 \nWorkplace procedures, documentation, and requirements \n5.7 \nIndustry coverage \n5.8 \nRoles and responsibilities of groups and individuals  \n5.9 \nInformation from industry experts and advisers\n\n--- PDF PAGE 69 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n65 \n \nVARIABLE \nRANGE \n6. Ethical and legal \nconsiderations \nMay include: \n6.1 \nContract preparation \n6.2 \nMeeting contact requirements \n6.3 \nIntellectual property \n6.4 \nRegulatory requirements including occupational health and \nsafety (OHS) \n6.5 \nOrganizational requirements  \n6.6 \nEquity issues and needs \n6.7 \nPotential legal consequences of false, misleading or incorrect \ninformation \n7. Development  work \nplan \nMay include: \n7.1 \nTimelines and milestones to be achieved  \n7.2 \nScheduled meetings and focus group \n7.3 \nConsultative process \n7.4 \nHandover requirements \n7.5 \nEquipment, learning resources, and learning materials needed \n7.6 \nIndustry information/practices \n7.7 \nBudget \n7.8 \nIdentification of risk/risk management strategies \n7.9 \nOrganization/industrial policies \n7.10 Access to experts/advisers \n8. Design options \n8.1 \nuse and extent of practical activity-based content and passive \ncontent (reading, interpreting and absorbing information \n8.2 \nuse and extent of text-based information and graphical \ninformation \n8.3 \nlevel of depth of text-based information and sophistication of \nlanguage \n8.4 \n options for presenting text-based information e.g. straight text, \nquestion and answer, case studies \n8.5 \nVisual design \n8.6 \nSequencing material \n8.7 \nSources for further information/further reading \n8.8 \nStyle guides \n8.9 \nVisual look \n9. Learning style \nMay include: \n9.1 \nTheoretical    \n9.2 \nPragmatic \n9.3 \nActive \n9.4 \nReflective \n9.5 \nKinaesthetic \n9.6 \nAuditory \n9.7 \nvisual \n10. Outline or prototype \nMay include: \n10.1 Framework  \n10.2 Format specifications \n10.3 Mock-up \n10.4 Model/simulator\n\n--- PDF PAGE 70 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n66 \n \nVARIABLE \nRANGE \n11. Relevant personnel \n11.1 Subject matter/technical experts \n11.2 Industry experts \n11.3 Colleagues  \n11.4 Learners or users \n11.5 Industry stakeholders \n11.6 Specialist consultants, e.g. language, literacy and numeracy \nspecialists \n12. Learning  materials \nMay include :  \n12.1 Print Learning package  \n12.1.1 learner/user guides \n12.1.2 trainer/facilitator guides \n12.1.3 training guides \n12.1.4 example training programs \n12.1.5 specific case studies \n12.1.6 professional development materials \n12.1.7 assessment materials \n12.2 Other published, commercially available support materials for \nTraining Packages/courses \n12.3 organizational learning resources \n12.4 references and texts \n12.5 manuals \n12.6 record/log books \n13. Mechanism \nMay include: \n13.1 Verbal or written communication with relevant personnel \n13.2 Verbal or written communication with content experts \n13.3 Project updates \n13.4 Internal/external  reviews of drafts \n14.  Methods, and  \nfeedback \nMay include: \n14.1 evaluation by experts \n14.2 pilot \n14.3 focus groups \n14.4 Questionnaires \n14.5 Checklists \n14.6 Workshops \n14.7 telephone interview \n15. Evaluation criteria \nMay include: \n15.1 meeting the brief \n15.2 satisfaction of the client \n15.3 timeliness \n15.4 cost \n15.5 design issues/modifications required \n15.6 blockages and responses \n15.7 team effectiveness/cohesion \n15.8 level of expertise required/available\n\n--- PDF PAGE 71 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n67"
