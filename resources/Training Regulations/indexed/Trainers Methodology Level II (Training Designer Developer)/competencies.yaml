        "source_title": "DEVELOP TRAINING CURRICULUM",
        "source_text": "--- PDF PAGE 61 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n57 \n \nUNIT OF COMPETENCY : \nDEVELOP TRAINING CURRICULUM \n \n \nUNIT CODE \n: \nTVT232308 \n \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude required to \ndevelop, modify/customize training curriculum. It includes \nestablishing training requirements, identifying the learner, \ndeveloping, modifying, customizing and finalizing training \ncurriculum.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Establish training need \nrequirements \n1.1 \nStakeholders are identified and consulted to establish \ntraining aims and requirements  \n1.2 \nTraining requirements are identified using appropriate \nmethods and sources. \n1.3 \nTraining Regulations  or other relevant specifications on \nwhich to base the learning program are identified, accessed \nand confirmed \n1.4 \nPotential employment markets and career opportunities for \ntraining participants are recorded and documented \n2. Identify  the learner \nprofile \n2.1 \nPotential learners are identified \n2.2 \nProfiles of learners on entry to the course are developed   \n2.3 \nLanguage and literacy requirements of the learner  are \ndetermined according to profiles    \n3. Develop course design  3.1 \nCompetency standard is analyzed  \n3.2 \nUnits of competency  and modules are clearly  identified \n3.3 \nThe relationship between units of competence/modules and \noutcomes is documented \n3.4 \nCourse entry and exit points are  linked to occupational and \neducational opportunities \n3.5 \nPrerequisites for the course and for specific units/modules \nwithin the course are identified and documented \n3.6 \nThe delivery strategies and assessment methods are \ndetermined  \n3.7 \nTrainers qualification to implement the course is specified  \n4. Develop training \ncurriculum modules \n4.1 \nCompetency standards/other relevant specifications are   \nanalyzed and interpreted to determine specific learning \nobjectives/outcomes/goals \n4.2 \nCompetencies to be acquired by the leaner are clearly \nspecified \n4.3 \nModules of instructions are developed/  modified according \nto needs and procedures. \n4.4 \nLearning outcomes and assessment criteria are established \naccording to procedures \n4.5 \nResources required to support the training curriculum are \nidentified. \n4.6 \nTraining curriculum is designed based on the requirements of \nthe competency standards \n5. Finalize training \ncurriculum \n \n5.1 \nTraining curriculum is validated with  other persons   \n5.2 \nFinalized curriculum document is submitted to appropriate \npersonnel\n\n--- PDF PAGE 62 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n58 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Stakeholders  \n \n \n \n \nIncludes but not limited to: \n1.1 \nprofessional associations \n1.2 \nemployer associations \n1.3 \npotential learners \n1.4 \ntrainers/teachers \n1.5 \nregulatory authorities \n1.6 \npartner organizations \n1.7 \nenterprise(s)/organization(s) \n1.8 \nindustry training advisory bodies \n1.9 \nindustry sector \n1.10 government bodies \n1.11 community sector. \n2. Training aims  \nIncludes but not limited to: \n2.1 \ndeveloping vocational competency/vocational skills \n2.2 \ndeveloping generic skills \n2.3 \ndeveloping general education \n2.4 \nachieving organizational change \n2.5 \nsupporting organizational skill development \n2.6 \nfor professional development purposes \n2.7 \ndeveloping teams \n2.8 \nmeeting new legislation, licensing or registration requirements \n2.9 \nmeeting regulatory and occupational health and safety (OHS) \nrequirements \n2.10 meeting funding body requirements \n3. Training requirements \n \nIncludes but not limited to: \n3.1 \ntrainees’ entry requirements \n3.1.1 \npre requisite competencies \n3.1.2 \naccess to the workplace \n3.2 \nindividual learning styles \n3.3 \ntraining methodology \n3.4 \ntraining materials and supplies \n3.4.1 \ntraining references (books, manuals, multimedia training \naids, etc.) \n3.5 \ntraining facility, tools, and equipment \n3.6 \ntrainers’ qualifications \n3.7 \nassessment methods \n4. Potential learners  \nIncludes but not limited to: \n4.1 \nexisting industry/enterprise employees \n4.2 \nschool leavers/OSY \n4.3 \nnew entrants to the workforce \n4.4 \napprentices/trainees \n4.5 \nindividuals learning new skills/knowledge \n4.6 \nindividuals seeking to upgrade skills/knowledge \n4.7 \nindividuals changing careers \n4.8 \nunemployed \n4.9 \nlearners who have a disability \n4.10 \nindividuals/groups meeting licensing or other  regulatory \nrequirements \n5. Units of competency \n \nIncludes but not limited to: \n5.1 \nBasic competency \n5.2 \nCommon competency \n5.3 \nCore competency  \n5.4 \nElective competency \n6. Delivery  strategies \nIncludes but not limited to: \n6.1 \nthe focus of delivery : \n6.1.1 \ngroups of varying sizes \n6.1.2 \ngroups from single context/from multiple contexts \n6.1.3 \ngroups of similar educational/competency levels/groups with \ndivergent educational/competency backgrounds \n6.1.4 \non individuals\n\n--- PDF PAGE 63 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n59 \nVARIABLE \nRANGE \n \nIncludes but not limited to: \n6.2 \nthe focus of delivery : \n6.2.1 \ngroups of varying sizes \n6.2.2 \ngroups from single context/from multiple contexts \n6.2.3 \ngroups of similar educational/competency levels/groups with \ndivergent educational/competency backgrounds \n6.2.4 \non individuals \n6.3 \nthe context of delivery: \n6.3.1 \nin the workplace - work in situation  \n6.3.2 \nin a simulated work environments \n6.3.3 \nin the training room/classroom \n6.3.4 \nin specialist environments - e.g. laboratory/ computer room \n6.3.5 \nin a community setting \n6.4 \nthe mode of delivery: \n6.4.1 \nface-to-face \n6.4.2 \ntechnology-based electronic/computer-based/ \nonline/audiovisual \n6.4.3 \nexperiential \n6.4.4 \ndistance resource-based \n6.4.5 \nblended \n6.5 \ndelivery methods: \n6.5.1 \nlock step/learner-paced/mixed \n6.5.2 \ninteractive/participative/collaborative \n6.5.3 \nlearner-centered  \n6.5.4 \ndemonstration instruction \n6.5.5 \npresentations \n6.5.6 \nguided facilitation \n6.5.7 \nguided activities/applications/experiences \n6.5.8 \ntutoring \n6.5.9 \nproject-based \n6.5.10 individual facilitation techniques - coaching/ mentoring \n6.5.11 blended delivery methods \n7. Assessment methods \nIncludes but not limited to: \n7.1 \ndirect observation of real work/real time activities or \n7.2 \nwork activities in a simulated work environment \n7.3 \nstructured activities (e.g. simulation exercises, projects, \ndemonstration, activity sheets) \n7.4 \nquestioning (e.g. computer, oral, written questions) \n7.5 \nportfolios (collections of evidence compiled by the candidate  \n7.6 \nthird party feedback  \n8. esources \nIncludes but not limited to: \n8.1 \nTraining regulation/competency standards \n8.2 \nJob specifications \n8.3 \nDCAUM sheet  \n8.4 \ntraining equipment tools and supplies \n8.5 \ninstructional materials \n9. Other persons  \nIncludes but not limited to: \n9.1 \nColleagues \n9.2 \ntrainers/facilitators \n9.3 \nindustry contacts \n9.4 \nvendors \n9.5 \nHR personnel \n9.6 \nmarketing personnel \n9.7 \nend users \n9.8 \nsubject or technical specialists, including OHS \n9.9 \nlanguage, literacy and numeracy specialists \n10. Appropriate  personnel \nIncludes but not limited to: \n10.1 program manager \n10.2 head of department \n10.3 senior teacher \n10.4 apprenticeship/traineeship supervisor \n10.5 training coordinator/manager \n10.6 HR manager\n\n--- PDF PAGE 64 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n60 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nIdentified training regulations appropriate for the course to be \ndeveloped  \n1.2 \nDeveloped learners profiles and identified potential learners \n1.3 \nDeveloped course design  \n1.4 \nAnalyzed and interpreted competency standards and \ndeveloped curriculum modules/ learning outcomes \n1.5 \nValidated training curriculum with  other persons  \n1.6 \nFinalized training curriculum and submitted to appropriate \npersonnel \n \n2. Underpinning  \nKnowledge \n2.1 \nKnowledge of  Training regulations \n2.1.1 Competency standards \n2.1.2 Training standards \n2.2 \nKnowledge of learning principles: \n2.2.1 training needs to be learner-centered \n2.2.2 adults have a need to be self-directing and decide for \nthemselves what they want to learn \n2.2.3 adults have a range of life experience, so connecting \nlearning to experience is meaningful \n2.2.4 adults have a need to know why they are learning \nsomething \n2.3 \nKnowledge of adult learning theory: \n2.3.1 behavioral learning theory \n2.3.2 cognitive learning theory \n2.3.3 information processing theory \n2.3.4 andragogy \n2.4 \nLearners profile, learner target group characteristics \n2.5 \nLearning styles that best suit the learner profile/target group: \n2.5.1 theorist \n2.5.2 pragmatist \n2.5.3 activist \n2.5.4 reflector \n2.5.5 kinaesthetic \n2.5.6 auditory \n2.5.7 visual \n2.6 \nKnowledge of competency –based curriculum  development \nprocedures  \n2.7 \nDesign options for training program design/structure \n2.8 \nTypes of different relevant learning resources, learning \nmaterials and pre-developed learning activities \n2.9 \nHow to develop and document new learning activities and \nrelated learning materials \n2.10 Different delivery modes and delivery methods for  :   \n2.11 Different assessment methods \n2.12 Relevant policies, legal requirements, codes of practice and \nnational standards \n2.13 Relevant OHS and other  job roles \n2.14 Evaluation and feedback methods\n\n--- PDF PAGE 65 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n61 \n \n3.  Underpinning Skills \n \n3.1 \nCommunication skills \n3.1.1 negotiation skills \n3.1.2 ability to elicit information \n3.1.3 questioning skills \n3.1.4 listening skills \n3.1.5 \ncollaboration skill \n3.2 \nAnalysis skills  \n3.2.1 interpret information about learners' needs from \nenrolment forms and other documentation \n3.2.2 interpret requirements of competency standards and \nworkplaces, including language, literacy and numeracy \n3.2.3 \ndevelop the learning program content \n3.3 \nOrganizational skills \n3.4 \nTime management skills  \n3.5 \nDesigning training  program structure \n3.6 \nReviewing training program \n3.7 \nPreparation of Reports \n \n4.  Resource Implications \nThe following resources MUST be provided \n4.1 \nAccess to stakeholders \n4.2 \nAccess to research and  training environment \n4.3 \nAccess to training regulations/competency standards and other \nrelevant specifications \n4.4 \nAccess to appropriate tools and equipment and materials  and \nother resources \n \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration / Observation and with oral questioning \n5.2 \nPortfolio \n \n6.  Context for \nAssessment \nAssessment should be conducted in the workplace / simulated area / \nTESDA Assessment Center\n",
