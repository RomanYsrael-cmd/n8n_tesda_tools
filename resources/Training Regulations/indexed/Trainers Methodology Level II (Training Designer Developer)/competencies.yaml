        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge of workplace practices and work \ninstructions.   \n1.2 \nDescribed relevant legislations, codes and national standard \nenvironmental practices according to the different \nenvironmental issues/concerns. \n1.3 \nFollowed environmental workplace practices \n1.4 \nContributed to improve environmental work practices \n1.5 \nRecognized and reported on a potential environmental threat \n1.6 \nMaintained environmental records  \n \n2. Underpinning \nKnowledge \n2.1 \nRelevant legislation from all levels of government on \nenvironmental issues \n2.2 \nRelevant environmental policies and workplace/industry \npractices and procedures \n2.3 \nGood practice approaches relevant to work area particularly in \nregard to minimizing environment hazards and risks, and \nimproving environmental performance \n2.4 \nEnvironmental issues, especially in regard to water \ncatchments, air, noise, ecosystems, habitat, efficient use of \nresources, sustainability and waste minimization \n2.5 \nPotential environmental threats and problems relevant to a \ngiven region and occupation \n2.6 \nGeneral work place practices and their potential impact on the \nenvironment. \n \n3. Underpinning Skills \n3.1 \nPerforming research and analysis \n3.2 \nReading / interpreting data and information \n3.3 \nProblem solving  \n3.4 \nCommunicate with supervisors and workplace colleagues \n3.5 \nRecognize basic environmental hazards and threats \n3.6 \nfollow workplace directions and instructions \n3.7 \nKeep simple records. \n \n4. Resource   \nImplications \nThe following resources MUST  be provided: \n4.1 \nWorkplace/Assessment location \n4.2 \nLegislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n4.3 \nCase studies/scenarios relating to environmental protection \n \n5. Methods of \nAssessment \n \nCompetency may  be assessed through:  \n5.1 \nWritten/ Oral Examination \n5.2 \nInterview/Third Party Reports \n5.3 \nPortfolio (citations/awards from GOs and NGOs, certificate of  \ntraining – local and abroad) \n5.4 \nSimulations   \n \n6. Context for \nAssessment \nCompetency may be assessed in actual workplace or at the \ndesignated TESDA center.",
