        "source_title": "UTILIZE IT APPLICATIONS IN TECHNICAL TRAINING",
        "source_text": "--- PDF PAGE 15 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n11 \n \nUNIT OF COMPETENCY : \nUTILIZE IT APPLICATIONS IN TECHNICAL TRAINING \n \n \nUNIT CODE \n: \n500232103 \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \nutilize IT applications in training. Specifically it covers setting-up \nof \nwork \nenvironment, \nutilization \nof \nword \nprocessing, \nspreadsheet, presentation applications and utilization of internet \nand www to communicate and collect information. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Set-up work \nenvironment \n1.1 \nWork folder is configured in accordance with enterprise IT \nutilization guidelines. \n1.2 \nDesktop and shortcuts settings are configured in-line with \npersonal preference. \n1.3 \nConnectivity to printer are checked and tested in accordance \nwith equipment user guide. \n2. Utilize word processing \napplication \n2.1 \nDocument layout and formatting are applied in line with \ndocument formatting requirements. \n2.2 \nApplication features are utilized to enhance productivity in \nline with application guide/ help instructions \n2.3 \nPrinting of documents is performed in line with enterprise IT \nutilization guidelines. \n3. Utilize presenter \napplication \n3.1 \nPresentation layout, formatting and theme utilization are \napplied in line with target audience requirements \n3.2 \nAnimation and slide transitions are applied to enhance viewing \nand interactivity experience in-line with best practices in \nutilizing presentation package. \n3.3 \nPrinting of presentation materials are performed in line with \nuser requirements and enterprise IT utilization guidelines \n3.4 \nPackaging and exporting of presentation is performed in line \nwith application help instructions/wizard. \n3.5 \nPresentation of information is performed in line with best \npractices in utilizing presentation package. \n4. Utilize spread sheet \napplication \n4.1 \nWorkbook and worksheet settings and formatting are \napplied in line with printing requirements. \n4.2 \nFormula and conditional formatting are utilized to enhance \nproductivity in line with the application help instructions. \n4.3 \nCharts are utilized to enhance data presentation in line with the \napplication help instructions. \n4.4 \nPrinting of worksheet is performed in line with document layout \nrequirements and enterprise IT utilization guidelines. \n5. Utilize internet and \nwww to communicate \nand collect information \n5.1 \nChat and email facility is utilized to exchange information and \nresources in line with chat help instructions. \n5.2 \nBrowser is configured to enhance productivity in line with the \napplication help instruction \nwww is utilized to research and acquire resources in line with \nenterprise IT utilization guidelines.\n\n--- PDF PAGE 16 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n12 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work folder \nconfiguration  \n \nMay include but not limited to: \n1.1 \nFolder creation \n1.2 \nFolder copy and transfer \n1.3 \nFolder sharing \n2. Desktop and shortcuts \nsettings are configured \nMay include but not limited to: \n2.1 \nDesktop background and screen saver settings \n2.2 \nScreen resolution settings \n2.3 \nShortcut and link creation \n3. Document layout and \nformatting \nMay include: \n3.1 \nPage settings \n3.2 \nFont Settings \n3.3 \nFormatting styles \n3.4 \nTable utilization \n4. Application features \nMay include, but not limited to: \n4.1 \nFooter and header setting \n4.2 \nMail merge \n4.3 \nReview and editing tools \n4.4 \nReference features \n4.5 \nForm creation features \n5. Best practices in \nutilizing presentation \npackage \nMay include but not limited to: \n5.1 \nNumber of text lines, font size and fore and back colors. \n5.2 \nOptimal utilization of animation and transition effects to \nenhance learning experience not to distract audience. \n5.3 \nAwareness in unconscious actions during presentation \n6. Printing of presentation \nmaterials \nMay include but not limited to: \n6.1 \nSlide \n6.2 \nNotes \n7. Workbook and \nworksheet settings \nMay include but not limited to: \n7.1 \nPage setup \n7.2 \nHeader setup \n7.3 \nWorksheet organization \n8. Formula \nMay include but not limited to: \n8.1 \nSummation \n8.2 \nDivision \n8.3 \nMultiplication \n8.4 \nDivision \n8.5 \nAverage \n8.6 \nRounding off \n8.7 \nIf \n8.8 \nConcatenate \n9. Browser configuration \nMay include but not limited to: \n9.1 \nCookie settings \n9.2 \nPlug-in setup \n9.3 \nAccessibility adjustments\n\n--- PDF PAGE 17 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n13 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nSet-up work environment \n1.2 \nUtilized word processing application \n1.3 \nUtilized presenter application \n1.4 \nUtilized spreadsheet application \n1.5 \nUtilized internet and www to communicate and collect \ninformation \n \n2 Underpinning  \nKnowledge \n2.1 \nI.T. Principles (i.e. internet technology, www) \n2.2 \nBest practices in using presenter application \n2.3 \nBasic mathematical operation \n2.4 \nLogic reasoning \n2.5 \nProductivity application features \n2.6 \nFile management \n2.7 \nAcademic documents (i.e. record sheet, accomplishment \ncharts, session plan \n \n3. Underpinning Skills \n3.1 \nEncoding and computing skills \n3.2 \nPresentation skills \n3.3 \nLogic reasoning skills \n \n4. Resource Implications \nThe following resources MUST be provided: \n4.1 \nComputer with network and internet access \n4.2 \nPrinter and printing consumables  \n4.3 \nSpecification of sample document, worksheet, presentation \nmaterials \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration / Observation and with oral questioning \n5.2 \nPortfolio \n \n6. Context for \nAssessment \nAssessment should be conducted in the workplace/ simulated area / \nTESDA Assessment Center\n",
