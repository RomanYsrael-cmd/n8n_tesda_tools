        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nWorked within the vocational education and training policy \nframework  \n1.2 \nWorked within the training organization’s quality framework \n1.3 \nManaged work and work relationships \n1.4 \nDemonstrated a client-focused approach to work \n \n2. Underpinning \nknowledge and attitude \n2.1 \nTraining Packages, including the purpose and structure of: \n2.1.1 units of competency \n2.1.2 Assessment Guidelines \n2.1.3 qualifications \n2.1.4 Employability Skills \n2.1.5 support materials \n2.2 \nPhilippine TVET Trainers Qualification Framework (PTTQF) \n2.3 \nsources of information on vocational education and training, \nfor example: \n2.3.1 NTIS web site for accessing details on units, \ncourses/qualifications, training organizations, and \nTraining Packages and support materials \n2.4 \nsources of information on legal and organizational \nrequirements, for example: \n2.4.1 organizational manuals, documents, publications \n2.4.2 organizational data systems \n2.4.3 publications, newsletters of relevant authorities \n2.5 \ncompetency-based training and assessment, for example: \n2.5.1 competency standards define performance outcomes, \napplied knowledge and skills needed for work \n2.5.2 competency standards form the basis for teaching and \nlearning and training delivery in recognized TVET \n2.5.3 learning is outcomes focused not inputs driven \n2.5.4 competency standards establish requirements for \nassessment \n2.5.5 assessment is criterion referenced/not norm \nreferenced \n2.5.6 assessment is reported as competent/not yet \ncompetent \n2.5.7 competency standards are industry defined \n2.5.8 competency standards have a national focus \n2.6 \nthe training organization’s systems, policies and procedures \n2.7 \nrelevant vocational education and training terminology \nappropriate to the work role \n2.8 \nthe diversity of clients, client needs, client expectations for \nvocational education and training services\n\n--- PDF PAGE 31 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n27 \n \n \n2.9 \nrelevant legal and policy requirements, codes of practice, \nnational standards and legislations, for example: \n2.9.1 specific industry/workplace legal/compliance and \nlicensing requirements \n2.9.2 duty of care under common law \n2.9.3 anti-discrimination including equal opportunity, racial \nvilification and disability discrimination \n2.9.4 workplace relations, industrial awards and enterprise \nagreements \n2.9.5 privacy/security of information \n2.9.6 copyright/plagiarism \n2.10 relevant OHS knowledge relating to the work role/work \ncontext, and OHS considerations when working in vocational \neducation and training, including: \n2.10.1 internal policies and procedures to meet OHS \nrequirements \n2.10.2 hazards commonly found in the work environment \n2.10.3 sources of OHS information and expertise \n \n3. Underpinning skills \n3.1 \nliteracy skills to: \n3.1.1 read and understand vocational education and training \npolicy and other documents, vocational education and \ntraining terminology and language styles \n3.1.2 interpret legal requirements of vocational education \nand training policies, procedures and guidelines \n3.1.3 write documents for a range of vocational education \nand training audiences and purposes \n3.2 \nlanguage skills to: \n3.2.1 communicate with personnel across all levels of the \norganization and with clients \n3.2.2 understand and use vocabulary and terminology \nspecific to the vocational education and training \nenvironment \n3.2.3 listen and summarize key points, make evaluative \njudgments and articulate verbally or in writing to a \nclient or colleague \n3.2.4 facilitate discussions to encourage problem solving, \nsharing of strategies, and exploring different solutions \nto problems \n3.2.5 work effectively as a team member \n3.3 \nrecognizing and being sensitive to individual difference and \ndiversity, for example: \n3.3.1 being sensitive to and valuing culture \n3.3.2 acting without bias/discrimination \n3.3.3 responding to individuals with particular needs \n3.3.4 recognizing the importance of religion\n\n--- PDF PAGE 32 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n28 \n \n \n3.4 \nplanning skills to: \n3.4.1 identify and access relevant sources of national \nvocational education and training policies, frameworks, \nlegislation and guidelines \n3.4.2 participate in opportunities to contribute to vocational \neducation and training organizational policy \ndevelopments \n3.4.3 manage work and work relationships \n3.5 \nresearch skills to access information \n3.6 \ntechnology skills to: \n3.6.1 use computer hardware and relevant software \n3.6.2 use office/business equipment \n \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \naccess to business, organizational, legislative and vocational \neducation and training documentation \n4.2 \naccess to clients \n4.3 \naccess to colleagues \n4.4 \naccess to a TVET operating environment  \n \n5. Method of assessment \nCompetency must be assessed through : \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nWritten Test \n5.4 \nThird Party Report \n \n6. Context for \nassessment \n6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or as a team under limited \nsupervision",
