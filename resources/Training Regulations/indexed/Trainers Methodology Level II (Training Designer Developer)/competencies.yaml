  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency required in\nTRAINERS METHODOLOGY (TM) II\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nlead in the dissemination and discussion of ideas, information\nand issues in the workplace.\n\nContext of this unit\n:\nThis unit is adopted from the basic competencies for National\nCertificate Level III. In the context of the Trainers Methodology (TM),\nthe term “workplace” in this unit would be understood to mean\n“training/learning environment.”\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1\nAppropriate communication method is selected\n1.2\nMultiple operations involving several topics areas are\ncommunicated accordingly\n1.3\nQuestions are used to gain extra information\n1.4\nCorrect sources of information are identified\n1.5\nInformation is selected and organized correctly\n1.6\nVerbal and written reporting is undertaken when required\n1.7\nCommunication skills are maintained in all situations\n\n2. Lead workplace\ndiscussions\n2.1\nResponse to workplace issues are sought\n2.2\nResponse to workplace issues are provided immediately\n2.3\nConstructive contributions are made to workplace discussions\non such issues as production, quality and safety\n2.4\nGoals/objectives and action plan undertaken in the workplace\nare communicated\n\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1\nIssues and problems are identified as they arise\n3.2\nInformation regarding problems and issues are organized\ncoherently to ensure clear and effective communication\n3.3\nDialogue is initiated with appropriate personnel\n3.4\nCommunication problems and issues are raised as they arise\n\n--- PDF PAGE 7 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3\nFace to face\n1.4\nTwo-way radio\n1.5\nSpeaking to groups\n1.6\nUsing telephone\n1.7\nWritten\n1.8\nInternet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n\n3. Underpinning Skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of written\nand electronic communication methods\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n\n5. Method of Assessment Competency may be assessed through:\n5.1\nDirect Observation\n5.2\nInterview\n\n6. Context for\nAssessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment\n\n--- PDF PAGE 8 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n4\n\nUNIT OF COMPETENCY :\nAPPLY MATH AND SCIENCE PRINCIPLES IN TECHNICAL\nTRAINING\n\nUNIT CODE\n:\n500232101\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to integrate math and\nscience concepts in the content and delivery of technical\ntraining programs and to motivate trainees in learning and\napplying such concepts in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify math and\nscience manifestations\nin the course content\nand the workplace\n1.1\nCourse content and learning outcomes are reviewed and\nstudied for math and science content\n1.2\nSituations in the workplace and in everyday life are related to\nthe course or program are identified for inclusion or mention\nin the training\n1.3\nTraining aids, lesson plans or session notes are prepared,\nadopted or customized incorporating or highlighting\napplications of math and science principles\n2. Relate math and\nscience concepts to\ncommon and\nworkplace situations\n2.1\nPractical applications of math and science related to the\ndesired learning outcomes are incorporated, explained and\nstressed during the training\n2.2\nTrainees are aided and encouraged to identify and apply\nmath and science concepts in their work and everyday life\n2.3\nClass examples/cases, exercises, and assignments are given\nfor trainees to explore and reflect on the\napplications/manifestations of math and science along the\ncourse content\n3. Assess trainees’\ninternalization of math\nand science concepts\n3.1\nTrainees’ retention of basic math and science concepts are\nreviewed to identify area needing further intervention\n3.2\nTrainees’ appreciation of math and science principles along\nthe trade area or subject matter is determined using\napplicable assessment methodology\n3.3\nSimple mathematical and scientific models/representations\nare discussed to aid in the understanding and application of\nprinciples and theories using language, style and format that\nare readily understood.\n3.4\nPoorly-understood areas of math and science relevant to the\ncourse are given extra attention and explained in user-friendly\nterms in accordance with trainees’ interests and learning\nstyles\n4. Introduce further\nenhancements\n4.1\nPersonal knowledge, experiences and observations of self\nand others in the area of math and science applications are\ncited and incorporated in the lessons and lecture-discussions\n4.2\nResults of application of math and science concepts are\nevaluated and documented for replication and enhancement\n4.3\nLogical, systematic and scientific thinking and methods are\nintroduced and developed for trainees to assimilate and apply\nin their own work and study\n4.4\nContextual and experiential learning methods are utilized\nto aid in appreciation of math and science concepts\n\n--- PDF PAGE 9 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Training aids\nMay include –\n1.1\nCurriculum/modules\n1.2\nLearning materials/activities\n1.2.1\nSelf-paced materials\n1.2.2\nJob sheets\n1.2.3\nRelated theory\n1.3\nAudio-visual aids\n1.3.1\nCharts\n1.3.2\nGraphs\n1.3.2\nDiagrams\n1.4\nInteractive video\n1.5\nComputer-based training materials\n2. Assessment\nmethodology\nMay include –\n2.1\nProjects\n2.2\nCase problems\n2.3\nWritten tests\n2.4\nOral questioning\n2.5\nInterviews\n3. Models/representations\nMay include –\n3.1\nSimple quantitative models\n3.1.1\nmathematical formulas using elementary algebra\n3.1.2\nconstants and variables\n3.1.3\nfunctions and relations\n3.2\nBasic laws and principles\n3.2.1\nOhm’s law\n3.2.2\nNewton’s laws of motion\n3.2.3\nBoyle’s law\n3.3\nGraphs and diagrams\n3.3.1\nCharts and flowcharts\n3.3.2\nCharacteristic curves\n3.3.3\nRefrigeration cycle\n3.3.4\nSchematic/block diagrams\n3.3.5\nFree-body diagrams\n4. Learning styles\nMay include –\n4.1\nKolb-model styles\n4.1.1\nConverger\n4.1.2\nDiverger\n4.1.3\nAssimilator\n4.1.4\nAccommodator\n4.2\nHoney-Mumford model styles\n4.2.1\nActivist\n4.2.2\nReflector\n4.2.3\nTheorist\n4.2.4\nPragmatist\n4.3\nFleming-model styles\n4.3.1\nVisual learners\n4.3.2\nAuditory learners\n4.3.3\nReading/writing-preference learners\n4.3.4\nKinesthetic/tactile learners\n5. Contextual and\nexperiential learning\nmethods\nMay include –\n5.1\nCase studies and problems\n5.2\nProject-based instruction\n5.3\nField trips\n5.4\nCompany visits\n5.5\nInterviews\n5.6\nInstitutional attachments/immersion\n5.7\nCommunity service\n\n--- PDF PAGE 10 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated understanding of basic math and science\nconcepts relevant to the competency or qualification\n1.2\nDemonstrated ability to apply math and science principles to\nthe competency or tasks being performed\n1.3\nDemonstrated ability to integrate and contextualize math and\nscience concepts in the design and delivery of technical\ntraining\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nBasic arithmetic – the four fundamental operations\n2.2\nElementary algebra\n2.3\nBasic science\n2.3.1 General science\n2.3.2 Natural sciences\n2.3.3 Physical and biological sciences\n2.3.4 Social sciences\n2.4\nBasic training methodology\n2.5\nPositive work values (patience, perseverance, empathy,\nprofessionalism, concern for safety and quality)\n\n3. Underpinning skills\n3.1\nCommunication skills\n3.2\nTraining development and management skills\n3.3\nObserving safety and health requirements in the classroom,\nlaboratory and workshop\n3.4\nInstructional skills\n\n4. Resource implications\nThe following resources MUST be provided –\n4.1\nAccess to math and science lab or similar workshop\n4.2\nAccess to real or simulated work area\n4.3\nCase problems in math and science applications\n\n5. Methods of\nassessment\nCompetency may be assessed through –\n5.1\nObservation or demonstration with oral questioning\n5.2\nWritten exam\n5.3\nCase problems\n5.4\nInterview\n5.5\nPortfolio\n5.6\nThird-party report\n\n6. Context of assessment Competency may be assessed on the job or in a simulated work\nenvironment\n\n--- PDF PAGE 11 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n7\n\nUNIT OF COMPETENCY :\nAPPLY ENVIRONMENTAL PRINCIPLES AND ADVOCATE\nCONSERVATION\nUNIT CODE\n:\n500232102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\napply/adopt environmental principles and advocate conservation\nin diverse technical-vocational training environments, including\nobserving and contributing to positive environment work\npractices. This covers the following: environmental work\npractices, contributing to improvements of environmental\npractices, and reporting potential environmental threats.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow environmental\nworkplace practices\n1.1\nWorkplace practices and work instructions relating to\npotential environmental impacts are recognized and followed,\nand clarification is sought where necessary.\n1.2\nRelevant legislation, codes and national standards that\nimpact on workplace environmental practices are recognized\nand followed.\n1.3\nChanges to work practices and procedures are responded to\npositively and promptly in accordance with organizational\nrequirements.\n1.4\nIndividual roles/responsibilities are determined and performed\nbased on the program/ activities identified\n\n2. Contribute to improve\nenvironmental work\npractices\n\n2.1\nSuggestions are made to designated personnel for\nimprovements to workplace practices where possible.\n2.2\nInformation is gathered and improvements are suggested to\nsupport the development of improved workplace approaches\nto environmental practices.\n2.3\nEnvironmental issues and their relationship to workplace\npractices are discussed in the workplace with colleagues and\ndesignated personnel.\n2.4\nContributions to the review of environmental practices and\npolicies are made within limits of responsibility.\n\n3. Recognize and report\npotential environmental\nthreats\n3.1\nSigns or symptoms of the potential environmental threat\nare recognized.\n3.2\nInformation about or observations of a potential environmental\nthreat are reported to supervisors and/or appropriate\nauthorities.\n3.3\nLocation and extent of the potential environmental threat is\naccurately recorded.\n3.4\nReports on the potential environmental threat are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 12 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Workplace practices\nand work instructions\nMay include but are not limited to procedures or work instructions\nfor:\n1.1\nEnvironmental l hazard identification and risk analysis\n1.2\nAvoiding or minimizing environmental risks,\n1.3\nImproving environmental performance,\n1.4\nWaste minimization and segregation,\n1.5\nEnvironmental monitoring,\n1.6\nSigns and labels (e.g., chemical labels),\n1.7\nEmergency procedures,\n1.8\nHazard and incident recording and reporting procedures\n1.9\nEnvironmental data recording and reporting procedures where\napplicable.\n1.10 Verbal instructions from persons with responsibility related to\nenvironmental work practices.\n\n2. Legislation, codes and\nnational standards\nMay include:\n2.1\nPhilippine Clean-Air Act of 1999 (RA 8749)\n2.2\nPhilippine Clean-Water Act of 2004 (RA 9275)\n2.3\nEcological Solid Waste Management Act of 2000 (RA 9003)\n2.4\nMontreal Protocol\n2.5\nKyoto Protocol\n2.6\nEnvironmental Awareness and Education Act of 2008 (RA\n9512)\n2.7\nPhilippine Climate-Change Act of 2009 (RA 9729)\n2.8\nCodes of Practice relating to environment-critical jobs\n\n3. Suggestions\n\nMay include but are not limited to the ideas to:\n3.1\nMinimize hazards and risks,\n3.2\nReduce and dispose of waste,\n3.3\nEfficient use energy\n3.4\nConserve water\n3.5\nReduce air and noise pollution\n3.6\nMake more efficient use of resources and improve\nenvironmental performance,\n3.7\nReduce soil disturbance and improve habitat resources.\n\n4. Designated personnel\nMay include but are not limited to:\n4.1\nAdministrators/ Managers,\n4.2\nSupervisors\n4.3\nPeople who are responsible for work area or who may be\nassigned to act as a mentor/trainer to a person\n\n5. Workplace approaches\nto environmental\npractices.\nMay include but are not limited to:\n5.1\nPreventing and minimizing the production of pollution (e.g.,\ndischarges to air, land and water, hazardous waste,\n5.2\nReducing 'burning off',\n5.3\nComposting ,\n5.4\nRecycling materials,\n5.5\nConservation practices), and\n5.6\nImproving workplace maintenance practices (e.g., using a\nbroom instead of a hose, using environment-friendly cleaning\nagents\n\n--- PDF PAGE 13 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n9\nVARIABLE\nRANGE\n6. Environmental issues\nMay include:\n6.1\nSustainability,\n6.2\nReduction and disposal of waste,\n6.3\nWater quality,\n6.4\nEnergy efficiency,\n6.5\nBiodiversity and habitat protection,\n6.6\nConservation of natural resources,\n6.7\nAir quality,\n6.8\nLand contamination,\n6.9\nNoise ,\n6.10 Soil and salinity management\n6.11 Fire management.\n\n7. Environmental\npractices and policies\nMay include:\n7.1\nWaste minimization and management,\n7.2\nSustainability ,\n7.3\nLocal , regional, state and national strategies on weed and\npest management,\n7.4\nProtection of land and habitat and conservation of resources,\n7.5\nEnergy use,\n7.6\nGreenhouse gas emissions,\n7.7\nUse of chemicals and plant and equipment.\n\n8. Signs or symptoms\nMay include but are not limited to:\n8.1\nObservation of the presence of weeds,\n8.2\nPest animals or chemicals;\n8.3\nDamage caused to plants, animals or the environment,\n8.4\nChanges in plant (e.g., dieback of trees) and animal health,\n8.5\nErosion of soils,\n8.6\nSoils in water suspension,\n8.7\nPresence of salt.\n\n9. Potential\nenvironmental threat\nor hazards\nMay include but are not limited to:\n9.1\nThis includes spills , leaks, pollution ,planned and unplanned\nemissions, soil compaction, disturbance and erosion,\n9.2\nAccidents and disposal of waste, and damage or disruption to\necosystems resulting from work practices.\n9.3\nAlso includes plants, animals or diseases that are classified as\nan environmental threat or problem in an area,\n9.4\nUnauthorized changes in land use\n9.5\nFire risks and threats, and inappropriate human interaction\non the environment.\n9.6\nThis may include damage to habitat resources, disruption of\nanimal behavior and territorial use, illegal vegetation\nclearance, seed collection, firewood gathering, nest\ndisturbance and egg collecting.\n\n--- PDF PAGE 14 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of workplace practices and work\ninstructions.\n1.2\nDescribed relevant legislations, codes and national standard\nenvironmental practices according to the different\nenvironmental issues/concerns.\n1.3\nFollowed environmental workplace practices\n1.4\nContributed to improve environmental work practices\n1.5\nRecognized and reported on a potential environmental threat\n1.6\nMaintained environmental records\n\n2. Underpinning\nKnowledge\n2.1\nRelevant legislation from all levels of government on\nenvironmental issues\n2.2\nRelevant environmental policies and workplace/industry\npractices and procedures\n2.3\nGood practice approaches relevant to work area particularly in\nregard to minimizing environment hazards and risks, and\nimproving environmental performance\n2.4\nEnvironmental issues, especially in regard to water\ncatchments, air, noise, ecosystems, habitat, efficient use of\nresources, sustainability and waste minimization\n2.5\nPotential environmental threats and problems relevant to a\ngiven region and occupation\n2.6\nGeneral work place practices and their potential impact on the\nenvironment.\n\n3. Underpinning Skills\n3.1\nPerforming research and analysis\n3.2\nReading / interpreting data and information\n3.3\nProblem solving\n3.4\nCommunicate with supervisors and workplace colleagues\n3.5\nRecognize basic environmental hazards and threats\n3.6\nfollow workplace directions and instructions\n3.7\nKeep simple records.\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nWorkplace/Assessment location\n4.2\nLegislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n4.3\nCase studies/scenarios relating to environmental protection\n\n5. Methods of\nAssessment\n\nCompetency may be assessed through:\n5.1\nWritten/ Oral Examination\n5.2\nInterview/Third Party Reports\n5.3\nPortfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n5.4\nSimulations\n\n6. Context for\nAssessment\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 15 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n11\n\nUNIT OF COMPETENCY :\nUTILIZE IT APPLICATIONS IN TECHNICAL TRAINING\n\nUNIT CODE\n:\n500232103\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\nutilize IT applications in training. Specifically it covers setting-up\nof\nwork\nenvironment,\nutilization\nof\nword\nprocessing,\nspreadsheet, presentation applications and utilization of internet\nand www to communicate and collect information.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Set-up work\nenvironment\n1.1\nWork folder is configured in accordance with enterprise IT\nutilization guidelines.\n1.2\nDesktop and shortcuts settings are configured in-line with\npersonal preference.\n1.3\nConnectivity to printer are checked and tested in accordance\nwith equipment user guide.\n2. Utilize word processing\napplication\n2.1\nDocument layout and formatting are applied in line with\ndocument formatting requirements.\n2.2\nApplication features are utilized to enhance productivity in\nline with application guide/ help instructions\n2.3\nPrinting of documents is performed in line with enterprise IT\nutilization guidelines.\n3. Utilize presenter\napplication\n3.1\nPresentation layout, formatting and theme utilization are\napplied in line with target audience requirements\n3.2\nAnimation and slide transitions are applied to enhance viewing\nand interactivity experience in-line with best practices in\nutilizing presentation package.\n3.3\nPrinting of presentation materials are performed in line with\nuser requirements and enterprise IT utilization guidelines\n3.4\nPackaging and exporting of presentation is performed in line\nwith application help instructions/wizard.\n3.5\nPresentation of information is performed in line with best\npractices in utilizing presentation package.\n4. Utilize spread sheet\napplication\n4.1\nWorkbook and worksheet settings and formatting are\napplied in line with printing requirements.\n4.2\nFormula and conditional formatting are utilized to enhance\nproductivity in line with the application help instructions.\n4.3\nCharts are utilized to enhance data presentation in line with the\napplication help instructions.\n4.4\nPrinting of worksheet is performed in line with document layout\nrequirements and enterprise IT utilization guidelines.\n5. Utilize internet and\nwww to communicate\nand collect information\n5.1\nChat and email facility is utilized to exchange information and\nresources in line with chat help instructions.\n5.2\nBrowser is configured to enhance productivity in line with the\napplication help instruction\nwww is utilized to research and acquire resources in line with\nenterprise IT utilization guidelines.\n\n--- PDF PAGE 16 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work folder\nconfiguration\n\nMay include but not limited to:\n1.1\nFolder creation\n1.2\nFolder copy and transfer\n1.3\nFolder sharing\n2. Desktop and shortcuts\nsettings are configured\nMay include but not limited to:\n2.1\nDesktop background and screen saver settings\n2.2\nScreen resolution settings\n2.3\nShortcut and link creation\n3. Document layout and\nformatting\nMay include:\n3.1\nPage settings\n3.2\nFont Settings\n3.3\nFormatting styles\n3.4\nTable utilization\n4. Application features\nMay include, but not limited to:\n4.1\nFooter and header setting\n4.2\nMail merge\n4.3\nReview and editing tools\n4.4\nReference features\n4.5\nForm creation features\n5. Best practices in\nutilizing presentation\npackage\nMay include but not limited to:\n5.1\nNumber of text lines, font size and fore and back colors.\n5.2\nOptimal utilization of animation and transition effects to\nenhance learning experience not to distract audience.\n5.3\nAwareness in unconscious actions during presentation\n6. Printing of presentation\nmaterials\nMay include but not limited to:\n6.1\nSlide\n6.2\nNotes\n7. Workbook and\nworksheet settings\nMay include but not limited to:\n7.1\nPage setup\n7.2\nHeader setup\n7.3\nWorksheet organization\n8. Formula\nMay include but not limited to:\n8.1\nSummation\n8.2\nDivision\n8.3\nMultiplication\n8.4\nDivision\n8.5\nAverage\n8.6\nRounding off\n8.7\nIf\n8.8\nConcatenate\n9. Browser configuration\nMay include but not limited to:\n9.1\nCookie settings\n9.2\nPlug-in setup\n9.3\nAccessibility adjustments\n\n--- PDF PAGE 17 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSet-up work environment\n1.2\nUtilized word processing application\n1.3\nUtilized presenter application\n1.4\nUtilized spreadsheet application\n1.5\nUtilized internet and www to communicate and collect\ninformation\n\n2 Underpinning\nKnowledge\n2.1\nI.T. Principles (i.e. internet technology, www)\n2.2\nBest practices in using presenter application\n2.3\nBasic mathematical operation\n2.4\nLogic reasoning\n2.5\nProductivity application features\n2.6\nFile management\n2.7\nAcademic documents (i.e. record sheet, accomplishment\ncharts, session plan\n\n3. Underpinning Skills\n3.1\nEncoding and computing skills\n3.2\nPresentation skills\n3.3\nLogic reasoning skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nComputer with network and internet access\n4.2\nPrinter and printing consumables\n4.3\nSpecification of sample document, worksheet, presentation\nmaterials\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n\n6. Context for\nAssessment\nAssessment should be conducted in the workplace/ simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 18 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n14\n\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\n\nUNIT CODE\n:\n500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead small\nteams including setting and maintaining team and individual\nperformance standards.\nThis unit is adopted from the basic competencies for National Certificate Level III.\nIn the context of the Trainers Methodology (TM), the small teams here would refer\nto groups of trainees, audience or participants in a training situation, or a group of\nfellow trainers.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to team\nmembers\n1.2\nReasons for instructions and requirements are communicated to\nteam members\n1.3\nTeam members’ queries and concerns are recognized,\ndiscussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having regard to the\nskills, knowledge and aptitude required to properly undertake\nthe assigned task and according to company policy\n2.2\nDuties are allocated having regard to individual preference,\ndomestic and personal considerations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on client\nneeds and according to assignment requirements\n3.2\nPerformance expectations are based on individual team\nmembers duties and area of responsibility\n3.3\nPerformance expectations are discussed and disseminated to\nindividual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against defined\nperformance criteria and/or assignment instructions and\ncorrective action taken if required\n4.2\nTeam members are provided with feedback, positive support\nand advice on strategies to overcome any deficiencies\n4.3\nPerformance issues which cannot be rectified or addressed\nwithin the team are referenced to appropriate personnel\naccording to employer policy\n4.4\nTeam members are kept informed of any changes in the priority\nallocated to assignments or tasks which might impact on\nclient/customer needs and satisfaction\n4.5\nTeam operations are monitored to ensure that employer/client\nneeds and requirements are met\n4.6\nFollow-up communication is provided on all issues affecting the\nteam\n4.7\nAll relevant documentation is completed in accordance with\ncompany procedures\n\n--- PDF PAGE 19 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n\n2. Team member’s\nconcerns\n\n2.1\nRoster\n2.2\nShift details\n3. Monitor performance\n3.1 Formal process\n3.2 Informal process\n\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 20 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n16\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2\nAssessed and monitored team and individual performance\nagainst set criteria\n1.3\nRepresented concerns of a team and individual to next level of\nmanagement or appropriate specialist and to negotiate on\ntheir behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5\nSet and communicated performance expectations for a range\nof tasks and duties within the team and provided feedback to\nteam members\n\n2. Underpinning\nKnowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n\n3. Underpinning Skills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n\n5. Method of Assessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual member\nin relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of issues\nand strategies in teamwork\n\n6. Context for\nassessment\nCompetency may be assessed in the actual workplace or in a\nsimulated work environment\n\n--- PDF PAGE 21 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n17\n\nUNIT OF COMPETENCY :\nAPPLY WORK ETHICS, VALUES AND QUALITY PRINCIPLES\n\nUNIT CODE\n:\n500232104\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required in demonstrating and\nliving out desirable work ethics, values and principles in the\nworkplace and training environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Observe workplace\npolicies and guidelines\n1.1\nAttendance and punctuality are observed in line with enterprise\npolicies and guidelines.\n1.2\nWork functions are performed in line with work\nposition/delegation and according to enterprise goals and\nobjectives.\n1.3\nCommunication, request, and complaints are channelled\nthrough authority in line with enterprise policies and\nprocedures.\n1.4\nAcademic freedom is exercised in line with enterprise goals\nand objectives\n1.5\nQuality work instructions are delivered in accordance with work\ndeadlines and training calendars.\n\n2. Value self-worth and\nprofession\n2.1\nBest practices in teaching are demonstrated at all times.\n2.2\nPersonal and professional upgrading is exercised in line with\npersonal goals and enterprise guidelines and policies.\n2.3\nConfidentiality of records and other documents are maintained\nin line with enterprise policies and guidelines.\n2.4\nProfessional courtesy is exercised at all times\n2.5\nProfessional role and image as technical trainer are maintained\nin the classroom/training environment and related situations.\n\n3. Observe proper\nconduct in dealing with\nlearners and parents\n3.1\nPromotion of learners is performed based on non-prejudice\ndecision and actual accomplishments and performance of\nlearners.\n3.2\nLearners were given equal opportunities to learn and utilize\nschool facilities in line with the enterprise objective and goals.\n3.3\nParent consultations are performed in line with enterprise\npolicies and guidelines\n\n--- PDF PAGE 22 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work functions\nMay include but not limited to:\n1.1\nTeaching\n1.2\nGuiding\n1.3\nManaging events and school activities\n\n2. Academic freedom\nMay include but not limited to:\n2.1\nSelection of teaching methods\n2.2\nImplementation of remedial classes\n2.3\nChanging methods of collecting evidence of learning\n\n3. Best practices in\nteaching\nMay include:\n3.1\nTeaching with teaching aids\n3.2\nEmploying learner-centered activities\n\n4. Non-prejudice decision May include, but not limited to:\n4.1\nDecision made from favour\n4.2\nDecision came from political reason\n\n--- PDF PAGE 23 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n19\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nObserved workplace policies and guidelines\n1.2\nValued self-worth and profession\n1.3\nObserved proper conduct in dealing with learners and parents.\n\n2. Underpinning\nKnowledge\n2.1\nCode of ethics and right conduct\n2.2\nPersonnel management\n2.3\nFilipino customs and traits\n\n3. Underpinning Skills\n3.1\nInterpersonal skills\n3.2\nCommunication skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nCase study\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nWritten test/ Interview\n5.2\nPortfolio\n\n6. Context for\nAssessment\nAssessment should be conducted in the workplace /simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 24 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n20\n\nUNIT OF COMPETENCY :\nWORK EFFECTIVELY IN VOCATIONAL EDUCATION AND\nTRAINING\n\nUNIT CODE\n:\n500232105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\nwork effectively in the policy and operating environment of the\nvocational education and training sector.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Work within the\nvocational education\nand training policy\nframework\n1.1\nRelevant national vocational education and training\npolicies and frameworks are accessed, analyzed, applied\nand guided in accordance with work practices and\nresponsibilities.\n1.2\nKey vocational education and training organizations and\nstakeholders are identified, accessed and informed in\naccordance with updated work practices.\n1.3\nLegislation and guidelines are accessed, used, complied\nand ensured in accordance work practices and policy\nrequirements.\n1.4\nSources of information and advice on vocational education\nand training policy and operating context are accessed on a\nregular basis and changes are noted as appropriate\n1.5\nOpportunities are taken up to contribute to vocational\neducation and training in accordance with organizational policy\ndevelopments.\n1.6\nVocational education and training terminology is used to\ncommunicate effectively in accordance with sector.\n\n2. Work within the training\norganization’s quality\nframework\n2.1\nRelevant organizational documentation is accessed, used,\nsupported and ensured in accordance work roles and\nresponsibilities.\n2.2\nWork is conducted in accordance with the training\norganization’s quality assurance strategies, processes,\npolicies and procedures.\n2.3\nEthical and legal responsibilities are adhered to in\naccordance with work practices.\n2.4\nWork is undertaken in accordance with the prevailing industrial\nand employee relations systems and practices.\n2.5\nFeedback and advice on work quality is actively sought from\ncolleagues and clients in accordance with the prevailing\nindustrial and employee relations systems and practices.\n\n--- PDF PAGE 25 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n21\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Manage work and work\nrelationships\n3.1\nWork is planned, prioritized and organized to achieve agreed\nand expected outcomes.\n3.2\nWorkloads are assessed and guidance/support is sought from\nrelevant personnel where work issues arise and in\naccordance with existing organizational policies and\nguidelines.\n3.3\nRelevant technological skills are used to enhance work\noutcomes and in accordance with prevailing industrial systems\nand practices.\n3.4\nWork is undertaken in a collaborative manner with colleagues\nthrough sharing of information and ideas and working together\non work outcomes in accordance with the prevailing industrial\nand employee relations systems and practices.\n3.5\nFeedback on managing work and professional relationships is\nobtained from clients and colleagues and is evaluated and\nacted upon.\n\n4. Demonstrate a client-\nfocused approach to\nwork\n4.1\nClients and their needs and expectations form the basis for\ndeveloping effective work practices and outcomes in\naccordance with operational limits.\n4.2\nEffective communication strategies are developed, utilized,\nestablished and maintained in accordance with client\nrelationships.\n4.3\nProcesses for evaluating and improving client satisfaction are\ndeveloped and built in accordance with work practices.\n\n--- PDF PAGE 26 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. National vocational\neducation and training\npolicies and\nframeworks\nMay include\n1.1\nPhilippine TVET Trainers Qualification Framework (PTTQF)\n1.2\nTraining Packages\n1.3\nUser Choice\n1.4\nTraineeship and apprenticeship arrangements\n\n2. Vocational education\nand training\norganizations and\nstakeholders\nMay include:\n2.1\nDepartment of Labor and Employment (DOLE)\n2.2\nTechnical Education and Skills Development Authority\n(TESDA)\n2.3\nIndustry Skills Councils (ISCs)\n2.4\ntraining organizations\n\n3. Legislation and\nguidelines\nMay include:\n3.1\nGuidelines on program/project funding\n3.2\nUser Choice\n3.3\nApprenticeships/traineeships\n3.4\nImplementation of Training Packages\n3.5\nRegistration\n3.6\nCourse accreditation\n3.7\nAccess and equity\n3.8\nAnti-discrimination including equal opportunity, racial\nvilification and disability discrimination\n3.9\nIndustrial relations\n3.10 Code of practice\n3.11 Occupational health and safety (OHS)\n\n4. Sources of information\nand advice\nMay include:\n4.1\nWeb-based information from vocational education and training\norganizations and stakeholders such as the National Training\nInformation Service (NTIS)\n4.2\nPrinted policies, newsletters, bulletins, publications of\nvocational education and training organizations and\nstakeholders\n4.3\nProducts including revised Training Packages, support\nmaterials and professional development materials\nimplementation guidelines\n4.4\nResearch journals\n4.5\nConference papers\n\n--- PDF PAGE 27 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n23\n\nVARIABLE\nRANGE\n5. Opportunities\nMay include:\n5.1\nAttendance at workshops and consultations conducted by\nrelevant vocational education and training organizations and\nstakeholders\n5.2\nIndividual or organizational written submissions and feedback\nto relevant vocational education and training organizations\nand stakeholders\n5.3\nParticipation in forums, networks, conferences\n5.4\nParticipation in training organization meetings\n5.5\nParticipation in validation meetings\n5.6\nResearch/consultancy\n5.7\nContribution to online consultations\n\n6. Vocational education\nand training\nterminology\nMay include but not limited to:\n6.1\nAcronyms\n6.2\nLanguage of the profession\n6.3\nLanguage styles commonly used in vocational education and\ntraining environments\n\n7. Relevant\norganizational\ndocumentation\nMay include:\n7.1\nStrategic plans\n7.2\nBusiness plans\n7.3\nPolicies and procedures\n7.4\nPosition descriptions\n7.5\nResponsibility statements\n\n8. Training organization’s\nquality assurance\nstrategies, processes,\npolicies and\nprocedures\nMay relate to:\n8.1\nQuality arrangements for clients covering:\n8.1.1 enrolment and induction/orientation\n8.1.2 complaints, grievances and appeals\n8.1.3 assessment, including skills recognition, pre-\nassessment and appeals\n8.1.4 identification of training support requirements, for\nexample, language, literacy and/or numeracy needs\n8.1.5 fees\n8.1.6 privacy\n8.1.7 access and equity\n8.1.8 welfare and guidance\n8.1.9 issuance of qualifications\n8.1.10 mutual recognition of qualifications, Statements of\nAttainment, credit and articulation arrangements\n8.2\nInternal quality policies and procedures covering:\n8.2.1 risk management\n8.2.2 continuous improvement\n8.2.3 OHS\n8.2.4 equal employment opportunity (EEO)\n8.2.5 discrimination and workplace harassment\n\n--- PDF PAGE 28 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n24\n\nVARIABLE\nRANGE\n\n8.2.6 staff disciplinary procedures\n8.2.7 financial management\n8.2.8 records management\n8.2.9 management processes for learning resources and\nlearning materials\n8.2.10 recruitment and induction of personnel\n8.2.11 staff qualifications\n8.3\nlearning and professional/staff development opportunities\n8.4\ntraining organization staff development programs\n8.5\nparticipation in networks\n8.6\nindividual learning initiatives\n8.7\nmembership of professional associations/networks\n8.8\nrelevant university courses\n\n9. Ethical and legal\nresponsibilities\nMay include:\n9.1\ncompliance with relevant legislation including:\n9.1.1 OHS legislation\n9.1.2 EEO legislation\n9.1.3 anti-discrimination legislation\n9.1.4 legislation relating to overseas learners\n9.2\ncompliance with industrial awards, enterprise agreements\nand employment contracts\n9.3\nmeeting environmental standards\n9.4\nduty of care\n9.5\nrecognizing and being sensitive to individual differences and\ndiversity\n9.6\nprovision of accurate information, advice and services\n9.7\nproviding support to learners appropriate to their needs\n9.8\nmaintaining client privacy and confidentiality\n9.9\ncode of practice\n\n10. Work issues\nMay include:\n10.1 time pressures\n10.2 work overload\n10.3 competing demands\n10.4 unexpected contingencies\n10.5 technology problems\n10.6 relations with other personnel\n10.7 client issues/relations\n\n11. Relevant technological\nskills\nMay include checking that the idea:\n11.1 using computer word processing software to produce\ndocuments, reports and learning materials\n11.2 using computer presentation applications\n11.3 using computer data processing software to produce statistical\ninformation\n\n--- PDF PAGE 29 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n25\n\nVARIABLE\nRANGE\n\n11.4 using computers/communication systems to support online\nlearning\n11.5 conducting web searches\n11.6 participating in Internet/video conferencing\n11.7 using chat rooms\n11.8 managing email\n11.9 operating computer projection equipment\n11.10 operating overhead projectors\n11.11 operating other business equipment, e.g. fax machines,\nphotocopiers and telephone systems\n\n12. Clients and colleagues\nMay include:\n12.1 individual learners, apprentices and trainees, employees\n12.2 enterprises/industry\n12.3 other parts of the training organization\n12.4 government departments/agencies, or other organizations\n\n13. Clients and their needs\nand expectations\nMay include:\n13.1 a focus on individual learner objectives such as:\n13.1.1 new skills\n13.1.2 specific competencies\n13.1.3 target qualifications\n13.1.4 new career\n13.1.5 career advancement\n13.1.6 improved language\n13.1.7 literacy and numeracy skills\n13.2 preference for particular learning styles\n13.3 individualized learning support systems\n13.4 individualized organizational training\n13.5 client centered approaches\n13.6 information and advice on courses, learning programs and\nqualifications\n\n14. Operational limits\nMay include:\n14.1 level of responsibility, autonomy, classification level\n14.2 staffing resource limitations\n14.3 physical environment limitations\n14.4 cost\n14.5 time\n14.6 scheduling difficulties\n14.7 OHS\n\n15. Effective\ncommunication\nstrategies\nMay include:\n15.1 establishing clarity of purpose\n15.2 ongoing liaison\n15.3 effective reporting arrangements\n15.4 continuous feedback mechanisms\n\n--- PDF PAGE 30 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n26\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nWorked within the vocational education and training policy\nframework\n1.2\nWorked within the training organization’s quality framework\n1.3\nManaged work and work relationships\n1.4\nDemonstrated a client-focused approach to work\n\n2. Underpinning\nknowledge and attitude\n2.1\nTraining Packages, including the purpose and structure of:\n2.1.1 units of competency\n2.1.2 Assessment Guidelines\n2.1.3 qualifications\n2.1.4 Employability Skills\n2.1.5 support materials\n2.2\nPhilippine TVET Trainers Qualification Framework (PTTQF)\n2.3\nsources of information on vocational education and training,\nfor example:\n2.3.1 NTIS web site for accessing details on units,\ncourses/qualifications, training organizations, and\nTraining Packages and support materials\n2.4\nsources of information on legal and organizational\nrequirements, for example:\n2.4.1 organizational manuals, documents, publications\n2.4.2 organizational data systems\n2.4.3 publications, newsletters of relevant authorities\n2.5\ncompetency-based training and assessment, for example:\n2.5.1 competency standards define performance outcomes,\napplied knowledge and skills needed for work\n2.5.2 competency standards form the basis for teaching and\nlearning and training delivery in recognized TVET\n2.5.3 learning is outcomes focused not inputs driven\n2.5.4 competency standards establish requirements for\nassessment\n2.5.5 assessment is criterion referenced/not norm\nreferenced\n2.5.6 assessment is reported as competent/not yet\ncompetent\n2.5.7 competency standards are industry defined\n2.5.8 competency standards have a national focus\n2.6\nthe training organization’s systems, policies and procedures\n2.7\nrelevant vocational education and training terminology\nappropriate to the work role\n2.8\nthe diversity of clients, client needs, client expectations for\nvocational education and training services\n\n--- PDF PAGE 31 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n27\n\n2.9\nrelevant legal and policy requirements, codes of practice,\nnational standards and legislations, for example:\n2.9.1 specific industry/workplace legal/compliance and\nlicensing requirements\n2.9.2 duty of care under common law\n2.9.3 anti-discrimination including equal opportunity, racial\nvilification and disability discrimination\n2.9.4 workplace relations, industrial awards and enterprise\nagreements\n2.9.5 privacy/security of information\n2.9.6 copyright/plagiarism\n2.10 relevant OHS knowledge relating to the work role/work\ncontext, and OHS considerations when working in vocational\neducation and training, including:\n2.10.1 internal policies and procedures to meet OHS\nrequirements\n2.10.2 hazards commonly found in the work environment\n2.10.3 sources of OHS information and expertise\n\n3. Underpinning skills\n3.1\nliteracy skills to:\n3.1.1 read and understand vocational education and training\npolicy and other documents, vocational education and\ntraining terminology and language styles\n3.1.2 interpret legal requirements of vocational education\nand training policies, procedures and guidelines\n3.1.3 write documents for a range of vocational education\nand training audiences and purposes\n3.2\nlanguage skills to:\n3.2.1 communicate with personnel across all levels of the\norganization and with clients\n3.2.2 understand and use vocabulary and terminology\nspecific to the vocational education and training\nenvironment\n3.2.3 listen and summarize key points, make evaluative\njudgments and articulate verbally or in writing to a\nclient or colleague\n3.2.4 facilitate discussions to encourage problem solving,\nsharing of strategies, and exploring different solutions\nto problems\n3.2.5 work effectively as a team member\n3.3\nrecognizing and being sensitive to individual difference and\ndiversity, for example:\n3.3.1 being sensitive to and valuing culture\n3.3.2 acting without bias/discrimination\n3.3.3 responding to individuals with particular needs\n3.3.4 recognizing the importance of religion\n\n--- PDF PAGE 32 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n28\n\n3.4\nplanning skills to:\n3.4.1 identify and access relevant sources of national\nvocational education and training policies, frameworks,\nlegislation and guidelines\n3.4.2 participate in opportunities to contribute to vocational\neducation and training organizational policy\ndevelopments\n3.4.3 manage work and work relationships\n3.5\nresearch skills to access information\n3.6\ntechnology skills to:\n3.6.1 use computer hardware and relevant software\n3.6.2 use office/business equipment\n\n4. Resource implications\nThe following resources MUST be provided:\n4.1\naccess to business, organizational, legislative and vocational\neducation and training documentation\n4.2\naccess to clients\n4.3\naccess to colleagues\n4.4\naccess to a TVET operating environment\n\n5. Method of assessment\nCompetency must be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n\n6. Context for\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or as a team under limited\nsupervision\n\n--- PDF PAGE 33 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n29\n\nUNIT OF COMPETENCY :\nFOSTER\nAND\nPROMOTE\nAN\nINCLUSIVE\nLEARNING\nCULTURE\n\nUNIT CODE\n:\n500232106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nfoster and promote an environment which supports inclusive\nwork practices and learning culture\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Practice inclusivity\n1.1\nIndividual differences and clients with particular needs are\nacknowledged, respected and valued in accordance with\nexisting work practices and learning culture.\n1.2\nPersonal perceptions and attitudes about difference are\nexamined and revised to improve communication and\nprofessionalism in accordance with existing work practices and\nlearning culture.\n1.3\nPrinciples underpinning inclusivity are integrated into all work\npractices.\n1.4\nThe training organization’s access and equity policy is used in\naccordance to work practices.\n1.5\nIndividuals' rights and confidentiality are respected at all times.\n\n2. Promote and respond\nto diversity\n2.1\nThe ground rules for participation and behavior with\ncolleagues and clients are established in accordance with a\ncooperative and agreed process/es.\n2.2\nIndividuals are encouraged to express themselves and to\ncontribute to the work and learning environment in accordance\nwith a cooperative and agreed process/es.\n2.3\nIndividuals are provided with opportunities to indicate specific\nneeds to support their participation in learning and work in\naccordance with a cooperative and agreed process/es.\n2.4\nRelevant research, guidelines and resources are accessed to\nsupport inclusivity in accordance with existing guidelines and\nprocedures.\n2.5\nVerbal and body language is sensitive to different cultures\nand backgrounds and differences in physical and intellectual\nabilities and as appropriate.\n\n3. Develop and\nimplement work\nstrategies to support\ninclusivity\n3.1\nDocumented resources to support and guide inclusive\npractices are identified and used to inform work strategies in\naccordance with existing guidelines and procedures.\n3.2\nSupport persons are identified and included in the work and\nlearning process where appropriate and agreed to.\n\n--- PDF PAGE 34 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n30\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n3.3\nRelevant professional support services are identified and\naccessed, as appropriate.\n3.4\nAny physical environment support needs are acknowledge\nand incorporated into work practices, where practicable and\napproved by appropriate personnel.\n3.5\nOHS issues associated with inclusivity are identified and\naddressed in accordance with existing guidelines and\nprocedures.\n3.6\nInclusiveness is modeled in accordance with work\nperformance.\n\n4. Promote a culture of\nlearning\n4.1\nSupport and advice is provided to colleagues and clients to\nencourage new and ongoing participation in accordance with\nlearning opportunities.\n4.2\nThe benefits of learning are explored with colleagues and\nclients in accordance with a culture of learning.\n4.3\nLearning and competency achievement is recognized and\nrewarded in accordance with the work and/or learning\nenvironment.\n4.4\nOpportunities to develop own and others generic skills are\nidentified in accordance with the work and/or learning\nenvironment.\n4.5\nMultiple pathways to achieve own and others future learning\ngoals are discussed in accordance with the work and/or\nlearning environment.\n\n5. Monitor and improve\nwork practices\n5.1\nEffective work practices to enhance inclusivity and a learning\nculture are identified in accordance with the work and/or\n5.2\nConscious actions are taken to modify and improve in\naccordance with work practices learning environment.\n5.3\nStrategies and policies to support inclusivity are regularly\nreviewed in accordance with continuous improvement of work\nprocesses.\n5.4\nProposed changes to relevant strategies and policies are\ndocumented and reported in accordance with organizational\nstructure.\n\n--- PDF PAGE 35 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Individual differences\nMay include:\n1.1\nlearning difficulties\n1.2\nliteracy and numeracy needs\n1.3\nlanguage other than English (LOTE)\n1.4\ncultural background, images and perceptions\n1.5\nsocio-economic background\n1.6\nage, gender, sexuality\n1.7\nreligious practices\n1.8\nintellectual impairment or disability\n1.9\nmedical conditions such as arthritis, epilepsy, diabetes and\nasthma\n1.10 physical impairment or disability involving hearing vision, voice\nor mobility\n1.11 psychological or psychiatric impairment\n\n2. Clients with particular\nneeds\nMay include:\n2.1\nwomen where under-represented\n2.2\nrural and remote learners\n2.3\npeople with disabilities, either permanent o temporary\n2.4\npeople from non-English speaking backgrounds\n2.5\nyouth at risk\n\n3. Principles\nMay include:\n3.1\nsupporting equal opportunity for participation\n3.2\nfostering and advocating independence\n3.3\nensuring cooperative approaches to learning\n3.4\nusing client-centered approaches to learning\n3.5\nsupporting, encouraging and valuing individual contributions\n3.6\nmotivating learners\n3.7\ncreating opportunities for participation and success\n3.8\nmaking reasonable adjustments to procedures, activities and\nassessment for equity\n3.9\nacknowledging current strengths and skills as a basis for\nfurther learning\n\n4. Ground rules\nMay include:\n4.1\nguidelines of behavior and acceptance\n4.2\ncommon understandings between learners about group\ninteraction, respect and acceptance\n4.3\nexpectations of working relationships\n4.4\nsafety of learners and others\n4.5\ncomfort of learners and others\n4.6\nagreed consequences for breaching ground rules\n\n5. Specific needs\nMay include:\n5.1\nphysical environment adjustments\n5.2\nadjustments to learning and assessment activities\n5.3\nOHS issues to be addressed\n5.4\nlanguage requirements\n5.5\nliteracy and numeracy issues\n5.6\nmore time/additional support to learners\n5.7\nneed for a broad general education\n\n--- PDF PAGE 36 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n32\n\nVARIABLE\nRANGE\n6. Verbal and body\nlanguage\nMay refer to:\n6.1\nlanguage that recognizes and values individual differences\n6.2\nlanguage that supports inclusivity\n6.3\nlanguage that is non-discriminatory\n6.4\nlanguage that does not devalue, denote or derogate\n6.5\nlanguage that does not suggest fear, mistrust or lack of\nunderstanding\n6.6\nlanguage that does not label or suggest assumptions about\ncapabilities\n\n7. Documented\nresources\nMay include:\n7.1\njournals\n7.2\ninformation technology resources such as the web, hardware\nand software\n7.3\ntexts and references\n\n8. Support persons\nMay include:\n8.1\nfamily members\n8.2\ngovernment officers in specialist support services\n8.3\ncase workers and personal careers\n8.4\nadvocates for a person or group\n8.5\npeer support\n8.6\ninterpreters\n8.7\ncommunity representatives\n8.8\nnote takers\n8.9\nlibrary personnel\n8.10 technical support\n8.11 human resources personnel\n8.12 administrative personnel\n8.13 career counselors\n8.14 student services officers\n8.15 equity liaison officers\n\n9. Physical environment\nsupport needs\nMay include:\n9.1\nmodifications to layout of premises\n9.2\nequipment modifications\n9.3\nuse of adaptive technologies\n9.4\nchanges to work schedules\n9.5\nmodifications to job design\n\n10. OHS issues may\ninclude\nMay include:\n10.1 issues relating to the learner\n10.2 issues relating to the OHS impact on others\n\n11. Generic skills\nMay include:\n11.1 Employability Skills including:\n11.1.1 communication\n11.1.2 teamwork\n11.1.3 problem solving\n11.1.4 initiative and enterprise\n11.1.5 planning and organizing\n11.1.6 self-management\n11.1.7 learning\n11.1.8 technology\n11.2 innovation\n11.3 language, literacy, numeracy and communication skills\n\n--- PDF PAGE 37 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n33\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nPracticed inclusivity\n1.2\nPromoted and respond to diversity\n1.3\nDeveloped and implement work strategies to support\ninclusivity\n1.4\nPromoted a culture of learning\n1.5\nMonitored and improve work practices\n\n2. Underpinning\nknowledge and\nattitude\n2.1\nthe principles underpinning inclusivity and how to integrate\nthem into work practices\n2.2\nthe diversity of clients, client needs, client backgrounds and\ndiffering expectations for vocational education and training\nservices\n2.3\nethical and inclusive behaviors expected of professional\nrelationships with clients and colleagues\n2.4\nsources of information to support inclusive practices\n2.5\navailability and types of supports for clients with specific\nneeds\n2.6\nrelevant policies, legal requirements, codes of practice on:\n2.6.1 disability, discrimination, inclusiveness, human rights,\nequal opportunity, racial discrimination\n2.6.2 duty of care responsibilities\n2.6.3 access and equity policies\n2.7\norganizational work systems, practices\n2.8\nOHS relating to the work role/work context, and OHS\nconsiderations when fostering and promoting an inclusive\nlearning culture including:\n2.8.1 internal policies and procedures to meet OHS\nrequirements\n2.8.2 hazards commonly found in the work environment\n2.9\nduty of care of the training and trainer for the learner and\nothers who may be affected by actions of others within or\nattending the training\n\n3. Underpinning skills\n3.1\nlanguage and communication skills that:\n3.1.1 reflect inclusive language\n3.1.2 address cross cultural communication, indirect\ncommunication, participation of others (family/\ncommunity/elders), appropriate time and\ncommunication protocols\n3.1.3 involve consultation and liaison with clients, other\ncolleagues, counselors, experts and specialists on\nlearning concerns/issues\n\n--- PDF PAGE 38 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n34\n\n3.1.4 reflect good practice in active listening, appropriate eye\ncontact, friendly tone, appropriate volume, clarity of\ndiction and plain English\n3.1.5\n3.1.6 encourage expression by all individuals\n3.1.7 involve a variety of mediums\n3.2\nrecognizing and being sensitive to individual difference and\ndiversity, for example:\n3.2.1 being sensitive to and valuing culture\n3.2.2 acting without bias/discrimination\n3.2.3 responding to individuals with particular needs\n3.2.4 recognizing the importance of religion\n3.3\nresearch skills to identify and increase knowledge of individual\ndifferences and how these impact on individuals\n3.4\nproblem solving skills to:\n3.4.1 identify specific needs\n3.4.2 respond appropriately to cultural diversity\n\n4. Resource Implication\n\nThe following resources MUST be provided:\n4.1\naccess to relevant policies, legislation, guidelines and\nresources to support inclusivity\n4.2\naccess to clients/colleagues\n4.3\naccess to workplace environment\n\n5. Method of assessment\nCompetency must be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n\n6. Context for\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 39 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n35\n\nUNIT OF COMPETENCY :\nENSURE A HEALTHY AND SAFE LEARNING ENVIRONMENT\n\nUNIT CODE\n:\n500232107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\nensure the health, safety and welfare of learners and candidates.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify Occupational\nHealth and Safety (OHS)\nresponsibilities\n1.1\nThe purpose and approaches of OHS in the learning environment\nare defined in accordance with OHS standards.\n1.2\nDocumentation outlining the OHS legal responsibilities of the\nvarious parties in the learning environment is accessed, read and\ninterpreted in accordance with OHS standards\n1.3\nOrganizational OHS documentation is identified and accessed in\naccordance with standard operating procedures.\n2. Identify hazards in the\nlearning environment\n2.1\nSources of information are researched and accessed to identify\nhazards common within the industry in which the learning will take\nplace.\n2.2\nLearning environment is inspected prior to use in consultation with\nvarious parties in order to identify hazards.\n2.3\nAny specific OHS needs of learners and/or candidates are in\naccordance with OHS standards.\n2.4\nAny potential hazards created by learners and/or candidates with\nspecific needs are identified in accordance with OHS standards.\n2.5\nPersonal limitations and responsibilities in identifying hazards are\nrecognized and specialist advisers are consulted in accordance with\nOHS standards.\n3. Assess risks in the\nlearning environment\n3.1\nLikelihood of injury as a result of exposure to identified hazard/s is\nassessed in accordance with OHS standards.\n3.2\nSeverity of any potential injury, illness or negative/adverse outcome\narising from the identified hazard is assessed for risk in accordance\nwith OHS standards.\n3.3\nHazards are prioritized for action in consultation with various parties\nin accordance with OHS standards.\n3.4\nPersonal limitations in assessing risks are recognized and specialist\nadvisers are consulted in accordance with OHS standards.\n4. Develop and implement\nactions to ensure the\nhealth safety and welfare\nof learners and/or\ncandidates\n4.1\nRisk controls are developed based on the hierarchy of control in\naccordance with OHS standards.\n4.2\nRisk control action plan is identified and accessed or formulated in\nconsultation with various parties\n4.3\nActions within the control and responsibility of the trainer/facilitator\nare implemented in accordance with OHS standards.\n4.4\nOutstanding risk control actions are referred to the various parties for\nimplementation.\n4.5\nSupervisory arrangements appropriate to learners and/or\ncandidates levels of knowledge/skill/ experience are monitored to\nensure their health and safety.\n5. Provide appropriate\nOccupational Health and\nSafety (OHS)\nrequirements to learners\nand/or candidates\n5.1\nLearners and/or candidates are provided with appropriate\ninformation related to OHS\n5.2\nLearners and/or candidates are assessed for knowledge of OHS\nrequirements.\n5.3\nLearners and/or candidates are supplied with personal protective\nequipment in accordance with OHS standards.\n6. Monitor Occupational\nHealth and Safety (OHS)\narrangements in the\nlearning environment\n6.1\nAchievement against the risk control action plan is monitored and\nany issues addressed as appropriate\n6.2\nThe effectiveness and reliability of existing risk controls are\nconfirmed with relevant parties.\n6.3\nEffective hazard and incident reporting and investigation processes\nare confirmed on a continuing basis.\n\n--- PDF PAGE 40 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Approaches of OHS\nMay include:\n1.1\nthe establishment and maintenance of a healthy and safe\nlearning environment through:\n1.1.1 a consultative approach\n1.1.2 a systems approach\n1.2\nshared responsibilities for OHS\n1.3\ntrainer/facilitator familiarization with OHS requirements of the\nspecific learning environment\n\n2. OHS legal\nresponsibilities\nMay include:\n2.1\nrequirements under legislation relating to OHS and common\nlaw duty of care\n2.2\nlegislative requirements for consultation\n2.3\nrequirements under hazard-specific and other OHS\nregulations\n2.4\nlegislative requirements for reporting and record keeping\nrelated to OHS\n\n3. Various parties\nMay include:\n3.1\nmanagers/supervisors\n3.2\ndesignated person for OHS\n3.3\nemployee OHS representatives\n3.4\nother people with prior OHS knowledge, for example:\n3.4.1 trainers/facilitators and assessors\n3.4.2 program coordinators\n3.5\ntraining and/or assessment organization\n\n4. Organizational OHS\ndocumentation\nThe training organization and/or workplace in which the training\nservices take place, and may include:\n4.1\npolicies and procedures\n4.2\nincident reports\n4.3\nemergency procedures\n4.4\ninduction information\n4.5\nrisk assessment\n4.6\nsafety reports\n\n5. Sources of information\nMay include:\n5.1\nOHS regulatory authorities\n5.2\nindustry bodies\n5.3\nsubject and technical specialists including OHS professionals\n5.4\nhazard and injury reports from similar learning environments\n\n--- PDF PAGE 41 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n37\n\nVARIABLE\nRANGE\n6. Hierarchy of control\nThe preferred priority for risk control, emphasizing hazard elimination\nand, where this is not possible, risk minimization by such means as:\n6.1\nsubstitution with a lesser hazard\n6.2\nisolation of the hazard from people at risk\n6.3\nengineering controls\n6.4\nadministrative means (eg, safe work practices, procedures\nand training)\n6.5\nuse of personal protective equipment\n\n7. Supervisory\narrangements\nMay include:\n7.1\nLevel of knowledge\n7.2\nLevel of experience\n7.3\nrights, responsibilities and obligations of the various parties\n7.4\nthe code of conduct in the learning environment\n7.5\ntypes of potential hazardous events/emergencies and required\nresponses\n7.6\nhazards and their control in the learning environment,\nincluding the use and maintenance of personal protective\nequipment\n\n8. Appropriate\ninformation\nMay include:\n8.1\nsafe access and egress\n8.2\nwork procedures\n8.3\nfirst aid provisions\n8.4\narrangements in the learning environment for the\nmanagement of OHS, including:\n8.4.1 reporting procedures for hazards, incidents, injuries\nand faulty equipment\n8.4.2 processes to use when injury does occur\n8.4.3 policies and procedures, including staff handbooks\n\n--- PDF PAGE 42 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nIdentified OHS responsibilities\n1.2\nIdentified hazards in the learning environment\n1.3\nAssessed risks in the learning environment\n1.4\nDeveloped and implement actions to ensure the health safety\nand welfare of learners and/or candidates\n1.5\nProvided appropriate OHS requirements to learners and/or\ncandidates\n1.6\nMonitored OHS arrangements in the learning environment\n\n2. Underpinning\nknowledge and\nattitude\n2.1\nrelevant policies, legal requirements, codes of practice and\nnational, for example:\n2.1.1 legislative requirements for information and\nconsultation relevant to safety\n2.1.2 legislative requirements for record keeping related to\nOHS\n2.1.3 legislative requirements for safe workplaces\n2.2\nOHS roles and responsibilities of employers, the training/\ntrainers/facilitators, learners and/or candidates, managers and\nsupervisors\n2.3\nduty of care obligations for training and/or trainers/facilitators\n2.4\n hazards and risks in the specific industry where learning will\ntake place\n2.5\ncommon risk control strategies applicable to the industry\nwhere learning and/or will take place\n2.6\nbasics of a systematic approach to OHS\n2.7\nsources of information on OHS requirements relevant to the\nspecific industry where learning will take place\n2.8\norganizational OHS documentation including policies,\nprocedures and risk control strategies\n2.9\nhierarchy of control as it applies to risks encountered in the\nlearning environment\n2.10 knowledge of the learning environment sufficient to be able to\nidentify hazards and conduct simple risk assessment\n\n3. Underpinning skills\n3.1\nliteracy skills to:\n3.1.1 access a range of sources of OHS information\n3.1.2 read and understand OHS documentation\n3.1.3 interpret OHS legal requirements\n3.1.4 write hazard and incident reports\n3.1.5 contribute to the development of a risk control action\nplan (if required)\n\n--- PDF PAGE 43 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n39\n\n3.2\nlanguage skills to:\n3.2.1 communicate and consult with a range of people from\ndifferent levels and backgrounds\n3.2.2 listen and summarize key points, make evaluative\njudgments and articulate verbally\n3.3\ntechnology skills to:\n3.3.1 use computer hardware and relevant software\n3.3.2 use office/business equipment\n3.4\nresearch skills to access relevant OHS information\n3.5\nnegotiation skills\n\n4. Resource Implication\nThe following resources MUST be provided:\n4.1\naccess to resources and equipment to establish and maintain\nthe safety, health and welfare of the learner and/or candidate\n4.2\naccess to legislative and training organization documentation\non OHS\n\n5. Method of assessment\nCompetency must be assessed through :\n5.1\nDemonstration with questioning\n5.2\nCase Study/Situation\n5.3\nInterview\n5.4\nPortfolio Assessment\n\n6. Context for\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 44 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n40\n\nUNIT OF COMPETENCY :\nMAINTAIN AND ENHANCE PROFESSIONAL PRACTICE\n\nUNIT CODE\n:\n500232108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required for\nindividuals to manage their personal professional performance\nand to take responsibility for their professional development in\nrelation to the provision of training and services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Model high standards\nof performance\n1.1\nPersonal performance is consistent with the organization’s\ngoals and objectives.\n1.2\nAppropriate professional techniques and strategies are\nmodeled in accordance with existing organizational policies\nand guidelines.\n1.3\nPersonal work goals and plans reflect individual responsibilities\nand accountabilities in accordance with organizational/legal\nrequirements.\n1.4\nEthical and inclusive practices are applied in professional\npractice and in accordance with existing organizational policies\nand guidelines.\n\n2. Determine personal\ndevelopment needs\n2.1\nPersonal knowledge and skills are assessed against units of\ncompetency and other relevant benchmarks in accordance\nwith the development needs and priorities.\n2.2\nChanges in vocational education, training policy and operating\nenvironments are identified in accordance with the impact on\nprofessional practice and personal development needs.\n2.3\nFeedback from colleagues and clients is identified and used in\naccordance with personal learning needs/areas of professional\ndevelopment.\n2.4\nFuture career options are identified as appropriate.\n2.5\nPersonal learning needs are documented and updated in\naccordance with existing policies and procedures.\n2.6\nPersonal development needs are discussed with relevant\npersonnel for inclusion in accordance with the professional\ndevelopment plan.\n\n--- PDF PAGE 45 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n41\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Participate in\nprofessional\ndevelopment activities\n3.1\nDevelopment opportunities suitable to personal learning\nstyle/s are selected and used in accordance with continuous\nsupport of learning and maintenance of current professional\npractice/s.\n3.2\nProfessional networks are participated in accordance with\ncontinuous support of learning and maintenance of current\nprofessional practice/s.\n3.3\nOwn performance and professional competency is\ncontinuously improved through engagement in accordance\nwith professional development activities.\n3.4\nTechnology is used to maintain regular communication in\naccordance with relevant networks, organizations and\nindividuals.\n\n4. Reflect on and\nevaluate professional\npractice\n4.1\nDevelopments and trends impacting on professional practice\nare researched and integrated in accordance with work\nperformance.\n4.2\nFeedback from colleagues/clients is used to identify and\nintroduce improvements in accordance work performance.\n4.3\nInnovative and responsive approaches for improving\nprofessional practice are identified and used in accordance\nwith continuous support to improve techniques and\nprocesses.\n4.4\nRecords, reports and recommendations for improvement are\nmanaged in accordance with the organization’s systems and\nprocesses.\n\n--- PDF PAGE 46 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Organization’s goals\nand objectives\nMay include:\n1.1\nbusiness plan\n1.2\nstrategic plan\n1.3\noperational plan/s\n1.4\norganization’s code of conduct\n1.5\nflexibility and client responsiveness\n1.6\nclient satisfaction\n1.7\nfinancial performance\n1.8\npeople management\n1.9\nmarketing and client service\n1.10 quality and quality assurance\n\n2. Professional\ntechniques and\nstrategies\nMay include:\n2.1\ntechniques for initiating action and directing decision making\n2.2\nstrategies for presenting a confident and assured manner in\nchallenging situations\n2.3\nmaintaining ethical practice in the face of opposition\n2.4\nmodeling behavioral and personal presentation standards\n2.5\nmotivation strategies\n2.6\ntime management\n2.7\nstrategies for acknowledging and respecting the attitudes and\nbeliefs of others\n2.8\ntechniques for promoting active participation\n\n3. Organizational/legal\nrequirements\nMay include:\n3.1\ncustomer complaints, grievances and appeals\n3.2\nrisk identification and management, including OHS\n3.3\nquality and continuous improvement processes and\nstandards, including validation systems\n3.4\nfinancial management, including refund policies and systems\nto protect fees paid in advance (if appropriate)\n3.5\nrecognition of qualifications issued by other training\norganizations\n3.6\naccess and equity\n3.7\nclient selection, enrolment and induction/orientation\n3.8\nstaff recruitment, induction and ongoing development and\nmonitoring\n3.9\navailability of policies and procedures to all personnel and\nlearners/clients\n3.10 collaborative/partnership arrangements\n3.11 confidentiality and privacy requirements\n3.12 ethical standards\n\n--- PDF PAGE 47 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n43\n\nVARIABLE\nRANGE\n\n3.13 defined resource parameters\n3.14 administrative and records management system, for example:\n3.14.1 reporting/recording requirements and arrangements\n3.14.2 maintenance, retention, archiving, retrieval, storage\nand security of information\n3.14.3 document version control\n\n4. Ethical and inclusive\npractices\nMay include:\n4.1\ndemonstrating probity in all areas of responsibility\n4.2\nmodeling organizational/professional codes of conduct\n4.3\nreinforcing ethical conduct in interactions with and between\nother people\n4.4\nshowing respect for individual diversity, culture and religion\n4.5\nrecognizing and utilizing difference to develop both the\nindividual and the organization\n4.6\ndemonstrating sensitivity to the circumstances and\nbackground of others\n4.7\nfostering a culture of inclusiveness\n4.8\nnew/revised policy directions in vocational education and\ntraining\n\n5. Feedback\nMay include:\n5.1\nformal/informal performance appraisals\n5.2\nobtaining comments from supervisors and colleagues\n5.3\nobtaining comments from clients\n5.4\npersonal reflective behavior strategies\n5.5\nroutine organizational methods for monitoring service delivery\n\n6. Professional\ndevelopment plan\nMay include:\n6.1\nthe organization’s professional development plan for each\nindividual staff member, outlining:\n6.2\nwork and personal career objectives\n6.3\nidentified areas requiring development\n6.4\nlearning opportunities/activities\n6.5\nrelevant work activities/projects\n6.6\nlinks to organizational training needs profile\n\n7. Development\nopportunities\nMay include:\n7.1\nundertaking further higher education\n7.2\nundertaking professional development in specific areas of\npractice\n7.3\ninternal training/development programs\n7.4\nrelevant conferences, seminars and workshops\n7.5\nreading relevant journals and literature\n7.6\nnetworking with internal/external colleagues\n7.7\ncoaching and/or mentoring\n\n--- PDF PAGE 48 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n44\n\nVARIABLE\nRANGE\n8. Current professional\npractice/s\nMay include:\n8.1\nvocational competency and/or technical expertise in subject\nmatter\n8.2\nprofessional practice as a trainer/facilitator,\n\n9. Professional networks\nMay include:\n9.1\ninformal networks with:\n9.1.1 other trainers/facilitators\n9.1.2 people working in industry/vocational area\n9.1.3 contacts in vocational education and training\n9.2\nformal networks such as:\n9.2.1 local/ trainer networks\n9.2.2 interest and support groups\n9.2.3 regional, specialist and peak associations\n9.2.4 professional/occupation associations\n9.2.5 communities of practice\n\n10. Technology\nMay include:\n10.1 computer-based communication, e.g. email, Internet, Extranet\nand Intranet\n10.2 facsimile machines\n10.3 telephone\n10.4 video conferencing\n\n11. Developments and\ntrends\nMay include:\n11.1 new/revised Training Packages in vocational area of expertise\n11.2 legislative/regulatory changes in vocational area of\ncompetency\n11.3 new developments/directions/trends in vocational education\nand training\n11.4 policy changes in vocational education and training\n\n12. Continuous support to\nimprove techniques\nand processes\nMay include:\n12.1 limited and systemic evaluation\n12.2 records review and maintenance\n12.3 self-assessment\n12.4 strategic business/operational planning\n12.5 ongoing education and training\n12.6 team meetings and networking\n\n--- PDF PAGE 49 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n45\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nModeled high standards of performance\n1.2\nDetermined personal development needs\n1.3\nParticipated in professional development activities\n1.4\nReflected on and evaluate professional practice\n\n2. Underpinning\nknowledge and\nattitude\n2.1\norganizational goals/objectives\n2.2\norganizational processes, procedures and opportunities\nrelating to professional development\n2.3\na range of continuous improvement techniques and processes\nand their application\n2.4\nsocial and education trends and changes impacting on the\nvocational education and training environment, for example:\n2.4.1 policy changes\n2.4.2 technological changes\n2.4.3 cultural changes\n2.4.4 economical changes\n2.5\nnetworks relevant to professional practice\n2.6\nstandards/principles, ethnical/inclusive principles and\npractices\n2.7\ntypes and availability of training development activities and\nopportunities\n2.8\nrelevant policies, legislation, codes of practice and national\nstandards for example:\n2.8.1 Training Packages, competency standards, other\nrelevant benchmarks\n2.8.2 licensing requirements\n2.8.3 industry/workplace requirements\n2.8.4 duty of care under common law\n2.8.5 recording information and confidentiality requirements\n2.8.6 anti-discrimination including equal opportunity, racial\nvilification and disability discrimination\n2.8.7 workplace relations\n2.8.8 industrial awards/enterprise agreements\n2.8.9 National Reporting System\n2.9\nrelevant OHS knowledge relating to the work role/work\ncontext, and OHS when managing own professional practice\nand performance\n\n3. Underpinning skills\n3.1\nreflection skills to:\n3.1.1 systematically evaluate personal work practices to\nimprove performance or understanding\n3.1.2 reduce or prevent stress\n3.2\nleadership skills to present a professional image\n\n--- PDF PAGE 50 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n46\n\n3.3\nself-evaluation skills to:\n3.3.1 identify gaps in skills or knowledge\n3.3.2 obtain competencies to meet current and future\norganizational objectives\n3.4\nresearch skills to:\n3.4.1 keep up with trends in vocational education and\ntraining to obtain current information\n3.4.2 identify relevant industry affiliations\n3.4.3 keep up with trends/changes/developments in the\nvocational area of competency\n3.5\ncommunication skills to:\n3.5.1 obtain feedback from colleagues and clients\n3.5.2 participate in professional networks\n3.5.3 consult with colleagues and clients\n3.6\ninterpersonal skills to:\n3.6.1 participate in industry events and activities\n3.6.2 build professional relationships\n3.7\nnetworking skills to build an industry network\n3.8\nliteracy skills to:\n3.8.1 document personal learning needs\n3.8.2 read and interpret vocational education and training\ninformation such as legal/ organizational policy\ndocuments\n3.8.3 complete and maintain records related to professional\ndevelopment\n3.9\ntime management skills to:\n3.9.1 organize professional development activities\n3.9.2 analyze and identify career options\n3.9.3 create a balance between work, study, personal and\nrecreation activities\n\n4. Resource Implication\nThe following resources MUST be provided:\n4.1\nrelevant organizational/legal documentation\n4.2\naccess to relevant benchmarks\n4.3\naccess to networks, technology, communication\n\n5. Method of assessment\nCompetency must be assessed through :\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nWritten Test\n5.4\nThird Party Report\n\n6. Context for\nassessment\n\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 51 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n47\n\nUNIT OF COMPETENCY :\nDEVELOP AND PROMOTE APPRECIATION FOR COSTS\nAND BENEFITS OF TECHNICAL TRAINING\n\nUNIT CODE\n:\n500232109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required in estimating and\nevaluating costs and benefits of training, determining its cost-\neffectiveness and returns, and identifying, recommending and\nadvocating cost-efficient training practices\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study training cost\ncomponents\n1.1\nFeatures and benefits of training programs are identified and\nanalyzed based on financial and customer requirements\n1.2\nCost components are analyzed to determine those which\ndeliver the desired training features and benefits\n1.3\nWastages or excesses are determined for possible reduction\nor elimination\n\n2. Evaluate training costs\nand benefits\n2.1\nVariances in training performance and results are studied to\ndetermine good and bad practices\n2.2\nPlanned performance is compared with actual performance to\nidentify future enhancements in conduct of training\n2.3\nCost reduction and control measures that do not impact greatly\non training results are recommended\n2.4\nUsage of training resources is analyzed for optimization or\nreduction\n\n3. Monitor conduct and\nresults of training\n3.1\nSimple formative and summative evaluations of training are\ndone to evaluate achievement of learning outcomes\n3.2\nQuality training programs are monitored and\nnoted/documented for best practices and results replication\n3.3\nBenefits and returns on training investments are studied\nusing relevant data\n3.4\nCost-effective training programs are identified and\nrecommended for documentation, replication and further\nenhancement.\n\n4. Promote awareness of\ncosts and benefits of\ntraining\n4.1\nBenefits of training as investment rather than cost center are\nexplained and stressed to trainees, fellow trainers and\nadministrators where applicable\n4.2\nEconomy in use of training supplies and materials and care in\nuse of training equipment and facilities are stressed continually\n4.3\nModel/best practices in optimum and judicious use of training\nresources are documented, practiced and demonstrated\n\n--- PDF PAGE 52 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n48\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Benefits and returns on\ntraining investment\nMay include:\n1.1\nLong-term impact such as --\n1.1.1 Increased profitability of firm\n1.1.2 Industrial peace\n1.2\nImmediate results such as --\n1.2.1 Positive customer feedback\n1.2.2 Less product recalls/rejects\n1.2.3 Consistent/increasing school enrolment\n1.2.4 Higher absorption rate of graduates\n1.2.5 Lower drop-out rates\n1.2.6 Lower worker attrition rate\n\n2. Relevant training data\nMay include:\n2.1\nData from graduate tracer studies\n2.2\nEnrolment data\n2.3\nTrainee drop-out\n2.4\nTrainee learning evaluation\n2.5\nEmployment/absorption rate\n2.6\nReaction-level evaluation\n2.7\nTrainee skills certification rate\n2.8\nPer-capita training costs\n2.9\nSkill utilization rate\n\n--- PDF PAGE 53 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n49\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate –\n1.1\nDemonstrated ability to identify, estimate and evaluate training\ncost components\n1.2\nDemonstrated ability to assess training programs according to\ntheir cost-effectiveness and return on investment\n1.3\nDemonstrated ability to explain training costs and benefits and\nadvocate cost-effective training\n\n2. Underpinning\nknowledge and attitude\n2.1\nBasic arithmetic – four fundamental operations\n2.2\nBasic cost accounting and bookkeeping\n2.3\nBasic training methodology including training costs and\nbenefits\n2.4\nTraining system evaluation concepts\n2.5\nPositive work traits and values (attention to detail, persistence,\ncost-consciousness, safety- and time-consciousness, quality-\nconsciousness)\n\n3. Underpinning skills\n3.1\nCommunication skills\n3.2\nComputer literacy\n3.3\nComputational and accounting skills\n3.4\nObserving safety and health precautions\n3.5\nInstructional and facilitation skills\n\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to training and enrolment data, e. g., collection,\nexpenses, trainee performance data\n4.2\nAccess to an ongoing training program\n4.3\nCase problems in cost-effective training\n\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1\nCase problems\n5.2\nWritten exam\n5.3\nInterview\n5.4\nSubmission and presentation of written report or case study\n5.5\nPortfolio\n5.6\nThird-party report\n\n6. Context of assessment\nCompetency may be assessed on the job or in a simulated work\nenvironment\n\n--- PDF PAGE 54 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n50\n\nUNIT OF COMPETENCY :\nDEVELOP AND PROMOTE UNDERSTANDING OF GLOBAL\nLABOR MARKETS\n\nUNIT CODE\n:\n500232110\n\nUNIT DESCRIPTOR\n:\nThis unit describes the outcomes required in understanding,\nanalyzing and disseminating information on global labor-market\ntrends and concerns as they affect the TVET, labor and\nemployer sectors.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify current and\nfuture trends/concerns\n1.1\nRelevant and reliable sources of labor-market information\n(LMI) are identified and accessed based on needs\n1.2\nGlobal and local relevance of labor-market (LM) trends are\nstudied and analyzed for their implications in the labor and\ntraining market\n1.3\nRelevant events, including positions and interests of trainees,\nclients and training providers are studied and considered in the\ndesign and delivery of training\n\n2. Assess new\ndevelopments\n2.1\nEmerging issues of potential significance to the local and\nglobal labor markets are identified and studied\n2.2\nResearch findings are assessed for significance to the\ntechnical and vocational education and training (TVET) sector\n2.3\n Opportunities and risks of new developments are identified\nand assessed\n2.4\nViews of trainees, training providers and other stakeholders\nare identified and assessed for their potential benefit or impact\n2.5\nWhere necessary responses and strategies for LM threats\nand opportunities are developed in consultation with other\nTVET partners\n2.6\nNew and emerging concepts, technologies, products and\nprocesses are noted and evaluated based on their implications\nfor the TVET and labor market\n\n3. Utilize labor market\ninformation to best\neffect\n3.1\nAwareness of LM situation and related concerns are promoted\nthrough talks, lectures and other training opportunities\n3.2\nRelevant information on LM and new technologies are\nincorporated in the curriculum and during the training\n3.3\nMention/Presentations of LMI and trends are made during\nmeetings, fora and training situations using language and\ndelivery styles adapted to the audience\n3.4\nWhere necessary, responses and strategies to global labor-\nmarket developments are developed and recommended using\nanalytical tools and current LMI\n\n--- PDF PAGE 55 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. LMI sources\nMay include --\n1.1\nProfessional literature and journals\n1.2\nIndustry associations\n1.3\nResource persons\n1.4\nInternet sites, e. g., JobsDB\n1.5\nIndustry/trade meetings/conferences\n1.6\nTrade fairs\n1.7\nNetwork of contacts or key informants\n1.8\nStatistical reports\n1.9\nGovernment agencies, e. g., NSCB/NSO, DOLE (BLE, POEA,\nBLES)\n\n2. Responses and\nstrategies\nMay include --\n2.1\nRetraining\n2.2\nSearch for new markets and partners\n2.3\nSkills updating/upgrading\n2.4\nRefresher courses\n2.5\nUpdating of competency standards\n2.6\nCompetency assessment and certification\n2.7\nAdoption of new training methods and technologies\n2.8\nRedesign of training programs/courses\n\n3. Analytical tools\nMay include –\n3.1\nSWOT analysis\n3.2\nForce-field analysis\n3.3\nProblem/Objectives tree\n3.4\nFishbone/cause-and-effect diagram\n\n--- PDF PAGE 56 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n52\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate –\n1.1\nDemonstrated ability to understand and analyze global labor\nmarkets\n1.2\nDemonstrated ability to identify and take advantage of\nopportunities in the global LM\n1.3\nDemonstrated ability to respond to potential threats to TVET\narising from LM trends\n1.4\nDemonstrated ability to adapt technical training to global LM\ntrends\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nLabor-market paradigm\n2.1.1 Supply side – TVET providers and schools\ncommunities\n2.1.2 Demand side – employers (government and private\nsector)\n2.1.3 Labor requirements variations and seasonality in the\nLM\n2.2\nTVET sector knowledge – work regime, systems, technologies\nand unique aspects relevant to sector or geographic area\n2.3\nProfile of TVET sector stakeholders, opinion leaders and\nmajor players\n2.4\nLegislations and regulations that impact on the TVET sector\n2.5\nEvents and trends that have shaped the global labor market\nover time\n2.6\nTrends in customer expectations and buying patterns\n2.7\nPositive work values (proactiveness, practicality, results and\nservice orientation, quality-consciousness)\n\n3. Underpinning skills\n3.1\nResearching LMI\n3.2\nAnalyzing the relevance, accuracy and shortcomings of\ninformation\n3.3\nDiscerning trends, issues ands implications\n3.4\nAssessing threats and opportunities\n3.5\nCommunication and presentation skills\n\n4. Resource implications\nThe following resources MUST be provided –\n4.1\nTVET situationers and/or LMI research reports\n4.2\nCase problems\n\n5. Method of assessment\nCompetency may be assessed through –\n5.1\nInterview and oral questioning based on case problems\n5.2\nDemonstration with oral questioning of an oral presentation\nmade by the candidate\n5.3\nThird-party report\n5.4\nPortfolio (includes reports, recommendations, research and\ninformation relating to the global LM written by candidate)\n\n6. Context of assessment Assessment must be conducted in the workplace or a simulated\nwork environment\n\n--- PDF PAGE 57 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n53\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nCONDUCT TRAINING NEEDS ANALYSIS\n\nUNIT CODE\n:\nTVT232307\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\nundertake a training needs analysis to identify the training needs\nof individuals or organization.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop instruments\nfor TNA\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\n\nDiscussions are held with clients to identify objectives,\nexpectations and other requirements\nIssues to be addressed are identified and analyzed to\ndetermine impact on client objectives and requirements\nTNA respondents/target group is established based on the\nobjectives and requirements\nAppropriate method for collecting information and data on\ncurrent, emerging and future training needs is selected and\nresearch plan is developed and finalized with concerned\nperson/s\nTNA instruments are formulated following the prescribed\nformat\n\n2. Administer TNA\ninstrument\n2.1\n\n2.2\n\nOrientations regarding the study is conducted and TNA\ninstruments are disseminated to identified respondents\nFilled up TNA instruments are gathered in accordance with\nprocedures appropriate to the method selected\n\n3. Analyze TNA results\n3.1\n\n3.2\n\n3.3\n\n3.4\nInformation is analyzed using reliable and valid data analysis\nmethods to determine skills gaps that can be addressed\nthrough training or other intervention\nConclusions on training needs are prepared and supported by\nevidence and consistent with research objectives\nClients are provided with options for meeting identified training\nneeds\nReport is prepared and clients are provided with advice and\nrecommendations on training needs\n\n--- PDF PAGE 58 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n54\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clients\nClient include but not limited to:\n1.1\nInternal or external client\n1.2\nEnterprise\n1.3\nIndustry sector\n1.4\nProfessional association\n1.5\nCommunity organization\n1.6\nGovernment organization\n\n2. Objectives\nObjectives include but not limited to:\n2.1\nFocus on individual trainee objectives, such as new skills,\nspecific competencies, target qualifications, career\nadvancement\n2.2\nFocus on productivity improvement\n2.3\nFocus on administrative and records management system\n2.4\nFocus on satisfying legislative or government regulatory\nrequirements\n2.5\nInvolve specific learning support systems\n2.6\nReflect individualized organizational training and skill\nrequirements\n2.7\nBe affected by national policy and funding parameters\n\n3. Methods for collecting\ninformation\n3.1\nSurveys, interviews, discussions, focus groups\n3.2\nCritical incident technique\n3.3\nObservation of personnel at work\n3.4\nAccessing relevant legislation, policies and practices\n3.5\nAnalyzing industry/enterprise skills audit reports\n3.6\nAnalyzing human resource management records/performance\nmanagement records\n3.7\nReviewing industry publications or reports\n3.8\nConcept mapping\n3.9\nJob and task analysis\n3.10 Analyzing assessment or training records\n3.11 Job descriptions analysis\n3.12 Analyzing organizational policy\n3.13 Drive (motivation) pattern identity analysis\n\n4. Concerned person/s\n4.1\nClients\n4.2\nEmployees\n4.3\nGovernment agencies\n4.4\nManagers/supervisors\n4.5\nTraining and assessment coordinators\n4.6\nIndustry group/association\n4.7\nEmployer/employee representatives\n4.8\nExternal consultants\n\n--- PDF PAGE 59 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n55\n\nVARIABLE\nRANGE\n5. Data analysis methods\n5.1\nQualitative/quantitative analysis\n5.2\nFeedback on results\n5.3\nReview of previous research\n5.4\nPeers review\n5.5\nData sampling\n5.6\nStatistical analysis\n\n6. Options\n6.1\nDeveloping in-house capacity to meet identified needs\n6.2\nIdentifying training and/or assessment organizations\n6.3\nIdentifying specific units of competency, qualifications/courses\n6.4\nConsultancy services\n6.5\nTimelines\n6.6\nUrgency\n\n7. Advice and\nrecommendations\n7.1\nShort- and/or long-term recommendations\n7.2\nSpecified outcomes and strategies\n7.3\nResource requirements\n7.4\nProvision of training and/or assessment services\n7.5\nDesign and review of training programs\n7.6\nContextualization of competency standards to meet client\ngoals\n7.7\nAdministrative and management systems\n7.8\nPerformance management systems\n7.9\nTraining and professional development principles\n7.10 Reporting and accountability requirements and processes\n\n--- PDF PAGE 60 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n56\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified objectives, expectations and other requirements for\nconducting the study\n1.2\nIdentified appropriate study method and developed\ninstruments for TNA\n1.3\nGathered data and analyzed information using valid analysis\nmethod\n1.4\nPrepared report with recommendations\n\n2. Underpinning\nknowledge\n2.1\nCompetency standards and training packages/courses\navailable\n2.2\nIndustry and enterprise knowledge\n2.2.1 relevant assessment and training strategies\n2.2.2 clients organization’s culture and expectations\n2.2.3 underpinning knowledge and skills to be required in the\nindustry\n2.2.4 changes likely to impact on the industry/sector and\ntraining implications of the changes\n2.3\nRange of evaluation and research methodologies (literature\nresearch, job/ task analysis, interview techniques, etc)\n2.4\nPrinciples of intellectual property\n2.4.1 ways to give credit when using other’s ideas or work\n2.4.2 training and development strategies\n2.5\nData retrieval and interpretation system (training needs\nanalysis, functional analysis)\n2.6\nPolicy, legislations, codes of practice and competency\nstandards\n2.7\nStatistical analysis\n\n3. Underpinning skills\n3.1\nResearch skills\n3.2\nLiteracy skills\n3.3\nIntegrative skills\n3.4\nObservation skills\n3.5\nCommunication skills\n3.6\nInterpersonal skills\n3.7\nNumerical skills\n3.8\nNegotiation and facilitation skills\n3.9\nProblem-solving skills\n3.10 Applying approaches to analyze issues/ concerns\n3.11 Using audio/video equipment and computer\n\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nfacilities and equipment relevant to the activity\n4.2\nresources and materials relevant to the activity\n4.3\ntime to accomplish the activity\n\n5. Method of assessment\nCompetency may be assessed through:\n5.1\ninterview\n5.2\nwritten exam\n5.3\nthird party report\n5.4\nportfolio\n5.5\nwork sample\n\n6. Context for assessment Competency may be assessed individually in the actual workplace or\nthrough accredited institution\n\n--- PDF PAGE 61 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n57\n\nUNIT OF COMPETENCY :\nDEVELOP TRAINING CURRICULUM\n\nUNIT CODE\n:\nTVT232308\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ndevelop, modify/customize training curriculum. It includes\nestablishing training requirements, identifying the learner,\ndeveloping, modifying, customizing and finalizing training\ncurriculum.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish training need\nrequirements\n1.1\nStakeholders are identified and consulted to establish\ntraining aims and requirements\n1.2\nTraining requirements are identified using appropriate\nmethods and sources.\n1.3\nTraining Regulations or other relevant specifications on\nwhich to base the learning program are identified, accessed\nand confirmed\n1.4\nPotential employment markets and career opportunities for\ntraining participants are recorded and documented\n2. Identify the learner\nprofile\n2.1\nPotential learners are identified\n2.2\nProfiles of learners on entry to the course are developed\n2.3\nLanguage and literacy requirements of the learner are\ndetermined according to profiles\n3. Develop course design 3.1\nCompetency standard is analyzed\n3.2\nUnits of competency and modules are clearly identified\n3.3\nThe relationship between units of competence/modules and\noutcomes is documented\n3.4\nCourse entry and exit points are linked to occupational and\neducational opportunities\n3.5\nPrerequisites for the course and for specific units/modules\nwithin the course are identified and documented\n3.6\nThe delivery strategies and assessment methods are\ndetermined\n3.7\nTrainers qualification to implement the course is specified\n4. Develop training\ncurriculum modules\n4.1\nCompetency standards/other relevant specifications are\nanalyzed and interpreted to determine specific learning\nobjectives/outcomes/goals\n4.2\nCompetencies to be acquired by the leaner are clearly\nspecified\n4.3\nModules of instructions are developed/ modified according\nto needs and procedures.\n4.4\nLearning outcomes and assessment criteria are established\naccording to procedures\n4.5\nResources required to support the training curriculum are\nidentified.\n4.6\nTraining curriculum is designed based on the requirements of\nthe competency standards\n5. Finalize training\ncurriculum\n\n5.1\nTraining curriculum is validated with other persons\n5.2\nFinalized curriculum document is submitted to appropriate\npersonnel\n\n--- PDF PAGE 62 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stakeholders\n\nIncludes but not limited to:\n1.1\nprofessional associations\n1.2\nemployer associations\n1.3\npotential learners\n1.4\ntrainers/teachers\n1.5\nregulatory authorities\n1.6\npartner organizations\n1.7\nenterprise(s)/organization(s)\n1.8\nindustry training advisory bodies\n1.9\nindustry sector\n1.10 government bodies\n1.11 community sector.\n2. Training aims\nIncludes but not limited to:\n2.1\ndeveloping vocational competency/vocational skills\n2.2\ndeveloping generic skills\n2.3\ndeveloping general education\n2.4\nachieving organizational change\n2.5\nsupporting organizational skill development\n2.6\nfor professional development purposes\n2.7\ndeveloping teams\n2.8\nmeeting new legislation, licensing or registration requirements\n2.9\nmeeting regulatory and occupational health and safety (OHS)\nrequirements\n2.10 meeting funding body requirements\n3. Training requirements\n\nIncludes but not limited to:\n3.1\ntrainees’ entry requirements\n3.1.1\npre requisite competencies\n3.1.2\naccess to the workplace\n3.2\nindividual learning styles\n3.3\ntraining methodology\n3.4\ntraining materials and supplies\n3.4.1\ntraining references (books, manuals, multimedia training\naids, etc.)\n3.5\ntraining facility, tools, and equipment\n3.6\ntrainers’ qualifications\n3.7\nassessment methods\n4. Potential learners\nIncludes but not limited to:\n4.1\nexisting industry/enterprise employees\n4.2\nschool leavers/OSY\n4.3\nnew entrants to the workforce\n4.4\napprentices/trainees\n4.5\nindividuals learning new skills/knowledge\n4.6\nindividuals seeking to upgrade skills/knowledge\n4.7\nindividuals changing careers\n4.8\nunemployed\n4.9\nlearners who have a disability\n4.10\nindividuals/groups meeting licensing or other regulatory\nrequirements\n5. Units of competency\n\nIncludes but not limited to:\n5.1\nBasic competency\n5.2\nCommon competency\n5.3\nCore competency\n5.4\nElective competency\n6. Delivery strategies\nIncludes but not limited to:\n6.1\nthe focus of delivery :\n6.1.1\ngroups of varying sizes\n6.1.2\ngroups from single context/from multiple contexts\n6.1.3\ngroups of similar educational/competency levels/groups with\ndivergent educational/competency backgrounds\n6.1.4\non individuals\n\n--- PDF PAGE 63 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n59\nVARIABLE\nRANGE\n\nIncludes but not limited to:\n6.2\nthe focus of delivery :\n6.2.1\ngroups of varying sizes\n6.2.2\ngroups from single context/from multiple contexts\n6.2.3\ngroups of similar educational/competency levels/groups with\ndivergent educational/competency backgrounds\n6.2.4\non individuals\n6.3\nthe context of delivery:\n6.3.1\nin the workplace - work in situation\n6.3.2\nin a simulated work environments\n6.3.3\nin the training room/classroom\n6.3.4\nin specialist environments - e.g. laboratory/ computer room\n6.3.5\nin a community setting\n6.4\nthe mode of delivery:\n6.4.1\nface-to-face\n6.4.2\ntechnology-based electronic/computer-based/\nonline/audiovisual\n6.4.3\nexperiential\n6.4.4\ndistance resource-based\n6.4.5\nblended\n6.5\ndelivery methods:\n6.5.1\nlock step/learner-paced/mixed\n6.5.2\ninteractive/participative/collaborative\n6.5.3\nlearner-centered\n6.5.4\ndemonstration instruction\n6.5.5\npresentations\n6.5.6\nguided facilitation\n6.5.7\nguided activities/applications/experiences\n6.5.8\ntutoring\n6.5.9\nproject-based\n6.5.10 individual facilitation techniques - coaching/ mentoring\n6.5.11 blended delivery methods\n7. Assessment methods\nIncludes but not limited to:\n7.1\ndirect observation of real work/real time activities or\n7.2\nwork activities in a simulated work environment\n7.3\nstructured activities (e.g. simulation exercises, projects,\ndemonstration, activity sheets)\n7.4\nquestioning (e.g. computer, oral, written questions)\n7.5\nportfolios (collections of evidence compiled by the candidate\n7.6\nthird party feedback\n8. esources\nIncludes but not limited to:\n8.1\nTraining regulation/competency standards\n8.2\nJob specifications\n8.3\nDCAUM sheet\n8.4\ntraining equipment tools and supplies\n8.5\ninstructional materials\n9. Other persons\nIncludes but not limited to:\n9.1\nColleagues\n9.2\ntrainers/facilitators\n9.3\nindustry contacts\n9.4\nvendors\n9.5\nHR personnel\n9.6\nmarketing personnel\n9.7\nend users\n9.8\nsubject or technical specialists, including OHS\n9.9\nlanguage, literacy and numeracy specialists\n10. Appropriate personnel\nIncludes but not limited to:\n10.1 program manager\n10.2 head of department\n10.3 senior teacher\n10.4 apprenticeship/traineeship supervisor\n10.5 training coordinator/manager\n10.6 HR manager\n\n--- PDF PAGE 64 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n60\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nIdentified training regulations appropriate for the course to be\ndeveloped\n1.2\nDeveloped learners profiles and identified potential learners\n1.3\nDeveloped course design\n1.4\nAnalyzed and interpreted competency standards and\ndeveloped curriculum modules/ learning outcomes\n1.5\nValidated training curriculum with other persons\n1.6\nFinalized training curriculum and submitted to appropriate\npersonnel\n\n2. Underpinning\nKnowledge\n2.1\nKnowledge of Training regulations\n2.1.1 Competency standards\n2.1.2 Training standards\n2.2\nKnowledge of learning principles:\n2.2.1 training needs to be learner-centered\n2.2.2 adults have a need to be self-directing and decide for\nthemselves what they want to learn\n2.2.3 adults have a range of life experience, so connecting\nlearning to experience is meaningful\n2.2.4 adults have a need to know why they are learning\nsomething\n2.3\nKnowledge of adult learning theory:\n2.3.1 behavioral learning theory\n2.3.2 cognitive learning theory\n2.3.3 information processing theory\n2.3.4 andragogy\n2.4\nLearners profile, learner target group characteristics\n2.5\nLearning styles that best suit the learner profile/target group:\n2.5.1 theorist\n2.5.2 pragmatist\n2.5.3 activist\n2.5.4 reflector\n2.5.5 kinaesthetic\n2.5.6 auditory\n2.5.7 visual\n2.6\nKnowledge of competency –based curriculum development\nprocedures\n2.7\nDesign options for training program design/structure\n2.8\nTypes of different relevant learning resources, learning\nmaterials and pre-developed learning activities\n2.9\nHow to develop and document new learning activities and\nrelated learning materials\n2.10 Different delivery modes and delivery methods for :\n2.11 Different assessment methods\n2.12 Relevant policies, legal requirements, codes of practice and\nnational standards\n2.13 Relevant OHS and other job roles\n2.14 Evaluation and feedback methods\n\n--- PDF PAGE 65 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n61\n\n3. Underpinning Skills\n\n3.1\nCommunication skills\n3.1.1 negotiation skills\n3.1.2 ability to elicit information\n3.1.3 questioning skills\n3.1.4 listening skills\n3.1.5\ncollaboration skill\n3.2\nAnalysis skills\n3.2.1 interpret information about learners' needs from\nenrolment forms and other documentation\n3.2.2 interpret requirements of competency standards and\nworkplaces, including language, literacy and numeracy\n3.2.3\ndevelop the learning program content\n3.3\nOrganizational skills\n3.4\nTime management skills\n3.5\nDesigning training program structure\n3.6\nReviewing training program\n3.7\nPreparation of Reports\n\n4. Resource Implications\nThe following resources MUST be provided\n4.1\nAccess to stakeholders\n4.2\nAccess to research and training environment\n4.3\nAccess to training regulations/competency standards and other\nrelevant specifications\n4.4\nAccess to appropriate tools and equipment and materials and\nother resources\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n\n6. Context for\nAssessment\nAssessment should be conducted in the workplace / simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 66 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n62\n\nUNIT OF COMPETENCY :\nDEVELOP LEARNING MATERIALS\n\nUNIT CODE\n:\nTVT232309\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ndevelop training materials including print, mock-up/simulator\nand models. This include research and interpret the learning\nmaterial requirements, design the learning material and plan the\ncontent, develop the learning material content, review learning\nmaterial prior to implementation, evaluate the design and\ndevelopment process of instructional materials.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Analyze the learning\nmaterials requirements\n1.1\nThe brief, focus and type of learning materials is clarified\nwith the client\n1.2\nThe likely target audience/s, their learning needs and the\nlearning environment for the resource are researched\n1.3\nCharacteristics of the learners/end users of the learning\nresource are identified\n1.4\nExisting information which may be relevant is gathered,\ncollated and analyzed\n1.5\nEthical and legal considerations are identified and acted\nupon\n1.6\nA development work plan is written and documented\n1.7\nBroad time frames, possible costs and logistics of the learning\nmaterials are considered\n\n2. Design the learning\nmaterials\n2.1\nA range of design options is generated using a variety of\nprinciples and techniques\n2.2\nDesign concepts are established, taking into consideration\nprocess, material, quantity, cost and outcome requirement\n2.3\nTime is taken to reflect on the designs, identifying the\nimplications of each\n2.4\nThe diversity of learners/end users and their learning styles\nare researched and embedded into the design specifications\n2.5\nAn outline or prototype for the learning resource is\ndeveloped and confirmed with the client\n2.6\nRelevant personnel are identified to support the development\nphase, if needed\n\n3. Develop the content of\nthe learning materials\n3.1\nContent and content specification is developed in accordance\nwith the agreed design\n3.2\nThe learning materials content is broken into manageable\nchunks/segments of learning and sequenced according to\nlearning principles and techniques\n3.3\nExisting learning materials are accessed and modified\n/customized to suit the learning purposes and audience\n3.4\nNew, relevant and engaging learning activities and related\nlearning materials are developed and documented, based on\napplication of learning principles\n\n--- PDF PAGE 67 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n63\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n\n3.5 Text is clear, concise, grammatically correct and appropriate for\nthe intended audience/s\n3.6\nThe resource is formatted using an appropriate style guide\n3.7\nVisuals are relevant, instructive and appropriate for the\nintended audience/s\n3.8\nMechanisms for reviewing work in progress are established\n3.9\nModifications are made to the design and/or content, to\naddress changes in project parameters\n3.10 Prototype systems and components are developed in\naccordance with the agreed design\n3.11 Mock-up /simulator’s plan and specification is developed and\nconfirmed with the client\n3.12 Relevant personnel are identified to support the development\nphase, if needed\n3.13 Manual for prototype, model/simulator is developed\n\n4. Review/test learning\nmaterials\n4.1\nContent of the developed materials is checked against content\nspecifications\n4.2\nText, format and visual design are checked for clarity and\nfocus\n4.3\nRelevant personnel are identified and support is sought for the\nreview and validation\n4.4\nAn external review is conducted using appropriate methods,\nand feedback is incorporated\n4.5\nFinal draft is reviewed against the brief and other relevant\ncriteria prior to delivery to the client\n\n5. Evaluate the design\nand development\nprocess\n5.1\nThe design and development process is reviewed against\nappropriate evaluation criteria\n5.2\nTime is taken to reflect and identify areas for improvement\n5.3\nIdentified improvements are documented for future projects\n\n--- PDF PAGE 68 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n64\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Brief, focus and type of\nlearning materials\n\nIncludes but not limited to:\n1.1\nClient proposal\n1.2\nIdentified gap in training\n1.3\nA tender\n1.4\nAn organizational needs\n2. Likely target\naudience/s and\nlearning environment\n\nIncludes but not limited to:\n2.1\nWho the learning material is for\n2.2\nWhat the learning materials is designed to do\n2.3\nHow the learning materials will be used\n2.4\nWhere the learning materials will be used\n2.5\nPossible mediums to be used\n2.6\nDisinfecting tools and equipment\n3. Research\nMay include:\n3.1\nInterview\n3.2\nFocus groups\n3.3\nInformal discussion\n3.4\nLiterature reviews\n3.5\nInternet research\n3.6\nEvaluation of existing products\n3.7\nQuestionnaires\n3.8\nWorkshops\n4. Characteristics of the\nlearners/end users\n\nIncludes but not limited to:\n4.1\nLevel of prior experience/ knowledge of content area\n4.2\nSkill/competency profile\n4.3\nRange and response to previous learning experiences\n4.4\nLevel of education\n4.5\nSocio-economic background, age, gender\n4.6\nCurrent work\n4.7\nWork culture\n4.8\nCultural and ethnic background\n4.9\nDisability or learning support needs\n4.10 Prepared learning style\n4.11 Motivation for learning\n5. Existing information\nMay include:\n5.1\nIndustry/users needs\n5.2\nIndustry best practice and culture\n5.3\nExisting learning materials\n5.4\nRelevant training regulation/competency standards\n5.5\nRelevant courses, curriculum, modules\n5.6\nWorkplace procedures, documentation, and requirements\n5.7\nIndustry coverage\n5.8\nRoles and responsibilities of groups and individuals\n5.9\nInformation from industry experts and advisers\n\n--- PDF PAGE 69 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n65\n\nVARIABLE\nRANGE\n6. Ethical and legal\nconsiderations\nMay include:\n6.1\nContract preparation\n6.2\nMeeting contact requirements\n6.3\nIntellectual property\n6.4\nRegulatory requirements including occupational health and\nsafety (OHS)\n6.5\nOrganizational requirements\n6.6\nEquity issues and needs\n6.7\nPotential legal consequences of false, misleading or incorrect\ninformation\n7. Development work\nplan\nMay include:\n7.1\nTimelines and milestones to be achieved\n7.2\nScheduled meetings and focus group\n7.3\nConsultative process\n7.4\nHandover requirements\n7.5\nEquipment, learning resources, and learning materials needed\n7.6\nIndustry information/practices\n7.7\nBudget\n7.8\nIdentification of risk/risk management strategies\n7.9\nOrganization/industrial policies\n7.10 Access to experts/advisers\n8. Design options\n8.1\nuse and extent of practical activity-based content and passive\ncontent (reading, interpreting and absorbing information\n8.2\nuse and extent of text-based information and graphical\ninformation\n8.3\nlevel of depth of text-based information and sophistication of\nlanguage\n8.4\n options for presenting text-based information e.g. straight text,\nquestion and answer, case studies\n8.5\nVisual design\n8.6\nSequencing material\n8.7\nSources for further information/further reading\n8.8\nStyle guides\n8.9\nVisual look\n9. Learning style\nMay include:\n9.1\nTheoretical\n9.2\nPragmatic\n9.3\nActive\n9.4\nReflective\n9.5\nKinaesthetic\n9.6\nAuditory\n9.7\nvisual\n10. Outline or prototype\nMay include:\n10.1 Framework\n10.2 Format specifications\n10.3 Mock-up\n10.4 Model/simulator\n\n--- PDF PAGE 70 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n66\n\nVARIABLE\nRANGE\n11. Relevant personnel\n11.1 Subject matter/technical experts\n11.2 Industry experts\n11.3 Colleagues\n11.4 Learners or users\n11.5 Industry stakeholders\n11.6 Specialist consultants, e.g. language, literacy and numeracy\nspecialists\n12. Learning materials\nMay include :\n12.1 Print Learning package\n12.1.1 learner/user guides\n12.1.2 trainer/facilitator guides\n12.1.3 training guides\n12.1.4 example training programs\n12.1.5 specific case studies\n12.1.6 professional development materials\n12.1.7 assessment materials\n12.2 Other published, commercially available support materials for\nTraining Packages/courses\n12.3 organizational learning resources\n12.4 references and texts\n12.5 manuals\n12.6 record/log books\n13. Mechanism\nMay include:\n13.1 Verbal or written communication with relevant personnel\n13.2 Verbal or written communication with content experts\n13.3 Project updates\n13.4 Internal/external reviews of drafts\n14. Methods, and\nfeedback\nMay include:\n14.1 evaluation by experts\n14.2 pilot\n14.3 focus groups\n14.4 Questionnaires\n14.5 Checklists\n14.6 Workshops\n14.7 telephone interview\n15. Evaluation criteria\nMay include:\n15.1 meeting the brief\n15.2 satisfaction of the client\n15.3 timeliness\n15.4 cost\n15.5 design issues/modifications required\n15.6 blockages and responses\n15.7 team effectiveness/cohesion\n15.8 level of expertise required/available\n\n--- PDF PAGE 71 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n67\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nAnalyzed leaning materials requirements\n1.2\nDesigned and planned learning materials contents\n1.3\nDeveloped learning materials contents and prototype\n1.4\nReviewed and finalized learning materials\n1.5\nEvaluated design and development process\n\n2\nUnderpinning\nKnowledge\n2.1\nSound knowledge of the vocational education and training\nsystem:\n2.1.1 relevant terminology\n2.1.2 training and assessment processes\n2.1.3 Training regulation and competency standards\n2.1.4 Philippine TVET Qualification Framework ( PTQF)\nrequirements\n2.2\nInstructional design :\n2.2.1 planning, analysis, development, synthesis, evaluation\n2.2.2 presenting material in a logical order and sequence\n2.2.3 opportunities for collaborative learning between\nlearners\n2.2.4 navigation tools\n2.2.5 presenting material in order of increasing difficulty\n2.2.6 opportunities for review of material and repetition\n2.2.7 the need for learner activity and interactivity\n2.2.8 inclusion of a variety of approaches and techniques for\npresenting information and activities and for\nencouraging participation by learning\n2.2.9 structure of the information\n2.2.10 ensure learning is embedded in a realistic and relevant\ncontext\n2.2.11 techniques to engage the learner in learning\n2.3\nVisual design principles/techniques:\n2.3.1 format\n2.3.2 composition\n2.3.3 balance\n2.3.4 typography\n2.3.5 images/graphics charts/diagrams\n2.4\nResearch and evaluation techniques:\n2.4.1 interviews\n2.4.2 focus groups\n2.4.3 workshops\n2.4.4 questionnaires\n2.4.5 literature reviews\n2.4.6 web research\n2.4.7 pilot processes\n\n--- PDF PAGE 72 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n68\n\n2.5\nGeneral knowledge of the main branches of learning theory:\n2.5.1 behavioural learning theory\n2.5.2 information processing theory\n2.5.3 cognitive learning theory\n2.5.4 andragogy\n2.5.5 vocational education and training pedagogy\n2.6\nLearning principles:\n2.6.1 adults are autonomous and self-directed\n2.6.2 adults have life experience to draw on\n2.6.3 adults are goal-oriented\n2.6.4 adults need relevance\n2.6.5 adults are practical\n2.6.6 adults need to be shown respect\n2.7\nCultural awareness\n2.8\nA range of learning approaches and styles of learning\nresources\n2.9\nDifferent learning styles,:\n2.9.1 activist\n2.9.2 reflector\n2.9.3 theorist\n2.9.4 pragmatist\n2.9.5 kinaesthetic\n2.9.6 auditory\n2.9.7 visual\n2.10 Relevant policy, legislation, codes of practice and national\nstandards including Commonwealth and state/territory\nlegislation, for example:\n2.10.1 Copyright and privacy laws relating to electronic\ntechnology\n2.10.2 security of information\n2.10.3 plagiarism\n2.10.4 competency standards\n2.10.5 licensing\n2.10.6 industry/workplace requirements\n2.10.7 duty of care under common law\n2.10.8 anti-discrimination including equal opportunity, racial\nvilification and disability discrimination\n2.10.9 workplace relations\n2.10.10 industrial awards/enterprise agreements\n2.11 Relevant OHS knowledge relating to the work role, and OHS\nprocedures which need to be included in the content of the\nlearning resource\n2.12 OHS obligations of the training and/or assessment\norganization, the trainer/facilitator and learner\n\n--- PDF PAGE 73 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n69\n\n3. Underpinning Skills\n\n3.1\nReview and analysis skills to:\n3.1.1 identify areas for improvement\n3.1.2 recognize personal limitations\n3.2\nCommunication and interpersonal skills to:\n3.2.1 collaborate with a range of people\n3.2.2 seek feedback from others\n3.2.3 be open to feedback and suggestions\n3.2.4 maintain a network\n3.2.5 listen\n3.2.6 negotiate\n3.3\nComputer/technical skills, for example:\n3.3.1 using a range of software programs\n3.3.2 using a range of office equipment\n3.4\nLiteracy/writing skills, including:\n3.4.1 writing from the learner's perspective\n3.4.2 writing for different audiences\n3.4.3 using plain English and correct grammar\n3.4.4 pitching writing to the appropriate level\n3.4.5 using an appropriate style\n3.4.6 having an eye for detail\n3.5\nTime management skills, including keeping to appropriate\ntimelines\n3.6\nAnalytical skills to:\n3.6.1 identify critical learning points\n3.6.2 structure and weight the contents appropriately\n3.6.3 determine appropriateness of feedback\n3.7\nAbility to develop a range of learning activities\n3.8\nResearch skills to:\n3.8.1 find content and relevant information\n3.8.2 interview relevant people\n3.8.3 solve problems\n3.8.4 ask questions\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to learning environment\n4.2\nAccess to appropriate tools and equipment and materials\n4.3\nResearch for content of learning materials\n4.4\nAccess to experts for review and consultation\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n\n6. Context for\nAssessment\nAssessment should be conducted in the workplace/ simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 74 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n70\nUNIT OF COMPETENCY :\nDEVELOP COMPETENCY ASSESSMENT TOOLS\n\nUNIT CODE\n:\nTVT232310\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ndeveloping assessment tools. It details the requirements for\ndetermining evidence requirements, selecting appropriate\nassessment\nmethods,\npreparing\nassessment\ntools,\nand\nvalidating assessment tools in accordance with the relevant\nAssessment Guidelines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish evidence\nrequirements\n\n1.1\nCompetency standards are identified which describe the work\nactivities to be assessed.\n1.2\nRelevant unit(s) of competency are read and interpreted to\nidentify the required evidence.\n1.3\nEvidence requirements are identified which show full coverage\nand consistent performance of the relevant work activities.\n\n2. Establish suitable\nassessment methods\n\n2.1\nSuitable assessment methods are identified that are\nconsistent with the evidence requirements and the advice\nprovided in the Evidence Guide and relevant Assessment\nGuidelines.\n2.2\nAssessment methods are selected which are appropriate for\nthe competency being assessed, and in line with the purpose\nand assessment context.\n\n3. Prepare assessment\ntools\n\n3.1\nAssessment tools are prepared in accordance with the advice\nprovided in the relevant Assessment Guidelines.\n3.2\nClear and concise written instructions and materials are\nprepared for the assessor and the candidate which accurately\ndescribe the assessment activity.\n3.3\nAssessment tools are checked for validity, fairness, safety and\ncost effectiveness.\n\n4. Validate assessment\ntools\n4.1\nDraft assessment tools are checked against evaluation\ncriteria and amended, when necessary\n4.2\nAssessment tools are pilot tested with a small sample of\nassessors and industry practitioners.\n4.3\nInformation gathered through the validation are analyzed to\nestablish any changes that maybe required.\n4.4\nAssessment tools are finalized incorporating suggested\nchanges as appropriate.\n\n--- PDF PAGE 75 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n71\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Required evidence\nIncludes but not limited to:\n1.1\nDirect evidence\n1.1.1 Actual demonstration\n1.1.2 Actual product\n1.2\nIndirect evidence\n1.2.1 Video presentation\n1.2.2 Photographs\n\n2. Assessment Methods\nIncludes but not limited to:\n2.1\nWritten Test\n2.2\nInterview\n2.3\nPortfolio\n2.4\nObservation/Demonstration\n\n3. Purpose and Context of\nassessment\nAssessment is carried out in order to:\n3.1\nCertify that an individual has achieved competency\n3.2\nRecruit and select trainees for a job\n3.3\nMonitor individual performance at work\n3.4\nDetermine training needs\n3.5\nConduct skills audit\n3.6\nRecognize prior learning\n3.7\nClassify a person against industry or enterprise standards\n3.8\nProvide feedback on progress during training\n\n4. Evaluation criteria\nMay include:\n4.1\neffectiveness and relevance to the competency standards\n4.2\nwhether the assessment tool meets the principles of\nassessment\n4.3\nwhether the assessment tool meets the rules of evidence\n4.4\nwhether the assessment tool is appropriate to selected\nassessment methods\n4.5\nwhether the assessment tool is appropriate to the target\ngroup/assessment context\n4.6\nwhether the assessment tool provides guidance on reasonable\nadjustments\n4.7\nwhether the assessment tool enables the candidate to\ndemonstrate current competency\n4.8\nlevel of engagement and direct participation of candidates\n4.9\nappropriateness of language and literacy used for intended\naudience\n\n--- PDF PAGE 76 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n72\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified required evidence.\n1.2\nIdentified assessment methods.\n1.3\nDeveloped assessment tools.\n1.4\nUpdated evidence requirements, assessment method and\ntools.\n1.5\nPromulgated and deployed assessment tools according to\napproved guidelines.\n\n2. Underpinning\nKnowledge\n\n2.1\nhow to interpret competency standards, including components\nof competency and dimensions of competency\n2.2\nKnowledge on the types of evidence and rules of evidence.\n2.3\nKnowledge on the competency to be assessed.\n2.4\nKnowledge on the range of assessment purposes and contexts\nand the implications of these for the person being assessed.\n2.5\nKnowledge of different types of assessment methods, their\nsuitability for gathering various types of evidence.\n2.6\nPrinciple of reasonable adjustment\n2.7\nKnowledge on the different types of assessment tools\n2.8\nKnowledge on any legal or ethical responsibilities associated\nwith the assessment system and assessment procedures such\nas licensing requirements, equal employment opportunity,\ndisability discrimination and occupational health and safety.\n2.9\nKnowledge of validation process.\n\n3. Underpinning Skills\n\n3.1\nCommunication skills\n3.2\nTechnical writing\n\n3.3\nAbility to design assessment tools/method\n3.4\nAbility to conduct validation\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to assessment tools to be customized to suit needs of\na particular audience or context.\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPractical exercise involving design of assessment tools.\n5.2\nInterview\n\n6. Context of Assessment 6.1\nOn-the-Job\n6.2\nSimulated workplace\n\n--- PDF PAGE 77 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n73\nUNIT OF COMPETENCY :\nDESIGN AND DEVELOP MAINTENANCE SYSTEMS\nUNIT CODE\n:\nTVT232311\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and attitudes required to design and\ndevelop maintenance system applicable to diverse training\nfacilities.\nit\ninclude\nverifying\nmaintenance\nrequirements,\nresearching\nand\nplanning\nfor\nfacility\nand\nequipment\nmaintenance, establishing of maintenance systems, developing\nmaintenance procedure, researches and plan facility and\nequipment maintenance, and establish systems for audit and\nreview of the systems and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Verify maintenance\nrequirements\n1.1\nApplicable Occupational Health and Safety (OHS),\nlegislative and organizational requirements relevant to\norganizing maintenance programs are identified and complied\nwith\n1.2\nFacility and Equipment specifications, service requirements\nand workplace procedures are checked for recommended\nmaintenance intervals and processes\n1.3\nSpecial requirements for maintenance are separated from\nroutine /day-to- day maintenance schedules\n1.4\nComparisons with previous maintenance, intended equipment\nuse, training requirements and standard operating procedures\nare made\n1.5\nAn outline plan for maintenance and a related work schedule\nare specified and developed\n1.6\nCommunication with others is established and maintained in\naccordance with OHS requirements\n\n2. Research and plan for\nfacility and equipment\nmaintenance\n2.1\nWork requirements are identified and clarified /confirmed with\nappropriate parties or by site inspection\n2.2\nRelevant codes and standards, are identified and monitored\nthroughout the work procedure\n2.3\nResources and service providers Identified, obtained and\ninspected in compliance with work plan and job specifications\n2.4\nRelevant plans, drawings and text are selected and interpreted\nin accordance with the work plan\n2.5\nPlan maintenance in detail including sequencing, prioritizing\nand considerations made where appropriate for the\nmaintenance of safety, security and capacity in accordance\nwith system/site/organization requirements and reference\ninformation\n2.6\nResolve coordination requirements, including requests for\nisolations where appropriate, with others involved, affected or\nrequired by the work\n2.7\nPotential hazards are identified and prevention and/or control\nmeasures are selected\n2.8\nEquipment and facility maintenance history, condition\nmonitoring information, recent modifications and existing status\nare addressed in defining work scope\n2.9\nCosting of work is prepared and impact on budget assessed.\n\n--- PDF PAGE 78 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n74\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Establish maintenance\nsystems\n3.1\nCompliance documentation relevant to facilities and\nequipment maintenance management systems are accessed,\ninterpreted\n3.2\nMaintenance strategy for facility and equipment are developed\naccording to organization requirements\n3.3\nEstablish systems to ensure that the condition and\nperformance of equipment and facilities are regularly reported\nand discussed within the organization\n3.4\nAreas /items prone to defects, demonstrating frailty, or\nscheduled for regular maintenance, are identified ,and\ninformation used to develop a long-term maintenance plan\n3.5\nIndividuals in the organization responsible for performing\nregular or scheduled maintenance duties is informed of the\ndetails of the plan\n3.6\nData to be included in the reports on repair work are identified\n3.7\nSchedules and staff rosters are checked to verify time when\nthe maintenance process may be scheduled including optimum\ntraining for shut- down\n3.8\nDetailed work plans are developed to accord with training\nschedules, availability of expertise and scheduling of resource\navailability\n\n4. Complete maintenance\nprocedures\n4.1\nMaintenance work schedule is completed following the work\nplan\n4.2\nSystems and procedures are established, to satisfy identified\nmaintenance requirements\n4.3\nAppropriate readings, measurements and recordings are made\nand compared to equipment, product and other relevant\nspecifications\n4.4\nAreas requiring further testing are identified and complied with\nand appropriate procedures for testing recommended to\nappropriate personnel\n4.5\nAdjustments to the work schedule and plan are made based on\nexperience and documentation completed\n4.6\nMaintenance records and reports are completed and\nforwarded to appropriate personnel\n\n5. Establish procedures\nfor review of\nmaintenance systems\n5.1\nProcedures to evaluate and confirm system/equipment are\nestablished in compliance with organizational requirements\n5.2\nprocedures to confirm the currency of and compliance with\nfacility and equipment maintenance and safety standards are\nestablished\n5.3\nSystem of recording and reporting facility and equipment\ninformation is established\n5.4\nProcedures is established incorporating feedback of the\nreview system\n5.5\nEstablish procedures for response to instances of non-\ncompliance or other discrepancies/deficiencies revealed by a\nreview\n\n--- PDF PAGE 79 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n75\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Occupational Health\nand Safety (OHS)\nIncludes but not limited to:\n1.1\nthe use of personal protective equipment and clothing\n1.2\nsafety equipment\n1.3\nfirst aid equipment\n1.4\nfire fighting equipment\n1.5\nhazard and risk control\n1.6\nelimination of hazardous materials and substances\n1.7\nmanual handling including shifting, lifting and carrying\n\n2. Legislative\nIncludes but not limited to:\n2.1\nOHS\n2.2\nthe environment\n2.3\nrelevant industry codes of practice\n2.4\noutsourcing agreement\n\n3. organizational\nrequirements\n3.1\norganizational policies\n3.2\nrole and responsibilities\n3.3\nquality assurance\n3.4\nrecording and reporting\n3.5\nequipment use and storage\n3.6\nrecycling and re-use guidelines\n3.7\nethical standards\n3.8\naccess and equity\n3.9\nwaste disposal guidelines\n\n4. Facilities\n\nIncludes but not limited to:\n4.1\nElectrical system\n4.2\nVentilation system\n4.3\nWater system\n4.4\nWorkshops\n4.5\nFixtures\n4.6\nInfrastructure\n4.7\nLaboratory\n4.8\nWorkstations\n\n5. Equipment\nIncludes but not limited to:\n5.1\nlarge items of equipment\n5.2\nsmall items of equipment\n5.3\nsimple equipment\n5.4\ncomplex equipment\n5.5\nequipment with significant health and safety implications\n\n--- PDF PAGE 80 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n76\n\nVARIABLE\nRANGE\n6. Maintenance\n\nIncludes but not limited to:\n6.1\nmajor cleaning procedures of work areas\n6.2\nfacility inspection and repairs\n6.2.1 lighting\n6.2.2 ventilation\n6.2.3 plumbing\n6.3\nrepair of equipment and tools\n\n7. Plan\nIncludes but not limited to:\n7.1\nSequence, use of consumables and labor requirements\n7.2\nBudgetary requirements\n7.3\nOutsourcing scheme\n\n8. Schedule\nMay include:\n8.1\nwork schedules for personnel,\n8.2\nscheduling of processing work\n8.2.1 days\n8.2.2 times\n8.2.3 frequency\n8.3\nscheduling of equipment and facility down time\n\n9. Communication\n9.1\nverbal and written\n9.2\nconstructive feedback,\n9.3\nactive listening, questioning to clarify and confirm\nunderstanding,\n9.4\nreporting\n\n10. Relevant codes and\nstandards\nIncludes but not limited to:\n10.1 Occupational Health and Safety (OH&S) standards\n10.2 codes of practice\n10.3 fire codes\n10.4 electrical codes\n10.5 manufacturers' specifications\n10.6 environmental requirements\n10.7 institutional procedures\n\n11. Resources\n\nIncludes but not limited to:\n11.1 all service providers\n11.2 staffing\n11.3 materials\n11.4 equipment\n11.5 tools\n11.6 finances\n\n--- PDF PAGE 81 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n77\n\nVARIABLE\nRANGE\n12. Service providers\nIncludes but not limited to:\n12.1 internal staff\n12.2 external specialists\n12.3 maintenance contractors\n12.4 consultant firms\n\n13. Documentation\nIncludes but not limited to:\n13.1 job cards\n13.2 check sheets\n13.3 safety rule procedures\n13.4 drawings\n13.5 Quality Assurance documentation\n13.6 maintenance procedures and outage reports\n\n14. Systems\nIncludes but not limited to:\n14.1 a plan allocating of personnel\n14.2 reporting and recording\n14.3 routine and non-routine maintenance of the components of a\nfacility, including\n14.3.1 electrical\n14.3.2 ventilation\n14.3.3 plumbing\n14.3.4 equipment\n14.3.5 fixtures and fittings\n14.3.6 grounds\n\n15. Data\nIncludes but not limited to:\n15.1 date\n15.2 time\n15.3 nature of faults/repair\n15.4 repairs carried out\n\n16. Reports\nIncludes but not limited to:\n16.1 equipment type, and size,\n16.2 inspection, quality outcomes,\n16.3 hazards, incidents or malfunctions\n16.4 manual reporting\n16.5 computer-based system or another appropriate organizational\ncommunication system\n\n--- PDF PAGE 82 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n78\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nVerified maintenance requirements with appropriate personnel\nof the organization\n1.2\nResearched and planned maintenance activities for facilities\nand equipment\n1.3\nInterpreted documentation relevant to facilities and equipment\nmaintenance management\n1.4\nEstablished maintenance systems according to organization\nneeds\n1.5\nEstablished maintenance procedures including recoding and\nreporting\n1.6\nEstablished procedures for review of maintenance system\n2. Underpinning\nKnowledge\n2.1\napplicable legislative, regulatory or certification requirements\nand codes of practice relevant to\n2.2\norganizing enterprise maintenance programs\n2.3\norganizational and site standards, requirements, policies and\nprocedures for organizing maintenance programs\n2.4\nprinciples of cultural diversity and access and equity\n2.5\nenvironmental protection requirements\n2.6\nestablished communication channels and protocols\n2.7\nproblem identification and resolution\n2.8\ntypes of tools and equipment and procedures for their safe\nuse, operation and maintenance\n2.9\nmaterial, consumable and labor costs\n2.10 maintenance procedures and methodologies\n2.11 enterprise work schedules\n2.12 procedures for the recording, reporting and maintenance of\nworkplace records and information\n2.13 appropriate mathematical procedures for estimation and\nmeasurement\n3. Underpinning Skills\n\n3.1\ncomply with legislation, regulations, standards, codes of\npractice and established safe practices and procedures for\norganizing enterprise maintenance programs\n3.2\nuse and maintain relevant tools, machinery and equipment\n3.3\nidentify problems and equipment faults and demonstrate\nappropriate response procedures\n3.4\nuse appropriate communication and interpersonal techniques\nwith colleagues and others\n3.5\naccurately record and maintain information relating to\norganizing enterprise maintenance programs\n3.6\nefficiently and safely organize enterprise maintenance\nprograms\n3.7\nuse and maintain relevant tools, machinery and equipment\n3.8\nidentify problems and equipment faults and demonstrate\nappropriate response procedures\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to learning environment\n4.2\nAccess to appropriate tools and equipment and materials\n4.3\nAccess to research and other resources\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n6. Context for\nAssessment\nAssessment should be conducted in the workplace / simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 83 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n79\n\nUNIT OF COMPETENCY :\nDEVELOP LEARNING MATERIALS FOR E-LEARNING\n\nUNIT CODE\n:\nTVT232312\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ndevelop E-learning resources to support e-based learning mode.\nSpecifically it covers planning, development and testing of\ndigitally formatted learning materials.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for the\ndevelopment of\ndigitally formatted\nlearning resources\n1.1\nLearning resources specifications are established in line\nwith target user requirements and intended delivery mode\n1.2\nInstructional design are prepared in accordance with the\ncontent and established specifications\n1.3\nWork plan are prepared in line with the expected output and\ntarget deadline.\n1.4\nMock-up are prepared in line with instructional design\n\n2. Develop digitally\nformatted resources\n2.1\nMedia elements are prepared in line with instructional design\nand learning resource specifications.\n2.2\nAuthoring of learning resources is performed in line with the\nintended delivery mode and established learning resource l\nspecification.\n2.3\nTechnical and/or content issues that may result to deviations of\nactual resources from instructional design are discussed with\nconcerned personnel in line with establishment policy.\n2.4\nUtilization guide are developed in line with learning resources\nfeatures and design.\n\n3. Test digitally formatted\nlearning resources\n3.1\nTest criteria and instruments are developed in line with\nlearning material specification.\n3.2\nTest sites and reviewers are identified in line with established\ntarget users\n3.3\nTesting of learning resources are undertaken in line with work\nplan\n3.4\nFeedback and suggestions are addressed in line with\napproved work plan and development cycle.\n\n--- PDF PAGE 84 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n80\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning resources\nspecification\n\nMay include but not limited to:\n1.1\nQuality of media elements\n1.2\nFile size\n1.3\nPackaging requirements\n\n2. Delivery mode\nMay include but not limited to:\n2.1\nOnline learning\n2.2\nOffline (CD-based) learning\n\n3. Instructional design\n\nMay include:\n3.1\nStoryboard\n3.2\nScript\n\n4. Work plan\n\nMay include, but not limited to:\n4.1\nSchedule of deliverable\n4.2\nSchedule of activities\n\n5. Media elements\nMay include but not limited to:\n5.1\nText\n5.2\nPicture and illustration\n5.3\nMovie\n5.4\nAnimation\n\n--- PDF PAGE 85 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n81\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPlanned for the development of electronic learning resources\n1.2\nDeveloped digital format learning resources\n1.3\nConducted testing of digital format learning resources\n\n2. Underpinning\nKnowledge\n2.1\nI.T. Principles (i.e. internet technology, www)\n2.2\nPrinciples of learning using internet technology\n2.3\nProject management\n2.4\nInstructional designing for eLearning\n2.5\nLearners behaviour and characteristics in e-learning\nenvironment\n2.6\nPrinciples of research\n\n3. Underpinning Skills\n\n3.1\nInstructional designing\n3.2\nPhoto editing\n3.3\nIllustrating digital image and objects\n3.4\nVideo editing\n3.5\nAudio editing\n3.6\nAuthoring\n3.7\nFacilitation skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nComputer for multimedia editing\n4.2\nInternet access\n4.3\ne-Learning Tools (i.e. photo editing software, video editing\nsoftware)\n4.4\nAccess to experts for review and consultation\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n\n6. Context for\nAssessment\nAssessment should be conducted in the workplace /simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 86 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n82\nELECTIVE COMPETENCY\n\nUNIT TITLE\n:\nFACILITATE DEVELOPMENT OF COMPETENCY\nSTANDARDS\n\nUNIT CODE\n:\nTVT232313\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to facilitate the\ndevelopment of competency standards for particular work\nfunctions, work processes, work roles and work-related\nvocational outcomes.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized bold terms are elaborated in the Range of Variables\n1. Prepare workshop\nmaterials and venue\n\n1.1\nVenue, food, supplies and materials are coordinated in\naccordance with standard office procedures.\n1.2\nDocuments/Records are prepared in accordance with\nstandard format.\n1.3\nHandouts and presentation materials are prepared based on\nneed/backgrounds of expert-panel members.\n1.4\nExpert panel is identified and organized following established\nprocedures.\n\n2. Draft competency\nstandards\n\n2.1\nExperts are oriented on the process and methods of\ndeveloping competency standards based on established\nprocedures.\n2.2\nWhere applicable, functional analysis is performed in\naccordance with accepted procedures.\n2.3\nIn case of lack of or unavailability of experts, review of\nliterature and adaptation of existing/comparable competency\nstandards are carried out in consultation with industry partners.\n2.4\nThe identified unit/s of competency is/are developed in\naccordance with competency standards requirements and\nprocess.\n2.5\nCompetency standards are drafted in accordance with\nexpert/working committee recommendations.\n2.6\nDraft competency standards are packaged/ presented in\naccordance with approved format.\n\n3. Finalize competency\nstandards\n3.1\nRespondents in the validation are identified/ targeted to ensure\nparticipation of broad range of stakeholders.\n3.2\nDraft competency standards are validated with a\nrepresentative group of industry experts/stakeholders.\n3.3\nValidation results are documented and analyzed using criteria\nand a judgment is made to modify, amend or maintain draft.\n3.4\nValidated competency standards are checked to ensure the\nrevised/finalized standards meets relevant requirements.\n3.5\nCompetency standards are finalized in accordance with\nvalidation recommendations.\n\n--- PDF PAGE 87 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n83\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Venue, supplies and\nmaterials\nMay include but not be limited to:\n1.1\nFunction room\n1.1.1 Sound system\n1.1.2 Projector\n1.1.3 Computers/ Laptop\n1.1.4 Tables and chairs\n1.2\nSupplies and materials\n1.2.1 Bond paper\n1.2.2 Pen/pencil\n1.2.3 Board marker\n1.2.4 White board\n1.2.5 Brown envelope\n\n2. Documents/records\n2.1\nAttendance sheet\n2.2\nExperts’ nomination form\n2.3\nAppointment of experts\n\n3. Handouts\nMay include but not be limited to:\n3.1\nPaper-based handouts\n3.2\nSlide presentations\n3.3\nSample unit/s of competency\n\n4. Established procedures\nfor expert panels\n4.1\nRequest nominations from industry associations/partners\nexpert-panel members\n4.2\nNominees fill out nomination forms\n4.3\nConvene expert panel into series of writeshop-meetings to\ndraft the competency standards\n4.4\nValidate and finalize the competency standards with expert\npanel\n\n5. Criteria\n5.1\nRelevance of the feedback\n5.2\nAppropriateness of the feedback\n5.3\nWhether feedback adds value or meaning\n5.4\nWhether feedback adds new content\n5.5\nWhether feedback adds to quality of draft\n\n6. Requirements\n\nMay include:\n6.1\nGuidelines of relevant body\n6.2\nIndustry needs\n6.3\nClient requirements\n\n--- PDF PAGE 88 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n84\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate --\n1.1\nPrepared workshop materials and venue\n1.2\nFacilitated competency standards writeshop and validation\n1.3\nFinalized competency standards\n\n2. Underpinning\nknowledge and attitude\n\n2.1\nGuidelines for developing competency standards\n2.2\nThe technical and vocational education and training (TVET)\nenvironment\n2.3\nPolicies, legislation, codes of practice and national standards\nrelevant to TVET\n\n3. Underpinning Skills\n3.1\nPresentation skills\n3.2\nCommunication skills\n3.3\nFacilitation skills\n3.4\nAnalysis skills\n3.5\nThinking skills\n\n4. Resource Implications\n\nThe following resources MUST be provided:\n4.1\nAccess to panel of experts\n4.2\nVenue\n4.3\nSupplies and materials\n4.4\nHandouts\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nInterview\n5.2\nDemonstration with oral questioning\n5.3\nWritten exam/case problems\n\n6. Context of Assessment\nAssessment should be conducted in the workplace / simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 89 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n85"
