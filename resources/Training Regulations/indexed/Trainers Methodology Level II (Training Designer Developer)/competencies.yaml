          "source_text": "VARIABLE \nRANGE \n1.  Required evidence  \nIncludes but not limited to: \n1.1 \nDirect evidence \n1.1.1 Actual demonstration \n1.1.2 Actual product \n1.2 \nIndirect evidence \n1.2.1 Video presentation \n1.2.2 Photographs \n \n2.  Assessment Methods \nIncludes but not limited to: \n2.1 \nWritten Test \n2.2 \nInterview \n2.3 \nPortfolio \n2.4 \nObservation/Demonstration \n \n3.  Purpose and Context of \nassessment \nAssessment is carried out in order to: \n3.1 \nCertify that an individual has achieved competency \n3.2 \nRecruit and select trainees for a job \n3.3 \nMonitor individual performance at work \n3.4 \nDetermine training needs \n3.5 \nConduct skills audit \n3.6 \nRecognize  prior  learning \n3.7 \nClassify a person against industry or enterprise standards \n3.8 \nProvide feedback on progress during training \n \n4.  Evaluation criteria \nMay include: \n4.1 \neffectiveness and relevance to the competency standards \n4.2 \nwhether the assessment tool meets the principles of \nassessment \n4.3 \nwhether the assessment tool meets the rules of evidence \n4.4 \nwhether the assessment tool is appropriate to selected \nassessment methods \n4.5 \nwhether the assessment tool is appropriate to the target \ngroup/assessment context \n4.6 \nwhether the assessment tool provides guidance on reasonable \nadjustments \n4.7 \nwhether the assessment tool enables the candidate to \ndemonstrate current competency \n4.8 \nlevel of engagement and direct participation of candidates \n4.9 \nappropriateness of language and literacy used for intended \naudience\n\n--- PDF PAGE 76 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n72"
