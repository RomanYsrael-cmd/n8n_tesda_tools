ge\n\n--- PDF PAGE 50 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n46 \n \n \n3.3 \nself-evaluation skills to: \n3.3.1 identify gaps in skills or knowledge \n3.3.2 obtain competencies to meet current and future \norganizational objectives \n3.4 \nresearch skills to: \n3.4.1 keep up with trends in vocational education and \ntraining to obtain current information \n3.4.2 identify relevant industry affiliations \n3.4.3 keep up with trends/changes/developments in the \nvocational area of competency \n3.5 \ncommunication skills to: \n3.5.1 obtain feedback from colleagues and clients \n3.5.2 participate in professional networks \n3.5.3 consult with colleagues and clients \n3.6 \ninterpersonal skills to: \n3.6.1 participate in industry events and activities \n3.6.2 build professional relationships \n3.7 \nnetworking skills to build an industry network \n3.8 \nliteracy skills to: \n3.8.1 document personal learning needs \n3.8.2 read and interpret vocational education and training \ninformation such as legal/ organizational policy \ndocuments \n3.8.3 complete and maintain records related to professional \ndevelopment \n3.9 \ntime management skills to: \n3.9.1 organize professional development activities \n3.9.2 analyze and identify career options \n3.9.3 create a balance between work, study, personal and \nrecreation activities \n \n4. Resource Implication \nThe following resources MUST be provided: \n4.1 \nrelevant organizational/legal documentation \n4.2 \naccess to relevant benchmarks \n4.3 \naccess to networks, technology, communication \n \n5. Method of assessment \nCompetency must be assessed through : \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nWritten Test \n5.4 \nThird Party Report \n \n6. Context for \nassessment \n \n6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group",
