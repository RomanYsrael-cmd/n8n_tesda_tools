        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPlanned for the development of electronic learning resources\n1.2\nDeveloped digital format learning resources\n1.3\nConducted testing of digital format learning resources\n\n2. Underpinning\nKnowledge\n2.1\nI.T. Principles (i.e. internet technology, www)\n2.2\nPrinciples of learning using internet technology\n2.3\nProject management\n2.4\nInstructional designing for eLearning\n2.5\nLearners behaviour and characteristics in e-learning\nenvironment\n2.6\nPrinciples of research\n\n3. Underpinning Skills\n\n3.1\nInstructional designing\n3.2\nPhoto editing\n3.3\nIllustrating digital image and objects\n3.4\nVideo editing\n3.5\nAudio editing\n3.6\nAuthoring\n3.7\nFacilitation skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nComputer for multimedia editing\n4.2\nInternet access\n4.3\ne-Learning Tools (i.e. photo editing software, video editing\nsoftware)\n4.4\nAccess to experts for review and consultation\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n\n6. Context for\nAssessment\nAssessment should be conducted in the workplace /simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 86 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n82\nELECTIVE COMPETENCY\n\nUNIT TITLE\n:\nFACILITATE DEVELOPMENT OF COMPETENCY\nSTANDARDS\n\nUNIT CODE\n:"
        },
        "source_text": "TVT232312\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ndevelop E-learning resources to support e-based learning mode.\nSpecifically it covers planning, development and testing of\ndigitally formatted learning materials.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for the\ndevelopment of\ndigitally formatted\nlearning resources\n1.1\nLearning resources specifications are established in line\nwith target user requirements and intended delivery mode\n1.2\nInstructional design are prepared in accordance with the\ncontent and established specifications\n1.3\nWork plan are prepared in line with the expected output and\ntarget deadline.\n1.4\nMock-up are prepared in line with instructional design\n\n2. Develop digitally\nformatted resources\n2.1\nMedia elements are prepared in line with instructional design\nand learning resource specifications.\n2.2\nAuthoring of learning resources is performed in line with the\nintended delivery mode and established learning resource l\nspecification.\n2.3\nTechnical and/or content issues that may result to deviations of\nactual resources from instructional design are discussed with\nconcerned personnel in line with establishment policy.\n2.4\nUtilization guide are developed in line with learning resources\nfeatures and design.\n\n3. Test digitally formatted\nlearning resources\n3.1\nTest criteria and instruments are developed in line with\nlearning material specification.\n3.2\nTest sites and reviewers are identified in line with established\ntarget users\n3.3\nTesting of learning resources are undertaken in line with work\nplan\n3.4\nFeedback and suggestions are addressed in line with\napproved work plan and development cycle.\n\n--- PDF PAGE 84 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n80\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning resources\nspecification\n\nMay include but not limited to:\n1.1\nQuality of media elements\n1.2\nFile size\n1.3\nPackaging requirements\n\n2. Delivery mode\nMay include but not limited to:\n2.1\nOnline learning\n2.2\nOffline (CD-based) learning\n\n3. Instructional design\n\nMay include:\n3.1\nStoryboard\n3.2\nScript\n\n4. Work plan\n\nMay include, but not limited to:\n4.1\nSchedule of deliverable\n4.2\nSchedule of activities\n\n5. Media elements\nMay include but not limited to:\n5.1\nText\n5.2\nPicture and illustration\n5.3\nMovie\n5.4\nAnimation\n\n--- PDF PAGE 85 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n81\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPlanned for the development of electronic learning resources\n1.2\nDeveloped digital format learning resources\n1.3\nConducted testing of digital format learning resources\n\n2. Underpinning\nKnowledge\n2.1\nI.T. Principles (i.e. internet technology, www)\n2.2\nPrinciples of learning using internet technology\n2.3\nProject management\n2.4\nInstructional designing for eLearning\n2.5\nLearners behaviour and characteristics in e-learning\nenvironment\n2.6\nPrinciples of research\n\n3. Underpinning Skills\n\n3.1\nInstructional designing\n3.2\nPhoto editing\n3.3\nIllustrating digital image and objects\n3.4\nVideo editing\n3.5\nAudio editing\n3.6\nAuthoring\n3.7\nFacilitation skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nComputer for multimedia editing\n4.2\nInternet access\n4.3\ne-Learning Tools (i.e. photo editing software, video editing\nsoftware)\n4.4\nAccess to experts for review and consultation\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDemonstration / Observation and with oral questioning\n5.2\nPortfolio\n\n6. Context for\nAssessment\nAssessment should be conducted in the workplace /simulated area /\nTESDA Assessment Center\n\n--- PDF PAGE 86 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n82\nELECTIVE COMPETENCY\n\nUNIT TITLE\n:\nFACILITATE DEVELOPMENT OF COMPETENCY\nSTANDARDS\n\nUNIT CODE\n:"
