        "source_title": "DEVELOP AND PROMOTE APPRECIATION FOR COSTS AND BENEFITS OF TECHNICAL TRAINING",
        "source_text": "--- PDF PAGE 51 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n47 \n \nUNIT OF COMPETENCY : \nDEVELOP AND PROMOTE APPRECIATION FOR COSTS \nAND BENEFITS OF TECHNICAL TRAINING \n \n \nUNIT CODE \n: \n500232109 \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required in estimating and \nevaluating costs and benefits of training, determining its cost-\neffectiveness and returns, and identifying, recommending and \nadvocating cost-efficient training practices   \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Study training cost \ncomponents \n1.1 \nFeatures and benefits of training programs are identified and \nanalyzed based on financial  and customer requirements \n1.2 \nCost components are analyzed to determine those which \ndeliver the desired training features and benefits \n1.3 \nWastages or excesses are determined for possible reduction \nor elimination   \n \n2. Evaluate training costs \nand benefits \n2.1 \nVariances in training performance and results are studied to \ndetermine good and bad practices \n2.2 \nPlanned performance is compared with actual performance to \nidentify future enhancements in conduct of training \n2.3 \nCost reduction and control measures that do not impact greatly \non training results are recommended \n2.4 \nUsage of training resources is analyzed for optimization or \nreduction \n \n3. Monitor conduct and \nresults of training \n3.1 \nSimple formative and summative evaluations of training are \ndone to evaluate achievement of learning outcomes \n3.2 \nQuality training programs are monitored and \nnoted/documented for best practices and results replication \n3.3 \nBenefits and returns on training investments are studied \nusing relevant data \n3.4 \nCost-effective training programs are identified and \nrecommended for documentation, replication and further \nenhancement. \n \n4. Promote awareness of \ncosts and benefits of \ntraining \n4.1 \nBenefits of training as investment  rather than cost center are \nexplained and stressed to trainees, fellow trainers and \nadministrators where applicable \n4.2 \nEconomy in use of training supplies and materials and care in \nuse of training equipment and facilities are stressed continually \n4.3 \nModel/best practices in optimum and judicious use of training \nresources are documented, practiced and demonstrated\n\n--- PDF PAGE 52 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n48 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Benefits and returns on \ntraining investment \nMay include: \n1.1 \nLong-term impact such as -- \n1.1.1 Increased profitability of firm \n1.1.2 Industrial peace \n1.2 \nImmediate results such as --  \n1.2.1 Positive customer feedback \n1.2.2 Less product recalls/rejects \n1.2.3 Consistent/increasing  school enrolment \n1.2.4 Higher absorption rate of graduates \n1.2.5 Lower drop-out rates \n1.2.6 Lower worker attrition rate \n \n2. Relevant training data \nMay include: \n2.1 \nData from graduate tracer studies \n2.2 \nEnrolment data \n2.3 \nTrainee drop-out \n2.4 \nTrainee learning evaluation  \n2.5 \nEmployment/absorption rate \n2.6 \nReaction-level evaluation  \n2.7 \nTrainee skills certification rate \n2.8 \nPer-capita training costs \n2.9 \nSkill utilization rate\n\n--- PDF PAGE 53 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n49 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate – \n1.1 \nDemonstrated ability to identify, estimate and evaluate training \ncost components \n1.2 \nDemonstrated ability to assess training programs according to \ntheir cost-effectiveness and return on investment \n1.3 \nDemonstrated ability to explain training costs and benefits and \nadvocate cost-effective training \n \n2. Underpinning \nknowledge and attitude \n2.1 \nBasic arithmetic – four fundamental operations \n2.2 \nBasic cost accounting and bookkeeping \n2.3 \nBasic training methodology including training costs and \nbenefits \n2.4 \nTraining system evaluation concepts \n2.5 \nPositive work traits and values (attention to detail, persistence, \ncost-consciousness, safety- and time-consciousness, quality-\nconsciousness) \n \n3. Underpinning skills \n3.1 \nCommunication skills \n3.2 \nComputer literacy \n3.3 \nComputational and accounting skills \n3.4 \nObserving safety and health precautions \n3.5 \nInstructional and facilitation skills \n \n4. Resource implications \nThe following resources MUST be provided:  \n4.1 \nAccess to training and enrolment data, e. g., collection, \nexpenses, trainee performance data \n4.2 \nAccess to an ongoing training program \n4.3 \nCase problems in cost-effective training \n \n5. Methods of \nassessment \nCompetency may be assessed through: \n5.1 \nCase problems \n5.2 \nWritten exam \n5.3 \nInterview \n5.4 \nSubmission and presentation of written report or case study \n5.5 \nPortfolio \n5.6 \nThird-party report \n \n6. Context of assessment \nCompetency may be assessed on the job or in a simulated work \nenvironment\n",
