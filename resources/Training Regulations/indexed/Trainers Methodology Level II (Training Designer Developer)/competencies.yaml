        "source_title": "WORK EFFECTIVELY IN VOCATIONAL EDUCATION AND TRAINING",
        "source_text": "--- PDF PAGE 24 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n20 \n \nUNIT OF COMPETENCY : \nWORK EFFECTIVELY IN VOCATIONAL EDUCATION AND \nTRAINING \n \n \n \nUNIT CODE \n: \n500232105 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \nwork effectively in the policy and operating environment of the \nvocational education and training sector. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Work within the \nvocational education \nand training policy \nframework \n1.1 \nRelevant national vocational education and training \npolicies and frameworks are accessed, analyzed, applied \nand guided in accordance with work practices and \nresponsibilities. \n1.2 \nKey vocational education and training organizations and \nstakeholders are identified, accessed and informed in \naccordance with updated work practices. \n1.3 \nLegislation and guidelines are accessed, used, complied \nand ensured in accordance work practices and policy \nrequirements. \n1.4 \nSources of information and advice on vocational education \nand training policy and operating context are accessed on a \nregular basis and changes are noted as appropriate \n1.5 \nOpportunities are taken up to contribute to vocational \neducation and training in accordance with organizational policy \ndevelopments. \n1.6 \nVocational education and training terminology is used to \ncommunicate effectively in accordance with sector. \n \n2. Work within the training \norganization’s quality \nframework \n2.1 \nRelevant organizational documentation is accessed, used, \nsupported and ensured in accordance work roles and \nresponsibilities. \n2.2 \nWork is conducted in accordance with the training \norganization’s quality assurance strategies, processes, \npolicies and procedures. \n2.3 \nEthical and legal responsibilities are adhered to in \naccordance with work practices. \n2.4 \nWork is undertaken in accordance with the prevailing industrial \nand employee relations systems and practices. \n2.5 \nFeedback and advice on work quality is actively sought from \ncolleagues and clients in accordance with the prevailing \nindustrial and employee relations systems and practices.\n\n--- PDF PAGE 25 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n21 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3. Manage work and work \nrelationships \n3.1 \nWork is planned, prioritized and organized to achieve agreed \nand expected outcomes. \n3.2 \nWorkloads are assessed and guidance/support is sought from \nrelevant personnel where work issues arise and in \naccordance with existing organizational policies and \nguidelines. \n3.3 \nRelevant technological skills are used to enhance work \noutcomes and in accordance with prevailing industrial systems \nand practices. \n3.4 \nWork is undertaken in a collaborative manner with colleagues \nthrough sharing of information and ideas and working together \non work outcomes in accordance with the prevailing industrial \nand employee relations systems and practices. \n3.5 \nFeedback on managing work and professional relationships is \nobtained from clients and colleagues and is evaluated and \nacted upon. \n \n4. Demonstrate a client-\nfocused approach to \nwork \n4.1 \nClients and their needs and expectations form the basis for \ndeveloping effective work practices and outcomes in \naccordance with operational limits. \n4.2 \nEffective communication strategies are developed, utilized, \nestablished and maintained in accordance with client \nrelationships. \n4.3 \nProcesses for evaluating and improving client satisfaction are \ndeveloped and built in accordance with work practices.\n\n--- PDF PAGE 26 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n22 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. National vocational \neducation and training \npolicies and \nframeworks \nMay include \n1.1 \nPhilippine TVET Trainers Qualification Framework (PTTQF) \n1.2 \nTraining Packages \n1.3 \nUser Choice \n1.4 \nTraineeship and apprenticeship arrangements \n \n2. Vocational education \nand training \norganizations and \nstakeholders \nMay include: \n2.1 \nDepartment of Labor and Employment (DOLE) \n2.2 \nTechnical Education and Skills Development  Authority \n(TESDA) \n2.3 \nIndustry Skills Councils (ISCs) \n2.4 \ntraining organizations \n \n3. Legislation and \nguidelines \nMay include: \n3.1 \nGuidelines on program/project funding \n3.2 \nUser Choice \n3.3 \nApprenticeships/traineeships \n3.4 \nImplementation of Training Packages \n3.5 \nRegistration \n3.6 \nCourse accreditation \n3.7 \nAccess and equity \n3.8 \nAnti-discrimination including equal opportunity, racial \nvilification and disability discrimination \n3.9 \nIndustrial relations \n3.10 Code of practice  \n3.11 Occupational health and safety (OHS) \n \n4. Sources of information \nand advice \nMay include: \n4.1 \nWeb-based information from vocational education and training \norganizations and stakeholders such as the National Training \nInformation Service (NTIS) \n4.2 \nPrinted policies, newsletters, bulletins, publications of \nvocational education and training organizations and \nstakeholders \n4.3 \nProducts including revised Training Packages, support \nmaterials and professional development materials \nimplementation guidelines \n4.4 \nResearch journals \n4.5 \nConference papers\n\n--- PDF PAGE 27 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n23 \n \nVARIABLE \nRANGE \n5. Opportunities \nMay include: \n5.1 \nAttendance at workshops and consultations conducted by \nrelevant vocational education and training organizations and \nstakeholders \n5.2 \nIndividual or organizational written submissions and feedback \nto relevant vocational education and training organizations \nand stakeholders \n5.3 \nParticipation in forums, networks, conferences \n5.4 \nParticipation in training organization meetings \n5.5 \nParticipation in validation meetings \n5.6 \nResearch/consultancy \n5.7 \nContribution to online consultations \n \n6. Vocational education \nand training \nterminology \nMay include but not limited to: \n6.1 \nAcronyms \n6.2 \nLanguage of the profession \n6.3 \nLanguage styles commonly used in vocational education and \ntraining environments \n \n7. Relevant \norganizational \ndocumentation \nMay include: \n7.1 \nStrategic plans \n7.2 \nBusiness plans \n7.3 \nPolicies and procedures \n7.4 \nPosition descriptions \n7.5 \nResponsibility statements  \n \n8. Training organization’s \nquality assurance \nstrategies, processes, \npolicies and \nprocedures \nMay relate to: \n8.1 \nQuality arrangements for clients covering: \n8.1.1 enrolment and induction/orientation \n8.1.2 complaints, grievances and appeals \n8.1.3 assessment, including skills recognition, pre-\nassessment and appeals \n8.1.4 identification of training support requirements, for \nexample, language, literacy and/or numeracy needs \n8.1.5 fees \n8.1.6 privacy \n8.1.7 access and equity \n8.1.8 welfare and guidance \n8.1.9 issuance of qualifications \n8.1.10 mutual recognition of qualifications, Statements of \nAttainment, credit and articulation arrangements \n8.2 \nInternal quality policies and procedures covering: \n8.2.1 risk management \n8.2.2 continuous improvement \n8.2.3 OHS \n8.2.4 equal employment opportunity (EEO) \n8.2.5 discrimination and workplace harassment\n\n--- PDF PAGE 28 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n24 \n \nVARIABLE \nRANGE \n \n8.2.6 staff disciplinary procedures \n8.2.7 financial management \n8.2.8 records management \n8.2.9 management processes for learning resources and \nlearning materials \n8.2.10 recruitment and induction of personnel \n8.2.11 staff qualifications \n8.3 \nlearning and professional/staff development  opportunities  \n8.4 \ntraining organization staff development programs \n8.5 \nparticipation in networks \n8.6 \nindividual learning initiatives \n8.7 \nmembership of professional associations/networks \n8.8 \nrelevant university courses \n \n9. Ethical and legal \nresponsibilities \nMay include: \n9.1 \ncompliance with relevant legislation including: \n9.1.1 OHS legislation \n9.1.2 EEO legislation \n9.1.3 anti-discrimination legislation \n9.1.4 legislation relating to overseas learners \n9.2 \ncompliance with industrial awards, enterprise  agreements \nand employment contracts \n9.3 \nmeeting environmental standards \n9.4 \nduty of care \n9.5 \nrecognizing and being sensitive to individual differences and \ndiversity \n9.6 \nprovision of accurate information, advice and services \n9.7 \nproviding support to learners appropriate to their needs \n9.8 \nmaintaining client privacy and confidentiality \n9.9 \ncode of practice  \n \n10. Work issues \nMay include: \n10.1 time pressures \n10.2 work overload \n10.3 competing demands \n10.4 unexpected contingencies \n10.5 technology problems \n10.6 relations with other personnel \n10.7 client issues/relations  \n \n11. Relevant technological \nskills \nMay include checking that the idea: \n11.1 using computer word processing software to produce \ndocuments, reports and learning materials \n11.2 using computer presentation applications \n11.3 using computer data processing software to produce statistical \ninformation\n\n--- PDF PAGE 29 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n25 \n \nVARIABLE \nRANGE \n \n11.4 using computers/communication systems to support online \nlearning \n11.5 conducting web searches \n11.6 participating in Internet/video conferencing \n11.7 using chat rooms \n11.8 managing email \n11.9 operating computer projection equipment \n11.10 operating overhead projectors \n11.11 operating other business equipment, e.g. fax machines, \nphotocopiers and telephone systems \n \n12. Clients and colleagues \nMay include: \n12.1 individual learners, apprentices and trainees, employees \n12.2 enterprises/industry \n12.3 other parts of the training organization \n12.4 government departments/agencies, or other organizations \n \n13. Clients and their needs \nand expectations \nMay include: \n13.1 a focus on individual learner objectives such as: \n13.1.1 new skills \n13.1.2 specific competencies \n13.1.3 target qualifications \n13.1.4 new career \n13.1.5 career advancement \n13.1.6 improved language \n13.1.7 literacy and numeracy skills \n13.2 preference for particular learning styles \n13.3 individualized learning support systems \n13.4 individualized organizational training \n13.5 client centered approaches \n13.6 information and advice on courses, learning programs and \nqualifications \n \n14. Operational limits \nMay include: \n14.1 level of responsibility, autonomy, classification level \n14.2 staffing resource limitations \n14.3 physical environment limitations \n14.4 cost \n14.5 time \n14.6 scheduling difficulties \n14.7 OHS \n \n15. Effective \ncommunication \nstrategies \nMay include: \n15.1 establishing clarity of purpose \n15.2 ongoing liaison \n15.3 effective reporting arrangements \n15.4 continuous feedback mechanisms\n\n--- PDF PAGE 30 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n26 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1 \nWorked within the vocational education and training policy \nframework  \n1.2 \nWorked within the training organization’s quality framework \n1.3 \nManaged work and work relationships \n1.4 \nDemonstrated a client-focused approach to work \n \n2. Underpinning \nknowledge and attitude \n2.1 \nTraining Packages, including the purpose and structure of: \n2.1.1 units of competency \n2.1.2 Assessment Guidelines \n2.1.3 qualifications \n2.1.4 Employability Skills \n2.1.5 support materials \n2.2 \nPhilippine TVET Trainers Qualification Framework (PTTQF) \n2.3 \nsources of information on vocational education and training, \nfor example: \n2.3.1 NTIS web site for accessing details on units, \ncourses/qualifications, training organizations, and \nTraining Packages and support materials \n2.4 \nsources of information on legal and organizational \nrequirements, for example: \n2.4.1 organizational manuals, documents, publications \n2.4.2 organizational data systems \n2.4.3 publications, newsletters of relevant authorities \n2.5 \ncompetency-based training and assessment, for example: \n2.5.1 competency standards define performance outcomes, \napplied knowledge and skills needed for work \n2.5.2 competency standards form the basis for teaching and \nlearning and training delivery in recognized TVET \n2.5.3 learning is outcomes focused not inputs driven \n2.5.4 competency standards establish requirements for \nassessment \n2.5.5 assessment is criterion referenced/not norm \nreferenced \n2.5.6 assessment is reported as competent/not yet \ncompetent \n2.5.7 competency standards are industry defined \n2.5.8 competency standards have a national focus \n2.6 \nthe training organization’s systems, policies and procedures \n2.7 \nrelevant vocational education and training terminology \nappropriate to the work role \n2.8 \nthe diversity of clients, client needs, client expectations for \nvocational education and training services\n\n--- PDF PAGE 31 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n27 \n \n \n2.9 \nrelevant legal and policy requirements, codes of practice, \nnational standards and legislations, for example: \n2.9.1 specific industry/workplace legal/compliance and \nlicensing requirements \n2.9.2 duty of care under common law \n2.9.3 anti-discrimination including equal opportunity, racial \nvilification and disability discrimination \n2.9.4 workplace relations, industrial awards and enterprise \nagreements \n2.9.5 privacy/security of information \n2.9.6 copyright/plagiarism \n2.10 relevant OHS knowledge relating to the work role/work \ncontext, and OHS considerations when working in vocational \neducation and training, including: \n2.10.1 internal policies and procedures to meet OHS \nrequirements \n2.10.2 hazards commonly found in the work environment \n2.10.3 sources of OHS information and expertise \n \n3. Underpinning skills \n3.1 \nliteracy skills to: \n3.1.1 read and understand vocational education and training \npolicy and other documents, vocational education and \ntraining terminology and language styles \n3.1.2 interpret legal requirements of vocational education \nand training policies, procedures and guidelines \n3.1.3 write documents for a range of vocational education \nand training audiences and purposes \n3.2 \nlanguage skills to: \n3.2.1 communicate with personnel across all levels of the \norganization and with clients \n3.2.2 understand and use vocabulary and terminology \nspecific to the vocational education and training \nenvironment \n3.2.3 listen and summarize key points, make evaluative \njudgments and articulate verbally or in writing to a \nclient or colleague \n3.2.4 facilitate discussions to encourage problem solving, \nsharing of strategies, and exploring different solutions \nto problems \n3.2.5 work effectively as a team member \n3.3 \nrecognizing and being sensitive to individual difference and \ndiversity, for example: \n3.3.1 being sensitive to and valuing culture \n3.3.2 acting without bias/discrimination \n3.3.3 responding to individuals with particular needs \n3.3.4 recognizing the importance of religion\n\n--- PDF PAGE 32 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n28 \n \n \n3.4 \nplanning skills to: \n3.4.1 identify and access relevant sources of national \nvocational education and training policies, frameworks, \nlegislation and guidelines \n3.4.2 participate in opportunities to contribute to vocational \neducation and training organizational policy \ndevelopments \n3.4.3 manage work and work relationships \n3.5 \nresearch skills to access information \n3.6 \ntechnology skills to: \n3.6.1 use computer hardware and relevant software \n3.6.2 use office/business equipment \n \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \naccess to business, organizational, legislative and vocational \neducation and training documentation \n4.2 \naccess to clients \n4.3 \naccess to colleagues \n4.4 \naccess to a TVET operating environment  \n \n5. Method of assessment \nCompetency must be assessed through : \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nWritten Test \n5.4 \nThird Party Report \n \n6. Context for \nassessment \n6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or as a team under limited \nsupervision\n",
