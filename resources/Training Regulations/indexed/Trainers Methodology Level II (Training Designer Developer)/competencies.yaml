accurately record and maintain information relating to \norganizing enterprise maintenance programs \n3.6 \nefficiently and safely organize enterprise maintenance \nprograms \n3.7 \nuse and maintain relevant tools, machinery and equipment \n3.8 \nidentify problems and equipment faults and demonstrate \nappropriate response procedures \n4.  Resource Implications \nThe following resources MUST be provided: \n4.1 \nAccess to learning environment \n4.2 \nAccess to appropriate tools and equipment and materials \n4.3 \nAccess to research and other resources \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration / Observation and with oral questioning \n5.2 \nPortfolio \n6.  Context for \nAssessment \nAssessment should be conducted in the workplace / simulated area / \nTESDA Assessment Center",
