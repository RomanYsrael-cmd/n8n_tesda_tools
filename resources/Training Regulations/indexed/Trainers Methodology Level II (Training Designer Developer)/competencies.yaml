        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified required evidence.\n1.2\nIdentified assessment methods.\n1.3\nDeveloped assessment tools.\n1.4\nUpdated evidence requirements, assessment method and\ntools.\n1.5\nPromulgated and deployed assessment tools according to\napproved guidelines.\n\n2. Underpinning\nKnowledge\n\n2.1\nhow to interpret competency standards, including components\nof competency and dimensions of competency\n2.2\nKnowledge on the types of evidence and rules of evidence.\n2.3\nKnowledge on the competency to be assessed.\n2.4\nKnowledge on the range of assessment purposes and contexts\nand the implications of these for the person being assessed.\n2.5\nKnowledge of different types of assessment methods, their\nsuitability for gathering various types of evidence.\n2.6\nPrinciple of reasonable adjustment\n2.7\nKnowledge on the different types of assessment tools\n2.8\nKnowledge on any legal or ethical responsibilities associated\nwith the assessment system and assessment procedures such\nas licensing requirements, equal employment opportunity,\ndisability discrimination and occupational health and safety.\n2.9\nKnowledge of validation process.\n\n3. Underpinning Skills\n\n3.1\nCommunication skills\n3.2\nTechnical writing\n\n3.3\nAbility to design assessment tools/method\n3.4\nAbility to conduct validation\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to assessment tools to be customized to suit needs of\na particular audience or context.\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPractical exercise involving design of assessment tools.\n5.2\nInterview\n\n6. Context of Assessment 6.1\nOn-the-Job\n6.2\nSimulated workplace\n\n--- PDF PAGE 77 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n73\nUNIT OF COMPETENCY :\nDESIGN AND DEVELOP MAINTENANCE SYSTEMS\nUNIT CODE\n:"
        },
        "source_text": "TVT232310\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ndeveloping assessment tools. It details the requirements for\ndetermining evidence requirements, selecting appropriate\nassessment\nmethods,\npreparing\nassessment\ntools,\nand\nvalidating assessment tools in accordance with the relevant\nAssessment Guidelines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish evidence\nrequirements\n\n1.1\nCompetency standards are identified which describe the work\nactivities to be assessed.\n1.2\nRelevant unit(s) of competency are read and interpreted to\nidentify the required evidence.\n1.3\nEvidence requirements are identified which show full coverage\nand consistent performance of the relevant work activities.\n\n2. Establish suitable\nassessment methods\n\n2.1\nSuitable assessment methods are identified that are\nconsistent with the evidence requirements and the advice\nprovided in the Evidence Guide and relevant Assessment\nGuidelines.\n2.2\nAssessment methods are selected which are appropriate for\nthe competency being assessed, and in line with the purpose\nand assessment context.\n\n3. Prepare assessment\ntools\n\n3.1\nAssessment tools are prepared in accordance with the advice\nprovided in the relevant Assessment Guidelines.\n3.2\nClear and concise written instructions and materials are\nprepared for the assessor and the candidate which accurately\ndescribe the assessment activity.\n3.3\nAssessment tools are checked for validity, fairness, safety and\ncost effectiveness.\n\n4. Validate assessment\ntools\n4.1\nDraft assessment tools are checked against evaluation\ncriteria and amended, when necessary\n4.2\nAssessment tools are pilot tested with a small sample of\nassessors and industry practitioners.\n4.3\nInformation gathered through the validation are analyzed to\nestablish any changes that maybe required.\n4.4\nAssessment tools are finalized incorporating suggested\nchanges as appropriate.\n\n--- PDF PAGE 75 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n71\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Required evidence\nIncludes but not limited to:\n1.1\nDirect evidence\n1.1.1 Actual demonstration\n1.1.2 Actual product\n1.2\nIndirect evidence\n1.2.1 Video presentation\n1.2.2 Photographs\n\n2. Assessment Methods\nIncludes but not limited to:\n2.1\nWritten Test\n2.2\nInterview\n2.3\nPortfolio\n2.4\nObservation/Demonstration\n\n3. Purpose and Context of\nassessment\nAssessment is carried out in order to:\n3.1\nCertify that an individual has achieved competency\n3.2\nRecruit and select trainees for a job\n3.3\nMonitor individual performance at work\n3.4\nDetermine training needs\n3.5\nConduct skills audit\n3.6\nRecognize prior learning\n3.7\nClassify a person against industry or enterprise standards\n3.8\nProvide feedback on progress during training\n\n4. Evaluation criteria\nMay include:\n4.1\neffectiveness and relevance to the competency standards\n4.2\nwhether the assessment tool meets the principles of\nassessment\n4.3\nwhether the assessment tool meets the rules of evidence\n4.4\nwhether the assessment tool is appropriate to selected\nassessment methods\n4.5\nwhether the assessment tool is appropriate to the target\ngroup/assessment context\n4.6\nwhether the assessment tool provides guidance on reasonable\nadjustments\n4.7\nwhether the assessment tool enables the candidate to\ndemonstrate current competency\n4.8\nlevel of engagement and direct participation of candidates\n4.9\nappropriateness of language and literacy used for intended\naudience\n\n--- PDF PAGE 76 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n72\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified required evidence.\n1.2\nIdentified assessment methods.\n1.3\nDeveloped assessment tools.\n1.4\nUpdated evidence requirements, assessment method and\ntools.\n1.5\nPromulgated and deployed assessment tools according to\napproved guidelines.\n\n2. Underpinning\nKnowledge\n\n2.1\nhow to interpret competency standards, including components\nof competency and dimensions of competency\n2.2\nKnowledge on the types of evidence and rules of evidence.\n2.3\nKnowledge on the competency to be assessed.\n2.4\nKnowledge on the range of assessment purposes and contexts\nand the implications of these for the person being assessed.\n2.5\nKnowledge of different types of assessment methods, their\nsuitability for gathering various types of evidence.\n2.6\nPrinciple of reasonable adjustment\n2.7\nKnowledge on the different types of assessment tools\n2.8\nKnowledge on any legal or ethical responsibilities associated\nwith the assessment system and assessment procedures such\nas licensing requirements, equal employment opportunity,\ndisability discrimination and occupational health and safety.\n2.9\nKnowledge of validation process.\n\n3. Underpinning Skills\n\n3.1\nCommunication skills\n3.2\nTechnical writing\n\n3.3\nAbility to design assessment tools/method\n3.4\nAbility to conduct validation\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to assessment tools to be customized to suit needs of\na particular audience or context.\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPractical exercise involving design of assessment tools.\n5.2\nInterview\n\n6. Context of Assessment 6.1\nOn-the-Job\n6.2\nSimulated workplace\n\n--- PDF PAGE 77 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n73\nUNIT OF COMPETENCY :\nDESIGN AND DEVELOP MAINTENANCE SYSTEMS\nUNIT CODE\n:"
