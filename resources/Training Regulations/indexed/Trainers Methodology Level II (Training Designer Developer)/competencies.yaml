          "source_text": "VARIABLE \nRANGE \n1. Individual differences \nMay include: \n1.1 \nlearning difficulties \n1.2 \nliteracy and numeracy needs \n1.3 \nlanguage other than English (LOTE) \n1.4 \ncultural background, images and perceptions \n1.5 \nsocio-economic background \n1.6 \nage, gender, sexuality \n1.7 \nreligious practices \n1.8 \nintellectual impairment or disability \n1.9 \nmedical conditions such as arthritis, epilepsy, diabetes and \nasthma \n1.10 physical impairment or disability involving hearing vision, voice \nor mobility \n1.11 psychological or psychiatric impairment \n \n2. Clients with particular \nneeds \nMay include: \n2.1 \nwomen where under-represented \n2.2 \nrural and remote learners \n2.3 \npeople with disabilities, either permanent o temporary \n2.4 \npeople from non-English speaking backgrounds \n2.5 \nyouth at risk \n \n3. Principles \nMay include: \n3.1 \nsupporting equal opportunity for participation \n3.2 \nfostering and advocating independence \n3.3 \nensuring cooperative approaches to learning \n3.4 \nusing client-centered approaches to learning \n3.5 \nsupporting, encouraging and valuing individual contributions \n3.6 \nmotivating learners \n3.7 \ncreating opportunities for participation and success \n3.8 \nmaking reasonable adjustments to procedures, activities and \nassessment for equity \n3.9 \nacknowledging current strengths and skills as a basis for \nfurther learning \n \n4. Ground rules \nMay include: \n4.1 \nguidelines of behavior and acceptance \n4.2 \ncommon understandings between learners about group \ninteraction, respect and acceptance \n4.3 \nexpectations of working relationships \n4.4 \nsafety of learners and others \n4.5 \ncomfort of learners and others \n4.6 \nagreed consequences for breaching ground rules \n \n5. Specific needs \nMay include: \n5.1 \nphysical environment adjustments \n5.2 \nadjustments to learning and assessment activities \n5.3 \nOHS issues to be addressed \n5.4 \nlanguage requirements \n5.5 \nliteracy and numeracy issues \n5.6 \nmore time/additional support to learners \n5.7 \nneed for a broad general education\n\n--- PDF PAGE 36 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n32 \n \nVARIABLE \nRANGE \n6. Verbal and body \nlanguage \nMay refer to: \n6.1 \nlanguage that recognizes and values individual differences \n6.2 \nlanguage that supports inclusivity \n6.3 \nlanguage that is non-discriminatory \n6.4 \nlanguage that does not devalue, denote or derogate \n6.5 \nlanguage that does not suggest fear, mistrust or lack of \nunderstanding \n6.6 \nlanguage that does not label or suggest assumptions about \ncapabilities \n \n7. Documented \nresources \nMay include: \n7.1 \njournals \n7.2 \ninformation technology resources such as the web, hardware \nand software \n7.3 \ntexts and references \n \n8. Support persons \nMay include: \n8.1 \nfamily members \n8.2 \ngovernment officers in specialist support services \n8.3 \ncase workers and personal careers \n8.4 \nadvocates for a person or group \n8.5 \npeer support \n8.6 \ninterpreters \n8.7 \ncommunity representatives \n8.8 \nnote takers \n8.9 \nlibrary personnel \n8.10 technical support \n8.11 human resources personnel \n8.12 administrative personnel \n8.13 career counselors \n8.14 student services officers \n8.15 equity liaison officers \n \n9. Physical environment \nsupport needs \nMay include: \n9.1 \nmodifications to layout of premises \n9.2 \nequipment modifications \n9.3 \nuse of adaptive technologies \n9.4 \nchanges to work schedules \n9.5 \nmodifications to job design \n \n10. OHS issues may \ninclude \nMay include: \n10.1 issues relating to the learner \n10.2 issues relating to the OHS impact on others \n \n11. Generic skills \nMay include: \n11.1 Employability Skills including: \n11.1.1 communication \n11.1.2 teamwork \n11.1.3 problem solving \n11.1.4 initiative and enterprise \n11.1.5 planning and organizing \n11.1.6 self-management \n11.1.7 learning \n11.1.8 technology \n11.2 innovation \n11.3 language, literacy, numeracy and communication skills\n\n--- PDF PAGE 37 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n33"
