        "source_title": "ENSURE A HEALTHY AND SAFE LEARNING ENVIRONMENT",
        "source_text": "--- PDF PAGE 39 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n35 \n \nUNIT OF COMPETENCY : \nENSURE A HEALTHY AND SAFE LEARNING ENVIRONMENT \n \n \nUNIT CODE \n: \n500232107 \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \nensure the health, safety and welfare of learners and candidates. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify Occupational \nHealth and Safety (OHS) \nresponsibilities \n1.1 \nThe purpose and approaches of OHS in the learning environment \nare defined in accordance with OHS standards. \n1.2 \nDocumentation outlining the OHS legal responsibilities of the \nvarious parties in the learning environment is accessed, read and \ninterpreted in accordance with OHS standards \n1.3 \nOrganizational OHS documentation is identified and accessed in \naccordance with standard operating procedures. \n2. Identify hazards in the \nlearning environment \n2.1 \nSources of information are researched and accessed to identify \nhazards common within the industry in which the learning will take \nplace. \n2.2 \nLearning environment is inspected prior to use in consultation with \nvarious parties in order to identify hazards. \n2.3 \nAny specific OHS needs of learners and/or candidates are in \naccordance with OHS standards. \n2.4 \nAny potential hazards created by learners and/or candidates with \nspecific needs are identified in accordance with OHS standards. \n2.5 \nPersonal limitations and responsibilities in identifying hazards are \nrecognized and specialist advisers are consulted in accordance with \nOHS standards. \n3. Assess risks in the \nlearning environment \n3.1 \nLikelihood of injury as a result of exposure to identified hazard/s is \nassessed in accordance with OHS standards. \n3.2 \nSeverity of any potential injury, illness or negative/adverse outcome \narising from the identified hazard is assessed for risk in accordance \nwith OHS standards. \n3.3 \nHazards are prioritized for action in consultation with various parties \nin accordance with OHS standards. \n3.4 \nPersonal limitations in assessing risks are recognized and specialist \nadvisers are consulted in accordance with OHS standards. \n4. Develop and implement \nactions to ensure the \nhealth safety and welfare \nof learners and/or \ncandidates \n4.1 \nRisk controls are developed based on the hierarchy of control in \naccordance with OHS standards. \n4.2 \nRisk control action plan is identified and accessed or formulated in \nconsultation with various parties \n4.3 \nActions within the control and responsibility of the trainer/facilitator \nare implemented in accordance with OHS standards. \n4.4 \nOutstanding risk control actions are referred to the various parties for \nimplementation. \n4.5 \nSupervisory arrangements appropriate to learners and/or \ncandidates levels of knowledge/skill/ experience are monitored to \nensure their health and safety. \n5. Provide appropriate \nOccupational Health and \nSafety (OHS) \nrequirements to learners \nand/or candidates \n5.1 \nLearners and/or candidates are provided with appropriate \ninformation related to OHS \n5.2 \nLearners and/or candidates are assessed for knowledge of OHS \nrequirements. \n5.3 \nLearners and/or candidates are supplied with personal protective \nequipment in accordance with OHS standards. \n6. Monitor Occupational \nHealth and Safety (OHS) \narrangements in the \nlearning environment \n6.1 \nAchievement against the risk control action plan is monitored and \nany issues addressed as appropriate \n6.2 \nThe effectiveness and reliability of existing risk controls are \nconfirmed with relevant parties. \n6.3 \nEffective hazard and incident reporting and investigation processes \nare confirmed on a continuing basis.\n\n--- PDF PAGE 40 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n36 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Approaches of OHS \nMay include: \n1.1 \nthe establishment and maintenance of a healthy and safe \nlearning environment through: \n1.1.1 a consultative approach \n1.1.2 a systems approach \n1.2 \nshared responsibilities for OHS \n1.3 \ntrainer/facilitator familiarization with OHS requirements of the \nspecific learning environment \n \n2. OHS legal \nresponsibilities \nMay include: \n2.1 \nrequirements under legislation relating to OHS and common \nlaw duty of care \n2.2 \nlegislative requirements for consultation \n2.3 \nrequirements under hazard-specific and other OHS \nregulations \n2.4 \nlegislative requirements for reporting and record keeping \nrelated to OHS \n \n3. Various parties \nMay include: \n3.1 \nmanagers/supervisors \n3.2 \ndesignated person for OHS \n3.3 \nemployee OHS representatives \n3.4 \nother people with prior OHS knowledge, for example: \n3.4.1 trainers/facilitators and assessors \n3.4.2 program coordinators \n3.5 \ntraining and/or assessment organization \n \n4. Organizational OHS \ndocumentation \nThe training organization and/or workplace in which the training \nservices take place, and may include: \n4.1 \npolicies and procedures \n4.2 \nincident reports \n4.3 \nemergency procedures \n4.4 \ninduction information \n4.5 \nrisk assessment \n4.6 \nsafety reports \n \n5. Sources of information \nMay include: \n5.1 \nOHS regulatory authorities \n5.2 \nindustry bodies \n5.3 \nsubject and technical specialists including OHS professionals \n5.4 \nhazard and injury reports from similar learning environments\n\n--- PDF PAGE 41 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n37 \n \nVARIABLE \nRANGE \n6. Hierarchy of control \nThe preferred priority for risk control, emphasizing hazard elimination \nand, where this is not possible, risk minimization by such means as: \n6.1 \nsubstitution with a lesser hazard \n6.2 \nisolation of the hazard from people at risk \n6.3 \nengineering controls \n6.4 \nadministrative means (eg, safe work practices, procedures \nand training) \n6.5 \nuse of personal protective equipment \n \n7. Supervisory \narrangements \nMay include: \n7.1 \nLevel of knowledge \n7.2 \nLevel of experience \n7.3 \nrights, responsibilities and obligations of the various parties \n7.4 \nthe code of conduct in the learning environment \n7.5 \ntypes of potential hazardous events/emergencies and required \nresponses \n7.6 \nhazards and their control in the learning environment, \nincluding the use and maintenance of personal protective \nequipment \n \n8. Appropriate \ninformation \nMay include: \n8.1 \nsafe access and egress \n8.2 \nwork procedures \n8.3 \nfirst aid provisions \n8.4 \narrangements in the learning environment for the \nmanagement of OHS, including: \n8.4.1 reporting procedures for hazards, incidents, injuries \nand faulty equipment \n8.4.2 processes to use when injury does occur \n8.4.3 policies and procedures, including staff handbooks\n\n--- PDF PAGE 42 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n38 \nEVIDENCE GUIDE \n \n1. Critical aspects of  \nCompetency   \nAssessment requires evidence that the candidate : \n1.1 \nIdentified OHS responsibilities \n1.2 \nIdentified hazards in the learning environment \n1.3 \nAssessed risks in the learning environment \n1.4 \nDeveloped and implement actions to ensure the health safety \nand welfare of learners and/or candidates \n1.5 \nProvided appropriate OHS requirements to learners and/or \ncandidates \n1.6 \nMonitored OHS arrangements in the learning environment \n \n2. Underpinning \nknowledge and  \nattitude \n2.1 \nrelevant policies, legal requirements, codes of practice and \nnational, for example: \n2.1.1 legislative requirements for information and \nconsultation relevant to safety \n2.1.2 legislative requirements for record keeping related to \nOHS \n2.1.3 legislative requirements for safe workplaces \n2.2 \nOHS roles and responsibilities of employers, the training/ \ntrainers/facilitators, learners and/or candidates, managers and \nsupervisors \n2.3 \nduty of care obligations for training and/or trainers/facilitators \n2.4 \n hazards and risks in the specific industry where learning will \ntake place \n2.5 \ncommon risk control strategies applicable to the industry \nwhere learning and/or will take place \n2.6 \nbasics of a systematic approach to OHS \n2.7 \nsources of information on OHS requirements relevant to the \nspecific industry where learning will take place \n2.8 \norganizational OHS documentation including policies, \nprocedures and risk control strategies \n2.9 \nhierarchy of control as it applies to risks encountered in the \nlearning environment \n2.10 knowledge of the learning environment sufficient to be able to \nidentify hazards and conduct simple risk assessment \n \n3. Underpinning skills \n3.1 \nliteracy skills to: \n3.1.1 access a range of sources of OHS information \n3.1.2 read and understand OHS documentation \n3.1.3 interpret OHS legal requirements \n3.1.4 write hazard and incident reports \n3.1.5 contribute to the development of a risk control action \nplan (if required)\n\n--- PDF PAGE 43 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n39 \n \n \n3.2 \nlanguage skills to: \n3.2.1 communicate and consult with a range of people from \ndifferent levels and backgrounds \n3.2.2 listen and summarize key points, make evaluative \njudgments and articulate verbally \n3.3 \ntechnology skills to: \n3.3.1 use computer hardware and relevant software \n3.3.2 use office/business equipment \n3.4 \nresearch skills to access relevant OHS information \n3.5 \nnegotiation skills \n \n4. Resource Implication \nThe following resources MUST be provided: \n4.1 \naccess to resources and equipment to establish and maintain \nthe safety, health and welfare of the learner and/or candidate \n4.2 \naccess to legislative and training organization documentation \non OHS \n \n5. Method of assessment \nCompetency must be assessed through : \n5.1 \nDemonstration with questioning \n5.2 \nCase Study/Situation \n5.3 \nInterview \n5.4 \nPortfolio Assessment \n \n6. Context for \nassessment \n6.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group\n",
