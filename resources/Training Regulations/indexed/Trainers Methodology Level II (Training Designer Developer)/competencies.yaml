        "source_title": "CONDUCT TRAINING NEEDS ANALYSIS",
        "source_text": "--- PDF PAGE 57 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n53 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nCONDUCT TRAINING NEEDS ANALYSIS \n \nUNIT CODE \n: \nTVT232307 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \nundertake a training needs analysis to identify the training needs \nof individuals or organization. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Develop instruments \nfor TNA \n1.1 \n \n1.2 \n \n1.3 \n \n1.4 \n \n \n \n1.5 \n \nDiscussions are held with clients to identify objectives, \nexpectations and other requirements \nIssues to be addressed are identified and analyzed to \ndetermine impact on client objectives and requirements \nTNA respondents/target group is established based on the \nobjectives and requirements  \nAppropriate method for collecting information and data on \ncurrent, emerging and future training needs is selected and \nresearch plan is developed and finalized with concerned \nperson/s \nTNA instruments are formulated following the prescribed \nformat \n \n2. Administer TNA \ninstrument \n2.1 \n \n2.2 \n \n \nOrientations regarding the study is conducted and TNA \ninstruments are disseminated to identified respondents \nFilled up TNA instruments are gathered in accordance with \nprocedures appropriate to the method selected \n \n3. Analyze TNA results \n3.1 \n \n \n3.2 \n \n3.3 \n \n3.4 \nInformation is analyzed using reliable and valid data analysis \nmethods to determine skills gaps that can be addressed \nthrough training or other intervention \nConclusions on training needs are prepared and supported by \nevidence and consistent with research objectives \nClients are provided with options for meeting identified training \nneeds \nReport is prepared and clients are provided with advice and \nrecommendations on training needs\n\n--- PDF PAGE 58 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n54 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Clients \nClient include but not limited to: \n1.1 \nInternal or external client \n1.2 \nEnterprise \n1.3 \nIndustry sector \n1.4 \nProfessional association \n1.5 \nCommunity organization \n1.6 \nGovernment organization \n \n2. Objectives \nObjectives include but not limited to: \n2.1 \nFocus on individual trainee objectives, such as new skills, \nspecific competencies, target qualifications, career \nadvancement \n2.2 \nFocus on productivity improvement \n2.3 \nFocus on administrative and records management system \n2.4 \nFocus on satisfying legislative or government regulatory \nrequirements \n2.5 \nInvolve specific learning support systems \n2.6 \nReflect individualized organizational training and skill \nrequirements \n2.7 \nBe affected by national policy and funding parameters \n \n3. Methods for collecting \ninformation \n3.1 \nSurveys, interviews, discussions, focus groups \n3.2 \nCritical incident technique \n3.3 \nObservation of personnel at work \n3.4 \nAccessing relevant legislation, policies and practices \n3.5 \nAnalyzing industry/enterprise skills audit reports \n3.6 \nAnalyzing human resource management records/performance \nmanagement records \n3.7 \nReviewing industry publications or reports \n3.8 \nConcept mapping \n3.9 \nJob and task analysis \n3.10 Analyzing assessment or training records \n3.11 Job descriptions analysis \n3.12 Analyzing organizational policy \n3.13 Drive (motivation) pattern identity analysis \n \n4. Concerned person/s \n4.1 \nClients \n4.2 \nEmployees \n4.3 \nGovernment agencies \n4.4 \nManagers/supervisors \n4.5 \nTraining and assessment coordinators \n4.6 \nIndustry group/association \n4.7 \nEmployer/employee representatives \n4.8 \nExternal consultants\n\n--- PDF PAGE 59 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n55 \n \nVARIABLE \nRANGE \n5. Data analysis methods \n5.1 \nQualitative/quantitative analysis \n5.2 \nFeedback on results \n5.3 \nReview of previous research \n5.4 \nPeers review \n5.5 \nData sampling \n5.6 \nStatistical analysis \n \n6. Options \n6.1 \nDeveloping in-house capacity to meet identified needs \n6.2 \nIdentifying training and/or assessment organizations  \n6.3 \nIdentifying specific units of competency, qualifications/courses \n6.4 \nConsultancy services \n6.5 \nTimelines \n6.6 \nUrgency   \n \n7. Advice and \nrecommendations \n7.1 \nShort- and/or long-term recommendations \n7.2 \nSpecified outcomes and strategies \n7.3 \nResource requirements \n7.4 \nProvision of training and/or assessment services \n7.5 \nDesign and review of training programs \n7.6 \nContextualization of competency standards to meet client \ngoals \n7.7 \nAdministrative and management systems \n7.8 \nPerformance management systems \n7.9 \nTraining and professional development principles \n7.10 Reporting and accountability requirements and processes\n\n--- PDF PAGE 60 ---\nTRAINERS METHODOLOGY LEVEL II \nRe-titled   May 2011 \n56 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified objectives, expectations and other requirements for \nconducting the study \n1.2 \nIdentified appropriate study method and developed \ninstruments for TNA \n1.3 \nGathered data and analyzed information using valid analysis \nmethod \n1.4 \nPrepared report with recommendations \n \n2. Underpinning \nknowledge \n2.1 \nCompetency standards and training packages/courses \navailable \n2.2 \nIndustry and enterprise knowledge \n2.2.1 relevant assessment and training strategies \n2.2.2 clients organization’s culture and expectations \n2.2.3 underpinning knowledge and skills to be required in the \nindustry \n2.2.4 changes likely to impact on the industry/sector and \ntraining implications of the changes  \n2.3 \nRange of evaluation and research methodologies (literature \nresearch, job/ task analysis, interview techniques, etc) \n2.4 \nPrinciples of intellectual property  \n2.4.1 ways to give credit when using other’s ideas or work \n2.4.2 training and development strategies \n2.5 \nData retrieval and interpretation system (training needs \nanalysis, functional analysis) \n2.6 \nPolicy, legislations, codes of practice and competency \nstandards \n2.7 \nStatistical analysis \n \n3. Underpinning skills \n3.1 \nResearch skills \n3.2 \nLiteracy skills \n3.3 \nIntegrative skills \n3.4 \nObservation skills \n3.5 \nCommunication skills \n3.6 \nInterpersonal skills \n3.7 \nNumerical skills \n3.8 \nNegotiation and facilitation skills \n3.9 \nProblem-solving skills \n3.10 Applying approaches to analyze issues/ concerns \n3.11 Using audio/video equipment and computer   \n \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nfacilities and equipment relevant to the activity \n4.2 \nresources and materials relevant to the activity \n4.3 \ntime to accomplish the activity \n \n5. Method of assessment \nCompetency may be assessed through: \n5.1 \ninterview \n5.2 \nwritten exam \n5.3 \nthird party report \n5.4 \nportfolio \n5.5 \nwork sample \n \n6. Context for assessment Competency may be assessed individually in the actual workplace or \nthrough accredited institution\n",
