  "source_text": "Section 1. Successful candidates shall be awarded\na National TM Certificate signed by the TESDA Director General.\n\n4.2\nThe Qualification may be acquired through accumulation of TM Certificates of Competency\n(COC) in the following units of competency –\n\n4.2.1 Conduct training-needs analysis\n4.2.2 Develop training curriculum\n4.2.3 Develop learning materials\n4.2.4 Develop E-learning materials\n4.2.5 Develop assessment tools\n4.2.6 Design and develop maintenance system for training facilities\n4.2.7 Facilitate development of competency standards – Elective unit\n\n4.3\nUpon accumulation and submission of the above six (6) TM-COCs acquired, an individual\nshall be issued the National TM II Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic competencies shall be\nintegrated or assessed concurrently with the core units.\n\n4.5\nThe candidate applying for assessment and certification under TM II must be\n\n4.5.1 BS graduate or equivalent\n4.5.2 Holder of TM I qualification\n4.5.3 Certified of National Certificate level that will be handled/facilitated\n\n--- PDF PAGE 97 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n93\n\nLegend\nTrainer\nQualification II\nCompetency Map\nTrainer Qualification\nBASIC\nCOMETENCIES\nLead workplace\nCommunication\nApply math and\nscience principles\nin technical\ntraining\nApply\nenvironmental\nprinciples and\nadvocate\nconservation\nUtilize IT\napplications in\ntechnical training\nLead small teams\nApply work ethics,\nvalues and quality\nprinciples\nWork effectively in\nvocational\neducation and\ntraining\nFoster and\npromote a learning\nculture\nEnsure healthy\nand safe learning\nenvironment\nMaintain and\nenhance\nprofessional\npractice\nDevelop and\npromote\nappreciation for\ncost-benefits of\ntechnical training\nDevelop and\npromote global\nunderstanding of\nlabor markets\nCORE\nCOMPETENCIES\nPlan training\nsessions\nSupervise Work-\nbased learning\nConduct\ncompetency\nassessment\nMaintain training\nfacilities\nUtilize electronic\nmedia in facilitating\ntraining\nFacilitate\ndevelopment of\ncompetency\nstandards\nDevelop\ncompetency\nassessment tools\nDevelop learning\nmaterials\nDevelop learning\nmaterials for E-\nlearning\nConduct training\nneeds analysis\nDevelop training\ncurriculum\nDesign and\ndevelop\nmaintenance\nsystem\nELECTIVE\nCOMPETENCIES\nFacilitate\ndevelopment of\ncompetency\nstandards\nLegend\nTrainer\nQualification II\nCompetency Map\nTrainer Qualification\nBASIC\nCOMETENCIES\nLead workplace\nCommunication\nApply math and\nscience principles\nin technical\ntraining\nApply\nenvironmental\nprinciples and\nadvocate\nconservation\nUtilize IT\napplications in\ntechnical training\nLead small teams\nApply work ethics,\nvalues and quality\nprinciples\nWork effectively in\nvocational\neducation and\ntraining\nFoster and\npromote a learning\nculture\nEnsure healthy\nand safe learning\nenvironment\nMaintain and\nenhance\nprofessional\npractice\nDevelop and\npromote\nappreciation for\ncost-benefits of\ntechnical training\nDevelop and\npromote global\nunderstanding of\nlabor markets\nCORE\nCOMPETENCIES\nPlan training\nsessions\nSupervise Work-\nbased learning\nConduct\ncompetency\nassessment\nMaintain training\nfacilities\nUtilize electronic\nmedia in facilitating\ntraining\nFacilitate\ndevelopment of\ncompetency\nstandards\nDevelop\ncompetency\nassessment tools\nDevelop learning\nmaterials\nDevelop learning\nmaterials for E-\nlearning\nConduct training\nneeds analysis\nDevelop training\ncurriculum\nDesign and\ndevelop\nmaintenance\nsystem\nELECTIVE\nCOMPETENCIES\nFacilitate\ndevelopment of\ncompetency\nstandards\n\n--- PDF PAGE 98 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n94\nDEFINITION OF TERMS\n\n1)\nTrainer – a person who enables a learner or group of learners to develop or acquire\ncompetencies toward performing a particular trade or technical work\n\n2)\nQualification – a cluster of units of competency that meets job roles and is significant in the\nworkplace. It is also a certification awarded to a person on successful completion of a\ncourse and/or in recognition of having demonstrated competencies relevant to an industry\n\n3)\nCurriculum – refers to the specifications for a course or subject (module) which describe\nthe relevant learning experiences a trainee or student undergoes, generally including\nobjectives, content, intended learning outcomes, training methodology, recommended\nassessment tasks, etc.\n\n4)\nCompetency standard – a description of competency formed by the knowledge, abilities,\nskills, comprehension and attitudes required for acceptable performance of a productive\nfunction and established as a reference or requirement for a qualification. Competency\nstandards are made up of units of competency, which are themselves made up of\nelements of competency, together with performance criteria, a range of variables, and an\nevidence guide\n\n5)\nUnit of competency – a component of a competency standard. A unit of competency is a\nstatement of a key function or role in a particular job or occupation\n\n6)\nInstructional design – this covers the planning, delivery and assessment of instruction; the\ninstructional design process includes analyzing a training or performance problem,\ndefining the intended outcomes, determining how to present the content to learners to\nachieve those outcomes, developing the training course according to the designs,\nimplementing the course, and evaluating its effectiveness. Trainers use instructional\ndesign to prepare all types of instruction—courses presented in the classroom, through\nworkbooks, and online.\n\n--- PDF PAGE 99 ---\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the representatives of business, industry, academe and government\nagencies who donated their time and expertise to the development and validation of these\nTraining Regulations.\n\nTHE TECHNICAL WORKING GROUP\n\n\nMr. FELIPE T. TORRES\nConsultant\nGokongwei Brothers Foundation Learning and Development Center\n\n\nMr. ARTHUR LUIS P. FLORENTIN, FPM\nPeople Management Association of the Philippines (PMAP)\nPhilippine Society for Training and Development (PSTD)\n\n\nMs. MARJORIE G. MENDENILLA\nExecutive Director\nTEVSAPHIL\n\n\nMr. FREDELITO N. SUAREZ\nAssociate Director, Academic Services\nMMLDC Foundation, Inc.\n\n\nMr. RODOLFO C. MENGUITA\nTraining Director/HRD Manager\nD. M. Consunji, Inc.\n\n\nMr. VLADIMIR H. SANTOS\nMFI Foundation, Inc.\n\n\nMs. MILAGROS O. HERNANDEZ\nPhilippine Society for Training and Development\n\nMembers of the TESDA Board\n\nThe TESDA Board Standards-Setting and Systems Development Committee\n\nThe Management and Staff of the TESDA Secretariat\nQualifications and Standards Office (QSO)\nCompetency Assessment and Certification Office (CACO)\n\n--- PDF PAGE 100 ---"
