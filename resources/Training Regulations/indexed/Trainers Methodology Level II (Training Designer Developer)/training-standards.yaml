    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourses on Training Design and Development – Trainers Methodology (TM) Level II\n\nDescription:\nThis course is designed to enhance the knowledge, skills, positive attitude and work\nvalues in accordance with the prevailing standards in the Technical -Vocational Education and\nTraining (TVET) sector. This encompasses competencies required of a Level II Technical –\nVocational Trainer to develop training program designs, curricula, learning materials for both\ntraditional and E-learning programs, assessment tools, maintenance systems, and to analyze\ntraining needs of particular clients or institutions.\n\nTo obtain this, all units of competency prescribed for this qualification must be achieved.\nThe elective unit – Facilitate development of competency standards may or may not be bundled\nin the full course.\n\nTVET providers offering the TM Level II may choose to offer modular courses for each of\nthe core competencies.\n\n--- PDF PAGE 90 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n86\nCORE COMPETENCIES\n\nCourse Title: CONDUCTING TRAINING NEEDS ANALYSIS\nSuggested Nominal Duration: 40 Hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Conduct training\nneeds analysis\n1.1 Develop instruments for TNA\n1.2\nAdminister TNA instrument\n1.3 Analyze TNA results\n\n• Lecture/\ndiscussion\n• Self-paced\ninstructions\n• Practical\nexercises\n\n• Written oral\nquestioning\n• Written test\n• Third party\nreport\n• Portfolio\n• Work sample\n\nCourse Title: DEVELOPING TRAINING CURRICULUM\nSuggested Nominal Duration: 40 Hours\n2. Develop training\ncurriculum\n2.1 Establish training need\nrequirements\n2.2 Develop competency–\nbased curriculum\n2.3 Finalize training curriculum\n• Group discussion\n• Simulation\n• Lecture\n• Self –pace\ninstruction\n• Blended delivery\nmethods\n\n• Written test\n• Demonstration\n/questioning\n• Portfolio\n\nCourse Title: DEVELOPING LEARNING MATERIALS\nSuggested Nominal Duration: 120 Hours\n3. Develop\nlearning\nmaterials\n3.1 Analyze the learning materials\nrequirements\n3.2 Design the learning materials\n3.3 Develop the content of the\nlearning materials\n3.4 Review and validate the\nlearning materials\n3.5 Evaluate the design and\ndevelopment process\n\n• Lecture/\ndiscussion\n• Demonstration/a\npplication\n• Oral presentation\n\n• Oral questioning\n• Written\nexamination\n• Demonstration\n(Projects)\n\nCourse Title: DEVELOPING COMPETENCY ASSESSMENT TOOLS\nSuggested Nominal Duration: 40 Hours\n4. Develop\ncompetency\nassessment\ntools\n4.1 Establish Evidence\nRequirements\n4.2 Establish suitable\nAssessment Methods\n4.3 Prepare Assessment Tools\n4.4 Validate Assessment Tools\n• Lecture/\ndiscussion\n• Self-paced\ninstructions\n• Practical\nexercises\n\n• Lecture/\ndiscussion\n• Self-paced\ninstructions\n• Practical\nexercises\n\n--- PDF PAGE 91 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n87\nCourse Title: DEVELOPING LEARNING MATERIALS FOR E-LEARNING\nSuggested Nominal Duration: 120 Hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Develop\nlearning\nmaterials for E-\nlearning\n5.1 Plan for the development of\ndigitally formatted learning\nresources\n5.2 Develop digitally formatted\nresources\n5.3 Test digitally formatted\nlearning resources\n\n• Group discussion\n• Simulation\n• Lecture\n• Self –pace\ninstruction\n\n• Demonstration\n• Oral\nQuestioning\n• Written\nexamination\n• Evaluation of\nwork sample\n\nCourse Title: DESIGN AND DEVELOP MAINTENANCE SYSTEM\nSuggested Nominal Duration: 40 Hours\n6. Design and\ndevelop\nmaintenance\nsystem\n6.1 Verify maintenance\nrequirements\n6.2 Research and plan for facility\nand equipment maintenance\n6.3 Establish maintenance\nsystems\n6.4 Complete maintenance\nprocedures\n6.5 Establish procedures for\nreview of maintenance\nsystems\n\n• Focused group\ndiscussion\n• Brain storming\n• Peer teaching\n• Role playing\n\n• Written test\n• Demonstration\n/questioning\n• Portfolio\n\nELECTIVE COMPETENCY\n\nNote : This unit of competency which the training provider ay or may not offer.\nSuggested Nominal Duration: 40 Hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Facilitate\ndevelopment of\ncompetency\nstandards:\n1.1 Prepare workshop materials\nand venue\n1.2 Facilitate competency\nstandards development\n1.3 Finalize competency\nstandards\n• Lecture/\ndiscussion\n• Self-paced\ninstructions\n• Practical\nexercises\n\n• Interview\n• Oral questioning\n• Demonstration\n\n--- PDF PAGE 92 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n88\nBASIC COMPETENCIES\n\nSuggested Nominal Duration: 128 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\nCommunication\n1.1 Communicate information\nabout workplace processes\n1.2 Lead workplace discussions\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role-playing\n• Brainstorming\n• Observation\n• Interview\n2. Apply math and\nscience\nprinciples in\ntechnical training\n2.1 Identify math and science\nmanifestations in the course\ncontent and the workplace\n2.2 Relate math and science\nconcepts to common and\nworkplace situations\n2.3 Assess trainees’\ninternalization of math and\nscience concepts\n2.4 Introduce further\nenhancements\n• Lecture-\ndiscussion\n• Projects/case\nstudies\n• Demonstration\nwith oral\nquestioning\n• Case problems\n3. Apply\nenvironmental\nprinciples and\nadvocate\nconservation\n3.1 Follow environmental\nworkplace practices\n3.2 Contribute to improve\nenvironmental work\npractices\n3.3 Recognize and report\npotential environmental\nthreats\n• Lecture-\ndiscussion\n• Field visits\n• Direct\nobservation\n• Interview\n4. Utilize IT\napplications in\ntechnical training\n4.1 Set-up work environment\n4.2 Utilize word processing\napplication\n4.3 Utilize presenter application\n4.4 Utilize spread sheet\napplication\n4.5 Utilize internet and www to\ncommunicate and collect\ninformation\n• Lecture-\ndiscussion\n• Practical lab\n• Demonstration\n• Demonstration/\ndirect\nobservation\nwith oral\nquestioning\n• Portfolio\nevaluation\n5. Lead small teams 5.1 Provide team leadership\n5.2 Supervised team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n6. Apply work\nethics, values\nand quality\nprinciples\n6.1 Observe workplace policies\nand guidelines\n6.2 Observe proper conduct in\ndealing with learners and\nparents\n\n• Lecture-\ndiscussion\n• Role-playing/\nsimulation\n• Case studies\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Third-party\nreport\n\n--- PDF PAGE 93 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n89\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7. Work effectively\nin vocational\neducation and\ntraining\n7.1 Work within the vocational\neducation and training policy\nframework\n7.2 Work within the training\norganization’s quality\nframework\n7.3 Manage work and work\nrelationships\n7.4 Perform a client –focused\napproach to work\n• Lecture-\ndiscussion\n• Case studies\n• Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Third-party\nreport\n8. Foster and\npromote an\ninclusive learning\nculture\n8.1 Practice inclusivity\n8.2 Promote and respond to\ndiversity\n8.3 Develop and implement work\nstrategies to support\ninclusivity\n8.4 Promote a culture of learning\n8.5 Monitor and improve work\npractices\n• Lecture-\ndiscussion\n• Role-playing/\nsimulation\n• Field visits\n• Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Third-party report\n9. Ensure healthy\nand safe learning\nenvironment\n9.1 Identify Occupational Health\nand Safety (OHS)\nresponsibilities\n9.2 Identify hazards in the\nlearning environment\n9.3 Assess risks in the learning\nenvironment\n9.4 Develop and implement\nactions