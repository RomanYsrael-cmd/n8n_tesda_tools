  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for TRAINERS METHODOLOGY (TM) LEVEL II.\n\n3.1\nCURRICULUM DESIGN\n\nCourses on Training Design and Development – Trainers Methodology (TM) Level II\n\nDescription:\nThis course is designed to enhance the knowledge, skills, positive attitude and work\nvalues in accordance with the prevailing standards in the Technical -Vocational Education and\nTraining (TVET) sector. This encompasses competencies required of a Level II Technical –\nVocational Trainer to develop training program designs, curricula, learning materials for both\ntraditional and E-learning programs, assessment tools, maintenance systems, and to analyze\ntraining needs of particular clients or institutions.\n\nTo obtain this, all units of competency prescribed for this qualification must be achieved.\nThe elective unit – Facilitate development of competency standards may or may not be bundled\nin the full course.\n\nTVET providers offering the TM Level II may choose to offer modular courses for each of\nthe core competencies.\n\n--- PDF PAGE 90 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n86\nCORE COMPETENCIES\n\nCourse Title: CONDUCTING TRAINING NEEDS ANALYSIS\nSuggested Nominal Duration: 40 Hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Conduct training\nneeds analysis\n1.1 Develop instruments for TNA\n1.2\nAdminister TNA instrument\n1.3 Analyze TNA results\n\n• Lecture/\ndiscussion\n• Self-paced\ninstructions\n• Practical\nexercises\n\n• Written oral\nquestioning\n• Written test\n• Third party\nreport\n• Portfolio\n• Work sample\n\nCourse Title: DEVELOPING TRAINING CURRICULUM\nSuggested Nominal Duration: 40 Hours\n2. Develop training\ncurriculum\n2.1 Establish training need\nrequirements\n2.2 Develop competency–\nbased curriculum\n2.3 Finalize training curriculum\n• Group discussion\n• Simulation\n• Lecture\n• Self –pace\ninstruction\n• Blended delivery\nmethods\n\n• Written test\n• Demonstration\n/questioning\n• Portfolio\n\nCourse Title: DEVELOPING LEARNING MATERIALS\nSuggested Nominal Duration: 120 Hours\n3. Develop\nlearning\nmaterials\n3.1 Analyze the learning materials\nrequirements\n3.2 Design the learning materials\n3.3 Develop the content of the\nlearning materials\n3.4 Review and validate the\nlearning materials\n3.5 Evaluate the design and\ndevelopment process\n\n• Lecture/\ndiscussion\n• Demonstration/a\npplication\n• Oral presentation\n\n• Oral questioning\n• Written\nexamination\n• Demonstration\n(Projects)\n\nCourse Title: DEVELOPING COMPETENCY ASSESSMENT TOOLS\nSuggested Nominal Duration: 40 Hours\n4. Develop\ncompetency\nassessment\ntools\n4.1 Establish Evidence\nRequirements\n4.2 Establish suitable\nAssessment Methods\n4.3 Prepare Assessment Tools\n4.4 Validate Assessment Tools\n• Lecture/\ndiscussion\n• Self-paced\ninstructions\n• Practical\nexercises\n\n• Lecture/\ndiscussion\n• Self-paced\ninstructions\n• Practical\nexercises\n\n--- PDF PAGE 91 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n87\nCourse Title: DEVELOPING LEARNING MATERIALS FOR E-LEARNING\nSuggested Nominal Duration: 120 Hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Develop\nlearning\nmaterials for E-\nlearning\n5.1 Plan for the development of\ndigitally formatted learning\nresources\n5.2 Develop digitally formatted\nresources\n5.3 Test digitally formatted\nlearning resources\n\n• Group discussion\n• Simulation\n• Lecture\n• Self –pace\ninstruction\n\n• Demonstration\n• Oral\nQuestioning\n• Written\nexamination\n• Evaluation of\nwork sample\n\nCourse Title: DESIGN AND DEVELOP MAINTENANCE SYSTEM\nSuggested Nominal Duration: 40 Hours\n6. Design and\ndevelop\nmaintenance\nsystem\n6.1 Verify maintenance\nrequirements\n6.2 Research and plan for facility\nand equipment maintenance\n6.3 Establish maintenance\nsystems\n6.4 Complete maintenance\nprocedures\n6.5 Establish procedures for\nreview of maintenance\nsystems\n\n• Focused group\ndiscussion\n• Brain storming\n• Peer teaching\n• Role playing\n\n• Written test\n• Demonstration\n/questioning\n• Portfolio\n\nELECTIVE COMPETENCY\n\nNote : This unit of competency which the training provider ay or may not offer.\nSuggested Nominal Duration: 40 Hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Facilitate\ndevelopment of\ncompetency\nstandards:\n1.1 Prepare workshop materials\nand venue\n1.2 Facilitate competency\nstandards development\n1.3 Finalize competency\nstandards\n• Lecture/\ndiscussion\n• Self-paced\ninstructions\n• Practical\nexercises\n\n• Interview\n• Oral questioning\n• Demonstration\n\n--- PDF PAGE 92 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n88\nBASIC COMPETENCIES\n\nSuggested Nominal Duration: 128 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\nCommunication\n1.1 Communicate information\nabout workplace processes\n1.2 Lead workplace discussions\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role-playing\n• Brainstorming\n• Observation\n• Interview\n2. Apply math and\nscience\nprinciples in\ntechnical training\n2.1 Identify math and science\nmanifestations in the course\ncontent and the workplace\n2.2 Relate math and science\nconcepts to common and\nworkplace situations\n2.3 Assess trainees’\ninternalization of math and\nscience concepts\n2.4 Introduce further\nenhancements\n• Lecture-\ndiscussion\n• Projects/case\nstudies\n• Demonstration\nwith oral\nquestioning\n• Case problems\n3. Apply\nenvironmental\nprinciples and\nadvocate\nconservation\n3.1 Follow environmental\nworkplace practices\n3.2 Contribute to improve\nenvironmental work\npractices\n3.3 Recognize and report\npotential environmental\nthreats\n• Lecture-\ndiscussion\n• Field visits\n• Direct\nobservation\n• Interview\n4. Utilize IT\napplications in\ntechnical training\n4.1 Set-up work environment\n4.2 Utilize word processing\napplication\n4.3 Utilize presenter application\n4.4 Utilize spread sheet\napplication\n4.5 Utilize internet and www to\ncommunicate and collect\ninformation\n• Lecture-\ndiscussion\n• Practical lab\n• Demonstration\n• Demonstration/\ndirect\nobservation\nwith oral\nquestioning\n• Portfolio\nevaluation\n5. Lead small teams 5.1 Provide team leadership\n5.2 Supervised team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n6. Apply work\nethics, values\nand quality\nprinciples\n6.1 Observe workplace policies\nand guidelines\n6.2 Observe proper conduct in\ndealing with learners and\nparents\n\n• Lecture-\ndiscussion\n• Role-playing/\nsimulation\n• Case studies\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Third-party\nreport\n\n--- PDF PAGE 93 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n89\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7. Work effectively\nin vocational\neducation and\ntraining\n7.1 Work within the vocational\neducation and training policy\nframework\n7.2 Work within the training\norganization’s quality\nframework\n7.3 Manage work and work\nrelationships\n7.4 Perform a client –focused\napproach to work\n• Lecture-\ndiscussion\n• Case studies\n• Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Third-party\nreport\n8. Foster and\npromote an\ninclusive learning\nculture\n8.1 Practice inclusivity\n8.2 Promote and respond to\ndiversity\n8.3 Develop and implement work\nstrategies to support\ninclusivity\n8.4 Promote a culture of learning\n8.5 Monitor and improve work\npractices\n• Lecture-\ndiscussion\n• Role-playing/\nsimulation\n• Field visits\n• Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Third-party report\n9. Ensure healthy\nand safe learning\nenvironment\n9.1 Identify Occupational Health\nand Safety (OHS)\nresponsibilities\n9.2 Identify hazards in the\nlearning environment\n9.3 Assess risks in the learning\nenvironment\n9.4 Develop and implement\nactions to ensure the health\nsafety and welfare of\nlearners and/or candidates\n9.5 Provide appropriate\nOccupational Health and\nSafety (OHS) requirements\nto learners and/or\ncandidates\n9.6 Monitor Occupational Health\nand Safety (OHS)\narrangements in the learning\nenvironment\n• Lecture-discussion\n• Field visits\n• Case studies\n• Demonstration\nwith oral\nquestioning\n• Case problems\n• Interview\n\n10. Maintain and\nenhance profess-\nional practice\n10.1 Model high standards of\nperformance\n10.2 Determine personal\ndevelopment needs\n10.3 Participate in professional\ndevelopment activities\n10.4 Reflect on and evaluate\nprofessional practice\n• Lecture-discussion\n• Role-playing\n• Case studies\n• Reporting/\npresentation\n• Demonstration\nwith oral\nquestioning\n• Interview\n• Written test\n• Written report\n11. Develop and\npromote\nappreciation for\ncosts and\nbenefits of\ntechnical training\n11.1 Study and evaluate training\ncost components and\nbenefits\n11.2 Monitor conduct and results\nof training\n11.3 Promote awareness of costs\nand benefits of training\n• Lecture-discussion\n• Case studies\n•\nCase problems\n•\nWritten exam\n•\nInterview\n•\nWritten report\n\n12. Develop and\npromote\nunderstanding of\nglobal labor\nmarkets.\n12.1 Identify current and future\ntrends/concerns\n12.2 Assess new developments\n12.3 Utilize labor market\ninformation to best effect\n• Lecture-\ndiscussion\n• Case studies\n• Case problems\n• Written exam\n• Interview\n• Oral\npresentation\n\n--- PDF PAGE 94 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n90\n3.2\nTRAINEE ENTRY REQUIREMENTS\n\nCandidate/trainee must reach/possess any of the following qualification:\n\n•\nBS Graduate or equivalent\n•\nCertified at the same or higher NC Level in the qualification that will be handled (for\ntechnical trainers)\n•\nTrainers Methodology Certificate (TMC) I in Trainers Methodology Level I\n(Trainer/Assessor)\n\n3.3\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nTRAINERS METHODOLOGY LEVEL II\n\nRecommended list of tools and materials per trainee for TM II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n\nComputer and\nperipherals\n\nPaper and pencil\n\nLCD projector\n\nAudio video materials\n\nElectronic /Multimedia\nequipment\n\nHand outs\n\nTraining facilities\n/equipment\n(Depending on trade\narea)\n\nReference books\n\nWorkplace or simulated\nenvironment\n\nManuals\n\nDifferent types of forms\n\nMaterials and\nconsumables for\nmaintenance activities\n\n--- PDF PAGE 95 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n91\n3.4\nTRAINING FACILITIES\n\nTRAINERS METHODOLOGY LEVEL II\n\nThe competency-based training environment for the training of trainers must include\ncomponent areas for the following - practical work area, learning resource center, training\nresource and production area, assessment area, quality control and support area.\nAt the minimum, there should be provisions for a lecture and workshop area, learning\nresource area, multimedia/computer/audio-visual laboratory and workshop/production area.\n\n3.5\nTRAINER’S QUALIFICATIONS – Course on Training Design and Development\n\n•\nMust be a holder of Trainers Methodology Level III or higher/equivalent qualification\nor training/experience*\n•\nWith at least five (5) years experience as trainer/teacher\n•\nWith good moral character\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\nMust be a holder of professional teacher license issued by PRC or equivalent**\n•\nMust have 1 year industry experience***\n\n*\nequivalent qualification or training/experience will be accepted only during the transition period toward\nthe Trainers Methodology Levels III and IV when there are few or no holders yet of TM III and TM IV;\nthis period will be further defined by TESDA\n**\nthis applies only to schools prescribing this requirement\n***\noptional; only when required by the hiring institution\n\n3.6\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 96 ---\nTRAINERS METHODOLOGY LEVEL II\nRe-titled May 2011\n92"
