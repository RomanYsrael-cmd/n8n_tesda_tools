      "text": "6 The guidelines on assessment and certification are discussed in detail in the Procedures manual on Assessment and Certification and Guidelines on the implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 73 --- ______________________________________ TR-Fish Products Packaging NC II Promulgated July 2007 71 Package Processed Fish by Vacuum or Ordinary Poly Packing Package Processed Fish by Bottling Package Processed Fish by Canning Follow work procedures to maintain Good Manufacturing Practice Follow work procedures to maintain environmental standards Work with temperature controlled stock Skin, loin and flake fish Operate a high speed wrapping process Operate a packaging process Operate a forklift Inspect and sort materials and product Implement Good Manufacturing Practice Procedures Manually fill cans Maintain the temperature of seafood Clean and sanitize equipment Prepare basic mixes Dispense non bulk ingredients Operate a can seaming process Evaluate a batch of seafood Clean equipment in place Monitor process operation Operate a mixing / blending process Operate pumping equipment Package product using manual packing and labeling equipment Implement environmental policies and procedures Operate basic equipment Process Food by Salting, Curing and Smoking Operate a retort process Operate carton scales Conduct routine maintenance Measure and record workplace information Process Food by Fermentation and Pickling Operate a freezing process Operate carton sealing machine Work in a food handling area for non-food handlers Assemble and prepare cartons Process food by sugar concentration Operate a water purification process Operate scales and semi- automatic labeling machinery Handle dangerous goods/ hazardous substances Pack product manually Package finished / processed food products Pre-process raw materials Operate strapping machine Load and unload goods / cargo Operate automated washing equipment Work in a freezer storage area Operate a steaming/cooking process --- PDF PAGE 74 --- ______________________________________ TR-Fish Products Packaging NC II Promulgated July 2007 72 Continuation ….. Competency Map for Processed Food and Beverages Sector Use product knowledge to complete work operations Use information technology devices and computer applications in the workplace Implement sampling procedures Participate in sensory analysis Perform basic tests Maintain food safety when loading, unloading and transporting food Operate a boiler – basic Operate a waste water treatment system Apply principles of food packaging Manage the implementation of environmental management policies Apply raw materials / ingredients and process knowledge Operate processes in packaging system Set up a production / packaging line for operation Control food contamination and spoilage Manage the implementation of occupational health and safety policies and procedures in the workplace Control and order stock Participate in HACCP team Solve problem using “quality tools” Describe and analyze data using mathematical principles Manage water treatment process Implement the pest prevention program Participate in an audit process Use inventory system to organize stock control Establish process capability Optimize a work process Monitor the implementation of environmental management policies Participate in improvement process Apply understanding of food additives Manage a work area within budget Participate in product recalls Monitor the implementation of Good Manufacturing Practice Procedures Receive and store stock Apply understanding of legal requirements in food product Manage and evaluate new product trials Plan and coordinate maintenance Operate processes in a production system Report on workplace performance Apply basic engineering principles to a food production process Manage internal audits Schedule and manage production --- PDF PAGE 75 --- ______________________________________ TR-Fish Products Packaging NC II Promulgated July 2007 73 Continuation ….. Competency Map for Processed Food and Beverages Sector Apply Food Safety and Sanitation Use Standard Measuring Devices / Instruments Use Food Processing Tools, Equipment and Utensils Perform Mathematical Computation Implement good manufacturing practice procedures Implement environmental policies and procedures Receive and Respond to Workplace Communication Participate in Workplace Communication Lead Workplace Communication Utilize specialist communication Develop Team and Individual Work With Others Work in a Team Environment Lead Small Team Solve Workplace Problems Related to Work Activities Apply Problem Solving Techniques in the Workplace Practice Career Professionalism Practice Occupational Health and Safety Practice housekeeping procedures Demonstrate work values Plan and Organize Work Fish Products Packaging NC II --- PDF PAGE 76 --- ______________________________________ TR-Fish Products Packaging NC II Promulgated July 2007 74 For the purpose of this competency standard, the following words are defined: • Bottling/Canning – refers to a preservation of foods in hermetically sealed containers such as tin cans and glass jars by sterilization with heat • Block – shape, mold or form into a block • Cans – are metal container made of steel base with a thin coating of tin on each side; igve hermetic seal and resistant to heat • Defect – a condition found in a product which fails to meet essential quality, composition and/or labeling provisions of the appropriate product standards. • Dried – preserved by removing natural moisture • Eviscerate – is the removing of internal organs • Exhausting – refers to the removal of air and gases from the raw material and the container before sealing; It refers to the heating of canned foods to a center can temperature of 180°C to 205°F before sealing. • Fresh – Recently made, produced, or harvested; not stale or spoiled. • Freezing - a method of food preservation by storing food at about 0o F • Frozen – preserved by freezing • Fillet – is a slice of fish of irregular size and shape removed from the carcass by cuts made parallel to the back bone. • Fish Processing – refers to the application of heat in varying degree to the fish enclosed in a container for a sufficient time to sterilize the product • Food quality standards- specify consumer and trade requirements as well as affects market acceptability and price • Food safety standards – determine safety of food and human consumption • Glass – rigid, inert and transparent but fragile and heavy. • Hazard Analysis and Critical Control Points (HACCP) - is a systematic preventative approach to food safety that addresses physical, chemical and biological hazards as a means of prevention rather than finished product inspection. --- PDF PAGE 77 --- ______________________________________ TR-Fish Products Packaging NC II Promulgated July 2007 75 • Hermetic Sealing- refers to the closure of food in tin cans or glass jars tightly to prevent the entrance of microorganisms and contamination of products. • Individually Quick Frozen - frozen separately as single units • International Organization for Standardization (ISO) - is an international standard- setting body composed of representatives from national standards bodies. Founded on 1947-02-23, the organization produces world-wide industrial and commercial standards, the so-called ISO standards. • Packaging – the enclosure of products, items or packages in a wrapped pouch, bag, box, cup, tray, can tube, bottle or other container to perform the following functions: containment, protection and/or preservation, communication and utility or performance • Polyethylene - a lightweight thermoplastic, used especially in packaging and insulation • Raw Materials – consist of the main food material to be processed including minor food ingredients • Sanitation - refers to the process of treating food contact and non-food contact surface with physical agents and chemicals to kill the residual microorganisms present after cleaning • Smoked – cured by the process of flavoring, cooking, or preserving food by exposing it to the smoke from burning or smoldering plant materials, most often wood • Sanitation Standard Operating Procedures is the common name give to the sanitation procedures in food production plants which are required by the Food Safety and Inspection Service of the USDA. It is considered one of the prerequisite programs of HACCP • Thermal Processing – refers to the method of processing food in hermetically sealed container by applying heat with the right temperature and time, enough to kill microorganisms responsible in the spoilage of food which involve bottling and canning • Vacuum – a state of pressure reduction below atmosphere. • Vacuum packed product – product that is sealed in a container under the vacuum specified in the scheduled process, the maintenance of which vacuum is critical to the adequacy of scheduled process. --- PDF PAGE 78 --- ______________________________________ TR-Fish Products Packaging NC II Promulgated July 2007 76 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of this Training Regulations. PHILIPPINE CHAMBER OF AGRICULTURE AND FOOD, INC. (PCAFI) Mr. EDWARD F. DAVID PhilFoodEx Rm. 305, Bahay ng Alumni Pres. Ramon Magsaysay Ave. U.P. Campus, Diliman, Quezon City Ms. CECILIA DELA PAZ Nutrivina Phils. Unit 801, Manila Luxury Cond. Pearl Drive cor. Goldloop St., Ortigas Pasig City Mr. JOSE D. GONZALES, JR. Rizal Experimental Station & Pilot School of Cottage Industries Jenny’s Avenue Extn. Maybunga, Pasig City Ms. AURORA C. SUBIDA Maya Kitchen 8th Flr., Liberty Building, Pasay Road Makati City Mr. BOBBY C. PRADEL Mofel’s Food International Corp 20220 Arpilleda St., Makati City Mr. GEORGE LORENZANA Lorenzana Food Corp. 551 M. Naval St., Navotas, Metro Manila Ms. GERTRUDE M. AGUSTIN Food Development Center FTI Complex Taguig, Manila Ms. NORMA C. BORJA Bureau of Fisheries and Aquatic Resources PCA Compound Elliptical Rd Diliman, Quezon City Mr. RAMON M. MACARAIG Alsons Aquaculture Corp Maribulan, Alabel Sarangani Province Ms. ANNA MARIE G.SY Seachamp International Export Corp Bldg. 2 Skydragon Compound Domestic Terminal Rd. Pasay City Ms. DAISY E. TAÑAFRANCA Department of Science and Technology DOST Bldg. Gen. Santos Ave., Bicutan, Taguig, Manila The PARTICIPANTS in the Validation of this Training Regulations • Bureau of Fisheries and Aquatic Resources • Food Development Center • National Fisheries Research and Development Institute • Seachamp International Export Corp"
