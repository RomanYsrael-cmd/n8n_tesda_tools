  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of FISH-PRODUCTS PACKAGING NC II,\nthe candidate must demonstrate competence in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The qualification of Fish-Products Packaging NC II may be attained through\naccumulation of Certificates of Competency (COCs) in the following areas:\n\n4.2.1 Package Processed Fish by Vacuum or Ordinary Poly Packing\n\n4.2.2 Package Processed Fish by Bottling\n\n4.2.3 Package Processed Fish by Canning\n\nSuccessful candidates shall be awarded Certificates of Competency (COCs)\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n 4.5.1 Graduates of formal, non formal and informal including enterprise-\n based training programs.\n\n4.5.2. Experienced workers ( wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\nProcedures manual on Assessment and Certification and Guidelines on the\nimplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 73 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n71\nCOMPETENCY MAP FOR PROCESSED FOOD AND BEVERAGES SECTOR\n\nCORE UNITS OF COMPETENCY\n\nPackage Processed Fish\nby Vacuum or Ordinary\nPoly Packing\n\nPackage Processed Fish by\nBottling\n\nPackage Processed Fish by\nCanning\n\nFollow work procedures to\nmaintain Good Manufacturing\nPractice\n\nFollow work procedures to\nmaintain environmental\nstandards\n\nWork with temperature\ncontrolled stock\n\nSkin, loin and flake fish\n\nOperate a high speed wrapping\nprocess\n\nOperate a packaging process\n\nOperate a forklift\n\n Inspect and sort materials\nand product\n\nImplement Good\nManufacturing Practice\nProcedures\n\nManually fill cans\n\nMaintain the temperature of\nseafood\n\nClean and sanitize\nequipment\n\n Prepare basic mixes\n\nDispense non bulk\ningredients\n\nOperate a can seaming process\n\nEvaluate a batch of seafood\n\nClean equipment in place\n\nMonitor process operation\n\n Operate a mixing / blending\nprocess\n\n Operate pumping equipment\n\n Package product using manual\npacking and labeling equipment\n\n Implement environmental\npolicies and procedures\n\nOperate basic equipment\n\nProcess Food by Salting,\nCuring and Smoking\n\n Operate a retort process\n\n Operate carton scales\n\n Conduct routine\nmaintenance\n\nMeasure and record\nworkplace information\n\n Process Food by\nFermentation and Pickling\n\n Operate a freezing process\n\n Operate carton sealing\nmachine\n\n Work in a food handling\narea for non-food handlers\n\nAssemble and prepare\ncartons\n\n Process food by sugar\nconcentration\n\n Operate a water purification\nprocess\n\n Operate scales and semi-\nautomatic labeling machinery\n\n Handle dangerous goods/\nhazardous substances\n\nPack product manually\n\n Package finished /\nprocessed food products\n\n Pre-process raw materials\n\n Operate strapping machine\n\n Load and unload goods /\ncargo\n\nOperate automated\nwashing equipment\n\nWork in a freezer storage\narea\n\n Operate a steaming/cooking\nprocess\n\n--- PDF PAGE 74 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n72\nContinuation ….. Competency Map for Processed Food and Beverages Sector\n\nCORE UNITS OF COMPETENCY\n Use product knowledge to\ncomplete work operations\n\nUse information technology\ndevices and computer\napplications in the workplace\n\nImplement sampling procedures\n\nParticipate in sensory analysis\n\nPerform basic tests\nMaintain food safety when\nloading, unloading and\ntransporting food\n\n Operate a boiler – basic\n\nOperate a waste water treatment\nsystem\n\nApply principles of food\npackaging\n\nManage the implementation\nof environmental\nmanagement policies\n\nApply raw materials /\ningredients and process\nknowledge\n\n Operate processes in\npackaging system\n\nSet up a production / packaging\nline for operation\n\n Control food contamination and\nspoilage\n\n Manage the implementation\nof occupational health and\nsafety policies and\nprocedures in the workplace\n Control and order stock\n\n Participate in HACCP team\n\n Solve problem using “quality\ntools”\n\n Describe and analyze data\nusing mathematical principles\n\nManage water treatment\nprocess\n\n Implement the pest\nprevention program\n\n Participate in an audit\nprocess\n\nUse inventory system to organize\nstock control\n\n Establish process capability\n\n Optimize a work process\n Monitor the\nimplementation of\nenvironmental\nmanagement policies\n\n Participate in improvement\nprocess\n\nApply understanding of food\nadditives\n\n Manage a work area within\nbudget\n\n Participate in product\nrecalls\n\n Monitor the\nimplementation of Good\nManufacturing Practice\nProcedures\n\n Receive and store stock\n\n Apply understanding of legal\nrequirements in food product\n\nManage and evaluate new\nproduct trials\n\nPlan and coordinate\nmaintenance\nOperate processes in a\nproduction system\n\n Report on workplace\nperformance\n\nApply basic engineering\nprinciples to a food production\nprocess\n\n Manage internal audits\n\n Schedule and manage\nproduction\n\n--- PDF PAGE 75 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n73\nContinuation ….. Competency Map for Processed Food and Beverages Sector\n\nCOMMON UNITS OF COMPETENCY\n\nApply Food Safety and\nSanitation\n\nUse Standard Measuring\nDevices / Instruments\n\nUse Food Processing Tools,\nEquipment and Utensils\n\nPerform Mathematical\nComputation\n\nImplement good\nmanufacturing practice\nprocedures\n\nImplement environmental\npolicies and procedures\n\nBASIC UNITS OF COMPETENCY\n\nReceive and Respond to\nWorkplace\nCommunication\n\nParticipate in Workplace\nCommunication\n\nLead Workplace Communication\n\nUtilize specialist communication\n\nDevelop Team and\nIndividual\nWork With Others\n\nWork in a Team\nEnvironment\n\nLead Small Team\n\nSolve Workplace Problems\nRelated to Work Activities\n\nApply Problem Solving\nTechniques in the Workplace\nPractice Career\nProfessionalism\n\nPractice Occupational\nHealth and Safety\n\nPractice housekeeping\nprocedures\n\nDemonstrate work values\n\nPlan and Organize Work\n\n Fish Products Packaging NC II\n\n--- PDF PAGE 76 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n74\nDEFINITION OF TERMS\n\nFor the purpose of this competency standard, the following words are defined:\n\n• Bottling/Canning – refers to a preservation of foods in hermetically sealed\ncontainers such as tin cans and glass jars by sterilization with heat\n\n• Block – shape, mold or form into a block\n\n• Cans – are metal container made of steel base with a thin coating of tin on each\nside; igve hermetic seal and resistant to heat\n\n• Defect – a condition found in a product which fails to meet essential quality,\ncomposition and/or labeling provisions of the appropriate product standards.\n\n• Dried – preserved by removing natural moisture\n\n• Eviscerate – is the removing of internal organs\n\n• Exhausting – refers to the removal of air and gases from the raw material and the\ncontainer before sealing; It refers to the heating of canned foods to a center can\ntemperature of 180°C to 205°F before sealing.\n\n• Fresh – Recently made, produced, or harvested; not stale or spoiled.\n\n• Freezing - a method of food preservation by storing food at about 0o F\n\n• Frozen – preserved by freezing\n\n• Fillet – is a slice of fish of irregular size and shape removed from the carcass by cuts\nmade parallel to the back bone.\n\n• Fish Processing – refers to the application of heat in varying degree to the fish\nenclosed in a container for a sufficient time to sterilize the product\n\n• Food quality standards- specify consumer and trade requirements as well as\naffects market acceptability and price\n\n• Food safety standards – determine safety of food and human consumption\n\n• Glass – rigid, inert and transparent but fragile and heavy.\n\n• Hazard Analysis and Critical Control Points (HACCP) - is a systematic\npreventative approach to food safety that addresses physical, chemical and\nbiological hazards as a means of prevention rather than finished product inspection.\n\n--- PDF PAGE 77 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n75\n• Hermetic Sealing- refers to the closure of food in tin cans or glass jars tightly to\nprevent the entrance of microorganisms and contamination of products.\n\n• Individually Quick Frozen - frozen separately as single units\n\n• International Organization for Standardization (ISO) - is an international standard-\nsetting body composed of representatives from national standards bodies. Founded\non 1947-02-23, the organization produces world-wide industrial and commercial\nstandards, the so-called ISO standards.\n\n• Packaging – the enclosure of products, items or packages in a wrapped pouch, bag,\nbox, cup, tray, can tube, bottle or other container to perform the following functions:\ncontainment, protection and/or preservation, communication and utility or\nperformance\n\n• Polyethylene - a lightweight thermoplastic, used especially in packaging and\ninsulation\n\n• Raw Materials – consist of the main food material to be processed including minor\nfood ingredients\n\n• Sanitation - refers to the process of treating food contact and non-food contact\nsurface with physical agents and chemicals to kill the residual microorganisms\npresent after cleaning\n\n• Smoked – cured by the process of flavoring, cooking, or preserving food by\nexposing it to the smoke from burning or smoldering plant materials, most often\nwood\n\n• Sanitation Standard Operating Procedures is the common name give to the\nsanitation procedures in food production plants which are required by the Food\nSafety and Inspection Service of the USDA. It is considered one of the prerequisite\nprograms of HACCP\n\n• Thermal Processing – refers to the method of processing food in hermetically\nsealed container by applying heat with the right temperature and time, enough to kill\nmicroorganisms responsible in the spoilage of food which involve bottling and\ncanning\n\n• Vacuum – a state of pressure reduction below atmosphere.\n\n• Vacuum packed product – product that is sealed in a container under the vacuum\nspecified in the scheduled process, the maintenance of which vacuum is critical to\nthe adequacy of scheduled process.\n\n--- PDF PAGE 78 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n76\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of this Training Regulations.\n\nPHILIPPINE CHAMBER OF AGRICULTURE AND FOOD, INC. (PCAFI)\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nMr. EDWARD F. DAVID\nPhilFoodEx\nRm. 305, Bahay ng Alumni\nPres. Ramon Magsaysay Ave.\nU.P. Campus, Diliman, Quezon City\nMs. CECILIA DELA PAZ\nNutrivina Phils.\nUnit 801, Manila Luxury Cond.\nPearl Drive cor. Goldloop St., Ortigas\nPasig City\nMr. JOSE D. GONZALES, JR.\nRizal Experimental Station & Pilot School\n of Cottage Industries\nJenny’s Avenue Extn.\nMaybunga, Pasig City\nMs. AURORA C. SUBIDA\nMaya Kitchen\n8th Flr., Liberty Building, Pasay Road\nMakati City\nMr. BOBBY C. PRADEL\nMofel’s Food International Corp\n20220 Arpilleda St., Makati City\nMr. GEORGE LORENZANA\nLorenzana Food Corp.\n551 M. Naval St., Navotas, Metro\nManila\n\nMs. GERTRUDE M. AGUSTIN\nFood Development Center\nFTI Complex\nTaguig, Manila\nMs. NORMA C. BORJA\nBureau of Fisheries and Aquatic\nResources\nPCA Compound Elliptical Rd\nDiliman, Quezon City\nMr. RAMON M. MACARAIG\nAlsons Aquaculture Corp\nMaribulan, Alabel\nSarangani Province\nMs. ANNA MARIE G.SY\nSeachamp International Export Corp\nBldg. 2 Skydragon Compound\nDomestic Terminal Rd.\nPasay City\nMs. DAISY E. TAÑAFRANCA\nDepartment of Science and Technology\nDOST Bldg. Gen. Santos Ave., Bicutan,\nTaguig, Manila\n\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n• Bureau of Fisheries and Aquatic Resources\n• Food Development Center\n• National Fisheries Research and Development Institute\n• Seachamp International Export Corp"
