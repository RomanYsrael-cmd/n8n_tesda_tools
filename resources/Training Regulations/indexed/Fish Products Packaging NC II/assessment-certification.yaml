  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of FISH-PRODUCTS PACKAGING NC II,\nthe candidate must demonstrate competence in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The qualification of Fish-Products Packaging NC II may be attained through\naccumulation of Certificates of Competency (COCs) in the following areas:\n\n4.2.1 Package Processed Fish by Vacuum or Ordinary Poly Packing\n\n4.2.2 Package Processed Fish by Bottling\n\n4.2.3 Package Processed Fish by Canning\n\nSuccessful candidates shall be awarded Certificates of Competency (COCs)\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n 4.5.1 Graduates of formal, non formal and informal including enterprise-\n based training programs.\n\n4.5.2. Experienced workers ( wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\nProcedures manual on Assessment and Certification and Guidelines on the\nimplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 73 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n71\n"
