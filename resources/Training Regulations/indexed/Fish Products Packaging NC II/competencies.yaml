          "source_text": "1. Identify \nrequirements of \nGMP related to \nown work \n1.1. \nSources of information on GMP requirements are \nlocated  \n1.2. \nGMP requirements and responsibilities related to own \nwork are identified \n2. Observe personal \nhygiene and \nconduct to meet \nGMP requirements \n2.1. \nPersonal hygiene meets GMP requirements  \n2.2. \nClothing is prepared, used, stored and disposed of \naccording to GMP and workplace procedures \n2.3. \nPersonal movement around the workplace complies with \narea entry and exit procedures\n3. Implement GMP \nrequirements when \ncarrying out work \nactivities \n3.1. \nGMP requirements are identified \n3.2. \nWork area, materials, equipment and product are \nroutinely monitored to ensure compliance with GMP \nrequirements \n3.3. \nRaw materials, packaging components and product are \nhandled according to GMP and workplace procedures \n3.4. \nWorkplace procedures to control resource allocation and \nprocess are followed to meet GMP requirements \n3.5. \nCommon forms of contamination are identified and \nappropriate control measures are followed according to \nGMP requirements \n3.6. \nThe workplace is maintained in a clean and tidy order to \nmeet GMP housekeeping standards\n4. Participate in \nimproving GMP \n4.1. \nProcesses, practices or conditions which could result in \nnon-compliance with GMP are identified and reported \naccording to workplace reporting requirements \n4.2. \nCorrective action is implemented within level of \nresponsibility  \n4.3.\nGMP issues are raised with designated personnel\n\n--- PDF PAGE 35 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n33\n5. Participate in \nvalidation \nprocesses \n5.1. Validation procedures are followed to GMP requirements \n5.2. Issues arising from validation are raised with designated \npersonnel \n5.3. Validation procedures are documented to meet GMP \nrequirements\n6. Complete \nworkplace \ndocumentation to \nsupport GMP \n6.1. Documentation and recording requirements are identified\n6.2. Information is recorded according to workplace \nreporting procedures to meet GMP requirements\n\n--- PDF PAGE 36 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n34\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OH&S \nrequirements may \ninclude: \n1.1. \nOH&S legal requirements \n1.2. \nEnterprise OH&S policies, procedures and \nprograms\n2. Work in carried out \nin accordance with \nregulations. \nRegulatory \nrequirements may \ninclude: \n2.1. \nRelevant regulations regarding food processing \nand food safety regulations \n2.2. \nDepartment of Health – Food Establishments – \nCode of Sanitation of the Philippines (P.D.856) \n2.3. \nEnvironment Management Bureau regulations \nregarding emissions, waste treatment, noise and \neffluent treatment and control\n3. Hygiene and \nsanitation \nrequirements may \ninclude: \n3.1. \nDepartment of Health – Food Establishments – \nCode of Sanitation of the Philippines (P.D.856) \n3.2. \nRequirements set out by Bureau of Food and \nDrugs \n3.3.\nWorkplace requirements\n4. Workplace \nrequirements may \ninclude: \n4.1. \nWork instructions \n4.2. \nStandard operating procedures \n4.3. \nOH&S requirements \n4.4. \nQuality assurance requirements \n4.5. \nEquipment manufacturers’ advice \n4.6. \nMaterial Safety Data Sheets \n4.7.\nCodes of Practice and related advice\n5. Products may \ninclude \n5.1. \nProducts, raw materials, packaging components \nand consumables, part-processed product, finished \nproduct and cleaning materials\n6. Responsibility and \nreporting systems \n6.1. \nResponsibility for applying Good Manufacturing \nPractice relates to the person’s work area \n6.2. \nReporting systems may include electronic and \nmanual data recording and storage systems\n\n--- PDF PAGE 37 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n35"
