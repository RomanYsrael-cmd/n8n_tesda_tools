        "source_title": "USE FOOD PROCESSING TOOLS, EQUIPMENT AND UTENSILS",
        "source_text": "--- PDF PAGE 26 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n24\nUNIT OF COMPETENCY: USE  FOOD PROCESSING TOOLS,  EQUIPMENT AND     \nUTENSILS \n \nUNIT CODE  \n \n: AGR741203 \n \nUNIT  DESCRIPTOR:  This unit deals with the skills, knowledge and attitudes required \nto operate food processing tools,  equipment and instruments  in \nthe workplace. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform Pre-\nOperation Activities  \n1.1  Appropriate tools and equipment/utensils are \nassembled according to food processing methods \n \n1.2  Food processing tools and equipment/utensils \nare inspected and checked according to \nmanufacturer’s specifications \n \n1.3  Food processing equipment is set up, adjusted  \nand readied according to job requirements \n2. Operate Food \nprocessing Equipment \n \n \n \n \n \n \n2.1  Food processing equipment is switched on  \naccording to manufacturer’s specifications \n \n2.2  Performance of food processing equipment is  \nchecked to ensure conformity with specified output \n \n2.3. \nOperation of food processing equipment is \nmanaged to achieve planned outcomes \n \n2.4. \nMinor trouble shooting on food processing tools, \nequipment and utensils is performed when \nnecessary \n \n3. Perform Post-\nOperation Activities \n3.1  Food processing equipment is switched off and \nunplugged after  operation in accordance with \nmanufacturer’s specifications \n \n3.2     Food processing tools, equipment and instruments \nare cleaned, sanitized and stowed as required \naccording to manufacturer’s specifications and \nworkplace policies and regulations \n \n3.3    Minor preventive maintenance on equipment is \nperformed in line with organization’s maintenance \nsystem \n \n3.4     Main machine parts are inspected and checked in \nline with organization’s policy \n \n3.5     Condition of machine is monitored to ensure \nserviceability  in accordance with workplace rules \nand regulation\n\n--- PDF PAGE 27 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n25\n \n \n \nRANGE OF VARIABLES \nVARIABLES\nRANGE\n1.  Food Processing Methods\nFood Processing Methods include: \n \n1.1 Salting \n1.2 Curing \n1.3 Smoking \n1.4 Fermentation \n1.5 Pickling \n1.6 Canning  \n1.7 Bottling \n1.8 Sugar concentration \n1.9 Drying  \n1.10 Dehydration \n2.   Food Processing Tools, \nEquipment and  Utensils \nTools, Equipment and Utensils may include but not \nlimited to:  \n2.1 Cold storage equipment like chiller, refrigerator, \nfreezer \n2.2 Jack lifts and trolleys \n2.3 Weighing scale of various capacities and \nsensitivities \n2.4 Smokehouse \n2.5 Oven \n2.6 Fermentation vats \n2.7 Sealers (can and plastic) \n2.8 Cutting implements such as knives, peelers, slicer, \ncutter \n2.9 Kitchen utensils like casserole, colanders, bowls, \nfood tongs  \n2.10 Strainers, basting spoon paddle, steamer \nexhauster \n2.11 Exhaust box, steam jacketed kettle lifter, wire \nbaskets, chopping boards, vegetable cutter, \nosterizer\n\n--- PDF PAGE 28 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n26\n \n3. Manufacturer’s \nSpecifications \nManufacturer’s specifications may include but not \nlimited to: \n \n3.1  Handling requirements \n3.2  Operating requirements \n3.3  Discharge Label \n3.4  Reporting \n3.5  Testing \n3.6  Positioning \n3.7  Refilling  \n4.  Minor Preventive Machine \nMaintenance \nMinor Preventive  Machine Maintenance may include  \nbut not limited to checking of the following: \n \n4.1  Machine temperature \n4.2   Hydraulic fluid \n4.3   Wear and surface condition \n4.4   Crack \n4.5   Leak detection \n4.6  Vibration \n4.7  Corrosion/erosion \n4.8  Electric insulation \n5. Condition of Machine \n5.1 Serviceable \n5.2 Repairable \n5.3 Defective\n\n--- PDF PAGE 29 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n27\n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Assembled, inspected, checked and sanitized \nappropriate tools and equipment/instruments  \n1.2 Set-up, adjusted and readied tools and equipment \nand instruments according to requirements \n1.3 Operated and monitored performance of equipment \nto ensure specified output \n1.4 Performed post operation activities \n1.5 Performed minor trouble shooting on food \nprocessing tools, equipment and utensils\n2. Underpinning Knowledge \n2.1 Equipment, tools and  instruments: Uses and \nSpecifications \n2.2 Equipment, tools and instruments: Parts and \nFunctions \n2.3 Sanitizing agents: Uses and Specification \n2.4 Minor preventive maintenance \n2.5 Proper stowing of tools and equipment/instruments \n2.6  Minor trouble shooting \n2.5 Interpreting manufacturer’s specifications \n2.6 Equipment/machine wear and tear process\n3. Underpinning Skills \n3.1 Equipment/machine parts tear down and assembly \n3.2 Inspecting and checking condition of \nequipment/machines before, during and after \noperation \n3.3 Performing minor trouble shooting \n3.4 Performing minor preventive maintenance \n3.5 Reporting equipment/machine, tools, instruments \nbreakdown and recording same in standard forms\n4. Resource Implications \nThe following resources must be provided: \n4.1 Work area/station \n4.2 Materials, tools and equipment relevant to the Unit \nof Competency\n5. Methods of Assessment \nCompetency in this unit must be assessed through: \n5.1 Direct observation and questioning of a candidate \noperating \nfood \nprocessing \ntools \nand \nequipment/instruments \n5.2 Submission of written report on the performance \nand condition of equipment/machine, tools, \ninstruments used. \n6. Context of Assessment \n6.1 Assessment should occur on the job or in a \nsimulated workplace\n",
