        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Inspected appropriate packaging materials and\nequipment according to workplace requirements\n1.2 Sanitized packaging materials and equipment\naccording to standard operating procedures\n1.3 Reported breakdowns and completed documentation in\npackaging equipment according to workplace\nprocedures\n1.4 Packaged processed fish product according to\nspecifications under food quality and safety standards\n1.5 Labeled packaging material according to company’s\nregulations and BFAD requirements\n1.6 Checked condition of processed fish product according\nto established standards\n1.7 Properly and safely stored the processed fish product\naccording to temperature requirements.\n2. Underpinning\nKnowledge\n2.1 Safety Practices\n2.1.1 Proper waste disposal\n2.1.2 Environmental protection and concerns\n2.1.3 Fish products safety principles and practices\n2.1.4 Fish products handling practices\n2.1.5 Good grooming & personal hygiene\n2.2 Communication\n2.2.1 Recording and documenting of production data\n2.2.2 Reporting of defects/breakdown to immediate\nhead/supervisor\n2.3 Mathematics and Measurements\n2.3.1 Weights, measure, conversions\n2.3.2 Basic accounting procedures\n2.3.3 Ratios, proportions and percentages\n2.3.4 Basic mathematical operations\n2.4 Codes & Regulations\n2.4.1 Good quality system principles\n 2.4.2 ISO, HACCP, SSOP\n2.4.5 Good Manufacturing Practices\n2.4.6 BFAD\n2.5 Materials, Tools & Equipment: Uses and Specifications\n 2.5.1 Packaging materials\n 2.5.2 Packaging equipment\n 2.5.3 Labeling materials\n2.6 Systems, Processes and Operations\n2.6.1 Packaging procedure and techniques\n 2.6.2 Labeling procedures and techniques\n 2.6.3 Using various packaging equipment and tools\n 2.6.4 Exhausting, Retorting and Cooling\n\n--- PDF PAGE 57 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n55\n\n3. Underpinning Skills\n3.1 Oral & written communication skills\n3.2 Sanitary handling practices\n3.3 Package checks and inspection\n3.4 Recording and reporting skills\n4. Resource Implications\nThe following resources must be provided:\n4.1 Work area/station\n4.2 Equipment used to package processed fish products\n4.3 Materials relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Portfolio (submission of work samples)\n5.3Demonstration with oral questioning\n6. Context of Assessment 6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 58 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n56\n\nUNIT OF COMPETENCY: PACKAGE PROCESSED FISH BY CANNING\n\nUNIT CODE :"
        },
        "source_text": "AGR826302\n\nUNIT DESCRIPTOR : This unit deals with the knowledge, skills and attitudes\nrequired to package processed fish by bottling. It also\nencompasses understanding of the different fish-\nprocessing steps such as exhausting, retorting and cooling.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect Packaging\nMaterials, Tools and\nEquipment\n\n1.1. Packaging materials are inspected for visual defects\nand reported to supervisor for appropriate action.\n1.2. Packaging materials, tools and equipment are\nsanitized according to standard operating procedures.\n1.3. Packaging equipment for bottling is checked for the\nrequired settings in accordance with standard\noperating procedures.\n1.4. Breakdown in packaging equipment are reported to\nsupervisor for appropriate action.\n1.5. Required documentation for packaging materials, tools\nand equipment is completed according to workplace\nrequirements.\n2. Perform Bottling of\nProcessed Fish\n\n2.1\nProcessed fish products after preparatory\noperations are inspected visually for normal\ncharacteristics in accordance with manufacturer’s\nspecifications.\n2.2 Downgraded/Rejected processed fish products are\ndisposed according to company’s policy.\n2.3 Processed fish are filled in bottles and added with\ningredients according to specifications.\n2.4 Sealing compound of caps are checked prior to\nsealing.\n2.5 Bottles are sealed immediately after exhausting to\nmeet the required temperature as per established\npractice.\n2.6 Bottled fish products are tamper proof sealed (if\napplicable) after retorting and cooling according to\napproved specifications.\n2.7 Bottled fish products are appropriately labeled with\ninformation in accordance to manufacturer’s\nspecifications.\n\n--- PDF PAGE 53 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n51\nELEMENT\nPERFORMANCE CRITERIA\n3. Perform Post-Bottling\nProcedures\n3.1 Bottled fish products are filled in master carton and\nsealed according to specifications.\n3.2 Packaged fish products in cartons are strapped and\ntransferred to pallet for storing according to\nspecifications.\n3.3 Bottled fish products are checked of certain\nconditions in accordance to established standards.\n\n3.4 Random sampling is conducted prior to storage.\n3.5 Packaged fish products are labeled and stored\naccording to required temperature.\n\n--- PDF PAGE 54 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n52\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Packaging Materials\nPackaging materials may include but not limited to:\n1.1 Glass containers\n1.2 Caps\n1.3 Tamper proof seal\n1.4 Cartons(master)\n1.5Carton strap\n2. Defects\nDefects may include but not limited to:\n2.1 Crizzle fin\n2.2 Bent neck\n2.3 Offset\n2.4 Chip\n2.6 Thin shoulder\n2.7 Stone\n2.8 Dirt\n2.9 Broken caps\n3. Packaging Equipment\nBottling equipment may include but not limited to:\n3.1 Weighing scales\n3.2 Plastic sealer\n3.3 Strapping\n3.4Tape/Adhesive dispenser\n4. Processed Fish\n4.1 Steamed\n4.2 Smoked\n4.3 Dried\n4.4 Fried\n4.5 Salted\n5. Preparatory Operations\n5.1 Wash\n5.2 Eviscerate\n5.3 Cut\n5.4 Clean\n5.5 Drip dry\n6. Characteristics\n6.1 No head\n6.2 No tail\n6.3 No foreign materials\n6.4 No discoloration\n6.5 Pleasant smell\n7. Ingredients\n7.1 Carrots\n7.2 Peppercorn\n7.3 Chili\n7.4 Salt\n7.5 Bay leaf\n7.6 Pickles\n7.7 Cloves\n7.8 Monosodium glutamate\n\n--- PDF PAGE 55 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n53\n\nVARIABLE\nRANGE\n8. Information\nInformation may include but not limited to:\n8.1 Production date\n8.2 Best before date\n8.3. Ingredients\n8.4. Brand\n8.5 Quantity of Content\n8.6 Nutritional Facts\n9. Conditions\n9.1 Package/Container inspection\n9.2 Fish product spoilage and damage\n9.3 Proper label\n\n--- PDF PAGE 56 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n54\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Inspected appropriate packaging materials and\nequipment according to workplace requirements\n1.2 Sanitized packaging materials and equipment\naccording to standard operating procedures\n1.3 Reported breakdowns and completed documentation in\npackaging equipment according to workplace\nprocedures\n1.4 Packaged processed fish product according to\nspecifications under food quality and safety standards\n1.5 Labeled packaging material according to company’s\nregulations and BFAD requirements\n1.6 Checked condition of processed fish product according\nto established standards\n1.7 Properly and safely stored the processed fish product\naccording to temperature requirements.\n2. Underpinning\nKnowledge\n2.1 Safety Practices\n2.1.1 Proper waste disposal\n2.1.2 Environmental protection and concerns\n2.1.3 Fish products safety principles and practices\n2.1.4 Fish products handling practices\n2.1.5 Good grooming & personal hygiene\n2.2 Communication\n2.2.1 Recording and documenting of production data\n2.2.2 Reporting of defects/breakdown to immediate\nhead/supervisor\n2.3 Mathematics and Measurements\n2.3.1 Weights, measure, conversions\n2.3.2 Basic accounting procedures\n2.3.3 Ratios, proportions and percentages\n2.3.4 Basic mathematical operations\n2.4 Codes & Regulations\n2.4.1 Good quality system principles\n 2.4.2 ISO, HACCP, SSOP\n2.4.5 Good Manufacturing Practices\n2.4.6 BFAD\n2.5 Materials, Tools & Equipment: Uses and Specifications\n 2.5.1 Packaging materials\n 2.5.2 Packaging equipment\n 2.5.3 Labeling materials\n2.6 Systems, Processes and Operations\n2.6.1 Packaging procedure and techniques\n 2.6.2 Labeling procedures and techniques\n 2.6.3 Using various packaging equipment and tools\n 2.6.4 Exhausting, Retorting and Cooling\n\n--- PDF PAGE 57 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n55\n\n3. Underpinning Skills\n3.1 Oral & written communication skills\n3.2 Sanitary handling practices\n3.3 Package checks and inspection\n3.4 Recording and reporting skills\n4. Resource Implications\nThe following resources must be provided:\n4.1 Work area/station\n4.2 Equipment used to package processed fish products\n4.3 Materials relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Portfolio (submission of work samples)\n5.3Demonstration with oral questioning\n6. Context of Assessment 6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 58 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n56\n\nUNIT OF COMPETENCY: PACKAGE PROCESSED FISH BY CANNING\n\nUNIT CODE :"
