        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Inspected appropriate packaging materials and\nequipment according to workplace requirements\n1.2 Sanitized packaging materials, tools and equipment\naccording to standard operating procedures\n1.3 Labeled packaging material according to company’s\nregulations and BFAD requirements\n1.4 Reported breakdowns and completed documentation in\npackaging equipment according to workplace\nprocedures\n1.5 Packaged processed fish products according to quality\nand safety standards\n1.6 Checked condition of packaged fish products according\nto established standards\n1.7 Properly and safely stored the labeled packaged fish\nproduct according to temperature requirements\n2. nderpinning\nKnowledge\n2.1 Safety Practices\n2.1.1 Proper waste disposal\n2.1.2 Environmental protection and concerns\n2.1.3 Fish products safety principles and practices\n2.1.4 Fish products handling practices\n2.1.5 Good grooming & personal hygiene\n\n2.2 Communication\n2.2.1 Recording and documenting of production data\n2.2.2 Reporting of defects/breakdown to immediate\nhead/supervisor\n\n2.3 Mathematics and Measurements\n2.3.1 Weights, measure, conversions\n2.3.2 Basic accounting procedures\n2.3.3 Ratios, proportions and percentages\n2.3.4 Basic mathematical operations\n2.4 Codes & Regulations\n2.4.1 Good quality system principles\n 2.4.2 ISO, HACCP, SSOP\n2.4.3 Good Manufacturing Practices\n2.4.4 BFAD\n\n2.5\nMaterials & Equipment: Uses and Specifications\n2.5.1 Packaging materials and labels\n2.5.2 Packaging equipment\n\n2.6\nSystems, Processes and Operations\n2.6.1 Packaging procedure and techniques\n2.6.2 Labeling procedures and techniques\n2.6.3 Using various packaging equipment\n\n--- PDF PAGE 51 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n49\n3. Underpinning Skills\n3.1\nOral & written communication skills\n3.2\nSanitary handling practices\n3.3\nPackage checks and inspection\n3.4\nRecording and reporting skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Work area/station\n4.2 Equipment used to package processed fish products\n4.3Materials relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Portfolio (submission of work samples)\n5.3Demonstration with oral questioning\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 52 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n50\nUNIT OF COMPETENCY: PACKAGE PROCESSED FISH BY BOTTLING\n\nUNIT CODE :"
