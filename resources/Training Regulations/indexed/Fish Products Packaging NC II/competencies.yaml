        "source_title": "PACKAGE PROCESSED FISH BY VACUUM OR ORDINARY POLY-PACKING",
        "source_text": "--- PDF PAGE 46 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n44\n \nCORE COMPETENCIES \n \n \n \nUNIT OF COMPETENCY:  PACKAGE PROCESSED FISH BY VACUUM OR \nORDINARY POLY-PACKING \n \nUNIT CODE                      : AGR826301 \n \nUNIT DESCRIPTOR         :   This unit deals with the knowledge, skills and attitudes \nrequired to package processed fish by vacuum or ordinary \npoly-packing. It also encompasses understanding of the \ndifferent fish processing steps such as exhausting, retorting \nand cooling. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Inspect Packaging \nMaterials, Tools and \nEquipment \n \n \n \n \n \n \n1.1 Packaging materials are inspected for visual defects \nand reported to supervisor for appropriate action.  \n1.2 Packaging equipment and tools for vacuum or \nordinary poly packing is checked for the required \nsettings in accordance with established standards. \n1.3 Packaging materials and equipment are sanitized \naccording to standard operating procedures. \n1.4 Breakdown in packaging equipment are reported to \nsupervisor for appropriate action.  \n1.5 Labels of packaging materials are checked for required \ninformation to ensure conformity with company’s \nregulations and Bureau of Food and Drugs (BFAD) \nrequirements.  \n1.6 Required documentation for packaging materials, tools \nand equipment is completed according to workplace \nrequirements.\n\n--- PDF PAGE 47 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n45\n \nELEMENT \nPERFORMANCE CRITERIA \n2. Perform Inner \nPackaging of \nProcessed Fish \nProducts \n \n \n \n \n \n2.1 Processed fish products after preparatory \noperations are inspected visually for normal \ncharacteristics in accordance with manufacturer’s \nspecifications. \n2.2 Downgraded/Rejected processed fish products are \ndisposed according to company’s policy.   \n2.3 Processed fish products are weighed in accordance \nwith approved specifications. \n2.4 Processed fish products are bagged according to \nprescribed packaging materials. \n2.4 Packaging material with fish products are sealed as \nrequired. \n2.5 Packaged fish products after passing through metal \ndetector are placed in inner carton and labeled in \naccordance to manufacturer’s specification. \n3. Perform Outer \nPackaging \nProcedures \n3.1 Packaged processed fish products are filled in master \ncarton according to established requirements. \n \n3.2   Packaged fish products in cartons are strapped and \ntransferred to pallet for storing according to \nspecifications. \n \n3.3    Packaged fish products are checked of certain \nconditions in accordance to established standards. \n \n3.4   Random sampling is conducted prior to storage. \n \n3.5   Packaged fish products are labeled and stored \naccording to required temperature.\n\n--- PDF PAGE 48 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n46\n \n \nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Packaging Materials  \nPackaging materials may include but not limited to: \n1.1 Plastic bags (single film/laminates) \n1.2 Cartons (master/inner) \n1.3 Carton straps \n1.4 Trays \n1.5 Packing tapes\n2. Defects \nDefects may include but not limited to: \n2.1 Foreign matter \n2.2 Dirt/Unclean \n2.3 Holes \n2.4 Improper label\n3. Packaging Equipment and \nTools \nPackaging equipment may include but not limited to: \n3.1 Weighing scales \n3.2 Thermometer \n3.3 Heat sealer \n3.4 Vacuum sealer \n3.5 Strapping \n3.6 Shrink wrapping \n3.7 Labeling machines \n3.8\nTape/Adhesive dispenser\n4. Information \nInformation may include but not limited to: \n4.1 Production date \n4.2 Best before date \n4.3. Ingredients \n4.4. Brand \n4.5 Quantity of Content \n4.6 Storage requirements \n4.7 Nutritional Facts\n5. Processed Fish Products \n5.1  Fresh  \n5.2  Frozen \n5.3. Dried  \n5.4  Smoked \n5.5  Individually Quick Frozen \nIn the following forms: \n5.6 Whole \n5.7 Fillet \n5.8 Block \n5.9 Belly \n5.10 Steak\n6. Preparatory Operations \n6.1 Wash \n6.2 Eviscerate \n6.3 Cut \n6.4 Clean\n\n--- PDF PAGE 49 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n47\n \n \nVARIABLE \nRANGE \n7. Characteristics \nFresh and frozen form: \n7.1  Unbroken heads, tails \n7.2. Clear and bright eyes  \n7.3  No foreign materials \n7.4  Shiny skin  \n7.5  Bright natural coloring \n7.6  Sea-fresh smell \n7.7  Neat, trim fillets with firm flesh \n7.8  No discoloration \n7.9  Pleasant smell \n7.10 Frozen hard with no signs of thawing \nDried and smoked form: \n7.11 Bright, gloomy appearance \n7.12 Firm texture \n7.13 No molds, dried blood, and salt crystals \n7.14 Clean, smoky odor\n8. Conditions  \n8.1 Package/Container inspection \n8.2 Fish  product spoilage and damage \n8.3 Proper label\n\n--- PDF PAGE 50 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n48\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Inspected appropriate packaging materials and \nequipment according to workplace requirements \n1.2 Sanitized packaging materials, tools and equipment \naccording to standard operating procedures \n1.3 Labeled packaging material according to company’s \nregulations and BFAD requirements  \n1.4 Reported breakdowns and completed documentation in \npackaging equipment according to workplace \nprocedures \n1.5 Packaged processed fish products according to quality \nand safety standards \n1.6 Checked condition of packaged fish products according \nto established standards \n1.7 Properly and safely stored the labeled packaged fish \nproduct according to temperature requirements\n2. nderpinning \nKnowledge \n2.1 Safety Practices \n2.1.1 Proper waste disposal \n2.1.2 Environmental protection and concerns  \n2.1.3 Fish products safety principles and practices \n2.1.4 Fish products handling practices \n2.1.5 Good grooming & personal hygiene \n \n2.2 Communication \n2.2.1 Recording and documenting of production data \n2.2.2 Reporting of defects/breakdown to immediate \nhead/supervisor \n \n2.3    Mathematics and Measurements \n2.3.1   Weights, measure, conversions \n2.3.2   Basic accounting procedures  \n2.3.3   Ratios, proportions and percentages \n2.3.4   Basic mathematical operations \n2.4    Codes & Regulations \n2.4.1   Good quality system  principles \n       2.4.2  ISO, HACCP, SSOP \n2.4.3 Good Manufacturing Practices \n2.4.4 BFAD \n \n2.5 \nMaterials & Equipment: Uses and Specifications \n2.5.1 Packaging materials and labels  \n2.5.2 Packaging equipment \n \n2.6 \nSystems, Processes and Operations \n2.6.1 Packaging procedure and techniques \n2.6.2 Labeling procedures and techniques \n2.6.3 Using various packaging equipment\n\n--- PDF PAGE 51 ---\n______________________________________ \nTR-Fish Products Packaging NC II \n \nPromulgated July 2007 \n49\n3. Underpinning Skills \n3.1 \nOral & written communication skills \n3.2 \nSanitary handling practices \n3.3 \nPackage checks and inspection \n3.4\nRecording and reporting skills\n4.   Resource \nImplications \nThe following resources must be provided: \n4.1 Work area/station \n4.2 Equipment used to package processed fish products \n4.3Materials relevant to the proposed activity and tasks\n5.   Methods of \nAssessment \nCompetency must be assessed through:  \n5.1 Direct observation with oral questioning  \n5.2 Portfolio (submission of work samples) \n5.3Demonstration with oral questioning\n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace\n",
