  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for FISH-PRODUCTS PACKAGING NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FISH-PRODUCTS PACKAGING NC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n 14 Hours (Common)\n 120 Hours (Core)\n 152 Hours (Total)\nCourse Description:\n\nThis course is design to enhance the knowledge, skills and attitudes in FISH-\nPRODUCTS PACKAGING NC II in accordance with industry standards. It covers Basic,\nCommon and Core Competencies.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 65 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n63\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Food\nSafety and\nSanitation\n\n1.1 Wear personal\nprotective equipment\n1.2 Observe personal\nhygiene and good\ngrooming\n1.3 Implement food\nsanitation practices\n1.4 Render safety measures\nand first aid procedures\n1.5 Implement\nhousekeeping activities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced learning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n2. Use Standard\nMeasuring\nDevices/Instru\nments\n\n2.1 Identify standard\nmeasuring devices and\ninstruments\n2.2 Review the procedures\nin using standard\nmeasuring devices and\ninstruments\n2.3 Follow procedures of\nusing measuring\ndevices and instruments\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced\nLearning\n• Lecture\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n3. Use Food\nProcessing\nTools,\nEquipment and\nUtensils\n\n3.1 Perform Pre-Operation\nActivities\n3.2 Operate, monitor and\nmaintain Food\nprocessing Equipment\n3.3 Perform post operation\nactivities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced\nLearning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 66 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n64\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform\nMathematical\nComputations\n4.1 Gather, summarize and\ntabulate the recorded\ndata\n4.2 Review the various\nformulations\n4.3 Calculate production\ninput and output\n4.4 Compute production\ncost\n• Lecture\n• Practical\nexercise\n\n• Written\nexamination\n• Practical\nexercise\n• Direct\nObservation\n5. Implement\nGood\nManufacturing\nPractice\n5.1 Perform pre-work\nactivities in relation to\nGMP\n5.2 Identify requirements of\nGMP related to own\nwork\n5.3 Observe personal\nhygiene and conduct to\nmeet GMP\nrequirements\n5.4 Follow GMP\nrequirements when\ncarrying out work\nactivities\n5.5 Perform post-work\nactivities in relation to\nGMP\n5.6 Complete workplace\ndocumentation to\nsupport GMP\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced\nLearning\n\n• Written/Oral\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n6. Implement\nEnvironmental\nPolicies\nand\nProcedures\n6.1 Access and apply\nworkplace information\non environmental\npolicies and procedures\nrelating to own work\n6.2 Follow work procedures\n6.3 Identify, control and\nreport unacceptable\nperformance\n6.4 Maintain housekeeping\nstandards in work area\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced\nLearning\n• Written/Oral\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 67 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n65\n\n CORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Package\nProcessed Fish\nby Vacuum or\nOrdinary Poly\nPacking\n1.1 Inspect Packaging\nMaterials, Tools and\nEquipment\n1.2 Perform Inner\nPackaging of\nProcessed Fish\nProducts\n1.3 Perform Outer\nPackaging\nProcedures\nDiscussion\nDemonstration\n• Actual\nDemonstration\n• Observation\n• Questioning\n2. Package\nProcessed\nFish by\nBottling\n2.1. Inspect Packaging\nMaterials, Tools and\nEquipment\n2.2. Perform Bottling of\nProcessed Fish\n2.3. Perform Post\nPackaging\nProcedures\n• Discussion\n• Demonstration\n• Actual\nDemonstration\n• Observation\n• Questioning\n3. Package\nProcessed\nFish by\nCanning\n3.1. Inspect Packaging\nMaterials, Tools and\nEquipment\n3.2. Perform Canning of\nProcessed Fish\n3.3. Perform Post\nPackaging\nProcedures\n• Discussion\n• Demonstration\n• Actual\nDemonstration\n• Observation\n• Questioning\n\n--- PDF PAGE 68 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n66\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates the\ntraining delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n\n--- PDF PAGE 69 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n67\n3.3 TRAINEE ENTRY REQUIREMENTS\nTrainees or students should possess the following requirements:\n• can communicate both orally and in writing;\n• physically and mentally fit;\n• with good moral character; and\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nFISH-PRODUCTS PACKAGING NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Fish-Products Packaging NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n5 units\n• Weighing scales\n(10 kg. capacity)\n1\n• Refrigerator\nA. Food supplies\n5 pcs\n• Dial/Digital\nthermometers\n1 unit\n• Freezer\n20\nkgs.\n• Processed fish\nproducts\n(milkfish, tilapia,\nshrimp)\n20 pcs\n• Utility trays\n1 unit\n• Stoves\n1 gal\n• Oil\n10 pcs\n• Food tongs\n1 pc\n• Strapping\nmachine\n1 kg\n• Tomatoes\n(medium size)\n15\npcs\n• Knives\n1 pc\n• Heat sealer\n1 kg\n• Salt\n5\npcs\n• Measuring cups\n1 pc\n• Shrink wrapping\nmachine\n100 g\n• Bay leaf\n10\npcs\n• Chopping\nboards\n1 pc\n• Tape/Adhesive\ndispenser\n1 kg\n• Pickles\n5\npcs\n• Measuring\nspoons\n1 pc\n• Cap sealer\n500 g\n• Peppercorn\n2\npcs\n• Clock/Timer\n1 pc\n• Pressure canner\n500 g\n• Cloves\n15\npcs\n• Mixing bowl\n1 unit\n• Pressure cooker\n500 g\n• MSG\n\n1 unit\n• Plastic cap sealer\nB. Non food\n\n1 unit\n• Vacuum pack\nmachine\n3\npacks\n• PE plastic\npackaging\nmaterials\n\n1 unit\n• Labeling\nmachines\n3\nboxes\n• 12 oz., round\nbottles with\nscrew caps\n\n--- PDF PAGE 70 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n68\n\nTRAINING\nMATERIALS\n2\npacks\n• Plastic cap seals\n\n1 pc\n• Books/Reference\n3\nboxes\n• Tin cans with lids\n\n1 pc\n• Manual\n1 gal\n• Disinfectant\n\n1 pc\n• Videos\n1 kg\n• Detergent\n\n1\npack\n• Labels\n\n10\n• Corrugated\ncartons\n\n10\n• Inner cartons\n\n2 pcs\n• Carton strap\n\n3.5\nTRAINING FACILITIES\n\nThe fish products packaging workshop must be of concrete structure. Based on a\nclass size of 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nBuilding (permanent)\nLaboratory area\n6 x10\n60\n60\nTool room & storage area\n4 x 5\n20\n20\nLearning resource area\n5 x 6\n30\n30\nWash area/comfort room\n(male & female)\n2.5 x 4\n10\n10\nTotal\n120\nFacilities/Equipment/\nCirculation (30% of\nteaching accommodation)\n\n40\nTotal workshop area\n160\n\nNote: Experimental area will change according to availability of land.\n\n--- PDF PAGE 71 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n69\n3.5\nTRAINER’S QUALIFICATIONS FOR FISH PRODUCTS PACKAGING NC II\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Fish Products Packaging NC II qualification or equivalent\n• Must have undergone training on Training Methodology II(TM II) or equivalent in\ntraining/experience\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n3.6\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by the learner who enrolled in a\nstructured learning program to determine the achievement of competencies. It is\nadministered by the trainer/assessor at end of each learning module.\n\nThe result of the institutional assessment may be considered as an evidence for\nnational assessment.\n\n--- PDF PAGE 72 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n70"
