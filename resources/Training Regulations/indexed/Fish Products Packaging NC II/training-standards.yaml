    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FISH-PRODUCTS PACKAGING NC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n 14 Hours (Common)\n 120 Hours (Core)\n 152 Hours (Total)\nCourse Description:\n\nThis course is design to enhance the knowledge, skills and attitudes in FISH-\nPRODUCTS PACKAGING NC II in accordance with industry standards. It covers Basic,\nCommon and Core Competencies.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 65 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n63\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Food\nSafety and\nSanitation\n\n1.1 Wear personal\nprotective equipment\n1.2 Observe personal\nhygiene and good\ngrooming\n1.3 Implement food\nsanitation practices\n1.4 Render safety measures\nand first aid procedures\n1.5 Implement\nhousekeeping activities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced learning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n2. Use Standard\nMeasuring\nDevices/Instru\nments\n\n2.1 Identify standard\nmeasuring devices and\ninstruments\n2.2 Review the procedures\nin using standard\nmeasuring devices and\ninstruments\n2.3 Follow procedures of\nusing measuring\ndevices and instruments\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced\nLearning\n• Lecture\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n3. Use Food\nProcessing\nTools,\nEquipment and\nUtensils\n\n3.1 Perform Pre-Operation\nActivities\n3.2 Operate, monitor and\nmaintain Food\nprocessing Equipment\n3.3 Perform post operation\nactivities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced\nLearning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 66 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n64\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform\nMathematical\nComputations\n4.1 Gather, summarize and\ntabulate the recorded\ndata\n4.2 Review the various\nformulations\n4.3 Calculate production\ninput and output\n4.4 Compute production\ncost\n• Lecture\n• Practical\nexercise\n\n• Written\nexamination\n• Practical\nexercise\n• Direct\nObservation\n5. Implement\nGood\nManufacturing\nPractice\n5.1 Perform pre-work\nactivities in relation to\nGMP\n5.2 Identify requirements of\nGMP related to own\nwork\n5.3 Observe personal\nhygiene and conduct to\nmeet GMP\nrequirements\n5.4 Follow GMP\nrequirements when\ncarrying out work\nactivities\n5.5 Perform post-work\nactivities in relation to\nGMP\n5.6 Complete workplace\ndocumentation to\nsupport GMP\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced\nLearning\n\n• Written/Oral\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n6. Implement\nEnvironmental\nPolicies\nand\nProcedures\n6.1 Access and apply\nworkplace information\non environmental\npolicies and procedures\nrelating to own work\n6.2 Follow work procedures\n6.3 Identify, control and\nreport unacceptable\nperformance\n6.4 Maintain housekeeping\nstandards in work area\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced\nLearning\n• Written/Oral\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 67 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n65\n\n CORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Package\nProcessed Fish\nby Vacuum or\nOrdinary Poly\nPacking\n1.1 Inspect Packaging\nMaterials, Tools and\nEquipment\n1.2 Perform Inner\nPackaging of\nProcessed Fish\nProducts\n1.3 Perform Outer\nPackaging\nProcedures\nDiscussion\nDemonstration\n• Actual\nDemonstration\n• Observation\n• Questioning\n2. Package\nProcessed\nFish by\nBottling\n2.1. Inspect Packaging\nMaterials, Tools and\nEquipment\n2.2. Perform Bottling of\nProcessed Fish\n2.3. Perform Post\nPackaging\nProcedures\n• Discussion\n• Demonstration\n• Actual\nDemonstration\n• Observation\n• Questioning\n3. Package\nProcessed\nFish by\nCanning\n3.1. Inspect Packaging\nMaterials, Tools and\nEquipment\n3.2. Perform Canning of\nProcessed Fish\n3.3. Perform Post\nPackaging\nProcedures\n• Discussion\n• Demonstration\n• Actual\nDemonstration\n• Observation\n• Questioning\n\n--- PDF PAGE 68 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n