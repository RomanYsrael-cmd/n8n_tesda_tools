      "source_text": "3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nFISH-PRODUCTS PACKAGING NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Fish-Products Packaging NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n5 units\n• Weighing scales\n(10 kg. capacity)\n1\n• Refrigerator\nA. Food supplies\n5 pcs\n• Dial/Digital\nthermometers\n1 unit\n• Freezer\n20\nkgs.\n• Processed fish\nproducts\n(milkfish, tilapia,\nshrimp)\n20 pcs\n• Utility trays\n1 unit\n• Stoves\n1 gal\n• Oil\n10 pcs\n• Food tongs\n1 pc\n• Strapping\nmachine\n1 kg\n• Tomatoes\n(medium size)\n15\npcs\n• Knives\n1 pc\n• Heat sealer\n1 kg\n• Salt\n5\npcs\n• Measuring cups\n1 pc\n• Shrink wrapping\nmachine\n100 g\n• Bay leaf\n10\npcs\n• Chopping\nboards\n1 pc\n• Tape/Adhesive\ndispenser\n1 kg\n• Pickles\n5\npcs\n• Measuring\nspoons\n1 pc\n• Cap sealer\n500 g\n• Peppercorn\n2\npcs\n• Clock/Timer\n1 pc\n• Pressure canner\n500 g\n• Cloves\n15\npcs\n• Mixing bowl\n1 unit\n• Pressure cooker\n500 g\n• MSG\n\n1 unit\n• Plastic cap sealer\nB. Non food\n\n1 unit\n• Vacuum pack\nmachine\n3\npacks\n• PE plastic\npackaging\nmaterials\n\n1 unit\n• Labeling\nmachines\n3\nboxes\n• 12 oz., round\nbottles with\nscrew caps\n\n--- PDF PAGE 70 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n68\n\nTRAINING\nMATERIALS\n2\npacks\n• Plastic cap seals\n\n1 pc\n• Books/Reference\n3\nboxes\n• Tin cans with lids\n\n1 pc\n• Manual\n1 gal\n• Disinfectant\n\n1 pc\n• Videos\n1 kg\n• Detergent\n\n1\npack\n• Labels\n\n10\n• Corrugated\ncartons\n\n10\n• Inner cartons\n\n2 pcs\n• Carton strap"
