  "source_text": "DEFINITION OF TERMS\n\nFor the purpose of this competency standard, the following words are defined:\n\n• Bottling/Canning – refers to a preservation of foods in hermetically sealed\ncontainers such as tin cans and glass jars by sterilization with heat\n\n• Block – shape, mold or form into a block\n\n• Cans – are metal container made of steel base with a thin coating of tin on each\nside; igve hermetic seal and resistant to heat\n\n• Defect – a condition found in a product which fails to meet essential quality,\ncomposition and/or labeling provisions of the appropriate product standards.\n\n• Dried – preserved by removing natural moisture\n\n• Eviscerate – is the removing of internal organs\n\n• Exhausting – refers to the removal of air and gases from the raw material and the\ncontainer before sealing; It refers to the heating of canned foods to a center can\ntemperature of 180°C to 205°F before sealing.\n\n• Fresh – Recently made, produced, or harvested; not stale or spoiled.\n\n• Freezing - a method of food preservation by storing food at about 0o F\n\n• Frozen – preserved by freezing\n\n• Fillet – is a slice of fish of irregular size and shape removed from the carcass by cuts\nmade parallel to the back bone.\n\n• Fish Processing – refers to the application of heat in varying degree to the fish\nenclosed in a container for a sufficient time to sterilize the product\n\n• Food quality standards- specify consumer and trade requirements as well as\naffects market acceptability and price\n\n• Food safety standards – determine safety of food and human consumption\n\n• Glass – rigid, inert and transparent but fragile and heavy.\n\n• Hazard Analysis and Critical Control Points (HACCP) - is a systematic\npreventative approach to food safety that addresses physical, chemical and\nbiological hazards as a means of prevention rather than finished product inspection.\n\n--- PDF PAGE 77 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n75\n• Hermetic Sealing- refers to the closure of food in tin cans or glass jars tightly to\nprevent the entrance of microorganisms and contamination of products.\n\n• Individually Quick Frozen - frozen separately as single units\n\n• International Organization for Standardization (ISO) - is an international standard-\nsetting body composed of representatives from national standards bodies. Founded\non 1947-02-23, the organization produces world-wide industrial and commercial\nstandards, the so-called ISO standards.\n\n• Packaging – the enclosure of products, items or packages in a wrapped pouch, bag,\nbox, cup, tray, can tube, bottle or other container to perform the following functions:\ncontainment, protection and/or preservation, communication and utility or\nperformance\n\n• Polyethylene - a lightweight thermoplastic, used especially in packaging and\ninsulation\n\n• Raw Materials – consist of the main food material to be processed including minor\nfood ingredients\n\n• Sanitation - refers to the process of treating food contact and non-food contact\nsurface with physical agents and chemicals to kill the residual microorganisms\npresent after cleaning\n\n• Smoked – cured by the process of flavoring, cooking, or preserving food by\nexposing it to the smoke from burning or smoldering plant materials, most often\nwood\n\n• Sanitation Standard Operating Procedures is the common name give to the\nsanitation procedures in food production plants which are required by the Food\nSafety and Inspection Service of the USDA. It is considered one of the prerequisite\nprograms of HACCP\n\n• Thermal Processing – refers to the method of processing food in hermetically\nsealed container by applying heat with the right temperature and time, enough to kill\nmicroorganisms responsible in the spoilage of food which involve bottling and\ncanning\n\n• Vacuum – a state of pressure reduction below atmosphere.\n\n• Vacuum packed product – product that is sealed in a container under the vacuum\nspecified in the scheduled process, the maintenance of which vacuum is critical to\nthe adequacy of scheduled process.\n\n--- PDF PAGE 78 ---\n______________________________________\nTR-Fish Products Packaging NC II\n\nPromulgated July 2007\n76"
