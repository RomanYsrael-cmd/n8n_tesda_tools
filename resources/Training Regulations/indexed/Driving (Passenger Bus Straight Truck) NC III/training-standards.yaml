    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for DRIVING (Bus/Straight Truck) NC III.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: DRIVING\n(BUS/STRAIGHT TRUCK)\n\nNC LEVEL: NC III\n\nTraining Nominal Hours: 20 Hours (Basic competencies)\n20 Hours (Common Competencies)\n82 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in\nthe field of driving vehicles classified under LTO restriction codes 3 up to 5 (passenger bus and\nstraight trucks) in accordance with industry standards. It covers core competencies such as:\nperform minor maintenance and servicing; perform pre-and post operation procedures for such\nvehicles; drive these vehicles; obey and observe traffic rules and implement and coordinate\naccident and emergency situations.\n\nThis course is also designed to equip the individual the desirable basic and common\nattitudes and skills of the Driving (Bus/Straight Truck) NC III.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information about\nworkplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the workplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for agreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 67 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n63\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Solve\nworkplace\nproblem\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible cause/s\nof the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate technology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nappropriate\nsealant/\nadhesive\n1.1 Identify appropriate sealant/\nadhesive\n1.2 Prepare surface for sealant /\nadhesive application\n1.3 Store unused and dispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n2. Move and\nposition\nvehicle\n2.1 Prepare vehicle for driving\n2.2 Move and position vehicle\n2.3 Check the vehicle\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring instrument\nand carry out measurement and\ncalculations\n3.2 Maintain measuring instruments\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n\n--- PDF PAGE 68 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n64\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Read, interpret\nand apply\nspecifications\nand manual\n4.1 Identify/access manuals and\ninterpret data and specification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n5. Use and apply\nlubricant/\ncoolant\n5.1 Identify type of lubricant/\ncoolant\n5.2 Use and apply lubricant\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n6. Perform shop\nmaintenance\n7.1 Inspect/clean tools and work\narea\n7.2 Store/arrange tools and shop\nequipment\n7.3 Dispose waste/used lubricants\n7.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n7. Interpret/ Draw\ntechnical\ndrawing\n7.1 Interpret technical drawing\n7.2 Select correct technical drawing\n7.3 Apply freehand sketching\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n8. Prepare job\nestimates\n8.1 Identify nature/scope of work\n8.2 Prepare and present estimates\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n\n--- PDF PAGE 69 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n65\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform minor\nmaintenance\nand servicing\non vehicles\nclassified\nunder LTO\nrestriction\nCodes 3 up to\n5.\n1.1 Perform routine check-up\n1.2 Clean vehicle head\n1.3 Report any minor troubles\nfound and observe\nabnormalities\n• Lecture/\nDemonstration\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n2. Perform Pre-\nand Post\nOperation\nProcedures on\nvehicles\nclassified\nunder LTO\nrestriction\nCodes 3 up to\n5.\n2.1 Perform “BLOWAF” check\n2.2 Check pilot pin, pin lock, hose\nengagement (electrical,\nhydraulic, air pressure)\n2.3 Check operating condition of\npanel control (instrument\ngauges, indicators and\ncontrols) of the vehicle\n2.4 Check operating condition of air\nbrake and steering control\n2.5 Engage/set safety locks when\nparked\n2.6 Reconduct walk around\ninspection prior to turning off\nthe engine\n• Lecture/\nDemonstration\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Obey and\nObserve\nTraffic Rules\nand\nRegulations\n3.1 Identify traffic rules and\nregulations/ordinances\nimplemented in different\nmunicipalities/cities\n3.2 Wear appropriate driver outfit/\nattire\n3.3 Respond to / handle complaints\n3.4 Obey and observe traffic rules\nand regulations\n• Lecture/\nDemonstration\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n4. Observe road\nhealth and\nsafety\npractices\n4.1 Identify and evaluate hazards\nand risks\n4.2 Control hazards and risks\n4.3 Maintain fitness for driving\n• Lecture/\nDemonstration\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n--- PDF PAGE 70 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n66\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Implement and\nCoordinate\nAccident-\nEmergency\nProcedures\n5.1 Identify different types of\nemergency situations\n5.2 Respond to accidents/\nemergencies encountered\n5.3 Report accidents/emergency\nsituation to proper authority\n5.4 Apply first aid\n5.5 Provide needs of injured victim\nbased on emergency\nprocedures\n• Lecture/\nDemonstration\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n6. Drive\nPassenger\nBus\n6.1 Identify different parts of\nPassenger bus\n6.2 Drive passenger bus\n6.3 Handle passengers and\ncargoes\n6.4 Follow standard procedures in\ndriving passenger bus\n6.5 Manage different types of\ndriving hazards\n6.6 Monitor irregular performance\nof the vehicle\n6.7 Perform minor vehicle\nmaintenance\n6.8 Safeguard pertinent documents\nfor cargoes to be transported\n• Lecture/\nDemonstration\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n7. Drive Straight\nTruck\n7.1 Identify different parts of\nStraight truck\n7.2 Drive straight truck\n7.3 Follow standard procedures in\ndriving straight truck\n7.4 Manage different types of\ndriving hazards\n7.5 Monitor irregular performance\nof the vehicle\n7.6 Perform minor vehicle\nmaintenance\n7.7 Safeguard pertinent documents\nfor cargoes to be transported\n\n• Lecture/\nDemonstration\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n--- PDF PAGE 71 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n67\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum\nmodules;\n•\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n•\nTraining is based both on and off the-job components;\n•\nTraining program allows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of delivery modes, both on\nand off-the-job as long as the learning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and\nRegulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n--- PDF PAGE 72 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n68\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience. Other\nrequirements like health and physical requirements are also stated. Passing entry written\nexaminations may also be indicated if necessary.\n\n•\nWith good moral character;\n•\nAble to communicate both orally and in writing\n•\nPhysically fit and mentally healthy as certified by a Public Health Officer\n•\nHolder of LTO license with restriction code 2.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nDriving NC III (Passenger Bus/Straight Truck)\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n4 set\nMop and basket\n1 unit\nBus 4500 kgs\n5 boxes\nSoap\n4 pcs,\nPail\n1 unit\nStraight truck\n5 liters\nShampoo\n4 pcs,\nBroom\n2 units\nVacuum cleaner\n10 liters\nGear oil\n4 pcs,\nHose\n2 units\nSteam cleaner\n20 pcs.\nAir freshener\n25 pairs\nGloves\n2 units\nAir compressor\n10 pcs\nPolish\n25 pairs\nApron\n2 units\nPressure washer\n10 liters\nDistilled water\n25 pairs\nGoggles\n\n4 pcs.\nFan belt\n25 pairs\nPlastic boots\n\n10 pcs.\nFuse\n4 set\nScrewdriver (flat &\nPhilips)\n\n4 rolls\nElectrical tape\n4 set\nHex key (Allen key)\n\n2 liters\nBrake fluid\nMechanical pliers\n4 pcs.\nA/C belt\nLong-nose pliers\n4 pcs.\nP/S belt\n4 set\nCombination wrench\n10 liters\nCoolant\n4 pcs.\nEarly warning device\n(EWD)\n\n10 liters\nAdditives\n4 pcs.\nEmergency lighting\ndevice/ trouble light\n\n4 pcs.\nRelay\n4 pcs.\nJack (heavy duty)\n20 mts.\nWire or nylon rope\n2 pcs.\nTire wrench\n2 pcs.\nG.I. pipe 1” x 24”\n4 pcs.\nTire gauge\n4 pcs.\nCreeper\n\nTraining Materials\n4 pcs.\nTire choke\n\n•\nReference books\n\n•\nManuals\n\n•\nBrochure\n\n•\nCatalogs\n\n•\nCDs/Video tapes\n\n•\nLearning modules\n\n--- PDF PAGE 73 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n69\n3.5\nTRAINING FACILITIES\nDRIVING - NC III (Passenger Bus/Straight Truck)\n\nBased on a class size of 25 students/trainees\n\nSPACE REQUIREMENT\nAREA IN SQUARE\nMETERS\nTOTAL AREA IN\nSQUARE METERS\nBuilding (Permanent)\n54.60\n54.60\nLecture Room\n30.00\n30.00\nCirculation Area\n12.60\n12.60\nTool Room\n12.00\n12.00\nDriving lane\n1,000.00\n1,000.00\nTotal\n1,054.60\n\n3.6\nTRAINERS’ QUALIFICATION FOR AUTOMOTIVE/LAND TRANSPORT SECTOR\nDRIVER (Passenger Bus/Straight Truck) NC III (CLASSIFIED UNDER THE LTO\nRESTRICTION CODE 3 - 5)\n\n•\nMust be a holder of a Driving (Passenger Bus/Straight Truck) NC III certificate\n•\nMust be a holder of a Trainer Qualification Level I (TQ I) certificate\n•\nMust be computer literate\n•\nMust be able to communicate, both orally and in writing\n•\nMust be physically and mentally fit\n•\nMust have a minimum of one-year industry experience in driving buses and/or straight\ntrucks\n•\nMust possess a current professional driver’s license (restriction code 8) issued by the\nLand Transportation Office.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 74 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n70"
