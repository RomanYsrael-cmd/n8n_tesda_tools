    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: DRIVING\n(BUS/STRAIGHT TRUCK)\n\nNC LEVEL: NC III\n\nTraining Nominal Hours: 20 Hours (Basic competencies)\n20 Hours (Common Competencies)\n82 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in\nthe field of driving vehicles classified under LTO restriction codes 3 up to 5 (passenger bus and\nstraight trucks) in accordance with industry standards. It covers core competencies such as:\nperform minor maintenance and servicing; perform pre-and post operation procedures for such\nvehicles; drive these vehicles; obey and observe traffic rules and implement and coordinate\naccident and emergency situations.\n\nThis course is also designed to equip the individual the desirable basic and common\nattitudes and skills of the Driving (Bus/Straight Truck) NC III.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information about\nworkplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the workplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for agreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 67 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n63\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Solve\nworkplace\nproblem\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible cause/s\nof the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate technology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nappropriate\nsealant/\nadhesive\n1.1 Identify appropriate sealant/\nadhesive\n1.2 Prepare surface for sealant /\nadhesive application\n1.3 Store unused and dispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n2. Move and\nposition\nvehicle\n2.1 Prepare vehicle for driving\n2.2 Move and position vehicle\n2.3 Check the vehicle\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring instrument\nand carry out measurement and\ncalculations\n3.2 Maintain measuring instruments\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n\n--- PDF PAGE 68 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n64\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Read, interpret\nand apply\nspecifications\nand manual\n4.1 Identify/access manuals and\ninterpret data and specification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n5. Use and apply\nlubricant/\ncoolant\n5.1 Identify type of lubricant/\ncoolant\n5.2 Use and apply lubricant\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n6. Perform shop\nmaintenance\n7.1 Inspect/clean tools and work\narea\n7.2 Store/arrange tools and shop\nequipment\n7.3 Dispose waste/used lubricants\n7.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n7. Interpret/ Draw\ntechnical\ndrawing\n7.1 Interpret technical drawing\n7.2 Select correct technical drawing\n7.3 Apply freehand sketching\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n8. Prepare job\nestimates\n8.1 Identify nature/scope of work\n8.2 Prepare and present estimates\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance learning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project method\n• Interview\n\n--- PDF PAGE 69 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n65\n