      "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: DRIVING\n(BUS/STRAIGHT TRUCK)\n\nNC LEVEL: NC III\n\nTraining Nominal Hours: 20 Hours (Basic competencies)\n20 Hours (Common Competencies)\n82 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in\nthe field of driving vehicles classified under LTO restriction codes 3 up to 5 (passenger bus and\nstraight trucks) in accordance with industry standards. It covers core competencies such as:\nperform minor maintenance and servicing; perform pre-and post operation procedures for such\nvehicles; drive these vehicles; obey and observe traffic rules and implement and coordinate\naccident and emergency situations.\n\nThis course is also designed to equip the individual the desirable basic and common\nattitudes and skills of the Driving (Bus/Straight Truck) NC III.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information about\nworkplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the workplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for agreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 67 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\n