        "source_title": "Drive passenger bus",
        "source_text": "--- PDF PAGE 58 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n54\nUNIT OF COMPETENCY : \nDRIVE PASSENGER BUS \n \nCODE NO. \n: \nALT832306 \n \nUNIT DESCRIPTOR \n: \nThis unit involves the skills, knowledge and attitudes required to \ndrive a passenger bus safely including handling of passengers, \nsystematic and efficient control of all vehicle functions, monitoring \nof traffic/ road conditions, management of vehicle condition, and \neffective management of hazardous situations.   \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform passenger bus \npre-starting and warm-\nup  \n1.1 \nPassenger bus inspection is performed as per \nmanufacturer’s specification \n1.2 \nSafety harness/devices and tools are checked according to \nLTO/LTFRB requirements \n1.3 \nWarm up of passenger bus  is performed as per \nmanufacturer's manual \n2. Drive passenger bus \n2.1 \nPassenger bus is driven in accordance with traffic rules and \nregulations and manufacturer’s instruction \n2.2 \nDriving hazards are identified and/or anticipated and avoided \nor controlled through defensive driving as per standard \noperating procedures. \n2.3 \nThe passenger bus is parked, shut down and secured in \naccordance with manufacturer’s specifications, traffic \nregulations and workplace procedures \n2.4 \nPassengers and loads are transported up to the route \nassigned and fares are collected as per LTFRB regulations \n2.5 \nDriving is performed according to the restriction and condition \nstated in the official receipt license and within the \noccupational health and safety standards (OHS). \n2.6 \nOut-of line/anti carnapping clearance/special permit is secured \nas per traffic rules and regulations \n3. Monitor and maintain \npassenger bus \nperformance \n  \n3.1 \nDefective or irregular performance or malfunctions are \nmonitored and reported to the appropriate person/authority. \n3.2 \nMinor vehicle maintenance is performed in accordance with \nmanufacturer's instruction \n3.3 \nVehicle records are maintained/updated in accordance with \nworkplace procedures\n\n--- PDF PAGE 59 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n55\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Passenger bus \n1.1 \nTourist  \n1.2 \nPublic utility \n1.3 \nShuttle or company  \n1.4 \nSchool \n1.5 \nSingle or double decker \n2. Passenger bus \ninspection \n2.1 \nLights (head light, park light, signal lights, hazard, etc.) \n2.2 \nMirrors (rear view, side view, windshields, etc.) \n2.3 \nUnder hood \n2.4 \nUnderchassis \n2.5 \nPassenger seats  \n2.6 \nSpare tires \n2.7 \nAirconditioning system \n3. Fares \n3.1 \nTickets \n3.2 \nFare matrix  \n \n4. Safety harness/devices \n& tools \n4.1 \nSeat belt  \n4.2 \nEarly Warning Device \n4.3 \nHandtools (Wrench, pliers, screwdriver, early warning device, \njack, spare tires) \n4.4 \nFlashlights or emergency lighting device \n4.5 \nFire extinguisher \n4.6 \nPassenger Hand straps \n4.7 \nEmergency exit door \n4.8 \nConsumable materials and spare parts such as  \n Rags \n Fan belt \n Wheel cap \n Fuse \n Electrical tapes \n Brake fluid \n Motor oil \n5. Traffic regulations  \n5.1 \nRegistration, driving license and other relevant permits \n5.2 \nUse of seat belt \n5.3 \nAvailability of EWD \n5.4 \nObservance of franchise route \n5.5 \nUse of uniform \n5.6 \nCompliance with vehicle emission standards \n5.7 \nObservance of city ordinances\n\n--- PDF PAGE 60 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n56\n \nVARIABLE \nRANGE \n6. Driving hazards \n6.1 \nStalled vehicles and other road obstruction \n6.2 \nExcavation and road repairs \n6.3 \nFlood \n6.4 \nHeavy traffic volume \n6.5 \nAccidents \n6.6 \nHeavy rains and typhoons \n6.7 \nFog/smog \n6.8 \nUncentered force of gravity or inertia \n6.9 \nSlippery roads \n6.10 Rock/Land slides \n6.11 Check points \n6.12 Slow moving vehicles \n6.13 No tail light vehicles \n6.14 Undisciplined pedestrians \n6.15 Winding and zigzag road \n6.16 Blind corners \n6.17 Humps \n6.18 Unattended children along streets \n6.19 Stray animals \n6.20 Open manhole \n6.21 Reckless and uncooperative drivers \n6.22 Loose stones \n6.23 Mental and physical fatigue \n \n7. Occupational Health & \nSafety   \n7.1 \nSafety in handling vehicle and passengers while driving \n7.2 \nSafety on road and traffic management including management \nof pedestrians  \n7.3 \nUse of personal protective equipment and devices such as \nuniform, gas mask, gloves , sunglasses, shoes, cap \n7.4 \nUse of seat belt and early warning devices\n\n--- PDF PAGE 61 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n57\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate \n1.1 \nPerformed pre-operational and warm up \n1.2 \nDrove passenger bus according to traffic rules and regulations \n1.3 \nTransported cargoes/loads to destination.  \n1.4 \nMonitored and maintained vehicle performance \n1.5 \nFollowed OHS and environmental protection procedures and \nregulations \n1.6 \nFollowed emergency procedures  \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 \nRelevant OHS and environmental procedures and regulations \n2.2 \nParts of Passenger bus and its functions \n2.3 \nTypes of load or cargo \n2.4 \nProcedure on how to drive the Passenger bus \n2.5 \nProcedure to be followed in the event of emergency and road \nrelated crimes \n2.6 \nEngine power management and safe driving strategies \n2.7 \nFatigue management techniques \n2.8 \nPrinciple of stress management when driving a vehicle \n2.9 \nTraffic rules and regulations \n2.10 Kinds of traffic violations \n2.11 Positive work values (Honesty, Patience, Perseverance, \nCourtesy, etc.) \n3. Underpinning Skills \n3.1 \nComputing fares, distances and travel time  \n3.2 \nManaging fatigue while driving \n3.3 \nReading/Interpreting traffic signs and symbols and road \nadvisory \n3.4 \nMaintaining proper distance and speed \n3.5 \nResponding to road-related accidents and crimes encountered\n4. Resource Implications \nThe following resources must be provided: \n4.1 \nPassenger bus with appropriate tools/instruments for actual \nperformance of works   \n4.2 \nDriver's Manual  \n4.3 \nAmple space for driving including traffic signs and symbols for \ndriving and maneuvering the Passenger bus \n5. Method of Assessment \nCompetency must be assessed through \n5.1 \nWritten test \n5.2 \nObservation with Questioning  \n5.3 \nDemonstration with Questioning \n5.4 \nInterview \n5.5 \nPortfolio \n6. Context for \nAssessment \n6.1 \nCompetency may be assessed in actual workplace or \nsimulated environment accredited by TESDA.  \n6.2 \nAssessment of competence must comply with the assessment \nrequirements of the relevant Road and traffic control Authority\n",
