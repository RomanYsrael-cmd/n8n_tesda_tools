bservation with Questioning \n5.2 \nDemonstration with Questioning \n5.3 \nInterview \n5.4 \nWritten examination  \n \n6. Context for \nAssessment \nPractical assessment must be conducted at TESDA accredited \nassessment centers and/or in an appropriate work situation",
