        "source_title": "PERFORM MENSURATION AND CALCULATION",
        "source_text": "--- PDF PAGE 22 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n18\nCOMMON COMPETENCIES \nAUTOMOTIVE \n \n \nUNIT OF COMPETENCY : \nPERFORM MENSURATION AND CALCULATION \n \nUNIT CODE \n: \nALT311202 \n \nUNIT DESCRIPTOR \n: \nThis unit includes identifying caring, handling and use of \nmeasuring instruments. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Select measuring \ninstruments \n1.1 \nObject or component to be measured is identified \n1.2 \nCorrect specifications are obtained from relevant source \n1.3 \nAppropriate measuring instrument is selected according to \njob requirements \n2. Carry out \nmeasurements and \ncalculation \n2.1 \nMeasuring tools are selected in line with job requirements \n2.2 \nAccurate measurements are obtained to job \n2.3 \nCalculation needed to complete work tasks are performed \nusing the four basic process of addition (+), subtraction (-), \nmultiplication (x) and division (/). \n2.4 \nCalculations involving fractions, percentages and mixed \nnumbers are used to complete workplace tasks. \n2.5 \nNumerical computation is self-checked and corrected for \naccuracy \n2.6 \nInstruments are read to the limit of accuracy of the tool. \n3. Maintain measuring \ninstruments \n3.1 \nMeasuring instruments must kept free from corrosion \n3.2 \nMeasuring instruments not dropped to avoid damage \n3.3 \nMeasuring instruments cleaned before and after using.\n\n--- PDF PAGE 23 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n19\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Measuring instruments \nMeasuring instruments includes: \n1.1 \nMultitester \n1.2 \nMicrometer (In-out, depth) \n1.3 \nVernier caliper (Out, inside) \n1.4 \nDial Gauge with Mag. Std. \n1.5 \nPlastigauge \n1.6 \nStraight Edge \n1.7 \nThickness gauge \n1.8 \nTorque Gauge \n1.9 \nSmall Hole gauge \n1.10 Telescopic Gauge \n1.11 Try square \n1.12 Protractor \n1.13 Combination gauge \n1.14 Steel rule  \n2.  Calculation \n \nKinds of Part Mensuration include: \n2.1 \nVolume \n2.2 \nArea \n2.3 \nDisplacement \n2.4 \nInside diameter \n2.5 \nCircumference \n2.6 \nLength \n2.7 \nThickness \n2.8 \nOutside diameter \n2.9 \nTaper \n2.10 Out of roundness \n2.11 Oil clearance \n2.12 End play/thrust clearance\n\n--- PDF PAGE 24 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n20\nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nSelected measuring instruments \n1.2 \nCarried-out measurements and calculations. \n1.3 \nMaintained measuring instruments \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 \nTypes of Measuring instruments and its uses \n2.2 \nSafe handling procedures in using measuring instruments \n2.3 \nFour fundamental operation of mathematics \n2.4 \nFormula for Volume, Area, Perimeter and other geometric \nfigures \n3. Underpinning Skills \n3.1 \nCaring and Handling measuring instruments \n3.2 \nCalibrating and using measuring instruments \n3.3 \nPerforming calculation by  Addition, Subtraction, Multiplication \nand Division \n3.4 \nVisualizing objects and shapes \n3.5 \nInterpreting formula for volume, area, perimeter and other \ngeometric figures \n4. Resource Implication \nThe following resources must be provided: \n4.1 \nWorkplace location \n4.2 \nMeasuring instrument appropriate to servicing processes \n4.3 \nInstructional materials relevant to the propose activity \n5. Methods of  \nAssessment \n \nCompetency must be assessed through: \n5.1 \nObservation with questioning \n5.2 \nWritten or oral examination \n5.3 \nInterview \n5.4 \nDemonstration with questioning \n6. Context for \nAssessment \n \n6.1 \nCompetency elements must be assessed in a safe working \nenvironment \n6.2 \nAssessment may be conducted in a workplace or simulated \nenvironment\n\n--- PDF PAGE 25 ---