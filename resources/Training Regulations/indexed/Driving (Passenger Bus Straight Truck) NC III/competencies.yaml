        "source_text": "--- PDF PAGE 62 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n58\nUNIT OF COMPETENCY : \nDRIVE STRAIGHT TRUCK \n \nCODE NO. \n: \nALT832307 \n \nUNIT DESCRIPTOR \n: \nThis unit involves the skills, knowledge and attitudes required to \ndrive a straight truck safely including handling of cargoes, \nsystematic and efficient control of vehicle functions, monitoring of \ntraffic and road conditions, management of vehicle condition and \neffective handling management of hazardous materials and \nsituations.   \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Perform straight truck \npre-starting and warm-\nup  \n1.1 \nStraight truck inspection is performed as per manufacturer’s \nspecification \n1.2 \nSafety harness/devices and tools are checked according to \nLTO/LTFRB requirements \n1.3 \nWarm up of straight truck is performed as per manufacturer's \nmanual \n2. Drive straight truck  \n2.1 \nStraight truck is driven in accordance with traffic rules and \nregulations and manufacturer’s instruction \n2.2 \nDriving hazards are identified and/or anticipated and avoided \nor controlled through defensive driving as per standard \noperating procedures. \n2.3 \nThe straight truck is parked, shut down and secured in \naccordance with manufacturer’s specifications, traffic \nregulations and workplace procedures \n2.4 \nCargoes / loads are secured and transported up to the route \nassigned  per LTFRB regulations \n2.5 \nDriving is performed according to the restriction and condition \nstated in the official receipt license and within the \noccupational health and safety standards (OHS). \n2.6 \nTrip ticket / way bill is secured during the trip as per company \nprocedure \n2.7 \n Accidents and emergencies encountered are reported as per \ncompany procedure \n2.8 \nInformation on road and travel condition is disseminated to the \ncompany as per standard operating procedures \n2.9 \nDumping of truck load is performed as per standard operating \nprocedures. \n3. Monitor and maintain \nstraight truck \nperformance \n  \n3.1 \nDefective or irregular performance or malfunctions are \nmonitored and reported to the appropriate person/authority. \n3.2 \nMinor vehicle maintenance is performed in accordance with \nmanufacturer's instruction \n3.3 \nVehicle records are maintained/updated in accordance with \nworkplace procedures\n\n--- PDF PAGE 63 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n59\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Straight truck \n1.1 \nDump truck \n1.2 \nCement Mixer \n1.3 \nConcrete pump \n1.4 \nTanker with no pivotal pin \n1.5 \nBulk Carrier \n1.6 \nAny Vehicle from 6 to 12 wheelers \n2. Straight Truck \ninspection \n2.1 \nBattery (starting and charging system) \n2.2 \nLight (lighting system) \n2.3 \nOil (lubricating system) \n2.4 \nWater (cooling system) \n2.5 \nAir (intake and exhaust system) \n2.6 \nFuel (fuel system)  \n3. Cargoes \n3.1 \nContainer van \n3.2 \nLoose Cargoes \n3.3 \nTanker  \n3.4 \nSoil, Gravel or Sand \n3.5 \nBulk \n4. Safety harness/devices \ntools materials and \nspare parts \n4.1 \nSeat belt  \n4.2 \nEarly Warning Device \n4.3 \nHandtools (Wrench, pliers, screwdriver, early warning device, \njack, spare tires) \n4.4 \nFlashlights or emergency lighting device \n4.5 \nNylon/wire/chain with binder \n4.6 \nCanvass cover \n4.7 \nPermit to dump materials (environmental/municipal) \n4.8 \nConsumable materials and spare parts such as  \n Rags \n Fan belt \n Fuse \n Electrical tapes \n Brake fluid \n Motor oil \n4.9 \nChain with binder \n4.10 Strap belt \n4.11 Wooden wedge \n4.12 Pole\n\n--- PDF PAGE 64 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n60\n \nVARIABLE \nRANGE \n5. Traffic regulations  \n5.1 \nRegistration, driving license and other relevant permits \n5.2 \nUse of seat belt \n5.3 \nAvail