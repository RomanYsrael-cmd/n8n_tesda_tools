s, etc.) \n2.3 \nUnder hood \n2.4 \nUnderchassis \n2.5 \nPassenger seats  \n2.6 \nSpare tires \n2.7 \nAirconditioning system \n3. Fares \n3.1 \nTickets \n3.2 \nFare matrix  \n \n4. Safety harness/devices \n& tools \n4.1 \nSeat belt  \n4.2 \nEarly Warning Device \n4.3 \nHandtools (Wrench, pliers, screwdriver, early warning device, \njack, spare tires) \n4.4 \nFlashlights or emergency lighting device \n4.5 \nFire extinguisher \n4.6 \nPassenger Hand straps \n4.7 \nEmergency exit door \n4.8 \nConsumable materials and spare parts such as  \n Rags \n Fan belt \n Wheel cap \n Fuse \n Electrical tapes \n Brake fluid \n Motor oil \n5. Traffic regulations  \n5.1 \nRegistration, driving license and other relevant permits \n5.2 \nUse of seat belt \n5.3 \nAvailability of EWD \n5.4 \nObservance of franchise route \n5.5 \nUse of uniform \n5.6 \nCompliance with vehicle emission standards \n5.7 \nObservance of city ordinances\n\n--- PDF PAGE 60 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n56\n \nVARIABLE \nRANGE \n6. Driving hazards \n6.1 \nStalled vehicles and other road obstruction \n6.2 \nExcavation and road repairs \n6.3 \nFlood \n6.4 \nHeavy traffic volume \n6.5 \nAccidents \n6.6 \nHeavy rains and typhoons \n6.7 \nFog/smog \n6.8 \nUncentered force of gravity or inertia \n6.9 \nSlippery roads \n6.10 Rock/Land slides \n6.11 Check points \n6.12 Slow moving vehicles \n6.13 No tail light vehicles \n6.14 Undisciplined pedestrians \n6.15 Winding and zigzag road \n6.16 Blind corners \n6.17 Humps \n6.18 Unattended children along streets \n6.19 Stray animals \n6.20 Open manhole \n6.21 Reckless and uncooperative drivers \n6.22 Loose stones \n6.23 Mental and physical fatigue \n \n7. Occupational Health & \nSafety   \n7.1 \nSafety in handling vehicle and passengers while driving \n7.2 \nSafety on road and traffic management including management \nof pedestrians  \n7.3 \nUse of personal protective equipment and devices such as \nuniform, gas mask, gloves , sunglasses, shoes, cap \n7.4 \nUse of seat belt and early warning devices\n\n--- PDF PAGE 61 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n57"
