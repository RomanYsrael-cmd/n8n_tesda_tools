ntal operation (addition, subtraction, division, \nmultiplication) \n2.2 \nMeasurement system \n2.3 \nPrecision and accuracy \n2.4 \nBasic measuring tools/devices \n3.  Underpinning Skills \n3.1 \nApplying mathematical computations \n3.2 \nUsing calculator \n3.3 \nUsing different measuring tools \n4.  Resource Implications \nThe following resources MUST be provided: \n4.1 \nCalculator \n4.2 \nBasic measuring tools \n4.3 \nCase Problems \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nAuthenticated portfolio \n5.2 \nWritten Test \n5.3 \nInterview/Oral Questioning \n5.4 \nDemonstration \n6.  Context for \nAssessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting\n",
