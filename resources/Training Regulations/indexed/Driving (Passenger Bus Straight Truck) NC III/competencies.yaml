        "source_title": "IMPLEMENT AND COORDINATE ACCIDENT-EMERGENCY PROCEDURES",
        "source_text": "--- PDF PAGE 55 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n51\nUNIT OF COMPETENCY : \nIMPLEMENT AND COORDINATE ACCIDENT-EMERGENCY \nPROCEDURES \n \nUNIT CODE \n: \nALT832304 \n \nUNIT DESCRIPTOR \n: \nThis unit involves the skills, knowledge and attitudes required in \nresponding to emergency incidents, follow-up support and \nassistance and communicate to concerned individual during \nemergency. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Respond to \nemergencies \n \n1.1 \nEmergency and potential emergency situations are identified \nand assessed based on emergency procedure. \n1.2 \nActions are prioritized and provided based on the criticality of \nthe emergency situation. \n1.3 \nIncident reports are prepared in accordance with regulatory \nand workplace procedures \n1.4 \nResponsibilities are fulfilled in accordance with emergency \nprocedures and/or regulatory requirements \n2. Arrange follow-up \nsupport and assistance \n2.1 \nMedical assistance and support is arranged in accordance \nwith workplace procedures \n2.2 \nFirst aid is applied in accordance with medical procedure \n2.3 \nPassenger needs are identified and provided based on \nemergency situation.\n\n--- PDF PAGE 56 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n52\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Emergency \nEmergency situation and incidents may include the following but not \nlimited to: \n1.1 \nVehicle collision \n1.2 \nCrime incidents (hold-up, kidnapping and related crimes) \n1.3 \nHit and run \n1.4 \nFire resulted from engine overheating or faulty electric wiring \n2. Responsibilities \n2.1 \nReporting to police authority \n2.2 \nFacilitate Insurance claim \n2.3 \nInforming victim’s relatives \n2.4 \nRespond to investigation and authority inquiry \n3. Action  \n3.1 \nFacilitating medical assistance \n3.2 \nTransporting of injured passenger to the nearest medical \nfacility \n3.3 \nTransporting of road crime victim to police station \n3.4 \nGiving reminders to passengers while on board the public \ntransport vehicle  \n3.5 \nProviding assistance in controlling the site both prior to and \nfollowing arrival of emergency services\n\n--- PDF PAGE 57 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n53\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate \n1.1 \nResponded to emergency situations \n1.2 \nArranged follow-up support and assistance \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 \nRelevant OHS and environmental procedures and regulations \n2.2 \nKinds of emergency situations \n2.3 \nProcedure to be followed in the event of emergency \n2.4 \nProblem that may arise during emergency situations \n2.5 \nFirst aid practices \n2.6 \nKinds of body injury and how to deal with them \n2.7 \nPositive work values (Honesty, Presence of mind, \nCompassion, etc.) \n \n3. Underpinning Skills \n3.1 \nAppropriate reporting and preparing of necessary \ndocumentation to authority and medical personnel \n3.2 \nHandling injured person \n3.3 \nTransporting injured persons \n3.4 \nHandling and use of fire extinguishers \n3.5 \nFollowing emergency procedures \n3.6 \nHandling crime situations \n4. Resource Implications \nThe following resources MUST be provided: \n4.1 \nSimulation equipment and materials  used for demonstrating \nemergency situation  \n4.2 \nVehicle unit \n4.3 \nA well-ventilated and lighted  room with table and chairs for \nwritten/oral examination \n5. Method of Assessment \nCompetency must be assessed through: \n5.1 \nDemonstration of the task in implementing and coordinating \naccident-emergency procedures \n5.2 \nInterview \n5.3 \nWritten/oral exam \n \n6. Context for \nAssessment \n6.1 \nCompetency must be assessed in actual workplace or \nsimulated environment  \n6.2 \nAssessment of competence must comply with the assessment \nrequirements of the relevant Road and traffic control Authority\n",
