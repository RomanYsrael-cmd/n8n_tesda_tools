        "source_title": "PERFORM PRE- AND POST OPERATION PROCEDURES ON VEHICLES CLASSIFIED UNDER LTO RESTRICTION CODES 3 UP TO 5",
        "source_text": "--- PDF PAGE 46 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n42\nUNIT OF COMPETENCY : \nPERFORM PRE- AND POST OPERATION PROCEDURES ON \nVEHICLES CLASSIFIED UNDER LTO RESTRICTION CODES 3 \nUP TO 5 \n \nUNIT CODE \n: \nALT832305 \n \nUNIT DESCRIPTOR \n: \nThis unit describes the outcomes required in performing \nprocedures before operating vehicles classified under LTO \nrestriction codes 3 up to 5. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Perform visual check \nvehicle \n \n1.1 \nVehicle serviceable parts are checked in accordance with \nvehicle checklist and manufacturer’s procedures. \n1.2 \nWalk-around check is performed with vehicle checklist and \nwith engine stopped/not running. \n1.3 \nElectrical terminal is checked in accordance with \nmanufacturer’s procedures. \n2. Perform “BLOWAF”  \ncheck \n \n2.1 \n“BLOWAF” check is performed in accordance with standard \noperating procedures. \n2.2 \nDeficiencies or findings in BLOWAF check are identified and \nappropriate corrective measures are undertaken in \naccordance with manufacturer’s specification.  \n2.3 \nAbnormal conditions are noted in checklist and reported to \nauthorized person. \n3. Perform operation \ncheck \n \n3.1 \nStarting/running check is performed in accordance with \nmanufacturer’s specifications. \n3.2 \nOperating condition of instruments, gauges, indicators and \ncontrols are performed in accordance with manufacturer’s \nrecommendation. \n3.3 \nOperating condition of air brake and steering controls are \nchecked in accordance with manufacturer’s recommendation. \n3.4 \nWalk-around check, with engine running, is performed in \naccordance with manufacturer’s recommendation. \n3.5 \nSafety devices and accessories are checked for proper \nfunctions in accordance with safe operating procedures.  \n4. Perform post-operation \nprocedures  \n4.1 \nVehicle is parked and engine turned off after productive \noperation in accordance with company rules and regulations. \n4.2 \nVehicle controls are set into neutral position and parking \nbrakes are engaged according to manufacturer’s operations \nmanual. \n4.3 \nSafety locks and brakes are all set/engaged in accordance \nwith operator’s manual. \n4.4 \nWalk-around inspection check is re-conducted while doing \nengine cool down \n4.5 \nDaily vehicle time record/report/inspection  is \naccomplished/submitted according to company rules and \nregulations\n\n--- PDF PAGE 47 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n43\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Vehicle serviceable  \nparts \n \n1.1\nAir cleaner\n1.2 \nBattery terminals/Connection \n1.3 \nBelt \n1.4 \nTires \n1.5 \nGrease/lube points \n1.6 \nFuel water separator \n1.7 \nAir tank \n1.8 \nRadiator \n1.9 \nMirrors \n1.10 Lights (signal, back, tail, head) \n1.11\nAir hose and connectors\n2. Walk-around check \n \n2.1\nTires \n2.2 \nLeaks (oil, water, air, fluid)  \n2.3 \nWorn out/damaged parts  \n2.4 \nFluid levels \n2.5 \nLoose parts/connections \n2.6 \nMissing parts \n2.7 \nGauges and controls \n2.8 \nSafety devices (seat belt, EWD, blinkers)  \n2.9 \nUnusual sounds \n2.10 Window glass \n2.11 Passenger’s seat condition \n2.12 Curtains \n2.13\nBaggage compartment\n3. B L O W A F check\n \n3.1 \nBattery (starting and charging system)\n3.2  \nLight (lighting system) \n3.3  \nOil (lubricating system) \n3.4  \nWater (cooling system) \n3.5  \nAir (intake and exhaust system) \n3.6 \nFuel (fuel system)\n4. Deficiencies\n \n \n4.1\nFluid level (oil, coolant, electrolyte/distilled water)\n4.2 \nAir pressure (tire and brake) \n4.3 \nDefective light bulbs, lens and reflector \n4.4\nMalfunctioning air-conditioning system\n5. Authorized person\n5.1\nSupervisor\n5.2 \nDispatcher  \n5.3 \nMaintenance personnel  \n5.4\nConductor\n6. Safety devices and \naccessories \n6.1\nBlinkers\n6.2 \nSafety belt \n6.3 \nWindshield guard \n6.4 \nWarning light siren \n6.5\nEarly Warning Device (EWD)\n7. Safety locks\n7.1\nPower Door and lock\n7.2 \nMaxi Brake \n7.3 \nDifferential lock \n7.4 \nSteering lock \n7.5\nParking Brakes\n8.  Vehicle\n8.1\nPassenger Bus\n8.2\nStraight Truck\n\n--- PDF PAGE 48 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n44\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nPerformed visual check of articulated vehicle  \n1.2 \nPerformed “BLOWAF” inspection  \n1.3 \nPerformed operation check  \n1.4 \nPerformed post operation procedures \n2. Underpinning  \nKnowledge and \nAttitude \n \n \n2.1 \nKinds of Articulated vehicle  and capacity \n2.2 \nKinds of Busses  and capacity \n2.3 \nTypes of Straight Trucks and capacity \n2.4 \nKinds of Passengers and Loads \n2.5 \nControls, instruments, indicators and their usage \n2.6 \nPrinciple of operation of electrical, pneumatics and hydraulic \nsystems \n2.7 \nLubricants and oils \n2.8 \nBasic mathematics (MDAS) \n2.9 \nLocal and national road traffic regulations \n2.10 Starting and shutdown procedures \n2.11 Manufacturer’s operation manual \n2.12 Job site and work conditions \n2.13 Documentation (tickets, forms, checklists ,receipts, reports) \n2.14 Pre- and post-operation procedures \n2.15 Positive work values (honesty, courtesy, cost/time/quality \nconsciousness, etc.) \n3. Underpinning Skills \n \n3.1 \nCommunication skills  \n3.2 \nPerforming pre- and post-operation procedures on vehicle \nwith standard or special attachments \n3.3 \nAccomplishing pre- and post-operation checklist \n3.4 \nHandling Passengers \n3.5 \nComputation skills on fare, distances and time \n4. Resource Implications \n \nThe following resources must be provided: \n4.1 \nPassenger Bus or Straight truck  \n4.2 \nAppropriate work area for the activity \n4.3 \nTools, materials and equipment \n4.4 \nVehicle operator’s manual \n5. Method of Assessment \n \nCompetency must be assessed through:  \n5.1 \nWritten examination \n5.2 \nObservation with questioning \n5.3 \nDemonstration with questioning \n5.4 \nPortfolio \n6. Context for \nAssessment \nCompetency must be assessed in the workplace or in a simulated \nworkplace environment accredited by TESDA.\n",
