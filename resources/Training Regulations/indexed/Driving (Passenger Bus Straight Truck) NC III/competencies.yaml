        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate\n1.1\nIdentified nature/scope of work\n1.2\nPrepared and presented estimate\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nConsumer mathematics\n2.2\nReplaceable/Fabricated Materials or Spare parts in a vehicle\n2.3\nAutomotive Repair Procedures and Techniques\n2.4\nJob estimates\n3. Underpinning skills\n3.1\nComputing using the Four Mathematical Operations\n3.2\nEstimating repair works and activities\n4. Resource implication\nThe following resources must be provided:\n4.1\nAppropriate tools such as calculator, paper, pen, and other\nmeasuring instruments relevant to activity\n5. Methods of\nassessment\n\nCompetency must be assessed through:\n5.1\nObservation with questioning\n5.2\nPresentation of Finished drawing\n6. Context for\nassessment\n\n6.1\nCompetency must be assessed in a room or any simulated\nplaces\n6.2\nAssessment must be given according to industry standard\n\n--- PDF PAGE 43 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n39\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM MINOR MAINTENANCE AND SERVICING ON\nVEHICLES CLASSIFIED UNDER LTO RESTRICTION CODES 3\nUP TO 5\n\nCODE NO.\n:"
