  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in DRIVING (Passenger Bus/Straight Truck) NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nlead in the dissemination and discussion of ideas, information and\nissues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1\nAppropriate communication method is selected\n1.2\nMultiple operations involving several topics areas are\ncommunicated accordingly\n1.3\nQuestions are used to gain extra information\n1.4\nCorrect sources of information are identified\n1.5\nInformation is selected and organized correctly\n1.6\nVerbal and written reporting is undertaken when required\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1\nResponse to workplace issues are sought\n2.2\nResponse to workplace issues are provided immediately\n2.3\nConstructive contributions are made to workplace discussions\non such issues as production, quality and safety\n2.4\nGoals/objectives and action plan undertaken in the workplace\nare communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1\nIssues and problems are identified as they arise\n3.2\nInformation regarding problems and issues are organized\ncoherently to ensure clear and effective communication\n3.3\nDialogue is initiated with appropriate personnel\n3.4\nCommunication problems and issues are raised as they arise\n\n--- PDF PAGE 7 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3\nFace to face\n1.4\nTwo-way radio\n1.5\nSpeaking to groups\n1.6\nUsing telephone\n1.7\nWritten\n1.8\nInternet\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning Skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of written\nand electronic communication methods\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context for\nAssessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment\n\n--- PDF PAGE 8 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n4\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\n\nUNIT CODE\n:\n500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead small\nteams including setting and maintaining team and individual\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to team\nmembers\n1.2\nReasons for instructions and requirements are communicated\nto team members\n1.3\nTeam members’ queries and concerns are recognized,\ndiscussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having regard to the\nskills, knowledge and aptitude required to properly undertake\nthe assigned task and according to company policy\n2.2\nDuties are allocated having regard to individual preference,\ndomestic and personal considerations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on client\nneeds and according to assignment requirements\n3.2\nPerformance expectations are based on individual team\nmembers duties and area of responsibility\n3.3\nPerformance expectations are discussed and disseminated to\nindividual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against defined\nperformance criteria and/or assignment instructions and\ncorrective action taken if required\n4.2\nTeam members are provided with feedback, positive support\nand advice on strategies to overcome any deficiencies\n4.3\nPerformance issues which cannot be rectified or addressed\nwithin the team are referenced to appropriate personnel\naccording to employer policy\n4.4\nTeam members are kept informed of any changes in the\npriority allocated to assignments or tasks which might impact\non client/customer needs and satisfaction\n4.5\nTeam operations are monitored to ensure that employer/client\nneeds and requirements are met\n4.6\nFollow-up communication is provided on all issues affecting\nthe team\n4.7\nAll relevant documentation is completed in accordance with\ncompany procedures\n\n--- PDF PAGE 9 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s\nconcerns\n2.1\nRoster/shift details\n\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 10 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n6\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2\nAssessed and monitored team and individual performance\nagainst set criteria\n1.3\nRepresented concerns of a team and individual to next level of\nmanagement or appropriate specialist and to negotiate on\ntheir behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5\nSet and communicated performance expectations for a range\nof tasks and duties within the team and provided feedback to\nteam members\n2. Underpinning\nKnowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning Skills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual member\nin relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context for\nAssessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 11 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n7\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE\n:\n500311111\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome and\nparticipate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\nInformation on preparing for negotiation is identified and\nincluded in the plan\n1.2\nInformation on creating non verbal environments for positive\nnegotiating is identified and included in the plan\n1.3\nInformation on active listening is identified and included in\nthe plan\n1.4\nInformation on different questioning techniques is identified\nand included in the plan\n1.5\nInformation is checked to ensure it is correct and up-to- date\n\n2. Participate in\nnegotiations\n2.1\nCriteria for successful outcome are agreed upon by all parties\n2.2\nDesired outcome of all parties are considered\n2.3\nAppropriate language is used throughout the negotiation\n2.4\nA variety of questioning techniques are used\n2.5\nThe issues and processes are documented and agreed upon\nby all parties\n2.6\nPossible solutions are discussed and their viability assessed\n2.7\nAreas for agreement are confirmed and recorded\n2.8\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 12 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\nBackground information on other parties to the negotiation\n1.2\nGood understanding of topic to be negotiated\n1.3\nClear understanding of desired outcome/s\n1.4\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6\nAnalytic skills\n1.6.1 observing differences between content and process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for resolving\nconflict\n2. Non verbal\nenvironments\n2.1\nFriendly reception\n2.2\nWarm and welcoming room\n2.3\nRefreshments offered\n2.4\nLead in conversation before negotiation begins\n3. Active listening\n3.1\nAttentive\n3.2\nDon’t interrupt\n3.3\nGood posture\n3.4\nMaintain eye contact\n3.5\nReflective listening\n4. Questioning\ntechniques\n4.1\nDirect\n4.2\nIndirect\n4.3\nOpen-ended\n\n--- PDF PAGE 13 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n9\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2\nParticipated in negotiation with at least one person to achieve\nan agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCodes of practice and guidelines for the organization\n2.2\nOrganizations policy and procedures for negotiations\n2.3\nDecision making and conflict resolution strategies procedures\n2.4\nProblem solving strategies on how to deal with unexpected\nquestions and attitudes during negotiation\n2.5\nFlexibility\n2.6\nEmpathy\n3. Underpinning Skills\n3.1\nInterpersonal skills to develop rapport with other parties\n3.2\nCommunication skills (verbal and listening)\n3.3\nObservation skills\n3.1\nNegotiation skills\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nRoom with facilities necessary for the negotiation process\n4.2\nHuman resources (negotiators)\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation/demonstration and questioning\n5.2\nPortfolio assessment\n5.3\nOral and written questioning\n5.4\nThird party report\n6. Context for\nAssessment\nCompetency to be assessed in real work environment or in a\nsimulated workplace setting.\n\n--- PDF PAGE 14 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n10\nUNIT OF COMPETENCY\n:\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n:\n500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required to\nsolve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the root\ncause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1\nVariances are identified from normal operating parameters;\nand product quality\n1.2\nExtent, cause and nature are of the problem are defined\nthrough observation, investigation and analytical techniques\n1.3\nProblems are clearly stated and specified\n2. Determine fundamental\ncauses of the problem\n2.1\nPossible causes are identified based on experience and the\nuse of problem solving tools / analytical techniques.\n2.2\nPossible cause statements are developed based on findings\n2.3\nFundamental causes are identified per results of investigation\nconducted\n3. Determine corrective\naction\n3.1\nAll possible options are considered for resolution of the\nproblem\n3.2\nStrengths and weaknesses of possible options are considered\n3.3\nCorrective actions are determined to resolve the problem and\npossible future causes\n3.4\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in accordance with\nsafety and operating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations are prepared\n4.2\nRecommendations are presented to appropriate personnel.\n4.3\nRecommendations are followed-up, if required\n\n--- PDF PAGE 15 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 16 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n12\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios /\ncase studies / what ifs as a stimulus with a walk through forming part\nof the response. These assessment activities should include a range\nof problems, including new, unusual and improbable situations that\nmay have happened.\n2. Underpinning\nKnowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating parameters,\nand product quality to recognize non-standard situations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1 Relevant equipment and operational processes\n2.2.2 Enterprise goals, targets and measures\n2.2.3 Enterprise quality, OHS and environmental requirement\n2.2.4 Principles of decision making strategies and techniques\n2.2.5 Enterprise information systems and data collation\n2.2.6 Industry codes and standards\n3. Underpinning Skills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n4. Resource Implications\n4.1\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well\nas bank of questions which will be used to probe the reason\nbehind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nCase studies on solving problems in the workplace\n5.2\nObservation\nThe unit will be assessed in a holistic manner as is practical and may\nbe integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations, which\nwill include disruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual workplace\nand will include walk through of the relevant competency\ncomponents.\n6. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 17 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n13\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\n\nUNIT CODE\n:\n500311113\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\napplication of mathematical concepts and techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1\nProblem areas are identified based on given condition\n1.2\nMathematical techniques are selected based on the given\nproblem\n2. Apply mathematical\nprocedure/solution\n2.1\nMathematical techniques are applied based on the problem\nidentified\n2.2\nMathematical computations are performed to the level of\naccuracy required for the problem\n2.3\nResults of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1\nResult of application is reviewed based on expected and\nrequired specifications and outcome\n3.2\nAppropriate action is applied in case of error\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1\nFour fundamental operations\n1.2\nMeasurements\n1.3\nUse/Conversion of units of measurements\n1.4\nUse of standard formulas\n2. Appropriate action\n2.1\nReview in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2\nReport error to immediate superior for proper action\n\n--- PDF PAGE 18 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n14\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Underpinning\nKnowledge\n2.1\nFundamental operation (addition, subtraction, division,\nmultiplication)\n2.2\nMeasurement system\n2.3\nPrecision and accuracy\n2.4\nBasic measuring tools/devices\n3. Underpinning Skills\n3.1\nApplying mathematical computations\n3.2\nUsing calculator\n3.3\nUsing different measuring tools\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nCalculator\n4.2\nBasic measuring tools\n4.3\nCase Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nAuthenticated portfolio\n5.2\nWritten Test\n5.3\nInterview/Oral Questioning\n5.4\nDemonstration\n6. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 19 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n15\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\n\nUNIT CODE\n:\n500311114\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills, and attitude\nrequired in selecting, sourcing and applying appropriate and\naffordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study/select\nappropriate technology\n\n1.1\nUsage of different technologies is determined based on job\nrequirements\n1.2\nAppropriate technology is selected as per work specification\n2. Apply relevant\ntechnology\n\n2.1\nRelevant technology is effectively used in carrying out function\n2.2\nApplicable software and hardware are used as per task\nrequirement\n2.3\nManagement concepts are observed and practiced as per\nestablished industry practices\n3. Maintain/enhance of\nrelevant technology\n3.1\nMaintenance of technology is applied in accordance with the\nindustry standard operating procedure, manufacturer’s\noperating guidelines and occupational health and safety\nprocedure to ensure its operative ability\n3.2\nUpdating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3\nTechnology failure/ defect is immediately reported to the\nconcern/responsible person or section for appropriate action\n\n--- PDF PAGE 20 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1\nOffice technology\n1.2\nIndustrial technology\n1.3\nSystem technology\n1.4\nInformation technology\n1.5\nTraining technology\n2. Management concepts\nMay include but not limited to:\n2.1\nReal Time Management\n2.2\nKAIZEN or continuous improvement\n2.3\n5s\n2.4\nTotal Quality Management\n2.5\nOther management/productivity tools\n3. Industry standard\noperating procedure\n3.1\nWritten guidelines relative to the usage of office\ntechnology/equipment\n3.2\nVerbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1\nWritten instruction/manuals of specific technology/ equipment\n4.2\nGeneral instruction manual\n4.3\nVerbal advise from manufacturer relative to the operation of\nequipment\n5. Occupational health\nand safety procedure\n5.1\nRelevant statutes on OHS\n5.2\nCompany guidelines in using technology/equipment\n\n6. Appropriate action\n6.1\nImplementing preventive maintenance schedule\n6.2\nCoordinating with manufacturer’s technician\n\n--- PDF PAGE 21 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n17\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nStudied and selected appropriate technology consistent with\nwork requirements\n1.2\nApplied relevant technology\n1.3\nMaintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nKnowledge\n2.1\nAwareness on technology and its function\n2.2\nRepair and maintenance procedure\n2.3\nOperating instructions\n2.4\nApplicable software\n2.5\nCommunication techniques\n2.6\nHealth and safety procedure\n2.7\nCompany policy in relation to relevant technology\n2.8\nDifferent management concepts\n2.9\nTechnology adaptability\n3. Underpinning Skills\n3.1\nRelevant technology application/implementation\n3.2\nBasic communication skills\n3.3\nSoftware applications skills\n3.4\nBasic troubleshooting skills\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nRelevant technology\n4.2\nInterview and demonstration questionnaires\n4.3\nAssessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1\nInterview\n5.2\nActual demonstration\n5.3\nAuthenticated portfolio (related certificates of training/seminar)\n6. Context for\nAssessment\nCompetency may be assessed in actual workplace or simulated\nenvironment\n\n--- PDF PAGE 22 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n18\nCOMMON COMPETENCIES\nAUTOMOTIVE\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n:\nALT311202\n\nUNIT DESCRIPTOR\n:\nThis unit includes identifying caring, handling and use of\nmeasuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select measuring\ninstruments\n1.1\nObject or component to be measured is identified\n1.2\nCorrect specifications are obtained from relevant source\n1.3\nAppropriate measuring instrument is selected according to\njob requirements\n2. Carry out\nmeasurements and\ncalculation\n2.1\nMeasuring tools are selected in line with job requirements\n2.2\nAccurate measurements are obtained to job\n2.3\nCalculation needed to complete work tasks are performed\nusing the four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/).\n2.4\nCalculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks.\n2.5\nNumerical computation is self-checked and corrected for\naccuracy\n2.6\nInstruments are read to the limit of accuracy of the tool.\n3. Maintain measuring\ninstruments\n3.1\nMeasuring instruments must kept free from corrosion\n3.2\nMeasuring instruments not dropped to avoid damage\n3.3\nMeasuring instruments cleaned before and after using.\n\n--- PDF PAGE 23 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\nMeasuring instruments includes:\n1.1\nMultitester\n1.2\nMicrometer (In-out, depth)\n1.3\nVernier caliper (Out, inside)\n1.4\nDial Gauge with Mag. Std.\n1.5\nPlastigauge\n1.6\nStraight Edge\n1.7\nThickness gauge\n1.8\nTorque Gauge\n1.9\nSmall Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nKinds of Part Mensuration include:\n2.1\nVolume\n2.2\nArea\n2.3\nDisplacement\n2.4\nInside diameter\n2.5\nCircumference\n2.6\nLength\n2.7\nThickness\n2.8\nOutside diameter\n2.9\nTaper\n2.10 Out of roundness\n2.11 Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 24 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n20\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSelected measuring instruments\n1.2\nCarried-out measurements and calculations.\n1.3\nMaintained measuring instruments\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nTypes of Measuring instruments and its uses\n2.2\nSafe handling procedures in using measuring instruments\n2.3\nFour fundamental operation of mathematics\n2.4\nFormula for Volume, Area, Perimeter and other geometric\nfigures\n3. Underpinning Skills\n3.1\nCaring and Handling measuring instruments\n3.2\nCalibrating and using measuring instruments\n3.3\nPerforming calculation by Addition, Subtraction, Multiplication\nand Division\n3.4\nVisualizing objects and shapes\n3.5\nInterpreting formula for volume, area, perimeter and other\ngeometric figures\n4. Resource Implication\nThe following resources must be provided:\n4.1\nWorkplace location\n4.2\nMeasuring instrument appropriate to servicing processes\n4.3\nInstructional materials relevant to the propose activity\n5. Methods of\nAssessment\n\nCompetency must be assessed through:\n5.1\nObservation with questioning\n5.2\nWritten or oral examination\n5.3\nInterview\n5.4\nDemonstration with questioning\n6. Context for\nAssessment\n\n6.1\nCompetency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment may be conducted in a workplace or simulated\nenvironment\n\n--- PDF PAGE 25 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n21\nUNIT TITLE\n:\nREAD, INTERPRET AND APPLY SPECIFICATION AND\nMANUALS.\n\nUNIT CODE\n:\nALT723203\n\nUNIT DESCRIPTOR\n:\nThis unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and\nperiodic maintenance manual.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify and access\nmanual/ specification\n1.1\nAppropriate manuals are identified and accessed as per job\nrequirements.\n1.2\nVersion and date of manual is checked to ensure correct\nspecification and procedure are identified.\n2. Interpret manuals\n2.1\nRelevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2\nInformation and procedure in the manual are interpreted in\naccordance to industry practices\n3. Apply information in\nmanual\n\n3.1\nManual is interpreted according to job requirements\n3.2\nWork steps are correctly identified in accordance with\nmanufacturer specification\n3.3\nManual data is applied according to the given task\n3.4\nAll correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n4. Store manuals\n4.1\nManual or specification are stored appropriately to ensure\nprevention of damage, ready access and updating of\ninformation when required in accordance with company\nrequirements\n\n--- PDF PAGE 26 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manuals\n\nKinds of manuals:\n1.1\nManufacturer’s specification manual\n1.2\nRepair manual\n1.3\nMaintenance Procedure Manual\n1.4\nPeriodic Maintenance Manual\n\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified and accessed manual/specification\n1.2\nInterpreted manuals\n1.3\nApplied information in manuals\n1.4\nStored manuals\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nTypes of manuals used in automotive industry\n2.2\nIdentification of symbols used in the manuals\n2.3\nIdentification of units of measurements\n2.4\nUnit conversion\n3. Underpinning Skills\n\n3.1\nReading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2\nAccessing information and data\n4. Resource Implication\n\nThe following resources must be provided:\n4.1\nAll manuals/catalogues relative to Automotive\n4.2\nJob order, requisitions\n4.3\nActual vehicle or simulator\n5. Methods of\nAssessment\n\nCompetency must be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n6. Context for\nAssessment\n\n6.1\nAssessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2\nAssessment may be conducted in the workplace or a\nsimulated environment.\n\n--- PDF PAGE 27 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n23\nUNIT OF COMPETENCY :\nMOVE AND POSITION VEHICLE\n\nUNIT CODE\n:\nALT723202\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the knowledge, skills and attitude\nneeded to move and position vehicle in a workshop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare vehicle for\ndriving\n1.1\nCorrect check-up procedures performed based on vehicle\nmanufacturer standard\n2. Move and position\nvehicle\n2.1\nSelect vehicle to be moved or re-position.\n2.2\nDrive the vehicle to appropriate location\n2.3\nPark vehicle following parking safety techniques and\nprocedure\n3. Check the vehicle\n3.1\nVehicle position is checked as per required\n3.2\nVehicle is checked for external damages\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Check up procedure\nCheck up procedures include the following:\n1.1\nOil level\n1.2\nBrake fluid\n1.3\nClutch fluid\n1.4\nCoolant level\n1.5\nBattery (electrolyte)\n1.6\nTire pressure\n1.7\nPosition of driving gear\n1.8\nLighting and warning devices\n2. Vehicles\n2.1\nVehicles with automatic transmission\n2.2\nVehicles with manual transmission\n3. Parking safety\ntechniques\n3.1\nEngaging of Park brake\n3.2\nVehicle parking position\n3.3\nFront wheel position\n\n--- PDF PAGE 28 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n24\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared vehicle for driving.\n1.2\nMoved and positioned vehicle\n1.3\nChecked the vehicle.\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nDriver’s Code of conduct\n2.2\nWorkshop signs and symbols\n2.3\nDriving skills\n2.4\nVehicle accessories for safe driving and parking\n3. Underpinning Skills\n3.1\nAbility to handle vehicle/maneuver vehicle the easiest way\n3.2\nImmediate response to accident\n3.3\nPreparing vehicle for driving\n3.4\nParking Downhill, Uphill, Parallel\n3.5\nShifting Gears\n3.6\nManeuvering\n4. Resource Implication\nThe following resources must be provided:\n4.1\nDriving range/area\n4.2\nAppropriate vehicle for driving\n4.3\nVehicle accessories\n5. Method of\nAssessment\nCompetency must be assessed through:\n5.1\nObservation with questioning\n5.2\nWritten or oral examination\n6. Context for\nAssessment\n6.1\nAssessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2\nAssessment of practical skills must be done in a workplace or\nsimulated environment.\n\n--- PDF PAGE 29 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n25\nUNIT OF COMPETENCY :\nAPPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE\n:\nALT723201\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the selection and application of\nsealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1\nSealant/adhesive selected in line with job requirements and\nmanufacturer’s specification\n1.2\nSealant/adhesive checking is performed to ensure that\nproduct is fit for use.\n2. Prepare surface for\nSealant/adhesive\n2.1\nSurface materials are identified as per construction\n2.2\nSurface is cleaned and free of moisture, dust and other\nforeign matters to ensure maximum adhesion or seal.\n3. Apply sealant/adhesive\nevenly\n3.1\nSealant/adhesive is applied evenly on the surface in line with\nmanufacturer’s specification\n3.2\nExcess sealant/adhesive is removed by sanding or scrapping\n3.3\nTools and equipment used to apply sealant/adhesive are\nappropriate to job requirements\n3.4\nSafety are observed and PPE are worn in accordance with\nindustry SOP\n3.5\nHazards associated with the use of sealant and adhesives are\nidentified.\n4. Store/Dispose of\nsealant/adhesive\n4.1\nSealant/adhesive are stored as per prescribed procedure\n4.2\nWaste are disposed as per workshop SOP\n\n--- PDF PAGE 30 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n26\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1\nForm in Place Gasket (FIPG)\n1.2\nRibbon Sealer\n1.3\nHametite\n1.4\nSilicon Body sealer\n1.5\nPrestite for Auto and Auto Aircon\n\n2. Tools and equipment\nTools and equipment include:\n2.1\nPutty knife\n2.2\nScraper\n2.3\nCompressor\n2.4\nSteel brush\n2.5\nPaint brush\n2.6\nRubber hammer\n2.7\nHand tools\nPersonal protective equipment include:\n2.8\nGloves\n2.9\nApron\n2.10 Safety shoes\n2.11 Goggles\n2.12 Gas mask\n\n3. Safety\nSafety includes:\n3.1\nVentilation\n3.2\nHandling of Flammable/Irritating substances\n3.3\nUse of Personal Protective Equipment\n4. Hazards\nHazard includes:\n4.1\nFumes\n4.2\nSkin irritation\n4.3\nBurns\n\n5. Adhesive/Sealant\nchecking\n\nAdhesive/Sealant checking includes:\n5.1\nExpiry date\n5.2\nFree of contamination\n5.3\nCap/Covers\n5.4\nTightly closed\n5.5\nConcentration\n\n--- PDF PAGE 31 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n27\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nIdentified appropriate sealant/adhesives\n1.2\nPrepared surface for sealant/adhesive\n1.3\nApplied sealant/adhesive\n1.4\nStored unused or dispose of used sealant/adhesive\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nOH & S regulations\n2.2\nSafe handling of sealant/adhesive\n2.3\nIndustry code of practice\n2.4\nProcedures in sealant/adhesive application\n2.5\nProcedures in interpreting manuals\n3. Underpinning Skills\n3.1\nHandling sealant/adhesive\n3.2\nApplying sealant/adhesive\n3.3\nSanding the surface\n3.4\nUse of tools, equipment\n3.5\nMixing of body filler and epoxy base and hardener\n4. Resource Implication\nThe following resources must be provided:\n4.1\nMaterials relevant to the activity\n4.2\nAppropriate tools and equipment\n4.3\nReal or simulated workplace\n\n5. Methods of\nAssessment\n\nCompetency must be assessed through\n5.1\nObservation with questioning\n5.2\nInterview related to:\n• Safe and correct use of tools and equipment\n• Application of adhesive/sealant\n6. Context for\nAssessment\n\n6.1\nCompetency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment may be done in a workplace or simulated\nenvironment\n\n--- PDF PAGE 32 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n28\nUNIT OF COMPETENCY :\nUSE AND APPLY LUBRICANTS/COOLANT\n\nUNIT CODE\n:\nALT723204\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competencies required to select and apply\ndifferent types of lubricants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify types of\nlubricants/ coolant\n1.1\nCorrect information on lubrication schedule is accessed and\ninterpreted from appropriate manufacturers specifications\nmanuals\n1.2\nType and quantity of lubricants/coolant is identified as per\njob requirements\n2. Use and apply\nlubricants/coolant\n2.1\nCorrect procedure for change of lubricant is identified\nfollowing manufacturer’s specification or manual\n2.2\nCorrect tools and equipment are selected and used in line with\njob requirements\n2.3\nExisting lubricants is removed and replaced with specified\ntypes and quantity of new materials in line with manufacturer’s\nspecification\n2.4\nSafe procedure and use of PPE is observed when removing\nor replacing lubricant\n2.5\nUsed lubricants are disposed in accordance with\nenvironmental guidelines\n2.6\nWork is checked in line with company SOP.\n3. Perform housekeeping\nactivities\n\n3.1\nTools, equipment and materials are properly stored as per\ncompany SOP\n3.2\nWorkplace is free from waste materials\n\n--- PDF PAGE 33 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manuals\n1.1\nManufacturer’s specification manual\n1.2\nPeriodic Maintenance manual\n1.3\nService Manual\n\n2. Lubricants/ Coolant\n\nKinds of lubricants include:\n2.1\nEngine oil:\n• Diesel engine oil\n• Gasoline engine oil\n2.2\nAutomatic Transmission Fluid\n• Destro II\n• T4\n2.3\nGear oil lubricants:\n• Oil #90\n• Oil #140\n• Oil #30\n• Oil #40\n2.4\nGrease\n• Special (velocity joint)\nMolybdenum disolfate)\n• Ordinary\n• Multi-purpose oil\n• Contact point lubricant\n(grease)\n2.5\nBrake/Clutch System\n• Brake fluid\n• DOT3\n2.6\nPower Steering Fluid\n• Hydraulic Fluid\n2.7\nRadiator Coolant\n• Long last coolant\n2.8\nA/C Compressor Oil\n• Pag oil\n3. Lubricant Schedule\nSchedule for changing oil:\n3.1\nKilometers traveled used\n3.2\nNo. of Hours used\n3.3\nMonthly\n\n4. Tool and equipment\nTools used includes:\n4.1\nHand tools\n4.2\nOiler\n4.3\nOil Dispenser\n4.4\nGrease gun\n\n5. Personal Protective\nEquipment (PPE)\n\nPPE include:\n5.1\nApron\n5.2\nGloves\n5.3\nGoggles\n5.4\nSafety shoes\n\n--- PDF PAGE 34 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n30\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nIdentified types of lubricants and lubrication schedule.\n1.2\nUsed and applied lubricants.\n1.3\nPerformed housekeeping\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nTypes/Classification of Lubricants\n2.2\nIdentifying lubrication schedule\n2.3\nCause and Effects of Gear Oil Dilution\n2.4\nPurpose of Lubrication (Problem and effects)\n2.5\nHazard associated with lubrication\n3. Underpinning Skills\n3.1\nHandling of oils (Gear, oil, engine oil)\n3.2\nFamiliarization/Classification of Lubricants\n3.3\nLubrication Procedure\n4. Resource Implication\n\nThe following resources must be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate tools and equipment\n4.3\nMaterials relevant to activity\n\n5. Methods of\nAssessment\n\nCompetency must be assessed through\n5.1\nDemonstration with questioning\n5.2\nWritten/Oral examination\n6. Context for\nAssessment\n\n6.1\nCompetency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment must be undertaken in accordance with the\nendorsed industry assessment guidelines\n6.3\nAssessment of underpinning knowledge and skills may be\nassessed on or off the job\n\n--- PDF PAGE 35 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n31\nUNIT OF COMPETENCY :\nPERFORM SHOP MAINTENANCE\n\nUNIT CODE\n:\nALT723307\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work area including\ntools, equipment and facilities. Storage and checking of tools/\nequipment and disposal of used materials are also incorporated in\nthis competency\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools and\nwork area\n1.1\nCleaning solvent used as per workshop/tools cleaning\nrequirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop equipment\n\n2.1\nTools/equipment are checked and stored in their respective\nshelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per workshop SOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and repair\nrecommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 36 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning requirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMap\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1\nVehicle/plant manufacturer specifications\n3.2\nCompany operating procedures\n3.3\nIndustry/Workplace Codes of Practice\n3.4\nProduct manufacturer specifications\n3.5\nCustomer requirements\n3.6\nIndustry Occupational Health &Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1\nGloves\n4.2\nApron\n4.3\nGoggles\n4.4\nSafety shoes\n\n--- PDF PAGE 37 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n33\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nProcedure\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\n5S or TQM\n2.2\nService procedures\n2.3\nRelevant technical information\n2.4\nSafe handling of Equipment and tools\n2.5\nVehicle safety requirements\n2.6\nWorkshop policies\n2.7\nPersonal safety procedures\n2.8\nFire Extinguishers and prevention\n2.9\nStorage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n\n3. Underpinning Skills\n3.1\nHandling/Storing of tools/equipment/supplies and material\n3.2\nCleaning grease/lubricants\n3.3\nDisposing of wastes and fluid\n3.4\nPreparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource Implications\nThe following resources must be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of Assessment\nCompetency must be assessed through:\n5.1\nWritten/Oral Questioning\n5.2\nDemonstration\n6. Context for\nAssessment\n6.1\nCompetency must be assessed on the job or simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 38 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n34\nUNIT OF COMPETENCY :\nINTERPRET/DRAW TECHNICAL DRAWING\n\nCODE\n:\nALT311205\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competencies required to draw/interpret\nbasic trade drawing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret technical\ndrawing\n1.1\nComponents, assemblies or objects recognized as required\n1.2\nDimensions identified as appropriate to the field of\nemployment\n1.3\nInstructions identified and followed as required\n1.4\nMaterial and other consumable requirements identified as\nrequired\n1.5\nSymbols recognized as appropriate in drawing\n2. Select correct technical\ndrawing\n\n2.1\nDrawing checked and validated against job requirements or\nequipment\n2.2\nDrawing version checked and validated according to the\nManual\n3. Apply freehand\nsketching\n3.1\nCorrect freehand sketching is produced using the necessary\ntools and materials\n\n--- PDF PAGE 39 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\n1.1\nDrawing symbols\n1.2\nAlphabet of lines\n1.3\nOrthographic views\n1.3.1 Front view\n1.3.2 Right side view/left side view\n1.3.3 Top view\n1.3.4 Pictorial\n1.4\nSchematic diagram\n2. Manual\n2.1\ntechnical drawing manual\n2.2\nmanufacturers schematic diagram\n3. Consumables\n3.1\ndrawing plate\n3.2\npencil and eraser\n3.3\nscotch tape\n4. Tools and materials\n4.1\ncompass\n4.2\ndivider\n4.3\nrulers\n4.4\ntriangles\n4.5\ndrawing tables\n4.6\ncomputer\n\n--- PDF PAGE 40 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n36\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted technical drawing\n1.2\nSelected correct technical drawing\n1.3\nApplied freehand sketching\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nDrawing standard symbols\n2.2\nSafe handling of tools and consumables\n2.3\nIdentification of types of drawing\n3. Underpinning Skills\n3.1\nDraw/interpret orthographic drawing\n3.2\nHandling of drawing instruments\n4. Resource Implication\nThe following resources must be provided:\n4.1\nDrawing room\n4.2\nAppropriate tools\n4.3\nMaterials relevant to activity\n5. Method of Assessment\nCompetency must be assessed through:\n5.1\nObservation with questioning\n5.2\nWritten/Oral examination\n5.3\nPresentation of Finished drawing\n\n6. Context for\nAssessment\n6.1\nMust be assessed in a drawing room or any simulated places\n6.2\nAssessment must be given according to industry standard\n\n--- PDF PAGE 41 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n37\nUNIT OF COMPETENCY :\nPREPARE JOB ESTIMATE/COSTING\n\nCODE\n:\nALT311204\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the knowledge, skills and attitude in\nestimating/costing automotive repair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify nature/scope\nof work\n1.1\nEffective communication skills are applied to determine the\nnature and scope of work to be undertaken\n1.2\nExtent of service to be rendered in determined and\ndocumented in line with standard operating procedures (SOP)\n2. Prepare and present\nestimate\n2.1\nType and quantity of supplies, materials and labor required to\nperform work are identified in line with job requirements\n2.2\nCost of supplies, materials are obtained from suppliers\n2.3\nTotal cost of required services is calculated in line with SOP\n2.4\nEstimate is presented to customer in line with SOP.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Communication\nCommunication includes:\n1.1\nListening to customer\n1.2\nSpeaking with suppliers, customers and co-workers\n1.3\nQuestioning\n2. Suppliers\nSuppliers includes:\n2.1\nDistributors\n2.2\nManagers\n2.3\nProprietors\n3. Cost\nCosts include:\n3.1\nMaterials\n3.2\nLabor\n3.3\nOverhead\n\n--- PDF PAGE 42 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n38\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate\n1.1\nIdentified nature/scope of work\n1.2\nPrepared and presented estimate\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nConsumer mathematics\n2.2\nReplaceable/Fabricated Materials or Spare parts in a vehicle\n2.3\nAutomotive Repair Procedures and Techniques\n2.4\nJob estimates\n3. Underpinning skills\n3.1\nComputing using the Four Mathematical Operations\n3.2\nEstimating repair works and activities\n4. Resource implication\nThe following resources must be provided:\n4.1\nAppropriate tools such as calculator, paper, pen, and other\nmeasuring instruments relevant to activity\n5. Methods of\nassessment\n\nCompetency must be assessed through:\n5.1\nObservation with questioning\n5.2\nPresentation of Finished drawing\n6. Context for\nassessment\n\n6.1\nCompetency must be assessed in a room or any simulated\nplaces\n6.2\nAssessment must be given according to industry standard\n\n--- PDF PAGE 43 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n39\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM MINOR MAINTENANCE AND SERVICING ON\nVEHICLES CLASSIFIED UNDER LTO RESTRICTION CODES 3\nUP TO 5\n\nCODE NO.\n:\nALT723349\n\nUNIT DESCRIPTOR\n:\nThis unit involves the skills, knowledge and attitudes required to\ncarry out basic servicing and maintenance on vehicles classified\nunder LTO Restriction codes 3-5. It also includes the action to\nimplement the vehicle manufacturer’s specifications for routine\ncleaning checks and maintenance and ensure that the vehicle is\noperational to the requirements of both the workplace and the\nrelevant road and traffic authority.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Clean vehicle unit\n1.1\nVehicle is cleaned as per prescribed procedures using\nappropriate cleaning supplies, tools/ equipment and\naccording to occupational health and safety (OHS) rules.\n1.2\nWastes are disposed of as per relevant ordinance, rules or\nlaw.\n2. Maintain and service\nthe vehicle system\n\n2.1\nMinor routine checks are undertaken based on\nmanufacturer's manual.\n2.2\nMinor routine repair and servicing are undertaken in\naccordance with occupational health and safety procedures\nand manufacturer's manual.\n2.3\nBrakes are inspected and appropriate action is undertaken in\naccordance with manufacturer's specifications.\n2.4\nComplex repair and service requirements are identified and\nreferred following workplace procedures.\n2.5\nRecords of routine servicing, maintenance and repairs are\nkept and updated in accordance with workplace procedures\n\n--- PDF PAGE 44 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Vehicle\nVehicle may include but are not limited to:\n1.1\nPassenger bus\n1.2\nStraight Truck\n2. Cleaning supplies\nCleaning supplies may include but are not limited to:\n2.1\nSoap\n2.2\nRags\n2.3\nOil\n2.4\nAir freshener\n2.5\nPolish\n2.6\nWater\n3. Cleaning Tools and\nEquipment\n3.1\nVacuum cleaner\n3.2\nSteam cleaner\n3.3\nMop and basket\n3.4\nPail\n3.5\nBroom\n3.6\nHose\n3.7\nPressure Washer\n4. Routine Check\nRoutine checks include but are not limited to the following vehicle\ncomponents:\n4.1\nBattery\n4.2\nTire air pressure\n4.3\nWater level\n4.4\nLights\n4.5\nHorn\n4.6\nMirrors\n4.7\nPropeller\n4.8\nBolts and nuts tightness\n4.9\nBrake fluid\n4.10 Oil level\n4.11\nFan belt\n5. Minor routine repairs\nMinor routine repairs include but are not limited to the replacement of:\n5.1\nBlown bulbs in vehicle lights\n5.2\nBroken fan belt\n5.3\nBlown fuse\n5.4\nBroken side mirrors\n5.5\nRear tail-light lens\n5.6\nTires\n5.7\nBroken coolant hose\n6. Minor routine servicing\nMinor routine servicing may include but are not limited to the\nfollowing:\n6.1\nTopping up of water/coolant levels and brake fluid\n6.2\nChange/topping of engine oils\n6.3\nAir pressure set of tires\n6.4\nAddition of gear oil\n6.5\nCleaning of battery terminals\n7. Occupational Health\nand Safety\n\n7.1\nUse of personal protective equipment such as:\n• Gloves\n• Gas mask\n• Brush\n7.2\nAppropriate space with ventilation\n7.3\nProvision of fire extinguisher in work area\n\n--- PDF PAGE 45 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n41\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\n1.1\nDiagnosed basic vehicle faults and made adjustment/repairs\n1.2\nCarried out routine servicing and maintenance of vehicle\nsystem\n1.3\nIdentified complex servicing and maintenance problems\n1.4\nDemonstrated safety, environmental and hazard control\nprecautions and procedures during routine maintenance\noperations\n1.5\nCommunicated effectively with others in carrying out vehicle\nmaintenance\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nRelevant OHS and pollution control procedures\n2.2\nProcedure for checking and routine service and maintenance\nof a vehicle\n2.3\nProblems that may occur during routine servicing and\nmaintenance of a vehicle and appropriate actions and\nsolutions\n2.4\nFaults and irregularities that may occur in vehicles.\n2.5\nPrinciples of operation of vehicle system such as electrical\nsystem, fuel system, cooling system, steering system, exhaust\nsystem, tires, brakes\n2.6\nBasic fault finding procedures required during routine\nservicing and maintenance of vehicles\n2.7\nUses of tools materials, and parts for routine servicing and\nmaintenance\n2.8\nPositive Work Values (Honesty, Quality, Common Sense\nPatience, Concern for Safety)\n2.9\n5 S (Sort, Systematize, Sweep, Standardize, Self Discipline)\n\n3. Underpinning Skills\n3.1\nRecognizing and diagnosing vehicle faults and irregularities\n3.2\nPerforming housekeeping\n3.3\nWriting and documenting simple report\n3.4\nCommunicating skills\n3.5\nHandling of tools and materials\n4. Resource Implications\nThe following resources must be provided:\n4.1\nPassenger Bus or Straight Truck\n4.2\nSupplies and materials relevant to the task\n4.3\nWorkplace for conducting routine servicing and maintenance\n4.4\nRoom for written examination\n5. Method of Assessment\nCompetency must be assessed through\n5.1\nObservation with Questioning\n5.2\nDemonstration with Questioning\n5.3\nInterview\n5.4\nWritten examination\n\n6. Context for\nAssessment\nPractical assessment must be conducted at TESDA accredited\nassessment centers and/or in an appropriate work situation\n\n--- PDF PAGE 46 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n42\nUNIT OF COMPETENCY :\nPERFORM PRE- AND POST OPERATION PROCEDURES ON\nVEHICLES CLASSIFIED UNDER LTO RESTRICTION CODES 3\nUP TO 5\n\nUNIT CODE\n:\nALT832305\n\nUNIT DESCRIPTOR\n:\nThis unit describes the outcomes required in performing\nprocedures before operating vehicles classified under LTO\nrestriction codes 3 up to 5.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform visual check\nvehicle\n\n1.1\nVehicle serviceable parts are checked in accordance with\nvehicle checklist and manufacturer’s procedures.\n1.2\nWalk-around check is performed with vehicle checklist and\nwith engine stopped/not running.\n1.3\nElectrical terminal is checked in accordance with\nmanufacturer’s procedures.\n2. Perform “BLOWAF”\ncheck\n\n2.1\n“BLOWAF” check is performed in accordance with standard\noperating procedures.\n2.2\nDeficiencies or findings in BLOWAF check are identified and\nappropriate corrective measures are undertaken in\naccordance with manufacturer’s specification.\n2.3\nAbnormal conditions are noted in checklist and reported to\nauthorized person.\n3. Perform operation\ncheck\n\n3.1\nStarting/running check is performed in accordance with\nmanufacturer’s specifications.\n3.2\nOperating condition of instruments, gauges, indicators and\ncontrols are performed in accordance with manufacturer’s\nrecommendation.\n3.3\nOperating condition of air brake and steering controls are\nchecked in accordance with manufacturer’s recommendation.\n3.4\nWalk-around check, with engine running, is performed in\naccordance with manufacturer’s recommendation.\n3.5\nSafety devices and accessories are checked for proper\nfunctions in accordance with safe operating procedures.\n4. Perform post-operation\nprocedures\n4.1\nVehicle is parked and engine turned off after productive\noperation in accordance with company rules and regulations.\n4.2\nVehicle controls are set into neutral position and parking\nbrakes are engaged according to manufacturer’s operations\nmanual.\n4.3\nSafety locks and brakes are all set/engaged in accordance\nwith operator’s manual.\n4.4\nWalk-around inspection check is re-conducted while doing\nengine cool down\n4.5\nDaily vehicle time record/report/inspection is\naccomplished/submitted according to company rules and\nregulations\n\n--- PDF PAGE 47 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Vehicle serviceable\nparts\n\n1.1\nAir cleaner\n1.2\nBattery terminals/Connection\n1.3\nBelt\n1.4\nTires\n1.5\nGrease/lube points\n1.6\nFuel water separator\n1.7\nAir tank\n1.8\nRadiator\n1.9\nMirrors\n1.10 Lights (signal, back, tail, head)\n1.11\nAir hose and connectors\n2. Walk-around check\n\n2.1\nTires\n2.2\nLeaks (oil, water, air, fluid)\n2.3\nWorn out/damaged parts\n2.4\nFluid levels\n2.5\nLoose parts/connections\n2.6\nMissing parts\n2.7\nGauges and controls\n2.8\nSafety devices (seat belt, EWD, blinkers)\n2.9\nUnusual sounds\n2.10 Window glass\n2.11 Passenger’s seat condition\n2.12 Curtains\n2.13\nBaggage compartment\n3. B L O W A F check\n\n3.1\nBattery (starting and charging system)\n3.2\nLight (lighting system)\n3.3\nOil (lubricating system)\n3.4\nWater (cooling system)\n3.5\nAir (intake and exhaust system)\n3.6\nFuel (fuel system)\n4. Deficiencies\n\n4.1\nFluid level (oil, coolant, electrolyte/distilled water)\n4.2\nAir pressure (tire and brake)\n4.3\nDefective light bulbs, lens and reflector\n4.4\nMalfunctioning air-conditioning system\n5. Authorized person\n5.1\nSupervisor\n5.2\nDispatcher\n5.3\nMaintenance personnel\n5.4\nConductor\n6. Safety devices and\naccessories\n6.1\nBlinkers\n6.2\nSafety belt\n6.3\nWindshield guard\n6.4\nWarning light siren\n6.5\nEarly Warning Device (EWD)\n7. Safety locks\n7.1\nPower Door and lock\n7.2\nMaxi Brake\n7.3\nDifferential lock\n7.4\nSteering lock\n7.5\nParking Brakes\n8. Vehicle\n8.1\nPassenger Bus\n8.2\nStraight Truck\n\n--- PDF PAGE 48 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n44\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPerformed visual check of articulated vehicle\n1.2\nPerformed “BLOWAF” inspection\n1.3\nPerformed operation check\n1.4\nPerformed post operation procedures\n2. Underpinning\nKnowledge and\nAttitude\n\n2.1\nKinds of Articulated vehicle and capacity\n2.2\nKinds of Busses and capacity\n2.3\nTypes of Straight Trucks and capacity\n2.4\nKinds of Passengers and Loads\n2.5\nControls, instruments, indicators and their usage\n2.6\nPrinciple of operation of electrical, pneumatics and hydraulic\nsystems\n2.7\nLubricants and oils\n2.8\nBasic mathematics (MDAS)\n2.9\nLocal and national road traffic regulations\n2.10 Starting and shutdown procedures\n2.11 Manufacturer’s operation manual\n2.12 Job site and work conditions\n2.13 Documentation (tickets, forms, checklists ,receipts, reports)\n2.14 Pre- and post-operation procedures\n2.15 Positive work values (honesty, courtesy, cost/time/quality\nconsciousness, etc.)\n3. Underpinning Skills\n\n3.1\nCommunication skills\n3.2\nPerforming pre- and post-operation procedures on vehicle\nwith standard or special attachments\n3.3\nAccomplishing pre- and post-operation checklist\n3.4\nHandling Passengers\n3.5\nComputation skills on fare, distances and time\n4. Resource Implications\n\nThe following resources must be provided:\n4.1\nPassenger Bus or Straight truck\n4.2\nAppropriate work area for the activity\n4.3\nTools, materials and equipment\n4.4\nVehicle operator’s manual\n5. Method of Assessment\n\nCompetency must be assessed through:\n5.1\nWritten examination\n5.2\nObservation with questioning\n5.3\nDemonstration with questioning\n5.4\nPortfolio\n6. Context for\nAssessment\nCompetency must be assessed in the workplace or in a simulated\nworkplace environment accredited by TESDA.\n\n--- PDF PAGE 49 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n45\nUNIT OF COMPETENCY :\nOBEY AND OBSERVE TRAFFIC RULES AND REGULATIONS\n\nCODE\n:\nALT832303\n\nUNIT DESCRIPTOR\n:\nThis unit involves the skills, knowledge and attitudes required in\nfollowing traffic rules and regulations while driving articulated\nvehicle.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Observe traffic signs\nand road markers\n1.1\nTraffic signs and road markers are identified and followed in\naccordance with concerned traffic authorities.\n2. Obey traffic rules and\nregulations\n2.1\nTraffic rules and regulations are identified and followed in\naccordance with concerned traffic authorities.\n2.2\nLicense and registrations are maintained as prescribed by law.\n2.3\nDriver outfit/attire is worn as prescribed by law.\n3. Practice courtesy\n3.1\nPositive work values are demonstrated as per code of ethics\nof drivers\n3.2\nComplaints are responded and handled with respect based on\ndriver's code of ethics\n4. Respect traffic\nenforcers and other\ntraffic management\npersonnel\n4.1\nTraffic authority instructions are complied with as prescribed\nby law.\n4.2\nTraffic violation tickets/receipts issued by Traffic enforcers are\naccepted and appropriate action is taken.\n\n--- PDF PAGE 50 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n46\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Traffic signs\nTraffic signs include but are not limited to:\n1.1\nNo blowing of horns\n1.2\nYield\n1.3\nNo Parking\n1.4\nOne way\n1.5\nNo U-turn\n2. Road Markers\n2.1\nMerging traffic\n2.2\nNo overtaking\n2.3\nPedestrian lane\n2.4\nTotal stop\n3. Traffic rules and\nregulations\nTraffic rules and regulations include:\n3.1\nStalled vehicle\n3.2\nIllegal parking\n3.3\nWearing of safety belts\n3.4\nObserving the Truck Ban Rules\n3.5\nDriving license/registration/franchise/Official receipt and\ncertificate of registration (ORCR)\n3.6\nNo using of cellphone while driving\n3.7\nAvoiding driving under the influence of drugs or alcohol\n4. Prescribed Attire/Outfit\nProper attire or outfit prescribed by law include but are not limited to:\n4.1\nCompany-prescribed attire\n4.2\nShoes appropriate for driving\n\n--- PDF PAGE 51 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n47\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\n1.1\nFollowed traffic signs and road markers\n1.2\nObeyed traffic rules and regulations\n1.3\nPracticed courtesy and good communication\n1.4\nRespected traffic enforcers and other traffic management\nunits.\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nTraffic signs and symbols\n2.2\nRoad markers\n2.3\nTraffic rules and regulations\n2.4\nDefensive driving techniques\n2.5\nPositive work values\n2.6\nDriver's Code of ethics\n2.7\nDifferent Traffic Enforcers\n2.8\nTraffic violations and penalties\n2.9\nGood grooming\n3. Underpinning Skills\n3.1\nCommunication skills\n3.2\nInterpersonal skills\n3.3\nManaging conflict\n4. Resource Implications\nThe following resources must be provided:\n4.1\nArticulated vehicle with appropriate tools/instruments for\nactual performance of works\n4.2\nAmple space for driving including traffic signs and symbols for\ndriving and maneuvering the articulated vehicle\n4.3\nWell lighted and ventilated room with table and chairs for\nwritten/oral assessment\n5. Method of Assessment\nCompetency must be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n5.3\nInterview\n5.4\nWritten or Oral examination\n6. Context for\nAssessment\n6.1\nCompetency must be assessed in actual workplace or\nsimulated environment\n6.2\nAssessment of competence must comply with the assessment\nrequirements of the relevant Road and traffic control Authority\n\n--- PDF PAGE 52 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n48\nUNIT OF COMPETENCY :\nOBSERVE ROAD HEALTH AND SAFETY PRACTICES\n\nUNIT CODE\n:\nALT832308\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and\nsafety while driving.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify and evaluate\nhazards and risks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures\n1.2\nEffects of driving environment hazards/risks and their\ncorresponding indicators are identified to minimize or\neliminate risk to passengers, co-workers, workplace and\nenvironment in accordance with organization procedures\n1.3\nContingency measures during emergencies are recognized\nand established in accordance with organization procedures\n1.4\nOHS issues and/or concerns and identified safety hazards are\nreported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation\n2. Control hazards and\nrisks\n2.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n2.2\nProcedures for dealing with accidents, fire and emergencies\nare followed in accordance with organization OHS policies\n2.3\nSpace management and defensive driving techniques are\npracticed to avoid accidents.\n2.4\nAppropriate assistance is provided in the event of an\nemergency in accordance with established protocol\n\n3. Maintain fitness for\ndriving\n3.1\nStandards of health, fitness and well-being for driving on\nthe road are maintained and adhered to at all times\n3.2\nLTO/LTFRB and company policies related to smoking, alcohol\nand prohibited drug use are complied with\n3.3\nFatigue management strategies are applied to ensure\nconcentration and alertness while driving\n\n--- PDF PAGE 53 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Regulations\nMay include but are not limited to:\n1.1\nRegistration, driving license and other relevant permits\n1.2\nUse of safety belt\n1.3\nAvailability of EWD\n1.4\nObservance of franchise route\n1.5\nCompany uniform\n1.6\nCompliance with vehicle emission standards\n2. Driving environment\nhazards/risks\nMay include but are not limited to:\n2.1\noverhead cables\n2.2\nstalled vehicles and other road obstruction\n2.3\nexcavation and road repairs\n2.4\nflood\n2.5\nheavy traffic volume\n2.6\naccidents\n2.7\nheavy rains and typhoons\n2.8\nFog/smog\n2.9\nuneven loads\n2.10 slippery roads\n2.11 winding and zigzag roads\n2.12 blind corners\n2.13 humps\n2.14 unattended children along streets\n2.15 stray animals\n2.16 reckless and uncooperative drivers\n2.17 fire on vehicle\n2.18 loose stones\n2.19\nmental and physical fatigue\n3. Emergencies\nMay include but are not limited to:\n3.1\nVehicle collision and crash\n3.2\nCrime incident (hold-up, kidnapping and related crimes)\n3.3\nHit-and-run\n3.4\nFire caused by engine overheating or faulty electric wiring\n4. Standards of health,\nfitness and well-being\n4.1\nhealth testing at intervals\n4.2\ndrugs and alcohol use\n4.3\nstress\n4.4\ncommunicable diseases\n4.5\nadverse personal hygiene\n4.6\nvision, peripheral (70⁰) color blindness\n4.7\nhearing ability (hear whisper from 5 ft.)\n5. Fatigue management\nstrategies\n5.1\nassessment and planning of routes and schedules to minimize\nfatigue\n5.2\nmaking of lifestyle choices which promote the effective long-\nterm fatigue management\n5.3\navoiding multiple jobs\n5.4\nmonitoring and taking action to minimize fatigue due to:\n5.4.1 lifestyle factors such as: sleep patterns, alcohol and\ndrug use, quantity and timing of food and drink, and\nopportunities for relaxation with family and friends\n5.4.2 personal or biological factors such as: state of mental\nand/or physical health, inadequate sleep, sleep\ndisorders, emotional stress, family responsibilities,\nrelationship difficulties, inadequate competence to\ncomplete work tasks, and circadian rhythms\n\n--- PDF PAGE 54 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n50\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established safety and hazard control\npractices and procedures\n1.2\nIdentified driving hazards/risks in the workplace its effects and\ncorresponding indicators\n1.3\nRecognized contingency measures during emergencies\n1.4\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.5\nApplied procedures in dealing with emergencies\n1.6\nApplied space management and defensive driving techniques\n1.7\nMaintained fitness for driving\n2. Underpinning\nKnowledge\n\n2.1\nRelevant road rules, regulations, permit and license\nrequirements\n2.2\nRelevant OHS and environmental procedures, practices and\nregulations\n2.3\nDriving hazards and related defensive driving techniques\n2.4\nRoad signs and symbols\n2.5\nSpace management\n2.6\nDefensive driving techniques\n2.7\nOrganization safety and health protocol\n2.8\nProcedure to be followed in the event of a driving emergency\n2.9\nCauses and effects of fatigue on drivers\n2.10 Fatigue management strategies\n2.11 Personal hygiene practices\n3. Underpinning Skills\n3.1\nReading and interpreting instructions, procedures, information\nand signs relevant to driving\n3.2\nPractice of personal hygiene\n3.3\nHazards/risks identification and control skills\n3.4\nInterpersonal skills\n3.5\nCommunication skills\n4. Resource Implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 55 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n51\nUNIT OF COMPETENCY :\nIMPLEMENT AND COORDINATE ACCIDENT-EMERGENCY\nPROCEDURES\n\nUNIT CODE\n:\nALT832304\n\nUNIT DESCRIPTOR\n:\nThis unit involves the skills, knowledge and attitudes required in\nresponding to emergency incidents, follow-up support and\nassistance and communicate to concerned individual during\nemergency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Respond to\nemergencies\n\n1.1\nEmergency and potential emergency situations are identified\nand assessed based on emergency procedure.\n1.2\nActions are prioritized and provided based on the criticality of\nthe emergency situation.\n1.3\nIncident reports are prepared in accordance with regulatory\nand workplace procedures\n1.4\nResponsibilities are fulfilled in accordance with emergency\nprocedures and/or regulatory requirements\n2. Arrange follow-up\nsupport and assistance\n2.1\nMedical assistance and support is arranged in accordance\nwith workplace procedures\n2.2\nFirst aid is applied in accordance with medical procedure\n2.3\nPassenger needs are identified and provided based on\nemergency situation.\n\n--- PDF PAGE 56 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergency\nEmergency situation and incidents may include the following but not\nlimited to:\n1.1\nVehicle collision\n1.2\nCrime incidents (hold-up, kidnapping and related crimes)\n1.3\nHit and run\n1.4\nFire resulted from engine overheating or faulty electric wiring\n2. Responsibilities\n2.1\nReporting to police authority\n2.2\nFacilitate Insurance claim\n2.3\nInforming victim’s relatives\n2.4\nRespond to investigation and authority inquiry\n3. Action\n3.1\nFacilitating medical assistance\n3.2\nTransporting of injured passenger to the nearest medical\nfacility\n3.3\nTransporting of road crime victim to police station\n3.4\nGiving reminders to passengers while on board the public\ntransport vehicle\n3.5\nProviding assistance in controlling the site both prior to and\nfollowing arrival of emergency services\n\n--- PDF PAGE 57 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n53\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\n1.1\nResponded to emergency situations\n1.2\nArranged follow-up support and assistance\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nRelevant OHS and environmental procedures and regulations\n2.2\nKinds of emergency situations\n2.3\nProcedure to be followed in the event of emergency\n2.4\nProblem that may arise during emergency situations\n2.5\nFirst aid practices\n2.6\nKinds of body injury and how to deal with them\n2.7\nPositive work values (Honesty, Presence of mind,\nCompassion, etc.)\n\n3. Underpinning Skills\n3.1\nAppropriate reporting and preparing of necessary\ndocumentation to authority and medical personnel\n3.2\nHandling injured person\n3.3\nTransporting injured persons\n3.4\nHandling and use of fire extinguishers\n3.5\nFollowing emergency procedures\n3.6\nHandling crime situations\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nSimulation equipment and materials used for demonstrating\nemergency situation\n4.2\nVehicle unit\n4.3\nA well-ventilated and lighted room with table and chairs for\nwritten/oral examination\n5. Method of Assessment\nCompetency must be assessed through:\n5.1\nDemonstration of the task in implementing and coordinating\naccident-emergency procedures\n5.2\nInterview\n5.3\nWritten/oral exam\n\n6. Context for\nAssessment\n6.1\nCompetency must be assessed in actual workplace or\nsimulated environment\n6.2\nAssessment of competence must comply with the assessment\nrequirements of the relevant Road and traffic control Authority\n\n--- PDF PAGE 58 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n54\nUNIT OF COMPETENCY :\nDRIVE PASSENGER BUS\n\nCODE NO.\n:\nALT832306\n\nUNIT DESCRIPTOR\n:\nThis unit involves the skills, knowledge and attitudes required to\ndrive a passenger bus safely including handling of passengers,\nsystematic and efficient control of all vehicle functions, monitoring\nof traffic/ road conditions, management of vehicle condition, and\neffective management of hazardous situations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform passenger bus\npre-starting and warm-\nup\n1.1\nPassenger bus inspection is performed as per\nmanufacturer’s specification\n1.2\nSafety harness/devices and tools are checked according to\nLTO/LTFRB requirements\n1.3\nWarm up of passenger bus is performed as per\nmanufacturer's manual\n2. Drive passenger bus\n2.1\nPassenger bus is driven in accordance with traffic rules and\nregulations and manufacturer’s instruction\n2.2\nDriving hazards are identified and/or anticipated and avoided\nor controlled through defensive driving as per standard\noperating procedures.\n2.3\nThe passenger bus is parked, shut down and secured in\naccordance with manufacturer’s specifications, traffic\nregulations and workplace procedures\n2.4\nPassengers and loads are transported up to the route\nassigned and fares are collected as per LTFRB regulations\n2.5\nDriving is performed according to the restriction and condition\nstated in the official receipt license and within the\noccupational health and safety standards (OHS).\n2.6\nOut-of line/anti carnapping clearance/special permit is secured\nas per traffic rules and regulations\n3. Monitor and maintain\npassenger bus\nperformance\n\n3.1\nDefective or irregular performance or malfunctions are\nmonitored and reported to the appropriate person/authority.\n3.2\nMinor vehicle maintenance is performed in accordance with\nmanufacturer's instruction\n3.3\nVehicle records are maintained/updated in accordance with\nworkplace procedures\n\n--- PDF PAGE 59 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Passenger bus\n1.1\nTourist\n1.2\nPublic utility\n1.3\nShuttle or company\n1.4\nSchool\n1.5\nSingle or double decker\n2. Passenger bus\ninspection\n2.1\nLights (head light, park light, signal lights, hazard, etc.)\n2.2\nMirrors (rear view, side view, windshields, etc.)\n2.3\nUnder hood\n2.4\nUnderchassis\n2.5\nPassenger seats\n2.6\nSpare tires\n2.7\nAirconditioning system\n3. Fares\n3.1\nTickets\n3.2\nFare matrix\n\n4. Safety harness/devices\n& tools\n4.1\nSeat belt\n4.2\nEarly Warning Device\n4.3\nHandtools (Wrench, pliers, screwdriver, early warning device,\njack, spare tires)\n4.4\nFlashlights or emergency lighting device\n4.5\nFire extinguisher\n4.6\nPassenger Hand straps\n4.7\nEmergency exit door\n4.8\nConsumable materials and spare parts such as\n• Rags\n• Fan belt\n• Wheel cap\n• Fuse\n• Electrical tapes\n• Brake fluid\n• Motor oil\n5. Traffic regulations\n5.1\nRegistration, driving license and other relevant permits\n5.2\nUse of seat belt\n5.3\nAvailability of EWD\n5.4\nObservance of franchise route\n5.5\nUse of uniform\n5.6\nCompliance with vehicle emission standards\n5.7\nObservance of city ordinances\n\n--- PDF PAGE 60 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n56\n\nVARIABLE\nRANGE\n6. Driving hazards\n6.1\nStalled vehicles and other road obstruction\n6.2\nExcavation and road repairs\n6.3\nFlood\n6.4\nHeavy traffic volume\n6.5\nAccidents\n6.6\nHeavy rains and typhoons\n6.7\nFog/smog\n6.8\nUncentered force of gravity or inertia\n6.9\nSlippery roads\n6.10 Rock/Land slides\n6.11 Check points\n6.12 Slow moving vehicles\n6.13 No tail light vehicles\n6.14 Undisciplined pedestrians\n6.15 Winding and zigzag road\n6.16 Blind corners\n6.17 Humps\n6.18 Unattended children along streets\n6.19 Stray animals\n6.20 Open manhole\n6.21 Reckless and uncooperative drivers\n6.22 Loose stones\n6.23 Mental and physical fatigue\n\n7. Occupational Health &\nSafety\n7.1\nSafety in handling vehicle and passengers while driving\n7.2\nSafety on road and traffic management including management\nof pedestrians\n7.3\nUse of personal protective equipment and devices such as\nuniform, gas mask, gloves , sunglasses, shoes, cap\n7.4\nUse of seat belt and early warning devices\n\n--- PDF PAGE 61 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n57\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\n1.1\nPerformed pre-operational and warm up\n1.2\nDrove passenger bus according to traffic rules and regulations\n1.3\nTransported cargoes/loads to destination.\n1.4\nMonitored and maintained vehicle performance\n1.5\nFollowed OHS and environmental protection procedures and\nregulations\n1.6\nFollowed emergency procedures\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nRelevant OHS and environmental procedures and regulations\n2.2\nParts of Passenger bus and its functions\n2.3\nTypes of load or cargo\n2.4\nProcedure on how to drive the Passenger bus\n2.5\nProcedure to be followed in the event of emergency and road\nrelated crimes\n2.6\nEngine power management and safe driving strategies\n2.7\nFatigue management techniques\n2.8\nPrinciple of stress management when driving a vehicle\n2.9\nTraffic rules and regulations\n2.10 Kinds of traffic violations\n2.11 Positive work values (Honesty, Patience, Perseverance,\nCourtesy, etc.)\n3. Underpinning Skills\n3.1\nComputing fares, distances and travel time\n3.2\nManaging fatigue while driving\n3.3\nReading/Interpreting traffic signs and symbols and road\nadvisory\n3.4\nMaintaining proper distance and speed\n3.5\nResponding to road-related accidents and crimes encountered\n4. Resource Implications\nThe following resources must be provided:\n4.1\nPassenger bus with appropriate tools/instruments for actual\nperformance of works\n4.2\nDriver's Manual\n4.3\nAmple space for driving including traffic signs and symbols for\ndriving and maneuvering the Passenger bus\n5. Method of Assessment\nCompetency must be assessed through\n5.1\nWritten test\n5.2\nObservation with Questioning\n5.3\nDemonstration with Questioning\n5.4\nInterview\n5.5\nPortfolio\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in actual workplace or\nsimulated environment accredited by TESDA.\n6.2\nAssessment of competence must comply with the assessment\nrequirements of the relevant Road and traffic control Authority\n\n--- PDF PAGE 62 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n58\nUNIT OF COMPETENCY :\nDRIVE STRAIGHT TRUCK\n\nCODE NO.\n:\nALT832307\n\nUNIT DESCRIPTOR\n:\nThis unit involves the skills, knowledge and attitudes required to\ndrive a straight truck safely including handling of cargoes,\nsystematic and efficient control of vehicle functions, monitoring of\ntraffic and road conditions, management of vehicle condition and\neffective handling management of hazardous materials and\nsituations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform straight truck\npre-starting and warm-\nup\n1.1\nStraight truck inspection is performed as per manufacturer’s\nspecification\n1.2\nSafety harness/devices and tools are checked according to\nLTO/LTFRB requirements\n1.3\nWarm up of straight truck is performed as per manufacturer's\nmanual\n2. Drive straight truck\n2.1\nStraight truck is driven in accordance with traffic rules and\nregulations and manufacturer’s instruction\n2.2\nDriving hazards are identified and/or anticipated and avoided\nor controlled through defensive driving as per standard\noperating procedures.\n2.3\nThe straight truck is parked, shut down and secured in\naccordance with manufacturer’s specifications, traffic\nregulations and workplace procedures\n2.4\nCargoes / loads are secured and transported up to the route\nassigned per LTFRB regulations\n2.5\nDriving is performed according to the restriction and condition\nstated in the official receipt license and within the\noccupational health and safety standards (OHS).\n2.6\nTrip ticket / way bill is secured during the trip as per company\nprocedure\n2.7\n Accidents and emergencies encountered are reported as per\ncompany procedure\n2.8\nInformation on road and travel condition is disseminated to the\ncompany as per standard operating procedures\n2.9\nDumping of truck load is performed as per standard operating\nprocedures.\n3. Monitor and maintain\nstraight truck\nperformance\n\n3.1\nDefective or irregular performance or malfunctions are\nmonitored and reported to the appropriate person/authority.\n3.2\nMinor vehicle maintenance is performed in accordance with\nmanufacturer's instruction\n3.3\nVehicle records are maintained/updated in accordance with\nworkplace procedures\n\n--- PDF PAGE 63 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n59\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Straight truck\n1.1\nDump truck\n1.2\nCement Mixer\n1.3\nConcrete pump\n1.4\nTanker with no pivotal pin\n1.5\nBulk Carrier\n1.6\nAny Vehicle from 6 to 12 wheelers\n2. Straight Truck\ninspection\n2.1\nBattery (starting and charging system)\n2.2\nLight (lighting system)\n2.3\nOil (lubricating system)\n2.4\nWater (cooling system)\n2.5\nAir (intake and exhaust system)\n2.6\nFuel (fuel system)\n3. Cargoes\n3.1\nContainer van\n3.2\nLoose Cargoes\n3.3\nTanker\n3.4\nSoil, Gravel or Sand\n3.5\nBulk\n4. Safety harness/devices\ntools materials and\nspare parts\n4.1\nSeat belt\n4.2\nEarly Warning Device\n4.3\nHandtools (Wrench, pliers, screwdriver, early warning device,\njack, spare tires)\n4.4\nFlashlights or emergency lighting device\n4.5\nNylon/wire/chain with binder\n4.6\nCanvass cover\n4.7\nPermit to dump materials (environmental/municipal)\n4.8\nConsumable materials and spare parts such as\n• Rags\n• Fan belt\n• Fuse\n• Electrical tapes\n• Brake fluid\n• Motor oil\n4.9\nChain with binder\n4.10 Strap belt\n4.11 Wooden wedge\n4.12 Pole\n\n--- PDF PAGE 64 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n60\n\nVARIABLE\nRANGE\n5. Traffic regulations\n5.1\nRegistration, driving license and other relevant permits\n5.2\nUse of seat belt\n5.3\nAvailability of EWD\n5.4\nObservance of franchise route\n5.5\nCompany uniform\n5.6\nCompliance with vehicle emission standards\n6. Driving hazards\n6.1\nOverhead cables\n6.2\nStalled vehicles and other road obstruction\n6.3\nExcavation and road repairs\n6.4\nFlood\n6.5\nHeavy traffic volume\n6.6\nAccidents\n6.7\nHeavy rains and typhoons\n6.8\nFog/smog\n6.9\nUneven loads\n6.10 Slippery roads\n6.11 Winding and zigzag road\n6.12 Blind corners\n6.13 Humps\n6.14 Unattended children along streets\n6.15 Stray animals\n6.16 Reckless and uncooperative drivers\n6.17 Loose stones\n6.18 Mental and physical fatigue\n7. Occupational Health &\nSafety\n7.1\nSafety in handling vehicle and cargoes while driving\n7.2\nSafety on road and traffic management including\nmanagement of pedestrians\n7.3\nUse of personal protective equipment and devices such as\nuniform, gas mask, gloves , sunglasses, safety shoes\n7.4\nUse of seat belt and early warning devices\n\n--- PDF PAGE 65 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III\nPromulgated January 14, 2011\n61\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\n1.1\nPerformed pre-operational and warm up\n1.2\nDrove straight truck\n1.3\nTransported cargoes/loads to destination.\n1.4\nMonitored and maintained vehicle performance\n1.5\nFollowed OHS and environmental protection procedures and\nregulations\n1.6\nFollowed emergency procedures\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nRelevant OHS and environmental procedures and regulations\n2.2\nKinds of straight truck and its functions\n2.3\nTypes of load or cargo\n2.4\nProcedure on how to drive the straight truck\n2.5\nProcedure to be followed in the event of emergency and road\nrelated crimes\n2.6\nEngine power management and safe driving strategies\n2.7\nFatigue management techniques\n2.8\nPrinciple of stress management when driving a vehicle\n2.9\nTraffic rules and regulations\n2.10 Kinds of traffic violations\n2.11 Positive work values (Honesty, Patience, Perseverance,\nCourtesy, etc.)\n3. Underpinning skills\n3.1\nComputing distances and travel time\n3.2\nManaging fatigue while driving\n3.3\nReading/Interpreting traffic signs and symbols and road\nadvisory\n3.4\nMaintaining proper distance and speed\n3.5\nResponding to road-related accidents and crimes encountered\n4. Resource implications\nThe following resources must be provided:\n4.1\nStraight truck with appropriate tools/instruments for actual\nperformance of works\n4.2\nDriver's Manual\n4.3\nAmple space for driving including traffic signs and symbols for\ndriving and maneuvering the straight truck\n5. Method of assessment\nCompetency must be assessed through\n5.1\nWritten test\n5.2\nObservation with Questioni