        "source_text": "--- PDF PAGE 43 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n39\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :  \nPERFORM MINOR MAINTENANCE AND SERVICING ON \nVEHICLES CLASSIFIED UNDER LTO RESTRICTION CODES 3 \nUP TO 5 \n \nCODE NO. \n: \nALT723349 \n   \nUNIT DESCRIPTOR \n: \nThis unit involves the skills, knowledge and attitudes required to \ncarry out basic servicing and maintenance on vehicles classified \nunder LTO Restriction codes 3-5. It also includes the action to \nimplement the vehicle manufacturer’s specifications for routine \ncleaning checks and maintenance and ensure that the vehicle is \noperational to the requirements of both the workplace and the \nrelevant road and traffic authority. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Clean vehicle unit \n1.1 \nVehicle is cleaned as per prescribed procedures using \nappropriate cleaning supplies, tools/ equipment and \naccording to occupational health and safety (OHS) rules. \n1.2 \nWastes are disposed of as per relevant ordinance, rules or \nlaw. \n2. Maintain and service \nthe vehicle system \n \n2.1 \nMinor routine checks are undertaken based on \nmanufacturer's manual. \n2.2 \nMinor routine repair and servicing are undertaken in \naccordance with occupational health and safety procedures \nand manufacturer's manual. \n2.3 \nBrakes are inspected and appropriate action is undertaken in \naccordance with manufacturer's specifications. \n2.4 \nComplex repair and service requirements are identified and \nreferred following workplace procedures. \n2.5 \nRecords of routine servicing, maintenance and repairs are \nkept and updated in accordance with workplace procedures\n\n--- PDF PAGE 44 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Vehicle\nVehicle may include but are not limited to:\n1.1 \nPassenger bus \n1.2\nStraight Truck\n2. Cleaning supplies\nCleaning supplies may include but are not limited to:\n2.1 \nSoap \n2.2 \nRags \n2.3 \nOil \n2.4 \nAir freshener \n2.5 \nPolish \n2.6\nWater\n3. Cleaning Tools and \nEquipment \n3.1\nVacuum cleaner\n3.2 \nSteam cleaner \n3.3 \nMop and basket \n3.4 \nPail \n3.5 \nBroom \n3.6 \nHose \n3.7\nPressure Washer\n4. Routine Check\nRoutine checks include but are not limited to the following vehicle \ncomponents: \n4.1 \nBattery \n4.2 \nTire air pressure \n4.3 \nWater level \n4.4 \nLights \n4.5 \nHorn \n4.6 \nMirrors \n4.7 \nPropeller \n4.8 \nBolts and nuts tightness \n4.9 \nBrake fluid \n4.10 Oil level \n4.11\nFan belt \n5. Minor routine repairs\nMinor routine repairs include but are not limited to the replacement of:\n5.1 \nBlown bulbs in vehicle lights \n5.2 \nBroken fan belt \n5.3 \nBlown fuse \n5.4 \nBroken side mirrors \n5.5 \nRear tail-light lens \n5.6 \nTires \n5.7\nBroken coolant hose\n6. Minor routine servicing\nMinor routine servicing may include but are not limited to the \nfollowing: \n6.1 \nTopping up of water/coolant levels and brake fluid \n6.2 \nChange/topping of engine oils \n6.3 \nAir pressure set of tires \n6.4 \nAddition of gear oil \n6.5\nCleaning of battery terminals\n7. Occupational Health \nand Safety  \n \n7.1\nUse of personal protective equipment such as:\n Gloves \n Gas mask \n Brush \n7.2 \nAppropriate space with ventilation  \n7.3\nProvision of fire extinguisher in work area\n\n--- PDF PAGE 45 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n41\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate \n1.1 \nDiagnosed basic vehicle faults and made adjustment/repairs  \n1.2 \nCarried out routine servicing and maintenance of vehicle \nsystem \n1.3 \nIdentified complex servicing and maintenance problems \n1.4 \nDemonstrated safety, environmental and hazard control \nprecautions and procedures during routine maintenance \noperations \n1.5 \nCommunicated effectively with others in carrying out vehicle \nmaintenance \n \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 \nRelevant OHS and pollution control procedures \n2.2 \nProcedure for checking and routine service and maintenance \nof a vehicle  \n2.3 \nProblems that may occur during routine servicing and \nmaintenance of a vehicle and appropriate actions and \nsolutions \n2.4 \nFaults and irregularities that may occur in vehicles. \n2.5 \nPrinciples of operation of vehicle system such as electrical \nsystem, fuel system, cooling system, steering system, exhaust \nsystem, tires, brakes \n2.6 \nBasic fault finding procedures required during routine \nservicing and maintenance of vehicles \n2.7 \nUses of tools materials, and parts for routine servicing and \nmaintenance \n2.8 \nPositive Work Values (Honesty, Quality, Common Sense \nPatience, Concern for Safety) \n2.9 \n5 S (Sort, Systematize, Sweep, Standardize, Self Discipline)  \n \n3. Underpinning Skills \n3.1 \nRecognizing and diagnosing vehicle faults and irregularities \n3.2 \nPerforming housekeeping  \n3.3 \nWriting and documenting simple report  \n3.4 \nCommunicating skills \n3.5 \nHandling of tools and materials \n4. Resource Implications \nThe following resources must be provided: \n4.1 \nPassenger Bus or Straight Truck  \n4.2 \nSupplies and materials relevant to the task \n4.3 \nWorkplace for conducting routine servicing and maintenance \n4.4 \nRoom for written examination \n5. Method of Assessment \nCompetency must be assessed through  \n5.1 \nObservation with Questioning \n5.2 \nDemonstration with Questioning \n5.3 \nInterview \n5.4 \nWritten examination  \n \n6. Context for \nAssessment \nPractical assessment must be conducted at TESDA accredited \nassessment centers and/or in an appropriate work situation\n",
