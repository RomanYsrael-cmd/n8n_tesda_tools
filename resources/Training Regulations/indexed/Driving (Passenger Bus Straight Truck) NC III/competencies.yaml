\nPaint brush \n2.6 \nRubber hammer \n2.7 \nHand tools \nPersonal protective equipment include: \n2.8 \nGloves \n2.9 \nApron \n2.10 Safety shoes \n2.11 Goggles \n2.12 Gas mask \n \n3.  Safety \nSafety includes: \n3.1 \nVentilation \n3.2 \nHandling of Flammable/Irritating substances \n3.3 \nUse of Personal Protective Equipment \n4.  Hazards \nHazard includes: \n4.1 \nFumes \n4.2 \nSkin irritation \n4.3 \nBurns \n \n5.  Adhesive/Sealant \nchecking \n \nAdhesive/Sealant checking includes: \n5.1 \nExpiry date \n5.2 \nFree of contamination \n5.3 \nCap/Covers \n5.4 \nTightly closed \n5.5 \nConcentration\n\n--- PDF PAGE 31 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n27\nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nIdentified appropriate sealant/adhesives \n1.2 \nPrepared surface for sealant/adhesive \n1.3 \nApplied sealant/adhesive \n1.4 \nStored unused or dispose of used sealant/adhesive \n2. Underpinning \nKnowledge and \nAttitude \n2.1 \nOH & S regulations \n2.2 \nSafe handling of sealant/adhesive \n2.3 \nIndustry code of practice \n2.4 \nProcedures in sealant/adhesive application \n2.5 \nProcedures in interpreting manuals \n3. Underpinning Skills \n3.1 \nHandling sealant/adhesive \n3.2 \nApplying sealant/adhesive \n3.3 \nSanding the surface \n3.4 \nUse of tools, equipment \n3.5 \nMixing of body filler and epoxy base and hardener \n4. Resource Implication \nThe following resources must be provided: \n4.1 \nMaterials relevant to the activity \n4.2 \nAppropriate tools and equipment \n4.3 \nReal or simulated workplace \n \n5. Methods of \nAssessment \n \nCompetency must be assessed through \n5.1 \nObservation with questioning \n5.2 \nInterview related to: \n Safe and correct use of tools and equipment \n Application of adhesive/sealant \n6. Context for \nAssessment \n \n6.1 \nCompetency elements must be assessed in a safe working \nenvironment \n6.2 \nAssessment may be done in a workplace or simulated \nenvironment\n",
