use \n5.4 \nBroken side mirrors \n5.5 \nRear tail-light lens \n5.6 \nTires \n5.7\nBroken coolant hose\n6. Minor routine servicing\nMinor routine servicing may include but are not limited to the \nfollowing: \n6.1 \nTopping up of water/coolant levels and brake fluid \n6.2 \nChange/topping of engine oils \n6.3 \nAir pressure set of tires \n6.4 \nAddition of gear oil \n6.5\nCleaning of battery terminals\n7. Occupational Health \nand Safety  \n \n7.1\nUse of personal protective equipment such as:\n Gloves \n Gas mask \n Brush \n7.2 \nAppropriate space with ventilation  \n7.3\nProvision of fire extinguisher in work area\n\n--- PDF PAGE 45 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n41"
