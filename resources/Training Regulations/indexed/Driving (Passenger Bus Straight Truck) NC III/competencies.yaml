          "source_text": "1. Select measuring \ninstruments \n1.1 \nObject or component to be measured is identified \n1.2 \nCorrect specifications are obtained from relevant source \n1.3 \nAppropriate measuring instrument is selected according to \njob requirements \n2. Carry out \nmeasurements and \ncalculation \n2.1 \nMeasuring tools are selected in line with job requirements \n2.2 \nAccurate measurements are obtained to job \n2.3 \nCalculation needed to complete work tasks are performed \nusing the four basic process of addition (+), subtraction (-), \nmultiplication (x) and division (/). \n2.4 \nCalculations involving fractions, percentages and mixed \nnumbers are used to complete workplace tasks. \n2.5 \nNumerical computation is self-checked and corrected for \naccuracy \n2.6 \nInstruments are read to the limit of accuracy of the tool. \n3. Maintain measuring \ninstruments \n3.1 \nMeasuring instruments must kept free from corrosion \n3.2 \nMeasuring instruments not dropped to avoid damage \n3.3 \nMeasuring instruments cleaned before and after using.\n\n--- PDF PAGE 23 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n19\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Measuring instruments \nMeasuring instruments includes: \n1.1 \nMultitester \n1.2 \nMicrometer (In-out, depth) \n1.3 \nVernier caliper (Out, inside) \n1.4 \nDial Gauge with Mag. Std. \n1.5 \nPlastigauge \n1.6 \nStraight Edge \n1.7 \nThickness gauge \n1.8 \nTorque Gauge \n1.9 \nSmall Hole gauge \n1.10 Telescopic Gauge \n1.11 Try square \n1.12 Protractor \n1.13 Combination gauge \n1.14 Steel rule  \n2.  Calculation \n \nKinds of Part Mensuration include: \n2.1 \nVolume \n2.2 \nArea \n2.3 \nDisplacement \n2.4 \nInside diameter \n2.5 \nCircumference \n2.6 \nLength \n2.7 \nThickness \n2.8 \nOutside diameter \n2.9 \nTaper \n2.10 Out of roundness \n2.11 Oil clearance \n2.12 End play/thrust clearance\n\n--- PDF PAGE 24 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n20"
