l: \n3.1 \nKilometers traveled used \n3.2 \nNo. of Hours used \n3.3 \nMonthly \n \n4. Tool and equipment \nTools used includes: \n4.1 \nHand tools \n4.2 \nOiler \n4.3 \nOil Dispenser \n4.4 \nGrease gun \n \n5. Personal Protective \nEquipment (PPE) \n \nPPE include: \n5.1 \nApron \n5.2 \nGloves \n5.3 \nGoggles \n5.4 \nSafety shoes\n\n--- PDF PAGE 34 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n30"
