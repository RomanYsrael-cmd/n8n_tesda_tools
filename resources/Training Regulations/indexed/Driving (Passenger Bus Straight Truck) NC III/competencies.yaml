        "source_title": "Prepare job estimate/costing",
        "source_text": "--- PDF PAGE 41 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n37\nUNIT OF COMPETENCY : \nPREPARE JOB ESTIMATE/COSTING \n \nCODE \n: \nALT311204 \n \nUNIT DESCRIPTOR \n: \nThis competency unit covers the knowledge, skills and attitude in \nestimating/costing automotive repair. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify nature/scope \nof work \n1.1 \nEffective communication skills are applied to determine the \nnature and scope of work to be undertaken \n1.2 \nExtent of service to be rendered in determined and \ndocumented in line with standard operating procedures (SOP) \n2. Prepare and present \nestimate \n2.1 \nType and quantity of supplies, materials and labor required to \nperform work are identified in line with job requirements \n2.2 \nCost of supplies, materials are obtained from suppliers \n2.3 \nTotal cost of required services is calculated in line with SOP \n2.4 \nEstimate is presented to customer in line with SOP. \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Communication \nCommunication  includes: \n1.1 \nListening to customer \n1.2 \nSpeaking with suppliers, customers and co-workers \n1.3 \nQuestioning \n2.  Suppliers \nSuppliers includes: \n2.1 \nDistributors \n2.2 \nManagers \n2.3 \nProprietors \n3.  Cost \nCosts include: \n3.1 \nMaterials \n3.2 \nLabor \n3.3 \nOverhead\n\n--- PDF PAGE 42 ---\nTR – DRIVING (Passenger Bus/Straight Truck) NC III \nPromulgated January 14, 2011  \n38\nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \n \nAssessment requires evidence that the candidate \n1.1 \nIdentified nature/scope of work \n1.2 \nPrepared and presented estimate \n2. Underpinning \nknowledge and \nattitudes \n \n2.1 \nConsumer mathematics \n2.2 \nReplaceable/Fabricated Materials or Spare parts in a vehicle \n2.3 \nAutomotive Repair Procedures and Techniques \n2.4 \nJob estimates \n3. Underpinning skills \n3.1 \nComputing using the Four Mathematical Operations \n3.2 \nEstimating repair works and activities \n4. Resource implication \nThe following resources must be provided: \n4.1 \nAppropriate tools such as calculator, paper, pen, and other \nmeasuring instruments relevant to activity \n5. Methods of \nassessment \n \nCompetency must be assessed through: \n5.1 \nObservation with questioning \n5.2 \nPresentation of Finished drawing \n6. Context for \nassessment \n \n6.1 \nCompetency must be assessed in a room or any simulated \nplaces \n6.2 \nAssessment must be given according to industry standard\n",
