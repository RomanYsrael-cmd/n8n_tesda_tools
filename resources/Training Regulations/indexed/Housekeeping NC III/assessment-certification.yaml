      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s of competency of a qualification with a promulgated Training Regulations. 4.1.2 Candidate wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.3 Holders of valid National Certificate (NC) under Housekeeping NC III will have to undergo assessment to the amended TR for Housekeeping NC III. 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.5 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry Housekeeping NC III Revision 01 Promulgated (10/15/2019) 131"
