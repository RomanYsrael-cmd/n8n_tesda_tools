 liquid form, used to clean a\nsurface/for laundry\n4. Clean\n5. Computer Literate\n\n6. Computer\nRoom/Laboratory\n\nFree from dirt, dust and any foreign matters\nIs defined as the knowledge and ability to utilize computers\nand related technology efficiently, with a range of skills\ncovering levels from elementary use to computer\nprogramming and advanced problem solving.\nThis area has an array of computer units where trainees are\nprovided to learn and gain appropriate IT competencies as\nmay be prescribe in the competency standard and\ncurriculum. Computer units are in a LAN environment holed\nto an ISP for internet access.\n7. Condemning linen\n8. Contextual\nLearning\nRemoval of worn out or damaged linen from circulation\nthis facility ensures that the underpinning knowledge, the\nscience, mathematics and communication principles as\napplied to the technology are provided to the trainee.\n9. Deodorizer\nA product used to absorb odour and any unpleasant smell\n10. Disinfectant\n\n11. Distance Learning\nArea\nAny chemical agent used to destroy the growth of harmful\norganisms\nThis is to enable the learning provision outside and away\nfrom the training institution in term of print and non-print\nmedia.\n12. Dry Cleaning\nThe process of cleaning of delicate garments, fabrics, etc.,\nwith the use of chemicals rather than water\n13. Duvet\nA set of quilt usually down-filled used for bed making\n14. Emergency\nManagement Plan\nA document detailing the response of the venue/staff\nmembers when a variety of emergency situations arise\n15. External\nregulations\nReferring to policies and guidelines issued by related\ngovernment agencies\n16. ETA\n\nEstimated time of arrival\n17. ETD\n\nEstimated time of departure\n18. Extraction\nequipment\nThe equipment used for the removal of moisture from linens\nby way of high speed rotations\n19. Fittings\nAnything attached to a ceiling wall or floor to house a room\nequipment\n20. Folding Machine or\nAutomatic Folder\nThe machine which folds linen in a pre-determined way\n21. Formula\n\nThe combination of water, temperature and chemicals to\nsuccessfully launder different categories of linen\n22. Furnishings\n\nMovable items of furniture in a guest room, such as chairs\nand tables\n23. HACCP\nHazard Analysis Critical Control Point\n24. Kitchenette\nA small kitchen or part of another room equipped with\nkitchen tools\n\n--- PDF PAGE 140 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 136\n\n25. KPIs\nKey Performance Indicators\n26. KRAs\nKey Result Areas\n27. Laundry\n\n28. Learning Resource\nCenter\n\nArticles of clothing, linens, etc., that have been or are to be\nwashed\n\nThis area is providing the trainee with the knowledge\nrequirements in the various modules responding to the\ncompetencies. The area has an array of learning materials\nin print or soft-copies from a multimedia environment.\n29. Linens\n\nRefers to all items that includes bed linen, food service linen\nand such other hotel clothing materials for laundry\n30. Lint\nLoose fibres from the laundered linen that are to be removed\nthrough processing\n31. Malfunction\n\nFailure to function properly\n32. Outsource laundry\n\nPatronize external laundry contractor for the laundry of hotel\nlinens\n33. OSH\n\nOSH refers to ‘Occupational Safety and Health. It relates to\nworkplace health and safety policies, procedures and\npractices\n34. Par stock\n\nThe amount of linen required for the days operation\n35. Polish\n\nUsed to enhance the smoothness and the glossy\nappearance of furniture and fixtures with a cloth and an\nappropriate chemical\n36. PPE\n\n37. Practical work area\n\nPersonal protective equipment (includes the uniform and the\nsafety materials)\n\nThis area is where the trainee acquires the skills and\nknowledge components of the competencies prescribed by\nthe standard.\n38. SOP\n\nStandard Operating Procedure\n\n39. Suite room\n\nHotel accommodation with two rooms: receiving and\nbedroom\n40. Housekeeping\ntrolley\nA transport equipment used to move housekeeping supplies\nand linens from room to room\n41. Turndown service\n\nIs the evening service to prepare the room for guest sleep\nthat includes tidying the room, dimming the light and fixing\nthe bed linen\n42. Twin room\n\nTwo beds in a room\n43. UHF\nUltra-high frequency\n\n--- PDF PAGE 141 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 137\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title :\nQualification Code :\nHousekeeping NC III\nTRSHSK319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHousekeeping\nNC III\n2007-41 /\n11/22/2007\nN/A\n01\nDocument Amended\n\nHousekeeping\nNC III\n2019-56/\n1015/2019\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 142 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 138\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS/TESDA EXPERTS PANEL\n\nGLORIA BAKEN WONG-SIY\nLILIBETH ARAGON\nIndustry Expert-Consultant/\nFounding President/Auditor\nAssociation of Administrators in Hospitality\nHotel and Restaurant Management\nEducational Institutions (AAHRMEI)/TIBFI\nASEAN Master Trainer\nDean CITHM/VP Internal\nLyceum\nof\nthe\nPhilippines\nUniversity\nIntramuros, Manila/AAHRMEI\nASEAN Master Trainer\n\nJAEWE PIANSAY\nNational Assessor/Trainer\nUNO Caregiver and Domestic Mngt.\nTraining, Inc.\nAAHRMEI\n\nANABELLE O. MORENO\nBoard of Trustees\nTourism Industry Board Foundation, Inc.\n(TIBFI)\nASEAN Master Trainer\nMA. CHRISTINA G. AQUINO\nExecutive Director/Chair\nLyceum of the Philip