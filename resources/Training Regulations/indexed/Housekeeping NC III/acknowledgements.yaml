 WORK PRACTICES\nUNIT CODE : 400311325\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to interpret Occupational Safety and Health\npractices, set OSH work targets, and evaluate\neffectiveness of Occupational Safety and Health\nwork instructions\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nOccupational\nSafety and\nHealth practices\n\n1.1 OSH work practices\nissues are identified\nrelevant to work\nrequirements\n1.2 OSH work standards and\nprocedures are\ndetermined based on\napplicability to nature of\nwork\n1.3 Gaps in work practices\nare identified related to\nrelevant OSH work\nstandards\n\n1.1. OSH work\npractices issues\n1.2. OSH work\nstandards\n1.3. General OSH\nprinciples and\nlegislations\n1.4. Company/\nworkplace policies/\nguidelines\n1.5. Standards and\nsafety\nrequirements of\nwork process and\nprocedures\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n2. Set OSH work\ntargets\n\n2.1 Relevant work\ninformation are gathered\nnecessary to determine\nOSH work targets\n2.2 OSH Indicators based\non gathered information\nare agreed upon to\nmeasure effectiveness of\nworkplace OSH policies\nand procedures\n2.3 Agreed OSH indicators\nare endorsed for\napproval from\nappropriate personnel\n2.4 OSH work instructions\nare received in\naccordance with\nworkplace policies and\nprocedures*\n\n2.1. OSH work targets\n2.2. OSH Indicators\n2.3. OSH work\ninstructions\n2.4. Safety and health\nrequirements of\ntasks\n2.5. Workplace\nguidelines on\nproviding\nfeedback on OSH\nand security\nconcerns\n2.6. OSH regulations\nHazard control\nprocedures\n2.7. OSH trainings\nrelevant to work\n2.1. Communication\nskills\n2.2. Collaborating\nskills\n2.3. Critical thinking\nskills\n2.4. Observation\nskills\n\n--- PDF PAGE 36 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 32\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n\n3.1 OSH Practices are\nobserved based on\nworkplace standards\n3.2 Observed OSH\npractices are measured\nagainst approved OSH\nmetrics\n3.3 Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nOSH work standards\n\n3.1. OSH Practices\n3.2. OSH metrics\n3.3. OSH Evaluation\nTechniques\n3.4. OSH work\nstandards\n3.1. Critical thinking\nskills\n3.2. Evaluating skills\n\n--- PDF PAGE 37 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Work\nPractices Issues\nMay include:\n1.1 Workers’ experience/observance on presence of work\nhazards\n1.2 Unsafe/unhealthy administrative arrangements (prolonged\nwork hours, no break-time, constant overtime, scheduling\nof tasks)\n1.3 Reasons for compliance/non-compliance to use of PPEs or\nother OSH procedures/policies/ guidelines\n2. OSH Indicators\nMay include:\n2.1 Increased of incidents of accidents, injuries\n2.2 Increased occurrence of sickness or health\ncomplaints/symptoms\n2.3 Common complaints of workers’ related to OSH\n2.4 High absenteeism for work-related reasons\n3. OSH Work\nInstructions\nMay include:\n3.1 Preventive and control measures, and targets\n3.2 Eliminate the hazard (i.e., get rid of the dangerous\nmachine\n3.3 Isolate the hazard (i.e. keep the machine in a closed room\nand operate it remotely; barricade an unsafe area off)\n3.4 Substitute the hazard with a safer alternative (i.e., replace\nthe machine with a safer one)\n3.5 Use administrative controls to reduce the risk (i.e. give\ntrainings on how to use equipment safely; OSH-related\ntopics, issue warning signages, rotation/shifting work\nschedule)\n3.6 Use engineering controls to reduce the risk (i.e. use safety\nguards to machine)\n3.7 Use personal protective equipment\n3.8 Safety, Health and Work Environment Evaluation\n3.9 Periodic and/or special medical examinations of workers\n4. OSH metrics\nMay include:\n4.1 Statistics on incidence of accidence and injuries\n4.2 Morbidity (Type and Number of Sickness)\n4.3 Mortality (Cause and Number of Deaths)\n4.4 Accident Rate\n\n--- PDF PAGE 38 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 34\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Identify OSH work practices issues relevant to work\nrequirements\n1.2. Identify gaps in work practices related to relevant\nOSH work standards\n1.3. Agree upon OSH Indicators based on gathered\ninformation to measure effectiveness of workplace\nOSH policies and procedures\n1.4. Receive OSH work instructions in accordance with\nworkplace policies and procedures\n1.5. Compare Observed OSH practices with against\napproved OSH work instructions\n1.6. Assess findings regarding effectiveness based on\nOSH work standards\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials, tools and equipment\nnecessary for the activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n3.3 Written exam\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 39 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 35\n\nUNIT OF COMPETENCY\n: EVALUATE ENVIRONMENTAL WORK\nPRACTICES\n\nUNIT CODE\n: 400311326\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude to\ninterpret environmental Issues, establish targets to\nevaluate environmental practices and evaluate\neffectiveness of environmental practices\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n1.1 Environmental work\npractices issues are\nidentified relevant to work\nrequirements\n1.2 Environmental Standards\nand Procedures nature\nof work are determined\nbased on Applicability to\nnature of work\n1.3 Gaps in work practices\nrelated to Environmental\nStandards and\nProcedures are identified\n\n1.1 Environmental\nIssues\n1.2 Environmental\nWork\nProcedures\n1.3 Environmental\nLaws\n1.4 Environmental\nHazardous and\nNon-Hazardous\nMaterials\n1.5 Environmental\nrequired\nlicense,\nregistration or\ncertification\n1.1. Analyzing\nEnvironmental\nIssues and\nConcerns\n1.2. Critical thinking\n1.3. Problem Solving\n1.4. Observation Skills\n\n2. Establish\ntargets to\nevaluate\nenvironmental\npractices\n\n2.1. Relevant information are\ngathered necessary to\ndetermine environmental\nwork targets\n2.2. Environmental Indicators\nbased on gathered\ninformation are set to\nmeasure environmental wo\ntargets\n2.3. Indicators are verified with\nappropriate personnel\n2.1. Environmental\nIndicators\n2.2. Relevant\nEnvironment\nPersonnel or\nexpert\n2.3. Relevant\nEnvironmental\nTrainings and\nSeminars\n2.1. Investigative\nSkills\n2.2. Critical thinking\n2.3. Problem Solving\n2.4. Observation Skills\n\n--- PDF PAGE 40 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 36\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\neffectiveness of\nenvironmental\npractices\n3.1. Work environmental\npractices are recorded\nbased on workplace\nstandards\n3.2. Recorded work\nenvironmental practices\nare compared against\nplanned indicators\n3.3. Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nenvironment work\nstandards and\nprocedures\n3.4. Results of environmental\nassessment are\nconveyed to appropriate\npersonnel\n\n1.1. Environmental\nPractices\n1.2. Environmental\nStandards and\nProcedures\n3.1 Documentation\nand Record\nKeeping Skills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n\n--- PDF PAGE 41 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 37\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Environmental Practices\nIssues\nMay include:\n1.1\nWater Quality\n1.2\nNational and Local Government Issues\n1.3\nSafety\n1.4\nEndangered Species\n1.5\nNoise\n1.6\nAir Quality\n1.7\nHistoric\n1.8\nWaste\n1.9\nCultural\n2. Environmental Indicators\nMay include:\n2.1\nNoise level\n2.2\nLighting (Lumens)\n2.3\nAir Quality - Toxicity\n2.4\nThermal Comfort\n2.5\nVibration\n2.6\nRadiation\n2.7\nQuantity of the Resources\n2.8\nVolume\n\n--- PDF PAGE 42 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 38\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1. Identified environmental issues relevant to work\nrequirements\n1.2. Identified gaps in work practices related to\nEnvironmental Standards and Procedures\n1.3. Gathered relevant information necessary to determine\nenvironmental work targets\n1.4. Set environmental indicators based on gathered\ninformation to measure environmental work targets\n1.5. Recorded work environmental practices are recorded\nbased on workplace standards\n1.6. Conveyed results of environmental assessment to\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n2.3 Case studies/scenarios relating to environmental\nprotection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs,\ncertificate of training – local and abroad)\n 3.4 Simulations and role-plays\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 43 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 39\nUNIT OF COMPETENCY :\nFACILITATE ENTREPRENEURIAL SKILLS FOR\nMICRO-SMALL-MEDIUM ENTERPRISES (MSMEs)\n\n UNIT CODE\n:\n400311327\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to build,\noperate and grow a micro/small-scale enterprise.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n1.1 Appropriate business\nstrategies are\ndetermined and set for\nthe enterprise based on\ncurrent and emerging\nbusiness environment.\n1.2 Business operations\nare monitored and\ncontrolled following\nestablished procedures.\n1.3 Quality assurance\nmeasures are\nimplemented consistently.\n1.4 Good relations are\nmaintained with\nstaff/workers.\n1.5 Policies and procedures\non occupational safety\nand health and\nenvironmental concerns\nare constantly observed.\n1.1 Business\nmodels and\nstrategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business\noperation\n1.4 Basic\nBookkeeping\n1.5 Business\ninternal controls\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n1.7 Government\nand regulatory\nprocesses\n\n1.1 Basic\nbookkeeping/\naccounting\nskills\n1.2 Communication\nskills\n1.3 Building\nrelations with\ncustomer and\nemployees\n1.4 Building\ncompetitive\nadvantage of\nthe enterprise\n2. Establish and\nmaintain client-\nbase/market\n2.1 Good customer relations\nare maintained\n2.2 New customers and\nmarkets are identified,\nexplored and reached out\nto.\n2.3 Promotions/Incentives\nare offered to loyal\ncustomers\n2.4 Additional products and\nservices are evaluated\nand tried where feasible.\n2.5 Promotional/advertising\ninitiatives are carried out\nwhere necessary and\nfeasible.\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market\nand feasibility\nstudies\n2.4 Basic business\nethics\n2.1 Building\ncustomer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/\ntarpaulins,\nflyers, social\nmedia, etc.)\n\n--- PDF PAGE 44 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 40\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Apply budgeting\nand financial\nmanagement\nskills\n3.1 Enterprise is built up and\nsustained through\njudicious control of cash\nflows.\n3.2 Profitability of enterprise\nis ensured though\nappropriate internal\ncontrols.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are avoided.\n3.1 Cash flow\nmanagement\n3.1 Basic financial\nmanagement\n3.2 Basic financial\naccounting\n3.3 Business internal\ncontrols\n\n3.1 Setting\nbusiness\npriorities and\nstrategies\n3.2 Interpreting\nbasic financial\nstatements\n3.3 Preparing\nbusiness\nplans\n\n--- PDF PAGE 45 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business strategies\nMay include:\n1.1. Developing/Maintaining niche market\n1.2. Use of organic/healthy ingredients\n1.3. Environment-friendly and sustainable practices\n1.4. Offering both affordable and high-quality products\nand services\n1.5. Promotion and marketing strategies (e. g., on-line\nmarketing)\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n4. Promotional/Advertising\ninitiatives\nMay include:\n4.1\nUse of tarpaulins, brochures, and/or flyers\n4.2\nSales, discounts and easy payment terms\n4.3\nUse of social media/Internet\n4.4\n“Service with a smile”\n4.5\nExtra attention to regular customers\n\n--- PDF PAGE 46 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 42\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate :\n1.1 Demonstrated basic entrepreneurial skills\n1.2 Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n1.3 Demonstrated ability to manage/operate a\n micro/small-scale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate\nthe required tasks\n2.3 References and manuals\n3. Methods of\n Assessment\nCompetency in this unit may be assessed through :\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Portfolio assessment with interview\n3.4 Case problems\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 47 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 43\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n: RECEIVE AND RESOLVE CUSTOMER COMPLAINTS\n\nUNIT CODE\n: TRS141201\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the skills and knowledge required to\n\nreceive and resolve customer complaints in a range of\n\nsettings within the hospitality industry workplace context.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify and\nanalyse the\ncomplaint\n\n1.1 Verbal complaint,\nusing active listening\nand empathy\ntechniques is received\nand accurately\nrecorded\n1.2 The exact nature of\nthe customer\ncomplaint are\nidentified through\nappropriate\ncommunication\ntechniques\n1.3 Register or complaint\nfile/s in accordance\nwith the requirements\nof the enterprise\ninformation system\nare maintained\n1.1 Communication\ntechniques\n1.2 Anger management\ntechniques and\nconflict resolution\ntechniques\n1.3 Customer\ncomplaints\n1.4 Records and\ndocumentation\n1.5 Enterprise’s policies\nand procedures\n\n1.1 Questioning and\ncommunication\nskills\n1.2 Research skills\n1.3 Analytical skills\n1.4 Identifying\nrelevant\ninformation\n1.5 Compilation and\nclassification of\ninformation and\ndata\n1.6 Networking skills\n1.7 Handling\ncomplaints\n2. Respond to\ncomplaints\n2.1 Complaints in\naccordance with\norganizational\nstandards, policies\nand procedures are\nprocessed\n2.2 Documentation in\nrelation to complaints\nis obtained and\nreviewed\n2.3 Register of\ncomplaints/disputes\nare updated\n4.1 Communication\ntechniques\n4.2 Anger management\ntechniques and\nconflict resolution\ntechniques\n4.3 Customer\ncomplaints\n4.4 Records and\ndocumentation\n4.5 Enterprise’s policies\nand procedures\n\n2.1 Questioning and\ncommunication\nskills\n2.2 Analytical skills\n2.3 Identifying\nrelevant\ninformation\n2.4 Compilation and\nclassification of\ninformation and\ndata\n2.5 Networking\nskills\n2.6 Processing\ncomplaints\n3. Determine and\nagree upon\nappropriate\naction to resolve\ncomplaint\n3.1 Options to resolve the\ncomplaint within\nenterprise policy,\nprocedures and\nguidelines are\nidentified and reviewed\n\n3.1 Communication\ntechniques\n3.2 Anger management\ntechniques and\nconflict resolution\ntechniques to\nresolve customer\n3.1 Questioning and\ncommunication\nskills\n3.2 Analytical skills\n3.3 Ability to\nresearch\nindustry\n\n--- PDF PAGE 48 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 44\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Action to resolve the\ncomplaint with the\ncustomer is agreed\nand confirmed.\n3.3 A commitment to the\ncustomer to resolve\nthe complaint is\ndemonstrated\n3.4 Customer is\ninformed on the\noutcome of\ninvestigation of\ncomplaint investigation\ncomplaints\n3.3 Communicate\neffectively with all\nrelevant people\nthroughout the\ncomplaint resolution\nprocess\n3.4 Written complaints\n3.5 Workplace records\nand documentation.\n3.6 Enterprise’s policies\nand procedures in\nregard to receiving\nand resolving\ncustomer complaints\ninformation\nsources\n3.4 Identifying\nrelevant\ninformation\n3.5 Compilation and\nclassification of\ninformation and\ndata\n3.6 Networking skills\n3.7 Resolving\ncomplaint\n\n4. Refer complaints\n4.1 Complaints that\nrequire referral to\nother personnel or\nexternal bodies are\nidentified\n4.2 Complaint to\nappropriate\npersonnel for follow-\nup in accordance with\nindividual level of\nresponsibility are\nreferred\n4.3 All necessary\ndocumentation\nincluding investigation\nreports to appropriate\npersonnel are\nforwarded\n4.4 Complaints which\ncannot be resolved to\nan appropriate person\nare referred\n4.3 Communication\ntechniques\n4.4 Anger management\ntechniques and\nconflict resolution\ntechniques to\nresolve customer\ncomplaints\n4.5 Communicate\neffectively with all\nrelevant people\nthroughout the\ncomplaint resolution\nprocess\n4.6 Written complaints\n4.7 Workplace records\nand documentation.\n4.8 Enterprise’s policies\nand procedures in\nregard to receiving\nand resolving\ncustomer complaints\n4.1 Questioning and\ncommunication\nskills\n4.2 Analytical skills\n4.3 Ability to\nresearch\nindustry\ninformation\nsources\n4.4 Identifying\nrelevant\ninformation\n4.5 Compilation and\nclassification of\ninformation and\ndata\n4.6 Networking skills\n\n--- PDF PAGE 49 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 45\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Complaint\nMay include:\n1.1 Any expression of dissatisfaction with food and\nbeverage products or food service by a customer\n1.2 Written complaints, e.g. Letter, email, complaint\nand/or feedback form\n1.3 Verbal, face-to-face, complaints\n1.4 Verbal complaints over the telephone\n2. Appropriate\ncommunication techniques\nMay include:\n2.1 The use of active listening\n2.2 The use of both open and closed questions\n2.3 Speaking clearly and concisely\n2.4 Using appropriate language and tone of voice\n2.5 Giving customers full attention\n2.6 Maintaining eye contact in face-to face interactions\n2.7 Appropriate non-verbal communication in face-to-\nface interactions, e.g. Body language, attention and\npersonal presentation\n2.8 and should include:\n2.9 Conflict resolution techniques\n2.10 Anger management techniques\n2.11 Observation of personal safety\n3. Organizational standards,\npolicies and procedures\nMay include:\n3.1 Complaints procedures\n3.2 Organisational standard report forms\n3.3 Job descriptions\n3.4 Code of ethics\n3.5 Quality systems, standards and guidelines\n3.6 Insurance/liabilities policies\n4. Documentation\nMay include:\n4.1 Letters of complaint\n4.2 Customer feedback forms outlining complaints, such\nas paper-based customer satisfaction\nquestionnaires, internet-based customer satisfaction\nquestionnaires\n4.3 Complaint emails\n5. Options\n\nMay include:\n5.1 Options that satisfy the customer\n5.2 Options that partially satisfy the customer\n5.3 Options that do not satisfy the customer.\n5.4 and should include:\n5.5 Options that reflect enterprise policy, procedures and\nguidelines.\n6. Inform customer of\noutcome\nMay include:\n6.1 Providing documentation and/or evidence that\nsupports customer complaint\n6.2 Providing documentation and/or evidence that does\nnot support customer complaint.\n\n--- PDF PAGE 50 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 46\nVARIABLE\nRANGE\n6.3 Information (verbal or written) that directly relates to\nthe complaint being investigated\n6.4 Information (verbal or written) that is presented in a\ncalm and accurate manner\n7. Appropriate person\nMay include:\n7.1 Immediate superior within the organisational\nhierarchy\n7.2 Specialist customer service staff\n7.3 External bodies\n\n--- PDF PAGE 51 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 47\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to apply anger management\ntechniques\n1.2 Demonstrated ability to apply conflict resolution\ntechniques\n1.3 Demonstrated ability to use effective communication\nskills to accurately determine the nature of\ncomplaints\n1.4 Demonstrated ability to obtain written and verbal\ninformation relevant to the complaint\n1.5 Demonstrated ability to working with enterprise\npolicies and procedures to resolve customer\ncomplaints\n1.6 Demonstrated ability to initiate escalation procedures\nat an appropriate time within the complaint resolution\nprocess\n1.7 Demonstrated ability to maintain effective\ncommunication lines with customers, other personnel\nand management in order to resolve customer\ncomplaints quickly\n1.8 Demonstrated ability to apply knowledge of different\ncultures and cultural characteristics appropriately in\ncommunications with customers and colleagues from\ndiverse backgrounds\n2. Resource Implications\nThe following resources should be provided:\nTraining and assessment to include access to a real or\nsimulated workplace; and access to workplace customer\nservice standards, procedures, policies, guidelines, tools\nand equipment and in particular those procedures,\npolicies and guidelines that guide effective complaint\nresolution.\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case studies\n3.2 Observation of practical candidate performance\n3.3 Oral and written questions\n3.4 Portfolio evidence\n3.5 Problem solving\n3.6 Role plays\n3.7 Third party reports completed by a supervisor\n3.8 Project and assignment work.\n 4. Context of Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 52 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 48\n\n UNIT OF COMPETENCY : WORK COOP