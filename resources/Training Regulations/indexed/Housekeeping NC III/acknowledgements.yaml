      "source_text": "REQUIRED SKILLS 1. Develop and implement staff rosters 1.1 Rosters are developed in accordance with company agreements and wage budgets. 1.2 Operational efficiency and customer service levels are maximized while wage costs are minimized in roster development. 1.3 Duties are combined where appropriate to ensure effective use of staff. 1.4 The available skills base is utilized appropriately to roster the most effective mix of staff and to meet different operational requirements. 1.5 Rosters are presented in required formats to ensure clarity of information in accordance with company standards. 1.6 Rosters are communicated to appropriate colleagues within designated timelines. 1.1 Effective communication 1.2 Role of rosters and their importance in controlling staff costs 1.3 Factors to be considered when developing rosters 1.4 Formats for the presentation of staff rosters and details to be included 1.5 Area of operation for which roster is being developed 1.6 Company standards 1.7 Customer Service"
