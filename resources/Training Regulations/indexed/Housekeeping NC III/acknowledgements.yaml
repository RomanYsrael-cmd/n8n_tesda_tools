      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Demonstrated knowledge and understanding of the factors and issues which impact upon staff rostering 1.2 Demonstrated familiarity with typical formats and the key information to be included 1.3 Demonstrated the ability to prepare staff rosters which meet wage budgets and which provide a level of staffing sufficient to ensure the delivery of high quality customer service. 2. Resource Implications The following resources should be provided: 2.1 Project or work activities which allow the candidate to prepare rosters for a workplace and to evaluate their cost efficiency and operational effectiveness against nominated standards 2.2 Preparation of more than one roster to meet the staffing requirements of more than one operational situation 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Evaluation of the staffing costs and observing service levels at an event for which the candidate has prepared rosters 3.2 Oral or written questions to assess knowledge of specific factors which affect the design of rosters 3.3 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate 4. Context for Assessment 4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center."
