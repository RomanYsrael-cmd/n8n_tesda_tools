      "source_text": "SECTION 1 HOUSEKEEPING NC III QUALIFICATION"
    },
    {
      "source_text": "The HOUSEKEEPING NC III Qualification consists of competencies that a person must achieve to deliver and supervise housekeeping service operations in Tourism and hospitality related enterprises."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of the Tourism Sector (Hotel and Restaurant) as shown in Annex A."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES 400311319 Lead workplace communication 400311320 Lead small teams 400311321"
    },
    {
      "source_text": "400311322 Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment 400311323"
    },
    {
      "source_text": "400311324 400311325 400311326 400311327 Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs)"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES TRS141201 Receive and resolve customer complaints TRS141202 Work cooperatively in a general administration environment TRS141203 Maintain quality customer/guest service TRS141204 Roster staff TRS141205 Control and order stock TRS141206 Prepare and deliver training sessions TRS141207 Plan, conduct and evaluate staff performance assessment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES"
    },
    {
      "source_text": "TRS515301 Supervise room cleaning and maintenance requirement TRS515302 Supervise housekeeping services to guests TRS515303 Implement lost and found procedures TRS515304 Supervise laundry of linen, uniform and guest clothes"
    },
