nCORE COMPETENCIES\n(64 Hours)\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Supervise room\ncleaning and\nmaintenance\nrequirement\n\n1.1 Monitor housekeeping\nrequirement procedures and\nresources\n\n• Recognize external regulations\n• Identify tools, equipment and\nsupplies\n• Report accidents, injuries, and\nunsafe work conditions to\nsupervisor/manager\n• Assimilate workplace procedures and\npolicies for housekeeping\n• Apply BOSH and green practices\n\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n• Case Study\n\n6 hours\n1.2 Monitor cleanliness and safety in\nthe workplace\n• Monitor cleanliness and tidiness of the\nworkplace\n• Identify housekeeping issues\n• Maintain and store housekeeping\nequipment and supplies\n• Maintain stored records\n• Individual\nlearning\n• Group\nDiscussion\n• Case Study\n• Role playing\n• Written Report\n• Oral\nQuestioning\n• Demonstration\n4 hours\n1.3 Assess and evaluate assigned\ntasks\n• Schedule and apply risk assessment\nactivities\n• Review and assess the effectiveness\nof the systems\n• Recognize compliance with\nlegislations and internal requirements\n• Plan for adjustments and\nimprovements\n• Individual\nlearning\n• Group\nDiscussion\n• Case Study\n• Role playing\n• Written Report\n• Oral\nQuestioning\n• Demonstration\n6 hours\n2. Supervise\nhousekeeping\nservices to\nguests\n2.1 Monitor housekeeping team\n\n• Recognize regulatory requirements\nincluding Health & Safety\n• Follow housekeeping standard\noperational procedures\n• Implement waste management and\ndisposal\n• Monitor application of HACCP and\nBOSH\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n• Case Study\n\n4 hours\n\n--- PDF PAGE 127 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 123\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.2 Update current practices in\nhousekeeping\n• Implement latest developments in the\nhousekeeping industry\n• Apply related technology for health,\nsafety, employment and green\npractices\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Case Study\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n4 hours\n2.3 Evaluate housekeeping team’s\nperformance vs. organizational\nstandards\n• Measure team’s performance in\nterms of rooms per day against the\norganizational standard\n• Set room target per day according to\norganizational needs\n• Monitor roster staffing against the\nroom target allocation\n• Measure performance against guest\nfeedback\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n• Case Study\n\n4 hours\n2.4 Monitor usage of tools,\nequipment and supplies\n• Conduct inventory of tools,\nequipment and supplies\n• Understand inventory control and\nmaintenance\n• Review practices against\nestablishment’s manual\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n• Case Study\n\n4 hours\n3. Implement lost\nand found\nprocedures\n3.1 Monitor lost and found facility\n• Monitor lost and found facility\n• Evaluate compliance of lost and\nfound policies and procedures\n• Monitor the maintenance of lost and\nfound facility\n• Recognize application of legal\nrequirements for lost and found\nfacility\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n\n--- PDF PAGE 128 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 124\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.2 Deal with lost and found items\n•\nCheck items for safety and legality\nand take appropriate action\n•\nRecord found items in lost and\nfound register\n•\nRecord items reported lost in lost\nand found register\n•\nTag the found item\n•\nStore the found item appropriately\n•\nNotify owner, if known\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n3.3 Deal with claims for lost items\n•\nAssist claimant to identify lost\nproperty\n•\nVerify ownership of property claimed\n•\nObtain identification from owner\n•\nComplete lost and found register\n•\nAssist claimants who contact the\nestablishment from another country,\nor distant area, to claim lost items\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n3.4 Deal with unclaimed items\n•\nComply with establishment policies\n•\nComply with legal obligations\n•\nRemove items from storage and\ncomplete lost and found register to\nrecord movement and disposal of\nitems\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n4. Supervise\nlaundry of\nlinen, uniform\nand guest\nclothes\n4.1 Evaluate the role and\nresponsibilities of a laundry\nservices\n• Monitor documentation of laundered\nitems\n• Assign laundry staff based on\nestablishment’s needs\n• Control costing of laundry services\n• Check laundry tools, equipment and\nsupplies used\n• services\n• Monitor laundry equipment working\ncondition\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n\n--- PDF PAGE 129 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 125\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n4.2 Monitor laundry procedure\n• Monitor the receiving and checking of\npicked-up guest clothes in\naccordance with enterprise\nrequirements\n• Supervise received and laundered\nused in-house items and those with\nunremoved stains\n• Monitor the segregation of guest\nclothes and linens for laundry\n• Check the usage of laundry tools,\nequipment and chemicals\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n2 hours\n4.3 Supervise the costing, packaging\nand delivery of laundered items\n\n• Verify the costing of laundered guest\nclothes\n• Monitor packaging and delivery of\nlaundered items\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n6 hours\n4.4 Supervise laundry facility\nmaintenance\n• Monitor post-cleaning laundry\nactivities\n• Check the cleaning and maintenance\nof laundry tools and equipment\n• Evaluate daily internal laundry report\nand documentation\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n\n--- PDF PAGE 130 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 126\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work components.\n\n--- PDF PAGE 131 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 127\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs, training\ncenters and other TVET providers which are intended to address the\nspecific needs of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n•\nMust have completed the 10-year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent holder\n•\nCan communicate in basic English in both oral and written form\n•\nMust be computer literate\n•\nCan perform basic mathematical computation\n•\nMust be competent in Housekeeping NC II qualification gained through\ntraining or experience or certification\n\n--- PDF PAGE 132 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 128\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for HOUSEKEEPING NC III are as follows:\n\nSupplies\nEQUIPMENT\nREFERENCE MATERIALS\nQTY\n\nQTY\n\nQTY\n\n2\nrims\nA4 paper\n25\nunits\nComputer with\ninternet connection\n25\nInventory forms for tools,\nequipment and supplies\n2\nrims\nLegal Bond\npaper\n1 unit\nLCD projector\n1\nHACCP\n2set\ns\nprinter ink\n2 unit\nPrinter\n1\nBOSH\n\n1\nInternal policies on green\n