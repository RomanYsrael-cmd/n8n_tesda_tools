    },
    {
      "source_text": "25. KPIs Key Performance Indicators 26. KRAs Key Result Areas 27. Laundry"
    },
    {
      "source_text": "28. Learning Resource Center"
    },
    {
      "source_text": "Articles of clothing, linens, etc., that have been or are to be washed"
    },
    {
      "source_text": "This area is providing the trainee with the knowledge requirements in the various modules responding to the competencies. The area has an array of learning materials in print or soft-copies from a multimedia environment. 29. Linens"
    },
    {
      "source_text": "Refers to all items that includes bed linen, food service linen and such other hotel clothing materials for laundry 30. Lint Loose fibres from the laundered linen that are to be removed through processing 31. Malfunction"
