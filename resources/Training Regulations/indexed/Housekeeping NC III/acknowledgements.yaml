olicies and procedures\n11. Cultural\ndifferences\n\nMay Include:\n11.1 Forms of address\n11.2 Levels of formality, or informality\n11.3 Non-verbal behavior\n11.4 Work ethics\n11.5 Personal grooming\n11.6 Family obligations\n11.7 Recognized holidays\n11.8 Special needs\n11.9 Preferences for personal interactions\n12. Internal customer\n\nMay Include:\n12.1 Colleagues working in another department\n12.2 Team members\n12.3 Supervisor or managers\n13. External customer\n\nMay Include:\n13.1 Suppliers\n13.2 People who buy the goods and services the enterprise sells\n14. Organization\nstandards,\npolicies and\nprocedures\nMay Include:\n14.1 Complaints procedures\n14.2 Organizational standard report forms\n14.3 Job descriptions\n14.4 Code of ethics\n14.5 Quality systems, standards and guidelines\n\n--- PDF PAGE 57 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 53\nVARIABLE\nRANGE\n15. Professional\ndevelopment\nopportunities\n\nMay Include:\n15.1 Coaching, mentoring and/or supervision\n15.2 Formal and/or informal learning programs\n15.3 Internal and/or external training provision\n15.4 Work experience and exchange opportunities\n15.5 Personal study\n15.6 Career planning and development\n15.7 Performance appraisals\n15.8 Workplace skills assessment\n15.9 Quality assurance assessments and recommendations\n16. Formal feedback\n\nMay Include:\n16.1 360-degree assessment\n16.2 Customer satisfaction surveys/forms\n16.3 Team evaluations\n16.4 Performance reviews/appraisals\n16.5 Workplace assessment\n17. Informal feedback May Include:\n17.1 Critical incident reviews\n17.2 Impromptu questioning of customers to obtain view of\nproducts and/or service provided\n17.3 Chance discussions with customers\n17.4 Coaching and mentoring\n17.5 Seeking the opinions of others\n17.6 Comments from supervisors, colleagues or clients\n17.7 Personal, reflective behavior strategies\n18. Non-\ndiscriminatory\nattitudes and\nlanguage\nMay Include:\n18.1 Language in relation to race and ethnicity\n18.2 Not making assumptions about physical or intellectual\nabilities\n18.3 The use of non-discriminatory language in relation to the\nportrayal of people with disabilities\n18.4 Using and gender inclusive language\n\n--- PDF PAGE 58 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 54\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to apply active listening\ntechniques\n1.2 Demonstrated ability to use effective communication\nskills to build and maintain interpersonal relationships\nwithin a designated work group or team\n1.3 Demonstrated ability to apply the principles of good\nteamwork to assist self and others to complete\nassignments within designated timeframes\n1.4 Demonstrated ability to interpret and comply with a\nrange of legislative and procedural requirements\nrelevant to security operations\n1.5 Demonstrated ability to actively seek and interpret\nfeedback on quality of work performance and identify\nopportunities for professional development to develop\nand improve future career options\n1.6 Demonstrated ability to communicate in a clear,\nconcise and accurate manner which reflects\nsensitivity to individual social and cultural differences\n2. Resource Implications\nThe following resources should be provided:\n2.1 Training and assessment to include access to a real\nor simulated workplace; and access to workplace\nstandards, procedures, policies, guidelines, tools\nand equipment\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case studies\n3.2 Observation of practical candidate performance\n3.3 Oral and written questions\n3.4 Portfolio evidence\n3.5 Problem solving\n3.6 Role plays\n3.7 Third party reports completed by a supervisor\n3.8 Project and assignment work\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 59 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 55\nUNIT OF COMPETENCY\n:\nMAINTAIN QUALITY CUSTOMER/GUEST\nSERVICE\n\nUNIT CODE\n\n :\nTRS141203\n\nUNIT DESCRIPTOR\n : This unit deals with the skills and knowledge\n\nrequired to maintain a quality customer/guest\n\nservice within the hotel and travel industries.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify customer/\n guest\nrequirements\n\n1.1 Options to improve\nservice levels are\nidentified\n1.2 Needs of customers\nand/or guests are\nresearched and\nassessed\n1.3 Deficiencies in\nservice delivery are\nidentified by\nconducting data\nanalysis\n1.1 Principles of\neffective\ncommunication skills\n1.2 Business\nenvironment in\nwhich the hotel and\ntravel industry\noperates, including\nmajor current\ncustomer relations\nand management\nissues as\nappropriate to the\nindustry sector\n1.3 Principles of\ncustomer service\n1.4 Organization's\nbusiness structure,\nproducts and\nservices and\norganization's policy\nand procedures for\ncustomer service,\nincluding handling\ncustomer complaints\n1.5 Product and service\nstandards and best\npractice models\n1.6 Common problems\nrelating to customer\nservice\n1.7 Consultation\nmethods, techniques\nand protocols\n1.8 Research and or\nevidence and\nfeedback gathering\ntechniques.\n\n1.1 Questioning and\ncommunication\nskills\n1.2 Research skills\n1.3 Analytical skills\n1.4 Ability to\nresearch\nindustry\ninformation\nsources\n1.5 Identifying\nrelevant\ninformation\n1.6 Compilation and\nclassification of\ninformation and\ndata\n1.7 Networking skills\n\n--- PDF PAGE 60 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 56\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Ensure delivery\nof quality\nproducts/\n services\n\n2.1 Colleagues to meet\nand exceed customer\nservice standards by\nproviding appropriate\nprofessional\ndevelopment are\nassisted\n2.2 Products/services are\nensured to meet\ncustomers’ needs and\nreflect enterprise\nstandards\n2.3 Consistently ensure\nproducts/services\nmeet customer needs\nand reflect enterprise\nstandards\n\n2.1 Principles of\neffective\ncommunication skills\n2.2 Business\nenvironment in\nwhich the hotel and\ntravel industry\noperates, including\nmajor current\ncustomer relations\nand management\nissues as\nappropriate to the\nindustry sector\n2.3 Principles of\ncustomer service\n2.4 Organization's\nbusiness structure,\nproducts and\nservices and\norganization's policy\nand procedures for\ncustomer service,\nincluding handling\ncustomer complaints\n2.5 Product and service\nstandards and best\npractice models\n2.6 Common problems\nrelating to customer\nservice\n2.7 Consultation\nmethods, techniques\nand protocols\n2.8 Research and or\nevidence and\nfeedback gathering\ntechniques\n\n2.1 Questioning and\ncommunication\nskills\n2.2 Research skills\n2.3 Analytical skills\n2.4 Ability to\nresearch\nindustry\ninformation\nsources\n2.5 Identifying\nrelevant\ninformation\n2.6 Compilation and\nclassification of\ninformation and\ndata\n2.7 Networking skills\n\n--- PDF PAGE 61 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 57\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\ncustomer service\n\n3.1 Systems, records and\nreporting procedures\nin order to identify and\nreport on any changes\nin customer\nsatisfaction are\ncompared\n3.2 Customer service\nevaluation outcomes\nare evaluated and\nreported to\ndesignated groups\nor individuals\n3.3 An agreement on\nappropriate courses of\naction to overcome\nproblems is obtained\nupon consultation with\ndesignated\nindividuals/groups\n\n3.1 Principles of\neffective\ncommunication skills\n3.2 Business\nenvironment in\nwhich the hotel and\ntravel industry\noperates, including\nmajor current\ncustomer relations\nand management\nissues as\nappropriate to the\nindustry sector\n3.3 Principles of\ncustomer service\n3.4 Organization's\nbusiness structure,\nproducts and\nservices and\norganization's policy\nand procedures for\ncustomer service,\nincluding handling\ncustomer complaints\n3.5 Product and service\nstandards and best\npractice models\n3.6 Common problems\nrelating to customer\nservice\n3.7 Consultation\nmethods, techniques\nand protocols\n3.8 Research and or\nevidence and\nfeedback gathering\ntechniques\n\n3.1 Questioning and\ncommunication\nskills\n3.2 Research skills\n3.3 Analytical skills\n3.4 Ability to\nresearch\nindustry\ninformation\nsources\n3.5 Identifying\nrelevant\ninformation\n3.6 Compilation and\nclassification of\ninformation and\ndata\n3.7 Networking\nskills.\n\n--- PDF PAGE 62 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 58\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Service levels\n\nMay include:\n1.1 Service quality\n1.2 Customer satisfaction\n1.3 Staff attitude\n1.4 Appearance of venue, staff, etc.\n1.5 Atmosphere of venue\n1.6 Responsiveness of staff to customer requests\n1.7 Delivery times\n1.8 Prices or costs\n1.9 Product or service availability\n1.10 Courtesy and politeness\n2. Appropriate professional\ndevelopment\nMay include:\n2.1 Mentoring\n2.2 Coaching\n2.3 Training\n2.4 Peer support\n3. Evaluate and report on\ncustomer service\nMay include:\n4.1 Service quality evaluations\n4.2 Customer satisfaction evaluations\n4.3 Industry benchmarking\n4. Designated groups or\nindividuals\nMay include:\n5.1 Managers\n5.2 Supervisors\n5.3 Marketing personnel\n\n--- PDF PAGE 63 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 59\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify the needs and\npriorities of the organization delivering services to\ncustomers/guests\n1.2 Demonstrated ability to distinguish between\ncustomer requirements and customer satisfaction\n1.3 Demonstrated ability to provide constructive advice\non customer/guest service practices\n1.4 Demonstrated ability to respond to and report on\ncustomer feedback\n1.5 Demonstrated ability to design strategies to improve\ndelivery of products and services\n1.6 Consistency of performance across a range of\nsituations that demonstrates knowledge,\nunderstanding and skill in implementing the\nprinciples and practices of maintaining quality\ncustomer/guest services\n2. Resource Implications\nThe following resources should be provided:\n2.1 Training and assessment to include access to a real\nor simulated workplace and relevant\ndocumentation, such as strategic plans, information\non the internal and external operating environment\nand customer satisfaction data; and access to\nworkplace standards, procedures, policies,\nguidelines, tools and equipment.\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case studies\n3.2 Observation of practical candidate performance\n3.3 Oral and written questions\n3.4 Portfolio evidence\n3.5 Problem solving\n3.6 Role plays\n3.7 Third party reports completed by a supervisor\n3.8 Project and assignment work\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 64 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 60\nUNIT OF COMPETENCY : ROSTER STAFF\n\nUNIT CODE\n : TRS141204\n\n UNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, behavior and\n\nmotivations required to develop staff rosters. This role\n\nmay be carried out by operational supervisors and\n\nmanagers.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Develop and\nimplement staff\nrosters\n1.1 Rosters are\ndeveloped in\naccordance with\ncompany\nagreements and\nwage budgets.\n1.2 Operational efficiency\nand customer service\nlevels are maximized\nwhile wage costs are\nminimized in roster\ndevelopment.\n1.3 Duties are combined\nwhere appropriate to\nensure effective use\nof staff.\n1.4 The available skills\nbase is utilized\nappropriately to roster\nthe most effective mix\nof staff and to meet\ndifferent operational\nrequirements.\n1.5 Rosters are\npresented in required\nformats to ensure\nclarity of information\nin accordance with\ncompany standards.\n1.6 Rosters are\ncommunicated to\nappropriate\ncolleagues within\ndesignated timelines.\n1.1 Effective\ncommunication\n1.2 Role of rosters and\ntheir importance in\ncontrolling staff\ncosts\n1.3 Factors to be\nconsidered when\ndeveloping rosters\n1.4 Formats for the\npresentation of staff\nrosters and details\nto be included\n1.5 Area of operation for\nwhich roster is being\ndeveloped\n1.6 Company standards\n1.7 Customer Service\n\n1.1 Communicatio\nns skills\n1.2 Developing\nrosters\n1.3 Organizing\ninformation\n1.4 Preparing staff\nrosters\n\n--- PDF PAGE 65 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Maintain staff\n records\n2.1 Time sheets and other\ndocumentation are\ncompleted accurately\nand within designated\ntimelines\n2.2 Staff records are\nupdated accurately\nand maintained or\nstored in accordance\nwith establishment\nprocedures\n2.1 Effective\ncommunication\n2.2 Area of operation for\nwhich roster is being\ndeveloped\n2.3 Records\nmanagement\n\n2.1 Communications\nskills\n2.2 Updating and\nmaintaining\nrecords\n\n--- PDF PAGE 66 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 62\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Rosters\nMay include:\n1.1 An individual department\n1.2 A whole establishment\n1.3 A specific project\n2. Company agreements\nMay include:\n2.1 Number of hours worked in a given shift\n2.2 Overall number of hours allocated to different staff\nmembers\n2.3 Breaks between shifts\n2.4 Nature of duties allocated\n2.5 Use of permanent or casual staff\n\n--- PDF PAGE 67 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 63\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of the\nfactors and issues which impact upon staff rostering\n1.2 Demonstrated familiarity with typical formats and\nthe key information to be included\n1.3 Demonstrated the ability to prepare staff rosters\nwhich meet wage budgets and which provide a level\nof staffing sufficient to ensure the delivery of high\nquality customer service.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Project or work activities which allow the candidate\nto prepare rosters for a workplace and to evaluate\ntheir cost efficiency and operational effectiveness\nagainst nominated standards\n2.2 Preparation of more than one roster to meet the\nstaffing requirements of more than one operational\nsituation\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Evaluation of the staffing costs and observing\nservice levels at an event for which the candidate\nhas prepared rosters\n3.2 Oral or written questions to assess knowledge of\nspecific factors which affect the design of rosters\n3.3 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 68 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 64\nUNIT OF COMPETENCY\n: CONTROL AND ORDER STOCK\n\nUNIT CODE\n : TRS141205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, behavior and\nmotivations required to control and order stock in a\nrange of hospitality establishments. This role is\ngenerally carried out by supervisors and team leaders.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Maintain stock\nlevels and\nrecords\n1.1 Stock levels are\nmonitored and\nmaintained\naccording to\ncompany\nrequirements\n1.2 Stock security is\nmonitored and\nsystems are\nadjusted as required\n1.3 Stock reorder cycles\nare monitored and\nadjusted as\nrequired.\n1.4 Colleagues are\ninformed of their\nindividual\nresponsibilities in\nregard to the\nreordering of stock.\n1.5 Records of stock\nstorage and\nmovement are\nmaintained in\naccordance with\ncompany\nprocedures\n1.6 Stock performance\nis monitored and\nfast/slow-selling\nitems are identified\nand reported in\naccordance with\ncompany\nprocedures\n1.1 Stock level\nmaintenance\ntechniques\n1.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n1.3 Stock recording\nsystems\n1.4 Stock security\nsystems\n1.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n1.6 Reasons for stock\nloss and damage\n1.7 Company\nprocedures\n1.1 Collect, organize\nand analyze\ninformation\n1.2 Plan and\norganize\nactivities\n1.3 Monitoring stock\nperformance\n\n--- PDF PAGE 69 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 65\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Process stock\norders\n2.1 Orders for stock are\nprocessed\naccurately and in\naccordance with\ncompany\nprocedures\n2.2 Stock levels are\nmaintained and\nrecorded ensuring\ninformation is\ncomplete, correct\nand current\n2.3 Incoming stock is\nchecked against\npurchase and supply\nagreements and all\nnecessary details\nare recorded.\n2.1 Stock level\nmaintenance\ntechniques\n2.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n2.3 Stock recording\nsystems\n2.4 Stock security\nsystems\n2.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n2.6 Reasons for stock\nloss and damage\n2.7 Company\nprocedures\n2.1 Collect, organize\nand analyze\ninformation\n2.2 Plan and\norganize\nactivities\n2.3 Monitoring stock\nperformance\n\n3. Minimize stock\nlosses\n3.1 Stock losses are\nidentified and\nrecorded according\nto company\nprocedures.\n3.2 Losses are reported\nin accordance with\ncompany\nprocedures\n3.3 Avoidable losses are\nidentified and\nreasons behind\nthese losses are\nestablished\n3.4 Solutions to loss\nsituations are\nrecommended and\nrelated procedures\nare implemented to\nprevent future\navoidable losses.\n3.1 Stock level\nmaintenance\ntechniques\n3.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n3.3 Stock recording\nsystems\n3.4 Stock security\nsystems\n3.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n3.6 Reasons for stock\nloss and damage\n3.7 Company\nprocedures\n3.1 Collect, organize\nand analyze\ninformation\n3.2 Plan and\norganize\nactivities\n3.3 Identifying stock\nlosses\n\n4. Follow-up orders\n4.1 The delivery process\nis monitored to\nensure agreed\ndeadlines are met\n4.2 Continuity of supply\nis ensured by liaising\nwith colleagues and\nsuppliers\n4.1 Stock level\nmaintenance\ntechniques\n4.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n4.3 Stock recording\n4.1 Collect, organize\nand analyze\ninformation\n4.2 Plan and\norganize\nactivities\n4.3 Monitoring\ndelivery process\n\n--- PDF PAGE 70 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 66\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4.3 Routine supply\nproblems are\nfollowed up or\nreferred to the\nappropriate person\nin accordance with\ncompany policy.\n4.4 Stock is distributed\nto agreed locations\nsystems\n4.4 Stock security\nsystems\n4.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n4.6 Reasons for stock\nloss and damage\n4.7 Company\nprocedures\n\n5. Organize and\nadminister\nstocks\n5.1 Stocks are\norganized at\nappropriate intervals\naccording to\ncompany policy and\nprocedures\n5.2 Stocktaking\nresponsibilities are\nallocated to staff\n5.3 Accurate stock\nreports are produced\nwithin designated\ntimelines\n5.1 Stock level\nmaintenance\ntechniques\n5.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n5.3 Stock recording\nsystems\n5.4 Stock security\nsystems\n5.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n5.6 Reasons for stock\nloss and damage\n5.7 Company\nprocedures\n\n5.1 Collect, organize\nand analyze\ninformation\n5.2 Plan and\norganize\nactivities\n5.3 Monitoring\ndelivery process\n5.4 Organizing\nstocks\n\n--- PDF PAGE 71 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 67\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include:\n1.1 Food\n1.2 Beverages\n1.3 Equipment such as maintenance and cleaning\nequipment, office equipment\n1.4 Linen\n1.5 Stationery\n1.6 Brochures and promotional materials\n1.7 Cleaning supplies and chemicals\n1.8 Vouchers and tickets\n1.9 Souvenir products\n2. Stock losses\nMay include:\n2.1 Lack of rotation leading to product deterioration\n2.2 Inappropriate storage conditions\n2.3 Access by pests or vermin\n2.4 Theft\n2.5 Overstocking\n\n--- PDF PAGE 72 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 68\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to maintain continuous stock\nsupply within a specific hospitality industry\nenvironment\n1.2 Demonstrated the ability to meet accuracy and speed\nrequirements for completion and maintenance of\nstock records\n2. Resource Implications\nThe following resources should be provided:\n2.1 Project or work activities that allow the candidate to\ndemonstrate stock control and monitoring over a\nperiod of time\n2.2 Use of real stock items\n2.3 Use of industry-current stock control technology or\ndocumentation\n2.4 Involvement of internal/external suppliers\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Review of activities undertaken by the candidate to\nmonitor stock for a given period of time for a specific\noutlet i.e. order and re-order points\n3.2 Written or oral questions to test knowledge of reasons\nfor procedures\n3.3 Review of workplace reports and records related to\nstock control, prepared by the candidate\n3.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 73 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 69\nUNIT OF COMPETENCY\n: PREPARE AND DELIVER TRAINING SESSIONS\n\nUNIT CODE\n : TRS141206\n\nUNIT DESCRIPTOR : This unit deals with skills and knowledge required to\nprepare and deliver in-house training sessions in a\nrange of settings within the hospitality industry\nworkplace context.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Determine\ntraining\nrequirements\n\n1.1 Current competencies of\nlearners are identified\n1.2 Required competencies\nfor learners are identified\n1.3 The training gap for\nlearners are described\n1.4 The identified training gap\nwith relevant personnel\nare confirmed\n1.5 Support available for\ntraining provision are\ndetermined\n1.6 Recommendations for\ntraining are presented\n1.1 Active listening\ntechniques\n1.2 Record keeping\n1.3 Assessment process\n1.4 Enterprise’s policies\nand procedures\n1.5 Appropriate\nperformance\nassessment\n\n1.1 Questioning\nand\ncommunication\nskills\n1.2 Research skills\n1.3 Analytical skills\n1.4 Ability to\nresearch\nindustry\ninformation\nsources\n1.5 Identifying\nrelevant\ninformation\n1.6 Compilation\nand\nclassification of\ninformation and\ndata\n1.7 Networking\nskills\n2. Prepare\ntraining plan\n\n2.1 Session outlines for\napproved training are\ndeveloped\n2.2 Training content are\ndeveloped\n2.3 Training resources and\nmaterials are developed\n2.4 Individual training\nsessions are developed\n2.5 Training requirements are\norganized\n2.1 Active listening\ntechniques\n2.2 Record keeping\n2.3 Assessment process\n2.4 Enterprise’s policies\nand procedures\n2.5 Appropriate\nperformance\nassessment\n\n2.1 Questioning\nand\ncommunication\nskills\n2.2 Research skills\n2.3 Analytical skills\n2.4 Ability to\nresearch\nindustry\ninformation\nsources\n2.5 Identifying\nrelevant\ninformation\n2.6 Compilation\nand\nclassification of\ninformation and\ndata\n2.7 Networking\nskills\n\n--- PDF PAGE 74 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 70\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Deliver\ntraining\nsessions\n\n3.1 Attendance of learners at\nthe training session is\nconfirmed\n3.2 The training venue for the\ntraining session is\nprepared.\n3.3 Training topic to learners\nis introduced.\n3.4 The training and\nassessment activities\ninvolved in the training\nsession is explained.\n3.5 Training session is\npresented.\n3.6 Opportunities for learners\nto practice skills are\nprovided\n3.7 Feedback to learners is\nprovided\n3.8 On-going safety of learners\nduring training delivery and\npractice is ensured\n3.1 Active listening\ntechniques\n3.2 Record keeping\n3.3 Assessment\n3.4 process\n3.5 Enterprise’s\npolicies and\nprocedures\n3.6 Appropriate\nperformance\nassessment\n\n3.1 Questioning\nand\ncommunication\nskills\n3.2 Research skills\n3.3 Analytical skills\n3.4 Ability to\nresearch\nindustry\ninformation\nsources\n3.5 Identifying\nrelevant\ninformation\n3.6 Compilation\nand\nclassification of\ninformation and\ndata\n3.7 Networking\nskills\n\n--- PDF PAGE 75 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 71\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Current competencies of\nlearners\nMay include:\n1.1 Observing workers’ practices\n1.2 Undertaking peer reviews\n1.3 Administering self-evaluation and analysis forms to\nworkers\n1.4 Reviewing data contained in workplace staff\nperformance systems/databases\n1.5 Reviewing application forms and resumes\n1.6 Seeking input from managers, supervisors and co-\nworkers\n1.7 Obtaining feedback from customers\n1.8 Checking currency of qualifications, certificates and\nlicenses\n1.9 Identifying individual learner preferences for training\ndelivery\n1.10 Assessing the level of literacy and numeracy amongst\nthe target group\n2. Required competencies\nMay include:\n2.1 Reviewing relevant training programs\n2.2 Verifying plans for the business\n2.3 Reviewing relevant policies and procedures\n2.4 Reviewing existing job analysis sheets and similar\n2.5 Describing performance standards\n2.6 Specifying product and service criteria\n2.7 Describing the workplace context, including the\nconditions under which tasks are to be completed\n3. Training gap\nMay include:\n3.1 Specifying the difference between organizational\nexpectations of staff/learner performance and the\nactual level of workplace performance for each\nworker/learner\n3.2 Confirming identified training gaps with individual\nstaff/learners\n4. Relevant personnel\n\nMay include:\n4.1 Supervisors, managers and owners\n4.2 Industry peak bodies\n4.3 Subject specialists\n4.4 Head office\n4.5 Union representatives\n4.6 Human resources department\n4.7 Staff/learners\n4.8 Trainers and assessors\n4.9 External consultants\n\n--- PDF PAGE 76 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 72\n\nVARIABLE\nRANGE\n5. Support available for\ntraining provision\n\nMay include:\n5.1 Time\n5.2 Physical resources\n5.3 Human resources\n5.4 Financial resources\n5.5 Training venues\n5.6 Training resources and materials\n5.7 Management support for the initiative\n5.8 Established internal career paths based on internal\ntraining delivery\n6. Recommendations\nMay include:\n6.1 Providing verbal and/or written presentations\n6.2 Explaining the need for training\n6.3 Quantifying costs associated with failing to address\ntraining needs\n6.4 Describing the benefits that will flow from undertaking\ntraining\n6.5 Identifying the assessment to be applied\n6.6 Quantifying the costs associated with training delivery\n6.7 Seeking approval and support from management and\nothers\n7. Session outlines\nMay include:\n7.1 Confirming general content and/or topic areas that\nneed to be addressed in sessions that may be group\nsessions or one-on-one sessions, and focus on\ntheory, or demonstration, or both\n7.2 Locating training content and/or topics in the correct\nsequence\n7.3 Allocating timeframes for training content and/or\ntopics\n7.4 Describing the objectives and outcomes for individual\ntraining sessions\n7.5 Seeking input from subject and workplace specialists\nto training content and/or topics\n7.6 Obtaining approval from relevant personnel for\nproposed training sessions\n7.7 Confirming resources exist to support proposed\ntraining sessions\n8. Training content\n\n8.1 May include:\n8.2 Ensuring accuracy of proposed content\n8.3 Ensuring comprehensiveness of proposed content\n8.4 Ensuring compliance with legislated requirements\nrelating to proposed content\n8.5 Verifying sequence of proposed content\n8.6 Complying with the requirements of mandated or\nselected training documentation, including training\ncurricula, competency standards, job analysis, etc\n8.7 Identifying topics and sub-topics for training delivery\n8.8 Identifying relevant sources of information for\n\n--- PDF PAGE 77 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 73\nVARIABLE\nRANGE\nassistance with training preparation and delivery,\nincluding internal and external sources\n8.9 Identifying the underpinning attitudes, skills and\nknowledge for each area of proposed content\n8.10 Identifying and/or confirming specific workplace\nneeds, including description of the context for all\nproposed training\n8.11 Mapping training content against identified\ncompetencies required by staff/learners\n8.12 Emphasizing workplace safety at all stages of training\ndelivery and in all training content\n9. Training resources and\nmaterials\n\nMay include:\n9.1 Matching training resources and materials against\nidentified workplace need\n9.2 Identifying specific materials and resources, including\nmanuals, texts, work books, workshop guides,\nhandouts, standard operating procedures, posters,\nvideos, sample items, demonstration items\n9.3 Ensuring currency and relevance of existing materials\nfor future application\n9.4 Purchasing ready-made generic training materials\nand resources\n9.5 Preparing establishment-specific training materials\nand resources to address identified workplace need\n9.6 Ensuring training materials and resources reflect\nidentified individual differences, including learning\nstyle preferences, literacy and numeracy\nrequirements, language requirements\n9.7 Accommodating imposed limitations on the\ndevelopment and acquisition of training resources\nand materials\n9.8 Seeking input from workplace specialists, other\ntrainers, training organizations and past workplace\nstaff/learners\n9.9 Reviewing evaluations that have been conducted on\nprevious training and integrating relevant lessons into\nproposed training\n10. Individual training\nsessions\n\nMay include:\n10.1 Preparing sessions for individuals and groups\n10.2 Assembling identified and agreed training content\ninto training programs, where appropriate\n10.3 Identifying the dates and timing for individual training\nsessions, including start and finish times, and\nsupplementary training provision\n10.4 Identifying and accommodating requirements for\npractice sessions to enable skills development,-\nincluding on-the-job and off-the job practice, provision\nof supplementary and top-up training, where required,\nand job rotation, work-sharing, out-of-work\nplacements\n\n--- PDF PAGE 78 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 74\nVARIABLE\nRANGE\n10.5 Identifying and allowing for necessary workplace\nassessment, including identification of forms of\nassessment to be used, development of assessment\ntools, where necessary, and allocation of time to\nenable required on-the-job, off-the-job and\nsupplementary assessments to be conducted\n10.6 Determining venues for training delivery, including on-\nsite and off-site\n10.7 Identifying training strategies and techniques to be\nused to deliver identified content, including oral\npresentations, simulations, project work,\ndemonstrations, field trips, guest speakers, role plays,\ninterviews, surveys, portfolios of evidence, mentoring,\ncoaching, computer-based training, self-paced\nlearning, lectures, discussion\n10.8 Identifying equipment, materials, items and\nconsumables required to enable identified training\ndelivery, including sufficient hand-outs required for\nthe identified number of learners\n10.9 Ensuring training sessions enable attainment of\nidentified objectives and outcomes\n10.10 Developing session/delivery plans for individual\ntraining sessions\n10.11 Matching training materials and resources to\ncontent of individual training sessions\n10.12 Ensuring total training program accommodates\nidentified need for all learners for each training\ntopic/area\n10.13 Factoring in the need to accommodate individual\ndifferences, where practicable to do so.\n11. Training requirements\n\nMay include:\n11.1 Obtaining promised financial and other resources to\nsupport training implementation/delivery\n11.2 Obtaining identified training materials and resources\n11.3 Promoting training sessions internally to\nstaff/learners, including use of management to\nencourage participation and engagement with training\n11.4 Obtaining necessary equipment and consumables to\nsupport training delivery\n11.5 Arranging for identified external training support to be\navailable, such as guest speakers, government\nofficials, trainers, assessors, subject experts\n11.6 Preparing hard copy training support materials, such\nas notes, exercises, presentations, etc\n11.7 Recording details of learners wishing to participate in\ntraining\n11.8 Being accountable for time and money spent on the\npreparation of training and the purchase of materials,\netc\n11.9 Readying the training venue for training\n\n--- PDF PAGE 79 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 75\nVARIABLE\nRANGE\n11.10 Meeting with supervisors to explain the proposed\nworkplace training, including soliciting their\ncooperation in relation to releasing staff for training,\nand offering assistance for maintaining necessary\nworkplace staffing levels during training periods\n11.11 Arranging access to identified areas, equipment, etc\nfor training and/or assessment, including\ndemonstrations and practice\n11.12 Ensuring safety of the equipment and venue to be\nused for training and/or assessment purposes,\nincluding understanding of the emergency\nmanagement plan that applies to the training\nvenue/area, and presence of required safety and\nfirst aid equipment\n11.13 Identifying criteria for determining training\neffectiveness\n11.14 Establishing guidelines for training plan\nimplementation, including dissemination and\nexplanation of guidelines to trainers and relevant\nother people\n12. Attendance of learners\n\nMay include:\n12.1 Reminding identified learners of the time and venue\nof the training session\n12.2 Liaising with supervisors to obtain release of learners\nfrom work duties\n12.3 Encouraging learners to attend\n12.4 Seeking assistance from support staff to record\nnames of learners who will be attending\n12.5 Asking management to encourage staff/learner\nparticipation\n13. Training venue\n\nMay include:\n13.1 Cleaning and tidying the venue\n13.2 Ensuring all required equipment, etc is available\n13.3 Checking the operational readiness and safety of\nequipment, etc\n13.4 Testing all training delivery items, such as overheads,\nprojectors, computers, etc\n13.5 Adjusting the environment to make it comfortable for\nlearners\n13.6 Obtaining catering, where applicable\n13.7 Obtaining and laying out all training resources and\nmaterials, including consumables\n13.8 Arranging the furniture to optimize the identified\noutcomes and objectives of the training session\n\n--- PDF PAGE 80 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 76\nVARIABLE\nRANGE\n15. Training topic\n\nMay include:\n15.1 Explaining the need for the training\n15.2 Motivating learners\n15.3 Selling the benefits to learners of successfully\ncompleting the training\n15.4 Illustrating points with industry examples and\nreferences\n15.5 Identifying the intended outcomes of the training\nsession for individual learners, the department and\nthe organization\n15.6 Explain how this training session integrates with other\ntraining, where applicable\n15.7 Identifying the consequences of failing to achieve the\nrequired level of competency for the training topic\n15.8 Explaining the opportunities for practice that have\nbeen arranged\n15.9 Describing the assessment procedures, where\napplicable\n15.10 Identifying any relevant time frames that apply to\nthe learning and attainment of competency\n15.11 Providing an overview of the training\n16. Training and assessment\nactivities\n\nMay include:\n16.1 Explaining time restrictions that apply to both training\nand assessment\n16.2 Identifying the level of competency required\n16.3 Matching proposed activities with individual learning\nsegments\n16.4 Explaining any allowable adjustments that may be\nable to be made to both training delivery and\nassessment activities\n16.5 Confirming training and assessment dates/times and\nvenues\n16.6 Explaining the composition of assessment, including\ntheory and practical; on-the-job and off-the-job; verbal\nand written assessment; sources of valid evidence\nthat can be used to judge competency, etc.\n17. Training session\nMay include:\n17.1 Adhering to the prepared training/delivery plan,\nincluding coverage of content/objectives, and\nimplementation of activities\n17.2 Altering training delivery to accommodate individual\nlearner differences/needs as they arise\n17.3 Applying task and maintenance functions of\nleadership\n17.4 Making on-the-spot training decisions\n17.5 Monitoring learning activities, learners, the training\nvenue and relationships between learners and others\n\n--- PDF PAGE 81 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 77\nVARIABLE\nRANGE\n\n17.6 Applying contingency management, where necessary\n17.7 Responding to requests from learners, where\nappropriate\n17.8 Ensuring the pace of the training aligns with the\ndelivery plan\n17.9 Encouraging learners and maintaining a safe and\nsupportive learning environment\n17.10 Intervening and addressing safety issues and\ninterpersonal conflict situations\n17.11 Adjusting the prepared delivery plan to effectively\naccommodate issues arising during the training\nsession\n17.12 Applying appropriate interpersonal skills to facilitate\nthe learning process\n17.13 Using effective verbal communication skills to deliver\ntraining, provide supplementary information, and\nmonitor the training session\n17.14 Providing extension activities to learners, as\nappropriate\n18. Opportunities for learners May include:\n18.1 Opportunities to practice during the training sessions\n18.2 Opportunities to practice in a dedicated\ntraining/practice area out of work\n18.3 Provision of supervised on-the-job opportunities,\nincluding supervision by trainers, supervisors, and\nother senior/experienced staff\n18.4 Integration of on-the-job and off-the-job practice\nopportunities\n19. Feedback to learners\n\nMay include:\n19.1 Ensuing feedback is provided sensitively\n19.2 Using positive feedback to motivate and encourage\nlearners\n19.3 Recognizing effort and not just success\n19.4 Providing negative feedback using the positive-\nnegative-positive sandwich methods\n19.5 Being sincere in the giving of feedback\n19.6 Being open as a trainer to feedback from learners\n19.7 Using verbal and non-verbal techniques to provide\nfeedback\n\n--- PDF PAGE 82 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 78\n EVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated understanding of host enterprise policies and\nprocedures in regard to the provision of workplace training\ndelivery and assessment\n1.2 Demonstrated ability to investigate and effectively determine\nthe training requirements for a nominated group of workers in\na defined workplace context\n1.3 Demonstrated ability to prepare an effective and practical\ntraining/delivery plan to address a nominated training\ntopic/area in a given workplace context for a defined group of\nat least six learners; the training/delivery plan\n1.4 Demonstrated ability to deliver a nominated training session to\nidentified learners in a given workplace training context\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Real or simulated workplace\n2.2 Access to workplace standards, procedures, policies,\nguidelines\n2.3 Tools and equipment.\n3. Methods of\n Assessment\nCompetency in this unit may be assessed through:\n3.1 Observation of practical candidate performance Oral and\nwritten questions\n3.2 Portfolio evidence, including data on learner competencies,\ntraining needs, training standards and documents relating to\nsession/delivery plan, and training resources/materials\ndeveloped\n3.3 Problem solving\n3.4 Role plays\n3.5 Third party reports completed by a supervisor\n3.6 Project and assignment work\n4. Context for\n Assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 83 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 79\nUNIT OF COMPETENCY\n: PLAN, CONDUCT AND EVALUATE STAFF\n PERFORMANCE ASSESSMENT\n\nUNIT CODE\n : TRS141207\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to plan, conduct and evaluate a staff\nperformance assessment within an organization that\nutilizes formal staff appraisals in a range of settings\nwithin the labor divisions of the hospitality industry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Plan a staff\nperformance\nassessment\n1.1 The context for staff\nperformance\nassessment for the\nbusiness is defined\n1.2 Staff performance\nassessment options\navailable to the\norganization is\ndifferentiated\n1.3 Staff performance\nassessment information\namongst staff who will be\nassessed is shared\n1.4 The initial focus of the\nstaff performance\nassessment for each\nstaff member is\ndetermined\n1.5 Documents to record\nidentified staff\nperformance\nassessment statistics\nand performance data is\nprepared\n1.6 Action plan to guide the\nconduct of staff\nperformance assessment\nis designed\n1.1 Active listening\ntechniques\n1.2 Record keeping\n1.3 Assessment\nprocess\n1.4 Enterprise’s\npolicies and\nprocedures\n1.5 Appropriate\nperformance\nassessment\n\n1.1 Questioning and\ncommunication\nskills\n1.2 Research skills\n1.3 Analytical skills\n1.4 Ability to\nresearch\nindustry\ninformation\nsources\n1.5 Identifying\nrelevant\ninformation\n1.6 Compilation and\nclassification of\ninformation and\ndata\n1.7 Networking skills\n\n2. Conduct a staff\nperformance\nassessment\n2.1 Workplace-based\nevidence of staff\nperformance is gathered\n2.2 Employee performance\ndata is interpreted\n2.1 Active listening\ntechniques\n2.2 Record keeping\n2.3 Assessment\nprocess\n2.4 Enterprise’s\npolicies and\nprocedures\n2.5 Appropriate\nperformance\nassessment\n2.1 Questioning and\ncommunication\nskills\n2.2 Research skills\n2.3 Analytical skills\n2.4 Ability to\nresearch\nindustry\ninformation\nsources\n\n--- PDF PAGE 84 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 80\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n2.5 Identifying\nrelevant\ninformation\n2.6 Compilation and\nclassification of\ninformation and\ndata\n2.7 Networking skills\n3. Evaluate a staff\nperformance\nassessment\n3.1 Staff performance\nassessment interview is\nprepared\n3.2 Individual staff\nperformance with staff\nmember is reviewed\n3.3 Staff performance\nassessment targets for\nnext period is prepared\n3.1 Active listening\ntechniques\n3.2 Record keeping\n3.3 Assessment\nprocess\n3.4 Enterprise’s\npolicies and\nprocedures\n3.5 Appropriate\nperformance\nassessment\n\n3.1 Questioning and\ncommunication\nskills\n3.2 Research skills\n3.3 Analytical skills\n3.4 Ability to\nresearch\nindustry\ninformation\nsources\n3.5 Identifying\nrelevant\ninformation\n3.6 Compilation and\nclassification of\ninformation and\ndata\n3.7 Networking skills\n\n--- PDF PAGE 85 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 81\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Context for staff performance\nassessment\n\nMay include:\n1.1 aligning individual staff performance with\norganizational and/or departmental goals and\nobjectives as stated in the business and other\nrelevant operational plans\n1.2 optimizing individual staff potential\n1.3 identifying workplace performance goals for\nindividual staff\n1.4 cross-referencing individual staff performance\nagainst general workplace needs, including\nrequirements of rosters, levels of trade,\nidiosyncratic workplace requirements\n1.5 integrating requirements of individual staff\nperformance with internal staff training\n2. Staff performance\nassessment options\n\nMay include:\n2.1 criterion referenced measurement\n2.2 self-assessment\n2.3 peer assessment\n2.4 manager/owner observation\n2.5 statistical analysis\n2.6 rating scale methods\n2.7 ranking or comparison methods\n2.8 commercially available proprietary systems.\n3. Staff performance\nassessment information\nMay include:\n3.1 mentioning organization-wide staff performance\nassessment at all interviews conducted for new\nstaff\n3.2 including mention of staff performance\nassessment in regular staff activities, including\ninternal training, briefings, meetings, etc\n3.3 explaining that the staff performance\nassessment process applies to all employees\nwithin the business, including supervisors,\nmanagers, etc\n3.4 explaining that the staff performance\nassessment process is on-going and cyclical in\nnature\n3.5 talking to individual staff, including one-on-one\nbasis to:\na. determine the focus of the staff performance\nassessment for the up-coming period\nb. explaining the support available for staff\nc. re-assuring staff that jobs are not threatened\nby the staff performance assessment\nprocess\nd. confirm that all staff, including management,\nare subject to staff performance assessment\n\n--- PDF PAGE 86 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 82\n\nVARIABLE\nRANGE\n\n3.6 notifying staff well in advance of any meetings\nand special events relating to staff performance\nassessments\n3.7 using experienced/senior staff to assist in\nselling the benefits’ of staff performance\nassessments to new staff\n3.8 developing individual staff performance\nassessment deed/workplace contract, setting\nout the agreement between employee and\nsupervisor exactly what will be assessed and\nhow it will be adjudged during the identified\nperiod in terms of targeted staff performance\n4. Initial focus of the staff\nperformance assessment\n\nMay include:\n4.1 understanding that future staff performance\nassessment deed/workplace contracts will flow\nfrom the results of the initial staff performance\nassessment\n4.2 identifying legitimate and equitable targets for\nthe staff member, including negotiation of these\ntargets and genuine agreement on what will\ncount as practical and objective targets\n4.3 ensuring staff understand the criteria that will be\nused to judge their workplace performance,\nincluding specification and description of Key\nPerformance Indicators (KPIs), performance\ntargets, etc\n4.4 getting staff to sign their copy of the staff\nperformance assessment deed/workplace\ncontract\n4.5 filing a copy of each staff performance\nassessment deed/workplace contract\n4.6 giving individual staff members a copy of the\npaperwork associated with their agreed\nindividual deed/workplace contract\n5. Documents to record\nidentified staff performance\nassessment statistics and\nperformance data\nMay include:\n5.1 performance checklists\n5.2 data collection forms\n\n6. Action plan\nMay include:\n6.1 identifying resources to support individual staff\nperformance assessments\n6.2 identifying timelines for individual staff\nperformance assessments, including dates and\nhours required for training and other necessary\npre-requisite information to be learned, informal\nstaff assessment interviews/meetings,\nmentoring, external training, as appropriate\n\n--- PDF PAGE 87 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 83\nVARIABLE\nRANGE\n\n6.3 identifying personnel responsible for activities\ncontained in the plan\n6.4 identifying activities to be used during the\nidentified staff performance assessment period\n6.5 obtaining agreement from individual staff that\ntheir staff performance assessment\ndeed/workplace contract contains legitimate\nand achievable goals and timelines\n\n7. Workplace-based evidence\n\nMay include:\n7.1 implementing the individual and agreed action\nplans for individual staff\n7.2 ensuring informal elements of workplace\nperformance are included in the capturing of the\nformal workplace information\n7.3 using prepared forms to ensure the identified\ndata is captured\n7.4 using multiple sources of data collection to\nensure 360º information is obtained\n7.5 ensuring objectivity in data collection\n7.6 involving relevant others in the data gathering\nprocess\n8. Employee performance data\nMay include:\n8.1 determining patterns within the data\n8.2 identifying strengths and weaknesses of\nindividual staff\n8.3 making decisions and developing conclusions\nbased on the objective data captured\n8.4 seeking supporting information to validate\nconclusions reached\n8.5 disregarding irrelevant data\n8.6 comparing actual performance data against\nspecified and identified targets and statistics\n8.7 maintaining privacy and confidentiality of\ninformation captured\n9. Staff performance\nassessment interview\n\nMay include:\n9.1 developing a plan on how to conduct the staff\nperformance assessment interview\n9.2 ensuring familiarity with the facts that relate to\nthe individual staff performance assessment,\nincluding the captured data, the key\nperformance indicators (KPIs) contained in the\nrelevant staff performance assessment\ndeed/workplace contract\n9.3 determining the context of the staff performance\nassessment deed/workplace contract, including\nidentification of the need for encouragement,\ncongratulations, extension, disciplinary action\netc\n\n--- PDF PAGE 88 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 84\nVARIABLE\nRANGE\n9.4 Identifying specific supporting evidence to be\nused in illustrating points that need to be made\nduring the interview\n9.5 Identifying future courses of action that may be\ntaken for the staff member during their next staff\nperformance assessment period\n9.6 preparing recommendations to make to\nindividual staff\n9.7 Identifying a location and time for the\nevaluation/staff performance assessment\ninterview, including the venue so that it\nfacilitates a positive interaction between staff\nmember and supervisor\n10. Individual staff performance\n\nMay include:\n10.1 meeting privately with individual staff member\n10.2 reviewing the objectives set out in the\nindividual staff performance assessment\ndeed/workplace contract for the period\n10.3 reminding the staff member of the cyclical\nnature of the staff performance assessment\nprocess\n10.4 explaining the data, facts, statistics that have\nbeen captured in relation to the identified\ntargets for the period in question\n10.5 explaining interpretation of facts and statistics\n10.6 providing opportunity for the staff member to\nmake input and comment on the\ninformation/data provided\n10.7 congratulating the staff member on positive\noutcomes\n10.8 encouraging staff member where performance\nhas fallen short of the identified key\nperformance criteria (KPIs) set for the period,\nwhere appropriate\n10.9 counseling staff member where it is deemed\nactual staff performance has fallen short of\nagreed criteria/ key performance criteria (KPIs)\ndue to lack of application, including supportive\nmention of disciplinary action that may follow if\nperformance does not improve to the minimum\nrequired level\n10.10 offering support of the organization and the\nstaff for staff to achieve the required\nperformance standards and targets\n11. Staff performance\nassessment targets\nMay include:\n11.1 extending current targets\n11.2 introducing a new focus for the period,\nincluding inclusion of new key performance\ncriteria (KPIs) as opposed to revised key\nperformance criteria (KPIs)\n\n--- PDF PAGE 89 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 85\nVARIABLE\nRANGE\n11.3 determining timelines that should apply to the\ntargets/ key performance criteria (KPIs)\n11.4 identifying support and resources to assist in\nachieving the targets/ key performance criteria\n(KPIs)\n11.5 obtaining agreement from the staff member\nregarding the revised/new goals, support and\ntimelines\n11.6 signing the new staff performance assessment\ndeed/workplace contract for the period\n11.7 giving staff member signed copy of the staff\nperformance assessment deed/workplace\ncontract\n11.8 filing the staff performance assessment\ndeed/workplace contract\n\n--- PDF PAGE 90 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 86\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated understanding of host enterprise policies and\nprocedures in regard to staff performance assessment and\nstaff development\n1.1 Demonstrated ability to plan the staff performance\nassessment focus for a nominated real or simulated staff\nmember in a designated workplace environment for a given\nperiod\n1.2 Demonstrated ability to collect, analyze and draw\nconclusions from information and data captured as a result\nof a nominated staff performance assessment for a given\nperiod\n1.3 Demonstrated ability to conduct an evaluation and feedback\nsession/interview with a nominated real or simulated staff\nmember in relation to a designated set of key performance\ncriteria (KPIs) matched against a nominated set of key\nperformance criteria (KPIs)\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Access to a real or simulated workplace; and\n2.2 Access to workplace standards, procedures, policies,\nguidelines,\n2.3 Tools and equipment\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Case studies\n3.2 Observation of practical candidate performance\n3.3 Oral and written questions\n3.4 Portfolio evidence\n3.5 Problem solving\n3.6 Role plays\n3.7 Third party reports completed by a supervisor\n3.8 Project and assignment work\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 91 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 87\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\n SUPERVISE ROOM CLEANING AND\n\nMAINTENANCE REQUIREMENT\n\nUNIT CODE\n :\nTRS515301\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\n\nrequired to conduct the monitoring, supervision and\n\nassessment of assigned housekeeping tasks.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Monitor\nhousekeeping\nrequirement\nprocedures and\nresources\n\n1.1 Use of Personal\nProtective\nEquipment (PPE) is\nmonitored in\ncompliance with\nOccupational Safety\nand Health\nStandards\n1.2 External\nregulations are\ncomplied with\naccording to industry\nstandards\n1.3 Tools, equipment\nand supplies are\ncontrolled according\nto housekeeping\nprocedures\n1.4 Accidents, injuries,\nand unsafe work\nconditions are\nresponded in\naccordance with\nestablishment\nprocedures\n1.5 Incidents reports are\nstored and\nmaintained\n1.1 Workplace\nprocedures for\nhousekeeping\n1.2 Documentation\nnecessary for\ncompliance with\ncurrent regulatory\nguidelines\n1.3 Documentation and\nidentification of\nrisks management\n1.4 Tools and\nequipment usage\nand maintenance\n1.5 Basic Occupational\nSafety and Health\n(BOSH)\n1.6 Green Practices\n1.1 Identifying and\ncorrecting unsafe\nwork procedures\nor conditions\n1.2 Documentation\nskills\n1.3 Reporting and\nrectifying the non-\ncompliance to the\nregulations\n1.4 Analytical and\nEvaluative skills\n1.5 Applying HACCP\n1.6 Effective\nCommunication\n1.7 Applying BOSH\n1.8 Applying green\npractices\n\n--- PDF PAGE 92 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 88\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Monitor\ncleanliness and\nsafety in the\nworkplace\n2.1 Continuous\nmonitoring of the\ncleanliness and\nsafety of the\nworkplace is done\n2.2 Housekeeping issues\nare raised with\ndesignated personnel\nin accordance with\nworkplace\nprocedures\n2.3 Maintenance and\nstorage of tools,\nequipment and\nsupplies are\nmonitored in\naccordance with\nworkplace standards\n2.4 Records are stored\nand maintained\n2.5 Emergency\nManagement Plan is\nreviewed periodically\n\n2.1 Workflow and\nspecial cleaning\nprojects\n2.2 Workplace\nprocedures and\npolicies for carrying\nout housekeeping\ntasks in the\nworkplace\n2.3 Servicing\nprocedures for\nhousekeeping\nequipment\n2.4 Basic Occupational\nSafety and Health\n(BOSH)\n2.5 Hazard Analysis\nCritical Control\nPoint (HACCP)\n2.6 Green Practices\n\n2.1 Inspection with\nattention to details\n2.2 Documentation\nskills\n2.3 Monitoring skills\n2.4 Analytical and\nevaluative skills\n2.5 Applying HACCP\n2.6 Applying BOSH\n2.7 Applying green\npractices\n3. Assess and\nevaluate\nassigned tasks\n3.1 Risk assessment\nactivities are\nscheduled and\napplied based on\nindustry standards\n3.2 Safe workplace is\nensured to protect the\nworkers’ safety\n3.3 Effectiveness of the\nsystems are reviewed\nand assessed\naccording to\nworkplace standards\n3.4 Necessary\nimprovements are\nimplemented\n3.5 Compliance with\nlegislations and\ninternal requirements\nare maintained\n3.1 Workflow and\nspecial cleaning\nprojects\n3.2 Workplace\nprocedures and\npolicies for carrying\nout housekeeping\ntasks in the\nworkplace\n3.3 Servicing\nprocedures for\nhousekeeping\nequipment\n3.4 Basic Occupational\nSafety and Health\n(BOSH)\n3.5 Hazard Analysis\nCritical Control\nPoint (HACCP)\n3.6 Green Practices\n3.1 Inspection with\nattention to details\n3.2 Documentation\nskills\n3.3 Monitoring skills\n3.4 Analytical and\nevaluative skills\n3.5 Applying HACCP\n3.6 Applying BOSH\n3.7 Applying green\npractices\n\n--- PDF PAGE 93 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 89\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. External regulations\nMay include:\n1.1 Fire Department\n1.2 LGU\n1.3 DENR\n1.4 HACCP\n1.5 OSH\n1.6 DOLE-BWC\n2. Tools, equipment and\nsupplies\nMay include:\n2.1 Tools:\no Squeegee\no Spatula\no Broom and Dustpan\no Carpet Sweeper\no Mop\n2.2 Equipment\no Vacuum Cleaner\no Floor Polisher\no Extractor Machine\no Shampooing machine\n2.3 Supplies\no Rugs\no Cleaning Chemicals\no Polish\n\n3. Risk Assessment Activities\nMay include:\n3.1 Liaising with others\n3.2 Conducting research activities and\nliterature\n3.3 Undertaking tests\n3.4 Visiting other sites\n3.5 Consulting with staff and management\n3.6 Using external consultants\n3.7 Considering controls available within the\nhierarchy of controls\n3.8 Costing different viable control options\n\n--- PDF PAGE 94 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 90\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidences that the candidate:\n1.1 Complied with external regulations\n1.2 Controlled tools, equipment and supplies according to\nhousekeeping procedures\n1.3 Responded to reports of accidents, injuries, and unsafe\nwork conditions to appropriate department\n1.4 Monitored continuously the maintenance of cleanliness\nand safety of workplace\n1.5 Maintained the compliance with legislation and internal\nrequirements\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Establishment’s policies and procedures\n2.2 Basic Occupational Safety and Health (BOSH)\n2.3 Hazard Analysis Critical Control Point (HACCP)\n2.4 Green Practices\n2.5 Housekeeping forms\n2.6 Simulated workplace\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio\n\n4. Context of\nAssessment\n4.1 Competency assessment may occur in workplace or any\nsimulated environment/assessment center accredited by\nTESDA\n\n--- PDF PAGE 95 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 91\nUNIT OF COMPETENCY : SUPERVISE HOUSEKEEPING SERVICES TO\nGUESTS\n\n UNIT CODE\n:\n TRS515302\n\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and attitudes\nrequired\nto\nsupervise\na\nrange\nof\ngeneral\nhousekeeping\nservices\nto\nguests.\nIt\nincludes\nregulatory\nrequirements,\nplans\nand\nstandard\noperating procedures and the current practices in the\nindustry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Monitor\nhousekeeping\nteam\n1.1 Team’s understanding\nof regulatory\nrequirements,\nincluding health and\nsafety are assured\n1.2 Housekeeping\nstandard operational\nprocedures (SOPs)\nare followed\n1.3 Waste management\nand disposal are\nimplemented\naccording to\nworkplace standards\n1.4 Use of Personal\nProtective Equipment\n(PPE) is monitored\naccordingly\n\n1.1 Standards operational\npolicies and\nprocedures\n1.2 Updates on internal\nsystems and\nprocesses\n1.3 Basic Occupational\nSafety and Health\n(BOSH)\n1.4 Hazard Analysis\nCritical Control Point\n(HACCP)\n1.5 Green practices\n\n1.1 Effective\ncommunication\nskills\n1.2 Analytical and\nevaluative skills\n1.3 Applying HACCP\n1.4 Applying BOSH\n1.5 Applying green\npractices\n\n2. Update current\npractices in\nhousekeeping\n2.1 Trends and practices\nin the housekeeping\nindustry are observed\n2.2 Occupational safety\nand health practices\nare implemented in\nthe workplace\n2.3 Sources of\ninformation on\nissues affecting the\nhospitality industry\nare obtained\n2.4 Updated industry\nknowledge and\ninformation to daily\noperation are applied\n2.1 Current practices in\nhousekeeping\n2.2 Basic Occupational\nSafety and Health\n(BOSH)\n2.3 Hazard Analysis\nCritical Control Point\n(HACCP)\n2.4 Green practices\n\n2.1 Information\ntechnology skills\n2.2 Applying HACCP\n2.3 Applying BOSH\n2.4 Applying green\npractices\n\n--- PDF PAGE 96 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 92\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Evaluate\nhousekeeping\nteam’s\nperformance\nvs.\norganizational\nstandards\n3.1 Team’s daily\nperformance is\nmeasured against the\norganizational\nstandards\n3.2 Room allocation per\nday is evaluated\naccording to\nhousekeepers’\nperformance\n3.3 Roster staffing is\nmonitored vs the\nperformance\nefficiency, type of\nroom and the front\noffice information for\nexpected time of\narrival and expected\ntime of departure\n3.4 Guests feedback are\nreviewed\n3.1 Key result Areas\n(KRA)\n3.2 Key Performance\nIndicators (KPI)\n3.3 Basic arithmetic\n3.4 Room status reports\n\n3.1 Computer\nliteracy\n3.2 Mathematical\nskills\n3.3 Forecasting skills\n\n4. Monitor usage\nof tools,\nequipment and\nsupplies\n4.1 Inventory of tools,\nequipment and\nsupplies are verified\nbased on Standards\nOperating\nprocedures.\n4.2 Preventive\nmaintenance of tools\nand equipment are\nscheduled as\nrequired\n4.3 Inventory and\npreventive\nmaintenance results\nare submitted\n4.4 Turn down service is\nevaluated as to\ncleanliness and good\nscent of room\n4.1 Inventory Control\nand Maintenance\n4.2 Tools and\nEquipment manuals\n4.3 Basic Occupational\nSafety and Health\n(BOSH)\n4.4 Hazard Analysis\nCritical Control Point\n(HACCP)\n4.5 Green practices\n\n4.1 Preparing reports\nMathematical skills\n4.2 Analytical and\nevaluative skills\n4.3 Tools and\nequipment\noperation skills\n4.4 Applying HACCP\n4.5 Applying BOSH\n4.6 Applying green\npractices\n\n--- PDF PAGE 97 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 93\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Sources of information\nMay include:\n1.1 Basic Occupational Safety and Health\n(BOSH)\n1.2 Hazard Analysis Critical Control Point\n(HACCP)\n1.3 ASEAN MRA-TP\n1.4 Green Practices\n1.5 GAD\n1.6 Sustainable Development Goals\n\n2. Type of room\nMay include:\n2.1 Twin bed room\n2.2 Suite Room\n2.3 Room with kitchenette\n2.4 Other types of room\n3. Tools, equipment and supplies\nMay include:\n3.1 Tools:\no Squeegee\no Spatula\no Broom and Dustpan\no Carpet Sweeper\no Mop\n3.2 Equipment\no Vacuum Cleaner\no Floor Polisher\no Extractor Machine\no Shampooing machine\no Carpet\no CCTV\no Fittings\no Folding machine/automatic folder\no Furnishings\no Housekeeping trolley\n3.3 Supplies\no Rugs\no Cleaning Chemicals\no Linens\no Duvet\no Deodorizer\no Disinfectant\n\n--- PDF PAGE 98 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 94\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Applied regulatory requirements, including Health & Safety,\nBOSH, HACCP and green practices\n1.2 Analyzed KRAs and KPIs\n1.3 Conducted inventory control\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Access to workplace documentation and actual workplace\n2.2 Access to a suitable venue for simulated situations\n2.3 Cooperation of other parties\n2.4 Media\n2.5 Text books, reference books\n2.6 Trade magazine and journals\n2.7 Publications and newsletters from suppliers\n2.8 Industry and trade seminars, meetings and conferences\n2.9 Internet research\n\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio\n\n4. Context of\nAssessment\n4.1 Competency assessment may occur in workplace or any\nsimulated environment/assessment center accredited by\nTESDA\n\n--- PDF PAGE 99 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 95\nUNIT OF COMPETENCY: IMPLEMENT LOST AND FOUND PROCEDURES\n\n UNIT CODE\n:\n TRS515303\n\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and attitudes\n\nrequired to implement lost and found procedures in an\n\naccommodation facility. It includes the monitoring of\n\nsafekeeping of unclaimed and the release of claimed,\n\nunclaimed lost and found items.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Monitor lost\nand found\nfacility\n1.1 Lost and found facility\nare checked\n1.2 In-house lost and found\npolicies and procedures\nare implemented\n1.3 Storage area of lost\nand found items are\nregularly inspected\n1.4 Legal requirements\nthat apply to lost and\nfound facilities are\nchecked\n1.1 Standards operational\npolicies and\nprocedures\n1.2 HACCP\n1.3 Disposition of lost and\nfound items\n1.4 Inventory of Lost and\nFound Items\n1.5 Updates on systems\nand processes\n1.6 Green Practices\n1.1 Effective\ncommunication\nskills\n1.2 Analytical and\nevaluative skills\n1.3 Applying policies\nand procedures\n1.4 Applying legal\nrequirements\n1.5 Applying HACCP\n2. Deal with\nlost and\nfound items\n2.1 Valuable, non-valuable\nand perishable items\nare checked and\nmonitored for appropriate\naction\n2.2 Recorded lost and found\nitems are monitored as to\nsafety and necessary\naction.\n2.3 Inventory of lost and\nfound items are\nperiodically checked.\n2.1 Standards operational\npolicies and\nprocedures\n2.2 General knowledge\nabout OHS\n2.3 Updates on systems\nand processes\n\n2.1 Communication\nskills including\nreceiving\nfeedback and\nreporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n2.2 Reporting skills to\nprocess\ninformation\n2.3 Coordination skills\n3. Deal with\nclaims for\nlost and\nfound items\n3.1 Queries as to legal\nownership of the lost and\nfound items are\nfacilitated.\n3.2 Proper verification of\nownership of property\nbeing claimed is\nsupervised.\n3.3 Identification cards\npresented are validated.\n3.4 Authorization of the\nrepresentative to claim\nthe lost and found items\nis checked.\n3.1 Standards operational\npolicies and\nprocedures\n3.2 Communicating lost\nitems\n3.3 General knowledge\nabout OHS\n3.4 Updates on systems\nand processes\n\n3.1 Program\ndesigning skills\n3.2 Planning and\nconsultative\nprocesses in\nprogram\ndevelopment\n3.3 Communication\nskills including\nreceiving\nfeedback and\nreporting,\nmaintaining\neffective\n\n--- PDF PAGE 100 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 96\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n3.5 Lost and found registry\nare monitored as to\ncompleteness of report.\n\nrelationships and\nconflict\nmanagement\n3.4 Customer service\nskills\n4. Deal with\nunclaimed\nitems\n4.1 Established policies and\nprocedures on\nunclaimed lost and found\nitems are monitored as to\ncompliance.\n4.2 Inventory of unclaimed\nlost and found items in\nstorage are periodically\nchecked.\n4.3 Claims and release of\nlost and found items are\nmonitored in accordance\nwith policies and\nstandards.\n4.1 Standards operational\npolicies and\nprocedures\n4.2 General knowledge\nabout OHS\n4.3 Compute for value of\nitems\n4.4 Updates on systems\nand processes\n4.1 Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n4.2 Customer service\nskills\n\n--- PDF PAGE 101 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 97\n RANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Lost and found items\nMay include:\n1.1 Valuable\n1.2 Non-valuable\n1.3 Unsafe\n1.4 Illegal\n2. Legal requirements\nMay include:\n2.1 Duty of care\n2.2 Bailment (security given to a property)\n\n3. Valuable, Non-valuable and\nPerishable\nMay include:\n3.1 Jewelries\n3.2 Currency\n3.3 Personal Gadgets\n3.4 Guest Clothes and belongings\n3.5 Important Documents\n3.6 Food stuff\n4. Policies and procedures\nMay include:\n4.1 Storage holding period\n4.2 Follow up procedures\n4.3 Policy on finder’s