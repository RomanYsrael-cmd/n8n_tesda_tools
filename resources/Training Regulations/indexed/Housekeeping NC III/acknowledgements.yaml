    },
    {
      "source_text": "Closed Circuit Television 3. Chemical"
    },
    {
      "source_text": "A product, normally in liquid form, used to clean a surface/for laundry 4. Clean 5. Computer Literate"
    },
    {
      "source_text": "6. Computer Room/Laboratory"
    },
    {
      "source_text": "Free from dirt, dust and any foreign matters Is defined as the knowledge and ability to utilize computers and related technology efficiently, with a range of skills covering levels from elementary use to computer programming and advanced problem solving. This area has an array of computer units where trainees are provided to learn and gain appropriate IT competencies as may be prescribe in the competency standard and curriculum. Computer units are in a LAN environment holed to an ISP for internet access. 7. Condemning linen 8. Contextual Learning Removal of worn out or damaged linen from circulation this facility ensures that the underpinning knowledge, the science, mathematics and communication principles as applied to the technology are provided to the trainee. 9. Deodorizer A product used to absorb odour and any unpleasant smell 10. Disinfectant"
    },
    {
      "source_text": "11. Distance Learning Area Any chemical agent used to destroy the growth of harmful organisms This is to enable the learning provision outside and away from the training institution in term of print and non-print media. 12. Dry Cleaning The process of cleaning of delicate garments, fabrics, etc., with the use of chemicals rather than water 13. Duvet A set of quilt usually down-filled used for bed making 14. Emergency Management Plan A document detailing the response of the venue/staff members when a variety of emergency situations arise 15. External regulations Referring to policies and guidelines issued by related government agencies 16. ETA"
    },
    {
      "source_text": "Estimated time of arrival 17. ETD"
    },
    {
      "source_text": "Estimated time of departure 18. Extraction equipment The equipment used for the removal of moisture from linens by way of high speed rotations 19. Fittings Anything attached to a ceiling wall or floor to house a room equipment 20. Folding Machine or Automatic Folder The machine which folds linen in a pre-determined way 21. Formula"
    },
    {
      "source_text": "The combination of water, temperature and chemicals to successfully launder different categories of linen 22. Furnishings"
    },
    {
      "source_text": "Movable items of furniture in a guest room, such as chairs and tables 23. HACCP Hazard Analysis Critical Control Point 24. Kitchenette A small kitchen or part of another room equipped with kitchen tools"
    },
