 laundry\nitems of establishment\n1.7 Guest clothes\n1.8 Staff roles\n1.9 Laundry Costing\n1.10\nLaundry services\n1.11\nGreen practices\n1.1 Applying BOSH /\nHACCP\n1.2 Check\naccompanying\ndocumentation\n1.3 Determining staff\npotential for\nlaundry\nassignment\n1.4 Evaluating laundry\ncosting\n1.5 Evaluation of\nequipment working\ncondition\n\n2. Monitor laundry\nprocedures\n2.1 Receiving and\nchecking of picked-up\nguest clothes are\nsupervised in\naccordance with\nenterprise\nrequirements\n2.2 Received used in-\nhouse items are\nevaluated\n2.3 Segregation of guest\nclothes and linens are\ninsured\n2.4 Application of\nappropriate procedure\nfor specific guest\nclothes and linens are\nmonitored\n2.5 Appropriate formula\n2.1 BOSH and HACCP\n2.2 Laundry Forms\n2.3 In-house linens and\nuniforms\n2.4 Establishment\nlaundry procedures\n2.5 Laundry tools,\nequipment and\nchemicals\n2.6 Type of stains and\nappropriate treatment\n2.7 Green practices\n2.1 Applying BOSH /\nHACCP\n2.2 Demonstrated\nability to\nsupervise laundry\nprocedures\n2.3 Use of specific\nlaundry tools,\nequipment and\nchemicals\n2.4 Spot check of\nstains\n\n--- PDF PAGE 104 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 100\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n2.6 application for washing\nclothes and linen are\nsupervised\n2.7 Laundered items with\nunremoved stains are\nmonitored for\nappropriate treatment\n2.8 Worn out or damaged\nlinen condemnation are\nsupervised.\n2.9 Staff use of laundry\ntools, equipment and\nsupplies are monitored\nparticularly for safety\nand maintenance\n2.10 Removal of lint on\nguest clothes are\nchecked\nDelivered linen from\noutsource laundry are\nevaluated\n\n3. Supervise the\ncosting,\npackaging and\ndelivery of\nlaundered\nitems\n\n3.1 Costing of laundered\nguest clothes are\nverified\n3.2 Packaging of laundered\nitems are monitored\n3.3 On time delivery of\nlaundered items are\nensured\n3.1 BOSH and HACCP\n3.2 Establishment\nstandard costing and\npackaging\n3.3 Guest clothes delivery\nprocedures\n3.4 Green practices\n3.1 Applying BOSH /\nHACCP\n3.2 Applying\nmathematical skill\nfor costing\n3.3 Checking\nestablishment\nstandard for\npackaging\nprocedure\n3.4 Monitoring\nschedule for\nlaundry delivery\n\n4. Supervise\nlaundry facility\nmaintenance\n4.1 Post-cleaning laundry\nactivities are monitored\n4.2 Laundry tools and\nequipment are checked\nas to cleanliness,\nworking condition of\nequipment and storage\n4.3 Dry cleaning procedure\nis checked as to use of\nchemical\n4.3 Daily internal laundry\nreports are evaluated\n\n4.1 BOSH and HACCP\n4.2 Tools and equipment\nmanuals\n4.3 Calibration of laundry\nfacility\n4.4 Green practices\n\n4.1 Applying BOSH /\nHACCP\n4.2 Interpreting tools\nand equipment\nmanuals\n4.3 Applying skill for\n“attention to\ndetails”\n4.4 Filing internal\nlaundry report\n\n--- PDF PAGE 105 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 101\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Laundry tools, equipment and\nsupplies\nMay include:\nTools:\n1.1 Basin\n1.2 Pail\n1.3 Buckets\n1.4 Laundry brush (soft and hard)\n1.5 Laundry gloves\n1.6 Sorting Baskets/laundry Baskets\n1.7\nEquipment:\n1.8 Washing machine\n1.9 Drying cleaning machine\n1.10\nSteam presser\n1.11\nFlat iron\n1.12\nIroning board\n1.13\nSorting shelves\n1.14\nExtraction equipment\nChemicals:\n1.15\nFabric softener\n1.16\nLiquid laundry detergent\n1.17\nStain remover\n1.18\nBleaching detergent\n\n2. Daily internal laundry reports\nMay include:\n2.1 Soiled linens from rooms\n2.2 Soiled linen from F & B\n2.3 Soiled uniform\n2.4 Guest clothes\n2.5 Curtains & draperies\n2.6 Other laundry items\n2.7 Damages & stained items\n\n--- PDF PAGE 106 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 102\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to correctly identify the process\nrequired for different types of laundry\n1.2\nDemonstrated ability to operate laundry equipment\nsafely\n1.3\nDemonstrated ability to complete the full laundering\nprocess\n\n2. Resource Implications\nThe following resources MUST be provided\n2.1\nVariety of linen, clothing items and fabrics\n2.2\nIndustry laundry equipment\n2.3\nLaundry Chemicals/ Solutions\n\n3. Methods of\nAssessment\nCompetency in this unit may or must be assessed through\n3.1\nDemonstration with Oral questioning\n3.2\nPortfolio\n\n4. Context of Assessment 4.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n4.2\nAssessment activities are carried out in TESDA’s\naccredited assessment center\n\n--- PDF PAGE 107 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 103\nSECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for HOUSEKEEPING NC III.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: HOUSEKEEPING NC Level: III\n\nNominal Training Duration: 40 Hours (Basic)\n\n 96 Hours (Common)\n\n 64 Hours (Core)\n\n 200 Hours\n\n + 64 Hours - Supervised Industry Learning (SIL)\n\n 264 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, and attitudes in\naccordance with industry standards. This covers competencies that a person\nmust achieve in performing tasks such as supervising room cleaning and\nmaintenance requirement, housekeeping services to guests, laundry guests’\nclothes and lines as well as implementing lost and found procedures.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieved.\n\n--- PDF PAGE 108 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 104\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead\nworkplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan\nsetting\n• Read\no Effective verbal communication\nmethods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Read\n• Effec