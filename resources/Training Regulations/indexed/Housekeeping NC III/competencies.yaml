        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidences that the candidate:\n1.1 Complied with external regulations\n1.2 Controlled tools, equipment and supplies according to\nhousekeeping procedures\n1.3 Responded to reports of accidents, injuries, and unsafe\nwork conditions to appropriate department\n1.4 Monitored continuously the maintenance of cleanliness\nand safety of workplace\n1.5 Maintained the compliance with legislation and internal\nrequirements\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Establishment’s policies and procedures\n2.2 Basic Occupational Safety and Health (BOSH)\n2.3 Hazard Analysis Critical Control Point (HACCP)\n2.4 Green Practices\n2.5 Housekeeping forms\n2.6 Simulated workplace\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio\n\n4. Context of\nAssessment\n4.1 Competency assessment may occur in workplace or any\nsimulated environment/assessment center accredited by\nTESDA\n\n--- PDF PAGE 95 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 91\nUNIT OF COMPETENCY : SUPERVISE HOUSEKEEPING SERVICES TO\nGUESTS\n\n UNIT CODE\n:"
        },
        "source_text": "TRS515301\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\n\nrequired to conduct the monitoring, supervision and\n\nassessment of assigned housekeeping tasks.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Monitor\nhousekeeping\nrequirement\nprocedures and\nresources\n\n1.1 Use of Personal\nProtective\nEquipment (PPE) is\nmonitored in\ncompliance with\nOccupational Safety\nand Health\nStandards\n1.2 External\nregulations are\ncomplied with\naccording to industry\nstandards\n1.3 Tools, equipment\nand supplies are\ncontrolled according\nto housekeeping\nprocedures\n1.4 Accidents, injuries,\nand unsafe work\nconditions are\nresponded in\naccordance with\nestablishment\nprocedures\n1.5 Incidents reports are\nstored and\nmaintained\n1.1 Workplace\nprocedures for\nhousekeeping\n1.2 Documentation\nnecessary for\ncompliance with\ncurrent regulatory\nguidelines\n1.3 Documentation and\nidentification of\nrisks management\n1.4 Tools and\nequipment usage\nand maintenance\n1.5 Basic Occupational\nSafety and Health\n(BOSH)\n1.6 Green Practices\n1.1 Identifying and\ncorrecting unsafe\nwork procedures\nor conditions\n1.2 Documentation\nskills\n1.3 Reporting and\nrectifying the non-\ncompliance to the\nregulations\n1.4 Analytical and\nEvaluative skills\n1.5 Applying HACCP\n1.6 Effective\nCommunication\n1.7 Applying BOSH\n1.8 Applying green\npractices\n\n--- PDF PAGE 92 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 88\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Monitor\ncleanliness and\nsafety in the\nworkplace\n2.1 Continuous\nmonitoring of the\ncleanliness and\nsafety of the\nworkplace is done\n2.2 Housekeeping issues\nare raised with\ndesignated personnel\nin accordance with\nworkplace\nprocedures\n2.3 Maintenance and\nstorage of tools,\nequipment and\nsupplies are\nmonitored in\naccordance with\nworkplace standards\n2.4 Records are stored\nand maintained\n2.5 Emergency\nManagement Plan is\nreviewed periodically\n\n2.1 Workflow and\nspecial cleaning\nprojects\n2.2 Workplace\nprocedures and\npolicies for carrying\nout housekeeping\ntasks in the\nworkplace\n2.3 Servicing\nprocedures for\nhousekeeping\nequipment\n2.4 Basic Occupational\nSafety and Health\n(BOSH)\n2.5 Hazard Analysis\nCritical Control\nPoint (HACCP)\n2.6 Green Practices\n\n2.1 Inspection with\nattention to details\n2.2 Documentation\nskills\n2.3 Monitoring skills\n2.4 Analytical and\nevaluative skills\n2.5 Applying HACCP\n2.6 Applying BOSH\n2.7 Applying green\npractices\n3. Assess and\nevaluate\nassigned tasks\n3.1 Risk assessment\nactivities are\nscheduled and\napplied based on\nindustry standards\n3.2 Safe workplace is\nensured to protect the\nworkers’ safety\n3.3 Effectiveness of the\nsystems are reviewed\nand assessed\naccording to\nworkplace standards\n3.4 Necessary\nimprovements are\nimplemented\n3.5 Compliance with\nlegislations and\ninternal requirements\nare maintained\n3.1 Workflow and\nspecial cleaning\nprojects\n3.2 Workplace\nprocedures and\npolicies for carrying\nout housekeeping\ntasks in the\nworkplace\n3.3 Servicing\nprocedures for\nhousekeeping\nequipment\n3.4 Basic Occupational\nSafety and Health\n(BOSH)\n3.5 Hazard Analysis\nCritical Control\nPoint (HACCP)\n3.6 Green Practices\n3.1 Inspection with\nattention to details\n3.2 Documentation\nskills\n3.3 Monitoring skills\n3.4 Analytical and\nevaluative skills\n3.5 Applying HACCP\n3.6 Applying BOSH\n3.7 Applying green\npractices\n\n--- PDF PAGE 93 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 89\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. External regulations\nMay include:\n1.1 Fire Department\n1.2 LGU\n1.3 DENR\n1.4 HACCP\n1.5 OSH\n1.6 DOLE-BWC\n2. Tools, equipment and\nsupplies\nMay include:\n2.1 Tools:\no Squeegee\no Spatula\no Broom and Dustpan\no Carpet Sweeper\no Mop\n2.2 Equipment\no Vacuum Cleaner\no Floor Polisher\no Extractor Machine\no Shampooing machine\n2.3 Supplies\no Rugs\no Cleaning Chemicals\no Polish\n\n3. Risk Assessment Activities\nMay include:\n3.1 Liaising with others\n3.2 Conducting research activities and\nliterature\n3.3 Undertaking tests\n3.4 Visiting other sites\n3.5 Consulting with staff and management\n3.6 Using external consultants\n3.7 Considering controls available within the\nhierarchy of controls\n3.8 Costing different viable control options\n\n--- PDF PAGE 94 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 90\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidences that the candidate:\n1.1 Complied with external regulations\n1.2 Controlled tools, equipment and supplies according to\nhousekeeping procedures\n1.3 Responded to reports of accidents, injuries, and unsafe\nwork conditions to appropriate department\n1.4 Monitored continuously the maintenance of cleanliness\nand safety of workplace\n1.5 Maintained the compliance with legislation and internal\nrequirements\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Establishment’s policies and procedures\n2.2 Basic Occupational Safety and Health (BOSH)\n2.3 Hazard Analysis Critical Control Point (HACCP)\n2.4 Green Practices\n2.5 Housekeeping forms\n2.6 Simulated workplace\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio\n\n4. Context of\nAssessment\n4.1 Competency assessment may occur in workplace or any\nsimulated environment/assessment center accredited by\nTESDA\n\n--- PDF PAGE 95 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 91\nUNIT OF COMPETENCY : SUPERVISE HOUSEKEEPING SERVICES TO\nGUESTS\n\n UNIT CODE\n:"
