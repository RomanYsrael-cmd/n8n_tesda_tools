          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Used technical information systems and information\ntechnology\n1.2 Applied information technology (IT) systems\n1.3 Edited, formatted and checked information\n\n2. Resource Implications The following resources MUST be provided:\n2.1. Computers\n2.2. Software and IT system\n\n3. Methods of\nAssessment\nCompetency in this unit MUST be assessed through:\n3.1. Direct Observation\n3.2. Oral interview and written test\n\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 35 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 31\nUNIT OF COMPETENCY :\nEVALUATE OCCUPATIONAL SAFETY AND\nHEALTH WORK PRACTICES\nUNIT CODE :"
