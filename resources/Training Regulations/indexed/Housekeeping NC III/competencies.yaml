        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge and understanding of the \nfactors and issues which impact upon staff rostering \n1.2 Demonstrated familiarity with typical formats and \nthe key information to be included \n1.3 Demonstrated the ability to prepare staff rosters \nwhich meet wage budgets and which provide a level \nof staffing sufficient to ensure the delivery of high \nquality customer service. \n2. Resource   Implications \nThe following resources should be provided: \n2.1 Project or work activities which allow the candidate \nto prepare rosters for a workplace and to evaluate \ntheir cost efficiency and operational effectiveness \nagainst nominated standards \n2.2 Preparation of more than one roster to meet the \nstaffing requirements of more than one operational \nsituation \n3. Methods of  Assessment \nCompetency in this unit may be assessed through: \n3.1 Evaluation of the staffing costs and observing \nservice levels at an event for which the candidate \nhas prepared rosters \n3.2 Oral or written questions to assess knowledge of \nspecific factors which affect the design of rosters \n3.3   Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate \n4. Context  for Assessment \n4.1  Competency may be assessed in actual workplace \nor  at the designated TESDA Accredited \nAssessment Center.",
