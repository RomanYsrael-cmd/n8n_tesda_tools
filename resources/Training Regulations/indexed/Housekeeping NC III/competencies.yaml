        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of the\nfactors and issues which impact upon staff rostering\n1.2 Demonstrated familiarity with typical formats and\nthe key information to be included\n1.3 Demonstrated the ability to prepare staff rosters\nwhich meet wage budgets and which provide a level\nof staffing sufficient to ensure the delivery of high\nquality customer service.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Project or work activities which allow the candidate\nto prepare rosters for a workplace and to evaluate\ntheir cost efficiency and operational effectiveness\nagainst nominated standards\n2.2 Preparation of more than one roster to meet the\nstaffing requirements of more than one operational\nsituation\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Evaluation of the staffing costs and observing\nservice levels at an event for which the candidate\nhas prepared rosters\n3.2 Oral or written questions to assess knowledge of\nspecific factors which affect the design of rosters\n3.3 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 68 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 64\nUNIT OF COMPETENCY\n: CONTROL AND ORDER STOCK\n\nUNIT CODE\n :"
        },
        "source_text": "TRS141204\n\n UNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, behavior and\n\nmotivations required to develop staff rosters. This role\n\nmay be carried out by operational supervisors and\n\nmanagers.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Develop and\nimplement staff\nrosters\n1.1 Rosters are\ndeveloped in\naccordance with\ncompany\nagreements and\nwage budgets.\n1.2 Operational efficiency\nand customer service\nlevels are maximized\nwhile wage costs are\nminimized in roster\ndevelopment.\n1.3 Duties are combined\nwhere appropriate to\nensure effective use\nof staff.\n1.4 The available skills\nbase is utilized\nappropriately to roster\nthe most effective mix\nof staff and to meet\ndifferent operational\nrequirements.\n1.5 Rosters are\npresented in required\nformats to ensure\nclarity of information\nin accordance with\ncompany standards.\n1.6 Rosters are\ncommunicated to\nappropriate\ncolleagues within\ndesignated timelines.\n1.1 Effective\ncommunication\n1.2 Role of rosters and\ntheir importance in\ncontrolling staff\ncosts\n1.3 Factors to be\nconsidered when\ndeveloping rosters\n1.4 Formats for the\npresentation of staff\nrosters and details\nto be included\n1.5 Area of operation for\nwhich roster is being\ndeveloped\n1.6 Company standards\n1.7 Customer Service\n\n1.1 Communicatio\nns skills\n1.2 Developing\nrosters\n1.3 Organizing\ninformation\n1.4 Preparing staff\nrosters\n\n--- PDF PAGE 65 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Maintain staff\n records\n2.1 Time sheets and other\ndocumentation are\ncompleted accurately\nand within designated\ntimelines\n2.2 Staff records are\nupdated accurately\nand maintained or\nstored in accordance\nwith establishment\nprocedures\n2.1 Effective\ncommunication\n2.2 Area of operation for\nwhich roster is being\ndeveloped\n2.3 Records\nmanagement\n\n2.1 Communications\nskills\n2.2 Updating and\nmaintaining\nrecords\n\n--- PDF PAGE 66 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 62\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Rosters\nMay include:\n1.1 An individual department\n1.2 A whole establishment\n1.3 A specific project\n2. Company agreements\nMay include:\n2.1 Number of hours worked in a given shift\n2.2 Overall number of hours allocated to different staff\nmembers\n2.3 Breaks between shifts\n2.4 Nature of duties allocated\n2.5 Use of permanent or casual staff\n\n--- PDF PAGE 67 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 63\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of the\nfactors and issues which impact upon staff rostering\n1.2 Demonstrated familiarity with typical formats and\nthe key information to be included\n1.3 Demonstrated the ability to prepare staff rosters\nwhich meet wage budgets and which provide a level\nof staffing sufficient to ensure the delivery of high\nquality customer service.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Project or work activities which allow the candidate\nto prepare rosters for a workplace and to evaluate\ntheir cost efficiency and operational effectiveness\nagainst nominated standards\n2.2 Preparation of more than one roster to meet the\nstaffing requirements of more than one operational\nsituation\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Evaluation of the staffing costs and observing\nservice levels at an event for which the candidate\nhas prepared rosters\n3.2 Oral or written questions to assess knowledge of\nspecific factors which affect the design of rosters\n3.3 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 68 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 64\nUNIT OF COMPETENCY\n: CONTROL AND ORDER STOCK\n\nUNIT CODE\n :"
