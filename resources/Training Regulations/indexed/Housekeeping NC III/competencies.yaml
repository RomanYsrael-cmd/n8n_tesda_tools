        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to maintain continuous stock\nsupply within a specific hospitality industry\nenvironment\n1.2 Demonstrated the ability to meet accuracy and speed\nrequirements for completion and maintenance of\nstock records\n2. Resource Implications\nThe following resources should be provided:\n2.1 Project or work activities that allow the candidate to\ndemonstrate stock control and monitoring over a\nperiod of time\n2.2 Use of real stock items\n2.3 Use of industry-current stock control technology or\ndocumentation\n2.4 Involvement of internal/external suppliers\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Review of activities undertaken by the candidate to\nmonitor stock for a given period of time for a specific\noutlet i.e. order and re-order points\n3.2 Written or oral questions to test knowledge of reasons\nfor procedures\n3.3 Review of workplace reports and records related to\nstock control, prepared by the candidate\n3.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 73 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 69\nUNIT OF COMPETENCY\n: PREPARE AND DELIVER TRAINING SESSIONS\n\nUNIT CODE\n :"
        },
        "source_text": "TRS141205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, behavior and\nmotivations required to control and order stock in a\nrange of hospitality establishments. This role is\ngenerally carried out by supervisors and team leaders.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Maintain stock\nlevels and\nrecords\n1.1 Stock levels are\nmonitored and\nmaintained\naccording to\ncompany\nrequirements\n1.2 Stock security is\nmonitored and\nsystems are\nadjusted as required\n1.3 Stock reorder cycles\nare monitored and\nadjusted as\nrequired.\n1.4 Colleagues are\ninformed of their\nindividual\nresponsibilities in\nregard to the\nreordering of stock.\n1.5 Records of stock\nstorage and\nmovement are\nmaintained in\naccordance with\ncompany\nprocedures\n1.6 Stock performance\nis monitored and\nfast/slow-selling\nitems are identified\nand reported in\naccordance with\ncompany\nprocedures\n1.1 Stock level\nmaintenance\ntechniques\n1.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n1.3 Stock recording\nsystems\n1.4 Stock security\nsystems\n1.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n1.6 Reasons for stock\nloss and damage\n1.7 Company\nprocedures\n1.1 Collect, organize\nand analyze\ninformation\n1.2 Plan and\norganize\nactivities\n1.3 Monitoring stock\nperformance\n\n--- PDF PAGE 69 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 65\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Process stock\norders\n2.1 Orders for stock are\nprocessed\naccurately and in\naccordance with\ncompany\nprocedures\n2.2 Stock levels are\nmaintained and\nrecorded ensuring\ninformation is\ncomplete, correct\nand current\n2.3 Incoming stock is\nchecked against\npurchase and supply\nagreements and all\nnecessary details\nare recorded.\n2.1 Stock level\nmaintenance\ntechniques\n2.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n2.3 Stock recording\nsystems\n2.4 Stock security\nsystems\n2.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n2.6 Reasons for stock\nloss and damage\n2.7 Company\nprocedures\n2.1 Collect, organize\nand analyze\ninformation\n2.2 Plan and\norganize\nactivities\n2.3 Monitoring stock\nperformance\n\n3. Minimize stock\nlosses\n3.1 Stock losses are\nidentified and\nrecorded according\nto company\nprocedures.\n3.2 Losses are reported\nin accordance with\ncompany\nprocedures\n3.3 Avoidable losses are\nidentified and\nreasons behind\nthese losses are\nestablished\n3.4 Solutions to loss\nsituations are\nrecommended and\nrelated procedures\nare implemented to\nprevent future\navoidable losses.\n3.1 Stock level\nmaintenance\ntechniques\n3.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n3.3 Stock recording\nsystems\n3.4 Stock security\nsystems\n3.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n3.6 Reasons for stock\nloss and damage\n3.7 Company\nprocedures\n3.1 Collect, organize\nand analyze\ninformation\n3.2 Plan and\norganize\nactivities\n3.3 Identifying stock\nlosses\n\n4. Follow-up orders\n4.1 The delivery process\nis monitored to\nensure agreed\ndeadlines are met\n4.2 Continuity of supply\nis ensured by liaising\nwith colleagues and\nsuppliers\n4.1 Stock level\nmaintenance\ntechniques\n4.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n4.3 Stock recording\n4.1 Collect, organize\nand analyze\ninformation\n4.2 Plan and\norganize\nactivities\n4.3 Monitoring\ndelivery process\n\n--- PDF PAGE 70 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 66\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and italicized\nterms are elaborated in\nthe\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4.3 Routine supply\nproblems are\nfollowed up or\nreferred to the\nappropriate person\nin accordance with\ncompany policy.\n4.4 Stock is distributed\nto agreed locations\nsystems\n4.4 Stock security\nsystems\n4.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n4.6 Reasons for stock\nloss and damage\n4.7 Company\nprocedures\n\n5. Organize and\nadminister\nstocks\n5.1 Stocks are\norganized at\nappropriate intervals\naccording to\ncompany policy and\nprocedures\n5.2 Stocktaking\nresponsibilities are\nallocated to staff\n5.3 Accurate stock\nreports are produced\nwithin designated\ntimelines\n5.1 Stock level\nmaintenance\ntechniques\n5.2 Typical stocktaking\nprocedures as\nappropriate to the\nindustry sector\n5.3 Stock recording\nsystems\n5.4 Stock security\nsystems\n5.5 Types of stock\ncontrol\ndocumentation and\nsystems that may be\napplied in the\nhospitality industry\n5.6 Reasons for stock\nloss and damage\n5.7 Company\nprocedures\n\n5.1 Collect, organize\nand analyze\ninformation\n5.2 Plan and\norganize\nactivities\n5.3 Monitoring\ndelivery process\n5.4 Organizing\nstocks\n\n--- PDF PAGE 71 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 67\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include:\n1.1 Food\n1.2 Beverages\n1.3 Equipment such as maintenance and cleaning\nequipment, office equipment\n1.4 Linen\n1.5 Stationery\n1.6 Brochures and promotional materials\n1.7 Cleaning supplies and chemicals\n1.8 Vouchers and tickets\n1.9 Souvenir products\n2. Stock losses\nMay include:\n2.1 Lack of rotation leading to product deterioration\n2.2 Inappropriate storage conditions\n2.3 Access by pests or vermin\n2.4 Theft\n2.5 Overstocking\n\n--- PDF PAGE 72 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 68\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to maintain continuous stock\nsupply within a specific hospitality industry\nenvironment\n1.2 Demonstrated the ability to meet accuracy and speed\nrequirements for completion and maintenance of\nstock records\n2. Resource Implications\nThe following resources should be provided:\n2.1 Project or work activities that allow the candidate to\ndemonstrate stock control and monitoring over a\nperiod of time\n2.2 Use of real stock items\n2.3 Use of industry-current stock control technology or\ndocumentation\n2.4 Involvement of internal/external suppliers\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Review of activities undertaken by the candidate to\nmonitor stock for a given period of time for a specific\noutlet i.e. order and re-order points\n3.2 Written or oral questions to test knowledge of reasons\nfor procedures\n3.3 Review of workplace reports and records related to\nstock control, prepared by the candidate\n3.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 73 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 69\nUNIT OF COMPETENCY\n: PREPARE AND DELIVER TRAINING SESSIONS\n\nUNIT CODE\n :"
