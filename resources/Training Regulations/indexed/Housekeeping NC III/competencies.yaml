ces\n\nMay Include:\n11.1 Forms of address\n11.2 Levels of formality, or informality\n11.3 Non-verbal behavior\n11.4 Work ethics\n11.5 Personal grooming\n11.6 Family obligations\n11.7 Recognized holidays\n11.8 Special needs\n11.9 Preferences for personal interactions\n12. Internal customer\n\nMay Include:\n12.1 Colleagues working in another department\n12.2 Team members\n12.3 Supervisor or managers\n13. External customer\n\nMay Include:\n13.1 Suppliers\n13.2 People who buy the goods and services the enterprise sells\n14. Organization\nstandards,\npolicies and\nprocedures\nMay Include:\n14.1 Complaints procedures\n14.2 Organizational standard report forms\n14.3 Job descriptions\n14.4 Code of ethics\n14.5 Quality systems, standards and guidelines\n\n--- PDF PAGE 57 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 53\nVARIABLE\nRANGE\n15. Professional\ndevelopment\nopportunities\n\nMay Include:\n15.1 Coaching, mentoring and/or supervision\n15.2 Formal and/or informal learning programs\n15.3 Internal and/or external training provision\n15.4 Work experience and exchange opportunities\n15.5 Personal study\n15.6 Career planning and development\n15.7 Performance appraisals\n15.8 Workplace skills assessment\n15.9 Quality assurance assessments and recommendations\n16. Formal feedback\n\nMay Include:\n16.1 360-degree assessment\n16.2 Customer satisfaction surveys/forms\n16.3 Team evaluations\n16.4 Performance reviews/appraisals\n16.5 Workplace assessment\n17. Informal feedback May Include:\n17.1 Critical incident reviews\n17.2 Impromptu questioning of customers to obtain view of\nproducts and/or service provided\n17.3 Chance discussions with customers\n17.4 Coaching and mentoring\n17.5 Seeking the opinions of others\n17.6 Comments from supervisors, colleagues or clients\n17.7 Personal, reflective behavior strategies\n18. Non-\ndiscriminatory\nattitudes and\nlanguage\nMay Include:\n18.1 Language in relation to race and ethnicity\n18.2 Not making assumptions about physical or intellectual\nabilities\n18.3 The use of non-discriminatory language in relation to the\nportrayal of people with disabilities\n18.4 Using and gender inclusive language\n\n--- PDF PAGE 58 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 54\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to apply active listening\ntechniques\n1.2 Demonstrated ability to use effective communication\nskills to build and maintain interpersonal relationships\nwithin a designated work group or team\n1.3 Demonstrated ability to apply the principles of good\nteamwork to assist self and others to complete\nassignments within designated timeframes\n1.4 Demonstrated ability to interpret and comply with a\nrange of legislative and procedural requirements\nrelevant to security operations\n1.5 Demonstrated ability to actively seek and interpret\nfeedback on quality of work performance and identify\nopportunities for professional development to develop\nand improve future career options\n1.6 Demonstrated ability to communicate in a clear,\nconcise and accurate manner which reflects\nsensitivity to individual social and cultural differences\n2. Resource Implications\nThe following resources should be provided:\n2.1 Training and assessment to include access to a real\nor simulated workplace; and access to workplace\nstandards, procedures, policies, guidelines, tools\nand equipment\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case studies\n3.2 Observation of practical candidate performance\n3.3 Oral and written questions\n3.4 Portfolio evidence\n3.5 Problem solving\n3.6 Role plays\n3.7 Third party reports completed by a supervisor\n3.8 Project and assignment work\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 59 ---\nHousekeeping NC III Revision 01 Promulgat