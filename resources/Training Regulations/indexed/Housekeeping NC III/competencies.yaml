        "source_text": "TRS515303\n\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and attitudes\n\nrequired to implement lost and found procedures in an\n\naccommodation facility. It includes the monitoring of\n\nsafekeeping of unclaimed and the release of claimed,\n\nunclaimed lost and found items.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Monitor lost\nand found\nfacility\n1.1 Lost and found facility\nare checked\n1.2 In-house lost and found\npolicies and procedures\nare implemented\n1.3 Storage area of lost\nand found items are\nregularly inspected\n1.4 Legal requirements\nthat apply to lost and\nfound facilities are\nchecked\n1.1 Standards operational\npolicies and\nprocedures\n1.2 HACCP\n1.3 Disposition of lost and\nfound items\n1.4 Inventory of Lost and\nFound Items\n1.5 Updates on systems\nand processes\n1.6 Green Practices\n1.1 Effective\ncommunication\nskills\n1.2 Analytical and\nevaluative skills\n1.3 Applying policies\nand procedures\n1.4 Applying legal\nrequirements\n1.5 Applying HACCP\n2. Deal with\nlost and\nfound items\n2.1 Valuable, non-valuable\nand perishable items\nare checked and\nmonitored for appropriate\naction\n2.2 Recorded lost and found\nitems are monitored as to\nsafety and necessary\naction.\n2.3 Inventory of lost and\nfound items are\nperiodically checked.\n2.1 Standards operational\npolicies and\nprocedures\n2.2 General knowledge\nabout OHS\n2.3 Updates on systems\nand processes\n\n2.1 Communication\nskills including\nreceiving\nfeedback and\nreporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n2.2 Reporting skills to\nprocess\ninformation\n2.3 Coordination skills\n3. Deal with\nclaims for\nlost and\nfound items\n3.1 Queries as to legal\nownership of the lost and\nfound items are\nfacilitated.\n3.2 Proper verification of\nownership of property\nbeing claimed is\nsupervised.\n3.3 Identification cards\npresented are validated.\n3.4 Authorization of the\nrepresentative to claim\nthe lost and found items\nis checked.\n3.1 Standards operational\npolicies and\nprocedures\n3.2 Communicating lost\nitems\n3.3 General knowledge\nabout OHS\n3.4 Updates on systems\nand processes\n\n3.1 Program\ndesigning skills\n3.2 Planning and\nconsultative\nprocesses in\nprogram\ndevelopment\n3.3 Communication\nskills including\nreceiving\nfeedback and\nreporting,\nmaintaining\neffective\n\n--- PDF PAGE 100 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 96\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n3.5 Lost and found registry\nare monitored as to\ncompleteness of report.\n\nrelationships and\nconflict\nmanagement\n3.4 Customer service\nskills\n4. Deal with\nunclaimed\nitems\n4.1 Established policies and\nprocedures on\nunclaimed lost and found\nitems are monitored as to\ncompliance.\n4.2 Inventory of unclaimed\nlost and found items in\nstorage are periodically\nchecked.\n4.3 Claims and release of\nlost and found items are\nmonitored in accordance\nwith policies and\nstandards.\n4.1 Standards operational\npolicies and\nprocedures\n4.2 General knowledge\nabout OHS\n4.3 Compute for value of\nitems\n4.4 Updates on systems\nand processes\n4.1 Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n4.2 Customer service\nskills\n\n--- PDF PAGE 101 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 97\n RANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Lost and found items\nMay include:\n1.1 Valuable\n1.2 Non-valuable\n1.3 Unsafe\n1.4 Illegal\n2. Legal requirements\nMay include:\n2.1 Duty of care\n2.2 Bailment (security given to a property)\n\n3. Valuable, Non-valuable and\nPerishable\nMay include:\n3.1 Jewelries\n3.2 Currency\n3.3 Personal Gadgets\n3.4 Guest Clothes and belongings\n3.5 Important Documents\n3.6 Food stuff\n4. Policies and procedures\nMay include:\n4.1 Storage holding period\n4.2 Follow up procedures\n4.3 Policy on finder’s right to claim\n\n--- PDF PAGE 102 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 98\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Implemented in-house lost and found policies and\nprocedures\n1.2 Updated lost and found registry\n1.3 Complied with legal obligations for storage of valuable,\nunsafe and illegal items\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Operations Manuals\n2.2 SOP for lost and found\n2.3 Lost and found Forms\n\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio\n\n4. Context of\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment/assessment center\naccredited by TESDA\n\n--- PDF PAGE 103 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 99\n\nUNIT OF COMPETENCY : SUPERVISE LAUNDRY OF LINEN, UNIFORM\n\nAND GUEST CLOTHES\n\n UNIT CODE\n:"
