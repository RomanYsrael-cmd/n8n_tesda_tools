        "descriptor": "This unit covers the knowledge, skills and attitudes required to assess general obstacles in the application of learning and innovation in the organization and to propose practical methods of such in addressing organizational challenges. ELEMENTS",
        "elements": [
          {
            "number": 1,
            "title": "Assess work procedures, processes and systems in terms of innovative practices",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Reasons for innovation are incorporated to work procedures."
              },
              {
                "number": "1.2",
                "text": "Models of innovation are researched."
              },
              {
                "number": "1.3",
                "text": "Gaps or barriers to innovation in one’s work area are analyzed."
              },
              {
                "number": "1.4",
                "text": "Staff who can support and foster innovation in the work procedure are identified."
              }
            ],
            "required_knowledge": [
              "1.1 Seven habits of highly effective people.",
              "1.2 Character strengths that foster innovation and learning (Christopher Peterson and Martin Seligman, 2004)",
              "1.3 Five minds of the future concepts (Gardner, 2007).",
              "1.4 Adaptation concepts in neuroscience (Merzenich, 2013).",
              "1.5 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992)."
            ],
            "required_skills": [
              "1.1 Demonstrating collaboration and networking skills.",
              "1.2 Applying basic research and evaluation skills",
              "1.3 Generating insights on how to improve organizational procedures, processes and systems through innovation."
            ],
            "source_number": 1
          },
          {
            "number": 2,
            "title": "Generate practical action plans for improving work procedures, processes",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Ideas for innovative work procedure to foster innovation using individual and group techniques are conceptualized"
              },
              {
                "number": "2.2",
                "text": "Range of ideas with other team members and colleagues are evaluated and discussed"
              },
              {
                "number": "2.3",
                "text": "Work procedures and processes subject to change are selected based on workplace requirements (feasible and innovative)."
              },
              {
                "number": "2.4",
                "text": "Practical action plans are proposed to facilitate simple changes in the work procedures, processes and systems."
              },
              {
                "number": "2.5",
                "text": "Critical inquiry is applied and used to facilitate discourse on adjustments in the simple work procedures, processes and systems."
              }
            ],
            "required_knowledge": [
              "2.1 Seven habits of highly effective people.",
              "2.2 Character strengths that foster innovation and learning (Christopher Peterson and Martin Seligman, 2004)",
              "2.3 Five minds of the future concepts (Gardner, 2007).",
              "2.4 Adaptation concepts in neuroscience (Merzenich, 2013).",
              "2.5 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992)."
            ],
            "required_skills": [
              "2.1 Assessing readiness for change on simple work procedures, processes and systems.",
              "2.2 Generating insights on how to improve organizational procedures, processes and systems through innovation.",
              "2.3 Facilitating action plans on how to apply innovative procedures in the organization."
            ],
            "source_number": 2
          },
          {
            "number": 3,
            "title": "Evaluate the effectiveness of the proposed action plans",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Work structure is analyzed to identify the impact of the new work procedures"
              },
              {
                "number": "3.2",
                "text": "Co-workers/key personnel is consulted to know who will be involved with or affected by the work procedure"
              },
              {
                "number": "3.3",
                "text": "Work instruction operational plan of the new work procedure is developed and evaluated."
              },
              {
                "number": "3.4",
                "text": "Feedback and suggestion are recorded."
              },
              {
                "number": "3.5",
                "text": "Operational plan is updated."
              },
              {
                "number": "3.6",
                "text": "Results and impact on the developed work instructions are reviewed"
              },
              {
                "number": "3.7",
                "text": "Results of the new work procedure are evaluated"
              },
              {
                "number": "3.8",
                "text": "Adjustments are recommended based on results gathered"
              }
            ],
            "required_knowledge": [
              "3.1 Five minds of the future concepts (Gardner, 2007).",
              "3.2 Adaptation concepts in neuroscience (Merzenich, 2013).",
              "3.3 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992)."
            ],
            "required_skills": [
              "3.1 Generating insights on how to improve organizational procedures, processes and systems through innovation.",
              "3.2 Facilitating action plans on how to apply innovative procedures in the organization.",
              "3.3 Communicating results of the evaluation of the proposed and implemented changes in the workplace procedures and systems.",
              "3.4 Developing action plans for continuous improvement on the basic systems, processes and procedures in the organization."
            ],
            "source_number": 3
          }
