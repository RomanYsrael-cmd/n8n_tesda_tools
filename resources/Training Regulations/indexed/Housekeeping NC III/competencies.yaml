  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of\ncompetency required in HOUSEKEEPING NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311319\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead in the effective dissemination and\ndiscussion of ideas, information, and issues in the\nworkplace. This includes preparation of written\ncommunication materials.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1 Relevant\ncommunication method\nis selected based on\nworkplace procedures\n1.2 Multiple operations\ninvolving several\ntopics/areas are\ncommunicated following\nenterprise requirements\n1.3 Questioning is applied to\ngain extra information\n1.4 Relevant sources of\ninformation are identified\nin accordance with\nworkplace/ client\nrequirements\n1.5 Information is selected and\norganized following\nenterprise procedures\n1.6 Verbal and written\nreporting is undertaken\nwhen required\n1.7 Communication and\nnegotiation skills are\napplied and maintained in\nall relevant situations\n1.1. Organization\nrequirements\nfor written and\nelectronic\ncommunication\nmethods\n1.2. Effective\nverbal\ncommunication\nmethods\n1.3. Business\nwriting\n1.4. Workplace\netiquette\n1.1 Organizing information\n1.2 Conveying intended\nmeaning\n1.3 Participating in a\nvariety of workplace\ndiscussions\n1.4 Complying with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n1.5 Effective business\nwriting\n1.6 Effective clarifying and\nprobing skills\n1.7 Effective questioning\ntechniques (clarifying\nand probing)\n\n2. Lead\nworkplace\ndiscussions\n2.1 Response to workplace\nissues are sought\nfollowing enterprise\nprocedures\n2.2 Response to workplace\nissues are provided\nimmediately\n2.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n\n2.1 Organizing information\n2.2 Conveying intended\nmeaning\n2.3 Participating in variety\nof workplace\ndiscussions\n\n--- PDF PAGE 8 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3 Constructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4 Goals/ objectives and\naction plans undertaken\nin the workplace are\ncommunicated promptly\n2.2 Effective verbal\ncommunication\nmethods\n2.3 Workplace\netiquette\n2.4 Complying with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n2.5 Effective clarifying and\nprobing skills\n\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n3.5 Identify barriers in\ncommunication to be\naddressed appropriately\n\n3.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2 Effective verbal\ncommunication\nmethods\n3.3 Workplace\netiquette\n3.4 Communication\nproblems and\nissues\n3.5 Barriers in\ncommunication\n\n3.1 Organizing information\n3.2 Conveying intended\nmeaning\n3.3 Participating in a variety\nworkplace discussions\n3.4 Complying with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n3.5 Effective clarifying and\nprobing skills\n3.6 Identifying issues\n3.7 Negotiation and\ncommunication skills\n\n--- PDF PAGE 9 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include but not limited to:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face-to-face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n2. Workplace discussions\nMay include but not limited to:\n2.1. Coordination meetings\n2.2. Toolbox discussion\n2.3. Peer-to-peer discussion\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at\none time\n1.2 Demonstrated leadership skills in workplace\ncommunication\n1.3 Made constructive contributions in workplace issues\n1.4 Sought workplace issues effectively\n1.5 Responded to workplace issues promptly\n1.6 Presented information clearly and effectively written\nform\n1.7 Used appropriate sources of information\n1.8 Asked appropriate questions\n1.9 Provided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Variety of Information\n2.2 Communication tools\n2.3 Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\nCase problem\n3.1. Third-party report\n3.2. Portfolio\n3.3. Interview\n3.4. Demonstration/Role-playing\n4. Context for\nAssessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 10 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 6\n UNIT OF COMPETENCY\n\n:\nLEAD SMALL TEAMS\n\n UNIT CODE\n :\n400311320\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\n\nattitudes to lead small teams including setting,\n\nmaintaining and monitoring team and individual\n\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work\nrequirements are\nidentified and\npresented to team\nmembers based on\ncompany policies\nand procedures\n1.2 Reasons for\ninstructions and\nrequirements are\ncommunicated to\nteam members\nbased on company\npolicies and\nprocedures\n1.3 Team members’\nand leaders’\nconcerns are\nrecognized,\ndiscussed and\ndealt with based on\ncompany practices\n1.1 Facilitation of Team\nwork\n1.2 Company policies\nand procedures\nrelating to work\nperformance\n1.3 Performance\nstandards and\nexpectations\n1.4 Monitoring\nindividual’s and\nteam’s\nperformance vis a\nvis client’s and\ngroup’s\nexpectations\n1.1 Communication\nskills required\nfor leading\nteams\n1.2 Group facilitation\nskills\n1.3 Negotiating skills\n1.4 Setting\nperformance\nexpectation\n2. Assign\nresponsibilities\n2.1. Responsibilities are\nallocated having\nregard to the skills,\nknowledge and\naptitude required to\nundertake the\nassigned task\nbased on company\npolicies.\n2.2. Duties are\nallocated having\nregard to individual\npreference,\ndomestic and\npersonal\nconsiderations,\nwhenever possible\n\n2.1 Work plan and\nprocedures\n2.2 Work requirements\nand targets\n2.2 Individual and\ngroup expectations\nand assignments\n\n2.3 Ways to improve\ngroup leadership\nand membership\n2.1 Communication\nskills\n2.2 Management\nskills\n2.3 Negotiating skills\n2.4 Evaluation skills\n2.5 Identifying team\nmember’s\nstrengths and\nrooms for\nimprovement\n\n--- PDF PAGE 11 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 7\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance\nexpectations are\nestablished based\non client needs\n3.2 Performance\nexpectations are\nbased on individual\nteam members\nknowledge, skills\nand aptitude\n3.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team\nmembers\n3.1 One’s roles and\nresponsibilities in\nthe team\n3.2 Feedback giving\nand receiving\n3.3 Performance\nexpectation\n\n3.1 Communication\nskills\n3.2 Accurate\nempathy\n3.3 Congruence\n3.4 Unconditional\npositive regard\n3.5 Handling of\nFeedback\n\n4. Supervise team\nperformance\n4.1 Performance is\nmonitored based on\ndefined\nperformance criteria\nand/or assignment\ninstruction\n 4.2 Team members\nare provided with\nfeedback, positive\nsupport and advice\non strategies to\novercome any\ndeficiencies based\non company\npractices\n4.3 Performance\nissues which\ncannot be rectified\nor addressed within\nthe team are\nreferred to\nappropriate\npersonnel\naccording to\nemployer policy\n4.4 Team members are\nkept informed of\nany changes in the\npriority allocated to\nassignments or\ntasks which might\nimpact on\nclient/customer\nneeds and\nsatisfaction\n4.1 Performance\nCoaching\n4.2 Performance\nmanagement\n4.3 Performance Issues\n\n4.1 Communication\nskills required\nfor leading\nteams\n4.2 Coaching skill\n\n--- PDF PAGE 12 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 8\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.5 Team operations\nare monitored to\nensure that\nemployer/client\nneeds and\nrequirements are\nmet\n4.6 Follow-up\ncommunication is\nprovided on all\nissues affecting\nthe team\n 4.7 All relevant\ndocumentation is\ncompleted in\naccordance with\ncompany\nprocedures\n\n--- PDF PAGE 13 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 9\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\nMay include:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\nMay include:\n2.1. Roster/shift details\n3. Monitor performance\nMay include:\n3.1. Formal process\n3.2. Informal process\n4. Feedback\nMay include:\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\nMay include:\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 14 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 10\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Resource Implications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or task\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 15 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 11\n UNIT OF COMPETENCY\n:\nAPPLY CRITICAL THINKING AND PROBLEM-\n\nSOLVING TECHNIQUES IN THE WORKPLACE\n\n UNIT CODE\n : 400311321\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause/s of specific\nproblems in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Examine\nspecific\nworkplace\nchallenges.\n1.1 Variances are\nexamined from\nnormal operating\nparameters; and\nproduct quality.\n1.2 Extent, cause and\nnature of the\nspecific problem\nare defined\nthrough\nobservation,\ninvestigation and\nanalytical\ntechniques.\n1.3 Problems are\nclearly stated and\nspecified.\n1.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations.\n1.2 Competence to\ninclude the ability\nto apply and\nexplain, enough for\nthe identification of\nfundamental\ncauses of specific\nworkplace\nchallenges.\n1.3 Relevant\nequipment and\noperational\nprocesses.\n1.4 Enterprise goals,\ntargets and\nmeasures.\n1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement.\n1.6 Enterprise\ninformation\nsystems and data\ncollation\n1.7 Industry codes and\nstandards.\n1.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation) in\nexamining specific\nchallenges in the\nworkplace.\n1.2 Identifying extent\nand causes of\nspecific challenges in\nthe workplace.\n\n--- PDF PAGE 16 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Analyze the\ncauses of\nspecific\nworkplace\nchallenges.\n2.1 Possible causes of\nspecific problems\nare identified\nbased on\nexperience and the\nuse of problem\nsolving tools /\nanalytical\ntechniques.\n2.2 Possible cause\nstatements are\ndeveloped based\non findings.\n2.3 Fundamental\ncauses are\nidentified per\nresults of\ninvestigation\nconducted.\n2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations.\n2.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations.\n2.3 Relevant\nequipment and\noperational\nprocesses.\n2.4 Enterprise goals,\ntargets and\nmeasures.\n2.5 Enterprise quality\nOSH and\nenvironmental\nrequirement.\n2.6 Enterprise\ninformation\nsystems and data\ncollation.\n2.7 Industry codes and\nstandards.\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n2.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n2.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n\n--- PDF PAGE 17 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 13\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Formulate\nresolutions\nto specific\nworkplace\nchallenges.\n3.1 All possible\noptions are\nconsidered for\nresolution of the\nproblem.\n3.2 Strengths and\nweaknesses of\npossible options\nare considered.\n3.3 Corrective actions\nare determined to\nresolve the\nproblem and\npossible future\ncauses.\n3.4 Action plans are\ndeveloped\nidentifying\nmeasurable\nobjectives,\nresource needs\nand timelines in\naccordance with\nsafety and\noperating\nprocedures\n3.1 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n3.2 Relevant\nequipment and\noperational\nprocesses\n3.3 Enterprise goals,\ntargets and\nmeasures\n3.4 Enterprise quality\nOSH and\nenvironmental\nrequirement\n3.5 Principles of\ndecision making\nstrategies and\ntechniques\n3.6 Enterprise\ninformation\nsystems and data\ncollation\n3.7 Industry codes and\nstandards\n3.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n3.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n3.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n3.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges.\n\n--- PDF PAGE 18 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 14\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Implement\naction plans\nand\ncommunicate\nresults.\n4.1 Action plans are\nimplemented and\nevaluated.\n4.2 Results of plan\nimplementation\nand\nrecommendations\nare prepared.\n4.2 Recommendations\nare presented to\nappropriate\npersonnel.\n4.3 Recommendations\nare followed-up, if\nrequired.\n4.1 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n4.2. Relevant\nequipment and\noperational\nprocesses\n4.3 Enterprise goals,\ntargets and\nmeasures\n4.4 Enterprise quality,\nOSH and\nenvironmental\nrequirement\n4.5 Principles of\ndecision making\nstrategies and\ntechniques\n4.6 Enterprise\ninformation\nsystems and data\ncollation\n4.7 Industry codes and\nstandards\n4.1 Using range of\nanalytical\ntechniques\n(e.g., planning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in\nthe workplace.\n4.2 Identifying\nextent and\ncauses of\nspecific\nchallenges in\nthe workplace.\n4.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n4.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges.\n\n--- PDF PAGE 19 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 15\n RANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Parameters\nMay include:\n1.1 Processes\n1.2 Procedures\n1.3 Systems\n\n2. Analytical techniques\nMay include:\n2.1. Brainstorming\n2.2. Intuitions/Logic\n2.3. Cause and effect diagrams\n2.4. Pareto analysis\n2.5. SWOT analysis\n2.6. Gant chart, Pert CPM and graphs\n2.7. Scattergrams\n3. Problem\n\nMay include:\n3.1. Routine, non – routine and complex workplace and\nquality problems\n3.2. Equipment selection, availability and failure\n3.3. Teamwork and work allocation problem\n3.4. Safety and emergency situations and incidents\n3.5. Risk assessment and management\n4. Action plans\n\nMay include:\n4.1. Priority requirements\n4.2. Measurable objectives\n4.3. Resource requirements\n4.4. Timelines\n4.5. Co-ordination and feedback requirements\n4.6. Safety requirements\n4.7. Risk assessment\n4.8. Environmental requirements\n\n--- PDF PAGE 20 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 16\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Examined specific workplace challenges.\n1.2. Analyzed the causes of specific workplace challenges.\n1.3. Formulated resolutions to specific workplace challenges.\n1.4. Implemented action plans and communicated results on\nspecific workplace challenges.\n\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A\nbank of scenarios / case studies / what ifs will be required as\nwell as bank of questions which will be used to probe the\nreason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Case Formulation\n3.3. Life Narrative Inquiry\n3.4. Standardized test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n\nThese assessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may have\nhappened.\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 17\nUNIT OF COMPETENCY :\nWORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n : 400311322\n\nUNIT DESCRIPTOR\n :\nThis unit covers the outcomes required to work\neffectively in a workplace characterized by diversity in\nterms of religions, beliefs, races, ethnicities and other\ndifferences.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop an\nindividual’s\ncultural\nawareness\nand\nsensitivity\n1.1 Individual\ndifferences with\nclients, customers\nand fellow workers\nare recognized\nand respected in\naccordance with\nenterprise policies\nand core values.\n1.2 Differences are\nresponded to in a\nsensitive and\nconsiderate\nmanner\n1.3 Diversity is\naccommodated\nusing appropriate\nverbal and non-\nverbal\ncommunication.\n1.1 Understanding\ncultural diversity in\nthe workplace\n1.2 Norms of behavior\nfor interacting and\ndialogue with\nspecific groups\n(e. g., Muslims and\nother non-\nChristians, non-\nCatholics,\ntribes/ethnic groups,\nforeigners)\n1.3 Different methods of\nverbal and non-\nverbal\ncommunication in a\nmulticultural setting\n1.1 Applying cross-\ncultural\ncommunication\nskills (i.e. different\nbusiness customs,\nbeliefs,\ncommunication\nstrategies)\n1.2 Showing affective\nskills – establishing\nrapport and\nempathy,\nunderstanding, etc.\n1.3 Demonstrating\nopenness and\nflexibility in\ncommunication\n1.4 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n\n--- PDF PAGE 22 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 18\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Work effectively\nin an\nenvironment\nthat\nacknowledges\nand values\ncultural diversity\n2.1 Knowledge, skills\nand experiences\nof others are\nrecognized and\ndocumented in\nrelation to team\nobjectives.\n2.2 Fellow workers are\nencouraged to\nutilize and share\ntheir specific\nqualities, skills or\nbackgrounds with\nother team\nmembers and\nclients to enhance\nwork outcomes.\n2.3 Relations with\ncustomers and\nclients are\nmaintained to\nshow that diversity\nis valued by the\nbusiness.\n2.1 Value of diversity in\nthe economy and\nsociety in terms of\nWorkforce\ndevelopment\n2.2 Importance of\ninclusiveness in a\ndiverse\nenvironment\n2.3 Shared vision and\nunderstanding of\nand commitment to\nteam,\ndepartmental, and\norganizational\ngoals and\nobjectives\n2.4 Strategies for\ncustomer service\nexcellence\n2.1 Demonstrating cross-\ncultural\ncommunication skills\nand active listening\n2.2 Recognizing diverse\ngroups in the\nworkplace and\ncommunity as\ndefined by divergent\nculture, religion,\ntraditions and\npractices\n2.3 Demonstrating\ncollaboration skills\n2.4 Exhibiting customer\nservice excellence\n\n--- PDF PAGE 23 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 19\n\nELEMENT\n\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n3.1 Diversity-related\nconflicts within\nthe workplace are\neffectively\naddressed and\nresolved.\n3.2 Discriminatory\nbehaviors towards\ncustomers/stakeho\nlders are\nminimized and\naddressed\naccordingly.\n3.3 Change\nmanagement\npolicies are in\nplace within the\norganization.\n3.1 Value, and leverage\nof cultural diversity\n3.2 Inclusivity and\nconflict resolution\n3.3 Workplace\nharassment\n3.4 Change\nmanagement and\nways to overcome\nresistance to change\n3.5 Advanced strategies\nfor customer service\nexcellence\n3.1 Addressing\ndiversity-related\nconflicts in the\nworkplace\n3.2 Eliminating\ndiscriminatory\nbehavior towards\ncustomers and co-\nworkers\n3.3 Utilizing change\nmanagement\npolicies in the\nworkplace\n\n--- PDF PAGE 24 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Diversity\nThis refers to diversity in both the workplace and the\ncommunity and may include divergence in :\n1.1\nReligion\n1.2\nEthnicity, race or nationality\n1.3\nCulture\n1.4\nGender, age or personality\n1.5\nEducational background\n2. Diversity-related conflicts\nMay include conflicts that result from:\n2.1\nDiscriminatory behaviors\n2.2\nDifferences of cultural practices\n2.3\nDifferences of belief and value systems\n2.4\nGender-based violence\n2.5\nWorkplace bullying\n2.6\nCorporate jealousy\n2.7\nLanguage barriers\n2.8\nIndividuals being differently-abled persons\n2.9\nAgeism (negative attitude and behavior\ntowards old people)\n\nEVIDENCE GUIDE\n\n1. Critical\naspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAdjusted language and behavior as required by interactions\nwith diversity\n1.2\nIdentified and respected individual differences in colleagues,\nclients and customers\n1.3\nApplied relevant regulations, standards and codes of practice\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Manuals and policies on Workplace Diversity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning\n3.2\nGroup discussions and interactive activities\n3.3\nCase studies/problems involving workplace diversity issues\n3.4\nThird-party report\n3.5\nWritten examination\n3.6\nRole Plays\n4. Context for\nAssessment\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 25 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 21\nUNIT OF COMPETENCY :\nPROPOSE METHODS OF APPLYING LEARNING\nAND INNOVATION IN THE ORGANIZATION\n\n UNIT CODE\n : 400311323\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to assess general obstacles in the application\nof learning and innovation in the organization and to\npropose practical methods of such in addressing\norganizational challenges.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\ninnovative\npractices\n1.1. Reasons for\ninnovation are\nincorporated\nto work\nprocedures.\n1.2. Models of\ninnovation are\nresearched.\n1.3. Gaps or barriers\nto innovation in\none’s work area\nare analyzed.\n1.4. Staff who can\nsupport and foster\ninnovation in the\nwork procedure\nare identified.\n\n1.1 Seven habits of\nhighly effective\npeople.\n1.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n1.3 Five minds of the\nfuture concepts\n(Gardner, 2007).\n1.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013).\n1.5 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992).\n\n1.1 Demonstrating\ncollaboration and\nnetworking skills.\n1.2 Applying basic\nresearch and\nevaluation skills\n1.3 Generating insights\non how to improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n\n--- PDF PAGE 26 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 22\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Generate\npractical\naction plans\nfor improving\nwork\nprocedures,\nprocesses\n2.1 Ideas for\ninnovative work\nprocedure to foster\ninnovation using\nindividual and\ngroup techniques\nare conceptualized\n2.2 Range of ideas\nwith other team\nmembers and\ncolleagues are\nevaluated and\ndiscussed\n2.3 Work procedures\nand processes\nsubject to change\nare selected based\non workplace\nrequirements\n(feasible and\ninnovative).\n2.4 Practical action\nplans are\nproposed to\nfacilitate simple\nchanges in the\nwork procedures,\nprocesses and\nsystems.\n2.5 Critical inquiry is\napplied and used\nto facilitate\ndiscourse on\nadjustments in the\nsimple work\nprocedures,\nprocesses and\nsystems.\n2.1 Seven habits of\nhighly effective\npeople.\n2.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n2.3 Five minds of the\nfuture concepts\n(Gardner, 2007).\n2.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013).\n2.5 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992).\n2.1 Assessing readiness\nfor change on\nsimple work\nprocedures,\nprocesses and\nsystems.\n2.2 Generating insights\non how to improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n2.3 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization.\n\n--- PDF PAGE 27 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 23\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Evaluate the\neffectiveness of\nthe proposed\naction plans\n3.1 Work structure is\nanalyzed to\nidentify the\nimpact of the\nnew work\nprocedures\n3.2 Co-workers/key\npersonnel is\nconsulted to\nknow who will be\ninvolved with or\naffected by the\nwork procedure\n3.3 Work instruction\noperational plan\nof the new work\nprocedure is\ndeveloped and\nevaluated.\n3.4 Feedback and\nsuggestion are\nrecorded.\n3.5 Operational plan\nis updated.\n3.6 Results and\nimpact on the\ndeveloped work\ninstructions are\nreviewed\n3.7 Results of the\nnew work\nprocedure are\nevaluated\n3.8 Adjustments are\nrecommended\nbased on results\ngathered\n3.1 Five minds of the\nfuture concepts\n(Gardner, 2007).\n3.2 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013).\n3.3 Transtheoretical\nmodel of behavior\nchange (Prochaska,\nDiClemente, &\nNorcross, 1992).\n3.1 Generating\ninsights on how to\nimprove\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n3.2 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization.\n3.3 Communicating\nresults of the\nevaluation of the\nproposed and\nimplemented\nchanges in the\nworkplace\nprocedures and\nsystems.\n3.4 Developing action\nplans for\ncontinuous\nimprovement on\nthe basic systems,\nprocesses and\nprocedures in the\norganization.\n\n--- PDF PAGE 28 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Reasons\nMay include:\n1.1 Strengths and weaknesses of the current systems,\nprocesses and procedures.\n1.2 Opportunities and threats of the current systems,\nprocesses and procedures.\n2. Models of innovation\nMay include:\n2.1 Seven habits of highly effective people.\n2.2 Five minds of the future concepts (Gardner, 2007).\n2.3 Neuroplasticity and adaptation strategies.\n3. Gaps or barriers\nMay include:\n3.1 Machine\n3.2 Manpower\n3.3 Methods\n3.4 Money\n4. Critical Inquiry\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See our pages:\nVerbal Communication and Effective Speaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key part of effective\nnegotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 29 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 25\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nEstablished the reasons why innovative systems are required\n1.2\nEstablished the goals of a new innovative system\n1.3\nAnalyzed current organizational systems to identify gaps and\nbarriers to innovation\n1.4\nAssessed work procedures, processes and systems in terms\nof innovative practices\n1.5\nGenerate practical action plans for improving work\nprocedures, and processes\n1.6\nReviewed the trial innovative work system and adjusted reflect\nevaluation feedback, knowledge management systems and\nfuture planning\n1.7\nEvaluated the effectiveness of the proposed action plans\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements\n2.2\nCartolina\n2.3\nManila papers\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Psychological and behavioral Interviews\n3.2\nPerformance Evaluation\n3.3\nLife Narrative Inquiry\n3.4\nReview of portfolios of evidence and third-party workplace\nreports of on-the-job performance\n3.5\nSensitivity analysis\n3.6\nOrganizational analysis\n3.7\nStandardized assessment of character strengths and virtues\napplied\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 30 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 26\nUNIT OF COMPETENCY\n: USE INFORMATION SYSTEMATICALLY\n\nUNIT CODE\n: 400311324\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to use technical information systems, apply\ninformation technology (IT) systems and edit, format\n& check information.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Use technical\ninformation\n1.1. Information are\ncollated and\norganized into a\nsuitable form for\nreference and use\n1.2. Stored\ninformation are\nclassified so that\nit can be quickly\nidentified and\nretrieved when\nneeded\n1.3. Guidance are\nadvised and\noffered to people\nwho need to find\nand use\ninformation\n\n1.1. Application in\ncollating\ninformation\n1.2. Procedures for\ninputting,\nmaintaining and\narchiving\ninformation\n1.3. Guidance to\npeople who need\nto find and use\ninformation\n1.4. Organize\ninformation\n1.5. classify stored\ninformation for\nidentification and\nretrieval\n1.6. Operate the\ntechnical\ninformation system\nby using agreed\nprocedures\n1.1. Collating\ninformation\n1.2. Operating\nappropriate and\nvalid procedures\nfor inputting,\nmaintaining and\narchiving\ninformation\n1.3. Advising and\noffering guidance\nto people who\nneed to find and\nuse information\n1.4. Organizing\ninformation into a\nsuitable form for\nreference and use\n1.5. Classifying stored\ninformation for\nidentification and\nretrieval\n1.6. Operating the\ntechnical\ninformation\nsystem by using\nagreed\nprocedures\n\n--- PDF PAGE 31 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 27\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Apply information\ntechnology (IT)\n2.1. Technical\ninformation\nsystem is operated\nusing agreed\nprocedures\n2.2. Appropriate and\nvalid procedures\nare operated for\ninputting,\nmaintaining and\narchiving\ninformation\n2.3. Software\nrequired are\nutilized to execute\nthe project\nactivities\n2.4. Information and\ndata obtained are\nhandled, edited,\nformatted and\nchecked from