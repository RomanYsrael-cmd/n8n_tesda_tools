        "source_text": "TRS515302\n\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and attitudes\nrequired\nto\nsupervise\na\nrange\nof\ngeneral\nhousekeeping\nservices\nto\nguests.\nIt\nincludes\nregulatory\nrequirements,\nplans\nand\nstandard\noperating procedures and the current practices in the\nindustry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Monitor\nhousekeeping\nteam\n1.1 Team’s understanding\nof regulatory\nrequirements,\nincluding health and\nsafety are assured\n1.2 Housekeeping\nstandard operational\nprocedures (SOPs)\nare followed\n1.3 Waste management\nand disposal are\nimplemented\naccording to\nworkplace standards\n1.4 Use of Personal\nProtective Equipment\n(PPE) is monitored\naccordingly\n\n1.1 Standards operational\npolicies and\nprocedures\n1.2 Updates on internal\nsystems and\nprocesses\n1.3 Basic Occupational\nSafety and Health\n(BOSH)\n1.4 Hazard Analysis\nCritical Control Point\n(HACCP)\n1.5 Green practices\n\n1.1 Effective\ncommunication\nskills\n1.2 Analytical and\nevaluative skills\n1.3 Applying HACCP\n1.4 Applying BOSH\n1.5 Applying green\npractices\n\n2. Update current\npractices in\nhousekeeping\n2.1 Trends and practices\nin the housekeeping\nindustry are observed\n2.2 Occupational safety\nand health practices\nare implemented in\nthe workplace\n2.3 Sources of\ninformation on\nissues affecting the\nhospitality industry\nare obtained\n2.4 Updated industry\nknowledge and\ninformation to daily\noperation are applied\n2.1 Current practices in\nhousekeeping\n2.2 Basic Occupational\nSafety and Health\n(BOSH)\n2.3 Hazard Analysis\nCritical Control Point\n(HACCP)\n2.4 Green practices\n\n2.1 Information\ntechnology skills\n2.2 Applying HACCP\n2.3 Applying BOSH\n2.4 Applying green\npractices\n\n--- PDF PAGE 96 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 92\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Evaluate\nhousekeeping\nteam’s\nperformance\nvs.\norganizational\nstandards\n3.1 Team’s daily\nperformance is\nmeasured against the\norganizational\nstandards\n3.2 Room allocation per\nday is evaluated\naccording to\nhousekeepers’\nperformance\n3.3 Roster staffing is\nmonitored vs the\nperformance\nefficiency, type of\nroom and the front\noffice information for\nexpected time of\narrival and expected\ntime of departure\n3.4 Guests feedback are\nreviewed\n3.1 Key result Areas\n(KRA)\n3.2 Key Performance\nIndicators (KPI)\n3.3 Basic arithmetic\n3.4 Room status reports\n\n3.1 Computer\nliteracy\n3.2 Mathematical\nskills\n3.3 Forecasting skills\n\n4. Monitor usage\nof tools,\nequipment and\nsupplies\n4.1 Inventory of tools,\nequipment and\nsupplies are verified\nbased on Standards\nOperating\nprocedures.\n4.2 Preventive\nmaintenance of tools\nand equipment are\nscheduled as\nrequired\n4.3 Inventory and\npreventive\nmaintenance results\nare submitted\n4.4 Turn down service is\nevaluated as to\ncleanliness and good\nscent of room\n4.1 Inventory Control\nand Maintenance\n4.2 Tools and\nEquipment manuals\n4.3 Basic Occupational\nSafety and Health\n(BOSH)\n4.4 Hazard Analysis\nCritical Control Point\n(HACCP)\n4.5 Green practices\n\n4.1 Preparing reports\nMathematical skills\n4.2 Analytical and\nevaluative skills\n4.3 Tools and\nequipment\noperation skills\n4.4 Applying HACCP\n4.5 Applying BOSH\n4.6 Applying green\npractices\n\n--- PDF PAGE 97 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 93\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Sources of information\nMay include:\n1.1 Basic Occupational Safety and Health\n(BOSH)\n1.2 Hazard Analysis Critical Control Point\n(HACCP)\n1.3 ASEAN MRA-TP\n1.4 Green Practices\n1.5 GAD\n1.6 Sustainable Development Goals\n\n2. Type of room\nMay include:\n2.1 Twin bed room\n2.2 Suite Room\n2.3 Room with kitchenette\n2.4 Other types of room\n3. Tools, equipment and supplies\nMay include:\n3.1 Tools:\no Squeegee\no Spatula\no Broom and Dustpan\no Carpet Sweeper\no Mop\n3.2 Equipment\no Vacuum Cleaner\no Floor Polisher\no Extractor Machine\no Shampooing machine\no Carpet\no CCTV\no Fittings\no Folding machine/automatic folder\no Furnishings\no Housekeeping trolley\n3.3 Supplies\no Rugs\no Cleaning Chemicals\no Linens\no Duvet\no Deodorizer\no Disinfectant\n\n--- PDF PAGE 98 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 94\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Applied regulatory requirements, including Health & Safety,\nBOSH, HACCP and green practices\n1.2 Analyzed KRAs and KPIs\n1.3 Conducted inventory control\n\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Access to workplace documentation and actual workplace\n2.2 Access to a suitable venue for simulated situations\n2.3 Cooperation of other parties\n2.4 Media\n2.5 Text books, reference books\n2.6 Trade magazine and journals\n2.7 Publications and newsletters from suppliers\n2.8 Industry and trade seminars, meetings and conferences\n2.9 Internet research\n\n3. Method of\nAssessment\nCompetency may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio\n\n4. Context of\nAssessment\n4.1 Competency assessment may occur in workplace or any\nsimulated environment/assessment center accredited by\nTESDA\n\n--- PDF PAGE 99 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 95\nUNIT OF COMPETENCY: IMPLEMENT LOST AND FOUND PROCEDURES\n\n UNIT CODE\n:"
