 \n \n2.3  Ways to improve \ngroup leadership \nand membership \n2.1  Communication \nskills \n2.2  Management \nskills \n2.3  Negotiating skills \n2.4  Evaluation skills \n2.5   Identifying team \nmember’s \nstrengths and \nrooms for \nimprovement\n\n--- PDF PAGE 11 ---\nHousekeeping NC III                  Revision 01                   Promulgated (10/15/2019)                       7 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Set \nperformance \nexpectations for \nteam members \n3.1  Performance \nexpectations are \nestablished based \non client needs  \n3.2  Performance \nexpectations are \nbased on individual \nteam members \nknowledge, skills \nand aptitude  \n3.3  Performance \nexpectations are \ndiscussed and \ndisseminated to \nindividual team \nmembers \n3.1  One’s roles and \nresponsibilities in \nthe team \n3.2  Feedback giving \nand receiving \n3.3  Performance \nexpectation \n \n \n3.1  Communication \nskills \n3.2  Accurate \nempathy \n3.3  Congruence \n3.4  Unconditional \npositive regard \n3.5  Handling of \nFeedback \n \n4.  Supervise team \nperformance \n4.1 Performance is \nmonitored based on \ndefined \nperformance criteria \nand/or assignment \ninstruction \n 4.2  Team members \nare provided with \nfeedback, positive \nsupport and advice \non strategies to \novercome any \ndeficiencies based \non company \npractices \n4.3  Performance \nissues which \ncannot be rectified \nor addressed within \nthe team are \nreferred to \nappropriate \npersonnel \naccording to \nemployer policy \n4.4  Team members are \nkept informed of \nany changes in the \npriority allocated to \nassignments or \ntasks which might \nimpact on \nclient/customer \nneeds and \nsatisfaction \n4.1  Performance \nCoaching  \n4.2  Performance \nmanagement \n4.3  Performance Issues \n \n \n4.1  Communication \nskills required \nfor leading \nteams \n4.2  Coaching skill\n\n--- PDF PAGE 12 ---\nHousekeeping NC III                  Revision 01                   Promulgated (10/15/2019)                       8 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.5  Team operations \nare monitored to \nensure that \nemployer/client \nneeds and \nrequirements are \nmet \n4.6   Follow-up \ncommunication is \nprovided on all \nissues affecting \nthe team \n 4.7  All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany \nprocedures\n\n--- PDF PAGE 13 ---\nHousekeeping NC III                  Revision 01                   Promulgated (10/15/2019)                       9 \n    RANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Work requirements \nMay include: \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s \nconcerns \nMay include: \n2.1. Roster/shift details \n3. Monitor performance \nMay include: \n3.1. Formal process \n3.2. Informal process \n4. Feedback \nMay include: \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \nMay include: \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service\n\n--- PDF PAGE 14 ---\nHousekeeping NC III                  Revision 01                   Promulgated (10/15/2019)                       10 \n    EVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to \nnext level of management or appropriate specialist \nand to negotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5. Set and communicated performance expectations for \na range of tasks and duties within the team and \nprovided feedback to team members \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2. Materials relevant to the proposed activity or task \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning  \n3.3. Portfolio \n4. Context for Assessment \n4.1    Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
