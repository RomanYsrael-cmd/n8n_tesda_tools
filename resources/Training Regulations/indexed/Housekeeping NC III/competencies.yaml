        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate :\n1.1 Demonstrated basic entrepreneurial skills\n1.2 Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n1.3 Demonstrated ability to manage/operate a\n micro/small-scale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate\nthe required tasks\n2.3 References and manuals\n3. Methods of\n Assessment\nCompetency in this unit may be assessed through :\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Portfolio assessment with interview\n3.4 Case problems\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 47 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 43\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n: RECEIVE AND RESOLVE CUSTOMER COMPLAINTS\n\nUNIT CODE\n:"
        },
        "source_text": "400311327\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to build,\noperate and grow a micro/small-scale enterprise.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n1.1 Appropriate business\nstrategies are\ndetermined and set for\nthe enterprise based on\ncurrent and emerging\nbusiness environment.\n1.2 Business operations\nare monitored and\ncontrolled following\nestablished procedures.\n1.3 Quality assurance\nmeasures are\nimplemented consistently.\n1.4 Good relations are\nmaintained with\nstaff/workers.\n1.5 Policies and procedures\non occupational safety\nand health and\nenvironmental concerns\nare constantly observed.\n1.1 Business\nmodels and\nstrategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business\noperation\n1.4 Basic\nBookkeeping\n1.5 Business\ninternal controls\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n1.7 Government\nand regulatory\nprocesses\n\n1.1 Basic\nbookkeeping/\naccounting\nskills\n1.2 Communication\nskills\n1.3 Building\nrelations with\ncustomer and\nemployees\n1.4 Building\ncompetitive\nadvantage of\nthe enterprise\n2. Establish and\nmaintain client-\nbase/market\n2.1 Good customer relations\nare maintained\n2.2 New customers and\nmarkets are identified,\nexplored and reached out\nto.\n2.3 Promotions/Incentives\nare offered to loyal\ncustomers\n2.4 Additional products and\nservices are evaluated\nand tried where feasible.\n2.5 Promotional/advertising\ninitiatives are carried out\nwhere necessary and\nfeasible.\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market\nand feasibility\nstudies\n2.4 Basic business\nethics\n2.1 Building\ncustomer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/\ntarpaulins,\nflyers, social\nmedia, etc.)\n\n--- PDF PAGE 44 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 40\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Apply budgeting\nand financial\nmanagement\nskills\n3.1 Enterprise is built up and\nsustained through\njudicious control of cash\nflows.\n3.2 Profitability of enterprise\nis ensured though\nappropriate internal\ncontrols.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are avoided.\n3.1 Cash flow\nmanagement\n3.1 Basic financial\nmanagement\n3.2 Basic financial\naccounting\n3.3 Business internal\ncontrols\n\n3.1 Setting\nbusiness\npriorities and\nstrategies\n3.2 Interpreting\nbasic financial\nstatements\n3.3 Preparing\nbusiness\nplans\n\n--- PDF PAGE 45 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business strategies\nMay include:\n1.1. Developing/Maintaining niche market\n1.2. Use of organic/healthy ingredients\n1.3. Environment-friendly and sustainable practices\n1.4. Offering both affordable and high-quality products\nand services\n1.5. Promotion and marketing strategies (e. g., on-line\nmarketing)\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n4. Promotional/Advertising\ninitiatives\nMay include:\n4.1\nUse of tarpaulins, brochures, and/or flyers\n4.2\nSales, discounts and easy payment terms\n4.3\nUse of social media/Internet\n4.4\n“Service with a smile”\n4.5\nExtra attention to regular customers\n\n--- PDF PAGE 46 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 42\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate :\n1.1 Demonstrated basic entrepreneurial skills\n1.2 Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n1.3 Demonstrated ability to manage/operate a\n micro/small-scale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate\nthe required tasks\n2.3 References and manuals\n3. Methods of\n Assessment\nCompetency in this unit may be assessed through :\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Portfolio assessment with interview\n3.4 Case problems\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 47 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 43\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n: RECEIVE AND RESOLVE CUSTOMER COMPLAINTS\n\nUNIT CODE\n:"
