        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to apply active listening\ntechniques\n1.2 Demonstrated ability to use effective communication\nskills to build and maintain interpersonal relationships\nwithin a designated work group or team\n1.3 Demonstrated ability to apply the principles of good\nteamwork to assist self and others to complete\nassignments within designated timeframes\n1.4 Demonstrated ability to interpret and comply with a\nrange of legislative and procedural requirements\nrelevant to security operations\n1.5 Demonstrated ability to actively seek and interpret\nfeedback on quality of work performance and identify\nopportunities for professional development to develop\nand improve future career options\n1.6 Demonstrated ability to communicate in a clear,\nconcise and accurate manner which reflects\nsensitivity to individual social and cultural differences\n2. Resource Implications\nThe following resources should be provided:\n2.1 Training and assessment to include access to a real\nor simulated workplace; and access to workplace\nstandards, procedures, policies, guidelines, tools\nand equipment\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case studies\n3.2 Observation of practical candidate performance\n3.3 Oral and written questions\n3.4 Portfolio evidence\n3.5 Problem solving\n3.6 Role plays\n3.7 Third party reports completed by a supervisor\n3.8 Project and assignment work\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 59 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 55\nUNIT OF COMPETENCY\n:\nMAINTAIN QUALITY CUSTOMER/GUEST\nSERVICE\n\nUNIT CODE\n\n :"
