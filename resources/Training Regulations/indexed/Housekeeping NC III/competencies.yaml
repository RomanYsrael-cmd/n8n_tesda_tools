        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Examined specific workplace challenges.\n1.2. Analyzed the causes of specific workplace challenges.\n1.3. Formulated resolutions to specific workplace challenges.\n1.4. Implemented action plans and communicated results on\nspecific workplace challenges.\n\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A\nbank of scenarios / case studies / what ifs will be required as\nwell as bank of questions which will be used to probe the\nreason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Case Formulation\n3.3. Life Narrative Inquiry\n3.4. Standardized test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n\nThese assessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may have\nhappened.\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 17\nUNIT OF COMPETENCY :\nWORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n :"
        },
        "source_text": "400311321\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause/s of specific\nproblems in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Examine\nspecific\nworkplace\nchallenges.\n1.1 Variances are\nexamined from\nnormal operating\nparameters; and\nproduct quality.\n1.2 Extent, cause and\nnature of the\nspecific problem\nare defined\nthrough\nobservation,\ninvestigation and\nanalytical\ntechniques.\n1.3 Problems are\nclearly stated and\nspecified.\n1.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations.\n1.2 Competence to\ninclude the ability\nto apply and\nexplain, enough for\nthe identification of\nfundamental\ncauses of specific\nworkplace\nchallenges.\n1.3 Relevant\nequipment and\noperational\nprocesses.\n1.4 Enterprise goals,\ntargets and\nmeasures.\n1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement.\n1.6 Enterprise\ninformation\nsystems and data\ncollation\n1.7 Industry codes and\nstandards.\n1.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation) in\nexamining specific\nchallenges in the\nworkplace.\n1.2 Identifying extent\nand causes of\nspecific challenges in\nthe workplace.\n\n--- PDF PAGE 16 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Analyze the\ncauses of\nspecific\nworkplace\nchallenges.\n2.1 Possible causes of\nspecific problems\nare identified\nbased on\nexperience and the\nuse of problem\nsolving tools /\nanalytical\ntechniques.\n2.2 Possible cause\nstatements are\ndeveloped based\non findings.\n2.3 Fundamental\ncauses are\nidentified per\nresults of\ninvestigation\nconducted.\n2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations.\n2.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations.\n2.3 Relevant\nequipment and\noperational\nprocesses.\n2.4 Enterprise goals,\ntargets and\nmeasures.\n2.5 Enterprise quality\nOSH and\nenvironmental\nrequirement.\n2.6 Enterprise\ninformation\nsystems and data\ncollation.\n2.7 Industry codes and\nstandards.\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n2.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n2.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n\n--- PDF PAGE 17 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 13\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Formulate\nresolutions\nto specific\nworkplace\nchallenges.\n3.1 All possible\noptions are\nconsidered for\nresolution of the\nproblem.\n3.2 Strengths and\nweaknesses of\npossible options\nare considered.\n3.3 Corrective actions\nare determined to\nresolve the\nproblem and\npossible future\ncauses.\n3.4 Action plans are\ndeveloped\nidentifying\nmeasurable\nobjectives,\nresource needs\nand timelines in\naccordance with\nsafety and\noperating\nprocedures\n3.1 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n3.2 Relevant\nequipment and\noperational\nprocesses\n3.3 Enterprise goals,\ntargets and\nmeasures\n3.4 Enterprise quality\nOSH and\nenvironmental\nrequirement\n3.5 Principles of\ndecision making\nstrategies and\ntechniques\n3.6 Enterprise\ninformation\nsystems and data\ncollation\n3.7 Industry codes and\nstandards\n3.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n3.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n3.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n3.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges.\n\n--- PDF PAGE 18 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 14\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Implement\naction plans\nand\ncommunicate\nresults.\n4.1 Action plans are\nimplemented and\nevaluated.\n4.2 Results of plan\nimplementation\nand\nrecommendations\nare prepared.\n4.2 Recommendations\nare presented to\nappropriate\npersonnel.\n4.3 Recommendations\nare followed-up, if\nrequired.\n4.1 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n4.2. Relevant\nequipment and\noperational\nprocesses\n4.3 Enterprise goals,\ntargets and\nmeasures\n4.4 Enterprise quality,\nOSH and\nenvironmental\nrequirement\n4.5 Principles of\ndecision making\nstrategies and\ntechniques\n4.6 Enterprise\ninformation\nsystems and data\ncollation\n4.7 Industry codes and\nstandards\n4.1 Using range of\nanalytical\ntechniques\n(e.g., planning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in\nthe workplace.\n4.2 Identifying\nextent and\ncauses of\nspecific\nchallenges in\nthe workplace.\n4.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n4.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges.\n\n--- PDF PAGE 19 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 15\n RANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Parameters\nMay include:\n1.1 Processes\n1.2 Procedures\n1.3 Systems\n\n2. Analytical techniques\nMay include:\n2.1. Brainstorming\n2.2. Intuitions/Logic\n2.3. Cause and effect diagrams\n2.4. Pareto analysis\n2.5. SWOT analysis\n2.6. Gant chart, Pert CPM and graphs\n2.7. Scattergrams\n3. Problem\n\nMay include:\n3.1. Routine, non – routine and complex workplace and\nquality problems\n3.2. Equipment selection, availability and failure\n3.3. Teamwork and work allocation problem\n3.4. Safety and emergency situations and incidents\n3.5. Risk assessment and management\n4. Action plans\n\nMay include:\n4.1. Priority requirements\n4.2. Measurable objectives\n4.3. Resource requirements\n4.4. Timelines\n4.5. Co-ordination and feedback requirements\n4.6. Safety requirements\n4.7. Risk assessment\n4.8. Environmental requirements\n\n--- PDF PAGE 20 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 16\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Examined specific workplace challenges.\n1.2. Analyzed the causes of specific workplace challenges.\n1.3. Formulated resolutions to specific workplace challenges.\n1.4. Implemented action plans and communicated results on\nspecific workplace challenges.\n\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A\nbank of scenarios / case studies / what ifs will be required as\nwell as bank of questions which will be used to probe the\nreason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Case Formulation\n3.3. Life Narrative Inquiry\n3.4. Standardized test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n\nThese assessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may have\nhappened.\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 17\nUNIT OF COMPETENCY :\nWORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n :"
