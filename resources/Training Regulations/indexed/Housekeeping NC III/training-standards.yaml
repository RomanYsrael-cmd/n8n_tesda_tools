      "source_text": "TESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: HOUSEKEEPING NC Level: III\n\nNominal Training Duration: 40 Hours (Basic)\n\n 96 Hours (Common)\n\n 64 Hours (Core)\n\n 200 Hours\n\n + 64 Hours - Supervised Industry Learning (SIL)\n\n 264 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, and attitudes in\naccordance with industry standards. This covers competencies that a person\nmust achieve in performing tasks such as supervising room cleaning and\nmaintenance requirement, housekeeping services to guests, laundry guests’\nclothes and lines as well as implementing lost and found procedures.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieved.\n\n--- PDF PAGE 108 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 104\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead\nworkplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on