ousekeeping NC III Revision 01 Promulgated (10/15/2019) 116\nCOMMON COMPETENCIES\n(96 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Receive and\nresolve\ncustomer\ncomplaints\n1.1 Identify and\nanalyse the\ncomplaint\n•\nExplain how to received verbal complaint\nusing active listening and empathy\ntechniques\n•\nIdentify through appropriate communication\ntechniques the exact nature of the customer\ncomplaint\n•\nIdentify steps in maintain register or\ncomplaint file/s in accordance with the\nrequirements of the enterprise information\nsystem\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4 Hours\n1.2 Respond to\ncomplaints\n•\nExplain how to process complaints in\naccordance with organizational standards,\npolicies and procedures\n•\nExplain how to obtain and review\ndocumentation in relation to complaints\n•\nIdentify steps in updating register of\ncomplaints/disputes\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4 Hours\n\n1.3 Determine\nand agree\nupon\nappropriate\naction to\nresolve\ncomplaint\n•\nIdentify procedures and guidelines on how\nto resolve the complaint\n•\nDemonstrate a commitment to the customer\nto resolve the complaint\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4 Hours\n\n1.4 Refer\ncomplaints\n•\nIdentify complaints that require referral to\nother personnel or external bodies\n•\nExplain how to forward all necessary\ndocumentation including investigation\nreports to appropriate personnel\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n• Oral Questioning\n4 Hours\n\n--- PDF PAGE 121 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 117\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Work\ncooperatively In\na general\nadministration\nenvironment\n2.1 Develop\neffective team\nrelationships\n•\nExplain how to develop and maintain\nrelationships with team members and\npromote benefits of cooperative work\nconsistent with organizational goals and\nobjectives\n•\nIdentify communication techniques to relay\ninformation in a clear and concise manner\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n\n2.2 Participate in\nteam\nassignments\n• Identify individual responsibilities within the\nworkgroup in accordance with organisational\nrequirements\n• How to recognize and accommodate cultural\ndifferences within the team\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4 Hours\n\n2.3 Contribute to\nteam\ndevelopment\n\n• Identify the internal and external customer\nneeds and expectations\n• Explain how to seek formal feedback and\ninformal feedback on individual and team\nperformance regularly from colleagues and\nsupervisors\n• Identify the non-discriminatory attitudes and\nlanguage when interacting with customers,\nstaff and management\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n3. Maintain quality\ncustomer/guest\nservice\n\n3.1 Identify\ncustomer/\nguest\nrequirements\n• Identify options to improve service\n• Explain how to assess needs of customers/or\nguests\n• Identify and conduct data analysis on\ndeficiencies in service delivery\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n\n--- PDF PAGE 122 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 118\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.2 Ensure\ndelivery of\nquality\nproducts/servi\nces\n•\nExplain how to ensure products/services\nmeet customers’ needs and reflect\nenterprise standards and improve on\nservice levels\n•\nExplain how to ensure team performance\nconsistently meets enterprise standards\n•\nExplain to colleagues how to meet and\nexceed customer service standards by\nproviding appropriate professional\ndevelopment\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n\n3.3 Evaluate\ncustomer\nservice\n\n•\nExplain how to review customer/guest\nsatisfaction with service delivery using\nappropriate methods that produce verifiable\ndata\n•\nIdentify steps on how to evaluate customer\nservice evaluation outcomes\n•\nObtain agreements on appropriate action to\novercome problems\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n4. Roster Staff\n\n4.1 Develop and\nimplement\nstaff rosters\n• Explain how to developed rosters in\naccordance with company agreements and\nwage budgets\n• Identify the role of rosters and their\nimportance in controlling staff costs\n• Explain how to present roster in required\nformats to ensure clarity of information in\naccordance with company standards\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n6 Hours\n4.2 Maintain staff\nrecords\n•\nExplain how to complete time sheets and\nother documentation within designated\ntimelines\n•\nExplain procedures in updating, maintaining\nand storing staff records\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4 Hours\n\n--- PDF PAGE 123 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 119\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Control And\nOrder Stock\n5.1 Maintain\nstock levels\nand records\n• Explain how to monitor and maintain stock\nlevels and performance\n• Identify the steps in monitoring stock\nsecurity and adjusting systems\n• Explain how to maintain records of stock\nstorage and movement\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n6 Hours\n\n5.2 Process stock\norders\n• Explain how to process orders for stock in\naccordance with company procedures\n• Identify steps in maintaining and recording\nstock levels\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4 Hours\n5.3 Minimize\nstock losses\n• Identify reasons for stock loss and damage\n• Explain how to identify stock losses\n• Identify the recommended related\nprocedures and solutions to loss situations\nto prevent future avoidable losses\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4 Hours\n5.4 Follow-up\norders\n• Explain how to monitor delivery process and\nensure continuity of supply\n• Identify routine supply problems\n• Explain how to distribute stock to agreed\nlocations.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n5.5 Organize and\nadminister\nstocks\n• Explain how to organize stocks\n• Identify the stocktaking responsibilities\n• Demonstrate how to produce accurate stock\nreports\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 hours\n\n--- PDF PAGE 124 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 120\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n6. Prepare And\nDeliver Training\nSessions\n6.1 Determine\ntraining\nrequirements\n\n• Identify required competencies for learners\n• Describe the training gap for learners\n• Explain the identified training gaps and\nrecommendation for training\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n6.2 Prepare\ntraining plan\n\n• Explain how to develop session outlines,\ntraining content, training resources and\nmaterials and individual training session\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n6.3 Deliver\ntraining\nsessions\n\n•\nExplain the training and assessment\nactivities involved in the training session\n•\nIdentify steps in preparing training venue for\nthe training session\n• Identify safety of learners during training\ndelivery and practice\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n7. Plan, conduct\nand evaluate\nstaff\nperformance\nassessment\n\n7.1 Plan a staff\nperformance\nassessment\n•\nIdentify context for staff performance\nassessment\n•\nDetermine the initial focus of the staff\nperformance assessment for each staff\nmember\n•\nPrepare Documents to record identified staff\nperformance assessment statistics and\nperformance data\n•\nDesign action plan to guide the conduct of\nstaff performance assessment\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n\n--- PDF PAGE 125 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 121\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n7. 2 Conduct a\nstaff\nperformance\nassessment\n•\nIdentify steps in gathering workplace-based\nevidence of staff performance\n•\nExplain how to interpret employee\nperformance data\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n7.3 Evaluate a\nstaff\nperformance\nassessment\n•\nPrepare staff performance assessment\ninterview\n•\nIdentify steps in reviewing individual staff\nperformance\n•\nExplain how to prepare staff performance\nassessment targets for next period\n• Discussion\n• Demonstration\n•\nLecture\n•\nGroup\ndiscussion\n•\nSimulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n•\n Interview\n\n4 Hours\n\n--- PDF PAGE 126 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 122\nCORE COMPETENCIES\n(64 Hours)\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Supervise room\ncleaning and\nmaintenance\nrequirement\n\n1.1 Monitor housekeeping\nrequirement procedures and\nresources\n\n• Recognize external regulations\n• Identify tools, equipment and\nsupplies\n• Report accidents, injuries, and\nunsafe work conditions to\nsupervisor/manager\n• Assimilate workplace procedures and\npolicies for housekeeping\n• Apply BOSH and green practices\n\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n• Case Study\n\n6 hours\n1.2 Monitor cleanliness and safety in\nthe workplace\n• Monitor cleanliness and tidiness of the\nworkplace\n• Identify housekeeping issues\n• Maintain and store housekeeping\nequipment and supplies\n• Maintain stored records\n• Individual\nlearning\n• Group\nDiscussion\n• Case Study\n• Role playing\n• Written Report\n• Oral\nQuestioning\n• Demonstration\n4 hours\n1.3 Assess and evaluate assigned\ntasks\n• Schedule and apply risk assessment\nactivities\n• Review and assess the effectiveness\nof the systems\n• Recognize compliance with\nlegislations and internal requirements\n• Plan for adjustments and\nimprovements\n• Individual\nlearning\n• Group\nDiscussion\n• Case Study\n• Role playing\n• Written Report\n• Oral\nQuestioning\n• Demonstration\n6 hours\n2. Supervise\nhousekeeping\nservices to\nguests\n2.1 Monitor housekeeping team\n\n• Recognize regulatory requirements\nincluding Health & Safety\n• Follow housekeeping standard\noperational procedures\n• Implement waste management and\ndisposal\n• Monitor application of HACCP and\nBOSH\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n• Case Study\n\n4 hours\n\n--- PDF PAGE 127 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 123\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.2 Update current practices in\nhousekeeping\n• Implement latest developments in the\nhousekeeping industry\n• Apply related technology for health,\nsafety, employment and green\npractices\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Case Study\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n4 hours\n2.3 Evaluate housekeeping team’s\nperformance vs. organizational\nstandards\n• Measure team’s performance in\nterms of rooms per day against the\norganizational standard\n• Set room target per day according to\norganizational needs\n• Monitor roster staffing against the\nroom target allocation\n• Measure performance against guest\nfeedback\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n• Case Study\n\n4 hours\n2.4 Monitor usage of tools,\nequipment and supplies\n• Conduct inventory of tools,\nequipment and supplies\n• Understand inventory control and\nmaintenance\n• Review practices against\nestablishment’s manual\n• Individual\nlearning\n• Lecture/\nDiscussion\n• Presentation\n• Role playing\n• Written\nexamination\n• Oral\nDemonstration\n• Questioning\n• Case Study\n\n4 hours\n3. Implement lost\nand found\nprocedures\n3.1 Monitor lost and found facility\n• Monitor lost and found facility\n• Evaluate compliance of lost and\nfound policies and procedures\n• Monitor the maintenance of lost and\nfound facility\n• Recognize application of legal\nrequirements for lost and found\nfacility\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n\n--- PDF PAGE 128 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 124\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.2 Deal with lost and found items\n•\nCheck items for safety and legality\nand take appropriate action\n•\nRecord found items in lost and\nfound register\n•\nRecord items reported lost in lost\nand found register\n•\nTag the found item\n•\nStore the found item appropriately\n•\nNotify owner, if known\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n3.3 Deal with claims for lost items\n•\nAssist claimant to identify lost\nproperty\n•\nVerify ownership of property claimed\n•\nObtain identification from owner\n•\nComplete lost and found register\n•\nAssist claimants who contact the\nestablishment from another country,\nor distant area, to claim lost items\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n3.4 Deal with unclaimed items\n•\nComply with establishment policies\n•\nComply with legal obligations\n•\nRemove items from storage and\ncomplete lost and found register to\nrecord movement and disposal of\nitems\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n4. Supervise\nlaundry of\nlinen, uniform\nand guest\nclothes\n4.1 Evaluate the role and\nresponsibilities of a laundry\nservices\n• Monitor documentation of laundered\nitems\n• Assign laundry staff based on\nestablishment’s needs\n• Control costing of laundry services\n• Check laundry tools, equipment and\nsupplies used\n• services\n• Monitor laundry equipment working\ncondition\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n\n--- PDF PAGE 129 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 125\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n4.2 Monitor laundry procedure\n• Monitor the receiving and checking of\npicked-up guest clothes in\naccordance with enterprise\nrequirements\n• Supervise received and laundered\nused in-house items and those with\nunremoved stains\n• Monitor the segregation of guest\nclothes and linens for laundry\n• Check the usage of laundry tools,\nequipment and chemicals\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n2 hours\n4.3 Supervise the costing, packaging\nand delivery of laundered items\n\n• Verify the costing of laundered guest\nclothes\n• Monitor packaging and delivery of\nlaundered items\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n6 hours\n4.4 Supervise laundry facility\nmaintenance\n• Monitor post-cleaning laundry\nactivities\n• Check the cleaning and maintenance\nof laundry tools and equipment\n• Evaluate daily internal laundry report\nand documentation\n• Individual\nlearning\n• Group\nDiscussion\n• Presentation\n• Written\nExamination\n• Oral\nQuestioning\n4 hours\n\n--- PDF PAGE 130 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 126\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work components.\n\n--- PDF PAGE 131 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 127\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs, training\ncenters and other TVET providers which are intended to address the\nspecific needs of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n•\nMust have completed the 10-year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent holder\n•\nCan communicate in basic English in both oral and written form\n•\nMust be computer literate\n•\nCan perform basic mathematical computation\n•\nMust be competent in Housekeeping NC II qualification gained through\ntraining or experience or certification\n\n--- PDF PAGE 132 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 128\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for HOUSEKEEPING NC III are as follows:\n\nSupplies\nEQUIPMENT\nREFERENCE MATERIALS\nQTY\n\nQTY\n\nQTY\n\n2\nrims\nA4 paper\n25\nunits\nComputer with\ninternet connection\n25\nInventory forms for tools,\nequipment and supplies\n2\nrims\nLegal Bond\npaper\n1 unit\nLCD projector\n1\nHACCP\n2set\ns\nprinter ink\n2 unit\nPrinter\n1\nBOSH\n\n1\nInternal policies on green\npractices\n\n50\nGuest feedback form\n\n25\nStaff roster worksheet\n\n25\nMonitoring sheet for\nwaste management and\ndisposal\n\n25\nEvaluation forms for\nHousekeeping staff\n\n1\nGAD Manual/handbook\n\n25\nLost and found inventory\nforms\n\n25\nReturn/Release Lost and\nFound forms\n\n25\nUnclaimed Lost and found\ninventory forms\n\n25\nMaintenance Checklist for\nLost and Found Facilities\n\n25\nLaundry Service forms\n\n25\nLaundry Service inventory\nforms\n\n25\nMonitoring Sheet for\nLaundry service\n\n25\nPrice list of laundry items\n\n25\nMaintenance Checklist for\nLaundry Facilities\n*NOTE:\nImplementation of the training program can be facilitated through a MOA between\nthe training provider and industry partner/sfor the use of the facilities. This is in\nresponse to the high cost of facilities and equipment.\n\n--- PDF PAGE 133 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 129\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nPractical Work Area per\nTrainee\n1 x 1 m\n1 sq. m.\n25 sq. m\nContextual Learning\nArea\n5 x 5 m\n25 sq. m.\n25 sq. m\nDistance Learning\n/Computer Center\n6.8 x 5 m.\n34 sq. m.\n34 sq. m.\nLearning Resource\nArea\n2 x 5 m\n10 sq. m.\n10 sq. m\nStorage Area\n2 x 5 m\n10 sq. m.\n10 sq. m.\nTotal workshop area:\n104 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS\n\n• Holder of National TVET Trainer Certificate (NTTC) Level I in Housekeeping\nNC III\n• Must have at least two (2) years industry experience as Housekeeping\nSupervisor\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 134 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 130"
