        "source_text": "--- PDF PAGE 39 ---\nTR Caregiving NC II \n \n-5- \nUNIT OF COMPETENCY : \nPROVIDE CARE AND SUPPORT TO CHILDREN \n \nUNIT CODE \n: \nHCS323302 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nprovide care and support to children between three (3) years old \nand twelve (12) years old. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Instill personal \nhygiene practices to \nchildren \n1.1 \nHygiene practices are explained clearly to children based on \nestablished procedures.  \n1.2 \nPersonal hygiene procedure is demonstrated to children \nbased on health and safety procedures. \n1.3 \nChildren paraphernalia are maintained based on healthy \nprocedures. \n2. Bathe and dress \nchildren \n2.1 \nChildren’s vital signs are checked before bathing based on \nprocedures. \n2.2 \nBathing paraphernalia are prepared as per procedure.  \n2.3 \nBath water quantity and temperature are checked based on \nhealth requirements of the child. \n2.4 \nChildren are assisted in dressing up according to prevailing \nweather condition \n2.5 \nChildren’s preferences and decisions are acknowledged, \nrespected and followed whenever appropriate and possible \n2.6 \nChildren with difficult behavior in bathing are dealt with \nappropriately as per procedure. \n3. Feed children \n3.1      Nutritional requirements of children are determined \naccording to their developmental stage.  \n3.2 \nMenu is prepared in accordance with children’s nutritional and \ncultural requirements. \n3.3 \nAppetizing food and drink are prepared and served \nsufficiently and appropriately according to the child’s health \nneeds and preferences. \n3.4 \nChildren are fed following healthy procedures.\n\n--- PDF PAGE 40 ---\nTR Caregiving NC II \n \n-6- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Children’s \nparaphernalia \n1.1 \nBathing paraphernalia and toiletries \n1.2 \nDiaper \n1.3 \nClothes \n1.4 \nGrooming Kit (baby hairbrush, comb, nail scissors) \n1.5 \nOral Hygiene (toothbrush, toothpaste) \n1.6 \nFeeding Utensils \n1.7 \nBibs \n1.8 \nHigh Chair/Booster Seat/Portable Seat \n1.9 \nThermometer \n1.10 Thermometer Tray \n2. Nutritional \nrequirements \n2.1 \nNutritious food \n2.2 \nBalance Diet \n2.3 \nRelevant nutritional needs according to age level \n3. Menu \n3.1 \nBreakfast \n3.2 \nLunch \n3.3 \nDinner \n3.4 \nSnacks \n4. Cultural requirements 4.1 \nMeal patterns over a day \n4.2 \nDrinks provided \n4.3 \nFoods used \n4.4 \nHot or cold meals \n4.5 \nSpices and flavorings used \n4.6 \nInclusion of sweets \n5. Appetizing food \n 5.1 \nColor \n 5.2 \nShape \n 5.3 \nTexture \n 5.4 \nVariety   \n6. Health needs of \nchildren  \n6.1 \nMedical advice and diet \n6.2 \nAllergies to certain foods \n7. Food and drink \npreferences  \n \n7.1 \nCulture \n7.2 \nDietary Requirements \n7.3 \nReligion \n7.4 \nAge \n7.5 \nFamily Patterns \n7.6 \nIndividual Tastes \n7.7 \nStage of the Day\n\n--- PDF PAGE 41 ---\nTR Caregiving NC II \n \n-7- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment may requires evidence that the candidate: \n1.1 \nDemonstrated ability to prepare nutritious foods suitable for \nchildren. \n1.2 \nInstilled personal hygiene practices to children. \n1.3 \nTook vital signs before bathing the child. \n1.4 \nDemonstrated feeding procedures. \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nBathing and Dressing/Undressing Procedures \n2.2 \nProcedures of Feeding Children \n2.3 \nProcedures in Taking Vital Signs \n2.4 \nProper Health Care of Children \n2.5 \nHand Washing Procedures \n2.6 \nTable Etiquette \n2.7 \nGood Grooming \n2.8 \nNutritional Needs of Children \n2.9 \nFat Contents of Foods \n2.10 Dietary Requirements for Infants \n2.11 Cultural Practices and Beliefs about  Food Provision  \n2.12 Impact of Foods and Drinks on Dental Health \n2.13 Storage of Food – Temperatures \n2.14 Food Preparation and Cooking \n3. Underpinning skills \n3.1 \nCooking and Preparing Food \n3.2  \nMenu Planning \n3.3  \nBasic Measurements \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nA childcare workplace \n4.2 \nFacilities, equipment and materials relevant to the unit of \ncompetency \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.\n",
