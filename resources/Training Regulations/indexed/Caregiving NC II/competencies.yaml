        "source_title": "APPLY BASIC FIRST AID",
        "source_text": "--- PDF PAGE 26 ---\nTR Caregiving NC II \n \n-5- \nUNIT OF COMPETENCY : \nAPPLY BASIC FIRST AID \n \nUNIT CODE \n: \nHCS323203 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nprovide an initial response where First Aid is required. In this unit it \nis assumed that the First Aider is working under supervision and/or \naccording to established workplace First Aid procedures and \npolicies. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Assess the situation \n1.1 \nPhysical hazards to self and casualty’s health and safety are \nidentified. \n1.2 \nImmediate risks to self and casualty’s occupational health \nsafety (OSH) are minimized by controlling the hazard in \naccordance with OSH requirements. \n1.3      Casualty’s vital signs and physical condition are assessed in \naccordance with workplace procedures.\n2.  Apply basic first aid \ntechniques \n2.1 \nFirst Aid management is provided in accordance with \nestablished First Aid procedures. \n2.2 \nCasualty is reassured in a caring and calm manner and made \ncomfortable using available resources. \n2.3 \nFirst Aid assistance is sought from others in a timely manner \nand as appropriate. \n2.4 \nCasualty’s condition is monitored and responded to in \naccordance with effective First Aid principles and workplace \nprocedures. \n2.5 \nDetails of casualty’s physical condition, changes in conditions, \nmanagement and response are accurately recorded in line \nwith organizational procedures. \n2.6 \nCasualty management is finalized according to his/her needs \nand First aid principles.\n3.  Communicate details \nof the incident \n3.1      Appropriate medical assistance is requested using relevant \ncommunication media and equipment. \n3.2      Details of casualty’s condition and management activities are \naccurately conveyed to emergency services/relieving \npersonnel. \n3.3      Reports to supervisors are prepared in a timely manner, \npresenting all relevant facts according to established company \nprocedures.\n\n--- PDF PAGE 27 ---\nTR Caregiving NC II \n \n-1- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  First Aid \nManagement \n \n \nThis may include but not limited to: \n1.1      Workplace policies and procedures \n1.2      Industry/site specific regulations, codes \n1.3      OSH \n1.4      State and territory workplace health and safety requirements \n1.5    Allergies the casualty may have\n2.  Physical Hazards \nThis may include but not limited to: \n2.1 \nWorkplace hazards \n2.2 \nEnvironmental hazards \n2.3 \nProximity of other people \n2.4\nHazards associated with casualty management processes\n3.  Risks \nMay include but not limited to: \n3.1     Worksite equipment, machinery and substances \n3.2     Environmental risks \n3.3     Bodily fluids \n3.4     Risk of further injury to the casualty \n3.5     Risk associated with the proximity of the others and \nbystanders\n4.  Casualty’s Condition \nMay include but not limited to: \n4.1 \nAbdominal injuries \n4.2 \nAllergic reactions \n4.3 \nBleeding \n4.4 \nBurns-thermal, chemical, friction, electrical \n4.5 \nCardiac conditions \n4.6 \nChemical contamination \n4.7 \nCod injuries \n4.8 \nCrush injuries \n4.9 \nDislocations \n4.10 Drowning \n4.11 Eye injuries \n4.12 Fractures \n4.13 Head injuries \n4.14 Epilepsy \n4.15 Minor skin injuries \n4.16 Neck and spinal injuries \n4.17 Needle stick injuries \n4.18 Poisoning and toxic substances \n4.19 Shock \n4.20 Smoke inhalation\n5.  Equipment and \nResources \n5.1 \nDefibrillation units \n5.2 \nPressure bandages \n5.3 \nThermometers \n5.4 \nFirst Aid Kit \n5.5 \nEyewash \n5.6 \nThermal Blankets \n5.7 \nPocket Face Masks \n5.8 \nRubber Gloves \n5.9\nDressing\n\n--- PDF PAGE 28 ---\nTR Caregiving NC II \n \n-1- \n \nVARIABLE\nRANGE\n \n \n5.10 Space Device \n5.11 Cervical Collars \n6.  Communication \nSystem \n6.1 \nMobile phone \n6.2 \nSatellite phones \n6.3 \nHF/VHF radio \n6.4 \nFlags \n6.5 \nFlares \n6.6 \nTwo-way radio \n6.7 \nEmail \n6.8\nElectronic equipment\n7.  Vital signs \n7.1 \nBreathing \n7.2 \nCirculation \n7.3\nConsciousness\n8.  First Aid Principles \n8.1 \nChecking the site for danger to self, casualty and others and \nminimizing the danger  \n8.2 \nChecking and maintaining the casualty’s airways, breathing \nand circulation\n\n--- PDF PAGE 29 ---\nTR Caregiving NC II \n \n-1- \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nComplied with institutional requirements, OSH laws infections \ncontrol and manual handling procedures and relevant health \norganizations. \n1.2 \nIdentified physical hazards of the casualty and minimized \nimmediate risks. \n1.3 \nAssessed and monitored the physical condition of the \ncasualty. \n1.4 \nResponded to emergency using basic life support measures. \n1.5 \nProvided initial response where First aid is required. \n1.6 \nDealt with complex casualties or incident. \n1.7\nPrepared reports to concerned personnel in a timely manner.\n2.  Underpinning \nknowledge and \nattitudes \n2.1 \nBasic anatomy and physiology \n2.2 \nCompany standard operating procedures (SOPs) \n2.3 \nDealing with confidentiality \n2.4 \nKnowledge of the First Aider’s skills limitations \n2.5 \nOSH legislation and regulations \n2.6 \nHow to gain access to and interpret material safety data \nsheets\n3.  Underpinning skills \n3.1      Resuscitation \n3.2      Safe manual handling of casualty \n3.3      Consideration of the welfare of the casualty \n3.4      Report preparation \n3.5     Communication skills \n3.6   Ability to interpret and use listed documents\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1      Access to relevant work station \n4.2 \nRelevant institutional policy, guidelines, procedures and \nprotocols \n4.3\nEquipment and materials relevant to the proposed activities\n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1      Demonstration with questioning \n5.2      Interview \n5.3     Third Party Report \n5.4    Portfolio\n6.  Context of \nassessment\n6.1  Assessment may be done in the workplace or in a simulated \nworkplace setting.\n",
