        "source_text": "--- PDF PAGE 42 ---\nTR Caregiving NC II \n \n-8- \nUNIT OF COMPETENCY : \nFOSTER THE SOCIAL, INTELLECTUAL, CREATIVE AND \nEMOTIONAL DEVELOPMENT OF CHILDREN \n \nUNIT CODE \n: \nHCS323303 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nfoster the social, intellectual, creative and emotional development of \nchildren from 1-12 years old. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Foster children’s   \nindependence and \nautonomy \n      \n \n1.1 \nOpportunities to develop self help skills and independence \nare provided as needed. \n1.2 \nChildren are given opportunities to make choice in appropriate \nways taking into consideration their individual differences. \n1.3 \nChildren are encouraged to accept responsibility for their own \nactions. \n1.4 \nOpportunities are created for children to participate in decision \nmaking. \n2. Encourage children to \nexpress their feelings, \nideas and needs \n2.1 \nChildren are encouraged to express their feelings, ideas and \nneeds based on social norm. \n2.2 \nChildren are provided with activities as means of      releasing \ntheir feelings according to their interests and needs. \n2.3 \nChildren are encouraged to respect each other’s individual \nneeds, abilities and interest.  \n3.  Stimulate children’s \nawareness and \ncreativity \n3.1 \nChildren are encouraged to express their imagination and \ncreativity based developmental needs. \n3.2 \nChildren are provided with activities that would support \nawareness of the range of movements of their own body \nbased on developmental needs. \n3.3 \nMaterials and experiences are provided that would stimulate \ntheir various senses based on their interests. \n3.4 \nExperiences that develop and enhance imagination and \ncreativity are provided based on their interests. \n4. Foster children’s self \nesteem and \ndevelopment of self \nconcept \n \n4.1 \nOpportunities are provided for children to experience their \nindividual strengths and needs. \n4.2 \n Acknowledgement and positive support are given based on \nchild experience negative feeling (frustration, aggression, \ndepression, fear and anxiety). \n4.3      Activities that present a challenge within the child’s needs and \ncapabilities are provided based on developmental stage. \n4.4       Individual differences are acknowledged and respected based \non child’s development stage. \n4.5      Children’s achievements are acknowledged and appreciated \nbased on preference. \n4.6      Children’s positive self-worth and self esteem are enhanced.\n\n--- PDF PAGE 43 ---\nTR Caregiving NC II \n \n-9- \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Opportunities  \n1.1 \nSocio dramatic play \n1.2 \nMovement \n1.3 \nListening to music \n1.4 \n Art experiences including day and finger painting \n2. Individual differences \n2.1 \nAge \n2.2 \nGender \n2.3 \nFamily background and lifestyle \n2.4 \nAbilities and disabilities \n2.5 \nStyle of social interaction \n2.6 \nAppearance \n2.7 \nCultural beliefs and practices \n2.8 \nTemperament \n2.9 \nInterests  \n2.10 Peer group acceptance, membership or isolation \n3. Children’s activities \nChildren’s activities are carried out with the use of the following: \n3.1 \nPlaypen with approximate toys according to age group (cradle \ntoys, objects to explore by mouth, swinging toys, rattles, toys \nto poke, squeeze and push along \n3.2 \nAudio Visual Equipment (radio cassette, TV) \n3.3 \nColoring Books \n3.4 \nCrayons \n3.5 \nPencils \n3.6 \nPeg Boards \n3.7 \nBeads to String \n3.8 \nConstruction Sets \n3.9 \nScissors \n3.10 Paper \n3.11 Color \n3.12 Paint/Short Fat Paint Brushes \n3.13 Play Dough \n3.14 Activity Kit \n3.15 Puzzles \n3.16 Books \n3.17 Manual\n\n--- PDF PAGE 44 ---\nTR Caregiving NC II \n \n-10- \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated ability to evaluate the emotional and \npsychological stage of the child and to plan activities which \nwill enhance their development \n1.2 \nDemonstrated ability to assist children to be creative through \nproviding a stimulating and challenging environment, taking \ninto account child’s age, development, culture and abilities \n1.3 \nDemonstrated ability to engage children in a range of \ndevelopmental opportunities which are matched to their \ndevelopmental stage and specific needs \n2. Underpinning \nknowledge and \n     attitudes \n2.1 \nPsychology of Children \n2.2 \nCultural Awareness \n2.3 \nProcesses for Creative and Artistic Expression \n2.4 \nChildren Developmental Stages \n2.5 \nUnderstanding of Children’s Physical and Skills Development \n2.6 \nChildren’s Needs, Interests and Problems \n3. Underpinning skills \n3.1 \nPlanning \n3.2 \nInterpersonal Skills \n3.3 \nMotivational Skills \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.3 \nA childcare workplace \n4.4 \nFacilities, equipment and materials relevant to the unit of \ncompetency \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \n  Demonstration with questioning \n5.2 \n  Interview \n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.\n",
