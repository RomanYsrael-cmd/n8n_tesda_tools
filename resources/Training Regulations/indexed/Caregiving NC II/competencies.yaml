        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:  \n1.1 \n Responded to distressed infants and toddlers in a    relaxed \nand calm manner. \n1.2 \nTook vital signs, bathed and dressed/undressed infant/toddler. \n1.3 \nPrepared milk formula and fed infant as prescribed. \n1.4 \nCleaned and sterilized feeding bottles. \n1.5 \nPut infants/toddlers to sleep. \n1.6 \nEnhanced social, physical, intellectual, creative and emotional \nactivities of the infant/toddler. \n1.7 \nDemonstrated the ability to assess infants/toddlers’ needs \nappropriately.\n2. Underpinning \nknowledge and \nattitudes \n2.1 \nThe Dependent Nature of Infants/Toddlers \n2.2 \nBathing Paraphernalia and ; Types, Uses, Specification \n2.3 \nProcedures in Taking Vital Signs \n2.4 \nBasic Infant Care \n2.5 \nProcedures in Bathing and Dressing/Undressing  of infants \n2.6 \nInfant Diet \n2.7 \nProcedures in Feeding \n2.8 \nTypes and Uses of Clothes and Underwear \n2.9 \nSpecifications and Uses of Non-Slip Rubber Mat \n2.10 Hand Washing Procedures \n2.11 Specifications of Different Types of Thermometer \n2.12 Table Etiquette \n2.13\nSigns of Infants/Toddlers Distress  \n3. Underpinning skills \n3.1 \nCommunication Skills ( listening, speaking, verbal and non-\nverbal) \n3.2 \nEmpathy \n3.3 \nInterpersonal Skills \n3.4 \nCreative Skills \n3.5 \nAbility to establish bonding with infant/toddler \n3.6\nBasic Measurement\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1      A childcare workplace \n4.2      Facilities, equipment and materials relevant to the unit of \ncompetency\n5. Method of \nassessment   \nCompetency MUST be assessed through: \n5.1 \nDemonstration with questioning \n5.2\nInterview\n6. Context of \nassessment\n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.",
