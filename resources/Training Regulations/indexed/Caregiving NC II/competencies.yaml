          "source_text": "1. Establish and \nmaintain an \nappropriate \nrelationship with the \nelderly \n1.1 \nSelf introduction by the  caregiver to the elderly client is done \nbased on established procedures. \n1.2 \nAppropriate attitudes such as confidentiality, privacy, courtesy \nand respect are adhered to and demonstrated towards the \nelderly based on established procedures. \n1.3 \n The elderly’s own interest, rights, freedom and decision-\nmaking are supported and respected based on established \nprocedures. \n1.4 \nShort interpersonal exchanges with the elderly in \nestablishing, developing and maintaining  rapport are \nencouraged. \n2. Provide appropriate \nsupport to the elderly \n2.1 \nAll support is provided to the elderly in accordance with the \nelderly’s needs, rights, self determination and individual \ndifferences. \n2.2 \nThe elderly is encouraged and supported to participate in \nceremonial, cultural, educational, recreational, religious, \nsocial, and spiritual activities as appropriately planned. \n2.3 \nAssistance is provided at all times in order to maintain a safe \nand healthy environment, including minimizing    physical \ndangers and risk of infections based on established \nprocedures. \n2.4 \nProper response to situations of risks to health and safety is \nprovided and maintained based on established procedures. \n3. Provide assistance \nwith elderly’s \npersonal care needs \n3.1 \nPersonal preferences are identified in consultation with the \nelderly and a plan for execution is mapped out based on \nestablished procedures. \n3.2 \nThe elderly  is supported and encouraged in exercising their \nrights and personal preferences without compromising their \nsafety and those of others and in accordance with established \nprocedures. \n3.3 \nShort interpersonal exchanges, clarifying meaning and \nmaintaining interaction to identify the elderly’s preferences are \nconducted based on established procedures. \n3.4 \nTime is scheduled to effectively listen to the elderly’s \npreferences to maximize his/her well being.\n\n--- PDF PAGE 50 ---\nTR Caregiving NC II \n \n-16- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n4.  Provide assistance \nwith the elderly’s \npersonal care needs  \n4.1 \nThe elderly’s personal care needs (aids to daily living) are \nidentified and assistance provided. \n4.2 \nSpecific concerns and difficulties in meeting some personal \ncare needs are identified, clarified and modified with the \nelderly in order to effectively address such concerns and \nproblem needs. \n4.3 \nAssistive devices for providing assistance for the elderly are \nidentified and used as appropriate. \n4.4 \nOrganizational policies and practices for reporting are \nfollowed as appropriate. \n4.5 \nThe elderly’s self esteem and confidence are enhanced. \n4.6 \nProvisions for interaction between the elderly and the \ncommunity are researched and developed.   \n4.7 \nDevelopmental and progressing personal care needs are \nidentified, acknowledged and provided for as appropriate. \n4.8 \nEmpathy is demonstrated in supporting and caring for the \nelderly’s feelings of grief and loss.\n\n--- PDF PAGE 51 ---\nTR Caregiving NC II \n \n-17- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Elderly rights may be \ndetailed in: \n1.1 \nService/outcomes standards documents \n1.2 \nLegislation \n1.3\nOrganizational policies and practices\n2. Short interpersonal \nexchanges \n2.1 \nChatting in friendly manner \n2.2 \nInquiring about the elderly’s health  \n2.3 \nShort casual exchanges \n2.4 \nEffective communication \n2.5 \nDialogue \n2.6\nQuestion and answer/interview techniques\n3. Needs of the elderly  \n3.1 \nPhysical, sexual \n3.2 \nFinancial \n3.3 \nHousehold assistance and maintenance \n3.4 \nReligious \n3.5 \nCultural \n3.6 \nSpiritual \n3.7 \nRecreational \n3.8 \nSocial and emotional \n3.9\nIntellectual\n4. Factors contributing \nto individual \n     difference  \n4.1 \nCulture \n4.2 \nAge \n4.3 \nEconomic \n4.4 \nSocial \n4.5 \nGender \n4.6 \nPhysical \n4.7 \nIntellectual \n4.8 \nLanguage \n4.9 \nSpiritual \n4.10\nMarital Status\n5. Assistance  \n5.1 \nProviding information and advice \n5.2 \nAccompanying or providing specific services \n5.3 \nEncouragement and support for decisions and actions \n5.4\nCompanionship\n6. Maximum well being  \n6.1 \nIndependent living \n6.2 \nObservation of own customs and cultural practices coming \nand going from environment with safety \n6.3 \nBelonging to social groups \n6.4 \nFrequent visits to and from family, relatives and friends \n6.5 \nCompanionship \n6.6\nEfficient care from caregiver\n7. Personal care needs  \n7.1 \nDaily living including: \n7.1.1 Maintaining personal safety \n7.1.2 Communication (speech, writing, non-verbal \ncommunication) \n7.1.3 Eating and drinking \n7.1.4 Eliminating \n7.1.5 Breathing \n7.1.6 Mobilizing and transferring (moving from place to place \nand position to position) \n7.1.7 Attending to personal hygiene (bathing, laundering \npersonal linen)\n\n--- PDF PAGE 52 ---\nTR Caregiving NC II \n \n-18- \nVARIABLE \nRANGE \n7.1.8 Dressing and undressing \n7.1.9 Attending to own spiritual needs \n7.1.10 Grooming and expressing sexuality \n7.1.11 Toileting \n7.1.12 Keeping appointments (Doctors, Dentists, Bankers, \nLawyers) \n7.1.13 SPICE (Spice, Physical, Intellectual, Creative and \nEmotional) activities \n7.2 \nDaily Routine \n7.2.1 Accessing education and employment \n7.2.2 Accessing financial resources and allowances \n7.2.3 Paying bills and regular outgoings \n7.2.4 Shopping \n7.2.5 Preparing meals \n7.2.6 Climbing stairs \n7.2.7 Maintaining household (cleaning, laundry, décor, \nrepair) \n7.2.8 Traveling by private and public transport \n7.2.9 Interacting with others and socializing \n7.2.10 Accessing leisure, recreational and sporting activities \n7.3 \nAssisting with self-administration of medication according to: \n7.3.1 Organizational practice and policy \n7.3.2 Government regulation, policy and legislation \n7.3.3 Instructions from the elderly, their trustees, medical \nteam and significant others \n7.4 \nPhysical comfort and rest \n7.4.1 Appropriate rest \n7.4.2 Proper clothing \n7.4.3 Fit dentures \n7.4.4 Aids (wheelchairs, braces, walker, reading glasses) \n7.4.5 Comfortable bed and chair \n7.5 \nPrivacy \n7.6 \nConfidentiality \n7.7 \nTo be treated in a dignified, safe and comfortable manner  \n7.8\nTo express success, satisfied or own feelings\n8. Assistive Devices \n8.1 \nWheelchair \n8.2 \nWalker \n8.3 \nCane \n8.4 \nCrutches \n8.5 \nParallel Bars \n8.6 \nFeeding Utensils \n8.7 \nHandrails \n8.9 \nCommode \n8.10\nReading Materials\n9. Appropriate \ncommunication and \nrelationship building \nprocesses  \n9.1 \nCourtesy \n9.2 \nEmpathy \n9.3 \nNon judgmental manner \n9.4 \nListening \n9.5 \nTreating the elderly person as an individual \n9.6 \nRespect for difference \n9.6.1 Cultural \n9.6.2 Physical \n9.6.3 Emotional\n\n--- PDF PAGE 53 ---\nTR Caregiving NC II \n \n-19- \nVARIABLE \nRANGE \n9.6.4 Beliefs \n9.6.5 Customs \n9.6.6 Values \n9.6.7 Religions\n10  Assistance may vary \naccording to: \n10.1 The ability of the worker \n10.2 Mental well being \n10.3 Physical well being \n10.4 Social well being \n10.5 Emotional well being \n10.6\nCreative well being\n11. Factual information \nto identify the \nelderly’s preferences \nmay be gathered by: \n11.1 Asking questions \n11.2 Observing the elderly \n11.3 Asking for clarification from the elderly \n11.4 Asking other significant people such as relatives, friends, staff \n11.5 Listening for relevant information concerning the elderly’s \npreferences \n11.6 Offering choices and suggestions \n11.7 Consulting professionals’ opinions and suggestions for the \nelderly to consider\n12. Assistance may vary \naccording to: \n12.1 The ability of the worker \n12.2 Mental well being \n12.3 Physical well being \n12.4 Social well being \n12.5 Emotional well being \n12.6\nCreative well being\n13. Processes and aides \nmay include: \n13.1 Meals on wheels \n13.2 All equipment and aids \n13.3 Transport services \n13.4 Around the clock caregiver \n13.5 Occasional caregiver \n13.6 Senior lodges accommodation \n13.7\nTrips to or visits from medical team\n14. Reporting may \ninclude: \n14.1 Changes in appearance and behavior in accordance with \nreporting instructions \n14.2 Medicine chart \n14.3 Observation log book \n14.4\nIncident and Accident Reports\n15. Reporting may be to:\n15.1 Supervisors \n15.2 Colleagues \n15.3 Health workers \n15.4 Administrator \n15.5 Health care services \n15.6 Emergency services \n15.7 Community care \n15.8 Social services \n15.9\nRelatives\n16. Reporting may be \nvia: \n16.1 Telephone \n16.2 Hand over reports \n16.3 Face to face \n16.4\nWritten\n\n--- PDF PAGE 54 ---\nTR Caregiving NC II \n \n-20- \nVARIABLE \nRANGE \n17. Social and personal \nwell being may \ninclude: \n17.1 Being independent \n17.2   Maintenance of personal contacts \n17.3 Control of financial affairs \n17.4 Coming and going from environment within safety \nrequirements \n17.5 Observation of own customs and cultural practices \n17.6 Exercising legal, social and other obligations and \nresponsibilities \n17.7 Keeping and maintaining personal possessions \n17.8 Privacy \n17.9 Access and entitlement to respite and other services \n17.10  Maintaining  community participation \n17.11 Participation in programs and activities \n17.12 Sharing knowledge and skills\n18. Well being may vary \naccording to: \n18.1 Service provision environment e.g. independent living, \nresidential care facility, day center \n18.2 Health Status \n18.3 Worker’s Role \n18.4\nSPICE Status\n19. Provision of aids \nmay include:\n19.1 Referral to advisory centers \n19.2\nInformation\n20. Spiritual needs may \ninclude: \n20.1 Formal and informal religious observance \n20.2 Need for private time and space for contemplation \n20.3\nCeremonial Observances\n21. Aids may include: \n21.1 Mobility \n21.2 Hearing \n21.3 Speech \n21.4\nVision\n22. The elderly’s self \nesteem and \n       confidence may be \nencouraged by:\n22.1 Assisting the elderly with difficult tasks \n22.2 Clarifying and discussing the elderly’s abilities and disabilities \n22.3 Encouraging the elderly to try new activities \n23. Psychological needs \n23.1 Freedom from undue stress \n23.2 Self-esteem \n23.3 Purpose \n23.4 Personal identity \n23.5\nLife stage development\n\n--- PDF PAGE 55 ---\nTR Caregiving NC II \n \n-21-"
