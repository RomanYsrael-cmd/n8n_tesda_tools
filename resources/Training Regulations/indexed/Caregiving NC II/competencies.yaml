          "source_text": "1. Establish and \nmaintain appropriate \nrelationship with \npeople with  special \nneeds \n1.1 \nAll dealings with people with special needs are aimed at \ngenerating a trusting relationship which include protecting \nconfidentiality, privacy, individual choices and the right to \ndecision making. \n1.2 \nRespect for individual differences is demonstrated in all \ndealings with people with special needs. \n1.3 \nSupport for the interests, rights and decision making of people \nwith special needs is demonstrated in all dealings. \n1.4 \nPeople with special needs are actively  encouraged and \nsupported to communicate ideas, feelings and preferences. \n2. Provide appropriate \nsupport to people \nwith special needs \n2.1 \nAll support to people with special needs are provided in \naccordance with their needs, rights and self determination. \n2.2 \nAssistance is provided to people with disabilities according to \nthe employment organization guidelines. \n2.3 \nInformation required by people with special needs are \nidentified and provided. \n2.4 \nReactions and limitations regarding differences are \nrecognized and appropriate assistance is sought to ensure \nthat the rights of people with special needs are upheld. \n3. Assist in maintaining \nwell being of people \nwith special needs. \n3.1 \nPeople  with special needs are provided with support in \nmaintaining a clean, safe and comfortable environment. \n3.2 \nSituations of risk to health and safety are responded to in \naccordance with established and approved health and \nsafety procedures. \n3.3 \nPeople with special needs are actively encouraged to practice \nself expression. \n3.4 \nRights and responsibilities of people with special needs are \ndiscussed with them professionally and in a non-threatening \nand non-critical ways. \n3.5 \nStrategies are developed for people with special needs to \nassert self terms of accomplishments and achievements.\n\n--- PDF PAGE 58 ---\nTR Caregiving NC II \n \n-24- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n4. Assist people with \nspecial needs to \nidentify and meet \ntheir needs \n4.1 \nThe dignity, privacy and personal choice of people with \nspecial needs in relation to needs are upheld. \n4.2 \nPeople with special needs are assisted to identify, select and \nprioritize their specified nursing needs. \n4.3 \n People with special needs are assisted to identify, select, \nprioritize and fulfill or implement their social, physical, \nintellectual, creative and emotional activities. \n4.4 \nPeople with special needs are assisted to select and develop \nstrategies to meet their requirements in order to achieve their \nnursing needs. \n5. Assist people with \nspecial \nneeds \nin \nmaintaining \nan \nenvironment \nthat \nenables \nmaximum \nindependent living \n5.1 \nThe types, frequency and triggers of challenging behaviors of \na person with special needs are identified, assessed and \nresearched. \n5.2 \nStrategies for the prevention and management of \nchallenging behavior/s are planned and implemented \naccording to approved safety procedures. \n5.3 \nPeople with special needs are encouraged and supported to \nexpress self. \n5.4 \nIndependent thinking (such as decision, opinion and \npreferences) by people with special needs are encouraged \nand supported. \n5.5 \nStrategies that would promote independence of people with \nspecial needs are developed and implemented.\n\n--- PDF PAGE 59 ---\nTR Caregiving NC II \n \n-25- \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Tools and equipment \n1.1 \nBed with side rails \n1.2 \nNight Light \n1.3 \nHandrails \n1.4 \nAssistive device (wheelchair, cane, walker and crutches \n1.5 \nCommode \n1.6 \nFeeding Utensils \n1.7 \nClock \n1.8 \nReading Materials \n1.9 \nActivity Kit \n2. Individual differences \n2.1 \nDaily living such as: \n2.1.1 \nCulture \n2.1.2 \nAge \n2.1.3 \nEconomic \n2.1.4 \nSocial \n2.1.5 \nGender \n2.1.6 \nPhysical \n2.1.7 \nEmotional \n2.1.8 \nIntellectual \n2.1.9 \nLanguage \n2.2 \nRights may be detailed in: \n2.2.1 Service/outcomes standards \n2.2.2 Legislation \n2.2.3 Organizational policies and practice \n2.3 \nSupport will be in the Context for services offered including: \n2.3.1 Personal support \n2.3.2 Employment support \n2.3.3 Community access \n2.3.4   Accommodation support \n2.3.5 Lifestyle support \n3. Assistance  \n3.1 \nProviding information \n3.2 \nAssistance with mobility or providing specific support such as \ntransport \n3.3 \nEncouragement and support for decisions and and actions \n3.4 \nGeneral household assistance and maintenance \n4.  Differences \n4.1 \nIndividual (age, gender, ability, history, personal preferences) \n4.2 \nCultural \n4.3 \nSpiritual \n4.4 \nSexual preference \n5.  Rights  \n5.1 \nChoose for oneself\n\n--- PDF PAGE 60 ---\nTR Caregiving NC II \n \n-26- \nVARIABLE \nRANGE \n5.2 \nHave meaningful work \n5.3 \nPrivacy \n5.4 \nDignity \n5.5 \nConfidentiality \n5.6 \nSelf determination \n5.7 \nAppropriate support \n5.8 \nSkill development \n5.9 \nAdvocacy \n5.10 Being treated as a valued individual \n5.11 Fair treatment \n5.12 Right to enter into a relationship \n5.13 Right to express sexuality \n6.  Responsibilities \n      \n6.1 \nAct within the law \n6.2 \nTreat others with consideration and respect \n6.3 \nAbide by family obligations \n6.4 \nAbide by the policies and procedures of the services being \nused \n7. Personal needs may \ninclude providing \nassistance with: \n7.1 \nDaily living including: \n     7.1.1   Maintaining personal safety \n7.1.2Communication (speech, writing, non- \nverbal communication) \n     7.1.3   Eating and drinking \n     7.1.4   Eliminating \n     7.1.5   Breathing \n7.1.6   Mobilizing and transferring (moving \nfrom place to place and position to position) \n7.1.7  Attending to personal hygiene (bath- \ning, laundering personal linen) \n     7.1.8   Dressing and undressing \n     7.1.9   Attending own spiritual needs \n           7.1.10 Grooming and expressing sexuality \n7.2 \nPhysical/instrumental activities of daily living: \n7.2.1 Accessing education and employment \n7.2.2 Accessing financial resources and allowances \n7.2.3  Paying bills and regular outgoings \n7.2.4  Shopping \n7.2.5  Preparing meals \n7.2.6  Climbing stairs \n7.2.7  Maintaining household (cleaning, laundry, décor, \nrepairs) \n7.2.8  Traveling by private and public transport\n\n--- PDF PAGE 61 ---\nTR Caregiving NC II \n \n-27- \nVARIABLE \nRANGE \n7.2.9 Interacting with others and socializing \n7.2.10 Accessing leisure, recreational and sporting activities \n7.3 \nAssisting with self-administration of medication according to: \n7.3.1 Organizational practice and policy \n7.3.2 Government regulation,  policy and legislation \n7.4 \nPhysical comfort and rest \n7.5 \nPain management \n7.6 \nMaximization of independence and personal preferences \n7.7 \nEmpowerment  e.g. Enhancing of clients ability to \ncommunicate, act independently and uphold rights and \nresponsibilities \n8. Strategies to meet \nneeds  \n8.1 \nResponding to requirements arising from differences \n8.2 \nUtilizing personal support equipment e.g. chair lifts, \nwheelchairs, hearing impaired phones, etc. \n8.3 \nEnlisting specialist skills \n9. Support may be \nprovided: \n9.1 \nIn the clients home \n9.2 \nAt residential or other services \n10. Relevant legislation \nand policies on health \nand safety \n10.1 Occupational health and safety \n10.2 State health acts \n10.3 EEO legislation \n10.4 Organizational policies and guidelines \n10.5 Daily living \n10.6 Medications \n10.7 Dealing with changes in physical or mental well being \n10.8 Occupational Health and Safety \n10.9 Sexual Harassment \n10.10 Abuse prevention \n11. Prevention and \nmanagement of \nchallenging behavior  \n11.1 Recognizing triggers and deflecting them \n11.2 Using active listening and observation skills \n11.3 Ensuring effective communication \n11.4 Seeking expert assistance\n\n--- PDF PAGE 62 ---\nTR Caregiving NC II \n \n-28-"
