83 ---\nTR Caregiving NC II\n\n-49-\nUNIT OF COMPETENCY :\nPREPARE HOT AND COLD MEALS/FOOD\n\nUNIT CODE\n:\nHCS323311\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in cooking basic\nhot food and cold meals. It includes preparation of ingredients,\ncooking meals and dishes according to recipes, present, prepare\ncooked dishes/sauces, preparation of appetizers, butter designs,\ndesserts, salads, sandwiches, sauces, dressing garnishes and\npreparing centers pieces.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare ingredients\naccording to recipes\n\n1.1\nIngredients are purchased in accordance with purchase list.\n1.2\n“Mise en place” is checked as per SOPs.\n1.3\nThawing is prepared according to thawing procedures.\n1.4\nMeat are prepared according to procedures and prescribed\nrecipe.\n1.5\nVegetables are prepared according to the manner of\npreparation.\n1.6\nSeafood are prepared according to method of preparation.\n2. Cook meals and\ndishes according to\nrecipes\n2.1\nSoup is cooked as per menu.\n2.2\nVegetable dishes are cooked according to recipe.\n2.3\nMeat dishes are cooked according to culinary Method.\n2.4\nPoultry and game dishes are cooked according to recipe.\n2.5\nSea food dishes are cooked according to recipe\n2.6\nEgg dishes are cooked according to client’s preference\n2.7\nPasta grain and farinaceous dishes are cooked according to\nrecipe\n3. Present cooked\ndishes\n3.1\nServing portion is standardized.\n3.2\n Presentation of cooked dishes are developed and corrected\nin accordance with SOPs.\n3.3\nFood quality is maintained and checked as per SOPs.\n3.4\nTime and temperature condition of foods is ensured before\nserving based on freezing temperature.\n4. Prepare sauces,\ndressings and\ngarnishes\n4.1\nMaterials, equipment/utensils are prepared prior to\npreparation of sauces, dressings and garnishes as per SOPs.\n4.2\nSauces, garnishes, hot and cold dressing are prepared as per\nSOPs.\n5. Prepare Appetizers\n5.1\nD’oeuvres are prepared according to requirement and\npreference of client.\n5.2\nCanape’s are prepared according to requirement for\npreference of client.\n5.3\nFinger foods are prepared according to requirement or\npreference of client.\n\n--- PDF PAGE 84 ---\nTR Caregiving NC II\n\n-50-\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n6. Prepare desserts and\nsalads\n6.1\nMaterials, equipment/utensils used for cooking are prepared\nas per SOPs.\n6.2\nSherbets, ices and ice cream are prepared in accordance with\nprescribed procedures.\n6.3\nFruit desserts are prepared as per prescribed procedures.\n6.4\nPastry desserts are prepared as per prescribed procedures.\n6.5\nMousse is prepared as per prescribed procedures.\n6.6\nCold salads and molded salads are prepared as per\nprescribed procedures.\n7. Prepare sandwiches\n7.1\nHot sandwiches are prepared as per SOPs.\n7.2\nCold dressings are prepared as per SOPs.\n7.3\nHot sauces are prepared as per SOPs.\n7.4\nCold sauces are prepared as per SOPs.\n8. Store excess foods\nand ingredients\n8.1\nUnconsumed food are stored according to procedures.\n8.2\nExcess ingredients are stored according to client’s\nrequirement.\n8.3\n Proper method of refrigeration and proper storing of dry food\nis implemented as per SOPs.\n8.4\nWet and dry food ingredients are properly stored as per\nSOPs.\n9. Convert unconsumed\ncooked food\n9.1\n Unconsumed cooked food is converted/transformed into new\ndishes as per SOPs.\n9.2\nUnconsumed cooked food is store/frozen at temperature of\nzero degrees and in accordance with SOPs.\n9.3\nPacked/wrapped uncooked food are frozen at zero degrees F\ntemperature and in accordance with SOPs.\n9.4\nPacked/wrapped food for storage is prepared as per SOPs.\n9.5\nUncooked food is maintained at proper temperature and as\nper SOPs.\n\n--- PDF PAGE 85 ---\nTR Caregiving NC II\n\n-51-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.