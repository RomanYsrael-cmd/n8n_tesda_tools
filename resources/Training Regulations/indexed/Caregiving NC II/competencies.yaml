          "source_text": "1. Clean surfaces and \nfloors \n1.1 \nAppropriate removal/cleaning equipment, supplies, \nmaterials, procedures and techniques are used in \naccordance with soil and litter types and established \nprocedures. \n1.2 \nAll wastes are removed from surface based on procedures. \n1.3 \nSuitable maintenance procedures is selected and applied \nbased on identified floor types and surface textures. \n1.4 \nCleaning, polishing and sweeping are performed according to \nstandard operating procedures. \n1.5 \nCleaning, polishing and sweeping equipment, supplies and \nmaterials are used following safety procedures and \nmanufacturer’s specifications. \n1.6 \nCleaning/polishing equipment are cleaned after use in \naccordance with relevant safety procedures and \nmanufacturer’s instructions. \n1.7 \nAll cleaning, polishing, sweeping materials and equipment are \nstored as per standard operating procedures (SOPs). \n1.8\nRoutine maintenance is carried out  as per SOPs.\n2. Clean furnishing and \nfixtures \n2.1 \nFurnishings and fixtures are cleaned in accordance with \nstandard operating procedures. \n2.2 \nFurniture positioned based on comfort and convenience and \nroom lay out. \n2.3 \nEquipment is cleaned after use in accordance with relevant \nsafety and manufacturer’s instructions. \n2.4 \nAll cleaning materials and equipment are stored following \nSOPs. \n2.5 \nRoutine maintenance is carried out or arranged as per \nstandard operating procedures.\n3. Make up beds and \ncots \n3.1 \nMattress is aired, freed from and vacuumed in accordance \nwith SOPs. \n3.2 \nSoiled linens an pillowcases are replaced in accordance with \nSOPs. \n3.3 \nLinens are centered and mitered when replaced as per SOPs. \n3.4 \nBeds and cots are made-up according to prescribed \nprocedure.                  \n4. Clean toilet and \nbathroom \n4.1 \nCeilings and walls are cleaned in accordance with standard \noperating procedures and techniques. \n4.2 \nWindow edges and sills are wiped clean in accordance with \nstandard operating procedures. \n4.3 \nBath tub, lavatory and toilet bowls are scrubbed and \ndisinfected in accordance with standard operating procedures \nand techniques. \n4.4 \nAccessories are washed and cleaned in accordance with \nstandard operating procedures and techniques.\n\n--- PDF PAGE 72 ---\nTR Caregiving NC II \n \n-38- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n4.5 \nBathroom supplies are replenished and defective \naccessories replaced as per SOPs. \n4.6 \nEquipment is cleaned after use in accordance with \nmanufacturer’s instruction. \n4.7 \nAll cleaning materials and equipment are stored in a safe \nplace as per SOPs. \n4.8 \nRoutine maintenance is carried out or arranged as per \nstandard operating procedures.\n5. Sanitize rooms \n      \n5.1 \nSanitizing agents are 100% accurately measured and mixed \nin accordance with relevant safety regulations. \n5.2 \nExcess mixtures of sanitizing agents are disposed according \nto environmental requirements. \n5.3 \nRooms are sanitized in accordance with standard operating \nprocedures. \n5.4 \nEquipment is cleaned after use in accordance with \nmanufacturer’s instructions. \n5.5 \nAll cleaning materials and equipment are stored in a safe \nplace as per SOPs. \n5.6 \nRoutine maintenance is carried out or arranged as per \nstandard operating procedures.  \n6. Maintain clean room \nenvironment \n6.1 \nAll equipment and cleaning paraphernalia are checked and \nmaintained according to manufacturer’s instructions. \n6.2 \nAll wastes are removed and disposed of in accordance with \nemployer’s requirements. \n6.3 \nAll movable furniture and fittings are shifted to allow access to \nhidden dust/waste/dirt and as per SOPs. \n6.4 \nRooms are checked regularly for orderliness/tidiness in \naccordance with employer’s requirements.\n7. Clean kitchen \n7.1 \nSoiled dishes, pots, pans and linen are washed in accordance \nwith standard operating procedures. \n7.2 \nCleaned/dried dishes, pots and pans are stored as per \nstandard operating procedures. \n7.3 \nKitchen appliances are cleaned in accordance with standard \noperating procedures. \n7.4 \nKitchen fixtures, tables and chairs are wiped in accordance \nwith standard operating procedures. \n7.5 \nFloor is mopped and dried in accordance with standard \noperating procedures. \n7.6 \nKitchen supplies are inspected and replenished in \naccordance with standard operating procedures.\n\n--- PDF PAGE 73 ---\nTR Caregiving NC II \n \n-39- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Cleaning Equipment, \nSupplies and \nMaterials \n \n1.1 \nBrooms \n1.2 \nDust pan and brush \n1.3 \nCleaning implements \n1.4 \nVacuum cleaner \n1.5 \nFloor Carpet \n1.6 \nWater Hoses \n1.7 \nBucket \n1.8 \nBed \n1.9 \nDining Table \n1.10 Water Pitcher \n1.11 Table Cloth \n1.12 Flowers \n1.13 Bed Cover \n1.14 Spoon \n1.15 Fork \n1.16 Knife \n1.17 Plate \n1.18 Wine Glass \n1.19 Serving Utensils \n1.20 Table Napkin \n1.21 Paper Towel \n1.22 Flower Vase \n1.23 Drinking Water \n1.24 Serving Tray \n1.25 Soiled Table \n1.26 Cleaning Detergent \n1.27 Liquid Detergent \n1.28 Cleaning Solution \n1.29 Scrubbing Foam \n1.30 Flat Sheets \n1.31 Fitted Sheet \n1.32 Pillow \n1.33 Pillow Case \n1.34 Bed Mattress \n1.35 Dish Pan \n1.36 Dish Sponge/Dish Cloth \n1.37 Pan with Hot Water \n1.38 Rolled Newspaper \n1.39 Cleaning Rag \n1.40 Wax Paper/Aluminum Foil \n1.41 Talcum Powder \n1.42 Bowl Cleaner \n1.43 Toilet Disinfectant \n1.44 Acid Cleaner \n1.45 Cup \n1.46 Soup Plate \n1.47 Soup Bowl \n1.48 Drinking Glass/Goblet \n1.49 Serving Dish \n1.50 Rubber Spatula \n1.51\nFloor Mop\n\n--- PDF PAGE 74 ---\nTR Caregiving NC II \n \n-40- \nVARIABLE \nRANGE \n1.52 Toilet Bowl Swab \n1.53 Toilet Caddy \n1.54 Spray Bottle \n1.55 Guess Model \n1.56 Antistatic Duster/Cleaning Cloth \n1.57 Vacuum Cleaner with Circular Brushes \n1.58 Sponges \n1.59 Scourer \n1.60 Glass Cleaning Equipment \n1.61 Drop Sh