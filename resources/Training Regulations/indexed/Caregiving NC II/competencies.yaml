  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in CAREGIVING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non-verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmatters concerning working conditions of employment are\ntasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data are recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR Caregiving NC II\n\n-3-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace-to-face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1\nFace-to-face interactions\n5.2\nTelephone conversations\n5.3\nElectronic and two-way radio communication\n5.4\nWritten communication including electronic mail, memos,\ninstruction and forms\n5.5\nNon-verbal communication including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Caregiving NC II\n\n-4-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard format of\nthe organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple written\nnotices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace measures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the workplace\n3.8\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview and written test\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR Caregiving NC II\n\n-5-\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are identified\nand recognized\n2.3\nReporting relationships within team and external to team are\nidentified\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives\n3.2\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3\nObserved protocols in reporting using standard operating\nprocedures\n3.4\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Caregiving NC II\n\n-6-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgment may be\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Caregiving NC II\n\n-7-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\n Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\n Observation of the individual member in relation to the work\nactivities of the group\n5.2\n Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Caregiving NC II\n\n-8-\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra and interpersonal relationships are maintained in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated as proof\nof career advancement\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed\n\n--- PDF PAGE 13 ---\nTR Caregiving NC II\n\n-9-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\nTR Caregiving NC II\n\n-10-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the course\nof managing oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge and\nattitudes\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Caregiving NC II\n\n-11-\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedure\n2. Evaluate hazards\nand risks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold\nlimit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\n OHS issues and/or concerns and identified safety hazards\nare reported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR Caregiving NC II\n\n-12-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngases, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR Caregiving NC II\n\n-13-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value (TLV).\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge and\nattitudes\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value (TLV)\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR Caregiving NC II\n\n-14-\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nIMPLEMENT AND MONITOR INFECTION CONTROL POLICIES\nAND PROCEDURES\n\nUNIT CODE\n:\nHCS323201\n\nUNIT DESCRIPTOR\n:\nThis unit is concerned with infection control responsibilities of\nemployees with supervisory accountability to implement and\nmonitor infection control policy and procedures in a specific work\nunit or team within an organization. This unit does not apply to a\nrole with organization-wide responsibilities for infection control\npolicy and procedure development, implementation or monitoring.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide information to\nthe work group about\nthe organization’s\ninfection control\npolicies and\nprocedures\n\n1.1\nRelevant information about the organization’s infection control\npolicy and procedures, and applicable industry codes of\npractice are accurately and clearly explained to the work\ngroup.\n1.2\nInformation about identified hazards and the outcomes of\ninfection risk assessments is regularly provided to the work\ngroup.\n1.3\nOpportunity is provided for the work group to seek further\ninformation on workplace infection control issues and\npractices.\n2. Integrate the\norganization’s\ninfection control\npolicy and procedure\ninto work practices\n2.1\nInfection control policy and procedures are implemented by\nsupervisor and members of the work group.\n2.2\nLiaison is maintained with person responsible for organization-\nwide infection control.\n2.3\nThe Supervisor’s coaching support ensures that\nindividuals/teams are able to implement infection control\npractices.\n2.4\nWork procedures are adopted to reflect appropriate infection\ncontrol practice.\n2.5\nIssues raised through consultation are dealt with and resolved\npromptly or referred to the appropriate personnel for\nresolution.\n2.6\nWorkplace procedures for dealing with infection control risks\nand hazardous events are implemented whenever necessary.\n2.7\nEmployees are encouraged to report infection risks and to\nimprove infection control procedures.\n\n--- PDF PAGE 19 ---\nTR Caregiving NC II\n\n-15-\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Monitor infection\ncontrol performance\nand implement\nimprovements in\npractices\n\n3.1 Infection control hazardous events are investigated promptly\nto identify their cause in accordance with organization policy\nand procedures.\n3.2\nWork procedures to control infection risks are monitored to\nensure compliance.\n3.3\n Work procedures are regularly reviewed and adjusted to\nensure improvements in infection control practice.\n3.4\nSupervisor provides feedback to team and individuals on\ncompliance issues, changes in work procedures and infection\ncontrol outcomes.\n3.5\nTraining in work procedures is provided as required to ensure\nmaintenance of infection control standards.\n3.6\nInadequacies in work procedures and infection control\nmeasures are identified, corrected or reported to designated\npersonnel.\n3.7\nRecords of infection control risks and incidents are accurately\nmaintained as required.\n3.8\nAggregate infection control information reports are used to\nidentify hazards, to monitor an improve risk control methods\nand to indicate training needs.\n\n--- PDF PAGE 20 ---\nTR Caregiving NC II\n\n-1-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Infection Control\nPolicies and\nProcedures\n\nThis may include but not limited to:\n1.1\nCleaning procedures and schedules\n1.2\nCleaning agents\n1.3\nCleaning equipment\n1.4\nHandling, storage and disposal of all types of waste\n1.5\nFood handling and food safety\n1.6\nHygiene procedures\n1.7\nInfection control risk management\n1.8\nInfection control incident and hazard reporting\n1.9\nSterilizing\n1.10 Linen production and handling\n1.11 Maintenance procedures\n1.12 Storage requirements\n1.13 Personal protective clothing\n1.14 Work flows\n1.15 Management of blood and body fluid spills\n1.16 Single use of disposables\n1.17 Aseptic techniques\n1.18 Skin preparation procedures\n1.19 Immunization\n1.20 Needle stick injuries\n1.21 Personal contact with infectious patients\n1.22 Standard and additional precautions\n1.23 Confidentiality\n1.24 Employee training\n1.25\nContractors\n2. Industry Codes of\nPractice\n2.1\nNational Health and Medical Research Council Guidelines for\nInfection Control\n2.2\nLocal and National Government Guidelines and Standards\n2.3\nManufacturer’s recommendations and operating manuals\n3. Identified hazards\nand the outcomes of\ninfection risk\nassessments\nMay include but not limited to:\n3.1\nSharps\n3.2\nGlass\n3.3\nWaste\n3.4\nHuman waste and human tissues\n3.5\nPersonal contact with infectious patients\n3.6\nAnimals, insects and vermin\n3.7\nStock, including food, which has passed “used-by” dates\n3.8\nIncorrect concentration of disinfectants and chemicals\n3.9\nCleaning Procedures\n3.10 Linen handling procedures\n3.11 Work flows\n3.12 Use of personal protective clothing\n3.13 Food safety\n3.14\nPersonal hygiene\n\n--- PDF PAGE 21 ---\nTR Caregiving NC II\n\n-2-\n\nVARIABLE\nRANGE\n4. Infection Control\nMonitoring\nProcedures\n\n4.1 Observations\n4.2 Interviews\n4.3 Surveys and inspections\n4.4 Quality assurance activities\n4.5 Review of outcomes\n4.6 Data analysis\n5. Designated\npersonnel\n5.1 Manager\n5.2 Infection Control Coordinator\n5.3 Quality Improvement Coordinator\n5.4 Infection Control Committee\n5.5 Occupational Health and Safety Committee\n6. Aggregate infection\ncontrol information\n6.1 Records of needle stick injuries\n6.2 Hospital-acquired infection rates\n6.3 DOH healthcare standards clinical indicators\n6.4 HACCP records\n6.5 Hazard reports\n\n--- PDF PAGE 22 ---\nTR Caregiving NC II\n\n-1-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nCommunicated with team and individuals on organizational\npolicy and procedures for infection control.\n1.2\nApplied infection control policies ad procedures which impact\non work processes of the specific work unit.\n1.3\nApplied\nprocedures\nfor\nadopting\nappropriate\ninfection\npractices within work unit.\n1.4\nProvided appropriate supervision of work group\n2. Underpinning\nknowledge and\nattitudes\n2.1\nWorking knowledge, consistent with the elements of\ncompetence of the organization’s applicable infection control\npolicy and procedures and relevant industry codes of practice.\n2.2\nThe hierarchy risk control measures from most to least\npreferred, that is, elimination, engineering controls,\nadministrative control and lastly personal equipment.\n2.3\nKnowledge of infection risks and control measures in specific\nwork processes.\n2.4\nThe significance of patient confidentiality in relation to\ninfection control.\n2.5\nThe significance of other management systems and\nprocedures for infection control.\n2.6\nLiteracy levels and communication skills of work group\nmembers and consequent suitable communication\ntechniques.\n2.7\nOrganizational procedures for monitoring and training.\n2.8 Basic understanding of communicable disease transmission.\n3. Underpinning skills\n3.1\nEffective communication and interpersonal skills including:\n-\nlanguage competence\n-\nliteracy and reading competence\n3.2\nNegotiation\n3.3\nWork planning and management\n3.4\nManagement of change of work processes\n3.5\nMonitoring compliance with policy and procedures\n3.6\nMaintain and interpret infection control records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace infection control and health and safety policies and\nprocedures\n4.2 Waste management procedures\n4.3 Food safety procedures\n4.4 Other organizational policies and procedures\n4.5 Duties statements and/or job descriptions\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation\n5.2\nInterview\n5.3\nPortfolio\n5.4 Demonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 23 ---\nTR Caregiving NC II\n\n-2-\nUNIT OF COMPETENCY :\nRESPOND EFFECTIVELY TO DIFFICULT/CHALLENGING\nBEHAVIOR\n\nUNIT CODE\n:\nHCS323202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to effectively\nrespond to difficult or challenging behavior of patient.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan responses\n1.1\nResponses are planned to instances of difficult or\nchallenging behavior to maximize the availability of other\nappropriate staff and resources.\n1.2\nSpecific manifestations of difficult or challenging behavior\nare identified and strategies appropriate to these behaviors\nare planned as required.\n1.3\nSafety of self and others is given priority in responding to\ndifficult or challenging behavior according to institutional\npolicies and procedures.\n2. Apply response\n2.1\nDifficult or challenging behavior is dealt with promptly, firmly\nand diplomatically in accordance with institutional policy\nand procedures.\n2.2\nCommunication is used effectively to achieve the desired\noutcomes in responding to difficult or challenging behavior.\n2.3\nAppropriate strategies are selected to suit particular\ninstances of difficult or challenging behavior.\n3. Report and review\nincidents\n3.1\nIncidents are reported according to institutional polices and\nprocedures.\n3.2\nIncidents are reviewed with appropriate staff and suggestions\nappropriate to area of responsibility are made.\n3.3\nDebriefing mechanisms and other activities are used and\nparticipated in.\n3.4\nAdvice and assistance is sought from legitimate sources when\nappropriate.\n\n--- PDF PAGE 24 ---\nTR Caregiving NC II\n\n-3-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Planned responses\n\n1.1\nOwn ability and experience\n1.2\nEstablished institutional procedures\n1.3\nKnowledge of individual persons and underlying causes\n2. Difficult or\nchallenging behaviors\n2.1\nAggression/Assaultive behavior\n2.2\nConfusion or other cognitive impairment\n2.3\nNoisiness\n2.4\nManipulative\n2.5\nWandering\n2.6\nSelf-destructive\n2.7\nIntoxication\n2.8\nWithdrawn/depressed\n2.9\nNegativistic\n2.10 Intrusive behavior\n2.11\nVerbal offensiveness\n3. Strategies for dealing\nwith challenging\nbehaviors\n3.1 Diversional activities\n3.2 Referring to appropriate personnel e.g. supervisor, security\nofficer\n3.3 Following established emergency response procedures\n4. Selection of\nstrategies for dealing\nwith challenging\nbehaviors\n4.1\nThe nature of the incident\n4.2\nPotential effect on different parties, patient, staff and others\n4.3\nEstablished procedures and guidelines\n5. Institutional policies\nand procedures\n5.1\nIncident reporting and documentation\n5.2\nOperational guidelines for handling incidents and/or cases\ninvolving difficult and challenging behavior\n5.3\nDebriefing of staff involved in the incident\n\n--- PDF PAGE 25 ---\nTR Caregiving NC II\n\n-4-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified specific manifestations of difficult or challenging\nbehavior and strategies are planned, selected and applied as\nrequired.\n1.2\nMaintained personal safety and the safety of others.\n1.3\nReported incidents, reviewed and responded quickly and\neffectively to contingencies.\n1.4\nDebriefing mechanisms are used.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nOSH and issues relating to difficult and challenging behavior\n2.2\nPatient issues which need to be referred to an appropriate\nhealth professional\n2.3\nAbility to interpret and follow the instructions and guidance of\nhealth professionals involved with the care of patient/client\n3. Underpinning skills\n3.1\nEffectively using techniques for monitoring own service area\nincluding client satisfaction\n3.2\nSpeaking in affirm, diplomatic and culturally appropriate\nmanner\n3.3\nRemaining calm and positive in adversity\n3.4\nThinking and responding quickly and strategically\n3.5\nRemaining alert to potential incidents of difficult or challenging\nbehavior\n3.6\nMonitoring and/or maintaining security equipment\n3.7\nAbility to work with others and display empathy with patient\nand relatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nRelevant institutional policy, guidelines, procedures and\nprotocols\n4.3\nEmergency response procedures and employee support\narrangements\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 26 ---\nTR Caregiving NC II\n\n-5-\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\n\nUNIT CODE\n:\nHCS323203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this unit it\nis assumed that the First Aider is working under supervision and/or\naccording to established workplace First Aid procedures and\npolicies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\nPhysical hazards to self and casualty’s health and safety are\nidentified.\n1.2\nImmediate risks to self and casualty’s occupational health\nsafety (OSH) are minimized by controlling the hazard in\naccordance with OSH requirements.\n1.3 Casualty’s vital signs and physical condition are assessed in\naccordance with workplace procedures.\n2. Apply basic first aid\ntechniques\n2.1\nFirst Aid management is provided in accordance with\nestablished First Aid procedures.\n2.2\nCasualty is reassured in a caring and calm manner and made\ncomfortable using available resources.\n2.3\nFirst Aid assistance is sought from others in a timely manner\nand as appropriate.\n2.4\nCasualty’s condition is monitored and responded to in\naccordance with effective First Aid principles and workplace\nprocedures.\n2.5\nDetails of casualty’s physical condition, changes in conditions,\nmanagement and response are accurately recorded in line\nwith organizational procedures.\n2.6\nCasualty management is finalized according to his/her needs\nand First aid principles.\n3. Communicate details\nof the incident\n3.1 Appropriate medical assistance is requested using relevant\ncommunication media and equipment.\n3.2 Details of casualty’s condition and management activities are\naccurately conveyed to emergency services/relieving\npersonnel.\n3.3 Reports to supervisors are prepared in a timely manner,\npresenting all relevant facts according to established company\nprocedures.\n\n--- PDF PAGE 27 ---\nTR Caregiving NC II\n\n-1-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. First Aid\nManagement\n\nThis may include but not limited to:\n1.1 Workplace policies and procedures\n1.2 Industry/site specific regulations, codes\n1.3 OSH\n1.4 State and territory workplace health and safety requirements\n1.5 Allergies the casualty may have\n2. Physical Hazards\nThis may include but not limited to:\n2.1\nWorkplace hazards\n2.2\nEnvironmental hazards\n2.3\nProximity of other people\n2.4\nHazards associated with casualty management processes\n3. Risks\nMay include but not limited to:\n3.1 Worksite equipment, machinery and substances\n3.2 Environmental risks\n3.3 Bodily fluids\n3.4 Risk of further injury to the casualty\n3.5 Risk associated with the proximity of the others and\nbystanders\n4. Casualty’s Condition\nMay include but not limited to:\n4.1\nAbdominal injuries\n4.2\nAllergic reactions\n4.3\nBleeding\n4.4\nBurns-thermal, chemical, friction, electrical\n4.5\nCardiac conditions\n4.6\nChemical contamination\n4.7\nCod injuries\n4.8\nCrush injuries\n4.9\nDislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n5. Equipment and\nResources\n5.1\nDefibrillation units\n5.2\nPressure bandages\n5.3\nThermometers\n5.4\nFirst Aid Kit\n5.5\nEyewash\n5.6\nThermal Blankets\n5.7\nPocket Face Masks\n5.8\nRubber Gloves\n5.9\nDressing\n\n--- PDF PAGE 28 ---\nTR Caregiving NC II\n\n-1-\n\nVARIABLE\nRANGE\n\n5.10 Space Device\n5.11 Cervical Collars\n6. Communication\nSystem\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo-way radio\n6.7\nEmail\n6.8\nElectronic equipment\n7. Vital signs\n7.1\nBreathing\n7.2\nCirculation\n7.3\nConsciousness\n8. First Aid Principles\n8.1\nChecking the site for danger to self, casualty and others and\nminimizing the danger\n8.2\nChecking and maintaining the casualty’s airways, breathing\nand circulation\n\n--- PDF PAGE 29 ---\nTR Caregiving NC II\n\n-1-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH laws infections\ncontrol and manual handling procedures and relevant health\norganizations.\n1.2\nIdentified physical hazards of the casualty and minimized\nimmediate risks.\n1.3\nAssessed and monitored the physical condition of the\ncasualty.\n1.4\nResponded to emergency using basic life support measures.\n1.5\nProvided initial response where First aid is required.\n1.6\nDealt with complex casualties or incident.\n1.7\nPrepared reports to concerned personnel in a timely manner.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (SOPs)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the First Aider’s skills limitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material safety data\nsheets\n3. Underpinning skills\n3.1 Resuscitation\n3.2 Safe manual handling of casualty\n3.3 Consideration of the welfare of the casualty\n3.4 Report preparation\n3.5 Communication skills\n3.6 Ability to interpret and use listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Access to relevant work station\n4.2\nRelevant institutional policy, guidelines, procedures and\nprotocols\n4.3\nEquipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Interview\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 30 ---\nTR Caregiving NC II\n\n-1-\nUNIT OF COMPETENCY :\nMAINTAIN HIGH STANDARDS OF PATIENT SERVICES\n\nUNIT CODE\n:\nHCS323204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\nmaintenance of high standards of patient services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\nappropriately with\npatients\n1.1\nEffective communication strategies and techniques are\nidentified and used to achieve best patient service outcomes.\n1.2\nComplaints are responded to in accordance with\norganizational policy to ensure best service to patients.\n1.3\nComplaints are dealt with in accordance with established\nprocedures.\n1.4\nInterpreter services are accessed as required.\n1.5\nAction is taken to resolve conflicts either directly, where a\npositive outcome can be immediately achieved, or by referral\nto the appropriate personnel.\n1.6\nParticipation in work team is constructive and collaborative\nand demonstrates an understanding of own role.\n2. Establish and\nmaintain good\ninterpersonal\nrelationship with\npatients\n2.1\nRapport is established to ensure the service is appropriate to\nand in the best interests of patients.\n2.2\nEffective listening skills are used to ensure a high level of\neffective communication and quality of service.\n2.3 Patient concerns and needs are correctly identified and\nresponded to responsibility and accordingly established\nprocedures and guidelines.\n2.4 Effectiveness of interpersonal interaction is consistently\nmonitored and evaluated to ensure best patient service\noutcomes.\n3. Act in a respectful\nmanner at all times\n3.1 Respect for differences is positively, actively and\nconsistently demonstrated in all work.\n3.2 Confidentiality and privacy of patients is maintained.\n3.3 Courtesy is demonstrated in all interactions with patients,\nvisitors, carers and family.\n3.4 Assistance with the care of patients with challenging\nbehaviors is provided in accordance with established\nprocedures.\n3.5 Techniques are used to manage and minimize aggression.\n\n--- PDF PAGE 31 ---\nTR Caregiving NC II\n\n-1-\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Evaluate own work to\nmaintain a high\nstandard of patient\nservice\n4.1\nAdvice and assistance is received or sought from appropriate\nsources on own performance.\n4.2 Own work is adjusted, incorporating recommendations that\naddress performance issues, to maintain the agreed standard\nof patient support.\n\n--- PDF PAGE 32 ---\nTR Caregiving NC II\n\n-1-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patients\n\nThis may include but not limited to:\n1.1\nPatients\n\n1.2\nProspective patients to the service/s\n\n1.3\nPatient may be in contact with the institution through\nappropriate health care personnel and professionals or other\nadvocates or agencies\n2. Others with whom\ninteraction is required\nin regard to patient\nservices\n2.1\nOther staff and team members\n\n2.2\nService units or departments\n\n2.3\nFamily members, carers and friends of patients\n\n2.4\nProfessional representatives or agents of patients such as:\n-\nMedical specialists\n-\nNurses\n-\nSocial workers\n-\nDietitians\n-\nTherapists\n-\nAllied health professionals\n-\nVolunteers\n-\nTeachers and/or spiritual\n-\nCommunity\n\n2.5 General Public\n3. Communication\n3.1 English/Tagalog/Vernacular\n\n3.2 Sign language\n\n3.3 Through an interpreter\n\n3.4 Community language as required by the service/organization\n4. Modes of\ncommunication\n4.1 Continuing interaction with patients and clients\n\n4.2 Verbal conversations either in person or via telephone\n\n4.3 Written notes by post or electronic media\n\n4.4\n Worker, family member friend or professional interpreter who\nhas relevant languages\n5. Respect for\ndifference\n5.1 Physical\n\n5.2 Cognitive/mental or intellectual issues that may impact on\ncommunication\n\n--- PDF PAGE 33 ---\nTR Caregiving NC II\n\n-1-\n\nVARIABLE\nRANGE\n\n5.3 Cultural and ethnic\n\n5.4 Religious/spiritual\n\n5.5 Social\n\n5.6 Age\n\n5.7 Language literacy and numeracy abilities\n\n5.8 Sexuality and sexual preference\n6. Confidentiality and\nprivacy of patients\n6.1\nFees\n\n6.2\nHealth fund entitlements\n\n6.3\nWelfare entitlements\n\n6.4\nPayment methods and records\n\n6.5\nPublic environments\n\n6.6\nLegal and ethical requirements\n\n6.7\nWriting details (i.e. medical and consent forms)\n\n6.8\nConversations on the telephone\n\n6.9\nSecure location for written records\n\n6.10 Offering a private location for discussions\n\n6.11 Information disclosed to an appropriate person consistent with\none’s level of responsibility\n7. Performance\nmonitoring\n7.1\nSelf-monitoring\n\n7.2\nSupervisor assessment\n\n7.3\nPatient feedback\n\n--- PDF PAGE 34 ---\nTR Caregiving NC II\n\n-1-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Communicated appropriately with patients\n1.2 Handled complaints and resolved conflict, or referred matters\nto supervisors when required.\n1.3 Complied with relevant policies, protocols, guidelines and\nprocedures of the organization.\n1.4\nEstablished and maintained good interpersonal relationship\nwith patients\n1.5\nDemonstrated courtesy in all interactions with patients, their\nvisitors and family.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nRoles and responsibilities of self and other workers within the\norganization\n2.2\nWhen client/patient issues need to be referred to an\nappropriate health professional\n2.3\nOrganizational policies and procedures for privacy and\nconfidentiality of information provided by patients and others\n2.4\nKnowledge of cultures relevant to the particular service\n2.5\nInstitutional policy on patient rights and responsibilities\n3. Underpinning skills\n3.1 Establishing and maintaining relationships taking into account\nindividual differences\n3.2 Using effective listening techniques\n3.3 Using appropriate verbal and non verbal communication\nstyles\n3.4 Ability to interpret and follow the instructions and guidance of\nhealth professionals involved with the care of patients/clients\n3.5 Oral and written communication\n3.6 Problem solving skills required include the ability to use\navailable resources and prioritize workload\n3.7 Ability to deal with conflict\n3.8\nAbility to work with others and display empathy with patient\nand relatives\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\n Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place.\n4.2\nRelevant government and organizational policy, guidelines,\nprocedures and protocols.\n4.3 Any relevant legislation in relation to service delivery.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Interview\n5.3 Third Party Report\n6. Context of\nassessment\n6.1 Assessment may be done in a simulated workplace setting.\n\n--- PDF PAGE 35 ---\nTR Caregiving NC II\n\n-1-\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPROVIDE CARE AND SUPPORT TO INFANTS AND TODDLERS\nUNIT CODE\n: HCS323301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide care and support to infants and toddlers ages from birth to\nthree years.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Comfort infants and\ntoddlers\n1.1\nTools and equipment are prepared according to the need of\nthe infant/toddler.\n1.2\nDistressed infants and toddlers are responded to based\non appropriate methods, activity and non-verbal cues.\n1.3\nInfants and toddlers are picked up and cuddled according to\nprocedure.\n2. Bathe and dress\ninfants and toddlers\n2.1\nInfants and toddlers’ vital signs are checked based on\nprocedure.\n2.2.\nWater quantity and temperature are checked as per\nrequirement.\n2.3\nInfants and toddlers are bathed according to procedure.\n2.4\nComforters are made available to infant and toddler when\nneeded.\n3. Feed infants and\ntoddlers\n3.1\nInfants and toddlers’ feeding bottles are cleaned and sterilized\nas needed.\n3.2\nMilk formula is prepared as prescribed.\n4. Put infants and\ntoddlers to sleep\n4.1\nInfants and toddlers’ crib is prepared based on procedure.\n4.2\nInfants and toddlers are put to sleep based on procedure.\n5. Enhance social,\nphysical, intellectual,\ncreative and\nemotional activities of\ninfants and toddlers\n5.1\nInfants and toddlers are exposed to family members, relatives\nand playmates for communication and interaction purposes.\n5.2\nInfants/toddlers are provided with manipulative or creative toys\nand games as needed.\n5.3\nInfants/toddlers are given exercise activities as required.\n\n--- PDF PAGE 36 ---\nTR Caregiving NC II\n\n-2-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and Equipment\n1.1\nInfants crib/bed\n1.2\nBlanket/comforters\n1.3\nInfant carrier\n1.4\nStroller\n1.5\nBassinet\n1.6\nBathing paraphernalia (e.g. Baby bath tub, baby toiletries,\ntowel, etc.)\n1.7\nBaby’s Layettes\n1.8\nFeeding bottles with cap, ring and nipple\n1.9\nThermometer\n1.10 Thermometer Tray\n1.11 Sterilizer\n1.12 Infant’s/Toddler’s Formula\n1.13 Bibs\n1.14 Nursery Rhymes\n1.15 Toys for the Crib (Mobile)\n1.16 Infants/Toddlers Toys\n1.17 Story Books\n2. Appropriate method\nor Activities\n2.1\nImitating babies’ vocalizations\n2.2\nTalking\n2.3\nSinging\n2.4\nLaughing\n2.5\nRhymes\n2.6\nFinger Games\n2.7\nHolding\n2.8\nDancing\n2.9\nGentle Bouncing\n2.10 Substituting Activities\n2.11 Playing\n2.12 Distraction to an activity\n2.13 Cuddles, comfort\n2.14 Listening, talking with the infant or toddler quietly\n2.15 Use of transition object\n3. Infants/toddlers may\nshow distress by:\n3.1\nCrying\n3.2\nAppearing withdrawn\n3.3\nSquirming\n3.4\nLack of eye contact\n3.5\nSleeping difficulties\n3.6 Whining\n\n--- PDF PAGE 37 ---\nTR Caregiving NC II\n\n-3-\nVARIABLE\nRANGE\n3.7 Not playing or not playing creatively\n3.8 Repetitive display of trauma\n3.9 Aggression\n3.10 Regression\n3.11 Speech difficulties (e.g. Stuttering)\n3.12 Toilet training difficulties\n3.13 Nervous tics (e.g. Cough)\n3.14 Hunger\n3.15 Tiredness\n3.16 Discomfort\n3.17 Fear\n3.18 Anxiety\n3.19 Boredom\n3.20 Clinging behavior\n4. Non Verbal Cues\n4.1\nCues to indicate distress\n4.2\nResponse to an interesting activity\n4.3\nSmiling\n4.4\nCues that express a desire to engage in an activity of\ninteraction\n5. Comforters\n5.1\nSpecial toys\n5.2\nBlankets\n5.3\nDummies\n\n--- PDF PAGE 38 ---\nTR Caregiving NC II\n\n-4-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\n Responded to distressed infants and toddlers in a relaxed\nand calm manner.\n1.2\nTook vital signs, bathed and dressed/undressed infant/toddler.\n1.3\nPrepared milk formula and fed infant as prescribed.\n1.4\nCleaned and sterilized feeding bottles.\n1.5\nPut infants/toddlers to sleep.\n1.6\nEnhanced social, physical, intellectual, creative and emotional\nactivities of the infant/toddler.\n1.7\nDemonstrated the ability to assess infants/toddlers’ needs\nappropriately.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nThe Dependent Nature of Infants/Toddlers\n2.2\nBathing Paraphernalia and ; Types, Uses, Specification\n2.3\nProcedures in Taking Vital Signs\n2.4\nBasic Infant Care\n2.5\nProcedures in Bathing and Dressing/Undressing of infants\n2.6\nInfant Diet\n2.7\nProcedures in Feeding\n2.8\nTypes and Uses of Clothes and Underwear\n2.9\nSpecifications and Uses of Non-Slip Rubber Mat\n2.10 Hand Washing Procedures\n2.11 Specifications of Different Types of Thermometer\n2.12 Table Etiquette\n2.13\nSigns of Infants/Toddlers Distress\n3. Underpinning skills\n3.1\nCommunication Skills ( listening, speaking, verbal and non-\nverbal)\n3.2\nEmpathy\n3.3\nInterpersonal Skills\n3.4\nCreative Skills\n3.5\nAbility to establish bonding with infant/toddler\n3.6\nBasic Measurement\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A childcare workplace\n4.2 Facilities, equipment and materials relevant to the unit of\ncompetency\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 39 ---\nTR Caregiving NC II\n\n-5-\nUNIT OF COMPETENCY :\nPROVIDE CARE AND SUPPORT TO CHILDREN\n\nUNIT CODE\n:\nHCS323302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide care and support to children between three (3) years old\nand twelve (12) years old.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Instill personal\nhygiene practices to\nchildren\n1.1\nHygiene practices are explained clearly to children based on\nestablished procedures.\n1.2\nPersonal hygiene procedure is demonstrated to children\nbased on health and safety procedures.\n1.3\nChildren paraphernalia are maintained based on healthy\nprocedures.\n2. Bathe and dress\nchildren\n2.1\nChildren’s vital signs are checked before bathing based on\nprocedures.\n2.2\nBathing paraphernalia are prepared as per procedure.\n2.3\nBath water quantity and temperature are checked based on\nhealth requirements of the child.\n2.4\nChildren are assisted in dressing up according to prevailing\nweather condition\n2.5\nChildren’s preferences and decisions are acknowledged,\nrespected and followed whenever appropriate and possible\n2.6\nChildren with difficult behavior in bathing are dealt with\nappropriately as per procedure.\n3. Feed children\n3.1 Nutritional requirements of children are determined\naccording to their developmental stage.\n3.2\nMenu is prepared in accordance with children’s nutritional and\ncultural requirements.\n3.3\nAppetizing food and drink are prepared and served\nsufficiently and appropriately according to the child’s health\nneeds and preferences.\n3.4\nChildren are fed following healthy procedures.\n\n--- PDF PAGE 40 ---\nTR Caregiving NC II\n\n-6-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Children’s\nparaphernalia\n1.1\nBathing paraphernalia and toiletries\n1.2\nDiaper\n1.3\nClothes\n1.4\nGrooming Kit (baby hairbrush, comb, nail scissors)\n1.5\nOral Hygiene (toothbrush, toothpaste)\n1.6\nFeeding Utensils\n1.7\nBibs\n1.8\nHigh Chair/Booster Seat/Portable Seat\n1.9\nThermometer\n1.10 Thermometer Tray\n2. Nutritional\nrequirements\n2.1\nNutritious food\n2.2\nBalance Diet\n2.3\nRelevant nutritional needs according to age level\n3. Menu\n3.1\nBreakfast\n3.2\nLunch\n3.3\nDinner\n3.4\nSnacks\n4. Cultural requirements 4.1\nMeal patterns over a day\n4.2\nDrinks provided\n4.3\nFoods used\n4.4\nHot or cold meals\n4.5\nSpices and flavorings used\n4.6\nInclusion of sweets\n5. Appetizing food\n 5.1\nColor\n 5.2\nShape\n 5.3\nTexture\n 5.4\nVariety\n6. Health needs of\nchildren\n6.1\nMedical advice and diet\n6.2\nAllergies to certain foods\n7. Food and drink\npreferences\n\n7.1\nCulture\n7.2\nDietary Requirements\n7.3\nReligion\n7.4\nAge\n7.5\nFamily Patterns\n7.6\nIndividual Tastes\n7.7\nStage of the Day\n\n--- PDF PAGE 41 ---\nTR Caregiving NC II\n\n-7-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment may requires evidence that the candidate:\n1.1\nDemonstrated ability to prepare nutritious foods suitable for\nchildren.\n1.2\nInstilled personal hygiene practices to children.\n1.3\nTook vital signs before bathing the child.\n1.4\nDemonstrated feeding procedures.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nBathing and Dressing/Undressing Procedures\n2.2\nProcedures of Feeding Children\n2.3\nProcedures in Taking Vital Signs\n2.4\nProper Health Care of Children\n2.5\nHand Washing Procedures\n2.6\nTable Etiquette\n2.7\nGood Grooming\n2.8\nNutritional Needs of Children\n2.9\nFat Contents of Foods\n2.10 Dietary Requirements for Infants\n2.11 Cultural Practices and Beliefs about Food Provision\n2.12 Impact of Foods and Drinks on Dental Health\n2.13 Storage of Food – Temperatures\n2.14 Food Preparation and Cooking\n3. Underpinning skills\n3.1\nCooking and Preparing Food\n3.2\nMenu Planning\n3.3\nBasic Measurements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA childcare workplace\n4.2\nFacilities, equipment and materials relevant to the unit of\ncompetency\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 42 ---\nTR Caregiving NC II\n\n-8-\nUNIT OF COMPETENCY :\nFOSTER THE SOCIAL, INTELLECTUAL, CREATIVE AND\nEMOTIONAL DEVELOPMENT OF CHILDREN\n\nUNIT CODE\n:\nHCS323303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nfoster the social, intellectual, creative and emotional development of\nchildren from 1-12 years old.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Foster children’s\nindependence and\nautonomy\n\n1.1\nOpportunities to develop self help skills and independence\nare provided as needed.\n1.2\nChildren are given opportunities to make choice in appropriate\nways taking into consideration their individual differences.\n1.3\nChildren are encouraged to accept responsibility for their own\nactions.\n1.4\nOpportunities are created for children to participate in decision\nmaking.\n2. Encourage children to\nexpress their feelings,\nideas and needs\n2.1\nChildren are encouraged to express their feelings, ideas and\nneeds based on social norm.\n2.2\nChildren are provided with activities as means of releasing\ntheir feelings according to their interests and needs.\n2.3\nChildren are encouraged to respect each other’s individual\nneeds, abilities and interest.\n3. Stimulate children’s\nawareness and\ncreativity\n3.1\nChildren are encouraged to express their imagination and\ncreativity based developmental needs.\n3.2\nChildren are provided with activities that would support\nawareness of the range of movements of their own body\nbased on developmental needs.\n3.3\nMaterials and experiences are provided that would stimulate\ntheir various senses based on their interests.\n3.4\nExperiences that develop and enhance imagination and\ncreativity are provided based on their interests.\n4. Foster children’s self\nesteem and\ndevelopment of self\nconcept\n\n4.1\nOpportunities are provided for children to experience their\nindividual strengths and needs.\n4.2\n Acknowledgement and positive support are given based on\nchild experience negative feeling (frustration, aggression,\ndepression, fear and anxiety).\n4.3 Activities that present a challenge within the child’s needs and\ncapabilities are provided based on developmental stage.\n4.4 Individual differences are acknowledged and respected based\non child’s development stage.\n4.5 Children’s achievements are acknowledged and appreciated\nbased on preference.\n4.6 Children’s positive self-worth and self esteem are enhanced.\n\n--- PDF PAGE 43 ---\nTR Caregiving NC II\n\n-9-\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Opportunities\n1.1\nSocio dramatic play\n1.2\nMovement\n1.3\nListening to music\n1.4\n Art experiences including day and finger painting\n2. Individual differences\n2.1\nAge\n2.2\nGender\n2.3\nFamily background and lifestyle\n2.4\nAbilities and disabilities\n2.5\nStyle of social interaction\n2.6\nAppearance\n2.7\nCultural beliefs and practices\n2.8\nTemperament\n2.9\nInterests\n2.10 Peer group acceptance, membership or isolation\n3. Children’s activities\nChildren’s activities are carried out with the use of the following:\n3.1\nPlaypen with approximate toys according to age group (cradle\ntoys, objects to explore by mouth, swinging toys, rattles, toys\nto poke, squeeze and push along\n3.2\nAudio Visual Equipment (radio cassette, TV)\n3.3\nColoring Books\n3.4\nCrayons\n3.5\nPencils\n3.6\nPeg Boards\n3.7\nBeads to String\n3.8\nConstruction Sets\n3.9\nScissors\n3.10 Paper\n3.11 Color\n3.12 Paint/Short Fat Paint Brushes\n3.13 Play Dough\n3.14 Activity Kit\n3.15 Puzzles\n3.16 Books\n3.17 Manual\n\n--- PDF PAGE 44 ---\nTR Caregiving NC II\n\n-10-\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to evaluate the emotional and\npsychological stage of the child and to plan activities which\nwill enhance their development\n1.2\nDemonstrated ability to assist children to be creative through\nproviding a stimulating and challenging environment, taking\ninto account child’s age, development, culture and abilities\n1.3\nDemonstrated ability to engage children in a range of\ndevelopmental opportunities which are matched to their\ndevelopmental stage and specific needs\n2. Underpinning\nknowledge and\n attitudes\n2.1\nPsychology of Children\n2.2\nCultural Awareness\n2.3\nProcesses for Creative and Artistic Expression\n2.4\nChildren Developmental Stages\n2.5\nUnderstanding of Children’s Physical and Skills Development\n2.6\nChildren’s Needs, Interests and Problems\n3. Underpinning skills\n3.1\nPlanning\n3.2\nInterpersonal Skills\n3.3\nMotivational Skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.3\nA childcare workplace\n4.4\nFacilities, equipment and materials relevant to the unit of\ncompetency\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\n Demonstration with questioning\n5.2\n Interview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 45 ---\nTR Caregiving NC II\n\n-11-\nUNIT OF COMPETENCY :\nFOSTER PHYSICAL DEVELOPMENT OF CHILDREN\n\nUNIT CODE\n:\nHCS323304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nfoster specific physical development of children from 1-12 years old.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Enhance physical\nactivities of\nchildren\n1.1\nChildren are provided with tools and equipment based on\nphysical development needs.\n1.2\nChildren are given exercise or activities based on needs.\n2. Create opportunities\nfor children to\ndevelop a wider\nrange of physical\ndevelopment\n2.1\nChildren are provided opportunities to develop their\nphysical skills based on development needs.\n2.2\nChildren are given the opportunities to develop themselves\nphysically in accordance with resources available.\n2.3\nEquipment and tools are made available based on needs.\n2.4\nOpportunities for physical development are provided\nbased on child’s stage of growth and development.\n2.5\nChildren are monitored and encouraged to develop healthy\nsleeping patterns and practices based on physical needs.\n4. Provide experience to\nsupport physical\ndevelopment of\nchildren\n4.1\nExperiences are provided which will develop and enhance\nphysical fitness.\n4.2\nEncouragement is given to children to learn to develop habit\nforming physical activities\n4.3\nWays and means for the child to participate in physical fitness\nare communicated, modeled and practiced\n\n--- PDF PAGE 46 ---\nTR Caregiving NC II\n\n-12-\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Tools and equipment\n1.1\nPlaypen with approximate toys according to age group (cradle\ntoys, objects to explore by mouth, swinging toys, rattles, toys\nto poke, squeeze and push along\n1.2\nAudio Visual Equipment (radio cassette, TV)\n1.3\nColoring Books\n1.4\nCrayons\n1.5\nPencils\n1.6\nPeg Boards\n1.7\nBeads to String\n1.8\nConstruction Sets\n1.9\nScissors\n1.10 Paper\n1.11 Color\n1.12 Paint/Short Fat Paint Brushes\n1.13 Play Dough\n1.14 Activity Kit\n1.15 Puzzles\n1.16 Books\n1.17\nManual\n2. Opportunities to\nsupport children’s\ndevelopment will vary\naccording to a\nnumber of factors\nsuch as:\n2.1\nChild/Worker Ratios\n2.2\nPhysical Environment – Constraints & Potential\n2.3\nPurpose of the Service\n2.4\nThe amount and type of support from parents and\nparticipation by parents\n2.5\nThe level of support available to the service from external\nbodies e.g. advice specialist services, resource workers\n2.6\nThe frequency and regularity of use of the service by the child\n2.7\nAge of the Child\n3. Physical skills\n3.1\nSkills in motor areas – fine and gross motor\n3.2\nDexterity\n3.3\nEye – Hand Coordination\n3.4\nBalance\n3.5\nLocomotion\n3.6\nCoordination\n4. Opportunities to\ndevelop physical\nfitness skills may\ninclude:\n4.1\nActive Games\n4.2\nSports\n4.3\nExercises\n4.4\nSetting up venue/environment\n4.5\nRange of environments and equipment\n4.6\nSocio dramatic play\n4.7\nPlay with construction materials\n4.8\nArt activities\n5. Opportunities to\ndevelop relevant\nphysical skills will\nvary according to the\nage/disability of the\nchild -\n5.1\nFor infants\n5.1.1 Equipment and toys such as cradle toys, objects to\nexplore by mouth, swinging toys, rattles, toys to poke,\nsqueeze and push along\n5.2\nFor Toddlers\n5.2.1 Opportunities provided to practice new skills of walking,\nclimbing, balancing and pushing and pulling wheeled\ntoys\n5.3\nFor 3 to 5 years old\n\n--- PDF PAGE 47 ---\nTR Caregiving NC II\n\n-13-\nVARIABLE\nRANGE\n5.3.1 Opportunities to develop fine motor skills such as\npuzzles, peg boards, beads to string, construction sets,\ncrayons, brushes, scissors\n5.3.2 Opportunities to practice large muscle skills such as\nrunning, jumping, catching a ball etc.\n5.4\nFor 6 to 12 years old\n5.4.1 Opportunities for development of balance, skilled\nclimbing, riding, skating opportunities to develop skills\nin running kicking, catching, skipping, throwing, writing,\ndrawing, gluing etc.\n6. Opportunities\nprovided to develop\nskills may be needed\nto adapt to factors\nsuch as:\n\n6.1\nIndoor and Outdoor Facilities\n6.2\nEnvironment\n6.3\nVenue/Location\n6.4\nType of Service\n6.5\nWorkers own physical capabilities\n6.6\nThe desire for children to set up equipment themselves\n6.7\nSafety considerations\n6.8\nPeer group pressure\n7. Advice may be\nsought from:\n\n7.1\nPhysiotherapist\n7.2\nOccupational Therapist\n7.3\nOther Staff\n7.4\nParents\n\n--- PDF PAGE 48 ---\nTR Caregiving NC II\n\n-14-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to engage children in a range of\ndevelopmental opportunities which are matched to their\ndevelopmental stage and specific needs\n2. Underpinning\nknowledge and\nattitudes\n2.1\nKnowledge and understanding of children’s physical\ndevelopment and skill development\n2.2\nAcceptance of each child’s rate of development, needs,\ninterests and strengths\n2.3\nExperiences that will target specific areas of physical\ndevelopment\n2.4\nNeeds of children with a sensory/physical disability\n2.5\nEquipment, toys and resources that can be used to stimulate\nphysical development\n2.6\nKnowledge of interaction between physical development and\nother areas of development – especially social and\npsychological development\n2.7\nRelevant organizational standards, policies and procedures\n3. Underpinning Skills\n3.1 Planning\n3.2 Interpersonal Skills\n3.3 Motivational Skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A childcare workplace\n4.2\nFacilities, equipment and materials relevant to the unit of\ncompetency\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nInterview/oral questioning\n6. Context of\nassessment\n6.1\nCompetency may be assessed either in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 49 ---\nTR Caregiving NC II\n\n-15-\nUNIT OF COMPETENCY :\nPROVIDE CARE AND SERVICES TO ELDERLY\n\nUNIT CODE\n:\nHCS323305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nproviding support and assistance to maintain quality care for the\nelderly to meet his/her daily needs including nourishment, mobility,\npersonal hygiene and other support within the plan of care.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish and\nmaintain an\nappropriate\nrelationship with the\nelderly\n1.1\nSelf introduction by the caregiver to the elderly client is done\nbased on established procedures.\n1.2\nAppropriate attitudes such as confidentiality, privacy, courtesy\nand respect are adhered to and demonstrated towards the\nelderly based on established procedures.\n1.3\n The elderly’s own interest, rights, freedom and decision-\nmaking are supported and respected based on established\nprocedures.\n1.4\nShort interpersonal exchanges with the elderly in\nestablishing, developing and maintaining rapport are\nencouraged.\n2. Provide appropriate\nsupport to the elderly\n2.1\nAll support is provided to the elderly in accordance with the\nelderly’s needs, rights, self determination and individual\ndifferences.\n2.2\nThe elderly is encouraged and supported to participate in\nceremonial, cultural, educational, recreational, religious,\nsocial, and spiritual activities as appropriately planned.\n2.3\nAssistance is provided at all times in order to maintain a safe\nand healthy environment, including minimizing physical\ndangers and risk of infections based on established\nprocedures.\n2.4\nProper response to situations of risks to health and safety is\nprovided and maintained based on established procedures.\n3. Provide assistance\nwith elderly’s\npersonal care needs\n3.1\nPersonal preferences are identified in consultation with the\nelderly and a plan for execution is mapped out based on\nestablished procedures.\n3.2\nThe elderly is supported and encouraged in exercising their\nrights and personal preferences without compromising their\nsafety and those of others and in accordance with established\nprocedures.\n3.3\nShort interpersonal exchanges, clarifying meaning and\nmaintaining interaction to identify the elderly’s preferences are\nconducted based on established procedures.\n3.4\nTime is scheduled to effectively listen to the elderly’s\npreferences to maximize his/her well being.\n\n--- PDF PAGE 50 ---\nTR Caregiving NC II\n\n-16-\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Provide assistance\nwith the elderly’s\npersonal care needs\n4.1\nThe elderly’s personal care needs (aids to daily living) are\nidentified and assistance provided.\n4.2\nSpecific concerns and difficulties in meeting some personal\ncare needs are identified, clarified and modified with the\nelderly in order to effectively address such concerns and\nproblem needs.\n4.3\nAssistive devices for providing assistance for the elderly are\nidentified and used as appropriate.\n4.4\nOrganizational policies and practices for reporting are\nfollowed as appropriate.\n4.5\nThe elderly’s self esteem and confidence are enhanced.\n4.6\nProvisions for interaction between the elderly and the\ncommunity are researched and developed.\n4.7\nDevelopmental and progressing personal care needs are\nidentified, acknowledged and provided for as appropriate.\n4.8\nEmpathy is demonstrated in supporting and caring for the\nelderly’s feelings of grief and loss.\n\n--- PDF PAGE 51 ---\nTR Caregiving NC II\n\n-17-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Elderly rights may be\ndetailed in:\n1.1\nService/outcomes standards documents\n1.2\nLegislation\n1.3\nOrganizational policies and practices\n2. Short interpersonal\nexchanges\n2.1\nChatting in friendly manner\n2.2\nInquiring about the elderly’s health\n2.3\nShort casual exchanges\n2.4\nEffective communication\n2.5\nDialogue\n2.6\nQuestion and answer/interview techniques\n3. Needs of the elderly\n3.1\nPhysical, sexual\n3.2\nFinancial\n3.3\nHousehold assistance and maintenance\n3.4\nReligious\n3.5\nCultural\n3.6\nSpiritual\n3.7\nRecreational\n3.8\nSocial and emotional\n3.9\nIntellectual\n4. Factors contributing\nto individual\n difference\n4.1\nCulture\n4.2\nAge\n4.3\nEconomic\n4.4\nSocial\n4.5\nGender\n4.6\nPhysical\n4.7\nIntellectual\n4.8\nLanguage\n4.9\nSpiritual\n4.10\nMarital Status\n5. Assistance\n5.1\nProviding information and advice\n5.2\nAccompanying or providing specific services\n5.3\nEncouragement and support for decisions and actions\n5.4\nCompanionship\n6. Maximum well being\n6.1\nIndependent living\n6.2\nObservation of own customs and cultural practices coming\nand going from environment with safety\n6.3\nBelonging to social groups\n6.4\nFrequent visits to and from family, relatives and friends\n6.5\nCompanionship\n6.6\nEfficient care from caregiver\n7. Personal care needs\n7.1\nDaily living including:\n7.1.1 Maintaining personal safety\n7.1.2 Communication (speech, writing, non-verbal\ncommunication)\n7.1.3 Eating and drinking\n7.1.4 Eliminating\n7.1.5 Breathing\n7.1.6 Mobilizing and transferring (moving from place to place\nand position to position)\n7.1.7 Attending to personal hygiene (bathing, laundering\npersonal linen)\n\n--- PDF PAGE 52 ---\nTR Caregiving NC II\n\n-18-\nVARIABLE\nRANGE\n7.1.8 Dressing and undressing\n7.1.9 Attending to own spiritual needs\n7.1.10 Grooming and expressing sexuality\n7.1.11 Toileting\n7.1.12 Keeping appointments (Doctors, Dentists, Bankers,\nLawyers)\n7.1.13 SPICE (Spice, Physical, Intellectual, Creative and\nEmotional) activities\n7.2\nDaily Routine\n7.2.1 Accessing education and employment\n7.2.2 Accessing financial resources and allowances\n7.2.3 Paying bills and regular outgoings\n7.2.4 Shopping\n7.2.5 Preparing meals\n7.2.6 Climbing stairs\n7.2.7 Maintaining household (cleaning, laundry, décor,\nrepair)\n7.2.8 Traveling by private and public transport\n7.2.9 Interacting with others and socializing\n7.2.10 Accessing leisure, recreational and sporting activities\n7.3\nAssisting with self-administration of medication according to:\n7.3.1 Organizational practice and policy\n7.3.2 Government regulation, policy and legislation\n7.3.3 Instructions from the elderly, their trustees, medical\nteam and significant others\n7.4\nPhysical comfort and rest\n7.4.1 Appropriate rest\n7.4.2 Proper clothing\n7.4.3 Fit dentures\n7.4.4 Aids (wheelchairs, braces, walker, reading glasses)\n7.4.5 Comfortable bed and chair\n7.5\nPrivacy\n7.6\nConfidentiality\n7.7\nTo be treated in a dignified, safe and comfortable manner\n7.8\nTo express success, satisfied or own feelings\n8. Assistive Devices\n8.1\nWheelchair\n8.2\nWalker\n8.3\nCane\n8.4\nCrutches\n8.5\nParallel Bars\n8.6\nFeeding Utensils\n8.7\nHandrails\n8.9\nCommode\n8.10\nReading Materials\n9. Appropriate\ncommunication and\nrelationship building\nprocesses\n9.1\nCourtesy\n9.2\nEmpathy\n9.3\nNon judgmental manner\n9.4\nListening\n9.5\nTreating the elderly person as an individual\n9.6\nRespect for difference\n9.6.1 Cultural\n9.6.2 Physical\n9.6.3 Emotional\n\n--- PDF PAGE 53 ---\nTR Caregiving NC II\n\n-19-\nVARIABLE\nRANGE\n9.6.4 Beliefs\n9.6.5 Customs\n9.6.6 Values\n9.6.7 Religions\n10 Assistance may vary\naccording to:\n10.1 The ability of the worker\n10.2 Mental well being\n10.3 Physical well being\n10.4 Social well being\n10.5 Emotional well being\n10.6\nCreative well being\n11. Factual information\nto identify the\nelderly’s preferences\nmay be gathered by:\n11.1 Asking questions\n11.2 Observing the elderly\n11.3 Asking for clarification from the elderly\n11.4 Asking other significant people such as relatives, friends, staff\n11.5 Listening for relevant information concerning the elderly’s\npreferences\n11.6 Offering choices and suggestions\n11.7 Consulting professionals’ opinions and suggestions for the\nelderly to consider\n12. Assistance may vary\naccording to:\n12.1 The ability of the worker\n12.2 Mental well being\n12.3 Physical well being\n12.4 Social well being\n12.5 Emotional well being\n12.6\nCreative well being\n13. Processes and aides\nmay include:\n13.1 Meals on wheels\n13.2 All equipment and aids\n13.3 Transport services\n13.4 Around the clock caregiver\n13.5 Occasional caregiver\n13.6 Senior lodges accommodation\n13.7\nTrips to or visits from medical team\n14. Reporting may\ninclude:\n14.1 Changes in appearance and behavior in accordance with\nreporting instructions\n14.2 Medicine chart\n14.3 Observation log book\n14.4\nIncident and Accident Reports\n15. Reporting may be to:\n15.1 Supervisors\n15.2 Colleagues\n15.3 Health workers\n15.4 Administrator\n15.5 Health care services\n15.6 Emergency services\n15.7 Community care\n15.8 Social services\n15.9\nRelatives\n16. Reporting may be\nvia:\n16.1 Telephone\n16.2 Hand over reports\n16.3 Face to face\n16.4\nWritten\n\n--- PDF PAGE 54 ---\nTR Caregiving NC II\n\n-20-\nVARIABLE\nRANGE\n17. Social and personal\nwell being may\ninclude:\n17.1 Being independent\n17.2 Maintenance of personal contacts\n17.3 Control of financial affairs\n17.4 Coming and going from environment within safety\nrequirements\n17.5 Observation of own customs and cultural practices\n17.6 Exercising legal, social and other obligations and\nresponsibilities\n17.7 Keeping and maintaining personal possessions\n17.8 Privacy\n17.9 Access and entitlement to respite and other services\n17.10 Maintaining community participation\n17.11 Participation in programs and activities\n17.12 Sharing knowledge and skills\n18. Well being may vary\naccording to:\n18.1 Service provision environment e.g. independent living,\nresidential care facility, day center\n18.2 Health Status\n18.3 Worker’s Role\n18.4\nSPICE Status\n19. Provision of aids\nmay include:\n19.1 Referral to advisory centers\n19.2\nInformation\n20. Spiritual needs may\ninclude:\n20.1 Formal and informal religious observance\n20.2 Need for private time and space for contemplation\n20.3\nCeremonial Observances\n21. Aids may include:\n21.1 Mobility\n21.2 Hearing\n21.3 Speech\n21.4\nVision\n22. The elderly’s self\nesteem and\n confidence may be\nencouraged by:\n22.1 Assisting the elderly with difficult tasks\n22.2 Clarifying and discussing the elderly’s abilities and disabilities\n22.3 Encouraging the elderly to try new activities\n23. Psychological needs\n23.1 Freedom from undue stress\n23.2 Self-esteem\n23.3 Purpose\n23.4 Personal identity\n23.5\nLife stage development\n\n--- PDF PAGE 55 ---\nTR Caregiving NC II\n\n-21-\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nWorked within roles and responsibilities in a manner which\naccommodates and accepts individual differences of the\nelderly\n1.2\nEstablished and maintained appropriate relationship with the\nelderly\n1.2\nProvided appropriate support and assistance with the elderly’s\npersonal care needs\n1.3\nUnderstood and adhered to own roles and responsibilities\n1.4\nUnderstood accountability and responsibility of supervisors\nand colleagues\n1.5\nConsulted with the elderly, including asking questions,\nobserving, listening and suggesting\n1.6\nRecognized and understood the elderly’s rights and personal\npreferences including the ability to list the elderly’s\npreferences.\n1.7\nDemonstrated a non-judgmental attitude to the different\nemotional, psychological and spiritual needs of the elderly in\nall communications\n2. Underpinning\nKnowledge and\n Attitudes\n2.1\nTypes, uses, specifications and maintenance of bathing\nparaphernalia\n2.2\nProcedures of bathing and dressing the elderly\n2.3\nProper care of elders\n2.4\nPrinciples and procedures in taking vital signs\n2.5\nCommon signs and symptoms of common illnesses\n2.6\nPrinciples and procedures of medicine administration\n2.7\nRelevant plan of care, roles and responsibilities of caregiver\n4.3 Relevant policies, protocols and practices of the certain\norganizations in relation to services to the elderly\n2.9\nProcess of ageing\n2.10 Different religious, cultural, spiritual, physical and ceremonial\nperspectives\n2.11 Causes, implications and treatment of dementia and other\nelderly related conditions\n2.12 Depending on the work, roles or services provided, specific\nknowledge of particular groups or issues may be required like:\n2.12.1 Alcohol and other drugs\n2.12.2 Cultural and linguistics diversity\n2.12.3 Risk of self harm\n2.12.4 Women\n2.12.5 Men\n2.12.6 Community education\n2.12.7 Mental health\n2.13 Common problems of the elderly and their ramifications\n2.14 Different cultural requirements and preferences\n2.15 Factors giving rise to grief and loss in the\n elderly\n2.16 Safety risks to the elderly\n2.17\nMajor systems of the body\n\n--- PDF PAGE 56 ---\nTR Caregiving NC II\n\n-22-\n3. Underpinning skills\n3.1\nAbility to establish and maintain a relationship that takes into\naccount the elderly’s individual differences (e.g. age, abilities,\ndisabilities, cultural background)\n3.2\nOral communication skills (language skills) and non-verbal\ncommunication skills (e.g. touch, smiling, etc.) necessary to\ndevelop a trusting relationship with an elderly. Language skills\nmay be English, mother language or technical language\n(medical terms) as required by employment service or\norganization\n3.3\nOral communication skills (language competence) required to\nfulfill job roles as specified by the employment\norganization/service. Oral communication skills include asking\nquestions, clarifying understanding of the elderly’s\npreferences and expressing encouragement in oral\ncommunication. Service/organization may require competence\nin English or native language, as required by the elderly.\n3.4\nReading and writing skill (literacy competence) required to\nfulfill job roles as specified by employment\norganization/service. The level of skills may range from the\nability to write short messages or a shopping list, to assist the\nelderly with banking, reading of mail, answering the phone,\nreceiving messages etc. the employment service/organization\nmay require competence in a language other than English,\ndepending on job request\n3.5\nBasic counseling\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA childcare workplace\n4.2\nFacilities, equipment, supplies and materials relevant to the\nunit of competency\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 57 ---\nTR Caregiving NC II\n\n-23-\nUNIT OF COMPETENCY :\nPROVIDE CARE AND SUPPORT TO PEOPLE WITH SPECIAL\nNEEDS\n\nUNIT CODE\n:\nHCS323306\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nproviding support and assistance to maintain quality care for people\nwith special needs to be able to enhance their abilities to\ncommunicate and be independent; responding to the physical,\nmedical, health and safety, personal care and home maintenance\nrequirements of people with disabilities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish and\nmaintain appropriate\nrelationship with\npeople with special\nneeds\n1.1\nAll dealings with people with special needs are aimed at\ngenerating a trusting relationship which include protecting\nconfidentiality, privacy, individual choices and the right to\ndecision making.\n1.2\nRespect for individual differences is demonstrated in all\ndealings with people with special needs.\n1.3\nSupport for the interests, rights and decision making of people\nwith special needs is demonstrated in all dealings.\n1.4\nPeople with special needs are actively encouraged and\nsupported to communicate ideas, feelings and preferences.\n2. Provide appropriate\nsupport to people\nwith special needs\n2.1\nAll support to people with special needs are provided in\naccordance with their needs, rights and self determination.\n2.2\nAssistance is provided to people with disabilities according to\nthe employment organization guidelines.\n2.3\nInformation required by people with special needs are\nidentified and provided.\n2.4\nReactions and limitations regarding differences are\nrecognized and appropriate assistance is sought to ensure\nthat the rights of people with special needs are upheld.\n3. Assist in maintaining\nwell being of people\nwith special needs.\n3.1\nPeople with special needs are provided with support in\nmaintaining a clean, safe and comfortable environment.\n3.2\nSituations of risk to health and safety are responded to in\naccordance with established and approved health and\nsafety procedures.\n3.3\nPeople with special needs are actively encouraged to practice\nself expression.\n3.4\nRights and responsibilities of people with special needs are\ndiscussed with them professionally and in a non-threatening\nand non-critical ways.\n3.5\nStrategies are developed for people with special needs to\nassert self terms of accomplishments and achievements.\n\n--- PDF PAGE 58 ---\nTR Caregiving NC II\n\n-24-\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Assist people with\nspecial needs to\nidentify and meet\ntheir needs\n4.1\nThe dignity, privacy and personal choice of people with\nspecial needs in relation to needs are upheld.\n4.2\nPeople with special needs are assisted to identify, select and\nprioritize their specified nursing needs.\n4.3\n People with special needs are assisted to identify, select,\nprioritize and fulfill or implement their social, physical,\nintellectual, creative and emotional activities.\n4.4\nPeople with special needs are assisted to select and develop\nstrategies to meet their requirements in order to achieve their\nnursing needs.\n5. Assist people with\nspecial\nneeds\nin\nmaintaining\nan\nenvironment\nthat\nenables\nmaximum\nindependent living\n5.1\nThe types, frequency and triggers of challenging behaviors of\na person with special needs are identified, assessed and\nresearched.\n5.2\nStrategies for the prevention and management of\nchallenging behavior/s are planned and implemented\naccording to approved safety procedures.\n5.3\nPeople with special needs are encouraged and supported to\nexpress self.\n5.4\nIndependent thinking (such as decision, opinion and\npreferences) by people with special needs are encouraged\nand supported.\n5.5\nStrategies that would promote independence of people with\nspecial needs are developed and implemented.\n\n--- PDF PAGE 59 ---\nTR Caregiving NC II\n\n-25-\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Tools and equipment\n1.1\nBed with side rails\n1.2\nNight Light\n1.3\nHandrails\n1.4\nAssistive device (wheelchair, cane, walker and crutches\n1.5\nCommode\n1.6\nFeeding Utensils\n1.7\nClock\n1.8\nReading Materials\n1.9\nActivity Kit\n2. Individual differences\n2.1\nDaily living such as:\n2.1.1\nCulture\n2.1.2\nAge\n2.1.3\nEconomic\n2.1.4\nSocial\n2.1.5\nGender\n2.1.6\nPhysical\n2.1.7\nEmotional\n2.1.8\nIntellectual\n2.1.9\nLanguage\n2.2\nRights may be detailed in:\n2.2.1 Service/outcomes standards\n2.2.2 Legislation\n2.2.3 Organizational policies and practice\n2.3\nSupport will be in the Context for services offered including:\n2.3.1 Personal support\n2.3.2 Employment support\n2.3.3 Community access\n2.3.4 Accommodation support\n2.3.5 Lifestyle support\n3. Assistance\n3.1\nProviding information\n3.2\nAssistance with mobility or providing specific support such as\ntransport\n3.3\nEncouragement and support for decisions and and actions\n3.4\nGeneral household assistance and maintenance\n4. Differences\n4.1\nIndividual (age, gender, ability, history, personal preferences)\n4.2\nCultural\n4.3\nSpiritual\n4.4\nSexual preference\n5. Rights\n5.1\nChoose for oneself\n\n--- PDF PAGE 60 ---\nTR Caregiving NC II\n\n-26-\nVARIABLE\nRANGE\n5.2\nHave meaningful work\n5.3\nPrivacy\n5.4\nDignity\n5.5\nConfidentiality\n5.6\nSelf determination\n5.7\nAppropriate support\n5.8\nSkill development\n5.9\nAdvocacy\n5.10 Being treated as a valued individual\n5.11 Fair treatment\n5.12 Right to enter into a relationship\n5.13 Right to express sexuality\n6. Responsibilities\n\n6.1\nAct within the law\n6.2\nTreat others with consideration and respect\n6.3\nAbide by family obligations\n6.4\nAbide by the policies and procedures of the services being\nused\n7. Personal needs may\ninclude providing\nassistance with:\n7.1\nDaily living including:\n 7.1.1 Maintaining personal safety\n7.1.2Communication (speech, writing, non-\nverbal communication)\n 7.1.3 Eating and drinking\n 7.1.4 Eliminating\n 7.1.5 Breathing\n7.1.6 Mobilizing and transferring (moving\nfrom place to place and position to position)\n7.1.7 Attending to personal hygiene (bath-\ning, laundering personal linen)\n 7.1.8 Dressing and undressing\n 7.1.9 Attending own spiritual needs\n 7.1.10 Grooming and expressing sexuality\n7.2\nPhysical/instrumental activities of daily living:\n7.2.1 Accessing education and employment\n7.2.2 Accessing financial resources and allowances\n7.2.3 Paying bills and regular outgoings\n7.2.4 Shopping\n7.2.5 Preparing meals\n7.2.6 Climbing stairs\n7.2.7 Maintaining household (cleaning, laundry, décor,\nrepairs)\n7.2.8 Traveling by private and public transport\n\n--- PDF PAGE 61 ---\nTR Caregiving NC II\n\n-27-\nVARIABLE\nRANGE\n7.2.9 Interacting with others and socializing\n7.2.10 Accessing leisure, recreational and sporting activities\n7.3\nAssisting with self-administration of medication according to:\n7.3.1 Organizational practice and policy\n7.3.2 Government regulation, policy and legislation\n7.4\nPhysical comfort and rest\n7.5\nPain management\n7.6\nMaximization of independence and personal preferences\n7.7\nEmpowerment e.g. Enhancing of clients ability to\ncommunicate, act independently and uphold rights and\nresponsibilities\n8. Strategies to meet\nneeds\n8.1\nResponding to requirements arising from differences\n8.2\nUtilizing personal support equipment e.g. chair lifts,\nwheelchairs, hearing impaired phones, etc.\n8.3\nEnlisting specialist skills\n9. Support may be\nprovided:\n9.1\nIn the clients home\n9.2\nAt residential or other services\n10. Relevant legislation\nand policies on health\nand safety\n10.1 Occupational health and safety\n10.2 State health acts\n10.3 EEO legislation\n10.4 Organizational policies and guidelines\n10.5 Daily living\n10.6 Medications\n10.7 Dealing with changes in physical or mental well being\n10.8 Occupational Health and Safety\n10.9 Sexual Harassment\n10.10 Abuse prevention\n11. Prevention and\nmanagement of\nchallenging behavior\n11.1 Recognizing triggers and deflecting them\n11.2 Using active listening and observation skills\n11.3 Ensuring effective communication\n11.4 Seeking expert assistance\n\n--- PDF PAGE 62 ---\nTR Caregiving NC II\n\n-28-\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency:\nAssessment requires evidence that the candidate:\n1.1\nEstablished and maintained appropriate relationship with\npeople who have special needs\n1.2\nProvided appropriate support to people with special needs\n1.3\nAssisted in maintaining the well being of people with special\nneeds\n1.4\nAssisted people with special needs to identify and meets their\nneeds\n2. Underpinning\nknowledge and\n attitudes\n2.1\nRelevant organizational policies and procedures and\nresponsibilities within it\n2.2\nRelevant policies, protocols and practices of the organization\nin relation to own work activities\n2.3\nBasic knowledge of different types of disabilities and their\neffects on clients need\n2.4\nUnderstanding of support requirements for people with special\nneeds\n2.5\nDifferent religious, cultural, spiritual, physical, specific\nknowledge of particular groups or issues may be required like\nthe following:\n2.5.1 Alcohol and other drugs\n2.5.2 Cultural and linguistic diversity\n2.5.3 Risk of self harm\n2.5.4 Women\n2.5.5 Men\n2.5.6 Community education\n2.5.7 Mental health\n2.6\nOrganizational philosophy and goals\n2.7\nLegislative provision in relation to the rights of people with\ndisabilities\n2.8\nBasic knowledge of human, social, psychological, cognitive\nand physical development\n4.4 Role and responsibility of self and others in the organization\n4.5 Organization’s definition of challenging\n behavior\n4.6 Relevant support equipment (and technologies)\n and related occupational health and\n safety requirements regarding their use\n2.10 Impact of particular types of disability\n2.11 Principles of empowerment/disempowerment in relation to\npeople with special needs\n2.12 Occupational health and safety guidelines\n2.13 Cultural factors affecting people with special needs\nrequirements\n\n--- PDF PAGE 63 ---\nTR Caregiving NC II\n\n-29-\n2.14 Understanding of regulations and guidelines governing the\nhandling of medication\n3. Underpinning skills\n3.1\nInterpersonal skills appropriate to work with people with\nspecial needs\n3.2\nOral communication skills (language skills) necessary to\ndevelop a trusting relationship with people with special needs.\nLanguage may be English or community language as required\nby service or organization\n3.3\nCommunication\n3.4\nTeam work\n3.5\nNegotiation\n3.6\nUse of equipment\n3.7\nInterpersonal communication\n3.8\nObservation as required by job role\n3.9\nAssessment as required by job role\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA child care workplace\n4.2\nFacilities, equipment, tools, supplies and materials relevant to\nthe unit of competency.\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 64 ---\nTR Caregiving NC II\n\n-30-\nUNIT OF COMPETENCY :\nMAINTAIN A HEALTHY AND SAFE ENVIRONMENT\n\nUNIT CODE\n:\nHCS323307\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nmaintain various aspects in home maintenance taking into\nconsideration health and safety environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a clean and\nhygienic environment\n1.1\nCleaning occurs as an ongoing process as per regulations.\n1.2\nAppropriate cleaning agents, tools and equipment are used\nin accordance with established procedures.\n1.3\nInfection control procedures are followed according to\nestablished procedures.\n1.4\nVentilation, lighting and heating/cooling are adequately\nmaintained.\n1.5\nPersonal hygiene/health procedures are adhered to at all\ntimes.\n1.6\nBeds and beddings are cleaned to conform to health, hygiene\nand safety requirements as relevant.\n2. Provide a safe\nenvironment\n2.1\nOrganizational policies and procedures on safety are\nimplemented as required.\n2.2\nEnvironment protection policy is implemented.\n2.3\nTools, equipment, toys and games are appropriate to the age\nof the child.\n2.4\nEquipment is selected, checked and maintained to ensure\nsafety.\n2.5\nThe environment is set up to ensure safety of the client.\n2.6\nArea is checked for hazards and risks reduction strategies\nare implemented\n2.7\nFire exits are kept unobstructed\n2.8\nDisposal of waste materials is conducted in a safe and\nhygienic way\n2.9\nCleaning materials are stored safely\n3. Supervise the safety\nof clients\n3.1\nClients are supervised in accordance with legal requirements\nand regulations.\n3.2\nRules for safe play are explained, modeled and\nimplemented.\n3.3\nDirect contact with individuals/group is maintained.\n3.4\nPotential risks are identified and acted upon to\nprevent/minimize risks.\n3.4\nHazards and potential hazards in the environment are\nidentified and clients are informed accordingly.\n3.5\nEmergencies and evacuation procedures are discussed and\npracticed with clients.\n3.6\nSupervision is used as an opportunity to interact with clients.\n\n--- PDF PAGE 65 ---\nTR Caregiving NC II\n\n-31-\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Tools and equipment\n1.1\nCleaning materials (e.g. detergent soap, brush, broom, mop,\nrags, glass wiper)\n1.2\nVacuum Cleaner\n1.3\nPlay area with appropriate toys and padding\n2. Legal requirements\nand regulations\nregarding supervision\n2.1\nStaff/children ratios\n2.2\nBabies are never left unattended in the bath or on change\ntable\n3. Cleaning\n3.1\nDisinfecting nappy change areas\n3.2\nWashing floor\n3.3\nVacuuming\n3.4\nDisinfecting toilet areas\n4. Disposal of waste\nmaterials\n4.1\nNappies\n4.2\nSoiled tissues/wipes\n4.3\nAlternative Method for rest e.g. Hammocks\n5. Organizational\nprocedures\nimplemented for\nsafety\n5.1\nLegal/legislative requirements\n5.2\nOrganizational policies regarding excursions\n6. Checking area for\nhazards may include\nchecking for:\n6.1\nNeedles/sharp implements in outdoor areas\n6.2\nAnimal droppings in outdoor areas\n7. Maintaining direct\ncontact with\n child will vary\naccording to:\n7.1\nChild’s age\n7.2\nChild’s level of independence/dependence\n7.3\nChild’s safety/risk taking behaviors\n7.4\nActivity child is involved in\n7.5\nAbility of child\n8. Contact can include:\n8.1\nSight\n8.2\nSound\n8.3\nGlass viewing windows\n8.4\nLine of Sight\n8.5\nWithin physical reach\n9. Potential risk may be:\n9.1\nBabies learning to eat solid foods\n9.2\nChildren learning new skills such as walking, balancing\n9.3\nParticular “combinations” of children playing together\n9.4\nBabies going to sleep with a bottle\n9.5\nRisk of dehydration on very hot days\n9.6\nSIDS\n9.7\nWhen children are attempting an activity that may be beyond\ntheir previous ability\n10. Rules for safe play\n10.1 Use of equipment\n10.2\nHow children play together\n11. Providing a safe\nenvironment and risk\nreduction strategies\nwill vary according to\nwhether the location\nis:\n11.1 A purpose designed and built center\n11.2 Non purpose built center\n11.3 A home\n11.4 Appropriate for the age range of children\n12. Hazards may be\nidentified to children\nin a range of ways:\n12.1 Verbally\n12.2 By signs\n12.3\nBy symbols\n\n--- PDF PAGE 66 ---\nTR Caregiving NC II\n\n-32-\nVARIABLE\nRANGE\n13. Risk\nreduction/strategies\n13.1 Gates on stairs\n13.2 Covers on electrical sockets\n13.3 Removal/locking away of dangerous substances\n13.4 Close supervision of any children in kitchens\n13.5 Fences and gates, locking mechanisms\n13.6 Out of bounds areas\n13.7 Vacuuming/sweeping floors to remove small dangerous\nobjects\n13.8 Particularly close supervision in some areas\n13.9 Placing babies/infants to sleep in positions recommended for\nprevention of SIDS\n\n--- PDF PAGE 67 ---\nTR Caregiving NC II\n\n-33-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability to provide a clean and safe environment\nfor children\n1.2\nObserved personal hygiene/health procedures\n1.3\nImplemented environment protection policy\n1.4\nExplained and implemented rules for safe play\n1.5\nIdentified potential risks and hazards and explained to clients\n1.6\nDiscussed and practiced with clients the emergencies and\nevacuation procedures.\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nUp to date knowledge of regulations are understood\n2.2\nRegulations on safety, health and hygiene\n2.3\nPotential hazards to children\n2.4\nHazards of traffic for children\n2.5\nRisk minimization strategies and risk reduction strategies\n2.6\nThe spread of infectious diseases and cross infection\n2.7\nStrategies to minimize the spread of infectious diseases\n2.8\nDevelopmental stage\n2.9\nAppropriate toys and equipment – safety and risks\n2.10 Legal requirements for supervision including worker and\nchild ratios\n2.11 Organizational standards, policies and procedures\n2.11 Hazards in the home environment\n3. Underpinning skills\n3.1\nRisk minimization strategies and risk reduction strategies\n3.2\nStrategies to minimize the spread of infectious diseases\n3.3\nInterpersonal safe use of equipment and materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA childcare workplace\n4.2\nFacilities, equipment, supplies and materials relevant to the\nunit of competency\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n6. Context of\nassessment\n6.1\nThis unit could be assessed either in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 68 ---\nTR Caregiving NC II\n\n-34-\nUNIT OF COMPETENCY :\nRESPOND TO EMERGENCY\n\nUNIT CODE\n:\nHCS323308\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nrespond to emergencies which include various aspects of disease\ncontrol and prevention and emergency measures that can be\nadministered effectively.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Implement\nprocedures for\ninfection control and\nprevention\n1.1\nExclusion guidelines for children and others suffering from an\ninfectious condition are followed.\n1.2\nHygiene and health principles are implemented in care\npractice.\n1.3\nInfection control guidelines are followed.\n2. Recognize and\nrespond to signs of\npotential illness\n2.1\nSigns of potential illness are reported.\n2.2\nMedical assistance is sought as necessary according to\npolicies and procedures.\n2.3\nClients and relatives are informed as soon as possible.\n2.4\nClient is comforted and settled.\n3. Respond to\nemergencies and\naccidents\n3.1\nThe safety of self and others is ensured.\n3.2\nImmediate First Aid is provided as required.\n3.3\nStrategies to calm, reassure and comfort clients are\nimplemented.\n3.4\nDetails of emergency are recorded and reported accurately.\n3.5\nInformation is provided to others according to established\npolicies.\n3.6\nEmergencies and accidents are responded to according to the\nestablished guidelines and legislative requirements.\n4. Administer\nmedication within\nguidelines\n4.1\nMedication is administered according to organizational\npolicies and legislative requirements.\n4.2\nMedication is stored according to requirements.\n4.3\nMedication is checked for name, instructions and use by date.\n6.2\nAll administered medications are documented in accordance\nwith requirements.\n5. Respond to threats\nand situations of\ndanger\n5.1\nRemove client from threat/danger or remove danger/threat\nfrom client.\n5.2\nThe level of immediate danger is assessed and the situation is\nreported to an appropriate person.\n5.3\nAppropriate emergency procedures are implemented to\nensure the safety of children and workers.\n\n--- PDF PAGE 69 ---\nTR Caregiving NC II\n\n-35-\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Tools and Equipment\n1.1\nDummies (baby and adult)\n1.2\nVital signs kit (thermometer, BP)\n1.3\nBed Board\n1.4\nDisposable Gloves\n1.5\nCleaning equipment\n1.6\nUtensils\n1.7\nSoft toys\n1.8\nProtective Aprons\n2. Hygiene and Health\nPrinciples\n\n2.1\nHand Washing\n2.2\nUse of disposable gloves when cleaning up body wastes\n2.3\nRemoval and disposal of infected articles\n2.4\nCleaning equipment\n2.5\nDisposal of unused foods/milk\n2.6\nCleaning of utensils after use\n2.7\nRegular disinfecting of soft toys\n2.8\nRemoval of body waste products (e.g. feces, urine, saliva,\nvomit) and disinfection of affected area\n2.9\nUse protective aprons when changing babies\n2.10 Disinfection of nappy change areas after each use\n3. Medication\n\nRequirements for storage of medication may include but not limited\nto the following:\n4.1\nLegislative guidelines\n4.2\nOrganization procedures\n\n--- PDF PAGE 70 ---\nTR Caregiving NC II\n\n-36-\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nDemonstrated ability to respond quickly to emergencies and\nimplement correct procedures including administering first aid\n1.2\nImplemented procedures for infection control and prevention\n1.3\nRecognized and responded to signs of potential illness\n1.4\nResponded to emergencies and accidents\n1.5\nResponded to threats and situations of danger.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nDisease spread and transmission\n2.2\nGuidelines for inspection control\n2.3\nIndicators of child abuse\n2.4\nDifferent types of child abuse\n2.5\nChild protection policy of service\n2.6\nState/territory requirements about responding to indications of\nabuse and reporting process\n2.7\nOrganizational standards, policies and procedures\n3. Underpinning skills\n3.1\nCommon childhood illnesses – recognition, management\nstrategies\n3.2\nWriting incident records\n3.3\nMaking decision under pressure\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA childcare workplace\n4.2\nFacilities, equipment, supplies and materials relevant to the\nunit of competency\n6. Method of\nassessment\nCompetency MUST be assessed through:\n6.1\nDemonstration with questioning\n6.2\nInterview\n7. Context of\nassessment\n7.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 71 ---\nTR Caregiving NC II\n\n-37-\nUNIT OF COMPETENCY :\nCLEAN LIVING ROOM, DINING ROOM, BEDROOMS, TOILETS,\nBATHROOMS AND KITCHEN\nUNIT CODE\n:\nHCS323309\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes required to\nperform home management by providing clean, secure and safe\nenvironment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Clean surfaces and\nfloors\n1.1\nAppropriate removal/cleaning equipment, supplies,\nmaterials, procedures and techniques are used in\naccordance with soil and litter types and established\nprocedures.\n1.2\nAll wastes are removed from surface based on procedures.\n1.3\nSuitable maintenance procedures is selected and applied\nbased on identified floor types and surface textures.\n1.4\nCleaning, polishing and sweeping are performed according to\nstandard operating procedures.\n1.5\nCleaning, polishing and sweeping equipment, supplies and\nmaterials are used following safety procedures and\nmanufacturer’s specifications.\n1.6\nCleaning/polishing equipment are cleaned after use in\naccordance with relevant safety procedures and\nmanufacturer’s instructions.\n1.7\nAll cleaning, polishing, sweeping materials and equipment are\nstored as per standard operating procedures (SOPs).\n1.8\nRoutine maintenance is carried out as per SOPs.\n2. Clean furnishing and\nfixtures\n2.1\nFurnishings and fixtures are cleaned in accordance with\nstandard operating procedures.\n2.2\nFurniture positioned based on comfort and convenience and\nroom lay out.\n2.3\nEquipment is cleaned after use in accordance with relevant\nsafety and manufacturer’s instructions.\n2.4\nAll cleaning materials and equipment are stored following\nSOPs.\n2.5\nRoutine maintenance is carried out or arranged as per\nstandard operating procedures.\n3. Make up beds and\ncots\n3.1\nMattress is aired, freed from and vacuumed in accordance\nwith SOPs.\n3.2\nSoiled linens an pillowcases are replaced in accordance with\nSOPs.\n3.3\nLinens are centered and mitered when replaced as per SOPs.\n3.4\nBeds and cots are made-up according to prescribed\nprocedure.\n4. Clean toilet and\nbathroom\n4.1\nCeilings and walls are cleaned in accordance with standard\noperating procedures and techniques.\n4.2\nWindow edges and sills are wiped clean in accordance with\nstandard operating procedures.\n4.3\nBath tub, lavatory and toilet bowls are scrubbed and\ndisinfected in accordance with standard operating procedures\nand techniques.\n4.4\nAccessories are washed and cleaned in accordance with\nstandard operating procedures and techniques.\n\n--- PDF PAGE 72 ---\nTR Caregiving NC II\n\n-38-\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4.5\nBathroom supplies are replenished and defective\naccessories replaced as per SOPs.\n4.6\nEquipment is cleaned after use in accordance with\nmanufacturer’s instruction.\n4.7\nAll cleaning materials and equipment are stored in a safe\nplace as per SOPs.\n4.8\nRoutine maintenance is carried out or arranged as per\nstandard operating procedures.\n5. Sanitize rooms\n\n5.1\nSanitizing agents are 100% accurately measured and mixed\nin accordance with relevant safety regulations.\n5.2\nExcess mixtures of sanitizing agents are disposed according\nto environmental requirements.\n5.3\nRooms are sanitized in accordance with standard operating\nprocedures.\n5.4\nEquipment is cleaned after use in accordance with\nmanufacturer’s instructions.\n5.5\nAll cleaning materials and equipment are stored in a safe\nplace as per SOPs.\n5.6\nRoutine maintenance is carried out or arranged as per\nstandard operating procedures.\n6. Maintain clean room\nenvironment\n6.1\nAll equipment and cleaning paraphernalia are checked and\nmaintained according to manufacturer’s instructions.\n6.2\nAll wastes are removed and disposed of in accordance with\nemployer’s requirements.\n6.3\nAll movable furniture and fittings are shifted to allow access to\nhidden dust/waste/dirt and as per SOPs.\n6.4\nRooms are checked regularly for orderliness/tidiness in\naccordance with employer’s requirements.\n7. Clean kitchen\n7.1\nSoiled dishes, pots, pans and linen are washed in accordance\nwith standard operating procedures.\n7.2\nCleaned/dried dishes, pots and pans are stored as per\nstandard operating procedures.\n7.3\nKitchen appliances are cleaned in accordance with standard\noperating procedures.\n7.4\nKitchen fixtures, tables and chairs are wiped in accordance\nwith standard operating procedures.\n7.5\nFloor is mopped and dried in accordance with standard\noperating procedures.\n7.6\nKitchen supplies are inspected and replenished in\naccordance with standard operating procedures.\n\n--- PDF PAGE 73 ---\nTR Caregiving NC II\n\n-39-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning Equipment,\nSupplies and\nMaterials\n\n1.1\nBrooms\n1.2\nDust pan and brush\n1.3\nCleaning implements\n1.4\nVacuum cleaner\n1.5\nFloor Carpet\n1.6\nWater Hoses\n1.7\nBucket\n1.8\nBed\n1.9\nDining Table\n1.10 Water Pitcher\n1.11 Table Cloth\n1.12 Flowers\n1.13 Bed Cover\n1.14 Spoon\n1.15 Fork\n1.16 Knife\n1.17 Plate\n1.18 Wine Glass\n1.19 Serving Utensils\n1.20 Table Napkin\n1.21 Paper Towel\n1.22 Flower Vase\n1.23 Drinking Water\n1.24 Serving Tray\n1.25 Soiled Table\n1.26 Cleaning Detergent\n1.27 Liquid Detergent\n1.28 Cleaning Solution\n1.29 Scrubbing Foam\n1.30 Flat Sheets\n1.31 Fitted Sheet\n1.32 Pillow\n1.33 Pillow Case\n1.34 Bed Mattress\n1.35 Dish Pan\n1.36 Dish Sponge/Dish Cloth\n1.37 Pan with Hot Water\n1.38 Rolled Newspaper\n1.39 Cleaning Rag\n1.40 Wax Paper/Aluminum Foil\n1.41 Talcum Powder\n1.42 Bowl Cleaner\n1.43 Toilet Disinfectant\n1.44 Acid Cleaner\n1.45 Cup\n1.46 Soup Plate\n1.47 Soup Bowl\n1.48 Drinking Glass/Goblet\n1.49 Serving Dish\n1.50 Rubber Spatula\n1.51\nFloor Mop\n\n--- PDF PAGE 74 ---\nTR Caregiving NC II\n\n-4