  \nSIDS \n9.7  \nWhen children are attempting an activity that may be beyond \ntheir previous ability\n10. Rules for safe play  \n10.1 Use of equipment \n10.2\nHow children play together\n11. Providing a safe \nenvironment and risk \nreduction strategies \nwill vary according to \nwhether the location \nis:\n11.1 A purpose designed and built center \n11.2 Non purpose built center \n11.3 A home  \n11.4 Appropriate for the age range of children \n12. Hazards may be \nidentified to children \nin a range of ways:\n12.1 Verbally \n12.2 By signs \n12.3\nBy symbols\n\n--- PDF PAGE 66 ---\nTR Caregiving NC II \n \n-32- \nVARIABLE \nRANGE \n13. Risk \nreduction/strategies  \n13.1 Gates on stairs \n13.2 Covers on electrical sockets \n13.3 Removal/locking away of dangerous substances         \n13.4 Close supervision of  any children in kitchens \n13.5 Fences and gates, locking mechanisms \n13.6 Out of bounds areas \n13.7 Vacuuming/sweeping floors to remove small dangerous \nobjects \n13.8 Particularly close supervision in some areas \n13.9 Placing babies/infants to sleep in positions recommended for \nprevention of SIDS\n\n--- PDF PAGE 67 ---\nTR Caregiving NC II \n \n-33- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated ability to provide a clean and safe environment \nfor children \n1.2 \nObserved personal hygiene/health procedures  \n1.3 \nImplemented environment protection policy \n1.4 \nExplained and implemented rules for safe play \n1.5 \nIdentified potential risks and hazards and explained to clients \n1.6 \nDiscussed and practiced with clients the emergencies and \nevacuation procedures. \n2. Underpinning \nknowledge and     \nattitudes \n \n2.1 \nUp to date knowledge of regulations are understood \n2.2 \nRegulations on safety, health and hygiene \n2.3 \nPotential hazards to children \n2.4 \nHazards of traffic for children \n2.5 \nRisk minimization strategies and risk reduction strategies