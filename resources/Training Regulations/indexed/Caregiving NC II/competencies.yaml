          "source_text": "1. Maintain a clean and \nhygienic environment \n1.1 \nCleaning occurs as an ongoing process as per regulations. \n1.2 \nAppropriate cleaning agents, tools and equipment are used \nin accordance with established procedures. \n1.3 \nInfection control procedures are followed according to \nestablished procedures. \n1.4 \nVentilation, lighting and heating/cooling are adequately \nmaintained. \n1.5 \nPersonal hygiene/health procedures are adhered to at all \ntimes. \n1.6 \nBeds and beddings are cleaned to conform to health, hygiene \nand safety requirements as relevant. \n2. Provide a safe \nenvironment \n2.1 \nOrganizational policies and procedures on safety are \nimplemented as required. \n2.2 \nEnvironment protection policy is implemented. \n2.3 \nTools, equipment, toys and games are appropriate to the age \nof the child. \n2.4 \nEquipment is selected, checked and maintained to ensure \nsafety. \n2.5 \nThe environment is set up to ensure safety of the client. \n2.6 \nArea is checked for hazards and risks reduction strategies \nare implemented \n2.7 \nFire exits are kept unobstructed \n2.8 \nDisposal of waste materials is conducted in a safe and \nhygienic way \n2.9 \nCleaning materials are stored safely \n3. Supervise the safety \nof clients \n3.1 \nClients are supervised in accordance with legal requirements \nand regulations. \n3.2 \nRules for safe play are explained, modeled and \nimplemented. \n3.3 \nDirect contact with individuals/group is maintained. \n3.4 \nPotential risks are identified and acted upon to \nprevent/minimize risks. \n3.4 \nHazards  and potential hazards in the environment are \nidentified and clients are informed accordingly. \n3.5 \nEmergencies and evacuation procedures are discussed and \npracticed with clients. \n3.6 \nSupervision is used as an opportunity to interact with clients.\n\n--- PDF PAGE 65 ---\nTR Caregiving NC II \n \n-31- \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Tools and equipment \n1.1 \nCleaning materials (e.g. detergent soap, brush, broom, mop, \nrags, glass wiper) \n1.2 \nVacuum Cleaner \n1.3\nPlay area with appropriate toys and padding\n2. Legal requirements \nand regulations \nregarding supervision \n2.1 \nStaff/children ratios \n2.2 \nBabies are never left unattended in the bath or on change \ntable\n3. Cleaning  \n3.1 \nDisinfecting nappy change areas \n3.2 \nWashing floor \n3.3 \nVacuuming \n3.4\nDisinfecting toilet areas\n4. Disposal of waste \nmaterials  \n4.1 \nNappies \n4.2 \nSoiled tissues/wipes \n4.3\nAlternative Method for rest e.g. Hammocks\n5. Organizational \nprocedures \nimplemented  for \nsafety \n5.1 \nLegal/legislative requirements \n5.2 \nOrganizational policies regarding excursions \n6. Checking area for \nhazards  may include \nchecking for:\n6.1 \nNeedles/sharp implements in outdoor areas \n6.2 \nAnimal droppings in outdoor areas \n7. Maintaining direct \ncontact with \n      child will vary \naccording to: \n7.1 \nChild’s age \n7.2 \nChild’s level of independence/dependence \n7.3 \nChild’s safety/risk taking behaviors \n7.4 \nActivity child is involved in \n7.5\nAbility of child\n8. Contact can include: \n8.1 \nSight \n8.2 \nSound \n8.3 \nGlass viewing windows \n8.4 \nLine of Sight \n8.5\nWithin physical reach\n9. Potential risk may be:\n9.1 \nBabies learning to eat solid foods \n9.2 \nChildren learning new skills such as walking, balancing \n9.3  \nParticular “combinations” of children playing together \n9.4  \nBabies going to sleep with a bottle \n9.5  \nRisk of dehydration on very hot days \n9.6  \nSIDS \n9.7  \nWhen children are attempting an activity that may be beyond \ntheir previous ability\n10. Rules for safe play  \n10.1 Use of equipment \n10.2\nHow children play together\n11. Providing a safe \nenvironment and risk \nreduction strategies \nwill vary according to \nwhether the location \nis:\n11.1 A purpose designed and built center \n11.2 Non purpose built center \n11.3 A home  \n11.4 Appropriate for the age range of children \n12. Hazards may be \nidentified to children \nin a range of ways:\n12.1 Verbally \n12.2 By signs \n12.3\nBy symbols\n\n--- PDF PAGE 66 ---\nTR Caregiving NC II \n \n-32- \nVARIABLE \nRANGE \n13. Risk \nreduction/strategies  \n13.1 Gates on stairs \n13.2 Covers on electrical sockets \n13.3 Removal/locking away of dangerous substances         \n13.4 Close supervision of  any children in kitchens \n13.5 Fences and gates, locking mechanisms \n13.6 Out of bounds areas \n13.7 Vacuuming/sweeping floors to remove small dangerous \nobjects \n13.8 Particularly close supervision in some areas \n13.9 Placing babies/infants to sleep in positions recommended for \nprevention of SIDS\n\n--- PDF PAGE 67 ---\nTR Caregiving NC II \n \n-33-"
