        "source_title": "FOSTER PHYSICAL DEVELOPMENT OF CHILDREN",
        "source_text": "--- PDF PAGE 45 ---\nTR Caregiving NC II \n \n-11- \nUNIT OF COMPETENCY : \nFOSTER PHYSICAL DEVELOPMENT OF CHILDREN \n \nUNIT CODE \n: \nHCS323304 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nfoster specific physical development of children from 1-12 years old. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Enhance physical \nactivities of     \nchildren \n1.1 \nChildren are provided with tools and equipment based on \nphysical development needs. \n1.2 \nChildren are given exercise or activities based on needs. \n2. Create opportunities \nfor children to \ndevelop a wider \nrange of physical \ndevelopment \n2.1 \nChildren are provided opportunities to develop their \nphysical skills based on development needs. \n2.2 \nChildren are given the opportunities to develop themselves \nphysically in accordance with resources available. \n2.3 \nEquipment and tools are made available based on needs. \n2.4 \nOpportunities for physical development are provided \nbased on child’s stage of growth and development. \n2.5 \nChildren are monitored and encouraged to develop healthy \nsleeping patterns and practices based on physical needs. \n4. Provide experience to \nsupport physical \ndevelopment of \nchildren \n4.1 \nExperiences are provided which will develop and enhance \nphysical fitness. \n4.2 \nEncouragement is given to children to learn to develop habit \nforming physical activities \n4.3 \nWays and means for the child to participate in physical fitness \nare communicated, modeled and practiced\n\n--- PDF PAGE 46 ---\nTR Caregiving NC II \n \n-12- \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Tools and equipment \n1.1 \nPlaypen with approximate toys according to age group (cradle \ntoys, objects to explore by mouth, swinging toys, rattles, toys \nto poke, squeeze and push along \n1.2 \nAudio Visual Equipment (radio cassette, TV) \n1.3 \nColoring Books \n1.4 \nCrayons \n1.5 \nPencils \n1.6 \nPeg Boards \n1.7 \nBeads to String \n1.8 \nConstruction Sets \n1.9 \nScissors \n1.10 Paper \n1.11 Color \n1.12 Paint/Short Fat Paint Brushes \n1.13 Play Dough \n1.14 Activity Kit \n1.15 Puzzles \n1.16 Books \n1.17\nManual\n2. Opportunities to \nsupport children’s \ndevelopment will vary \naccording to a \nnumber of factors \nsuch as: \n2.1 \nChild/Worker Ratios \n2.2 \nPhysical Environment – Constraints & Potential \n2.3 \nPurpose of the Service \n2.4 \nThe amount and type of support  from parents and \nparticipation by parents \n2.5 \nThe level of support available to the service from external \nbodies e.g. advice specialist services, resource workers \n2.6 \nThe frequency and regularity of use of the service by the child \n2.7\nAge of the Child\n3. Physical skills  \n3.1 \nSkills in motor areas – fine and gross motor \n3.2 \nDexterity \n3.3 \nEye – Hand Coordination \n3.4 \nBalance \n3.5 \nLocomotion \n3.6\nCoordination\n4. Opportunities to \ndevelop physical \nfitness skills may \ninclude:  \n4.1 \nActive Games \n4.2 \nSports \n4.3 \nExercises \n4.4 \nSetting up venue/environment \n4.5 \nRange of environments and equipment \n4.6 \nSocio dramatic play \n4.7 \nPlay with construction materials \n4.8\nArt activities                  \n5.  Opportunities to \ndevelop relevant \nphysical skills will \nvary according to the \nage/disability of the \nchild - \n5.1 \nFor infants \n5.1.1 Equipment and toys such as cradle toys, objects to \nexplore by mouth, swinging toys, rattles, toys to poke, \nsqueeze and push along \n5.2 \nFor Toddlers \n5.2.1 Opportunities provided to practice new skills of walking, \nclimbing, balancing and pushing and pulling wheeled \ntoys \n5.3\nFor 3 to 5 years old\n\n--- PDF PAGE 47 ---\nTR Caregiving NC II \n \n-13- \nVARIABLE \nRANGE \n5.3.1 Opportunities to develop fine motor skills such as \npuzzles, peg boards, beads to string, construction sets, \ncrayons, brushes, scissors \n5.3.2 Opportunities to practice large muscle skills such as \nrunning, jumping, catching a ball etc. \n5.4 \nFor 6 to 12 years old \n5.4.1 Opportunities for development of balance, skilled \nclimbing, riding, skating opportunities to develop skills \nin running kicking, catching, skipping, throwing, writing, \ndrawing, gluing etc.       \n6. Opportunities \nprovided to develop \nskills may  be needed \nto adapt to  factors \nsuch as: \n      \n6.1 \nIndoor and Outdoor Facilities \n6.2 \nEnvironment   \n6.3 \nVenue/Location \n6.4 \nType of Service \n6.5 \nWorkers own physical capabilities \n6.6 \nThe desire for children to set up equipment  themselves \n6.7 \nSafety considerations \n6.8\nPeer group pressure\n7. Advice may be \nsought from: \n      \n7.1 \nPhysiotherapist \n7.2 \nOccupational Therapist \n7.3 \nOther Staff \n7.4\nParents\n\n--- PDF PAGE 48 ---\nTR Caregiving NC II \n \n-14- \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated ability to engage children in a range of \ndevelopmental opportunities which are matched to their \ndevelopmental stage and specific needs \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nKnowledge and understanding of children’s physical \ndevelopment and skill development \n2.2 \nAcceptance of each child’s rate of development, needs, \ninterests and strengths \n2.3 \nExperiences that will target specific areas of physical \ndevelopment \n2.4 \nNeeds of children with a sensory/physical disability \n2.5 \nEquipment, toys and resources that can be used to stimulate \nphysical development \n2.6 \nKnowledge of interaction between physical development and \nother areas of development – especially social and \npsychological development \n2.7 \nRelevant organizational standards, policies and procedures \n3.  Underpinning Skills \n3.1      Planning \n3.2      Interpersonal Skills \n3.3      Motivational Skills \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1      A childcare workplace \n4.2 \nFacilities, equipment and materials relevant to the unit of \ncompetency \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nInterview/oral questioning \n6. Context of \nassessment \n6.1 \nCompetency may be assessed either in the workplace or in a \nsimulated workplace setting.\n",
        "required_knowledge": null,
        "required_skills": null
      },
