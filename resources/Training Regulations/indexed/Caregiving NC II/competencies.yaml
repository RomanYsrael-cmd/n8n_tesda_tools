          "source_text": "1. Check and sort \nclothes, linens and \nfabrics \n1.1 \nSoiled clothes, linen and fabrics are sorted according to \ntexture, color, size and defects. \n1.2 \nSorted items are prioritized according to the cleaning process \nrequired ad the urgency of the item. \n1.3 \nDefective clothing, linen and fabric are sewn/darned using \nappropriate threads and stitches. \n2. Remove stains \n2.1 \nPersonal protective paraphernalia are worn in accordance \nwith standard operating procedures (SOPs). \n2.2 \nStain removing agents and chemicals are used in \naccordance with manufacturer’s instruction. \n2.3 \nStains are treated and removed using correct chemicals or \nagents. \n2.4 \nAll stain removing agents and chemicals are stored following \nsafety procedures. \n3. Prepare washing \nequipment and     \nsupplies \n \n3.1 \nLaundry area is cleaned and made ready at all times. \n3.2 \nLaundry supplies and materials are prepared and made \navailable at all times. \n3.3 \nWashing machine is checked and prepared for operation per \nmanual procedures. \n4. Perform laundry  \n      \n4.1 \nCorrect laundry method is selected as per SOPs. \n4.2 \nClothes, linen and fabric are washed according to the labeling \ncodes and washing instructions. \n4.3 \nLaundry equipment is used in accordance with manufacturer’s \ninstruction. \n4.4 \nClothing, linen and fabric are freed from stain, dirt and \nunpleasant odor after washing based on procedures. \n4.5 \nWashed clothes, linen and fabric are sun-dried/machine dried \nas per instructions. \n4.6 \nDried clothes, linen and fabric are freed from unpleasant odor \nand static cling. \n4.7 \nWashing area is cleaned in accordance with safety and health \nprocedures. \n4.8\nEquipment is cleaned after use in accordance with\n\n--- PDF PAGE 80 ---\nTR Caregiving NC II \n \n-46- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \nmanufacturer’s instructions. \n4.9 \nAll cleaning materials and equipment are stored following \nsafety procedures. \n4.10 Routine maintenance is carried out or arranged as per \nstandard operating procedures. \n5. Dry clothes, linen and \nfabric \n        \n5.1 \nWashed clothes, linen and fabric are dried according to \nprocedures.  \n5.2 \nDrying machine is prepared according to procedure. \n5.3 \nDried clothes, linen and fabric are removed when dryer bell \nrings or stops to prevent wrinkles and to minimize need for \nironing. \n5.4 \nClothes, linen and fabric are dried without wrinkles according \nto procedures. \n6. Iron clothes, linens \nand fabrics \n \n6.1 \nIroning is done in accordance to the standard procedures \n6.2 \nIroned clothes, linens and fabrics are folded, placed in a \nhanger and stored in designated cabinets as per instructions. \n6.3 \nIroning equipment and materials are stored in the \nappropriate area following safety procedures.\n\n--- PDF PAGE 81 ---\nTR Caregiving NC II \n \n-47- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Sorted Items \n1.1 \nSoiled/Defective Clothes \n1.2 \nLinen \n1.3 \nFabrics \n2. Personal Protective \nParaphernalia  \n2.1 \nGloves \n2.2 \nApron \n3. Stains \n3.1 \nCoffee \n3.2 \nCola \n3.3 \nCordial \n3.4 \nChewing Gum \n3.5 \nFood \n3.6 \nMud/Dirt \n3.7 \nGrease \n3.8 \nBlood \n3.9 \nFruit Stains \n3.10 Wine \n4. Stain \n4.1 \nAcid Cleaners \n4.2 \nAlkali Cleaners \n4.3 \nChlorine Bleach \n4.4 \nAll-Purpose Detergent \n5. Laundry Area \n5.1 \nWashers \n5.2 \nDryers \n5.3 \nClothesline \n5.4 \nClothes Pins \n5.5 \nClothespin Bag \n5.6 \nClothes Rack for Indoor Drying \n6. Laundry Supplies and \nMaterials \n6.1 \nSorting Baskets/Shelves \n6.2 \nHangers \n6.3 \nStain Removing Agents \n6.4 \nFabric Softener \n6.5 \nChlorine Bleach \n6.6 \nLaundry Bag \n6.7 \nLaundry Basket\n\n--- PDF PAGE 82 ---\nTR Caregiving NC II \n \n-48-"
