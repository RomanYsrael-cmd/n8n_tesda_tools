          "source_text": "1. Comfort infants and \ntoddlers \n1.1 \nTools and equipment are prepared according to the need of \nthe infant/toddler. \n1.2 \nDistressed infants and toddlers are   responded to based \non appropriate methods, activity and non-verbal cues. \n1.3 \nInfants and toddlers are picked up and cuddled according to \nprocedure. \n2. Bathe and dress \ninfants and   toddlers \n2.1 \nInfants and toddlers’ vital signs are checked   based on \nprocedure. \n2.2. \nWater quantity and temperature are checked as per \nrequirement. \n2.3 \nInfants and toddlers are bathed according to procedure. \n2.4 \nComforters are made available to infant and toddler when \nneeded. \n3. Feed infants and \ntoddlers \n3.1 \nInfants and toddlers’ feeding bottles are cleaned and sterilized \nas needed. \n3.2 \nMilk formula is prepared as prescribed. \n4. Put infants and \ntoddlers to sleep \n4.1 \nInfants and toddlers’ crib is prepared based on procedure. \n4.2 \nInfants and toddlers are put to sleep based on procedure. \n5. Enhance social, \nphysical, intellectual, \ncreative and \nemotional activities of \ninfants and toddlers \n5.1 \nInfants and toddlers are exposed to family members, relatives \nand playmates for communication and interaction purposes. \n5.2 \nInfants/toddlers are provided with manipulative or creative toys \nand games as needed. \n5.3 \nInfants/toddlers are given exercise activities as required.\n\n--- PDF PAGE 36 ---\nTR Caregiving NC II \n \n-2- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools and Equipment \n1.1 \nInfants crib/bed \n1.2 \nBlanket/comforters \n1.3 \nInfant carrier \n1.4 \nStroller  \n1.5 \nBassinet \n1.6 \nBathing paraphernalia (e.g. Baby bath tub, baby toiletries, \ntowel, etc.) \n1.7 \nBaby’s Layettes \n1.8 \nFeeding bottles with cap, ring and nipple \n1.9 \nThermometer \n1.10 Thermometer Tray \n1.11 Sterilizer \n1.12 Infant’s/Toddler’s Formula \n1.13 Bibs \n1.14 Nursery Rhymes \n1.15 Toys for the Crib (Mobile) \n1.16 Infants/Toddlers Toys \n1.17 Story Books \n2. Appropriate method \nor Activities   \n2.1 \nImitating babies’ vocalizations \n2.2 \nTalking \n2.3 \nSinging \n2.4 \nLaughing  \n2.5 \nRhymes \n2.6 \nFinger Games \n2.7 \nHolding \n2.8 \nDancing \n2.9 \nGentle Bouncing \n2.10 Substituting Activities \n2.11 Playing \n2.12    Distraction to an activity \n2.13 Cuddles, comfort \n2.14 Listening, talking with the infant or toddler quietly \n2.15 Use of  transition object \n3. Infants/toddlers may \nshow distress by: \n3.1 \nCrying \n3.2 \nAppearing withdrawn \n3.3 \nSquirming \n3.4 \nLack of eye contact \n3.5 \nSleeping  difficulties \n3.6      Whining\n\n--- PDF PAGE 37 ---\nTR Caregiving NC II \n \n-3- \nVARIABLE \nRANGE \n3.7      Not playing or not playing creatively \n3.8      Repetitive display of trauma \n3.9      Aggression \n3.10 Regression \n3.11 Speech difficulties (e.g. Stuttering) \n3.12 Toilet training difficulties \n3.13 Nervous tics (e.g. Cough) \n3.14 Hunger \n3.15 Tiredness \n3.16 Discomfort \n3.17 Fear \n3.18 Anxiety \n3.19 Boredom \n3.20 Clinging behavior \n4.  Non Verbal Cues \n4.1 \nCues to indicate distress \n4.2 \nResponse to an interesting activity \n4.3 \nSmiling \n4.4 \nCues that express a desire to engage in an activity of \ninteraction \n5.  Comforters  \n5.1 \nSpecial toys \n5.2 \nBlankets \n5.3 \nDummies\n\n--- PDF PAGE 38 ---\nTR Caregiving NC II \n \n-4-"
