        "evidence_guide": {
          "source_text": "1.  Critical aspects of \ncompetency  \n \nAssessment requires evidence that the candidate: \n1.1 \nCommunicated with team and individuals on organizational \npolicy and procedures for infection control. \n1.2 \nApplied infection control policies ad procedures which impact \non work processes of the specific work unit. \n1.3 \nApplied \nprocedures \nfor \nadopting \nappropriate \ninfection \npractices within work unit. \n1.4\nProvided appropriate supervision of work group\n2. Underpinning \nknowledge and \nattitudes \n2.1 \nWorking knowledge, consistent with the elements of \ncompetence of the organization’s applicable infection control \npolicy and procedures and relevant industry codes of practice. \n2.2 \nThe hierarchy risk control measures from most to least \npreferred, that is, elimination, engineering controls, \nadministrative control and lastly personal equipment. \n2.3 \nKnowledge of infection risks and control measures in specific \nwork processes. \n2.4 \nThe significance of patient confidentiality in relation to \ninfection control. \n2.5 \nThe significance of other management systems and \nprocedures for infection control. \n2.6 \nLiteracy levels and communication skills of work group \nmembers and consequent suitable communication \ntechniques. \n2.7 \nOrganizational procedures for monitoring and training. \n2.8      Basic understanding of communicable disease transmission.\n3. Underpinning skills \n3.1 \nEffective communication and interpersonal skills including: \n- \nlanguage competence \n- \nliteracy and reading competence  \n3.2 \nNegotiation  \n3.3 \nWork planning and management  \n3.4 \nManagement of change of work processes \n3.5 \nMonitoring compliance with policy and procedures \n3.6\nMaintain and interpret infection control records\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace infection control and health and safety policies and \nprocedures \n4.2 Waste management procedures \n4.3 Food safety procedures \n4.4 Other organizational policies and procedures \n4.5 Duties statements and/or job descriptions\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nObservation \n5.2 \nInterview \n5.3 \nPortfolio \n5.4      Demonstration with questioning \n6. Context of \nassessment\n6.1  Assessment may be done in the workplace or in a simulated \nworkplace setting.",
