        "source_title": "MAINTAIN HIGH STANDARDS OF PATIENT SERVICES",
        "source_text": "--- PDF PAGE 30 ---\nTR Caregiving NC II \n \n-1- \nUNIT OF COMPETENCY : \nMAINTAIN HIGH STANDARDS OF PATIENT SERVICES \n \nUNIT CODE \n: \nHCS323204 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required in the \nmaintenance of high standards of patient services. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Communicate \nappropriately with \npatients \n1.1 \nEffective communication strategies and techniques are \nidentified and used to achieve best patient service outcomes. \n1.2 \nComplaints are responded to in accordance with \norganizational policy to ensure best service to patients. \n1.3 \nComplaints are dealt with in accordance with established \nprocedures. \n1.4 \nInterpreter services are accessed as required. \n1.5 \nAction is taken to resolve conflicts either directly, where a \npositive outcome can be immediately achieved, or by referral \nto the appropriate personnel. \n1.6 \nParticipation in work team is constructive and collaborative \nand demonstrates an understanding of own role.\n2.  Establish and \nmaintain good \ninterpersonal \nrelationship with \npatients \n2.1 \nRapport is established to ensure the service is appropriate to   \nand in the best interests of patients. \n2.2 \nEffective listening skills are used to ensure a high level of \neffective communication and quality of service. \n2.3       Patient concerns and needs are correctly identified and \nresponded to responsibility and accordingly established \nprocedures and guidelines. \n2.4      Effectiveness of interpersonal interaction is consistently \nmonitored and evaluated to ensure best patient service \noutcomes. \n3.  Act in a respectful \nmanner at all times \n3.1      Respect for differences is positively, actively and \nconsistently demonstrated in all work. \n3.2      Confidentiality and privacy of patients is maintained. \n3.3      Courtesy is demonstrated in all interactions with patients, \nvisitors, carers and family. \n3.4      Assistance with the care of patients with challenging \nbehaviors is provided in accordance with established \nprocedures. \n3.5      Techniques are used to manage and minimize aggression.\n\n--- PDF PAGE 31 ---\nTR Caregiving NC II \n \n-1- \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n4.  Evaluate own work to \nmaintain a high \nstandard of patient \nservice \n4.1 \nAdvice and assistance is received or sought from   appropriate \nsources on own performance. \n4.2      Own work is adjusted, incorporating recommendations that \naddress performance issues, to maintain the agreed standard \nof patient support.\n\n--- PDF PAGE 32 ---\nTR Caregiving NC II \n \n-1- \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Patients \n \n \nThis may include but not limited to: \n1.1 \nPatients \n \n1.2 \nProspective patients to the service/s \n \n1.3 \nPatient may be in contact with the institution through \nappropriate health care personnel and professionals or other \nadvocates or agencies\n2.  Others with whom \ninteraction is required \nin regard to patient \nservices \n2.1 \nOther staff and team members \n \n2.2 \nService units or departments \n \n2.3 \nFamily members, carers and friends of patients \n \n2.4 \nProfessional representatives or agents of patients such as: \n- \nMedical specialists \n- \nNurses \n- \nSocial workers \n- \nDietitians \n- \nTherapists \n- \nAllied health professionals \n- \nVolunteers \n- \nTeachers and/or spiritual \n- \nCommunity \n \n2.5     General Public\n3.  Communication \n3.1     English/Tagalog/Vernacular \n \n3.2     Sign language \n \n3.3     Through an interpreter \n \n3.4    Community language as required by the service/organization \n4.  Modes of \ncommunication \n4.1   Continuing interaction with patients and clients \n \n4.2   Verbal conversations either in person or via telephone \n \n4.3   Written notes by post or electronic media \n \n4.4 \n Worker, family member friend or professional interpreter who \nhas relevant languages\n5.  Respect for \ndifference \n5.1 Physical \n \n5.2    Cognitive/mental or intellectual issues that may impact on \ncommunication\n\n--- PDF PAGE 33 ---\nTR Caregiving NC II \n \n-1- \n \nVARIABLE\nRANGE\n \n \n \n5.3     Cultural and ethnic \n \n5.4     Religious/spiritual \n \n5.5    Social \n \n5.6    Age \n \n5.7    Language literacy and numeracy abilities \n \n5.8  Sexuality and sexual preference\n6.  Confidentiality and \nprivacy of patients \n6.1 \nFees \n \n6.2 \nHealth fund entitlements \n \n6.3 \nWelfare entitlements \n \n6.4 \nPayment methods and records \n \n6.5 \nPublic environments \n \n6.6 \nLegal and ethical requirements \n \n6.7 \nWriting details (i.e. medical and consent forms) \n \n6.8 \nConversations on the telephone \n \n6.9 \nSecure location for written records \n \n6.10 Offering a private location for discussions \n \n6.11 Information disclosed to an appropriate person consistent with \none’s level of responsibility\n7.  Performance \nmonitoring \n7.1 \nSelf-monitoring \n \n7.2 \nSupervisor assessment \n \n7.3\nPatient feedback\n\n--- PDF PAGE 34 ---\nTR Caregiving NC II \n \n-1- \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1      Communicated appropriately with patients \n1.2      Handled complaints and resolved conflict, or referred matters \nto supervisors when required. \n1.3      Complied with relevant policies, protocols, guidelines and \nprocedures of the organization. \n1.4 \nEstablished and maintained good interpersonal relationship \nwith patients \n1.5 \nDemonstrated courtesy in all interactions with patients, their \nvisitors and family.\n2.  Underpinning \nknowledge and \nattitudes \n2.1 \nRoles and responsibilities of self and other workers within the \norganization \n2.2 \nWhen client/patient issues need to be referred to an \nappropriate health professional \n2.3 \nOrganizational policies and procedures for privacy and \nconfidentiality of information provided by patients and others \n2.4 \nKnowledge of cultures relevant to the particular service \n2.5\nInstitutional policy on patient rights and responsibilities\n3.  Underpinning skills \n3.1      Establishing and maintaining relationships taking into account \nindividual differences \n3.2      Using effective listening techniques \n3.3      Using appropriate verbal and non verbal communication \nstyles \n3.4      Ability to interpret and follow the instructions and guidance of \nhealth professionals involved with the care of patients/clients \n3.5      Oral and written communication \n3.6      Problem solving skills required include the ability to use \navailable resources and prioritize workload \n3.7     Ability to deal with conflict \n3.8 \nAbility to work with others and display empathy with patient \nand relatives\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \n Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place. \n4.2 \nRelevant government and organizational policy, guidelines, \nprocedures and protocols. \n4.3    Any relevant legislation in relation to service delivery.\n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1      Demonstration with questioning \n5.2      Interview \n5.3      Third Party Report\n6.  Context of \nassessment\n6.1  Assessment may be done in a simulated workplace setting.\n",
        "required_knowledge": null,
        "required_skills": null
      }
