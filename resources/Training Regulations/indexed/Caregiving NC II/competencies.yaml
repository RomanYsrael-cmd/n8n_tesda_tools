        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency: \nAssessment requires evidence that the candidate: \n1.1 \nEstablished and maintained appropriate relationship with \npeople who have special needs \n1.2 \nProvided appropriate support to people with special needs \n1.3 \nAssisted in maintaining the well being of people with special \nneeds \n1.4 \nAssisted people with special needs to identify and meets their \nneeds \n2.  Underpinning \nknowledge and \n     attitudes \n2.1 \nRelevant organizational policies and procedures and \nresponsibilities within it \n2.2 \nRelevant policies, protocols and practices of the organization \nin relation to own work activities \n2.3 \nBasic knowledge of different types of disabilities and their \neffects on clients need \n2.4 \nUnderstanding of support requirements for people with special \nneeds \n2.5 \nDifferent religious, cultural, spiritual, physical, specific \nknowledge of particular groups or issues may be required like \nthe following: \n2.5.1 Alcohol and other drugs \n2.5.2 Cultural and linguistic diversity \n2.5.3 Risk of self harm \n2.5.4 Women \n2.5.5 Men \n2.5.6 Community education \n2.5.7 Mental health \n2.6 \nOrganizational philosophy and goals \n2.7 \nLegislative provision in relation to the rights of people with \ndisabilities \n2.8 \nBasic knowledge of human, social, psychological, cognitive \nand physical development \n4.4 Role and responsibility of self and others in the organization \n4.5 Organization’s definition of challenging  \n           behavior \n4.6 Relevant support equipment (and technologies) \n           and related occupational health and  \n           safety requirements regarding their use \n2.10 Impact of particular types of disability \n2.11 Principles of empowerment/disempowerment in relation to \npeople with special needs \n2.12 Occupational health and safety guidelines \n2.13 Cultural factors affecting people with special needs \nrequirements\n\n--- PDF PAGE 63 ---\nTR Caregiving NC II \n \n-29- \n2.14 Understanding of regulations and guidelines governing the \nhandling of medication \n3. Underpinning skills \n3.1 \nInterpersonal skills appropriate to work with people with \nspecial needs \n3.2 \nOral communication skills (language skills) necessary to \ndevelop a trusting relationship with people with special needs. \nLanguage may be English or community language as required \nby service or organization \n3.3 \nCommunication \n3.4 \nTeam work \n3.5 \nNegotiation \n3.6 \nUse of equipment \n3.7 \nInterpersonal communication \n3.8 \nObservation as required by job role \n3.9 \nAssessment as required by job role \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nA child care workplace \n4.2 \nFacilities, equipment, tools, supplies and materials relevant to \nthe unit of competency. \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting.",
