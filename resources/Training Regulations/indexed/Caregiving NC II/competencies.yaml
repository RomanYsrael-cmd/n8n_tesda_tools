        "source_title": "RESPOND TO EMERGENCY",
        "source_text": "--- PDF PAGE 68 ---\nTR Caregiving NC II \n \n-34- \nUNIT OF COMPETENCY : \nRESPOND TO EMERGENCY \n \nUNIT CODE \n: \nHCS323308 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nrespond to emergencies which include various aspects of disease \ncontrol and prevention and emergency measures that can be \nadministered effectively. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Implement \nprocedures for \ninfection control and \nprevention \n1.1 \nExclusion guidelines for children and others suffering from an \ninfectious condition are followed. \n1.2 \nHygiene and health principles are implemented in care \npractice. \n1.3 \nInfection control guidelines are followed. \n2. Recognize and \nrespond to signs of  \npotential illness \n2.1 \nSigns of potential illness are reported. \n2.2 \nMedical assistance is sought as necessary according to \npolicies and procedures. \n2.3 \nClients and relatives are informed as soon as possible. \n2.4 \nClient is comforted and settled. \n3. Respond to \nemergencies and      \naccidents \n3.1 \nThe safety of self and others is ensured. \n3.2 \nImmediate First Aid is provided as required. \n3.3  \nStrategies to calm, reassure and comfort clients are \nimplemented. \n3.4  \nDetails of emergency are recorded and reported accurately. \n3.5  \nInformation is provided to others according to established \npolicies. \n3.6  \nEmergencies and accidents are responded to according to the \nestablished guidelines and legislative requirements. \n4. Administer \nmedication within      \nguidelines \n4.1 \nMedication is administered according to organizational \npolicies and legislative requirements. \n4.2 \nMedication is stored according to requirements. \n4.3 \nMedication is checked for name, instructions and use by date. \n6.2 \nAll administered medications are documented in accordance \nwith requirements. \n5. Respond to threats \nand situations  of \ndanger \n5.1 \nRemove client from threat/danger or remove danger/threat \nfrom client. \n5.2 \nThe level of immediate danger is assessed and the situation is \nreported to an appropriate person. \n5.3 \nAppropriate emergency procedures are implemented to \nensure the safety of children and workers.\n\n--- PDF PAGE 69 ---\nTR Caregiving NC II \n \n-35- \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Tools and Equipment \n1.1 \nDummies (baby and adult) \n1.2 \nVital signs kit (thermometer, BP) \n1.3 \nBed Board \n1.4 \nDisposable Gloves \n1.5 \nCleaning equipment \n1.6 \nUtensils \n1.7 \nSoft toys \n1.8 \nProtective Aprons \n2. Hygiene and Health \nPrinciples \n \n2.1 \nHand Washing \n2.2 \nUse of disposable gloves when cleaning up body wastes \n2.3 \nRemoval and disposal of infected articles \n2.4 \nCleaning equipment \n2.5 \nDisposal of unused foods/milk \n2.6 \nCleaning of utensils after use \n2.7 \nRegular disinfecting of soft toys \n2.8 \nRemoval of body waste products (e.g. feces, urine, saliva, \nvomit) and disinfection of affected area \n2.9 \nUse protective aprons when changing babies \n2.10 Disinfection of nappy change areas after each use  \n3. Medication  \n \nRequirements for storage of medication may include but not limited \nto the following: \n4.1 \nLegislative guidelines \n4.2 \nOrganization procedures\n\n--- PDF PAGE 70 ---\nTR Caregiving NC II \n \n-36- \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \n1.1 \nDemonstrated ability to respond quickly to emergencies and \nimplement correct procedures including administering first aid \n1.2 \nImplemented procedures for infection control and  prevention \n1.3 \nRecognized and responded to signs of potential illness \n1.4 \nResponded to emergencies and accidents \n1.5 \nResponded to threats and situations of danger. \n2. Underpinning \nknowledge and     \nattitudes \n2.1 \nDisease spread and transmission \n2.2 \nGuidelines for inspection control \n2.3 \nIndicators of child abuse \n2.4 \nDifferent types of child abuse \n2.5 \nChild protection policy of service \n2.6 \nState/territory requirements about responding to indications of \nabuse and reporting process \n2.7 \nOrganizational standards, policies and procedures \n3. Underpinning skills \n3.1 \nCommon childhood illnesses – recognition, management \nstrategies \n3.2 \nWriting incident records \n3.3 \nMaking decision under pressure \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nA childcare workplace \n4.2 \nFacilities, equipment, supplies and materials relevant to the \nunit of competency \n6. Method of \nassessment \nCompetency MUST be assessed through: \n6.1 \nDemonstration with questioning \n6.2 \nInterview \n7. Context of \nassessment \n7.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting.\n",
