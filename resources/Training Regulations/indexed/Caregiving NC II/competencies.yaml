        "source_title": "PREPARE HOT AND COLD MEALS/FOOD",
        "source_text": "--- PDF PAGE 83 ---\nTR Caregiving NC II \n \n-49- \nUNIT OF COMPETENCY : \nPREPARE HOT AND COLD MEALS/FOOD \n \nUNIT CODE \n: \nHCS323311 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in cooking basic \nhot food and cold meals. It includes preparation of ingredients, \ncooking meals and dishes according to recipes, present, prepare \ncooked dishes/sauces, preparation of appetizers, butter designs, \ndesserts, salads, sandwiches, sauces, dressing garnishes and \npreparing centers pieces. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare ingredients \naccording to recipes \n \n1.1 \nIngredients are purchased in accordance with purchase list. \n1.2 \n“Mise en place” is checked as per SOPs. \n1.3 \nThawing  is prepared according to thawing procedures. \n1.4 \nMeat are prepared according to procedures and prescribed \nrecipe. \n1.5 \nVegetables are prepared according to the manner of \npreparation. \n1.6 \nSeafood are prepared according to method of preparation. \n2. Cook meals and \ndishes according to \nrecipes \n2.1 \nSoup is cooked as per menu. \n2.2 \nVegetable dishes are cooked according to recipe. \n2.3 \nMeat dishes are cooked according to culinary Method. \n2.4 \nPoultry and game dishes are cooked according to recipe. \n2.5 \nSea food dishes are cooked according to recipe  \n2.6 \nEgg dishes are cooked according to client’s preference \n2.7 \nPasta grain and farinaceous dishes are cooked according to \nrecipe  \n3. Present cooked \ndishes \n3.1 \nServing portion is standardized. \n3.2 \n Presentation of cooked dishes are developed and corrected \nin accordance with SOPs. \n3.3 \nFood quality is maintained and checked as per SOPs. \n3.4 \nTime and temperature condition of foods is ensured before \nserving based on freezing temperature. \n4. Prepare sauces, \ndressings and \ngarnishes \n4.1 \nMaterials, equipment/utensils are prepared prior to \npreparation of sauces, dressings and garnishes as per SOPs. \n4.2 \nSauces, garnishes, hot and cold dressing are prepared as per \nSOPs. \n5. Prepare Appetizers \n5.1 \nD’oeuvres are prepared according to requirement and \npreference of client. \n5.2 \nCanape’s are prepared according to requirement for \npreference of client. \n5.3 \nFinger foods are prepared according to requirement or \npreference of client.\n\n--- PDF PAGE 84 ---\nTR Caregiving NC II \n \n-50- \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n6. Prepare desserts and \nsalads \n6.1 \nMaterials, equipment/utensils used for cooking are prepared \nas per SOPs. \n6.2  \nSherbets, ices and ice cream are prepared in accordance with \nprescribed procedures. \n6.3 \nFruit desserts are prepared as per prescribed procedures. \n6.4 \nPastry desserts are prepared as per prescribed procedures. \n6.5 \nMousse is prepared as per prescribed procedures. \n6.6 \nCold salads and molded salads are prepared as per \nprescribed procedures. \n7. Prepare sandwiches \n7.1 \nHot sandwiches are prepared as per SOPs. \n7.2 \nCold dressings are prepared as per SOPs. \n7.3 \nHot sauces are prepared as per SOPs. \n7.4 \nCold sauces are prepared as per SOPs. \n8. Store  excess foods \nand ingredients \n8.1 \nUnconsumed food are stored according to procedures. \n8.2 \nExcess ingredients are stored according to client’s \nrequirement. \n8.3 \n Proper method of refrigeration and proper storing of dry food \nis implemented as per SOPs. \n8.4 \nWet and dry food ingredients are properly stored as per \nSOPs. \n9. Convert unconsumed \ncooked food \n9.1 \n Unconsumed cooked food is converted/transformed into new \ndishes as per SOPs. \n9.2 \nUnconsumed cooked food is store/frozen at temperature of \nzero degrees and in accordance with SOPs. \n9.3 \nPacked/wrapped uncooked food are frozen at zero degrees F \ntemperature and in accordance with SOPs. \n9.4 \nPacked/wrapped food for storage is prepared as per SOPs. \n9.5 \nUncooked food is maintained at proper temperature and as \nper SOPs.\n\n--- PDF PAGE 85 ---\nTR Caregiving NC II \n \n-51- \nRANGE OF VARIABLES \n \nVARIABLE  \nRANGE \n1. Ingredients \n \nMay include but not limited to the following: \n1.1 \nMeat \n1.2 \nVegetable \n1.3 \nSeafood \n1.4 \nPoultry and Game \n1.5 \nStock \n1.6 \nCold Food \n1.7 \nCondiments \n1.8 \nMilk \n1.9 \nDairies \n1.10 Cereals \n1.11 Flour \n1.12 Butter Sauces \n1.13\nFruits \n2. Mis en Place  \n  \n \n2.1 \nIngredients \n2.2 \nPans \n2.3 \nUtensils \n2.4\nPlates/Serving Pieces\n3. Thawing \n3.1 \nSoaking  \n3.2\nUnfreezing\n4. Vegetable Ingredient  \n     Preparation \n4.1 \nSkin, Peel, Pare \n4.2 \nChop, Slice, Shred, Cube \n4.3 \nWedge, Grate, Pure \n4.4\nCore, Quarter\n5. Vegetable Dishes \nPreparation  \n      \n5.1 \nBoiling, Blanching \n5.2 \nSauteing \n5.3 \nBraising \n5.4 \nGratinating \n5.5\nRoasting/Baking\n6. Seafood Ingredient \n     Preparation \n6.1 \nChop, Slice \n6.2 \nFillet \n6.3 \nMince, Shred \n6.4 \nPeel, Dice, Blanch \n6.5\nMarinate, Poach\n7. Seafood Dishes \nPreparation  \n     \n \n7.1 \nBoiling, Steaming \n7.2 \nSauteing \n7.3 \nDeep Frying, Pan Frying \n7.4 \nPoaching \n7.5 \nGrilling \n7.6\nBaking\n8. Soup Preparation \n    \n8.1 \nSauteing \n8.2\nSimmering\n9. Meat Ingredient \nPreparation \n9.1 \nSlice, Chop \n9.2 \nDebone \n9.3 \nDice, Mince \n9.4\nMarinate\n10. Meat Dishes \nPreparation  \n        \n10.1 Boiling, Steaming, Simmering, Stewing \n10.2 Frying (deep, pan, stir) \n10.3 Sauteing \n10.4\nRoasting, Baking, Browning\n\n--- PDF PAGE 86 ---\nTR Caregiving NC II \n \n-52- \nVARIABLE  \nRANGE \n10.5 Pressurize Cooking \n10.6 Poaching, Blanching, Braising \n10.7\nBroiling, Grilling\n11. Poultry Ingredient \nPreparation \n11.1 Deboned \n11.2 Chop, Slice \n11.3 Dice, Shred, Cube \n11.4 Mince, Skin \n11.5\nMarinate\n12. Poultry Dishes \nPreparation \n12.1 Boiling, Simmering, Stewing \n12.2 Frying (deep, pan, stir) \n12.3 Sauteing \n12.4 Braising, Grilling, Roasting \n12.5\nBarbecuing, Baking\n13. Egg Dishes \nPreparation \n13.1 Boiling \n13.2 Frying \n13.3 Poaching \n13.4 Basting \n13.5\nBaking\n14. Pasta Grain and \nFarinaceous Dishes \nPreparation \n14.1 Boiling \n14.2 Steaming \n14.3 Poaching \n14.4 Sauteing \n14.5 Gratinating \n14.6\nBaking\n15. Hors D’oeuvres \nPreparation \n15.1 Peel, Pare, Slice, Shred, Cubes \n15.2 Blanch, Boiled, Steam \n15.3\nMarinate, Seasoned\n16. Sweet Sauces \n16.1 Sugar Syrups \n16.2 Fruit Syrups \n16.3 Fruit Purees, Sauces and Coulis \n16.4 Chocolate-Based Sauces \n16.5 Custard and Cremes \n16.6\nFlavoured Butters and Creams\n\n--- PDF PAGE 87 ---\nTR Caregiving NC II \n \n-53- \nEVIDENCE GUIDE \n1. Critical aspects of  \ncompetency  \n      \n \nAssessment requires evidence that the candidate \n1.1 \nPrepared ingredients according to recipes. \n1.2 \nCooked meals and dishes according to recipes. \n1.3 \nPresented cooked dishes. \n1.4 \nPrepared appetizers. \n1.5 \nPrepared sauces, dressings and garnishes. \n1.6 \nPrepared desserts and salads. \n1.7 \nPrepared sandwiches. \n1.8 \nStored excess foods and ingredients. \n1.9\nConverted unconsumed cooked and uncooked food.\n2. Underpinning \nknowledge and \n     attitudes \n2.1 \nFood Theory \n2.2 \nMaterials Specifications and Uses \n2.3 \nTools and Equipment: Uses and Specifications \n2.4 \nCodes and Regulations \n2.4.1 Pertinent food and drink sanitation laws, rules and \nregulations \n2.5 \n Maintenance Operation \n2.6 \nBalance Diet \n2.7 \nNutrition  \n2.8 \nServing \n2.9 \nSafe Work Practices and First Aid Regulations \n2.10 Personal Hygiene \n2.11 Providing Safe Food \n2.12 Food and Safety Hazard \n2.13 Safe Food Handling \n2.14 Food Costing and Portioning \n2.15 Food Storage \n2.16 Method of Preparing Salad \n2.17\nHandling of Kitchen Equipment\n3. Underpinning skills \n3.1 \nCooking Method \n3.2 \nHandling of Kitchen Equipment \n3.3 \nProper Storing \n3.4\nFood Costing and Portioning\n4. Resource \nimplications  \nThe following resources MUST be provided: \n4.1 \nFacilities, equipment, supplies and materials relevant to the \nunit of competency\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nWritten Test \n5.2 \nDemonstration with questioning \n5.3\nObservation with questioning\n6. Context of \nassessment\n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.\n",
