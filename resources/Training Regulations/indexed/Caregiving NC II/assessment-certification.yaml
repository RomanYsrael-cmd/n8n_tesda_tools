    {
      "number": "4.2",
      "text": "The qualification of Caregiving NC II may be attained through – 4.2.1 Accumulation of Certificates of Competency (COCs) in the following areas – 4.2.1.1 Providing care and support for infants, toddlers and children • Provide care and support to infants/toddlers • Provide care and support to children • Foster, social, intellectual, creative and emotional development of children • Foster the physical development of children • Maintain healthy and safe environment • Respond to emergency • Clean living room, dining room, bedrooms, toilet and bathroom • Wash and iron clothes, linen and fabric • Prepare hot and cold meals 4.2.1.2 Providing care and support for the elderly and people with special needs • Provide care and support to elderly • Provide care and support to people with special needs • Maintain healthy and safe environment • Respond to emergency • Clean living room, dining room, bedrooms, toilet and bathroom • Wash and iron clothes, linen and fabric • Prepare hot and cold meals 4.2.2 Demonstration of competence through project-type assessment covering all required units of qualification."
