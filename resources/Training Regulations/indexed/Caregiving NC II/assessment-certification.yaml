  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Caregiving NC II, the candidate must\ndemonstrate competence through project-type assessment covering all units listed in\nSection 1. Successful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The qualification of Caregiving NC II may be attained through –\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the following areas –\n4.2.1.1\nProviding care and support for infants, toddlers and children\n• Provide care and support to infants/toddlers\n• Provide care and support to children\n• Foster, social, intellectual, creative and emotional development\nof children\n• Foster the physical development of children\n• Maintain healthy and safe environment\n• Respond to emergency\n• Clean living room, dining room, bedrooms, toilet and bathroom\n• Wash and iron clothes, linen and fabric\n• Prepare hot and cold meals\n4.2.1.2\nProviding care and support for the elderly and people with special\nneeds\n• Provide care and support to elderly\n• Provide care and support to people with special needs\n• Maintain healthy and safe environment\n• Respond to emergency\n• Clean living room, dining room, bedrooms, toilet and bathroom\n• Wash and iron clothes, linen and fabric\n• Prepare hot and cold meals\n\n4.2.2 Demonstration of competence through project-type assessment covering all\nrequired units of qualification.\n\n4.3 Assessment shall focus on the units of competency. The basic and common units shall\nbe integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced workers (wage employed or self-employed).\n\n4.5 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.6 A candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n--- PDF PAGE 99 ---\nTR Caregiving NC II\n\n-65-\n\n4.7 Only certified individuals in this Qualification may be nominated by the industry sector\nfor accreditation as competency assessor.\n\n4.8 Only accredited competency assessors are allowed to conduct competency\nassessment, however trainers who are accredited competency assessors are not\nallowed to assess their trainees.\n\n4.9 Assessment of competence must be undertaken only in the TESDA accredited\nassessment center. The performance assessment (demonstration of competence),\nhowever, may be done in any venue or workplace duly designated by an accredited\nassessment center.\n\n4.10 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n\n--- PDF PAGE 100 ---\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n"
}
