  "source_text": "COMPETENCY MAP\nCAREGIVING NC II\nProvide care and\nsupport to\ninfants/toddlers\nProvide care and\nsupport to children\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people\nwith special needs\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond effectively to\ndifficult/ challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\nFoster social,\nintellectual, creative and\nemotional development\nof children\nMaintain healthy\nand safe\nenvironment\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nFoster the physical\ndevelopment of\nchildren\nRespond to\nemergency\nClean living room,\ndining room,\nbedrooms, toilet\nand bathroom\nWash and iron\nclothes, linen and\nfabric\nPrepare hot and\ncold meals\n\n--- PDF PAGE 101 ---",
