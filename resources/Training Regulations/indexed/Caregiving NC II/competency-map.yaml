  "source_text": "Section 1. Successful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The qualification of Caregiving NC II may be attained through –\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the following areas –\n4.2.1.1\nProviding care and support for infants, toddlers and children\n• Provide care and support to infants/toddlers\n• Provide care and support to children\n• Foster, social, intellectual, creative and emotional development\nof children\n• Foster the physical development of children\n• Maintain healthy and safe environment\n• Respond to emergency\n• Clean living room, dining room, bedrooms, toilet and bathroom\n• Wash and iron clothes, linen and fabric\n• Prepare hot and cold meals\n4.2.1.2\nProviding care and support for the elderly and people with special\nneeds\n• Provide care and support to elderly\n• Provide care and support to people with special needs\n• Maintain healthy and safe environment\n• Respond to emergency\n• Clean living room, dining room, bedrooms, toilet and bathroom\n• Wash and iron clothes, linen and fabric\n• Prepare hot and cold meals\n\n4.2.2 Demonstration of competence through project-type assessment covering all\nrequired units of qualification.\n\n4.3 Assessment shall focus on the units of competency. The basic and common units shall\nbe integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced workers (wage employed or self-employed).\n\n4.5 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.6 A candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n\n--- PDF PAGE 99 ---\nTR Caregiving NC II\n\n-65-\n\n4.7 Only certified individuals in this Qualification may be nominated by the industry sector\nfor accreditation as competency assessor.\n\n4.8 Only accredited competency assessors are allowed to conduct competency\nassessment, however trainers who are accredited competency assessors are not\nallowed to assess their trainees.\n\n4.9 Assessment of competence must be undertaken only in the TESDA accredited\nassessment center. The performance assessment (demonstration of competence),\nhowever, may be done in any venue or workplace duly designated by an accredited\nassessment center.\n\n4.10 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n\n--- PDF PAGE 100 ---\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nCOMPETENCY MAP\nCAREGIVING NC II\nProvide care and\nsupport to\ninfants/toddlers\nProvide care and\nsupport to children\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people\nwith special needs\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond effectively to\ndifficult/ challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\nFoster social,\nintellectual, creative and\nemotional development\nof children\nMaintain healthy\nand safe\nenvironment\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nFoster the physical\ndevelopment of\nchildren\nRespond to\nemergency\nClean living room,\ndining room,\nbedrooms, toilet\nand bathroom\nWash and iron\nclothes, linen and\nfabric\nPrepare hot and\ncold meals\n\n--- PDF PAGE 101 ---\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who donated their time and expertise to the development and validation of this Training\nRegulation.\n\n•\nThe TESDA Advisory and Expert Panels (TAP-TEP) for the Health, Social and Other\nCommunity Development Services Sector –\nALFREDO P. PALMIERY\nConcorde International Services\n\nEDWARD B. MALZAN\nPrimacare Training Development Center\nEVARISTO A. TECSON\nPhilippine Association of Service Exporters, Inc.\n(PASEI)\nJULIE V. KALLAL\nSICES Philippines, Inc.\n•\nThe Industry Experts who developed the Competency Standard\n\nANNETTE M. DOMINGUEZ\nSICES Philippines, Inc.\n\nCARMELINA R. SALAZAR\nAAC Human Resource Training Center\nTERESITA A. LLAMAS\nAAC Human Resource Training Center\n\nANGELINA J. SUBANG\nMarian Care International Corporation\nSALES L. ROYOL\nICAN.CARE Training and Development, Inc.\nROLANDO J. TALAG\nGolden Miles Foundation and Training Center\nInternational\n\n•\nThe ADHOC Committee who reviewed the Standard\n\nENGR. ZENAIDA G. GORDON\nChairperson\n\nMR. ISIDRO ANTONIO C. ASPER\nMember\nMR. RENE LUIS TADLE\nMember\nDR. TERESITA U. QUIRINO\nMember\nDR. NONA S. RICAFORT\nMember\nMS. CONCEPCION G. DODD\nMember\n\n•\nThe Quality Assurance Committee\n\nATTY. RANULFO P. PAYOS\nChairperson\nDR. ALBERTO VICTOR P. FENIX\nMember\nMR. RENE LUIS TADLE\nMember\n\nDR. TERESITA U. QUIRINO\nMember\nDR. NONA S. RICAFORT\nMember\nMS. CONCEPCION G. DODD\nMember\n\n--- PDF PAGE 102 ---\nList of Published Training Regulations\n\n Animal Production NC II\n Aquaculture NC II\n Automotive Body Painting/Finishing NC II\n Automotive Body Repair NC II\n Automotive Engine Rebuilding NC II\n Automotive Servicing NC II\n Bartending NC II\n Building Wiring Installation NC II\n Carpentry NC II\n Commercial Cooking NC II\n Computer Hardware Servicing NC II\n Deck Seafaring NC II\n Dressmaking NC II\n Driving NC II\n Engine Seafaring NC II\n Food and Beverage Services NC II\n Footwear Making NC II\n Heavy Equipment Operation NC II\n Horticulture NC II\n Household Services NC II\n Housekeeping NC II\n Machining NC II\n Masonry NC II\n Motorcycle and Small Engine Servicing NC II\n Caregiving NC II\n Plumbing NC II\n Pyrotechnics NC II\n RAC Servicing NC I\n RAC Servicing NC II\n Security Services NC II\n Tailoring NC II\n Tour Guiding Services NC II\n Transport RAC Servicing NC II\n Travel Services NC II\n Welding NC II\n\nThese materials are available in both printed and electronic copies.\nFor more information please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTelephone Nos.: 893-8303, 893-2139; 817-4076 to 82 loc. 615 to 617\nor visit our website: www.tesda.gov.ph"
