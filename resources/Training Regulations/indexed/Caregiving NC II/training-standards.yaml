      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for CAREGIVING NC II.\n\nThis includes information on curriculum design, training delivery, trainee entry requirements,\ntools and equipment, training facilities and trainers qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: CAREGIVING\nNC Level: NC II\n\nNominal Training Duration: 786 HRS.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of Caregivers in\naccordance with industry standards. It covers basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\nobservation\n• Interviews/\n• Questioning\n1.2\nComplete relevant work\nrelated documents\n1.3\nParticipate in workplace\nmeeting and discussion\n2. Work in a team\nenvironment\n2.1\nDescribe and identify team\nrole and responsibility in a\nteam\n2.2\nDescribe work as a team\nmember\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal\nobjectives with\norganizational goals\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\nobservation\n• Interviews/\n• Questioning\n3.2\nSet and meet work priorities\n3.3\nMaintain professional\ngrowth and development\n4. Practice\noccupational\nhealth and\nsafety\n4.1\nEvaluate hazard and risks\n4.2\nControl hazards and risks\n4.3\nMaintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 89 ---\nTR Caregiving NC II\n\n-55-\nCOMMON COMPETENCIES\n(18 Hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Implement and\nmonitor\ninfection control\npolicies and\nprocedures\n1.1\nProvide information to the\nwork group about the\norganization’s infection\ncontrol policies and\nprocedures.\n1.2\nIntegrate the organization’s\ninfection control policy and\nprocedure into work\npractices.\n1.3\nMonitor infection control\nperformance and implement\nimprovements in practices\n• Lecturette\n• Brainstorming\n\n• Observation and\noral questioning\n• Grid question\n• Practical\nexercise\n\n2. Respond\neffectively to\ndifficult/challen\nging behavior\n2.1\nPlan and respond to\nemergencies.\n2.2\nReport and review incidents.\n• Lecturette\n• Brainstorming\n• Observation and\noral questioning\n• Grid question\n• Practical\nexercise\n3. Apply basic first\naid\n3.1\nAssess the situation.\n3.2\nApply basic first aid\ntechniques.\n3.3\nCommunicate details of the\nincident.\n• Lecturette\n• Brainstorming\n• Observation and\noral questioning\n• Grid question\n• Practical\nexercise\n4. Maintain high\nstandard of\npatient services\n4.1\nCommunicate appropriately\nwith patients.\n4.2\nEstablish and maintain good\ninterpersonal relationship\nwith patients.\n4.3\nAct in a respectful manner\nat all times.\n4.4\nEvaluate own work to\nmaintain a high standard of\npatient service.\n• Lecturette\n• Brainstorming\n• Observation and\noral questioning\n• Grid question\n• Practical\nexercise\n\n--- PDF PAGE 90 ---\nTR Caregiving NC II\n\n-56-\nCORE COMPETENCIES\n(750 Hours)\n\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Provide care\nand support to\ninfants\n/toddlers\n1.1\nExplain the concepts and\nprinciples of caring, growth\nand development of\ninfants/toddlers\n• Discussion\n• Demonstration\n\n• Questioning\ndemonstration\nobservation\n\n1.2\nPrepare infants / toddlers for\ntaking vital signs, bathing\nand dressing\n1.3\nClean, sterilize feeding\nbottles and prepare milk\nformula\n1.4\nPrepare and introduce\nadequate nutrition and semi-\nsolid food.\n1.5\nPrepare infant / toddlers\ncrib.\n2. Provide care\nand support to\nchildren\n2.1 Explain the importance of\ninstilling personal hygiene\npractices to children\n• Discussion\n• Demonstration\n• Brainstorming\n• Demonstration\nobservation\n• Questioning\n2.2 Maintain children’s\nparaphernalia\n2.3 Prepare children for taking\nvital sign, bathing and\ndressing\n2.4 Perform after care activities\nfor materials and\nparaphernalia\n2.5 Determine nutritional food\nrequirements of children\n3. Foster social,\nintellectual,\ncreative and\nemotional\ndevelopment of\nchildren\n3.1 Explain the concepts and\nprinciples of social,\nintellectual, creative and\nemotional development of\nchildren (3-12 yrs. Old)\n• Discussion\n• Role play\n• Brainstorming\n• Questioning\n• Demonstration\n• Observation\n4. Foster physical\ndevelopment of\nchildren\n4.1 Explain the concepts and\nprinciples of physical\ndevelopment of children\n• Discussion\n• Role play\n• Brainstorming\n• Demonstration\n• Questioning\n• Observation\n• Demonstration\n4.2 Explain the importance of\nhealthy sleeping patterns\nand practices\n4.3\nPerform physical activities\n5. Provide care\nand support to\nelderly\n5.1 Explain the concepts and\nprinciples of basic nursing\ncare of the elderly\n• Discussion\n• Brainstorming\n\n• Observation\n• Questioning\n5.2 Identify appropriate physical,\nemotional, spiritual and\nintellectual needs.\n\n--- PDF PAGE 91 ---\nTR Caregiving NC II\n\n-57-\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n5.3 Provide assistance in\npromoting the appropriate\nneeds for roles,\nresponsibilities, rights,\nfreedom and activities of\nelderly.\n5.4 Provide adequate nutrition\nand elimination\n6. Provide care\nand support to\npeople with\nspecial needs\n6.1 Identify and explain the\nneeds of people with special\nneeds\n• Discussion\n• Demonstration\n• Questioning\n• Written exam\n• Demonstration\n6.2 Identify personal care and\nassistance needed for daily\nliving\n6.3 Establish and maintain\nappropriate relationship\n6.4 Provide appropriate support\nfor people with special\nneeds\n6.5 Assist in oral and written\ncommunication\n6.6 Provide adequate nutrition\nand elimination for people\nwith special needs\n7. Maintain a\nhealthy and\nsafe\nenvironment\n7.1 Explain the concepts and\nprinciples in maintaining a\nclean and therapeutic\nenvironment\n• Discussion\n• Demonstration\n\n• Demonstration\nquestioning\n7.2 Explain the procedure in\nmaintaining a clean and\ntherapeutic environment\n7.3 Assist client in implementing\na safe and therapeutic\nenvironment\n8. Respond to\nemergency\n8.1 Discuss signs and\nsymptoms of various\nillnesses and diseases\n• Discussion\n• Demonstration\n• Simulation\n• Video viewing\n• Demonstration\nquestioning\n8.2 Identify and explain\nappropriate first aid and\nbasic emergency procedure\n8.3 Explain the procedures in\nimplementing infection\ncontrol prevention\n8.4 Identify the appropriate\nprocedures in medicine\nadministration\n8.5 Identify dangerous,\nhazardous and threat to\nsafety and well being\n8.6\nPerform first aid procedures\n\n--- PDF PAGE 92 ---\nTR Caregiving NC II\n\n-58-\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n9. Clean living\nroom, dining\nroom,\nbedroom, toilet\nand bathroom\n9.1 Explain the principles and\nproper procedures in\ncleaning and polishing\n(living room, bedroom,\nbathroom, and kitchen)\n• Discussion\n• Demonstration\n• Video viewing\n\n• Demonstration\nquestioning\n\n9.2 Clean and sanitize toilet and\nbathroom\n9.3 Identify different kinds of\ncleaning agent\n9.4 Make up beds and cots.\n(open and closed bed)\n9.5 Maintain a clean\nenvironment\n9.6 Perform after care activities\nof materials and equipment\n10. Wash and iron\nclothes, linens\nand fabrics\n10.1 Explain the principles and\nprocedures in washing and\nironing clothes\n• Discussion\n• Demonstration\n• Demonstration\nquestioning\n10.2 Explain the procedures in\noperating tools and\nequipment\n10.3 Perform laundry\n10.4 Iron clothes, linens and\nfabrics\n10.5 Perform after care activities\nof materials and equipment\n11. Prepare hot\nand cold\nmeals\n11.1 Explain the procedures in\npreparing hot and cold\nmeals\n• Discussion\n• Demonstration\n\n• Demonstration\nquestioning\n11.2 Prepare hot and cold meals\n11.3 Prepare appetizers, sauces,\ndressings and garnishes\n11.4 Cook meals and dishes\naccording to recipe/ dietary\nrequirements\n11.5 Set table and serve cooked\ndishes\n11.6 Perform after care activities\nof materials and equipment\n11.7 Demonstrate personal good\ngrooming and hygiene\n11.8 Demonstrate clear and\neffective communication on\nthe job.\n11.9 Maintain professionalism at\nthe workplace\n\n--- PDF PAGE 93 ---\nTR Caregiving NC II\n\n-59-\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 94 ---\nTR Caregiving NC II\n\n-60-\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both in oral and written;\n• physically and mentally fit;\n• with good moral character; and\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nCAREGIVING NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nCaregiving NC II are as follows:\n\nTO