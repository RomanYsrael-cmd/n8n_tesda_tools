      "source_text": "3.5 TRAINING FACILITIES\n\nCaregiving NC II\n\nThe Caregiving Learning Facility must be of concrete structure. Based on a class intake of\n25 students/trainees, the space requirements for the teaching / learning and curriculum areas\nare as follows.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nAdministration Office\n\nDemonstration Room\n- Child care\n\n30 sq. m.\n30 sq. m.\n- Home Management\n\n60 sq. m.\n60 sq. m.\n- Elderly Care\n30 sq. m.\n30 sq. m.\n- Care for people with special needs\n30 sq. m.\n30 sq. m.\nAcademic room\n30 sq. m.\n30 sq. m.\nStudy room/Learning Resource\nCenter\n\nClinic\nSeparate restrooms for female and\nmale\n\nLibrary holdings must not be less than\nfive (5) titles related and for each title\nat least 3 copies each\n\nTotal workshop area:\n180 sq. m.\n\n--- PDF PAGE 97 ---\nTR Caregiving NC II\n\n-63-"
