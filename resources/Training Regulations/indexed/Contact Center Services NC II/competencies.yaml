        "source_text": "--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n34\nUNIT TITLE                :  DEMONSTRATE ABILITY TO EFFECTIVELY ENGAGE \nCUSTOMERS \nUNIT CODE                :  ICT313367 \nUNIT DESCRIPTOR  :   This unit covers the knowledge and skills needed to \ndemonstrate an ability to engage customers. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Demonstrate \nan ability to \nempathize with \na customer \n1.1. Ability to sense \nfeelings of customer \nand respond \naccordingly to \nacknowledge such \nfeelings is \ndemonstrated  \n1.2. Empathy for the \ncustomer was \ndemonstrated \naccording to the \npurpose of the call \n \n1.1. Requires \nknowledge of \n Call flow \nprocess / \nprocedure \n (optional) \nProduct \nknowledge \n Rules of basic \ngrammar in \nverbal \ncommunication \n Rules of basic \ncommunication \n Rules of \neffective \nbusiness \ncommunication \nin customer \nservice \n Rules for \nbuilding \neffective \ninterpersonal \nrelationships \n1.2. Requires \nappropriate \nattitude on \n Confidence in \nspeaking \nEnglish \n1.1.  Needs skills on \n Applying the 3 \nC’s of \ncommunication \n Oral English \ncommunication \nskills  \n Understanding \nof commonly \nused idioms/ \ncolloquialisms \n(whether \nAmerican, \nCanadian, \nAustralian, or \nBritish)  \n1.2. Practices along \neconomic use and \nmaintenance of \nequipment and \nfacilities are \nfollowed as per \nestablished \nprocedures and \nenvironmental \nrequirements \n1.3. Occupational \nhealth and safety \nstandards in the \nworkplace and 5S \ndisciplines are \nstrictly allowed\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \n \n_______________________________________________________________