        "source_text": "--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n14\nUNIT OF COMPETENCY :     PRACTICE OCCUPATIONAL HEALTH AND SAFETY   \nPROCEDURES  \nUNIT CODE                     :       500311108 \n \nUNIT DESCRIPTOR        :       This unit covers the outcomes required to comply with \nregulatory \nand \norganizational \nrequirements \nfor \noccupational health and safety.  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nhazards and \nrisks \n1.1 Safety regulations \nand workplace safety \nand hazard control \npractices and \nprocedures are \nclarified and explained \nbased on organization \nprocedures \n1.2 Hazards/risks in the \nworkplace and their \ncorresponding \nindicators are identified \nto minimize or \neliminate risk to co-\nworkers, workplace \nand environment in \naccordance with \norganization \nprocedures \n1.3 Contingency \nmeasures during \nworkplace accidents, \nfire and other \nemergencies are \nrecognized and \nestablished in \naccordance with \norganization \nprocedures \n1.1  OHS procedures \nand practices and \nregulations \n1.2  Hazards/risks \nidentification and \ncontrol \n1.3  OHS indicators \n1.4 Organizational \ncontingency \npractices \n \n1.1 Hazards/risks \nidentification \nand control \nskills \n1.2 Practice of  \nsafety and \nhealth \nprocedures \nand personal \nhygiene\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          15\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n2. Evaluate \nhazards and \nrisks \n2.1 Terms of maximum \ntolerable limits which  \nwhen exceeded will \nresult in harm or \ndamage are identified \nbased on threshold \nlimit values (TLV) \n2.2 Effects of the hazards \nare determined \n2.3 OHS issues and/or \nconcerns and identified  \nsafety hazards are \nreported to designated \npersonnel in \naccordance with \nworkplace \nrequirements and \nrelevant workplace \nOHS legislation \n2.1  Threshold Limit \nValue -TLV \n2.2 Effects of safety \nhazards \n \n2.1 Communication \nskills \n2.2 Reporting safety \nhazards \n3. Control \nhazards and \nrisks  \n3.1 Occupational Health \nand Safety (OHS) \nprocedures for \ncontrolling \nhazards/risks in \nworkplace are \nconsistently followed \n3.2 Procedures for \ndealing with \nworkplace accidents, \nfire and emergencies \nare followed in \naccordance with \norganization OHS \npolicies \n3.3 Personal protective \nequipment (PPE) is \ncorrectly used in \naccordance with \norganization OHS \nprocedures and \npractices \n3.1  Personal hygiene \npractices \n3.2  Organization \nsafety and health \nprotocol \n3.3 Company \nemergency \nprocedure \npractices \n \n3.1 Practice of \npersonal \nhygiene  \n3.2  Respond to \nemergency\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n16\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n3.4 Appropriate assistance \nis provided in the event \nof a workplace \nemergency in \naccordance with \nestablished \norganization protocol \n \n \n4. Maintain OHS \nawareness \n4.1   Emergency-related \ndrills and trainings \nare participated in as \nper established \norganization guidelines \nand procedures \n4.2   OHS personal \nrecords are completed \nand updated in \naccordance with \nworkplace \nrequirements  \n4.1 Workplace OHS \npersonal \nrecords \n4.2 Information on \nemergency-\nrelated drills \n4.1 Practice \nemergency-\nrelated drill \nskills in the \nworkplace\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          17\nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Safety regulations \nMay include but are not limited to: \n1.1 Clean Air Act \n1.2 Building code \n1.3 National Electrical and Fire Safety Codes \n1.4 Waste management statutes and rules \n1.5 Philippine Occupational Safety and Health \nStandards \n1.6 DOLE regulations on safety legal requirements \n1.7 ECC regulations\n2. Hazards/Risks \nMay include but are not limited to: \n2.1 Physical hazards – impact, illumination, pressure, \nnoise, vibration, temperature, radiation  \n2.2 Biological hazards- bacteria, viruses, plants, \nparasites, mites, molds, fungi, insects \n2.3 Chemical hazards – dusts, fibers, mists, fumes, \nsmoke, gasses, vapors \n2.4 Ergonomics \n Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n Physiological factors – monotony, personal \nrelationship, work out cycle\n3. Contingency \nmeasures \nMay include but are not limited to: \n3.1 Evacuation \n3.2 Isolation \n3.3 Decontamination \n3.4 (Calling designed) emergency personnel\n4. Emergency-related \ndrills and training \n4.1 Fire drill \n4.2 Earthquake drill  \n4.3 Basic life support/CPR \n4.4 First aid \n4.5 Spillage control  \n4.6 Decontamination of chemical and toxic \n4.7 Disaster preparedness/management \n5. OHS personal \nrecords \n5.1  Medical/Health records \n5.2  Incident reports \n5.3  Accident reports \n5.4  OHS-related training completed\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \n \n__________________________