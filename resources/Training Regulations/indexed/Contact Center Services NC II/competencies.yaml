        "source_text": "--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n2\nSECTION 2.     COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in CONTACT CENTER SERVICES NC II. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY:    PARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n     :    500311105 \nUNIT DESCRIPTOR      : \nThis unit covers the knowledge, skills and attitudes   required \nto gather, interpret and convey information in response to \nworkplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1  Specific and  \nrelevant information \nis accessed from \nappropriate sources \n1.2  Effective questioning,  \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3  Appropriate medium \nis used to transfer \ninformation and ideas\n1.4  Appropriate non- \nverbal \ncommunication is \nused \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and \nfollowed \n1.6  Defined workplace \nprocedures for the \nlocation and storage \nof information are \nused \n1.7  Personal interaction \nis carried out clearly \nand concisely\n1.1 Effective \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Written \ncommunication \n1.4 Organizational \npolicies \n1.5 Sources of \ninformation \n1.6 Types of question \n1.7 Medium of \ncommunication \n1.8 Flow of \ncommunication \n1.9 Storage system \n1.10 Telephone \ncourtesy \n \n1.1 Follow simple \nspoken \nlanguage \n1.2 Performing \nroutine \nworkplace \nduties \nfollowing \nsimple written \nnotices \n1.3 Ability to \nrelate to \npeople of \nsocial range \nin the \nworkplace \n1.4 Gather and \nprovide \ninformation in \nresponse to \nworkplace \nrequirements \n1.5 Listening \nskills \n1.6 Questioning \nskills \n1.7 Workplace \nlanguage \nskills\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          3\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.   Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2  Own opinions are \nclearly expressed and \nthose of others are \nlistened to without \ninterruption \n2.3  Meeting inputs are \nconsistent with the \nmeeting purpose and \nestablished protocols \n2.4  Workplace \ninteractions are \nconducted in a \ncourteous manner  \n2.5  Questions about simple \nroutine workplace \nprocedures and matters \nconcerning working \nconditions of \nemployment are asked \nand responded to \naccording to \norganizational \nguidelines \n2.6  Meetings outcomes are \ninterpreted and \nimplemented \n2.1. Communication \nprocedures and \nsystems \n2.2. Meeting protocols \n2.3. Nature  of workplace \nmeetings \n2.4. Barriers of \ncommunication \n2.5. Workplace \ninteractions \n2.6. Non verbal \ncommunication \n2.1. Ability to relate to \npeople of social \nrange in the \nworkplace  \n2.2. Interpersonal \ncommunication \nskill \n2.3. Observing \nmeeting \nprotocols \n3.   Complete \nrelevant work \nrelated \ndocuments \n3.1  Range of forms relating \nto conditions of \nemployment are \ncompleted accurately \nand legibly \n3.2  Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3  Basic mathematical \nprocesses are used for \nroutine calculations \n3.4  Errors in recording \ninformation on forms/ \ndocuments are \nidentified and properly \nacted upon \n3.5  Reporting requirements \nto supervisor are \ncompleted according to \norganizational \nguidelines \n3.1 Technology relevant \nto the enterprise and \nthe individual’s work \n3.2  Types of workplace  \ndocuments and forms \n3.3 Basic mathematical \nconcepts \n3.4 Kinds of workplace \nreport \n \n \n3.1 Apply basic \nmathematical \nprocesses of \naddition, \nsubtraction, \ndivision and \nmultiplication \n3.2 Data recording \n3.3 Report writing\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n4\n \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6. \nFace to face communication \n3. Storage \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Forms \n4.1. \nPersonnel forms, telephone message forms, \nsafety reports \n5. Workplace \ninteractions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, instruction \nand forms, non-verbal including gestures, signals, \nsigns and diagrams \n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          5\n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard \nformat  of the organization \n1.2. Accessed information using communication \nequipment \n1.3. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4. Conveyed information effectively adopting the formal \nor informal communication \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Writing materials \n2.4. Internet \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Direct Observation \n3.2. Oral interview and written test \n4. Context for \nAssessment \n4.1. Competency may be assessed individually in the \nactual workplace or through accredited institution\n",
