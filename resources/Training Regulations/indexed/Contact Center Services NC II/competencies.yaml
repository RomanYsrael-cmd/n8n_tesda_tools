        "source_title": "PERFORM CUSTOMER SERVICE DELIVERY PROCESSES",
        "source_text": "--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n30\nUNIT TITLE              :  PERFORM CUSTOMER SERVICE DELIVERY PROCESSES \n \nUNIT CODE              :   ICT313366 \n \nUNIT DESCRIPTOR:   This unit covers the knowledge and skills needed to effectively \nconduct a customer service delivery process. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Demonstrate an \nability to answer \nor make a call  \n \n1.1. Calls are answered in \naccordance with \nenterprise inbound \nprocedures \n1.2. Calls are made in \naccordance with \nenterprise outbound \nprocedures \n \n1.1. Requires \nknowledge of  \n Call flow \nprocess/ \nprocedure \n Rules of basic \ngrammar in \nverbal \ncommunication \n Rules of basic \ncommunication \n \n1.1. Needs skills on \n Applying the 3 C’s \nof communication  \n Oral English \ncommunication \nskills  \n Understanding of \ncommonly used \nidioms/colloquialis\nms (whether \nAmerican, \nCanadian, \nAustralian, or \nBritish)  \n1.2. Practices along \neconomic use and \nmaintenance of \nequipment and \nfacilities are followed \nas per established \nprocedures and \nenvironmental \nrequirements \n1.3. Occupational health \nand safety standards \nin the workplace and \n5S disciplines are \nstrictly allowed \n2. Demonstrate \nan ability to \nidentify a \ncustomer need \n2.1. Customer needs are \nidentified appropriately \nto avoid irritation  \n2.2. Customer concern is \nclarified or confirmed \nby paraphrasing  \n \n2.1. Requires \nknowledge of  \n Industry, job \nexpectations, and \ncareer \nopportunities in \ncontact centers  \n Fundamentals of \ncustomer service \n(principles for \ncomplete \ncustomer service, \nthe rules of good \ncustomer service, \nand the types of \ncontact center \n2.1. Needs skills on \n Interpreting user \nmanuals and help \nfunctions when \nusing equipment \nand software tools\n Finding and using \ninformation \nrelevant to the \ntask from a variety \nof information \nsources \n2.2. Practices along \neconomic use and \nmaintenance of \nequipment and\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          \n31\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nprocesses) \n (optional) Product \nknowledge \n Rules of effective \nbusiness \ncommunication in \ncustomer service \nfacilities are \nfollowed as per \nestablished \nprocedures and \nenvironmental \nrequirements \n2.3. Occupational health \nand safety \nstandards in the \nworkplace and 5S \ndisciplines are \nstrictly allowed\n3. Demonstrate \nan ability to \ncapture and \nprovide \ninformation \nand/or \ndirections  \n3.1. Information from a call \nis captured and \nrecorded accurately in \naccordance with \nprescribed process \nguidelines \n3.2. Ability to carry out \nwritten and verbal \ninstructions is \ndemonstrated \naccurately in \naccordance with \nprescribed process \nguidelines \n3.3. Ability to direct the \ncustomer concerns to \nthe correct department \nor support group is \ndemonstrated \naccurately in \naccordance with \nprescribed process \nguidelines \n \n3.1. Requires \nappropriate \nattitude on \n Confidence in \nspeaking \nEnglish \n3.1. Needs skills on \n Carrying out \nwritten and \nverbal \ninstructions \n Inputting, \naccessing, \nproducing and \ntransferring \ndata using the \nappropriate \nhardware and \nsoftware \n3.2. Practices along \neconomic use and \nmaintenance of \nequipment and \nfacilities are \nfollowed as per \nestablished \nprocedures and \nenvironmental \nrequirements \n3.3. Occupational \nhealth and safety \nstandards in the \nworkplace and 5S \ndisciplines are \nstrictly allowed\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n32\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Enterprise \ninbound \nprocedure \n  \nThe inbound procedure may include the following tasks: \n1.1. Opening spiel \n1.2. Identify/clarify customer need \n1.3. Resolve or address need/offer solution to customer  \n1.4. Confirm customer satisfaction  \n1.5. Cross-sell/up-sell, if appropriate or if needed \n1.6. Closing spiel  \n2. Enterprise \noutbound \nprocedure \nThe outbound procedure includes the following tasks: \n2.1. Opening spiel \n2.2. Find decision maker  \n2.3. Get past the gatekeeper \n2.4. Probe for/clarify customer need \n2.5. Offer product and/or solutions to serve customer need  \n2.6. Handle objections \n2.7. Close the sale \n2.8. Closing spiel\n3. Customer \nconcerns \nCustomer concerns can be a combination of the following: \n3.1. Inquiries on product features or billing \n3.2. Account information management \n3.3. Troubleshooting \n3.4. Customer complaints\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          33\nEVIDENCE GUIDE \n \n1.  Critical aspects \nof competency \nAssessment must show that the candidate: \n1.1. Demonstrated knowledge of the call flow process \n1.2. Answered calls in accordance with enterprise inbound \nprocedures \n1.3. Answered calls in accordance with enterprise outbound \nprocedures \n1.4. Identified customer needs appropriately to avoid irritation  \n1.5. Clarified or confirms customer concern by paraphrasing \n1.6. Accurately captured and recorded information from a call in \naccordance with prescribed process guidelines \n1.7. Demonstrated an ability to accurately carry out written and \nverbal instructions in accordance with prescribed process \nguidelines \n1.8. Demonstrated ability to find and use information relevant to \nthe task from a variety of information sources \n1.9. Demonstrated an ability to accurately direct the customer \nconcerns to the correct department or support group in \naccordance with prescribed process guidelines \n \n2.  Method of \nassessment \nThe assessor must select two of the following to objectively \nassess the candidate \n4.1. Demonstration with oral questioning \n3.  Resources \nrequired for \nassessment\nThe following must be UTILIZED \n5.1. Computer with peripherals \n5.2. (optional) Internet access\n4.  Context of \nassessment\n6.1  Competency may be assessed in a contact center or \nsimulated contact center environment.\n",
