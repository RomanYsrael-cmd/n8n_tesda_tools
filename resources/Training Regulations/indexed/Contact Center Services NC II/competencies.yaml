        "source_title": "APPLY QUALITY STANDARDS",
        "source_text": "--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          19\nCOMMON COMPETENCIES \n \n \nUNIT TITLE \n: \nAPPLY QUALITY STANDARDS \n \nUNIT CODE \n: \n506315202 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills, attitudes and values \nneeded to apply quality standards in the workplace.  The unit \nalso includes the application of relevant safety procedures and \nregulations, \norganization \nprocedures \nand \ncustomer \nrequirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Assess quality \nof received \nmaterials  \n1.1. Work instruction is \nobtained and work is \ncarried out in \naccordance with \nstandard operating \nprocedures. \n1.2. Received  materials \nare checked against \nworkplace standards \nand specifications. \n1.3. Faulty materials \nrelated to work are \nidentified and isolated.\n1.4. Faults and any \nidentified causes are \nrecorded and/or \nreported to the \nsupervisor concerned \nin accordance with \nworkplace \nprocedures. \n1.5. Faulty materials are \nreplaced in \naccordance with \nworkplace \nprocedures. \n1.1 Relevant \nproduction \nprocesses, \nmaterials and \nproducts \n1.2 Characteristics \nof materials, \nsoftware and \nhardware used \nin production \nprocesses \n1.3 Quality checking \nprocedures \n1.4 Quality \nWorkplace \nprocedures  \n1.5  Identification of \nfaulty materials \nrelated to work \n \n1.1. Reading skills \nrequired to \ninterpret work \ninstruction \n1.2. Critical \nthinking \n1.3. Interpreting \nwork \ninstructions\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n20\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Assess own \nwork \n2.1. Documentation \nrelative to quality within \nthe company is \nidentified and used. \n2.2. Completed work is \nchecked against \nworkplace standards \nrelevant to the task \nundertaken. \n2.3. Errors are identified \nand isolated. \n2.4. Information on the \nquality and other \nindicators of production \nperformance are \nrecorded in accordance \nwith workplace \nprocedures. \n2.5. In cases of deviations \nfrom specific quality \nstandards, causes are \ndocumented and \nreported in accordance \nwith the workplace’ s \nstandards operating \nprocedures. \n \n2.1  Safety and \nenvironmental \naspects of \nproduction \nprocesses \n2.2  Fault identification \nand reporting  \n2.3  Workplace \nprocedure in \ndocumenting \ncompleted work \n2.4  Workplace \nQuality Indicators \n \n2.1 Carry out work \nin accordance \nwith OHS \npolicies and \nprocedures \n \n \n3. Engage in \nquality \nimprovement \n3.1 Process improvement \nprocedures are \nparticipated in relative \nto workplace \nassignment. \n3.2 Work is carried out in \naccordance with \nprocess improvement \nprocedures. \n3.3 Performance of \noperation or quality of \nproduct of service to \nensure customer \nsatisfaction is \nmonitored. \n \n3.1  Quality \nimprovement \nprocesses \n3.2  Company \ncustomers defined \n3.1 Solution \nproviding and \ndecision-\nmaking \n3.2  Practice \ncompany \nprocess \nimprovement \nprocedure\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          21\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Materials  \n1.1 Materials may include but not limited to: \n1.1.1. Manuals \n1.1.2. Job orders \n1.1.3. Instructional videos \n \n2 Faults \n2.1 Faults may include but not limited to: \n2.1.1. Materials not to according to specification \n2.1.2. Materials contain incorrect/outdated \ninformation \n2.1.3. Hardware defects \n2.1.4. Materials that do not conform with any \nregulatory agencies  \n \n3 Documentation  \n3.1 Organization work procedures \n3.2 Manufacturer’s instruction manual \n3.3 Customer requirements \n3.4 Forms  \n \n4 Errors \n4.1 Errors may be related  but not limited to the following: \n4.1.1. Deviation from the requirements of the Client  \n4.1.2. Deviation from the requirement of the \norganization \n \n5 Quality standards \n \n5.1 Quality standards may be related but not limited to the \nfollowing: \n5.1.1. Materials \n5.1.2. Hardware \n5.1.3. Final product \n5.1.4. Production processes \n5.1.5. Customer service \n \n6 Customer \n6.1 Co-worker \n6.2 Supplier/Vendor \n6.3 Client \n6.4 Organization receiving the product or service\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n22\nEVIDENCE GUIDE \n \n \n \n1 Critical aspect of          \ncompetency \nAssessment must show that the candidate: \n1.1 Carried out work in accordance with the company’s \nstandard operating procedures \n1.2 Performed task according to specifications \n1.3 Reported defects detected in accordance with \nstandard operating procedures \n1.4 \nCarried out work in accordance with the process \nimprovement procedures \n2 Method of \nassessment \nThe assessor must select two of the following     to \nobjectively evaluate the candidate: \n2.1 Observation and oral questioning \n2.2 Third party report \n2.3 Portfolio \n2.4 Practical demonstration \n3 Resource implication \nMaterials, software and hardware to be used in a real or \nsimulated   situation  \n4 Context of \nAssessment \nAssessment may be conducted in the workplace or in a \nsimulated environment\n",
