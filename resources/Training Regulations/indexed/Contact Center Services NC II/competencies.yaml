ts \n2.3. \nSharing one’s reasoning \n2.4. \nCommunicating constructively \n \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects \nof competency \nAssessment must show that the candidate: \n1.1. Demonstrated an ability to sense feelings of customer and \nrespond accordingly to acknowledge such feelings \n1.2. Demonstrated empathy for the customer according to the \npurpose of the call \n1.3. Applied methods and techniques for managing difficult \nconversations in order to diffuse an upset customer in \naccordance with prescribed process guidelines \n1.4. Avoided manifestations of stress in conversations in \naccordance with prescribed process guidelines \n \n2.  Method of \nassessment \nThe assessor must select two of the following to objectively \nassess the candidate \n4.1. \nDemonstration with oral questioning \n \n3.  Resources \nrequired for \nassessment\nThe following must be UTILIZED \n5.1. \nComputer with peripherals \n5.2.\nInternet access\n4.  Context of \nassessment \nCompetency may be assessed in a contact center or simulated \ncontact center environment.\n",
