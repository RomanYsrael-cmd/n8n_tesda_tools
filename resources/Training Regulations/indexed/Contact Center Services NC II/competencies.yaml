        "source_text": "--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n6\nUNIT OF COMPETENCY: \nWORK IN TEAM ENVIRONMENT \nUNIT CODE \n       :     500311106 \nUNIT DESCRIPTOR \n : \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n1. Describe team \nrole and scope \n1.1. The role and \nobjective of the team \nis identified from \navailable sources of \ninformation \n1.2. Team parameters, \nreporting relationships \nand responsibilities \nare identified from \nteam discussions and \nappropriate external \nsources  \n1.1. Team roles \n1.2. Definition of \nTeam \n1.3. Difference \nbetween team \nand \n1.4. group \n1.5. Different sources \nof information \n1.6. Objectives and \ngoals of team \n1.1 Describing the \nteam role  and \nscope \n \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1  Individual role and \nresponsibilities within \nthe team environment \nare identified \n2.2  Roles and \nresponsibility of other \nteam members are \nidentified and \nrecognized \n2.3  Reporting \nrelationships within \nteam and external to \nteam are identified\n2.1. Team structure  \n2.2. Roles and \nresponsibility of \nteam members \n2.3. Teams in work \nenvironment \n2.4.  Fundamental \nrights at work \nincluding gender \nsensitivity  \n2.1. Communicating \nappropriately, \nconsistent with \nthe culture of \nthe workplace \n2.2. Identifying \nindividual role \nand \nresponsibility \n2.3. 2.3 Identifying \nexternal \nrelationship\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          7\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Work as a team \nmember  \n3.1  Effective and \nappropriate forms of \ncommunications used \nand interactions \nundertaken with team \nmembers who \ncontribute to known \nteam activities and \nobjectives \n3.2  Effective and appropriate \ncontributions made to \ncomplement team \nactivities and objectives, \nbased on individual skills \nand competencies and \nworkplace context \n3.3  Observed protocols in \nreporting using standard \noperating procedures \n3.4  Contribute to the \ndevelopment of team \nwork plans based on an \nunderstanding of  team’s \nrole and objectives and \nindividual competencies \nof the members\n3.1 Communication \nprocess \n3.2 Group planning \nand decision \nmaking \n3.3 Team goals and \nobjectives \n3.4 Understanding \nindividual \ncompetencies \nrelative to \nteamwork \n3.5 Types of \nindividuals \n3.6 Role of leaders \n3.1 Interacting \neffectively with \nothers \n3.2  Setting team \ngoals and \nexpectations\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08 \n \n________________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014       \n8\n \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Role and objective \nof team  \n1.1. \nWork  activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a \nteam environment \n \n2. Sources of \ninformation \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s specifications \nand instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \n3.1. \nWork procedures and practices \n3.2. \nConditions of  work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08 \n \n______________________________________________________________________________ \nTR-ICT (CONTACT CENTER SERVICES NC II)                                Amended - October 1, 2014          9\nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nOperated in a team to complete workplace activity \n1.2. \nWorked effectively with others \n1.3. \nConveyed information in written or oral form \n1.4. \nSelected and used appropriate workplace language \n1.5. \nFollowed designated work plan for the job \n1.6. \nReported outcomes  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. \nAccess to relevant \nworkplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2.     Materials relevant to the proposed activity or tasks \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation   of the individual member in relation to \nthe work activities of the group \n3.2. \nObservation of simulation and or role play involving \nthe \nparticipation \nof \nindividual \nmember \nto \nthe \nattainment of organizational goal \n3.3.    Case studies and scenarios as a basis for discussion \nof    issues and strategies in teamwork \n4. Context for \nAssessment \n4.1. \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n4.2. \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
