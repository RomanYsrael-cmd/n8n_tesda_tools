.3 Apply the rules of basic\ncommunication in\ncustomer service\neffectively\n1.4 Apply the rules of\neffective business\ncommunication in\ncustomer service\n\n• Lecture\n• Group discussion\nand dialogs\n• Listening to audio\nand/or viewing\nvideo recordings\n• Homework and\nassigned readings\n• (Activity) Roleplay\n• In-house/\nEnterprise-based\ntraining by contact\ncenters or in\npartnership with\ncontact centers\n\n• Trainer\nassessment of\ngroup\ndiscussions\nand dialogs\n• Random\ndemonstration\ns by students\n• Buddy\nAssessment\n• Online\nAssessment\n• Scorecard\n• Demonstration\nvia a simulated\ncall flow\n2. Perform\ncustomer\nservice\ndelivery\nprocesses\n2.1 Demonstrate an\nunderstanding and\nappreciation of the\nindustry work\nenvironment for contact\ncenters, industry\nexpectations for entry-\nlevel contact center\nagent work, and career\nopportunities for\ncontact center agents\n2.2 Identify and describe\nthe rules and principles\nfor good/complete\ncustomer service and\nthe types of contact\ncenter processes\n2.3 Complete the tasks in\nthe conduct of a\ncustomer service\ndelivery process by\napplying skills in\neffective English\ncommunication\n• Lecture\n• Group discussion\nand dialogs\n• Listening to audio\nand/or viewing\nvideo recordings\n• Homework and\nassigned readings\n• (Activity) Role\nplay\n• In-house/\nEnterprise-based\ntraining by contact\ncenters or in\npartnership with\ncontact centers\n\n• Trainer\nassessment of\ngroup\ndiscussions\nand dialogs\n• Random\ndemonstration\ns by students\n• Buddy\nAssessment\n• Online\nAssessment\n• Demonstration\nvia a simulated\ncall flow\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________\nTR-ICT (CONTACT CENTER SERVICES NC II) Amended - October 1, 2014\n40\n3. Demonstrate\nability to\nengage\ncustomers\n3.1 Apply the rules and\nguidelines for building\neffective interpersonal\nrelationships to engage\ncustomers\n• Lecture\n• Group discussion\nand dialogs\n• Listening to audio\nand/or viewing\nvideo recordings\n• Homework and\nassigned readings\n• Call simulation\n• In-house/\nEnterprise-based\ntraining by contact\ncenters or in\npartnership with\ncontact centers\n• Trainer\nassessment of\ngroup\ndiscussions\nand dialogs\n• Random\ndemonstration\ns by students\n• Demonstration\nvia a simulated\ncall flow\n\n3.2.\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n--- PDF PAGE 44 ---\n______________________________________________________________________________\nTR-ICT (CONTACT CENTER SERVICES NC II) Amended - October 1, 2014 41\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as laboratory or\nfield-work components.\n\n2.2.\nEnterprise-Based:\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n3.3.\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n• Must have completed at least 10 yrs. basic education or an ALS\ncertificate of achievement with grade 10 equivalent holder\n• Can communicate in English either oral or written\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4.\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nCONTACT CENTER SERVICES NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nContact Center Services NC II -\n\nQUANTITY\nEQUIPMENT\n25 sets\nComputer with peripherals (for use in audio and video playback of\nreference and sample recordings)\n25 sets\nComputer tables and chairs (ergonomic)\n1 unit\nLCD projector\n1 unit\nWhite board\n1 facility\nESL laboratory (optional)\n1 subscription\nInternet access\n25 sets\nSoftware for office productivity\n25 sets\nInternet browser (Google Chrome, Safari, Firefox, etc. except\nInternet Explorer) updated to the latest version\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________\nTR-ICT (CONTACT CENTER SERVICES NC II) Amended - October 1, 2014\n42\n\nQUANTITY\nMATERIALS\n25 sets\nMacromedia Flash browser plug-in and application, updated to the\nlatest version\n 1 set\nVideo and audio recordings (sample speech reference recordings)\n1 set\nVideo and audio recordings (sample contact center recordings)\n\n3.5.\nTRAINING FACILITIES\n\nThe Contact Center Workshop must be of concrete structure. Based on class size of\n25 student/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nTEACHING /\nLEARNING AREAS\nSIZE\n(in METER)\nAREA\n(in Sq. Meters)\nTOTAL AREA\n(in Sq. Meters)\nlecture area\n4 x 5\n20\n20\nwash room\n2 x 5\n10\n10\nlaboratory (cubicle)\n1.5 x 2 (5)\n15\n15\nlearning resource /\nstorage\n4 x 5\n20\n20\ncirculation area\n20\n20\nTotal Workshop Area:\n85\n\n3.6.\nTRAINERS QUALIFICATION\n\nCONTACT CENTER SERVICES NC II\n\n• Must have completed Trainer’s Methodology level I (TM I) course\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 18 months contact center experience\n• *Must qualify in the following:\no AB/BS degree holder\no 12 months experience in training – or as a trainer\n\n*Optional. Only when required by the hiring institution.\n\n3.7.\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 46 ---\n______________________________________________________________________________\nTR-ICT (CONTACT CENTER SERVICES NC II) Amended - October 1, 2014 43"
