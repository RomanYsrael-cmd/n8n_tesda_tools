  "source_text": "SECTION 1. CONTACT CENTER SERVICES NC II QUALIFICATIONS\n\nThe CONTACT\nCENTER\nSERVICES\nNC\nII\nQualification\nconsists\nof\ncompetencies that a person must achieve to interact with customers to provide\ninformation about products and services. It also covers handling of customer’s\ncomplaints, inbound customer service, order taking and inquiry response handling, and\noutbound telemarketing.\n\n`This Qualification is packaged from the competency map of the Information and\nCommunication Technology Industry (Service sector) as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCode\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nCode\nCOMMON COMPETENCIES\nICT315202\nApply quality standards\nICT311203\nPerform computer operations\n\nCode\nCORE COMPETENCIES\nICT313365\nCommunicate effectively in English for customer service\nICT313366\nPerform customer service delivery processes\nICT313367\nDemonstrate ability to effectively engage customers\n\nA person who has achieved this Qualification is competent to be:\n\n•\nInbound/Outbound Contact Center Service Agent, including entry-level\npositions for:\n•\nInbound\n•\nSales\n•\nCustomer Service\n•\nTechnical Support\n•\nIT Helpdesk\n•\nOutbound\n•\nSales\n•\nSurvey\n•\nCollection\n\n--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08\n\n________________________________________________________________________________\nTR-ICT (CONTACT CENTER SERVICES NC II) Amended - October 1, 2014\n2"
}
