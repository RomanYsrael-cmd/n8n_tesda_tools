  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Construction Lift Passenger/\nMaterial Elevator Operation NC II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Construction Lift Passenger/ Material Level: NC II\n Elevator Operation\n\nNominal Training Duration: 18 Hours (Basic)\n\n18 Hours (Common)\n24 Hours (Core)\n80 Hours (OJT)\n140 Hours\n\nCourse Description:\nThis course is designed to develop knowledge, skills and desirable work\nattitude along construction lift passenger/ material elevator operation. It covers\nthe basic, common and core competencies.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n• Interaction\n\n•\nDemonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n•\nDiscussion\n• Interaction\n\n•\nDemonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\n•\nDiscussion\n• Interaction\n\n•\nDemonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n• Plant tour\n• Symposium\n•\nObservation\n• Interview\n\n--- PDF PAGE 35 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n33\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials\nand tools\n1.2 Requisition\nequipment,\nmaterials and tools\n1.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n2.1 Identify and access\nspecification/\nmanuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanual\n2.4 Store manuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n3. Perform\nmensuration\nand\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain tools\nand equipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Store tools and\nequipment\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation of\napplication of\ntasks\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Analyze signs,\n symbols and data\n5.2 Interpret technical\n drawings and plans\n5.3 Apply freehand\n sketching\nLecture\nDemonstration\nPractical exercises\nDemonstration and\noral questioning\nWritten test\n\n--- PDF PAGE 36 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n34\nCORE COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Operate\nConstruction\nLift\nPassenger/\nMaterial\nElevator\n1.1 Perform before operation\nactivities\n1.2 Transport passenger and\nmaterials\n1.3 Enforce safety standards\n1.4 Perform after operation\nactivities\n• Discussion\n• Self paced\ninstruction\n• Demonstration\n• Practical\nexercises\n• Observation/\ndemonstration\n• Written/oral\nquestioning\n\n--- PDF PAGE 37 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n35\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET:\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and\nthe curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nTraining program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are registered with the UTPRAS.\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 38 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n36\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience.\nOther requirements like health and physical requirements may also be stated.\nPassing written entrance examinations may also be indicated if necessary.\n\n• At least high school graduate or vocational school graduate\n• Can communicate both orally and written\n• Physically fit and mentally healthy\n• With good moral character\n• Can perform basic mathematical computation and mensuration\n• Legal age with NSO Birth Certificate\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n\nBased on the size of class of 25 students / trainees.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25 pcs.\nFull body harness\n1 unit\nConstruction lift\npassenger/ material\nelevator\n4 ltr.\nMulti-purpose\ngrease\n1 pc.\nGrease gun\n\n12\ncans\nPenetrating oil\n1 pc.\nOiler\n4 ltr.\nGear oil\n1 pc.\neach\nAdjustable wrench\n(6”, 10”, 12”,24”)\n\n4 ltr.\nHydraulic oil\n1 set\nBox and open-end\nwrench\n\n1 kg.\nCotton rags\n1 set\nAllen wrench\n\n1\ngallon\nCleaning solvent\n1 set\nSocket wrench\n1 unit\nFire extinguisher\n2 pcs\nPipe wrench 12”\n25 pcs.\nGoggles\n1 set\nSafety pliers and\ncutter\n\n25 pcs.\nGloves\n1 set\nScrew driver\n25 pcs.\nDust mask\n12 pcs.\nPutty knife\n25 pcs.\nHard hat\n5 pcs.\nBallpeen hammer\n(8 oz.)\n\n5 pcs.\nRubber Mallet\n( ½ kg.)\n\nTRAINING MATERIALS\n1 pc.\nCrow bar\n\nElevator operation and\nmaintenance manual\nInspection checklist\n\nLearning materials/ reference\nbooks\n\n--- PDF PAGE 39 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n37\n3.5 TRAINING FACILITIES\n\nThe training facility is based on the size of class of 25 students / trainees.\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nStudent/Trainee Working\nSpace\n\n30 sq m.\n30\nLecture Room\n\n40\n40\nLearning Resource\nCenter\n\n20\n20\nTool Room/Storage\n20\n20\nWash room/ CR\n10\n10\nTOTAL AREA\n120\n\n3.6 TRAINER’S QUALIFICATION FOR CONSTRUCTION LIFT PASSENGER/\nMATERIAL ELEVATOR OPERATION NC II\n\n• Must be a holder of National TVET Trainers Certificate level I\n(NC + TM)\n• At least bachelor’s degree or college level\n• Must be physically and mentally fit\n• Holder of Construction Occupational Safety and Health (COSH)\nCertificate\n• Good moral character\n\nReference: TESDA Board Resolution No. 2004-03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 40 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n38"
