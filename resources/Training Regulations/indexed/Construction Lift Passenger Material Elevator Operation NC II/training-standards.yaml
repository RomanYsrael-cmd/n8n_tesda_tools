      "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: Construction Lift Passenger/ Material Level: NC II\n Elevator Operation\n\nNominal Training Duration: 18 Hours (Basic)\n\n18 Hours (Common)\n24 Hours (Core)\n80 Hours (OJT)\n140 Hours\n\nCourse Description:\nThis course is designed to develop knowledge, skills and desirable work\nattitude along construction lift passenger/ material elevator operation. It covers\nthe basic, common and core competencies.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n• Interaction\n\n•\nDemonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n•\nDiscussion\n• Interaction\n\n•\nDemonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\n•\nDiscussion\n• Interaction\n\n•\nDemonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n• Plant tour\n• Symposium\n•\nObservation\n• Interview\n\n--- PDF PAGE 35 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n33\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials\nand tools\n1.2 Requisition\nequipment,\nmaterials and tools\n1.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n2.1 Identify and access\nspecification/\nmanuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanual\n2.4 Store manuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n3. Perform\nmensuration\nand\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain tools\nand equipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Store tools and\nequipment\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation of\napplication of\ntasks\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Analyze signs,\n symbols and data\n5.2 Interpret technical\n drawings and plans\n5.3 Apply freehand\n sketching\nLecture\nDemonstration\nPractical exercises\nDemonstration and\noral questioning\nWritten test\n\n--- PDF PAGE 36 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n34\nCORE COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Operate\nConstruction\nLift\nPassenger/\nMaterial\nElevator\n1.1 Perform before operation\nactivities\n1.2 Transport passenger and\nmaterials\n1.3 Enforce safety standards\n1.4 Perform after operatio