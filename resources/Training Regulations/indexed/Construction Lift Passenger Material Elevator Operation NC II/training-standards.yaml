em\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 38 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n36\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience.\nOther requirements like health and physical requirements may also be stated.\nPassing written entrance examinations may also be indicated if necessary.\n\n• At least high school graduate or vocational school graduate\n• Can communicate both orally and written\n• Physically fit and mentally healthy\n• With good moral character\n• Can perform basic mathematical computation and mensuration\n• Legal age with NSO Birth Certificate\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n\nBased on the size of class of 25 students / trainees.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25 pcs.\nFull body harness\n1 unit\nConstruction lift\npassenger/ material\nelevator