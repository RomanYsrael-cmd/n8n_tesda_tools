CRIPTOR : This unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance and\nstoring of tools and equipment based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Check condition of tools and\nequipment\n\n1.1 Materials, tools and equipment are identified\naccording to classification and job requirements\n1.2 Non-functional tools and equipment are\nsegregated and labeled according to\nclassification\n1.3 Safety of tools and equipment are observed in\naccordance with manufacturer's instructions\n1.4 Condition of PPE are checked in accordance\n with manufacturer's instructions\n2. Perform basic preventive\nmaintenance\n2.1 Appropriate lubricants are identified according to\n types of equipment\n2.2 Tools and equipment are lubricated according to\npreventive\nmaintenance\nschedule\nor\nmanufacturer's specifications\n2.3 Measuring instruments are checked and\n calibrated in accordance with manufacturer’s\n instructions\n2.4 Tools are cleaned and lubricated according to\nstandard procedures\n2.5 Defective instruments, equipment and\n accessories are inspected and replaced\n according to manufacturer’s specifications\n2.6 Tools are inspected, repaired and replaced after\nuse\n2.7 Work place is cleaned and kept in safe state in\n line with OHSA regulations\n3. Store tools and equipment\n\n3.1 Inventory of tools, instruments and equipment\nare conducted and recorded as per company\npractices\n3.2 Tools and equipment are stored safely in\n appropriate locations in accordance with\n manufacturer's specifications or company\n procedures\n\n--- PDF PAGE 28 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n26\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw, rip saw\nBoring tools - auger, brace, grinlet, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n\n2.2 Measuring instruments/equipment\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n4. Forms\n4.1 Maintenance schedule forms\n4.2 Requisition slip\n4.3 Inventory Form\n4.4 Inspection Form\n4.5 Procedures\n\n--- PDF PAGE 29 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n27\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OHSA regulations\n1.8 Stored tools and equipment safely in appropriate locations and\nin accordance with company practices\n2. Required\nknowledge and\nAttitude\n\n2.1 SAFETY PRACTICES\n 2.1.1 Use of PPE\n2.1.2 Handling of tools and equipment\n2.1.3 Good housekeeping\n2.2 MATERIALS, TOOLS AND EQUIPMENT\n2.2.1 Types and uses of lubricants\n2.2.2 Types and uses of cleaning materials\n2.2.3 Types and uses of measuring instruments and\nequipment\n2.3 PREVENTIVE MAINTENANCE\n2.3.1 Methods and techniques\n2.3.2 Procedures\n\n3. Required skills\n3.1 Preparing maintenance materials, tools and equipment\n3.2 Proper handling of tools and equipment\n3.3 Performing preventive maintenance\n3.4 Following instructions\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Maintenance schedule\n4.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation/Demonstration\n5.2 Written test/questioning relevant to underpinning knowledge\n6. Context of\nassessment\n6.1 Competency assessment may occur in the workplace or any\nappropriate simulated environment\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 30 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n28\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nOPERATE CONSTRUCTION LIFT\nPASSENGER/MATERIAL ELEVATOR\nUNIT CODE:\nCON833301\nUNIT DESCRIPTOR:\nThis unit covers the outcomes required in the\noperation of construction lift passenger/ material\nelevator in construction job sites. It includes pre-\noperation,\nproductive,\npost-operation,\nbasic\nmaintenance and enforcement of safety standards\nfor lifts/ elevators.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Perform before operation\nactivities\n\n1.1 Visual Inspection is performed using\nequipment checklist.\n1.2 Operation check is performed using\nequipment checklist.\n1.3 Elevator path is ensured to be free from\nobstructions and potential hazards.\n1.4 Findings are recorded and reported to\nequipment supervisor for appropriate action.\n1.5 Lubricants are applied to mechanical parts\nfollowing manufacturer’s recommendation.\n1.6 Report is prepared in accordance with\nmanufacturer/company procedure.\n2. Transport passenger and\nmaterials\n\n1.1. Elevator operation is monitored and\nabnormalities are acted upon in accordance\nwith company procedures.\n1.2. Ability to navigate cage to required landing\nplatform is demonstrated in accordance with\nsafety requirements.\n1.3. Daily equipment time record is accomplished\nin line with company policies and procedure.\n1.4. Communication with passengers and jobsite\npersonnel is made to observe/ enforce\nsafety procedures and safe rated capacity for\nthe lift/ elevator equipment.\n\n--- PDF PAGE 31 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n29\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n3. Enforce safety standards\n\n3.1 Load is determined/ controlled based on\nrated lift capacity.\n3.2 Procedures for emergency breakdowns are\nimplemented in accordance with\nmanufacturer’s instruction and\nrecommendations and equipment\nmanufacturer’s recommendations.\n3.3 Unexpected situations are responded to in\nline with company safety rules and\nregulations.\n3.4 OSH orientation, toolbox meetings and\nspecialized instructions are participated in\naccordance with organization guidelines and\nprocedures\n3.5 PPE is worn in compliance with OHS\nrequirements\n4. Perform after-operation\nactivities\n\n4.1. Construction lift is shut off using the correct\nsequence of procedures in accordance with\nmanufacturer’s instructions and company’s\nsafety procedures.\n4.2. Routine post-operational equipment checks\nare carried out in accordance with the\nchecklist provided for the construction lift.\n4.3. The relevant motion locks and brakes are\napplied.\n4.4. Equipment and components are checked for\nany signs of wear or damage and reported to\nan equipment supervisor for corrective action\nand/or replacement.\n4.5. The construction lift is stowed/ positioned\nand secured in accordance with\nmanufacturer’s instructions and company’s\nsafety procedures.\n\n--- PDF PAGE 32 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n30\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Visual\nInspection\n1.1.\nRollers and gears\n1.2.\nGround enclosure and cage(s)\n1.3.\nWire rope and counter weights\n1.4.\nBuffer spring and foundation frame\n1.5.\nLubricant leaks\n1.6.\nSafety Signs\n1.7.\nLoad Capacity\n1.8.\nNumber of Passengers\n1.9.\nWeight of Materials\n1.10. Oil Level\n1.11. Hoist Way\n1.12. Electrical Wirings\n2. Operation check\n2.1.\nSafety limit devices\n2.2.\nMast(s) and rack(s)\n2.3.\nMast tie-in(s)\n2.4.\nBrake system\n2.5.\nPower supply cable and cable guide\n2.6.\nCable Trolley/Guide Rail\n2.7.\nControl Panel\n2.8.\nEntrance/Exit Door\n3. Mechanical\nparts\nMay include but not limited to:\n3.1.\nRack and pinion\n3.2.\nSliding doors\n3.3.\nGuide rollers\n3.4.\nWire ropes/Counterweights/Pulleys\n3.5.\nGear box\n4. Abnormalities\n4.1.\nUnusual sounds, vibration and smell\n4.2.\nErratic movement\n4.3.\nLanding Levels\n4.4.\nActivation of safety indicators\n4.5.\nSudden stoppage\n4.6.\nControl Malfunctions\n5. Jobsite\npersonnel\n5.1.\nPassengers\n5.2.\nWorkers\n5.3.\nSupervisors\n5.4.\nRigger\n5.5.\nOther equipment operators\n6. Unexpected\nSituations\nMay include but are not limited to:\n6.1.\nOil leakages\n6.2.\nFraying of power supply cables\n6.3.\nLoss of power supply\n6.4.\nFailure of hoist brake\n6.5.\nStructural failure of the masts and cages\n6.6.\nFoundation failure\n6.7.\nForce majeure e.g., earthquake, fire, tornado, typhoon\n6.8.\nSudden sickness/unstable health condition of operator\n6.9.\nUncontrollable personnel\n6.10. Free-fall of Cage\n6.11. Mast Tie-in Failure\n7. Shutoff activities\n7.1.\nSetting of cage to stowed position\n7.2.\nPower shut-off\n7.3.\nClosing of doors\n7.4.\nTurn-over of Daily Equipment Time Record (DETR)\n\n--- PDF PAGE 33 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n31\nEVIDENCE GUIDE\n1. Critical Aspects\nof Evidence to\nbe Considered\n\nAssessment requires evidence that the candidate:\n1.1.\nPerformed before operation activities\n1.2.\nTransported passenger and materials\n1.3.\nEnforced safety standards\n1.4.\nPerformed after operation activities\n\n2. Required\nknowledge and\nattitude\n\n2.1.\nQuality procedures, e.g., 5S\n2.2.\nEnvironmental-conservation procedures,\ne.g. 3R (reduce, reuse, recycle)\n2.3.\nBasic electricity\n2.4.\nConstruction lift systems and operation\n2.5.\nCage lifting capacity\n2.6.\nKnowledge in construction lifting equipment\nparts/components and their function\n2.7.\nSafety practices in construction lift operation\n2.8.\nLift operation and controls\n2.9.\nElevator load limits/rated capacities\n2.10. Company safety procedures and standards\n2.11. Equipment abnormalities\n2.12. Emergency breakdown procedures\n2.13. Personal Protective Equipment (PPE)\n2.14. DOLE DO 13 Guidelines governing occupational safety\nand health in the construction industry.\n2.15. Literacy\n2.16. Safety conscious\n3. Required Skills\n\n3.1.\nAccomplishing inspection checklist\n3.2.\nInterpreting safety signs and charts\n3.3.\nOperating lift controls\n3.4.\nLoad estimation\n3.5.\nCommunication skills\n3.6.\nAccomplishing daily equipment time record/report\n(DETR)\n3.7.\nReporting lifting equipment abnormalities\n3.8.\nPerforming actual/proper operation\n3.9.\nPerforming safety procedures and practices\n3.10. Reading and interpreting load chart\n3.11. Basic Troubleshooting\n\n4. Resource\nImplications\n\nThings necessary for the conduct of assessment\n4.1.\nSample equipment checklist\n4.2.\nAccess to elevator /lift equipment and manuals.\n4.3.\nPPE\n5. Method of\nAssessment\n\nCompetency may be assessed through\n5.1.\nWritten/oral questioning\n5.2.\nDirect observation / practical demonstration\n5.3.\nPortfolio\n\n6. Context for\nAssessment\nAssessment can be conducted in the actual workplace\n\n--- PDF PAGE 34 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n32"
