  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1. To attain the National Qualification of Construction Lift Passenger/\nMaterial Elevator Operation NC II, the candidate must demonstrate\ncompetence through project-type assessment covering all the units listed\nin Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2. Assessment shall focus on the core unit of competency, operate\nconstruction lift passenger/ material elevator. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.3. The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs.\n\n4.3.2 Experienced Workers (wage employed or self-employed)\n\n4.4. The guidelines on assessment and certification are discussed in detail in\nthe Procedures Manual on Assessment and Certification and the\nGuidelines on the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 41 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n39\n\n--- PDF PAGE 42 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n40\nDEFINITION OF TERMS\n\n1. Competency\nIs the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace.\n2. Certification\nRefers to the process of verifying and validating competencies of\na person through assessment.\n3. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person who\nworks in a particular area of work is able to perform.\n4. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills, resource implications, context of assessment and\nassessment method.\n5. Girder\nRefers to a large beam made of metal or concrete\n6. Philippine TVET\n Qualification\n Framework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter\nfor the integration of learning and assessment in the middle skills\ndevelopment.\n7. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person\nhas achieved competencies relevant to a trade or industry.\n8. Range of\n Variable\nIt describes the circumstances or context in which the work is to\nbe performed.\n9. Slabs\nRefers to a part of a reinforced concrete floor, roof or platform\nwhich spans beams, columns, walls or piers\n10. Unit of\n Competency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n11. Visual\ninspection\nRefers to the inspection performed using sight.\n\n12. Operation\ncheck\nRefers to the checking performed prior to elevator operation.\n\n13. Abnormalities\nRefers to the irregularities experienced during the operation of\nthe elevator.\n14. Lubricants\nA substance, such as grease or oil, that reduces friction when\napplied as a surface coating to moving parts.\n15. Elevator\nA platform or an enclosure raised and lowered in a vertical shaft\nto transport people or freight.\n16. Stowed\nThe state of being stored or parked.\n17. Load lift\ncapacity\nRefers to the allowable weight limit to be transported by the lift.\n\n--- PDF PAGE 43 ---\n`\nCONSTRUCTION LIFT PASSENGER/ MATERIAL ELEVATOR OPERATION NC II\n41\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who contributed their time and expertise to the development of these Training Regulations.\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nENGR. FLORELLO P. QUIANZON\nDirector/ Chairman, Committee on Manpower Development & Certification\nACEL\n\nFRUMENCIO T. TAN\nSafety Consultant/ Natl. Secretary\nSafety Organization of the Philippines,Inc\nARLES A. JANABAN\nSafety Manager\nDatem, Inc.\nCORNELIO D. PADUA\nAssociate Manager\nMakati Development Corporation\nROEL E. BATACAN\nEquipment Supervisor\nMegawide Construction Company\nMAGDALENO O URRIZA\nElectrical Engineer\nD. M. Consunji, Inc.\nMARCELO M. RAMOS, JR.\nAsst. Vice President for training dept.\nManitowoc Crane Group, Inc.\nNOE A. DUMALAG\nEquipment Consultant\nD. M. Consunji, Inc.\n\nDR. PETER M. URETA\nCHED Technical Expert Panel\n\n•\nThe PARTICIPANTS in the Validation of these Training Regulations\n\nNOEL G. CHAVEZ\nSafety Manager\nOTIS Eand M. Company Phils., Inc.\nRAFAELITO S. CHING\nPresident\nPacific Orient Winds Corporation\nMARCELINO M. DE LARA\nElectrical Supervisor\nEEI Corporation\nJOSE V. NELLASCA\nService Manager\nManitowoc Crane Group, Inc.\nRESTITUTO P. RODELAS\nSales/ Design Department\nDEX International Company\nBERNARDO A. SAN MIGUEL\nService Manager\nPower Plus Equipment Manufacturing Corp.\nDARWIN R. TALATTAD\nMachine Application Engineer\nMegawide Construction Corp.\nBERNARDO M. VERGARA\nSales/ Equipment Consultant\nHyundai Good Morning International Corp.\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQualification and Standards Office (QSO)\n\n•\nThe Management and Staff of the Association of Carriers & Equipment Lessors Inc.\n(ACEL)\n\n•\nThese Training Regulations were reviewed by the Occupational Safety\n and Health Center"
