  "source_text": "Acclimation\nrefers to adjusting the prevailing water condition of fish in an\nenvironment from lower to higher temperature to optimal\ntemperature, from tower or higher salinity to optimal salinity\n(like from freshwater to salt water environment), etc.\n\nAverage Body Weight\n\nis the total weight of fish over the number of fish\nAD-Libitum\nrefers to the mode of providing unlimited fish feeds to fish\n\nAFMA\nAgriculture and Fisheries Modernization Act\n\nBFAR\nBureau of Fisheries and Aquatic Resources\n\nBOD\nBiological Oxygen Demand\n\nBrackish Water\nrefers to the mixture of freshwater and sea water naturally\noccurring in estuaries.\n\nBreeder\nSexually mature fish that are used for breeding\n\nConditioning of\nBreeders\na method wherein the breeders are pampered by providing\nthem nutritious feeds and optimum water conditions to effect\nthe maturity of the fish\n\nD.O.\n(Dissolved Oxygen)\nrefers to a quantity of oxygen dissolved with water in the\nprocess of photosynthesis and the action of air current. The\nunit of the D.O. is commonly expressed in part per million\n(ppm).\n\nFCR\n\nFood Conversion Ratio is the Total amount of Feeds\nconsumed over the Net Weight of Fish.\n\nEgg Fertilization\nthe process of mixing the fish eggs with fish milt either by\nnatural or artificial method.\n\nFilamentous algae\ngreen or blue-green algae that grows in strands\n\nFish Nursery\nrefers to smaller unit areas of confinement wherein small\nfish larvae or fish fry are reared. It may either be in ponds,\ncages, tanks, etc\n\nFish Pond\nan aquaculture facility with an earthen bottom surrounded\nby dikes, with water inlets and drain outlets.\n\nFish Cage\nan aquaculture facility made of frames, net enclosures,\nmooring rope, anchors or poles installed in open waters like\nlakes, dams, rivers and sea-water coves, lagoons,\nimpoundments etc.\n\n--- PDF PAGE 119 ---\nTR - Aquaculture (Tilapia Culture) NCII Revision 00 Promulgated (06/09//2020) 119\n\nFish Pen\naquaculture facility in inland areas such as lakes, rivers,\ndams\n\nFry\nearly stage of fish which is not yet fully pigmented and with\nscales that are not yet fully formed\n\nGrow out\nrefers to bigger unit areas of confinement where fingerlings\nare stocked and grown to marketable size. It may either be\nin ponds, cages and fish pens.\n\nHapa Net\nan enclosure made of fine mesh net for fry\n\nHatchery Operation\nrefers to a large production of larvae/fry\n\nHormones\nare substances, (synthetically or naturally produced) used\nto hasten growth, induce ovulation or to effect sex reversal\nin fish.\n\nIncubator\n\nare hatching facilities where fertilized eggs are hatched.\nLiming\napplication of lime in ponds to elevate soil pH of acidic\nponds\nMature Breeders\nfishes that are gravid (female) or with milt (male)\n\nOHS\nOperating Health Standard for workers\n\nOptimum\nrefers to the best environmental and physiological condition\nprovided to the fish to effect maximum production\n\nPathogenic Bacteria\ndisease causing bacteria\n\npH Meter\ninstrument\nused\nto\nmeasure\nthe\nhydrogen\nions\nconcentration of soil or water\n\nPhytoplankton\nunicellular microscopic algae suspended in water\n\nSatiation feeding\nrefers to the feeding method wherein the fish is fed until the\ngut is full as indicated by slowing down of the feeding frenzy.\n\nSea-Water\nrefers to waters with at east 32 ppt salinity\n\nSeine Net\na type of fishing gear made up of nets, ropes, floats and\nsinkers used to harvest fish by crowding.\n\nSpawner\nmature female fish used for breeding.\n\nSpawning\npropagation method through environment and nutritional\nmanipulation to hasten and optimize the maturity of the\neggs and trigger spawning\n\n--- PDF PAGE 120 ---\nTR - Aquaculture (Tilapia Culture) NCII Revision 00 Promulgated (06/09//2020) 120\n\nStress\na response to negative environmental condition caused by\nbiological, physical or chemical factors affecting the health,\ngrowth and well-being of