ed and non extruded\n• Procedures in feed and water\nquality management\n• Computaion of sex\nratio/stocking per unit area\n• GAqP\n• OSHS\n• Waste management\n1.2 Select and condition broodstock\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n320\nhours\n\n2. Produce fry\n2.1 Explain the following:\n• Procedure in egg incubation\n• Egg development stages\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Written\nexamination\n• Demonstration\n\n--- PDF PAGE 97 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 96\n\n• Procedure in fry collection and\ngrading\n• Use of fungicide\n• Recommended\n• Standard grading size\n• GAqP\n• OSHS\n• Waste management\n2.2 Produce fry\n• Power point\npresentation\n\n• Oral\nquestioning\n\n3. Prepare hormone treated feed\nfor sex reversal\n3.1 Discuss the following:\n• Hormone dosage required\n• Optimum volume of alcohol as\nsolvent and as medium for\ndispersing hormone\n• Substitute chemicals\n• Rate of inclusion\n• Pond vs. tank\n• Rate per unit\n• Alcohol and hormone\n• Feed treatment\n• Packing, labelling and storage\nof treated feeds\n• Withdrawal period\n• Waste water treatment\n• GAqP\n• OSHS\n3.2 Prepare hormone treated feed for\nsex reversal\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n\n4.Perform nursery operation\n4.1 Explain the following:\n• Lecture-\ndiscussion\n• Demonstration\n• Written\nexamination\n• Demonstration\n\n--- PDF PAGE 98 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 97\n\n• Proper stocking density based\non ecosystem and culture\nintensity\n• Proper feeding schedule based\non fry size and market\nrequirements\n• Proper handling and grading of\nfry based on standard sizes\n• Identification of diseases and\nsymptoms based on visual\nexamination and fish behavior\n• Culling\n• GAqP\n• OSHS\n4.2 Perform nursery operation\n• Film viewing\n• Power point\npresentation\n\n• Oral\nquestioning\n\n5. Carry-out dispersal of\nfingerlings\n5.1 Discuss the following:\n• Loading density/ size/distance\n• Prophylactic agent\n• Biological requirements of\nfingerlings\n• Measures to reduce stress and\nmetabolic rate of fingerlings\nwhile in transit\n• Types of packing materials\n• Transport condition\n• Sourcing of transport\nequipment\n• Maintenance of transport\nequipment\n• Types of transport equipment\n• procedures\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n\n--- PDF PAGE 99 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 98\n\n• Rate of stocking\n• Application rate\n• GAqP\n• OSHS\n• Waste management\n5.2 Carry-out dispersal of fingerlings\n\n3. Perform tilapia\ngrow-out\n\n1. Stock fingerlings\n1.1 Discuss the following:\n• Monitoring of fingerlings’\ncondition\n• Osmoregulation\n• Carrying capacity\n• Recirculation\n• Filtration\n\n• Static or flow through\n• Total stock based on area and\nstocking density\n• Sampling procedures\n• Mortality allowance\n• Culture intensity\n• GAqP\n• OSHS\n• Waste management\n1.2 Stock fingerlings\n\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n160\nhours\n\n--- PDF PAGE 100 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 99\n\n2. Stock sampling\n2.1 Explain the following:\n• Typical Growth Curve\n• Minimum sample size required\n• Importance of random sample\n• Average body weight (ABW)\n• Record keeping\n• Using a weighing scale\n• GAqP\n• OSHS\n• Waste management\n2.2 Stock sampling\n\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n\n3. Perform feeding operations\n3.1 Discuss the following:\n• Nutrient requirements of stocks\n• Feeding ration recommended\nfeed management based on\ndifferent ecosystem and culture\nmethods\n• Daily feed ration\n• Feeding schedule\n• Feeding strategies\n• Satiation feeding\n• Ad libitum\n• Delayed feeding\n• Use of mechanical feeders\n• Basic mathematical operation\n• Systems and units of\nmeasurement\n• PNS on aquaculture feeds\n(tilapia)\n• GAqP\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n\n--- PDF PAGE 101 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 100\n\n• OSHS\n• Waste management\n3.2 Perform feeding operations\n\n4.Maintain good water quality\n4.1 Discuss the following:\n• Temperature, pH, DO,\nAmmonia relationship\n• DO Saturation rate\n• Recommended optimal range\nof water quality\n• Probiotics\n• Flow through\n• Procedure in maintaining\noptimal water quality\n• Other interventions for water\nquality maintenance\n• Fertilizing dressing\n• GAqP\n• OSHS\n• Waste management\n4.2 Maintain good water quality\n\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n\n5. Perform common disease\ndiagnosis and treatment\n5.1 Explain the following:\n• Identification/ Classification of\ndiseases\n• Procedure in preparation of\nspecimens for laboratory\ndiagnosis\n• Knowledge on the\norigin/occurrence of particular\ndisease Prophylaxis treatment\nand preventive options for a\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n\n--- PDF PAGE 102 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 101\n\nparticular disease (baths, dips,\nUV treatment)\n• GAqP\n• OSHS\n• Waste management\n5.2 Perform common disease\ndiagnosis and treatment\n\n6. Perform harvesting and\nprimary post harvesting\nactivities\n6.1 Explain the following:\n• Harvesting methods based on\ndifferent ecosystem\n• Draining\n• Seining\n• Partial lifting of net in net cages\n• Primary Post harvesting\nmethods\n• Sorting and weighing procedure\n• Procedure for icing or live\ntransport\n• Types of fish containers\n• OSHS\n• Waste management\n• GAqP\n6.2 Perform harvesting and primary\npost harvesting activities\n\n• Lecture-\ndiscussion\n• Demonstration\n• Film viewing\n• Power point\npresentation\n\n• Written\nexamination\n• Demonstration\n• Oral\nquestioning\n\n--- PDF PAGE 103 ---\nTR- Aquaculture (Tilapia Culture) NC II Revision 00 Promulgated (06/09/2020) 102\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is\ndriven by the competency standards specified by the industry. The\nfollowing training modalities and their variations/components may be\nadopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 School/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• Distance learning may employ correspondence study, audio, video,\ncomputer technologies that can be used to facilitate learning and\nformal and non-formal training. Specific guidelines on this mode shall\nbe issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work components.\n\n--- PDF PAGE 104 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 103\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based\nShort term programs conducted by non- government organizations NGOs,\nLGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be\nconducted in informal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP)\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who would like to enroll in this course should possess the\nfollowing requirements:\n\n Able to read and write\n Ability to communicate, both oral and written\n Able to perform simple computations\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 105 ---\nTR - Aquaculture (Tilapia Culture ) NCII Revision 00 Promulgated (06/09/2020) 104\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nAQUACULTURE (Tilapia Culture) NCII\n\nRecommended list of tools, equipment and materials for the training of 15\ntrainees for Aquaculture (Tilapia Culture) NC II\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used\nas alternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nA. FULL QUALIFICATION\n\nTOOLS\nQTY\nDESCRIPTION\n2 pcs\nDissolve Oxygen meters\n5 pcs\nLaboratory thermometer, 0-100 C\n10 pcs\nShovel\n10 pcs\nDigging blades\n2 sets\nElectrical tools:\n\n-plier\n\n-screw driver(+, -)\n\n-wire stripper\n2 se