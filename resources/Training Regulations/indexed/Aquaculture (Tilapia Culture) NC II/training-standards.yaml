TR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 76\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7. Practice\nOccupational\nSafety And\nHealth Policies\nAnd Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and\nProcedures\n- Personal Protective Equipment\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n7.2 Prepare OSH\nrequirements\nfor\ncompliance\n• Identification of required safety\nmaterials, tools and equipment\n• Handling of safety control\nresources\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n7.3 Perform tasks\nin accordance\nwith relevant\nOSH policies\nand\nprocedures\n• Discussion of General OSH\nStandards and Principles\n• Performing industry related\nwork activities in accordance\nwith OSH Standards\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness\nof resource\nutilization\n- Discussion on the process how\nEnvironmental Policies\ncoherence is achieved\n• Discussion on Necessary Skills\nin response to changing\nenvironmental policies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group\nDiscussion\n• Simulation\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 78 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 77\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectivenes\ns of resource\nutilization\n• Discussion of Environmental\nProtection and Resource\nEfficiency Targets\n• Analysis on the Relevant Work\nProcedure\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n8.3 Convey\ninefficient and\nineffective\nenvironmental\npractices\n• Identification of (re)training\nneeds and usage of\nenvironment friendly methods\nand technologies\n• Identification of environmental\ncorrective actions\n• Practicing Environment\nAwareness\n• Lecture\n• Group\nDiscussion\n• Role Play\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneuri\nal workplace\nbest practices\n• Determine Best entrepreneurial\npractices\n• Discussion on Quality\nprocedures and practices\n• Explain Cost consciousness in\nresource utilization\n• Interview\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 Hour\n\n9.2 Communicate\nentrepreneuri\nal workplace\nbest practices\n• Discussion on communicating\nentrepreneurial workplace best\npractices\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 Hour\n\n9.3 Implement\ncost-effective\noperations\n• Apply the preservation,\noptimization and judicious use\nof workplace resources\n• Interview\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n2 Hours\n\n--- PDF PAGE 79 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 78\n\nCOMMON COMPETENCIES\n72 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Apply safety\nmeasures in farm\noperations\n1.1 Determine\nareas of\nconcern for\nsafety\nmeasures\n• Identify work tasks in farm\noperations\n• Lecture\n• Discussion\n• Incomplete\nworksheet\n• Power point\npresentation\n• Video\np