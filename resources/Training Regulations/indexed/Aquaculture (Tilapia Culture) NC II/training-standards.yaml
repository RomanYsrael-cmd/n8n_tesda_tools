      "source_text": "3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nAQUACULTURE (Tilapia Culture) NCII\n\nRecommended list of tools, equipment and materials for the training of 15\ntrainees for Aquaculture (Tilapia Culture) NC II\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used\nas alternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nA. FULL QUALIFICATION\n\nTOOLS\nQTY\nDESCRIPTION\n2 pcs\nDissolve Oxygen meters\n5 pcs\nLaboratory thermometer, 0-100 C\n10 pcs\nShovel\n10 pcs\nDigging blades\n2 sets\nElectrical tools:\n\n-plier\n\n-screw driver(+, -)\n\n-wire stripper\n2 sets\nMasonry tools:\n\n-leveling tool\n\n-trowel\n\n-steel saw\n2 sets\nCarpentry tools:\n\n-hammer\n\n-wood saw\n5 pcs\nCultivator / rake\n10 pcs\nPail, plastic, 20L capacity\n5 pcs\nSecchi disc\n5 pcs\npH meter\n2 pcs\nrefractometer\n5 pcs\nCalculator, ordinary\n5 pcs\nPlastic pail with cover, 50L\n5 pcs\nPlastic basin, white (batya), 50cm in diameter\n10 pcs\nCrates, plastic, 25 kg capacity\n5 pcs\nBolo\n5 sets\nBasic dissecting kit:\n\n-scalpel\n\n-forceps\n\n-scissors\n2 pcs\nFlashlights\n1 roll\nHapa net, 1mm mesh, 90m\n 3 sets\nScoop net, various mesh size(#17,#22 ,#32)\n5 pcs\nKitchen strainer, 5cm diameter\n\n--- PDF PAGE 106 ---\nTR - Aquaculture (Tilapia Culture ) NCII Revision 00 Promulgated (06/09/2020) 105\n\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nGenerator, 1hp (7,500watts)\n1unit\nMicroscope\n1 unit\nWater pump, centrifugal, 1hp\n1 unit\nWater pump, submersible, 1hp\n10 units\nIncubator, 4 L\n2 units\nFilled oxygen tank with regulator\n2 units\nWeighing scale, 20K\n2 units\nWeighing scale, 1K\n2 units\nAerators\n\nMATERIALS\nQTY\nDESCRIPTION\n15 pcs\nNotebooks\n15 pcs\nPen\n15 pcs\nFloater\n15 pairs\nRubber boots\n15 pcs\nFace mask\n15 pairs\n Hand gloves, disposable/ plastic\n15 pairs\n Hand gloves, cotton\n2 rolls\nP.E. rope, 10mm x 200m\n15 pcs\nPencil\n5 pcs\nTape measure, 5m\n1 kilo