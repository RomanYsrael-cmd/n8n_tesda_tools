ry\nmaintenance, service and\nhelpdesk practices, processes\nand procedures\n• Make use of the industry\nstandard diagnostic tools\n• Share best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n• Formulate possible solutions to\nproblems and document\nprocedures for reporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.3 Recommend\nsolutions to\nproblems\n• Discuss standard operating\nprocedures and documentation\nprocesses\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 72 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 71\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management\nstrategies that assist in\nregulating behavior and\nachieving personal and learning\ngoals\n• Explain enablers and barriers in\nachieving personal and career\ngoals\n• Identify techniques in handling\nnegative emotions and\nunpleasant situation in the\nworkplace such as frustration,\nanger, worry, anxiety, etc.\n• Manage properly one’s\nemotions and recognize\nsituations that cannot be\nchanged and accept them and\nremain professional\n• Recall instances that\ndemonstrate self- discipline,\nworking independently and\nshowing initiative to achieve\npersonal and career goals\n• Share experiences that show\nconfidence, and resilience in\nthe face of setbacks and\nfrustrations and other negative\nemotions and unpleasant\nsituations in the workplace\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 73 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 72\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to\nimprove one’s attitude in the\nworkplace\n• Explain Gibbs’ Reflective\nCycle/Model (Description,\nFeelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as\nself-assessment strategy\n• Develop reflective practice\nthrough realization of\nlimitations, likes/ dislikes;\nthrough showing of self-\nconfidence\n• Demonstrate self-acceptance\nand being able to accept\nchallenges\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n4.3 Boost self-\nconfidence\nand develop\nself-regulation\n• Describe the components of\nself-regulation based on Self-\nRegulation Theory (SRT)\n• Explain personality\ndevelopment concepts\n• Cite self-help concepts (e. g., 7\nHabits by Stephen Covey,\ntransactional analysis, psycho-\nspiritual concepts)\n• Perform effective\ncommunication skills – reading,\nwriting, conversing skills\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 74 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 73\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Show affective skills – flexibility,\nadaptability, etc.\n• Determine strengths and\nweaknesses\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities\nto do things\nbetter\n• Identify different roles of\nindividuals in contributing to\ndoing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different\ntypes of changes and levels of\nparticipation in the workplace\n• Discuss 7 habits of highly\neffective people\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n5.2 Discuss and\ndevelop ideas\nwith others\n• Identify different roles of\nindividuals in contributing to\ndoing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n1 Hour\n\n--- PDF PAGE 75 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 74\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Show mastery of the different\ntypes of changes and levels of\nparticipation in the workplace\n• Discuss 7 habits of highly\neffective people\n• Communicate ideas through\nsmall group discussions and\nmeetings\n• Group work\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.3 Integrate\nideas for\nchange in the\nworkplace\n• Identify different roles of\nindividuals in contributing to\ndoing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different\ntypes of changes and levels of\nparticipation in the workplace\n• Discuss 7 habits of highly\neffective people\n• Communicate ideas through\nsmall group discussions and\nmeetings\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n1 Hour\n\n--- PDF PAGE 76 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 75\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate basic skills in data\nanalysis\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\n- Organisational protocols\n- Confidentiality and accuracy\n- Computing for expenses and\npossible earnings\n- Legislation, policy and\nprocedures relating to the\nconduct of evaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.2 Assess\ngathered data/\ninformation\n• Lecture and discussion on:\n- Evaluation of gathered\ninformation using basic\nmathematical operation\n- Organisational values, ethics\nand codes of conduct\n- Trends and anomalies\n• Computing for expenses and\npossible earnings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\n- Reporting requirements to a\nrange of audiences\n- Recommendations for\npossible improvements\n• Comparison of interim and final\nreports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n--- PDF PAGE 77 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 76\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7. Practice\nOccupational\nSafety And\nHealth Policies\nAnd Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and\nProcedures\n- Personal Protective Equipment\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n7.2 Prepare OSH\nrequirements\nfor\ncompliance\n• Identification of required safety\nmaterials, tools and equipment\n• Handling of safety control\nresources\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n7.3 Perform tasks\nin accordance\nwith relevant\nOSH policies\nand\nprocedures\n• Discussion of General OSH\nStandards and Principles\n• Performing industry related\nwork activities in accordance\nwith OSH Standards\n• Lecture\n• Group\nDiscussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness\nof resource\nutilization\n- Discussion on the process how\nEnvironmental Policies\ncoherence is achieved\n• Discussion on Necessary Skills\nin response to changing\nenvironmental policies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group\nDiscussion\n• Simulation\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 78 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 77\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.2 Deter