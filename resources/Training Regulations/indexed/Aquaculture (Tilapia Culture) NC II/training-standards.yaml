  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for AQUACULTURE (TILAPIA\nCULTURE) NC II.\n\n3.1.\nCURRICULUM DESIGN\n\nCourse Title: AQUACULTURE (TILAPIA CULTURE)\nNC Level: NC II\n\nNominal Training Duration:\n37 Hours (Basic Competencies)\n\n72 Hours (Common Competencies)\n\n580 Hours (Core Competencies)\n\n689 Hours\n\n80 Supervised Industry Learning\n(SIL)\n\n769 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and\nattitudes of Aquaculture (Tilapia Culture) NCll in accordance with industry standards.\nIt covers core competencies in conducting pre-operational aquaculture activities,\noperating tilapia hatchery and nursery and performing tilapia grow-out.\n\nTo accomplish the above, all units prescribed for this qualification must be\nachieved.\n\n--- PDF PAGE 67 ---\nTR- Aquaculture (Tilapia Culture) NC II Revision 00 Promulgated (06/09/2020) 66\n\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n• Read:\no Effective communication\no Written communication\no Communication procedures\nand systems\n• Identify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology\nrelevant to the enterprise\nand the individual’s work\nresponsibilities\n• Prepare different Types of\nquestion\n• Gather different sources of\ninformation\n• Apply storage system in\nestablishing workplace\ninformation\n• Demonstrate Telephone\ncourtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 68 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 67\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.2 Perform duties\nfollowing\nworkplace\ninstructions\n• Read:\no Written notices and\ninstructions\no Workplace interactions and\nprocedures\n• Read instructions on work\nrelated forms/documents\n• Perform workplace duties\nscenario following workplace\nnstructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n1.3 Complete\nrelevant work\nrelated\ndocuments\n• Describe Communication\nprocedures and systems\n• Read:\no Meeting protocols\no Nature of workplace\nmeetings\no Workplace interactions\no Barriers of communication\n• Read instructions on work\nrelated forms/documents\n• Practice:\no Estimate, calculate and\nrecord routine workplace\nmeasures\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n• Demonstrate office activities\nin:\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 69 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 68\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no workplace meetings and\ndiscussions scenario\n• Perform workplace duties\nscenario following simple\nwritten notices\n• Follow simple spoken\nlanguage\n• Identify the different Non-\nverbal communication\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n• Gather and provide\ninformation in response to\nworkplace requirements\n• Complete work related\ndocuments\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and\nscope\n• Discussion on team roles and\nscope\n• Participate in the discussion:\no\nDefinition of Team\no\nDifference between team\nand group\no\nObjectives and goals of\nteam\n• Locate needed information\nfrom the different sources of\ninformation\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n--- PDF PAGE 70 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 69\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n• Role play:\no individual role and\nresponsibility\n• Role Play\no Understanding Individual\ndifferences\n• Discussion on gender\nsensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a\nteam member\n• Participate in group planning\nactivities\n• Role play: Communication\nprotocols\n• Participate in the discussion of\nstandard work procedures and\npractices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n3. Solve/address\nroutine\nproblems\n3.1 Identify\nroutine\nproblems\n• Determine current industry\nhardware and software\nproducts and services\n• Identify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes\nand procedures\n• Make use of the industry\nstandard diagnostic tools\n• Share best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 71 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 70\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Analyze routine/procedural\nproblems\n\n3.2 Look for\nsolutions to\nroutine\nproblems\n• Determine current industry\nhardware and software\nproducts and services\n• Identify correctly the 