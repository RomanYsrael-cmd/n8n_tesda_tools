itoring\ntransport\ncondition skills\n5.6 Sourcing out\ntransport\nequipment\n5.7 Employing GAqP\n5.8 Practicing OSHS\n5.9 Applying waste\nmanagement\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nHatchery scheme\nHatchery scheme may include:\n1.1 Egg incubation scheme\n1.2 Fry collection scheme\n2.\nStocking\nStocking may include:\n2.1 Stocking of fry in hapa,\n2.2 Stocking in tanks\n3.\nFeeding\nFeeding includes:\n3.1 Feeding for sex reversed tilapia\n3.2 Feeding for normal tilapia\n4.\nStandard sizes\nStandard sizes may include:\n4.1 Size #24\n4.2 Size #22\n4.3 Size #20\n4.4 Size #17\n4.5 Size #14\n5.\nAppearance and\nbehavioral patterns\nAppearance may include:\n5.1 Pale\n5.2 Dark\n5.3 Presence of parasites\n5.4 Number of mortalities\nBehavior pattern may include:\n5.5 Lethargic swimming\n5.6 Abnormal swimming orientation\n5.7 Gasping\n5.8 Non-reactive to stimulus\n\n6.\nConditioning\nConditioning includes:\n6.1 Fasting\n6.2 Prophylaxis\n7.\nPacking materials\nPacking materials may include:\n7.1 Plastic bags\n7.2 Rubber band\n\n--- PDF PAGE 60 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 56\n\n7.3 Filled Oxygen tank\n7.4 Ice\n7.5 Styropore box\n7.6 Currogated cardboard box\n8.\nIndustry practices\non packing\nIndustry practices on packing may include:\n8.1 Consideration of fingerling size\n8.2 Travel time\n8.3 Time of packing\n8.4 Mode of transport\n9.\nTransport\nequipment\nTransport equipment may include:\n9.1 Hauling tank\n9.2 Aeration facilities\n9.3 Live boat\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and conditioned broodstock\n1.2 Produced fry\n1.3 Prepared hormone treated feed for sex reversal\n1.4 Performed nursery operation\n1.5 Carried-out dispersal of fingerlings\n1.6 Practiced safety measures\n2. Resource Implications\nThe following resources MUST be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, supplies, materials and equipment needed to\nperform required tasks during hatchery and nursery\noperations of aquaculture farms.\n2.3 References and manuals\n2.4 PPE\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Written examination\n3.2 Demonstration/Direct observation with oral questioning\n3.3 Production output\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 61 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 57\n\nUNIT OF COMPETENCY :\nPERFORM TILAPIA GROW OUT\n\nUNIT CODE\n\n:\nAFF622320\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude\nrequired to stock fingerlings, stock sampling,\nperform feeding operations, maintain good water\nquality, perform common disease diagnosis and\ntreatment and perform harvesting and primary post\nharvesting activities.\n\n ELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Stock fingerlings\n1.1Condition of fingerlings\nis monitored following\nestablished industry\npractices\n1.2Counts are validated\nby sampling\n1.3 Acclimation is\nperformed prior to\nstocking\n1.4 Stocking is performed\nbased on culture\nintensity\n1.1 Monitoring of\nfingerlings’\ncondition\n1.2Osmoregulation\n1.3 Carrying capacity\n1.4 Recirculation\n1.5 Filtration\n1.6 Static or flow\nthrough\n1.7 Total stock based\non area and\nstocking density\n1.8 Sampling\nprocedures\n1.8 Mortality allowance\n1.9 Culture intensity\n1.10 GAqP\n1.11 OSHS\n1.12 Waste\nmanagement\n1.1 Monitoring\ncondition of\nfingerlings\n1.2 Validating counts\nby sampling\n1.3 Acclimating tilapia\nfingerlings\n1.4 Sampling skill\n1.5 Computation skills\n1.6 Applying stocking\nprocedures\n1.7Applying GAqP\n1.8 Practicing OSHS\n1.9 Applying waste\nmanagement\n2. Stock sampling\n2.1 Samples are collected\nfor feeding adjustment\n2.2 Samples are weighed\nto determine average\nbody weight (ABW)\n2.3 Record keeping is\ndone following\nworkplace procedures.\n2.1 Typical Growth\nCurve\n2.2 Minimum sample\nsize required\n2.3 Importance of\nrandom sample\n2.4 Average body\nweight (ABW)\n2.5 Record keeping\n2.6 Using a weighing\nscale\n2.7 GAqP\n2.8 OSHS\n2.9 Waste management\n2.1 Collecting samples\n2.2 Weighing samples\n2.3 Record keeping\n2.4 Using cast net or\nseine for sampling\n2.5 Computing ABW\n2.6 Mensuration and\ncomputation skills\n(weighing)\n2.7 Practicing GAqP\n2.8 Applying OSHS\n2.9 Practicing waste\nmanagement\n\n3.Perform feeding\noperations\n\n3.1 Daily feed ration is\ncalculated based on\nestimated biomass\n3.2 Feeding frequency is\ndetermined based on\n3.1 Nutrient\nrequirements of\nstocks\n3.2 Feeding ration\nrecommended feed\nmanagement based\n3.1 Estimating feed\nconsumption\n3.2 Computing feed\nration\n3.3 Determining feeding\nfrequency\n\n--- PDF PAGE 62 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 58\n\ngrowth stage and\nconsumption\n3.3 Feed consumption is\nmonitored following\nGAqP\n3.4 Total amount of feed\nconsumed and feed\nconversion ratio FCR\nis computed for the\nentire growing cycle\n3.5 Physical property of\nfeeds are checked\nbased on industry\nstandards\n3.6 Actual amount of\nfeeds given is\nrecorded following\nworkplace standard\nprocedures.\n\non different\necosystem and\nculture methods\n3.3 Daily feed ration\n3.4 Feeding schedule\n3.5 Feeding strategies\n3.6 Satiation feeding\n3.7 Ad libitum\n3.8 Delayed feeding\n3.9 Use of mechanical\nfeeders\n3.10 Basic\nmathematical\noperation\n3.11 Systems and units\nof measurement\n3.12 PNS on\naquaculture feeds\n(tilapia)\n3.13 GAqP\n3.14 OSHS\n3.15 Waste\nmanagement\n3.4 Monitoring feeding\nconsumption\n3.5 Monitoring feeding\nbehavior\n3.5 Mensuration and\ncomputation skills\n3.6 Applying GAqP\n3.7 Practicing OSHS\n3.8 Applying waste\nmanagement\n\n4. Maintain good\nwater quality\n4.1 Water quality\nparameters are\nmonitored following\nindustry procedures\n4.2 Optimum water quality\nis maintained by water\nexchange and other\ninterventions\n4.3 Fertilizer dressing is\napplied based on\nsecchi disc reading.\n4.1 Temperature, pH,\nDO, Ammonia\nrelationship\n4.2 DO Saturation rate\n4.3 Recommended\noptimal range of\nwater quality\n4.4 Probiotics\n4.5 Flow through\n4.6 Procedure in\nmaintaining optimal\nwater quality\n4.7 Other interventions\nfor water quality\nmaintenance\n4.8 Fertilizing dressing\n4.9 GAqP\n4.10 OSHS\n4.11Waste management\n\n4.1 Using monitoring\ninstruments such as\nsecchi disk, pH\nmeter and DO\nmeter\n4.2 Monitoring water\nquality parameters\n4.3 Maintaining\noptimum water\nquality\n4.4 Applying fertilizer\ndressing\n4.5 Mensuration skills\n4.6 Practicing GAqP\n4.7 Applying OSHS\n4.8 Practicing waste\nmanagement\n\n5. Perform common\ndisease diagnosis\nand treatment\n5.1 Visual inspection of\ndiseases are done\nbased on appearance\nand behavioral\npatterns\n5.2 Infected fish is\nsampled for laboratory\ndiagnosis as required\n5.3 Primary treatment\nand prevention is\nidentified and\n5.1 Identification/\nClassification of\ndiseases\n5.2 Procedure in\npreparation of\nspecimens for\nlaboratory diagnosis\n5.3 Knowledge on the\norigin/occurrence of\nparticular disease\n5.4 Prophylaxis\ntreatment and\n5.1 Performing visual\ninspection of\ndiseases\n5.2 Sampling infected\nfish\n5.3 Identifying and\nimplementing\nprimary treatment\nand prevention\n5.4 Disposing mortality\n5.5 Practicing safety\nmeasures\n\n--- PDF PAGE 63 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 59\n\nimplemented\naccording to GAqP\n5.4 Disposal of mortality\nis carried out following\nGAqP\n5.5 Safety practices are\napplied following\nOSHS\npreventive options\nfor a particular\ndisease (baths,\ndips, UV treatment)\n5.5 GAqP\n5.6 OSHS\n5.7 Waste management\n5.6 Applying GAqP\n5.7 Managing wastes\n\n6. Perform\nharvesting and\nprimary post\nharvesting\nactivities\n6.1 Pond is partially\nd