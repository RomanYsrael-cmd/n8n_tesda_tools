s \n2.2  Performing \nroutine \nworkplace duties \nfollowing simple \nwritten notices \n2.3  Participating in \nworkplace \nmeetings and \ndiscussions \n2.4  Completing \nwork- related \ndocuments \n2.5  Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n2.6  Relating/ \nResponding to \npeople of various \nlevels in the \nworkplace \n2.7  Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n2.8  Basic \nquestioning/ \nquerying \n2.9  Skills in reading \nfor information  \n2.10 Skills in locating \n3.  Complete relevant \nwork-related \ndocuments \n3.1  Range of forms \nrelating to \nconditions of \nemployment are \ncompleted \naccurately and \nlegibly. \n3.1  Effective verbal \nand non-verbal \ncommunication \n3.2  Different modes \nof communication \n3.3  Workplace8 forms \nand documents \n \n3.1  Completing \nwork-related \ndocuments \n3.2  Applying \noperations of \naddition, \nsubtraction,\n\n--- PDF PAGE 8 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     4 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.2  Workplace data is \nrecorded on \nstandard workplace \nforms and \ndocuments. \n3.3  Errors in recording \ninformation on \nforms/ documents \nare identified and \nacted upon. \n3.4  Reporting \nrequirements to \nsupervisor are \ncompleted \naccording to \norganizational \nguidelines. \n3.4  Organizational/ \nWorkplace \npolicies \n3.5  Communication \nprocedures and \nsystems \n3.6  Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \ndivision and \nmultiplication \n3.3  Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n3.4  Effective record \nkeeping skills\n\n--- PDF PAGE 9 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020