lf-\nassessment for \ndetermining \none’s strengths \nand \nweaknesses\n\n--- PDF PAGE 21 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     17 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Self-management \nstrategies \nMay include: \n1.1   Seeking assistance in the form of job coaching or \nmentoring  \n1.2   Continuing dialogue to tackle workplace grievances \n1.3   Collective negotiation/bargaining for better working \nconditions \n1.4   Share your goals to improve with a trusted co-\nworker or supervisor \n1.5   Make a negativity log of every instance when you \ncatch yourself complaining to others \n1.6   Make lists and schedules for necessary activities \n2.  Unpleasant situation \nMay include: \n2.1   Job burn-out \n2.2   Drug dependence \n2.3   Sulking \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Express emotions appropriately \n1.2   Work independently and show initiative \n1.3   Consistently demonstrate self-confidence and self-\ndiscipline \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Access to workplace and resources \n2.2   Case studies \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration or simulation with oral questioning \n3.2   Case problems involving work improvement and \nsustainability issues \n3.3   Third-party report \n4.  Context for \nAssessment \n4.1   Competency assessment may occur in workplace or any \nappropriately simulated environment\n",
