ters\nWater quality parameters may include:\n3.1 Fish behavior\n3.2 Use of measuring instruments dissolved oxygen\n3.3 pH\n3.4 Temperature\n3.5 Secchi disc visibility\n3.6 Ammonia level\n4. Other interventions\nfor optimum water\nquality\nOther interventions for optimum water quality may include:\n4.1 Pumping\n4.2 Aeration\n4.3 Feeding reduction\n4.4 Skip feeding\n4.5 Application of probiotics\n4.6 Mechanical intervention\n5. Physical\nappearance and\nbehavioral patterns\nPhysical appearance and behavioral patterns may include:\n5.1 Swirling\n5.2 Swimming at surface\n5.3 Non-feeding\n5.4 Lethargic\n5.5 Cottony growth\n5.6 Lesions\n5.7 Septicemia\n5.8 Over production of mucus\n5.9 Presence of external parasites\n6. Primary Treatment\nand prevention\nPrimary treatment and prevention may include:\nCage\n6.1 For fresh water: Saline water bath\n6.2 For salt water: fresh water bath\n6.3 Mild formalin solution bath\n\nPond\n6.4 Application of salt\n6.5 Freshening of water\n\nTank\n6.6 Freshening of water\n\n--- PDF PAGE 65 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 61\n\n6.7 For fresh water: Saline water bath\n6.8 For salt water: fresh water bath\n6.9 Mild formalin solution bath\n7. Container\nContainer may include:\n7.1 Styropore box\n7.2 Insulated box\n7.3 Plastic crates\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Stocked fingerlings\n1.2 Stocked sampling\n1.3 Performed feeding operations\n1.4 Maintained good water quality\n1.5 Performed common disease diagnosis and treatment\n1.6 Performed harvesting and post harvesting activities\n1.7 Applied safety measures\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, supplies, materials and equipment needed to\nperform required tasks during tilapia grow-out operations of\naquaculture farms.\n2.3 References and manuals\n2.4 PPEs\n3. Method of\nAssessment\nCompetency in