        "source_text": "--- PDF PAGE 19 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     15 \n \n \nUNIT OF COMPETENCY \n: \nDEVELOP CAREER AND LIFE DECISIONS \n \n \n \nUNIT CODE \n: \n400311213 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and attitudes \nin managing one’s emotions, developing reflective \npractice, \nand \nboosting \nself-confidence \nand \ndeveloping self-regulation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Manage one’s \nemotion \n1.1  Self-\nmanagement \nstrategies are \nidentified. \n1.2  Skills to work \nindependently \nand to show \ninitiative, to be \nconscientious, \nand persevering \nin the face of \nsetbacks and \nfrustrations are \ndeveloped. \n1.3  Techniques for \neffectively \nhandling negative \nemotions and \nunpleasant \nsituation in the \nworkplace are \nexamined. \n1.1  Self-\nmanagement \nstrategies that \nassist in \nregulating \nbehavior and \nachieving \npersonal and \nlearning goals \n(e.g. Nine self-\nmanagement \nstrategies \naccording to \nRobert Kelley) \n1.2  Enablers and \nbarriers in \nachieving \npersonal and \ncareer goals \n1.3  Techniques in \nhandling \nnegative \nemotions and \nunpleasant \nsituation in the \nworkplace such \nas frustration, \nanger, worry, \nanxiety, etc. \n1.1  Managing \nproperly one’s \nemotions and \nrecognizing \nsituations that \ncannot be \nchanged and \naccept them \nand remain \nprofessional \n1.2  Developing \nself-discipline, \nworking \nindependently \nand showing \ninitiative to \nachieve \npersonal and \ncareer goals \n1.3  Showing \nconfidence, \nand resilience \nin the face of \nsetbacks and \nfrustrations and \nother negative \nemotions and \nunpleasant \nsituations in the \nworkplace \n2.  Develop \nreflective \npractice \n2.1  Personal \nstrengths and \nachievements, 