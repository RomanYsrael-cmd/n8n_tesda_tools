        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and conditioned broodstock\n1.2 Produced fry\n1.3 Prepared hormone treated feed for sex reversal\n1.4 Performed nursery operation\n1.5 Carried-out dispersal of fingerlings\n1.6 Practiced safety measures\n2. Resource Implications\nThe following resources MUST be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, supplies, materials and equipment needed to\nperform required tasks during hatchery and nursery\noperations of aquaculture farms.\n2.3 References and manuals\n2.4 PPE\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Written examination\n3.2 Demonstration/Direct observation with oral questioning\n3.3 Production output\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 61 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 57\n\nUNIT OF COMPETENCY :\nPERFORM TILAPIA GROW OUT\n\nUNIT CODE\n\n:"
        },
        "source_text": "AFF622319\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude\nrequired to select and condition broodstock,\nproduce fry, prepare hormone treated feed for sex\nreversal, perform nursery operation and carry-out\ndispersal of fingerlings.\n\n,\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and\ncondition\nbroodstock\n1.1 Sexing of breeders is\nperformed following\nestablished industry\npractices\n1.2 Prophylactic\nmeasures are applied\nbased on industry\nstandards.\n1.3 Pairing of breeders is\nperformed following\nrecommended sex\nratio and stocking\ndensity.\n1.3 Feeding and\nmaintenance of\nbreeders are\nconducted based on\nGAqP\n1.1 Sexual dimorphism\n1.2 Criteria for\nbroodstock\nselection\n1.3 Inbreeding\n1.4 Phenotype\n1.5 Nutrient\nrequirements of\nbreeder and fry\noptimum sex ratio\n1.6 Conditioning\n1.7 Extruded and non\nextruded\n1.8 Procedures in feed\nand water quality\nmanagement\n1.9 Computaion of sex\nratio/stocking per\nunit area\n1.10 GAqP\n1.11 OSHS\n1.12 Wastes\nmanagement\n\n1.1 Performing\nsexing of\nbreeders\n1.2 Performing\npairing of\nbreeders\n1.3 Applying\nprophylactic\nmeasures\n1.4 Feeding and\nmaintaining\nbreeders\n1.5 Mathematical\nskills\n1.6 Practicing GAqP\n1.7Applying safety\nmeasures\n2. Produce fry\n2.1 Hatchery scheme is\nperformed following\nestablished industry\nprocedure\n2.2 Eggs are collected\nand incubated\nfollowing industry\nstandards.\n2.3 Swim-ups are\ncollected and reared in\nnursery following\nindustry practice.\n2.4 Fry is collected and\ngraded for pond based\nsystem according to\nindustry practices.\n\n2.1 Procedure in egg\nincubation\n2.2 Egg development\nstages\n2.3 Procedure in fry\ncollection and\ngrading\n2.4 Use of fungicide\n2.5 Recommended\n2.6 Standard grading\nsize\n2.7 GAqP\n2.8 OSHS\n2.9 Waste\nmanagement\n\n2.1 Performing\nhatchery scheme\n2.2 Collecting and\nincubating eggs\n2.3 Collecting and\nrearing swim-ups\n2.4 Collecting and\ngrading fry\n2.5 Using sorting\nnets\n2.6 Practicing GAqP\n2.7 Applying safety\n\n--- PDF PAGE 58 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 54\n\n3. Prepare hormone\ntreated feed for\nsex reversal\n3.1 Feeds and hormones\nare weighed according\nto standard dosage.\n3.2 Alcohol is measured\naccording to amount\nof feed to be treated.\n3.3 Stock solution is\nprepared following\nrecommended\nconcentration.\n3.4 Feed is treated with\nstock solution and air\ndried following\nestablished industry\npractices\n3.5 Treated feeds are\npacked, labelled and\nstored following\nindustry procedures\n3.6 Safety practices are\napplied following\nOSHS\n\n3.1 Hormone dosage\nrequired\n3.2 Optimum volume of\nalcohol as solvent\nand as medium for\ndispersing hormone\n3.3 Substitute chemicals\n3.4 Rate of inclusion\n3.5 Pond vs. tank\n3.6 Rate per unit\n3.7 Alcohol and\nhormone\n3.8 Feed treatment\n3.9 Packing, labelling\nand storage of\ntreated feeds\n3.10 Withdrawal period\n3.11 Waste water\ntreatment GAqP\n3.12 OSHS\n\n3.1 Weighing feeds\nand hormones\n3.2 Measuring\nalcohol\n3.3 Preparing stock\nsolution\n3.4 Treating feed\n3.5 Packing, labelling\nand storing\ntreated feeds\n3.6 Applying safety\npractices\n3.7 Practicing GAqP\n3.8 Mathematical\nskills\n\n4. Perform nursery\noperation\n4.1 Fry is stocked in\nfollowing\nrecommended\nstocking density\n4.2 Fry is fed according to\nmarket requirements\n4.3 Fry is graded\naccording to standard\nsizes\n4.4 Visual inspection of\ndiseases are done\nbased on appearance\nand behavioral\npatterns.\n\n4.1 Proper stocking\ndensity based on\necosystem and\nculture intensity\n4.2 Proper feeding\nschedule based on\nfry size and market\nrequirements\n4.3 Proper handling and\ngrading of fry based\non standard sizes\n4.4 Identification of\ndiseases and\nsymptoms based on\nvisual examination\nand fish behavior\n4.5 Culling\n4.6 GAqP\n4.7 OSHS\n4.1 Stocking fry\n4.2 Feeding fry\n4.3 Grading fry\n4.4 Performing visual\ninspection of\ndiseases\n4.5 Mensuration\nskills\n4.6 Applying OSHS\n4.7 Practicing GAqP\n5. Carry-out\ndispersal of\nfingerlings\n5.1 Conditioning of\nfingerlings is done\nfollowing established\nindustry practices\n5.2 Packing materials\nare prepared following\nestablished industry\nprocedure\n5.3 Number of fingerlings\nare estimated by\nvolume and by weight\n5.1 Loading density/\nsize/distance\n5.2 Prophylactic agent\n5.3 Biological\nrequirements of\nfingerlings\n5.4 Measures to reduce\nstress and\nmetabolic rate of\nfingerlings while in\ntransit\n5.5 Types of packing\nmaterials\n5.1 Handling ,\nconditioning, and\ntransporting\nfingerlings\n5.2 Estimating ETD\nand ETA based\non existing\nlogistics\n5.3 Preparing\npacking\nmaterials\n5.4 Packing\nfingerlings\n\n--- PDF PAGE 59 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 55\n\n5.4 Fingerlings are\npacked with reference\nto industry practices\n5.5 Transport condition is\nmonitored according\nto established industry\npractices\n5.6 Transport equipment\nare sourced-out based\non requirement.\n5.6 Transport condition\n5.7 Sourcing of\ntransport equipment\n5.8 Maintenance of\ntransport equipment\n5.9 Types of transport\nequipment\n5.10 Packing\nprocedures\n5.11 Rate of stocking\n5.12 Application rate\n5.13 GAqP\n5.14 OSHS\n5.15Waste\nmanagement\n5.5 Monitoring\ntransport\ncondition skills\n5.6 Sourcing out\ntransport\nequipment\n5.7 Employing GAqP\n5.8 Practicing OSHS\n5.9 Applying waste\nmanagement\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nHatchery scheme\nHatchery scheme may include:\n1.1 Egg incubation scheme\n1.2 Fry collection scheme\n2.\nStocking\nStocking may include:\n2.1 Stocking of fry in hapa,\n2.2 Stocking in tanks\n3.\nFeeding\nFeeding includes:\n3.1 Feeding for sex reversed tilapia\n3.2 Feeding for normal tilapia\n4.\nStandard sizes\nStandard sizes may include:\n4.1 Size #24\n4.2 Size #22\n4.3 Size #20\n4.4 Size #17\n4.5 Size #14\n5.\nAppearance and\nbehavioral patterns\nAppearance may include:\n5.1 Pale\n5.2 Dark\n5.3 Presence of parasites\n5.4 Number of mortalities\nBehavior pattern may include:\n5.5 Lethargic swimming\n5.6 Abnormal swimming orientation\n5.7 Gasping\n5.8 Non-reactive to stimulus\n\n6.\nConditioning\nConditioning includes:\n6.1 Fasting\n6.2 Prophylaxis\n7.\nPacking materials\nPacking materials may include:\n7.1 Plastic bags\n7.2 Rubber band\n\n--- PDF PAGE 60 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 56\n\n7.3 Filled Oxygen tank\n7.4 Ice\n7.5 Styropore box\n7.6 Currogated cardboard box\n8.\nIndustry practices\non packing\nIndustry practices on packing may include:\n8.1 Consideration of fingerling size\n8.2 Travel time\n8.3 Time of packing\n8.4 Mode of transport\n9.\nTransport\nequipment\nTransport equipment may include:\n9.1 Hauling tank\n9.2 Aeration facilities\n9.3 Live boat\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and conditioned broodstock\n1.2 Produced fry\n1.3 Prepared hormone treated feed for sex reversal\n1.4 Performed nursery operation\n1.5 Carried-out dispersal of fingerlings\n1.6 Practiced safety measures\n2. Resource Implications\nThe following resources MUST be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, supplies, materials and equipment needed to\nperform required tasks during hatchery and nursery\noperations of aquaculture farms.\n2.3 References and manuals\n2.4 PPE\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Written examination\n3.2 Demonstration/Direct observation with oral questioning\n3.3 Production output\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 61 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 57\n\nUNIT OF COMPETENCY :\nPERFORM TILAPIA GROW OUT\n\nUNIT CODE\n\n:"
