l or simulated workplace\n2.2 Tools, supplies, materials and equipment needed to\nperform the required tasks\n2.3 References and manuals\n2.4 PPEs\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration/direct observation with oral\nquestioning\n3.2 Written exam\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 57 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 53\n\nUNIT OF COMPETENCY :\nOPERATE TILAPIA HATCHERY AND NURSERY\n\nUNIT CODE\n\n:\nAFF622319\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude\nrequired to select and condition broodstock,\nproduce fry, prepare hormone treated feed for sex\nreversal, perform nursery operation and carry-out\ndispersal of fingerlings.\n\n,\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and\ncondition\nbroodstock\n1.1 Sexing of breeders is\nperformed following\nestablished industry\npractices\n1.2 Prophylactic\nmeasures are applied\nbased on industry\nstandards.\n1.3 Pairing of breeders is\nperformed following\nrecommended sex\nratio and stocking\ndensity.\n1.3 Feeding and\nmaintenance of\nbreeders are\nconducted based on\nGAqP\n1.1 Sexual dimorphism\n1.2 Criteria for\nbroodstock\nselection\n1.3 Inbreeding\n1.4 Phenotype\n1.5 Nutrient\nrequirements of\nbreeder and fry\noptimum sex ratio\n1.6 Conditioning\n1.7 Extruded and non\nextruded\n1.8 Procedures in feed\nand water quality\nmanagement\n1.9 Computaion of sex\nratio/stocking per\nunit area\n1.10 GAqP\n1.11 OSHS\n1.12 Wastes\nmanagement\n\n1.1 Performing\nsexing of\nbreeders\n1.2 Performing\npairing of\nbreeders\n1.3 Applying\nprophylactic\nmeasures\n1.4 Feeding and\nmaintaining\nbreeders\n1.5 Mathematical\nskills\n1.6 Practicing GAqP\n1.7Applying safety\nmeasures\n2. Produce fry\n2.1 Hatchery scheme is\nperformed following\nestablished industry\nprocedure\n2.2 Eggs are collected\nand incubated\nfollowing industry\nstandards.\n2.3 Swim-ups are\ncollected and reared in\nnursery following\nindustry practice.\n2.4 Fry is collected and\ngraded for pond based\nsystem according to\nindustry practices.\n\n2.1 Procedure in egg\nincubation\n2.2 Egg development\nstages\n2.3 Procedure in fry\ncollection and\ngrading\n2.4 Use of fungicide\n2.5 Recommended\n2.6 Standard grading\nsize\n2.7 GAqP\n2.8 OSHS\n2.9 Waste\nmanagement\n\n2.1 Performing\nhatchery scheme\n2.2 Collecting and\nincubating eggs\n2.3 Collecting and\nrearing swim-ups\n2.4 Collecting and\ngrading fry\n2.5 Using sorting\nnets\n2.6 Practicing GAqP\n2.7 Applying safety\n\n--- PDF PAGE 58 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 54\n\n3. Prepare hormone\ntreated feed for\nsex reversal\n3.1 Feeds and hormones\nare weighed according\nto standard dosage.\n3.2 Alcohol is measured\naccording to amount\nof feed to be treated.\n3.3 Stock solution is\nprepared following\nrecommended\nconcentration.\n3.4 Feed is treated with\nstock solution and air\ndried following\nestablished industry\npractices\n3.5 Treated feeds are\npacked, labelled and\nstored following\nindustry procedures\n3.6 Safety practices are\napplied following\nOSHS\n\n3.1 Hormone dosage\nrequired\n3.2 Optimum volume of\nalcohol as solvent\nand as medium for\ndispersing hormone\n3.3 Substitute chemicals\n3.4 Rate of inclusion\n3.5 Pond vs. tank\n3.6 Rate per unit\n3.7 Alcohol and\nhormone\n3.8 Feed treatment\n3.9 Packing, labelling\nand storage of\ntreated feeds\n3.10 Withdrawal period\n3.11 Waste water\ntreatment GAqP\n3.12 OSHS\n\n3.1 Weighing feeds\nand hormones\n3.2 Measuring\nalcohol\n3.3 Preparing stock\nsolution\n3.4 Treating feed\n3.5 Packing, labelling\nand storing\ntreated feeds\n3.6 Applying safety\npractices\n3.7 Practicing GAqP\n3.8 Mathematical\nskills\n\n4. Perform nursery\noperation\n4.1 Fry is stocked in