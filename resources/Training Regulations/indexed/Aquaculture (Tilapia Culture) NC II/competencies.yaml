        "source_text": "--- PDF PAGE 6 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     2 \n \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core \nunits of competency required in AQUACULTURE (TILAPIA CULTURE) NC II. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nPARTICIPATE IN WORKPLACE \nCOMMUNICATION \n \n \n \nUNIT CODE \n: \n400311210 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes  \nrequired to gather, interpret and convey information \nin response to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Obtain and convey \nworkplace \ninformation \n1.1  Specific and \nrelevant information \nis accessed from \nappropriate \nsources. \n1.2  Effective \nquestioning,  active \nlistening and \nspeaking skills are \nused to gather and \nconvey information. \n1.3  Appropriate \nmedium is used to \ntransfer information \nand ideas. \n1.4  Appropriate non- \nverbal \ncommunication is \nused. \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and \nfollowed. \n1.6  Defined workplace \nprocedures for the \nlocation and \nstorage of \ninformation are \nused. \n1.1  Effective verbal \nand nonverbal \ncommunication \n1.2  Different modes \nof communication  \n1.3  Medium of \ncommunication in \nthe workplace \n1.4  Organizational \npolicies \n1.5  Communication \nprocedures and \nsystems \n1.6  Lines of \nCommunication \n1.7  Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n1.8  Workplace \netiquette \n1.1  Following simple \nspoken language \n1.2  Performing \nroutine \nworkplace duties \nfollowing simple \nwritten notices \n1.3  Participating in \nworkplace \nmeetings and \ndiscussions \