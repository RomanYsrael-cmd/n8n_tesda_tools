        "source_text": "--- PDF PAGE 61 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     57 \n \nUNIT OF COMPETENCY : \nPERFORM TILAPIA GROW OUT \n \nUNIT CODE  \n \n: \nAFF622320 \n \nUNIT DESCRIPTOR          :   \nThis unit covers the knowledge, skills and attitude \nrequired to stock fingerlings, stock sampling, \nperform feeding operations, maintain good water \nquality, perform common disease diagnosis and \ntreatment and perform harvesting and primary post \nharvesting activities.   \n \n ELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Stock fingerlings  \n1.1Condition of fingerlings \nis monitored following \nestablished industry \npractices \n1.2Counts are validated \nby sampling  \n1.3 Acclimation is \nperformed prior to \nstocking  \n1.4 Stocking is performed \nbased on culture \nintensity \n1.1 Monitoring of \nfingerlings’ \ncondition  \n1.2Osmoregulation \n1.3 Carrying capacity \n1.4 Recirculation \n1.5 Filtration  \n1.6 Static or flow \nthrough \n1.7 Total stock based \non area and \nstocking density \n1.8 Sampling \nprocedures \n1.8 Mortality allowance \n1.9 Culture intensity \n1.10 GAqP \n1.11 OSHS \n1.12 Waste \nmanagement \n1.1 Monitoring \ncondition of \nfingerlings \n1.2 Validating counts \nby sampling \n1.3 Acclimating tilapia \nfingerlings \n1.4 Sampling skill \n1.5 Computation skills \n1.6 Applying stocking \nprocedures \n1.7Applying GAqP \n1.8 Practicing OSHS \n1.9 Applying waste \nmanagement \n2.  Stock sampling \n2.1 Samples are collected \nfor feeding adjustment \n2.2 Samples are weighed \nto determine average \nbody weight (ABW) \n2.3 Record keeping is \ndone following \nworkplace procedures. \n2.1 Typical Growth \nCurve \n2.2 Minimum sample \nsize required \n2.3 Importance of \nrandom sample \n2.4 Average body \nweight (ABW) \n2.5 Record keeping \n2.6 Using a weighing \nscale \n2.7 GAqP \n2.8 OSHS \n2.9 Waste management \n2.1 Collecting samples \n2.2 Weighing samples \n2.3 Record keeping  \n2.4 Using cast net or \nseine for sampling \n2.5 Computing ABW \n2.6 Mensuration and \ncomputation skills \n(weighing) \n2.7 Practicing GAqP \n2.8 Applying OSHS \n2.9 Practicing waste \nmanagement \n \n3.Perform feeding \noperations \n \n3.1 Daily feed ration is \ncalculated based on \nestimated biomass  \n3.2 Feeding frequency is \ndetermined based on \n3.1 Nutrient \nrequirements of \nstocks \n3.2 Feeding ration \nrecommended feed \nmanagement based \n3.1 Estimating feed \nconsumption \n3.2 Computing feed \nration \n3.3 Determining feeding \nfrequency\n\n--- PDF PAGE 62 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     58 \n \ngrowth stage and \nconsumption  \n3.3 Feed consumption is \nmonitored following \nGAqP \n3.4 Total amount of feed \nconsumed and feed \nconversion ratio FCR \nis computed for the \nentire growing cycle \n3.5 Physical property of \nfeeds are checked \nbased on industry \nstandards \n3.6 Actual amount of \nfeeds given is \nrecorded following \nworkplace standard \nprocedures. \n \non different \necosystem and \nculture methods \n3.3 Daily feed ration \n3.4 Feeding schedule \n3.5 Feeding strategies \n3.6 Satiation feeding \n3.7 Ad libitum \n3.8 Delayed feeding \n3.9 Use of mechanical \nfeeders \n3.10 Basic \nmathematical \noperation \n3.11 Systems and units \nof measurement \n3.12 PNS on \naquaculture feeds \n(tilapia) \n3.13 GAqP \n3.14 OSHS \n3.15 Waste \nmanagement \n3.4 Monitoring feeding \nconsumption \n3.5 Monitoring feeding \nbehavior \n3.5 Mensuration and \ncomputation skills \n3.6 Applying GAqP \n3.7 Practicing OSHS \n3.8 Applying waste \nmanagement \n \n4.  Maintain good \nwater quality \n4.1 Water quality  \nparameters are \nmonitored following \nindustry procedures \n4.2 Optimum water quality \nis maintained by water \nexchange and other \ninterventions   \n4.3 Fertilizer dressing is \napplied based on \nsecchi disc reading. \n4.1 Temperature, pH, \nDO, Ammonia \nrelationship \n4.2 DO Saturation rate \n4.3 Recommended \noptimal range of \nwater quality  \n4.4 Probiotics \n4.5 Flow through \n4.6 Procedure in \nmaintaining optimal \nwater quality \n4.7 Other interventions \nfor water quality \nmaintenance \n4.8 Fertilizing dressing \n4.9 GAqP \n4.10 OSHS \n4.11Waste management \n \n4.1 Using  monitoring \ninstruments such as \nsecchi disk, pH \nmeter and DO \nmeter \n4.2 Monitoring water \nquality parameters \n4.3 Maintaining \noptimum water \nquality \n4.4 Applying fertilizer \ndressing  \n4.5 Mensuration skills \n4.6 Practicing GAqP \n4.7 Applying OSHS \n4.8 Practicing waste \nmanagement  \n \n5.  Perform common \ndisease diagnosis \nand treatment \n5.1 Visual inspection of \ndiseases are done \nbased on appearance \nand behavioral \npatterns \n5.2 Infected fish is \nsampled for laboratory \ndiagnosis as required \n5.3 Primary treatment \nand prevention is \nidentified and \n5.1 Identification/ \nClassification of \ndiseases \n5.2 Procedure in \npreparation of \nspecimens for \nlaboratory diagnosis \n5.3 Knowledge on the \norigin/occurrence of \nparticular disease \n5.4 Prophylaxis \ntreatment and \n5.1 Performing visual \ninspection of \ndiseases \n5.2 Sampling infected \nfish \n5.3 Identifying and \nimplementing \nprimary treatment \nand prevention \n5.4 Disposing mortality \n5.5 Practicing safety \nmeasures\n\n--- PDF PAGE 63 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     59 \n \nimplemented \naccording to GAqP \n5.4  Disposal of mortality \nis carried out following \nGAqP \n5.5  Safety practices are \napplied following \nOSHS \npreventive options \nfor a particular \ndisease (baths, \ndips, UV treatment) \n5.5 GAqP \n5.6 OSHS \n5.7 Waste management \n5.6 Applying GAqP \n5.7 Managing wastes \n \n6.  Perform \nharvesting and \nprimary post \nharvesting \nactivities \n6.1 Pond is partially \ndrained and seined \nbased on industry \npractice \n6.2 Net cages are partially \nlifted to crowd the fish \nin one corner \n6.3 Crowded fish are \nscooped and \ntransferred to \nharvesting container \n6.4 Sorted fishes are bulk \nweighed and recorded \naccording to industry \nstandard procedures. \n6.5 Fish for live market \nare placed in live tank \nand transported with \naeration/oxygenation \n6.6 Fish for chilled market \nare iced and placed in \nfish container \naccording to industry \nstandards.  \n6.7 Safety practices are \napplied following \nOSHS \n6.1 Harvesting methods \nbased on different \necosystem \n6.2 Draining \n6.3 Seining \n6.4 Partial lifting of net in \nnet cages \n6.5 Primary Post \nharvesting methods \n6.6 Sorting and weighing \nprocedure \n6.7 Procedure for icing \nor live transport \n6.8 Types of fish \ncontainers \n6.9 OSHS \n6.10 Waste \nmanagement \n6.11 GAqP \n6.1 Using the following \nduring harvesting: \n \ncatch basins \n \nfish pumps \n \ngrader \n \ncrowder \n \ntraps \n6.2 Draining and \nseining ponds \n6.3 Crowding fish \n6.4 Scooping and \ntransferring \ncrowded fish \n6.5 Weighing and \nrecording fish \nharvest \n6.6 Placing fish on live \ntank \n6.7 Transporting fish \nwith aeration/ \noxygenation \n6.8 Sorting by size \n6.9 Handling live fish \n6.10 Icing and packing \n6.11 Computing and \nrecording  FCR, \nSurvival,  ABW \n6.12 Determining \nefficiency of culture \n6.13 Applying safety \nmeasures \n6.14 Practicing GAqP \n6.15 Managing wastes\n\n--- PDF PAGE 64 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     60 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Culture intensity \nCulture intensity includes: \n1.1  Intensive system (full feeding, stocking density 10 pcs & \nabove/sq m) \n1.2  Semi-intensive system (fertilization with supplemental \nfeeding, stocking density 4-8pcs/sq m) \n1.3  Extensive system (fertilization, stocking density 3pcs & \nbelow/sq m) \n2. Physical property  \nPhysical property may include: \n2.1 Stability \n2.2 Fines \n2.3 Hardness \n2.4 Particle size \n3. Water quality \nparameters \nWater quality parameters may include: \n3.1  Fish behavior \n3.2  Use of measuring instruments dissolved oxygen \n3.3  pH \n3.4  Temperature \n3.5  Secchi disc visibility \n3.6  Ammonia level \n4. Other interventions \nfor optimum water \nquality \nOther interventions for optimum water quality may include: \n4.1 Pumping \n4.2 Aeration \n4.3 Feeding reduction \n4.4 Skip feeding \n4.5 Application of probiotics \n4.6 Mechanical intervention \n5. Physical \nappearance and \nbehavioral patterns \nPhysical appearance and behavioral patterns may include: \n5.1  Swirling \n5.2  Swimming at surface \n5.3  Non-feeding \n5.4  Lethargic \n5.5  Cottony growth \n5.6  Lesions \n5.7  Septicemia \n5.8  Over production of mucus \n5.9  Presence of external parasites \n6. Primary Treatment \nand prevention \nPrimary treatment and prevention may include: \nCage  \n6.1  For fresh water: Saline water bath \n6.2  For salt water: fresh water bath \n6.3  Mild formalin solution bath \n \nPond \n6.4  Application of salt \n6.5  Freshening of water \n \nTank \n6.6  Freshening of water\n\n--- PDF PAGE 65 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     61 \n \n6.7  For fresh water: Saline water bath \n6.8  For salt water: fresh water bath \n6.9  Mild formalin solution bath \n7. Container \nContainer may include: \n7.1 Styropore box  \n7.2 Insulated box \n7.3 Plastic crates \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 Stocked fingerlings  \n1.2 Stocked sampling  \n1.3 Performed feeding operations \n1.4 Maintained good water quality \n1.5 Performed common disease diagnosis and treatment \n1.6 Performed harvesting and post harvesting activities \n1.7 Applied safety measures \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1 Actual or simulated workplace \n2.2 Tools, supplies, materials and equipment needed to \nperform required tasks during tilapia grow-out operations of \naquaculture farms. \n2.3 References and manuals \n2.4 PPEs \n3. Method of \nAssessment \nCompetency in this unit will be assessed through: \n3.1 Written Examination \n3.2 Demonstration/Direct observations with oral questioning  \n3.3 Third party report \n4. Context of \nAssessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
