        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Measured required resource utilization in the workplace\nusing appropriate techniques\n1.2 Recorded data in accordance with workplace protocol\n1.3 Identified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4 Validate the identified causes of inefficiency and/or\nineffectiveness thru established environmental procedures\n1.5 Report efficiency and effectives of resource utilization to\nappropriate personnel\n1.6 Clarify feedback on information/concerns raised with\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Tools, materials and equipment relevant to the tasks\n2.3 PPE\n2.4 Manuals and references\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Oral questioning\n3.3 Written examination\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 37 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 33\n\nUNIT OF COMPETENCY\n:\nPRACTICE ENTREPRENEURIAL SKILLS IN THE\nWORKPLACE\n\nUNIT CODE\n:"
        },
        "source_text": "400311217\n\nUNIT DESCRIPTOR\n:\nThis unit covers knowledge, skills and attitude to identify\nthe efficiency and effectiveness of resource utilization,\ndetermine causes of inefficiency and/or ineffectiveness\nof resource utilization and Convey inefficient and\nineffective environmental practices.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n1.1 Required\nresource\nutilization in the\nworkplace is\nmeasured using\nappropriate\ntechniques.\n1.2 Data are recorded\nin accordance\nwith workplace\nprotocol.\n1.3 Recorded data\nare compared to\ndetermine the\nefficiency and\neffectiveness of\nresource\nutilization\naccording to\nestablished\nenvironmental\nwork\nprocedures.\n1.1 Importance of\nEnvironmental\nLiteracy\n1.2 Environmental\nWork\nProcedures\n1.3 Waste\nMinimization\n1.4 Efficient Energy\nConsumptions\n1.1 Recording\nSkills\n1.2 Writing Skills\n1.3 Innovation\nSkills\n2. Determine\ncauses of\ninefficiency\nand/or\nineffectiveness of\nresource\nutilization\n2.1 Potential causes\nof inefficiency\nand/or\nineffectiveness\nare listed.\n2.2 Causes of\ninefficiency and/or\nineffectiveness\nare identified\nthrough deductive\nreasoning.\n2.1 Causes of\nenvironmental\ninefficiencies\nand ineffective-\nness\n2.1 Deductive\nReasoning\nSkills\n2.2 Critical thinking\n2.3 Problem\nSolving\n2.4 Observation\nSkills\n\n--- PDF PAGE 34 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 30\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3 Identified causes\nof inefficiency\nand/or\nineffectiveness\nare validated thru\nestablished\nenvironmental\nprocedures.\n3. Convey\ninefficient and\nineffective\nenvironmental\npractices\n3.1 Efficiency and\neffectiveness of\nresource\nutilization are\nreported to\nappropriate\npersonnel.\n3.2 Concerns related\nresource\nutilization are\ndiscussed with\nappropriate\npersonnel.\n3.3 Feedback on\ninformation/\nconcerns raised\nare clarified with\nappropriate\npersonnel.\n3.1 Appropriate\nPersonnel to\naddress the\nenvironmental\nhazards\n3.2 Environmental\ncorrective\nactions\n3.1 Written and\nOral\nCommunication\nSkills\n3.2 Critical thinking\n3.3 Problem\nSolving\n3.4 Observation\nSkills\n3.5 Practice\nEnvironmental\nAwareness\n\n--- PDF PAGE 35 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 31\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1 Utilization of Energy, Water, Fuel Procedures\n1.2 Waster Segregation Procedures\n1.3 Waste Disposal and Reuse Procedures\n1.4 Waste Collection Procedures\n1.5 Usage of Hazardous Materials Procedures\n1.6 Chemical Application Procedures\n1.7 Labeling Procedures\n2. Appropriate Personnel\nMay include:\n2.1 Manager\n2.2 Safety Officer\n2.3 EHS Offices\n2.4 Supervisors\n2.5 Team Leaders\n2.6 Administrators\n2.7 Stakeholders\n2.8 Government Official\n2.9 Key Personnel\n2.10 Specialists\n2.11 Himself\n\n--- PDF PAGE 36 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 32\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Measured required resource utilization in the workplace\nusing appropriate techniques\n1.2 Recorded data in accordance with workplace protocol\n1.3 Identified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4 Validate the identified causes of inefficiency and/or\nineffectiveness thru established environmental procedures\n1.5 Report efficiency and effectives of resource utilization to\nappropriate personnel\n1.6 Clarify feedback on information/concerns raised with\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Tools, materials and equipment relevant to the tasks\n2.3 PPE\n2.4 Manuals and references\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Oral questioning\n3.3 Written examination\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 37 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 33\n\nUNIT OF COMPETENCY\n:\nPRACTICE ENTREPRENEURIAL SKILLS IN THE\nWORKPLACE\n\nUNIT CODE\n:"
