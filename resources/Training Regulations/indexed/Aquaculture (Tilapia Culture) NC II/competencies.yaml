mation raw \nmaterials  and \nmanpower \nrequirements for \nconstruction \n4.5 Types of cages  \n        -Fixed cages \n        -Floating cages \n4.6 Positioning of posts  \n4.7 Attaching of frames \nto floaters  \n4.8 Net fabrication  \n4.9 Attaching of \nfabricated net to \nfloaters  and sinkers \n4.10 Net inspection for \ndamages and repair \n4.11 Net setting to fit \nframe \n4.5 Required length of \nmooring lines and \nweight of mooring \nblocks \n4.6 Disposal of wastes \n4.1 Preparing \nconstruction \nmaterials and \nmanpower \nrequirements \n4.2 Estimating flow rate \nof surface water \n4.3 Positioning post for \nfixed cages \n4.4 Attaching frames to \nfloaters for floating \ncages \n4.5 Net fabricating \n4.6 Attaching \nfabricated net cages \nto floaters and \nsinkers \n4.7 Inspecting nets for \ndamages \n4.8 Net mending  \n4.9 Knot tying \n4.10 Simple carpentry \nand masonry skills \n4.11 Reading plan \n4.12 Swimming \n4.13 Diving \n4.14 Practicing safety \nmeasures \n4.15 Applying GAqP\n\n--- PDF PAGE 53 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     49 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.7 Mooring system is \ninstalled according to \ndepth and bottom \ntype.  \n4.7 OSHS \n4.8 GAqP \n4.16 Practicing waste \nmanagement\n\n--- PDF PAGE 54 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     50 \n \nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1.  Tools \nTools may include: \nMeasuring device: \n1.1 Dissolve oxygen meters \n1.2 Laboratory thermometer, 0-100 oC \n1.3 pH meter \n1.4 Refractometer \n1.5 Calculator \n1.6 Secchi disc \nConstruction tools: \n1.7 Electrical tools: \n-plier \n-screw driver(+, -) \n-wire stripper \n1.8 Masonry tools: \n-leveling tool \n-trowel \n-steel saw \n1.9 Carpentry tools: \n-hammer \n-wood saw \nOther tools: \n1.10 Rake (as cultivator) \n1.11 Plastic pail \n1.13 Plastic basin \n1.14Flashlights \n1.15 Bolo \n1.16 Shovel \n1.17 Digging blades \n2. Materials \nMaterials may include: \n2.1 Floater \n2.2 Rubber boots \n2.3 Face mask \n2.4 Hand gloves \n2.5 P.E. rope \n2.6 Tape measure \n2.7 Nails \n2.8 Monofilament line \n2.9 Seine net \n2.10 Assorted nets \n2.11 Formalin solution \n2.12 Sodium hypochlorite \n2.13 Hydrated lime \n3.  Equipment \nEquipment may include: \n3.1 Generator \n3.2 Water pump \n3.3 Aerators \n3.4 Incubators\n\n--- PDF PAGE 55 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     51 \n \n4.  Farm inputs \nFarm inputs may include: \n4.1 Fertilizer \n4.2 Lime \n4.3 Pesticides \n5.  Nets \nNets may include: \n5.1 Finemesh nets (hapa) \n5.2 Conditioning nets \n5.3 Scoop nets \n5.4 Seine nets \n5.5 Grading nets or screen \n6.  Aquaculture facilities \n Agriculture facilities may include:   \n6.1 Dikes \n6.2 Frames \n6.3 Water Supply and Drainage system \n6.4 Ponds \n6.5 Tanks \n6.6 Cage set - up \n6.6.1 Cage frames \n6.6.2 Net cages \n6.6.3 Floats \n6.6.4 Mooring lines \n6.6.5 Mooring blocks or anchors \n6.7  Oxygen tank with regulator \n6.8  Water Gates and pipes \n6.9 Store room \n6.10  Waste management facilities \n7. Extraneous organisms \nExtraneous organisms may include: \n7.1 Birds \n7.2 Frogs \n7.3 Man \n7.4 Snapping Turtles \n7.5 Snakes \n7.6 Predatory fish \n7.7 Monitor lizard \n7.8 Rats \n8. Pond preparation \nPond preparation may include: \n8.1 Liming  \n8.2 Fertilization \n8.3 Tilling  \n8.4 Drying \n8.5 Pest eradication  \n9. Water assessment  \nWater assessment includes: \n9.1 Quantity of water level \n9.2 Quality of water \n10. Method of water \nexchange \nMethod of water exchange may include: \n10.1 Flow-through \n10.2 Drain and fill \n11. Land preparation \nLand preparation includes: \n11.1 Draining \n11.2 Leveling \n11.3 Drying\n\n--- PDF PAGE 56 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     52 \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared tools, materials and equipment \n1.2. Prepared aquaculture facilities \n1.3. Secured facilities \n1.4. Installed fish cages \n1.5 Practiced safety measures \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1 Actual or simulated workplace  \n2.2 Tools, supplies, materials and equipment needed to \nperform the required tasks \n2.3 References and manuals \n2.4 PPEs \n3.  Method of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 Demonstration/direct observation with oral \nquestioning \n3.2 Written exam \n4.  Context of \nAssessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
