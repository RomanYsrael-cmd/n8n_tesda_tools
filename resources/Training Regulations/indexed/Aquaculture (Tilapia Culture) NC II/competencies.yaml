rming visual \ninspection of \ndiseases \n4.5 Mensuration \nskills \n4.6 Applying OSHS  \n4.7 Practicing GAqP \n5.  Carry-out \ndispersal of \nfingerlings \n5.1 Conditioning of \nfingerlings is done \nfollowing established \nindustry practices \n5.2 Packing materials \nare prepared following \nestablished industry \nprocedure  \n5.3 Number of fingerlings \nare estimated by \nvolume and by weight  \n5.1 Loading density/ \nsize/distance \n5.2 Prophylactic agent \n5.3 Biological \nrequirements of \nfingerlings \n5.4 Measures to reduce \nstress and \nmetabolic rate of \nfingerlings while in \ntransit \n5.5 Types of packing \nmaterials \n5.1 Handling , \nconditioning, and \ntransporting \nfingerlings \n5.2 Estimating ETD \nand ETA based \non existing \nlogistics \n5.3 Preparing \npacking \nmaterials \n5.4 Packing \nfingerlings\n\n--- PDF PAGE 59 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     55 \n \n5.4 Fingerlings are \npacked with reference \nto  industry practices  \n5.5 Transport condition is \nmonitored according \nto established industry \npractices \n5.6 Transport equipment \nare sourced-out based \non requirement. \n5.6 Transport condition \n5.7 Sourcing of \ntransport equipment \n5.8 Maintenance of \ntransport equipment \n5.9 Types of transport \nequipment \n5.10 Packing \nprocedures \n5.11 Rate of stocking \n5.12 Application rate \n5.13 GAqP \n5.14 OSHS \n5.15Waste \nmanagement \n5.5 Monitoring \ntransport \ncondition skills \n5.6 Sourcing out  \ntransport \nequipment \n5.7 Employing GAqP \n5.8 Practicing OSHS \n5.9 Applying waste \nmanagement \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nHatchery scheme \nHatchery scheme may include: \n1.1 Egg incubation scheme  \n1.2 Fry collection scheme \n2. \nStocking \nStocking may include: \n2.1 Stocking of fry in hapa,  \n2.2 Stocking in tanks \n3. \nFeeding \nFeeding includes: \n3.1 Feeding for sex reversed tilapia \n3.2 Feeding for no