take-off \n2.5  Materials \ncosting \n2.1  Compute bill of \nmaterials \n2.2  Compute \nproject cost\n\n--- PDF PAGE 48 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     44 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmathematical \noperation. \n1.3  Calculate whole \nfraction, \npercentage and \nmixed when are \nused to complete \nthe instructions. \n1.4  Number \ncomputed is \nchecked following \nwork \nrequirements\n\n--- PDF PAGE 49 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     45 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Four basic mathematical \noperation \nIncludes: \n1.1   Addition \n1.2   Subtraction \n1.3   Multiplication \n1.4   Division \n2.  System of measurement \nIncludes: \n2.1   English \n2.2   Metric \n3.  Units of measurement \nIncludes: \n3.1   Area \n3.2   Volume \n3.3   Weight \n3.4   Length \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Performed estimation \n1.2   Performed basic workplace calculation \n1.3   Applied corrective measures as maybe necessary \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Relevant tools and equipment for basic calculation \n2.2   Recommended data \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Practical demonstration \n3.2   Written examination \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
