        "source_text": "400311210\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information\nin response to workplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and\nrelevant information\nis accessed from\nappropriate\nsources.\n1.2 Effective\nquestioning, active\nlistening and\nspeaking skills are\nused to gather and\nconvey information.\n1.3 Appropriate\nmedium is used to\ntransfer information\nand ideas.\n1.4 Appropriate non-\nverbal\ncommunication is\nused.\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and\nfollowed.\n1.6 Defined workplace\nprocedures for the\nlocation and\nstorage of\ninformation are\nused.\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes\nof communication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n1.1 Following simple\nspoken language\n1.2 Performing\nroutine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated\ndocuments\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n\n--- PDF PAGE 7 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 3\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.7 Personal interaction\nis carried out clearly\nand concisely.\n1.9 Interpersonal\nskills in the\nworkplace\n1.10 Active-listening\nskills\n2. Perform duties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are\nread and\ninterpreted in\naccordance with\norganizational\nguidelines.\n2.2 Routine written\ninstruction are\nfollowed based on\nestablished\nprocedures.\n2.3 Feedback is given\nto workplace\nsupervisor based\ninstructions/\ninformation\nreceived.\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner.\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters concerning\nconditions of\nemployment are\nsought and asked\nfrom appropriate\nsources.\n2.6 Meetings outcomes\nare interpreted and\nimplemented.\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes\nof communication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n2.1 Following simple\nspoken\ninstructions\n2.2 Performing\nroutine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace\nmeetings and\ndiscussions\n2.4 Completing\nwork- related\ndocuments\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Basic\nquestioning/\nquerying\n2.9 Skills in reading\nfor information\n2.10 Skills in locating\n3. Complete relevant\nwork-related\ndocuments\n3.1 Range of forms\nrelating to\nconditions of\nemployment are\ncompleted\naccurately and\nlegibly.\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes\nof communication\n3.3 Workplace8 forms\nand documents\n\n3.1 Completing\nwork-related\ndocuments\n3.2 Applying\noperations of\naddition,\nsubtraction,\n\n--- PDF PAGE 8 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 4\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Workplace data is\nrecorded on\nstandard workplace\nforms and\ndocuments.\n3.3 Errors in recording\ninformation on\nforms/ documents\nare identified and\nacted upon.\n3.4 Reporting\nrequirements to\nsupervisor are\ncompleted\naccording to\norganizational\nguidelines.\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\ndivision and\nmultiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 9 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 5\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1 Team members\n1.2 Supervisor/Department Head\n1.3 Suppliers\n1.4 Trade personnel\n1.5 Local government\n1.6 Industry bodies\n2. Medium\nMay include:\n2.1 Memorandum\n2.2 Circular\n2.3 Notice\n2.4 Information dissemination\n2.5 Follow-up or verbal instructions\n2.6 Face-to-face communication\n2.7 Electronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1 Manual filing system\n3.2 Computer-based filing system\n4. Workplace interactions\nMay include:\n4.1 Face-to-face\n4.2 Telephone\n4.3 Electronic and two-way radio\n4.4 Written including electronic means, memos,\ninstruction and forms\n4.5 Non-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1 HR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 10 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 6\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard format\nof the organization\n1.2 Accessed information using workplace communication\nequipment/systems\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Notebook\n2.4 Writing materials\n2.5 Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Written test\n3.4 Third-party report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 7\n\nUNIT OF COMPETENCY\n:\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:"
