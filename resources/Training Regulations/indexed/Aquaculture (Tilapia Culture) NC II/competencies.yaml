        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in\ndesignated facilities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Farm location\n2.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Practical demonstration\n3.2 Third Party Report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 44 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 40\n\nUNIT OF COMPETENCY\n:\nUSE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
        },
        "source_text": "AFF321201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform safety measures effectively and\nefficiently. It includes identifying areas, tools, materials,\ntime and place in performing safety measures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine areas\nof concern for\nsafety measures\n1.1 Work tasks are\nidentified in line\nwith farm\noperations.\n1.2 Place for safety\nmeasures are\ndetermined in line\nwith farm\noperations.\n1.3 Time for safety\nmeasures are\ndetermined in line\nwith farm\noperations.\n1.4 Appropriate\ntools, materials\nand outfits are\nprepared in line\nwith job\nrequirements.\n1.1 Different work\ntasks in farm\noperations\n1.2 Place and time\nfor\nimplementation\nof safety\nmeasures\n1.3 Different\nhazards in the\nworkplace\n1.4 Types of tools,\nmaterials and\noutfits\n1.5 Preparation of\ntools, materials\nand outfits\n1.1 Identifying\nwork tasks in\nfarm operations\n1.2 Determining\nplace and time\nfor\nimplementation\nof safety\nmeasures\n1.3 Reading labels,\nmanuals and\nother basic\nsafety\ninformation\n1.4 Identifying\neffective/\nfunctional tools,\nmaterials and\noutfit\n1.5 Preparing\ntools, materials\nand outfits\n1.6 Discarding\ndefective tools,\nand materials\n2. Apply\nappropriate\nsafety measures\n2.1 Tools and\nmaterials are\nused according to\nspecifications and\nprocedures.\n2.2 Outfits are worn\naccording to farm\nrequirements.\n2.1 Uses and\nfunctions of\ntools\n2.2 Outfits and how\nto wear it\n2.3 Expiration/shelf\nlife of materials\n2.1 Using tools and\nmaterials in the\nworkplace\n2.2 Wearing of\noutfits\n2.3 Observing\nexpiration/shelf\nlife of materials\n\n--- PDF PAGE 41 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 37\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3 Effectivity/shelf\nlife/expiration of\nmaterials are\nstrictly observed.\n2.4 Emergency\nprocedures are\nknown and\nfollowed to ensure\na safework\nrequirement.\n2.5 Hazards in the\nworkplace are\nidentified and\nreported in line\nwith farm\nguidelines.\n2.4 Proper disposal\nof expired\nmaterials\n2.5 Environmental\nrules and\nregulations\n2.6 Emergency\nprocedures\n2.7 Hazards\nidentification\nand reporting\n2.8 Communication\nskills\n2.9 OSHS\n2.4 Disposing of\nexpired\nmaterials\n2.5 Following\nemergency\nprocedures\n2.6 Identifying and\nreporting of\nhazards in\nworkplace area\n3. Safe keep\n/dispose tools,\nmaterials and\noutfit\n3.1 Used tools and\noutfit are cleaned\nafter use and\nstored in\ndesignated areas.\n3.2 Unused materials\nare properly\nlabeled and\nstored according\nto manufacturer’s\nrecommendation\nand farm\nrequirements.\n3.3 Waste materials\nare disposed\naccording to\nmanufacturers,\ngovernment and\nfarm\nrequirements.\n3.1 Procedures of\ncleaning used\ntools and outfits\n3.2 Label and\nstorage unused\nmaterials\n3.3 Disposal of\nwastes\nmaterials\n3.4 Manufacturers’\nrecommendatio\nn on keeping\nmaterials\n3.5 Environmental\nrules and\nregulations\n3.1 Cleaning used\ntools and outfit\n3.2 Labeling and\nstoring unused\nmaterials\n3.3 Disposing\nwaste materials\n\n--- PDF PAGE 42 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 38\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the subsectors:\n1.1 Crop Production\n1.2 Post-harvest\n1.3 Agri-marketing\n1.4 Farm Equipment\n2. Place\n2.1 Stock room/storage areas/warehouse\n2.2 Field/farm/orchard\n3. Time\n3.1 Fertilizer and pesticides application\n3.2 Feed mixing and feeding\n3.3 Harvesting and hauling\n4. Tools, materials and\noutfits\n4.1 Tools\n4.1.1 Wrenches\n4.1.2 Screw driver\n4.1.3 Pliers\n4.2 Outfit\n4.2.1 Masks\n4.2.2 Gloves\n4.2.3 Boots\n4.2.4 Overall coats\n4.2.5 Hat\n4.2.6 Eye goggles\n5. Emergency procedures\n5.1 Location of first aid kit\n5.2 Evacuation\n5.3 Agencies contract\n5.4 Farm emergency procedures\n6. Hazards\n6.1 Chemical\n6.2 Electrical\n6.3 Falls\n\n--- PDF PAGE 43 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 39\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in\ndesignated facilities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Farm location\n2.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Practical demonstration\n3.2 Third Party Report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 44 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 40\n\nUNIT OF COMPETENCY\n:\nUSE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
