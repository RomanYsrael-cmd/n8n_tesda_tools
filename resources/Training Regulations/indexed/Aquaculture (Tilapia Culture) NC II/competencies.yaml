        "source_title": "CONTRIBUTE TO WORKPLACE INNOVATION",
        "source_text": "--- PDF PAGE 22 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     18 \n \n \nUNIT OF COMPETENCY \n: \nCONTRIBUTE TO WORKPLACE INNOVATION \n \n \n \nUNIT CODE \n: \n400311214 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to make a pro-active and positive \ncontribution to workplace innovation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify \nopportunities to \ndo things better \n1.1  Opportunities \nfor improvement \nare identified \nproactively in own \narea of work. \n1.2  Information are \ngathered and \nreviewed which \nmay be relevant \nto ideas and \nwhich might assist \nin gaining support \nfor idea. \n1.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements. \n1.2  Positive impacts \nand challenges \nin innovation. \n1.3  Types of \nchanges and \nresponsibility. \n1.4  Seven habits of \nhighly effective \npeople. \n1.1  Identifying \nopportunities to \nimprove and to \ndo things \nbetter. \nInvolvement \n1.2  Identifying the \npositive \nimpacts and \nthe challenges \nof change and \ninnovation \n1.3  Identifying \nexamples of \nthe types of \nchanges that \nare within and \noutside own \nscope of \nresponsibility \n2.  Discuss and \ndevelop ideas \nwith others \n2.1  People who \ncould provide \ninput to ideas for \nimprovements are \nidentified. \n2.2  Ways of \napproaching \npeople to begin \nsharing ideas are \nselected. \n2.3  Meeting is set \nwith relevant \npeople. \n2.4  Ideas for follow \nup are review and \nselected based on \nfeedback. \n2.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n2.2  Positive impacts \nand challenges \nin innovation \n2.3  Types of \nchanges and \nresponsibility. \n2.4  Seven habits of \nhighly effective \npeople \n2.1  Identifying \nopportunities to \nimprove and to \ndo things \nbetter. \nInvolvement \n2.2  Identifying the \npositive \nimpacts and \nthe challenges \nof change and \ninnovation \n2.3  Providing \nexamples of \nthe types of \nchanges that \nare within and\n\n--- PDF PAGE 23 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     19 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.5  Critical inquiry \nmethod is used to \ndiscuss and \ndevelop ideas \nwith others. \noutside own \nscope of \nresponsibility \n2.4  \nCommunicating \nideas for \nchange through \nsmall group \ndiscussions \nand meetings \n3.  Integrate ideas \nfor change in the \nworkplace \n3.1  Critical inquiry \nmethod is used to \nintegrate different \nideas for change \nof key people. \n3.2  Summarizing, \nanalyzing and \ngeneralizing skills \nare used to \nextract salient \npoints in the pool \nof ideas. \n3.3  Reporting skills \nare likewise used \nto communicate \nresults. \n3.4  Current Issues \nand concerns on \nthe systems, \nprocesses and \nprocedures, as \nwell as the need \nfor simple \ninnovative \npractices are \nidentified. \n3.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n3.2  Positive impacts \nand challenges \nin innovation \n3.3  Types of \nchanges and \nresponsibility \n3.4  Seven habits of \nhighly effective \npeople \n3.5  Basic research \nskills \n3.1  Identifying \nopportunities to \nimprove and to \ndo things \nbetter. \nInvolvement \n3.2  Identifying the \npositive \nimpacts and \nthe challenges \nof change and \ninnovation \n3.3  Providing \nexamples of \nthe types of \nchanges that \nare within and \noutside own \nscope of \nresponsibility \n3.4  \nCommunicating \nideas for \nchange through \nsmall group \ndiscussions \nand meetings \n3.5  Demonstrating \nskills in \nanalysis and \ninterpretation of \ndata\n\n--- PDF PAGE 24 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     20 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Opportunities for \nimprovement \nMay include: \n1.1   Systems \n1.2   Processes \n1.3   Procedures \n1.4   Protocols \n1.5   Codes \n1.6   Practices \n2.  Information \nMay include: \n2.1   Workplace communication problems \n2.2   Performance evaluation results \n2.3   Team dynamics issues and concerns \n2.4   Challenges on return of investment \n2.5   New tools, processes and procedures \n2.6   New people in the organization \n3.  People who could \nprovide input \nMay include: \n3.1   Leaders \n3.2   Managers \n3.3   Specialists \n3.4   Associates \n3.5   Researchers \n3.6   Supervisors \n3.7   Staff \n3.8   Consultants (external) \n3.9   People outside the organization in the same field or similar \nexpertise/industry \n3.10 Clients \n4.  Critical inquiry \nmethod \nMay include: \n4.1   Preparation \n4.2   Discussion \n4.3   Clarification of goals \n4.4   Negotiate towards a Win-Win outcome \n4.5   Agreement \n4.6   Implementation of a course of action \n4.7   Effective verbal communication. See our pages: Verbal \nCommunication and Effective Speaking \n4.8   Listening \n4.9   Reducing misunderstandings is a key part of effective \nnegotiation \n4.10 Rapport Building \n4.11 Problem Solving \n4.12 Decision Making \n4.13 Assertiveness \n4.14 Dealing with Difficult Situations \n5.  Reporting skills \nMay include: \n5.1   Data management \n5.2   Coding \n5.3   Data analysis and interpretation \n5.4   Coherent writing \n5.5   Speaking\n\n--- PDF PAGE 25 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     21 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Identified opportunities to do things better. \n1.2   Discussed and developed ideas with others on how to \ncontribute to workplace innovation. \n1.3   Integrated ideas for change in the workplace. \n1.4   Analyzed and reported rooms for innovation and learning \nin the workplace. \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Pens, papers and writing implements \n2.2   Cartolina \n2.3   Manila papers \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Psychological and behavioral Interviews \n3.2   Performance Evaluation \n3.3   Life Narrative Inquiry \n3.4   Review of portfolios of evidence and third-party workplace \nreports of on-the-job performance \n3.5   Sensitivity analysis \n3.6   Organizational analysis \n3.7   Standardized assessment of character strengths and \nvirtues applied \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions.\n",
