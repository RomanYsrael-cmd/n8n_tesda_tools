          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate farm tools and equipment\n1.2 Operated farm equipment according to manual\nspecification\n1.3 Performed preventive maintenance\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Service/operational manual of farm tools and equipment\n2.2 Tools and equipment\n2.3 Farm implements\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Practical demonstration\n3.3 Third Party Report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 47 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 43\n\nUNIT OF COMPETENCY\n:\nPERFORM ESTIMATION AND BASIC\nCALCULATION\n\nUNIT CODE\n:"
