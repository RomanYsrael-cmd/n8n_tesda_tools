        "source_text": "AFF321202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of farm\ntools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and use\nfarm tools\n1.1 Appropriate farm\ntools are identified\naccording to\nrequirement/use.\n1.2 Farm tools are\nchecked for faults\nand defective\ntools reported in\naccordance with\nfarm procedures.\n1.3 Appropriate tools\nare safely used\naccording to job\nrequirements and\nmanufacturers\nconditions.\n1.1 Types and uses\nof farm tools\n1.2 Characteristics\nof functional\ntools\n1.3 Checking tools\nfor defects/faults\n1.4 Segregation\nand reporting\ndefective tools\n1.5 Uses of tools\n1.1 Identifying farm\ntools for the\nwork\n1.2 Checking the\nconditions of\ntools\n1.3 Reporting\ndefective tools\n1.4 Using tools\n2. Select and\noperate farm\nequipment\n2.1 Identify\nappropriate farm\nequipment.\n2.2 Instructional\nmanual of the\nfarm tools and\nequipment are\ncarefully read\nprior to operation.\n2.3 Pre-operation\ncheck-up is\nconducted in line\nwith\nmanufacturers\nmanual.\n2.4 Faults in farm\nequipment are\nidentified and\nreported in line\n2.1 Types and\noperations of\nfarm equipment\n2.2 Standards\noperating\nprocedures of\nfarm equipment\n2.3 Instructional\nmanual of\nequipment\n2.4 Pre-operation\ncheck-up\n2.5 Equipment\nSpecification\n2.6 Procedures in\ncalibrating and\nuse of\nequipment\n2.7 Equipment\nfaults\n2.1 Identifying\nappropriate\nfarm equipment\nfor the work\n2.2 Reading\ninstructional\nmanual\n2.3 Conducting\npre-operation\ncheck-up\n2.4 Identifying\nfaults/defects of\nfarm equipment\n2.5 Reporting on\ndefective farm\nequipment\n2.6 Operating farm\nequipment\n\n--- PDF PAGE 45 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 41\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nwith farm\nprocedures.\n2.5 Farm equipment\nis used according\nto its function.\n2.6 Safety\nprocedures are\nfollowed.\nidentification\nand reporting\n2.8 Operation of\nequipment\n2.9 Codes and\nRegulations on\nenvironmental\nprotection\n2.10 Safety and\nkeeping of\nequipment every\nafter use\n2.11 Safety\nmeasures\n2.7 Following\nsafety\nprocedures\n3. Perform\npreventive\nmaintenance\n3.1 Tools and\nequipment are\ncleaned\nimmediately after\nuse in line with\nfarm procedures.\n3.2 Routine check-up\nand maintenance\nare performed.\n3.3 Tools and\nequipment are\nstored in\ndesignated areas\nin line with farm\nprocedures.\n3.1 Cleaning\nprocedures of\ntools and\nequipment\n3.2 Maintenance\nprocedures of\nfarm equipment\n3.3 Storage of tools\nand equipment\n3.4 Designated\nstorage areas\n3.1 Cleaning tools\nand equipment\n3.2 Performing\nroutinely check-\nup of tools and\nequipment\n3.3 Maintaining\nfarm equipment\n3.4 Storing tools\nand equipment\n\n--- PDF PAGE 46 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 42\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\nMay include:\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Farm tools\nMay include:\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5 Measuring tools\n2.6 Garden tools\n3. Pre-operation check-up\nMay include:\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate farm tools and equipment\n1.2 Operated farm equipment according to manual\nspecification\n1.3 Performed preventive maintenance\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Service/operational manual of farm tools and equipment\n2.2 Tools and equipment\n2.3 Farm implements\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Practical demonstration\n3.3 Third Party Report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 47 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 43\n\nUNIT OF COMPETENCY\n:\nPERFORM ESTIMATION AND BASIC\nCALCULATION\n\nUNIT CODE\n:"
