llowing\nmanufacture’s\nspecifications and\nmanuals\n1.17 Preparation of farm\ninputs\n1.18 Proper waste\ndisposal\n\n2. Prepare\naquaculture\nfacilities\n2.1 Aquaculture\nfacilities are\ninspected following\nindustry standards.\n2.2 Biosecurity measures\nare applied against\nextraneous\norganisms following\nindustry standards.\n2.3 Ponds are prepared\nin accordance to\nindustry standards.\n2.4 Tanks are disinfected\nfollowing standard\nprocedures.\n2.5 Cage set up is\nmaintained according\nto industry\nprocedures.\n2.6 Water need is\nassessed following\nindustry procedure.\n2.7 Water exchange\nmethod is applied\nbased on industry\nstandards.\n2.8 Land is prepared\nfollowing industry\nstandards.\n2.1 Aquaculture\nfacilities\n-- water holding\ncapacities\n--optimum PH of\nsoil and water\n--presence of\nextraneous\norganisms\n--organic content of\nsoil\n2.2 Cage set up\n2.3 Depth of pond\n2.4 Computation of\npond inputs\n2.5 Soil analysis\n2.6 Water analysis\n2.7 Application of lime\nand fertilizer\n2.8 Application\npiscicide\n2.9 Pond draining and\ndrying\n2.10 Installation of filter\nscreens and bird\nscares\n2.11 Repair of leaks\n2.12 Tanks\ndisinfections\n2.13 Cage set up\ninspection and\nmaintenance\n2.14 Land preparation\n2.15 GAqP,\n2.16 OSHS\n2.1 Inspecting\naquaculture\nfacilities\n2.2 Applying\nbiosecurity\nmeasures\n2.3 Preparing ponds\n2.4 Disinfecting tanks\n2.5 Maintaining cage\nset-up\n2.6 Assessing water\nneed\n2.7 Preparing land\n2.8 Practicing OSHS\n2.9 Applying GAqP\n\n--- PDF PAGE 52 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 48\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.17 Waste\nmanagement\n\n3. Secure facilities\n3.1 Facilities are checked\nfor trespassers\naccording to\n3.2 Trespassers are\nprevented to enter\nthe aquaculture\nfacilities according to\nstandard operating\nprocedures.\n3.3 Support structures\nare installed during\ninclement weather\ncondition following\nstandard procedures\n3.4 Tools, equipment and\nfarm inputs are\nstored based on\nworkplace standard\nprocedures.\n3.1 Support structures\n3.2 Weather forecast\n3.3 Types of tools and\nequipment\n3.4 Storage of tools and\nequipment\n3.5 Checking of\nentrance and exit\npoints\n3.6 Installation of\nsupport structures\n3.7 GAqP,\n3.8 OSHS\n3.9 Waste management\n\n3.1 Checking facilities\n3.2 Preventing\ntrespassers\n3.3 Installing support\nstructures\n3.4 Storing tools,\nequipment and farm\ninputs\n3.5 Applying safety\nmeasures\n3.6 Practicing GAqP\n3.7 Applying waste\nmanagement\n4. Install fish cages\n4.1 Construction\nresources including\nmaterials and\nmanpower are\nprepared based on\nwork plan.\n4.2 Posts are positioned\nfor fixed cages\nfollowing plan.\n4.3 Frames are attached\nto floaters for floating\ncages according to\nplan.\n4.4 Net cages are\nfabricated according\nto plan and\nrequirement.\n4.5 Fabricated net cages\nare attached to\nfloaters and sinkers\nbased on the plan.\n4.6 Nets are inspected for\ndamage and repaired\naccording to\nworkplace\nprocedures.\n4.6 Nets are set-up to fit\nthe frame following\ninstallation\nprocedures.\n4.1 Carrying capacity of\ncages\n4.2 Water flow rate\n4.3 Computation of\nrequired number of\nstocks\n4.4 Estimation raw\nmaterials and\nmanpower\nrequirements for\nconstruction\n4.5 Types of cages\n -Fixed cages\n -Floating cages\n4.6 Positioning of posts\n4.7 Attaching of frames\nto floaters\n4.8 Net fabrication\n4.9 Attaching of\nfabricated net to\nfloaters and sinkers\n4.10 Net inspection for\ndamages and repair\n4.11 Net setting to fit\nframe\n4.5 Required length of\nmooring lines and\nweight of mooring\nblocks\n4.6 Disposal of wastes\n4.1 Preparing\nconstruction\nmaterials and\nmanpower\nrequirements\n4.2 Estimating flow rate\nof surface water\n4.3 Positioning post for\nfixed cages\n4.4 Attaching frames to\nfloaters for floating\ncages\n4.5 Net fabricating\n4.6 Attaching\nfabrica