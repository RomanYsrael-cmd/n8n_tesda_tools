:\n6.1 Dikes\n6.2 Frames\n6.3 Water Supply and Drainage system\n6.4 Ponds\n6.5 Tanks\n6.6 Cage set - up\n6.6.1 Cage frames\n6.6.2 Net cages\n6.6.3 Floats\n6.6.4 Mooring lines\n6.6.5 Mooring blocks or anchors\n6.7 Oxygen tank with regulator\n6.8 Water Gates and pipes\n6.9 Store room\n6.10 Waste management facilities\n7. Extraneous organisms\nExtraneous organisms may include:\n7.1 Birds\n7.2 Frogs\n7.3 Man\n7.4 Snapping Turtles\n7.5 Snakes\n7.6 Predatory fish\n7.7 Monitor lizard\n7.8 Rats\n8. Pond preparation\nPond preparation may include:\n8.1 Liming\n8.2 Fertilization\n8.3 Tilling\n8.4 Drying\n8.5 Pest eradication\n9. Water assessment\nWater assessment includes:\n9.1 Quantity of water level\n9.2 Quality of water\n10. Method of water\nexchange\nMethod of water exchange may include:\n10.1 Flow-through\n10.2 Drain and fill\n11. Land preparation\nLand preparation includes:\n11.1 Draining\n11.2 Leveling\n11.3 Drying\n\n--- PDF PAGE 56 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 52\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared tools, materials and equipment\n1.2. Prepared aquaculture facilities\n1.3. Secured facilities\n1.4. Installed fish cages\n1.5 Practiced safety measures\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, supplies, materials and equipment needed to\nperform the required tasks\n2.3 References and manuals\n2.4 PPEs\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration/direct observation with oral\nquestioning\n3.2 Written exam\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 57 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 53\n\nUNIT OF COMPETENCY :\nOPERATE TILAPIA HATCHERY AND NURSERY\n\nUNIT CODE\n\n:"
