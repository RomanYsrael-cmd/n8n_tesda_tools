        "source_text": "--- PDF PAGE 11 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     7 \n \n \nUNIT OF COMPETENCY \n: \nWORK IN TEAM ENVIRONMENT \n \n \n \nUNIT CODE \n: \n400311211 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes \nto identify one’s roles and responsibilities as a \nmember of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Describe team \nrole and scope \n1.1  The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation. \n1.2  Team \nparameters, \nreporting \nrelationships and \nresponsibilities \nare identified from \nteam discussions \nand appropriate \nexternal sources. \n1.1  Group structure \n1.2  Group \ndevelopment \n1.3  Sources of \ninformation \n1.1Communicating \nwith others, \nappropriately \nconsistent with \nthe culture of \nthe workplace \n1.2  Developing \nways in \nimproving work \nstructure and  \nperforming \nrespective roles \nin the group or \norganization \n2.  Identify one’s \nrole and \nresponsibility \nwithin a team \n2.1  Individual roles \nand \nresponsibilities \nwithin the team \nenvironment are \nidentified. \n2.2  Roles and \nobjectives of the \nteam is identified \nfrom available \nsources of \ninformation. \n2.3  Team \nparameters, \nreporting \nrelationships and \nresponsibilities \nare identified \nbased on team \ndiscussions and \nappropriate \nexternal sources. \n2.1  Team roles and \nobjectives  \n2.2  Team structure \nand parameters \n2.3  Team \ndevelopment \n2.4  Sources of \ninformation \n2.1 Communicating \nwith others, \nappropriately \nconsistent with \nthe culture of \nthe workplace \n2.2  Developing \nways in \nimproving work \nstructure and \nperforming \nrespective roles \nin the group or \norganization\n\n--- PDF PAGE 12 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     8 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.  Work as a team \nmember \n3.1  Effective and \nappropriate forms \nof \ncommunications \nare used and \ninteractions \nundertaken with \nteam members \nbased on \ncompany \npractices. \n3.2  Effective and \nappropriate \ncontributions \nmade to \ncomplement team \nactivities and \nobjectives, based \non workplace \ncontext. \n3.3  Protocols in \nreporting are \nobserved based \non standard \ncompany \npractices. \n3.4  Contribute to the \ndevelopment of \nteam work plans \nbased on an \nunderstanding of \nteam’s role and \nobjectives. \n3.1  Communication \nProcess \n3.2  Workplace \ncommunication \nprotocol \n3.3  Team planning \nand decision \nmaking \n3.4  Team thinking \n3.5  Team roles \n3.6  Process of team \ndevelopment \n3.7  Workplace \ncontext \n3.1Communicating \nappropriately, \nconsistent with \nthe culture of \nthe workplace \n3.2  Interacting \neffectively with \nothers \n3.3  Deciding as an \nindividual and \nas a group \nusing group \nthink strategies \nand techniques \n3.4  Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 13 ---\nTR - Aquaculture (Tilapia Culture) NC II      Revision 00           (06/09/2020)                                     9 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Role and objective of \nteam \nMay include: \n1.1   Work activities in a team environment with \nenterprise or specific sector \n1.2   Limited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a \nteam environment \n2.  Sources of information \nMay include: \n2.1   Standard operating and/or other workplace \nprocedures \n2.2   Job procedures \n2.3   Machine/equipment manufacturer’s specifications \nand instructions \n2.4   Organizational 