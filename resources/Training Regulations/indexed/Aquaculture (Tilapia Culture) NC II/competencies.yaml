5\nRecommendation\ns are made on\nareas of possible\nimprovement.\n2.3 Reporting\nrequirements to\na range of\naudiences\n\n2.4 Legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\nvalues, ethics\nand codes of\nconduct\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to\na range of\naudiences\n2.4 Stating\nlegislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n2.5 Stating\norganisational\nvalues, ethics\nand codes of\nconduct\n3. Record and\npresent\ninformation\n3.1 Studied data/\ninformation are\nrecorded.\n3.2 Recommendations\nare analysed for\naction to ensure\nthey are\ncompatible with\nthe project’s scope\nand terms of\nreference.\n3.3 Interim and final\nreports are\nanalysed and\noutcomes are\ncompared to the\ncriteria\nestablished at the\noutset.\n3.4 Findings are\npresented to\nstakeholders.\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to\na range of\naudiences\n3.3 Legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n3.4 Organizational\nvalues, ethics\nand codes of\nconduct\n3.1 Describing\ndata analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to\na range of\naudiences\n3.3 Stating\nlegislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n3.4 Stating\norganizational\nvalues, ethics\nand codes of\nconduct\npractices\n\n--- PDF PAGE 28 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 24\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Data analysis techniques\nMay include:\n1.1 Domain analysis\n1.2 Content analysis\n1.3 Comparison technique\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied data/information\n\nThese aspects may be best assessed using a range of\nscenarios what ifs as a stimulus with a walk throu