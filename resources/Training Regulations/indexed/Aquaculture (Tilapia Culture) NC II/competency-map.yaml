  "source_text": "Section 1\nAQUACULTURE (TILAPIA CULTURE) NC II QUALIFICATION\n\nThe AQUACULTURE (TILAPIA CULTURE) NC II Qualification consists of\ncompetencies that a person must achieve to assist in tilapia culture operations,\nprepare and maintain tilapia culture facilities, operate tilapia hatchery and nursery, and\nperform tilapia grow-out operations.\n\nThis Qualification is packaged from the competency map of the Agriculture,\nForestry and Fishery Sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCode\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCode\nCOMMON COMPETENCIES\nAFF321201\nApply safety measures in farm operations\nAFF321202\nUse farm tools and equipment\nAFF321203\nPerform estimation and basic calculation\n\nCode\nCORE COMPETENCIES\nAFF622318\nConduct pre-operational aquaculture activities\nAFF622319\nOperate tilapia hatchery and nursery\nAFF622320\nPerform tilapia grow-out\n\nA person who has achieved this Qualification is competent to be:\n\n•\nTilapia Farm Technician\n•\nTilapia Culturist\n•\nTilapia Grower\n\n--- PDF PAGE 6 ---\nTR - Aquaculture (Tilapia Culture) NC II Revision 00 (06/09/2020) 2"
