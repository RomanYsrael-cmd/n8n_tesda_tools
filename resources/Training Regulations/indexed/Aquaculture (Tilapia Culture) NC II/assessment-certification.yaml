  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals\nwho were assessed as competent in a single unit or cluster of related units\nof competency.\n\nCOC 1: PERFORM TILAPIA HATCHERY AND NURSERY OPERATION\n• Conduct pre-operational aquaculture activities\n• Operate tilapia hatchery and nursery\n\nCOC 2: PERFORM TILAPIA GROW-OUT OPERATION\n• Conduct pre-operational aquaculture activities\n• Perform tilapia grow-out\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the\ncorresponding National Certificate for the Qualification.\n\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the relevant unit/s of competency.\n\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through a\nrecognition/assessment process.\n\n--- PDF PAGE 115 ---\nTR - Aquaculture (Tilapia Culture ) NCII Revision 00 Promulgated (06/09/2020) 114\n\n4.1.7 A candidate who fails the assessment for two (2) consecutive times shall be\nadvised to go through a refresher course before taking another assessment.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to assess\nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 116 ---\nTR - Aquaculture (Tilapia Culture) NCII Revision 00 Promulgated (06/09//2020) 116\n\nANNEX A\n\nReceive and respond to\nwor