  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in PROCESS INSPECTION NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n\n:\n500311109\n\n UNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to lead in the dissemination and\n\ndiscussion of ideas, information and issues in the\n\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1 Appropriate communication method is selected\n1.2 Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when\nrequired\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided\nimmediately\n2.3 Constructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4 Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 7 ---\nTR Process Inspection NC III\nPromulgated\n- 3 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3 Face to face\n1.4 Two-way radio\n1.5 Speaking to groups\n1.6 Using telephone\n1.7 Written\n1.8\nInternet\n\n--- PDF PAGE 8 ---\nTR Process Inspection NC III\nPromulgated\n- 4 -\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one\ntime\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning\nskills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of\nwritten and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 9 ---\nTR Process Inspection NC III\nPromulgated\n- 5 -\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes to\n\n lead small teams including setting and maintaining\n\n team and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to\nteam members\n1.2\nReasons for instructions and requirements are\ncommunicated to team members\n1.3\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude required\nto properly undertake the assigned task and\naccording to company policy\n2.2\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on\nclient needs and according to assignment\nrequirements\n3.2\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer policy\n4.4\nTeam members are kept informed of any changes in\nthe priority allocated to assignments or tasks which\nmight impact on client/customer needs and\nsatisfaction\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6\nFollow-up communication is provided on all issues\naffecting the team\n4.7\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 10 ---\nTR Process Inspection NC III\nPromulgated\n- 6 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s concerns\n2.1\nRoster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 11 ---\nTR Process Inspection NC III\nPromulgated\n- 7 -\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2\nAssessed and monitored team and individual performance\nagainst set criteria\n1.3\nRepresented concerns of a team and individual to next level\nof management or appropriate specialist and to negotiate on\ntheir behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5\nSet and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nknowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 12 ---\nTR Process Inspection NC III\nPromulgated\n- 8 -\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome and\nparticipate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is identified\nand included in the plan\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the plan\nInformation on active listening is identified and included\nin the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-to-\ndate\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by all\nparties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the negotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and agreed\nupon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 13 ---\nTR Process Inspection NC III\nPromulgated\n- 9 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 14 ---\nTR Process Inspection NC III\nPromulgated\n- 10 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to achieve\nan agreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies procedures\n2.4 Problem solving strategies on how to deal with unexpected\nquestions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.4 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation process\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or in a\nsimulated workplace setting.\n\n--- PDF PAGE 15 ---\nTR Process Inspection NC III\nPromulgated\n- 11 -\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills and\nattitudes required to solve problems in the workplace including\nthe application of problem solving techniques and to determine\nand resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nIdentify the problem\n1.1\nVariances are identified from normal operating\nparameters; and product quality\n1.2\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental causes\nof the problem\n2.1\nPossible causes are identified based on experience\nand the use of problem solving tools / analytical\ntechniques.\n2.2\nPossible cause statements are developed based on\nfindings\n2.3\nFundamental causes are identified per results of\ninvestigation conducted\n3.\nDetermine corrective\naction\n3.1\nAll possible options are considered for resolution of\nthe problem\n3.2\nStrengths and weaknesses of possible options are\nconsidered\n3.3\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures\n4.\nProvide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations are prepared\n4.2\nRecommendations are presented to appropriate\npersonnel.\n4.3\nRecommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\nTR Process Inspection NC III\nPromulgated\n- 12 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 17 ---\nTR Process Inspection NC III\nPromulgated\n- 13 -\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios\n/ case studies / what ifs as a stimulus with a walk through forming\npart of the response. These assessment activities should include\na range of problems, including new, unusual and improbable\nsituations that may have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-standard\nsituations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1\nRelevant equipment and operational processes\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4\nPrinciples of decision making strategies and\ntechniques\n2.2.5\nEnterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n\n--- PDF PAGE 18 ---\nTR Process Inspection NC III\nPromulgated\n- 14 -\n\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs will\nbe required as well as bank of questions which will be\nused to probe the reason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 19 ---\nTR Process Inspection NC III\nPromulgated\n- 15 -\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in the\napplication of mathematical concepts and techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given condition\n1.2 Mathematical techniques are selected based on the\ngiven problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the level\nof accuracy required for the problem\n2.3 Results of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected\nand required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 20 ---\nTR Process Inspection NC III\nPromulgated\n- 16 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\n--- PDF PAGE 21 ---\nTR Process Inspection NC III\nPromulgated\n- 17 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nskills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 22 ---\nTR Process Inspection NC III\nPromulgated\n- 18 -\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and attitude\nrequired in selecting, sourcing and applying appropriate and\naffordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on\njob requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced as\nper established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance with\nthe industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to ensure\nits operative ability\n3.2 Updating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3 Technology failure/ defect is immediately reported to the\nconcern/responsible person or section for appropriate\naction\n\n--- PDF PAGE 23 ---\nTR Process Inspection NC III\nPromulgated\n- 19 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific technology/\nequipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 24 ---\nTR Process Inspection NC III\nPromulgated\n- 20 -\n EVIDENCE GUIDE\n\n2 1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent with\nwork requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nskills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of training/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 25 ---\nTR Process Inspection NC III\nPromulgated\n- 21 -\n\nCOMMON COMPETENCIES\n(AUTOMOTIVE MANUFACTURING-PARTS MANUFACTURING)\n\nUNIT TITLE:\nREAD, INTERPRET AND APPLY ENGINEERING DRAWINGS.\n\nUNIT CODE:\nALT742201\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying specification\nfrom engineering blue prints or drawings that provides the\nmeasurements of the product and pattern that is to be produced.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\ndrawings/\nspecification\n\n1.1 Appropriate engineering drawings are identified and accessed as\nper job requirements.\n1.2 Version and date of drawing is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret drawings\n\n2.1 Relevant dimensions and sections of the drawings/ specifications\nare located in relation to the work to be conducted\n2.2 Information in the manual are interpreted in accordance to industry\npractices\n\n3 Apply information\nin the drawings &\nspecifications\n\n3.1 Engineering drawing is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with the\nspecifications in the drawings.\n3.3 Dimensional data and shape are applied according to the given task\n\n4. Store drawings\n\n4.1 The drawings and specification are stored properly to ensure\nprevention of damage, ready access and updating of information\nwhen required in accordance with company requirements\n\n--- PDF PAGE 26 ---\nTR Process Inspection NC III\nPromulgated\n- 22 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engineering drawings\nKinds of drawings:\n1.1 Casting drawing\n1.2 Machining drawing\n1.3 Project plan\n1.4 Technical drawing\n2. Data\nData includes but not limited to\n2.1 Material specifications\n2.2 Process specifications\n2.3 Special instructions\n2.4 Machining locating points\n2.5 Clamping points\n2.6 Amount of draft\n2.7 Surface finish\n\n--- PDF PAGE 27 ---\nTR Process Inspection NC III\nPromulgated\n- 23 -\n\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed drawings/specification\n1.2 Interpreted drawings\n1.3 Applied information in drawings\n1.4 Stored drawings\n\n1. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of drawings used in automotive manufacturing industry\n2.2 Identification of symbols used in the drawings\n2.3 Identification of units of measurements\n2.4 Unit conversion\n2.5 Attention to details, Perseverance, Honesty\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and\ninterpret engineering drawings and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All drawings/engineering specifications relative to automotive\nmanufacturing\n4.2 Job order, requisitions\n4.3 Product sample\n\n5 Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 28 ---\nTR Process Inspection NC III\nPromulgated\n- 24 -\nUNIT OF COMPETENCY:\n PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE:\n\nALT311202\n\nUNIT DESCRIPTOR:\nThis unit includes identifying, caring for, handling, using and\nmaintaining measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to job\nrequirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed using\nthe four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed numbers\nare used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 29 ---\nTR Process Inspection NC III\nPromulgated\n- 25 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Straight Edge\n1.6 Thickness gauge\n\n1.7 Try square\n1.8 Protractor\n1.9 Height gauge\n1.10 Steel rule\n1.11 Shrink rule\n\n2. Calculation\n\nKinds of part mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2.10 Out of roundness\n2.11 Shrinkage allowance\n\n--- PDF PAGE 30 ---\nTR Process Inspection NC III\nPromulgated\n- 26 -\n\nEVIDENCE GUIDE\n\n1. Critical aspect\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric figures\n\n3. Underpinning\n skills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.1 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 31 ---\nTR Process Inspection NC III\nPromulgated\n- 27 -\n\nUNIT TITLE:\nREAD, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE:\nALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and periodic\nmaintenance manual\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3 Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 32 ---\nTR Process Inspection NC III\nPromulgated\n- 28 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manuals\n\nKinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 33 ---\nTR Process Inspection NC III\nPromulgated\n- 29 -\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and interpret\nautomotive manuals and specifications\n3.2. Accessing information and data\n\n4 Resource\nImplications\n\nThe following resources must be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 34 ---\nTR Process Inspection NC III\nPromulgated\n- 30 -\n\nUNIT OF COMPETENCY\n: PERFORM SHOP MAINTENANCE\n\nUNIT CODE\n\n: ALT723205\n\nUNIT DESCRIPTOR\n: This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and checking of\ntools/ equipment and disposal of used supplies/materials are also\nincorporated in this competency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools\ncleaning requirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools and\nshop equipment\n\n2.1 Tools/equipment are checked and stored in their\nrespective shelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per\nworkshop SOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 35 ---\nTR Process Inspection NC III\nPromulgated\n- 31 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health and Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 36 ---\nTR Process Inspection NC III\nPromulgated\n- 32 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 37 ---\nTR Process Inspection NC III\nPromulgated\n- 33 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY QUALITY SYSTEMS\n\nUNIT CODE\n\n:\nALT315308\n\nUNIT DESCRIPTOR\n:\nThis unit covers working within a quality improvement\nsystem, either individually or in a team situation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Work within a quality\n system\n\n1.1 Instructions and procedures are followed and duties\nare performed in accordance with requirements of\nquality improvement system.\n1.2 Conformance to specifications is ensured.\n1.3 Defects are detected and reported according to\nstandard operating procedures.\n1.4 Performance of operation or quality of product or\nservice is monitored to ensure customer satisfaction.\n\n2. Engage in quality\n improvement\n\n2.1 Current performance is assessed.\n2.2 Established performance measures are identified.\n2.3 Specifications and standard operating procedures are\nidentified.\n2.4 Defects are detected and reported according to\nstandard operating procedures.\n2.5 Process improvement procedures are participated in.\n2.6 The improvement of internal/external customer/supplier\nrelationships is participated in.\n2.7 Performance of operation or quality of product or\nservice is monitored to ensure customer satisfaction.\n\n--- PDF PAGE 38 ---\nTR Process Inspection NC III\nPromulgated\n- 34 -\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Quality\nimprovement\nsystem\n\nA system comprising some or all of the following elements:\n1.1 Quality assurance\n1.2 Quality control\n1.3 Quality inspection\n1.4 Quality improvement\n1.5 Total quality control\n\n2. Customer\n\nThe next person or organization receiving the production or\nservice\n\n--- PDF PAGE 39 ---\nTR Process Inspection NC III\nPromulgated\n- 35 -\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Worked within a quality system which include planning to meet\ncustomers’ requirements, checking procedures to ensure\ncustomer requirements are met; and inspecting and testing\nproducts and services\n2. Underpinning\nknowledge and\nattitudes\n2.1 Quality system terminology and concepts e.g. quality assurance\n– planning to meet customers’ requirements\n2.2 Quality control – checks and Quality inspection – inspecting and\ntesting products and services\n2.3 Total quality control\n2.4 Commonly accepted meaning/s of the terms quality and quality\nsystem\n2.5 Reasons for following the requirements of the quality\nimprovement system\n2.2 Strategies and approaches for working within a quality\nsystem\n2.6 Procedures to be followed in undertaking the work\n2.7 Specifications to which the individual's work is to comply\n2.8 Reasons for ensuring work conforms to specification\n2.9 Benefits of good quality:\n2.10 Costs and consequences of poor quality\n2.11 Procedures for reporting defects\n2.12 Examples of common defects\n2.13 Quality improvement procedures\n2.14 Four steps of the quality cycle: plan, do, check, act\n2.15 Reasons for following process improvement procedures\n2.16 Examples of ways in which customer/supplier relationships\ncan be improved\n2.17 Benefits of good customer/supplier relationship\n2.18 Hazards and control measures associated with applying\nquality procedures, including housekeeping\n2.19\nSafe work practices and procedures\n3. Underpinning\nskills\n3.1 Reading, interpreting and following information on written job\nsheets, instructions, standard operating procedures and\ndrawings\n3.2 Checking and clarifying task-related information\n3.3 Entering information into workplace documents\n3.4 Checking for conformance to specifications\n3.5 Identifying duties of the individual within the quality improvement\nsystem\n3.6 Identifying customers' requirements with respect to the operation\nor quality of the product or service\n3.7 Reporting where appropriate, defects detected\n3.8 Carrying out work in accordance with the process improvement\nprocedures\n3.9 Carrying out work in a manner consistent with the improvement\nof customer/supplier relationships\n3.10 Performing numerical operations, geometry and calculations/\nformulae within the scope of this unit\n\n--- PDF PAGE 40 ---\nTR Process Inspection NC III\nPromulgated\n- 36 -\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Real or simulated\n4.2 Access to all tools, equipment, materials and documentation\nrequired.\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1 Competency must be assessed on-the-job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience\n\n--- PDF PAGE 41 ---\nTR Process Inspection NC III\nPromulgated\n- 37 -\n\nUNIT OF COMPETENCY: CONDUCT PRODUCT AND/OR PROCESS CAPABILITY\nSTUDIES\n\nUNIT CODE\n\n: ALT315309\n\nUNIT DESCRIPTOR\n: This unit covers conducting process capability studies,\nsetting control limits and selecting sampling plans.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Conduct process\ncapability studies\n\n1.1 Procedure for conducting capability study is determined.\n1.2 Instructions for personnel conducting trial run are prepared.\n1.3 Data from trial run is analyzed and the process capability is\ncalculated.\n1.4 Possible number of product defects from a particular\nprocess is estimated.\n1.5 Optimum target mean to suit process capability data is\ndetermined.\n1.6 Reports listing of various options from process capability\nstudies are prepared.\n1.7 Design specifications based on an analysis of data are\nrecommended.\n\n2. Set control limits\n\n2.1 Control limits for sample/subgroup average, range and\nstandard deviation are calculated.\n2.2 Warning limits for subgroup average, range and standard\ndeviation are calculated.\n2.3 Course of action resulting from out of control situation is\ndetermined and documented according to standard\noperating procedures.\n\n3. Select sampling\nplans\n\n3.1 Appropriate sampling plan to suit production schedule is\nselected and acceptable quality limits are determined, taking\ninto account specified producer and consumer risks.\n3.2 Sampling plan is documented including implementation\nstrategy.\n\n--- PDF PAGE 42 ---\nTR Process Inspection NC III\nPromulgated\n- 38 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Procedure\n\n1.1 Frequency of sample\n1.2 sample size\n1.3 Data From periodic samples drawn from a trial run of\nthe process\n\n2. Process capability\n\nThe natural tolerance of the process which may be\ncalculated at 3 sigma/standard deviations\n\n3. Product defects\nFrom a consideration of 3 or 6 sigma standard deviations\ncompared to specification requirements etc.\n\n4. Various options\n\n4.1 Adjustment of process to move average\n4.2 Improvements to reduce process capability\n4.3 Changes to reduce assignable causes\n\n5. Appropriate sampling\nplan\nPlans within the\n5.1 Adopted quality system\n5.2 Sample size\n5.3 Frequency of sample\n\n--- PDF PAGE 43 ---\nTR Process Inspection NC III\nPromulgated\n- 39 -\n EVIDENCE GUIDE\n1. Critical aspect\nof competency\nAssessment requires evidence that the candidate\n1.1 Conducted process capability studies\n1.2 Had set control limits\n1.3 Selected sampling plans\n2. Underpinning\nknowledge and\nattitudes\n2.1 Process to be studied\n2.2 Procedures for conducting process capability studies\n2.3 Data used to calculate the process capability\n2.4 Procedures for estimating the possible number of product\ndefects\n2.5 Options for improving the process and benefits of each\n2.6 Procedures for determining the optimum target mean\n2.7 Procedures for setting control limits\n2.8 Numerical operations and calculations/formulae for\n process capability, control limits and other outcomes within the\nscope of this unit\n2.9 Procedures for setting warning limits\n2.10 Concept of ‘out of control’ situations\n2.11 Action to be taken when an ‘out of control’ situation is detected\n2.12 Procedures for documenting ‘out of control’ situations\n2.13 Acceptable level of quality\n2.14 A variety of sampling plans and their application\n2.15 Sampling plan to be applied to a given situation\n2.16 Reasons for selecting the chosen plan\n2.17 Acceptable quality limits\n2.18 Risks associated with identifying acceptable quality limits for\nthe producer and customer\n2.19 Procedures for documenting and implementing sampling plans\n2.20 Hazards and control measures\n2.21 Use and application of personal protective equipment\n2.21 Safe work practices and procedures\n3. Underpinning\nskills\n3.1 Collecting and collating data\n3.2 Analyzing data, identifying solutions and developing\nrecommendations\n3.3 Preparing reports listing the various options identified from the\nprocess capability study\n3.4 Determining process design specifications from process\ncapability data\n3.5 Documenting sampling plan and implementation strategy\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace area: Real or simulated\n4.2 Access to all tools, equipment, materials and documentation\nrequired.\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n--- PDF PAGE 44 ---\nTR Process Inspection NC III\nPromulgated\n- 40 -\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 45 ---\nTR Process Inspection NC III\nPromulgated\n- 41 -\n\nUNIT OF COMPETENCY :\nMAINTAIN / SUPERVISE THE APPLICATION OF\n QUALITY PROCEDURES\n\nUNIT CODE\n\n:\nALT315310\n\nUNIT DESCRIPTOR\n:\nThis unit covers improving the quality system, and\ncollecting and summarizing data to support the quality\nimprovement process. The data would be used to produce\nstatistical information such as averages and ranges, and\ncharts such as tally, run or control charts.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Improve quality\nsystem\n\n1.1 Specifications to meet customer needs (internal and external)\nare interpreted.\n1.2 Leadership role as a supplier is undertaken to ensure quality\nwithin the supply chain.\n\n2. Collect and\nsummarize data\n\n2.1 Data is recorded and interpreted accurately in accordance with\nstandard operating procedures.\n2.2 Data is used to produce relevant statistical information, for\nexample, average and range or the production of charts such as\ntally, run or control charts.\n\n--- PDF PAGE 46 ---\nTR Process Inspection NC III\nPromulgated\n- 42 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Customer needs\n\n1.1 Product\n1.2 Service\n1.3 Delivery and distribution\n1.4 Quality\n1.5 Quantity\n1.6 Price\n1.7 Communication and documentation\n\n--- PDF PAGE 47 ---\nTR Process Inspection NC III\nPromulgated\n- 43 -\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Maintained/Supervised the application of quality procedures\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Specifications to be achieved in providing the service or\nproducing the product\n2.2 Team's supplier(s) and customer(s)\n2.3 Possible effects of supplying products and/or services to\ncustomers that do not comply with specifications\n2.4 Procedures to be followed in producing the product and/or\nsupplying the service\n2.5 Checks to be undertaken to ensure the product / service\ncomplies with specifications\n2.6 Personnel responsible for the quality of the product / service\nprovided\n2.7 Actions to be taken when a non-conformance to specifications\nis detected and reasons for taking those actions\n2.8 Procedures for recording data collected\n2.9 Possible trends from the collected data\n2.10 Actual trends indicated by given samples of data\n2.11 Reasons for collecting data\n2.12 Statistical information to be calculated\n2.13 Use of statistics in interpreting production data\n2.14 Functions of tally, run or control charts in representing\nproduction data\n2.15 Trends indicated by the statistical information calculated\nand/or the charts produced\n2.16 Action to be taken in response to any trends identified\n2.17 Reasons for taking proposed action\n2.18 Appropriate techniques, tools and equipment to measure\nmachined components\n2.19 Hazards and control measures within the scope of this unit\n2.20 Use and application of personal protective equipment\n2.21\nSafe work practices and procedures\n3. Underpinning skills\n3.1 Obtaining and interpreting the specifications of the product or\nservice to be provided\n3.2 Communicating effectively with suppliers and customers\n3.3 Recording data collected\n3.4 Calculating relevant statistical information from collected data\n3.5 Producing tally, run and control charts from collected data\n3.6 Using leadership skills\n3.7Using analysis skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.4 Workplace area: Real or simulated\n4.5 Access to all tools, equipment, materials and documentation\nrequired.\n4.6 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials\n\n--- PDF PAGE 48 ---\nTR Process Inspection NC III\nPromulgated\n- 44 -\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1 Competency must be assessed on-the-job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 49 ---\nTR Process Inspection NC III\nPromulgated\n- 45 -"
}
