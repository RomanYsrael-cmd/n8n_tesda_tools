  "source_section_text": "Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director General.\n\n4.2\nThe qualification of PROCESS INSPECTION NC III may be attained through.\n\n4.2.1 Demonstration of competence through project-type assessment covering all\nrequired units of competency of the qualification.\n\nPERFORM PROCESS INSPECTION\n• Apply Quality Systems\n• Conduct Product and/or Process Capability Studies\n• Maintain/Supervise the Application of Quality Procedures\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Holder of Process Inspection NC II or equivalent qualification; or\n\n4.4.2 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.4.3 Experienced workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 56 ---\nTR Process Inspection NC III\nPromulgated\n- 52 -\n\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB-SECTOR\n(Parts Manufacturing)\nLegend:\nANNEX A\nPROCESS INSPECTION NC III\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nRead & Interpret\nEngineering Drawings\nPerform Mensuration\nand Calculation\nRead, Interpret and\nApply Specifications\nand Manuals\nPerform Shop\nMaintenance\n-\nCORE COMPETENCIES\nDevelop and\nManufacture Wood\nPattern\nDevelop and\nManufacture Polymer\nPattern\nDevelop and\nManufacture Assembled\nPlated Pattern\nDevelop and\nManufacture Production\nPattern\nPerform General\nWoodworking Machine\nOperations\nUse and Maintain\nMeasuring Instrument\nPrepare & Mix Sand for\nMetal Molding\nProduce Molds by Hand\nProduce Cores by Hand\nOperate Molding\nMachine\nOperate Core-Making\nMachine\nPour Molten Metal to\nMolds\nOperate Melting\nFurnaces (non-electric)\nOperate Cupola Melting\nFurnace\nOperate Electric\nInduction Melting\nFurnace\nFettle & Trim Metal\nCastings/Forgings\nPerform Refractory\nInstallation & Repair\nMelt Aluminum-\nSilicon Alloys for\nSafety Tested\nCastings\nMelt Metals Using\nCoreless Induction\nFurnace\nMelt Automotive Gray\nIron Castings in Cupola\nPrepare Sand Mixture\nfor Heavy Casting\nPour Molten Metal\nto Heavy Castings\n\nManufacture and\ndevelop corebox for\nShell Core Box\nDevelop and\nManufacture Gear,\nConveyor Screw and\nDevelop Gravity Die\nCasting Mold\nUse Comparison and Basic\nMeasuring Devices\nMeasure Components\nUsing Coordinate\nMeasuring Machines\nUse Graphical Techniques\nand Perform Simple\nStatistical Computations\nConduct Product\nand/or Process\nCapability Studies\nMaintain/Supervise the\nApplication of Quality\nProcedures\nPerform Mechanical\nPress Forming\nOperation\nChange\nEquipment Dies\nPerform Press Machine\nSetting\nMachine Parts\nPerform Precision\nAssembly\nPerform Mechanical\nShearing Operation\nApply Quality\nSystems\nPerform Hand Forging\nPerform Hammer Forging\nPerform Basic Incidental\nHeat/Quenching,\nTempering and\nAnnealing\nHammer Forge\nComplex Shapes\nPerform Drop and Upset\nForging\nSelect Heat\nTreatment Process\nPerform Heat\nTreatment Process\nHand Forge Complex\nShapes\nPerform Hand Molding\nto Produce Heavy\nCasting\nProduce Injection\nMolded Products\nProduce Blow\nMolded Products\nPrepare and Start\nEquipment for\nProduction\nSelect and Control\nInspection Processes\nand Procedures\nPerform Precision\nMechanical\nMeasurement\nCalibrate Measuring\nEquipment\nPerform Inspection\nPerform Engineering\nMeasurement\nPerform Basic\nStatistical Quality\nControl\nUse Improvement\nProcesses in Team\nActivities\nOperate injection\nMolding Equipment\nPrepare Materials for\nFormulae\n\nAssemble Materials and\nEquipment for\nProduction\nOperate Blow Molding\nEquipment\nPrepare Molds for\nComposites Production\nMonitor Process\nOperations\nFinish Products and\nComponents\n\n--- PDF PAGE 57 ---\nTR Process Inspection NC III\nPromulgated\n- 53 -\nDEFINITION OF TERMS\n\n1.\nBore gauge\nBore gauge is a measuring tool used for measuring the internal\ndiameter of a cylindrical tube.\n2.\nData\nData is the information collected about a product, service, process,\nperson or machine.\n3.\nDomain\nDomain is the set of possible values specified for a given\nmathematical function.\n4.\nFlashing\nFlashing is a defect where resin flow out to the parting line of the\nmold and adheres to the part of the product, especially commonly\nseen in old mold.\n5.\nFlowchart\nFlowchart is a pictorial summary of the flows and decisions that\ncomprise a process. It is used for defining and documenting the\nprocess.\n6.\nGantt chart\nGantt chart is a scheduling chart in which horizontal lines show\nthe actual and projected amounts of time involved in completing a\nparticular task or reaching specific levels of production it is is a bar\nchart that plots tasks and subtask against time.\n7.\nHistogram\nHistogram is a statistical graph of frequency distribution in which\nvertical rectangles of different heights are proportionate to\ncorresponding frequencies.\n8.\nIshikawa diagram\nIshikawa diagram is a tool used to organize the possible causes of\na problem, select the most probable cause, and verify the cause\nand effect relationship between the most probable cause and the\nproblem under study.\n9.\nJetting\nJetting or sometimes called flow marks is a defect that shows\nvisible marks of movement as the materials enter the mold.\n10. Mean\nMean is a numerical representation of the arithmetic average it is\nthe sum of the numerical values of the measurement divided by the\nnumber of items examined.\n11. Median\nMedian is the middle value when the data are arranged in\nascending order. When there are an even number of observations,\nthe median value is the arithmetic average of the middle two\nvalues.\n12. Mode\nMode of a distribution is the value that occurs most frequently, or\nthe value corresponding to the highest point on a frequency\npolygon or histogram.\n13. Pareto analysis\nPareto analysis is the tool of analysis using the concept that\nfocuses attention on the vital few against the trivial many.\n14. Process\nProcess is a collection of interacting components that transform\ninputs into outputs toward a common aim.\n15. Short shot\nShort shot is a defect that occurs when the resin cools and\nsolidifies before the material fills the mold completely.\n16. Shrinkage\nShrinkage is a defect that forms a cavity in a casting caused by\ninsufficient amount of metal during solidification\n\n--- PDF PAGE 58 ---\nTR Process Inspection NC III\nPromulgated\n- 54 -\n\n17. The range\nThe range is the simplest measure of dispersion; for raw data from\nan enumerative or an analytic study, it is defined as the difference\nbetween the largest data point and the smallest.\n18. Tolerance\nTolerance is the allowable variance from a nominal value\nestablished by design engineers that is deemed non harmful to the\nfunctioning of the product.\n\n--- PDF PAGE 59 ---\nTR Process Inspection NC III\nPromulgated\n- 55 -\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who rendered their time and expertise to the development and validation of this Training\nRegulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nPROCESS INSPECTION NC III\nAntonio A. Gimenez\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nRodolfo T. Nunez\nPlant Manager-Nissan Motors\nPhils. Inc.(NMPI)\nCATC/PAFI\nElmo N. Serbito\nPAFI (Samahan ng mga\nManggagawang Supercast)\n\nCarina J. Bondad\n(Administrative Staff)\nThe PARTICIPANTS in the National Validation of this Training Regulation\n• (Supercast Foundry &\nMachinery Corp.\nSFMC)\n\n• Philippine Aluminum Wheels\nInc. (PAWI)\n\n• Toyota Auto Parts Phils. Inc.\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
}
