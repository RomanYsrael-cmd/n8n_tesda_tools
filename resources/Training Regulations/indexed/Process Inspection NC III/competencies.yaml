skills\n3.7Using analysis skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.4 Workplace area: Real or simulated\n4.5 Access to all tools, equipment, materials and documentation\nrequired.\n4.6 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials\n\n--- PDF PAGE 48 ---\nTR Process Inspection NC III\nPromulgated\n- 44 -\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1 Competency must be assessed on-the-job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 49 ---\nTR Process Inspection NC III\nPromulgated\n- 45 -"
