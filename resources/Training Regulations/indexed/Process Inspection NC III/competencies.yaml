                "source_number": "2.2"
              },
              {
                "number": "2.2",
                "text": "Performance expectations are established based on client needs and according to assignment requirements",
                "source_number": "3.1"
              }
            ],
            "source_number": 2
          },
          {
            "number": 3,
            "title": "Set performance expectations for team members",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Performance expectations are based on individual team members duties and area of responsibility",
