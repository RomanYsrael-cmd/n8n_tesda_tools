          "source_text": "1. Work within a quality \n      system \n \n \n1.1 Instructions and procedures are followed and duties \nare performed in accordance with requirements of \nquality improvement system. \n1.2 Conformance to specifications is ensured. \n1.3 Defects are detected and reported according to \nstandard operating procedures. \n1.4 Performance of operation or quality of product or \nservice is monitored to ensure customer satisfaction. \n \n2. Engage in quality \n      improvement \n \n2.1 Current performance is assessed. \n2.2 Established performance measures are identified. \n2.3 Specifications and standard operating procedures are \nidentified. \n2.4 Defects are detected and reported according to \nstandard operating procedures. \n2.5 Process improvement procedures are participated in. \n2.6 The improvement of internal/external customer/supplier \nrelationships is participated in. \n2.7 Performance of operation or quality of product or \nservice is monitored to ensure customer satisfaction.\n\n--- PDF PAGE 38 ---\nTR Process Inspection NC III \nPromulgated \n- 34 - \n    RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Quality \nimprovement \nsystem  \n \n \nA system comprising some or all of the following elements: \n1.1 Quality assurance \n1.2 Quality control \n1.3 Quality inspection \n1.4 Quality improvement \n1.5 Total quality control \n \n2. Customer  \n \nThe next person or organization receiving the production or \nservice\n\n--- PDF PAGE 39 ---\nTR Process Inspection NC III \nPromulgated \n- 35 -"
        },
        "evidence_guide": {
          "source_text": "1.  Critical aspect of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Worked within a quality system which include planning to meet \ncustomers’ requirements, checking procedures to ensure \ncustomer requirements are met; and inspecting and testing \nproducts and services\n2. Underpinning \nknowledge and \nattitudes \n2.1 Quality system terminology and concepts e.g. quality assurance \n– planning to meet customers’ requirements \n2.2 Quality control – checks and Quality inspection – inspecting and \ntesting products and services \n2.3 Total quality control  \n2.4 Commonly accepted meaning/s of the terms quality and quality \nsystem \n2.5 Reasons for following the requirements of the quality \nimprovement system \n2.2  Strategies and approaches for working within a quality \nsystem \n2.6  Procedures to be followed in undertaking the work \n2.7  Specifications to which the individual's work is to comply \n2.8  Reasons for ensuring work conforms to specification \n2.9  Benefits of good quality: \n2.10 Costs and consequences of poor quality  \n2.11 Procedures for reporting defects \n2.12 Examples of common defects \n2.13 Quality improvement procedures \n2.14 Four steps of the quality cycle: plan, do, check, act \n2.15 Reasons for following process improvement procedures \n2.16 Examples of ways in which customer/supplier relationships \ncan be improved \n2.17 Benefits of good customer/supplier relationship \n2.18 Hazards and control measures associated with applying \nquality procedures, including housekeeping \n2.19\nSafe work practices and procedures\n3. Underpinning \nskills \n3.1  Reading, interpreting and following information on written job \nsheets, instructions, standard operating procedures and \ndrawings \n3.2  Checking and clarifying task-related information \n3.3  Entering information into workplace documents \n3.4  Checking for conformance to specifications \n3.5  Identifying duties of the individual within the quality improvement \nsystem \n3.6  Identifying customers' requirements with respect to the operation \nor quality of the product or service \n3.7  Reporting where appropriate, defects detected \n3.8  Carrying out work in accordance with the process improvement \nprocedures \n3.9  Carrying out work in a manner consistent with the improvement \nof customer/supplier relationships  \n3.10 Performing numerical operations, geometry and calculations/ \nformulae within the scope of this unit\n\n--- PDF PAGE 40 ---\nTR Process Inspection NC III \nPromulgated \n- 36 - \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1  Workplace area: Real or simulated  \n4.2  Access to all tools, equipment, materials and documentation \nrequired. \n4.3  Any relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference \nmaterials\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1  Observation with questioning \n5.2  Portfolio \n5.3  Third party report\n6. Context of \nassessment \n6.1 Competency must be assessed on-the-job or in a simulated \nenvironment. \n6.2   The assessment of practical skills must take place after a  \n        period of supervised practice and repetitive experience",
