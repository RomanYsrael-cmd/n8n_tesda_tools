        "source_text": "ALT315310\n\nUNIT DESCRIPTOR\n:\nThis unit covers improving the quality system, and\ncollecting and summarizing data to support the quality\nimprovement process. The data would be used to produce\nstatistical information such as averages and ranges, and\ncharts such as tally, run or control charts.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Improve quality\nsystem\n\n1.1 Specifications to meet customer needs (internal and external)\nare interpreted.\n1.2 Leadership role as a supplier is undertaken to ensure quality\nwithin the supply chain.\n\n2. Collect and\nsummarize data\n\n2.1 Data is recorded and interpreted accurately in accordance with\nstandard operating procedures.\n2.2 Data is used to produce relevant statistical information, for\nexample, average and range or the production of charts such as\ntally, run or control charts.\n\n--- PDF PAGE 46 ---\nTR Process Inspection NC III\nPromulgated\n- 42 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Customer needs\n\n1.1 Product\n1.2 Service\n1.3 Delivery and distribution\n1.4 Quality\n1.5 Quantity\n1.6 Price\n1.7 Communication and documentation\n\n--- PDF PAGE 47 ---\nTR Process Inspection NC III\nPromulgated\n- 43 -\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Maintained/Supervised the application of quality procedures\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Specifications to be achieved in providing the service or\nproducing the product\n2.2 Team's supplier(s) and customer(s)\n2.3 Possible effects of supplying products and/or services to\ncustomers that do not comply with specifications\n2.4 Procedures to be followed in producing the product and/or\nsupplying the service\n2.5 Checks to be undertaken to ensure the product / service\ncomplies with specifications\n2.6 Personnel responsible for the quality of the product / service\nprovided\n2.7 Actions to be taken when a non-conformance to specifications\nis detected and reasons for taking those actions\n2.8 Procedures for recording data collected\n2.9 Possible trends from the collected data\n2.10 Actual trends indicated by given samples of data\n2.11 Reasons for collecting data\n2.12 Statistical information to be calculated\n2.13 Use of statistics in interpreting production data\n2.14 Functions of tally, run or control charts in representing\nproduction data\n2.15 Trends indicated by the statistical information calculated\nand/or the charts produced\n2.16 Action to be taken in response to any trends identified\n2.17 Reasons for taking proposed action\n2.18 Appropriate techniques, tools and equipment to measure\nmachined components\n2.19 Hazards and control measures within the scope of this unit\n2.20 Use and application of personal protective equipment\n2.21\nSafe work practices and procedures\n3. Underpinning skills\n3.1 Obtaining and interpreting the specifications of the product or\nservice to be provided\n3.2 Communicating effectively with suppliers and customers\n3.3 Recording data collected\n3.4 Calculating relevant statistical information from collected data\n3.5 Producing tally, run and control charts from collected data\n3.6 Using leadership skills\n3.7Using analysis skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.4 Workplace area: Real or simulated\n4.5 Access to all tools, equipment, materials and documentation\nrequired.\n4.6 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials\n\n--- PDF PAGE 48 ---\nTR Process Inspection NC III\nPromulgated\n- 44 -\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1 Competency must be assessed on-the-job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 49 ---\nTR Process Inspection NC III\nPromulgated\n- 45 -"
