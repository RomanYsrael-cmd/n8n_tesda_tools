  "source_text": "1.\nBore gauge\nBore gauge is a measuring tool used for measuring the internal\ndiameter of a cylindrical tube.\n2.\nData\nData is the information collected about a product, service, process,\nperson or machine.\n3.\nDomain\nDomain is the set of possible values specified for a given\nmathematical function.\n4.\nFlashing\nFlashing is a defect where resin flow out to the parting line of the\nmold and adheres to the part of the product, especially commonly\nseen in old mold.\n5.\nFlowchart\nFlowchart is a pictorial summary of the flows and decisions that\ncomprise a process. It is used for defining and documenting the\nprocess.\n6.\nGantt chart\nGantt chart is a scheduling chart in which horizontal lines show\nthe actual and projected amounts of time involved in completing a\nparticular task or reaching specific levels of production it is is a bar\nchart that plots tasks and subtask against time.\n7.\nHistogram\nHistogram is a statistical graph of frequency distribution in which\nvertical rectangles of different heights are proportionate to\ncorresponding frequencies.\n8.\nIshikawa diagram\nIshikawa diagram is a tool used to organize the possible causes of\na problem, select the most probable cause, and verify the cause\nand effect relationship between the most probable cause and the\nproblem under study.\n9.\nJetting\nJetting or sometimes called flow marks is a defect that shows\nvisible marks of movement as the materials enter the mold.\n10. Mean\nMean is a numerical representation of the arithmetic average it is\nthe sum of the numerical values of the measurement divided by the\nnumber of items examined.\n11. Median\nMedian is the middle value when the data are arranged in\nascending order. When there are an even number of observations,\nthe median value is the arithmetic average of the middle two\nvalues.\n12. Mode\nMode of a distribution is the value that occurs most frequently, or\nthe value corresponding to the highest point on a frequency\npolygon or histogram.\n13. Pareto analysis\nPareto analysis is the tool of analysis using the concept that\nfocuses attention on the vital few against the trivial many.\n14. Process\nProcess is a collection of interacting components that transform\ninputs into outputs toward a common aim.\n15. Short shot\nShort shot is a defect that occurs when the resin cools and\nsolidifies before the material fills the mold completely.\n16. Shrinkage\nShrinkage is a defect that forms a cavity in a casting caused by\ninsufficient amount of metal during solidification\n\n--- PDF PAGE 58 ---\nTR Process Inspection NC III\nPromulgated\n- 54 -\n\n17. The range\nThe range is the simplest measure of dispersion; for raw data from\nan enumerative or an analytic study, it is defined as the difference\nbetween the largest data point and the smallest.\n18. Tolerance\nTolerance is the allowable variance from a nominal value\nestablished by design engineers that is deemed non harmful to the\nfunctioning of the product.\n\n--- PDF PAGE 59 ---\nTR Process Inspection NC III\nPromulgated\n- 55 -",
