  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for PROCESS INSPECTION NC III.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PROCESS INSPECTION\n\n NC Level: NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n45 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with competency to apply quality systems,\nconduct product and or process capability studies and maintain and supervise the application of\nquality procedures. These units cover improving the quality system, and collecting and\nsummarizing data to support the quality improvement process.\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\n It also includes common competencies such as: Read, Interpret and Apply Engineering\nDrawings; Perform Mensuration and Calculation Read; Interpret and Apply Specifications and\nManuals and; Perform Shop Maintenance\n To obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team member\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Case studies\n• Modular\n• Written\nexamination\n• Direct\nObservation\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for agreement\n• Lecture\n• Role play\n• Practical\nexercises\n• Written test\n• Demonstration\n\n--- PDF PAGE 50 ---\nTR Process Inspection NC III\nPromulgated\n- 46 -\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Lecture\n• Self-paced\ninstruction\n• Group\ndiscussion\n• Practical work\napproach\n• Research\nstudy\n• Written test\n• Demonstration\n• Oral interview\n6. Use relevant\ntechnologies\n6.1 Identify appropriate technology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Lecture\n• Self-paced\ninstruction\nGroup\ndiscussion\n•\nFilm showing\n• Written test\n• Interview\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read,\nInterpret and\nApply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2 Interpret drawings\n1.3 Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1 Select measuring instrument\nand carry out measurement\nand calculations.\n2.2 Maintain measuring\ninstruments\n• Lecture\n• Demonstration\n• Practical\nexercises\n•Simulation\n• Written test\n• Oral questioning\n• Direct\nobservation\n3. Read,\nInterpret and\nApply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals and\ninterpret data and specification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written/Oral\nquestioning\n• Direct\nobservation\n• Project method\n•Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\n• Demonstration\n• Self-paced\ninstruction\n• Dual training\n• Simulation\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n• Demonstration\n\n--- PDF PAGE 51 ---\nTR Process Inspection NC III\nPromulgated\n- 47 -\nCORE COMPETENCY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply quality\nsystems\n\n1.1 Work within a quality system.\n1.2 Engage in quality improvement.\n\n• Demonstration\n• Lecture\n• Discussion\n• Dual training\n• Observation\nwith questioning\n• Portfolio\n• Third party\nreport\n2. Conduct\nProduct and/or\nprocess\ncapability\nstudies\n2.1 Conduct process capability\nstudies\n2.2 Set control limits\n2.3 Select sampling plans\n• Demonstration\n• Lecture\n• Discussion\n• Dual training\n• Observation\nwith questioning\n• Portfolio\n• Third party\nreport\n3. Maintain /\nsupervise the\napplication of\nquality\nprocedures\n3.1 Improve quality system\n3.2 Collect and summarize data\n• Demonstration\n• Lecture\n• Discussion\n• Dual training\n• Observation\nwith questioning\n• Portfolio\n• Third party\nreport\n\n--- PDF PAGE 52 ---\nTR Process Inspection NC III\nPromulgated\n- 48 -\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when\ndesigning training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n--- PDF PAGE 53 ---\nTR Process Inspection NC III\nPromulgated\n- 49 -\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience. Other\nrequirements like health and physical requirements are also stated. Passing entry written\nexaminations may also be indicated if necessary.\n\n• Ability to communicate both orally and in writing;\n• Physically and mentally fit; and\n• Must possess the Process Inspection National Certificate (NC) II\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nPROCESS INSPECTION NC III\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nPROCESS INSPECTION NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n10 units\nVernier\ncaliper\n1 units\nOptical Pyrometer\n6 pcs\nBatteries (1.5v & 9 v)\n25 units\nSteel rule\n1 unit\nContact or\nimmersion\nPyrometer\n24 pcs\nThermocouple cups\n10 units\nMicrometer\n2 units\nHardness Testers\n(portable)\n\n14 units\nSampling\ntools\n2 units\nMoisture testers\n2 sets.\nHeating elements\n14 units\nMagnifying\nglass\n2 set\nSanding or\ngrinding machine\n4 belts or\nstones.\nSand paper (#120 to\n400)\n2 units\nFord cup\n#4\n2 units\nSand rammer\n2 kilos\nWhite rag (De Hilo)\n25 pcs.\nRubber\nglove\n1 set\nDesk top\ncomputer\n\n25 pcs.\nCotton\nglove\n3 units\nPrinter\n\n25 pcs.\nNylon\nglove\n\n25 pcs.\nGoggle\n25 pcs.\nGas mask\n25 pcs.\nSafety\nshoe\n\n25 pcs.\nApron\n\n--- PDF PAGE 54 ---\nTR Process Inspection NC III\nPromulgated\n- 50 -\n3.5 TRAINING FACILITIES\nPROCESS INSPECTION NC III\n\nBased on a class size of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n•\nBuilding (permanent)\n26.00 x 28.00\n728.00\n728.00\n• Trainee Working Space\n3.50 x 3.50 per\nstudent/trainee\n12.25 per\nstudent\n306.00\n•\nLecture Room\n9.00 x 10.00\n90.00\n90.00\n•\nLearning Resource Center\n5.00 x 8.00\n40.00\n40.00\n• Facilities/ Equipment/\nCirculation Area**\n-\n-\n349.00\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE SECTOR\n MANUFACTURING SUB-SECTOR\n\nPROCESS INSPECTION NC III\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Process Inspection NC III\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n• Must be a civil-service eligible or holder of appropriate professional license issued by\nthe Professional Regulatory Commission (for government positions only)\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or equivalent”\nupon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 55 ---\nTR Process Inspection NC III\nPromulgated\n- 51 -"
