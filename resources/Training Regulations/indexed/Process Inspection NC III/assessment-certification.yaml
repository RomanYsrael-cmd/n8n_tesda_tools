. Flowchart Flowchart is a pictorial summary of the flows and decisions that comprise a process. It is used for defining and documenting the process. 6. Gantt chart Gantt chart is a scheduling chart in which horizontal lines show the actual and projected amounts of time involved in completing a particular task or reaching specific levels of production it is is a bar chart that plots tasks and subtask against time. 7. Histogram Histogram is a statistical graph of frequency distribution in which vertical rectangles of different heights are proportionate to corresponding frequencies. 8. Ishikawa diagram Ishikawa diagram is a tool used to organize the possible causes of a problem, select the most probable cause, and verify the cause and effect relationship between the most probable cause and the problem under study. 9. Jetting Jetting or sometimes called flow marks is a defect that shows visible marks of movement as the materials enter the mold."
