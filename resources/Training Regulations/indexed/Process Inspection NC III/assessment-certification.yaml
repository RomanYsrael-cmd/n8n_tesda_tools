  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of PROCESS INSPECTION NC III, the candidate\nmust demonstrate competence in all the units listed in Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director General.\n\n4.2\nThe qualification of PROCESS INSPECTION NC III may be attained through.\n\n4.2.1 Demonstration of competence through project-type assessment covering all\nrequired units of competency of the qualification.\n\nPERFORM PROCESS INSPECTION\n• Apply Quality Systems\n• Conduct Product and/or Process Capability Studies\n• Maintain/Supervise the Application of Quality Procedures\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Holder of Process Inspection NC II or equivalent qualification; or\n\n4.4.2 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.4.3 Experienced workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 56 ---\nTR Process Inspection NC III\nPromulgated\n- 52 -\n\n"
