lems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 85 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 82\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Look for\nsolutions\nto routine\nproblems\n• Review of the current industry\nhardware and software products\nand services\n• Identify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\nprocedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n• Formulate possible solutions to\nproblems and document\nprocedures for reporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.3\nRecomme\nnd\nsolutions\nto\nproblems\n• Discuss standard operating\nprocedures and documentation\nprocesses\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n4. Develop career\nand life\ndecisions\n4.1 Manage\none’s\nemotion\n• Demonstrate self-management\nstrategies that assist in regulating\nbehavior and achieving personal\nand learning goals\n• Explain enablers and barriers in\nachieving personal and career\ngoals\n• Identify techniques in handling\nnegative emotions and unpleasant\nsituation in the workplace such as\nfrustration, anger, worry, anxiety,\netc.\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstratio\nn or\nsimulation\nwith oral\nquestioning\n• Case\nproblems\ninvolving\nworkplace\ndiversity\nissues\n1 Hour\n\n--- PDF PAGE 86 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 83\n\nUni