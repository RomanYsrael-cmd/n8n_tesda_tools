      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: BEEKEEPING\n\nLevel: NC II\n\nNominal Training Duration:\n\n 37 Hours\nBasic Competencies\n\n 72 Hours\nCommon Competencies\n\n 41 Hours\nCore Competencies\n\n150 Hours\n\n 40 Hours\nSupervised Industry Learning (SIL)\n 190 Hours\nTotal Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve establishing hived colonies in a\nbee yard, managing bee colony, propagating bee colony, conducting harvesting\noperation and provide pollination services.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieved.\n\n--- PDF PAGE 80 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 77\n\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n• Read:\no Effective communication\no Written communication\no Communication procedures\nand systems\n• Identify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n• Prepare different Types of\nquestion\n• Gather different sources of\ninformation\n• Apply storage system in\nestablishing workplace\ninformation\n• Demonstrate Telephone\ncourtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n1.2 Perform\nduties\nfollowing\nworkplace\n• Read:\no Written notices and\ninstructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written\nexamination\n2 Hours\n\n--- PDF PAGE 81 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 78\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ninstruction\ns\no Workplace interactions and\nprocedures\n• Read instructions on work\nrelated forms/documents\n• Perform workplace duties\nscenario following workplace\ninstructions\n• Observation\n\n--- PDF PAGE 82 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 79\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.3 Complete\nrelevant\nwork\nrelated\ndocuments\n• Describe Communication\nprocedures and systems\n• Read:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n• Read instructions on work\nrelated forms/documents\n• Practice:\no Estimate, calculate and\nrecord routine workplace\nmeasures\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n• Demonstrate office activities\nin:\no workplace meetings and\ndiscussions scenario\n• Perform workplace duties\nscenario following simple\nwritten notices\n• Follow simple spoken\nlanguage\n• Identify the different Non-\nverbal communication\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral\nevaluation\n• Written\nexamination\n• Observ