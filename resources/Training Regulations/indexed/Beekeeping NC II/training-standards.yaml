11/2020)\n 110\nCORE COMPETENCIES\n41 HOURS\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Establish hived\ncolonies in a bee\nyard\n\n1.1 Acquire hive\nKnowledge:\nDiscuss and explain the following:\n•\nSpecies of bee\n•\nBee biology\n•\nTypes of hive\n•\nDesigns of hive\n•\nNegotiation process\n•\nCommunication\n•\nMensuration\n•\nOnline purchasing\n•\nOut sourcing procedure\n•\nReliable sources of hive\n•\nChecking for the presence of\ncontaminants\n•\nStandard specification of hive\n•\nEconomic capacity to sustain\noperation\nPractical Skill\n•\nAcquire hive\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\nFilm viewing\n• Measure\nprecision and\nassess quality of\nacquired hive\n• Written\nexamination\n• Practical\nexamination\n(3.5 HRS)\n1hr\n\n1.2 Setting up hive\nKnowledge\nDiscuss and explain the following:\n• Selection of site\n• Tools, materials and equipment\nfor setting up hive\n• Starter colony\n• Installation procedure\n• Installation of hive stand\n• Safety and health measures\n-\nOSHS\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Measure\nprecision\nand\nassess quality of\nacquired hive\n• Written\nexamination\n• Practical\nexamination\n1hr\n\n--- PDF PAGE 114 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 111\n-\nPNS\nfor\nCode\nof\nGood\nBeekeeping Practices\nPractical Skill\n• Setting up hive\n\n1.3 Maintain hives\nKnowledge\nDiscuss and explain the following:\n• Inspection of hives\n• Checking of food\n• Cleaning procedures\n• Disinfection of hives\n• Simple repair of hives\n• Basic wood working\n• Dilapidated hives\n• Waste management\n• Storage of hive\n• Safety and health measures\n-\nOSHS\n-\nPNS for Code of Good\nBeekeeping Practices\nPractical Skill\n•\nMaintain hives\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Practical\nexamination\n1hr\n\n1.4 Perform work\ncompletion\nKnowledge\nDiscuss and explain the following:\n• Cleaning materials\n• Cleaning tools and equipment\n• Inventory of tools, materials and\nequipment\n• Inventory procedures\n• Record keeping\n• Dilapidated hives\n• Discarding of dilapidated hives\n• Wastes management\n-\n3Rs\n• Safety and health measures\n-\nOSHS\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n0.5hr\n\n--- PDF PAGE 115 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 112\n-\nPNS for Code of Good\nBeekeeping Practices\nPractical Skill\n• Perform work completion\n2. Manage bee\ncolony\n2.1 Control pests\nand diseases\n\nKnowledge\nDiscuss and explain the following:\n• Pests and diseases listed in OIE\n• Regular cleaning and rotation of\nhive components\n• Treatment\nand\ncorrective\nmeasures\n• Safety and health measures\n- OSH\n- PNS for Code of Good\nBeekeeping Practices\nPractical Skill\n• Control pests and diseases\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n(12.5 HRS)\n1hr\n\n2.2 Perform\nfeeding\nKnowledge\nDiscuss and explain the following:\n\n• Number of colonies\n• Amount of feed supplement\n• Types of feeding materials\n• Preparation of feeds\n• Wearing of PPEs\n• Mensuration\n• Weather conditions\n• Feeding activity\n• Use of feeder\n• Monitoring procedure\n• Safety and health measures\n- Wearing PPEs\n- OSH\n- PNS – Code of Good\nBeekeeping Practices\nPractical Skill\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n0.5hr\n\n--- PDF PAGE 116 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 113\n• Perform feeding\n\n2.3 Monitor\nperformance of\ncolony\n\nKnowledge\nDiscuss and explain the following:\n\n• Importance\nof\nhealth\nand\nperformance of colony\n• Monitoring procedures\n• Safety and health measures\n- Wearing PPEs\n- OSH\n- PNS – Code of Good\nBeekeeping Practices\nPractical Skill\n• Monitor performance of colony\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n1hr\n\n2.4 Perform\nrequeening\n\nKnowledge\nDiscuss and explain the following:\n\n• Indicators of requeening\n• Process of requeening\n• Availability of new queen\n• Keeping\nand\ntransferring\nold\nqueen\n• Removing of old queen from\ncolony\n• Marking and introducing of queen\nto the colony\n• Acceptance of the new queen by\nthe colony\n• Safety and health measures\n- Wearing PPEs\n- OSH\n- PNS – Code of Good\nBeekeeping Practices\nPractical Skill\n• Perform requeening\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n4hrs\n\n--- PDF PAGE 117 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 114\n\n2.5 Merge colonies Knowledge\nDiscuss and explain the following:\n\n• Indicators for merging colonies\n• Process of merging colonies\n• Indicators of success of merging\nthe colonies\n• Safety and health measures\n- Wearing of PPEs\n- OSH\n- PNS – Code of Good\nBeekeeping Practices\nPractical Skill\n• Merge colonies\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n2hrs\n\n2.6 Manage bee\nswarming\nKnowledge\nDiscuss and explain the following:\n\n• Safety and health measures in\ncatching swarm\n• Indicators of swarming\n• Control Measures\n• Application of control measures\n• Tools and materials used for\ncontrolling and capturing bee\nswarm\n• Safety and health measures\n- Wearing of PPEs\n- OSH\n- PNS – Code of Good\nBeekeeping Practices\nPractical Skills\n• Manage bee swarming\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/ha\nnds-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n4hrs\n\n--- PDF PAGE 118 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 115\n3. Propagate\nbee colony\n\n3.1 Conduct\npreparatory\nactivities\nKnowledge\nDiscuss and explain the following:\n\n• Tools and materials\n• Wearing of PPEs\n• Safety and health measures\n-\nOSH\n-\nPNS for Code of Good\nBeekeeping Practices\n•\nImportance on the availability of\ntools, materials and equipment in\nthe workplace\nPractical Skill\n• Conduct preparatory activities\n•\nPowerPoint\npresentation\n•\nLecture\ndiscussion\n•\nDemonstration/\nhands-on\n•\nFilm viewing\n\n•\nWritten\nexamination\n• Practical\nexamination\n(14 HRS)\n1hr\n\n3.2 Assess status\nand strength of\nof colony\nKnowledge\nDiscuss and explain the following:\n\n• Hive manipulation\n• Safety and health measures\n-\nOSH\n-\nPNS for Code of Good\nBeekeeping Practices\n• Good quality queen\n• Food of the colony\n-\nHoney and pollen\n• Pests and diseases\n• Hive compression and expansion\n• Population build up\n• Performance of the colony\nPractical Skill\nAssess status of colony\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/\nhands-on\n•\nFilm viewing\n• Written\nexamination\n•\nPractical\nexamination\n5hr\n\n3.3 Produce colony\n\nKnowledge\nDiscuss and explain the following:\n\n• Safety and health measures\n-\nOSH and PNS for Code of\nGood Beekeeping Practices\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/\nhands-on\n• Written\nexamination\n• Practical\nexamination\n4hrs\n\n--- PDF PAGE 119 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 116\n• Nucleus colony\n• Division of colony\n• Acquiring new queen\n• Introduction of new queen\n• Status of food in the colony\n• Feeding nucleus colony\nPractical Skill\nProduce colony\n• Film viewing\n\n4.1 Maintain newly\nestablished\ncolony\n\nKnowledge\nDiscuss and explain the following:\n\n• Identification of corrective actions\n• Application of corrective actions\n• Pests and Diseases of Bees\n• Treatment of colonies\n• Performing treatment to colonies\n• Importance of food, health and\nperformance of colony\n• Monitoring procedures\n• Safety and health measures\n-\nWearing PPEs\n-\nOSHS\n-\nPNS – Code of Good\nBeekeeping Practices\nPractical Skill\nMaintain colony\n• PowerPoint\npresentation\n• Lecture\ndiscussion\n• Demonstration/\nhands-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n4hrs\n4. Conduct\nharvesting\noperation\n4.2 Conduct\npreparatory\nactivities\n\nKnowledge:\nDiscuss and explain the following:\n\n•\nTools, materials and equipment\nfor harvesting\n•\nSelection and Inventory\nprocedure\n•\nImportance on the availability of\ntools, materials and equipment\n•\nSafety and health measures\n-\nWearing of PPEs\n•\nPowerPoint\npresentation\n•\nLecture\ndiscussion\n•\nDemonstration\n/hands-on\n• Film viewing\n• Written\nexamination\n• Practical\nexamination\n(7 hrs)\n1hr\n\n--- PDF PAGE 120 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 117\n-\nOSH\n-\nPNS-Code of Good\nBeekeeping Practices\nPractical Skill\n•\nConduct preparatory activities\n\n4.3 Harvest bee\nproducts\nKnowledge\nDiscuss and explain the following:\n\n•\nFactors affecting harvesting\n-\nWeather condition\n-\nTime of harvest\n•\nTypes of bee products\n•\nProcess of harvesting bee\nproducts\n•\nHarvesting bee products\n•\nApplication of safety and\nmeasures\n-\nOSH\n-\nPNS for Code of Good\nBeekeeping Practices\n•\nWearing of PPEs\nPractical Skill\n•\nHarvest bee products\n•\nPowerPoint\npresentation\n•\nLecture\ndiscussion\n•\nDemonstration\n/hands-on\n•\nFilm viewing\n• Written\nexamination\n• Practical\nexamination\n4hrs\n\n4.4 Conduct post-\nharvest\nactivities\nKnowledge\nDiscuss and explain the following:\n\n•\nProper storage of harvested bee\nproducts\n•\nAppropriate containers for storing\n•\nImportance of stickies\n•\nPlacing and returning of stickies\n•\nCleaning and storing of\nharvesting tools and equipment\n•\nRecord keeping\n•\nApplication of safety and\nmeasures\n-\nOSH\n•\nPowerPoint\npresentation\n•\nLecture\ndiscussion\n•\nDemonstration\n/hands-on\n•\nFilm viewing\n• Written\nexamination\n• Practical\nexamination\n2hrs\n\n--- PDF PAGE 121 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 118\n-\nPNS for Code of Good\nBeekeeping Practices\nPractical Skill\n•\nConduct post –harvest activities\n5. Provide\npollination\nservices\n\n5.1 Confirm\npollination\nservice\nrequirement\n\nKnowledge\nDiscuss and explain the following:\n\n•\nCrops and their respective bee\npollinators\n•\nPollination services\n•\nConfirmation with clients\naccording to industry practice\n•\nTypes of colonies\n•\nNumber and location of colonies\n•\nTerritory and local government\nlegislatives, regulatory and\nrequirements\n•\nBiosecurity affecting pollination\nservices\n•\nStrength, condition and health of\nbee colonies\n•\nRisk to pollination activities\n•\nProvision of technical information\nto clients\n•\nBee performance and health\n•\nAppropriate certificate and\npermits for transport of colonies\nSkill\n•\nConfirm pollination service\nrequirement\n•\nPowerPoint\npresentation\n•\nLecture\ndiscussion\n•\nDemonstration\n/hands-on\n•\nFilm viewing\n• Written\nexamination\n• Practical\nexamination\n(4 hrs)\n1hr\n\n5.2 Transport\ncolony for\npollination\nservices\nKnowledge\nDiscuss and explain the following:\n\n•\nPollination requirements of\ndifferent crops\n•\nPreparation for hives to be used\nfor pollination services\n•\nPowerPoint\npresentation\n•\nLecture\ndiscussion\n• Written\nexamination\n• Practical\nexamination\n1hr\n\n--- PDF PAGE 122 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 119\n•\nIATA requirements on packaging\nand air transport of bees\n•\nPackaging technique during\ntransport\n•\nCertificates and permits for\ntransport\n•\nCommunication\nPractical Skill\n•\nTransport colony for pollination\nservices\n•\nDemonstration\n/hands-on\n•\nFilm viewing\n\n5.1 Perform\npollination\nservices\nKnowledge\nDiscuss and explain the following:\n\n•\nExisting agricultural practice that\nare compatible with bee\npollination services\n•\nBee foraging and pollination\nefficiency\n•\nMonitor bee foraging and\npollination efficiency\n•\nCare of bees during pollination\n•\nCommunication\n•\nSafety and health measures\n•\nUse of models in the placement\nand distance between hives\nPractical Skill\n•\nPerform pollination services\n•\nPowerPoint\npresentation\n•\nLecture\ndiscussion\n•\nDemonstration\n/hands-on\n•\nFilm viewing\n• Written\nexamination\n• Practical\nexamination\n1hr\n\n5.2 Complete\npollination\nservices\nKnowledge\nDiscuss and explain the following:\n\n•\nRecord keeping\n•\nSummarizing record\n•\nReport preparation\n•\nImprovement on services\n•\nCompletion of transaction\n•\nCommunication skills\n•\nMathematical skills\n•\nPowerPoint\npresentation\n•\nLecture\ndiscussion\n•\nDemonstration\n/hands-on\n•\nFilm viewing\n• Written\nexamination\n• Practical\nexamination\n1hr\n\n--- PDF PAGE 123 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 120\nPractical Skill\n•\nComplete pollination\nServices\n\n--- PDF PAGE 124 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 121\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 School/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 125 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 122\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits\nto contributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 126 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 123\n\n2.3 Community-Based\n• Short term programs conducted by non- government organizations NGOs,\nLGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be\nconducted in informal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP)\n\n--- PDF PAGE 127 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 124\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who would like to enroll in this course should possess the following\nrequirements:\n\n• Basic communication skills\n• Basic mathematical skills\n• Preferably no history of allergic reaction to bee sting, pollen and other products and\nchemicals used in farming*\n\nNote: * Medical certificate or waiver must be presented and signed upon enrollment.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND, MATERIALS\n\nBEEKEEPING NC II\n\nRecommended list of tools, equipment and materials for the training of 20 trainees for\nBeekeeping NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their availability in\nthe local market.\n\nTOOLS\nQTY\nDESCRIPTION\n20 pcs\nHive tool\n20 pcs\nSmoker\n20 pcs\nHammer\n20 packs\nNails\n20 spools\nWire\n20 pcs\nBee brush\n20 pcs\nSmoker\n20 pcs\nDissecting set\n20 pcs\nUncapping knife\n\n20 pcs\nKnife\n20 pcs\nSilicone spatula\n20 pcs\nPitcher\n20 pcs\nStrainer\n20 pcs\nPot\n\n--- PDF PAGE 128 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 125\nEQUIPMENT\nQTY\nDESCRIPTION\n20 pcs\nPen light\n20 pcs\nSpur embedder\n20 pcs\nPPEs\n\nBee veil\n\nBee Suit\n\nGloves\n20pcs (size of pollen trap depends on\nthe species of bees)\nPollen trap\n5 pcs (small)\nSettling tank\n1 unit\nHoney extractor\n20pcs (standard size)\nPropolis trap\n20 pcs\nComputer/Tablet/Cellular phone\n\nMATERIALS\nQTY\nDESCRIPTION\n20 strong colonies\nApis mellifera hive (complete set)\n20 strong colonies\nA. cerana hive (complete set)\n20 strong colonies\nTetragonula spp. hive (complete set)\n20 blocks\nWood for hive construction\n20 books\nMatches\n20 sheets\nWax foundation sheet\n5 kg\nSmoker fuel (either of the following: husk, paper,\ndried leaves, cardboard)\n5 boxes\nMatches\n20 pcs\nNew queen\n20 pcs\nNuc boxes\n20 pcs\nExtra boxes (used for division of colonies)\n60 pcs\nMiticide\n20 kg\nFeeding Supplement\n10 pcs\nSwarm net (24”x30”)\n20 sheets\nNewspaper sheet (used for merging colonies)\n5 pcs\nQueen cage\n5 pcs\nQueen catcher\n20 pcs\nFeeders\n10 kg\nWhite sugar\n40 pcs (2pcs/trainee)\nExtra frames (for foundation)\n20 pcs (medium size)\nFood grade stainless steel trays\n\n--- PDF PAGE 129 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 126\n3.5 TRAINING FACILITIES\n\nBEEKEEPING NC II\n\nThe size of the beekeeping workshop must be suited on the requirements of the\ncompetencies. The class size of 20 students/trainees is reserved for the teaching/ learning and\ncirculation areas as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building (permanent)\n\n119.55sq.m.\n•\nStudent/Trainee\nWorking Space\n7.00 X 9.00\n63.00 sq.m\n\n•\nLearning Resource\nCenter\n5.10 X 6.00\n30.60 sq.m\n\n•\nWash room\n1.60 X 1.20\n\n1.92 sq.m\n\n•\nComfort room\nmale: 2.30 X1.20\nfemale:2.30 X1.80\nPWD: 1.60 X1.80\n9.78 sq.m\n\n•\nFacilities/Equipmen\nt/ Circulation Area\n(30% of teaching\naccommodation)\n1.90 X3.00\n5.70 sq.m\n\n•\nStore Room\n1.90 X4.50\n8.55 sq.m\n\nB. Experimental Bee\nYard\n\n300.00 sq. m.\n\nTOTAL Area\n\n419.55 sq.m.\n NOTE: Access to and use of equipment /facilities can be provided through cooperative arrangements or MOA\nwith other partner- farms/companies. Open air lecture rooms must be made available to prevent spread of\npossible infectious agents.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR BEEKEEPING NC II\n• Must be a holder of National TVET Trainer Certification (NTTC) of Beekeeping NC II\n• Must have at least five (5) years industry experience in Beekeeping within the last\nseven (7) years\n• Must have handled at least one hundred bee colonies\n\n3.7\nINSTITUTIONAL ASSESSMENT\nInstitutional Assessment is gathering of evidences to determine the achievements of the\nrequirements of the qualification to enable the trainer make judgement whether the trainee is\ncompetent or not competent.\n\n--- PDF PAGE 130 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 127"
