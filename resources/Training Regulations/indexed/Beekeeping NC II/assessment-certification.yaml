own to the hive to calm the bees Bee yard An area of a collection of hives or colonies of bees kept for their products or pollination services Beehive A structure in where bees are kept; house of bees Beekeeper A person who keeps bees Beekeeping The art of keeping bees Beeswax Wax secreted from glands on underside of bee abdomen, molded to form honey combs --- PDF PAGE 135 --- TR -Beekeeping NC II Revision 00 Promulgated (08/11/2020) 131 Brood Refers to the immature stages of bees such as egg, larva, and pupa that will develop into adult bees Cappings The thin layer of new wax that bees build over the ripened honey Colony An aggregate of several thousand worker bees, drones and a queen bee living together in a hive or in any other dwelling as one social unit Comb A structure manufactured by bees out of beeswax and consisting of hexagon-shaped cells fitted side by side and used by bees to raise brood and store honey and pollen: also called honeycomb Costing and economic capacity The financial capacity of each prospective beekeeper Disease Means the clinical and/or pathological manifestation of infestation and infection such as American Foul Breed, Chalk Brood, and European Foul Brood Divide To split a strong colony into two smaller colonies Harvesting The process of removing the honey from the honeycomb Hive tool A handheld multipurpose tool used in separating frames and prying the inner cover of the hive. Honey The natural sweet substance produced by bees from the nectar of plants or from secretions of living plants or excretions of plant-sucking insects on the living parts of plants, which the bees collect, transform by combining with specific substances of their own, deposit, dehydrate, store and leave in the honey comb or in the cerumen pot to ripen and mature Honey flow Period when flowers are producing enough nectar to allow significant honey storage Honey Super A hive box or hive bodies with frames where honey is stored and ripened Meliponary A location where 