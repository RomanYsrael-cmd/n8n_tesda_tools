      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented Promulgated (08/11/2020)"
