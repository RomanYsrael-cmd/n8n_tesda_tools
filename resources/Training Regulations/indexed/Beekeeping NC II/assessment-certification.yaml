  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or employable\nunit(s) of competency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the Qualification of BEEKEEPING NC II the candidate must demonstrate\ncompetence in all units of competency listed in Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director General.\n4.1.2 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n4.1.3.1\nGraduates\nof\nWTR-,\nNTR-registered\nprograms\nor\nformal/non-\nformal/informal including enterprise-based trainings related to Beekeeping\nNC II.\n4.1.3.2\nExperienced workers (wage employed or self-employed) who gained\ncompetencies in providing Beekeeping services for at least three (3) years\nwithin the last five (5) years.\n4.1.4 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\n\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\n\n--- PDF PAGE 131 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 128\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 132 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 129\n\n"
