y the workers to replace the failing queen Swarm An aggregate of bee colony that leaves the hive to establish a new colony; it is a natural means of reproduction of the bee colonies Swarm cell Cell containing the new queen produced by the workers when there is an over abundance of bees in the hive and they need to make a new colony --- PDF PAGE 137 --- TR -Beekeeping NC II Revision 00 Promulgated (08/11/2020) 133 Tetragonula spp. Species of stingless bees locally known as lukot, lukutan, libog, tigtig, kiwot, kiyot, duri; can be domesticated in hives and used for honey, pollen and propolis and crop pollination. Produces 1-2 kg of honey per colony per year Treatment Refers to disinfection of hive components through cleaning, heating and using of repellant Wild honey Honey harvested from wild bee colonies --- PDF PAGE 138 --- TR -Beekeeping NC II Revision 00 Promulgated (08/11/2020) 134 TRAINING REGULATIONS (TRs) Qualification Title: Beekeeping NC II Qualification Code: AFFBEE220 Revision No. Document Description Types* Qualification Title New Version (TESDA Board Resolution No./ Date) Deployment Circular (TESDA Circular/ Implementing Guidelines) 00 Document Created Beekeeping NC II TB No. 2020-03 / 08/11/2020 TESDA Circular No. 131 series of 2020 Legend: *Description Types - Document Created - Document Amended - Document Superseded --- PDF PAGE 139 --- TR -Beekeeping NC II Revision 00 Promulgated (08/11/2020) 135 The Technical Education and Skills Development Authority (TESDA) is particularly grateful for the valuable technical support provided by the following industry stakeholders for the review and development of this Training Regulations. The time and inputs generously given during this undertaking are also highly appreciated and recognized as they made significant contributions to the constitution of this TR. MS. CLEOFAS R. CERVANCIA Technical Expert Professor Emeritus, University of the Philippines Los Baños President, Apimondia Regional Commission for Asia MS.