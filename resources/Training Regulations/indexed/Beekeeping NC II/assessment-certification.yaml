      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the Qualification of BEEKEEPING NC II the candidate must demonstrate competence in all units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 Any of the following are qualified to apply for assessment and certification: 4.1.3.1 Graduates of WTR-, NTR-registered programs or formal/non- formal/informal including enterprise-based trainings related to Beekeeping NC II. 4.1.3.2 Experienced workers (wage employed or self-employed) who gained competencies in providing Beekeeping services for at least three (3) years within the last five (5) years. 4.1.4 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
