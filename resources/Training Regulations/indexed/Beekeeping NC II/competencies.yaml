        "source_text": "AFF321208\nUNIT DESCRIPTOR\n:\n\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of farm\ntools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Select and use\nfarm tools\n\n1.1 Appropriate farm\ntools are identified\naccording to\nrequirement/use\n1.2 Farm tools are\nchecked for faults\nand defective tools\nreported in\naccordance with\nfarm procedures\n1.3 Appropriate tools\nare safely used\naccording to job\nrequirements and\nmanufacturers\nconditions\n1.1 Types and uses of\nfarm tools\n1.2 Characteristics of\nfunctional tools\n1.3 Checking tools for\ndefects/faults\n1.4 Segregation and\nreporting defective\ntools\n1.5 Uses of tools\n1.1 Identifying farm\ntools for the\nwork\n1.2 Checking the\nconditions of\ntools\n1.3 Reporting\ndefective tools\n1.4 Using tools\n2.\nSelect and\noperate farm\nequipment\n2.1 Identify appropriate\ntools and\nequipment\n2.2 Instructional\nmanual of the tools\nand equipment are\ncarefully read prior\nto operation\n2.3 Pre-operation\ncheck-up is\nconducted in line\nwith manufacturers\nmanual\n2.4 Faults in equipment\nare identified and\nreported in line with\nfarm procedures\n2.5 Farm equipment\nused according to\nits function\n2.1 Types and\noperations of farm\nequipment\n2.2 Standards\noperating\nprocedures of farm\nequipment\n2.3 Instructional\nmanual of\nequipment\n2.4 Pre-operation\ncheck-up\n2.5 Equipment\nSpecification\n2.6 Procedures in\ncalibrating and use\nof equipment\n2.7 Equipment faults\nidentification and\nreporting\n2.1 Identifying\nappropriate farm\nequipment for\nthe work\n2.2 Reading\ninstructional\nmanual.\n2.3 Conducting pre-\noperation check-\nup\n2.4 Identifying\nfaults/defects of\nfarm equipment\n2.5 Reporting on\ndefective farm\nequipment\n2.6 Operating farm\nequipment\n2.7 Following safety\nprocedures.\n\n--- PDF PAGE 47 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.6 Safety procedures\nare followed.\n2.8 Operation of\nequipment\n2.9 Codes and\nRegulations on\nenvironmental\nprotection\n2.10 Safety and\nkeeping of\nequipment every\nafter use\n2.11 Safety\nmeasures\n\n3.\nPerform\npreventive\nmaintenance\n3.1 Tools and\nequipment are\ncleaned\nimmediately after\nuse in line with\nfarm procedures\n3.2 Routine check-up\nand maintenance\nare performed\n3.3 Tools and\nequipment are\nstored in\ndesignated areas in\nline with farm\nprocedures\n3.1 Cleaning\nprocedures of tools\nand equipment\n3.2 Maintenance\nprocedures of farm\nequipment\n3.3 Storage of tools\nand equipment\n3.4 Designated\nstorage areas\n\n3.1 Cleaning tools\nand equipment\n3.2 Performing\nroutinely check-\nup of tools and\nequipment\n3.3 Maintaining farm\nequipment\n3.4 Storing tools\nand equipment\n\n--- PDF PAGE 48 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 44\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Farm equipment\n\nMay include:\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n1.5 Bee smoker\n1.6 PPEs\n1.7 Honey extractor\n1.8 Pollen drier\n1.9 Propolis drier\n1.10 Wax melter\n1.11 Wax roller\n1.12 Dehumidifier\n1.13 Convection sealer\n1.14 Refractometer\n1.15 Induction cooker\n1.16 Settling tank with honey gate\n1.17 Metal hive stands\n1.18 Standard hives with accessories\n1.19 Embedding board\n1.20 Spur embedder\n1.21 Pollen trap\n1.22 Propolis trap\n2. Farm tools\nMay include:\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5 Measuring tools\n2.6 Garden tools\n2.7 Hive tool\n2.8 Bee brush\n2.9 Airtight fire proof box\n2.10 Uncapping fork and knife\n2.11 Frame grip holder\n2.12 Bee products harvesting and processing tools\n3. Pre-operation check-up\nMay include:\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n3.8 Quantity, availability, and dryness of smoker fuel\n3.9 Preheating the smoker\n\n--- PDF PAGE 49 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 45\n3.10 Check availability of all tools and equipment\nneeded for bee yard work\n3.11 Donning of PPEs\n\n EVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate farm tools and\nequipment\n1.2 Operated farm equipment according to manual\nspecification\n1.3 Performed preventive maintenance\n2.\nMethod of Assessment\n\nCompetency in this unit must be assessed through:\n2.1 Direct observation\n2.2 Practical demonstration\n2.3 Third Party Report\n3.\nResource Implications\n3.1 Service/operational manual of farm tools and\nequipment\n3.2 Tools and equipment\n3.3 Farm implements\n\n4.\nContext of\nAssessment\n4.1 Assessment may occur in the workplace or in a\nsimulated workplace or as part of a team under\nlimited supervision\n\n--- PDF PAGE 50 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 46\nUNIT OF COMPETENCY :\n\nPERFORM ESTIMATION AND BASIC CALCULATION\n\nUNIT CODE\n:"
