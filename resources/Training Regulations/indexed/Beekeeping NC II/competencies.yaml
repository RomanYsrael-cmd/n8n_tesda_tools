n 00\nPromulgated (08/11/2020)\n 62\nRANGE OF VARIABLES\nRANGE\nVARIABLES\nTools and materials\n\nTools and materials may include:\nTools:\n1.1 Bee brush\n1.2 Smoker\n1.3 Hive tool\n1.4 Dissecting set\nMaterials:\n1.5 Smoker fuel (either of the following: husk, paper,\ndried leaves, cardboard)\n1.6 Matches\n1.7 Apis mellifera hive (complete set)\n1.8 Apis cerana hive (complete set)\n1.9 Tetragonula spp. hive (complete set)\n1.10 PPEs\n- Bee veil\n- Bee suit\n- Gloves\n1.11 Miticides\n1.12 Feeding supplement\n1.13 Swarm net – 10 pcs (24”x30”)\n1.14 Newspaper sheet (for merging colonies)\n1.15 Extra frames\n1.16 Nuc box\nGood quality of queen\nMay include:\n2.1 Good laying pattern\n2.2 Healthy\nCorrective actions\nMay include:\n3.1 Adding brood frames from other healthy colonies\n3.2 Merging of colonies\n3.3 Replacement of queen\nTreatment\nMay include:\nDiseases:\n4.1 Compress colony\n4.2 Burn colony\n4.3 Re-queen\n4.4 Apply shook swarm methods\nPests\n4.5 Apply miticide\n4.6 Put traps for small hive beetle, Aethina tumida\n\n--- PDF PAGE 68 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 63\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Conducted preparatory activities\n1.2 Assessed status and strength of colony\n1.3 Produced colony\n1.4 Maintained newly established colony\n1.5 Applied safety and health measures\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, equipment, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References and manuals\n2.4 First aid kit\n3. Methods of\nAssessment\nCompetency in this unit should be assessed through:\n3.1 Demonstration/ direct observation with oral\nquestioning\n3.2 Written exam\n4. Context of Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 69 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 66\nUNIT OF COMPETENCY\n: CONDUCT HARVESTING OPERATION\nUNIT CODE\n: AFF612311\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to conduct preparatory activities in harvesting,\nharvest bee products and conduct post-harvest activities.\nThis also include harvesting operation for wild bees.\nApplication of safety measures and practices is required\nin performing every task.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange Statement\nREQUIRED\nKNOWLEDGE AND\nATTITUDE\nREQUIRED SKILL\n1. Conduct\npreparatory\nactivities\n1.1 Tools, materials\nand equipment are\nprepared following\nindustry practice\n\n1.2 PPEs are worn\nfollowing industry\nstandards and\nOSHS\n\n1.3 Safety and health\nmeasures are\napplied following\nindustry standards\n1.1 Tools, materials and\nequipment for\nharvesting\n\n1.2 Selection and\nInventory procedure\n\n1.3 Importance on the\navailability of tools,\nmaterials and\nequipment\n\n1.4 Safety and health\nmeasures\n- Wearing of PPEs\n- OSH\n- PNS-Code of\nGood Beekeeping\nPractices\n1.1 Inventorying,\nselecting and\npreparing tools,\nmaterials and\nequipment\n\n1.2 Ensuring\navailability of\ntools, materials\nand equipment\n\n1.3 Wearing of PPEs\n\n1.4 Applying safety\npractices\n\n2. Harvest bee\nproducts\n2.1 Weather is\ndetermined before\nharvesting bee\nproducts\n\n2.2 Types of bee\nproducts to be\nharvest are identified\n\n2.3 Harvesting\nprocedure is\nselected according\nto the identified bee\nproducts\n\n2.4 Tools, materials\nand equipment are\n2.1 Factors affecting\nharvesting\n-\nWeather condition\n-\nTime of harvest\n\n2.2 Types of bee\nproducts\n\n2.3 Process of\nharvesting bee\nproducts\n\n2.4 Harvesting bee\nproducts\n\n2.5 Application of safety\nand health measures\n2.1 Determining\nweather\ncondition\n\n2.2 Identifying types\nof bee products\n\n2.3 Selecting\nharvesting\nprocedure\n\n2.4 Harvesting bee\nproducts\n\n2.5 Applying safety\npractices\n\n--- PDF PAGE 70 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 67\nutilized based on\nwork requirements\nand user’s manual.\n\n2.5 Bee products are\nharvested according\nto industry standards\n\n2.6 Safety and health\nmeasures are\napplied following\nindustry standards\n-\nOSH\n-\nPNS for Code of\nGood\nBeekeeping\nPractices\n-\nFood safety\n\n2.6 Wearing of PPEs\n2.6 Wearing PPEs\n3. Conduct\npost –\nharvest\nactivities\n3.1 Harvested bee\nproducts are placed\nin appropriate\ncontainers and\nstored according to\nindustry practice\n\n3.2 Stickies are returned\ninside the hive in\npreparation for the\nnext possible\nharvest\n\n3.3 Harvesting tools and\nequipment are\ncleaned and kept in\nthe storage area\n\n3.4 Record keeping is\nperformed following\nindustry practice\n\n3.5 Safety and health\nmeasures are\napplied following\nindustry standards\n3.1 Proper storage of\nharvested bee\nproducts\n\n3.2 Appropriate\ncontainers for storing\n\n3.3 Importance of\nstickies\n\n3.4 Placing and returning\nof stickies\n\n3.5 Cleaning and storing\nof harvesting tools\nand equipment\n\n3.6 Record keeping\n\n3.7 Application of safety\nand health measures\n- OSH\n- PNS for Code of\nGood Beekeeping\nPractices\n\n3.1 Placing and\nstoring of\nharvested bee\nproducts\n\n3.2 Using of\nappropriate\ncontainers for\nstoring\n\n3.3 Placing and\nreturning stickies\ninside the hive\n\n3.4 Cleaning and\nstoring\nharvesting tools\nand equipment\n\n3.5 Conducting\nrecord keeping\n\n3.6 Applying safety\npractices\n\n3.7 Wearing PPEs\n\n--- PDF PAGE 71 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 68\nRANGE OF VARIABLES\nRANGE\nVARIABLES\n1. Tools, materials and\nequipment\nMay include:\nTools\n1.1 Hive tool\n1.2 Smoker\n1.3 Uncapping knife\n1.4 Knife\n1.5 Silicon spatula\n1.6 Pitcher\n1.7 Strainer\n1.8 Pot\n1.9 Food grade stainless trays\n\nMaterials\n1.10 PPEs:\n- Bee sui