cordance with\nenterprise policy\n3.2 Judicious use of\nworkplace tools,\nequipment and\nmaterials are\nobserved\naccording to\nmanual and work\nrequirements.\n3.3 Constructive\ncontributions to\noffice operations\nare made\naccording to\nenterprise\nrequirements.\n3.4 Ability to work\nwithin one’s\nallotted time and\nfinances is\nsustained.\n3.1 Optimization of\nworkplace\nresources\n3.2 5S procedures and\nconcepts\n3.3 Criteria for cost-\neffectiveness\n3.4 Workplace\nproductivity\n3.5 Impact of\nentrepreneurial\nmindset to\nworkplace\nproductivity\n3.6 Ways in fostering\nentrepreneurial\nattitudes:\n3.7 Quality-\nconsciousness\n3.8 Safety-\nconsciousness\n3.1 Implementing\npreservation\nand optimizing\nworkplace\nresources\n3.2 Observing\njudicious use of\nworkplace\ntools,\nequipment and\nmaterials\n3.3 Making\nconstructive\ncontributions to\noffice\noperations\n3.4 Sustaining\nability to work\nwithin allotted\ntime and\nfinances\n\n--- PDF PAGE 40 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 36\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.Good practices\nMay include:\n1.1 Economy in use of resources\n1.2 Documentation of quality practices\n\n2.Resources utilization\nMay include:\n2.1 Consumption/ use of consumables\n2.2 Use/Maintenance of assigned equipment and\nfurniture\n2.3 Optimum use of allotted /available time\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify and sustain cost-\neffective activities in the workplace\n1.2 Demonstrated ability to practice entrepreneurial\nknowledge, skills and attitudes in the workplace.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate\nthe required tasks\n2.3 References and manuals\n2.3.1 Enterprise procedures manuals\n2.3.2 Company quality policy\n3. Methods of Assessment\nCompetency in this unit should be assessed through:\n3.1 Interview\n3.2 Third-party report\n4.Context of Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 41 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 37\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY MEASURES IN FARM OPERATIONS\nUNIT CODE\n:\nAFF321207\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto perform safety measures effectively and efficiently. It\nincludes identifying areas, tools, materials, time and place in\nperforming safety measures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nDetermine\nareas of\nconcern for\nsafety\nmeasures\n1.1 Work tasks are\nidentified in line with\nfarm operations\n1.2 Place for safety\nmeasures are\ndetermined in line\nwith farm\noperations\n1.3 Time for safety\nmeasures are\ndetermined in line\nwith farm\noperations\n1.4 Appropriate tools,\nmaterials and\noutfits are\nprepared in line with\njob requirements\n1.1 Different work tasks\nin farm operations\n1.2 Place and time for\nimplementation of\nsafety measures\n1.3 Different hazards in\nthe workplace\n1.4 Types of tools,\nmaterials and\noutfits\n1.5 Preparation of\ntools, materials and\noutfits\n\n1.1 Identifying work\ntasks in farm\noperations\n1.2 Determining\nplace and time\nfor\nimplementation\nof safety\nmeasures\n1.3 Reading labels,\nmanuals and\nother basic\nsafety\ninformation\n1.4 Identifying\neffective/\nfunctional tools,\nmaterials and\noutfit\n1.5 Preparing tools,\nmaterials and\noutfits\n1.6 Discarding\ndefective tools,\nand materials\n\n--- PDF PAGE 42 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 38\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Apply\nappropriate\nsafety\nmeasures\n2.1 Tools and materials\nare used according\nto specifications and\nprocedures\n2.2 Outfits are worn\naccording to farm\nrequirements\n2.3 Effectivity/shelf\nlife/expiration of\nmaterials are strictly\nobserved\n2.4 Emergency\nprocedures are\nknown and followed\nto ensure a safe\nwork requirement\n2.5 Hazards in the\nworkplace are\nidentified and\nreported in line with\nfarm guidelines\n2.1 Uses and functions\nof tools\n2.2 Outfits and how to\nwear it.\n2.3 Expiration/shelf life\nof materials\n2.4 Proper disposal of\nexpired materials\n2.5 Environmental rules\nand regulations\n2.6 Emergency\nprocedures\n2.7 Hazards\nidentification and\nreporting\n2.8 Communication\nskills\n2.9 OSHS\n\n2.1 Using tools and\nmaterials in the\nworkplace\n2.2 Wearing of\noutfits\n2.3 Observing\nexpiration/shelf\nlife of materials\n2.4 Disposing of\nexpired\nmaterials\n2.5 Following\nemergency\nprocedures\n2.6 Identifying and\nreporting of\nhazards in\nworkplace area.\n3. Safekeep\n/dispose\ntools,\nmaterials\nand outfit\n3.1 Used tools and outfit\nare cleaned after\nuse and stored in\ndesignated areas.\n3.2 Unused materials\nare properly labeled\nand stored\naccording to\nmanufacturer’s\nrecommendation\nand farm\nrequirements.\n3.3 Waste materials are\ndisposed according\nto manufacturers,\ngovernment and\nfarm requirements.\n3.1 Procedures of\ncleaning used tools\nand outfits\n3.2 Label and storage\nunused materials\n3.3 Disposal of wastes\nmaterials\n3.4 Manufacturers’\nrecommendation on\nkeeping materials\n3.5 Environmental rules\nand regulations\n3.1 Cleaning used\ntools and outfit\n3.2 Labelling and\nstoring unused\nmaterials\n3.3 Disposing\nwaste\nmaterials\n\n--- PDF PAGE 43 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 39\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the subsectors:\n1.1 Crop Production\n1.2 Post –harvesting\n1.3 Agri-marketing\n1.4 Farm equipment\n1.5 Follow routine apiary procedure\n1.6 Maintain bee forage resources\n1.7 Control bee pests and diseases\n1.8 Provide feeding supplement\n1.9 Divide the colony\n1.10 Introduce new queen\n1.11 Harvest and process bee products\n1.12 Optimize colonies to be used for pollination\nservices\n2. Place\nMay include:\n2.1\nStock room/storage areas/warehouse\n2.2\nField/farm/orchard\n3. Time\nMay include:\n3.1 Fertilizer and pesticides application\n3.2 Feed mixing and feeding\n3.3 Harvesting and hauling\n3.4 Building up of starter colonies\n3.5 Adding frames and wax foundation sheets\n3.6 Supplemental feeding of the colonies\n3.7 Control of bee mites and diseases\n3.8 Placement of super and additional frames with wax\nfoundation\n3.9 Swarm control\n3.10 Honey harvesting and processing\n3.11 Splitting of the colony\n\n--- PDF PAGE 44 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 40\n4.\nTools, materials and\noutfit\nTools\n3.1 Wrenches\n3.2 Screw driver\n3.3 Pliers\n3.4 Multi scraper (hive tool- can be fabricated)\n3.5 Bee brush\n3.6 Hive brush\n3.7 Hive tool\n3.8 Airtight fire proof box\nMaterials\n3.9 Wire\n3.10 Nails\n3.11 Box of matches or lighter\n3.12 Smoker fuel\n3.13 Bucket water\n3.14 Soap\n3.15 Towel\n3.16 Bee container\n3.17 Hive box\nEquipment:\n3.18 Bee smoker\n3.19 Bee blower\n3.20 PPE\n Bee veil\n Bee suit\n Masks\n Gloves\n Boots\n Overall coats\n Hat\n Eye goggles\n5. Emergency\nprocedures\n5.1\nLocation of first aid kit\n5.2\nEvacuation\n5.3\nAgencies contract\n5.4\nFarm emergency procedures\n6. Hazards\n6.1\nChemical\n6.2\nElectrical\n6.3\nFalls\n\n--- PDF PAGE 45 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 41\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in designated\nfacilities\n2. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n2.1 Practical demonstration\n2.2 Third Party Report\n3. Resource\nImplications\n3.1 Farm location\n3.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n\n4. Context of\nAssessment\n4.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 46 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 42\nUNIT OF COMPETENCY :\nUSE FARM TOOLS AND EQUIPMENT\nUNIT CODE\n:\n\nAFF321208\nUNIT DESCRIPTOR\n:\n\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of farm\ntools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Select and use\nfarm tools\n\n1.1 Appropriate farm\ntools are identified\naccording to\nrequirement/use\n1.2 Farm tools are\nchecked for faults\nand defective tools\nreported in\naccordance with\nfarm procedures\n1.3 Appropriate tools\nare safely used\naccording to job\nrequirements and\nmanufacturers\nconditions\n1.1 Types and uses of\nfarm tools\n1.2 Characteristics of\nfunctional tools\n1.3 Checking tools for\ndefects/faults\n1.4 Segregation and\nreporting defective\ntools\n1.5 Uses of tools\n1.1 Identifying farm\ntools for the\nwork\n1.2 Checking the\nconditions of\ntools\n1.3 Reporting\ndefective tools\n1.4 Using tools\n2.\nSelect and\noperate farm\nequipment\n2.1 Identify appropriate\ntools and\nequipment\n2.2 Instructional\nmanual of the tools\nand equipment are\ncarefully read prior\nto operation\n2.3 Pre-operation\ncheck-up is\nconducted in line\nwith manufacturers\nmanual\n2.4 Faults in equipment\nare identified and\nreported in line with\nfarm procedures\n2.5 Farm equipment\nused according to\nits function\n2.1 Types and\noperations of farm\nequipment\n2.2 Standards\noperating\nprocedures of farm\nequipment\n2.3 Instructional\nmanual of\nequipment\n2.4 Pre-operation\ncheck-up\n2.5 Equipment\nSpecification\n2.6 Procedures in\ncalibrating and use\nof equipment\n2.7 Equipment faults\nidentification and\nreporting\n2.1 Identifying\nappropriate farm\nequipment for\nthe work\n2.2 Reading\ninstructional\nmanual.\n2.3 Conducting pre-\noperation check-\nup\n2.4 Identifying\nfaults/defects of\nfarm equipment\n2.5 Reporting on\ndefective farm\nequipment\n2.6 Operating farm\nequipment\n2.7 Following safety\nprocedures.\n\n--- PDF PAGE 47 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.6 Safety procedures\nare followed.\n2.8 Operation of\nequipment\n2.9 Codes and\nRegulations on\nenvironmental\nprotection\n2.10 Safety and\nkeeping of\nequipment every\nafter use\n2.11 Safety\nmeasures\n\n3.\nPerform\npreventive\nmaintenance\n3.1 Tools and\nequipment are\ncleaned\nimmediately after\nuse in line with\nfarm procedures\n3.2 Routine check-up\nand maintenance\nare performed\n3.3 Tools and\nequipment are\nstored in\ndesignated areas in\nline with farm\nprocedures\n3.1 Cleaning\nprocedures of tools\nand equipment\n3.2 Maintenance\nprocedures of farm\nequipment\n3.3 Storage of tools\nand equipment\n3.4 Designated\nstorage areas\n\n3.1 Cleaning tools\nand equipment\n3.2 Performing\nroutinely check-\nup of tools and\nequipment\n3.3 Maintaining farm\nequipment\n3.4 Storing tools\nand equipment\n\n--- PDF PAGE 48 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 44\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Farm equipment\n\nMay include:\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n1.5 Bee smoker\n1.6 PPEs\n1.7 Honey extractor\n1.8 Pollen drier\n