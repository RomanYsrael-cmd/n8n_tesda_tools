d\nfollowing industry\npractice\n\n1.2 PPEs are worn\nfollowing industry\nstandards and\nOSHS\n\n1.3 Safety and health\nmeasures are\napplied following\nOSH and PNS for\nCode of Good\nBeekeeping\nPractices\n1.1 Tools and materials\n\n1.2 Wearing of PPEs\n\n1.3 Safety and health\nmeasures\n- OSH\n- PNS for Code of\nGood Beekeeping\nPractices\n\n1.4 Importance on the\navailability of tools,\nmaterials and\nequipment in the\nworkplace\n1.1 Inventorying,\nselecting and\npreparing\ntools,\nmaterials\nand\nequipment\n1.2 Availabity of\ntools,\nmaterials\nand\nequipment\nare ensured\naccording to\nindustry\npractice\n\n1.3 Ensuring\navailability of\ntools,\nmaterials\nand\nequipment\n\n1.4 Wearing of\nPPEs\n\n1.5 Applying\nsafety\npractices\n\n--- PDF PAGE 65 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 60\n2. Assess\nstatus and\nstrength of\ncolony\n2.1 Indicators of a colony\nthat is about to divide\nis determined\nbased on industry\npractice.\n\n2.2 Presence of good\nqueen is confirmed\naccording to industry\nstandard\n\n2.3 Food is checked\nfollowing industy\nstandard\n\n2.4 Presence of pests\nand diseases is\nchecked following\nindusty standard\n\n2.5 Population build up\nis checked according\nto industry standard\n\n2.6 Performance of the\ncolony is monitored\nfollowing industry\nstandard\n\n2.7 Safety and health\nmeasures are\napplied following\nindustry standards\n2.1 Hive manipulation\n\n2.2 Safety and health\nmeasures\n- OSH\n- PNS for Code of\nGood Beekeeping\nPractices\n\n2.3 Good quality queen\n\n2.4 Food of the colony\n-\nhoney and\npollen\n\n2.5 Pests and diseases\n\n2.6 Hive compression\nand expansion\n\n2.7 Population build up\n\n2.8 Performance of the\ncolony\n\n2.1 Ensuring\npresence of\ngood quality of\nqueen\n\n2.2 Checking food\n\n2.3 Checking\npresence of\npests and\ndiseases\n\n2.4 Checking\npopulation build\nup\n\n2.5 Monitoring\nperformance of\ncolony\n\n2.6 Applying safety\npractices\n3. Produce\ncolony\n3.1 Queenless nucs\nc