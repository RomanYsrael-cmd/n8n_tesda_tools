ng bee\nswarm\n\n--- PDF PAGE 61 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 56\nfollowing industry\npractice\n\n6.4 Tools and\nmaterials are used\nfor catching swarm\nfollowing industry\npractice\n\n6.5 Bee swarm is\ncaptured according\nto industry\nstandards.\n\n6.6 Safety practices are\napplied following\nOSHS and PNS for\nCode of Good\nBeekeeping\nPractices\n\n6.6 Safety and health\nmeasures\n- Wearing of PPEs\n- OSH\n- PNS – Code of\nGood Beekeeping\nPractices\n6.5 Applying safety\nand health\nmeasures\n\n--- PDF PAGE 62 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 57\n\nRANGE OF VARIABLES\n\nRANGE\nVARIABLES\n1. Tools, materials and\nequipment\nMay include:\nTools:\n1.1 Hive tool\n1.2 Bee brush\nMaterials\n1.1 Newspaper sheets\n1.2 Hive body\n1.3 Queen cage\n1.4 Queen catcher\n1.5 Feeder\nEquipment:\n1.3 Smoker\n1.4 PPE\n• Bee veil\n• Bee suit\n• Gloves\n2. Treatment and corrective\nmeasures\nMay include:\n2.1 Use of miticides\n2.2 Use of traps for some pests\n2.3 Use of screened bottom board\n2.4 Use of shook swarm method\n3. Preparation of feeds\nMay include:\n3.1 Types of feeds are identified\n• pollen\n• white sugar\n3.2 Proportion of mixture is ensured\n4. Feeder\nMay include:\n4.1 Top feeder\n4.2 Side feeder\n4.3 Baggie feeders\n5. Indicators of requeening\nMay include:\n5.1 Laying pattern\n5.2 Number of eggs laid per day or egg laying\ncapacity\n5.3 Presence of supersedure cells\n6. Indicators of merging colonies\nMay include:\n6.1 Colony is queenless\n6.2 Weak colonies\n7. Indicators of swarming\n\nMay include:\n7.1 Presence of swarm cells\n7.2 Presence of numerous drones\n7.3 Presence of virgin queen\n8. Control measures\nMay include:\n8.1 Expand brood chamber\n\n--- PDF PAGE 63 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 58\n8.2 Destroy queen cells or swarm cells\n8.3 Kill virgin queen\n9. Capture bee swarm\nMay include:\n9.1 Place the two-box hive assembly on the\nground, close to the 