orm basic workplace calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\n1. Perform estimation\n1.1 Job requirements are\nidentified from written or\noral communications\n1.2 Quantities of materials and\nresources required to\ncomplete a work task are\nestimated\n1.3 The time needed to\ncomplete a work activity is\nestimated\n1.4 Accurate estimate for work\ncompletion are made\n1.5 Estimate of materials and\nresources are reported to\nappropriate person\n1.1 Job requirements/labor\nneeds\n1.2 Calculation of quantities of\nmaterials and resources\nrequired\n1.3 Calculation of time for job\ncompletion\n1.4 Preparation of estimate\nreport\n1.5 Basic mathematical\noperations\n1.6 Percentage and ratios\n1.7 Unit Conversion\n\n2. Perform basic\nworkplace calculation\n2.1 System and units of\nmeasurement to be\nfollowed are ascertained\n2.2 Calculation needed to\ncomplete work tasks are\nperformed using the four\nbasic mathematical\noperation\n2.3 Calculate whole fraction,\npercentage and mixed\nwhen are used to complete\nthe instructions\n2.4 Number computed is\nchecked following work\nrequirements\n2.1 Four basic mathematical\noperation\n2.2 System and units of\nmeasurement\n2.3 Fraction, percentage and\nratio\n2.4 Material takeoff\n2.5 Materials costing\n\n--- PDF PAGE 51 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 47\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Four basic\nmathematical operation\n1.1\nAddition\n1.2\nSubtraction\n1.3\nMultiplication\n1.4\nDivision\n2. System of measurement\n2.1 English\n2.2 Metric\n3. Units of measurement\n3.1 Area\n3.2 Volume\n3.3 Weight\n3.4 Length\n\nEVIDENCE GUIDE\n1.\nCritical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2.\nMethod of Assessment\n\nCompetency in this unit must be assessed t