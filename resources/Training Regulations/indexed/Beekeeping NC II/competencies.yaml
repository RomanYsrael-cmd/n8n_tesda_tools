ated (08/11/2020)\n 71\nUNIT OF COMPETENCY\n: PROVIDE POLLINATION SERVICES\nUNIT CODE\n: AFF612312\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto assess pollination service requirement, prepare apiary\nsites and deliver hives to client, monitor pollination\nperformance of bee colonies and complete pollination\nservices. Application of safety measures and practices is\nrequired in performing every task.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange Statement\nREQUIRED\nKNOWLEDGE AND\nATTITUDE\nREQUIRED SKILL\n1. Confirm\npollination\nservice\nrequirement\n\n1.1 Species of bees\ncompatible to the\ncrop to be pollinated\nis identified\naccording to industry\nstandards.\n\n1.2 Pollination services\nare confirmed with\nclients according to\nindustry practice.\n\n1.3 Number, location\nand types of colonies\nare determined\naccording to crop\nrequirement.\n\n1.4 Factors that will\naffect for pollination\nservices are\nidentified according\nto industry\nrequirement.\n\n1.5 Strength, condition\nand health of bee\ncolonies for\npollination services\nare assessed\naccording to industry\npractice\n\n1.6 Risk to pollination\nactivities posed by\nenvironmental\ncondition are\n1.1 Period of anthesis\nand the respective\npollinators of the\ncrop\n1.2 Pollination services\n1.3 Confirmation with\nclients according to\nindustry practice\n1.4 Types of colonies\n1.5 Number and\nlocation of colonies\n1.6 Territory and local\ngovernment\nlegislatives,\nregulatory and\nrequirements\n1.7 Biosecurity\naffecting pollination\nservices\n1.8 Strength, condition\nand health of bee\ncolonies\n1.9 Risk to pollination\nactivities\n1.10 Provision of\ntechnical\ninformation to\nclients\n1.11 Bee performance\nand health\n1.12 Appropriate\ncertificate and\npermits for\ntransport of\ncolonies\n\n1.1 Identifying the\nperiod of\nanthesis and the\nspecies of bees\ncompatible to the\ncrop to be\npollinated\n1.2 Confirming\npollination\nservices\n1.3 Determining\nnumber, location\nand types of\ncolonies\n1.4 Identifying\nfactors affecting\npollination\n1.5 Assessing\nstrength\ncondition and\nhealth of bee\ncolonies\n1.6 Identifying risk to\npollination\n1.7 Monitoring risk\n1.8 Providing\ntechnical\ninformation to\nclient\n\n--- PDF PAGE 75 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 72\nidentified and\nassessed following\nindustry procedure\n\n1.7 Risk is monitored\nand reported\nfollowing industry\nprocedure\n\n1.8 Technical\ninformation is\nprovided to client\nfollowing workplace\nprocedure\n2. Transport\ncolony for\npollination\nservices\n2.1 Schedule of\npollination services\nis confirmed with the\nclients following\nindustry practices.\n\n2.2 Adequate ventilation\nfor hives is provided\nduring transport\n\n2.3 Packaging technique\nis applied during\ntransport according\nto industry standard\n\n2.1 Certificates and\npermits for transport\nare obtained\nfollowing industry\nprocedure\n2.1 Pollination\nrequirements of\ndifferent crops\n\n2.2 Preparation for\nhives to be used\nfor pollination\nservices\n\n2.3 IATA requirements\non packaging and\nair transport of\nbees\n\n2.4 Packaging\ntechnique during\ntransport\n\n2.5 Certificates and\npermits for\ntransport\n\n2.6 Communication\n2.1 Confirming\nschedule of\npollination\nservices\n\n2.2 Providing\nadequate\nventilation during\ntransport\n\n2.3 Applying\nappropriate\npackaging\ntechnique during\ntransport\n\n2.4 Obtaining\ncertificates and\npermits for\ntransport\n\n--- PDF PAGE 76 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 73\n3 Perform\npollination\nservices\n3.1 Colonies are\ndelivered and set up\naccording to\nindustry procedure\n3.2 Spraying programme\nis discussed with\nthe clients to\nminimize damage to\nbees\n3.3 Bee foraging and\npollination efficiency\nis monitored\nfollowing industry\nstandards\n3.4 Care of bees is\ncarried out to ensure\napiary perfromance\nfollowing industry\nprocedure\n