  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in BEEKEEPING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY:\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE :\n400311210\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and\nrelevant information\nis accessed from\nappropriate\nsources\n1.2 Effective\nquestioning, active\nlistening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate\nmedium is used to\ntransfer information\nand ideas\n1.4 Appropriate non-\nverbal\ncommunication is\nused\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and\nfollowed\n1.6 Defined workplace\n1.7 procedures for the\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes\nof communication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken\nlanguage\n1.2 Performing\nroutine\nworkplace\nduties following\nsimple written\nnotices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated\ndocuments\n1.5 Estimating,\ncalculating and\nrecording\nroutine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of\nvarious levels in\nthe workplace\n\n--- PDF PAGE 7 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 3\n1.8 location and\nstorage\n1.9 of information are\nused\n1.10 Personal\ninteraction is\ncarried out clearly\nand concisely\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n1.9 Interpersonal\nskills in the\nworkplace\n1.10 Active-\nlistening skills\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are\nread and\ninterpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are\nfollowed based on\nestablished\nprocedures\n2.3 Feedback is given\nto workplace\nsupervisor based\ninstructions/\ninformation\nreceived\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters concerning\nconditions of\nemployment are\nsought and asked\nfrom appropriate\n2.6 sources\n2.7 Meetings outcomes\nare interpreted and\nimplemented\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes\nof communication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n\n2.1 Following simple\nspoken\ninstructions\n2.2 Performing\nroutine\nworkplace\nduties following\nsimple written\nnotices\n2.3 Participating in\nworkplace\nmeetings and\ndiscussions\n2.4 Completing\nwork- related\ndocuments\n2.5 Estimating,\ncalculating and\nrecording\nroutine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of\nvarious levels in\nthe workplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n\n--- PDF PAGE 8 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 4\n2.8 Basic\nquestioning/query\ning\n2.9 Skills in reading\nfor information\n2.10 Skills in\nlocating\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms\nrelating to\nconditions of\nemployment are\ncompleted\naccurately and\nlegibly\n3.2 Workplace data is\nrecorded on\nstandard workplace\nforms and\ndocuments\n3.3 Errors in recording\ninformation on\nforms/ documents\nare identified and\nacted upon\n3.4 Reporting\nrequirements to\nsupervisor are\ncompleted\naccording to\norganizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes\nof communication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n\n3.1 Completing\nwork- related\ndocuments\n3.2 Applying\noperations of\naddition,\nsubtraction,\ndivision and\nmultiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 9 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 5\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Appropriate sources\nMay include:\n1.1.\nTeam members\n1.2.\nSupervisor/Department Head\n1.3.\nSuppliers\n1.4.\nTrade personnel\n1.5.\nLocal government\n1.6.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation dissemination\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace-to-face communication\n2.7.\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace interactions\nMay include:\n4.1.\nFace-to-face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic means, memos,\ninstruction and forms\n4.5.\nNon-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 10 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 6\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using workplace\ncommunication equipment/systems\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting formal or\ninformal communication\n2. Resource Implications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Notebook\n2.4. Writing materials\n2.5. Computer with Internet connection\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Interview\n3.3. Written test\n3.4. Third-party report\n\n4. Context for Assessment\n4.1. Competency may be assessed individually in the\nactual workplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 7\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\n\nUNIT CODE :\n400311211\n\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify one’s\nroles and responsibilities as a member of a team.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of\nthe workplace\n1.2 Developing\nways in\nimproving work\nstructure and\nperforming\nrespective roles\nin the group or\norganization\n2. Identify\none’s role\nand\nresponsibili\nty within a\nteam\n2.1 Individual roles and\nresponsibilities\nwithin the team\nenvironment are\nidentified\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified based on\nteam discussions\nand appropriate\nexternal sources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of\nthe workplace\n2.2 Developing\nways in\nimproving work\nstructure and\nperforming\nrespective roles\nin the group or\norganization\n\n--- PDF PAGE 12 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 8\n3. Work as a\nteam\nmember\n3.1 Effective and\nappropriate forms\nof communications\nare used and\ninteractions\nundertaken with\nteam members\nbased on company\npractices.\n3.2 Effective and\nappropriate\ncontributions made\nto complement\nteam activities and\nobjectives, based\non workplace\ncontext\n3.3 Protocols in\nreporting are\nobserved based on\nstandard company\npractices.\n3.4 Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding of\nteam’s role and\nobjectives\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning\nand decision\nmaking\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace\ncontext\n\n3.1 Communicating\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and\nas a group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of team May include but not limited to:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of information\nMay include but not limited to:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include but not limited to:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 14 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 10\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Worked in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.2 Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.3 Socio-drama and socio-metric methods\n3.4 Sensitivity techniques\n3.5 Written Test\n4. Context for Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 11\nUNIT OF COMPETENCY : SOLVE/ADDRESS GENERAL WORKPLACE\n\nUNIT CODE :\n400311212\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto apply problem-solving techniques to determine the origin\nof problems and plan for their resolution. It also includes\naddressing procedural problems through documentation, and\nreferral.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify routine\nproblems\n1.1 Routine problems\nor procedural\nproblem areas are\nidentified\n1.2 Problems to be\ninvestigated are\ndefined and\ndetermined\n1.3 Current conditions\nof the problem are\nidentified and\ndocumented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk\npractices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n1.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n1.2 Identifying\ncurrent industry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions\nand resolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n\n--- PDF PAGE 16 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 12\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential solutions\nto problem are\nidentified\n2.2 Recommendations\nabout possible\nsolutions are\ndeveloped,\ndocumented,\nranked and\npresented to\nappropriate\nperson for decision\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating\nsystems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating\nsystem\n2.4 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions\nand resolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are\nplanned\n3.2 Evaluation of\nimplemented\nsolutions are\nplanned\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to\nappropriate person\nfor confirmation\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat\nrecommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 17 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 13\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include but not limited to:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and incidents\n1.5\n Work-related problems outside of own work area\n2. Appropriate person\nMay include but not limited to:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include but not limited to:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include but not limited to:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 18 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 14\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends\nsolutions to problems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n2. Resource Implications\n2.1. Assessment will require access to a workplace over\nan extended period, or a suitable method of\ngathering evidence of operating ability over a range\nof situations.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nCase Formulation\n3.2\nLife Narrative Inquiry\n3.3\nStandardized test\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n4. Context for Assessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions.\n\n--- PDF PAGE 19 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 15\nUNIT OF COMPETENCY : DEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE :\n400311213\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice,\nand\nboosting\nself-confidence\nand\ndeveloping\nself-\nregulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and\nto show initiative, to\nbe conscientious,\nand persevering in\nthe face of setbacks\nand frustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined\n\n1.1 Self-management\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling negative\nemotions and\nunpleasant\nsituation in the\nworkplace such\nas frustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve\npersonal and\ncareer goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n2. Develop\nreflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\n2.1 Basic SWOT\nanalysis\n2.1 Using the basic\nSWOT analysis\nas self-\n\n--- PDF PAGE 20 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 16\nassessment\nstrategies and\nteacher feedback\nare contemplated\n2.2 Progress when\nseeking and\nresponding to\nfeedback from\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and\ndecision making\nstrategies and\nfeedback from\npeers and teachers\nare predicted\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\nConclusion, and\nAction plan)\nassessment\nstrategy\n2.2 Developing\nreflective\npractice through\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able\nto accept\nchallenges\n\n3. Boost self-\nconfidence\nand develop\nself-regulation\n3.1 Efforts for\ncontinuous self-\nimprovement are\ndemonstrated\n3.2 Counter-productive\ntendencies at work\nare eliminated\n3.3 Positive outlook in\nlife are maintained.\n\n3.1 Four components\nof self-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g., 7\nHabits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting,\nconversing skills\n\n3.2 Showing\naffective skills –\nflexibility,\nadaptability, etc.\n\n3.3 Self-assessment\nfor determining\none’s strengths\nand\nweaknesses\n\n--- PDF PAGE 21 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 17\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include but not limited to:\n1.1\nSeeking assistance in the form of job coaching or\nmentoring\n1.2\nContinuing dialogue to tackle workplace\ngrievances\n1.3\nCollective negotiation/bargaining for better\nworking conditions\n1.4\nShare your goals to improve with a trusted co-\nworker or supervisor\n1.5\nMake a negativity log of every instance when you\ncatch yourself complaining to others\n1.6\nMake lists and schedules for necessary activities\n2. Unpleasant situation\nMay include but not limited to:\n2.1\nJob burn-out\n2.2\nDrug dependence\n2.3\nSulking\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-\ndiscipline\n2. Resource Implications\nThe following resources should be provided:\n2.1. Access to workplace and resource s\n2.2. Case studies\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration or simulation with oral questioning\n3.2. Case problems involving work improvement and\nsustainability issues\n3.3. Third-party report\n4. Context for Assessment\n4.1. Competency assessment may occur in workplace\nor any appropriately simulated environment\n\n--- PDF PAGE 22 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 18\nUNIT OF COMPETENCY : CONTRIBUTE TO WORKPLACE INNOVATION\n\nUNIT CODE :\n400311214\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto make a pro-active and positive contribution to workplace\ninnovation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nopportunities to\ndo things better.\n1.1 Opportunities for\nimprovement are\nidentified\nproactively in own\narea of work.\n1.2 Information are\ngathered and\nreviewed which\nmay be relevant to\nideas and which\nmight assist in\ngaining support for\nidea.\n1.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n1.2 Positive impacts\nand challenges in\ninnovation.\n1.3 Types of changes\nand responsibility.\n1.4 Seven habits of\nhighly effective\npeople.\n\n1.1 Identifying\nopportunities to\nimprove and to\ndo things better.\nInvolvement.\n1.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation.\n1.3 Identifying\nexamples of the\ntypes of\nchanges that\nare within and\noutside own\nscope of\nresponsibility\n2. Discuss and\ndevelop ideas\nwith others\n2.1 People who could\nprovide input to\nideas for\nimprovements are\nidentified.\n2.2 Ways of\napproaching people\nto begin sharing\nideas are selected.\n2.3 Meeting is set with\nrelevant people.\n2.4 Ideas for follow up\nare review and\nselected based on\nfeedback.\n2.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n2.2 Positive impacts\nand challenges in\ninnovation.\n2.3 Types of changes\nand responsibility.\n2.4 Seven habits of\nhighly effective\npeople.\n\n2.1 Identifying\nopportunities to\nimprove and to\ndo things better.\nInvolvement.\n2.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation.\n2.3 Providing\nexamples of the\ntypes of\nchanges that\nare within and\n\n--- PDF PAGE 23 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 19\n2.5 Critical inquiry\nmethod is used to\ndiscuss and\ndevelop ideas with\nothers.\noutside own\nscope of\nresponsibility\n2.4 Communicating\nideas for\nchange through\nsmall group\ndiscussions and\nmeetings.\n3. Integrate\nideas for\nchange in the\nworkplace.\n3.1 Critical inquiry\nmethod is used to\nintegrate different\nideas for change of\nkey people.\n3.2 Summarizing,\nanalyzing and\ngeneralizing skills\nare used to extract\nsalient points in the\npool of ideas.\n3.3 Reporting skills\nare likewise used to\ncommunicate\nresults.\n3.4 Current Issues\nand concerns on\nthe systems,\nprocesses and\nprocedures, as well\nas the need for\nsimple innovative\npractices are\nidentified.\n3.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n3.2 Positive impacts\nand challenges in\ninnovation.\n3.3 Types of changes\nand responsibility.\n3.4 Seven habits of\nhighly effective\npeople.\n3.5 Basic research\nskills.\n3.1 Identifying\nopportunities to\nimprove and to\ndo things better.\nInvolvement.\n3.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation.\n3.3 Providing\nexamples of the\ntypes of\nchanges that\nare within and\noutside own\nscope of\nresponsibility.\n3.4 Communicating\nideas for\nchange through\nsmall group\ndiscussions and\nmeetings.\n3.5 Demonstrating\nskills in analysis\nand\ninterpretation of\ndata.\n\n--- PDF PAGE 24 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 20\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Opportunities for\nimprovement\nMay include:\n1.1 Systems\n1.2 Processes\n1.3 Procedures\n1.4 Protocols\n1.5 Codes\n1.6 Practices\n2. Information\nMay include:\n2.1 Workplace communication problems.\n2.2 Performance evaluation results.\n2.3 Team dynamics issues and concerns.\n2.4 Challenges on return of investment\n2.5 New tools, processes and procedures.\n2.6 New people in the organization.\n3. People who could provide\ninput\nMay include:\n3.1 Leaders.\n3.2 Managers.\n3.3 Specialists.\n3.4 Associates.\n3.5 Researchers.\n3.6 Supervisors.\n3.7 Staff.\n3.8 Consultants (external)\n3.9 People outside the organization in the same field or\nsimilar expertise/industry.\n3.10 Clients\n4. Critical inquiry method\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See our pages:\nVerbal Communication and Effective Speaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key part of\neffective negotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 25 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 21\n5. Reporting skills\nMay include:\n5.1\nData management.\n5.2\nCoding.\n5.3\nData analysis and interpretation.\n5.4\nCoherent writing.\n5.5\nSpeaking.\n\n--- PDF PAGE 26 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 22\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified opportunities to do things better.\n1.2\nDiscussed and developed ideas with others on\nhow to contribute to workplace innovation.\n1.3\nIntegrated ideas for change in the workplace.\n1.4\nAnalyzed and reported rooms for innovation and\nlearning in the workplace.\n2. Resource Implications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nPsychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party\nworkplace reports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character strengths\nand virtues applied.\n4. Context for Assessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions.\n\n--- PDF PAGE 27 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 23\nUNIT OF COMPETENCY : PRESENT RELEVANT INFORMATION\n\nUNIT CODE :\n400311215\n\nUNIT DESCRIPTOR :\nThis unit of covers the knowledge, skills and attitudes\nrequired to present data/information appropriately.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Gather data/\ninformation\n1.1 Evidence, facts\nand information\nare collected\n1.2 Evaluation, terms\nof reference and\nconditions are\nreviewed to\ndetermine\nwhether\ndata/information\nfalls within project\nscope\n\n1.1 Organisational\nprotocols\n1.2 Confidentiality\n1.3 Accuracy\n1.4 Business\nmathematics and\nstatistics\n1.5 Data analysis\ntechniques/proced\nures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n1.8 Organisational\nvalues, ethics and\ncodes of conduct\n\n1.1 Describing\norganisational\nprotocols relating\nto client liaison\n1.2 Protecting\nconfidentiality\n1.3 Describing\naccuracy\n1.4 Computing\nbusiness\nmathematics and\nstatistics\n1.5 Describing data\nanalysis\ntechniques/\nprocedures\n1.6 Reporting\nrequirements to a\nrange of\naudiences\n1.7 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n1.8 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n\n--- PDF PAGE 28 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 24\n2. Assess\ngathered data/\ninformation\n2.1 Validity of data/\ninformation is\nassessed\n2.2 Analysis\ntechniques are\napplied to assess\ndata/ information.\n2.3 Trends and\nanomalies are\nidentified\n2.4 Data analysis\ntechniques and\nprocedures are\ndocumented\n2.5 Recommendation\ns are made on\nareas of possible\nimprovement.\n\n2.1 Business\nmathematics and\nstatistics\n2.2 Data analysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\nvalues, ethics and\ncodes of conduct\n2.1 Computing\nbusiness\nmathematics and\nstatistics\n2.2 Describing data\nanalysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of\naudiences\n2.4 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n2.5 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n3. Record and\npresent\ninformation\n3.1 Studied\ndata/information\nare recorded.\n3.2 Recommendation\ns are analysed for\naction to ensure\nthey are\ncompatible with\nthe project’s\nscope and terms\nof reference.\n3.3 Interim and final\nreports are\nanalysed and\noutcomes are\ncompared to the\ncriteria\nestablished at the\noutset.\n3.4 Findings are\npresented to\nstakeholders.\n\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n3.4 Organisational\nvalues, ethics and\ncodes of conduct\n\n3.1 Describing data\nanalysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of\naudiences\n3.3 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n3.4 Stating\norganisational\nvalues, ethics and\ncodes of conduct\npractices\n\n--- PDF PAGE 29 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 25\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Data analysis techniques\nMay include but not limited to:\n1.1. Domain analysis\n1.2. Content analysis\n1.3. Comparison technique\n\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studied data/information\nThese aspects may be best assessed using a range of\nscenarios what ifs as a stimulus with a walk through\nforming part of the response. These assessment\nactivities should include a range of problems, including\nnew, unusual and improbable situations that may have\nhappened.\n2. Resource Implications\nSpecific resources for assessment\n2.1. Evidence of competent performance should be\nobtained by observing an individual in an\ninformation management role within the workplace\nor operational or simulated environment.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Written Test\n3.2. Interview\n3.3. Portfolio\n\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will\noccur over a range of situations, which will include\ndisruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this\nunit of competency. Simulation should be based on the\nactual workplace and will include walk through of the\nrelevant competency components.\n4. Context for Assessment\n4.1. In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 30 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 26\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND HEALTH\nPOLICIES AND PROCEDURES\n\nUNIT CODE :\n400311216\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to identify OSH compliance requirements,\nprepare OSH requirements for compliance, perform\ntasks in accordance with relevant OSH policies and\nprocedures.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations,\npolicies and\nprocedures are\nidentified in\naccordance with\nworkplace policies\nand procedures\n1.2 OSH activity non-\nconformities are\nconveyed to\nappropriate\npersonnel\n1.3 OSH preventive\nand control\nrequirements are\nidentified in\naccordance with\nOSH work policies\nand procedures\n1.1. OSH preventive\nand control\nrequirements\n1.2. Hierarchy of\nControls\n1.3. Hazard Prevention\nand Control\n1.4. General OSH\nprinciples\n1.5. Work standards\nand procedures\n1.6. Safe handling\nprocedures of\ntools, equipment\nand materials\n1.7. Standard\nemergency plan\nand procedures in\nthe workplace\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n\n2. Prepare OSH\nrequirements\nfor\ncompliance\n\n2.1 OSH work activity\nmaterial, tools and\nequipment\nrequirements are\nidentified in\naccordance with\nworkplace policies\nand procedures\n2.2 Required OSH\nmaterials, tools\n2.1 Resources\nnecessary to\nexecute hierarchy\nof controls\n2.2 General OSH\nprinciples\n2.3 Work standards\nand procedures\n2.4 Safe handling\nprocedures of\n2.1 Communication\nskills\n2.2 Estimation skills\n2.3 Interpersonal\nskills\n2.4 Critical thinking\nskills\n2.5 Observation\nskills\n\n--- PDF PAGE 31 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 27\nand equipment are\nacquired in\naccordance with\nworkplace policies\nand procedures\n2.3 Required OSH\nmaterials, tools\nand equipment are\narranged/ placed\nin accordance with\nOSH work\nstandards\ntools, equipment\nand materials\n2.5 Different OSH\ncontrol measures\n2.6 Material, tool\nand equipment\nidentification\nskills\n\n3. Perform tasks\nin accordance\nwith relevant\nOSH policies\nand\nprocedures\n\n3.1 Relevant OSH\nwork procedures\nare identified in\naccordance with\nworkplace policies\nand procedures\n3.2 Work Activities are\nexecuted in\naccordance with\nOSH work\nstandards\n3.3 Non-compliance\nwork activities\nare reported to\nappropriate\npersonnel\n3.1 OSH work\nstandards\n3.2 Industry related\nwork activities\n3.3 General OSH\nprinciples\n3.4 OSH Violations\n3.5 Non-compliance\nwork activities\n3.1 Communication\nskills\n3.2 Interpersonal\nskills\n3.3 Troubleshooting\nskills\n3.4 Critical thinking\nskills\n3.5 Observation\nskills\n\n--- PDF PAGE 32 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 28\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies and\nProcedures\nMay include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPermit to Operate\n1.6\nPhilippine Occupational Safety and Health\nStandards\n1.7\nDepartment Order No. 13 (Construction Safety and\nHealth)\n1.8\nECC regulations\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n3. OSH Preventive and\nControl Requirements\nMay include:\n3.1 Resources needed for removing hazard effectively\n3.2 Resources needed for substitution or replacement\n3.3 Resources needed to establishing engineering\ncontrols\n3.4 Resources needed for enforcing administrative\ncontrols\n3.5 Personal Protective equipment\n4. Non OSH-Compliance\nWork Activities\nMay include non-compliance or observance of the\nfollowing safety measures:\n4.1 Violations that may lead to serious physical harm or\ndeath\n4.2 Fall Protection\n4.3 Hazard Communication\n4.4 Respiratory Protection\n4.5 Power Industrial Trucks\n4.6 Lockout/Tag-out\n4.7 Working at heights (use of ladder, scaffolding)\n4.8 Electrical Wiring Methods\n4.9 Machine Guarding\n4.10 Electrical General Requirements\n4.11 Asbestos work requirements\n4.12 Excavations work requirements\n\n--- PDF PAGE 33 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 29\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Convey OSH work non-conformities to appropriate\npersonnel\n1.2. Identify OSH preventive and control requirements in\naccordance with OSH work policies and procedures\n1.3. Identify OSH work activity material, tools and\nequipment requirements in accordance with\nworkplace policies and procedures\n1.4. Arrange/Place required OSH materials, tools and\nequipment in accordance with OSH work standards\n1.5. Execute work activities in accordance with OSH\nwork standards\n1.6. Report OSH activity non-compliance work activities\nto appropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary\nfor the activity\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 34 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 30\nUNIT OF COMPETENCY : EXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE\nPRACTICES IN THE WORKPLACE\n\nUNIT CODE :\n400311217\n\nUNIT DESCRIPTOR :\nThis unit covers knowledge, skills and attitude to identify the\nefficiency and effectiveness of resource utilization,\ndetermine causes of inefficiency and/or ineffectiveness of\nresource utilization and convey inefficient and ineffective\nenvironmental practices\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nefficiency and\neffectiveness\nof resource\nutilization\n\n1.1 Required\nresource\nutilization in the\nworkplace is\nmeasured using\nappropriate\ntechniques\n1.2 Data are recorded\nin accordance\nwith workplace\nprotocol\n1.3 Recorded data\nare compared to\ndetermine the\nefficiency and\neffectiveness of\nresource\nutilization\naccording to\nestablished\nenvironmental\nwork\nprocedures\n1.1 Importance of\nEnvironmental\nLiteracy\n1.2 Environmental\nWork Procedures\n1.3 Waste\nMinimization\n1.4 Efficient Energy\nConsumptions\n1.1 Recording Skills\n1.2 Writing Skills\n1.3 Innovation Skills\n\n2. Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n2.1 Potential causes\nof inefficiency\nand/or\nineffectiveness\nare listed\n2.2 Causes of\ninefficiency\nand/or\n2.1 Causes of\nenvironmental\ninefficiencies and\nineffectiveness\n\n2.1 Deductive\nReasoning Skills\n2.2 Critical thinking\n2.3 Problem Solving\n2.4 Observation\nSkills\n\n--- PDF PAGE 35 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 31\nineffectiveness\nare identified\nthrough deductive\nreasoning\n2.3 Identified causes\nof inefficiency\nand/or\nineffectiveness\nare validated thru\nestablished\nenvironmental\nprocedures\n3. Convey\ninefficient and\nineffective\nenvironmental\npractices\n\n3.1 Efficiency and\neffectiveness of\nresource\nutilization are\nreported to\nappropriate\npersonnel\n3.2 Concerns related\nresource\nutilization are\ndiscussed with\nappropriate\npersonnel\n3.3 Feedback on\ninformation/\nconcerns raised\nare clarified with\nappropriate\npersonnel\n3.1 Appropriate\nPersonnel to\naddress the\nenvironmental\nhazards\n3.2 Environmental\ncorrective actions\n3.1 Written and Oral\nCommunication\nSkills\n3.2 Critical thinking\n3.3 Problem\nSolving\n3.4 Observation\nSkills\n3.5 Practice\nEnvironmental\nAwareness\n\n--- PDF PAGE 36 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 32\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1 Utilization of Energy, Water, Fuel Procedures\n1.2 Waster Segregation Procedures\n1.3 Waste Disposal and Reuse Procedures\n1.4 Waste Collection Procedures\n1.5 Usage of Hazardous Materials Procedures\n1.6 Chemical Application Procedures\n1.7 Labeling Procedures\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Measured required resource utilization in the\nworkplace using appropriate techniques\n1.2. Recorded data in accordance with workplace\nprotocol\n1.3. Identified causes of inefficiency and/or\nineffectiveness through deductive reasoning\n1.4. Validate the identified causes of inefficiency and/or\nineffectiveness thru established environmental\nprocedures\n1.5. Report efficiency and effectives of resource\nutilization to appropriate personnel\n1.6. Clarify feedback on information/concerns raised\nwith appropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1\nWorkplace\n2.2\nTools, materials and equipment relevant to the\ntasks\n2.3\nPPE\n2.4\nManuals and references\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration\n3.2\nOral questioning\n\n--- PDF PAGE 37 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 33\n3.3\nWritten examination\n4. Context for Assessment\n4.1 Competency assessment may occur in workplace\nor any appropriately simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 38 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 34\nUNIT OF COMPETENCY : 