          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Conducted preparatory activities\n1.2 Assessed status and strength of colony\n1.3 Produced colony\n1.4 Maintained newly established colony\n1.5 Applied safety and health measures\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, equipment, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References and manuals\n2.4 First aid kit\n3. Methods of\nAssessment\nCompetency in this unit should be assessed through:\n3.1 Demonstration/ direct observation with oral\nquestioning\n3.2 Written exam\n4. Context of Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 69 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 66\nUNIT OF COMPETENCY\n: CONDUCT HARVESTING OPERATION\nUNIT CODE\n:"
