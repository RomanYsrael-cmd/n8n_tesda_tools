        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Worked in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.2 Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.3 Socio-drama and socio-metric methods\n3.4 Sensitivity techniques\n3.5 Written Test\n4. Context for Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 11\nUNIT OF COMPETENCY : SOLVE/ADDRESS GENERAL WORKPLACE\n\nUNIT CODE :"
        },
        "source_text": "400311211\n\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify one’s\nroles and responsibilities as a member of a team.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of\nthe workplace\n1.2 Developing\nways in\nimproving work\nstructure and\nperforming\nrespective roles\nin the group or\norganization\n2. Identify\none’s role\nand\nresponsibili\nty within a\nteam\n2.1 Individual roles and\nresponsibilities\nwithin the team\nenvironment are\nidentified\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified based on\nteam discussions\nand appropriate\nexternal sources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of\nthe workplace\n2.2 Developing\nways in\nimproving work\nstructure and\nperforming\nrespective roles\nin the group or\norganization\n\n--- PDF PAGE 12 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 8\n3. Work as a\nteam\nmember\n3.1 Effective and\nappropriate forms\nof communications\nare used and\ninteractions\nundertaken with\nteam members\nbased on company\npractices.\n3.2 Effective and\nappropriate\ncontributions made\nto complement\nteam activities and\nobjectives, based\non workplace\ncontext\n3.3 Protocols in\nreporting are\nobserved based on\nstandard company\npractices.\n3.4 Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding of\nteam’s role and\nobjectives\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning\nand decision\nmaking\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace\ncontext\n\n3.1 Communicating\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and\nas a group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of team May include but not limited to:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of information\nMay include but not limited to:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include but not limited to:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 14 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 10\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Worked in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.2 Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.3 Socio-drama and socio-metric methods\n3.4 Sensitivity techniques\n3.5 Written Test\n4. Context for Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 11\nUNIT OF COMPETENCY : SOLVE/ADDRESS GENERAL WORKPLACE\n\nUNIT CODE :"
