        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified opportunities to do things better.\n1.2\nDiscussed and developed ideas with others on\nhow to contribute to workplace innovation.\n1.3\nIntegrated ideas for change in the workplace.\n1.4\nAnalyzed and reported rooms for innovation and\nlearning in the workplace.\n2. Resource Implications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nPsychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party\nworkplace reports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character strengths\nand virtues applied.\n4. Context for Assessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions.\n\n--- PDF PAGE 27 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 23\nUNIT OF COMPETENCY : PRESENT RELEVANT INFORMATION\n\nUNIT CODE :"
        },
        "source_text": "400311214\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto make a pro-active and positive contribution to workplace\ninnovation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nopportunities to\ndo things better.\n1.1 Opportunities for\nimprovement are\nidentified\nproactively in own\narea of work.\n1.2 Information are\ngathered and\nreviewed which\nmay be relevant to\nideas and which\nmight assist in\ngaining support for\nidea.\n1.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n1.2 Positive impacts\nand challenges in\ninnovation.\n1.3 Types of changes\nand responsibility.\n1.4 Seven habits of\nhighly effective\npeople.\n\n1.1 Identifying\nopportunities to\nimprove and to\ndo things better.\nInvolvement.\n1.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation.\n1.3 Identifying\nexamples of the\ntypes of\nchanges that\nare within and\noutside own\nscope of\nresponsibility\n2. Discuss and\ndevelop ideas\nwith others\n2.1 People who could\nprovide input to\nideas for\nimprovements are\nidentified.\n2.2 Ways of\napproaching people\nto begin sharing\nideas are selected.\n2.3 Meeting is set with\nrelevant people.\n2.4 Ideas for follow up\nare review and\nselected based on\nfeedback.\n2.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n2.2 Positive impacts\nand challenges in\ninnovation.\n2.3 Types of changes\nand responsibility.\n2.4 Seven habits of\nhighly effective\npeople.\n\n2.1 Identifying\nopportunities to\nimprove and to\ndo things better.\nInvolvement.\n2.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation.\n2.3 Providing\nexamples of the\ntypes of\nchanges that\nare within and\n\n--- PDF PAGE 23 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 19\n2.5 Critical inquiry\nmethod is used to\ndiscuss and\ndevelop ideas with\nothers.\noutside own\nscope of\nresponsibility\n2.4 Communicating\nideas for\nchange through\nsmall group\ndiscussions and\nmeetings.\n3. Integrate\nideas for\nchange in the\nworkplace.\n3.1 Critical inquiry\nmethod is used to\nintegrate different\nideas for change of\nkey people.\n3.2 Summarizing,\nanalyzing and\ngeneralizing skills\nare used to extract\nsalient points in the\npool of ideas.\n3.3 Reporting skills\nare likewise used to\ncommunicate\nresults.\n3.4 Current Issues\nand concerns on\nthe systems,\nprocesses and\nprocedures, as well\nas the need for\nsimple innovative\npractices are\nidentified.\n3.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements.\n3.2 Positive impacts\nand challenges in\ninnovation.\n3.3 Types of changes\nand responsibility.\n3.4 Seven habits of\nhighly effective\npeople.\n3.5 Basic research\nskills.\n3.1 Identifying\nopportunities to\nimprove and to\ndo things better.\nInvolvement.\n3.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation.\n3.3 Providing\nexamples of the\ntypes of\nchanges that\nare within and\noutside own\nscope of\nresponsibility.\n3.4 Communicating\nideas for\nchange through\nsmall group\ndiscussions and\nmeetings.\n3.5 Demonstrating\nskills in analysis\nand\ninterpretation of\ndata.\n\n--- PDF PAGE 24 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 20\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Opportunities for\nimprovement\nMay include:\n1.1 Systems\n1.2 Processes\n1.3 Procedures\n1.4 Protocols\n1.5 Codes\n1.6 Practices\n2. Information\nMay include:\n2.1 Workplace communication problems.\n2.2 Performance evaluation results.\n2.3 Team dynamics issues and concerns.\n2.4 Challenges on return of investment\n2.5 New tools, processes and procedures.\n2.6 New people in the organization.\n3. People who could provide\ninput\nMay include:\n3.1 Leaders.\n3.2 Managers.\n3.3 Specialists.\n3.4 Associates.\n3.5 Researchers.\n3.6 Supervisors.\n3.7 Staff.\n3.8 Consultants (external)\n3.9 People outside the organization in the same field or\nsimilar expertise/industry.\n3.10 Clients\n4. Critical inquiry method\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See our pages:\nVerbal Communication and Effective Speaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key part of\neffective negotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 25 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 21\n5. Reporting skills\nMay include:\n5.1\nData management.\n5.2\nCoding.\n5.3\nData analysis and interpretation.\n5.4\nCoherent writing.\n5.5\nSpeaking.\n\n--- PDF PAGE 26 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 22\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified opportunities to do things better.\n1.2\nDiscussed and developed ideas with others on\nhow to contribute to workplace innovation.\n1.3\nIntegrated ideas for change in the workplace.\n1.4\nAnalyzed and reported rooms for innovation and\nlearning in the workplace.\n2. Resource Implications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nPsychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party\nworkplace reports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character strengths\nand virtues applied.\n4. Context for Assessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions.\n\n--- PDF PAGE 27 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 23\nUNIT OF COMPETENCY : PRESENT RELEVANT INFORMATION\n\nUNIT CODE :"
