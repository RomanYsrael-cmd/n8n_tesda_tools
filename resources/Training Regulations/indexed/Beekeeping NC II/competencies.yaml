        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in designated\nfacilities\n2. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n2.1 Practical demonstration\n2.2 Third Party Report\n3. Resource\nImplications\n3.1 Farm location\n3.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n\n4. Context of\nAssessment\n4.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 46 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 42\nUNIT OF COMPETENCY :\nUSE FARM TOOLS AND EQUIPMENT\nUNIT CODE\n:"
        },
        "source_text": "AFF321207\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto perform safety measures effectively and efficiently. It\nincludes identifying areas, tools, materials, time and place in\nperforming safety measures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nDetermine\nareas of\nconcern for\nsafety\nmeasures\n1.1 Work tasks are\nidentified in line with\nfarm operations\n1.2 Place for safety\nmeasures are\ndetermined in line\nwith farm\noperations\n1.3 Time for safety\nmeasures are\ndetermined in line\nwith farm\noperations\n1.4 Appropriate tools,\nmaterials and\noutfits are\nprepared in line with\njob requirements\n1.1 Different work tasks\nin farm operations\n1.2 Place and time for\nimplementation of\nsafety measures\n1.3 Different hazards in\nthe workplace\n1.4 Types of tools,\nmaterials and\noutfits\n1.5 Preparation of\ntools, materials and\noutfits\n\n1.1 Identifying work\ntasks in farm\noperations\n1.2 Determining\nplace and time\nfor\nimplementation\nof safety\nmeasures\n1.3 Reading labels,\nmanuals and\nother basic\nsafety\ninformation\n1.4 Identifying\neffective/\nfunctional tools,\nmaterials and\noutfit\n1.5 Preparing tools,\nmaterials and\noutfits\n1.6 Discarding\ndefective tools,\nand materials\n\n--- PDF PAGE 42 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 38\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Apply\nappropriate\nsafety\nmeasures\n2.1 Tools and materials\nare used according\nto specifications and\nprocedures\n2.2 Outfits are worn\naccording to farm\nrequirements\n2.3 Effectivity/shelf\nlife/expiration of\nmaterials are strictly\nobserved\n2.4 Emergency\nprocedures are\nknown and followed\nto ensure a safe\nwork requirement\n2.5 Hazards in the\nworkplace are\nidentified and\nreported in line with\nfarm guidelines\n2.1 Uses and functions\nof tools\n2.2 Outfits and how to\nwear it.\n2.3 Expiration/shelf life\nof materials\n2.4 Proper disposal of\nexpired materials\n2.5 Environmental rules\nand regulations\n2.6 Emergency\nprocedures\n2.7 Hazards\nidentification and\nreporting\n2.8 Communication\nskills\n2.9 OSHS\n\n2.1 Using tools and\nmaterials in the\nworkplace\n2.2 Wearing of\noutfits\n2.3 Observing\nexpiration/shelf\nlife of materials\n2.4 Disposing of\nexpired\nmaterials\n2.5 Following\nemergency\nprocedures\n2.6 Identifying and\nreporting of\nhazards in\nworkplace area.\n3. Safekeep\n/dispose\ntools,\nmaterials\nand outfit\n3.1 Used tools and outfit\nare cleaned after\nuse and stored in\ndesignated areas.\n3.2 Unused materials\nare properly labeled\nand stored\naccording to\nmanufacturer’s\nrecommendation\nand farm\nrequirements.\n3.3 Waste materials are\ndisposed according\nto manufacturers,\ngovernment and\nfarm requirements.\n3.1 Procedures of\ncleaning used tools\nand outfits\n3.2 Label and storage\nunused materials\n3.3 Disposal of wastes\nmaterials\n3.4 Manufacturers’\nrecommendation on\nkeeping materials\n3.5 Environmental rules\nand regulations\n3.1 Cleaning used\ntools and outfit\n3.2 Labelling and\nstoring unused\nmaterials\n3.3 Disposing\nwaste\nmaterials\n\n--- PDF PAGE 43 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 39\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the subsectors:\n1.1 Crop Production\n1.2 Post –harvesting\n1.3 Agri-marketing\n1.4 Farm equipment\n1.5 Follow routine apiary procedure\n1.6 Maintain bee forage resources\n1.7 Control bee pests and diseases\n1.8 Provide feeding supplement\n1.9 Divide the colony\n1.10 Introduce new queen\n1.11 Harvest and process bee products\n1.12 Optimize colonies to be used for pollination\nservices\n2. Place\nMay include:\n2.1\nStock room/storage areas/warehouse\n2.2\nField/farm/orchard\n3. Time\nMay include:\n3.1 Fertilizer and pesticides application\n3.2 Feed mixing and feeding\n3.3 Harvesting and hauling\n3.4 Building up of starter colonies\n3.5 Adding frames and wax foundation sheets\n3.6 Supplemental feeding of the colonies\n3.7 Control of bee mites and diseases\n3.8 Placement of super and additional frames with wax\nfoundation\n3.9 Swarm control\n3.10 Honey harvesting and processing\n3.11 Splitting of the colony\n\n--- PDF PAGE 44 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 40\n4.\nTools, materials and\noutfit\nTools\n3.1 Wrenches\n3.2 Screw driver\n3.3 Pliers\n3.4 Multi scraper (hive tool- can be fabricated)\n3.5 Bee brush\n3.6 Hive brush\n3.7 Hive tool\n3.8 Airtight fire proof box\nMaterials\n3.9 Wire\n3.10 Nails\n3.11 Box of matches or lighter\n3.12 Smoker fuel\n3.13 Bucket water\n3.14 Soap\n3.15 Towel\n3.16 Bee container\n3.17 Hive box\nEquipment:\n3.18 Bee smoker\n3.19 Bee blower\n3.20 PPE\n Bee veil\n Bee suit\n Masks\n Gloves\n Boots\n Overall coats\n Hat\n Eye goggles\n5. Emergency\nprocedures\n5.1\nLocation of first aid kit\n5.2\nEvacuation\n5.3\nAgencies contract\n5.4\nFarm emergency procedures\n6. Hazards\n6.1\nChemical\n6.2\nElectrical\n6.3\nFalls\n\n--- PDF PAGE 45 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 41\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in designated\nfacilities\n2. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n2.1 Practical demonstration\n2.2 Third Party Report\n3. Resource\nImplications\n3.1 Farm location\n3.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n\n4. Context of\nAssessment\n4.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 46 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 42\nUNIT OF COMPETENCY :\nUSE FARM TOOLS AND EQUIPMENT\nUNIT CODE\n:"
