        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-\ndiscipline\n2. Resource Implications\nThe following resources should be provided:\n2.1. Access to workplace and resource s\n2.2. Case studies\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration or simulation with oral questioning\n3.2. Case problems involving work improvement and\nsustainability issues\n3.3. Third-party report\n4. Context for Assessment\n4.1. Competency assessment may occur in workplace\nor any appropriately simulated environment\n\n--- PDF PAGE 22 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 18\nUNIT OF COMPETENCY : CONTRIBUTE TO WORKPLACE INNOVATION\n\nUNIT CODE :"
        },
        "source_text": "400311213\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice,\nand\nboosting\nself-confidence\nand\ndeveloping\nself-\nregulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and\nto show initiative, to\nbe conscientious,\nand persevering in\nthe face of setbacks\nand frustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined\n\n1.1 Self-management\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling negative\nemotions and\nunpleasant\nsituation in the\nworkplace such\nas frustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve\npersonal and\ncareer goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n2. Develop\nreflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\n2.1 Basic SWOT\nanalysis\n2.1 Using the basic\nSWOT analysis\nas self-\n\n--- PDF PAGE 20 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 16\nassessment\nstrategies and\nteacher feedback\nare contemplated\n2.2 Progress when\nseeking and\nresponding to\nfeedback from\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and\ndecision making\nstrategies and\nfeedback from\npeers and teachers\nare predicted\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\nConclusion, and\nAction plan)\nassessment\nstrategy\n2.2 Developing\nreflective\npractice through\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able\nto accept\nchallenges\n\n3. Boost self-\nconfidence\nand develop\nself-regulation\n3.1 Efforts for\ncontinuous self-\nimprovement are\ndemonstrated\n3.2 Counter-productive\ntendencies at work\nare eliminated\n3.3 Positive outlook in\nlife are maintained.\n\n3.1 Four components\nof self-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g., 7\nHabits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting,\nconversing skills\n\n3.2 Showing\naffective skills –\nflexibility,\nadaptability, etc.\n\n3.3 Self-assessment\nfor determining\none’s strengths\nand\nweaknesses\n\n--- PDF PAGE 21 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 17\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include but not limited to:\n1.1\nSeeking assistance in the form of job coaching or\nmentoring\n1.2\nContinuing dialogue to tackle workplace\ngrievances\n1.3\nCollective negotiation/bargaining for better\nworking conditions\n1.4\nShare your goals to improve with a trusted co-\nworker or supervisor\n1.5\nMake a negativity log of every instance when you\ncatch yourself complaining to others\n1.6\nMake lists and schedules for necessary activities\n2. Unpleasant situation\nMay include but not limited to:\n2.1\nJob burn-out\n2.2\nDrug dependence\n2.3\nSulking\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-\ndiscipline\n2. Resource Implications\nThe following resources should be provided:\n2.1. Access to workplace and resource s\n2.2. Case studies\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration or simulation with oral questioning\n3.2. Case problems involving work improvement and\nsustainability issues\n3.3. Third-party report\n4. Context for Assessment\n4.1. Competency assessment may occur in workplace\nor any appropriately simulated environment\n\n--- PDF PAGE 22 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 18\nUNIT OF COMPETENCY : CONTRIBUTE TO WORKPLACE INNOVATION\n\nUNIT CODE :"
