        "source_text": "AFF612311\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to conduct preparatory activities in harvesting,\nharvest bee products and conduct post-harvest activities.\nThis also include harvesting operation for wild bees.\nApplication of safety measures and practices is required\nin performing every task.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange Statement\nREQUIRED\nKNOWLEDGE AND\nATTITUDE\nREQUIRED SKILL\n1. Conduct\npreparatory\nactivities\n1.1 Tools, materials\nand equipment are\nprepared following\nindustry practice\n\n1.2 PPEs are worn\nfollowing industry\nstandards and\nOSHS\n\n1.3 Safety and health\nmeasures are\napplied following\nindustry standards\n1.1 Tools, materials and\nequipment for\nharvesting\n\n1.2 Selection and\nInventory procedure\n\n1.3 Importance on the\navailability of tools,\nmaterials and\nequipment\n\n1.4 Safety and health\nmeasures\n- Wearing of PPEs\n- OSH\n- PNS-Code of\nGood Beekeeping\nPractices\n1.1 Inventorying,\nselecting and\npreparing tools,\nmaterials and\nequipment\n\n1.2 Ensuring\navailability of\ntools, materials\nand equipment\n\n1.3 Wearing of PPEs\n\n1.4 Applying safety\npractices\n\n2. Harvest bee\nproducts\n2.1 Weather is\ndetermined before\nharvesting bee\nproducts\n\n2.2 Types of bee\nproducts to be\nharvest are identified\n\n2.3 Harvesting\nprocedure is\nselected according\nto the identified bee\nproducts\n\n2.4 Tools, materials\nand equipment are\n2.1 Factors affecting\nharvesting\n-\nWeather condition\n-\nTime of harvest\n\n2.2 Types of bee\nproducts\n\n2.3 Process of\nharvesting bee\nproducts\n\n2.4 Harvesting bee\nproducts\n\n2.5 Application of safety\nand health measures\n2.1 Determining\nweather\ncondition\n\n2.2 Identifying types\nof bee products\n\n2.3 Selecting\nharvesting\nprocedure\n\n2.4 Harvesting bee\nproducts\n\n2.5 Applying safety\npractices\n\n--- PDF PAGE 70 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 67\nutilized based on\nwork requirements\nand user’s manual.\n\n2.5 Bee products are\nharvested according\nto industry standards\n\n2.6 Safety and health\nmeasures are\napplied following\nindustry standards\n-\nOSH\n-\nPNS for Code of\nGood\nBeekeeping\nPractices\n-\nFood safety\n\n2.6 Wearing of PPEs\n2.6 Wearing PPEs\n3. Conduct\npost –\nharvest\nactivities\n3.1 Harvested bee\nproducts are placed\nin appropriate\ncontainers and\nstored according to\nindustry practice\n\n3.2 Stickies are returned\ninside the hive in\npreparation for the\nnext possible\nharvest\n\n3.3 Harvesting tools and\nequipment are\ncleaned and kept in\nthe storage area\n\n3.4 Record keeping is\nperformed following\nindustry practice\n\n3.5 Safety and health\nmeasures are\napplied following\nindustry standards\n3.1 Proper storage of\nharvested bee\nproducts\n\n3.2 Appropriate\ncontainers for storing\n\n3.3 Importance of\nstickies\n\n3.4 Placing and returning\nof stickies\n\n3.5 Cleaning and storing\nof harvesting tools\nand equipment\n\n3.6 Record keeping\n\n3.7 Application of safety\nand health measures\n- OSH\n- PNS for Code of\nGood Beekeeping\nPractices\n\n3.1 Placing and\nstoring of\nharvested bee\nproducts\n\n3.2 Using of\nappropriate\ncontainers for\nstoring\n\n3.3 Placing and\nreturning stickies\ninside the hive\n\n3.4 Cleaning and\nstoring\nharvesting tools\nand equipment\n\n3.5 Conducting\nrecord keeping\n\n3.6 Applying safety\npractices\n\n3.7 Wearing PPEs\n\n--- PDF PAGE 71 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 68\nRANGE OF VARIABLES\nRANGE\nVARIABLES\n1. Tools, materials and\nequipment\nMay include:\nTools\n1.1 Hive tool\n1.2 Smoker\n1.3 Uncapping knife\n1.4 Knife\n1.5 Silicon spatula\n1.6 Pitcher\n1.7 Strainer\n1.8 Pot\n1.9 Food grade stainless trays\n\nMaterials\n1.10 PPEs:\n- Bee suit\n- Bee veil\n- Gloves\nEquipment\n1.11 Settling tank\n1.12 Honey extractor\n1.13 Propolis trap\n1.14 Pollen trap\n1.15 Queen excluder\n2. Types of be