        "source_text": "AFF612310\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to conduct preparatory activities in propagating\ncolony, assess status and strength of colony, produce\ncolony\nand\nmaintain\nnewly\nestablished\ncolony.\nApplication of safety and health measures is required in\nperforming every task.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange Statement\nREQUIRED\nKNOWLEDGE AND\nATTITUDE\nREQUIRED SKILL\n1. Conduct\npreparatory\nactivities\n1.1 Tools and materials\nare prepared\nfollowing industry\npractice\n\n1.2 PPEs are worn\nfollowing industry\nstandards and\nOSHS\n\n1.3 Safety and health\nmeasures are\napplied following\nOSH and PNS for\nCode of Good\nBeekeeping\nPractices\n1.1 Tools and materials\n\n1.2 Wearing of PPEs\n\n1.3 Safety and health\nmeasures\n- OSH\n- PNS for Code of\nGood Beekeeping\nPractices\n\n1.4 Importance on the\navailability of tools,\nmaterials and\nequipment in the\nworkplace\n1.1 Inventorying,\nselecting and\npreparing\ntools,\nmaterials\nand\nequipment\n1.2 Availabity of\ntools,\nmaterials\nand\nequipment\nare ensured\naccording to\nindustry\npractice\n\n1.3 Ensuring\navailability of\ntools,\nmaterials\nand\nequipment\n\n1.4 Wearing of\nPPEs\n\n1.5 Applying\nsafety\npractices\n\n--- PDF PAGE 65 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 60\n2. Assess\nstatus and\nstrength of\ncolony\n2.1 Indicators of a colony\nthat is about to divide\nis determined\nbased on industry\npractice.\n\n2.2 Presence of good\nqueen is confirmed\naccording to industry\nstandard\n\n2.3 Food is checked\nfollowing industy\nstandard\n\n2.4 Presence of pests\nand diseases is\nchecked following\nindusty standard\n\n2.5 Population build up\nis checked according\nto industry standard\n\n2.6 Performance of the\ncolony is monitored\nfollowing industry\nstandard\n\n2.7 Safety and health\nmeasures are\napplied following\nindustry standards\n2.1 Hive manipulation\n\n2.2 Safety and health\nmeasures\n- OSH\n- PNS for Code of\nGood Beekeeping\nPractices\n\n2.3 Good quality queen\n\n2.4 Food of the colony\n-\nhoney and\npollen\n\n2.5 Pests and diseases\n\n2.6 Hive compression\nand expansion\n\n2.7 Population build up\n\n2.8 Performance of the\ncolony\n\n2.1 Ensuring\npresence of\ngood quality of\nqueen\n\n2.2 Checking food\n\n2.3 Checking\npresence of\npests and\ndiseases\n\n2.4 Checking\npopulation build\nup\n\n2.5 Monitoring\nperformance of\ncolony\n\n2.6 Applying safety\npractices\n3. Produce\ncolony\n3.1 Queenless nucs\ncolony is prepared\nbeforehand\nfollowing industry\npractice\n\n3.2 Colony is divided\naccording to industry\npractice\n\n3.3 New queen is\nacquired following\nindustry practice\n\n3.4 Newly mated queen\nis introduced to the\nnucs accocrding to\nindustry practice\n\n3.1 Safety and health\nmeasures\n- OSH and PNS for\nCode of Good\nBeekeeping\nPractices\n\n3.2 Nucleus colony\n\n3.3 Division of colony\n\n3.4 Acquiring new\nqueen\n\n3.5 Introduction of newly\nmated queen\n\n3.6 Status of food in the\ncolony\n\n3.1 Preparing\nqueenless\nnucleus colony\n\n3.2 Dividing colony\n\n3.3 Acquiring new\nqueen\n\n3.4 Introducing new\nqueen\n\n3.5 Feeding nucleus\ncolony\n\n3.6 Checking queen\nacceptance and\nstatus\n\n--- PDF PAGE 66 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 61\n3.5 Queen acceptance\nand status of food\nare checked\nfollowing industry\npractice\n\n3.6 Nucleus colony is fed\nfollowing industry\npractice\n\n3.7 Safety and health\nmeasures are\napplied following\nindustry standards\n3.7 Feeding nucleus\ncolony\n\n3.7 Applying safety\npractices\n\n4. Maintain\nnewly\nestablished\ncolony\n\n4.1 Corrective actions\nare applied following\nindustry practice\n\n4.2 Treatment is applied\nfollowing industry\nstandard\n\n4.3 Food, health and\nperfromance of\ncolony is monitored\naccording to industry\nstandard.\n\n4.4 Safety and health\nmeasures are\napplied following\nindustry standards\n4.1 Identification of\ncorrective actions\n\n4.2 Application of\ncorrective actions\n\n4.3 Pests and Diseases\nof Bees\n\n4.4 Treatment of\ncolonies\n\n4.5 Performing\ntreatment to colonies\n\n4.6 Importance of food,\nhealth and\nperformance of\ncolony\n\n4.7 Monitoring\nprocedures\n\n4.8 Safety practices\n- Wearing PPEs\n- OSH\n- PNS – Code of\nGood\nBeekeeping\nPractices\n4.1 Applying\ncorrective\nactions\n\n4.2 Applying\ntreatment\n\n4.3 Monitoring food,\nhealth and\nperformance\n\n4.4 Applying safety\npractices\n\n--- PDF PAGE 67 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 62\nRANGE OF VARIABLES\nRANGE\nVARIABLES\nTools and materials\n\nTools and materials may include:\nTools:\n1.1 Bee brush\n1.2 Smoker\n1.3 Hive tool\n1.4 Dissecting set\nMaterials:\n1.5 Smoker fuel (either of the following: husk, paper,\ndried leaves, cardboard)\n1.6 Matches\n1.7 Apis mellifera hive (complete set)\n1.8 Apis cerana hive (complete set)\n1.9 Tetragonula spp. hive (complete set)\n1.10 PPEs\n- Bee veil\n- Bee suit\n- Gloves\n1.11 Miticides\n1.12 Feeding supplement\n1.13 Swarm net – 10 pcs (24”x30”)\n1.14 Newspaper sheet (for merging colonies)\n1.15 Extra frames\n1.16 Nuc box\nGood quality of queen\nMay include:\n2.1 Good laying pattern\n2.2 Healthy\nCorrective actions\nMay include:\n3.1 Adding brood frames from other healthy colonies\n3.2 Merging of colonies\n3.3 Replacement of queen\nTreatment\nMay include:\nDiseases:\n4.1 Compress colony\n4.2 Burn colony\n4.3 Re-queen\n4.4 Apply shook swarm methods\nPests\n4.5 Apply miticide\n4.6 Put traps for small hive beetle, Aethina tumida\n\n--- PDF PAGE 68 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 63\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Conducted preparatory activities\n1.2 Assessed status and strength of colony\n1.3 Produced colony\n1.4 Maintained newly established colony\n1.5 Applied safety and health measures\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, equipment, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References and manuals\n2.4 First aid kit\n3. Methods of\nAssessment\nCompetency in this unit should be assessed through:\n3.1 Demonstration/ direct observation with oral\nquestioning\n3.2 Written exam\n4. Context of Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 69 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 66\nUNIT OF COMPETENCY\n: CONDUCT HARVESTING OPERATION\nUNIT CODE\n:"
