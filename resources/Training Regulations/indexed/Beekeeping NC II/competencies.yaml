          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Controlled pests and disease\n1.2 Performed feeding\n1.3 Monitored performance of colony\n1.4 Performed requeening\n1.5 Merged colonies\n1.6 Managed bee swarming\n1.7 Applied safety and health measures\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References and manuals\n2.4 First aid kit\n3. Methods of Assessment\nCompetency in this unit should be assessed\nthrough:\n3.1 Demonstration/ direct observation with oral\nquestioning\n3.2 Written exam\n4. Context of Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are\nbeing undertaken whether individually or in-group\n\n--- PDF PAGE 64 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 59\nUNIT OF COMPETENCY\n: PROPAGATE BEE COLONY\nUNIT CODE\n:"
        },
        "source_text": "AFF612309\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto control pests and diseases, perform feeding, monitor\nperformance of colony, perform requeening, merge colonies\nand manage bee swarm. Application of safety and health\nmeasures is required in performing every task.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange Statement\nREQUIRED\nKNOWLEDGE AND\nATTITUDE\nREQUIRED SKILL\n1. Control pests\nand diseases\n\n1.1 Inspection for pest\nand diseases is\nconducted following\nindustry practice\n\n1.2 Regular cleaning\nand rotation of hive\ncomponents is\nperformed following\nindustry practice\n\n1.3 Tools and materials\nare prepared\nfollowing industry\npractice\n\n1.4 Tools and materials\nare used according\nto work requirement\nand industry\npractice\n\n1.5 Treatment and\ncorrective\nmeasures are\nidentified and\napplied following\nindustry practice\n\n1.6 Safety and health\nmeasures are\napplied following\nOSH and PNS for\nCode of Good\nBeekeeping\nPractices\n1.1 Pests and diseases\nlisted in OIE\n\n1.2 Regular cleaning\nand rotation of hive\ncomponents\n\n1.3 Treatment and\ncorrective measures\n\n1.4 Safety and health\nmeasures\n\nOSH\n\nPNS for Code of\nGood\nBeekeeping\nPractices\n1.1 Conducting\ninspection for\npests and\ndiseases\n\n1.2 Performing\nregular cleaning\nand rotation of\nhive components\n\n1.3 Identifying\ntreatment and\ncorrective\nmeasures\n\n1.4 Applying safety\nand health\nmeasures\n\n--- PDF PAGE 58 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 53\n2. Perform feeding\n2.1 Number of colonies\nare identified\nfollowing industry\nprocedures.\n2.2 Type of feed is\ndetermined following\nindustry practice\n\n2.3 Amount of feed\nsupplement is\ncomputed based on\nindustry practice.\n\n2.4 Feeds are prepared\nfollowing industry\npractice\n\n2.5 Feeding activity is\nperformed\ndepending on the\nweather conditions\n\n2.6 Feeder is used\nfollowing industry\npractice\n\n2.7 Feeding is\nmonitored following\nindustry practice\n\n2.8 Safety and health\nmeasures are\napplied following\nOSH and PNS for\nCode of Good\nBeekeeping\nPractices\n2.1 Number of colonies\n\n2.2 Amount of feed\nsupplement\n\n2.3 Types of feeding\nmaterials\n\n2.4 Preparation of feeds\n\n2.5 Wearing of PPEs\n\n2.6 Mensuration\n\n2.7 Weather conditions\n\n2.8 Feeding activity\n\n2.9 Use of feeder\n\n2.10 Monitoring\nprocedure\n\n2.11 Safety and health\nmeasures\n Wearing PPEs\n OSH\n PNS – Code of\nGood\nBeekeeping\nPractices\n\n2.1 Identifying\ncolonies\n\n2.2 Identifying\namount of feed\nsupplement\n\n2.3 Selecting of\nappropriate type\nof feeding\nmaterials to use\n\n2.4 Preparing feeds\n\n2.5 Wearing of PPEs\n\n2.6 Determining\nweather\ncondition\n\n2.7 Performing\nfeeding activities\n\n2.8 Using feeder\n\n2.9 Monitoring\nfeeding\n\n2.10 Applying safety\npractices\n\n3. Monitor\nperformance of\ncolony\n\n3.1 Health and\nperfromance of\ncolony is monitored\nfollowing industry\npractice\n\n3.2 Egg laying pattern is\nmonitored according\nto industry practice\n\n3.3 Food sufficiency is\nchecked according\nto industry practice\n\n3.4 Corrective measures\nare identified and\n3.1 Importance of health\nand performance of\ncolony\n\n3.2 Monitoring\nprocedures\n\n3.3 Safety and health\nmeasures\n- Wearing PPEs\n- OSH\n- PNS – Code of\nGood Beekeeping\nPractices\n3.1 Monitoring health\nand performance\nof colony\n\n3.2 Monitoring egg\nlaying pattern\n\n3.3 Identifying and\napplying\ncorrective\nmeasures\n\n3.4 Conducting\nrecord keeping\n\n--- PDF PAGE 59 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 54\napplied following\nindustry procedures\n\n3.5 Record keeping is\nconducted according\nto industry practice\n\n3.6 Safety and health\nmeasures are\napplied following\nOSH and PNS for\nCode of Good\nBeekeeping\nPractices\n3.5 Applying safety\nand health\nmeasures\n4. Perform\nrequeening\n\n4.1 Indicators of\nrequeening is\nchecked and\nidentified following\nindustry practice\n\n4.2 Availability of new\nqueen is ensured\nfollowing industry\npractice\n\n4.3 Old queen is kept in\nsmaller colony\nfollowing industry\npractice\n\n4.4 Old queen is\nremoved from colony\naccording to industry\npractice\n\n4.5 New queen is\nmarked and\nintroduced to the\ncolony according to\nindustry practice\n\n4.6 Acceptance of\ncolony to the new\nqueen is checked\nand monitored\nfollowing industry\npractice\n\n4.7 Safety practices are\napplied following\nOSHS and PNS for\nCode of Good\n4.1 Indicators of\nrequeening\n\n4.2 Process of\nrequeening\n\n4.3 Availability of new\nqueen\n\n4.4 Keeping and\ntransferring old\nqueen\n\n4.5 Removing of queen\nfrom colony\n\n4.6 Marking of queens\n\n4.7 Acceptance of\ncolony to the new\nqueen\n\n4.8 Safety and health\nmeasures\n- Wearing PPEs\n- OSH\n- PNS – Code of\nGood Beekeeping\nPractices\n4.1 Checking\nindicators of\nrequeening\n\n4.2 Ensuring\navailability of\nnew queen\n\n4.3 Keeping and\ntransferring old\nqueen to smaller\ncolony\n\n4.4 Removing queen\nfrom colony\n\n4.5 Marking and\nintroducing new\nqueen to the\ncolony\n\n4.6 Checking\nacceptance of\nnew queen\n\n4.7 Applying safety\nand health\nmeasures\n\n--- PDF PAGE 60 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 55\nBeekeeping\nPractices\n5. Merge colonies\n5.1 Indicators for\nmerging colonies\nare identified\naccording to industry\npractice.\n\n5.2 Tools and\nmaterials are\nprepared according\nto work\nrequirements and\nindustry practice\n\n5.3 Tools and\nmaterials used\naccording to work\nrequirements and\nindustry practice\n\n5.4 Brood and bees are\ntaken for merging\nactivities\n\n5.5 Success of merging\nis confirmed\nfollowing industry\npractice\n\n5.6 Safety and health\nmeasures are\napplied following\nOSHS and PNS for\nCode of Good\nBeekeeping\nPractices\n5.1 Indicators for\nmerging colonies\n\n5.2 Process of merging\ncolonies\n\n5.3 Indicators of\nsuccess of merging\nthe colonies\n\n5.4 Safety and health\nmeasures\n- Wearing of PPEs\n- OSH\n- PNS – Code of\nGood Beekeeping\nPractices\n5.1 Identifying\nindicators for\nmerging colonies\n\n5.2 Preparing tools\nand materials for\nmerging\n\n5.3 Taking brood\nand bees\n\n5.4 Ensuring\nsuccess of\nmerging\n\n5.5 Applying safety\nand health\nmeasures\n6. Manage bee\nswarming\n6.1 Indicators of\nswarming are\nidentified according\nto industry\nstandards.\n\n6.2 Control measures\nare identified and\napplied based on\nindustry standards.\n\n6.3 Tools and\nmaterials are\nprepared for\ncatching swarm\n6.1 Safety and health\nmeasures in\ncatching swarm\n\n6.2 Indicators of\nswarming\n\n6.3 Control Measures\n\n6.4 Application of control\nmeasures\n\n6.5 Tools and materials\nused for controlling\nand capturing bee\nswarm\n6.1 Identifying\nindicators of\nswarming\n\n6.2 Identifying and\napplying control\nmeasures\n\n6.3 Preparing tools\nand materials for\ncatching bee\nswarm\n\n6.4 Capturing bee\nswarm\n\n--- PDF PAGE 61 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 56\nfollowing industry\npractice\n\n6.4 Tools and\nmaterials are used\nfor catching swarm\nfollowing industry\npractice\n\n6.5 Bee swarm is\ncaptured according\nto industry\nstandards.\n\n6.6 Safety practices are\napplied following\nOSHS and PNS for\nCode of Good\nBeekeeping\nPractices\n\n6.6 Safety and health\nmeasures\n- Wearing of PPEs\n- OSH\n- PNS – Code of\nGood Beekeeping\nPractices\n6.5 Applying safety\nand health\nmeasures\n\n--- PDF PAGE 62 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 57\n\nRANGE OF VARIABLES\n\nRANGE\nVARIABLES\n1. Tools, materials and\nequipment\nMay include:\nTools:\n1.1 Hive tool\n1.2 Bee brush\nMaterials\n1.1 Newspaper sheets\n1.2 Hive body\n1.3 Queen cage\n1.4 Queen catcher\n1.5 Feeder\nEquipment:\n1.3 Smoker\n1.4 PPE\n• Bee veil\n• Bee suit\n• Gloves\n2. Treatment and corrective\nmeasures\nMay include:\n2.1 Use of miticides\n2.2 Use of traps for some pests\n2.3 Use of screened bottom board\n2.4 Use of shook swarm method\n3. Preparation of feeds\nMay include:\n3.1 Types of feeds are identified\n• pollen\n• white sugar\n3.2 Proportion of mixture is ensured\n4. Feeder\nMay include:\n4.1 Top feeder\n4.2 Side feeder\n4.3 Baggie feeders\n5. Indicators of requeening\nMay include:\n5.1 Laying pattern\n5.2 Number of eggs laid per day or egg laying\ncapacity\n5.3 Presence of supersedure cells\n6. Indicators of merging colonies\nMay include:\n6.1 Colony is queenless\n6.2 Weak colonies\n7. Indicators of swarming\n\nMay include:\n7.1 Presence of swarm cells\n7.2 Presence of numerous drones\n7.3 Presence of virgin queen\n8. Control measures\nMay include:\n8.1 Expand brood chamber\n\n--- PDF PAGE 63 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 58\n8.2 Destroy queen cells or swarm cells\n8.3 Kill virgin queen\n9. Capture bee swarm\nMay include:\n9.1 Place the two-box hive assembly on the\nground, close to the swarm to be captured\n9.2 Catch the swarm using a swarm net and\nshake into the empty bottom chamber\n9.3 Put the super with frames and lid back on\ntop of the bottom box\n9.4 Capture the bees clustering at their original\nlocation and shake them off in front of the\nentrance\n9.5 Capture the queen and place in a queen\ncage\n9.6 Release the queen after 2 days\n9.7 Feed the colonies massively\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Controlled pests and disease\n1.2 Performed feeding\n1.3 Monitored performance of colony\n1.4 Performed requeening\n1.5 Merged colonies\n1.6 Managed bee swarming\n1.7 Applied safety and health measures\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References and manuals\n2.4 First aid kit\n3. Methods of Assessment\nCompetency in this unit should be assessed\nthrough:\n3.1 Demonstration/ direct observation with oral\nquestioning\n3.2 Written exam\n4. Context of Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are\nbeing undertaken whether individually or in-group\n\n--- PDF PAGE 64 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 59\nUNIT OF COMPETENCY\n: PROPAGATE BEE COLONY\nUNIT CODE\n:"
