        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studied data/information\nThese aspects may be best assessed using a range of\nscenarios what ifs as a stimulus with a walk through\nforming part of the response. These assessment\nactivities should include a range of problems, including\nnew, unusual and improbable situations that may have\nhappened.\n2. Resource Implications\nSpecific resources for assessment\n2.1. Evidence of competent performance should be\nobtained by observing an individual in an\ninformation management role within the workplace\nor operational or simulated environment.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Written Test\n3.2. Interview\n3.3. Portfolio\n\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will\noccur over a range of situations, which will include\ndisruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this\nunit of competency. Simulation should be based on the\nactual workplace and will include walk through of the\nrelevant competency components.\n4. Context for Assessment\n4.1. In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 30 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 26\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND HEALTH\nPOLICIES AND PROCEDURES\n\nUNIT CODE :"
        },
        "source_text": "400311215\n\nUNIT DESCRIPTOR :\nThis unit of covers the knowledge, skills and attitudes\nrequired to present data/information appropriately.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Gather data/\ninformation\n1.1 Evidence, facts\nand information\nare collected\n1.2 Evaluation, terms\nof reference and\nconditions are\nreviewed to\ndetermine\nwhether\ndata/information\nfalls within project\nscope\n\n1.1 Organisational\nprotocols\n1.2 Confidentiality\n1.3 Accuracy\n1.4 Business\nmathematics and\nstatistics\n1.5 Data analysis\ntechniques/proced\nures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n1.8 Organisational\nvalues, ethics and\ncodes of conduct\n\n1.1 Describing\norganisational\nprotocols relating\nto client liaison\n1.2 Protecting\nconfidentiality\n1.3 Describing\naccuracy\n1.4 Computing\nbusiness\nmathematics and\nstatistics\n1.5 Describing data\nanalysis\ntechniques/\nprocedures\n1.6 Reporting\nrequirements to a\nrange of\naudiences\n1.7 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n1.8 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n\n--- PDF PAGE 28 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 24\n2. Assess\ngathered data/\ninformation\n2.1 Validity of data/\ninformation is\nassessed\n2.2 Analysis\ntechniques are\napplied to assess\ndata/ information.\n2.3 Trends and\nanomalies are\nidentified\n2.4 Data analysis\ntechniques and\nprocedures are\ndocumented\n2.5 Recommendation\ns are made on\nareas of possible\nimprovement.\n\n2.1 Business\nmathematics and\nstatistics\n2.2 Data analysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\nvalues, ethics and\ncodes of conduct\n2.1 Computing\nbusiness\nmathematics and\nstatistics\n2.2 Describing data\nanalysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of\naudiences\n2.4 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n2.5 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n3. Record and\npresent\ninformation\n3.1 Studied\ndata/information\nare recorded.\n3.2 Recommendation\ns are analysed for\naction to ensure\nthey are\ncompatible with\nthe project’s\nscope and terms\nof reference.\n3.3 Interim and final\nreports are\nanalysed and\noutcomes are\ncompared to the\ncriteria\nestablished at the\noutset.\n3.4 Findings are\npresented to\nstakeholders.\n\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n3.4 Organisational\nvalues, ethics and\ncodes of conduct\n\n3.1 Describing data\nanalysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of\naudiences\n3.3 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n3.4 Stating\norganisational\nvalues, ethics and\ncodes of conduct\npractices\n\n--- PDF PAGE 29 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 25\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Data analysis techniques\nMay include but not limited to:\n1.1. Domain analysis\n1.2. Content analysis\n1.3. Comparison technique\n\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studied data/information\nThese aspects may be best assessed using a range of\nscenarios what ifs as a stimulus with a walk through\nforming part of the response. These assessment\nactivities should include a range of problems, including\nnew, unusual and improbable situations that may have\nhappened.\n2. Resource Implications\nSpecific resources for assessment\n2.1. Evidence of competent performance should be\nobtained by observing an individual in an\ninformation management role within the workplace\nor operational or simulated environment.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Written Test\n3.2. Interview\n3.3. Portfolio\n\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will\noccur over a range of situations, which will include\ndisruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this\nunit of competency. Simulation should be based on the\nactual workplace and will include walk through of the\nrelevant competency components.\n4. Context for Assessment\n4.1. In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 30 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 26\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND HEALTH\nPOLICIES AND PROCEDURES\n\nUNIT CODE :"
