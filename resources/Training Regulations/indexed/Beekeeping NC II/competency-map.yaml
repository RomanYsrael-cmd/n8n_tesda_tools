  "source_text": "COMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR\nBEEKEEPING NC II\nBASIC COMPETENCIES\n\n--- PDF PAGE 133 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 130\nApply safety measures in\nfarm operation\nUse farm tools and equipment\nPerform estimation and\nbasic calculation\nApply basic first aid\n\nProcess farm wastes\n\nPerform record keeping\nMaintain service records\nConduct Diagnosis\n\nPerform Shop Maintenance\n\nProvide Quality Customer Service\nComply with Quality and\nEthical Standards\nPerform mensuration and\ncalculations\nMaintain tools and\nequipment\n\nApply food safety and\nsanitation\n\nPrevent and fight fire\n\nComply with Quality and\nEthical Standards\nPerform mensuration and\ncalculations\nMaintain tools and\nequipment\n\nApply food safety and\nsanitation\n\nPrevent and fight fire\n\nProvide first aid treatment\non board\n\nProtect marine environment\n\nComply with emergency\nprocedures\n\nApply safety measures in\nfarm and nursery operations\nUse farm and nursery tools and\nequipment\n\nDevelop and update\nindustry knowledge\n\nRestrain and handle\nanimal\nApply bio-security measures\nAdminister drugs and\nbiologics\nHandle and store drugs and\nbiologics\nCollect and handle specimen\nEstablish readiness for\nartificial insemination\nPrepare for artificial\ninsemination (AI) operation\nPerform artificial\ninsemination (AI)\nPrepare artificial\ninsemination (AI)\ndocumentations and reports\nConfirm readiness of sow/gilt for\nartificial insemination\nCollect boar semen\nPerform artificial insemination\n(AI) on sow/gilt\nPrepare documentations\nand reports on sow/gilt\nartificial insemination (AI)\nactivities\nMaintain poultry house\nBrood and grow chicks\nPerform pre-lay and lay\nactivities\nTrim beak\nHandle breeders\nHandle farrowing sows and\nsucklings\nRaise weanlings\nProduce finishers\nMaintain healthy animal\nenvironment\nMaintain housing, farm\nimplements and surrounding\narea\nProvide forage\nPerform breeding of ruminants\nRaise dairy animals\nRaise meat-type animals\nEstablish hived colonies in a\nbee yard\nManage bee colony\nPropagate bee colony\nConduct harvesting\noperation\nProvide pollination services\n\nCOMMON COMPETENCIES\nCORE COMPETENCIES\n\n--- PDF PAGE 134 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 130\nGLOSSARY OF TERMS\n\nAethina tumida\nKnown as small hive beetle (SHB), a\nparasitic beetle whose larvae feed on\nhoney, pollen, and brood of weak or dying\nbee\nAnthesis\nThe flowering period of a plant from the\nopening of the flower bud\nApiculture\nThe art and science of keeping honey bees\nApis breviligula\nA species of giant honey bee with white and\nblack color; locally known as pukyutan,\nputyukan, ayukan; usually nesting in\nforested areas with high elevation in Luzon,\nVisayas and Mindanao, except Palawan.\nProduces 40-60 kg of honey per colony per\nyear\nApis cerana\nNative species of honey bees; locally known\nas liguan, laywan, anig; Produces 2-5 kg of\nhoney per colony per year\nApis dorsata\nAnother species of giant honey bee with\nblack and yellow color; locally known as\npukyutan, putyukan, ayukan; usually found\nin forested areas in Palawan. Produces 40-\n60 kg of honey per year\nApis mellifera\nAn introduced honey bee species in the\nPhilippines, commonly used in commercial\nbeekeeping; produces 30 kg of honey per\ncolony per year\nBaggie feeders\nAny plastic bag holding sugar syrup used for\nfeeding\nBee plants\nVariety of flowering plants from which the\nbees collect the nectar and pollen\nBee pollen\nThe pollen dislodged from the pollen basket\nof foraging bees and collected in a pollen\ntrap or removed from the comb\nBee smoker\nA device designed to generate smoke from\nsmoldering various fuels blown to the hive to\ncalm the bees\nBee yard\nAn area of a collection of hives or colonies\nof bees kept for their products or pollination\nservices\nBeehive\nA structure in where bees are kept; house of\nbees\nBeekeeper\nA person who keeps bees\nBeekeeping\nThe art of keeping bees\nBeeswax\nWax secreted from glands on underside of\nbee abdomen, molded to form honey combs\n\n--- PDF PAGE 135 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 131\nBrood\nRefers to the immature stages of bees such\nas egg, larva, and pupa that will develop into\nadult bees\nCappings\nThe thin layer of new wax that bees build\nover the ripened honey\nColony\nAn aggregate of several thousand worker\nbees, drones and a queen bee living\ntogether in a hive or in any other dwelling as\none social unit\nComb\nA structure manufactured by bees out of\nbeeswax and consisting of hexagon-shaped\ncells fitted side by side and used by bees to\nraise brood and store honey and pollen: also\ncalled honeycomb\nCosting and economic capacity\nThe financial capacity of each prospective\nbeekeeper\nDisease\nMeans the clinical and/or pathological\nmanifestation of infestation and infection\nsuch as American Foul Breed, Chalk Brood,\nand European Foul Brood\nDivide\nTo split a strong colony into two smaller\ncolonies\nHarvesting\nThe process of removing the honey from the\nhoneycomb\n\nHive tool\nA handheld multipurpose tool used in\nseparating frames and prying the inner\ncover of the hive.\nHoney\nThe natural sweet substance produced by\nbees from the nectar of plants or from\nsecretions of living plants or excretions of\nplant-sucking insects on the living parts of\nplants, which the bees collect, transform by\ncombining with specific substances of their\nown, deposit, dehydrate, store and leave in\nthe honey comb or in the cerumen pot to\nripen and mature\nHoney flow\nPeriod when flowers are producing enough\nnectar to allow significant honey storage\nHoney Super\nA hive box or hive bodies with frames where\nhoney is stored and ripened\nMeliponary\nA location where stingless bees colonies are\nkept\nMerging\nThe act of combining a queenless colony\nwith a queenright colony\nMiticide\nSubstances used to treat mite infestation\nNucleus colony\nA smaller hive, sometimes in a smaller box,\nconsisting of bees in all stages of\ndevelopment, their food, a laying queen, and\n\n--- PDF PAGE 136 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 132\nenough workers to cover three (3) to five (5)\ncombs; also called nuc or starter colony\nOffice Internationale de Epizooties (OIE)\nor World Organization for Animal Health\nThe inter-governmental organization\nresponsible for improving animal health\nworldwide\nPollen trap\nA device placed at the entrance of the hive\nto collect pollen carried by the returning\nforaging bees\nPollination hive\nRefers to the Tetragonula Pollination Hive\n(TPH) developed by the UPLB Bee Program\nPropolis\nResinous substances collected by bees\nfrom plant buds, sap flows, or other\nbotanical sources used by them as sealant\nfor unwanted open spaces in the hive\nPropolis trap\nA device placed at the top of the hive to\ncollect propolis carried by the returning\nforaging bees\nQueen bee\nThe fertile fully developed female of a social\nbee\nQueen excluder\nA barrier, usually made of plastic or metal\nsheet with holes that prevents the queen\nand drones to pass through, only the\nworker bees do,\nQueenless colony\nA colony without a queen\nQueenright colony\nA colony with a laying queen\nRipe Honey\nHoney from which bees have evaporated\nsufficient moisture so that it contains the\nacceptable moisture content\nShook swarm method\nShaking the bees on to fresh foundation to\nreplace brood combs as a means of\nreducing diseases\nSpur embedder\nA tool with concave wheel used to fasten the\nwax sheet to the wire of the frame\nSolar wax melter\nA glass covered box that uses the heat of\nthe sun to melt beeswax and to separate it\nfrom honey and other materials\nStickies\nFrames with drawn comb after honey\nextraction\nSupersedure cell\nCell containing the new queen produced by\nthe workers to replace the failing queen\nSwarm\nAn aggregate of bee colony that leaves the\nhive to establish a new colony; it is a natural\nmeans of reproduction of the bee colonies\nSwarm cell\nCell containing the new queen produced by\nthe workers when there is an over\nabundance of bees in the hive and they\nneed to make a new colony\n\n--- PDF PAGE 137 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 133\nTetragonula spp.\nSpecies of stingless bees locally known as\nlukot, lukutan, libog, tigtig, kiwot, kiyot, duri;\ncan be domesticated in hives and used for\nhoney, pollen and propolis and crop\npollination. Produces 1-2 kg of honey per\ncolony per year\nTreatment\nRefers to disinfection of hive components\nthrough cleaning, heating and using of\nrepellant\nWild honey\nHoney harvested from wild bee colonies\n\n--- PDF PAGE 138 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 134\n\nTRAINING REGULATIONS (TRs)\nDOCUMENT REVISION HISTORY\n\nQualification Title: Beekeeping NC II\nQualification\nCode:\nAFFBEE220\n\nRevision\nNo.\nDocument\nDescription Types*\nQualification Title\nNew Version\n(TESDA Board\nResolution No./ Date)\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nBeekeeping NC II\nTB No. 2020-03 /\n 08/11/2020\nTESDA Circular\nNo. 131 series of 2020\n Legend: *Description Types\n- Document Created\n- Document Amended\n- Document Superseded\n\n--- PDF PAGE 139 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 135",
