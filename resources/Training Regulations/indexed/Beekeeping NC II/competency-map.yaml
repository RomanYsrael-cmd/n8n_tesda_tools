  "source_text": "Section 1\nBEEKEEPING NC II\n\nThe BEEKEEPING NC II Qualification consists of competencies required to establish hived\ncolonies in a bee yard, manage bee colonies, propagate bee colonies, conduct harvesting\noperations, and provide bee pollination services. This qualification covers handling different\nspecies of bees including domesticated and wild species. Harvesting activities end until\nextraction of raw honey. Application of health and safety measures is required in performing\nevery task.\n\nThe units of competency comprising this qualification include the following:\n\nCode\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\nCode\nCOMMON COMPETENCIES\nAFF321207\nApply Safety Measures in Farm Operations\nAFF321208\nUse Farm Tools and Equipment\nAFF321203\nPerform Estimation and Basic Calculation\nCode\nCORE COMPETENCIES\nAFF612308\nEstablish hived colonies in a bee yard\nAFF612309\nManage bee colony\nAFF612310\nPropagate bee colony\nAFF612311\nConduct harvesting operation\nAFF612312\nProvide pollination services\n\nA person who has achieved this Competency Standard is competent to be:\n• Beekeeper\n• Apiary worker\n• Field bee technician\n\n--- PDF PAGE 6 ---\nTR -Beekeeping NC II Revision 00\nPromulgated (08/11/2020)\n 2"
