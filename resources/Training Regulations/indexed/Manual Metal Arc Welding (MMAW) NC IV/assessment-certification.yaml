      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 114 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 110 Receive and respond to workplace communication Work with others Solve/address routine problems Enhance self- management skills Support Innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace Participate in workplace communication Work in Team Environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace Lead workplace communication Lead small teams Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro- small-medium enterprises (MSMEs) Utilize specialized communication skills Develop and lead teams Perform higher- order thinking processes and apply techniques in the workplace Contribute to the practice of social justice in the workplace Manage innovative work instructions Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health (OSH) programs, policies and procedures Lead towards improvement of environment work programs, policies and procedures Sustain entrepreneurial skills COMPETENCY MAP – MANUAL METAL ARC WELDING (MMAW) NC IV --- PDF PAGE 115 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 111 Interpret drawings and sketches Perform basic workshop measurements & computations Contributes to quality management system Use hand tools Prepare materials and consumables Weld carbon steel plates using MMAW Weld carbon steel plates using GMAW Weld carbon steel pipes using GMAW Weld carbon steel plates using GTAW Weld carbon steel pipes using GTAW Weld carbon steel plates using FCAW Weld carbon steel pipes using FCAW Prepare/ fit up welding joints Weld alloy steel plates using GMAW Weld alloy steel pipes using GMAW Weld alloy steel plates using Weld alloy steel pipes using Weld alloy steel plates using FCAW Weld alloy steel pipes using FCAW Set up welding equipment Weld carbon steel plates and pipes using MMAW Weld alloy steel plates using Weld alloy steel pipes using Perform gas welding in carbon steel plates and tubes Perform gas welding in alloy steel plates and tubes Weld plates using SAW Weld austenitic stainless steel plates and pipes using MMAW --- PDF PAGE 116 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 112 Austenitic Are classified in 200 and 300 series, with 16%-30% Stainless chromium and 2 % to 20% nickel for enhanced surfaced quality, formability, increased corrosion and wear resistance. Austenitic stainless steels are non hardenable and non magnetic. base metal (aka: parent metal) the metal that is to be worked, cut or welded bead a weld deposit resulting from a single welding pass bend test A destructive testing method that calls for a test specimen taken from a test coupon to be bent to a specified bend radius. This test is used to evaluate the soundness and ductility of the welded joint break test A destructive testing method in which a fillet weld test is loaded so that the weld root is in tension until it breaks. Once broken, soundness of the welded joint is evaluated by examining the fractured surface for incomplete fusion, porosity, and other internal discontinuities. This test is primarily used for welders qualification. discontinuity An interruption of the typical structure of a material, such as lack of homogeneity in its mechanical, metallurgical or physical characteristics. A discontinuity is not necessarily a defect. destructive is undertaken in order to understand a specimen’s performance testing (DT) or material behavior. These procedures are carried out to the test specimen’s failure. DT methods are commonly used for materials characterization, fabrication validation, failure investigation, and can form a key part of engineering critical assessments. fillet weld A weld of approximately triangular cross section joining two surfaces approximately at right angles to each other in a lap joint, T-joint, or corner joint. jig (aka: Fixture) A device designed to hold and maintain parts in proper relation to each other. Jig and fixture have essentially the same meaning. They both function to facilitate assembly of parts and to hold a work piece assembly in proper alignment and position during handling and welding. joint The junction of members or the edges of the base metal that are to be joined or have been joined by welding --- PDF PAGE 117 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 113 liquid A non-destructive testing method in which a penetrating agent is penetrant used to detect weld defects and other possible flaws in testing (PT) non-magnetic and non-porous material (A.k.a SMAW) An arc welding process with an arc between a covered electrode and the weld pool. The process is used with shielding from the decomposition of the electrode covering, without the application of pressure, and with filler metal from the electrode. non-destructive is a testing and analysis technique used by the industry to testing (NDT) evaluate the properties of a material, component, structure or system for characteristic differences or welding defects and discontinuities without causing damage to the original part. Occupational refers to a set of rules issued by DOLE which mandates Safety the adoption and use of appropriate practices, means, and Health methods, reasonably standards operations or processes, and (OSH) working conditions necessary to ensure safe and healthful employment. quiver (Aka:portable oven, hotbox) . A temperature controlled electrode container used during welding in order to maintain the required holding temperature after baking. This ensures electrode drynessbefore use and prevents moisture absorption in the flux covering due to humidity conditions shearing are multipurpose devices used in the cutting of alloys and other machine sheet metal. Some shearing machines use a scissor-like, angular shear action to cut metal into sheets or strips. Other, larger machines use a straight shear action with the blade fixed at an angle as opposed to the angular movement. visual when an object is inspected by the eye directly. inspection weld defects A discontinuity or discontinuities accumulated effect that render a welded part or product unable to meet minimum applicable acceptance standard or specification. welding A joining process that causes materials to fuse and merge by heating them to the welding temperature, with or without the application of pressure or by the application of pressure alone, and with or without using filler metal. welding A component of the welding circuit through which current is run electrode and that ends at the arc, in a molten conductive slag, or in the base metal. The flux covered consumable filler in MMAW/SMAW --- PDF PAGE 118 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 114 welding torch a gas mixing and burning tool for the welding of metals weldment an assembly or structure whose component parts are joined by welding Welding A document providing the required welding variables for a Procedure specific application to assure repeatability by properly trained Specification welders and welding operators. (WPS) --- PDF PAGE 119 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 115 REFERENCES: 1. Training Regulations for Shielded Metal Arc Welding (SMAW) NC IV 2. Asian Welding Federation (AWF) - Common Welder Certification Scheme (CWCS); aligned to ISO 9606-1 Standard 3. ISO 9606-1: Qualification testing of welders — Fusion welding — Part 1: Steels 4. AWS D 1.6 Structural Welding Code- Stainless Steel 5. ASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing Qualifications --- PDF PAGE 120 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 116 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of this Training Regulations. GERALD S. GALLARDO President CIFRA Industrial Services Corporation No. 4229 Gen. Mojica Makati City REYNALDO L. DELA CRUZ, JR. Chief Industrial Training Section Metals Industry & Research Development Center General Santos Avenue Bicutan, Taguig City SESINANDI C. ABULENCIA Vice President- Operations Welders Testing Laboratories 24th Floor Trident Tower, 312 Sen. Gil J. Puyat Avenue Makati City EDRALIN C. ICABALES Board of Trustees Philippine Welding Society DOST-MIRDC Compound, Gen. Santos Ave., Taguig City FERNANDO M. OPEDA Executive Director Philippine Welding Society DOST-MIRDC Compound, Gen. Santos Ave., Taguig City DOMINADOR C. ELEAZAR, JR. Supervising Officer Philippine Welding Society DOST-MIRDC Compound, Gen. Santos Ave., Taguig City --- PDF PAGE 121 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 117 The PARTICIPANTS in the National Validation of this Training Regulations ENGR. ISIDRO D. M