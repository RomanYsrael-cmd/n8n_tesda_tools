        "source_title": "MANAGE AND EVALUATE USAGE OF INFORMATION",
        "source_text": "--- PDF PAGE 32 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       28  \n UNIT OF COMPETENCY : \nMANAGE AND EVALUATE USAGE OF INFORMATION  \n \n         UNIT CODE \n     :    500311406 \n \n         UNIT DESCRIPTOR      : \nThis unit of competency covers the knowledge, skills and  \n \n \n \nattitudes required to support \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Review \ninformation \nneeds and \nsources \n1.1. The information needs \nof individuals/teams are \ndetermined and the \nsources are identified. \n1.2. Information held by the \norganisation is \nreviewed to determine \nsuitability and \naccessibility. \n1.3. Plans are prepared to \nobtain information that \nis not available or \naccessible within the \norganization. \n1.1. Analysis and \ndisplay \ntechniques \n1.2. Information \nevaluation issues \n1.3. Information \nstorage \nrequirements and \nmethods \n1.4. Reporting \nprocedures of the \norganisation \n1.1. Analysing record \ninformation \n1.2. Communicating \neffectively \n1.3. Disseminating \ninformation \n1.4. Presenting \ninformation \n \n2.  Collect and \nanalyze \ninformation \n2.1. Collection of \ninformation is \ninterpreted timely and \nrelevant to the needs of \nindividuals/teams. \n2.2. Information is collected \nin formal suitable for \nanalysis, interpretation \nand dissemination. \n2.3. Information is analyzed \nto identify relevant \ntrends and \ndevelopments in terms \nof the needs for which \nis acquired. \n2.1. Information \ncollection, \ncollation \n2.2. Analysis and \ndisplay \ntechniques \n2.3. Information \nevaluation issues \n2.4. Information \nstorage \nrequirements and \nmethods \n2.5. Reporting \nprocedures of the \norganisation \n2.1. Collecting and \ncollating information \n2.2. Analysing record \ninformation \n2.3. Communicating \neffectively \n2.4. Disseminating \ninformation \n2.5. Presenting \ninformation \n \n3. Use \nmanagement \ninformation \nsystems \n3.1. Management \ninformation systems \nare used to store and \nretrieve data for \ndecision making. \n3.2. Technology available in \nthe work area/ \norganisation is used to \nmanage information. \n3.3. Recommendations for \nimproving the \ninformation system are \nsubmitted to \ndesignated persons/ \ngroups. \n3.1. Analysis and \ndisplay \ntechniques \n3.2. Information \ncollection, \ncollation \n3.3. Information \nevaluation issues \n3.4. Information \nstorage \nrequirements and \nmethods \n3.5. Reporting \nprocedures of the \norganisation \n3.1. Analysing record \ninformation \n3.2. Collecting and \ncollating information \n3.3. Communicating \neffectively \n3.4. Disseminating \ninformation \n3.5. Presenting \ninformation \n3.6. Using management \ninformation systems \nto store and retrieve \ndata\n\n--- PDF PAGE 33 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       29  \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4. Report and \ndisseminate \nanalyzed \ninformation \n \n4.1. The results of \ninformation gathering, \nanalysis and synthesis \nare reported within \nspecified time frames \nand to the standard \ndefined by the \norganisation. \n4.2. The results of \ninformation gathering, \nanalysis and synthesis \nare reported so they \ncan be inputs to policy \ndevelopment and \norganisation decision \nmaking. \n4.3. Information which is \ngathered is \ndisseminated to \nappropriate personnel \nwithin the specified \ntimeframe \n4.1. Analysis and \ndisplay \ntechniques \n4.2. Information \ncollection, \ncollation \n4.3. Information \nevaluation issues \n4.4. Information \nstorage \nrequirements and \nmethods \n4.5. Reporting \nprocedures of the \norganisation \n \n4.1. Analysing record \ninformation \n4.2. Collecting and \ncollating information \n4.3. Communicating \neffectively \n4.4. Disseminating \ninformation \n4.5. Presenting \ninformation \n4.6. Using management \ninformation systems \nto store and retrieve \ndata\n\n--- PDF PAGE 34 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       30  \n   RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1 Routine and complex reports and submissions \n1.2 Briefing notes \n1.3 Ministerial \n1.4 Proposals \n1.5 Project plans \n1.6 Articles and promotional material \n \n2. Collection techniques \nor methods \n2.1 Collection techniques may include: \n2.1.1 Research \n2.1.2 Surveys \n2.1.3 Literature search \n2.1.4 Interviews \n2.1.5 Data bases \n2.1.6 Observation \n2.2 Collection methods may include: \n2.2.1 Indexing \n2.2.2 linking \n2.2.3 Sorting \n2.2.4 Comparing \n2.2.5 Categorizing \n2.2.6 Integrating \n \n3. Analysis  \nMay include: \n3.1. application of statistical methods \n3.2. mathematical calculations \n3.3. critical analysis \n3.4. problem solving \n4. Management \ninformation systems  \nMay include: \n4.1. Computers \n4.2. Communication channels \n4.3. Records management \n4.4. Procedures \n4.5. Manuals \n4.6. Protocol \n4.7. Legislation \n4.8. Guidelines and awards \n4.9. Organizational \n4.10. Legal and policy materials\n\n--- PDF PAGE 35 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       31  \n   EVIDENCE GUIDE \n \n1 Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified information needs and sources  \n1.2 \nCollected and analyzed information  \n1.3 \nDetermined the correct / preventive action \n1.4 \nUsed management information systems \n1.5 \nRecord and support information \n \nThese aspects may be best assessed using a range of scenarios \nwhat ifs as a stimulus with a walk through forming part of the \nresponse. These assessment activities should include a range of \nproblems, including new, unusual and improbable situations that \nmay have happened. \n2 Resource \nImplications \nSpecific resources for assessment \n2.1 \nEvidence of competent performance should be obtained by \nobserving an individual in an information management role \nwithin the workplace or operational or simulated environment. \n3 Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nWritten Test \n3.2 \nInterview \n \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of parts \nof this unit of competency. Simulation should be based on the \nactual workplace and will include walk through of the relevant \ncompetency components.  \n4 Context for \nAssessment \n4.1 \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n",
