        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Evaluated the effectiveness and efficiency of workplace systems, \nprocesses and procedures. \n1.2 Modelled the conscious process of critical inquiry to get new \ninsights that s/he can get in formulating action plans on \ncontinuous improvement in the workplace and real-life \n1.3 Practiced the habit of critical inquiry and curiosity in the \nworkplace \n1.4 Shown a thorough knowledge and understanding of how critical \nthinking impacts on individual lives, the broader community and \nwork situations. \n1.5 Developed practical action plans for improving workplace \nconditions. \n2. Resource \nImplications \n2.1. \nInteractions with specific challenges and situations to \ndemonstrate the application of critical thinking (this would \nusually involve interactions with others). \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Direct questioning combined with review of portfolios of \nevidence and third-party workplace reports of on-the-job \nperformance by the candidate  \n3.2 Evaluation of a candidate blog exploring different ideas and \nquestions  \n3.3 Review of candidate response to scenarios that allow the \ncandidate to apply critical thinking techniques to a life or work \nsituation, and to demonstrate ability to portray curiosity and \nexploration of new concepts \n3.4 Evaluation of candidate response to the challenge of adopting \ndifferent perspectives on a situation, and ability to both develop \nand respond to questions from those perspectives \n3.5 Observation of the candidate participating in a group problem-\nsolving session \n3.6 Oral or written questioning to assess knowledge of typical \nblockers to the critical thinking process. \n3.7 Life Narrative Inquiry to reflect life stories that reflect how critical \nthinking and problem solving is applied in the lives.  \n4. Context for \nAssessment \n4.1. In all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.",
