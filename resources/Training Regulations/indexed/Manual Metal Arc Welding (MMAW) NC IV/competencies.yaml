        "source_title": "DEVELOP AND LEAD TEAMS",
        "source_text": "--- PDF PAGE 13 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       9  \n  UNIT OF COMPETENCY :    DEVELOP AND LEAD TEAMS   \n \nUNIT CODE \n : 500311402 \n \n \nUNIT DESCRIPTOR \n : This unit covers the skills, knowledge and attitudes required to \ndetermine individual and team development needs and facilitate \nthe development of the workgroup. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Foster \nIndividual \ngrowth \n1.1  Learning and \ndevelopment needs \nof team members are \nsystematically \nidentified in line with \norganizational \nrequirements \n1.2  Development plan to \nmeet individual needs \nis collaboratively \ndeveloped and \nimplemented \n1.3  Individuals are \nencouraged to self -\nevaluate performance \nand identify areas for \nimprovement \n1.4  Feedback on \nperformance of team \nmembers is collected \nfrom relevant sources \nand compared with \nestablished team \nlearning process \n1.1 Effective \nworkplace \ncommunication, \ncoaching and \nmentoring \nprinciples \n1.2 Feedback \nprinciples and \nprocedures \n1.3 Working  \ninterdependently: \nstrategies and \ntechniques \n1.4 Leadership \nConcepts: \n• Types of \nDecisions \nTeams Make \n• Team \nResponsibilities \n• Problems That \nAffect Teams \n• Building Strong \nTeam \nCommunication \n• Expressing \nYourself on a \nTeam \n• Team Problem \nSolving \n \n1.1 Ability to read and \nunderstand a \nvariety of texts, \nprepare general \ninformation and \ndocuments \naccording to target \naudience; spell with \naccuracy; use \ngrammar and \npunctuation \neffective \nrelationships and \nconflict \nmanagement \n1.2 Coaching and \nmentoring skills to \nprovide support to \ncolleagues \n1.3 Communication \nskills including \nreceiving feedback \nand reporting, \nmaintaining \neffective \nrelationships and \nconflict \nmanagement \n1.4 Ability to relate to \npeople from a \nrange of social, \ncultural, physical \nand mental \nbackgrounds \n1.5 Planning skills to \norganize required \nresources and \nequipment to meet \nlearning needs \n1.6 Reporting skills to \norganize \ninformation; assess\n\n--- PDF PAGE 14 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       10  \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \ninformation for \nrelevance and \naccuracy; identify \nand elaborate on \nlearning outcomes \n1.7 Facilitation skills to \nconduct small \ngroup training \nsessions \n2. Foster \nindividual and \nteam growth \n2.1. Learning and \ndevelopment program \ngoals and objectives \nare identified to match \nthe specific \nknowledge and skills \nrequirements of \ncompetency \nstandards \n2.2. Learning delivery \nmethods are \nappropriate to the \nlearning goals, the \nlearning style of \nparticipants and \navailability of \nequipment and \nresources \n2.3. Workplace learning \nopportunities and \ncoaching/ mentoring \nassistance are \nprovided to facilitate \nindividual and team \nachievement of \ncompetencies \n2.4. Resources and \ntimelines required for \nlearning activities are \nidentified and \napproved in \naccordance with \norganizational \nrequirements \n2.1    Advanced \ncoaching and \nmentoring \ntechniques \n2.2   Performance \nevaluation \nconcepts \n2.3   Training and \ndevelopment \ntechniques  \n \n2.1 Instructional \nplanning and \ndelivery skills \n2.2 Monitoring and \nevaluation skills \n2.3 Mentoring and \ncoaching skills\n\n--- PDF PAGE 15 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       11  \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Monitor and \nevaluate \nworkplace \nlearning \n3.1   Feedback from \nindividuals or teams is \nused to identify and \nimplement \nimprovements in \nfuture learning \narrangements \n3.2  Outcomes and \nperformance of \nindividuals/teams are \nassessed and \nrecorded to determine \nthe effectiveness of \ndevelopment \nprograms and the \nextent of additional \nsupport \n3.3  Modifications to \nlearning plans are \nnegotiated to improve \nthe efficiency and \neffectiveness of \nlearning \n3.4  Records and reports of \ncompetency are \nmaintained within \norganizational \nrequirement \n3.1 Types and levels \nof learning \nevaluation \n3.2 Learning styles \nand strategies \n3.3 Training and \ndevelopment \napproaches \n \n \n3.1 Instructional \nplanning and \ndelivery skills \n3.2 Monitoring and \nevaluation skills \n3.3 Mentoring and \ncoaching skills\n\n--- PDF PAGE 16 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       12  \n \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4. Develop team \ncommitment and \ncooperation \n4.1  Open communication \nprocesses to obtain and \nshare information is \nused by team \n4.2   Decisions are reached \nby the team in \naccordance with its \nagreed roles and \nresponsibilities \n4.3   Mutual concern and \ncamaraderie are \ndeveloped in the team \n4.4  Career planning for \neach member are \nmonitored \n4.1 Career \ndevelopment for \ngroup members \n4.2 Principles of team \ncommitment and \ncooperation \n4.3  Team dynamics \nand performance \n4.1 Instructional \nplanning and \ndelivery skills \n4.2 Monitoring and \nevaluation skills \n4.3 Mentoring and \ncoaching skills \n5. Facilitate \naccomplishment of \nteam goals \n5.1  Team members actively \nparticipated in team \nactivities and \ncommunication \nprocesses \n5.2  Teams members \ndeveloped individual \nand joint responsibility \nfor their actions \n5.3  Collaborative efforts are \nsustained to attain \norganizational goals \n5.1 Group \nDevelopment \nProcess and \nPrinciples as \napplied in the \nworkplace \n5.2 Principles of \norganizational \ndevelopment   \n5.3 Collaboration \nprinciples and \nprocedures \n \n5.1 Instructional \nplanning and \ndelivery skills \n5.2 Monitoring and \nevaluation skills \n5.3 Mentoring and \ncoaching skills \n5.4 Organizational \nleadership\n\n--- PDF PAGE 17 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       13  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.    Learning and  \n      development needs \n \nMay include: \n1.1 Coaching, mentoring and/or supervision \n1.2 Formal/informal learning program \n1.3 Internal/external training provision \n1.4 Work experience/exchange/opportunities \n1.5 Personal study \n1.6 Career planning/development \n1.7 Performance appraisals \n1.8 Workplace skills assessment \n1.9 Recognition of prior learning \n1.10 Job design and enrichment \n2.   Organizational      \n      requirements \nMay include: \n2.1   Quality assurance and/or procedures manuals \n2.2   Goals, objectives, plans, systems and processes \n2.3   Legal and organizational policy/guidelines and    \n        requirements \n2.4   Safety policies, procedures and programs \n2.5   Confidentiality and security requirements \n2.6   Business and performance plans \n2.7   Ethical standards \n2.8   Quality and continuous improvement processes and     \n        standards \n3.   Feedback on    \n      performance \nMay include: \n3.1 Formal/informal performance appraisals \n3.2   Obtaining feedback from supervisors and    \n colleagues \n3.3   Obtaining feedback from clients \n3.4   Personal and reflective behavior strategies \n3.5   Routine and organizational methods for monitoring     \n        service delivery \n4.   Learning delivery   \n     methods \nMay include: \n4.1 On the job coaching or mentoring \n4.2 Problem solving \n4.3 Presentation/demonstration \n4.4 Formal course participation \n4.5 Work experience \n4.6 Involvement in professional networks \n4.7 Conference and seminar attendance \n4.8 Induction\n\n--- PDF PAGE 18 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       14  \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Identified and implemented learning opportunities for others \n1.2. Gave and received feedback constructively \n1.3. Facilitated participation of individuals in the work of the team \n1.4. Negotiated learning plans to improve the effectiveness of learning \n1.5. Prepared learning plans to match skill needs \n1.6. Accessed and designated learning opportunities  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2. Materials relevant to the proposed activity or tasks \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Observation of work activities of the individual member in relation \nto the work activities of the group \n3.2. Observation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3. Case studies and scenarios as a basis for discussion of issues \nand strategies in teamwork \n4. Context for \nAssessment \n4.1. Competency may be assessed in workplace or in a simulated \nworkplace setting \n4.2. Assessment shall be observed while tasks are being undertaken \nwhether individually or in-group\n",
