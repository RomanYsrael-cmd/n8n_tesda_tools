          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.1 Set up welding \nmachine  \n \n1.1 Selected welding \nmachine is prepared \nin accordance with job \nrequirements, welding \nprocedures and \nspecifications, \ndrawings, sketches \nand manufacturer’s \ninstructions. \n1.2 Welding machine is \nconnected to an \nindependent power \nsupply and set to the \npolarity required in \nthe welding \nprocedures / \nspecifications. \n1.3 Current is adjusted \nconsistent with job \nrequirements to \nproduce acceptable \nweld. \n1.4 Task is completed \nwithout causing \ndamage to the \nequipment, tools and \nmaterials and injury to \nself and others. \n1.5 Task is performed in \naccordance with \ncompany or industry \nrequirements and \nsafety procedure. \n1.6 Required output is \ncompleted as per \nWPS and verified by \nimmediate supervisor \n1.7 Safety requirements \nare complied as per \nwelding machine \nmanufacturers \nrecommendations \n1.1 Basic electricity \n1.2 Welding machine \nInstruction manual \n(including \nmaintenance, \nvalidation, \ncalibration) \n1.3 Arc welding \nProcesses \n1.4 Welding Procedure\nSpecification \n1.5 OSH Standards \n1.6 Work \n      Instructions \n      (written and \n       verbal).  \n1.7 Productivity work \nmeasurements \n1.8 Adherence to \nwork \nrequirements \n1.10 5S and Proper \nHousekeeping \n1.11 Waste \nSegregation/ 3R  \n1.12 AWF-CWCS/ \nISO 9606-1 / \nAWS D1.6 / \nASME IX. \n1.13 DOLE DO \n198s2018 \npolicies on OSH \nas applicable \n1.14 DOH guidelines \non safety and \nhealth as \napplicable \n \n \n \n \n1.1 Setting-up of \nwelding \nmachines \n1.2Understandin\ng and \napplying \nwelding \nprocedure \n1.3 Applying \nsafety \nprocedures\n\n--- PDF PAGE 63 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421               Promulgated  (9/14/2021)                       59  \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKI