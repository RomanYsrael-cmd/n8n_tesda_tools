  "source_text": "SECTION 1 MANUAL METAL ARC WELDING (MMAW) NC IV\n QUALIFICATION\n\nThe Manual Metal Arc Welding (MMAW) NC IV Qualification consists of competencies\nthat a person must achieve to weld austenitic stainless steel plates and pipes components as\nspecified drawings, welding procedure specification or oral instructions using MMAW process.\nMMAW is also known as Shielded Metal Arc Welding (SMAW).\n\n This Qualification conforms with the latest edition of ISO 9606-1: Qualification testing\nof welders — Fusion welding — Part 1: Steels, AWS D 1.6 Structural Welding Code- Stainless\nSteel; ASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing\nQualifications; and Asian Welding Federation- Common Welders Certification Scheme (AWF-\nCWCS).\n\nThis Qualification is packaged from the competency map of the Metals and Engineering\nSector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n500311401\nUtilize specialized communication skills\n500311402\nDevelop and lead teams\n500311403\n\n500311404\nPerform higher-order thinking processes and apply techniques in the\nworkplace\nContribute to the practice of social justice in the workplace\n500311405\n500311406\n500311407\n\n500311408\n\n500311409\nManage innovative work instructions\nManage and evaluate usage of information\nLead in improvement of Occupational Safety and Health (OSH)\nprograms, policies and procedures\nLead towards improvement of environment work programs, policies and\nprocedures\nSustain entrepreneurial skills\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE721202\nInterpret Drawings and Sketches\nMEE721210\nPerform Basic Workshop Measurements & Computations\nMEE721211\nContribute to Quality System\nMEE721205\nUse Hand Tools\nMEE721212\nPrepare Materials and Consumables\nInterpret Drawings and Sketches\nPerform Basic Workshop Measurements & Computations\nContribute to Quality Management System\nUse Hand Tools\nPrepare Materials and Consumables\n\nCODE NO.\nMEE721321\nMEE721322\nMEE721326\n\nCORE COMPETENCIES\nSet up Welding Equipment\nPrepare / Fit up Welding Joints\nWeld Austenitic Stainless Steel Plates and Pipes using\nMMAW\n\n--- PDF PAGE 6 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 2\n\nA person who has achieved this Qualification is competent to be a –\n\n-\nCarbon Steel Plate/ Pipe Welder (MMAW)\n-\nAustenitic Stainless Steel Plate/ Pipe Welder (MMAW)\n\n--- PDF PAGE 7 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 3"
