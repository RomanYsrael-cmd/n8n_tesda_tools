      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: MANUAL METAL ARC WELDING (MMAW) NC Level NC IV\n\nNominal Training Duration:\n47 Hours (Basic Competencies)\n40 Hours (Common Competencies)\n 56 Hours (Core Competencies)\n\n 143 Hours\n 80 Supervised Industry Learning (SIL)\n 223 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involved in applying safety practices,\ninterpreting drawings and sketches, performing basic workshop measurements and computing\nindustry calculations, contributing to Quality System, using hand tools, preparing weld\nmaterials and consumables, setting up welding equipment, preparing/fit up welding joints fit up\nweld materials, repairing welds and welding austenitic stainless plates and pipes using\nMMAW. This includes classroom learning activities and practical work in actual work site or\nsimulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 75 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n71\n\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and specific\ncommunication needs of clients\nand colleagues\n\n• Read\n➢ Communication\nprocess\n➢ Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n• Identify different\napproaches to meet\nthe needs of clients\nand colleagues\n• Lecture\n• Written\nexamination\n1 Hour\n\n--- PDF PAGE 76 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n72\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.2. Contribute to the development\nof communication strategies\n• Apply\ncommunication skills\nto fulfill job roles as\nspecified by the\norganization\n• Apply\ncommunication\ntechniques in\ncommunicating with\nclients and\ncolleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role\nboundari\nes setting\n➢ Negotiation\n➢ Establishing\nempathy\n• Describe strategies\nfor internal and\nexternal\ndissemination of\ninformation\n• Demonstration\n• Group discussion\n• Observation\n• Oral evaluation\n1 Hour\n1.3. Deliver a technical presentation\n• Enhance the\npresentation using\nappropriate media\n• Deliver a clear and\nsequential\npresentation within\ngiven time\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 77 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n73\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n1.4 Represent the\norganization\n\n• Describe criteria for\na good presentation\n• Prepare\npresentation\nmaterial for internal\nor external forums to\npromote the\norganization\n• Demonstration\n• Observation\n1 Hour\n1.5 Facilitate group discussion\n• Gather relevant\ninformation\n• Apply values in\nfacilitating\ndifferences in views\n• Demonstration\n• Observation\n1 Hour\n1.6 Conduct interview\n• Describe\ncommunication\nstrategies employed\nin interview\nsituations\n• Conduct interview\n• Apply organizations\nprocedure in\nmaintaining record