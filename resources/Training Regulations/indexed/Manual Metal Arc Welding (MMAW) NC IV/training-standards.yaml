mulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 84 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n80\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.3 Develop practical action plans\nfor improving workplace\nconditions\n• Use range of\nanalytical\ntechniques, growth\nmindset and\npositive\ncommunication\nstrategies in\ndeveloping action\nplans for efficiency\nand effectiveness\n• Examine different\nstrategies and\ntechniques in\ncommunicating\nresults, applying\ncritical thinking\npathway, assessing\neffectiveness and\nefficiency of\nsystems,\nprocesses and\nprocedures\n• Discuss concepts\ncreative negotiation\nskills, change\nmanagement and\nimprovement\nstrategies\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n• Project-based\nlearning\n2 Hours\n\n--- PDF PAGE 85 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n81\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe practice of\nsocial justice in\nthe workplace\n\n4.1 Update self on local, national\nand global trends/ issues in the\nworkplace\n• Explain the local,\nnational and global\nsystems and\nstructures\n• Discuss issues\naffecting interaction\nand connectedness\nof communities at\nlocal, national and\nglobal levels\n• Explain underlying\nassumptions and\npower dynamics\n(politics,\nunderstanding\npolitical system,\nsocial structures,\nlabor laws, labor\nrelations, human\nright)\n• Monitor trends and\nissues relevant to\nhuman rights,\ngender equality,\nculture of peace,\nglobal citizenship,\nand cultural\ndiversity using\ndifferent media\nplatforms\n• Analyze trends and\nissues relevant to\nhuman rights,\ngender equality,\nculture of peace,\ngl