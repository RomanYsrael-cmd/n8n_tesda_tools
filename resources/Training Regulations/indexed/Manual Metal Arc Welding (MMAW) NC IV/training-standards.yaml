  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for MANUAL METAL ARC WELDING (MMAW) NC IV.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: MANUAL METAL ARC WELDING (MMAW) NC Level NC IV\n\nNominal Training Duration:\n47 Hours (Basic Competencies)\n40 Hours (Common Competencies)\n 56 Hours (Core Competencies)\n\n 143 Hours\n 80 Supervised Industry Learning (SIL)\n 223 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involved in applying safety practices,\ninterpreting drawings and sketches, performing basic workshop measurements and computing\nindustry calculations, contributing to Quality System, using hand tools, preparing weld\nmaterials and consumables, setting up welding equipment, preparing/fit up welding joints fit up\nweld materials, repairing welds and welding austenitic stainless plates and pipes using\nMMAW. This includes classroom learning activities and practical work in actual work site or\nsimulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 75 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n71\n\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and specific\ncommunication needs of clients\nand colleagues\n\n• Read\n➢ Communication\nprocess\n➢ Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n• Identify different\napproaches to meet\nthe needs of clients\nand colleagues\n• Lecture\n• Written\nexamination\n1 Hour\n\n--- PDF PAGE 76 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n72\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.2. Contribute to the development\nof communication strategies\n• Apply\ncommunication skills\nto fulfill job roles as\nspecified by the\norganization\n• Apply\ncommunication\ntechniques in\ncommunicating with\nclients and\ncolleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role\nboundari\nes setting\n➢ Negotiation\n➢ Establishing\nempathy\n• Describe strategies\nfor internal and\nexternal\ndissemination of\ninformation\n• Demonstration\n• Group discussion\n• Observation\n• Oral evaluation\n1 Hour\n1.3. Deliver a technical presentation\n• Enhance the\npresentation using\nappropriate media\n• Deliver a clear and\nsequential\npresentation within\ngiven time\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 77 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n73\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n1.4 Represent the\norganization\n\n• Describe criteria for\na good presentation\n• Prepare\npresentation\nmaterial for internal\nor external forums to\npromote the\norganization\n• Demonstration\n• Observation\n1 Hour\n1.5 Facilitate group discussion\n• Gather relevant\ninformation\n• Apply values in\nfacilitating\ndifferences in views\n• Demonstration\n• Observation\n1 Hour\n1.6 Conduct interview\n• Describe\ncommunication\nstrategies employed\nin interview\nsituations\n• Conduct interview\n• Apply organizations\nprocedure in\nmaintaining records\nof interviews\n• Use questioning,\nlistening and\nnonverbal\ncommunication\ntechniques to client\ngroups\n• Group discussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 Hour\n\n--- PDF PAGE 78 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n74\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2. Develop and\nlead teams\n2.1 Foster individual growth\n\n• Discussion on Team\nLeadership and\nexpectation from\nteam leaders\n• Case study on\nlearning and\ndevelopment needs\nof team members\n• Discussion on\norganizational\nrequirements from\nteam members\n• Role play on\ncoaching and\nmentoring\n• Discussion on\npreparation of team\nmembers\ndevelopment plan\n• Role Play on\nproviding feedback\non performance\n•\nObservation\nLecture/\nDiscussion\n•\nCase Study\n•\nRole Play\n•\nRole Play\n•\nCase Study\n•\nWritten Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 Hours\n\n--- PDF PAGE 79 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n75\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2.2 Foster individual\nand team growth\n• Discussion on\nlearning and\ndevelopment\nprogram goal\nsetting\n• Preparation of\nlearning and\ndevelopment\nprogram goals\n• Discussion on\nlearning delivery\nmethods\n• Role play on the\ndifferent learning\ndelivery methods\n• Discussion on\nworkplace learning\nopportunities\n• Role play on\ncoaching and\nmentoring\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n--- PDF PAGE 80 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n76\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Monitor and evaluate workplace\nlearning\n• Discussion on the\ndifferent levels of\nlearning evaluation.\n• Discussion on the\ndifferent methods\nused to evaluate\nlearning\n• Develop reporting\nsystem for\nmonitoring of\nperformance\nattributed to\nlearning programs\n• Gathering of\ninformation to\nevaluate individual\nperformance\nattributed to\nlearning programs\n• Case study on\nmodification of\nlearning plan based\non performance\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n--- PDF PAGE 81 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n77\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.4 Develop team commitment and\ncooperation\n• Discussion on\nteam commitment\nand cooperation\nand its impact to\nattainment of goals\n• Play games on\nteam commitment\nand cooperation\n• Discussion on\nteam dynamics\nand its relation to\nteam performance\n• Play games on\nteam dynamics\nand performance\n• Development of\ncareer plans\n\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.5 Facilitate accomplishment of\nteam goals\n• Perform team\nbuilding activities\ntowards improving\ncommunication\namong team\nmembers, goal\nsetting and\nimproving\nperformance\n• Case studies\ninvolving\ncollaborative\nactivities to\nimprove attainment\nof group goals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 Hour\n\n--- PDF PAGE 82 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n78\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n3. Perform higher-\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\n3.1 Evaluate effectiveness and\nefficiency of the workplace\nsystems, processes and\nprocedures\n• Examine current\nsystems,\nstandards,\nprocedures and\nprotocols in the\nworkplace\n• Discuss different\nmethods of critical\nand appreciative\ninquiry and their\nrelevance to\ndifferent situations\n• Form habit of\nasking questions\nand taking\nresponsibility for\nanswers\n• Appreciate\nimportance of why\nquestions for\nindividuals,\nbusinesses and\ncommunities\n• Use range of\nanalytical\ntechniques\n• Examine different\nstrategies and\ntechniques in\ncommunicating\nresults, applying\ncritical thinking\npathway,\nassessing\neffectiveness and\nefficiency of\nsystems,\nprocesses and\nprocedures\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 83 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n79\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit of critical inquiry\nand curiosity in the workplace\n• Discuss different\nmethods of critical\nand appreciative\ninquiry and their\nrelevance to\ndifferent situations\n• Form habit of\nasking questions\nand taking\nresponsibility for\nanswers\n• Appreciate\nimportance of why\nquestions for\nindividuals,\nbusinesses and\ncommunities\n• Use range of\nanalytical\ntechniques, growth\nmindset and\npositive\ncommunication\nstrategies\n• Examine different\nstrategies and\ntechniques in\ncommunicating\nresults, applying\ncritical thinking\npathway, assessing\neffectiveness and\nefficiency of\nsystems,\nprocesses and\nprocedures\n• Discuss insights on\nworkplace\neffectiveness and\nefficiency\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Cas