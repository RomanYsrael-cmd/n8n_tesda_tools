      "source_text": "1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry\nor recognized industry sector; (Learning system is driven by\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance\nof work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and\nattitude into account but requires evidence of actual performance of\nthe competency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all\nspecified competencies not on the specified nominal duration of\nlearning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n--- PDF PAGE 105 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n101\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy\ncorrespondence\nstudy,\naudio,\nvideo,\ncomputer\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• Supervised Industry Learning (SIL) or on-the-job training (OJT)\nis an approach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies as prescribed in the\ntraining regulations. It is imperative that the deployment of\ntrainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to\nprevent opportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship - Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\nTraining is integrated into the production process and\napprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n--- PDF PAGE 106 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n102\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP).\n\n3. Republic Act. No. 11551, “An Act Integrating Labor Education in the\nTertiary Education Curriculum” seeks to integrate labor education in the\nTechnical Vocational Education and Training (TVET) curriculum. As\nprovided in Section 3.b., “Labor education refers to the teaching of basic\nknowledge on labor rights and other skills relating to negotiation,\nfostering smooth interpersonal relations in the workplace, and\nmechanisms for redress of grievances and other concerns.”\n\n The Implementing Rules and Regulations for RA 11551 is still being\ndrafted by the TWG as of the date when this proposed TR is being\npresented to the TESDA Board for approval and promulgation. In the\nmeantime, that TESDA is finalizing the labor education framework that\nwill serve as a basis in developing the labor education curriculum for\nTVET, the process of integration shall be done by integrating labor\neducation concepts in the Competency Based Curriculum (CBC) that will\nbe developed by the TVIs that intends to register the TVET program.\nThe labor education concepts to be integrated in the CBC shall be\nderived from the definition of labor education provided in Republic Act.\nNo. 11551.",
