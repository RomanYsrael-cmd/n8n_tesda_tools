4 Spatters\n2.5 Slag inclusion\n2.6 Concavity/convexity\n2.7 Excessive reinforcement\n2.8 Burn Through/ Melt Through\n2.9 Crater cracks\n2.10 Cracks\n2.11 Lack of Fusion\n2.12 Under Fill\n2.13 Overlap\n2.14 Misalignment\n2.15 Distortion\n\n--- PDF PAGE 73 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 69\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Welded austenitic stainless pipes in H-\nLO45(6G) positions to acceptable standard\nfollowing the approved WPS.\n1.2 Observed safety measures applicable to\nworksite operation\n1.3 Communicated effectively with others to\nensure effective work\n1.4 Observed and complied with the productivity\nrequirements\n1.5 Complied with attitudinal work requirements\n2. Resource implications\nThe following resources must be provided:\n2.1 Well ventilated work area/shop with\nappropriate welding machines, accessories,\noven, tools, positioners, jigs and fixtures\n2.2 Supplies and materials\n2.3 PPE,\n2.4 Relevant documentation such as WPS and\n working drawing\n2.5 Fire Extinguishers\n3. Method of assessment\nCompetency must be assessed through:\n3.1 Observation and interview\n3.2 Demonstration and interview\n3.3 Written test\n3.4 Portfolio\n3.5 Nondestructive (NDT) and/or Destructive\n testing(DT) of test coupon\n4. Context of assessment\n4.1 Competency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting or at the\ndesignated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 74 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 70\n\nSECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for MANUAL METAL ARC WELDING (MMAW) NC IV.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: MANUAL METAL ARC WELDING (MMAW) NC Level NC IV\n\nNominal Training Duration:\n47 Hours (Basic Competencies)\n40 Hours (Common Competencies)\n 56 Hours (Core Competencies)\n\n 143 Hours\n 80 Supervised Industry Learning (SIL)\n 223 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involved in applying safety practices,\ninterpreting drawings and sketches, performing basic workshop measurements and computing\nindustry calculations, contributing to Quality System, using hand tools, preparing weld\nmaterials and consumables, setting up welding equipment, preparing/fit up welding joints fit up\nweld materials, repairing welds and welding austenitic stainless plates and pipes using\nMMAW. This includes classroom learning activities and practical work in actual work site or\nsimulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 75 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n71\n\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and specific\ncommunication needs of clie