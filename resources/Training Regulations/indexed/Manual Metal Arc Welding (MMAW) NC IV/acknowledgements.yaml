etencies not on the specified nominal duration of\nlearning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n--- PDF PAGE 105 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n101\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy\ncorrespondence\nstudy,\naudio,\nvideo,\ncomputer\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• Supervised Industry Learning (SIL) or on-the-job training (OJT)\nis an approach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies as prescribed in the\ntraining regulations. It is imperative that the deployment of\ntrainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to\nprevent opportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship - Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\nTraining is integrated into the production process and\napprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n--- PDF PAGE 106 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n102\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP).\n\n3. Republic Act. No. 11551, “An Act Integrating Labor Education in the\nTertiary Education Curriculum” seeks to integrate labor education in the\nTechnical Vocational Education and Training (TVET) curriculum. As\nprovided in Section 3.b., “Labor education refers to the teaching of basic\nknowledge on labor rights and other skills relating to negotiation,\nfostering smooth interpersonal relations in the workplace, and\nmechanisms for redress of grievances and other concerns.”\n\n The Implementing Rules and Regulations for RA 11551 is still being\ndrafted by the TWG as of the date when this proposed TR is being\npresented to the TESDA Board for approval and promulgation. In the\nmeantime, that TESDA is finalizing the labor education framework that\nwill serve as a basis in developing the labor education curriculum for\nTVET, the process of integration shall be done by integrating labor\neducation concepts in the Competency Based Curriculum (CBC) that will\nbe developed by the TVIs that intends to register the TVET program.\nThe labor education concepts to be integrated in the CBC shall be\nderived from the definition of labor education provided in Republic Act.\nNo. 11551.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the\nfollowing requirements:\n\n• Must have completed training in Manual Metal Arc Welding (MMAW) NC III or\na holder of MMAW NC III\n• Must possess good communication skills\n• Physically fit (including differently-abled person)\n• Can perform basic mathematical computation\n\n--- PDF PAGE 107 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n103\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\n Recommended list of tools, materials and equipment for the training of 20\ntrainees for Manual Metal Arc Welding NC IV.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices and\ntheir availability in the local market.\n\n A. (Full Qualification)\n\nTOOLS\nQTY\nDescription\n20 pcs.\nStainless Chipping Hammer\n\n40 pcs.\nStainless Steel brush\n20 prs.\nStainless / chrome or nickel plated Pliers/ tongs\n\n20 pcs.\nFiles-bastard cut\n20 pcs.\nWelding Mask\n20 pcs\nWelding apron/jacket\n40 prs.\nWelding gloves (long)\n20 prs.\nSafety goggles, wide vision, clear\n5 prs.\nSafety\nGoggles (shade 3-5)\n20 pcs.\nTri square 300 mm. Long\n20 pcs.\nSteel rule 300mm. long\n20 pcs.\nFiles-half round\n20 pcs.\nWelding gauges\n60 pcs\nRespirator (as per NIOSH)\n20 prs\nSafety Shoes (High-cut)\n10 pcs\nAdjustable wrench 12 inch\n\n--- PDF PAGE 108 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n104\n\n10 pcs\nC- Clamps (8inch)\n1 unit\nClamp Ammeter (Optional)\n5 unit\nSpirit Level\n\nMATERIALS (Per Participant)\nQTY\nDescription\n10 kgs.\nElectrodes 3.2mm E308L (ISO = E308L)\n3 pcs\nDark glass lens\n9 pcs\nClear glass lens\n30 pcs.\nStainless Cutting disc 3/32” X 5/8” X 4”\n5 pcs\n\nStainless Grinding disc 1/4” X 5/8” X 4”\n18 pcs.\nAustenitic Stainless plate 10mm x 150mm x 200mm\n20 pcs.\nAustenitic Stainless pipe,\n100ø mm. x 125mm (sch. 40 )\n12 pcs.\nAustenitic Stainless pipe,\n150ø mm. x 125mm (sch. 80 )\n\n--- PDF PAGE 109 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n105\n\nEQUIPMENT\nQTY\nDescription\n10 units\nMMAW/SMAW machine AC/DC 250-300 Amps. and\naccessories\n10pcs.\nWelding table with welding positioners\n1 unit\nElectrode oven (Big)\n\n10 units\nPortable disc grinder\n1 set\nVentilation System\n2 units\nWork bench w/ bench vise on 4 corners\n2 sets\nPlasma cutting machine with complete accessories\n2 units\nPedestal /bench grinding machine\n2 units\nIndustrial fan\n5 units\nPortable Oven (quiver)\n4 Units\nFire Extinguishers\n3 units\nWaste Bins\n1 Unit\nScrap Bin\n2 sets\nLiquid Penetrant Test (PT) kit\n1 Unit\nMechanical Press (break/bend test)\n1 unit\nPlate and pipe beveling cutting equipment\n(Mechanical or Automatic)\n\n--- PDF PAGE 110 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n106\n\n3.5 TRAINING FACILITIES\n\nThe welding workshop must be of concrete structure. Based on class size of\n20 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY.\nTOTAL AREA IN\nSQ. METERS\nContextual Learning\nArea\n(Lecture Room)\n3 x 4\n12\n1\n12\nDistance Learning\n(Laboratory/Workshop/\nActivity area)\n\n56\n\n56\n-\nWelding Booth*\n2 X 1.5 = 3\n3 x 10 booths\n30\n10\n30\n-\nGrinding Booth*\n2 X 1.5\n\n3\n2\n6\n-\nMaterials/Preparat\nion Area*\n2 X 2.5\n\n5\n2\n10\n-\nBench work Area*\n2 X 2.5\n\n5\n2\n10\nStorage Area (Tool room\n& S/M storage area)\n4 X 5\n\n20\n1\n20\nLearning Resource\nArea*\n5 X 7\n\n35\n\n1\n35\nWash Area /Comfort\nRoom (male & female)\n2.5 X 4\n10\n1\n10\nCirculation Area**\n\n(27.3)\n\nTotal Workshop Area\n\n (160.3~160)\n\nNOTE: Access to and use of equipment /facilities can be provided through cooperative\narrangements or MOA with other partner companies\n.\n\n--- PDF PAGE 111 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n107\n\n 3.6 TRAINER’S QUALIFICATIONS FOR MANUAL METAL ARC WELDING (MMAW) NC IV\n\n•\nHolder of National TVET Trainer Certificate Level I (NTTC Level I) in\n Manual Metal Arc Welding (MMAW) NC IV\n•\nMust be physically fit (including differently-abled person)\n•\nMust have at least 2 years welding job/ industry/ teaching experience\n with at least 24 hours training in Supervisory Course\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 112 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n108\n\nSECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment\nis to confirm that an individual can perform to the standards expected at the\nworkplace as expressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence on all unit/s of competency in a\nqualification with a promulgated Training Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in\naccordance with the requirements identified in the evidence guide of\nthe relevant unit/s of competency.\n\n4.1.3 The\nindustry\nshall\ndetermine\nassessment\nand\ncertification\nrequirements for each qualification with promulgated Training\nRegulations: It includes the following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work and/or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment:\n\n4.1.5 For all Shielded Metal Arc Welding NC IV holder, the\nindividual/holder will have to undergo assessment in the amended\nTR for Manual Metal Arc Welding (MMAW) NC IV.\n\n--- PDF PAGE 113 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n109\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where gaps\nexist, including readiness for assessment.\n\nThis document can:\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.\nAssist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior `\n4.2.2 Accredited\nAssessment Center.\nOnly Assessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 114 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 110\n\nANNEX A\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral workplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute\nto workplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe workplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in the\nworkplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nUtilize\nspecialized\ncommunication\nskills\nDevelop\nand lead\nteams\nPerform higher-\norder thinking\nprocesses and\napply\ntechniques in\nthe\nworkplace\n\nContribute\nto the\npractice of\nsocial\njustice in\nthe\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\nLead towards\nimprovement\nof\nenvironment\nwork\nprograms,\npolicies\nand\nprocedures\n\nSustain\nentrepreneurial\nskills\n\nCOMPETENCY MAP –\nMETALS AND ENGINEERING SECTOR SECTOR\n MANUAL METAL ARC WELDING (MMAW) NC IV\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 115 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 111\n\nInterpret\ndrawings\nand sketches\n\nPerform basic\nworkshop\nmeasurements\n& computations\n\nContributes to\nquality\nmanagement\nsystem\n\nUse hand\ntools\n\nPrepare\nmaterials and\nconsumables\n\nWeld carbon\nsteel plates\nusing MMAW\n\nWeld carbon\nsteel plates\nusing GMAW\n\nWeld carbon\nsteel pipes\nusing GMAW\n\nWeld carbon\nsteel plates\nusing GTAW\n\nWeld carbon\n steel pipes\nusing GTAW\n\nWeld carbon\nsteel plates\nusing FCAW\n\nWeld carbon\nsteel pipes\n using FCAW\n\nPrepare/ fit up\nwelding joints\n\nWeld alloy\nsteel plates\nusing GMAW\n\nWeld alloy\nsteel pipes\nusing GMAW\n\nWeld alloy steel\nplates using\nGTAW\n\nWeld alloy steel\npipes using\nGTAW\n\nWeld alloy\nsteel plates\nusing FCAW\n\nWeld alloy\nsteel pipes\n using FCAW\n\nSet up welding\nequipment\n\nWeld carbon\nsteel plates and\npipes\nusing MMAW\n\nWeld alloy steel\nplates using\nMMAW\n\nWeld alloy steel\npipes using\nMMAW\n\nPerform gas\nwelding in\ncarbon steel\nplates and tubes\n\nPerform gas\nwelding in alloy\nsteel plates\nand tubes\n\nWeld plates\nusing SAW\n\nWeld austenitic\nstainless steel\nplates and\npipes\nusing MMAW\n\nCOMMON COMPETENCIES\n\nCORE COMPETENCIES\n\n--- PDF PAGE 116 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 112\n\nGLOSSARY OF TERMS\n\n Austenitic Are classified in 200 and 300 series, with 16%-30%\n Stainless\n chromium and 2 % to 20% nickel for enhanced surfaced\n\nquality, formability, increased corrosion and wear resistance.\n\nAustenitic stainless steels are non hardenable and non\n\nmagnetic.\n\nbase metal\n (aka: parent metal) the metal that is to be worked, cut or welded\n\nbead\n\n a weld deposit resulting from a single welding pass\n\nbend test\nA destructive testing method that calls for a test specimen taken from\na test coupon to be bent to a specified bend radius. This test is used\nto evaluate the soundness and ductility of the welded joint\n\nbreak test\nA destructive testing method in which a fillet weld test is loaded so\nthat the weld root is in tension until it breaks. Once broken, soundness\nof the welded joint is evaluated by examining the fractured surface for\nincomplete fusion, porosity, and other internal discontinuities. This test\nis primarily used for welders qualification.\n\n discontinuity\n An interruption of the typical structure of a material, such as lack\nof homogeneity in its mechanical, metallurgical or physical\ncharacteristics. A discontinuity is not necessarily a defect.\n\ndestructive\nis undertaken in order to understand a specimen’s performance\ntesting (DT)\nor material behavior. These procedures are carried out to the test\nspecimen’s failure. DT methods are commonly used for materials\ncharacterization, fabrication validation, failure investigation, and can\nform a key part of engineering critical assessments.\n\nfillet weld\n A weld of approximately triangular cross section joining two\n surfaces approximately at right angles to each other in a lap joint,\n T-joint, or corner joint.\n\njig\n(aka: Fixture) A device designed to hold and maintain parts in proper\nrelation to each other. Jig and fixture have essentially the same\nmeaning. They both function to facilitate assembly of parts and to hold\na work piece assembly in proper alignment and position during\nhandling and welding.\n\njoint\n The junction of members or the edges of the base metal that are\n\n to be joined or have been joined by welding\n\n--- PDF PAGE 117 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n\n113\n\nliquid\n A non-destructive testing method in which a penetrating agent is\npenetrant used to detect weld defects and other possible flaws in\ntesting (PT)\n non-magnetic and non-porous material\n\nMMAW\n (A.k.a SMAW) An arc welding process with an arc between a\n\n covered electrode and the weld pool. The process is used with\n\n shielding from the decomposition of the electrode covering,\n\n without the application of pressure, and with filler metal from the\n\n electrode.\n\nnon-destructive is a testing and analysis technique used by the industry to\ntesting (NDT) evaluate the properties of a material, component, structure or\n system for characteristic differences or welding defects and\n\n discontinuities without causing damage to the original part.\n\nOccupational\n refers to a set of rules issued by DOLE which mandates\nSafety the adoption and use of appropriate practices, means,\nand Health\n methods, reasonably standards operations or processes, and\n(OSH) working conditions necessary to ensure safe and healthful\n employment.\n\nquiver\n (Aka:portable oven, hotbox) . A temperature controlled electrode\n container used during welding in order to maintain the required\n holding temperature after baking. This ensures electrode\n drynessbefore use and prevents moisture absorption in the flux\n covering due to humidity conditions\n\n shearing\n are multipurpose devices used in the cutting of alloys and other\n\nmachine\n sheet metal. Some shearing machines use a scissor-like,\n\n angular shear action to cut metal into sheets or strips. Other,\n\n larger machines use a straight shear action with the blade\n\n fixed at an angle as opposed to the angular movement.\n\nvisual\n when an object is inspected by the eye directly.\ninspection\n\nweld defects\n A discontinuity or discontinuities accumulated effect that render\n\n a welded part or product unable to meet minimum applicable\n acceptance standard or specification.\n\nwelding\n A joining process that causes materials to fuse and merge by\n heating them to the welding temperature, with or without the\n application of pressure or by the application of pressure alone,\n and with or without using filler metal.\n\n welding A component of the welding circuit through which current is run\n\nelectrode and that ends at the arc, in a molten conductive slag, or in the\n\n base metal. The flux covered consumable filler in MMAW/SMAW\n\n--- PDF PAGE 118 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n\n114\n\n welding torch a gas mixing and burning tool for the welding of metals\n\nweldment\n an assembly or structure whose component parts are joined\n by welding\n\nWelding\n A document providing the required welding variables for a\nProcedure\n specific application to assure repeatability by properly trained\nSpecification\n welders and welding operators.\n (WPS)\n\n--- PDF PAGE 119 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n\n115\nREFERENCES:\n\n1.\nTraining Regulations for Shielded Metal Arc Welding (SMAW) NC IV\n2.\nAsian Welding Federation (AWF) - Common Welder Certification\nScheme (CWCS); aligned to ISO 9606-1 Standard\n3.\nISO 9606-1: Qualification testing of welders — Fusion welding — Part 1:\nSteels\n4.\nAWS D 1.6 Structural Welding Code- Stainless Steel\n5.\nASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and\nFusing Qualifications\n\n--- PDF PAGE 120 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n\n116\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of this Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT REVIEW PANEL\n\nGERALD S. GALLARDO\nPresident\nCIFRA Industrial Services Corporation\nNo. 4229 Gen. Mojica\nMakati City\nREYNALDO L. DELA CRUZ, JR.\nChief Industrial Training Section\nMetals Industry & Research Development\nCenter\nGeneral Santos Avenue\nBicutan, Taguig City\n\nSESINANDI C. ABULENCIA\nVice President- Operations\nWelders Testing Laboratories\n24th Floor Trident Tower,\n312 Sen. Gil J. Puyat Avenue\nMakati City\nEDRALIN C. ICABALES\nBoard of Trustees\nPhilippine Welding Society\nDOST-MIRDC Compound, Gen. Santos Ave.,\nTaguig City\n\nFERNANDO M. OPEDA\nExecutive Director\nPhilippine Welding Society\nDOST-MIRDC Compound, Gen. Santos Ave.,\nTaguig City\nDOMINADOR C. ELEAZAR, JR.\nSupervising Officer\nPhilippine Welding Society\nDOST-MIRDC Compound, Gen. Santos Ave.,\nTaguig City\n\n--- PDF PAGE 121 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021)\n\n117\nThe PARTICIPANTS in the National Validation of this Training Regulations\n\nENGR. ISIDRO D. MILLO\nMetals Industry Research and\nDevelopment Center (MIRDC)\n\nMR. ROLANDO R. ORTAÑEZ\nAsia Corrosion Services, Inc\nMR. JUANITO R. BALAGTAS\nAsia Corrosion Services, Inc\n\nMR. ERNESTO B. POLICARPIO\nELSE Trading\nMR. GALILEO S. SANTOS\nNYK-PHIL Maritime E-Training Inc.\n\nENGR. DENNIS B. DE TORRES\nKCD Technical Institute\nMR. ALBERT IDIO\nSteel Asia Manufacturing Corp\nENGR. VICTOR C. EVIDENTE\nEEI Corporation\n\nMR. ALVIN A. BALAURO\nSOUDOWELD Industrial Phils., Inc.\n\nENGR. ANDREW JOHN MABAQUIAO\nTechnological University of the\nPhilippines, Manila\n\nENGR. ERIC JUDE S. SOLIMAN\nHYTEC Power Inc.\n\nENGR. GREGORIO A. CORONEL\nAtlantic, Gulf & Pacific Co. of Manila, Inc.\nENGR. DAVID S. DUMAGUIT\nAboitiz Construction, Inc. –\n Me