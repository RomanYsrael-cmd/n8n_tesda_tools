      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Evaluated the effectiveness and efficiency of workplace systems, processes and procedures. 1.2 Modelled the conscious process of critical inquiry to get new insights that s/he can get in formulating action plans on continuous improvement in the workplace and real-life 1.3 Practiced the habit of critical inquiry and curiosity in the workplace 1.4 Shown a thorough knowledge and understanding of how critical thinking impacts on individual lives, the broader community and work situations. 1.5 Developed practical action plans for improving workplace conditions. 2. Resource Implications 2.1. Interactions with specific challenges and situations to demonstrate the application of critical thinking (this would usually involve interactions with others). 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Direct questioning combined with review of portfolios of evidence and third-party workplace reports of on-the-job performance by the candidate 3.2 Evaluation of a candidate blog exploring different ideas and questions 3.3 Review of candidate response to scenarios that allow the candidate to apply critical thinking techniques to a life or work situation, and to demonstrate ability to portray curiosity and exploration of new concepts 3.4 Evaluation of candidate response to the challenge of adopting different perspectives on a situation, and ability to both develop and respond to questions from those perspectives 3.5 Observation of the candidate participating in a group problem- solving session 3.6 Oral or written questioning to assess knowledge of typical blockers to the critical thinking process. 3.7 Life Narrative Inquiry to reflect life stories that reflect how critical thinking and problem solving is applied in the lives. 4. Context for Assessment 4.1. In all workplace, it may be appropriate to assess this unit concurrently with relevant teamwork or operation units."
    },
