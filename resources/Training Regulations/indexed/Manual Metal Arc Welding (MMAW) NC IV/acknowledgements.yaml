ork\n1.4 Observed and complied with the productivity\nrequirements\n1.5 Complied with attitudinal work requirements\n2.Resource implications\nThe following resources must be provided:\n2.1 Well ventilated work area/shop with appropriate\nwelding, machines, accessories, positioners,\njigs and fixtures\n2.2 PPE\n3.Method of assessment\nCompetency must be assessed through:\n3.1 Observation/evaluation\n3.2 Oral questioning\n4.Context of assessment\nCompetency to be assessed while a task is being\nundertaken in the workplace or in a simulated\nworkplace setting or at the designated TESDA\nAccredited Assessment Center.\n\n--- PDF PAGE 66 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 62\nUNIT TITLE\n: PREPARE / FIT UP WELDING JOINTS\n\nUNIT CODE\n: MEE721322\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n preparing/ fitting up welding joints.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.Set up root\nopening and\nalignment\n\n1.1\nRoot opening and\nalignment is set up\n1.2 Root opening is set up\nin accordance with the\nrequirements of WPS.\n1.3 Welding joint is\naligned within the\nrange of acceptability\nof code and standard.\n1.4 Task is performed in\naccordance with\ncompany or industry\nrequirements and\nsafety procedure\n1.5 Required output is\ncompleted as per WPS\nand verified by\nimmediate supervisor\n1.1 Basic welding\njoints\n1.2 Parts of welding\njoint\n1.3 Welding joint\ndesign\n1.4 Dimensional\nMeasurement\n1.5 OSH Standards\n1.6 Work Instructions\n(written and\nverbal).\n1.7 Productivity work\nmeasurements\n1.8 Adherence to\nwork\nrequirements.\n1.9 5S and Proper\nHousekeeping\n1.9\nWaste\nSegregation/ 3R\n1.10 AWF-CWCS/\nISO\n9606-1\n/\nAWS\nD1.6\n/\nASME IX.\n1.11 DOLE DO\n198s2018\npolicies on OSH\nas applicable\n1.12 DOH guidelines\non safety and\nhealth as\napplicable\n\n1.1 Setting up root\nopening and\n