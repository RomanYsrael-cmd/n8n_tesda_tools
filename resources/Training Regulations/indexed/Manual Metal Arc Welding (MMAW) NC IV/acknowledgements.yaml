uestions\n3.3 Demonstration\n\n4.\nContext for\nassessment\n4.1 Competency may be assessed in the workplace or in\nsimulated workplace environment or at the designated TESDA\nAccredited Assessment Center.\n\n--- PDF PAGE 50 ---\nManual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 46\nUNIT OF COMPETENCY : PERFORM BASIC WORKSHOP MEASUREMENTS &\nCOMPUTATIONS\n\nUNIT CODE\n\n: MEE721210\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to perform\nproper measurement and simple calculations using the four\nfundamental operations.\n\n ELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and use\nmeasuring tools\n1.1 Measuring tools\nare selected\naccording to the\nrequirement.\n1.2 Measuring tools\nare used according\nto the requirement\n1.3 Measuring\ntechnique used is\ncorrect and\nappropriate to the\ndevice used.\n1.1 Types, purposes\nand accuracy of\nmeasuring\ninstruments\n1.2 Capability of\nmeasuring\ninstruments\n1.3 Part dimensions\nand tolerances\n1.4 Techniques for\nmeasuring\ndimensions\n1.1 Selecting\nmeasuring tools\n1.2 Obtaining\naccurate\nmeasurements\n1.3 Determining\nmeasuring\ntechnique\n\n2. Clean and store\nmeasuring tools\n2.1 Cleaning of\ndevices\nundertaken\naccording to\nstandard operating\nprocedures.\n2.2 Care of devices\nundertaken\naccording to\nmanufacturer’s\nspecifications.\n2.3 Storage of devices\nundertaken\naccording to\nstandard operating\nprocedures.\n2.1 Types, purposes\nand accuracy of\nmeasuring\ninstruments\n2.2 Capability of\nmeasuring\ninstruments\n2.3 Part dimensions\nand tolerances\n2.4 Techniques for\nmeasuring\ndimensions\n2.5 Care and storage\nprocedure of\nmeasuring tools\n\n2.1 Determining\nproper care and\nstorage of\nmeasuring tools.\n3.\nPerform four\nfundamental\noperations.\n3.1 Simple calculations\nare performed using\nfour fundamental\noperations.\n3.2 Correct formula are\napplied to isola