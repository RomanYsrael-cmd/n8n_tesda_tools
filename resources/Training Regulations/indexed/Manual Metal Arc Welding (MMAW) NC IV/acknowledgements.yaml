      "source_text": "-- PDF PAGE 5 --- Manual Metal Arc Welding (MMAW) NC IV – MEEMAW421 Promulgated (9/14/2021) 1 TRAINING REGULATIONS FOR MANUAL METAL ARC WELDING (MMAW) NC IV"
    },
    {
      "source_text": "SECTION 1 MANUAL METAL ARC WELDING (MMAW) NC IV QUALIFICATION"
    },
    {
      "source_text": "The Manual Metal Arc Welding (MMAW) NC IV Qualification consists of competencies that a person must achieve to weld austenitic stainless steel plates and pipes components as specified drawings, welding procedure specification or oral instructions using MMAW process. MMAW is also known as Shielded Metal Arc Welding (SMAW)."
    },
    {
      "source_text": "This Qualification conforms with the latest edition of ISO 9606-1: Qualification testing of welders — Fusion welding — Part 1: Steels, AWS D 1.6 Structural Welding Code- Stainless Steel; ASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing Qualifications; and Asian Welding Federation- Common Welders Certification Scheme (AWF- CWCS)."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of the Metals and Engineering Sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES"
    },
    {
      "source_text": "500311401 Utilize specialized communication skills 500311402 Develop and lead teams 500311403"
    },
    {
      "source_text": "500311404 Perform higher-order thinking processes and apply techniques in the workplace Contribute to the practice of social justice in the workplace 500311405 500311406 500311407"
    },
    {
      "source_text": "500311408"
    },
    {
      "source_text": "500311409 Manage innovative work instructions Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health (OSH) programs, policies and procedures Lead towards improvement of environment work programs, policies and procedures Sustain entrepreneurial skills"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES MEE721202 Interpret Drawings and Sketches MEE721210 Perform Basic Workshop Measurements & Computations MEE721211 Contribute to Quality System MEE721205 Use Hand Tools MEE721212 Prepare Materials and Consumables Interpret Drawings and Sketches Perform Basic Workshop Measurements & Computations Contribute to Quality Management System Use Hand Tools Prepare Materials and Consumables"
