sign is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both\non-and off-the-job as long as the learning is driven by the competency standards specified\nby the industry. The following training modality and its variations/ components may be\nadopted singly or in combination with other modalities when designing and delivering\ntraining programs:\n\n2.1.\nEnterprise-Based:\n\n• Enterprise-based Training- where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed at least 10 yrs. basic education or an alternative\nlearning systems (ALS) certificate of achievement with grade 10 equivalent\nholder\n•\nCan communicate orally & in writing\n•\nCan perform basic mathematical computations\n\n--- PDF PAGE 61 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015\n57\n\n3.4\n LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n3.4.1 Recommended list of tools, equipment and materials for the training of 25\ntrainees for Electronics FOL Operations NC II\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs\n\n5 pcs\n5 sets\n25 pcs\n\n5 pcs\n• Tweezers,\nStainless\n• Vacuum Pen\n• Metric Allen Keys\n• 12 Digit\nCalculator\n• Torque driver, 3-\nRTD\n\n*As\nrequired\nElectronics FOL\nmachines:\n5.4\nSolder Re-\nflow\n5.5\nSoldering\nStation\n5.6\nDispensing\nMachine\n5.7\nOven\n5.8\nPick and\nPlace Machine\n5.9\nInspection\nMachine\n\n25 sets\n\n25 pairs\n25 pairs\n25 pcs\nAppropriate materials\nfor training purposes:\nESD Apparel\n• Shoes\n• Smock and Head\ncap\n• ESD Jacket\n• Bunny suit\n• Face mask\n• Wrist/Foot\nground strap\n\nSafety shoes\n\nGloves\n\nSafety goggles\n5 sets\nWork tables with\nchairs\n2 pcs.\nWhite board\n1 unit\nLCD projector\n1 unit\nDesktop PC/Laptop\n\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nLaboratory Area\n5 x 8\n40\n1\n40\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n1 x 2\n2\n1\n2\n Total\n122\nFacilities / Equipment /\nCirculation**\n\n36\n Total Area\n\n158\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 62 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015\n58\n\n3.6 TRAINERS QUALIFICATIONS\n\nElectronics Front-of-Line Operations NC II\n\n• Must be a holder of Electronics Front-of-Line Operations NC II\n• Must have a TESDA Trainer’s Methodology Course certificate or must have\npassed the Train the Trainers certification process\n• Must be at least two-year college level or two-year vocational course graduate.\n• Must have at least 2-years relevant industry experience in the current field.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of the requirements of the units of competency. A certificate of\nachievement is issued for each unit of competency.\n\nThe result of the institutional assessment may be considered as evidence for the\nassessment for national certification. As a matter of policy, graduates of programs\nregistered with TESDA under this training regulation are required to undergo mandatory\nnational\ncompetency\nassessment\nupon\ncompletion\nof\nthe\nprogram.\n\n--- PDF PAGE 63 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015\n59"
