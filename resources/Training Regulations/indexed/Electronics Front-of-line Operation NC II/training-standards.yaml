s\nFOL sample units\n•\nIdentify usage and types of electronics FOL sample\nunits according to product criteria\n•\nLecture\n•\nDiscussion\n•\nWritten exam\n•\nPractical\n4 hrs\n\n--- PDF PAGE 58 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015\n54\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n•\nStudy and learn product orientation\n•\nLearn usage of appropriate PPE and ESD apparels\n•\nUse appropriate tools\n•\nPerform/Practice procedure in loading and\nprocessing electronics FOL sample units\n•\nPractice manual electronics FOL process based on\ninstruction and company procedures\n•\nLearn and identify machines alarms/errors\n•\nDetermine applicable out-of-control action\nplan(OCAP) for electronics FOL\n• Perform visual/ mechanical inspection\n• Accomplish production line documents\n\n•\nHands-on\n•\nViewing\nmultimedia\n\nexam\n\n2.4 Load electronics\nFOL production\nunits\n•\nIdentify/Determine electronics FOL operations\nprocess controls\n•\nStudy and learn product orientation and\nspecifications\n•\nIdentify usage of appropriate PPE and ESD\napparels\n•\nUse appropriate tools\n•\nPerform procedures in loading and processing\nproduction units based on product orientation and\nspecifications\n•\nCheck production output based on product criteria\n•\nPractice manual electronics FOL process based on\ninstruction and company procedures\n•\nDetermine machines alarms/errors\n•\nDetermine applicable out-of-control action\nplan(OCAP) on electronics FOL operations\n•\nVerify product criteria\n•\nPerform visual/ mechanical inspection\n•\nAccomplish electronics FOL production line\ndocuments\n•\nLecture\n•\nDiscussion\n•\nHands-on\n•\nViewing\nmultimedia\n\n•\nWritten exam\n•\nPractical\nexam\n\n4 hrs\n\n--- PDF PAGE 59 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015\n55\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMetho