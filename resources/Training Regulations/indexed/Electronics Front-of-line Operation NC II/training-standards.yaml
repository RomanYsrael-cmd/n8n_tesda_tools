ks\n• Describe effects of safety hazards\n• Group\ndiscussion\n• Oral evaluation\n\n•Read\n• Lecture\n• Written\nexamination\n\no Threshold Limit Value –TLV\n\n• Practice reporting safety hazards\n\n• Role play\n• Observation\n\n--- PDF PAGE 50 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015\n46\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Demonstrate evaluating hazards and risks\nusing communication equipment\n• Demonstration\n• Observation\n\n4.3 Control hazards\nand risks\n• Describe :\no Organization safety and health protocol\n• Group\ndiscussion\n• Oral evaluation\n\no Company emergency procedure practices\n\n• Practice personal hygiene\n• Demonstration\n• Observation\n\n• Practice drills on responding to emergency\n• Demonstration\n• Simulation\n• Observation\n\n4.4 Maintain\noccupational\nhealth and safety\nawareness\n• Identify emergency-related drills information\n• Lecture\n• Written\nexamination\n\n• Practice occupational safety and health\nstandards on personal records in the\nworkplace\n• Role play\n• Observation\n\n• Practice emergency related drills in the\nworkplace\n• Demonstration\n• Simulation\n\n• Observation\n\n--- PDF PAGE 51 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015\n47\n\nCOMMON COMPETENCIES\n(16 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n1. Use Hand\nTools\n1.1 Plan and\nprepare for\ntasks to be\nundertaken\n Plan and prepare for task/activity\n Identify different types and functions of hand tools\n Identify electronics hand tools and their uses\n Identify function, operation and common faults in\nelectronics hand tools\n Lecture /\nDemonstration\n Distance\neducation\nFilm Showing\n Written/Oral\nexamination\n Practical\ndemonstration\n½ hour\n1.2 Prepare hand\ntools\n Practice proper use of hand tools\n Practice checking and safety requirements in\nhandling tools\n Apply standard procedures in checking, identification\nand marking of safe or unsafe/ faulty tools\n Perform marking of safe or unsafe/ faulty hand tools\n\n Lecture /\nDemonstration\n Distance\neducation\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n½ hour\n1.3 Use\nappropriate\nhand tools and\ntest\nequipment.\n Apply safety handling of hand tools and test\nequipment\n Identify/Select electronics hand tools for adjusting,\ndismantling, assembling, finishing, and cutting\n Use appropriate hand tools and test equipment for\nthe job requirement\n Read and learn the -\n• Proper usage and care of hand tools\n• Types and uses of test equipment\n Identify common faults in the use of hand tools\n\n Lecture /\nDemonstration\n Distance\neducation\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n½ hours\n1.4 Maintain hand\ntools\n Apply safety requirements in maintenance of hand\ntools\n Read and understand processes, operations &\nsystems for:\n• Maintenance of tools\n• Storage of hand tools\n Apply 5S principles in maintenance of hand tools\n Lecture /\nDemonstration\n Distance\neducation\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n½ hours\n\n--- PDF PAGE 52 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW) Promulgated Dec. 16, 2015\n48\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n2. Apply Quality\nStandards\n4.1 Assess quality\nof received\nmaterials\n\n Identify relevant production processes, materials\nand products\n Study and interpret characteristics of materials,\nsoftware and hardware used in production\nprocesses\n Perform quality checking procedures\n Apply quality Workplace procedures\n Identify faulty materials\n Check quality of materials or component parts as per\nmanufacturer’s standards\nInterpret 