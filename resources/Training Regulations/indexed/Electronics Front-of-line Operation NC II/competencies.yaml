        "source_text": "--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n37\nUNIT OF COMPETENCY:    CHECK QUALITY COMPLIANCE OF FRONT-OF-LINE \nOPERATIONS FOR ELECTRONICS PRODUCTION LINE \n  \nUNIT CODE                     :    ELC313306 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes needed in \nperforming front-of-line (FOL) operations for electronics production \nline. This includes monitoring machine/equipment operation, \ncompleting lot traceability and performing visual machine \ninspection for electronics FOL production line. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Monitor \nelectronics \nFOL \noperation \n \n1.1. Output and yield are checked \nin accordance with production \nrequirements \n1.2. Out of control action plan \n(OCAP) is followed in case of \nany non-conformance or \ndeviation to the process  \n1.3. Electronics FOL production \nforms are accomplished in \naccordance with process \nrequirements \n Yield requirement \n Machine capacity \n Understanding of \nOCAP on electronics \nproduction line FOL \nmachine/ equipment \noperation \n Basic Statistical \nProcess Control (SPC) \n Completeness and \naccuracy of \ninformation on \nelectronics production \nline form for unusual \nmachine operation \n Reading skills \n Communication \nskills \n Monitoring skills \n Detecting \nabnormality or \nnon-conformance \n Writing skills \n2. Perform \nvisual \ninspection \n \n2.1. Finished products are \nchecked/ inspected using \nappropriate \ninstruments/tools  \n2.2. Physical defects are \nidentified based on product \nspecifications \n2.3. Conforming and non-\nconforming products are \nidentified and segregated in \naccordance with production \nprocedures \n2.4. Housekeeping procedures are \nobserved in accordance with \n5S discipline and established \nprocedures.\n Finished products \njudgment criteria on \nelectronics FOL \nprocesses \n Uses of appropriate \ninstruments/tools \n Procedures on \nidentification and \nsegregation of non-\nconforming products in \nelectronics FOL \noperation \n 5S principles \n Reading skills \n Communication \nskills \n Computer skills \n Observation Skills \n Detecting \nabnormality or \nnon-conformance \n Writing skills \n Skills in \nhousekeeping and \n5S \n3.  Complete \nelectronics \nFOL  lot \ntraceability \n \n3.1. Lot traceability are \ntransacted in accordance \nwith production procedures \n3.2. Conforming and non-\nconforming products are \nidentified and segregated in \naccordance with production \nprocedures \n3.3. Disposition of lots is \ndetermined in accordance \nwith product criteria \n Lot traceability   \n Types of electronics \nproduction line FOL \nproduct defects \n Process controls on \nlots traceability \n 5S principles \n Communication \nskills \n Computer skills \n Observation Skills \n Detecting \nabnormality or \nnon-conformance \n Writing skills \n\n\n--- PDF PAGE 42 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n38\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Production forms \nProduction forms may include: \n1.1 Lot summary \n1.2 SPC checklist \n1.3 Monitoring checklist \n2. Lot traceability \ntransaction \nTransaction may include: \n2.1 Manual \n2.2 Automated \n3. Disposition of lots \nDisposition of lots may include: \n3.1 Pass  \n3.2 Failed \n3.3 Hold \n3.4 Scrap \n3.5 Re-screen/ Re-work/Re-test \n4. Appropriate \ninstruments/tools \nAppropriate instruments/tools may include: \n4.1 Stereoscopic microscope  \n4.2 magnifying lens  \n4.3 profile projector/ comparator \n5. Physical defects \nPhysical defects may include: \n5.1 lead defects  \n5.2 marking defects  \n5.3 mold defects\n\n--- PDF PAGE 43 ---\nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n39\n \n     EVIDENCE GUIDE \n       \n1.  Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nMonitored electronics front-of-line (FOL) machine/ \nequipment operation based on product requirements \n1.2 \nCompleted electronics FOL lot traceability in accordance \nwith production procedures \n1.3 \nPerformed visual inspection in accordance to electronics \nproduction line standards \n \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1 \nAppropriate Electronics FOL machine and equipment \n2.2 \nTools (as indicated in the Range Of Variables) \n2.3 \nAppropriate production units and materials  \n2.4 \nWork Instructions Assessment rating sheet \n2.5 \nSample production checklist \n2.6 \nApplicable forms for specific equipment or machines \n2.7 \nProcedure and quality manuals \n2.8 \nPersonal Computer \n2.9 \nPrinter \n2.10 Reporting forms \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1 \nDemonstration with oral questioning \n3.2 \nDirect Observation with oral questioning \n3.3 \nWritten examination \n \n4.  Context for \nAssessment \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n",
