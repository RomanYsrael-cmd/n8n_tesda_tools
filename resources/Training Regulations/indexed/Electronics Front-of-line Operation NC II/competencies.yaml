l \nconcepts \n Kinds of workplace \nreport \n \n \n Apply basic \nmathematical \nprocesses of \naddition, \nsubtraction, \ndivision and \nmultiplication \n Data recording \n Report writing\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n4\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6. \nFace to face communication \n3. Storage \n3.1. \nManual filing system \n3.2.\nComputer-based filing system\n4. Forms \n4.1. \nPersonnel forms, telephone message forms, \nsafety reports \n \n5. Workplace interactions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, instruction \nand forms, non-verbal including gestures, signals, \nsigns and diagrams \n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n5\n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard format  \nof the organization \n1.2. Accessed information using communication equipment \n1.3. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4. Conveyed information effectively adopting the formal or \ninformal communication \n2. Resource \nImplications \n2.1. Fax machine \n2.2. Telephone \n2.3. Writing materials \n2.4. Internet \n3. Methods of \nAssessment \n3.1. Direct Observation \n3.2. Oral interview and written test \n4. Context for \nAs