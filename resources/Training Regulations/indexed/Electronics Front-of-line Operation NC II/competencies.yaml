          "source_text": "REQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n1. Gather tools \nand materials \nfor electronics \nFOL process \n \n1.1. Process requirements \nare determined according \nto production \nspecifications \n1.2. Appropriate hand tools, \nPPE and materials are \nselected and completed \naccording to process \nrequirements and \nrequired time  \n1.3. Quantity and quality of \nmaterials are checked in \naccordance to \nproduction \nspecifications \n1.4. Completeness and \naccuracy of documents \nare checked in \naccordance to production \nspecifications \n \n Awareness of electronics \nproduction line systems and \nprocesses \n Familiarity with electronics \nFOL materials  \n Understanding bill of \nmaterials, travelers, check \nlist and other applicable \nelectronics FOL documents/ \nspecifications. \n Awareness of safe handling \nof tools and materials i.e. \n5S, Material Safety Data \nSheet (MSDS), Personal \nProtective Equipment \n(PPE), Electro Static \nDischarge (ESD), \nEnvironmental Health \nSystems (EHS), \nOccupational Health and \nSafety (OHS). Cleanroom \nrequirements and \ncontamination control  \n Understanding of  IPC \nstandards \n Awareness of international \nquality standards \no Quality Management \nSystem \no Environmental \nManagement System \n \n Familiarity with visual \ncriteria \n Familiarity with electronics \nFOL tools \n Time consciousness on set \nup time \n Reading skills \n Basic \nmathematical \nskills \n Communication \nskills \n Computer skills \n Detecting \nabnormality or \nnon-conformance\n Writing skills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n29\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n1 Set-up \nelectronics \nFOL machine \nparameters \nand \nperipherals  \n \n \n2.1 Walk-around check or \nvisual inspection of FOL \nmachine is done prior to \nproduction operations \n2.2 Electronics FOL machine \nparameters are set \ncorrectly according to \nproduction specifications \n2.3 Electronics FOL machine \nparameters and \nperipherals are checked \naccording to production \nspecifications \n2.4 Any non-conformance to \nspecifications are \nreported to appropriate \npersonnel \n \n Electronics FOL machine \nset up parameters  \n Awareness of safety \noperation of FOL machines \n Reading of different gauges \n Awareness of set up criteria \n Awareness of applicable \nOut of Control Action Plan \n(OCAP) \n Skills in basic \nmachine \noperation and \nset-up \n Detecting \nabnormality or \nnon-conformance\n Communication \nskills \no Written  \no Oral \n2 Accomplish \nelectronics \nfront-of-line \n(FOL) \nproduction line \nchecklist \n \n3.1 All check items are \nperformed according to \nspecifications \n3.2 Electronics production \nline FOL checklist are \ncorrectly filled-out \naccording to \nspecifications \n3.3 Electronics production \nline FOL checklist is \ncompleted based on \nrequired time \n3.4 Work turnover procedure \nis performed for next \nwork shift \n Completeness and accuracy \nof information on production \nline checklist \n Work values and ethics \no Attentiveness  \no Time consciousness \no Cost-consciousness \no Quality-consciousness  \n Filling up \nappropriate \ninformation on \nchecklist/ lot \ntravelers \n \n3 Perform daily \nmaintenance \nactivity \n \n4.1 Electronics FOL machine \nbasic physical \ncondition are checked \naccording to \nspecifications \n4.2 If necessary, daily \nmaintenance activity is \nperformed based on \nrequired time \n4.3 Any non-conformance to \nspecifications are \nreported to appropriate \npersonnel \n4.4 Housekeeping \nprocedures are observed \nin accordance with 5S \ndiscipline and established \nprocedures \n Workplace organization \n(layout/arrangement of \nworkplace) \n Understanding the \napplicable PM checklist \n Time consciousness \n Awareness on applicable \nout of control action plan \n(OCAP)  \n 5S principles \n \n Checking of \nmachine basic \nphysical \nconditions  \n Detecting \nabnormality or \nnon-conformance\n Writing skills \n Skills in \nhousekeeping\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n30\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nMaterials \nMaterials may include: \n1.1 PCB \n1.2 Insulated Wires  \n1.3 Chip components \n1.4 Discrete components \n1.5 Through Hole components \n1.6 Solder paste \n1.7 Solder wire \n1.8 Epoxy/ glue \n1.9 Lead frame \n1.10 Cables \n1.11 Switches \n1.12 Relays \n \n2. \nProduction \nspecifications \nMay include production specifications from: \n2.1 Machine specifications \n2.2 Set-up checklist \n2.3 Work Instructions (WI) \n2.4 Production procedures \n2.5 Out of Control Action Plan (OCAP) procedures \n2.6 Control Plan procedures \n2.7 Statistical Process Control (SPC) procedures \n2.8 Work Manual \n2.9 Production Process and Flow Diagrams \n3. \nHand tools \nHand tools may include: \n3.1 Tweezers \n3.2 Vacuum Pen \n3.3 Allen Keys  \n3.4 Calculator \n3.5 Torque driver \n3.6 Wafer handling tools \n3.7 Jigs and fixtures \n4. \nPPE \nPersonal protective equipment may include: \n4.1 ESD apparel \n4.1.1 Shoes \n4.1.2 Smock and Head cap \n4.1.3 ESD Jacket \n4.1.4 Bunny suit \n4.1.5 Face mask \n4.1.6 Wrist/Foot ground strap \n4.1.7 Gloves/ Finger cots \n4.2 Safety shoes \n4.3 Gloves \n4.4 Safety goggles \n4.5\nEar plugs\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n31\nVARIABLE \nRANGE \n5. \nProcesses  \n \nElectronics front-of-line (FOL) processes may include but \nnot be limited to: \n5.1 Solder application  \n5.2 Component placement \n5.2.1 Automatic \n5.2.2 manual \n5.3 Solder reflow \n5.4 Glue application \n5.5 Inspection  \n5.5.1 Automatic \n5.5.2 Manual \n6. \nRequired time \nRequired time may include: \n6.1 Set up/ Change over  time \n6.2 Production cycle time \n6.3 Process cycle time \n6.4 Machine Uptime \n6.5 Curing time \n7. \nDocuments \nDocument may include: \n7.1 Production form \n7.1.1 Lot summary \n \n         PM checklist \n7.1.2 Monitoring checklist \n7.1.3 SPC checklist \n7.2 Material / Lot traveler \n7.3 Work Instruction (WI) \n7.4\nSet up sheet\n8. \nMachine parameters \nMachine parameters may include: \n8.1 Machine type \n8.2 Machine model \n8.3 Machine settings \n8.4 Material/ Product type \n8.5\nMaterial/ Product model \n9. \nPeripherals \nPeripherals may include: \n9.1 Jigs \n9.2\nFixtures\n10. Appropriate personnel Appropriate personnel may include: \n10.1 Immediate supervisor \n10.2 Maintenance personnel \n10.3 Engineer \n10.4 Quality Control personnel\n11. Machine basic \nphysical conditions \nMachine basic physical condition check may include: \n11.1 Complete screws \n11.2 Fan is working  \n11.3 No oil leakage  \n11.4 No broken wire \n11.5 Free from foreign materials \n11.6 Industrial PC in good condition \n11.7 Dust free \n11.8 Appropriate peripherals\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-ELECTRONIC FRONT-OF-LINE OPERATIONS NC II (NEW)       Promulgated Dec. 16, 2015 \n32"
        },
        "evidence_guide": {
          "source_text": "1.  Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Gathered production tools and materials for electronics front-\nof-line operations according to approved production \nspecifications \n1.2 Checked and set up electronics front-of-line machine \nparameters and peripherals for production startup and usage \n1.3 Accomplished electronics front-of-line production quality \nchecklist according to quality manuals and procedures \n1.4 Checked machine’s basic physical condition in accordance to \nproduction line standards and performed daily maintenance \nactivity based on required time \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1 Appropriate Electronics  FOL machine and equipment \n2.2 Tools (as indicated in the Range Of Variables) \n2.3 Materials  \n2.4 Work Instructions Assessment rating sheet \n2.5 Sample production checklist \n2.6 Applicable forms for specific equipment or machines \n2.7 Procedure and quality manuals \n2.8 Personal Computer \n2.9 Printer \n2.10 Reporting forms \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Direct Observation with oral questioning \n3.3 Exams and Tests \n \n \n4.  Context for \nAssessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting",
