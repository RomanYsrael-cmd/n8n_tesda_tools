      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of either Electronics Front-of-Line (FOL) Operations NC II, the candidate must demonstrate in all the units listed in Section"
