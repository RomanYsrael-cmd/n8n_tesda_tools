  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in ANIMATION NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace information\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information\nand ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and\nconcisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting\npurpose and established protocols\n2.4\nWorkplace interactions are conducted in a\ncourteous manner\n2.5\nQuestions about simple routine workplace procedures\nand matters concerning working conditions of\nemployment are asked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment\nare completed accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents\nare identified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n4\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format\nof the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n\n2. Underpinning\nKnowledge\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the individual’s\nwork responsibilities\n\n3. Underpinning\nSkills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple written\nnotices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7. Ability to relate to people of social range in the workplace\n3.8. Gather and provide information in response to workplace\nRequirements\n\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written test\n\n6. Context for\nAssessment\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 7 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n5\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n\n2. Identify own role and\nresponsibility within\nteam\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with enterprise\nor specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n7\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning\nSkills\n3.1.\nCommunicate appropriately, consistent with the culture of\nthe workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the\nwork activities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1. Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2. Intra- and interpersonal relationships are maintained\nin the course of managing oneself based on\nperformance evaluation\n1.3. Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n\n2. Set and meet work\npriorities\n2.1. Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2. Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3. Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n\n3. Maintain professional\ngrowth and\ndevelopment\n3.1. Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n10\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n\n3. Underpinning\nSkills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n11\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE : 500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to comply with regulatory and organizational\nrequirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are clarified\nand explained based on organization procedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with\nestablished organization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 14 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination,\npressure, noise, vibration, temperature,\nradiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists,\nfumes, smoke, gasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/\nexcessive force, awkward/static\npositions, fatigue, direct pressure,\nvarying metabolic cycles\n2.4.2 Physiological factors – monotony,\npersonal relationship, work out cycle\n\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n\n4. Personal Protective\nEquipment\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 15 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n13\n\nVARIABLE\nRANGE\n\n5. Emergency-related drills\nand training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 16 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n14\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n\n2. Underpinning\nKnowledge\n\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.2 Workplace or assessment location\n4.3 OHS personal records\n4.3 PPE\n4.4 Health records\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 17 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n15\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\n506315202\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, attitudes and values\nneeded to apply quality standards in the workplace. The unit\nalso includes the application of relevant safety procedures and\nregulations, organization procedures and customer\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials\n1.1. Work instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2. Received materials are checked against workplace\nstandards and specifications.\n1.3. Faulty materials related to work are identified and\nisolated.\n1.4. Faults and any identified causes are recorded and/or\nreported to the supervisor concerned in accordance\nwith workplace procedures.\n1.5. Faulty materials are replaced in accordance with\nworkplace procedures.\n2. Assess own work\n2.1. Documentation relative to quality within the company\nis identified and used.\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken.\n2.3. Errors are identified and isolated.\n2.4. Information on the quality and other indicators of\nproduction performance are recorded in accordance\nwith workplace procedures.\n2.5. In cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ s standards operating\nprocedures.\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated in\nrelative to workplace assignment.\n3.2. Work is carried out in accordance with process\nimprovement procedures.\n3.3. Performance of operation or quality of product of\nservice to ensure customer satisfaction is monitored.\n\n--- PDF PAGE 18 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Materials\n1.1 Materials may include but not limited to:\n1.1.1. Manuals\n1.1.2. Job orders\n1.1.3. Instructional videos\n2 Faults\n2.1 Faults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated\ninformation\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any\nregulatory agencies\n3 Documentation\n3.1 Organization work procedures\n3.2 Manufacturer’s instruction manual\n3.3 Customer requirements\n3.4 Forms\n4 Errors\n4.1 Errors may be related but not limited to the following:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the\norganization\n5 Quality standards\n\n5.1 Quality standards may be related but not limited to\nthe following:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1 Co-worker\n6.2 Supplier/Vendor\n6.3 Client\n6.4 Organization receiving the product or service\n\n--- PDF PAGE 19 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n17\n\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s\nstandard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with\nstandard operating procedures\n1.4 Carried out work in accordance with the process\nimprovement procedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and\nproducts\n2.2 Characteristics of materials, software and hardware\nused in production processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production\nprocesses\n2.6 Fault identification and reporting\n2.7 Quality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply\ndefined work procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5 Solution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to objectively\nevaluate the candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4 Practical demonstration\n5 Resource implication\n5.1\nMaterials, software and hardware to be used in a\nreal or simulated situation\n6 Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 20 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n18\n\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:\nICT 311203\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using\nand working with files, folders and programs, saving work,\nand closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1 The peripheral devices are properly connected\n1.2 Power is checked and the computer and peripheral\ndevices are switched on\n1.3 Proper logging in and logging off is successfully done\n1.4 The operating system features and functions are\naccessed and navigated\n1.5 Hardware configuration and other system features are\nchecked\n2. Arrange and\ncustomize\ndesktop display/\nGUI settings\n\n2.1 The desktop screen or GUI elements are changed as\nneeded\n2.2 Desktop icons are added, renamed, moved, copied or\ndeleted\n2.3 The online help functions are accessed or used as\nneeded\n2.4 Desktop icons of application programs are selected,\nopened and closed\n2.5 Properties of icons are displayed\n2.6 Computer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1 A file or folder is created, opened, moved, renamed or\ncopied\n3.2 Files are located, deleted and restored\n3.3 Details and properties of files and folders are displayed or\nviewed\n3.4 Various files are organized for easy lookup and use\n3.5 Files and information are searched\n3.6 Disks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1 Application programs are added, changed, removed or\nran\n4.2 User software or application program are installed,\nupdated and upgraded\n4.3 Information/data are moved between documents or files\n5. Print information\n5.1 Printer is added or installed and correct printer settings\nis ensured\n5.2 Default printer is assigned accordingly\n5.3 Information or document is printed on the installed printer\n5.4 Progress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1 All open application programs are closed\n6.2 Computer and peripheral devices are properly shut down\n\n--- PDF PAGE 21 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n19\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nPeripheral\ndevice\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n\n2.\nComputer\nMay include:\n2.1. Laptops/notebooks\n2.2. Workstations\n2.3. Servers\n2.4. other personal computer devices\n\n3.\nApplication\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n\n4.\nOperating\nsystem\nMay include but is not limited to the various versions and\nvariants of operating systems running on personal\ncomputers and servers, such as:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n\n5.\nSystem features May include but is not limited to the operating system\nfeatures and hardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n\n6.\nOnline help\nfunctions\n6.1 An instruction manual, or a portion of the manual,\nintegrated and accessible from within the program or\nsoftware being used.\n\n--- PDF PAGE 22 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n20\n\nVARIABLE\nRANGE\n7.\nProperties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n\n8.\nVarious files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n\n9.\nDisks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation.\n\n--- PDF PAGE 23 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n21\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\n\nAssessment must confirm the candidate's ability to:\n1.1 utilize software\n1.2 navigate the desktop\n1.3 use system features to perform tasks\n1.4 save results of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware\ncomponents\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders\nor disk storage\n3.2 Mouse and keyboarding skills for running software\napplications\n3.3 Reading and writing at a level where basic workplace\ndocuments are understood\n3.4 Clear ability to communicate with peers and\nsupervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions\nusing a personal computer whether standalone or in\na networked environment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the\nfollowing resources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in\na simulated work environment.\n\n--- PDF PAGE 24 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n22\nCORE COMPETENCIES\n\nUNIT TITLE\n:\nPRODUCE CLEANED-UP & IN-BETWEENED DRAWINGS\nUNIT CODE\n: ICT 313313\nUNIT DESRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\nrefine key drawings and to produce in-between drawings to\nensure that the creative brief is fully met for productions.\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify requirements\nfor cleaned -up\ndrawings\n1.1 All relevant clean up requirements are\nidentified from the appropriate source\nmaterial\n1.2 All relevant model sheets are collected for\nready reference.\n1.3 All key drawings are checked and any\nproblems or errors encountered are referred\nto appropriate personnel.\n1.4 All animation breakdowns are checked\nagainst the camera sheet, and any problems\nor errors are referred to relevant personnel.\n1.5 All necessary materials and equipment are\nidentified and prepared according to the task\nundertaken\n2. Produce cleaned-up\ndrawings\n2.1\nCleaned-up drawings produced are consistent\nwith requirements of source materials and\nwithin the constraints of the production.\n2.2\nCleaned-up drawings are matched and\nmodeled to animators’ keys.\n2.3\nAgreed design/model in the cleaned-up\ndrawings are precisely reflected in the\ndrawings and that they are within the agreed\nstandards\n2.4\n All animation breakdowns are accurately\ncopied and numbered onto cleaned-up\ndrawings.\n2.5\nAny revision or corrections required are\nreferred to relevant personnel.\n2.6\nCleaned-up drawings are properly recorded\nand stored in accordance with company\nprocedures and policies.\n\n--- PDF PAGE 25 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n23\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Identify requirements\nfor in-betweened\ndrawings\n3.1\nAll relevant requirements are identified.\n3.2\nAll cleaned-up key drawings are checked, and\nany problems or errors encountered are\nreferred to the appropriate personnel\n3.3\nAll animation breakdowns are checked against\nthe camera sheet, and any problems or errors\nencountered are referred to the appropriate\npersonnel\n4. Produce in-betweened\ndrawings\n4.1\nIn-betweened drawings produced are within\nthe constraints of the production\n4.2\nProduced in-betweened drawings precisely\nreflected the information contained in the\nanimation breakdowns, agreed design and\nstandards\n4.3\nCleaned-up key drawings is carefully and\naccurately interpreted in the in-betweened\ndrawings\n4.4\nCleaned-up drawings produced complied with\nthe soundtrack breakdown supplied\n4.5\nAny corrections to in-betweened drawings\nare clarified with the relevant personnel\n\n--- PDF PAGE 26 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Source material\nMay include:\n1.1\nStoryboard\n1.2\nLay-out drawings\n1.3\nDirector’s instructions\n1.4\nModel sheets\n1.5\nExposure sheets\n1.6\nSoundtrack breakdown\n1.7\nKey animation drawings\n\n2. Appropriate personnel\n2.1\nProduction designer\n2.2\nProduction manager\n2.3\nHead of clean-up department\n2.4\nAnimation Director\n2.5\nTechnical director\n\n3. Animation breakdown\n3.1\nnumber of in-betweens required\n3.2\npath of action ad pace\n\n--- PDF PAGE 27 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n25\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment must show that the candidate:\n1.1 Produced cleaned-up drawings accurately\n1.2 Produced in-betweened drawings clearly\n1.3 Produced cleaned-up and in-betweened\ndrawings within the constraints of the\nproduction\n\n2. Underpinning Knowledge\n2.1 Interpreting scripts, specifications and\ninstructions\n2.2 Principles and techniques of animation\n2.3 Current animation methods and techniques\n2.4 Animation process as related to producing\ncleaned-up and in-betweened drawings\n2.5 Maintaining design integrity\n2.6 Life drawing and translation to animated\ncharacters\n2.7 Color theory, line, dimension, depth and\ntheir application on the screen\n2.8 Understanding of how animated characters\nspeak and importance of mouth chart\n\n3. Underpinning Skills\n3.1 Character drawing\n3.2 Cartoon drawing\n3.3 Drawing construction skills for character\nanimation, objects and animals\n3.4 Animation/drawing techniques\n3.4.1 dynamic animation poses\n3.4.2 line of action\n3.4.3 balance and weight in drawing\n3.4.4 line art\n3.4.5 drawing animation expressions\n\n4. Method of Assessment\n4.1 Direct Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n\n5. Resource Implication\n5.1 Appropriate supplies and materials\n5.2 Applicable equipment\n\n6. Context of Assessment\n6.1 Assessment may be conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 28 ---\n____________________________________________________________________________________________\nTR - ANIMATION NC II Promulgated - July 20, 2007\n/ secjr\n26"
}
