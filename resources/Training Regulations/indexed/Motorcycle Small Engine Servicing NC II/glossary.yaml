  "source_text": ":\n\n1. Motorcycle\nA two or three wheeled vehicle powered by a\ngasoline fed reciprocating internal combustion\nengine from 50 cm3 engine displacement and\nabove.\n2. Small engine\n\n3. 2-stroke engine\nA stationary engine whose framework does not\nmove when the engine operates. It may drive a\nvariety of immobile equipment such as pumps and\ngenerators.\n\nA 2-stroke, or 2-cycle engine is a type of internal\ncombustion engine which completes a power cycle\nwith two strokes (up and down movements) of the\npiston during only one crankshaft revolution.\n4. 4-stroke engine\nA 4-stroke, or 4-cycle engine is a type of internal\ncombustion engine which completes a power cycle\nwith 4 strokes (up and down movements) of the\npiston during only one crankshaft revolution.\n5. Multi-cylinder engines\nIs a reciprocating internal combustion engine with\nmultiple cylinders.\n6. Fuel system\nSystem responsible for the supply of fuel into the\nengine for combustion.\n7. Intake system\nSystem responsible for the supply of air into the\nengine for combustion.\n8. Exhaust system\nSystem responsible for the control and directs\nburned exhaust gases into the atmosphere.\n9. Lubrication system\nSystem responsible for the continuous supply of oil\nduring engine operation not only to prevent wear to\nmoving parts of the engine and transmission but\nalso to cool, remove impurities and to neutralize\nchemically active products of combustion in the\nengine.\n10. Cooling system\n\nSystem\nresponsible\nto\nmaintain\nworking\ntemperature of the engine while in operation to\nprevent overheating and wear of engine parts.\n\n11. Clutch and\nTransmission system\n\nSystem responsible to convert the power produced\nby the engine into the desirable torque needed by\nthe rear wheel.\n\n--- PDF PAGE 160 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n156\n12. Final Drive system\nSystem responsible to transmit power from\ntransmission gears to rear wheel\n\n13. Starting system\n\nElectrical system responsible to turn the crankshaft\nin order to start the engine.\n14. Ignition system\nElectrical system responsible to create a spark at\nthe combustion chamber at the right moment to\nburn the air-fuel mixture inside.\n15. Lighting and signaling\nsystem\nElectrical system responsible to operate the\nlighting\nand\nsignaling\ndevices\nmounted\nor\nintegrated to the front, rear and sides of the\nmotorcycle.\n16. Charging system\nElectrical System responsible to maintain the\ncharge in the motorcycle battery which provides\nthe main source of electrical energy to supply\nlighting and other electrical devices such as horn.\n17. Steering system\nSystem responsible to maneuver or change\ndirection of the movement of the motorcycle.\n18. Suspension system\nSystem responsible to keep the tires in contact\nwith the road surface, to provide steering stability\nwith good handling and to support the whole\nmotorcycle and ensure comfort of the rider and\npassenger.\n19. Brake system\nSystem responsible to slow-down or stop the\nmotorcycle when it is moving.\n20. Basic tools\nCommon tools used to disassemble and assemble\ncommon machine parts.\n21. Special tools\nTools that are specially designed to enable\ndisassembly and assembly of a particular part that\nis not possible with the use of basic tools. These\ntools are recommended to ensure quick service\nand correct maintenance.\n22. Measuring tools\nTools or instruments needed to measure length,\nwidth, height, diameter, depth, gaps, rotational\nspeed, deflection, temperature, pressure, electrical\ncurrent, voltage, resistance, etc.\n23. 5S\nA basic housekeeping activity to create a safe\nworking environment and to realize an atmosphere\nof productivity. The 5S’s stands for the acronym for\nthe Japanese words – Seiri, Seiton, Seisou,\nSeiketsu and Shitsuke.\n\n--- PDF PAGE 161 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n157",
