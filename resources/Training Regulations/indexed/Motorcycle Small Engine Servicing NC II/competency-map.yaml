  "source_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate singed by the\nTESDA Director General.\n4.1.2 Candidates who want to be assessed only in the area of small engine servicing\nshall be awarded a COC with a title of Small Engine Mechanic after undergoing\nand passing assessment for the following core competencies.\n4.1.2.1 Service motorcycle/ small engine system\n4.1.2.2 Service electrical system\n4.1.2.3 Overhall motorcycle/small engine\n\n The assessment for the above core units shall cover only small engines.\n\n4.1.3 Candidates wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n4.1.4 Candidates applying for competency assessment and certification for\nMotorcycle/Small Engine Servicing NC II:\n4.1.4.1\nGraduates of formal education or non-formal training from institutions\n4.1.4.2\nExperienced workers (wage-employed or self-employed)\n4.1.5 Holders of National Certificate (NC) / Certificate of Competency (COC) for the\nabovementioned qualifications are required to undergo re-assessment under\nthe amended Training Regulations (TR) upon expiration of their NC or COC.\n4.1.6 Conduct of assessment and issuance of certificates shall follow the procedures\nmanual and implementing guidelines developed for the purpose.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\n\n--- PDF PAGE 157 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n 153\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is\navailable, where gaps exist, including readiness for assessment.\n\nThis document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo\na quality assured procedure for accreditation before they are authorized by\nTESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 158 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n154\nCOMPETENCY MAP\nMOTORCYCLE/SMALL ENGINE SERVICING NC II\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and\nsafety\nprocedures\nLead in\nworkplace\ncommunication\n\nLead small\nteam\nDevelop and\npractice\nnegotiation\nskills\nSolve\nproblems\nrelated to\nworkplace\nactivities\nUse\nmathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nskills\nDevelop team\nand\nindividual\nApply problem\nsolving\ntechniques in\nthe\nworkplace\nCollect,\nanalyze and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\n\nApply appropriate\nsealant/adhesive\nMove and\nposition vehicle\nPerform\nmensuration and\ncalculation\nRead, interpret\nand apply\nspecifications\nand manuals\nUse and apply\nlubricant/coolant\nPerform shop\nmaintenance\nPrepare job\nestimate/costing\nObserve quality\nsystems\nPerform periodic\nmaintenance\n\nService\nmotorcycle/small\nengine system\nService\nelectrical\nsystem\nService\nchassis\nOverhaul\nmotorcycle/small\nengine\nPerform\nPeriodic\nMaintenance\nService\nCarburetor and\nFuel System\nService\nLubrication\nSystem\nService\nIgnition\nSystem\nService and\nRepair Brake\nSystem\nService\nWheels and\nTires\nService clutch\nsystem\nService final\ndrive\nService &\nrepair exhaust\nsystem\nService & repair\nsuspension\nsystem\nService &\nrepairs cooling\nsystem\n\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 159 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n155\nGLOSSARY OF TERMS:\n\n1. Motorcycle\nA two or three wheeled vehicle powered by a\ngasoline fed reciprocating internal combustion\nengine from 50 cm3 engine displacement and\nabove.\n2. Small engine\n\n3. 2-stroke engine\nA stationary engine whose framework does not\nmove when the engine operates. It may drive a\nvariety of immobile equipment such as pumps and\ngenerators.\n\nA 2-stroke, or 2-cycle engine is a type of internal\ncombustion engine which completes a power cycle\nwith two strokes (up and down movements) of the\npiston during only one crankshaft revolution.\n4. 4-stroke engine\nA 4-stroke, or 4-cycle engine is a type of internal\ncombustion engine which completes a power cycle\nwith 4 strokes (up and down movements) of the\npiston during only one crankshaft revolution.\n5. Multi-cylinder engines\nIs a reciprocating internal combustion engine with\nmultiple cylinders.\n6. Fuel system\nSystem responsible for the supply of fuel into the\nengine for combustion.\n7. Intake system\nSystem responsible for the supply of air into the\nengine for combustion.\n8. Exhaust system\nSystem responsible for the control and directs\nburned exhaust gases into the atmosphere.\n9. Lubrication system\nSystem responsible for the continuous supply of oil\nduring engine operation not only to prevent wear to\nmoving parts of the engine and transmission but\nalso to cool, remove impurities and to neutralize\nchemically active products of combustion in the\nengine.\n10. Cooling system\n\nSystem\nresponsible\nto\nmaintain\nworking\ntemperature of the engine while in operation to\nprevent overheating and wear of engine parts.\n\n11. Clutch and\nTransmission system\n\nSystem responsible to convert the power produced\nby the engine into the desirable torque needed by\nthe rear wheel.\n\n--- PDF PAGE 160 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n156\n12. Final Drive system\nSystem responsible to transmit power from\ntransmission gears to rear wheel\n\n13. Starting system\n\nElectrical system responsible to turn the crankshaft\nin order to start the engine.\n14. Ignition system\nElectrical system responsible to create a spark at\nthe combustion chamber at the right moment to\nburn the air-fuel mixture inside.\n15. Lighting and signaling\nsystem\nElectrical system responsible to operate the\nlighting\nand\nsignaling\ndevices\nmounted\nor\nintegrated to the front, rear and sides of the\nmotorcycle.\n16. Charging system\nElectrical System responsible to maintain the\ncharge in the motorcycle battery which provides\nthe main source of electrical energy to supply\nlighting and other electrical devices such as horn.\n17. Steering system\nSystem responsible to maneuver or change\ndirection of the movement of the motorcycle.\n18. Suspension system\nSystem responsible to keep the tires in contact\nwith the road surface, to provide steering stability\nwith good handling and to support the whole\nmotorcycle and ensure comfort of the rider and\npassenger.\n19. Brake system\nSystem responsible to slow-down or stop the\nmotorcycle when it is moving.\n20. Basic tools\nCommon tools used to disassemble and assemble\ncommon machine parts.\n21. Special tools\nTools that are specially designed to enable\ndisassembly and assembly of a particular part that\nis not possible with the use of basic tools. These\ntools are recommended to ensure quick service\nand correct maintenance.\n22. Measuring tools\nTools or instruments needed to measure length,\nwidth, height, diameter, depth, gaps, rotational\nspeed, deflection, temperature, pressure, electrical\ncurrent, voltage, resistance, etc.\n23. 5S\nA basic housekeeping activity to create a safe\nworking environment and to realize an atmosphere\nof productivity. The 5S’s stands for the acronym for\nthe Japanese words – Seiri, Seiton, Seisou,\nSeiketsu and Shitsuke.\n\n--- PDF PAGE 161 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n157\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who contributed their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nMAGNUS R. MATEO\nSuzuki Philippines, Inc.\nCalamba, Laguna\n\nMARK ANTHONY B. ORTIGOSA\nSuzuki Philippines, Inc.\nCalamba, Laguna\n\nANDREW G. ANGELES\nHonda Philippines, Inc.\nTanauan, Batangas\n\nEDYBOY T. CORTEL\nHonda Philippines, Inc.\nTanauan, Batangas\n\nRIZALDO B. MANARANG\nKymco Philippines, Inc.\nTaguig City\n\nMICHEL T. LACDAO\nKymco Philippines, Inc.\nTaguig City\nSHERVIN C. BAGAOISAN\nYamaha Motor Philippines Inc.\nMalvar, Batangas\n\nMICHAEL JOHN R. LOPEZ\nKawasaki Motors Philippines, Inc.\nAlabang, Muntinlupa City\n\nELVIRA R. LAVADO\nMotorcycle Development Program\nParticipants Association, Inc.\n(MDPPA) - Secretariat\nPasig City\n\nSAMUEL T. MACAPULAY, JR.\nYamaha Motor Philippines Inc.\nMalvar, Batangas\n\nVICENTE B. ALQUIZALAS\nYamaha Motor Philippines Inc.\nLipa, Batangas City\n\n--- PDF PAGE 162 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n158\n\nThe PARTICIPANTS in the National Validation of this Training Regulations\n\n• The Management and Staff of the Motorcycle Development Program Participants\nAssociation, Inc. (MDPPA)\n\n• Jodith N. Cenido\nSuzuki Philippines, Inc\n• Victor A. Nanasca\nSuzuki Philippines, Inc.\n• Mark Alvin C. Sanchez\nSuzuki Philippines, Inc.\n\n• Reynald Justin T. Endaya\n Honda Philippines, Inc.\n• Gabriel A. Rereira Jr.\n Suzuki Philippines, Inc.\n• Robert C. Ulang\nSuzuki Philippines, Inc\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n-\nMa. Isabel G. Gamurot\n-\nHoward Mark N. Plete\n-\nEvangeline A. Cosep\n\n."
