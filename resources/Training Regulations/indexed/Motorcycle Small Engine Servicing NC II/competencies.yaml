        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Serviced steering and suspension system\n1.2 Serviced brake system\n1.3 Serviced final drive system\n1.4 Serviced wheels and tires\n1.5 Cleaned up work area\n2. Resource implications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate tools and equipment\n2.3 Service Manual/Parts Catalogue\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Questioning\n3.2 Written/Oral examination\n4. Context of assessment\n4.2 Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 95 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n91\n UNIT OF COMPETENCY :\nOVERHAUL MOTORCYCLE/SMALL ENGINE\n\nUNIT CODE\n\n:"
