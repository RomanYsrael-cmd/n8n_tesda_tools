        "evidence_guide": {
          "source_text": "1. Critical aspects\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Confirmed and troubleshot electrical system.\n1.2 Disassembled / assembled electrical components.\n1.3 Performed final inspection of electrical system.\n1.4 Cleaned up work area.\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate tools and equipment\n2.3 Materials relevant to the activity\n2.4 Service manual\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Written/Oral examination\n4. Context for\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 84 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n80\nUNIT OF COMPETENCY :\nSERVICE CHASSIS\n\nUNIT CODE\n\n:"
        },
        "source_text": "ALT723373\n\nUNIT DESCRIPTOR\n:\nThis unit covers the ability to diagnose, inspect, adjust and\nservice the electrical system of a motorcycle, specifically,\nthe starting, ignition, lighting, and the charging components.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Confirm and\ntroubleshoot\nelectrical system\n1.1 Electrical system\nmalfunction is\nconfirmed and\ndiagnosed in\naccordance with\nservice manual\n1.2 Electrical System\ndefects are checked\nin accordance with\nService Manual\n1.3 Electrical\ncomponents\ndefects are checked\nin accordance with\nService Manual\n1.4 Basic / Special\nTools and\nequipment are used\nin accordance with\nService Manual\n1.5 Measuring Tools\nand equipment are\nused in accordance\nwith Service Manual\n1.6 Personal\nProtective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n1.7 Work is completed\nwith safety\nconsiderations,\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\nCompany Standard\nOperating\nProcedure.\n\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Procedures\non Service\nManual\n1.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n1.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n1.2.2 Positive work\nvalues\n1.3 TECHNOLOGY\n1.3.1 Basic\ntroubleshooti\nng method\nand\nworkshop\noperation\nprocedure.\n1.3.2 Principle and\noperation of\nelectrical\nsystem\ncomponent\n1.3.3 Use of basic\nand special\ntools\n1.3.4 Use of\nmeasuring\ntools and\nequipment\n\n1.1 Communication\n(written, verbal)\n1.2 Evaluating parts\ncondition\n1.3 Applying standard\nprocedure of\ninspection and\nservicing from\nservice manual\n1.4 Handling of basic\nand special tools\n1.5 Handling of\nmeasuring tools\nand equipment\n1.6 Executing job\norder\n1.7 Diagnosing\nelectrical system\nmalfunction\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n73\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Disassemble/\nAssemble\nElectrical\ncomponents\n\n2.1 Basic/special tools\nand measuring tools\nare used in\naccordance with\nService Manual.\n2.2 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies.\n2.3 Electrical\ncomponents are\ninspected in\naccordance with\nService Manual.\n2.4 Necessary parts for\nreplacement and/or\nrepair are\nrecommended.\n2.5 Defective electrical\ncomponents are\nreplaced and\nassembled in\naccordance with\nService Manual.\n2.6 Work is completed\nwith safety\nconsiderations\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\ncompany Standard\nOperating\nProcedure.\n2.1 ENGLISH/\nCOMMUNICATION\n2.1.1 Procedures\non Service\nManual\n2.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n2.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n2.2.2 Positive work\nvalues\n2.3 TECHNOLOGY\n2.3.1 Use of basic\nand special\ntools\n2.3.2 Use of\nmeasuring\ntools and\nequipment\n2.3.3 Servicing of\nelectrical\nsystems in the\nengine and\nbody\n\n2.1 Applying\ndisassembly,\ninspection and\nassembly\nprocedures from\nservice manual.\n2.2 Evaluating parts\ncondition.\n2.3 Handling of basic/\nspecial tools\n2.4 Handling of\nmeasuring tools\n2.5 Communication\n(written, verbal)\n2.6 Executing job\norder\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n74\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Final inspection\nof electrical\nsystem\n3.1 Torque check for\nbolts and nuts is\nconducted in\naccordance with\nservice manual\n3.2 Electrical\nconnectors,\ncouplers and\nclamps are properly\nfitted in accordance\nto service manual\n3.3 If necessary, Road\ntest is conducted to\nensure correction of\ntrouble\n3.4 Safety riding gear is\nused in accordance\nwith Company\nOccupational\nSafety and Health\n(OSH) policies\n3.5 Tools and\nequipment are used\nin accordance with\nmanufacturer’s\nService Manual\n3.6 PPE are used\naccording to\nOccupational\nSafety and Health\n(OSH) policies\n3.7 Work is completed\nwith safety\nconsiderations and\nwithout causing\ndamage to\nmotorcycle\n\n3.1 ENGLISH/\nCOMMUNICATION\n3.1.1 Procedures\non Service\nManual\n3.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n3.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n3.2.2 Positive work\nvalues\n3.3 TECHNOLOGY\n3.3.1 Handling of\nbasic and\nspecial tools\n3.3.2 Tightening\ntorque\nspecifications\nand thread\ninspection of\nbolts.\n\n3.1 Applying standard\nprocedure of\ninspection from\nservice manual.\n3.2 Handling of basic\nand special tools\n3.3 Executing job\norder\n3.4 Inspecting the\nelectrical\nSystem\n3.5 Communication\n(written, verbal)\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n75\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Clean up work\narea\n4.1 Materials that can\nbe reused are\ncollected and\nstored.\n4.2 Tools and equipment\nare cleaned and\ninspected for\nserviceable condition\nand stored in\naccordance with\nworkplace\nprocedures.\n4.3 Waste and scrap are\nremoved following\nworkplace and\nenvironmental\nprocedures\n4.4 PPE are used\naccording to\nOccupational Safety\nand Health (OSH)\npolicies\n4.5 Work area is\ncleaned in\naccordance with\nworkplace\nprocedures\n4.1 ENGLISH/\nCOMMUNICATION\n4.1.1 Procedures\nfor shop\nmaintenance\n4.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n4.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n4.2.2 DENR\nprocedures on\nwaste\nDisposal\n4.2.3 Proper\ndisposal of\ncontaminated\n/ hazardous