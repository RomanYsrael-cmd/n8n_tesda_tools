        "evidence_guide": {
          "source_text": "1. Critical aspects\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Confirmed and troubleshooted items specified for periodic\nmaintenance\n1.2 Inspected, cleaned and adjusted items specified for periodic\nmaintenance\n1.3 Lubricated with oil or grease items specified for periodic\nmaintenance\n1.4 Replaced items specified for periodic maintenance\n1.5 Performed tightening of bolts and nuts specified in the periodic\nmaintenance.\n1.6 Performed final inspection of items specified for periodic\nmaintenance\n1.7Cleaned up work area.\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate tools and equipment\n2.3Materials relevant to the activity\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2Written/Oral examination\n4. Context for\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n60\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nSERVICE MOTORCYCLE/SMALL ENGINE SYSTEM\n\nUNIT CODE\n\n:"
        },
        "source_text": "ALT723213\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the ability to carry out periodic\n\nmaintenance services in order to keep the motorcycle\n\noperating at peak performance, economy and to assure\n\nsafety and reliability.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Confirm and\ntroubleshoot\nitems scheduled\nfor\nmaintenance\n1.1 Customers\ncomplain/ requests\nare understood and\nsymptoms confirmed\nby testing.\n1.2 Previous\nmaintenance record\nis reviewed and\nchecked, if available.\n1.3 Basic / Special\nTools and\nequipment are used\nin accordance with\nService Manual.\n1.4 Measuring Tools\nand equipment are\nused in accordance\nwith Service Manual.\n1.5 Personal\nProtective\nEquipment (PPE) is\nused with Company\nOccupational Safety\nand Health (OSH)\npolicies.\n1.6 Work is completed\nwith safety\nconsiderations,\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\nCompany Standard\nOperating\nProcedure.\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Use and\ninterpret service\nmanual\n1.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n1.2.1 Occupational\nHealth and\nSafety (OHS)\nrequirements\n1.2.2 Positive work\nvalues\n1.3 TECHNOLOGY\n1.3.1 Basic\ntroubleshooti\nng method\nand\nworkshop\noperation\nprocedure\n1.3.2 Use of Basic\nand Special\ntools\n1.3.3 Use of\nMeasuring\nTools and\nequipment\n\n1.1 Communication\n(written, verbal)\n1.2 Riding Skills.\n1.3 Evaluating parts\ncondition.\n1.4 Applying standard\nprocedure of\ninspection and\nservicing from\nservice manual.\n1.5 Handling of basic\nand special tools.\n1.6 Handling of\nmeasuring tools\nand equipment.\n1.7 Executing job\norder\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n50\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Inspect, clean\nand adjust items\nscheduled for\nMaintenance\n\n2.1 Handling of\nmotorcycles is done\nin accordance with\ncompany Standard\nOperating Procedure.\n2.2 Basic/Special\nTools and\nmeasuring tools\nare used in\naccordance with\nService Manual.\n2.3 Personal\nProtective\nEquipment (PPE)\nis used according\nto job\nrequirements.\n2.4 Periodic\nMaintenance\nItems are\ninspected, cleaned\nand adjusted in\naccordance with\nthe schedule and\nprocedures\nspecified in the\nService Manual.\n2.5 Necessary parts\nfor replacement\nand/or repair are\nrecommended.\n2.6 Work is completed\nwith safety\nconsiderations\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\ncompany Standard\nOperating\nProcedure.\n2.7 Motorcycle\nsystems are\nInspected, cleaned\nand adjustments\nmade in\naccordance with\ncompany Standard\nOperating\nProcedure.\n2.1 ENGLISH/\nCOMMUNICATION\n2.1.1 Use and\ninterpret\nservice\nmanual and\nparts catalog\n2.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n2.2.1 Occupational\nHealth and\nSafety (OHS)\nrequirements\n2.2.2 Positive work\nvalues\n2.3 TECHNOLOGY\n2.3.1 Use and\nhandling of\nBasic and\nSpecial tools\n2.3.2 Use and\nhandling of\nmeasuring\ntools and\nequipment\n2.3.3 Inspection\nand\nServicing of\nPeriodic\nMaintenance\nitems\n2.3.4 Service Data\nand\nspecification\nof the\nmotorcycle\n2.3.5 Periodic\nMaintenance\nSchedule\nChart\n\n2.1 Applying\ndisassembly,\ninspection and\nassembly\nprocedures from\nservice manual\n2.2 Evaluating parts\ncondition\n2.3 Handling of tools\n2.4 Handling of\nmeasuring tools\n2.5 Communication\n(written, verbal)\n2.6 Executing job\norder\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n51\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Lubricate with oil\nor grease items\nscheduled for\nmaintenance\n3.1 Basic/Special\nTools and\nmeasuring tools\nare used in\naccordance with\nService Manual.\n3.2 Personal\nProtective\nEquipment (PPE)\nis used according\nto job\nrequirements.\n3.3 Periodic\nMaintenance Parts\nare lubricated in\naccordance with the\nschedule and\nprocedures specified\nin the Service\nManual.\n3.4 Work is completed\nwith safety\nconsiderations\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\ncompany Standard\nOperating\nProcedure.\n3.1 ENGLISH/\nCOMMUNICATION\n3.1.1 Use and\ninterpret\nservice\nmanual and\nparts catalog\n3.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n3.2.1 Occupational\nHealth and\nSafety (OHS)\nrequirements\n3.2.2 Positive work\nvalues\n3.3 TECHNOLOGY\n3.3.1 Use of Basic\nand Special\ntools\n3.3.2 Use of\nMeasuring\nTools and\nequipment\n3.3.3 Service data\nand\nspecification\nof the\nmotorcycle\n3.3.4 Periodic\nMaintenance\nSchedule\nChart\n3.3.5 Inspection\nand\nServicing of\nPeriodic\nMaintenance\nitems\n\n3.1 Handling tools\nand equipment.\n3.2 Communication\n(written, verbal)\n3.3 Applying standard\nprocedure of\nlubrication from\nservice manual\n3.4 Communication\n(written, verbal)\n3.5 Executing job\norder\n3.4 Evaluating parts\ncondition\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n52\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Replace items\nscheduled for\nmaintenance\n4.1 Basic/Special\nTools and\nmeasuring tools\nare used in\naccordance with\nService Manual.\n4.2 Personal\nProtective\nEquipment (PPE)\nis used according\nto job\nrequirements.\n4.3 Periodic\nMaintenance Parts\nare replaced in\naccordance with\nthe schedule and\nprocedures\nspecified in the\nService Manual.\n4.4 Work is completed\nwith safety\nconsiderations\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\ncompany Standard\nOperating Procedure.\n4.1 ENGLISH/\nCOMMUNICATION\n4.1.1 Use and\ninterpret\nservice\nmanual and\nparts catalog\n4.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n4.2.1 Occupational\nHealth and\nSafety (OHS)\nrequirements\n4.2.2 Positive work\nvalues\n4.3 TECHNOLOGY\n4.3.1 Use of Basic\nand Special\ntools.\n4.3.2 Use of\nMeasuring\nTools and\nequipment\n4.3.3 Service data\nand\nspecification\nof the\nmotorcycle\n4.3.4 Periodic\nMaintenance\nSchedule\nChart\n4.3.5 Inspection\nand\nServicing of\nPeriodic\nMaintenance\nitems\n4.3.6 Recommend\ned service\nlimits for\nPeriodic\nMaintenance\nParts\n4.2 Applying\nprocedures in\ndiagnosing\ndisassembly,\ninspection and\nassembly\nprocedures from\nservice manual\n4.3 Evaluating parts\ncondition\n4.4 Handling of tools\n4.5 Communication\n(written, verbal)\n4.6 Executing job\norder\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n53\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n5. Tighten bolts and\nnuts scheduled\nfor maintenance\n5.1 Basic/Special\nTools and\nmeasuring tools\nare used in\naccordance with\nService Manual.\n5.2 Personal\nProtective\nEquipment (PPE)\nis used according\nto job\nrequirements.\n5.3 Engine/chassis\nbolts and nuts are\ntightened in\naccordance with\nthe schedule and\nprocedures\nspecified in the\nService Manual.\n5.4 Work is completed\nwith safety\nconsiderations\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\ncompany Standard\nOperating\nProcedure.\n5.1 ENGLISH/\nCOMMUNICATION\n5.1.1 Use and\ninterpret\nservice\nmanual\n5.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n5.2.1 Occupational\nHealth and\nSafety (OHS)\nrequirements\n5.2.2 Positive work\nvalues\n5.3 MATH\n5.3.1 Torque chart\nfor periodic\nmaintenance\nparts\n5.4 TECHNOLOGY\n5.4.1 Use of Basic\nand Special\ntools\n5.4.2 Use of\nMeasuring\nTools and\nequipment\n5.4.3 Service data\nand\nspecification\no