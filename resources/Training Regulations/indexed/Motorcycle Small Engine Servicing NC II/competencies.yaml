          "source_text": "1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Materials relevant to the activity\n2.2 Appropriate tools and equipment\n2.3 Real or simulated workplace\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Interview related to:\n3.2.1 Safe and correct use of tools and equipment\n3.2.2 Application of adhesive/sealant\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n23\nUNIT OF COMPETENCY\n:\nMOVE AND POSITION VEHICLE\n\nUNIT CODE\n\n:"
