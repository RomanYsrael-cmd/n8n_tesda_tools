        "source_text": "ALT723374\n\nUNIT DESCRIPTOR\n:\nThis competency covers the ability to diagnose, inspect,\nadjust and service the steering and suspension, brake,\nfinal drive system, wheels and tires and their components.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Service steering\nand suspension\nsystem\n1.1 Steering and\nsuspension system\nmalfunction is\nconfirmed and\ndiagnosed according\nto the symptoms\n1.2 Steering and\nsuspension system\ncomponents are\ndisassembled in\naccordance with\nService Manual\n1.3 Defective parts are\nreplaced and\nassembled in\naccordance with\nService Manual\n1.4 Repaired steering\nand suspension\nsystems/ components\nare inspected\naccording to standard\nspecifications\n1.5 Final test is\nconducted to ensure\nsafe and normal\nsteering and\nsuspension system\noperation\n1.6 Basic/Special/Meas\nuring Tools and\nequipment are used\nin accordance with\nService Manual\n1.7 Personal\nProtective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Procedures\non Service\nManual\n1.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n1.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n1.2.2 Waste\nManagement\nand\nSegregation\n1.3 MATH\n1.3.1 Standard\nvalue of\ntorque,\nclearances,\nlimits\n1.4 SCIENCE\n1.4.1 Principle of\nsteering and\nsuspension\nsystem\n1.5 TECHNOLOGY\n1.5.1 Basic\ntroubleshootin\ng method and\nworkshop\noperation\nprocedure\n1.5.2 Uses of\nBasic and\nSpecial tools\n\n1.1 Diagnosing\nsteering and\nsuspension\nsystem\nmalfunction\n1.2 Riding Skills\n1.3 Applying standard\nprocedure of\ninspection/repair\n1.4 Communication\n(written, verbal)\n1.5 Handling of basic\nand special tools\n1.6 Handling of\nmeasuring tools\nand equipment\n1.7 Executing job\norder\n1.8 Practicing\npersonal safety\nand hygiene\n\n--- PDF PAGE 85 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n81\n\n1.8 Work is completed\nwith safety\nconsiderations,\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\nCompany Standard\nOperating\nProcedure\n1.9 Personal safety and\nhygiene are observed\n\n--- PDF PAGE 86 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n82\n2. Service final drive\nsystem\n2.1 F inal drive system\nmalfunction is\nconfirmed and\ndiagnosed according\nto the symptoms\n2.2 Final drive system\ncomponents are\ndisassembled in\naccordance with\nService Manual\n2.3 Defective parts are\nreplaced and\nassembled in\naccordance with\nService Manual\n2.4 Repaired final drive\nsystems/\ncomponents are\ninspected according\nto standard\nspecifications\n2.5 Fianal test is\nconducted to ensure\nsafe and normal final\ndrive system\noperation\n2.6 Basic/Special/Measu\nring Tools and\nequipment are used\nin accordance with\nService Manual\n2.7 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies.\n2.8 Work is completed\nwith safety\nconsiderations,\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\nCompany Standard\nOperating Procedure\n2.9 Personal safety and\nhygiene are\nobserved\n2.1 ENGLISH/\nCOMMUNICATION\n2.1.1 Procedures\non Service\nManual\n2.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n2.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n2.2.2 Waste\nManagement\nand\nSegregation\n2.3 MATH\n2.3.1 Standard\nvalue of\ntorque, limits\n2.3.2 Lubricating\noil volume\nrequirements\n2.4 SCIENCE\n2.4.1 Principle of\nfinal drive\nsystem\n2.4.2 Oil\nspecifications\n2.5 TECHNOLOGY\n2.5.1 Basic\ntroubleshooti\nng method\nand\nworkshop\noperation\nprocedure\n2.5.2 Types of final\ndrive system\n2.5.3 Uses of\nBasic and\nSpecial tools\n\n2.1 Disassembling\nand assembling\nfinal drive system\ncomponents\n2.2 Applying\nprocedures in\ndiagnosing\ndisassembly,\ninspection and\nassembly\nprocedures from\nservice manual\n2.3 Evaluating parts\ncondition\n2.4 Handling of basic\nand special tools\n2.5 Handling of\nmeasuring tools\n2.6 Communication\n(written, verbal)\n2.7 Executing job\norder\n2.8 Practicing\npersonal safety\nand hygiene\n\n--- PDF PAGE 87 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n83\n3. Service brake\nsystem\n3.1 Brake system\nmalfunction is\nconfirmed and\ndiagnosed according\nto the symptoms\n3.2 Brake system\ncomponents are\ndisassembled in\naccordance with\nService Manual\n3.3 Defective parts are\nreplaced and\nassembled in\naccordance with\nService Manual\n3.4 Repaired brake\nsystem/ components\nare inspected\naccording to standard\nspecifications\n3.5 Final test is\nconducted to ensure\nsafe and normal\nbrake system\noperation\n3.6 Basic/Special/Measu\nring Tools and\nequipment are used\nin accordance with\nService Manual\n3.7 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n3.8 Work is completed\nwith safety\nconsiderations,\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\nCompany Standard\nOperating Procedure\n3.9 Personal safety and\nhygiene are\nobserved\n3.1 ENGLISH/\nCOMMUNICATION\n3.1.1 Procedures\non Service\nManual\n3.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n3.2.1 Occupational\nSafety and\nHealth (OHS)\nrequirements\n3.2.2 Waste\nManagement\nand\nSegregation\n3.3 MATH\n3.3.1 Standard\nvalue of\ntorque,\nclearances,\nlimits\n3.4 SCIENCE\n3.4.1 Principle of\nbrake system\n3.5 TECHNOLOGY\n3.5.1 Basic\ntroubleshootin\ng method and\nworkshop\noperation\nprocedure\n3.5.2 Uses of\nBasic and\nSpecial tools\n\n3.1 Diagnosing\nbrake system\nmalfunction\n3.2 Riding Skills\n3.3 Applying standard\nprocedure of\ninspection/repair\n3.4 Communication\n(written, verbal)\n3.5 Handling of basic\nand special tools\n3.6 Handling of\nmeasuring tools\nand equipment\n3.7 Executing job\norder\n3.8 Practicing\npersonal safety\nand hygiene\n\n--- PDF PAGE 88 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n84\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Service wheels\nand tires\n4.1 Wheels and tires\nmalfunction is\nconfirmed and\ndiagnosed according\nto the symptoms\n4.2 Wheels and tires\ncomponents are\ndisassembled in\naccordance with\nService Manual\n4.3 Defective parts are\nreplaced and\nassembled in\naccordance with\nService Manual\n4.4 Repaired wheels and\ntires components are\ninspected according\nto standard\nspecifications\n4.5 Final test is\nconducted to ensure\nsafe and normal\nwheels and tires\noperation\n4.6 Basic/Special/Measu\nring Tools and\nequipment are used\nin accordance with\nService Manual\n4.7 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n4.8 Work is completed\nwith safety\nconsiderations,\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\nCompany Standard\nOperating Procedure\n4.9 Personal safety and\nhygiene are\nobserved\n4.1 ENGLISH/\nCOMMUNICATION\n3.1.1 Procedures\non Service\nManual\n4.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n4.2.1 Occupational\nSafety and\nHealth (OHS)\nrequirements\n4.2.2 Waste\nManagement\nand\nSegregation\n4.3 MATH\n4.3.1 Standard\nvalue of\ntorque,\nclearances,\nlimits\n4.4 SCIENCE\n4.4.1 Principle of\nwheels and\ntires\n4.5 TECHNOLOGY\n4.5.1 Basic\ntroubleshootin\ng method and\nworkshop\noperation\nprocedure\n4.5.2 Uses of\nBasic and\nSpecial tools\n\n4.1 Diagnosing\nwheels and tires\nmalfunction\n4.2 Riding Skills\n4.3 Applying\nstandard\nprocedure of\ninspection/repair\n4.4 Communication\n(written, verbal)\n4.5 Handling of basic\nand special tools\n4.6 Handling of\nmeasuring tools\nand equipment\n4.7 Executing job\norder\n4.8 Practicing\npersonal safety\nand hygiene\n\n--- PDF PAGE 89 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n85\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Clean up work\narea\n5.1 Materials that can be\nreused are collected\nand stored\n5.2 Tools and\nequipment are\ncleaned and\ninspected for\nserviceable\ncondition and stored\nin accordance with\nworkplace\nprocedures\n5.3 Waste and scrap are\nremoved following\nworkplace and\nenvironmental\nprocedures\n5.4 Work area is\ncleaned in\naccordance with\nworkplace\nprocedures\n5.5 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n5.6 Personal safety and\nhygiene are\nobserved\n5.1 ENGLISH/\nCOMMUNICATION\n5.1.1 Procedures\nfor Shop\nMaintenanc\ne\n5.1.2 Company\npolicies and\nprocedures\n5.1.3 Occupational\nSafety and\nHealth (OSH)\nrequirements\n5.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n5.2.1 Classification\nof waste\nmaterials\n5.2.2 Waste\nSegregation\nand Disposal\n5.2.3 Occupational\nSafety and\nHealth (OSH)\nStandards\nrequirements\n5.2.4 5 S\n5.3 TECHNOLOGY\n5.3.1 Tools and\nequipment\nmaintenance\n5.1 Observing\nenvironmental\nrules and\nregulations\n5.2 Applying service\nshop\nmaintenance\n5.3 Handling of waste\nand scraps\n5.4 Following 5S\n5.5 Practicing\npersonal safety\nand hygiene\n\n--- PDF PAGE 90 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n86\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Steering and\nsuspension\nsystem\nmalfunction\nSteering malfunction may include:\n1.1 Unstable steering\n1.2 Hard steering\n1.3 Loose steering\nSuspension malfunction may include:\n1.4 Too soft front or rear suspension (bottoming)\n1.5 Too stiff front or rear suspension\n1.6 Noisy front or rear suspension.\n1.7 Wobble of front or rear wheel.\n1.8 Oil leak at front or rear suspension.\n2. Steering and\nsuspension\nsystem\ncomponents\nSteering components may include:\n2.1 Handlebar\n2.2 Handlebar holder\n2.3 Steering stem nut and lock nuts\n2.4 Steering stem upper and lower bracket\n2.5 Steering races and balls set\n2.6 Steering damper\nSuspension components may include:\n2.7 Front fork Assembly\n2.8 Spring, front fork\n2.9 Rear shock\n2.10 Swing arm\n2.11 Swing arm bushings\n2.12 Pivot shaft\n2.13 Suspension linkages\n2.14 Damping rod\n2.15 Oil seal, O-ring\n2.16 Suspension bushing\n\n--- PDF PAGE 91 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n87\nVARIABLE\nRANGE\n3. Basic / Special\nTools and\nequipment\nBasic Tools may include:\n3.1 Combination Pliers\n3.2 Long nose pliers\n3.3 Screw drivers\n3.4 Open end wrench\n3.5 Box end wrench\n3.6 Socket set\n3.7 Vise grip\n3.8 Hexagon wrench set\n3.9 Ball peen hammer\n3.10 Plastic / Rubber Mallet\n3.11 Adjustable wrench\n3.12 Chisel\nSpecial Tools may include:\n3.13 Oiler\n3.14 T-handle\n3.15 Impact driver set\n3.16 Snap ring pliers\n3.17 Steering stem wrench\n3.18 Steering race installer\n3.19 Sliding shaft hammer\n3.20 Graduated cylinder\n3.21 Vernier caliper\n3.22 Torque wrench\nEquipment may include:\n3.23 Working table\n3.24 Pans /Parts tray\n3.25 Bench vise\n3.26 Bench grinder\n3.27 Battery charger\n3.28\nPressure washer\n4. Personal\nProtective\nEquipment\nMay include:\n4.1 Safety shoes\n4.2 Cap\n4.3 Gloves\n4.4 Goggles\n4.5 Apron or mechanic suit\n4.6 Safety mask\n5. Company\nStandard\nOperating\nProcedure\nMay include:\n5.1 Parts Requisition slip\n5.2 Job order slip\n5.3 Wearing of Personal protective equipment\n5.4 Service manual\n5.5 Parts catalog\n5.6 Company work procedures\n5.7 Company guidelines\n5.8 Work instructions\n\n--- PDF PAGE 92 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n88\nVARIABLE\nRANGE\n