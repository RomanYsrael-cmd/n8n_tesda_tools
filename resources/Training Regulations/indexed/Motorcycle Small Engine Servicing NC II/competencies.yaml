        "evidence_guide": {
          "source_text": "1. Critical aspects\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Removed engine from the frame\n1.2 Disassembled engine\n1.3 Assembled engine parts and components\n1.4 Re-installed engine to frame\n1.5 Tested engine performance\n1.6 Cleaned up work area\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate tools and equipment\n2.3 Materials relevant to the activity\n2.4 Service manuals\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Questioning\n3.2 Written/Oral examination\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 104 ---\nTR- MOTOCYCLE/SMALL ENGINE SERVICING NC II (Amended) Promulgated December 16, 2015\n\n100"
