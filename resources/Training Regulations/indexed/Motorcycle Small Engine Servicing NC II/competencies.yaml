        "source_text": "ALT723375\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\noverhauling the motorcycle/small engine.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Remove engine\nfrom the unit\n\n1.1 External\ncomponents were\ndetached and engine\nwas removed in\naccordance with\nservice manual.\n1.2 Lubricants/Fluid\ndrained before\ndisconnecting engine\ncomponents\n1.3 Personal Protective\nEquipment (PPE)\nare used according to\nOccupational Safety\nand Health (OSH)\npolicies\n1.4 Tools and\nequipment are used\nin accordance with\nmanufacturer’s\nmanual\n1.5 Work is completed\nwith safety\nconsiderations and\nwithout causing\ndamage to the unit\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Procedures\nfor Shop\nMaintenance\n1.1.2 Company\npolicies and\nprocedures\nUnderstandin\ng procedures\non service\nmanual\n1.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n1.2.1 Classification\nof waste\nmaterials\n1.2.2 Waste\nSegregation\nand Disposal\n1.2.3 Occupational\nSafety and\nHealth (OSH)\nStandards\nrequirements\n1.2.4 5 S\n1.2.5 Occupational\nSafety and\nHealth (OSH)\nrequirements\n1.3 TECHNOLOGY\n1.3.1 Use Tools and\nequipment\n1.3.2 Principles on\noperation of\nengine\n\n1.1 Applying\nprocedures\nspecified in the\nservice manual\n1.2 Handling of\nparts, tools and\nequipment\n1.3 Handling of unit\n1.4 Using PPE\n\n--- PDF PAGE 96 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n92\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Disassemble\nengine\n\n2.1 Engine is\ndisassembled and\nsequenced for\noverhaul in\naccordance with\nservice manual\n2.2 Tools and equipment\nare used in\naccordance with\nservice manual\n2.3 Defective\ncomponents/ parts\nare checked and\nconfirmed in\naccordance with\nstandard\