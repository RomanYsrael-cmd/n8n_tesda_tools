  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency required in\nMOTORCYCLE/SMALL ENGINE SERVICING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE :\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is\naccessed from\nappropriate sources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non-\nverbal communication\nis used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage\nof information are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n1.1 Effective\ncommunication\n1.2 Different modes\nof\ncommunication\n1.3 Written\ncommunication\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n1.1 Follow simple\nspoken language\n1.2 Perform routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participate in\nworkplace\nmeetings and\ndiscussions\n1.4 Complete work\nrelated documents\n1.5 Estimate, calculate\nand record routine\nworkplace\nmeasures\n1.6 Ability to relate to\npeople of social\nrange in the\nworkplace\n1.7 Gather and\nprovide information\nin response to\nworkplace\nrequirements\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are\nclearly expressed and\nthose of others are\nlistened to without\ninterruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Questions about\nsimple routine\nworkplace procedures\nand matters\nconcerning working\nconditions of\nemployment are asked\nand responded to\n2.6 Meetings outcomes\nare interpreted and\nimplemented\n2.1 Effective\ncommunication\n2.2 Different\nmodes of\ncommunication\n2.3 Written\ncommunication\n2.4 Organizational\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n2.1 Follow simple\nspoken language\n2.2 Perform routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participate in\nworkplace\nmeetings and\ndiscussions\n2.4 Complete work\nrelated documents\n2.5 Estimate,\ncalculate and\nrecord routine\nworkplace\nmeasures\n2.6 Ability to relate to\npeople of social\nrange in the\nworkplace\n2.7 Gather and\nprovide\ninformation in\nresponse to\nworkplace\nrequirements\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are\nidentified and properly\nacted upon\n3.5 Reporting\nrequirements to\nsupervisor are\ncompleted according\nto organizational\nguidelines\n\n3.1 Effective\ncommunication\n3.2 Different\nmodes of\ncommunication\n3.3 Written\ncommun