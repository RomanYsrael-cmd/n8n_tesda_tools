        "source_text": "ALT723204\n\nUNIT DESCRIPTOR :\nThis unit identifies the competencies required to select and\napply different types of lubricants\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify types of\nlubricants/ coolant\n1.1 Correct information\non lubrication\nschedule is\naccessed and\ninterpreted from\nappropriate\nmanufacturers\nspecifications\nmanuals\n1.2 Type and quantity of\nlubricants/coolant\nis identified as per\njob requirements\n1.1 SCIENCE\n1.1.1Types/\nClassification\nof lubricants\n1.1.2 Purpose of\nLubrication\n(Problem and\neffects)\n\n1.1 Classifying\nlubricants/coolant\n\n2. Use and apply\nlubricants/ coolant\n1.2 Correct procedure\nfor change of\nlubricant is identified\nfollowing\nmanufacturer’s\nspecification or\nmanual\n1.3 Correct tools and\nequipment are\nselected and used in\nline with job\nrequirements\n1.4 Existing lubricants is\nremoved and\nreplaced with\nspecified types and\nquantity of new\nmaterials in line with\nmanufacturer’s\nspecification\n1.5 Safe procedure and\nuse of PPE is\nobserved when\nremoving or\nreplacing lubricant\n2.1 ENGLISH/\nCOMMUNICATION\n2.1.1 Lubrication\nprocedures\n2.1.2 Identification\nof lubrication\nschedule\n2.2 SCIENCE\n2.2.1Types/\nClassification\nof lubricants\n2.2.2 Purpose of\nlubrication)\n(problem and\neffects)\n2.2.3 Cause and\neffects of gear\noil dilution\n\n2.1 Handling of oils\n(Gear, oil, engine\noil)\n2.2 Classifying\nLubricants/\ncoolant\n2.3 Identifying\nlubricants\nschedule\n2.4 Applying standard\nprocedure of\ninspection repair\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n34\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n1.6 Used lubricants are\ndisposed in\naccordance with\nenvironmental\nguidelines\n1.7 Work is checked in\nline with company\nSOP.\n\n3. Perform\nhousekeeping\nactivities\n\n3.1 Tools, equipment\nand materials are\nproperly stored as\nper company SOP\n3.2 Workplace is free\nfrom waste materials\n3.1 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n3.1.1 Hazards\nassociated\nwith\nlubrication\n3.2 SCIENCE\n3.2.1Types/\nClassification\nof lubricants\n\n3.1 Applying\nhousekeeping\nprocedures\n3.2 Applying 5S\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n35\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Lubricant\nSchedule\nMay include:\n1.1 Kilometers traveled used\n1.2 No. of Hours used\n1.3 Monthly\n1.4 Visual checking\n2. Manuals\nMay include:\n2.1 Manufacturer’s specification manual\n2.2 Periodic Maintenance manual\n2.3 Service Manual\n3. Lubricants/\nCoolant\n\nMay include:\n3.1 Engine oil:\n3.1.1 Diesel engine oil\n3.1.2 Gasoline engine oil\n3.1.3 Front fork oil type\n3.2 Automatic Transmission Fluid\n3.2.1 Destro II\n3.2.2 T4\n3.3 Gear oil lubricants:\n3.3.1 Oil #90\n3.3.2 Oil #140\n3.3.3 Oil #30\n3.3.4 Oil #40\n3.4 Grease\n3.4.1 Special (velocity joint) Molybdenum disolfate)\n3.4.2 Ordinary\n3.4.3 Multi-purpose oil\n3.4.4 Contact point lubricant (grease)\n3.5 Brake/Clutch System\n3.5.1 Brake fluid\n3.5.2 DOT3 / DOT A\n3.6 Power Steering Fluid\n3.6.1 Hydraulic Fluid\n3.7 Radiator Coolant\n3.7.1 Long last coolant\n3.7.2 Type of coolant\n3.8 A/C Compressor Oil Pag oil\n4. Personal\nProtective\nEquipment (PPE)\n\nMay include:\n4.1 Apron\n4.2 Gloves\n4.3 Goggles\n4.4 Safety shoes\n5. Tool and\nequipment\nMay include:\n5.1 Hand tools\n5.2 Oiler\n5.3 Oil Dispenser\n5.4 Grease gun\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n36\nVARIABLE\nRANGE\n5.5 Measuring tools\n5.5.1 Vernier caliper\n5.5.2 Beaker/graduated cylinder\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate tools and equipment\n2.3 Materials relevant to activity\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Written/Oral examination\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n37\nUNIT OF COMPETENCY :\nPERFORM SHOP MAINTENANCE\n\nUNIT CODE\n\n:"
