OTHER\nCONCERNS\n3.2.1 Classification\nof waste\nmaterials\n3.2.2 Waste\nSegregation\nand Disposal\n3.2.3 Occupational\nSafety and\nHealth (OSH)\nrequirements\n3.2.4 5 S\n3.3 MATH\n3.3.1 Standard\nvalue of\ntorque,\nclearances\nand service\nlimits\n3.4 TECHNOLOGY\n3.4.1 Use of Tools\nand\nequipment\n3.4.2 Principles on\noperation of\nengine\n3.4.3 Procedures on\nassembling\nparts and\ncomponents\n\n3.1 Handling of unit\n3.2 Applying\nmanufacturers\nstandards and\nspecification\nindicated in\nservice manual\n3.3 Handling of\nparts, tools and\nequipment\n3.4 Interpreting of\nService manual\nand parts\ncatalogue\n\n--- PDF PAGE 98 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n94\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Re-install engine to\nframe\n4.1 Engine is re-installed\nto frame in\naccordance with\nService Manual.\n4.2 Engine mounting\nbolts and nuts are\ninstalled and\ntightened in\naccordance to\nrequired torque\nvalue as specified in\nService Manual\n4.3 External\ncomponents are\nreconnected to the\nengine in\naccordance with\nService Manual\n4.4 Tools and\nequipment are used\nin accordance with\nmanufacturer’s\nmanual\n4.5 New lubricants and\ncoolants are filled in\naccordance to\nService Manual\n4.6 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n4.7 Work is completed\nwith safety\nconsiderations and\nwithout causing\ndamage to the unit\n\n4.1 ENGLISH/\nCOMMUNICATION\n4.1.1 Procedures\nfor Shop\nMaintenance\n4.1.2 Company\npolicies and\nprocedures\nUnderstandin\ng procedures\non service\nmanual\n4.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n4.2.1 Classification\nof waste\nmaterials\n4.2.2 Waste\nSegregation\nand Disposal\n4.2.3 Occupational\nSafety and\nHealth (OSH)\nrequirements\n4.2.4 5 S\n4.3 TECHNOLOGY\n4.3.1 Use Tools and\nequipment\n4.3.2 Principles on\noperation of\nengine\n\n1.5 Applying\nprocedures\nspecified in the\nservice manual\n1.6 Handling of parts,\ntools and\nequipment\n1.7 Handling of unit\n4.1 Using PPE\n\n--- PDF PAGE 99 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n95\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Test engine\nperformance\n5.1 Motorcycle/ small\nengine is started/\nwarmed up to normal\noperating\ntemperature\n5.2 Final check is\nperformed and\nnecessary\nadjustments are\nmade in accordance\nwith Service Manual\n5.3 Tools are used in\naccordance with\nmanufacturer’s\nmanual\n5.4 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n5.5 Work is completed\nwith safety\nconsiderations and\nwithout causing\ndamage to the unit\n5.1 ENGLISH/\nCOMMUNICATI\nON\n5.1.1 Procedures\non necessary\nadjustment as\nspecified in\nthe service\nmanual\n5.1.2 Company\npolicies and\nprocedures\nUnderstandin\ng procedures\non service\nmanual\n5.1.3 Pre-delivery\nInspection\n(PDI)\n5.2 ENVIRONMENT\nAL ISSUES\nAND OTHER\nCONCERNS\n5.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n5.2.2 5 S\n5.2.3 Emission\nstandards\nunder Phil.\nClean Air Act\n5.3 TECHNOLOGY\n5.3.1 Use Tools and\nequipment\n5.3.2 Principles on\noperation of\nengine\n\n5.1 Riding Skills\n5.2 Handling of tools\n5.3 Handling of unit\n5.4 Applying standard\nadjustments as\nspecified in the\nservice manual.\n5.5 Applying standard\nprocedures for\nFinal Inspection.\n5.6 Using PPE\n\n--- PDF PAGE 100 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n96\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n6. Clean up work area\n7.1 Materials that can be\nreused are collected\nand stored\n7.2 Tools and\nequipment are\ncleaned and\ninspected in\naccordance with\nworkplace\nprocedures\n7.3 Waste and scrap\nare disposed\nfollowing workplace\nand environmental\nprocedures\n7.4 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n7.5 Work area is\ncleaned in\naccordance with\nworkplace\nprocedures\n6.1 ENGLISH/\nCOMMUNICATION\n6.1.1 Procedures\nfor Shop\nMaintenanc\ne\n6.1.2 Company\npolicies and\nprocedures\n6.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n6.2.1 Classification\nof waste\nmaterials\n6.2.2 Waste\nSegregation\nand Disposal\n6.2.3 Occupational\nSafety and\nHealth (OSH)\nrequirements\n6.2.4 5 S\n6.3 TECHNOLOGY\n6.3.1 Tools and\nequipment\nmaintenance\n\n6.1 Observing\nenvironmental\nrules and\nregulations\n6.2 Applying service\nshop\nmaintenance\n6.3 Handling of waste\nand scraps\n6.4 Following 5S\n6.5 Practicing\npersonal safety\nand hygiene\n\n--- PDF PAGE 101 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n97\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. External\ncomponents\nMay include:\n1.1 Muffler/ exhaust pipe\n1.2 Carburetor\n1.3 Cables (Clutch, Choke, Throttle)\n1.4 Fluid hoses\n1.5 Air Cleaner box\n1.6 Starter Motor\n1.7 Engine Sprocket/ drive chain\n1.8 EFI Sensors\n1.9 Ground wires\n1.10 Emission control devices\n1.11 Handle bar\n1.12\nLevers/pedals\n2. Personal\nProtective\nEquipment (PPE)\nMay include:\n2.1 Goggle\n2.2 Gloves\n2.3 Safety Shoes\n2.4 Cap\n2.5 Apron\n2.6 Mask\n3. Tools and\nequipment\nMay include:\n3.1 Pliers\n3.2 Screw drivers\n3.3 Open and close end wrench\n3.4 Socket Wrench\n3.5 Oiler\n3.6 Measuring instruments (Vernier, micrometer, 3-pt.\nMicrometer, tachometer, telescope gauge dial tester indicator,\nplasti- gauge, torque wrench, feeler gauge)\n3.7 Dynamometer\n3.8 Parts Washer\n3.9 Working Table with engine stand.\n4. Manual\nMay include:\n4.1 Service Manual\n4.2 Parts Catalogue\n4.3 DENR Clean Air Act\n\n--- PDF PAGE 102 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n98\nVARIABLE\nRANGE\n5. Engine\ncomponents\nMust include:\n5.1 Cylinder Head\n5.2 Cylinder Block\n5.3 Crank case\n5.4 Piston & Ring Set\n5.5 Cam shafts\n5.6 Clutch Assembly\n5.7 Transmission Assembly\n5.8 Kick Starter Components\n5.9 Starter Motor and gears\n5.10\nCrankshaft assembly and side bearing rotor/magneto\n6. Special and\nMeasuring tools\nMay include:\nSpecial Tools:\n6.1 Magneto Puller\n6.2 Bearing Remover\n6.3 Bearing Installer\n6.4 Crankcase Separating Tool\n6.5 Universal Holder\n6.6 EFI Diagnostic Tool\n6.7 Clutch Lock Nut Wrench\n6.8 Oil Seal Installer\n6.9 Crankshaft Bearing Remover\n6.10 Magneto Holder\n6.11 Connecting rod holder\n6.12 Injector cleaner\n6.13 Hydrometer\n6.14 V. block\n6.15 Press machine\nMeasuring Tools\n6.16 Filler gauge\n6.17 Vernier caliper\n6.18 Micrometer\n6.19 Tachometer\n6.20 Plastic gauge\n6.21 Oil pressure gauge\n6.22 Compression gauge\n6.23\nDial gauge\n7. Motorcycle/small\nengine\nMay include:\nMotorcyle:\n7.1 4 stroke or 2 stroke\n7.2 Single cylinder or multi-cylinder\n7.3 50 cc to 1500 cc (displacement)\nSmall engine:\n7.5 Stationary/Multipurpose engine\n\n--- PDF PAGE 103 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n99\nVARIABLE\nRANGE\n8. Necessary\nadjustments\n\nMay include:\n8.1 Clutch lever play adjustment\n8.2 Carburetor Air Fuel Mixture\n8.3 Engine Idle Speed setting\n8.4 Drive Chain Slack\n8.5 Throttle Cable Free Play Clearance\n8.6 Brake Lever/Pedal Clearance\n8.7 Valve clearance\n9. Waste and Scrap\nMay include:\n9.1 Used oils\n9.2 Used Rugs\n9.3 Defective Engine Components\n9.4 Used hand gloves\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Removed engine from the frame\n1.2 Disassembled engine\n1.3 Assembled engine parts and components\n1.4 Re-installed engine to frame\n1.5 Tested engine performance\n1.6 Cleaned up work area\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate tools and equipment\n2.3 Materials relevant to the activity\n2.4 Service manuals\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Questioning\n3.2 Written/Oral examination\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 104 ---\nTR- MOTOCYCLE/SMALL ENGINE SERVICING NC II (Amended) Promulgated December 16, 2015\n\n100"
