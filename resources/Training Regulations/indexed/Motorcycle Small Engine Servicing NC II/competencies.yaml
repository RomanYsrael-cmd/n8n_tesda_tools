        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Communicated effectively with others involved in or affected\nby the work\n1.2 Identified quality system procedures and needs\n1.3 Identified performance indicators\n1.4 Conducted final quality checks on completed work orders\n1.5 Reported on the quality of processes and work outcomes\n1.6 Monitored and adjusted performance indicators to meet\nchanging circumstances\n1.7 Processed and implemented recommendations for change\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 A workplace or simulated workplace\n2.2 Situations requiring worksite quality systems maintenance\n2.3 Worksite quality policies and procedures\n2.4 Worksite quality documents system\n2.5 Materials, tooling and equipment\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n49\nUNIT OF COMPETENCY :\nPERFORM PERIODIC MAINTENANCE\n\nUNIT CODE\n\n:"
        },
        "source_text": "ALT311212\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the competence to conduct\nthe final quality check on completed work or orders, report\non the quality of processes and work outcomes, and\nimplement improvements to work processes.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Conduct final\nquality check on\ncompleted work /\norders\n\n1.1 Completed work/\norders are checked\nfor compliance with\nsupplier, company or\ncustomer\nspecifications\n1.2 Documentation is\nauthorized in\naccordance with\ncompany\nrequirements\n1.3 Feedback is\nprovided to staff on\nthe quality of their\nwork with equal\nemphasis on\nstrengths and\nweaknesses and\nopportunities for\ndevelopment\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Work\nplanning and\norganization\nprocesses\n1.1.2 Enterprise\nquality\nsystems and\nprocedures\n1.1.3 Quality\nsystems and\napplication\ntechniques in\na work\nenvironment\n1.1.4 Typical loss\nand damage\ncontrol\nsystems\n1.1.5 Worksite\ninformation\nmanagement\nsystems\n1.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n1.2.1 Occupational\nhealth and\nsafety\nregulations/\nrequirements\n\n1.1 Checking\ncompleted work/\norders\n1.2 Preparingdocumen\ntation and\nfeedback report\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n45\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Report on the\nquality of\nprocesses and\nwork outcomes\n\n2.1 Documents are kept\naccording to\ncompany quality\nprocedures on\noutcomes of quality\nchecks\n2.2 Quality problems\nare identified\naccording to\ncompany\nperformance\nindicators\n2.3 Information relating\nto the quality of\nprocesses and work\noutcomes is provided\nto appropriate\npersons on a regular\nbasis\n2.1 ENGLISH/\nCOMMUNICATION\n2.1.1 Work\nplanning and\norganization\nprocesses\n2.1.2 Enterprise\nquality\nsystems and\nprocedures\n2.1.3 Quality\nsystems and\napplication\ntechniques in\na work\nenvironment\n2.1.4 Typical loss\nand damage\ncontrol\nsystems\n2.1.5 Worksite\ninformation\nmanagement\nsystems\n2.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n2.2.1 Occupational\nhealth and\nsafety\nregulations/\nrequirements\n2.1 Communication\n(written, verbal)\n2.2 Storing/ safe\nkeeping of\ndocuments\n2.3 Identifying\nproblems\n2.4 Using\nmathematical\nideas and\ntechniques to\ndocument\nquantities and\ncompany\nsampling\nprocedures\n2.5 Establishing\ndiagnostic\nprocesses which\nanalyze problems\nand recommend\nsolutions\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n46\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Implement\nimprovements to\nwork processes\n3.1 Staff input is\nencouraged to\ngenerate possible\nsolutions to quality\nproblems\n3.2 Options for solving\nquality problems are\ngenerated and the\ncosts and benefits of\neach option are\nevaluated\n3.3 Recommended\nsolutions to quality\nproblems are\ndiscussed with\nmanagement\n3.4 Improvements to\nwork processes are\nimplemented\naccording to\ncompany policies\nand procedures\n\n3.1 ENGLISH/\nCOMMUNICATION\n3.1.1 Work\nplanning and\norganization\nprocesses\n3.1.2 Enterprise\nquality\nsystems and\nprocedures\n3.1.3 Quality\nsystems and\napplication\ntechniques in\na work\nenvironment\n3.1.4 Typical loss\nand damage\ncontrol\nsystems\n3.1.5 Worksite\ninformation\nmanagement\nsystems\n3.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n3.2.1 Occupational\nhealth and\nsafety\nregulations/\nrequirements\n3.1 Communication\n(Written, verbal)\n3.2 Gathering\noptions/ solutions\nfor solving quality\nproblems\n3.3 Applying\nInterpretiveand\nanalytical\ndiagnostis skills\n3.4 Planning and\norganizing\nactivities\n3.5 Using\nmathematical\nideas and\ntechniques\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n47\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Quality\nprocedures\nMay include:\n1.1 Company quality system documentation\n1.2 Work instructions/work productivity\n1.3 Safe work procedures\n1.4 Product specifications\n1.5 Equipment maintenance schedules\n1.6 Technical procedures and adopted or specifically prepared\nstandards\n2. Quality problems\n\nMay include:\n2.1 Misdiagnosed faults\n2.2 Jobs requiring rework\n2.3 Jobs which do not meet customer requirements\n2.4 Repairs which do not fix the problem within the allocated\ntimeframe\n3. Performance\nindicators\n\nMay include:\nAccount for issues of time, quantity, quality and cost factors and\nmay include establishing time targets for own work, identifying\nreasonable criteria for evaluating own work outcomes, identifying\nmeasures to avoid wastage, identifying reasonable criteria to\njudge internal and/or external customer satisfaction\n4. Information/\ndocuments\n\nMay include:\n4.1 Vehicle manufacturer practices\n4.2 Company operating procedures\n4.3 Supplier directories\n4.4 Parts catalogues\n4.5 Customer orders and industry/workplace codes of practice\n4.6 Material safety data sheets (MSDS)\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n48\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Communicated effectively with others involved in or affected\nby the work\n1.2 Identified quality system procedures and needs\n1.3 Identified performance indicators\n1.4 Conducted final quality checks on completed work orders\n1.5 Reported on the quality of processes and work outcomes\n1.6 Monitored and adjusted performance indicators to meet\nchanging circumstances\n1.7 Processed and implemented recommendations for change\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 A workplace or simulated workplace\n2.2 Situations requiring worksite quality systems maintenance\n2.3 Worksite quality policies and procedures\n2.4 Worksite quality documents system\n2.5 Materials, tooling and equipment\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n49\nUNIT OF COMPETENCY :\nPERFORM PERIODIC MAINTENANCE\n\nUNIT CODE\n\n:"
