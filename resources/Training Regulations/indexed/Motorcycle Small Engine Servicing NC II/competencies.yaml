          "source_text": "1. Critical aspects\nCompetency\nAssessment requires evidence that the candidate:\n1.8 Serviced fuel system\n1.9 Serviced intake and exhaust system\n1.10 Serviced lubrication system\n1.11 Serviced cooling system\n1.12 Serviced transmission and clutch system\n1.13 Cleaned up work area.\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate tools and equipment\n2.3 Materials relevant to the activity\n2.4 Service manual\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Written/Oral examination\n4. Context for\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n72\nUNIT OF COMPETENCY :\nSERVICE ELECTRICAL SYSTEM\n\nUNIT CODE\n\n:"
