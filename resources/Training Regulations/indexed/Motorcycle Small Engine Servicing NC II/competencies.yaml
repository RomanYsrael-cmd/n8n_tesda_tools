        "source_text": "ALT723372\n\nUNIT DESCRIPTOR\n:\nThis competency covers the knowledge, skills and ability to\ninspect, diagnose, adjust and service the fuel, intake and\nexhaust, lubrication, cooling, transmission and clutch system\nand its components where applicable to motorcycle/small\nengine units.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Service fuel system\n1.1 Fuel system\nmalfunction is\nconfirmed and\ndiagnosed according\nto the symptoms\n1.2 Fuel system\ncomponents are\ndisassembled in\naccordance with\nService Manual\n1.3 Defective parts are\nreplaced and\nassembled in\naccordance with\nService Manual\n1.4 Repaired fuel\nsystems/ components\nare inspected\naccording to standard\nspecifications\n1.5 Final test is\nconducted to ensure\nsafe and normal fuel\nsystem operation\n1.6 Basic/Special/Meas\nuring Tools and\nequipment are used\nin accordance with\nService Manual\n1.7 Personal\nProtective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies\n\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Procedures\non Service\nManual\n1.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n1.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n1.2.2 Exhaust\nEmission\nstandard\n1.2.3 Types of\nGasoline\n1.2.4 Waste\nManagement\nand\nSegregation\n1.3 MATH\n1.3.1 Standard value\nof torque,\nclearances,\nlimits\n1.3.2 Volume/\npressure\n1.3.3 Engine Idling\nRevolution\nPer Minute\n(RPM)\n\n1.1 Diagnosing fuel\nsystem\nmalfunction\n1.2 Riding skills\n1.3 Applying\nstandard\nprocedure of\ninspection\n1.4 Communication\n(written, verbal)\n1.5 Handling of\nbasic and\nspecial tools\n1.6 Handling of\nmeasuring tools\nand equipment\n1.7 Executing job\norder\n1.8 Practicing\npersonal safety\nand hygiene\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n61\nELEMENT\nPERFORMA