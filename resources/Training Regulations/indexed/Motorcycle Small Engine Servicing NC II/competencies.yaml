ical system\nmalfunction\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n73\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Disassemble/\nAssemble\nElectrical\ncomponents\n\n2.1 Basic/special tools\nand measuring tools\nare used in\naccordance with\nService Manual.\n2.2 Personal Protective\nEquipment (PPE)\nare used according\nto Occupational\nSafety and Health\n(OSH) policies.\n2.3 Electrical\ncomponents are\ninspected in\naccordance with\nService Manual.\n2.4 Necessary parts for\nreplacement and/or\nrepair are\nrecommended.\n2.5 Defective electrical\ncomponents are\nreplaced and\nassembled in\naccordance with\nService Manual.\n2.6 Work is completed\nwith safety\nconsiderations\nwithout causing\ndamage to\nmotorcycle and in\naccordance with\ncompany Standard\nOperating\nProcedure.\n2.1 ENGLISH/\nCOMMUNICATION\n2.1.1 Procedures\non Service\nManual\n2.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n2.2.1 Occupational\nSafety and\nHealth (OSH)\nrequirements\n2.2.2 Positive work\nvalues\n2.3 TECHNOLOGY\n2.3.1 Use of basic\nand special\ntools\n2.3.2 Use of\nmeasuring\ntools and\nequipment\n2.3.3 Servicing of\nelectrical\nsystems in the\nengine and\nbody\n\n2.1 Applying\ndisassembly,\ninspection and\nassembly\nprocedures from\nservice manual.\n2.2 Evaluating parts\ncondition.\n2.3 Handling of basic/\nspecial tools\n2.4 Handling of\nmeasuring tools\n2.5 Communication\n(written, verbal)\n2.6 Executing job\norder\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n74\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Final inspection\nof electrical\nsystem\n3.1 Torque check for\nbolts and nuts is\nconducted in\naccordance with\nservice manual\n3.2