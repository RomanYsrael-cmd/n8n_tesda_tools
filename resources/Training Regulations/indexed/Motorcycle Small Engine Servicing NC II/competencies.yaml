        "source_text": "ALT723205\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage of tools/\nequipment and disposal of used materials are also\nincorporated in this competency\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Inspect/clean\ntools and work\narea\n1.1 Cleaning solvent\nused as per\nworkshop/tools\ncleaning\nrequirement\n1.2 Work area is\nchecked and\ncleaned\n1.3 Wet surface/spot in\nwork area is wiped\nand dried\n\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Service\nProcedures\n1.1.2 Relevant\ntechnical\ninformation\n1.1.3 Workshop\npolicies\n1.1.4 Personal\nsafety\nprocedures\n1.1.5 Vehicle safety\nrequirements\n1.2 ENVIRONMENTAL\nISSUES AND\nOTHER CONCERNS\n1.2.1 5S or TQM\n1.2.2 Positive work\nvalues\n1.3 TECHNOLOGY\n1.3.1 Safe handling\nof Equipment\nand tools\n1.1 Handling/Storin\ng of tools/\nequipment/\nsupplies and\nmaterial\n1.2 Disposing of\nwastes and\nfluid\n1.3 Preparing\ninventory of\ns/m and tools\nand equipment\n1.4 Monitoring of\ns/m and tools/\nequipment\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n38\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Store/arrange\ntools and shop\nequipment\n2.1 Tools/equipment are\nstored in their\nrespective\nshelves/location\n2.2 Corresponding\nlabels are posted\nand visible\n2.3 Tools are safely\nsecured and logged\nin the records\n2.1 ENGLISH/\nCOMMUNICATION\n2.1.1 Personal\nsafety\nprocedures on\nService\nManual\n2.2 ENVIRONMENTAL\nISSUES AND\nOTHER CONCERNS\n2.2.1 Positive work\nvalues\n2.3 SCIENCE\n2.3.1 Fire\nextinguishers\nand fire\nprevention\n2.4 TECHNOLOGY\n2.4.1 Safe handling\nof Equipment\nand tools\n2.1 Handling/storin\ng of tools/\nequipment/\nsupplies and\nmaterial\n2.2 Preparing\ninventory of\ns/m and tools\nand equipment\n2.3 Monitoring of\ns/m and tools/\nequipment\n3. Dispose\nwastes/used\nlubricants\n3.1 Containers for used\nlubricants are visibly\nlabeled\n3.2 Wastes/used\nlubricants are\ndisposed as per\nworkshop SOP\n3.1 ENGLISH/\nCOMMUNICATION\n3.1.1 Relevant\ntechnical\ninformation\n3.1.2 Workshop\npolicies\n3.1.3 Personal\nsafety\nprocedures\n3.2 ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\n3.2.1 5S or TQM\n3.2.2 Storage/\ndisposal of\nhazardous/\nflammable\nmaterials\n3.2.3 Positive work\nvalues\n3.1 Disposing of\nwastes/ used\nlubricants and\nfluids\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n39\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory\nof tools/equipment is\nmaintained\n4.2 Damaged\ntools/equipment/facil\nities are identified\nand repair\nrecommendation is\ngiven\n4.3 Reports prepared\nhas no\nerror/discrepancy\n4.1 ENGLISH/\nCOMMUNICATION\n4.1.1 Relevant\ntechnical\ninformation\n4.1.2 Workshop\npolicies\n4.1.3 Personal\nsafety\nprocedures\n4.2 ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\n4.1.1 5S or TQM\n4.1.2 Positive work\nvalues\n4.2 SCIENCE\n4.3.1 Fire\nextinguishers\nand fire\nprevention\n4.3 TECHNOLOGY\n4.3.1 Safe handling\nof Equipment\nand tools\n4.1 Handling of\ntools/equipmen\nt\n4.2 Preparing\ninventory of\ns/m and tools\nand equipment\n4.3 Monitoring of\ns/m and tools/\nequipment\n4.4 Preparing\nreports\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning\nrequirement\nMay include:\n1.1 Cleaning solvent\n1.2 Inventory of supplies, tools, equipment, facilities\n1.3 List of mechanics/technicians\n1.4 Rags\n1.5 Broom\n1.6 Map\n1.7 Pail\n1.8 Used oil container\n1.9 Oiler\n1.10\nDust/waste bin\n2. Work Area\nMay include:\nWorkshop areas for servicing/repairing light and/or heavy vehicle\nand/or plant transmissions and/or outdoor power equipment\n2.1 Open workshop/garage and enclosed, ventilated office area\n2.2 Other variables may include workshop with:\n2.2.1 Mess hall\n2.2.2 Wash room\n2.2.3 Comfort room\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n41\n EVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Cleaned workshop tools/facilities\n1.2 Maintained equipment, tools and facilities\n1.3 Disposed wastes and used lubricants/fluid as per required\nprocedure\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate Tools & equipment\n2.3 Materials relevant to the activity\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written/Oral Questioning\n3.2 Demonstration\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n42\nUNIT OF COMPETENCY\n:\nPREPARE JOB ESTIMATE/COSTING\n\nUNIT CODE\n\n:"
