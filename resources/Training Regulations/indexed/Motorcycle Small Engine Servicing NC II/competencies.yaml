uments\n2.2 Calibrating and\nusing measuring\ninstruments\n2.3 Performing\ncalculation by\nAddition,\nSubtraction,\nMultiplication and\nDivision\n2.4 Visualizing\nobjects and\nshapes\n2.5 Interpreting\nformula for\nvolume, area,\nperimeter and\nother geometric\nfigures\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n27\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring\ninstruments must\nkept free from\ncorrosion\n3.2 Measuring\ninstruments not\ndropped to avoid\ndamage\n3.3 Measuring\ninstruments\ncleaned before and\nafter using.\n3.1 ENGLISH/\nCOMMUNICATION\n2.2.1 Safe\nhandling\nprocedures in\nusing\nmeasuring\ninstruments\n3.2 TECHNOLOGY\n3.2.1 Types of\nmeasuring\ninstruments\nand its uses\n\n3.1 Caring and\nHandling\nmeasuring\ninstruments\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n28\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMay include:\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Plastigauge\n1.6 Straight Edge\n1.7 Thickness gauge\n1.8 Torque Gauge\n1.9 Small Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14\nSteel rule\n\n2. Calculation\n\nMay include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2.10 Out of roundness\n2.11 Oil clearance\n2.12\nEnd play/thrust clearance\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n29\n EVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Measuring instrument appropriate to servicing processes\n2.3 Instructional materials relevant to the propose activity\n\n3. Methods of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Observation with questioning\n3.2 Written or oral examination\n3.3 Interview\n3.4 Demonstration with questioning\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n30\nUNIT OF COMPETENCY:\nREAD, INTERPRET AND APPLY SPECIFICATION AND\nMANUALS\n\nUNIT CODE :"
