        "source_text": "ALT723201\n\nUNIT DESCRIPTOR\n\n:\nThis competency unit covers the selection and\napplication of sealant/adhesives.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nappropriate\nsealant/\nadhesive\n\n1.1 Sealant/adhesive\nselected in line with\njob requirements\nand manufacturer’s\nspecification\n1.2 Sealant/adhesive\nchecking is\nperformed to ensure\nthat product is fit for\nuse.\n1.3 Identify safety\nprecaution on each\nsealant/adhesive\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Procedures in\ninterpreting\nmanuals\n1.2 SCIENCE\n1.2.1 Various\ntypes and\napplications\nof sealant\nand\nadhesives\n1.1 Selecting proper\nsealant and\nadditives.\n2. Prepare surface\nfor sealant/\nadhesive\n\n2.1 Surface materials\nare identified as per\nconstruction\n2.2 Surface is cleaned\nand free of moisture,\ndust and other\nforeign matters to\nensure maximum\nadhesion or seal.\n2.1 ENGLISH/\nCOMMUNICATION\n2.1.1 Procedures\non in sealant/\nadhesives\napplication\n2.1.2 Industry code\nof practice\n2.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n2.2.1 Occupational\nHealth and\nSafety (OHS)\nrequirements\n2.3 SCIENCE\n2.3.1 Safe\nhandling of\nsealant/\nadhesive\n2.1 Handling\nsealant/\nadhesive\n2.2 Cleaning the\nsurface\n2.3 Using tools and\nequipment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n20\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Apply sealant/\nadhesive evenly\n3.1 Sealant/adhesive is\napplied evenly on\nthe surface in line\nwith manufacturer’s\nspecification\n3.2 Excess\nsealant/adhesive is\nremoved by sanding\nor scrapping\n3.3 Tools and\nequipment used to\napply\nsealant/adhesive are\nappropriate to job\nrequirements\n3.4 Safety are observed\nand PPE are worn in\naccordance with\nindustry Standard\nOperating\nProcedures (SOP)\n3.5 Hazards associated\nwith the use of\nsealant and\nadhesives are\nidentified.\n\n3.1 ENGLISH/\nCOMMUNICATION\n3.1.1 Procedures in\ninterpreting\nmanuals\n3.1.2 Procedures\nin sealant/\nadhesive\napplication\n3.1.3 Industry code\nof practice\n3.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n3.2.1 Occupational\nHealth and\nSafety (OHS)\nrequirements\n3.3 SCIENCE\n3.3.1 Safe\nhandling of\nsealant/\nadhesive\n3.1 Handling\nsealant/adhesive\n3.2 Applying\nsealant/adhesive\n3.3 Cleaning the\nsurface\n3.4 Using tools and\nequipment\n4. Store/Dispose of\nsealant/ adhesive\n4.1 Sealant/adhesive\nare stored as per\nprescribed\nprocedure\n4.2 Waste are disposed\nas per workshop\nSOP\n4.1 ENGLISH/\nCOMMUNICATION\n4.1.1 Industry code\nof practice\n4.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n4.2.1 Occupational\nHealth and\nSafety (OHS)\nrequirements\n4.3 SCIENCE\n4.3.1 Safe\nhandling of\nsealant/\nadhesive\n\n4.1 Storing\nsealant/adhesive\n4.2 Practicing safe\ndisposal of waste\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n21\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nMay include:\n1.1 Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3 Hametite\n1.4 Silicon Body sealer\n1.5Prestite for Auto and Auto Aircon\n2. Sealant/adhesiv\ne checking\n\nMay include:\n2.1 Expiry date\n2.2 Free of contamination\n2.3 Cap/Covers\n2.4 Tightly closed\n2.5Concentration\n3. Tools and\nequipment\nMay include:\n3.1 Putty knife\n3.2 Scraper\n3.3 Compressor\n3.4 Steel brush\n3.5 Paint brush\n3.6 Rubber hammer\n3.7 Hand tools\n\nPersonal Protective Equipment may include:\n3.8 Gloves\n3.9 Apron\n3.10 Safety shoes\n3.11 Goggles\n3.12 Gas mask\n4. Safety\nMay include:\n4.1 Ventilation\n4.2 Handling of Flammable/Irritating substances\n4.3Use of Personal Protective Equipment\n5 Hazards\nMay include:\n5.1 Fumes\n5.2 Skin irritation\n5.3 Burns\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n22\n EVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Materials relevant to the activity\n2.2 Appropriate tools and equipment\n2.3 Real or simulated workplace\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Interview related to:\n3.2.1 Safe and correct use of tools and equipment\n3.2.2 Application of adhesive/sealant\n4. Context of\nassessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n23\nUNIT OF COMPETENCY\n:\nMOVE AND POSITION VEHICLE\n\nUNIT CODE\n\n:"
