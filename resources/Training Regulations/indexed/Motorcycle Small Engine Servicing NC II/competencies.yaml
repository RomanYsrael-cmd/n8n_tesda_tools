omulgated December 2015\n\n44\nUNIT OF COMPETENCY :\nOBSERVE QUALITY SYSTEM\n\nUNIT CODE\n\n:\nALT311212\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the competence to conduct\nthe final quality check on completed work or orders, report\non the quality of processes and work outcomes, and\nimplement improvements to work processes.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Conduct final\nquality check on\ncompleted work /\norders\n\n1.1 Completed work/\norders are checked\nfor compliance with\nsupplier, company or\ncustomer\nspecifications\n1.2 Documentation is\nauthorized in\naccordance with\ncompany\nrequirements\n1.3 Feedback is\nprovided to staff on\nthe quality of their\nwork with equal\nemphasis on\nstrengths and\nweaknesses and\nopportunities for\ndevelopment\n1.1 ENGLISH/\nCOMMUNICATION\n1.1.1 Work\nplanning and\norganization\nprocesses\n1.1.2 Enterprise\nquality\nsystems and\nprocedures\n1.1.3 Quality\nsystems and\napplication\ntechniques in\na work\nenvironment\n1.1.4 Typical loss\nand damage\ncontrol\nsystems\n1.1.5 Worksite\ninformation\nmanagement\nsystems\n1.2 ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\n1.2.1 Occupational\nhealth and\nsafety\nregulations/\nrequirements\n\n1.1 Checking\ncompleted work/\norders\n1.2 Preparingdocumen\ntation and\nfeedback report\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n45\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Report on the\nquality of\nprocesses and\nwork outcomes\n\n2.1 Documents are kept\naccording to\ncompany quality\nprocedures on\noutcomes of quality\nchecks\n2.2 Quality problems\nare identified\naccording to\ncompany\nperformance\nindicators\n2.3 Information relating\nto the quality of\nprocesses and work\noutcomes is provided\nto a