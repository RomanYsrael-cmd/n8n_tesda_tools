g\n7.3 Engine stalling\n7.4 Engine runs poorly in high speed range\n7.5 Engine insufficient power\n7.6 Engine overheating\n7.7 Heavy exhaust smoke.\n7.8 Spark plug abnormal fouling\n7.9 Abnormal noise of muffler\n7.10 After fire\n7.11 Backfire\n8. Intake and\nexhaust system\ncomponents\nIntake System components may include:\n8.1 Air cleaner case\n8.2 Air filter element\n8.3 Gaskets\n8.4 Intake manifold\n8.5 Engine breather\n8.6 Pair\nExhaust System components may include:\n8.7 Exhaust pipe\n8.8 Gaskets\n8.9 Connector\n8.10 O-ring\n8.11 Muffler\n8.12 Baffle pipe (Silencer)\n8.13 Oxygen Sensor\n8.14 Pulsed Secondary Air Injection System (PAIR)\n8.15 Catalytic converter\n8.16 Exhaust Control System (Exhaust Control Valve / Exhaust\nControl Valve Actuator)\n8.17 Secondary air control solenoid valve\n8.18 Secondary air lead valve\n8.19 Emission control devices\n9. Lubrication\nsystem\nmalfunction\nMay include:\n9.1 Oil leak\n9.2 Engine overheating\n9.3 Engine seizure\n9.4 Abnornal engine noise\n9.5 Abnornal wear of engine parts\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\n\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 2015\n\n70\nVARIABLE\nRANGE\n10. Lubrication\nsystem\ncomponents\nMay include:\n10.1 Oil pan (bottom of crankcase)\n10.2 Oil tank\n10.3 Oil pump\n10.4 Oil hole/passages\n10.5 Oil filter/strainer\n10.6Oil cooler tank\n11. Cooling system\nmalfunction\nMay include:\n11.1 Coolant leak\n11.2 Contaminated coolant\n11.3Engine overheating\n12. Cooling system\ncomponents\nMay include:\n12.1 Cooling fins\n12.2 Engine cooling/auxiliary fan\n12.3 Radiator Cap\n12.4 Radiator Hoses\n12.5 Radiator tank\n12.6 Reservoir tank\n12.7 Coolant Temperature Sensor/Thermosensor\n12.8 Radiator fan\n12.9 Water pump\n12.10 Thermostat\n12.11 Radiator shroud\n12.12 Coolant\n12.13 Mechanical/water seal\n13. Transmission and\nclutch malfunction\nMay include:\n13.1 Leakage\n13.2 Dragging clutch\n13.3 Burning smell\n13.4 Transmission slippage\n13.5 Hard gear s