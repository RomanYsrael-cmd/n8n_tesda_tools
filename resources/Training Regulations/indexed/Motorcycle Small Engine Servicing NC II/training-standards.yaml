  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Motorcycle/Small Engine Servicing NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: MOTORCYCLE/SMALL ENGINE SERVICING NC Level: NC II\n\nNominal Training Duration:\n 18\nHours (Basic)\n\n 88\nHours (Common)\n544\nHours (Core)\n\n650\nHours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of motorcycle/small engine servicing in accordance with industry\nstandards. It covers core competencies such as; service engine system; service\nelectrical system; service chassis and overhaul motorcycle engine.\n\nThis course is also designed to equip the individual the basic and common\nknowledge, skills and attitudes of the motorcycle mechanic in accordance with\nindustry standards.\n\nTo obtain this, all units prescribed for this qualification must be achieved\n\n--- PDF PAGE 105 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n101\nBASIC COMPETENCIES\n(18 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hrs.\n• Read:\no Effective communication\n•\nLecture\n• Written examination\no Written communication\no Communication procedures\nand systems\n• Identify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology\nrelevant to the enterprise\nand the individual’s work\nresponsibilities\n• Prepare different Types of\nquestion\n•\nDemonstration\n• Observation\n• Gather different sources of\ninformation\n• Apply storage system in\nestablishing workplace\ninformation\n• Demonstrate Telephone\ncourtesy\n\n--- PDF PAGE 106 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n102\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n• Describe Communication\nprocedures and systems\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\no Meeting protocols\n•\nLecture\n• Written examination\no Nature of workplace\nmeetings\n•\nLecture\n• Written examination\no Workplace interactions\no Barriers of communication\n• Complete work related\ndocuments\n•\nDemonstration\n• Observation\n• Read instructions on work\nrelated forms/documents\n•\nLecture\n• Written examination\n• Practice:\n\no Estimate, calculate and\nrecord routine workplace\nmeasures\n•\nDemonstration\n• Observation\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n• Demonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nRole play\n• Oral evaluation\n• Observation\n• Perform workplace duties\nscenario following simple written\nnotices\n•\nRole play\n• Oral evaluation\n• Observation\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n• Identify the different Non-verbal\ncommunication\n•\nLecture\n• Written examination\n\n--- PDF PAGE 107 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n103\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information\nin response to workplace\nrequirements\n•\nDemonstration\n• Observation\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Identify:\no types of workplace\ndocuments and forms\n•\nLecture\n• Written examination\no kinds of workplace report\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n• Read and follow instructions in\napplying basic mathematical\nconcepts\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nDemonstration\n• Observation\n• Gather and provide information\nin response to workplace\nrequirements\n2. Work in a\nteam\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility\nin a team\n• Describe the team role and\nscope\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hrs.\n\n--- PDF PAGE 108 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n104\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Read\no Definition of Team\n•\nLecture\n• Written examination\n\no Difference between team and\ngroup\no Objectives and goals of team\n•\nLecture\n• Written examination\n\n• Identify different sources of\ninformation\n\n2.2 Describe work\nas a team\n• Describe team goals and\nobjectives\n•\nGroup\ndiscussion\n• Oral evaluation\n• Perform exercises in setting\nteam goals and expectations\nscenario\n•\nRole play\n• Oral evaluation\n• Observation\n• Identify\no individual role and\nresponsibility\n•\nLecture\n• Written examination\n• Practice Interacting effectively\nwith others\n•\nGroup\ndiscussion\n• Oral evaluation\n• Read:\n•\nLecture\n• Written examination\no Fundamental rights at work\nincluding gender sensitivity\no Understanding individual\ncompetencies relative to\nteamwork\no Types of individuals\no Role of leaders\n\n--- PDF PAGE 109 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n105\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n• Describe performance\nevaluation\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hrs.\n• Read:\n•\nLecture\n• Written examination\no Work values and ethics (Code\nof Conduct, Code of Ethics,\netc.)\no Understanding personal\nobjectives\no Understanding organizational\ngoals\n\n• Demonstrate Intra and\nInterpersonal skills at work\n•\nDemonstration\n• Observation\n• Demonstrate personal\ncommitment in work\n\n3.2 Set and meet\nwork priorities\n• Describe company policies,\noperations, procedures and\nstandards\n•\nGroup\ndiscussion\n• Oral evaluation\n\n--- PDF PAGE 110 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Read:\n•\nLecture\n• Written examination\n\no Time Management\no Basic strategic planning\nconcepts\no Resource utilization and\nmanagement\n• Apply managing goals and time\n•\nDemonstration\n• Observation\n• Practice:\no economic use of resources\nand facilities\n•\nDemonstration\n• Observation\no time management\n\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Describe company recognition\nand incentives\n\n•\nGroup\ndiscussion\n• Oral evaluation\n• Read:\n•\nLecture\n• Written examination\no Career development\nopportunities\no Information on relevant\nlicenses and or certifications\n\no personal career development\nneeds\n\n--- PDF PAGE 111 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n107\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Identify career opportunities\n•\nLecture\n• Written examination\n\n• Determine personal career\ndevelopment needs\n•\nGroup\ndiscussion\n• Oral evaluation\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify\nhazard and\nrisks\n• Describe OHS procedures,\npractices and regulations\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hrs.\n• Read\n•\nLecture\n• Written examination\no OHS indicators\no Organizational contingency\npractices\n• Practice hazards/risks\nidentification and control\n\n4.2 Evaluate\nhazard and\nrisks\n• Describe effects of safety\nhazards\n•\nGroup\ndiscussion\n• Oral evaluation\n• Read\n•\nLecture\n• Written examination\no Threshold Limit Value –TLV\n• Practice reporting safety\nhazards\n•\nRole play\n• Observation\n• Demonstrate evaluating\nhazards and risks using\ncommunication equipment\n\n•\nDemonstration\n• Observation\n\n4.3 Control\nhazards and\nrisks\n• Describe :\no Organization safety and\nhealth protocol\n•\nGroup\ndiscussion\n• Oral evaluation\n\no Company emergency\n\n--- PDF PAGE 112 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n108\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\nprocedure practices\n• Practice personal hygiene\n•\nDemonstration\n• Observation\n\n• Practice drills on responding to\nemergency\n•\nDemonstration\n•\nSimulation\n• Observation\n\n4.4 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Identify emergency-related drills\ninformation\n•\nLecture\n• Wri