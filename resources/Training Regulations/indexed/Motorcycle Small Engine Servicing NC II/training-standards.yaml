      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: MOTORCYCLE/SMALL ENGINE SERVICING NC Level: NC II\n\nNominal Training Duration:\n 18\nHours (Basic)\n\n 88\nHours (Common)\n544\nHours (Core)\n\n650\nHours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of motorcycle/small engine servicing in accordance with industry\nstandards. It covers core competencies such as; service engine system; service\nelectrical system; service chassis and overhaul motorcycle engine.\n\nThis course is also designed to equip the individual the basic and common\nknowledge, skills and attitudes of the motorcycle mechanic in accordance with\nindustry standards.\n\nTo obtain this, all units prescribed for this qualification must be achieved\n\n--- PDF PAGE 105 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n101\nBASIC COMPETENCIES\n(18 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hrs.\n• Read:\no Effective communication\n•\nLecture\n• Written examination\no Written communication\no Communication procedures\nand systems\n• Identify:\no Different modes of\ncommunication\no Medium of communication\no Fl