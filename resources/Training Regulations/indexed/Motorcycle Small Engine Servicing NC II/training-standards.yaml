Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n105\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n• Describe performance\nevaluation\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hrs.\n• Read:\n•\nLecture\n• Written examination\no Work values and ethics (Code\nof Conduct, Code of Ethics,\netc.)\no Understanding personal\nobjectives\no Understanding organizational\ngoals\n\n• Demonstrate Intra and\nInterpersonal skills at work\n•\nDemonstration\n• Observation\n• Demonstrate personal\ncommitment in work\n\n3.2 Set and meet\nwork priorities\n• Describe company policies,\noperations, procedures and\nstandards\n•\nGroup\ndiscussion\n• Oral evaluation\n\n--- PDF PAGE 110 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Read:\n•\nLecture\n• Written examination\n\no Time Management\no Basic strategic planning\nconcepts\no Resource utilization and\nmanagement\n• Apply managing goals and time\n•\nDemonstration\n• Observation\n• Practice:\no economic use of resources\nand facilities\n•\nDemonstration\n• Observation\no time management\n\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Describe company recognition\nand incentives\n\n•\nGroup\ndiscussion\n• Oral evaluation\n• Read:\n•\nLecture\n• Written examination\no Career development\nopportunities\no Information on relevant\nlicenses and or certifications\n\no personal career development\nneeds\n\n--- PDF PAGE 111 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n107\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n• Identify career opportunities\n•\nLecture\n• Written examination\n\n• Determine personal career\ndevelopment needs\n•\nGroup\ndiscussion\n• Oral evaluation\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify\nhazard and\nrisks\n• Describe OHS procedures,\npractices and regulations\n•\nGroup\ndiscussion\n• Oral evaluation\n6 Hrs.\n• Read\n•\nLecture\n• Written examination\no OHS indicators\no Organizational contingency\npractices\n• Practice hazards/risks\nidentification and control\n\n4.2 Evaluate\nhazard and\nrisks\n• Describe effects of safety\nhazards\n•\nGroup\ndiscussion\n• Oral evaluation\n• Read\n•\nLecture\n• Written examination\no Threshold Limit Value –TLV\n• Practice reporting safety\nhazards\n•\nRole play\n• Observation\n• Demonstrate evaluating\nhazards and risks using\ncommunication equipment\n\n•\nDemonstration\n• Observation\n\n4.3 Control\nhazards and\nrisks\n• Describe :\no Organization safety and\nhealth protocol\n•\nGroup\ndiscussion\n• Oral evaluation\n\no Company emergency\n\n--- PDF PAGE 112 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n108\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\nprocedure practices\n• Practice personal hygiene\n•\nDemonstration\n• Observation\n\n• Practice drills on responding to\nemergency\n•\nDemonstration\n•\nSimulation\n• Observation\n\n4.4 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Identify emergency-related drills\ninformation\n•\nLecture\n• Written examination\n\n• Practice occupational safety\nand health standards on\npersonal records in the\nworkplace\n•\nRole play\n• Observation\n• Practice emergency related\ndrills in the workplace\n•\nDemonstration\n•\nSimulation\n\n• Observation\n\n--- PDF PAGE 113 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n109\nCOMMON COMPETENCIES\n(88 Hours)\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n1. Apply\nappropriate\nsealant/adhesive\n1.1 Identify\nappropriate\nsealant/\nadhesive\n\n• Identify the types and\napplication of sealant and\nadhesive\n• Apply procedures from service\nmanual\n• Select appropriate\nsealant/adhesive\n\n• Lecture\n• Discussion\n• Demonstration\n\n• Observation\n• Practical Examination\n\n1 Hour\n1.2 Prepare\nsurface for\nsealant/\nadhesive\n\n• Apply company occupational\nsafety and health (OSH)\npolicies\n• Apply company standard\noperating procedure\n• Demonstrate personal safety\nand hygiene\n• Practice proper use of tools\nand equipment\n• Identify surface materials as\nper construction\n• Clean surface\n• Practice proper application of\nsealant/adhesive\n\n• Lecture\n• Discussion\n• Demonstration\n\n• Observation\n• Practical Examination\n\n1 Hour\n\n--- PDF PAGE 114 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n110\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\n\n1.3 Apply sealant/\nadhesive\nevenly\n• Apply company occupational\nsafety and health (OSH)\npolicies\n• Apply company standard\noperating procedure\n• Demonstrate personal safety\n• Identify threats in using\nsealant and adhesive\n• Use of proper tools and\nequipment’s\n• Apply exact amount of\nsealant/adhesive\n• Remove excess amount of\nsealant adhesive\n• Apply procedures from service\nmanual\n\n• Lecture\n• Discussion\n• Demonstration\n\n• Observation\n• Practical Examination\n\n1 Hour\n\n1.4 Store/Dispose\nof sealant/\nadhesive\n\n• Practice proper storage of\nsealant/adhesive\n• Apply proper waste\nsegregation and disposal\n• Apply company occupational\nsafety and health (OSH)\npolicies\n• Demonstrate personal safety\n\n• Lecture\n• Discussion\n• Demonstration\n\n• Observation\n• Practical Examination\n\n1 Hour\n2. Move and\n position vehicle\n2.1 Prepare\n vehicle for\n driving\n\n• Demonst