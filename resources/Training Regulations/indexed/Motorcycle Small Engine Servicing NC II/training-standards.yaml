rmed\nindividually in the students/trainees work area.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN SQ. METERS\n Building (permanent)\n15.00 x 17.00\n255\n255.00\nTrainee Working Space\n2.00 x 2.00 per\ntrainee\n4.00 per trainee\n72.00\nLecture Room\n9.00 x 9.00\n81.00\n81.00\nLearning Resource Center\n5.00 x 8.00\n40.00\n40.00\nFacilities/Equipment/\nCirculation Area\n-\n-\n62.00\n\n3.6 TRAINERS QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nMotorcycle/Small Engine Servicing NC II\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years’ job/industry experience (Motorcycle/Small Engine\nServicing/ Automotive Servicing)\n\n3.7\nINSTITUTIONAL ASSESSMENT\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 156 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n 152"
