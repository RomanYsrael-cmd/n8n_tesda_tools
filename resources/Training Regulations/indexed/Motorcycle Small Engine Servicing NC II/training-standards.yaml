  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Motorcycle/Small Engine Servicing NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: MOTORCYCLE/SMALL ENGINE SERVICING NC Level: NC II\n\nNominal Training Duration:\n 18\nHours (Basic)\n\n 88\nHours (Common)\n544\nHours (Core)\n\n650\nHours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of motorcycle/small engine servicing in accordance with industry\nstandards. It covers core competencies such as; service engine system; service\nelectrical system; service chassis and overhaul motorcycle engine.\n\nThis course is also designed to equip the individual the basic and common\nknowledge, skills and attitudes of the motorcycle mechanic in accordance with\nindustry standards.\n\nTo obtain this, all units prescribed for this qualification must be achieved\n\n--- PDF PAGE 105 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n101\nBASIC COMPETENCIES\n(18 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational\npolicies\n\n•\nGroup\ndiscussion\n• Oral evaluation\n4 Hrs.\n• Read:\no Effective communication\n•\nLecture\n• Written examination\no Written communication\no Communication procedures\nand systems\n• Identify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology\nrelevant to the enterprise\nand the individual’s work\nresponsibilities\n• Prepare different Types of\nquestion\n•\nDemonstration\n• Observation\n• Gather different sources of\ninformation\n• Apply storage system in\nestablishing workplace\ninformation\n• Demonstrate Telephone\ncourtesy\n\n--- PDF PAGE 106 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n102\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment Approach\nNominal\nDuration\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n• Describe Communication\nprocedures and systems\n•\nGroup\ndiscussion\n• Oral evaluation\n\n• Read:\no Meeting protocols\n•\nLecture\n• Written examination\no Nature of workplace\nmeetings\n•\nLecture\n• Written examination\no Workplace interactions\no Barriers of communication\n• Complete work related\ndocuments\n•\nDemonstration\n• Observation\n• Read instructions on work\nrelated forms/documents\n•\nLecture\n• Written examination\n• Practice:\n\no Estimate, calculate and\nrecord routine workplace\nmeasures\n•\nDemonstration\n• Observation\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n• Demonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nRole play\n• Oral evaluation\n• Observation\n• Perform workplace duties\nscenario following simple written\nnotices\n•\nRole play\n• Oral evaluation\n• Observation\n• Follow simple spoken language\n•\nDem