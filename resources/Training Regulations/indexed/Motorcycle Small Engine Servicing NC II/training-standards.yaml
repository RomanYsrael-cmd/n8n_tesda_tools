Written Examination\n• Interview\n• Oral Questioning\n• Practical Examination\n• Demonstration\n\n8 Hours\n\n--- PDF PAGE 147 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n143\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment Methods\nNominal\nDuration\nand regulations\n\n4.6 Clean-up work\narea\n• Enumerate steps in cleaning-\nup work area\n• Apply company occupational\nsafety and health (OSH)\npolicies\n• Apply company standard\noperating procedures\n• Apply 5S\n• Apply tools and equipment\nmaintenance\n• Apply service shop\nmaintenance\n\n• Lecture\n• Demonstration/\nHands-on\n• Discussion\n• Written Examination\n• Practical Examination\n• Observation\n• Oral questioning\n\n4 Hours\n\n--- PDF PAGE 148 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n 144\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both\non-and off-the-job as long as the learning is driven by the competency standards specified\nby the industry. The following training modalities and their variations/components may be\nadopted singly or in combination with other modalities when designing and delivering\ntraining programs:\n\n2.1 Institution - Based:\n\n•\nDual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n--- PDF PAGE 149 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n 145\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits to\ntraining the apprentice in all the skills relevant to his or her trade over a\nsignificant period of time, usually between one and four years, while the\napprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• Can communicate both orally and in writing;\n• Can perform basic mathematical computation.\n• At least Senior High School (Grade 11 ) level ;\n• At least holder of Student Permit or LTO license (Restriction Code 1)\n\n--- PDF PAGE 150 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n 146\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n MOTORCYCLE/SMALL ENGINE SERVICING – NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nMotorcycle/Small Engine Servicing – NC II\n\nBASIC TOOLS\nQTY.\nDESCRIPTION\nQTY.\nDESCRIPTION\n2 pcs.\nT-type box wrench (8mm)\n(L 310mm)\n\n2 pcs.\nPhillips screw driver (+ No.3)\n(L-150mm)\n2 pcs.\nT-type box wrench (10mm)\n(L 310mm)\n\n2 pcs.\nWiring Flat Screw driver (200mm)\n2 pcs.\nT-type box wrench (12mm)\n(L 310mm)\n\n2 pcs.\nCarburetor Screwdriver (295mm)\n2 pcs.\nT-type box wrench (14mm)\n(L 310mm)\n\n2 pcs.\nFlat screw driver stubby ( L-25mm)\n2 pcs.\nT-type box wrench (17mm)\n(L 310mm)\n\n2 pcs.\nPhillips screw driver stubby (No. 2)\n(L-25mm)\n2 pcs.\nT-type screw driver (- No. 3)\n\n2 pcs.\nIntensified flat screw driver (290mm)\n2 pcs.\nT-type screw driver (+ No.2)\n\n2 pcs.\nCombination pliers (200mm)\n2 pcs.\nT-type screw driver (+ No. 3)\n\n2 pcs.\nSnap ring pliers (opening type)\n(L-7 in.)\n2 pcs.\nOffset wrench (08x09mm)\n(L-182mm)\n\n2 pcs.\nSnap ring pliers (closing type)\n(L-7 in.)\n2 pcs.\nOffset wrench (10x12mm)\n(L-217mm)\n\n2 pcs.\nCutting pliers (150mm)\n2 pcs.\nOffset wrench (12x14mm)\n(L-218mm)\n\n2 pcs.\nLong nose pliers (150mm)\n2 pcs.\nOffset wrench (14x17mm)\n(L-245mm)\n\n2 pcs.\nBall peen hammer (450 g)\n2 pcs.\nOffset wrench (17x19mm)\n(L-290mm)\n\n2 pcs.\nCopper hammer (450 g)\n2 pcs.\nOffset wrench (22x24mm)\n(L-324mm)\n\n2 pcs.\nPlastic Soft face hammer (450 g)\n2 pcs.\nOpen end wrench (06x07mm)\n(L-127mm)\n\n2 sets\n Impact driver (6 pcs.)\n(L-145mm)\n2 pcs.\nOpen end wrench (08x09mm)\n(L-145mm)\n\n