  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain a National Qualification of MOTORCYCLE/SMALL ENGINE\nSERVICING NC II, the candidate must have demonstrated competence through\nproject-type assessment covering all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate singed by the\nTESDA Director General.\n4.1.2 Candidates who want to be assessed only in the area of small engine servicing\nshall be awarded a COC with a title of Small Engine Mechanic after undergoing\nand passing assessment for the following core competencies.\n4.1.2.1 Service motorcycle/ small engine system\n4.1.2.2 Service electrical system\n4.1.2.3 Overhall motorcycle/small engine\n\n The assessment for the above core units shall cover only small engines.\n\n4.1.3 Candidates wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n4.1.4 Candidates applying for competency assessment and certification for\nMotorcycle/Small Engine Servicing NC II:\n4.1.4.1\nGraduates of formal education or non-formal training from institutions\n4.1.4.2\nExperienced workers (wage-employed or self-employed)\n4.1.5 Holders of National Certificate (NC) / Certificate of Competency (COC) for the\nabovementioned qualifications are required to undergo re-assessment under\nthe amended Training Regulations (TR) upon expiration of their NC or COC.\n4.1.6 Conduct of assessment and issuance of certificates shall follow the procedures\nmanual and implementing guidelines developed for the purpose.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\n\n--- PDF PAGE 157 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n 153\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is\navailable, where gaps exist, including readiness for assessment.\n\nThis document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo\na quality assured procedure for accreditation before they are authorized by\nTESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 158 ---\nTR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015\n\n154\n"
