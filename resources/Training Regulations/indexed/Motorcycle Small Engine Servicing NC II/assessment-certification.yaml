      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain a National Qualification of MOTORCYCLE/SMALL ENGINE SERVICING NC II, the candidate must have demonstrated competence through project-type assessment covering all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate singed by the TESDA Director General. 4.1.2 Candidates who want to be assessed only in the area of small engine servicing shall be awarded a COC with a title of Small Engine Mechanic after undergoing and passing assessment for the following core competencies. 4.1.2.1 Service motorcycle/ small engine system 4.1.2.2 Service electrical system 4.1.2.3 Overhall motorcycle/small engine The assessment for the above core units shall cover only small engines. 4.1.3 Candidates wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.4 Candidates applying for competency assessment and certification for Motorcycle/Small Engine Servicing NC II: 4.1.4.1 Graduates of formal education or non-formal training from institutions 4.1.4.2 Experienced workers (wage-employed or self-employed) 4.1.5 Holders of National Certificate (NC) / Certificate of Competency (COC) for the abovementioned qualifications are required to undergo re-assessment under the amended Training Regulations (TR) upon expiration of their NC or COC. 4.1.6 Conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose. 4.1.7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the TR- Motorcycle/Small Engine Servicing NC II (Amended) Promulgated December 16, 2015"
    },
