        "source_title": "RECEIVE AND RESPOND TO WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n2\n \n \nSECTION  2   COMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the basic, common and core \nunits of competency required in AGRICULTURAL CROPS PRODUCTION NC I. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY:    RECEIVE AND RESPOND TO WORKPLACE     \nCOMMUNICATION \nUNIT CODE                    :    500311101 \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes \nrequired to receive, respond and act on verbal and \nwritten communication. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated in the Range of Variables \n1. Follow routine spoken \nmessages \n1.1 Required information is gathered by listening \nattentively and correctly interpreting or \nunderstanding  information/instructions \n1.2 Instructions/information are properly recorded \n1.3 Instructions are acted upon immediately  in \naccordance with information received  \n1.4 Clarification is sought from workplace supervisor on \nall occasions when any instruction/information is not \nclear  \n2. Perform workplace \nduties following \nwritten notices \n2.1 Written notices and instructions are read and   \ninterpreted correctly in accordance with \norganizational guidelines \n2.2   Routine written instruction are followed in sequence \n2.3   Feedback is given to workplace supervisor based on \nthe instructions/information received\n\n--- PDF PAGE 5 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n3\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Written notices and \ninstructions \nIt refers to : \n1.1. Handwritten and printed material \n1.2. Internal memos \n1.3. External communications \n1.4. Electronic mail \n1.5. Briefing notes \n1.6. General correspondence \n1.7. Marketing materials \n1.8. Journal articles \n2. Organizational \nGuidelines \nIt may include: \n2.1. Information documentation procedures \n2.2. Company  policies and  procedures \n2.3. Organization manuals \n2.4. Service manual\n\n--- PDF PAGE 6 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n4\n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge of organizational \nprocedures for handling verbal  and written \ncommunications \n1.2 \nReceived and acted on verbal messages and \ninstructions \n1.3 \nDemonstrated competency in recording \ninstructions/information \n2. Underpinning \nknowledge and \nattitudes \n2.1. \nKnowledge of organizational policies/guidelines in \nregard to processing internal/external information \n2.2. \nEthical work practices in handling communications \n2.3. \nCommunication process \n3. Underpinning skills \n3.1. \nConciseness in receiving and clarifying \nmessages/information/communication \n3.2. \nAccuracy in recording messages/information \n4. Resource implications \nThe following resources must be provided: \n4.1. \nPens \n4.2. \nNote pads \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1. \nDirect Observation \n5.2. \nOral interview \n5.3. \nWritten Evaluation \n5.4. \nThird Party Report \n6. Context for \nassessment \n6.1. \nCompetency may be assessed individually in the \nactual workplace or simulation environment in \nTESDA accredited institutions\n",
