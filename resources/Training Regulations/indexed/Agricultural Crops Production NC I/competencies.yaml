          "source_text": "1 Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nApplied Resuscitation \n1.2 \nDemonstrated First Aid casualty management \nprinciples assessing and minimising danger, \nmaintaining the casualty’s airway, breathing and \ncirculation \n1.3 \nPerformed safe manual handling of casualty \n1.4 \nConsidered the welfare of the casualty \n1.5 \nReported preparation \n1.6 \nCommunicated effectively \n1.7 \nAbility to interpret and use listed documents \nAssessment should confirm the knowledge of: \n1.8 \nBasic anatomy and physiology \n1.9 \nCompany standard operating procedures (sops) \n1.10 Dealing with confidentiality \n1.11 Knowledge of the First Aiders’ skills and \nlimitations \n1.12 OHS legislation and regulations \n1.13 How to gain access to and interpret material \nsafety data sheets (MSDS) \n2 Underpinning \nKnowledge and \nAttitudes \n2.1 \nBasic anatomy and physiology \n2.2 \nDuty of care \n2.3 \nResuscitation \n2.4 \nBleeding control \n2.5 \nCare of unconscious \n2.6 \nState and territory regulatory requirements \nrelating to currency of skill and knowledge \n2.7 \nDecision making \n2.8 \nInfection control \n2.9 \nLegal requirements \n2.10 Airway management \n2.11 Assertiveness skills \n2.12 Communication skills\n\n--- PDF PAGE 33 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n31\n \n3 Underpinning Skills \n3.1 \nResuscitation \n3.2 \nFirst Aid casualty management principles \nassessing and minimising danger, maintaining \nthe casualty’s airway, breathing and circulation \n3.3 \nSafe manual handling of casualty \n3.4 \nConsideration of the welfare of the casualty \n3.5 \nReport preparation \n3.6 \nCommunication skills \n3.7 \nAbility to interpret and use listed documents \n4. Resource Implication \n \n4.1 \nFirst Aid equipment and materials \n4.2 \nCommunication equipment appropriate to the \nworkplace \n4.3 \nWorkplace documentation \n4.4 \nEnterprise procedures \n5. Methods of \nAssessment \n5.1 \nCompetency should be assessed: \n5.2 \nThrough direct observation and oral interview. \n6. Context of \nAssessment \n6.1 \nCompetence may be demonstrated working \nindividually, under supervision or as part of a First \nAid team. \n6.2 \nWhere applicable, assessment should replicate \nworkplace conditions as far as possible. Where, \nfor reasons of safety, access to equipment and \nresources and space, assessment takes place \naway from the workplace, simulations should be \nused to represent workplace conditions as closely \nas possible. Consistency of performance should \nbe maintained over the required range of \nworkplace situations until renewal of competence \n/license is required by the industry/organisation.\n\n--- PDF PAGE 34 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n32\n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY: \nSupport horticultural crop work \nUNIT CODE:"
