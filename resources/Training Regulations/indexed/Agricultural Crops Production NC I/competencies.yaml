        "source_text": "AGR321204 \n \nUNIT DESCRIPTOR : \nThis unit of competency deals with the provision of \nessential First Aid in recognising and responding to an \nemergency using basic life support measures. The First \nAider is not expected to deal with complex casualties or \nincidents, but to provide an initial response where First \nAid is required. In this unit it is assumed the First Aider \nis working under supervision and/or according to \nestablished workplace First Aid procedures and \npolicies. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated in the Range of Variables \n1. Assess the situation \n1.1 Physical hazards to own and others' health and \nsafety are identified \n1.2 Immediate risk to self and health and safety of the \ncasualty/OHS are minimised by controlling the \nhazard in accordance with OHS requirements \n1.3 Casualty's vital signs and physical condition are \nassessed in accordance with workplace procedures \n2. Apply basic First Aid \ntechniques \n2.1 First Aid management is provided in accordance \nwith established First Aid procedures \n2.2 Casualty is reassured in a caring and calm manner \nand made comfortable using available resources \n2.3 First Aid assistance is sought from others in a \ntimely manner and as appropriate \n2.4 Casualty's condition is monitored and responded \nto in accordance with effective First Aid principles \nand workplace procedures \n2.5 Details of casualty's physical condition, changes in \nconditions, management and response to \nmanagement are accurately recorded in line with \norganisational procedures \n2.6 Casualty management is finalised according to \ncasualty's needs and First Aid principles\n\n--- PDF PAGE 29 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n27\n \n3. Communicate details \nof the incident \n3.1 Appropriate medical assistance is requested using \nrelevant communication media and equipment \n3.2 Details of casualty's condition and management \nactivities are accurately conveyed to emergency \nservices/relieving personnel \n3.3 Reports to supervisors are prepared in a timely \nmanner, presenting all relevant facts according to \nestablished company procedures\n\n--- PDF PAGE 30 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n28\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Physical hazards \nmay include: \n1.1 \nWorkplace hazards \n1.2 \nEnvironmental hazards \n1.3 \nProximity of other people \n1.4 \nHazards associated with the casualty management \nprocesses \n2. Risks may include: \n2.1 \nWorksite equipment, machinery and substances \n2.2 \nEnvironmental risks \n2.3 \nBodily fluids \n2.4 \nRisk of further injury to the casualty \n2.5 \nRisks associated with the proximity of other workers \nand bystanders \n3. Vital signs include: \n3.1 \nBreathing \n3.2 \nCirculation \n3.3 \nConsciousness \n4. Established First Aid \nprinciples include: \n4.1 \nChecking the site for danger to self, casualty and others \nand minimising the danger \n4.2 \nChecking and maintaining the casualty’s airway, \nbreathing and circulation \n5. Casualty's condition \nis managed for: \n5.1 \nAbdominal injuries \n5.2 \nAllergic reactions \n5.3 \nBleeding \n5.4 \nBurns - thermal, chemical, friction, electrical \n5.5 \nCardiac conditions \n5.6 \nChemical contamination \n5.7 \nCold injuries \n5.8 \nCrush injuries \n5.9 \nDislocations \n5.10 Drowning \n5.11 Envenomation - snake, spider, insect and marine bites \n5.12 Environmental conditions such as hypothermia, \ndehydration, heat stroke \n5.13 Epilepsy, diabetes, asthma and other medical \nconditions \n5.14 Eye injuries \n5.15 Fractures \n5.16 Head injuries \n5.17 Minor skin injuries \n5.18 Neck and spinal injuries\n\n--- PDF PAGE 31 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n29\n5.19 Needle stick injuries \n5.20 Poisoning and toxic substances \n5.21 Respiratory management of asthma and/or choking \n5.22 Shock \n5.23 Smoke inhalation \n5.24 Soft tissue injuries including sprains, strains, \ndislocations \n5.25 Substance abuse - including drugs \n5.26 Unconsciousness including not breathing and no pulse \n6. First Aid \nmanagement will \nneed to account for: \n6.1 \nLocation and nature of the workplace \n6.2 \nEnvironmental conditions eg electricity, biological risks, \nweather, motor vehicle accidents \n6.3 \nLocation of emergency services personnel \n6.4 \nUse and availability of First Aid equipment and \nresources \n6.5 \nInfection control \n7. Medications may \ninclude: \n7.1 \nAsthma–aerosol bronchodilators casualty’s own or from \nFirst Aid kit in accordance with state and territory \nlegislation \n7.2 \nSevere allergic reactions–adrenaline–subject to \ncasualty’s own regime \n8. Resources and \nequipment are used \nappropriate to the \nrisk and may include: \n8.1 \nDefibrillation units \n8.2 \nPressure bandages \n8.3 \nThermometers \n8.4 \nFirst Aid kit \n8.5 \nEyewash \n8.6 \nThermal blankets \n8.7 \nPocket face masks \n8.8 \nRubber gloves \n8.9 \nDressing \n8.10 Spacer device \n8.11 Cervical collars \n9. Communication \nsystems may include \nbut are not be limited \nto: \n9.1 \nMobile phone \n9.2 \nSatellite phones \n9.3 \nHF/VHF radio \n9.4 \nFlags \n9.5 \nFlares \n9.6 \nTwo-way radio \n9.7 \nEmail \n9.8 \nElectronic equipment\n\n--- PDF PAGE 32 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n30\n \nEVIDENCE GUIDE \n1 Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nApplied Resuscitation \n1.2 \nDemonstrated First Aid casualty management \nprinciples assessing and minimising danger, \nmaintaining the casualty’s airway, breathing and \ncirculation \n1.3 \nPerformed safe manual handling of casualty \n1.4 \nConsidered the welfare of the casualty \n1.5 \nReported preparation \n1.6 \nCommunica