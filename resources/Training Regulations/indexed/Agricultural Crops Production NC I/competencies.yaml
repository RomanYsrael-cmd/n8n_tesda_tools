c workplace \ncalculation \n2.1 Calculations to be made are identified according \nto job requirements \n2.2 Correct method of calculation identified \n2.3 System and units of measurement to be \nfollowed are ascertained \n2.4 Calculation needed to complete work tasks are \nperformed using the four basic process of \naddition, division, multiplication and subtraction \n2.5 Calculate whole fraction, percentage and mixed \nwhen are used to complete the instructions \n2.6 Number computed in self checked and completed \nfor alignment\n\n--- PDF PAGE 26 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n24\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nCalculation \n1.1 \nQuantity of feeds \n1.2 \nAmount of fertilizer \n1.3 \nAmount of medicines \n2. \nMethod of calculation \n \n2.1 \nAddition \n2.2 \nSubtraction \n2.3 \nMultiplication \n2.4 \nDivision \n2.5\nRatio and proportion\n3. \nSystem of measurement \n3.1 \nEnglish \n3.2 \nMetric \n4. \nUnits of measurement \n4.1 \nArea \n4.2 \nVolume \n4.3 \nWeight\n\n--- PDF PAGE 27 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n25\n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPerformed estimation \n1.2 \nPerformed basic workplace calculation \n1.3\nApplied corrective measures as maybe necessary\n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Mathematics \n2.1.1 \nBasic mathematical operations \n2.1.2 \nPercentage and ratios \n2.1.3 \nUnit Conversion \n2.1.4 \nBasic accounting principles and procedures \n2.1.4.1 Production cost \n2.1.4.2 Sales \n2.1.4.3 Accounts receivables/payables \n \n2.2 Systems, Processes and Operations \n2.2.1 Knowledge in different management practices and \noperational procedures \n \n2.3 Values \n2.3.1 Safety consciousness \n2.3.2 Time consciousness and management \n2.3.3 Cost consciousness \n2.3.4 Precision\n3. Underpinning \nSkills \n3.1 \nAbility to perform basic calculation \n3.2 \nCommunicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 \nPractical demonstration \n4.2 \nWritten examination \n5. Resource \nImplications \n5.1 \nRelevant tools and equipment for basic calculation \n5.2 \nRecommended data \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 28 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n26\n \nUNIT OF COMPETENCY: \nApply Basic First Aid \nUNIT CODE: \nAGR321204 \n \nUNIT DESCRIPTOR : \nThis unit of competency deals with the provision of \nessential First Aid in recognising and responding to an \nemergency using basic life support measures. The First \nAider is not expected to deal with complex casualties or \nincidents, but to provide an initial response where First \nAid is required. In this unit it is assumed the First Aider \nis working under supervision and/or according to \nestablished workplace First Aid procedures and \npolicies. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated in the Range of Variables \n1. Assess the situation \n1.1 Physical hazards to own and others' health and \nsafety are identified \n1.2 Immediate risk to self and health and safety of the \ncasualty/OHS are minimised by controlling the \nhazard in accordance with OHS requirements \n1.3 Casualty's vital signs and physical condition are \nassessed in accordance with workplace procedures \n2. Apply basic First Aid \ntechniques \n2.1 First Aid management is provided in accordance \nwith established First Aid procedures \n2.2 Casualty is reassured in a caring and calm manner \nand made comfortable using available resources \n2.3 First Aid assistance is sought from others in a \ntimely manner and as appropriate \n2.4 Casualty's condition is monitored and responded \nto in accordance with effective First Aid principles \nand workplace procedures \n2.5 Details of casualty's physical condition, changes in \nconditions, management and response to \nmanagement are accurately recorded in line with \norganisational procedures \n2.6 Casualty management is finalised according to \ncasualty's needs and First Aid principles\n\n--- PDF PAGE 29 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n27\n \n3. Communicate details \nof the incident \n3.1 Appropriate medical assistance is requested using \nrelevant communication media and equipment \n3.2 Details of casualty's condition and management \nactivities are accurately conveyed to emergency \nservices/relieving personnel \n3.3 Reports to supervisors are prepared in a timely \nmanner, presenting all relevant facts according to \nestablished company procedures\n\n--- PDF PAGE 30 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n28\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Physical hazards \nmay include: \n1.1 \nWorkplace hazards \n1.2 \nEnvironmental hazards \n1.3 \nProximity of other people \n1.4 \nHazards associated with the casualty management \nprocesses \n2. Risks may include: \n2.1 \nWorksite equipment, machinery and substances \n2.2 \nEnvironmental risks \n2.3 \nBodily fluids \n2.4 \nRisk of further injury to the casualty \n2.5 \nRisks associated with the proximity of other workers \nand bystanders \n3. Vital signs include: \n3.1 \nBreathing \n3.2 \nCirculation \n3.3 \nConsciousness \n4. Established First Aid \nprinciples include: \n4.1 \nChecking the site for danger to self, casualty and others \nand minimising the danger \n4.2 \nChecking and maintaining the casualty’s airway, \nbreathing and circulation \n5. Casualty's condition \nis managed for: \n5.1 \nAbdominal injuries \n5.2 \nAllergic reactions \n5.3 \nBleeding \n5.4 \nBurns - thermal, chemical, friction, electrical \n5.5 \nCardiac conditions \n5.6 \nChemical contamination \n5.7 \nCold injuries \n5.8 \nCrush injuries \n5.9 \nDislocations \n5.10 Drowning \n5.11 Envenomation - snake, spider, insect and marine bites \n5.12 Environmental conditions such as hypothermia, \ndehydration, heat stroke \n5.13 Epilepsy, diabetes, asthma and other medical \nconditions \n5.14 Eye injuries \n5.15 Fractures \n5.16 Head injuries \n5.17 Minor skin injuries \n5.18 Neck and spinal injuries\n\n--- PDF PAGE 31 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n29\n5.19 Needle stick injuries \n5.20 Poisoning and toxic substances \n5.21 Respiratory management of asthma and/or choking \n5.22 Shock \n5.23 Smoke inhalation \n5.24 Soft tissue injuries including sprains, strains, \ndislocations \n5.25 Substance abuse - including drugs \n5.26 Unconsciousness including not breathing and no pulse \n6. First Aid \nmanagement will \nneed to account for: \n6.1 \nLocation and nature of the workplace \n6.2 \nEnvironmental conditions eg electricity, biological risks, \nweather, motor vehicle accidents \n6.3 \nLocation of emergency services personnel \n6.4 \nUse and availability of First Aid equipment and \nresources \n6.5 \nInfection control \n7. Medications may \ninclude: \n7.1 \nAsthma–aerosol bronchodilators casualty’s own or from \nFirst Aid kit in accordance with state and territory \nlegislation \n7.2 \nSevere allergic reactions–adrenaline–subject to \ncasualty’s own regime \n8. Resources and \nequipment are used \nappropriate to the \nrisk and may include: \n8.1 \nDefibrillation units \n8.2 \nPressure bandages \n8.3 \nThermometers \n8.4 \nFirst Aid kit \n8.5 \nEyewash \n8.6 \nThermal blankets \n8.7 \nPocket face masks \n8.8 \nRubber gloves \n8.9 \nDressing \n8.10 Spacer device \n8.11 Cervical collars \n9. Communication \nsystems may include \nbut are not be limited \nto: \n9.1 \nMobile phone \n9.2 \nSatellite phones \n9.3 \nHF/VHF radio \n9.4 \nFlags \n9.5 \nFlares \n9.6 \nTwo-way radio \n9.7 \nEmail \n9.8 \nElectronic equipment\n\n--- PDF PAGE 32 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n30\n \nEVIDENCE GUIDE \n1 Critical Aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nApplied Resuscitation \n1.2 \nDemonstrated First Aid casualty management \nprinciples assessing and minimising danger, \nmaintaining the casualty’s airway, breathing and \ncirculation \n1.3 \nPerformed safe manual handling of casualty \n1.4 \nConsidered the welfare of the casualty \n1.5 \nReported preparation \n1.6 \nCommunicated effectively \n1.7 \nAbility to interpret and use listed documents \nAssessment should confirm the knowledge of: \n1.8 \nBasic anatomy and physiology \n1.9 \nCompany standard operating procedures (sops) \n1.10 Dealing with confidentiality \n1.11 Knowledge of the First Aiders’ skills and \nlimitations \n1.12 OHS legislation and regulations \n1.13 How to gain access to and interpret material \nsafety data sheets (MSDS) \n2 Underpinning \nKnowledge and \nAttitudes \n2.1 \nBasic anatomy and physiology \n2.2 \nDuty of care \n2.3 \nResuscitation \n2.4 \nBleeding control \n2.5 \nCare of unconscious \n2.6 \nState and territory regulatory requirements \nrelating to currency of skill and knowledge \n2.7 \nDecision making \n2.8 \nInfection control \n2.9 \nLegal requirements \n2.10 Airway management \n2.11 Assertiveness skills \n2.12 Communication skills\n\n--- PDF PAGE 33 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n31\n \n3 Underpinning Skills \n3.1 \nResuscitation \n3.2 \nFirst Aid casualty management principles \nassessing and minimising danger, maintaining \nthe casualty’s airway, breathing and circulation \n3.3 \nSafe manual handling of casualty \n3.4 \nConsideration of the welfare of the casualty \n3.5 \nReport preparation \n3.6 \nCommunication skills \n3.7 \nAbility to interpret and use listed documents \n4. Resource Implication \n \n4.1 \nFirst Aid equipment and materials \n4.2 \nCommunication equipment appropriate to the \nworkplace \n4.3 \nWorkplace documentation \n4.4 \nEnterprise procedures \n5. Methods of \nAssessment \n5.1 \nCompetency should be assessed: \n5.2 \nThrough direct observation and oral interview. \n6. Context of \nAssessment \n6.1 \nCompetence may be demonstrated working \nindividually, under supervision or as part of a First \nAid team. \n6.2 \nWhere applicable, assessment should replicate \nworkplace conditions as far as possible. Where, \nfor reasons of safety, access to equipment and \nresources and space, assessment takes place \naway from the workplace, simulations should be \nused to represent workplace conditions as closely \nas possible. Consistency of performance should \nbe maintained over the required range of \nworkplace situations until renewal of competence \n/license is required by the industry/organisation.\n\n--- PDF PAGE 34 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n32\n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY: \nSupport horticultural crop work \nUNIT CODE: \nAGR611306 \n \nUNIT DESCRIPTOR : \nThis unit covers the skills and knowledge required to \nsupport horticultural production under supervision. It \nrequires the ability to prepare materials, tools and \nequipment for horticultural production work, undertake \nroutine production assistance work, handle materials \nand equipment, and clean up on completion of work. \nSupporting horticultural production work requires \nknowledge of safe work practices relating to basic crop \nhandling techniques including planting, maintaining, \npicking and packing, loading and unloading, and using \nassociated farm tools and equipment. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of \nVariables\n1 \nPrepare materials, \ntools and equipment \nfor horticultural \nproduction work \n1.1 \nThe required materials, tools and equipment \nare identified according to lists provided and/or \nsupervisor’s instructions. \n1.2 \nChecks are conducted on all materials, tools and \nequipment with insufficient or faulty items \nreported to the supervisor. \n1.3 \nTechniques used when loading and unloading \nmaterials demonstrate correct manual handling \nand minimise damage to the load and the \nvehicle. \n1.4 \nSuitable personal protective equipment (PPE) \nis selected and checked prior to use. \n1.5 \nWork support is provided according to OHS \nrequirements and according to workplace \ninformation. \n1.6 \nOHS hazards are identified and reported to the \nsupervisor.\n\n--- PDF PAGE 35 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n33\n2 \nUndertake \nhorticultural \nproduction work \nas directed \n2.1 \nInstructions and directions provided by supervisor \nare followed and clarification sought when \nnecessary. \n2.2 \nWork is undertaken in a safe and environmentally \nappropriate manner according to enterprise \nguidelines. \n2.3 \nInteractions with other staff and customers is \ncarried out in a positive and professional manner. \n2.4 \nEnterprise policy and procedures in relation to \nworkplace practices, handling and disposal of \nmaterials is observed. \n2.5 \nProblems or difficulties in completing work to \nrequired standards or timelines are reported to \nsupervisor. \n3 \nHandle materials \nand equipment \n3.1 \nWaste material produced during work is stored \nin a designated area according to supervisor’s \ninstructions. \n3.2 \nMaterials, equipment and machinery are handled \nand transported according to supervisor’s \ninstructions and enterprise guidelines. \n3.3 \nA clean and safe work site is maintained while \nworking. \n4 \nClean up on \ncompletion of work \n4.1 \nMaterials are returned to store or disposed of \naccording to supervisor’s instructions. \n4.2 \nTools and equipment are cleaned, maintained \nand stored according to manufacturers \nspecifications and supervisors instructions. \n4.3 \nWork outcomes are reported to the supervisor.\n\n--- PDF PAGE 36 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n34\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. horticultural \nproduction \n1.1. Crops may include fruit, vegetables, herbs, flowers, \nfoliage, bulbs, tubers, nuts, mushrooms, wild \nharvest plants and oils.\n2. horticultural crop work\n2.1 Assistance with all activities associated with \nhorticultural production such as land preparation, \nseeding/planting, maintaining, loading and \nunloading, harvesting/picking, sorting, and packing. \n2.2 Assisting with routine maintenance or cleaning of \nsheds and other buildings, fences, fixtures and \nfitting. \n3. instructions \n3.1 Instructions may include Standard Operating \nProcedures (SOPs), enterprise policy and \nprocedures, specifications, work notes, Material \nSafety Data Sheets (MSDSs), manufacturers \ninstructions, or verbal directions from manager or \nsupervisor. \n4. tools and equipment \n4.1 Tools and equipment may include knives, \nsecateurs, spades, forks, ladders, hoes, packing \nequipment, boxes, bins and buckets, hoses and \nhose fittings. \n5. workplace \ninformation \n5.1 Workplace information may include procedures for \ndisposing of waste materials, work instructions or \nverbal instructions from the supervisor. \n6. OHS hazards \n6.1 Hazards may include, solar radiation, dust, noise, \nair- and soil-borne micro-organisms, chemicals and \nhazardous substances, sharp hand tools and \nequipment, manual handling, holes, and slippery \nand uneven surfaces. \n7. Personal \nprotective clothing \nand equipment \n7.1 Personal protective clothing and equipment may \ninclude steel capped boots/shoes, overalls, gloves, \nsun hat, sunscreen lotion, safety goggles, face \nmask and ear protectors. \n8. Waste materials \n8.1 Plant debris, litter and broken components, plastic, \nmetal, paper-based materials. These may be \nrecycled, re-used, returned to the manufacturer or \ndisposed of according to enterprise work \nprocedures.\n\n--- PDF PAGE 37 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n35\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Demonstrated competence in supporting \nhorticultural production work which have been \ncarried out according to instructions and within the \nrequired timeliness. \n1.2. The skills and knowledge that are required to suppor\nhorticultural production work must be transferable to\ndifferent work environments. For example, this could\ninclude different tasks, crops and types of \norchards/plantations/farms.\n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply \nthis standard in the workplace, to transfer the skills to \nother contexts, and to deal with unplanned events. The \nknowledge requirements for this competency standard \nare listed below. \n2.1 safe work practices \n2.2 planting, picking, packing, loading and transporting \ntechniques appropriate to this level \n2.3 use of horticultural tools and equipment. \n3. Underpinning Skills \nTo achieve the performance criteria, appropriate literacy \nand numeracy levels as well as some complementary \nskills are required. These include the ability to: \n3.1 prepare materials, tools and equipment for work \n3.2 undertake work as directed \n3.3 handle materials and equipment \n3.4 clean up on completion of work. \n4. Resource Implication \n \nThe following resources should be provided: \n4.1 workplace with nursery facilities \n4.2 tools, equipment and materials required for nursery \noperations \n4.3 enterprise procedures. \n5. Methods of \nAssessment \nCompetency should be assessed: \n5.1 through direct observation /demonstration \n5.2 portfolio \n6. Context of \nAssessment \n 6.1 Assessment should be in a workplace. \n 6.2 Demonstration of competency over time and on a \nnumber of occasions.\n\n--- PDF PAGE 38 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n36\n \nUNIT OF COMPETENCY: \nSUPPORT NURSERY WORK \nUNIT CODE: \nAGR611307 \n \nUNIT DESCRIPTOR : This unit covers the skills and knowledge required to \ncarry out work in wholesale or retail nurseries while \nunder supervision. It requires the ability to prepare \nmaterials, tools and equipment for nursery work, \nundertake nursery work activities, store and stockpile \nmaterials, and clean up on completion of work. \nSupporting nursery work requires knowledge of safe \nwork practices, nursery hygiene and quality control, \nnursery plant maintenance activities, basic stock control \nprocedures, and propagation techniques. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of \nVariables\n1 \nPrepare materials, \ntools and equipment \nfor nursery work \n1.1 \nThe required materials, tools and equipment \nare identified according to lists provided and/or \nsupervisor’s instructions. \n1.2 \nChecks are conducted on all materials, tools \nand equipment, with insufficient or faulty items \nreported to the supervisor. \n1.3 \nTechniques used when loading and unloading \nmaterials demonstrate correct manual handling, \nand minimise damage to the load and the \nvehicle. \n1.4 \nSuitable personal protective equipment \n(PPE) is selected and checked prior to use. \n1.5 \nNursery support is provided according to OHS \nrequirements and workplace information. \n1.6 \nOHS hazards are identified and reported to the \nsupervisor.\n\n--- PDF PAGE 39 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n37\n2 \nUndertake nursery \nwork as directed \n2.1 \nInstructions and directions provided by \nsupervisor a