  "source_section_text": "SECTION 3 TRAINING STANDARDS \n \nThese guidelines are set to provide the Technical and Vocational Education \nand Training (TVET) providers with information and other important requirements to \nconsider when designing training programs for AGRICULTURAL CROPS \nPRODUCTION NC l. \n \n \n3.1 CURRICULUM DESIGN \n \nCourse Title: AGRICULTURAL CROPS PRODUCTION Level: NC I \n \nNominal Training Duration : 302 Hours \n \nCourse Description: \n \nThis course is designed to enhance the knowledge, desirable skills and attitudes \nof Agricultural Crops Production NC l in accordance with industry standards. It \ncovers Basic, Common and Core Competencies such as: \n \nBASIC COMPETENCIES \n \nUnit of Competency \nLearning Outcomes \nMethodology \nAssessment \nApproach\n1. Receive and \nrespond to \nworkplace \ncommunication \n1.1 Explain routinary speaking \n& messages in a workplace. \n1.2 Follow routinary speaking & \nmessage \n1.3 Perform work duties \nfollowing written notices. \nGroup \ndiscussion \nInteraction \n \nInterviews/ \nquestioning \nObservation \n2. Work with \nothers \n2.1 Develop effective \nworkplace relationship. \n2.2 Contribute to work group \nactivities. \nGroup \ndiscussion \nInteraction \n \nInterviews/ \nquestioning \nDemonstration \nObservation \n3. Demonstrate \nwork values \n \n \n3.1 Define the purpose of work \n3.2 Apply work values/ethics \n3.3 Deal with ethical problems \n3.4 Maintain integrity of \nconduct in the workplace\nGroup \ndiscussion \nInteraction \n \nDemonstration \nObservation \nInterviews/ \nquestioning\n\n--- PDF PAGE 54 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n52\n4.Practice \nhousekeeping \nprocedures \n4.1 Sort and remove \nunnecessary items \n4.2 Arrange items \n4.3 Maintain work areas, tools \nand equipment \n4.4 Follow standardize work \nprocess and procedures \n4.5 Perform work \nspontaneously\nGroup \ndiscussion \nInteraction \n \n \nDemonstration \nObservation \nInterviews/ \nquestioning \n \nCOMMON COMPETENCIES \n \nUnit of Competency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Apply safety \nmeasures \n1.1 Determine areas of concern \nfor safety measures \n1.2 Apply appropriate safety \nmeasures \n1.3 Safekeep and maintain \nmaterials, tools and \nequipment. \n1.4 Dispose waste materials and \noutfit\nSelf-paced/ \nmodular \nLecture \n/Discussion \nPractical \ndemonstration \nVisit/tour \nVisual aids \nOral/written \nexamination \nInterviews \nDirect \nobservation \nPractical \ndemonstration \n2. Use of farm \ntools and \nequipment \n2.1 Prepare and use farm tools \n2.2 Prepare and operate farm \nequipment \n2.3 Observe safety precautions in \nhandling farm tools and \nequipment. \n2.4 Carry out routine maintenance \nand storage of tools and \nequipment \nSelf-paced/ \nmodular \nLecture \n/Discussion \nPractical \ndemonstration \nVisit/tour \nVisual aids \nOral/written \nexamination \nInterviews \nDirect \nobservation \nPractical \ndemonstration \n3. Perform \nestimation and \nbasic \ncalculation \n3.1 Perform estimation activities \n3.2 Perform basic workplace \ncalculation \n3.3 Apply corrective measures as \nnecessary \nSelf-paced/ \nmodular \nLecture \n/Discussion \nPractical \ndemonstration \nInteraction \nPractical \nexercise \nVisual aids\nOral/written \nexamination \nInterviews \nDirect \nobservation \nPractical \ndemonstration \nPractical \nexercise\n\n--- PDF PAGE 55 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n53\n4. Apply basic \nfirst aid \n4.1 Assess casualty’s condition \n4.2 Safe handling of casualty \n4.2 Apply basic first aid \ntechniques \n4.3 Monitor casualty \n4.4 Record and report casualty’s \ncondition \n4.5 Communicate details of the \nincident \n4.6 Prepare report of work \noutcomes \nDemonstration \nDual training \nSelf-Paced \nLearning \nLecture \n \nInterview \nWritten \nPractical \nApplication \n(demo) \nDirect \nObservation \n \n \nCORE COMPETENCIES \n \n \nUnit of \nCompetency\nLearning Outcomes \nMethodology \nAssessment \nApproach\n1. Support \nhorticultural \ncrop work \n1.1 Prepare materials, tools and \nequipment \n1.2 Observe safety precautions in \nhorticultural operation \n1.3 Assist with preparing land for \nsowing/planting \n1.4 Assist in sowing/planting crop \n1.5 Assist in maintaining crop \n1.6 Assist in fertilizing crop \n1.7 Assist in loading and unloading \n1.8 Assist in harvesting/picking, \nsorting and packing \n1.9 Carry out routine maintenance \nand storage of materials, tools \nand equipment \n1.10 Carry out routine maintenance \nof workplace \n1.11 Prepare report of work \noutcomes\nDemonstration \nDual training \nIndividual Self-\npaced \nLearning \nLecture \n \nInterview \nWritten \nPractical \nApplication \n(Demo) \nDirect \nObservation\n\n--- PDF PAGE 56 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n54\n2. Support \nnursery work \n \n \n \n \n2.1 Prepare materials, tools and \nequipment \n2.2 Observe safety precautions in \nnursery operation \n2.3 Use materials, tools and \nequipment \n2.4 Assisting with the display of \nnursery products \n2.5 Load and unload nursery stock \n2.6 Provide nursery plant care \n2.7 Assist in propagation activities \n2.8 Carry out routine maintenance \nand storage of materials, tools \nand equipment \n2.9 Carry out routine maintenance \nof workplace \n2.10 Prepare report on work \noutcomes\nDemonstration \nDual training \nIndividual Self-\npaced \nLearning \nLecture \n \nInterview \nWritten \nPractical \nDirect \nObserva\ntion \n3. Support \nagronomic \ncrop work \n \n3.1 Prepare materials, tools and \nequipment \n3.2 Observe safety precautions in \nagronomic operation \n3.3 Assist with preparing land for \nsowing/planting \n3.4 Assist in sowing/planting crop \n3.5 Assist in maintaining crop \n3.6 Assist in fertilizing crop \n3.7 Assist in harvesting crop \n3.8 Carry out routine maintenance \nand storage of materials, tools \nand equipment \n3.9 Carry out routine maintenance \nof workplace \n3.10 Prepare report on work \noutcomes\nDemonstration \nDual training \nIndividual Self-\npaced \nlearning \nLecture \n \nWritten \nexamination \nDemonstration \nof practical \nskills \nDirect \nobservation \nInterview \nCheck \nworkplace \nrecord\n\n--- PDF PAGE 57 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n55\n4. Support \nirrigation \nwork \n \n \n \n \n4.1 Prepare materials, tools and \nequipment \n4.2 Observe safety precautions in \nirrigation operation \n4.3 Use materials, tools and \nequipment \n4.4 Assist in the installation of \nirrigation and/or drainage pipes \n4.5 Assist in the maintenance of \nirrigation and/or drainage \nsystems \n4.6 Interpret plans and manuals \n4.7 Assist in the maintenance of \nirrigation components and \nsystems. \n4.8 Carry out routine maintenance \nand storage of materials, tools \nand equipment \n4.9 Carry out routine maintenance \nof workplace \n4.10 Prepare report on work \noutcomes \nDemonstration \nDual training \nIndividual Self-\npaced \nLearning \nLecture \n \nWritten \nexamination \nDemonstration \nof practical \nskills \nDirect \nobservation \nInterview \n \n3.2. TRAINING DELIVERY \n \nThe delivery of training should adhere to the design of the curriculum. \nDelivery should be guided by the 10 basic principles of competency-based \nTVET. \n \n \n \n- The training is based on curriculum developed from the competency \nstandards; \n- Learning is modular in its structure; \n- Training delivery is individualized and self-paced; \n- Training is based on work that must be performed; \n- Training materials are directly related to the competency standards \nand the curriculum modules; \n- Assessment is based in the collection of evidence of the performance \nof work to the industry required standard; \n- Training is based both on and off-the-job components; \n- Allows for recognition of prior learning (RPL) or current \ncompetencies;\n\n--- PDF PAGE 58 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n56\n- Training allows for multiple entry and exit; and \n- Approved training programs are nationally accredited. \n \n \nThe competency-based TVET system recognizes various types of \ndelivery modes, both on and off-the-job as long as the learning is driven by \nthe competency standards specified by the industry. The following training \nmodalities may be adopted when designing training programs: \n \n- The dualized mode of training delivery is preferred and recommended. \nThus programs would contain both in-school and in-industry training \nor fieldwork components. Details can be referred to the Dual Training \nSystem (DTS) Implementing Rules and Regulations. \n- \nModular/self-paced learning is a competency-based training modality \nwherein the trainee is allowed to progress at his own pace. The \ntrainer facilitates the training delivery \n- \nPeer teaching/mentoring is a training modality wherein fast learners \nare given the opportunity to assist the slow learners. \n- \nSupervised industry training or on-the-job training is an approach in \ntraining designed to enhance the knowledge and skills of the trainee \nthrough actual experience in the workplace to acquire specific \ncompetencies prescribed in the training regulations. \n- \nDistance learning is a formal education process in which majority of \nthe instruction occurs when the students and instructor are not in the \nsame place. Distance learning may employ correspondence study, or \naudio, video or computer technologies. \n- \nProject-Based Instruction is an authentic instructional model or \nstrategy in which students plan, implement and evaluate projects that \nhave real world applications. \n \n \n 3.3. TRAINEE ENTRY REQUIREMENTS \n \nTrainees or students wishing to enroll in this course should possess \nthe following requirements. \n \n- \nAble to read and write; \n- \nWith good moral character; \n- \nAbility to communicate, both oral and written \n- \nPhysically fit and mentally healthy as certified by a Public Health \nOfficer\n\n--- PDF PAGE 59 ---\n_________________________________________________ \nTR – Agricultural Crops Production NC I \n \n57\n \n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS \n \n \nAGRICULTURAL CROPS PRODUCTION NC I \n \nRecommended list of tools, equipment and materials for the training of 25 \ntrainees for Agricultural Crops Production NC I \n \nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n25 pcs \nBolos \n2 \nBooth/temporary \nshed\n250 \npcs.\nAgri bags, plastic\n10 pcs \nBroomstick \n5 \nCart (Kariton & \nparagus)\n500 \npcs.\nBamboo stick \n5 pcs \nCalculator \n2 \nComb-tooth harrow \n5 pcs. \nBasket \n5 pcs \nContainer \n1 \nComputer \n5 rims \nBond paper \n5 sets \nCutting tools \n5 \nCrates \n5 pcs. \nCatching nets \n5 sets \nDigging tools \n1 \nDrying oven \n3 dozen\nClips \n2 pcs \nDrying meter \n1 \nFarm/ field \n5 sacks \nCoconut dust \n10 pcs \nDulos \n1 \nGreenhouse/nurser\ny\n5 sacks \nCompost \n5 pcs \nFruit crate \n1 \nHarvesting \nequipment\n1 sack \nFertilizers \n5 sets \nHarvesting tools \n1 \nIrrigation system \n(sprinkler, \nmist/drip \nirrigation)\n1 kit \nFirst aide \nsupplies/medi\ncine \n25 pcs \nHat \n1 \nMower (grass \ncutter)\n5 \nbottles \nFlower inducer \n5 pcs \nKnapsack sprayer \n1 \nOver head projector \n(OHP)\n5 \nbottles\nFungicides \n5 sets \nKnife \n1 \nPortable chain saw \n25 pairs\nGloves \n5 pcs \nLight hoe \n1 \nPost-Harvest \ntreatment \nequipment \n5 sacks \nGrowing media \n(garden soil, \nsewed sand, \ncompost, soil, \nmanure and \nsawdust/rice\n2 pcs \nMoisture meter \n1 \nPower sprayer \n5 pcs. \nKilling bottles \n2 pcs \nPetri-dish \n1 \nRotavator \n \n \n3 pcs \npH meter \n1 \nService vehicle \n5 pcs. \nMarking pens 