      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for AGRICULTURAL CROPS\nPRODUCTION NC l.\n\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AGRICULTURAL CROPS PRODUCTION Level: NC I\n\nNominal Training Duration : 302 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and attitudes\nof Agricultural Crops Production NC l in accordance with industry standards. It\ncovers Basic, Common and Core Competencies such as:\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary speaking\n& messages in a workplace.\n1.2 Follow routinary speaking &\nmessage\n1.3 Perform work duties\nfollowing written notices.\nGroup\ndiscussion\nInteraction\n\nInterviews/\nquestioning\nObservation\n2. Work with\nothers\n2.1 Develop effective\nworkplace relationship.\n2.2 Contribute to work group\nactivities.\nGroup\ndiscussion\nInteraction\n\nInterviews/\nquestioning\nDemonstration\nObservation\n3. Demonstrate\nwork values\n\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of\nconduct in the workplace\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 54 ---\n_________________________________________________\nTR – Agricultural Crops Production NC I\n\n52\n4.Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\nunnecessary items\n4.2 Arrange items\n4.3 Maintain work areas, tools\nand equipment\n4.4 Follow standardize work\nprocess and procedures\n4.5 Perform work\nspontaneously\nGroup\ndiscussion\nInteraction\n\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\nCOMMON COMPETENCIES\n\nUnit of Competency\