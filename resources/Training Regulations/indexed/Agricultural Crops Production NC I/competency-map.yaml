  "source_text": "COMPETENCY MAP FOR AGRI-FISHERY SECTOR \n \nAGRICULTURAL CROPS PRODUCTION SUB-SECTOR \n \nCORE UNITS OF COMPETENCY\nSupervise agronomic crop \nmaintenance \n \nProduce fruit bearing crops \n \nMonitor and operate water \ntreatment processes \n \nImplement vertebrate pest \ncontrol program \n \nCoordinate horticultural crop \nharvesting \nMaintain the workplace \n \n \nPerform post harvest \noperations of major tropical \nfruits\n \nImplement a plant establishment \nprogram \n \nEstablish agronomic crops \n \nTransport, handle and store \nchemicals \n \n \n \n \n \n \n \n \n \nSupport agronomic crop \nwork \n \n \nPerform post harvest \noperation of major lowland \nand semi-temperate \nvegetable crops\n \nControl weeds \n \nCollect samples for a rural \nproduction of horticulture \nmonitoring program \n \nSupervise agricultural crop \nestablishment \n \nSupport horticultural crop \nwork \n \nUndertake preparation of \nland for agricultural crop \nproduction \n \nUndertake agronomic crop \nharvesting activities \n \nSave, prepare and store \nagricultural seed \n \nImplement and monitor \nquality assurance \nprocedures \nSupport irrigation \n work \n \nOperate pertigation \nequipment \n \nKeep records for a farm business \n \nImplement a propagation plan \n \nSupport and review business \nstructures and relationships \nSupport nursery \n work \n \nImplement a plant nutrition \nprogram \n \nEstablish horticultural crops \n \nCoordinate machinery and \nequipment maintenance and \nrepair for agricultural crops \n \nPromote plant health \n \n \n \n \n \n \n \n \n \nConduct pre-horticultural \nfarm operations \n \nCoordinate a horticultural \nmaintenance program \n \nComply with industry quality \nassurance requirements \n \nPrepare and apply chemicals \n \nImplement and monitor a \nproperty improvement plan \n \n \n \n \n \n \n \n \n \nProduce vegetables \n \nUndertake agronomic crop \nmaintenance activities\n \nTransport farm produce or bulk \nmaterials\