  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of HEAVY EQUIPMENT OPERATION\n(Articulated Off-Highway Dump Truck] NC II, the candidate must\ndemonstrate competence in all the units of competency in Section 1. The\nsuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The qualification of HEAVY EQUIPMENT OPERATION (Articulated Off-\nHighway Dump Truck) NC II maybe attained through demonstration of\ncompetence in a project-type assessment covering the following core units.\n\n4.2.1\nARTICULATED OFF-HIGHWAY DUMP TRUCK\n\n Perform pre- and post-operation procedure for hauling\nequipment\n Perform productive operation for off-highway dump truck\n(articulated)\n Perform basic preventive maintenance servicing for hauling\nequipment\n\n4.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\"\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION\n\n"
