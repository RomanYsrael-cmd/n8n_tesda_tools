        "source_title": "PERFORM PRODUCTIVE OPERATION FOR OFF- HIGHWAY DUMP TRUCK [ARTICULATED]",
        "source_text": "--- PDF PAGE 55 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n \nUNIT TITLE: \nPERFORM PRODUCTIVE OPERATION FOR OFF-\nHIGHWAY DUMP TRUCK [ARTICULATED] \nUNIT CODE:\nCON833320\nUNIT DESCRIPTOR: \nThis unit deals with the knowledge, skills and attitude \nrequired for performing productive operation for off-\nhighway dump truck [articulated]. It covers the skills \nrequired to perform loading, handling and dumping \noperations of earth materials. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the  \nRange of Variables \n1. Perform loading operations \n \n \n1.1 Safe work practices are observed in  \n        accordance with company rules and \nregulations. \n1.2 Communication is established with the \nloading operator during operation. \n1.3 Dump truck is positioned at the loading area \nfollowing safe work procedures. \n1.4 Required control levers are applied according \nto operation's manual \n1.5   Engine is set at low idle speed during waiting / \nloading operation.  \n1.6 Allowable load capacity of truck is observed as \nper manufacturer’s specifications.  \n1.7 Unexpected situations are responded in line  \n        with company rules and regulations. \n2. Perform hauling operations \n2.1 Site hazards and appropriate safe operating \ntechniques are identified according to safe \noperating practices. \n2.2 Safety precautions are observed based on \nroad conditions.  \n2.3 Required travel speed is observed according to \nwork site and load conditions. \n2.4 Power Take-Off is disengaged during \noperations. \n2.5 Unexpected situations are responded in line \nwith company rules and regulations.\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n \n3. Perform dumping operations \n3.1 Communication is maintained with the \nappropriate personnel during dumping \noperation. \n3.2 Dumping procedure is performed following \nsafe work procedures.  \n3.3 Unexpected situations are responded in line \nwith company rules and regulations.\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Safe work \npractices \n1.1 Wear minimum PPE  \n1.2 Observed firm and flat ground for the loading and dumping area \n1.3 Checked for proper illumination of work site \n1.4 Observed 3-point contact in embarking on and alighting from \nequipment \n1.5 All controls must be in neutral position and parking brake \napplied during loading / dumping operation  \n1.6 Observed proper housekeeping \n2. Communication \n2.1 Hand signal \n2.2 Radio \n2.3 Horn/Light signal \n3. Loading \noperator \n3.1 Wheel loader operator \n3.2 Excavator /shovel operator \n3.3 Clampshell/dragline operator \n3.4 Conveyor operator \n4. Safe work \nprocedures  \n4.1 Loading \n        4.1.1 Tractor head is aligned with the dump body  \n        4.1.2 Park brake is engaged \n        4.1.3 Gear shift lever is in neutral / parked position \n4.2 Dumping \n        4.2.1 Tractor head is aligned with the dump body  \n        4.2.2 Park brake is applied \n        4.2.3 Gear shift lever is in neutral / parked position  \n5. Control levers \n5.1 Parking brake \ngear shift \n6. Unexpected     \nsituations \nMay include but are not limited to: \n6.1 Sudden engine breakdown  \n6.2 Busted hydraulic hose and oil leakages \n6.3 Sudden loss of brake  \n6.4 Loss control of steering \n6.5 Sudden ground failure \n6.6 Force majeure e.g., earthquake, fire, tornado \n6.7 Operator fatigue or sickness/condition \n6.8 Accidents/incidents\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n7. Site hazards \nMay include but are not limited to: \n7.1 Landslides \n7.2 Flood / Heavy rains \n7.3 Excavations \n7.4 Darkness or poor visibility \n7.5 Uneven/unstable terrain \n7.6 Road obstructions \n8. Safety \nprecautions \n8.1 Retarder brake \n8.2 Differential lock  \n9. Road conditions \n9.1 Downhill \n9.2 Uphill \n9.3 Muddy \n9.4 Slippery \n9.5 Narrow \n9.6 Curve \n10. Appropriate \npersonnel \n10.1 Spotter \n10.2 Site foreman \n10.3 Site superintendent \n11. Dumping \nprocedure \n11.1 Power take-off is engaged \n11.2 Control lever is applied prior to dumping \n11.3 Dump box is raised in smooth and controlled engine RPM \n11.4 Dump body is lowered to normal position before traveling\n\n--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency to \nbe considered  \nAssessment must confirm evidence that the candidate:  \n1.1 Demonstrates ability to comply with company rules and \nregulations \n1.2 Demonstrates ability to operate dump truck in accordance with \nestablished operating procedures. \n1.3 Demonstrates ability to carry out safe work practices.  \n1.4 Demonstrated knowledge of functions of instrument panel \ngauges, controls and alert indicators. \n1.5 Demonstrates ability to observe allowable load capacity of off-\nhighway dump truck (articulated). \n1.6 Demonstrates ability to observe safe and efficient loading / \nhauling / dumping procedures from loading area to dumping \nsite \n1.7 Demonstrates ability to communicate. \n2. Underpinning \nknowledge, \nattitudes  \n \n2.1 Familiarity with company rules and regulations \n2.2 Knowledge of dump truck operating procedures \n2.3 Safe work procedures and practices   \n2.4 Dump truck functions of instrument panel gauges, controls, \nalert/warning indicators and their uses. \n2.5 Comprehension of dump truck operations and maintenance \nmanual. \n2.6 Knowledge of allowable load capacity of dump truck  \n2.7 Safe and efficient loading/hauling/dumping procedures \n2.8 Defensive-driving and hazard-avoidance techniques \n2.9 Site/Terrain layout and obstacles \n2.10 Quality of materials to be loaded \n2.11 Positive work values (time and cost conscious, etc.) \n3. Underpinning \nskills \n3.1 Accomplishing dump truck checklist and reports \n3.2 Reporting dump truck component failure  \n3.3 Performing actual operation procedure of dump truck  \n3.4 Performing safety procedures and practices \n3.5 Determining type and load capacity of dump truck \n3.6 Defensive driving skills \n4.  Resource \nimplications \nThings necessary for the conduct of assessment \n4.1 Access to dump truck and job site/terrain \n4.2 Available loads \n4.3 PPE \n4.4 Spotter\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n \n5.  Method of \nassessment \nCompetency in this unit must be assessed through  \n5.1 Written/Oral questioning \n5.2 Observation/ practical demonstration \n5.3 Work record and documents \n6.  Context for \nassessment \n6.1 Assessment maybe conducted in the work site or in a simulated \nvenue. \n6.2 Competency shall be assessed while work is being undertaken \nindependently.\n",
