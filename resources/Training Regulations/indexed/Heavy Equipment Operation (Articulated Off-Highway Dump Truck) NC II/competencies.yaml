        "source_title": "PERFORM PRE- AND POST-OPERATION PROCEDURES FOR HAULING EQUIPMENT",
        "source_text": "--- PDF PAGE 38 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \nCORE COMPETENCIES \n \nUNIT TITLE: \nPERFORM PRE- AND POST-OPERATION \nPROCEDURES FOR HAULING EQUIPMENT \nUNIT CODE:\nCON833316\nUNIT DESCRIPTOR: \nThis unit deals with the outcomes required to \nperform pre- and post operation procedures for off-\nhighway dump truck (rigid).\n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the  \nRange of Variables \n1. Perform visual check of \nequipment \n \n \n \n \n \n \n1.1 Hauling equipment is selected based on job \nrequirements. \n1.2 Operator serviceable (OS) parts are checked \nin accordance with equipment checklist and \nmanufacturer’s procedures. \n1.3 Walk-around check is performed with \nequipment checklist and with engine \nstopped/not running. \n2. Perform “B L O W A F”  check \n \n \n \n \n \n \n2.1 “BLOWAF” check is performed following \nchecklist form and with engine stopped/not \nrunning. \n2.2 Deficiencies in fluids level are identified and if \nbelow normal level are refilled/topped up in \naccordance with equipment maintenance \nmanual. \n2.3 Abnormal conditions are reflected/noted in the \nchecklist and reported/referred to authorized \nperson. \n3. Perform operation check \n \n \n \n \n \n3.1 Starting/running check is performed following \nchecklist and in accordance with \nmanufacturer’s recommendations. \n3.2 Normal functions of brake, steering and Power \nTake-off (PTO), etc. are checked. \n3.3 Walk-around check is performed following \nequipment checklist and with engine running. \n3.4 Safety devices are checked for proper \nfunctions in accordance with safe operating \nprocedures.\n\n--- PDF PAGE 39 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n \n4. Perform post operation \nprocedure  \n4.1 Hauling equipment is parked in firm and level \nground after productive operation in \naccordance with safety company rules and \nregulations. \n4.2 Equipment controls are set into neutral position \nand parking brakes are engaged according to \nmanufacturer’s operations manual. \n4.3 Safety locks and brakes are all set/engaged in \naccordance with operator’s manual. \n4.4 Walk-around inspection check is conducted \nwhile doing engine cool down. \n4.5 Daily equipment time report/record (DETR) is \naccomplished/submitted according to company \nrules and regulations\n\n--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Hauling  \n1.1 Off-highway dump truck (rigid) \n1.2 Off-highway dump truck (articulated)  \n1.3 On-highway dump truck (rigid) \n2. Operator \nserviceable \nparts \n \n \n \n \n2.1 Air cleaner \n2.2 Battery terminals/Connection \n2.3 Belt \n2.4 Tire inflation \n2.5 Grease/Lube points \n2.6 Water/Fuel separator \n2.7 Wiper blade \n3. Walk around \ncheck  \n \n \n \n \n \n3.1 Engine off \n          3.1.1Leaks  \n          3.1.2 Worn out/damaged parts  \n          3.1.3 Fluid levels \n          3.1.4 Loose and missing parts \n          3.1.5 Tire condition \n                     3.1.5.1 Cracked/Thread separation \n                     3.1.5.2 Air pressure \n                     3.1.5.3 Thread wear \n                     3.1.5.4 Imbedded materials \n                     3.1.5.5 Damaged rim \n           3.1.6 Side mirrors \n           3.1.7 Cab condition and windshields \n           3.1.8 Wiper bottle \n \n           Off-highway dump truck (articulated) \n           3.1.9 Pins   \n  \n3.2 Engine on \n           3.2.1 Gauges, alert/warning indicators and controls \n           3.2.2 Oil and air leaks \n           3.2.3 Safety devices \n           3.2.4 Working implement function e.g. dump, steering,  \n                    etc  \n4. B L O W A F \ncheck \n \n \n \n \n4.1 Battery (starting and charging system) \n4.2 Light (lighting system) \n4.3 Oil (lubricating system) \n4.4 Water (cooling system) \n4.5 Air (intake and exhaust system) \n4.6 Fuel (fuel system)\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n5. Fluid levels \n \n \n \n \n \n5.1 Battery electrolyte (maintenance type) \n5.2 Engine oil \n5.3 Hydraulic oil \n5.4 Radiator coolant \n5.5 Fuel  \n5.6 Wiper fluid \n \nOn-highway dump truck (rigid) \n5.7 Brake fluid \n5.8 Steering oil \n5.9 Transmission \n6. Authorized \nperson \n6.1 Equipment maintenance supervisor \n6.2 Maintenance personnel \n \nOff-highway dump truck (rigid) and on-highway dump truck \n(rigid) \n6.3 Chief Mechanic  \n \nOff-highway dump truck (articulated) \n6.4 Hauling operation supervisor\n\n--- PDF PAGE 42 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n7. Starting/Running \ncheck \n \n \n \n \n \n7.1 Controls  \n            7.1.1 PTO   \n            7.1.2 Steering/Secondary  \n            7.1.3 Shifting  \n            7.1.4 Dump lever \n            7.1.5 Accelerator pedal \n            7.1.6 Brake \n                      7.1.6.1 Service \n                      7.1.6.2 Retarder \n                      7.1.6.3 Secondary/Emergency \n                      7.1.6.4 Parking \n                       \n                      On-highway dump truck  \n                      7.1.6.5 Anti-lock brake system \n    \n            Off-highway dump truck (rigid) and Off-highway dump    \n            truck (articulated) \n            7.1.7 Transmission control \n            7.1.8 Retarder lever          \n \n            On-highway dump truck (rigid)  \n            7.1.9 Differential / inter-axle lock \n \n7.2 Gauges  \n            7.2.1 Battery charging  \n            7.2.2 Pressure (oil and air) \n            7.2.3 Temperature (oil and water) \n            7.2.4 RPM (tachometer) \n            7.2.5 Speedometer \n             \n     