        "source_text": "--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n \nUNIT TITLE: \nPERFORM BASIC PREVENTIVE MAINTENANCE \nSERVICING FOR HAULING EQUIPMENT \nUNIT CODE:\nCON833317\nUNIT DESCRIPTOR: \nThis unit deals with the knowledge, skills and \nattitudes in the routine basic preventive maintenance \nfor hauling equipment.\n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the  \nRange of Variables \n1. Perform adjustments/ \nreplacements \n \n1.1 Minor defects are identified and remedied in \naccordance with company/manufacturer’s \nprocedures. \n1.2 Correct/proper tools are selected based on job \nrequirements. \n1.3   Major defects are identified with checklist and \nreferred to appropriate personnel. \n \n2. Perform basic preventive \nmaintenance servicing (PMS)  \n \n \n \n \n2.1 Operator serviceable (OS) parts/standards \nare identified and serviced according to \nmanufacturer’s specifications and company \npreventive maintenance operating procedures.  \n2.2 Fluids and lubricants are used based on \noperation’s manual. \n2.3 Appropriate basic hand tools and equipment \nare identified and used in accordance with job \nrequirements. \n2.4 Basic preventive maintenance servicing \n(PMS) is carried out in accordance with \nmanufacturer’s and/or site conditions/ \nrequirements. \n3. Prepare equipment reports \n \n \n \n \n3.1 Preventive maintenance checklist form is \nproperly accomplished in accordance with \nmanufacturer’s/company requirements. \n3.2 Minor/major equipment defects are reported to \nconcerned personnel.\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Minor defects  \n \n \nMay include but not limited to: \n1.1 Clogged air cleaner \n1.2 Loose clamps, bolts and mountings \n1.3 Presence of water in the fuel separator \n1.4 Weak battery  \n1.5 Defective radiator cap \n \nOn-highway dump truck (rigid) \n1.6 Incorrect tire inflation \n1.7 Loose belts \n2. Major defects \n \n \n \n \n \nMay include but not limited to: \n2.1 Incorrect tire inflation / busted/flat tire \n2.2 Excessive engine oil/fuel/water/fluid consumption \n2.3 Poor working implement performance  \n2.4 Poor engine performance (e.g. lack of engine power, hard  \n      starting engine)    \n2.5 Weak/Defective brakes \n2.6 Defective electrical components \n         2.6.1 Charging \n         2.6.2 Lighting \n         2.6.3 Starting \n         2.6.4 Monitoring/gauges \n2.7 Leakage on  \n          \n         Off-highway dump truck and Off-highway dump truck  \n         (rigid)  \n          2.7.1 Air  \n          2.7.2 Fuel  \n          2.7.3 Cooling  \n          2.7.4 Hydraulic  \n \n          On-highway dump truck (rigid)  \n          2.7.5 Gas\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n3. Appropriate \npersonnel \n \n \n3.1 Equipment maintenance supervisor \n3.2 Maintenance personnel \n \nOff-highway dump truck (articulated) and On-highway dump \ntruck (rigid) \n3.3 Hauling operation supervisor  \n \nOff-highway dump truck (rigid) \n3.4 Chief mechanic\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n \n4. Operator- \nServiceable \n(OS) \nparts/standards \n \n \n \n \n \nMay include but are not limited to: \n4.1 OS Parts \n        4.1.1 Battery distilled water   \n        4.1.2 Battery clamps/holders \n        4.1.3 Filters \n                  4.1.3.1 Air cleaner \n                  4.1.3.1 Water fuel separator \n        4.1.4 All caps (e.g. oil, water, fluid and fuel) \n \nOff-highway dump truck (rigid) and Off-highway dump truck \n(articulated) \n4.2 OS Standards \n        4.2.1 Oil pressure \n        4.2.2 Air pressure \n        4.2.3 Temperature \n        4.2.4 Fuel  \n        4.2.5 Charging rate \n        4.2.6 End/free play clearances (brake, accelerator pedal  \n                 and control levers) \n6. Fluids and \nLubricants \nMay include but are not limited to: \n6.1 Engine oil \n6.2 Hydraulic oil \n6.3 Multi purpose grease \n6.4 Coolant \n6.5 Battery distilled water \n6.6 Washer fluids \n \nOff-highway dump truck (articulated) and On-highway dump \ntruck (rigid) \n6.7 Cleaning solutions \n           6.6.1 Detergent soap \n           6.6.2 Degreaser \n \nOn-highway dump truck (rigid)  \n6.8 Brake and fluid\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n7. Basic hand tools \nand equipment \nMay include but are not limited to: \n7.1 Hand tools \n         7.1.1 Wrenches (open and box) \n         7.1.2 Mechanical pliers \n         7.1.3 Screw driver (Philips and flat) \n         7.1.4 Paint brush \n         7.1.5 Hammer  \n         7.1.6 Vice grip \n         7.1.7 Tire gauge (instrument) \n         7.1.8 Steel brush  \n \n         Off-highway dump truck (articulated) and On-highway  \n         dump truck (rigid) \n         7.1.9 Grease gun \n         7.1.10 Oiler \n \n         On-highway dump truck (rigid)  \n         7.1.11 Pry bar \n \n7.2 Equipment \n         7.2.1 High pressure washer \n         7.2.2 Air compressor \n         7.2.3 Grease gun \n         7.2.4 Hydraulic jack \n         7.2.5 Lube pump \n8. Basic preventive \nmaintenance \nservicing (PMS) \nMay include but not limited to: \n8.1 Check/Tighten battery clamps/holders \n8.2 Clean filters  \n         8.2.1 Air cleaner \n         8.2.2 Fuel/Water separator \n8.3 Check/Replace defective caps  \n8.4 Belt tension adjustment \n8.5 Tire inflation pressure\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n9. Site conditions/ \nRequirements \nMay include but are not limited to: \n9.1 Instructions/Site lay-out/Regulations \n9.2 Warning Signages/barricades (e.g. caution tape) \n9.3 Work and maintenance schedules \n9.4 Work bulletin boards \n9.5 Vicinity/Rerouting chart  \n9.6 Environmental/Site conditions \n          9.6.1 Dusty  \n          9.6.2 Toxic/hazardous fumes  \n          9.6.3 Rainy/Windy \n          9.6.4 Muddy/slippery ground \n          9.6.5 Poor lighting and ventilation \n          9.6.6 Site obstruction\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \nEVIDENCE GUIDE \n1. Critical aspects \nof evidence to \nbe considered \n \nAssessment requires evidence that the candidate: \n1.1   Demonstrates ability to identify minor defects based on  \nchecklist and service them in accordance with \nmanufacturer/company preventive maintenance \nprogram/procedure \n1.2   Demonstrates ability to identify major defects based on \nchecklist and report them to appropriate personnel \n1.3   Demonstrates ability to use basic hand tools and \nequipment \n1.4   Demonstrates ability to identify and service OS \nparts/standards according to manufacturer’s service \nmanual \n1.5   Demonstrates knowledge of applicable fluids and  \n        lubricants \n1.6   Demonstrates ability to carry-out preventive maintenance \nservicing procedure based on job site \ncondition/requirement \n1.7   Demonstrates ability to accomplish and submit preventive \nmaintenance checklist form  \n1.8   Demonstrates ability to use personal protective equipment \n(PPE) \n2. Underpinning \n(related) \nknowledge and \nattitude \n \n \n2.1  Knowledge of equipment minor and major defects \n2.2  Servicing procedure for minor defects \n2.3  Types and uses of basic hand tools and equipment \n2.4  Knowledge of fluids and lubricants \n2.5  Uses and functions of OS parts  \n2.6  Company rules and regulations \n2.7  Types and uses of PPE \n2.8  Operation and maintenance manual \n2.9  Positive work values (time and cost conscious, etc.) \n3. Underpinning \nskills \n \n3.1  Identifying minor and major defects \n3.2  Performing servicing procedure for minor defects \n3.3  Using basic hand tools and equipment \n3.4  Identifying and servicing OS parts/standards \n3.5  Using fluids and lubricants \n3.6 Carrying out basic preventive maintenance servicing \nprocedures and  accomplishing checklists \n3.7  Complying company rules and regulations \n3.8  Using personal protective equipment (PPE) \n3.9  Interpreting operation and maintenance manual\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT OPERATION                                                                       \n \n4. Resource \nimplications \n \nThings necessary for the conduct of assessment  \n4.1   Access to hauling equipment and its corresponding manual \n4.2   Work site  \n4.3   Basic hand tools and equipment \n4.4   Fluids and lubricants \n4.5   PPE \n4.6   Preventive maintenance instruction manual/ checklist forms\n5. Method of \nassessment \n \nCompetency in this unit must be assessed through  \n5.1 Written and/or oral questioning \n5.2 Observation /demonstration \n5.3 Work record and documents \n5.4 Third party \n6. Context for \nassessment \n \n6.1 Competency shall be assessed in a normal or simulated       \nworkplace environment and in accordance with preventive \nmaintenance procedures \n6.2 Competency shall be assessed while work is being \nundertaken independently\n",
