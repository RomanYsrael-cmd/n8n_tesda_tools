  "source_text": "Definition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Off-highway dump Truck\n[articulated]\nRefers to articulated frame type of dump truck used for\nloading and hauling different types of earth materials e.g.,\nrocks, limestones, coal, etc.\n2. Retarder brake\nRefers to the control of speed to maintain safe downhill\noperation.\n3. Service brake\nRefers to the control of speed to slowdown, and stopping\nof dump truck.\n4. Dump box\nRefers to body structure where the loads are placed and\ncarried.\n5. Steering\nRefers to the mechanism that controls the dump truck\ndirection.\n6. Hauling\nRefers to the transfer of earth materials from loading area\nto dumping site.\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION"
