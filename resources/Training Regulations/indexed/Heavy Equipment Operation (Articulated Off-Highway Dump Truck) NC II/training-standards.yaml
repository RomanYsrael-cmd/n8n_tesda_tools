re not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated.\n\n• Can drive and holder of Professional Drivers license\n\n• Can communicate both oral and written (English or Tagalog)\n\n• Physically and mentally fit\n\n• Can perform basic mathematical computation.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of off-highway dump truck (articulated).\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\n• Standard\nmechanical hand\ntools\n2\nunits\n• Off Highway\nDump Truck\n(Articulated)\n25 kls.\n• Grease\n2 pcs.\n• Grease gun\n1 unit\n• Water pressure\nwasher\n1600\nliters\n• Diesel oil\n25 pcs.\n•\nMask\n1 unit\n•\nWheel loader\n25 kls\n•\nWaste rags\n25 pairs\n•\nGoggles\n1 unit\n•\nAir compressor\n40 liters\n•\nHydraulic oil\n25 pcs.\n•\nSafety helmet\n\n10 liters\n•Distilled water\n2 unit\n•\nFire extinguisher\n\n25 pcs.\n•\nSafety vest\n\n2 pcs.\n•\nHand pump\n\n2 pcs.\n•\nVoltmeter pump\n\n*Quantity will depend on actual training consumption\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.5\nTRAINING FACILITIES\n\nThe off-highway dump truck (articulated) operation workshop must be of\nconcrete structure. Based on class size of 25 students/trainees the space\nrequirements for the teaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL\nAREA IN\nSQ.\nMETERS\n•\nLecture area\n8.0 x 6.0 meters\n48M2\n1\n48M2\n•\nLearning resource area\n4.0 x 6.0 meters\n24M2\n1\n24M2\n•\nTool room / Storage area\n3.0 x 3.0 meters\n9M2\n1\n9M2\n• Wash, toilet and locker\nroom\n8.0 x 4.0 meters\n32M2\n1\n32M2\nTOTAL\n-\n-\n113M2\nFacilities / Equipment /\nCirculation*\n-\n\n5,000M2\nTOTAL AREA\n5,113M2\nArea requirement is equivalent to 30 percent of total teaching / learning areas\n*Training area (practice) (MOA)\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION\n\n 3.6 TRAINERS’ QUALIFICATION\n\nHEAVY EQUIPMENT OPERATION (ARTICULATED OFF-HIGHWAY\nDUMPTRUCK)\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Heavy Equipment Operation (Articulated\noff-highway dump truck) NC-II\n• Must have undergone training on Training Methodology III (TM III)\nor its equivalent\n• Must be physically and mentally fit\n• Must have at least 5 years job/industry experience*\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION"
