      "definition": "Is the application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace."
    },
    {
      "term": "Certification",
      "definition": "Refers to the process of verifying and validating competencies of a person through assessment."
    },
    {
      "term": "Element",
      "definition": "Refers to the building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in a particular area of work is able to perform."
    },
