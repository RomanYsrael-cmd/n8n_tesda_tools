  "source_section_text": "SECTION 3\nTRAINING STANDARDS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for STRUCTURAL ERECTION NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: STRUCTURAL ERECTION\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n24 Hours (Common)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude in\nstructural erection in accordance with industry standards. It covers the basic,\ncommon and core competencies required for structural erector to demonstrate.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional\ngrowth and development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 60 ---\nSTRUCTURAL ERECTION NC II 59\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 61 ---\nSTRUCTURAL ERECTION NC II 60\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials\n1.2 Request materials\n1.3 Receive and\ninspect materials\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n• Direct observation\n• Written / Oral Test\n• Demonstration\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions\n2.1 Identify and access\nspecification /\nmanuals\n2.2 Apply information in\nmanual\n2.3 Store manual\n• Audio Visual\n• Simulation\n• Discussion practical\nlaboratory\n\n• Direct observation\n• Written test or\nexamination\n• Third party report\n• Demonstration\n3. Interpret\ntechnical\ndrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Store tools and\nequipment\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n• Direct observation\nof application of\ntasks.\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n•Demonstration\n\n--- PDF PAGE 62 ---\nSTRUCTURAL ERECTION NC II 61\nCORE COMPETENCIES\n(120 hours)\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Position\nstructural\nmembers\n1.1 Plan and prepare\nfor work\n1.2 Prepare hand\ntools and\nmaterials\n1.3 Move hoisted\nstructural\nmembers into\ndesignated\nposition\n• Discussion /\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation /\ndemonstration with\nquestioning\n• Written /\nexamination\n\n2. Fit-up\nstructural\nmembers\n2.1 Plan and prepare\nfor work\n2.2 Fit-up structural\nmembers\n\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation/\ndemonstration with\nquestioning\n• Written /\nexamination\n\n3. Perform tack\nwelding\n3.1 Prepare welding\ntools and materials\n3.2 Set-up welding\nequipment\n3.3 Perform tack\nwelding\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation/\nDemonstration with\nquestioning\n• Written /\nExamination\n\n--- PDF PAGE 63 ---\nSTRUCTURAL ERECTION NC II 62\n\nELECTIVE COMPETENCIES\n(32 hours)\n\nUnit of\nCompetency\n\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Layout\nstructural\nmembers\n1.1 Plan and\nprepare for work\n1.2 Layout structural\nmembers\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n2. Build low\nspots or\nremove high\nspots\n2.1 Plan and\nprepare for work\n2.2 Build low spots\nor remove high\nspots\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n--- PDF PAGE 64 ---\nSTRUCTURAL ERECTION NC II 63\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery shall be guided by the 10 basic principles of competency-based TVET:\n\n•\nThe training is based on curriculum developed from the\ncompetency standards;\n\n•\nLearning is modular in its structure;\n\n•\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\n•\nTraining is based on work that must be performed;\n\n•\nTraining materials are directly related to the competency\nstandards and the curriculum modules;\n\n•\nAssessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n\n•\nTraining is based both on and off-the-job components;\n\n•\nTraining program allows for recognition of prior learning\n\n(RPL) or current competencies;\n\n•\nTraining allows for multiple entry and exit; and\n\n•\nTraining programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n\n•\nModular/self-paced is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ntrainer facilitates the training delivery.\n\n--- PDF PAGE 65 ---\nSTRUCTURAL ERECTION NC II 64\n•\nPeer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n\n•\nSupervised Industry Training or On-the-Job Training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace to\nacquire specific competencies prescribed in the training\nregulations.\n\n•\nDistance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin\nthe\nsame\nplace.\n\nDistance\nlearning\nmay\nemploy\ncorrespondence study, or audio, video or computer technologies.\n\n•\nProject-based instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n•\nCan communicate both oral and written\n•\nCan perform basic mathematical computation\n•\nGood moral character; and\n•\nPhysically and mentally fit\n\nThe list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 66 ---\nSTRUCTURAL ERECTION NC II 65\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR\n STRUCTURAL ERECTION NC II\n\nBelow is the recommended list of tools, equipment and materials for the\ntraining of 25 trainees for STRUCTURAL ERECTION NC II.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n5 pcs.\nSledge hammer,\n1unit Arc Welding\nmachine\n1 box\nSoapstone\n5 pcs.\nBall peen hammer,\n16 oz.\n1 unit\nElectric drill\n2\nboxes.\nCut-off disc\n5 pcs.\nCenter punch\n5\nunits\nPortable grinder\n2 boxes Grinding disc\n5 pcs.\nC-clamp, 12”\n2\nsets\nOxy-acetylene\ncutting outfit\n4 pcs\n Structural\nmembers\n( I-beam)\n5 pcs.\nC-clamp, 6”\n3\nunits\nFire extinguishers\n1 box\nElectrodes\n5 pcs.\nPull & push rule\n2\nunits\nWorking\nbench\nwith vise\n64 sets\nBolts and nuts\nand washers\n5 pcs.\nSteel rule,1 meter\n3\nunits\nChain block\n25\npairs\nGloves\n5 pcs.\nTry square\n1 set\nScaffolding\n25 pcs.\nHard hat\n10 pcs.\nSteel square\n1 unit\n A frame (gantry)\n25\npairs.\nSafety shoes\n5 pcs.\nAdjustable wrench,\n8”\n\n25 pcs.\nGoggles\n5 pcs.\nAdjustable\nwrench,12 “\n\n5 pcs.\n Face shield\n5 pcs. Files ( assorted)\n\n2 pcs.\nWelding mask\n5 pcs.\nSteel brush\n\n5 pcs.\n Metal marker\n5 pcs.\nPry bar\n\n15\nmeters\nTag line\n(1 inch dia.)\n5 pcs.\nRatchet\n\n3 pcs.\nHydraulic jack\n\n5 pcs.\nTurnbuckle\n\n1 box\nDrill bits\n (assorted sizes)\n\n--- PDF PAGE 67 ---\nSTRUCTURAL ERECTION NC II 66\n\n3.5 TRAINING FACILITIES STRUCTURAL ERECTION NC II\n\n The space requirement is based on the class intake of 25 trainees.\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN\nSQ. METERS\nTOTAL AREA IN\n SQ. METERS\n• Lecture Room/Demo\nRoom\n\n25\n\n25\n• Wash Room\n\n5\n\n 5\n• Tool Room\n\n 5\n\n5\n• Work area (open)\n\n300\n\n 300\n\n 335\n 335\n\n TOTAL 335\n\n--- PDF PAGE 68 ---\nSTRUCTURAL ERECTION NC II 67\n\n3.6 TRAINER’S QUALIFICATIONS FOR STRUCTURAL\nERECTION NC II\n\n• Must have completed a Trainers Training Methodology Course (TM\nII) or its equivalent\n• Must be a holder of CSC Professional eligibility (for government\nposition)\n• Must be a holder of Structural Erection National Certificate II\n• Must be physically and mentally fit\n• *Minimum of 2 years industry experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 69 ---\nSTRUCTURAL ERECTION NC II 68"
