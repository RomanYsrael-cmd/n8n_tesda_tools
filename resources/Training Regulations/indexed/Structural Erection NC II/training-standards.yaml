    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: STRUCTURAL ERECTION\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n24 Hours (Common)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude in\nstructural erection in accordance with industry standards. It covers the basic,\ncommon and core competencies required for structural erector to demonstrate.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional\ngrowth and development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 60 ---\nSTRUCTURAL ERECTION NC II 59\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 61 ---\nSTRUCTURAL ERECTION NC II 60\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials\n1.2 Request materials\n1.3 Receive and\ninspect materials\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n• Direct observation\n• Written / Oral Test\n• Demonstration\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions\n2.1 Identify and access\nspecification /\nmanuals\n2.2 Apply information in\nmanual\n2.3 Store manual\n• Audio Visual\n• Simulation\n• Discussion practical\nlaboratory\n\n• Direct observation\n• Written test or\nexamination\n• Third party report\n• Demonstration\n3. Interpret\ntechnical\ndrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Store tools and\nequipment\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n• Direct observation\nof application of\ntasks.\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n•Demonstration\n\n--- PDF PAGE 62 ---\nSTRUCTURAL ERECTION NC II 61\nCORE COMPETENCIES\n(120 hours)\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Position\nstructural\nmembers\n1.1 Plan and prepare\nfor work\n1.2 Prepare hand\ntools and\nmaterials\n1.3 Move hoisted\nstructural\nmembers into\ndesignated\nposition\n• Discussion /\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation /\ndemonstration with\nquestioning\n• Written /\nexamination\n\n2. Fit-up\nstructural\nmembers\n2.1 Plan and prepare\nfor work\n2.2 Fit-up structural\nmembers\n\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation/\ndemonstration with\nquestioning\n• Written /\nexamination\n\n3. Perform tack\nwelding\n3.1 Prepare welding\ntools and materials\n3.2 Set-up welding\nequipment\n3.3 Perform tack\nwelding\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation/\nDemonstration with\nquestioning\n• Written /\nExamination\n\n--- PDF PAGE 63 ---\nSTRUCTURAL ERECTION NC II 62\n\nELECTIVE COMPETENCIES\n(32 hours)\n\nUnit of\nCompetency\n\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Layout\nstructural\nmembers\n1.1 Plan and\nprepare for work\n1.2 Layout structural\nmembers\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n2. Build low\nspots or\nremove high\nspots\n2.1 Plan and\nprepare for work\n2.2 Build low spots\nor remove high\nspots\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical exercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n--- PDF PAGE 64 ---\nSTRUCTURAL ERECTION NC II 63"
