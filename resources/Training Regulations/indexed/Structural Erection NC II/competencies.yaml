        "source_text": "CON713345\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\nfit-up structural members for permanent position.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italized terms are elaborated in the\nRange of Variable\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured according to standard\noperating procedures\n1.2 Work instruction is interpreted according to job\nspecifications\n1.3 Occupational health and safety standards and\nregulatory requirements are identified according to job\nrequirements\n1.4 Personal protective equipment is identified and\nselected in line with job requirements\n1.5 Basic hand tools and materials are identified in line with\njob requirements\n2. Prepare hand tools\n2.1 PPE is used in line with job requirements.\n2.2 Basic hand tools and materials are selected and prepared\nin line with job requirements.\n2.3 Basic hand tools are used in line with job requirements\n3. Fit-up structural\nmembers\n3.1 Relevant occupational health and safety standards are\ncomplied with.\n3.2 Fit-up structural framework procedure for permanent\nerection is performed following job specifications.\n4. Perform housekeeping\n4.1 Waste materials are disposed following occupational\nhealth and safety standards\n4.2 Tools and unused materials are returned to storage area\nfollowing company SOP\n4.3 Work accomplishment report is prepared and submitted to\nimmediate superior in line with company SOP.\n\n--- PDF PAGE 46 ---\nSTRUCTURAL ERECTION NC II 45\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Occupational health and\nsafety standards\nMay include but not limited to:\n1.1 Working at heights\n1.2 Ergonomics\n2. Regulatory requirements\n2.1 Cold work permit\n2.2 Hot work permit\n3. PPE\nMay include but not limited to:\n3.1 Full body harness\n3.2 Safety helmet\n3.3 Safety gloves\n3.4 Safety shoes\n3.5 Safety goggles\n3.6 Ear plugs\n4. Basic hand tools and\nmaterials\nMay include but not limited to:\n4.1 Sledgehammer\n4.2 Adjustable wrench or ratchet\n4.3 Rivet\n4.4 Stud\n4.5 Bolts and nuts\n5. Fit-up structural\n framework procedure\n5.1 Bolting\n5.2 Riveting\n6. Waste materials\nMay include but not limited to:\n6.1 Damaged bolts and nuts\n6.2 Damaged rivets\n6.3 Temporary supports and braces\n7. Unused materials\n7.1 Bolts and nuts\n7.2 Rivets\n\n--- PDF PAGE 47 ---\nSTRUCTURAL ERECTION NC II 46\n\nEVIDENCE GUIDE\n1. Critical aspect of\ncompetency\n\nEvidence must show the candidate can:\n1.1 Demonstrates ability to comply with occupational health\nand safety standards\n1.2 Demonstrates ability to use basic hand tools and\nmaterials\n1.3 Demonstrates ability to perform fit-up structural\nframework procedures for structural member\n2. Underpinning knowledge\n\n2.1 Relevant occupational health and safety standards\n2.2 Types and uses of basic hand tools and materials\n2.3 Fit-up procedure for structural members\n3. Underpinning skills\n\n3.1 Following occupational health and safety standards\n3.2 Using basic hand tools and materials\n3.3 Performing fit-up procedures for structural member\n4. Resource implications\n\nThe following MUST be provided\n4.1 Positioned structural member\n4.2 Relevant tools and materials\n4.3 Work place\n5. Methods of Assessment\n\nCompetencies maybe assessed using the following\n5.1 Observation of practical skills with oral questioning\n5.2 Demonstration of skills in a simulated venue\n5.3 Portfolio\n5.4 Third party report\n6. Context of assessment\n\n6.1 Assessment maybe conducted in any\n TESDA accredited assessment centers\n\n--- PDF PAGE 48 ---\nSTRUCTURAL ERECTION NC II 47\n\nUNIT OF COMPETENCY:\nPERFORM TACK WELDING\nUNIT CODE :"
