        "source_title": "POSITION STRUCTURAL MEMBERS",
        "source_text": "--- PDF PAGE 41 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          40 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:\nPOSITION STRUCTURAL MEMBERS\nUNIT CODE                     :\nCON713344\nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes required to \nperform position procedure for structural members\n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italized terms are elaborated in the  \nRange of Variable \n1. Plan and prepare for \nwork \n1.1 Work instruction is secured according to standard \noperating procedures  \n1.2 Work instruction is interpreted according to job \nspecifications \n1.3 Occupational health and safety standards and \nregulatory requirements are identified according to job \nrequirements \n1.4 Personal protective equipment is identified and selected \nin line with job requirements \n1.5 Guiding methods are identified in line with job \nrequirements. \n1.6 Basic hand tools and materials are identified in line with \njob requirements \n2.  Prepare hand tools \n2.1 Occupational health and safety standards are complied \nwith. \n2.2 PPE is used in line with job requirements. \n2.3 Basic hand tools and materials are selected and prepared \nin line with job requirements. \n3.   Move hoisted structural \nmembers into \ndesignated location   \n       \n3.1 Relevant occupational health and safety standards are \ncomplied with. \n3.2  Positioning procedure for structural members is \nperformed in line with job requirements \n3.3  Alignment procedure for hoisted structural member is \nperformed following job requirements  \n3.4  Installation of supports procedure is performed \naccording to work plan \n3.5  Initial connecting procedure for fit-up is performed for \nstructural members according to job specification \n \n \n \n \n \n RANGE OF VARIABLES\n\n--- PDF PAGE 42 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          41 \nVARIABLE\nRANGE\n1. Occupational health and \nsafety standards \nMay include but not limited to: \n1.1 Working at heights \n1.2 Ergonomics \n2. Regulatory \nrequirements \n2.1 Cold work permit \n2.2 Hot work permit \n3. PPE \nMay include but not limited to: \n3.1 Full body harness \n3.2 Safety helmet  \n3.3 Safety gloves \n3.4 Safety shoes \n3.5 Safety goggles \n3.6 Ear plugs \n4. Guiding methods \n4.1 Hand signal   \n4.2 Using ropes  \n4.3 Handset radio   \n5. Hand tools and \nmaterials \nMay include but not limited to: \n5.1 Pry bar \n5.2 Sledgehammer \n5.3 Adjustable wrench or ratchet \n5.4 Cold chisel \n5.5 Hydraulic jack \n5.6 Turnbuckle \n5.7 Metal marker \n5.8 Soft stone \n5.9 Rope \n5.10 Chain block  \n6. Positioning procedure \n6.1 Mechanical raising or hoisting \n6.2 Manual raising or hoisting \n6.3 Placing\n\n--- PDF PAGE 43 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          42 \n \n7. Alignment procedure \nMay include but not limited to: \n7.1 Using jack \n7.2 Using turnbuckles \n7.3 Using wedges \n7.4 Using drift pins \n7.5 Using pry bars \n7.6 Using hammer \n7.7 Chain block and comalong  \n8. Structural members  \nMay include but not limited to: \n8.1 Iron girders \n8.2 Steel girders \n8.3 Columns \n8.4 Trusses \n8.5 Pre-fabricated metal buildings \n8.6 Braces \n8.7 Plate \n8.9 Sog rod / purlins  \n9.  Supports  \nMay include but not limited to: \n9.1 Bridging \n9.2 Guy wire \n9.3 Jigs \n9.4 Brace  \n10. Initial connecting    \n  procedure \n     \n10.1 Bolting \n10.2 Riveting \n10.3 Tack welding\n\n--- PDF PAGE 44 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          43 \n \nEVIDENCE GUIDE \n1. Critical aspect of \ncompetency \n \nEvidence must show the candidate can: \n1.1 Demonstrates ability to comply with occupational health \nand safety standards \n1.2 Demonstrates ability to use basic hand tools and \nmaterials \n1.3 Demonstrates ability to perform positioning procedures \nfor structural members \n2. Underpinning \nknowledge \n \n2.1 Relevant occupational health and safety standards \n2.2 Types and uses of basic hand tools and materials \n2.3 Procedures for positioning structural members \n2.4 Types of structural member \n2.5 Basic metallurgy \n2.6 Inspection of rigging gears \n2.7 Installation of rigging gears \n2.8 Guide crane operator \n2.9 Company rules & regulations \n2.10 Work in a team \n3. Underpinning skills \n \n3.1 Following occupational health and safety standards \n3.2 Using basic hand tools and materials \n3.3 Following procedures for guiding and positioning \nstructural members \n3.4 Identifying types of structural member \n3.5 Inspecting rigging gears \n3.6 Installation of rigging gears \n3.7 Guiding crane operator \n3.8 Following company rules & regulations \n3.9 Working in a team  \n4. Resource implications \n \nThe following resources MUST be provided \n4.1 Structural member \n4.2 Relevant tools and materials  \n4.3 Hoisting equipment \n4.4 Work place \n5.  Methods of Assessment \n \nCompetencies maybe assessed using the following \n5.1 Observation of practical skills with oral questioning \n5.2 Demonstration of skills in a simulated venue \n5.3 Portfolio \n5.4 Third party report \n6.  Context of assessment \n6.1 Assessment maybe conducted in TESDA  \n      accredited assessment center\n",
