        "source_text": "--- PDF PAGE 48 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          47 \n \nUNIT OF COMPETENCY:\nPERFORM TACK WELDING \nUNIT CODE                     :\nCON713346\nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitude required to \nperform tack welding on structural members.\n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italized terms are elaborated in the  \nRange of Variable \n1. Prepare welding  \n    materials and tools  \n1.1 Work instruction is secured and interpreted according to \njob specifications  \n1.2 Occupational health and safety standards are identified \nand complied with  \n1.3 Company regulatory requirements are identified in line \nwith job requirements  \n1.4 Personal protective equipment is selected and used \nfollowing job requirements \n1.5 Welding materials and tools are identified as per \nspecifications \n2. Set-up welding  \n    equipment  \n2.1 Company regulatory requirements are complied with in \nline with job requirements \n2.2 Welding materials, tools and equipment are prepared as \nper standard operating  procedures (SOP) \n2.3 Welding equipment set-up procedure is performed as per \nmanufacturer’s recommendations \n3. Perform tack welding  \n3.1 Tack welding procedure is performed following job \nspecifications \n3.2 Visual check-up procedure is performed following job \nspecifications \n4. Perform housekeeping \n4.1 Waste materials are disposed following occupational \nhealth and safety standards \n4.2 Unused materials are returned to storage area following \ncompany SOP \n4.3 Completion report is prepared and submitted to \npersonnel as per SOP.\n\n--- PDF PAGE 49 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          48 \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1. Occupational health and  \n    safety requirements \n \nMay include but not limited to: \n1.1 Availability of fire extinguisher / fire watch \n1.2 Functionality of exhaust fan \n1.3 Availability of PPE \n2. Company regulatory  \n    requirements \n \nMay include but not limited to: \n2.1 Company authorized 1F welder  \n2.2 Company authorized 2F welder  \n2.3 Company authorized 3F welder  \n2.4 Company authorized 4F welder \n3. PPE  \n \nMay include but not limited to: \n3.1 Safety gloves \n3.2 Safety goggles, glass and face shield \n3.3 Safety helmet \n3.4 Safety harness  \n3.5 Safety clothes \n3.6 Safety shoes \n3.7 Dust masks \n3.8 Ear plug \n4. Welding materials, tools  \n    and equipment \n \n \nMay include but not limited to: \n4.1 Welding materials \n4.1.1 Electrodes  \n4.1.2 Welding cable  \n4.1.3 Stinger  \n4.1.4 Welding masks \n4.1.5 Metal pipes or plates \n4.2 Tools and equipment \n4.2.1  Welding machine  \n4.2.2  Air compressor  \n4.2.3  Exhaust fan  \n4.2.4  Welding gloves  \n4.2.5  Chipping hammer  \n4.2.6  Portable grinder  \n5.Tack welding procedure  \n \n5.1 Direct tacking \n5.2 Bridge tacking  \n5.3 Fabrication of temporary support\n\n--- PDF PAGE 50 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          49 \n \n6. Visual check-up  \n    procedure  \n6.1 Dimensional check-up  \n6.2 Squareness and levelness  \n7. Waste materials \n \nMay include but not limited to: \n7.1 Metal scraps \n7.2 Grinding discs \n7.3 Metal flux \n7.4 Electrodes \n7.5 Fabricated temporary supports \n8. Unused materials \n \n8.1 Structural steel  member \n8.2 Electrodes\n\n--- PDF PAGE 51 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          50 \nEVIDENCE GUIDE \n1. Critical aspect of \ncompetency \n \nEvidence must show the candidate can: \n1.1 Demonstrates ability to comply occupational health and \nsafety standards and other regulatory requirements in \ntack welding  \n1.1 Demonstrates ability to set-up welding equipment  \n1.2 Demonstrates ability to perform tack welding procedure \nand basic fabrication of temporary support \n1.3 Demonstrates ability to follow manufacturer’s \nrecommendations \n2. Underpinning \nknowledge \n \n2.1 Types of metal  \n2.2 Manufacturer’s manual  \n2.3 Occupational health and safety standards for  welding  \n2.4 Tack welding procedures     \n3. Underpinning skills \n \n3.1 Following manufacturer’s recommendations  \n3.2 Identifying types of metal \n3.3 Complying occupational health and safety standards in \nwelding \n3.4 Performing tack welding procedures  \n4. Resource implications \n \nThe following maybe provided \n4.1 Welding materials, tools and equipment relevant to the \nactivity \n4.2 Workplace or simulated workplace \n4.3 Exhaust fan \n5. Methods of Assessment\n \nCompetencies maybe assessed using the following \n5.1 Observation with oral questioning \n5.2 Demonstration of practical skills in a simulated  \n      environment \n5.2 Portfolio \n5.3 Third party report \n6. Context of assessment \n \n6.1 Assessment maybe conducted in any TESDA accredited \nassessment centers\n",
