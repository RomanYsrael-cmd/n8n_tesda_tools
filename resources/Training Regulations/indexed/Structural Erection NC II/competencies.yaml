        "source_title": "LAY-OUT STRUCTURAL MEMBERS",
        "source_text": "--- PDF PAGE 52 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          51 \nELECTIVE COMPETENCIES \n \nUNIT OF COMPETENCY:\nLAY-OUT STRUCTURAL MEMBERS \nUNIT CODE                     :\nCON713346\nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitude required to \nmeasure and attach connector plates and angles on structural \nmembers.\n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italized terms are elaborated in the  \nRange of Variable \n1.  Plan and prepare for \nwork \n1.1 Work instruction is secured according to standard \noperating procedures  \n1.2 Blueprint is interpreted according to work instruction.  \n1.3 Occupational health and safety standards and \nregulatory requirements are identified according to job \nrequirements \n1.4 Personal protective equipment is identified and selected \nin line with job requirements \n1.5 Basic hand tools are identified in line with job \nrequirements \n2.  Prepare hand tools  \n2.1 PPE is used in line with job requirements. \n2.2 Basic hand tools are selected and prepared in line with job \nrequirements. \n2.3 Basic hand tools are used in line with job requirements \n3.  Lay-out structural \nmembers  \n3.1 Relevant occupational health and safety standards are \ncomplied with. \n3.2  Measuring and marking procedure is performed for \nstructural member materials   \n3.3  Lay out procedure is performed following job \nspecifications \n3.4 Structural member materials are cut using oxy-acetylene \naccording to job requirements. \n4. Perform housekeeping \n4.1 Waste materials are disposed following occupational \nhealth and safety standards \n4.2 Tools and unused materials are returned to storage area \nfollowing company SOP \n4.3 Work accomplishment report is prepared and submitted to \nimmediate superior in line with company SOP.\n\n--- PDF PAGE 53 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          52 \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1. Blueprint \nMay include but not limited to: \n1.1 Locations \n1.2 Quantities \n1.3 Bill of materials  \n1.4 Welding symbol and process  \n2.  Occupational health and \nsafety standards \nMay include but not limited to: \n2.1 Availability of PPE  \n2.2 Availability of fire extinguisher  \n3. Regulatory requirements \n3.1 Cold work permit \n3.2 Hot work permit \n4. PPE \nMay include but not limited to: \n4.1 Safety helmet  \n4.2 Safety gloves \n4.3 Safety shoes \n4.4 Safety goggles \n4.5 Ear plugs \n5.  Basic hand tools  \nMay include but not limited to: \n5.1 Push-pull rule  \n5.2 Portable grinder  \n5.3 Soapstone \n5.4 Hammer  \n5.5 Try square  \n5.6 Adjustable wrench or ratchet \n5.7 Tool box  \n6.   Structural member \nmaterials \nMay include but not limited to: \n6.1 Beam \n6.2 Plates \n6.3 Steel bars \n7.  Lay-out  \nMay include but not limited to: \n7.1 Columns \n7.2 Beams \n7.3 Trusses \n7.4 Girders\n\n--- PDF PAGE 54 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          53 \n \n8. Waste materials  \nMay include but not limited to: \n8.1 Scraped metals Damaged bolts and nuts \n8.2 Grinding discs \n8.3 Cutting discs  \n8.4 Metal dusts \n9. Unused materials \nMay include but not limited to: \n9.1 Plates  \n9.2 Soapstone\n\n--- PDF PAGE 55 ---\nSTRUCTURAL ERECTION NC II                                                                                                                                          54 \nEVIDENCE GUIDE \n1. Critical aspect of \ncompetency \n \nEvidence must show the candidate can: \n1.1 Demonstrates ability to interpret blueprint as per work \ninstructions \n1.2 Demonstrates ability to comply with  occupational health \nand safety standards \n1.3 Demonstrates ability to use basic hand tools  \n1.4 Demonstrates ability to lay-out structural members \n2. Underpinning knowledge \n \n2.1 Relevant occupational health and safety standards \n2.2 Types and uses of basic hand tools and structural \nmember components  \n2.3 Procedures for lay-out procedures for structural members \n2.4 Isometric / orthographic drawings and sketches \n2.5 Mensuration and trade Mathematics \n2.6 Procedure for cutting metals using  oxy-acetylene \n3. Underpinning skills \n \n3.1 Following occupational health and safety standards \n3.2 Using basic hand tools and structural member \ncomponents  \n3.3 Performing lay-out procedures for structural members \n3.4 Applying mensuration and trade Mathematics \n3.5 Interpreting isometric / orthographic drawings and \nsketches \n3.6 Performing procedure for cutting metal using oxy-\nacetylene   \n4. Resource implications \n \nThe following MUST be provided \n4.1 Blueprint  \n4.2 Relevant hand tools and structural member materials  \n4.3 Work place \n5. Methods of Assessment \n \nCompetencies maybe assessed using the following \n5.1 Observation of practical skills with oral questioning \n5.2 Demonstration of skills in a simulated venue \n5.3 Portfolio \n5.4 Third party report \n6. Context of assessment \n \n6.1 Assessment maybe conducted in any  TESDA accredited \nassessment centers\n",
