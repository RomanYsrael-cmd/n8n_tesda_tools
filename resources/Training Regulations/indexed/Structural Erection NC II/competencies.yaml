        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\n\nEvidence must show the candidate can:\n1.1 Demonstrates ability to comply with occupational health\nand safety standards\n1.2 Demonstrates ability to use basic hand tools and materials\n1.3 Demonstrates ability to perform build-up procedure for low\nspot and removal procedure high spot\n2. Underpinning knowledge\n\n2.1 Relevant occupational health and safety standards\n2.2 Types and uses of basic hand tools and materials\n2.3 Build-up procedures for low spot\n2.4 Removal procedures for high spot\n3. Underpinning skills\n\n3.1 Following occupational health and safety standards\n3.2 Using basic hand tools and materials\n3.3 Performing build-up procedures for low spot\n3.4 Performing removal procedure for high spot\n4. Resource implications\n\nThe following MUST be provided\n4.1 Erected structural member\n4.2 Relevant tools and materials\n4.3 Work place\n5. Methods of Assessment\n\nCompetencies maybe assessed using the following\n5.1 Observation of practical skills with oral questioning\n5.2 Demonstration of skills in a simulated venue\n5.3 Portfolio\n5.4 Third party report\n6. Context of assessment\n\n6.1 Assessment maybe conducted in any TESDA accredited\nassessment centers\n\n--- PDF PAGE 59 ---\nSTRUCTURAL ERECTION NC II 58"
        },
        "source_text": "CON713347\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\nbuild low spots or remove high spots\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italized terms are elaborated in the\n Range of Variable\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured from immediate superior\naccording to standard operating procedures\n1.2 Occupational health and safety standards and\nregulatory requirements are identified according to job\nrequirements\n1.3 Personal protective equipment is identified and\nselected in line with job requirements\n1.4 Basic hand tools and equipment are identified in line\nwith job requirements\n2. Prepare hand tools and\nequipment\n2.1 PPE is used in line with job requirements.\n2.2 Basic hand tools and equipment are selected and\nprepared in line with job requirements.\n2.3 Basic hand tools are used in line with job requirements\n3. Build up low spots or\nremove high spots\n3.1 Relevant occupational health and safety standards are\ncomplied with.\n3.2 Build-up procedure for low spots is performed in line with\njob instruction\n3.3 Removal procedure for high spots is performed according\nto job instruction\n4. Perform housekeeping\n4.1 Waste materials are disposed following occupational\nhealth and safety standards\n4.2 Tools and unused materials are returned to storage area\nfollowing company SOP\n4.3 Work completion report is prepared and submitted to\nimmediate superior in line with company SOP.\n\n--- PDF PAGE 57 ---\nSTRUCTURAL ERECTION NC II 56\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Occupational health and\nsafety standards\nMay include but not limited to:\n1.1 Availability of PPE\n1.2 Working at heights\n2. Regulatory requirements\n2.1 Cold work permit\n2.2 Hot work permit\n3. PPE\nMay include but not limited to:\n3.1 Full body harness\n3.2 Safety helmet\n3.3 Safety gloves\n3.4 Safety shoes\n3.5 Safety goggles\n3.6 Ear plugs\n4. Basic hand tools and\nequipment\nMay include but not limited to:\n4.1 Grinder\n 4.1.1 Pencil\n 4.1.2 Angle\n4.2 Welding machine\n4.3 Chipping hammer\n5. Waste materials\nMay include but not limited to:\n5.1 Electrode butts\n5.2 Electrodes\n5.3 Discs\n 5.3.1 Grinding\n 5.3.2 Cutting\n6. Unused materials\n6.1 Excess electrodes\n6.2 Excess discs\n\n--- PDF PAGE 58 ---\nSTRUCTURAL ERECTION NC II 57\n\nEVIDENCE GUIDE\n1. Critical aspect of\ncompetency\n\nEvidence must show the candidate can:\n1.1 Demonstrates ability to comply with occupational health\nand safety standards\n1.2 Demonstrates ability to use basic hand tools and materials\n1.3 Demonstrates ability to perform build-up procedure for low\nspot and removal procedure high spot\n2. Underpinning knowledge\n\n2.1 Relevant occupational health and safety standards\n2.2 Types and uses of basic hand tools and materials\n2.3 Build-up procedures for low spot\n2.4 Removal procedures for high spot\n3. Underpinning skills\n\n3.1 Following occupational health and safety standards\n3.2 Using basic hand tools and materials\n3.3 Performing build-up procedures for low spot\n3.4 Performing removal procedure for high spot\n4. Resource implications\n\nThe following MUST be provided\n4.1 Erected structural member\n4.2 Relevant tools and materials\n4.3 Work place\n5. Methods of Assessment\n\nCompetencies maybe assessed using the following\n5.1 Observation of practical skills with oral questioning\n5.2 Demonstration of skills in a simulated venue\n5.3 Portfolio\n5.4 Third party report\n6. Context of assessment\n\n6.1 Assessment maybe conducted in any TESDA accredited\nassessment centers\n\n--- PDF PAGE 59 ---\nSTRUCTURAL ERECTION NC II 58"
