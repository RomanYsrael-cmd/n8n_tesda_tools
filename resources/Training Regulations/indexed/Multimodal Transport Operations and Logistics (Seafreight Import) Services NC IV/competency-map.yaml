  "source_text": "SECTION 1 MULTIMODAL TRANSPORT OPERATION AND LOGISTICS\n(SEAFREIGHT IMPORT) SERVICES NC IV QUALIFICATION\n\nThe MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT\nIMPORT) SERVICES NC IV Qualification consists of competencies that a person\nmust achieve to supervise activities involving import seafreight, oversee the import\nseafreight team’s performance, oversee the coordination with overseas agents on\nshipment status particularly on any irregularity, control shipping documents, ensure\nthat claims arising from cargo losses, damages, theft and other irregularities are\nprocessed and prepare reports required to support business decisions and comply\nwith government requirements.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE BASIC COMPETENCIES\n500311401\n500311402\n500311403\n\n500311404\n500311405\n500311406\n500311407\n\n500311408\n\n500311409\nUtilize specialized communication skill\nDevelop and lead teams\nPerform higher-order thinking processes and apply techniques in the\nworkplace\nContribute to the practice of social justice in the workplace\nManage innovative work instructions\nManage and evaluate usage of information\nLead in improvement of occupational safety and health (OSH) programs,\npolicies and procedures\nLead towards improvement of environmental work programs, policies and\nprocedures\nSustain entrepreneurial skills\nUNIT CODE\nCOMMON COMPETENCIES\nMTO432201\n\nMTO432202\nApply freight forwarding and documentation service operations and\nworkplace procedures\nPerform workplace security and safety\nMTO432203\nProvide effective customer service\nMTO432204\nContribute to quality system\nMTO432205\nPerform computer operations\n\nUNIT CODE\nCORE COMPETENCIES\nMTO132301\nSupervise/ manage activities involving import sea freight\nMTO132302\nOversee the import seafreight team’s performance\nMTO132303\nOversee the coordination with overseas agents on shipment status\nparticularly on any irregularity\nMTO132304\nControl shipping documents\nMTO132305\n\nMTO132306\nEnsure that claims arising from cargo losses, damages, theft, and\nother irregularities are processed.\nPrepare reports required to support business decisions and comply\nwith government requirements\n\n--- PDF PAGE 6 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n2\n\nA person who has achieved this Qualification is competent to be:\n\n❑ Seafreight Import Supervisor\n\n--- PDF PAGE 7 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n3"
}
