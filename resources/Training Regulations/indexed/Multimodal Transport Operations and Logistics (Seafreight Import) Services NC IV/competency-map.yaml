  "source_text": "COMPETENCY MAP – TRANSPORT AND LOGISTICS SECTOR\n(MULTIMODAL TRANSPORT OPERATIONS AND LOGISTICS SERVICES NCIV)\n\nBASIC COMPETENCIES\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork\npractices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/addres\ns routine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand\nprocedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in Team\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career\nand life\ndecisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe workplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nUtilize\nspecialized\ncommunication\nskill\n\nDevelop and\nlead teams\n\nPerform\nhigher-order\nthinking\nprocesses\nand apply\ntechniques\nin the\nworkplace\n\nContribute to\nthe practice of\nsocial justice\nin the\nworkplace\n\nManage\ninnovative\nwork\ninstructions\n\nManage and\nevaluate\nusage of\ninformation\n\nLead in\nimprovement\nof\noccupational\nsafety and\nhealth (OSH)\nprograms,\npolicies and\nprocedures\n\nLead\ntowards\nimprovement\nof\nenvironment\nal work\nprograms,\npolicies and\nprocedures\n\nSustain\nentrepreneurial\nskills\n\n--- PDF PAGE 182 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n178\nCOMMON COMPETENCIES\n\nApply freight forwarding\ndocumentation services\nand workplace procedures\n\nPerform workplace\nsecurity and safety\nProvide effective\ncustomer service\nContribute to quality\nsystem\n\nPerform computer\noperations\n\n CORE COMPETENCIES\n\nSupervise/\nmanage activities\ninvolving import\nsea freight\noperations\nOversee import\nsea freight\nteam’s\nperformance\nOversee the\ncoordination with\noverseas agents\non shipment\nstatus particularly\non any irregularity\n\nControl of\nshipping\ndocuments\n\nEnsure that claims\narising from cargo\nlosses, damages,\ntheft, and other\nirregularities are\nprocessed\nPrepare reports\nrequired to support\nbusiness decisions\nand comply with\ngovernment\nrequirements\n\n--- PDF PAGE 183 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n179\nACRONYMS NC IV\n\n3R\nReduce, Reuse, Recycle\n5S\nSort, Set in order, Shine, Standardize and Sustain\nCD\nCompact Disc\nCLM\nContextual Learning Matrix\nDACUM\nDeveloping A Curriculum\nECC\nEnvironmental Compliance Certificate\nEDI\nElectronic Data Interchange\nEMS\nEnvironmental Management Systems\nERS\nEmergency Recovery Surcharge\nGOs\nGovernment Organizations\nID\nIdentification\nISO\nInternational Organization for Standardization\nKPI\nKey Performance Indicator\nMSME\nMicro-Small-Medium Enterprises\nNGOs\nNon-Government Organizations\nOHS\nOccupational Health and Safety\nOSHA\nOccupational Safety and Health Association\nPDCA\nPlan-Do-Check-Act\nPPE\nPersonal Protective Equipment\nPWD\nPerson With Disability\nSOP\nStandard Operating Procedure\nSWOT\nStrengths, Weaknesses, Opportunities and Threats\nTESDA\nTechnical Education and Skills Development Authority\nTNA\nTraining Needs Analysis\nTQM\nTotal Quality Management\nTR\nTraining Regulation\nTVET\nTechnical and Vocational Education and Training\nUV\nUltra Violet\n\n--- PDF PAGE 184 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n180\nGLOSSARY OF TERMS\nAnalytical techniques\nA method involving the careful, systematic study of something\n\nAural\nRelating to the ear or sense of hearing\n\nBlueprint\nAn early plan or design that explains how something might be\nachieved\n\nCareer path\nThe way you progress in your work, either in one job or series of jobs\n\nCoherent\nLogical, clear, and consistent\n\nCollaborative\nInvolving two or more people working together for a special purpose\n\nCollate\nThe grouping together of related items to provide a record of events\nand facilitate\n\nfurther processing\n\nCollusion\nA secret agreement or cooperation especially for an illegal or deceitful\npurpose\n\nConnivance\nWillingness to secretly allow or be involved in wrongdoing especially\nan immoral or\n\nillegal act\n\nConstructively\nIn a way that has or is intended to have a useful or beneficial purpose\n\nConventions\nAn agreement between countries particularly matters, especially one\nless formal than a treaty\n\nDenudation\nThe act of stripping (something) of its covering, possession or assets;\nmake bare ie. denudation of a forest\n\nDiffuse\nSpread out over a large area\n\nDomain\nA specified sphere of activity or knowledge\n\nDynamics\nForces or processes that produce change inside a group or system\n\nEliciting\nTo get or produce something, especially information or reaction\n\nEmpathy\nThe ability to understand and share the feelings of others\n\nEntrepreneurial\nhaving to do with the creation and development of economic ventures\n\nErgonomics\nRelating to or designed for efficiency and comfort in the working\nenvironment\n\n--- PDF PAGE 185 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n181\nEscalation procedures\nSteps to be taken when service levels do not meet with contractual\nrequirement such as reporting to higher authorities for disposition\n\nEthical standards\nStandard principles that encourage the greater values of trust, fairness\nand benevolence\n\nFishbone analysis\nA business tool that is used to conduct a cause and effect analysis for\na particular problem that needs a solution\n\nFoster\nEncourage or promote the development of something regarded as\ngood\n\nFrisking\nBody search as in a search for hidden weapons, drugs, explosives or\nother deadly items\n\nFront-end analysis\nA process that clearly defines the objectives of training\n\nGantt chart\nA chart in which a series of horizontal lines shows the amount of work\ndone or production\n\ncompleted in a certain period of time in relation to the amount planned\nfor those period\n\nIdeology\nThe ideas and manner of thinking characteristic of a group, social\nclass or individual\n\nInterpersonal\nQuality of proper behavior in relation to others\n\nJudicious\nHaving, showing or done with good judgment, sense, or fairness\n\nMagnetometers\nAn instrument used to detect the presence of metallic object\n\nMechanism\nA natural or established process by which something takes place or is\nbrought about\n\nMethodology\nA system of methods used in a particular area or study or activity\n\nParameters\nA numerical or other measurable factor forming one of a set that\ndefines\n\na system or sets the conditions of its operation\n\nPeripheral\nOf secondary or minor importance; on the sidelines of a major object\nor concept\n\nPerks\nSpecial benefits that are given to people who have particular job or\nbelong to a particular group\n\nPerspective\nA particular way of considering something\n\nPhilosophy\nA theory or attitude held by a person or organization that acts as a\nguiding principle for\n\nbehavior\n\n--- PDF PAGE 186 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n182\n\nPortfolio\nA compilation of materials that exemplifies your beliefs, skills,\nqualifications,\n\neducation, training and experiences. It provides insight into your\npersonality\n\nand work ethic.\n\nPredetermined\nEstablished or decided in advance\n\nProtocols\nAttitudes, etiquette rules and guidelines for behaviour that encompass\nthe\n\nbest way to act at work\nRapport\nIn a good understanding of someone and an ability to communicate\nwell\n\nwith them\n\nRoster\nList of people's name, often with the jobs they were given to do\n\nSalient\nMost noticeable or important\n\nSequential\nForming or following in a logical order or sequence\n\nSimulated\nImitating the conditions of something\n\nSix-Sigma\nSet of management techniques intended to improve business\nprocesses greatly\n\nreducing the probability that an error or defect will occur\n\nStatutory\nDecided, regulated, or controlled by law\n\nSystematically\nIn a way that is done according to an agreed sets of methods or\norganized\n\nTime management\nThe ability to use one's time effectively or productively especially at\nwork\n\nUnderpining\nA set of ideas, motives or devices that justify or form the basis for\nsomething\n\n--- PDF PAGE 187 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n183\n• THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING\nREGULATION:\n\nNAME\nCOMPANY NAME\nDESIGNATION\n1. Ramonito M. Digan\nKINTETSU World Express Inc.\nSeafreight Import Coordinator\n2. Marsha L. Torres\nPursia Transport System Inc.\nSeafreight Import Coordinator\n3. Ginno Edano\nWen-Parker Logistics Phils.\nSeafreight Import Coordinator\n4. Mary Jane Linsangan\nHankyu Hanshin Express\nPhils. Inc.\nSeafreight Import Coordinator\n5. Anacita C. Dela Rosa\nHankyu Hanshin Express\nPhils. Inc.\nSeafreight Import Coordinator\n6.Debbie Ann Moretcho\nPacific Concord Container\nLines, Inc.\nSeafreight Import Coordinator\n7.Alvin Lacasandile\nCommercial Freight Services\nInc.\nSeafreight Import Coordinator\n8.Marlon Gallardo\nAirspeed International Corp.\nSeafreight Import Coordinator\n9.Joel Morales\nAirspeed International Corp.\nSeafreight Import Coordinator\n10.Ernesto Ramos Jr.\nTNL Express Worldwide Corp.\nSeafreight Import Coordinator\n11.Angelo C. Montales\nLeadway Cargo Logistics Inc.\nSeafreight Import Coordinator\n\n--- PDF PAGE 188 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n184\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMultimodal Transport Operations and Logistics Services NC IV\nQualification Code:\nTLSMTO419\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution\nNo./ Date)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nMultimodal Transport\nOperations and Logistics\nServices NC IV\nN/A\n2019-78/\nDec 17, 2019\nN/A\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 189 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n185\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who provided their\ntime and expertise to the development and validation of these Training\nRegulations.\n\nTECHNICAL EXPERTS PANEL\n\nDORIS P. TORRES\nTechnical Expert\nSTAMM International\nGen. Lim st. Bangkal, Makati City\nCOSME J. NONAN JR., Ph.D.\nTechnical Expert\nCommercial Freight Services, Inc.\nIntramuros, Manila\nMARILYN C. ALBERTO\nTechnical Expert\nKintetsu World Express\nParañaque City\nJOSEFINA C. YAP\nTechnical Expert\nPhilippine Genesis Freight Unlimited\nIntramuros, Manila\nThe PARTICIPANTS in the National\nValidation of this Training Regulation\n\nThe Members of the TESDA Board\nand Secretariat\n\nThe MANAGEMENT and STAFF of\nthe TESDA Secretariat\n•\nQualifications and Standards\nOffice (QSO)\n\n TESDA – QSO Technical Facilitators\nABRAHAM V. ASUNCION\nTechnical Expert\nPhilippine Multimodal Transport and\nLogistics Association, Inc.\nParañaque City\nBENILDA S. HERNANDEZ\nTechnical Expert\nSky Freight Forwarders\nParañaque City\nCATTLEYA CAMILLE P.\nGEALON\nTechnical Expert\nPhilippine Multimodal Transport and\nLogistics Association, Inc.\nParañaque City",
