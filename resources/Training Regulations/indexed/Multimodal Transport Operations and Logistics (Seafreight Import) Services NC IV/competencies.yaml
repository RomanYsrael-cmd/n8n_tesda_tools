nal skills \n2.5 Negotiation skills   \n2.6 Result Oriented \nskills \n2.7 Communication \nskills\n\n--- PDF PAGE 73 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n69 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.20 Data privacy Act \n2.21 Non-Disclosure \nAgreement \n2.22 Quality Manual  \n3. Implement \nbusiness \nprocesses  \n3.1 Initial hands on training \n& observation of the \nprocess for all sea \nfreight import \nemployees  are \narranged in \naccordance to \ncompany requirements \n3.2 Employees are \nmotivated for positive \nresults \n3.3  Processes \nimplemented are \nevaluated for \ncontinuous \nimprovement in \naccordance with \nestablished quality \nmanagement system. \n3.1 Business Etiquette \n3.2 Business Writing  \n3.3 Obligations and \nContracts \n3.4 Negotiable \nInstruments  \n3.5 Occupational \nSafety and Health \nRequirements \n3.6 Environmental \nLaws \n3.7 Units of \nMeasurements \n3.8 Conversion of \nMeasurements \n3.9  Calculation of \nCharges \n3.10 Currency \nConversion  \n3.11 Commodity \ncharacteristics, \nprohibitions and \nrestrictions \n3.12 Weight and \nbalance \n3.13 Tools, and \nMaterial Handling \nEquipment   \n3.14 Quality \nManagement \nSystem \n3.15 Standard \nOperating \nProcedures \n3.16  Key Performance \nIndicators \n3.17 Quality Operation \nManuals \n3.18 Anti-trust \nregulations \n3.19 Anti-corruption \npolicies \n3.20 Anti-piracy Act \n3.21 Non-disclosure \nAgreement \n3.22 Data privacy Act \n \n3.1 Problem-solving \nskills \n3.2 Time management \nskills \n3.3 Work planning and \norganizational skills \n3.4 Interpersonal skills \n3.5 Negotiation skills  \n3.6 Result Oriented \nskills  \n3.7 Communication \nskills\n\n--- PDF PAGE 74 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n70 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRE