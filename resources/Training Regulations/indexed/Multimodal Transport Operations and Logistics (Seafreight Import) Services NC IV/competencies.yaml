        "source_text": "--- PDF PAGE 19 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n15 \nUNIT OF COMPETENCY : \nPERFORM HIGHER-ORDER THINKING PROCESSES \nAND APPLY TECHNIQUES IN THE WORKPLACE  \n \nUNIT CODE \n:    500311403 \n \nUNIT DESCRIPTOR \n: \nThis unit of covers the knowledge, skills and attitudes \nrequired to use fundamental critical thinking skills in the \nworkplace. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Evaluate \neffectiveness \nand efficiency \nof the \nworkplace \nsystems, \nprocesses and \nprocedures. \n1.1 Effectiveness and \nefficiency of \nworkplace standards \nand procedures are \nexamined. \n1.2. Usage of inquiry and \ndialogue to \ncommunicate \nevaluation measures \nand results are \nimplemented. \n1.3   Evaluation reports are \nprepared and \ncommunicated to team \nmembers. \n \n1.1 Systems, \nstandards, \nprocedures and \nprotocols in the \nworkplace. \n1.2 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations \n1.3 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n1.4 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n1.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, attention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n1.2 Communicating to \nactively listen and to \nask questions of \nothers in a \nconstructive way. \n1.3 Using critical \nthinking pathway to \nformulate and ask \nrelevant questions \nand come up with \nappropriate \nanswers. \n1.4 Performing \nassimilation and \naccommodation \nskills to interpret and \ndistil key information \nof relevance to a \ngiven situation. \n1.5 Assessing and \nmeasuring the \nextent of \neffectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace.\n\n--- PDF PAGE 20 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n16 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Foster the \nhabit of critical \ninquiry and \ncuriosity in the \nworkplace. \n2.1 Issues and situations \nare reflected on and \nwondered about. \n2.2 Issues and problems \nin the workplace \nparticularly in the \npolicies, procedures \nand protocols are \ndiscussed and \nevaluated between \nand among teams. \n2.3 Evaluation of \nefficiency and \neffectiveness of \nworkplace policies, \nprocedures and \nprotocols are \ndocumented, \ncommunicated and \nagreed upon between \nand among teams. \n2.4 Growth mindset and \npositive relationship \nand communication is \napplied in the context \nof curiosity and \ncritical inquiry in the \nworkplace. \n2.1 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations. \n2.2 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n2.3 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n2.4 Growth mindset \nand positive \ncommunication \nand relationship \nstrategies and \ntechniques. \n2.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, attention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n2.2 Communicating to \nactively listen and to \nask questions of \nothers in a \nconstructive way. \n2.3 Using critical \nthinking pathway to \nformulate and ask \nrelevant questions \nand come up with \nappropriate \nanswers. \n2.4 Performing \nassimilation and \naccommodation \nskills to interpret and \ndistil key information \nof relevance to a \ngiven situation. \n2.5 Assessing and \nmeasuring the \nextent of \neffectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace. \n2.6 Communicating \ninsights on \nworkplace \neffectiveness and \nefficiency.\n\n--- PDF PAGE 21 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n17 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Develop \npractical action \nplans for \nimproving \nworkplace \nconditions. \n3.1 Evaluation of efficiency \nand effectiveness of \nworkplace policies, \nprocedures and \nprotocols are \ndocumented, \ncommunicated to \nstakeholders. \n3.2 Practical action plans \nin improving workplace \nconditions are \nformulated, presented \nand negotiated with \nstakeholders. \n3.3 Proposed changes and \ndirections are inquired, \nprocessed and \nnegotiated between \nand among teams, and \nstakeholders as well of \nthe organization. \n3.4 Commitment to \ncontinuous \nimprovement and \nchange is highlighted. \n3.5 Passion and dedication \nfor changing and \nadapting to the \ndemands of the 21st \ncentury workplace are \nconsidered. \n3.1 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent situations. \n3.2 Techniques to \nassist in forming \nthe habit of asking \nquestions and \ntaking \nresponsibility for \nanswers. \n3.3 Why questions are \nimportant and the \nbenefits of asking \ngood questions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n3.4 Growth mindset \nand positive \ncommunication \nand relationship \nstrategies and \ntechniques. \n3.5 Creative \nnegotiation skills. \n3.6 Change \nmanagement and \ncontinuous \nimprovement \nconcepts. \n3.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n3.2 Communicating to \nactively listen and to \nask questions of \nothers in a \nconstructive way. \n3.3 Using critical thinking \npathway to formulate \nand ask relevant \nquestions and come \nup with appropriate \nanswers. \n3.4 Performing \nassimilation and \naccommodation skills \nto interpret and distil \nkey information of \nrelevance to a given \nsituation. \n3.5 Assessing and \nmeasuring the extent \nof effectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace. \n3.6 Communicating \npractical insights on \nimproving workplace \nconditions.\n\n--- PDF PAGE 22 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n18 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Effectiveness and \nefficiency  \nMay include; \n1.1 Developing a more efficient way of doing \nsomething \n1.2 Developing a new idea \n1.3 Developing and improving products and \nservices  \n1.4 Enhancing skills and career opportunities \n1.5 Enhancing the physical environment \n1.6 Financial benefit \n1.7 Greater personal satisfaction \n1.8 Improving interpersonal relationships \n1.9 Evaluating overall workplace conditions \n2. Curiosity and critical \ninquiry \nMay include: \n2.1 \nAccuracy \n2.2 \nBreadth \n2.3 \nClarity \n2.4 \nDepth \n2.5 \nEmotion \n2.6 \nFairness \n2.7 \nLogic \n2.8 \nMeaning \n2.9 \nPlanning \n2.10 Attention \n2.11 Precision \n2.12 Relevance  \n2.13 Significance \n2.14 Social engagement \n2.15 Society  \n2.16 Style \n2.17 Growth mindset \n2.18 Positive communication \n2.19 Positive negotiation \n2.20 Workplace conditions \n2.21 Appreciative inquiry methods\n\n--- PDF PAGE 23 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n19 \nVARIABLE \nRANGE \n3. Practical action plans \nMay include: \n3.1 \nInsights on continuous improvement \n3.2 \nCreative strategies and techniques for \nbecoming better at work and real life \n3.3 \nCareer plans \n3.4 \nChallenging workplace policies, procedures \nand protocols \n3.5 \nSpecifying plans for change and adapting to \nthe demands of the contemporary workforce \n3.6 \nChallenges in negotiating with stakeholders \nand teams \n3.7 \nChange management, innovation and \nknowledge creation \n3.8 \nContractual agreements \n3.9 \nExtreme time pressure or non-negotiable \ndeadlines \n3.10 Financial limitations \n3.11 Procedures determined by laws or other \nregulations \n3.12 Safety issues \n3.13 When others are totally closed to new ideas \n3.14 Acknowledging shared responsibility  \n3.15 Adopting a positive 'can do' attitude \n3.16 Following up on practical details \n3.17 Pro-actively seeking information  \n3.18 Suggesting a new approach \n3.19 Talking to others about possible answers \n3.20 Constraints of the broader context and \nenvironment \n3.21 Overall goal - what needs to be achieved \n3.22 Personal hopes and expectations\n\n--- PDF PAGE 24 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n20 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Evaluated the effectiveness and efficiency of \nworkplace systems, processes and procedures. \n1.2 Modelled the conscious process of critical inquiry \nto get new insights that s/he can get in formulating \naction plans on continuous improvement in the \nworkplace and real-life \n1.3 Practiced the habit of critical inquiry and curiosity \nin the workplace \n1.4 Shown a thorough knowledge and understanding \nof how critical thinking impacts on individual lives, \nthe broader community and work situations. \n1.5 Developed practical action plans for improving \nworkplace conditions. \n2. Resource \nImplications \n2.1. Interactions with specific challenges and situations \nto demonstrate the application of critical thinking \n(this would usually involve interactions with others). \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Direct questioning combined with review of \nportfolios of evidence and third-party workplace \nreports of on-the-job performance by the candidate  \n3.2 Evaluation of a candidate blog exploring different \nideas and questions  \n3.3 Review of candidate response to scenarios that \nallow the candidate to apply critical thinking \ntechniques to a life or work situation, and to \ndemonstrate ability to portray curiosity and \nexploration of new concepts \n3.4 Evaluation of candidate response to the challenge \nof adopting different perspectives on a situation, \nand ability to both develop and respond to \nquestions from those perspectives \n3.5 Observation of the candidate participating in a \ngroup problem-solving session \n3.6 Oral or written questioning to assess knowledge of \ntypical blockers to the critical thinking process. \n3.7 Life Narrative Inquiry to reflect life stories that reflect \nhow critical thinking and problem solving is applied \nin the lives.  \n4. Context for \nAssessment \n4.1. In all workplace, it may be appropriate to assess \nthis unit concurrently with relevant teamwork or \noperation units.\n",
