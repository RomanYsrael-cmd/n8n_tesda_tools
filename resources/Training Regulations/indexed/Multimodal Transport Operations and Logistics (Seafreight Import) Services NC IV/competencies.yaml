        "source_title": "MANAGE INNOVATIVE WORK INSTRUCTIONS",
        "source_text": "--- PDF PAGE 28 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n24 \nUNIT OF COMPETENCY :  MANAGE INNOVATIVE WORK INSTRUCTIONS \n               \nUNIT CODE \n:   500311405  \n               \nUNIT DESCRIPTOR         :   This unit covers the knowledge, skills and attitudes required to     \n \n    sustain and develop a workplace environment in which     \n  \n    improvement, innovation and learning are promoted and  \n \n    reinforced. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Review and \nanalyze \nexisting \nworkplace \npractices \n1.1 Current instructions \nand strategies to \nperform tasks in the \nworkplace are \nreviewed \n1.2 Climate for \ninnovation at the \norganizational level \nis defined  \n1.3 Innovation drivers in \nthe workplace are \nidentified \n1.1. Four drivers of \ninnovation \naccording to \nGallup \nManagement \nJournal (2007) \n1.2. Contextual \nvariables \nrelated to \ninnovative \npractices in the \norganization \n1.3. The nine \ndimensions of \ninnovation \nclimate \n(Isaksen & \nIsaksen, 2018) \n1.4. Types of \nInnovation \nidentified by \nGopalakrishnan \nand Damanpour \n(1997) \n1.1 Investigating the \norganizational \nneeds in the \ninnovation \nprocess \n1.2 Defining current \norganizational \ninnovative \npractices  \n1.3 Linking innovation \nto contextual \nvariables in the \norganization\n\n--- PDF PAGE 29 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n25 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Examine \nopportunities \nfor continuous \nimprovement \nand innovation \nof practices in \nthe workplace \n2.1. Effectiveness of \ninnovative practices in \nthe workplace is \ndetermined \n2.2. Innovative behaviors \nof leaders or managers \nin the organization are \nassessed \n2.3. Driving principles of \ninnovation are \ndiscussed \n2.1  Determinants of \ninnovative \nbehavior by \nScott and Bruce \n(1992) \n2.2  Four principles of \ninnovation \naccording to \nGallup \nManagement \nJournal (2007) \n \n \n \n2.1 Evaluating \norganizational \ninnovative \npractices  \n2.2  Gauging innovative \nbehaviors of the \nleaders and \nmanagers in the \norganization \n2.3  Deliberating \nopportunities and \nchallenges in \nimplementing \ninnovation \n3. Implement \ninnovative ways  \nin the conduct \nof usual \nworkplace \npractices \n3.1. Innovative behaviors in \nthe workplace are \nperformed \n3.2. Innovative climate in the \nworkplace is maintained \n3.3. Adoption or modification \nof new ideas relevant to \nthe organizational needs \nis achieved \n3.1  Determinants of \ninnovative \nbehavior by \nScott and Bruce \n(1992) \n3.2  The nine \ndimensions of \ninnovation \nclimate (Isaksen \n& Isaksen, 2018) \n3.3  Techniques in \nimplementing \ninnovative \nchange in the \nworkplace \n \n3.1  Developing risk \nmanagement \ntechniques and \ncontrol systems \n3.2   Evaluating impact \nof changes and \ndeveloping action \nplans \n3.3  Demonstrating \nstrategies and \ntechniques in \nmanaging changes \nin the workplace\n\n--- PDF PAGE 30 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n26 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Innovation \nMay include: \n1.1  Products versus processes \n1.2  Radical versus incremental \n1.3.  Technical versus administrative \n2. Innovative behaviors \nMay include: \n2.1  Always generate creative ideas or new solutions \n2.2  Exploring and secure funds or resources required \nfor implementing new ideas \n2.3  Establishing adequate plans and schedules for \nimplementing new ideas \n2.4  Contributing suggestions or approaches for others’ \ncreative ideas\n\n--- PDF PAGE 31 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n27 \n      EVIDENCE GUIDE \n \n1.   Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nAnalyzed and evaluated systems and \nperformance in key areas of the organization and \nidentify opportunities for improvement, seeking \nadvice from experts as appropriate \n1.2 \nPromoted the value of creativity, innovation and \nsustainability and recognize successes \n1.3 \nSupported the testing and trialing of new ideas \nand undertake risk management and cost-benefit \nanalysis for options \n1.4 \nPlanned for and implemented improvements \nusing organization’s processes for approvals, \nproject management and change management \n1.5 \nFacilitated effective contributions to and \ncommunications about continuous improvement \nand innovation \n1.6 \nCaptured insights, experiences and ideas for \nimprovements and incorporate them into the \norganization’s knowledge management systems \nand future planning. \n2.   Resource \nImplications \nThe following resources should be provided: \n2.1   Impact evaluation materials (guide and form) \n3.   Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Interview \n3.2 Written Evaluation \n3.3 Case analysis \n4.   Context for \nAssessment \n4.1   Competency may be assessed individually in the \nactual workplace or simulation environment in \nTESDA accredited institutions\n",
