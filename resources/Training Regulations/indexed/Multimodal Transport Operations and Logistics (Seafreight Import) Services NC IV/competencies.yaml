        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Standard Operating procedures, forms and materials are\nstudied in accordance with Quality management systems.\n1.2 Business process manual of import manager is studied.\n1.3 Improvements and strategies are recommended to import\nmanager.\n1.4 Root cause /deviations are analyzed and classified in\naccordance with company parameters\n1.5 Preventive and corrective measures are recommended for\nimplementation\n2. Resource Implications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Internet\n2.5. Computer\n2.6. Printer\n2.7. Scanner\n2.8. Calculator\n2.9. Office Supplies\n2.10. Copier\n2.11. Mobile phone\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Written test\n3.2. Case analysis\n3.3. Demonstration with questioning\n3.4. Interview\n3.5. Observation\n4. Context of Assessment\n4.1. Competency maybe assessed in actual workplace\nor at the designated TESDA accredited\nAssessment Center.\n\n--- PDF PAGE 87 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n83\nUNIT OF COMPETENCY :\nOVERSEE THE COORDINATION WITH OVERSEAS\nAGENTS ON SHIPMENT STATUS PARTICULARLY\nON ANY IRREGULARITY\n\nUNIT CODE\n :"
        },
        "source_text": "MTO132302\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\noversee the import seafreight team’s performance..\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Familiarize\nwith company\nprotocols\n1.1Reporting Lines are\nidentified according\nto Company’s\norganizational\nstructure\n1.2 Reporting methods\nare learned and\ncomplied with in\naccordance with the\ncompany standards\n1.3 Standard\nOperating\nprocedures, forms\nand materials are\nobserved in\naccordance with\nQuality management\nsystems.\n1.1 Business Etiquette\n1.2 Business Writing\nand Verbal\ncommunication\n1.3 Reporting lines,\nmethods and style\n1.4 Quality\nmanagement\nsystems\n1.5 Occupational Safety\nand Health\nRequirements\n1.6 Environmental Laws\n1.7 Quality Management\nSystem\n1.8 Standard Operating\nProcedures\n1.9 Business Processes\n1.10\nQuality Manual\n1.1 Problem-solving\nskills\n1.2 Time\nmanagement\nskills\n1.3 Work planning\nand\norganizational\nskills\n1.4 Interpersonal\nskills\n1.5 Negotiation skills\n1.6 Result Oriented\nskills\n1.7 Communication\nskills\n\n2. Familiarize\noneself with the\nfunctions and\nresponsibilities\nof the Import\nsupervisor/\nManager\n2.1 Job Description of\nimport manager is\nfamiliarized in\naccordance with\ncompany policy\n2.2 Business process\nmanual of import\nmanager is studied\nin accordance with\ncompany rules and\nregulations.\n2.3 The methods and\napplications of\nimport supervisor’s/\nmanager’s\nresponsibilities and\nfunctions are\nobserved in\naccordance with\ncompany rules and\nregulations.\n2.1 Business Etiquette\n2.2 Business Writing\nand verbal\ncommunication\n2.3 Obligations and\nContracts\n2.4 Negotiable\nInstruments\n2.5 Job Description of\nImport Manager\n2.6 Occupational Safety\nand Health\nRequirements\n2.7 Environmental Laws\n2.8 Units of\nMeasurements\n2.9 Conversions of\nMeasurement\n