ed \nskills  \n5.7 Communication \nskills\n\n--- PDF PAGE 83 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n79 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5.25 Anti-piracy Act \n5.26 Non-disclosure \nAgreement \n5.27 Data privacy Act \n6. Record and \nanalyze \nirregularities in \nbusiness \nprocess. \n6.1 Irregularities and \ndeviations in the \nbusiness process \nare recorded in \naccordance with \ncompany policies. \n6.2 Root cause of \ndeviations are \nanalyzed  in \naccordance with \ncompany \nparameters \n6.3 Preventive and \ncorrective \nmeasures are \nrecommended and \nimplemented \n \n \n \n \n6.1 Business Etiquette \n6.2 Business Writing \n6.3 Obligations and \nContracts \n6.4 Negotiable \nInstruments \n6.5  Standard \nOperating \nProcedures, Forms \nand Materials \n6.6 Best Practices  \n6.7 Occupational \nSafety and Health \nRequirements \n6.8 Environmental \nLaws \n6.9 Units of \nMeasurements \n6.10 Conversions of \nMeasurement \n6.11  Calculation of \nCharges \n6.12 Estimation of \nMeasurements \n6.13  Currency \nConversion  \n6.14 Commodity \ncharacteristics, \nprohibitions and \nrestrictions \n6.15 Weight and \nbalance \n6.16 Quality \nManagement \nSystem \n6.17 Standard \nOperating \nProcedures  \n6.18 Key Results Areas \nand Key \nPerformance \nIndicators \n6.19 Quality Manual \n6.1 Problem-solving \nskills  \n6.2 Time \nmanagement \nskills \n6.3 Work planning \nand \norganizational \nskills \n6.4 Result Oriented \nskills \n6.5 Communication \nskills  \n6.6 Statistical \nanalysis skills \n6.7 Root cause \nanalysis\n\n--- PDF PAGE 84 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n80 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Reporting lines \nMay include: \n1.1. \nOrganizational chart \n1.2. \nProcess flow chart \n1.3. \nEmployees manual / handbook \n2. Reporting methods and \nstyle \nMay include: \n2.1. \nPeriodic