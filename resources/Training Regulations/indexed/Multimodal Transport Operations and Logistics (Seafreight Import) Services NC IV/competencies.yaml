        "source_text": "MTO132306\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto ensure the integrity and completeness of reports derived\nfrom the data gathered for reportorial requirements and\nbusiness decisions.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Familiarize with\nreports for\ninternal use and\nfor statutory\npurposes.\n1.1 Different types of\ninternal reports\nare identified in\naccordance with\nthe company\npolicies\n1.2 Standard\noperating\nprocedures,\nforms, and\nmaterials in\naccordance with\ncompany policies\nare studied.\n1.3 Schedule to\nobserve actual\npreparation of\nreports in\naccordance with\ncompany policies\nand procedures is\narranged.\n\n1.1 Business Etiquette\n1.2 Business Writing\n1.3 Standard Operating\nProcedures, Forms,\nand Materials\n1.4 Units of\nMeasurements\n1.5 Graphs\n1.6 Statistical data\n1.7 Chronology\n1.8 Quality Management\nSystem\n1.9 Standard Operating\nProcedures\n1.10 Key Performance\nIndicators\n1.11 Business Processes\n1.1 Time\nmanagement\nskills\n1.2 Work planning\nand\norganizational\nskills\n1.3 Interpersonal\nskills\n1.4 Result Oriented\n1.5 Communication\nskills\n1.6 Analytical thinking\n\n2. Identify and\norganize the\nkind of data\nrequired for\nreport\npreparations.\n\n2.1 Sources and\ntypes of\ninformation\nneeded with all\nseafreight import\nemployees is\nidentified\n2.2 Checklist for the\ndata required is\nprepared based on\nreport needed.\n\n2.1 Business Etiquette\n2.2 Business Writing\n2.3 Standard Operating\nProcedures, Forms and\nMaterials\n2.4 Occupational Safety\nand Health\nRequirements\n2.5 Units of Measurements\n2.6 Conversions of\nMeasurement\n2.7 Commodity\ncharacteristics,\nprohibitions, and\nrestrictions\n2.8 Weight and balance\n2.9 Computer operation\n2.1 Problem-solving\nskills\n2.2 Time\nmanagement\nskills\n2.3 Work planning\nand\norganizational\nskills\n2.4 Interpersonal\nskills\n2.5 Result Oriented\n2.6 Communication\nskills\n\n--- PDF PAGE 107 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n103\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n2.3 Timeline,\nmethodology,\nand sources of\ndata are\ncommunicated to\nimport sea freight\nstaff in accordance\nwith the checklist.\n2.10 Quality Management\nSystem\n2.11 Standard Operating\nProcedures\n2.12 Key Result Areas\nIndicators\n2.13 Data privacy Act\n3. Conduct data\ngathering\n3.1 Data to be\ngathered is\nassigned to import\nsea freight staff in\naccordance with\ntheir respective\nfunction.\n3.2 Data gathering is\nmonitored based on\ncompany policies.\n3.3 Data gathered is\nreviewed in\naccordance with\nestablished\nprocedures.\n\n3.1 Business Etiquette\n3.2 Business Writing\n3.3 Standard Operating\nProcedures, Forms and\nMaterials\n3.4 Units of Measurements\n3.5 Conversions of\nMeasurement\n3.6 Calculation of Charges\n3.7 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n3.8 Computer operation\n3.9 Quality Management\nSystem\n3.10 Key Performance\nIndicators\n3.1 Problem-solving\nskills\n3.2 Time\nmanagement\nskills\n3.3 Work planning\nand\norganizational\nskills\n3.4 Interpersonal\nskills\n3.5 Result Oriented\n3.6 Communication\n3.7 Critical Thinking\n3.8 Risk\nManagement\n\n4. Evaluate report\n4.1 Data gathered is\nvalidated for\naccuracy and\ncompleteness\nbased on required\nreport\n4.2 Data gathered is\nsegregated\naccording to report\nrequirement\n4.3 Recommendation/s\nbased on the\nanalysis of data is\npresented to\nsuperior authority in\naccordance with\nreportorial\nrequirements.\n\n4.1 Business Etiquette\n4.2 Business Writing\n4.3 Standard Operating\nProcedures, Forms and\nMaterials\n4.4 Units of Measurement\n4.5 Conversions of\nMeasurement\n4.6 Declared Value of\ngoods\n4.7 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n4.8 Computer operation\n4.9 Quality Management\nSystem\n4.10 Standard Operating\nProcedures\n4.11 Key Performance\nIndicators\n4.12 Business Processes\n\n4.1 Problem-solving\n4.2 Time\nmanagement\n4.3 Work planning\nand\norganizational\nskills\n4.4 Interpersonal\nskills\n4.5 Negotiation skills\n4.6 Result Oriented\n4.7 Communication\nskills\n\n--- PDF PAGE 108 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n104\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Different types of internal\nreports\nMay include:\n1.1.\nCargo Statistics\n1.2.\nProduction/ performance reports\n1.3.\nKey performance indicators\n1.4.\nIncident Reports\n1.5.\nCorrective Action Plan\n2. Standard operating\nprocedure, forms and\nmaterials\nMay include :\n2.1.\nQuality Management System\n2.2.\nOperating manual / business process manual\n2.3.\nWork instructions manual\n2.4.\nCompany Standard Forms\n2.5.\nLetter Head\n2.6.\nLogos and templates\n3. Irregularities\nMay include:\n3.1.\nVolume and weight\n3.2.\nPort of discharge\n3.3.\nShortshipped or shortlanded shipments\n3.4.\nBill of lading number\n3.5.\nImporter / shipper / notify party\n3.6.\nManner of packaging\n3.7.\nMarks and number\n3.8.\nTypographical error\n3.9.\nFreight terms\n4. Action plan\nMay include:\n4.1.\nPreventive Action\n4.2.\nCorrective Action Plan\n4.3.\nRisk Management\n4.4.\nCost Reduction Program\n4.5.\nEnvironment Protection Program\n5. Sources and types of\ninformation\nMay include:\n5.1.\nManifest\n5.2.\nBill of lading\n5.3.\nInvoice\n5.4.\nPacking list\n5.5.\nDelivery order / delivery receipt\n5.6.\nCertificate of origin\n5.7.\nSafety data sheet\n5.8.\nDangerous goods declaration\n5.9.\nImport permits\n5.10. Load port survey report / discharge port survey\nreport\n5.11. Tariff and customs code of the Philippine\n5.12. Import entry and internal revenue declaration\n5.13. Value added service provider\n5.14. Government agencies related to import and export\ntrade transaction\n\n--- PDF PAGE 109 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n105\nVARIABLE\nRANGE\n6. Timeline, methodology,\nand sources of data\nMay include:\n6.1.\nDeadline\n6.2.\nPrescription\n6.3.\nGantt chart for various activities\n6.4.\nRoot cause analysis\n6.5.\nStrategic planning\n6.6.\nManagement review\n6.7.\nAudit plan and schedule\n7. Data gathering\nMay include:\n7.1.\nSurvey\n7.2.\nObservation and audit results\n7.3.\nQuestionnaire\n7.4.\nFocus group discussion\n7.5.\nRecords\n7.6.\nLiteratures\n7.7.\nAdvisories, memos, and circulars\n8. Checklist\nMay include :\n8.1.\nAudit checklist\n8.2.\nDocument checklist\n8.3.\nGuidelines\n8.4.\nStandard forms\n8.5.\nDocumented procedure\n8.6.\nPreventive maintenance checklist\n\n--- PDF PAGE 110 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n106\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Timeline, methodology, and sources of data are\nfamiliarized to all import staff.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Computer with Internet\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written test\n3.2. Case study\n3.3. Demonstration with questioning\n3.4. Interview\n3.5. Observation\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace\nor at the designated TESDA accredited\nAssessment Center.\n\n--- PDF PAGE 111 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n107"
