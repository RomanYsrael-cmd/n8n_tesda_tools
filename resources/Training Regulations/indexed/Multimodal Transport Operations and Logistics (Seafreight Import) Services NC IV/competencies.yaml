        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Timeline, methodology, and sources of data are\nfamiliarized to all import staff.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4. Computer with Internet\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written test\n3.2. Case study\n3.3. Demonstration with questioning\n3.4. Interview\n3.5. Observation\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace\nor at the designated TESDA accredited\nAssessment Center.\n\n--- PDF PAGE 111 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n107"
