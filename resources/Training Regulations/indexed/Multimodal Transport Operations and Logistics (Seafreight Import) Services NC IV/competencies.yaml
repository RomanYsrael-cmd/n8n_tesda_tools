        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate \nunderstands: \n1.1 Pre-alerts and shipment notices are monitored regularly as \nto cargo departures, routings and arrivals. \n1.2 Incoming shipments are checked according to accuracy of \ninformation and details of shipments based on the shipping \ndocuments   \n1.3 Discrepancies and inconsistencies on the shipping \ndocuments are verified and corrected with the overseas \nagents. \n1.4 Details of discrepancy is resolved and approved within the \nspecified time of submission of e-manifest with the Bureau \nof Customs. \n1.5 Applicable Charges, fees, and penalties as a result of \ndiscrepancy are communicated and agreed upon with \noverseas agent. \n1.6 Type of bill of lading is determined. \n1.7 Requirements for the release of delivery order are complied \nwith.  \n2. Resource Implications \nThe following resources should be provided: \n2.1 Fax machine \n2.2 Telephone \n2.3 Writing materials \n2.4 Internet \n2.5 Computer \n3. Methods of Assessment \nCompetency may be assessed through: \n3.1 Written test \n3.2 Case analysis \n3.3 Demonstration with questioning \n3.4 Interview \n3.5 Observation \n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace or \nat the designated TESDA accredited Assessment Center.",
