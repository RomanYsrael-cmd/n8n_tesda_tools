        "source_text": "MTO432201\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to apply\nfreight forwarding documentation services and workplace\nprocedures. It includes identifying major areas of the\nworkplace in terms of workload, ethical practices and\npersonal daily routine.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify major\nareas of the\nworkplace\n\n1.1 The layout of the\nworkplace, the flow\nof materials and\ngoods/stocks (where\nrelevant) and the\nworkplace\nprocedures in each\nwork area are\nidentified\n1.2 Organizational\nstructure of the\nworkplace and the\nrelationship of\nstructure to each\noccupation and\nclassification\ngrouping is outlined\n1.3 Individual\nresponsibilities\nunder agents,\nvendors, & clients\nagreements are\nidentified and acted\non in the conduct of\nassigned duties\n1.4 Workplace hazards\nare identified and\nrelated hazard\nminimization\nprocedures followed\n1.5 Relevant personal\nprotective\nequipment (PPE)\nare identified and\ncorrectly used in\naccordance with\nregulations and\nworkplace\nrequirements\n\n1.1 Site or workplace\nlay-out\n1.2 Flow of materials\nand goods/stocks\n1.3 Workplace\nprocedures in each\nwork area\n1.4 Workplace\nstructures and the\nroles and\nresponsibilities of\nteam/group\nmembers\n1.5 Conditions of\nservice including\nemployer and\nemployee\nobligations,\nemployment\ncontract\n1.6 Emergency\nprocedures\n1.7 Workplace hazards\nand related hazard\nminimization\nprocedures\n1.8 Personal protective\nequipment (PPE)\nand instructions of\nits use\n1.9 Basic\nMathematics\n1.10 Operation of\ncomputer and\nappropriate\nsoftware\n1.1 Communicating\neffectively with\nothers when\ncompleting\nworkplace\norientation and\ninduction\nprocedures\n1.2 Interpreting\ninstructions,\nprocedures,\ninformation and\nsigns relevant to\nwork activities\n1.3 Working\ncollaboratively with\nothers when\ncompleting\nworkplace\norientation and\ninduction\nprocedures\n1.4 Risk management\n1.5 Working\nsystematically with\nrequired attention to\ndetail without injury\nto self or others, or\ndamage to goods or\nequipment\n1.6 Identifying and\ncorrectly using\nequipment,\nprocesses and\nprocedures\n\n--- PDF PAGE 49 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n45\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.6 Workplace\nemergency\nprocedures are\nidentified and\nfollowed in real and\nsimulated situation\n1.7 Selecting and using\nrequired personal\nprotective\nequipment\nconforming to\nindustry and OS&H\nstandards\n2. Plan and\norganize an\nassigned daily\nroutine\n\n2.1 Daily routine is\nplanned to take into\naccount rosters,\nindustrial\nagreements, agents,\nvendors, client’s\nagreements, and\nworkplace\nprocedures\n2.2 Clarification of\nrequirements of\ntasks is sought\nwhen appropriate\n2.3 Achievable time and\nother performance\nmeasures/criteria\nare agreed\n\n2.1 Ways of planning\ndaily routine to take\ninto account\nrosters, industrial\nagreements and\nworkplace\nprocedures\n2.2 Techniques of\nclarifying\nrequirements of\ntasks\n2.3 Relevant OS&H\nand environmental\nprotection\nprocedures and\nguidelines\n2.4 Basic Mathematics\n2.5 Operation of\ncomputer and\nappropriate\nsoftware\n2.1 Planning daily\nroutine taking into\naccount rosters,\nindustrial\nagreements and\nworkplace\nprocedures\n2.2 Seeking clarification\nof requirements of\ntasks when\nappropriate\n2.3 Agreeing achievable\ntime and other\nperformance\nmeasures\n\n3.1 Organize and\naccept\nresponsibility\nfor assigned\nworkload\n\n3.1 Priorities, schedules\nand deadlines are\nestablished in\nconsultation with\nconcerned parties\n3.2 Work activities are\nplanned and\nprogress of work is\ncommunicated to\nothers whose\npersonal work plans\nand timelines may\nbe affected\n3.3 Work is completed\nto the standard\nexpected in the\nworkplace and in\naccordance with any\nguidelines,\ndirections or\ninstructions/\ninformation\n\n3.1 Ways of\nestablishing\npriorities and\ndeadlines\n3.2 Work planning and\nmethod of\ncommunicating\nwork progress to\nothers\n3.3 Company work\nguidelines,\ndirections or\ninstructions\n3.4 Workplace\nstructures and the\nroles and\nresponsibilities of\nteam/group\nmembers\n3.5 Leadership\nConcepts:\n3.5.1 Types of\nDecisions\nTeams Make\n3.1 Prioritizing and\nmeeting deadlines\n3.2 Planning and\ncommunicating work\nprogress to others\n3.2 Completing work\nto the expected\nstandard in the\nworkplace and in\naccordance with\nany guidelines,\ndirections\n3.3 Leading\n3.4 Communicating\nadditional support\nto improve work to\nappropriate\npersonnel\n\n--- PDF PAGE 50 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n46\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.4 Additional support to\nimprove work is\ncommunicated\nclearly to\nappropriate\npersonnel\n3.5.2 Team\nResponsibilities\n3.5.3 Problems That\nAffect Teams\n3.5.4 Building Strong\nTeam\nCommunication\n3.5.5 Team Problem-\nSolving\n3.6 Relevant OS&H\nand environmental\npractices and\nguidelines\n3.7 Basic Mathematics\n3.8 Work Planning\n3.9 Workplace\nstructures and roles\nand responsibilities\nof team members\n3.10\nOperation of\ncomputer and\nappropriate\nsoftware\n4 Apply ethical\npractices\n\n4.1 Workplace\nprocedures,\nregulations and\nlegislation\nappropriate to the\nposition are\nidentified and\nfollowed\n4.2 Commitments and\nundertakings to\nclients, colleagues\nand supervisors are\nmet\n4.3 Required\nconfidentiality is\nmaintained\n4.4 Appropriate codes\nof acceptable and\nethical work\npractices are\napplied\n4.5 Workplace security\npolicies are\nidentified\n\n4.1 Workplace\nprocedures,\nregulations and\nlegislation\n4.2 Company\nenterprise policy on\ncommitments and\nundertakings to\nclients, colleagues\nand supervisors are\nmet\n4.3 Techniques of\nmaintaining\ncompany\nconfidentiality\n4.4 Company work\nethics\n4.5 Workplace security\npolicies\n4.6 Relevant OS&H\nand environmental\nprotection\nprocedures and\nguidelines\n4.7 Basic Mathematics\n4.8 Operation of\ncomputer and\nappropriate\nsoftware\n4.1 Identifying and\nfollowing workplace\nprocedures,\nregulations and\nlegislation\n4.2 Meeting\ncommitments and\nundertakings to\nclients, colleagues\nand supervisors\n4.3 Maintaining\nrequired\nconfidentiality\n4.4 Applying appropriate\ncodes of acceptable\nand ethical work\npractices\n4.5 Following workplace\nsecurity policies\n\n--- PDF PAGE 51 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Workplace Procedures\nMay include:\n1.1\nCompany procedures\n1.2\nEnterprise procedures\n1.3\nOrganizational procedures\n1.4\nEstablished departmental procedures\n1.5\nWork Procedure / Processes Flow\n2. Hazards\n\nMay include:\n2.1\nVehicular traffic and pedestrians\n2.2\nUneven ground, steps, road surfaces, work\nsurfaces\n2.3\n Dust and vapors\n2.4\nHazardous or dangerous materials\n2.5\nHumidity, air temperature and radiant heat\n2.6\nLight including UV rays\n2.7\nNoise\n2.8\nWorking at heights\n3. Personal Protective Equipment\n(PPE)\nMay include:\n3.1\nDust mask\n3.2\nHard Hat\n3.3\nSafety shoes\n3.4\nGloves\n3.5\nSafety goggles\n3.6\nEar muff/ear plug\n3.7\nSunscreen\n3.8\nHigh visibility clothing\n3.9\nCover all Thermal jacket/pants\n3.10 Harness\n4. Instructions/information\nMay include:\n4.1\nWorkplace procedures, checklists and\ninstructions\n4.2\nOperations manuals\n4.3\nInduction/orientation documentation\n4.4\nCompetency standards and training materials\n4.5\nJob specification, site/workplace map and details\nof organization structure\n4.6\nConditions of service, relevant legislation,\nregulations and related documentation\n4.7\nAward, enterprise bargaining agreement, agents,\nvendors, & clients agreements\n4.8\nRelevant codes of practice including the national\nstandards for manual handling and the industry\nsafety code\n4.9\nSupplier and/or client instructions\n4.10 Manifests, bar codes, goods and container\nidentification\n4.11 Goods identification numbers and codes\n4.12 Manufacturers specifications\n4.13 Material safety data sheets\n4.14 Quality assurance procedures\n4.15 Emergency procedures\n4.16 Accident procedures\n4.17 Security procedures\n\n--- PDF PAGE 52 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n48\nVARIABLE\nRANGE\n5. Appropriate Personnel\nMay include:\n5.1\nManagers\n5.2\nSupervisors/team leaders\n5.3\nWorkplace personnel\n5.4\nContractors\n5.5\nOfficial representatives\n5.6\nIndustrial relations\n5.7\nOS&H specialists\n5.8\nSupport staff\n5.9\nEmergency response team\n5.10 Other professional or technical staff\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified the layout of the workplace, the flow of materials and\ngoods (where relevant) and the workplace procedures in each\nwork area\n1.2 Identified and followed workplace emergency procedures in real\nand simulated emergency situation\n1.3 Planned work activities and communicated progress of work to\nothers whose personal work plans and timelines may be affected\n1.4 Completed work to the standard expected in the workplace and\nin accordance with any guidelines, directions or instructions/\ninformation\n1.5 Identified and followed workplace procedures, regulations and\nlegislation appropriate to the position\n1.6 Applied appropriate codes of acceptable and ethical work\npractices\n1.7 Planned daily routine to take into account rosters, agents,\nvendors, clients agreements and workplace procedures\n1.8 Applied appropriate codes of acceptable and ethical work\npractices\n\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials and new technologies relevan