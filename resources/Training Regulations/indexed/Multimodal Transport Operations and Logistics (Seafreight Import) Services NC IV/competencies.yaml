ated in \naccordance to \ncompany policy.  \n5.3 Improvement of \nbusiness processes \nare discussed and \nagreed upon by the \nimport seafreight \nteam in accordance \nwith company policy \nand procedure. \n5.4 Update company \nprocedures based on \ngovernment rules \nand new business \npractices  \n \n \n5.1 Business Etiquette \n5.2 Business Writing  \n5.3 Obligations and \nContracts \n5.4 Negotiable \nInstruments \n5.5 Performance \nReview Guidelines \nand Procedures \n5.6 Occupational \nSafety and Health \nRequirements \n5.7 Environmental \nLaws \n5.8 Units of \nMeasurement \n5.9 Conversions of \nMeasurement \n5.10  Calculation of \nCharges \n5.11 Estimation of \nMeasurements  \n5.12 Currency \nConversion  \n5.13 Commodity \ncharacteristics, \nprohibitions and \nrestrictions \n5.14 Weight and \nbalance \n5.15 Geography \n5.16 Computer \noperations \n5.17 Quality \nManagement \nSystem \n5.18 Standard \nOperating \nProcedures \n5.19  Key Results \nAreas and Key \nPerformance \nIndicators \n5.20 Business \nProcesses \n5.21 Quality Operations \nManual \n5.22 Anti-trust \nregulations \n5.23 Anti-corruption \npolicies \n \n5.1 Problem-solving \nskills \n5.2 Time management \nskills \n5.3 Work planning and \norganizational skills \n5.4 Interpersonal skills \n5.5 Negotiation skills  \n5.6 Result Oriented \nskills \n5.7 Communication \nskills\n\n--- PDF PAGE 76 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n72 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5.24 Anti-piracy Act \n5.25 Non-disclosure \nAgreement \n5.26 Data privacy Act \n6.  Pre-evaluate \npotential suppliers \n6.1 Suppliers of required \ngoods/materials/servi\nces are identified in \naccordance with \nworkplace \nrequirements and \nregulatory procedures \n6.2 Comparative costing \nfor required \ngoods/materials/servi\nces are obtained in \naccordance with \nworkplace and \nregulatory procedures \n6.3 Supplier’s ability to \nprovide a consistent \nlevel of performance \nis assessed in \naccordance with \nworkplace and \nregulatory procedures \n6.4 Suppliers are \nevaluated in relation \nto performance, price, \nand established \ncriteria in accordance \nwith workplace and \nregulatory procedures \n6.5 Supplier selection \nprocess outcomes are \ndocumented including \nrecommendations for \naction on agreements \nwith selected \nsuppliers in \naccordance with \nworkplace and \nregulatory procedures \n6.7 Data generated \nduring selection \nprocess is filed and \nmaintained in \naccordance with \nworkplace \nprocedures \n6.1 Business Etiquette \n6.2  Business Writing \n6.3  Obligations and \nContracts \n6.4 Negotiable \nInstruments  \n6.5 Occupational \nSafety and Health \nRequirements \n6.6 Environmental \nLaws \n6.7 Units of \nMeasurements \n6.8 Conversions of \nMeasurement \n6.9 Calculation of \nCharges \n6.10 Currency \nConversion  \n6.11 Commodity \nclassification, \ncharacteristics, \nprohibitions and \nrestrictions \n6.12 Weight and \nbalance \n6.13 Geography \n6.14 Tools and Material \nHandling \nEquipment \n6.15 Computer \noperations \n6.16 Quality \nManagement \nSystem \n6.17 Standard \nOperating \nProcedures \n6.18 Key Performance \nIndicators \n6.19 Quality Operations \nManual \n6.1 Problem-solving \nskills \n6.2 Time management \nskills \n6.3  Work planning and \norganizational skills \n6.4 Interpersonal skills \n6.5 Negotiation skills \n6.6  Result Oriented \nskills \n6.7  Communication \nskills\n\n--- PDF PAGE 77 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n73 \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business process manuals \nMay include: \n1.1. \nPersonnel Handbook \n1.2. \nProcess Manual \n1.3. \nGovernment Regulations; Policies and Guidelines \n1.4. \nSafety Manual \n1.5. \nIndustry Regulations; policies and guidelines \n2. Business process \nMay include: \n2.1. \nImport Seafreight Process \n2.2. \nImport Cargo Handling Process \n2.3. \nImport Documentation Process \n3. Forms and materials \nMay include: \n3.1. \nTransport Documents \n3.2. \nImport Documents \n3.3. \nImport Manifest  \n3.4. \nCorporate Document \n3.5. \nNegotiable Instrument \n4. Irregularities \nMay include: \n4.1. \nOver and Undercharging  \n4.2. \nErrors and omissions  \n4.3. \nConnivance and collusion  \n5. Policies and regulations on \nseafreight import \nMay include: \n5.1. \nAutomated process of documentation \n5.2. \nLate submission of manifest and amendment  \n5.3. \nMisrouting, erroneous documentation  \n \n6. Information \nMay include : \n6.1. \nNew regulation  \n6.2. \nNew procedure \n6.3. \nCurrent applicable Rates \n6.4. \nNew Business Practices \n7. Rewards, recognition and \nsanctions \nMay include: \n7.1. \nPenalty \n7.2. \nFringe Benefit \n7.3. \nPromotion \n7.4. \nIncentives  \n7.5. \nPerks \n7.6. \nAwards \n8. Corrective measures \nMay include: \n8.1. \nScrapping of obsolete procedures \n8.2. \nIntroduction of more affective system \n8.3. \nSWOT analysis   \n9. Discrepancies / deviations \nMay include: \n9.1. \nNon-conforming activities \n9.2. \nUnproductive activities \n9.3. \nRedundant process \n10. Performance review result \nand outcome \nMay include: \n10.1. Focused interview  \n10.2. Written  \n10.3. Actual\n\n--- PDF PAGE 78 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n74 \n  EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Study the business process standard operating \nprocedure, forms and materials in accordance with \ncompany policies and procedures \n1.2 Policies and regulations on sea freight import are \ncommunicated with employees through orientation \nactivities.   \n1.3 Poor performances are analyzed and corrective \nmeasures are introduced. \n1.4 Discrepancies / deviations in the output are identified \nbased on business process \n1.5 Contractors are evaluated in relation to established \ncriteria and in accordance with workplace and regulatory \nprocedures \n1.6 Contractor selection process outcomes are documented \nincluding recommendations for actions on \nagreements/contracts with selected contractors \n \n2. Resource Implications \nThe following resources should be provided: \n2.1. \nFax machine \n2.2. \nTelephone \n2.3. \nWriting materials \n2.4. \nInternet \n2.5. \nForms  \n2.6. \nComputer \n \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. \nWritten test \n3.2. \nDemonstration with questioning \n3.3. \nInterview \n3.4. \nObservation \n4. Context of Assessment \n4.1. \nCompetency maybe assessed in actual workplace \nor at the designated TESDA accredited \nAssessment Center.\n",
