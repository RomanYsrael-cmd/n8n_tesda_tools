        "source_text": "500311401\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto use specialized communication skills to meet specific\nneeds of internal and internal clients, conduct interviews,\nfacilitate discussion with groups, and contribute to the\ndevelopment of communication strategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n1.1 Specific\ncommunication\nneeds of clients\nand colleagues\nare identified\nand met\n1.2 Different\napproaches are\nused to meet\ncommunication\nneeds of clients\nand colleagues\n1.3 Conflict is\naddressed\npromptly in a\nmanner which\ndoes not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n1.3 Communication\nskills relevant to\nclient groups\n1.4 Flexibility in\ncommunication\n\n1.1 Full range of\ncommunication\ntechniques\nincluding:\n1.1.1 Effective\ncommunication\nprocess\n1.1.2 Active listening\n1.1.3 Giving/ receiving\nfeedback\n1.1.4 Interpretation of\ninformation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.1.8 Conduct seminars\n1.1.9 Public speaking\n1.2 Communication skills\nrequired to fulfill job\nroles as specified\nby the organization\n\n--- PDF PAGE 8 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for\ninternal and external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work related network\nand relationship are\nmaintained\n2.5 Negotiation and\nconflict resolution\nstrategies are used\nwhere required\n2.5 Communication with\nclients and colleagues\nis performed\nappropriate to\nindividual needs and\norganizational\nobjectives\n2.1 Communication\nprocess\n2.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n2.3 Openness and\nflexibility in\ncommunication\n2.4 Communication\nskills relevant to\nclient groups\n\n2.1 Full range of\ncommunication\ntechniques including:\n2.1.1 Effective\ncommunication\nprocess\n2.1.2 Active listening\n2.1.3 Giving/ receiving\nFeedback\n2.1.4 Interpretation of\ninformation\n2.1.5 Role boundaries\nsetting\n2.1.6 Negotiation\n2.1.7 Establishing\nempathy\n2.1.8 Openness and\nflexibility in\ncommunication\n2.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n3. Deliver a\ntechnical\npresentation\n3.1 Presentation is\ndelivered clearly,\nsequential and\ndelivered within allotted\ntime\n3.3 Utilize appropriate\nmedia to enhance\npresentation\n3.4 Differences in\nviews/opinions are\nrespected\n3.5 Questions during fora\nare responded in a\nmanner consistent with\norganizational standard\n3.1 Communication\nprocess\n3.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n3.3 Openness and\nflexibility in\ncommunication\n3.4 Communication\nskills relevant to\nclient groups\n\n3.1 Full range of\ncommunication\ntechniques including:\n3.1.1 Effective\ncommunication\nprocess\n3.1.2 Active listening\n3.1.3 Giving/receiving\nfeedback\n3.1.4 Interpretation of\ninformation\n3.1.5 Role boundaries\nsetting\n3.1.6 Negotiation\n3.1.7 Establishing\nempathy\n3.1.8 Openness and\nflexibility in\ncommunication\n3.19 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 9 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n5\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Represent the\norganization\n4.1 When participating in\ninternal or external\nforums, presentation\nis relevant,\nappropriately\nresearched and\npresented in a manner\nto promote the\norganization\n4.2 Presentation is clear\nand sequential and\ndelivered within a\npredetermined time\n4.3 Utilize appropriate\nmedia to enhance\npresentation\n4.4 Differences in views\nare respected\n4.5 Written\ncommunication is\nconsistent with\norganizational\nstandards\n4.6 Inquiries are\nresponded in a\nmanner consistent\nwith organizational\nstandard\n4.7 Consolidate ideas and\nsuggestions\n4.8 Generalize and\nsummarize all ideas\nand suggestions\n\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n4.3 Openness and\nflexibility in\ncommunication\n4.4 Communication\nskills relevant to\nclient groups\n\n4.1 Full range of\ncommunication\ntechniques including:\n 4.1.1 Effective\n communication\n process\n 4.1.2 Active listening\n 4.1.3 Giving/ receiving\n Feedback\n 4.1.4 Interpretation of\n information\n 4.1.5 Role boundaries\n setting\n 4.1.6 Negotiation\n 4.1.7 Establishing\nempathy\n 4.1.8 Openness and\nflexibility in\ncommunication\n4.2 Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n--- PDF PAGE 10 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n6\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Facilitate group\ndiscussion\n5.1 Mechanisms which\nenhance effective group\ninteraction is defined\nand implemented\n5.2 Strategies which\nencourage all group\nmembers to participate\nare used routinely\n5.3 Objectives and agenda\nfor meetings and\ndiscussions are routinely\nset and followed\n5.4 Relevant information is\nprovided to group to\nfacilitate outcomes\n5.5 Evaluation of group\ncommunication\nstrategies is undertaken\nto promote participation\nof all parties\n5.6 Specific communication\nneeds of individuals are\nidentified and addressed\n5.1 Communication\nprocess\n5.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n5.3 Openness and\nflexibility in\ncommunication\n5.4 Communication\nskills relevant to\nclient groups\n\n5.1 Full range of\ncommunication\ntechniques\nincluding:\n5.1.1 Effective\ncommunication\nprocess\n5.1.2 Active listening\n5.1.3 Giving/receiving\nfeedback\n5.1.4 Interpretation of\ninformation\n5.1.5 Role boundaries\nsetting\n5.1.6 Negotiation\n5.1.7 Establishing\nempathy\n5.1.8 Openness and\nflexibility in\ncommunication\n5.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n6. Conduct\ninterview\n6.1 A range of appropriate\ncommunication\nstrategies are employed\nin interview situations\n6.2 Records of interviews\nare made and\nmaintained in\naccordance with\norganizational\nprocedures\n6.3 Effective questioning,\nlistening and nonverbal\ncommunication\ntechniques are used to\nensure that required\nmessage is\ncommunicated\n6.1 Communication\nprocess\n6.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n6.3 Effective\nquestioning\ntechniques\n6.3 Communication\nskills relevant to\nclient groups\n\n6.1 Full range of\ncommunication\ntechniques\nincluding:\n6.1.1 Effective\ncommunication\nprocess\n6.1.2 Active listening\n6.1.3 Giving/ receiving\nfeedback\n6.1.4 Interpretation of\ninformation\n6.1.5 Role boundaries\nsetting\n6.1.6 Negotiation\n6.1.7 Establishing\nempathy\n6.2 Effective clarifying\nand probing\ntechniques\n(questioning skills)\n6.3 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 11 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\nMay include:\n1.1 Recognizing own limitations\n1.2 Referral to specialists\n1.3 Utilizing techniques and aids\n1.4 Providing written drafts\n1.5 Verbal and non verbal communication\n2. Effective group\ninteraction\nMay include:\n2.1 Identifying and evaluating what is occurring\nwithin an interaction in a non judgmental way\n2.2 Using active listening\n2.3 Making decision about appropriate words,\nbehavior\n2.4 Putting together response which is culturally\nappropriate\n2.5 Expressing an individual perspective\n2.6 Expressing own philosophy, ideology and\nbackground and exploring impact with\nrelevance to communication\n2.7 Openness and flexibility in communication\n3. Types of Interview\nMay include:\n3.1 Related to staff issues\n3.2 Routine\n3.3 Confidential\n3.4 Evidential\n3.5 Non disclosure\n3.6 Disclosure\n4. Interview situations\nMay include:\n4.1 Establish rapport\n4.2 Elicit facts and information\n4.3 Facilitate resolution of issues\n4.4 Develop action plans\n4.5 Diffuse potentially difficult situation\n\n--- PDF PAGE 12 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n8\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated effective communication skills\nwith clients accessing service and work\ncolleagues\n1.2 Adopted relevant communication techniques\nand strategies to meet client particular needs\nand difficulties\n2. Resource Implications\n2.1 Access to appropriate workplace where\nassessment can take place\n\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Case Study\n3.2 Interview\n3.3 Portfolio\n3.4 Written Test\n3.5 Role Play\n\n4. Context for Assessment\n4.1 This unit should be assessed on the job\nthrough simulation\n\n--- PDF PAGE 13 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n9\nUNIT OF COMPETENCY:\nDEVELOP AND LEAD TEAMS\n\nUNIT CODE\n:"
