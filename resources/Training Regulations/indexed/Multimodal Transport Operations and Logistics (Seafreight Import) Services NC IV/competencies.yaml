rs and omissions \n12.4. Key performance Indicators \n13. Current market trends, \nbusiness practices, and \nnew industry regulations. \nMay include: \n13.1. Trade statistics  \n13.2. New government regulations \n13.3. Automated processes  \n13.4. Regulatory and statutory requirement \n13.5. Outsourcing and offshoring  \n14. Improvements and \nstrategies \nMay include: \n14.1. Law and government  \n14.2. Fishbone analysis \n14.3. Six sigma \n14.4. Certifications \n14.5. Right-sizing of manpower \n14.6. Human resource development \n14.7. Business development\n\n--- PDF PAGE 86 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n82 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Standard Operating procedures, forms and materials are \nstudied in accordance with Quality management systems. \n1.2 Business process manual of import manager is studied. \n1.3 Improvements and strategies are recommended to import \nmanager. \n1.4 Root cause /deviations are analyzed and classified in \naccordance with company parameters \n1.5 Preventive and corrective measures are recommended for \nimplementation \n2. Resource Implications \nThe following resources should be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Writing materials \n2.4. Internet \n2.5. Computer \n2.6. Printer \n2.7. Scanner \n2.8. Calculator \n2.9. Office Supplies \n2.10. Copier \n2.11. Mobile phone \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. Written test \n3.2. Case analysis \n3.3. Demonstration with questioning \n3.4. Interview \n3.5. Observation \n4. Context of Assessment \n4.1. Competency maybe assessed in actual workplace \nor at the designated TESDA accredited \nAssessment Center.\n",
