 \nits use \n1.9 Basic \nMathematics \n1.10 Operation of \ncomputer and \nappropriate \nsoftware \n1.1 Communicating \neffectively with \nothers when \ncompleting \nworkplace \norientation and \ninduction \nprocedures \n1.2 Interpreting \ninstructions, \nprocedures, \ninformation and \nsigns relevant to \nwork activities \n1.3 Working \ncollaboratively with \nothers when \ncompleting \nworkplace \norientation and \ninduction \nprocedures \n1.4 Risk management \n1.5 Working \nsystematically with \nrequired attention to \ndetail without injury \nto self or others, or \ndamage to goods or \nequipment \n1.6 Identifying and \ncorrectly using \nequipment, \nprocesses and \nprocedures\n\n--- PDF PAGE 49 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n45 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.6 Workplace \nemergency \nprocedures are \nidentified and \nfollowed in real and \nsimulated situation  \n1.7 Selecting and using \nrequired personal \nprotective \nequipment \nconforming to \nindustry and OS&H \nstandards \n2. Plan and \norganize an \nassigned daily \nroutine \n \n2.1 Daily routine is \nplanned to take into \naccount rosters, \nindustrial \nagreements, agents, \nvendors, client’s \nagreements, and \nworkplace \nprocedures \n2.2 Clarification of \nrequirements of \ntasks is sought \nwhen appropriate \n2.3 Achievable time and \nother performance \nmeasures/criteria \nare agreed \n \n2.1 Ways of planning \ndaily routine to take \ninto account \nrosters, industrial \nagreements and \nworkplace \nprocedures \n2.2 Techniques of \nclarifying \nrequirements of \ntasks \n2.3 Relevant OS&H \nand environmental \nprotection \nprocedures and \nguidelines \n2.4 Basic Mathematics \n2.5 Operation of \ncomputer and \nappropriate \nsoftware \n2.1 Planning daily \nroutine taking into \naccount rosters, \nindustrial \nagreements and \nworkplace \nprocedures \n2.2 Seek