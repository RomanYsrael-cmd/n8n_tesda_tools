        "source_text": "--- PDF PAGE 71 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n67 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY       : \nSUPERVISE/ MANAGE ACTIVITIES INVOLVING \nIMPORT SEAFREIGHT OPERATION DEPARTMENT \n \nUNIT CODE \n         : \nMTO132301 \n \nUNIT DESCRIPTOR               : \nThis unit covers the knowledge, skills and attitudes required to \nensure the effective and efficient flow of seafreight import \noperations. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Familiarize \nwith business \nprocesses  \n1.1 Coordinate with \nadministration on \norientation regarding \nbusiness process \nmanuals in \naccordance with \ncompany policies \nand procedures \n1.2 Study the business \nprocess standard \noperating procedure, \nforms and materials \nin accordance with \ncompany procedures \nand government \nregulations. \n1.3 Arrange schedule to \nobserve actual \nimplementation of \nprocesses in \naccordance with \ncompany policies \nand programs. \n1.4 Record observation \nof any irregularities \nin the business \nprocess in \naccordance with \ncompany policies \nand procedures. \n1.1 Business Etiquette \n1.2 Business Writing  \n1.1 Obligations and \nContracts \n1.2 Negotiable \nInstruments \n1.3  Business process \nstandard operating \nprocedure, forms \nand materials \n1.4 Occupational \nSafety and Health \nRequirements \n1.5 Environmental \nLaws \n1.6 Units of \nMeasurement \n1.7 Conversions of \nMeasurement  \n1.8 Calculation of \nCharges \n1.9  Currency \nConversion  \n1.10 Commodity \ncharacteristics, \nprohibitions and \nrestrictions \n1.11 Weight and \nbalance \n1.12 Geography \n1.13 Computer \noperations \n1.14 Quality \nManagement \nSystem \n1.15 Standard \nOperating \nProcedures  \n \n1.1 Problem-solving \nskills \n1.2 Time management \nskills \n1.3 Work planning and \norganizational skills \n1.4 Interpersonal skills \n