        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\nunderstands:\n1.1 Pre-alerts and shipment notices are monitored regularly as\nto cargo departures, routings and arrivals.\n1.2 Incoming shipments are checked according to accuracy of\ninformation and details of shipments based on the shipping\ndocuments\n1.3 Discrepancies and inconsistencies on the shipping\ndocuments are verified and corrected with the overseas\nagents.\n1.4 Details of discrepancy is resolved and approved within the\nspecified time of submission of e-manifest with the Bureau\nof Customs.\n1.5 Applicable Charges, fees, and penalties as a result of\ndiscrepancy are communicated and agreed upon with\noverseas agent.\n1.6 Type of bill of lading is determined.\n1.7 Requirements for the release of delivery order are complied\nwith.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Writing materials\n2.4 Internet\n2.5 Computer\n3. Methods of Assessment\nCompetency may be assessed through:\n3.1 Written test\n3.2 Case analysis\n3.3 Demonstration with questioning\n3.4 Interview\n3.5 Observation\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 94 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n90\nUNIT OF COMPETENCY : CONTROL SHIPPING DOCUMENTS\n\nUNIT CODE\n:"
        },
        "source_text": "MTO132303\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nensure the proper coordination with overseas agents with\nregard to status and disposition of shipments, charges, and\nspecial handling requirements including handling of any\nirregularity.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Review for\naccuracy and\ncompleteness of\nshipping documents\n\n2.1 Discrepancies in\nthe shipping\ndocuments are\nverified and\ncorrected with the\noverseas agent.\n2.2 Details of\ndiscrepancy are\nresolved and\napproved within\nthe specified time\nof submission of\ne-manifest with\nthe Bureau of\nCustoms.\n2.3 Applicable\nCharges, fees,\nand penalties as\na result of\ndiscrepancy are\ncommunicated\nand agreed upon\nwith overseas\nagent.\n\n2.1\nBusiness Etiquette\n2.2\nBusiness Writing\n2.3\nObligations and\nContracts\n2.4\nNegotiable\nInstruments\n2.5\nDiscrepancies and\ninconsistencies\n2.6\nE-manifest\npenalties\n2.7\nUnits of\nMeasurement\n2.8\nConversions of\nMeasurement\n2.9\n Calculation of\nCharges\n2.10 Currency\nConversion\n2.11 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n2.12 Weight and balance\n2.13 Geography\n2.14 Tools and Material\nHandling\nEquipment\n2.15 Quality\nManagement\nSystem\n2.16 Standard Operating\nProcedures\n2.17 Key Results Areas\nand Key\nPerformance\nIndicators\n2.18 Quality Manual\n\n2.1 Problem-solving\nskills\n2.2 Time management\nskills\n2.3 Work planning and\norganizational\nskills\n2.4 Negotiation skills\n2.5 Communication\nskills\n\n--- PDF PAGE 88 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n84\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Ensure correct\nprocessing and\nhandling of\ntransport\ndocuments\n3.1 Type of bill of\nlading is\ndetermined in\naccordance with\nclient’s\nrequirement.\n3.2 Requirements\nfor the release of\ndelivery order are\ncomplied with in\naccordance with\ncompany\nprocedures.\n3.3 Import records\nare kept and\nretained for a\nprescribed period\nfor reportorial\npurposes.\n\n3.1 Business Etiquette\n3.2 Business Writing\n3.3 Obligations and\nContracts\n3.4 Negotiable\nInstruments\n3.5 Types of Bills of\nLading\n3.6 Requirements for\nrelease of Delivery\nOrder\n3.7 Import records\n3.8 Units of\nMeasurements\n3.9 Conversions of\nMeasurement\n3.10 Calculation of\nCharges\n3.11 Currency\nConversion\n3.12 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n3.13 Geography\n3.14 Cargo handling tools\n3.15 Computer operation\n3.16 Quality Management\nSystem\n3.17 Standard Operating\nProcedures\n3.18 Key Results Areas\nand Key\nPerformance\nIndicators\n3.19 Quality Manual\n3.1 Problem-solving\nskills\n3.2 Time management\nskills\n3.3 Work planning and\norganizational\nskills\n3.4 Interpersonal skills\n3.5 Result Oriented\nskills\n3.6 Communication\nskills\n3.7 Critical Thinking\nskills\n3.8 Risk Management\nskills\n\n4. Review the\naccuracy of\ninvoices / billing\nstatements of\noverseas agent.\n4.1 Ensure that a\ndebit note or a\ncredit note is\nreceived or sent\nbefore a billing\nstatement to\nimporter is made\nin accordance\nwith company’s\naccounting\nstandards and\nprocedure.\n\n4.1 Business Etiquette\n4.2 Business Writing\n4.3 Obligations and\nContracts\n4.4 Negotiable\nInstruments\n4.5 Debit note\n4.6 Credit Note\n4.7 Billing Statement\n4.8 Profit and Loss\nStatement\n4.9 Billing Invoice\n4.10Units of\nMeasurement\n\n4.1 Problem-solving\nskills\n4.2 Time management\nskills\n4.3 Work planning and\norganizational\nskills\n4.4 Interpersonal skills\n4.5 Negotiation skills\n4.6 Result Oriented\nskills\n4.7 Communication\nskills\n\n--- PDF PAGE 89 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n85\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4.2 The profit and\nloss statement is\napproved in\naccordance with\ncompany policies.\n4.3 The billing to\nconsignee is\nprepared and\napproved in\naccordance with\nestablished rates\nand charges.\n\n4.11 Conversions of\nMeasurement\n4.12 Calculation of\nCharges\n4.13 Currency\nConversion\n4.14 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n4.15 Computer operations\n4.16 Quality Management\nSystem\n4.17 Standard Operating\nProcedures\n4.18 Key Performance\nIndicators\n4.19 Quality Manual\n\n--- PDF PAGE 90 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n86\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nPre-alerts and shipment\nnotices\nMay include:\n1.1 Notice of arrival\n1.2 Estimated time of arrival / actual time of arrival\n1.3 Clients order notice\n1.4 Routing order\n1.5 Nomination letter\n1.6 Contract\n1.7 Notice to proceed\n2.\nIncoming shipments\nMay include:\n2.1 Full container load\n2.2 Less than container load\n2.3 Breakbulk\n2.4 Bulk\n2.5 Project cargo\n2.6 Perishable cargo\n2.7 Dangerous goods cargo\n2.8 ISO Tank\n2.9 Roll on roll off\n2.10\nLive animals\n3.\nShipping documents\nMay include:\n3.1 Master bill of lading\n3.2 House bill of lading\n3.3 Letter of credit\n3.4 Delivery receipt\n3.5 Routing Order\n3.6 Forwarders cargo receipt\n3.7 Cargo manifest\n3.8 Invoice / packing list\n3.9 Certificate of origin\n3.10 Certificate of loading\n3.11 Dangerous goods declaration\n3.12 Commodity clearance\n4.\nOverseas agents\nMay include:\n4.1 Sister company\n4.2 Branch office\n4.3 Foreign agent\n4.4 Third party\n4.5 International freight forwarders\n4.6 Agency agreement\n4.7 Standard terms and condition\n\n--- PDF PAGE 91 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n87\nVARIABLE\nRANGE\n4.8 Principal\n4.9 Foreign counterpart\n4.10 Affiliate\n5.\nDiscrepancies and\ninconsistencies\nMay include:\n5.1 Volume and weight\n5.2 Description of goods\n5.3 Number of packages\n5.4 Container number\n5.5 Port of discharge\n5.6 Short-shipped shipments\n5.7 Bill of lading number\n5.8 Importer / shipper / notify party\n5.9 Manner and Type of packaging\n5.10 Seal, Marks and number\n5.11 Typo error\n5.12 Freight terms\n5.13 Final Destination\n6.\nE-manifest\nMay include:\n6.1 Tariff and Customs Code of the Philippines\n6.2 Electronic interface\n6.3 Legal requirements\n6.4 Value added service provider\n6.5 Customs manifest\n6.6 Submission time\n6.7 Penalties\n7.\nCharges, fees, and\npenalties\nMay include :\n7.1 Unmanifested cargo\n7.2 Incorrect manifest\n7.3 Late manifest\n7.4 Fines and surcharges\n7.5 Criminal and civil liabilities\n7.6 Violation of customs rules and regulation\n8.\nBill of lading\nMay include:\n8.1 Contract of carriage\n8.2 Negotiable instruments’\n8.3 Receipt\n8.4 Bank guarantee\n8.5 Bill of lading endorsement\n8.6 Record keeping\n\n--- PDF PAGE 92 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n88\nVARIABLE\nRANGE\n9.\nRequirements\nMay include:\n9.1 Bank guarantee\n9.2 Bank endorsement\n9.3 Letter of Indemnity\n9.4 Telex release confirmation\n9.5 Company guarantee\n9.6 Original bill of lading duly endorsed\n10. Import records\nMay include:\n10.1 Bill of lading\n10.2 Invoices\n10.3 Import documents\n10.4 Authorization\n10.5 Copy of bank guarantee\n10.6 Container Guarantee\n10.7 Company guarantee\n11. Debit note or credit note\nMay include:\n11.1 Freight bill\n11.2 Payments and receivables\n11.3 Profit and loss statement\n11.4 Financial statements\n11.5 Statement of account\n11.6 Spreadsheet\n\n--- PDF PAGE 93 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n89\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\nunderstands:\n1.1 Pre-alerts and shipment notices are monitored regularly as\nto cargo departures, routings and arrivals.\n1.2 Incoming shipments are checked according to accuracy of\ninformation and details of shipments based on the shipping\ndocuments\n1.3 Discrepancies and inconsistencies on the shipping\ndocuments are verified and corrected with the overseas\nagents.\n1.4 Details of discrepancy is resolved and approved within the\nspecified time of submission of e-manifest with the Bureau\nof Customs.\n1.5 Applicable Charges, fees, and penalties as a result of\ndiscrepancy are communicated and agreed upon with\noverseas agent.\n1.6 Type of bill of lading is determined.\n1.7 Requirements for the release of delivery order are complied\nwith.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Writing materials\n2.4 Internet\n2.5 Computer\n3. Methods of Assessment\nCompetency may be assessed through:\n3.1 Written test\n3.2 Case analysis\n3.3 Demonstration with questioning\n3.4 Interview\n3.5 Observation\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 94 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n90\nUNIT OF COMPETENCY : CONTROL SHIPPING DOCUMENTS\n\nUNIT CODE\n:"
