        "source_text": "MTO432202\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to follow\nsecurity procedures in the freight forwarding and\ndocumentation services. It includes checking and maintaining\nthe security the workplace, identifying security threats or\nsituations, and responding to a security threat or situation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Maintain\nsecurity of the\nworkplace\n\n1.1 Workplace is secured\nwithin specified\nlocations in\naccordance with\nworkplace security\nprocedures and\napplicable security\nregulations\n1.2 Security measures\nare checked and\nmaintained in\naccordance with\nworkplace safety and\nsecurity procedures\n1.3 Signs of potential\nhazards and\ninterferences are\nrecognized and\nreported in\naccordance with\nworkplace security\nprocedures\n1.4 Any breach of\nsecurity requirements\nare reported promptly\nto designated\npersonnel in\naccordance with\nworkplace safety and\nsecurity procedures\n1.1 Applicable transport\nsecurity legislation\nincluding relevant\ninternational, national,\nstate and territory\nacts, regulations\ncodes and/or\nguidelines\n1.2 Relevant workplace\nsecurity program and\npolicies and\nprocedures for\nresponding to security\nthreats, situations and\nemergencies\n1.3 Relevant quarantine\nand bond regulations\nand requirements\n1.4 Common security\nthreats and incidents\nthat may occur in the\nworkplace and related\nroles and\nresponsibilities of\npersonnel when\nreporting them and\nresponding to them\n1.5 OSH and\nenvironmental\nprotection procedures\n1.6 Basic mathematical\noperations\n1.7 Locks and other\nsecurity measures\n1.8 Common security\nproblems that may\noccur when carrying\nout operations in the\ntransport and logistics\nindustries\n1.1 Communicating\neffectively with\nconcerned parties\nwhen following\nsecurity procedures\n1.2 Interpreting\ninstructions,\nprocedures,\napplicable\nregulatory\nrequirements,\nlabels, markings, ID\ncards and other\ninformation relevant\nto workplace safety\nand security\n1.3 Completing\nrequired\ndocumentation and\nreports related to\nsafety and security\nprocedures\n1.4 Applying\nprocedures for\nsafety, security\nchecks and\nprecautions as per\nlimits of role and\nresponsibilities\n\n--- PDF PAGE 54 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n50\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Identify a\nsecurity threat\nor situation\n\n2.1 Security threat or\nsituation is promptly\nidentified and\nassessed\n2.2 Response is\nprioritized in\naccordance with the\nworkplace security\nprogram and\nprocedures\n2.3 Implications of the\nsecurity threat or\nsituation are\nevaluated in\naccordance with\nworkplace security\nprogram and\nprocedures\n\n2.1 Applicable transport\nsecurity legislation\nincluding relevant\ninternational, national,\nstate and territory\nacts, regulations\ncodes and/or\nguidelines\n2.2 Relevant workplace\nsecurity program and\npolicies and\nprocedures for\nresponding to security\nthreats, situations and\nemergencies\n2.3 Relevant quarantine\nand bond regulations\nand requirements\n2.4 Common security\nthreats and incidents\nthat may occur in the\nworkplace and related\nroles and\nresponsibilities of\npersonnel when\nreporting them and\nresponding to them\n2.5 Signs of pillaging, theft\nand interference with\ngoods, cargo and mail\n2.6 Relevant OS&H and\nenvironmental\nprotection procedures\nand guidelines\n2.7 Basic mathematical\noperations\n2.8 Security threat\n2.9 Types of Security\nThreat\n2.10 Implications of\nsecurity threat\n2.11 Workplace security\nprogram and\nprocedures\n2.12 Common security\nproblems that may\noccur when carrying\nout operations in the\ntransport and\nlogistics industries\n\n2.1 Identifying, solving,\nand/or reporting\nproblems that arise\nwhen following\nsecurity procedures\n2.2 Recognizing signs\nof security threats\nand situations\n\n--- PDF PAGE 55 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n51\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Respond to a\nsecurity threat\nor situation\n\n3.1 Response to an\nidentified security\nthreat or situation is\ndone in accordance\nwith workplace\nsecurity procedures,\nregulatory\nrequirements, and\nemergency response\nplan\n3.2 Security threats or\nincidents are handled\nappropriately in\naccordance with\nestablished response\nplan and within limits\nof responsibility using\navailable\ncommunications in\nthe work area\n3.1 Common security\nproblems that may\noccur when carrying\nout operations in the\nworkplace to address\nand resolve the\nproblems\n3.2 Relevant\ndocumentation and\nreporting requirements\n3.3 Relevant OS&H and\nenvironmental\nprotection procedures\nand guidelines\n3.4 Basic mathematical\noperations\n3.5 Security threat\n3.6 Types of Security\nThreat\n3.7 Implications of\nsecurity threat\n3.8 Workplace security\nprogram and\nprocedures\n3.9 Common security\nproblems that may\noccur when carrying\nout operations in the\ntransport and logistics\nindustries\n3.1 Completing\nrequired\ndocumentation and\nreports related to\nsecurity procedures\n3.2 Working\ncollaboratively with\nothers when\nfollowing security\nprocedures\n3.3 Modifying activities\ndepending on\ndiffering workplace\ncontexts risk\nsituations and\nenvironments\n3.4 Applying security\nprograms and\nprocedures in\nresponse to\nidentified security\nthreats\n3.5 Promptly reporting\nand/or rectifying\nany identified\nproblems that may\narise when\nfollowing security\nprocedures in\naccordance with\nregulatory\nrequirements and\nworkplace\nprocedures\n\n--- PDF PAGE 56 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Security Measures\n\nMay include:\n1.1 Security guards at access points and gates to\nsecured areas\n1.2 Locked doors, gates and fences\n1.3 Use of personal electronic access cards\n1.4 Recording of carrier and vehicle registration\ndetails at gates and checkpoints\n1.5 Bag check points\n1.6 Escorts for visitors in restricted areas\n1.7 Access control in and out of restricted security\nareas\n1.8 Use of ID cards\n1.9 Video surveillance equipment\n1.10 Explosives detection screening of personnel\n1.11 Screening of personnel using hand-held and walk\nthrough magnetometers\n1.12 Frisking\n2. Workplace Security Procedures\nMay include:\n2.1 Established security procedures\n2.2 Standard operating procedures\n2.3 Company procedures\n2.4 Enterprise procedures\n2.5 Organizational procedures\n3. Communications\n\nMay include:\n3.1 Phone\n3.2 Radio\n3.3 Fax\n3.4 Email\n3.5 Electronic data transfer (EDI)\n3.6 Internet\n3.7 Oral, aural or signed communications\n\n--- PDF PAGE 57 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n53\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Implemented workplace security procedures and applicable\nsecurity regulations\n1.2 Adopted security measures in accordance with workplace\nsecurity procedures\n1.3 Identified and assessed security threat or situation in accordance\nwith the workplace security program and procedures\n1.4 Responded to an identified security threat or situation in\naccordance with workplace security procedures, received\ninstructions, regulatory requirements and emergency response\nplan\n1.5 Handled appropriately any security threats or incidents in\naccordance with established response plan and within limits of\nresponsibility\n\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials and new technologies relevant to the unit of\ncompetency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n3.4 Interview\n\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 58 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n54\nUNIT OF COMPETENCY :\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n :"
