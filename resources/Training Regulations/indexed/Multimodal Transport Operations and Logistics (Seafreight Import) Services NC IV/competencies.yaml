ouraged\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market and\nfeasibility studies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/\ntarpaulins, flyers,\nsocial media, etc.)\n3 Expand\nmarkets and\nclientele\n3.1 Enterprise is built up\nand sustained through\njudicious control of cash\nflows.\n3.2 Profitability of enterprise\nis ensured though\nappropriate internal\ncontrols.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are avoided.\n3.4 New markets and\nclients are identified\nbased on current market\ntrends\n\n3.1 Basic cost-benefit\nanalysis\n3.2 Basic financial\nmanagement\n3.3 Basic financial\naccounting\n3.4 Business internal\ncontrols\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting basic\nfinancial\nstatements\n3.3 Preparing\nbusiness plans\n\n--- PDF PAGE 46 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n42\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Entrepreneurial skills\nMay include:\n1.1 Financial management skills\n1.2 People management skills\n1.3 Operations management skills\n1.4 Business acumen\n\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n3.4 Managing property, plant and equipment\n4. Continuous\nimprovement\nMay include:\n4.1 Quality management systems (PDCA, ISO\n9001,TQM, Six-Sigma, etc.)\n4.2 Client feedback systems\n4.3 Quality assurance/Quality control systems\n\n--- PDF PAGE 47 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n43\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated enhancement of one’s\nentrepreneurial skills through performance of\nbusiness, supervisor evaluation, worker and client\ntestimony\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Interview guide for entrepreneurs, enterprise\nworkers and third parties\n2.2 Materials and location relevant to the proposed\nactivity and tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n4.1 Written report\n4.2 Written examination\n4.3 Demonstration/observation with oral questioning\n4.4 Portfolio assessment with interview\n4.5 Third-party report\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in\na simulated workplace setting\n4.2 Assessment shall be observed while tasks are\nbeing undertaken whether individually or in-group\n\n--- PDF PAGE 48 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n44\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY FREIGHT FORWARDING DOCUMENTATION\nSERVICES AND WORKPLACE PROCEDURES\nUNIT CODE\n :"
