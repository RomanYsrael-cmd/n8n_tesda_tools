        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Study the business process standard operating\nprocedure, forms and materials in accordance with\ncompany policies and procedures\n1.2 Policies and regulations on sea freight import are\ncommunicated with employees through orientation\nactivities.\n1.3 Poor performances are analyzed and corrective\nmeasures are introduced.\n1.4 Discrepancies / deviations in the output are identified\nbased on business process\n1.5 Contractors are evaluated in relation to established\ncriteria and in accordance with workplace and regulatory\nprocedures\n1.6 Contractor selection process outcomes are documented\nincluding recommendations for actions on\nagreements/contracts with selected contractors\n\n2. Resource Implications\nThe following resources should be provided:\n2.1.\nFax machine\n2.2.\nTelephone\n2.3.\nWriting materials\n2.4.\nInternet\n2.5.\nForms\n2.6.\nComputer\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nWritten test\n3.2.\nDemonstration with questioning\n3.3.\nInterview\n3.4.\nObservation\n4. Context of Assessment\n4.1.\nCompetency maybe assessed in actual workplace\nor at the designated TESDA accredited\nAssessment Center.\n\n--- PDF PAGE 79 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n75\nUNIT OF COMPETENCY :\nOVERSEE THE IMPORT SEAFREIGHT TEAM’S\nPERFORMANCE\n\nUNIT CODE\n :"
        },
        "source_text": "MTO132301\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nensure the effective and efficient flow of seafreight import\noperations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Familiarize\nwith business\nprocesses\n1.1 Coordinate with\nadministration on\norientation regarding\nbusiness process\nmanuals in\naccordance with\ncompany policies\nand procedures\n1.2 Study the business\nprocess standard\noperating procedure,\nforms and materials\nin accordance with\ncompany procedures\nand government\nregulations.\n1.3 Arrange schedule to\nobserve actual\nimplementation of\nprocesses in\naccordance with\ncompany policies\nand programs.\n1.4 Record observation\nof any irregularities\nin the business\nprocess in\naccordance with\ncompany policies\nand procedures.\n1.1 Business Etiquette\n1.2 Business Writing\n1.1 Obligations and\nContracts\n1.2 Negotiable\nInstruments\n1.3 Business process\nstandard operating\nprocedure, forms\nand materials\n1.4 Occupational\nSafety and Health\nRequirements\n1.5 Environmental\nLaws\n1.6 Units of\nMeasurement\n1.7 Conversions of\nMeasurement\n1.8 Calculation of\nCharges\n1.9 Currency\nConversion\n1.10 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n1.11 Weight and\nbalance\n1.12 Geography\n1.13 Computer\noperations\n1.14 Quality\nManagement\nSystem\n1.15 Standard\nOperating\nProcedures\n\n1.1 Problem-solving\nskills\n1.2 Time management\nskills\n1.3 Work planning and\norganizational skills\n1.4 Interpersonal skills\n1.5 Negotiation skills\n1.6 Results Orientation\nskills\n1.7 Communication\nskills\n\n--- PDF PAGE 72 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n68\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.16 Key Performance\nIndicators\n1.17 Anti-trust\nregulations\n1.18 Anti-corruption\npolicies\n1.19 Anti-piracy Act\n1.20 Non-disclosure\nAgreement\n1.21 Data privacy Act\n1.22 Quality Operations\nManual\n2. Disseminate\ninformation\nabout\nseafreight\nimport policies,\nprocedures\nand\nregulations\n\n2.1 Policies and\nregulations on\nseafreight import are\ncommunicated to\nemployees through\norientation activities in\naccordance with\ncompany procedures.\n2.2 Disseminated\ninformation are\nconfirmed understood\nand properly\ninterpreted in\naccordance with\ncompany policies.\n2.3 Implementation of\npolicies and\nprocedures\n are monitored in\naccordance with\ncompany\nrequirements and\ngovernment\nregulations.\n2.4 Result of orientation\nand work instructions\nare recorded in\naccordance with\nquality management\nsystem.\n2.1 Business Etiquette\n2.2 Business Writing\n2.3 Obligations and\nContracts\n2.4 Negotiable\nInstruments\n2.5 Policies and\nregulations on sea\nfreight imports\n2.6 Units of\nMeasurement\n2.7 Conversions of\nMeasurement\n2.8 Calculation of\nCharges\n2.9 Currency\nConversion\n2.10 Commodity\nprohibitions and\nrestrictions\n2.11 Weight and\nbalance\n2.12 Geography\n2.13 Tools and Material\nHandling\nEquipment\n2.14 Computer\noperations\n2.15 Quality\nManagement\nSystem\n2.16 Standard\nOperating\nProcedures\n2.17 Key Performance\nIndicators\n2.18 Anti-trust\nregulations\n2.19 Anti-corruption\npolicies\n2.1 Problem-solving\nskills\n2.2 Time management\nskills\n2.3 Work planning and\norganizational skills\n2.4 Interpersonal skills\n2.5 Negotiation skills\n2.6 Result Oriented\nskills\n2.7 Communication\nskills\n\n--- PDF PAGE 73 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n69\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.20 Data privacy Act\n2.21 Non-Disclosure\nAgreement\n2.22 Quality Manual\n3. Implement\nbusiness\nprocesses\n3.1 Initial hands on training\n& observation of the\nprocess for all sea\nfreight import\nemployees 