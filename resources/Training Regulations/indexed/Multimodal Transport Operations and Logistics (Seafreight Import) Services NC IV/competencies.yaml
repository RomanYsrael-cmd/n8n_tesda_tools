        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly and\naccording to the task requirement\n1.2. Identified and explain the functions of both hardware and\nsoftware used, their general features and capabilities\n1.3. Produced accurate and complete data in accordance with the\nrequirements\n1.4. Used appropriate devices and procedures to transfer files/data\naccurately\n1.5. Maintained computer system\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials and new technologies relevant to the unit of\ncompetency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n\n3. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 71 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n67\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nSUPERVISE/ MANAGE ACTIVITIES INVOLVING\nIMPORT SEAFREIGHT OPERATION DEPARTMENT\n\nUNIT CODE\n :"
