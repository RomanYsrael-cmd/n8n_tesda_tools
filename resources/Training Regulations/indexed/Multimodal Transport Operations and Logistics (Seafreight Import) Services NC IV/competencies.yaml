          "1. Evaluate effectiveness and efficiency of the workplace systems, processes and procedures. 1.1 Effectiveness and efficiency of workplace standards and procedures are examined. 1.2. Usage of inquiry and dialogue to communicate evaluation measures and results are implemented. 1.3 Evaluation reports are prepared and communicated to team members.",
