rformance \nEvaluation \n3.7 Environmental Law \n3.8 Quality \nManagement \nSystem \n3.9 Standard \nOperating \nProcedures  \n3.10 Key Results Areas \nand Key \n3.1 Problem-solving \nskills \n3.2 Time \nmanagement \nskills \n3.3 Work planning \nand \norganizational \nskills \n3.4 Interpersonal \nskills  \n3.5 Result Oriented \nskills  \n3.6 Communication \nskills  \n3.7 Critical Thinking \nskills\n\n--- PDF PAGE 81 ---\nMTOL SERVICES NC III  \nPromulgated (12/17/2019)  \n \n \n \n77 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \naccordance with \ncompany standards  \n3.4 Performance \ncriteria of all import \nsea freight staff are \nobserved and \nevaluated in \naccordance to \ncompany. \nPerformance \nIndicators \n3.11 Quality Manual \n3.8 Risk \nManagement \nskills \n \n \n \n4. Disseminate \nwork \ninstructions for \nproper \nimplementation  \n4.1 Work instruction \nis disseminated in \naccordance with \ncompany policy and \nprocedure \n4.2 Method of \ncompletion of work \ninstruction is \nmonitored in \naccordance with \ncompany work \nprocedure  \n4.3 Accuracy and \ntimeliness of \nimplementation are \nmeasured in \naccordance with \nKey Performance \nIndicators  \n4.1 Business Etiquette \n4.2 Business Writing \nand verbal \ncommunication \n4.3 Work processes \nand methods \n4.4 Performance \nEvaluation \n4.5 Occupational \nSafety and Health \nRequirements \n4.6 Environmental \nLaws \n4.7 Units of \nMeasurements \n4.8 Conversions of \nMeasurement \n4.9  Calculation of \nCharges \n4.10 Currency \nConversion  \n4.11 Commodity \ncharacteristics, \nprohibitions and \nrestrictions \n4.12 Weight and \nbalance \n4.13 Geography \n4.14 Tools and Material \nHandling \nEquipment \n4.15 Computer \noperation  \n4.16 Quality \nManagement \nSystem \n4.17 Standard \nOperating \nProcedures  \n4.18 Key Performance \nIndicators \n4.19 Quality Manual  \n \n4.1 Problem-solving \nskills  \