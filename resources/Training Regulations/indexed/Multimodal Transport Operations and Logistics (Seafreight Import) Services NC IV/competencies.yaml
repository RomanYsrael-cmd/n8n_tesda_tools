        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 All legal documents involved in the discrepancy are collated\n1.2 All documents gathered are validated.\n1.3 Initial report is prepared based on documents and result of\ninvestigation\n1.4 The claim Incidence is reported to foreign agents\n1.5 The importer of record is informed about the incident\nincluding all aggrieved parties.\n1.6 The prescription period is identified in accordance with time\nbar stipulated in the transport contract.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Writing materials\n2.4 Computer with Internet connection\n3. Methods of Assessment\nCompetency may be assessed through:\n3.1 Written test\n3.2 Case analysis\n3.3 Demonstration with questioning\n3.4 Interview\n3.5 Observation\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 106 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n102\nUNIT OF COMPETENCY : EVALUATE REPORTS REQUIRED TO SUPPORT\nBUSINESS DECISIONS AND COMPLY WITH\nGOVERNMENT REQUIREMENTS\n\nUNIT CODE\n:"
        },
        "source_text": "MTO132305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nensure the proper processing of claims arising from losses,\ndamages, theft and other irregularities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Gather and\nanalyze\ndocumentary\nevidences of\nirregularity.\n\n1.1 Notice of claim is\nreceived in\naccordance with\nestablished\nprocedures.\n1.2 Complaints or claims\nare evaluated in\naccordance with\ncontract of carriage\n1.3 Initial report is\nprepared based on\ndocuments and result\nof investigation.\n\n1.1 Business Etiquette\n1.2 Legal Documents\n1.3 Units of\nMeasurement\n1.4 Conversions of\nMeasurement\n1.5 Calculation of\nCharges\n1.6 Currency\nConversion\n1.7 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n1.8 Weight and\nbalance\n1.9 Computer\noperation\n1.10 Quality\nManagement\nSystem\n1.11 Standard\nOperating\nProcedures\n1.12 Key Performance\nIndicators\n1.13 Quality Manual\n1.1 Time management\nskills\n1.2 Communication\nskills\n1.3 Analytical thinking\nskills\n\n2. Investigate the\nnature of claim\n2.1 All legal\ndocuments\ninvolved in the\ndiscrepancy are\ncollated in\naccordance with\nconditions of\ncarriage.\n2.2 The servicesof the\ncertified cargo\nsurveyor are\nengaged to conduct\nocular inspection\nwhere the damages\nare discovered.\n2.1 Business\nEtiquette\n2.2 Business Writing\n2.3 Obligations and\nContracts\n2.4 Claims\nprocedures\n2.5 Ocular inspection\n2.6 Investigation\nDocumentation\n2.7 Report Writing\n2.8 Occupational\nSafety and Health\nRequirements\n\n2.1 Problem-solving\nskills\n2.2 Time management\nskills\n2.3 Work planning and\norganizational skills\n2.4 Negotiation skills\n2.5 Communication\nskills\n2.6 Investigating skills\n\n--- PDF PAGE 101 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n97\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.3 The preliminary\nreport is prepared\nstating the nature\nof identified and\nalleged\ndiscrepancy.\n\n2.9 Environmental\nLaws\n2.10 Units of\nMeasurements\n2.11 Conversions of\nMeasurement\n2.12 Calculation of\nCharges\n2.13 Currency\nConversion\n2.14 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n2.15 Weight and\nbalance\n2.16 Geography\n2.17 Computer\n2.18 Standard\nOperating\nProcedures\n2.19 Key Performance\nIndicators\n2.20 Business\nProcesses\n2.21\nQuality Manual\n3. Report the\nincident of\ndamages and\nlosses to all\nconcerned\nparties.\n3.1 The incident of\nclaim is reported to\nadmin / legal\ndepartment\n3.2 The claim Incidence\nis reported to\nforeign agent.\n3.3 Consignee on\nrecord is informed\nabout the incident\nincluding all\naggrieved parties.\n3.1 Obligations and\nContracts\n3.2 Claims\nprocedures\n3.3 Ocular inspection\n3.4 Investigation\nDocumentation\n3.5 Report Writing\n3.6 Computer\n3.7 Standard\nOperating\nProcedures\n3.8 Key Performance\nIndicators\n3.9 Business\nProcesses\n3.10 Quality Manual\n3.1 Problem-solving\nskills\n3.2 Time management\nskills\n3.3 Work planning and\norganizational skills\n3.4 Interpersonal skills\n3.5 Result Oriented\n3.6 Communication\nskills\n3.7 Critical Thinking\nskills\n3.8 Risk Management\n\n4. Process the\ncargo claim.\n4.1 The prescription\nperiod is identified\nin accordance with\ntime bar stipulated in\nthe transport\ncontract\n\n4.1 Business Etiquette\n4.2 Business Writing\n4.3 Obligations and\nContracts\n4.4 Units of\nMeasurements\n4.5 Conversions of\nMeasurement\n4.1 Problem-solving\nskills\n4.2 Time management\nskills\n4.3 Work planning and\norganizational skills\n4.4 Interpersonal skills\n4.5 Negotiation skills\n\n--- PDF PAGE 102 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n98\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4.2 Pertinent documents\nand supporting\nrecords are attached\nto the notice of claim\nin accordance with\nstandard claims\nprocedures.\n4.3 The formal notice of\nclaim to all\nconcerned parties is\nrecorded in\naccordance with\nstandard claims\nprocedures\n\n4.6 Calculation of\nCharges\n4.7 Currency\nConversion\n4.8 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n4.9 Weight and\nbalance\n4.10 Computer\noperation\n4.11 Quality\nManagement\nSystem\n4.12 Standard\nOperating\nProcedures\n4.13 Quality Manual\n4.6 Result Oriented\n4.7 Communication\nSkills\n\n--- PDF PAGE 103 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n99\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Legal documents\n\nMay include :\n1.1 Bill of lading\n1.2 Commercial invoice with Incoterms\n1.3 Packing list\n1.4 Insurance policies\n1.5 Affidavits\n1.6 Obligations and Contracts\n1.7 Delivery Receipts\n1.8 Purchase Order Form / Sales Contract\n1.9 Incident Report\n1.10 Claim letter\n2. Certified surveyor\nMay include :\n2.1 Ocular inspection\n2.2 Material Evidence\n2.3 Legal requirement\n2.4 Terms of payment\n2.5 Survey Report\n2.6 Photographs and videos\n2.7 Observation\n2.8 Manifestation\n2.9 Bad Order Report\n3. Nature of identified\ndamages and losses.\nMay include:\n3.1 Loss\n3.2 Deterioration or obsolescence\n3.3 Dents, scratches, or breakage\n3.4 Pilferage\n3.6 Shortshipped or shortlanded shipments\n3.7 Wet and moisture damage\n3.8 Contamination\n4. Initial report\nMay include:\n4.1 Provisional claim\n4.2 SOPs\n4.3 Liability Insurance Policy\n4.5 Bad Order Report\n4.6 Incident report\n\n5. Administrative and legal\ndepartments\nMay include :\n5.1Rules and regulations\n5.2Protocol\n5.3Procedural\n5.4Corporate Document\n5.4References\n5.5Civil cases\n5.6Court cases\n6. Foreign agents\nMay include:\n6.1Agency agreement\n6.2Service Contract\n6.3Standard Trading Conditions\n6.5 Special Instructions\n6.6 Shipping Instructions\n\n--- PDF PAGE 104 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n100\nVARIABLE\nRANGE\n7. Aggrieved parties\nMay include:\n7.1 Shipper\n7.2 Consignee\n7.3 Shipping Line\n7.4 Freight forwarder\n7.5 Customs broker\n7.6 Trucker\n8. Prescription period\nMay include:\n8.1 Validity of Insurance Coverage\n8.2 Inclusion and Exclusion\n8.3 Extensions and amendments\n8.4 Time-bar\n\n9. Final notice of claim\nMay include:\n9.1 Business Consideration\n9.2 Customer satisfaction\n9.3 Liability Insurance Policy\n9.4 Claims Procedure and Guidelines\n9.5 Damage Control\n\n--- PDF PAGE 105 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n101\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 All legal documents involved in the discrepancy are collated\n1.2 All documents gathered are validated.\n1.3 Initial report is prepared based on documents and result of\ninvestigation\n1.4 The claim Incidence is reported to foreign agents\n1.5 The importer of record is informed about the incident\nincluding all aggrieved parties.\n1.6 The prescription period is identified in accordance with time\nbar stipulated in the transport contract.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Writing materials\n2.4 Computer with Internet connection\n3. Methods of Assessment\nCompetency may be assessed through:\n3.1 Written test\n3.2 Case analysis\n3.3 Demonstration with questioning\n3.4 Interview\n3.5 Observation\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 106 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n102\nUNIT OF COMPETENCY : EVALUATE REPORTS REQUIRED TO SUPPORT\nBUSINESS DECISIONS AND COMPLY WITH\nGOVERNMENT REQUIREMENTS\n\nUNIT CODE\n:"
