ental\nprograms,\npolicies and\nprocedures\n3.1. Approved\nimprovements on\nenvironmental work\nprogram initiatives\nare promoted based\non workplace policies\nand procedures\n3.2 Implementation of the\napproved\nenvironmental\ninitiatives are\nmonitored in\naccordance with\nworkplace policies and\nprocedures\n3.3. Implementation of\napproved\nenvironmental\ninitiatives are\nevaluated based on\nworkplace policies and\nprocedures\n3.1. Environmental\nWork Initiatives\n3.2. Communication\nStrategies\n3.3. Environmental\ninspection and\nMonitoring\nTechniques\n3.4. Notification\nRequirements\n3.1. Inspection Skills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n\n--- PDF PAGE 42 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n38\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Environmental Practices\nand Programs\nMay include:\n3.1\nUtilization of Energy, Water, Fuel\n3.2\nSegregation Practices\n3.3\nWaste Disposal and Reuse\n3.4\nSaving Resources\n3.5\nWaste Collection\n3.6\nUsage of Hazardous Materials\n3.7\nChemical Application\n3.8\nEquipment Operation\n3.9\nDewatering and Discharging\n3.10 Surface Disturbance\n3.11 Periodic Inspection\n3.12 Resource Storage and Handling\n2. Environmental Reference\nGuides\nMay include:\n2.1\nAir Emission and Ambient Air Quality Guidelines\n2.2\nEnergy Conservation Guidelines\n2.3\nWastewater and Ambient Water Quality\nGuidelines\n2.4\nWater Conservation Guidelines\n2.5\nHazardous Materials Management\n2.6\nWaste Management\n2.7\nNoise\n2.8\nContaminated Land\n2.9\nCultural Conservation Guides\n3. Environmental Work\nProgram Initiatives\nMay include:\n3.1 Low Energy Lighting\n3.2 Water Reduction initiatives\n3.3 Holding Employee Awareness event\n3.4 Recycling Waste Materials\n3.5 Unplugging power converters overnight\n3.6 Tree-Planting\n3.7 Wild-life conservation\n\n--- PDF PAGE 43 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n39\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment