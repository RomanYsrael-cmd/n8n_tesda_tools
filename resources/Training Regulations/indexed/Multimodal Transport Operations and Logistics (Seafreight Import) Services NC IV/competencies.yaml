  "source_section_text": "SECTION 2: COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units of\ncompetency required for Multimodal Transport Operations and Logistics Services NC IV.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\n\nUNIT CODE\n:\n500311401\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto use specialized communication skills to meet specific\nneeds of internal and internal clients, conduct interviews,\nfacilitate discussion with groups, and contribute to the\ndevelopment of communication strategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n1.1 Specific\ncommunication\nneeds of clients\nand colleagues\nare identified\nand met\n1.2 Different\napproaches are\nused to meet\ncommunication\nneeds of clients\nand colleagues\n1.3 Conflict is\naddressed\npromptly in a\nmanner which\ndoes not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n1.3 Communication\nskills relevant to\nclient groups\n1.4 Flexibility in\ncommunication\n\n1.1 Full range of\ncommunication\ntechniques\nincluding:\n1.1.1 Effective\ncommunication\nprocess\n1.1.2 Active listening\n1.1.3 Giving/ receiving\nfeedback\n1.1.4 Interpretation of\ninformation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.1.8 Conduct seminars\n1.1.9 Public speaking\n1.2 Communication skills\nrequired to fulfill job\nroles as specified\nby the organization\n\n--- PDF PAGE 8 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for\ninternal and external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work related network\nand relationship are\nmaintained\n2.5 Negotiation and\nconflict resolution\nstrategies are used\nwhere required\n2.5 Communication with\nclients and colleagues\nis performed\nappropriate to\nindividual needs and\norganizational\nobjectives\n2.1 Communication\nprocess\n2.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n2.3 Openness and\nflexibility in\ncommunication\n2.4 Communication\nskills relevant to\nclient groups\n\n2.1 Full range of\ncommunication\ntechniques including:\n2.1.1 Effective\ncommunication\nprocess\n2.1.2 Active listening\n2.1.3 Giving/ receiving\nFeedback\n2.1.4 Interpretation of\ninformation\n2.1.5 Role boundaries\nsetting\n2.1.6 Negotiation\n2.1.7 Establishing\nempathy\n2.1.8 Openness and\nflexibility in\ncommunication\n2.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n3. Deliver a\ntechnical\npresentation\n3.1 Presentation is\ndelivered clearly,\nsequential and\ndelivered within allotted\ntime\n3.3 Utilize appropriate\nmedia to enhance\npresentation\n3.4 Differences in\nviews/opinions are\nrespected\n3.5 Questions during fora\nare responded in a\nmanner consistent with\norganizational standard\n3.1 Communication\nprocess\n3.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n3.3 Openness and\nflexibility in\ncommunication\n3.4 Communication\nskills relevant to\nclient groups\n\n3.1 Full range of\ncommunication\ntechniques including:\n3.1.1 Effective\ncommunication\nprocess\n3.1.2 Active listening\n3.1.3 Giving/receiving\nfeedback\n3.1.4 Interpretation of\ninformation\n3.1.5 Role boundaries\nsetting\n3.1.6 Negotiation\n3.1.7 Establishing\nempathy\n3.1.8 Openness and\nflexibility in\ncommunication\n3.19 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 9 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n5\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Represent the\norganization\n4.1 When participating in\ninternal or external\nforums, presentation\nis relevant,\nappropriately\nresearched and\npresented in a manner\nto promote the\norganization\n4.2 Presentation is clear\nand sequential and\ndelivered within a\npredetermined time\n4.3 Utilize appropriate\nmedia to enhance\npresentation\n4.4 Differences in views\nare respected\n4.5 Written\ncommunication is\nconsistent with\norganizational\nstandards\n4.6 Inquiries are\nresponded in a\nmanner consistent\nwith organizational\nstandard\n4.7 Consolidate ideas and\nsuggestions\n4.8 Generalize and\nsummarize all ideas\nand suggestions\n\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n4.3 Openness and\nflexibility in\ncommunication\n4.4 Communication\nskills relevant to\nclient groups\n\n4.1 Full range of\ncommunication\ntechniques including:\n 4.1.1 Effective\n communication\n process\n 4.1.2 Active listening\n 4.1.3 Giving/ receiving\n Feedback\n 4.1.4 Interpretation of\n information\n 4.1.5 Role boundaries\n setting\n 4.1.6 Negotiation\n 4.1.7 Establishing\nempathy\n 4.1.8 Openness and\nflexibility in\ncommunication\n4.2 Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n--- PDF PAGE 10 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n6\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Facilitate group\ndiscussion\n5.1 Mechanisms which\nenhance effective group\ninteraction is defined\nand implemented\n5.2 Strategies which\nencourage all group\nmembers to participate\nare used routinely\n5.3 Objectives and agenda\nfor meetings and\ndiscussions are routinely\nset and followed\n5.4 Relevant information is\nprovided to group to\nfacilitate outcomes\n5.5 Evaluation of group\ncommunication\nstrategies is undertaken\nto promote participation\nof all parties\n5.6 Specific communication\nneeds of individuals are\nidentified and addressed\n5.1 Communication\nprocess\n5.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n5.3 Openness and\nflexibility in\ncommunication\n5.4 Communication\nskills relevant to\nclient groups\n\n5.1 Full range of\ncommunication\ntechniques\nincluding:\n5.1.1 Effective\ncommunication\nprocess\n5.1.2 Active listening\n5.1.3 Giving/receiving\nfeedback\n5.1.4 Interpretation of\ninformation\n5.1.5 Role boundaries\nsetting\n5.1.6 Negotiation\n5.1.7 Establishing\nempathy\n5.1.8 Openness and\nflexibility in\ncommunication\n5.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n6. Conduct\ninterview\n6.1 A range of appropriate\ncommunication\nstrategies are employed\nin interview situations\n6.2 Records of interviews\nare made and\nmaintained in\naccordance with\norganizational\nprocedures\n6.3 Effective questioning,\nlistening and nonverbal\ncommunication\ntechniques are used to\nensure that required\nmessage is\ncommunicated\n6.1 Communication\nprocess\n6.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n6.3 Effective\nquestioning\ntechniques\n6.3 Communication\nskills relevant to\nclient groups\n\n6.1 Full range of\ncommunication\ntechniques\nincluding:\n6.1.1 Effective\ncommunication\nprocess\n6.1.2 Active listening\n6.1.3 Giving/ receiving\nfeedback\n6.1.4 Interpretation of\ninformation\n6.1.5 Role boundaries\nsetting\n6.1.6 Negotiation\n6.1.7 Establishing\nempathy\n6.2 Effective clarifying\nand probing\ntechniques\n(questioning skills)\n6.3 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 11 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\nMay include:\n1.1 Recognizing own limitations\n1.2 Referral to specialists\n1.3 Utilizing techniques and aids\n1.4 Providing written drafts\n1.5 Verbal and non verbal communication\n2. Effective group\ninteraction\nMay include:\n2.1 Identifying and evaluating what is occurring\nwithin an interaction in a non judgmental way\n2.2 Using active listening\n2.3 Making decision about appropriate words,\nbehavior\n2.4 Putting together response which is culturally\nappropriate\n2.5 Expressing an individual perspective\n2.6 Expressing own philosophy, ideology and\nbackground and exploring impact with\nrelevance to communication\n2.7 Openness and flexibility in communication\n3. Types of Interview\nMay include:\n3.1 Related to staff issues\n3.2 Routine\n3.3 Confidential\n3.4 Evidential\n3.5 Non disclosure\n3.6 Disclosure\n4. Interview situations\nMay include:\n4.1 Establish rapport\n4.2 Elicit facts and information\n4.3 Facilitate resolution of issues\n4.4 Develop action plans\n4.5 Diffuse potentially difficult situation\n\n--- PDF PAGE 12 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n8\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated effective communication skills\nwith clients accessing service and work\ncolleagues\n1.2 Adopted relevant communication techniques\nand strategies to meet client particular needs\nand difficulties\n2. Resource Implications\n2.1 Access to appropriate workplace where\nassessment can take place\n\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Case Study\n3.2 Interview\n3.3 Portfolio\n3.4 Written Test\n3.5 Role Play\n\n4. Context for Assessment\n4.1 This unit should be assessed on the job\nthrough simulation\n\n--- PDF PAGE 13 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n9\nUNIT OF COMPETENCY:\nDEVELOP AND LEAD TEAMS\n\nUNIT CODE\n:\n500311402\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required\nto determine individual and team development needs and\nfacilitate the development of the workgroup.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Foster\nindividual\ngrowth\n1.1 Learning and\ndevelopment needs\nof team members are\nsystematically\nidentified in line with\norganizational\nrequirements\n1.2 Development plan to\nmeet individual needs\nis collaboratively\ndeveloped and\nimplemented\n1.3 Individuals are\nencouraged to self -\nevaluate performance\nand identify areas for\nimprovement\n1.4 Feedback on\nperformance of team\nmembers is collected\nfrom relevant sources\nand compared with\nestablished team\nlearning process\n1.1 Effective\nworkplace\ncommunication,\ncoaching and\nmentoring\nprinciples\n1.2 Feedback\nprinciples and\nprocedures\n1.3 Working\ninterdependentl\ny: strategies and\ntechniques\n1.4 Leadership\nConcepts:\n• Types of\nDecisions Teams\nMake\n• Team\nResponsibilities\n• Problems That\nAffect Teams\n• Building Strong\nTeam\nCommunication\n• Expressing\nYourself on a\nTeam\n• Team Problem\nSolving\n\n1.1 Ability to read and\nunderstand a\nvariety of texts,\nprepare general\ninformation and\ndocuments\naccording to target\naudience; spell\nwith accuracy; use\ngrammar and\npunctuation\neffective\nrelationships and\nconflict\nmanagement\n1.2 Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n1.3 Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n1.4 Ability to relate to\npeople from a\nrange of social,\ncultural, physical\nand mental\nbackgrounds\n1.5 Planning skills to\norganize required\nresources and\nequipment to meet\nlearning needs\n\n--- PDF PAGE 14 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n10\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1.6 Reporting skills to\norganize\ninformation;\nassess information\nfor relevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n1.7 Facilitation skills to\nconduct small\ngroup training\nsessions\n2. Foster\nindividual and\nteam growth\n2.1. Learning and\ndevelopment program\ngoals and objectives\nare identified to match\nthe specific\nknowledge and skills\nrequirements of\ncompetency\nstandards\n2.2. Learning delivery\nmethods are\nappropriate to the\nlearning goals, the\nlearning style of\nparticipants and\navailability of\nequipment and\nresources\n2.3. Workplace learning\nopportunities and\ncoaching/ mentoring\nassistance are\nprovided to facilitate\nindividual and team\nachievement of\ncompetencies\n2.4. Resources and\ntimelines required for\nlearning activities are\nidentified and\napproved in\naccordance with\norganizational\nrequirements\n2.1 Advanced\ncoaching and\nmentoring\ntechniques\n2.2 Performance\nevaluation\nconcepts\n2.3 Training and\ndevelopment\ntechniques\n\n2.1 Instructional\nplanning and\ndelivery skills\n2.2 Monitoring and\nevaluation skills\n2.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 15 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n11\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from\nindividuals or teams is\nused to identify and\nimplement\nimprovements in\nfuture learning\narrangements\n3.2 Outcomes and\nperformance of\nindividuals/teams are\nassessed and\nrecorded to determine\nthe effectiveness of\ndevelopment\nprograms and the\nextent of additional\nsupport\n3.3 Modifications to\nlearning plans are\nnegotiated to improve\nthe efficiency and\neffectiveness of\nlearning\n3.4 Records and reports of\ncompetency are\nmaintained within\norganizational\nrequirement\n3.1 Types and levels\nof learning\nevaluation\n3.2 Learning styles\nand strategies\n3.3 Training and\ndevelopment\napproaches\n\n3.1 Instructional\nplanning and\ndelivery skills\n3.2 Monitoring and\nevaluation skills\n3.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 16 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Develop team\ncommitment and\ncooperation\n4.1 Open communication\nprocesses to obtain\nand share information\nis used by team\n4.2 Decisions are\nreached by the team\nin accordance with its\nagreed roles and\nresponsibilities\n4.3 Mutual concern and\ncamaraderie are\ndeveloped in the\nteam\n4.4 Career planning for\neach member are\nmonitored\n4.1 Career\ndevelopment for\ngroup members\n4.2 Principles of team\ncommitment and\ncooperation\n4.3 Team dynamics\nand performance\n4.1 Instructional\nplanning and\ndelivery skills\n4.2 Monitoring and\nevaluation\nskills\n4.3 Mentoring and\ncoaching skills\n5. Facilitate\naccomplishment\nof team goals\n5.1 Team members\nactively participated\nin team activities and\ncommunication\nprocesses\n5.2 Teams members\ndeveloped individual\nand joint\nresponsibility for their\nactions\n5.3 Collaborative efforts\nare sustained to\nattain organizational\ngoals\n5.1 Group\nDevelopment\nProcess and\nPrinciples as\napplied in the\nworkplace\n5.2 Principles of\norganizational\ndevelopment\n5.3 Collaboration\nprinciples and\nprocedures\n\n5.1 Instructional\nplanning and\ndelivery skills\n5.2 Monitoring and\nevaluation\nskills\n5.3 Mentoring and\ncoaching skills\n5.4 Organizational\nleadership\n\n--- PDF PAGE 17 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning and\n development needs\n\nMay include:\n1.1 Coaching, mentoring and/or supervision\n1.2 Formal/