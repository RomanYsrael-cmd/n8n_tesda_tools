CE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n2.3  Timeline, \nmethodology, \nand sources of \ndata are \ncommunicated to \nimport sea freight \nstaff in accordance \nwith the checklist. \n2.10 Quality Management \nSystem \n2.11 Standard Operating \nProcedures \n2.12  Key Result Areas \nIndicators \n2.13 Data privacy Act \n3. Conduct data \ngathering    \n3.1 Data to be \ngathered is \nassigned to import \nsea freight staff in \naccordance with \ntheir respective \nfunction.  \n3.2 Data gathering is \nmonitored based on \ncompany policies. \n3.3 Data gathered is \nreviewed in \naccordance with \nestablished \nprocedures. \n \n3.1  Business Etiquette \n3.2 Business Writing  \n3.3 Standard Operating \nProcedures, Forms and \nMaterials \n3.4 Units of Measurements \n3.5 Conversions of \nMeasurement \n3.6  Calculation of Charges \n3.7 Commodity \ncharacteristics, \nprohibitions and \nrestrictions \n3.8 Computer operation \n3.9 Quality Management \nSystem \n3.10 Key Performance \nIndicators \n3.1 Problem-solving \nskills  \n3.2 Time \nmanagement \nskills \n3.3  Work planning \nand \norganizational \nskills \n3.4 Interpersonal \nskills \n3.5 Result Oriented \n3.6  Communication \n3.7  Critical Thinking \n3.8  Risk \nManagement  \n \n \n4. Evaluate report \n4.1 Data gathered is \nvalidated for \naccuracy and \ncompleteness \nbased on required \nreport \n4.2 Data gathered is \nsegregated \naccording to report \nrequirement \n4.3 Recommendation/s \nbased on the \nanalysis of data is \npresented to \nsuperior authority in \naccordance with \nreportorial \nrequirements. \n \n4.1 Business Etiquette  \n4.2 Business Writing  \n4.3 Standard Operating \nProcedures, Forms and \nMaterials \n4.4 Units of Measurement \n4.5 Conversions of \nMeasurement \n4.6 Declared Value of \ngoods  \n4.7 Commodity \ncharacteristics, \nprohibitions and \nrestrictions \n4.8 Computer operation  \n4.9 Quality Management \nSystem \n4.