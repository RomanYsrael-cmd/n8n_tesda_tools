        "source_text": "MTO132304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes required to\nensure the proper handling, distribution, and control of shipping\ndocuments involved in seafreight Import operations.\n\nELEMENTS\nPERFORMANCECR\nITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Receive all\nrelevant import\nsea freight\ninformation and\ndocuments\n1.1 All initial details,\ndocuments &\nspecial\ninstructions of\nimport sea freight\nshipments are\nreceived\n1.2 All import sea\nfreight\ndocuments from\nagents are\nchecked upon\nreceipt\n1.3 Advance import\nsea freight\ndocuments are\nverified for\ncompleteness\nand accuracy\n\n1.1 Business\nEtiquette\n1.2 Business Writing\n1.3 Obligations and\nContracts\n1.4 Negotiable\nInstruments\n1.5 Units of\nMeasurements\n1.6 Conversions of\nMeasurement\n1.7 Calculation of\nCharges\n1.8 Currency\nConversion\n1.9 Weight\n1.10 Quantity or\nnumber of\npackages\n1.11 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n1.12 Cargo Weight and\nrequired\nequipment\ncapacity\n1.13 Geography\n1.14 Cargo handling\ntools\n1.15 Computer\n1.16 Quality\nManagement\nSystem\n1.17 Standard\nOperating\nProcedures\n1.18 Key Results\nAreas and Key\nPerformance\nIndicators\n1.19 Quality Manual\n\n1.1 Problem-solving skills\n1.2 Time management\nskills\n1.3 Work planning and\norganizational skills\n1.4 Interpersonal skills\n1.5 Negotiation skills\n1.6 Result Oriented\n1.7 Communication skills\n1.8 Analytical skills\n\n--- PDF PAGE 95 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n91\nELEMENTS\nPERFORMANCECR\nITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Approve charges\nfor billing\n2.1 Charges in the\nbilling statement\nare checked\naccording to\nagreed charges\nwith the\ncustomer and\nstandard\nimport tariff\nand other\ncharges.\n2.2 Applicable\nforeign\nexchange rate is\nchecked and\napplied in\naccordance with\nPhilippine\nguiding rates.\n2.3 Billing is\napproved for\nrelease to\nconsignee or\nauthorized\nrepresentative\nwithin the\nrequired\ntimeline.\n\n2.1 Business Etiquette\n2.2 Business Writing\n2.3 Obligations and\nContracts\n2.4 Negotiable\nInstruments\n2.5 Sea freight import\nstandard local\ncharges\n2.6 Billing Processes\n2.7 Units of\nMeasurement\n2.8 Conversions of\nMeasurement\n2.9 Calculation of\nCharges\n2.10 Currency\nConversion\n2.11 Quantity or\nnumber of\npackages\n2.12 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n2.13 Cargo Weight\n2.14 Geography\n2.15 Computer\n2.16 Quality\nManagement\nSystem\n2.17 Standard\nOperating\nProcedures\n2.18 Key Performance\nIndicators\n2.19 Quality Manual\n2.1 Problem-solving skills\n2.2 Time management\nskills\n2.3 Work planning and\norganizational skills\n2.4 Interpersonal skills\n2.5 Negotiation skills\n2.6 Result Oriented\n2.7 Communication skills\n\n3. Request for\npayment is reviewed\nand approved\n\n3.1 Request for\npayment is\nchecked in\naccordance with\ncarrier’s standard\ntariff\n3.2 Request for\npayment is\napproved in\naccordance with\ncompany\nprocedures.\n\n3.1 Business\nEtiquette\n3.2 Business Writing\n3.3 Obligations and\nContracts\n3.4 Negotiable\nInstruments\n3.5 Shipping\nDocuments\n3.6 Delivery Order\n3.7 Units of\nMeasurements\n\n3.1 Problem-solving skills\n3.2 Time management\nskills\n3.3 Work planning and\norganizational skills\n3.4 Interpersonal skills\n3.5 Negotiation skills\n3.6 Result Oriented\n3.7 Communication skills\n\n--- PDF PAGE 96 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n92\nELEMENTS\nPERFORMANCECR\nITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.3 Work instruction\nis issued to liaison\npersonnel for\nsettlement of\ncarrier’s charges\nin accordance\nwith company\nprocedures\n\n3.8 Conversions of\nMeasurement\n3.9 Calculation of\nCharges\n3.10 Currency\nConversion\n3.11 Quantity\n3.12 Commodity\ncharacteristics,\nprohibitions and\nrestrictions\n3.13 Cargo Weight\n3.14 Geography\n3.15 Computer\n3.16 Standard\nOperating\nProcedures\n3.17 Key Performance\nIndicators\n3.18 Business\nProcesses\n3.19 Quality Manual\n4. Monitor proper\nhandling of\nseafreight import\ndocuments\n4.1 Regular audit of\ndocumentation is\nconducted\naccording to\ncompany\nprocedures.\n4.2 Deviations from\nStandard\nOperating\nProcedures on\nseafreight import\ndocumentation\nare identified in\naccordance with\nestablished\ncompany\nprocedures.\n4.3 Corrective and\npreventive\nmeasures are\nadapted in\naccordance with\ncompany\npolicies.\n4.1 Business Etiquette\n4.2 Business Writing\n4.3 Obligations and\nContracts\n4.4 Performance Audit\n4.5 Sea freight import\ndocumentation\n4.6 Occupational Safety\nand Health\nRequirements\n4.7 Environmental\nLaws\n4.8 Computer operation\n4.9 Standard Operating\nProcedures\n4.10 Key performance\nIndicators\n4.11 Quality Manual\n4.1 Problem-solving skills\n4.2 Time management\nskills\n4.3 Work planning and\norganizational skills\n4.4 Interpersonal skills\n4.5 Negotiation skills\n4.6 Result Oriented\n4.7 Communication skills\n\n5. Organize and\npreserve relevant\ndocuments for\nfuture reportorial\npurposes.\n5.1 Relevant\ndocuments are\nidentified for safe\nkeeping in\naccordance with\n5.1 Business Etiquette\n5.2 Business Writing\n5.3 Performance\nReview\n\n5.1 Problem-solving skills\n5.2 Time management\nskills\n5.3 Work planning and\norganizational skills\n5.4 Interpersonal skills\n\n--- PDF PAGE 97 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n93\nELEMENTS\nPERFORMANCECR\nITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\ncompany\nprocedures\n5.2 Relevant\ndocuments are\nsorted out in\naccordance with\ncompany\nprocedures.\n5.3 Relevant\ndocuments are\nstored in\naccordance with\nthe retention\npolicy of the\ncompany.\n\n5.4 Occupational Safety\nand