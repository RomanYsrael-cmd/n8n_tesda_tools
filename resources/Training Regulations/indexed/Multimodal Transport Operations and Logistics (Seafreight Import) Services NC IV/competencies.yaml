        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consult appropriate personnel or OSH reference\nguides for proper guidance based on workplace\npolicies and procedures\n1.2. Evaluate current practices and programs based on\nacceptable level of OSH work standards\n1.3. Identify OSH work improvement initiatives that are\nrelevant with the workplace scenario\n1.4. Present OSH program improvement plans based on\nworkplace policies and procedures\n1.5. Communicate approved improvements on OSH\nwork program initiatives based on workplace\npolicies and procedures\n1.6. Monitor implementation of the approved OSH\ninitiatives in accordance with workplace policies and\nprocedures\n1.7. Evaluate implementation of approved OSH\ninitiatives based on workplace policies and\nprocedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n3.4 Observation/Demonstration and oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 40 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n36\nUNIT OF COMPETENCY\n: LEAD TOWARDS IMPROVEMENT OF\nENVIRONMENTAL WORK PROGRAMS, POLICIES\nAND PROCEDURES\n\nUNIT CODE\n:"
        },
        "source_text": "500311407\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto assess Occupational Safety and Health (OSH) practices\nand programs, recommend OSH program improvement\ninitiatives, and implement recommended improvements on\nOccupational\nSafety\nand\nHealth\n(OSH)\nPrograms,\nProcedures and Policies\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Assess\n Occupational\nSafety and\nHealth (OSH)\npractices and\nprograms\n1.1 OSH practices and\nprograms are\nreviewed based on\nworkplace policies\nand procedures\n1.2 Appropriate\npersonnel or OSH\nreference guides\nare consulted for\nproper guidance\nbased on workplace\npolicies and\nprocedures\n1.3 Current practices\nand programs are\nevaluated based on\nacceptable level of\nOSH work standards\n1.1. OSH practices\nand programs\nworkplace\npolicies and\nprocedures\n1.2. OSH reference\nguides\n1.3. OSH work\nstandards\n1.1. Critical thinking\nskills\n1.2. Evaluating skills\n2. Recommend\nOSH program\nimprovement\ninitiatives\n2.1 OSH work\nimprovement\ninitiatives are\nidentified that are\nrelevant with the\nworkplace scenario\n2.2 OSH program\nimprovement plans\nare organized based\non workplace\npolicies and\nprocedures\n2.3 OSH program\nimprovement plans\nare presented based\non workplace\npolicies and\nprocedures\n2.1. OSH Programs\n2.2. OSH work\nimprovement\ninitiatives\n2.1. Presentation Skills\n2.2. Communication\nskills\n2.3. Collaborating skills\n2.4. Critical thinking\nskills\n2.5. Observation skills\n\n--- PDF PAGE 37 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n33\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Implement\nrecommended\nimprovements\non Occupational\nSafety and\nHealth (OSH)\nPrograms,\nProcedures and\nPolicies\n3.1 Approved\nimprovements on\nOSH work\nimprovement\ninitiatives are\ncommunicated\nbased on workplace\npolicies and\nprocedures\n3.2 Concern personnel\nare guided in\naccordance with\nworkplace policies\nand procedures\n3.3 Implementation of\nthe approved OSH\ninitiatives are\nmonitored in\naccordance with\nworkplace policies\nand procedures\n3.4 Implementation of\napproved OSH\ninitiatives are\nevaluated based on\nworkplace policies\nand procedures\n3.1. Coaching\nConcepts\n3.2. OSH work\nimprovement\ninitiatives\n3.3. Supervisory\nConcepts\n3.1. Monitoring Skills\n3.2. Evaluation Skills\n3.3. Auditing Skills\n3.4. Coaching Skills\n3.5. Supervisory Skills\n\n--- PDF PAGE 38 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Practices and\nPrograms\nMay include::\n1.1 Planning, implementation and maintenance of\nmanufacturing plants\n1.2 Work-physiological, psychological, ergonomic and\nhygienic practices and programs\n1.3 First aid within the workplace\n1.4 Safety inspection practices\n\n2. OSH Reference Guides\nMay include:\n2.1 Occupational Safety and Health Standards Book\n2.2 OSHA Safety Bulletins and Magazines\n2.3 Equipment Safety Operating Instructions\n2.4 Established National Safety Management Books\n2.5 Credible OSH Web-sites\n2.6 Safety Solution Guide Books and Handbooks\n3. OSH Work Improvement\nInitiatives\nMay include:\n3.1 Eliminate the hazard altogether (i.e., get rid of the\ndangerous machine)\n3.2 Isolate the hazard from anyone who could be harmed\n(i.e., keep the machine in a closed room and operate\nit remotely; barricade an unsafe area off)\n3.3 Substitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n3.4 Use administrative controls to reduce the risk (i.e.,\ntrain workers how to use equipment safely; train\nworkers about the risks of harassment; issue\nsignage)\n3.5 Use engineering controls to reduce the risk (i.e.,\nattach guards to the machine to protect users)\n3.6 Use personal protective equipment (i.e., wear gloves\nand goggles when using the machine)\n\n--- PDF PAGE 39 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n35\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consult appropriate personnel or OSH reference\nguides for proper guidance based on workplace\npolicies and procedures\n1.2. Evaluate current practices and programs based on\nacceptable level of OSH work standards\n1.3. Identify OSH work improvement initiatives that are\nrelevant with the workplace scenario\n1.4. Present OSH program improvement plans based on\nworkplace policies and procedures\n1.5. Communicate approved improvements on OSH\nwork program initiatives based on workplace\npolicies and procedures\n1.6. Monitor implementation of the approved OSH\ninitiatives in accordance with workplace policies and\nprocedures\n1.7. Evaluate implementation of approved OSH\ninitiatives based on workplace policies and\nprocedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n3.4 Observation/Demonstration and oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 40 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n36\nUNIT OF COMPETENCY\n: LEAD TOWARDS IMPROVEMENT OF\nENVIRONMENTAL WORK PROGRAMS, POLICIES\nAND PROCEDURES\n\nUNIT CODE\n:"
