uction\nprocedures\n1.2 Interpreting\ninstructions,\nprocedures,\ninformation and\nsigns relevant to\nwork activities\n1.3 Working\ncollaboratively with\nothers when\ncompleting\nworkplace\norientation and\ninduction\nprocedures\n1.4 Risk management\n1.5 Working\nsystematically with\nrequired attention to\ndetail without injury\nto self or others, or\ndamage to goods or\nequipment\n1.6 Identifying and\ncorrectly using\nequipment,\nprocesses and\nprocedures\n\n--- PDF PAGE 49 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n45\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.6 Workplace\nemergency\nprocedures are\nidentified and\nfollowed in real and\nsimulated situation\n1.7 Selecting and using\nrequired personal\nprotective\nequipment\nconforming to\nindustry and OS&H\nstandards\n2. Plan and\norganize an\nassigned daily\nroutine\n\n2.1 Daily routine is\nplanned to take into\naccount rosters,\nindustrial\nagreements, agents,\nvendors, client’s\nagreements, and\nworkplace\nprocedures\n2.2 Clarification of\nrequirements of\ntasks is sought\nwhen appropriate\n2.3 Achievable time and\nother performance\nmeasures/criteria\nare agreed\n\n2.1 Ways of planning\ndaily routine to take\ninto account\nrosters, industrial\nagreements and\nworkplace\nprocedures\n2.2 Techniques of\nclarifying\nrequirements of\ntasks\n2.3 Relevant OS&H\nand environmental\nprotection\nprocedures and\nguidelines\n2.4 Basic Mathematics\n2.5 Operation of\ncomputer and\nappropriate\nsoftware\n2.1 Planning daily\nroutine taking into\naccount rosters,\nindustrial\nagreements and\nworkplace\nprocedures\n2.2 Seeking clarification\nof requirements of\ntasks when\nappropriate\n2.3 Agreeing achievable\ntime and other\nperformance\nmeasures\n\n3.1 Organize and\naccept\nresponsibility\nfor assigned\nworkload\n\n3.1 Priorities, schedules\nand deadlines are\nestablished in\nconsultation with\nconcerned parties\n3.2 Work activities are\nplanned and\nprogress of work is\ncommunicated to\nothers whose\npersonal work plans\nand timelines may\nbe affected\n3.3 Work is completed\nto the standard\nexpected in the\nworkplace and in\naccordance with any\nguidelines,\ndirections or\ninstructions/\ninformation\n\n3.1 Ways of\nestablishing\npriorities and\ndeadlines\n3.2 Work planning and\nmethod of\ncommunicating\nwork progress to\nothers\n3.3 Company work\nguidelines,\ndirections or\ninstructions\n3.4 Workplace\nstructures and the\nroles and\nresponsibilities of\nteam/group\nmembers\n3.5 Leadership\nConcepts:\n3.5.1 Types of\nDecisions\nTeams Make\n3.1 Prioritizing and\nmeeting deadlines\n3.2 Planning and\ncommunicating work\nprogress to others\n3.2 Completing work\nto the expected\nstandard in the\nworkplace and in\naccordance with\nany guidelines,\ndirections\n3.3 Leading\n3.4 Communicating\nadditional support\nto improve work to\nappropriate\npersonnel\n\n--- PDF PAGE 50 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n46\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.4 Additional support to\nimprove work is\ncommunicated\nclearly to\nappropriate\npersonnel\n3.5.2 Team\nResponsibilities\n3.5.3 Problems That\nAffect Teams\n3.5.4 Building Strong\nTeam\nCommunication\n3.5.5 Team Problem-\nSolving\n3.6 Relevant OS&H\nand environmental\npractices and\nguidelines\n3.7 Basic Mathematics\n3.8 Work Planning\n3.9 Workplace\nstructures and roles\nand responsibilities\nof team members\n3.10\nOperation of\ncomputer and\nappropriate\nsoftware\n4 Apply ethical\npractices\n\n4.1 Workplace\nprocedures,\nregulations and\nlegislation\nappropriate to the\nposition are\nidentified and\nfollowed\n4.2 Commitments and\nundertakings to\nclients, colleagues\nand supervisors are\nmet\n4.3 Required\nconfidentiality is\nmaintained\n4.4 Appropriate codes\nof acceptable and\nethical work\npractices are\napplied\n4.5 Workplace securit