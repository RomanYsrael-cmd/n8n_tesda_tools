hical work\npractices\n\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials and new technologies relevant to the unit of\ncompetency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n3.3 Interview\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 53 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n49\nUNIT OF COMPETENCY : PERFORM WORKPLACE SECURITY AND SAFETY\nUNIT CODE\n :\nMTO432202\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to follow\nsecurity procedures in the freight forwarding and\ndocumentation services. It includes checking and maintaining\nthe security the workplace, identifying security threats or\nsituations, and responding to a security threat or situation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Maintain\nsecurity of the\nworkplace\n\n1.1 Workplace is secured\nwithin specified\nlocations in\naccordance with\nworkplace security\nprocedures and\napplicable security\nregulations\n1.2 Security measures\nare checked and\nmaintained in\naccordance with\nworkplace safety and\nsecurity procedures\n1.3 Signs of potential\nhazards and\ninterferences are\nrecognized and\nreported in\naccordance with\nworkplace security\nprocedures\n1.4 Any breach of\nsecurity requirements\nare reported promptly\nto designated\npersonnel in\naccordance with\nworkplace safety and\nsecurity procedures\n1.1 Applicable transport\nsecurity legislation\nincluding relevant\ninternational, national,\nstate and territory\nacts, regulations\ncodes and/or\nguidelines\n1.2 Relevant workplace\nsecurity program and\npolicies and\nprocedures for\nresponding to security\nthreats, situations and\nemergencies\n1.3 Relevant quarantine\nand bond regulations\nand requirements\n1.4 Common security\nthreats and incidents\nthat may occur in the\nworkplace and related\nroles and\nresponsibilities of\npersonnel when\nreporting them and\nresponding to them\n1.5 OSH and\nenvironmental\nprotection procedures\n1.6 Basic mathematical\noperations\n1.7 Locks and other\nsecurity measures\n1.8 Common security\nproblems that may\noccur when carrying\nout operations in the\ntransport and logistics\nindustries\n1.1 Communicating\neffectively with\nconcerned parties\nwhen following\nsecurity procedures\n1.2 Interpreting\ninstructions,\nprocedures,\napplicable\nregulatory\nrequirements,\nlabels, markings, ID\ncards and other\ninformation relevant\nto workplace safety\nand security\n1.3 Completing\nrequired\ndocumentation and\nreports related to\nsafety and security\nprocedures\n1.4 Applying\nprocedures for\nsafety, security\nchecks and\nprecautions as per\nlimits of role and\nresponsibilities\n\n--- PDF PAGE 54 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n50\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Identify a\nsecurity threat\nor situation\n\n2.1 Security threat or\nsituation is promptly\nidentified and\nassessed\n2.2 Response is\nprioritized in\naccordance with the\nworkplace security\nprogram and\nprocedures\n2.3 Implications of the\nsecurity threat or\nsituation are\nevaluated in\naccordance with\nworkplace security\nprogram and\nprocedures\n\n2.1 Applicable transport\nsecurity legislation\nincluding relevant\ninternational, national,\nstate and territory\nacts, regulations\ncodes and/or\nguidelines\n2.2 Relevant workplace\nsecurity program and\npolicies and\nprocedures for\nresponding to security\nthreats, situations and\nemergencies\n2.3 Relevant quarantine\nand bond regulations\nand requirements\n2.4 Common securi