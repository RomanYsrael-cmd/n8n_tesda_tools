iew\n\n--- PDF PAGE 174 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n170\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.4 Analyze data\ngathered\n• Discuss and explain review\nimplementation of data gathered\n• Review implementation of data\ngathered\n• Lecture\n• Demonstration\n• Group\ndiscussion\n• Written and oral\nExamination\n• Demonstration\nwith questioning\n\n2 hours\n• Discuss and explain assessment of\nimplementation of data gathered\n• Assess implementation of data\ngathered\n• Lecture\n• Demonstration\n• Case study\n• Group\ndiscussion\n• Written and oral\nExamination\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n\n• Discuss and explain evaluation of\nimplementation of data gathered\n• Evaluate implementation of data\ngathered\n• Lecture\n• Case study\n• Video\npresentation\n• Group\ndiscussion\n• Written and oral\nExamination\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n\n• Discuss and explain validation\nimplementation of data gathered\n• Validate implementation of data\ngathered\n• Lecture\n• Case study\n• Video\npresentation\n• Group\ndiscussion\n• Written and oral\nExamination\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n\n--- PDF PAGE 175 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n171\n3.1 TRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\nb.\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n1.\nThe competency – based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nand their variations/components may be adopted singly or combination with other\nmodalities when designing and delivering training programs:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as laboratory\nor field-work components.\n\n--- PDF PAGE 176 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n172\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship – is based on training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – short term programs conducted by Non-Government\nOrganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be Mobile Training\nPrograms (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees who want to enroll in this qualification must possess the following\nrequirements:\n\n• Must have completed the ten (10) year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with Grade 10 equivalent holder\n• Must possess good communication skills\n• Must be computer literate\n\n--- PDF PAGE 177 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n173\n3.2\nTOOLS, EQUIPMENT AND MATERIALS\n\nMULTIMODAL TRANSPORT OPERATIONS AND LOGISTICS (SEAFREIGHT\nIMPORT) SERVICES NC IV\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for Multimodal Transport Operations and Logistics\nServices NC IV are as follows:\n\nQTY.\nEQUIPMENT\nQTY.\nTOOLS/MATERIALS\nQTY.\nREFERENCES\n1 unit Executive Table\n1 unit\nForms and Materials\n1 unit\nBusiness Process\nManual\n\nTables and\nChairs for 25\nstudents\n1 unit\nCalculator\n1 unit\nHarmonize\nSystems Code and\nTrade Agreements\n1 unit Clerical Table\n1 unit\nInternet Connection\n1 unit\nDictionary of\nShipping Terms\n 1 pc. Whiteboard\n1 unit\nTraining Handouts\n1 unit\nEmployees\nManuals /\nHandbook\n1 unit USB of\nPowerPoint\npresentation\n1 unit\nBusiness Cards\n1unit\nEmployee Profiles /\nTerms of\nReference\n1 unit LCD Projector\n1 unit\nStationaries / Business\nLetterheads\n1unit\nTACT Rules Book\n1 unit Laptop (for\nlecturer)\n1 unit\nLogbook / Master files\n1unit\nICC Incoterms\n1 unit Computer for\nadministrative\nand clerical work\n1 unit\nCertificates\n1 unit\nDG Books\n5\nunits\nComputer for\ntechnology\nresource center\nand class\ndemonstration\n1 unit\nForms (Report and\nEvaluation)\n1 unit\nWork Instructions\n1 unit Different media\nChannels\n(telephone,\nemails, viber,\nskype)\n1 unit\nWorld Map\n1 unit\nBasic Occupational\nSafety and Health\n1 unit Laser pointer\n1 unit\nTable of Measurement /\nConversion Table\n1 unit\nForeign Exchange\nRates\n1 unit Air-conditioning\nUnit\n1 unit\nQuality Management\nSystems\n1 unit\nQuality Operation\nManuals\n1 unit\nAV Equipment\n1 unit\nShipping lines schedule\n1 unit\nEnvironmental\nLaws\n1 unit\nSound System\n\n1 unit\nLocal Regulations\n(BOC, DENR,\nLTFRB, DTI, etc.)\n\n1 unit\nAgency contracts /\nagreements\n\n1 unit\nTransport Tariff\n(e.g. Destination,\nOrigin)\n\n--- PDF PAGE 178 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n174\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\n\nStudent/Trainee Performance Space\n(S/TPS)\n\n5 x 8 m.\n\n43 sq. m.\n\nTechnology Resource Center (TRC)\n\n2 x 5 m.\n\n10 sq. m.\n\nCirculation Area\n\n(S/TPS+PSR+TRC+C\nR) X 30%\n(40+6+10+10) X\n30%=19.8sq.m.)\n\n23sq. m.\n\nSeparate Restrooms for Male and Female\nTrainees/ Students (CR)\n\n2 x 5 m.\n\n10 sq. m.\n\nTotal Workshop Area\n\n86 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR MULTIMODAL TRANSPORT OPERATIONS\nAND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NC IV\n\n• Must be a holder of NTTC I in Multimodal Transport Operations and Logistics\nServices ( Seafreight Import) NC IV\n• Must have at least 4 years job / freight forwarding documentation services\nexperience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 179 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n175"
