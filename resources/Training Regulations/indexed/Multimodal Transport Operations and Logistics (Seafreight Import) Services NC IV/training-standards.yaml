athered\n• Assess implementation of data\ngathered\n• Lecture\n• Demonstration\n• Case study\n• Group\ndiscussion\n• Written and oral\nExamination\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n\n• Discuss and explain evaluation of\nimplementation of data gathered\n• Evaluate implementation of data\ngathered\n• Lecture\n• Case study\n• Video\npresentation\n• Group\ndiscussion\n• Written and oral\nExamination\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n\n• Discuss and explain validation\nimplementation of data gathered\n• Validate implementation of data\ngathered\n• Lecture\n• Case study\n• Video\npresentation\n• Group\ndiscussion\n• Written and oral\nExamination\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n\n--- PDF PAGE 175 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n171\n3.1 TRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\nb.\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n1.\nThe competency – based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nand their variations/components may be adopted singly or combination with other\nmodalities when designing and delivering training programs:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as laboratory\nor field-work components.\n\n--- PDF PAGE 176 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n172\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship – is based on training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – short term programs conducted by Non-Government\nOrganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be Mobile Training\nPrograms (MTP)."
