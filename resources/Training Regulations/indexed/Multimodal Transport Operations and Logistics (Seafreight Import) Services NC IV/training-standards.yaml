ate\nindividual performance attributed to\nlearning programs\n• Case study on modification of learning\nplan based on performance\n• Lecture/\nDiscussion\n• Case Study\nRole Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n--- PDF PAGE 116 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n112\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.4 Develop team\ncommitment and\ncooperation\n• Discussion on team commitment and\ncooperation and its impact to attainment of\ngoals\n• Play games on team commitment and\ncooperation\n• Discussion on team dynamics and its\nrelation to team performance\n• Play games on team dynamics and\nperformance\n• Development of career plans\n\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n2.5 Facilitate\naccomplishment of\nteam goals\n• Perform team building activities towards\nimproving communication among team\nmembers, goal setting and improving\nperformance\n• Case studies involving collaborative\nactivities to improve attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 hour\n\n--- PDF PAGE 117 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n113\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n3. Perform higher-\norder thinking\nprocesses and\napply techniques\nin the workplace\n3.1 Evaluate\neffectiveness and\nefficiency of the\nworkplace systems,\nprocesses and\nprocedures\n• Examine current systems, standards,\nprocedures and protocols in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance\nto different situations\n• Form habit of asking questions and\ntaking responsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n--- PDF PAGE 118 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n114\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit of\ncritical inquiry and\ncuriosity in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance to\ndifferent situations\n• Form habit of asking questions and taking\nresponsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss insights on workplace\neffectiveness and efficiency\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n3.3 Develop practical\naction plans for\nimproving\nworkplace\nconditions\n• Use range of analytical techniques,\ngrowth mindset and positive\ncommunication strategies in developing\naction plans for efficiency and\neffectiveness\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss concepts creative negotiation\nskills, change management and\nimprovement strategies\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n• Project-based\nlearning\n2 hours\n\n--- PDF PAGE 119 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n115\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to the\npractice of social\njustice in the\nworkplace\n\n4.1 Update self on\nlocal, national and\nglobal trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecting interaction and\nconnectedness of communities at local,\nnational and global levels\n• Explain underlying assumptions and\npower dynamics (politics, understanding\npolitical system, social structures, labor\nlaws, labor relations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions\nand interactive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n\n4.2 Relate local and\nglobal trends to\nworkplace context\n• Discuss the different levels of human\nidentity according to Amber Mayer (2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and\nrespect for cultural diversity\n• Recognize differences and commonalities\namong people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends, and\nvice versa.\n• Interactive\nLecture\n• Small 