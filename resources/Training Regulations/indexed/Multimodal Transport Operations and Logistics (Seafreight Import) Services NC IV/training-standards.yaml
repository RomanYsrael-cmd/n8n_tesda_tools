      "source_text": "TESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language,\nenvironment\nand\nother\nacademic\nsubjects\nshall\nbe\ncontextualized. To this end, TVET providers shall develop a Contextual Learning Matrix\n(CLM) to include Technology, Science, Math, English/Communication and Safety to\nEnvironment. Includes also green technology, issues on health and drugs and cater to\nperson with disabilities (PWD’s)\nCourse Title: MULTIMODAL TRANSPORT OPERATIONS AND LOGISTICS\n(SEAFREIGHT IMPORT) SERVICES\n NC Level: NC IV\n\nNominal Training Duration:\nNo. of Hours\nCoverage\n 47 Hrs.\nBasic Competencies\n 48 Hrs.\nCommon Competencies\n 58 Hrs.\n153 Hrs.\n 82 Hrs.\n205 Hrs.\nCore Competencies\n\nSIL\nTotal\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in supervising/managing activities involving import seafreight,\noverseeing the import seafreight team’s performance, coordinating with overseas agents on\nshipment status particularly on any irregularity, controlling shipping documents, ensuring\nthat claims arising from cargo losses, damages, theft and other irregularities are processed,\nevaluating reports required to support business decisions and complying with government\nrequirements. This include classroom learning activities and practical work in actual work\nsite or simulation area.\n\n--- PDF PAGE 112 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n108\n\n The training institution has the option to introduce other methodologies to deliver the\nprogram or the course and to partner with other individuals/organizations that would be able\nto provide training resources in the conduct of the course.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieve.\n\n--- PDF PAGE 113 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n109\nBASIC COMPETENCIES\n ( 47) Hours\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n• Read\n➢ Communication process\n➢ Dynamics of groups and different\nstyles of group leadership\n•\nIdentify different approaches to meet\nthe needs of clients and colleagues\n• Lecture\n• Written\nexamination\n1 hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n• Apply communication skills to fulfill job\nroles as specified by the organization\n• Apply communication techniques in\ncommunicating with clients and colleagues\n➢ Active listening\n➢ Feedback\n➢ Interpretation\n➢ Role boundaries setting\n➢ Negotiation\n➢ Establishing empathy\n• Describe strategies for internal and\nexternal dissemination of information\n• Demonstration\n• Group discussion\n• Observation\n• Oral evaluation\n1 hour\n1.3. Deliver a technical\npresentation\n• Enhance the presentation using\nappropriate media\n• Deliver a clear and sequential presentation\nwithin given time\n• Demonstration\n• Observation\n1 hour\n\n1.4 Represent the\norganization\n\n• Describe criteria for a good presentation\n• Prepare presentation material for internal\nor external forums to promote the\norganization\n• Demonstration\n• Observation\n1 hour\n\n--- PDF PAGE 114 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n110\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.5 Facilitate group\ndiscussion\n• Gather relevant information\n• Apply