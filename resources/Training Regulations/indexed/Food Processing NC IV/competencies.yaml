          "source_text": "11.   Wear Personal \nProtective   Equipment \n \n1.1 Personal protective equipment are checked \naccording to manufacturer’s specifications \n \n1.2 Personal protective equipment are worn \naccording to the job requirement\n2.   Observe Personal \nHygiene and Good \nGrooming\n2.1    Personal hygiene and good grooming is practiced \nin line with workplace health and safety \nrequirements \n3.   Implement Food  \nSanitation Practices \n \n3.1 Sanitary  food handling practices are implemented \nin line with workplace sanitation regulations \n \n3.2   Safety measures are observed in line with \nworkplace safety practices.\n4.  Render Safety \nMeasures and First Aid \nProcedures \n \n4.1   Safety measures are applied according to \nworkplace rules and regulations \n \n4.2   First aid procedures are applied and coordinated \nwith concerned personnel according to workplace \nstandard operating procedures. \n5.   Implement \nhousekeeping activities  \n \n5.1   Work area and surroundings are cleaned in \naccordance with workplace health and safety \nregulations \n \n5.2   Waste is disposed according to organization’s \nwaste disposal system \n \n5.3   Hazards in the work area are recognized and \nreported to designated personnel according to \nworkplace procedures\n\n--- PDF PAGE 27 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n25\n \n \nRANGE OF VARIABLES \n \nVARIABLE \n             RANGE \n1. Manufacturer’s \nSpecifications \nManufacturer’s specifications may include but not \nlimited to: \n \n1.1   Handling \n1.2   Operating \n1.3   Discharge Label \n1.4   Reporting \n1.5   Testing \n1.6   Positioning \n1.7   Refilling \n2. Personal  Protective \nEquipment \nPersonal Protective Equipment may include but not \nlimited to: \n \n2.1 Apron/laboratory gown \n2.2 Mouth masks \n2.3 Gloves \n2.4 Rubber boots/safety shoes \n2.5 Head gears such as caps, hair nets, ear plug \n3.  Workplace Health and \nSafety Requirements \nWorkplace and Safety Requirements may include: \n \n3.1  Health/Medical Certificate \n3.2  DOLE requirements \n3.3  BFAD requirements \n3.4  Personal Hygiene and good grooming \n3.5  Plant Sanitation and waste management \n4.  Safety  Measures \nSafety measures may include but not limited to: \n \n4.1   Labeling of  chemicals and other sanitizing agents \n4.2  Installation of  fire fighting equipment in the work \narea \n4.3  Installation of  safety signages  and symbols \n4.4  Implementation of  5S in the work area \n4.5  Removal of combustible material in the work area\n\n--- PDF PAGE 28 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n26\n \n \n5.   First Aid Procedures \nFirst Aid Procedures may include but not limited to: \n \n5.1   Mouth to mouth resuscitation \n5.2   CPR \n5.3   Application of tourniquet \n5.4   Applying pressure to bleeding wounds or cuts \n5.5 First aid treatment for burned victims \n6.  Hazards \nHazards in the workplace may include but not limited \nto:  \n \n6.1  Physical \n6.2  Biological \n6.3  Chemical\n\n--- PDF PAGE 29 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n27"
