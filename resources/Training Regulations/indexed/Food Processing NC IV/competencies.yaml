        "source_title": "MAINTAIN FOOD SAFETY WHEN LOADING, UNLOADING. AND TRANSPORTING FOOD",
        "source_text": "--- PDF PAGE 70 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n68\n \n \nUNIT OF COMPETENCY: MAINTAIN FOOD SAFETY WHEN LOADING, \nUNLOADING. AND TRANSPORTING FOOD \n                                            \nUNIT CODE                     : AGR741324 \n \nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes \nrequired to load and transport food ingredients and products \nconsidering the food safety aspects of loading and transporting \nfood where the transport operator does not have direct \nphysical contact with food. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the Range of \nVariables \n1. Prepare to \ntransport food \n1.1 Food storage vehicles and containers/receptacles \nare checked/inspected for appropriateness for use \naccording to workplace procedures \n1.2 Food storage vehicles and containers/receptacles are \nprepared for use according to workplace procedures \n1.3 Food is loaded and secured as required, to meet \ntransportation and temperature control requirements \n1.4 Hand washing and disinfecting procedures are followed \nto meet workplace requirements \n2. Load, unload, \nand transport \nfood safely \n2.1 Food safety control measures are monitored to ensure \nthat food safety is maintained during transport following \nworkplace procedures \n2.2 Where food safety control requirements are not met, the \nincident is promptly reported and corrective action is \ntaken according to workplace requirements \n2.3 Food is unloaded as required according to transportation \nand temperature control requirements \n2.4 Other factors that can influence spoilage and \ncontamination during transport are checked and \nmonitored according to workplace procedures   \n2.5 Food safety information is recorded to meet workplace \nrequirements\n\n--- PDF PAGE 71 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n69\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1 Food storage \nvehicles \nFood storage vehicles may include but not limited to: \n1.1 Reefer vans \n1.2 Close vans \n1.3 Container vans \n1.4 Cargo trucks \n2 Containers/ \nreceptacles \nContainers/receptacles involved in this Unit of Competency \nmay include but not limited to: \n2.1 Crates (plastic or wooden) \n2.2 Sacks (plastic, red mesh, jute) \n2.3 Boxes \n2.4 Drums \n2.5\nBulk handling system\n3 Workplace \nrequirements \nWorkplace requirements may include:  \n3.1 Company policies and procedures \n3.2 Licensing requirements – regulatory  \n3.3 Legislative requirements – legal or statutory \n3.4 Industrial awards and agreements \n3.5 GMP  \n3.6 Food safety program \n3.7 Product handling specifications \n3.8 Transport schedules and instructions \n3.9\nTransport vehicle manufacturers' advice\n4 Food safety control\nFood safety controls refer to methods used to control food \nsafety hazards which may include but not limited to: \n4.1 Hand washing \n4.2 Disinfecting  \n4.3 Cleaning \n4.4\nSanitation\n5 Other factors \nOther factors that can influence spoilage and contamination \nmay include: \n5.1 Humidity \n5.2 Exposure to air \n5.3 Ventilation \n5.4 Temperature \n5.5 Stacking arrangements \n5.6 Design of vehicles \n5.7\nPests\n\n--- PDF PAGE 72 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n70\n \n \nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Determined food handling and transport requirements \n1.2 Confirmed that the vehicle and associated equipment is \nappropriate and ready for use. \n1.3 Prepared transport containers which involves checking \ncleaning records \n1.4 Prepared the storage/holding environment as required \nand confirmed that temperature parameters for the \nloading and unloading areas are met. \n1.5 Followed loading/unloading procedures for food in \ncorrect sequence and configuration to prevent \ncontamination  \n1.6 Monitored temperature parameters and related food \nsafety control points before, during and after transporting \nfood and record information in the required format \n1.7 Took appropriate corrective action in response to failure \nto meet temperature parameters or other food safety \nrequirements as required by workplace procedures \n1.8 Selected and used personal protective clothing and/or \nequipment \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 Understanding of food safety control points in the \nloading/unloading and transportation of food materials \nand product and related methods of control  \n2.2 Characteristics and nature of food transported and \nrelated transport environment requirements  \n2.3 Micro-biological, physical and chemical hazards that can \noccur when loading, transporting and unloading food  \n2.4 Methods and procedures used to control food safety \nhazards  \n2.5 Procedures used to confirm that transportation and \nrelated food safety equipment is appropriate for use and \noperational \n2.6 Food safety while in storage \n2.7 Attitudes in the workplace should include  \n2.7.1 Punctual/Time conscious \n2.7.2 Cost conscious \n2.7.3 Environmental and pollution conscious \n2.7.4 Flexible/adaptable \n2.7.5 Honest \n2.7.6 Dependable \n2.7.7 Innovative \n2.7.8 Alert \n2.7.9 Systematic and organized \n2.7.10 Committed\n\n--- PDF PAGE 73 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n71\n2.7.11 Good listener and fast learner \n2.7.12 Creative \n2.7.13 Resourceful \n2.7.14 Self–starter \n3. Underpinning \nSkills \n3.1 Cleaning and sanitizing food containers \n3.2 Inspection and monitoring skills \n3.3 Recording and reporting skills \n3.4 Sanitary food handling practices \n4. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation/Demonstration with oral questioning \n4.2 Written test \n4.3\nPortfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Vehicles, equipment and tools for loading/unloading and \ntransport \n5.3 Fruits, vegetables, fish/other marine products, meat, \npoultry and eggs to be transported  \n5.4 Materials relevant to the proposed activity   \n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.\n",
        "required_knowledge": null,
        "required_skills": null
