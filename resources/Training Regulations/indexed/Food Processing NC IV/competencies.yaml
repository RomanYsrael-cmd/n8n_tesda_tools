th hand written and printed material \n3.2. internal memos \n3.3. electronic mail \n3.4. briefing notes and  \n3.5. bulletin boards \n4. Documentation \n4.1. Audit trails \n4.2. Naming standards  \n4.3. Version control\n\n--- PDF PAGE 16 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n14"
