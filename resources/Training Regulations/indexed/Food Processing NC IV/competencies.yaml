        "source_title": "MONITOR THE IMPLEMENTATION OF ENVIRONMENTAL MANAGEMENT POLICIES",
        "source_text": "--- PDF PAGE 60 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n58\n \n \nUNIT OF COMPETENCY: MONITOR THE IMPLEMENTATION OF \nENVIRONMENTAL MANAGEMENT POLICIES \n                                            \nUNIT CODE                     : AGR741209 \n \nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes \nrequired to provide direction in the day-to-day implementation \nof environmental management policies and procedures in a \nwork area. It applies to those with formal responsibility for \nothers as well as to those required to model workplace policies \nand procedures but who have no formal management role. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the Range of \nVariables\n1. Ensure others in \nthe work area \nare able to \nimplement \nenvironmental \nwork practices \n1.1 Hazard control and personal protective clothing and \nequipment appropriate to work requirements is \nconfirmed as available and functional  \n1.2 Information on environmental policies, procedures and \nprograms is checked to be current, accessible and \ncommunicated to others in the work area  \n1.3 Information about identified hazards and the outcomes of \nrisk assessment and risk control procedures is confirmed \nas accessible and communicated to others in the work \narea  \n1.4 Environmental hazards and control measures relating \nto work responsibilities are verified to be identifiable by \nthose in the work area  \n1.5 Mentoring and coaching support is made available to \nsupport individuals/groups to implement procedures to \nsupport environmental management  \n1.6 Training needs are identified and addressed within level \nof responsibility \n          \n2. Monitor \nobservance of \nwork procedures \n2.1 Work procedures in the work area are clearly defined, \ndocumented and followed \n2.2 Deviation from identified procedures is identified, \nreported and addressed within level of responsibility  \n2.3 Personal behavior is monitored to be consistent with \nworkplace policies and procedures \n2.4\nEnvironmental hazards in the work area are identified,\n\n--- PDF PAGE 61 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n59\nmeasured and reported according to workplace \nprocedure \n2.5 Environmental information is recorded to meet workplace \nreporting requirements \n2.6 Housekeeping standards in the work area are \nmaintained \n3. Implement \nemergency \nprocedures to \nrespond to \nhazardous \nevents\n3.1 Workplace procedures for dealing with hazardous events \nare promptly implemented as required \n3.2 Hazardous events are investigated to identify cause  \n3.3 Control measures to prevent recurrence and minimize \nrisks of hazardous events are implemented \n4. Maintain and \nimprove \nenvironmental \nmanagement in \nthe work area \n4.1 Potential hazards are identified, assessed, removed or \nand/reported within level of responsibility and according \nto workplace procedure  \n4.2 Risk assessments are conducted and appropriate control \nmeasures are identified and implemented according to \nworkplace risk management procedures  \n4.3 Recommendations arising from risk assessments are \nimplemented within level of responsibility  \n4.4 Inadequacies in control measures are identified and \nreported according to workplace reporting requirements  \n4.5 The work group is consulted and advised of \nenvironmental matters relevant to work role  \n4.6 Matters raised relating to environmental issues are \npromptly resolved or referred to the appropriate \npersonnel  \n4.7 Opportunities for improving environmental performance \nare identified and raised with relevant personnel  \n4.8 Procedures are developed or revised to support effective \ncontrol of environmental hazards  \n4.9 Environmental management information is recorded \naccording to workplace reporting requirements\n\n--- PDF PAGE 62 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n60\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1 Personal \nprotective \nclothing and \nequipment  \nPersonal protective clothing and equipment may include but \nnot limited to: \n1.1 Apron/laboratory gown \n1.2 Beard cover \n1.3 Mouth masks \n1.4 Gloves  \n1.5 Rubber boots \n1.6 Head gears such as caps, hairnets, headband, ear plug \n2 Environmental \nHazards \nAn environmental hazard may include but not limited to any:   \n2.1 Activity \n2.2 Product \n2.3 Service  \nwhich has the potential to affect the environment\n\n--- PDF PAGE 63 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n61\n \n \nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Communicated information about environmental \nmanagement and related procedures to others in the \nwork area \n1.2 Provided access to and maintained current \nenvironmental management information in the work area \n1.3 Modeled work policies and procedures to support \nenvironmental management in own work \n1.4 Identified environmental hazards and controls relevant to \nwork processes and practices in the work area \n1.5 Monitored responsible resource utilization in the work \narea, consistent with company policies \n1.6 Supported others to follow environmental management \nprocedures \n1.7 Identified, reported and/or addressed environmental \nmanagement training and development needs of others \nin the work area \n1.8 Ensured that work and waste collection, treatment, \nrecycling or disposal is conducted to meet environmental \nobligations \n1.9 Ensured that appropriate and timely action is taken in \nresponse to emergencies \n1.10 Participated in investigations of non-compliance and risk \nassessment processes \n1.11 Participated in consultation processes to improve \nenvironmental management in the workplace  \n1.12 Responded to environmental hazard identification and \nhazardous incidents in an appropriate and timely way \n1.13 Reviewed practice and procedures to implement \nrecommendations arising from risk assessments and/or \nimprovement proposals within level of responsibility  \n1.14 Ensured that housekeeping standards are maintained \nand that equipment is safe to operate  \n1.15 Ensured that environmental records and documentation \nis accurate, complete and timely \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 Workplace approach to managing environmental issues \n2.2 Responsibilities of self and employer to manage \nenvironmental issues on site.  \n2.3 Legal responsibilities including awareness of any \nlicenses or agreements in place with resource \nmanagement authorities  \n2.4 Principles of environmental management including \nenergy and resources conservation and control of \nenvironmental hazards and risks\n\n--- PDF PAGE 64 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n62\n2.5 Principles of risk management including hazard \nidentification, risk assessment and risk control according \nto hierarchy of control \n2.6 Environmental hazards and control methods associated \nwith work activities and those specifically used in the \nwork area.  \n2.7 Safety hazards related to environmental management \nprocedures \n2.8 Work activities that support environmental management \nincluding any covered by special training requirements \n2.9 Consultation mechanisms and responsibilities \n2.10 Emergency response system, procedures and personnel \n2.11 Attitudes in the workplace should include  \n2.11.1 \nTime conscious \n2.11.2 \nCost conscious \n2.11.3 \nEnvironmental and pollution conscious \n2.11.4 \nFlexible/adaptable \n2.11.5 \nHonest \n2.11.6 \nInnovative \n2.11.7 \nAlert \n2.11.8 \nSystematic and organized \n2.11.9 \nCommitted \n2.11.10 Creative \n2.11.11 Resourceful \n3. Underpinning \nSkills \n3.1 \nAppropriate communication skills and techniques to \nconvey information on environmental issues to others in \nthe workplace  \n3.2 \nCalibrating skills \n3.3 \nBasic computer skills \n3.4 \nFacilitating consultation processes  \n3.5\nRecord keeping and documentation skills\n4. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation/Demonstration with oral questioning  \n4.2 Written test \n4.3\nPortfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment and tools   \n5.3\nMaterials relevant to the proposed activity  \n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.\n",
