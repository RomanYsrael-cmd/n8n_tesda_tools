        "source_title": "MONITOR THE IMPLEMENTATION OF GOOD MANUFACTURING PRACTICE PROCEDURES",
        "source_text": "--- PDF PAGE 55 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n53\n \n \nUNIT OF COMPETENCY: MONITOR THE IMPLEMENTATION OF GOOD \nMANUFACTURING PRACTICE PROCEDURES \n                                            \nUNIT CODE                     : AGR741208 \n \nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes \nrequired to provide direction in the day-to-day implementation \nof Good Manufacturing Practices (GMP) in a work area. It \nincludes supporting others to implement the requirements of \nGMP and applies to those with formal responsibility for others \nas well as to those required to model workplace policies and \nprocedures but who have no formal management role. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the Range of \nVariables \n1. Ensure others in \nthe work area \nare able to meet \nGMP \nrequirements \n1.1 Relevant clothing and equipment appropriate to work \nrequirements is confirmed as available, functional and \ncorrectly fitted according to GMP requirements \n1.2 Advice on GMP responsibilities and procedures is \nconfirmed to be accessible and clearly explained  \n1.3 GMP control measures used in the work area are \nchecked if these can be identified by those in the work \narea according to GMP and workplace procedures \n1.4 Mentoring and coaching support is confirmed as \navailable to support individuals/groups to implement \nGMP and related procedures \n1.5 Training needs are identified and addressed within level \nof responsibility \n        \n2. Monitor personal \nhygiene and \nconduct of team \nmembers in the \nwork area \n2.1 Personal hygiene of work team is confirmed to meet \nGMP requirements \n2.2 Clothing is prepared, used, stored and disposed of \naccording to GMP and workplace procedures \n2.3 Personal movement around the workplace is monitored \nto comply with area entry and exit procedures \n3. Monitor \nimplementation \nof GMP \nrequirements in \nthe work area\n3.1 GMP procedures in the work area are checked to be \nclearly defined, documented and followed  \n3.2 Non-compliance from identified procedures is reported \nand addressed within level of responsibility  \n3.3\nPersonal behavior is seen as consistent with workplace\n\n--- PDF PAGE 56 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n54\npolicies and procedures that support GMP  \n3.4 Workplace procedures to control resource allocation and \nprocess are followed to meet GMP requirements \n3.5 GMP non-conformance is identified and reported \naccording to workplace procedure  \n3.6 GMP information is recorded to meet workplace \nreporting requirements  \n3.7 The workplace is maintained in a clean and tidy order to \nmeet GMP housekeeping standards \n4. Contribute to \nvalidation \nprocesses \n4.1 Validation practices and procedures are reviewed in \nconsultation with relevant personnel  \n4.2 Validation results and issues are identified and corrective \naction taken within level of responsibility  \n4.3 Documentation and recording requirements are validated \nto meet GMP code and company requirements \n5. Take corrective \naction in \nresponse to GMP \nnon-compliance \n5.1 Processes, practices or conditions which could result in \nnon-compliance with GMP are identified and reported \naccording to workplace reporting requirements \n5.2 Corrective action is taken in accordance with the levels \nof responsibility \n5.3 GMP issues are raised with designated personnel \n6. Maintain and \nimprove GMP in \nthe work area \n6.1 Matters raised relating to GMP are promptly resolved \nand/or referred to appropriate personnel  \n6.2 Effectiveness of control measures are monitored within \nlevel of responsibility \n6.3 Others in the work area are advised of GMP matters \nrelevant to work role \n6.4 Changes to documentation are proposed in accordance \nwith workplace procedures to maintain GMP  \n6.5 GMP audits are conducted to meet company and \nlegislative requirements \n6.6 Action is taken to respond to audit recommendations \nwithin level of responsibility\n\n--- PDF PAGE 57 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n55\n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n \n1 Relevant clothing \nand equipment \nClothing and equipment may include but not limited to: \n1.1 Apron/laboratory gown \n1.2 Mouth masks \n1.3 Gloves  \n1.4 Rubber boots \n1.5 Head gears such as caps, hairnets, ear plug \n1.6 Laboratory equipment \n1.7 Foot baths \n1.8\nCleaning and disinfecting equipment and materials\n2 GMP control \nmeasures \nGMP measures may cover but is not limited to: \n2.1 Grounds \n2.2 Plant construction and design \n2.3 Equipment \n2.4 Sanitation and hygiene \n2.5 Production and process controls \n2.6 Quality control \n2.7 Documentation \n2.8 Warehousing and distribution \n2.9 Product recall \n2.10 Integrated Pest management\n3 Personal \nhygiene \nPersonal hygiene may involve but is not limited to: \n3.1 Disease control \n3.2 Wearing suitable outer garment including work shoes \n3.3 Personal cleanliness \n3.4 Hand washing and sanitizing \n3.5 Removing unsecured jewelry and other objects \n3.6 Maintaining gloves  \n3.7 Wearing hairnets, headbands, caps, beard cover, or \nother effective hair restraints \n3.8 Storage of clothing and other personal belongings \n3.9 Confining things to other areas e.g. gum, beverages, \neaten food, tobacco \n3.10 Protection against contamination of food with \nperspiration, saliva, hair, cosmetics, tobacco, chemicals, \nand medicines applied to skin  \n4 Legislative \nrequirements \nLegislative requirements relevant to this industry include but \nnot limited to:  \n4.1 Good Manufacturing Practice (GMP) codes \n4.2 BFAD issuances and orders  \n4.3 FPA issuances and orders \n4.4 Labeling, weights and measures legislation  \n4.5 Legislation covering environmental management \n4.6\nOccupational health and safety\n\n--- PDF PAGE 58 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n56\n \n \nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Communicated information about GMP requirements \nand related procedures to others in the work area \n1.2 Provided access to GMP documentation \n1.3 Modeled personal conduct and work activities to meet \nrequirements of GMP and supported others to follow  \n1.4 Identified control points in work area and demonstrated \nmonitoring techniques used and supported others to do \nthe same  \n1.5 Determined appropriate action required and ensured \ntimely action is taken to respond to GMP non-compliance \nwithin level of responsibility \n1.6 Participated in consultation processes to improve GMP \n1.7 Participated in and/or reviewed practices and procedures \nto prevent or minimize the likelihood of unacceptable \nperformance  \n1.8 Ensured that housekeeping standards are maintained \nand that equipment is in operational order \n1.9 Monitored the recording of GMP information to confirm \nthat records accurately reflect performance and meet the \nrequirements of the workplace and legislation\n2. Underpinning \nKnowledge and \nAttitudes \n2.1 GMP’s role in preventing contamination, its relationship \nto legislative responsibilities and potential implications of \nnon-compliance \n2.2 GMP arrangements in the workplace \n2.3 Current technical and process knowledge required to \nmonitor GMP and participate in investigating GMP non-\ncompliance within level of responsibility \n2.4 Control methods and procedures used in the work area \nto maintain GMP  \n2.5 Basic principles of integrated pest management \n2.6 Basic concepts of quality assurance including quality \nspecifications, operating parameters, validation \nprocedures and control methods \n2.7 The relationship between GMP and the quality system, \npersonnel responsible for designing and managing GMP, \npersonal role to maintain GMP, the role of internal and \nexternal auditors as appropriate \n2.8 Procedures followed to investigate contamination events \nand performance improvement processes \n2.9 Clothing and footwear requirements for working in and/or \nmoving between work areas   \n2.10 Purpose and requirements of validation procedures and \npurpose of equipment calibration  \n2.11 Recall and traceability procedures relevant to work area\n\n--- PDF PAGE 59 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n57\n2.12 Properties, handling and storage requirements of raw \nmaterials, packaging components and final product \nhandled and used in the work area \n2.13 Standards for materials, equipment and utensils used in \nthe work area \n2.14 Procedures for responding to out-of-specification or \nunacceptable performance/outcomes \n2.15 Waste collection, recycling, handling and disposal \n2.16 Attitudes in the workplace should include  \n2.16.1 \nTime conscious \n2.16.2 \nCost conscious \n2.16.3 \nEnvironmental and pollution conscious \n2.16.4 \nFlexible/adaptable \n2.16.5 \nHonest \n2.16.6 \nInnovative \n2.16.7 \nAlert \n2.16.8 \nSystematic and organized \n2.16.9 \nCommitted \n2.16.10 Creative \n2.16.11 Resourceful\n3. Underpinning \nSkills \n3.1 Appropriate communication skills and techniques to \nconvey information appropriate to audience \n3.2 Use and storage of housekeeping/cleaning equipment \n3.3 Calibration skills \n3.4 Basic computer skills \n3.5 Basic mathematical skills  \n3.6 Record keeping and documentation skills \n3.7\nSanitary food handling practices\n4. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation/demonstration with oral questioning   \n4.2 Written test \n4.3\nPortfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment, tools and utensils to be monitored \n5.3 Products/materials handled and stored which include raw \nmaterials, packaging components and consumables, \nsemi-processed product, finished product and cleaning \nmaterials \n5.4\nMaterials relevant to the proposed activity  \n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.\n",
