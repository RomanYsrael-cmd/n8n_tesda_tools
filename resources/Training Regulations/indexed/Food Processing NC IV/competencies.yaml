s an unacceptable \nenvironmental risk or outcome, taking corrective action \nwithin level of responsibility, and/or reporting to the \nappropriate person in the work area\n\n--- PDF PAGE 51 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n49\n5.3. Work responsibilities may involve handling of hazardous \nwaste \n5.4. An environmental hazard is any activity, product or \nservice that has the potential to affect the environment.  \n5.5. An environmental risk is the likelihood that the hazard \ncan cause harm to the environment \n5.6. A control measure is a method or procedure used to \nprevent or minimize environmental risks \n5.7. Responsibility for identifying and controlling \nenvironmental risks relates to immediate work \nresponsibilities \n5.8. Participating in improvement may involve participation in \nstructured improvement programs, one-off projects and \nday-to-day problem solving and consultative groups\n\n--- PDF PAGE 52 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n50\nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \n \nAssessment requires evidences that the candidate : \n1.1. Accessed and apply workplace information on \nenvironmental policies and procedures relating to own \nwork \n1.2. Fitted and used appropriate personal protective clothing \nand equipment \n1.3. Checked own work area to identify environmental \nhazards \n1.4. Reported hazards according to workplace procedure in a \nclear and timely manner \n1.5. Followed work procedures to control or minimize \nenvironmental risk. This may include monitoring \nparameters set for environmental aspects such as \nairborne particulate, noise, and water quality. It may also \ninclude demonstrating use of emergency equipment \naccording to work role requirements \n1.6. Recorded environmental information as requ