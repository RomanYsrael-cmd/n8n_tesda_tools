        "source_text": "--- PDF PAGE 86 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n84\n \nUNIT OF COMPETENCY: PARTICIPATE IN AN AUDIT PROCESS \n                                            \nUNIT CODE                     : AGR741327 \n \nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes \nrequired to participate in an internal audit process. It is \ndesigned to support participation in auditing a range of \nprograms designed to identify hazards, assess risk and \nimplement control measures. These may include but are not \nlimited to food safety, health and safety, quality and \nenvironmental management. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the Range of \nVariables \n1. Participate in \nplanning an audit\n1.1 Roles and responsibilities of participants in the audit are \nidentified  \n1.2 The purpose and scope of the audit is identified  \n1.3 Information and resources required to conduct the audit \nare identified and located according to workplace \nrequirements \n2. Participate in \nconducting an \naudit \n2.1 Adequate, representative information is collected \nwhich meets audit requirements  \n2.2 Information is analyzed to assess adequacy of \nperformance against program  \n2.3 Alignment of actual practices with internal and external \nrules, policies, regulations/laws, and customer \nrequirements plus needs of interested parties is checked \n2.4 Records are reviewed to confirm compliance with the \nprogram and that the system is effective and efficient \n2.5 Compliance with the program is observed in the \nworkplace \n2.6 Areas requiring corrective action are identified and that \ncorrective actions prevent recurrence of problems in \naccordance with the audit program\n3. Report and follow \nup audit \noutcomes \n3.1 Situations presenting an imminent and serious risk to the \nprogram \nobjectives \nare \nidentified \nand \nreported \nimmediately in accordance with reporting requirements \n3.2 Audit reports are prepared to address audit scope \nrequirements  \n3.3 The results of the audit are communicated according to \naudit purpose and requirements  \n3.4\nA corrective action plan is developed\n\n--- PDF PAGE 87 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n85\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1 Information \ncollection \nmethod \nInformation collection methods may include but not limited to: \n1.1 Interviews \n1.2 Observation  \n1.3 Review of workplace records \n1.4 Accessing relevant technical information \n2 Corrective action \nplan \nCorrective action plan identifies the following but is not limited \nto: \n2.1 Non-conformance \n2.2 Corrective actions \n2.3 Date by which action must be taken \n2.4 Any other follow up requirements\n\n--- PDF PAGE 88 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n86\n \n \nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Identified personal roles and responsibilities in the audit \nprocess \n1.2 Identified audit purpose, scope, steps and timelines  \n1.3 Identified, reviewed and prepared information, workplace \ndocuments and tools required to conduct the audit \n1.4 Identified any changes that have occurred in the \nworkplace since initiating the program \n1.5 Applied appropriate questioning, observation and related \ncommunication skills to support information collection \n1.6 Reviewed records, conducted interviews, observed \nworkplace practice and collected other relevant \ninformation  \n1.7 Took immediate action to report non-conformities that \npresent an imminent and serious risk to the program \nobjectives within level of responsibility \n1.8 Identified, investigated and recorded evidence of non-\nconformance and judged significance \n1.9 Assessed the adequacy of the program by analyzing the \ninformation collected against the program objectives \n1.10 Prepared the report, formed conclusions and \ncommunicated outcomes within level of responsibility  \n1.11 Participated in investigation of causes of failure and \nidentification of corrective action options \n1.12 Implemented identified corrective actions \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 The purpose and intent of the program being audited \n2.2 Personal roles and responsibilities in the audit process \nand related responsibilities of other members of the audit \nteam \n2.3 The purpose and stages involved in the audit process  \n2.4 Workplace information and related information \nmanagement systems  \n2.5 Techniques for collecting information.  \n2.6 Data analysis methods relevant to the audit process  \n2.7 Communication skills and techniques appropriate to the \nworkplace \n2.8 Technical knowledge relevant to the program being \naudited in order to verify compliance and assess \nadequacy of existing control measures. \n2.9 Purpose and responsibilities for maintaining records  \n2.10 Internal and international standards \n2.11 Regulations with regard to environment and regulatory \nand statutory requirements \n2.12 Attitudes in the workplace should include:\n\n--- PDF PAGE 89 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n87\n2.12.1 \nSelf-esteem \n2.12.2 \nTime conscious \n2.12.3 \nCost conscious \n2.12.4 \nHonest \n2.12.5 \nDetailed \n2.12.6 \nInnovative \n2.12.7 \nAlert \n2.12.8 \nSystematic and organized \n2.12.9 \nCommitted \n2.12.10 Creative \n2.12.11 Resourceful \n3. Underpinning \nSkills \n3.1 Oral and written communication skills \n3.2 Calibrating skills \n3.3 Basic computer skills \n3.4 Basic mathematical skills  \n3.5 Recording and reporting skills \n3.6 Preparing flow diagrams/flow charts \n3.7 Computation of yields and recoveries \n4. Methods of \nAssessment \nCompetency in this unit must be through: \n4.1 Direct observation/Demonstration with oral questioning \n4.2 Written test \n4.3\nPortfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment and tools  \n5.3 Range of programs, procedures, systems, processes  \n5.4 Materials relevant to the proposed activity   \n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.\n",
