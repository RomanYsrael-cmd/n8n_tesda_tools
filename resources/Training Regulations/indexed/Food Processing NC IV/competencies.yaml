        "evidence_guide": {
          "source_text": "1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Communicated information about GMP requirements \nand related procedures to others in the work area \n1.2 Provided access to GMP documentation \n1.3 Modeled personal conduct and work activities to meet \nrequirements of GMP and supported others to follow  \n1.4 Identified control points in work area and demonstrated \nmonitoring techniques used and supported others to do \nthe same  \n1.5 Determined appropriate action required and ensured \ntimely action is taken to respond to GMP non-compliance \nwithin level of responsibility \n1.6 Participated in consultation processes to improve GMP \n1.7 Participated in and/or reviewed practices and procedures \nto prevent or minimize the likelihood of unacceptable \nperformance  \n1.8 Ensured that housekeeping standards are maintained \nand that equipment is in operational order \n1.9 Monitored the recording of GMP information to confirm \nthat records accurately reflect performance and meet the \nrequirements of the workplace and legislation\n2. Underpinning \nKnowledge and \nAttitudes \n2.1 GMP’s role in preventing contamination, its relationship \nto legislative responsibilities and potential implications of \nnon-compliance \n2.2 GMP arrangements in the workplace \n2.3 Current technical and process knowledge required to \nmonitor GMP and participate in investigating GMP non-\ncompliance within level of responsibility \n2.4 Control methods and procedures used in the work area \nto maintain GMP  \n2.5 Basic principles of integrated pest management \n2.6 Basic concepts of quality assurance including quality \nspecifications, operating parameters, validation \nprocedures and control methods \n2.7 The relationship between GMP and the quality system, \npersonnel responsible for designing and managing GMP, \npersonal role to maintain GMP, the role of internal and \nexternal auditors as appropriate \n2.8 Procedures followed to investigate contamination events \nand performance improvement processes \n2.9 Clothing and footwear requirements for working in and/or \nmoving between work areas   \n2.10 Purpose and requirements of validation procedures and \npurpose of equipment calibration  \n2.11 Recall and traceability procedures relevant to work area\n\n--- PDF PAGE 59 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n57\n2.12 Properties, handling and storage requirements of raw \nmaterials, packaging components and final product \nhandled and used in the work area \n2.13 Standards for materials, equipment and utensils used in \nthe work area \n2.14 Procedures for responding to out-of-specification or \nunacceptable performance/outcomes \n2.15 Waste collection, recycling, handling and disposal \n2.16 Attitudes in the workplace should include  \n2.16.1 \nTime conscious \n2.16.2 \nCost conscious \n2.16.3 \nEnvironmental and pollution conscious \n2.16.4 \nFlexible/adaptable \n2.16.5 \nHonest \n2.16.6 \nInnovative \n2.16.7 \nAlert \n2.16.8 \nSystematic and organized \n2.16.9 \nCommitted \n2.16.10 Creative \n2.16.11 Resourceful\n3. Underpinning \nSkills \n3.1 Appropriate communication skills and techniques to \nconvey information appropriate to audience \n3.2 Use and storage of housekeeping/cleaning equipment \n3.3 Calibration skills \n3.4 Basic computer skills \n3.5 Basic mathematical skills  \n3.6 Record keeping and documentation skills \n3.7\nSanitary food handling practices\n4. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation/demonstration with oral questioning   \n4.2 Written test \n4.3\nPortfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment, tools and utensils to be monitored \n5.3 Products/materials handled and stored which include raw \nmaterials, packaging components and consumables, \nsemi-processed product, finished product and cleaning \nmaterials \n5.4\nMaterials relevant to the proposed activity  \n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.",
