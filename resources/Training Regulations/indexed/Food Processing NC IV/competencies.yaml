        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \n \nAssessment requires evidences that the candidate : \n1.1. Located and followed workplace information relating to \nGMP responsibilities \n1.2. Maintained personal hygiene consistent with GMP  \n1.3. Followed workplace procedures when moving around \nthe workplace and/or from one task to another to \nmaintain GMP \n1.4. Used, stored and disposed of appropriate \nclothing/footwear as required by work tasks and \nconsistent with GMP  \n1.5. Identified and reported situations that do or could \ncompromise GMP  \n1.6. Applied appropriate control measures to control \ncontamination  \n1.7. Recorded results of monitoring, and maintain records \nas required by GMP \n1.8. Followed validation procedures within level of \nresponsibility \n1.9. Identified and responded to out-of-specification or \nunacceptable raw materials, packaging components, \nfinal or part processed product within level of \nresponsibility  \n1.10. Followed procedures to isolate or quarantine non-\nconforming product \n1.11. Handled, cleaned and stored equipment, utensils, raw \nmaterials, packaging components and related items \naccording to GMP and workplace procedures \n1.12. Maintained GMP for own work \n1.13. Handled and/or disposed of out-of-specification or \ncontaminated materials, packaging \ncomponents/consumables and product, waste and \nrecyclable material according to GMP as required by \nwork responsibilities \n1.14. Maintained the work area in a clean and tidy state \n1.15. Identified and reported signs of pest infestation \n2. Underpinning \nKnowledge and \n2.1. The role of GMP in preventing contamination, its \nrelationship to legislative responsibilities and potential\n\n--- PDF PAGE 46 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n44\nAttitudes \nimplications of non-compliance \n2.2. GMP arrangements in the workplace. This includes \nawareness of relevant GMP codes of practice and \nrelated workplace policies and procedures to \nimplement these responsibilities \n2.3. The relationship between GMP and the quality system, \npersonnel responsible for designing and managing \nGMP, personal role to maintain GMP, the role of \ninternal and external auditors as appropriate \n2.4. Procedures followed to investigate contamination \nevents and performance improvement processes \n2.5. Personal clothing and footwear requirements for \nworking in and/or moving between work areas \n2.6. Personal clothing use, storage and disposal \nrequirements \n2.7. Awareness of common micro biological, physical and \nchemical contaminants relevant to the work process. \nThis includes the types of contamination likely to occur, \nthe conditions under which they occur, possible \nconsequences and control methods to prevent \noccurrence \n2.8. Basic concepts of quality assurance including quality \nspecifications, operating parameters, validation \nprocedures and control methods. This includes an \nunderstanding of related documentation including \nStandard Operating Procedures and/or batch \ninstructions \n2.9. Control methods and procedures used in the work area \nto maintain GMP. This includes an understanding of \nthe purpose of control, the consequences if not \ncontrolled and the method of control where relevant. It \nmay include an understanding of methods used to \nmonitor process control; purpose and requirements of \nvalidation procedures; and purpose of equipment \ncalibration \n2.10. GMP responsibilities and requirements relating to work \nrole \n2.11. Basic understanding of the properties, handling and \nstorage requirements of raw materials, packaging \ncomponents and final product handled and used \n2.12. Standards for materials, equipment and utensils used \nin the work area\n\n--- PDF PAGE 47 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n45\n2.13. Recall and traceability procedures relevant to work role \n2.14. Procedures for responding to out-of-specification or \nunacceptable performance/outcomes. This includes \nprocedures for identifying or isolating materials or \nproduct of unacceptable quality \n2.15. Purpose of keeping records and the recording \nrequirements of GMP. This includes an understanding \nof product and materials traceability procedures \n2.16. Housekeeping requirements and responsibilities \nrelating to own work. Where relevant this includes use \nand storage of housekeeping/cleaning equipment \n2.17. Waste collection, recycling and handling procedures \nrelevant to own work responsibilities \n2.18. Responsibilities for reporting and recording quality \ninformation \n3. Underpinning Skills \n3.1. Planning and organizing work (time management) \n3.2.\nWorking with others and in teams\n4. Resource \nImplication \nThe following resources should be provided: \n4.1. Workplace location and access to workplace policies  \n4.2.\nMaterials relevant to the proposed activity and tasks   \n5. Methods of \nAssessment \nCompetency in this unit must be assessed using at least two \n(2) of the following methods: \n5.1. A \ncombination \nof \ndirect \nobservation \nand \noral \nquestioning    \n5.2. Written report   \n5.3. Written Test \n5.4.\nPortfolio\n6. Context of \nAssessment\nAssessment should occur on the job or in a simulated \nworkplace",
