        "source_title": "SET UP AND OPERATE PROCESSES IN A PRODUCTION/PACKAGING SYSTEM",
        "source_text": "--- PDF PAGE 77 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n75\n \n \nUNIT OF COMPETENCY: SET UP AND OPERATE PROCESSES IN A \nPRODUCTION/PACKAGING SYSTEM \n                                            \nUNIT CODE                     : AGR741326 \n \nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes \nrequired to set up a production/packaging system for \noperation, operate and monitor the system, handover the \noperation when needed, shut it down at the end of a \nproduction day or shift, and contribute to the continuous \nimprovement of the system. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the Range of \nVariables\n1. Set up \nproduction/ \npackaging \nsystem for \noperation \n1.1 Equipment, related accessories, tools, and utilities \nare confirmed and available to meet production/ \npackaging requirements  \n1.2 Cleaning requirements and equipment status is identified \nand confirmed according to workplace procedures \n1.3 Machine settings are selected or adjusted as required to \nmeet safety and production/packaging requirements \n1.4 Processing/operating \nparameters \nare \nentered \nas \nrequired to meet production/packaging requirements \n1.5 Materials, ingredients and/or product are loaded or \npositioned as required to meet production requirements \n1.6 Pre-start checks are carried out as required by \nworkplace requirements \n1.7 Equipment performance is checked and adjusted as \nrequired to meet production/packaging requirements \n1.8 Equipment is made ready and safe to operate and \nrelevant personnel notified of set up completion \n          \n2. Operate and \nmonitor the \nsystem \n2.1 The system is started up and operated according to \ncompany procedures  \n2.2 System equipment components are monitored to identify \nvariation in operating conditions  \n2.3 Variation in equipment operation is identified and \nmaintenance requirements are reported according to \nworkplace reporting requirements\n\n--- PDF PAGE 78 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n76\n2.4 The production/packaging system is monitored to \nconfirm that specifications and stock levels of materials \nand ingredients are met \n2.5 Out-of-specification product/process/packaging \noutcomes are identified, rectified and/or reported to \nmaintain the process within specification \n2.6 The workplace is maintained to meet housekeeping \nstandards \n       \n3. Use re-order \nprocedures to \nmaintain stock \nlevels \n3.1 Stock level maintenance requirements are followed in \naccordance with workplace policies and procedures \n3.2 Data is accurately entered and extracted from the \ninventory/records system using appropriate workplace \nprocedures\n4. Organize cyclical \nstock counts and \nreport variances \n4.1 Schedule for cyclical stock count is planned and work \nallocated to team members \n4.2 Clear directions on task to be performed are given \n4.3 Stock inventory is conducted in accordance with \nworkplace procedures \n4.4 Types and causes of records discrepancies are identified\n4.5 Minor discrepancies are noted and corrected according \nto workplace procedures \n4.6 Major discrepancies are reported in accordance with \nworkplace procedures \n4.7\nWorkplace documentation is completed\n5. Handover \nproduction/ \npackaging \nsystem operation \n5.1 Workplace \nrecords \nare \nmaintained \naccording \nto \nworkplace recording requirements \n5.2 Handover is carried out according to workplace \nprocedures \n5.3 Process operators are made aware of system and \nrelated equipment status at completion of handover as \nper reporting requirements \n6. Shut down the \nproduction/ \npackaging \nsystem \n6.1 The appropriate shut down procedure is identified \n6.2 The system is shut down according to workplace \nprocedures \n6.3 Maintenance requirements are identified and reported \n          \n7. Contribute to the \ncontinuous \nimprovement of \nthe production/ \npackaging \n7.1 System performance is reviewed against output \nplan/targets \n7.2 Opportunities for system improvement are identified and \ninvestigated\n\n--- PDF PAGE 79 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n77\nsystem  \n7.3 Proposals \nfor \nimprovement \nare \ndeveloped \nand \nimplemented within company planning arrangements, \nauthority levels and according to company procedures \n7.4 Recording systems and reports are prepared in \naccordance with workplace procedures and relevant \nregulatory requirements\n\n--- PDF PAGE 80 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n78\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1 Equipment, \nrelated \naccessories, \ntools, and utilities\n1.1 Common equipment and related accessories may \ninclude any one but not limited to: \n1.1.1 Holding bins   \n1.1.2 Cutting implements like knives, slicers, peelers \n1.1.3 Jack lifts, trolleys and wheelers \n1.1.4 Forklift   \n1.1.5 Hand truck  \n1.1.6 Chiller/refrigerator/ freezer \n1.1.7 Weighing scales of varying capacities and \nsensitivities \n \n1.2 Production system equipment and materials may include \nany one but not limited to: \n1.2.1 Mixers/blenders \n1.2.2 Pumps \n1.2.3 Soaking vats \n1.2.4 Double jacketed kettle \n1.2.5 Oven \n1.2.6 Dryer \n1.2.7 Fryer \n1.2.8 Fuel for smoking like wood, wood shavings, half-\ndried leaves, coconut husks & shells, rice hulls, \ncorn cobs, saw dust \n1.2.9 Salinometer \n \n1.3 Packaging system equipment and materials may include \nany one but not limited to: \n1.3.1 Wrapping equipment \n1.3.2 Sealing machine \n1.3.3 Labeling machine \n1.3.4 Auto weighers \n1.3.5 Packing machine \n1.3.6 Carton scales  \n1.3.7 Strapping machine \n \n1.4 Office equipment and supplies may include any one but \nnot limited to the following: \n1.4.1 Information technology/Computer equipment with \nprinter \n1.4.2 Calculator \n1.4.3 Bond papers \n1.4.4\nComputer papers\n\n--- PDF PAGE 81 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n79\n1.4.5 Reporting and recording forms /logbooks \n \n1.5 Tools may include any one but not limited to:  \n1.5.1 Screw drivers \n1.5.2 Wrenches \n1.5.3 Allen keys \n1.5.4 Drill \n1.5.5 Pliers \n1.5.6 Cutters \n \n1.6 Utilities may include but not limited to: \n1.6.1 Water \n1.6.2 Power \n1.6.3 Fuel \n1.6.4\nLabor\n2 Materials, \ningredients \nand/or product \nMaterials may include any one but are not limited to: \n2.1 Raw materials  \n2.1.1 Fruits and vegetables \n2.1.2 Fresh meat  \n2.1.3 Dressed poultry \n2.1.4 Fish and other marine products \n2.1.5 Cereals and starches \n2.1.6 Fats and oil \n2.2 Ingredients \n2.2.1 Salt \n2.2.2 Sugars and sweeteners \n2.2.3 Condiments \n2.2.4 Spices \n2.2.5 Herbs \n2.2.6 Sauces \n2.3   Packing materials  \n2.3.1 Plastic and plastic strap  \n2.3.2 Cartons  \n2.3.3 Boxes \n2.3.4 Sacks \n2.3.5 Foil \n2.3.6 Crate \n2.3.7 Paper \n2.3.8\nStyropor\n\n--- PDF PAGE 82 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n80\n \n3 \nPre-start checks \nThis may involve:   \n3.1 Inspecting equipment condition to identify any signs of \nwear \n3.2 Selecting appropriate settings and/or related parameters \n3.3 Canceling isolation or lockouts as required \n3.4 Confirming that equipment is clean, correctly configured \nfor processing/packaging requirements \n3.5 Sensors and controls are correctly positioned \n3.6 Any scheduled maintenance has been carried out and all \nsafety guards are in place and operational\n4 \nData \nData on stock may include any one but not limited to: \n4.1 Special handling instructions \n4.2 Costs \n4.3 Raw material inventory \n4.4 Finished goods inventory \n4.5 Supplier details \n4.6 Materials in transit \n4.7 Re-order point \n4.8 Lead times  \n4.9\nExpiration dates\n5 \nInventory/ \nRecords System \nThe nature of inventory system used may include but not \nlimited to: \n5.1 Automated \n5.2 Manual  \n5.3 Paper-based  \n5.4 Computerized  \n5.5 Microfiche\n\n--- PDF PAGE 83 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n81\n \n \nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Accessed production/packaging schedule and related \ninformation to identify line set up/changeover, system \noutput and operating requirements \n1.2 Coordinated with relevant work areas to confirm and/or \nsecure necessary materials, utilities, equipment and \nlabor to meet production/packaging requirements \n1.3 Confirmed supply of necessary equipment and related \nattachments, materials and utilities for set up and \noperation \n1.4 Selected and used personal protective clothing and/or \nequipment \n1.5 Set and/or adjusted equipment to meet process/ \npackaging output requirements \n1.6 Loaded and/or positioned materials, ingredients, product, \npackaging components and consumables as required \n1.7 Operated and monitored the production/ packaging \nsystem \n1.8 Monitored materials flow and work-in-progress through \nthe system \n1.9 Confirmed that the system operates within specified \nparameters and inspection/ control points are monitored \n1.10 Determined responses to out-of-specification results or \nnon-conformance within level of responsibility \n1.11 Monitored operating efficiencies of the system and \ninvestigated, resolved and/or reported problems \n1.12 Planned scheduled events to minimize disruption to \nproduction/packaging \n1.13 Used re-order procedures to organize and control stock \nlevels \n1.14 Organized cyclical stock counts and reported variances \n1.15 Conducted/coordinated product or batch/ packaging \nchangeovers \n1.16 Conducted/coordinated shift handovers \n1.17 Reviewed and maintained procedures to support system \nimprovements \n1.18 Maintained work area to meet housekeeping standards \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Purpose and basic operating principles of equipment and \nrelated accessories of the production/ packaging system \n2.2 Operating capacities of equipment used in the system \n2.3 Understanding of related systems and responsibilities for \ninteraction like utilities supply, maintenance, etc.  \n2.4\nTechnical knowledge of process/product/packaging\n\n--- PDF PAGE 84 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n82\ncharacteristics and common types of variation in \nmaterials and/or ingredients used \n2.5 Typical equipment faults and related causes \n2.6 Pre-start checks required \n2.7 Relevant procedures, specifications and operating \nparameters for the system and the individual processes \n2.8 Isolation, lock out and tag out procedures and \nresponsibilities \n2.9 Hazards, risks, controls and methods for monitoring \nprocesses within the system \n2.10 Process improvement procedures and related \nconsultative arrangements \n2.11 Communication responsibilities to inform related work \nareas/support functions and other shifts of operational \nstatus and production/packaging issues \n2.12 Use of information technology devices and computer \napplications in the workplace  \n2.12.1 Relevant OHS procedures, guidelines, risks, and \nhazards \nconcerning \nthe \nuse \nof \ncomputer \nequipment for work tasks and ways of controlling \nthe risks/hazards \n2.12.2 Workplace procedures for the use of computer \nequipment and application software appropriate \nfor work role \n \n2.13 Use of inventory systems to organize stock control \n2.13.1 Principles of operation and functions of inventory \nsystems  \n2.13.2 Workplace procedures and policies for the use of \ninventory systems to organize stock control \n2.13.3 Application of different types of inventory systems \nand stock management approaches  \n2.13.4 Codes and regulations relevant to the \norganization of stock control \n \n2.14 Use of factory/process automation systems \n2.15 \nHousekeeping standards and procedures required in \nthe workplace \n2.16 Workplace/site layout  \n \n2.17 Attitudes in the workplace should include:  \n2.17.1 \nPunctual/Time conscious \n2.17.2 \nCost conscious  \n2.17.3 \nEnvironmental, pollution and safety conscious \n2.17.4 \nFlexible/adaptable \n2.17.5\nHonest\n\n--- PDF PAGE 85 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n83\n2.17.6 \nDependable \n2.17.7 \nInnovative \n2.17.8 \nAlert \n2.17.9 \nSystematic and organized \n2.17.10 Committed \n2.17.11 Good listener and fast learner \n2.17.12 Creative \n2.17.13 Resourceful \n2.17.14 Self-starter \n3 Underpinning \nSkills \n3.1 Oral and written communication skills e.g. read and \ncomprehend simple English statements \n3.2 Ability to modify activities depending on differing \nworkplace contexts, risk situations and environments \n3.3 Loading and/or positioning materials/ingredients/product \nand/or packaging consumables as required \n3.4 Using the control panel/system to set and adjust \nequipment components  \n3.5 Routine maintenance \n3.6 Troubleshooting and problem solving \n3.7 Calibrating skills \n3.8 Basic computer skills \n3.9 Basic mathematical skills (conversion,  percentage and \nformulation) \n3.10 Production/packaging recording and reporting \n3.11 Sanitary food handling practices \n3.12 Computation of yields and recoveries \n4 Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation/demonstration with oral questioning \n4.2 Written test \n4.3\nPortfolio \n5 Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment, tools, and materials to be set up/operated  \n5.3 Fruits, vegetables, fish/other marine products, meat, \npoultry, eggs, and processed food to be processed/ \npackaged  \n5.4 Materials, consumables and ingredients relevant to the \nproposed activity  \n6 Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.\n",
