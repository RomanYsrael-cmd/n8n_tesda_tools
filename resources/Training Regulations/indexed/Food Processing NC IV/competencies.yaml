 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n51\nresource management authorities and the purpose of \nthese arrangements \n2.3. Sources of advice on environmental issues in the \nworkplace \n2.4. Environmental hazards and risks associated with the \nwork carried out. Examples may include water pollution, \nair pollution, noise, waste handling, emergencies such as \nspills, and hazardous chemicals or waste \n2.5. Work procedures as they relate to environmental \nresponsibilities. This includes use of appropriate \npersonal protective clothing and equipment as required \n2.6. Procedures used to prevent or control environmental \nrisks associated with own work. Where this requires use \nof emergency equipment, this includes understanding \nthe purpose, capacity and limitations of equipment, \nlocation and storage requirements and safe handling and \nequipment use \n2.7. Basic concepts of hazard identification, risk assessment \nand control options. This includes an understanding of \nthe hierarchy of hazard control \n2.8. Workplace procedures for identifying and responding to \nhazards, investigating incidents and improving \nenvironmental management and resource utilisation \n2.9. Impact of work practices on resource utilisation and \nwastage \n2.10. Procedures used to handle and dispose of waste \naccording to workplace requirements. This includes an \nawareness of the need to separate solid and liquid \nwaste, and remove waste in solid form rather than \nhosing down drains. It may also include an \nunderstanding of handling requirements for hazardous \nwaste \n2.11. The difference between trade waste and storm water \ndrains \n2.12. Consequences of inappropriate waste handling and \ndisposal \n2.13. Procedures for responding to unplanned incidents such \nas spills and leaks as relevant to the work area \n2.14. Emergency response system and procedures \n2.15.Responsible 