cies, procedures and programs \n2. Work in carried out \nin accordance with \nregulations. \nRegulatory \nrequirements may \ninclude: \n2.1. Relevant regulations regarding food processing and food \nsafety regulations \n2.2. Department of Health – Food Establishments – Code of \nSanitation of the Philippines (P.D.856) \n2.3. Environment Management Bureau regulations regarding \nemissions, waste treatment, noise and effluent treatment \nand control \n3. Hygiene and \nsanitation \nrequirements may \ninclude: \n3.1. Department of Health – Food Establishments – Code of \nSanitation of the Philippines (P.D.856) \n3.2. Requirements set out by Bureau of Food and Drugs \n3.3. Workplace requirements\n4. Workplace \nrequirements may \ninclude: \n4.1. Work instructions \n4.2. Standard operating procedures \n4.3. OHS requirements \n4.4. Quality assurance requirements \n4.5. Equipment manufacturers’ advice \n4.6. Material Safety Data Sheets \n4.7. Codes of Practice and related advice\n5. Identification and \ncontrol of hazards \nmay include: \n5.1. Procedures are available that outline appropriate \nresponse to environmental incidents, accidents and \nemergencies \n5.2. At this level identification and control of environmental \nhazards relates to own work. Corrective action typically \ninvolves recognizing any event which occurs as part of \nthe work process and presents an unacceptable \nenvironmental risk or outcome, taking corrective action \nwithin level of responsibility, and/or reporting to the \nappropriate person in the work area\n\n--- PDF PAGE 51 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n49\n5.3. Work responsibilities may involve handling of hazardous \nwaste \n5.4. An environmental hazard is any activity, product or \nservice that has the potential to affect the environment.  \n5.5. An environmental risk is the likelihood that the hazard \ncan cause harm to the environment \n5.6. A control measure is a method or procedure used to \nprevent or minimize environmental risks \n5.7. Responsibility for identifying and controlling \nenvironmental risks relates to immediate work \nresponsibilities \n5.8. Participating in improvement may involve participation in \nstructured improvement programs, one-off projects and \nday-to-day problem solving and consultative groups\n\n--- PDF PAGE 52 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n50"
