        "source_title": "UTILIZE SPECIALIZED COMMUNICATION SKILLS",
        "source_text": "--- PDF PAGE 5 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n3\nSECTION 2  \n \nCOMPETENCY STANDARDS \n \nThese guidelines are set to provide the Technical Vocational Education and \nTraining (TVET) providers with information and other important requirements to \nconsider when designing training programs for FOOD PROCESSING NC IV. These \nunits of competency are categorized into basic, common and core competencies. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nUTILIZE SPECIALIZED COMMUNICATION SKILLS \nUNIT CODE \n: \n500311115 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to use specialized communication skills to \nmeet specific needs of internal and external clients, \nconduct interviews, facilitate group discussions, and \ncontribute to the development of communication \nstrategies. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the  Range of \nVariables \n1. Meet common and \nspecific communication \nneeds of clients and \ncolleagues \n1.1 Specific communication needs of clients and \ncolleagues are identified and met \n1.2 Different approaches  are used to meet \ncommunication needs of clients and colleagues \n1.3 Conflict is addressed promptly and in a timely way \nand in a manner which does not compromise the \nstanding of the organization\n2. Contribute to the \ndevelopment of \ncommunication \nstrategies \n2.1 Strategies for internal and external dissemination of \ninformation are developed, promoted, implemented \nand reviewed as required \n2.2 Channels of communication are established and \nreviewed regularly \n2.3 Coaching in effective communication is provided  \n2.4 Work related network and relationship are maintained \nas necessary \n2.5 Negotiation and conflict resolution strategies are \nused where required \n2.6 Communication with clients and colleagues is \nappropriate to individual needs and organizational \nobjectives\n3. Represent the \norganization \n3.1 When participating in internal or external forums, \npresentation is relevant, appropriately researched \nand presented in a manner to promote the \norganization\n\n--- PDF PAGE 6 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n4\n3.2 Presentation is clear and sequential and delivered \nwithin a predetermined time \n3.3 Utilize appropriate media to enhance presentation \n3.4 Differences in views are respected \n3.5 Written communication is consistent with \norganizational standards \n3.6 Inquiries are responded in a manner consistent with \norganizational standard\n4. Facilitate group \ndiscussion \n4.1 Mechanisms which enhance effective group \ninteraction is defined and implemented \n4.2 Strategies which encourage all group members to \nparticipate are used routinely \n4.3 Objectives and agenda for meetings and discussions \nare routinely set and followed \n4.4 Relevant information is provided to group to facilitate \noutcomes \n4.5 Evaluation of group communication strategies is \nundertaken to promote participation of all parties \n4.6 Specific communication needs of individuals are \nidentified and addressed\n5. Conduct interview \n5.1 A range of appropriate communication strategies are \nemployed in interview situations \n5.2 Records of interviews are made and maintained in \naccordance with organizational procedures \n5.3 Effective questioning, listening and nonverbal \ncommunication techniques are used to ensure that \nrequired message is communicated\n\n--- PDF PAGE 7 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n5\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Strategies  \n1.1 \nRecognizing own limitations \n1.2 \nReferral to specialists \n1.3 \nUtilizing techniques and aids \n1.4 \nProviding written drafts \n1.5 \nVerbal and non verbal communication \n2. Effective  group \ninteraction \n2.1 \nIdentifying and evaluating what is occurring \nwithin an interaction in a non judgmental way \n2.2 \nUsing active listening \n2.3 \nMaking decision about appropriate words, \nbehavior \n2.4 \nPutting together response which is culturally \nappropriate \n2.5 \nExpressing an individual perspective \n2.6 \nExpressing own philosophy, ideology and \nbackground and exploring impact with \nrelevance to  communication \n3. Types of Interview \n3.1 \nRelated to staff issues \n3.2 \nRoutine \n3.3 \nConfidential  \n3.4 \nEvidential \n3.5 \nNon disclosure \n3.6 \nDisclosure \n4. Interview situations \n4.1 \nEstablish rapport \n4.2 \nElicit facts and information \n4.3 \nFacilitate resolution of issues \n4.4 \nDevelop action plans \n4.5 \nDiffuse potentially difficult situation\n\n--- PDF PAGE 8 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n6\n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated effective communication skills with \nclients accessing service and work colleagues \n1.2 \nAdopted relevant communication techniques and \nstrategies to meet client particular needs and \ndifficulties \n2. Underpinning \nKnowledge  \n2.1 \nCommunication process \n2.2 \nDynamics of groups and different styles of group \nleadership \n2.3 \nCommunication skills relevant to client groups \n3. Underpinning \nSkills \n3.1 \nFull range of communication techniques including: \n3.1.1 \nFull range of communication \n3.1.2 \nActive listening \n3.1.3 \nFeedback \n3.1.4 \nInterpretation \n3.1.5 \nRole boundaries setting \n3.1.6 \nNegotiation \n3.1.7 \nEstablishing empathy \n3.2 \nCommunication skills required to fulfill job roles as \nspecified by the organization \n4. Resource \nImplications \n4.1 \nAccess to appropriate workplace where assessment \ncan take place \n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 \nDirect observation \n5.2 \nOral Interview \n6. Context for \nAssessment \n6.1 \nThis unit should be assessed on the job through \nsimulation\n",
