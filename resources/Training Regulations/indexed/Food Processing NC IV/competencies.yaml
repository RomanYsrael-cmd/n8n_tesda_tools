        "source_title": "APPLY RAW MATERIALS/INGREDIENTS AND PROCESS KNOWLEDGE",
        "source_text": "--- PDF PAGE 65 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n63\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY: APPLY RAW MATERIALS/INGREDIENTS AND \nPROCESS KNOWLEDGE \n                                            \nUNIT CODE                     : AGR741323 \n \nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes \nrequired to apply understanding of raw materials/ingredients \nand processes to solve/remedy basic problems in preparation, \nprocessing and/or packaging product. This unit is appropriate \nin solving problems over one or more processes and needs \nknowledge of raw materials/ingredients characteristics and \nprocessing methods used. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the Range of \nVariables \n1. Identify and \nrespond to non-\nconforming \ningredients/raw \nmaterials \n1.1 Non-conformance in raw materials/ingredients is \nidentified and reported according to workplace reporting \nrequirements and standards \n1.2 Causes of non-conformance are investigated and \nreported according to workplace reporting requirements \n1.3 Corrective action is determined and implemented within \nlevel of responsibility and workplace procedures \n1.4 Action is taken to prevent reoccurrence of non-\nconformance according to workplace procedures \n1.5 Action taken is reported according to workplace reporting \nrequirements \n1.6 Disposition of non-conforming ingredients and raw \nmaterials is undertaken according to workplace policies \nand procedures \n       \n2. Identify and \nrespond to non-\nconforming \nproduct and \nprocesses \n2.1 Processing parameters, stages and changes which \noccur during processing are monitored according to \nspecifications and workplace requirements \n2.2 Non-conformance in processing, handling and/or storage \nis identified and corrective action taken according to \nworkplace requirements \n2.3 Causes of non-conformance relating to processing, \nhandling and/or storage are investigated and reported \naccording to workplace reporting requirements \n2.4\nCorrective action is determined and implemented within\n\n--- PDF PAGE 66 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n64\nlevel of responsibility and workplace procedures \n2.5 Action is taken to prevent reoccurrence of non-\nconformance \n2.6 Action taken is reported according to workplace reporting \nrequirements \n2.7 Disposition of non-conforming products is undertaken \naccording to workplace procedures\n\n--- PDF PAGE 67 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n65\n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n \n1. Raw materials/ \ningredients. \nRaw materials/ingredients may include any one but not limited \nto: \n1.1 Fruits and vegetables \n1.2 Cereals and starches \n1.3 Fish and other marine products \n1.4 Meat and Poultry \n1.5 Fats and oil \n1.6 Sugars and sweeteners \n1.7 Condiments \n1.8 Sauces \n1.9 Seasonings \n1.10 Processing Aids \n1.11 Preservatives \n1.12 Packaging materials \n2. Disposition \nDisposition may include but not limited to: \n2.1   Hold \n2.2   Segregate \n2.3   Sort \n2.4   Reject\n3. Processing \nparameters \nProcessing parameters in this Unit of Competency include but \nare not limited to: \n3.1 Temperature \n3.2 Time \n3.3 Pressure \n3.4 Flow rate \n3.5 Moisture content \n3.6 Water activity \n3.7 pH \n4 Processing \nProcessing and related methods involved in this Unit of \nCompetency include but are not limited to: \n4.1 Raw materials/ingredient Dispensing \n4.2 Raw materials/ingredient Preparation \n4.3 Raw materials/ingredient Mixing and blending \n4.4 Raw materials/ingredient Conditioning \n4.5 Primary and further processing \n4.6 Wrapping \n4.7 Packing  \n4.8\nStorage and handling\n\n--- PDF PAGE 68 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n66\n \n \nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Identified requirements of ingredient/raw material \ncharacteristics within level of responsibility \n1.2 Followed procedures to identify, remove/isolate and \nreport non-conforming ingredients/materials and/or \nproduct according to workplace reporting requirements \n1.3 Determined likely causes of non-conformance of \ningredients/raw materials \n1.4 Recognized indicators of unacceptable or non-\nconforming processing, handling and/or storage \noutcomes \n1.5 Acted promptly to identify, remove/isolate and report \nnon-conforming product and/or processes \n1.6 Accessed and applied workplace information relating to \nprocess troubleshooting \n1.7 Investigated non-conformance to determine likely causes \nand reported findings to appropriate personnel \n1.8 Identified action required to correct non conformance \nand implement within level of responsibility \n1.9 Identified action required to prevent or minimize and \ncontrol reoccurrence of non-conformance and implement \nwithin level of responsibility \n1.10 Completed workplace records including reporting non-\nconformance and documenting corrective actions \naccording to workplace recording procedures \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 Basic \ncomposition \nand \nfunction \nof \neach \nmain \nmaterial/ingredient used  \n2.2 Awareness of ingredient standards, grades or types  \n2.3 Common causes of contamination/unacceptable quality \nof raw materials/ ingredients  \n2.4 The changes and reactions that occur through \nprocessing stages.  \n2.5 The effect of variation in raw materials/ingredients on \nprocessing stages and final product outcome. \n2.6 Basic food microbiology \n2.7 Appropriate handling and storage requirements for raw \nmaterials/ingredients and final product and the effect of \nfailing to meet required storage conditions \n2.8 Methods used to confirm quality standard.  \n2.9 Factors that affect the shelf life of product \n2.10 Attitudes in the workplace should include \n2.10.1 \nPunctual/Time conscious \n2.10.2 \nCost conscious \n2.10.3\nEnvironmental and pollution conscious\n\n--- PDF PAGE 69 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n67\n2.10.4 \nFlexible/adaptable \n2.10.5 \nDependable \n2.10.6 \nInnovative \n2.10.7 \nAlert \n2.10.8 \nSystematic and organized \n2.10.9 \nGood listener and fast learner \n2.10.10 Creative \n2.10.11 Resourceful \n2.10.12 Self–starter \n2.10.13 Decisive \n3. Underpinning \nSkills \n3.1 Identifying and isolating non-conforming product  \n3.2 Troubleshooting techniques \n3.3 Amend or introduce a new method or procedure \n3.4 Recording and reporting skills \n3.5 Test methods to confirm raw material/ingredient and/or \nfinal product quality characteristics  \n4. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation/Demonstration with oral questioning \n4.2 Written test  \n4.3 Portfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment, tools and utensils to be prepared  \n5.3 Fruits, vegetables, fish/other marine products, meat, \npoultry and eggs for processing  \n5.4 Materials relevant to the proposed activity   \n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.\n",
