        "source_title": "PARTICIPATE IN A HACCP TEAM",
        "source_text": "--- PDF PAGE 90 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n88\n \n \nUNIT OF COMPETENCY: PARTICIPATE IN A HACCP TEAM \n                                            \nUNIT CODE                     : AGR741328 \n \nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes \nrequired to participate in the development, review and \nimplementation of a HACCP-based food safety program under \ndirection. It is appropriate where the operator requires a \ndetailed understanding of the steps and techniques used to \ndevelop and review a HACCP-based food safety program. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the Range of \nVariables \n1. Prepare to \ndevelop and/or \nreview a food \nsafety program \n1.1 Roles and responsibilities for participating in developing \nor reviewing a food safety program are identified  \n1.2 The scope of the food safety program is identified to \ncover the area of responsibility according to workplace \nrequirements \n2. Identify and/or \nreview food \nsafety hazards \n2.1 Processes to be covered by the food safety program are \nidentified and steps within each process are described \n2.2 Expert resource is used for planning and identifying \nphysical, chemical, and microbial hazards \n2.3 Food safety hazards that are reasonably expected to \noccur are identified for each process based on the food \nsafety program \n2.4 Handling methods, processing techniques and existing \nsupport programs used in the workplace are identified \naccording to the food safety program \n3. Establish, \nimplement and \nreview methods \nto monitor and \ncontrol food \nsafety hazards \n3.1 Acceptable \nmethods \nof \ncontrol \nare \nestablished, \nimplemented and reviewed for each food safety hazard \nthat is reasonably expected to occur  \n3.2 Control methods are validated according to the food \nsafety program   \n3.3 Procedures for taking preventative action are established\n3.4 Appropriate methods for monitoring that processes \nremain within control are established  \n3.5 Required corrective action to respond to situations where \nhazards are not effectively controlled is established\n\n--- PDF PAGE 91 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n89\n \n4. Establish and \nreview food \nsafety \ndocumentation, \ncommunication \nand recording \nsystems \n4.1 Food safety-related roles and responsibilities are \ncommunicated  \n4.2 Records required to document, implement and maintain \nthe food safety program are established according to \nworkplace reporting requirements \n4.3 Record keeping requirements and responsibilities are \ncommunicated to food business personnel\n\n--- PDF PAGE 92 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n90\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1 Food safety \nprogram \nThe food safety program may include but not limited to: \n1.1 Process flow diagrams \n1.2 Hazard analysis charts and tables \n1.3 Support program requirements \n1.4 Data analysis reports \n1.5 Corrective action reports  \n1.6 Verification reports \n1.7 HACCP plan \n2 Food safety \nhazards \nFood safety hazards may include but not limited to: \n2.1 Micro-biological \n2.2 Chemical \n2.3\nPhysical hazards\n3 Support \nprograms \nTypical support programs include but not limited to :  \n3.1 Supplier accreditation \n3.2 Good Agricultural Practices \n3.3 Good Manufacturing Practices \n3.4 Product recall \n3.5 Cleaning schedules \n3.6 Stock rotation \n3.7 Product traceability \n3.8 Pest management programs \n3.9 Surveillance testing for pesticide/antibiotic/trace metal \nresidues \n3.10 Mycotoxin testing \n3.11 Personal hygiene practices \n3.12 Calibration procedures  \n3.13 Preventive maintenance \n3.14 Related operating procedures \n4 Control methods \nMethods used to control hazards include both.  \n4.1 Support programs and  \n4.2\nSpecific hazard control limits or requirements\n\n--- PDF PAGE 93 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n91\nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Identified personal roles and responsibilities for \nparticipating in the development or review of a food \nsafety program \n1.2 Identified processes and steps to be covered \n1.3 Identified hazards that are reasonably expected to occur \nand establish appropriate methods of control  \n1.4 Established or reviewed procedures for implementing \npreventative action \n1.5 Described the appropriate monitoring requirements for \neach food safety hazard \n1.6 Described corrective action requirements in the event \nthat acceptable limits or requirements of support \nprograms are not met \n1.7 Developed or reviewed documentation relating to the \ndesign and maintenance of the food safety program \n1.8 Developed or reviewed documentation to communicate \nfood safety responsibilities \n1.9 Communicated food safety responsibilities within level of \nresponsibility using techniques and presentation styles \nappropriate to the audience \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 Roles \nand \nresponsibilities \nfor \ndevelopment \nand \nmaintenance of the food safety program \n2.2 Techniques for applying HACCP-based principles \n2.3 Techniques used to map operations and analyze food \nsafety requirements \n2.4 Sources of technical expertise on food safety \nrequirements  \n2.5 Main types of food safety hazards/contamination likely to \noccur given the type of product and processing methods \nused \n2.6 Typical support programs and acceptable control \nmethods for the hazards identified and required \ncorrective action when control requirements are not met \n2.7 Raw materials, ingredient and finished product \ncomposition and characteristics and related handling and \nstorage requirements \n2.8 Food processing methods used in the workplace or work \narea and their effect on food safety   \n2.9 The purpose and intent of food safety legislation  \n2.10 Purpose and responsibilities for maintaining records as \nrequired by legislation and workplace procedures \n2.11 Documentation and recording requirements to support \ncommunication and monitoring of the food safety \nprogram.\n\n--- PDF PAGE 94 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n92\n2.12 Conditions required for bacterial food poisoning to occur. \n2.13 Validation and verification processes and techniques and \nresponsibilities \n2.14 Attitudes in the workplace should include  \n2.14.1 \nSelf-esteem \n2.14.2 \nTime conscious \n2.14.3 \nCost conscious \n2.14.4 \nEnvironmental and pollution conscious \n2.14.5 \nFlexible/adaptable \n2.14.6 \nHonest \n2.14.7 \nDependable \n2.14.8 \nInnovative \n2.14.9 \nAlert \n2.14.10 Systematic and organized \n2.14.11 Committed \n2.14.12 Creative \n2.14.13 Resourceful \n2.14.14 Self–starter \n3. Underpinning \nSkills \n3.1 Inspection and monitoring skills \n3.2 Oral and written communication skills \n3.3 Calibrating skills \n3.4 Basic computer skills \n3.5 Basic mathematical skills \n3.6 Recording and reporting skills \n4. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation/Demonstration with oral questioning \n4.2 Written test \n4.3\nPortfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment and tools for inspection and monitoring  \n5.3 Range of programs, processes, systems and procedures \non food safety  \n5.4 Materials relevant to the proposed activity   \n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.\n",
