        "source_title": "MONITOR WORKPLACE PERFORMANCE AND PARTICIPATE IN IMPROVEMENT PROCESSES",
        "source_text": "--- PDF PAGE 95 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n93\n \n \nUNIT OF COMPETENCY: MONITOR WORKPLACE PERFORMANCE AND  \nPARTICIPATE IN IMPROVEMENT PROCESSES \n                                            \nUNIT CODE                     : AGR741329 \n \nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes \nrequired to monitor and report on performance of a work area \nand participate in performance improvement processes that \ninvolve systematic analysis of performance to identify and \npropose opportunities for improvement.  \n \nELEMENT \nPERFORMANCE CRITERIA \nBold, italicized terms are elaborated in the Range of \nVariables \n1. Identify recording \nand reporting \nrequirements \n1.1 The purpose of recording information is identified  \n1.2 Recording and reporting responsibilities are identified  \n1.3 Recording and reporting systems and formats are \nidentified according to workplace reporting requirements \n1.4 Workplace standards and key performance indicators \nare identified and used for performance measurements \nbased on company policies and procedures \n        \n2. Maintain and \nsecure \nworkplace \ninformation \n2.1 Records are confirmed to be complete, timely and \naccurate  \n2.2 Performance information is recorded in required format \nto meet workplace reporting requirements  \n2.3 Errors or discrepancies in recording are identified and \ncorrected or notified to appropriate personnel  \n2.4 Variances are identified, investigated and reported \naccording to workplace procedure  \n2.5 Requests for information are assessed, prioritized and \naddressed to meet required timelines \n2.6 Access levels and authorities are identified according to \nrecords maintenance and security policies \n2.7 Security breaches are identified and reported to \nappropriate personnel \n3. Analyze \nperformance and \nidentify \n3.1 Barriers to good practice or optimal performance are \nidentified\n\n--- PDF PAGE 96 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n94\nopportunities for \nimprovement \n3.2 Scope of issue or problem to be addressed is clearly \ndefined \n3.3 Benchmarking is done within the company (by \ndepartment), within the food industry, and across \ndifferent industries to identify potential improvement  \n3.4 Objectives to be addressed by improvement proposals \nare defined according to company plans and targets         \n4. Identify other \ndata \nrequirements \n4.1 Other data required to investigate improvement \nopportunity is identified \n4.2 Appropriate data collection methods are selected \naccording to prescribed survey procedures and available \nbudget \n4.3 Additional resources available to support investigation \nare identified\n5. Analyze the \nissue or problem \n5.1 Techniques required to investigate nature of issue or \nproblem are selected and \napplied according \nto \nappropriate analytical and statistical tools  \n5.2 A detailed description of the issue or problem is \ndeveloped  \n5.3 Possible causes are identified and tested  \n5.4\nOptions for improvement are identified and assessed\n6. Recommend \noptions for \nimprovement \n6.1 Preferred options are identified and described  \n6.2 Recommendations are presented in formats appropriate \nto the issue and the audience  \n6.3 Recommendations are consistent with data collected and \nanalyzed and in accordance with objectives identified\n7. Participate in \nimplementing \nimprovement \nproposals \n7.1 Improvement trials are supported  \n7.2 Improvement proposals are evaluated and refined based \non company plans and targets \n7.3 Operating procedures are updated and communicated to \nreflect implementation of improved practices  \n7.4 Improvement in performance is monitored according to \nworkplace reporting procedures\n\n--- PDF PAGE 97 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n95\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1 Information \nrecorded \nInformation recorded and reported may include but is not \nlimited to:  \n1.1 Timesheets \n1.2 Log sheets \n1.3 Recipes/specifications,  \n1.4 Operating procedures  \n1.5 Production statistics and downtime \n1.6 Labor and materials usage levels \n2 Objectives \nObjectives of the improvement proposals may include but not \nlimited to: \n2.1 Quality \n2.2 Cost \n2.3 Efficiency  \n2.4 Job satisfaction \n2.5 OHS \n2.6 Environmental management \n2.7\nCustomer feedback\n3 Data collection \nmethods \nData collection methods may include but not limited to: \n3.1 Primary data \n3.1.1 \nCollecting samples \n3.1.2 \nTaking measurements \n3.1.3 \nLaboratory analysis \n3.1.4 \nActual observation \n3.1.5 \nPersonal interview \n3.1.6 \nTelephone interview \n3.1.7 \nMail questionnaire \n \n3.2 Secondary data \n3.2.1 \nPerformance/accomplishment reports \n3.2.2 \nAudit reports \n3.2.3 \nOut-of-specification/non-conformance reports \n3.2.4 \nEmergency/accident reports \n4 Techniques \nProblem solving tools/techniques involved in this Unit of \nCompetency include but is not limited to: \n4.1 Fishbone diagrams/cause and effect diagrams \n4.2 Workflow analysis \n4.3 Pareto diagrams \n4.4 SWOT analysis\n\n--- PDF PAGE 98 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n96\n \n \nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Identified significant performance variance, investigated \nand reported cause/s \n1.2 Identified information security requirements and \nprocedures for responding to/reporting a security breach \n1.3 Identified nature and scope of improvement opportunity \n1.4 Consulted others to confirm improvement opportunity \ndefinition \n1.5 Determined data collection requirements and appropriate \ncollection methods \n1.6 Identified resources requirements to support \ninvestigation \n1.7 Collected data \n1.8 Determined and applied appropriate data analysis \ntechniques \n1.9 Drew conclusions based on the data collected and \nanalyzed \n1.10 Communicated findings in forms appropriate to the \nnature of the issue and the audience \n1.11 Received and took account of feedback  \n1.12 Participated in related trials and/or changes to work \npractices arising from improvement proposals \n1.13 Monitored and documented results of \ntrials/implementation and participated in modifying \nchange to support ongoing improvement \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 The purpose and responsibilities for the information \nrecords and reports to be produced/maintained  \n2.2 Information system access levels and codes \n2.3 Objectives to be addressed by improvement proposals \n2.4 Workplace approach to structuring improvement \nprocesses \n2.5 Resources available to the workplace to support \nimprovement processes \n2.6 Data collection and analysis techniques appropriate to \nthe nature of the improvement opportunity and the \nworkplace \n2.7 Communication techniques to support data collection, \nconsultation and team work required to participate in \nimprovement processes \n2.8 Documentation management systems to support \nchanges in work practices to reflect improvement \nprocesses \n2.9 Attitudes in the workplace should include \n2.9.1 Analytical/Inquisitive\n\n--- PDF PAGE 99 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n97\n2.9.2 Time conscious \n2.9.3 Cost conscious \n2.9.4 Environmental and pollution conscious \n2.9.5 Flexible/adaptable \n2.9.6 Honest \n2.9.7 Innovative \n2.9.8 Alert \n2.9.9 Systematic and organized \n2.9.10 Committed \n2.9.11 Creative \n2.9.12 Resourceful \n3. Underpinning \nSkills \n3.1 Oral and written communication skills \n3.2 Calibrating skills \n3.3 Basic computer skills \n3.4 Basic mathematical skills \n3.5 Recording and reporting skills \n3.6 Preparing flow diagrams/flow charts \n3.7 Problem solving skills \n3.8 Use of analytical techniques \n4. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation/Demonstration with oral questioning \n4.2 Written test \n4.3\nPortfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment and tools for reporting, recording, and data \ncollection  \n5.3 Recording and reporting systems \n5.4 Range of case studies, work situations, problems on \nimprovement \n5.5 Materials relevant to the proposed activity   \n6. Context of \nAssessment\n6.1 Assessment should occur on the job or in a simulated \nworkplace.\n",
