          "source_text": "1. Identify \nrequirements of \nGMP related to \nown work \n1.1. Sources of information on GMP requirements are located \n1.2. GMP requirements and responsibilities related to own \nwork are identified \n2. Observe personal \nhygiene and \nconduct to meet \nGMP requirements \n2.1. Personal hygiene meets GMP requirements  \n2.2. Clothing is prepared, used, stored and disposed of \naccording to GMP and workplace procedures \n2.3. Personal movement around the workplace complies with \narea entry and exit procedures\n3. Implement GMP \nrequirements when \ncarrying out work \nactivities \n3.1. GMP requirements are identified \n3.2. Work area, materials, equipment and product are \nroutinely monitored to ensure compliance with GMP \nrequirements \n3.3. Raw materials, packaging components and product are \nhandled according to GMP and workplace procedures \n3.4. Workplace procedures to control resource allocation and \nprocess are followed to meet GMP requirements \n3.5. Common forms of contamination are identified and \nappropriate control measures are followed according to \nGMP requirements \n3.6. The workplace is maintained in a clean and tidy order to \nmeet GMP housekeeping standards\n\n--- PDF PAGE 43 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n41\n4. Participate in \nimproving GMP \n4.1. Processes, practices or conditions which could result in \nnon-compliance with GMP are identified and reported \naccording to workplace reporting requirements \n4.2. Corrective action is implemented within level of \nresponsibility  \n4.3. GMP issues are raised with designated personnel\n5. Participate in \nvalidation \nprocesses \n5.1. Validation procedures are followed to GMP requirements \n5.2. Issues arising from validation are raised with designated \npersonnel \n5.3. Validation procedures are documented to meet GMP \nrequirements\n6. Complete \nworkplace \ndocumentation to \nsupport GMP \n6.1. Documentation and recording requirements are identified\n6.2. Information is recorded according to workplace \nreporting procedures to meet GMP requirements\n\n--- PDF PAGE 44 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n42\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OH&S \nrequirements may \ninclude:\n1.1. OH&S legal requirements \n1.2. Enterprise OH&S policies, procedures and programs \n2. Work in carried out \nin accordance with \nregulations. \nRegulatory \nrequirements may \ninclude: \n2.1. Relevant regulations regarding food processing and food \nsafety regulations \n2.2. Department of Health – Food Establishments – Code of \nSanitation of the Philippines (P.D.856) \n2.3. Environment Management Bureau regulations regarding \nemissions, waste treatment, noise and effluent treatment \nand control\n3. Hygiene and \nsanitation \nrequirements may \ninclude: \n3.1. Department of Health – Food Establishments – Code of \nSanitation of the Philippines (P.D.856) \n3.2. Requirements set out by Bureau of Food and Drugs \n3.3. Workplace requirements\n4. Workplace \nrequirements may \ninclude: \n4.1. Work instructions \n4.2. Standard operating procedures \n4.3. OH&S requirements \n4.4. Quality assurance requirements \n4.5. Equipment manufacturers’ advice \n4.6. Material Safety Data Sheets \n4.7. Codes of Practice and related advice\n5. Products may \ninclude \n5.1. Products, raw materials, packaging components and \nconsumables, part-processed product, finished product \nand cleaning materials\n6. Responsibility and \nreporting systems \n6.1. Responsibility for applying Good Manufacturing Practice \nrelates to the person’s work area \n6.2. Reporting systems may include electronic and manual \ndata recording and storage systems\n\n--- PDF PAGE 45 ---\n__________________________________________________ \nTR- Food Processing NC IV                                                         \n43"
