  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for Food Processing NC IV.\n\n3.1.\nCURRICULUM DESIGN\n\nCourse Title: FOOD PROCESSING\n\n NC Level: NC IV\n\nNominal Training Duration:\n 56 hours (Basic)\n\n160 hours (Common)\n\n360 hours (Core)\n\n576 hours (Total)\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and\nattitudes under Food Processing NC lV in accordance with industry standards. It\ncovers the basic, common and core competencies.\n\nBASIC COMPETENCIES\n(56 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize specialized\ncommunication\nskills\n1.1 Meet common and specific\ncommunication\nneeds\nof\nclients and colleagues\n1.2 Contribute to the\ndevelopment of\ncommunication strategies\n1.3 Represent the organization\n1.4 Facilitate group discussion\n1.5 Conduct interview\n• Group\ndiscussion\n• Interaction\n• Brainstorming\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n2. Develop team and\nindividual\n2.1 Provide team leadership\n2.2 Foster individual and\norganizational growth\n2.3 Monitor and evaluate\nworkplace learning\n2.4 Develop team commitment\nand cooperation\n2.5 Facilitate\naccomplishment\nof organizational goals\n•\nLecture\n•\nDiscussion\n•\nInteraction\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 101 ---\n__________________________________________________\nTR- Food Processing NC IV\n99\n3. Apply problem\nsolving\ntechniques in the\nworkplace\n\n3.1 Analyze the problem\n3.2 Identify possible solutions\n3.3 Recommend solution to\nhigher management\n3.4 Implement solution\n3.5 Evaluate/Monitor results\nand outcome\n•\nLecture\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n•\nPractical/\nperformance\ntest\n4. Collect, analyze\nand organize\ninformation\n4.1 Study information\nrequirements\n4.2 Process data\n4.3 Analyze, interpret and\norganize information\ngathered\n4.4 Present findings/\nrecommendations\n• Discussion\n• Direct\nobservation\n• Simulation/\nrole playing\n•\nObservation\n•\nInterview\n•\nPractical/\nperformance\ntest\n5. Plan and organize\nwork\n5.1 Set objectives\n5.2 Plan and schedule work\nactivities\n5.3 Implement work plans\n5.4 Monitor work activities\n5.5 Review and evaluate work\nplans and activities\n• Discussion\n• Direct\nobservation\n• Simulation/\nrole playing\n•\nObservation\n•\nInterview\n•\nPractical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(160 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Food\nSafety and\nSanitation (24\nhours)\n\n1.1 Wear personal protective\nequipment\n1.2 Observe personal\nhygiene and good\ngrooming\n1.3 Implement food\nsanitation practices\n1.4 Render safety measures\nand first aid procedures\n1.5 Implement housekeeping\nactivities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced learning\n• Lecture\n\n• Written\nexamination\n• Demonstration of\npractical skills\n• Direct observation\n• Interview\n\n--- PDF PAGE 102 ---\n__________________________________________________\nTR- Food Processing NC IV\n100\n2. Use Standard\nMeasuring\nDevices/\nInstruments (16\nhours)\n\n2.1 Identify standard\nmeasuring devices and\ninstruments\n2.2 Review the procedures in\nusing standard measuring\ndevices and instruments\n2.3 Follow procedures of\nusing measuring devices\nand instruments\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced Learning\n• Lecture\n• Written\nexamination\n• Demonstration of\npractical skills\n• Direct observation\n• Interview\n3. Use Food\nProcessing\nTools,\nEquipment and\nUtensils (16\nhours)\n\n3.1 Perform Pre-Operation\nActivities\n3.2 Operate, monitor and\nmaintain Food processing\nEquipment\n3.3 Perform post operation\nactivities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced Learning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n4. Perform\nMathematical\nComputations (8\nhours)\n4.1 Gather, summarize and\ntabulate the recorded\ndata\n4.2 Review the various\nformulations\n4.3 Calculate production\ninput and output\n4.4 Compute production\ncost\n• Lecture\n• Practical\nexercise\n\n•\nWritten\nexamination\n•\nPractical\nexercise\n•\nDirect\nObservation\n5. Implement Good\nManufacturing\nPractice (32\nhours)\n5.1 Perform pre-work\nactivities in relation to\nGMP\n5.2 Identify requirements of\nGMP related to own work\n5.3 Observe personal\nhygiene and conduct to\nmeet GMP requirements\n5.4 Follow GMP\nrequirements when\ncarrying out work\nactivities\n5.5 Perform post-work\nactivities in relation to\nGMP\n5.6 Complete workplace\ndocumentation to support\nGMP\n\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Written/Oral\nexamination\n• Demonstration of\npractical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 103 ---\n__________________________________________________\nTR- Food Processing NC IV\n101\n6. Implement\nEnvironmental\nPolicies and\nProcedures (32\nhours)\n6.1 Access and apply\nworkplace information on\nenvironmental policies\nand procedures relating\nto own work\n6.2 Follow work procedures\n6.3 Identify, control and\nreport unacceptable\nperformance\n6.4 Maintain housekeeping\nstandards in work area\n\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self\npaced Learning\n• Written/Oral\nexamination\n• Demonstration of\npractical skills\n• Direct\nobservation\n• Interview\n7. Monitor the\nImplementation\nof Good\nManufacturing\nPractice (16\nhours)\n7.1 Ensure others in the work\narea are able to meet\nGMP requirements\n7.2 Monitor personal hygiene\nand conduct of team\nmembers in the work\narea\n7.3 Monitor implementation\nof GMP requirements in\nthe work area\n7.4 Contribute to validation\nprocesses\n7.5 Take corrective action in\nresponse to GMP non-\ncompliance\n7.6 Maintain and improve\nGMP in the work area\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced\nLearning\n\n• Written/Oral\nexamination\n• Demonstration of\npractical skills\n• Direct\nobservation\n• Interview\n8. Monitor the\nImplementation\nof environmental\npolicies (16\nhours)\n8.1 Ensure others in the work\narea are able to\nimplement environmental\nwork practices\n8.2 Monitor observance of\nwork procedures\n8.3 Implement emergency\nprocedures to respond to\nhazardous events\n8.4 Maintain and improve\nenvironmental\nmanagement in the work\narea\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Written/Oral\nexamination\n• Demonstration of\npractical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 104 ---\n__________________________________________________\nTR- Food Processing NC IV\n102\nCORE COMPETENCIES\n(360 hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply raw\nmaterials/\ningredients and\nprocess\nknowledge (32\nhours)\n1.1 Identify and respond to\nnon-conforming\ningredients/raw materials\n1.2 Identify and respond to\nnon-conforming product\nand processes\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Direct\nObservation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n2. Maintain food\nsafety when\nloading, unloading\nand transporting\nfood (24 hours)\n2.1 Prepare to transport food\n2.2 Load, unload, and\ntransport food safely\n\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Direct\nObservation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n 3. Participate in\nsensory analysis\n(24 hours)\n3.1 Conduct sensory analysis\n3.2 Report results of sensory\nanalysis\n\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Direct\nObservation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n4. Set up and\noperate\nprocesses in a\nproduction/\npackaging system\n(160 hours)\n\n4.1 Set up production/\npackaging system for\noperation\n4.2 Operate and monitor the\nsystem\n4.3 Use re-order procedures\nto maintain stock levels\n4.4 Organize cyclical stock\ncounts and report\nvariances\n4.5 Handover production/\npackaging system\noperation\n4.6 Shut down the\nproduction/ packaging\nsystem\n4.7 Contribute to the\ncontinuous improvement\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Direct\nObservation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n--- PDF PAGE 105 ---\n__________________________________________________\nTR- Food Processing NC IV\n103\nof the production/\npackaging system\n\n5. Participate in an\naudit process (40\nhours)\n5.1 Participate in planning an\naudit\n5.2 Participate in conducting\nan audit\n5.3 Report and follow up\naudit outcomes\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Direct\nObservation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n6. Participate in a\nHACCP team (40\nhours)\n6.1 Prepare to develop\nand/or review a food\nsafety program\n6.2 Identify and/or review\nfood safety hazards\n6.3 Establish, implement and\nreview methods to\nmonitor and control food\nsafety hazards\n6.4 Establish and review\nfood safety\ndocumentation,\ncommunication and\nrecording systems\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Direct\nObservation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n7. Monitor\nworkplace\nperformance and\nparticipate in\nimprovement\nprocesses (40\nhours)\n7.1 Identify recording and\nreporting requirements\n7.2 Maintain and secure\nworkplace information\n7.3 Analyze performance\nand identify opportunities\nfor improvement\n7.4 Identify other data\nrequirements\n7.5 Analyze the issue or\nproblem\n7.6 Recommend options for\nimprovement\n7.7 Participate in\nimplementing\nimprovement proposals\n• Audio Visual\n• Lecture/\nDiscussion\n• Practical Lab\n• Demonstration\n• Individual Self-\npaced Learning\n\n• Direct\nObservation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n--- PDF PAGE 106 ---\n__________________________________________________\nTR- Food Processing NC IV\n104\n\n• The training is based on curriculum developed from the competency\nstandards;\n\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n•\nProject-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 107 ---\n__________________________________________________\nTR- Food Processing NC IV\n105\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate both oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n FOOD PROCESSING NC IV\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Food Processing NC IV.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n5\nWeighing scales and\nbalances of various\ncapacities and\nsensitivities\n1 set\nFood processing\nsystem with retort,\npump, boiler, 