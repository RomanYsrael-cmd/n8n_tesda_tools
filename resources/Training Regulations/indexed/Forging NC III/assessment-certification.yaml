      "text": "Impression-die forging Impression-die forging is also called closed-die forging. In impression-die work metal is placed in a die resembling a mold, which is attached to the anvil. Usually the hammer die is shaped as well. The hammer is then dropped on the workpiece, causing the metal to flow and fill the die cavities. The hammer is generally in contact with the workpiece on the scale of milliseconds. Depending on the size and complexity of the part the hammer may be dropped multiple times in quick succession."
