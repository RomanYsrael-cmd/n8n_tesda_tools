      "number": "6",
      "text": "Open-die forging Open-die forging is also known as smith forging.In open-die forging a hammer comes down and deforms the workpieces, which is placed on a stationary anvil. Open-die forging gets its name from the fact that the dies (the working surfaces of the forge that contract the workpiece) do not enclose the workpiece, allowing it to flow except where contacted by the dies. Therefore the operator needs to orient and position the workpiece to get the desired shape. The dies are usually flat in shape, but some have a specially shaped surface for specialized operations. For instance, the die may have a round, concave, or convex surface or be a tool to form holes or be a cut-off tool."
