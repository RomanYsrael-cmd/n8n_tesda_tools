      "number": "5",
      "text": "Hammer forging In modern times, industrial forging is done either with presses or with hammers powered by compressed air, electricity, hydraulics or steam. These hammers are large, having reciprocating weights in the thousands of pounds. Smaller power hammers, 500 lb (230 kg) or less reciprocating weight, and hydraulic presses are common in art smithies as well. Steam hammers are becoming obsolete."
