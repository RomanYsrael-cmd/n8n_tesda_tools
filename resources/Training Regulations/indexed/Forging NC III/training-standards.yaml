    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Forging NC III\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FORGING\n\nNC Level: NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n72 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of FORGING NC III Qualification. It consists of competencies that a person must\nachieve to be able to perform hand forging to complex shapes of different metals. It also\ncovers hammer forging to complex shapes using power hammer which applies to open die\nforging of complex shapes such as forged bosses, heavy rings and bushes. Both\ncompetencies also cover specialized methods of holding, and positioning and lifting complex\nforgings. Competency on performing drop and upset forging on a range of metals is also\nincluded.\n\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\nIt also includes common competencies such as: Read, Interpret and Apply Engineering\nDrawings; Perform Mensuration and Calculation Read; Interpret and Apply Specifications and\nManuals and; Perform Shop Maintenance.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n43\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/ role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Lecture\n• Self-paced\ninstruction\n• Group\ndiscussion\n• Practical work\napproach\n• Research study\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Lecture\n• Self-paced\ninstruction\n• Group\ndiscussion\n•\nFilm showing\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2 .Interpret drawings\n1.3 Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand Calculation\n2.1 Select measuring instrument\n2.2 Carry out measurement and\ncalculations.\n2.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals\nand interpret data and\nspecification\n3.2 Apply information accessed\nin manual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n\n• Written test\n• Direct\nobservation\n• Project\nmethod\n• Interview\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n44\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstratio\nn\n• Interview\n\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Hand Forge\nComplex\nShapes\n1.1 Forge complex shapes using\nhand tools on an anvil\n1.2 Perform splitting and bundling\non anvil\n1.3 Produce jigs and tools for\ncomplex shapes\n• Lecture/\nDemonstration\n• Dual training\n• Discussion\n\n• Observation\nwith\nQuestioning\n• Third party\nreport\n•\nPortfolio\n2. Hammer\nForge\nComplex\nShapes\n2.1 Set up and operate forging\nmachine\n2.2 Forge complex shapes and\nheavy parts\n2.3 Heat complex forgings\n• Lecture/\nDemonstration\n• Dual training\n• Discussion\n\n• Observation\nwith\nQuestioning\n•\nPortfolio\n•\nThird party\nreport\n3. Perform Drop\nand Upset\nForging\n3.1 Identify and select drop and\nupset forging equipment and\ntools for specific operation\n3.2 Set up and operate drop and\nupset forging equipment\n3.3 Prepare material\n3.4Drop and upset forge material\n• Lecture/\nDemonstration\n• Dual training\n• Discussion\n\n• Observation\nwith\nQuestioning\n• Portfolio\n• Third party\nreport\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n45\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the\ncurriculum modules;\n Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n46\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• With 2 year experience in basic foundry melting;\n• Ability to communicate both orally and in writing;\n• Physically and mentally fit; and\n• Must possess the FORGING National Certificate NC II or equivalent qualification\nin forging\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n FORGING NC III\n\nRecommended list of tools, equipment and materials for the training of 12 trainees for\nFORGING NC III\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n4 pairs\nGloves\n\nForklift 2Tons\ncapacity\n4 gallon\nLubricant\n2 pairs\nSafety shoes\n\nPortable Lifter\n500Kgs capacity\n100Kgs\nLow/medium carbon\nsteel\n2 sets\nColored glass\n1 unit\nDrop hammer\n20Kgs\nAluminum rods\n1 Lot\nFlatters\n1 unit\nUpset machine\n40Kgs\nCopper Rods\n1 Lot\nTongs\n1 unit\nMechanical press\n50Kgs\nAlloy Steel Bars\n1 Lot\nSwaging dies\n1 unit\nHydraulic press\n3 tank\nOxygen\n1 Lot\nSet hammers\n1 set\nOxy-acetylene\ncutting outfit\n2 tank\nAcetylene\n1 Lot\nAssorted inserts\n1 unit\nGas Heating\nFurnace\n3 tank\nLPG\n4 pcs\nBall pein\nhammers\n1 unit\nElectric heating\nfurnace\n200 liter\nDiesel fuel\n4 pcs\nBoard hammer\n1 lot\nAssorted Dies\n10Kgs\nGraphite\n2 pcs\nAnvil\n1 Lot\nDie block\n50Kgs\nSilica sand\n1 Lot\nSplitters\n1 lot\nBenders\n2 Kgs\nGrease\n1 Lot\nBolster\n1 unit\nAir compressor\n2 Kgs\nWax\n1 Lot\nTrimmers\n1 lot\nTrimming dies\n1 Lot\nWood cushions\n1 unit\nPower shear\nmachine\n\n2 sets\nLubricant\ndispenser\n\n1 Lot\nPunch\n1 Lot\nDraw dies\n3 units Hand power\ntools\n\n2 units\nGrease gun\n4 pcs\nSteel brush\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n47\n4 pcs\nSledge hammer\n6 pcs\nClamps\n1 Lot\nAssorted keys\n1 Lot\nSpanners\n3 pcs\nScrew driver\n2 pcs\nSteel Tape /\nMeter\n\n2 pcs\nPipe Wrench\n3 pcs\nAdjustable\nwrench\n\n2 sets\nVernier caliper\n2 pairs\nApron\n2 pairs\nArm band\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n48\n3.5 TRAINING FACILITIES\n FORGING NC III\nBased on a class size of 12 students/trainees\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN SQ.\nMETERS\nBuilding (permanent)\n26.00 x 28.00\n728.00\n728.00\nTrainee Working Space\n3.50 x 3.50 per\nstudent / trainee\n12.25 per\nstudent\n147.00\nLecture room\n9.00 x 10.00\n90.00\n90.00\nLearning resource\ncenter\n5.00 x 8.00\n40.00\n40.00\nFacilities / Equipment /\nCirculation area**\n-\n-\n302.00\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE\nMANUFACTURING SUB SECTOR\n\nFORGING NC III\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of FORGING NC III\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n• Must be a civil-service eligible or holder of appropriate professional license issued by\nthe Professional Regulatory Commission (for government positions\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or equivalent”\nupon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n49"
