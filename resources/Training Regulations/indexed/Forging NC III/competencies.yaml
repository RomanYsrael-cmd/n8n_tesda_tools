        "source_text": "--- PDF PAGE 10 ---\n________________________________________________________________________________________________________________ \nTR FORGING NC III                                                                                                                Promulgated   \n           \n8\nUNIT OF COMPETENCY:   DEVELOP AND PRACTICE NEGOTIATION SKILLS \n \nUNIT CODE                     :   500311111 \n \nUNIT DESCRIPTOR        : This unit covers the skills, knowledge and attitudes required to \ncollect information in order to negotiate to a desired outcome and \nparticipate in the negotiation.   \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Plan negotiations \n1.1 Information on preparing for negotiation is identified and \nincluded in the plan \n1.2 Information on creating non verbal environments for \npositive negotiating is identified and included in the plan \n1.3 Information on active listening is identified and included in \nthe plan \n1.4 Information on different questioning techniques is \nidentified and included in the plan \n1.5Information is checked to ensure it is correct and up-to- date \n2.   Participate in \nnegotiations   \n2.1 Criteria for successful outcome are agreed upon by all \nparties \n2.2 Desired outcome of all parties are considered \n2.3 Appropriate language is used throughout the negotiation \n \n2.4 A variety of questioning techniques are used \n2.5 The issues and processes are documented and agreed \nupon by all parties \n2.6 Possible solutions are discussed and their viability assessed \n2.7 Areas for agreement are confirmed and recorded \n2.8Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\n________________________________________________________________________________________________________________ \nTR FORGING NC III                                                                                                                Promulgated   \n           \n9\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Preparing for \nnegotiation \n1.1 \n \n1.2 \n1.3 \n1.4 \n \n \n \n \n \n1.5 \n \n \n \n \n \n \n \n1.6  \nBackground information on other parties to the \nnegotiation \nGood understanding of topic to be negotiated \nClear understanding of desired outcome/s \nPersonal attributes \n1.4.1 self awareness \n1.4.2 self esteem \n1.4.3 objectivity \n1.4.4 empathy \n1.4.5 respect for others \nInterpersonal skills \n1.5.1 listening/reflecting \n1.5.2 non verbal communication \n1.5.3 assertiveness \n1.5.4 behavior labeling \n1.5.5 testing understanding \n1.5.6 seeking information \n1.5.7 self disclosing \nAnalytic skills \n1.6.1 observing differences between content and \nprocess \n1.6.2 identifying bargaining information \n1.6.3 applying strategies to manage process \n1.6.4 applying steps in negotiating process \n1.6.5 strategies to manage conflict \n1.6.6 steps in negotiating process \n1.6.7 options within organization and externally for \nresolving conflict \n2.   Non verbal \nenvironments \n2.1 \n2.2 \n2.3 \n2.4 \nFriendly reception \nWarm and welcoming room \nRefreshments offered \nLead in conversation before negotiation begins \n3.  Active listening \n3.1 \n3.2 \n3.3 \n3.4 \n3.5 \nAttentive \nDon’t interrupt \nGood posture \nMaintain eye contact \nReflective listening \n4.  Questioning   \ntechniques \n4.1 \n4.2 \n4.3\nDirect \nIndirect \nOpen-ended\n\n--- PDF PAGE 12 ---\n________________________________________________________________________________________________________________ \nTR FORGING NC III                                                                                                                Promulgated   \n           \n10\n \nEVIDENCE GUIDE \n \n1.  Critical aspects of  \n competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated sufficient knowledge  of the factors influencing \nnegotiation to achieve agreed outcome \n1.2 Participated in negotiation with at least one person to achieve \nan agreed outcome \n2.   Underpinning \nknowledge and \nAttitude \n2.1 Codes of practice and guidelines for the organization   \n2.2 Organizations policy and procedures for negotiations   \n2.3 Decision making and conflict resolution strategies procedures   \n2.4 Problem solving strategies on how to deal with unexpected \nquestions and attitudes during negotiation  \n2.5 Flexibility \n2.6 Empathy   \n3.  Underpinning \nskills \n3.1 Interpersonal skills to develop rapport with other parties \n3.2 Communication skills  (verbal and listening) \n3.3 Observation skills  \n3.4 Negotiation skills \n4.  Resource \nimplications \nThe following resources MUST be provided:  \n4.1  Room with facilities necessary for the negotiation process \n4.2  Human resources (negotiators)  \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1  Observation/demonstration and questioning \n5.2  Portfolio assessment \n5.3  Oral and written questioning \n5.4  Third party report \n6.  Context of \nassessment \n6.1 Competency to be assessed in real work environment or in a \nsimulated workplace setting.\n",
