ing\n1.2 Machining drawing\n1.3 Project plan\n1.4 Technical drawing\n2. Data\nData includes but not limited to\n2.1 Material specifications\n2.2 Process specifications\n2.3 Special instructions\n2.4 Machining locating points\n2.5 Clamping points\n2.6 Amount of draft\n2.7 Surface finish\n\n--- PDF PAGE 25 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n23\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed drawings/specification\n1.2 Interpreted drawings\n1.3 Applied information in drawings\n1.4 Stored drawings\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of drawings used in automotive manufacturing industry\n2.2 Identification of symbols used in the drawings\n2.3 Identification of units of measurements\n2.4 Unit conversion\n2.5 Attention to details, Perseverance, Honesty\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and\ninterpret engineering drawings and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All drawings/engineering specifications relative to automotive\nmanufacturing\n4.2 Job order, requisitions\n4.3 Product sample\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6. Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 26 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n24\n\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit includes identifying, caring for, handling, using and\nmaintaining measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to\njob requirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\nusing the four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 27 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Straight Edge\n1.6 Thickness gauge\n1.7 Try square\n1.8 Protractor\n1.9 Height gauge\n1.10 Steel rule\n1.11 Shrink rule\n\n2. Calculation\n\nKinds of part mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11 Shrinkage allowance\n\n--- PDF PAGE 28 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n26\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Underpinning\nSkills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n27\n\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and periodic\nmaintenance manual.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3 Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n28\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n29\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nImplications\n\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6. Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n30\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE\n:\nALT723205\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and checking\nof tools/ equipment and disposal of used supplies/materials are\nalso incorporated in this competency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools cleaning\nrequirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\nrespective shelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per workshop\nSOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health and Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n32\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n33\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nHAND-FORGE COMPLEX SHAPES\n\nUNIT CODE\n\n:\nALT722304\n\nUNIT DESCRIPTOR :\nThis unit covers production of intricate solid forged shapes\nby hand-forging of different metals, using specialized\ntechniques, tools and jigs. This unit applies to hand-forging\nof complex shapes commonly forged in the forging and\nfabrication areas of industry. Specialized methods of\nholding, positioning and lifting complex forgings are\ncovered. Equipment may include diesel, electric and gas\nfurnaces, coke fires and gaseous oxygen/fuel equipment.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Forge complex\nshapes using\nhand tools on\nan anvil\n\n1.1 Task requirements for complex hand forging are identified and\nclarified as required.\n1.2 Material volume is calculated based on task requirements.\n1.3 Allowances for bending, material shrinkage and oxidization are\nmade as required.\n1.4 Hand tools and formers are selected and used in accordance with\nstandard operating procedures.\n1.5 Safe hand forging procedures are followed.\n1.6 Techniques and principles for producing complex shapes are\napplied correctly.\n1.7 Forging is checked to ensure conformance to tolerances and\nspecifications.\n\n2. Perform\nsplitting and\nbundling on\nanvil\n2.1 Tools and equipment are selected and used in accordance with\nstandard operating procedures.\n2.2 Hand forging techniques and procedures are applied to forging\nand opening bundled and split sections.\n2.3 Allowance is made for material shrinkage, distortion and\noxidization.\n2.4 Heat is applied and controlled in specified areas of the material to\nbe forged in accordance with standard operating procedures.\n2.5 Forgings are handled safely and correctly according to workplace\nprocedures.\n2.6 Forgings are checked to ensure conformance to tolerances and\nspecifications.\n\n3. Produce jigs\nand tools for\ncomplex\nshapes\n\n3.1 Tools and equipment required to taper and bend materials are\nselected appropriate to task requirements.\n3.2 Techniques for producing jigs and tools are applied correctly.\n3.3 Jigs and patterns are bent and shaped to specifications.\n3.4 Hand held tools are forged to cut pattern, in accordance with\nspecifications.\n3.5 Final shaping, heat treatment and sharpening is performed to\nspecifications\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n34\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Complex hand\nforging\n1.1 Shaping\n1.2 Reverse tapering\n1.3 Jump up section for bends\n2. Hand forging\ntechniques\n\n2.1 Spreading\n2.2 Surface chasing\n2.3 Hot splitting\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n35\nEVIDENCE GUIDE\n\n1. Critical aspect\nof\n competency\nAssessment requires evidence that the candidate demonstrated hand\nforging of complex shapes.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nHand tools and their applications\n2.2\nTechniques and procedures for hand forging complex shapes\n2.3\nNumerical operations and calculations/formulae within the\nscope of this unit\n2.4\nProcedures for measuring forged articles\n2.5\nForging temperatures and heat specifications for multiple pieces\n2.6\nTools, techniques and equipment required to taper and bend\nmaterials\n2.7\nEffects of material shrinkage and oxidization on the dimensions\nof the forged article\n2.8\nMethods of overcoming/allowing for the effects of shrinkage and\noxidization when hand forging articles\n2.9\nProcedures for handling forgings\n2.10 Heating equipment and applications\n2.11 Heat treatment processes for forging\n2.12 Heat treatment requirements for given materials\n2.13 Perseverance and Honesty in the Workplace\n2.14 Safety Practices and Personal Protective Equipment Used in\nForging\n\n3. Underpinning\n skills\n\n3.1\nSelecting and using measuring guides\n3.2\nCalculating allowance for material volume, bending, shrinkage\nand oxidization\n3.3\nSelecting tools and equipment\n3.4\nForging and splitting sections\n3.5\nForging bundled sections and opening bundled sections\n3.6\nPositioning material\n3.7\nHandling materials\n3.8\nSelecting and setting up heating equipment\n3.9\nPerforming heat treatment process(es) for forging\n3.10 Applying and controlling heat\n\n4. Resource\n implications\n\nThe following resources MUST be provided:\n4.1 Tools, equipment, materials and documentation required relative\nto hand-forging of complex shapes\n4.2 Job order, requisitions slip for materials\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n36\n\nUNIT OF COMPETENCY :\nHAMMER FORGE COMPLEX SHAPES\n\nUNIT CODE\n\n:\nALT722305\n\nUNIT DESCRIPTOR\n:\nThis unit covers forging complex shapes using a power\nhammer. This unit applies to open die forging of complex\nshapes commonly forged in the forging and fabrication\nareas of industry including forged bosses, heavy rings and\nbushes. Specialized methods of holding, and positioning\nand lifting complex forgings are covered. Equipment may\ninclude forging plant, diesel and gas furnaces.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Set up and operate\nforging machine\n\n1.1 Forging machine is set up and operated in accordance with\nstandard operating procedures and specifications.\n1.2 Complex open-die tooling is selected and used according to\nworkplace procedures.\n1.3 Safe operating procedures are followed.\n\n2. Forge complex\nshapes and heavy\nparts\n\n2.1 The material to be forged is safely and correctly positioned in\nthe forming equipment in accordance with standard operating\nprocedures.\n2.2 Hot forgings are marked and measured as required.\n2.3 Allowance is made for material shrinkage and oxidization.\n2.4 Hammer tools and fixtures attached to power hammer are\nused according to workplace procedures.\n2.5 Forging is checked to ensure conformance to tolerances and\nspecifications.\n2.6 Forgings are handled safely and correctly according to\nworkplace procedures.\n3. Heat complex\nforgings\n\n3.1 Heating plant and equipment is selected appropriate to work\nundertaken.\n3.2 Techniques used to heat heavy complex forgings are applied\ncorrectly\n3.3 Post-forging heating is performed correctly and safely.\n3.4 Hot forgings are handled safely and according to workplace\nprocedures.\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n37\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Forged\n\n1.1 Forging on and against cold mandrels\n1.2 Hammer punching and opening of large diameter holes\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n38\nEVIDENCE GUIDE\n\n1. Critical aspect of\n Competency\n\nAssessment requires evidence that the candidate hammer-forged\ncomplex shapes.\n\n2. Underpinning\nKnowledge and\nattitudes\n2.1 Hammer tools and formers and their applications\n2.2 Hammer forging techniques\n2.3 Numerical operations and calculations/formulae for data\nanalysis within the scope of this unit\n2.4 Tools, formers and techniques to produce a range of hammer-\nforged articles\n2.5 Procedures for measuring forged articles\n2.6 Effects of material shrinkage and oxidization on the dimensions\nof the forged article\n2.7 Methods of overcoming/allowing for the effects of shrinkage\nand oxidization when hammer forging articles\n2.8 Hammer punching techniques\n2.9 Procedures for handling material to be hammer forged\n2.10 Heating equipment and applications\n2.11 Heat treatment processes for forging\n2.12 Heat treatment requirements for given materials\n2.15 Perseverance and Honesty in the Workplace\n2.13 Safety Practices and Personal Protective Equipment Used in\nForging\n\n3. Underpinning skills\n\n3.1 Selecting and using measuring guides\n3.2 Calculating allowance for material shrinkage and oxidization\n3.3 Setting up and operating forging machine\n3.4 Selecting forming tools and equipment\n3.5 Positioning material\n3.6 Handling materials\n3.7 Selecting and setting up heating equipment\n3.8 Performing heat treatment process(es) for forging\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.4 Tools, equipment, materials and documentation required\nrelative to hammer forging of complex shapes\n4.5 Job order, requisitions slip for materials\n4.6 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\nenvironment.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n39\n\nUNIT OF COMPETENCY :\nPERFORM DROP AND UPSET FORGING\n\nUNIT CODE\n\n:\nALT722306\n\nUNIT DESCRIPTOR\n:\nThis unit covers selecting, setting up, and operating drop\nand upset forging equipment. This unit includes the\npreparation and forging of material using drop and upset\nmethods on a range of metals, and a range of drop forging\nand upset forging equipment including cold upset forging\nequipment. The material forged is to specified dimensional\naccuracy and finish.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and select\ndrop and upset\nforging equipment\nand tools for\nspecific operation\n1.1 Appropriate equipment is selected which accounts for size\nof material and procedures.\n1.2 Dies and punches are selected for specific operations and\nequipment.\n1.3 Die replacement is determined with regard to relief\nallowances, cracking, dimensions, etc.\n\n2. Set up and operate\ndrop and upset\nforging equipment\n\n2.1 Equipment is correctly and safely set up, adjusted and\noperated according to workplace procedures.\n2.2 Correct die setting techniques are applied in setting correct\ndie and punch alignment.\n2.3 Die preheating procedures are applied according to\nworkplace procedures.\n2.4 Heating process is applied according to workplace\nprocedures.\n\n3. Prepare material\n3.1 Materials are prepared and heated in accordance with job\nrequirements and/or specifications.\n\n4. Drop and upset\nforge material\n\n4.1 Material is drop forged using the correct procedures and\ntechniques.\n4.2 Lubricant is applied for die wear and forging release\naccording to workplace procedures.\n4.3 Correct grain flow is determined.\n4.4 Galls, folds and cracks are identified and corrected according\nto workplace procedures.\n4.5 Removal of flash or fin is carried out according to\nprocedure.\n4.6 Material amounts are calculated with allowance for heat\nwastage and flash or fin.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n40\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Equipment\n\nMay include:\n1.1 Drop forging hammer/press\n1.2 Open die forging hammer using closed loose die\n1.3 Horizontal upsetting machine (heading machine)\n2. Materials\n\nMay include:\n2.1 Ferrous materials (steel)\n2.2 Non-ferrous material (copper, aluminum, bronze)\n\n3. Lubricants\n\n3.1 Graphite bearing oils/greases\n3.2 Cellulose granules\n3.3 Waxes\n\n4. Removal of flash\nor fin\n\n4.1 Ejector pins\n4.2 Drafts in die (angle)\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n41\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate made\npreparation and forged material using drop and upset methods on\na range of metals, using a range of drop forging and upset forging\nequipment including cold upset forging equipment.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Drop or upset forging techniques\n2.2 Characteristics of forging equipment\n2.3 Safety work practices and procedures\n2.4 Hazards and control measures associated with drop and upset\nforging, including housekeeping\n2.5 Incorrect/correct alignment of dies, punches\n2.6 Perseverance and Honesty in the Workplace\n2.7 Safety Practices and Personal Protective Equipment Used in\nForging\n\n3. Underpinning\n skills\n\n3.1 Inspecting dies and preparing dies and materials\n3.2 Aligning dies and punches\n3.3 Replacing dies\n3.4 Operating drop/upset forging equipment\n3.5 Die preparation\n3.6 Material preparation\n3.7 Detecting and correcting defects\n3.8 Removing flash or fins\n3.9 Calculating material volume, weight, allowances, heat wastage,\nflash, fin\n\n4. Resource\n implications\n\nThe following resources MUST be provided:\n4.1 Tools, equipment, materials and documentation required\nrelative to drop and upset forging\n4.2 Job order, requisitions slip for materials\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n42"
