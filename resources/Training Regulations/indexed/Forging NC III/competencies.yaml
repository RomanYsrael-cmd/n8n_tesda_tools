uipment Used in \nForging\n  \n3. Underpinning skills\n \n \n3.1 Selecting and using measuring guides  \n3.2 Calculating allowance for material shrinkage and oxidization  \n3.3 Setting up and operating forging machine  \n3.4 Selecting forming tools and equipment  \n3.5 Positioning material  \n3.6 Handling materials  \n3.7 Selecting and setting up heating equipment  \n3.8 Performing heat treatment process(es) for forging \n \n4. Resource \nimplications \n \n \nThe following resources MUST be provided:  \n4.4 Tools, equipment, materials and documentation required \nrelative to hammer forging of complex shapes \n4.5 Job order, requisitions slip for materials \n4.6 Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference \nmaterials. \n \n5. Method of \nassessment \n  \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3 Third Party Report\n \n6. Context of \nassessment  \n6.1 Assessment must be undertaken in accordance with the \nendorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a simulated \nenvironment.\n",
