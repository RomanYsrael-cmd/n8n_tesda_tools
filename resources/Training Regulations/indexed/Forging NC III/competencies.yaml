 measures associated with drop and upset \nforging, including housekeeping  \n2.5 Incorrect/correct alignment of dies, punches \n2.6 Perseverance and Honesty in the Workplace \n2.7 Safety Practices and Personal Protective Equipment Used in \nForging\n  \n3. Underpinning  \n    skills \n \n3.1 Inspecting dies and preparing dies and materials  \n3.2 Aligning dies and punches  \n3.3 Replacing dies  \n3.4 Operating drop/upset forging equipment  \n3.5 Die preparation  \n3.6 Material preparation  \n3.7 Detecting and correcting defects  \n3.8 Removing flash or fins  \n3.9 Calculating material volume, weight, allowances, heat wastage, \nflash, fin \n \n4. Resource \n     implications \n \n \nThe following resources MUST be provided:  \n4.1  Tools, equipment, materials and documentation required \nrelative to drop and upset forging \n4.2 Job order, requisitions slip for materials \n4.3 Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference \nmaterials. \n \n5. Method of \nassessment \n  \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio  \n5.3 Third party report\n \n6. Context of \nassessment  \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n      simulated environment\n",
