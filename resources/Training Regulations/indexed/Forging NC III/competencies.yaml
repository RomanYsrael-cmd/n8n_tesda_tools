        "source_text": "--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________ \nTR FORGING NC III                                                                                                                Promulgated   \n           \n36\n \nUNIT OF COMPETENCY : \nHAMMER FORGE COMPLEX SHAPES \n \nUNIT CODE  \n \n:  \nALT722305 \n \nUNIT DESCRIPTOR \n: \nThis unit covers forging complex shapes using a power  \nhammer. This unit applies to open die forging of complex  \nshapes commonly forged in the forging and fabrication  \nareas of industry including forged bosses, heavy rings and  \nbushes. Specialized methods of holding, and positioning \nand lifting complex forgings are covered. Equipment may \ninclude forging plant, diesel and gas furnaces.  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Set up and operate \nforging machine  \n \n \n1.1 Forging machine is set up and operated in accordance with \nstandard operating procedures and specifications.  \n1.2 Complex open-die tooling is selected and used according to \nworkplace procedures.  \n1.3 Safe operating procedures are followed.  \n \n2. Forge complex \nshapes and heavy \nparts  \n \n2.1 The material to be forged is safely and correctly positioned in \nthe forming equipment in accordance with standard operating \nprocedures.  \n2.2 Hot forgings are marked and measured as required.  \n2.3 Allowance is made for material shrinkage and oxidization.  \n2.4 Hammer tools and fixtures attached to power hammer are \nused according to workplace procedures.  \n2.5 Forging is checked to ensure conformance to tolerances and \nspecifications.  \n2.6 Forgings are handled safely and correctly according to \nworkplace procedures. \n3. Heat complex \nforgings  \n \n3.1 Heating plant and equipment is selected appropriate to work \nundertaken.  \n3.2 Techniques used to heat heavy complex forgings 