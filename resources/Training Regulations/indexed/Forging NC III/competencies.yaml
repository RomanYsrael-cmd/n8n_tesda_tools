        "source_text": "ALT722306\n\nUNIT DESCRIPTOR\n:\nThis unit covers selecting, setting up, and operating drop\nand upset forging equipment. This unit includes the\npreparation and forging of material using drop and upset\nmethods on a range of metals, and a range of drop forging\nand upset forging equipment including cold upset forging\nequipment. The material forged is to specified dimensional\naccuracy and finish.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and select\ndrop and upset\nforging equipment\nand tools for\nspecific operation\n1.1 Appropriate equipment is selected which accounts for size\nof material and procedures.\n1.2 Dies and punches are selected for specific operations and\nequipment.\n1.3 Die replacement is determined with regard to relief\nallowances, cracking, dimensions, etc.\n\n2. Set up and operate\ndrop and upset\nforging equipment\n\n2.1 Equipment is correctly and safely set up, adjusted and\noperated according to workplace procedures.\n2.2 Correct die setting techniques are applied in setting correct\ndie and punch alignment.\n2.3 Die preheating procedures are applied according to\nworkplace procedures.\n2.4 Heating process is applied according to workplace\nprocedures.\n\n3. Prepare material\n3.1 Materials are prepared and heated in accordance with job\nrequirements and/or specifications.\n\n4. Drop and upset\nforge material\n\n4.1 Material is drop forged using the correct procedures and\ntechniques.\n4.2 Lubricant is applied for die wear and forging release\naccording to workplace procedures.\n4.3 Correct grain flow is determined.\n4.4 Galls, folds and cracks are identified and corrected according\nto workplace procedures.\n4.5 Removal of flash or fin is carried out according to\nprocedure.\n4.6 Material amounts are calculated with allowance for heat\nwastage and flash or fin.\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n40\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Equipment\n\nMay include:\n1.1 Drop forging hammer/press\n1.2 Open die forging hammer using closed loose die\n1.3 Horizontal upsetting machine (heading machine)\n2. Materials\n\nMay include:\n2.1 Ferrous materials (steel)\n2.2 Non-ferrous material (copper, aluminum, bronze)\n\n3. Lubricants\n\n3.1 Graphite bearing oils/greases\n3.2 Cellulose granules\n3.3 Waxes\n\n4. Removal of flash\nor fin\n\n4.1 Ejector pins\n4.2 Drafts in die (angle)\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n41\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate made\npreparation and forged material using drop and upset methods on\na range of metals, using a range of drop forging and upset forging\nequipment including cold upset forging equipment.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Drop or upset forging techniques\n2.2 Characteristics of forging equipment\n2.3 Safety work practices and procedures\n2.4 Hazards and control measures associated with drop and upset\nforging, including housekeeping\n2.5 Incorrect/correct alignment of dies, punches\n2.6 Perseverance and Honesty in the Workplace\n2.7 Safety Practices and Personal Protective Equipment Used in\nForging\n\n3. Underpinning\n skills\n\n3.1 Inspecting dies and preparing dies and materials\n3.2 Aligning dies and punches\n3.3 Replacing dies\n3.4 Operating drop/upset forging equipment\n3.5 Die preparation\n3.6 Material preparation\n3.7 Detecting and correcting defects\n3.8 Removing flash or fins\n3.9 Calculating material volume, weight, allowances, heat wastage,\nflash, fin\n\n4. Resource\n implications\n\nThe following resources MUST be provided:\n4.1 Tools, equipment, materials and documentation required\nrelative to drop and upset forging\n4.2 Job order, requisitions slip for materials\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n42"
