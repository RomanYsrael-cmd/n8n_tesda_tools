f time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs will\nbe required as well as bank of questions which will be\nused to probe the reason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 17 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n15\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in\nthe application of mathematical concepts and techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given condition\n1.2 Mathematical techniques are selected based on the\ngiven problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the level\nof accuracy required for the problem\n2.3 Results of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected\nand required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\n--- PDF PAGE 19 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n17\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nskills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\n___________________________________________________________________________________________