          "source_text": "1. Forge complex \nshapes using \nhand tools on \nan anvil  \n \n1.1 Task requirements for complex hand forging are identified and \nclarified as required.  \n1.2 Material volume is calculated based on task requirements.  \n1.3 Allowances for bending, material shrinkage and oxidization are \nmade as required.  \n1.4 Hand tools and formers are selected and used in accordance with \nstandard operating procedures. \n1.5 Safe hand forging procedures are followed.  \n1.6 Techniques and principles for producing complex shapes are \napplied correctly.  \n1.7 Forging is checked to ensure conformance to tolerances and \nspecifications.  \n \n2. Perform \nsplitting and \nbundling on \nanvil  \n2.1 Tools and equipment are selected and used in accordance with \nstandard operating procedures. \n2.2 Hand forging techniques and procedures are applied to forging \nand opening bundled and split sections.  \n2.3 Allowance is made for material shrinkage, distortion and \noxidization.  \n2.4 Heat is applied and controlled in specified areas of the material to \nbe forged in accordance with standard operating procedures.  \n2.5 Forgings are handled safely and correctly according to workplace \nprocedures.  \n2.6 Forgings are checked to ensure conformance to tolerances and \nspecifications.\n \n3. Produce jigs \nand tools for \ncomplex \nshapes  \n \n3.1 Tools and equipment required to taper and bend materials are \nselected appropriate to task requirements. \n3.2 Techniques for producing jigs and tools are applied correctly. \n3.3 Jigs and patterns are bent and shaped to specifications.  \n3.4 Hand held tools are forged to cut pattern, in accordance with \nspecifications.  \n3.5 Final shaping, heat treatment and sharpening is performed to \nspecifications\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________ \nTR FORGING NC III                                                                                                                Promulgated   \n           \n34\n \nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n1. Complex hand \nforging  \n1.1 Shaping \n1.2 Reverse tapering \n1.3  Jump up section for bends  \n2. Hand forging \ntechniques  \n \n2.1 Spreading \n2.2 Surface chasing \n2.3 Hot splitting\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________ \nTR FORGING NC III                                                                                                                Promulgated   \n           \n35"
        },
        "evidence_guide": {
          "source_text": "1. Critical aspect \nof   \n     competency\nAssessment requires evidence that the candidate demonstrated hand \nforging of complex shapes.  \n \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nHand tools and their applications  \n2.2 \nTechniques and procedures for hand forging complex shapes  \n2.3 \nNumerical operations and calculations/formulae within the \nscope of this unit  \n2.4 \nProcedures for measuring forged articles  \n2.5 \nForging temperatures and heat specifications for multiple pieces \n2.6 \nTools, techniques and equipment required to taper and bend \nmaterials  \n2.7 \nEffects of material shrinkage and oxidization on the dimensions \nof the forged article  \n2.8 \nMethods of overcoming/allowing for the effects of shrinkage and \noxidization when hand forging articles  \n2.9 \nProcedures for handling forgings  \n2.10 Heating equipment and applications  \n2.11 Heat treatment processes for forging  \n2.12 Heat treatment requirements for given materials \n2.13 Perseverance and Honesty in the Workplace \n2.14 Safety Practices and Personal Protective Equipment Used in \nForging\n  \n3. Underpinning  \n    skills \n \n3.1 \nSelecting and using measuring guides  \n3.2 \nCalculating allowance for material volume, bending, shrinkage \nand oxidization  \n3.3 \nSelecting tools and equipment  \n3.4 \nForging and splitting sections  \n3.5 \nForging bundled sections and opening bundled sections  \n3.6 \nPositioning material  \n3.7 \nHandling materials  \n3.8 \nSelecting and setting up heating equipment  \n3.9 \nPerforming heat treatment process(es) for forging  \n3.10 Applying and controlling heat \n \n4. Resource \n    implications \n \n \nThe following resources MUST be provided:  \n4.1  Tools, equipment, materials and documentation required relative \nto hand-forging of complex shapes \n4.2 Job order, requisitions slip for materials \n4.3 Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference \nmaterials. \n \n5. Method of \nassessment \n  \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio  \n5.3 Third party report\n \n6. Context of \nassessment  \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n     simulated environment",
