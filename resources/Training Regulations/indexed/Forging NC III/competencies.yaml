        "evidence_guide": {
          "source_text": "1. Critical aspect of\n Competency\n\nAssessment requires evidence that the candidate hammer-forged\ncomplex shapes.\n\n2. Underpinning\nKnowledge and\nattitudes\n2.1 Hammer tools and formers and their applications\n2.2 Hammer forging techniques\n2.3 Numerical operations and calculations/formulae for data\nanalysis within the scope of this unit\n2.4 Tools, formers and techniques to produce a range of hammer-\nforged articles\n2.5 Procedures for measuring forged articles\n2.6 Effects of material shrinkage and oxidization on the dimensions\nof the forged article\n2.7 Methods of overcoming/allowing for the effects of shrinkage\nand oxidization when hammer forging articles\n2.8 Hammer punching techniques\n2.9 Procedures for handling material to be hammer forged\n2.10 Heating equipment and applications\n2.11 Heat treatment processes for forging\n2.12 Heat treatment requirements for given materials\n2.15 Perseverance and Honesty in the Workplace\n2.13 Safety Practices and Personal Protective Equipment Used in\nForging\n\n3. Underpinning skills\n\n3.1 Selecting and using measuring guides\n3.2 Calculating allowance for material shrinkage and oxidization\n3.3 Setting up and operating forging machine\n3.4 Selecting forming tools and equipment\n3.5 Positioning material\n3.6 Handling materials\n3.7 Selecting and setting up heating equipment\n3.8 Performing heat treatment process(es) for forging\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.4 Tools, equipment, materials and documentation required\nrelative to hammer forging of complex shapes\n4.5 Job order, requisitions slip for materials\n4.6 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\nenvironment.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n39\n\nUNIT OF COMPETENCY :\nPERFORM DROP AND UPSET FORGING\n\nUNIT CODE\n\n:"
        },
        "source_text": "ALT722305\n\nUNIT DESCRIPTOR\n:\nThis unit covers forging complex shapes using a power\nhammer. This unit applies to open die forging of complex\nshapes commonly forged in the forging and fabrication\nareas of industry including forged bosses, heavy rings and\nbushes. Specialized methods of holding, and positioning\nand lifting complex forgings are covered. Equipment may\ninclude forging plant, diesel and gas furnaces.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Set up and operate\nforging machine\n\n1.1 Forging machine is set up and operated in accordance with\nstandard operating procedures and specifications.\n1.2 Complex open-die tooling is selected and used according to\nworkplace procedures.\n1.3 Safe operating procedures are followed.\n\n2. Forge complex\nshapes and heavy\nparts\n\n2.1 The material to be forged is safely and correctly positioned in\nthe forming equipment in accordance with standard operating\nprocedures.\n2.2 Hot forgings are marked and measured as required.\n2.3 Allowance is made for material shrinkage and oxidization.\n2.4 Hammer tools and fixtures attached to power hammer are\nused according to workplace procedures.\n2.5 Forging is checked to ensure conformance to tolerances and\nspecifications.\n2.6 Forgings are handled safely and correctly according to\nworkplace procedures.\n3. Heat complex\nforgings\n\n3.1 Heating plant and equipment is selected appropriate to work\nundertaken.\n3.2 Techniques used to heat heavy complex forgings are applied\ncorrectly\n3.3 Post-forging heating is performed correctly and safely.\n3.4 Hot forgings are handled safely and according to workplace\nprocedures.\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n37\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Forged\n\n1.1 Forging on and against cold mandrels\n1.2 Hammer punching and opening of large diameter holes\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n38\nEVIDENCE GUIDE\n\n1. Critical aspect of\n Competency\n\nAssessment requires evidence that the candidate hammer-forged\ncomplex shapes.\n\n2. Underpinning\nKnowledge and\nattitudes\n2.1 Hammer tools and formers and their applications\n2.2 Hammer forging techniques\n2.3 Numerical operations and calculations/formulae for data\nanalysis within the scope of this unit\n2.4 Tools, formers and techniques to produce a range of hammer-\nforged articles\n2.5 Procedures for measuring forged articles\n2.6 Effects of material shrinkage and oxidization on the dimensions\nof the forged article\n2.7 Methods of overcoming/allowing for the effects of shrinkage\nand oxidization when hammer forging articles\n2.8 Hammer punching techniques\n2.9 Procedures for handling material to be hammer forged\n2.10 Heating equipment and applications\n2.11 Heat treatment processes for forging\n2.12 Heat treatment requirements for given materials\n2.15 Perseverance and Honesty in the Workplace\n2.13 Safety Practices and Personal Protective Equipment Used in\nForging\n\n3. Underpinning skills\n\n3.1 Selecting and using measuring guides\n3.2 Calculating allowance for material shrinkage and oxidization\n3.3 Setting up and operating forging machine\n3.4 Selecting forming tools and equipment\n3.5 Positioning material\n3.6 Handling materials\n3.7 Selecting and setting up heating equipment\n3.8 Performing heat treatment process(es) for forging\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.4 Tools, equipment, materials and documentation required\nrelative to hammer forging of complex shapes\n4.5 Job order, requisitions slip for materials\n4.6 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third Party Report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\nenvironment.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FORGING NC III Promulgated\n\n39\n\nUNIT OF COMPETENCY :\nPERFORM DROP AND UPSET FORGING\n\nUNIT CODE\n\n:"
