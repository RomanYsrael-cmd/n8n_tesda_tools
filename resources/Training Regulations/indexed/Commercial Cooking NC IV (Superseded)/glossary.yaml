      "term": "18. Marinade – an apparel used in cooking to flavor and moisten foods, may be liquid or",
      "definition": "dry. Liquid marinades are usually based on acidic ingredients, such as wine or vinegar, dry marinades are usually salt-based. 19. Microwave – a method of meat transfer in which electro-magnetic waves generated by a device called a magnetron penetrate food and cause the water molecules in it to oscillate. 20. Mince – to chop into very small pieces 21. Mise-en-place – “Put in place”. The preparation and assembly of ingredients, pans, utensils and plates or serving pieces needed for a particular dish or service period 22. Panbroil – a cooking method similar to dry sautéing that simulates broiling by cooking an item in a hot pan with little or no fat. 23. Panfry – a cooking method in which items are cooked in deep fat in a skillet over medium heat; this generally involves more fat than sautéing or stir-frying but less than deep-frying. 24. Pasta – noodles made from a dough of flour (often semolina), water and/or eggs. This dough is kneaded, rolled and cut or extruded, then cooked by boiling 25. Poach – a method in which items are cooked gently in simmering liquid 26. Pressure steamer – a machine that steams food by heating water under pressure in a sealed compartment, allowing the team to reach higher-than-boiling temperature (212ºF/100ºC). The food is placed in a sealer chamber that cannot be opened until the pressure has released and the steam properly vented from the chamber. 27. Roast – a dry heat cooking method in which items are cooked in an oven or on a spit over a fire 28. Sauté – a cooking method in which items are cooked quickly in a small amount of fat in a pan on the range top. 29. Simmer – to main the temperature of a liquid just below boiling. Also, a cooking method in which items are cooked in a simmering liquid. 30. Smoking – any of several methods for preserving and flavor foods by exposing them to smoke. Methods include cold-smoking (in which smoked items are not fully cooked), hot-smoking (in which the items are cooked), and smoke-roasting. 31. Steaming – a cooking method in which items are cooked in a vapor by boiling water or other liquids."
