  "source_text": "DEFINITION OF TERMS\n\n1. Barbecue – A cooking method involving grilling food over a wood or charcoal fire.\nUsually some sort of rub, marinade, or sauce is brushed on the item before or during\ncooking.\n2. Blanch – to cook an item briefly in boiling water or hot fat before finishing or storing\nit.\n3. Boil – a cooking method in which items are immersed in liquid at or above the\nboiling point (212ºF/100ºC).\n4. Braise – a cooking method in which the main item, usually meat, is seared in fat,\nthen simmered in stock to another liquid in a covered vessel.\n5. Broil – a cooking method in which items are cooked by a radiant heat source placed\nabove the food, usually in a broiler or salamander.\n6. Butcher - a chef or purveyor who is responsible for butchering meats, poultry and\noccasionally fish.\n7. Chafing dish – a metal dish with a heating unit (flame or electric) used to keep\nfoods warm and to cook foods at tableside or during buffet service.\n8. Chop – to cut into pieces of roughly the same size. Also, a small cut of meat\nincluding part of the rib\n9. Combination method – a cooking method that involves the application of both\nmoist and dry heat to the main item (for example, braising or stewing)\n10. Cure – to preserve a food by salting, smoking and or drying\n11. Deep fry – a cooking method in which foods are cooked by immersion in hot fat;\ndeep-fried foods are often coated with bread crumbs or batter before being cooked\n12. Dice – to cut ingredients into small cubes (1/4 inches for small, 1/3 for medium, ¾\ninch for large)\n13. Fillet – a boneless cut of meat, fish or poultry\n14. Garnish – an edible decoration of accompaniment to a dish\n15. Gratine – browned in an oven or under a salamander. Gratine can also refer to a\nforcemeat in which some portion of the dominant meat is sautéed and cooled before\ngrinding.\n16. Grill – a cooking technique in which foods are cooked by a radiant heat source\nplaced below the food. Also, the piece of equipment on which grilling is done.\n17. Instant reading thermometer – a thermometer used to measure the internal\ntemperature of foods. The stem is inserted into the food, producing an instant\ntemperature read out.\n\n--- PDF PAGE 121 ---\n_______________________________________________________________________________________________119\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n18. Marinade – an apparel used in cooking to flavor and moisten foods, may be liquid or\ndry. Liquid marinades are usually based on acidic ingredients, such as wine or\nvinegar, dry marinades are usually salt-based.\n19. Microwave – a method of meat transfer in which electro-magnetic waves generated\nby a device called a magnetron penetrate food and cause the water molecules in it\nto oscillate.\n20. Mince – to chop into very small pieces\n21. Mise-en-place – “Put in place”. The preparation and assembly of ingredients, pans,\nutensils and plates or serving pieces needed for a particular dish or service period\n22. Panbroil – a cooking method similar to dry sautéing that simulates broiling by\ncooking an item in a hot pan with little or no fat.\n23. Panfry – a cooking method in which items are cooked in deep fat in a skillet over\nmedium heat; this generally involves more fat than sautéing or stir-frying but less\nthan deep-frying.\n24. Pasta – noodles made from a dough of flour (often semolina), water and/or eggs.\nThis dough is kneaded, rolled and cut or extruded, then cooked by boiling\n25. Poach – a method in which items are cooked gently in simmering liquid\n26. Pressure steamer – a machine that steams food by heating water under pressure in\na sealed compartment, allowing the team to reach higher-than-boiling temperature\n(212ºF/100ºC). The food is placed in a sealer chamber that cannot be opened until\nthe pressure has released and the steam properly vented from the chamber.\n27. Roast – a dry heat cooking method in which items are cooked in an oven or on a\nspit over a fire\n28. Sauté – a cooking method in which items are cooked quickly in a small amount of fat\nin a pan on the range top.\n29. Simmer – to main the temperature of a liquid just below boiling. Also, a cooking\nmethod in which items are cooked in a simmering liquid.\n30. Smoking – any of several methods for preserving and flavor foods by exposing\nthem to smoke. Methods include cold-smoking (in which smoked items are not fully\ncooked), hot-smoking (in which the items are cooked), and smoke-roasting.\n31. Steaming – a cooking method in which items are cooked in a vapor by boiling water\nor other liquids.\n\n32. Stew – a cooking method nearly identical to braising but generally involving smaller\npieces of meat and hence a shorter cooking time. Stewed items also may be\n\n--- PDF PAGE 122 ---\n_______________________________________________________________________________________________120\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nblanched, rather than seared, to give the finished product a pale color. Also a dish\nprepared by using the stewing method.\n33. Stir fry – a cooking method similar to sautéing in which items are cooked over high\nheat, using little fat. Usually this is done in a wok and the food is kept moving\nconstantly.\n\n--- PDF PAGE 123 ---\n_______________________________________________________________________________________________121\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n TOURISM INDUSTRY BOARD FOUNDATION, INC. (TIBFI) - EXECUTIVE\n COMMITTEE\n\nMR. DANIEL L. EDRALIN\nChairman\n\nSEC. AUGUSTO BOBOY SYJUCO\nTrustee\nDirector General, TESDA\n\nMR. HUMPHREY O’LEARY\nDeputy Chairman\n\nATTY. MA. VICTORIA V. JASMIN\nTrustee\n\nMR. PAUL LIM SO\nTreasurer\n\nDR. IGNACIO S. PABLO\nExecutive Director\n\nDR. CORAZON R. RODRIGUEZ\nSecretary\n\nINDUSTRY WORKING GROUP (IWG)\n\nMR. HUMPHREY O’LEARY\nMS. ANABELLE MORENO\nCo-Chairs\nIndustry Working Committee\n\nMR. BIENVENIDO CLARAVALL\nAssessment and Certification\nSub-Committee\n\nMS. SYLVIA SANGCO\nChair, Planning Sub-Committee\n\nAdvocacy Sub-Committee\n\nMS. YAEL FERNANDEZ\nMS. SUSAN EDILO\nStandards Development Sub-Committee\n\nVIC ALCUAZ\nPlacement Sub-Committee\n\nMR. SANTOS BUENVENIDA\nENGR. EVELYN PANTIG\nProfessional and Programs Development Sub-\nCommittee\n\n--- PDF PAGE 124 ---\n_______________________________________________________________________________________________122\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nIWC - STANDARDS DEVELOPMENT SUB- COMMITTEE\n\nCOMMERCIAL COOKING\n\nMS. MA. CHRISTINA AQUINO\nLyceum of the Phils. University, Manila\n\nMR. DAVID PELAEZ\nCenter for Culinary Arts, Manila\nQuezon City\n\nCHEF ENRICO MAGTANONG\nCenter for Culinary Arts, Manila\nQuezon City\n\nCHEF OJIE RELOJ\nCenter for Culinary Arts, Manila\nQuezon City\n\nCHEF MICHAEL YAP\nCenter for Culinary Arts, Manila\nQuezon City\n\nCHEF MICK BONDOC\nCravings Restaurant\nQuezon City\n\nThe TESDA Board Members and Secretariat\n\nThe Management and Staff of the TESDA Secretariat\n\n• QSO"
