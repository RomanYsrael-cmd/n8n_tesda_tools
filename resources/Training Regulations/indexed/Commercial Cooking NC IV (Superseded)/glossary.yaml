      "term": "1. Barbecue – A cooking method involving grilling food over a wood or charcoal fire.",
      "definition": "Usually some sort of rub, marinade, or sauce is brushed on the item before or during cooking. 2. Blanch – to cook an item briefly in boiling water or hot fat before finishing or storing it. 3. Boil – a cooking method in which items are immersed in liquid at or above the boiling point (212ºF/100ºC). 4. Braise – a cooking method in which the main item, usually meat, is seared in fat, then simmered in stock to another liquid in a covered vessel. 5. Broil – a cooking method in which items are cooked by a radiant heat source placed above the food, usually in a broiler or salamander. 6. Butcher - a chef or purveyor who is responsible for butchering meats, poultry and occasionally fish. 7. Chafing dish – a metal dish with a heating unit (flame or electric) used to keep foods warm and to cook foods at tableside or during buffet service. 8. Chop – to cut into pieces of roughly the same size. Also, a small cut of meat including part of the rib 9. Combination method – a cooking method that involves the application of both moist and dry heat to the main item (for example, braising or stewing) 10. Cure – to preserve a food by salting, smoking and or drying 11. Deep fry – a cooking method in which foods are cooked by immersion in hot fat; deep-fried foods are often coated with bread crumbs or batter before being cooked 12. Dice – to cut ingredients into small cubes (1/4 inches for small, 1/3 for medium, ¾ inch for large) 13. Fillet – a boneless cut of meat, fish or poultry 14. Garnish – an edible decoration of accompaniment to a dish 15. Gratine – browned in an oven or under a salamander. Gratine can also refer to a forcemeat in which some portion of the dominant meat is sautéed and cooled before grinding. 16. Grill – a cooking technique in which foods are cooked by a radiant heat source placed below the food. Also, the piece of equipment on which grilling is done. 17. Instant reading thermometer – a thermometer used to measure the internal temperature of foods. The stem is inserted into the food, producing an instant temperature read out."
