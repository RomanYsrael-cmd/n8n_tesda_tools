    {
      "source_text": "CORE COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PREPARE FOODS ACCORDING TO DIETARY AND CULTURAL NEEDS"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512355"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit refers to the preparation and cooking of foods to meet both basic and specific dietary and cultural needs. It covers the ability to apply basic nutritional principles as well as deal with special dietary and cultural requirements normally encountered in a variety of hospitality and catering establishments."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Prepare and present foods to meet basic nutritional needs 1.1 Foods are prepared to meet basic nutritional needs. 1.2 Appropriate ingredients are selected to ensure optimum quality of end products including:"
    },
    {
      "source_text": "Raw foods"
    },
    {
      "source_text": "Convenience food products 1.3 Suitable preparation and cooking techniques are employed to retain optimum nutritional values. 1.4 A variety of nutritionally balanced food is presented in an appetizing and attractive manner. 2. Prepare and present foods to meet special dietary requirements 2.1 The requirements for special diets are identified according to instructions from relevant persons. 2.2 Essential ingredients are selected for special dietary requirements. 2.3 Food texture is modified appropriately to suit specific requirements. 2.4 Food is presented in an appetizing and attractive manner."
    },
    {
      "source_text": "-- PDF PAGE 58 --- _______________________________________________________________________________________________56 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA 3. Prepare foods to satisfy specific cultural or religious needs 3.1 Requirements for specific cultural groups or special customer requests are identified and met according to instructions from relevant persons. 3.2 Appropriate equipment cooking techniques are employed for specific diets. 3.3 Food is prepared and served taking into account specified or requested cultural and religious considerations. 3.4 An adequate range of nutritionally balanced food is presented in an appetizing and attractive manner."
    },
    {
      "source_text": "-- PDF PAGE 59 --- _______________________________________________________________________________________________57 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "This unit applies to all hospitality and catering operations where food and related services are provided such as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health establishments, defense forces, corrective services, residential catering, in-flight and other transport catering, events catering and private catering."
    },
    {
      "source_text": "Basic nutritional requirements generally refer to recommendations made in the dietary guidelines made by the Nutritionists and Dietitians Association of the Philippines endorsed by the Philippine Government and by other recognized health authorities. It includes recommendations made for the general public including senior citizens, children, adolescents, in order to maintain a healthy balanced diet."
    },
    {
      "source_text": "Special dietary and cultural requirements include therapeutic and contemporary eating regimes as well as customer requests and preferences, and specific cultural and religious needs."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 1. Relevant persons May include but not limited to: 1.1 Customers or family members 1.2 Supervisors and managers 1.3 Dieticians 1.4 Diet technicians 1.5 Health and medical personnel 1.6 Religious personnel 2. Special dietary requirements May include but not limited to: 2.1 Vegetarian 2.2 Vegan 2.3 Modified sodium/potassium 2.4 Low fat/cholesterol 2.5 Lacto-ovo 2.6 High fibre 2.7 Gluten-free 2.8 High/low energy 2.9 Diabetic 2.10 Modified texture 2.11 High/low protein 2.12 Fluids 2.13 Food exclusions for allergies and food intolerance. 2.14 Food exclusions related to specific medications. 2.15 Pork-free menu for Moslems"
    },
    {
      "source_text": "-- PDF PAGE 60 --- _______________________________________________________________________________________________58 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 3. Contemporary eating regimes May include but not limited to: 3.1 Vegetarian 3.2 Low-fat or low carbohydrate 3.3 High-protein 3.4 Macrobiotic 3.5 Liver cleansing 3.6 Elimination 4. Special cultural groups May include but not limited to: 4.1 Kosher 4.2 Halal 4.3 Vegetarian 4.4 Hindu"
    },
    {
      "source_text": "-- PDF PAGE 61 --- _______________________________________________________________________________________________59 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidences that the candidate: 1.1 Demonstrated the ability to prepare and/or modify a range of dishes to meet different of dietary requirements. 1.2 Demonstrated knowledge of the dietary requirements of major cultural groups. 1.3 Demonstrated knowledge of the consequences of failing to heed special requirements for food allergies, diabetes and other medical conditions and customer-identified drug-food interaction. 2. Underpinning knowledge 2.1 Different cultural, dietary and special requirements that may apply in different contexts, including Halal and Haram 2.2 Basic principles and practices of nutrition including:  Nutrients and their food sources.  Influences on food choice  Food and beverage selection influences  Food labeling and interpretation.  Identification of food additives and preservatives.  Health implications of food choices.  HALAL 2.3 Common dietary sensitivities including food allergies and intolerance, diabetes and other medical conditions, the existence of drug-food interactions, and the health and legal consequences of failing to heed special requirements. 2.4 Commodity knowledge of ingredients suitable for meeting basic nutritional and special dietary needs. 2.5 Logical and time efficient work flow. 3. Underpinning skills 3.1 A variety of cooking techniques. 3.2 The effects of various cooking methods and food storage on nutrients. 3.3 Cookery techniques and recipe modification to suit special dietary requirements. 3.4 Principles and practices of hygiene and legislation on food safety. 3.5 Presentation techniques for food. 4. Resource implications The following resources must be provided: 4.1 Fully-equipped operational commercial kitchen (including industry-current equipment) 4.2 Use of real ingredients and food items. 4.3 Industry-realistic ratios of kitchen staff to customers. 4.4 Preparation of dishes for customers with particular"
    },
    {
      "source_text": "-- PDF PAGE 62 --- _______________________________________________________________________________________________60 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "dietary needs within typical workplace time constraints. 5. Method of Assessment Competency may be assessed through: 5.1 Direct observation of the candidate preparing dishes for special dietary needs, cultural preferential and to meet medical needs. 5.2 Sampling of dishes prepared by the candidate. 5.3 Evaluate of the suitability of dishes prepared by the candidate. 5.4 Oral or written questions to assess knowledge of dietary constraints and consequences, resulting from cultural, preferential or medical needs. 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate. 6. Context for Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
