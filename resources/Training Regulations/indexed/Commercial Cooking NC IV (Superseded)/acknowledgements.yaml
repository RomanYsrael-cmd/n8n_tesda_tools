ry Goods (Groceries)\n5 sets\nMeasuring urn\n\nSauces\n\nSpices\n\nSeasoning\n\nCanned fruits\n\nCanned vegetables\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\nMiscellaneous\n\nDry Goods (Groceries)\n1 pc.\nIce cream\nscoop\n\nNoodles\n10 pcs.\nCheese cloth\nPasta\n12 pcs.\nServing spoon\nRice\n1 pc.\nFood mill\nFlour\n3 pcs.\nWeighing\nscale – 5 kgs.\n\nSugar\n5 pcs.\nWeighing\nscale – 1000\ngrams\n\nBeans\n\nTRAINING MATERIALS/\nRESOURCES\nManuals\nBooks\nVideo (CD)\n\nNOTE: Implementation of the training program can be made possible through a MOA between the\nTraining school and Industry for the use of the facilities. This is in response to the school\nlimitation on the high cost of equipment.\n\n--- PDF PAGE 116 ---\n_______________________________________________________________________________________________114\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq. Meters\n\nTotal Area in Sq. Meters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLaboratory\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n36 sq. m.\nTotal workshop area:\n156 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM SECTOR (HOTELS AND\nRESTAURANTS)\n\nCOMMERCIAL COOKING NCIV\n\nTRAINER'S QUALIFICATIONS (TQ IV)\n\n• Must have completed a Trainers Training Methodology Course (TM IV)\nor its equivalent\n• Must have at least 3-5 years job/industry experience\n• Must be physically and mentally fit\n• Must be a holder of Commercial Cooking NC level IV certificate or\nequivalent\n• Must be of good moral character\n• With pleasing personality\n• Must have attended relevant training and seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine\ntheir achievement of units of competency. A certificate of achievement is\nissued for each unit of competency.\n\n--- PDF PAGE 117 ---\n_______________________________________________________________________________________________115\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nSECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of COMMERCIAL COOKING NC IV,\nthe candidate must demonstrate competence in all the units of competency\nlisted in Section l. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of COMMERCIAL\nCOOKING NC IV must acquire Certificates of Competency in all the\nfollowing groups/cluster of core units of the Qualification. Candidates may\napply for assessment in any accredited assessment center.\n\n4.2.1 Plan and prepare specialty foods\n\n4.2.1.1 Prepare foods according to dietary and cultural needs\n4.2.1.2 Develop menus to meet special dietary and cultural needs\n4.2.1.3 Design menus to meet market needs\n\n4.2.2 Plan and implement a food safety program\n\n4.2.2.1 Transport and store food in a safe and hygienic manner\n4.2.2.2 Develop a food safety program\n\n4.2.3 Plan and implement a catering event\n\n4.2.3.1 Apply catering control principles\n4.2.3.2 Select catering systems\n4.2.3.3 Manage facilities associated with commercial catering\ncontracts\n4.2.3.4 Plan the catering for an event or function\n\n Successful candidates shall be awarded Certificates of Competency\n(COC).\n\n4.3\nAfter accumulation and submission of all COCs acquired for the relevant\nunits of competency comprising a qualification, an individual shall be\nissued the corresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n--- PDF PAGE 118 ---\n_______________________________________________________________________________________________116\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs.\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS)\".\n\n--- PDF PAGE 119 ---\n_______________________________________________________________________________________________117\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nCOMPETENCY MAP - TOURISM Sector\n(Hotels and Restaurants)\n COMMERCIAL COOKING NC IV\n\nANNEX A\nCollect,\nanalyze and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nUtilize\nspecialized\ncommunication\nskills\nDevelop teams\nand individuals\nApply problem-\nsolving\ntechniques in\nthe workplace\nUse\nmathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nLead small\nteams\nDevelop and\npractice\nnegotiation\nskills\nSolve\nproblems\nrelated to work\nactivities\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and safety\npractices\nLead\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nRoster staff\nControl and\norder stock\nPerform\ncomputer\noperations\nPerform\nworkplace and\nsafety practices\nProvide\neffective\ncustomer\nservice\nDevelop and\nupdate\nindustry\nknowledge\nObserve\nworkplace\nhygiene\nprocedures\n\nPrepare, cook\nand serve food\nfor menus\nPrepare\nappetizers and\nsalads\nPrepare\nsandwiches\nSelect, prepare\nand cook meat\nReceive and\nstore kitchen\nsupplies\nPrepare\nstocks, sauces\nand soups\nClean and\nmaintain\nkitchen\npremises\nOrganize and\nprepare food\nPrepare\nvegetables,\nfruits, eggs\nand starch\nproducts\n\nPresent food\nPackage\nprepared\nfoodstuffs\nPlan and\nprepare food\nfor ala carte\nand buffets\nPrepare and\ncook seafood\nPrepare hot and\ncold desserts\nPrepare\npastry, cakes,\nand yeast-\nbased\nproducts\nPrepare and\ncook poultry\nand game\nPrepare and\nportion\ncontrolled\nmeat cuts\nPlan and\ncontrol menu-\nbased catering\n\nMonitor\ncatering\nrevenue and\ncosts\nEstablish and\nmaintain\nquality control\nApply cook-\nchill-freeze\nproduction\nprocesses\nPlan, prepare\nand display ala\ncarte and buffet\nSelect, prepare\nand serve\nspecialized food\nitems\nSelect,\nprepare and\nserve specialty\ncuisines\nOrganize bulk\ncooking\noperations\nPrepare pates\nand terrines\nPrepare foods\naccording to\ndietary and\ncultural needs\n\nPlan the\ncatering for an\nevent or\nfunction\nDesign menus\nto meet market\nneeds\nDevelop a food\nsafety program\nDevelop menus\nto meet special\ndietary and\ncultural needs\nSelect catering\nsystems\nManage facilities\nassociated with\ncommercial\ncatering\ncontracts\nTransport and\nstore food in a\nsafe and hygienic\nmanner\nApply catering\ncontrol\nprinciples\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nEstablish and\nconduct\nbusiness\nrelationships\nTrain small\ngroups\nConduct\nassessment\nManage\nworkplace\ndiversity\nManage\nfinances within\na budget\nManage\nquality\ncustomer\nservice\n\n--- PDF PAGE 120 ---\n_______________________________________________________________________________________________118\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nDEFINITION OF TERMS\n\n1. Barbecue – A cooking method involving grilling food over a wood or charcoal fire.\nUsually some sort of rub, marinade, or sauce is brushed on the item before or during\ncooking.\n2. Blanch – to cook an item briefly in boiling water or hot fat before finishing or storing\nit.\n3. Boil – a cooking method in which items are immersed in liquid at or above the\nboiling point (212ºF/100ºC).\n4. Braise – a cooking method in which the main item, usually meat, is seared in fat,\nthen simmered in stock to another liquid in a covered vessel.\n5. Broil – a cooking method in which items are cooked by a radiant heat source placed\nabove the food, usually in a broiler or salamander.\n6. Butcher - a chef or purveyor who is responsible for butchering meats, poultry and\noccasionally fish.\n7. Chafing dish – a metal dish with a heating unit (flame or electric) used to keep\nfoods warm and to cook foods at tableside or during buffet service.\n8. Chop – to cut into pieces of roughly the same size. Also, a small cut of meat\nincluding part of the rib\n9. Combination method – a cooking method that involves the application of both\nmoist and dry heat to the main item (for example, braising or stewing)\n10. Cure – to preserve a food by salting, smoking and or drying\n11. Deep fry – a cooking method in which foods are cooked by immersion in hot fat;\ndeep-fried foods are often coated with bread crumbs or batter before being cooked\n12. Dice – to cut ingredients into small cubes (1/4 inches for small, 1/3 for medium, ¾\ninch for large)\n13. Fillet – a boneless cut of meat, fish or poultry\n14. Garnish – an edible decoration of accompaniment to a dish\n15. Gratine – browned in an oven or under a salamander. Gratine can also refer to a\nforcemeat in which some portion of the dominant meat is sautéed and cooled before\ngrinding.\n16. Grill – a cooking technique in which foods are cooked by a radiant heat source\nplaced below the food. Also, the piece of equipment on which grilling is done.\n17. Instant reading thermometer – a thermometer used to measure the internal\ntemperature of foods. The stem is inserted into the food, producing an instant\ntemperature read out.\n\n--- PDF PAGE 121 ---\n_______________________________________________________________________________________________119\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n18. Marinade – an apparel used in cooking to flavor and moisten foods, may be liquid or\ndry. Liquid marinades are usually based on acidic ingredients, such as wine or\nvinegar, dry marinades are usually salt-based.\n19. Microwave – a method of meat transfer in which electro-magnetic waves generated\nby a device called a magnetron penetrate food and cause the water molecules in it\nto oscillate.\n20. Mince – to chop into very small pieces\n21. Mise-en-place – “Put in place”. The preparation and assembly of ingredients, pans,\nutensils and plates or serving pieces needed for a particular dish or service period\n22. Panbroil – a cooking method similar to dry sautéing that simulates broiling by\ncooking an item in a hot pan with little or no fat.\n23. Panfry – a cooking method in which items are cooked in deep fat in a skillet over\nmedium heat; this generally involves more fat than sautéing or stir-frying but less\nthan deep-frying.\n24. Pasta – noodles made from a dough of flour (often semolina), water and/or eggs.\nThis dough is kneaded, rolled and cut or extruded, then cooked by boiling\n25. Poach – a method in which items are cooked gently in simmering liquid\n26. Pressure steamer – a machine that steams food by heating water under pressure in\na sealed compartment, allowing the team to reach higher-than-boiling temperature\n(212ºF/100ºC). The food is placed in a sealer chamber that cannot be opened until\nthe pressure has released and the steam properly vented from the chamber.\n27. Roast – a dry heat cooking method in which items are cooked in an oven or on a\nspit over a fire\n28. Sauté – a cooking method in which items are cooked quickly in a small amount of fat\nin a pan on the range top.\n29. Simmer – to main the temperature of a liquid just below boiling. Also, a cooking\nmethod in which items are cooked in a simmering liquid.\n30. Smoking – any of several methods for preserving and flavor foods by exposing\nthem to smoke. Methods include cold-smoking (in which smoked items are not fully\ncooked), hot-smoking (in which the items are cooked), and smoke-roasting.\n31. Steaming – a cooking method in which items are cooked in a vapor by boiling water\nor other liquids.\n\n32. Stew – a cooking method nearly identical to braising but generally involving smaller\npieces of meat and hence a shorter cooking time. Stewed items also may be\n\n--- PDF PAGE 122 ---\n_______________________________________________________________________________________________120\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nblanched, rather than seared, to give the finished product a pale color. Also a dish\nprepared by using the stewing method.\n33. Stir fry – a cooking method similar to sautéing in which items are cooked over high\nheat, using little fat. Usually this is done in a wok and the food is kept moving\nconstantly.\n\n--- PDF PAGE 123 ---\n_______________________________________________________________________________________________121\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n TOURISM INDUSTRY BOARD FOUNDATION, INC. (TIBFI) - EXECUTIVE\n COMMITTEE\n\nMR. DANIEL L. EDRALIN\nChairman\n\nSEC. AUGUSTO BOBOY SYJUCO\nTrustee\nDirector General, TESDA\n\nMR. HUMPHREY O’LEARY\nDeputy Chairman\n\nATTY. MA. VICTORIA V. JASMIN\nTrustee\n\nMR. PAUL LIM SO\nTreasurer\n\nDR. IGNACIO S. PABLO\nExecutive Director\n\nDR. CORAZON R. RODRIGUEZ\nSecretary\n\nINDUSTRY WORKING GROUP (IWG)\n\nMR. HUMPHREY O’LEARY\nMS. ANABELLE MORENO\nCo-Chairs\nIndustry Working Committee\n\nMR. BIENVENIDO CLARAVALL\nAssessment and Certification\nSub-Committee\n\nMS. SYLVIA SANGCO\nChair, Planning Sub-Committee\n\nAdvocacy Sub-