    {
      "source_text": "UNIT OF COMPETENCY : MANAGE FINANCES WITHIN A BUDGET UNIT CODE : TRS311212 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes"
    },
    {
      "source_text": "required to take responsibility for budget management where others may have developed the budget."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 1. Allocate budget resources 1.1 Funds are allocated according to agreed priorities. 1.2 Changes in income and expenditure priorities are discussed with appropriate colleagues prior to implementation. 1.3 All relevant personnel are consulted and informed in relation to resource decisions. 1.4 Awareness of the importance of budget control is promoted. 1.5 Detailed records of resource allocation are maintained in accordance with enterprise control systems. 2. Monitor financial activities against budget 2.1 Actual income and expenditure are checked against budgets accurately and at regular intervals. 2.2 Financial commitments are included in all documentation to ensure accurate monitoring. 2.3 Deviations are identified and reported according to company policy and significance of deviation. 2.4 Appropriate options for more effective management of deviations are investigated. 2.5 Appropriate colleagues are advised of budget status in relation to targets within agreed timeframes."
    },
    {
      "source_text": "-- PDF PAGE 48 --- _______________________________________________________________________________________________46 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 3. Identify and evaluate options for improved budget performance 3.1 Existing costs and resources are assessed and areas for improvement are identified. 3.2 Desired outcomes are discussed with relevant colleagues. 3.3 Appropriate research is conducted to investigate new approaches. 3.4 Benefits and disadvantages of new approaches are defined and clearly communicated. 3.5 Impacts on customer service levels and colleagues are considered when developing new approaches. 3.6 Recommendations are presented clearly and logically to the appropriate person/department. 4. Complete financial reports 4.1 All required financial reports are completed accurately and within designated timelines. 4.2 Clear and concise information are produced to enable informed decision-making. 4.3 Reports are promptly forwarded to the appropriate person/department."
    },
