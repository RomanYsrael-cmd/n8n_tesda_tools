    {
      "source_text": "UNIT OF COMPETENCY: DEVELOP A FOOD SAFETY PROGRAM"
    },
    {
      "source_text": "UNIT CODE : TRS512363"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit refers to the development, implementation and evaluation of a food safety program for a hospitality or catering operation where food is stored, prepared and served."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 1. Identify needs for the food safety program 1.1 Characteristics of the enterprise are evaluated, including:  Size and nature of organization  “at risk” client groups  layout  menu  production equipment  facilities  re-thermalization and service requirements 1.2 Food safety hazards or any particular issues or risk situations are identified. 1.3 Existing policies, procedures, practices and product specifications are evaluated and the need for change or enhancement is assessed. 2. Develop a food safety program for a specific commercial catering enterprise 2.1 Food safety program is designed to suit the characteristics and needs of the enterprise, in consultation with appropriate colleagues and stakeholders. 2.2 Food production flow charts are developed. 2.3 Critical control points in the food production system are identified. 2.4 Methods of control for critical points and hazards are established. 2.5 Standard operational policies and procedures to support the food safety program, including control procedures and corrective measures, are developed or modified. 2.6 Product specifications are developed or modified and recorded."
    },
    {
      "source_text": "-- PDF PAGE 97 --- _______________________________________________________________________________________________95 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 2.7 Product suppliers are identified and quality assurance specifications are established. 2.8 Compliance of the food safety program with regulatory requirements and standards is ensured. 2.9 Training needs are identified and a training plan or program is developed based on needs. 2.10 Schedule for regular review of the food safety program is developed. 3. Implement the food safety program 3.1 Food safety programs, policies and procedures are communicated to management and colleagues in the workplace. 3.2 Compliance by all colleagues to policies and procedures is ensured. 3.3 Practical and user-friendly recording system is established to document food safety performance. 3.4 Product specifications are communicated to suppliers and employees and compliance is checked. 3.5 Appropriate training and mentoring related to the food safety program is organized. 3.6 Implementation problems are promptly identified and corrective action is taken."
    },
    {
      "source_text": "-- PDF PAGE 98 --- _______________________________________________________________________________________________96 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 4. Evaluate and revise the food safety program as required 4.1 Operation and results of the food safety program are monitored according to schedule and in consultation with colleagues and other stakeholders. 4.2 Operational policies, procedures and records are reviewed and changes or additions required are identified. 4.3 Tests and/or measures to validate required safety standards are carried out. 4.4 Food safety program is revised to incorporate amendments or additions. 4.5 Records are kept to track changes to the food safety program and changes are incorporated into the production system. 4.6 Colleagues are informed of changes and of when they commence. 4.7 Need for additional training based on evaluation of the program is identified. 4.8 Display of appropriate signage and information is ensured."
    },
    {
      "source_text": "-- PDF PAGE 99 --- _______________________________________________________________________________________________97 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "The following explanations identify how this may be applied in different workplaces, sectors and circumstances."
    },
    {
      "source_text": "The food safety program systematically identifies the food safety hazards that may be reasonably expected to occur in all food handling operations. It identifies where and how each hazard can be controlled, describes how these controls are to be monitored, the corrective action required if control conditions are not met and information to be recorded. The food safety program must comply with relevant national and local government legislation and ordinances."
    },
    {
      "source_text": "The food safety plan may be a formal plan or a less-structured program. It may be developed as a stand- alone program or may be integrated with the overall quality program in a workplace."
    },
    {
      "source_text": "This unit is based around the HACCP system but may also be customized to other systems."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 1. Establishments May include: 1.1 Cafeteria/kiosks/canteens/cafes/gourmet food shops/restaurants/hotels 1.2 Fast food outlets 1.3 Educational institutions 1.4 Health establishments 1.5 Mining operations 1.6 Military forces 1.7 Corrective services/final institution 1.8 Residential catering 1.9 In-flight catering 1.10 Transport catering 1.11 Events catering 1.12 Private catering 2. Critical control points May include: 2.1 Receiving 2.2 Storing 2.3 Preparing 2.4 Processing 2.5 Displaying 2.6 Packaging 2.7 Servicing 2.8 Transporting"
    },
    {
      "source_text": "-- PDF PAGE 100 --- _______________________________________________________________________________________________98 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 3. Food safety hazards May include: 3.1 Foods highly susceptible to microbiological contamination 3.2 Working in temperatures that promote the rapid growth of micro-organisms 3.3 Display of food, buffets 3.4 Processes where food is required to be touched by hand 3.5 Requirements for re-thermalization or defrosting 4. “At risk” client groups May include: 4.1 Patients, residents and clients of health care establishments. 4.2 Children or babies 4.3 Pregnant women 4.4 Aged persons 4.5 People with immune deficiencies or allergies. 5. Standard operational procedure May include: 5.1 Food production procedures 5.2 Procedures for maintaining records 5.3 Contingency plans 5.4 Pest control 5.5 Cleaning and sanitation programs 5.6 Equipment maintenance 5.7 Employee training in hygiene and food handling 5.8 Maintenance of personal hygiene and suitable dress standards. 6. Contingency plans May include: 6.1 Food poisoning 6.2 Customer complaints 6.3 Rejected food 6.4 Equipment breakdown 6.5 Faulty equipment 6.6 Existence of pests and vermin 7. Records May include: 7.1 Temperature control data 7.2 Food production records."
    },
    {
      "source_text": "-- PDF PAGE 101 --- _______________________________________________________________________________________________99 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 8. Tests and measures to validate required safety standards May include: 8.1 Food quality reviews and tests 8.2 Bacterial swabs and counts 8.3 Chemical tests 8.4 Audit arrangements and programs 8.5 Analysis of and actions arising from critical incidents"
    },
    {
      "source_text": "-- PDF PAGE 102 --- _______________________________________________________________________________________________100 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
