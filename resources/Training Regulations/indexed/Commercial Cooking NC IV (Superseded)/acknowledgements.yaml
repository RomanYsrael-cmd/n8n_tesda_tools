      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrated the ability to develop proactive approaches to the delivery and monitoring of quality customer service within a specific tourism/hospitality context 1.2 Demonstrated knowledge of quality service principles and processes 2. Underpinning knowledge 2.1 Roles and responsibilities of management in ensuring quality service within an enterprise 2.2 The concept of total quality service and total quality management 2.3 The role of continuous improvement and benchmarking in quality assurance 2.4 Overview of the range of market research techniques used to gain information on customer preferences 2.5 Legislation that impacts on customer service standards and delivery 2.6 Industry schemes that impact on customer service standards and delivery (e.g. accreditation schemes, codes of conduct) 3. Underpinning skills 3.1 Application of total quality service and total quality management in a tourism or hospitality context 3.2 Methods of implementing quality assurance in the workplace including: 3.2.1 Establishing standards 3.2.2 Monitoring 3.2.3 Staff involvement and reward 3.2.4 Evaluation 3.3 Application of continuous improvement and/or benchmarking in a tourism or hospitality context"
