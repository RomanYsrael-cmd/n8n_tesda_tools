      "source_text": "DEFINITION OF TERMS"
    },
    {
      "source_text": "1. Barbecue – A cooking method involving grilling food over a wood or charcoal fire. Usually some sort of rub, marinade, or sauce is brushed on the item before or during cooking. 2. Blanch – to cook an item briefly in boiling water or hot fat before finishing or storing it. 3. Boil – a cooking method in which items are immersed in liquid at or above the boiling point (212ºF/100ºC). 4. Braise – a cooking method in which the main item, usually meat, is seared in fat, then simmered in stock to another liquid in a covered vessel. 5. Broil – a cooking method in which items are cooked by a radiant heat source placed above the food, usually in a broiler or salamander. 6. Butcher - a chef or purveyor who is responsible for butchering meats, poultry and occasionally fish. 7. Chafing dish – a metal dish with a heating unit (flame or electric) used to keep foods warm and to cook foods at tableside or during buffet service. 8. Chop – to cut into pieces of roughly the same size. Also, a small cut of meat including part of the rib 9. Combination method – a cooking method that involves the application of both moist and dry heat to the main item (for example, braising or stewing) 10. Cure – to preserve a food by salting, smoking and or drying 11. Deep fry – a cooking method in which foods are cooked by immersion in hot fat; deep-fried foods are often coated with bread crumbs or batter before being cooked 12. Dice – to cut ingredients into small cubes (1/4 inches for small, 1/3 for medium, ¾ inch for large) 13. Fillet – a boneless cut of meat, fish or poultry 14. Garnish – an edible decoration of accompaniment to a dish 15. Gratine – browned in an oven or under a salamander. Gratine can also refer to a forcemeat in which some portion of the dominant meat is sautéed and cooled before grinding. 16. Grill – a cooking technique in which foods are cooked by a radiant heat source placed below the food. Also, the piece of equipment on which grilling is done. 17. Instant reading thermometer – a thermometer used to measure the internal temperature of foods. The stem is inserted into the food, producing an instant temperature read out."
    },
    {
      "source_text": "-- PDF PAGE 121 --- _______________________________________________________________________________________________119 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "18. Marinade – an apparel used in cooking to flavor and moisten foods, may be liquid or dry. Liquid marinades are usually based on acidic ingredients, such as wine or vinegar, dry marinades are usually salt-based. 19. Microwave – a method of meat transfer in which electro-magnetic waves generated by a device called a magnetron penetrate food and cause the water molecules in it to oscillate. 20. Mince – to chop into very small pieces 21. Mise-en-place – “Put in place”. The preparation and assembly of ingredients, pans, utensils and plates or serving pieces needed for a particular dish or service period 22. Panbroil – a cooking method similar to dry sautéing that simulates broiling by cooking an item in a hot pan with little or no fat. 23. Panfry – a cooking method in which items are cooked in deep fat in a skillet over medium heat; this generally involves more fat than sautéing or stir-frying but less than deep-frying. 24. Pasta – noodles made from a dough of flour (often semolina), water and/or eggs. This dough is kneaded, rolled and cut or extruded, then cooked by boiling 25. Poach – a method in which items are cooked gently in simmering liquid 26. Pressure steamer – a machine that steams food by heating water under pressure in a sealed compartment, allowing the team to reach higher-than-boiling temperature (212ºF/100ºC). The food is placed in a sealer chamber that cannot be opened until the pressure has released and the steam properly vented from the chamber. 27. Roast – a dry heat cooking method in which items are cooked in an oven or on a spit over a fire 28. Sauté – a cooking method in which items are cooked quickly in a small amount of fat in a pan on the range top. 29. Simmer – to main the temperature of a liquid just below boiling. Also, a cooking method in which items are cooked in a simmering liquid. 30. Smoking – any of several methods for preserving and flavor foods by exposing them to smoke. Methods include cold-smoking (in which smoked items are not fully cooked), hot-smoking (in which the items are cooked), and smoke-roasting. 31. Steaming – a cooking method in which items are cooked in a vapor by boiling water or other liquids."
    },
    {
      "source_text": "32. Stew – a cooking method nearly identical to braising but generally involving smaller pieces of meat and hence a shorter cooking time. Stewed items also may be"
    },
    {
      "source_text": "-- PDF PAGE 122 --- _______________________________________________________________________________________________120 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "blanched, rather than seared, to give the finished product a pale color. Also a dish prepared by using the stewing method. 33. Stir fry – a cooking method similar to sautéing in which items are cooked over high heat, using little fat. Usually this is done in a wok and the food is kept moving constantly."
    },
    {
