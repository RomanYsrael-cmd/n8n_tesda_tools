ncustomer service\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Questioning\n• Observation\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare foods\naccording to\ndietary and cultural\nneeds\n1.1 Prepare and\npresent foods to\nmeet basic\nnutritional needs\n1.2 Prepare and\npresent foods to\nmeet special\ndietary\nrequirements\n1.3 Prepare foods to\nsatisfy specific\ncultural or religious\nneeds\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation\nin Laboratory\n• Oral\nQuestioning\n2. Transport and\nstore food in a\nsafe and hygienic\n2.1 Identify appropriate\nfood transportation\n2.2Transport food\n• Lecture/\n• Discussion\n• Written Test\n• Practical Test\n\n--- PDF PAGE 109 ---\n_______________________________________________________________________________________________107\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\nmanner\nsafely and\nhygienically\n2.3 Store food safely\nand hygienically\n• Demonstration\n• Hands-on\n• Video Viewing\n• Observation\nin Laboratory\n• Oral\nQuestioning\n3. Apply catering\ncontrol principles\n3.1 Identify procedures\nto reduce wastage\n3.2 Carry out catering\ncontrol procedures\n3.3 Minimize waste\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n4. Develop menus to\nmeet special\ndietary and cultural\nneeds\n4.1 Identify the dietary\nand cultural\nrequirements of\ncustomers\n4.2 Develop menus\nand meal plans to\nmeet dietary and\ncultural\nrequirements\n4.3 Evaluate meals\nand menus\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n\n5. Select catering\nsystems\n\n5.1 Review catering\nsystem\nrequirements\n5.2 Evaluate and\nselect the catering\nsystem\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n6. Manage facilities\nassociated with\ncommercial\ncatering contracts\n6.1 Organize\nmaintenance of\nfacilities\n6.2 Manage catering\nstores and storage\nareas\n6.3 Maintain a facilities\nassets register\n6.4 Manage client\nservices\nassociated with the\nfacility\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n7. Plan the catering\nfor an event or\nfunction\n7.1 Identify overall\nevent objectives\nand scope\n• Lecture/\n• Discussion\n• Written Test\n• Practical Test\n\n--- PDF PAGE 110 ---\n_______________________________________________________________________________________________108\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7.2 Prepare the\ncatering concept\nfor an event or\nfunction\n7.3 Prepare and\nimplement an\noperational plan for\nthe catering of an\nevent or function\n• Demonstration\n• Hands-on\n• Video Viewing\n• Observation\nin Laboratory\n• Oral\nQuestioning\n8. Design menus to\nmeet market\nneeds\n8.1 Identify and\nevaluate target\nmarkets for the\ncatering outlet\n8.2 Evaluate market\ntrends in food\nservice\n8.3 Create menu\nbased on market\nanalysis and within\nbudgetary\nconstraints\n8.4 Monitor menu\nperformance\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n9. Develop a food\nsafety program\n9.1 Identify needs for\nthe food safety\nprogram\n9.2 Develop a food\nsafety program for\na specific\ncommercial\ncatering enterprise\n9.3 Implement the food\nsafety program\n9.4 Evaluate and\nrevise the food\nsafety program as\nrequired\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n\n--- PDF PAGE 111 ---\n_______________________________________________________________________________________________109\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should follow to the design of the\ncurriculum. Delivery should be guided by the 10 basic principles of\ncompetency-based TVET.\n\n• The training is based on curriculum developed from the\n competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\n standards and the curriculum modules;\n• Assessment is based on the collection of evidence of the\n performance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\n competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n•\nThe\ndualized\nmode\nof\ntraining\ndelivery\nis\npreferred\nand\nrecommended, thus, programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and Regulations\n•\nModular/self-paced learning is a competency-based training modality\nwhere the trainee is allowed to progress at his own pace. The trainer\nonly facilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners\n•\nSupervised industry training or on-the-job training is a training\napproach designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations\n•\nDistance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video or computer technologies\n\n--- PDF PAGE 112 ---\n_______________________________________________________________________________________________110\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n 3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate both orally and in written form;\n• physically and mentally fit;\n• with good moral character;\n• can perform basic mathematical computation;\n• must be competent in the entire Commercial Cooking NC III\nqualification either through training, experience or certification\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 113 ---\n_______________________________________________________________________________________________111\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n3.4 LIST OF TOOLS AND EQUIPMENT\n COMMERCIAL COOKING – NC IV\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for COMMERCIAL COOKING NC IV are as follows:\n\nTOOLS\nEQUIPMENT\nCOOKING