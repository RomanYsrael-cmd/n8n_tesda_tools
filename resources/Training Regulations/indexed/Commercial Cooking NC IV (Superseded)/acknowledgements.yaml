      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512356"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit refers to the transportation of food from a food preparation area to another location. It also deals with holding or storage on its arrival. Transportation refers to the moving of food and food items from one location to another. For example, transporting food from a kitchen to a school or hospital or providing event catering. It does not refer to the transport of food from the kitchen to the dining room or as part of room service."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Identify appropriate food transportation 1.1 Suitable food transportation vehicles are selected according to establishment requirements. 2. Transport food safely and hygienically 2.1 Food is packaged, loaded and unloaded appropriately."
    },
    {
      "source_text": "2.2 Hygienic work practices are employed and occupational health and safety regulations are observed."
    },
    {
      "source_text": "2.3 Food transportation records are maintained appropriately and accurately. 3. Store food safely and hygienically 3.1 Food storage conditions are selected appropriately for specific food type including:"
    },
    {
      "source_text": "Dairy"
    },
    {
      "source_text": "Meat and fish"
    },
    {
      "source_text": "Fruit and vegetables"
    },
    {
      "source_text": "Dried goods"
    },
    {
      "source_text": "-- PDF PAGE 64 --- _______________________________________________________________________________________________62 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "3.2 Appropriate environmental conditions are maintained for specific food types to ensure freshness, quality and appearance. 3.3 Appropriate storage and holding methods are employed to optimize nutritional quality. 3.4 Hygienic work practices are employed and occupational health and safety procedures and practices are observed. 3.5 Storage areas are kept free from contaminants and pests."
    },
    {
      "source_text": "-- PDF PAGE 65 --- _______________________________________________________________________________________________63 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "This unit applies to all hospitality and catering operations where food and related services are provided such as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health establishments, defense forces, corrective services, residential catering, in-flight and other transport catering, events catering and private catering."
    },
    {
      "source_text": "The type of transport used will vary according to the enterprise needs and the type of food being transported."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 1. Types of transport May include but not limited to: 1.1 Vans 1.2 Cars 1.3 Refrigerated trucks 1.4 Trolleys, carts and push carts 2. National regulations guidelines May include but not limited to: 2.1 Temperature 2.2 Lining 2.3 Sealing 3. Environmental conditions May include but not limited to: 3.1 Temperature 3.2 Humidity 3.3 Exposure to light 3.4 Exposure to weather"
    },
    {
      "source_text": "-- PDF PAGE 66 --- _______________________________________________________________________________________________64 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrated safe transport and storage of food items within food safety requirements and regulations. 1.2 Demonstrated transport of a range of food item types. 2. Underpinning knowledge 2.1 The hygiene and OH&S requirements for food storage and transport. 2.2 Advantages and disadvantages of different forms of transport for particular food items, quantities and circumstances. 2.3 Characteristics of different food items and conditions required to maintain optimum freshness, palatability and safety. 2.4 HACCP principles applied to catering. 3. Underpinning skills 3.1 Safe work practices in particular to loading and unloading, lifting and dealing with heated surfaces. 3.2 Safe storage principles and practices for different food types, including storage options. 4. Resource implications The following resources must be provided: 4.1 Use of real food items to be transported 4.2 Relevant transportation and storage equipment to move food between locations. 5. Method of Assessment Competency may be assessed through: 5.1 Direct observation of the candidate of transporting and storing food items. 5.2 Inspection of food transported and stored by the candidate. 5.3 Problem solving and case studies to address various conditions which apply to the transport and storage of different food items. 5.4 Written or oral questions to test knowledge of hygiene issues related to transport and storage. 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate. 6. Context for Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center."
    },
    {
      "source_text": "-- PDF PAGE 67 --- _______________________________________________________________________________________________65 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "UNIT OF COMPETENCY : APPLY CATERING CONTROL PRINCIPLES"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512357"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the application of catering control principles to the ordering, receiving, storage and processing of food to minimize wastage."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Identify procedures to reduce wastage 1.1 Appropriate procedures for reducing wastage during ordering, receiving, storage and processing of food are identified. 1.2 Appropriate control measures are identified to reduce loss. 2. Carry out catering control procedures"
    },
    {
      "source_text": "2.1 Portion control is carried out effectively. 2.2 Calibrated equipment are used correctly to ensure correct portion control. 2.3 Recipes are accurately followed to avoid wastage. 2.4 Suitable quantities of stock are ordered to avoid over or under ordering. 2.5 Stock are rotated and documented accurately. 2.6 Food is stored correctly and securely to minimize wastage and loss. 3. Minimize waste 3.1 Re-usable products of food preparation and cooking are utilized effectively. 3.2 Recyclable products are utilized and disposed in an environmentally appropriate way. 3.3 Non-recyclable products are disposed of according to health and safety requirements, relevant regulations and in environmentally appropriate way."
    },
    {
      "source_text": "-- PDF PAGE 68 --- _______________________________________________________________________________________________66 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "This unit applies to all hospitality and catering operations where food and related services are provided such as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health establishments, defense forces, corrective services, residential catering, in-flight and other transport catering, events catering and private catering."
    },
    {
      "source_text": "Catering control procedures are the processes and procedures implemented at the operational level that result in the control of costs, energy usage, materials and time."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 1. Procedures for reducing wastage May include but not limited to: 1.1 Portion control 1.2 Ordering to specifications 1.3 Stock rotation 1.4 Using appropriate equipments 1.5 Appropriate storage 1.6 Using standard recipe cards 2. Re-usable products May include but not limited to: 2.1 Meat and fish off-cuts 2.2 Bones and trimmings 2.3 Vegetable peelings and off-cuts 3. Recyclable products May include but not limited to: 3.1 Glass bottles and jars 3.2 Plastics 3.3 Paper and cardboard 3.4 Tin or aluminum containers. 3.5 Vegetable matter"
    },
    {
      "source_text": "-- PDF PAGE 69 --- _______________________________________________________________________________________________67 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidences that the candidate: 1.1 Demonstrated the ability to use portion control, stock control and other waste reduction measures effectively. 1.2 Demonstrated the ability to minimize wastage and to manage waste productively, including re-cycling systems. 1.3 Demonstrated the ability to conform with the establishments menu standards. 2. Underpinning knowledge 2.1 Links between hygiene and food safety and waste minimization. 2.2 Preparation and cooking procedures that assist in minimizing waste. 3. Underpinning skills 3.1 Stock control procedures that assist in minimizing waste. 3.2 Storage procedures that assist in minimizing waste. 4. Resource implications The following resources must be provided: 4.1 Fully-equipped commercial kitchen using real ingredients and food items. 4.2 Production of portion-controlled menu items. 5. Method of Assessment Competency may be assessed through: 5.1 Evaluation of amount of products used by the candidate across a period of operation. 5.2 Review of reports prepared by the candidate detailing ways in which waste were minimized during a service period. 5.3 Written or oral questions to test knowledge of waste minimization and control systems. 5.4 Review of stock control and portion control documentation prepared by the candidate. 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate. 6. Context for Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
    {
      "source_text": "-- PDF PAGE 70 --- _______________________________________________________________________________________________68 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "UNIT OF COMPETENCY : DEVELOP MENUS TO MEET SPECIAL"
    },
    {
      "source_text": "DIETARY AND CULTURAL NEEDS"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512358"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit refers to the development of menus and meal plans, including meeting specific dietary and cultural needs of different target markets."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Identify the dietary and cultural requirements of customers 1.1 Dietary and cultural requirements of different target groups are identified through consideration of all appropriate factors. 1.2 Contemporary dietary trends and regimes are taken into consideration in assessing dietary requirements. 1.3 Dietitians, medical specialists, or other relevant personnel are liaised with in order to identify and confirm requirements. 2. Develop menus and meal plans to meet dietary and cultural requirements. 2.1 A variety of suitable foods, meals and menus are selected for specific dietary requirements taking account of Dietary Guidelines and menu planning principles. 2.2 Meal plans and menus that promote good health and reduce the incidence of diet-related health problems are developed in consultation with relevant personnel, according to job role. 2.3 Cyclic menus are prepared when required and they are balanced in terms of nutritional requirements and variety. 2.4 Food preparation and cooking methods are recommended to maximize nutritional value of food. 2.5 Appropriate combinations of food are identified to meet macro and micro nutrient"
    },
    {
      "source_text": "-- PDF PAGE 71 --- _______________________________________________________________________________________________69 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA requirements."
    },
    {
      "source_text": "2.6 Special needs are taken into consideration including texture, composition and portion size. 2.7 Sufficient choices of dishes are incorporated into the menus. 2.8 Menus are costed to comply with costing constraints. 2.9 Correct terminology is used in menus and meal plans. 3. Evaluate meals and menus 3.1 Meals and menus are evaluated using appropriate methods to ensure customer satisfaction based on the enterprise’s menu standard. 3.2 Menus are adjusted as required to ensure dietary needs and goals are met."
    },
    {
      "source_text": "-- PDF PAGE 72 --- _______________________________________________________________________________________________70 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "This unit applies to all hospitality and catering operations where food and related services are provided such as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health establishments, defense forces, corrective services, residential catering, in- flight and other transport catering, events catering and private catering."
    },
    {
      "source_text": "Evidence is required of knowledge and understanding of a range of different cultural, dietary and special requirements. However, the focus of this range will vary according to the target markets of a particular workplace. Special dietary needs include therapeutic and contemporary regimes as well as customer requests."
    },
    {
      "source_text": "A variety of menus and meal plans must be developed to meet differing requirements. They may be developed to address the requirements of individuals or larger target audiences."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 1. Dietary and cultural needs of target groups May include but not limited to: 1.1 Age requirements 1.2 Lifestyle 1.3 Food preferences 1.4 Food restrictions or allergies 1.5 Physical condition 1.6 Nutritional requirements 1.7 Those with varying nutritional and energy requirements due to physical condition 1.8 Cultural or religious needs 1.9 Meal – breakfast, lunch, dinner 1.10 Occasion 2. Target groups refers to all sectors of the population May include but not limited to: 2.1 Infants 2.2 Children 2.3 Adolescents 2.4 Athletes 2.5The aged 3. Special cultural groups May include but not limited to: 3.1 Halal 3.2 Vegetarian 3.3 Hindu 4. Contemporary diet regimes May include but not limited to: 4.1 Vegetarian 4.2 Low-fat, low carbohydrate or low kilojoule 4.3Macrobiotic"
    },
    {
      "source_text": "-- PDF PAGE 73 --- _______________________________________________________________________________________________71 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 5. Menus and meal plans May include but not limited to: 5.1 Daily meal plans 5.2 Daily or weekly menus 5.3 Cyclic menus 6. Special dietary requirements May include but not limited to: 6.1 Vegetarian 6.2 Vegan 6.3 Modified sodium/potassium 6.4 Low fat/cholesterol 6.5 Lacto-ovo 6.6 High fiber 6.7 Gluten fee 6.8 High/low energy 6.9 Diabetic 6.10 Modified texture 6.11 High/low protein 6.12 Non-pork meals 6.13 Fluids 6.14 Exclusions for allergies and food intolerance 7. Methods used to evaluate diets and meal plans and analyze foods May include but not limited to: 7.1 Computer programs 7.2 Customer feedback questionnaires 7.3 Interviews with customer and health support personnel 7.4Nutrition guides"
    },
    {
      "source_text": "-- PDF PAGE 74 --- _______________________________________________________________________________________________72 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidences that the candidate: 1.1 Demonstrated the ability to prepare menus and meal plans to meet different dietary and cultural needs. 1.2 Demonstrated knowledge of commodities required to meet particular dietary and cultural needs. 1.3 Demonstrated knowledge of the consequences of failing to heed special dietary requirements. 2. Underpinning knowledge 2.1 Basic principles and practices of nutrition, including:  Nutrients and their food sources  Influences on food choice  Food labeling requirements and interpretation  Food additives and preservatives  Health implications of food choices. 2.2 Dietary sensitivities including food allergies and intolerance, diabetes and other medical conditions and the existence of drug-free interactions, and the health and legal consequences of failing to heed special requirements. 2.3 Commodity knowledge of ingredients suitable for meeting basic nutritional and special dietary needs. 2.4 The effects of various cooking methods and food storage on nutrients. 3. Underpinning skills 3.1 Cookery techniques and recipe modification to suit special dietary requirements. 4. Resource implications The following resources must be provided: 4.1 Project or work activities that allow the candidate to develop menus to meet multiple and differing and cultural needs. 5. Method of Assessment Competency may be assessed through: 5.1 Evaluation of menus and meal plans prepared by candidate involving a variety of target markets and purposes. 5.2 Case studies to assess ability to develop menus and meal plans for different target groups and circumstances. 5.3 Written or oral questions to test knowledge of nutrition, cultural and dietary requirements. 5.4 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate."
    },
    {
      "source_text": "-- PDF PAGE 75 --- _______________________________________________________________________________________________73 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "6. Context for Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
    {
      "source_text": "-- PDF PAGE 76 --- _______________________________________________________________________________________________74 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "UNIT OF COMPETENCY : SELECT CATERING SYSTEMS"
    },
    {
      "source_text": "(MICROS, IFCA AND OTHERS)"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512359"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit deals with the evaluation and selection of catering systems, including cook chill systems, to meet the food production needs of a catering enterprise. It focuses on the planning and evaluation processes undertaken by supervisors and managers prior to the purchase of a system."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Review catering system requirements"
    },
    {
      "source_text": "1.1 Catering systems requirements are reviewed taking into account all relevant factors including:  Type of menu and nutritional requirements  Production volume  Location of service points  Holding requirements  F & B cost control 1.2 Constraints are identified including the availability of:  Facilities and equipment  Operational issues  Financial resources  Human resources (current skills and training needs) 2. Evaluate and select the catering system 2.1 Food production characteristics of systems are evaluated against identified requirements. 2.2 System processes and equipment is evaluated for all stages of the food production process. 2.3 Staffing requirement for specific systems is evaluated and matched with identified requirements. 2.4 Installation requirements for the specific"
    },
    {
      "source_text": "-- PDF PAGE 77 --- _______________________________________________________________________________________________75 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA systems and their operational impacts are evaluated. 2.5 The production and organizational changes required to introduce particular systems are taken into account. 2.6 Advantages and disadvantages of different systems are considered and selections are made accordingly."
    },
    {
      "source_text": "-- PDF PAGE 78 --- _______________________________________________________________________________________________76 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "This unit applies to all hospitality and catering operations where food and related services are provided such as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health establishments, defense forces, corrective services, residential catering, in-flight and other transport catering, events catering and private catering."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 1. Catering systems May include but not limited to: 1.1 Cook fresh 1.2 Cook chill – 5 day life 1.3 Cook chill – extended life 1.4 Cook freeze 2. Stages of the food production process May include but not limited to: 2.1 Receiving 2.2 Storing 2.3 Preparation 2.4 Preparation/cooking 2.5 Post-cooking storage 2.6 Re-thermalization where applicable 2.7 Serving"
    },
    {
      "source_text": "-- PDF PAGE 79 --- _______________________________________________________________________________________________77 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidences that the candidate: 1.1 Demonstrated the ability to assess and select catering systems for specific catering operations. 1.2 Demonstrated the ability to determine enterprise needs and constraints in selecting a system. 2. Underpinning knowledge 2.1 Types of catering systems and their operating features including:  Fresh cook  Cook chill – 5 day life  Cook chill – extended life  Cook freeze 2.2 Knowledge and understanding of the nutrition principles which relate to each system. 2.3 Knowledge of requirements, regulations and legislation that impact on different systems including occupational health and safety, hygiene codes, HACCP and storage issues. 2.4 Knowledge on F & B cost control. 3. Underpinning skills 3.1 Principles and methods of cookery, including preparation and cookery techniques for all major food groups. 4. Resource implications The following resources must be provided: 4.1 Project or work activities that allow the candidate to select system for specific workplace situations and needs. 5. Method of Assessment Competency may be assessed through: 5.1 Case studies to assess ability to select appropriate catering systems for a particular enterprise or context. 5.2 Project to select an appropriate catering system for an enterprise including research, costing, evaluation and recommendations. 5.3 Evaluation of reports prepared by the candidate detailing the processes and challenges involved in the selection of a catering system. 5.4 Written or oral questions to test knowledge of advantages and limitation of various catering systems. 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate."
    },
    {
      "source_text": "-- PDF PAGE 80 --- _______________________________________________________________________________________________78 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "6. Context for Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
    {
      "source_text": "-- PDF PAGE 81 --- _______________________________________________________________________________________________79 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "UNIT OF COMPETENCY : MANAGE FACILITIES ASSOCIATED WITH"
    },
    {
      "source_text": "COMMERCIAL CATERING CONTRACTS"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512360"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit deals with the management of small- scale facilities associated with commercial catering contracts. It reflects a situation where a caterer may hold a contract to operate a catering outlet within a venue owned by another organization (eg. within a school or sporting club)."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Organize maintenance of facilities 1.1 Scope of maintenance requirements is identified in accordance with contract or scope of operations. 1.2 Responsibility for specific maintenance functions is allocated considering the advantages and disadvantages of in-house staff and external contractors. 1.3 Regular maintenance of facilities is organized on time to meet specific requirements and to meet budgetary targets. 2. Manage catering stores and storage areas 2.1 Stocks are purchased, received, stored and transferred according to contracted requirements and negotiated supplier agreements. 2.2 Storage, stock control and distribution systems are organized for the specific facility in accordance with contracted requirements, OH&S and health department regulations. 2.3 Accurate records and reports are maintained according to enterprise policy and procedures."
    },
    {
      "source_text": "-- PDF PAGE 82 --- _______________________________________________________________________________________________80 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA 3. Maintain a facilities assets register 3.1 All assets are identified and registered clearly. 3.2 Routine audits of assets are conducted. 3.3 Asset and inventory reports are issued according to enterprise practices. 4. Manage client services associated with the facility 4.1 Stakeholders are liaised with to determined general and specific requirements for client service. 4.2 Exiting client services across all areas of operation are monitored to identify areas for improvement. 4.3 Temporary or permanent upgrades or modifications of existing services and facilities are arranged as required and in accordance with appropriate regulations. 4.4 Additional human, physical or financial resources are organized in accordance with customer requirements. 4.5 Provisions of new services or facilities are arranged when required. 4.6 Budgeting targets are maintained in the management of client services. 4.7 Feedback on catering service is reviewed and provision of client service is modified accordingly."
    },
    {
      "source_text": "-- PDF PAGE 83 --- _______________________________________________________________________________________________81 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "This unit applies to all hospitality and catering operations where food and related services are provided such as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health establishments, defense forces, corrective services, residential catering, in-flight and other transport catering, events catering and private catering."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 1. Maintenance May include but not limited to: 1.1 Gardening 1.2 Cleaning 1.3 Building and repairs 1.4 Laundry 1.5 Plumbing and electrical 2. Stock control procedures May include but not limited to: 2.1 Stocktaking and reconciliation 2.2 Stock rotation 2.3 Authorizing access 2.4 Issuing and requisition systems 2.5 Receiving control 2.6 Locks and other security systems 2.7 Inventory of items to be brought on-site 3. Stakeholders May include but not limited to: 3.1 The venue owner 3.2 Staff 3.3 Customers 4. Areas of operation to be monitored May include but not limited to: 4.1 Quality of service 4.2 Quality of catering 4.3 Adequacy of staffing levels 4.4 Costs of operations 4.5 Hours of operation 4.6 Appropriate integration of the facility within th overall venue and associated operational issues 4.7 Appropriateness of location"
    },
    {
      "source_text": "-- PDF PAGE 84 --- _______________________________________________________________________________________________82 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 6. Upgrades or modifications of new or existing services May include but not limited to: 5.1 Additional capacity 5.2 Amended or expanded menus 5.3 Expansion of facility 5.4 Adjusted staffing arrangements"
    },
    {
      "source_text": "-- PDF PAGE 85 --- _______________________________________________________________________________________________83 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidences that the candidate: 1.1 Demonstrated the ability to manage the operation of a commercial catering facility in accordance with contractual agreements, including maintenance, storage and client service. 1.2 Demonstrated knowledge of the key factors that impact on the management of commercial catering facilities. 2. Underpinning knowledge 2.1 Types of arrangements between venues and catering contractors including scope of typical contracts and services. 2.2 Procedures for developing and maintaining an assets register. 3. Underpinning"
    },
    {
      "source_text": "skills 3.1 Stock control systems and procedures found in commercial catering facilities. 3.2 Analytical and planning skills for evaluation of existing operations and planning of adjustments. 3.3 Financial control processes in the context of catering operations. 4. Resource"
    },
    {
      "source_text": "implications The following resources must be provided: 4.1 Fully-equipped operational commercial catering outlet. 4.2 Project or work activities conducted over a period of time to allow the candidate to demonstrate the implementation and monitoring aspects of the unit. 5. Method of Assessment Competency may be assessed through: 5.1 Evaluation of projects undertaken by the candidate to establish and monitor a small-scale catering outlet (e.g. for an event) 5.2 Evaluation of reports prepared by the candidate detailing processes and systems used to manage a catering facility. 5.3 Case studies to assess ability to establish systems for different style of catering facilities. 5.4 Written or oral questions to test knowledge of advantages and limitations of asset management systems. 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate. 6. Context for Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
    {
      "source_text": "-- PDF PAGE 86 --- _______________________________________________________________________________________________84 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PLAN THE CATERING FOR AN EVENT OR"
    },
    {
      "source_text": "FUNCTION"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512361"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit deals with the skills and knowledge required to plan the catering of an event or function. While catering is the major focus of this unit, it also refers to additional services which may be offered by a caterer such as those related to décor and theme. However, the unit does not cover the broader event management skills required for a major event which are covered in other specialist event management units within the Tourism Training Packages."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Identify overall event objectives and scope 1.1 Key objectives of the event are clarified and agreed upon in consultation with stakeholder. 1.2 Key information is analyzed and consulted with stakeholders to determined the broad scope of the event including indicators for:  Size and numbers of guests/delegates  Location (s)  Time and duration  Budget  Dietary restrictions  Guests profile 1.3 Factors which may impact on the event catering,are identified and analyzed. 2. Prepare the catering concept for an event or function 2.1 Ideas to the overall event concept, theme and format are contributed according to scope of responsibility. 2.2 The key elements for catering are identified and defined in consultation with stakeholders"
    },
    {
      "source_text": "-- PDF PAGE 87 --- _______________________________________________________________________________________________85 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA to reflect the objectives and meet the needs of customers. 2.3 Creative elements are incorporated into catering concept and theme. 2.4 Operational practicality and cohesiveness of the catering concept, theme and format are verified through consultation and analysis. 3. Prepare and implement an operational plan for the catering of an event or function 3.1 Operational plan for the provision of catering and ancillary services is prepared identifying steps, activities and sequence. 3.2 Appropriate risk management is incorporated into the plan. 3.3 Details are reviewed, verified and finalized with the client. 3.4 Accurate and complete information on the catering concept and operational plans is provided to all relevant stakeholders to ensure timely and effective planning and implementation. 3.5 Approval from relevant stakeholders is obtained prior to implementation. 3.6 Banquet event order / contract is disseminated to different departments needing coordination. 3.7 The catering plan for the event is implemented and monitored making adjustments as required. 3.8 Feedback is obtained after the event and plans are reviewed to evaluate the degree to which it met objectives and customer requirements."
    },
    {
      "source_text": "-- PDF PAGE 88 --- _______________________________________________________________________________________________86 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "This unit applies to all catering operations where event catering is provided."
    },
    {
      "source_text": "Events and functions may be in a central location or across a range of smaller locations indoors or outdoors."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE 1. Events and functions May include but not limited to: 1.1 Sporting events. 1.2 Defense operations 1.3 Show, exhibitions 1.4 Product launches 1.5 Trade shows 1.6 Conferences 1.7 Meetings or seminars 1.8 Training events 1.9 Social celebrations 1.10 Awards night 1.11 Christmas parties 1.12 Thanksgiving/victory parties 1.13 Seminars 2. Key information May include but not limited to: 2.1 Purpose 2.2 Concept 2.3 Style and theme 2.4 Date, time and venue 2.5 Catering requirements 2.6 Audience or market 2.7 Overall budget estimate 3. Stakeholders May include but not limited to: 3.1 Event customer 3.2 Suppliers and contractors 3.3 Local community 3.4 Organizing committees 3.5 Local authorities 3.6 Colleagues 3.7 Entertainers 4. Key elements for catering May include but not limited to: 4.1 Type of food 4.2 Style of service 4.3 Timing of service 4.4 Link between food and other aspects of the"
    },
    {
      "source_text": "-- PDF PAGE 89 --- _______________________________________________________________________________________________87 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE event (eg. speeches) 4.5 Production and transport issues 4.6 Catering staff requirements 4.7 Liaison with others involved in the event. 4.8 Seating arrangements 5. Ancillary services May include but not limited to: 5.1 Theme and décor 5.2 Management of the event 5.3 Staffing 5.4 Logistics 6. Operational plan May include: 6.1 Costing of components and total catering 6.2 Management 6.3 Staffing and contracting 6.4 Roles and responsibilities 6.5 Logistics and transport details 6.6 Resources eg. venue, commodities, equipment, machinery, vehicles and staff 6.7 Security arrangements 6.8 Purchasing of food, materials and equipment 6.9 Production and distribution of food and beverage."
    },
    {
      "source_text": "-- PDF PAGE 90 --- _______________________________________________________________________________________________88 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidences that the candidate: 1.1 Demonstrated the ability to plan catering which reflects event objectives, is operationally practical and which results in the achievement of objectives. 1.2 Demonstrated knowledge of the creative options to be considered when developing for catering for an event. 1.3 Demonstrated knowledge of issues and challenges associated with event catering. 2. Underpinning knowledge 2.1 Knowledge of the different catering options and styles for different types, different types of customer and varying numbers. 2.2 Space and equipment requirements for different styles of catering and varying numbers. 2.3 Staffing requirements for particular types of catering. 2.4 Knowledge of typical formats and running orders for different styles of events. 2.5 Knowledge of what each department should do. 2.6 Customer service. 2.7 Knowledge on working proposals, quotations and contracts. 2.8 Knowledge on the servicewares to be used. 3. Underpinning"
    },
    {
      "source_text": "skills 3.1 Operational constraints for catering within different styles of venue. 3.2 Operational constraints for catering in different climatic conditions. 3.3 Principles and practices of food safety for preparation, storage and transport of food. 4. Resource"
    },
    {
      "source_text": "Implications The following resources must be provided: 4.1 Project or work activities conducted over a period of time that allow the candidate to plan and organize event catering, and then to monitor the actual catering service at the event or function. 4.2 Access to and interaction with event industry suppliers. 4.3 Involvement of and interaction with an event principal or organizing group. 5. Method of"
    },
    {
      "source_text": "Assessment Competency may be assessed through: 5.1 Evaluation of the catering at an event where catering is coordinated by the candidate. 5.2 Case studies to assess ability to develop catering concepts and plans for different types of event."
    },
    {
      "source_text": "-- PDF PAGE 91 --- _______________________________________________________________________________________________89 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "5.3 Evaluation of reports prepared by the candidate detailing the planning processes undertaken for an event and highlighting particular challenges and issues. 5.4 Written or oral questions to elicit further explanations on various aspects of planning. 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate. 6. Context for Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
    {
      "source_text": "-- PDF PAGE 92 --- _______________________________________________________________________________________________90 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "UNIT OF COMPETENCY : DESIGN MENUS TO MEET MARKET NEEDS"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512362"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit deals with the skills and knowledge to use menu planning as a marketing and management tool. It is an extension of skills identified in the unit Plan and control menu- based catering."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Identify and evaluate target markets for the catering outlet 1.1 Target markets for the enterprise are identified based on past and current operations and performance. 1.2 Potential target markets are identified based on review of the current market place and the nature and style of the operation. 1.3 Preference of key markets are evaluated and matched with overall enterprise products and services. 2. Evaluate market trends in food service 2.1 Information sources on market trends in food service are identified and accessed. 2.2 Market trends are evaluated for relevance to the enterprise current and potential markets. 3. Create menu based on market analysis and within budgetary constraints 3.1 Relevant market trends are incorporated into food service and menu planning. 3.2 Menus are developed taking into account enterprise operational constraints or limitations. 3.3 Menus are constructed to meet profitability targets. 3.4 Menus are developed taking into account the dietary instructions of the markets. 4. Monitor menu performance 4.1 Customer satisfaction with menus is monitored based on demand patterns and in consultation with customers and operational staff. 4.2 Menu items are analyzed in terms of sales and profit performance. 4.3 Menus are adjusted based on feedback and profitability."
    },
