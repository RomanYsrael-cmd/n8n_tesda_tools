    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional assessment is undertaken by trainees to determine their achievement of units of competency. A certificate of achievement is issued for each unit of competency."
    },
    {
      "source_text": "-- PDF PAGE 117 --- _______________________________________________________________________________________________115 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 To attain the National Qualification of COMMERCIAL COOKING NC IV, the candidate must demonstrate competence in all the units of competency listed in Section l. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 Individuals aspiring to be awarded the qualification of COMMERCIAL COOKING NC IV must acquire Certificates of Competency in all the following groups/cluster of core units of the Qualification. Candidates may apply for assessment in any accredited assessment center."
    },
    {
      "source_text": "4.2.1 Plan and prepare specialty foods"
    },
    {
      "source_text": "4.2.1.1 Prepare foods according to dietary and cultural needs 4.2.1.2 Develop menus to meet special dietary and cultural needs 4.2.1.3 Design menus to meet market needs"
    },
    {
      "source_text": "4.2.2 Plan and implement a food safety program"
    },
    {
      "source_text": "4.2.2.1 Transport and store food in a safe and hygienic manner 4.2.2.2 Develop a food safety program"
    },
    {
      "source_text": "4.2.3 Plan and implement a catering event"
    },
    {
      "source_text": "4.2.3.1 Apply catering control principles 4.2.3.2 Select catering systems 4.2.3.3 Manage facilities associated with commercial catering contracts 4.2.3.4 Plan the catering for an event or function"
    },
    {
      "source_text": "Successful candidates shall be awarded Certificates of Competency (COC)."
    },
    {
      "source_text": "4.3 After accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate."
    },
    {
      "source_text": "4.4 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "-- PDF PAGE 118 --- _______________________________________________________________________________________________116 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "4.5 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.5.1 Graduates of formal, non-formal and informal including enterprise-based training programs."
    },
    {
      "source_text": "4.5.2 Experienced Workers (wage employed or self-employed)"
    },
    {
      "source_text": "4.6 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)\"."
    },
