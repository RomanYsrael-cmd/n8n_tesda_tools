      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidences that the candidate: 1.1 Demonstrated ability to implement and maintain food safety standards and program to enterprise standards and in line with legislative requirements. 1.2 Demonstrated involvement and interaction with a kitchen team. 2. Underpinning Knowledge 2.1 Principles and methods of food production. 2.2 HACCP based concepts that support food safety program design. 2.3 Options for the structure, development and implementation of a food safety program, including HACCP. 2.4 Hygiene and food safety legislation and regulations in relation to food safety program requirements. 2.5 Local health regulations pertaining to food production and packaging. 2.6 Conditions for development of microbiological contamination and control methods. 2.7 Potential staff training needs in relation to food safety. 3. Underpinning Skills 3.1 Policies and practices of personal hygiene and food handling. 3.2 Planning and consultative processes which could be used in program development. 3.3 Food safety recording requirements and options. 4. Resource"
    },
    {
      "source_text": "Implications The following resources MUST be provided: 4.1 Project or work activities conducted over a period of time and which allow the candidate to establish and monitor a food safety program for a particular cookery or catering workplace. 4.2 Involvement and interaction with a kitchen team."
    },
    {
      "source_text": "-- PDF PAGE 103 --- _______________________________________________________________________________________________101 TR - COMMERCIAL COOKING NC IV Promulgated April 2007"
    },
    {
      "source_text": "5. Method of Assessment Competency may be assessed through: 5.1 Review of documentation related to food safety systems, including policies and procedures, audit summaries and reports developed by the candidate. 5.2 Case studies to assess ability to develop systems to meet differing workplace needs. 5.3 Activities conducted in conjunction with industry to allow the candidate to develop systems for a real workplace. 5.4 Written or oral questions about chosen systems and reason for selection. 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate. 6. Context for"
    },
    {
      "source_text": "Assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
