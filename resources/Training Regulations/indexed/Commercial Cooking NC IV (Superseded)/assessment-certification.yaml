    {
      "number": "4.2",
      "text": "Individuals aspiring to be awarded the qualification of COMMERCIAL COOKING NC IV must acquire Certificates of Competency in all the following groups/cluster of core units of the Qualification. Candidates may apply for assessment in any accredited assessment center. 4.2.1 Plan and prepare specialty foods 4.2.1.1 Prepare foods according to dietary and cultural needs 4.2.1.2 Develop menus to meet special dietary and cultural needs 4.2.1.3 Design menus to meet market needs 4.2.2 Plan and implement a food safety program 4.2.2.1 Transport and store food in a safe and hygienic manner 4.2.2.2 Develop a food safety program 4.2.3 Plan and implement a catering event 4.2.3.1 Apply catering control principles 4.2.3.2 Select catering systems 4.2.3.3 Manage facilities associated with commercial catering contracts 4.2.3.4 Plan the catering for an event or function Successful candidates shall be awarded Certificates of Competency (COC)."
    },
    {
      "number": "4.3",
      "text": "After accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate."
    },
    {
      "number": "4.4",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
