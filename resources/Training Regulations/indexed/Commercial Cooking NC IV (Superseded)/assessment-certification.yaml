  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of COMMERCIAL COOKING NC IV,\nthe candidate must demonstrate competence in all the units of competency\nlisted in Section l. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of COMMERCIAL\nCOOKING NC IV must acquire Certificates of Competency in all the\nfollowing groups/cluster of core units of the Qualification. Candidates may\napply for assessment in any accredited assessment center.\n\n4.2.1 Plan and prepare specialty foods\n\n4.2.1.1 Prepare foods according to dietary and cultural needs\n4.2.1.2 Develop menus to meet special dietary and cultural needs\n4.2.1.3 Design menus to meet market needs\n\n4.2.2 Plan and implement a food safety program\n\n4.2.2.1 Transport and store food in a safe and hygienic manner\n4.2.2.2 Develop a food safety program\n\n4.2.3 Plan and implement a catering event\n\n4.2.3.1 Apply catering control principles\n4.2.3.2 Select catering systems\n4.2.3.3 Manage facilities associated with commercial catering\ncontracts\n4.2.3.4 Plan the catering for an event or function\n\n Successful candidates shall be awarded Certificates of Competency\n(COC).\n\n4.3\nAfter accumulation and submission of all COCs acquired for the relevant\nunits of competency comprising a qualification, an individual shall be\nissued the corresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n--- PDF PAGE 118 ---\n_______________________________________________________________________________________________116\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs.\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS)\".\n\n--- PDF PAGE 119 ---\n_______________________________________________________________________________________________117\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n"
}
