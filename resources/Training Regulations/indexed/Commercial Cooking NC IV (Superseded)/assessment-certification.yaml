    {
      "number": "4.1",
      "text": "To attain the National Qualification of COMMERCIAL COOKING NC IV, the candidate must demonstrate competence in all the units of competency listed in Section l. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
