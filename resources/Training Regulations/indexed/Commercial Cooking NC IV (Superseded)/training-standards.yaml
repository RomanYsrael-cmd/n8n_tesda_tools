\n1.6 Record assessment\nresults\n1.7 Provide feedback to\npersons being\nassessed\n1.8 Report on the\nconduct of the\nassessment\n• Lecture\n• Role-Play\n• Simulation\n• Group\nDiscussion\n• Observation\n• Interviews/\nQuestioning\n2. Manage\nworkplace\ndiversity\n2.1 Encourage respect\nfor diversity in the\nworkplace\n2.2 Use diversity as an\nasset\n2.3 Deal with problems\narising from diversity\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Interviews/\nQuestioning\n• Observation\n\n--- PDF PAGE 108 ---\n_______________________________________________________________________________________________106\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nissues\n3. Manage\nfinances within a\nbudget\n3.1 Allocate budget\nresources\n3.2 Monitor financial\nactivities against\nbudget\n3.3 Identify and evaluate\noptions for improved\nbudget performance\n3.4 Complete financial\nreports\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Questioning\n• Observation\n4. Manage quality\ncustomer\nservice\n4.1 Develop approaches\nto enhance\ncustomer service\nquality\n4.2 Manage the delivery\nof quality service\n4.3 Monitor and adjust\ncustomer service\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Questioning\n• Observation\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare foods\naccording to\ndietary and cultural\nneeds\n1.1 Prepare and\npresent foods to\nmeet basic\nnutritional needs\n1.2 Prepare and\npresent foods to\nmeet special\ndietary\nrequirements\n1.3 Prepare foods to\nsatisfy specific\ncultural or religious\nneeds\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation\nin Laboratory\n• Oral\nQuestioning\n2. Transport and\ns