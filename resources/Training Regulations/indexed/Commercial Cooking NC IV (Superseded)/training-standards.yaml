  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for COMMERCIAL COOKING NC IV.\n\nThe guidelines include information on curriculum design, training delivery,\ntrainee entry requirements, tools and equipment, training facilities, and trainer’s\nqualifications among others.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: COMMERCIAL COOKING\n\nNC Level: NC IV\n\nNominal Training Duration: 56 Hrs. (Basic)\n 24 Hrs. (Common)\n\n 180 Hrs. (Core)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude in planning\nand preparing foods to meet special dietary and cultural needs; designing menus,\nplanning and implementing a food safety program and catering event; and managing a\nteam of cooks for guests. It also includes competencies in developing teams and\nindividuals, applying problem-solving techniques, collecting, analyzing and organizing\ninformation, planning and organizing work, conducting assessment, and managing\nworkplace diversity, finances, and quality customer service.\n\n--- PDF PAGE 105 ---\n_______________________________________________________________________________________________103\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize specialized\ncommunication\nskills\n1.1 Apply\ncommunication\nstrategies to meet\nspecific needs of\ninternal and\nexternal client.\n1.2 Represent the\norganization in\ninternal and\nexternal forums.\n1.3 Facilitate group\ndiscussion.\n1.4 Conduct\ninterview\n• Discussion\nmethod\n• Role Play\n• Brainstorming\n• Lecture\n\n• Written test\n• Performance\ntest\n• Interview\n2. Develop team and\nindividual needs\n2.1 Determine\ndevelopment\nneeds.\n2.2 Foster individual\nand organization\ngrowth\n2.3 Monitor and\nevaluate\nworkplace\nlearning\n2.4 Develop team\ncommitment and\ncooperation\n2.5 Facilitate\naccomplishment\nof organizational\ngoals\n• Discussion\n• Role playing\n• Observation\n• Written test\n• Direct\nobservation\n• Role playing\n\n--- PDF PAGE 106 ---\n_______________________________________________________________________________________________104\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Apply problem\nsolving techniques\nin the workplace\n3.1 Analyze the\nproblem\n3.2 Identify\nfundamental\ncause of the\nproblem\n3.3 Determine\npossible solution\n3.4 Prepare\ncommunication or\ndocumentation\nreport\n3.5 Present\nrecommendation\nto appropriate\npersonnel\n3.6 Implement\nsolution\n• Brainstorming\n• Discussion\n• Case studies\n• Role playing\n• Small group\nwork\n\n• Written test\n• Direct\nobservation\n• Interview\n4. Collect, analyze\nand organize\ninformation\n4.1 Study information\nrequirements.\n4.2 Process data.\n4.3 Analyze, interpret\nand organize\ninformation\ngathered.\n4.4 Present\nfindings/recomm\nendations\n• Group\ndiscussion\n• Case study\n• Interaction\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and organize\nwork\n5.1 Set work\nobjectives\n5.2 Plan and\nschedule work\nactivities\n5.3 Implement and\nmonitor\nplans/activities\n5.4 Review and\nevaluate work\nplans and\nactivities\n• Brainstorming\n• Discussion\n• Case studies\n• Role playing\n• Small group\nwork\n• Written test\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 107 ---\n_______________________________________________________________________________________________105\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Promote\nenvironmental\nprotection\n6.1 Study guidelines\nfor environmental\nconcerns.\n6.2 Implement\nspecific\nenvironmental\nprograms\n6.3 Monitor activities\non environmental\nprotection/progra\nms\n• Group\ndiscussion\n• Case study\n• Interaction\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Conduct\nassessment\n1.1 Identify and explain\nthe context of\nassessment\n1.2 Plan evidence-\ngathering\nopportunities\n1.3 Organize\nassessment\n1.4 Gather evidence\n1.5 Make the\nassessment decision\n1.6 Record assessment\nresults\n1.7 Provide feedback to\npersons being\nassessed\n1.8 Report on the\nconduct of the\nassessment\n• Lecture\n• Role-Play\n• Simulation\n• Group\nDiscussion\n• Observation\n• Interviews/\nQuestioning\n2. Manage\nworkplace\ndiversity\n2.1 Encourage respect\nfor diversity in the\nworkplace\n2.2 Use diversity as an\nasset\n2.3 Deal with problems\narising from diversity\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Interviews/\nQuestioning\n• Observation\n\n--- PDF PAGE 108 ---\n_______________________________________________________________________________________________106\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nissues\n3. Manage\nfinances within a\nbudget\n3.1 Allocate budget\nresources\n3.2 Monitor financial\nactivities against\nbudget\n3.3 Identify and evaluate\noptions for improved\nbudget performance\n3.4 Complete financial\nreports\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Questioning\n• Observation\n4. Manage quality\ncustomer\nservice\n4.1 Develop approaches\nto enhance\ncustomer service\nquality\n4.2 Manage the delivery\nof quality service\n4.3 Monitor and adjust\ncustomer service\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Questioning\n• Observation\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare foods\naccording to\ndietary and cultural\nneeds\n1.1 Prepare and\npresent foods to\nmeet basic\nnutritional needs\n1.2 Prepare and\npresent foods to\nmeet special\ndietary\nrequirements\n1.3 Prepare foods to\nsatisfy specific\ncultural or religious\nneeds\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n(i.e Mise-en-\nplace, Work\nTechniques,\nHygiene and\nSanitation,\nSensory\nEvaluation,\nPlating and\nPresentation,\nPortion Size)\n• Observation\nin Laboratory\n• Oral\nQuestioning\n2. Transport and\nstore food in a\nsafe and hygienic\n2.1 Identify appropriate\nfood transportation\n2.2Transport food\n• Lecture/\n• Discussion\n• Written Test\n• Practical Test\n\n--- PDF PAGE 109 ---\n_______________________________________________________________________________________________107\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\nmanner\nsafely and\nhygienically\n2.3 Store food safely\nand hygienically\n• Demonstration\n• Hands-on\n• Video Viewing\n• Observation\nin Laboratory\n• Oral\nQuestioning\n3. Apply catering\ncontrol principles\n3.1 Identify procedures\nto reduce wastage\n3.2 Carry out catering\ncontrol procedures\n3.3 Minimize waste\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n4. Develop menus to\nmeet special\ndietary and cultural\nneeds\n4.1 Identify the dietary\nand cultural\nrequirements of\ncustomers\n4.2 Develop menus\nand meal plans to\nmeet dietary and\ncultural\nrequirements\n4.3 Evaluate meals\nand menus\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n\n5. Select catering\nsystems\n\n5.1 Review catering\nsystem\nrequirements\n5.2 Evaluate and\nselect the catering\nsystem\n\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n6. Manage facilities\nassociated with\ncommercial\ncatering contracts\n6.1 Organize\nmaintenance of\nfacilities\n6.2 Manage catering\nstores and storage\nareas\n6.3 Maintain a facilities\nassets register\n6.4 Manage client\nservices\nassociated with the\nfacility\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n7. Plan the catering\nfor an event or\nfunction\n7.1 Identify overall\nevent objectives\nand scope\n• Lecture/\n• Discussion\n• Written Test\n• Practical Test\n\n--- PDF PAGE 110 ---\n_______________________________________________________________________________________________108\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7.2 Prepare the\ncatering concept\nfor an event or\nfunction\n7.3 Prepare and\nimplement an\noperational plan for\nthe catering of an\nevent or function\n• Demonstration\n• Hands-on\n• Video Viewing\n• Observation\nin Laboratory\n• Oral\nQuestioning\n8. Design menus to\nmeet market\nneeds\n8.1 Identify and\nevaluate target\nmarkets for the\ncatering outlet\n8.2 Evaluate market\ntrends in food\nservice\n8.3 Create menu\nbased on market\nanalysis and within\nbudgetary\nconstraints\n8.4 Monitor menu\nperformance\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n9. Develop a food\nsafety program\n9.1 Identify needs for\nthe food safety\nprogram\n9.2 Develop a food\nsafety program for\na specific\ncommercial\ncatering enterprise\n9.3 Implement the food\nsafety program\n9.4 Evaluate and\nrevise the food\nsafety program as\nrequired\n• Lecture/\n• Discussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n\n--- PDF PAGE 111 ---\n_______________________________________________________________________________________________109\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should follow to the design of the\ncurriculum. Delivery should be guided by the 10 basic principles of\ncompetency-based TVET.\n\n• The training is based on curriculum developed from the\n competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\n standards and the curriculum modules;\n• Assessment is based on the collection of evidence of the\n performance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\n competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n•\nThe\ndualized\nmode\nof\ntraining\ndelivery\nis\npreferred\nand\nrecommended, thus, programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and Regulations\n•\nModular/self-paced learning is a competency-based training modality\nwhere the trainee is allowed to progress at his own pace. The trainer\nonly facilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners\n•\nSupervised industry training or on-the-job training is a training\napproach designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations\n•\nDistance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video or computer technologies\n\n--- PDF PAGE 112 ---\n_______________________________________________________________________________________________110\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n 3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate both orally and in written form;\n• physically and mentally fit;\n• with good moral character;\n• can perform basic mathematical computation;\n• must be competent in the entire Commercial Cooking NC III\nqualification either through training, experience or certification\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 113 ---\n_______________________________________________________________________________________________111\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n3.4 LIST OF TOOLS AND EQUIPMENT\n COMMERCIAL COOKING – NC IV\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for COMMERCIAL COOKING NC IV are as follows:\n\nTOOLS\nEQUIPMENT\nCOOKING UTENSILS\nQTY\n\nQTY\n\nQTY\n\nBasic cutting knives\n1 unit\nReach-in freezer\n5 pcs.\nSauce pan w/ handle,\n16 cm. diameter x 8\ncm. height\n5 pcs.\nParing knife\n1 unit\nReach-in refrigerator\n5 pcs.\nSauce pan w/ handle,\n20 cm. diameter x 8\ncm. height\n3 pcs.\nBread knife\n5 units\n4 burner gas range w/\noven\n5 pcs.\nSaut