        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated safe transport and storage of food items\nwithin food safety requirements and regulations.\n1.2 Demonstrated transport of a range of food item types.\n2. Underpinning\nknowledge\n2.1 The hygiene and OH&S requirements for food storage\nand transport.\n2.2 Advantages and disadvantages of different forms of\ntransport for particular food items, quantities and\ncircumstances.\n2.3 Characteristics of different food items and conditions\nrequired to maintain optimum freshness, palatability and\nsafety.\n2.4\nHACCP principles applied to catering.\n3. Underpinning\nskills\n3.1 Safe work practices in particular to loading and\nunloading, lifting and dealing with heated surfaces.\n3.2 Safe storage principles and practices for different food\ntypes, including storage options.\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Use of real food items to be transported\n4.2 Relevant transportation and storage equipment to move\nfood between locations.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate of transporting and\nstoring food items.\n5.2 Inspection of food transported and stored by the\ncandidate.\n5.3 Problem solving and case studies to address various\nconditions which apply to the transport and storage of\ndifferent food items.\n5.4 Written or oral questions to test knowledge of hygiene\nissues related to transport and storage.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center.\n\n--- PDF PAGE 67 ---\n_______________________________________________________________________________________________65\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nAPPLY CATERING CONTROL PRINCIPLES\n\nUNIT CODE\n\n:"
        },
        "source_text": "TRS512356\n\nUNIT DESCRIPTOR\n:\nThis unit refers to the transportation of food\nfrom a food preparation area to another\nlocation. It also deals with holding or storage\non its arrival. Transportation refers to the\nmoving of food and food items from one\nlocation to another. For example, transporting\nfood from a kitchen to a school or hospital or\nproviding event catering. It does not refer to\nthe transport of food from the kitchen to the\ndining room or as part of room service.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Identify appropriate food\ntransportation\n 1.1 Suitable food transportation vehicles are\nselected according to establishment\nrequirements.\n2. Transport food safely and\nhygienically\n2.1 Food is packaged, loaded and unloaded\nappropriately.\n\n2.2 Hygienic work practices are employed and\noccupational health and safety regulations are\nobserved.\n\n2.3 Food transportation records are maintained\nappropriately and accurately.\n3. Store food safely and\nhygienically\n3.1 Food storage conditions are selected\nappropriately for specific food type including:\n•\nDairy\n•\nMeat and fish\n•\nFruit and vegetables\n•\nDried goods\n\n--- PDF PAGE 64 ---\n_______________________________________________________________________________________________62\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n3.2 Appropriate environmental conditions are\nmaintained for specific food types to ensure\nfreshness, quality and appearance.\n3.3 Appropriate storage and holding methods are\nemployed to optimize nutritional quality.\n3.4 Hygienic work practices are employed and\noccupational health and safety procedures and\npractices are observed.\n3.5 Storage areas are kept free from contaminants\nand pests.\n\n--- PDF PAGE 65 ---\n_______________________________________________________________________________________________63\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related\nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens,\ncafes, educational institutions, health establishments, defense forces, corrective\nservices, residential catering, in-flight and other transport catering, events catering and\nprivate catering.\n\nThe type of transport used will vary according to the enterprise needs and the type of\nfood being transported.\n\nVARIABLE\n\nRANGE\n1. Types of transport\nMay include but not limited to:\n1.1 Vans\n1.2 Cars\n1.3 Refrigerated trucks\n1.4 Trolleys, carts and push carts\n2. National regulations guidelines\nMay include but not limited to:\n2.1 Temperature\n2.2 Lining\n2.3\nSealing\n3. Environmental conditions\nMay include but not limited to:\n3.1 Temperature\n3.2 Humidity\n3.3 Exposure to light\n3.4\nExposure to weather\n\n--- PDF PAGE 66 ---\n_______________________________________________________________________________________________64\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated safe transport and storage of food items\nwithin food safety requirements and regulations.\n1.2 Demonstrated transport of a range of food item types.\n2. Underpinning\nknowledge\n2.1 The hygiene and OH&S requirements for food storage\nand transport.\n2.2 Advantages and disadvantages of different forms of\ntransport for particular food items, quantities and\ncircumstances.\n2.3 Characteristics of different food items and conditions\nrequired to maintain optimum freshness, palatability and\nsafety.\n2.4\nHACCP principles applied to catering.\n3. Underpinning\nskills\n3.1 Safe work practices in particular to loading and\nunloading, lifting and dealing with heated surfaces.\n3.2 Safe storage principles and practices for different food\ntypes, including storage options.\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Use of real food items to be transported\n4.2 Relevant transportation and storage equipment to move\nfood between locations.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate of transporting and\nstoring food items.\n5.2 Inspection of food transported and stored by the\ncandidate.\n5.3 Problem solving and case studies to address various\nconditions which apply to the transport and storage of\ndifferent food items.\n5.4 Written or oral questions to test knowledge of hygiene\nissues related to transport and storage.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center.\n\n--- PDF PAGE 67 ---\n_______________________________________________________________________________________________65\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nAPPLY CATERING CONTROL PRINCIPLES\n\nUNIT CODE\n\n:"
