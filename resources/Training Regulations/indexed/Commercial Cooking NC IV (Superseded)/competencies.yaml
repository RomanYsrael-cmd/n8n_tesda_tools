        "source_title": "PLAN THE CATERING FOR AN EVENT OR FUNCTION",
        "source_text": "--- PDF PAGE 86 ---\n_______________________________________________________________________________________________84 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nUNIT OF COMPETENCY \n: \nPLAN THE CATERING FOR AN EVENT OR  \n \n \nFUNCTION \n \nUNIT CODE  \n \n \n: \nTRS512361 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the skills and knowledge \nrequired to plan the catering of an event or \nfunction. While catering is the major focus of \nthis unit, it also refers to additional services \nwhich may be offered by a caterer such as \nthose related to décor and theme. However, \nthe unit does not cover the broader event \nmanagement skills required for a major event \nwhich are covered in other specialist event \nmanagement units within the Tourism Training \nPackages. \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \n  \nBold and Italicized terms are elaborated in the Range \nStatement\n1.  Identify overall event objectives \nand scope \n1.1 Key objectives of the event are clarified and \nagreed upon in consultation with stakeholder. \n1.2 Key information is analyzed and consulted \nwith stakeholders to determined the broad \nscope of the event including indicators for: \n Size and numbers of guests/delegates \n Location (s) \n Time and duration \n Budget \n Dietary restrictions \n Guests profile \n1.3 Factors which may impact on the event \ncatering,are identified and analyzed. \n2.  Prepare the catering concept \nfor an event or function \n2.1 \nIdeas to the overall event concept, theme and \nformat are contributed according to scope of \nresponsibility. \n2.2 \nThe key elements for catering are identified \nand defined in consultation with stakeholders\n\n--- PDF PAGE 87 ---\n_______________________________________________________________________________________________85 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nto reflect the objectives and meet the needs of \ncustomers. \n2.3 \nCreative elements are incorporated into \ncatering concept and theme. \n2.4 \nOperational practicality and cohesiveness of \nthe catering concept, theme and format are \nverified through consultation and analysis.\n3. Prepare and implement an \noperational plan for the \ncatering of an event or \nfunction \n3.1 Operational plan for the provision of catering \nand ancillary services is prepared identifying \nsteps, activities and sequence. \n3.2 Appropriate risk management is incorporated \ninto the plan. \n3.3 Details are reviewed, verified and finalized with \nthe client. \n3.4 Accurate and complete information on the \ncatering concept and operational plans is \nprovided to all relevant stakeholders to ensure \ntimely and effective planning and \nimplementation. \n3.5 Approval from relevant stakeholders is \nobtained prior to implementation. \n3.6 Banquet event order / contract is disseminated \nto different departments needing coordination. \n3.7 The catering plan for the event is implemented \nand monitored making adjustments as \nrequired. \n3.8 Feedback is obtained after the event and plans \nare reviewed to evaluate the degree to which it \nmet objectives and customer requirements.\n\n--- PDF PAGE 88 ---\n_______________________________________________________________________________________________86 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \nRANGE OF VARIABLES  \n \nThis unit applies to all catering operations where event catering is provided. \n  \nEvents and functions may be in a central location or across a range of smaller locations \nindoors or outdoors. \n \n \nVARIABLE \n \nRANGE \n1.  Events and functions \nMay include but not limited to: \n1.1 Sporting events. \n1.2 Defense operations \n1.3 Show, exhibitions \n1.4 Product launches \n1.5 Trade shows \n1.6 Conferences \n1.7 Meetings or seminars \n1.8 Training events \n1.9 Social celebrations \n1.10 Awards night \n1.11 Christmas parties \n1.12 Thanksgiving/victory parties \n1.13 Seminars\n2.  Key information \nMay include but not limited to: \n2.1 Purpose \n2.2 Concept \n2.3 Style and theme \n2.4 Date, time and venue \n2.5 Catering requirements \n2.6 Audience or market \n2.7\nOverall budget estimate\n3.  Stakeholders  \nMay include but not limited to: \n3.1 Event customer \n3.2 Suppliers and contractors \n3.3 Local community \n3.4 Organizing committees \n3.5 Local authorities \n3.6 Colleagues \n3.7\nEntertainers\n4.  Key elements for catering  \nMay include but not limited to: \n4.1 Type of food \n4.2 Style of service \n4.3 Timing of service \n4.4\nLink between food and other aspects of the\n\n--- PDF PAGE 89 ---\n_______________________________________________________________________________________________87 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nVARIABLE \n \nRANGE \nevent (eg. speeches) \n4.5 Production and transport issues \n4.6 Catering staff requirements \n4.7 Liaison with others involved in the event. \n4.8\nSeating arrangements\n5.  Ancillary services \nMay include but not limited to: \n5.1 Theme and décor \n5.2 Management of the event \n5.3 Staffing \n5.4 Logistics \n6.  Operational plan \nMay include: \n6.1 Costing of components and total catering \n6.2 Management \n6.3 Staffing and contracting \n6.4 Roles and responsibilities \n6.5 Logistics and transport details \n6.6 Resources eg. venue, commodities, \nequipment, machinery, vehicles and staff \n6.7 Security arrangements \n6.8 Purchasing of food, materials and equipment\n6.9 Production and distribution of food and \nbeverage.\n\n--- PDF PAGE 90 ---\n_______________________________________________________________________________________________88 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 Demonstrated the ability to plan catering which reflects \nevent objectives, is operationally practical and which \nresults in the achievement of objectives. \n1.2 Demonstrated knowledge of the creative options to be \nconsidered when developing for catering for an event. \n1.3 Demonstrated knowledge of issues and challenges \nassociated with event catering.\n2.  Underpinning \nknowledge \n2.1 Knowledge of the different catering options and styles \nfor different types, different types of customer and \nvarying numbers. \n2.2 Space and equipment requirements for different styles \nof catering and varying numbers. \n2.3 Staffing requirements for particular types of catering. \n2.4 Knowledge of typical formats and running orders for \ndifferent styles of events. \n2.5 Knowledge of what each department should do. \n2.6 Customer service. \n2.7 Knowledge on working proposals, quotations and \ncontracts. \n2.8\nKnowledge on the servicewares to be used.\n3.  Underpinning \n \nskills \n3.1 Operational constraints for catering within different \nstyles of venue. \n3.2 Operational constraints for catering in different climatic \nconditions. \n3.3 Principles and practices of food safety for preparation, \nstorage and transport of food.\n4.  Resource  \n \nImplications \nThe following resources must be provided: \n4.1 Project or work activities conducted over a period of \ntime that allow the candidate to plan and organize event \ncatering, and then to monitor the actual catering service \nat the event or function. \n4.2 Access to and interaction with event industry suppliers. \n4.3 Involvement of and interaction with an event principal or \norganizing group.\n5.  Method of  \n \n Assessment \nCompetency may be assessed through: \n5.1 Evaluation of the catering at an event where catering is \ncoordinated by the candidate. \n5.2 Case studies to assess ability to develop catering \nconcepts and plans for different types of event.\n\n--- PDF PAGE 91 ---\n_______________________________________________________________________________________________89 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n5.3 Evaluation of reports prepared by the candidate \ndetailing the planning processes undertaken for an \nevent and highlighting particular challenges and issues. \n5.4 Written or oral questions to elicit further explanations on \nvarious aspects of planning. \n5.5 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate.\n6.  Context for \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through TESDA’s \naccredited assessment center\n",
