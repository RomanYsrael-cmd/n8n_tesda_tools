        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge of basic budget principles \nand structures \n1.2 Knows budgeting terminology relevant to a specific \nindustry  context \n1.3 Demonstrated the ability to monitor income and \nexpenditure in accordance with the budget, and to \nidentify ways of improving budget performance \n1.4 Demonstrated understanding of the main types of \nbudget that apply in the specific enterprise or \nindustry context\n2. Underpinning \nknowledge  \n2.1 Budget structure \n2.2 Company and legal requirements in relation to \ndisbursement of funds and record-keeping \n2.3 Budgeting terminology relevant to a specific industry \ncontext \n2.4 Financial reporting procedures and cycles relevant to \nthe enterprise or industry sector\n3. Underpinning \nskills \n3.1 Techniques related to maximizing budget performance \nrelevant to the enterprise or industry sector\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Project or work activities that include the management \nof and reporting on a budget for a specific project or \noperational area over a period of time so that the \nmonitoring and implementation aspects of the unit \ncan be assessed \n4.2 Use of figures and data that reflect the financial \noperating conditions of industry \n4.3 The requirement to evaluate options for improved \nbudget performance\n5. Method of \nassessment \nCompetency may be assessed through \n5.1 Evaluation of financial reports detailing financial \nperformance of projects or activities conducted by \nthe candidate \n5.2 Evaluation of reports produced by the candidate\n\n--- PDF PAGE 51 ---\n_______________________________________________________________________________________________49 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \ndetailing the processes undertaken to manage \nfinances within a budget \n5.3 Case studies and problem solving to assess \napplication of the principles of budget management \nto different situations \n5.4 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate\n6. Context of \nassessment \n6.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group",
