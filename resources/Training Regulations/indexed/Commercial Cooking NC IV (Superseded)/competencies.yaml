        "source_title": "MANAGE FACILITIES ASSOCIATED WITH COMMERCIAL CATERING CONTRACTS",
        "source_text": "--- PDF PAGE 81 ---\n_______________________________________________________________________________________________79 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \nUNIT OF COMPETENCY \n: \nMANAGE FACILITIES ASSOCIATED WITH  \n \n \nCOMMERCIAL CATERING CONTRACTS \n \nUNIT CODE  \n \n \n: \nTRS512360 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the management of small-\nscale facilities associated with commercial \ncatering contracts. It reflects a situation where \na caterer may hold a contract to operate a \ncatering outlet within a venue owned by \nanother organization (eg. within a school or \nsporting club). \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \n  \nBold and Italicized terms are elaborated in the Range \nStatement\n1.  Organize maintenance of \nfacilities \n1.1 Scope of maintenance requirements is \nidentified in accordance with contract or scope \nof operations. \n1.2 Responsibility for specific maintenance \nfunctions is allocated considering the \nadvantages and disadvantages of in-house \nstaff and external contractors. \n1.3 Regular maintenance of facilities is organized \non time to meet specific requirements and to \nmeet budgetary targets. \n2.  Manage catering stores and \nstorage areas \n2.1 Stocks are purchased, received, stored and \ntransferred according to contracted \nrequirements and negotiated supplier \nagreements. \n2.2 Storage, stock control and distribution \nsystems are organized for the specific facility \nin accordance with contracted requirements, \nOH&S and health department regulations. \n2.3 Accurate records and reports are maintained \naccording to enterprise policy and procedures.\n\n--- PDF PAGE 82 ---\n_______________________________________________________________________________________________80 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \n3.  Maintain a facilities assets \nregister \n3.1 All assets are identified and registered clearly. \n3.2 Routine audits of assets are conducted. \n3.3 Asset and inventory reports are issued \naccording to enterprise practices. \n4.  Manage client services \nassociated with the facility \n4.1 Stakeholders are liaised with to determined \ngeneral and specific requirements for client \nservice. \n4.2 Exiting client services across all areas of \noperation are monitored to identify areas for \nimprovement. \n4.3 Temporary or permanent upgrades or \nmodifications of existing services and \nfacilities are arranged as required and in \naccordance with appropriate regulations. \n4.4 Additional human, physical or financial \nresources are organized in accordance with \ncustomer requirements. \n4.5 Provisions of new services or facilities are \narranged when required. \n4.6 Budgeting targets are maintained in the \nmanagement of client services. \n4.7 Feedback on catering service is reviewed and \nprovision of client service is modified \naccordingly.\n\n--- PDF PAGE 83 ---\n_______________________________________________________________________________________________81 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nRANGE OF VARIABLES  \n \nThis unit applies to all hospitality and catering operations where food and related \nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens, \ncafes, educational institutions, health establishments, defense forces, corrective \nservices, residential catering, in-flight and other transport catering, events catering and \nprivate catering. \n \n \nVARIABLE \n \nRANGE \n1.  Maintenance \nMay include but not limited to: \n1.1 Gardening \n1.2 Cleaning \n1.3 Building and repairs \n1.4 Laundry \n1.5 Plumbing and electrical \n2.  Stock control procedures \nMay include but not limited to: \n2.1 Stocktaking and reconciliation \n2.2 Stock rotation \n2.3 Authorizing access \n2.4 Issuing and requisition systems \n2.5 Receiving control \n2.6 Locks and other security systems \n2.7\nInventory of items to be brought on-site\n3.  Stakeholders  \nMay include but not limited to: \n3.1 The venue owner \n3.2 Staff \n3.3 Customers \n4.  Areas of operation to be \nmonitored  \nMay include but not limited to: \n4.1 Quality of service \n4.2 Quality of catering \n4.3 Adequacy of staffing levels \n4.4 Costs of operations \n4.5 Hours of operation \n4.6 Appropriate integration of the facility within th\noverall venue and associated operational \nissues \n4.7\nAppropriateness of location\n\n--- PDF PAGE 84 ---\n_______________________________________________________________________________________________82 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nVARIABLE \n \nRANGE \n6. Upgrades or modifications of \nnew or existing services \nMay include but not limited to: \n5.1 Additional capacity \n5.2 Amended or expanded menus \n5.3 Expansion of facility \n5.4\nAdjusted staffing arrangements\n\n--- PDF PAGE 85 ---\n_______________________________________________________________________________________________83 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 Demonstrated the ability to manage the operation of a \ncommercial catering facility in accordance with \ncontractual agreements, including maintenance, \nstorage and client service. \n1.2 Demonstrated knowledge of the key factors that impact \non the management of commercial catering facilities.\n2.  Underpinning \nknowledge \n2.1 Types of arrangements between venues and catering \ncontractors including scope of typical contracts and \nservices. \n2.2 Procedures for developing and maintaining an assets \nregister. \n3.  Underpinning  \n \n skills \n3.1 Stock control systems and procedures found in \ncommercial catering facilities. \n3.2 Analytical and planning skills for evaluation of existing \noperations and planning of adjustments. \n3.3 Financial control processes in the context of catering \noperations.\n4.  Resource  \n \n implications \nThe following resources must be provided: \n4.1 Fully-equipped operational commercial catering outlet. \n4.2 Project or work activities conducted over a period of \ntime to allow the candidate to demonstrate the \nimplementation and monitoring aspects of the unit.\n5.  Method of \nAssessment \nCompetency may be assessed through: \n5.1 \nEvaluation of projects undertaken by the candidate to \nestablish and monitor a small-scale catering outlet (e.g. for \nan event) \n5.2 \nEvaluation of reports prepared by the candidate detailing \nprocesses and systems used to manage a catering facility. \n5.3 \nCase studies to assess ability to establish systems for \ndifferent style of catering facilities. \n5.4 \nWritten or oral questions to test knowledge of advantages \nand limitations of asset management systems. \n5.5 \nReview of portfolios of evidence and third party workplace \nreports of on-the-job performance by the candidate.\n6.  Context for \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through TESDA’s \naccredited assessment center\n",
