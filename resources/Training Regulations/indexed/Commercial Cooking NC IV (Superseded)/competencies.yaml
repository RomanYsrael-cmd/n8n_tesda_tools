        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for\nothers\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of\nthe team\n1.4. Negotiated learning plans to improve the\neffectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6.\nAccessed and designated learning opportunities\n2. Underpinning\nknowledge\n2.1. Coaching and mentoring principles\n2.2. Understanding how to work effectively with team\nmembers who have diverse work styles, aspirations,\ncultures and perspective\n2.3. Understanding how to facilitate team development\nand improvement\n2.4. Understanding methods and techniques for eliciting\nand interpreting feedback\n2.5. Understanding methods for identifying and\nprioritizing personal development opportunities and\noptions\n2.6. Knowledge of career paths and competency\nstandards in the industry\n3. Underpinning\nskills\n3.1. Ability to read and understand a variety of texts,\nprepare general information and documents\naccording to target audience; spell with accuracy;\nuse grammar and punctuation effective relationships\nand conflict management\n3.2. Communication skills including receiving feedback\nand reporting, maintaining effective relationships and\nconflict management\n3.3. Planning skills to organize required resources and\nequipment to meet learning needs\n3.4. Coaching and mentoring skills to provide support to\ncolleagues\n3.5. Reporting skills to organize information; assess\ninformation for relevance and accuracy; identify and\nelaborate on learning outcomes\n3.6. Facilitation skills to conduct small group training\nsessions\n3.7. Ability to relate to people from a range of social,\ncultural, physical and mental backgrounds\n\n--- PDF PAGE 13 ---\n_______________________________________________________________________________________________11\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Observation of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 14 ---\n_______________________________________________________________________________________________12\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nAPPLY PROBLEM SOLVING TECHNIQUES IN THE\nWORKPLACE\nUNIT CODE\n:"
        },
        "source_text": "500311116\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to determine individual and team development\nneeds and facilitate the development of the workgroup.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Provide team leadership\n1.1.\nLearning and development needs are\nsystematically identified and implemented in\nline with organizational requirements\n1.2.\nLearning plan to meet individual and group\ntraining and developmental needs is\ncollaboratively developed and implemented\n1.3.\nIndividuals are encouraged to self evaluate\nperformance and identify areas for\nimprovement\n1.4.\nFeedback on performance of team\nmembers is collected from relevant sources\nand compared with established team learning\nprocess\n2. Foster individual and\norganizational growth\n2.1.\nLearning and development program goals\nand objectives are identified to match the\nspecific knowledge and skills requirements of\ncompetency standards\n2.2.\nLearning delivery methods are appropriate\nto the learning goals, the learning style of\nparticipants and availability of equipment and\nresources\n2.3.\nWorkplace learning opportunities and\ncoaching/ mentoring assistance are provided\nto facilitate individual and team achievement\nof competencies\n2.4.\nResources and timelines required for learning\nactivities are identified and approved in\naccordance with organizational requirements\n\n--- PDF PAGE 10 ---\n_______________________________________________________________________________________________8\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Monitor and evaluate\nworkplace learning\n3.1.\nFeedback from individuals or teams is used to\nidentify and implement improvements in\nfuture learning arrangements\n3.2.\nOutcomes and performance of\nindividuals/teams are assessed and recorded\nto determine the effectiveness of\ndevelopment programs and the extent of\nadditional support\n3.3.\nModifications to learning plans are negotiated\nto improve the efficiency and effectiveness of\nlearning\n3.4.\nRecords and reports of competency are\nmaintained within organizational requirement\n4. Develop team\ncommitment and\ncooperation\n4.1.\nOpen communication processes to obtain and\nshare information is used by team\n4.2.\nDecisions are reached by the team in\naccordance with its agreed roles and\nresponsibilities\n4.3.\nMutual concern and camaraderie are\ndeveloped in the team\n5. Facilitate\naccomplishment of\norganizational goals\n5.1.\nTeam members actively participated in team\nactivities and communication processes\n5.2.\nTeams members developed individual and\njoint responsibility for their actions\n5.3.\nCollaborative efforts are sustained to attain\norganizational goals\n\n--- PDF PAGE 11 ---\n_______________________________________________________________________________________________9\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning and\n development needs\n\n1.1\nCoaching, mentoring and/or supervision\n1.2\nFormal/informal learning program\n1.3\nInternal/external training provision\n1.4\nWork experience/exchange/opportunities\n1.5\nPersonal study\n1.6\nCareer planning/development\n1.7\nPerformance appraisals\n1.8\nWorkplace skills assessment\n1.9\nRecognition of prior learning\n2. Organizational\n requirements\n2.1 Quality assurance and/or procedures\nmanuals\n2.2 Goals, objectives, plans, systems and\nprocesses\n2.3 Legal and organizational policy/guidelines\nand requirements\n2.3\nSafety policies, procedures and programs\n2.4\nConfidentiality and security requirements\n2.5\nBusiness and performance plans\n2.6\nEthical standards\n2.7\nQuality and continuous improvement\nprocesses and standards\n3. Feedback on\n performance\n3.1\n Formal/informal performance appraisals\n3.2\n Obtaining feedback from supervisors and\n colleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for\nmonitoring service delivery\n4. Learning delivery\n methods\n4.1\nOn the job coaching or mentoring\n4.2\nProblem solving\n4.3\nPresentation/demonstration\n4.4\nFormal course participation\n4.5\nWork experience\n4.6\nInvolvement in professional networks\n4.7\nConference and seminar attendance\n4.8\nInduction\n\n--- PDF PAGE 12 ---\n_______________________________________________________________________________________________10\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for\nothers\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of\nthe team\n1.4. Negotiated learning plans to improve the\neffectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6.\nAccessed and designated learning opportunities\n2. Underpinning\nknowledge\n2.1. Coaching and mentoring principles\n2.2. Understanding how to work effectively with team\nmembers who have diverse work styles, aspirations,\ncultures and perspective\n2.3. Understanding how to facilitate team development\nand improvement\n2.4. Understanding methods and techniques for eliciting\nand interpreting feedback\n2.5. Understanding methods for identifying and\nprioritizing personal development opportunities and\noptions\n2.6. Knowledge of career paths and competency\nstandards in the industry\n3. Underpinning\nskills\n3.1. Ability to read and understand a variety of texts,\nprepare general information and documents\naccording to target audience; spell with accuracy;\nuse grammar and punctuation effective relationships\nand conflict management\n3.2. Communication skills including receiving feedback\nand reporting, maintaining effective relationships and\nconflict management\n3.3. Planning skills to organize required resources and\nequipment to meet learning needs\n3.4. Coaching and mentoring skills to provide support to\ncolleagues\n3.5. Reporting skills to organize information; assess\ninformation for relevance and accuracy; identify and\nelaborate on learning outcomes\n3.6. Facilitation skills to conduct small group training\nsessions\n3.7. Ability to relate to people from a range of social,\ncultural, physical and mental backgrounds\n\n--- PDF PAGE 13 ---\n_______________________________________________________________________________________________11\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Observation of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 14 ---\n_______________________________________________________________________________________________12\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nAPPLY PROBLEM SOLVING TECHNIQUES IN THE\nWORKPLACE\nUNIT CODE\n:"
