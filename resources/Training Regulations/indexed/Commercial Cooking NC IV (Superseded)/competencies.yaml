  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of competency\nrequired in COMMERCIAL COOKING NC IV.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\nUNIT CODE\n:\n500311115\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to use specialized communication skills to meet\nspecific needs of internal and internal clients, conduct\ninterviews, facilitate group of discussions, and contribute\nto the development of communication strategies.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Meet common and\nspecific\ncommunication\nneeds of clients and\ncolleagues\n1.1\nSpecific communication needs of clients and\ncolleagues are identified and met\n1.2\nDifferent approaches are used to meet\ncommunication needs of clients and colleagues\n1.3\nConflict is addressed promptly and in a timely way\nand in a manner which does not compromise the\nstanding of the organization\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1\nStrategies for internal and external dissemination\nof information are developed, promoted,\nimplemented and reviewed as required\n2.2\nChannels of communication are established and\nreviewed regularly\n2.3\nCoaching in effective communication is provided\n2.4\nWork related network and relationship are\nmaintained as necessary\n2.5\nNegotiation and conflict resolution strategies are\nused where required\n2.6\nCommunication with clients and colleagues is\nappropriate to individual needs and organizational\nobjectives\n\n--- PDF PAGE 6 ---\n_______________________________________________________________________________________________4\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Represent the\norganization\n3.1\nWhen participating in internal or external forums,\npresentation is relevant, appropriately researched\nand presented in a manner to promote the\norganization\n3.2\nPresentation is clear and sequential and delivered\nwithin a predetermined time\n3.3\nUtilize appropriate media to enhance presentation\n3.4\nDifferences in views are respected\n3.5\nWritten communication is consistent with\norganizational standards\n3.6\nInquiries are responded in a manner consistent\nwith organizational standard\n4. Facilitate group\ndiscussion\n4.1\nMechanisms which enhance effective group\ninteraction is defined and implemented\n4.2\nStrategies which encourage all group members to\nparticipate are used routinely\n4.3\nObjectives and agenda for meetings and\ndiscussions are routinely set and followed\n4.4\nRelevant information is provided to group to\nfacilitate outcomes\n4.5\nEvaluation of group communication strategies is\nundertaken to promote participation of all parties\n4.6\nSpecific communication needs of individuals are\nidentified and addressed\n5. Conduct interview\n5.1\nA range of appropriate communication strategies\nare employed in interview situations\n5.2\nRecords of interviews are made and maintained in\naccordance with organizational procedures\n5.3\nEffective questioning, listening and nonverbal\ncommunication techniques are used to ensure that\nrequired message is communicated\n\n--- PDF PAGE 7 ---\n_______________________________________________________________________________________________5\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\n1.1\nRecognizing own limitations\n1.2\nReferral to specialists\n1.3\nUtilizing techniques and aids\n1.4\nProviding written drafts\n1.5\nVerbal and non verbal communication\n2. Effective group interaction\n2.1\nIdentifying and evaluating what is\noccurring within an interaction in a non\njudgmental way\n2.2\nUsing active listening\n2.3\nMaking decision about appropriate words,\nbehavior\n2.4\nPutting together response which is\nculturally appropriate\n2.5\nExpressing an individual perspective\n2.6\nExpressing own philosophy, ideology and\nbackground and exploring impact with\nrelevance to communication\n3. Types of Interview\n3.1\nRelated to staff issues\n3.2\nRoutine\n3.3\nConfidential\n3.4\nEvidential\n3.5\nNon disclosure\n3.6\nDisclosure\n4. Interview situations\n4.1\nEstablish rapport\n4.2\nElicit facts and information\n4.3\nFacilitate resolution of issues\n4.4\nDevelop action plans\n4.5\nDiffuse potentially difficult situation\n\n--- PDF PAGE 8 ---\n_______________________________________________________________________________________________6\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated effective communication skills with\nclients accessing service and work colleagues\n1.2\nAdopted relevant communication techniques and\nstrategies to meet client particular needs and\ndifficulties\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nDynamics of groups and different styles of group\nleadership\n2.3\nCommunication skills relevant to client groups\n3. Underpinning\nskills\n3.1\nFull range of communication techniques including:\n3.1.1\nFull range of communication\n3.1.2\nActive listening\n3.1.3\nFeedback\n3.1.4\nInterpretation\n3.1.5\nRole boundaries setting\n3.1.6\nNegotiation\n3.1.7\nEstablishing empathy\n3.2\nCommunication skills required to fulfill job roles as\nspecified by the organization\n4. Resource\nimplications\n4.1\nAccess to appropriate workplace where assessment\ncan take place\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1\nDirect observation\n5.2\nOral Interview\n6. Context of\nassessment\n6.1\nThis unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 9 ---\n_______________________________________________________________________________________________7\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nDEVELOP TEAMS AND INDIVIDUALS\nUNIT CODE\n:\n500311116\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to determine individual and team development\nneeds and facilitate the development of the workgroup.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Provide team leadership\n1.1.\nLearning and development needs are\nsystematically identified and implemented in\nline with organizational requirements\n1.2.\nLearning plan to meet individual and group\ntraining and developmental needs is\ncollaboratively developed and implemented\n1.3.\nIndividuals are encouraged to self evaluate\nperformance and identify areas for\nimprovement\n1.4.\nFeedback on performance of team\nmembers is collected from relevant sources\nand compared with established team learning\nprocess\n2. Foster individual and\norganizational growth\n2.1.\nLearning and development program goals\nand objectives are identified to match the\nspecific knowledge and skills requirements of\ncompetency standards\n2.2.\nLearning delivery methods are appropriate\nto the learning goals, the learning style of\nparticipants and availability of equipment and\nresources\n2.3.\nWorkplace learning opportunities and\ncoaching/ mentoring assistance are provided\nto facilitate individual and team achievement\nof competencies\n2.4.\nResources and timelines required for learning\nactivities are identified and approved in\naccordance with organizational requirements\n\n--- PDF PAGE 10 ---\n_______________________________________________________________________________________________8\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Monitor and evaluate\nworkplace learning\n3.1.\nFeedback from individuals or teams is used to\nidentify and implement improvements in\nfuture learning arrangements\n3.2.\nOutcomes and performance of\nindividuals/teams are assessed and recorded\nto determine the effectiveness of\ndevelopment programs and the extent of\nadditional support\n3.3.\nModifications to learning plans are negotiated\nto improve the efficiency and effectiveness of\nlearning\n3.4.\nRecords and reports of competency are\nmaintained within organizational requirement\n4. Develop team\ncommitment and\ncooperation\n4.1.\nOpen communication processes to obtain and\nshare information is used by team\n4.2.\nDecisions are reached by the team in\naccordance with its agreed roles and\nresponsibilities\n4.3.\nMutual concern and camaraderie are\ndeveloped in the team\n5. Facilitate\naccomplishment of\norganizational goals\n5.1.\nTeam members actively participated in team\nactivities and communication processes\n5.2.\nTeams members developed individual and\njoint responsibility for their actions\n5.3.\nCollaborative efforts are sustained to attain\norganizational goals\n\n--- PDF PAGE 11 ---\n_______________________________________________________________________________________________9\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning and\n development needs\n\n1.1\nCoaching, mentoring and/or supervision\n1.2\nFormal/informal learning program\n1.3\nInternal/external training provision\n1.4\nWork experience/exchange/opportunities\n1.5\nPersonal study\n1.6\nCareer planning/development\n1.7\nPerformance appraisals\n1.8\nWorkplace skills assessment\n1.9\nRecognition of prior learning\n2. Organizational\n requirements\n2.1 Quality assurance and/or procedures\nmanuals\n2.2 Goals, objectives, plans, systems and\nprocesses\n2.3 Legal and organizational policy/guidelines\nand requirements\n2.3\nSafety policies, procedures and programs\n2.4\nConfidentiality and security requirements\n2.5\nBusiness and performance plans\n2.6\nEthical standards\n2.7\nQuality and continuous improvement\nprocesses and standards\n3. Feedback on\n performance\n3.1\n Formal/informal performance appraisals\n3.2\n Obtaining feedback from supervisors and\n colleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for\nmonitoring service delivery\n4. Learning delivery\n methods\n4.1\nOn the job coaching or mentoring\n4.2\nProblem solving\n4.3\nPresentation/demonstration\n4.4\nFormal course participation\n4.5\nWork experience\n4.6\nInvolvement in professional networks\n4.7\nConference and seminar attendance\n4.8\nInduction\n\n--- PDF PAGE 12 ---\n_______________________________________________________________________________________________10\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for\nothers\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of\nthe team\n1.4. Negotiated learning plans to improve the\neffectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6.\nAccessed and designated learning opportunities\n2. Underpinning\nknowledge\n2.1. Coaching and mentoring principles\n2.2. Understanding how to work effectively with team\nmembers who have diverse work styles, aspirations,\ncultures and perspective\n2.3. Understanding how to facilitate team development\nand improvement\n2.4. Understanding methods and techniques for eliciting\nand interpreting feedback\n2.5. Understanding methods for identifying and\nprioritizing personal development opportunities and\noptions\n2.6. Knowledge of career paths and competency\nstandards in the industry\n3. Underpinning\nskills\n3.1. Ability to read and understand a variety of texts,\nprepare general information and documents\naccording to target audience; spell with accuracy;\nuse grammar and punctuation effective relationships\nand conflict management\n3.2. Communication skills including receiving feedback\nand reporting, maintaining effective relationships and\nconflict management\n3.3. Planning skills to organize required resources and\nequipment to meet learning needs\n3.4. Coaching and mentoring skills to provide support to\ncolleagues\n3.5. Reporting skills to organize information; assess\ninformation for relevance and accuracy; identify and\nelaborate on learning outcomes\n3.6. Facilitation skills to conduct small group training\nsessions\n3.7. Ability to relate to people from a range of social,\ncultural, physical and mental backgrounds\n\n--- PDF PAGE 13 ---\n_______________________________________________________________________________________________11\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Observation of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 14 ---\n_______________________________________________________________________________________________12\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nAPPLY PROBLEM SOLVING TECHNIQUES IN THE\nWORKPLACE\nUNIT CODE\n:\n500311117\nUNIT DESCRIPTOR\n:\nThis competency covers the knowledge, skills and\nattitudes required to apply the process of problem solving\nand other problems beyond those associated directly with\nthe process unit. It includes the application of structured\nprocesses and improvement tools. This competency is\ntypically performed by an experienced technician, team\nleader or supervisor.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1.\nAnalyze the problem\n1.1. Issues/concerns are evaluated based on data\ngathered\n1.2. Possible causes of problem are identified within\nthe area of responsibility as based on\nexperience and the use of problem solving\ntools/analytical techniques\n1.3 Possible cause statements are developed based\non findings\n2.\nIdentify possible\nsolutions\n2.1 All possible options are considered for resolution of\nthe problem in accordance with safety and\noperating procedures\n2.2 Strengths and weaknesses of possible options are\nconsidered\n2.3 Corrective action is determined to resolve the\nproblem and its possible future causes\n3.\nRecommend solution\nto higher\nmanagement\n3.1 Report/communication or documentation are\nprepared\n3.2 Recommendations are presented to appropriate\npersonnel\n3.3 Recommendations are followed-up, if required\n\n--- PDF PAGE 15 ---\n_______________________________________________________________________________________________13\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4.\nImplement solution\n4.1 Measurable objectives are identified\n4.2 Resource needs are identified\n4.3 Timelines are identified in accordance with plan\n5.\nEvaluate/Monitor\nresults and outcome\n5.1. Processes and improvements are identified based\non evaluative assessment of problem\n5.2. Recommendations are prepared and submitted to\nsuperiors.\n\n--- PDF PAGE 16 ---\n_______________________________________________________________________________________________14\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Area of responsibility\nVariables may include but are limited to:\n1.1.\nWork environment\n1.2.\nProblem solution processes\n1.3.\nPreventative maintenance and diagnostic\npolicy\n1.4.\nRoles and technical responsibilities\n2. Occupational Health and\nSafety\n2.1.\nAs per company, statutory and vendor\nrequirements. Ergonomic and\nenvironmental factors must be considered\nduring the demonstration of this\ncompetency.\n3. Communication\n3.1.\nVariables may include but are not limited to:\n3.2.\nWritten communication can involve both\nhand written and printed material, internal\nmemos, electronic mail, briefing notes and\nbulletin boards.\n4. Documentation\n4.1.\nAudit trails\n4.2.\nNaming standards\n4.3.\nVersion control\n\n--- PDF PAGE 17 ---\n_______________________________________________________________________________________________15\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Analyzed the problem\n1.2. Identified possible solutions\n1.3. Implemented solutions\n1.4. Recommended solutions to higher management\n1.5. Outcome evaluated/monitored\nEvidence of satisfactory performance in this unit can be\nobtained by observation of performance and questioning\nto indicate knowledge and understanding of the elements\nof the competency and performance criteria.\n2. Underpinning\nknowledge\n2.1. Broad understanding of systems, organizational\nsystems and functions\n2.2. Broad knowledge of help desk and maintenance\npractices\n2.3. Current industry accepted hardware and software\nproducts with broad and detailed knowledge of its\ngeneral features and capabilities\n2.4. Broad knowledge of the operating system\n2.5. Broad knowledge of the client business domain\n2.6. Broad knowledge based incorporating current\nindustry practices related to escalation procedures\n2.7. Broad knowledge based of diagnostic tools\n2.8 . General principles of OHS\n2.8. Divisional/unit responsibilities\n\n--- PDF PAGE 18 ---\n_______________________________________________________________________________________________16\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n3. Underpinning\nskills\n3.1. Decision making within a limited range of options.\n3.2. Communication is clear, precise and varies\naccording to the type of audience\n3.3. Teamwork in reference to personal responsibility\n3.4. Time management as applied to self-management.\n3.5. Analytical skills in relation to routine malfunctions.\n3.6. General customer service skills displayed.\n3.7. Questioning and active listening is employed to\nclarify general information\n4. Resource\nimplications\n4.1. Assessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of\nscenarios/case studies/what ifs will be required as\nwell as bank of questions which will be used to\nprobe the reasoning behind the observable actions.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Through direct observation of application to tasks\nand questions related to underpinning knowledge\nUnder general guidance, checking various stages of\noperation and at the completion of the activity against\nperformance criteria and specifications\n\n6. Context of\nassessment\n6.1. Competency may be assessed in the work place or\nin a simulated work place setting\n6.2. Assessment shall be carried out through TESDA’s\nAccredited Assessment Centers/Venues while\ntasks are undertaken either individually or as part\nof a team under limited supervision\n\n--- PDF PAGE 19 ---\n_______________________________________________________________________________________________17\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n UNIT OF COMPETENCY : COLLECT, ANALYZE AND ORGANIZE INFORMATION\n\n UNIT CODE : 500311118\n\n UNIT DESCRIPTOR : This unit covers the outcomes required to process, analyze,\ninterpret and organize workplace information and other\nrelevant data.\n.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n\n 1. Study information\nrequirements\n\n 1.1 Needs are identified using established research\nprocedures\n 1.2 Relevant forms and recording systems are used to\ngather the information.\n 1.3 Respondents are selected to implement survey /\nresearch based on established procedures.\n\n 2. Process data\n\n 2.1 Data are collected and collated based on the\nprescribed method.\n 2.2 Relevant data are used as references in\naccordance with the objectives of the program.\n 2.3 Information is compiled according to the required\nform.\n\n3. Analyze, interpret and\norganize information\ngathered\n\n3.1 Data are analyzed using relevant methodologies\n3.2 Where applicable, statistical analysis/methods\nare employed according to the objectives of the\nprogram\n3.3 Graphs and other visual presentations are prepared\nto facilitate analysis / interpretation of information\n\n 4. Present findings/\nrecommendations\n\n 4.1 Findings/recommendations summarized and\npresented/packaged in user-friendly manner\n 4.2 Relevant inputs gathered to finalize report\n 4.3 Draft report prepared based on standard format.\n 4.4 Technical reports are submitted and disseminated\nto concerned offices.\n\n--- PDF PAGE 20 ---\n_______________________________________________________________________________________________18\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n\n1. Research procedures\n May include but are not limited to:\n 1.1 TNA\n 1.2 Front-end analysis\n 1.3 Surveys\n1.4 Interviews\n1.5 Functional analysis\n1.6 DACUM research\n\n 2. Forms\n\n May include but are not limited to:\n 2.1 Survey forms/Questionnaires\n 2.2 Personal information/Profile\n 2.3 Accident report form\n 2.4 Requisition slip\n 2.5 Job orders\n 2.6 Purchase request form\n 2.7 Incident report form\n\n 3. Methodologies\n\n 3.1 Qualitative methods\n 3.2 Quantitative methods\n\n 4. Statistical\nanalysis/methods\n\n 4.1. Averages (Mean, Median, Mode)\n 4.2. Percentage\n 4.3. Ranks\n 4.4. Frequency Distribution\n 4.5 Statistical test\n 5. Data\n 5.1. Raw Data\n 6. Information\n 6.1. Processed and packaged data\n\n--- PDF PAGE 21 ---\n_______________________________________________________________________________________________19\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n Assessment requires evidence that the candidate\n 1.1 Determined information requirements based on\norganizational goals and objectives.\n 1.2 Used relevant forms and recording systems to gather data\n 1.3 Processed data based on the objectives of the program\n 1.4 Utilized relevant research methods based on the objective\nof the program\n 1.5 Analyzed and organized information gathered\n 1.6 Submitted/Disseminated technical reports to concerned\noffices\n 2. Underpinning\nknowledge\n2.1 Data processing, Information analysis and interpretation\n2.2 Research methods\n2.2.1 Qualitative\n2.2.2 Quantitative\n2.2.3 Statistical\n2.3 Report writing\n2.4 Use of relevant software\n2.4.1 Spreadsheets\n2.4.2 Presentation graphics\n2.4.3 Work processor\n2.4.4 Statistical package\n 3. Underpinning skills 3.1 Communicating effectively\n 3.2 Performing research and analysis\n 3.3 Reading / interpreting data and information\n3.4 Problem solving\n 4. Resource\nimplications\n The following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Access to office equipment and facilities relevant to the\nunit\n4.3 Case studies/scenarios\n 5. Method of\nassessment\n\n Competency may be assessed through:\n 5.1 Written/ Oral Examination\n 5.2 Interviews\n 5.3 Portfolio\n 6. Context of\nassessment\n 6.1 Competency may be assessed in actual workplace or\nTESDA Accredited Assessment Center\n\n--- PDF PAGE 22 ---\n_______________________________________________________________________________________________20\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nPLAN AND ORGANIZE WORK\nUNIT CODE\n\n :\n500311119\nUNIT DESCRIPTOR\n :\nThis unit covers the outcomes required in planning and\norganizing work. It may be applied to a small\nindependent operation or to a section of a large\norganization.\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1.\nSet objectives\n1.1\nObjectives are consistent with and linked to\nwork activities in accordance with\norganizational aims\n1.2\nObjectives are stated as measurable targets\nwith clear time frames\n1.3\nSupport and commitment of team members are\nreflected in the objectives\n1.4\nRealistic and attainable objectives are identified\n2.\nPlan and schedule work\nactivities\n2.1\nTasks/work activities to be completed are\nidentified and prioritized as directed\n2.2\nTasks/work activities are broken down into\nsteps in accordance with set time frames\nachievable components in accordance with set\ntime frames\n2.3\nResources are allocated as per requirements\nof the activity\n2.4\nSchedule of work activities is coordinated\nwith personnel concerned\n3.\nImplement work plans\n3.1\nWork methods and practices are identified in\nconsultation with personnel concerned\n3.2\nWork plans are implemented in accordance\nwith set time frames, resources and standards\n\n--- PDF PAGE 23 ---\n_______________________________________________________________________________________________21\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4.\nMonitor work activities 4.1\nWork activities are monitored and compared with\nset objectives\n4.2\nWork performance is monitored\n4.3\nDeviations from work activities are reported and\nrecommendations are coordinated with\nappropriate personnel and in accordance with set\nstandards\n4.4\nReporting requirements are complied with in\naccordance with recommended format\n4.5\nObserve timeliness of report\n4.6\nFiles are established and maintained in\naccordance with standard operating procedures\n5.\nReview and evaluate\nwork plans and\nactivities\n5.1\nWork plans, strategies and implementation are\nreviewed based on accurate, relevant and\ncurrent information\n5.2\nReview is based on comprehensive consultation\nwith appropriate personnel on outcomes of work\nplans and reliable feedback\n5.3\nResults of review are provided to concerned\nparties and formed as the basis for\nadjustments/simplifications to be made to\npolicies, processes and activities\n5.4\nPerformance appraisal is conducted in\naccordance with organization rules and\nregulations\n5.5\nPerformance appraisal report is prepared and\ndocumented regularly as per organization\nrequirements.\n5.6\nRecommendations are prepared and presented\nto appropriate personnel/authorities\n5.7\nFeedback mechanisms are implemented in line\nwith organization policies\n\n--- PDF PAGE 24 ---\n_______________________________________________________________________________________________22\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Objectives\n1.1. Specific\n1.2. General\n2. Resources\n2.1. Personnel\n2.2. Equipment and technology\n2.3. Services\n2.4. Supplies and materials\n2.5. Sources for accessing specialist advice\n2.6.\nBudget\n3. Schedule of work activities\n3.1. Daily\n3.2. Work-based\n3.3. Contractual\n3.4. Regular\n3.5. Confidential\n3.6. Disclosure\n3.7. Non-disclosure\n4. Work methods and\npractices\n4.1. Work methods and practices may include\nbut not limited to:\n4.2. Legislated regulations and codes of\npractice\n