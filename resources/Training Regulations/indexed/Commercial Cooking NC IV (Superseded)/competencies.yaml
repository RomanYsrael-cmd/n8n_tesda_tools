        "source_title": "MANAGE FINANCES WITHIN A BUDGET",
        "source_text": "--- PDF PAGE 47 ---\n_______________________________________________________________________________________________45 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nUNIT OF COMPETENCY : \nMANAGE FINANCES WITHIN A BUDGET \nUNIT CODE \n: \nTRS311212 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes  \n \n \nrequired to take responsibility for budget management \nwhere others may have developed the budget. \n  \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the \nRange of Variables\n1. Allocate budget \nresources \n1.1 Funds are allocated according to agreed priorities. \n1.2 Changes in income and expenditure priorities are \ndiscussed with appropriate colleagues prior to \nimplementation. \n1.3 All relevant personnel are consulted and informed in \nrelation to resource decisions. \n1.4 Awareness of the importance of budget control is \npromoted. \n1.5 Detailed records of resource allocation are \nmaintained in accordance with enterprise control \nsystems.\n2. Monitor financial \nactivities against \nbudget \n2.1 Actual income and expenditure are checked against \nbudgets accurately and at regular intervals. \n2.2 Financial commitments are included in all \ndocumentation to ensure accurate monitoring. \n2.3 Deviations are identified and reported according to \ncompany policy and significance of deviation. \n2.4 Appropriate options for more effective management \nof deviations are investigated. \n2.5 Appropriate colleagues are advised of budget status \nin relation to targets within agreed timeframes.\n\n--- PDF PAGE 48 ---\n_______________________________________________________________________________________________46 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the \nRange of Variables\n3. Identify and \nevaluate options for \nimproved budget \nperformance \n3.1 Existing costs and resources are assessed and areas \nfor improvement are identified. \n3.2 Desired outcomes are discussed with relevant \ncolleagues. \n3.3 Appropriate research is conducted to investigate \nnew approaches. \n3.4 Benefits and disadvantages of new approaches are \ndefined and clearly communicated. \n3.5 Impacts on customer service levels and colleagues \nare considered when developing new approaches. \n3.6 Recommendations are presented clearly and \nlogically to the appropriate person/department.\n4. Complete financial \nreports \n4.1 All required financial reports are completed \naccurately and within designated timelines. \n4.2 Clear and concise information are produced to \nenable informed decision-making. \n4.3 Reports are promptly forwarded to the appropriate \nperson/department.\n\n--- PDF PAGE 49 ---\n_______________________________________________________________________________________________47 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Budgets  \nMay include but not limited to: \n1.1 Cash budgets \n1.2 Departmental budgets \n1.3 Wages budgets \n1.4 Project budgets \n1.5 Purchasing budgets \n1.6 Sales budgets \n1.7 Cashflow budgets \n1.8 Budgets for a small business\n2. Research \nMay include but not limited to: \n2.1 Discussions with existing suppliers \n2.2 Sourcing of new suppliers \n2.3 Evaluation of staffing/rostering requirements \n2.4 Review of operating procedures \n2.5 Potential rostering changes\n3. Financial reports \nMay include but not limited to: \n3.1 Daily, weekly, monthly transactions and \nreports \n3.2 Break-up by department \n3.3 Occupancy \n3.4 Sales performance \n3.5 Commission earnings \n3.6 Sales returns \n3.7 Yield management \n3.8 Commercial account activity\n\n--- PDF PAGE 50 ---\n_______________________________________________________________________________________________48 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge of basic budget principles \nand structures \n1.2 Knows budgeting terminology relevant to a specific \nindustry  context \n1.3 Demonstrated the ability to monitor income and \nexpenditure in accordance with the budget, and to \nidentify ways of improving budget performance \n1.4 Demonstrated understanding of the main types of \nbudget that apply in the specific enterprise or \nindustry context\n2. Underpinning \nknowledge  \n2.1 Budget structure \n2.2 Company and legal requirements in relation to \ndisbursement of funds and record-keeping \n2.3 Budgeting terminology relevant to a specific industry \ncontext \n2.4 Financial reporting procedures and cycles relevant to \nthe enterprise or industry sector\n3. Underpinning \nskills \n3.1 Techniques related to maximizing budget performance \nrelevant to the enterprise or industry sector\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Project or work activities that include the management \nof and reporting on a budget for a specific project or \noperational area over a period of time so that the \nmonitoring and implementation aspects of the unit \ncan be assessed \n4.2 Use of figures and data that reflect the financial \noperating conditions of industry \n4.3 The requirement to evaluate options for improved \nbudget performance\n5. Method of \nassessment \nCompetency may be assessed through \n5.1 Evaluation of financial reports detailing financial \nperformance of projects or activities conducted by \nthe candidate \n5.2 Evaluation of reports produced by the candidate\n\n--- PDF PAGE 51 ---\n_______________________________________________________________________________________________49 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \ndetailing the processes undertaken to manage \nfinances within a budget \n5.3 Case studies and problem solving to assess \napplication of the principles of budget management \nto different situations \n5.4 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate\n6. Context of \nassessment \n6.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
