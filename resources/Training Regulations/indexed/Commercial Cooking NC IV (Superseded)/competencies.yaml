          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to conduct market research,\nidentify current and relevant trends.\n1.2 Demonstrated the ability to cost menus and food items\nand develop menus within budgets.\n1.3 Prepared menus meeting the needs of a range of\ndifferent target markets.\n1.4\nDemonstrated the ability to design all types of menus.\n2. Underpinning\nknowledge\n2.1 Different types and styles of menus for different type of\nfood outlets.\n2.2 Historical development of menus, modern trends in\nmenus.\n2.3 Current food trends, typical cultural and ethnic dining\ninfluences.\n2.4 Product knowledge of commodities required to meet\nmenu needs of particular target groups, seasonal\nproducts.\n2.5 Principle of nutrition, ways of planning nutritionally-\nbalanced menus, the effects of cooking on the nutritional\nvalue of food and the nutritional needs of target groups.\n2.6 Culinary terms used in relation to menus and food items.\n2.7 Sources of information on food service trends.\n2.8 Menu merchandising (lay-out, paper, cala, harmony)\n2.9\nMenu listing (descriptive early)\n3. Underpinning\n\n skills\n3.1 Costing and budgeting techniques for menus.\n3.2 Basic market research techniques in specific relation to\nfood service preferences and trends.\n4. Resource\n\nimplications\nThe following resources must be provided:\n4.1 Project or work activities that allow the candidate to\ndevelop multiple menus to meet a range of target\nmarkets for various catering operations or hospitality\noutlets.\n4.2 Use of current industry costing data and market trend\ninformation.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Review of menus prepared by candidate to meet the\nneeds of different target groups and markets.\n5.2 Case studies to assess ability to develop menus to meet\ndiffering needs.\n5.3 Written or oral questions to test knowledge of marketing\nissues, current trends on food.\n5.4\nReview of portfolios of evidence and third party\n\n--- PDF PAGE 95 ---\n_______________________________________________________________________________________________93\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 96 ---\n_______________________________________________________________________________________________94\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY: DEVELOP A FOOD SAFETY PROGRAM\n\nUNIT CODE\n:"
        },
        "source_text": "TRS512362\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the skills and knowledge to\nuse menu planning as a marketing and\nmanagement tool. It is an extension of skills\nidentified in the unit Plan and control menu-\nbased catering.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Identify and evaluate target\nmarkets for the catering outlet\n1.1 Target markets for the enterprise are\nidentified based on past and current operations\nand performance.\n1.2 Potential target markets are identified based\non review of the current market place and the\nnature and style of the operation.\n1.3 Preference of key markets are evaluated and\nmatched with overall enterprise products and\nservices.\n2. Evaluate market trends in food\nservice\n2.1 Information sources on market trends in food\nservice are identified and accessed.\n2.2 Market trends are evaluated for relevance to\nthe enterprise current and potential markets.\n3. Create menu based on market\nanalysis and within budgetary\nconstraints\n3.1 Relevant market trends are incorporated into\nfood service and menu planning.\n3.2 Menus are developed taking into account\nenterprise operational constraints or\nlimitations.\n3.3 Menus are constructed to meet profitability\ntargets.\n3.4 Menus are developed taking into account the\ndietary instructions of the markets.\n4. Monitor menu performance\n4.1 Customer satisfaction with menus is monitored\nbased on demand patterns and in consultation\nwith customers and operational staff.\n4.2 Menu items are analyzed in terms of sales and\nprofit performance.\n4.3 Menus are adjusted based on feedback and\nprofitability.\n\n--- PDF PAGE 93 ---\n_______________________________________________________________________________________________91\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related\nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens,\ncafes, educational institutions, health establishments, defense forces, corrective\nservices, residential catering, in-flight and other transport catering, events catering and\nprivate catering.\n\nVARIABLE\n\nRANGE\n1. Target markets\nMay include but not limited to:\n1.1 Those with particular nutritional or dietary\nneeds and interests.\n1.2 Young people (elementary, highschool)\n1.3 Older people (professionals, yuppies)\n1.4 Infants/children/adolescent\n1.5 Prison populations\n1.6 Defense forcers\n1.7 Athletes\n1.8 Health care customers (the young and the\nold who is physically challenged)\n1.9 People from specific cultural or religious\ngroups\n1.10 People from different socio-economic\ngroups\n1.11 Students (college)\n2. Market trends in food service\nMay include but not limited to:\n2.1 Contemporary eating habits\n2.2 Media influence\n2.3 Cultural and ethnic influences\n2.4 Seasonal and popular influences\n2.5\nMajor events and festivals\n3. Types of menus\nMay include but not limited to:\n3.1 Table d’hòte\n3.2 Á la carte\n3.3 Set\n3.4 Function\n3.5 Buffet\n3.6 Cyclical\n3.7 Semi- á al carte\n3.8\nCalifornian menu\n\n--- PDF PAGE 94 ---\n_______________________________________________________________________________________________92\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to conduct market research,\nidentify current and relevant trends.\n1.2 Demonstrated the ability to cost menus and food items\nand develop menus within budgets.\n1.3 Prepared menus meeting the needs of a range of\ndifferent target markets.\n1.4\nDemonstrated the ability to design all types of menus.\n2. Underpinning\nknowledge\n2.1 Different types and styles of menus for different type of\nfood outlets.\n2.2 Historical development of menus, modern trends in\nmenus.\n2.3 Current food trends, typical cultural and ethnic dining\ninfluences.\n2.4 Product knowledge of commodities required to meet\nmenu needs of particular target groups, seasonal\nproducts.\n2.5 Principle of nutrition, ways of planning nutritionally-\nbalanced menus, the effects of cooking on the nutritional\nvalue of food and the nutritional needs of target groups.\n2.6 Culinary terms used in relation to menus and food items.\n2.7 Sources of information on food service trends.\n2.8 Menu merchandising (lay-out, paper, cala, harmony)\n2.9\nMenu listing (descriptive early)\n3. Underpinning\n\n skills\n3.1 Costing and budgeting techniques for menus.\n3.2 Basic market research techniques in specific relation to\nfood service preferences and trends.\n4. Resource\n\nimplications\nThe following resources must be provided:\n4.1 Project or work activities that allow the candidate to\ndevelop multiple menus to meet a range of target\nmarkets for various catering operations or hospitality\noutlets.\n4.2 Use of current industry costing data and market trend\ninformation.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Review of menus prepared by candidate to meet the\nneeds of different target groups and markets.\n5.2 Case studies to assess ability to develop menus to meet\ndiffering needs.\n5.3 Written or oral questions to test knowledge of marketing\nissues, current trends on food.\n5.4\nReview of portfolios of evidence and third party\n\n--- PDF PAGE 95 ---\n_______________________________________________________________________________________________93\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 96 ---\n_________________________________________________