              },
              {
                "number": "4.8",
                "text": "Display of appropriate signage and information is ensured. --- PDF PAGE 99 --- _______________________________________________________________________________________________97 TR - COMMERCIAL COOKING NC IV Promulgated April 2007 RANGE OF VARIABLES The following explanations identify how this may be applied in different workplaces, sectors and circumstances. The food safety program systematically identifies the food safety hazards that may be reasonably expected to occur in all food handling operations. It identifies where and how each hazard can be controlled, describes how these controls are to be monitored, the corrective action required if control conditions are not met and information to be recorded. The food safety program must comply with relevant national and local government legislation and ordinances. The food safety plan may be a formal plan or a less-structured program. It may be developed as a stand- alone program or may be integrated with the overall quality program in a workplace. This unit is based around the HACCP system but may also be customized to other systems. VARIABLE RANGE"
