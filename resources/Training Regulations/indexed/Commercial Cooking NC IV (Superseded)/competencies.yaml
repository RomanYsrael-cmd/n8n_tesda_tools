          "source_text": "This unit applies to all hospitality and catering operations where food and related services are provided \nsuch as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health \nestablishments, defense forces, corrective services, residential catering, in-flight and other transport \ncatering, events catering and private catering. \n  \nBasic nutritional requirements generally refer to recommendations made in the dietary guidelines made \nby the Nutritionists and Dietitians Association of the Philippines endorsed by the Philippine Government \nand by other recognized health authorities.  It includes recommendations made for the general public \nincluding senior citizens, children, adolescents, in order to maintain a healthy balanced diet. \n \nSpecial dietary and cultural requirements include therapeutic and contemporary eating regimes as well as \ncustomer requests and preferences, and specific cultural and religious needs. \n \n \nVARIABLE \n \nRANGE \n1.  Relevant persons \nMay include but not limited to: \n1.1 Customers or family members \n1.2 Supervisors and managers \n1.3 Dieticians \n1.4 Diet technicians \n1.5 Health and medical personnel \n1.6\nReligious personnel\n2.  Special dietary requirements \nMay include but not limited to: \n2.1 Vegetarian  \n2.2 Vegan \n2.3 Modified sodium/potassium \n2.4 Low fat/cholesterol \n2.5 Lacto-ovo \n2.6 High fibre \n2.7 Gluten-free \n2.8 High/low energy \n2.9 Diabetic \n2.10 Modified texture \n2.11 High/low protein \n2.12 Fluids \n2.13 Food exclusions for allergies and food \nintolerance. \n2.14 Food exclusions related to specific \nmedications. \n2.15 Pork-free menu for Moslems\n\n--- PDF PAGE 60 ---\n_______________________________________________________________________________________________58 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nVARIABLE \n \nRANGE \n3.  Contemporary eating regimes \nMay include but not limited to: \n3.1 Vegetarian \n3.2 Low-fat or low carbohydrate \n3.3 High-protein \n3.4 Macrobiotic \n3.5 Liver cleansing \n3.6\nElimination\n4.  Special cultural groups \nMay include but not limited to: \n4.1 Kosher \n4.2 Halal \n4.3 Vegetarian \n4.4 Hindu\n\n--- PDF PAGE 61 ---\n_______________________________________________________________________________________________59 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007"
