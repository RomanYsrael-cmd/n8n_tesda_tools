        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to implement and maintain food\nsafety standards and program to enterprise standards\nand in line with legislative requirements.\n1.2 Demonstrated involvement and interaction with a\nkitchen team.\n2. Underpinning\nKnowledge\n2.1 Principles and methods of food production.\n2.2 HACCP based concepts that support food safety\nprogram design.\n2.3 Options for the structure, development and\nimplementation of a food safety program, including\nHACCP.\n2.4 Hygiene and food safety legislation and regulations in\nrelation to food safety program requirements.\n2.5 Local health regulations pertaining to food production\nand packaging.\n2.6 Conditions for development of microbiological\ncontamination and control methods.\n2.7\nPotential staff training needs in relation to food safety.\n3. Underpinning Skills\n3.1 Policies and practices of personal hygiene and food\nhandling.\n3.2 Planning and consultative processes which could be\nused in program development.\n3.3\nFood safety recording requirements and options.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 Project or work activities conducted over a period of\ntime and which allow the candidate to establish and\nmonitor a food safety program for a particular cookery or\ncatering workplace.\n4.2\nInvolvement and interaction with a kitchen team.\n\n--- PDF PAGE 103 ---\n_______________________________________________________________________________________________101\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Review of documentation related to food safety\nsystems, including policies and procedures, audit\nsummaries and reports developed by the candidate.\n5.2 Case studies to assess ability to develop systems to\nmeet differing workplace needs.\n5.3 Activities conducted in conjunction with industry to allow\nthe candidate to develop systems for a real workplace.\n5.4 Written or oral questions about chosen systems and\nreason for selection.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\n\n Assessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 104 ---\n_______________________________________________________________________________________________102\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007"
        },
        "source_text": "TRS512363\n\nUNIT DESCRIPTOR : This unit refers to the development, implementation and\nevaluation of a food safety program for a hospitality or\ncatering operation where food is stored, prepared and\nserved.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Identify needs for the food\nsafety program\n1.1 Characteristics of the enterprise are evaluated,\nincluding:\n Size and nature of organization\n “at risk” client groups\n layout\n menu\n production equipment\n facilities\n re-thermalization and service requirements\n1.2 Food safety hazards or any particular issues\nor risk situations are identified.\n1.3 Existing policies, procedures, practices and\nproduct specifications are evaluated and the\nneed for change or enhancement is assessed.\n2. Develop a food safety\nprogram for a specific\ncommercial catering\nenterprise\n2.1 Food safety program is designed to suit the\ncharacteristics and needs of the enterprise, in\nconsultation with appropriate colleagues and\nstakeholders.\n2.2 Food production flow charts are developed.\n2.3 Critical control points in the food production\nsystem are identified.\n2.4 Methods of control for critical points and\nhazards are established.\n2.5 Standard operational policies and\nprocedures to support the food safety\nprogram, including control procedures and\ncorrective measures, are developed or\nmodified.\n2.6 Product specifications are developed or\nmodified and recorded.\n\n--- PDF PAGE 97 ---\n_______________________________________________________________________________________________95\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n2.7 Product suppliers are identified and quality\nassurance specifications are established.\n2.8 Compliance of the food safety program with\nregulatory requirements and standards is\nensured.\n2.9 Training needs are identified and a training\nplan or program is developed based on needs.\n2.10 Schedule for regular review of the food safety\nprogram is developed.\n3. Implement the food safety\nprogram\n3.1 Food safety programs, policies and procedures\nare communicated to management and\ncolleagues in the workplace.\n3.2 Compliance by all colleagues to policies and\nprocedures is ensured.\n3.3 Practical and user-friendly recording system is\nestablished to document food safety\nperformance.\n3.4 Product specifications are communicated to\nsuppliers and employees and compliance is\nchecked.\n3.5 Appropriate training and mentoring related to\nthe food safety program is organized.\n3.6 Implementation problems are promptly\nidentified and corrective action is taken.\n\n--- PDF PAGE 98 ---\n_______________________________________________________________________________________________96\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n4. Evaluate and revise the food\nsafety program as required\n4.1 Operation and results of the food safety\nprogram are monitored according to schedule\nand in consultation with colleagues and other\nstakeholders.\n4.2 Operational policies, procedures and records\nare reviewed and changes or additions\nrequired are identified.\n4.3 Tests and/or measures to validate required\nsafety standards are carried out.\n4.4 Food safety program is revised to incorporate\namendments or additions.\n4.5 Records are kept to track changes to the food\nsafety program and changes are incorporated\ninto the production system.\n4.6 Colleagues are informed of changes and of\nwhen they commence.\n4.7 Need for additional training based on\nevaluation of the program is identified.\n4.8 Display of appropriate signage and information\nis ensured.\n\n--- PDF PAGE 99 ---\n_______________________________________________________________________________________________97\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThe following explanations identify how this may be applied in different workplaces, sectors and\ncircumstances.\n\nThe food safety program systematically identifies the food safety hazards that may be reasonably\nexpected to occur in all food handling operations. It identifies where and how each hazard can be\ncontrolled, describes how these controls are to be monitored, the corrective action required if control\nconditions are not met and information to be recorded. The food safety program must comply with\nrelevant national and local government legislation and ordinances.\n\nThe food safety plan may be a formal plan or a less-structured program. It may be developed as a stand-\nalone program or may be integrated with the overall quality program in a workplace.\n\nThis unit is based around the HACCP system but may also be customized to other systems.\n\nVARIABLE\n\nRANGE\n1. Establishments\nMay include:\n1.1 Cafeteria/kiosks/canteens/cafes/gourmet food\nshops/restaurants/hotels\n1.2 Fast food outlets\n1.3 Educational institutions\n1.4 Health establishments\n1.5 Mining operations\n1.6 Military forces\n1.7 Corrective services/final institution\n1.8 Residential catering\n1.9 In-flight catering\n1.10 Transport catering\n1.11 Events catering\n1.12 Private catering\n2. Critical control points\nMay include:\n2.1 Receiving\n2.2 Storing\n2.3 Preparing\n2.4 Processing\n2.5 Displaying\n2.6 Packaging\n2.7 Servicing\n2.8\nTransporting\n\n--- PDF PAGE 100 ---\n_______________________________________________________________________________________________98\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n3. Food safety hazards\nMay include:\n3.1 Foods highly susceptible to microbiological\ncontamination\n3.2 Working in temperatures that promote the rapid\ngrowth of micro-organisms\n3.3 Display of food, buffets\n3.4 Processes where food is required to be touched\nby hand\n3.5\nRequirements for re-thermalization or defrosting\n4. “At risk” client groups\nMay include:\n4.1 Patients, residents and clients of health care\nestablishments.\n4.2 Children or babies\n4.3 Pregnant women\n4.4 Aged persons\n4.5\nPeople with immune deficiencies or allergies.\n5. Standard operational procedure\nMay include:\n5.1 Food production procedures\n5.2 Procedures for maintaining records\n5.3 Contingency plans\n5.4 Pest control\n5.5 Cleaning and sanitation programs\n5.6 Equipment maintenance\n5.7 Employee training in hygiene and food handling\n5.8 Maintenance of personal hygiene and suitable\ndress standards.\n6. Contingency plans\nMay include:\n6.1 Food poisoning\n6.2 Customer complaints\n6.3 Rejected food\n6.4 Equipment breakdown\n6.5 Faulty equipment\n6.6\nExistence of pests and vermin\n7. Records\nMay include:\n7.1 Temperature control data\n7.2\nFood production records.\n\n--- PDF PAGE 101 ---\n_______________________________________________________________________________________________99\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n8. Tests and measures to validate\nrequired safety standards\nMay include:\n8.1 Food quality reviews and tests\n8.2 Bacterial swabs and counts\n8.3 Chemical tests\n8.4 Audit arrangements and programs\n8.5 Analysis of and actions arising from critical\nincidents\n\n--- PDF PAGE 102 ---\n_______________________________________________________________________________________________100\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to implement and maintain food\nsafety standards and program to enterprise standards\nand in line with legislative requirements.\n1.2 Demonstrated involvement and interaction with a\nkitchen team.\n2. Underpinning\nKnowledge\n2.1 Principles and methods of food production.\n2.2 HACCP based concepts that support food safety\nprogram design.\n2.3 Options for the structure, development and\nimplementation of a food safety program, including\nHACCP.\n2.4 Hygiene and food safety legislation and regulations in\nrelation to food safety program requirements.\n2.5 Local health regulations pertaining to food production\nand packaging.\n2.6 Conditions for development of microbiological\ncontamination and control methods.\n2.7\nPotential staff training needs in relation to food safety.\n3. Underpinning Skills\n3.1 Policies and practices of personal hygiene and food\nhandling.\n3.2 Planning and consultative processes which could be\nused in program development.\n3.3\nFood safety recording requirements and options.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 Project or work activities conducted over a period of\ntime and which allow the candidate to establish and\nmonitor a food safety program for a particular cookery or\ncatering workplace.\n4.2\nInvolvement and interaction with a kitchen team.\n\n--- PDF PAGE 103 ---\n_______________________________________________________________________________________________101\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Review of documentation related to food safety\nsystems, including policies and procedures, audit\nsummaries and reports developed by the candidate.\n5.2 Case studies to assess ability to develop systems to\nmeet differing workplace needs.\n5.3 Activities conducted in conjunction with industry to allow\nthe candidate to develop systems for a real workplace.\n5.4 Written or oral questions about chosen systems and\nreason for selection.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\n\n Assessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 104 ---\n_______________________________________________________________________________________________102\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007"
