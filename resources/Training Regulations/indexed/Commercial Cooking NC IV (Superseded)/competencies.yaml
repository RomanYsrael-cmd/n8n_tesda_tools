ning skills\n3.1.\nPlanning\n3.2.\nLeading\n3.3.\nOrganizing\n3.4.\nCoordinating\n3.5.\nCommunication Skills\n3.6.\nInter-and intra-person/motivation skills\n3.7.\nPresentation skills\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1.\nTools, equipment and facilities appropriate to the\nproposed activities\n4.2.\nMaterials relevant to the proposed activities\n4.3.\nWork plan schedules\n4.4.\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nDirect observation/questioning\n5.2.\nPractical exercises on Planning and Scheduling\nWork Activities\n5.3.\nThird Party Report (collection of competency\nevidence)\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated work\n\n--- PDF PAGE 27 ---\n_______________________________________________________________________________________________25\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n UNIT OF COMPETENCY : PROMOTE ENVIRONMENTAL PROTECTION\n\n UNIT CODE : 500311120\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nin adhering to environmental protection principles, strategies\nand guidelines\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n 1. Study guidelines for\nenvironmental\nconcerns.\n 1.1 Environmental legislations/conventions and local\nordinances are identified according to the different\nenvironmental aspects/impact.\n 1.2 Industrial standard/environmental practices are\ndescribed according to the different environmental\nconcerns.\n 2. Implement specific\nenvironmental\nprograms.\n2.1 Programs/Activities are identified according to\norganizations policies and guidelines.\n2.2 Individual roles/responsibilities are determined and\nperformed based on the activities identified.\n 2.4 Problems/ constraints encountered are resolved in\naccordance with organizations’ policies and guidelines\n 2.5 Stakeholders are consulted based on company\nguidelines.\n\n 3. Monitor activities on\nenvironmental\nprotection /programs\n 3.1 Activities are periodically monitored and evaluated\naccording to the objectives of the environmental\nprogram\n 3.2 Feedback from stakeholders are gathered and\nconsidered in proposing enhancements to the\nprogram based on consultations\n 3.3 Data gathered are analyzed based on evaluation\nrequirements\n 3.4 Recommendations are submitted based on the\nfindings.\n3.5 Management support systems are\n set/established to sustain and enhance the program\n3.6 Environmental incidents are monitored and reported to\nconcerned/proper authorities\n\n--- PDF PAGE 28 ---\n_______________________________________________________________________________________________26\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n\n 1. Legislations/Conventions\n May include but are not limited to:\n 1.1 Clean Air act\n 1.2 Clean Water Act\n1.3 Solid Waste Management\n1.4 Montreal Protocol\n1.5 Kyoto Protocol\n\n 2. Environmental\naspects/impacts\n2.1 Air pollution\n2.2 Water pollution\n2.3 Noise pollution\n2.4 Solid waste\n2.5 Flood control\n2.6 Deforestation/Denudation\n2.7 Radiation/Nuclear /Radio Frequency/ Microwaves\n2.8 Situation\n2.9 Soil erosion (e.g. Quarrying, Mining, etc.)\n2.10 Coral reef/marine life protection\n\n 3. Industrial standards/\nEnvironmental practices\n3.1 ECC standards\n3.2 ISO standards\n3.3 company environmental management systems\n(EMS)\n\n 4. Periodic\n4.1 hourly\n4.2 daily\n4.3 weekly\n4.4 monthly\n4.5 quarterly\n4.6 yearly\n\n 5. Programs/Activities\n5.1 Waste disposal (on-site and off-site)\n5.2 Repair and maintenance of equipment\n5.3 Treatment and disposal operations\n5.4 Clean-up activities\n5.5 Laboratory and analytical test\n5.6 Monitoring and evaluation\n 5.7 Environmental advocacy programs\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________________