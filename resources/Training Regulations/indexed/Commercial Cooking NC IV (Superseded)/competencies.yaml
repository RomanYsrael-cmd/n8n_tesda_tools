        "source_text": "--- PDF PAGE 19 ---\n_______________________________________________________________________________________________17 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \n  UNIT OF COMPETENCY :   COLLECT, ANALYZE AND ORGANIZE   INFORMATION \n \n  UNIT CODE                      :   500311118 \n \n  UNIT DESCRIPTOR         :  This unit covers the outcomes required to process, analyze, \ninterpret and organize workplace information and other \nrelevant data. \n. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the \nRange of Variables\n \n 1.  Study information \nrequirements  \n  \n 1.1 Needs  are identified  using  established research \nprocedures  \n 1.2 Relevant forms and recording systems are used to \ngather the information. \n 1.3 Respondents are selected to implement survey / \nresearch based on established procedures. \n \n 2. Process data   \n  \n 2.1 Data are collected and collated based on the \nprescribed method. \n 2.2 Relevant data are used as references in \naccordance with the objectives of the program. \n 2.3  Information is compiled according to the required \nform.  \n \n3.  Analyze, interpret and \norganize information \ngathered  \n  \n3.1 Data are analyzed using relevant   methodologies\n3.2  Where applicable, statistical analysis/methods \nare employed  according to the objectives of the \nprogram \n3.3 Graphs and other visual presentations are prepared \nto facilitate analysis / interpretation of information\n  \n 4.  Present findings/ \nrecommendations   \n  \n 4.1 Findings/recommendations summarized and \npresented/packaged in user-friendly manner \n 4.2 Relevant inputs gathered to finalize report  \n 4.3 Draft report prepared based on standard format. \n 4.4 Technical reports are submitted and disseminated \nto concerned offices.\n\n--- PDF PAGE 20 ---\n_____________________________________________