        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated effective communication skills with\nclients accessing service and work colleagues\n1.2\nAdopted relevant communication techniques and\nstrategies to meet client particular needs and\ndifficulties\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nDynamics of groups and different styles of group\nleadership\n2.3\nCommunication skills relevant to client groups\n3. Underpinning\nskills\n3.1\nFull range of communication techniques including:\n3.1.1\nFull range of communication\n3.1.2\nActive listening\n3.1.3\nFeedback\n3.1.4\nInterpretation\n3.1.5\nRole boundaries setting\n3.1.6\nNegotiation\n3.1.7\nEstablishing empathy\n3.2\nCommunication skills required to fulfill job roles as\nspecified by the organization\n4. Resource\nimplications\n4.1\nAccess to appropriate workplace where assessment\ncan take place\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1\nDirect observation\n5.2\nOral Interview\n6. Context of\nassessment\n6.1\nThis unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 9 ---\n_______________________________________________________________________________________________7\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nDEVELOP TEAMS AND INDIVIDUALS\nUNIT CODE\n:"
        },
        "source_text": "500311115\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to use specialized communication skills to meet\nspecific needs of internal and internal clients, conduct\ninterviews, facilitate group of discussions, and contribute\nto the development of communication strategies.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Meet common and\nspecific\ncommunication\nneeds of clients and\ncolleagues\n1.1\nSpecific communication needs of clients and\ncolleagues are identified and met\n1.2\nDifferent approaches are used to meet\ncommunication needs of clients and colleagues\n1.3\nConflict is addressed promptly and in a timely way\nand in a manner which does not compromise the\nstanding of the organization\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1\nStrategies for internal and external dissemination\nof information are developed, promoted,\nimplemented and reviewed as required\n2.2\nChannels of communication are established and\nreviewed regularly\n2.3\nCoaching in effective communication is provided\n2.4\nWork related network and relationship are\nmaintained as necessary\n2.5\nNegotiation and conflict resolution strategies are\nused where required\n2.6\nCommunication with clients and colleagues is\nappropriate to individual needs and organizational\nobjectives\n\n--- PDF PAGE 6 ---\n_______________________________________________________________________________________________4\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Represent the\norganization\n3.1\nWhen participating in internal or external forums,\npresentation is relevant, appropriately researched\nand presented in a manner to promote the\norganization\n3.2\nPresentation is clear and sequential and delivered\nwithin a predetermined time\n3.3\nUtilize appropriate media to enhance presentation\n3.4\nDifferences in views are respected\n3.5\nWritten communication is consistent with\norganizational standards\n3.6\nInquiries are responded in a manner consistent\nwith organizational standard\n4. Facilitate group\ndiscussion\n4.1\nMechanisms which enhance effective group\ninteraction is defined and implemented\n4.2\nStrategies which encourage all group members to\nparticipate are used routinely\n4.3\nObjectives and agenda for meetings and\ndiscussions are routinely set and followed\n4.4\nRelevant information is provided to group to\nfacilitate outcomes\n4.5\nEvaluation of group communication strategies is\nundertaken to promote participation of all parties\n4.6\nSpecific communication needs of individuals are\nidentified and addressed\n5. Conduct interview\n5.1\nA range of appropriate communication strategies\nare employed in interview situations\n5.2\nRecords of interviews are made and maintained in\naccordance with organizational procedures\n5.3\nEffective questioning, listening and nonverbal\ncommunication techniques are used to ensure that\nrequired message is communicated\n\n--- PDF PAGE 7 ---\n_______________________________________________________________________________________________5\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\n1.1\nRecognizing own limitations\n1.2\nReferral to specialists\n1.3\nUtilizing techniques and aids\n1.4\nProviding written drafts\n1.5\nVerbal and non verbal communication\n2. Effective group interaction\n2.1\nIdentifying and evaluating what is\noccurring within an interaction in a non\njudgmental way\n2.2\nUsing active listening\n2.3\nMaking decision about appropriate words,\nbehavior\n2.4\nPutting together response which is\nculturally appropriate\n2.5\nExpressing an individual perspective\n2.6\nExpressing own philosophy, ideology and\nbackground and exploring impact with\nrelevance to communication\n3. Types of Interview\n3.1\nRelated to staff issues\n3.2\nRoutine\n3.3\nConfidential\n3.4\nEvidential\n3.5\nNon disclosure\n3.6\nDisclosure\n4. Interview situations\n4.1\nEstablish rapport\n4.2\nElicit facts and information\n4.3\nFacilitate resolution of issues\n4.4\nDevelop action plans\n4.5\nDiffuse potentially difficult situation\n\n--- PDF PAGE 8 ---\n_______________________________________________________________________________________________6\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated effective communication skills with\nclients accessing service and work colleagues\n1.2\nAdopted relevant communication techniques and\nstrategies to meet client particular needs and\ndifficulties\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nDynamics of groups and different styles of group\nleadership\n2.3\nCommunication skills relevant to client groups\n3. Underpinning\nskills\n3.1\nFull range of communication techniques including:\n3.1.1\nFull range of communication\n3.1.2\nActive listening\n3.1.3\nFeedback\n3.1.4\nInterpretation\n3.1.5\nRole boundaries setting\n3.1.6\nNegotiation\n3.1.7\nEstablishing empathy\n3.2\nCommunication skills required to fulfill job roles as\nspecified by the organization\n4. Resource\nimplications\n4.1\nAccess to appropriate workplace where assessment\ncan take place\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1\nDirect observation\n5.2\nOral Interview\n6. Context of\nassessment\n6.1\nThis unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 9 ---\n_______________________________________________________________________________________________7\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nDEVELOP TEAMS AND INDIVIDUALS\nUNIT CODE\n:"
      },
