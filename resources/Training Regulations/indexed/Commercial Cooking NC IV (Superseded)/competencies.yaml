        "source_text": "--- PDF PAGE 52 ---\n_______________________________________________________________________________________________50 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nUNIT OF COMPETENCY : \nMANAGE QUALITY CUSTOMER SERVICE \nUNIT CODE \n: \nTRS311213 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes  \n \n \nrequired to manage customer service quality in the \nworkplace within a tourism or hospitality context.  It \nfocuses on the need to develop active approaches to \nservice quality issues with some strategic focus. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the \nRange of Variables\n1. Develop approaches \nto enhance \ncustomer service \nquality \n1.1 Information on customer needs, expectations and \nsatisfaction levels is obtained using both informal \nand formal research. \n1.2 Opportunities are provided for both customers and \ncolleagues to provide feedback on products and \nservices. \n1.3 Changes in internal and external environments \nare reviewed and findings are integrated into \nplanning for quality service. \n1.4 Opportunities are provided for colleagues to \nparticipate in the customer service planning \nprocess. \n1.5 Standards and plans are developed to address key \nquality service issues.\n2. Manage the delivery \nof quality service \n2.1 Customer service standards and expectations are \nclearly communicated to colleagues. \n2.2 Access to information on service standards and \ndelivery is provided to colleagues. \n2.3 Coaching is used to assist colleagues to deal with \ncustomer service issues and to take \nresponsibility for service outcomes. \n2.4 Customer service in the workplace is monitored to \nensure standards are met in accordance with \nenterprise policies and procedures.\n\n--- PDF PAGE 53 ---\n_______________________________________________________________________________________________51 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the \nRange of Variables\n3. Monitor and adjust \ncustomer service \n3.1 Feedback is sought from customers on an ongoing \nbasis and this is used to improve performance \nwhere applicable. \n3.2 Customer service problems are identified and \nadjustments to standards, systems and \nprocedures are made to ensure continued service \nquality. \n3.3 New approaches are communicated to all those \ninvolved in service delivery within appropriate \ntimeframes.\n\n--- PDF PAGE 54 ---\n_______________________________________________________________________________________________52 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Informal and formal \nresearch  \nMay include but not limited to: \n1.1 Talking to customers \n1.2 Qualitative or quantitative research \n1.3 Seeking feedback from service delivery \ncolleagues \n1.4 Analysis of competitive environment \n1.5 Analysis of industry and market trends\n2. Changes in internal and \nexternal environments \nMay include but not limited to: \n2.1 Management changes \n2.2 Organizational restructuring \n2.3 Introduction of new equipment \n2.4 Recruitment practices \n2.5 Technological changes affecting service \ndelivery \n2.6 Changes in the competitive environment \n2.7 Economic climate \n2.8 Trends in customer preferences \n2.9 Advent of E-business\n3. Customer service \nstandards/ Customer \nservice issues \nMay include but not limited to: \n3.1 Response times \n3.2 Service guarantees \n3.3 Pricing guarantees \n3.4 Product quality \n3.5 Document presentation standards \n3.6 Personal presentation standards \n3.7 Complaint management\n\n--- PDF PAGE 55 ---\n_______________________________________________________________________________________________53 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated the ability to develop proactive \napproaches to the delivery and monitoring of quality \ncustomer service within a specific tourism/hospitality \ncontext \n1.2 Demonstrated knowledge of quality service principles \nand processes\n2. Underpinning \nknowledge  \n2.1 Roles and responsibilities of management in ensuring \nquality service within an enterprise \n2.2 The concept of total quality service and total quality \nmanagement \n2.3 The role of continuous improvement and benchmarking \nin quality assurance \n2.4 Overview of the range of market research techniques \nused to gain information on customer preferences \n2.5 Legislation that impacts on customer service standards \nand delivery \n2.6 Industry schemes that impact on customer service \nstandards and delivery (e.g. accreditation schemes, \ncodes of conduct)\n3. Underpinning \nskills \n3.1 Application of total quality service and total quality \nmanagement in a tourism or hospitality context \n3.2 Methods of implementing quality assurance in the \nworkplace including: \n3.2.1 \nEstablishing standards \n3.2.2 \nMonitoring \n3.2.3 \nStaff involvement and reward \n3.2.4 \nEvaluation \n3.3 Application of continuous improvement and/or \nbenchmarking in a tourism or hospitality context\n\n--- PDF PAGE 56 ---\n_______________________________________________________________________________________________54 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \n4. Resource \nimplications \nThe following resources must be provided: \n4.1 Project or work activities conducted over a period of \ntime to allow the candidate to establish, monitor and \nevaluate service delivery in a tourism or hospitality \ncontext \n4.2 Involvement of a team for which the candidate is leader\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Evaluation of projects managed by the candidate in \nconjunction with industry to enhance service delivery \nin a given operation \n5.2 Evaluation of projects managed by the candidate to \ncreate, market and deliver a tourism or hospitality \nservice \n5.3 Case studies to assess specific service delivery issues \nin different workplace contexts \n5.4 Oral or written questions to assess knowledge of \nquality assurance concepts and principles \n5.5 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate\n6. Context of \nassessment \n6.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
