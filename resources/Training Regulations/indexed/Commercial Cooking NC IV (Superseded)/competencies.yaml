          "source_text": "1. \nSet objectives \n1.1 \nObjectives are consistent with and linked to \nwork activities in accordance with \norganizational aims \n1.2 \nObjectives are stated as measurable targets \nwith clear time frames \n1.3 \nSupport and commitment of team members are \nreflected in the objectives   \n1.4\nRealistic and attainable objectives are identified \n2. \nPlan and schedule work \nactivities \n2.1 \nTasks/work activities to be completed are \nidentified and prioritized as directed \n2.2 \nTasks/work activities are broken down into \nsteps in accordance with set time frames \nachievable components in accordance with set \ntime frames \n2.3 \nResources are allocated as per requirements \nof the activity \n2.4 \nSchedule of work activities is coordinated \nwith personnel concerned\n3. \nImplement work plans \n3.1 \nWork methods and practices are identified in \nconsultation with personnel concerned \n3.2 \nWork plans are implemented in accordance \nwith set time frames, resources and standards\n\n--- PDF PAGE 23 ---\n_______________________________________________________________________________________________21 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the  \nRange of Variables\n4. \nMonitor work activities 4.1 \nWork activities are monitored and compared with \nset objectives \n4.2 \nWork performance is monitored \n4.3 \nDeviations from work activities are reported and \nrecommendations are coordinated with \nappropriate personnel and in accordance with set \nstandards \n4.4 \nReporting requirements are complied with in \naccordance with recommended format \n4.5 \nObserve timeliness of report \n4.6 \nFiles are established and maintained in \naccordance with standard operating procedures\n5. \nReview and evaluate \nwork plans and \nactivities \n5.1 \nWork plans, strategies and implementation are \nreviewed  based on accurate, relevant and \ncurrent information \n5.2 \nReview is based on comprehensive consultation \nwith appropriate personnel on outcomes of work \nplans and reliable feedback \n5.3 \nResults of review are provided to concerned \nparties and formed as the basis for \nadjustments/simplifications to be made to \npolicies, processes and activities \n5.4 \nPerformance appraisal is conducted in \naccordance with organization rules and \nregulations \n5.5 \nPerformance appraisal report is prepared and \ndocumented regularly as per organization \nrequirements. \n5.6 \nRecommendations are prepared and presented \nto appropriate personnel/authorities \n5.7 \nFeedback mechanisms are implemented in line \nwith organization policies\n\n--- PDF PAGE 24 ---\n_______________________________________________________________________________________________22 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Objectives  \n1.1. Specific \n1.2. General \n2. Resources \n2.1. Personnel \n2.2. Equipment and technology \n2.3. Services \n2.4. Supplies and materials \n2.5. Sources for accessing specialist advice \n2.6.\nBudget\n3. Schedule of work activities\n3.1. Daily \n3.2. Work-based \n3.3. Contractual \n3.4. Regular \n3.5.    Confidential  \n3.6.     Disclosure \n3.7.     Non-disclosure\n4. Work methods and \npractices \n4.1. Work methods and practices may include \nbut not limited to: \n4.2. Legislated regulations and codes of \npractice \n4.3. Industry regulations and codes of practice \n4.4.\nOccupational health and safety practices  \n5. Work plans \n5.1. Daily work plans \n5.2. Project plans \n5.3. Program plans \n5.4. Organization strategic and restructuring \nplans \n5.5. Resource plans \n5.6. Skills development plans \n5.7.\nManagement strategies and objectives\n\n--- PDF PAGE 25 ---\n____________________