 the\nperformance of practical tasks or processes or\nsimulation exercises\n5.2 Specific instructions to be given in relation to\nprojects and exercises\n5.3 Sets of oral/written/computer based questions\nto be asked\n5.4 Performance checklists\n5.5 Log books\n5.6 Marking guides\n5.7 Descriptions of competent performance\n\n6. Allowable adjustments\nMay include but is not limited to:\n6.1 Use of adaptive technology or special\nequipment to accommodate special needs of\npersons with disabilities\n6.2 Design of shorter assessment sessions to\nallow for fatigue or medication\n6.3 Use of large print version of any papers\n\n--- PDF PAGE 38 ---\n_______________________________________________________________________________________________36\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\nRANGE\n7. Assessment system\nMay be developed by:\n7.11 The industry\n7.12 The company\n 7.13 A registered training organization\n7.14 Combination of the above\nShould specify the following:\n7.21 Purpose of assessment\n7.22 Competencies required of assessors\n7.23 Record-keeping procedures and policies\n7.24 Any allowable adjustments to the assessment\nmethod which may be made\n7.25 The appeal/review mechanisms and\nprocedures\n7.26 The review and evaluation of the assessment\nprocess\n7.27 The linkages between assessment and\ntraining qualifications/awards, employee\nclassification, remuneration, progression\n7.28 Relevant policies\n7.29 Quality assurance mechanisms\n7.30 Appointment of costs/fees, if applicable\n7.31 Marketing/promotion of assessment\n7.32 Verification arrangements\n7.33 Partnership arrangements, if applicable\n\n--- PDF PAGE 39 ---\n_______________________________________________________________________________________________37\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\nRANGE\n8. Characteristics of persons\nbeing assessed\nMay include but is not limited to:\n8.1 Language literacy and numeracy needs\n8.2 Cultural, language and educational\nbackground\n8.3 Gender\n8.4 Physical ability\n8.5 Level of confidence, nervousness or anxiety\n8.6 Age\n8.7 Experience in training and assessment\n8.8 Previous experience with the topic\n9. Recording procedures\nMay include but is not limited to:\n9.1 Forms designed for the specific assessment\nresult (paper or electronic)\n9.2 Checklists for recording observations/process\nused (paper or electronic)\n9.3 Combination of the above\n10. Assessment reporting\nShould include:\n10.1 The unit/s of competencies in terms of code,\ntitle and endorsement date\n10.2 Summative assessment reports, where\nissued, will indicate units of competency\nwhere additional learning is required\n\n--- PDF PAGE 40 ---\n_______________________________________________________________________________________________38\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n1.1 Assessment requires evidence of the following\nproducts to be collected:\n1.11 Description\nof\nthe\nassessment\ncontext,\nincluding the purpose of assessment\n1.12 The relevant competency or other performance\nstandard and assessment procedure used\n1.13 Description of how evidence gathered is valid,\nauthentic, sufficient, fair and reliable to ensure\ncompetency\n1.14 Conduct of assessment in accordance with\ncompetency requirements\n1.15 Recording\nof\nthe\nassessment\nresults\nin\naccordance with the specified assessment\nprocedure and record keeping requirements\n1.16 Report on the conduct of the assessment,\nincluding positive and negative features and\nsuggestions for improving any aspect of the\nassessment process.\n1.2 Assessment requires evidence of the following\nprocesses to be provided:\n1.21 How agreement was sought with the person/s\nbeing assessed on the conduct of the\nassessment\n1.22 How opportunities to gather evidence were\nidentified as part of workplace or training\nactivities\n1.23 How evidence was gathered in accordance with\nthe assessment procedure\n1.24 How evidence gathering activity covered the\ndimensions of competency\n1.25 How resources were arranged according to the\nassessment procedure\n1.26 How appropriate personnel were consulted\n\n--- PDF PAGE 41 ---\n_______________________________________________________________________________________________39\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n1.27 How evidence was gathered in accordance with\nallowable adjustments to the assessment\nmethod where applicable\n1.28 How evidence was evaluated in terms of\nvalidity, authenticity, sufficiency, currency and\nconsistent achievement of specified standard\n1.29 How the assessment was conducted to ensure\nthat:\n• The person was put at ease and the\nsupportive\nassessment\nenvironment\nwas\ncreated\n• The language, literacy and numeracy issues\nwere taken into consideration\n1.30\nHow constructive feedback was provided to\nthe\nperson/s\nbeing\nassessed,\nincluding\ninstances of not yet competent\n1.31\nHow guidance was provided to person/s being\nassessed on how to overcome gaps in\ncompetency revealed\n2. Underpinning\nKnowledge\n2.1 Workplace application of relevant standards of\nperformance including industry or company competency\nstandards and assessment guideline\n2.2 Ethical responsibilities including health, safety and\nsecurity regulations and procedures relevant to the\nspecific context\n2.3 Understanding of policies and procedures of the\nworkplace and/or job role together with any related\nlegislation or regulatory requirements\n2.4 Understanding of the assessment principles of reliability,\nvalidity, fairness, flexibility, authenticity, sufficiency and\nconsistency\n3. Underpinning\nSkills\n3.1 Planning of own work including predicting\nconsequences and identifying improvements\n3.2 Skills in the application of various assessment\nmethods/tools relevant to workplace context\n3.3 Language, literacy and numeracy skills required to:\n3.4 Give clear and precise instructions and information in\n\n--- PDF PAGE 42 ---\n_______________________________________________________________________________________________40\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nspoken or written form\n3.5 Seek confirmation of understanding from the person/s\nbeing assessed\n3.6 Adjust language to suit target audience\n3.7 Prepare required documentation using clear and\ncomprehensible language and layout\n3.8 Ask probing questions and listen actively to understand\nresponses of the persons being assessed\n3.9 Seek additional information for clarification purposes\n3.10 Use verbal and nonverbal language to promote a\nsupportive assessment environment\n3.11 Use language of negotiation and conflict resolution to\nminimize conflict\n3.12 Communication skills appropriate to the culture of the\nworkplace and the individual\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Assessment on the job or in a simulated workplace\n4.2 Use by assessors of competencies relevant to their\nareas of technical expertise\n4.3\nAccess\nto\nrelevant\ncompetencies,\nsources\nof\ninformation on assessment methods, assessment tools\nand assessment procedures\n4.4 Access to person/s wishing to be assessed, relevant\nworkplace equipment, information and appropriate\npersonnel\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Work samples and/or simulations\n5.2 Direct observation of performance, products, practical\ntasks, projects and simulation exercises\n5.3 Review of logbooks and/or portfolios\n5.4 Questioning\n5.5 Consideration of third party reports and authenticated\nprior achievements\n5.6 Written, oral or computer-managed questioning\n\n--- PDF PAGE 43 ---\n_______________________________________________________________________________________________41\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n6. Context for\nAssessment\n1.1\nIn all workplace, it may be appropriate to assess this\nunit\nconcurrently\nwith\nrelevant\nteamwork\nor\noperation units.\n1.2\nAssessment shall be observed while tasks are being\nundertaken whether individually or in a group.\n\n--- PDF PAGE 44 ---\n_______________________________________________________________________________________________42\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nMANAGE WORKPLACE DIVERSITY\nUNIT CODE\n:\nTRS311211\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, behavior and\nmotivations required to provide leadership in a diverse\nworkplace where customers and staff are from a wide\nrange of backgrounds. It builds on the unit “Work in a\nsocially\ndiverse\nenvironment,”\nand\nreflects\nthe\nimportance of managing diversity in the hospitality\nindustry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Encourage respect for\ndiversity in the\nworkplace\n1.1. A role model is provided for others through\nindividual behavior that demonstrates respect\nfor diversity.\n1.2. Work practices are developed and planning is\nundertaken in a manner which shows respect\nfor workplace diversity.\n1.3. Colleagues are assisted and coached in ways\nof accepting diversity in relation to both\ncolleagues and guests.\n2. Use diversity as an\nasset\n2.1. The skills of a diverse workforce are recognized\nand used to enhance company performance.\n2.2. The benefits of productive diversity are\npromoted to colleagues.\n3. Deal with problems\narising from diversity\nissues\n3.1. Workplace problems that arise from diversity\nissues are recognized promptly and action is\ntaken to resolve the situation.\n3.2. Training needs are identified and appropriate\naction is taken.\n3.3. Coaching and mentoring are used to assist\ncolleagues to successfully work in a diverse\nenvironment.\n\n--- PDF PAGE 45 ---\n_______________________________________________________________________________________________43\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Diversity\n\nMay include but is not limited to:\n1.10\nRace\n1.11\nLanguage\n1.12\nReligion\n1.13\nSpecial needs\n1.14\nDisabilities\n1.15\nFamily structure\n1.16\nGender\n1.17\nAge\n1.18\nSexual preference\n2. Work practices that reflect\nrespect for diversity\nMay include but is not limited to:\n2.1\nAcknowledgement of religious and cultural\ncelebrations\n2.2\nAppropriate allocation of duties to\nparticular staff members\n2.3\nCulturally appropriate mixing of staff\n2.4\nTraining in culturally-appropriate\ncommunication\n2.5\nConsideration of customers with special\nneeds\n3. Benefits of productive\ndiversity\nMay include but is not limited to:\n3.3\nA multilingual workforce\n3.4\nWorkforce that reflects the diversity of the\ncustomer base\n3.5\nImproved cross-cultural communication\n3.6\nEducation of the workforce\n3.7\nRemoval of prejudice\n3.8\nDifferent perspectives on problem solving\n3.9\nIncrease trade with other countries/cultures\n3.10 More interesting work environments\n\n--- PDF PAGE 46 ---\n_______________________________________________________________________________________________44\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical\naspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated understanding of the role of leaders and\nmanagers in encouraging diversity in the hospitality\nindustry\n1.2. Demonstrated knowledge of cross-cultural\ncommunication techniques as they apply to leaders\nand managers\n1.3. Demonstrated knowledge of specific cultural issues\nthat may apply in a particular industry context\n2. Underpinning\nKnowledge\n2.1. Specific diversity issues which apply to the hospitality\nindustry and which contribute to the industry’s\nprogress including benefits of productive diversity\n3. Underpinning\nSkills\n3.1. Cross-cultural communication skills with specific\nreference to the roles of leaders and managers\nincluding cross-cultural communication for:\n• Conflict resolution\n• Problem-solving\n• Negotiation\n•Motivation\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Project or work activities that allow the candidate to\naddress typical diversity issues found in hospitality\nworkplaces\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies to develop strategies for effectively\nmanaging diversity in different industry contexts\n5.2. Oral or written questions to assess knowledge of\ncross-cultural issues and communication techniques\n5.3. Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context for\nAssessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 47 ---\n_______________________________________________________________________________________________45\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nMANAGE FINANCES WITHIN A BUDGET\nUNIT CODE\n:\nTRS311212\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to take responsibility for budget management\nwhere others may have developed the budget.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Allocate budget\nresources\n1.1 Funds are allocated according to agreed priorities.\n1.2 Changes in income and expenditure priorities are\ndiscussed with appropriate colleagues prior to\nimplementation.\n1.3 All relevant personnel are consulted and informed in\nrelation to resource decisions.\n1.4 Awareness of the importance of budget control is\npromoted.\n1.5 Detailed records of resource allocation are\nmaintained in accordance with enterprise control\nsystems.\n2. Monitor financial\nactivities against\nbudget\n2.1 Actual income and expenditure are checked against\nbudgets accurately and at regular intervals.\n2.2 Financial commitments are included in all\ndocumentation to ensure accurate monitoring.\n2.3 Deviations are identified and reported according to\ncompany policy and significance of deviation.\n2.4 Appropriate options for more effective management\nof deviations are investigated.\n2.5 Appropriate colleagues are advised of budget status\nin relation to targets within agreed timeframes.\n\n--- PDF PAGE 48 ---\n_______________________________________________________________________________________________46\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Identify and\nevaluate options for\nimproved budget\nperformance\n3.1 Existing costs and resources are assessed and areas\nfor improvement are identified.\n3.2 Desired outcomes are discussed with relevant\ncolleagues.\n3.3 Appropriate research is conducted to investigate\nnew approaches.\n3.4 Benefits and disadvantages of new approaches are\ndefined and clearly communicated.\n3.5 Impacts on customer service levels and colleagues\nare considered when developing new approaches.\n3.6 Recommendations are presented clearly and\nlogically to the appropriate person/department.\n4. Complete financial\nreports\n4.1 All required financial reports are completed\naccurately and within designated timelines.\n4.2 Clear and concise information are produced to\nenable informed decision-making.\n4.3 Reports are promptly forwarded to the appropriate\nperson/department.\n\n--- PDF PAGE 49 ---\n_______________________________________________________________________________________________47\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Budgets\nMay include but not limited to:\n1.1 Cash budgets\n1.2 Departmental budgets\n1.3 Wages budgets\n1.4 Project budgets\n1.5 Purchasing budgets\n1.6 Sales budgets\n1.7 Cashflow budgets\n1.8 Budgets for a small business\n2. Research\nMay include but not limited to:\n2.1 Discussions with existing suppliers\n2.2 Sourcing of new suppliers\n2.3 Evaluation of staffing/rostering requirements\n2.4 Review of operating procedures\n2.5 Potential rostering changes\n3. Financial reports\nMay include but not limited to:\n3.1 Daily, weekly, monthly transactions and\nreports\n3.2 Break-up by department\n3.3 Occupancy\n3.4 Sales performance\n3.5 Commission earnings\n3.6 Sales returns\n3.7 Yield management\n3.8 Commercial account activity\n\n--- PDF PAGE 50 ---\n_______________________________________________________________________________________________48\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of basic budget principles\nand structures\n1.2 Knows budgeting terminology relevant to a specific\nindustry context\n1.3 Demonstrated the ability to monitor income and\nexpenditure in accordance with the budget, and to\nidentify ways of improving budget performance\n1.4 Demonstrated understanding of the main types of\nbudget that apply in the specific enterprise or\nindustry context\n2. Underpinning\nknowledge\n2.1 Budget structure\n2.2 Company and legal requirements in relation to\ndisbursement of funds and record-keeping\n2.3 Budgeting terminology relevant to a specific industry\ncontext\n2.4 Financial reporting procedures and cycles relevant to\nthe enterprise or industry sector\n3. Underpinning\nskills\n3.1 Techniques related to maximizing budget performance\nrelevant to the enterprise or industry sector\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Project or work activities that include the management\nof and reporting on a budget for a specific project or\noperational area over a period of time so that the\nmonitoring and implementation aspects of the unit\ncan be assessed\n4.2 Use of figures and data that reflect the financial\noperating conditions of industry\n4.3 The requirement to evaluate options for improved\nbudget performance\n5. Method of\nassessment\nCompetency may be assessed through\n5.1 Evaluation of financial reports detailing financial\nperformance of projects or activities conducted by\nthe candidate\n5.2 Evaluation of reports produced by the candidate\n\n--- PDF PAGE 51 ---\n_______________________________________________________________________________________________49\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\ndetailing the processes undertaken to manage\nfinances within a budget\n5.3 Case studies and problem solving to assess\napplication of the principles of budget management\nto different situations\n5.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context of\nassessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 52 ---\n_______________________________________________________________________________________________50\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nMANAGE QUALITY CUSTOMER SERVICE\nUNIT CODE\n:\nTRS311213\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to manage customer service quality in the\nworkplace within a tourism or hospitality context. It\nfocuses on the need to develop active approaches to\nservice quality issues with some strategic focus.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Develop approaches\nto enhance\ncustomer service\nquality\n1.1 Information on customer needs, expectations and\nsatisfaction levels is obtained using both informal\nand formal research.\n1.2 Opportunities are provided for both customers and\ncolleagues to provide feedback on products and\nservices.\n1.3 Changes in internal and external environments\nare reviewed and findings are integrated into\nplanning for quality service.\n1.4 Opportunities are provided for colleagues to\nparticipate in the customer service planning\nprocess.\n1.5 Standards and plans are developed to address key\nquality service issues.\n2. Manage the delivery\nof quality service\n2.1 Customer service standards and expectations are\nclearly communicated to colleagues.\n2.2 Access to information on service standards and\ndelivery is provided to colleagues.\n2.3 Coaching is used to assist colleagues to deal with\ncustomer service issues and to take\nresponsibility for service outcomes.\n2.4 Customer service in the workplace is monitored to\nensure standards are met in accordance with\nenterprise policies and procedures.\n\n--- PDF PAGE 53 ---\n_______________________________________________________________________________________________51\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n3. Monitor and adjust\ncustomer service\n3.1 Feedback is sought from customers on an ongoing\nbasis and this is used to improve performance\nwhere applicable.\n3.2 Customer service problems are identified and\nadjustments to standards, systems and\nprocedures are made to ensure continued service\nquality.\n3.3 New approaches are communicated to all those\ninvolved in service delivery within appropriate\ntimeframes.\n\n--- PDF PAGE 54 ---\n_______________________________________________________________________________________________52\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Informal and formal\nresearch\nMay include but not limited to:\n1.1 Talking to customers\n1.2 Qualitative or quantitative research\n1.3 Seeking feedback from service delivery\ncolleagues\n1.4 Analysis of competitive environment\n1.5 Analysis of industry and market trends\n2. Changes in internal and\nexternal environments\nMay include but not limited to:\n2.1 Management changes\n2.2 Organizational restructuring\n2.3 Introduction of new equipment\n2.4 Recruitment practices\n2.5 Technological changes affecting service\ndelivery\n2.6 Changes in the competitive environment\n2.7 Economic climate\n2.8 Trends in customer preferences\n2.9 Advent of E-business\n3. Customer service\nstandards/ Customer\nservice issues\nMay include but not limited to:\n3.1 Response times\n3.2 Service guarantees\n3.3 Pricing guarantees\n3.4 Product quality\n3.5 Document presentation standards\n3.6 Personal presentation standards\n3.7 Complaint management\n\n--- PDF PAGE 55 ---\n_______________________________________________________________________________________________53\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to develop proactive\napproaches to the delivery and monitoring of quality\ncustomer service within a specific tourism/hospitality\ncontext\n1.2 Demonstrated knowledge of quality service principles\nand processes\n2. Underpinning\nknowledge\n2.1 Roles and responsibilities of management in ensuring\nquality service within an enterprise\n2.2 The concept of total quality service and total quality\nmanagement\n2.3 The role of continuous improvement and benchmarking\nin quality assurance\n2.4 Overview of the range of market research techniques\nused to gain information on customer preferences\n2.5 Legislation that impacts on customer service standards\nand delivery\n2.6 Industry schemes that impact on customer service\nstandards and delivery (e.g. accreditation schemes,\ncodes of conduct)\n3. Underpinning\nskills\n3.1 Application of total quality service and total quality\nmanagement in a tourism or hospitality context\n3.2 Methods of implementing quality assurance in the\nworkplace including:\n3.2.1\nEstablishing standards\n3.2.2\nMonitoring\n3.2.3\nStaff involvement and reward\n3.2.4\nEvaluation\n3.3 Application of continuous improvement and/or\nbenchmarking in a tourism or hospitality context\n\n--- PDF PAGE 56 ---\n_______________________________________________________________________________________________54\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Project or work activities conducted over a period of\ntime to allow the candidate to establish, monitor and\nevaluate service delivery in a tourism or hospitality\ncontext\n4.2 Involvement of a team for which the candidate is leader\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Evaluation of projects managed by the candidate in\nconjunction with industry to enhance service delivery\nin a given operation\n5.2 Evaluation of projects managed by the candidate to\ncreate, market and deliver a tourism or hospitality\nservice\n5.3 Case studies to assess specific service delivery issues\nin different workplace contexts\n5.4 Oral or written questions to assess knowledge of\nquality assurance concepts and principles\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context of\nassessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 57 ---\n_______________________________________________________________________________________________55\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPREPARE FOODS ACCORDING TO\nDIETARY AND CULTURAL NEEDS\n\nUNIT CODE\n\n:\nTRS512355\n\nUNIT DESCRIPTOR\n:\nThis unit refers to the preparation and cooking\nof foods to meet both basic and specific dietary\nand cultural needs. It covers the ability to apply\nbasic nutritional principles as well as deal with\nspecial dietary and cultural requirements\nnormally encountered in a variety of hospitality\nand catering establishments.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Prepare and present foods to\nmeet basic nutritional needs\n1.1 Foods are prepared to meet basic nutritional\nneeds.\n1.2 Appropriate ingredients are selected to ensure\noptimum quality of end products including:\n• Raw foods\n• Convenience food products\n1.3 Suitable preparation and cooking techniques are\nemployed to retain optimum nutritional values.\n1.4 A variety of nutritionally balanced food is\npresented in an appetizing and attractive manner.\n2. Prepare and present foods to\nmeet special dietary\nrequirements\n2.1 The requirements for special diets are identified\naccording to instructions from relevant persons.\n2.2 Essential ingredients are selected for special\ndietary requirements.\n2.3 Food texture is modified appropriately to suit\nspecific requirements.\n2.4 Food is presented in an appetizing and attractive\nmanner.\n\n--- PDF PAGE 58 ---\n_______________________________________________________________________________________________56\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n3. Prepare foods to satisfy specific\ncultural or religious needs\n3.1 Requirements for specific cultural groups or\nspecial customer requests are identified and\nmet according to instructions from relevant\npersons.\n3.2 Appropriate equipment cooking techniques are\nemployed for specific diets.\n3.3 Food is prepared and served taking into account\nspecified or requested cultural and religious\nconsiderations.\n3.4 An adequate range of nutritionally balanced food\nis presented in an appetizing and attractive\nmanner.\n\n--- PDF PAGE 59 ---\n_______________________________________________________________________________________________57\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related services are provided\nsuch as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health\nestablishments, defense forces, corrective services, residential catering, in-flight and other transport\ncatering, events catering and private catering.\n\nBasic nutritional requirements generally refer to recommendations made in the dietary guidelines made\nby the Nutritionists and Dietitians Association of the Philippines endorsed by the Philippine Government\nand by other recognized health authorities. It includes recommendations made for the general public\nincluding senior citizens, children, adolescents, in order to maintain a healthy balanced diet.\n\nSpecial dietary and cultural requirements include therapeutic and contemporary eating regimes as well as\ncustomer requests and preferences, and specific cultural and religious needs.\n\nVARIABLE\n\nRANGE\n1. Relevant persons\nMay include but not limited to:\n1.1 Customers or family members\n1.2 Supervisors and managers\n1.3 Dieticians\n1.4 Diet technicians\n1.5 Health and medical personnel\n1.6\nReligious personnel\n2. Special dietary requirements\nMay include but not limited to:\n2.1 Vegetarian\n2.2 Vegan\n2.3 Modified sodium/potassium\n2.4 Low fat/cholesterol\n2.5 Lacto-ovo\n2.6 High fibre\n2.7 Gluten-free\n2.8 High/low energy\n2.9 Diabetic\n2.10 Modified texture\n2.11 High/low protein\n2.12 Fluids\n2.13 Food exclusions for allergies and food\nintolerance.\n2.14 Food exclusions related to specific\nmedications.\n2.15 Pork-free menu for Moslems\n\n--- PDF PAGE 60 ---\n_______________________________________________________________________________________________58\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n3. Contemporary eating regimes\nMay include but not limited to:\n3.1 Vegetarian\n3.2 Low-fat or low carbohydrate\n3.3 High-protein\n3.4 Macrobiotic\n3.5 Liver cleansing\n3.6\nElimination\n4. Special cultural groups\nMay include but not limited to:\n4.1 Kosher\n4.2 Halal\n4.3 Vegetarian\n4.4 Hindu\n\n--- PDF PAGE 61 ---\n_______________________________________________________________________________________________59\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated the ability to prepare and/or modify a\nrange of dishes to meet different of dietary requirements.\n1.2 Demonstrated knowledge of the dietary requirements of\nmajor cultural groups.\n1.3 Demonstrated knowledge of the consequences of failing\nto heed special requirements for food allergies, diabetes\nand other medical conditions and customer-identified\ndrug-food interaction.\n2. Underpinning\nknowledge\n2.1 Different cultural, dietary and special requirements that\nmay apply in different contexts, including Halal and\nHaram\n2.2 Basic principles and practices of nutrition including:\n Nutrients and their food sources.\n Influences on food choice\n Food and beverage selection influences\n Food labeling and interpretation.\n Identification of food additives and preservatives.\n Health implications of food choices.\n HALAL\n2.3 Common dietary sensitivities including food allergies and\nintolerance, diabetes and other medical conditions, the\nexistence of drug-food interactions, and the health and\nlegal consequences of failing to heed special\nrequirements.\n2.4 Commodity knowledge of ingredients suitable for meeting\nbasic nutritional and special dietary needs.\n2.5\nLogical and time efficient work flow.\n3. Underpinning\n skills\n3.1 A variety of cooking techniques.\n3.2 The effects of various cooking methods and food storage\non nutrients.\n3.3 Cookery techniques and recipe modification to suit\nspecial dietary requirements.\n3.4 Principles and practices of hygiene and legislation on\nfood safety.\n3.5\nPresentation techniques for food.\n4. Resource\n implications\nThe following resources must be provided:\n4.1 Fully-equipped operational commercial kitchen (including\nindustry-current equipment)\n4.2 Use of real ingredients and food items.\n4.3 Industry-realistic ratios of kitchen staff to customers.\n4.4\nPreparation of dishes for customers with particular\n\n--- PDF PAGE 62 ---\n_______________________________________________________________________________________________60\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\ndietary needs within typical workplace time constraints.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate preparing dishes for\nspecial dietary needs, cultural preferential and to meet\nmedical needs.\n5.2 Sampling of dishes prepared by the candidate.\n5.3 Evaluate of the suitability of dishes prepared by the\ncandidate.\n5.4 Oral or written questions to assess knowledge of dietary\nconstraints and consequences, resulting from cultural,\npreferential or medical needs.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 63 ---\n_______________________________________________________________________________________________61\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nTRANSPORT AND STORE FOOD IN A SAFE\n\nAND HYGIENIC MANNER\n\nUNIT CODE\n\n:\nTRS512356\n\nUNIT DESCRIPTOR\n:\nThis unit refers to the transportation of food\nfrom a food preparation area to another\nlocation. It also deals with holding or storage\non its arrival. Transportation refers to the\nmoving of food and food items from one\nlocation to another. For example, transporting\nfood from a kitchen to a school or hospital or\nproviding event catering. It does not refer to\nthe transport of food from the kitchen to the\ndining room or as part of room service.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Identify appropriate food\ntransportation\n 1.1 Suitable food transportation vehicles are\nselected according to establishment\nrequirements.\n2. Transport food safely and\nhygienically\n2.1 Food is packaged, loaded and unloaded\nappropriately.\n\n2.2 Hygienic work practices are employed and\noccupational health and safety regulations are\nobserved.\n\n2.3 Food transportation records are maintained\nappropriately and accurately.\n3. Store food safely and\nhygienically\n3.1 Food storage conditions are selected\nappropriately for specific food type including:\n•\nDairy\n•\nMeat and fish\n•\nFruit and vegetables\n•\nDried goods\n\n--- PDF PAGE 64 ---\n_______________________________________________________________________________________________62\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n3.2 Appropriate environmental conditions are\nmaintained for specific food types to ensure\nfreshness, quality and appearance.\n3.3 Appropriate storage and holding methods are\nemployed to optimize nutritional quality.\n3.4 Hygienic work practices are employed and\noccupational health and safety procedures and\npractices are observed.\n3.5 Storage areas are kept free from contaminants\nand pests.\n\n--- PDF PAGE 65 ---\n_______________________________________________________________________________________________63\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related\nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens,\ncafes, educational institutions, health establishments, defense forces, corrective\nservices, residential catering, in-flight and other transport catering, events catering and\nprivate catering.\n\nThe type of transport used will vary according to the enterprise needs and the type of\nfood being transported.\n\nVARIABLE\n\nRANGE\n1. Types of transport\nMay include but not limited to:\n1.1 Vans\n1.2 Cars\n1.3 Refrigerated trucks\n1.4 Trolleys, carts and push carts\n2. National regulations guidelines\nMay include but not limited to:\n2.1 Temperature\n2.2 Lining\n2.3\nSealing\n3. Environmental conditions\nMay include but not limited to:\n3.1 Temperature\n3.2 Humidity\n3.3 Exposure to light\n3.4\nExposure to weather\n\n--- PDF PAGE 66 ---\n_______________________________________________________________________________________________64\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated safe transport and storage of food items\nwithin food safety requirements and regulations.\n1.2 Demonstrated transport of a range of food item types.\n2. Underpinning\nknowledge\n2.1 The hygiene and OH&S requirements for food storage\nand transport.\n2.2 Advantages and disadvantages of different forms of\ntransport for particular food items, quantities and\ncircumstances.\n2.3 Characteristics of different food items and conditions\nrequired to maintain optimum freshness, palatability and\nsafety.\n2.4\nHACCP principles applied to catering.\n3. Underpinning\nskills\n3.1 Safe work practices in particular to loading and\nunloading, lifting and dealing with heated surfaces.\n3.2 Safe storage principles and practices for different food\ntypes, including storage options.\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Use of real food items to be transported\n4.2 Relevant transportation and storage equipment to move\nfood between locations.\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate of transporting and\nstoring food items.\n5.2 Inspection of food transported and stored by the\ncandidate.\n5.3 Problem solving and case studies to address various\nconditions which apply to the transport and storage of\ndifferent food items.\n5.4 Written or oral questions to test knowledge of hygiene\nissues related to transport and storage.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center.\n\n--- PDF PAGE 67 ---\n_______________________________________________________________________________________________65\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nAPPLY CATERING CONTROL PRINCIPLES\n\nUNIT CODE\n\n:\nTRS512357\n\nUNIT DESCRIPTOR\n:\nThis unit covers the application of catering\ncontrol principles to the ordering, receiving,\nstorage and processing of food to minimize\nwastage.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Identify procedures to reduce\nwastage\n1.1 Appropriate procedures for reducing\nwastage during ordering, receiving, storage\nand processing of food are identified.\n1.2 Appropriate control measures are identified to\nreduce loss.\n2. Carry out catering control\nprocedures\n\n2.1 Portion control is carried out effectively.\n2.2 Calibrated equipment are used correctly to\nensure correct portion control.\n2.3 Recipes are accurately followed to avoid\nwastage.\n2.4 Suitable quantities of stock are ordered to\navoid over or under ordering.\n2.5 Stock are rotated and documented accurately.\n2.6 Food is stored correctly and securely to\nminimize wastage and loss.\n3. Minimize waste\n3.1 Re-usable products of food preparation and\ncooking are utilized effectively.\n3.2 Recyclable products are utilized and\ndisposed in an environmentally appropriate\nway.\n3.3 Non-recyclable products are disposed of\naccording to health and safety requirements,\nrelevant regulations and in environmentally\nappropriate way.\n\n--- PDF PAGE 68 ---\n_______________________________________________________________________________________________66\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related\nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens,\ncafes, educational institutions, health establishments, defense forces, corrective\nservices, residential catering, in-flight and other transport catering, events catering and\nprivate catering.\n\nCatering control procedures are the processes and procedures implemented at the\noperational level that result in the control of costs, energy usage, materials and time.\n\nVARIABLE\n\nRANGE\n1. Procedures for reducing\nwastage\nMay include but not limited to:\n1.1 Portion control\n1.2 Ordering to specifications\n1.3 Stock rotation\n1.4 Using appropriate equipments\n1.5 Appropriate storage\n1.6 Using standard recipe cards\n2. Re-usable products\nMay include but not limited to:\n2.1 Meat and fish off-cuts\n2.2 Bones and trimmings\n2.3\nVegetable peelings and off-cuts\n3. Recyclable products\nMay include but not limited to:\n3.1 Glass bottles and jars\n3.2 Plastics\n3.3 Paper and cardboard\n3.4 Tin or aluminum containers.\n3.5\nVegetable matter\n\n--- PDF PAGE 69 ---\n_______________________________________________________________________________________________67\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\nAssessment requires evidences that the\ncandidate:\n1.1 Demonstrated the ability to use portion\ncontrol, stock control and other waste\nreduction measures effectively.\n1.2 Demonstrated the ability to minimize\nwastage and to manage waste\nproductively, including re-cycling systems.\n1.3 Demonstrated the ability to conform with\nthe establishments menu standards.\n2. Underpinning knowledge\n2.1 Links between hygiene and food safety\nand waste minimization.\n2.2 Preparation and cooking procedures that\nassist in minimizing waste.\n3. Underpinning skills\n3.1 Stock control procedures that assist in\nminimizing waste.\n3.2 Storage procedures that assist in\nminimizing waste.\n4. Resource implications\nThe following resources must be provided:\n4.1 Fully-equipped commercial kitchen using\nreal ingredients and food items.\n4.2 Production of portion-controlled menu\nitems.\n5. Method of Assessment\nCompetency may be assessed through:\n5.1 Evaluation of amount of products used by\nthe candidate across a period of operation.\n5.2 Review of reports prepared by the\ncandidate detailing ways in which waste\nwere minimized during a service period.\n5.3 Written or oral questions to test knowledge\nof waste minimization and control systems.\n5.4 Review of stock control and portion control\ndocumentation prepared by the candidate.\n5.5 Review of portfolios of evidence and third\nparty workplace reports of on-the-job\nperformance by the candidate.\n6. Context for Assessment\n6.1 Assessment may be done in the workplace\nor in a simulated workplace setting\n(assessment centers)\n6.2 Assessment activities are carried out\nthrough TESDA’s accredited assessment\ncenter\n\n--- PDF PAGE 70 ---\n_______________________________________________________________________________________________68\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nDEVELOP MENUS TO MEET SPECIAL\n\nDIETARY AND CULTURAL NEEDS\n\nUNIT CODE\n\n:\nTRS512358\n\nUNIT DESCRIPTOR\n:\nThis unit refers to the development of menus\nand meal plans, including meeting specific\ndietary and cultural needs of different target\nmarkets.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Identify the dietary and cultural\nrequirements of customers\n1.1 Dietary and cultural requirements of\ndifferent target groups are identified through\nconsideration of all appropriate factors.\n1.2 Contemporary dietary trends and regimes\nare taken into consideration in assessing\ndietary requirements.\n1.3 Dietitians, medical specialists, or other relevant\npersonnel are liaised with in order to identify\nand confirm requirements.\n2. Develop menus and meal plans\nto meet dietary and cultural\nrequirements.\n2.1 A variety of suitable foods, meals and menus\nare selected for specific dietary\nrequirements taking account of Dietary\nGuidelines and menu planning principles.\n2.2 Meal plans and menus that promote good\nhealth and reduce the incidence of diet-related\nhealth problems are developed in consultation\nwith relevant personnel, according to job role.\n2.3 Cyclic menus are prepared when required and\nthey are balanced in terms of nutritional\nrequirements and variety.\n2.4 Food preparation and cooking methods are\nrecommended to maximize nutritional value of\nfood.\n2.5 Appropriate combinations of food are identified\nto meet macro and micro nutrient\n\n--- PDF PAGE 71 ---\n_______________________________________________________________________________________________69\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nrequirements.\n\n2.6 Special needs are taken into consideration\nincluding texture, composition and portion size.\n2.7 Sufficient choices of dishes are incorporated\ninto the menus.\n2.8 Menus are costed to comply with costing\nconstraints.\n2.9 Correct terminology is used in menus and\nmeal plans.\n3. Evaluate meals and menus\n3.1 Meals and menus are evaluated using\nappropriate methods to ensure customer\nsatisfaction based on the enterprise’s menu\nstandard.\n3.2 Menus are adjusted as required to ensure\ndietary needs and goals are met.\n\n--- PDF PAGE 72 ---\n_______________________________________________________________________________________________70\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related services are\nprovided such as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational\ninstitutions, health establishments, defense forces, corrective services, residential catering, in-\nflight and other transport catering, events catering and private catering.\n\nEvidence is required of knowledge and understanding of a range of different cultural, dietary\nand special requirements. However, the focus of this range will vary according to the target\nmarkets of a particular workplace. Special dietary needs include therapeutic and contemporary\nregimes as well as customer requests.\n\nA variety of menus and meal plans must be developed to meet differing requirements. They\nmay be developed to address the requirements of individuals or larger target audiences.\n\nVARIABLE\n\nRANGE\n1. Dietary and cultural needs of target\ngroups\nMay include but not limited to:\n1.1 Age requirements\n1.2 Lifestyle\n1.3 Food preferences\n1.4 Food restrictions or allergies\n1.5 Physical condition\n1.6 Nutritional requirements\n1.7 Those with varying nutritional and energy\nrequirements due to physical condition\n1.8 Cultural or religious needs\n1.9 Meal – breakfast, lunch, dinner\n1.10 Occasion\n2. Target groups refers to all sectors of\nthe population\nMay include but not limited to:\n2.1 Infants\n2.2 Children\n2.3 Adolescents\n2.4 Athletes\n2.5The aged\n3. Special cultural groups\nMay include but not limited to:\n3.1 Halal\n3.2 Vegetarian\n3.3 Hindu\n4. Contemporary diet regimes\nMay include but not limited to:\n4.1 Vegetarian\n4.2 Low-fat, low carbohydrate or low kilojoule\n4.3Macrobiotic\n\n--- PDF PAGE 73 ---\n_______________________________________________________________________________________________71\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n5. Menus and meal plans\nMay include but not limited to:\n5.1 Daily meal plans\n5.2 Daily or weekly menus\n5.3 Cyclic menus\n6. Special dietary requirements\nMay include but not limited to:\n6.1 Vegetarian\n6.2 Vegan\n6.3 Modified sodium/potassium\n6.4 Low fat/cholesterol\n6.5 Lacto-ovo\n6.6 High fiber\n6.7 Gluten fee\n6.8 High/low energy\n6.9 Diabetic\n6.10 Modified texture\n6.11 High/low protein\n6.12 Non-pork meals\n6.13 Fluids\n6.14 Exclusions for allergies and food\nintolerance\n7. Methods used to evaluate diets and\nmeal plans and analyze foods\nMay include but not limited to:\n7.1 Computer programs\n7.2 Customer feedback questionnaires\n7.3 Interviews with customer and health support\npersonnel\n7.4Nutrition guides\n\n--- PDF PAGE 74 ---\n_______________________________________________________________________________________________72\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated the ability to prepare menus and meal\nplans to meet different dietary and cultural needs.\n1.2 Demonstrated knowledge of commodities required to\nmeet particular dietary and cultural needs.\n1.3 Demonstrated knowledge of the consequences of\nfailing to heed special dietary requirements.\n2. Underpinning\nknowledge\n2.1 Basic principles and practices of nutrition, including:\n Nutrients and their food sources\n Influences on food choice\n Food labeling requirements and interpretation\n Food additives and preservatives\n Health implications of food choices.\n2.2 Dietary sensitivities including food allergies and\nintolerance, diabetes and other medical conditions and\nthe existence of drug-free interactions, and the health\nand legal consequences of failing to heed special\nrequirements.\n2.3 Commodity knowledge of ingredients suitable for\nmeeting basic nutritional and special dietary needs.\n2.4 The effects of various cooking methods and food\nstorage on nutrients.\n3. Underpinning\n skills\n3.1 Cookery techniques and recipe modification to suit\nspecial dietary requirements.\n4. Resource\n implications\nThe following resources must be provided:\n4.1 Project or work activities that allow the candidate to\ndevelop menus to meet multiple and differing and\ncultural needs.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Evaluation of menus and meal plans prepared by\ncandidate involving a variety of target markets and\npurposes.\n5.2 Case studies to assess ability to develop menus and\nmeal plans for different target groups and\ncircumstances.\n5.3 Written or oral questions to test knowledge of nutrition,\ncultural and dietary requirements.\n5.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n\n--- PDF PAGE 75 ---\n_______________________________________________________________________________________________73\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 76 ---\n_______________________________________________________________________________________________74\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nSELECT CATERING SYSTEMS\n\n(MICROS, IFCA AND OTHERS)\n\nUNIT CODE\n\n:\nTRS512359\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the evaluation and\nselection of catering systems, including cook\nchill systems, to meet the food production\nneeds of a catering enterprise. It focuses on\nthe\nplanning\nand\nevaluation\nprocesses\nundertaken by supervisors and managers prior\nto the purchase of a system.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Review catering system\nrequirements\n\n1.1 Catering systems requirements are reviewed\ntaking into account all relevant factors\nincluding:\n Type of menu and nutritional requirements\n Production volume\n Location of service points\n Holding requirements\n F & B cost control\n1.2 Constraints are identified including the\navailability of:\n Facilities and equipment\n Operational issues\n Financial resources\n Human resources (current skills and training\nneeds)\n2. Evaluate and select the catering\nsystem\n2.1 Food production characteristics of systems are\nevaluated against identified requirements.\n2.2 System processes and equipment is evaluated\nfor all stages of the food production process.\n2.3 Staffing requirement for specific systems is\nevaluated and matched with identified\nrequirements.\n2.4\nInstallation requirements for the specific\n\n--- PDF PAGE 77 ---\n_______________________________________________________________________________________________75\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nsystems and their operational impacts are\nevaluated.\n2.5 The production and organizational changes\nrequired to introduce particular systems are\ntaken into account.\n2.6 Advantages and disadvantages of different\nsystems are considered and selections are\nmade accordingly.\n\n--- PDF PAGE 78 ---\n_______________________________________________________________________________________________76\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related\nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens,\ncafes, educational institutions, health establishments, defense forces, corrective\nservices, residential catering, in-flight and other transport catering, events catering and\nprivate catering.\n\nVARIABLE\n\nRANGE\n1. Catering systems\nMay include but not limited to:\n1.1 Cook fresh\n1.2 Cook chill – 5 day life\n1.3 Cook chill – extended life\n1.4 Cook freeze\n2. Stages of the food production\nprocess\nMay include but not limited to:\n2.1 Receiving\n2.2 Storing\n2.3 Preparation\n2.4 Preparation/cooking\n2.5 Post-cooking storage\n2.6 Re-thermalization where applicable\n2.7\nServing\n\n--- PDF PAGE 79 ---\n_______________________________________________________________________________________________77\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated the ability to assess and select catering\nsystems for specific catering operations.\n1.2 Demonstrated the ability to determine enterprise needs\nand constraints in selecting a system.\n2. Underpinning\nknowledge\n2.1 Types of catering systems and their operating features\nincluding:\n Fresh cook\n Cook chill – 5 day life\n Cook chill – extended life\n Cook freeze\n2.2 Knowledge and understanding of the nutrition principles\nwhich relate to each system.\n2.3 Knowledge of requirements, regulations and legislation\nthat impact on different systems including occupational\nhealth and safety, hygiene codes, HACCP and storage\nissues.\n2.4\nKnowledge on F & B cost control.\n3. Underpinning\nskills\n3.1 Principles and methods of cookery, including preparation\nand cookery techniques for all major food groups.\n4. Resource\n implications\nThe following resources must be provided:\n4.1 Project or work activities that allow the candidate to\nselect system for specific workplace situations and\nneeds.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Case studies to assess ability to select appropriate\ncatering systems for a particular enterprise or context.\n5.2 Project to select an appropriate catering system for an\nenterprise including research, costing, evaluation and\nrecommendations.\n5.3 Evaluation of reports prepared by the candidate detailing\nthe processes and challenges involved in the selection of\na catering system.\n5.4 Written or oral questions to test knowledge of\nadvantages and limitation of various catering systems.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n\n--- PDF PAGE 80 ---\n_______________________________________________________________________________________________78\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 81 ---\n_______________________________________________________________________________________________79\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nMANAGE FACILITIES ASSOCIATED WITH\n\nCOMMERCIAL CATERING CONTRACTS\n\nUNIT CODE\n\n:\nTRS512360\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the management of small-\nscale facilities associated with commercial\ncatering contracts. It reflects a situation where\na caterer may hold a contract to operate a\ncatering outlet within a venue owned by\nanother organization (eg. within a school or\nsporting club).\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Organize maintenance of\nfacilities\n1.1 Scope of maintenance requirements is\nidentified in accordance with contract or scope\nof operations.\n1.2 Responsibility for specific maintenance\nfunctions is allocated considering the\nadvantages and disadvantages of in-house\nstaff and external contractors.\n1.3 Regular maintenance of facilities is organized\non time to meet specific requirements and to\nmeet budgetary targets.\n2. Manage catering stores and\nstorage areas\n2.1 Stocks are purchased, received, stored and\ntransferred according to contracted\nrequirements and negotiated supplier\nagreements.\n2.2 Storage, stock control and distribution\nsystems are organized for the specific facility\nin accordance with contracted requirements,\nOH&S and health department regulations.\n2.3 Accurate records and reports are maintained\naccording to enterprise policy and procedures.\n\n--- PDF PAGE 82 ---\n_______________________________________________________________________________________________80\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n3. Maintain a facilities assets\nregister\n3.1 All assets are identified and registered clearly.\n3.2 Routine audits of assets are conducted.\n3.3 Asset and inventory reports are issued\naccording to enterprise practices.\n4. Manage client services\nassociated with the facility\n4.1 Stakeholders are liaised with to determined\ngeneral and specific requirements for client\nservice.\n4.2 Exiting client services across all areas of\noperation are monitored to identify areas for\nimprovement.\n4.3 Temporary or permanent upgrades or\nmodifications of existing services and\nfacilities are arranged as required and in\naccordance with appropriate regulations.\n4.4 Additional human, physical or financial\nresources are organized in accordance with\ncustomer requirements.\n4.5 Provisions of new services or facilities are\narranged when required.\n4.6 Budgeting targets are maintained in the\nmanagement of client services.\n4.7 Feedback on catering service is reviewed and\nprovision of client service is modified\naccordingly.\n\n--- PDF PAGE 83 ---\n_______________________________________________________________________________________________81\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related\nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens,\ncafes, educational institutions, health establishments, defense forces, corrective\nservices, residential catering, in-flight and other transport catering, events catering and\nprivate catering.\n\nVARIABLE\n\nRANGE\n1. Maintenance\nMay include but not limited to:\n1.1 Gardening\n1.2 Cleaning\n1.3 Building and repairs\n1.4 Laundry\n1.5 Plumbing and electrical\n2. Stock control procedures\nMay include but not limited to:\n2.1 Stocktaking and reconciliation\n2.2 Stock rotation\n2.3 Authorizing access\n2.4 Issuing and requisition systems\n2.5 Receiving control\n2.6 Locks and other security systems\n2.7\nInventory of items to be brought on-site\n3. Stakeholders\nMay include but not limited to:\n3.1 The venue owner\n3.2 Staff\n3.3 Customers\n4. Areas of operation to be\nmonitored\nMay include but not limited to:\n4.1 Quality of service\n4.2 Quality of catering\n4.3 Adequacy of staffing levels\n4.4 Costs of operations\n4.5 Hours of operation\n4.6 Appropriate integration of the facility within th\noverall venue and associated operational\nissues\n4.7\nAppropriateness of location\n\n--- PDF PAGE 84 ---\n_______________________________________________________________________________________________82\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n6. Upgrades or modifications of\nnew or existing services\nMay include but not limited to:\n5.1 Additional capacity\n5.2 Amended or expanded menus\n5.3 Expansion of facility\n5.4\nAdjusted staffing arrangements\n\n--- PDF PAGE 85 ---\n_______________________________________________________________________________________________83\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated the ability to manage the operation of a\ncommercial catering facility in accordance with\ncontractual agreements, including maintenance,\nstorage and client service.\n1.2 Demonstrated knowledge of the key factors that impact\non the management of commercial catering facilities.\n2. Underpinning\nknowledge\n2.1 Types of arrangements between venues and catering\ncontractors including scope of typical contracts and\nservices.\n2.2 Procedures for developing and maintaining an assets\nregister.\n3. Underpinning\n\n skills\n3.1 Stock control systems and procedures found in\ncommercial catering facilities.\n3.2 Analytical and planning skills for evaluation of existing\noperations and planning of adjustments.\n3.3 Financial control processes in the context of catering\noperations.\n4. Resource\n\n implications\nThe following resources must be provided:\n4.1 Fully-equipped operational commercial catering outlet.\n4.2 Project or work activities conducted over a period of\ntime to allow the candidate to demonstrate the\nimplementation and monitoring aspects of the unit.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1\nEvaluation of projects undertaken by the candidate to\nestablish and monitor a small-scale catering outlet (e.g. for\nan event)\n5.2\nEvaluation of reports prepared by the candidate detailing\nprocesses and systems used to manage a catering facility.\n5.3\nCase studies to assess ability to establish systems for\ndifferent style of catering facilities.\n5.4\nWritten or oral questions to test knowledge of advantages\nand limitations of asset management systems.\n5.5\nReview of portfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 86 ---\n_______________________________________________________________________________________________84\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nPLAN THE CATERING FOR AN EVENT OR\n\nFUNCTION\n\nUNIT CODE\n\n:\nTRS512361\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the skills and knowledge\nrequired to plan the catering of an event or\nfunction. While catering is the major focus of\nthis unit, it also refers to additional services\nwhich may be offered by a caterer such as\nthose related to décor and theme. However,\nthe unit does not cover the broader event\nmanagement skills required for a major event\nwhich are covered in other specialist event\nmanagement units within the Tourism Training\nPackages.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Identify overall event objectives\nand scope\n1.1 Key objectives of the event are clarified and\nagreed upon in consultation with stakeholder.\n1.2 Key information is analyzed and consulted\nwith stakeholders to determined the broad\nscope of the event including indicators for:\n Size and numbers of guests/delegates\n Location (s)\n Time and duration\n Budget\n Dietary restrictions\n Guests profile\n1.3 Factors which may impact on the event\ncatering,are identified and analyzed.\n2. Prepare the catering concept\nfor an event or function\n2.1\nIdeas to the overall event concept, theme and\nformat are contributed according to scope of\nresponsibility.\n2.2\nThe key elements for catering are identified\nand defined in consultation with stakeholders\n\n--- PDF PAGE 87 ---\n_______________________________________________________________________________________________85\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nto reflect the objectives and meet the needs of\ncustomers.\n2.3\nCreative elements are incorporated into\ncatering concept and theme.\n2.4\nOperational practicality and cohesiveness of\nthe catering concept, theme and format are\nverified through consultation and analysis.\n3. Prepare and implement an\noperational plan for the\ncatering of an event or\nfunction\n3.1 Operational plan for the provision of catering\nand ancillary services is prepared identifying\nsteps, activities and sequence.\n3.2 Appropriate risk management is incorporated\ninto the plan.\n3.3 Details are reviewed, verified and finalized with\nthe client.\n3.4 Accurate and complete information on the\ncatering concept and operational plans is\nprovided to all relevant stakeholders to ensure\ntimely and effective planning and\nimplementation.\n3.5 Approval from relevant stakeholders is\nobtained prior to implementation.\n3.6 Banquet event order / contract is disseminated\nto different departments needing coordination.\n3.7 The catering plan for the event is implemented\nand monitored making adjustments as\nrequired.\n3.8 Feedback is obtained after the event and plans\nare reviewed to evaluate the degree to which it\nmet objectives and customer requirements.\n\n--- PDF PAGE 88 ---\n_______________________________________________________________________________________________86\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all catering operations where event catering is provided.\n\nEvents and functions may be in a central location or across a range of smaller locations\nindoors or outdoors.\n\nVARIABLE\n\nRANGE\n1. Events and functions\nMay include but not limited to:\n1.1 Sporting events.\n1.2 Defense operations\n1.3 Show, exhibitions\n1.4 Product launches\n1.5 Trade shows\n1.6 Conferences\n1.7 Meetings or seminars\n1.8 Training events\n1.9 Social celebrations\n1.10 Awards night\n1.11 Christmas parties\n1.12 Thanksgiving/victory parties\n1.13 Seminars\n2. Key information\nMay include but not limited to:\n2.1 Purpose\n2.2 Concept\n2.3 Style and theme\n2.4 Date, time and venue\n2.5 Catering requirements\n2.6 Audience or market\n2.7\nOverall budget estimate\n3. Stakeholders\nMay include but not limited to:\n3.1 Event customer\n3.2 Suppliers and contractors\n3.3 Local community\n3.4 Organizing committees\n3.5 Local authorities\n3.6 Colleagues\n3.7\nEntertainers\n4. Key elements for catering\nMay include but not limited to:\n4.1 Type of food\n4.2 Style of service\n4.3 Timing of service\n4.4\nLink between food and other aspects of the\n\n--- PDF PAGE 89 ---\n_______________________________________________________________________________________________87\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\nevent (eg. speeches)\n4.5 Production and transport issues\n4.6 Catering staff requirements\n4.7 Liaison with others involved in the event.\n4.8\nSeating arrangements\n5. Ancillary services\nMay include but not limited to:\n5.1 Theme and décor\n5.2 Management of the event\n5.3 Staffing\n5.4 Logistics\n6. Operational plan\nMay include:\n6.1 Costing of components and total catering\n6.2 Management\n6.3 Staffing and contracting\n6.4 Roles and responsibilities\n6.5 Logistics and transport details\n6.6 Resources eg. venue, commodities,\nequipment, machinery, vehicles and staff\n6.7 Security arrangements\n6.8 Purchasing of food, materials and equipment\n6.9 Production and distribution of food and\nbeverage.\n\n--- PDF PAGE 90 ---\n_______________________________________________________________________________________________88\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated the ability to plan catering which reflects\nevent objectives, is operationally practical and which\nresults in the achievement of objectives.\n1.2 Demonstrated knowledge of the creative options to be\nconsidered when developing for catering for an event.\n1.3 Demonstrated knowledge of issues and challenges\nassociated with event catering.\n2. Underpinning\nknowledge\n2.1 Knowledge of the different catering options and styles\nfor different types, different types of customer and\nvarying numbers.\n2.2 Space and equipment requirements for different styles\nof catering and varying numbers.\n2.3 Staffing requirements for particular types of catering.\n2.4 Knowledge of typical formats and running orders for\ndifferent styles of events.\n2.5 Knowledge of what each department should do.\n2.6 Customer service.\n2.7 Knowledge on working proposals, quotations and\ncontracts.\n2.8\nKnowledge on the servicewares to be used.\n3. Underpinning\n\nskills\n3.1 Operational constraints for catering within different\nstyles of venue.\n3.2 Operational constraints for catering in different climatic\nconditions.\n3.3 Principles and practices of food safety for preparation,\nstorage and transport of food.\n4. Resource\n\nImplications\nThe following resources must be provided:\n4.1 Project or work activities conducted over a period of\ntime that allow the candidate to plan and organize event\ncatering, and then to monitor the actual catering service\nat the event or function.\n4.2 Access to and interaction with event industry suppliers.\n4.3 Involvement of and interaction with an event principal or\norganizing group.\n5. Method of\n\n Assessment\nCompetency may be assessed through:\n5.1 Evaluation of the catering at an event where catering is\ncoordinated by the candidate.\n5.2 Case studies to assess ability to develop catering\nconcepts and plans for different types of event.\n\n--- PDF PAGE 91 ---\n_______________________________________________________________________________________________89\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n5.3 Evaluation of reports prepared by the candidate\ndetailing the planning processes undertaken for an\nevent and highlighting particular challenges and issues.\n5.4 Written or oral questions to elicit further explanations on\nvarious aspects of planning.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 92 ---\n_______________________________________________________________________________________________90\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nDESIGN MENUS TO MEET MARKET NEEDS\n\nUNIT CODE\n\n:\nTRS512362\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the skills and knowledge to\nuse menu planning as a marketing and\nmanagement tool. It is an extension of skills\nidentified in the unit Plan and control menu-\nbased catering.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Identify and evaluate target\nmarkets for the catering outlet\n1.1 Target markets for the enterprise are\nidentified based on past and current operations\nand performance.\n1.2 Potential target markets are identified based\non review of the current market place and the\nnature and style of the operation.\n1.3 Preference of key markets are evaluated and\nmatched with overall enterprise products and\nservices.\n2. Evaluate market trends in food\nservice\n2.1 Information sources on market trends in food\nservice are identified and accessed.\n2.2 Market trends are evaluated for relevance to\nthe enterprise current and potential markets.\n3. Create menu based on market\nanalysis and within budgetary\nconstraints\n3.1 Relevant market trends are incorporated into\nfood service and menu planning.\n3.2 Menus are developed taking into account\nenterprise operational constraints or\nlimitations.\n3.3 Menus are constructed to meet profitability\ntargets.\n3.4 Menus are developed taking into account the\ndietary instructions of the markets.\n4. Monitor menu performance\n4.1 Customer satisfaction with menus is monitored\nbased on demand patterns and in consultation\nwith customers and operational staff.\n4.2 Menu items are analyzed in terms of sales and\nprofit performance.\n4.3 Menus are adjusted based on feedback and\nprofitability.\n\n--- PDF PAGE 93 ---\n_______________________________________________________________________________________________91\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related\nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens,\ncafes, educational institutions, health establishments, defense forces, corrective\nservices, residential catering, in-flight and other transport catering, events catering and\nprivate catering.\n\nVARIABLE\n\nRANGE\n1. Target markets\nMay include but not limited to:\n1.1 Those with particular nutritional or dietary\nneeds and interests.\n1.2 Young people (elementary, highschool)\n1.3 Older people (professionals, yuppies)\n1.4 Infants/children/adolescent\n1.5 Prison populations\n1.6 Defense forcers\n1.7 Athletes\n1.8 Health care customers (the young and the\nold who is physically challenged)\n1.9 People from specific cultural or religious\ngroups\n1.10 People from different socio-economic\ngroups\n1.11 Students (college)\n2. Market trends in food service\nMay include but not limited to:\n2.1 Contemporary eating habits\n2.2 Media influence\n2.3 Cultural and ethnic influences\n2.4 Seasonal and popular influences\n2.5\nMajor events and festivals\n3. Types of menus\nMay include but not limited to:\n3.1 Table d’hòte\n3.2 Á la carte\n3.3 Set\n3.4 Function\n3.5 Buffet\n3.6 Cyclical\n3.7 Semi- á al carte\n3.8\nCalifornian menu\n\n--- PDF PAGE 94 ---\n_______________________________________________________________________________________________92\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated the ability to conduct market research,\nidentify current and relevant trends.\n1.2 Demonstrated the ability to cost menus and food items\nand develop menus within budgets.\n1.3 Prepared menus meeting the needs of a range of\ndifferent target markets.\n1.4\nDemonstrated the ability to design all types of menus.\n2. Underpinning\nknowledge\n2.1 Different types and styles of menus for different type of\nfood outlets.\n2.2 Historical development of menus, modern trends in\nmenus.\n2.3 Current food trends, typical cultural and ethnic dining\ninfluences.\n2.4 Product knowledge of commodities required to meet\nmenu needs of particular target groups, seasonal\nproducts.\n2.5 Principle of nutrition, ways of planning nutritionally-\nbalanced menus, the effects of cooking on the nutritional\nvalue of food and the nutritional needs of target groups.\n2.6 Culinary terms used in relation to menus and food items.\n2.7 Sources of information on food service trends.\n2.8 Menu merchandising (lay-out, paper, cala, harmony)\n2.9\nMenu listing (descriptive early)\n3. Underpinning\n\n skills\n3.1 Costing and budgeting techniques for menus.\n3.2 Basic market research techniques in specific relation to\nfood service preferences and trends.\n4. Resource\n\nimplications\nThe following resources must be provided:\n4.1 Project or work activities that allow the candidate to\ndevelop multiple menus to meet a range of target\nmarkets for various catering operations or hospitality\noutlets.\n4.2 Use of current industry costing data and market trend\ninformation.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Review of menus prepared by candidate to meet the\nneeds of different target groups and markets.\n5.2 Case studies to assess ability to develop menus to meet\ndiffering needs.\n5.3 Written or oral questions to test knowledge of marketing\nissues, current trends on food.\n5.4\nReview of portfolios of evidence and third party\n\n--- PDF PAGE 95 ---\n_______________________________________________________________________________________________93\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 96 ---\n_______________________________________________________________________________________________94\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY: DEVELOP A FOOD SAFETY PROGRAM\n\nUNIT CODE\n: TRS512363\n\nUNIT DESCRIPTOR : This unit refers to the development, implementation and\nevaluation of a food safety program for a hospitality or\ncatering operation where food is stored, prepared and\nserved.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n1. Identify needs for the food\nsafety program\n1.1 Characteristics of the enterprise are evaluated,\nincluding:\n Size and nature of organization\n “at risk” client groups\n layout\n menu\n production equipment\n facilities\n re-thermalization and service requirements\n1.2 Food safety hazards or any particular issues\nor risk situations are identified.\n1.3 Existing policies, procedures, practices and\nproduct specifications are evaluated and the\nneed for change or enhancement is assessed.\n2. Develop a food safety\nprogram for a specific\ncommercial catering\nenterprise\n2.1 Food safety program is designed to suit the\ncharacteristics and needs of the enterprise, in\nconsultation with appropriate colleagues and\nstakeholders.\n2.2 Food production flow charts are developed.\n2.3 Critical control points in the food production\nsystem are identified.\n2.4 Methods of control for critical points and\nhazards are established.\n2.5 Standard operational policies and\nprocedures to support the food safety\nprogram, including control procedures and\ncorrective measures, are developed or\nmodified.\n2.6 Product specifications are developed or\nmodified and recorded.\n\n--- PDF PAGE 97 ---\n_______________________________________________________________________________________________95\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n2.7 Product suppliers are identified and quality\nassurance specifications are established.\n2.8 Compliance of the food safety program with\nregulatory requirements and standards is\nensured.\n2.9 Training needs are identified and a training\nplan or program is developed based on needs.\n2.10 Schedule for regular review of the food safety\nprogram is developed.\n3. Implement the food safety\nprogram\n3.1 Food safety programs, policies and procedures\nare communicated to management and\ncolleagues in the workplace.\n3.2 Compliance by all colleagues to policies and\nprocedures is ensured.\n3.3 Practical and user-friendly recording system is\nestablished to document food safety\nperformance.\n3.4 Product specifications are communicated to\nsuppliers and employees and compliance is\nchecked.\n3.5 Appropriate training and mentoring related to\nthe food safety program is organized.\n3.6 Implementation problems are promptly\nidentified and corrective action is taken.\n\n--- PDF PAGE 98 ---\n_______________________________________________________________________________________________96\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n4. Evaluate and revise the food\nsafety program as required\n4.1 Operation and results of the food safety\nprogram are monitored according to schedule\nand in consultation with colleagues and other\nstakeholders.\n4.2 Operational policies, procedures and records\nare reviewed and changes or additions\nrequired are identified.\n4.3 Tests and/or measures to validate required\nsafety standards are carried out.\n4.4 Food safety program is revised to incorporate\namendments or additions.\n4.5 Records are kept to track changes to the food\nsafety program and changes are incorporated\ninto the production system.\n4.6 Colleagues are informed of changes and of\nwhen they commence.\n4.7 Need for additional training based on\nevaluation of the program is identified.\n4.8 Display of appropriate signage and information\nis ensured.\n\n--- PDF PAGE 99 ---\n_______________________________________________________________________________________________97\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThe following explanations identify how this may be applied in different workplaces, sectors and\ncircumstances.\n\nThe food safety program systematically identifies the food safety hazards that may be reasonably\nexpected to occur in all food handling operations. It identifies where and how each hazard can be\ncontrolled, describes how these controls are to be monitored, the corrective action required if control\nconditions are not met and information to be recorded. The food safety program must comply with\nrelevant national and local government legislation and ordinances.\n\nThe food safety plan may be a formal plan or a less-structured program. It may be developed as a stand-\nalone program or may be integrated with the overall quality program in a workplace.\n\nThis unit is based around the HACCP system but may also be customized to other systems.\n\nVARIABLE\n\nRANGE\n1. Establishments\nMay include:\n1.1 Cafeteria/kiosks/canteens/cafes/gourmet food\nshops/restaurants/hotels\n1.2 Fast food outlets\n1.3 Educational institutions\n1.4 Health establishments\n1.5 Mining operations\n1.6 Military forces\n1.7 Corrective services/final institution\n1.8 Residential catering\n1.9 In-flight catering\n1.10 Transport catering\n1.11 Events catering\n1.12 Private catering\n2. Critical control points\nMay include:\n2.1 Receiving\n2.2 Storing\n2.3 Preparing\n2.4 Processing\n2.5 Displaying\n2.6 Packaging\n2.7 Servicing\n2.8\nTransporting\n\n--- PDF PAGE 100 ---\n_______________________________________________________________________________________________98\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n3. Food safety hazards\nMay include:\n3.1 Foods highly susceptible to microbiological\ncontamination\n3.2 Working in temperatures that promote the rapid\ngrowth of micro-organisms\n3.3 Display of food, buffets\n3.4 Processes where food is required to be touched\nby hand\n3.5\nRequirements for re-thermalization or defrosting\n4. “At risk” client groups\nMay include:\n4.1 Patients, residents and clients of health care\nestablishments.\n4.2 Children or babies\n4.3 Pregnant women\n4.4 Aged persons\n4.5\nPeople with immune deficiencies or allergies.\n5. Standard operational procedure\nMay include:\n5.1 Food production procedures\n5.2 Procedures for maintaining records\n5.3 Contingency plans\n5.4 Pest control\n5.5 Cleaning and sanitation programs\n5.6 Equipment maintenance\n5.7 Employee training in hygiene and food handling\n5.8 Maintenance of personal hygiene and suitable\ndress standards.\n6. Contingency plans\nMay include:\n6.1 Food poisoning\n6.2 Customer complaints\n6.3 Rejected food\n6.4 Equipment breakdown\n6.5 Faulty equipment\n6.6\nExistence of pests and vermin\n7. Records\nMay include:\n7.1 Temperature control data\n7.2\nFood production records.\n\n--- PDF PAGE 101 ---\n_______________________________________________________________________________________________99\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n8. Tests and measures to validate\nrequired safety standards\nMay include:\n8.1 Food quality reviews and tests\n8.2 Bacterial swabs and counts\n8.3 Chemical tests\n8.4 Audit arrangements and programs\n8.5 Analysis of and actions arising from critical\nincidents\n\n--- PDF PAGE 102 ---\n_______________________________________________________________________________________________100\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to implement and maintain food\nsafety standards and program to enterprise standards\nand in line with legislative requirements.\n1.2 Demonstrated involvement and interaction with a\nkitchen team.\n2. Underpinning\nKnowledge\n2.1 Principles and methods of food production.\n2.2 HACCP based concepts that support food safety\nprogram design.\n2.3 Options for the structure, development and\nimplementation of a food safety program, including\nHACCP.\n2.4 Hygiene and food safety legislation and regulations in\nrelation to food safety program requirements.\n2.5 Local health regulations pertaining to food production\nand packaging.\n2.6 Conditions for development of microbiological\ncontamination and control methods.\n2.7\nPotential staff training needs in relation to food safety.\n3. Underpinning Skills\n3.1 Policies and practices of personal hygiene and food\nhandling.\n3.2 Planning and consultative processes which could be\nused in program development.\n3.3\nFood safety recording requirements and options.\n4. Resource\n\nImplications\nThe following resources MUST be provided:\n4.1 Project or work activities conducted over a period of\ntime and which allow the candidate to establish and\nmonitor a food safety program for a particular cookery or\ncatering workplace.\n4.2\nInvolvement and interaction with a kitchen team.\n\n--- PDF PAGE 103 ---\n_______________________________________________________________________________________________101\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Review of documentation related to food safety\nsystems, including policies and procedures, audit\nsummaries and reports developed by the candidate.\n5.2 Case studies to assess ability to develop systems to\nmeet differing workplace needs.\n5.3 Activities conducted in conjunction with industry to allow\nthe candidate to develop systems for a real workplace.\n5.4 Written or oral questions about chosen systems and\nreason for selection.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\n\n Assessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 104 ---\n_______________________________________________________________________________________________102\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007"
