        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated the ability to prepare and/or modify a\nrange of dishes to meet different of dietary requirements.\n1.2 Demonstrated knowledge of the dietary requirements of\nmajor cultural groups.\n1.3 Demonstrated knowledge of the consequences of failing\nto heed special requirements for food allergies, diabetes\nand other medical conditions and customer-identified\ndrug-food interaction.\n2. Underpinning\nknowledge\n2.1 Different cultural, dietary and special requirements that\nmay apply in different contexts, including Halal and\nHaram\n2.2 Basic principles and practices of nutrition including:\n Nutrients and their food sources.\n Influences on food choice\n Food and beverage selection influences\n Food labeling and interpretation.\n Identification of food additives and preservatives.\n Health implications of food choices.\n HALAL\n2.3 Common dietary sensitivities including food allergies and\nintolerance, diabetes and other medical conditions, the\nexistence of drug-food interactions, and the health and\nlegal consequences of failing to heed special\nrequirements.\n2.4 Commodity knowledge of ingredients suitable for meeting\nbasic nutritional and special dietary needs.\n2.5\nLogical and time efficient work flow.\n3. Underpinning\n skills\n3.1 A variety of cooking techniques.\n3.2 The effects of various cooking methods and food storage\non nutrients.\n3.3 Cookery techniques and recipe modification to suit\nspecial dietary requirements.\n3.4 Principles and practices of hygiene and legislation on\nfood safety.\n3.5\nPresentation techniques for food.\n4. Resource\n implications\nThe following resources must be provided:\n4.1 Fully-equipped operational commercial kitchen (including\nindustry-current equipment)\n4.2 Use of real ingredients and food items.\n4.3 Industry-realistic ratios of kitchen staff to customers.\n4.4\nPreparation of dishes for customers with particular\n\n--- PDF PAGE 62 ---\n_______________________________________________________________________________________________60\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\ndietary needs within typical workplace time constraints.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate preparing dishes for\nspecial dietary needs, cultural preferential and to meet\nmedical needs.\n5.2 Sampling of dishes prepared by the candidate.\n5.3 Evaluate of the suitability of dishes prepared by the\ncandidate.\n5.4 Oral or written questions to assess knowledge of dietary\nconstraints and consequences, resulting from cultural,\npreferential or medical needs.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 63 ---\n_______________________________________________________________________________________________61\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nTRANSPORT AND STORE FOOD IN A SAFE\n\nAND HYGIENIC MANNER\n\nUNIT CODE\n\n:"
        },
        "source_text": "TRS512355\n\nUNIT DESCRIPTOR\n:\nThis unit refers to the preparation and cooking\nof foods to meet both basic and specific dietary\nand cultural needs. It covers the ability to apply\nbasic nutritional principles as well as deal with\nspecial dietary and cultural requirements\nnormally encountered in a variety of hospitality\nand catering establishments.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Prepare and present foods to\nmeet basic nutritional needs\n1.1 Foods are prepared to meet basic nutritional\nneeds.\n1.2 Appropriate ingredients are selected to ensure\noptimum quality of end products including:\n• Raw foods\n• Convenience food products\n1.3 Suitable preparation and cooking techniques are\nemployed to retain optimum nutritional values.\n1.4 A variety of nutritionally balanced food is\npresented in an appetizing and attractive manner.\n2. Prepare and present foods to\nmeet special dietary\nrequirements\n2.1 The requirements for special diets are identified\naccording to instructions from relevant persons.\n2.2 Essential ingredients are selected for special\ndietary requirements.\n2.3 Food texture is modified appropriately to suit\nspecific requirements.\n2.4 Food is presented in an appetizing and attractive\nmanner.\n\n--- PDF PAGE 58 ---\n_______________________________________________________________________________________________56\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n3. Prepare foods to satisfy specific\ncultural or religious needs\n3.1 Requirements for specific cultural groups or\nspecial customer requests are identified and\nmet according to instructions from relevant\npersons.\n3.2 Appropriate equipment cooking techniques are\nemployed for specific diets.\n3.3 Food is prepared and served taking into account\nspecified or requested cultural and religious\nconsiderations.\n3.4 An adequate range of nutritionally balanced food\nis presented in an appetizing and attractive\nmanner.\n\n--- PDF PAGE 59 ---\n_______________________________________________________________________________________________57\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all hospitality and catering operations where food and related services are provided\nsuch as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational institutions, health\nestablishments, defense forces, corrective services, residential catering, in-flight and other transport\ncatering, events catering and private catering.\n\nBasic nutritional requirements generally refer to recommendations made in the dietary guidelines made\nby the Nutritionists and Dietitians Association of the Philippines endorsed by the Philippine Government\nand by other recognized health authorities. It includes recommendations made for the general public\nincluding senior citizens, children, adolescents, in order to maintain a healthy balanced diet.\n\nSpecial dietary and cultural requirements include therapeutic and contemporary eating regimes as well as\ncustomer requests and preferences, and specific cultural and religious needs.\n\nVARIABLE\n\nRANGE\n1. Relevant persons\nMay include but not limited to:\n1.1 Customers or family members\n1.2 Supervisors and managers\n1.3 Dieticians\n1.4 Diet technicians\n1.5 Health and medical personnel\n1.6\nReligious personnel\n2. Special dietary requirements\nMay include but not limited to:\n2.1 Vegetarian\n2.2 Vegan\n2.3 Modified sodium/potassium\n2.4 Low fat/cholesterol\n2.5 Lacto-ovo\n2.6 High fibre\n2.7 Gluten-free\n2.8 High/low energy\n2.9 Diabetic\n2.10 Modified texture\n2.11 High/low protein\n2.12 Fluids\n2.13 Food exclusions for allergies and food\nintolerance.\n2.14 Food exclusions related to specific\nmedications.\n2.15 Pork-free menu for Moslems\n\n--- PDF PAGE 60 ---\n_______________________________________________________________________________________________58\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n3. Contemporary eating regimes\nMay include but not limited to:\n3.1 Vegetarian\n3.2 Low-fat or low carbohydrate\n3.3 High-protein\n3.4 Macrobiotic\n3.5 Liver cleansing\n3.6\nElimination\n4. Special cultural groups\nMay include but not limited to:\n4.1 Kosher\n4.2 Halal\n4.3 Vegetarian\n4.4 Hindu\n\n--- PDF PAGE 61 ---\n_______________________________________________________________________________________________59\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated the ability to prepare and/or modify a\nrange of dishes to meet different of dietary requirements.\n1.2 Demonstrated knowledge of the dietary requirements of\nmajor cultural groups.\n1.3 Demonstrated knowledge of the consequences of failing\nto heed special requirements for food allergies, diabetes\nand other medical conditions and customer-identified\ndrug-food interaction.\n2. Underpinning\nknowledge\n2.1 Different cultural, dietary and special requirements that\nmay apply in different contexts, including Halal and\nHaram\n2.2 Basic principles and practices of nutrition including:\n Nutrients and their food sources.\n Influences on food choice\n Food and beverage selection influences\n Food labeling and interpretation.\n Identification of food additives and preservatives.\n Health implications of food choices.\n HALAL\n2.3 Common dietary sensitivities including food allergies and\nintolerance, diabetes and other medical conditions, the\nexistence of drug-food interactions, and the health and\nlegal consequences of failing to heed special\nrequirements.\n2.4 Commodity knowledge of ingredients suitable for meeting\nbasic nutritional and special dietary needs.\n2.5\nLogical and time efficient work flow.\n3. Underpinning\n skills\n3.1 A variety of cooking techniques.\n3.2 The effects of various cooking methods and food storage\non nutrients.\n3.3 Cookery techniques and recipe modification to suit\nspecial dietary requirements.\n3.4 Principles and practices of hygiene and legislation on\nfood safety.\n3.5\nPresentation techniques for food.\n4. Resource\n implications\nThe following resources must be provided:\n4.1 Fully-equipped operational commercial kitchen (including\nindustry-current equipment)\n4.2 Use of real ingredients and food items.\n4.3 Industry-realistic ratios of kitchen staff to customers.\n4.4\nPreparation of dishes for customers with particular\n\n--- PDF PAGE 62 ---\n_______________________________________________________________________________________________60\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\ndietary needs within typical workplace time constraints.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate preparing dishes for\nspecial dietary needs, cultural preferential and to meet\nmedical needs.\n5.2 Sampling of dishes prepared by the candidate.\n5.3 Evaluate of the suitability of dishes prepared by the\ncandidate.\n5.4 Oral or written questions to assess knowledge of dietary\nconstraints and consequences, resulting from cultural,\npreferential or medical needs.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 63 ---\n_______________________________________________________________________________________________61\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nTRANSPORT AND STORE FOOD IN A SAFE\n\nAND HYGIENIC MANNER\n\nUNIT CODE\n\n:"
