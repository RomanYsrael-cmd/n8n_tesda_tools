        "source_text": "--- PDF PAGE 76 ---\n_______________________________________________________________________________________________74 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \nUNIT OF COMPETENCY \n: \nSELECT CATERING SYSTEMS  \n \n \n(MICROS, IFCA AND OTHERS) \n \nUNIT CODE  \n \n \n: \nTRS512359 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the evaluation and \nselection of catering systems, including cook \nchill systems, to meet the food production \nneeds of a catering enterprise. It focuses on \nthe \nplanning \nand \nevaluation \nprocesses \nundertaken by supervisors and managers prior \nto the purchase of a system. \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \n  \nBold and Italicized terms are elaborated in the Range \nStatement\n1.  Review catering system \nrequirements \n \n \n \n \n \n \n \n \n \n \n \n \n1.1 Catering systems requirements are reviewed \ntaking into account all relevant factors \nincluding: \n Type of menu and nutritional requirements \n Production volume \n Location of service points \n Holding requirements \n F & B cost control \n1.2 Constraints are identified including the \navailability of: \n Facilities and equipment \n Operational issues \n Financial resources \n Human resources (current skills and training \nneeds) \n2.  Evaluate and select the catering \nsystem \n2.1 Food production characteristics of systems are \nevaluated against identified requirements. \n2.2 System processes and equipment is evaluated \nfor all stages of the food production process.\n2.3 Staffing requirement for specific systems is \nevaluated and matched with identified \nrequirements. \n2.4\nInstallation requirements for the specific\n\n--- PDF PAGE 77 ---\n_______________________________________________________________________________________________75 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nsystems and their operational impacts are \nevaluated. \n2.5 The production and organizational changes \nrequired to introduce particular systems are \ntaken into account. \n2.6 Advantages and disadvantages of different \nsystems are considered and selections are \nmade accordingly.\n\n--- PDF PAGE 78 ---\n_______________________________________________________________________________________________76 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nRANGE OF VARIABLES  \n \nThis unit applies to all hospitality and catering operations where food and related \nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens, \ncafes, educational institutions, health establishments, defense forces, corrective \nservices, residential catering, in-flight and other transport catering, events catering and \nprivate catering. \n \n \nVARIABLE \n \nRANGE \n1.  Catering systems \nMay include but not limited to: \n1.1 Cook fresh \n1.2 Cook chill – 5 day life \n1.3 Cook chill – extended life \n1.4 Cook freeze \n2.  Stages of the food production \nprocess \nMay include but not limited to: \n2.1 Receiving \n2.2 Storing \n2.3 Preparation \n2.4 Preparation/cooking \n2.5 Post-cooking storage \n2.6 Re-thermalization where applicable \n2.7\nServing\n\n--- PDF PAGE 79 ---\n_______________________________________________________________________________________________77 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 Demonstrated the ability to assess and select catering \nsystems for specific catering operations. \n1.2 Demonstrated the ability to determine enterprise needs \nand constraints in selecting a system. \n2.  Underpinning \nknowledge \n2.1 Types of catering systems and their operating features \nincluding: \n Fresh cook \n Cook chill – 5 day life \n Cook chill – extended life \n Cook freeze \n2.2 Knowledge and understanding of the nutrition principles \nwhich relate to each system. \n2.3 Knowledge of requirements, regulations and legislation \nthat impact on different systems including occupational \nhealth and safety, hygiene codes, HACCP and storage \nissues. \n2.4\nKnowledge on F & B cost control.\n3.  Underpinning  \nskills\n3.1 Principles and methods of cookery, including preparation \nand cookery techniques for all major food groups.\n4.  Resource  \n  implications \nThe following resources must be provided: \n4.1 Project or work activities that allow the candidate to \nselect system for specific workplace situations and \nneeds.\n5.  Method of \nAssessment \nCompetency may be assessed through: \n5.1 Case studies to assess ability to select appropriate \ncatering systems for a particular enterprise or context. \n5.2 Project to select an appropriate catering system for an \nenterprise including research, costing, evaluation and \nrecommendations. \n5.3 Evaluation of reports prepared by the candidate detailing \nthe processes and challenges involved in the selection of \na catering system. \n5.4 Written or oral questions to test knowledge of \nadvantages and limitation of various catering systems. \n5.5 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate.\n\n--- PDF PAGE 80 ---\n_______________________________________________________________________________________________78 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n6.  Context for \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through TESDA’s \naccredited assessment center\n",
