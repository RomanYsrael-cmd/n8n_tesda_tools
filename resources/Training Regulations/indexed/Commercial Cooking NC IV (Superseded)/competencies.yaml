          "source_text": "1.   Critical aspects of  \nCompetency \nAssessment requires evidences that the candidate: \n1.1 Demonstrated ability to implement and maintain food \nsafety standards and program to enterprise standards \nand in line with legislative requirements. \n1.2 Demonstrated involvement and interaction with a \nkitchen team.\n2.   Underpinning    \nKnowledge  \n2.1 Principles and methods of food production. \n2.2 HACCP based concepts that support food safety \nprogram design. \n2.3 Options for the structure, development and \nimplementation of a food safety program, including \nHACCP. \n2.4 Hygiene and food safety legislation and regulations in \nrelation to food safety program requirements. \n2.5 Local health regulations pertaining to food production \nand packaging. \n2.6 Conditions for development of microbiological \ncontamination and control methods. \n2.7\nPotential staff training needs in relation to food safety.\n3.  Underpinning Skills\n3.1 Policies and practices of personal hygiene and food \nhandling. \n3.2 Planning and consultative processes which could be \nused in program development. \n3.3\nFood safety recording requirements and options.\n4.  Resource  \n \nImplications \nThe following resources MUST be provided: \n4.1 Project or work activities conducted over a period of \ntime and which allow the candidate to establish and \nmonitor a food safety program for a particular cookery or \ncatering workplace. \n4.2\nInvolvement and interaction with a kitchen team.\n\n--- PDF PAGE 103 ---\n_______________________________________________________________________________________________101 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \n5.  Method of  \n  Assessment \nCompetency may be assessed through: \n5.1 Review of documentation related to food safety \nsystems, including policies and procedures, audit \nsummaries and reports developed by the candidate. \n5.2 Case studies to assess ability to develop systems to \nmeet differing workplace needs. \n5.3 Activities conducted in conjunction with industry to allow \nthe candidate to develop systems for a real workplace. \n5.4 Written or oral questions about chosen systems and \nreason for selection. \n5.5 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate.\n6.   Context for      \n \n Assessment \n6.1     Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2     Assessment activities are carried out through TESDA’s \naccredited assessment center",
