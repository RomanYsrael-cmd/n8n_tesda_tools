e person/department.\n4. Complete financial \nreports \n4.1 All required financial reports are completed \naccurately and within designated timelines. \n4.2 Clear and concise information are produced to \nenable informed decision-making. \n4.3 Reports are promptly forwarded to the appropriate \nperson/department.\n\n--- PDF PAGE 49 ---\n_______________________________________________________________________________________________47 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Budgets  \nMay include but not limited to: \n1.1 Cash budgets \n1.2 Departmental budgets \n1.3 Wages budgets \n1.4 Project budgets \n1.5 Purchasing budgets \n1.6 Sales budgets \n1.7 Cashflow budgets \n1.8 Budgets for a small business\n2. Research \nMay include but not limited to: \n2.1 Discussions with existing suppliers \n2.2 Sourcing of new suppliers \n2.3 Evaluation of staffing/rostering requirements \n2.4 Review of operating procedures \n2.5 Potential rostering changes\n3. Financial reports \nMay include but not limited to: \n3.1 Daily, weekly, monthly transactions and \nreports \n3.2 Break-up by department \n3.3 Occupancy \n3.4 Sales performance \n3.5 Commission earnings \n3.6 Sales returns \n3.7 Yield management \n3.8 Commercial account activity\n\n--- PDF PAGE 50 ---\n_______________________________________________________________________________________________48 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007"
