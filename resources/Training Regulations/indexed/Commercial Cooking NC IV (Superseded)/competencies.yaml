ertificate of training – local and abroad)\n 5.4 Simulations and role-plays\n 6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 31 ---\n_______________________________________________________________________________________________29\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nCONDUCT ASSESSMENT\nUNIT CODE\n:"
