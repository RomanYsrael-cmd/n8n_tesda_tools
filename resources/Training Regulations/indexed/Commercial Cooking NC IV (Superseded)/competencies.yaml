        "source_title": "APPLY CATERING CONTROL PRINCIPLES",
        "source_text": "--- PDF PAGE 67 ---\n_______________________________________________________________________________________________65 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \nUNIT OF COMPETENCY \n: \nAPPLY CATERING CONTROL PRINCIPLES  \n \nUNIT CODE  \n \n \n: \nTRS512357 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the application of catering \ncontrol principles to the ordering, receiving, \nstorage and processing of food to minimize \nwastage. \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \n  \nBold and Italicized terms are elaborated in the Range \nStatement\n1.  Identify procedures to reduce \nwastage \n1.1 Appropriate procedures for reducing \nwastage during ordering, receiving, storage \nand processing of food are identified. \n1.2 Appropriate control measures are identified to \nreduce loss. \n2.  Carry out catering control \nprocedures \n \n \n2.1 Portion control is carried out effectively. \n2.2 Calibrated equipment are used correctly to \nensure correct portion control. \n2.3 Recipes are accurately followed to avoid \nwastage. \n2.4 Suitable quantities of stock are ordered to \navoid over or under ordering. \n2.5 Stock are rotated and documented accurately. \n2.6 Food is stored correctly and securely to \nminimize wastage and loss. \n3.  Minimize waste \n3.1 Re-usable products of food preparation and \ncooking are utilized effectively. \n3.2 Recyclable products are utilized and \ndisposed in an environmentally appropriate \nway. \n3.3 Non-recyclable products are disposed of \naccording to health and safety requirements, \nrelevant regulations and in environmentally \nappropriate way.\n\n--- PDF PAGE 68 ---\n_______________________________________________________________________________________________66 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \nRANGE OF VARIABLES  \n \nThis unit applies to all hospitality and catering operations where food and related \nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens, \ncafes, educational institutions, health establishments, defense forces, corrective \nservices, residential catering, in-flight and other transport catering, events catering and \nprivate catering. \n  \nCatering control procedures are the processes and procedures implemented at the \noperational level that result in the control of costs, energy usage, materials and time. \n \n \nVARIABLE \n \nRANGE \n1.  Procedures for reducing \nwastage \nMay include but not limited to: \n1.1 Portion control \n1.2 Ordering to specifications \n1.3 Stock rotation \n1.4 Using appropriate equipments \n1.5 Appropriate storage \n1.6 Using standard recipe cards \n2.  Re-usable products \nMay include but not limited to: \n2.1 Meat and fish off-cuts \n2.2 Bones and trimmings \n2.3\nVegetable peelings and off-cuts\n3.  Recyclable products \nMay include but not limited to: \n3.1 Glass bottles and jars \n3.2 Plastics \n3.3 Paper and cardboard \n3.4 Tin or aluminum containers. \n3.5\nVegetable matter\n\n--- PDF PAGE 69 ---\n_______________________________________________________________________________________________67 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of competency \nAssessment requires evidences that the \ncandidate: \n1.1 Demonstrated the ability to use portion \ncontrol, stock control and other waste \nreduction measures effectively. \n1.2 Demonstrated the ability to minimize \nwastage and to manage waste \nproductively, including re-cycling systems. \n1.3 Demonstrated the ability to conform with \nthe establishments menu standards.\n2.  Underpinning knowledge \n2.1 Links between hygiene and food safety \nand waste minimization. \n2.2 Preparation and cooking procedures that \nassist in minimizing waste.\n3.  Underpinning skills \n3.1 Stock control procedures that assist in \nminimizing waste. \n3.2 Storage procedures that assist in \nminimizing waste.\n4.  Resource implications \nThe following resources must be provided: \n4.1 Fully-equipped commercial kitchen using \nreal ingredients and food items. \n4.2 Production of portion-controlled menu \nitems.\n5.  Method of Assessment \nCompetency may be assessed through: \n5.1 Evaluation of amount of products used by \nthe candidate across a period of operation. \n5.2 Review of reports prepared by the \ncandidate detailing ways in which waste \nwere minimized during a service period. \n5.3 Written or oral questions to test knowledge \nof waste minimization and control systems. \n5.4 Review of stock control and portion control \ndocumentation prepared by the candidate. \n5.5 Review of portfolios of evidence and third \nparty workplace reports of on-the-job \nperformance by the candidate.\n6.  Context for Assessment \n6.1 Assessment may be done in the workplace \nor in a simulated workplace setting \n(assessment centers) \n6.2 Assessment activities are carried out \nthrough TESDA’s accredited assessment \ncenter\n",
