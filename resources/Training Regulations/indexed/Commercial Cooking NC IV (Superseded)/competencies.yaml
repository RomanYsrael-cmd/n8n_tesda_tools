        "evidence_guide": {
          "source_text": "1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated the ability to conduct market research, \nidentify current and relevant trends. \n1.2 Demonstrated the ability to cost menus and food items \nand develop menus within budgets. \n1.3 Prepared menus meeting the needs of a range of \ndifferent target markets. \n1.4\nDemonstrated the ability to design all types of menus.\n2.  Underpinning \nknowledge \n2.1 Different types and styles of menus for different type of \nfood outlets. \n2.2 Historical development of menus, modern trends in \nmenus. \n2.3 Current food trends, typical cultural and ethnic dining \ninfluences. \n2.4 Product knowledge of commodities required to meet \nmenu needs of particular target groups, seasonal \nproducts. \n2.5 Principle of nutrition, ways of planning nutritionally-\nbalanced menus, the effects of cooking on the nutritional \nvalue of food and the nutritional needs of target groups. \n2.6 Culinary terms used in relation to menus and food items. \n2.7 Sources of information on food service trends. \n2.8 Menu merchandising (lay-out, paper, cala, harmony) \n2.9\nMenu listing (descriptive early)\n3.  Underpinning  \n \n skills \n3.1 Costing and budgeting techniques for menus. \n3.2 Basic market research techniques in specific relation to \nfood service preferences and trends.\n4.  Resource \n \nimplications \nThe following resources must be provided: \n4.1 Project or work activities that allow the candidate to \ndevelop multiple menus to meet a range of target \nmarkets for various catering operations or hospitality \noutlets. \n4.2 Use of current industry costing data and market trend \ninformation.\n5.  Method of \nAssessment \nCompetency may be assessed through: \n5.1 Review of menus prepared by candidate to meet the \nneeds of different target groups and markets. \n5.2 Case studies to assess ability to develop menus to meet \ndiffering needs. \n5.3 Written or oral questions to test knowledge of marketing \nissues, current trends on food. \n5.4\nReview of portfolios of evidence and third party\n\n--- PDF PAGE 95 ---\n_______________________________________________________________________________________________93 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \nworkplace reports of on-the-job performance by the \ncandidate.\n6.  Context for \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through TESDA’s \naccredited assessment center",
