          "source_text": "1. Encourage respect for \ndiversity in the \nworkplace \n1.1. A role model is provided for others through \nindividual behavior that demonstrates respect \nfor diversity. \n1.2. Work practices are developed and planning is \nundertaken in a manner which shows respect \nfor workplace diversity. \n1.3. Colleagues are assisted and coached in ways \nof accepting diversity in relation to both \ncolleagues and guests.\n2. Use diversity as an \nasset \n2.1. The skills of a diverse workforce are recognized \nand used to enhance company performance. \n2.2. The benefits of productive diversity are \npromoted to colleagues.\n3. Deal with problems \narising from diversity \nissues \n3.1. Workplace problems that arise from diversity \nissues are recognized promptly and action is \ntaken to resolve the situation. \n3.2. Training needs are identified and appropriate \naction is taken. \n3.3. Coaching and mentoring are used to assist \ncolleagues to successfully work in a diverse \nenvironment.\n\n--- PDF PAGE 45 ---\n_______________________________________________________________________________________________43 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Diversity \n \nMay include but is not limited to: \n1.10 \nRace \n1.11 \nLanguage \n1.12 \nReligion \n1.13 \nSpecial needs \n1.14 \nDisabilities \n1.15 \nFamily structure \n1.16 \nGender \n1.17 \nAge \n1.18\nSexual preference\n2.  Work practices that reflect \nrespect for diversity \nMay include but is not limited to: \n2.1 \nAcknowledgement of religious and cultural \ncelebrations \n2.2 \nAppropriate allocation of duties to \nparticular staff members \n2.3 \nCulturally appropriate mixing of staff \n2.4 \nTraining in culturally-appropriate \ncommunication \n2.5 \nConsideration of customers with special \nneeds \n3.   Benefits of productive \ndiversity \nMay include but is not limited to:    \n3.3 \nA multilingual workforce \n3.4 \nWorkforce that reflects the diversity of the \ncustomer base \n3.5 \nImproved cross-cultural communication \n3.6 \nEducation of the workforce \n3.7 \nRemoval of prejudice \n3.8 \nDifferent perspectives on problem solving \n3.9 \nIncrease trade with other countries/cultures \n3.10 More interesting work environments\n\n--- PDF PAGE 46 ---\n_______________________________________________________________________________________________44 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007"
        },
        "evidence_guide": {
          "source_text": "1. Critical \naspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Demonstrated understanding of the role of leaders and \nmanagers in encouraging diversity in the hospitality \nindustry \n1.2. Demonstrated knowledge of cross-cultural \ncommunication techniques as they apply to leaders \nand managers \n1.3. Demonstrated knowledge of specific cultural issues \nthat may apply in a particular industry context\n2. Underpinning \nKnowledge  \n2.1. Specific diversity issues which apply to the hospitality \nindustry and which contribute to the industry’s \nprogress including benefits of productive diversity\n3. Underpinning \nSkills \n3.1. Cross-cultural communication skills with specific \nreference to the roles of leaders and managers \nincluding cross-cultural communication for: \n Conflict resolution \n Problem-solving \n Negotiation \nMotivation\n4. Resource \nImplications \nThe following resources MUST  be provided: \n4.1. Project or work activities that allow the candidate to \naddress typical diversity issues found in hospitality \nworkplaces\n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. Case studies to develop strategies for effectively \nmanaging diversity in different industry contexts \n5.2. Oral or written questions to assess knowledge of \ncross-cultural issues and communication techniques \n5.3. Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate\n6. Context for \nAssessment \n6.1. Competency may be assessed in workplace or in a \nsimulated workplace setting \n6.2. Assessment shall be observed while tasks are being \nundertaken whether individually or in-group",
