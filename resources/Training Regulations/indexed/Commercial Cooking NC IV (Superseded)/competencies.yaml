        "source_text": "--- PDF PAGE 70 ---\n_______________________________________________________________________________________________68 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \nUNIT OF COMPETENCY \n: \nDEVELOP MENUS TO MEET SPECIAL  \n \n \nDIETARY AND CULTURAL NEEDS \n \nUNIT CODE  \n \n \n: \nTRS512358 \n \nUNIT DESCRIPTOR \n: \nThis unit refers to the development of menus \nand meal plans, including meeting specific \ndietary and cultural needs of different target \nmarkets.  \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \n  \nBold and Italicized terms are elaborated in the Range \nStatement\n1.  Identify the dietary and cultural \nrequirements of customers \n1.1 Dietary and cultural requirements of \ndifferent target groups are identified through \nconsideration of all appropriate factors. \n1.2 Contemporary dietary trends and regimes \nare taken into consideration in assessing \ndietary requirements. \n1.3 Dietitians, medical specialists, or other relevant \npersonnel are liaised with in order to identify \nand confirm requirements. \n2.  Develop menus and meal plans \nto meet dietary and cultural \nrequirements. \n2.1 A variety of suitable foods, meals and menus \nare selected for specific dietary \nrequirements taking account of Dietary \nGuidelines and menu planning principles. \n2.2 Meal plans and menus that promote good \nhealth and reduce the incidence of diet-related \nhealth problems are developed in consultation \nwith relevant personnel, according to job role. \n2.3 Cyclic menus are prepared when required and \nthey are balanced in terms of nutritional \nrequirements and variety. \n2.4 Food preparation and cooking methods are \nrecommended to maximize nutritional value of \nfood. \n2.5 Appropriate combinations of food are identified \nto meet macro and micro nutrient\n\n--- PDF PAGE 71 ---\n_______________________________________________________________________________________________69 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nrequirements. \n \n2.6 Special needs are taken into consideration \nincluding texture, composition and portion size.\n2.7 Sufficient choices of dishes are incorporated \ninto the menus. \n2.8  Menus are costed to comply with costing \nconstraints. \n2.9 Correct terminology is used in menus and \nmeal plans. \n3.  Evaluate meals and menus \n3.1 Meals and menus are evaluated using \nappropriate methods to ensure customer \nsatisfaction based on the enterprise’s menu \nstandard. \n3.2 Menus are adjusted as required to ensure \ndietary needs and goals are met.\n\n--- PDF PAGE 72 ---\n_______________________________________________________________________________________________70 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nRANGE OF VARIABLES  \n \nThis unit applies to all hospitality and catering operations where food and related services are \nprovided such as hotels and restaurants, cafeterias, kiosks, canteens, cafes, educational \ninstitutions, health establishments, defense forces, corrective services, residential catering, in-\nflight and other transport catering, events catering and private catering. \n \nEvidence is required of knowledge and understanding of a range of different cultural, dietary \nand special requirements.  However, the focus of this range will vary according to the target \nmarkets of a particular workplace.  Special dietary needs include therapeutic and contemporary \nregimes as well as customer requests. \n \nA variety of menus and meal plans must be developed to meet differing requirements.  They \nmay be developed to address the requirements of individuals or larger target audiences. \n \n \nVARIABLE \n \nRANGE \n1. Dietary and cultural needs of target \ngroups \nMay include but not limited to: \n1.1 Age requirements \n1.2 Lifestyle \n1.3 Food preferences \n1.4 Food restrictions or allergies \n1.5 Physical condition \n1.6 Nutritional requirements \n1.7 Those with varying nutritional and energy \nrequirements due to physical condition \n1.8 Cultural or religious needs \n1.9 Meal – breakfast, lunch, dinner \n1.10 Occasion\n2. Target groups refers to all sectors of \nthe population  \nMay include but not limited to: \n2.1 Infants \n2.2 Children \n2.3 Adolescents \n2.4 Athletes \n2.5The aged\n3. Special cultural groups \nMay include but not limited to: \n3.1 Halal \n3.2 Vegetarian \n3.3 Hindu \n4. Contemporary diet regimes \nMay include but not limited to: \n4.1 Vegetarian \n4.2 Low-fat, low carbohydrate or low kilojoule \n4.3Macrobiotic\n\n--- PDF PAGE 73 ---\n_______________________________________________________________________________________________71 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nVARIABLE \n \nRANGE \n5. Menus and meal plans \nMay include but not limited to: \n5.1 Daily meal plans \n5.2 Daily or weekly menus \n5.3 Cyclic menus \n6. Special dietary requirements \nMay include but not limited to: \n6.1 Vegetarian \n6.2 Vegan \n6.3 Modified sodium/potassium \n6.4 Low fat/cholesterol \n6.5 Lacto-ovo \n6.6 High fiber \n6.7 Gluten fee \n6.8 High/low energy \n6.9 Diabetic \n6.10 Modified texture \n6.11 High/low protein \n6.12 Non-pork meals \n6.13 Fluids \n6.14 Exclusions for allergies and food \nintolerance\n7. Methods used to evaluate diets and\nmeal plans and analyze foods \nMay include but not limited to: \n7.1 Computer programs \n7.2 Customer feedback questionnaires \n7.3 Interviews with customer and health support\npersonnel \n7.4Nutrition guides\n\n--- PDF PAGE 74 ---\n_______________________________________________________________________________________________72 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n \nEVIDENCE GUIDE \n \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidences that the candidate: \n1.1 Demonstrated the ability to prepare menus and meal \nplans to meet different dietary and cultural needs. \n1.2 Demonstrated knowledge of commodities required to \nmeet particular dietary and cultural needs. \n1.3 Demonstrated knowledge of the consequences of \nfailing to heed special dietary requirements.\n2.  Underpinning \nknowledge \n2.1 Basic principles and practices of nutrition, including: \n Nutrients and their food sources \n Influences on food choice \n Food labeling requirements and interpretation \n Food additives and preservatives \n Health implications of food choices. \n2.2 Dietary sensitivities including food allergies and \nintolerance, diabetes and other medical conditions and \nthe existence of drug-free interactions, and the health \nand legal consequences of failing to heed special \nrequirements. \n2.3 Commodity knowledge of ingredients suitable for \nmeeting basic nutritional and special dietary needs. \n2.4 The effects of various cooking methods and food \nstorage on nutrients.\n3.  Underpinning  \n     skills\n3.1 Cookery techniques and recipe modification to suit \nspecial dietary requirements.\n4.  Resource \n      implications \nThe following resources must be provided: \n4.1 Project or work activities that allow the candidate to \ndevelop menus to meet multiple and differing and \ncultural needs.\n5.  Method of \nAssessment \nCompetency may be assessed through: \n5.1 Evaluation of menus and meal plans prepared by \ncandidate involving a variety of target markets and \npurposes. \n5.2 Case studies to assess ability to develop menus and \nmeal plans for different target groups and \ncircumstances. \n5.3 Written or oral questions to test knowledge of nutrition, \ncultural and dietary requirements. \n5.4 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate.\n\n--- PDF PAGE 75 ---\n_______________________________________________________________________________________________73 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007 \n \n6.  Context for \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through TESDA’s \naccredited assessment center\n",
        "required_knowledge": null,
        "required_skills": null
      },
