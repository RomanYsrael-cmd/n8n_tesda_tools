ics and transport details \n6.6 Resources eg. venue, commodities, \nequipment, machinery, vehicles and staff \n6.7 Security arrangements \n6.8 Purchasing of food, materials and equipment\n6.9 Production and distribution of food and \nbeverage.\n\n--- PDF PAGE 90 ---\n_______________________________________________________________________________________________88 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007"
