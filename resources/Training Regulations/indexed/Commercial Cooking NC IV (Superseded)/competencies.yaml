        ],
        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Analyzed the problem\n1.2. Identified possible solutions\n1.3. Implemented solutions\n1.4. Recommended solutions to higher management\n1.5. Outcome evaluated/monitored\nEvidence of satisfactory performance in this unit can be\nobtained by observation of performance and questioning\nto indicate knowledge and understanding of the elements\nof the competency and performance criteria.\n2. Underpinning\nknowledge\n2.1. Broad understanding of systems, organizational\nsystems and functions\n2.2. Broad knowledge of help desk and maintenance\npractices\n2.3. Current industry accepted hardware and software\nproducts with broad and detailed knowledge of its\ngeneral features and capabilities\n2.4. Broad knowledge of the operating system\n2.5. Broad knowledge of the client business domain\n2.6. Broad knowledge based incorporating current\nindustry practices related to escalation procedures\n2.7. Broad knowledge based of diagnostic tools\n2.8 . General principles of OHS\n2.8. Divisional/unit responsibilities\n\n--- PDF PAGE 18 ---\n_______________________________________________________________________________________________16\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n3. Underpinning\nskills\n3.1. Decision making within a limited range of options.\n3.2. Communication is clear, precise and varies\naccording to the type of audience\n3.3. Teamwork in reference to personal responsibility\n3.4. Time management as applied to self-management.\n3.5. Analytical skills in relation to routine malfunctions.\n3.6. General customer service skills displayed.\n3.7. Questioning and active listening is employed to\nclarify general information\n4. Resource\nimplications\n4.1. Assessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of\nscenarios/case studies/what ifs will be required as\nwell as bank of questions which will be used to\nprobe the reasoning behind the observable actions.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Through direct observation of application to tasks\nand questions related to underpinning knowledge\nUnder general guidance, checking various stages of\noperation and at the completion of the activity against\nperformance criteria and specifications\n\n6. Context of\nassessment\n6.1. Competency may be assessed in the work place or\nin a simulated work place setting\n6.2. Assessment shall be carried out through TESDA’s\nAccredited Assessment Centers/Venues while\ntasks are undertaken either individually or as part\nof a team under limited supervision\n\n--- PDF PAGE 19 ---\n_______________________________________________________________________________________________17\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n UNIT OF COMPETENCY : COLLECT, ANALYZE AND ORGANIZE INFORMATION\n\n UNIT CODE :"
        },
        "source_text": "500311117\nUNIT DESCRIPTOR\n:\nThis competency covers the knowledge, skills and\nattitudes required to apply the process of problem solving\nand other problems beyond those associated directly with\nthe process unit. It includes the application of structured\nprocesses and improvement tools. This competency is\ntypically performed by an experienced technician, team\nleader or supervisor.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1.\nAnalyze the problem\n1.1. Issues/concerns are evaluated based on data\ngathered\n1.2. Possible causes of problem are identified within\nthe area of responsibility as based on\nexperience and the use of problem solving\ntools/analytical techniques\n1.3 Possible cause statements are developed based\non findings\n2.\nIdentify possible\nsolutions\n2.1 All possible options are considered for resolution of\nthe problem in accordance with safety and\noperating procedures\n2.2 Strengths and weaknesses of possible options are\nconsidered\n2.3 Corrective action is determined to resolve the\nproblem and its possible future causes\n3.\nRecommend solution\nto higher\nmanagement\n3.1 Report/communication or documentation are\nprepared\n3.2 Recommendations are presented to appropriate\npersonnel\n3.3 Recommendations are followed-up, if required\n\n--- PDF PAGE 15 ---\n_______________________________________________________________________________________________13\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n4.\nImplement solution\n4.1 Measurable objectives are identified\n4.2 Resource needs are identified\n4.3 Timelines are identified in accordance with plan\n5.\nEvaluate/Monitor\nresults and outcome\n5.1. Processes and improvements are identified based\non evaluative assessment of problem\n5.2. Recommendations are prepared and submitted to\nsuperiors.\n\n--- PDF PAGE 16 ---\n_______________________________________________________________________________________________14\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Area of responsibility\nVariables may include but are limited to:\n1.1.\nWork environment\n1.2.\nProblem solution processes\n1.3.\nPreventative maintenance and diagnostic\npolicy\n1.4.\nRoles and technical responsibilities\n2. Occupational Health and\nSafety\n2.1.\nAs per company, statutory and vendor\nrequirements. Ergonomic and\nenvironmental factors must be considered\nduring the demonstration of this\ncompetency.\n3. Communication\n3.1.\nVariables may include but are not limited to:\n3.2.\nWritten communication can involve both\nhand written and printed material, internal\nmemos, electronic mail, briefing notes and\nbulletin boards.\n4. Documentation\n4.1.\nAudit trails\n4.2.\nNaming standards\n4.3.\nVersion control\n\n--- PDF PAGE 17 ---\n_______________________________________________________________________________________________15\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Analyzed the problem\n1.2. Identified possible solutions\n1.3. Implemented solutions\n1.4. Recommended solutions to higher management\n1.5. Outcome evaluated/monitored\nEvidence of satisfactory performance in this unit can be\nobtained by observation of performance and questioning\nto indicate knowledge and understanding of the elements\nof the competency and performance criteria.\n2. Underpinning\nknowledge\n2.1. Broad understanding of systems, organizational\nsystems and functions\n2.2. Broad knowledge of help desk and maintenance\npractices\n2.3. Current industry accepted hardware and software\nproducts with broad and detailed knowledge of its\ngeneral features and capabilities\n2.4. Broad knowledge of the operating system\n2.5. Broad knowledge of the client business domain\n2.6. Broad knowledge based incorporating current\nindustry practices related to escalation procedures\n2.7. Broad knowledge based of diagnostic tools\n2.8 . General principles of OHS\n2.8. Divisional/unit responsibilities\n\n--- PDF PAGE 18 ---\n_______________________________________________________________________________________________16\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n3. Underpinning\nskills\n3.1. Decision making within a limited range of options.\n3.2. Communication is clear, precise and varies\naccording to the type of audience\n3.3. Teamwork in reference to personal responsibility\n3.4. Time management as applied to self-management.\n3.5. Analytical skills in relation to routine malfunctions.\n3.6. General customer service skills displayed.\n3.7. Questioning and active listening is employed to\nclarify general information\n4. Resource\nimplications\n4.1. Assessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of\nscenarios/case studies/what ifs will be required as\nwell as bank of questions which will be used to\nprobe the reasoning behind the observable actions.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Through direct observation of application to tasks\nand questions related to underpinning knowledge\nUnder general guidance, checking various stages of\noperation and at the completion of the activity against\nperformance criteria and specifications\n\n6. Context of\nassessment\n6.1. Competency may be assessed in the work place or\nin a simulated work place setting\n6.2. Assessment shall be carried out through TESDA’s\nAccredited Assessment Centers/Venues while\ntasks are undertaken either individually or as part\nof a team under limited supervision\n\n--- PDF PAGE 19 ---\n_______________________________________________________________________________________________17\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\n UNIT OF COMPETENCY : COLLECT, ANALYZE AND ORGANIZE INFORMATION\n\n UNIT CODE :"
