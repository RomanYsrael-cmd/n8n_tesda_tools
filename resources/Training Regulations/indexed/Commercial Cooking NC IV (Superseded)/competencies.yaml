  "source_section_text": "SECTION 1 COMMERCIAL COOKING NC IV QUALIFICATION\n\nThe Commercial Cooking NC IV Qualification consists of competencies that a\nperson must achieve to plan and prepare foods to meet special dietary and cultural\nneeds; designs menus, plan and implement a food safety program and catering event;\nand manage a team of cooks for guests in hotels, motels, restaurants, clubs, canteens,\nresorts, luxury liners and cruise ships within the company’s acceptable standards.\nHe/she is also able to implement and/or execute plans and monitor expenses to\ngenerate the required gross profit margins.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\n(Hotels and Restaurants) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\n .\nCODE NO.\nBASIC COMPETENCIES\n\n500311115\nUtilize specialized communication skills\n500311116\nDevelop teams and individuals\n500311117\nApply problem solving techniques in the workplace\n500311118\nCollect, analyze and organize information\n500311119\nPlan and organize work\n500311120\nPromote environmental protection\n\nCODE NO.\nCOMMON COMPETENCIES\n\n TRS311210\nConduct assessment\n TRS311211 Manage workplace diversity\n TRS311212\nManage finances within a budget\n TRS311213\nManage quality customer service\n\n--- PDF PAGE 4 ---\n_______________________________________________________________________________________________2\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007\n\nCODE NO.\nCORE COMPETENCIES\n\nTRS512355\nPrepare foods according to dietary and cultural needs\nTRS512356\nTransport and store food in a safe and hygienic manner\nTRS512357\nApply catering control principles\nTRS512358\nDevelop menus to meet special dietary and cultural needs\nTRS512359\nSelect catering systems\nTRS512360\nManage facilities associated with commercial catering\ncontracts\nTRS512361\nPlan the catering for an event or function\nTRS512362\nDesign menus to meet market needs\nTRS512363\nDevelop a food safety program\n\nA person who has achieved this Qualification is competent to be a/an:\n\n Sous Chef\n Executive Sous Chef\n Restaurant Chef\n\n--- PDF PAGE 5 ---\n_______________________________________________________________________________________________3\nTR - COMMERCIAL COOKING NC IV Promulgated April 2007"
}
