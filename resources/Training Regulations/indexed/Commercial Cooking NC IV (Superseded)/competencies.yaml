          "source_text": "This unit applies to all hospitality and catering operations where food and related \nservices are provided such as hotels and restaurants, cafeterias, kiosks, canteens, \ncafes, educational institutions, health establishments, defense forces, corrective \nservices, residential catering, in-flight and other transport catering, events catering and \nprivate catering. \n \n \nVARIABLE \n \nRANGE \n1.  Target markets \nMay include but not limited to: \n1.1 Those with particular nutritional or dietary \nneeds and interests. \n1.2 Young people (elementary, highschool) \n1.3 Older people (professionals, yuppies) \n1.4 Infants/children/adolescent \n1.5 Prison populations \n1.6 Defense forcers \n1.7 Athletes \n1.8 Health care customers (the young and the \nold who is physically challenged) \n1.9 People from specific cultural or religious \ngroups \n1.10 People from different socio-economic \ngroups \n1.11 Students (college)\n2.  Market trends in food service \nMay include but not limited to: \n2.1 Contemporary eating habits \n2.2 Media influence \n2.3 Cultural and ethnic influences \n2.4 Seasonal and popular influences \n2.5\nMajor events and festivals\n3.  Types of menus \nMay include but not limited to: \n3.1 Table d’hòte \n3.2 Á la carte \n3.3 Set \n3.4 Function \n3.5 Buffet \n3.6 Cyclical \n3.7 Semi- á al carte \n3.8\nCalifornian menu\n\n--- PDF PAGE 94 ---\n_______________________________________________________________________________________________92 \nTR - COMMERCIAL COOKING NC IV                                                                          Promulgated  April 2007"
