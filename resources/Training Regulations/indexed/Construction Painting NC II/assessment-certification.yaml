  "source_text": "SECTION 4\nASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment\nis to confirm that an individual can perform to the standards expected at the\nworkplace as expressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence through project-type assessment\ncovering all the units of competency that comprise the Training\nRegulations for Construction Painting NC II as follows:\n\nBASIC COMPETENCIES\nParticipate in workplace communication\nWork in team environment\nPractice career professionalism\nPractice occupational health and safety procedures\nCOMMON COMPETENCIES\nPrepare construction materials and tools\nObserve procedures, specifications and manuals of instruction\nPerform mensurations and calculations\nMaintain tools and equipment\nCORE COMPETENCIES\nPrepare tools, painting materials and equipment\nPrepare surface for painting\nPerform painting works\nPerform re-touching works\n\n4.1.2 Candidates wanting to be certified will have to be assessed in\naccordance with the requirements identified in the evidence guide of\nthe relevant unit/s of competency.\n\n--- PDF PAGE 93 ---\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 91\n4.1.3 Candidates applying for competency assessment and certification\nfor Construction Painting NC II:\n4.1.3.1 Graduates of formal, non-formal and informal institutions\nincluding enterprise-based training programs\n4.1.3.2 Experienced workers (wage-employed or self-employed)\n4.1.4 Conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the\npurpose.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where gaps\nexist, including readiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior `\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 94 ---\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 92\n\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nANNEX A\nCONSTRUCTION PAINTING NC II\n\nCOMPETENCY MAP\nCIVIL WORKS SUB-SECTOR\nRepair defective\nconcrete and\nmasonry surfaces\nPerform basic\nmasonry\nworks\nLay brick/ block\nfor structures\nPlaster\nconcrete/\nmasonry\nInstall pre-cast\nbalusters and\nhandrails\nPrepare\nmasonry\nmaterials\nPrepare tools,\npainting materials\nand equipment\nPrepare surface\nfor painting\n\nApply special\ncement finishes\nto concrete and\nmasonry surfaces\nEstimate\npaint\nrequirements\nPerform\npainting works\n\nStakeout\nbuilding lines\nFabricate form\nworks\nInstall form work\ncomponents\nStrip form work\ncomponents\nInstall\nframing\n works\nPerform single unit\nconstruction\npaintinginstallation\nand assemblies\nPerform minor\nconstruction\nworks\nInstall architectural\nceiling, wall\nsheats/panels/\nboards and floor\nFabricate/Install\ndoor/window\njambs and panels\nInstall stair\ncomponents and/or\npre-fabricated stair\nassembly\nInstall built-in\nand/or pre-\nfabricated cabinets\nPerform\nmixing/tinting of\ncolor paints\nPerform re-\ntouching work\nPerform complex and\nmulti-story\nconstruction\npaintinginstallation\nand assemblies\nPerform\nconstruction\npaintingrepair and\nmaintenance\nworks\nConduct pipe\nleak testing\nMake piping\njoints and\nconnections\nInstall hot and\npotable chilled\nwater-piping\nsystem\nPrepare pipes\nfor installation\nDraft\nconstruction\ni ti\nd\ni\nPrepare\nconstruction\nmaterials and\ntools\nObserve\nprocedures,\nspecifications and\nmanuals of\ninstructions\nMaintain tools\nand equipment\nPerform\nmensurations\nand\ncalculations\nInterpret\ntechnical\ndrawings and\nplans\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nPractice\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small\nteam\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialist\ncommunication\nskills\nDevelop team\nand individual\nApply problem\nsolving\ntechniques in the\nworkplace\nCollect and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 95 ---\nTR – Construction Painting NC II (Amended) Promulgated June 16, 2015 93\nDEFINITION OF TERMS\n\n1. Alkalinity\nRefers to the measurement of the concentration of base or amount of\nfree base present.\n2. Certification\nRefers to the process of verifying and validating competencies of a\nperson through assessment.\n3. Competency\nIs the application of knowledge, skills and attitudes to perform work\nactivities to the standard expected in the workplace.\n4. Element\nRefers to the building blocks of a unit of competency. It describes in\noutcome terms the functions that a person who works in a particular\narea of work is able to perform.\n5. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning skills,\nresource implications, context of assessment and assessment\nmethod.\n6. Level\nRefers to the category following the level of difficulty and complexity of\nskills and knowledge required to do the job.\n7. Neutralizer\nRefers to the substance that makes or reacts with a substrate (object\nto be coated) to render it neutral.\n8. Paint\nRefers in general to all types of protective coatings, and in particular to\na mixture containing a pigment binder and vehicle, which can be\nspread to a thin film on interior or exterior surfaces.\n9. Philippine TVET\nQualification\nFramework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter for\nthe integration of learning and assessment in the middle skills\ndevelopment.\n10. Primer\nRefers to the first or primary coating.\n11. Qualification\nRefers to the national certificate issued by the TESDA or its accredited\nindustry organizations in recognition that a person has achieved\ncompetencies relevant to a trade or industry.\n12. Range of\nVariable\nIt describes the circumstances or context in which the work is to be\nperformed.\n13. Solvent\nRefers to mineral spirits\n14. Solvent-based\npaint\nRefers to a coating that uses mineral spirits as thinner/ reducer\n15. Unit of\nCompetency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n\n--- PDF PAGE 96 ---\nTR – Construction Painting NC II (Amended) Promulgated June 16, 2015 94\n16. Unit of\nCompetency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n17. Water-based\npaint\nRefers to a coating that uses water as its solvent.\n18. Punchlisting\n\n19. Dry-wall\n\n20. Re-touch\n\n21. Surface\nPreparation\n\nRefers to the items that requires rectification\n\nA board made of several plies of fiberboard, paper, or felt bonded to a\nhardened gypsum plaster core and used especially as wallboard\n\nTo rework in order to improve\n\nThe action or process of making the surface ready for painting\n\n--- PDF PAGE 97 ---\nTR – Construction Painting NC II (Amended) Promulgated June 16, 2015 95\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business,\nindustry, academe and government agencies and who contributed their time and\nexpertise to the development and validation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nRUBEN D. CUETO\nPhilippine Constructors Association\n(PCA)\nPasig City\n\nVERGEL V. DYOCO\nPhilippine Association of Paint Manufacturers\n2014-2015\nQuezon City\n\nEDWIN R. SUÑGA\nGaddiel Painting Works, Inc.\nQuezon City\n\nBOY ERNESTO A. ADARLO, JR.\nIrvine Construction Corporation\nSan Juan City\n\nERVIN S. DERILO\nREM Painting Contractor\nQuezon City\n\nALEJANDRO ESPINOLA\nIrvine Constructions Corporation\nSan Juan City\n\nThe PARTICIPANTS in the Validation of these Training Regulation\n\nMARTIN CHRISTOFER B. ADELANTAR\nGreat Columns Riser Corp.\nJOANA ROSE D. BERNARDINO\nGreat Columns Riser Corp\nJACQUILO CELARIO\nDatem Inc.\n\nBENJAMIN CRUZ\nJBLS Trading