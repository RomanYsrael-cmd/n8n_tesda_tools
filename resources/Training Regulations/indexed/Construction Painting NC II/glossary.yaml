  "source_text": "1. Alkalinity\nRefers to the measurement of the concentration of base or amount of\nfree base present.\n2. Certification\nRefers to the process of verifying and validating competencies of a\nperson through assessment.\n3. Competency\nIs the application of knowledge, skills and attitudes to perform work\nactivities to the standard expected in the workplace.\n4. Element\nRefers to the building blocks of a unit of competency. It describes in\noutcome terms the functions that a person who works in a particular\narea of work is able to perform.\n5. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning skills,\nresource implications, context of assessment and assessment\nmethod.\n6. Level\nRefers to the category following the level of difficulty and complexity of\nskills and knowledge required to do the job.\n7. Neutralizer\nRefers to the substance that makes or reacts with a substrate (object\nto be coated) to render it neutral.\n8. Paint\nRefers in general to all types of protective coatings, and in particular to\na mixture containing a pigment binder and vehicle, which can be\nspread to a thin film on interior or exterior surfaces.\n9. Philippine TVET\nQualification\nFramework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter for\nthe integration of learning and assessment in the middle skills\ndevelopment.\n10. Primer\nRefers to the first or primary coating.\n11. Qualification\nRefers to the national certificate issued by the TESDA or its accredited\nindustry organizations in recognition that a person has achieved\ncompetencies relevant to a trade or industry.\n12. Range of\nVariable\nIt describes the circumstances or context in which the work is to be\nperformed.\n13. Solvent\nRefers to mineral spirits\n14. Solvent-based\npaint\nRefers to a coating that uses mineral spirits as thinner/ reducer\n15. Unit of\nCompetency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n\n--- PDF PAGE 96 ---\nTR – Construction Painting NC II (Amended) Promulgated June 16, 2015 94\n16. Unit of\nCompetency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n17. Water-based\npaint\nRefers to a coating that uses water as its solvent.\n18. Punchlisting\n\n19. Dry-wall\n\n20. Re-touch\n\n21. Surface\nPreparation\n\nRefers to the items that requires rectification\n\nA board made of several plies of fiberboard, paper, or felt bonded to a\nhardened gypsum plaster core and used especially as wallboard\n\nTo rework in order to improve\n\nThe action or process of making the surface ready for painting\n\n--- PDF PAGE 97 ---\nTR – Construction Painting NC II (Amended) Promulgated June 16, 2015 95",
