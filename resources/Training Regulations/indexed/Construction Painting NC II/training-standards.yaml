    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers to develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: CONSTRUCTION PAINTING\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n24 Hours (Common)\n 136 Hours (Core)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\nconstruction painting, such as preparing tools, painting materials and equipment,\npreparing surface for painting, performing painting work, and performing re-touching\nwork.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 65 ---\nTR – Construction Painting NC II (Amended) Promulgated June 16, 2015 63\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and\nsystems\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Sources of information\n• Types of question\n• Medium of\ncommunication\n• Flow of communication\n• Storage system\n• Telephone courtesy\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in\nworkplace meetings\nand discussions\n• Complete work related\ndocuments\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Group\ndiscussion\n• Role Play\n• Demonstration\n• Oral Interview\n• Written test\n• Demonstration\n4 hours\n1.2 Complete\nrelevant work\nrelated\ndocuments\n\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of\ncommunication\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n\n• Role Play\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n\n--- PDF PAGE 66 ---\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015\n 64\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Workplace interactions\n• Non verbal\ncommunication\n• Participate in\nworkplace meetings\nand discussions\n• Complete work related\ndocuments\n• Estimate, calculate and\nrecord routine\nworkplace measures\n• Basic mathematical\nprocesses of addition,\nsubtraction, division\nand multiplication\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n• Follow simple spoken\nlanguage\n• Ability to relate to\npeople of social range\nin the workplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Interaction\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n\n--- PDF PAGE 67 ---\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015\n 65\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility\nin a team.\n• Definition of Team\n• Difference between\nteam and group\n• Different sources of\ninformation\n\n• Objectives and goals of\nteam\n• Describing the team\nrole and scope\n• Discussion\n\n• Demonstration\n• Observation\n\n4 hours\n2.2 Describe work\nas a team\nmember\n• Team goals and\nobjectives\n• Fundamental rights at\nwork including gender\nsensitivity\n• Understanding\nindividual\ncompetencies relative\nto teamwork\n• Types of individuals\n• Role of leaders\n• Identifying individual\nrole and responsibility\n• Identifying external\nrelationship\n• Interacting effectively\nwith others\n• Setting team goals and\nexpectations\n• Interaction\n\n• Interviews/\nquestioning\n• Demonstration\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n• Work values and ethics\n(Code of Conduct,\nCode of Ethics, etc.)\n• Understanding\npersonal objectives\n• Understanding\norganizational goals\n• Difference between\nintra and interpersonal\nrelationship\n\n• Demonstrate Intra and\nInterpersonal skills at\nwork\n• Demonstrate personal\ncommitment in work\n• Discussion\n\n• Demonstration\n6 hours\n\n--- PDF PAGE 68 ---\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015\n 66\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Performance\nevaluation\n3.2 Set and meet\nwork priorities\n• Company policies\n• Company operations,\nprocedures and\nstandards\n• Time management\n• Basic strategic\nplanning concepts\n• Resource utilization\nand management\n\n• Managing goals and\ntime\n• Practice economic use\nof resources and\nfacilities\n• Setting work priorities\n• Practice time\nmanagement\n• Interaction\n• Role Play\n• Observation\n• Demonstration\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Career development\nopportunities\n• Company recognition\nand incentives\n• Information on relevant\nlicenses and or\ncertifications\n\n• Determining personal\ncareer development\nneeds\n• Identifying career\nopportunities\n• Interaction\n• Role Play\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify\nhazard and\nrisks\n• OSH procedures,\npractices and\nregulations\n• Hazards/risks\nidentification and\ncontrol\n• OSH indicators\n• Organizational\ncontingency practices\n\n• Hazards/risks\nidentification and\ncontrol skills\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n4 hours\n\n--- PDF PAGE 69 ---\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015\n 67\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n4.2 Evaluate\nhazard and\nrisks\n• Threshold Limit Value –\nTLV\n• Effects of safety\nhazards\n• Communication skills\n• Reporting safety\nhazards\n• Discussion\n• Plant tour\n• Observation\n• Interview\n4.3 Control\nhazards and\nrisks\n• Personal hygiene\npractices\n• Organization safety\nand health protocol\n• Company emergency\nprocedure practices\n• Respond to emergency\n• Discussion\n• Demonstration\n• Portfolio\nassessment\n• Interview\n4.4 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Workplace OSH\npersonal records\n• Information on\nemergency-related\ndrills\n• Practice emergency-\nrelated drill skills in the\nworkplace\n• Discussion\n• Role-play\n• Simulation\n• Portfolio\nassessment\n• Interview\n\n--- PDF PAGE 70 ---\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015\n 68\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify\nmaterials\n\n• Different work\nspecifications\n• Types, uses and\ndescriptio