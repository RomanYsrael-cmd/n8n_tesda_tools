n• Applying conversion of\nunits of measurements\n• Actual\ndemonstration\n• Group\ndiscussion\n• Direct\nobservation\n• Written test or\nexamination\n\n2.2 Apply\ninformation in\nmanual\n\n• Types of manuals used\nin construction painting\n• Types and application\nof symbols in manuals\n• Unit conversion\n• Applying information\nfrom manuals\n• Demonstration\n• Group\ndiscussion\n• Demonstration\n(able to impart\nknowledge and\nskills)\n• Practical and\noral exam\n2.3 Store Manual\n• Types of manuals used\nin construction painting\n• Manual storing and\nmaintaining procedures\n• Storing and maintaining\nmanuals\n• Demonstration\nGroup\ndiscussion\n• Demonstration\n• Practical and\noral exam\n3. Perform\nmensurations\nand calculation\n\n3.1 Select\nmeasuring\ninstruments\n\n• Types of measuring\ntools and its uses\n• Selecting measuring\ninstruments\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• Direct\nobservation\n• Oral\nquestioning\n4 hours\n\n--- PDF PAGE 72 ---\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015\n 70\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.2 Carry out\nmeasuremen\nts and\ncalculations\n\n• Measurements\n- Linear measurement\n- Geometrical\nmeasurement\n• Trade Mathematics\n- Unit conversion\n- Ratio and proportion\n- Area\n• Interpreting formulas\nfor volume, areas,\nperimeters of plane and\ngeometric figures\n• Handling of measuring\ninstruments\n\n• Group\ndiscussion\n• Practical Lab\n• Demonstration\n• Written test or\nexamination\n• Third party\nreport\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain Tools\nand Equipment\n4.1 Check\ncondition of\ntools and\nequipment\n\n• Safety practices\n- use of PPE\n- handling of tools and\nequipment\n- good housekeeping\n• Materials, tools and\nequipment\n- types and uses of\nlubricants\n- types and uses of\ncleaning materials\n- types and uses of\nconstructi