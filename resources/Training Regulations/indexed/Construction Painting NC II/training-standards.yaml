      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers to develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: CONSTRUCTION PAINTING\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n24 Hours (Common)\n 136 Hours (Core)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\nconstruction painting, such as preparing tools, painting materials and equipment,\npreparing surface for painting, performing painting work, and performing re-touching\nwork.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 65 ---\nTR – Construction Painting NC II (Amended) Promulgated June 16, 2015 63\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and\nsystems\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Sources of information\n• Types of question\n• Medium of\ncommunication\n• Flow of communication\n• Storage system\n• Telephone courtesy\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in\nworkplace meetings\nand discussions\n• Complete work related\ndocuments\n