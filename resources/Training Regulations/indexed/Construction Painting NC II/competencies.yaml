        "source_text": "500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is\naccessed from\nappropriate sources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non-\nverbal communication\nis used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage\nof information are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n1.1 Effective\ncommunication\n1.2 Different modes\nof\ncommunication\n1.3 Written\ncommunication\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n1.1 Follow simple\nspoken language\n1.2 Perform routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participate in\nworkplace\nmeetings and\ndiscussions\n1.4 Complete work\nrelated documents\n1.5 Estimate, calculate\nand record routine\nworkplace\nmeasures\n1.6 Ability to relate to\npeople of social\nrange in the\nworkplace\n1.7 Gather and\nprovide\ninformation in\nresponse to\nworkplace\nrequirements\n\n--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015\n 3\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinio