tion Painting NC II (Amended) Promulgated June16, 2015\n 8\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Work as a team\nmember\n3.1 Effective and\nappropriate forms of\ncommunications used\nand interactions\nundertaken with team\nmembers who\ncontribute to known\nteam activities and\nobjectives\n3.2 Effective and\nappropriate\ncontributions made to\ncomplement team\nactivities and\nobjectives, based on\nindividual skills and\ncompetencies and\nworkplace context\n3.3 Observed protocols in\nreporting using\nstandard operating\nprocedures\n3.4 Contribute to the\ndevelopment of team\nwork plans based on\nan understanding of\nteam’s role and\nobjectives and\nindividual\ncompetencies of the\nmembers\n3.1 Communication\nprocess\n3.2 Team structure\n3.3 Team roles\n3.4 Group planning\nand decision\nmaking\n3.1 Communicate\nappropriately,\nconsistent with\nthe culture of\nthe workplace\n3.2 Interacting\neffectively with\nothers\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015\n 9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and\nobjective of\nteam\n1.1.\nWork activities in a team environment with enterprise or specific\nsector\n1.2.\nLimited discretion, initiative and judgement maybe demonstrated\non the job, either individually or in a team environment\n\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOSH and environmental standards\n\n3. Workplace\ncontext\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe handling and\ndisposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 10\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Operated in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n1.6. Reported outcomes\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated environment\nwhere assessment can take place\n2.2. Materials relevant to the proposed activity or tasks\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation of the individual member in relation to the work activities\nof the group\n3.2. Observation of simulation and or role play involving the participation\nof individual member to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues and\nstrategies in teamwork\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 11\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in promoting career\ngrowth and advancement.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Integrate personal\nobjectives with\norganizational\ngoals\n1.1 Personal growth and\nwork plans are pursued\ntowards improvin