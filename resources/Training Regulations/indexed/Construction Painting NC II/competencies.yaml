        "source_text": "CON713360\nThis unit covers the knowledge, skills and attitudes in identifying,\npreparing and doing re-touching works.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nItalicized terms are\nelaborated in the Range of\nVariable\n1. Identify defects\nand corrective\nmeasures\n\n1.1 Causes of defects are\ndetected through\nobservation of the\nexisting paint and\nfamiliarity with the\nenvironment.\n1.2 Corrective measures\nare recommended\nbased on the nature\nand type of defects.\n1.3 Report is prepared\nand completed as to\nrequired\nspecifications.\n1.1 Safety and maintenance\n1.1.1 Hazards\n1.1.2 Safety rules and\nregulate\n1.2 Tools and equipment\n1.2.1 Types of spray\nequipment\n1.2.2 Capacity of\ncompressor\n1.3 Materials uses and\nspecifications\n1.4 Company and\ngovernment rules and\nregulations\n1.5 5S\n1.6 DOLE Department Order\nNo. 13 s. 1998\nGuidelines Governing\nOccupational Safety and\nHealth in the\nConstruction Industry\n1.7 3Rs\n1.1 Following safety\nand\nmaintenance\nprocedures\n1.2 Identifying paint\nmaterials, tools\nand equipment\n1.3 Preparing\nreports\n1.4 Following 5S\n1.5 Following\ncompany rules\nand regulations\n1.6 Following 3R\npractices\n2. Prepare for re-\ntouching works\n\n2.1 Existing paints are\nprepared according to\njob requirements/\nowner’s specifications.\n2.2 Materials, tools and\nequipment are\nprepared according to\njob requirements.\n2.3 Appropriate PPE are\nselected and used\naccording to OSHS.\n2.1 Safety and maintenance\n2.1.1 Hazards\n2.1.2 Safety rules and\n2.1.3 regulations\n2.1.4 Fire prevention\n2.1.5 First aid treatment\n2.1.6 Handling and care\nof tools and\nequipment\n2.1.7 Housekeeping\n2.2 Trade theory\n2.2.1 Touching\nprinciples\n2.2.2 Re-touching\ntechniques\n2.1 Following\nsafety and\nmaintenance\nprocedures\n2.2 Preparing paint\nmaterials, tools\nand equipment\n2.3 Following 5S\n2.4 Following\ncompany rules\nand regulations\n2.5 Following 3R\npractices\n\n--- 