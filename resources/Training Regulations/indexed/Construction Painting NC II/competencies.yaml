          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Prepared tools and equipment\n1.2 Applied paint materials sequentially\n1.3 Demonstrated ability to use painting tools\n1.4 Dismantled access equipment\n1.5 Complied with safety regulations\n1.6 Performed post-painting works\n1.7 Followed company rules and regulations\n1.8 Worksite is cleaned and kept safe\n2. Resource\nImplications\nThings necessary for the conduct of method of assessment:\n2.1 Workplace location\n2.2 Tools and equipment appropriate to painting work\n2.3 Materials relevant to the proposed activity\n2.4 Plans and specifications relevant to the task\n2.5 Appropriate PPE\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Observation of practical demonstration of skills\n3.2 Questionning related to underpinning knowledge\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated workplace\nsetting\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 56\n\nUNIT OF COMPETENCY :\nPERFORM RE-TOUCHING WORKS\nUNIT CODE :\n\nUNIT DESCRIPTOR :"
