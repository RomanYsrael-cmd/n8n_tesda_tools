        "source_text": "CON713359\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in the\napplication of paints based on the required performance standard.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nItalicized terms are\nelaborated in the Range of\nVariables\n1. Apply paint\nmaterials\n1.1 Paint materials are\napplied in sequence\nand in accordance\nwith job requirements\nand manufacturer’s\nrecommendations\n1.2 Proper tool usage is\nobserved and in line\nwith manufacturer's\nspecifications\n1.3 Appropriate PPE is\nused according to job\nrequirements\n1.4 Worksite is cleaned\nand kept safe in line\nwith OSHS\n\n1.1 Safety and\nmaintenance\n1.1.1 Hazards\n1.1.2 Safety rules and\nregulations\n1.1.3 Fire prevention\n1.1.4 First aid treatment\n1.1.5 Handling and\ncare of tools and\nequipment\n1.1.6 Housekeeping\n1.2 Trade Theory\n1.2.1 Painting principles\n1.2.2 Painting\ntechniques\n1.3 Company and\ngovernment rules and\nregulations\n1.4 5S\n1.5 DOLE Department\nOrder No. 13 s. 1998\nGuidelines Governing\nOccupational Safety\nand Health in the\nConstruction Industry\n1.6 3Rs\n1.1 Following safety\nand maintenance\nprocedures\n1.2 Applying paint\nmaterials\n1.3 Using tools and\nequipment\n1.5 Following 5S\n1.4 Following\nmanufacturer’s\nspecifications and\nrecommendations\n/government\nregulations\n1.5 Following 3R\npractices\n\n2. Complete work\n1.6 Final checks are\nmade to ensure that\nwork conforms with\ninstructions and\nrequirements\n1.7 Paint faults are\nrectified, if applicable\n1.8 Completion report is\nprepared and submitted\nto appropriate\npersonnel\n\n2.1 Safety and\nmaintenance\n2.1.1 Hazards\n2.1.2 Safety rules and\nregulations\n2.1.3 Fire prevention\n2.1.4 First aid\ntreatment\n2.1.5 Handling and\ncare of tools and\nequipment\n2.1.6 Housekeeping\n2.2 3Rs\n2.1 Following safety\nand maintenance\nprocedures\n2.2 Following\ncompany and\ngovernment rules\nand regulations\n2.3 Rectifying paint\nfaults\n2.