r/Solvent\n3.11 Cleaning agent\n3.12 Sand paper\n3.13 Tapes and covers\n3.14 Paint brush\n3.15 Roller brush\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 60\nVARIABLE\nRANGE\n4. Unexpected situations\nMay include:\n4.1 Damage to materials and properties\n4.2 Injury to personnel\n4.3 Force majeure (Acts of God)\n4.4 Painting equipment break-down\n5. Waste materials management\nMay include:\n5.1 Proper disposal in designated landfills\n5.2 Proper handling and disposal of wash solvents\n5.3 Segregation of waste (e.g. recyclable and non-recyclable)\n6. Government regulations\nMay include:\n6.1 Department of Environmental and Natural Resources (DENR)\n6.1.1 Environmental Management Bureau (EMB)\n Chemical Control Order On Lead and Lead\nCompounds\n RA 6969 – Toxic Substances and Hazardous and\nNuclear Waste Control Act of 1990\n6.2 Department of Interior Local Government (DILG)\n6.2.1 Bureau of Fire Protection (BFP)\n RA 9514 – Revised Fire Code of the Philippines of\n2008\n6.3 Local Government Units (LGUs)\n6.4 DOLE Department Order No. 13 s. 1998 Guidelines\nGoverning Occupational Safety and Health in the\nConstruction Industry\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 61\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified defects and corrective measures\n1.2 Evaluated existing paints\n1.3 Performed re-touching\n1.4 Demonstrated ability to use painting tools\n1.5 Dismantled access equipment\n1.6 Complied with safety regulations\n1.7 Performed post-painting works\n1.8 Followed company rules and regulations.\n1.9 Specifications on waste management regulations\n2. Resource\nImplications\nThings necessary for the conduct of method of assessment:\n2.1 Workplace location\n2.2 Tools and equipment appropriate to painting work\n2.3 Materials relevant to the proposed 