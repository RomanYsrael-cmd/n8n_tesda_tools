        "source_text": "CON311201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on identifying,\ninterpreting, applying services to specifications and manuals and\nstoring manuals.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify and\naccess\nspecification/ma\nnuals\n\n1.1 Appropriate manuals\nare identified and\naccessed as per job\nrequirements\n1.2 Version and date of\nmanual are checked to\nensure that correct\nspecification and\nprocedures are\nidentified\n1.1 Types of manuals\nused in construction\npainting\n1.2 Identification of\nsymbols used in the\nmanuals\n\n1.1 Identifying manuals\nand specifications\n1.2 Accessing\ninformation and data\n\n2. Interpret\nmanuals\n1.3 Relevant sections,\nchapters of\nspecifications/\nmanuals are located in\nrelation to the work to\nbe conducted\n1.4 Information and\nprocedure in the\nmanual are interpreted\nin accordance with\nindustry practices\n2.1 Types of manuals\nused in construction\npainting\n2.2 Types of symbols\nused in manuals\n2.3 System of\nmeasurements\n2.4 Unit conversion\n2.1 Interpreting symbols\nand specifications\n2.2 Accessing\ninformation and data\n2.3 Applying conversion\nof units of\nmeasurements\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 26\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Apply\ninformation in\nmanual\n3.1 Manual is interpreted\naccording to job\nrequirements\n3.2 Work steps are\ncorrectly identified in\naccordance with\nmanufacturer's\nspecification\n3.3 Manual data are\napplied according to\nthe given task\n3.4 All correct sequencing\nand adjustments are\ninterpreted in\naccordance with\ninformation contained\non the manual or\nspecifications\n3.1 Types of manuals\nused in\nconstruction\npainting\n3.2 Types and\napplication of\nsymbols in manuals\n3.3 Unit conversion\n3.1 Applying information\nfrom manuals\n\n4. Store manuals\n4.1 Manual or\nspecification is stored\nappropriately to\nprevent damage,\nready access and\nupdating of\ninformation when\nrequired in\naccordance with\ncompany\nrequirements\n4.1 Types of manuals\nused in construction\npainting\n4.2 Manual storing and\nmaintaining\nprocedures\n\n4.1 Storing and\nmaintaining manuals\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 27\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedures, Specifications and\nManuals of Instructions\n\nMay include:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 28\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job requirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 All manuals/catalogues relative to construction sector\n3. Methods of\nassessment\n\nCompetency should be assessed through:\n3.1 Direct observation\n3.2 Questions/interview\n\nAssessment of underpinning knowledge and practical skills may be combined\n4. Context of\nassessment\n\n4.1 Competency assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n4.2 Assessment may be conducted in the workplace or a simulated environment\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 29\n\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE :"
