        "source_text": "CON713357\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in\nidentifying, preparing paint and associated materials such as\nbase coat (primer), putty, finish coat, tools and other painting\nequipment.\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\nItalicized terms are\nelaborated in the Range of\nVariables\n1. Identify painting\nmaterials, tools\nand equipment\naccording to\nsurface\n1.1 Scope of work is\nsecured and\ninterpreted from\nappropriate personnel\nand/or working\ndrawings\n1.2 Appropriate PPE is\nidentified in line with\njob requirements and\nOSHA specifications.\n1.3 Painting materials/\nconsumables, tools\nand equipment are\nselected according to\nsurface consistent\nwith job requirements,\nplans and/or paint\nschedules, and\nOccupational Safety\nand Health Standards\n(OSHS)\n1.4 Protective covering on\nfloors and fixtures are\ninstalled\n1.5 Access equipment\nare assembled\nconsistent with\ndetailed plans and\nmanufacturer’s\nspecifications following\nsafety precautions\n1.1 Materials use and\nSpecifications\n1.1.1 Types of paint\n1.1.2 Types of\nthinner/reducer\n1.1.3 Grades of sand\npaper\n1.1.4 Types of putty\n1.1.5 Types of paint\nbrush and\nroller/tray\n1.1.6 Types of colorant\n1.1.7 Other materials\nfor surface\npreparation\n1.2 Tools and equipment:\nUses and specifications\n1.3 Safety use of access\nequipment\n1.4 Materials storage\n1.5 DOLE Department Order\nNo. 13 s. 1998\nGuidelines Governing\nOccupational Safety and\nHealth in the Construction\nIndustry\n1.6 5S\n1.7 3Rs\n1.1 Identifying\npainting\nmaterials, tools\nand equipment\n1.2 Following 5S\nand workplace\nsafety\n1.3 Punchlisting\n1.4 Following 3R\npractices\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 40\n\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\nItalicized terms are\nelaborated in the Range\nof Variables\n2. Prepare paints\nand\nrequirements\n2.1 Paints are prepared\nconsistent with job\nrequirements and in\nline with standard\noperating\nprocedures.\n2.2 Appropriate PPE is\nused in line with job\nrequirements.\n2.3 Unexpected\nsituations are\nresponded to in line\nwith company rules\nand regulations\n2.4 Safety precautions\nare observed during\npreparation of paint\nmaterials.\n\n2.1 Materials uses and\nspecifications\n2.1.1 Types of paint\n2.1.2 Types of\nthinner/reducer\n2.1.3 Types of colorant\n2.1.4 Grades of sand\npaper\n2.1.5 Types of putty\n2.1.6 Types of paint\nbrush and\nroller/tray\n2.1.7 Other materials\nfor surface\npreparation\n2.2 Tools and equipment :\nUses and specifications\n2.3 Safety use of access\nequipment\n2.4 Materials storage\n2.5 DOLE Department\nOrder No. 13 s. 1998\nGuidelines Governing\noccupational Safety and\nHealth in the\nConstruction Industry\n2.6 5S\n2.7 3Rs\n2.1 Preparing painting\nmaterials, tools\nand equipment\naccording to\nsurface:\n2.1.1 Concrete\n2.1.2 Steel\n2.1.3 Wood\n2.1.4 Drywall\n2.2 Following 5S and\nworkplace safety\n2.3 Following 3R\npractices\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Painting materials/\nconsumables\n\nMay include:\n1.1 Base coat materials\n1.1.1 Metal primer\n1.1.2 Wood primer\n1.1.3 Concrete sealer\n1.1.4 Drywall sealer\n1.2 Solvent- based paint\n1.3 Water-based paint\n1.4 Tinting/colorant\n1.5 Thinners/Reducer\n1.6 Empty cans\n1.7 Rust converter for rusted surfaces\n1.8 Putty\n1.9 Top/Intermediate/Finishing coat\n1.10 Concrete neutralizer\n1.11 Rags\n1.12 pH paper\n1.13 Water/Solvent\n1.14 Cleaning agent\n1.15 Sand paper\n1.16 Tapes and covers\n1.17 Paint brush\n1.18 Roller brush\n2. Tools and equipment\n\nMay include :\nTools\n2.1 Mixing stick\n2.2 Spatula/Putty knife (Paleta)\n2.3 Screw driver /Back wrench\n2.4 Hammer and Nail set (Punsol)\n2.5 Color charts\n2.6 Spray/Mortar gun\n2.7 Steel brush or Cap brush\n2.8 Paint mixer\n2.9 Sanding machine\n2.10 Roller stick\n2.11 Rope and pulley\nEquipment\n2.12 Air compressor\n2.13 Access equipment (e.g Scaffold/Gondola, Ladder)\n2.14 Airless Spray Unit\n2.15 Pressure Washer\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 42\n\nVARIABLE\nRANGE\n3. Surfaces\n3.1 Concrete\n3.2 Steel\n3.3 Wood\n3.4 Drywall\n4. Access equipment\nMay include:\n4.1 Scaffolding\n4.2 Gondola\n4.3 Ladders\n5. PPE\n\nMay include:\n5.1 Body harness/Safety belt\n5.2 Gloves (Chemical resistant)\n5.3 Safety shoes\n5.4 Hard hat\n5.5 Respirator/Dust mask\n5.6 Goggles\n5.7 Overall coat and pants\n5.8 Ear muff/plug\n5.9 Lifeline and anchorage\n5.10 Reflectorized vest\n6. Unexpected situations\nMay include:\n6.1 Damage to materials and properties\n6.2 Injury to personnel\n6.3 Force majeure (Acts of God)\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 43\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared painting materials, tools and equipment\n1.2 Identified, selected and used appropriate PPE\n1.3 Interpreted scope of work\n1.3 Identified, prepared and stored paints\n1.4 Demonstrated compliance with safety regulations\n2. Resource\nImplications\nThings necessary to conduct method of assessment:\n1.4 Workplace location\n1.5 Tools and equipment appropriate to work processes\n1.6 Materials relevant to the proposed activity\n1.7 Working drawings, instructions and specifications relevant to the task\n1.8 Appropriate PPE\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Observation of practical demonstration of skills\n3.2 Oral questioning related to underpinning knowledge\n4 Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PA