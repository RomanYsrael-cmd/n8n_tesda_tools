        "source_text": "--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Construction Painting NC II (Amended)                           Promulgated June16, 2015              50 \n \nUNIT OF COMPETENCY       : \nPERFORM PAINTING WORKS \n \nUNIT CODE                            : \n \nCON713359 \nUNIT DESCRIPTOR               : \nThis unit covers the knowledge, skills and attitudes in the \napplication of paints based on the required performance standard. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range of \nVariables \n1. Apply paint \nmaterials \n1.1 Paint materials are \napplied in sequence \nand in accordance \nwith job requirements \nand manufacturer’s \nrecommendations \n1.2 Proper tool usage is \nobserved and in line \nwith manufacturer's \nspecifications \n1.3 Appropriate PPE is \nused according to job \nrequirements \n1.4 Worksite is cleaned  \nand kept safe in line \nwith OSHS \n \n1.1 Safety and \nmaintenance  \n1.1.1 Hazards \n1.1.2 Safety rules and \nregulations \n1.1.3 Fire prevention \n1.1.4 First aid treatment\n1.1.5 Handling and \ncare of tools and \nequipment \n1.1.6 Housekeeping \n1.2 Trade Theory  \n1.2.1 Painting principles\n1.2.2 Painting \ntechniques \n1.3 Company and \ngovernment rules and \nregulations  \n1.4 5S  \n1.5 DOLE Department \nOrder No. 13 s. 1998 \nGuidelines Governing \nOccupational Safety \nand Health in the \nConstruction Industry \n1.6 3Rs\n1.1 Following safety \nand maintenance \nprocedures \n1.2 Applying paint  \nmaterials \n1.3 Using tools and \nequipment \n1.5 Following 5S \n1.4 Following \nmanufacturer’s \nspecifications and \nrecommendations \n/government \nregulations  \n1.5 Following 3R \npractices \n \n2. Complete work \n1.6 Final checks  are \nmade to ensure that \nwork conforms with \ninstructions and \nrequirements \n1.7 Paint faults are \nrectified, if  applicable  \n1.8 Completion report is   \nprepared and submitted \nto  appropriate \npersonnel \n \n2.1 Safety and \nmaintenance  \n2.1.1 Hazards \n2.1.2 Safety rules and \nregulations \n2.1.3 Fire prevention \n2.1.4 First aid \ntreatment \n2.1.5 Handling and \ncare of tools and \nequipment \n2.1.6 Housekeeping \n2.2 3Rs\n2.1 Following safety \nand maintenance \nprocedures \n2.2 Following \ncompany and \ngovernment rules \nand regulations  \n2.3 Rectifying paint  \nfaults \n2.4 Following 5S \n2.5 Following 3R \npractices\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Construction Painting NC II (Amended)                           Promulgated June16, 2015              51 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range of \nVariables \n \n \n2.3 Trade theory  \n2.3.1 Painting principles\n2.3.2 Painting \ntechniques \n2.4 Company and \ngovernment rules and \nregulations  \n2.5 5S  \n2.6 DOLE Department \nOrder No. 13 s. 1998 \nGuidelines Governing \nOccupational Safety \nand Health in the \nConstruction Industry \n2.7 3Rs\n \n3. Perform post \npainting works \n \n3.1 Access equipment are \ndismantled and stored \nin conformity with \nprocedures and \nmanufacturer’s \nspecifications \n3.2 Waste materials are \nmanaged as per \nmanufacturer’s \nspecifications and \ngovernment \nregulations   \n3.3 Safety is observed in \nline with industry \nrequirements \n3.4 Worksite is cleaned   \nand kept in safe state \nin line with OSHS \n \n3.1 Safety and maintenance \n3.1.1 Hazards \n3.1.2 Safety rules and \nregulations \n3.1.3 Fire prevention \n3.1.4 First aid treatment\n3.1.5 Handling and \ncare of tools and \nequipment \n3.1.6 Housekeeping \n3.2 Tools and equipment  \n3.2.1 Types of spray \nequipment \n3.2.2 Capacity of \ncompressor \n3.2.3 Principles of \ndismantling of \naccess equipment \n3.3 Methods and \nprocedures  \n3.3.1 Waste Segregation \nand Disposal \n3.4 Company and \ngovernment rules and \nregulations \n3.5 5S \n3.1 Following safety \nand maintenance \nprocedures \n3.2 Performing waste \nsegregation and \ndisposal \n3.3 Following \nprocedures for \nmaintaining and \nstoring of tools \nand equipment  \n3.4 Following 5S \n3.5 Following \ncompany and \ngovernment rules \nand regulations  \n3.6 Following 3R \npractices\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Construction Painting NC II (Amended)                           Promulgated June16, 2015              52 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range of \nVariables \n \n \n3.6 DOLE Department \nOrder No. 13 s. 1998 \nGuidelines Governing \nOccupational Safety \nand Health in the \nConstruction Industry \n3.7 3Rs\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Construction Painting NC II (Amended)                           Promulgated June16, 2015              53 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. PPE \n \nMay include: \n1.1 Body harness/Safety belt \n1.2 Gloves (Chemical resistant) \n1.3 Safety shoes \n1.4 Hard hat \n1.5 Respirator/Dust mask \n1.6 Goggles \n1.7 Overall coat and pants \n1.8 Ear muff/plug  \n1.9 Lifeline and anchorage \n2. Paint materials/consumables \n \nMay include: \n2.1 Base coat materials \n2.1.1 Metal primer \n2.1.2 Wood primer \n2.1.3 Concrete sealer/ Primer \n2.1.4 Drywall sealer \n2.2 Solvent- based paint \n2.3 Water-based paint \n2.4 Tinting/colorant \n2.5 Thinners/Reducer \n2.6 Empty cans \n2.7 Putty \n2.8 Top/ Intermediate/Finishing coat  \n2.9 Rags \n2.10 Water/Solvent \n2.11 Cleaning agent \n2.12 Sand paper \n2.13 Tapes and covers \n2.14 Paint brush \n2.15 Roller brush \n3. Waste materials management  \nIncludes: \n3.1 Disposal in designated landfills  \n3.2 Handling and disposal of wash solvents, waste water \n3.3 Segregation of waste (e.g. recyclable and non-recyclable)\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Construction Painting NC II (Amended)                           Promulgated June16, 2015              54 \n \nVARIABLE \nRANGE \n4. Government regulations \nMay include: \n4.1 Department of Environmental and Natural Resources \n(DENR) \n4.1.1 Environmental Management Bureau (EMB) \n Chemical Control Order On Lead and Lead \nCompounds \n RA 6969 – Toxic Substances and Hazardous and \nNuclear Waste Control Act of 1990 \n4.2 Department of Interior Local Government (DILG) \n4.2.1 Bureau of Fire Protection (BFP) \n RA 9514 – Revised Fire Code of the Philippines of \n2008 \n4.3 Local Government Units (LGUs) Ordinances \n4.4 DOLE Department Order No. 13 s. 1998 Guidelines \nGoverning Occupational Safety and Health in the \nConstruction Industry\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – Construction Painting NC II (Amended)                           Promulgated June16, 2015              55 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Prepared tools and equipment  \n1.2 Applied paint materials sequentially  \n1.3 Demonstrated ability to use painting tools  \n1.4 Dismantled access equipment  \n1.5 Complied with safety regulations  \n1.6 Performed post-painting works \n1.7 Followed company rules and regulations \n1.8 Worksite is cleaned and kept safe  \n2. Resource  \nImplications \nThings necessary for the conduct of method of assessment: \n2.1 Workplace location \n2.2 Tools and equipment appropriate to painting work  \n2.3 Materials relevant to the proposed activity \n2.4 Plans and specifications relevant to the task \n2.5 Appropriate PPE \n3. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 Observation of practical demonstration of skills \n3.2 Questionning related to underpinning knowledge  \n4. Context for \nAssessment \n4.1 Competency may be assessed in the workplace or in a simulated workplace \nsetting\n",
