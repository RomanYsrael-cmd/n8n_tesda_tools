        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard control\npractices and procedures\n1.2 Identified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3 Recognized contingency measures during workplace accidents,\nfire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on threshold\nlimit value- TLV.\n1.5 Followed Occupational Safety and Health (OSH) procedures for\ncontrolling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance with\ncompany OSH procedures and practices\n1.7 Completed and updated OSH personal records in accordance\nwith workplace requirements\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 21\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE CONSTRUCTION MATERIALS AND TOOLS\n\nUNIT CODE :"
