        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in accordance\nwith job requirements\n1.2 Performed measurements and calculations according to job requirements/\nISO\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Problems to solve\n2.3 Measuring instrument appropriate to carry out tasks\n2.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills may be combined\n3. Methods of\nassessment\nCompetency should be assessed through:\n3.1 Actual demonstration\n3.2 Direct observation\n3.3 Written test/questioning related to underpinning knowledge\n4. Context of\nassessment\n4.1 Competency assessment may occur in workplace or any appropriate\nsimulated environment\n4.2 Assessment shall be observed while task are being undertaken whether\nindividually or in group\n4.3 Competency assessment must be undertaken in accordance with the\nTESDA assessment guidelines\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 34\n\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\n\nUNIT CODE :"
        },
        "source_text": "CON311203\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on identifying\nand measuring objects based on the required performance\nstandards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select\nmeasuring\ninstruments\n\n1.1 Object or component\nto be measured is\nidentified, classified\nand interpreted\naccording to the\nappropriate regular\ngeometric shape\n1.2 Measuring tools are\nselected/identified as\nper object to be\nmeasured or job\nrequirements\n1.3 Correct specifications\nare obtained from\nrelevant sources\n1.4 Appropriate\nmeasuring\ninstruments are\nselected according to\njob requirements\n1.5 Alternative measuring\ntools are used without\nsacrificing cost and\nquality of work\n1.1 Types of measuring\ntools and its uses\n\n1.1 Selecting measuring\ninstruments\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 30\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Carry out\nmeasurements\nand calculations\n\n2.1 Accurate\nmeasurements are\nobtained according to\njob requirements\n2.2 Alternative measuring\ntools are used without\nsacrificing cost and\nquality of work\n2.3 Calculations needed\nto complete work\ntasks are performed\nusing the four basic\nprocess of addition\n(+), subtraction (-),\nmultiplication (x) and\ndivision (/)\n2.4 Calculations involving\nfractions, percentages\nand mixed numbers\nare used to complete\nworkplace tasks\n2.5 Numerical\ncomputation is self-\nchecked and corrected\nfor accuracy\n2.6 Instruments are read\nto the limit of accuracy\nof the tool\n2.7 Systems of\nmeasurement\nidentified and\nconverted according to\njob requirements/ISO\n2.8 Workpieces are\nmeasured according\nto job requirements\n\n2.9 Measurements\n• Linear\nmeasurement\n• Geometrical\nmeasurement\n2.3 Trade Mathematics\n• Unit conversion\n• Ratio and\nproportion\n• Area\n\n2.1 Interpreting formulas\nfor volume, areas,\nperimeters of plane\nand geometric\nfigures\n2.2 Handling of\nmeasuring\ninstruments\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Geometric shape\n\n May include:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring instruments\nMay include:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega ohmeter\n2.16 Kilowatt hour meter\n2.17 Gauges\n2.18 Thermometers\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 32\n\nVARIABLE\nRANGE\n3. Measurements and\ncalculations\n\nMay include:\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Resistance\n3.7 Amperage\n3.8 Frequency\n3.9 Impedance\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.13 Inside diameter\n3.14 Circumference\n3.15 Length\n3.16 Thickness\n3.17 Outside diameter\n3.18 Taper\n3.19 Out of roundness\n3.20 Oil clearance\n3.21 End play/Thrust clearance\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 33\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in accordance\nwith job requirements\n1.2 Performed measurements and calculations according to job requirements/\nISO\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Problems to solve\n2.3 Measuring instrument appropriate to carry out tasks\n2.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills may be combined\n3. Methods of\nassessment\nCompetency should be assessed through:\n3.1 Actual demonstration\n3.2 Direct observation\n3.3 Written test/questioning related to underpinning knowledge\n4. Context of\nassessment\n4.1 Competency assessment may occur in workplace or any appropriate\nsimulated environment\n4.2 Assessment shall be observed while task are being undertaken whether\nindividually or in group\n4.3 Competency assessment must be undertaken in accordance with the\nTESDA assessment guidelines\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 34\n\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\n\nUNIT CODE :"
