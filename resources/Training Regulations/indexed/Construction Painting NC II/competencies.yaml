        "source_text": "CON713358\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nprepare surface area for painting.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nItalicized terms are\nelaborated in the Range of\nVariables\n\n1. Inspect surface\n\n1.1 Surfaces are\nInspected in line with\njob requirements and\nstandard operating\nprocedures.\n1.2 Foreign matters are\nchecked according to\njob requirements.\n1.3 Appropriate PPE is\nused according to job\nrequirements\n1.4 Inspection report is\nsubmitted to\nappropriate personnel\naccording to job\nrequirements\n\n1.1 Safety and maintenance\n1.1.1 Safety rules and\nregulations\n1.1.2 Fire prevention\n1.1.3 First aid treatment\n1.1.4 Handling and care\nof tools, materials\nand equipment\n1.2 Trade Theory\n1.2.1 Grades of\nsandpaper\n1.2.2 Paint defects and\nTroubleshooting\n1.2.3 Surface condition\n1.3 Tools and equipment\n1.3.1 Handtools\n(spatula, hammer,\nnail set)\n1.3.2 pH level\nmeasurement tools\n1.4 Methods and procedures\n1.4.1 Surface Inspection\n1.4.2 Paint compatibility\n1.5 5S\n1.6 DOLE Department Order\nNo. 13 s.1998 Guidelines\nGoverning Occupational\nSafety and Health in the\nConstruction Industry\n1.7 3Rs\n1.1 Following safety\nand\nmaintenance\nprocedures\n1.2 Installing\naccess\nequipment\n1.3 Following 5S\n1.4 Preparing\ninspection and\ncompletion\nreports\n1.5 Following 3R\npractices\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 45\n\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nItalicized terms are\nelaborated in the Range of\nVariables\n2. Prepare new or\nbare surface\n2.1 Surface preparation\nis performed in\naccordance with job\nspecifications and\nmanufacturer ‘s\nrecommendations\n2.2 Proper tool usage is\nobserved in line with\njob requirements.\n2.3 Unexpected\nsituations are\nresponded to\naccording to company\nrules and regulations\n2.4 Appropriate PPE is\nused according to job\nrequirements.\n2.5 Worksite is cleaned\nand kept in safe state\nand in accordance\nwith Occupational\nSafety and Health\nStandards (OSHS)\n\n2.1 Safety and maintenance\n2.1.1 Safety rules and\nregulations\n2.1.2 Fire prevention\n2.1.3 First aid treatment\n2.1.4 Handling and care\nof tools, materials\nand equipment\n2.2 Trade theory\n2.2.1 Grades of\nsandpaper\n2.2.2 Paint defects and\ntroubleshooting\n2.2.3 Various paint\nremover and\ncleaner\n2.2.4 Surface treatments\n(e.g. skim coat,\njoint compounds)\n2.3 Tools and equipment\n2.3.1 Sander\n2.3.2 Compressor\n2.3.3 Handtools\n(spatula, hammer,\nnail set)\n2.4 Methods and procedures\n2.4.1 Surface\npreparation\n2.5 5S\n2.6 DOLE Department Order\nNo. 13 s. 998 Guidelines\nGoverning Occupational\nSafety and Health in the\nConstruction Industry\n2.7 3Rs\n2.1 Following safety\nand\nmaintenance\nprocedures\n2.2 Following 5S\n2.3 Preparing\nsurfaces for:\n2.3.1 Concrete\n2.3.2 Steel\n2.3.3 Wood\n2.3.4 Drywall\n2.4 Preparing\ncompletion\nreports\n2.5 Following 3R\npractices\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 46\n\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nItalicized terms are\nelaborated in the Range of\nVariables\n3. Prepare\npreviously\ncoated/ covered\nsurfaces\n3.1 Conditions and\nnature of existing\nsurface are tested in\naccordance with\nrelevant standards\n3.2 Potential hazards are\nidentified and correct\nprocedures are used\nto reduce risks in\naccordance with\nmanufacturer\nrecommendations and\njob specifications\n3.3 Substrate\npreparation is\nperformed in\naccordance with job\nspecifications and\nmanufacturer\nrecommendations\n3.4 Proper tool usage is\nobserved in line with\njob requirements.\n3.5 Unexpected situations\nare responded to\naccording to company\nrules and regulations\n3.6 Appropriate PPE is\nused according to job\nrequirements.\n3.7 Worksite is cleaned\nand kept in safe state\nand in accordance\nwith OSHS\n\n3.1 Safety and maintenance\n3.1.1 Safety rules and\nregulations\n3.1.2 Fire prevention\n3.1.3 First aid treatment\n3.1.4 Proper handling\nand care of tools,\nmaterials and\nequipment\n3.2 Trade theory\n3.2.1 Grades of\nsandpaper\n3.2.2 Paint defects and\ntroubleshooting\n3.2.3 Various paint\nremover and\ncleaner\n3.2.4 Surface treatments\n(i.e. skim coat,\njoint compounds)\n3.3 Tools and equipment\n3.3.1 Sander\n3.3.2 Compressor\n3.3.3 Handtools\n(spatula, hammer,\nnail set)\n3.4 Methods and procedures\n3.4.1 Surface inspection\n3.4.2 Surface\npreparation\n3.5 5S\n3.6 DOLE Department Order\nNo. 13 s.1998 Guidelines\nGoverning Occupational\nSafety and Health in the\nConstruction\nIndustry\n3.7 3Rs\n\n3.1 Following safety\nand\nmaintenance\nprocedures\n3.2 Following 5S\n3.3 Preparing\nsurfaces for:\n3.3.1 Concrete\n3.3.2 Steel\n3.3.3 Wood\n3.3.4 Drywall\n3.4 Preparing\ncompletion\nreports\n3.5 Following 3R\npractices\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 47\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Surfaces\n\nMay include:\n1.1 Concrete\n1.2 Steel\n1.3 Wood\n1.4 Drywall\n2. Foreign matters\n\nMay include:\n2.1 Substances/Chemicals\n2.1.1 Grease\n2.1.2 Oil\n2.1.3 Alkali\n2.1.4 Dust\n2.1.5 Rust\n2.1.6 Mildew\n2.1.7 Algae\n2.2 Exposed nails/rebars/wires\n2.3 Welding spatters\n3. PPE\n\nMay include:\n3.1 Body harness/Safety belt\n3.2 Gloves ( Chemical resistant)\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Respirator/Dust mask\n3.6 Goggles\n3.7 Overall coat and pants\n4. Inspection report\nMay include:\n4.1 Minor imperfections\n4.1.1 Minor cracks\n4.1.2 Surface imperfections\n4.1.3 Dents\n4.1.4 Holes\n4.2 Defects of surfaces\n4.3 Condition of surface\n4.3.1 Moisture content\n4.3.2 Alkalinity\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 48\n\nVARIABLE\nRANGE\n5. Surface preparation\nMay include:\n5.1 Cleaning\n5.2 Neutralization\n5.3 Metal etching\n5.4 Wood bleaching\n5.5 Sanding\n5.6 Grinding\n6. Unexpected situations\nMay include but are not limited to:\n6.1 Damaged to materials and properties\n6.2 Injury to personnel\n6.3 Force majeure (Acts of God)\n7. Worksite is cleaned\nMay include:\n7.1 Waste and unwanted materials are removed\n7.2 Painting tools and equipment are cleaned\n7.3 Unused materials are sealed and stored\n7.4 Materials are disposed of or recycled\n8. Conditions and nature of\nexisting surface\n8.1 Loose paint\n8.2 Cracks\n8.3 Mildew growth\n8.4 Corrosion\n8.5 Chalking\n8.6 Efflorescence\n8.7 Carbon soot\n8.8 Water seepage or leaks\n9. Substrate preparation\nMay include:\n9.1 Cleaning/Disinfecting\n9.2 Paint removal\n9.3 Wall paper removal\n9.4 Sanding\n9.5 Grinding\n9.6 Pressure Washing\n9.7 Rust treatment\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 49\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Inspected surfaces\n1.2 Prepared new or bare surface\n1.3 Prepared previously coated/covered surfaces\n1.4 Observed tools and equipment usages\n1.5 Identified, selected and used appropriate PPE\n1.6 Demonstrated compliance with safety regulations\n2.\nResource\nImplications\nThings necessary to conduct method of assessment:\n2.1 Workplace location\n2.2 Tools and equipment appropriate to work processes\n2.3 Materials relevant to the proposed activity\n2.4 Working drawings, instructions and specifications relevant to the task\n2.5 Appropriate PPE\n3.\nMethods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Observation of practical demonstration of skills\n3.2 Oral questioning related to underpinning knowledge\n4.\nContext for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated workplace\nsetting.\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 50\n\nUNIT OF COMPETENCY :\nPERFORM PAINTING WORKS\n\nUNIT CODE :"
