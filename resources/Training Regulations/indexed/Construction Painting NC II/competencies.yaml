s are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.\nMaintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and career\nopportunities are\nidentified and availed of\nbased on job\nrequirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as proof\nof career advancement\n3.3 Licenses and/or\ncertifications relevant\nto job and career are\nobtained and renewed\n\n3.1 Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n3.2 Company\npolicies\n3.3 Company\noperations,\nprocedures and\nstandards\n3.4 Fundamental\nrights at work\nincluding gender\nsensitivity\n3.5 Personal hygiene\npractices\n3.1 Appropriate\npractice of\npersonal\nhygiene\n3.2 Intra and\nInterpersonal\nskills\n3.3 Communication\nskills\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 13\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n3.1.1\nTechnical\n3.1.2\nSupervisory\n3.1.3\nManagerial\n3.1.4\nContinuing Education\n3.2 Serving as Resource Persons in conferences and workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\n\nTR – Construction Painting NC II (Amended) Promulgated June16, 2015 14\nEVIDENCE GUIDE\n\n1. Critical\naspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the course of