      "source_text": "3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n• Must have completed training or holder of Transmission Line Installation\nand Maintenance NC II with at least 1-yr work experience in\ntransmission line installation and maintenance; or\n\n• Must be a holder of Electrical Power Distribution Line Construction NC II\nwith at least 2-yrs of work experience in distribution line construction and\nmaintenance\n\n• Able to communicate both in oral and written (either in English or local\ndialect)\n\n• Must be physically fit\n\nThis list does not include specific institutional requirements, such as height\nand age requirements, educational attainment, appropriate work experience and\nothers that may be required from the trainees by the school or training center\ndelivering the TVET program.\n\n--- PDF PAGE 95 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 91"
