    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Transmission Line Installation and Maintenance NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: Transmission Line Installation and Maintenance\nNC Level: NC III\n\nNominal Training Duration:\n32 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n 116 hrs – Core Competencies\n\n ------------\n\n 208 hrs -\nTotal\n\nNominal Training Duration (Elective):\n\n 150 hrs - Elective Competencies\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\ntransmission line lineman, in accordance with industry standards. It covers the basic and\ncommon\ncompetencies\nin\naddition\nto\nthe\ncore\ncompetencies\nsuch\nas\ninstallation/construction of new transmission line structures, performance of overhead\ntransmission line works, installation of emergency restoration structure (ERS) and\nperformance of earth/ground resistance testing. This course also includes competency in\nperformance of hotline maintenance works as an elective unit.\n\nThe nominal duration of 208 hours covers the required units at Transmission Line\nInstallation and Maintenance NC III. TVET providers can however, offer a longer, ladderized\ncourse covering the NC III basic, common and core units.\n\nA nominal training duration of 150 hours for the elective unit - “Perform hotline\nmaintenance works”, is included for additional competency.\n\n--- PDF PAGE 75 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 71\n\nBASIC COMPETENCIES\n32 hrs\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n1. Lead workplace\ncommunication\n1.1. Communicate\ninformation\nabout workplace\nprocesses\n1.1.1. Read\no Effective verbal communication\nmethods\no Sources of information\n1.1.2. Practice organizing information\n1.1.3. Identify organization requirements for\nwritten and electronic communication\nmethods\n1.1.4. Follow organization requirements for the\nuse of written and electronic\ncommunication methods\n1.1.5. Perform exercises on understanding and\nconveying intended meaning scenario\n1.1.1. Lecture\n1.1.2. Demonstration\n1.1.3. Practical\nexercises\n1.1.4. Role Play\n\n1.1.1. Written Test\n1.1.2. Observation\n2 Hours\n1.2. Lead workplace\ndiscussions\n1.2.1. Discuss organizational policy on\nproduction, quality and safety\no Goals/ objectives and action plan\nsetting\n1.2.2. Read effective verbal communication\nmethods\n1.2.3. Prepare/set action plans based on\norganizational goals and objectives\n1.2.1. Group\ndiscussion\n1.2.2. Lecture\n1.2.3. Demonstration\n1.2.1. Oral\nevaluation\n1.2.2. Written Test\n1.2.3. Observation\n2 Hours\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n1.3.1. Discuss organizational policy in dealing\nwith issues and problems\n1.3.2. Read effective verbal communication\nmethods\n1.3.3. Practice organizing information\n1.3.4. Perform exercises on understanding and\nconveying intended meaning scenario\n1.3.1. Group\ndiscussion\n1.3.2. Lecture\n1.3.3. Demonstration\n1.3.4. Role Play\n1.3.1. Oral\nevaluation\n1.3.2. Written Test\n1.3.3. Observation\n\n2 Hours\n\n2. Lead small team\n2.3. Provide team\nleadership\n2.3.1. Discuss company policies and\nprocedures\n2.3.2. Identify client expectations\n2.3.1. Group\ndiscussion\n2.3.2. Lecture\n2.3.1. Oral\nevaluation\n2 Hours\n\n--- PDF PAGE 76 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 72\n\nUNIT OF\nCOMPETENCY\nLEARNING\nOUTCOMES\nLEARNING ACTIVITIES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nNOMINAL\nDURATION\n\n2.3.3. Practice team building skills\n2.3.4. Perform exercises on communication\nskills required for leading teams\n2.3.3. Demonstration\n2.3.4. Role Play\n2.3.2. Written\nexamination\n2.3.3. Observation\n\n2.4. Assign\nresponsibilities\n2.4.1. Discuss:\no Team member’s duties and\nresponsibilities\n2.4.2. Identify client expectations\n2.4.3. Practice negotiating skills\n2.4.4. Perform group exercises showing the\nskills and techniques in promoting team\nbuilding\n\n2.4.1. Group\ndiscussion\n2.4.2. Lecture\n2.4.3. Demonstration\n2.4.4. Role Play\n2.4.1. Oral\nevaluation\n2.4.2. Written\nexamination\n2.4.3. Observation\n2 Hours\n\n2.5. Set performance\nexpectations for\nteam members\n2.5.1. Discuss:\no Team member’s duties and\nresponsibilities\no How performance expectations are\nset\n2.5.2. Identify client expectations\n2.5.3. Perform group exercises in setting\nindividual target/ expectation\n2.5.4. Read instruction and requirements in up\nto date dissemination to members\n2.5.1. Group\ndiscussion\n2.5.2.