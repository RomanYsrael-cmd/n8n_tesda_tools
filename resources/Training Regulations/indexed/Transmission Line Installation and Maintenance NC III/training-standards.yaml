        "source_text": "50\n750\n1\n750\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n3 x 5\n15\n1\n15\n Total\n853\nFacilities / Equipment / Circulation*\n\n256\n Total Area\n\n1,109\n\n* Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS\n\n•\nHolder of National TVET Trainer’s Certificate (NTTC) Level 1 in\nTransmission Line Installation and Maintenance NC III;\n•\nWith at least minimum of five (5) years relevant transmission line\ninstallation and maintenance experience within the last 10 years;\n•\nMust have completed the 40 hours Construction Occupational Safety and\nHealth (COSH) Course per Department Order No. 13 s. 1998, Guidelines\nGoverning Occupational Safety and Health in the Construction Industry\nconducted by OSHC and DOLE accredited Safety Training Organizations;\n•\nMust be computer literate; and\n•\nMust be physically fit.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. The institutional assessment is administered by the\ntrainer/assessor.\n\nThe result of the institutional assessment may be considered as evidence for\nthe assessment for national certification.\n\n--- PDF PAGE 102 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 98"
