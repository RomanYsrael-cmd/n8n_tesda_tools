      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: Transmission Line Installation and Maintenance\nNC Level: NC III\n\nNominal Training Duration:\n32 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n 116 hrs – Core Competencies\n\n ------------\n\n 208 hrs -\nTotal\n\nNominal Training Duration (Elective):\n\n 150 hrs - Elective Competencies\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\ntransmission line lineman, in accordance with industry standards. It covers the basic and\ncommon\ncompetencies\nin\naddition\nto\nthe\ncore\ncompetencies\nsuch\nas\ninstallation/construction of new transmission line structures, performance of overhead\ntransmission line works, installation of emergency restoration structure (ERS) and\nperformance of earth/ground resistance testing. This course also includes competency in\nperformance of hotline maintenance works as an elective unit.\n\nThe nominal duration of 208 hours covers the required units at Transmission Line\nInstallation and Maintenance NC III. TVET providers can however, offer a longer, ladderized\ncourse covering the NC III basic, common and core units.\n\nA nominal training duration of 150 hours for the elective unit - “Perform hotline\nmaintenance works”, is included for additional competency.\n\n--- PDF PAGE 75 ---\n--------------------------------------------------------------------------------------------------------