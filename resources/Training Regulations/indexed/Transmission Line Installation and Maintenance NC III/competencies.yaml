        "source_text": "--- PDF PAGE 66 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 62  \n \nELECTIVE COMPETENCIES \n \n \nUNIT OF COMPETENCY :    PERFORM HOTLINE MAINTENANCE WORK  \nUNIT CODE                     :    UTL741308 \nDESCRIPTOR                  : \nThis unit covers the knowledge, skills and attitude to perform \nhotline maintenance on any existing transmission line using \nboth hot sticks method and bare hand method. This unit will \ninvolve working in a team environment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n1. Plan and \nprepare for \nhotline work  \n1.1. Work instruction is secured \naccording to job \nrequirements. \n1.2. Appropriate occupational \nhealth and safety \nrequirements are identified \nfollowing job specifications \n1.3. Appropriate hotline  tools, \nequipment and line \nhardware are identified and \nrequested in accordance with \nthe job specifications \n1.1. DOLE-OSHS \nRule 1080 – \nPersonal \nProtective \nEquipment and \nDevices \n1.2. Usage and \nfunction of \nappropriate \nhotline tools and \nequipment \n1.3. Basic Math \n(MDAS) \n1.4. Safe working load \nand clearance \n1.5. Written and oral \ncommunication \n1.1. Communication \nskills \n1.2. Interpretation \nskills \n1.3. Mathematical \nskills \n1.4. Skills in \nidentifying \nhotline  tools, \nequipment and \nline hardware \n2. Prepare \nhotline and \ntransmission \nline tools, \nequipment \nand line \nhardware \n2.1. Personal protective \nequipment (PPE) are \nobtained following job \nrequirements  \n2.2. Hotline, tools, equipment and \nline hardware are acquired \nand secured in line with job \nrequirements \n2.5 Cleaning and testing of \ninsulated hot-sticks and \nladder are performed based \non manufacturer’s standards \n \n3.1. DOLE-OSHS \nRules 1210 – \nElectrical Safety \n2.1. Usage of \nappropriate PPE \n2.2. Appropriate \nhotline materials, \ntools and \nequipment \n2.3. Proper handling \nof hotline \nmaterials, tools \nand equipment. \n2.4. Simple machine \nprinciple \n2.5. Written and oral \ncommunication \n2.1. Communication \nskills \n2.2. Interpretation \nskills \n2.3. Mathematical \nskills \n2.4. Skills in \nidentifying \nhotline \nhardware, tools \nand equipment\n\n--- PDF PAGE 67 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 63  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n3. Perform \nhotline      \nmaintenance   \nprocedure \n3.1. Hotline tools equipment and \nline hardware are used in line \nwith job requirements \n3.2. Personal protective \nequipment (PPE) are used \nfollowing job safety \nrequirements \n3.3. Approved caution tag is \nverified/confirmed based on \ncompany policies and \nstandards \n3.4. Hotline maintenance work is \nperformed based on job \nrequirements and company \npolicies and standards. \n3.5. Housekeeping procedure is \nperformed in line with \ncompany procedures and \nstandards \n \n \n3.2. Usage of \nappropriate PPE  \n3.3. Usage and \nfunction of \nappropriate \nhotline materials, \ntools and \nequipment \n3.4. Application for \nhot-stick and/or \nbare-hand \nmethods \n3.5. Usage of hot-\nsticks, hotline \naccessories and \nhand tools \n3.6. Safe rigging \ntechnique and \ncompany \nrequirements \n3.7. Hotline tools and  \n3.8. DOLE-OSHS \nRule 1210 – \nElectrical Safety \n3.9. DOLE-OSHS \nRule 1410 – \nConstruction \nSaf