        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Prepared hotline and transmission line tools, equipment\nand line hardware\n1.3. Performed hotline maintenance work\n2. Resource Implications The following resources should be provided:\n2.1. Hotline tools, equipment and hardware\n2.2. PPE and safety tools\n2.3. Work area\n2.4. Line truck/trailer/container van\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Observation with oral questioning\n3.2. Demonstration with oral questioning\n3.3. Written test\n3.4. Portfolio assessment with interview\n4. Context of\nassessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 74 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 70"
