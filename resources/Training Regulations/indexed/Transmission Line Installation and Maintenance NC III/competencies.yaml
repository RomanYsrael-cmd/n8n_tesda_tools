mpany is \nidentified and used \n2.2. Completed work is checked \nagainst workplace standards \nrelevant to the task \nundertaken \n2.3. Faulty pieces  are identified \nand isolated \n2.4. Information on the quality and \nother indicators of production \nperformance is recorded in \naccordance with workplace \nprocedures \n2.5. Deviations from specified \nquality standards, causes \nare documented and reported \nin accordance with the \nworkplace standards operating \nprocedures \n \n2.1. Safety and \nenvironmental \naspects of \nproduction \nprocesses \n2.2. Fault identification \nand reporting  \n2.3. Workplace \nprocedure in \ndocumenting \ncompleted work \n2.4. Workplace Quality \nIndicators \n2.1. Carry out \nwork in \naccordance \nwith OHS \npolicies and \nprocedures\n\n--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 24  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Engage in \nquality \nimprovement  \n3.1. Process improvement \nprocedures are participated in \nrelation to workplace \nassignment \n3.2. Work is carried out in \naccordance with process \nimprovement procedures \n3.3. Performance of operation or \nquality of product or service to \nensure customer satisfaction \nis monitored \n3.1. Quality \nimprovement \nprocesses \n3.2. Company \ncustomers defined\n3.1. Solution \nproviding and \ndecision-\nmaking \n3.2. Practice \ncompany \nprocess \nimprovement \nprocedure\n\n--- PDF PAGE 29 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Ins