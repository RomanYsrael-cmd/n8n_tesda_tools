  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Transmission Line Installation and Maintenance NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1. Appropriate\ncommunication method\nis selected\n1.2. Multiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3. Questions are used to\ngain extra information\n1.4. Correct sources of\ninformation are identified\n1.5. Information is selected\nand organized correctly\n1.6. Verbal and written\nreporting is undertaken\nwhen required\n1.7. Communication skills are\nmaintained in all situations\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Methods of\nCommunication\n1.4. Types of\nQuestion\n1.5. Communication\nTools\n1.6. Questioning\nTechniques\n1.1. Organizing\ninformation\n1.2. Understanding and\nconveying intended\nmeaning\n1.3. Participating in\nvariety of\nworkplace\ndiscussions\n1.4. Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n1.5. Reporting\noccupational\nhazards during\nsafety meeting\n2. Lead\nworkplace\ndiscussions\n2.1. Response to workplace\nissues are sought\n2.2. Response to workplace\nissues are provided\nimmediately\n2.3. Constructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4. Goals/objectives and\naction plan are undertaken\nin the workplace are\ncommunicated\n2.1. Leading as a\nmanagement\nfunction\n2.2. Barriers of\ncommunication\n2.3. Effective verbal\ncommunication\nmethods\n2.4. Method/techniqu\nes of discussion\n2.5. How to lead\ndiscussion\n2.6. How to solicit\nresponse\n2.1. Communicating\neffectively\n2.2. Consulting the\ncrew on the\nprepared menu for\nthe month\n\n--- PDF PAGE 8 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 4\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n2.7. Goal setting and\naction planning\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1. Issues and problems are\nidentified as they arise\n3.2. Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3. Dialogue is initiated with\nappropriate personnel\n3.4. Communication problems\nand issues are raised as\nthey arise\n\n3.1. Types of issues\nand problems in\nthe workplace\n3.2. Written and\nelectronic\ncommunication\nmethods\n3.3. Communication\nbarriers\naffecting\nworkplace\ndiscussions\n3.1. Identifying cause\nof problems\n3.2. Identifying\nproblems and\nissues\n3.3. Organizing\ninformation on\nproblems and\nissues\n3.4. Relating problems\nand issues in the\nworkplace\n\n--- PDF PAGE 9 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMethods of communication may include:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at one\ntime\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nVariety of Information\n2.2.\nCommunication tools\n2.3.\nSimulated workplace\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nCompetency in this unit must be assessed through\n3.2.\nDirect Observation\n3.3.\nInterview\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 10 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 6\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n : 500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1. Work requirements are\nidentified and presented\nto team members\n1.2. Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3. Team members’\nqueries and concerns\nare recognized,\ndiscussed and dealt with\n1.1. Company policies and\nprocedures\n1.2. How performance\nexpectations are set\n1.3. Methods of Monitoring\nPerformance\n1.4. Client expectations\n1.5. Team member’s\nduties and\nresponsibilities\n1.6. Definition of Team\n1.7. Skills and techniques\nin promoting team\nbuilding\n1.8. Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n1.9. Art of listening and\ntreating individual\nteam members\nconcern\n1.1. Communication\nskills required\nfor leading\nteams\n1.2. Team building\nskills\n1.3. Negotiating\nskills\n1.4. Evaluation\nskills\n2. Assign\nresponsibilities\n2.1. Duties and\nresponsibilities are\nallocated having regard\nto the skills, knowledge\nand aptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2. Duties are allocated\nhaving regard to\nindividual preference,\ndomestic and personal\nconsiderations, whenever\npossible\n2.1. Concept of delegation\n2.2. How to delegate\n2.3. Understanding\nindividual differences\n2.4. Methods of\nmonitoring\nperformance\n2.5. Duties and\nresponsibilities of\neach team member\n2.6. Knowledge in\nidentifying each team\nmember duties and\nresponsibilities\n2.1. Delegating\nskills\n2.2. Identifying\nindividual\nskills,\nknowledge and\nattitude as\nbasis for\nallocating\nresponsibilities\n2.3. Identifying\neach team\nmember duties\nand\nresponsibilities\n3. Set performance\nexpectations for\nteam members\n3.1. Performance\nexpectations are\nestablished based on\nclient needs and\n3.1. Definition of\nperformance\nindicators/ criteria\n3.1. Identifying\nperformance\nindicators\n\n--- PDF PAGE 11 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 7\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Varia