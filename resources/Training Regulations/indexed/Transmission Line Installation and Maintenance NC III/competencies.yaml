mp assembly(ACSR/OHGW) \n3.10.5. Overhead ground wires \n3.10.6. Cross-arms and braces \n3.10.7. Conductors and accessories \n4. Hotline maintenance \nworks. \n4.1. Hot stick method \n4.1.1. Replacement of rotten wood pole \n4.1.2. Replacement of rotten cross arm \n4.1.3. Replacement of broken/corroded insulator \n4.2. Bare hand method \n4.2.1. Replacement of broken/corroded insulator \n4.2.2. Repair of armor rod \n4.2.3. Repair of damaged conductor \n4.2.4. Installation of vibration damper \n4.2.5. Replacement of suspension clamp \n4.2.6. Replacement of strain clamp\n\n--- PDF PAGE 73 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 69  \n \nEVIDENCE GUIDE \n \n1. Critical aspects of  \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Planned and prepared for work \n1.2. Prepared hotline and transmission line tools, equipment \nand line hardware \n1.3. Performed hotline maintenance work \n2. Resource Implications The following resources should be provided: \n2.1. Hotline tools, equipment and hardware  \n2.2. PPE and safety tools \n2.3. Work area  \n2.4. Line truck/trailer/container van \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1. Observation with oral questioning \n3.2. Demonstration with oral questioning \n3.3. Written test \n3.4. Portfolio assessment with interview \n4. Context of \nassessment \n4.1. Competency may be assessed in the workplace or in a    \nsimulated workplace setting \n4.2. Assessment shall be undertaken either individually or \npart of team under limited supervision\n",
