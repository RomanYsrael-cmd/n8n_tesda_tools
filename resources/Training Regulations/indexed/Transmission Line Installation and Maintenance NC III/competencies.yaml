        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Prepared hardware, tools and equipment\n1.3. Performed line voltage detection\n1.4. Installed grounding clusters\n1.5. Performed conductor riding activity\n1.6. Performed overhead maintenance works\n2. Resource\nimplications\nThe following resources should be available:\n2.1. Tools, equipment, hardware and PPE (see range of\nvariables)\n2.2. Work area\n2.3. Line truck\n3. Method of\nassessment\n3.1. Direct observation with oral questioning\n3.2. Demonstration with oral questioning\n3.3. Written test\n3.4. Portfolio assessment with interview\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 59 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 55\n\nUNIT OF COMPETENCY : INSTALL EMERGENCY RESTORATION STRUCTURE (ERS)\nUNIT CODE :"
        },
        "source_text": "UTL741305\nDESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nin performing construction of overhead transmission line\nabove 69 kV. This involves working with a team. The scope\nof this unit covers construction and maintenance of\ntransmission line above 69 kV.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n\n1.1. Work instruction is secured in\naccordance with job\nrequirements\n1.2. Relevant occupational health\nand safety requirements are\nidentified following job\nspecifications\n1.3. Appropriate transmission line\ntools, equipment and hardware\nare identified and requested in\naccordance with job\nspecifications\n\n1.1. Applicable\nmaterials, tools\nand equipment\n1.2. Usage of hand\ntools\n1.3. Basic Math\n(MDAS)\n1.4. Written and oral\ncommunication\n\n1.1. Communication\nskills\n1.2. Interpretation\nskills\n1.3. Mathematical\nskills\n1.4. Skills in\nidentifying T/L\nhardware, tools\nand equipment\n2. Prepare\nhardware,\ntools and\nequipment\n2.1 Personal protective equipment\n(PPE) are obtained following job\nrequirements\n2.2 Appropriate tools, equipment and\nhardware are acquired and\nsecured in line with job\nrequirements\n2.3 Functionality of tools and\nequipment is checked and tested\nin accordance with operational\nmanual and company standards.\n2.1 DOLE-OSHS Rule\n1080 – Personal\nProtective\nEquipment and\nDevices\n2.2 Usage and\nfunctions of\nappropriate\nmaterials, tools\nand equipment\n2.3 OSH requirement\n2.4 Basic Math\n(MDAs)\n2.5 Written and oral\ncommunication\n2.1 Communication\nskills\n2.2 Interpretation\nskills\n2.3 Mathematical\nskills\n2.4 Skills in\nidentifying T/L\nhardware, tools\nand equipment\n3. Perform\noverhead\nmaintenance\nworks\n\n3.1. Transmission line tools,\nequipment and hardware are\nused in line with job\nrequirements\n3.2. Personal protective equipment\n(PPE) are used following job\nrequirements\n3.3. Confirmation to proceed to work\nis secured from appropriate\npersonnel in accordance with\ncompany procedures.\n3.4. Line voltage detection is\nperformed based on operational\n3.1. Usage of\nappropriate PPE\n3.2. Usage and\nfunctions of\nappropriate\nhardware, tools\nand equipment\n3.3. Pole setting\nmethods\n3.4. Rigging technique\n3.5. Pole erection\ntechnique\n3.6. Structural Design\nand Specification\n3.7. Armoring method\n3.1. Communication\nskills\n3.2. Interpretation\nskills\n3.3. Mathematical\nskills\n3.4. Pole erection\nskills\n3.5. Rigging skills\n3.6. Climbing skills\n3.7. Conductor\nriding skills\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 51\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nmanual and company\nprocedures.\n3.5. Grounding clusters are installed\nbased on power industry safety\npractices\n3.6. Conductor riding activities are\nperformed based on job\nrequirements.\n3.7. Overhead maintenance work is\nperformed according to job\nspecifications\n3.8. Housekeeping procedure is\nperformed in line with power\nindustry procedure\n\n3.8. Load Principle\n3.9. Simple Machine\nPrinciple\n3.10. Basic Math\n(MDAS)\n3.11. Safe working\nload\n3.12. Written, oral\nand hand signal\ncommunication\n3.13. Two-way radio\ncommunication\n3.14. Clearance from\nDENR (cutting/\ntrimming permit)\n3.15. DOLE-OSHS\nRule 1080 –\nPersonal\nProtective\nEquipment and\nDevices\n3.16. DOLE-OSHS\nRule 1210 –\nElectrical Safety\n3.17. DOLE-OSHS\nRule 1428 -\nLines, Blocks,\nRigging\n3.1. Clean Air Act\n3.18. 5S and 3Rs\nprinciples\n\n--- PDF PAGE 56 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 52\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Overhead\nmaintenance job\nrequirements\nMay include overhead maintenance job requirements for:\n1.1 Guys and anchors\n1.2 Pole dressing\n 1.2.1 Cross-arm and appurtenances\n 1.2.2 Insulators and appurtenances\n1.3 Pole and cross arm\n1.4 Tower lattices\n1.5 Insulators.\n1.6 Conductor, OHGW and appurtenances\n1.6.1. Conductor splicing\n1.6.2. Armoring/Vibration damper\n1.6.3. Conductor spacer\n1.6.4. quadruple yoke\n1.6.5. repair sleeve\n2. Occupational\nhealth and safety\nrequirements\nMay include but not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1. Safety hat\n2.1.2. Safety goggles\n2.1.3. Safety gloves\n2.1.4. Safety shoes\n2.1.5. Working clothes\n2.2 Safety tools\n2.3 Safety harness\n2.4 Fall arrest\n2.5 Climber set\n2.6 Voltage detection of de-energized line (with voltage detector)\n2.7 Installation of grounding clusters\n2.8 DOLE-OSHS Rule 1210 – Electrical Safety\n2.9 DOLE-OSHS Rule 1420 - Logging\n2.10 DOLE-OSHS Rule 1150 – Materials Handling and Storage\n2.11 OHSAS 18001 – Occupational Health and Safety\nManagement System\n3. Transmission\nline tools,\nequipment and\nhardware\nMay include but not limited to:\n3.1 Tools\n3.1.1. Pliers\n3.1.2. Screwdrivers\n3.1.3. Adjustable wrenches\n3.1.4. Ball peen hammer\n3.1.5. Auger bit\n3.1.6. Hacksaw/cutting tools\n3.2 Equipment\n3.2.1. Ratchet hoist\n3.2.2. Capstan/Hand winch\n3.2.3. Block and tackle\n3.2.4. Compression tool\n3.2.5. Snatch block\n3.2.6. Climbing gears\n3.2.7. Hydraulic bolt cutter\n\n--- PDF PAGE 57 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 53\n\nVARIABLE\nRANGE\n3.2.8. Line truck/Boom truck\n\n3.3 Hardware\n3.3.1. Insulator\n3.3.2. Machine bolts\n3.3.3. Suspension clamps\n3.3.4. Strain clamp\n3.3.5. Overhead ground wires\n3.3.6. Cross-arms and braces\n3.3.7. Conductors and accessories\n3.3.8. Tower parts\no Lattices\no Step bolts\no Bolts and nuts\no Plates and back plates\no Grounding cables\no Tower fitting\no Arcing horn\no Tower fitting\n4. Conductor riding\nactivities\nMay include but not limited to:\n4.1\nInstall/replace vibration damper\n4.2\nInstall wire grip\n4.3\nInstall by-pass jumper\n4.4\nRepair damaged conductor\n4.5\nInstall/replace line spacer\n4.6\nReplacement of insulator\n4.7\nReplacement of damaged strain clamp\n4.8\nConductor/OHGW sag correction\n4.9\nRemoval of foreign objects\n4.10 Cleaning of insulators\n5. Overhead\nmaintenance\nworks\nOverhead maintenance works may include:\n5.1 Replacement/ installation of Guys and anchors\n5.2 Pole dressing\n5.2.1. Cross-arm and appurtenances\n5.2.2. Insulators and appurtenances\n5.3 Replacement of rotten pole and cross- arm\n5.4 Replacement of defective/missing tower lattices\n5.5 Replacement of damaged/corroded insulators.\n5.6 Replacement of damaged Conductor, OHGW and\nappurtenances\n4.6.1. Conductor splicing\n4.6.2. Armoring/Vibration damper\n4.6.3. Conductor spacer\n4.6.4. quadruple yoke\n5.7 Installation of repair sleeve\n\n--- PDF PAGE 58 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 54\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Prepared hardware, tools and equipment\n1.3. Performed line voltage detection\n1.4. Installed grounding clusters\n1.5. Performed conductor riding activity\n1.6. Performed overhead maintenance works\n2. Resource\nimplications\nThe following resources should be available:\n2.1. Tools, equipment, hardware and PPE (see range of\nvariables)\n2.2. Work area\n2.3. Line truck\n3. Method of\nassessment\n3.1. Direct observation with oral questioning\n3.2. Demonstration with oral questioning\n3.3. Written test\n3.4. Portfolio assessment with interview\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 59 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 55\n\nUNIT OF COMPETENCY : INSTALL EMERGENCY RESTORATION STRUCTURE (ERS)\nUNIT CODE :"
