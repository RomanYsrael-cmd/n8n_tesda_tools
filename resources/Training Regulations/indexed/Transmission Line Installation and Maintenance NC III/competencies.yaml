 of written \nand electronic \ncommunication \nmethods \n1.5. Reporting \noccupational \nhazards during \nsafety meeting\n2. Lead \nworkplace \ndiscussions \n2.1. Response to workplace \nissues are sought  \n2.2. Response to workplace \nissues are provided \nimmediately \n2.3. Constructive contributions \nare made to workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4. Goals/objectives and \naction plan are undertaken \nin the workplace are \ncommunicated\n2.1. Leading as a \nmanagement \nfunction \n2.2. Barriers of \ncommunication \n2.3. Effective verbal \ncommunication \nmethods \n2.4. Method/techniqu\nes of discussion \n2.5. How to lead \ndiscussion \n2.6. How to solicit \nresponse\n2.1. Communicating \neffectively \n2.2. Consulting the \ncrew on the \nprepared menu for \nthe month\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended    December 18, 2017      Page 4  \nELEMENT \n PERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \n2.7. Goal setting and \naction planning\n3. Identify and \ncommunicate \nissues arising \nin the \nworkplace \n3.1. Issues and problems are \nidentified as they arise \n3.2. Information regarding \nproblems and issues are \norganized coherently to \nensure clear and effective \ncommunication \n3.3. Dialogue is initiated with \nappropriate personnel \n3.4. Communication problems \nand issues are raised as \nthey arise \n \n3.1. Types of issues \nand problems in \nthe workplace \n3.2. Written and \nelectronic \ncommunication \nmethods \n3.3. Communication \nbarriers \naffecting \nworkplace \ndiscussions \n3.1. Identifying cause \nof problems \n3.2. Identifying \nproblems and \nissues \n3.3. Organizing \ninformation on \nproblems and \nissues \n3.4. Relating problems \nand issues in the \nworkplace\n\n--- PDF PAGE 9 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended    December 18, 2017      Page 5  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \nMethods of communication may include: \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face to face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDealt with a range of communication/information at one \ntime \n1.2. \nMade constructive contributions in workplace issues \n1.3. \nSought workplace issues effectively \n1.4. \nResponded to workplace issues promptly \n1.5. \nPresented information clearly and effectively written form \n1.6. \nUsed appropriate sources of information \n1.7. \nAsked appropriate  questions \n1.8. \nProvided accurate information  \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1. \nVariety of Information \n2.2. \nCommunication tools \n2.3. \nSimulated workplace \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. \nCompetency in this unit must be assessed through \n3.2. \nDirect Observation \n3.3. \nInterview \n4. Context  for \nAssessment \n4.1. \nCompetency may be assessed in the workplace or in \nsimulated workplace environment\n",
