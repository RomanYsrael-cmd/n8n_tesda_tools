        "source_text": "500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying appropriate\nand affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Study/select\nappropriate\ntechnology\n1.1 Usage of different\ntechnologies is determined\nbased on job requirements\n1.2 Appropriate technology is\nselected as per work\nSpecification\n1.1 Awareness on\ntechnology and its\nfunction\n1.2 Communication\ntechniques\n1.3 Health and safety\nprocedure\n1.4 Company policy in\nrelation to relevant\ntechnology\n1.5 Machineries/\nequipment and\ntheir application\n1.6 Software programs\n1.1 Identifying\nrelevant\ntechnology on\njob\n2. Apply\nrelevant\ntechnology\n\n2.1 Relevant technology is\neffectively used in carrying out\nfunction\n2.2 Applicable software and\nhardware are used as per task\nrequirement\n2.3 Management concepts are\nobserved and practiced as per\nestablished industry practices\n2.1 Knowledge on\noperating\ninstructions\n2.2 Understanding\nsoftware and\nhardware system\n2.3 Communication\ntechniques\n2.4 Health and safety\nprocedure\n2.5 Company policy in\nrelation to relevant\ntechnology\n2.6 Different\nmanagement\nconcepts\n2.7 Technology\nadaptability\n2.1 Applying\nrelevant\ntechnology\n2.2 Communicating\nskills\n2.3 Using software\napplications\nskills\n2.4 Conducting risk\nassessment\n3. Maintain/\nenhance\nrelevant\ntechnology\n3.1 Maintenance of technology is\napplied in accordance with the\nindustry standard operating\nprocedure, manufacturer’s\noperating guidelines and\noccupational health and\nsafety procedure to ensure\nits operative ability\n3.2 Updating of technology is\nmaintained through continuing\neducation or training in\naccordance with job\nrequirement\n3.1 Awareness on\ntechnology and its\nfunction\n3.2 Repair and\nmaintenance\nprocedure\n3.3 Health and safety\nprocedure\n3.4 Company policy in\nrelation to relevant\ntechnology\n3.5 Upgrading of\ntechnology\n3.1 Performing\nbasic\ntroubleshooting\nskills\n3.2 Identifying\nfailures or\ndefects\n3.3 Communication\nskills\n3.4 Applying\ncorrective and\npreventive\nmaintenance\n\n--- PDF PAGE 25 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 21\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.3 Technology failure/ defect is\nimmediately reported to the\nconcern/responsible person or\nsection for appropriate action\n\n3.6 Organizational set-\nup/work flow\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.5 Total Quality Management\n2.6 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 26 ---\n-