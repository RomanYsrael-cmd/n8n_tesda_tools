        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Prepared hardware, transmission line tools and equipment\n1.3. Performed pole staking and excavation\n1.4. Performed pole loading and unloading, hauling and dragging\n1.5. Performed pole-setting\n1.6. Removed/retrieved old pole\n2. Resource\nimplications\nThe following resources should be available:\n2.1. Tools, equipment and hardware\n2.2. PPE and safety tools\n2.3. Line truck\n3. Method of\nassessment\n3.1. Demonstration of skills with oral questioning\n3.2. Written test\n3.3. Portfolio assessment with Interview\n\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 50\n\nUNIT OF COMPETENCY :\nPERFORM OVERHEAD TRANSMISSION LINE WORKS\nUNIT CODE\n:"
        },
        "source_text": "UTL741304\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\nerect new transmission line pole. This unit includes\ncompetencies for installing of pole and/or removal of\ndamaged/old poles, if necessary. This unit involves working\nwith a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n1.1. Work instruction is secured\naccording to\njob requirements\n1.2. Relevant occupational\nhealth and safety\nrequirements are identified\nfollowing job specifications\n1.3. Appropriate tools, equipment\nand hardware are identified\nand requested in accordance\nwith job specifications\n1.1. Usage and functions\nof appropriate tools,\nequipment and\nhardware.\n1.2. Design and\nspecification of\ntransmission line\n(T/L) structures\n1.3. DOLE-OSHS Rule\n1410 – Construction\nSafety\n1.4. Basic Math (MDAS)\n1.5. Written and oral\ncommunication\n1.1. Communication\nskills\n1.2. Interpretation\nskills\n1.3. Mathematical\nskills\n1.4. Skills in\nidentifying T/L\nhardware, tools\nand equipment\n\n2. Prepare\nhardware,\ntransmission\nline tools and\nequipment\n2.1 Personal protective equipment\n(PPE) are obtained following\njob requirements\n2.2 Appropriate tools, equipment\nand hardware are acquired\nand secured in line with job\nrequirements\n2.3 Operational condition of\ntransmission line tools and\nequipment are checked in\naccordance with its\ncorresponding manual and\ncompany standards.\n2.1 DOLE-OSHS Rule\n1080 – Personal\nProtective\nEquipment and\nDevices\n2.2 Usage and functions\nof appropriate\nmaterials, tools and\nequipment\n2.3 OSH requirement\n2.4 Basic Math (MDAs)\n2.5 Written and oral\ncommunication\n2.1 Communication\nskills\n2.2 Interpretation\nskills\n2.3 Mathematical\nskills\n2.4 Skills in\nidentifying T/L\nhardware, tools\nand equipment\n\n3. Perform pole\nstaking and\nexcavation\n3.1. Appropriate to