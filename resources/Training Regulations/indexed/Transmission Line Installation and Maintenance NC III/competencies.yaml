        "source_title": "INSTALL/CONSTRUCT NEW TRANSMISSION LINE STRUCTURES",
        "source_text": "--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 43  \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :    INSTALL/CONSTRUCT NEW TRANSMISSION LINE \nSTRUCTURES \nUNIT CODE  \n          :    UTL741304 \nDESCRIPTOR                  : \nThis unit covers the knowledge, skills and attitude required to \nerect new transmission line pole. This unit includes \ncompetencies for installing of pole and/or removal of \ndamaged/old poles, if necessary. This unit involves working \nwith a team. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \nwork \n1.1. Work instruction is secured \naccording to  \njob requirements  \n1.2. Relevant occupational \nhealth and safety \nrequirements are identified \nfollowing job specifications \n1.3. Appropriate tools, equipment \nand hardware are identified \nand requested in accordance \nwith job specifications \n1.1. Usage and functions \nof appropriate tools, \nequipment and \nhardware. \n1.2. Design and \nspecification of \ntransmission line \n(T/L) structures \n1.3. DOLE-OSHS Rule \n1410 – Construction \nSafety \n1.4. Basic Math (MDAS) \n1.5. Written and oral \ncommunication\n1.1. Communication \nskills \n1.2. Interpretation \nskills \n1.3. Mathematical \nskills \n1.4. Skills in \nidentifying T/L \nhardware, tools \nand equipment \n \n2. Prepare \nhardware, \ntransmission \nline tools and \nequipment \n2.1 Personal protective equipment \n(PPE) are obtained following \njob requirements  \n2.2 Appropriate tools, equipment \nand hardware are acquired \nand secured in line with job \nrequirements \n2.3 Operational condition of \ntransmission line tools and \nequipment are checked in \naccordance with its \ncorresponding manual and \ncompany standards. \n2.1 DOLE-OSHS Rule \n1080 – Personal \nProtective \nEquipment and \nDevices  \n2.2 Usage and functions \nof appropriate \nmaterials, tools and \nequipment \n2.3 OSH requirement \n2.4 Basic Math (MDAs) \n2.5 Written and oral \ncommunication \n2.1 Communication \nskills \n2.2 Interpretation \nskills \n2.3 Mathematical \nskills \n2.4 Skills in \nidentifying T/L \nhardware, tools \nand equipment \n \n \n \n3. Perform pole \nstaking and \nexcavation \n3.1. Appropriate tools, equipment \nand hardware are used in line \nwith job requirements \n3.2. Personal protective \nequipment (PPE) are used \nfollowing  job requirements \n3.3. Pole staking is performed \nbased on area condition. \n3.4 Excavation procedure is \nperformed following \nestablished company \nstandard and safety \nrequirements \n3.1. Usage of \nappropriate PPE  \n3.2. Usage and \nfunctions of \nappropriate \nmaterials, tools and \nequipment \n3.3. Design and \nspecification of the \npole structures \n3.4. Excavation \nprocedure per \ncompany standards \n3.1. Communication \nskills \n3.2. Interpretation \nskills \n3.3. Mathematical \nskills \n3.4. Skills in \nidentifying T/L \nhardware, tools \nand equipment \n3.5. Skills in proper \nexcavation of\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 44  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.5. DOLE-OSHS Rule \n1413 – Excavation \n3.1. Soil bearing \ncapacity \n3.2. Basic Math (MDAs) \n3.2.1 Depth of hole \n3.2.2 Diameter of \npole hole \n3.3. Written and oral \ncommunication\npole and anchor \nholes \n \n \n4. Transport \nand drag \npole to job \nsite \n4.1. Appropriate tools and \nequipment are used in line \nwith job requirements \n4.2. Personal protective \nequipment (PPE) are used \nfollowing  job requirements \n4.3. Loading and unloading \nmethod for poles is \nperformed following safety \nrequirements \n4.4. Poles are hauled based on \nproper hauling procedures \n4.5. Poles are manually dragged, \nif necessary, based on \nproper dragging procedure \n \n4.1. Identification of \nappropriate \nhardware tools and \nequipment. \n4.2. Usage of \nappropriate PPE \n4.3. Usage and \nfunctions of \nappropriate \nmaterials, tools and \nequipment \n4.4. Traffic rules and \nregulation. \n4.5. Rigging technique \n4.6. Hauling and \nmanual dragging \ntechniques \n4.7. DOLE-OSHS Rule \n1428 – Lines, \nBlocks, Rigging \n4.8. Simple machine \nprinciple \n4.9. Basic Math \n(MDAS) \n4.10. Written, oral and \nhand signal \ncommunication \n4.1. Communication \nskills \n4.2. Interpretation \nskills \n4.3. Mathematical \nskills \n4.4. Rigging skills  \n4.4.1 Knot tying, \nsplicing  \n4.4.2 Reeving  \n4.4.3 Loading \nand \nunloading\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 45  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5. Perform pole-\nsetting  \n5.1. Appropriate tools, equipment \nand hardware are used in \nline with job requirements \n5.2. Personal protective \nequipment (PPE) are used \nfollowing  \n        job requirements \n5.3. Pole setting method is \nperformed in line with job \nrequirements  \n5.4. Housekeeping procedure is \nperformed following company \npolicies and procedures \n5.1. Usage of \nappropriate PPE \