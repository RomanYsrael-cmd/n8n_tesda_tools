        "source_title": "PERFORM EARTH/GROUND RESISTANCE TESTING",
        "source_text": "--- PDF PAGE 64 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 60  \n \nUNIT OF COMPETENCY :  PERFORM EARTH/GROUND RESISTANCE TESTING \nUNIT CODE  \n         :  UTL741307 \nUNIT DESCRIPTOR         :  This unit describes the knowledge, skills and attitudes in \nproper using of earth/ground resistance tester in transmission \nline resistance testing. This unit will involve working in a team \nenvironment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \nwork \n1.1. Work instruction is secured \naccording to job requirements \n1.2. Relevant occupational health \nand safety requirements are \nidentified following job \nspecifications \n1.3. Relevant transmission line \ntools and equipment are \nidentified and requested in \naccordance with job \nspecifications\n1.1. Usage and functions \nof ground resistance \nTester \n1.2. Usage of hand tools \n1.3. Types and usage \nPPE \n1.4. Rod distance \nmeasurement \n1.5. Basic math (MDAS) \n1.6. Written and oral \ncommunication\n1.1. Communication \nskills \n1.2. Interpretation \nskills \n1.3. Mathematical \nskills \n2. Prepare tools \nand \nequipment \n2.1. Personal protective equipment \n(PPE) are obtained following \njob requirements. \n2.2. Transmission line tools and \nequipment  are secured in line \nwith job requirements \n2.3. Earth resistance tester’s \ncondition and functionality are \nchecked based on \nmanufacturer’s equipment \nmanual. \n2.1. DOLE-OSHS Rule \n1080 – Personal \nProtective \nEquipment and \nDevices \n2.2. Operation of earth \nresistance tester \n2.3. Usage of hand tools \n2.4. Basic math (MDAS) \n2.5. Written and oral \ncommunication \n2.1. Communication \nskills \n2.2. Interpretation \nskills \n2.3. Mathematical \nskills \n3. Conduct \nearth/ground \ntesting \n3.1. Test rod location is identified \nbased on equipment \ninstructional manual. \n3.2. Test rod is driven on identified \nground location based \nequipment instructional manual. \n3.3. Lead wires are laid out in \naccordance with earth/ground \nprocedures.    \n3.4. Wire contact connections are \nfirmly connected with the test \nand tower body. \n3.5. Tester reading is recorded \nbased on testing procedures. \n3.6. Test result is submitted to \nconcerned personnel in \naccordance with company \nprocedures.      \n3.1. Usage of \nappropriate PPE \n3.2. Procedures in \nearth/ground testing \n3.3. Operation of \nearth/ground \nresistance tester \n3.4. Earth/ ground \nresistance principle \n3.5. DOLE-OSHS Rules \n1210 – Electrical \nSafety \n3.6. Basic math(MDAS) \n3.7. Written and oral \ncommunication \n3.1. Communication \nskills \n3.2. Interpretation \nskills \n3.3. Mathematical \nskills \n3.4. Testing reading \nskills\n\n--- PDF PAGE 65 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC III       Amended  December 18, 2017      Page 61  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Occupational health \nand safety standards \nMay include but not limited to: \n1.1 Personal protective equipment (PPE) \n1.1.1 Safety hat \n1.1.2 Safety goggles \n1.1.3 Safety gloves \n1.1.4 Safety shoes /rain boots \n1.2 DOLE-OSHS Rules 1210 – Electrical Safety \n1.3 DOLE-OSHS Rule 1080 – Personal Protective \nEquipment and Devices \n2. Tools and equipment  \nMay include but not limited to: \n2.1 Hand tools   \n2.1.1 Pliers \n2.1.2 Screwdrivers \n2.1.3 Adjustable wrenches \n2.1.4 Ball peen hammer \n2.1.5 Hacksaw/cutting tools \n2.1.6 Bolo \n2.1.7 Steel brush or sand paper \n2.1.8 Tape measure \n2.2 Equipment  \n2.2.1 Line truck \n2.2.2 Ground resistance Tester with extra battery\n3. Concerned personnel \nMay include: \n3.1 line foreman \n3.2 line engineer \n3.3 OPC personnel \n \n \nEVIDENCE GUIDE \n1. Critical aspects of     \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Planned and prepared for work \n1.2. Prepared tools and equipment \n1.3. Conducted earth/ground testing\n2. Resource Implications \nThe following resources must be available: \n2.1. Earth/ground testing tools, equipment and PPE  \n2.2. Assessment area  \n2.3. Line truck/service vehicle  \n3. Method of assessment \n3.1. Demonstration with oral questioning \n3.2. Interview \n3.3. Written test \n3.4. Portfolio assessment with interview \n4. Context of assessment \n4.1. Competency may be assessed in the workplace or \nin a simulated workplace setting\n",
