      "definition": "a statement with documentation from the Operations Supervisor to the Job Supervisor that specific work may be done on or near a line or other equipment without requiring that it be disconnected from all sources of energy. The equipment is to be considered energized or “hot.”"
    },
    {
      "term": "Hotstick",
      "definition": "an insulated stick, usually made of fiberglass, that is used to work energized overhead conductors and operate electrical equipment that is overhead, underground and pad mounted."
    },
    {
      "term": "Insulator",
      "definition": "a device that is used to electrically isolate a conductor or electrical device from ground or a different electrical potential. Insulators must support the conductors and withstand both the normal operating voltage and surges due to switching and lightning. Insulators are broadly classified as either pin-type, which support the conductor above the structure, or suspension type, where the conductor hangs below the structure. Up to about 33 kV (69 kV in North America) both types are commonly used. At higher voltages only suspension-type insulators are common for overhead conductors. Insulators are usually made of wet-process porcelain or toughened glass, with increasing use of glass-reinforced polymer insulators."
    },
    {
