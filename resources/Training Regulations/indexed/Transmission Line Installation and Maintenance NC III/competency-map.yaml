  "source_text": "Section 1. Successful candidates shall be\nawarded a National Certificate III signed by the TESDA Director General.\n\n4.1.2. The qualification of Transmission Line Installation and Maintenance NC III\nmay be attained by demonstration of competence through project-type\nassessment covering Basic, Common and Core Units of Competency.\n\n4.1.3. Assessment shall cover all competencies, with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4. Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1 Graduates of formal training on Transmission Line Installation and\nMaintenance NC III or related trainings provided by enterprise/s;\n\n4.1.3.2 Individuals who has completed 6 months lineman’s training and\napprenticeship program. He/she must have experience working in\ntasks related to “Emergency Restoration Structure (ERS)”;\n\n4.1.3.3 Holders of Transmission Line Installation and Maintenance NC II with\nat least 2 years work experience in transmission line installation/\nconstruction and maintenance and he/she must have experience\nworking in tasks related to “Emergency Restoration Structure (ERS);\n\n4.1.3.4 Holders of Electrical Power Distribution Line Construction NC II with\nat least 3 years of work experience in distribution line installation/\nconstruction and maintenance and he/she must have experience\nworking in tasks related to “Emergency Restoration Structure (ERS)”.\n\n4.1.5. The candidate may opt for portfolio assessment with interview if he/she has at\nleast 4 years of relevant work experience (within the last 6 years) in\ntransmission line installation/construction and maintenance and he/she must\nhave experience working in tasks related to “Emergency Restoration Structure\n(ERS)”.\n\nThe candidate must show sufficient evidences on the above requirements in\nhis/her portfolio. Necessary documents to be submitted are: Certificate of\n\n--- PDF PAGE 103 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 99\n\nEmployment (indicating position, nature of work and period), Training\nCertificate/s (local or international) on transmission line installation/\nconstruction and maintenance and other relevant trainings.\n\n4.1.6. The existing NCs or COCs in Transmission Line Installation and Maintenance\nNC III are still valid until the said NCs or COCs have expired. Individuals are\nadvised to take the assessment for this amended/updated TR on or before the\nexpiration of such certificates.\n\n4.1.7. The guidelines on assessment and certification are discussed in detail in the\n\"Operating Procedures on Assessment and Certification\" and \"Guidelines on\nthe Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)\".\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\n\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only assessment center accredited by\nTESDA is authorized to manage the assessment activities of candidates for\nnational certification.\n\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited by\nTESDA is authorized to assess the competencies of candidates for national\ncertification.\n\n--- PDF PAGE 104 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 100\n\nGLOSSARY OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who pass\nthe assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or identifies\nthe evidences required to determine the competence of the individual. It provides\ninformation on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 105 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 101\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n19) Resource Implication - refer to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n20) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n21) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is essential\nto the performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and industry\nspecific skills\n\n24) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 106 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 102\n\nSECTOR SPECIFIC\n\n1.\nACSR - abbreviation of Aluminum Cable Steel Reinforced, a cable type having\naluminum strands and a core of one or more steel strands. ACSR are primarily used\nfor medium and high voltage lines and may also be used for overhead services to\nindividual customers.\n2.\nAnchor Rod – used for securing a machine, structure or part to masonry or other\nmaterial.\n3.\nBlock and Tackle - is a combination or set of single or several sheaved blocks used\nto obtain a mechanical advantage in handling heavy loads.\n4.\nCable Height Meter - to determine the height of overhead cables\n5.\nConductor – is a conductive material usually made of aluminum or copper used to\ncarry current along the overhead transmission line\n6.\nExtra High Voltage (Transmission) – over 230 kV, up to about 800 kV, used for long\ndistance, very high power transmission.\n7.\nFull Body Harness - form of protective equipment designed to protect a person from\ninjury due to falling\n8.\nGrounding Cluster – used to protect personnel working in de-energized lines, from\ninduced voltage, fault current feed, lightning strikes, erroneous switching & accidental\ncontact with adjacent lines\n9.\nGround line maintenance work – refers to activities in the ground done by\ntransmission line personnel which do not require climbing activity\n10. Groundworks - a person working at ground level in support of a lineman working\noverhead.\n11. Guy Wire. The wire or cable normally used in a down guy is seven-strand\ngalvanized steel wire or seven-strand aluminum clad wire. Alum weld wire consists of\nsteel wire strands coated with a layer of aluminum to prevent corrosion. Guy wire is\nused in various sizes with diameters from ¼ to 1 ¼ in.\n12. Guy-wire assembly -is a tensioned cable designed to add stability to structures\n(frequently ship masts, radio masts, wind turbines, utility poles, and tents). One end\nof the cable is attached to the structure, and the other is anchored to the ground at a\ndistance from the structure's base.\n13. Handline - used for lifting or lowering small objects and also for holding equipment\naway from the pole as it is being raised\n14. Hazard - a dangerous condition, potential or inherent, that can bring about an\ninterruption or interfere with the expected orderly progress of an activity. It is any\nwork materials, equipment, methods or practices that have the potential to cause\nharm to life, health, property or environment.\n15. Hazardous - an atmosphere that may expose employees to the risk of death,\natmosphere incapacitation, impaired ability to self-rescue unaided, injury, or acute\nillness.\n16. Hazardous atmospheres - include flammable gas, vapor, or mist, airborne\ncombustible dust, oxygen concentration below 19.5 percent or above 23.5 percent,\n\n--- PDF PAGE 107 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 103\n\nconcentrations of substances that exceed dose or permissible exposure limits, or\nother atmospheric condition immediately dangerous to life or health.\n17. High Voltage (Sub-transmission if 33-115kV and transmission if 115kV+) – between\n33 kV and about 230 kV, used for sub-transmission and transmission of bulk\nquantities of electric power and connection to very large consumers.\n18. Hot Line Order - a statement with documentation from the Operations Supervisor to\nthe Job Supervisor that specific work may be done on or near a line or other\nequipment without requiring that it be disconnected from all sources of energy. The\nequipment is to be considered energized or “hot.”\n19. Hotstick - an insulated stick, usually made of fiberglass, that is used to work\nenergized overhead conductors and operate electrical equipment that is overhead,\nunderground and pad mounted.\n20. Insulator - a device that is used to electrically isolate a conductor or electrical device\nfrom ground or a different electrical potential. Insulators must support the conductors\nand withstand both the normal operating voltage and surges due to switching and\nlightning. Insulators are broadly classified as either pin-type, which support the\nconductor above the structure, or suspension type, where the conductor hangs below\nthe structure. Up to about 33 kV (69 kV in North America) both types are commonly\nused. At higher voltages only suspension-type insulators are common for overhead\nconductors. Insulators are usually made of wet-process porcelain or toughened\nglass, with increasing use of glass-reinforced polymer insulators.\n21. Line to line clearance – refers to the distance of live conductors to another live\nconductor.\n22. Line to ground clearance - refers to the distance of live conductors to the ground\n23. Lineman - a payroll classification or title given a craftsperson whose duties include\nclimbing wood poles or steel structures to perform work on electric power\ntransmission and distribution circuits.\n24. Low voltage – less than 1000 volts, used for connection between a residential or\nsmall commercial customer and the utility.\n25. Medium Voltage (Distribution) – between 1000 volts (1 kV) and to about 33 kV, used\nfor distribution in urban and rural areas.\n26. OHSAS 18001 – is a framework for an Occupational Health and Safety (OHS)\nManagement Systems and is part of the OHSAS 18000 series of standards, along\nwith OHSAS 18002.\n27. Overhead ground wire (OHGW) – is an electrical conductor which provides\nprotection to transmission lines against direct lightning strokes.\n28. Overhead power line - is an electric power transmission line suspended by towers\nor poles. Since most of the insulation is provided by air, overhead power lines are\ngenerally the lowest-cost method of transmission for large quantities of electric\npower. Towers for support of the lines are made of wood (as-grown or laminated),\nsteel (either lattice structures or tubular poles), concrete, aluminum, and occasionally\nreinforced plastics. The bare wire conductors on the line are generally made of\naluminum (either plain or reinforced with steel or sometimes composite materials),\nthough some copper wires are used in medium-voltage distribution and low-voltage\nconnections to customer premises.\n\n--- PDF PAGE 108 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 104\n\n29. Personal Protective Equipment (PPE) - refers to protective clothing, helmets,\ngoggles, or other garment or equipment designed to protect line personnel from job-\nrelated occupational hazards\n30. Personal Protective Equipment (PPE) - the term shall include, but is not limited to,\ndevices designed to be worn by workers for eye, face, head, respiratory, hand, arm,\nbody, leg, foot, and fall protection.\n31. Philippine Grid Code - establishes and documents the basic rules, requirements,\nprocedures and standards that govern the operation, maintenance and development\nof the high-voltage backbone transmission system in the Philippines (Republic Act\nNo. 9136, also known as the “Electric Power Industry Reform Act of 2001)\n32. Pole Dressing – refers to installation of structure components, such as cross arms,\ninsulators and etc.\n33. Pole Setting – refers to pole positioning, pole erection and pole facing.\n34. Pre-formed Armor Rod - a spiral-formed aluminum rod, a group of which is placed\naround a conductor at the point of suspension to minimize vibration and to protect the\nconductor from burning in case of a flashover.\n35. Reeving - The operation of passing the rope around the sheaves of blocks.\n36. Rigging – is the term used to described the process of moving/lifting both heavy and\nlight loads using rope, blocks, and other special equipment.\n37. Right of way (ROW) – the legal right, established by usage or grant, to pass along a\nspecific route through grounds or property belonging to another.\n38. Risks - a probability or threat of damage, injury, liability, loss or any other negative\noccurrence that is caused by external or internal vulnerabilities, and that may be\navoided through preemptive action.\n39. Slings - provide a method of attaching rigging tools to structures or equipment.\nThey can be made of rope, webbing or steel. Some slings are made with a\ncontinuous loop while others are made with an eye on each end.\n40. Slope Protection – The protection of an embankment slope against wave action or\nerosion.\n41. Tag Line - A rope used to control the position of equipment being lifted. This is not to\nbe confused with the rope used to actually lift the equipment.\n42. Transmission line - is the material medium or structure that forms all or part of a\npath from one place to another for directing the transmission of energy, such as\nelectromagnetic waves or acoustic waves, as well as electric power transmission.\nComponents of transmission lines include wires, coaxial cables, dielectric slabs,\noptical fibers, electric power lines, and waveguides.\n43. Ultra High Voltage – higher than 800 kV.\n44. Vibration Damper - a device used to dissipate the vibration of conductors on a\ntransmission line.\n45. Voltage Detector- is a sensor used to detect presence of electricity in a wire.\n\n--- PDF PAGE 109 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 105\n\nANNEX A - COMPETENCY MAP\n\nTRANSMISSION LINE INSTALLATION & MAINTENANCE NC III COMPETENCY MAP\n\nBASIC COMPETENCIES\n\nReceive and Respond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping procedures\nParticipate in Workplace\nCommunication\nWork in a Team Environment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small\nWorking Teams\nDevelop and Practice\nNegotiating Skills\nWith Team Members\nGuide Effective\nSolutions to Problems\nArising from Work\nActivities\nCheck and Develop the\nUse of Mathematical\nConcepts & Techniques\nUse Relevant\nTechnologies\nApplicable to Assigned\nWork\nLead in Utilizing\nSpecialized\nCommunication Skills\nAssist in Developing\nTeam and Individuals\nApply Problem Solving\nTechniques in the\nWorkplace\nCollect, analyze and\norganize information\nPlan and Organize Work for\nSeveral Working Teams\nPromote Environmental\nProtection\n\nCOMMON COMPETENCIES\n\nApply quality standards\nComply with\nenvironmental protection\nprocedures\nObserve procedures,\nspecifications and manual\nof instruction\nOperate and Maintain T/L\ntools and equipment\nOperate a personal\ncomputer\n\nCORE COMPETENCIES\nTender Diesel Engine\nOperate Diesel Power\nplant\nMaintain and Repair Diesel\nEngine Systems and\nAlternator\nService Alternator/\nGenerator\nDiagnose and Repair\nDiesel Engine\nDiagnose and Repair\nElectrical System\nOverhaul Diesel Engine\nPerform transmission line pole\nerection\nPerform overhead\ntransmission line work\nPerform cold-line\nmaintenance work\nPerform live-line\nmaintenance work\nPerform ground line\nmaintenance work\nPlan transmission line\nmaintenance job\nInstall emergency\nrestoration structure\n(ERS)\nInspect/Assess transmission\nline components’ conditions\nImplement transmission\nline maintenance works\nInspect transmission line,\npoles, towers and\nappurtenances\nErect distribution line\npoles\nClimb pole and install\npole assembly/conductors\nInstall distribution line\nequipment and devices\n\nInstall consumer service\nconnection facility\nConduct initial root cause\nanalysis\nPerform ground\ntransmission line works\nPerform overhead\nmaintenance works\nInstall/construct\nnew transmission\nline structures\nPerform overhead\ntransmission line\nworks\nInstall emergency\nrestoration structure\n(ERS)\nPerform earth/ground\nresistance testing\nPlan assigned maintenance\nwork\nSupervise transmission\nline maintenance work\n\n--- PDF PAGE 110 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 106\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Transmission Line Installation and Maintenance NC III\nQualification Code: UTLTXL317\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nTransmission Line\nInstallation and\nMaintenance NC II\n\nNot Applicable\nTB No. 2008-35/\nDecember 18, 2008\nNot Applicable\n01\nDocument Amended –\nTransmission Line\nInstallation and\nMaintenance NC II\n\nTB No. 2008-35/\nDecember 18, 2008\nTB No. 2017-51/\nDecember 18, 2017\nTESDA Circular\nNo. __ s. 2018\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 111 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC III Amended December 18, 2017 Page 107\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies and labor groups who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTHE TECHNICAL EXPERT COMMITTEE (FOR CY 2006)\n\nMR. ERNESTO P. MANUEL, JR.\nMR. AL HENRY D. SUMAEL\nLine Foreman\nNorth Cagayan Branch, NLOM\nLine Foreman\nCentral Negros T/L, VOM\nNational Transmission Corporation (TransCo)\nNational Transmission Corporation (TransCo)\nMR. EUFRACIO N. FRANCISCO\nMR. RUBEN A. GASCO\nLine Foreman\nLine Foreman\nCamarines Sur Branch, SLOM\nIligan T/L, MOM\nNational Transmission Corporation (TransCo)\nNational Transmission Corporation (TransCo)\n\nMR. AQUILINO 