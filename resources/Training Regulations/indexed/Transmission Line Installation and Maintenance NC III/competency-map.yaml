d\ngovernment agencies and labor groups who donated their time and expertise to the review,\nupdating and validation of this Training Regulations.\n\n• THE TECHNICAL EXPERT COMMITTEE (FOR CY 2017)\n\nDALMACIO RUEL S. TOBIAS\nGENEROSO A. RANA\nChief Engineer, Transmission Line\nLineman\nDistrict 7, North Luzon Operations & Maintenance\nDistrict 2, South Luzon Operations & Maintenance\nNational Grid Corporation of the Philippines (NGCP)\nNational Grid Corporation of the Philippines (NGCP)\nBYRON Q. CAFIRMA\nRENATO A. PENETRANTE\nLine Foreman\nLine Engineer\nDistrict 4, North Luzon Operations & Maintenance\nDistrict 3, Visayas Operations & Maintenance\nNational Grid Corporation of the Philippines (NGCP)\nNational Grid Corporation of the Philippines (NGCP)\nCIRILO M. ARELLANO, JR.\nTHOMAS HENRIE T. OCHEA\nLineman\nLineman\nDistrict 2, North Luzon Operations & Maintenance\nDistrict 2, Visayas Operations & Maintenance\nNational Grid Corporation of the Philippines (NGCP)\nNational Grid Corporation of the Philippines (NGCP)\nJOEL H. SALLE\nWALTER A. BAYRON\nChief Engineer, Transmission Line\nLine Engineer\nDistrict 2, South Luzon Operations & Maintenance\nDistrict 2, Mindanao Operations & Maintenance\nNational Grid Corporation of the Philippines (NGCP)\nNational Grid Corporation of the Philippines (NGCP)\nFRANCISCO A. ZUNIEGA, JR.\nOLIVER N. ISAAC\nLine Foreman\nLine Foreman\nDistrict 3, South Luzon Operations & Maintenance\nDistrict 4, Mindanao Operations & Maintenance\nNational Grid Corporation of the Philippines (NGCP)\nNational Grid Corporation of the Philippines (NGCP)\n\n• THE VALIDATION EXPERT COMMITTEE\n\nMARIO M. DELA CRUZ\nRYCH G. HARDER\nLine Foreman\nLine Foreman\nDistrict 7, North Luzon Operations & Maintenance\nDistrict 4,Visayas Operations & Maintenance\nNational Grid Corporation of the Philippines (NGCP)\nNational Grid Corporation of the Philippines (NGCP)\nROMMEL P. DEL ROSARIO\nLORREMYR B. BARNIDO\nLineman\nLineman\nDistrict 7, North Luzon Operations & Mai