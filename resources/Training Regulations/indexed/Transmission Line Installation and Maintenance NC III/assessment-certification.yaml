      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of the qualification, the candidate must demonstrate in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III signed by the TESDA Director General. 4.1.2. The qualification of Transmission Line Installation and Maintenance NC III may be attained by demonstration of competence through project-type assessment covering Basic, Common and Core Units of Competency. 4.1.3. Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4. Any of the following are qualified to apply for assessment and certification: 4.1.3.1 Graduates of formal training on Transmission Line Installation and Maintenance NC III or related trainings provided by enterprise/s; 4.1.3.2 Individuals who has completed 6 months lineman’s training and apprenticeship program. He/she must have experience working in tasks related to “Emergency Restoration Structure (ERS)”; 4.1.3.3 Holders of Transmission Line Installation and Maintenance NC II with at least 2 years work experience in transmission line installation/ construction and maintenance and he/she must have experience working in tasks related to “Emergency Restoration Structure (ERS); 4.1.3.4 Holders of Electrical Power Distribution Line Construction NC II with at least 3 years of work experience in distribution line installation/ construction and maintenance and he/she must have experience working in tasks related to “Emergency Restoration Structure (ERS)”. 4.1.5. The candidate may opt for portfolio assessment with interview if he/she has at least 4 years of relevant work experience (within the last 6 years) in transmission line installation/construction and maintenance and he/she must have experience working in tasks related to “Emergency Restoration Structure (ERS)”. The candidate must show sufficient evidences on the above requirements in his/her portfolio. Necessary documents to be submitted are: Certificate of Employment (indicating position, nature of work and period), Training Certificate/s (local or international) on transmission line installation/ construction and maintenance and other relevant trainings. 4.1.6. The existing NCs or COCs in Transmission Line Installation and Maintenance NC III are still valid until the said NCs or COCs have expired. Individuals are advised to take the assessment for this amended/updated TR on or before the expiration of such certificates. 4.1.7. The guidelines on assessment and certification are discussed in detail in the \"Operating Procedures on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\"."
