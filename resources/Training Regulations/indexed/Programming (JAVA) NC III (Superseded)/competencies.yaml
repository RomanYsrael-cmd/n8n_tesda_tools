cludes, and generalization\n2.9 Describe how to manage the complexity of Use Case Diagrams by\ncreating UML packaged views Identify and document scenarios for a\nuse case\n2.10 Describe how to reference included and extending use cases\n2.11 Identify and document non-functional requirements (NFRs), business\nrules, risks, and priorities for a use case\n2.12 Identify the purpose of a Supplementary Specification Document\n2.13 Identify the essential elements in an Activity diagram\n\n--- PDF PAGE 36 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated - December 2013\n\n34\n3. Underpinning\nskills\n3.1.\nBasic computer operation skills\n3.2.\nLogic analysis\n3.3.\nCommunication skills\n3.4.\nCode writing and debugging skills\n4. Method of\nassessment\n4.1 The assessor will assess candidate with-\n•\nPortfolio\no Result of Oracle Vendor Examinations\no Sample codes\n•\nInterview\n5.Resource\nimplication\n7.1 Computer with:\n7.1.1. UML tools\n7.1.2. Integrated Development Environment for Java\n7.2 Access to internet\n7.3 Conducive testing environment\n6.Context of\nassessment\nAssessment may take place in an accredited Oracle testing center\n\n--- PDF PAGE 37 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated - December 2013\n\n35\nUNIT OF COMPETENCY: CREATE AND FINE TUNE JAVA TECHNOLOGY\nAPPLICATIONS USING OBJECT-ORIENTED\nPROGRAMMING CONCEPT\n\nUNIT CODE\n : ICT313360\n\nUNIT DESCRIPTION : This unit covers the core Application Programming Interfaces\n(API) used to design object-oriented applications with Java.\nStudents will learn how to write database programs with JDBC.\n\nThis unit also covers performance-tuning methodologies,\nperformance tuning theories and practical tips on solving difficult\nperformance problems for Java applications. It also covers how\nto implement interfaces and handle Java programming\