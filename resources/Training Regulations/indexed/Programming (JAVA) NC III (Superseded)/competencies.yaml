        "source_text": "ICT313360\n\nUNIT DESCRIPTION : This unit covers the core Application Programming Interfaces\n(API) used to design object-oriented applications with Java.\nStudents will learn how to write database programs with JDBC.\n\nThis unit also covers performance-tuning methodologies,\nperformance tuning theories and practical tips on solving difficult\nperformance problems for Java applications. It also covers how\nto implement interfaces and handle Java programming\nexceptions, while using object-oriented programming techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply Basics of\nJava Class Design\n1.1 Access modifiers are used in accordance with Java\nframework\n1.2 Instance of operator and casting are used in accordance\nwith Java framework\n1.3 Virtual method invocation is used in accordance with Java\nframework\n1.4 Override methods from the Object class are used to\nimprove the functionality of class\n1.5 Package and import statements are used in accordance\nwith Java framework\n2. Apply Java\nAdvanced Class\nDesign and Object\nOriented Design\nPrinciples\n\n2.1 Proper use of when and how to apply abstract classes is\nidentified\n2.2 Abstract Java classes and subclasses are constructed in\naccordance with Java framework\n2.3 Static and final keywords are used in accordance with Java\nframework\n2.4 Top-level and nested classes are created in accordance\nwith Java framework\n2.5 Enumerated types are used in accordance with Java\nframework\n2.6 Write code that declares, implements, and/or extends\ninterfaces\n2.7 Object Oriented Design Principles are applied in\naccordance with Java framework\n2.8 Generics and Collections Principles are used in\naccordance with Java framework\n3. Apply String\nProcessing,\nExceptions and\nAssertions\n\n3.1 Search, parse, and build strings are used in accordance\nwith Java framework\n3.2 String formatting is used in accordance with Java framework\n3.3 Throw and throws statements are used in accordance with\nJava framework\n3.4 Try statement with multi-catch is used in accordance with\nJava framework\n\n--- PDF PAGE 38 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated - December 2013\n\n36\n3.5 Autoclose features with a try-with-resources statement are\nused in accordance with Java framework\n3.6 Custom exceptions are created in accordance with Java\nframework\n3.7 Invariants by using assertions are tested in accordance with\nJava framework\n4. Build Database\nApplications with\nJDBC\n4.1 Layout of the JDBC API is defined in accordance with Java\nframework\n4.2 JDBC driver is used to connect to database in accordance\nwith Java framework\n4.3 JDBC RowSetProvider, RowSetFactory, and RowSet\ninterfaces are used in accordance with Java framework\n4.4 PreparedStatement and CallableStatement objects are\ncreated and used\n5. Monitor Operating\nSystem\nPerformance\n\n5.1 Monitoring CPU Usage is demonstrated in accordance with\nJava framework\n5.2 Monitoring Network I/O is demonstrated in accordance with\nJava framework\n5.3 Monitoring Disk I/O is demonstrated in accordance with\nJava framework\n5.4 Monitoring Virtual Memory Usage is Demonstrated in\naccordance with Java framework\n5.5 Monitoring Java Virtual Machine is demonstrated in\naccordance with Java framework\n5.6 Garbage Collection Tuning is demonstrated in accordance\nwith Java framework\n6. Work with\nLanguage Level\nConcerns and\nGarbage\nCollection\n6.1 Garbage Collection Algorithms are created in accordance\nwith Java framework\n6.2 Types of Garbage Collectors are demonstrated in\naccordance with Java framework\n6.3 JVM Ergonomics are demonstrated in accordance with Java\nframework\n6.4 Garbage Collection is tuned in accordance with Java\nframework\n6.5 Correct Garbage Collector is selected in accordance with\nJava framework\n6.6 Garbage Collection Output is interpreted in accordance with\nJava framework\n7. Work with\nPerformance\nTuning at the\nLanguage Level\n\n7.1 Reference Types in Java are demonstrated in accordance\nwith Java framework\n7.2 The use of Finalizers is demonstrated in accordance with\nJava framework\n7.3 String-efficient Java Applications are demonstrated in\naccordance with Java framework\n7.4 Collection Classes are demonstrated in accordance with\nJava framework\n7.5 Threads are used in accordance with Java framework\n7.6 I/O is efficiently used in accordance with Java framework\n\n--- PDF PAGE 39 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated - December 2013\n\n37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Access Modifiers\n• private,\n• protected,\n• public\n2. Object Class\n• (hashCode(),\n• equals(),\n•toString())\n3 Object Oriented\nDesign Principles\n• Choose between interface inheritance and class inheritance\n• Develop code that implements IS-A and/or HAS-A\nrelationships (apply high cohesion and low coupling\nprinciples)\n• Apply object composition principles (including HAS-A\nrelationships)\n• Design a class using the Singleton design pattern\n• Write code to implement the Data Access Object (DAO)\npattern\n• Design and create objects using a Factory, and use factories\nfrom the API\n4. Generics and\nCollections\nPrinciples\n• Use the diamond syntax to create a collection and for type\ninference\n• Analyze the interoperability of collections that use raw types\nand generic types\n• Use wrapper classes, autoboxing and unboxing\n• Create and use List, Set, and Deque implementations\n• Create and use a Map\n• Use java.util.Comparator and java.lang.Comparable\n•Sort and search arrays and lists\n5. Build Strings\n• Scanner\n• StringTokenizer\n• StringBuilder\n• String\n•\nFormatter\n6. Java Virtual\nMachine\n• HotSpot Generational Garbage Collector\n• Monitor the Garbage Collector with Command Line Tools\n• Monitor the Garbage Collector with VisualVM\n• Monitor the JIT Compiler\n•Throughput and Responsiveness\n7. Garbage Collection\nTuning\n• Find Memory Leaks\n• Identify Lock Contention\n• Heap Profiling Anti-patterns\n• Method Profiling Anti-patterns\n• Garbage Collection\n• Generational Garbage Collection\n•GC Performance Metrics\n\n--- PDF PAGE 40 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated - December 2013\n\n38\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\n1.1 Performed multiple operations on database tables,\nincluding creating, reading, updating and deleting using\nJDBC technology\n1.2 Process strings using a variety of regular expressions\nand create high-performing multi-threaded applications\nthat avoid deadlock\n1.3 Implement input/output (I/O) functionality to read from\nand write to data and text files and understand\nadvanced I/O streams\n1.4 Create Java technology applications that leverage the\nobject-oriented features of the Java language, such as\nencapsulation, inheritance, and polymorphism\n1.5 Set up a performance-tuning environment\n1.6 Monitor Java applications\n1.7 Apply rigor to the task of performance tuning\n1.8 Use various tools and mechanisms for monitoring,\nprofiling and tuning Java applications\n2. Underpinning\nKnowledge\n2.1 Knowledge of Java I/O Fundamentals\n• Read and write data from the console\n• Use streams to read and write files\n2.2 Knowledge Java File I/O (NIO.2)\n• Use the Path class to operate on file and directory\npaths\n• Use the Files class to check, delete, copy, or move a\nfile or directory\n• Read and change file and directory attributes\n• Recursively access a directory tree using the\nDirectoryStream and FileVisitor interfaces\n• Find a class using the PathMatcher class\n• Watch a directory for changes by using\nWatcherService\n2.3 Understand fundamentals of Java Virtual Machine\n• Performance Principles\n• Common Performance Problems\n• Performance Methodology\n• Development and Performance\n2.4 Apply basic performance tuning principles to a Java\napplication\n2.5 Profile the performance of a Java Application and tune\nthe performance of a Java application at the language\nlevel\n3. Underpinning Skills\n3.1 Basic computer operation skills\n3.2 Logic analysis\n3.3 Communication skills\n3.4 Code writing and debugging skills\n\n--- PDF PAGE 41 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated - December 2013\n\n39\n4. Method of\nAssessment\nThe assessor will assess candidate with-\n4.1 Portfolio\no Result of Oracle Vendor Examinations\no Sample codes\n4.2 Interview\n5. Resource Implication\n5.1 Computer with:\n•\nUML tools\n•\nIntegrated Development Environment for Java\n5.2 Access to internet\n5.3 Conducive testing environment\n6. Context of\nAssessment\nAssessment may take place in an accredited Oracle testing\ncenter\n\n--- PDF PAGE 42 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated - December 2013\n\n40"
