          "source_text": "1. Plan and prepare for \ntask to be taken \nundertaken \n1.1. Requirements of task are determined in \naccordance with the required output. \n1.2. Appropriate hardware and software are selected \naccording to task assigned and required outcome.  \n1.3. Task is planned to ensure that OH & S guidelines \nand procedures are followed. \n1.4. Client -specific guidelines and procedures are \nfollowed. \n1.5. Required data security guidelines are applied in \naccordance with existing procedures.   \n2. Input data into \ncomputer \n2.1. Data are entered into the computer using \nappropriate program/application in accordance with \ncompany procedures. \n2.2. Accuracy of information is checked and information \nis saved in accordance with standard operating \nprocedures. \n2.3. Inputted data is stored in storage media according \nto requirements. \n2.4. Work is performed within ergonomic guidelines. \n3. Access information \nusing computer \n3.1. Correct program/application is selected based on \njob requirements. \n3.2. Program/application containing the information \nrequired is accessed according to company \nprocedures. \n3.3. Desktop icons are correctly selected, opened and \nclosed for navigation purposes. \n3.4. Keyboard techniques are carried out in line with OH \n& S requirements for safe use of keyboards.\n\n--- PDF PAGE 29 ---\n_________________________________________________________________________________ \nTR – Programming (Java) NC III                                                       Promulgated - December 2013 \n \n \n27\n4. Produce output/ data \nusing computer system\n4.1. Entered data are processed using appropriate \nsoftware commands. \n4.2. Data are printed out as required using computer \nhardware /peripheral devices in accordance with \nstandard operating procedures. \n4.3. Files and data are transferred between compatible \nsystems using computer software, \nhardware/peripheral devices in accordance with \nstandard operating procedures. \n5. Use basic functions of \na www-browser to \nlocate information \n5.1. Information requirements for internet search are \nestablished. \n5.2. Browser is launched. \n5.3. Search engine is loaded. \n5.4. Appropriate search criteria/or URL of site is \nentered. \n5.5. Relevant links are followed to locate required \ninformation. \n5.6. Useful pages are bookmarked or printed as \nrequired. \n6. Maintain computer \nequipment and \nsystems \n6.1. Procedures for ensuring security of data, including \nregular back-ups and virus checks are \nimplemented in accordance with standard \noperating procedures. \n6.2. Basic file maintenance procedures are \nimplemented in line with the standards operating \nprocedures.\n\n--- PDF PAGE 30 ---\n_________________________________________________________________________________ \nTR – Programming (Java) NC III                                                       Promulgated - December 2013 \n \n \n28\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Hardware and \nperipheral devices \n1.1 \nPersonal computers                        \n1.2 \nNetworked systems  \n1.3 \nCommunication equipment \n1.4 \nPrinters \n1.5 \nScanners \n1.6 \nKeyboard \n1.7 \nMouse \n1.8\nVoice/Data logger\n2 Software \nSoftware  includes the following but not limited to: \n2.1 \nWord processing packages \n2.2 \nDatabase packages \n2.3 \nInternet \n2.4 \nSpreadsheets \n2.5\nClient Specific Software\n3 OH & S guidelines \n3.1 \nOHS guidelines \n3.2\nEnterprise procedures\n4 Storage media \nStorage media include the following but not limited to: \n4.1 \nDiskettes \n4.2 \nCDs \n4.3 \nZip disks \n4.4 \nhard disk drives, local and remote \n4.5\nOptical drives\n5 Ergonomic guidelines\n5.1 \nTypes of equipment used \n5.2 \nAppropriate furniture \n5.3 \nSeating posture \n5.4 \nLifting posture \n5.5\nVisual display unit screen brightness\n6 Desktop icons \n6.1 \nIcons include the following but not limited to: \n6.2 \nDirectories/folders \n6.3 \nFiles \n6.4 \nNetwork devices \n6.5 \nRecycle bin \n6.6\nProgram icons\n7 Maintenance \n7.1 \nCreating and managing  more space in the hard disk \nand other peripherals \n7.2 \nReviewing programs \n7.3 \nDeleting unwanted files \n7.4 \nBacking up files \n7.5 \nChecking hard drive for errors \n7.6 \nUsing up to date anti-virus programs \n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 31 ---\n_________________________________________________________________________________ \nTR – Programming (Java) NC III                                                       Promulgated - December 2013 \n \n \n29"
