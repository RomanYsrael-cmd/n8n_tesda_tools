        "source_text": "--- PDF PAGE 32 ---\n_________________________________________________________________________________ \nTR – Programming (Java) NC III                                                       Promulgated - December 2013 \n \n \n30\nCORE COMPETENCIES \nUNIT OF COMPETENCY:  PERFORM OBJECT-ORIENTED ANALYSIS AND \nDESIGN IN JAVA TECHNOLOGY \nUNIT CODE:  \n \nICT313359 \nUNIT DESCRIPTOR:  This unit covers the knowledge, skills and attitude needed to use \nvarious Java programming language constructs to create several \nJava \ntechnology \napplications. \nSpecifically, \nit \nconsist \nof \ncompetencies in applying basics of Java language, working with \nmethods and encapsulation, and working with inheritance and \nhandling exceptions.  \nIt also focuses on effectively using object-oriented technologies \nand the use of software modeling, as applied to a software \ndevelopment process. Students will learn to present one practical \n& complete object-oriented analysis and design (OOAD) \nroadmap, and will get hands-on experience, from requirements \ngathering to system design. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1 Apply Basics of Java \nlanguage  \n \n \n \n1.1 Executable Java applications are created in \naccordance with Java framework \n1.2  Java packages are imported to make them accessible in \nthe code \n1.3  Working with Java Data types is demonstrated in \naccordance with Java framework \n1.4  Using Operators and Decision Constructs is \ndemonstrated in accordance with Java framework \n1.5  Creating and Using Arrays is demonstrated in \naccordance with Java framework \n1.6  Using Loop Constructs is demonstrated in accordance \nwith Java framework \n2 Work with Methods \nand Encapsulation \n2.1  Methods with arguments and return values are created \nin accordance with Java framework \n2.2  Static keywords are applied to methods and fields in \naccordance with Java framework \n2.3  Overloaded method is created in accordance with Java \nframework \n2.4  Access modifiers are applied in accordance with Java \nframework \n2.5  Encapsulation principled are applied to a class in \naccordance with Java framework\n\n--- PDF PAGE 33 ---\n_________________________________________________________________________________ \nTR – Programming (Java) NC III                                                       Promulgated - December 2013 \n \n \n31\n3 Work with Inheritance \nand Handling \nExceptions \n \n \n3.1  Inheritance is implemented in accordance with Java \nframework \n3.2  Code that demonstrates the use of polymorphism is \ndeveloped in accordance with Java framework \n3.3  Super and this syntax  are used to access objects and \nconstructors in accordance with Java framework \n3.4  Abstract classes and interfaces are used in accordance \nwith Java framework \n3.5  How exceptions alter normal program flow are \ndetermined by creating a try-catch block.  \n4. Examine Object-\nOriented Concepts \nand Terminology \n4.1  Important object-oriented (OO) concepts are described \nin accordance with Java framework \n4.2  Fundamental OO terminology are defined in accordance \nwith Java framework \n5. Explain Modeling and \nSoftware \nDevelopment Process \n5.1  Object-Oriented Software Development (OOSD) process \nis explained in accordance with Java framework \n5.2  Benefits of modeling software are explained in \naccordance with Java framework \n5.3  Purpose, activities, and artifacts of the following OOSD \nworkflows (disciplines) are explained\n6. Create Use Case \nDiagrams and Use \nCase Scenarios \n6.1  The need for a Use Case Diagram is justified in \naccordance with Java framework \n6.2  Use Case Diagram for a software system is developed \nbased on the goals of the business owner  \n6.3  Use Case Diagrams is developed based on the goals of \nall the stakeholders  \n6.4  Use Case form is created describing a summary of the \nscenarios in the main and alternate flows \n7. Transition Analysis to \nDesign using \nInteraction Diagrams \n7.1  Purpose and elements of the Design model are \nexplained in accordance with Java framework \n7.2  Essential elements of a UML Communication diagram \nare identified in accordance with Java framework \n7.3  Communication diagram view of the Design model is \ncreated in accordance with Java framework \n7.4  Sequence diagram view of the Design model is created \nin accordance with Java framework \n8. Introduce Architectural \nConcepts and \nArchitecture Tiers \nDiagrams \n8.1  Difference between architecture and design is \ndistinguished in accordance with Java framework  \n8.2  Tiers, layers, and systemic qualities are described in \naccordance with Java framework \n8.3  Architecture workflow is described in accordance with \nJava framework \n8.4  Architecture Tiers are defined in accordance with Java \nframework\n\n--- PDF PAGE 34 ---\n_________________________________________________________________________________ \nTR – Programming (Java) NC III                                                       Promulgated - December 2013 \n \n \n32\nRANGE OF VARIABLES: \n \nVARIABLE \nRANGE \n1.  Executable Java \napplications \n Hello World \n Hello with name \n Hello with name and date \n2. Working with Java \nData Types \n Declare and initialize variables \n Differentiate between object references and primitive \nvariables \n Read and write to object fields \n Explain an object’s lifecycle (creation, dereference, and \ngarbage collection) \n Call methods on objects \n Manipulate data using StringBuilder class and its \nmethods \n Create and manipulate Strings \n3. Using Operators and \nDecision Constructs \n Use Java operators \n Use parenthesis to override operator precedence \n Test equality between strings and other objects using == \nand equals() \n Create and use if-else constructs \n Use a switch statement \n4. Creating and Using \nArrays \n Declare, initialize, and use a one-dimensional array \n Declare, initialize, and use a multi-dimensional array \n Declare and use an ArrayList \n5. Using Loop \nConstructs \n Create and use while loops \n Create and use for loops including the enhanced for \nloop \n Create and use do-while loops \n Compare loop constructs \n Use break and continue \n6. OOSD Workflows \n Requirements Gathering \n Requirements Analysis, \n  Architecture and Design, Implementation  \n\nTesting & Deployment \n7. Defining Architecture \nTiers \n Describe the concepts of the Client and Presentation \ntiers \n Describe the concepts of the Business tier \n Describe the concepts of the Resource and Integration \ntiers \n\nDescribe the concepts of the Solution model\n\n--- PDF PAGE 35 ---\n_________________________________________________________________________________ \nTR – Programming (Java) NC III                                                       Promulgated - December 2013 \n \n \n33\nEVIDENCE GUIDE \n \n1.Critical aspect \nof competency \nAssessment requires evidence that the candidate: \n1.1   Applied Basics of Java language  \n1.2   Worked with Methods and Encapsulation \n1.3   Worked  with Inheritance and Handling Exceptions \n1.4  Use object-oriented technologies and perform object-oriented \nanalysis and design. \n1.5  Follow a software development process using an OO software \nproject. \n1.6  Use the widely adopted graphical modeling language - the \nUnified Modeling Language (UML) version 2.2. \n1.7  Manage complexity of artifacts; describe the problem and \nproposed solution. \n2. Underpinning \nKnowledge \n2.1. Uses of various Java programming language constructs to create \nseveral Java technology applications \no \nDefine the scope of variables  \no \nDefine the structure of a Java class \no \nDifferentiate between default and user-defined constructors \n2.2. Uses of decision and looping constructs and methods to dictate \nprogram flow \n2.3. Basic error handling for your Java technology programs \n2.4. Intermediate Java programming and object-oriented (OO) concepts \nin Java technology programs \no \nDetermine the effect upon object references and primitive \nvalues when they are passed into methods that change the \nvalues \no \nDifferentiate between the type of a reference and the type of \nan object Determine when casting is necessary \n2.5. Java technology and the Java programming language \n2.6. Understanding of  basic object oriented concepts such as \ninheritance, encapsulation, and abstraction \n2.7. Uses and manipulation of object references to write simple error \nhandling code \no \nDifferentiate among checked exceptions, \nRuntimeExceptions, and Error \no \nDescribe what exceptions are used for in Java \no \nInvoke a method that throws an Exception \no \nRecognize common exception classes and categories \n2.8  Recognize and document use case dependencies using UML notation \nfor extends, includes, and generalization  \n2.9  Describe how to manage the complexity of Use Case Diagrams by \ncreating UML packaged views Identify and document scenarios for a \nuse case \n2.10 Describe how to reference included and extending use cases  \n2.11  Identify and document non-functional requirements (NFRs), business \nrules, risks, and priorities for a use case \n2.12  Identify the purpose of a Supplementary Specification Document \n2.13 Identify the essential elements in an Activity diagram\n\n--- PDF PAGE 36 ---\n_________________________________________________________________________________ \nTR – Programming (Java) NC III                                                       Promulgated - December 2013 \n \n \n34\n3. Underpinning  \nskills \n3.1. \nBasic computer operation skills \n3.2. \nLogic analysis \n3.3. \nCommunication skills \n3.4. \nCode writing and debugging skills \n4. Method of \nassessment \n4.1 The assessor will assess candidate with- \n \nPortfolio  \no Result of Oracle Vendor Examinations \no Sample codes \n \nInterview\n5.Resource \nimplication \n7.1 Computer with: \n7.1.1. UML tools \n7.1.2. Integrated Development Environment for Java  \n7.2 Access to internet \n7.3 Conducive testing environment \n6.Context of \nassessment\nAssessment may take place in an accredited Oracle testing center\n",
