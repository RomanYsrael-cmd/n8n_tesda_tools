  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Programming (Java) NC III, the\ncandidate must demonstrate competency in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate level III\nsigned by the TESDA Director General.\n\n4.2\nThe qualification of Programming (Java) NC III may be attained by passing\nthe following exams:\n\n4.2.1.\nCertification Exam 1 - Java SE 7 Programmer I 1Z0-803 which will\nassess the following unit of competencies:\n• Perform object-oriented analysis and design in Java technology\n\n4.2.2.\nCertification Exam 2 – Java SE7 Programmer II – 1Z0 – 804 which\nwill assess the following unit of competencies:\n• Create and fine tune Java technology applications using object-\noriented programming concept\n\nUpon accumulation and submission of Certification Exams 1 and 2, an\nindividual shall be issued the corresponding National Certificate.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.4.2.\nExperienced workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 49 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated - December 2013\n\n47\n"
}
