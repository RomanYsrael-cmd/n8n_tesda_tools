    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: HEAVY EQUIPMENT OPERATION – ON-HIGHWAY DUMP TRUCK\n(RIGID)\nNC Level: NC II\n\nBASIC COMPETENCIES\n\nNominal Training Hours:\n18 Hours (Basic) + 24 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and core\ncompetencies in Construction Sector particularly in Heavy Equipment Operation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\n related documents\n1.3 Participate in workplace\n meeting and discussion\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n1. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret technical\ndrawings and plans\n\n1.1 Read / Interpret\nblueprints and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n2. Observe procedures,\nspecifications and\nmanuals of instructions.\n2.1 Identify and access\n specifications /\ntechnical manuals\n2.2 Interpret technical\n manuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical\nmanual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout\nmeasurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n4. Maintain tools and\nequipment\n4.1 Check condition of\ntools and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and\nequipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare construction\nmaterials and tools\n5.1 Identify materials\n5.2 Request materials\n5.3 Receive and inspect\n materials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n(80 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nOn-highway\nDump Truck\n(Rigid)\n1.1 Identify and\nexplain the\nfunctions of\ncontrols, gauges,\ninstruments,\nsafety devices\nand hydraulic\nimplements\n1.2 Explain the\nimportance of and\nelaborate on\nequipment\ncleaning and\nchecking\nprocedures\n1.3 Perform checking,\nprocedures\nLecture\nPractical\nDemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n2. Perform\nproductive\noperation for On-\nhighway Dump\nTruck (rigid)\n2.1 Identify and explain\nthe importance of\nsafe work\npractices\n2.2 Elaborate loading,\n hauling and\n dumping\n procedures\n2.3 Perform loading\n and hauling\n procedures\n2.4 Perform dumping\n procedures\n2.5 Identify and explain\n possible\n unexpected\n situation during\n productive\n operation\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Perform basic\npreventive\nmaintenance\nservicing for On-\nhighway dump\nTruck (Rigid)\n3.1 Identify and\n explain the use\n of basic hand\n tools and\n consumables\n3.2 Use basic hand\n tools in servicing\n minor defects\n and OS parts\n3.3 Prepare\n equipment report\n3.4 Perform good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION"
