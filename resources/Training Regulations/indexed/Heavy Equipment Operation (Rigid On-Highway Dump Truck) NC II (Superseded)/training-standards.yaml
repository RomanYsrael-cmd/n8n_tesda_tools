emonstration with\noral questioning\n• Written test\n2. Perform\nproductive\noperation for On-\nhighway Dump\nTruck (rigid)\n2.1 Identify and explain\nthe importance of\nsafe work\npractices\n2.2 Elaborate loading,\n hauling and\n dumping\n procedures\n2.3 Perform loading\n and hauling\n procedures\n2.4 Perform dumping\n procedures\n2.5 Identify and explain\n possible\n unexpected\n situation during\n productive\n operation\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Perform basic\npreventive\nmaintenance\nservicing for On-\nhighway dump\nTruck (Rigid)\n3.1 Identify and\n explain the use\n of basic hand\n tools and\n consumables\n3.2 Use basic hand\n tools in servicing\n minor defects\n and OS parts\n3.3 Prepare\n equipment report\n3.4 Perform good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery mo