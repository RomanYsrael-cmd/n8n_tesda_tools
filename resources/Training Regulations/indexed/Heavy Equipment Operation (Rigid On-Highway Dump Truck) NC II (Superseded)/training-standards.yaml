      "source_text": "SECTION 3\nTRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for HEAVY EQUIPMENT OPERATION (RIGID ON-\nHIGHWAY DUMP TRUCK) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HEAVY EQUIPMENT OPERATION – ON-HIGHWAY DUMP TRUCK\n(RIGID)\nNC Level: NC II\n\nBASIC COMPETENCIES\n\nNominal Training Hours:\n18 Hours (Basic) + 24 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and core\ncompetencies in Construction Sector particularly in Heavy Equipment Operation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\n related documents\n1.3 Participate in workplace\n meeting and discussion\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n1. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret technical\ndrawings and plans\n\n1.1 Read / Interpret\nblueprints and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n2. Observe procedures,\nspecifications and\nmanuals of instructions.\n2.1 Identify and access\n specifications /\ntechnical manuals\n2.2 Interpret technical\n manuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical\nmanual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout\nmeasurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n4. Maintain tools and\nequipment\n4.1 Check condition of\ntools and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and\nequipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare construction\nmaterials and tools\n5.1 Identify materials\n5.2 Request materials\n5.3 Receive and inspect\n materials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n(80 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nOn-highway\nDump Truck\n(Rigid)\n1.1 Identify and\nexplain the\nfunctions of\ncontrols, gauges,\ninstruments,\nsafety devices\nand hydraulic\nimplements\n1.2 Explain the\nimportance of and\nelaborate on\nequipment\ncleaning and\nchecking\nprocedures\n1.3 Perform checking,\nprocedures\nLecture\nPractical\nDemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n2. Perform\nproductive\noperation for On-\nhighway Dump\nTruck (rigid)\n2.1 Identify and explain\nthe importance of\nsafe work\npractices\n2.2 Elaborate loading,\n hauling and\n dumping\n procedures\n2.3 Perform loading\n and hauling\n procedures\n2.4 Perform dumping\n procedures\n2.5 Identify and explain\n possible\n unexpected\n situation during\n productive\n operation\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Perform basic\npreventive\nmaintenance\nservicing for On-\nhighway dump\nTruck (Rigid)\n3.1 Identify and\n explain the use\n of basic hand\n tools and\n consumables\n3.2 Use basic hand\n tools in servicing\n minor defects\n and OS parts\n3.3 Prepare\n equipment report\n3.4 Perform good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when\ndesigning training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION\nsame place. Distance learning may employ correspondence study,\nor audio, video or computer technologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience.\nOther requirements like health and physical requirements are also stated.\n\n• Can drive and holder of Professional Drivers license\n\n• Can communicate both oral and written (English or Tagalog)\n\n• Physically and mentally fit\n\n• Can perform basic mathematical computation.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION\nBelow is the recommended list of tools, equipment and materials for the training of\n25 trainees for the operation of on-highway dump truck (rigid).\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2 sets\n• Standard\nmechanical hand\ntools\n2 pcs\n• Two-way radio\n20 liters\n• Engine oil\n SAE-15W-40\n25 pcs.\n• Hard hat\n1 unit\n• Rigid On-\nHighway Dump\nTruck\n1,600\nliters\n• Diesel fuel\n25 pcs.\n• Safety shoes\n\n20 liters\n• Hydraulic oil\n1 unit\n• 10 kg. Fire\nextinguisher\n\n10 liters\n• Trans\ndifferential oil\n25 pcs.\n• Eye goggles\n\n10 kls.\n• Forming\ngrease\n25 pcs.\n•\nCover alls\n\n25 kilos • Waste rags\n\n2 liters\n• Bunk oil\n•DOT - 4\n\n25 pcs.\n• Cotton gloves\n\n*Quantity will depend on actual training consumption\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION\n3.5\nTRAINING FACILITIES\n\nThe on-highway dump truck (rigid) operation workshop must be of concrete\nstructure. Based on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL\nAREA IN\nSQ.\nMETERS\n•\nLecture area\n8.0 x 6.0 meters\n48M2\n1\n48M2\n•\nLearning resource area\n4.0 x 6.0 meters\n24M2\n1\n24M2\n•\nTool room / Storage area\n3.0 x 3.0 meters\n9M2\n1\n9M2\n• Wash, toilet and locker\nroom\n8.0 x 4.0 meters\n32M2\n1\n32M2\nTOTAL\n-\n-\n113M2\nFacilities / Equipment /\nCirculation*\n-\n\n5,000M2\nTOTAL AREA\n5,113M2\nArea requirement is equivalent to 30 percent of total teaching / learning areas\n*Equipment maneuvering area (OPM) (MOA)\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION\n 3.6 TRAINERS’ QUALIFICATION\nHEAVY EQUIPMENT OPERATION (RIGID ON-HIGHWAY DUMP\nTRUCK)\n\n• Must be a holder of Heavy Equipment Operation (On-highway dump\ntruck) NC II\n• Must have undergone training on Training Methodology III (TM III) or its\nequivalent\n• Must be physically and mentally fit\n• Must have at least 5 years job/industry experience*\n• Must be a civil service eligible (for government position only)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION"
