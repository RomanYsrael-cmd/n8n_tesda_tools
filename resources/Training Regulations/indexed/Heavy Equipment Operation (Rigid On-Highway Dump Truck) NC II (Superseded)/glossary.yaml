  "source_text": "For the purpose of this Competency Standard, the words\n\n1. On-highway dump truck\n(rigid)\nRefers to rigid frame type of dump truck used for loading/\nhauling/ transporting construction materials such as\naggregates, sand, soil, etc.\n2. Operator serviceable\n(OS) parts\nRefer to any part of the equipment that can be service by\nthe operator, e.g. air cleaner, fuel filter, battery clamp, fan\nbelt, etc.\n3. Dump box\nPart of the truck where the materials are being loaded.\n4. Site inspection\nRefer to a work activity in determining the actual condition\nof the project site to include location, transport route, site\nterrain, work area, hazards, type of materials, etc.\n5. Daily Equipment Time\nReport (DETR)\nRefers to equipment operating hours or working hours.\n\n6. Retarder brake\nRefers to the control of truck speed to maintain safe\ndownhill operation.\n7. Service brake\nRefers to the control of speed to slowdown and stopping\nof dump truck.\n8. Steering\nRefers to the mechanism that controls the dump truck\ndirection.\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION",
