  "source_text": "Section 1. The successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 The qualification of HEAVY EQUIPMENT OPERATION (Rigid On-Highway Dump\nTruck) NC II maybe attained through demonstration of competence in a project-\ntype assessment covering the following core units.\n\n4.2.1\nRIGID ON-HIGHWAY DUMP TRUCK\n\n\nPerform pre- and post-operation procedures for hauling equipment\n\nPerform productive operation for on-highway dump truck (rigid)\n\nPerform basic preventive maintenance servicing for hauling\nequipment\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System (PTQCS).\"\n\n--- PDF PAGE 71 ---\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION -\nSUB- SECTOR\nBASIC\nInspect\nrigging\ngears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall\nrigging\ngears\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nAssist\ncrane\noperator\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\nPerform\nmensurations and\ncalculations\nObserve procedures,\nspecifications and\nmanual of instructions\nInterpret technical\ndrawings and plans\nMaintain tools and\nequipment\nPrepare construction\nmaterials and tools\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. On-highway dump truck\n(rigid)\nRefers to rigid frame type of dump truck used for loading/\nhauling/ transporting construction materials such as\naggregates, sand, soil, etc.\n2. Operator serviceable\n(OS) parts\nRefer to any part of the equipment that can be service by\nthe operator, e.g. air cleaner, fuel filter, battery clamp, fan\nbelt, etc.\n3. Dump box\nPart of the truck where the materials are being loaded.\n4. Site inspection\nRefer to a work activity in determining the actual condition\nof the project site to include location, transport route, site\nterrain, work area, hazards, type of materials, etc.\n5. Daily Equipment Time\nReport (DETR)\nRefers to equipment operating hours or working hours.\n\n6. Retarder brake\nRefers to the control of truck speed to maintain safe\ndownhill operation.\n7. Service brake\nRefers to the control of speed to slowdown and stopping\nof dump truck.\n8. Steering\nRefers to the mechanism that controls the dump truck\ndirection.\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies and who contributed their\ntime and expertise to the development and validation of this Training\nRegulations.\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nFLORELLO P. QUIANZON\nConsultant, Equipment Concrete Product\nDivision (Equipment Management)\nMakati Development Corporation\nAUGUSTO S. BUYAO\nTraining Manager\nMaxima Equipment Co. Inc.\n\nTITO C. TADIOS\nTraining Manager (Heavy Equipment\nOperation and Maintenance)\nMonark Equipment Co. Inc\n\nRUDOLFO D. ANCHETA\nQuality Controller Supervisor (Repair\nand Maintenance of Hydraulic\nExcavator/Basic Hydraulic)\nCivil Merchanidising Inc.\nWILLY G. CONDE\nDivision Manager\nFF Cruz company\n\nFELIX B. JOVITA\nTrainor / Assessor\nACEL\n\nSAMUEL M. PUQUIZ\nHead, Mechanical and Technical\n(Construction Equipment Repair and\nMaintenance)\nDM Consunji Inc.\nCORNELIO D. PADUA\nHeavy Equipment Supervisor\nMakati Development Corp.\n\nFERNANDO B. SEVA\nTraining Manager\nPPA Management\nMARIO D. CANDOLE\nOperator\nManitowoc Crane Group. Inc.\nNESTOR T. BUTACAN\nTechnical Trainer\nMaxima Equipment Co. Inc.\nEDUARDO C. EMAS\nTrainor\nConstruction Manpower Development\nCenter\n\n--- PDF PAGE 75 ---\nTR HEAVY EQUIPMENT OPERATION\nAUGUST CONSEBIDO\nSales supervisor\nMonark Equipment Co. Inc.\nLITO GARCIA\nTraining Manager\nLivan Trade\nELIAS RODRIGUEZ\nTrainor\nMonark equipment Co. Inc.\nLUCIANO E. POLICARPIO\nSafety Engineer (Construction Safety)\nFoundation Specialists, Inc.\nEUGENIO S. GUTIERREZ\nOperator\nMakati Development Corp.\nWILBERT INCHOCO\nTraining Manager\nMonark Equipment co. Inc.\nRODANTE BAUTISTA\nTraining Manager\nMobile Crane of Asia\nLONG R. NAAMAN JR.\nSales Manager\nMonitowoc Crane Group Inc.\nJOE NELASCA\nOperator\nMonitowoc Crane Group Inc.\nVINCENT L. ORAIS\nOperator\nMakati Development Corp\nMANUELITO S. SEVERINO\nOperator\nMakati Development Corp.\nERIC PEREZ\nSales Manager\nWirtgen Philippines\nALFREDO M. ABELA\nOperator\nMakati Development Corporation\n\nThe Management and Staff of the TESDA Secretariat\n\nQualifications and Standards Office\n\nThe Management and Staff of the ACEL Secretariat"
