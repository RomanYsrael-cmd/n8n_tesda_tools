      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s of competency of a qualification with a promulgated Training Regulations. 4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals who were assessed as competent in a single unit or cluster of related units of competency. COC-1: Fabricate, install and remove of wooden formworks COC-2: Install door and window assembly; install ceiling and wall system; and fabricate and install wooden cabinet • Layout reference lines • Install wooden door jamb, window frame and panels • Install ceiling and wall frames and panels • Fabricate and install wooden cabinet COC-3: Fabricate and install wooden stairs and install floor system and roofing system • Layout reference lines • Fabricate and install wooden stairs • Install wooden floor supports and panels • Fabricate and install wooden roofing system Carpentry NC II Revision 01 Promulgated (10/29/2018) 149 4.1.3 Holders of valid National Certificate (NC) for BOTH Carpentry NC II AND Carpentry NC III will have their certificates automatically converted to the amended Carpentry NC II. 4.1.4 Holders of valid National Certificate (NC) for Carpentry NC II only OR Carpentry NC III only will have their certificates converted to the amended Carpentry NC II provided they present evidence of work experience of at least three (3) years. 4.1.5 Holders of valid Certificate of Competency (COC) under Carpentry NC II are required to undergo assessment for the amended Carpentry NC II. 4.1.6 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency assessment: 4.1.8 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following: a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements as identified by industry Carpentry NC II Revision 01 Promulgated (10/29/2018) 150"
