      "source_text": "SECTION 1 CARPENTRY NC II"
    },
    {
      "source_text": "The CARPENTRY NC II Qualification consists of competencies on rough and finishing carpentry that a person must achieve in fabrication and installation of wooden materials and basic roof assembly."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of Construction – Civil Works sub-sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO."
    },
    {
      "source_text": "BASIC COMPETENCIES 400311210 Participate in workplace communication 400311211 400311212 400311213 400311214 400311215 400311216 400311217"
    },
    {
      "source_text": "400311218 Work in a team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES CON711301 CON711302 CON711303 CON711304 CON711305 CON711306 CON711307 CON711308 Layout reference lines Fabricate, install and remove wooden formworks Install wooden door jamb, window frame and panels Install ceiling and wall frames and panels Fabricate and install wooden stairs Install wooden floor supports and panels Fabricate and install roofing system Fabricate and install wooden cabinet"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a –  Rough and Finishing Carpenter"
    },
