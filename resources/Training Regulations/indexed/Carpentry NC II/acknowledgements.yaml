y\nand job specifications\n1.4 Provided tools with safety devices\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Plans, drawings and specifications relevant to the\nactivities\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with oral\nquestioning\n4. Context of Assessment\n\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 43 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 39\n\nUNIT OF COMPETENCY\n:\n OBSERVE PROCEDURES, SPECIFICATIONS\nAND MANUALS OF INSTRUCTIONS\n\nUNIT CODE\n\n:\nCON311201\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and\nattitudes On identifying, interpreting, applying\nservices to specifications and manuals and\nstoring manuals.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify and access\nspecification/\nmanuals\n\n1.1 Appropriate manuals\nare identified and\naccessed as per job\nrequirements\n1.2 Version and date of\nmanual are checked to\nensure that correct\nspecification and\nprocedures are\nidentified\n1.1 Types of manuals\nused in carpentry\n1.2 Identification of\nsymbols used in\nthe manuals\n\n1.1 Identifying\nmanuals and\nspecifications\n1.2 Accessing\ninformation and\ndata\n\n2. Interpret manuals\n2.1 Relevant sections,\nchapters of\nspecifications/\nmanuals are located in\nrelation to the work to\nbe conducted\n2.2 Information and\nprocedure in the\nmanual are interpreted\nin accordance with\nindustry practices\n\n2.1 Types of manuals\nused in carpentry\n2.2 Types of symbols\nused in manuals\n2.3 System of\nmeasurements\n2.4 Unit conversion\n2.1 Interpreting\nsymbols and\nspecifications\n2.2 Accessing\ninformation and\ndata\n2.3 Applying\nconversion of\nunits of\n