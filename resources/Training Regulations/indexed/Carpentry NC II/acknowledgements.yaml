      "source_text": "3.4 TRAINERS’ QUALIFICATION"
    },
    {
      "source_text": "Holder of National TVET Trainer Certificate Level I (NTTC Level I) in CARPENTRY NC II"
    },
    {
      "source_text": "Must have completed the 40-Hour Construction Safety Training Course (COSH) per Department Order No. 13 s. 1998, Guidelines Governing Occupational Safety and Health in the Construction Industry conducted by OSHC and DOLE accredited Safety Training Organizations"
    },
    {
      "source_text": "Must have at least two (2) years industry experience in Civil Works and one (1) year teaching experience in Carpentry"
    },
    {
      "source_text": "3.5 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional assessment is undertaken by trainees to determine their achievement of units of competency. A certificate of achievement is issued for each unit of Competency."
    },
    {
      "source_text": "-- PDF PAGE 150 --- Carpentry NC II Revision 01 Promulgated (10/29/2018) 148 SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards."
    },
    {
      "source_text": "The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to a full qualification or employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s of competency of a qualification with a promulgated Training Regulations."
    },
    {
      "source_text": "4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals who were assessed as competent in a single unit or cluster of related units of competency."
    },
    {
      "source_text": "COC-1: Fabricate, install and remove of wooden formworks"
    },
    {
      "source_text": "COC-2: Install door and window assembly; install ceiling and wall system; and fabricate and install wooden cabinet"
    },
    {
      "source_text": "Layout reference lines"
    },
    {
      "source_text": "Install wooden door jamb, window frame and panels"
    },
    {
      "source_text": "Install ceiling and wall frames and panels"
    },
    {
      "source_text": "Fabricate and install wooden cabinet"
    },
    {
      "source_text": "COC-3: Fabricate and install wooden stairs and install floor system and roofing system"
    },
    {
      "source_text": "Layout reference lines"
    },
    {
      "source_text": "Fabricate and install wooden stairs"
    },
    {
      "source_text": "Install wooden floor supports and panels"
    },
    {
      "source_text": "Fabricate and install wooden roofing system"
    },
    {
      "source_text": "-- PDF PAGE 151 --- Carpentry NC II Revision 01 Promulgated (10/29/2018) 149"
    },
    {
      "source_text": "4.1.3 Holders of valid National Certificate (NC) for BOTH Carpentry NC II AND Carpentry NC III will have their certificates automatically converted to the amended Carpentry NC II."
    },
    {
      "source_text": "4.1.4 Holders of valid National Certificate (NC) for Carpentry NC II only OR Carpentry NC III only will have their certificates converted to the amended Carpentry NC II provided they present evidence of work experience of at least three (3) years."
    },
    {
      "source_text": "4.1.5 Holders of valid Certificate of Competency (COC) under Carpentry NC II are required to undergo assessment for the amended Carpentry NC II."
    },
    {
      "source_text": "4.1.6 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency."
    },
    {
      "source_text": "4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency assessment:"
    },
    {
      "source_text": "4.1.8 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following:"
    },
    {
      "source_text": "a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements as identified by industry"
    },
    {
      "source_text": "-- PDF PAGE 152 --- Carpentry NC II Revision 01 Promulgated (10/29/2018) 150"
    },
    {
      "source_text": "4.2 Competency Assessment Requisite"
    },
    {
      "source_text": "4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment."
    },
    {
      "source_text": "This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior"
    },
    {
      "source_text": "4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "source_text": "4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    },
