y\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for Assessment\n4.1 Competency may be assessed in the work\nplace or in a simulated work place setting\n\n--- PDF PAGE 34 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 30\n\nUNIT OF\nCOMPETENCY\n\n:\n\nEXERCISE EFFICIENT AND EFFECTIVE\nSUSTAINABLE PRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:\n400311217\n\nUNIT\nDESCRIPTOR\n\n:\nThis unit covers knowledge, skills and attitude to identify\nthe efficiency and effectiveness of resource utilization,\ndetermine causes of inefficiency and/or ineffectiveness of\nresource utilization and Convey inefficient and ineffective\nenvironmental practices\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nefficiency and\neffectiveness\nof resource\nutilization\n\n1.1 Required resource\nutilization in the\nworkplace is measured\nusing appropriate\ntechniques\n1.2 Data are recorded in\naccordance with\nworkplace protocol\n1.3 Recorded data are\ncompared to determine\nthe efficiency and\neffectiveness of resource\nutilization according to\nestablished\nenvironmental work\nprocedures\n1.1. Importance of\nEnvironmental\nLiteracy\n1.2. Environmental\nWork\nProcedures\n1.3. Waste\nMinimization\n1.4. Efficient\nEnergy\nConsumptions\n1.1 Recording Skills\n1.2 Writing Skills\n1.3 Innovation Skills\n\n2. Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n2.1 Potential causes of\ninefficiency and/or\nineffectiveness are listed\n2.2 Causes of inefficiency\nand/or ineffectiveness\nare identified through\ndeductive reasoning\n2.3 Identified causes of\ninefficiency and/or\nineffectiveness are\nvalidated thru\nestablished\nenvironmental\nprocedures\n\n2.1 Causes of\nenvironmental\ninefficiencies\nand\nineffectiveness\n\n2.1 Deductive\nReasoning\nSkills\n2.2 Critical thinking\n2.3 Problem Solving\n2.4 Observation\nSkills\n\n--- PDF PAGE 35 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 31\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Convey\ninefficient and\nineffective\nenvironmental\npractices\n\n3.1 Efficiency and\neffectiveness of\nresource utilization are\nreported to appropriate\npersonnel\n3.2 Concerns related\nresource utilization are\ndiscussed with\nappropriate personnel\n3.3 Feedback on\ninformation/ concerns\nraised are clarified with\nappropriate personnel\n3.1 Appropriate\nPersonnel to\naddress the\nenvironmental\nhazards\n3.2 Environmental\ncorrective\nactions\n3.1 Written and Oral\nCommunication\nSkills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation\nSkills\n3.5 Practice\nEnvironmental\nAwareness\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1 Utilization of Energy, Water, Fuel\nProcedures\n1.2 Waster Segregation Procedures\n1.3 Waste Disposal and Reuse\nProcedures\n1.4 Waste Collection Procedures\n1.5 Usage of Hazardous Materials\nProcedures\n1.6 Chemical Application Procedures\n1.7 Labeling Procedures\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n\n--- PDF PAGE 36 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 32\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nMeasured required resource utilization in the\nworkplace using appropriate techniques\n1.2.\nRecorded data in accordance with workplace protocol\n1.3.\nIdentified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4.\nValidate the identified causes of inefficiency and/