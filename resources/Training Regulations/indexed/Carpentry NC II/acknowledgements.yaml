essment is to confirm that an individual can perform to the standards\nexpected at the workplace as expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered\nto prove achievement of competencies. The process may be applied to a full\nqualification or employable unit(s) of competency in partial fulfillment of the\nrequirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence in all unit/s of competency of a\nqualification with a promulgated Training Regulations.\n\n4.1.2 A Certificate of Competency (CoC) is issued by the Authority to\nindividuals who were assessed as competent in a single unit or\ncluster of related units of competency.\n\nCOC-1: Fabricate, install and remove of wooden formworks\n\nCOC-2: Install door and window assembly; install ceiling\nand wall system; and fabricate and install wooden\ncabinet\n• Layout reference lines\n• Install wooden door jamb, window frame and panels\n• Install ceiling and wall frames and panels\n• Fabricate and install wooden cabinet\n\nCOC-3: Fabricate and install wooden stairs and install floor\nsystem and roofing system\n• Layout reference lines\n• Fabricate and install wooden stairs\n• Install wooden floor supports and panels\n• Fabricate and install wooden roofing system\n\n--- PDF PAGE 151 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 149\n\n4.1.3 Holders of valid National Certificate (NC) for BOTH Carpentry NC\nII AND Carpentry NC III will have their certificates automatically\nconverted to the amended Carpentry NC II.\n\n4.1.4 Holders of valid National Certificate (NC) for Carpentry NC II only\nOR Carpentry NC III only will have their certificates converted to\nthe amended Carpentry NC II provided they present evidence of\nwork experience of at least three (3) years.\n\n4.1.5 Holders of valid Certificate of Competency (COC) under\nCarpentry NC II are required to undergo assessment for the\namended Carpentry NC II.\n\n4.1.6 Individuals wanting to be certified will have to be assessed in\naccordance with the requirements identified in the evidence guide\nof the relevant unit/s of competency.\n\n4.1.7 Recognition of Prior Learning (RPL). Candidates who have\ngained competencies through informal training, previous work or\nlife experiences may apply for recognition in a particular\nqualification through competency assessment:\n\n4.1.8 The industry shall determine assessment and certification\nrequirements for each qualification with promulgated Training\nRegulations: It includes the following:\n\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as\nidentified by industry\n\n--- PDF PAGE 152 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 150\n\n4.2\nCompetency Assessment Requisite\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the\ncandidate and the assessor determine what evidence is\navailable,\nwhere\ngaps\nexist,\nincluding\nreadiness\nfor\nassessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by\nTESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited\nCompetency\nAssessor.\nOnly\naccredited\ncompetency assessor is authorized to conduct assessment of\ncompetence. Competency assessors undergo a quality assured\nsystem of accreditation procedure before they are authorized\nby TESDA to assess the competencies of candidates for\nNational Certification.\n\n--- PDF PAGE 153 ---\nCarpentry NC II Revision 01 Promulgated (10/29/18)\n151\n\n ANNEX A\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand procedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in Team\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\n\nCOMPETENCY MAP - CONSTRUCTION SECTOR\n(Civil Works)\n CARPENTRY NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 154 ---\nCarpentry NC II Revision 01 Promulgated (10/29/18)\n152\n\nUtilize\nspecialize\nspecialized\ncommunicati\non skill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneu\nrial skills\nManage and\nsustain\neffective\ncommunicati\non strategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop\nand sustain\na high-\nperforming\nenterprise\n\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual\nof\ninstructions\n\nPerform\nmensurations\nand\ncalculations\n\nMaintain\ntools and\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 155 ---\nCarpentry NC II Revision 01 Promulgated (10/29/18)\n153\n\nPrepare masonry\nmaterials\n\nPerform masonry tools and\nequipment\n\nPerform basic masonry\nworks\n\nLay concrete hollow block\nfor structure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-finish\nfloor concreting\nRectify non-conforming\nconcrete and masonry\nsurfaces\nLay tiles on plain and\ncurved surfaces for walls,\nfloors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference\nlines\n\nFabricate, install and\nremove wooden\nformworks\n\nInstall wooden door jamb,\nwindow frame and panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall and/or\ncladding frames and\nboards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\nPrepare pipefitting\nmaterials, tools and\nequipment for spool pipe\nconnection\nInstall above ground piping\nsystem\n\nInstall overhead piping\nsystem\nInstall underground\npiping system\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and other\napplication\nRepair of tiles on plain and\ncurved surfaces\n\nCORE COMPETENCIES\n\n--- PDF PAGE 156 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n154\n\nGLOSSARY OF TERMS\n\n1.\nScaffold\nIs a temporary structure of poles and planks\nproviding platform for workers to stand on while\nerecting or repairing a structure\n\n2.\nOffset line\na line or point placed at a given distance from a\ncontrol line or point used to re-establish the original\nlocation.\n\n3.\nLine and grade/Surveyor\nProfessionals who determines and/or established\nboundary lines and/or elevations of building walls,\nfoundations, utilities, etc.\n\n4.\nReference line\nA series of two or more points or line to serve as\nreference for measurement\n\n5.\nSheating\nA layer of boards nailed to a stud or stiffeners to\nform a form panel\n\n6.\nStiffeners\nAre lumber connected to a stud where sheathings\nare to be fastened to\n\n7.\nForm panels and\ncomponents\nAre temporary boarding, sheathing or pan and form\naccessories used to produce the desired shape\nand size of concrete\n\n8.\nDoor jamb\nIs the vertical portion of the door frame onto which\na door is secured, normally comes in set including\nheader\n\n9.\nDoor panels\nA hinged or sliding rectangular panel secured to a\ndoor jamb for opening and closing the entrance to\na room and/or building\n\n10. Window frames\nBasic components are jambs, headers and sills.\n\n11. Window panels\nEither wood, glass or other materials framed and\nsecured to a window frames\n\n12. Ceiling elevation\nIs the final height of the ceiling measured from the\nfloor\n\n13. Ceiling Joist\nThe structural member in building construction\nwhere the ceiling board is fastened\n\n14. Wall location\nExact location where walls will be constructed\n\n--- PDF PAGE 157 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n155\n\n15. Position of framing system Are the exact location of wall studs and\nnoggins/braces as determined during layout\n16. Steps elevation\nExact layout/position of the stair tread, riser and\nlanding\n\n17. Wooden stringer\nThe inclined member supporting the treads and the\nrisers of the stair\n\n18. Wooden tread\nThe horizontal part of a step\n\n19. Wooden handrails\nA rail running parallel with the inclination of the\nstairs that holds the balusters\n\n20. Wooden baluster\nSmall posts supporting the handrail\n\n21. Floor elevation\nExact location of the finished flooring measured\nfrom an established reference line\n\n22. Wooden floor supports\nAre wooden girders or stringers carrying the floor\njoists\n\n23. Wooden floor joist\nIs the structural member of a building that supports\nthe wood flooring\n\n24. Wooden floor panels\nAre wood boards used for flooring\n\n25. Truss location\nExact location where truss assembly will be\npositioned as determined on plan\n\n26. Truss elevation\nexact height of the truss measured from the floor\nline to the bottom of the chord\n27. Wooden roof truss\nassembly\nComprises the girts, bottom chord, rafters, collar\nplate, center post, strut and block\n\n28. Wooden purlins\nIs a structural member of a roof framing system\nwhere the roofing sheets are fastened\n\n29. Roofing sheets and\naccessories\nAre different types of roof coverings including ridge\nrolls, gutters, flashings, etc.\n\n30. Wooden cabinet\na box-shaped piece of furniture with doors and/or\ndrawers for storing miscellaneous items. Some\ncabinets stand-alone while others are built in to a\nwall or are attached to it\n\n31. Rough Lumber\nUnplaned or undressed lumber\n\n32. S2S and S4S\n\nA lumber wherein the number connotes the\nsmoothed/planed sides\n\n--- PDF PAGE 158 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n156\n\n33. 5S\nThe five in a 5S workplace organizational and\nhousekeeping methodology refers to five steps –\nsort, set in order, shine, standardize and sustain.\n\n34. 3R\nThe principle of reducing waste, reusing and\nrecycling resources and products\n\n Reduce\nThe waste management concept of reducing what\nis produced and what is consumed\n\n Reuse\n\nThe waste management concept of reusing items,\nor re-purposing them for a use different than what\nthey are intended for\n\n Recycling\n\nThe waste management concept of transforming\nagain into a raw material that can be shaped into a\nnew item\n\n--- PDF PAGE 159 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n157\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nCARPENTRY NC II\nQualification Code: CONCAR218\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nCarpentry NC II\n2005-03 / 03/18/05\nN/A\n\n01\nDocument Amended\nCarpentry NC II\n2005-03 / 03/18/05\n2018-35 / 10/29/18\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 160 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n158\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNI