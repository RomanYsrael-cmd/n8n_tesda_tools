      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. Scaffold Is a temporary structure of poles and planks providing platform for workers to stand on while erecting or repairing a structure"
    },
    {
      "source_text": "2. Offset line a line or point placed at a given distance from a control line or point used to re-establish the original location."
    },
    {
      "source_text": "3. Line and grade/Surveyor Professionals who determines and/or established boundary lines and/or elevations of building walls, foundations, utilities, etc."
    },
    {
      "source_text": "4. Reference line A series of two or more points or line to serve as reference for measurement"
    },
    {
      "source_text": "5. Sheating A layer of boards nailed to a stud or stiffeners to form a form panel"
    },
    {
      "source_text": "6. Stiffeners Are lumber connected to a stud where sheathings are to be fastened to"
    },
    {
      "source_text": "7. Form panels and components Are temporary boarding, sheathing or pan and form accessories used to produce the desired shape and size of concrete"
    },
    {
      "source_text": "8. Door jamb Is the vertical portion of the door frame onto which a door is secured, normally comes in set including header"
    },
    {
      "source_text": "9. Door panels A hinged or sliding rectangular panel secured to a door jamb for opening and closing the entrance to a room and/or building"
    },
    {
      "source_text": "10. Window frames Basic components are jambs, headers and sills."
    },
    {
      "source_text": "11. Window panels Either wood, glass or other materials framed and secured to a window frames"
    },
    {
      "source_text": "12. Ceiling elevation Is the final height of the ceiling measured from the floor"
    },
    {
      "source_text": "13. Ceiling Joist The structural member in building construction where the ceiling board is fastened"
    },
    {
      "source_text": "14. Wall location Exact location where walls will be constructed"
    },
    {
      "source_text": "-- PDF PAGE 157 --- Carpentry NC II Revision 01 Promulgated (10/29/2018) 155"
    },
    {
      "source_text": "15. Position of framing system Are the exact location of wall studs and noggins/braces as determined during layout 16. Steps elevation Exact layout/position of the stair tread, riser and landing"
    },
    {
      "source_text": "17. Wooden stringer The inclined member supporting the treads and the risers of the stair"
    },
    {
      "source_text": "18. Wooden tread The horizontal part of a step"
    },
    {
      "source_text": "19. Wooden handrails A rail running parallel with the inclination of the stairs that holds the balusters"
    },
    {
      "source_text": "20. Wooden baluster Small posts supporting the handrail"
    },
    {
      "source_text": "21. Floor elevation Exact location of the finished flooring measured from an established reference line"
    },
    {
      "source_text": "22. Wooden floor supports Are wooden girders or stringers carrying the floor joists"
    },
    {
      "source_text": "23. Wooden floor joist Is the structural member of a building that supports the wood flooring"
    },
    {
      "source_text": "24. Wooden floor panels Are wood boards used for flooring"
    },
    {
      "source_text": "25. Truss location Exact location where truss assembly will be positioned as determined on plan"
    },
    {
      "source_text": "26. Truss elevation exact height of the truss measured from the floor line to the bottom of the chord 27. Wooden roof truss assembly Comprises the girts, bottom chord, rafters, collar plate, center post, strut and block"
    },
    {
      "source_text": "28. Wooden purlins Is a structural member of a roof framing system where the roofing sheets are fastened"
    },
    {
      "source_text": "29. Roofing sheets and accessories Are different types of roof coverings including ridge rolls, gutters, flashings, etc."
    },
    {
      "source_text": "30. Wooden cabinet a box-shaped piece of furniture with doors and/or drawers for storing miscellaneous items. Some cabinets stand-alone while others are built in to a wall or are attached to it"
    },
    {
      "source_text": "31. Rough Lumber Unplaned or undressed lumber"
    },
    {
      "source_text": "32. S2S and S4S"
    },
    {
      "source_text": "A lumber wherein the number connotes the smoothed/planed sides"
    },
    {
      "source_text": "-- PDF PAGE 158 --- Carpentry NC II Revision 01 Promulgated (10/29/2018) 156"
    },
    {
      "source_text": "33. 5S The five in a 5S workplace organizational and housekeeping methodology refers to five steps – sort, set in order, shine, standardize and sustain."
    },
    {
      "source_text": "34. 3R The principle of reducing waste, reusing and recycling resources and products"
    },
    {
      "source_text": "Reduce The waste management concept of reducing what is produced and what is consumed"
    },
    {
      "source_text": "Reuse"
    },
    {
      "source_text": "The waste management concept of reusing items, or re-purposing them for a use different than what they are intended for"
    },
    {
      "source_text": "Recycling"
    },
    {
      "source_text": "The waste management concept of transforming again into a raw material that can be shaped into a new item"
    },
    {
      "source_text": "-- PDF PAGE 159 --- Carpentry NC II Revision 01 Promulgated (10/29/2018) 157"
    },
