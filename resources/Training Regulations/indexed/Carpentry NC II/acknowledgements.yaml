ifications\n2.6 Tools are inspected,\nrepaired and replaced\nafter use\n2.7 Work place is cleaned\nand kept in safe state\nin line with\nOccupational Safety\nand Health (OSHS)\n\n2.1 Use of PPE\n2.2 Handling of tools\nand equipment\n2.3 Good\nhousekeeping\n2.4 Types and uses\nof lubricants\n2.5 Types and uses\nof cleaning\nmaterials\n2.6 Methods and\ntechniques\n2.7 Procedures\n\n2.1 Handling of tools\nand equipment\n2.2 Performing\npreventive\nmaintenance\n\n--- PDF PAGE 52 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 48\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Store tools and\nequipment\n\n2.3 Inventory of tools,\ninstruments and\nequipment are\nconducted and\nrecorded as per\ncompany practices\n2.4 Tools and equipment\nare stored safely in\nappropriate locations\nin accordance with\nmanufacturer's\nspecifications or\ncompany procedures\n\n3.1 Use of PPE\n3.2 Handling of tools\nand equipment\n3.3 Storing\nprocedures and\ntechniques\n3.4 Storage\nconditions/\nlocations\n\n3.1 Storing tools and\nequipment\n3.2 Handling of tools\nand equipment\n\n--- PDF PAGE 53 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw\nBoring tools - brace, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n3. Personal Protective\nEquipment (PPE)\nMay include:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Reflectorized Vest\n\n--- PDF PAGE 54 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 50\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OSHA regulations\n1.8 Stored tools and equipment safely in appropriate locations\nand in accordance with company practices\n2. Resource implications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Maintenance schedule\n2.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 51\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nLAY OUT REFERENCE LINES\n\nUNIT CODE\n\n:\nCON711301\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and\nattitude for establishing reference lines in\npreparation for layout.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare materials\nand tools\n\n1.1 Personal protective\nequipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n1.2 List of materials and\ntools are secured and\nfollowed according to\njob requirements\n1.3 Materials and tools\nare selected, inspected\nand prepared consistent\nwith job requirements.\n1.4 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n