  "source_text": "ACKNOWLEDGEMENTS\n 154-156\n\n157\n\n 158-159\n\n--- PDF PAGE 5 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n1\n\nTRAINING REGULATIONS FOR\n\nCARPENTRY NC II\n\nSECTION 1 CARPENTRY NC II\n\nThe CARPENTRY NC II Qualification consists of competencies on rough\nand finishing carpentry that a person must achieve in fabrication and installation of\nwooden materials and basic roof assembly.\n\nThis Qualification is packaged from the competency map of Construction –\nCivil Works sub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the\nworkplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON711301\nCON711302\nCON711303\nCON711304\nCON711305\nCON711306\nCON711307\nCON711308\nLayout reference lines\nFabricate, install and remove wooden formworks\nInstall wooden door jamb, window frame and panels\nInstall ceiling and wall frames and panels\nFabricate and install wooden stairs\nInstall wooden floor supports and panels\nFabricate and install roofing system\nFabricate and install wooden cabinet\n\nA person who has achieved this Qualification is competent to be a –\n Rough and Finishing Carpenter\n\n--- PDF PAGE 6 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 2\n\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in\nCARPENTRY NC II. These units of competency are categorized into basic, common and core\ncompetencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311210\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information\nin response to workplace requirements.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and\nrelevant\ninformation is\naccessed from\nappropriate\nsources\n1.2 Effective\nquestioning,\nactive listening\nand speaking\nskills are used to\ngather and convey\ninformation\n1.3 Appropriate\nmedium is used\nto transfer\ninformation and\nideas\n1.4 Appropriate non-\nverbal\ncommunication is\nused\n1.5 Appropriate lines\nof communication\nwith supervisors\nand colleagues\nare identified and\nfollowed\n\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/ Interacting\nwith people of\nvarious levels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n\n--- PDF PAGE 7 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n1.6 Defined\nworkplace\n procedures for the\nlocation and\nstorage of\ninformation are\nused\n1.7 Personal\ninteraction is\ncarried out clearly\nand concisely\n\n1.9 Interpersonal skills\nin the workplace\n1.10 Active-listening\nskills\n\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices\nand instructions\nare read and\ninterpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are\nfollowed based on\nestablished\nprocedures\n2.3 Feedback is given\nto workplace\nsupervisor based\ninstructions/\ninformation\nreceived\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters concerning\nconditions of\nemployment are\nsought and asked\nfrom appropriate\n sources\n2.6 Meetings\noutcomes are\ninterpreted and\nimplemented\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace meetings\nand discussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Basic\nquestioning/querying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n\n--- PDF PAGE 8 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Complete\nrelevant\nwork-\nrelated\ndocuments\n3.1 Range of forms\nrelating to\nconditions of\nemployment are\ncompleted\naccurately and\nlegibly\n3.2 Workplace data is\nrecorded on\nstandard\nworkplace forms\nand documents\n3.3 Errors in recording\ninformation on\nforms/ documents\nare identified and\nacted upon\n3.4 Reporting\nrequirements to\nsupervisor are\ncompleted\naccording to\norganizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n\n3.1 Completing work-\nrelated documents\n3.2 Applying operations\nof addition,\nsubtraction, division\nand multiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 9 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 5\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Appropriate\nsources\nMay include:\n1.1.\nTeam members\n1.2.\nSupervisor/Department Head\n1.3.\nSuppliers\n1.4.\nTrade personnel\n1.5.\nLocal government\n1.6.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation dissemination\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace-to-face communication\n2.7.\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace\ninteractions\nMay include:\n4.1.\nFace-to-face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic means, memos,\ninstruction and forms\n4.5.\nNon-verbal including gestures, signals, signs\nand diagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message\nforms, safety reports\n\n--- PDF PAGE 10 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using workplace communication\nequipment/systems\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Notebook\n2.4. Writing materials\n2.5. Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Interview\n3.3. Written test\n3.4. Third-party report\n\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the\nactual workplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 7\n\nUNIT OF COMPETENCY:\nWORK IN A TEAM ENVIRONMENT\n\nUNIT CODE : 400311211\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to\n\nidentify one’s roles and responsibilities as a member of a\n\nteam.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and objective\nof the team is identified\nfrom available sources\nof information\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n\n1.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles and\nresponsibilities within\nthe team environment\nare identified\n2.2 Roles and objectives of\nthe team is identified\nfrom available sources\nof information\n2.3 Team parameters,\nreporting relationships\nand responsibilities are\nidentified based on\nteam discussions and\nappropriate external\nsources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n--- PDF PAGE 12 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 8\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Work as a\nteam\nmember\n3.1 Effective and\nappropriate forms of\ncommunications are\nused and interactions\nundertaken with team\nmembers based on\ncompany practices.\n3.2 Effective and\nappropriate\ncontributions made to\ncomplement team\nactivities and\nobjectives, based on\nworkplace context\n3.3 Protocols in reporting\nare observed based\non standard company\npractices.\n3.4 Contribute to the\ndevelopment of team\nwork plans based on\nan understanding of\nteam’s role and\nobjectives\n\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning\nand\n decision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace\ncontext\n\n3.1 Communicating\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and\nas a group\nusing group\nthink strategies\nand techniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\nMay include:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 14 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 10\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nRole play involving the participation of individual\nmember to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.4 Socio-drama and socio-metric methods\n3.5 Sensitivity techniques\n3.6 Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 11\nUNIT OF COMPETENCY :\nSOLVE/ADDRESS GENERAL WORKPLACE\nPROBLEMS\n\nUNIT CODE : 400311212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to apply problem-solving techniques to\ndetermine the origin of problems and plan for their\nresolution. It also includes addressing procedural\nproblems through documentation, and referral.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems\nor procedural\nproblem areas\nare identified\n1.2 Problems to be\ninvestigated are\ndefined and\ndetermined\n1.3 Current conditions\nof the problem are\nidentified and\ndocumented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk practices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying\ncurrent industry\nhardware and\nsoftware products\nand services\n1.2 Identifying\ncurrent industry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n\n--- PDF PAGE 16 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential\nsolutions to\nproblem are\nidentified\n2.2 Recommendatio\nns about\npossible\nsolutions are\ndeveloped,\ndocumented,\nranked and\npresented to\nappropriate\nperson for\ndecision\n2.1 Current industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating\nsystems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating system\n2.4 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation\nof solutions are\nplanned\n3.2 Evaluation of\nimplemented\nsolutions are\nplanned\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to\nappropriate\nperson for\nconfirmation\n\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat recommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 17 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and\nincidents\n1.5\n Work-related problems outside of own work\narea\n\n2. Appropriate person\nMay include:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 18 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 14\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends solutions\nto problems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n\n2. Resource\nImplications\n2.1. Assessment will require access to a workplace over\nan extended period, or a suitable method of gathering\nevidence of operating ability over a range of\nsituations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nCase Formulation\n3.2\nLife Narrative Inquiry\n3.3\nStandardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over a\nrange of situations, which will include disruptions to normal,\nsmooth operation. Simulation may be required to allow for\ntimely assessment of parts of this unit of competency.\nSimulation should be based on the actual workplace and\nwill include walk through of the relevant competency\ncomponents.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 19 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 15\nUNIT OF COMPETENCY :\nDEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n : 400311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes\nin managing one’s emotions, developing reflective\npractice,\nand\nboosting\nself-confidence\nand\ndeveloping self-regulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the\nface of setbacks and\nfrustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined\n\n1.1 Self-\nmanagement\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling\nnegative\nemotions and\nunpleasant\nsituation in the\nworkplace\nsuch as\nfrustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n--- PDF PAGE 20 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 16\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Develop\nreflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\nassessment\nstrategies and\nteacher feedback are\ncontemplated\n2.2 Progress when\nseeking and\nresponding to\nfeedback from\nteachers to assist\nthem in consolidating\nstrengths, addressing\nweaknesses and\nfulfilling their potential\nare monitored\n2.3 Outcomes of\npersonal and\nacademic challenges\nby reflecting on\nprevious problem\nsolving and decision\nmaking strategies\nand feedback from\npeers and teachers\nare predicted\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’\nReflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\nConclusion,\nand Action\nplan)\n2.1 Using the basic\nSWOT analysis\nas self-\nassessment\nstrategy\n2.2 Developing\nreflective practice\nthrough\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able to\naccept\nchallenges\n\n3. Boost self-\nconfidence and\ndevelop self-\nregulation\n3.1 Efforts for continuous\nself-improvement are\ndemonstrated\n3.2 Counter-productive\ntendencies at work\nare eliminated\n3.3 Positive outlook in life\nare maintained.\n3.1 Four\ncomponents of\nself-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g.,\n7 Habits by\nStephen Covey,\ntransactional\nanalysis,\npsycho-spiritual\nconcepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting, conversing\nskills\n\n3.2 Showing affective\nskills – flexibility,\nadaptability, etc.\n\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 21 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 17\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-\nmanagement\nstrategies\nMay include:\n1.1\nSeeking assistance in the form of job coaching or mentoring\n1.2\nContinuing dialogue to tackle workplace grievances\n1.3\nCollective negotiation/bargaining for better working\nconditions\n1.4\nShare your goals to improve with a trusted co-worker or\nsupervisor\n1.5\nMake a negativity log of every instance when you catch\nyourself complaining to others\n1.6\nMake lists and schedules for necessary activities\n2. Unpleasant\nsituation\nMay include:\n2.1\nJob burn-out\n2.2\nDrug dependence\n2.3\nSulking\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-\ndiscipline\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to workplace and resource s\n2.2. Case studies\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration or simulation with oral questioning\n3.2. Case problems involving work improvement and\nsustainability issues\n3.3. Third-party report\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n\n--- PDF PAGE 22 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 18\nUNIT OF COMPETENCY\n:\nCONTRIBUTE TO WORKPLACE INNOVATION\n\n UNIT CODE :\n400311214\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\n\nAttitudes required to make a pro-active and\n\npositive contribution to workplace innovation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nopportunities\nto do things\nbetter\n1.1 Opportunities for\nimprovement are\nidentified\nproactively in own\narea of work.\n1.2 Information are\ngathered and\nreviewed which\nmay be relevant to\nideas and which\nmight assist in\ngaining support for\nidea.\n1.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n1.2 Positive impacts\nand challenges in\ninnovation.\n1.3 Types of changes\nand responsibility.\n1.4 Seven habits of\nhighly effective\npeople.\n\n1.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n1.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n1.3 Identifying\nexamples of the\ntypes of changes\nthat are within and\noutside own scope\nof responsibility\n2. Discuss\nand\ndevelop\nideas with\nothers\n2.1 People who could\nprovide input to\nideas for\nimprovements are\nidentified.\n2.2 Ways of\napproaching\npeople to begin\nsharing ideas are\nselected.\n2.3 Meeting is set with\nrelevant people.\n2.4 Ideas for follow up\nare review and\nselected based on\nfeedback.\n2.5 Critical inquiry\nmethod is used to\ndiscuss and\ndevelop ideas with\nothers.\n2.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n2.2 Positive impacts\nand challenges in\ninnovation.\n2.3 Types of changes\nand responsibility.\n2.4 Seven habits of\nhighly effective\npeople.\n\n2.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n2.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n2.3 Providing examples\nof the types of\nchanges that are\nwithin and outside\nown scope of\nresponsibility\n2.4 Communicating\nideas for change\nthrough small\ngroup discussions\nand meetings.\n\n--- PDF PAGE 23 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 19\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Integrate\nideas for\nchange in\nthe\nworkplace\n3.1 Critical inquiry\nmethod is used to\nintegrate different\nideas for change\nof key people.\n3.2 Summarizing,\nanalyzing and\ngeneralizing skills\nare used to extract\nsalient points in\nthe pool of ideas.\n3.3 Reporting skills\nare likewise used\nto communicate\nresults.\n3.4 Current Issues\nand concerns on\nthe systems,\nprocesses and\nprocedures, as\nwell as the need\nfor simple\ninnovative\npractices are\nidentified.\n3.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n3.2 Positive impacts\nand challenges in\ninnovation.\n3.3 Types of changes\nand responsibility.\n3.4 Seven habits of\nhighly effective\npeople.\n3.5 Basic research\nskills.\n3.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n3.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n3.3 Providing examples\nof the types of\nchanges that are\nwithin and outside\nown scope of\nresponsibility.\n3.4 Communicating\nideas for change\nthrough small\ngroup discussions\nand meetings.\n3.5 Demonstrating\nskills in analysis\nand interpretation\nof data.\n\n--- PDF PAGE 24 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 20\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Opportunities for\nimprovement\nMay include:\n1.1 Systems.\n1.2 Processes.\n1.3 Procedures.\n1.4 Protocols.\n1.5 Codes.\n1.6 Practices.\n2. Information\nMay include:\n2.1 Workplace communication problems.\n2.2 Performance evaluation results.\n2.3 Team dynamics issues and concerns.\n2.4 Challenges on return of investment\n2.5 New tools, processes and procedures.\n2.6 New people in the organization.\n3. People who could provide\ninput\nMay include:\n3.1 Leaders.\n3.2 Managers.\n3.3 Specialists.\n3.4 Associates.\n3.5 Researchers.\n3.6 Supervisors.\n3.7 Staff.\n3.8 Consultants (external)\n3.9 People outside the organization in the\nsame field or similar expertise/industry.\n3.10 Clients\n4. Critical inquiry method\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See\nour pages: Verbal Communication and\nEffective Speaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key\npart of effective negotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 25 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 21\n5. Reporting skills\nMay include:\n5.1\nData management.\n5.2\nCoding.\n5.3\nData analysis and interpretation.\n5.4\nCoherent writing.\n5.5\nSpeaking.\n\n--- PDF PAGE 26 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 22\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified opportunities to do things better.\n1.2\nDiscussed and developed ideas with others on\nhow to contribute to workplace innovation.\n1.3\nIntegrated ideas for change in the workplace.\n1.4\nAnalyzed and reported rooms for innovation\nand learning in the workplace.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nPsychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party\nworkplace reports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character\nstrengths and virtues applied.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in\nthe actual workplace or simulation environment\nin TESDA accredited institutions.\n\n--- PDF PAGE 27 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 23\nUNIT OF COMPETENCY : PRESENT RELEVANT INFORMATION\n\n UNIT CODE : 400311215\n\nUNIT DESCRIPTOR\n : This unit of covers the knowledge, skills and\n\nattitudes required to present data/information\n\nappropriately.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Gather\ndata/\ninformation\n1.1 Evidence, facts\nand information\nare collected\n1.2 Evaluation, terms\nof reference and\nconditions are\nreviewed to\ndetermine\nwhether\ndata/information\nfalls within\nproject scope\n\n1.1 Organisational\nprotocols\n1.2 Confidentiality\n1.3 Accuracy\n1.4 Business\nmathematics and\nstatistics\n1.5 Data analysis\ntechniques/proced\nures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n1.8 Organisational\nvalues, ethics and\ncodes of conduct\n\n1.1 Describing\norganisational\nprotocols relating\nto client liaison\n1.2 Protecting\nconfidentiality\n1.3 Describing\naccuracy\n1.4 Computing\nbusiness\nmathematics and\nstatistics\n1.5 Describing data\nanalysis\ntechniques/\nprocedures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Stating legislation,\npolicy and\nprocedures relating\nto the conduct of\nevaluations\n1.8 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n2. Assess\ngathered\ndata/\ninformation\n2.1 Validity of data/\ninformation is\nassessed\n2.2 Analysis\ntechniques are\napplied to assess\ndata/ information.\n2.3 Trends and\nanomalies are\nidentified\n2.4 Data analysis\n2.1 Business\nmathematics and\nstatistics\n2.2 Data analysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Legislation, policy\nand procedures\n2.1 Computing\nbusiness\nmathematics and\nstatistics\n2.2 Describing data\nanalysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of\n\n--- PDF PAGE 28 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 24\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\ntechniques and\nprocedures are\ndocumented\n2.5 Recommendation\ns are made on\nareas of possible\nimprovement.\n\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\nvalues, ethics and\ncodes of conduct\naudiences\n2.4 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n2.5 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n\n3. Record and\npresent\ninformation\n3.1 Studied\ndata/information\nare recorded.\n3.2 Recommendation\ns are analysed for\naction to ensure\nthey are\ncompatible with\nthe project’s\nscope and terms\nof reference.\n3.3 Interim and final\nreports are\nanalysed and\noutcomes are\ncompared to the\ncriteria\nestablished at the\noutset.\n3.4 Findings are\npresented to\nstakeholders.\n\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n3.4 Organisational\nvalues, ethics and\ncodes of conduct\n\n3.1 Describing data\nanalysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of\naudiences\n3.3 Stating legislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n3.4 Stating\norganisational\nvalues, ethics and\ncodes of conduct\npractices\n\n--- PDF PAGE 29 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 25\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Data analysis techniques\nMay include:\n1.1. Domain analysis\n1.2. Content analysis\n1.3. Comparison technique\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studied data/information\n\nThese aspects may be best assessed using a range of\nscenarios what ifs as a stimulus with a walk through forming\npart of the response. These assessment activities should\ninclude a range of problems, including new, unusual and\nimprobable situations that may have happened.\n2. Resource\nImplications\nSpecific resources for assessment\n2.1.\nEvidence of competent performance should be\nobtained by observing an individual in an information\nmanagement role within the workplace or operational\nor simulated environment.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nWritten Test\n3.2.\nInterview\n3.3.\nPortfolio\n\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over a\nrange of situations, which will include disruptions to normal,\nsmooth operation. Simulation may be required to allow for\ntimely assessment of parts of this unit of competency.\nSimulation should be based on the actual workplace and\nwill include walk through of the relevant competency\ncomponents.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 30 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 26\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND\nHEALTH POLICIES AND PROCEDURES\n\nUNIT CODE\n : 400311216\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to identify OSH compliance requirements,\nprepare OSH requirements for compliance, perform\ntasks in accordance with relevant OSH policies and\nprocedures\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations,\npolicies and\nprocedures are\nidentified in\naccordance with\nworkplace policies\nand procedures\n1.2 OSH activity non-\nconformities are\nconveyed to\nappropriate\npersonnel\n 1.3 OSH preventive\nand control\nrequirements are\nidentified in\naccordance with\nOSH work policies\nand procedures\n\n1.1. OSH preventive\nand control\nrequirements\n1.2. Hierarchy of\nControls\n1.3. Hazard\nPrevention and\nControl\n1.4. General OSH\nprinciples\n1.5. Work standards\nand procedures\n1.6. Safe handling\nprocedures of\ntools, equipment\nand materials\n1.7. Standard\nemergency plan\nand procedures\nin the workplace\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n\n--- PDF PAGE 31 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 27\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLE