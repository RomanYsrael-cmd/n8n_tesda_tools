  "source_text": "1.\nScaffold\nIs a temporary structure of poles and planks\nproviding platform for workers to stand on while\nerecting or repairing a structure\n\n2.\nOffset line\na line or point placed at a given distance from a\ncontrol line or point used to re-establish the original\nlocation.\n\n3.\nLine and grade/Surveyor\nProfessionals who determines and/or established\nboundary lines and/or elevations of building walls,\nfoundations, utilities, etc.\n\n4.\nReference line\nA series of two or more points or line to serve as\nreference for measurement\n\n5.\nSheating\nA layer of boards nailed to a stud or stiffeners to\nform a form panel\n\n6.\nStiffeners\nAre lumber connected to a stud where sheathings\nare to be fastened to\n\n7.\nForm panels and\ncomponents\nAre temporary boarding, sheathing or pan and form\naccessories used to produce the desired shape\nand size of concrete\n\n8.\nDoor jamb\nIs the vertical portion of the door frame onto which\na door is secured, normally comes in set including\nheader\n\n9.\nDoor panels\nA hinged or sliding rectangular panel secured to a\ndoor jamb for opening and closing the entrance to\na room and/or building\n\n10. Window frames\nBasic components are jambs, headers and sills.\n\n11. Window panels\nEither wood, glass or other materials framed and\nsecured to a window frames\n\n12. Ceiling elevation\nIs the final height of the ceiling measured from the\nfloor\n\n13. Ceiling Joist\nThe structural member in building construction\nwhere the ceiling board is fastened\n\n14. Wall location\nExact location where walls will be constructed\n\n--- PDF PAGE 157 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n155\n\n15. Position of framing system Are the exact location of wall studs and\nnoggins/braces as determined during layout\n16. Steps elevation\nExact layout/position of the stair tread, riser and\nlanding\n\n17. Wooden stringer\nThe inclined member supporting the treads and the\nrisers of the stair\n\n18. Wooden tread\nThe horizontal part of a step\n\n19. Wooden handrails\nA rail running parallel with the inclination of the\nstairs that holds the balusters\n\n20. Wooden baluster\nSmall posts supporting the handrail\n\n21. Floor elevation\nExact location of the finished flooring measured\nfrom an established reference line\n\n22. Wooden floor supports\nAre wooden girders or stringers carrying the floor\njoists\n\n23. Wooden floor joist\nIs the structural member of a building that supports\nthe wood flooring\n\n24. Wooden floor panels\nAre wood boards used for flooring\n\n25. Truss location\nExact location where truss assembly will be\npositioned as determined on plan\n\n26. Truss elevation\nexact height of the truss measured from the floor\nline to the bottom of the chord\n27. Wooden roof truss\nassembly\nComprises the girts, bottom chord, rafters, collar\nplate, center post, strut and block\n\n28. Wooden purlins\nIs a structural member of a roof framing system\nwhere the roofing sheets are fastened\n\n29. Roofing sheets and\naccessories\nAre different types of roof coverings including ridge\nrolls, gutters, flashings, etc.\n\n30. Wooden cabinet\na box-shaped piece of furniture with doors and/or\ndrawers for storing miscellaneous items. Some\ncabinets stand-alone while others are built in to a\nwall or are attached to it\n\n31. Rough Lumber\nUnplaned or undressed lumber\n\n32. S2S and S4S\n\nA lumber wherein the number connotes the\nsmoothed/planed sides\n\n--- PDF PAGE 158 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n156\n\n33. 5S\nThe five in a 5S workplace organizational and\nhousekeeping methodology refers to five steps –\nsort, set in order, shine, standardize and sustain.\n\n34. 3R\nThe principle of reducing waste, reusing and\nrecycling resources and products\n\n Reduce\nThe waste management concept of reducing what\nis produced and what is consumed\n\n Reuse\n\nThe waste management concept of reusing items,\nor re-purposing them for a use different than what\nthey are intended for\n\n Recycling\n\nThe waste management concept of transforming\nagain into a raw material that can be shaped into a\nnew item\n\n--- PDF PAGE 159 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n157",
