erial Skills\n\n•\nLecture\n•\nGroup\nDiscussion\n•\nSimulation\n•\nDemonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n\n--- PDF PAGE 127 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 125\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.2 Determine causes\nof inefficiency of\nresource utilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work\nProcedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hr\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods\nand technologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/Discussion\n• Case Study\n• Written Test\n• Interview\n1 hour\n10.\n\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/Discussion\n• Written Test\n• Interview\n1 hour\n\n9.3 Implement cost-\neffective operations\n• Case studies on Preservation,\noptimization and judicious use of\nworkplace resources\n• Case Study\n• Lecture/Discussion\n• Case Study\n• Written Test\n• Interview\n2 hours\n\n--- PDF PAGE 128 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 126\nCOMMON COMPETENCIES\n(24 HOURS)\n\n