5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n8.4 Place wooden cabinet\n•\nPlacing wooden\ncabinet\n•\nChecking squareness,\nlevelness, plumbness\nand alignment\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3 hours\n\n8.5 Perform housekeeping\n•\nImplementing 3R and\n5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n--- PDF PAGE 141 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n139\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based\nTVET.\n\na. Course design is based on competency standards set by the\nindustry or recognized industry sector; (Learning system is\ndriven by competencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of\na workplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the\nperformance of work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and\nattitude into account but requires evidence of actual performance\nof the competency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all\nspecified competencies not on the specified nominal duration of\nlearning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is\ndriven by the competency standards specified by the industry. The\nfollowing training modalities and their variations/components may be\nadopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program\n(DTP) which contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the\nImplementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video, computer\n\n--- PDF PAGE 142 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 140\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment\ninvolving a contract between an apprentice and an enterprise\non an approved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and\nworking) agreement between an apprentice and a master\ncraftsperson wherein the agreement may be written or oral\nand the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a\nsignificant period of time, usually between one and four\nyears, while the apprentice commits to contributing\nproductively to the work of the business. Training is\nintegrated into the production process and apprentices learn\nby working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented\nwithin the company in accordance with the requirements of\nthe specific company. Specific guidelines on this mode shall\nbe issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs,\ntraining centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can\nbe conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n--- PDF PAGE 143 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 141\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• A Holder of National Certificate Level I in Civil Works or at least\nJunior High School Level Completer or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent\nholder\n• Can communicate both orally and in writing\n• Can perform basic mathematical computation and mensuration\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for CARPENTRY NC II are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n10 pcs\nCross cut saw\n5 pcs\nRip saw (medium)\n10 pcs\nClaw hammer 8 oz\n10 pcs\nClaw hammer 16 oz\n10 pcs\nChalk line box\n25 pcs\nPull-push rule\n(5 meters)\n5 pcs\nCrow bar\n10 pcs\nSteel square/ Carpenter’s square\n10 pcs\nTri- square\n10 pcs\nLevel bar (36 in.)\n5 pcs each\nScrew driver (flat and Philips)\n10 pcs\nNail bag\n10 pcs\nNail Box\n10 pcs each\nChisel, ¼”, ½ ”, ¾ ”, 2”\n\n--- PDF PAGE 144 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 142\nTOOLS\nQTY\nDESCRIPTION\n10 pcs each\nSocket wrench (19mm and 21m)\n10 pcs\nPlumb bob (medium)\n10 pcs\nWood planer (2 in.)\n2 pcs\nExpansive bit\n12 m\nLevel hose, 3/8 in diameter\n5 pcs\nRiveter\n5 pcs\nTin snip\n2 pcs\nTekscrew bit (10 mm)\n1 pc\nSealant gun\n10 pcs\nAdjustable wrench\n\nEQUIPMENT\nQTY\nDESCRIPTION\n5 sets\nH-frame scaffolds system and accessories\n2 units\nPortable electric drill (variable speed)\n2 units\nPortable electric planer\n2 sets\nCircular saw/jig saw with vacuum with vacuum\n\nMATERIALS\nQTY\nDESCRIPTION\n3 sets each\nFabricated door and window jambs assembly\n2 sets\nFabricated door panel, flushed (0.8 m x 2.1 m)\n10 sets\nNylon string\n (10 meters)\n25 pcs\nPencil\n6 pcs\nLoose pin hinges, 4”\n\n--- PDF PAGE 145 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 143\nMATERIALS\nQTY\nDESCRIPTION\n2 kg\nFinishing wire nail, 1”\n2 kg\nFinishing wire nail, 1½ inches\n1 kg\nFinishing wire nail, 3” inches\n2 kg\nCommon wire nail, 1”\n2 kg\nCommon wire nail, 1½ inches\n8 kg\nCommon wire nail, 2 inches\n8 kg\nCommon wire nail, 3 inches\n8 kg\nCommon wire nail, 4 inches\n2 sets\nPulley, 4”\n20 m\nNylon rope, 1” dia.\n2 pcs.\nBolo\n\nFOR ROOFING\nMATERIALS\nQTY\nDESCRIPTION\n12 pcs\n\nrough lumber 2”x4”x16’\n\n15 pcs\nrough lumber 2”x3”x8’\n14 pcs\n\nS2S lumber 2”x2”x10’\n\n2 pcs\n\nFascia board 1”x8”x10’\n\n1 pc\n\nGutter, gauge 24 x 16” x 8’\n1 pc\n\nRidge roll, gauge 24 x 16” x 8’\n2 pcs\n\nEnd flashing, gauge 24 x 16” x 8’\n50 pcs\n\nTekscrew with neoprene rubber (for wood) 3”\n50 pcs\nUmbrella nail\n\n--- PDF PAGE 146 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 144\nMATERIALS\nQTY\nDESCRIPTION\n2 pcs\n\nRib type roofing, gauge 26 x 4m\n4 pcs\n\nCorrugated type roofing, gauge 26 x 8’\n1 tube\n\nSilicon sealant\n\n2 pcs.\nDrill bit, 1/8”\n\nFOR CEILING ASSEMBLY\nMATERIALS\nQTY\nDESCRIPTION\n6 pcs\nPlywood,1/4”x4’x8’\n12 pcs\nRough lumber, 2”x2”x8’\n5 pcs\nWood cornice,1”x3”x8’\n16 pcs.\nButt hinges\n8 pcs.\nConcealed hinges\n8 pcs\nCatches\n4 pcs\nCabinet door handle\n100 pcs\nBlind rivets (1/8”x3/8”)\n2 sets\nDoor knob and lock set\n\nFOR STAIR ASSEMBLY\nMATERIALS\nQTY\nDESCRIPTION\n2 pcs\nWooden hand rail\n4 pcs\nWooden Baluster\n2 pcs\nWooden planks 2”x 8”x 10’\n\n--- PDF PAGE 147 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 145\nFOR WALL ASSEMBLY\nMATERIALS\nQTY\nDESCRIPTION\n10 pcs\nRough lumber 2”x 2”x8’\n6 pcs\nPlywood,1/4”x4’x8’\n2 pcs\nBase board, 1”x4”x8’\n\nFOR FLOOR ASSEMBLY\nMATERIALS\nQTY\nDESCRIPTION\n5 pcs\n\nRough lumber 2”x 3”x10’\n6 pcs\n\nRough lumber 2”x 4”x12’\n2 pcs\n\nRough lumber 2”x 6”x10’\n2 pcs\nMarine Plywood,3/4”x4’x8’\n\nFOR CABINET ASSEMBLY\nMATERIALS\nQTY\nDESCRIPTION\n2 pcs\n\nKiln Dried Plywood,3/4”x4’x8’\n1 pint\nWood glue\n4 pcs\nS4S lumber (edging)1”x1/2”x8’\n\nPERSONAL PROTECTIVE EQUIPMENT (PPE)\nQTY\nDESCRIPTION\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\n\n--- PDF PAGE 148 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 146\n\n3.5 TRAINING FACILITIES\n\nThe carpentry workshop must be of concrete structure. Based on class\nsize of 25 students/trainees the space requirements for the teaching/learning\nand circulation areas are as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n15 x 18\n270\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n\n48\nTool Room/Storage\n4 x 5\n20\nWash room/Toilet\n4 x 5\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n438\n\n--- PDF PAGE 149 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 147\n\n3.4\nTRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I)\nin CARPENTRY NC II\n• Must have completed the 40-Hour Construction Safety Training\nCourse (COSH) per Department Order No. 13 s. 1998, Guidelines\nGoverning Occupational Safety and Health in the Construction\nIndustry conducted by OSHC and DOLE accredited Safety\nTraining Organizations\n• Must have at least two (2) years industry experience in Civil Works\nand one (1) year teaching experience in Carpentry\n\n3.5 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of Competency.\n\n--- PDF PAGE 150 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 148"
