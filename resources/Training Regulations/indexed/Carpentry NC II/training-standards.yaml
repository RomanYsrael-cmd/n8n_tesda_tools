 01 Promulgated (10/29/2018) 145\nFOR WALL ASSEMBLY\nMATERIALS\nQTY\nDESCRIPTION\n10 pcs\nRough lumber 2”x 2”x8’\n6 pcs\nPlywood,1/4”x4’x8’\n2 pcs\nBase board, 1”x4”x8’\n\nFOR FLOOR ASSEMBLY\nMATERIALS\nQTY\nDESCRIPTION\n5 pcs\n\nRough lumber 2”x 3”x10’\n6 pcs\n\nRough lumber 2”x 4”x12’\n2 pcs\n\nRough lumber 2”x 6”x10’\n2 pcs\nMarine Plywood,3/4”x4’x8’\n\nFOR CABINET ASSEMBLY\nMATERIALS\nQTY\nDESCRIPTION\n2 pcs\n\nKiln Dried Plywood,3/4”x4’x8’\n1 pint\nWood glue\n4 pcs\nS4S lumber (edging)1”x1/2”x8’\n\nPERSONAL PROTECTIVE EQUIPMENT (PPE)\nQTY\nDESCRIPTION\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\n\n--- PDF PAGE 148 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 146\n\n3.5 TRAINING FACILITIES\n\nThe carpentry workshop must be of concrete structure. Based on class\nsize of 25 students/trainees the space requirements for the teaching/learning\nand circulation areas are as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n15 x 18\n270\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n\n48\nTool Room/Storage\n4 x 5\n20\nWash room/Toilet\n4 x 5\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n438\n\n--- PDF PAGE 149 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 147\n\n3.4\nTRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I)\nin CARPENTRY NC II\n• Must have completed the 40-Hour Construction Safety Training\nCourse (COSH) per Department Order No. 13 s. 1998, Guidelines\nGoverning Occupational Safety and Health in the Construction\nIndustry conducted by OSHC and DOLE accredited Safety\nTraining Organizations\n• Must have at least two (2) years industry experience in Civil Works\nand one (1) year teaching experience in Carpentry\n\n3.5 INSTITUTIONAL 