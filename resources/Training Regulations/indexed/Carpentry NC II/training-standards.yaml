    "source_text": "SECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for CARPENTRY NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: CARPENTRY NC II\n\nNominal Training Duration:\n37 Hours Basic Competencies\n24 Hours Common Competencies\n 240 Hours Core Competencies\n Total 301 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve in performing tasks such as layout\nreference lines, fabricate, install and remove wooden formworks, install wooden door\njamb, window frame and panels, install ceiling and wall frames and panels, fabricate and\ninstall wooden stairs, install wooden floor supports and panels, fabricate and install roofing\nsystem and fabricate and install wooden cabinet. This includes classroom learning\nactivities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 118 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n116\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\nWritten\nexamination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 119 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 117\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork related\ndocuments\n•\nDescribe Communication procedures\nand systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record\nroutine workplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people\nof social range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work related documents\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 120 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 118\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work in a team\nenvironment\n2.1 Describe team role\nand scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the\ndifferent sources of information\n• Lecture/ Discussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n2.2 Identify one’s role\nand responsibility\nwithin team\n•\nRole play :\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n•Role Play\n•Lecture/ Discussion\n• Role Play\n• Written Test\n1 hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n\n• Role play : Communication protocols\n\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/ Discussion\n• Role Play\n• Written Test\n1 hour\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the i