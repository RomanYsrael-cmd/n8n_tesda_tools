orming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case\nproblems\ninvolving\nworkplace\ndiversity\nissues\n\n1 hour\n\n--- PDF PAGE 122 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 120\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nprofessional\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal\nand career goals\n• Share experiences that show\nconfidence, and resilience in the face of\nsetbacks and frustrations and other\nnegative emotions and unpleasant\nsituations in the workplace\n\n4.2 Develop reflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/ dislikes;\nthrough showing of self-confidence\n• Demonstrate self-acceptance and being\nable to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n•Brainstorming\n• Demonstration\n•5 Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case\nproblems\ninvolving\nworkplace\ndiversity\nissues\n\n1 hour\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-\nregulation based on Self-Regulation\nTheory (SRT)\n• Explain personality development\nconcepts\n• Cite self-help concepts (e. g., 7 Habits\nby Stephen Covey, transactional\nanalysis, psycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility,\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n•\nDemonstration\nor simulation\nwith oral\nquestioning\n• Case\nproblems\ninvolving\nworkplace\ndiversity\nissues\n1 hour\n\n--- PDF PAGE 123 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 121\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nadaptability, etc.\n• Determine strengths and weaknesses\n\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to do\nthings better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 habits of highly effective\npeople\n•Interactive Lecture\n•Appreciative Inquiry\n•Demonstration\n•Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n\n5.2 Discuss and\ndevelop ideas with\nothers\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\n•Interactive Lecture\n•Appreciative Inquiry\n•Demonstration\n•Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n1 hour\n\n--- PDF PAGE 124 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 122\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nworkplace\n• Discuss 7 habits of highly effective\npeople\n• Communicate ideas through small group\ndiscussions and meetings\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\