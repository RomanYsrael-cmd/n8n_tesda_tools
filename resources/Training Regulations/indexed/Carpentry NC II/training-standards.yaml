  "source_section_text": "SECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for CARPENTRY NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: CARPENTRY NC II\n\nNominal Training Duration:\n37 Hours Basic Competencies\n24 Hours Common Competencies\n 240 Hours Core Competencies\n Total 301 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve in performing tasks such as layout\nreference lines, fabricate, install and remove wooden formworks, install wooden door\njamb, window frame and panels, install ceiling and wall frames and panels, fabricate and\ninstall wooden stairs, install wooden floor supports and panels, fabricate and install roofing\nsystem and fabricate and install wooden cabinet. This includes classroom learning\nactivities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 118 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n116\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\nWritten\nexamination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 119 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 117\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork related\ndocuments\n•\nDescribe Communication procedures\nand systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record\nroutine workplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people\nof social range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work related documents\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 120 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 118\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work in a team\nenvironment\n2.1 Describe team role\nand scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the\ndifferent sources of information\n• Lecture/ Discussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n2.2 Identify one’s role\nand responsibility\nwithin team\n•\nRole play :\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n•Role Play\n•Lecture/ Discussion\n• Role Play\n• Written Test\n1 hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n\n• Role play : Communication protocols\n\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/ Discussion\n• Role Play\n• Written Test\n1 hour\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Analyze routine/procedural problems\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n--- PDF PAGE 121 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 119\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Look for solutions\nto routine problems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Formulate possible solutions to\nproblems and document procedures for\nreporting\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n3.3 Recommend\nsolutions to\nproblems\n• Discuss standard operating procedures\nand documentation processes\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management\nstrategies that assist in regulating\nbehavior and achieving personal and\nlearning goals\n• Explain enablers and barriers in\nachieving personal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger,\nworry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case\nproblems\ninvolving\nworkplace\ndiversity\nissues\n\n1 hour\n\n--- PDF PAGE 122 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 120\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nprofessional\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal\nand career goals\n• Share experiences that show\nconfidence, and resilience in the face of\nsetbacks and frustrations and other\nnegative emotions and unpleasant\nsituations in the workplace\n\n4.2 Develop reflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/ dislikes;\nthrough showing of self-confidence\n• Demonstrate self-acceptance and being\nable to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n•Brainstorming\n• Demonstration\n•5 Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case\nproblems\ninvolving\nworkplace\ndiversity\nissues\n\n1 hour\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-\nregulation based on Self-Regulation\nTheory (SRT)\n• Explain personality development\nconcepts\n• Cite self-help concepts (e. g., 7 Habits\nby Stephen Covey, transactional\nanalysis, psycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility,\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n•\nDemonstration\nor simulation\nwith oral\nquestioning\n• Case\nproblems\ninvol