• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n8.4 Place wooden cabinet\n•\nPlacing wooden\ncabinet\n•\nChecking squareness,\nlevelness, plumbness\nand alignment\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3 hours\n\n8.5 Perform housekeeping\n•\nImplementing 3R and\n5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n--- PDF PAGE 141 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n139\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based\nTVET.\n\na. Course design is based on competency standards set by the\nindustry or recognized industry sector; (Learning system is\ndriven by competencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of\na workplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the\nperformance of work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and\nattitude into account but requires evidence of actual performance\nof the competency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all\nspecified competencies not on the specified nominal duration of\nlearning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is\ndriven by the competency standards specified by the industry. The\nfollowing training modalities and their variations/components may be\nadopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program\n(DTP) which contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the\nImplementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video, computer\n\n--- PDF PAGE 142 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 140\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment\ninvolving a contract between an apprentice and an enterprise\non an approved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and\nworking) agreement between an apprentice and a master\ncraftsperson wherein the agreement may be written or oral\nand the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a\nsignificant period of time, usually between one and four\nyears, while the apprentice commits to contributing\nproductively to the work of the business. Training is\nintegrated into the production process and apprentices learn\nby working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented\nwithin the company in accordance with the requirements of\nthe specific company. Specific guidelines on this mode shall\nbe issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs,\ntraining centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can\nbe conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n--- PDF PAGE 143 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 141\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• A Holder of National Certificate Level I in Civil Works or at least\nJunior High School Level Completer or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent\nholder\n• Can communicate both orally and in writing\n• Can perform basic mathematical computation and mensuration\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for CARPENTRY NC II are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n10 pcs\nCross cut saw\n5 pcs\nRip saw (medium)\n10 pcs\nClaw hammer 8 oz\n10 pcs\nClaw hammer 16 oz\n10 pcs\nChalk line box\n25 pcs\nPull-push rule\n(5 meters)\n5 pcs\nCrow bar\n10 pcs\nSteel square/ Carpenter’s square\n10 pcs\nTri- square\n10 pcs\nLevel bar (36 in.)\n5 pcs each\nScrew driver (flat and Philips)\n10 pcs\nNail bag\n10 pcs\nNail Box\n10 pcs each\nChisel, ¼”, ½ ”, ¾ ”, 2”\n\n--- PDF PAGE 144 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 142\nTOOLS\nQTY\nDESCRIPTION\n10 pcs each\nSocket wrench (19mm and 21m)\n10 pcs\nPlumb bob (medium)\n10 pcs\nWood planer (2 in.)\n2 pcs\nExpansive bit\n12 m\nLevel hose, 3/8 in diameter\n5 pcs\nRiveter\n5 pcs\nTin snip\n2 pcs\nTekscrew bit (10 mm)\n1 pc\nSealant gun\n10 pcs\nAdjustable wrench\n\nEQUIPME