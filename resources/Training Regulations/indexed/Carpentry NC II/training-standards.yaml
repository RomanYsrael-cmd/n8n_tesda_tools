nsheets and\naccessories\n•\nChecking\nsquareness,\nlevelness, plumbness\nand alignment\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n8 hours\n\n7.7 Dismantle scaffolds\n•\nUnderstanding\ndismantling\nprocedures for\nscaffolds\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n2 hours\n\n7.8 Perform housekeeping\n•\nImplementing 3R and\n5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n--- PDF PAGE 140 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 138\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n8. Fabricate and install\n wooden cabinet\n8.1 Prepare materials\n and tools\n\n•\nReceiving materials\nand tools at workplace\n•\nIdentifying, checking\nand inspecting\nmaterials and tools\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n8.2 Assemble wooden\n cabinet\n\n•\nAssembling wooden\ncabinet\n•\nChecking squareness,\nlevelness, plumbness\nand alignment\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 hours\n\n8.3 Layout location\n•\nMeasuring and\nmarking dimensions\n•\nChecking accuracy of\nmeasurements and\nmarkings\n•\nPracticing 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 hour\n\n8.4 Place wooden cabinet\n•\nPlacing wooden\ncabinet\n•\nChecking squareness,\nlevelness, plumbness\nand alignment\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3 hours\n\n8.5 Perform housekeeping\n•\nImplementing 3R