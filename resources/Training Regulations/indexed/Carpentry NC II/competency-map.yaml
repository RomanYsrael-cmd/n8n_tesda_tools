  "source_text": "COMPETENCY MAP - CONSTRUCTION SECTOR\n(Civil Works)\n CARPENTRY NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 154 ---\nCarpentry NC II Revision 01 Promulgated (10/29/18)\n152\n\nUtilize\nspecialize\nspecialized\ncommunicati\non skill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneu\nrial skills\nManage and\nsustain\neffective\ncommunicati\non strategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop\nand sustain\na high-\nperforming\nenterprise\n\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual\nof\ninstructions\n\nPerform\nmensurations\nand\ncalculations\n\nMaintain\ntools and\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 155 ---\nCarpentry NC II Revision 01 Promulgated (10/29/18)\n153\n\nPrepare masonry\nmaterials\n\nPerform masonry tools and\nequipment\n\nPerform basic masonry\nworks\n\nLay concrete hollow block\nfor structure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-finish\nfloor concreting\nRectify non-conforming\nconcrete and masonry\nsurfaces\nLay tiles on plain and\ncurved surfaces for walls,\nfloors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference\nlines\n\nFabricate, install and\nremove wooden\nformworks\n\nInstall wooden door jamb,\nwindow frame and panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall and/or\ncladding frames and\nboards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\nPrepare pipefitting\nmaterials, tools and\nequipment for spool pipe\nconnection\nInstall above ground piping\nsystem\n\nInstall overhead piping\nsystem\nInstall underground\npiping system\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and other\napplication\nRepair of tiles on plain and\ncurved surfaces\n\nCORE COMPETENCIES\n\n--- PDF PAGE 156 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n154\n\nGLOSSARY OF TERMS\n\n1.\nScaffold\nIs a temporary structure of poles and planks\nproviding platform for workers to stand on while\nerecting or repairing a structure\n\n2.\nOffset line\na line or point placed at a given distance from a\ncontrol line or point used to re-establish the original\nlocation.\n\n3.\nLine and grade/Surveyor\nProfessionals who determines and/or established\nboundary lines and/or elevations of building walls,\nfoundations, utilities, etc.\n\n4.\nReference line\nA series of two or more points or line to serve as\nreference for measurement\n\n5.\nSheating\nA layer of boards nailed to a stud or stiffeners to\nform a form panel\n\n6.\nStiffeners\nAre lumber connected to a stud where sheathings\nare to be fastened to\n\n7.\nForm panels and\ncomponents\nAre temporary boarding, sheathing or pan and form\naccessories used to produce the desired shape\nand size of concrete\n\n8.\nDoor jamb\nIs the vertical portion of the door frame onto which\na door is secured, normally comes in set including\nheader\n\n9.\nDoor panels\nA hinged or sliding rectangular panel secured to a\ndoor jamb for opening and closing the entrance to\na room and/or building\n\n10. Window frames\nBasic components are jambs, headers and sills.\n\n11. Window panels\nEither wood, glass or other materials framed and\nsecured to a window frames\n\n12. Ceiling elevation\nIs the final height of the ceiling measured from the\nfloor\n\n13. Ceiling Joist\nThe structural member in building construction\nwhere the ceiling board is fastened\n\n14. Wall location\nExact location where walls will be constructed\n\n--- PDF PAGE 157 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n155\n\n15. Position of framing system Are the exact location of wall studs and\nnoggins/braces as determined during layout\n16. Steps elevation\nExact layout/position of the stair tread, riser and\nlanding\n\n17. Wooden stringer\nThe inclined member supporting the treads and the\nrisers of the stair\n\n18. Wooden tread\nThe horizontal part of a step\n\n19. Wooden handrails\nA rail running parallel with the inclination of the\nstairs that holds the balusters\n\n20. Wooden baluster\nSmall posts supporting the handrail\n\n21. Floor elevation\nExact location of the finished flooring measured\nfrom an established reference line\n\n22. Wooden floor supports\nAre wooden girders or stringers carrying the floor\njoists\n\n23. Wooden floor joist\nIs the structural member of a building that supports\nthe wood flooring\n\n24. Wooden floor panels\nAre wood boards used for flooring\n\n25. Truss location\nExact location where truss assembly will be\npositioned as determined on plan\n\n26. Truss elevation\nexact height of the truss measured from the floor\nline to the bottom of the chord\n27. Wooden roof truss\nassembly\nComprises the girts, bottom chord, rafters, collar\nplate, center post, strut and block\n\n28. Wooden purlins\nIs a structural member of a roof framing system\nwhere the roofing sheets are fastened\n\n29. Roofing sheets and\naccessories\nAre different types of roof coverings including ridge\nrolls, gutters, flashings, etc.\n\n30. Wooden cabinet\na box-shaped piece of furniture with doors and/or\ndrawers for storing miscellaneous items. Some\ncabinets stand-alone while others are built in to a\nwall or are attached to it\n\n31. Rough Lumber\nUnplaned or undressed lumber\n\n32. S2S and S4S\n\nA lumber wherein the number connotes the\nsmoothed/planed sides\n\n--- PDF PAGE 158 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n156\n\n33. 5S\nThe five in a 5S workplace organizational and\nhousekeeping methodology refers to five steps –\nsort, set in order, shine, standardize and sustain.\n\n34. 3R\nThe principle of reducing waste, reusing and\nrecycling resources and products\n\n Reduce\nThe waste management concept of reducing what\nis produced and what is consumed\n\n Reuse\n\nThe waste management concept of reusing items,\nor re-purposing them for a use different than what\nthey are intended for\n\n Recycling\n\nThe waste management concept of transforming\nagain into a raw material that can be shaped into a\nnew item\n\n--- PDF PAGE 159 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n157\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nCARPENTRY NC II\nQualification Code: CONCAR218\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nCarpentry NC II\n2005-03 / 03/18/05\nN/A\n\n01\nDocument Amended\nCarpentry NC II\n2005-03 / 03/18/05\n2018-35 / 10/29/18\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 160 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018)\n158\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMARCELO R. ABAD\nConsultant/ Industry Expert\nQuezon City\nROLANDO C. BADILLA\nTechnical Specialist – Industry Expert\nJames Hardie Philippines, Inc.\nCabuyao, Laguna\nALIPIO M. PANGANIBAN\nDepartment Head - Industry Expert\nDatem, Inc.\nQuezon City\nRIZALDY E. ANGELES\nConstruction Manager - Industry Expert\nEEI Corporation\nQuezon City\nJOHN S. JUAN\nSTIDS\nConstruction Industry Authority of the\nPhils. (CIAP) -CMDF\nMakati City\nANGELITO V. ZULUETA\nConsultant/ Industry Expert\nAVZ Management & Consulting Services\nSingalong, Manila\n\n--- PDF PAGE 161 ---\nCarpentry NC II Revision 01 Promulgated (10/29/18)\n159\n\nThe PARTICIPANTS in the Validation of this Training Regulations\n\nMINDANAO REGION\n\n• Allado Construction\n• Association of Construction Informal Workers (ACIW) - Davao\n• DJTECH\n• Department of Public Works and Highway (DPWH) - Davao\n• James Hardie Phils. Inc. (JHPI)\n• Maxbuilder Construction\n• Tagum City Trade School (TCTS)\n• PTC-San Isidro Manpower Training Center (SIMTRAC)\n• RTC-Korea Phils. Vocational Training Center (KPCTC)\n\nLUZON REGION\n\n• APD Manpower Expert\n• Akarui Technical Training Center - CIWC\n• B & B Academy\n• Construction Industry Workers Council (CIWC)\n• Construction Industry Workers Council (CIWC) -NACMADECO\n• Construction Manpower Development Foundation (CMDF)\n• Datem Construction\n• D. M. Consunji, Inc\n• Hisada Institute Incorporated\n• Jacobo Z. Gonzales Memorial School of Arts and Trades (JZGMSAT)\n• EEI Corporation\n• Makati Development Corporation\n• Saint Peregrine Institute\n• TESDA-RTC Mariveles\n\nThe MEMBERS of the TESDA