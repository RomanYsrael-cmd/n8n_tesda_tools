        "source_title": "WORK IN A TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 11 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       7 \n \nUNIT OF COMPETENCY: \nWORK IN A TEAM ENVIRONMENT \n \nUNIT CODE                    :       400311211 \n \nUNIT DESCRIPTOR      :       This unit covers the skills, knowledge and attitudes to  \n \n  \nidentify one’s roles and responsibilities as a member of a  \n \n  \nteam. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Describe \nteam role \nand scope \n1.1  The role and objective \nof the team is identified \nfrom available sources \nof information \n1.2   Team parameters, \nreporting relationships \nand responsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources  \n1.1 Group structure \n1.2 Group \ndevelopment \n1.3 Sources of \ninformation \n \n \n \n \n1.1 Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n1.2 Developing ways \nin improving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization \n2.  Identify one’s \nrole and \nresponsibility \nwithin a team \n2.1  Individual roles and \nresponsibilities within \nthe team environment \nare identified \n2.2  Roles and objectives of \nthe team is identified \nfrom available sources \nof information            \n2.3 Team parameters, \nreporting relationships \nand responsibilities are \nidentified based on \nteam discussions and \nappropriate external \nsources \n2.1 Team roles and \nobjectives  \n2.2 Team structure \nand parameters \n2.3 Team \ndevelopment \n2.4    Sources of \ninformation \n \n2.1 Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n2.2 Developing ways \nin improving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization\n\n--- PDF PAGE 12 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       8 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.  Work as a   \nteam \nmember \n3.1  Effective and \nappropriate forms of \ncommunications are \nused and interactions \nundertaken with team \nmembers based on \ncompany practices.  \n3.2  Effective and \nappropriate \ncontributions made to \ncomplement team \nactivities and \nobjectives, based on \nworkplace context \n3.3  Protocols in reporting \nare observed based \non standard company \npractices.  \n3.4  Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of  \nteam’s role and \nobjectives \n \n3.1   Communication \nProcess \n3.2   Workplace \ncommunication \nprotocol \n3.3   Team planning \nand \n  decision making \n3.4    Team thinking \n3.5   Team roles \n3.6  Process of team \ndevelopment \n3.7 Workplace \ncontext \n \n \n \n3.1   Communicating \nappropriately, \nconsistent with \nthe culture of the \nworkplace \n3.2   Interacting \neffectively with \nothers \n3.3 Deciding as an \nindividual and \nas a group \nusing group \nthink strategies \nand techniques \n3.4 Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 13 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       9 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Role and objective \nof team  \nMay include: \n1.1. \nWork activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement \nmaybe demonstrated on the job, either \nindividually or in a team environment \n2. Sources of \ninformation \nMay include: \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s \nspecifications and instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \nMay include: \n3.1. \nWork procedures and practices \n3.2. \nConditions of work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, \nsafe handling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and \nquality guidelines\n\n--- PDF PAGE 14 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       10 \n \n EVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1.  Worked in a team to complete workplace activity \n1.2. Worked effectively with others \n1.3. Conveyed information in written or oral form \n1.4. Selected and used appropriate workplace language \n1.5. Followed designated work plan for the job \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2.   Materials relevant to the proposed activity or tasks \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nRole play involving the participation of individual \nmember to the attainment of organizational goal \n3.3.  Case studies and scenarios as a basis for discussion \nof    issues and strategies in teamwork \n3.4    Socio-drama and socio-metric methods \n3.5    Sensitivity techniques \n3.6    Written Test \n4. Context for \nAssessment \n4.1. Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2. Assessment shall be observed while task are being \nundertaken whether individually or in group\n",
