nt \nmarkings are done \nas required. \n3.4 Work area is \ncleaned according to \nsafety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n3.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based on \nwork \n \n3.1 DOLE \nDepartment Order \nNo. 13 series \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry  \n3.2 Signs and \nsymbols  \n3.3 Company rules \nand regulations \n3.4 Methods and \ntechniques in \nmeasurements  \n3.5 Understanding \ninstructions \n3.6 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n3.7 Factors affecting \nproductivity \n3.8 Productivity work \nmeasurements \n3.9 Ways of \nimproving \nproductivity \n3.10 \nAdherence to \nwork \nrequirements \n \n3.1 Applying \nmensuration \n3.2 Applying \nproductive \nmethods and \ntechniques  \n3.3 Using PPE \n3.4 Communicating \neffectively \n3.5 Following \ncompany rules \nand regulations \n3.6 Following \ninstructions \n3.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 58 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       54 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal Protective \nEquipment (PPE) \nInclude: \n1.1 \nHard hat \n1.2 \nSafety shoes \n1.3 \nGloves \n1.4 \nProper uniform/clothing \n1.5 \nGoggles \n1.6 \nVest \n1.7 \nMask \n2. Materials and  tools \n \n \n \n \nMay include: \n2.1 \nLumber \n2.2 \nNails \n2.3 \nG.I. Wires \n2.4 \nChalk line box \n2.5 \nPen Marker/ Pencil/Chalk stone \n2.6 \nClaw hammer \n2.7 \nSledge hammer \n2.8 \nLevel hose/ level bar \n2.9 \nPull push rule/ steel tape/ laser meter \n2.10 Nylon string \n2.11 Plumb bob \n2.12 Steel square \n2.13 Carpenter’s square \n2.14 Laser level \n3. Sketches and working \ndrawings \nMay include: \n3.1 \nExact location \n3.2 \nDimensions \n3.3 \nElevations \n4. Reference lines \nMay include: \n4.1 \nFinished floor lines \n4.2 \nWall lines \n4.3 \nCeiling lines \n4.4 \nFascia/Eave lines \n5. Subsequent markings \nMay include: \n5.1 \nOpenings \n5.2 \nEmbedment\n\n--- PDF PAGE 59 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       55 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Prepared materials and tools consistent with job \nrequirements \n1.2 Located the offset line established by the line and grade/ \nsurveyor \n1.3 Established the required reference line based on \napproved tolerances \n1.4 Observed and complied with safety and environmental \nregulations  \n1.5 Communicated with others to ensure effective work \noperation \n1.6 Observed and complied with the productivity \nrequirements. \n1.7 Complied with attitudinal work requirements \n2. Resource implications \n \nThe following resources should be provided: \n2.1 \nActual or simulated workplace \n2.2 \nTools, materials and equipment needed to perform the \nrequired tasks \n2.3 \nReferences and manuals \n2.4 \nPPE \n2.5 \nFirst Aid Kit \n3. Method of assessment \n \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration/Observation with Oral Questioning \n \n4. Context for assessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
