cedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \n2.1 Computing \nbusiness \nmathematics and \nstatistics \n2.2 Describing data \nanalysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of\n\n--- PDF PAGE 28 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       24 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \ntechniques and \nprocedures are \ndocumented \n2.5 Recommendation\ns are made on \nareas of possible \nimprovement. \n \n \nrelating to the \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \naudiences \n2.4 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n2.5 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n \n3. Record and \npresent \ninformation  \n3.1 Studied \ndata/information \nare recorded. \n3.2 Recommendation\ns are analysed for \naction to ensure \nthey are \ncompatible with \nthe project’s \nscope and terms \nof reference. \n3.3 Interim and final \nreports are \nanalysed and \noutcomes are \ncompared to the \ncriteria \nestablished at the \noutset. \n3.4 Findings are \npresented to \nstakeholders. \n \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n \n3.1 Describing data \nanalysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of \naudiences \n3.3 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4 Stating \norganisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 29 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       25 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Data analysis techniques \nMay include: \n1.1. Domain analysis \n1.2. Content analysis \n1.3. Comparison technique \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determine data / information \n1.2 Studied and applied gathered data/information \n1.3 Recorded and studied studied data/information \n \nThese aspects may be best assessed using a range of \nscenarios what ifs as a stimulus with a walk through forming \npart of the response. These assessment activities should \ninclude a range of problems, including new, unusual and \nimprobable situations that may have happened. \n2. Resource \nImplications \nSpecific resources for assessment \n2.1. \nEvidence of competent performance should be \nobtained by observing an individual in an information \nmanagement role within the workplace or operational \nor simulated environment. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nWritten Test \n3.2. \nInterview \n3.3. \nPortfolio   \n \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other \nrelevant units of competency. Assessment will occur over a \nrange of situations, which will include disruptions to normal, \nsmooth operation. Simulation may be required to allow for \ntimely assessment of parts of this unit of competency. \nSimulation should be based on the actual workplace and \nwill include walk through of the relevant competency \ncomponents.  \n4. Context for \nAssessment \n4.1. \nIn all workplace, it may be appropriate to assess \nthis unit concurrently with relevant teamwork or \noperation units.\n",
