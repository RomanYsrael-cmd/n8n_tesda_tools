          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Prepare \nmaterials, tools \nand equipment \n \n \n1.1 Personal protective \nequipment (PPE)  is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n1.2 List of materials, \nhand tools and \nequipment are \nsecured and followed \naccording to job \nrequirements \n1.3 Materials, tools and \nequipment are \nselected, inspected \nand prepared \nconsistent with job \nrequirements. \n1.4 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n1.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n1.2 Safe handling and \nstandard specification of \nmaterials, tools and \nequipment  \n1.3 Markings and labels \n1.4 Company rules and \nregulations \n1.5 Mensuration \n1.6 Green Building Concept \nrelative to Construction \n(3R, 5S) \n1.7 Economic use of \nmaterial \n1.8 Safe and effective use \nof hand tools \n1.9 Factors affecting \nproductivity \n1.10 \nProductivity work \nmeasurements \n1.11 \nWays of improving \nproductivity \n1.12 \nAdherence to work \nrequirements \n4.2 Using PPE \n4.3 Communicating \neffectively \n4.4 Following \ncompany rules \nand regulations \n4.5 Organizing \nmaterials to be \nused  \n4.6 Handling and use \nof materials, tools \nand equipment \n4.7 Applying \nmensuration \n4.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 61 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       57 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Lay-out and cut \ndimension of \nform sheating \nand stiffeners \n2.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n2.2 Form sheating and \nstiffeners are \nmeasured and \nmarked according \nto job \nspecifications. \n2.3 Form sheating and \nstiffeners are laid \nout and cut \naccording to \nrequired \ndimensions. \n2.4 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations  \n2.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n2.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n2.2 Safe handling and \nstandard specification \nof materials, tools and \nequipment  \n2.3 Markings and labels \n2.4 Company rules and \nregulations \n2.5 Mensuration \n2.6 Green Building Concept \nrelative to Construction \n(3R, 5S) \n2.7 Factors affecting \nproductivity \n2.8 Productivity work \nmeasurements \n2.9 Ways of improving \nproductivity \n2.10 \nAdherence to work \nrequirements \n \n2.1 Using PPE \n2.2 Communicating \neffectively \n2.3 Following company \nrules and \nregulations \n2.4 Organizing materials \nto be used  \n2.5 Handling and use of \nmaterials, tools and \nequipment \n2.6 Applying \nmensuration \n2.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 62 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       58 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Assemble and \nerect form \npanels and \ncomponents \n3.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n3.2 Sheatings are \npositioned and fixed \nto stiffeners \n3.3 Assembled form \npanels are checked \nfor squareness, \nlevelness, plumbness \nand alignment. \n3.4 Primary and \nsecondary supports \nare positioned and \nfixed to hold \nassembled form \npanels as per