          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.   Prepare  \nmaterials,   \n      tools and  \n      equipment \n \n \n1.1 Personal protective \nequipment (PPE)  is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards \n1.2 List of materials and \ntools are secured and \nfollowed according to \njob requirements \n1.3 Material,  tools and \nequipment are \nselected, inspected \nand prepared \nconsistent with job \nrequirements. \n1.4 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n1.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n \n \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n1.2 Green Building \nConcept relative to \nConstruction (3R, 5S) \n1.3 Safe handling and \nstandard specification \nof materials, tools and \nequipment  \n1.4 Markings and labels \n1.5 Company rules and \nregulations \n1.6 Mensuration \n1.7 Safe and effective use \nof hand tools \n1.8 Factors affecting \nproductivity \n1.9 Productivity work \nmeasurements \n1.10 \nWays of improving \nproductivity \n1.11 \nAdherence to work \nrequirements \n1.1 Using PPE \n1.2 Communicating \neffectively \n1.3 Following company \nrules and \nregulations \n1.4 Organizing \nmaterials to be \nused  \n1.5 Handling and use \nof materials, tools \nand equipment  \n1.6 Applying \nmensuration \n1.7 Implementing 3R \nand 5S       \n1.8 Reading and \nunderstanding \ndrawings\n\n--- PDF PAGE 92 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       88 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Erect scaffolds \n2.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 108