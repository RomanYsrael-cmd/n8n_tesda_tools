.5 Handling and use \nof materials, tools \nand equipment  \n1.6 Applying \nmensuration \n1.7 Implementing 3R \nand 5S       \n1.8 Reading and \nunderstanding \ndrawings\n\n--- PDF PAGE 92 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       88 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Erect scaffolds \n2.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n2.2 Scaffold systems are \nerected and stability is \nensured based on \nwork requirements \nand safety standards \n2.3 Work area is cleaned \naccording to safety \nand environmental \nregulations  \n2.4 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n2.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n2.2 Green Building Concept \nrelative to Construction \n(3R, 5S) \n2.3 Working at heights \nprocedures \n2.4 Safe handling of \nmaterials, tools and \nequipment  \n2.5 Markings and labels \n2.6 Company rules and \nregulations \n2.7 Mensuration \n2.8 Assembly and erection \nprocedures \n2.9 Factors affecting \nproductivity \n2.10 \nProductivity work \nmeasurements \n2.11 \nWays of improving \nproductivity \n2.1 Using PPE \n2.2 Communicating \neffectively \n2.3 Following company \nrules and \nregulations \n2.4 Organizing \nmaterials to be \nused  \n2.5 Handling and use \nof materials, tools \nand equipment \n2.6 Complying safety \nrequirements on \nerection procedure \n2.7     Implementing 3R \nand 5S\n\n--- PDF PAGE 93 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       89 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOW