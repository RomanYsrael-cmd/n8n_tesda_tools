        "source_text": "--- PDF PAGE 60 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       56 \n \nUNIT OF COMPETENCY \n:  \nFABRICATE, INSTALL AND REMOVE WOODEN  \n   \n \n \n \n \nFORMWORKS  \n \nUNIT CODE  \n \n \n: \nCON711302 \n \nUNIT DESCRIPTOR \n:  \nThis unit covers the knowledge, skills, and attitudes to  \nfabricate, install and remove wooden formworks. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Prepare \nmaterials, tools \nand equipment \n \n \n1.1 Personal protective \nequipment (PPE)  is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n1.2 List of materials, \nhand tools and \nequipment are \nsecured and followed \naccording to job \nrequirements \n1.3 Materials, tools and \nequipment are \nselected, inspected \nand prepared \nconsistent with job \nrequirements. \n1.4 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n1.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n1.2 Safe handling and \nstandard specification of \nmaterials, tools and \nequipment  \n1.3 Markings and labels \n1.4 Company rules and \nregulations \n1.5 Mensuration \n1.6 Green Building Concept \nrelative to Construction \n(3R, 5S) \n1.7 Economic use of \nmaterial \n1.8 Safe and effective use \nof hand tools \n1.9 Factors affecting \nproductivity \n1.10 \nProductivity work \nmeasurements \n1.11 \nWays of improving \nproductivity \n1.12 \nAdherence to work \nrequirements \n4.2 Using PPE \n4.3 Communicating \neffectively \n4.4 Following \ncompany rules \nand regulations \n4.5 Organizing \nmaterials to be \nused  \n4.6 Handling and use \nof materials, tools \nand equipment \n4.7 Applying \nmensuration \n4.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 61 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       57 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Lay-out and cut \ndimension of \nform sheating \nand stiffeners \n2.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n2.2 Form sheating and \nstiffeners are \nmeasured and \nmarked according \nto job \nspecifications. \n2.3 Form sheating and \nstiffeners are laid \nout and cut \naccording to \nrequired \ndimensions. \n2.4 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations  \n2.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n2.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n2.2 Safe handling and \nstandard specification \nof materials, tools and \nequipment  \n2.3 Markings and labels \n2.4 Company rules and \nregulations \n2.5 Mensuration \n2.6 Green Building Concept \nrelative to Construction \n(3R, 5S) \n2.7 Factors affecting \nproductivity \n2.8 Productivity work \nmeasurements \n2.9 Ways of improving \nproductivity \n2.10 \nAdherence to work \nrequirements \n \n2.1 Using PPE \n2.2 Communicating \neffectively \n2.3 Following company \nrules and \nregulations \n2.4 Organizing materials \nto be used  \n2.5 Handling and use of \nmaterials, tools and \nequipment \n2.6 Applying \nmensuration \n2.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 62 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       58 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Assemble and \nerect form \npanels and \ncomponents \n3.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n3.2 Sheatings are \npositioned and fixed \nto stiffeners \n3.3 Assembled form \npanels are checked \nfor squareness, \nlevelness, plumbness \nand alignment. \n3.4 Primary and \nsecondary supports \nare positioned and \nfixed to hold \nassembled form \npanels as per \ndrawings. \n3.5 Assembled form \npanels are checked \nfor compliance with \njob requirements. \n3.6 Work area is cleaned \naccording to safety \nand environmental \nregulations  \n3.7 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n3.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n3.2 Safe handling and \nstandard specification \nof materials, tools and \nequipment  \n3.3 Markings and labels \n3.4 Company rules and \nregulations \n3.5 Mensuration \n3.6 Green Building Concept \nrelative to Construction \n(3R, 5S) \n3.7 Assembly and erection \nprocedures \n3.8 Factors affecting \nproductivity \n3.9 Productivity work \nmeasurements \n3.10 \nWays of improving \nproductivity \n \n3.1 Using PPE \n3.2 Communicating \neffectively \n3.3 Following \ncompany rules \nand regulations \n3.4 Organizing \nmaterials to be \nused  \n3.5 Handling and use \nof materials, tools \nand equipment \n3.6 Applying \nmensuration \n3.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 63 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       59 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Erect wooden \nscaffolds \n \n4.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n4.2 Soleplates/ timber \nplanks are prepared, \nplaced and spaced \naccordingly \nconsidering ground \nsurface conditions \nbased on design \nrequirements \n4.3 Wooden scaffold \ncomponents are \nerected, plumbed and \nleveled based on \ndesign requirements \n4.4 Wooden scaffolds \nsystems are checked \nbased on design \nrequirements \n4.5 Lifeline for fall \nprotection devices \n(harness) are installed \nin accordance with job \nspecification and \nOSHS requirements. \n4.6 Work area is cleaned \naccording to safety \nand environmental \nregulations  \n \n \n4.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n4.2 Working at heights \nprocedures \n4.3 Safe handling and \nstandard specification of \nmaterials, tools and \nequipment  \n4.4 Markings and labels \n4.5 Company rules and \nregulations \n4.6 Mensuration \n4.7 Green Building Concept \nrelative to Construction \n(3R, 5S) \n4.8 Assembly and erection \nprocedures \n4.9 Factors affecting \nproductivity \n4.10 Productivity work \nmeasurements \n4.11 Ways of improving \nproductivity \n5.1 Using PPE \n5.2 Communicating \neffectively \n5.3 Following \ncompany rules \nand regulations \n5.4 Organizing \nmaterials to be \nused  \n5.5 Handling and \nuse of materials, \ntools and \nequipment \n5.6 Applying \nmensuration \n5.7 Complying \nrequirements of \nthe erection \nprocedure  \n5.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 64 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       60 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5. Strip form panels \nand dismantle \nscaffold \n \n5.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards \n5.2 Tools, equipment and \nstaging area are \nprepared  \n5.3 Bracing, supports \nand form panels are \nremoved as \nscheduled \naccordingly \n5.4 Shores and scaffolds \nare removed \naccording to \nschedule \n5.5 Panels and other \ncomponents are \nsorted, clean and \nstored for the next re-\nuse \n5.6 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n5.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n5.2 Working at heights \nprocedures \n5.3 Safe handling and \nstandard specification \nof materials, tools and \nequipment  \n5.4 Markings and labels \n5.5 Company rules and \nregulations \n5.6 Green Building Concept \nrelative to Construction \n(3R, 5S) \n5.7 Stripping and \ndismantling schedule \n5.8 Stripping and \ndismantling procedures \n5.9 Factors affecting \nproductivity \n5.10 Productivity work \nmeasurements \n \n5.1 Using PPE \n5.2 Communicating \neffectively \n5.3 Following \ncompany rules \nand regulations \n5.4 Organizing \nmaterials to be \nused  \n5.5 Handling and use \nof materials, tools \nand equipment \n5.6 Complying \nrequirements in \nstripping and \ndismantling \n5.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 65 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       61 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n6. Clean and store \nreusable form \npanels and \ncomponents \n \n6.1 Personal protective \nequipment (PPE)  is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n6.2 Materials such as \nscaffolding and \nformworks are \nrecovered and \nstockpiled according \nto company rules and \nprocedures \n6.3 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n6.4 Tools, equipment and \nother materials are       \ncleaned after use. \n6.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n6.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n6.2 Safe handling and \nstandard specification of \nmaterials, tools and \nequipment  \n6.3 Green Building Concept \nrelative to Construction \n(3R, 5S) \n6.4 Safety signs and \nsymbols \n6.5 Adherence to work \nrequirements \n \n6.1 Working safely \n6.2 Organizing \nmaterials to be \nstored \n6.3 Handling and use \nof materials, tools \nand equipment \n6.4 Communicating \neffectively \n6.5 Using PPE \n6.6 Implementing 3R \nand 5S\n\n--- PDF PAGE 66 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       62 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal  \n    Protective   \n    Equipment (PPE) \nInclude: \n1.1 Hard hat \n1.2 Safety shoes \n1.3 Gloves \n1.4 Working clothes \n1.5 Goggles \n1.6 Vest \n1.7 Full body harness \n \n3. Materials, tools and \nequipment \n \n \n \n \nMay include: \n3.1 Lumber \n3.2 Plywood \n3.3 Nails \n3.4 G.I. Wires \n3.5 Chalk line box \n3.6 Pen Marker/ Pencil/Chalk stone \n3.7 Claw hammer \n3.8 Sledge hammer \n3.9 Level hose/ level bar \n3.10 Pull push rule/ steel tape/ laser meter \n3.11 Nylon string \n3.12 Plumb bob \n3.13 Steel square  \n3.14 Carpenter’s square \n3.15 Lifting equipment \n3.16 Crow bar \n3.17 Cross-cut saw \n3.18 Rip saw \n3.19 Adjustable wrench \n \n \n4. Job requirements \nMay include: \n3.1 Approved working drawings \n3.2 Sketches/ Shop drawings \n \n5. Ground surface \nconditions \nMay include: \n5.1 Compacted \n5.2 Level \n5.3 Slab on grade\n\n--- PDF PAGE 67 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       63 \n6. Wooden scaffold \ncomponents \nMay include: \n6.1 Platforms \n6.2 Vertical support \n6.3 Shoring \n6.4 Sole plates \n6.5 Lateral and diagonal supports \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared materials, tools and equipment consistent with \njob requirements \n1.2 \nLaid-out and cut dimension of form sheating and stiffeners \naccording to required dimensions \n1.3 \nAssembled and erected form panels and components \ncompliance with job requirements \n1.4 \nErected wooden scaffolds based on design requirements \n1.5 \nStripped form panels and dismantled scaffold according to \nschedule \n1.6 \nCleaned and stored reusable form panels and components \n1.7 \nObserved and complied with safety and environmental \nregulations \n1.8 \nCommunicated with others to ensure effective work \noperation \n1.9 \nObserved and complied with the productivity requirements \n1.10 Complied with attitudinal work requirements \n \n2. Resource implications \n \nThe following resources should be provided: \n2.1    Actual or simulated workplace \n2.2    Tools, materials and equipment needed to perform the \nrequired tasks \n2.3    References and manuals \n2.4 \nPPE \n2.5 \nFirst Aid Kit \n3. Method of assessment \n \nCompetency in this unit may be assessed through: \n3.1    Demonstration/Observation with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
