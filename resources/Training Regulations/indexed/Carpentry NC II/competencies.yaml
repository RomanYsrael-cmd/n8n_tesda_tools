        "source_text": "--- PDF PAGE 75 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       71 \nUNIT OF COMPETENCY \n:  \nINSTALL CEILING AND WALL FRAMES AND  \nPANELS \n \nUNIT CODE  \n \n \n: \nCON711304 \n \nUNIT DESCRIPTOR                  :  \nThis unit covers the knowledge, skills, and \nattitudes in the installation of ceiling and wall \nframes and panels.  \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Prepare \nmaterials, tools \nand equipment \n \n \n \n1.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n1.2 List of materials, \ntools and \nequipment are \nsecured and \nfollowed according \nto job requirements \n1.3 Material, tools and \nequipment are \nselected, inspected \nand prepared \nconsistent with job \nrequirements. \n1.4 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n1.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n \n \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n1.2 Green Building \nConcept relative to \nConstruction (3R, 5S) \n1.3 Safe handling and \nstandard specification \nof materials, tools and \nequipment \n1.4 Markings and labels \n1.5 Company rules and \nregulations \n1.6 Mensuration \n1.7 Safe and effective use \nof hand tools \n1.8 Factors affecting \nproductivity \n1.9 Productivity work \nmeasurements \n1.10 \nWays of improving \nproductivity \n1.11 \nAdherence to work \nrequirements \n1.1 Using PPE \n1.2 Communicating \neffectively \n1.3 Following \ncompany rules \nand regulations \n1.4 Organizing \nmaterials to be \nused  \n1.5 Handling and use \nof materials, tools \nand equipment \n1.6 Applying \nmensuration \n1.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 76 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       72 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.  Erect movable   \n     scaffolds or   \n     working   \n     platforms \n \n2.1 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith 1080 of \nOccupational Safety \nand Health Standards. \n2.2 Scaffolds or \nplatforms and \ncomponents are \nerected and stability \nis ensured based on \nwork requirements \nand safety standards \n2.3 Work area is cleaned \naccording to safety \nand environmental \nregulations  \n2.4 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n \n2.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n2.2 Green Building Concept \nrelative to Construction \n(3R, 5S) \n2.3 Working at heights \nprocedures \n2.4 Safe handling and \nstandard specification of \nmaterials, tools and \nequipment  \n2.5 Company rules and \nregulations \n2.6 Mensuration \n2.7 Factors affecting \nproductivity \n2.8 Productivity work \nmeasurements \n2.9 Ways of improving \nproductivity \n2.1 Using PPE \n2.2 Communicating \neffectively \n2.3 Following \ncompany rules \nand regulations \n2.4 Organizing \nmaterials to be \nused  \n2.5 Handling and use \nof materials, tools \nand equipment \n2.6 Applying \nmensuration \n2.7 Implementing 3R \nand 5S       \n2.8 Complying safety \nrequirements on \nerection procedure\n\n--- PDF PAGE 77 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       73 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Layout ceiling \nelevation, wall \nlocation and \nposition of \nframing system \n3.1 Personal protective \nequipment (PPE)  is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n3.2 Exact layout is marked \nfor ceiling and wall \nframes based on \nworking drawings \n3.3 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n3.4 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n3.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry  \n3.2 Green Building \nConcept relative to \nConstruction (5S) \n3.3 Signs and symbols  \n3.4 Company rules and \nregulations \n3.5 Methods and \ntechniques in \nmeasurements  \n3.6 Understanding \ninstructions \n3.7 Factors affecting \nproductivity \n3.8 Productivity work \nmeasurements \n3.9 Ways of improving \nproductivity \n3.10 \nAdherence to work \nrequirements \n \n3.1 Applying \nmensuration \n3.2 Handling and use \nof materials, tools \nand equipment \n3.3 Applying productive \nmethods and \ntechniques  \n3.4 Using PPE \n3.5 Communicating \neffectively \n3.6 Following company \nrules and \nregulations \n3.7 Following \ninstructions \n3.8 Reading and \nunderstanding \ndrawings \n3.9 Implementing 5S\n\n--- PDF PAGE 78 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       74 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n 4.  Fix frames and  \n      panels \n \n4.1 Personal protective \nequipment (PPE)  is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards \n4.2 Frames are installed \nbased on \nspecifications \n4.3 Installed frames are \nchecked for \nsquareness, \nlevelness, plumbness \nand alignment. \n4.4 Panels are fixed to  \n frames based on   \nworking drawings \n4.5 Work area is \ncleaned according to \nsafety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n4.6 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n4.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning Occupational \nSafety and Health in the \nConstruction Industry \n4.2 Green Building Concept \nrelative to Construction \n(3R, 5S) \n4.3 Safe handling and \nstandard specification of \nmaterials, tools and \nequipment  \n4.4 Markings and labels \n4.5 Company rules and \nregulations \n4.6 Mensuration \n4.7 Installation procedures \n4.8 Factors affecting \nproductivity \n4.9 Productivity work \nmeasurements \n4.10 \nWays of improving \nproductivity \n \n4.1 Using PPE \n4.2 Communicating \neffectively \n4.3 Following \ncompany rules \nand regulations \n4.4 Organizing \nmaterials to be \nused  \n1.8 Handling and use \nof materials, tools \nand equipment \n4.5 Applying \nmensuration \n4.6 Reading and \nunderstanding \ndrawings \n4.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 79 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       75 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5. Dismantle \nmovable   \n     scaffolds or   \n     working   \n     platforms  \n5.1 Personal protective \nequipment (PPE)  is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n5.2 Tools for dismantling \nand temporary storage \narea are prepared \n5.3  Scaffolds or platforms \ncomponents are \nremoved, cleaned, \nsorted and stored \naccordingly for re-use \n5.4 Work area is cleaned \naccording to safety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & 42) \n5.5 Required output is \ncompleted as specified \nby the immediate \nsupervisor based on \nwork schedule. \n \n5.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n5.2 Green Building \nConcept relative to \nConstruction (3R, 5S) \n5.3 Working at heights \nprocedures \n5.4 Safe handling and \nstandard specification \nof materials, tools and \nequipment  \n5.5 Markings and labels \n5.6 Company rules and \nregulations \n5.7 Dismantling \nprocedures \n5.8 Factors affecting \nproductivity \n5.9 Productivity work \nmeasurements \n \n5.1 Using PPE \n5.2 Communicating \neffectively \n5.3 Following company \nrules and \nregulations \n5.4 Organizing \nmaterials to be \nused  \n5.5 Handling and use \nof materials, tools \nand equipment \n5.6 Complying \nrequirements in \ndismantling \nscaffolds and \ncomponents \n5.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 80 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       76 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n6. Perform \nhousekeeping \n6.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards. \n6.2 Excess/un-used \nmaterials are \nrecovered and \nstockpiled according \nto company rules and \nprocedures \n6.3 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n6.4 Tools and other \nmaterials are       \ncleaned after use \n6.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n6.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n6.2 Green Building \nConcept relative to \nConstruction (3R, 5S) \n6.3 Safe handling and \nstandard specification \nof materials, tools and \nequipment \n6.4  Safety signs and \nsymbols \n6.5 Adherence to work \nrequirements \n \n6.1 Working safely \n6.2 Organizing \nmaterials to be \nstored \n6.3 Handling and use \nof materials, tools \nand equipment \n6.4  Communicating \neffectively \n6.5 Using PPE \n6.6 Implementing 3R \nand 5S\n\n--- PDF PAGE 81 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       77 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal  \n    Protective   \n    Equipment (PPE) \nInclude: \n1.1 Hard hat \n1.2 Safety shoes \n1.3 Gloves \n1.4 Working clothes \n1.5 Goggles \n1.6 Vest \n \n5. Materials, tools and \nequipment \n  \n \n \n \n \nMay include: \n2.1 Lumber \n2.2  Nails (Common wire nail and concrete nail) \n2.3  G.I. Wires \n2.4 Chalk line box \n2.5 Pen Marker/ Pencil/Chalk stone \n2.6 Claw hammer \n2.7 Planer \n2.8 Rip saw \n2.9 Cross-cut saw \n2.10 Level hose/ level bar \n2.11 Pull push rule/ steel tape/ laser meter \n2.12 Nylon string \n2.13 Plumb bob \n2.14 Steel square/Carpenter’s square \n2.15 Scaffolds and components \n2.16 Adjustable wrench \n \n6. Job requirements \nMay include: \n5.1 Approved working drawings \n5.2 Sketches/ Shop drawings\n\n--- PDF PAGE 82 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       78 \nEVIDENCE GUIDE \n \n1. Critical aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared materials, tools and equipment consistent with job \nrequirements \n1.2   Erected movable scaffolds or working platforms based on \nwork requirements and safety standards \n1.3   Laid out ceiling elevation, wall location and position of \nframing system based on working drawings \n1.4   Fixed frames and panels based on working drawings \n1.5   Dismantled movable scaffolds or working platforms   \n1.6   Performed housekeeping  \n1.7   Observed and complied with safety and environmental   \n  regulations \n1.8   Communicated with others to ensure effective work     \n  operation \n1.9   Observed and complied with the productivity requirements \n1.10   Complied with attitudinal work requirements \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n5.1 Actual or simulated workplace \n5.2 Tools, materials and equipment needed to perform the \nrequired tasks \n5.3 References and manuals \n5.4 PPE \n5.5 First Aid Kit \n3. Method of   \n     assessment \n \nCompetency in this unit may be assessed through: \n3.1  Demonstration/Observation with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
