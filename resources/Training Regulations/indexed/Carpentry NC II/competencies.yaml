  "source_section_text": "SECTION 1 CARPENTRY NC II\n\nThe CARPENTRY NC II Qualification consists of competencies on rough\nand finishing carpentry that a person must achieve in fabrication and installation of\nwooden materials and basic roof assembly.\n\nThis Qualification is packaged from the competency map of Construction –\nCivil Works sub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the\nworkplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON711301\nCON711302\nCON711303\nCON711304\nCON711305\nCON711306\nCON711307\nCON711308\nLayout reference lines\nFabricate, install and remove wooden formworks\nInstall wooden door jamb, window frame and panels\nInstall ceiling and wall frames and panels\nFabricate and install wooden stairs\nInstall wooden floor supports and panels\nFabricate and install roofing system\nFabricate and install wooden cabinet\n\nA person who has achieved this Qualification is competent to be a –\n Rough and Finishing Carpenter\n\n--- PDF PAGE 6 ---\nCarpentry NC II Revision 01 Promulgated (10/29/2018) 2"
}
