        "source_title": "PRACTICE ENTREPRENEURIAL SKILLS IN THE WORKPLACE",
        "source_text": "--- PDF PAGE 37 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       33 \n \n \nUNIT OF COMPETENCY \n: PRACTICE ENTREPRENEURIAL SKILLS IN THE \nWORKPLACE  \n \n \n \nUNIT CODE \n: 400311218 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the outcomes required to apply \nentrepreneurial workplace best practices and implement \ncost-effective operations \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Apply     \n   entrepreneurial   \nworkplace best   \npractices \n  \n1.1 Good practices \nrelating to workplace \noperations are \nobserved and selected \nfollowing workplace \npolicy. \n1.2 Quality procedures \nand practices are \ncomplied with \naccording to workplace \nrequirements.  \n1.3 Cost-conscious habits \nin resource utilization \nare applied based on  \nindustry standards.  \n1.1 Workplace best \npractices, policies \nand criteria \n1.2 Resource \nutilization \n1.3Ways in fostering \nentrepreneurial \nattitudes: \n- Patience \n- Honesty \n- Quality-\nconsciousness \n- Safety-\nconsciousness \n- Resourcefulness  \n1.1 Communication \nskills \n1.2 Complying with \nquality procedures \n \n \n \n2. Communicate \nentrepreneuri\nal workplace \nbest practices  \n \n2.1 Observed Good \npractices relating to \nworkplace operations \nare communicated to \nappropriate person. \n2.2 Observed quality \nprocedures and \npractices are \ncommunicated to  \nappropriate person \n2.3 Cost-conscious habits \nin resource utilization \nare communicated \nbased on industry \nstandards.  \n2.1 Workplace best \npractices, \npolicies and \ncriteria \n2.2  Resource \nutilization \n2.3  Ways in fostering \nentrepreneurial \nattitudes: \n- Patience \n- Honesty \n- Quality-\nconsciousness \n- Safety-\nconsciousness \n- Resourcefulness  \n2.1 Communication \nskills \n2.2 Complying with \nquality procedures \n2.3 Following \nworkplace \ncommunication \nprotocol\n\n--- PDF PAGE 38 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       34 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Implement \ncost-effective \noperations \n3.1 Preservation and \noptimization of \nworkplace resources is \nimplemented in \naccordance with  \nenterprise policy \n3.2 Judicious use of \nworkplace tools, \nequipment and \nmaterials are observed \naccording to manual \nand work \nrequirements. \n3.3 Constructive \ncontributions to office \noperations are made \naccording to enterprise \nrequirements. \n3.4 Ability to work within \none’s allotted time and \nfinances is sustained.  \n \n3.1  Optimization of \nworkplace \nresources \n3.2  5S procedures \nand concepts \n3.3  Criteria for cost-\neffectiveness \n3.4  Workplace \nproductivity \n3.5  Impact of \nentrepreneurial \nmindset to \nworkplace \nproductivity \n3.6  Ways in fostering \nentrepreneurial \nattitudes: \n- Quality-\nconsciousness \n- Safety-\nconsciousness \n3.1 Implementing \npreservation and \noptimizing \nworkplace \nresources \n3.2 Observing \njudicious use of \nworkplace tools, \nequipment and \nmaterials \n3.3 Making \nconstructive \ncontributions to \noffice operations \n3.4 Sustaining ability \nto work within \nallotted time and \nfinances\n\n--- PDF PAGE 39 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       35 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.Good practices \nMay include: \n1.1 Economy in use of resources \n1.2 Documentation of quality practices  \n \n2.Resources utilization \nMay include: \n2.1 Consumption/ use of consumables \n2.2 Use/Maintenance of assigned equipment \nand furniture \n2.3 Optimum use of allotted /available time \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency  \nAssessment requires evidence that the candidate: \n1.1   Demonstrated ability to identify and sustain cost-\neffective activities in the workplace  \n1.2   Demonstrated ability to practice entrepreneurial \nknowledge, skills and attitudes in the workplace. \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1    Simulated or actual workplace \n2.2    Tools, materials and supplies needed to \ndemonstrate the required tasks  \n2.3     References and manuals \n2.3.1 Enterprise procedures manuals \n2.3.2 Company quality policy \n \n3. Methods of \nAssessment \nCompetency in this unit should be assessed through: \n3.1 Interview \n3.2 Third-party report \n \n4.Context of \nAssessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
