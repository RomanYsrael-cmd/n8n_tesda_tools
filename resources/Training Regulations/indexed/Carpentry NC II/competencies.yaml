        "descriptor": "This unit covers the knowledge, skills and attitudes required to gather, interpret and convey information in response to workplace requirements. ELEMENTS",
        "elements": [
          {
            "number": 1,
            "title": "Obtain and convey workplace information",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Specific and relevant information is accessed from appropriate sources"
              },
              {
                "number": "1.2",
                "text": "Effective questioning, active listening and speaking skills are used to gather and convey information"
              },
              {
                "number": "1.3",
                "text": "Appropriate medium is used to transfer information and ideas"
              },
              {
                "number": "1.4",
                "text": "Appropriate non- verbal communication is used"
              },
              {
                "number": "1.5",
                "text": "Appropriate lines of communication with supervisors and colleagues are identified and followed"
              }
            ],
            "required_knowledge": [
              "1.1 Effective verbal and nonverbal communication",
              "1.2 Different modes of communication",
              "1.3 Medium of communication in the workplace",
              "1.4 Organizational policies",
              "1.5 Communication procedures and systems",
              "1.6 Lines of Communication",
              "1.7 Technology relevant to the enterprise and the individual’s work responsibilities",
              "1.8 Workplace etiquette"
            ],
            "required_skills": [
              "1.1 Following simple spoken language",
              "1.2 Performing routine workplace duties following simple written notices",
              "1.3 Participating in workplace meetings and discussions",
              "1.4 Preparing work- related documents",
              "1.5 Estimating, calculating and recording routine workplace measures",
              "1.6 Relating/ Interacting with people of various levels in the workplace",
              "1.7 Gathering and providing basic information in response to workplace requirements",
              "1.8 Basic business writing skills"
            ],
            "source_number": 1
          },
          {
            "number": 2,
            "title": "Perform duties following workplace instructions",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Defined workplace procedures for the location and storage of information are used",
                "source_number": "1.6"
              },
              {
                "number": "2.2",
                "text": "Personal interaction is carried out clearly and concisely",
                "source_number": "1.7"
              },
              {
                "number": "2.3",
                "text": "Written notices and instructions are read and interpreted in accordance with organizational guidelines",
                "source_number": "2.1"
              },
              {
                "number": "2.4",
                "text": "Routine written instruction are followed based on established procedures",
                "source_number": "2.2"
              },
              {
                "number": "2.5",
                "text": "Feedback is given to workplace supervisor based instructions/ information received",
                "source_number": "2.3"
              },
              {
                "number": "2.6",
                "text": "Workplace interactions are conducted in a courteous manner",
                "source_number": "2.4"
              },
              {
                "number": "2.7",
                "text": "Where necessary, clarifications about routine workplace procedures and matters concerning conditions of employment are sought and asked from appropriate sources",
                "source_number": "2.5"
              },
              {
                "number": "2.8",
                "text": "Meetings outcomes are interpreted and implemented",
                "source_number": "2.6"
              }
            ],
