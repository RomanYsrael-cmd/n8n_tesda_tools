ing 3R \nand 5S\n\n--- PDF PAGE 89 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       85 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal  \n    Protective   \n    Equipment (PPE) \n \nInclude: \n1.1 \nHard hat \n1.2 \nSafety shoes \n1.3 \nGloves \n1.4 \nWorking clothes \n1.5 \nGoggles \n1.6 \nVest \n \n2. Job requirements \nMay include: \n2.1 Approved working drawings \n2.2 Sketches/ Shop drawings \n \n3. Materials, tools and \nequipment \n \n \n \n \nMay include: \n3.1 Lumber \n3.2  Nails (common wire) \n3.3  G.I. Wires \n3.4 Chalk line box \n3.5 Pen Marker/ Pencil/Chalk stone \n3.6 Wood adhesive \n3.7 Claw hammer \n3.8 Chisel \n3.9 Level hose/ level bar \n3.10 Pull push rule/ steel tape/ laser meter \n3.11 Nylon string \n3.12 Plumb bob \n3.13 Steel square/Carpenter’s square \n3.14 Grinder \n3.15 Sander \n3.16 Circular saw/Jig saw with vacuum \n3.17 Planer \n3.18 Electric drill with bits \n3.19 Adjustable wrench \n \n3. Scaffold systems \nMay include: \n3.1 \nPlatforms \n3.2 \nBraces \n3.3 \nShoring \n3.4 \nBase- plates \n3.5 \nLateral, diagonal and vertical supports\n\n--- PDF PAGE 90 ---\nCarpentry NC II    Revision 01                    Promulgated  (10/29/2018)                       86 \n4.Stairs assembly \nMay include: \n4.1Stringer \n4.2 \nThread \n4.3 \nHandrail \n4.4 \nBalusters \n4.5 \nLanding"
