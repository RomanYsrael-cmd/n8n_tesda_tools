    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY\nEQUIPMENT OPERATION (RIGID OFF-HIGHWAY DUMP TRUCK) NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - OFF-HIGHWAY DUMP\n TRUCK (RIGID)\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 24 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nrole and responsibility in\na team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n5.2 Request Materials\n5.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC II\n\n OFF-HIGHWAY DUMP TRUCK (RIGID)\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of off-highway dump truck (rigid) in accordance with industry\nstandards. It covers core competencies such as: perform pre- and post operation\nprocedures; perform equipment operation; and perform basic preventive\nmaintenance for a given off-highway dump truck (rigid).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost operation\nprocedure for Off-\nhighway Dump\nTruck (Rigid)\n1.1 Identify off-highway\n dump truck\n types / components\n parts\n1.2 Perform visual check of\n equipment\n1.3 Check BLOWAF for off-\n highway dump truck\n• Battery\n• Light\n• Oil\n• Water\n• Air\n• Fuel\n1.4 Check off-highway\n dump truck systems\n operation\n1.5 Check safety devices\n & accessories\n1.6 Perform post operation\n check\n\nLecture\nPractical /\nDemonstration\n\n• Observation\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform productive\noperation for Off-\nhighway Dump\nTruck (Rigid)\n2.1 Perform loading\n operations\n2.2 Perform hauling\n operations\n2.3 Perform dumping\n operations\nLecture\nPractical /\nDemonstration\n\n• Observation\nDemonstration\nand interview\n• Written test\n\n3. Perform basic\npreventive\nmaintenance\nservicing for\n Off-highway Dump\n Truck (Rigid)\n3.1 Perform safety\n practices, and\n housekeeping\n3.2 Perform preventive\n maintenance and\n servicing\nLecture\nPractical /\nDemonstration\n\n• Observation\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• Can communicate both oral and written\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computation.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of off-highway dump truck (rigid).\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1set\n• wrenches (box and\nopen-end 8-24\nmm- metric & 7/16\n–1” -English )\n1 unit\n• Off-Highway\nDump Truck\n(Compactor)(MO\nA /rental)\n5 kls.\n• Multi-purpose\ngrease\n1set\n• Hammer ballpeen\n(3-4 lbs)\n1 unit\n• Low bed\ntrailer(MOA /\nrental)\n4 liters • Engine oil\n ( SAE 15w40)\n1set\n• Pliers( mechanical\n10 “)\n1 unit\n• Vacuum cleaner\n20\nliters\n• Hydraulic /\nsteering fluid\n(TELLUS\n68/10W)\n1pc\n\n• Adjustable wrench\n(18 “)\n\n10\nliters\n• Final drive/\ndifferential\n(gear oil\nGP90/ 140)\n1pc.\n• Grease gun\n\n10\nliters\n• Transmission\noil (ATF)\n1set\n• Screw driver ( 10 “\nflat & Philips)\n\n4 liters • Water coolant\n1pc.\n• Putty knife\n\n200\nliters\n• Diesel fuel\n\n1pc.\n• Pry bar (heavy duty)\n\n5 liters • Battery\ndistilled water\n1 pc\n• Tire gauge (0-150\npsi)\n\n1 pair\n• Working\nclothes\n\n10\npairs\n• Safety shoes\n\n10\npairs\n• Gloves\n\n10 pcs.\n•Goggles\n\n10 pcs.\n•Dust Mask\n\n10 pcs •Hard hat\n\n2 units • Test weights\n- 3 tons\n - 10 tons\n\n1 pc\n• Crawler crane\nminiature\n\n1 pc\n• Operator’s\nmanual with\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION\n\nload chart\n\n3.5\nTRAINING FACILITIES\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION\n\nThe off-highway dump truck (rigid) operation workshop must be made of\nreinforced concrete or steel structure. The size must be suited on the\nrequirements of the competencies. The class size of 25 students/trainees is\nreserved for the lecture room and the practical demonstration area for carrying\nout minor off-highway dump truck parts maintenance. Most of the learning\nactivities are performed individually in the students/trainees work area.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 meters\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n 224\nWorking field\n0.25 hectare (MOA/Rental)\n\n 3.6\nTRAINERS’ QUALIFICATION\n\n HEAVY EQUIPMENT OPERATION (RIGID OFF-HIGHWAY DUMP\n TRUCK)\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Heavy Equipment Operation (Rigid off-\nhighway dump truck) – NCII\n• Must have undergone training on Training Methodology II (TM II)\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience*\n• Must be a civil service eligible (for government position or\nappropriate professional license issued by the Professional\nRegulatory Commission)\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03"
  },
