    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - OFF-HIGHWAY DUMP\n TRUCK (RIGID)\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 24 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nrole and responsibility in\na team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n5.2 Request Materials\n5.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC II\n\n OFF-HIGHWAY DUMP TRUCK (RIGID)\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of off-highway dump truck (rigid) in accordance with industry\nstandards. It covers core competencies such as: perform pre- and post operation\nprocedures; perform equipment operation; and perform basic preventive\nmaintenance for a given off-highway dump truck (rigid).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost operation\nprocedure for Off-\nhighway Dump\nTruck (Rigid)\n1.1 Identify off-highway\n dump truck\n types / components\n parts\n1.2 Perform visual check of\n equipment\n1.3 Check BLOWAF for off-\n highway dump truck\n• Battery\n• Light\n• Oil\n• Water\n• Air\n• Fuel\n1.4 Check off-highway\n dump truck systems\n operation\n1.5 Check safety devices\n & accessories\n1.6 Perform post operation\n check\n\nLecture\nPractical /\nDemonstration\n\n• Observation\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform productive\noperation for Off-\nhighway Dump\nTruck (Rigid)\n2.1 Perform loading\n operations\n2.2 Perform hauling\n operations\n2.3 Perform dumping\n operations\nLecture\nPractical /\nDemonstration\n\n• Observation\nDemonstration\nand interview\n• Written test\n\n3. Perform basic\npreventive\nmaintenance\nservicing for\n Off-highway Dump\n Truck (Rigid)\n3.1 Perform safety\n practices, and\n housekeeping\n3.2 Perform preventive\n maintenance and\n servicing\nLecture\nPractical /\nDemonstration\n\n• Observation\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION"
  },
