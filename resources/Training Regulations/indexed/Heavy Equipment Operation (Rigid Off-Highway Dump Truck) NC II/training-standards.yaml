      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY\nEQUIPMENT OPERATION (RIGID OFF-HIGHWAY DUMP TRUCK) NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - OFF-HIGHWAY DUMP\n TRUCK (RIGID)\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 24 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nrole and responsibility in\na team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMEN