        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency to\nbe considered\nAssessment must confirm evidence that the candidate:\n1.1 Demonstrates ability to comply with company rules and\nregulations\n1.2 Demonstrates ability to operate off-highway dump truck (rigid)\nin accordance with the established operating procedures\n1.3 Demonstrates ability to carry-out safe work practices\n1.4 Demonstrates knowledge of functions of instrument panel\ngauges, controls and alert indicators.\n1.5 Demonstrates ability to determine and observe correct\npositioning and allowable load capacity for off-highway dump\ntruck (rigid)\n1.6 Demonstrates ability to observe safe and efficient\nloading/hauling/dumping procedures from loading area to\ndumping site\n1.7 Demonstrates ability to communicate.\n2. Underpinning\nknowledge,\nattitudes\n\n2.1 Familiarity with company rules and regulations\n2.2 Knowledge of dump truck operating procedures\n2.3 Safe work procedures and practices\n2.4 Dump truck functions of instrument panel gauges, controls,\nalert/warning indicators and their uses.\n2.5 Comprehension of dump truck operations and maintenance\nmanual.\n2.6 Correct positioning and allowable load capacity of dump truck\n2.7 Safe and efficient loading/hauling/dumping procedures\n2.8 Defensive-driving and hazard-avoidance techniques\n2.9 Site/Terrain layout and obstacles\n2.10 Types of materials to be loaded\n2.11 Positive work values (time and cost conscious, etc.)\n3. Underpinning\nskills\n3.1 Accomplishing dump truck checklist and reports\n3.2 Reporting dump truck component failure\n3.3 Performing actual operation procedure of dump truck\n3.4 Performing safety procedures and practices\n3.5 Determining type and load capacity of dump truck\n3.6 Calculation and mensuration skills\n3.7 Defensive driving skills\n4. Resource\nimplications\nThings necessary for the conduct of assessment\n4.1 Access to dump truck and job site/terrain\n4.2 Available loads\n4.4 PPE\n4.5 Spotter\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Method of\nassessment\nCompetency in this unit must be assessed through\n5.1 Written/Oral questioning\n5.2 Observation/ practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n6.1 Assessment maybe conducted in the work site or in a\n simulated venue.\n6.2 Competency shall be assessed while work is being undertaken\nIndependently.\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION"
        },
        "source_text": "CON833318\nUNIT DESCRIPTOR:\nThis unit deals with the knowledge, skills and\nattitude\nrequired\nfor\nperforming\nproductive\noperation for off-highway dump truck (rigid). It\ncovers the skills required to perform loading,\nhandling\nand\ndumping\noperations\nof\nearth\nmaterials.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Perform loading operations\n\n1.1 Safe work practices are observed in\nAccordance with company rules and\n Regulations.\n1.2 Communication is established with the station\n during operation.\n1.3 Correct positioning and allowable load capacity\nof truck is observed at the loading area.\n1.4 Required control levers are applied according\nto operations manual.\n1.5 Engine is set at low idle speed during\n waiting/loading operation.\n1.6 Unexpected situations are responded in line\n with company rules and regulations.\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform hauling operations\n2.1 Communication is maintained with the station\nduring operation.\n2.2 Site hazards and appropriate safe operating\ntechniques are identified according to safe\noperating practices.\n2.3 Retarder brake is applied with appropriate\nspeed prior to downhill operation.\n2.4 Appropriate engine RPM is observed during\ntraveling.\n2.5 Required travel speed is observed according\nto work site condition.\n2.6 Appropriate brake is applied when necessary.\n2.7 Power Take-Off switch is disengaged during\noperations.\n2.8 Road safety precautions are observed\nespecially when negotiating on narrow/curve\nroads.\n2.9 Unexpected situations are responded in line\nwith company rules and regulations.\n3. Perform dumping operations\n3.1 Communication is maintained with the station\nduring operation.\n3.2 Proper illumination of dumpsite is checked.\n3.3 Assistance from spotter is obtained when\nnecessary.\n3.4 Proper dumping procedures are observed.\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safe work\npractices\n1.1 Observed safety awareness\n1.2 Observed firm and flat ground for the loading and dumping area\n1.3 Wear minimum PPE\n1.4 Checked for proper illumination of work site\n1.5 Observed 3-point contact in embarking on and alighting from\n equipment\n1.7 All controls must be in neutral position and parking brake\n applied before alighting from equipment\n1.7 Observed proper housekeeping\n2. Communication\n2.1 Hand signal\n2.2 Radio\n2.3 Horn/Light signal\n3. Control levers\n3.1 Parking brake\n3.2 Transmission gear shift\n3.3 Steering\n4. Unexpected\nsituations\nMay include but are not limited to:\n4.1 Sudden engine breakdown\n4.2 Busted hydraulic hose and oil leakages\n4.3 Sudden loss of brake\n4.4 Loss control of steering\n4.5 Sudden ground failure\n4.6 Force majeure e.g., earthquake, fire, tornado\n4.7 Operator fatigue or sickness/condition\n4.8 Accidents/incidents\n5. Site hazards\nMay include but are not limited to:\n5.1 Landslides\n5.2 Flood\n5.3 Heavy rains\n5.4 Excavations\n5.5 Darkness or poor visibility\n5.6 Uneven/unstable terrain\n6. Appropriate\nengine RPM\n6.1 700 – 2,200 RPM\n7. Traveling\n7.1 Uphill surface\n7.2 Downhill surface\n7.3 Level surface\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION\n\n8. Brake\n8.1 Service\n8.2 Secondary/Emergency/ASBS\n8.3 Exhaust\n9. Proper dumping\nprocedures\n9.1 Dump truck is properly positioned in the dumping area in\n accordance with site condition.\n9.2 Transmission is set at neutral position and parking brake is\n engaged.\n9.3 Horn is sounded prior to dump box raise/lower position.\n9.4 Dump box is raised/lowered in smooth and controlled engine\n RPM.\n9.5 Unexpected situations are responded in line with company rules\n and regulations.\n\n--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency to\nbe considered\nAssessment must confirm evidence that the candidate:\n1.1 Demonstrates ability to comply with company rules and\nregulations\n1.2 Demonstrates ability to operate off-highway dump truck (rigid)\nin accordance with the established operating procedures\n1.3 Demonstrates ability to carry-out safe work practices\n1.4 Demonstrates knowledge of functions of instrument panel\ngauges, controls and alert indicators.\n1.5 Demonstrates ability to determine and observe correct\npositioning and allowable load capacity for off-highway dump\ntruck (rigid)\n1.6 Demonstrates ability to observe safe and efficient\nloading/hauling/dumping procedures from loading area to\ndumping site\n1.7 Demonstrates ability to communicate.\n2. Underpinning\nknowledge,\nattitudes\n\n2.1 Familiarity with company rules and regulations\n2.2 Knowledge of dump truck operating procedures\n2.3 Safe work procedures and practices\n2.4 Dump truck functions of instrument panel gauges, controls,\nalert/warning indicators and their uses.\n2.5 Comprehension of dump truck operations and maintenance\nmanual.\n2.6 Correct positioning and allowable load capacity of dump truck\n2.7 Safe and efficient loading/hauling/dumping procedures\n2.8 Defensive-driving and hazard-avoidance techniques\n2.9 Site/Terrain layout and obstacles\n2.10 Types of materials to be loaded\n2.11 Positive work values (time and cost conscious, etc.)\n3. Underpinning\nskills\n3.1 Accomplishing dump truck checklist and reports\n3.2 Reporting dump truck component failure\n3.3 Performing actual operation procedure of dump truck\n3.4 Performing safety procedures and practices\n3.5 Determining type and load capacity of dump truck\n3.6 Calculation and mensuration skills\n3.7 Defensive driving skills\n4. Resource\nimplications\nThings necessary for the conduct of assessment\n4.1 Access to dump truck and job site/terrain\n4.2 Available loads\n4.4 PPE\n4.5 Spotter\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Method of\nassessment\nCompetency in this unit must be assessed through\n5.1 Written/Oral questioning\n5.2 Observation/ practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n6.1 Assessment maybe conducted in the work site or in a\n simulated venue.\n6.2 Competency shall be assessed while work is being undertaken\nIndependently.\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION"
      }
