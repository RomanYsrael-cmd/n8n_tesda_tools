ndidate:\n1.1 Demonstrates ability to select hauling equipment based on the\njob requirements\n1.2 Demonstrates ability to check operator-serviceable (OS) parts\n1.3 Demonstrates ability to perform walk-around and “BLOWAF”\ninspection following equipment checklist and with engine\nstopped/not running.\n1.4 Demonstrates ability to perform walk-around check while\nengine is running.\n1.5 Demonstrates ability to observe risk-control/safe procedures\n1.6 Demonstrates ability to perform post-operation checking\nprocedures\n1.7 Demonstrates ability to accomplish and submit daily equipment\ntime record/report (DETR)\n2. Underpinning\n(related)\nknowledge and\nattitude\n\n2.1 Types and uses of personal protective equipment (PPE)\n2.2 Controls, instruments, indicators, safety devices and their uses\n2.3 Start-up and shutdown procedures\n2.4 Familiarity with manufacturer’s operation manual\n2.5 Familiarity with job site and work/terrain conditions\n2.6 Familiarity with pre- and post-operation checking procedures\nand checklist form\n2.7 Positive work values (time and cost conscious, etc.)\n3. Underpinning\nskills\n\n3.1 Performing pre- and post-operation checking procedures for\n dump truck.\n3.2 Using personal protective equipment (PPE)\n3.3 Maintaining dump truck records\n3.4 Communicating with work site personnel\n3.5 Complying with the manufacturer’s operation and\n maintenance manual\n3.6 Accomplishing and submitting pre- and post-operation checklist\nform\n4. Resource\nimplications\n\nThe following resources must be provided:\n4.1 Access to hauling equipment and manuals.\n4.2 Access to work site or work area for dump truck\noperation\n4.3 Personal protective equipment (PPE)\n\n--- PDF PAGE 46 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written/oral questioning\n5.2 Observation/demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Assessment may be conducted on-the-job or