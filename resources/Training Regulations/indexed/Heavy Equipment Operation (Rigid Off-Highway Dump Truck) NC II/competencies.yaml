        "evidence_guide": {
          "source_text": "1. Critical aspects\nof evidence to\nbe considered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to identify minor defects based on\nchecklist and service them in accordance with\nmanufacturer/company preventive maintenance\nprogram/procedure\n1.2 Demonstrates ability to identify major defects based on\nchecklist and report them to appropriate personnel\n1.3 Demonstrates ability to use basic hand tools and equipment\n1.4 Demonstrates ability to identify and service OS\nparts/standards according to manufacturer’s service manual\n1.5 Demonstrates knowledge of applicable fluids and\n lubricants\n1.6 Demonstrates ability to carry-out preventive maintenance\nservicing procedure based on job site condition/requirement\n1.7 Demonstrates ability to accomplish and submit preventive\nmaintenance checklist form\n1.8 Demonstrates ability to use personal protective equipment\n(PPE)\n2. Underpinning\n(related)\nknowledge and\nattitude\n\n2.1 Knowledge of equipment minor and major defects\n2.2 Servicing procedure for minor defects\n2.3 Types and uses of basic hand tools and equipment\n2.4 Knowledge of fluids and lubricants\n2.5 Uses and functions of OS parts\n2.6 Company rules and regulations\n2.7 Types and uses of PPE\n2.8 Operation and maintenance manual\n2.9 Positive work values (time and cost conscious, etc.)\n3. Underpinning\nskills\n\n3.1 Identifying minor and major defects\n3.2 Performing servicing procedure for minor defects\n3.3 Using basic hand tools and equipment\n3.4 Identifying and servicing OS parts/standards\n3.5 Using fluids and lubricants\n3.6 Carrying out basic preventive maintenance servicing\nprocedures and accomplishing checklists\n3.7 Complying company rules and regulations\n3.8 Using personal protective equipment (PPE)\n3.9 Interpreting operation and maintenance manual\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment\n4.1 Access to hauling equipment and its corresponding manual\n4.2 Work site\n4.3 Basic hand tools and equipment\n4.4 Fluids and lubricants\n4.5 PPE\n4.6 Preventive maintenance instruction manual/ checklist forms\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written and/or oral questioning\n5.2 Observation /demonstration\n5.3 Work record and documents\n5.4 Third party\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or simulated\nworkplace environment and in accordance with preventive\nmaintenance procedures\n6.2 Competency shall be assessed while work is being\nundertaken independently\n\n--- PDF PAGE 55 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT TITLE:\nPERFORM PRODUCTIVE OPERATION FOR\nOFF-HIGHWAY DUMP TRUCK (RIGID)\nUNIT CODE:"
