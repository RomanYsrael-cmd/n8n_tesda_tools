        "evidence_guide": {
          "source_text": "1. Critical aspects\nof evidence to\nbe considered\n\nAssessment must confirm evidence that the candidate:\n1.1 Demonstrates ability to select hauling equipment based on the\njob requirements\n1.2 Demonstrates ability to check operator-serviceable (OS) parts\n1.3 Demonstrates ability to perform walk-around and “BLOWAF”\ninspection following equipment checklist and with engine\nstopped/not running.\n1.4 Demonstrates ability to perform walk-around check while\nengine is running.\n1.5 Demonstrates ability to observe risk-control/safe procedures\n1.6 Demonstrates ability to perform post-operation checking\nprocedures\n1.7 Demonstrates ability to accomplish and submit daily equipment\ntime record/report (DETR)\n2. Underpinning\n(related)\nknowledge and\nattitude\n\n2.1 Types and uses of personal protective equipment (PPE)\n2.2 Controls, instruments, indicators, safety devices and their uses\n2.3 Start-up and shutdown procedures\n2.4 Familiarity with manufacturer’s operation manual\n2.5 Familiarity with job site and work/terrain conditions\n2.6 Familiarity with pre- and post-operation checking procedures\nand checklist form\n2.7 Positive work values (time and cost conscious, etc.)\n3. Underpinning\nskills\n\n3.1 Performing pre- and post-operation checking procedures for\n dump truck.\n3.2 Using personal protective equipment (PPE)\n3.3 Maintaining dump truck records\n3.4 Communicating with work site personnel\n3.5 Complying with the manufacturer’s operation and\n maintenance manual\n3.6 Accomplishing and submitting pre- and post-operation checklist\nform\n4. Resource\nimplications\n\nThe following resources must be provided:\n4.1 Access to hauling equipment and manuals.\n4.2 Access to work site or work area for dump truck\noperation\n4.3 Personal protective equipment (PPE)\n\n--- PDF PAGE 46 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written/oral questioning\n5.2 Observation/demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Assessment may be conducted on-the-job or in a simulated\n venue.\n6.2 Competency shall be assessed while work is being undertaken\n independently\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT TITLE:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR HAULING EQUIPMENT\nUNIT CODE:"
        },
        "source_text": "CON833316\nUNIT DESCRIPTOR:\nThis unit deals with the outcomes required to\nperform pre- and post operation procedures for off-\nhighway dump truck (rigid).\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Perform visual check of\nequipment\n\n1.1 Hauling equipment is selected based on job\nrequirements.\n1.2 Operator serviceable (OS) parts are checked\nin accordance with equipment checklist and\nmanufacturer’s procedures.\n1.3 Walk-around check is performed with\nequipment checklist and with engine\nstopped/not running.\n\n2. Perform “B L O W A F” check\n\n2.1 “BLOWAF” check is performed following\nchecklist form and with engine stopped/not\nrunning.\n2.2 Deficiencies in fluids level are identified and if\nbelow normal level are refilled/topped up in\naccordance with equipment maintenance\nmanual.\n2.3 Abnormal conditions are reflected/noted in the\nchecklist and reported/referred to authorized\nperson.\n3. Perform operation check\n\n3.1 Starting/running check is performed following\nchecklist and in accordance with manufacturer’s\nrecommendations.\n3.2 Normal functions of brake, steering and Power\nTake-off (PTO), etc. are checked.\n3.3 Walk-around check is performed following\nequipment checklist and with engine running.\n3.4 Safety devices are checked for proper\nfunctions in accordance with safe operating\nprocedures.\n\n--- PDF PAGE 39 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Perform post operation\nprocedure\n4.1 Hauling equipment is parked in firm and level\nground after productive operation in accordance\nwith safety company rules and regulations.\n4.2 Equipment controls are set into neutral position\nand parking brakes are engaged according to\nmanufacturer’s operations manual.\n4.3 Safety locks and brakes are all set/engaged in\naccordance with operator’s manual.\n4.4 Walk-around inspection check is conducted\nwhile doing engine cool down.\n4.5 Daily equipment time report/record (DETR) is\naccomplished/submitted according to company\nrules and regulations\n\n--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hauling\n1.1 Off-highway dump truck (rigid)\n1.2 Off-highway dump truck (articulated)\n1.3 On-highway dump truck (rigid)\n2. Operator\nserviceable\nparts\n\n2.1 Air cleaner\n2.2 Battery terminals/Connection\n2.3 Belt\n2.4 Tire inflation\n2.5 Grease/Lube points\n2.6 Water/Fuel separator\n2.7 Wiper blade\n3. Walk around\ncheck\n\n3.1 Engine off\n 3.1.1Leaks\n 3.1.2 Worn out/damaged parts\n 3.1.3 Fluid levels\n 3.1.4 Loose and missing parts\n 3.1.5 Tire condition\n 3.1.5.1 Cracked/Thread separation\n 3.1.5.2 Air pressure\n 3.1.5.3 Thread wear\n 3.1.5.4 Imbedded materials\n 3.1.5.5 Damaged rim\n 3.1.6 Side mirrors\n 3.1.7 Cab condition and windshields\n 3.1.8 Wiper bottle\n\n Off-highway dump truck (articulated)\n 3.1.9 Pins\n\n3.2 Engine on\n 3.2.1 Gauges, alert/warning indicators and controls\n 3.2.2 Oil and air leaks\n 3.2.3 Safety devices\n 3.2.4 Working implement function e.g. dump, steering,\n etc\n4. B L O W A F\ncheck\n\n4.1 Battery (starting and charging system)\n4.2 Light (lighting system)\n4.3 Oil (lubricating system)\n4.4 Water (cooling system)\n4.5 Air (intake and exhaust system)\n4.6 Fuel (fuel system)\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Fluid levels\n\n5.1 Battery electrolyte (maintenance type)\n5.2 Engine oil\n5.3 Hydraulic oil\n5.4 Radiator coolant\n5.5 Fuel\n5.6 Wiper fluid\n\nOn-highway dump truck (rigid)\n5.7 Brake fluid\n5.8 Steering oil\n5.9 Transmission\n6. Authorized\nperson\n6.1 Equipment maintenance supervisor\n6.2 Maintenance personnel\n\nOff-highway dump truck (rigid) and on-highway dump truck\n(rigid)\n6.3 Chief Mechanic\n\nOff-highway dump truck (articulated)\n6.4 Hauling operation supervisor\n\n--- PDF PAGE 42 ---\nTR HEAVY EQUIPMENT OPERATION\n\n7. Starting/Running\ncheck\n\n7.1 Controls\n 7.1.1 PTO\n 7.1.2 Steering/Secondary\n 7.1.3 Shifting\n 7.1.4 Dump lever\n 7.1.5 Accelerator pedal\n 7.1.6 Brake\n 7.1.6.1 Service\n 7.1.6.2 Retarder\n 7.1.6.3 Secondary/Emergency\n 7.1.6.4 Parking\n\n On-highway dump truck\n 7.1.6.5 Anti-lock brake system\n\n Off-highway dump truck (rigid) and Off-highway dump\n truck (articulated)\n 7.1.7 Transmission control\n 7.1.8 Retarder lever\n\n On-highway dump truck (rigid)\n 7.1.9 Differential / inter-axle lock\n\n7.2 Gauges\n 7.2.1 Battery charging\n 7.2.2 Pressure (oil and air)\n 7.2.3 Temperature (oil and water)\n 7.2.4 RPM (tachometer)\n 7.2.5 Speedometer\n\n Off-highway dump truck (rigid) and Off-highway dump\n truck (articulated)\n 7.2.6 Fuel indicator\n 7.2.7 Hour meter\n 7.2.8 Transmission indicator\n\n Off-highway dump truck (articulated)\n 7.2.9 Payload meter / sensor\n\n--- PDF PAGE 43 ---\nTR HEAVY EQUIPMENT OPERATION\n\n7.3 Leaks in systems\n 7.3.1 Air\n 7.3.2 Cooling\n 7.3.3 Suspension charge\n 7.3.4 Lubricating\n 7.3.5 Fuel\n 7.3.6 Hydraulic\n 7.3.7 Washer fluid\n7.4 Electrical/switches\n 7.4.1 Lights\n 7.4.2 Horn\n 7.4.3 Safety devices\n7.5 Steering and brakes\n8. Safety devices\nMay include but not limited to:\n\nOff-highway dump truck (rigid) and Off-highway dump truck\n(articulated)\n8.1 Parking brake\n8.2 Retarder\n8.3 Exhaust brake\n8.4 Service brake\n\nOn-highway dump truck (rigid) and off-highway dump truck\n(articulated)\n8.5 Emergency brake\n8.6 Fire extinguisher\n8.7 Beacon lights\n8.8 Seat belt\n\nOn-highway dump truck (rigid)\n8.9 Emergency / secondary steering\n8.10 Anti lock brake system\n8.11 Wheel choke\n8.12 Early Warning Device (EWD)\n\nOff-highway dump truck (articulated)\n8.13 Back-up alarm\n8.14 Buggy whip\n8.15 Warning device\n8.16 Neutral lock switch\n8.17 Battery disconnect switch\n\n--- PDF PAGE 44 ---\nTR HEAVY EQUIPMENT OPERATION\n\n9. Safety locks\nMay include but not limited to:\n9.1 PTO\n9.2 Safety implement lock\n9.3 Door lock\n9.4 Dump box safety pin\n\nOff-highway dump truck (rigid) and On-highway dump truck\n(rigid)\n9.5 Steering\n\nOn-highway dump truck (rigid)\n9.6 Hydraulic implement lock\n\n--- PDF PAGE 45 ---\nTR HEAVY EQUIPMENT OPERATION\n\n EVIDENCE GUIDE\n1. Critical aspects\nof evidence to\nbe considered\n\nAssessment must confirm evidence that the candidate:\n1.1 Demonstrates ability to select hauling equipment based on the\njob requirements\n1.2 Demonstrates ability to check operator-serviceable (OS) parts\n1.3 Demonstrates ability to perform walk-around and “BLOWAF”\ninspection following equipment checklist and with engine\nstopped/not running.\n1.4 Demonstrates ability to perform walk-around check while\nengine is running.\n1.5 Demonstrates ability to observe risk-control/safe procedures\n1.6 Demonstrates ability to perform post-operation checking\nprocedures\n1.7 Demonstrates ability to accomplish and submit daily equipment\ntime record/report (DETR)\n2. Underpinning\n(related)\nknowledge and\nattitude\n\n2.1 Types and uses of personal protective equipment (PPE)\n2.2 Controls, instruments, indicators, safety devices and their uses\n2.3 Start-up and shutdown procedures\n2.4 Familiarity with manufacturer’s operation manual\n2.5 Familiarity with job site and work/terrain conditions\n2.6 Familiarity with pre- and post-operation checking procedures\nand checklist form\n2.7 Positive work values (time and cost conscious, etc.)\n3. Underpinning\nskills\n\n3.1 Performing pre- and post-operation checking procedures for\n dump truck.\n3.2 Using personal protective equipment (PPE)\n3.3 Maintaining dump truck records\n3.4 Communicating with work site personnel\n3.5 Complying with the manufacturer’s operation and\n maintenance manual\n3.6 Accomplishing and submitting pre- and post-operation checklist\nform\n4. Resource\nimplications\n\nThe following resources must be provided:\n4.1 Access to hauling equipment and manuals.\n4.2 Access to work site or work area for dump truck\noperation\n4.3 Personal protective equipment (PPE)\n\n--- PDF PAGE 46 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written/oral questioning\n5.2 Observation/demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Assessment may be conducted on-the-job or in a simulated\n venue.\n6.2 Competency shall be assessed while work is being undertaken\n independently\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT TITLE:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR HAULING EQUIPMENT\nUNIT CODE:"
