e not limited to:\n7.1 Hand tools\n 7.1.1 Wrenches (open and box)\n 7.1.2 Mechanical pliers\n 7.1.3 Screw driver (Philips and flat)\n 7.1.4 Paint brush\n 7.1.5 Hammer\n 7.1.6 Vice grip\n 7.1.7 Tire gauge (instrument)\n 7.1.8 Steel brush\n\n Off-highway dump truck (articulated) and On-highway\n dump truck (rigid)\n 7.1.9 Grease gun\n 7.1.10 Oiler\n\n On-highway dump truck (rigid)\n 7.1.11 Pry bar\n\n7.2 Equipment\n 7.2.1 High pressure washer\n 7.2.2 Air compressor\n 7.2.3 Grease gun\n 7.2.4 Hydraulic jack\n 7.2.5 Lube pump\n8. Basic preventive\nmaintenance\nservicing (PMS)\nMay include but not limited to:\n8.1 Check/Tighten battery clamps/holders\n8.2 Clean filters\n 8.2.1 Air cleaner\n 8.2.2 Fuel/Water separator\n8.3 Check/Replace defective caps\n8.4 Belt tension adjustment\n8.5 Tire inflation pressure\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION\n\n9. Site conditions/\nRequirements\nMay include but are not limited to:\n9.1 Instructions/Site lay-out/Regulations\n9.2 Warning Signages/barricades (e.g. caution tape)\n9.3 Work and maintenance schedules\n9.4 Work bulletin boards\n9.5 Vicinity/Rerouting chart\n9.6 Environmental/Site conditions\n 9.6.1 Dusty\n 9.6.2 Toxic/hazardous fumes\n 9.6.3 Rainy/Windy\n 9.6.4 Muddy/slippery ground\n 9.6.5 Poor lighting and ventilation\n 9.6.6 Site obstruction\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\nof evidence to\nbe considered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to identify minor defects based on\nchecklist and service them in accordance with\nmanufacturer/company preventive maintenance\nprogram/procedure\n1.2 Demonstrates ability to identify major defects based on\nchecklist and report them to appropriate personnel\n1.3 Demonstrates ability to use basic hand tools and equipment\n1.4 Demonstrates ability to identify and service OS\nparts/standards according to manufacturer’s service manual\n1.5 Demonstrates knowledge of applicable 