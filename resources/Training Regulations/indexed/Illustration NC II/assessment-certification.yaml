  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of ILLUSTRATION NC II, the candidate must\ndemonstrate competence through assessment covering all the units of competency listed\nin Section 1. Successful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of ILLUSTRATION NC II must\ndemonstrate competency in all the following core units of the Qualification through a\nsingle project-type assessment. Candidates may apply for assessment in any accredited\nassessment center.\n\nPREPARE COMICS ILLUSTRATION AND ART WORK\n• Apply Techniques to Produce Drawings\n• Source Concept for Own Work\n• Develop and Articulate Concept for Own Work\n• Use Drawing Techniques to Represent Object or Idea\n• Prepare, Store and Maintain Finished Work\n\nSuccessful candidates shall be awarded National Certificate Level II in Illustration.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the \"Procedures\nManual on Assessment and Certification\" and \"Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTOQCS)\".\n\n--- PDF PAGE 54 ---\nTR- ILLUSTRATION NC II\n\n-50-\n\n"
}
