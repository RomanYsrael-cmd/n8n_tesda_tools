  "source_text": "Section 1. Successful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of ILLUSTRATION NC II must\ndemonstrate competency in all the following core units of the Qualification through a\nsingle project-type assessment. Candidates may apply for assessment in any accredited\nassessment center.\n\nPREPARE COMICS ILLUSTRATION AND ART WORK\n• Apply Techniques to Produce Drawings\n• Source Concept for Own Work\n• Develop and Articulate Concept for Own Work\n• Use Drawing Techniques to Represent Object or Idea\n• Prepare, Store and Maintain Finished Work\n\nSuccessful candidates shall be awarded National Certificate Level II in Illustration.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the \"Procedures\nManual on Assessment and Certification\" and \"Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTOQCS)\".\n\n--- PDF PAGE 54 ---\nTR- ILLUSTRATION NC II\n\n-50-\n\nAnnex A\nCOMPETENCY MAP FOR VISUAL ARTS\n\nILLUSTRATION NC II\n\nCORE UNITS OF COMPETENCY\n\nOperate camera and\ncompose a subject\n\nPresent finished products\n\nSet up technical / complicated\nlighting system\n\nInnovate new photography\ntechniques\n\nSet up studio lights,\nequipment and\naccessories\n\nOperate medium and large\nformat camera\n\nUpdate knowledge on camera\nhardware and software\n\nEstablish networks and markets\nin photography\n\nPerform post capture\nprocessing\n\nUse advance editing\nsoftware\n\nManage operation of\nphotography business\n\nTrain and supervise personnel\nin photography\n\nApply Techniques to\nProduce Drawings\n\nSource Concept for Own\nWork\n\nDevelop and Articulate Concept\nfor own Work\n\nUse Drawing Techniques to\nRepresent the Object or Ideas\n\nPrepare, Store and Maintain\nFinished Work\n\nCOMMON UNITS OF COMPETENCY\n\nDevelop Self as an Artist\n\nDevelop and Update\nIndustry Knowledge\n\nPerform Computer Operations\n\nProvide Effective Customer\nService\n\nSelect and Prepare Work for\nExhibition\n\nBASIC UNITS OF COMPETENCY\nReceive and Respond to\nWorkplace\nCommunication\n\nParticipate in Workplace\nCommunication\n\nLead Workplace Communication\n\nUse mathematical concepts and\ntechniques\n\nDevelop Team and\nIndividual\nWork With Others\n\nWork in a Team\nEnvironment\n\nLead Small Team\n\nSolve Workplace Problems\nRelated to Work Activities\n\nApply Problem Solving\nTechniques in the Workplace\nPractice Career\nProfessionalism\n\nPractice Occupational\nHealth and Safety\n\nDevelop and practice negotiation\nskills\n\nUse relevant technologies\n\nPlan and Organize Work\n\n--- PDF PAGE 55 ---\nTR-COMMERCIAL ILLUSTRATION NC II\n\n51\n\nDEFINITION OF TERMS\n\n1. Cartoon illustration\nA visual interpretation of an idea using exaggerated proportions\n2. Realistic illustration\nA visual interpretation of an idea using realistic proportions or\nimages\n3. Stylized illustration\nA visual interpretation with features of both, one of or neither\ncartoon and realistic illustrations\n4. Illustrator\nAn artist who prepares a visual two-dimensional or flat-surface\ninterpretation of an idea or a written work\n5. Subject\n\nRefers to idea or source of the illustration\n6. Drawing techniques\nStyle and method of drawings used by illustrators\n7. Medium\nRefers to materials and tools used to execute an illustration, e.\ng., computer, ink, water color\n8. Traditional drawing\nManual method of illustration using pencil, pen, brush,\nwatercolor, poster colors, etc\n9. Digital drawing\nElectronic method of illustration using computer, hardware and\nsoftware accessories\n10. Visual\nrepresentation\nMay refer to the finished product in the form of an illustration\n\n--- PDF PAGE 56 ---\nTR-COMMERCIAL ILLUSTRATION NC II\n\n52\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nILLUSTRATION NC II\nMr. HUGO 'BOBOY' D. YONZON\nPresident -Yonzon Associates\nPresident- Samahang Kartunista ng Pilipinas (SKP)\nMr. BAYANI 'BARRY' JOSE\nCreative Consultant - Department of Agrarian\nReform (DAR)\nMember - Samahang Kartunista ng Pilipinas\nMr. RENATO ' RONI' T. SANTIAGO\nCartoon Editor - Manila Bulletin\nMember- Samahang Kartunista ng Pilipinas (SKP)\n\nPAOLO L. SIMBULAN\nProject Architect-Technological\nInstitute of the Philippines\n(T.I.P.)\nMember-Samahang Kartunista\nng Pilipinas\nLEON BASILIO P. YONZON\nArtist/Video Editor-Yonzon\nEntertainment Syndicate\nBERNADETTE ESPIRITU\nAdministrative Support -Yonzon\nEntertainment Syndicate\n\nThe PARTICIPANTS in the National Validation of this Training Regulations\n\nMr. NICK B. PERTIERRA\nEditorial Cartoonist, Malaya\nMember-Samahang Kartunista\nng Pilipinas\nMr. RENE A. ARANDA\nChief Cartoonist,\nThe Philippine Star\nMember-Samahang Kartunista\nng Pilipinas\nMr. FREELY ABRIGO\nCartoonist/Illustrator\nManila Bulletin\nMember-Samahang Kartunista ng\nPilipinas\nMr. ROGER SANCHEZ\nEditorial Cartoonist, FreeLance\nMember-Samahang Kartunista\nng Pilipinas\nMr. JOSELITO YONZON\nCartoonist/Graphic Designer\nMember-Samahang Kartunista ng\nPilipinas\nMs. SHIRLEY BAET\nMember-Samahang Kartunista\nng Pilipinas\nMr. ED PADILLA\nTreasurer Samahang Kartunista\nng Pilipinas\nMr. ARIEL ATIENZA\nCartoonist/Co-founder\nMember-Samahang Kartunista\nng Pilipinas\nMr. WILLIAM CONTRERAS\nCartoonist/Illustrator\nManila Bulletin\nMember-Samahang Kartunista\nng Pilipinas\nMEMBERS OF THE TESDA BOARD\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nAgnes P. Panem\nRizaldy P. Mutuc\nRodrigo B. De la Cruz\n\n--- PDF PAGE 57 ---\nTR-COMMERCIAL ILLUSTRATION NC II\n\n53\n\nList of Published Training Regulations\n\n Animal Production NC II\n Aquaculture NC II\n Automotive Body Painting/Finishing NC II\n Automotive Engine Rebuilding NC II\n Automotive Servicing NC II\n Bartending NC II\n Building Wiring Installation NC II\n Carpentry NC II\n Commercial Cooking NC II\n Computer Hardware Servicing NC II\n ILLUSTRATION NC II\n Deck Seafaring NC II\n Dressmaking NC II\n Driving NC II\n Engine Seafaring NC II\n Food and Beverage Services NC II\n Footwear Making NC II\n Heavy Equipment Operation NC II\n Horticulture NC II\n Household Services NC II\n Housekeeping NC II\n Machining NC II\n Masonry NC II\n Motorcycle and Small Engine Servicing NC II\n Plumbing NC II\n Pyrotechnics NC II\n RAC Servicing NC I\n RAC Servicing NC II\n Security Services NC II\n Tailoring NC II\n Tour Guiding Services NC II\n Transport RAC Servicing NC II\n Travel Services NC II\n Welding NC II\n\nThese materials are available in both printed and electronic copies.\nFor more information please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTelephone Nos.: 893-8303, 893-2139; 817-4076 to 82 loc. 615 to 617\nor visit our website: www.tesda.gov.ph"
