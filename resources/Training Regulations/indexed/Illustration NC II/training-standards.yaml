    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: ILLUSTRATION\nNC Level: NC II\n\nNominal Training Duration 234 hours\n\nCourse Description:\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills the\nILLUSTRATION NC II qualification. It consists of competencies that a person must achieve in\nenhancing writings by providing a visual representation that corresponds to the content of the\nassociated text. The illustration may be intended to clarify complicated concepts or objects\nthat are difficult to describe textually, or the illustration may be used to express emotion, or\nperception of things and ideas as in greeting cards, or cover art or interior art for books and\nmagazines, or for advertisement, as on posters. The illustrator may specialize in a specific\ntype and/or medium of drawings, e.g. realistic or cartoon drawings, using poster colors, pencil,\netc. using traditional or digital or combination of digital and traditional methods.\n\nTo obtain this, all units of competency prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation\n1.2 Complete relevant work related\ndocuments\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Case studies\n• Simulation\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n• Observation of\nwork activities\n• Observation\nthrough\nsimulation or\nrole play\n• Case studies\nand scenarios\n\n--- PDF PAGE 47 ---\nTR- ILLUSTRATION NC II\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work problems\n3.3 Maintain professional growth\nand development\n• Interactive\nlecture\n• Simulation\n• Demonstration\n• Self paced\ninstruction\n• Group\ndiscussion\n• Structured\nactivity\n• Film viewing\n•Role play\n• Role play\n• Interviews\n• Written test\n• Demonstration\n• Portfolio\nassessment\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks\n4.2 Evaluate hazards and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational health\nand safety (OHS) awareness\n• Interactive-\nlecture\n• Simulation\n• Symposium\n• Group\nDynamics\n• Situation\nanalysis\n• Film viewing\n• Self pace\ninstruction\n• Case/Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Simulation\n• Demonstration\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\n(14 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1 Identify and access key\nsources of information on the\nindustry\n1.2 Access, apply and share\nindustry information\n1.3 Update continuously relevant\nindustry knowledge\n• Lecture/\n• Individual/\nGroup\nassignment\n• Group\ndiscussion\n• Interview /\nQuestions\n• Individual/\nGroup project or\nreport\n2. Perform\ncomputer\noperation\n2.1 Identify and explain the\nfunctions, general features\nand capabilities of both\nhardware and software\n2.2 Prepare and use appropriate\nhardware and software\naccording to task requirements\n2.3 Use appropriate devices and\nprocedures to transfer files/\ndata\n2.4 Produce accurate and\ncomplete data according to the\nrequirements\n• Lecture\n• Group\ndiscussion\n• Tutorial or self-\npace\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 48 ---\nTR- ILLUSTRATION NC II\n\n2.5 Maintain computer system\n3. Develop self as\nan artist\n3.1 Identify and apply strategies to\ndevelop appropriate skills in\nart practice\n3.2 Use discussion and evaluation\nopportunities to develop\ntechnical and conceptual skills\n3.3 Develop own style through\nexploring and experimenting\nwith new ideas in making and/\nor interpreting work\n• Lecture\n• Group\ndiscussion\n• Individual/\nGroup\nassignment\n• Interviews/\nQuestioning\n• Individual/\nGroup project or\nreport\n4. Select and\nprepare work for\nexhibition\n4.1 Identify the organizer and its\ncriteria for selection of work for\nexhibition\n4.2 Select and organize work to\nsubmit for exhibition\n• Lecture\n• Group\ndiscussion\n\n• Interview\n• Demonstration\n• Direct\nobservation\n\n--- PDF PAGE 49 ---\nTR- ILLUSTRATION NC II\n\nCORE COMPETENCIES\n(202 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\ntechniques to\nproduce\ndrawings\n1.1 Draw basic shapes with\nillusion of volume\n1.2 Draw figures and objects from\nbasic shapes\n• Lecture\n• Demonstration\n• Practical\nexercises\n• On-the-spot\ndrawing\n\n• Direct\nobservation\n• Evaluation of\nfinal output\n• Actual drawing\ntest\n1.3 Draw basic shapes to\nproportion according to job\nrequirement\n1.4 Draw figures and objects to\nproportion according to job\nrequirement\n1.5Draw human figures\n2. Source concept\nfor own work\n2.1 Source drawing concept\n2.2 Review information for\napplication to own work\n• Lecture\n• Demonstration\n\n• Direct\nobservation of\ncandidate at\nwork\n• Interview\n• Practical\nexamination\n3. Develop and\narticulate\nconcept for own\nwork\n3.1 Develop the concept\n3.2 Articulate the concept\n• Lecture\n• Demonstration\n\n• Direct\nobservation of\ncandidate at\nwork\n• Interview\n• Practical\nexamination\n4. Use drawing\ntechniques to\nrepresent object\nof idea\n\n4.1 Prepare for drawing\n4.2 Use basic drawing techniques\n• Lecture\n• Demonstration\n• Direct\nobservation of\ncandidate at\nwork\n• Interview\n• Practical\nexamination\n5. Prepare, store\nand maintain\nfinished work\n\n5.1 Assess finished wo