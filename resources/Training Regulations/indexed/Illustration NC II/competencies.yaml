          "source_text": "1. Select work to submit \nfor exhibition \n1.1 Relevant information on the criteria is accessed which informs \nthe selection of work for exhibition \n1.2 information on criteria for display of work is interpreted \n1.3 Issues surrounding criteria with relevant \nindividuals/organizations is identified and clarified \n1.4 Work is selected in accordance with criteria\n2 Organize selected \nwork for exhibition \n2.1 Completeness of work to be displayed is checked and action is \ntaken when required \n2.2 Any specific requirements for display of selected work is \ndetermined and taken action in consultation with relevant \nindividuals or organizations \n2.3 Relevant steps and processes required to prepare selected \nwork for display is identified \n2.4 Work is prepared using appropriate techniques or engage the \nservices of others as required \n2.5 Accurate information on work is provided to relevant \nindividuals/organizations in accordance with requirements \n2.6 Work is submitted to exhibition curator or display organizer within \nagreed timeframe and in accordance with other agreed \nrequirements \n2.7 Assistance for exhibition is provided with installation or \nhanging as required and in accordance with instructions\n\n--- PDF PAGE 28 ---\nTR- ILLUSTRATION NC II \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n 1.  Exhibition \nExhibition of work occurs in a variety of contexts, including \n1.1 Studio spaces \n1.2 Local community spaces     \n1.3 Web sites     \n1.4 Artist run spaces   \n1.5 Group exhibition at regional venues    \n1.6 Retail display \n1.7 Contribution to an exhibition via submission to a competition\n2.  Criteria \nCriteria for selection of work for exhibition may include: \n2.1 Criteria provided by organizer of exhibition \n2.2 Criteria decided by artist, designer or performer     \n2.3 Size, dimension, theme, medium, number of pieces \n2.4 Quality of completed work \n2.5 Personal preferences \n2.6 Physical characteristics of display area, eg light, ventilation and \naccess\n3.  Completeness \nCompleteness of work may involve    \n3.1Tidiness/cleanliness     \n3.2 All elements present    \n3.3 Touch up requirements satisfied   \n3.4 Resolution requirements for web presentation\n4.  Requirements for \ndisplay \nRequirements for display may include:    \n4.1 Framing \n4.2 Cleaning the work    \n4.3 Attaching fixtures for hanging or mounting     \n4.4 Selecting and painting plinths   \n4.5 The display environment, e.g. light, humidity, temperature, \npower sources    \n4.6 Accompanying documentation, e.g. consignment notes, artist's \nstatement   \n4.7 Web site information\n5.  Assistance for the \nexhibition \nAssistance for the exhibition may involve \n5.1 Planning the exhibition space     \n5.2 Planning the location of work within the space     \n5.3 Contributing to safely hanging, installing and dismantling work   \n5.4 Labeling work \n5.5 Wrapping/storage of works at the conclusion of the display or \nexhibition\n\n--- PDF PAGE 29 ---\nTR- ILLUSTRATION NC II"
