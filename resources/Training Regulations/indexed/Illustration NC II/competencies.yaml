          "source_text": "1. Assess finished work \nfor storage \n1.1 Criteria for the selection of finished work to be stored and \nstorage requirements is determined \n1.2 Finished work is assessed  and selected based on the identified \ncriteria for  their storage \n 1.3 Storage requirement  for selected finished work is decided \nbased on the criteria\n2. Store finished work \n2.1 Protective materials and conditions for storage is identified and \nselected \n2.2 Finished work for storage is organized and protective materials \nare applied on finished work. \n2.3 Finished works are stored in allocated or selected storage \nspace following company standard operating procedure and \ncriteria\n3. Maintain stored work\n \n \n3.1 Accurate and complete records of stored finished work is \nprepared and maintained \n3.2 Condition of finished work in the storage is monitored and \nreviewed in accordance with requirement for different types of \nwork\n\n--- PDF PAGE 43 ---\nTR- ILLUSTRATION NC II \n \n \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Criteria for the \nselection of finished \nwork \nCriteria for finished work may include: \n1.1 Number, quantity, size \n1.2 Quality of work \n1.3 Usefulness in the future \n1.4 Available space \n1.5 Personal affinity to the pieces of work \n1.6 Exemplar potential of the work \n1.7 Archival values \n1.8 Uses of work\n2.  Storage requirement  \nfor selected finished \nStorage needs based on the condition of the work may include \n \n2.1 Simple repairs prior to storage, e.g. to mounted materials \n2.2 Stabilizing any damage to prevent deterioration in storage \n2.3 Consideration of archival values \n2.4 Deciding on the best form of storage for that work in its condition\n3. Protective materials \n Appropriate protective materials may include those that respond to: \n3.1 Fragility (padding, tissue, bubble wrap, box framing) \n3.2 Characteristics of the materials used in the work (acid free \nwrapping/mount board, water absorbent, reflective,) \n3.3 Form of the artwork (upright, flat) \n3.4 Archival materials \n3.5 Negative sleeves \n3.6 Folders \n3.7 Enclosures \n3.8 CD cases\n4.  Selected storage \nspace \nStorage space should enable the safe storage of finished work and \nmay include consideration of: \n4.1 Dampness, humidity \n4.2 Light, fading \n4.3 Archival values \n4.4 Electromagnetic fields \n4.5 Dust \n4.6 Light sensitive characteristics of the images \n4.7 Insect, fungal and molds\n\n--- PDF PAGE 44 ---\nTR- ILLUSTRATION NC II \n \n \nVARIABLE \nRANGE \n5.  Company standard \noperating procedure \nCompany standard operating procedure may include \n5.1 Workplace procedures which may relate to such things as \nsafety, process-specific procedures, use of materials, recycling, \ncost control, reporting \n5.2 Verbal instructions \n5.3 Protocols for the recording and registration of stored work, \nincluding ethical considerations \n6.  Records \nRecords may include: \n6.1 Labeling of work (number, title, medium, year produced) \n6.2 Register of all stored and finished work, e.g. date and usage of \nphotographic material \n6.3 List of stored finished work \n6.4 Electronic records, e.g. including image archiving software \n6.5 Slide library \n6.6 Model release \n6.7 Permits, contracts containing conditional usage requirements\n\n--- PDF PAGE 45 ---\nTR- ILLUSTRATION NC II"
