        "source_title": "USE DRAWING TECHNIQUES TO REPRESENT OBJECT OR IDEA",
        "source_text": "--- PDF PAGE 39 ---\nTR- ILLUSTRATION NC II \n \n \n \n \n \nUNIT OF COMPETENCY : \nUSE DRAWING TECHNIQUES TO REPRESENT OBJECT \nOR IDEA \n \nUNIT CODE \n: \n \nVSA245304 \n \nUNIT DESCRIPTOR          : \nThis unit describes the skills and knowledge required to \nvisually represent objects or ideas. At this level, drawing \ntechniques would be basic. This is a core unit which \ncomplements all specialization units. It is different from the \ndrawing specialization units which focus on drawing as an \nart form. This work would usually be carried out under \nsupervision.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare for drawing \n1.1 Tools and materials required are correctly identified for basic \ndrawing techniques \n1.2 Appropriate tools and materials are selected for basic drawing \ntechniques\n2 Use basic drawing \ntechniques \n2.1 A limited range of techniques are applied to come up with \ninterpretation of objects or ideas \n2.2 Tools and materials are handled and used safely\n\n--- PDF PAGE 40 ---\nTR- ILLUSTRATION NC II \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools and materials \nTools and materials may include: \n1.1 Pencils and/or charcoal \n1.2 pigments, colors and inks \n1.3 a range of papers \n1.4 board \n1.5 measuring tools (ruler, protractor, etc) \n2. Techniques,  \nTechniques may include: \n2.1 Linear marks of differing character \n2.2 Tonal ranges to produce illusion of form in space \n2.3 Linear marks to produce illusion of form in space \n2.4 Simple linear perspective \n2.5Application of pigment, colors and/or inks\n3 Objects and ideas \nThe objects and ideas may include: \n3.1 Emotion \n3.2 Company image \n3.3 Story or poem \n3.4 Opinion \n3.5 Communication theme \n3.6Product quality\n\n--- PDF PAGE 41 ---\nTR- ILLUSTRATION NC II \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Produced more than one drawing which represents the object or \nidea and which shows command of the basic technique/s used\n2. Underpinning \nknowledge and \nattitudes \n2.1 General knowledge of the physical properties and capabilities of \nthe most commonly used materials and tools for drawing \n2.2 General knowledge of different approaches to drawing and the \nwork of other practitioners in relation to using drawing to \nrepresent an object or idea \n2.3 Overview knowledge of the elements and principles of design \n2.4 Awareness of copyright, moral rights and intellectual property \nissues and legislation in environmental and occupational health \nand safety issues associated with the tools and materials used \nin drawing work\n3. Underpinning skills \n3.1 Using drawing tools, equipment and materials \n3.2 Applying different principles of design and elements in drawing \n3.3 Applying different approaches to drawing \n3.4 Communication skills to gather and convey ideas and concept \n3.5 Computing and converting units of measurements for dimension, \nsizes and quantity\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1  Workplace: real or simulated work area \n4.2   Access to the materials and resources needed to apply \nbasic drawing techniques\n5. Method of \nassessment \nCompetency MUST be assessed through any or a combination of \nthe following: \n5.1  Observation with oral questioning before or after the task   \n5.2  Demonstration with oral questioning before or after the task \n5.3 Portfolio presentation  \n5.4 Third Party Workplace Report\n6. Context of \nassessment \n6.1  \nCompetency elements must be assessed on the job or in a \nsimulated environment. \n6.2      Assessment of this unit requires access to the materials, \nresources and equipment needed to produce drawings.\n",
