        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \n1.1  Prepared and maintained physical resources to produce \ndrawings \n1.2  Used and tested drawing techniques \n1.3 \nProduced the drawings\n2. Underpinning \nknowledge and \nattitude \n2.1 General knowledge of physical properties and capabilities of the \nmost commonly used materials and tools used in drawings \n2.2 General knowledge of different styles of drawing and the work of \nkey practitioners \n2.3 Overview knowledge of the formal elements and principles of \ndesign \n2.4 Introductory knowledge of the historical and theoretical contexts \nfor drawing \n2.5 Typical work space and tool requirements for the production of \ndifferent types of drawings \n2.6 Cleaning and maintenance techniques for tools used in drawing \n2.7 Awareness of copyright, moral rights and intellectual property \nissues \n2.8 Environmental issues associated with the tools and materials \nused in drawing \n2.9 Organizational and legislative Occupational Health and Safety \nprocedures in relation to drawing \n2.10 Literacy skills sufficient to read product safety labels \n2.11 Numeracy skills sufficient to calculate quantities. \n2.12 Observing proper work process and deadlines  \n2.13 Work ethics and courtesy to co-workers \n3. Underpinning skills \n3.1  Use and maintenance of drawing tools and materials \n3.2  Application of different styles of drawings \n3.3 Application of different drawing techniques and testing \nnominated techniques \n3.4 Application of different concept for the proposed drawing \n3.5 Calculating measurements \n3.6 Communicating ideas and information\n4. Resource implications \nThe following resources MUST be provided: \n4.1  \nWorkplace: real or simulated work area \n4.2  \nAppropriate tools and equipment \n4.3 \nSupplies and materials \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1  Observation of drawing in progress \n5.2 Demonstration of skills using required tools, equipment and \nmaterials to produce a minimum of one drawing \n5.3 Portfolio \n5.4 Third Party Workplace Report\n6. Context of \nassessment \n6.1  \nCompetency elements must be assessed on the job or in a \nsimulated environment. \n6.2      Assessment of this unit requires access to the materials, \nresources and equipment needed to produce drawings.",
