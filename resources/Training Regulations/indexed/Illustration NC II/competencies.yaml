          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate :\n1.1 Selected work to submit for exhibition\n1.2 Organized selected work for exhibition\n2. Underpinning\nknowledge\n2.1 Exhibition, display or presentation contexts relevant to the\narea of work\n2.2 General knowledge about techniques for display or exhibition\nrelevant to the area of work, eg hanging, dismantling\n2.3 General knowledge of ways in which space is planned for\ndisplay or exhibition purposes relevant to area of work\n2.4 General knowledge of the elements and principles of design\nand their specific application to the layout of an exhibition or\ndisplay\n2.5 Awareness of copyright, moral rights and intellectual property\nissues relevant to exhibitions and display\n2.6 Organizational and legislative occupational health and safety\nissues relating to exhibitions and displays of work and their\nsafe hanging/installing and dismantling\n2.7 Literacy skills sufficient to interpret exhibition or display\nrequirements\n\n3. Underpinning skills\n3.1 Effective communication skills especially in dealing with other\nartists, event organizers and staff\n3. 2 Ability to select work for submission which is consistent with\nthe criteria for the exhibition or display\n3.3 Planning and organizing work and materials for exhibition\n3.3 Practice of good time management\n3.5 Ability to handle telephone or face to face inquiries and\n conversations regarding work for exhibition\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Telephone, fax machine, internet, etc.\n4.2 Access to the materials, resources and equipment needed to\nprepare work for exhibition and to assist to safely hang and/or\ninstall and dismantle an exhibition or display\n4.3 Work samples for exhibition\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Demonstration with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 30 ---\nTR- ILLUSTRATION NC II\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\n\nAPPLY TECHNIQUES TO PRODUCE DRAWINGS\n\nUNIT CODE\n:"
        },
        "source_text": "VSA313202\n\nUNIT DESCRIPTOR : This unit describes the skills and knowledge required to select and\n\nprepare work for display or exhibition. The skills and knowledge\n\nare not restricted to a particular specialization but apply across all\n\nspecializations depending on the work context.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select work to submit\nfor exhibition\n1.1 Relevant information on the criteria is accessed which informs\nthe selection of work for exhibition\n1.2 information on criteria for display of work is interpreted\n1.3 Issues surrounding criteria with relevant\nindividuals/organizations is identified and clarified\n1.4 Work is selected in accordance with criteria\n2 Organize selected\nwork for exhibition\n2.1 Completeness of work to be displayed is checked and action is\ntaken when required\n2.2 Any specific requirements for display of selected work is\ndetermined and taken action in consultation with relevant\nindividuals or organizations\n2.3 Relevant steps and processes required to prepare selected\nwork for display is identified\n2.4 Work is prepared using appropriate techniques or engage the\nservices of others as required\n2.5 Accurate information on work is provided to relevant\nindividuals/organizations in accordance with requirements\n2.6 Work is submitted to exhibition curator or display organizer within\nagreed timeframe and in accordance with other agreed\nrequirements\n2.7 Assistance for exhibition is provided with installation or\nhanging as required and in accordance with instructions\n\n--- PDF PAGE 28 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Exhibition\nExhibition of work occurs in a variety of contexts, including\n1.1 Studio spaces\n1.2 Local community spaces\n1.3 Web sites\n1.4 Artist run spaces\n1.5 Group exhibition at regional venues\n1.6 Retail display\n1.7 Contribution to an exhibition via submission to a competition\n2. Criteria\nCriteria for selection of work for exhibition may include:\n2.1 Criteria provided by organizer of exhibition\n2.2 Criteria decided by artist, designer or performer\n2.3 Size, dimension, theme, medium, number of pieces\n2.4 Quality of completed work\n2.5 Personal preferences\n2.6 Physical characteristics of display area, eg light, ventilation and\naccess\n3. Completeness\nCompleteness of work may involve\n3.1Tidiness/cleanliness\n3.2 All elements present\n3.3 Touch up requirements satisfied\n3.4 Resolution requirements for web presentation\n4. Requirements for\ndisplay\nRequirements for display may include:\n4.1 Framing\n4.2 Cleaning the work\n4.3 Attaching fixtures for hanging or mounting\n4.4 Selecting and painting plinths\n4.5 The display environment, e.g. light, humidity, temperature,\npower sources\n4.6 Accompanying documentation, e.g. consignment notes, artist's\nstatement\n4.7 Web site information\n5. Assistance for the\nexhibition\nAssistance for the exhibition may involve\n5.1 Planning the exhibition space\n5.2 Planning the location of work within the space\n5.3 Contributing to safely hanging, installing and dismantling work\n5.4 Labeling work\n5.5 Wrapping/storage of works at the conclusion of the display or\nexhibition\n\n--- PDF PAGE 29 ---\nTR- ILLUSTRATION NC II\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate :\n1.1 Selected work to submit for exhibition\n1.2 Organized selected work for exhibition\n2. Underpinning\nknowledge\n2.1 Exhibition, display or presentation contexts relevant to the\narea of work\n2.2 General knowledge about techniques for display or exhibition\nrelevant to the area of work, eg hanging, dismantling\n2.3 General knowledge of ways in which space is planned for\ndisplay or exhibition purposes relevant to area of work\n2.4 General knowledge of the elements and principles of design\nand their specific application to the layout of an exhibition or\ndisplay\n2.5 Awareness of copyright, moral rights and intellectual property\nissues relevant to exhibitions and display\n2.6 Organizational and legislative occupational health and safety\nissues relating to exhibitions and displays of work and their\nsafe hanging/installing and dismantling\n2.7 Literacy skills sufficient to interpret exhibition or display\nrequirements\n\n3. Underpinning skills\n3.1 Effective communication skills especially in dealing with other\nartists, event organizers and staff\n3. 2 Ability to select work for submission which is consistent with\nthe criteria for the exhibition or display\n3.3 Planning and organizing work and materials for exhibition\n3.3 Practice of good time management\n3.5 Ability to handle telephone or face to face inquiries and\n conversations regarding work for exhibition\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Telephone, fax machine, internet, etc.\n4.2 Access to the materials, resources and equipment needed to\nprepare work for exhibition and to assist to safely hang and/or\ninstall and dismantle an exhibition or display\n4.3 Work samples for exhibition\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Demonstration with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 30 ---\nTR- ILLUSTRATION NC II\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\n\nAPPLY TECHNIQUES TO PRODUCE DRAWINGS\n\nUNIT CODE\n:"
