          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Assessed finished work for storage\n1.2 Stored finished work\n1.3 Maintained stored work\n2. Underpinning\nknowledge and\nattitude\n2.1 Knowledge on archival principles and values\n2.2 Physical properties and capabilities of a range of materials\nsuitable for protection and storage of work (relevant to type of\nwork)\n2.3 Record keeping systems appropriate for storage and retrieval\n2.4 Safe storage requirements for the finished work (relevant to type\nof work)\n2.5 Awareness of copyright, moral rights and intellectual property\nissues for the storage and maintenance of stored work\n2.6 Environmental issues associated with equipment, tools and\nmaterials required for the protection and storage of the finished\nwork (relevant to type of work)\n2.7 Organizational and legislative occupational health and safety\nprocedures in relation to storage and maintenance of finished\nwork\n2.8 Literacy skills sufficient to interpret information related to\nprotection, storage and maintenance of finished work\n2.9 Numeracy skills sufficient to calculate material requirements for\nprotection, storage and maintenance needs for finished work\n3. Underpinning skills\n3.1 Packaging of finished works using appropriate protective\nmaterials\n3.2 Preparing inventory listing of finished work for storage including\nfinished work description or abstract, size, quantity\n3.3 Performing housekeeping of the storage spaces\n3.4 Computing and converting units of measurements, sizes and\nquantities\n3.5 Performing record keeping and monitoring of stored finished\nwork\n3.6 Applying techniques and processes in preparing, storing,\nlabeling, register and maintain finished work\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Workplace: real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Direct observation of the tasks with questioning\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n6. Context of\nassessment\n6.1 Competency elements must be assessed in a safe working\nenvironment and in accordance with the approved industry\nOHS regulations\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to undertake the preparation\nof finished work for storage, protection and maintenance.\n\n--- PDF PAGE 46 ---\nTR- ILLUSTRATION NC II"
        },
        "source_text": "VSA245305\n\nUNIT DESCRIPTOR\n:\nThis unit describes the skills and knowledge required to\n\nselect finished work for storage, to assess its needs for\n\nstorage and to protect, store and maintain it.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess finished work\nfor storage\n1.1 Criteria for the selection of finished work to be stored and\nstorage requirements is determined\n1.2 Finished work is assessed and selected based on the identified\ncriteria for their storage\n 1.3 Storage requirement for selected finished work is decided\nbased on the criteria\n2. Store finished work\n2.1 Protective materials and conditions for storage is identified and\nselected\n2.2 Finished work for storage is organized and protective materials\nare applied on finished work.\n2.3 Finished works are stored in allocated or selected storage\nspace following company standard operating procedure and\ncriteria\n3. Maintain stored work\n\n3.1 Accurate and complete records of stored finished work is\nprepared and maintained\n3.2 Condition of finished work in the storage is monitored and\nreviewed in accordance with requirement for different types of\nwork\n\n--- PDF PAGE 43 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Criteria for the\nselection of finished\nwork\nCriteria for finished work may include:\n1.1 Number, quantity, size\n1.2 Quality of work\n1.3 Usefulness in the future\n1.4 Available space\n1.5 Personal affinity to the pieces of work\n1.6 Exemplar potential of the work\n1.7 Archival values\n1.8 Uses of work\n2. Storage requirement\nfor selected finished\nStorage needs based on the condition of the work may include\n\n2.1 Simple repairs prior to storage, e.g. to mounted materials\n2.2 Stabilizing any damage to prevent deterioration in storage\n2.3 Consideration of archival values\n2.4 Deciding on the best form of storage for that work in its condition\n3. Protective materials\n Appropriate protective materials may include those that respond to:\n3.1 Fragility (padding, tissue, bubble wrap, box framing)\n3.2 Characteristics of the materials used in the work (acid free\nwrapping/mount board, water absorbent, reflective,)\n3.3 Form of the artwork (upright, flat)\n3.4 Archival materials\n3.5 Negative sleeves\n3.6 Folders\n3.7 Enclosures\n3.8 CD cases\n4. Selected storage\nspace\nStorage space should enable the safe storage of finished work and\nmay include consideration of:\n4.1 Dampness, humidity\n4.2 Light, fading\n4.3 Archival values\n4.4 Electromagnetic fields\n4.5 Dust\n4.6 Light sensitive characteristics of the images\n4.7 Insect, fungal and molds\n\n--- PDF PAGE 44 ---\nTR- ILLUSTRATION NC II\n\nVARIABLE\nRANGE\n5. Company standard\noperating procedure\nCompany standard operating procedure may include\n5.1 Workplace procedures which may relate to such things as\nsafety, process-specific procedures, use of materials, recycling,\ncost control, reporting\n5.2 Verbal instructions\n5.3 Protocols for the recording and registration of stored work,\nincluding ethical considerations\n6. Records\nRecords may include:\n6.1 Labeling of work (number, title, medium, year produced)\n6.2 Register of all stored and finished work, e.g. date and usage of\nphotographic material\n6.3 List of stored finished work\n6.4 Electronic records, e.g. including image archiving software\n6.5 Slide library\n6.6 Model release\n6.7 Permits, contracts containing conditional usage requirements\n\n--- PDF PAGE 45 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Assessed finished work for storage\n1.2 Stored finished work\n1.3 Maintained stored work\n2. Underpinning\nknowledge and\nattitude\n2.1 Knowledge on archival principles and values\n2.2 Physical properties and capabilities of a range of materials\nsuitable for protection and storage of work (relevant to type of\nwork)\n2.3 Record keeping systems appropriate for storage and retrieval\n2.4 Safe storage requirements for the finished work (relevant to type\nof work)\n2.5 Awareness of copyright, moral rights and intellectual property\nissues for the storage and maintenance of stored work\n2.6 Environmental issues associated with equipment, tools and\nmaterials required for the protection and storage of the finished\nwork (relevant to type of work)\n2.7 Organizational and legislative occupational health and safety\nprocedures in relation to storage and maintenance of finished\nwork\n2.8 Literacy skills sufficient to interpret information related to\nprotection, storage and maintenance of finished work\n2.9 Numeracy skills sufficient to calculate material requirements for\nprotection, storage and maintenance needs for finished work\n3. Underpinning skills\n3.1 Packaging of finished works using appropriate protective\nmaterials\n3.2 Preparing inventory listing of finished work for storage including\nfinished work description or abstract, size, quantity\n3.3 Performing housekeeping of the storage spaces\n3.4 Computing and converting units of measurements, sizes and\nquantities\n3.5 Performing record keeping and monitoring of stored finished\nwork\n3.6 Applying techniques and processes in preparing, storing,\nlabeling, register and maintain finished work\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Workplace: real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Direct observation of the tasks with questioning\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n6. Context of\nassessment\n6.1 Competency elements must be assessed in a safe working\nenvironment and in accordance with the approved industry\nOHS regulations\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to undertake the preparation\nof finished work for storage, protection and maintenance.\n\n--- PDF PAGE 46 ---\nTR- ILLUSTRATION NC II"
