          "source_text": "1. Prepare and maintain \nphysical resources to \nproduce drawings \n \n1.1 Tools and materials required for the production of drawings. \nare identified and selected without error  \n \n1.2 Tools and materials are prepared, cleaned and maintained in \naccordance with relevant workplace procedures and safety \nrequirements. \n \n1.3 Organization and maintenance of work spaces are in \naccordance with relevant workplace procedures and safety \nrequirements so that it remains clean and safe. \n \n1.4 Tools and materials are stored in accordance with relevant \nworkplace procedures and safety requirements. \n2. Use and test drawing \ntechniques  \n2.1 Drawing techniques for the production of drawings are used in \naccordance with relevant workplace procedures and safety \nrequirements. \n \n2.2 Nominated or testing techniques to determine the capability of \nthe technique and its application are used and tested. \n3.  Produce the \ndrawings  \n3.1 Concept for the proposed drawings is determine based on \nown ideas or supplied information. \n \n3.2 Steps and resources required to produce the proposed \ndrawings are identified based on requirements. \n \n3.3 Appropriate tools and materials are selected for the specific \ndrawings. \n \n3.4 Quantities of materials required are calculated without error and \nwastes are minimized where possible. \n \n3.1 Techniques, tools and materials are used in accordance with \nrelevant workplace procedures and safety requirements to \nproduce the final drawings. \n \n3.2 Drawing is produced in accordance to customer requirements\n\n--- PDF PAGE 31 ---\nTR- ILLUSTRATION NC II \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools  \n1.1 Brushes \n1.2 Pencils \n1.3 Eraser \n1.4 Triangles \n1.5 Ruler \n1.6 Digital equipment, software and printer, discs, CDs. \n \n2. Materials \nMaterials for drawing may include: \n2.1 Paper \n2.2 Inks and colors \n2.3 Glue and paste \n \n3. Drawing techniques  \n3.1 Linear marks of differing intensity and character, e.g. thick, \nsharp, thin, curvilinear, soft (side of pencil or crayon) \n3.2 Tonal range to produce illusion of 3D form \n3.3 Linear marks to produce illusion of 3D form \n3.4 Simple linear perspective through the use of a vanishing point \n3.5 Using mixed drawing media and a range of techniques to \nproduce drawings\n4. Testing techniques \nTesting techniques may include: \n4.1 Exploring techniques by making practice pieces \n4.2  Making samples applying nominated techniques \n4.3 Experimenting directly with work in progress.\n5. Organization and \nmaintenance of the \nwork spaces  \nOrganization and maintenance of the work space may relate to: \n5.1 Lighting (natural and artificial) \n5.2 Wet and dry areas \n5.3 Ventilation \n5.4 Work tables, \n5.5 Light tables \n5.6 Ample voltage regulated power supply\n6. Concept for the \nproposed drawings \nThe concept for the proposed drawings may be influenced by: \n6.1 Subject matter or theme for the work, e.g. the body; identity; \nland and place; political, cultural, social issues; spiritual \nconcerns \n6.2 Elements and Principles of Design.\n\n--- PDF PAGE 32 ---\nTR- ILLUSTRATION NC II"
