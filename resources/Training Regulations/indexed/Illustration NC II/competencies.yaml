        "evidence_guide": {
          "source_text": "1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate : \n1.1  Selected work to submit for exhibition \n1.2 Organized selected work for exhibition\n2.  Underpinning \nknowledge  \n2.1   Exhibition, display or presentation contexts relevant to the \narea of work \n2.2 General knowledge about techniques for display or exhibition \nrelevant to the area of work, eg hanging, dismantling \n2.3 General knowledge of ways in which space is planned for \ndisplay or exhibition purposes relevant to area of work \n2.4 General knowledge of the elements and principles of design \nand their specific application to the layout of an exhibition or \ndisplay \n2.5 Awareness of copyright, moral rights and intellectual property \nissues relevant to exhibitions and display \n2.6 Organizational and legislative occupational health and safety \nissues relating to exhibitions and displays of work and their \nsafe hanging/installing and dismantling \n2.7 Literacy skills sufficient to interpret exhibition or display \nrequirements \n     \n3.  Underpinning skills \n3.1  Effective communication skills especially in dealing with other \nartists, event organizers and staff \n3. 2 Ability to select  work for submission which is consistent with \nthe criteria for the exhibition or display \n3.3 Planning and organizing work and materials for exhibition \n3.3  Practice of good time management \n3.5  Ability to handle telephone or face to face inquiries and      \n      conversations regarding work for exhibition\n4.  Resource  \nimplications  \nThe following resources MUST be provided: \n4.1    Telephone, fax machine, internet, etc. \n4.2   Access to the materials, resources and equipment needed to \nprepare work for exhibition and to assist to safely hang and/or \ninstall and dismantle an exhibition or display \n4.3    Work samples for exhibition\n5.  Method of \nassessment \nCompetency MUST be assessed through: \n5.1  Demonstration with questioning \n5.2  Portfolio  \n5.3 Third party report \n6.  Context of \nassessment \n6.1  Assessment may be done in the workplace or in a simulated \nworkplace setting (assessment centers) \n6.2 Assessment activities are carried out through TESDA's    \naccredited assessment center",
