  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in ILLUSTRATION NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmatters concerning working conditions of employment are\ntasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data are recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1\nFace-to-face interactions\n5.2\nTelephone conversation\n5.3\nElectronic and two-way radio communication\n5.4\nWritten communication including electronic mail, memos,\ninstruction and forms\n5.5\nNon-verbal communication including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard format of\nthe organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple written\nnotices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace measures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the workplace\n3.8\nGather and provide information in response to workplace\nrequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview\n5.3\nWritten examination\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\nUNIT CODE\n:\n\n500311106\nUNIT DESCRIPTOR\n:\n\nThis unit covers the skills, knowledge and attitudes to\n\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team’s role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources\n2. Identify own role and\nresponsibility within\nthe team\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are identified\nand recognized\n2.3\nReporting relationships within team and external to team are\nidentified\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute\nto known team activities and objectives\n3.2\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3\nObserved protocols in reporting using standard operating\nprocedures\n3.4\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgement may be\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOccupational health and safety (OHS) and environmental\nstandards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the work\nactivities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated as\nproof of career advancement\n3.3\nLicenses and/or certifications relevant to job and career\nare obtained and renewed\n\n--- PDF PAGE 13 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance appraisal\n1.2\nPsychological profile\n1.3 Aptitude tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing education\n3.2\nServing as resource persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and intangible rewards\n5. Licenses and/or\ncertifications\n5.1\nNational certificates\n5.2\nCertificate of competency\n5.3\nSupport level licenses\n5.4\nProfessional licenses\n\n--- PDF PAGE 14 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra and interpersonal relationship in the course of\nmanaging oneself based on performance evaluation\n1.3 Completed trainings and career opportunities which are based\non the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge and\nattitude\n2.1\nWork values and ethics (code of conduct, code of ethics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio assessment\n5.2\nInterview\n5.3\nSimulation/role-plays\n5.4\nObservation\n5.5\nThird party reports\n5.6\nExams and tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\n\nPROCEDURES\n\nUNIT CODE\n:\n 500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory and organizational requirements for occupational\nhealth and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based\non organization procedures\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold\nlimit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety hazards\nare reported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation\n3. Control hazards and\nrisks\n3.1 Occupational health and safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies\n3.3 Personal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related drills and trainings are participated in\nas per established organization guidelines and procedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean air act\n1.2\nBuilding code\n1.3\nNational electrical and fire safety codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine occupational safety and health standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling designated emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/cardiopulmonary resuscitation (CPR)\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value (TLV)\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\nattitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold limit value (TLV)\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio assessment\n5.2\nInterview\n5.3\nCase study/situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR- ILLUSTRATION NC II\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: DEVELOP AND UPDATE INDUSTRY KNOWLEDGE\n\n UNIT CODE : TRS311201\n\n UNIT DESCRIPTOR : This unit of competency deals with the knowledge, skills and\nattitude required to access, increase and update industry\nknowledge. It includes seek information on the industry and\nupdate industry knowledge\n•\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Seek information on\nthe industry\n1.1 Sources of information on the industry are correctly identified\nand accessed\n1.2 Information to assist effective work performance is obtained\nin line with job requirements\n1.3 Specific information on sector of work is accessed and updated\n1.4 Industry information is correctly applied to day-to-day work\nactivities\n2. Update industry\nknowledge\n2.1 Informal and/or formal research is used to update general\nknowledge of the industry\n2.2 Updated knowledge is shared with customers and colleagues\nas appropriate and incorporated into day-to-day working\nactivities\n\n--- PDF PAGE 19 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nInformation sources may include but are not limited to :\n1.1 media\n1.2 reference books\n1.3 libraries\n1.4 unions\n1.5 industry associations\n1.6 industry journals\n1.7 internet\n1.8 personal observation and experience\n2. Information to assist\neffective work\nperformance\n2.1 different sectors of the industry and the services\navailable in each sector\n2.2 relationship between the industry and other industries\n2.3 industry working conditions\n2.4 legislation that affects the industry\n2.4.1 health and safety\n2.4.2 hygiene\n2.4.3 workers compensation\n2.4.4 consumer protection\n2.4.5 welfare and benefits\n2.5 trade unions, environmental issues and requirements\n2.6 industrial relations issues and major organizations\n2.7 career opportunities within the industry\n2.8 work ethic required to work in the industry and industry\nexpectations of staff\n2.9 quality assurance\n\n--- PDF PAGE 20 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate/ trainee :\n1.1 Knew key sources of information on the industry\n1.2 Updated industry knowledge\n1.3 Accessed and used industry information\n2. Underpinning skills\n2.1 Time management\n2.2 Ready skills needed to access industry information\n2.3 Basic competency skills needed to access the internet\n3. Underpinning\nknowledge\n3.1 Overview of quality assurance in the industry\n3.2 Role of individual staff members\n3.1 Industry information sources\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Sources of information on the industry\n4.2 Industry knowledge\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Interview/questions\n5.2 Practical demonstration\n5.3 Portfolio of industry information related to trainee’s work\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 21 ---\nTR- ILLUSTRATION NC II\n\n UNIT OF COMPETENCY:\nPERFORM COMPUTER OPERATIONS\n\n UNIT CODE\n :\nTRS311203\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes and\n\nvalues needed to perform computer operations which\n\nincludes inputting, accessing, producing and transferring\n\ndata using the appropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be\nundertaken\n1.1 Requirements of task are determined as per standard operating\nprocedures\n1.2 Appropriate hardware and software is selected according to\ntask assigned and required outcome\n1.3 Task is planned to ensure OH & S guidelines and procedures\nare followed\n2. Input data into\ncomputer\n2.1 Data are entered into the computer using appropriate\nprogram/application in accordance with company procedures\n2.2 Accuracy of information is checked and information is saved in\naccordance with standard operating procedures\n2.3 Inputted data are stored in storage media according to\nrequirements\n2.4 Work is performed within ergonomic guidelines\n3. Access information\nusing computer\n3.1 Correct program/application is selected based on job\nrequirements\n3.2 Program/application containing the information required is\naccessed according to company procedures\n3.3 Desktop icons are correctly selected, opened and closed for\nnavigation purposes\n3.4 Keyboard techniques are carried out in line with OH & S\nrequirements for safe use of keyboards\n4. Produce/output data\nusing computer\nsystem\n4.1 Entered data are processed using appropriate software\ncommands\n4.2 Data are printed out as required using computer\nhardware/peripheral devices in accordance with standard\noperating procedures\n4.3 Files and data are transferred between compatible systems\nusing computer software, hardware/ peripheral devices in\naccordance with standard operating procedures\n5. Maintain computer\nequipment and\nsystems\n5.1 Systems for cleaning, minor maintenance and replacement of\nconsumables are implemented\n5.2 Procedures for ensuring security of data, including regular\nback-ups and virus checks are implemented in accordance with\nstandard operating procedures\n5.3 Basic file maintenance procedures are implemented in line with\nthe standard operating procedures\n\n--- PDF PAGE 22 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n2. Software\nSoftware includes the following but not limited to:\n2.1 Word processing packages\n2.2 Data base packages\n2.3 Internet\n2.4 Spreadsheets\n3. OH & S guidelines\n3.1 OHS guidelines\n3.2 Enterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1 diskettes\n4.2 CDs\n4.3 zip disks\n4.4 hard disk drives, local and remote\n5. Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5 Visual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1 directories/folders\n6.2 files\n6.3 network devices\n6.4 recycle bin\n7. Maintenance\n7.1 Creating more space in the hard disk\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7 Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 23 ---\nTR- ILLUSTRATION NC II\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidences that the candidate:\n1.1 Selected and used hardware components correctly and\naccording to the task requirement\n1.2 Identified and explain the functions of both hardware and\nsoftware used, their general features and capabilities\n1.3 Produced accurate and complete data in accordance with the\nrequirements\n1.4 Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5 Maintained computer system\n2. Underpinning\n knowledge\n2.1 Basic ergonomics of keyboard and computer use\n2.2 Main types of computers and basic features of different\noperating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n3. Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Computer hardware with peripherals\n4.2 Appropriate software\n5. Method of\nassessment\nCompetency MUST be assessed through:\n4.1 Observation\n4.2 Questioning\n4.3 Practical demonstration\n6. Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 24 ---\nTR- ILLUSTRATION NC II\n\nUNIT TITLE\n:\nDEVELOP SELF AS ARTIST\n\nUNIT CODE\n:\n VSA313201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nexhibit professional practice that describes development of\ntechnical and conceptual skills required to work as a practicing\nartist. It also deals with communicating effectively and working\nstrategically to achieve planned outcomes as an artist.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Acquire and develop\ntechnical skills\n1.1\nStrategies for developing self are identified and planned to\nensure the development of appropriate technical skills\n1.2\nRelevant journals, magazines, catalogues and other media\nare used to stimulate technical and professional development\n1.3\nCapabilities of materials, tools and equipment are tested to\ndevelop technical skills\n1.4\nFeedback, discussion and evaluation opportunities to\ncontinuously improve technical skills are identified and used.\n2. Develop conceptual\nskills and ideas\n2.1\nWork experiences and ideas are discussed with others to\nimprove own practice.\n2.2\nWork of others are studied to stimulate conceptual and\ntechnical skills development\n2.3\nOpportunities to develop skills are identified and have\nparticipated.\n3. Develop own style\n3.1\nNew ideas in making and / or interpreting work are explored\nand experimented.\n3.2\nTechnology, where appropriate to expand own practice is\nexplored and used.\n4. Evaluate own work\n4.1\nConstructive criticism is sought and applied to improve own\nwork\n4.2\nWork is evaluated against planned strategy and in the\ncontext of work of others in order to improve own practice\n4.3\nWork processes and practice are adjusted as necessary to\nimprove technical, conceptual and commercial outcomes.\n5. Research work\nopportunities\n5.1\nNetworks and sources of information relating to work\nopportunities are correctly identified.\n5.2\nPromotional opportunities that may helpful in developing\ncareer opportunities are identified.\n\n--- PDF PAGE 25 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies for\ndeveloping self\n1.1\nWorking effectively with Assessor / Trainor\n1.2\nParticipating in professional development\n1.3\nUndertaking training courses\n1.4\nPracticing\n1.5\nParticipating in relevant groups or associations\n1.6\nExperimenting\n1.7\nCommunicating with peers\n1.8\nBeing involved in a range of relevant art making activities\n2. Technical skills\n2.1\nPainting and drawing\n2.2\nPhotography\n2.3\nSculpture\n2.4\nFiber / textile arts, including paper making / paper casting\n2.5\nCeramics\n2.6\nJewelry\n2.7\nDesigning and making three dimensional objects\n2.8\nVideo\n2.9\nPrintmaking\n2.10 Information Technology, including relevant hardware and\nsoftware\n3. Opportunities to\ndevelop skills\n3.1\nExhibitions\n3.2\nLectures, seminars, conferences, symposiums\n3.3\nFloor talks at galleries\n3.4\nCompetitions\n3.5\nMaster classes\n3.6\nProfessional organizations\n4. Networks and\nsources of\ninformation\n4.1\nNetworks\n4.1.1 Professional associations\n4.1.2 Alumni organizations\n4.1.3 Community organizations\n4.1.4 Collegues and teachers\n4.2\nSources of Information\n4.2.1 Gallery listings\n4.2.2 Job advertisements\n4.2.3 Websites\n4.2.4 Word of mouth\n4.2.5 Art journals\n4.2.6 Exhibition cataloques and program\n5. Promotional\nopportunities\n5.1\nCompetitions\n5.2\nExhibitions\n5.3\nCommunity events\n5.4\nParticipation on websites\n5.5\nMembership of specialization-specific organization\n5.6\nApplications to funding bodies\n\n--- PDF PAGE 26 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nApplied strategies to develop appropriate skills in art practice\n1.2\nUsed discussion and evaluation opportunities to develop\ntechnical and conceptual skills\n1.3\nDemonstrated work practice that develops own style through\nexploring and experimenting with new ideas in making and /\nor interpreting work\n2. Underpinning\nknowledge\n\n2.1\nKnowledge about theoretical and historical contexts relevant\nto the area(s) of specialization(s)\n2.2\nElements and principles of design\n2.3\nPhysical properties and capabilities of material, tools and\nequipment and their application\n2.4\nAwareness of copyright, moral rights and intellectual property\nissues related to the development of self as artist\n2.5\nSources of information relating to work opportunities and\ncareer planning\n2.6\nVisual arts and contemporary craft\n3. Underpinning skills\n3.1\nLiteracy skills sufficient to interpret information and\ncommunicate ideas\n3.2\nDiscerning and listening to advice from colleagues, experts\nand audiences\n4. Resource implications\nThe following resources MUST be provided:\n4.1.\nSpecialized materials, tools and equipment required for each\narea of specialization and used to develop technical and\nconceptual skills relevant to art making practice\n4.2.\nInformation about relevant artist, their work, ideas and\ntechniques\n5. Method of\nassessment\n\nCompetency must be assessed through:\n5.1\nObservation / Demonstration with oral questioning\n5.2\nPortfolio\n5.3\nThird party report\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 27 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY: SELECT AND PREPARE WORK FOR EXHIBITION\n\nUNIT CODE\n\n: VSA313202\n\nUNIT DESCRIPTOR : This unit describes the skills and knowledge required to select and\n\nprepare work for display or exhibition. The skills and knowledge\n\nare not restricted to a particular specialization but apply across all\n\nspecializations depending on the work context.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select work to submit\nfor exhibition\n1.1 Relevant information on the criteria is accessed which informs\nthe selection of work for exhibition\n1.2 information on criteria for display of work is interpreted\n1.3 Issues surrounding criteria with relevant\nindividuals/organizations is identified and clarified\n1.4 Work is selected in accordance with criteria\n2 Organize selected\nwork for exhibition\n2.1 Completeness of work to be displayed is checked and action is\ntaken when required\n2.2 Any specific requirements for display of selected work is\ndetermined and taken action in consultation with relevant\nindividuals or organizations\n2.3 Relevant steps and processes required to prepare selected\nwork for display is identified\n2.4 Work is prepared using appropriate techniques or engage the\nservices of others as required\n2.5 Accurate information on work is provided to relevant\nindividuals/organizations in accordance with requirements\n2.6 Work is submitted to exhibition curator or display organizer within\nagreed timeframe and in accordance with other agreed\nrequirements\n2.7 Assistance for exhibition is provided with installation or\nhanging as required and in accordance with instructions\n\n--- PDF PAGE 28 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Exhibition\nExhibition of work occurs in a variety of contexts, including\n1.1 Studio spaces\n1.2 Local community spaces\n1.3 Web sites\n1.4 Artist run spaces\n1.5 Group exhibition at regional venues\n1.6 Retail display\n1.7 Contribution to an exhibition via submission to a competition\n2. Criteria\nCriteria for selection of work for exhibition may include:\n2.1 Criteria provided by organizer of exhibition\n2.2 Criteria decided by artist, designer or performer\n2.3 Size, dimension, theme, medium, number of pieces\n2.4 Quality of completed work\n2.5 Personal preferences\n2.6 Physical characteristics of display area, eg light, ventilation and\naccess\n3. Completeness\nCompleteness of work may involve\n3.1Tidiness/cleanliness\n3.2 All elements present\n3.3 Touch up requirements satisfied\n3.4 Resolution requirements for web presentation\n4. Requirements for\ndisplay\nRequirements for display may include:\n4.1 Framing\n4.2 Cleaning the work\n4.3 Attaching fixtures for hanging or mounting\n4.4 Selecting and painting plinths\n4.5 The display environment, e.g. light, humidity, temperature,\npower sources\n4.6 Accompanying documentation, e.g. consignment notes, artist's\nstatement\n4.7 Web site information\n5. Assistance for the\nexhibition\nAssistance for the exhibition may involve\n5.1 Planning the exhibition space\n5.2 Planning the location of work within the space\n5.3 Contributing to safely hanging, installing and dismantling work\n5.4 Labeling work\n5.5 Wrapping/storage of works at the conclusion of the display or\nexhibition\n\n--- PDF PAGE 29 ---\nTR- ILLUSTRATION NC II\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate :\n1.1 Selected work to submit for exhibition\n1.2 Organized selected work for exhibition\n2. Underpinning\nknowledge\n2.1 Exhibition, display or presentation contexts relevant to the\narea of work\n2.2 General knowledge about techniques for display or exhibition\nrelevant to the area of work, eg hanging, dismantling\n2.3 General knowledge of ways in which space is planned for\ndisplay or exhibition purposes relevant to area of work\n2.4 General knowledge of the elements and principles of design\nand their specific application to the layout of an exhibition or\ndisplay\n2.5 Awareness of copyright, moral rights and intellectual property\nissues relevant to exhibitions and display\n2.6 Organizational and legislative occupational health and safety\nissues relating to exhibitions and displays of work and their\nsafe hanging/installing and dismantling\n2.7 Literacy skills sufficient to interpret exhibition or display\nrequirements\n\n3. Underpinning skills\n3.1 Effective communication skills especially in dealing with other\nartists, event organizers and staff\n3. 2 Ability to select work for submission which is consistent with\nthe criteria for the exhibition or display\n3.3 Planning and organizing work and materials for exhibition\n3.3 Practice of good time management\n3.5 Ability to handle telephone or face to face inquiries and\n conversations regarding work for exhibition\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Telephone, fax machine, internet, etc.\n4.2 Access to the materials, resources and equipment needed to\nprepare work for exhibition and to assist to safely hang and/or\ninstall and dismantle an exhibition or display\n4.3 Work samples for exhibition\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Demonstration with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 30 ---\nTR- ILLUSTRATION NC II\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\n\nAPPLY TECHNIQUES TO PRODUCE DRAWINGS\n\nUNIT CODE\n:\n\nVSA245301\n\nUNIT DESCRIPTOR\n:\nThis unit describes the skills and knowledge required to use\n\ntechniques, materials and tools for the production of\n\ndrawings. As such the unit covers general knowledge and\n\nthe application of basic techniques\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and maintain\nphysical resources to\nproduce drawings\n\n1.1 Tools and materials required for the production of drawings.\nare identified and selected without error\n\n1.2 Tools and materials are prepared, cleaned and maintained in\naccordance with relevant workplace procedures and safety\nrequirements.\n\n1.3 Organization and maintenance of work spaces are in\naccordance with relevant workplace procedures and safety\nrequirements so that it remains clean and safe.\n\n1.4 Tools and materials are stored in accordance with relevant\nworkplace procedures and safety requirements.\n2. Use and test drawing\ntechniques\n2.1 Drawing techniques for the production of drawings are used in\naccordance with relevant workplace procedures and safety\nrequirements.\n\n2.2 Nominated or testing techniques to determine the capability of\nthe technique and its application are used and tested.\n3. Produce the\ndrawings\n3.1 Concept for the proposed drawings is determine based on\nown ideas or supplied information.\n\n3.2 Steps and resources required to produce the proposed\ndrawings are identified based on requirements.\n\n3.3 Appropriate tools and materials are selected for the specific\ndrawings.\n\n3.4 Quantities of materials required are calculated without error and\nwastes are minimized where possible.\n\n3.1 Techniques, tools and materials are used in accordance with\nrelevant workplace procedures and safety requirements to\nproduce the final drawings.\n\n3.2 Drawing is produced in accordance to customer requirements\n\n--- PDF PAGE 31 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\n1.1 Brushes\n1.2 Pencils\n1.3 Eraser\n1.4 Triangles\n1.5 Ruler\n1.6 Digital equipment, software and printer, discs, CDs.\n\n2. Materials\nMaterials for drawing may include:\n2.1 Paper\n2.2 Inks and colors\n2.3 Glue and paste\n\n3. Drawing techniques\n3.1 Linear marks of differing intensity and character, e.g. thick,\nsharp, thin, curvilinear, soft (side of pencil or crayon)\n3.2 Tonal range to produce illusion of 3D form\n3.3 Linear marks to produce illusion of 3D form\n3.4 Simple linear perspective through the use of a vanishing point\n3.5 Using mixed drawing media and a range of techniques to\nproduce drawings\n4. Testing techniques\nTesting techniques may include:\n4.1 Exploring techniques by making practice pieces\n4.2 Making samples applying nominated techniques\n4.3 Experimenting directly with work in progress.\n5. Organization and\nmaintenance of the\nwork spaces\nOrganization and maintenance of the work space may relate to:\n5.1 Lighting (natural and artificial)\n5.2 Wet and dry areas\n5.3 Ventilation\n5.4 Work tables,\n5.5 Light tables\n5.6 Ample voltage regulated power supply\n6. Concept for the\nproposed drawings\nThe concept for the proposed drawings may be influenced by:\n6.1 Subject matter or theme for the work, e.g. the body; identity;\nland and place; political, cultural, social issues; spiritual\nconcerns\n6.2 Elements and Principles of Design.\n\n--- PDF PAGE 32 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Prepared and maintained physical resources to produce\ndrawings\n1.2 Used and tested drawing techniques\n1.3\nProduced the drawings\n2. Underpinning\nknowledge and\nattitude\n2.1 General knowledge of physical properties and capabilities of the\nmost commonly used materials and tools used in drawings\n2.2 General knowledge of different styles of drawing and the work of\nkey practitioners\n2.3 Overview knowledge of the formal elements and principles of\ndesign\n2.4 Introductory knowledge of the historical and theoretical contexts\nfor drawing\n2.5 Typical work space and tool requirements for the production of\ndifferent types of drawings\n2.6 Cleaning and maintenance techniques for tools used in drawing\n2.7 Awareness of copyright, moral rights and intellectual property\nissues\n2.8 Environmental issues associated with the tools and materials\nused in drawing\n2.9 Organizational and legislative Occupational Health and Safety\nprocedures in relation to drawing\n2.10 Literacy skills sufficient to read product safety labels\n2.11 Numeracy skills sufficient to calculate quantities.\n2.12 Observing proper work process and deadlines\n2.13 Work ethics and courtesy to co-workers\n3. Underpinning skills\n3.1 Use and maintenance of drawing tools and materials\n3.2 Application of different styles of drawings\n3.3 Application of different drawing techniques and testing\nnominated techniques\n3.4 Application of different concept for the proposed drawing\n3.5 Calculating measurements\n3.6 Communicating ideas and information\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace: real or simulated work area\n4.2\nAppropriate tools and equipment\n4.3\nSupplies and materials\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation of drawing in progress\n5.2 Demonstration of skills using required tools, equipment and\nmaterials to produce a minimum of one drawing\n5.3 Portfolio\n5.4 Third Party Workplace Report\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to produce drawings.\n\n--- PDF PAGE 33 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\n\nSOURCE C0NCEPT FOR OWN WORK\n\nUNIT CODE\n:\n\nVSA245302\n\nUNIT DESCRIPTOR\n:\nThis unit describes the skills and knowledge required to\nsource\nand\norganizes\ninformation\nto\nassist\nin\nthe\ndevelopment of the concept for work. The concept\nencompasses ideas, form and context for the work. This unit\ndescribes the articulation of the creative process. In practice,\nthis unit is always integrated with the actual production of\nwork, as described in various specialization units. This work\nwould usually be carried out under supervision\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Source concept\n\n1.1 Information sources are identified and collected relevant to\nideas for the concept\n\n1.2 Organized information are collected in a way which helps the\ndevelopment of the concept\n\n2.Review information\nfor application to own\nwork\n\n2.1 Reviewed information are used to clarify ideas for the concept\n2.2 Select final option for the concept based on information.\n\n--- PDF PAGE 34 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nInformation sources may include:\n1.1 Family stories\n1.2 Oral history\n1.3 Myths and legends, including religious\n1.4 Books, magazines, poems\n1.5 Photographs and other artworks\n1.6 Music and/or film/video\n1.7 Direct observation of the natural or man-made environment\n2. Organized information Organized information may include:\n2.1 written and/or visual diary\n2.2 scrapbook of images\n2.3 file\n3. Reviewed information\nReviewed information may include consideration of:\n3.1 Objective of the work\n3.2 Client requirements\n3.2 cultural and religious sensibility\n3.3 aesthetic appeal\n3.4Industry standards\n\n--- PDF PAGE 35 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Developed concept for work through the process of collecting,\norganizing and reviewing information\n2. Underpinning\nknowledge and\nattitude\n2.1 General knowledge of a limited range of sources of information\nto assist the development of the concept for own work\n2.2 Overview knowledge of the elements and principles of design to\nassist the development of the concept for own work\n2.3 General knowledge about other artists and concept\ndevelopment for their work\n2.4 Introductory knowledge about theoretical and historical contexts\nto assist the development of the concept for own work\n2.5 Awareness of copyright, moral rights and intellectual property\nissues relevant to development of concept for own work\n3. Underpinning skills\n3.1 Interpret simple technical data which assists the development of\nthe concept for own work\n3.2 Literacy skills sufficient to source, organize and review\ninformation to assist the development of the concept for own\nwork\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Workplace: real or simulated work area\n4.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to seek, organize and review\ninformation.\n5. Method of\nassessment\nCompetency MUST be assessed through any or a combination of\nthe following:\n5.1 Demonstration with questioning of skills through the\ndevelopment of a concept for a piece of work\n5.2 Portfolio\n5.3 Third Party Workplace Report\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to produce drawings.\n\n--- PDF PAGE 36 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\nDEVELOP AND ARTICULATE CONCEPT FOR OWN WORK\n\nUNIT CODE\n:\nVSA245303\n\nUNIT DESCRIPTOR\n:\nThis unit describes the skills and knowledge required to\ndevelop and articulate the concept for own work. The concept\nencompasses ideas, form and context for the work. This unit\ndescribes the articulation of the creative process and includes\nthe need to review information to inform concept development\nand have some communication with others about the\ndevelopment process. In practice, this unit is always integrated\nwith the actual production of work, as described in various\nspecialization units. (This unit both encompasses and goes\nbeyond unit -Source concept for own work.)\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Develop concept\n1 1.Relevant information are identified and collected from a range\nof sources\n1.2 Collected information are organize in a way which assists in\nconcept development\n1.3 Collected information are reviewed and selected for possible\nconcepts for work\n1.4 Final concept is selected based on collected information and\nideas and intentions for own work\n2. Articulate concept\n2.1 A way of presenting the concept is chosen, based on nature of\nwork and context for communication\n2.2 Clear information is provide to others about the concept,\nincluding information and ideas used\n2.3 Feedback on concept is sought and reviewed for possible\ninclusion in the concept\n\n--- PDF PAGE 37 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nInformation sources may include:\n1.1 Family stories\n1.2 Oral history\n1.3 Myths and legends (including religious)\n1.4 Books, magazines, poems\n1.5 Photographs and other artworks\n1.6 Music and/or film/video\n1.7Direct observation of the natural or built environment\n2. Information are\norganized\nOrganized information may include:\n2.1 Written and/or visual diary\n2.2 Scrap book of images\n2.3 File (may be digital)\n3. Concept\nThe concept may include:\n3.1 Subject mater or theme for the work, e.g. the body; identity; land\nand place;\n3.2 Political, cultural or social issues; spiritual concerns\n3.3 Elements and principles of design\n3.4 Relationship to a theoretical and historical context\n4. Information are\nreviewed\nReviewed information may include consideration of:\n4.1 Objective of the work\n4.2 Client requirements\n4.3 cultural and religious sensibility\n4.4 aesthetic appeal\n4.5 Industry standards\n4.6Innovativeness\n5. Communication\nA communication method may include any or all:\n5.1 Oral (which may include song)\n5.2 Visual and oral\n5.3 Written and visual\n5.4Written\n6. Context for\ncommunication\nThe context for communication may relate to:\n6.1 People to whom the concept is being presented\n6.2 How the concept is being presented\n6.3 Why the concept is being presented\n6.4 Cultural issues surrounding presentation\n6.5 Physical limitations\n7. Feedback on concept\nare sought and\nreviewed\nReviewing feedback may involve:\n7.1 Making notes\n7.2 Discussion with others\n\n--- PDF PAGE 38 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Develop concept through the process of collecting, organizing\nand reviewing information to select final option for the concept\n1.2 Communicate effectively with others about the development of\nthe concept\n2. Underpinning\nknowledge and\nattitude\n2.1 General knowledge of a range of sources of information to\nassist in the development of the concept for own work\n2.2 General knowledge of suitable communication methods to\npresent the concept for own work\n2.3 Overview knowledge of the elements and principles of design to\nassist in the development of the concept for own work\n2.4 General knowledge about other artists and concept\ndevelopment for their own work\n2.5 Introductory knowledge about theoretical and historical contexts\nto assist in concept development for own work\n2.6 Awareness of copyright, moral rights and intellectual property\nissues to assist in the development of the concept for own work\n2.7 Openness to suggestion and criticisms\n3. Underpinning skills\n3.1 Literacy skills sufficient to source, organize, and review a range\nof information for the development of the concept for own work\n3.2 Use and maintenance of drawing tools and materials\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Workplace: real or simulated work area\n4.2 Access to the materials, resources and equipment needed\nto seek, organize and review information for the development of\nthe concept for own work. It also requires access to appropriate\nresources suitable to present the concept for own work.\n5. Method of\nassessment\nCompetency MUST be assessed through any or a combination of\nthe following:\n5.1 Demonstration of skills through the development and\npresentation of a concept for a piece of work\n5.2 Portfolio with presentation\n5.3 Third Party Workplace Report\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to produce drawings.\n\n--- PDF PAGE 39 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\nUSE DRAWING TECHNIQUES TO REPRESENT OBJECT\nOR IDEA\n\nUNIT CODE\n:\n\nVSA245304\n\nUNIT DESCRIPTOR :\nThis unit describes the skills and knowledge required to\nvisually represent objects or ideas. At this level, drawing\ntechniques would be basic. This is a core unit which\ncomplements all specialization units. It is different from the\ndrawing specialization units which focus on drawing as an\nart form. This work would usually be carried out under\nsupervision.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for drawing\n1.1 Tools and materials required are correctly identified for basic\ndrawing techniques\n1.2 Appropriate tools and materials are selected for basic drawing\ntechniques\n2 Use basic drawing\ntechniques\n2.1 A limited range of techniques are applied to come up with\ninterpretation of objects or ideas\n2.2 Tools and materials are handled and used safely\n\n--- PDF PAGE 40 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and materials\nTools and materials may include:\n1.1 Pencils and/or charcoal\n1.2 pigments, colors and inks\n1.3 a range of papers\n1.4 board\n1.5 measuring tools (ruler, protractor, etc)\n2. Techniques,\nTechniques may include:\n2.1 Linear marks of differing character\n2.2 Tonal ranges to produce illusion of form in space\n2.3 Linear marks to produce illusion of form in space\n2.4 Simple linear perspective\n2.5Application of pigment, colors and/or inks\n3 Objects and ideas\nThe objects and ideas may include:\n3.1 Emotion\n3.2 Company image\n3.3 Story or poem\n3.4 Opinion\n3.5 Communication theme\n3.6Product quality\n\n--- PDF PAGE 41 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Produced more than one drawing which represents the object or\nidea and which shows command of the basic technique/s used\n2. Underpinning\nknowledge and\nattitudes\n2.1 General knowledge of the physical properties and capabilities of\nthe most commonly used materials and tools for drawing\n2.2 General knowledge of different approaches to drawing and the\nwork of other practitioners in relation to using drawing to\nrepresent an object or idea\n2.3 Overview knowledge of the elements and principles of design\n2.4 Awareness of copyright, moral rights and intellectual property\nissues and legislation in environmental and occupational health\nand safety issues associated with the tools and materials used\nin drawing work\n3. Underpinning skills\n3.1 Using drawing tools, equipment and materials\n3.2 Applying different principles of design and elements in drawing\n3.3 Applying different approaches to drawing\n3.4 Communication skills to gather and convey ideas and concept\n3.5 Computing and converting units of measurements for dimension,\nsizes and quantity\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: real or simulated work area\n4.2 Access to the materials and resources needed to apply\nbasic drawing techniques\n5. Method of\nassessment\nCompetency MUST be assessed through any or a combination of\nthe following:\n5.1 Observation with oral questioning before or after the task\n5.2 Demonstration with oral questioning before or after the task\n5.3 Portfolio presentation\n5.4 Third Party Workplace Report\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to produce drawings.\n\n--- PDF PAGE 42 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\nPREPARE, STORE AND MAINTAIN FINISHED WORK\n\nUNIT CODE\n:\n\nVSA245305\n\nUNIT DESCRIPTOR\n:\nThis unit describes the skills and knowledge required to\n\nselect finished work for storage, to assess its needs for\n\nstorage and to protect, store and maintain it.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess finished work\nfor storage\n1.1 Criteria for the selection of finished work to be stored and\nstorage requirements is determined\n1.2 Finished work is assessed and selected based on the identified\ncriteria for their storage\n 1.3 Storage requirement for selected finished work is decided\nbased on the criteria\n2. Store finished work\n2.1 Protective materials and conditions for storage is identified and\nselected\n2.2 Finished work for storage is organized and protective materials\nare applied on finished work.\n2.3 Finished works are stored in allocated or selected storage\nspace following company standard operating procedure and\ncriteria\n3. Maintain stored work\n\n3.1 Accurate and complete records of stored finished work is\nprepared and maintained\n3.2 Condition of finished work in the storage is monitored and\nreviewed in accordance with requirement for different types of\nwork\n\n--- PDF PAGE 43 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Criteria for the\nselection of finished\nwork\nCriteria for finished work may include:\n1.1 Number, quantity, size\n1.2 Quality of work\n1.3 Usefulness in the future\n1.4 Available space\n1.5 Personal affinity to the pieces of work\n1.6 Exemplar potential of the work\n1.7 Archival values\n1.8 Uses of work\n2. Storage requirement\nfor selected finished\nStorage needs based on the condition of the work may include\n\n2.1 Simple repairs prior to storage, e.g. to mounted materials\n2.2 Stabilizing any damage to prevent deterioration in storage\n2.3 Consideration of archival values\n2.4 Deciding on the best form of storage for that work in its condition\n3. Protective materials\n Appropriate protective materials may include those that respond to:\n3.1 Fragility (padding, tissue, bubble wrap, box framing)\n3.2 Characteristics of the materials used in the work (acid free\nwrapping/mount board, water absorbent, reflective,)\n3.3 Form of the artwork (upright, flat)\n3.4 Archival materials\n3.5 Negative sleeves\n3.6 Folders\n3.7 Enclosures\n3.8 CD cases\n4. Selected storage\nspace\nStorage space should enable the safe storage of finished work and\nmay include consideration of:\n4.1 Dampness, humidity\n4.2 Light, fading\n4.3 Archival values\n4.4 Electromagnetic fields\n4.5 Dust\n4.6 Light sensitive characteristics of the images\n4.7 Insect, fungal and molds\n\n--- PDF PAGE 44 ---\nTR- ILLUSTRATION NC II\n\nVARIABLE\nRANGE\n5. Company standard\noperating procedure\nCompany standard operating procedure may include\n5.1 Workplace procedures which may relate to such things as\nsafety, process-specific procedures, use of materials, recycling,\ncost control, reporting\n5.2 Verbal instructions\n5.3 Protocols for the recording and registration of stored work,\nincluding ethical considerations\n6. Records\nRecords may include:\n6.1 Labeling of work (number, title, medium, year produced)\n6.2 Register of all stored and finished work, e.g. date and usage of\nphotographic material\n6.3 List of stored finished work\n6.4 Electronic records, e.g. including image archiving software\n6.5 Slide library\n6.6 Model release\n6.7 Permits, contracts containing conditional usage requirements\n\n--- PDF PAGE 45 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Assessed finished work for storage\n1.2 Stored finished work\n1.3 Maintained stored work\n2. Underpinning\nknowledge and\nattitude\n2.1 Knowledge on archival principles and values\n2.2 Physical properties and capabilities of a range of materials\nsuitable for protection and storage of work (relevant to type of\nwork)\n2.3 Record keeping systems appropriate for storage and retrieval\n2.4 Safe storage requirements for the finished work (relevant to type\nof work)\n2.5 Awareness of copyright, moral rights and intellectual property\nissues for the storage and maintenance of stored work\n2.6 Environmental issues associated with equipment, tools and\nmaterials required for the protection and storage of the finished\nwork (relevant to type of work)\n2.7 Organizational and legislative occupational health and safety\nprocedures in relation to storage and maintenance of finished\nwork\n2.8 Literacy skills sufficient to interpret information related to\nprotection, storage and maintenance of finished work\n2.9 Numeracy skills sufficient to calculate material requirements for\nprotection, storage and maintenance needs for finished work\n3. Underpinning skills\n3.1 Packaging of finished works using appropriate protective\nmaterials\n3.2 Preparing inventory listing of finished work for storage including\nfinished work description or abstract, size, quantity\n3.3 Performing housekeeping of the storage spaces\n3.4 Computing and converting units of measurements, sizes and\nquantities\n3.5 Performing record keeping and monitoring of stored finished\nwork\n3.6 Applying techniques and processes in preparing, storing,\nlabeling, register and maintain finished work\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Workplace: real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Direct observation of the tasks with questioning\n5.2 Interview\n5.3 Portfolio\n5.4 Third Party Report\n6. Context of\nassessment\n6.1 Competency elements must be assessed in a safe working\nenvironment and in accordance with the approved industry\nOHS regulations\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to undertake the preparation\nof finished work for storage, protection and maintenance.\n\n--- PDF PAGE 46 ---\nTR- ILLUSTRATION NC II"
