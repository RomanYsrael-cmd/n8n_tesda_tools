E GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \n1.1 Developed concept for work through the process of collecting,   \norganizing and reviewing information\n2. Underpinning \nknowledge and \nattitude \n2.1 General knowledge of a limited range of sources of information \nto assist the development of the concept for own work \n2.2 Overview knowledge of the elements and principles of design to \nassist the development of the concept for own work \n2.3 General knowledge about other artists and concept \ndevelopment for their work \n2.4 Introductory knowledge about theoretical and historical contexts \nto assist the development of the concept for own work \n2.5 Awareness of copyright, moral rights and intellectual property \nissues relevant to development of concept for own work\n3. Underpinning skills \n3.1 Interpret simple technical data which assists the development of  \nthe concept for own work  \n3.2 Literacy skills sufficient to source, organize and review \ninformation to assist the development of the concept for own \nwork\n4. Resource implications \nThe following resources MUST be provided: \n4.1  Workplace: real or simulated work area \n4.2  Assessment of this unit requires access to the materials, \nresources and equipment needed to seek, organize and review \ninformation.\n5. Method of \nassessment \nCompetency MUST be assessed through any or a combination of \nthe following: \n5.1 Demonstration with questioning  of skills through the \ndevelopment of a concept for a piece of work \n5.2 Portfolio \n5.3 Third Party Workplace Report\n6. Context of \nassessment \n6.1  \nCompetency elements must be assessed on the job or in a \nsimulated environment. \n6.2      Assessment of this unit requires access to the materials, \nresources and equipment needed to produce drawings.\n",
