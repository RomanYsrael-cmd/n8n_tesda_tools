        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Prepared and maintained physical resources to produce\ndrawings\n1.2 Used and tested drawing techniques\n1.3\nProduced the drawings\n2. Underpinning\nknowledge and\nattitude\n2.1 General knowledge of physical properties and capabilities of the\nmost commonly used materials and tools used in drawings\n2.2 General knowledge of different styles of drawing and the work of\nkey practitioners\n2.3 Overview knowledge of the formal elements and principles of\ndesign\n2.4 Introductory knowledge of the historical and theoretical contexts\nfor drawing\n2.5 Typical work space and tool requirements for the production of\ndifferent types of drawings\n2.6 Cleaning and maintenance techniques for tools used in drawing\n2.7 Awareness of copyright, moral rights and intellectual property\nissues\n2.8 Environmental issues associated with the tools and materials\nused in drawing\n2.9 Organizational and legislative Occupational Health and Safety\nprocedures in relation to drawing\n2.10 Literacy skills sufficient to read product safety labels\n2.11 Numeracy skills sufficient to calculate quantities.\n2.12 Observing proper work process and deadlines\n2.13 Work ethics and courtesy to co-workers\n3. Underpinning skills\n3.1 Use and maintenance of drawing tools and materials\n3.2 Application of different styles of drawings\n3.3 Application of different drawing techniques and testing\nnominated techniques\n3.4 Application of different concept for the proposed drawing\n3.5 Calculating measurements\n3.6 Communicating ideas and information\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace: real or simulated work area\n4.2\nAppropriate tools and equipment\n4.3\nSupplies and materials\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation of drawing in progress\n5.2 Demonstration of skills using required tools, equipment and\nmaterials to produce a minimum of one drawing\n5.3 Portfolio\n5.4 Third Party Workplace Report\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to produce drawings.\n\n--- PDF PAGE 33 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\n\nSOURCE C0NCEPT FOR OWN WORK\n\nUNIT CODE\n:"
        },
        "source_text": "VSA245301\n\nUNIT DESCRIPTOR\n:\nThis unit describes the skills and knowledge required to use\n\ntechniques, materials and tools for the production of\n\ndrawings. As such the unit covers general knowledge and\n\nthe application of basic techniques\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and maintain\nphysical resources to\nproduce drawings\n\n1.1 Tools and materials required for the production of drawings.\nare identified and selected without error\n\n1.2 Tools and materials are prepared, cleaned and maintained in\naccordance with relevant workplace procedures and safety\nrequirements.\n\n1.3 Organization and maintenance of work spaces are in\naccordance with relevant workplace procedures and safety\nrequirements so that it remains clean and safe.\n\n1.4 Tools and materials are stored in accordance with relevant\nworkplace procedures and safety requirements.\n2. Use and test drawing\ntechniques\n2.1 Drawing techniques for the production of drawings are used in\naccordance with relevant workplace procedures and safety\nrequirements.\n\n2.2 Nominated or testing techniques to determine the capability of\nthe technique and its application are used and tested.\n3. Produce the\ndrawings\n3.1 Concept for the proposed drawings is determine based on\nown ideas or supplied information.\n\n3.2 Steps and resources required to produce the proposed\ndrawings are identified based on requirements.\n\n3.3 Appropriate tools and materials are selected for the specific\ndrawings.\n\n3.4 Quantities of materials required are calculated without error and\nwastes are minimized where possible.\n\n3.1 Techniques, tools and materials are used in accordance with\nrelevant workplace procedures and safety requirements to\nproduce the final drawings.\n\n3.2 Drawing is produced in accordance to customer requirements\n\n--- PDF PAGE 31 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\n1.1 Brushes\n1.2 Pencils\n1.3 Eraser\n1.4 Triangles\n1.5 Ruler\n1.6 Digital equipment, software and printer, discs, CDs.\n\n2. Materials\nMaterials for drawing may include:\n2.1 Paper\n2.2 Inks and colors\n2.3 Glue and paste\n\n3. Drawing techniques\n3.1 Linear marks of differing intensity and character, e.g. thick,\nsharp, thin, curvilinear, soft (side of pencil or crayon)\n3.2 Tonal range to produce illusion of 3D form\n3.3 Linear marks to produce illusion of 3D form\n3.4 Simple linear perspective through the use of a vanishing point\n3.5 Using mixed drawing media and a range of techniques to\nproduce drawings\n4. Testing techniques\nTesting techniques may include:\n4.1 Exploring techniques by making practice pieces\n4.2 Making samples applying nominated techniques\n4.3 Experimenting directly with work in progress.\n5. Organization and\nmaintenance of the\nwork spaces\nOrganization and maintenance of the work space may relate to:\n5.1 Lighting (natural and artificial)\n5.2 Wet and dry areas\n5.3 Ventilation\n5.4 Work tables,\n5.5 Light tables\n5.6 Ample voltage regulated power supply\n6. Concept for the\nproposed drawings\nThe concept for the proposed drawings may be influenced by:\n6.1 Subject matter or theme for the work, e.g. the body; identity;\nland and place; political, cultural, social issues; spiritual\nconcerns\n6.2 Elements and Principles of Design.\n\n--- PDF PAGE 32 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Prepared and maintained physical resources to produce\ndrawings\n1.2 Used and tested drawing techniques\n1.3\nProduced the drawings\n2. Underpinning\nknowledge and\nattitude\n2.1 General knowledge of physical properties and capabilities of the\nmost commonly used materials and tools used in drawings\n2.2 General knowledge of different styles of drawing and the work of\nkey practitioners\n2.3 Overview knowledge of the formal elements and principles of\ndesign\n2.4 Introductory knowledge of the historical and theoretical contexts\nfor drawing\n2.5 Typical work space and tool requirements for the production of\ndifferent types of drawings\n2.6 Cleaning and maintenance techniques for tools used in drawing\n2.7 Awareness of copyright, moral rights and intellectual property\nissues\n2.8 Environmental issues associated with the tools and materials\nused in drawing\n2.9 Organizational and legislative Occupational Health and Safety\nprocedures in relation to drawing\n2.10 Literacy skills sufficient to read product safety labels\n2.11 Numeracy skills sufficient to calculate quantities.\n2.12 Observing proper work process and deadlines\n2.13 Work ethics and courtesy to co-workers\n3. Underpinning skills\n3.1 Use and maintenance of drawing tools and materials\n3.2 Application of different styles of drawings\n3.3 Application of different drawing techniques and testing\nnominated techniques\n3.4 Application of different concept for the proposed drawing\n3.5 Calculating measurements\n3.6 Communicating ideas and information\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace: real or simulated work area\n4.2\nAppropriate tools and equipment\n4.3\nSupplies and materials\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation of drawing in progress\n5.2 Demonstration of skills using required tools, equipment and\nmaterials to produce a minimum of one drawing\n5.3 Portfolio\n5.4 Third Party Workplace Report\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to produce drawings.\n\n--- PDF PAGE 33 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\n\nSOURCE C0NCEPT FOR OWN WORK\n\nUNIT CODE\n:"
      }
