        "source_text": "VSA245303\n\nUNIT DESCRIPTOR\n:\nThis unit describes the skills and knowledge required to\ndevelop and articulate the concept for own work. The concept\nencompasses ideas, form and context for the work. This unit\ndescribes the articulation of the creative process and includes\nthe need to review information to inform concept development\nand have some communication with others about the\ndevelopment process. In practice, this unit is always integrated\nwith the actual production of work, as described in various\nspecialization units. (This unit both encompasses and goes\nbeyond unit -Source concept for own work.)\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Develop concept\n1 1.Relevant information are identified and collected from a range\nof sources\n1.2 Collected information are organize in a way which assists in\nconcept development\n1.3 Collected information are reviewed and selected for possible\nconcepts for work\n1.4 Final concept is selected based on collected information and\nideas and intentions for own work\n2. Articulate concept\n2.1 A way of presenting the concept is chosen, based on nature of\nwork and context for communication\n2.2 Clear information is provide to others about the concept,\nincluding information and ideas used\n2.3 Feedback on concept is sought and reviewed for possible\ninclusion in the concept\n\n--- PDF PAGE 37 ---\nTR- ILLUSTRATION NC II\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nInformation sources may include:\n1.1 Family stories\n1.2 Oral history\n1.3 Myths and legends (including religious)\n1.4 Books, magazines, poems\n1.5 Photographs and other artworks\n1.6 Music and/or film/video\n1.7Direct observation of the natural or built environment\n2. Information are\norganized\nOrganized information may include:\n2.1 Written and/or visual diary\n2.2 Scrap book of images\n2.3 File (may be digital)\n3. Concept\nThe concept may include:\n3.1 Subject mater or theme for the work, e.g. the body; identity; land\nand place;\n3.2 Political, cultural or social issues; spiritual concerns\n3.3 Elements and principles of design\n3.4 Relationship to a theoretical and historical context\n4. Information are\nreviewed\nReviewed information may include consideration of:\n4.1 Objective of the work\n4.2 Client requirements\n4.3 cultural and religious sensibility\n4.4 aesthetic appeal\n4.5 Industry standards\n4.6Innovativeness\n5. Communication\nA communication method may include any or all:\n5.1 Oral (which may include song)\n5.2 Visual and oral\n5.3 Written and visual\n5.4Written\n6. Context for\ncommunication\nThe context for communication may relate to:\n6.1 People to whom the concept is being presented\n6.2 How the concept is being presented\n6.3 Why the concept is being presented\n6.4 Cultural issues surrounding presentation\n6.5 Physical limitations\n7. Feedback on concept\nare sought and\nreviewed\nReviewing feedback may involve:\n7.1 Making notes\n7.2 Discussion with others\n\n--- PDF PAGE 38 ---\nTR- ILLUSTRATION NC II\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Develop concept through the process of collecting, organizing\nand reviewing information to select final option for the concept\n1.2 Communicate effectively with others about the development of\nthe concept\n2. Underpinning\nknowledge and\nattitude\n2.1 General knowledge of a range of sources of information to\nassist in the development of the concept for own work\n2.2 General knowledge of suitable communication methods to\npresent the concept for own work\n2.3 Overview knowledge of the elements and principles of design to\nassist in the development of the concept for own work\n2.4 General knowledge about other artists and concept\ndevelopment for their own work\n2.5 Introductory knowledge about theoretical and historical contexts\nto assist in concept development for own work\n2.6 Awareness of copyright, moral rights and intellectual property\nissues to assist in the development of the concept for own work\n2.7 Openness to suggestion and criticisms\n3. Underpinning skills\n3.1 Literacy skills sufficient to source, organize, and review a range\nof information for the development of the concept for own work\n3.2 Use and maintenance of drawing tools and materials\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Workplace: real or simulated work area\n4.2 Access to the materials, resources and equipment needed\nto seek, organize and review information for the development of\nthe concept for own work. It also requires access to appropriate\nresources suitable to present the concept for own work.\n5. Method of\nassessment\nCompetency MUST be assessed through any or a combination of\nthe following:\n5.1 Demonstration of skills through the development and\npresentation of a concept for a piece of work\n5.2 Portfolio with presentation\n5.3 Third Party Workplace Report\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment.\n6.2 Assessment of this unit requires access to the materials,\nresources and equipment needed to produce drawings.\n\n--- PDF PAGE 39 ---\nTR- ILLUSTRATION NC II\n\nUNIT OF COMPETENCY :\nUSE DRAWING TECHNIQUES TO REPRESENT OBJECT\nOR IDEA\n\nUNIT CODE\n:"
