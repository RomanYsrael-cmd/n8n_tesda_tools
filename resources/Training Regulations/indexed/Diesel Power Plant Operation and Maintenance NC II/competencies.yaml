        "source_title": "TEND DIESEL ENGINE",
        "source_text": "--- PDF PAGE 33 ---\nTR – Diesel Power Plant Operation and Maintenance NC II  \n29\nCORE COMPETENCIES \n \nThis section gives the details of the contents of the core units of competency \nrequired in DIESEL POWER PLANT OPERATION AND MAINTENANCE NC II.  \n \nUNIT OF COMPETENCY :  TEND DIESEL ENGINE \nUNIT CODE  \n   \n:  UTL723206 \nUNIT DESCRIPTOR: This unit covers the required performance in executing the \npreparation and tending of diesel engine and its auxiliary \nequipment.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform pre-operation \ncheck of diesel engine \nand auxiliary \nequipment \n1.1. \nWalk around check of plant system is performed in \naccordance with enterprise procedure. \n1.2. \nFluid deficiencies are refilled/ topped–up in \naccordance with enterprise procedures \n1.3. \nNon-fluid deficiencies are identified and corrected in \naccordance with enterprise procedures. \n1.4. \nResult of walk around check are recorded and reported \nto shift in charge.  \n2. Perform operation \ncheck \n \n2.1. \nEngine running condition is monitored for normal \noperation based on indicating parameters. \n2.2. \nRoutine check is performed during operation in \naccordance with equipment checklist. \n2.3. \nUnit abnormalities are recorded and reported to shift in \ncharge.  \n3. Perform post-\noperation procedure \n \n3.1. \nShutdown procedure is coordinated with the control \noperator in accordance with enterprise policy. \n3.2. \nEmergency stop push button is engaged in accordance \nwith the operations manual. \n3.3. \nDaily operation is recorded and reported in accordance \nwith the enterprise policy.\n\n--- PDF PAGE 34 ---\nTR – Diesel Power Plant Operation and Maintenance NC II  \n30\nRANGE OF VARIABLES \n1. Walk-around check \nChecking may include the following: \n1.1 Pre-operation: \n1.1.1 \nEmergency stop button initial position \n1.1.2 \nCooling system \n1.1.3 \nFuel system \n1.1.4 \nLube oil system \n1.1.5 \nAspiration system \n1.1.6 \nDC system \n1.1.7 \nSpeed regulating system \n1.1.8 \nCompressed air system \n1.1.9 \nLeaks \n1.1.10 Loose parts connection \n1.1.11 Missing parts \n2. Routine check \nRoutine check may include the following: \n2.1 Temperature and Pressure checking \n2.2 Leaks inspection \n2.3 Fuel level checking \n2.4 Oil level checking \n2.5 Coolant level checking \n2.6 Smoke emission monitoring \n2.7 Abnormal sound, smell and vibration monitoring \n3. Fluid deficiencies \n3.1 Coolant quality and level \n3.2 Impurities in fuel and fuel level \n3.3 Lube oil quality and level \n3.4 Electrolyte level \n4. Non-fluid deficiencies \n4.1 Activated air restriction indicator \n4.2 Incorrect belt tension \n4.3 Clogged fuel/water filter  \n4.4 Dirty fuel/water separator \n4.5 Loose bolts, wiring connection and/or components \n4.6 Leaky components \n \n5. Indicating Parameters \nMay include but not limited to: \n5.1 Temperature \n5.2 Pressure \n \n6. Daily operation \nMay include but not limited to: \n6.1 Computation of fuel consumption \n6.2 Computation of lube oil consumption \n6.3 Consumption of water and inhibitor \n6.4 Records of parameter readings\n\n--- PDF PAGE 35 ---\nTR – Diesel Power Plant Operation and Maintenance NC II  \n31\nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires that the candidate: \n1.1 Conducted walk-around check while the engine is running \nand not running. \n1.2 Performed pre and post operation activities in diesel power \nplant  \n1.3 Recorded power plant operation \n2. Underpinning \nKnowledge \n2.1 Diesel Power Plant Operation \n2.1.1 \nduties and responsibilities \n2.1.2 \npre-operation activities \n2.1.3 \noperation activities \n2.1.4 \npost-operation activities \n2.2 Familiarity with generating set operation with 15kW to 750 \nkW and 1.2 MW \n2.2.1 \nPlant systems \n2.2.2 \nSystem function \n2.2.3 \nSystem flowpath \n2.2.4 \nInterrelationship of plant systems/components \n2.2.5 \nSystem component function, location and description \n2.2.6 \nSystem controls and indications \n2.2.7 \nRequired maintenance \n2.3 Plant Safety procedures and environmental awareness\n3. Underpinning \nSkills \n3.1 Checking of plant systems and components \n3.2 Correcting minor/operational defects in plant systems and \ncomponents \n3.3 Refilling of deficient fluid levels \n3.4 Replacing filters \n3.5 Recording operation activities \n3.6 Monitoring of generating set operation \n3.7 Cleaning and replacing battery terminals \n3.8 Using hand tools and test instruments\n4. Resource \nImplications \n4.1 Diesel generating set \n4.2 PPE \n4.3 Mechanical/electrical tools and test instruments \n4.4 Coolant, diesel fuel, lube oil and cleaning materials \n4.5 Diesel Power Plant Operation Manual\n5. Method of \nAssessment \n5.1 Written \n5.2 Direct observation with oral questioning \n5.3 Third party report \n5.4 Portfolio \n5.5 Interview \n5.6 Demonstration with oral questioning\n6. Context of \nAssessment \n6.1 Competency may be assessed on the job or simulated \nenvironment \n6.2 The assessment of practical skills may take place after a \nperiod of supervised practice and repetitive experience\n",
