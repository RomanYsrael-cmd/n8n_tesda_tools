.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 33 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n29\nCORE COMPETENCIES\n\nThis section gives the details of the contents of the core units of competency\nrequired in DIESEL POWER PLANT OPERATION AND MAINTENANCE NC II.\n\nUNIT OF COMPETENCY : TEND DIESEL ENGINE\nUNIT CODE\n\n: UTL723206\nUNIT DESCRIPTOR: This unit covers the required performance in executing the\npreparation and tending of diesel engine and its auxiliary\nequipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform pre-operation\ncheck of diesel engine\nand auxiliary\nequipment\n1.1.\nWalk around check of plant system is performed in\naccordance with enterprise procedure.\n1.2.\nFluid deficiencies are refilled/ topped–up in\naccordance with enterprise procedures\n1.3.\nNon-fluid deficiencies are identified and corrected in\naccordance with enterprise procedures.\n1.4.\nResult of walk around check are recorded and reported\nto shift in charge.\n2. Perform operation\ncheck\n\n2.1.\nEngine running condition is monitored for normal\noperation based on indicating parameters.\n2.2.\nRoutine check is performed during operation in\naccordance with equipment checklist.\n2.3.\nUnit abnormalities are recorded and reported to shift in\ncharge.\n3. Perform post-\noperation procedure\n\n3.1.\nShutdown procedure is coordinated with the control\noperator in accordance with enterprise policy.\n3.2.\nEmergency stop push button is engaged in accordance\nwith the operations manual.\n3.3.\nDaily operation is recorded and reported in accordance\nwith the enterprise policy.\n\n--- PDF PAGE 34 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n30\nRANGE OF VARIABLES\n1. Walk-around check\nChecking may include the following:\n1.1 Pre-operation:\n1.1.1\nEmergency stop button initial position\n1.1.2\nCooling system\n1.1.3\nFuel system\n1.1.4\nLube oil system\n1.1.5\nAspiration system\n1.1.6\nDC system\n1.1.7\nSpeed regulating system\n1.1.8\nCompressed air system\n1.1.9\nLeaks\n1.1.10 Loose parts connection\n1.1.11 Missing parts\n2. Routine check\nRoutine check may include the following:\n2.1 Temperature and Pressure checking\n2.2 Leaks inspection\n2.3 Fuel level checking\n2.4 Oil level checking\n2.5 Coolant level checking\n2.6 Smoke emission monitoring\n2.7 Abnormal sound, smell and vibration monitoring\n3. Fluid deficiencies\n3.1 Coolant quality and level\n3.2 Impurities in fuel and fuel level\n3.3 Lube oil quality and level\n3.4 Electrolyte level\n4. Non-fluid deficiencies\n4.1 Activated air restriction indicator\n4.2 Incorrect belt tension\n4.3 Clogged fuel/water filter\n4.4 Dirty fuel/water separator\n4.5 Loose bolts, wiring connection and/or components\n4.6 Leaky components\n\n5. Indicating Parameters\nMay include but not limited to:\n5.1 Temperature\n5.2 Pressure\n\n6. Daily operation\nMay include but not limited to:\n6.1 Computation of fuel consumption\n6.2 Computation of lube oil consumption\n6.3 Consumption of water and inhibitor\n6.4 Records of parameter readings\n\n--- PDF PAGE 35 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n31\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1 Conducted walk-around check while the engine is running\nand not running.\n1.2 Performed pre and post operation activities in diesel power\nplant\n1.3 Recorded power plant operation\n2. Underpinning\nKnowledge\n2.1 Diesel Power Plant Operation\n2.1.1\nduties and responsibilities\n2.1.2\npre-operation activities\n2.1.3\noperation activities\n2.1.4\npost-operation activities\n2.2 Familiarity with generating set operation with 15kW to 750\nkW and 1.2 MW\n2.2.1\nPlant systems\n2.2.2\nSystem function\n2.2.3\nSystem flowpath\n2.2.4\nInterrelationship of plant systems/components\n2.2.5\nSystem component function, location and description\n2.2.6\nSystem controls and indications\n2.2.7\nRequired maintenance\n2.3 Plant Safety procedures and environmental awareness\n3. Underpinning\nSkills\n3.1 Checking of plant systems and components\n3.2 Correcting minor/operational defects in plant systems and\ncomponents\n3.3 Refilling of deficient fluid levels\n3.4 Replacing filters\n3.5 Recording operation activities\n3.6 Monitoring of generating set operation\n3.7 Cleaning and replacing battery terminals\n3.8 Using hand tools and test instruments\n4. Resource\nImplications\n4.1 Diesel generating set\n4.2 PPE\n4.3 Mechanical/electrical tools and test instruments\n4.4 Coolant, diesel fuel, lube oil and cleaning materials\n4.5 Diesel Power Plant Operation Manual\n5. Method of\nAssessment\n5.1 Written\n5.2 Direct observation with oral questioning\n5.3 Third party report\n5.4 Portfolio\n5.5 Interview\n5.6 Demonstration with oral questioning\n6. Context of\nAssessment\n6.1 Competency may be assessed on the job or simulated\nenvironment\n6.2 The assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 36 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n32\n UNIT OF COMPETENCY : MAINTAIN AND REPAIR DIESEL ENGINE SYSTEMS\nAND ALTERNATOR\nUNIT CODE\n\n: UTL723208\nUNIT DESCRIPTOR: This unit identifies the competence required to maintain and\nservice the diesel engine systems and alternator. This includes\nservicing aspiration system, lube oil system, cooling system, fuel\nsystem as well as performing minor servicing of alternator unit.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Service Aspiration\n(intake and exhaust)\nSystem\n1.1. Turbocharger is maintained based on PMS\n1.2. Cleaning or replacement of air filter is done as indicated\nby air restriction indicator\n1.3. Air filter casing is cleaned and freed of dust or foreign\nparticles as cleaning or replacement of filter occurs.\n\n2. Service Lube Oil\nSystem\n2.1. Oil cooler assembly is uninstalled and installed in\naccordance with the manufacturer’s instruction\n2.2. Oil cooler assembly are disassembled and assembled\nwithout causing damage to the fins, oil cooler tubes and\noil seals (o-rings) and in accordance with manufacturer’s\ninstruction.\n2.3. Oil cooler tubes are cleaned and freed of scale or\nrestrictions.\n2.4. Change oil is performed according to SOP\n3. Service of Cooling\nSystem\n3.1. Cooling System is checked for leaks visually.\n3.2. Radiator is serviced following enterprise policy\n3.3. Thermostat is checked in accordance with its operating\ntemperature.\n3.4. Replace or repair system components based on test\nresult.\n3.5. Coolant is refilled in accordance to the manufacturer’s\ninstruction.\n3.6. Maintain coolant pump in accordance with PMS.\n4. Service Fuel System\n\n4.1. Fuel filter is replaced in accordance with manufacturer’s\ninstruction and PMS.\n4.2. Fuel oil/water separator is drained to ensure that the\nsystem is free from foreign elements.\n4.3. Servicing and calibration of fuel injector is recommended\nin accordance with enterprise policy.\n5. Check condition of\nalternator\n5.1. Loose connections are remedied and restored to normal\nconditions in accordance with manufacturer’s\ninstructions.\n5.2. Insulation and winding resistance are checked in\naccordance with manufacturer’s manual.\n5.3. Revolving diodes and bridge rectifiers are checked in\naccordance with manufacturer’s manual.\n5.4. AVR functionality is tested based on enterprise policy.\n5.5. Air gap clearances are checked in accordance with\nmanufacturer’s manual.\n5.6. Service report is prepared and submitted in accordance\nwith enterprise policy.\n\n--- PDF PAGE 37 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n33\n\nRANGE OF VARIABLES\n\n1. PMS\nPreventive Maintenance schedules can be:\n1.1\n400 RH\n1.2\n1200 RH\n1.3\n2400 RH\n1.4\n4800 RH\n1.5\n9600 RH\n1.6\n20000 RH\n1.7\nother schedules indicated on the manual or enterprise\npolicy\n2. Cooling System\nCooling system may consists of the following:\n2.1\nRadiator Assembly\n2.2\nOil Cooler Assembly\n2.3\nCoolant Pump Assembly\n2.4\nCoolant Rail & Thermostat\n2.5\nWater Jackets\n2.6\nCharged Air Cooler Assembly\n2.7\nCooling Fan\n3. Operating\nTemperature\n3.1\nThe first thermostatic valve opens at 78 – 79 ◦C\n3.2\nThe second thermostatic valve opens at 80 – 84 ◦C\n3.3\nThe third thermostatic valve fully opens at 92 – 98 ◦C\n\n4. Test Result\n4.1\nOperating Temperature of Thermostat\n4.2\nAxial/Radial Test of Coolant Pump Shaft\n4.3\nVisual Leak Test/Hydro Test\n5. Foreign Elements\nMay include but not limited to:\n5.1\nDirt\n5.2\nRust\n5.3\nGrease/Oil\n5.4\nWater\n6. Winding\n6.1\nPotential transformer windings\n6.2\nCurrent transformer windings\n6.3\nMain stator windings\n6.4\nMain rotor windings\n6.5\nExciter-rotor windings\n6.6\nExciter-stator windings\n6.7\nAuxiliary windings\n6.8\nCompounding transformer windings\n7. Air gap clearances\n7.1\nExciter rotor-stator air gap clearance\n7.2\nCompounding transformer air gap clearance\n\n--- PDF PAGE 38 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n34\nEVIDENCE GUIDE\n1. Critical Aspect of\nCompetency\nAssessment requires that the candidate serviced the following\nsystem :\n1.1. Cooling system\n1.2. Lube oil system\n1.3. Fuel system\n1.4. Aspiration\n\n2. Underpinning\nKnowledge\n2.1. Interpreting manufacturers manual & preparations of\nreports\n2.2. Diesel engine components operation\n2.3. Diesel engine systems operation\n2.4. Parts & assembly of diesel engine components\n2.5. Specifications of diesel engine components\n2.6. Safety & environmental procedures related to servicing of\ndiesel engine components\n\n3. Underpinning\nSkills\n3.1. Handling of tools & equipment\n3.2. Handling of precision measuring tools & equipment\n3.3. Taking component measurements\n3.4. Analysis of acquired data\n3.5. Non-destructive testing such as visual inspection and\ndye-penetrant testing\n3.6. Communication skills\n4. Resource\nImplication\n4.1. Mechanical Tools\n4.2. Precision measuring tools\n4.3. Special tools\n4.4. Lubricants & coolant\n4.5. Gaskets & Sealants\n4.6. Dye penetrate, developer & solvent\n4.7. Cleaning tools & materials\n4.8. PPE\n4.9. Diesel engine with complete sub-assemblies\n5. Method of\nAssessment\n5.1. Written\n5.2. Direct Observation w/ oral questioning\n5.3. Third party report\n5.4. Portfolio\n5.5. Interview\n5.6. Demonstration with oral questioning\n6. Context of\nAssessment\n6.1. Competency may be assessed on the job or simulated\nenvironment\n6.2. The assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 39 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n35"
