        "evidence_guide": {
          "source_text": "1. Critical Aspect of\nCompetency\nAssessment requires that the candidate serviced the following\nsystem :\n1.1. Cooling system\n1.2. Lube oil system\n1.3. Fuel system\n1.4. Aspiration\n\n2. Underpinning\nKnowledge\n2.1. Interpreting manufacturers manual & preparations of\nreports\n2.2. Diesel engine components operation\n2.3. Diesel engine systems operation\n2.4. Parts & assembly of diesel engine components\n2.5. Specifications of diesel engine components\n2.6. Safety & environmental procedures related to servicing of\ndiesel engine components\n\n3. Underpinning\nSkills\n3.1. Handling of tools & equipment\n3.2. Handling of precision measuring tools & equipment\n3.3. Taking component measurements\n3.4. Analysis of acquired data\n3.5. Non-destructive testing such as visual inspection and\ndye-penetrant testing\n3.6. Communication skills\n4. Resource\nImplication\n4.1. Mechanical Tools\n4.2. Precision measuring tools\n4.3. Special tools\n4.4. Lubricants & coolant\n4.5. Gaskets & Sealants\n4.6. Dye penetrate, developer & solvent\n4.7. Cleaning tools & materials\n4.8. PPE\n4.9. Diesel engine with complete sub-assemblies\n5. Method of\nAssessment\n5.1. Written\n5.2. Direct Observation w/ oral questioning\n5.3. Third party report\n5.4. Portfolio\n5.5. Interview\n5.6. Demonstration with oral questioning\n6. Context of\nAssessment\n6.1. Competency may be assessed on the job or simulated\nenvironment\n6.2. The assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 39 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n35"
