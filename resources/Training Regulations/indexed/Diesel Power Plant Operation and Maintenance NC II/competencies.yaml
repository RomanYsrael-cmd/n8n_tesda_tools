        "source_text": "UTL723205\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and\nchecking of tools/ equipment and disposal of used\nmaterials are also incorporated in this competency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools cleaning\nrequirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop equipment\n1.1\nTools/equipment are checked and stored in their\nrespective shelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose of waste\nmaterials\n3.1\nContainers for used materials are visibly labeled\n3.2\nWaste materials are disposed as per workshop SOP\n4. Report damaged\ntools/equipment\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared have no error/discrepancy\n\n--- PDF PAGE 25 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Cleaning\nrequirement\n1.1\nCleaning solvent\n1.2\nInventory of supplies, tools, equipment, facilities\n1.3\nList of mechanics/technicians\n1.4\nRags\n1.5\nBroom\n1.6\nMap\n1.7\nPail\n1.8\nDust/waste bin\n\n--- PDF PAGE 26 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n22\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per\nrequired procedure\n2. Underpinning\nknowledge and\nattitudes\n2.1\n5 S or Total Quality Management (TQM)\n2.2\nService procedures\n2.3\nRelevant technical information\n2.4\nSafe handling of Equipment and tools\n2.5\nEquipment safety requirements\n2.6\nWorkshop policies\n2.7\nPersonal safety procedures\n2.8\nFire Extinguishers and prevention\n2.9\nStorage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty,\nPatience, Attention to Details)\n3. Underpinning skills\n3.1\nHandling/Storing of tools/equipment/supplies and\nmaterial\n3.2\nDisposing of wastes and fluid\n3.3\nPreparing inventory of s/m and tools and equipment\n3.4\nMonitoring of supplies/materials and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nWritten/Oral Questioning\n5.2\nDemonstration\nAssessment of underpinning knowledge and practical skills\nmay be combined.\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after\na period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 27 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n23\nUNIT OF COMPETENCY : PERFORM BASIC BENCHWORK\n\nUNIT CODE\n\n:"
