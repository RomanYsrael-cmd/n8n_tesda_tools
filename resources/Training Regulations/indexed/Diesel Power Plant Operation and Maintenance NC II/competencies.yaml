tools and facilities \n1.3 \nDisposed wastes and used lubricants/fluid as per \nrequired  procedure\n2. Underpinning \nknowledge and \nattitudes \n2.1 \n5 S or Total Quality Management (TQM) \n2.2 \nService procedures \n2.3 \nRelevant technical information \n2.4 \nSafe handling of Equipment and tools  \n2.5 \nEquipment safety requirements \n2.6 \nWorkshop policies \n2.7 \nPersonal safety procedures \n2.8 \nFire Extinguishers and prevention \n2.9 \nStorage/Disposal of Hazardous/flammable materials \n2.10 Positive Work Values (Perseverance, Honesty, \nPatience, Attention to Details)\n3. Underpinning skills \n3.1 \nHandling/Storing of tools/equipment/supplies and \nmaterial \n3.2 \nDisposing of wastes and fluid \n3.3 \nPreparing inventory of s/m and tools and equipment \n3.4 \nMonitoring of supplies/materials and tools/equipment \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nWorkplace: Real or simulated work area \n4.2 \nAppropriate Tools & equipment \n4.3\nMaterials relevant to the activity \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nWritten/Oral  Questioning \n5.2 \nDemonstration  \nAssessment of underpinning knowledge and practical skills \nmay be combined.\n6. Context of  \nassessment \n6.1 \nCompetency must be assessed on the job or simulated \nenvironment. \n6.2 \nThe assessment of practical skills must take place after \na period of supervised practice and repetitive \nexperience.\n",
