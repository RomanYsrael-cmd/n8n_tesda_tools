        "source_text": "--- PDF PAGE 27 ---\nTR – Diesel Power Plant Operation and Maintenance NC II  \n23\nUNIT OF COMPETENCY :  PERFORM BASIC BENCHWORK \n \nUNIT CODE  \n   \n:  UTL713202 \n \n \n \n \n \nUNIT DESCRIPTOR:  This unit covers the knowledge, skills and attitudes in preparing \nmaterials, tools and equipment, lay-outing dimensions and \nperforming basic benchwork based on the required performance \nstandards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n \n1.  Prepare materials, \ntools and equipment \n \n \n1.1 Work plan is interpreted to determine job requirements \n1.2 Materials, tools and equipment are identified and \nprepared according to job requirements \n1.3  Materials are checked according to the required \nspecifications \n1.4 Tools and equipment conditions are checked  following \nthe standard operating procedures (SOPs) \n \n2.  Lay-out and mark \ndimensions/features \non workplace  \n \n2.1  Metallic and non-metallic materials are selected \naccording to the requirements specified in the blueprint \n2.2  Dimensions/features are laid-out/marked  according to \njob specifications/blueprint and within the required \ntolerance \n2.3  Dimensions are checked against the actual work  plan \n \n3.  Perform required \nbenchworks \n \n3.1 Work instructions are followed to ensure work safety \n3.2  Benchworks are performed applying  knowledge on \nsafety procedures and according to job requirements \n3.1 Workpieces are clamped in workholding device to avoid \ndamage and accidents \n3.2 Work pieces are cut, chipped or filed according to \nrequired measurements, tolerance specified in the \nblueprint and free from burrs and sharp edges \n3.3 Drilling is performed according to recommended \nsequence and specifications \n3.6  Proper usage of materials, tools and equipment is \nobserved  \n3.7  Appropriate PPE and safety procedures are applied \n3.8  Worksite is cleaned and cleared of all debris and left in \nsafe state in accordance with OHS regulations\n\n--- PDF PAGE 28 ---\nTR – Diesel Power Plant Operation and Maintenance NC II  \n24\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Work plan \n1.1 Job requirements \n1.2 Schedule of work \n \n2.  Materials \n \n \nMay include but not limited to: \n2.1 Steel brackets \n2.2 Grinding disc \n2.3 Drill bit \n \n2.4 Flat/angle bars \n2.5 Fastening screws \n2.6 Masonry \n3.  Tools and equipment \n \n \n \n \n \nMay include but not limited to: \n3.1 Portable grinder \n3.2 Hacksaw \n3.3 File \n3.4 Bench vise \n3.5 Markers \n3.6 Screw drivers \n3.7 Ballpen hammer \n \n3.8 L-square/steel square \n3.9 Steel rule \n3.10 Measuring tools \n3.11 PPE \n3.12 Portable electric drill \n3.13 Bench wire \n3.14 Tri-square \n4.  Metallic materials \nMay include but not limited to: \n4.1 Mild steel plate \n4.2 Flat bar \n4.3 Square bar \n4.4 Angle bar \n4.5 Round bar \n \n \n4.6 G.I. sheet \n4.7 B.I. sheet \n4.8 Beam \n4.9 G.I. and B.I. pipes \n \n5.  Non-metallic \nmaterials \nMay include but not limited to: \n5.1 PVC \n5.2 Rubber \n5.3 Wood \n \n5.4 Fiber glass \n5.5 Plastic \n5.6 Ceramics \n6.  Dimensions \n \n6.1 Measurements \n6.2 Tolerances \n \n7.  Work instructions \n \n \n7.1 Work plan \n7.2 Blueprint \n7.3 Manufacturer’s specifications \n \n8.  Personal Protective \nEquipment (PPE) \n \nMay include but not limited to: \n8.1 Safety shoes \n8.2 Gloves \n8.3 Goggles \n \n 9.  Benchworks \nMay include but not limited to: \n9.1 Cutting \n9.2 Filing \n9.3 Drilling \n \n10.   Workholding device  May include but not limited to: \n10.1 Machine vise \n10.2 Pliers \n10.3 Vise grip \n11.  Manual \nMay include but not limited to: \n11.1 Procedures manual \n11.2 Instructional manual\n\n--- PDF PAGE 29 ---\nTR – Diesel Power Plant Operation and Maintenance NC II  \n25\nEVIDENCE GUIDE \n \n1. Critical aspects of \n      competency \nAssessment requires that the candidate: \n1.1  Interpreted work plan to determine job requirements \n1.2  Identified and prepared supplies, materials, tools and  \nequipment in accordance with job requirements \n1.3  Selected and used appropriate processes, tools and \nequipment to carry out task \n1.4 Laid-out and checked dimensions in accordance with job \nrequirements and within the tolerances \n1.5  Followed work instructions to ensure safety  \n1.6 Performed benchworks in accordance with job requirements \n1.7 Cleaned worksite  and left in safe state in accordance with \nOHSA regulations\n2. Underpinning \nknowledge \n \n \n \n \n \n \n \n2.1  TRADE MATHEMATICS \n Linear measurements \n Dimensions \n Unit conversion \n2.2  TRADE THEORY \n Basic Benchwork \n2.3  SAFETY PRACTICES \n PPE \n Handling of tools, supplies and equipment \n\nGood housekeeping\n3. Underpinning skills\n3.1 Performing basic benchwork \n3.2 Communicating effectively \n3.3 Work safety \n3.4 Preparing materials, tools and equipment \n3.5  Proper handling of tools and equipment\n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace \n4.2 Work plan \n4.3 Materials, tools and equipment relevant to the proposed \nactivity/task\n5. Methods of \nassessment \nCompetency should be assessed through: \n5.1 Actual demonstration \n5.2 Direct observation \n5.3  Written/questioning related to underpinning knowledge\n6. Context of \nassessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group\n",
