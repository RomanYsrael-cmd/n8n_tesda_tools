  "source_section_text": "SECTION 3\nTRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Diesel Power Plant Operation and Maintenance NCII.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DIESEL POWER PLANT OPERATION AND MAINTENANCE\nNC Level : NC II\n\nNominal Training Duration: 262 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of a\ntrainee/student in tending diesel engine operation and maintaining and repairing diesel\nengine.\n\nThis course also includes participating in workplace communication, working in a\nteam environment, practicing career professionalism, practicing occupational health and\nsafety procedures and reading manuals.\n\nBASIC COMPETENCIES\n(56 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n8 hours\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n1. Work in a team\nenvironment\n\n4 hours\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role playing\n2. Practice career\nprofessionalism\n\n4 hours\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work problems\n3.3 Maintain professional growth\nand development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice\noccupational\nhealth and\nsafety\n\n40 hours\n4.1 Identify hazards and risks.\n4.2 Evaluate hazards and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and 