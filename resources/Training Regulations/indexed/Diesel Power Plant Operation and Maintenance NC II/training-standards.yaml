    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: DIESEL POWER PLANT OPERATION AND MAINTENANCE\nNC Level : NC II\n\nNominal Training Duration: 262 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of a\ntrainee/student in tending diesel engine operation and maintaining and repairing diesel\nengine.\n\nThis course also includes participating in workplace communication, working in a\nteam environment, practicing career professionalism, practicing occupational health and\nsafety procedures and reading manuals.\n\nBASIC COMPETENCIES\n(56 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n8 hours\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n1. Work in a team\nenvironment\n\n4 hours\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role playing\n2. Practice career\nprofessionalism\n\n4 hours\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work problems\n3.3 Maintain professional growth\nand development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice\noccupational\nhealth and\nsafety\n\n40 hours\n4.1 Identify hazards and risks.\n4.2 Evaluate hazards and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Group\nDiscussion\n• Plant tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 40 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n36\nCOMMON COMPETENCIES\n(80 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand calculation\n\n1.1 Select measuring\ninstrument and carry out\nmeasurement and\ncalculations\n1.2 Carry out measurement and\ncalculation\n1.3 Maintain measuring\ninstruments\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n2. Read, interpret\nand apply\nspecifications\nand manual\n\n2.1 Identify/access manuals and\ninterpret data and\nspecification\n2.2 Apply information accessed\nin manual\n2.3 Store manual\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n3. Perform shop\nmaintenance\n\n3.1 Inspect/clean tools and work\narea\n3.2 Store/arrange tools and\nshop equipment\n3.3 Dispose waste/used\nlubricants\n3.4 Report damaged\ntools/equipment\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n4. Perform basic\nbench work\n\n4.1.\nPrepare supplies,\nmaterials, tools, and\nequipment\n4.2.\nLayout necessary\ndimensions\n4.3.\nPerform grinding, cutting,\nfiling, drilling and boring\n• Lecture\n• Discussion\n• Demonstration\n\n• Interview\n• Demonstration\n• Direct\nObservation\n5. Perform basic\nelectrical works\n\n5.1.\nTest power supply and\nelectrical components\n5.2.\nPerform basic repairs and\ninstallation\n\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n•Interview\n\n--- PDF PAGE 41 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n37\nCORE COMPETENCIES\n(126 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Tend diesel\nengine\n\n1.1 Perform pre-operation\ncheck of diesel engine and\nauxiliary equipment\n1.2 Tend diesel engine\n• Lecture/\nDiscussion\n• Demonstration\n• Practical\napplication\n• Practicum\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Interview\n2. Maintain and\nrepair diesel\nengine systems\nand 