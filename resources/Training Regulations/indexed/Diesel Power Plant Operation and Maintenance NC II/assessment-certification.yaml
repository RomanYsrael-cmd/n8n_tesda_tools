  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Diesel Power Plant Operation and\nMaintenance NC II, the candidate must demonstrate competence in all the units of\ncompetency listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of Diesel Power Plant Operation\nand Maintenance NC II must acquire Certificate of Competency in all the following\ncore units of the qualification. Candidates may apply for assessment in any\naccredited assessment center.\n\n4.2.1\nTend Diesel Engine\n4.2.2\nMaintain and Repair Diesel Engine Systems and Alternator\n4.2.2.1\nTend Diesel Engine\n4.2.2.2\nMaintain and Repair Diesel Engine Systems and\nAlternator\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQCS)”..\n\n--- PDF PAGE 47 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n43\nANNEX A - COMPETENCY MAP – DIESEL POWER PLANT OPERATION AND\nMAINTENANCE NC II\n\nBASIC COMPETENCIES\n\nReceive and\nRespond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize information\nPlan and Organize\nWork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nApply Appropriate\nSealant/Adhesive\nPerform\nMensuration and\nCalculation\nRead, Interpret and\nApply\nSpecifications and\nManuals\nUse and Apply\nLubricants/Coolants\nPerform Shop\nMaintenance\nPerform Basic\nBench Works\nPerform Basic\nElectrical Works\n\nCORE COMPETENCIES\n\nTender Diesel\nEngine\nOperate Diesel\nPower plant\nService Alternator/\nGenerator\nMaintain and Repair\nDiesel Engine\nSystems and\nAlternator\nDiagnose and Repair\nDiesel Engine\nDiagnose and Repair\nElectrical System\nOverhaul Diesel\nEngine\n\n--- PDF PAGE 48 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n44\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n--- PDF PAGE 49 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n45\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an\nindividual’s skills, knowledge and attitudes gained from life and work experiences\noutside registered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for\nwork\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\nSECTOR SPECIFIC\n\n1. Cooling system\nA closed system of the generator set that provides a continuous\nflow of coolant (soft water with 0-40 ppm hardness) primarily to\nreduce the heat at the cylinder heads and liners. It also reduces\nthe heat from the lubricating oil.\n2. Lube oil system\nA closed system of the generator set that provides a continuous\nflow of lubricating oil that reduces heat and friction to all moving\nparts of the engine.\n\n--- PDF PAGE 50 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n46\n3. Fuel system\nAn open system of the generator set that provides a continuous\nflow of clean, high pressure and atomized fuel to the\ncombustion chamber.\n4. Aspiration system\nAn open system of the generator set that provides clean, high\ndensity compressed air to the combustion chamber by utilizing\nthe exhaust gas to drive the turbocharger.\n5. DC system\nA system of the generator set that supplies 12, 24 or 110 volts\nDC power to the various DC equipment, protections and\ncontrols.\n6. Alternator\nA system of the generator set that converts mechanical energy\ninto electrical energy. It includes the exciter component and\nmain windings.\n7. Speed regulating\nsystem\nA system of the generator set that maintains the rated speed of\nthe engine at various load.\n8. Enterprise policy\nAlso refer as corporate policy\n9. PMS\nrefers as preventive maintenance schedule\n10. coolants\nRefers to the cooling medium of the cooling system which is the\nsoft water with a hardness of 0-40 ppm.\n11. indicating\nparameters\n\nAlso refers to as engine and control panel parameters\n12. SOP\nRefers to the plant system normal operating procedure\n\n--- PDF PAGE 51 ---\nTR – Diesel Power Plant Operation and Maintenance NC II\n47\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL EXPERTS PANEL\n\nFROM NAPOCOR\n\nHILARIO S. AÑO\nPrincipal Engineer C\nPatnanungan DPP\nT