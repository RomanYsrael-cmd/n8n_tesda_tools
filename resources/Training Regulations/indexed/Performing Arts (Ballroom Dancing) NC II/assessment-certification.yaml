  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Performing Arts (Ballroom Dancing) NC II, the\ncandidate must demonstrate competence through project-type assessment covering all the\nunits listed in Section 1. Successful candidates shall be awarded a National Certificate signed\nby the TESDA Director General.\n\n4.2 The qualification of Performing Arts (Ballroom Dancing) NC II may be attained through –\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the following areas:\n\n4.2.1.1 Performing Arts (Ballroom Dance – Modern Standard)\n 4.2.1.1.1 Demonstrate understanding of dance concepts and routines\n\n 4.2.1.1.2 Perform basic modern standard dance figures and amalgamations\n\n4.2.1.2 Performing Arts (Ballroom Dance – Latin American)\n 4.2.1.2.1 Demonstrate understanding of dance concepts and routines\n 4.2.1.2.2 Perform basic modern standard dance figures and amalgamations\n\n Successful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Upon accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the corresponding\nNational Certificate.\n\n4.4 Assessment shall focus on the units of competency. The basic and common units shall be\nintegrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\n\ntraining programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures\nManual on Assessment and Certification” and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS)”.\n\n--- PDF PAGE 43 ---\nTR Ballroom Dancing NC II\n\n39\n\nMaintain\neffective\nrelationships\nwith clients/\ncustomers\nManage\nown\nperformance\nBASI\nC\nCOMPETENCIE\nS\n "
