      "text": "6 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”. --- PDF PAGE 43 --- TR Ballroom Dancing NC II 39 Maintain effective relationships with clients/ customers Manage own performance C S COMPETENCY MAP ‒ HEALTH, SOCIAL (BALLROOM DANCING) NC II Demonstrate work values Practice housekeeping procedures (5S) Participate in workplace communication Work in team environment Practice career professionalism Work with others Develop and practice negotiation skills Use mathematical concepts and techniques Use relevant technologies Solve problems related to work activities Receive and respond to workplace communication Develop teams and individuals Utilize specialized communication skills Practice occupational health and safety procedures Lead workplace communication Collect, analyze and organize information Plan and organize work Apply problem- solving techniques in the workplace Lead small teams Promote environmental protection Perform basic modern standard dance figures and amalgamations Perform basic Latin-American dance figures and amalgamations Demonstrate understanding of dance concepts and routines Demonstrate/ Exhibit stage performance skills Perform solo number Develop basic singing techniques Perform Ballet movements and routines Perform jazz movement Provide lead vocal for a group performance/ band Perform fundamentals of Philippine folk dances Perform in production shows --- PDF PAGE 44 --- TR Ballroom Dancing NC II - 40 FIGURE - A standardized step pattern. AMALGAMATION - A combination of two or more patterns or movements. These are list of fundamental dance figures organized by style, dance and proficiency level to provide a learning framework for the student of dancing. A routine used before doing the Ballroom choreography to attain optimal body temperature, and to prepare physically and mentally for the activity. Warm-ups improve the body's ability to transport oxygen and fuel to active muscles, increase the speed of muscle contraction, and reduce the risk of muscle and joint injuries. Social dance usually performed by couples in dance halls or at social gatherings. During the 20th century these dances came to be performed widely in competitions, which flourished in Britain and America following the First World War. In 1929 the Official Board of Ballroom Dancing was founded and by the 1930s standardization of training and levels of expertise had been established. Today Britain leads the world in ballroom dancing, and the annual Open British Championship is the most important competition. The official name given to the sport of competitive ballroom dancing. Relates to the more athletic form of ballroom dancing as recognized by the Olympic Committee. Includes Waltz, Tango, Quickstep, Foxtrot and Viennese Waltz. These smooth dances are normally danced to Western music (often from the mid-twentieth century), and couples dance counter-clockwise around a rectangular floor following the line of dance. In competitions, competitors are costumed as would be appropriate for a white tie affair, with full gowns for the ladies and bow tie and tail coats for the men. A smooth progressive dance characterized by long, flowing movements, continuous turns, and rise & fall. Graceful and elegant, Waltz dancers glide around the floor almost effortlessly. The Waltz will inspire feelings of love, if only with the dance! Danced to a ¾ time, the Waltz glides gently across the floor. The world renowned Waltz captures romance and marks special occasions for dancers everywhere. Originally an 18th century Austrian folk-dance, the Waltz is one of the five dances of International Ballroom competitions. --- PDF PAGE 45 --- TR Ballroom Dancing NC II - 41 A progressive dance moving along the line of dance using body movement. A staccato movement of the feet and flexed knees highlight the dramatic style of the Tango. The Tango originated in the bordellos of Buenos Aires, Argentina and is done in a slightly different manner to the other dances. The hold is very different, with the lady's arm under the man's, which creates a tighter hold for a quick staccato action and stylized poses. The Foxtrot remains the most popular social dance in the world today. The dance originated in 1913 when a vaudeville performer by the name of Harry Fox performed a little \"trot\" which appealed to the social dance teachers in New York and thus the Foxtrot was born. A smooth progressive dance characterized by graceful, flowing movements across the dance floor. Continuous foot passing actions, heel turns, weaves and Fallaway are staple movements of the Foxtrot. It is a difficult dance to master, for even the most basic patterns are technically demanding. This dance emerged in England in the 1920's, and grew out of the Foxtrot craze. It is a high energy, quick paced and lively dance that incorporates steps from the Charleston (a fad dance of the 1920's), Peabody, and the Foxtrot. The Quickstep will intoxicate you with its joyful rhythms and pulsating speed. The Viennese Waltz is the oldest of all the dances still danced today, and has its origin in 17th Century Germany. It achieved its greatest artistic expression in Vienna in the 1880's. The fast tempo and close embrace stifled its acceptance in the US. The Viennese Waltz and the Slow Waltz are the only dances that use music written in ¾ timing. You'll feel like royalty as you sweepingly cover the floor dancing to such classics as the \"Anniversary Waltz\" and the \"Blue Danube\". Includes Rumba, ChaChaCha, Jive, Samba and Paso Doble. These dances are commonly danced to contemporary Latin American music, and with the exception of a few travelling dances (e.g. Samba and Paso Doble) couples do not follow the line of dance and perform their routines more or less in one spot. In competitions, the women are often dressed in short-skirted Latin outfits while the men outfitted in tight-fitting shirts and pants; the goal being to bring emphasis to the dancers' leg action and body movements. The Rumba provides the setting for sensual and passionate duel between man and woman on the dance floor. With its pulsating and rumbling rhythms, the Rumba is the slow dance of the Latin world and often referred to as the 'Queen' of all Latin dances. The Rumba is one of the five dances used in International competition style Latin American. --- PDF PAGE 46 --- TR Ballroom Dancing NC II - 42 The ChaChaCha is another fun and versatile Latin dance and ranks amongst the five dances competed at international level. The dance draws its name from the rhythm of the feet on the dance floor - 'cha cha cha' - and today's version resembles the original Cuban Cha ChaCha is a rhythmical Latin dance which originated in the 1940's as a modified form of Mambo. Its fun, energetic, sexy and flirtatious, easily distinguished from other dances by its addictive \"Step, Step, ChaChaCha\" rhythm. The Jive is Europe's version of the American Jitterbug. The term \"Jive\" was associated with Cab Calloway's Hepsters Jive Talk and was influencing the music and dancing of the era. During World War II, much of this \"Jive Talk\" crossed the Atlantic and spread throughout England and the rest of Europe. Today, in the U.S., it is taught mostly in the Latin Section of the International Style. It has a rock step first with an exaggerated bounce…add kicks and flicks and you've got one heck of a workout. The exotic cousin of the spirited Caribbean dances, Samba has its own personality, ranging from gutsy and primitive, to zany and fun. Hailing from Brazil with a strong African influence, Samba is both a challenge in its rhythmic patterns and a physical workout. It is often referred to as the \"Brazilian Waltz,\" since the step patterns are developed from the Waltz. Initially, this dance was called the \"Maxixe,\" which was part of the \"Animal Dances\" of the 1920's. This is a theatrical Spanish dance that characterizes the man as the matador and the lady as his cape. Based on Flamenco dancing, the character of the dance is arrogant and passionate. Still danced socially in Spain and Mexico, the Pasodoble had a revival in the US and Europe in the late 1950's, and has now evolved into a mostly competitive dance that incorporates Flamenco movements. --- PDF PAGE 47 --- The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who rendered their time and expertise to the development and validation of these Training Regulations. EXPERTS – BALLROOM DANCING ATTY. CECILIA C. KATIGBAK ARIEL B. LLANILLO Chairperson, Professional Dance Teachers Association of the Philippines (PDTA) President, Professional Dance Teachers Association of the Philippines (PDTA) Dance Vision Studio LOWELL B. TAN Vice-President, Professional Dance Teachers Association of the Philippines (PDTA) Studio 116 Dance Studio Vice President, Internal Professional Dance Teachers Association of the Philippines (PDTA) $88 Dance Studio JOSE LEO P. LINGA FILOMENA C. SALVADOR Secretary, Professional Dance Teachers Association of the Philippines (PDTA) Studio 116 Dance School #116 V.A. Rufino St., Legaspi Village, Makati City Treasurer, Professional Dance Teachers Association of the Philippines (PDTA) Filomena Salvador Dance Academy of the Philippines 4th Floor ACRE Building 137 Malakas St., Diliman, Quezon City BRANDO B. BALMEDINA EVARISTO “JUN” BORJA, JR. PRO, Professional Dance Teachers Association of the Philippines (PDTA) Black Betty Dance Club Member, Professional Dance Teachers Association of the Philippines (PDTA) PDTA Secretariat Members of the TESDA Board The MANAGEMENT and STAFF of the TESDA Secretariat --- PDF PAGE 48 --- List of Published Training Regulations  Animal Production