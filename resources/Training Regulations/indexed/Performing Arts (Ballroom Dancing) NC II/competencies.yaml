        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated fundamental movement vocabulary and skills in\nperforming dance\n1.2 Demonstrated safe physical dance practice\n1.3 Articulated knowledge of dance context\n1.4 Participated in dance in dance in a performance context\n2. Underpinning\nknowledge\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH & S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning skills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFacilities, materials, tools and equipment necessary for the\nactivity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Third Party Report\n5.2 Interview\n5.3 Demonstration with questioning\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 28 ---\nTR Ballroom Dancing NC II\n\n-24-\n\nUNIT OF COMPETENCY :\nPERFORM BASIC MODERN STANDARD DANCE FIGURES AND\nAMALGAMATIONS\nUNIT CODE\n:"
        },
        "source_text": "HCS245301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\ndemonstrating understanding of dance concepts and routines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Demonstrate\nfundamental\nmovement\nvocabulary and skills\nin performing dance\n\n1.1\nVocabulary and movement patterns of a dance form are\nidentified and displayed in a specific form.\n1.2\nThe ability to reproduce movement sequences is\ndemonstrated in response to visual and/or overall instruction.\n1.3 Knowledge of rhythms in relation to dance is demonstrated in\nthe dance presentation.\n2. Demonstrate safe\nphysical dance\npractice\n2.1\nWarm-up is justified in terms of the physiological reasons for\nit.\n2.2\nPhysical warm-up process is demonstrated relevant to the\ndance form.\n2.3 Factors that safeguard health and performance of a dancer\nare evident.\n3. Articulate dance\ncontext\n3.1\nKnowledge of background context of the specific dance form\nis explained.\n3.2\nThe dance form is justified in relation to its original existence.\n3.3\nExplanation articulates current relevance of the dance form.\n\n4. Participate in dance\nin a performance\ncontext\n4.1 Fundamental vocabulary and movement patterns of the dance\nform are presented in dance work.\n4.2 Dance is demonstrated in performance with attention to safe\nphysical dance practice.\n4.3 Dance content is demonstrated with attention to proficient\nextension.\n4.4 Performance of the work is compatible with the stylistic\nfeatures of the dance form.\n4.5 Personal review reflects in participation in dance\nperformance.\n\n--- PDF PAGE 26 ---\nTR Ballroom Dancing NC II\n\n-22-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Rhythms\nMay include but are not limited to:\n1.1 Metered\n1.2 Non-metered\n1.3 Internal rhythms\n2. Dance presentation\nMay include but are not limited to:\n2.1\nAccent\n2.2\nTiming\n2.3\nResponding to sound cues\n3. Factors that\nsafeguard health and\nperformance\nMay include but are not limited to:\n3.1 Correct alignment\n3.2 Personal hygiene\n3.3 Appropriate clothing and footwear\n3.4 Safe environments, including floor and heating\n4. Background context\nMay include but are not limited to:\n4.1\nCultural\n4.2\nSocial\n4.3\nHistorical\n4.4\nPolitical\n4.5 Artistic\n4.6 Spiritual\n4.7 Recreational\n4.8 Geographical\n4.9 Psychological\n5. Dance Content\nMay include but are not limited to:\n5.1 Rhythm\n5.2 Space\n5.3 Energy\n5.4 Purpose\n5.5 Focus\n5.6 Environment\n6. Personal Review\nMay include but are not limited to:\n7.1\nOne of – visual, oral, written, combination\n7.2\nDescription of – contribution, feelings, reflection on\nperformance\n\n--- PDF PAGE 27 ---\nTR Ballroom Dancing NC II\n\n-23-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated fundamental movement vocabulary and skills in\nperforming dance\n1.2 Demonstrated safe physical dance practice\n1.3 Articulated knowledge of dance context\n1.4 Participated in dance in dance in a performance context\n2. Underpinning\nknowledge\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH & S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning skills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFacilities, materials, tools and equipment necessary for the\nactivity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Third Party Report\n5.2 Interview\n5.3 Demonstration with questioning\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 28 ---\nTR Ballroom Dancing NC II\n\n-24-\n\nUNIT OF COMPETENCY :\nPERFORM BASIC MODERN STANDARD DANCE FIGURES AND\nAMALGAMATIONS\nUNIT CODE\n:"
      }
