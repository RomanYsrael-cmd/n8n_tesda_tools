        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed warm-up routine.\n1.3\nPerformed basic modern standard figures and\namalgamations.\n1.4\nMaintained ballroom costumes, shoes, supplies and materials.\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nStandard Modern Dance Performance\n2.2\nTechnique/Musical Interpretation\n2.3\nProper Use and Care of Costumes\n2.4 Music\n2.5\nCode of Ethics\n2.6\nDesirable Attitudes and Attributes\n-\nSafety Consciousness\n-\nIntelligence\n-\nHonesty\n-\nArtistry\n-\nPunctuality\n-\nDiscipline\n-\nAlertness\n\n3. Underpinning skills\n\n3.1\nObserving Code of Ethics\n3.2\nExecuting modern standard figures and amalgamations\n3.3\nDonning the ballroom attire\n3.4\nFollowing instructions\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1\nDance facilities and equipment\n4.2\nOther relevant participants where practical ensemble work is\nbeing assessed\n4.3\nAppropriate venue with adequate space and required\nparaphernalia\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n\n6. Context of\nassessment\n\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n6.2\nAssessment shall be while tasks are undertaken either\nindividually or as part of a team under limited supervision\nindividual.\n6.3\nAssessment is carried out through TESDA and other\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n\n--- PDF PAGE 31 ---\nTR Ballroom Dancing NC II\n\n-27-\nUNIT OF COMPETENCY: PERFORM BASIC LATIN-AMERICAN DANCE FIGURES AND\nAMALGAMATIONS\nUNIT CODE:"
        },
        "source_text": "HCS245302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in performing\nwarm-up exercises and basic modern standard dance figures and\namalgamations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for\nperformance\n\n1.1\nMaterials and appropriate attire for performance routine are\nchecked as per basic modern standard dance procedures.\n1.2\nCompleteness of performance routine is checked as per basic\nmodern standard procedures.\n1.3\nPhysical preparations prior to performance routine are\nchecked as per standard operating procedures.\n1.4\nRecorded rehearsals/performances are reviewed as per\nstandard operating procedures.\n2. Perform basic\nmodern standard\nballroom figures and\namalgamations\n2.1\nAppropriate Ballroom warm-up exercises are performed\nbased on standard techniques.\n2.2 Basic modern standard dance figures and amalgamations\nare performed based on standard techniques.\n4. Maintain ballroom kit,\ncostumes, supplies\nand materials\n4.1\nPrinciples of 5S are applied in the management of costumes,\nshoes, supplies and materials.\n4.2\nCostumes, shoes and supplies are checked one (1) hour\nbefore the performance.\n4.3 Remedial repair of damaged costumes during the\nperformance and the proper reporting after the performance\nare undertaken.\n4.4 Proper SOPs in the care of costumes and supplies are\nfollowed during changes of costumes during the show.\n4.5 Make-up supplies to supplement the basic make-up provided\nare sourced.\n\n--- PDF PAGE 29 ---\nTR Ballroom Dancing NC II\n\n-25-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include but are not limited to:\n1.1 Tapes\n1.2 CDs\n1.3 Manuals\n1.4 Video recording on rehearsals/performances\n2. Warm-up exercises\nMay include but are not limited to:\n2.1 Stretching and loosening exercises\n2.2 Skills and drills exercises\n3. Basic Modern\nStandard Dance\nFigures and\nAmalgamations\nMay include but are not limited to:\n3.1\nWaltz\n3.1.1 Closed Changes\n 3.1.2 Natural Turn\n 3.1.3 Reverse Turn\n 3.1.3 Natural Spin Turn\n 3.1.4 Whisk\n 3.1.5 Chasse’ from Promenade Position\n 3.1.5 Outside Change\n\n3.2\nTango\n3.2.1 Walk\n3.2.2 Progressive Side Step\n3.2.3 Progressive Link\n3.2.4 Closed Promenade\n3.2.5 Natural Rock Turn\n3.2.6 Open Reverse Turn, Lady Outside Closed Finish\n3.2.7 Back Corte’\n\n3.3\nFoxtrot\n3.3.1 Feather Step\n3.3.2 Three Step\n3.3.3 Natural Turn\n3.3.4 Reverse Turn (incorporating Feather Finish)\n3.3.5 Closed Impetus and Feather Finish\n3.3.6 Change of Direction\n\n3.4\nQuickstep\n3.4.1 Quarter Turn to Right\n3.4.2 Natural Turn\n3.4.3 Natural Turn with Hesitation\n3.4.4 Natural Pivot Turn\n3.4.5 Natural Spin Turn\n3.4.6 Progressive Chasse’\n3.4.7 Chasse’ Reverse Turn\n3.4.8 Forward Lock Step\n\n3.5\nViennese Waltz\n3.5.1 Natural Turn\n3.5.2 Reverse Turn\n3.5.3 RF Forward Change Step – Natural to Reverse\n3.5.4 LF Forward Change Step - Reverse to Natural\n\n--- PDF PAGE 30 ---\nTR Ballroom Dancing NC II\n\n-26-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed warm-up routine.\n1.3\nPerformed basic modern standard figures and\namalgamations.\n1.4\nMaintained ballroom costumes, shoes, supplies and materials.\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nStandard Modern Dance Performance\n2.2\nTechnique/Musical Interpretation\n2.3\nProper Use and Care of Costumes\n2.4 Music\n2.5\nCode of Ethics\n2.6\nDesirable Attitudes and Attributes\n-\nSafety Consciousness\n-\nIntelligence\n-\nHonesty\n-\nArtistry\n-\nPunctuality\n-\nDiscipline\n-\nAlertness\n\n3. Underpinning skills\n\n3.1\nObserving Code of Ethics\n3.2\nExecuting modern standard figures and amalgamations\n3.3\nDonning the ballroom attire\n3.4\nFollowing instructions\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1\nDance facilities and equipment\n4.2\nOther relevant participants where practical ensemble work is\nbeing assessed\n4.3\nAppropriate venue with adequate space and required\nparaphernalia\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n\n6. Context of\nassessment\n\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n6.2\nAssessment shall be while tasks are undertaken either\nindividually or as part of a team under limited supervision\nindividual.\n6.3\nAssessment is carried out through TESDA and other\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n\n--- PDF PAGE 31 ---\nTR Ballroom Dancing NC II\n\n-27-\nUNIT OF COMPETENCY: PERFORM BASIC LATIN-AMERICAN DANCE FIGURES AND\nAMALGAMATIONS\nUNIT CODE:"
      },
