        "source_text": "HCS245303\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in performing\nwarm-up exercises and basic Latin-American dance figures and\namalgamations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for\nperformance\n\n1.1\nMaterials and appropriate attire for performance routine are\nchecked as per basic modern standard dance procedures.\n\n1.2 Completeness of performance routine is checked as per basic\n modern standard procedures.\n1.3 Physical preparations prior to performance routine are\nchecked as per standard operating procedures.\n1.4 Recorded rehearsals/performances are reviewed as per\nstandard operating procedures.\n2. Perform basic Latin-\nAmerican dance\nfigures and\namalgamations\n2.1\nAppropriate warm-up exercises are performed based on\nstandard techniques.\n2.2 Basic Latin-American standard dance figures and\namalgamations are performed based on standard\ntechniques.\n3. Maintain ballroom kit,\ncostumes, supplies\nand materials\n3.1 Principles of 5S are applied in the management of costumes,\nshoes, supplies and materials.\n3.2 Costumes, shoes and supplies are checked one (1) hour\nbefore the performance.\n3.3 Remedial repair of damaged costumes during the performance\nand the proper reporting after the performance are undertaken.\n3.4 Proper SOPs in the care of costumes and supplies are\nfollowed during changes of costumes during the show.\n3.5 Make-up supplies to supplement the basic make-up provided\nare sourced.\n\n--- PDF PAGE 32 ---\nTR Ballroom Dancing NC II\n\n-28-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include but are not limited to:\n1.1 Tapes\n1.2 CDs\n1.3 Manuals\n1.4 Video recording on rehearsals/performances\n2. Warm-up exercises\nMay include but are not limited to:\n2.1 Stretching and loosening exercises\n2.2 Skills and drills exercises\n\n3. Basic Latin-American\nfigures and\namalgamations\n3.1 Cha-Cha-Cha\n3.1.1\nBasic Movement\n3.1.2\nFan\n3.1.3\nAlemana\n3.1.4\nHockey Stick\n3.1.5\nThree Cha Cha Cha\n3.1.6\nNatural Top Natural Opening Out Movement\n3.1.7\nClosed Hip Twist\n3.1.8\nHand to Hand\n3.1.9\nSpot Turns\n3.1.10 Time Steps\n3.1.11 New York\n\n3..2\nJive\n3.2.1 Fallaway Rock\n3.2.2 Fallaway Throwaway\n3.2.3 Link Rock and Link\n3.2.4 Change of Places Right to Left\n3.2.5 Change of Places Left to Right\n3.2.6 Change of Hands Behind Back\n3.2.7 American Spin\n3.2.8 The Walks\n3.2.9 The Whip\n\n3.3 Rumba\n3.3.1 Basic Movement\n3.3.2 Fan\n3.3.3 Alemana\n3.3.4 Hockey Stick\n3.3.5 Progressive Walks Forward and Backward\n3.3.6 Natural Top\n3.3.7 Natural Opening Out Movement\n3.3.8 Side Step\n3.3.9 Closed Hip Twist\n3.3.10 Cucarachas\n3.3.11 Hand to Hand\n3.3.12 Spot Turns\n\n--- PDF PAGE 33 ---\nTR Ballroom Dancing NC II\n\n-29-\n\nVARIABLE\nRANGE\n\n3.4 Samba\n3.4.1 Basic Movements\n3.4.2 Progressive Basic Movement\n3.4.3 Outside Basic Movement\n3.4.4 Whisks to Right and Left\n3.4.5 Samba Walks in Promenade Position\n3.4.6 Traveling Bota Fogos\n3.4.7 Bota Fogos to Promenade Position and Counter\n Promenade\n3.4.8 Position\n3.4.9 Reverse Turn\n3.4.10 Corta Jaca\n\n3.5 Paso Doble\n3.5.1 Sur Place\n3.5.2 Basic Movement\n3.5.3 Appel\n3.5.4 Chasses to Right and Left\n3.5.5 Promenade Link\n3.5.6 Deplacement\n3.5.7 Separation\n3.5.8 Fallaway Ending to Separation\n3.5.9 The Huit (Cape)\n3.5.10 Sixteen\n\n--- PDF PAGE 34 ---\nTR Ballroom Dancing NC II\n\n-30-\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed ballroom warm-up exercises.\n1.3\nPerformed basic Latin-American figures and amalgamations.\n1.4\nMaintained ballroom costumes, shoes, supplies and other\nmaterials.\n2. Underpinning\nknowledge\n and attitudes\n2.1\nLatin-American Dance Performance\n2.2\nTechnique/Musical Interpretation\n2.3\nMusic\n2.4\nCode of Ethics\n2.5\nDesirable Attitudes and Attributes\n-\nSafety Consciousness\n- Intelligence\n-\n Honesty\n- Artistry\n-\nPunctuality\n-\nDiscipline\n-\nAlertness\n3. Underpinning skills\n3.1\nObserving Code of Ethics\n3.2\nExecuting latin-american figures and amalgamations\n3.3\nDonning the ballroom attire\n3.4\nFollowing instructions\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nDance Facilities and Equipment\n4.2 Other relevant participants where practical ensemble work is\nbeing assessed\n4.2\nAppropriate venue with adequate space and required\nparaphernalia\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n6.2\nAssessment shall be done while tasks are undertaken either\nindividually or as part of a couple under limited supervision.\n6.3\nAssessment is carried out through TESDA and other\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n\n--- PDF PAGE 35 ---\nTR Ballroom Dancing NC II\n\n-31-"
