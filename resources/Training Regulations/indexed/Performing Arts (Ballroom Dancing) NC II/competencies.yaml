        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed ballroom warm-up exercises.\n1.3\nPerformed basic Latin-American figures and amalgamations.\n1.4\nMaintained ballroom costumes, shoes, supplies and other\nmaterials.\n2. Underpinning\nknowledge\n and attitudes\n2.1\nLatin-American Dance Performance\n2.2\nTechnique/Musical Interpretation\n2.3\nMusic\n2.4\nCode of Ethics\n2.5\nDesirable Attitudes and Attributes\n-\nSafety Consciousness\n- Intelligence\n-\n Honesty\n- Artistry\n-\nPunctuality\n-\nDiscipline\n-\nAlertness\n3. Underpinning skills\n3.1\nObserving Code of Ethics\n3.2\nExecuting latin-american figures and amalgamations\n3.3\nDonning the ballroom attire\n3.4\nFollowing instructions\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nDance Facilities and Equipment\n4.2 Other relevant participants where practical ensemble work is\nbeing assessed\n4.2\nAppropriate venue with adequate space and required\nparaphernalia\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n6.2\nAssessment shall be done while tasks are undertaken either\nindividually or as part of a couple under limited supervision.\n6.3\nAssessment is carried out through TESDA and other\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n\n--- PDF PAGE 35 ---\nTR Ballroom Dancing NC II\n\n-31-"
