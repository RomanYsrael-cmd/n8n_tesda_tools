        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload.\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements.\n1.3\nDemonstrated capacity to complete task within specified time\nframe.\n1.4\nMaintained quality of own performance.\n\n2. Underpinning\nknowledge\n\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n\n3. Underpinning skills\n\n3.1\nCapacity to plan and prioritize work loads and requirements\n3.2\nTime and task management\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9 Assessment Instruments, including personal planner and\nassessment record book\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3\nObservation with questioning\n\n6. Context of\nassessment\n\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit\n6.5\nContinuous assessment in the workplace, taking into account\nthe range of variables affecting performance\n6.6\nSelf-assessment on the same terms as those described\nabove\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria\n\n--- PDF PAGE 25 ---\nTR Ballroom Dancing NC II\n\n-21-\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEMONSTRATE UNDERSTANDING OF DANCE CONCEPTS\nAND ROUTINES\nUNIT CODE\n:"
        },
        "source_text": "HCS245202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\neffectively managing one’s workload and quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever possible.\n1.5\nWork schedules are known and completed within agreed time\nframes.\n1.6\nWork plans developed according to assignment requirements\nand employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility for\ncompletion passed to other appropriate persons.\n2. Maintain quality of\nown performance\n2.1\nPersonal performance continually monitored against agreed\nperformance standards.\n2.2\nAdvice and guidance sought when necessary to achieve or\nmaintain agreed standards.\n2.3\nGuidance from management applied to achieve or maintain\nagreed standards.\n2.4\nStandard of work clarified and agreed according to employer\npolicy and procedures.\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2\nPossible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.3\nClient fully informed of all relevant matters in a timely manner\nand according to agreed reporting procedures.\n\n--- PDF PAGE 23 ---\nTR Ballroom Dancing NC II\n\n-19-\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n1.1\nMay be identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal instructions by senior officer\n1.1.3 Policy documents\n1.1.4 Duty statements\n1.1.5 Self assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1\nAssignment instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 24 ---\nTR Ballroom Dancing NC II\n\n-20-\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload.\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements.\n1.3\nDemonstrated capacity to complete task within specified time\nframe.\n1.4\nMaintained quality of own performance.\n\n2. Underpinning\nknowledge\n\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n\n3. Underpinning skills\n\n3.1\nCapacity to plan and prioritize work loads and requirements\n3.2\nTime and task management\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9 Assessment Instruments, including personal planner and\nassessment record book\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3\nObservation with questioning\n\n6. Context of\nassessment\n\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit\n6.5\nContinuous assessment in the workplace, taking into account\nthe range of variables affecting performance\n6.6\nSelf-assessment on the same terms as those described\nabove\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria\n\n--- PDF PAGE 25 ---\nTR Ballroom Dancing NC II\n\n-21-\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEMONSTRATE UNDERSTANDING OF DANCE CONCEPTS\nAND ROUTINES\nUNIT CODE\n:"
